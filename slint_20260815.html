<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

<script type="application/json" id="D">[{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"very_easy","description":"In `map_key_event`'s / `process_inputs`'s motion-event handling, `MotionAction::Scroll` is mapped to `todo!()`. Any device that reports Android scroll motion events (e.g. a mouse with a scroll wheel, or a precision trackpad connected to an Android device) will hit this arm and crash the whole application with a panic, since `todo!()` unconditionally panics.","fix":"Replace the `todo!()` placeholder with a non-panicking fallback (and optionally implement real scroll dispatch later):\n\n```rust\n// before\nMotionAction::Scroll => todo!(),\n\n// after (minimal safe fix)\nMotionAction::Scroll => InputStatus::Unhandled,\n```\n\nA full fix would translate the scroll axis value from `motion_event` into a `WindowEvent::PointerScrolled` (or equivalent) call, but simply not panicking is the safe minimum.","locations":[{"ref":"internal/backends/android-activity/androidwindowadapter.rs:433","code":"  433 |                         MotionAction::Scroll => todo!(),","lines":1,"link":"https://github.com/slint-ui/slint/blob/fb263fd4b78225112c71c374386fd986b9a54e44/internal/backends/android-activity/androidwindowadapter.rs#L433"}]},{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`AndroidWindowAdapter::update_window_properties` calls `self.resize().unwrap()`. `resize()` returns `Result<(), PlatformError>` and can fail (it propagates the result of `self.window.dispatch_event_with_result(WindowEvent::Resized { .. })?`), whereas every other call site of `resize()` in this file (`process_event`) uses `?` to propagate the error instead of panicking. Because `update_window_properties` is a `WindowAdapter` trait method that returns `()`, a transient dispatch failure here (e.g. toggling fullscreen) will `panic!` and take down the whole app instead of being reported as an error like the other call sites do.","fix":"Log the error instead of panicking, matching how other infallible-signature call sites in this crate use `unwrap_or_else(|e| print_jni_error(...))`-style handling instead of a bare `unwrap()`:\n\n```rust\n// before\nfn update_window_properties(&self, properties: WindowProperties<'_>) {\n    let f = properties.is_fullscreen();\n    if self.fullscreen.replace(f) != f {\n        self.resize().unwrap();\n    }\n}\n\n// after\nfn update_window_properties(&self, properties: WindowProperties<'_>) {\n    let f = properties.is_fullscreen();\n    if self.fullscreen.replace(f) != f\n        && let Err(e) = self.resize()\n    {\n        i_slint_core::debug_log!(\"resize failed: {e:#?}\");\n    }\n}\n```","locations":[{"ref":"internal/backends/android-activity/androidwindowadapter.rs:72-77","code":"   72 |     fn update_window_properties(&self, properties: WindowProperties<'_>) {\n   73 |         let f = properties.is_fullscreen();\n   74 |         if self.fullscreen.replace(f) != f {\n   75 |             self.resize().unwrap();\n   76 |         }\n   77 |     }","lines":6,"link":"https://github.com/slint-ui/slint/blob/fb263fd4b78225112c71c374386fd986b9a54e44/internal/backends/android-activity/androidwindowadapter.rs#L72-L77"}]},{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`Drop for BackendSelector` calls `self.select_internal().unwrap()` when the user built a `BackendSelector` but never called `.select()`. If backend selection fails at that point (e.g. a requested graphics API/backend combination is unavailable, or `SLINT_BACKEND` names an unsupported backend), this `unwrap()` panics inside `drop`. A panic during drop is worse than a panic during normal control flow: if it happens while another panic is already unwinding the stack, the process aborts immediately instead of unwinding normally, and even in the common case it turns a recoverable configuration error into an unrecoverable crash with no chance for the caller to handle it.","fix":"Do not `unwrap()` inside `Drop`; report the failure instead of panicking, e.g.:\n\n```\nimpl Drop for BackendSelector {\n    fn drop(&mut self) {\n        if !self.selected {\n            if let Err(err) = self.select_internal() {\n                eprintln!(\"BackendSelector: implicit select() on drop failed: {err}\");\n            }\n        }\n    }\n}\n```","locations":[{"ref":"internal/backends/selector/api.rs:455-461","code":"  455 | impl Drop for BackendSelector {\n  456 |     fn drop(&mut self) {\n  457 |         if !self.selected {\n  458 |             self.select_internal().unwrap();\n  459 |         }\n  460 |     }\n  461 | }","lines":7,"link":"https://github.com/slint-ui/slint/blob/fb263fd4b78225112c71c374386fd986b9a54e44/internal/backends/selector/api.rs#L455-L461"}]},{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"In `AccessKitAdapter::handle_request`, the `Action::SetValue` branch calls `request.data.unwrap()`, which panics if an accessibility client sends a `SetValue` action request without a `data` payload. Every other branch in the same `match` (`ReplaceSelectedText`, `SetTextSelection`) instead uses `let Some(...) = request.data else { return None }` to gracefully ignore a malformed/incomplete request, so this `unwrap()` is an inconsistent copy-paste that turns a bad AT-client request into an application crash instead of a no-op.","fix":"Match on `request.data` directly instead of unwrapping it, mirroring the other branches:\n\n```rust\nAction::SetValue => match request.data {\n    Some(accesskit::ActionData::Value(v)) => {\n        AccessibilityAction::SetValue(SharedString::from(&*v))\n    }\n    Some(accesskit::ActionData::NumericValue(v)) => {\n        AccessibilityAction::SetValue(i_slint_core::format!(\"{v}\"))\n    }\n    _ => return None,\n},\n```","locations":[{"ref":"internal/backends/winit/accesskit.rs:163-171","code":"  163 |             Action::SetValue => match request.data.unwrap() {\n  164 |                 accesskit::ActionData::Value(v) => {\n  165 |                     AccessibilityAction::SetValue(SharedString::from(&*v))\n  166 |                 }\n  167 |                 accesskit::ActionData::NumericValue(v) => {\n  168 |                     AccessibilityAction::SetValue(i_slint_core::format!(\"{v}\"))\n  169 |                 }\n  170 |                 _ => return None,\n  171 |             },","lines":9,"link":"https://github.com/slint-ui/slint/blob/fb263fd4b78225112c71c374386fd986b9a54e44/internal/backends/winit/accesskit.rs#L163-L171"}]},{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In `main`, `&document.children[0]` is indexed unconditionally as part of the `if let ... && let ...` chain: `document.children[0]` is evaluated before the `Node::CANVAS` pattern match runs, so if the loaded Figma `DOCUMENT`'s `children` vector is empty, this indexing panics with an out-of-bounds error instead of producing the existing, user-friendly `Error` type used elsewhere in the same function (e.g. `Error(\"Start node not found\".into())`).","fix":"Use `.first()` and handle the missing case with the same `Error` type used elsewhere instead of indexing:\n\n```rust\n// before\nif let figmatypes::Node::DOCUMENT(document) = &r.document\n    && let figmatypes::Node::CANVAS { node, prototypeStartNodeID, backgroundColor, .. } =\n        &document.children[0]\n{\n```\n\n```rust\n// after\nif let figmatypes::Node::DOCUMENT(document) = &r.document\n    && let Some(first_child) = document.children.first()\n    && let figmatypes::Node::CANVAS { node, prototypeStartNodeID, backgroundColor, .. } =\n        first_child\n{\n```","locations":[{"ref":"tools/figma_import/src/main.rs:126-129","code":"  126 |     if let figmatypes::Node::DOCUMENT(document) = &r.document\n  127 |         && let figmatypes::Node::CANVAS { node, prototypeStartNodeID, backgroundColor, .. } =\n  128 |             &document.children[0]\n  129 |     {","lines":4,"link":"https://github.com/slint-ui/slint/blob/fb263fd4b78225112c71c374386fd986b9a54e44/tools/figma_import/src/main.rs#L126-L129"}]},{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In `cp_r` in `xtask/src/nodepackage.rs`, `sh.create_dir(dst).unwrap()` panics if directory creation fails (e.g. permission error, disk full), instead of propagating the failure like every other fallible call in this same function (`sh.read_dir(src)?`, `sh.copy_file(src, dst).map_err(|e| e.into())`). The function's signature is `Result<(), Box<dyn std::error::Error>>`, so the error can be propagated cleanly with `?`.","fix":"Replace the `unwrap()` with `?` so the error is returned instead of panicking:\n\n```rust\nif !dst.exists() {\n    sh.create_dir(dst).unwrap();\n} else {\n```\n\nbecomes\n\n```rust\nif !dst.exists() {\n    sh.create_dir(dst)?;\n} else {\n```","locations":[{"ref":"xtask/src/nodepackage.rs:13-23","code":"   13 | fn cp_r(\n   14 |     sh: &Shell,\n   15 |     src: &std::path::Path,\n   16 |     dst: &std::path::Path,\n   17 | ) -> Result<(), Box<dyn std::error::Error>> {\n   18 |     if src.is_dir() {\n   19 |         if !dst.exists() {\n   20 |             sh.create_dir(dst).unwrap();\n   21 |         } else {\n   22 |             assert!(dst.is_dir());\n   23 |         }","lines":11,"link":"https://github.com/slint-ui/slint/blob/fb263fd4b78225112c71c374386fd986b9a54e44/xtask/src/nodepackage.rs#L13-L23"}]},{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"In `tools/figma-inspector/backend/code.ts`, the handler registered with `listenTS(\"generateSnippetRequest\", ...)` calls `node.on(\"nodechange\", () => dispatchTS(\"nodeChanged\", {}))` on `figma.currentPage` every time a `generateSnippetRequest` message is received (e.g. on every selection change from the UI). No corresponding `node.off(...)` is ever called, so each invocation adds another `nodechange` listener on the same page object. Over a session this accumulates unboundedly: `nodeChanged` (and any code it triggers) fires once per accumulated listener, causing increasing duplicate work and event storms. Compare with `figma.on(\"selectionchange\", ...)` a few lines below, which is correctly registered exactly once at module scope.","fix":"Register the `nodechange` listener once, outside the repeatedly-invoked `generateSnippetRequest` handler (e.g. at module scope, like the `selectionchange` listener), or track whether it has already been attached before adding it again:\n\n```ts\n// once, at module scope\nconst pageNode = figma.currentPage;\npageNode.on(\"nodechange\", () => {\n    dispatchTS(\"nodeChanged\", {});\n});\n\nlistenTS(\"generateSnippetRequest\", async (payload) => {\n    const useVariables = payload.useVariables ?? false;\n    // no more node.on(...) registration here\n    ...\n});\n```","locations":[{"ref":"tools/figma-inspector/backend/code.ts:42-49","code":"   42 | listenTS(\"generateSnippetRequest\", async (payload) => {\n   43 |     const useVariables = payload.useVariables ?? false; // <-- You likely already have this\n   44 | \n   45 |     // Listen for node changes as property changes don't trigger a selectionChanged update\n   46 |     const node = figma.currentPage;\n   47 |     node.on(\"nodechange\", () => {\n   48 |         dispatchTS(\"nodeChanged\", {});\n   49 |     });","lines":8,"link":"https://github.com/slint-ui/slint/blob/fb263fd4b78225112c71c374386fd986b9a54e44/tools/figma-inspector/backend/code.ts#L42-L49"}]},{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In `generate_value_conversions` in `internal/compiler/generator/cpp_live_preview.rs`, the loop over `structs_and_enums` uses a `let ... else { return; }` to skip anonymous structs (those without a `StructName::User` name). Because this is a plain `return`, it exits the whole `generate_value_conversions` function instead of just skipping the current loop iteration. As soon as one anonymous struct is encountered, every subsequent struct and enum in `structs_and_enums` is silently skipped, so no `into_slint_value`/`from_slint_value` conversion functions are emitted for them. This produces broken/incomplete C++ live-preview code (missing conversion functions cause compile errors) whenever an anonymous struct appears before other named structs or enums in the list.","fix":"Change the early `return` to `continue` so only the current (anonymous) struct is skipped and the loop keeps processing the rest of `structs_and_enums`:\n\n```rust\nType::Struct(s) if s.node().is_some() => {\n    let StructName::User { name: struct_name, .. } = &s.name else {\n        continue;\n    };\n```","locations":[{"ref":"internal/compiler/generator/cpp_live_preview.rs:499-504","code":"  499 |     for ty in structs_and_enums {\n  500 |         match ty {\n  501 |             Type::Struct(s) if s.node().is_some() => {\n  502 |                 let StructName::User { name: struct_name, .. } = &s.name else {\n  503 |                     return;\n  504 |                 };","lines":6,"link":"https://github.com/slint-ui/slint/blob/fb263fd4b78225112c71c374386fd986b9a54e44/internal/compiler/generator/cpp_live_preview.rs#L499-L504"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `window.initCodeMirror`'s `switch (language.toLowerCase())` in `codemirror.js`, the `\"slint\"` case sets `isReadOnly = false` unconditionally, *before* checking `editorDiv.getAttribute(\"data-readonly\") === \"true\"`. The `data-readonly` check only guards whether the live-preview panel (`previewContainer`) is created via an early `break` — it has no effect on `isReadOnly`, which is later used as `extensions.push(EditorView.editable.of(!isReadOnly))`. As a result, a Slint code block marked `data-readonly=\"true\"` is still fully editable in the browser; only the WASM live preview is suppressed. The `data-readonly` name strongly implies the editor itself should stay read-only.","fix":"Move `isReadOnly = false;` after the early-return check so `data-readonly=\"true\"` actually keeps the editor non-editable:\n\n```js\n// Before\ncase \"slint\":\n    isReadOnly = false;\n    extensions.push(javascript());\n    if (\n        editorDiv.getAttribute(\"data-readonly\") === \"true\" ||\n        editorDiv.getAttribute(\"data-ignore\") === \"true\"\n    ) {\n        break;\n    }\n\n// After\ncase \"slint\":\n    extensions.push(javascript());\n    if (\n        editorDiv.getAttribute(\"data-readonly\") === \"true\" ||\n        editorDiv.getAttribute(\"data-ignore\") === \"true\"\n    ) {\n        break;\n    }\n    isReadOnly = false;\n```","locations":[{"ref":"docs/astro/src/components/editor/codemirror.js:250-258","code":"  250 |         case \"slint\":\n  251 |             isReadOnly = false;\n  252 |             extensions.push(javascript());\n  253 |             if (\n  254 |                 editorDiv.getAttribute(\"data-readonly\") === \"true\" ||\n  255 |                 editorDiv.getAttribute(\"data-ignore\") === \"true\"\n  256 |             ) {\n  257 |                 break;\n  258 |             }","lines":9,"link":"https://github.com/slint-ui/slint/blob/fb263fd4b78225112c71c374386fd986b9a54e44/docs/astro/src/components/editor/codemirror.js#L250-L258"}]},{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `assert_eq_impl` in `slint_tests_helpers.h`, the floating-point comparison branch computes the tolerance as `dEpsilon * std::fabs(a)`, i.e. relative only to `a`. When `a` is `0.0` (or very close to it), the tolerance collapses to (near) zero, so `assert_eq(0.0f, 1e-10f)` fails even though the two values are equal for all practical purposes, defeating the purpose of an approximate float comparison. The check should use the larger magnitude of `a` and `b` (or add a small absolute epsilon) so comparisons near zero are not effectively exact-equality checks.","fix":"Use the larger of the two magnitudes (or add an absolute epsilon term) instead of `std::fabs(a)` alone:\n\n```cpp\n// Before\nnok = std::fabs(a - b) > dEpsilon * std::fabs(a);\n\n// After\nnok = std::fabs(a - b) > dEpsilon * std::max(std::fabs(a), std::fabs(b));\n```","locations":[{"ref":"api/cpp/include/private/slint_tests_helpers.h:93-96","code":"   93 |     } else if constexpr (std::is_floating_point_v<A> && std::is_floating_point_v<B>) {\n   94 |         const double dEpsilon = 0.000001; // or some other small number\n   95 |         nok = std::fabs(a - b) > dEpsilon * std::fabs(a);\n   96 |     } else {","lines":4,"link":"https://github.com/slint-ui/slint/blob/fb263fd4b78225112c71c374386fd986b9a54e44/api/cpp/include/private/slint_tests_helpers.h#L93-L96"}]},{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `NativeTableHeaderSection`'s render code, the sort-indicator arrow is inverted: when the column is sorted\n`ascending` it sets `option.sortIndicator = QStyleOptionHeader::SortDown`, and when `descending` it sets\n`QStyleOptionHeader::SortUp`. Per Qt's `QStyleOptionHeader::SortIndicator` semantics, `SortUp` denotes ascending\norder and `SortDown` denotes descending order, so the two branches are swapped and the header will always draw\nthe wrong sort arrow direction.","fix":"Swap the two enum values so `ascending` maps to `SortUp` and `descending` maps to `SortDown`:\n\n```cpp\nif (ascending) {\n    option.sortIndicator = QStyleOptionHeader::SortUp;\n} else if (descending) {\n    option.sortIndicator = QStyleOptionHeader::SortDown;\n} else {\n    option.sortIndicator = QStyleOptionHeader::None;\n}\n```","locations":[{"ref":"internal/backends/qt/qt_widgets/tableheadersection.rs:155-161","code":"  155 |             if (ascending) {\n  156 |                 option.sortIndicator = QStyleOptionHeader::SortDown;\n  157 |             } else if (descending) {\n  158 |                 option.sortIndicator = QStyleOptionHeader::SortUp;\n  159 |             } else {\n  160 |                 option.sortIndicator = QStyleOptionHeader::None;\n  161 |             }","lines":7,"link":"https://github.com/slint-ui/slint/blob/fb263fd4b78225112c71c374386fd986b9a54e44/internal/backends/qt/qt_widgets/tableheadersection.rs#L155-L161"}]},{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `handle_keyboard_notification`, the `for adapter in windows.into_iter()` loop uses the `?` operator on `adapter.upgrade()?`, `adapter.winit_window()?` and `.window_handle().ok()?` to skip windows that can't be resolved. Since the enclosing function returns `Option<()>`, `?` does not skip just the current window like a `continue` would — it aborts the whole function immediately, silently dropping the keyboard-frame update for every subsequent window in the iterator. The very next line even uses `let ... else { continue; }` for the same purpose, showing the intended behavior was `continue`, not an early return.","fix":"Replace the `?` early-returns inside the loop with `continue` so one unresolved window doesn't stop the rest from being processed:\n\n```rust\nfor adapter in windows.into_iter() {\n    let Some(adapter) = adapter.upgrade() else { continue };\n    let Some(winit_window) = adapter.winit_window() else { continue };\n    let Ok(handle) = winit_window.window_handle() else { continue };\n    let raw_window_handle::RawWindowHandle::UiKit(window_handle) = handle.as_raw() else {\n        continue;\n    };\n    ...\n}\n```","locations":[{"ref":"internal/backends/winit/ios/virtual_keyboard.rs:113-135","code":"  113 |     if name.isEqualToString(unsafe { objc2_ui_kit::UIKeyboardWillChangeFrameNotification }) {\n  114 |         for adapter in windows.into_iter() {\n  115 |             let adapter = adapter.upgrade()?;\n  116 |             let raw_window_handle::RawWindowHandle::UiKit(window_handle) =\n  117 |                 adapter.winit_window()?.window_handle().ok()?.as_raw()\n  118 |             else {\n  119 |                 continue;\n  120 |             };\n  121 |             let view = unsafe { &*(window_handle.ui_view.as_ptr() as *const objc2_ui_kit::UIView) };\n  122 |             let frame_begin = view.convertRect_fromCoordinateSpace(frame_begin, &coordinate_space);\n  123 |             let frame_end = view.convertRect_fromCoordinateSpace(frame_end, &coordinate_space);\n  124 | \n  125 |             // Assumes that the keyboard animation doesn't pass over the window without\n  126 |             // starting or ending while intersecting.\n  127 |             // Although, in this strange edge case we should probably ignore the keyboard anyways.\n  128 |             if rect_intersects(view.bounds(), frame_begin)\n  129 |                 || rect_intersects(view.bounds(), frame_end)\n  130 |             {\n  131 |                 adapter.with_keyboard_curve_sampler(|kcs| {\n  132 |                     kcs.start(animation_duration, curve, frame_begin, frame_end);\n  133 |                 });\n  134 |             }\n  135 |         }","lines":23,"link":"https://github.com/slint-ui/slint/blob/fb263fd4b78225112c71c374386fd986b9a54e44/internal/backends/winit/ios/virtual_keyboard.rs#L113-L135"}]},{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`icon_to_winit` converts a `SharedImageBuffer::RGBA8Premultiplied` buffer into the straight (non-premultiplied) RGBA bytes that `winit::window::Icon::from_rgba` expects, but the per-channel formula multiplies by alpha instead of dividing by it: `(*component as u32 * alpha / 255) as u8`. That is the straight-to-premultiplied direction, not the unpremultiply direction, so every color channel of a translucent icon pixel gets darkened twice (once by the original premultiplication, once again here). The correct unpremultiply formula is used elsewhere in the codebase, in `Image::premultiplied_rgba_to_rgba` (`internal/core/graphics/image.rs`), which does `component * 255 / alpha` (with an `alpha == 0` guard), confirming the direction used in `icon_to_winit` is inverted.","fix":"Divide by `alpha` (scaled to 255) instead of multiplying by it, guarding against `alpha == 0` the same way `Image::premultiplied_rgba_to_rgba` does:\n\n```rust\nSharedImageBuffer::RGBA8Premultiplied(pixels) => pixels\n    .as_bytes()\n    .chunks(4)\n    .flat_map(|rgba| {\n        let alpha = rgba[3] as u32;\n        IntoIterator::into_iter(rgba)\n            .take(3)\n            .map(move |component| {\n                if alpha == 0 { 0 } else { (*component as u32 * 255 / alpha).min(255) as u8 }\n            })\n            .chain(std::iter::once(alpha as u8))\n    })\n    .collect(),\n```\n\nBefore: `(*component as u32 * alpha / 255) as u8` (re-premultiplies). After: `(*component as u32 * 255 / alpha) as u8` guarded for `alpha == 0` (unpremultiplies).","locations":[{"ref":"internal/backends/winit/winitwindowadapter.rs:167-177","code":"  167 |         SharedImageBuffer::RGBA8Premultiplied(pixels) => pixels\n  168 |             .as_bytes()\n  169 |             .chunks(4)\n  170 |             .flat_map(|rgba| {\n  171 |                 let alpha = rgba[3] as u32;\n  172 |                 IntoIterator::into_iter(rgba)\n  173 |                     .take(3)\n  174 |                     .map(move |component| (*component as u32 * alpha / 255) as u8)\n  175 |                     .chain(std::iter::once(alpha as u8))\n  176 |             })\n  177 |             .collect(),","lines":11,"link":"https://github.com/slint-ui/slint/blob/fb263fd4b78225112c71c374386fd986b9a54e44/internal/backends/winit/winitwindowadapter.rs#L167-L177"}]},{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"The `adjust` closure used to remap the cursor/anchor position around an IME composition region is duplicated in two places and was modified inconsistently. In `javahelper.rs`'s `callback_update_text` the correct formula is used: `pos <= preedit_start => pos`, `pos >= preedit_end => preedit_start + (pos - preedit_end)` (i.e. subtract the length of the removed composition text), and `preedit_start` otherwise. In `androidwindowadapter.rs`'s `process_inputs` (the `InputEvent::TextEvent` arm), the equivalent closure instead computes `pos - r.start + r.end` for any `pos > r.start` — which *adds* `r.end` instead of subtracting the composition length, and also collapses the `preedit_start < pos < preedit_end` case into the same (wrong) formula instead of clamping to `r.start`. This produces an incorrect `cursor_position`/`anchor_position` in the `InternalKeyEvent` sent to Slint whenever an IME composition (preedit) is active on the `native-activity` Android backend, misplacing the text cursor/selection during composition.","fix":"Make `androidwindowadapter.rs`'s `adjust` closure match the correct logic already used in `javahelper.rs`:\n\n```rust\n// before (androidwindowadapter.rs)\nlet adjust =\n    |pos| if pos > r.start { pos - r.start + r.end } else { pos } as i32;\n\n// after\nlet adjust = |pos| {\n    if pos <= r.start {\n        pos\n    } else if pos >= r.end {\n        r.start + (pos - r.end)\n    } else {\n        r.start\n    }\n} as i32;\n```","locations":[{"ref":"internal/backends/android-activity/androidwindowadapter.rs:444-446","code":"  444 |                     let event = if let Some(r) = state.compose_region {\n  445 |                         let adjust =\n  446 |                             |pos| if pos > r.start { pos - r.start + r.end } else { pos } as i32;","lines":3,"link":"https://github.com/slint-ui/slint/blob/fb263fd4b78225112c71c374386fd986b9a54e44/internal/backends/android-activity/androidwindowadapter.rs#L444-L446"},{"ref":"internal/backends/android-activity/javahelper.rs:600-609","code":"  600 |             let event = if preedit_start != preedit_end {\n  601 |                 let adjust = |pos| {\n  602 |                     if pos <= preedit_start {\n  603 |                         pos\n  604 |                     } else if pos >= preedit_end {\n  605 |                         preedit_start + (pos - preedit_end)\n  606 |                     } else {\n  607 |                         preedit_start\n  608 |                     }\n  609 |                 } as i32;","lines":10,"link":"https://github.com/slint-ui/slint/blob/fb263fd4b78225112c71c374386fd986b9a54e44/internal/backends/android-activity/javahelper.rs#L600-L609"}]},{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"`set_requested_graphics_api` builds its error with `format!(\"On Android a graphics API for Slint can only be requested after calling slint::android::init()\").into()` even though the format string contains no placeholders and no arguments are passed. This allocates and runs the formatting machinery for a message that is just a static string literal.","fix":"Drop the unnecessary `format!` call:\n\n```rust\n// before\nreturn Err(format!(\"On Android a graphics API for Slint can only be requested after calling slint::android::init()\").into());\n\n// after\nreturn Err(\"On Android a graphics API for Slint can only be requested after calling slint::android::init()\".into());\n```","locations":[{"ref":"internal/backends/android-activity/lib.rs:242","code":"  242 |         return Err(format!(\"On Android a graphics API for Slint can only be requested after calling slint::android::init()\").into());","lines":1,"link":"https://github.com/slint-ui/slint/blob/fb263fd4b78225112c71c374386fd986b9a54e44/internal/backends/android-activity/lib.rs#L242"}]},{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"In `BackendSelector::select_internal` (the `#[cfg(target_os = \"android\")]` variant), three error paths build a `String` via `format!(\"...\")` with no interpolation arguments before converting it `.into()` a `PlatformError`, e.g. `format!(\"Only the android-activity-* backend is supported on Android\").into()`. `PlatformError` already implements `From<&str>` (used elsewhere in the same file, e.g. `\"WGPU 30.x rendering was required...\".into()`), so the `format!` call only adds a needless heap allocation on every invocation of this rarely-hit error path.","fix":"Drop the unnecessary `format!` wrapper and convert the string literal directly, matching the style used elsewhere in the file:\n\n```\n-                format!(\"Only the android-activity-* backend is supported on Android\").into()\n+                \"Only the android-activity-* backend is supported on Android\".into()\n```\n\n```\n-            return Err(format!(\"Only the Skia renderer is supported on Android\").into());\n+            return Err(\"Only the Skia renderer is supported on Android\".into());\n```\n\n```\n-            Err(format!(\n-                \"The BackendSelector is only supported with the backend-android-activity backend\"\n-            )\n-            .into())\n+            Err(\"The BackendSelector is only supported with the backend-android-activity backend\".into())\n```","locations":[{"ref":"internal/backends/selector/api.rs:431-433","code":"  431 |             return Err(\n  432 |                 format!(\"Only the android-activity-* backend is supported on Android\").into()\n  433 |             );","lines":3,"link":"https://github.com/slint-ui/slint/blob/fb263fd4b78225112c71c374386fd986b9a54e44/internal/backends/selector/api.rs#L431-L433"},{"ref":"internal/backends/selector/api.rs:435-436","code":"  435 |         if self.renderer.as_ref().is_some_and(|r| r != \"skia\") {\n  436 |             return Err(format!(\"Only the Skia renderer is supported on Android\").into());","lines":2,"link":"https://github.com/slint-ui/slint/blob/fb263fd4b78225112c71c374386fd986b9a54e44/internal/backends/selector/api.rs#L435-L436"},{"ref":"internal/backends/selector/api.rs:446-450","code":"  446 |         {\n  447 |             Err(format!(\n  448 |                 \"The BackendSelector is only supported with the backend-android-activity backend\"\n  449 |             )\n  450 |             .into())","lines":5,"link":"https://github.com/slint-ui/slint/blob/fb263fd4b78225112c71c374386fd986b9a54e44/internal/backends/selector/api.rs#L446-L450"}]},{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"The `KnownType` union in `utils.ts` lists `\"function\"` as a valid type name, but the `switch (baseType)` in `getTypeInfo()` has no `case \"function\":` branch, so calling `getTypeInfo(\"function\")` always falls through to the `default` branch: it logs `console.error(\"Unknown type: \", \"function\")` and returns a broken `{ href: \"\", defaultValue: \"<???>\" }`. Every other member of `KnownType` has a matching `case`; `\"function\"` is the one exception, so if any `.slint`/doc property is ever annotated with this type, `SlintProperty.astro` (the only caller of `getTypeInfo`) would render a broken link and the literal `<???>` placeholder instead of a proper default value.","fix":"Either add a `case \"function\":` to the switch in `getTypeInfo` (mirroring the pattern of the other cases, using the corresponding `linkMap` entry and a sensible default value once one exists), or remove `\"function\"` from the `KnownType` union if it is not actually a supported property type, so the union and the switch stay in sync.","locations":[{"ref":"docs/common/src/utils/utils.ts:16-41","code":"   16 | export type KnownType =\n   17 |     | \"angle\"\n   18 |     | \"bool\"\n   19 |     | \"brush\"\n   20 |     | \"callback\"\n   2 s` override), and both are only registered inside the outer `if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) { ... }` block in the constructor. So `dispatchInsets` itself can never run on `SDK_INT < R`, making its `else` branch (`sysBars = insets.getInsets(...); cutout = insets.getInsets(...);`) unreachable in practice.","fix":"Since `dispatchInsets` is only ever called when `Build.VERSION.SDK_INT >= Build.VERSION_CODES.R`, drop the dead `else` branch (or add an assertion/comment documenting the precondition) instead of duplicating an unreachable code path:\n\n```java\n// before\nInsets sysBars;\nInsets cutout;\nif (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {\n    WindowInsets src = mActivity.getWindowManager().getCurrentWindowMetrics().getWindowInsets();\n    sysBars = src.getInsets(WindowInsets.Type.systemBars());\n    cutout = src.getInsets(WindowInsets.Type.displayCutout());\n} else {\n    sysBars = insets.getInsets(WindowInsets.Type.systemBars());\n    cutout = insets.getInsets(WindowInsets.Type.displayCutout());\n}\n\n// after\n// dispatchInsets() is only registered/called when SDK_INT >= R (see constructor).\nWindowInsets src = mActivity.getWindowManager().getCurrentWindowMetrics().getWindowInsets();\nInsets sysBars = src.getInsets(WindowInsets.Type.systemBars());\nInsets cutout = src.getInsets(WindowInsets.Type.displayCutout());\n```","locations":[{"ref":"internal/backends/android-activity/java/SlintAndroidJavaHelper.java:425-465","code":"  425 | public class SlintAndroidJavaHelper {\n  426 |     Activity mActivity;\n  427 |     SlintInputView mInputView;\n  428 |     private OnBackInvokedCallback mBackCallback;\n  429 | \n  430 |     public SlintAndroidJavaHelper(Activity activity) {\n  431 |         this.mActivity = activity;\n  432 |         this.mInputView = new SlintInputView(activity);\n  433 |         this.mActivity.runOnUiThread(new Runnable() {\n  434 |             @Override\n  435 |             public void run() {\n  436 | "low","difficulty":"very_easy","description":"In `SlintWidget::inputMethodEvent` (the embedded C++ code inside the `cpp!{{ ... }}` block in `qt_window.rs`), the statement `ime_text.mid(ime_cursor + replacement_start, replacement_length).toUtf8().size();` computes a value that is never assigned to anything and never used. `QStringView::mid()` plus `.toUtf8()` allocates a `QByteArray` just to immediately discard its `.size()`. This looks like a leftover/incomplete edit — every event of this kind (each `QInputMethodEvent`, i.e. every IME composition or commit) pays for a pointless allocation and copy for no effect.","fix":"Delete the dead statement — it has no observable effect:\n\n```\n-            ime_text.mid(ime_cursor + replacement_start, replacement_length).toUtf8().size();\n             int preedit_cursor = -1;\n```","locations":[{"ref":"internal/backends/qt/qt_window.rs:467-467","code":"  467 |             ime_text.mid(ime_cursor + replacement_start, replacement_length).toUtf8().size();","lines":1,"link":"https://github.com/slint-ui/slint/blob/fb263fd4b78225112c71c374386fd986b9a54e44/internal/backends/qt/qt_window.rs#L467"}]},{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"The thread-local `ALL_WINDOWS: RefCell<Vec<Weak<QtWindow>>>` in `qt_window.rs` is only ever pushed to (in `QtWindow::new`) and is never read anywhere else in the crate or the rest of the repository (confirmed by grepping the whole tree for `ALL_WINDOWS`). Its own doc comment even says `// FIXME: currently the window are never removed`. So every `QtWindow` ever constructed (including every popup and tooltip, which are created and destroyed frequently) appends a `Weak` entry that is never pruned and never consumed by anything — the vector grows without bound for the lifetime of the thread with no purpose.","fix":"Since nothing reads `ALL_WINDOWS`, remove the dead tracking entirely: delete the `thread_local! { static ALL_WINDOWS: ... (function(){

// Data

const ALL_TYPES = [...new Set(FINDINGS.map(f => f.type))].sort();
// Build lookup map for O(1) access
const FINDING_BY_ID = new Map(FINDINGS.map(f => [f.id, f]));
// Only severities actually present in the report — the filter bar hides the rest.
const PRESENT_SEVS = SEVS.filter(s => FINDINGS.some(f => (f.severity || 'medium') === s));
// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};

const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State

const statuses = {};

// Persistence

}

  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }

  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return chunks.join('\n\n') + '\n';
}

// Build project-info.toml from embedded PROJECT_INFO (same format as gen_project_info.py).
function buildProjectInfoToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = Object.assign({}, PROJECT_INFO);
  if (!('description' in pi)) pi.description = '';
  const lines = [
    '# Project metadata for the code audit report (all fields optional).',
    '# Hand-edit freely (e.g. fill in description); re-run the audit without --force to keep edits.',
    '', '[project]'
  ];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystack per finding (cleared on full re-render)
const _hay = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (!hayOf(f).includes(q) && !st.includes(q)) return false;
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    downloadText(buildFindingsToml(),    'findings.toml',     'application/toml');
    downloadText(buildProjectInfoToml(), 'project-info.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
