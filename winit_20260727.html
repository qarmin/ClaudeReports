s to `WlDataOffer` (see `impl Deref for DataOffer`), so `.finish()` resolves to the raw `wl_data_offer.finish` request. Per the wayland protocol, `finish` may only be sent after a successful drop; sending it on a plain `leave` raises the `invalid_finish` protocol error and disconnects the client. In addition, going through the `Deref` bypasses sctk's `DragOffer::finish` guard (which only sends `finish` when `version() >= 3`), so on a v1/v2 offer this also sends `finish` to an object that does not support it, another protocol error. The same unguarded `receive_drag.finish()` is used in `drop_performed` (where the timing is correct, but the version guard is still missing).","fix":"On `leave`, do not call `finish()` at all - only `destroy()` the offer. Reserve `finish()` for `drop_performed`, and route it through the sctk `DragOffer::finish` (which checks `version() >= 3`) rather than the raw `WlDataOffer::finish` reached via `Deref`. For example, in `leave` drop the `receive_drag.finish()` call entirely and rely on the subsequent `drag.destroy()`.","locations":[{"ref":"winit-wayland/src/dnd.rs:684-693","code":"  684 |         if let Some(current_drag) = self.dnd_state.receive_drag() {\n  685 |             self.events_sink.push_window_event(\n  686 |                 WindowEvent::DragLeft { id: current_drag.transfer_id() },\n  687 |                 current_drag.window_id(),\n  688 |             );\n  689 | \n  690 |             if let Some(receive_drag) = self.dnd_state.receive_drag.take() {\n  691 |                 receive_drag.finish();\n  692 |             }\n  693 |         }","lines":10,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-wayland/src/dnd.rs#L684-L693"},{"ref":"winit-wayland/src/dnd.rs:500-506","code":"  500 | impl Deref for DataOffer {\n  501 |     type Target = WlDataOffer;\n  502 | \n  503 |     fn deref(&self) -> &Self::Target {\n  504 |         &self.data\n  505 |     }\n  506 | }","lines":7,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-wayland/src/dnd.rs#L500-L506"},{"ref":"winit-wayland/src/dnd.rs:792-794","code":"  792 |         if let Some(receive_drag) = self.dnd_state.receive_drag.take() {\n  793 |             receive_drag.finish();\n  794 |         }","lines":3,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-wayland/src/dnd.rs#L792-L794"}]},{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"easy","description":"`WinitPointerData::unconfine_pointer` destroys the confined-pointer Wayland object but never clears it from the state. It locks `self.inner` immutably and uses `.as_ref()`:\n```\npub fn unconfine_pointer(&self) {\n    let inner = self.inner.lock().unwrap();\n    if let Some(confined_pointer) = inner.confined_pointer.as_ref() {\n        confined_pointer.destroy();\n    }\n}\n```\nNote the guard `inner` is not `mut` and `confined_pointer` is left as `Some(..)`. Later, when `WinitPointerDataInner` is dropped, `Drop` runs `self.confined_pointer.take()` and calls `confined_pointer.destroy()` a *second* time on the same proxy. A double `zwp_confined_pointer_v1.destroy` is a Wayland protocol error that disconnects the client and crashes the application. This is reached via `seat::remove_capability` (which calls `unconfine_pointer` then drops the pointer) and via `window/state.rs` cursor-grab changes. Compare with the correct `unlock_pointer`, which uses `.take()` and thus leaves `locked_pointer` as `None`.","fix":"Take the value out so the `Drop` impl does not destroy it again:\n```\npub fn unconfine_pointer(&self) {\n    let mut inner = self.inner.lock().unwrap();\n    if let Some(confined_pointer) = inner.confined_pointer.take() {\n        confined_pointer.destroy();\n    }\n}\n```","locations":[{"ref":"winit-wayland/src/seat/pointer/mod.rs:316-321","code":"  316 |     pub fn unconfine_pointer(&self) {\n  317 |         let inner = self.inner.lock().unwrap();\n  318 |         if let Some(confined_pointer) = inner.confined_pointer.as_ref() {\n  319 |             confined_pointer.destroy();\n  320 |         }\n  321 |     }","lines":6,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-wayland/src/seat/pointer/mod.rs#L316-L321"},{"ref":"winit-wayland/src/seat/pointer/mod.rs:387-396","code":"  387 | impl Drop for WinitPointerDataInner {\n  388 |     fn drop(&mut self) {\n  389 |         if let Some(locked_pointer) = self.locked_pointer.take() {\n  390 |             locked_pointer.destroy();\n  391 |         }\n  392 | \n  393 |         if let Some(confined_pointer) = self.confined_pointer.take() {\n  394 |             confined_pointer.destroy();\n  395 |         }\n  396 |     }","lines":10,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-wayland/src/seat/pointer/mod.rs#L387-L396"}]},{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"`is_high_contrast` initialises `HIGHCONTRASTA { cbSize: 0, .. }` before calling `SystemParametersInfoA(SPI_GETHIGHCONTRAST, size_of_val(&hc), &mut hc, 0)`. The documented contract for `SPI_GETHIGHCONTRAST` requires the `cbSize` member of the `HIGHCONTRAST` structure to be set to `sizeof(HIGHCONTRAST)` (in addition to the `uiParam` size argument). Leaving `cbSize == 0` can make the call fail, in which case `is_high_contrast` silently returns `false` and dark mode is applied even when the user has enabled a high-contrast theme.","fix":"Set `cbSize` to the struct size: `let mut hc = HIGHCONTRASTA { cbSize: std::mem::size_of::<HIGHCONTRASTA>() as u32, dwFlags: 0, lpszDefaultScheme: ptr::null_mut() };`.","locations":[{"ref":"winit-win32/src/dark_mode.rs:151-164","code":"  151 | fn is_high_contrast() -> bool {\n  152 |     let mut hc = HIGHCONTRASTA { cbSize: 0, dwFlags: 0, lpszDefaultScheme: ptr::null_mut() };\n  153 | \n  154 |     let ok = unsafe {\n  155 |         SystemParametersInfoA(\n  156 |             SPI_GETHIGHCONTRAST,\n  157 |             std::mem::size_of_val(&hc) as _,\n  158 |             &mut hc as *mut _ as _,\n  159 |             0,\n  160 |         )\n  161 |     };\n  162 | \n  163 |     ok != false.into() && util::has_flag(hc.dwFlags, HCF_HIGHCONTRASTON)\n  164 | }","lines":14,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-win32/src/dark_mode.rs#L151-L164"}]},{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"Several `extern \"C\"` XIM callbacks can panic, which unwinds across the C (Xlib) frame that invoked them. `preedit_start_callback`/`preedit_done_callback`/`preedit_draw_callback`/`preedit_caret_callback` all use `event_sender.send(...).expect(\"failed to send preedit ... event\")`, and `preedit_draw_callback` uses `new_text.to_str().expect(\"Invalid UTF-8 String from IME\")`. The latter is directly reachable: an IME running under a non-UTF-8 locale can legitimately hand back a non-UTF-8 multibyte string, and a `send` fails whenever the event-loop receiver has been dropped (e.g. during shutdown). Likewise `xim_instantiate_callback` and `xim_destroy_callback` call `panic!(...)`. Panicking out of `extern \"C\"` aborts the whole process (or is UB on older toolchains) - an environment-triggerable hard crash.","fix":"Make the callbacks panic-free: replace `.expect(...)` on `event_sender.send(...)` with `let _ = ...send(...);` (a dead receiver just means no one is listening), and replace `new_text.to_str().expect(\"Invalid UTF-8 String from IME\")` with a graceful fallback such as `match new_text.to_str() { Ok(s) => s, Err(_) => return }` or `String::from_utf8_lossy`. For the reopen-failure paths in `callbacks.rs`, log the error via `tracing::error!` instead of `panic!`, or wrap callback bodies in `std::panic::catch_unwind` so unwinding never crosses the FFI boundary.","locations":[{"ref":"winit-x11/src/ime/context.rs:54-57","code":"   54 |     client_data\n   55 |         .event_sender\n   56 |         .send((client_data.window, ImeEvent::Start))\n   57 |         .expect(\"failed to send preedit start event\");","lines":4,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-x11/src/ime/context.rs#L54-L57"},{"ref":"winit-x11/src/ime/context.rs:73-77","code":"   73 |     client_data\n   74 |         .event_sender\n   75 |         .send((client_data.window, ImeEvent::End))\n   76 |         .expect(\"failed to send preedit end event\");\n   77 | }","lines":5,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-x11/src/ime/context.rs#L73-L77"},{"ref":"winit-x11/src/ime/context.rs:122","code":"  122 |         String::from(new_text.to_str().expect(\"Invalid UTF-8 String from IME\")).chars().collect()","lines":1,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-x11/src/ime/context.rs#L122"},{"ref":"winit-x11/src/ime/context.rs:130-136","code":"  130 |     client_data\n  131 |         .event_sender\n  132 |         .send((\n  133 |             client_data.window,\n  134 |             ImeEvent::Update(client_data.text.iter().collect(), cursor_byte_pos),\n  135 |         ))\n  136 |         .expect(\"failed to send preedit update event\");","lines":7,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-x11/src/ime/context.rs#L130-L136"},{"ref":"winit-x11/src/ime/callbacks.rs:174","code":"  174 |                     panic!(\"Failed to reopen input method: {err:?}\");","lines":1,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-x11/src/ime/callbacks.rs#L174"},{"ref":"winit-x11/src/ime/callbacks.rs:201","code":"  201 |                     panic!(\"Failed to open fallback input method: {err:?}\");","lines":1,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-x11/src/ime/callbacks.rs#L201"}]},{"id":"API_5","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"Several `NSWindowDelegate`/`NSDraggingDestination` methods obtain a main-thread marker via `MainThreadMarker::new().unwrap()` even though `WindowDelegate` is `MainThreadOnly` and `MainThreadMarker::from(self)` is infallibly available. Using the unwrapping form introduces an unnecessary panic path (and obscures that the code is provably on the main thread).","fix":"Replace `MainThreadMarker::new().unwrap()` with `MainThreadMarker::from(self)` in these delegate methods.","locations":[{"ref":"winit-appkit/src/window_delegate.rs:403-404","code":"  403 |             let pb =\n  404 |                 MainThreadBound::new(sender.draggingPasteboard(), MainThreadMarker::new().unwrap());","lines":2,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-appkit/src/window_delegate.rs#L403-L404"},{"ref":"winit-appkit/src/window_delegate.rs:460-461","code":"  460 |             let pb =\n  461 |                 MainThreadBound::new(sender.draggingPasteboard(), MainThreadMarker::new().unwrap());","lines":2,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-appkit/src/window_delegate.rs#L460-L461"},{"ref":"winit-appkit/src/window_delegate.rs:511-512","code":"  511 |             let pb =\n  512 |                 MainThreadBound::new(sender.draggingPasteboard(), MainThreadMarker::new().unwrap());","lines":2,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-appkit/src/window_delegate.rs#L511-L512"},{"ref":"winit-appkit/src/window_delegate.rs:567-570","code":"  567 |                 let pb = MainThreadBound::new(\n  568 |                     sender.draggingPasteboard(),\n  569 |                     MainThreadMarker::new().unwrap(),\n  570 |                 );","lines":4,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-appkit/src/window_delegate.rs#L567-L570"}]},{"id":"API_6","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`FileDropHandler::QueryInterface` returns `E_FAIL` and never writes to `_ppvObject`. The COM contract for `IUnknown::QueryInterface` requires that on failure `*ppvObject` is set to `NULL`; leaving it untouched lets a caller read an uninitialised out-pointer. It should also return `E_NOINTERFACE` (not `E_FAIL`) for an unsupported IID.","fix":"Write the out-parameter before returning: `if !_ppvObject.is_null() { unsafe { *_ppvObject = std::ptr::null_mut(); } }` and return `E_NOINTERFACE`.","locations":[{"ref":"winit-win32/src/dnd.rs:344-354","code":"  344 |     unsafe extern \"system\" fn QueryInterface(\n  345 |         _this: *mut IUnknown,\n  346 |         _riid: *const GUID,\n  347 |         _ppvObject: *mut *mut c_void,\n  348 |     ) -> HRESULT {\n  349 |         // This function doesn't appear to be required for an `IDropTarget`.\n  350 |         // An implementation would be nice however.\n  351 |         // Can't use `unimplemented` here as it's invalid to panic over an FFI boundary.\n  352 |         tracing::warn!(\"`QueryInterface` called, but it was unimplemented\");\n  353 |         E_FAIL\n  354 |     }","lines":11,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-win32/src/dnd.rs#L344-L354"}]},{"id":"API_7","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"The atom manager interns an atom whose *name* is the literal string `\"None\"` (`None: b\"None\"`) and this atom is used as the DnD \"no action\" value (`atoms[DndNone]`) in `send_status` (Rejected) and `send_finished` (not accepted). Per the XDND spec the action field must be the real X11 `None` atom (numeric id `0`, i.e. `xproto::AtomEnum::NONE`), not an application-defined atom that merely happens to be named \"None\". The interned atom has an arbitrary non-zero id, so a strict drag source reading the action field sees a bogus atom.","fix":"Use `xproto::AtomEnum::NONE` (0) for the no-action value instead of an interned `\"None\"` atom.","locations":[{"ref":"winit-x11/src/atoms.rs:124","code":"  124 |     None: b\"None\",","lines":1,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-x11/src/atoms.rs#L124"},{"ref":"winit-x11/src/dnd.rs:281-282","code":"  281 |         let (accepted, action) =\n  282 |             if state.accepted { (1, atoms[XdndActionCopy]) } else { (0, atoms[DndNone]) };","lines":2,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-x11/src/dnd.rs#L281-L282"},{"ref":"winit-x11/src/dnd.rs:330-333","code":"  330 |         let (accepted, action) = match status {\n  331 |             DndState::Accepted => (1, atoms[XdndActionCopy]),\n  332 |             DndState::Rejected => (0, atoms[DndNone]),\n  333 |         };","lines":4,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-x11/src/dnd.rs#L330-L333"}]},{"id":"API_8","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"hard","description":"`set_activation_token_env` and `reset_activation_token_env` mutate process-global environment via `env::set_var`/`env::remove_var` inside bare `unsafe` blocks with no `# Safety` documentation and no mention of the well-known data-race hazard. On the 2024 edition these functions are `unsafe` precisely because concurrent `getenv`/`setenv` from other threads is undefined behaviour; winit itself reads env vars (e.g. `WAYLAND_DISPLAY`, `DISPLAY`) elsewhere. Exposing these as safe public wrappers that internally call the unsafe primitives, with no caller guidance about thread-safety, invites UB in multi-threaded programs.","fix":"Document the thread-safety contract on both public functions (must be called before spawning threads that touch the environment), and add a terse `// SAFETY:` justification inside each `unsafe` block stating the single-threaded-at-call-time precondition being relied on.","locations":[{"ref":"winit/src/platform/startup_notify.rs:95-111","code":"   95 | pub fn reset_activation_token_env() {\n   96 |     unsafe {\n   97 |         env::remove_var(X11_VAR);\n   98 |         env::remove_var(WAYLAND_VAR);\n   99 |     }\n  100 | }\n  101 | \n  102 | /// Set environment variables responsible for activation token.\n  103 | ///\n  104 | /// This could be used before running daemon processes.\n  105 | pub fn set_activation_token_env(token: ActivationToken) {\n  106 |     let token = token.into_raw();\n  107 |     unsafe {\n  108 |         env::set_var(X11_VAR, &token);\n  109 |         env::set_var(WAYLAND_VAR, token);\n  110 |     }\n  111 | }","lines":17,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit/src/platform/startup_notify.rs#L95-L111"}]},{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`keycodes::to_logical(key_char, keycode)` is invoked twice for the same key event to produce both `logical_key` and `key_without_modifiers`. The two calls take identical inputs and always produce identical output, so the second call redundantly re-runs the whole mapping and re-allocates a `SmolStr` for every key press.","fix":"Compute `let logical_key = keycodes::to_logical(key_char, keycode);` once, then set `key_without_modifiers: logical_key.clone()` and reorder so `logical_key` is cloned before it is moved into the `KeyEvent`.","locations":[{"ref":"winit-android/src/event_loop.rs:476-476","code":"  476 |                         let logical_key = keycodes::to_logical(key_char, keycode);","lines":1,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-android/src/event_loop.rs#L476"},{"ref":"winit-android/src/event_loop.rs:493-493","code":"  493 |                                 key_without_modifiers: keycodes::to_logical(key_char, keycode),","lines":1,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-android/src/event_loop.rs#L493"}]},{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In `EventLoop::pump_app_events` (Orbital) the computed timeout is registered via `UserData::from_user_data(timeout.as_millis() as usize)`, truncating to whole milliseconds. For a `ControlFlow::WaitUntil` deadline less than 1 ms away, `as_millis()` yields `0`, so the timer fires immediately and `pump_app_events` returns `PumpStatus::Continue` without doing work; the caller re-enters, recomputes a sub-millisecond timeout, and spins in a busy loop until the deadline is reached. Sub-millisecond scheduling resolution is silently lost.","fix":"Preserve sub-millisecond precision by programming the timeout in nanoseconds (e.g. via the `TimeSocket`/`TimeSpec` path already present in `lib.rs`) instead of truncating to whole milliseconds, or round up so a non-zero remaining duration never becomes a 0 ms timeout.","locations":[{"ref":"winit-orbital/src/event_loop.rs:682-691","code":"  682 |         if let Some(timeout) = timeout {\n  683 |             self.window_target\n  684 |                 .event_socket\n  685 |                 .subscribe(\n  686 |                     EVENT_TIMEOUT_ID,\n  687 |                     UserData::from_user_data(timeout.as_millis() as usize),\n  688 |                     EventFlags::READ,\n  689 |                 )\n  690 |                 .expect(\"failed to register EVENT_TIMEOUT_ID\")\n  691 |         }","lines":10,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-orbital/src/event_loop.rs#L682-L691"}]},{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`WindowState::pointer_left()` calls `removed.upgrade().unwrap()` inside the retain loop, once per retained pointer:\n```rust\nfor pointer in self.pointers.drain(..) {\n    if let Some(pointer) = pointer.upgrade() {\n        if pointer.pointer() != removed.upgrade().unwrap().pointer() {\n            new_pointers.push(Arc::downgrade(&pointer));\n        }\n    }\n}\n```\nThe `removed` weak is re-`upgrade()`d on every iteration (repeated atomic refcount work), and the `unwrap()` is a latent panic: if the `removed` pointer's `Arc` were already dropped, `upgrade()` returns `None` and the code panics. The current caller keeps the `Arc` alive so it does not fire today, but the pattern is fragile.","fix":"Upgrade `removed` once before the loop and compare against a stored reference, e.g.:\n```rust\nlet removed = match removed.upgrade() {\n    Some(removed) => removed,\n    None => return,\n};\nself.pointers.retain(|p| {\n    p.upgrade().is_none_or(|p| p.pointer() != removed.pointer())\n});\n```","locations":[{"ref":"winit-wayland/src/window/state.rs:651-662","code":"  651 |     pub fn pointer_left(&mut self, removed: Weak<ThemedPointer<WinitPointerData>>) {\n  652 |         let mut new_pointers = Vec::new();\n  653 |         for pointer in self.pointers.drain(..) {\n  654 |             if let Some(pointer) = pointer.upgrade() {\n  655 |                 if pointer.pointer() != removed.upgrade().unwrap().pointer() {\n  656 |                     new_pointers.push(Arc::downgrade(&pointer));\n  657 |                 }\n  658 |             }\n  659 |         }\n  660 | \n  661 |         self.pointers = new_pointers;\n  662 |     }","lines":12,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-wayland/src/window/state.rs#L651-L662"}]},{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"In `RootWindow::request_surface_size` the closure passed to `self.inner.queue(..)` already receives `inner`, yet computes the scale factor via `self.scale_factor()`, which itself calls `self.inner.queue(Inner::scale_factor)` - a nested `queue` on the same `Dispatcher`. On the main thread this issues a second `RefCell` borrow and an extra dispatch for a value already reachable as `inner`. Every other method here uses `inner.scale_factor()`.","fix":"Use the already-available `inner`: `let size = size.to_logical(inner.scale_factor());`.","locations":[{"ref":"winit-web/src/window.rs:149-160","code":"  149 |     fn request_surface_size(&self, size: Size) -> Option<PhysicalSize<u32>> {\n  150 |         self.inner.queue(|inner| {\n  151 |             let size = size.to_logical(self.scale_factor());\n  152 |             backend::set_canvas_size(\n  153 |                 inner.canvas.document(),\n  154 |                 inner.canvas.raw(),\n  155 |                 inner.canvas.style(),\n  156 |                 size,\n  157 |             );\n  158 |             None\n  159 |         })\n  160 |     }","lines":12,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-web/src/window.rs#L149-L160"}]},{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"The `WM_SIZING` handler re-locks `window_state` six-plus times in sequence for independent field reads (`scale_factor`, `surface_resize_increments`, `window_flags`, `min_size`, `max_size`), each a separate `Mutex` lock/unlock, instead of taking the lock once and reading all fields. Also each lock returns a temporary guard, so `adjust_rect` is called on a freshly re-locked guard.","fix":"Take a single `let ws = userdata.window_state_lock();` guard at the top of the arm, read `scale_factor`, `surface_resize_increments`, `window_flags`, `min_size`, `max_size` from it, then `drop(ws)` before doing the geometry math.","locations":[{"ref":"winit-win32/src/event_loop.rs:1456-1493","code":" 1456 |             let scale_factor = userdata.window_state_lock().scale_factor;\n 1457 |             let Some(inc) = userdata\n 1458 |                 .window_state_lock()\n 1459 |                 .surface_resize_increments\n 1460 |                 .map(|inc| inc.to_physical(scale_factor))\n 1461 |                 .filter(|inc| inc.width > 0 && inc.height > 0)\n 1462 |             else {\n 1463 |                 result = ProcResult::Value(0);\n 1464 |                 return;\n 1465 |             };\n 1466 | \n 1467 |             let side = wparam as u32;\n 1468 |             // The desired new size of the window, decorations included.\n 1469 |             let rect = unsafe { &mut *(lparam as *mut RECT) };\n 1470 | \n 1471 |             // We need to calculate the dimensions of the window decorations to get the true\n 1472 |             // size of the window's contents\n 1473 |             let adj_rect = userdata\n 1474 |                 .window_state_lock()\n 1475 |                 .window_flags\n 1476 |                 .adjust_rect(window, *rect)\n 1477 |                 .unwrap_or(*rect);\n 1478 |             let deco_width = rect.left - adj_rect.left + adj_rect.right - rect.right;\n 1479 |             let deco_height = rect.top - adj_rect.top + adj_rect.bottom - rect.bottom;\n 1480 | \n 1481 |             let width = rect.right - rect.left - deco_width;\n 1482 |             let height = rect.bottom - rect.top - deco_height;\n 1483 | \n 1484 |             let mut width_delta = snap_to_nearest_increment_delta(width, inc.width);\n 1485 |             let mut height_delta = snap_to_nearest_increment_delta(height, inc.height);\n 1486 | \n 1487 |             // Windows won't bound check the value of `rect` after we're done here, so we\n 1488 |             // have to check manually. If the width/height we snap to would go out of bounds, just\n 1489 |             // set it equal to the min/max bound.\n 1490 |             let min_size =\n 1491 |                 userdata.window_state_lock().min_size.map(|size| size.to_physical(scale_factor));\n 1492 |             let max_size =\n 1493 |                 userdata.window_state_lock().max_size.map(|size| size.to_physical(scale_factor));","lines":38,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-win32/src/event_loop.rs#L1456-L1493"}]},{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In `apply_win10_dpi_adjustment`, when the conservative rect lands on a monitor that shares no edge with the target monitor, `delta_nudge_to_dpi_monitor` is `(0, 0)`. The nudge loop then runs `abort_after_iterations` times (up to `monitor_width + monitor_height`, i.e. thousands) adding `(0,0)` each iteration and calling `MonitorFromRect` every time without ever making progress or breaking early - thousands of wasted syscalls on the DPI-change path.","fix":"Short-circuit when there is nothing to nudge: `if delta_nudge_to_dpi_monitor == (0, 0) { return conservative_rect; }` before entering the loop.","locations":[{"ref":"winit-win32/src/event_loop.rs:2721-2752","code":" 2721 |     #[allow(clippy::bool_to_int_with_if)]\n 2722 |     let delta_nudge_to_dpi_monitor = (\n 2723 |         if wrong_monitor_rect.left == new_monitor_rect.right {\n 2724 |             -1\n 2725 |         } else if wrong_monitor_rect.right == new_monitor_rect.left {\n 2726 |             1\n 2727 |         } else {\n 2728 |             0\n 2729 |         },\n 2730 |         if wrong_monitor_rect.bottom == new_monitor_rect.top {\n 2731 |             1\n 2732 |         } else if wrong_monitor_rect.top == new_monitor_rect.bottom {\n 2733 |             -1\n 2734 |         } else {\n 2735 |             0\n 2736 |         },\n 2737 |     );\n 2738 | \n 2739 |     let abort_after_iterations = new_monitor_rect.right - new_monitor_rect.left\n 2740 |         + new_monitor_rect.bottom\n 2741 |         - new_monitor_rect.top;\n 2742 |     for _ in 0..abort_after_iterations {\n 2743 |         conservative_rect.left += delta_nudge_to_dpi_monitor.0;\n 2744 |         conservative_rect.right += delta_nudge_to_dpi_monitor.0;\n 2745 |         conservative_rect.top += delta_nudge_to_dpi_monitor.1;\n 2746 |         conservative_rect.bottom += delta_nudge_to_dpi_monitor.1;\n 2747 | \n 2748 |         if unsafe { MonitorFromRect(&conservative_rect, MONITOR_DEFAULTTONULL) } == new_dpi_monitor\n 2749 |         {\n 2750 |             break;\n 2751 |         }\n 2752 |     }","lines":32,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-win32/src/event_loop.rs#L2721-L2752"}]},{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`xinput2_mouse_enter` calls `DeviceInfo::get(&self.target.xconn, ALL_DEVICES.into())` on every single `XI_Enter` event, which does a synchronous round-trip `XIQueryDevice(all)` plus a heap allocation and free, purely to reset scroll positions. Pointer-enter events can be frequent, making this a needless per-event server round-trip and allocation.","fix":"Reset scroll positions from the already-cached `self.devices` map instead of re-querying the server on every enter, or query only the specific `sourceid` rather than `ALL_DEVICES`.","locations":[{"ref":"winit-x11/src/event_processor.rs:1258-1273","code":" 1258 |         if let Some(all_info) = DeviceInfo::get(&self.target.xconn, ALL_DEVICES.into()) {\n 1259 |             let mut devices = self.devices.borrow_mut();\n 1260 |             for device_info in all_info.iter() {\n 1261 |                 // The second expression is need for resetting to work correctly on i3, and\n 1262 |                 // presumably some other WMs. On those, `XI_Enter` doesn't include the physical\n 1263 |                 // device ID, so both `sourceid` and `deviceid` are the virtual device.\n 1264 |                 if device_info.deviceid == event.sourceid\n 1265 |                     || device_info.attachment == event.sourceid\n 1266 |                 {\n 1267 |                     let device_id = mkdid(device_info.deviceid as xinput::DeviceId);\n 1268 |                     if let Some(device) = devices.get_mut(&device_id) {\n 1269 |                         device.reset_scroll_position(device_info);\n 1270 |                     }\n 1271 |                 }\n 1272 |             }\n 1273 |         }","lines":16,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-x11/src/event_processor.rs#L1258-L1273"}]},{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`available_monitors` returns a full deep clone of the cached monitor list on every call (`Ok(monitors.clone())`), including each monitor's `video_modes: Vec<VideoModeHandle>`. `Window::available_monitors`, `UnownedWindow::new`, and the `CoreWindow` iterator all go through this, so every window creation and monitor query re-clones every video mode of every monitor.","fix":"Store the cache behind an `Arc<[MonitorHandle]>` (or `Arc<Vec<MonitorHandle>>`) and hand out cheap `Arc` clones, or expose an iterator/borrow instead of cloning the whole structure with its video-mode lists.","locations":[{"ref":"winit-x11/src/monitor.rs:234-246","code":"  234 |     pub fn available_monitors(&self) -> Result<Vec<MonitorHandle>, X11Error> {\n  235 |         let mut monitors_lock = self.monitor_handles.lock().unwrap();\n  236 |         match *monitors_lock {\n  237 |             Some(ref monitors) => Ok(monitors.clone()),\n  238 |             None => {\n  239 |                 let monitors = self.query_monitor_list()?;\n  240 |                 if !DISABLE_MONITOR_LIST_CACHING {\n  241 |                     *monitors_lock = Some(monitors.clone());\n  242 |                 }\n  243 |                 Ok(monitors)\n  244 |             },\n  245 |         }\n  246 |     }","lines":13,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-x11/src/monitor.rs#L234-L246"}]},{"id":"PERF_9","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`rgba_to_cardinals` allocates the output `Vec` with `Vec::with_capacity(pixel_count)` but then pushes `pixel_count + 2` elements (the width and height cardinals plus one per pixel). The capacity is always too small by exactly 2, forcing a reallocation and full copy of the (potentially large) icon buffer on every call.","fix":"Reserve the correct size: `let mut data = Vec::with_capacity(pixel_count + 2);`.","locations":[{"ref":"winit-x11/src/util/icon.rs:33-46","code":"   33 | pub(crate) fn rgba_to_cardinals(icon: &RgbaIcon) -> Vec<Cardinal> {\n   34 |     assert_eq!(icon.buffer().len() % PIXEL_SIZE, 0);\n   35 |     let pixel_count = icon.buffer().len() / PIXEL_SIZE;\n   36 |     assert_eq!(pixel_count, (icon.width() * icon.height()) as usize);\n   37 |     let mut data = Vec::with_capacity(pixel_count);\n   38 |     data.push(icon.width() as Cardinal);\n   39 |     data.push(icon.height() as Cardinal);\n   40 |     let pixels = icon.buffer().as_ptr() as *const Pixel;\n   41 |     for pixel_index in 0..pixel_count {\n   42 |         let pixel = unsafe { &*pixels.add(pixel_index) };\n   43 |         data.push(pixel.to_packed_argb());\n   44 |     }\n   45 |     data\n   46 | }","lines":14,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-x11/src/util/icon.rs#L33-L46"}]},{"id":"PERF_10","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"`.ok_or_else(|| EventLoopError::RecreationAttempt)?` wraps a plain, non-allocating enum variant in a closure; the lazy `ok_or_else` is pointless here.","fix":"Replace with `.ok_or(EventLoopError::RecreationAttempt)?`.","locations":[{"ref":"winit-appkit/src/event_loop.rs:377-377","code":"  377 |         .ok_or_else(|| EventLoopError::RecreationAttempt)?;","lines":1,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-appkit/src/event_loop.rs#L377"}]},{"id":"PERF_11","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"`EventLoopWaker::start_at` reconstructs the fractional seconds of a `Duration` by hand (`duration.subsec_nanos() as f64 / 1_000_000_000.0 + duration.as_secs() as f64`). `Duration::as_secs_f64()` does exactly this and is clearer/less error-prone.","fix":"Use `let fsecs = duration.as_secs_f64();`.","locations":[{"ref":"winit-appkit/src/observer.rs:76-79","code":"   76 |                     let duration = instant - now;\n   77 |                     let fsecs = duration.subsec_nanos() as f64 / 1_000_000_000.0\n   78 |                         + duration.as_secs() as f64;\n   79 |                     self.timer.set_next_fire_date(current + fsecs);","lines":4,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-appkit/src/observer.rs#L76-L79"}]},{"id":"PERF_12","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"`key_text` builds an `Option<SmolStr>` in the `match` (already cloning the `SmolStr` for the `Key::Character` arm) and then applies a redundant `.map(SmolStr::new)`, which allocates a *second* fresh `SmolStr` from the one just produced.","fix":"Drop the trailing `.map(SmolStr::new)` - the `match` already yields the desired `Option<SmolStr>`.","locations":[{"ref":"winit-web/src/web_sys/event.rs:265-274","code":"  265 | pub fn key_text(event: &KeyboardEvent) -> Option<SmolStr> {\n  266 |     let key = key(event);\n  267 |     match &key {\n  268 |         Key::Character(text) => Some(text.clone()),\n  269 |         Key::Named(NamedKey::Tab) => Some(SmolStr::new(\"\\t\")),\n  270 |         Key::Named(NamedKey::Enter) => Some(SmolStr::new(\"\\r\")),\n  271 |         _ => None,\n  272 |     }\n  273 |     .map(SmolStr::new)\n  274 | }","lines":10,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-web/src/web_sys/event.rs#L265-L274"}]},{"id":"PERF_13","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"In `FileDropHandler::Drop`, `proposed_action` is computed at line 537 (and used for the `DragPosition` event) and then recomputed identically inside the inner scope at lines 560-561 with the same `effects`; likewise `pdwEffect.read()` is read again into `source_allowed` at line 559 before any write, yielding the same value as `effects`. The recomputation and re-read are redundant.","fix":"Reuse the `proposed_action` computed at line 537 and the `effects` value read at line 536 instead of recomputing/re-reading them inside the scope.","locations":[{"ref":"winit-win32/src/dnd.rs:536-561","code":"  536 |         let effects = unsafe { pdwEffect.read() };\n  537 |         let proposed_action = drop_handler.runner.proposed_dnd_action(data_transfer_id, effects);\n  538 | \n  539 |         let pt_screen = POINT { x: pt.x, y: pt.y };\n  540 |         let mut pt_client = pt_screen;\n  541 |         unsafe {\n  542 |             ScreenToClient(drop_handler.window, &mut pt_client);\n  543 |         }\n  544 |         let pt = pt_client;\n  545 |         let position = PhysicalPosition::new(pt.x as f64, pt.y as f64);\n  546 | \n  547 |         (drop_handler.send_event)(WindowEvent::DragPosition {\n  548 |             id: data_transfer_id,\n  549 |             position,\n  550 |             proposed_action,\n  551 |         });\n  552 | \n  553 |         // New scope to make sure that the `Ref` returned by `current_drag_actions` is dropped\n  554 |         // before we call `remove_data_transfer`.\n  555 |         {\n  556 |             // Get actions after the event handler has run, so that we update it based on the user's\n  557 |             // supplied info.\n  558 |             let actions = drop_handler.runner.current_drag_actions(data_transfer_id);\n  559 |             let source_allowed = unsafe { pdwEffect.read() };\n  560 |             let proposed_action =\n  561 |                 drop_handler.runner.proposed_dnd_action(data_transfer_id, effects);","lines":26,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-win32/src/dnd.rs#L536-L561"}]},{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"medium","difficulty":"very_easy","description":"`winit-win32/src/minimal_ime.rs` is orphaned dead code. `lib.rs` declares every module explicitly (`util`, `dark_mode`, `dnd`, `event_loop`, `icon`, `ime`, `keyboard`, `keyboard_layout`, ...) but never declares `mod minimal_ime;`, so the file is not part of the crate. It also `use`s the `winapi` crate (`use winapi::...`), which is not a dependency of `winit-win32` at all, so the file could not even compile if it were included. The `MinimalIme` type and its `process_message` are unreferenced anywhere in the backend.","fix":"Delete `winit-win32/src/minimal_ime.rs` (IME is handled by `ime.rs` / `ImeContext`), or, if it is intended to be used, add `mod minimal_ime;` to `lib.rs` and port it from `winapi` to `windows_sys` so it compiles.","locations":[{"ref":"winit-win32/src/minimal_ime.rs:1-67","code":"    1 | use std::sync::{\n    2 |     atomic::{AtomicBool, Ordering::Relaxed},\n    3 |     Mutex,\n    4 | };\n    5 | \n    6 | use winapi::{\n    7 |     shared::{\n    8 |         minwindef::{LPARAM, WPARAM},\n    9 |         windef::HWND,\n   10 |     },\n   11 |     um::winuser,\n   12 | };\n   13 | \n   14 | use crate::{event_loop::ProcResult, keyboard: tf16parts.clear();\n   57 |                         self.getting_ime_text.store(false, Relaxed);\n   58 |                         return result;\n   59 |                     }\n   60 |                 }\n   61 |             }\n   62 |             _ => (),\n   63 |         }\n   64 | \n   65 |         None\n   66 |     }\n   67 | }","lines":67,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-win32/src/minimal_ime.rs#L1-L67"},{"ref":"winit-win32/src/lib.rs:7-21","code":"    7 | #[macro_use]\n    8 | mod util;\n    9 | mod dark_mode;\n   10 | mod definitions;\n   11 | mod dnd;\n   12 | mod dpi;\n   13 | mod event_loop;\n   14 | mod icon;\n   15 | mod ime;\n   16 | mod keyboard;\n   17 | mod keyboard_layout;\n   18 | mod monitor;\n   19 | mod raw_input;\n   20 | mod window;\n   21 | mod window_state;","lines":15,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-win32/src/lib.rs#L7-L21"}]},{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"medium","difficulty":"easy","description":"The entire file `winit-x11/src/util/modifiers.rs` is orphaned dead code. There is no `mod modifiers;` declaration anywhere in the crate (`util/mod.rs` declares `client_msg`, `cookie`, `cursor`, `geometry`, `hint`, `icon`, `input`, `keys`, `memory`, `mouse`, `randr`, `window_property`, `wm`, `xmodmap`, but NOT `modifiers`). The `ModifierKeymap` actually used by `event_loop.rs` and `event_processor.rs` comes from `util/xmodmap.rs` (re-exported via `pub use self::xmodmap::ModifierKeymap;`). The file defines a second, differently-shaped `ModifierKeymap` plus a `ModifierKeyState`, none of which are referenced. Because it is not part of the module tree it is never even compiled - and it would not compile as written: `reset_from_x_connection` calls `xconn.xcb_connection().get_modifier_mapping()...reply()` (an `x11rb` `GetModifierMappingReply` value) and then treats the result as a te: ElementState, keycode: ffi::KeyCode, modifier: Modifier) {\n  140 |         match state {\n  141 |             ElementState::Pressed => self.key_press(keycode, modifier),\n  142 |             ElementState::Released => self.key_release(keycode),\n  143 |         }\n  144 |     }\n  145 | \n  146 |     pub fn key_press(&mut self, keycode: ffi::KeyCode, modifier: Modifier) {\n  147 |         self.keys.insert(keycode, modifier);\n  148 | \n  149 |         set_modifier(&mut self.state, modifier, true);\n  150 |     }\n  151 | \n  152 |     pub fn key_release(&mut self, keycode: ffi::KeyCode) {\n  153 |         if let Some(modifier) = self.keys.remove(&keycode) {\n  154 |             if !self.keys.values().any(|&m| m == modifier) {\n  155 |                 set_modifier(&mut self.state, modifier, false);\n  156 |             }\n  157 |         }\n  158 |     }\n  159 | \n  160 |     fn reset_state(&mut self) {\n  161 |         let mut new_state = ModifiersState::default();\n  162 | \n  163 |         for &m in self.keys.values() {\n  164 |             set_modifier(&mut new_state, m, true);\n  165 |         }\n  166 | \n  167 |         self.state = new_state;\n  168 |     }\n  169 | }\n  170 | \n  171 | fn get_modifier(state: &ModifiersState, modifier: Modifier) -> bool {\n  172 |     match modifier {\n  173 |         Modifier::Alt => state.alt(),\n  174 |         Modifier::Ctrl => state.ctrl(),\n  175 |         Modifier::Shift => state.shift(),\n  176 |         Modifier::Logo => state.logo(),\n  177 |     }\n  178 | }\n  179 | \n  180 | fn set_modifier(state: &mut ModifiersState, modifier: Modifier, value: bool) {\n  181 |     match modifier {\n  182 |         Modifier::Alt => state.set(ModifiersState::ALT, value),\n  183 |         Modifier::Ctrl => state.set(ModifiersState::CTRL, value),\n  184 |         Modifier::Shift => state.set(ModifiersState::SHIFT, value),\n  185 |         Modifier::Logo => state.set(ModifiersState::LOGO, value),\n  186 |     }\n  187 | }","line 084dabc/winit-web/src/web_sys/pointer.rs#L21"},{"ref":"winit-web/src/web_sys/pointer.rs:270-270","code":"  270 |         self.on_touch_cancel = None;","lines":1,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-web/src/web_sys/pointer.rs#L270"}]},{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"`test_run_on_demand_cannot_access_event_loop` is a doctest that is intended to prove re-entrant `run_app_on_demand` fails to compile, but it is broken on three counts and protects nothing. (1) The fence attribute is `compile_error`, which is not a recognized rustdoc code-block attribute; the intended one is `compile_fail`. (2) The doc comment is attached to a *private* `fn`, and `cargo test --doc` only collects doctests from public items, so the snippet is never actually built or run. (3) The snippet calls `run_app_on_demand(|_, _| { ... })` with a closure, but the real signature is `run_app_on_demand<A: ApplicationHandler>(&mut self, app: A)` which takes an `ApplicationHandler`, not a two-argument closure - so even if it were collected it would fail for the wrong reason. The whole construct plus its `#[allow(dead_code)]` marker is dead code.","fix":"Either delete the item, or make it an effective test: change the fence to ```` ```compile_fail ````, move it into a public/documented location (or a real `#[test]` using `trybuild`/`compiletest`), and update the body to use an actual `ApplicationHandler` implementation rather than a closure so the re-entrancy borrow error is what actually triggers the compile failure.","locations":[{"ref":"winit/src/event_loop.rs:512-523","code":"  512 | /// ```compile_error\n  513 | /// use winit::event_loop::run_on_demand::EventLoopExtRunOnDemand;\n  514 | /// use winit::event_loop::EventLoop;\n  515 | ///\n  516 | /// let mut event_loop = EventLoop::new().unwrap();\n  517 | /// event_loop.run_app_on_demand(|_, _| {\n  518 | ///     // Attempt to run the event loop re-entrantly; this must fail.\n  519 | ///     event_loop.run_app_on_demand(|_, _| {});\n  520 | /// });\n  521 | /// ```\n  522 | #[allow(dead_code)]\n  523 | fn test_run_on_demand_cannot_access_event_loop() {}","lines":12,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit/src/event_loop.rs#L512-L523"}]},{"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`perform_drag_operation` returns a `bool` but the not-found branch does `return false.into()` while the success path returns a bare `true`. `false.into()` is a `bool -> bool` identity conversion (leftover from when the method likely returned an Objective-C `Bool`), which is dead/confusing and inconsistent with the `true` return below it.","fix":"Return `false;` directly to match the `true` return path and drop the no-op `.into()`.","locations":[{"ref":"winit-appkit/src/window_delegate.rs:505-540","code":"  505 |             let Some(transfer_id) =\n  506 |                 vars.app_state.drag_state().borrow().as_ref().map(|state| state.id)\n  507 |             else {\n  508 |                 return false.into();\n  509 |             };\n  510 | \n  511 |             let pb =\n  512 |                 MainThreadBound::new(sender.draggingPasteboard(), MainThreadMarker::new().unwrap());\n  513 | \n  514 |             let source_operations = sender.draggingSourceOperationMask();\n  515 |             // let operations = ns_drag_operation_to_dnd_actions(source_operations);\n  516 | \n  517 |             vars.app_state.pasteboards().set_pasteboard(transfer_id, &pb);\n  518 | \n  519 |             let dl = sender.draggingLocation();\n  520 |             let dl = self.view().convertPoint_fromView(dl, None);\n  521 |             let position =\n  522 |                 LogicalPosition::<f64>::from((dl.x, dl.y)).to_physical(self.scale_factor());\n  523 | \n  524 |             let proposed_action = vars.app_state.proposed_drag_action(source_operations);\n  525 | \n  526 |             self.queue_event(WindowEvent::DragPosition {\n  527 |                 id: transfer_id,\n  528 |                 position,\n  529 |                 proposed_action,\n  530 |             });\n  531 | \n  532 |             // Check again, in case the application updated\n  533 |             let proposed_action = vars.app_state.proposed_drag_action(source_operations);\n  534 | \n  535 |             self.queue_event(WindowEvent::DragDropped { id: transfer_id, proposed_action });\n  536 | \n  537 |             // We assume that if the OS has sent `perform_drag_operation`, that the drag succeeded.\n  538 |             // We may want to extend this API in the future to allow signalling that the final drop\n  539 |             // failed.\n  540 |             true","lines":36,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-appkit/src/window_delegate.rs#L505-L540"}]},{"id":"DEAD_7","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `ImeSurroundingText::new`, the guards `text.is_char_boundary(cursor) && cursor <= text.len()` and `text.is_char_boundary(anchor) && anchor <= text.len()` contain redundant bounds checks: `str::is_char_boundary` already returns `false` for any index greater than `len()` (and `true` at `len()`), so the `<= text.len()` conjuncts can never change the result.","fix":"Drop the redundant `&& cursor <= text.len()` / `&& anchor <= text.len()` conditions.","locations":[{"ref":"winit-core/src/window.rs:1762-1772","code":" 1762 |         let cursor = if text.is_char_boundary(cursor) && cursor <= text.len() {\n 1763 |             cursor\n 1764 |         } else {\n 1765 |             return Err(ImeSurroundingTextError::CursorBadPosition);\n 1766 |         };\n 1767 | \n 1768 |         let anchor = if text.is_char_boundary(anchor) && anchor <= text.len() {\n 1769 |             anchor\n 1770 |         } else {\n 1771 |             return Err(ImeSurroundingTextError::AnchorBadPosition);\n 1772 |         };","lines":11,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-core/src/window.rs#L1762-L1772"}]},{"id":"DEAD_8","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`ActiveEventLoop::data_transfer` first tests `if dnd.state().is_none_or(|state| state.transfer_id != id) { return Err(..) }` and then immediately re-checks `let Some(state) = dnd.state() else { return Err(..) };`. After the first guard the state is always present with a matching id, so the second `else` branch is unreachable and the re-fetch is redundant.","fix":"Fold into a single match/`if let` that both checks presence and the `transfer_id` and binds `state` once.","locations":[{"ref":"winit-x11/src/event_loop.rs:766-778","code":"  766 |     fn data_transfer(&self, id: DataTransferId) -> Result<Box<dyn DataTransfer>, RequestError> {\n  767 |         let dnd = self.dnd.borrow();\n  768 | \n  769 |         if dnd.state().is_none_or(|state| state.transfer_id != id) {\n  770 |             return Err(RequestError::Ignored);\n  771 |         }\n  772 | \n  773 |         let Some(state) = dnd.state() else {\n  774 |             return Err(RequestError::Ignored);\n  775 |         };\n  776 | \n  777 |         Ok(Box::new(Selection::new(state.types.clone())))\n  778 |     }","lines":13,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-x11/src/event_loop.rs#L766-L778"}]},{"id":"DEAD_9","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"In `EventLoopExtStartupNotify::read_token_from_env`, when both `x11_platform` and `wayland_platform` are enabled (the default build) two `let _is_wayland` bindings are emitted: `#[cfg(x11_platform)] let _is_wayland = false;` immediately followed by `#[cfg(wayland_platform)] let _is_wayland = self.is_wayland();`. The first binding is always shadowed and dead in the common default configuration. The `_`-prefix hides the unused-variable warning, so the dead initializer passes silently. It works but is confusing to read.","fix":"Restructure so exactly one binding is active, e.g. use `cfg!(wayland_platform)` at runtime combined with a single `let is_wayland = { #[cfg(wayland_platform)] { self.is_wayland() } #[cfg(not(...))] { false } };`, or gate the whole `false` fallback with `#[cfg(all(x11_platform, not(wayland_platform)))]`.","locations":[{"ref":"winit/src/platform/startup_notify.rs:62-72","code":"   62 |         #[cfg(x11_platform)]\n   63 |         let _is_wayland = false;\n   64 |         #[cfg(wayland_platform)]\n   65 |         let _is_wayland = self.is_wayland();\n   66 | \n   67 |         if _is_wayland {\n   68 |             env::var(WAYLAND_VAR).ok().map(ActivationToken::from_raw)\n   69 |         } else {\n   70 |             env::var(X11_VAR).ok().map(ActivationToken::from_raw)\n   71 |         }\n   72 |     }","lines":11,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit/src/platform/startup_notify.rs#L62-L72"}]},{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"Every `MIN` constant doc says it \"is equal to\"/\"of [`f64::MAX`]\", but the value is `LogicalUnit::new(f64::MIN)` / `PixelUnit::Logical(LogicalUnit::new(f64::MIN))`. The doc comment references the wrong constant (`f64::MAX` instead of `f64::MIN`).","fix":"Change each `MIN` doc comment from `Represents a minimum ... unit of [\\`f64::MAX\\`].` to `Represents a minimum ... unit that is equal to [\\`f64::MIN\\`].`.","locations":[{"ref":"dpi/src/lib.rs:137-138","code":"  137 |     /// Represents a minimum logical unit of [`f64::MAX`].\n  138 |     pub const MIN: LogicalUnit<f64> = LogicalUnit::new(f64::MIN);","lines":2,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/dpi/src/lib.rs#L137-L138"},{"ref":"dpi/src/lib.rs:231-232","code":"  231 |     /// Represents a minimum physical unit of [`f64::MAX`].\n  232 |     pub const MIN: LogicalUnit<f64> = LogicalUnit::new(f64::MIN);","lines":2,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/dpi/src/lib.rs#L231-L232"},{"ref":"dpi/src/lib.rs:325-326","code":"  325 |     /// Represents a minimum logical unit of [`f64::MAX`].\n  326 |     pub const MIN: PixelUnit = PixelUnit::Logical(LogicalUnit::new(f64::MIN));","lines":2,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/dpi/src/lib.rs#L325-L326"}]},{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The `SendData` doc comment claims \"it _does_ implement `From<Url>`\", but the only `url`-related `From` impl is `From<Vec<url::Url>>` (taking a `Vec` of URLs, not a single `Url`). There is no `From<url::Url>` impl. The doc misleads users into trying `SendData::from(single_url)`, which will not compile.","fix":"Change the doc to reference the actual impl, e.g. \"it _does_ implement `From<Vec<Url>>`\", or add an additional `impl From<url::Url> for SendData` if a single-URL conversion is intended.","locations":[{"ref":"winit-core/src/data_transfer.rs:390-393","code":"  390 |     /// Note that `SendData` implements `From<String>` and `From<Vec<u8>>`, but _not_\n  391 |     /// `From<Vec<String>>`, as it is not necessarily obvious to a reader that `Vec<String>`\n  392 |     /// will be interpreted as a URI list. However, it _does_ implement [`From<Url>`](url::Url),\n  393 |     /// if you are using the [`url`](https://docs.rs/url/2) crate.","lines":4,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-core/src/data_transfer.rs#L390-L393"},{"ref":"winit-core/src/data_transfer.rs:465-469","code":"  465 | impl From<Vec<url::Url>> for SendData {\n  466 |     fn from(value: Vec<url::Url>) -> Self {\n  467 |         Self::Uris(value.into_iter().map(Into::into).collect())\n  468 |     }\n  469 | }","lines":5,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-core/src/data_transfer.rs#L465-L469"}]},{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"`WindowProperties::new` documents the path format as `// /scheme/orbital/flags/x/y/w/h/t` but then parses with `path.splitn(6, '/')`, assigning the six results to `flags,x,y,w,h,title`. That split only yields the intended fields when the path uses the legacy colon-scheme form `orbital:flags/x/y/w/h/title` (no `/` before `flags`). For a genuine `/scheme/orbital/...` path the leading `/scheme/orbital/` segments would be mis-assigned (e.g. `flags = \"\"`, `x = \"scheme\"` -> parses to 0, `title` = the remaining `w/h/title`), so the comment contradicts the code the parser actually relies on. Note the `Display` impl builds the path from `ORBITAL_DISPLAY` (default `/scheme/orbital`), making the documented-vs-parsed formats inconsistent.","fix":"Make the comment describe the exact format the parser expects (the colon-scheme `orbital:flags/x/y/w/h/title`), or - if `fpath` can return `/scheme/orbital/...` - parse robustly by stripping the scheme prefix and splitting the trailing 6 components from the end so both formats work.","locations":[{"ref":"winit-orbital/src/lib.rs:107-119","code":"  107 | impl<'a> WindowProperties<'a> {\n  108 |     fn new(path: &'a str) -> Self {\n  109 |         // /scheme/orbital/flags/x/y/w/h/t\n  110 |         let mut parts = path.splitn(6, '/');\n  111 |         let flags = parts.next().unwrap_or(\"\");\n  112 |         let x = parts.next().map_or(0, |part| part.parse::<i32>().unwrap_or(0));\n  113 |         let y = parts.next().map_or(0, |part| part.parse::<i32>().unwrap_or(0));\n  114 |         let w = parts.next().map_or(0, |part| part.parse::<u32>().unwrap_or(0));\n  115 |         let h = parts.next().map_or(0, |part| part.parse::<u32>().unwrap_or(0));\n  116 |         let title = parts.next().unwrap_or(\"\");\n  117 |         Self { flags, x, y, w, h, title }\n  118 |     }\n  119 | }","lines":13,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-orbital/src/lib.rs#L107-L119"}]},{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The comment `// Ignore v2 since we are not interested in its events.` sits directly above `globals.bind(queue_handle, 1..=1, GlobalData)`, which binds *version 1* of the manager. The comment is misleading: nothing about \"v2 events\" is being ignored; the code simply requests version 1.","fix":"Remove or rewrite the comment to explain why version 1 is requested rather than a higher version.","locations":[{"ref":"winit-wayland/src/types/wp_tablet_input_v2.rs:49-51","code":"   49 |         // Ignore v2 since we are not interested in its events.\n   50 |         let manager = globals.bind(queue_handle, 1..=1, GlobalData)?;\n   51 |         Ok(Self { manager })","lines":3,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-wayland/src/types/wp_tablet_input_v2.rs#L49-L51"}]},{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment above `set_min_surface_size()` reads `/// Set maximum inner window size.`, but the function sets the *minimum* surface size. This is a copy-paste of the comment above `set_max_surface_size()` (which is correct). It is misleading to anyone reading the API.","fix":"Change the comment on `set_min_surface_size()` to `/// Set minimum inner window size.`.","locat // SAFETY: unsure that the state is dropped before the exit from the event loop.` It is tagged `SAFETY:` even though there is no `unsafe` code here, and `unsure` should be `ensure`. It misleads readers into thinking there is a soundness invariant being upheld.","fix":"Reword to a plain note, e.g. `// Ensure application state is dropped before returning from the event loop.`, and drop the `SAFETY:` prefix since nothing unsafe is involved.","locations":[{"ref":"winit/src/event_loop.rs:230-233","code":"  230 |             let result = self.event_loop.run_app_on_demand(&mut app);\n  231 |             // SAFETY: unsure that the state is dropped before the exit from the event loop.\n  232 |             drop(app);\n  233 |             result","lines":4,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit/src/event_loop.rs#L230-L233"}]},{"id":"CMT_8","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"The doc comment on `MainRunLoop::remove_observer` states \"This is also done automatically when the `MainRunLoopObserver` is dropped.\" combined with the body being a duplicate of `add_observer` (see the copy-paste finding), the comment describes behavior the method does not implement - the method does not remove anything. Even ignoring the copy-paste bug, the inline comment \"Same as in `add_observer`\" is misleading for a function whose job is the opposite.","fix":"Fix the method to actually remove the observer (see the copy-paste finding) and update the inline comment accordingly.","locations":[{"ref":"winit-common/src/core_foundation/main_run_loop.rs:129-135","code":"  129 |     /// Remove an observer from the main run loop.\n  130 |     ///\n  131 |     /// This is also done automatically when the [`MainRunLoopObserver`] is dropped.\n  132 |     pub fn remove_observer(&self, observer: &MainRunLoopObserver, mode: &CFRunLoopMode) {\n  133 |         // Same as in `add_observer`, accessing the main loop's observer is fine.\n  134 |         self.main_run_loop.add_observer(Some(&observer.observer), Some(mode));\n  135 |     }","lines":7,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-common/src/core_foundation/main_run_loop.rs#L129-L135"}]},{"id":"CMT_9","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Several rustdoc formatting/wording nits in `event.rs`: the platform bullets `- **Orbital: Always emits `(0., 0.)`.` have an unterminated bold marker (`**Orbital` is never closed), which renders incorrectly; and the `PointerButton` doc reads \"An mouse button press has been received\" (should be \"A mouse button press\").","fix":"Close the bold markers, e.g. `- **Orbital:** Always emits `(0., 0.)`.`, and fix \"An mouse\" to \"A mouse\".","locations":[{"ref":"winit-core/src/event.rs:260-260","code":"  260 |         /// - **Orbital: Always emits `(0., 0.)`.","lines":1,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-core/src/event.rs#L260"},{"ref":"winit-core/src/event.rs:308-309","code":"  308 |     /// An mouse button press has been received.\n  309 |     PointerButton {","lines":2,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-core/src/event.rs#L308-L309"},{"ref":"winit-core/src/event.rs:317-317","code":"  317 |         /// - **Orbital: Always emits `(0., 0.)`.","lines":1,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-core/src/event.rs#L317"}]},{"id":"CMT_10","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"`MonitorHandleProvider::id` doc says \"The representation of this modifier is not guaranteed\" - \"modifier\" is a copy/paste leftover; it should read \"identifier\" (or \"monitor id\" ","code":"  617 |     #[inline]\n  618 |     pub fn is_decorated(&mut self) -> bool {\n  619 |         let csd = self\n  620 |             .last_configure\n  621 |             .as_ref()\n  622 |             .map(|configure| configure.decoration_mode == DecorationMode::Client)\n  623 |             .unwrap_or(false);\n  624 |         if let Some(frame) = csd.then_some(self.frame.as_ref()).flatten() {\n  625 |             !frame.is_hidden()\n  626 |         } else {\n  627 |             // Server side decorations.\n  628 |             true\n  629 |         }\n  630 |     }","lines":14,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-wayland/src/window/state.rs#L617-L630"}]},{"id":"OTHER_2","type":"other","type_label":"Other","severity":"negligible","difficulty":"easy","description":"`EventLoop::run_app` gates its body on `any(windows_platform, macos_platform, android_platform, orbital_platform, x11_platform, wayland_platform)`, `web_platform`, and `ios_platform`, but omits `docsrs` from every arm, whereas the sibling `EventLoopExtPumpEvents` / `EventLoopExtRunOnDemand` impls in the same file explicitly include `docsrs` in their cfg lists. If a doc build ever sets `docsrs` without also selecting a concrete platform, `run_app` would have no active body and fail to return its `Result<(), EventLoopError>`. This does not bite today because docs.rs builds always target a real platform, but it is an inconsistency in the cfg strategy of this file.","fix":"Make the cfg strategy consistent: either drop `docsrs` from the `pump_app_events`/`run_on_demand` impls too, or ensure `run_app` still yields a value under a bare-`docsrs` configuration (e.g. a final fallback arm), so all three entry points share the same platform-selection contract.","locations":[{"ref":"winit/src/event_loop.rs:216-244","code":"  216 |     #[allow(unused_mut)]\n  217 |     pub fn run_app<A: ApplicationHandler + 'static>(\n  218 |         mut self,\n  219 | (function(){

// Data

const SEVS     = ['critical','high','medium','low','negligible'];

const ALL_TYPES = [...new Set(FINDINGS.map(f => f.type))].sort();
// Build lookup map for O(1) access
const FINDING_BY_ID = new Map(FINDINGS.map(f => [f.id, f]));
// Only severities actually present in the report — the filter bar hides the rest.

// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};
const PRESENT_DIFFS = DIFFICULTY_ORDER.filter(d => FINDINGS.some(f => f.difficulty === d));

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// URL hash — debounced so rapid filter changes don't thrash history

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
