":"Use `dmDisplayFrequency.saturating_mul(1000)` (or `checked_mul`).","locations":[{"ref":"winit-win32/src/monitor.rs:54-58","code":"   54 |         let mode = VideoMode::new(\n   55 |             (native_video_mode.dmPelsWidth, native_video_mode.dmPelsHeight).into(),\n   56 |             NonZeroU16::new(native_video_mode.dmBitsPerPel as u16),\n   57 |             NonZeroU32::new(native_video_mode.dmDisplayFrequency * 1000),\n   58 |         );","lines":5,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-win32/src/monitor.rs#L54-L58"}]},{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`preedit_draw_callback` computes the change range as `call_data.chg_first as usize..(call_data.chg_first + call_data.chg_length) as usize`. `chg_first` and `chg_length` are `c_int` (i32) supplied by the IME server; the addition `chg_first + chg_length` is performed in `i32` before the cast, so a malicious or buggy IME can overflow it (panic in debug builds), and a negative `chg_first` casts to a huge `usize`. The bounds check that follows only catches the oversized-`usize` case, not the arithmetic overflow.","fix":"Do the arithmetic in a wider/checked form and validate the raw inputs first, e.g. `if call_data.chg_first < 0 || call_data.chg_length < 0 { return; }` then `let end = (call_data.chg_first as usize).checked_add(call_data.chg_length as usize);` and bail if `None` or if it exceeds `client_data.text.len()`.","locations":[{"ref":"winit-x11/src/ime/context.rs:93-103","code":"   93 |     let chg_range =\n   94 |         call_data.chg_first as usize..(call_data.chg_first + call_data.chg_length) as usize;\n   95 |     if chg_range.start > client_data.text.len() || chg_range.end > client_data.text.len() {\n   96 |         tracing::warn!(\n   97 |             \"invalid chg range: buffer length={}, but chg_first={} chg_length={}\",\n   98 |             client_data.text.len(),\n   99 |             call_data.chg_first,\n  100 |             call_data.chg_length\n  101 |         );\n  102 |         return;\n  103 |     }","lines":11,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-x11/src/ime/context.rs#L93-L103"}]},{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"easy","description":"`timeout.as_millis() as usize` casts a `u128` to `usize`; on a 32-bit target (Redox supports i586) a timeout larger than ~49 days would truncate. Combined with the millisecond truncation this is only a theoretical concern, but the cast is unchecked.","fix":"Use `usize::try_from(timeout.as_millis()).unwrap_or(usize::MAX)` (or clamp) instead of `as usize`.","locations":[{"ref":"winit-orbital/src/event_loop.rs:687-687","code":"  687 |                     UserData::from_user_data(timeout.as_millis() as usize),","lines":1,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-orbital/src/event_loop.rs#L687"}]},{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"easy","description":"Horizontal-wheel delta is negated as `i16` before the `as f32` cast (`-value` binds tighter than `as`): `let value = -value as f32 / WHEEL_DELTA as f32;`. If `value == i16::MIN` the `i16` negation overflows (debug panic / release wrap). The same pattern appears in raw-input horizontal-wheel handling. In practice wheel deltas are small multiples of `120`, so this is only a theoretical concern.","fix":"Cast to `f32` first, then negate: `let value = -(value as f32) / WHEEL_DELTA as f32;`.","locations":[{"ref":"winit-win32/src/event_loop.rs:1807-1808","code":" 1807 |             let value = (wparam >> 16) as i16;\n 1808 |             let value = -value as f32 / WHEEL_DELTA as f32; // NOTE: inverted! See https://github.com/rust-windowing/winit/pull/2105/","lines":2,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-win32/src/event_loop.rs#L1807-L1808"},{"ref":"winit-win32/src/event_loop.rs:2587-2590","code":" 2587 |         if util::has_flag(button_flags as u32, RI_MOUSE_HWHEEL) {\n 2588 |             let button_data = unsafe { mouse.Anonymous.Anonymous.usButtonData } as i16;\n 2589 |             let delta = -button_data as f32 / WHEEL_DELTA as f32;\n 2590 |             userdata.send_device_event(device_id, MouseWheel { delta: LineDelta(delta, 0.0) });","lines":4,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-win32/src/event_loop.rs#L2587-L2590"}]},{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In `PointerHandler::on_pointer_move`, when a chorded button change occurs during a `pointermove`, the pressed/released state is computed with `event::pointer_buttons(&event).contains(ButtonsState::from_bits_retain(button))`. Here `button` is the *button index* returned by `raw_button` (`0`=left, `1`=middle, `2`=right, `3`=back, `4`=forward), but `ButtonsState::from_bits_retain` interprets that integer as a *bitmask*. The `buttons` bitmask uses `LEFT=0b1`, `RIGHT=0b10`, `MIDDLE=0b100`, ... so the index and the mask do not line up. Concretely: `button==0` (left) yields `from_bits_retain(0)` = empty, and `empty_set.contains(empty)` is always `true`, so releasing the left button while another is held is reported as `ElementState::Pressed`. `button==1` (middle) checks the `LEFT` bit instead of the `MIDDLE` bit, etc. The state is therefore wrong for every button except right (which coincidentally maps `2`->`0b10`).","fix":"Map the button *index* to its `ButtonsState` bit before testing membership instead of calling `ButtonsState::from_bits_retain(button)`. For example add a helper `fn button_index_to_mask(button: u16) -> ButtonsState` returning `LEFT` for `0`, `MIDDLE` for `1`, `RIGHT` for `2`, `BACK` for `3`, `FORWARD` for `4`, then use `event::pointer_buttons(&event).contains(button_index_to_mask(button))`.","locations":[{"ref":"winit-web/src/web_sys/pointer.rs:210-216","code":"  210 |                     let state = if event::pointer_buttons(&event)\n  211 |                         .contains(ButtonsState::from_bits_retain(button))\n  212 |                     {\n  213 |                         ElementState::Pressed\n  214 |                     } else {\n  215 |                         ElementState::Released\n  216 |                     };","lines":7,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-web/src/web_sys/pointer.rs#L210-L216"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`WinIcon::from_rgba` mutates the caller's icon pixel buffer through a shared reference, which is undefined behavior and an observable logic bug. `rgba.buffer()` returns `&[u8]` (an immutable borrow), but the code casts it to `*mut Pixel` and writes through it:\n```\nlet pixels = unsafe {\n    std::slice::from_raw_parts_mut(rgba.buffer().as_ptr() as *mut Pixel, pixel_count)\n};\nfor pixel in pixels {\n    and_mask.push(pixel.a.wrapping_sub(u8::MAX));\n    pixel.convert_to_bgra(); // swaps r/b IN THE CALLER'S BUFFER\n}\n```\nMutating data behind a `&` reference violates Rust's aliasing rules (UB). It is also a concrete bug: `RgbaIcon` is typically shared (e.g. behind `Arc`), so building an icon from the same `RgbaIcon` twice swaps `r`/`b` twice, feeding `CreateIcon` `RGB` data the second time and producing wrong colors. Compare with `WinCursor::new`, which correctly copies first via `Vec::from(image.buffer())`.","fix":"Copy the buffer before mutating, mirroring `WinCursor::new`. Build a `Vec<Pixel>` (or `Vec<u8>`) from `rgba.buffer()`, compute `and_mask` and the BGRA swap on the copy, and pass the copy's pointer to `CreateIcon`. Never cast a `&[u8]` from `buffer()` to `*mut`.","locations":[{"ref":"winit-win32/src/icon.rs:96-123","code":"   96 |     pub(crate) fn from_rgba(rgba: &RgbaIcon) -> Result<Self, BadIcon> {\n   97 |         let pixel_count = rgba.buffer().len() / PIXEL_SIZE;\n   98 |         let mut and_mask = Vec::with_capacity(pixel_count);\n   99 |         let pixels = unsafe {\n  100 |             std::slice::from_raw_parts_mut(rgba.buffer().as_ptr() as *mut Pixel, pixel_count)\n  101 |         };\n  102 |         for pixel in pixels {\n  103 |             and_mask.push(pixel.a.wrapping_sub(u8::MAX)); // invert alpha channel\n  104 |             pixel.convert_to_bgra();\n  105 |         }\n  106 |         assert_eq!(and_mask.len(), pixel_count);\n  107 |         let handle = unsafe {\n  108 |             CreateIcon(\n  109 |                 ptr::null_mut(),\n  110 |                 rgba.width() as i32,\n  111 |                 rgba.height() as i32,\n  112 |                 1,\n  113 |                 (PIXEL_SIZE * 8) as u8,\n  114 |                 and_mask.as_ptr(),\n  115 |                 rgba.buffer().as_ptr(),\n  116 |             )\n  117 |         };\n  118 |         if !handle.is_null() {\n  119 |             Ok(WinIcon::from_handle(handle))\n  120 |         } else {\n  121 |             Err(BadIcon::OsError(io::Error::last_os_error()))\n  122 |         }\n  123 |     }","lines":28,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-win32/src/icon.rs#L96-L123"}]},{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"The X11 drag-and-drop `DragState` is never cleared. `Dnd::init_state` uses `self.state.get_or_insert(..)`, which returns the *existing* state and silently discards the new `version`, `source_window`, `types` and freshly-allocated `transfer_id` whenever a `DragState` is already present. No handler ever resets `Dnd::state` back to `None`: `XdndLeave` only emits `DragLeft`, and `XdndDrop` / `send_finished` leave the state in place. As a result the first drag works, but every subsequent drag reuses the stale `source_window`, `types` and `transfer_id` from the first drag, so `DragEntered` reports the wrong transfer id and data fetches target the wrong window.","fix":"Reset the state at the end of a drag: set `self.state = None` in the `XdndLeave` handler and after `send_finished` succeeds in the `XdndDrop` path (and in `selection_notify` once the last pending fetch finishes). Change `init_state` to overwrite unconditionally (`self.state = Some(DragState { .. }); self.state.as_ref().unwrap()`) so a new `XdndEnter` always starts fresh.","locations":[{"ref":"winit-x11/src/dnd.rs:254-268","code":"  254 |     pub fn init_state(\n  255 |         &mut self,\n  256 |         version: c_long,\n  257 |         source_window: xproto::Window,\n  258 |         target_window: xproto::Window,\n  259 |         types: Arc<[SelectionType]>,\n  260 |     ) -> &DragState {\n  261 |         self.state.get_or_insert(DragState {\n  262 |             version,\n  263 |             types,\n  264 |             source_window,\n  265 |             target_window,\n  266 |             ..Default::default()\n  267 |         })\n  268 |     }","lines":15,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-x11/src/dnd.rs#L254-L268"},{"ref":"winit-x11/src/event_processor.rs:584-592","code":"  584 |         if xev.message_type == atoms[XdndLeave] as c_ulong {\n  585 |             let dnd = self.target.dnd.borrow();\n  586 |             let Some(state) = dnd.state() else {\n  587 |                 return;\n  588 |             };\n  589 |             app.window_event(&self.target, window_id, WindowEvent::DragLeft {\n  590 |                 id: state.transfer_id,\n  591 |             });\n  592 |         }","lines":9,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-x11/src/event_processor.rs#L584-L592"},{"ref":"winit-x11/src/event_processor.rs:540-582","code":"  540 |         if xev.message_type == atoms[XdndDrop] as c_ulong {\n  541 |             let (source_window, transfer_id) = {\n  542 |                 let dnd = self.target.dnd.borrow();\n  543 |                 let Some(state) = dnd.state() else {\n  544 |                     warn!(\"Received `XdndDrop` without `XdndEnter`\");\n  545 |                     return;\n  546 |                 };\n  547 |                 let source_window = state.source_window;\n  548 | \n  549 |                 (source_window, state.transfer_id)\n  550 |             };\n  551 | \n  552 |             app.window_event(\n  553 |                 &self.target,\n  554 |                 window_id,\n  555 |                 // TODO\n  556 |                 WindowEvent::DragDropped {\n  557 |                     id: transfer_id,\n  558 |                     // `Copy` is the default. Other actions are possible in X11, but the\n  559 |                     // specification does not properly explain how to implement\n  560 |                     // them (only giving a vague description of `XdndMove`). For\n  561 |                     // simplicity's sake, we simply do not implement non-copy drag\n  562 |                     // on X11.\n  563 |                     // See https://www.freedesktop.org/wiki/Specifications/XDND/\n  564 |                     proposed_action: Some(DndAction::Copy),\n  565 |                 },\n  566 |             );\n  567 | \n  568 |             let mut dnd = self.target.dnd.borrow_mut();\n  569 | \n  570 |             if let Some(state) =\n  571 |                 dnd.state_mut().filter(|state| !state.pending_fetch_types.is_empty())\n  572 |             {\n  573 |                 state.finished = Some((window, source_window));\n  574 |             } else {\n  575 |                 unsafe {\n  576 |                     dnd.send_finished(window, source_window)\n  577 |                         .expect(\"Failed to send `XdndFinished` message.\");\n  578 |                 }\n  579 |             }\n  580 | \n  581 |             return;\n  582 |         }","lines":43,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-x11/src/event_processor.rs#L540-L582"}]},{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The `MainEvent::ConfigChanged` handler computes `old_scale_factor` and `scale_factor` from two back-to-back calls to `scale_factor(&self.android_app)`, so they are always identical. The guard `(scale_factor - old_scale_factor).abs() < f64::EPSILON` is therefore always true, and the condition is also inverted relative to intent (a change should fire when the values differ, i.e. `>= f64::EPSILON`). No previous scale factor is persisted anywhere, so real scale-factor changes can never be detected and a `ScaleFactorChanged` event is emitted on every single config change regardless of whether the scale factor actually changed.","fix":"Store the last-seen scale factor on `EventLoop` (a field), and in `ConfigChanged` compare the freshly computed `scale_factor` against the stored previous value, firing `ScaleFactorChanged` only when `(new - old).abs() >= f64::EPSILON`, then update the stored value.","locations":[{"ref":"winit-android/src/event_loop.rs:209-223","code":"  209 |                 MainEvent::ConfigChanged { .. } => {\n  210 |                     let old_scale_factor = scale_factor(&self.android_app);\n  211 |                     let scale_factor = scale_factor(&self.android_app);\n  212 |                     if (scale_factor - old_scale_factor).abs() < f64::EPSILON {\n  213 |                         let new_surface_size = Arc::new(Mutex::new(screen_size(&self.android_app)));\n  214 |                         let event = event::WindowEvent::ScaleFactorChanged {\n  215 |                             surface_size_writer: SurfaceSizeWriter::new(Arc::downgrade(\n  216 |                                 &new_surface_size,\n  217 |                             )),\n  218 |                             scale_factor,\n  219 |                         };\n  220 | \n  221 |                         app.window_event(&self.window_target, GLOBAL_WINDOW, event);\n  222 |                     }\n  223 |                 },","lines":15,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-android/src/event_loop.rs#L209-L223"}]},{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"Refresh-rate computation from the `CVDisplayLink` nominal output period does integer division *before* scaling to millihertz, discarding the fractional part of the rate. The period is `timeValue / timeScale` seconds, so the rate in millihertz is `timeScale * 1000 / timeValue`, but the code computes `(timeScale / timeValue) * 1000`. For any non-integer refresh rate (e.g. 59.94 Hz with `timeScale = 60000`, `timeValue = 1001`) this yields `59 * 1000 = 59000` mHz instead of the correct `59940` mHz. Displays reporting fractional rates get a truncated value.","fix":"Multiply before dividing:\n```rust\n(time.timeScale as i64 * 1000)\n    .checked_div(time.timeValue)\n    .map(|v| v as u32)\n    .and_then(NonZeroU32::new)\n```","locations":[{"ref":"winit-appkit/src/monitor.rs:343-346","code":"  343 |     (time.timeScale as i64)\n  344 |         .checked_div(time.timeValue)\n  345 |         .map(|v| (v * 1000) as u32)\n  346 |         .and_then(NonZeroU32::new)","lines":4,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-appkit/src/monitor.rs#L343-L346"}]},{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`Force::normalized` divides by `altitude.sin()` when converting the axial force to a perpendicular force: `force / altitude.sin()`. The docs state the reported force is measured \"along the axis of the pencil\" and `altitude` is the angle between the tool and the surface plane (`0` = parallel, `π/2` = perpendicular). The component of an axial force that is perpendicular to the surface is `force * sin(altitude)`, not `force / sin(altitude)`. The current formula blows up toward infinity as the tool approaches parallel (`altitude → 0`) instead of going to zero. The unit test `test_force_normalize` only exercises `altitude = π/2` (where `sin = 1`), so it cannot distinguish `*` from `/`.","fix":"Multiply by `sin(altitude)` instead of dividing:\n```rust\nSome(TabletToolAngle { altitude, .. }) => force * altitude.sin(),\n```","locations":[{"ref":"winit-core/src/event.rs:1136-1148","code":" 1136 |     pub fn normalized(&self, angle: Option<TabletToolAngle>) -> f64 {\n 1137 |         match self {\n 1138 |             Force::Calibrated { force, max_possible_force } => {\n 1139 |                 let force = match angle {\n 1140 |                     Some(TabletToolAngle { altitude, .. }) => force / altitude.sin(),\n 1141 |                     None => *force,\n 1142 |                 };\n 1143 |                 force / max_possible_force\n 1144 |             },\n 1145 |             Force::Normalized(force) => *force,\n 1146 |         }\n 1147 |     }\n 1148 | }","lines":13,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-core/src/event.rs#L1136-L1148"}]},{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`TabletToolAngle::default()` sets `altitude` to `f64::consts::FRAC_2_PI` (which is `2/π ≈ 0.6366` rad ≈ 36.5°), but the field documentation explicitly states that the default altitude is `π/2` (perpendicular to the surface): \"`π/2` means the tool is perpendicular to the surface and is the default.\" The correct constant is `f64::consts::FRAC_PI_2` (`π/2 ≈ 1.5708`). This is almost certainly a copy/typo error (`FRAC_2_PI` vs `FRAC_PI_2`). Any code relying on `TabletToolAngle::default()` will get a tool tilted ~36° instead of perpendicular.","fix":"Replace `f64::consts::FRAC_2_PI` with `f64::consts::FRAC_PI_2`:\n```rust\nimpl Default for TabletToolAngle {\n    fn default() -> Self {\n        Self { altitude: f64::consts::FRAC_PI_2, azimuth: 0. }\n    }\n}\n```","locations":[{"ref":"winit-core/src/event.rs:1356-1360","code":" 1356 | impl Default for TabletToolAngle {\n 1357 |     fn default() -> Self {\n 1358 |         Self { altitude: f64::consts::FRAC_2_PI, azimuth: 0. }\n 1359 |     }\n 1360 | }","lines":5,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-core/src/event.rs#L1356-L1360"}]},{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`Window::set_decorations()` on Wayland does not wake the event loop after mutating decoration state, unlike every other double-buffered setter in the same file. `WindowState::set_decorate()` changes the decoration mode (`request_decoration_mode`), hides/shows the CSD frame and calls `resize()` (which issues `set_window_geometry` / viewport requests). These are buffered protocol requests that need the loop to be woken to be flushed/committed. Compare `set_blur()`, `set_resizable()`, `set_min_surface_size()` and `set_max_surface_size()`, which all call `self.request_redraw()` with a `// NOTE: Requires commit to be applied.` comment. As a result, toggling decorations may not take visible effect until the next unrelated event.","fix":"Make `set_decorate()` report whether it changed anything (like `set_resizable`/`set_blur`) and request a redraw when it did, or unconditionally call `self.request_redraw()` after `set_decorate()`:\n```rust\nfn set_decorations(&self, decorate: bool) {\n    self.window_state.lock().unwrap().set_decorate(decorate);\n    self.request_redraw();\n}\n```","locations":[{"ref":"winit-wayland/src/window/mod.rs:507-510","code":"  507 |     #[inline]\n  508 |     fn set_decorations(&self, decorate: bool) {\n  509 |         self.window_state.lock().unwrap().set_decorate(decorate)\n  510 |     }","lines":4,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-wayland/src/window/mod.rs#L507-L510"},{"ref":"winit-wayland/src/window/mod.rs:500-505","code":"  500 |     #[inline]\n  501 |     fn set_blur(&self, blur: bool) {\n  502 |         if self.window_state.lock().unwrap().set_blur(blur) {\n  503 |             self.request_redraw();\n  504 |         }\n  505 |     }","lines":6,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-wayland/src/window/mod.rs#L500-L505"}]},{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`Event::BufferedScaleFactorChanged` dispatch dereferences the window userdata pointer without a null check:\n```\nlet window_flags = unsafe {\n    let userdata = get_window_long(window, GWL_USERDATA) as *mut WindowData;\n    (*userdata).window_state_lock().window_flags\n};\n```\nA `ScaleFactorChanged` event can be buffered (when the runner is re-entrant) and dispatched later from `dispatch_buffered_events`. If the target window was destroyed in the meantime, `GWL_USERDATA` is `0` (`WM_NCDESTROY` sets it to `0`) and `(*userdata)` dereferences a null pointer -> UB / crash.","fix":"Check the pointer before dereferencing:\n```\nlet userdata = get_window_long(window, GWL_USERDATA) as *mut WindowData;\nif userdata.is_null() { return; }\nlet window_flags = (*userdata).window_state_lock().window_flags;\n```","locations":[{"ref":"winit-win32/src/event_loop/runner.rs:614-621","code":"  614 |                 if surface_size != new_surface_size {\n  615 |                     let window_flags = unsafe {\n  616 |                         let userdata = get_window_long(window, GWL_USERDATA) as *mut WindowData;\n  617 |                         (*userdata).window_state_lock().window_flags\n  618 |                     };\n  619 | \n  620 |                     window_flags.set_size(window, surface_size);\n  621 |                 }","lines":8,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-win32/src/event_loop/runner.rs#L614-L621"}]},{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`Window::outer_position` returns `Result<PhysicalPosition<i32>, RequestError>` but never propagates the error: it does `WindowArea::Outer.get_rect(..).map(|rect| Ok(..)).expect(\"Unexpected GetWindowRect failure ..\")`. The `.map` double-wraps the success value into `Ok(Ok(..))` and the `.expect` panics on the *outer* `io::Error` instead of converting it into the `Err` variant the signature promises. `outer_size` has the same shape with `.unwrap()`. A transient `GetWindowRect` failure therefore panics instead of returning `Err`.","fix":"Map the `io::Error` into the error type and use `?`/`map_err`, e.g. `self.get_rect(..).map(|rect| PhysicalPosition::new(rect.left, rect.top)).map_err(|e| os_error!(e).into())`, dropping the redundant inner `Ok(..)`.","locations":[{"ref":"winit-win32/src/window.rs:464-472","code":"  464 |     fn outer_position(&self) -> Result<PhysicalPosition<i32>, RequestError> {\n  465 |         util::WindowArea::Outer\n  466 |             .get_rect(self.hwnd())\n  467 |             .map(|rect| Ok(PhysicalPosition::new(rect.left, rect.top)))\n  468 |             .expect(\n  469 |                 \"Unexpected GetWindowRect failure; please report this error to \\\n  470 |                  rust-windowing/winit\",\n  471 |             )\n  472 |     }","lines":9,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-win32/src/window.rs#L464-L472"},{"ref":"winit-win32/src/window.rs:515-522","code":"  515 |     fn outer_size(&self) -> PhysicalSize<u32> {\n  516 |         util::WindowArea::Outer\n  517 |             .get_rect(self.hwnd())\n  518 |             .map(|rect| {\n  519 |                 PhysicalSize::new((rect.right - rect.left) as u32, (rect.bottom - rect.top) as u32)\n  520 |             })\n  521 |             .unwrap()\n  522 |     }","lines":8,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-win32/src/window.rs#L515-L522"}]},{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"The no-backend error branch in `EventLoop::new` builds diagnostic messages whose leading clauses are swapped relative to the conditions that select them, producing misleading errors. In the branch `if wayland_display && !cfg!(wayland_platform)` (Wayland *is* present in the environment but the `wayland` feature is disabled) the message text is `\"DISPLAY is not set; note: enable the `winit/wayland` feature to support Wayland\"` - the \"DISPLAY is not set\" clause describes the X11 variable being absent, which is unrelated to and contradicts the actual condition (a non-empty `WAYLAND_DISPLAY`/`WAYLAND_SOCKET` was detected). Symmetrically, the branch `else if x11_display && !cfg!(x11_platform)` emits `\"neither WAYLAND_DISPLAY nor WAYLAND_SOCKET is set; note: enable the `winit/x11` feature to support X11\"`, describing the Wayland variables being absent even though the condition fired because `DISPLAY` *was* set. A user who built winit without the matching feature gets an error that flatly denies the env var they actually have set.","fix":"Rewrite each message so its body matches its own condition, e.g.:\n```rust\nlet msg = if wayland_display && !cfg!(wayland_platform) {\n    \"WAYLAND_DISPLAY/WAYLAND_SOCKET is set; note: enable the `winit/wayland` feature to support Wayland\"\n} else if x11_display && !cfg!(x11_platform) {\n    \"DISPLAY is set; note: enable the `winit/x11` feature to support X11\"\n} else {\n    \"neither WAYLAND_DISPLAY nor WAYLAND_SOCKET nor DISPLAY is set.\"\n};\n```","locations":[{"ref":"winit/src/platform_impl/linux/mod.rs:106-117","code":"  106 |             (_, wayland_display, x11_display) => {\n  107 |                 let msg = if wayland_display && !cfg!(wayland_platform) {\n  108 |                     \"DISPLAY is not set; note: enable the `winit/wayland` feature to support \\\n  109 |                      Wayland\"\n  110 |                 } else if x11_display && !cfg!(x11_platform) {\n  111 |                     \"neither WAYLAND_DISPLAY nor WAYLAND_SOCKET is set; note: enable the \\\n  112 |                      `winit/x11` feature to support X11\"\n  113 |                 } else {\n  114 |                     \"neither WAYLAND_DISPLAY nor WAYLAND_SOCKET nor DISPLAY is set.\"\n  115 |                 };\n  116 |                 return Err(NotSupportedError::new(msg).into());\n  117 |             },","lines":12,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit/src/platform_impl/linux/mod.rs#L106-L117"}]},{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`ImeSurroundingText::new` rejects text with `if text.len() < 4000 { text } else { return Err(TextTooLong) }`. The public constant `MAX_TEXT_BYTES = 4000` and the docs say the text \"must be limited to 4000 bytes\", but `< 4000` rejects a valid exactly-4000-byte string (off-by-one). The check also hardcodes `4000` instead of referencing `Self::MAX_TEXT_BYTES`, so the two can drift.","fix":"Use `if text.len() <= Self::MAX_TEXT_BYTES { text } else { return Err(ImeSurroundingTextError::TextTooLong) }`.","locations":[{"ref":"winit-core/src/window.rs:1756-1760","code":" 1756 |         let text = if text.len() < 4000 {\n 1757 |             text\n 1758 |         } else {\n 1759 |             return Err(ImeSurroundingTextError::TextTooLong);\n 1760 |         };","lines":5,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-core/src/window.rs#L1756-L1760"}]},{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`refresh_rate_millihertz` (UIKit monitor) reads `UIScreen::maximumFramesPerSecond()` (a value in frames-per-second, i.e. hertz) and computes `NonZeroU32::new(refresh_rate_millihertz as u32 * 1000)`. Naming aside the arithmetic happens to give the right hertz->millihertz conversion (60 fps -> 60000 mHz), but the intermediate binding is misleadingly named `refresh_rate_millihertz` while holding a value in hertz, and `as u32 * 1000` can overflow/wrap for pathological refresh values (and a negative `NSInteger`, though unexpected, would wrap when cast `as u32`).","fix":"Rename the intermediate to `refresh_rate_hertz`, and compute with a checked multiply, e.g. `u32::try_from(refresh_rate).ok().and_then(|hz| hz.checked_mul(1000)).and_then(NonZeroU32::new)`.","locations":[{"ref":"winit-uikit/src/monitor.rs:226-249","code":"  226 | fn refresh_rate_millihertz(uiscreen: &UIScreen) -> Option<NonZeroU32> {\n  227 |     let refresh_rate_millihertz: NSInteger = {\n  228 |         if available!(ios = 10.3, tvos = 10.2) {\n  229 |             uiscreen.maximumFramesPerSecond()\n  230 |         } else {\n  231 |             // https://developer.apple.com/library/archive/technotes/tn2460/_index.html\n  232 |             // https://en.wikipedia.org/wiki/IPad_Pro#Model_comparison\n  233 |             //\n  234 |             // All iOS devices support 60 fps, and on devices where `maximumFramesPerSecond` is not\n  235 |             // supported, they are all guaranteed to have 60hz refresh rates. This does not\n  236 |             // correctly handle external displays. ProMotion displays support 120fps, but they were\n  237 |             // introduced at the same time as the `maximumFramesPerSecond` API.\n  238 |             //\n  239 |             // FIXME: earlier OSs could calculate the refresh rate using\n  240 |             // `-[CADisplayLink duration]`.\n  241 |             tracing::warn!(\n  242 |                 \"`maximumFramesPerSecond` requires iOS 10.3+ or tvOS 10.2+. Defaulting to 60 fps\"\n  243 |             );\n  244 |             60\n  245 |         }\n  246 |     };\n  247 | \n  248 |     NonZeroU32::new(refresh_rate_millihertz as u32 * 1000)\n  249 | }","lines":24,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-uikit/src/monitor.rs#L226-L249"}]},{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`TouchHandler::cancel` iterates `seat_state.touch_map.drain()` and, if a window for a touch point is missing, executes `return` instead of `continue`:\n```\nlet scale_factor = match self.windows.get_mut().get(&window_id) {\n    Some(window) => window.lock().unwrap().scale_factor(),\n    None => return,\n};\n```\nA single missing window aborts the whole cancel loop: remaining touch points get no `PointerLeft` event, and the trailing `seat_state.first_touch_id = None;` reset is skipped, leaving stale primary-finger state on the seat.","fix":"Use `continue` instead of `return` inside the loop so other touch points are still processed, and ensure `first_touch_id` is reset regardless (it already is, once the early `return` is removed).","locations":[{"ref":"winit-wayland/src/seat/touch/mod.rs:193-215","code":"  193 |         for (id, touch_point) in seat_state.touch_map.drain() {\n  194 |             let window_id = crate::make_wid(&touch_point.surface);\n  195 |             let scale_factor = match self.windows.get_mut().get(&window_id) {\n  196 |                 Some(window) => window.lock().unwrap().scale_factor(),\n  197 |                 None => return,\n  198 |             };\n  199 | \n  200 |             let primary = seat_state.first_touch_id == Some(id);\n  201 |             let position = touch_point.location.to_physical(scale_factor);\n  202 | \n  203 |             self.events_sink.push_window_event(\n  204 |                 WindowEvent::PointerLeft {\n  205 |                     device_id: None,\n  206 |                     primary,\n  207 |                     position: Some(position),\n  208 |                     kind: PointerKind::Touch(FingerId::from_raw(id as usize)),\n  209 |                 },\n  210 |                 window_id,\n  211 |             );\n  212 |         }\n  213 | \n  214 |         seat_state.first_touch_id = None;\n  215 |     }","lines":23,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-wayland/src/seat/touch/mod.rs#L193-L215"}]},{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"Tablet tilt is converted with a truncating cast from `f64` degrees to `i8`:\n```\ndata.tool_state.tilt = Some(TabletToolTilt { x: tilt_x as i8, y: tilt_y as i8 });\n```\n`tilt_x`/`tilt_y` are fractional degrees. `as i8` truncates toward zero (e.g. `45.9 -> 45`, `-0.7 -> 0`), which is inconsistent with `winit_core`'s own conversion (`x.to_degrees().round() as i8`) and drops up to ~1 degree of precision on every event. (The similar `degrees as u16` for `twist` on line 167 has the same truncation-vs-round issue.)","fix":"Round before casting, e.g. `x: tilt_x.round() as i8, y: tilt_y.round() as i8` and `degrees.round() as u16`.","locations":[{"ref":"winit-wayland/src/types/wp_tablet_input_v2.rs:155-157","code":"  155 |             ToolEvent::Tilt { tilt_x, tilt_y } => {\n  156 |                 data.tool_state.tilt = Some(TabletToolTilt { x: tilt_x as i8, y: tilt_y as i8 });\n  157 |             },","lines":3,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-wayland/src/types/wp_tablet_input_v2.rs#L155-L157"},{"ref":"winit-wayland/src/types/wp_tablet_input_v2.rs:165-167","code":"  165 |             ToolEvent::Rotation { degrees } => {\n  166 |                 data.tool_state.twist = Some(degrees as u16);\n  167 |             },","lines":3,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-wayland/src/types/wp_tablet_input_v2.rs#L165-L167"}]},{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`PartialEq` and `Hash` for `PlatformSpecificEventLoopAttributes` compare/hash the address of a local binding rather than the closure. In `eq`, the arm `(Some(this), Some(other)) => std::ptr::eq(&this, &other)` takes `&this`/`&other` which are addresses of the match's local `&Box<...>` bindings (distinct stack slots), so `ptr::eq` is effectively always `false` even for the same hook. `hash` similarly does `std::ptr::hash(&self.msg_hook, state)`, hashing the address of the `msg_hook` field within `self` (position-dependent) instead of the pointed-to closure, so two logically-equal values hash differently, breaking the `Eq`/`Hash` contract.","fix":"Compare the underlying `Box` data pointers, e.g. `std::ptr::eq(this.as_ref() as *const _ as *const (), other.as_ref() as *const _ as *const ())` (comparing the fat-pointer data halves), and hash the same pointer value in `hash`. Or, since comparing closures is inherently dubious, drop `msg_hook` from the `Eq`/`Hash` consideration entirely and document it.","locations":[{"ref":"winit-win32/src/event_loop.rs:186-206","code":"  186 | impl PartialEq for PlatformSpecificEventLoopAttributes {\n  187 |     fn eq(&self, other: &Self) -> bool {\n  188 |         self.any_thread.eq(&other.any_thread)\n  189 |             && self.dpi_aware.eq(&other.dpi_aware)\n  190 |             && match (&self.msg_hook, &other.msg_hook) {\n  191 |                 (Some(this), Some(other)) => std::ptr::eq(&this, &other),\n  192 |                 (None, None) => true,\n  193 |                 _ => false,\n  194 |             }\n  195 |     }\n  196 | }\n  197 | \n  198 | impl Eq for PlatformSpecificEventLoopAttributes {}\n  199 | \n  200 | impl std::hash::Hash for PlatformSpecificEventLoopAttributes {\n  201 |     fn hash<H: std::hash::Hasher>(&self, state: &mut H) {\n  202 |         self.any_thread.hash(state);\n  203 |         self.dpi_aware.hash(state);\n  204 |         std::ptr::hash(&self.msg_hook, state);\n  205 |     }\n  206 | }","lines":21,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-win32/src/event_loop.rs#L186-L206"}]},{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`get_raw_input_device_list` sizes the buffer from the first `GetRawInputDeviceList` call (`num_devices`), then after the second call sets `buffer.set_len(num_devices as _)` even though the authoritative count actually written is the second call's return value `num_stored`. The equality is only a `debug_assert_eq!`; if the device count shrank between the two calls, `set_len(num_devices)` exposes uninitialized `RAWINPUTDEVICELIST` entries in release builds (UB). The function is currently `#[allow(dead_code)]` but the bug is latent.","fix":"Set the length from the actually-written count: `buffer.set_len(num_stored as _)`.","locations":[{"ref":"winit-win32/src/raw_input.rs:41-54","code":"   41 |     let mut buffer = Vec::with_capacity(num_devices as _);\n   42 | \n   43 |     let num_stored =\n   44 |         unsafe { GetRawInputDeviceList(buffer.as_mut_ptr(), &mut num_devices, list_size) };\n   45 | \n   46 |     if num_stored == u32::MAX {\n   47 |         return None;\n   48 |     }\n   49 | \n   50 |     debug_assert_eq!(num_devices, num_stored);\n   51 | \n   52 |     unsafe { buffer.set_len(num_devices as _) };\n   53 | \n   54 |     Some(buffer)","lines":14,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-win32/src/raw_input.rs#L41-L54"}]},{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`Window::is_visible` returns `Some(IsWindowVisible(hwnd) == 1)`. `IsWindowVisible` returns a `BOOL` that is documented only as non-zero/zero; comparing `== 1` can incorrectly report `false` if the API returns any other non-zero value.","fix":"Compare against zero: `IsWindowVisible(self.window.hwnd()) != 0`.","locations":[{"ref":"winit-win32/src/window.rs:450-452","code":"  450 |     fn is_visible(&self) -> Option<bool> {\n  451 |         Some(unsafe { IsWindowVisible(self.window.hwnd()) == 1 })\n  452 |     }","lines":3,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-win32/src/window.rs#L450-L452"}]},{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In the `XdndEnter` handler `has_more_types` is computed as `flags - (flags & (c_long::MAX - 1)) == 1`. This is an obscure way to extract bit 0 that also masks off the sign bit, so it only yields the correct result for non-negative `flags`; for a `flags` value with the high bit set the arithmetic is wrong. The spec bit being tested is simply bit 0.","fix":"Replace with `let has_more_types = flags & 1 == 1;`.","locations":[{"ref":"winit-x11/src/event_processor.rs:439-441","code":"  439 |                 let version = flags >> 24;\n  440 | \n  441 |                 let has_more_types = flags - (flags & (c_long::MAX - 1)) == 1;","lines":3,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-x11/src/event_processor.rs#L439-L441"}]},{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`Pixel::to_packed_argb` builds the packed CARDINAL by writing the bytes `b, g, r, a` into byte offsets `0..3` of a `Cardinal` (u32) and returning the integer. This yields the correct ARGB numeric value (`0xAARRGGBB`) only on little-endian hosts; on a big-endian host the same byte writes produce `0xBBGGRRAA`, so `_NET_WM_ICON` would receive garbled colors. Unlike the custom-cursor path (`util/cursor.rs`, which consults `needs_endian_swap()`), the icon path has no endianness handling. Additionally `assert_eq!(pixel_count, (icon.width() * icon.height()) as usize)` performs a `u32 * u32` multiply that can overflow (panicking in debug) for very large icons.","fix":"Construct the value arithmetically rather than via byte writes: `((self.a as u32) << 24) | ((self.r as u32) << 16) | ((self.g as u32) << 8) | (self.b as u32)`, which is endianness-independent. For the assert, compute the product as `u64` (`icon.width() as u64 * icon.height() as u64`).","locations":[{"ref":"winit-x11/src/util/icon.rs:18-31","code":"   18 | impl Pixel {\n   19 |     pub fn to_packed_argb(&self) -> Cardinal {\n   20 |         let mut cardinal = 0;\n   21 |         assert!(CARDINAL_SIZE >= PIXEL_SIZE);\n   22 |         let as_bytes = &mut cardinal as *mut _ as *mut u8;\n   23 |         unsafe {\n   24 |             *as_bytes.offset(0) = self.b;\n   25 |             *as_bytes.offset(1) = self.g;\n   26 |             *as_bytes.offset(2) = self.r;\n   27 |             *as_bytes.offset(3) = self.a;\n   28 |         }\n   29 |         cardinal\n   30 |     }\n   31 | }","lines":14,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-x11/src/util/icon.rs#L18-L31"},{"ref":"winit-x11/src/util/icon.rs:36","code":"   36 |     assert_eq!(pixel_count, (icon.width() * icon.height()) as usize);","lines":1,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-x11/src/util/icon.rs#L36"}]},{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`lookup_utf8`'s buffer-overflow branch reuses the byte count from the *first* `Xutf8LookupString` call for `vec.set_len(count as usize)` and the returned slice, only `debug_assert_eq!`-ing that the second call agreed. In a release build, if the second call returns fewer bytes (`new_count < count`), `set_len(count)` exposes the uninitialized tail of the `Vec`, and the returned slice includes uninitialized bytes (which then feed `str::from_utf8`).","fix":"Use the second call's `new_count` for the length: `unsafe { vec.set_len(new_count as usize) }; &vec[..new_count as usize]`, and treat a negative `new_count` as empty.","locations":[{"ref":"winit-x11/src/util/input.rs:92-102","code":"   92 |         let bytes = if status == ffi::XBufferOverflow {\n   93 |             vec = Vec::with_capacity(count as usize);\n   94 |             let (_, _, new_count) =\n   95 |                 self.lookup_utf8_inner(ic, key_event, vec.as_mut_ptr(), vec.capacity());\n   96 |             debug_assert_eq!(count, new_count);\n   97 | \n   98 |             unsafe { vec.set_len(count as usize) };\n   99 |             &vec[..count as usize]\n  100 |         } else {\n  101 |             unsafe { slice::from_raw_parts(buffer.as_ptr() as *const u8, count as usize) }\n  102 |         };","lines":11,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-x11/src/util/input.rs#L92-L102"}]},{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`set_theme_inner` maps `None` (no preferred theme / follow the system default) to the string `\"dark\"` for the `_GTK_THEME_VARIANT` property. This means calling `set_theme(None)` forcibly switches the window to dark mode rather than clearing the override / reverting to the desktop default - the opposite of the documented \"no preference\" semantics.","fix":"Handle `None` distinctly: either delete the `_GTK_THEME_VARIANT` property (via `delete_property`) so the GTK/WM default applies, or default to `\"light\"` if a value must be written. Do not silently force `\"dark\"`.","locations":[{"ref":"winit-x11/src/window.rs:971-984","code":"  971 |         let variant = match theme {\n  972 |             Some(Theme::Dark) => \"dark\",\n  973 |             Some(Theme::Light) => \"light\",\n  974 |             None => \"dark\",\n  975 |         };\n  976 |         let variant = CString::new(variant).expect(\"`_GTK_THEME_VARIANT` contained null byte\");\n  977 |         self.xconn.change_property(\n  978 |             self.xwindow,\n  979 |             hint_atom,\n  980 |             utf8_atom,\n  981 |             xproto::PropMode::REPLACE,\n  982 |             variant.as_bytes(),\n  983 |         )\n  984 |     }","lines":14,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-x11/src/window.rs#L971-L984"}]},{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`is_main_thread` on NetBSD relies on the main thread being named `\"main\"` (`std::thread::current().name() == Some(\"main\")`). This is a brittle heuristic: the Rust runtime does name the initial thread `\"main\"`, but this is not a guaranteed/stable contract, and any embedding that renames the thread or enters winit from an FFI-created thread will make the main-thread panic guard either misfire or fail to fire. Unlike the Linux (`gettid == getpid`) and other-BSD (`pthread_main_np`) paths, this one queries a cosmetic label rather than a real OS thread identity.","fix":"Use a real OS-level main-thread check on NetBSD, e.g. `_lwp_self()` compared against the process's initial LWP, or `pthread_main_np()` if available in the target's libc, instead of matching the thread name string.","locations":[{"ref":"winit/src/platform_impl/linux/mod.rs:194-197","code":"  194 | #[cfg(target_os = \"netbsd\")]\n  195 | fn is_main_thread() -> bool {\n  196 |     std::thread::current().name() == Some(\"main\")\n  197 | }","lines":4,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit/src/platform_impl/linux/mod.rs#L194-L197"}]},{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"very_easy","description":"In `Setting::parse` for `SettingType::Color`, the four `i16` channels are destructured as `(red, blue, green, alpha)` in wire order and stored as `[red, blue, green, alpha]`. Per the XSETTINGS spec the on-the-wire order is red, green, blue, alpha, so the variable named `blue` actually holds the green channel and vice versa. The stored array happens to preserve raw wire order, so nothing breaks today only because `SettingData::Color` is unused (`#[allow(dead_code)]`), but the naming is misleading and will bite anyone who starts consuming it.","fix":"Rename to match the wire order: `let (red, green, blue, alpha) = (parser.i16()?, parser.i16()?, parser.i16()?, parser.i16()?); SettingData::Color([red, green, blue, alpha])`.","locations":[{"ref":"winit-x11/src/xsettings.rs:121-127","code":"  121 |             SettingType::Color => {\n  122 |                 // Read i16's of color.\n  123 |                 let (red, blue, green, alpha) =\n  124 |                     (parser.i16()?, parser.i16()?, parser.i16()?, parser.i16()?);\n  125 | \n  126 |                 SettingData::Color([red, blue, green, alpha])\n  127 |             },","lines":7,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-x11/src/xsettings.rs#L121-L127"}]},{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"The associated constants `MAX`, `MIN` and `ZERO` on `impl<P> PhysicalUnit<P>` are declared with type `LogicalUnit<f64>` and built with `LogicalUnit::new(...)`, copy-pasted verbatim from the `LogicalUnit` impl above. As a result `PhysicalUnit::<P>::MAX`/`MIN`/`ZERO` actually yield `LogicalUnit` values, not `PhysicalUnit` values, which is a type-confusing API bug for anyone using these constants.","fix":"Change the three constants to the physical type, e.g. `pub const MAX: PhysicalUnit<f64> = PhysicalUnit::new(f64::MAX);`, `pub const MIN: PhysicalUnit<f64> = PhysicalUnit::new(f64::MIN);`, `pub const ZERO: PhysicalUnit<f64> = PhysicalUnit::new(0.0);`.","locations":[{"ref":"dpi/src/lib.rs:228-234","code":"  228 | impl<P> PhysicalUnit<P> {\n  229 |     /// Represents a maximum physical unit that is equal to [`f64::MAX`].\n  230 |     pub const MAX: LogicalUnit<f64> = LogicalUnit::new(f64::MAX);\n  231 |     /// Represents a minimum physical unit of [`f64::MAX`].\n  232 |     pub const MIN: LogicalUnit<f64> = LogicalUnit::new(f64::MIN);\n  233 |     /// Represents a physical unit of `0_f64`.\n  234 |     pub const ZERO: LogicalUnit<f64> = LogicalUnit::new(0.0);","lines":7,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/dpi/src/lib.rs#L228-L234"}]},{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"`MainRunLoop::remove_observer` calls `self.main_run_loop.add_observer(...)` instead of a removal function. This is a copy-paste of the body of `add_observer` (the comment even says \"Same as in `add_observer`\"). As written, calling `remove_observer` *adds* the observer a second time rather than removing it, leaving a duplicate registration on the main run loop (so the observer callback fires twice and is never actually removed). The only reason this does not currently break every consumer is that `MainRunLoopObserver::drop` independently calls `self.observer.invalidate()`, so the leftover registration is neutralized on drop.","fix":"Call the corresponding removal API, e.g. `self.main_run_loop.remove_observer(Some(&observer.observer), Some(mode))` (the `CFRunLoop` `removeObserver` wrapper), instead of `add_observer`.","locations":[{"ref":"winit-common/src/core_foundation/main_run_loop.rs:132-135","code":"  132 |     pub fn remove_observer(&self, observer: &MainRunLoopObserver, mode: &CFRunLoopMode) {\n  133 |         // Same as in `add_observer`, accessing the main loop's observer is fine.\n  134 |         self.main_run_loop.add_observer(Some(&observer.observer), Some(mode));\n  135 |     }","lines":4,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-common/src/core_foundation/main_run_loop.rs#L132-L135"}]},{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In `WinitView::pinch_gesture`, the `Cancelled | Failed` arm resets the wrong ivar: it calls `self.ivars().rotation_last_delta.set(0.0)` instead of `self.ivars().pinch_last_delta.set(0.0)`. This is a copy-paste from `rotation_gesture`. Two real consequences: (1) `pinch_last_delta` is left holding a stale scale value after a pinch is cancelled (harmless in practice because the next `Began` overwrites it), and (2) because `WinitView` returns `true` from `shouldRecognizeSimultaneouslyWithGestureRecognizer:`, a pinch and a rotation gesture can be active at the same time - so cancelling the pinch wrongly zeroes the in-progress rotation baseline, corrupting the next `RotationGesture` delta computation in `rotation_gesture`.","fix":"Reset the pinch state in the pinch handler: replace `self.ivars().rotation_last_delta.set(0.0)` with `self.ivars().pinch_last_delta.set(0.0)`.","locations":[{"ref":"winit-uikit/src/view.rs:178-182","code":"  178 |                 UIGestureRecognizerState::Cancelled | UIGestureRecognizerState::Failed => {\n  179 |                     self.ivars().rotation_last_delta.set(0.0);\n  180 |                     // Pass -delta so that action is reversed\n  181 |                     (TouchPhase::Cancelled, -recognizer.scale())\n  182 |                 },","lines":5,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-uikit/src/view.rs#L178-L182"}]},{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `cursor_from_image`, the failure of `NSBitmapImageRep::initWith...` produces the error message `\"parent view should be installed in a window\"`, which is unrelated to bitmap creation and was clearly copy-pasted from unrelated code. The parallel `image_from_icon` correctly reports `\"Initializing the `NSBitmapImageRep` failed\"`.","fix":"Replace the message with an accurate one, e.g. `os_error!(\"Initializing the `NSBitmapImageRep` failed\")`.","locations":[{"ref":"winit-appkit/src/cursor.rs:98-98","code":"   98 |     }.ok_or_else(|| os_error!(\"parent view should be installed in a window\"))?;","lines":1,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-appkit/src/cursor.rs#L98"}]},{"id":"CPY_5","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In the `Debug` impl for `NativeKey`, the `Ohos(code)` arm formats the numeric code with `debug_tuple.field(code)` (decimal), whereas every other numeric variant (`Android`, `MacOS`, `Windows`, `Xkb`) formats with `format_args!(\"0x{code:04X}\")` (hex). The corresponding `NativeKeyCode` `Debug` impl correctly formats `Ohos` as hex. This makes `NativeKey`'s `Ohos` debug output inconsistent with both its own numeric siblings and with `NativeKeyCode::Ohos`.","fix":"Format `NativeKey::Ohos` like the other numeric variants:\n```rust\nOhos(code) => {\n    debug_tuple = f.debug_tuple(\"OpenHarmony\");\n    debug_tuple.field(&format_args!(\"0x{code:04X}\"));\n},\n```","locations":[{"ref":"winit-core/src/keyboard.rs:126-129","code":"  126 |             Ohos(code) => {\n  127 |                 debug_tuple = f.debug_tuple(\"OpenHarmony\");\n  128 |                 debug_tuple.field(code);\n  129 |             },","lines":4,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-core/src/keyboard.rs#L126-L129"},{"ref":"winit-core/src/keyboard.rs:60-63","code":"   60 |             Ohos(code) => {\n   61 |                 debug_tuple = f.debug_tuple(\"OpenHarmony\");\n   62 |                 debug_tuple.field(&format_args!(\"0x{code:04X}\"));\n   63 |             },","lines":4,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-core/src/keyboard.rs#L60-L63"}]},{"id":"CPY_6","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"`keycode_to_vkey` maps `KeyCode::ShiftLeft` and `KeyCode::ShiftRight` to the wrong virtual keys - they are swapped:\n```\nKeyCode::ShiftLeft => VK_RSHIFT,\nKeyCode::ShiftRight => VK_LSHIFT,\n```\n`ShiftLeft` should map to `VK_LSHIFT` and `ShiftRight` to `VK_RSHIFT` (compare the correctly ordered `ControlLeft => VK_LCONTROL` / `ControlRight => VK_RCONTROL` and `AltLeft => VK_LMENU` / `AltRight => VK_RMENU` just above). The bug is currently latent because `keycode_to_vkey` is only ever called for `NUMPAD_KEYCODES` entries (`keyboard_layout.rs:325`), so the shift arms are never exercised, but the mapping is still wrong.","fix":"Swap the two arms:\n```\nKeyCode::ShiftLeft => VK_LSHIFT,\nKeyCode::ShiftRight => VK_RSHIFT,\n```","locations":[{"ref":"winit-win32/src/keyboard_layout.rs:585-586","code":"  585 |         KeyCode::ShiftLeft => VK_RSHIFT,\n  586 |         KeyCode::ShiftRight => VK_LSHIFT,","lines":2,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-win32/src/keyboard_layout.rs#L585-L586"}]},{"id":"CPY_7","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"In `selection_notify` the mismatch warning computes the \"found\" type name from `xev.type_`, but `XSelectionEvent.type_` is the event-type constant (`SelectionNotify` == 31), not an atom. The value actually compared against `type_.atom()` a few lines above is `xev.target` (`target_type`). So the warning interns/looks up the name of atom `31` and prints a nonsensical \"found ...\" string.","fix":"Use the compared value: `let found_type_name = get_name(xev.target as _);`.","locations":[{"ref":"winit-x11/src/event_processor.rs:626-645","code":"  626 |             if target_type != type_.atom() {\n  627 |                 let get_name = |atom| {\n  628 |                     self.target\n  629 |                         .xconn\n  630 |                         .xcb_connection()\n  631 |                         .get_atom_name(atom)\n  632 |                         .ok()\n  633 |                         .and_then(|cookie| cookie.reply().ok())\n  634 |                         .and_then(|reply| String::from_utf8(reply.name).ok())\n  635 |                 };\n  636 | \n  637 |                 let expected_type_name = get_name(type_.atom());\n  638 |                 let found_type_name = get_name(xev.type_ as _);\n  639 | \n  640 |                 let extra_context = match (expected_type_name, found_type_name) {\n  641 |                     (Some(expected), Some(found)) => {\n  642 |                         format!(\" (expected {expected}, found {found})\")\n  643 |                     },\n  644 |                     (Some(expected), None) => format!(\" (expected {expected})\"),\n  645 |                     (None, Some(found)) => format!(\" (found {found})\"),","lines":20,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-x11/src/event_processor.rs#L626-L645"}]},{"id":"CPY_8","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `set_cursor`, the `Cursor::Custom` branch logs `tracing::error!(\"failed to set window icon: {err}\")` when `set_custom_cursor` fails. The message is a copy-paste artifact - it is about setting a cursor, not a window icon, which will mislead anyone reading the logs.","fix":"Change the message to `tracing::error!(\"failed to set custom cursor: {err}\")`.","locations":[{"ref":"winit-x11/src/window.rs:1835-1839","code":" 1835 |                 if *self.cursor_visible.lock().unwrap() {\n 1836 |                     if let Err(err) = self.xconn.set_custom_cursor(self.xwindow, cursor) {\n 1837 |                         tracing::error!(\"failed to set window icon: {err}\");\n 1838 |                     }\n 1839 |                 }","lines":5,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-x11/src/window.rs#L1835-L1839"}]},{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"medium","description":"In `set_fullscreen`, when entering `Fullscreen::Exclusive`, the display is captured with `CGDisplayCapture(display_id).unwrap()` and (optionally) faded to black via `CGAcquireDisplayFadeReservation`/`CGDisplayFade`. If the requested video mode is then not found in `monitor.video_mode_handles()`, the code does a bare `return` (`None => return`). At that point the display has already been captured and the screen has been faded to solid black, but the fade-in / `CGReleaseDisplayFadeReservation` and any display release are only performed further down and are skipped by the early return. The result is a captured display stuck on a black screen with a leaked fade reservation, and the tracked `fullscreen` ivar is never updated. `CGDisplaySetDisplayMode` failing similarly aborts via `.expect(\"failed to set video mode\")` while the display is captured/faded.","fix":"Before the early `return` (and on `CGDisplaySetDisplayMode` failure), undo the partial state: fade back in and `CGReleaseDisplayFadeReservation(fade_token)` if `fade_token` is valid, and `CGDisplayRelease(display_id)` since the display was captured. Prefer returning an error / propagating rather than `.unwrap()`/`.expect()` on the CoreGraphics calls.","locations":[{"ref":"winit-appkit/src/window_delegate.rs:1626-1676","code":" 1626 |             let mut fade_token = kCGDisplayFadeReservationInvalidToken;\n 1627 | \n 1628 |             if matches!(old_fullscreen, Some(Fullscreen::Borderless(_))) {\n 1629 |                 self.ivars().save_presentation_opts.replace(Some(app.presentationOptions()));\n 1630 |             }\n 1631 | \n 1632 |             // Fade to black (and wait for the fade to complete) to hide the\n 1633 |             // flicker from capturing the display and switching display mode\n 1634 |             if cgerr(unsafe { CGAcquireDisplayFadeReservation(5.0, &mut fade_token) }).is_ok() {\n 1635 |                 CGDisplayFade(\n 1636 |                     fade_token,\n 1637 |                     0.3,\n 1638 |                     kCGDisplayBlendNormal,\n 1639 |                     kCGDisplayBlendSolidColor,\n 1640 |                     0.0,\n 1641 |                     0.0,\n 1642 |                     0.0,\n 1643 |                     true,\n 1644 |                 );\n 1645 |             }\n 1646 | \n 1647 |             cgerr(CGDisplayCapture(display_id)).unwrap();\n 1648 | \n 1649 |             let monitor = monitor.cast_ref::<MonitorHandle>().unwrap();\n 1650 |             let video_mode =\n 1651 |                 match monitor.video_mode_handles().find(|mode| &mode.mode == video_mode) {\n 1652 |                     Some(video_mode) => video_mode,\n 1653 |                     None => return,\n 1654 |                 };\n 1655 | \n 1656 |             cgerr(unsafe {\n 1657 |                 CGDisplaySetDisplayMode(display_id, Some(&video_mode.native_mode.0), None)\n 1658 |             })\n 1659 |             .expect(\"failed to set video mode\");\n 1660 | \n 1661 |             // After the display has been configured, fade back in\n 1662 |             // asynchronously\n 1663 |             if fade_token != kCGDisplayFadeReservationInvalidToken {\n 1664 |                 CGDisplayFade(\n 1665 |                     fade_token,\n 1666 |                     0.6,\n 1667 |                     kCGDisplayBlendSolidColor,\n 1668 |                     kCGDisplayBlendNormal,\n 1669 |                     0.0,\n 1670 |                     0.0,\n 1671 |                     0.0,\n 1672 |                     false,\n 1673 |                 );\n 1674 |                 CGReleaseDisplayFadeReservation(fade_token);\n 1675 |             }\n 1676 |         }","lines":51,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-appkit/src/window_delegate.rs#L1626-L1676"}]},{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"The X11 event dispatch path turns recoverable X-server errors into hard panics of the whole event loop via `.expect(..)` / `.unwrap()`. A malicious or merely racy peer (a window destroyed mid-drag, a WM that rejects a request, a monitor unplugged) will crash the application. Examples: `translate_coords(..).expect(\"Failed to translate window coordinates\")`; `dnd.send_status(..).expect(\"Failed to send `XdndStatus` message.\")`; `dnd.send_finished(..).expect(\"Failed to send `XdndFinished` message.\")` (two sites); `ime.borrow_mut().remove_context(..).expect(..)`; `ime.borrow_mut().focus(..).expect(..)` / `.unfocus(..).expect(..)`; `get_monitor_for_window(..).expect(\"Failed to find monitor for window\")`; `available_monitors().expect(\"Failed to get monitor list\")`.","fix":"Replace the `.expect`/`.unwrap` calls with graceful handling: log a `warn!`/`error!` and `return` from the handler (as is already done for `read_data` in `selection_notify`), so a single failed X request does not abort the whole event loop.","locations":[{"ref":"winit-x11/src/event_processor.rs:488-492","code":"  488 |             let coords = self\n  489 |                 .target\n  490 |                 .xconn\n  491 |                 .translate_coords(self.target.root, window, x, y)\n  492 |                 .expect(\"Failed to translate window coordinates\");","lines":5,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-x11/src/event_processor.rs#L488-L492"},{"ref":"winit-x11/src/event_processor.rs:514-521","code":"  514 |                 unsafe {\n  515 |                     dnd.send_status(\n  516 |                         window,\n  517 |                         source_window,\n  518 |                         if state.accepted { DndState::Accepted } else { DndState::Rejected },\n  519 |                     )\n  520 |                     .expect(\"Failed to send `XdndStatus` message.\");\n  521 |                 }","lines":8,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-x11/src/event_processor.rs#L514-L521"},{"ref":"winit-x11/src/event_processor.rs:575-578","code":"  575 |                 unsafe {\n  576 |                     dnd.send_finished(window, source_window)\n  577 |                         .expect(\"Failed to send `XdndFinished` message.\");\n  578 |                 }","lines":4,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-x11/src/event_processor.rs#L575-L578"},{"ref":"winit-x11/src/event_processor.rs:687-690","code":"  687 |             unsafe {\n  688 |                 dnd.send_finished(this_window, target_window)\n  689 |                     .expect(\"Failed to send `XdndFinished` message.\");\n  690 |             }","lines":4,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-x11/src/event_processor.rs#L687-L690"},{"ref":"winit-x11/src/event_processor.rs:902-906","code":"  902 |         if let Some(ime) = self.target.ime.as_ref() {\n  903 |             ime.borrow_mut()\n  904 |                 .remove_context(window as XWindow)\n  905 |                 .expect(\"Failed to destroy input context\");\n  906 |         }","lines":5,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-x11/src/event_processor.rs#L902-L906"},{"ref":"winit-x11/src/event_processor.rs:1315-1316","code":" 1315 |         if let Some(ime) = self.target.ime.as_ref() {\n 1316 |             ime.borrow_mut().focus(xev.event).expect(\"Failed to focus input context\");","lines":2,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-x11/src/event_processor.rs#L1315-L1316"},{"ref":"winit-x11/src/event_processor.rs:1374-1375","code":" 1374 |         if let Some(ime) = self.target.ime.as_ref() {\n 1375 |             ime.borrow_mut().unfocus(xev.event).expect(\"Failed to unfocus input context\");","lines":2,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-x11/src/event_processor.rs#L1374-L1375"},{"ref":"winit-x11/src/event_processor.rs:780-782","code":"  780 |                     .xconn\n  781 |                     .get_monitor_for_window(Some(window_rect))\n  782 |                     .expect(\"Failed to find monitor for window\");","lines":3,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-x11/src/event_processor.rs#L780-L782"},{"ref":"winit-x11/src/event_processor.rs:1859","code":" 1859 |         let new_list = self.target.xconn.available_monitors().expect(\"Failed to get monitor list\");","lines":1,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-x11/src/event_processor.rs#L1859"}]},{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"In `get_xim_servers`, the return value of `(xconn.xlib.XGetAtomNames)(...)` is ignored and `names.set_len(atoms.len())` is called unconditionally. `XGetAtomNames` returns `0` on failure and in that case leaves the `names` buffer (allocated with `Vec::with_capacity(atoms.len())`) uninitialized. The subsequent loop then does `CStr::from_ptr(name)` over uninitialized `*const c_char` pointers, which is undefined behavior (reads of uninitialized memory and dereference of garbage pointers). Even on partial success this pattern is fragile.","fix":"Capture the return value and bail out before `set_len` if it is `0`, e.g. `let ok = unsafe { (xconn.xlib.XGetAtomNames)(xconn.display, atoms.as_mut_ptr(), atoms.len() as _, names.as_mut_ptr() as _) };` then `if ok == 0 { return Err(...); }` and only then `unsafe { names.set_len(atoms.len()) };`. Consider zero-initializing the pointer buffer first so an early return cannot observe uninitialized memory.","locations":[{"ref":"winit-x11/src/ime/input_method.rs:180-201","code":"  180 |     let mut names: Vec<*const c_char> = Vec::with_capacity(atoms.len());\n  181 |     unsafe {\n  182 |         (xconn.xlib.XGetAtomNames)(\n  183 |             xconn.display,\n  184 |             atoms.as_mut_ptr(),\n  185 |             atoms.len() as _,\n  186 |             names.as_mut_ptr() as _,\n  187 |         )\n  188 |     };\n  189 |     unsafe { names.set_len(atoms.len()) };\n  190 | \n  191 |     let mut formatted_names = Vec::with_capacity(names.len());\n  192 |     for name in names {\n  193 |         let string = unsafe { CStr::from_ptr(name) }\n  194 |             .to_owned()\n  195 |             .into_string()\n  196 |             .map_err(GetXimServersError::InvalidUtf8)?;\n  197 |         unsafe { (xconn.xlib.XFree)(name as _) };\n  198 |         formatted_names.push(string.replace(\"@server=\", \"@im=\"));\n  199 |     }\n  200 |     xconn.check_errors().map_err(GetXimServersError::XError)?;\n  201 |     Ok(formatted_names)","lines":22,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-x11/src/ime/input_method.rs#L180-L201"}]},{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`EventLoopError::source` and `RequestError::source` both return `err.source()` for the `Os` variant, i.e. the *inner* boxed error of the `OsError`, skipping the `OsError` itself from the error `source()` chain. A consumer walking the chain never sees the `OsError` (which carries the `file`/`line` context). The idiomatic behavior is to return the `OsError` as the immediate source so the full chain is preserved.","fix":"Return the `OsError` itself as the source rather than delegating to its own `source()`:\n```rust\nfn source(&self) -> Option<&(dyn Error + 'static)> {\n    if let Self::Os(err) = self { Some(err) } else { None }\n}\n```","locations":[{"ref":"winit-core/src/error.rs:36-40","code":"   36 | impl Error for EventLoopError {\n   37 |     fn source(&self) -> Option<&(dyn Error + 'static)> {\n   38 |         if let Self::Os(err) = self { err.source() } else { None }\n   39 |     }\n   40 | }","lines":5,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-core/src/error.rs#L36-L40"},{"ref":"winit-core/src/error.rs:75-79","code":"   75 | impl Error for RequestError {\n   76 |     fn source(&self) -> Option<&(dyn Error + 'static)> {\n   77 |         if let Self::Os(err) = self { err.source() } else { None }\n   78 |     }\n   79 | }","lines":5,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-core/src/error.rs#L75-L79"}]},{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`Window::drop` (Orbital) calls `self.event_loop_proxy.wake_socket.wake().unwrap()`. `wake()` writes to the time socket and can fail with an OS error; unwrapping inside `Drop` turns a syscall failure into a panic during unwinding, risking a double-panic abort. The same `.wake().unwrap()` / `.expect(...)` pattern is used unconditionally in `Window::new` (opening the socket, subscribing, and waking), so any transient syscall failure during window creation aborts instead of returning the `RequestError` that the function signature already supports.","fix":"In `Drop`, ignore or log the error instead of unwrapping (e.g. `let _ = self.event_loop_proxy.wake_socket.wake();`). In `Window::new`, propagate failures via `?`/`map_err(|e| os_error!(...))` rather than `expect`/`unwrap` so they surface as `RequestError`.","locations":[{"ref":"winit-orbital/src/window.rs:493-502","code":"  493 | impl Drop for Window {\n  494 |     fn drop(&mut self) {\n  495 |         {\n  496 |             let mut destroys = self.destroys.lock().unwrap();\n  497 |             destroys.push_back(self.id());\n  498 |         }\n  499 | \n  500 |         self.event_loop_proxy.wake_socket.wake().unwrap();\n  501 |     }\n  502 | }","lines":10,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-orbital/src/window.rs#L493-L502"},{"ref":"winit-orbital/src/window.rs:104-117","code":"  104 |         .expect(\"failed to open window\");\n  105 | \n  106 |         // Add to event socket.\n  107 |         el.event_socket.subscribe(window.fd(), EventSource::Orbital, EventFlags::READ).unwrap();\n  108 | \n  109 |         let window_socket = Arc::new(window);\n  110 | \n  111 |         // Notify event thread that this window was created, it will send some default events.\n  112 |         {\n  113 |             let mut creates = el.creates.lock().unwrap();\n  114 |             creates.push_back(window_socket.clone());\n  115 |         }\n  116 | \n  117 |         el.event_loop_proxy.wake_socket.wake().unwrap();","lines":14,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-orbital/src/window.rs#L104-L117"}]},{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"Both DnD data-pump paths register a calloop source with `let _ = ... .insert_source(...)`, silently discarding the `Result`. In `ActiveEventLoop::fetch_data_transfer`, if `insert_source` fails the function still returns `Ok(async_request_serial)` to the caller, but no `DataTransferReceived` event will ever be delivered for that serial (the pipe read source was never installed), so the request hangs forever with no error reported. The same silent discard occurs in `DataSourceHandler::send_request`.","fix":"Check the `insert_source` result and, on error, propagate a `RequestError` (in `fetch_data_transfer`) or at least `tracing::warn!` and clean up (in `send_request`) instead of `let _ = ...`.","locations":[{"ref":"winit-wayland/src/event_loop/mod.rs:723-750","code":"  723 |         let _ = state.loop_handle.insert_source(ReadPipe::from(readfd), move |_, file, state| {\n  724 |             // SAFETY: We do not overwrite the referent of `file`\n  725 |             let file = unsafe { file.get_mut() };\n  726 | \n  727 |             let result = match file.read_to_end(&mut buffer) {\n  728 |                 Err(e) if e.kind() == io::ErrorKind::WouldBlock => {\n  729 |                     return PostAction::Continue;\n  730 |                 },\n  731 |                 Ok(0) => Ok(mem::take(&mut buffer)),\n  732 |                 Ok(_) => {\n  733 |                     return PostAction::Continue;\n  734 |                 },\n  735 |                 Err(e) => Err(Arc::new(e)),\n  736 |             };\n  737 | \n  738 |             state.events_sink.push_window_event(\n  739 |                 WindowEvent::DataTransferReceived {\n  740 |                     id,\n  741 |                     serial: async_request_serial,\n  742 |                     // `unwrap` is safe here, as we always return `PostAction::Remove` in this\n  743 |                     // branch.\n  744 |                     value: Arc::new(MimeData::new(mime_type.take().unwrap(), result)),\n  745 |                 },\n  746 |                 window_id,\n  747 |             );\n  748 | \n  749 |             PostAction::Remove\n  750 |         });","lines":28,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-wayland/src/event_loop/mod.rs#L723-L750"},{"ref":"winit-wayland/src/dnd.rs:90-113","code":"   90 |         let _ = self.loop_handle.insert_source(fd, move |_, file, _| {\n   91 |             // Safety: We only mutate `file` in-place and do not replace and drop it.\n   92 |             let file = unsafe { file.get_mut() };\n   93 |             loop {\n   94 |                 let Ok(encoded_bytes) = encoder.fill_buf() else {\n   95 |                     return PostAction::Remove;\n   96 |                 };\n   97 | \n   98 |                 match file.write(encoded_bytes) {\n   99 |                     Ok(0) => {\n  100 |                         break PostAction::Remove;\n  101 |                     },\n  102 |                     Ok(consumed) => {\n  103 |                         encoder.consume(consumed);\n  104 |                     },\n  105 |                     Err(e) if e.kind() == ErrorKind::WouldBlock => {\n  106 |                         break PostAction::Continue;\n  107 |                     },\n  108 |                     Err(_) => {\n  109 |                         break PostAction::Remove;\n  110 |                     },\n  111 |                 }\n  112 |             }\n  113 |         });","lines":24,"link":"https://github.com/rust-windowing/winit/blob/0ea5f3c875625fa8e4a1fca3ff46e7508084dabc/winit-wayland/src/dnd.rs#L90-L113"}]},{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"medium","description":"In the drag-and-drop `leave` handler, `receive_drag.finish()` is called when the drag pointer merely *leaves* the surface without a drop:\n```\nif let Some(receive_drag) = self.dnd_state.receive_drag.take() {\n    receive_drag.finish();\n}\n```\n`receive_drag` is the crate's own `DataOffer`, which `Deref`
