{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"In to_winres_version(), the shifts `v.major << 48`, `v.minor << 32`, `v.patch << 16` use the u64 values from semver. Semver permits any u64 value; a major version >= 65536 causes a debug-mode panic (arithmetic overflow) or silent data truncation in release mode.","fix":"Cast each component to u16 (clamping or returning an error) before shifting: `((v.major as u16 as u64) << 48) | ...`.","locations":[{"ref":"crates/tauri-build/src/lib.rs:772-776","code":"  772 | fn to_winres_version(v: &semver::Version) -> u64 {\n  773 |   let build = v.build.parse::<u16>().map(u64::from).unwrap_or(0);\n  774 | \n  775 |   (v.major << 48) | (v.minor << 32) | (v.patch << 16) | build\n  776 | }","lines":5,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-build/src/lib.rs#L772-L776"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"In the streaming example, `len as usize` (line 145) and `bytes_to_read as usize` (lines 81 and 133) cast `u64` values to `usize`. On a 32-bit target, `usize` is 4 bytes and a file larger than 4 GB would silently truncate the allocation size, causing a too-small buffer and reading garbage or panicking in `read_to_end` / `read_exact`.","fix":"Guard with an explicit check like `usize::try_from(len).map_err(|_| \"file too large\")?` before casting, or document that the code targets 64-bit platforms only.","locations":[{"ref":"examples/streaming/main.rs:81","code":"   81 |       let mut buf = Vec::with_capacity(bytes_to_read as usize);","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/examples/streaming/main.rs#L81"},{"ref":"examples/streaming/main.rs:136","code":"  136 |         let mut local_buf = vec![0_u8; bytes_to_read as usize];","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/examples/streaming/main.rs#L136"},{"ref":"examples/streaming/main.rs:149","code":"  149 |     let mut buf = Vec::with_capacity(len as usize);","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/examples/streaming/main.rs#L149"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"Dead code path: in helpers/cargo_manifest.rs, the block `if lock.is_some() && crate_lock_packages.is_empty()` iterates over `crate_lock_packages` (which was just asserted to be empty) to build a lock_version string. The resulting string is always empty, so version.lock_version is never set by this branch, making the entire block a no-op.","fix":"The condition should likely be `lock.is_some() && crate_lock_packages.len() > 1` (the multiple-version case), matching the enclosing else-branch for crate_lock_packages.len() != 1. The current code was intended to join multiple lock versions but the guard accidentally excludes all non-empty cases.","locations":[{"ref":"crates/tauri-cli/src/helpers/cargo_manifest.rs:195-205","code":"  195 |     if lock.is_some() && crate_lock_packages.is_empty() {\n  196 |       let lock_version = crate_lock_packages\n  197 |         .iter()\n  198 |         .map(|p| p.version.clone())\n  199 |         .collect::<Vec<String>>()\n  200 |         .join(\", \");\n  201 | \n  202 |       if !lock_version.is_empty() {\n  203 |         version.lock_version = Some(lock_version);\n  204 |       }\n  205 |     }","lines":11,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/helpers/cargo_manifest.rs#L195-L205"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"The `skip_codesign()` call inside the `build_config` block (lines 439-441) is dead under the current conditions: the outer `if` on line 434 only runs when `!(archive_only || no_sign)`, meaning `no_sign` is `false`. `skip_signing` is `options.no_sign || credentials.is_some()`, so inside this block `skip_signing` can only be true when `credentials.is_some()`. However, if credentials are present and `no_sign` is false the code calls `build_config.skip_codesign()`, which likely contradicts the intent: credentials were supplied precisely to perform signing. The `no_sign` branch guard and the `skip_signing` variable are inconsistently applied.","fix":"Re-examine the intended semantics. If `skip_codesign` should only be set when `no_sign` is true (not when credentials are present), replace `if skip_signing` with `if options.no_sign` inside the build block. Add a comment explaining why credentials presence affects signing skip logic.","locations":[{"ref":"crates/tauri-cli/src/mobile/ios/build.rs:435-447","code":"  435 |       if !(options.archive_only || options.no_sign) {\n  436 |         let mut build_config = BuildConfig::new().allow_provisioning_updates();\n  437 |         if let Some(credentials) = &credentials {\n  438 |           build_config = build_config.authentication_credentials(credentials.clone());\n  439 |         }\n  440 |         if skip_signing {\n  441 |           build_config = build_config.skip_codesign();\n  442 |         }\n  443 | \n  444 |         target\n  445 |           .build(None, config, env, noise_level, profile, build_config)\n  446 |           .context(\"failed to build iOS app\")?;\n  447 |       }","lines":13,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/mobile/ios/build.rs#L435-L447"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In `resolve_access`, the deny-check has a logic error: it calls `.is_some()` on the result of `.map(...)` instead of the `.map(...)` result itself. The intent is to deny when ANY resolved command matches the current origin, but the current code denies whenever the command appears in the denied list *at all*, regardless of origin match. The guard `resolved.iter().any(|cmd| origin.matches(&cmd.context))` is evaluated inside `.map(...)`, but its return value is ignored - only whether the `get` returned `Some` matters. This means a command denied only for remote origins will also be denied for local origins.","fix":"Change the condition to: `if self.denied_commands.get(command).map(|resolved| resolved.iter().any(|cmd| origin.matches(&cmd.context))).unwrap_or(false) { return None; }`","locations":[{"ref":"crates/tauri/src/ipc/authority.rs:447-451","code":"  447 |       .denied_commands\n  448 |       .get(command)\n  449 |       .map(|resolved| resolved.iter().any(|cmd| origin.matches(&cmd.context)))\n  450 |       .is_some()\n  451 |     {","lines":5,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/ipc/authority.rs#L447-L451"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"Incorrect trailing-separator condition in `normalize()`. The guard `(!p.ends_with('/') || !p.ends_with('\\\\'))` is a tautology: a single string can never simultaneously end with both characters, so the OR is always true. This means a trailing separator is appended unconditionally whenever the input had one, even when the normalized path already ends with the correct separator (e.g. after resolving a root `/` path on Unix).","fix":"Replace the OR with AND: `(!p.ends_with('/') && !p.ends_with('\\\\'))`.","locations":[{"ref":"crates/tauri/src/path/plugin.rs:127-129","code":"  127 |     if (path.ends_with('/') || path.ends_with('\\\\')) && (!p.ends_with('/') || !p.ends_with('\\\\')) {\n  128 |       p.push(MAIN_SEPARATOR);\n  129 |     }","lines":3,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/path/plugin.rs#L127-L129"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In check-change-tags.js, the regex /^---[\\s\\S.]*---\\n/i is greedy and will match across multiple '---' delimiters in the same file. If a change note's body contains a line reading '---' (e.g. an HR in Markdown) followed by another package block, the regex overmatches, treating the entire file as front matter and producing incorrect package/tag parsing.","fix":"Use a non-greedy quantifier: /^---[\\s\\S]*?---\\n/. Alternatively, split the file on '\\n---\\n' and take the first segment.","locations":[{"ref":".scripts/ci/check-change-tags.js:28-29","code":"   28 |     const [frontMatter] = /^---[\\s\\S.]*---\\n/i.exec(content)\n   29 |     const packages = frontMatter","lines":2,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/.scripts/ci/check-change-tags.js#L28-L29"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In sync-cli-metadata.js, the 'preminor' bump type is missing from the switch statement and falls through to the default case, throwing an error. 'preminor' is a standard semantic-versioning pre-release bump type (used by covector/npm).","fix":"Add a `case 'preminor': index = 1; break;` arm (with the same pre-release suffix logic as 'premajor').","locations":[{"ref":".scripts/ci/sync-cli-metadata.js:22-39","code":"   22 | switch (bump) {\n   23 |   case 'major':\n   24 |   case 'premajor':\n   25 |     index = 0\n   26 |     break\n   27 |   case 'minor':\n   28 |     index = 1\n   29 |     break\n   30 |   case 'patch':\n   31 |     index = 2\n   32 |     break\n   33 |   case 'prerelease':\n   34 |   case 'prepatch':\n   35 |     index = 3\n   36 |     break\n   37 |   default:\n   38 |     throw new Error('unexpected bump ' + bump)\n   39 | }","lines":18,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/.scripts/ci/sync-cli-metadata.js#L22-L39"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In sync-cli-metadata.js, the inc() function is called with index=3 for 'prerelease' and 'prepatch' bump types. For a standard three-part version string like '1.2.3', the loop runs from i=0..2 and never reaches i==3, leaving the version unchanged. The function silently returns the original version string without bumping anything.","fix":"For pre-release bumps, first apply the underlying bump (e.g. patch for prepatch, minor for preminor) and then append the pre-release suffix, similar to how premajor is handled. Alternatively, re-use a semver library.","locations":[{"ref":".scripts/ci/sync-cli-metadata.js:41-57","code":"   41 | const inc = (version) => {\n   42 |   const v = version.split('.')\n   43 |   for (let i = 0; i < v.length; i++) {\n   44 |     if (i === index) {\n   45 |       v[i] = String(Number(v[i]) + 1)\n   46 |     } else if (i > index) {\n   47 |       v[i] = 0\n   48 |     }\n   49 |   }\n   50 |   if (bump === 'premajor') {\n   51 |     const pre = JSON.parse(\n   52 |       readFileSync(resolve(__dirname, '../../.changes/pre.json'), 'utf-8')\n   53 |     )\n   54 |     return `${v.join('.')}-${pre.tag}.0`\n   55 |   }\n   56 |   return v.join('.')\n   57 | }","lines":17,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/.scripts/ci/sync-cli-metadata.js#L41-L57"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"bundle_update_windows in updater_bundle.rs uses .fold() to derive archived_path and bundle_name from path components. When a source path comes from a non-updater bundle (WIX_OUTPUT_FOLDER_NAME or NSIS_OUTPUT_FOLDER_NAME), bundle_name is set but the path component is included unchanged. The resulting archived_path is then modified with .with_extension(format!(\"{bundle_name}.zip\")), which appends the bundle_name as the file extension to whatever the last path component was. For a path like `.../bundle/msi/MyApp_1.0.0_x64_en-US.msi`, this produces `.../bundle/msi/MyApp_1.0.0_x64_en-US.msi` -> extension becomes `msi.zip`. The intent appears to be placing the zip alongside the installer directory, but the logic is fragile.","fix":"Clarify and simplify by building the output path directly from known parts (output dir + bundle type folder + filename + .zip) rather than manipulating path components via fold.","locations":[{"ref":"crates/tauri-bundler/src/bundle/updater_bundle.rs:170-191","code":"  170 |     let (archived_path, bundle_name) =\n  171 |       source_path\n  172 |         .components()\n  173 |         .fold((PathBuf::new(), String::new()), |(mut p, mut b), c| {\n  174 |           if let std::path::Component::Normal(name) = c {\n  175 |             if let Some(name) = name.to_str() {\n  176 |               // installers bundled for updater should be put in a directory named `${bundle_name}-updater`\n  177 |               if name == WIX_UPDATER_OUTPUT_FOLDER_NAME || name == NSIS_UPDATER_OUTPUT_FOLDER_NAME {\n  178 |                 b = name.strip_suffix(\"-updater\").unwrap().to_string();\n  179 |                 p.push(&b);\n  180 |                 return (p, b);\n  181 |               }\n  182 | \n  183 |               if name == WIX_OUTPUT_FOLDER_NAME || name == NSIS_OUTPUT_FOLDER_NAME {\n  184 |                 b = name.to_string();\n  185 |               }\n  186 |             }\n  187 |           }\n  188 |           p.push(c);\n  189 |           (p, b)\n  190 |         });\n  191 |     let archived_path = archived_path.with_extension(format!(\"{bundle_name}.zip\"));","lines":22,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-bundler/src/bundle/updater_bundle.rs#L170-L191"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"output_ok() in utils/mod.rs holds the Mutex lock for the entire duration of reading stdout/stderr inside the spawned thread. The lock is acquired before entering the read loop and released only when the thread exits, which means the main thread blocks on lock().unwrap() until the child terminates. This defeats the purpose of spawning separate threads and could cause a deadlock if the child also blocks waiting for the parent to consume its output pipe (but since stdout/stderr are piped the OS kernel buffers mitigate this in practice; it is still incorrect design).","fix":"Acquire the lock only when appending a complete line to the shared buffer, not for the entire loop duration. Or use a channel (std::sync::mpsc) to pass lines from reader threads to the main thread.","locations":[{"ref":"crates/tauri-bundler/src/utils/mod.rs:57-93","code":"   57 |     let mut stdout = child.stdout.take().map(BufReader::new).unwrap();\n   58 |     let stdout_lines = Arc::new(Mutex::new(Vec::new()));\n   59 |     let stdout_lines_ = stdout_lines.clone();\n   60 |     std::thread::spawn(move || {\n   61 |       let mut line = String::new();\n   62 |       let mut lines = stdout_lines_.lock().unwrap();\n   63 |       loop {\n   64 |         line.clear();\n   65 |         match stdout.read_line(&mut line) {\n   66 |           Ok(0) => break,\n   67 |           Ok(_) => {\n   68 |             log::debug!(action = \"stdout\"; \"{}\", line.trim_end());\n   69 |             lines.extend(line.as_bytes().to_vec());\n   70 |           }\n   71 |           Err(_) => (),\n   72 |         }\n   73 |       }\n   74 |     });\n   75 | \n   76 |     let mut stderr = child.stderr.take().map(BufReader::new).unwrap();\n   77 |     let stderr_lines = Arc::new(Mutex::new(Vec::new()));\n   78 |     let stderr_lines_ = stderr_lines.clone();\n   79 |     std::thread::spawn(move || {\n   80 |       let mut line = String::new();\n   81 |       let mut lines = stderr_lines_.lock().unwrap();\n   82 |       loop {\n   83 |         line.clear();\n   84 |         match stderr.read_line(&mut line) {\n   85 |           Ok(0) => break,\n   86 |           Ok(_) => {\n   87 |             log::debug!(action = \"stderr\"; \"{}\", line.trim_end());\n   88 |             lines.extend(line.as_bytes().to_vec());\n   89 |           }\n   90 |           Err(_) => (),\n   91 |         }\n   92 |       }\n   93 |     });","lines":37,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-bundler/src/utils/mod.rs#L57-L93"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In add.rs (permission/add), the capability platform-matching filter requires ALL platforms listed in a capability to be in the expected set. A capability file that covers both desktop AND mobile platforms would be excluded from both the desktop-only and mobile-only filtered views, making it invisible to the add command.","fix":"Change the filter to check whether the capability's platforms have meaningful overlap with the expected platforms (e.g., using `.any()` instead of `.all()`), or document the constraint explicitly.","locations":[{"ref":"crates/tauri-cli/src/acl/permission/add.rs:197-203","code":"  197 |         capability.platforms().is_some_and(|platforms| {\n  198 |           // all platforms must be in the expected platforms list\n  199 |           platforms\n  200 |             .iter()\n  201 |             .all(|p| expected_platforms.contains(&p.to_string()))\n  202 |         })\n  203 |       })","lines":7,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/acl/permission/add.rs#L197-L203"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In acl/permission/rm.rs, the wildcard match `identifier.split_once(':')` with `(plugin_name, \"*\")` uses `permission.contains(plugin_name)` for matching. This is overly broad: a plugin named \"fs\" would match permissions for \"fs-extra\" or \"notify-fs\" since contains() does a substring search, not a word-boundary search.","fix":"Match more precisely: `permission.starts_with(&format!(\"{plugin_name}:\"))` to ensure only permissions belonging to that exact plugin are matched.","locations":[{"ref":"crates/tauri-cli/src/acl/permission/rm.rs:177-181","code":"  177 |   match identifier.split_once(':') {\n  178 |     Some((plugin_name, \"*\")) => permission.contains(plugin_name),\n  179 |     _ => permission == identifier,\n  180 |   }\n  181 | }","lines":5,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/acl/permission/rm.rs#L177-L181"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In add.rs, the regex `r\"(tauri\\s*::\\s*Builder\\s*::\\s*default\\(\\))(\\s*)\"` inserts the plugin initializer immediately after `tauri::Builder::default()`, producing `tauri::Builder::default().plugin(...)\\n.invoke_handler(...)`. However, the replacement format `$1$2{plugin_init}$2` preserves the trailing whitespace in group 2 after the plugin call, which may produce incorrect indentation if the match spans a newline.","fix":"Normalise the inserted code's indentation independently of the trailing whitespace captured in group 2, or use a multiline-aware approach.","locations":[{"ref":"crates/tauri-cli/src/add.rs:144-161","code":"  144 |   let re = Regex::new(r\"(tauri\\s*::\\s*Builder\\s*::\\s*default\\(\\))(\\s*)\").unwrap();\n  145 |   for file in [\n  146 |     dirs.tauri.join(\"src/main.rs\"),\n  147 |     dirs.tauri.join(\"src/lib.rs\"),\n  148 |   ] {\n  149 |     let contents =\n  150 |       std::fs::read_to_string(&file).fs_context(\"failed to read Rust entry point\", file.clone())?;\n  151 | \n  152 |     if contents.contains(&plugin_init) {\n  153 |       log::info!(\n  154 |         \"Plugin initialization code already found on {}\",\n  155 |         file.display()\n  156 |       );\n  157 |       return Ok(());\n  158 |     }\n  159 | \n  160 |     if re.is_match(&contents) {\n  161 |       let out = re.replace(&contents, format!(\"$1$2{plugin_init}$2\"));","lines":18,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/add.rs#L144-L161"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"webview2_version() strips only '\\n' from the PowerShell output but not '\\r\\n'. On Windows, PowerShell outputs CRLF line endings, so the returned version string will contain a trailing '\\r', which could cause downstream comparison or display issues.","fix":"Replace .replace('\\n', \"\") with .trim().to_string() to strip both CR and LF on all platforms.","locations":[{"ref":"crates/tauri-cli/src/info/env_system.rs:123","code":"  123 |       String::from_utf8_lossy(&output.stdout).replace('\\n', \"\"),","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/info/env_system.rs#L123"},{"ref":"crates/tauri-cli/src/info/env_system.rs:137","code":"  137 |       String::from_utf8_lossy(&output.stdout).replace('\\n', \"\"),","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/info/env_system.rs#L137"},{"ref":"crates/tauri-cli/src/info/env_system.rs:137","code":"  137 |       String::from_utf8_lossy(&output.stdout).replace('\\n', \"\"),","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/info/env_system.rs#L137"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"validate_target in desktop.rs contains a duplicated check: it first searches for a matching target and errors if not installed, then repeats an any() scan to error if the target does not exist at all. The second check is always false if the first `find()` already found and validated the target, making the unreachable path dead code.","fix":"Restructure: use a single find() with an if/else - if found and not installed, error about installation; if not found, error about non-existence.","locations":[{"ref":"crates/tauri-cli/src/interface/rust/desktop.rs:296-314","code":"  296 | fn validate_target(\n  297 |   available_targets: &Option<Vec<RustupTarget>>,\n  298 |   target: &str,\n  299 | ) -> crate::Result<()> {\n  300 |   if let Some(available_targets) = available_targets {\n  301 |     if let Some(target) = available_targets.iter().find(|t| t.name == target) {\n  302 |       if !target.installed {\n  303 |         crate::error::bail!(\n  304 |             \"Target {target} is not installed (installed targets: {installed}). Please run `rustup target add {target}`.\",\n  305 |             target = target.name,\n  306 |             installed = available_targets.iter().filter(|t| t.installed).map(|t| t.name.as_str()).collect::<Vec<&str>>().join(\", \")\n  307 |           );\n  308 |       }\n  309 |     }\n  310 |     if !available_targets.iter().any(|t| t.name == target) {\n  311 |       crate::error::bail!(\"Target {target} does not exist. Please run `rustup target list` to see the available targets.\", target = target);\n  312 |     }\n  313 |   }\n  314 |   Ok(())","lines":19,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/interface/rust/desktop.rs#L296-L314"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"get_enabled_features in manifest.rs has no cycle detection. If the Cargo.toml feature graph contains a cycle (feature A enables B, B enables A), this function will recurse infinitely and overflow the stack.","fix":"Maintain a visited set (HashSet) and skip features already in it to break any cycles.","locations":[{"ref":"crates/tauri-cli/src/interface/rust/manifest.rs:66-80","code":"   66 | fn get_enabled_features(list: &HashMap<String, Vec<String>>, feature: &str) -> Vec<String> {\n   67 |   let mut f = Vec::new();\n   68 | \n   69 |   if let Some(enabled_features) = list.get(feature) {\n   70 |     for enabled in enabled_features {\n   71 |       if list.contains_key(enabled) {\n   72 |         f.extend(get_enabled_features(list, enabled));\n   73 |       } else {\n   74 |         f.push(enabled.clone());\n   75 |       }\n   76 |     }\n   77 |   }\n   78 | \n   79 |   f\n   80 | }","lines":15,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/interface/rust/manifest.rs#L66-L80"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `process_bundle`, only the last license file path among macOS, Windows/wix, and Windows/nsis is kept. The variable `license_file` is overwritten sequentially, so when a project defines different paths for different platforms, all but the final one are silently discarded. The v2 config only has a single `licenseFile` key, so this is a lossy migration.","fix":"Warn the user when multiple distinct license file paths are detected and keep the first one, or prefer the macOS path (since it is the platform-specific one that was separate in v1). At a minimum, log the paths that were discarded.","locations":[{"ref":"crates/tauri-cli/src/migrate/migrations/v1/config.rs:302-348","code":"  302 |       // license file\n  303 |       if let Some(macos) = bundle_config\n  304 |         .get_mut(\"macOS\")\n  305 |         .and_then(|v| v.as_object_mut())\n  306 |       {\n  307 |         if let Some(license) = macos.remove(\"license\") {\n  308 |           license_file = Some(license);\n  309 |         }\n  310 |       }\n  311 | \n  312 |       // Windows\n  313 |       if let Some(windows) = bundle_config.get_mut(\"windows\") {\n  314 |         if let Some(windows) = windows.as_object_mut() {\n  315 |           if let Some(wix) = windows.get_mut(\"wix\").and_then(|v| v.as_object_mut()) {\n  316 |             if let Some(license_path) = wix.remove(\"license\") {\n  317 |               license_file = Some(license_path);\n  318 |             }\n  319 |           }\n  320 |           if let Some(nsis) = windows.get_mut(\"nsis\").and_then(|v| v.as_object_mut()) {\n  321 |             if let Some(license_path) = nsis.remove(\"license\") {\n  322 |               license_file = Some(license_path);\n  323 |             }\n  324 |           }\n  325 | \n  326 |           if let Some((fixed_runtime_path, key)) = windows\n  327 |             .remove(\"webviewFixedRuntimePath\")\n  328 |             .map(|v| (v, \"webviewInstallMode\"))\n  329 |             .or_else(|| {\n  330 |               windows\n  331 |                 .remove(\"webview-fixed-runtime-path\")\n  332 |                 .map(|v| (v, \"webview-install-mode\"))\n  333 |             })\n  334 |           {\n  335 |             if !fixed_runtime_path.is_null() {\n  336 |               windows.insert(\n  337 |                 key.into(),\n  338 |                 serde_json::json!({\n  339 |                   \"type\": \"fixedRuntime\",\n  340 |                   \"path\": fixed_runtime_path\n  341 |                 }),\n  342 |               );\n  343 |             }\n  344 |           }\n  345 |         }\n  346 |       }\n  347 |       if let Some(license_file) = license_file {\n  348 |         bundle_config.insert(\"licenseFile\".into(), license_file);","lines":47,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/migrate/migrations/v1/config.rs#L302-L348"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"CSP string migration uses a plain substring replace on 'connect-src', which corrupts any custom CSP directive whose name starts with that prefix (e.g. 'connect-src-fallback' becomes 'connect-src ipc: http://ipc.localhost-fallback'). The check `csp.contains(\"connect-src\")` correctly detects the directive, but `csp.replace(\"connect-src\", ...)` replaces every occurrence of the substring rather than the exact directive token.","fix":"Replace the bare string replace with a word-boundary or regex approach, e.g. match `connect-src` only when followed by whitespace, `;`, or end-of-string. Alternatively, parse the CSP into directive tokens before modifying.","locations":[{"ref":"crates/tauri-cli/src/migrate/migrations/v1/config.rs:398-400","code":"  398 |           if csp.contains(\"connect-src\") {\n  399 |             *csp = csp.replace(\"connect-src\", \"connect-src ipc: http://ipc.localhost\");\n  400 |           } else {","lines":3,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/migrate/migrations/v1/config.rs#L398-L400"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`device_prompt` spins in an unbounded `loop` waiting for the chosen emulator to reach `ConnectionStatus::Connected`. The only non-error exit is when the emulator is detected as connected; there is no timeout or maximum-retry count. If the emulator image is corrupted, the emulator process dies silently, or ADB permanently fails to see the device, the CLI hangs forever.","fix":"Add a maximum wait duration (e.g. 5 minutes) or a maximum retry count and bail with a descriptive error when it is exceeded.","locations":[{"ref":"crates/tauri-cli/src/mobile/android/mod.rs:861-903","code":"  861 |     let mut tries = 0;\n  862 |     loop {\n  863 |       sleep(Duration::from_secs(2));\n  864 |       // we do not filter for connected devices to detect emulators that are not connected to our adb anymore\n  865 |       match adb::device_list(env) {\n  866 |         Ok(devices) => {\n  867 |           if let Some(device) = devices.into_iter().find(|d| d.name() == emulator.name()) {\n  868 |             if device.status() == ConnectionStatus::Connected {\n  869 |               return Ok(device);\n  870 |             }\n  871 |           }\n  872 | \n  873 |           if tries >= 3 {\n  874 |             log::info!(\"Waiting for emulator to start... (maybe the emulator is unauthorized or offline, run `adb devices` to check)\");\n  875 |           } else {\n  876 |             log::info!(\"Waiting for emulator to start...\");\n  877 |           }\n  878 |           tries += 1;\n  879 |         }\n  880 |         Err(\n  881 |           adb::device_list::Error::ModelFailed {\n  882 |             serial_no,\n  883 |             error: adb::get_prop::Error::CommandFailed { command: _, error },\n  884 |           }\n  885 |           | adb::device_list::Error::AbiFailed {\n  886 |             serial_no,\n  887 |             error: adb::get_prop::Error::CommandFailed { command: _, error },\n  888 |           },\n  889 |         ) => {\n  890 |           if emulator_already_running && error.kind() == std::io::ErrorKind::TimedOut {\n  891 |             log::info!(\"Emulator is not responding, we need to restart it\");\n  892 |             restart_emulator(env, &serial_no, &emulator)?;\n  893 |             tries = 0;\n  894 |           } else {\n  895 |             log::error!(\"failed to get properties for device {serial_no}: {error}\");\n  896 |           }\n  897 |         }\n  898 |         Err(e) => {\n  899 |           log::error!(\"failed to list devices with adb: {e}\");\n  900 |           tries += 1;\n  901 |         }\n  902 |       }\n  903 |     }","lines":43,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/mobile/android/mod.rs#L861-L903"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The comment on line 511-513 says \"if we skipped code signing, we do not have the entitlements applied\" and triggers a dummy-certificate re-sign. But `skip_signing` is true when `credentials.is_some()` as well as when `no_sign` is true. When credentials ARE present the app was not necessarily unsigned; re-signing with a dummy certificate in that case overwrites a valid signature and then expects `target.export()` to re-sign, which may not occur if export itself also detects the dummy cert. This logic conflates two distinct cases.","fix":"Use a separate flag for the dummy-re-sign path. Only enter the dummy-sign block when `options.no_sign` is true (not when `credentials.is_some()`), or document explicitly why both cases need the same treatment.","locations":[{"ref":"crates/tauri-cli/src/mobile/ios/build.rs:512-555","code":"  512 |         // if we skipped code signing, we do not have the entitlements applied to our exported IPA\n  513 |         // we must force sign the app binary with a dummy certificate just to preserve the entitlements\n  514 |         // target.export() will sign it with an actual certificate for us\n  515 |         if skip_signing {\n  516 |           let password = Alphanumeric.sample_string(&mut rand::rng(), 16);\n  517 |           let certificate = tauri_macos_sign::certificate::generate_self_signed(\n  518 |             tauri_macos_sign::certificate::SelfSignedCertificateRequest {\n  519 |               algorithm: \"rsa\".to_string(),\n  520 |               profile: tauri_macos_sign::certificate::CertificateProfile::AppleDistribution,\n  521 |               team_id: \"unset\".to_string(),\n  522 |               person_name: \"Tauri\".to_string(),\n  523 |               country_name: \"NL\".to_string(),\n  524 |               validity_days: 365,\n  525 |               password: password.clone(),\n  526 |             },\n  527 |           )\n  528 |           .map_err(Box::new)?;\n  529 |           let tmp_dir = tempfile::tempdir().context(\"failed to create temporary directory\")?;\n  530 |           let cert_path = tmp_dir.path().join(\"cert.p12\");\n  531 |           std::fs::write(&cert_path, certificate)\n  532 |             .fs_context(\"failed to write certificate\", cert_path.clone())?;\n  533 |           let self_signed_cert_keychain =\n  534 |             tauri_macos_sign::Keychain::with_certificate_file(&cert_path, &password.into())\n  535 |               .map_err(Box::new)?;\n  536 | \n  537 |           let app_dir = config\n  538 |             .export_dir()\n  539 |             .join(format!(\"{}.xcarchive\", config.scheme()))\n  540 |             .join(\"Products/Applications\")\n  541 |             .join(format!(\"{}.app\", config.app().stylized_name()));\n  542 | \n  543 |           self_signed_cert_keychain\n  544 |             .sign(\n  545 |               &app_dir.join(config.app().stylized_name()),\n  546 |               Some(\n  547 |                 &config\n  548 |                   .project_dir()\n  549 |                   .join(config.scheme())\n  550 |                   .join(format!(\"{}.entitlements\", config.scheme())),\n  551 |               ),\n  552 |               false,\n  553 |             )\n  554 |             .map_err(Box::new)?;\n  555 |         }","lines":44,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/mobile/ios/build.rs#L512-L555"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`map_capabilities` only looks in `capabilities.alwaysMatch` for the `tauri:options` key, then propagates native options to `desiredCapabilities`. If a WebDriver client places `tauri:options` only inside `desiredCapabilities` (which is valid per W3C fallback), it will be ignored and the session will fail to start with a confusing error.","fix":"Also check `desiredCapabilities` for the `tauri:options` key when it is not found in `alwaysMatch`.","locations":[{"ref":"crates/tauri-driver/src/server.rs:139-167","code":"  139 | fn map_capabilities(mut json: Value) -> Value {\n  140 |   let mut native = None;\n  141 |   if let Some(capabilities) = json.get_mut(\"capabilities\") {\n  142 |     if let Some(always_match) = capabilities.get_mut(\"alwaysMatch\") {\n  143 |       if let Some(always_match) = always_match.as_object_mut() {\n  144 |         if let Some(tauri_options) = always_match.remove(TAURI_OPTIONS) {\n  145 |           if let Ok(options) = serde_json::from_value::<TauriOptions>(tauri_options) {\n  146 |             native = Some(options.into_native_object());\n  147 |           }\n  148 |         }\n  149 | \n  150 |         if let Some(native) = native.clone() {\n  151 |           always_match.extend(native);\n  152 |         }\n  153 |       }\n  154 |     }\n  155 |   }\n  156 | \n  157 |   if let Some(native) = native {\n  158 |     if let Some(desired) = json.get_mut(\"desiredCapabilities\") {\n  159 |       if let Some(desired) = desired.as_object_mut() {\n  160 |         desired.remove(TAURI_OPTIONS);\n  161 |         desired.extend(native);\n  162 |       }\n  163 |     }\n  164 |   }\n  165 | \n  166 |   json\n  167 | }","lines":29,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-driver/src/server.rs#L139-L167"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"prevent_overflow computes `constraint = work_area.size - margin`, but both sides are u32. If margin is larger than the work area (a user-supplied value), this wraps around on release builds (subtraction underflow) and gives a nonsensically large constraint, causing the window to be sized to fill the monitor instead of being clamped.","fix":"Use `.saturating_sub()` for both width and height: `work_area.size.width.saturating_sub(margin.width)`.","locations":[{"ref":"crates/tauri-runtime-wry/src/lib.rs:4430-4433","code":" 4430 |         let constraint = PhysicalSize::new(\n 4431 |           work_area.size.width - margin.width,\n 4432 |           work_area.size.height - margin.height,\n 4433 |         );","lines":4,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-runtime-wry/src/lib.rs#L4430-L4433"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In the macOS monitor work_area calculation, the y-position conversion between AppKit (bottom-left origin) and tao (top-left origin) is applied only to the y axis. The x axis offset (`visible_frame.origin.x - screen_frame.origin.x`) is added directly to position.x, which is already in logical coordinates relative to the tao origin. This is correct only if tao's origin matches AppKit's origin for x - but the comment and code around it are not verified against multi-monitor setups where screen_frame.origin.x may be non-zero.","fix":"Add an integration test on a multi-monitor macOS setup verifying that work_area position correctly reflects docking at each screen edge.","locations":[{"ref":"crates/tauri-runtime-wry/src/monitor/macos.rs:18-27","code":"   18 |       let mut position = self.position().to_logical::<f64>(scale_factor);\n   19 | \n   20 |       position.x += visible_frame.origin.x - screen_frame.origin.x;\n   21 | \n   22 |       position.y += (screen_frame.origin.y + screen_frame.size.height)\n   23 |         - (visible_frame.origin.y + visible_frame.size.height);\n   24 |       PhysicalRect {\n   25 |         size: LogicalSize::new(visible_frame.size.width, visible_frame.size.height)\n   26 |           .to_physical(scale_factor),\n   27 |         position: position.to_physical(scale_factor),","lines":10,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-runtime-wry/src/monitor/macos.rs#L18-L27"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `windows::draw_surface` (window/windows.rs), `surface.resize(width, height).unwrap()` and `surface.buffer_mut().unwrap()` can panic if the softbuffer surface encounters an error (e.g. lost device context). The surrounding code has no error recovery for the surface operations.","fix":"Return a `Result` or log and skip the draw instead of unwrapping.","locations":[{"ref":"crates/tauri-runtime-wry/src/window/windows.rs:59-60","code":"   59 |       surface.resize(width, height).unwrap();\n   60 |       let mut buffer = surface.buffer_mut().unwrap();","lines":2,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-runtime-wry/src/window/windows.rs#L59-L60"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `generate_allowed_commands` (build.rs), `std::env::set_current_dir(config_directory)` is called to allow relative paths in the config to be resolved correctly. If `serde_json::from_value(config)?` fails after the `set_current_dir` call and before `set_current_dir(old_cwd)`, the working directory is permanently changed for the rest of the build script, which may silently corrupt subsequent path resolutions.","fix":"Use a RAII guard or `defer` pattern, or parse the config before changing directories, or use a scope guard crate. As a minimum, wrap the parse in a match and always restore `old_cwd`.","locations":[{"ref":"crates/tauri-utils/src/acl/build.rs:436-441","code":"  436 |   std::env::set_current_dir(config_directory)?;\n  437 | \n  438 |   let config: Config = serde_json::from_value(config)?;\n  439 | \n  440 |   // Reset working directory.\n  441 |   std::env::set_current_dir(old_cwd)?;","lines":6,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/acl/build.rs#L436-L441"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `Identifier::try_from`, the loop uses `idx` to track the byte position of the separator, but `idx` is incremented once per byte of the *remaining* bytes (after the first). Since multi-byte UTF-8 characters were already rejected by `ValidByte::alpha_numeric` (only ASCII is allowed), the byte index equals the char index and the logic is correct in practice. However, `separator` is stored as `NonZeroU8`, and `idx.try_into().unwrap()` will panic if the identifier is exactly 255+ bytes long before the separator. The max length is 115 bytes (`MAX_LEN_IDENTIFIER`), which fits in a u8, but this invariant is not documented and the assert in the test `max_len_fits_in_u8` would be the only safeguard.","fix":"The existing `MAX_LEN_IDENTIFIER < u8::MAX` assertion in the test guards this, but a debug_assert at the parse site would make the invariant explicit.","locations":[{"ref":"crates/tauri-utils/src/acl/identifier.rs:188","code":"  188 |             separator = Some(idx.try_into().unwrap());","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/acl/identifier.rs#L188"}]},
{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"Lossy u64-to-i64 cast in From<serde_json::Value> for Value. When a JSON number does not fit in i64 but fits in u64 (e.g. 2^63..2^64-1), the value is cast to i64 via `u as i64`, silently wrapping to a large negative integer. The correct representation would be a float (or an error), not a wrong integer.","fix":"Cast only if `u <= i64::MAX as u64`; otherwise fall through to the f64 branch or emit an error. E.g.: `Number::Int(u as i64)` should be guarded by `if u <= i64::MAX as u64`.","locations":[{"ref":"crates/tauri-utils/src/acl/value.rs:91-93","code":"   91 |       } else if let Some(u) = n.as_u64() {\n   92 |         Number::Int(u as i64)\n   93 |       } else if let Some(f) = n.as_f64() {","lines":3,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/acl/value.rs#L91-L93"}]},
{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In the AssetKey Windows path normalization, Component::CurDir appends './'; Component::ParentDir appends '../'. Neither of these should have a trailing slash appended when they are intermediate components, but more critically the trailing-slash removal at the end only removes the very last character. If the path ends with CurDir or ParentDir (unusual but possible), the trailing slash removal is applied to the wrong character of './' or '../' rather than the preceding directory component's slash.","fix":"Only push a separator after Component::Normal (which already does so) and do not add trailing slashes to CurDir/ParentDir components. The current code appends './' and '../' which means these special components also have a slash appended that needs to be popped, yet the pop() at line 72-74 is meant only for the Normal case.","locations":[{"ref":"crates/tauri-utils/src/assets.rs:61-67","code":"   61 |           Component::CurDir => buf.push_str(\"./\"),\n   62 |           Component::ParentDir => buf.push_str(\"../\"),\n   63 |           Component::Prefix(prefix) => buf.push_str(&prefix.as_os_str().to_string_lossy()),\n   64 |           Component::Normal(s) => {\n   65 |             buf.push_str(&s.to_string_lossy());\n   66 |             buf.push('/')\n   67 |           }","lines":7,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/assets.rs#L61-L67"}]},
{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"insert_into_xml inserts the new XML block *before* the closing tag line instead of inside it. The closing tag line is pushed to rewritten *after* the injected content (line 163), so the output order is: injected block, then the closing tag line. This is correct visually, but if the parent_closing_tag appears on the same line as existing XML attributes (e.g. `/>` inlined), find() would match and the indentation calculation (index + 4) uses the byte offset of the tag within the line, not the start-of-line indent, producing wrong indentation for tags that are not at the beginning of a line.","fix":"Calculate indentation from the whitespace prefix at the beginning of `line`, not from the byte offset of the closing tag within the line. Use `let indentation = \" \".repeat(line.len() - line.trim_start().len() + 4);`.","locations":[{"ref":"crates/tauri-utils/src/build.rs:154-163","code":"  154 |     if let Some(index) = line.find(&parent_closing_tag) {\n  155 |       let indentation = \" \".repeat(index + 4);\n  156 |       rewritten.push(format!(\"{indentation}{block_comment}\"));\n  157 |       for l in contents.split('\\n') {\n  158 |         rewritten.push(format!(\"{indentation}{l}\"));\n  159 |       }\n  160 |       rewritten.push(format!(\"{indentation}{block_comment}\"));\n  161 |     }\n  162 | \n  163 |     rewritten.push(line.to_string());","lines":10,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/build.rs#L154-L163"}]},
{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In FrontendDist::fmt, serde_json::to_string is called with .unwrap() to format a Vec<PathBuf>. PathBuf serializes to a string in serde_json, so this should not fail in practice, but it is still an undocumented panic path in a Display impl.","fix":"Use a manual join instead: `files.iter().map(|p| p.display().to_string()).collect::<Vec<_>>().join(\", \")`, or handle the error explicitly.","locations":[{"ref":"crates/tauri-utils/src/config.rs:3406","code":" 3406 |       Self::Files(files) => write!(f, \"{}\", serde_json::to_string(files).unwrap()),","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/config.rs#L3406"}]},
{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"PackageVersionVisitor::visit_str checks if the given string is a path that exists on the filesystem at deserialization time. This means the config parser has a side effect that depends on the current working directory at deserialization time. If the working directory changes between deserialization and when the version is actually needed, or if the file is absent during tests or in contexts where it is not expected, a legitimate semver string that coincidentally is also a valid path could be misinterpreted.","fix":"This is an intentional design choice (path-to-package.json) but should be clearly documented. Consider requiring the path value to start with './' or '/' to distinguish it from semver strings, reducing the ambiguity.","locations":[{"ref":"crates/tauri-utils/src/config.rs:3626-3658","code":" 3626 |         let path = PathBuf::from(value);\n 3627 |         if path.exists() {\n 3628 |           let json_str = read_to_string(&path)\n 3629 |             .map_err(|e| DeError::custom(format!(\"failed to read version JSON file: {e}\")))?;\n 3630 |           let package_json: serde_json::Value = serde_json::from_str(&json_str)\n 3631 |             .map_err(|e| DeError::custom(format!(\"failed to read version JSON file: {e}\")))?;\n 3632 |           if let Some(obj) = package_json.as_object() {\n 3633 |             let version = obj\n 3634 |               .get(\"version\")\n 3635 |               .ok_or_else(|| DeError::custom(\"JSON must contain a `version` field\"))?\n 3636 |               .as_str()\n 3637 |               .ok_or_else(|| {\n 3638 |                 DeError::custom(format!(\"`{} > version` must be a string\", path.display()))\n 3639 |               })?;\n 3640 |             Ok(PackageVersion(\n 3641 |               Version::from_str(version)\n 3642 |                 .map_err(|_| {\n 3643 |                   DeError::custom(\"`tauri.conf.json > version` must be a semver string\")\n 3644 |                 })?\n 3645 |                 .to_string(),\n 3646 |             ))\n 3647 |           } else {\n 3648 |             Err(DeError::custom(\n 3649 |               \"`tauri.conf.json > version` value is not a path to a JSON object\",\n 3650 |             ))\n 3651 |           }\n 3652 |         } else {\n 3653 |           Ok(PackageVersion(\n 3654 |             Version::from_str(value)\n 3655 |               .map_err(|_| DeError::custom(\"`tauri.conf.json > version` must be a semver string\"))?\n 3656 |               .to_string(),\n 3657 |           ))\n 3658 |         }","lines":33,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/config.rs#L3626-L3658"}]},
{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"read_from in config/parse.rs hardcodes the primary config filename as 'tauri.conf.json'. It does not attempt the JSON5 or TOML primary config files; those are found only via the fallback logic inside do_parse. This means if a project uses only Tauri.toml (no tauri.conf.json), read_from will call parse_value with a path that doesn't exist, do_parse will then probe for .json5 and .toml variants and succeed with the toml path - but the returned path stored in config_paths[0] will be the wrong json path, not the actual toml path.","fix":"Use does_supported_file_name_exist to find the actual primary config file first, or let do_parse return the resolved path (which it already does) and trust that. The current code already works correctly for the returned value but the `config_file_path` variable name and documentation claim it points to the JSON file, whereas it may point to a TOML or JSON5 file. This is not a bug in the path returned by parse_value, but the comment at line 168-180 is misleading.","locations":[{"ref":"crates/tauri-utils/src/config/parse.rs:181-187","code":"  181 |   let (mut config, config_file_path) = parse_value(target, root_dir.join(\"tauri.conf.json\"))?;\n  182 |   let mut config_paths = vec![config_file_path];\n  183 |   if let Some((platform_config, path)) = read_platform(target, root_dir)? {\n  184 |     config_paths.push(path);\n  185 |     merge(&mut config, &platform_config);\n  186 |   }\n  187 |   Ok((config, config_paths))","lines":7,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/config/parse.rs#L181-L187"}]},
{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"CspDirectiveSources::contains() for the Inline variant only checks for the source surrounded by spaces ('{source} ' or ' {source}'). If the inline string contains only a single source with no surrounding spaces (e.g. \"'self'\"), the check returns false even though the source is present. This causes the deduplication guard in tauri/src/manager/mod.rs to re-insert the source, producing duplicate CSP entries such as \"'self' 'self'\".","fix":"Also check s == source (exact match for single-element string) and consider using split(' ').any(|tok| tok == source) for robustness.","locations":[{"ref":"crates/tauri-utils/src/config_v1/mod.rs:1135-1140","code":" 1135 |   pub fn contains(&self, source: &str) -> bool {\n 1136 |     match self {\n 1137 |       Self::Inline(s) => s.contains(&format!(\"{source} \")) || s.contains(&format!(\" {source}\")),\n 1138 |       Self::List(l) => l.contains(&source.into()),\n 1139 |     }\n 1140 |   }","lines":6,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/config_v1/mod.rs#L1135-L1140"},{"ref":"crates/tauri/src/manager/mod.rs:147-149","code":"  147 |     if !sources.contains(&self_source) {\n  148 |       sources.push(self_source);\n  149 |     }","lines":3,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/manager/mod.rs#L147-L149"}]},
{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"The `normalize` helper silently discards the `Component::Prefix` (Windows drive prefix, e.g. `C:`). A path like `C:\\foo\\bar` normalises to `/foo/bar` - losing the drive letter entirely. This can cause `path.exists()` to return the wrong answer, or cause the wrong target path to be computed when a Windows-absolute source path is passed.","fix":"Preserve the `Prefix` component: `Component::Prefix(p) => dest.push(p.as_os_str())`.","locations":[{"ref":"crates/tauri-utils/src/resources.rs:31-43","code":"   31 | fn normalize(path: &Path) -> PathBuf {\n   32 |   let mut dest = PathBuf::new();\n   33 |   for component in path.components() {\n   34 |     match component {\n   35 |       Component::Prefix(_) => {}\n   36 |       Component::RootDir => dest.push(\"/\"),\n   37 |       Component::CurDir => {}\n   38 |       Component::ParentDir => dest.push(\"..\"),\n   39 |       Component::Normal(string) => dest.push(string),\n   40 |     }\n   41 |   }\n   42 |   dest\n   43 | }","lines":13,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/resources.rs#L31-L43"}]},
{"id":"LOGIC_34","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Stack-overflow risk from unbounded recursion in `next_current_iter`. The method recursively calls itself to skip every directory entry. A WalkDir traversal of a very deeply nested directory tree (or a pathological tree with many empty subdirectory levels) will keep recursing, one frame per directory, until the stack is exhausted. There is no iteration-based replacement.","fix":"Convert the recursive skip loop into an iterative `loop { ... }` that continues instead of recursing.","locations":[{"ref":"crates/tauri-utils/src/resources.rs:188-203","code":"  188 |   fn next_current_iter(&mut self) -> Option<crate::Result<Resource>> {\n  189 |     let current_iter = self.current_iter.as_mut().unwrap();\n  190 |     let entry = current_iter.next()?;\n  191 | \n  192 |     Some(match entry {\n  193 |       Ok(entry) => {\n  194 |         // Skip directories\n  195 |         if entry.is_dir() {\n  196 |           self.next_current_iter()?\n  197 |         } else {\n  198 |           self.resource_from_path(normalize(&entry))\n  199 |         }\n  200 |       }\n  201 |       Err(error) => Err(error),\n  202 |     })\n  203 |   }","lines":16,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/resources.rs#L188-L203"},{"ref":"crates/tauri-utils/src/resources.rs:195-197","code":"  195 |         if entry.is_dir() {\n  196 |           self.next_current_iter()?\n  197 |         } else {","lines":3,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/resources.rs#L195-L197"}]},
{"id":"LOGIC_35","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `on_event_loop_event`, when both `#[cfg(target_os = \"macos\")]` and `#[cfg(target_os = \"ios\")]` features are inactive (e.g. Linux/Windows), the final arm `_ => unimplemented!()` at line 2641 would be reached if the runtime ever emits any new event variants that are not yet handled. This is a latent panic on future runtime updates.","fix":"Consider replacing `unimplemented!()` with a logged warning and a safe default (`RunEvent::MainEventsCleared` or similar), or add a `#[non_exhaustive]` note explaining which variants are expected.","locations":[{"ref":"crates/tauri/src/app.rs:2686","code":" 2686 |     _ => unimplemented!(),","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/app.rs#L2686"}]},
{"id":"LOGIC_36","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `Listeners::emit_filter`, the `maybe_pending` flag is set to `true` whenever at least one callback was invoked, then `flush_pending()` is called. However, `flush_pending` can itself call `emit` which will invoke more callbacks. If those callbacks call `unlisten` or `listen` while the handlers lock is already released, the pending queue can accumulate items that are flushed incorrectly on the *next* event (the flag only guards a single level). This is a well-known re-entrancy hazard in the `try_lock`-based pending-queue pattern.","fix":"Consider using a recursive-aware flush or depth counter to avoid flushing stale/incorrect entries when re-entrant emissions occur.","locations":[{"ref":"crates/tauri/src/event/listener.rs:208-233","code":"  208 |   pub(crate) fn emit_filter<F>(&self, emit_args: EmitArgs, filter: Option<F>) -> crate::Result<()>\n  209 |   where\n  210 |     F: Fn(&EventTarget) -> bool,\n  211 |   {\n  212 |     let mut maybe_pending = false;\n  213 | \n  214 |     match self.inner.handlers.try_lock() {\n  215 |       Err(_) => self.insert_pending(Pending::Emit(emit_args)),\n  216 |       Ok(lock) => {\n  217 |         if let Some(handlers) = lock.get(&emit_args.event) {\n  218 |           let handlers = handlers.iter();\n  219 |           let handlers = handlers.filter(|(_, h)| match_any_or_filter(&h.target, &filter));\n  220 |           for (&id, Handler { callback, .. }) in handlers {\n  221 |             maybe_pending = true;\n  222 |             (callback)(Event::new(id, emit_args.payload.clone()))\n  223 |           }\n  224 |         }\n  225 |       }\n  226 |     }\n  227 | \n  228 |     if maybe_pending {\n  229 |       self.flush_pending()?;\n  230 |     }\n  231 | \n  232 |     Ok(())\n  233 |   }","lines":26,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/event/listener.rs#L208-L233"}]},
{"id":"LOGIC_37","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `add_capability_inner`, `self.scope_manager.global_scope_cache` is reset inside the loop over `resolved.global_scope` (line 188), so it is invalidated once per plugin scope entry. If multiple plugins update global scope, the cache is thrashed N times instead of once after the loop completes. The current logic is correct but wasteful; more importantly it indicates that concurrent readers of `global_scope_cache` may observe stale values between iterations.","fix":"Move `self.scope_manager.global_scope_cache = StateManager::new();` outside the `for` loop, after all entries have been processed.","locations":[{"ref":"crates/tauri/src/ipc/authority.rs:182-189","code":"  182 |     for (plugin, global_scope) in resolved.global_scope {\n  183 |       let global_scope_entry = self.scope_manager.global_scope.entry(plugin).or_default();\n  184 | \n  185 |       global_scope_entry.allow.extend(global_scope.allow);\n  186 |       global_scope_entry.deny.extend(global_scope.deny);\n  187 | \n  188 |       self.scope_manager.global_scope_cache = StateManager::new();\n  189 |     }","lines":8,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/ipc/authority.rs#L182-L189"}]},
{"id":"LOGIC_38","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `channel.rs`, `CHANNEL_DATA_COUNTER` is a global `AtomicU32` that wraps around at `u32::MAX`. If more than 2^32 large payloads are sent through channels during an app session (unlikely but theoretically possible in long-running apps), counter reuse could cause a new `data_id` to overwrite a pending entry in `ChannelDataIpcQueue` before the fetch completes, silently delivering the wrong data to the frontend.","fix":"Use `AtomicU64` for the counter, or validate that no entry with the same id already exists before inserting.","locations":[{"ref":"crates/tauri/src/ipc/channel.rs:42","code":"   42 | static CHANNEL_DATA_COUNTER: AtomicU32 = AtomicU32::new(0);","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/ipc/channel.rs#L42"},{"ref":"crates/tauri/src/ipc/channel.rs:169-176","code":"  169 |             let data_id = CHANNEL_DATA_COUNTER.fetch_add(1, Ordering::Relaxed);\n  170 | \n  171 |             webview\n  172 |               .state::<ChannelDataIpcQueue>()\n  173 |               .0\n  174 |               .lock()\n  175 |               .unwrap()\n  176 |               .insert(data_id, body);","lines":8,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/ipc/channel.rs#L169-L176"}]},
{"id":"LOGIC_39","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `channel.rs`, the `from_callback_fn` and `JavaScriptChannelId::channel_on` paths both send large payloads through `ChannelDataIpcQueue` and then immediately invoke a JavaScript `fetch` to retrieve them. If the `fetch` command races with another channel send that evicts the entry (because both generate the same `data_id` after counter wrap-around or another bug), the data is silently lost and the frontend receives no error. The `fetch` command returns `Err(\"data not found\")` which is caught by `.catch(console.error)` in the generated JS, so failures are swallowed.","fix":"Propagate fetch errors back to the channel consumer instead of only logging to console, and consider a timeout or cleanup mechanism for orphaned queue entries.","locations":[{"ref":"crates/tauri/src/ipc/channel.rs:168-181","code":"  168 |           _ => {\n  169 |             let data_id = CHANNEL_DATA_COUNTER.fetch_add(1, Ordering::Relaxed);\n  170 | \n  171 |             webview\n  172 |               .state::<ChannelDataIpcQueue>()\n  173 |               .0\n  174 |               .lock()\n  175 |               .unwrap()\n  176 |               .insert(data_id, body);\n  177 | \n  178 |             webview.eval(format!(\n  179 |               \"window.__TAURI_INTERNALS__.invoke('{FETCH_CHANNEL_DATA_COMMAND}', null, {{ headers: {{ '{CHANNEL_ID_HEADER_NAME}': '{data_id}' }} }}).then((response) => window.__TAURI_INTERNALS__.runCallback({callback_id}, {{ message: response, index: {current_index} }})).catch(console.error)\",\n  180 |             ))?;\n  181 |           }","lines":14,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/ipc/channel.rs#L168-L181"},{"ref":"crates/tauri/src/ipc/channel.rs:264-276","code":"  264 |           _ => {\n  265 |             let data_id = CHANNEL_DATA_COUNTER.fetch_add(1, Ordering::Relaxed);\n  266 | \n  267 |             webview\n  268 |               .state::<ChannelDataIpcQueue>()\n  269 |               .0\n  270 |               .lock()\n  271 |               .unwrap()\n  272 |               .insert(data_id, body);\n  273 | \n  274 |             webview.eval(format!(\n  275 |               \"window.__TAURI_INTERNALS__.invoke('{FETCH_CHANNEL_DATA_COMMAND}', null, {{ headers: {{ '{CHANNEL_ID_HEADER_NAME}': '{data_id}' }} }}).then((response) => window.__TAURI_INTERNALS__.runCallback({callback_id}, response)).catch(console.error)\",\n  276 |             ))?;","lines":13,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/ipc/channel.rs#L264-L276"}]},
{"id":"LOGIC_40","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In the IPC post-message path, when the response is InvokeResponseBody::Json and the JSON string starts with '{' or '[', Tauri skips the normal callback eval path and instead sends via a Channel. This works on most platforms, but the condition `!(cfg!(target_os = \"macos\") || cfg!(target_os = \"ios\"))` means macOS/iOS always use the eval path even when can_use_channel_for_response would be true. This asymmetry is not documented and could surprise developers expecting consistent behavior.","fix":"Document clearly why macOS and iOS skip the channel path for JSON objects/arrays, or unify the code paths if the platform limitation no longer applies.","locations":[{"ref":"crates/tauri/src/ipc/protocol.rs:372-388","code":"  372 |               if !(cfg!(target_os = \"macos\") || cfg!(target_os = \"ios\"))\n  373 |                 && (v.starts_with('{') || v.starts_with('['))\n  374 |                 && can_use_channel_for_response\n  375 |               {\n  376 |                 let _ =\n  377 |                   Channel::from_callback_fn(webview, callback).send(InvokeResponseBody::Json(v));\n  378 |               } else {\n  379 |                 responder_eval(\n  380 |                   &webview,\n  381 |                   crate::ipc::format_callback::format_result_raw(\n  382 |                     Result::<_, String>::Ok(v),\n  383 |                     callback,\n  384 |                     error,\n  385 |                   ),\n  386 |                   error,\n  387 |                 )\n  388 |               }","lines":17,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/ipc/protocol.rs#L372-L388"}]},
{"id":"LOGIC_41","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Inconsistent recursive flag passed to allow_directory during drag-drop. In on_webview_event (webview.rs) dropped directories are allowed non-recursively (false), but in on_window_event (window.rs) dropped directories are allowed recursively (true). This means dropping a folder onto a WebviewWindow grants recursive access while dropping onto a bare webview does not, creating a security inconsistency.","fix":"Decide the intended behavior and make both call sites consistent. Non-recursive (false) is the safer default; recursive access should be explicitly documented and opt-in.","locations":[{"ref":"crates/tauri/src/manager/webview.rs:753","code":"  753 |             let _ = scopes.allow_directory(path, false);","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/manager/webview.rs#L753"},{"ref":"crates/tauri/src/manager/window.rs:238","code":"  238 |             let _ = scopes.allow_directory(path, true);","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/manager/window.rs#L238"}]},
{"id":"LOGIC_42","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"Android PathResolver: `local_data_dir()` resolves to `getDataDir` instead of a dedicated local-data endpoint, making it identical to `data_dir()`. The docstring says it resolves to the local data directory but uses the same plugin call as `data_dir`.","fix":"Change `self.call_resolve(\"getDataDir\")` to `self.call_resolve(\"getLocalDataDir\")` (or the correct Android-side method name), or document that both intentionally resolve to the same directory.","locations":[{"ref":"crates/tauri/src/path/android.rs:92-95","code":"   92 |   /// Returns the path to the user's local data directory.\n   93 |   pub fn local_data_dir(&self) -> Result<PathBuf> {\n   94 |     self.call_resolve(\"getDataDir\")\n   95 |   }","lines":4,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/path/android.rs#L92-L95"}]},
{"id":"LOGIC_43","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"Android PathResolver: `app_local_data_dir()` also calls `getDataDir` instead of a dedicated local-data endpoint, making it identical to `app_data_dir()`. The docstring says it resolves to `local_data_dir/${bundle_identifier}` but the underlying call is the same as `data_dir`.","fix":"Change the call to use the same plugin endpoint as `local_data_dir()` (once that is fixed), e.g. `self.call_resolve(\"getLocalDataDir\")`, and append `/${bundle_identifier}` if the Android side does not already do so.","locations":[{"ref":"crates/tauri/src/path/android.rs:153-155","code":"  153 |   pub fn app_local_data_dir(&self) -> Result<PathBuf> {\n  154 |     self.call_resolve(\"getDataDir\")\n  155 |   }","lines":3,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/path/android.rs#L153-L155"}]},
{"id":"LOGIC_44","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`parse()` in `path/mod.rs` silently swallows `Component::ParentDir` components (line 302-304) for all path components after the first. This means `$HOME/../../etc/passwd` resolves as `$HOME/etc/passwd` instead of an error or the correct traversal result, hiding potential path confusion bugs. The `SafePathBuf` type enforces this correctly, but `parse()` does not use it.","fix":"Either reject paths containing `..` after base-dir substitution (consistent with `SafePathBuf`), or actually apply the parent-dir semantic by popping the last component of `p`.","locations":[{"ref":"crates/tauri/src/path/mod.rs:301-306","code":"  301 |     for component in components {\n  302 |       if let Component::ParentDir = component {\n  303 |         continue;\n  304 |       }\n  305 |       p.push(component);\n  306 |     }","lines":6,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/path/mod.rs#L301-L306"}]},
{"id":"LOGIC_45","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`request_to_path` in `isolation.rs` already strips the leading `/` via `trim_start_matches('/')` before percent-decoding, then in the non-empty branch it calls `.chars().skip(1)` assuming the leading slash is still present. This drops the first real character of every non-empty path, so e.g. `/foo` becomes `oo` instead of `foo`.","fix":"Remove the `.chars().skip(1).collect()` call and return `path` directly in the non-empty branch, since the leading slash was already removed by `trim_start_matches('/')`.","locations":[{"ref":"crates/tauri/src/protocol/isolation.rs:94-112","code":"   94 | fn request_to_path(request: &http::Request<Vec<u8>>) -> String {\n   95 |   let path = request\n   96 |     .uri()\n   97 |     .path()\n   98 |     .trim_start_matches('/')\n   99 |     .trim_end_matches('/');\n  100 | \n  101 |   let path = percent_encoding::percent_decode(path.as_bytes())\n  102 |     .decode_utf8_lossy()\n  103 |     .to_string();\n  104 | \n  105 |   if path.is_empty() {\n  106 |     // if the url has no path, we should load `index.html`\n  107 |     \"index.html\".to_string()\n  108 |   } else {\n  109 |     // skip leading `/`\n  110 |     path.chars().skip(1).collect()\n  111 |   }\n  112 | }","lines":19,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/protocol/isolation.rs#L94-L112"}]},
{"id":"LOGIC_46","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"try_resolve_symlink_and_canonicalize only follows one level of symlink indirection. It calls read_link once on the path if it is a symlink, then canonicalizes the result - but the resolved target may itself be a symlink. An attacker can craft a two-level symlink chain to bypass the scope check (first symlink points to a second symlink that points outside the allowed scope; the second symlink is never resolved). std::fs::canonicalize already follows all levels, so the is_symlink / read_link check is redundant and wrong.","fix":"Remove the manual read_link step and use std::fs::canonicalize directly. If the file does not exist, fall back to the current logic of returning the path as-is.","locations":[{"ref":"crates/tauri/src/scope/fs.rs:471-483","code":"  471 | fn try_resolve_symlink_and_canonicalize<P: AsRef<Path>>(path: P) -> crate::Result<PathBuf> {\n  472 |   let path = path.as_ref();\n  473 |   let path = if path.is_symlink() {\n  474 |     std::fs::read_link(path)?\n  475 |   } else {\n  476 |     path.to_path_buf()\n  477 |   };\n  478 |   if !path.exists() {\n  479 |     crate::Result::Ok(path)\n  480 |   } else {\n  481 |     std::fs::canonicalize(path).map_err(Into::into)\n  482 |   }\n  483 | }","lines":13,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/scope/fs.rs#L471-L483"}]},
{"id":"LOGIC_47","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"TrayIcon::register always pushes a new global menu event listener when on_menu_event is Some, even when building via TrayIconBuilder - there is no deduplication. Calling TrayIconBuilder::on_menu_event and then also calling TrayIcon::on_menu_event registers two copies of the handler. Combined with the fact that the global_event_listeners Vec is never trimmed on tray close, repeated tray creation/destruction leaks listener closures indefinitely.","fix":"Use a keyed map (indexed by tray id) instead of a Vec for menu event listeners, or clear stale entries when the tray icon resource is closed.","locations":[{"ref":"crates/tauri/src/tray/mod.rs:421-456","code":"  421 |   fn register(\n  422 |     &self,\n  423 |     app_handle: &AppHandle<R>,\n  424 |     on_menu_event: Option<GlobalMenuEventListener<AppHandle<R>>>,\n  425 |     on_tray_icon_event: Option<GlobalTrayIconEventListener<TrayIcon<R>>>,\n  426 |   ) -> ResourceId {\n  427 |     if let Some(handler) = on_menu_event {\n  428 |       app_handle\n  429 |         .manager\n  430 |         .menu\n  431 |         .global_event_listeners\n  432 |         .lock()\n  433 |         .unwrap()\n  434 |         .push(handler);\n  435 |     }\n  436 | \n  437 |     if let Some(handler) = on_tray_icon_event {\n  438 |       app_handle\n  439 |         .manager\n  440 |         .tray\n  441 |         .event_listeners\n  442 |         .lock()\n  443 |         .unwrap()\n  444 |         .insert(self.id.clone(), handler);\n  445 |     }\n  446 | \n  447 |     let rid = app_handle.resources_table().add(self.clone());\n  448 |     app_handle\n  449 |       .manager\n  450 |       .tray\n  451 |       .icons\n  452 |       .lock()\n  453 |       .unwrap()\n  454 |       .push((self.id().clone(), rid));\n  455 |     rid\n  456 |   }","lines":36,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/tray/mod.rs#L421-L456"}]},
{"id":"LOGIC_48","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"TrayIcon::Resource::close swaps the matching entry out of the icons Vec but does NOT remove the per-tray event listener from manager.tray.event_listeners. After a TrayIcon is dropped its event listener remains in the map forever, causing a memory leak and stale handler invocations if another tray with the same id is later created.","fix":"In the close() method also remove the entry from manager.tray.event_listeners keyed by self.id.","locations":[{"ref":"crates/tauri/src/tray/mod.rs:642-652","code":"  642 | impl<R: Runtime> Resource for TrayIcon<R> {\n  643 |   fn close(self: std::sync::Arc<Self>) {\n  644 |     let mut icons = self.app_handle.manager.tray.icons.lock().unwrap();\n  645 |     for (i, (tray_icon_id, _rid)) in icons.iter_mut().enumerate() {\n  646 |       if tray_icon_id == &self.id {\n  647 |         icons.swap_remove(i);\n  648 |         return;\n  649 |       }\n  650 |     }\n  651 |   }\n  652 | }","lines":11,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/tray/mod.rs#L642-L652"}]},
{"id":"LOGIC_49","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"zoom-hotkey.js does not guard the macOS metaKey check in the mousewheel handler (line 31 only checks event.ctrlKey). On macOS, pinch-to-zoom sends synthetic wheel events with ctrlKey=true, so the handler fires but uses ctrlKey regardless of OS_NAME. This may conflict with pinch-to-zoom on macOS. More importantly, the keyboard handler on line 13 correctly checks metaKey on macOS, but the wheel handler unconditionally checks ctrlKey, creating an inconsistency.","fix":"Mirror the keyboard handler's OS_NAME check: use (OS_NAME === 'macos' ? event.metaKey : event.ctrlKey) in the wheel handler condition.","locations":[{"ref":"crates/tauri/src/webview/scripts/zoom-hotkey.js:30-43","code":"   30 | window.addEventListener('mousewheel', (event) => {\n   31 |   if (event.ctrlKey) {\n   32 |     event.preventDefault()\n   33 |     if (event.deltaY < 0) {\n   34 |       zoomLevel += 0.2\n   35 |     } else {\n   36 |       zoomLevel -= 0.2\n   37 |     }\n   38 |     zoomLevel = Math.min(Math.max(zoomLevel, MIN_ZOOM_LEVEL), MAX_ZOOM_LEVEL)\n   39 |     window.__TAURI_INTERNALS__.invoke('plugin:webview|set_webview_zoom', {\n   40 |       value: zoomLevel\n   41 |     })\n   42 |   }\n   43 | })","lines":14,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/webview/scripts/zoom-hotkey.js#L30-L43"}]},
