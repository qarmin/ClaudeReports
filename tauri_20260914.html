<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"In try_build(), multiple env::var_os / env::var calls use .unwrap() directly on required build-time variables (CARGO_CFG_TARGET_OS, TARGET, OUT_DIR, CARGO_CFG_TARGET_ENV, CARGO_CFG_TARGET_ARCH). While these are expected to be present in a Cargo build script, unwrap() produces a hard panic with no actionable message. Additionally line 662 calls .unwrap() on `file_description`, which is derived from three optional sources; if all three are absent (e.g. in a virtual workspace with no CARGO_PKG_NAME) the build panics with no explanation.","fix":"Replace .unwrap() with ? or .with_context(|| ...) for env-var reads so build failures produce readable error messages. For file_description, propagate the None case via an anyhow error instead of unwrapping.","locations":[{"ref":"crates/tauri-build/src/lib.rs:515","code":"  515 |   let target_os = env::var_os(\"CARGO_CFG_TARGET_OS\").unwrap();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-build/src/lib.rs#L515"},{"ref":"crates/tauri-build/src/lib.rs:520","code":"  520 |   let target_triple = env::var(\"TARGET\").unwrap();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-build/src/lib.rs#L520"},{"ref":"crates/tauri-build/src/lib.rs:577","code":"  577 |   let out_dir = PathBuf::from(env::var_os(\"OUT_DIR\").unwrap());","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-build/src/lib.rs#L577"},{"ref":"crates/tauri-build/src/lib.rs:708","code":"  708 |     res.set(\"FileDescription\", &file_description.unwrap());","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-build/src/lib.rs#L708"},{"ref":"crates/tauri-build/src/lib.rs:730","code":"  730 |     let target_env = env::var(\"CARGO_CFG_TARGET_ENV\").unwrap();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-build/src/lib.rs#L730"},{"ref":"crates/tauri-build/src/lib.rs:733","code":"  733 |         let target_arch = match env::var(\"CARGO_CFG_TARGET_ARCH\").unwrap().as_str() {","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-build/src/lib.rs#L733"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"In bundle_project() (bundle.rs), std::fs::read(binary).expect(\"Could not read binary file.\") panics if the binary cannot be read. This function is called from the main bundling flow and should return a crate::Result instead of aborting the process.","fix":"Use std::fs::read(binary).map_err(|e| crate::Error::GenericError(e.to_string()))? instead.","locations":[{"ref":"crates/tauri-bundler/src/bundle.rs:88","code":"   88 |   let mut file_data = std::fs::read(binary).expect(\"Could not read binary file.\");","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-bundler/src/bundle.rs#L88"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"binary_arch() panics with an unformatted message when the target triple does not match any known prefix. This can be triggered at runtime by any caller passing an unsupported cross-compilation target, turning a recoverable configuration error into a process crash.","fix":"Return crate::Result<Arch> and use `Err(crate::Error::ArchError(...))` instead of `panic!`. All call sites already handle the Err variant when they match on the result.","locations":[{"ref":"crates/tauri-bundler/src/bundle/settings.rs:1051","code":" 1051 |       panic!(\"Unexpected target triple {}\", self.target)","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-bundler/src/bundle/settings.rs#L1051"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"serde_json::from_str(include_str!(\"./languages.json\")).unwrap() panics on a malformed embedded JSON at compile-time data that would only be caught at runtime. Any corruption of the embedded file causes an abort.","fix":"Use .expect(\"bundled languages.json is invalid\") to at least give a useful message, or deserialize it at compile time with a build script / const assertion.","locations":[{"ref":"crates/tauri-bundler/src/bundle/windows/msi/mod.rs:594-595","code":"  594 |   let language_map: HashMap<String, LanguageMetadata> =\n  595 |     serde_json::from_str(include_str!(\"./languages.json\")).unwrap();","lines":2,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-bundler/src/bundle/windows/msi/mod.rs#L594-L595"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"language_map.get(&language).unwrap_or_else(|| panic!(...)) panics when the user configures an unknown WiX language. This is a user-configuration error and should produce a proper error message returned through the Result chain, not a panic.","fix":"Replace the unwrap_or_else+panic with `.ok_or_else(|| crate::Error::GenericError(format!(\"Language {language} not found...\")))? `.","locations":[{"ref":"crates/tauri-bundler/src/bundle/windows/msi/mod.rs:831-841","code":"  831 |     let language_metadata = language_map.get(&language).unwrap_or_else(|| {\n  832 |       panic!(\n  833 |         \"Language {} not found. It must be one of {}\",\n  834 |         language,\n  835 |         language_map\n  836 |           .keys()\n  837 |           .cloned()\n  838 |           .collect::<Vec<String>>()\n  839 |           .join(\", \")\n  840 |       )\n  841 |     });","lines":11,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-bundler/src/bundle/windows/msi/mod.rs#L831-L841"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"os_pipe::dup_stdout() and dup_stderr() are called with .unwrap() without any error context. These syscalls can fail (e.g. resource exhaustion, bad file descriptors), causing a panic that kills the entire CLI process without a useful message.","fix":"Propagate the errors: `os_pipe::dup_stdout().context(\"failed to dup stdout\")?` and similarly for stderr, or at minimum use expect() with a meaningful message.","locations":[{"ref":"crates/tauri-cli/src/dev.rs:203-204","code":"  203 |         command.stdout(os_pipe::dup_stdout().unwrap());\n  204 |         command.stderr(os_pipe::dup_stderr().unwrap());","lines":2,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/dev.rs#L203-L204"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"SharedChild::spawn() is called with unwrap_or_else(|_| panic!(...)), which panics on spawn failure. The error value is discarded, so the underlying OS error (e.g. command not found, permission denied) is lost.","fix":"Return a Result instead: `SharedChild::spawn(&mut command).map_err(|error| Error::CommandFailed { command: before_dev.clone(), error })?`.","locations":[{"ref":"crates/tauri-cli/src/dev.rs:206-207","code":"  206 |         let child = SharedChild::spawn(&mut command)\n  207 |           .unwrap_or_else(|_| panic!(\"failed to run `{before_dev}`\"));","lines":2,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/dev.rs#L206-L207"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"SectionItem::fmt calls unwrap() on split_once(':') result. Any SectionItem whose description does not contain a colon will panic at display time. This affects every item in the info output - a description like 'not installed!' (no colon) would crash the CLI.","fix":"Replace the unwrap with a fallback: use `desc.split_once(':').unwrap_or((&desc, \"\"))` so items without a colon are still displayed safely.","locations":[{"ref":"crates/tauri-cli/src/info/mod.rs:139","code":"  139 |     let (first, second) = desc.split_once(':').unwrap();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/info/mod.rs#L139"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"init::command calls .expect(\"Failed to render tauri.conf.json template\") and .unwrap() on JSON parsing of the rendered template. These are compile-time-embedded templates so normally safe, but any bug in a template (e.g. bad merge data) produces an opaque panic rather than a user-friendly error.","fix":"Return the errors via ? with context: use render_template(...).context(\"failed to render tauri.conf.json\")? and serde_json::from_str(...).context(\"failed to parse rendered config\")?.","locations":[{"ref":"crates/tauri-cli/src/init.rs:267-272","code":"  267 |     let mut config = serde_json::from_str(\n  268 |       &handlebars\n  269 |         .render_template(TAURI_CONF_TEMPLATE, &data)\n  270 |         .expect(\"Failed to render tauri.conf.json template\"),\n  271 |     )\n  272 |     .unwrap();","lines":6,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/init.rs#L267-L272"}]},
{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"RustAppSettings::new contains two chained .expect() calls when resolving the package version from Cargo.toml. If the version field is missing or uses workspace inheritance that can't be resolved, the CLI panics with an opaque message instead of returning a proper error.","fix":"Replace the two .expect() calls with .ok_or_else(|| crate::Error::GenericError(...))? so the error propagates as a Result.","locations":[{"ref":"crates/tauri-cli/src/interface/rust.rs:1077-1084","code":" 1077 |         .expect(\"Cargo manifest must have the `package.version` field\")\n 1078 |         .resolve(\"version\", || {\n 1079 |           ws_package_settings\n 1080 |             .as_ref()\n 1081 |             .and_then(|p| p.version.clone())\n 1082 |             .context(\"Couldn't inherit value for `version` from workspace\")\n 1083 |         })\n 1084 |         .expect(\"Cargo project does not have a version\")","lines":8,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/interface/rust.rs#L1077-L1084"}]},
{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"RustAppSettings::new calls rustc -vV then .unwrap() on find() to extract the host triple. If rustc output changes format or 'host:' line is absent, this panics.","fix":"Replace .unwrap() with .ok_or_else(|| crate::Error::GenericError(\"could not determine host triple from rustc output\".into()))? and propagate the error.","locations":[{"ref":"crates/tauri-cli/src/interface/rust.rs:1138-1149","code":" 1138 |           let output = Command::new(\"rustc\")\n 1139 |             .args([\"-vV\"])\n 1140 |             .output()\n 1141 |             .expect(\"\\\"rustc\\\" could not be found, did you install Rust?\");\n 1142 |           let stdout = String::from_utf8_lossy(&output.stdout);\n 1143 |           stdout\n 1144 |             .split('\\n')\n 1145 |             .find(|l| l.starts_with(\"host:\"))\n 1146 |             .unwrap()\n 1147 |             .replace(\"host:\", \"\")\n 1148 |             .trim()\n 1149 |             .to_string()","lines":12,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/interface/rust.rs#L1138-L1149"}]},
{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"pkgconfig_utils::get_appindicator_library_path() calls panic!() when neither ayatana-appindicator3 nor appindicator3 is found via pkg-config. This panic occurs at bundle time on Linux systems that do not have either library installed.","fix":"Return a Result from get_appindicator_library_path and propagate the error instead of panicking.","locations":[{"ref":"crates/tauri-cli/src/interface/rust.rs:1703","code":" 1703 |         None => panic!(\"Can't detect any appindicator library\"),","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/interface/rust.rs#L1703"}]},
{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"Regex is compiled with `.unwrap()` inside a hot closure that runs on every invocation of `exec()`. If the regex string were ever changed to be invalid this would panic at runtime with no error context. Even as-is, it wastes compile time on every call.","fix":"Compile the regex once with `once_cell::sync::Lazy` or `std::sync::LazyLock` outside the closure, or at minimum replace `.unwrap()` with `.expect(\"BUG: hardcoded regex is invalid\")`.","locations":[{"ref":"crates/tauri-cli/src/mobile/init.rs:81","code":"   81 |         let r = regex::Regex::new(\"(nodejs|node)\\\\-?([1-9]*)*$\").unwrap();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/mobile/init.rs#L81"}]},
{"id":"PANIC_14","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`Target::all().get(key).unwrap()` will panic if the key derived from `options.targets` is not present in the target map. When `options.targets` is `Some([])` (empty vec), `t.first()` returns `None` and the fallback `Target::DEFAULT_KEY` is used, so that specific path is safe - but any caller supplying a single non-canonical target name (e.g. a mis-spelled target) will cause an unconditional panic instead of a user-friendly error.","fix":"Replace `.unwrap()` with `.ok_or_else(|| Error::GenericError(format!(\"unknown iOS target: {key}\")))` and propagate the error with `?`.","locations":[{"ref":"crates/tauri-cli/src/mobile/ios/build.rs:185-197","code":"  185 |     Target::all()\n  186 |       .get(\n  187 |         options\n  188 |           .targets\n  189 |           .as_ref()\n  190 |           .and_then(|t| t.first())\n  191 |           .map(|t| t.as_str())\n  192 |           .unwrap_or(Target::DEFAULT_KEY),\n  193 |       )\n  194 |       .unwrap()\n  195 |       .triple\n  196 |       .into(),\n  197 |   );","lines":13,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/mobile/ios/build.rs#L185-L197"}]},
{"id":"PANIC_15","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"rx.recv().unwrap() in reparent() will panic if the main thread drops the sender before replying (e.g. on event-loop shutdown or if the window is not found). The only call-site that sends on that channel is inside an `if let Some(webview) = webview_handle` guard; if the webview is not found, `tx.send(Err(...))` IS reached, so the channel always closes - but a future refactor that adds an early-return path could silently introduce a hang or panic. The immediate issue is that `recv().unwrap()` converts a channel-disconnect into a panic rather than a graceful error.","fix":"Replace `rx.recv().unwrap()?` with `rx.recv().map_err(|_| Error::FailedToReceiveMessage)?`.","locations":[{"ref":"crates/tauri-runtime-wry/src/lib.rs:1671","code":" 1671 |     rx.recv().unwrap()?;","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-runtime-wry/src/lib.rs#L1671"}]},
{"id":"PANIC_16","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"cookies_for_url() calls rx.recv().unwrap() directly, which will panic if the main-thread handler is gone (event loop shut down). Unlike most getters, this method does not go through the `getter!` macro that converts the channel error into `Error::FailedToReceiveMessage`.","fix":"Use `.recv().map_err(|_| Error::FailedToReceiveMessage)?` instead of `.recv().unwrap()`.","locations":[{"ref":"crates/tauri-runtime-wry/src/lib.rs:1685","code":" 1685 |     rx.recv().unwrap()","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-runtime-wry/src/lib.rs#L1685"}]},
{"id":"PANIC_17","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"WryHandle::create_tao_window() calls rx.recv().unwrap(), which panics if the event-loop is gone or never sends a reply. This is a public API function.","fix":"Replace `.recv().unwrap()` with `.recv().map_err(|_| Error::FailedToReceiveMessage)?` and propagate with `?`.","locations":[{"ref":"crates/tauri-runtime-wry/src/lib.rs:2541","code":" 2541 |     rx.recv().unwrap()","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-runtime-wry/src/lib.rs#L2541"}]},
{"id":"PANIC_18","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"WryHandle::window_id() calls .unwrap() on the map lookup. If the caller passes a TaoWindowId that was never registered (e.g. a destroyed window or a raw window created outside Tauri), this panics with no error recovery path.","fix":"Return `Option<WindowId>` or `Result<WindowId>` instead of unwrapping.","locations":[{"ref":"crates/tauri-runtime-wry/src/lib.rs:2546","code":" 2546 |     self.context.window_id_map.get(&window_id).unwrap()","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-runtime-wry/src/lib.rs#L2546"}]},
{"id":"PANIC_19","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"Both `tauri-runtime/build.rs` and `tauri-runtime-wry/build.rs` call `std::env::var(\"CARGO_CFG_TARGET_OS\").unwrap()` without handling the error. If the variable is absent (non-Cargo build environment or a future toolchain change), the build script panics with an unhelpful message instead of surfacing the real cause.","fix":"Use `std::env::var(\"CARGO_CFG_TARGET_OS\").expect(\"CARGO_CFG_TARGET_OS not set\")` or propagate the error through a `Result`-returning main.","locations":[{"ref":"crates/tauri-runtime/build.rs:15","code":"   15 |   let target_os = std::env::var(\"CARGO_CFG_TARGET_OS\").unwrap();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-runtime/build.rs#L15"},{"ref":"crates/tauri-runtime-wry/build.rs:15","code":"   15 |   let target_os = std::env::var(\"CARGO_CFG_TARGET_OS\").unwrap();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-runtime-wry/build.rs#L15"}]},
{"id":"PANIC_20","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"In `parse_permissions`, `path.extension().unwrap()` panics if a file in `paths` has no extension. The call-site in `define_permissions` filters by extension before calling this function, so ordinary usage is safe. However `parse_permissions` is also called from `read_permissions` after deserialising the paths from JSON - those paths are not pre-filtered, so a path without an extension would panic here.","fix":"Replace `.unwrap()` with `.and_then(|e| e.to_str()).unwrap_or_default()`, or return an `Error::UnknownPermissionFormat` for the empty-extension case instead of panicking.","locations":[{"ref":"crates/tauri-utils/src/acl/build.rs:57","code":"   57 |     let ext = path.extension().unwrap().to_string_lossy().to_string();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/acl/build.rs#L57"}]},
{"id":"PANIC_21","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`resolve_command` panics when parsing a remote URL pattern from a capability: `url.parse().unwrap_or_else(|e| panic!(...))`. This URL pattern comes from user-authored capability files, so a malformed pattern causes the entire app build to abort with a panic instead of a proper error. The function already returns `Result<(), Error>`, so the panic is unnecessary.","fix":"Return `Err(Error::...)` instead of panicking. Add a new error variant for invalid URL patterns if needed, or reuse an existing one.","locations":[{"ref":"crates/tauri-utils/src/acl/resolved.rs:269-271","code":"  269 |           .unwrap_or_else(|e| panic!(\"invalid URL pattern for remote URL {url}: {e}\")),\n  270 |       }\n  271 |     }));","lines":3,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/acl/resolved.rs#L269-L271"}]},
{"id":"PANIC_22","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"Unconditional unwrap on std::env::var(\"TARGET\") in link_xcode_library. If the TARGET env var is absent (e.g. when the function is called outside a Cargo build script context), this panics with an unhelpful message.","fix":"Use unwrap_or_else with a sensible default or return early with an error: `std::env::var(\"TARGET\").unwrap_or_default()` and then handle the empty/unknown case in the match arm that already returns early.","locations":[{"ref":"crates/tauri-utils/src/build.rs:52","code":"   52 |   let (sdk, arch) = match std::env::var(\"TARGET\").unwrap().as_str() {","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/build.rs#L52"}]},
{"id":"PANIC_23","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"Unconditional unwrap on std::env::var_os(\"OUT_DIR\") in link_xcode_library. If OUT_DIR is not set the function panics.","fix":"Use `std::env::var_os(\"OUT_DIR\").expect(\"OUT_DIR must be set in build scripts\")` or propagate as an error.","locations":[{"ref":"crates/tauri-utils/src/build.rs:59","code":"   59 |   let out_dir = std::env::var_os(\"OUT_DIR\").map(PathBuf::from).unwrap();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/build.rs#L59"}]},
{"id":"PANIC_24","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"Unconditional unwrap on Command::status() result in link_xcode_library. If xcodebuild is not found on PATH or cannot be spawned, this panics. Additionally `assert!(status.success())` panics with no message if the build fails.","fix":"Handle the Err case from .status() by printing a descriptive error message and exiting (this is a build script, not production code, but the panic message is unhelpful). Replace `assert!(status.success())` with a check that prints the exit code: `if !status.success() { panic!(\"xcodebuild failed with {status}\"); }`.","locations":[{"ref":"crates/tauri-utils/src/build.rs:80-82","code":"   80 |     .unwrap();\n   81 | \n   82 |   assert!(status.success());","lines":3,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/build.rs#L80-L82"}]},
{"id":"PANIC_25","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"inline_isolation() in html.rs panics unconditionally if a script element's src file cannot be read (expect on fs::read_to_string) or if the document cannot be parsed for scripts (expect on select()). These can fail with attacker-controlled filenames in the isolation directory.","fix":"Return a Result<(), crate::Error> and propagate errors with `?` instead of expect/panic.","locations":[{"ref":"crates/tauri-utils/src/html.rs:257-258","code":"  257 |     .select(\"script[src]\")\n  258 |     .expect(\"unable to parse document for scripts\")","lines":2,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/html.rs#L257-L258"},{"ref":"crates/tauri-utils/src/html.rs:276","code":"  276 |     let file = std::fs::read_to_string(dir.join(path)).expect(\"unable to find isolation file\");","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/html.rs#L276"}]},
{"id":"PANIC_26","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"inline_isolation() in html2.rs has the same unconditional panic on fs::read_to_string failure as the html.rs version - it is a straight copy.","fix":"Same as html.rs: return a Result and propagate I/O errors.","locations":[{"ref":"crates/tauri-utils/src/html2.rs:156","code":"  156 |     let file = std::fs::read_to_string(dir.join(path)).expect(\"unable to find isolation file\");","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/html2.rs#L156"}]},
{"id":"PANIC_27","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`unwrap()` on `MudaIcon::from_rgba` inside `run_main_thread!` closure in `new_with_icon` and `with_id_and_icon`. If the icon dimensions don't match the pixel data length, `from_rgba` returns an error and the unwrap panics on the main thread, crashing the application.","fix":"Propagate the error: validate icon dimensions before entering the main thread closure (computing `rgba * 4 == width * height * 4`), or convert the error into `crate::Error` and return it.","locations":[{"ref":"crates/tauri/src/menu/submenu.rs:119","code":"  119 |         submenu.set_icon(Some(MudaIcon::from_rgba(rgba, width, height).unwrap()));","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/menu/submenu.rs#L119"},{"ref":"crates/tauri/src/menu/submenu.rs:183","code":"  183 |         submenu.set_icon(Some(MudaIcon::from_rgba(rgba, width, height).unwrap()));","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/menu/submenu.rs#L183"}]},
{"id":"PANIC_28","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"Multiple bare `unwrap()` calls on JNI operations and channel sends in `handle_android_plugin_response` and `send_channel_data`. JNI exceptions or malformed JSON cause panics inside FFI callbacks on Android, which is undefined behaviour.","fix":"Use explicit error handling (e.g. `map_err`, logging, and returning early) instead of `unwrap()` inside JNI callbacks.","locations":[{"ref":"crates/tauri/src/plugin/mobile.rs:86","code":"   86 |       serde_json::from_str(env.get_string(&success).unwrap().to_str().unwrap()).unwrap(),","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/plugin/mobile.rs#L86"},{"ref":"crates/tauri/src/plugin/mobile.rs:91","code":"   91 |       serde_json::from_str(env.get_string(&error).unwrap().to_str().unwrap()).unwrap(),","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/plugin/mobile.rs#L91"},{"ref":"crates/tauri/src/plugin/mobile.rs:119","code":"  119 |     serde_json::from_str(env.get_string(&data_str).unwrap().to_str().unwrap()).unwrap();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/plugin/mobile.rs#L119"}]},
{"id":"PANIC_29","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"In the file-associations example, `handle_file_associations` calls `.unwrap()` on `WebviewWindowBuilder::build()`. On macOS/iOS/Android, the `Opened` event fires whenever the OS sends files to an already-running app instance. If the main window already exists from a prior call, building it again will fail and the app will panic.","fix":"Check whether the window already exists with `app.get_webview_window(\"main\")` and update its initialization script or skip creation if it is already open instead of always calling `build().unwrap()`.","locations":[{"ref":"examples/file-associations/src-tauri/src/main.rs:44-47","code":"   44 |   tauri::WebviewWindowBuilder::new(&app, \"main\", Default::default())\n   45 |     .initialization_script(format!(\"window.openedFiles = [{files}]\"))\n   46 |     .build()\n   47 |     .unwrap();","lines":4,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/examples/file-associations/src-tauri/src/main.rs#L44-L47"}]},
{"id":"PANIC_30","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"In validate_capabilities(), std::env::var(\"TARGET\").unwrap() panics if TARGET is not set. This function is called from acl::build() which is already inside a Result-returning context, so the unwrap is unnecessary.","fix":"Replace with std::env::var(\"TARGET\").context(\"missing TARGET env var\")?.","locations":[{"ref":"crates/tauri-build/src/acl.rs:341","code":"  341 |   let target = tauri_utils::platform::Target::from_triple(&std::env::var(\"TARGET\").unwrap());","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-build/src/acl.rs#L341"}]},
{"id":"PANIC_31","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"In copy_binaries(), fs::remove_file(&dest).unwrap() is called without error handling. If the file exists but cannot be removed (e.g. due to permissions), this panics instead of propagating a proper error.","fix":"Replace with fs::remove_file(&dest)?.","locations":[{"ref":"crates/tauri-build/src/lib.rs:82","code":"   82 |       fs::remove_file(&dest).unwrap();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-build/src/lib.rs#L82"}]},
{"id":"PANIC_32","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"In mobile.rs, the match arm `_ => unimplemented!()` inside generate_file_association_intent_filters() will panic at runtime if a new AndroidIntentAction variant is added without updating this match. The enum currently has exactly 3 variants, so the wildcard arm is unreachable today but becomes a hidden time bomb.","fix":"Remove the wildcard arm and handle all variants explicitly. If the enum gains variants in the future, the compiler will enforce the match to be updated.","locations":[{"ref":"crates/tauri-build/src/mobile.rs:55","code":"   55 |               _ => unimplemented!(),","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-build/src/mobile.rs#L55"}]},
{"id":"PANIC_33","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"In bundle_project() for AppImage (linuxdeploy.rs), .expect(\"couldn't find a square icon to use as AppImage icon\") panics if no square icon exists among the provided icons. This is user-configuration-dependent and should return an error.","fix":"Return Err(crate::Error::GenericError(\"No square icon found...\".into())) instead of panicking.","locations":[{"ref":"crates/tauri-bundler/src/bundle/linux/appimage/linuxdeploy.rs:101","code":"  101 |     .expect(\"couldn't find a square icon to use as AppImage icon\");","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-bundler/src/bundle/linux/appimage/linuxdeploy.rs#L101"}]},
{"id":"PANIC_34","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"In bundle_project() for DMG (dmg/mod.rs line 99), Command::new(\"chmod\").output().expect(\"Failed to chmod script\") panics if the chmod command fails. The entire DMG bundling pipeline is aborted instead of returning a proper error.","fix":"Replace .expect(...) with proper error propagation: .output_ok().context(\"Failed to chmod bundle_dmg.sh\")?.","locations":[{"ref":"crates/tauri-bundler/src/bundle/macos/dmg/mod.rs:99","code":"   99 |     .expect(\"Failed to chmod script\");","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-bundler/src/bundle/macos/dmg/mod.rs#L99"}]},
{"id":"PANIC_35","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"In platform.rs, parse_rust_cfg() uses .expect(\"could not find `target_arch` when running `rustc --print cfg`.\") when rustc succeeded but the output had no target_arch line. This panics instead of falling through to the cfg!() fallback logic that already exists.","fix":"Return an error or use the None case to fall through to the compile-time cfg!() fallback instead of expect().","locations":[{"ref":"crates/tauri-bundler/src/bundle/platform.rs:46","code":"   46 |       .expect(\"could not find `target_arch` when running `rustc --print cfg`.\"),","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-bundler/src/bundle/platform.rs#L46"}]},
{"id":"PANIC_36","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"resource_files() panics with `cannot use both resources and resources_map` instead of returning an error. The function signature returns ResourcePaths, not a Result, so an error cannot be propagated; callers have no chance to handle this case.","fix":"Change the return type to crate::Result<ResourcePaths<'_>> and return Err(...) for the conflicting-options branch, or validate at SettingsBuilder::build() time and reject the configuration there.","locations":[{"ref":"crates/tauri-bundler/src/bundle/settings.rs:1183","code":" 1183 |       (Some(_), Some(_)) => panic!(\"cannot use both `resources` and `resources_map`\"),","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-bundler/src/bundle/settings.rs#L1183"}]},
{"id":"PANIC_37","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"create_zip and create_tar_from_src (linux) call .expect(\"No data in parent\") / .expect(\"Can't extract file name from path\") on paths that are user-supplied. If an empty path or a root-only path is given, these panic rather than returning a proper error.","fix":"Use .ok_or_else(|| crate::Error::GenericError(...))? in place of .expect(...).","locations":[{"ref":"crates/tauri-bundler/src/bundle/updater_bundle.rs:205","code":"  205 |   let parent_dir = dst_file.parent().expect(\"No data in parent\");","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-bundler/src/bundle/updater_bundle.rs#L205"},{"ref":"crates/tauri-bundler/src/bundle/updater_bundle.rs:211","code":"  211 |     .expect(\"Can't extract file name from path\");","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-bundler/src/bundle/updater_bundle.rs#L211"},{"ref":"crates/tauri-bundler/src/bundle/updater_bundle.rs:259","code":"  259 |   let file_type = fs::metadata(src_dir).expect(\"Can't read source directory\");","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-bundler/src/bundle/updater_bundle.rs#L259"},{"ref":"crates/tauri-bundler/src/bundle/updater_bundle.rs:264","code":"  264 |       .file_name()","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-bundler/src/bundle/updater_bundle.rs#L264"}]},
{"id":"PANIC_38","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"dirs::cache_dir().unwrap() panics if the platform has no cache directory (rare but possible on minimal Linux environments without HOME set). This is used as the fallback tools directory in both MSI and NSIS bundle_project entry points.","fix":"Replace `.unwrap()` with `.ok_or_else(|| crate::Error::GenericError(\"cannot determine cache directory\".into()))?` and propagate the error.","locations":[{"ref":"crates/tauri-bundler/src/bundle/windows/msi/mod.rs:59-62","code":"   59 |   let tauri_tools_path = settings\n   60 |     .local_tools_directory()\n   61 |     .map(|d| d.join(\".tauri\"))\n   62 |     .unwrap_or_else(|| dirs::cache_dir().unwrap().join(\"tauri\"));","lines":4,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-bundler/src/bundle/windows/msi/mod.rs#L59-L62"},{"ref":"crates/tauri-bundler/src/bundle/windows/nsis/mod.rs:82-85","code":"   82 |   let tauri_tools_path = settings\n   83 |     .local_tools_directory()\n   84 |     .map(|d| d.join(\".tauri\"))\n   85 |     .unwrap_or_else(|| dirs::cache_dir().unwrap().join(\"tauri\"));","lines":4,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-bundler/src/bundle/windows/nsis/mod.rs#L82-L85"}]},

3"},{"ref":"crates/tauri-bundler/src/bundle/windows/msi/mod.rs:876","code":"  876 |       let mut fileout = File::create(&locale_path).expect(\"Failed to create locale file\");","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-bundler/src/bundle/windows/msi/mod.rs#L876"},{"ref":"crates/tauri-bundler/src/bundle/windows/msi/mod.rs:896","code":"  896 |     fs::create_dir_all(msi_path.parent().unwrap())?;","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-bundler/src/bundle/windows/msi/mod.rs#L896"}]},
{"id":"PANIC_40","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"generate_binaries_data in msi/mod.rs calls .expect(\"failed to extract external binary filename\") and .expect(\"failed to read external binary path\") / .expect(\"failed to read binary path\"). The OsString::into_string() failure means the path contains non-UTF-8 bytes, which is a realistic scenario on Linux.","fix":"Use .ok_or_else(|| crate::Error::GenericError(...))? for file_name() and OsString::into_string().map_err(|_| ...)? for the UTF-8 conversion.","locations":[{"ref":"crates/tauri-bundler/src/bundle/windows/msi/mod.rs:928-929","code":"  928 |       .file_name()\n  929 |       .expect(\"failed to extract external binary filename\")","lines":2,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-bundler/src/bundle/windows/msi/mod.rs#L928-L929"},{"ref":"crates/tauri-bundler/src/bundle/windows/msi/mod.rs:938-940","code":"  938 |         .into_os_string()\n  939 |         .into_string()\n  940 |         .expect(\"failed to read external binary path\"),","lines":3,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-bundler/src/bundle/windows/msi/mod.rs#L938-L940"}]},
{"id":"PANIC_41","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"strip_prefix(out_dir).unwrap() in generate_resource_data in msi/mod.rs. The glob result is already anchored under out_dir so this should never fail, but any deviation would panic.","fix":"Use ? instead of .unwrap() since the outer function returns Result.","locations":[{"ref":"crates/tauri-bundler/src/bundle/windows/msi/mod.rs:1076-1077","code":" 1076 |       .strip_prefix(out_dir)\n 1077 |       .unwrap()","lines":2,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-bundler/src/bundle/windows/msi/mod.rs#L1076-L1077"}]},
{"id":"PANIC_42","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"nsis/mod.rs contains several .expect() and .unwrap() calls in non-trivial paths: template registration, nsis_installer_path.parent().unwrap(), and handlebars helper h.param(0/1).unwrap().","fix":"Propagate template registration errors through `?`. Replace parent().unwrap() with .ok_or_else(). The handlebars helpers should return RenderError::from or ParamNotFoundForIndex instead of panicking.","locations":[{"ref":"crates/tauri-bundler/src/bundle/windows/nsis/mod.rs:631-632","code":"  631 |       .map_err(|e| e.to_string())\n  632 |       .expect(\"Failed to setup custom handlebar template\");","lines":2,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-bundler/src/bundle/windows/nsis/mod.rs#L631-L632"},{"ref":"crates/tauri-bundler/src/bundle/windows/nsis/mod.rs:636-637","code":"  636 |       .map_err(|e| e.to_string())\n  637 |       .expect(\"Failed to setup handlebar template\");","lines":2,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-bundler/src/bundle/windows/nsis/mod.rs#L636-L637"},{"ref":"crates/tauri-bundler/src/bundle/windows/nsis/mod.rs:669","code":"  669 |   fs::create_dir_all(nsis_installer_path.parent().unwrap())?;","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-bundler/src/bundle/windows/nsis/mod.rs#L669"},{"ref":"crates/tauri-bundler/src/bundle/windows/nsis/mod.rs:733-734","code":"  733 |   let param1 = h.param(0).unwrap().render();\n  734 |   let param2 = h.param(1).unwrap();","lines":2,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-bundler/src/bundle/windows/nsis/mod.rs#L733-L734"},{"ref":"crates/tauri-bundler/src/bundle/windows/nsis/mod.rs:751-752","code":"  751 |   let description = h.param(0).unwrap().render();\n  752 |   let ext = h.param(1).unwrap();","lines":2,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-bundler/src/bundle/windows/nsis/mod.rs#L751-L752"}]},
{"id":"PANIC_43","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"generate_binaries_data in nsis/mod.rs calls .expect(\"failed to extract external binary filename\") and .expect(\"failed to extract external binary filename\") on bin_path.file_name(), which panics if the binary path ends in a root or empty component.","fix":"Use .ok_or_else(|| crate::Error::GenericError(...))? to propagate these as errors.","locations":[{"ref":"crates/tauri-bundler/src/bundle/windows/nsis/mod.rs:865-866","code":"  865 |       .file_name()\n  866 |       .expect(\"failed to extract external binary filename\")","lines":2,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-bundler/src/bundle/windows/nsis/mod.rs#L865-L866"},{"ref":"crates/tauri-bundler/src/bundle/windows/nsis/mod.rs:876-877","code":"  876 |         bin_path.clone(),\n  877 |         bin_path","lines":2,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-bundler/src/bundle/windows/nsis/mod.rs#L876-L877"}]},
{"id":"PANIC_44","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"copy_file in fs_utils.rs calls to.parent().expect(\"No data in parent\") unconditionally, panicking when the destination path has no parent (e.g. a bare filename).","fix":"Use .ok_or_else(|| crate::Error::GenericError(format!(\"{to:?} has no parent directory\")))? and propagate through Result.","locations":[{"ref":"crates/tauri-bundler/src/utils/fs_utils.rs:92","code":"   92 |   let dest_dir = to.parent().expect(\"No data in parent\");","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-bundler/src/utils/fs_utils.rs#L92"}]},
{"id":"PANIC_45","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"child.wait().expect(\"failed to wait on \\\"beforeDevCommand\\\"\") is called inside a spawned thread. A panic in a spawned thread is not caught by the main thread and will silently terminate that thread (in stable Rust), or abort the process in some configurations.","fix":"Use .unwrap_or_else(|e| { log::error!(\"...\"); exit(1); }) or send the error over a channel to be handled on the main thread.","locations":[{"ref":"crates/tauri-cli/src/dev.rs:212-213","code":"  212 |             .wait()\n  213 |             .expect(\"failed to wait on \\\"beforeDevCommand\\\"\");","lines":2,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/dev.rs#L212-L213"}]},
{"id":"PANIC_46","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"url.host().expect(\"No host name in the URL\") and url.port_or_known_default().expect(\"No port number in the URL\") will panic on devUrl values like `tauri://localhost` (no port) or custom-scheme URLs. The expect messages do not include the actual URL, making diagnosis hard.","fix":"Use .ok_or_else(|| ...) to return a proper error that includes the URL string.","locations":[{"ref":"crates/tauri-cli/src/dev.rs:268-271","code":"  268 |       let host = url.host().expect(\"No host name in the URL\");\n  269 |       let port = url\n  270 |         .port_or_known_default()\n  271 |         .expect(\"No port number in the URL\");","lines":4,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/dev.rs#L268-L271"}]},
{"id":"PANIC_47","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"(domain, port).to_socket_addrs().unwrap() panics if DNS resolution of the dev URL domain fails. This happens at startup in the waiting-for-dev-server loop with no user-friendly message.","fix":"Replace .unwrap() with .context(\"failed to resolve dev URL host\")? and propagate the error up to command_internal.","locations":[{"ref":"crates/tauri-cli/src/dev.rs:277","code":"  277 |           addrs = (domain, port).to_socket_addrs().unwrap();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/dev.rs#L277"}]},
{"id":"PANIC_48","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"resolve_dirs() panics (via panic!()) when no Tauri project directory can be found. While intentional for a CLI context, a panic produces a Rust backtrace instead of a clean error message on stable builds without RUST_BACKTRACE.","fix":"Return Result<Dirs, Error> from resolve_dirs() and propagate it through callers so the CLI can print a clean message and exit with a non-zero code.","locations":[{"ref":"crates/tauri-cli/src/helpers/app_paths.rs:131-139","code":"  131 |   let tauri = TAURI_DIR.get_or_init(|| resolve_tauri_dir().unwrap_or_else(|| {\n  132 |     let env_var_name = env_tauri_app_path().is_some().then(|| format!(\"`{ENV_TAURI_APP_PATH}`\"));\n  133 |     panic!(\"Couldn't recognize the {} folder as a Tauri project. It must contain a `{}`, `{}` or `{}` file in any subfolder.\",\n  134 |       env_var_name.as_deref().unwrap_or(\"current\"),\n  135 |       ConfigFormat::Json.into_file_name(),\n  136 |       ConfigFormat::Json5.into_file_name(),\n  137 |       ConfigFormat::Toml.into_file_name()\n  138 |     )\n  139 |   }));","lines":9,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/helpers/app_paths.rs#L131-L139"}]},
{"id":"PANIC_49","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"npm_latest_version for PackageManager::Yarn calls unwrap() on info.data.last() without checking for an empty response. If yarn returns an empty data array, this panics instead of returning Ok(None).","fix":"Replace `.last().unwrap()` with `.last().map(|s| s.to_string())` and change the Ok(Some(...)) to Ok(info.data.last().map(|s| s.to_string())).","locations":[{"ref":"crates/tauri-cli/src/info/packages_nodejs.rs:40","code":"   40 |         Ok(Some(info.data.last().unwrap().to_string()))","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/info/packages_nodejs.rs#L40"}]},
{"id":"PANIC_50","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"nodejs_section_item calls semver::Version::parse(...).unwrap() twice (for both current and latest version). This will panic if crates.io or the package manager returns a non-semver version string such as a pre-release tag like '2.0.0-beta.1' that fails strict semver parsing.","fix":"Use .ok() on both parse calls and skip the comparison if either returns None, the same defensive pattern used in rust_section_item in packages_rust.rs.","locations":[{"ref":"crates/tauri-cli/src/info/packages_nodejs.rs:180-181","code":"  180 |           let version = semver::Version::parse(version.as_str()).unwrap();\n  181 |           let target_version = semver::Version::parse(latest_ver.as_str()).unwrap();","lines":2,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/info/packages_nodejs.rs#L180-L181"}]},
{"id":"PANIC_51","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"The tauri_cli_rust_item closure also calls semver::Version::parse(...).unwrap() on both the current and latest version strings obtained from external processes.","fix":"Use .ok() on both parse calls and skip the outdated comparison if either fails to parse.","locations":[{"ref":"crates/tauri-cli/src/info/packages_rust.rs:41-42","code":"   41 |               let current_version = semver::Version::parse(version).unwrap();\n   42 |               let target_version = semver::Version::parse(latest_version.as_str()).unwrap();","lines":2,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/info/packages_rust.rs#L41-L42"}]},
{"id":"PANIC_52","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"rust_section_item calls semver::Version::parse(...).unwrap() on the target (latest) version string. If crates.io returns an unexpected version string, this will panic at display time.","fix":"Use .ok() and skip the outdated check if parsing fails, matching the defensive style already used for the current version on line 73.","locations":[{"ref":"crates/tauri-cli/src/info/packages_rust.rs:77","code":"   77 |       let target_version = semver::Version::parse(&target_version).unwrap();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/info/packages_rust.rs#L77"}]},
{"id":"PANIC_53","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"new_debouncer(...).unwrap() in Rust::new(): if the debouncer cannot be created (e.g. filesystem watcher not available), the CLI panics.","fix":"Propagate the error with .context(\"failed to create file watcher\")? instead of .unwrap().","locations":[{"ref":"crates/tauri-cli/src/interface/rust.rs:141-146","code":"  141 |       let mut watcher = new_debouncer(Duration::from_secs(1), None, move |r| {\n  142 |         if let Ok(_events) = r {\n  143 |           let _ = tx.send(());\n  144 |         }\n  145 |       })\n  146 |       .unwrap();","lines":6,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/interface/rust.rs#L141-L146"}]},
{"id":"PANIC_54","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"In Rust::dev(), tx.send(()).unwrap() inside the run_dev callback can panic if the receiver has already been dropped (e.g. due to an error on the receiver side).","fix":"Use let _ = tx.send(()); - send failure is harmless in this context.","locations":[{"ref":"crates/tauri-cli/src/interface/rust.rs:216","code":"  216 |         tx.send(()).unwrap();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/interface/rust.rs#L216"}]},
{"id":"PANIC_55","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"build_ignore_matcher calls path.parent().unwrap() on a .taurignore path and ignore_builder.build().unwrap() on the resulting gitignore. A .taurignore at the filesystem root (no parent) or a malformed ignore file will panic.","fix":"Use if let Some(parent) = path.parent() { ... } and log a warning on build() failure instead of unwrapping.","locations":[{"ref":"crates/tauri-cli/src/interface/rust.rs:363","code":"  363 |       let mut ignore_builder = GitignoreBuilder::new(path.parent().unwrap());","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/interface/rust.rs#L363"},{"ref":"crates/tauri-cli/src/interface/rust.rs:378","code":"  378 |       matchers.push(ignore_builder.build().unwrap());","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/interface/rust.rs#L378"}]},
{"id":"PANIC_56","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"lookup() calls entry.file_type().unwrap() on each directory entry. If stat fails for a file (e.g. a dangling symlink), this panics inside the walk.","fix":"Use entry.file_type().unwrap_or_else(|_| /* skip */ return) or match on the Result and skip entries that cannot be stat'd.","locations":[{"ref":"crates/tauri-cli/src/interface/rust.rs:405","code":"  405 |     f(entry.file_type().unwrap(), dir.join(entry.path()));","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/interface/rust.rs#L405"}]},
{"id":"PANIC_57","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"In run_dev_watcher, common_path::common_path_all(...).expect(\"watch_folders should not be empty\") can panic if the iterator produces no paths (e.g. get_watch_folders returns an empty Vec and workspace_dir chain is somehow empty).","fix":"Use .ok_or_else(|| crate::Error::GenericError(\"no watch folders found\".into()))? to propagate the error.","locations":[{"ref":"crates/tauri-cli/src/interface/rust.rs:525-531","code":"  525 |     let common_ancestor = common_path::common_path_all(\n  526 |       watch_folders\n  527 |         .iter()\n  528 |         .map(Path::new)\n  529 |         .chain(once(self.app_settings.workspace_dir.as_path())),\n  530 |     )\n  531 |     .expect(\"watch_folders should not be empty\");","lines":7,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/interface/rust.rs#L525-L531"}]},
{"id":"PANIC_58","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"In run_dev_watcher, new_debouncer(...).unwrap() panics if the OS-level debouncer cannot be created.","fix":"Propagate the error with context and ? instead of .unwrap().","locations":[{"ref":"crates/tauri-cli/src/interface/rust.rs:534-539","code":"  534 |     let mut watcher = new_debouncer(Duration::from_secs(1), None, move |r| {\n  535 |       if let Ok(events) = r {\n  536 |         tx.send(events).unwrap()\n  537 |       }\n  538 |     })\n  539 |     .unwrap();","lines":6,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/interface/rust.rs#L534-L539"}]},
{"id":"PANIC_59","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"In run_dev_watcher, tx.send(events).unwrap() is called inside a closure passed to the debouncer. If the receiving end (rx) has been dropped, this panics in a background thread and crashes the process.","fix":"Use let _ = tx.send(events); to silently ignore the send failure, which is harmless since the watcher loop will then exit naturally via the recv() returning Err.","locations":[{"ref":"crates/tauri-cli/src/interface/rust.rs:536","code":"  536 |         tx.send(events).unwrap()","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/interface/rust.rs#L536"}]},
{"id":"PANIC_60","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"Multiple .unwrap() calls on workspace-inherited fields (description, homepage, authors, license) in RustAppSettings::new and tauri_config_to_bundle_settings. If workspace inheritance is declared but the workspace Cargo.toml does not have the corresponding field, these panic.","fix":"Use .unwrap_or_default() or propagate the error with ? instead of .unwrap().","locations":[{"ref":"crates/tauri-cli/src/interface/rust.rs:1125","code":" 1125 |           .unwrap()","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/interface/rust.rs#L1125"},{"ref":"crates/tauri-cli/src/interface/rust.rs:1125","code":" 1125 |           .unwrap()","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/interface/rust.rs#L1125"},{"ref":"crates/tauri-cli/src/interface/rust.rs:1146","code":" 1146 |             .unwrap()","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/interface/rust.rs#L1146"},{"ref":"crates/tauri-cli/src/interface/rust.rs:1674","code":" 1674 |             .unwrap()","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/interface/rust.rs#L1674"}]},
{"id":"PANIC_61","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"tauri_config_to_bundle_settings calls path.file_name().unwrap() on the appindicator library path. If the path has no file component (e.g. it ends in '/'), this panics.","fix":"Use if let Some(name) = path.file_name() { ... } and emit an error if the name is missing.","locations":[{"ref":"crates/tauri-cli/src/interface/rust.rs:1419","code":" 1419 |         appimage_files.insert(Path::new(\"/usr/lib/\").join(path.file_name().unwrap()), path);","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/interface/rust.rs#L1419"}]},
{"id":"PANIC_62","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"tauri_config_to_bundle_settings calls .expect() on APPLE_SIGNING_IDENTITY and APPLE_PROVIDER_SHORT_NAME OsString->str conversions. Non-UTF-8 env var values (valid on Unix) will panic.","fix":"Use .to_string_lossy().into_owned() instead of .to_str().expect(...) to avoid a panic on non-UTF-8 values.","locations":[{"ref":"crates/tauri-cli/src/interface/rust.rs:1451","code":" 1451 |         .expect(\"failed to convert APPLE_SIGNING_IDENTITY to string\")","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/interface/rust.rs#L1451"},{"ref":"crates/tauri-cli/src/interface/rust.rs:1461","code":" 1461 |         .expect(\"failed to convert APPLE_PROVIDER_SHORT_NAME to string\")","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/interface/rust.rs#L1461"}]},
{"id":"PANIC_63","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"In desktop::run_dev, dev_child.take_stderr().unwrap() will panic if stderr was not piped (which should always be the case just above, but is an implicit assumption).","fix":"Use .ok_or_else(|| Error::GenericError(\"failed to take stderr from child process\".into()))? to handle it explicitly.","locations":[{"ref":"crates/tauri-cli/src/interface/rust/desktop.rs:100","code":"  100 |   let dev_child_stderr = dev_child.take_stderr().unwrap();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/interface/rust/desktop.rs#L100"}]},
{"id":"PANIC_64","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"In desktop::run_dev, the background thread calls dev_child_.wait().expect(\"failed to build app\"). A wait() failure (e.g. process already waited on from another thread) will panic in a background thread, killing the process.","fix":"Use if let Ok(status) = dev_child_.wait() { ... } and log an error in the Err branch instead of panicking.","locations":[{"ref":"crates/tauri-cli/src/interface/rust/desktop.rs:119","code":"  119 |     let status = dev_child_.wait().expect(\"failed to build app\");","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/interface/rust/desktop.rs#L119"}]},
{"id":"PANIC_65","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`AndroidConfig::from_raw(app.clone(), Some(raw)).unwrap()` in `get_config` panics on any configuration validation error returned by `from_raw`. This function is called on every `tauri android dev`, `tauri android build`, and `tauri android run` invocation, so any invalid Android configuration crashes the CLI without a helpful error message.","fix":"Return the error instead of unwrapping: `AndroidConfig::from_raw(app.clone(), Some(raw)).context(\"invalid Android configuration\")?`.","locations":[{"ref":"crates/tauri-cli/src/mobile/android/mod.rs:154","code":"  154 |   let config = AndroidConfig::from_raw(app.clone(), Some(raw)).unwrap();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/mobile/android/mod.rs#L154"}]},
{"id":"PANIC_66","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`dirs::home_dir().unwrap()` (macOS and Linux paths) and `dirs::data_local_dir().unwrap()` (Windows path) in `ensure_sdk` will panic when the OS cannot determine the home or local-data directory. This can happen in some sandboxed environments or when running as root on certain Linux setups.","fix":"Propagate the `None` case as an error: `dirs::home_dir().context(\"cannot determine home directory\")?`.","locations":[{"ref":"crates/tauri-cli/src/mobile/android/mod.rs:511-515","code":"  511 |     let default_android_home = dirs::home_dir().unwrap().join(\"Library/Android/sdk\");\n  512 |     #[cfg(target_os = \"linux\")]\n  513 |     let default_android_home = dirs::home_dir().unwrap().join(\"Android/Sdk\");\n  514 |     #[cfg(windows)]\n  515 |     let default_android_home = dirs::data_local_dir().unwrap().join(\"Android/Sdk\");","lines":5,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/mobile/android/mod.rs#L511-L515"}]},
{"id":"PANIC_67","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`PathBuf::file_stem()` returns `None` for paths that have no filename component (e.g. bare `/`). The code calls `.unwrap()` on that `None` inside the closure without any guard, so a malformed `npm_execpath` env-var (e.g. a directory path ending in `/`) would panic at runtime.","fix":"Replace `.unwrap()` with `?` or an `ok_or_else` that returns a sensible fallback or error, matching the pattern already used for `bin_path.file_stem()` a few lines above.","locations":[{"ref":"crates/tauri-cli/src/mobile/init.rs:88-91","code":"   88 |             let manager_stem = PathBuf::from(&npm_execpath)\n   89 |               .file_stem()\n   90 |               .unwrap()\n   91 |               .to_os_string();","lines":4,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/mobile/init.rs#L88-L91"}]},
{"id":"PANIC_68","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`app_path.file_name().unwrap()` in the simulator branch will panic if `app_path` has no final filename component, for the same reason as the IPA path case above.","fix":"Replace `.unwrap()` with a proper `?`-propagated error, e.g. `.ok_or_else(|| Error::GenericError(...))?`.","locations":[{"ref":"crates/tauri-cli/src/mobile/ios/build.rs:491","code":"  491 |         let path = out_dir.join(app_path.file_name().unwrap());","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/mobile/ios/build.rs#L491"}]},
{"id":"PANIC_69","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`ipa_path.file_name().unwrap()` will panic if the IPA path has no file-name component (e.g. it ends with a directory separator). There is no prior validation that the path returned by `config.ipa_path()` actually ends in a filename.","fix":"Replace `.unwrap()` with `.ok_or_else(|| Error::GenericError(format!(\"IPA path has no file name: {}\", ipa_path.display())))?`.","locations":[{"ref":"crates/tauri-cli/src/mobile/ios/build.rs:569","code":"  569 |           let path = out_dir.join(ipa_path.file_name().unwrap());","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/mobile/ios/build.rs#L569"}]},
{"id":"PANIC_70","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"Inside `create_ipa`, `app_path.parent().unwrap()` will panic if `app_path` is a root path with no parent (e.g. `/`). The `.app` bundle path is constructed by the caller from `config`, so this is unlikely in practice, but there is no defensive check.","fix":"Replace `.unwrap()` with `.ok_or_else(|| Error::GenericError(\"app_path has no parent directory\".into()))?` and propagate with `?`.","locations":[{"ref":"crates/tauri-cli/src/mobile/ios/build.rs:617","code":"  617 |     let name = file_path.strip_prefix(app_path.parent().unwrap()).unwrap();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/mobile/ios/build.rs#L617"}]},
{"id":"PANIC_71","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`file_path.strip_prefix(...).unwrap()` on the same line will panic if `file_path` is not actually under `app_path.parent()`. Because `app_files` is populated by recursively traversing `app_path`, every entry should be a descendant - but if a symlink points outside the tree, `strip_prefix` can return `Err` and this panics.","fix":"Replace `.unwrap()` with `?` (after mapping the `StripPrefixError` to `Error`) so a stray symlink produces a clean error instead of a panic.","locations":[{"ref":"crates/tauri-cli/src/mobile/ios/build.rs:617","code":"  617 |     let name = file_path.strip_prefix(app_path.parent().unwrap()).unwrap();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/mobile/ios/build.rs#L617"}]},
{"id":"PANIC_72","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"ACL and capabilities JSON files are read with `.expect()` which panics the build process with no structured error. These are distinct failure modes (I/O error vs parse error) but both produce opaque panics.","fix":"Propagate through `EmbeddedAssetsResult` using `map_err` and `?` so the build gives a proper error.","locations":[{"ref":"crates/tauri-codegen/src/context.rs:395-397","code":"  395 |     let acl_file =\n  396 |       std::fs::read_to_string(acl_file_path).expect(\"failed to read plugin manifest map\");\n  397 |     serde_json::from_str(&acl_file).expect(\"failed to parse plugin manifest map\")","lines":3,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-codegen/src/context.rs#L395-L397"},{"ref":"crates/tauri-codegen/src/context.rs:404-406","code":"  404 |     let capabilities_json =\n  405 |       std::fs::read_to_string(&capabilities_file_path).expect(\"failed to read capabilities\");\n  406 |     serde_json::from_str(&capabilities_json).expect(\"failed to parse capabilities\")","lines":3,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-codegen/src/context.rs#L404-L406"}]},
{"id":"PANIC_73","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In `context_codegen`, if `get_capabilities` returns an error the code calls `.unwrap()` directly with no descriptive message, giving users a cryptic panic instead of a build error.","fix":"Use `.expect(\"failed to resolve capabilities\")` or, better, propagate via `?` after mapping the error into `EmbeddedAssetsError`.","locations":[{"ref":"crates/tauri-codegen/src/context.rs:410-415","code":"  410 |   let capabilities = get_capabilities(\n  411 |     &config,\n  412 |     capabilities_from_files,\n  413 |     additional_capabilities.as_deref(),\n  414 |   )\n  415 |   .unwrap();","lines":6,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-codegen/src/context.rs#L410-L415"}]},
{"id":"PANIC_74","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"ICO icon handling unconditionally indexes entries()[0] without checking if the icon directory is empty. An empty .ico file will panic at runtime during codegen.","fix":"Replace `&icon_dir.entries()[0]` with `icon_dir.entries().first().ok_or_else(|| EmbeddedAssetsError::...)` and propagate the error.","locations":[{"ref":"crates/tauri-codegen/src/image.rs:57","code":"   57 |     let entry = &icon_dir.entries()[0];","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-codegen/src/image.rs#L57"}]},
{"id":"PANIC_75","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"tao_activation_policy() has a wildcard arm `_ => unimplemented!()`. The ActivationPolicy enum is non-exhaustive; if tauri_runtime adds a new variant, calling set_activation_policy with it will panic at runtime with an unhelpful message. Same pattern exists for the macOS title-bar-style handlers.","fix":"Replace `_ => unimplemented!()` with a compile-time exhaustive match or a `log::warn!` / graceful no-op.","locations":[{"ref":"crates/tauri-runtime-wry/src/lib.rs:598","code":"  598 |     _ => unimplemented!(),","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-runtime-wry/src/lib.rs#L598"}]},
