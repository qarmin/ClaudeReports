{"id":"DEAD_11","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"In `plugin/src/models.rs` (plugin template), `PingResponse` derives `Clone` and `Default` but neither trait is used anywhere in the template code. This adds noise to the generated plugin skeleton.","fix":"Remove `Clone` and `Default` derives from the template unless a known use case requires them, to keep generated code minimal.","locations":[{"ref":"crates/tauri-cli/templates/plugin/src/models.rs:12-16","code":"   12 | #[derive(Debug, Clone, Default, Deserialize, Serialize)]\n   13 | #[serde(rename_all = \"camelCase\")]\n   14 | pub struct PingResponse {\n   15 |   pub value: Option<String>,\n   16 | }","lines":5,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/templates/plugin/src/models.rs#L12-L16"}]},
{"id":"DEAD_12","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"`Level::Warning` and `Level::Info` variants in `tauri-runtime-wry/src/dialog/windows.rs` are defined with `#[allow(unused)]` attributes, indicating they are never used outside tests. The entire `Level` enum is private and only `Level::Error` is exercised by a public function.","fix":"Remove unused variants, or expose a `warning` and `info` public function if these are intended for future use.","locations":[{"ref":"crates/tauri-runtime-wry/src/dialog/windows.rs:7-13","code":"    7 | enum Level {\n    8 |   Error,\n    9 |   #[allow(unused)]\n   10 |   Warning,\n   11 |   #[allow(unused)]\n   12 |   Info,\n   13 | }","lines":7,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-runtime-wry/src/dialog/windows.rs#L7-L13"}]},
{"id":"DEAD_13","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"The `_code` parameter in Message::RequestExit is ignored in the direct-path guard (`Message::RequestExit(_code) => panic!(...)` at line 3342). The exit code is only consumed by the handle_event_loop path. If RequestExit is ever sent on the main thread it panics and the code is lost.","fix":"Include the code in the panic message for debuggability: `panic!(\"cannot handle RequestExit({_code}) on the main thread\")`.","locations":[{"ref":"crates/tauri-runtime-wry/src/lib.rs:3190","code":" 3190 |     Message::RequestExit(_code) => panic!(\"cannot handle RequestExit on the main thread\"),","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-runtime-wry/src/lib.rs#L3190"}]},

{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"The comment on WindowsSettings.allow_downgrades has a triple-slash doc comment `/// The default value of this flag is `true`.` that is preceded by another `///` blank line creating an inadvertent double doc-comment line inside the same field doc.","fix":"Remove the extra blank `///` line so the default-value sentence flows naturally from the preceding description.","locations":[{"ref":"crates/tauri-bundler/src/bundle/settings.rs:588-591","code":"  588 |   /// For instance, if `1.2.1` is installed, the user won't be able to install app version `1.2.0` or `1.1.5`.\n  589 |   ///\n  590 |   /// /// The default value of this flag is `true`.\n  591 |   pub allow_downgrades: bool,","lines":4,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-bundler/src/bundle/settings.rs#L588-L591"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"In bundle.rs, the comment on line 299 says \"we expect to have only one path in the vec but we iter if we add another type of updater package who require multiple file signature\". 'who' should be 'that', and 'file signature' should be 'file signatures'. Minor grammar issue in a code comment.","fix":"Rewrite as: \"we expect only one path per bundle, but iterate to handle future bundle types that require multiple signed files\".","locations":[{"ref":"crates/tauri-cli/src/bundle.rs:310-311","code":"  310 |     // we expect to have only one path in the vec but we iter if we add\n  311 |     // another type of updater package who require multiple file signature","lines":2,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/bundle.rs#L310-L311"}]},
{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"helpers/updater_signature.rs: the doc comment on pub_key() says \"Gets the updater secret key\" but the function returns a PublicKey, not a secret key. Copy-paste error from the secret_key() function above it.","fix":"Change the doc comment to: \"Gets the updater public key from the given base64-encoded public key string.\"","locations":[{"ref":"crates/tauri-cli/src/helpers/updater_signature.rs:176","code":"  176 | /// Gets the updater secret key from the given private key and password.","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/helpers/updater_signature.rs#L176"}]},
{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"The comment `// remove Windows-only extension` on line 125 of init.rs is misleading: `.cmd` and `.bat` are Windows-only, but `.exe` is also Windows-only. The pop-4 approach blindly removes the last 4 bytes without verifying which extension matched; a 3-character extension like `.cmd` would also have 4 bytes removed (`.cmd` = 4 chars including the dot), but the comment does not explain why a fixed 4-pop is correct for all three cases.","fix":"Use `Path::with_extension(\"\")` (via `PathBuf`) to strip the extension properly and remove the manual pop loop, which is fragile and hard to read.","locations":[{"ref":"crates/tauri-cli/src/mobile/init.rs:124-130","code":"  124 |   if binary.ends_with(\".exe\") || binary.ends_with(\".cmd\") || binary.ends_with(\".bat\") {\n  125 |     // remove Windows-only extension\n  126 |     binary.pop();\n  127 |     binary.pop();\n  128 |     binary.pop();\n  129 |     binary.pop();\n  130 |   }","lines":7,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/mobile/init.rs#L124-L130"}]},

{"id":"CMT_18","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"Comment in `error.rs` says `// safety: the setup error is only used on the main thread / and we exit the process immediately.` but the `unsafe impl Send` and `unsafe impl Sync` for `SetupError` are present regardless of whether the exit is immediate. The safety justification is incomplete: `SetupError` wraps a `Box<dyn Error>` which is not required to be `Send` or `Sync`.","fix":"Either add `+ Send + Sync` bounds to the inner error type, or document more precisely why the lack of thread safety is acceptable (e.g. `SetupError` values are never actually sent across threads).","locations":[{"ref":"crates/tauri/src/error.rs:17-20","code":"   17 | // safety: the setup error is only used on the main thread\n   18 | // and we exit the process immediately.\n   19 | unsafe impl Send for SetupError {}\n   20 | unsafe impl Sync for SetupError {}","lines":4,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/error.rs#L17-L20"}]},

{"id":"DUP_8","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"The bodies of `Window::hide_menu`, `Window::show_menu`, and `Window::is_menu_visible` are structurally identical: clone the menu, dispatch to main thread, call the platform-specific API. Roughly 30 lines of near-identical platform dispatch logic is copy-pasted three times.","fix":"Extract a private helper such as `fn dispatch_menu_action<F: Fn(...) + Send + 'static>(&self, f: F)` and call it from all three methods with the appropriate action closure.","locations":[{"ref":"crates/tauri/src/window/mod.rs:1372-1397","code":" 1372 |   pub fn hide_menu(&self) -> crate::Result<()> {\n 1373 |     // remove from the window\n 1374 |     #[cfg(not(target_os = \"macos\"))]\n 1375 |     if let Some(window_menu) = &*self.menu_lock() {\n 1376 |       let window = self.clone();\n 1377 |       let menu_ = window_menu.menu.clone();\n 1378 |       self.run_on_main_thread(move || {\n 1379 |         #[cfg(windows)]\n 1380 |         if let Ok(hwnd) = window.hwnd() {\n 1381 |           let _ = unsafe { menu_.inner().hide_for_hwnd(hwnd.0 as _) };\n 1382 |         }\n 1383 |         #[cfg(any(\n 1384 |           target_os = \"linux\",\n 1385 |           target_os = \"dragonfly\",\n 1386 |           target_os = \"freebsd\",\n 1387 |           target_os = \"netbsd\",\n 1388 |           target_os = \"openbsd\"\n 1389 |         ))]\n 1390 |         if let Ok(gtk_window) = window.gtk_window() {\n 1391 |           let _ = menu_.inner().hide_for_gtk_window(&gtk_window);\n 1392 |         }\n 1393 |       })?;\n 1394 |     }\n 1395 | \n 1396 |     Ok(())\n 1397 |   }","lines":26,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/window/mod.rs#L1372-L1397"},{"ref":"crates/tauri/src/window/mod.rs:1404-1429","code":" 1404 |   pub fn show_menu(&self) -> crate::Result<()> {\n 1405 |     // remove from the window\n 1406 |     #[c {"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"medium","difficulty":"medium","description":"The BEFORE_DEV and KILL_BEFORE_DEV_FLAG statics in dev.rs are process-global OnceLock/AtomicBool. If command_internal() is ever called more than once in the same process (e.g. from mobile sub-commands that reuse the dev setup), BEFORE_DEV.get_or_init() will silently skip setting the new child process, leaving the old (already-dead) handle stored and the new child process untracked and unkillable on Ctrl-C.","fix":"Use a Mutex<Option<SharedChild>> instead of OnceLock so it can be reset between invocations, or document that setup() must only be called once per process.","locations":[{"ref":"crates/tauri-cli/src/dev.rs:34-35","code":"   34 | static BEFORE_DEV: OnceLock<SharedChild> = OnceLock::new();\n   35 | static KILL_BEFORE_DEV_FLAG: AtomicBool = AtomicBool::new(false);","lines":2,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/dev.rs#L34-L35"}]},
{"id":"ARCH_2","type":"architecture","type_label":"Architecture","severity":"medium","difficulty":"medium","description":"The channel-based dispatcher pattern (window_getter!, webview_getter!, getter!) blocks the calling thread until the main thread processes the message. When the calling thread IS the main thread, send_user_message() short-circuits and calls handle_user_message() directly (correct). However, any call from the main thread that uses the proxy path instead of send_user_message (e.g. on_window_event, on_webview_event at lines 1988 and 1610 which unconditionally use proxy.send_event) will deadlock if the event is processed synchronously and the response channel is never drained.","fix":"These are fire-and-forget event registrations (no channel), so there is no deadlock here - but the inconsistency between fire-and-forget (proxy directly) and request-response (send_user_message) should be documented clearly to prevent future callers from accidentally adding a blocking getter via direct proxy.","locations":[{"ref":"crates/tauri-runtime-wry/src/lib.rs:1536-1543","code":" 1536 |   fn on_webview_event<F: Fn(&WebviewEvent) + Send + 'static>(&self, f: F) -> WindowEventId {\n 1537 |     let id = self.context.next_webview_event_id();\n 1538 |     let _ = self.context.proxy.send_event(Message::Webview(\n 1539 |       *self.window_id.lock().unwrap(),\n 1540 |       self.webview_id,\n 1541 |       WebviewMessage::AddEventListener(id, Box::new(f)),\n 1542 |     ));\n 1543 |     id","lines":8,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-runtime-wry/src/lib.rs#L1536-L1543"},{"ref":"crates/tauri-runtime-wry/src/lib.rs:1845-1852","code":" 1845 |   fn on_window_event<F: Fn(&WindowEvent) + Send + 'static>(&self, f: F) -> WindowEventId {\n 1846 |     let id = self.context.next_window_event_id();\n 1847 |     let _ = self.context.proxy.send_event(Message::Window(\n 1848 |       self.window_id,\n 1849 |       WindowMessage::AddEventListener(id, Box::new(f)),\n 1850 |     ));\n 1851 |     id\n 1852 |   }","lines":8,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-runtime-wry/src/lib.rs#L1845-L1852"}]},
{"id":"ARCH_3","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"In helpers/config.rs, load_config() calls set_current_dir() and then resets it. This is a non-reentrant side effect: if two config loads happen concurrently (possible since mobile commands can call setup in threads), the current directory could be left pointing at the wrong location.","fix":"Use a per-thread or per-call directory context rather than mutating the global CWD, or use a Mutex to serialize config loading.","locations":[{"ref":"crates/tauri-cli/src/helpers/config.rs:208-212","code":"  208 |   let current_dir = current_dir().context(\"failed to resolve current directory\")?;\n  209 |   set_current_dir(config_path.parent().unwrap()).context(\"failed to set current directory\")?;\n  210 |   let config: Config = serde_json::from_value(config).context(\"failed to parse config\")?;\n  211 |   // revert to previous working directory\n  212 |   set_current_dir(current_dir).context(\"failed to set current directory\")?;","lines":5,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/helpers/config.rs#L208-L212"}]},
{"id":"ARCH_4","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"The SectionItem type mixes data (description, status) with the action closures in a single struct that is also responsible for its own display (Display impl). This tight coupling makes it impossible to run actions and display results separately without the Display impl's unwrap on ':' (see panic finding) affecting all items.","fix":"Separate the display concern from the action/status concern: either ensure descriptions always contain a colon or change the Display impl to not require one.","locations":[{"ref":"crates/tauri-cli/src/info/mod.rs:124-221","code":"  124 | pub struct SectionItem {\n  125 |   /// If description is none, the item is skipped\n  126 |   description: Option<String>,\n  127 |   status: Status,\n  128 |   action: Option<Box<dyn FnMut() -> ActionResult>>,\n  129 |   action_if_err: Option<Box<dyn FnMut() -> ActionResult>>,\n  130 | }\n  131 | \n  132 | impl Display for SectionItem {\n  133 |   fn fmt(&self, f: &mut Formatter<'_>) -> fmt::Result {\n  134 |     let desc = self\n  135 |       .description\n  136 |       .as_ref()\n  137 |       .map(|s| s.replace('\\n', \"\\n      \"))\n  138 |       .unwrap_or_default();\n  139 |     let (first, second) = desc.split_once(':').unwrap();\n  140 |     write!(f, \"{} {}:{}\", self.status, first.bold(), second)\n  141 |   }\n  142 | }\n  143 | \n  144 | impl SectionItem {\n  145 |   fn new() -> Self {\n  146 |     Self {\n  147 |       action: None,\n  148 |       action_if_err: None,\n  149 |       description: None,\n  150 |       status: Status::Neutral,\n  151 |     }\n  152 |   }\n  153 | \n  154 |   fn action<F: FnMut() -> ActionResult + 'static>(mut self, action: F) -> Self {\n  155 |     self.action = Some(Box::new(action));\n  156 |     self\n  157 |   }\n  158 | \n  159 |   // fn action_if_err<F: FnMut() -> ActionResult + 'static>(mut self, action: F) -> Self {\n  160 |   //   self.action_if_err = Some(Box::new(action));\n  161 |   //   self\n  162 |   // }\n  163 | \n  164 |   fn description<S: AsRef<str>>(mut self, description: S) -> Self {\n  165 |     self.description = Some(description.as_ref().to_string());\n  166 |     self\n  167 |   }\n  168 | \n  169 |   fn run_action(&mut self) {\n  170 |     let mut res = ActionResult::None;\n  171 |     if let Some(action) = &mut self.action {\n  172 |       res = action();\n  173 |     }\n  174 |     self.apply_action_result(res);\n  175 |   }\n  176 | \n  177 |   fn run_action_if_err(&mut self) {\n  178 |     let mut res = ActionResult::None;\n  179 |     if let Some(action) = &mut self.action_if_err {\n  180 |       res = action();\n  181 |     }\n  182 |     self.apply_action_result(res);\n  183 |   }\n  184 | \n  185 |   fn apply_action_result(&mut self, result: ActionResult) {\n  186 |     match result {\n  187 |       ActionResult::Full {\n  188 |         description,\n  189 |         status,\n  190 |       } => {\n  191 |         self.description = Some(description);\n  192 |         self.status = status;\n  193 |       }\n  194 |       ActionResult::Description(description) => {\n  195 |         self.description = Some(description);\n  196 |       }\n  197 |       ActionResult::None => {}\n  198 |     }\n  199 |   }\n  200 | \n  201 |   fn run(&mut self, interactive: bool) -> Status {\n  202 |     self.run_action();\n  203 | \n  204 |     if self.status == Status::Error && interactive && self.action_if_err.is_some() {\n  205 |       if let Some(description) = &self.description {\n  206 |         let confirmed = Confirm::with_theme(&ColorfulTheme::default())\n  207 |           .with_prompt(format!(\n  208 |             \"{}\\n  Run the automatic fix?\",\n  209 |             description.replace('\\n', \"\\n  \")\n  210 |           ))\n  211 |           .interact()\n  212 |           .unwrap_or(false);\n  213 |         if confirmed {\n  214 |           self.run_action_if_err()\n  215 |         }\n  216 |       }\n  217 |     }\n  218 | \n  219 |     self.status\n  220 |   }\n  221 | }","lines":98,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/info/mod.rs#L124-L221"}]},
{"id":"ARCH_5","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"The `exec` function in init.rs takes `non_interactive` and `reinstall_deps` parameters marked `#[allow(unused_variables)]` for the non-macOS compilation (Android branch). They are only used inside the `#[cfg(target_os = \"macos\")]` iOS branch. Passing them unconditionally through the call stack is a leaky abstraction; Android init silently ignores both flags.","fix":"Move these parameters into a platform-specific options struct or gate them with `#[cfg(target_os = \"macos\")]` at the call site so callers are not forced to supply values that are irrelevant on their target platform.","locations":[{"ref":"crates/tauri-cli/src/mobile/init.rs:48-56","code":"   48 | fn exec(\n   49 |   target: Target,\n   50 |   wrapper: &TextWrapper,\n   51 |   #[allow(unused_variables)] non_interactive: bool,\n   52 |   #[allow(unused_variables)] reinstall_deps: bool,\n   53 |   skip_targets_install: bool,\n   54 |   config: Vec<ConfigValue>,\n   55 |   dirs: Dirs,\n   56 | ) -> Result<App> {","lines":9,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/mobile/init.rs#L48-L56"},{"ref":"crates/tauri-cli/src/mobile/init.rs:139-158","code":"  139 |       let _env = super::android::env(non_interactive)?;\n  140 |       let (config, metadata) =\n  141 |         super::android::get_config(&app, &tauri_config, &[], &Default::default());\n  142 |       map.insert(\"android\", &config);\n  143 | \n  144 |       // Add application_id_suffix to the map for template access\n  145 |       // The template will access it via a helper or we'll modify template to use root context\n  146 |       if let Some(suffix) = &tauri_config.bundle.android.debug_application_id_suffix {\n  147 |         map.insert(\"android-debug-application-id-suffix\", suffix);\n  148 |       }\n  149 | \n  150 |       super::android::project::gen(\n  151 |         &config,\n  152 |         &metadata,\n  153 |         (handlebars, map),\n  154 |         wrapper,\n  155 |         skip_targets_install,\n  156 |       )?;\n  157 |       app\n  158 |     }","lines":20,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/mobile/init.rs#L139-L158"},{"ref":"crates/tauri-cli/src/mobile/init.rs:159-176","code":"  159 |     #[cfg(target_os = \"macos\")]\n  160 |     // Generate Xcode project\n  161 |     Target::Ios => {\n  162 |       let (config, metadata) =\n  163 |         super::ios::get_config(&app, &tauri_config, &[], &Default::default(), dirs.tauri)?;\n  164 |       map.insert(\"apple\", &config);\n  165 |       super::ios::project::gen(\n  166 |         &tauri_config,\n  167 |         &config,\n  168 |         &metadata,\n  169 |         (handlebars, map),\n  170 |         wrapper,\n  171 |         non_interactive,\n  172 |         reinstall_deps,\n  173 |         skip_targets_install,\n  174 |       )?;\n  175 |       app\n  176 |     }","lines":18,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/mobile/init.rs#L159-L176"}]},
{"id":"ARCH_6","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"The `tauri-driver` server loop runs in a `current_thread` Tokio executor but each accepted connection is spawned as a separate task. Signal handling on Unix is also a separate spawned task. If signal handling or bind failure is silent (as noted above), there is no mechanism to shut down the server cleanly, and the native WebDriver child process is leaked.","fix":"Use a CancellationToken or a oneshot channel to signal the accept loop to exit on signal, and ensure the child process is killed in all exit paths.","locations":[{"ref":"crates/tauri-driver/src/server.rs:169-244","code":"  169 | #[tokio::main(flavor = \"current_thread\")]\n  170 | pub async fn run(args: Args, mut _driver: Child) -> Result<(), Error> {\n  171 |   #[cfg(unix)]\n  172 |   let (signals_handle, signals_task) = {\n  173 |     use futures_util::StreamExt;\n  174 |     use signal_hook::consts::signal::*;\n  175 | \n  176 |     let signals = signal_hook_tokio::Signals::new([SIGTERM, SIGINT, SIGQUIT])?;\n  177 |     let signals_handle = signals.handle();\n  178 |     let signals_task = tokio::spawn(async move {\n  179 |       let mut signals = signals.fuse();\n  180 |       #[allow(clippy::never_loop)]\n  181 |       while let Some(signal) = signals.next().await {\n  182 |         match signal {\n  183 |           SIGTERM | SIGINT | SIGQUIT => {\n  184 |             _driver\n  185 |               .kill()\n  186 |               .expect(\"unable to kill native webdriver server\");\n  187 |             std::process::exit(0);\n  188 |           }\n  189 |           _ => unreachable!(),\n  190 |         }\n  191 |       }\n  192 |     });\n  193 |     (signals_handle, signals_task)\n  194 |   };\n  195 | \n  196 |   let address = std::net::SocketAddr::from(([127, 0, 0, 1], args.port));\n  197 | \n  198 |   // the client we use to proxy requests to the native webdriver\n  199 |   let client = Client::builder(TokioExecutor::new())\n  200 |     .http1_preserve_header_case(true)\n  201 |     .http1_title_case_headers(true)\n  202 |     .retry_canceled_requests(false)\n  203 |     .build_http();\n  204 | \n  205 |   // set up a http1 server that uses the service we just created\n  206 |   let srv = async move {\n  207 |     if let Ok(listener) = TcpListener::bind(address).await {\n  208 |       loop {\n  209 |         let client = client.clone();\n  210 |         let args = args.clone();\n  211 |         if let Ok((stream, _)) = listener.accept().await {\n  212 |           let io = TokioIo::new(stream);\n  213 | \n  214 |           tokio::task::spawn(async move {\n  215 |             if let Err(err) = auto::Builder::new(TokioExecutor::new())\n  216 |               .http1()\n  217 |               .title_case_headers(true)\n  218 |               .preserve_header_case(true)\n  219 |               .serve_connection(\n  220 |                 io,\n  221 |                 service_fn(|request| handle(client.clone(), request, args.clone())),\n  222 |               )\n  223 |               .await\n  224 |             {\n  225 |               println!(\"Error serving connection: {err:?}\");\n  226 |             }\n  227 |           });\n  228 |         } else {\n  229 |           println!(\"accept new stream fail, ignore here\");\n  230 |         }\n  231 |       }\n  232 |     } else {\n  233 |       println!(\"can not listen to address: {address:?}\");\n  234 |     }\n  235 |   };\n  236 |   srv.await;\n  237 | \n  238 |   #[cfg(unix)]\n  239 |   {\n  240 |     signals_handle.close();\n  241 |     signals_task.await?;\n  242 |   }\n  243 | \n  244 |   Ok(())","lines":76,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-driver/src/server.rs#L169-L244"}]},
{"id":"ARCH_7","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"easy","description":"The `Keychain` `Drop` implementation silently ignores errors from `security delete-keychain`. If deletion fails (e.g., the keychain is still in use), the temporary keychain will persist in the user's keychain list indefinitely. There is no logging or user notification.","fix":"Log the error (e.g. with `eprintln!` or the `log` crate) if the delete-keychain command fails, to alert the user.","locations":[{"ref":"crates/tauri-macos-sign/src/keychain.rs:29-37","code":"   29 | impl Drop for Keychain {\n   30 |   fn drop(&mut self) {\n   31 |     if let Some(path) = &self.path {\n   32 |       let _ = Command::new(\"security\")\n   33 |         .arg(\"delete-keychain\")\n   34 |         .arg(path)\n   35 |         .piped();\n   36 |     }\n   37 |   }","lines":9,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-macos-sign/src/keychain.rs#L29-L37"}]},
{"id":"ARCH_8","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"`tauri-schema-generator/src/main.rs` is an empty `main()`. The crate appears to be a stub that once generated schemas but is now unused (actual schema generation lives in `tauri-utils/src/acl/schema.rs`). Keeping an empty binary crate in the workspace adds build overhead and is confusing.","fix":"Either remove the crate from the workspace or document why the stub is intentionally kept.","locations":[{"ref":"crates/tauri-schema-generator/src/main.rs:12","code":"   12 | fn main() {}","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-schema-generator/src/main.rs#L12"}]},
{"id":"ARCH_9","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"The Tauri-Custom-Header field in HeaderConfig is documented 'NOT INTENDED FOR PRODUCTION USE' but is a first-class config struct field, exposed in the public API, and used in add_configured_headers. Keeping a non-production header as a permanent struct field invites misuse and creates a maintenance burden (it must be carried in ToTokens, serialization, defaults, etc.).","fix":"Either gate it behind a `#[cfg(debug_assertions)]` attribute or remove it entirely and replace with a general-purpose custom headers map.","locations":[{"ref":"crates/tauri-utils/src/config.rs:2983-2988","code":" 2983 |   /// A custom header field Tauri-Custom-Header, don't use it.\n 2984 |   /// Remember to set Access-Control-Expose-Headers accordingly\n 2985 |   ///\n 2986 |   /// **NOT INTENDED FOR PRODUCTION USE**\n 2987 |   #[serde(rename = \"Tauri-Custom-Header\")]\n 2988 |   pub tauri_custom_header: Option<HeaderSource>,","lines":6,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/config.rs#L2983-L2988"},{"ref":"crates/tauri-utils/src/config.rs:2831-2834","code":" 2831 |       if let Some(value) = &headers.tauri_custom_header {\n 2832 |         // Keep in mind to correctly set the Access-Control-Expose-Headers\n 2833 |         self = self.header(\"Tauri-Custom-Header\", value.to_string());\n 2834 |       };","lines":4,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/config.rs#L2831-L2834"}]},
{"id":"ARCH_10","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"html.rs (kuchiki-based) and html2.rs (dom_query-based) are parallel implementations of almost identical HTML manipulation. They share code like normalize_script_for_csp, inject_csp, inject_nonce_token, inline_isolation, and inject_codegen_isolation_script, but each file re-implements slightly different internal plumbing (with_head vs ensure_head, prepend vs prepend_child). Maintaining two copies introduces drift risk and doubles the bug surface.","fix":"Decide on one HTML library and remove the other, or extract shared logic into a common internal module and keep only thin adapters per library.","locations":[{"ref":"crates/tauri-utils/src/html.rs:1-442","code":"    1 | // Copyright 2019-2024 Tauri Programme within The Commons Conservancy\n    2 | // SPDX-License-Identifier: Apache-2.0\n    3 | // SPDX-License-Identifier: MIT\n    4 | \n    5 | //! The module to process HTML in Tauri.\n    6 | \n    7 | use std::path::{Path, PathBuf};\n    8 | \n    9 | use html5ever::{\n   10 |   interface::QualName,\n   11 |   namespace_url, ns,\n   12 |   serialize::{HtmlSerializer, SerializeOpts, Serializer, TraversalScope},\n   13 |   tendril::TendrilSink,\n   14 |   LocalName,\n   15 | };\n   16 | pub use kuchiki::NodeRef;\n   17 | use kuchiki::{Attribute, ExpandedName, NodeData};\n   18 | use serde::Serialize;\n   19 | #[cfg(feature = \"isolation\")]\n   20 | use serialize_to_javascript::DefaultTemplate;\n   21 | \n   22 | #[cfg(feature = \"isolation\")]\n   23 | use crate::pattern::isolation::IsolationJavascriptCodegen;\n   24 | use crate::{\n   25 |   assets::{SCRIPT_NONCE_TOKEN, STYLE_NONCE_TOKEN},\n   26 |   config::{DisabledCspModificationKind, PatternKind},\n   27 | };\n   28 | \n   29 | // taken from <https://github.com/kuchiki-rs/kuchiki/blob/57ee6920d835315a498e748ba4b07a851ae5e498/src/serializer.rs#L12>\n   30 | fn serialize_node_ref_internal<S: Serializer>(\n   31 |   node: &NodeRef,\n   32 |   serializer: &mut S,\n   33 |   traversal_scope: TraversalScope,\n   34 | ) -> crate::Result<()> {\n   35 |   match (traversal_scope, node.data()) {\n   36 |     (ref scope, NodeData::Element(element)) => {\n   37 |       if *scope == TraversalScope::IncludeNode {\n   38 |         let attrs = element.attributes.borrow();\n   39 | \n   40 |         // Unfortunately we need to allocate something to hold these &'a QualName\n   41 |         let attrs = attrs\n   42 |           .map\n   43 |           .iter()\n   44 |           .map(|(name, attr)| {\n   45 |             (\n   46 |               QualName::new(attr.prefix.clone(), name.ns.clone(), name.local.clone()),\n   47 |               &attr.value,\n   48 |             )\n   49 |           })\n   50 |           .collect::<Vec<_>>();\n   51 | \n   52 |         serializer.start_elem(\n   53 |           element.name.clone(),\n   54 |           attrs.iter().map(|&(ref name, value)| (name, &**value)),\n   55 |         )?\n   56 |       }\n   57 | \n   58 |       let children = match element.template_contents.as_ref() {\n   59 |         Some(template_root) => template_root.children(),\n   60 |         None => node.children(),\n   61 |       };\n   62 |       for child in children {\n   63 |         serialize_node_ref_internal(&child, serializer, TraversalScope::IncludeNode)?\n   64 |       }\n   65 | \n   66 |       if *scope == TraversalScope::IncludeNode {\n   67 |         serializer.end_elem(element.name.clone())?\n   68 |       }\n   69 |       Ok(())\n   70 |     }\n   71 | \n   72 |     (_, &NodeData::DocumentFragment) | (_, &NodeData::Document(_)) => {\n   73 |       for child in node.children() {\n   74 |         serialize_node_ref_internal(&child, serializer, TraversalScope::IncludeNode)?\n   75 |       }\n   76 |       Ok(())\n   77 |     }\n   78 | \n   79 |     (TraversalScope::ChildrenOnly(_), _) => Ok(()),\n   80 | \n   81 |     (TraversalScope::IncludeNode, NodeData::Doctype(doctype)) => {\n   82 |       serializer.write_doctype(&doctype.name).map_err(Into::into)\n   83 |     }\n   84 |     (TraversalScope::IncludeNode, NodeData::Text(text)) => {\n   85 |       serializer.write_text(&text.borrow()).map_err(Into::into)\n   86 |     }\n   87 |     (TraversalScope::IncludeNode, NodeData::Comment(text)) => {\n   88 |       serializer.write_comment(&text.borrow()).map_err(Into::into)\n   89 |     }\n   90 |     (TraversalScope::IncludeNode, NodeData::ProcessingInstruction(contents)) => {\n   91 |       let contents = contents.borrow();\n   92 |       serializer\n   93 |         .write_processing_instruction(&contents.0, &contents.1)\n   94 |         .map_err(Into::into)\n   95 |     }\n   96 |   }\n   97 | }\n   98 | \n   99 | /// Serializes the node to HTML.\n  100 | pub fn serialize_node(node: &NodeRef) -> Vec<u8> {\n  101 |   let mut u8_vec = Vec::new();\n  102 |   let mut ser = HtmlSerializer::new(\n  103 |     &mut u8_vec,\n  104 |     SerializeOpts {\n  105 |       traversal_scope: TraversalScope::IncludeNode,\n  106 |       ..Default::default()\n  107 |     },\n  108 |   );\n  109 |   serialize_node_ref_internal(node, &mut ser, TraversalScope::IncludeNode).unwrap();\n  110 |   u8_vec\n  111 | }\n  112 | \n  113 | /// Parses the given HTML string.\n  114 | pub fn parse(html: String) -> NodeRef {\n  115 |   kuchiki::parse_html().one(html).document_node\n  116 | }\n  117 | \n  118 | fn with_head<F: FnOnce(&NodeRef)>(document: &NodeRef, f: F) {\n  119 |   if let Ok(ref node) = document.select_first(\"head\") {\n  120 |     f(node.as_node())\n  121 |   } else {\n  122 |     let node = NodeRef::new_element(\n  123 |       QualName::new(None, ns!(html), LocalName::from(\"head\")),\n  124 |       None,\n  125 |     );\n  126 |     f(&node);\n  127 |     document.prepend(node)\n  128 |   }\n  129 | }\n  130 | \n  131 | fn inject_nonce(document: &NodeRef, selector: &str, token: &str) {\n  132 |   if let Ok(elements) = document.sele n  390 | \n  391 |     let document = parse(html.to_string());\n  392 |     inject_nonce_token(&document, &config::DisabledCspModificationKind::Flag(false));\n  393 | \n  394 |     assert_eq!(\n  395 |       String::from_utf8(serialize_node(&document)).unwrap(),\n  396 |       format!(\n  397 |         r#\"<html><head><style nonce=\"{STYLE_NONCE_TOKEN}\">body {{ color: red; }}<\/style><\/head><body><\/body><\/html>\"#\n  398 |       )\n  399 |     );\n  400 |   }\n  401 | \n  402 |   #[test]\n  403 |   fn inject_nonce_skips_existing() {\n  404 |     let html = r#\"<html><head><script src=\"http://example.com/script.js\" nonce=\"existing\"><\/script><\/head><body><\/body><\/html>\"#;\n  405 | \n  406 |     let document = parse(html.to_string());\n  407 |     inject_nonce_token(&document, &config::DisabledCspModificationKind::Flag(false));\n  408 | \n  409 |     assert_eq!(String::from_utf8(serialize_node(&document)).unwrap(), html);\n  410 |   }\n  411 | \n  412 |   #[test]\n  413 |   fn inject_nonce_respects_disabled_modification() {\n  414 |     let html = r#\"<html><head><script src=\"http://example.com/script.js\"><\/script><\/head><body><\/body><\/html>\"#;\n  415 | \n  416 |     let document = parse(html.to_string());\n  417 |     inject_nonce_token(&document, &config::DisabledCspModificationKind::Flag(true));\n  418 | \n  419 |     assert_eq!(\n  420 |       String::from_utf8(serialize_node(&document)).unwrap(),\n  421 |       r#\"<html><head><script src=\"http://example.com/script.js\"><\/script><\/head><body><\/body><\/html>\"#\n  422 |     );\n  423 |   }\n  424 | \n  425 |   #[test]\n  426 |   fn inline_isolation_replaces_src_with_content() {\n  427 |     let temp_dir = tempfile::tempdir().unwrap();\n  428 |     let mut file = tempfile::NamedTempFile::with_suffix_in(\".js\", &temp_dir).unwrap();\n  429 |     file.write_all(b\"console.log('test');\").unwrap();\n  430 |     let file_name = file.path().file_name().unwrap().to_str().unwrap();\n  431 | \n  432 {"id":"ARCH_11","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"The InvokeResolver holds a Arc<Mutex<Option<Box<OwnedInvokeResponder<R>>>>> where the Option is used to implement single-use semantics (take on first call). This extra level of indirection (Arc + Mutex + Option + Box) adds complexity and overhead. Since InvokeResolver is cloneable, concurrent callers can race to call resolve, with one panicking on the expect. The clone-for-concurrent-use pattern is unsafe without clear documentation.","fix":"Use an AtomicBool consumed flag or a oneshot channel to implement single-response semantics without exposing a clone-then-panic footgun. At minimum, document that only one clone should call respond.","locations":[{"ref":"crates/tauri/src/ipc/mod.rs:286-320","code":"  286 | pub struct InvokeResolver<R: Runtime> {\n  287 |   webview: Webview<R>,\n  288 |   responder: Arc<Mutex<Option<Box<OwnedInvokeResponder<R>>>>>,\n  289 |   cmd: String,\n  290 |   pub(crate) callback: CallbackFn,\n  291 |   pub(crate) error: CallbackFn,\n  292 | }\n  293 | \n  294 | impl<R: Runtime> Clone for InvokeResolver<R> {\n  295 |   fn clone(&self) -> Self {\n  296 |     Self {\n  297 |       webview: self.webview.clone(),\n  298 |       responder: self.responder.clone(),\n  299 |       cmd: self.cmd.clone(),\n  300 |       callback: self.callback,\n  301 |       error: self.error,\n  302 |     }\n  303 |   }\n  304 | }\n  305 | \n  306 | impl<R: Runtime> InvokeResolver<R> {\n  307 |   pub(crate) fn new(\n  308 |     webview: Webview<R>,\n  309 |     responder: Arc<Mutex<Option<Box<OwnedInvokeResponder<R>>>>>,\n  310 |     cmd: String,\n  311 |     callback: CallbackFn,\n  312 |     error: CallbackFn,\n  313 |   ) -> Self {\n  314 |     Self {\n  315 |       webview,\n  316 |       responder,\n  317 |       cmd,\n  318 |       callback,\n  319 |       error,\n  320 |     }","lines":35,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/ipc/mod.rs#L286-L320"}]},
{"id":"ARCH_12","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"The `PENDING_PLUGIN_CALLS` and `CHANNELS` globals are process-wide `OnceLock<Mutex<HashMap<...>>>`. In a multi-app scenario (multiple Tauri app instances in the same process), these maps would be shared across all instances, meaning plugin callbacks from one app instance can be erroneously routed to handlers registered by another.","fix":"Move these maps into a per-`AppHandle` or per-runtime state struct rather than process-level statics.","locations":[{"ref":"crates/tauri/src/plugin/mobile.rs:33-35","code":"   33 | static PENDING_PLUGIN_CALLS: OnceLock<Mutex<HashMap<i32, PendingPluginCallHandler>>> =\n   34 |   OnceLock::new();\n   35 | static CHANNELS: OnceLock<Mutex<HashMap<u32, Channel<serde_json::Value>>>> = OnceLock::new();","lines":3,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/plugin/mobile.rs#L33-L35"}]},
{"id":"OTHER_1","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"The responder inside InvokeResolver is wrapped in Arc<Mutex<Option<Box<...>>>> but the Mutex is unlocked immediately after take() and before the closure is called (the closure call happens outside the lock scope at line 485). This is fine for soundness but the locking/unlocking for a one-shot single-use closure is wasteful. The Arc is also unnecessary if the resolver isn't meant to be shared across threads safely.","fix":"Consider using Arc<OnceLock<...>> or an atomic flag approach to avoid Mutex overhead for this single-use pattern.","locations":[{"ref":"crates/tauri/src/ipc/mod.rs:477-492","code":"  477 |   pub(crate) fn return_result(\n  478 |     webview: Webview<R>,\n  479 |     responder: Arc<Mutex<Option<Box<OwnedInvokeResponder<R>>>>>,\n  480 |     response: InvokeResponse,\n  481 |     cmd: String,\n  482 |     success_callback: CallbackFn,\n  483 |     error_callback: CallbackFn,\n  484 |   ) {\n  485 |     (responder.lock().unwrap().take().expect(\"resolver consumed\"))(\n  486 |       webview,\n  487 |       cmd,\n  488 |       response,\n  489 |       success_callback,\n  490 |       error_callback,\n  491 |     );\n  492 |   }","lines":16,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/ipc/mod.rs#L477-L492"}]},

<script>
(function(){
'use strict';

// Data
const FINDINGS     = JSON.parse(document.getElementById('D').textContent);
const PROJECT_INFO = JSON.parse(document.getElementById('PI').textContent);
const SEVS     = ['critical','high','medium','low','negligible'];
const STATUSES = ['open','fixed','wont-fix','false-positive'];
const ALL_TYPES = [...new Set(FINDINGS.map(f => f.type))].sort(cmpTypes);
// Build lookup map for O(1) access
const FINDING_BY_ID = new Map(FINDINGS.map(f => [f.id, f]));
// Only severities actually present in the report — the filter bar hides the rest.
const PRESENT_SEVS = SEVS.filter(s => FINDINGS.some(f => (f.severity || 'medium') === s));
// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};
const PRESENT_DIFFS = DIFFICULTY_ORDER.filter(d => FINDINGS.some(f => f.difficulty === d));
const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', searchScope: 'all', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),
};
const statuses = {};

// Persistence
function loadStatuses() {
  try { Object.assign(statuses, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}
}
function saveStatuses() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    if (S.searchScope !== 'all') p.set('qs', S.searchScope);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('qs'))  { S.searchScope = p.get('qs'); }
  document.getElementById('search-scope').classList.toggle('active', S.searchScope === 'locations');
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }
function isCustom(t)  { return String(t).toLowerCase() === 'custom'; }
function typeCls(t)   { return 'type-badge' + (isCustom(t) ? ' custom-type' : ''); }
// 'custom' findings are the user's own externally-sourced ones; pin them first
// everywhere types are listed so they never blend into the audit's own categories.
function cmpTypes(a, b) {
  if (isCustom(a) !== isCustom(b)) return isCustom(a) ? -1 : 1;
  return String(a).localeCompare(String(b));
}

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort(cmpTypes);

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build a [project] header block from embedded PROJECT_INFO, so the exported
// findings.toml is self-contained (doesn't depend on a sibling project-info.toml
// that a second, separately-triggered download could silently fail to save).
// '' when there is no project info at all.
function buildProjectToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = PROJECT_INFO || {};
  if (!Object.keys(pi).length) return '';
  const lines = ['[project]'];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n\n';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    // Pin the id so re-rendering this export - or filtering it down later - can't
    // renumber findings that were already referenced by id elsewhere.
    if (f.id && f.id !== '?') lns.push(pad('id') + '= ' + tomlStr(f.id));
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return buildProjectToml() + chunks.join('\n\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'folder') {
    if (!f.locations.length) return '(no location)';
    const path = f.locations[0].ref.replace(/:.*/,'');
    const idx = path.lastIndexOf('/');
    return idx === -1 ? '(root)' : path.slice(0, idx);
  }
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystacks per finding (cleared on full re-render).
// Two variants: everything (default), and file/folder paths only - for when a
// search term (e.g. a directory name like 'dlls/abc') also happens to appear
// inside description/fix prose and you only want path matches.
const _hay = new Map();
const _hayLoc = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}
function hayLocOf(f) {
  if (!_hayLoc.has(f.id)) {
    _hayLoc.set(f.id, f.locations.map(l => l.ref).join(' ').toLowerCase());
  }
  return _hayLoc.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (S.searchScope === 'locations') {
      if (!hayLocOf(f).includes(q)) return false;
    } else if (!hayOf(f).includes(q) && !st.includes(q)) {
      return false;
    }
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  if (S.groupBy === 'type') return [...keys].sort(cmpTypes);
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge ' + typeCls(f.type) + '" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge ' + typeCls(t) + '" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  _hayLoc.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    // Single download (was two) - a second auto-triggered download is commonly
    // blocked by the browser unless the user explicitly allows it, which silently
    // drops project-info.toml. Embedding [project] in findings.toml itself avoids
    // that failure mode entirely.
    downloadText(buildFindingsToml(), 'findings.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});
document.getElementById('search-scope').addEventListener('click', e => {
  S.searchScope = S.searchScope === 'locations' ? 'all' : 'locations';
  e.currentTarget.classList.toggle('active', S.searchScope === 'locations');
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
