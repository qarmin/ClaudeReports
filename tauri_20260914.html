{"id":"LOGIC_50","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`Window::is_webview_window` returns `true` when the window has zero webviews because `Iterator::all` on an empty iterator vacuously returns `true`. A window with no webviews attached would be incorrectly identified as a WebviewWindow, causing `CommandArg::from_command` for `WebviewWindow` to accept the command even though there is no webview.","fix":"Add an early check: `let views = self.webviews(); !views.is_empty() && views.iter().all(|w| w.label() == self.label())`.","locations":[{"ref":"crates/tauri/src/window/mod.rs:1173-1175","code":" 1173 |   pub(crate) fn is_webview_window(&self) -> bool {\n 1174 |     self.webviews().iter().all(|w| w.label() == self.label())\n 1175 |   }","lines":3,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/window/mod.rs#L1173-L1175"}]},
{"id":"LOGIC_51","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `Window::is_menu_visible`, the `MutexGuard` returned by `self.menu_lock()` is held alive for the entire `if let` block, which includes the synchronous `rx.recv()` call that blocks the current thread waiting for the main-thread closure to finish. If the main-thread closure ever needs to acquire `menu_lock()` (e.g. through any path that calls `menu()` or `set_menu()`), a deadlock occurs.","fix":"Extract the menu clone before the `if let` and drop the guard explicitly before calling `run_on_main_thread`/`recv`:\n```rust\nlet menu_ = self.menu_lock().as_ref().map(|m| m.menu.clone());\nif let Some(menu_) = menu_ { ... }\n```","locations":[{"ref":"crates/tauri/src/window/mod.rs:1439-1461","code":" 1439 |     if let Some(window_menu) = &*self.menu_lock() {\n 1440 |       let (tx, rx) = std::sync::mpsc::channel();\n 1441 |       let window = self.clone();\n 1442 |       let menu_ = window_menu.menu.clone();\n 1443 |       self.run_on_main_thread(move || {\n 1444 |         #[cfg(windows)]\n 1445 |         if let Ok(hwnd) = window.hwnd() {\n 1446 |           let _ = tx.send(unsafe { menu_.inner().is_visible_on_hwnd(hwnd.0 as _) });\n 1447 |         }\n 1448 |         #[cfg(any(\n 1449 |           target_os = \"linux\",\n 1450 |           target_os = \"dragonfly\",\n 1451 |           target_os = \"freebsd\",\n 1452 |           target_os = \"netbsd\",\n 1453 |           target_os = \"openbsd\"\n 1454 |         ))]\n 1455 |         if let Ok(gtk_window) = window.gtk_window() {\n 1456 |           let _ = tx.send(menu_.inner().is_visible_on_gtk_window(&gtk_window));\n 1457 |         }\n 1458 |       })?;\n 1459 | \n 1460 |       return Ok(rx.recv().unwrap_or(false));\n 1461 |     }","lines":23,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/window/mod.rs#L1439-L1461"}]},
{"id":"LOGIC_52","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `packages/api/src/core.ts`, the `Channel` class uses a JavaScript sparse array (`#pendingMessages: T[]`) to buffer out-of-order messages. Array elements are accessed by numeric index (message sequence number) and deleted with `delete`. If the stream has a large gap in sequence numbers (e.g. index 0 arrives, then index 100000), the array will have a 100000-slot hole in memory. For long-lived channels with many messages this can become a significant memory overhead; the `delete` operator also leaves the slot as `undefined` rather than actually shrinking the array.","fix":"Use a `Map<number, T>` instead of a sparse array to buffer pending messages, and delete keys via `Map.delete()` which actually frees the entry.","locations":[{"ref":"packages/api/src/core.ts:83-130","code":"   83 |   #nextMessageIndex = 0\n   84 |   #pendingMessages: T[] = []\n   85 |   #messageEndIndex: number | undefined\n   86 | \n   87 |   constructor(onmessage?: (response: T) => void) {\n   88 |     this.#onmessage = onmessage || (() => {})\n   89 | \n   90 |     this.id = transformCallback<\n   91 |       // Normal message\n   92 |       | { message: T; index: number }\n   93 |       // Message when the channel gets dropped in the rust side\n   94 |       | { end: true; index: number }\n   95 |     >((rawMessage) => {\n   96 |       const index = rawMessage.index\n   97 | \n   98 |       if ('end' in rawMessage) {\n   99 |         if (index == this.#nextMessageIndex) {\n  100 |           this.cleanupCallback()\n  101 |         } else {\n  102 |           this.#messageEndIndex = index\n  103 |         }\n  104 |         return\n  105 |       }\n  106 | \n  107 |       const message = rawMessage.message\n  108 |       // Process the message if we're at the right order\n  109 |       if (index == this.#nextMessageIndex) {\n  110 |         this.#onmessage(message)\n  111 |         this.#nextMessageIndex += 1\n  112 | \n  113 |         // process pending messages\n  114 |         while (this.#nextMessageIndex in this.#pendingMessages) {\n  115 |           const message = this.#pendingMessages[this.#nextMessageIndex]\n  116 |           this.#onmessage(message)\n  117 |           // eslint-disable-next-line @typescript-eslint/no-array-delete\n  118 |           delete this.#pendingMessages[this.#nextMessageIndex]\n  119 |           this.#nextMessageIndex += 1\n  120 |         }\n  121 | \n  122 |         if (this.#nextMessageIndex === this.#messageEndIndex) {\n  123 |           this.cleanupCallback()\n  124 |         }\n  125 |       }\n  126 |       // Queue the message if we're not\n  127 |       else {\n  128 |         // eslint-disable-next-line security/detect-object-injection\n  129 |         this.#pendingMessages[index] = message\n  130 |       }","lines":48,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/packages/api/src/core.ts#L83-L130"}]},
{"id":"LOGIC_53","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `packages/api/src/core.ts`, the Channel's index comparison uses loose equality (`==`) on line 99 and 109 when comparing numeric indices (`index == this.#nextMessageIndex`), but strict equality (`===`) on line 122. Both comparisons involve numbers so loose equality works here, but the inconsistency is a style/maintenance risk. More critically, the `end` message index check on line 122 uses `===` which will never match if `cleanupCallback` already ran inside the while-loop on line 119 when incrementing past `#messageEndIndex`.","fix":"Use `===` throughout for consistency, and add a check after the while-loop that handles the case where `#nextMessageIndex` passes `#messageEndIndex`.","locations":[{"ref":"packages/api/src/core.ts:99-123","code":"   99 |         if (index == this.#nextMessageIndex) {\n  100 |           this.cleanupCallback()\n  101 |         } else {\n  102 |           this.#messageEndIndex = index\n  103 |         }\n  104 |         return\n  105 |       }\n  106 | \n  107 |       const message = rawMessage.message\n  108 |       // Process the message if we're at the right order\n  109 |       if (index == this.#nextMessageIndex) {\n  110 |         this.#onmessage(message)\n  111 |         this.#nextMessageIndex += 1\n  112 | \n  113 |         // process pending messages\n  114 |         while (this.#nextMessageIndex in this.#pendingMessages) {\n  115 |           const message = this.#pendingMessages[this.#nextMessageIndex]\n  116 |           this.#onmessage(message)\n  117 |           // eslint-disable-next-line @typescript-eslint/no-array-delete\n  118 |           delete this.#pendingMessages[this.#nextMessageIndex]\n  119 |           this.#nextMessageIndex += 1\n  120 |         }\n  121 | \n  122 |         if (this.#nextMessageIndex === this.#messageEndIndex) {\n  123 |           this.cleanupCallback()","lines":25,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/packages/api/src/core.ts#L99-L123"}]},
{"id":"LOGIC_54","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"The `isTauri()` function in `packages/api/src/core.ts` checks `(globalThis as any).isTauri`, but there is no such property injected by Tauri - Tauri injects `window.__TAURI_INTERNALS__`. The expression `(globalThis as any) || window` also always evaluates to `globalThis` because objects are always truthy, making the `|| window` branch unreachable. As written, `isTauri()` always returns `false` in a Tauri context.","fix":"Change the check to `return typeof window !== 'undefined' && '__TAURI_INTERNALS__' in window` to correctly detect the Tauri environment.","locations":[{"ref":"packages/api/src/core.ts:386-389","code":"  386 | function isTauri(): boolean {\n  387 |   // eslint-disable-next-line @typescript-eslint/no-explicit-any, @typescript-eslint/no-unsafe-member-access\n  388 |   return !!((globalThis as any) || window).isTauri\n  389 | }","lines":4,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/packages/api/src/core.ts#L386-L389"}]},
{"id":"LOGIC_55","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In convert_version (msi/mod.rs), after checking pre.is_ok(), the code calls pre.unwrap() instead of reusing the already-unwrapped value. This is a minor redundancy but could introduce subtle issues if the pattern is copy-pasted and modified.","fix":"Use `if let Ok(pre_num) = pre { if pre_num <= 65535 { ... } }` to avoid the redundant unwrap.","locations":[{"ref":"crates/tauri-bundler/src/bundle/windows/msi/mod.rs:359-361","code":"  359 |     let pre = version.pre.parse::<u64>();\n  360 |     if pre.is_ok() && pre.unwrap() <= 65535 {\n  361 |       return Ok(format!(","lines":3,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-bundler/src/bundle/windows/msi/mod.rs#L359-L361"}]},
{"id":"LOGIC_56","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In add.rs, when the regex matches and plugin init is written to main.rs, the function returns Ok(()) immediately without processing lib.rs. If a project has both main.rs and lib.rs and both contain `tauri::Builder::default()`, only main.rs is patched.","fix":"Remove the early return so both files are checked and patched if they contain the builder call.","locations":[{"ref":"crates/tauri-cli/src/add.rs:175-176","code":"  175 |       return Ok(());\n  176 |     }","lines":2,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/add.rs#L175-L176"}]},
{"id":"LOGIC_57","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In bundle.rs, the redundant `if !package_types.is_empty()` guard at line 190 is dead code: the function already returned at line 187 if package_types is empty. The comment above incorrectly describes the already-handled empty case.","fix":"Remove the redundant `if !package_types.is_empty()` wrapper around the before_bundle hook invocation.","locations":[{"ref":"crates/tauri-cli/src/bundle.rs:195-200","code":"  195 |   if package_types.is_empty() {\n  196 |     return Ok(());\n  197 |   }\n  198 | \n  199 |   // if we have a package to bundle, let's run the `before_bundle_command`.\n  200 |   if !package_types.is_empty() {","lines":6,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/bundle.rs#L195-L200"}]},
{"id":"LOGIC_58","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In helpers/framework.rs, the inference key for Next.js is `\"\\\"next\\\"\"` (with embedded quotes), while all other keys are plain dependency names. This is deliberately trying to distinguish `\"next\"` from `\"next-auth\"` etc., but it is fragile: it relies on the literal JSON string representation of package.json rather than proper parsing, and would fail if the JSON is formatted with spaces around the colon.","fix":"Parse package.json as JSON and inspect the dependencies map directly, rather than doing string contains() checks on the raw text.","locations":[{"ref":"crates/tauri-cli/src/helpers/framework.rs:104","code":"  104 |     (r#\"\"next\"\"#, Framework::Nextjs, Some(Bundler::Webpack)),","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/helpers/framework.rs#L104"}]},
{"id":"LOGIC_59","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"build_tools_version() does not deduplicate across the two vswhere queries before sorting and deduplicating: if both Windows 10 SDK and Windows 11 SDK are installed in the same VS instance, that instance appears twice in the merged list. The sort+dedup on line 96-97 handles this, but both queries run unconditionally even if the first already returns all relevant results.","fix":"This is acceptable as-is due to dedup, but consider an early-return after the first successful query finds results, to save running a second vswhere command unnecessarily.","locations":[{"ref":"crates/tauri-cli/src/info/env_system.rs:65-89","code":"   65 |   let mut instances: Vec<VsInstanceInfo> = Vec::new();\n   66 | \n   67 |   if output_sdk10.status.success() {\n   68 |     let stdout = String::from_utf8_lossy(&output_sdk10.stdout);\n   69 |     let found: Vec<VsInstanceInfo> =\n   70 |       serde_json::from_str(&stdout).context(\"failed to parse vswhere output\")?;\n   71 |     instances.extend(found);\n   72 |   }\n   73 | \n   74 |   if output_sdk11.status.success() {\n   75 |     let stdout = String::from_utf8_lossy(&output_sdk11.stdout);\n   76 |     let found: Vec<VsInstanceInfo> =\n   77 |       serde_json::from_str(&stdout).context(\"failed to parse vswhere output\")?;\n   78 |     instances.extend(found);\n   79 |   }\n   80 | \n   81 |   let mut instances: Vec<String> = instances\n   82 |     .iter()\n   83 |     .map(|i| i.display_name.clone())\n   84 |     .collect::<Vec<String>>();\n   85 | \n   86 |   instances.sort_unstable();\n   87 |   instances.dedup();\n   88 | \n   89 |   Ok(instances)","lines":25,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/info/env_system.rs#L65-L89"}]},
{"id":"LOGIC_60","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The test `migrate_invalid_url_dev_path` asserts `migrated[\"build\"][\"distDir\"] == original[\"build\"][\"frontendDist\"]`. Both sides evaluate to `serde_json::Value::Null` because `distDir` was renamed to `frontendDist` in the migrated output (so `migrated[\"build\"][\"distDir\"]` does not exist) and `frontendDist` was never in the original (so `original[\"build\"][\"frontendDist\"]` does not exist). The assertion passes trivially and does not verify the actual migration.","fix":"Change the assertion to `assert_eq!(migrated[\"build\"][\"frontendDist\"], original[\"build\"][\"distDir\"])` to verify that the renamed key has the expected value.","locations":[{"ref":"crates/tauri-cli/src/migrate/migrations/v1/config.rs:1226-1229","code":" 1226 |     assert_eq!(\n 1227 |       migrated[\"build\"][\"distDir\"],\n 1228 |       original[\"build\"][\"frontendDist\"]\n 1229 |     );","lines":4,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/migrate/migrations/v1/config.rs#L1226-L1229"}]},
{"id":"LOGIC_61","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The TypeScript detection in both Svelte and Vue partial loaders uses `content.contains(\"ts\")`, where `content` is the raw attribute string between `<script` and `>`. Any attribute name or value that incidentally contains the two-character substring `ts` (e.g. `data-ts`, `attrs`, or a URL fragment) will make the loader treat a plain-JavaScript block as TypeScript and cause the OXC parser to run in TypeScript mode, potentially producing incorrect output or parse errors.","fix":"Use a stricter check such as a regex that matches `lang\\s*=\\s*[\"']?ts[\"']?` (with word boundaries), or parse the attribute list properly. The `jsx` detection on line 54 of vue.rs has the same flaw.","locations":[{"ref":"crates/tauri-cli/src/migrate/migrations/v1/frontend/partial_loader/svelte.rs:42","code":"   42 |     let is_ts = content.contains(\"ts\");","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/migrate/migrations/v1/frontend/partial_loader/svelte.rs#L42"},{"ref":"crates/tauri-cli/src/migrate/migrations/v1/frontend/partial_loader/vue.rs:53","code":"   53 |     let is_ts = content.contains(\"ts\");","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/migrate/migrations/v1/frontend/partial_loader/vue.rs#L53"}]},
{"id":"LOGIC_62","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The `adb_forward_port` inner retry loop (lines 272-297) calls `run_adb_reverse` and then checks whether the port appears in the reverse list, sleeping 1 second and looping if not. There is no maximum iteration count, so if `adb reverse` keeps succeeding but the port never appears in `adb reverse --list` (e.g. due to an ADB bug or a device reboot), the CLI hangs indefinitely.","fix":"Add a retry limit (e.g. 30 iterations / 30 seconds) and return an error when exceeded.","locations":[{"ref":"crates/tauri-cli/src/mobile/android/android_studio_script.rs:272-297","code":"  272 |       loop {\n  273 |         run_adb_reverse(env, &target_device_serial_no, &forward, &forward).map_err(|error| {\n  274 |           Error::CommandFailed {\n  275 |             command: format!(\"adb reverse {forward} {forward}\"),\n  276 |             error,\n  277 |           }\n  278 |         })?;\n  279 | \n  280 |         let reverse_list_output =\n  281 |           adb_reverse_list(env, &target_device_serial_no).map_err(|error| {\n  282 |             Error::CommandFailed {\n  283 |               command: \"adb reverse --list\".to_string(),\n  284 |               error,\n  285 |             }\n  286 |           })?;\n  287 |         // wait and retry until the port has actually been forwarded\n  288 |         if String::from_utf8_lossy(&reverse_list_output.stdout).contains(&forward) {\n  289 |           break;\n  290 |         } else {\n  291 |           log::warn!(\n  292 |             \"waiting for the port to be forwarded to {}...\",\n  293 |             target_device_name\n  294 |           );\n  295 |           std::thread::sleep(std::time::Duration::from_secs(1));\n  296 |         }\n  297 |       }","lines":26,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/mobile/android/android_studio_script.rs#L272-L297"}]},
{"id":"LOGIC_63","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`restart_emulator` contains an inner `loop` waiting for the emulator process to disappear from the ADB device list before restarting it. There is no timeout; if `adb::device_list` keeps returning the serial number indefinitely the loop never terminates.","fix":"Add a timeout or retry counter and return an error when exceeded.","locations":[{"ref":"crates/tauri-cli/src/mobile/android/mod.rs:922-932","code":"  922 |   loop {\n  923 |     let devices = adb::device_list(env).unwrap_or_default();\n  924 |     if devices\n  925 |       .into_iter()\n  926 |       .find(|d| d.serial_no() == serial_no)\n  927 |       .is_none()\n  928 |     {\n  929 |       break;\n  930 |     }\n  931 |     sleep(Duration::from_secs(1));\n  932 |   }","lines":11,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/mobile/android/mod.rs#L922-L932"}]},
{"id":"LOGIC_64","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `with_certificate`, the `tempfile::tempdir()` returns a `TempDir` that is dropped at the end of the function - before `with_certificate_file` can finish importing the cert. On some OS implementations temp files are deleted when the `TempDir` is dropped. However, since `with_certificate_file` uses the path synchronously before the function returns the `TempDir`, the cert path remains valid during the import. The issue is that `tmp_dir` is dropped at end of `with_certificate`, yet `with_certificate_file` may be making copies, so this is actually safe. This is a non-issue but the ordering should be documented.","fix":"Add a comment clarifying that `tmp_dir` lifetime covers the import call, or restructure to make the intent explicit.","locations":[{"ref":"crates/tauri-macos-sign/src/keychain.rs:59-62","code":"   59 |     let tmp_dir = tempfile::tempdir().map_err(Error::TempDir)?;\n   60 |     let cert_path = tmp_dir.path().join(\"cert.p12\");\n   61 |     super::decode_base64(certificate_encoded, &cert_path)?;\n   62 |     Self::with_certificate_file(&cert_path, certificate_password)","lines":4,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-macos-sign/src/keychain.rs#L59-L62"}]},
{"id":"LOGIC_65","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `menu.rs`, the `dedup_by` call uses `a.ident == b.ident` but `dedup_by` documentation states it removes the first element when the closure returns `true`, keeping the later one. After the `sort_by`, positive and negated entries with the same ident may interleave, causing the negated entry to survive dedup instead of the positive one.","fix":"After dedup, also explicitly remove any remaining entries where `negated == true`, rather than relying on dedup ordering.","locations":[{"ref":"crates/tauri-macros/src/menu.rs:100-104","code":"  100 |   let has_negated = kinds.iter().any(|n| n.is_negated());\n  101 |   if has_negated {\n  102 |     kinds.extend(defaults);\n  103 |     kinds.sort_by(|a, b| a.ident.cmp(&b.ident));\n  104 |     kinds.dedup_by(|a, b| a.ident == b.ident);","lines":5,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-macros/src/menu.rs#L100-L104"}]},
{"id":"LOGIC_66","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"WebviewWrapper::Drop uses Rc::get_mut to detect the last reference, then removes the web context key when no webviews remain. However, the web context store is held behind an Arc<Mutex>, and WebviewWrapper itself also holds a clone of context_store. When Drop runs on the last WebviewWrapper, Rc::get_mut succeeds (no other Rc), but any concurrent code that holds a temporary reference to the WebContext (e.g. create_webview holding the mutex guard) will not be visible to Rc::get_mut. The logic is sound only because all webview creation/deletion happens on the main thread; however, the SAFETY comment is missing and any future cross-thread use would silently misfire.","fix":"Add a comment explaining the invariant that WebviewWrapper is only dropped on the main thread, or enforce it with a debug-mode thread assertion.","locations":[{"ref":"crates/tauri-runtime-wry/src/lib.rs:2388-2413","code":" 2388 | impl Drop for WebviewWrapper {\n 2389 |   fn drop(&mut self) {\n 2390 |     if Rc::get_mut(&mut self.inner).is_some() {\n 2391 |       let mut context_store = self.context_store.lock().unwrap();\n 2392 | \n 2393 |       if let Some(web_context) = context_store.get_mut(&self.context_key) {\n 2394 |         web_context.referenced_by_webviews.remove(&self.label);\n 2395 | \n 2396 |         // https://github.com/tauri-apps/tauri/issues/14626\n 2397 |         // Because WebKit does not close its network process even when no webviews are running,\n 2398 |         // we need to ensure to re-use the existing process on Linux by keeping the WebContext\n 2399 |         // alive for the lifetime of the app.\n 2400 |         // WebKit on macOS handles this itself.\n 2401 |         #[cfg(not(any(\n 2402 |           target_os = \"linux\",\n 2403 |           target_os = \"dragonfly\",\n 2404 |           target_os = \"freebsd\",\n 2405 |           target_os = \"netbsd\",\n 2406 |           target_os = \"openbsd\"\n 2407 |         )))]\n 2408 |         if web_context.referenced_by_webviews.is_empty() {\n 2409 |           context_store.remove(&self.context_key);\n 2410 |         }\n 2411 |       }\n 2412 |     }\n 2413 |   }","lines":26,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-runtime-wry/src/lib.rs#L2388-L2413"}]},
{"id":"LOGIC_67","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"monitor/linux.rs converts GDK logical rect dimensions to PhysicalRect by treating them as already-logical and then scaling. GDK workarea() already returns values in device-independent pixels; however, the sign convention for rect.x()/rect.y() on GDK is that they represent the top-left corner in screen coordinates. On a multi-monitor setup where the secondary monitor is to the left of the primary, rect.x() will be negative. Casting `rect.x()` (i32) and `rect.y()` (i32) into `LogicalPosition::new(rect.x(), rect.y())` is correct, but the PhysicalRect position type is PhysicalPosition<i32> which may truncate if scale_factor > 1 and coordinates are large. No overflow protection exists.","fix":"Consider whether saturating conversion is appropriate for extreme coordinates; document the assumption that GDK returns i32-safe values.","locations":[{"ref":"crates/tauri-runtime-wry/src/monitor/linux.rs:14-15","code":"   14 |       size: LogicalSize::new(rect.width() as u32, rect.height() as u32).to_physical(scale_factor),\n   15 |       position: LogicalPosition::new(rect.x(), rect.y()).to_physical(scale_factor),","lines":2,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-runtime-wry/src/monitor/linux.rs#L14-L15"}]},
{"id":"LOGIC_68","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"monitor/windows.rs computes work area size as `(rcWork.right - rcWork.left) as u32`. RECT fields are LONG (i32). On a normal monitor these are always positive, but on a monitor that is positioned to the left of the coordinate origin (negative positions are common in multi-monitor setups where the secondary is to the left), right and left could both be negative with right > left, giving a correct positive difference - however if left > right (a degenerate RECT) the subtraction underflows when cast to u32, producing a huge value. MONITORINFO should always have a valid RECT, but the cast is silent.","fix":"Assert or use `(right - left).max(0) as u32` and `(bottom - top).max(0) as u32` to guard against degenerate rects.","locations":[{"ref":"crates/tauri-runtime-wry/src/monitor/windows.rs:19-22","code":"   19 |         size: PhysicalSize::new(\n   20 |           (monitor_info.rcWork.right - monitor_info.rcWork.left) as u32,\n   21 |           (monitor_info.rcWork.bottom - monitor_info.rcWork.top) as u32,\n   22 |         ),","lines":4,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-runtime-wry/src/monitor/windows.rs#L19-L22"}]},
{"id":"LOGIC_69","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `update_drag_hwnd_rgn_for_undecorated` (undecorated_resizing.rs), the `WM_UPDATE_UNDECORATED_SHADOWS` message is sent to both the parent `hwnd` and the child `child` window. However, the `has_undecorated_shadows` boolean is passed as `LPARAM` for the parent (line 465) but should be `WPARAM` - for the child (line 473) it is also passed as `LPARAM`. The message handler in `subclass_parent` reads `wparam.0 != 0` (line 249) while the handler in `drag_resize_window_proc` also reads `wparam.0 != 0` (line 388). The send on line 461-466 passes `None` for `wparam` and `Some(LPARAM(has_undecorated_shadows as _))` - this means `wparam` will be 0 (false) regardless of the actual value. The send on line 468-475 has the same bug.","fix":"Pass `has_undecorated_shadows` as `WPARAM` not `LPARAM`: `SendMessageW(hwnd, WM_UPDATE_UNDECORATED_SHADOWS, Some(WPARAM(has_undecorated_shadows as _)), None)`.","locations":[{"ref":"crates/tauri-runtime-wry/src/undecorated_resizing.rs:460-475","code":"  460 |     unsafe {\n  461 |       SendMessageW(\n  462 |         hwnd,\n  463 |         WM_UPDATE_UNDECORATED_SHADOWS,\n  464 |         None,\n  465 |         Some(LPARAM(has_undecorated_shadows as _)),\n  466 |       )\n  467 |     };\n  468 |     unsafe {\n  469 |       SendMessageW(\n  470 |         child,\n  471 |         WM_UPDATE_UNDECORATED_SHADOWS,\n  472 |         None,\n  473 |         Some(LPARAM(has_undecorated_shadows as _)),\n  474 |       )\n  475 |     };","lines":16,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-runtime-wry/src/undecorated_resizing.rs#L460-L475"},{"ref":"crates/tauri-runtime-wry/src/undecorated_resizing.rs:246-250","code":"  246 |       WM_UPDATE_UNDECORATED_SHADOWS => {\n  247 |         let data = data as *mut UndecoratedResizingData;\n  248 |         let data = &mut *data;\n  249 |         data.has_undecorated_shadows = wparam.0 != 0;\n  250 |       }","lines":5,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-runtime-wry/src/undecorated_resizing.rs#L246-L250"},{"ref":"crates/tauri-runtime-wry/src/undecorated_resizing.rs:385-389","code":"  385 |       WM_UPDATE_UNDECORATED_SHADOWS => {\n  386 |         let data = GetWindowLongPtrW(child, GWLP_USERDATA);\n  387 |         let data = &mut *(data as *mut UndecoratedResizingData);\n  388 |         data.has_undecorated_shadows = wparam.0 != 0;\n  389 |       }","lines":5,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-runtime-wry/src/undecorated_resizing.rs#L385-L389"}]},
{"id":"LOGIC_70","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `crate_releases` (schema-worker/config.rs), the yanked filter is `r.yanked == Some(false)`. A version with `yanked: None` (absent from API response) is silently excluded. The crates.io API always returns `yanked`, so this is practically fine, but `Some(false)` being the only truthy value is fragile - `yanked == None` should arguably be treated as not-yanked.","fix":"Use `r.yanked != Some(true)` to treat absent as not-yanked.","locations":[{"ref":"crates/tauri-schema-worker/src/config.rs:143","code":"  143 |   let flt = |r: &CrateRelease| r.yanked == Some(false);","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-schema-worker/src/config.rs#L143"}]},
{"id":"LOGIC_71","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `Manifest::new` (manifest.rs), if multiple `PermissionFile` entries each define a `default` section, each one overwrites the previous via `manifest.default_permission.replace(...)`. The last file wins silently. This can cause surprising behaviour when a plugin has multiple permission files.","fix":"Return an error or emit a warning if a second `default` is encountered, rather than silently overwriting the first.","locations":[{"ref":"crates/tauri-utils/src/acl/manifest.rs:75-83","code":"   75 |       if let Some(default) = permission_file.default {\n   76 |         manifest.default_permission.replace(PermissionSet {\n   77 |           identifier: \"default\".into(),\n   78 |           description: default\n   79 |             .description\n   80 |             .unwrap_or_else(|| \"Default plugin permissions.\".to_string()),\n   81 |           permissions: default.permissions,\n   82 |         });\n   83 |       }","lines":9,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/acl/manifest.rs#L75-L83"}]},
{"id":"LOGIC_72","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `Manifest::new` (manifest.rs), if two permission files define a permission or permission set with the same identifier, the later one silently overwrites the earlier one (via `BTreeMap::insert`). There is no deduplication warning or error.","fix":"Check for existing keys and return an error or emit a warning on duplicate identifiers.","locations":[{"ref":"crates/tauri-utils/src/acl/manifest.rs:85-93","code":"   85 |       for permission in permission_file.permission {\n   86 |         let key = permission.identifier.clone();\n   87 |         manifest.permissions.insert(key, permission);\n   88 |       }\n   89 | \n   90 |       for set in permission_file.set {\n   91 |         let key = set.identifier.clone();\n   92 |         manifest.permission_sets.insert(key, set);\n   93 |       }","lines":9,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/acl/manifest.rs#L85-L93"}]},
{"id":"LOGIC_73","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"insert_into_xml splits on '\\n' but joins with '\\n'. On Windows, if the manifest file uses CRLF line endings ('\\r\\n'), splitting on '\\n' leaves '\\r' at the end of every captured line, and joining with '\\n' produces a mixed-endings file.","fix":"Normalize line endings before processing: `let xml = xml.replace(\"\\r\\n\", \"\\n\");`, or use `lines()` instead of `split('\\n')` (but then use the same approach when joining).","locations":[{"ref":"crates/tauri-utils/src/build.rs:143-166","code":"  143 |   for line in xml.split('\\n') {\n  144 |     if line.contains(&block_comment) {\n  145 |       found_block = !found_block;\n  146 |       continue;\n  147 |     }\n  148 | \n  149 |     // found previous block which should be removed\n  150 |     if found_block {\n  151 |       continue;\n  152 |     }\n  153 | \n  154 |     if let Some(index) = line.find(&parent_closing_tag) {\n  155 |       let indentation = \" \".repeat(index + 4);\n  156 |       rewritten.push(format!(\"{indentation}{block_comment}\"));\n  157 |       for l in contents.split('\\n') {\n  158 |         rewritten.push(format!(\"{indentation}{l}\"));\n  159 |       }\n  160 |       rewritten.push(format!(\"{indentation}{block_comment}\"));\n  161 |     }\n  162 | \n  163 |     rewritten.push(line.to_string());\n  164 |   }\n  165 | \n  166 |   rewritten.join(\"\\n\")","lines":24,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/build.rs#L143-L166"}]},
{"id":"LOGIC_74","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"mkv video files map to 'public.mpeg-4' UTI in extension_to_uti. MKV (Matroska) is a different container format from MPEG-4 and has its own UTI 'org.matroska.mkv'. Using 'public.mpeg-4' for MKV is incorrect and may cause unexpected behavior when the OS tries to open MKV files with an MPEG-4 capable app.","fix":"Change `\"mkv\" => Some(\"public.mpeg-4\")` to `\"mkv\" => Some(\"org.matroska.mkv\")` (or `None` if the UTI is not reliably available).","locations":[{"ref":"crates/tauri-utils/src/config.rs:1446","code":" 1446 |     // Audio","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/config.rs#L1446"}]},
{"id":"LOGIC_75","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"CspDirectiveSources::contains for the Inline variant checks for `\"{source} \"` (trailing space) or `\" {source}\"` (leading space), but misses the case where the source is the entire string (no spaces around it), i.e. when the inline CSP consists of exactly that one source with no neighbors. A single-entry inline CSP like `\"self\"` would not match `contains(\"self\")`.","fix":"Also check `s == source` or use `s.split(' ').any(|part| part == source)` to handle the single-entry case correctly.","locations":[{"ref":"crates/tauri-utils/src/config.rs:2495-2496","code":" 2495 |     match self {\n 2496 |       Self::Inline(s) => s.contains(&format!(\"{source} \")) || s.contains(&format!(\" {source}\")),","lines":2,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/config.rs#L2495-L2496"}]},

n 1600 |     features.push(\"window-all\");\n 1601 |     features\n 1602 |   }","lines":41,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/config_v1/mod.rs#L1562-L1602"}]},
{"id":"LOGIC_77","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"PackageVersionVisitor in config_v1/mod.rs calls path.exists() then reads the file (TOCTOU), and uses std::fs::read_to_string (imported at file scope) rather than the local wrapper that maps errors to DeError. If the path disappears between exists() and the read, the panic from the serde deserialization context may be confusing.","fix":"Wrap with the local read_to_string helper or handle NotFound gracefully.","locations":[{"ref":"crates/tauri-utils/src/config_v1/mod.rs:2796-2801","code":" 2796 |         let path = PathBuf::from(value);\n 2797 |         if path.exists() {\n 2798 |           let json_str = read_to_string(&path)\n 2799 |             .map_err(|e| DeError::custom(format!(\"failed to read version JSON file: {e}\")))?;\n 2800 |           let package_json: serde_json::Value = serde_json::from_str(&json_str)\n 2801 |             .map_err(|e| DeError::custom(format!(\"failed to read version JSON file: {e}\")))?;","lines":6,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/config_v1/mod.rs#L2796-L2801"}]},
{"id":"LOGIC_78","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In parse.rs, config file discovery uses path.exists() followed by read_to_string() - a classic check-then-act (TOCTOU) race. On a heavily loaded filesystem or inside a container with a union mount, the file could be removed or replaced between the exists() check and the actual read, causing a confusing error rather than a clean 'file not found' message.","fix":"Remove the exists() guards and just attempt to open the file; map NotFound I/O errors to the appropriate ConfigError::Io or the 'disabled format' path. This collapses the window.","locations":[{"ref":"crates/tauri-utils/src/config_v1/parse.rs:170-171","code":"  170 |   if path.exists() {\n  171 |     let raw = read_to_string(&path)?;","lines":2,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/config_v1/parse.rs#L170-L171"},{"ref":"crates/tauri-utils/src/config_v1/parse.rs:192-196","code":"  192 |   } else if json5.exists() {\n  193 |     #[cfg(feature = \"config-json5\")]\n  194 |     {\n  195 |       let raw = read_to_string(&json5)?;\n  196 |       do_parse_json5(&raw, &path).map(|config| (config, json5))","lines":5,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/config_v1/parse.rs#L192-L196"},{"ref":"crates/tauri-utils/src/config_v1/parse.rs:204-208","code":"  204 |   } else if toml.exists() {\n  205 |     #[cfg(feature = \"config-toml\")]\n  206 |     {\n  207 |       let raw = read_to_string(&toml)?;\n  208 |       do_parse_toml(&raw, &path).map(|config| (config, toml))","lines":5,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/config_v1/parse.rs#L204-L208"}]},
{"id":"LOGIC_79","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"TitleBarStyle::deserialize and Theme::deserialize use a silent catch-all (`_ => Self::Visible` / `_ => Self::Light`) that silently swallows invalid values. A typo such as `\"transparant\"` in tauri.conf.json produces no error and silently uses the default, making misconfiguration very hard to diagnose.","fix":"Return Err(DeError::custom(format!(\"unknown title bar style '{s}'\"))) in the catch-all arm.","locations":[{"ref":"crates/tauri-utils/src/lib.rs:197-201","code":"  197 |     Ok(match s.to_lowercase().as_str() {\n  198 |       \"transparent\" => Self::Transparent,\n  199 |       \"overlay\" => Self::Overlay,\n  200 |       _ => Self::Visible,\n  201 |     })","lines":5,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/lib.rs#L197-L201"},{"ref":"crates/tauri-utils/src/lib.rs:244-248","code":"  244 |     let s = String::deserialize(deserializer)?;\n  245 |     Ok(match s.to_lowercase().as_str() {\n  246 |       \"dark\" => Self::Dark,\n  247 |       _ => Self::Light,\n  248 |     })","lines":5,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/lib.rs#L244-L248"},{"ref":"crates/tauri-utils/src/config_v1/mod.rs:3005-3011","code":" 3005 |     let s = String::deserialize(deserializer)?;\n 3006 |     Ok(match s.to_lowercase().as_str() {\n 3007 |       \"transparent\" => Self::Transparent,\n 3008 |       \"overlay\" => Self::Overlay,\n 3009 |       _ => Self::Visible,\n 3010 |     })\n 3011 |   }","lines":7,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/config_v1/mod.rs#L3005-L3011"},{"ref":"crates/tauri-utils/src/config_v1/mod.rs:3052-3058","code":" 3052 |   {\n 3053 |     let s = String::deserialize(deserializer)?;\n 3054 |     Ok(match s.to_lowercase().as_str() {\n 3055 |       \"dark\" => Self::Dark,\n 3056 |       _ => Self::Light,\n 3057 |     })\n 3058 |   }","lines":7,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/config_v1/mod.rs#L3052-L3058"}]},
{"id":"LOGIC_80","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In platform.rs, bundle_type() maps `__TAURI_BUNDLE_TYPE_VAR_APP` to BundleType::AppImage and uses an obscure abbreviation `__TAURI_BUNDLE_TYPE_VAR_NSS` for BundleType::Nsis (should logically be NSI or NSIS). This mapping is only correct because tauri-bundler uses the same cryptic strings. The asymmetry between the token name (NSS) and the variant name (Nsis) is a latent maintenance hazard.","fix":"Document explicitly in a comment what each magic string maps to, or rename the bundler constants to be self-explanatory (VAR_APPIMAGE, VAR_NSIS).","locations":[{"ref":"crates/tauri-utils/src/platform.rs:355-365","code":"  355 |     match __TAURI_BUNDLE_TYPE {\n  356 |       \"__TAURI_BUNDLE_TYPE_VAR_DEB\" => Some(BundleType::Deb),\n  357 |       \"__TAURI_BUNDLE_TYPE_VAR_RPM\" => Some(BundleType::Rpm),\n  358 |       \"__TAURI_BUNDLE_TYPE_VAR_APP\" => Some(BundleType::AppImage),\n  359 |       \"__TAURI_BUNDLE_TYPE_VAR_MSI\" => Some(BundleType::Msi),\n  360 |       \"__TAURI_BUNDLE_TYPE_VAR_NSS\" => Some(BundleType::Nsis),\n  361 |       _ => {\n  362 |         if cfg!(target_os = \"macos\") {\n  363 |           Some(BundleType::App)\n  364 |         } else {\n  365 |           None","lines":11,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/platform.rs#L355-L365"}]},
{"id":"LOGIC_81","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `resource_from_path`, the `target` is computed before the `path` field is set, but the path is moved into the struct at the end. The computation of `target` already borrows `path` via `strip_prefix`, `file_name`, etc. This is structurally fine today, but the field layout `Ok(Resource { target: ..., path })` means `path` is evaluated last (it is a raw move of the already-borrowed-away local). The code happens to be correct only because of Rust move semantics after the borrow ends; any reordering of the struct literal fields could introduce a use-after-move compile error. This is a latent maintainability trap.","fix":"Compute `target` into a `let target = ...;` binding first, then construct `Resource { path, target }` to make the ordering intent clear.","locations":[{"ref":"crates/tauri-utils/src/resources.rs:205-251","code":"  205 |   fn resource_from_path(&self, path: PathBuf) -> crate::Result<Resource> {\n  206 |     if !path.exists() {\n  207 |       return Err(crate::Error::ResourcePathNotFound(path));\n  208 |     }\n  209 | \n  210 |     Ok(Resource {\n  211 |       target: if let Some(dest) = &self.current_dest {\n  212 |         match &self.current_iter {\n  213 |           Some(current_iter) => match current_iter {\n  214 |             // if processing a directory, preserve directory structure under current_dest\n  215 |             ResourcePathsInnerIter::Walk {\n  216 |               current_pattern, ..\n  217 |             } => {\n  218 |               if let Some(pattern) = current_pattern {\n  219 |                 dest.join(path.strip_prefix(pattern).unwrap_or(&path))\n  220 |               } else {\n  221 |                 dest.join(&path)\n  222 |               }\n  223 |             }\n  224 |             // if processing a glob and current_dest is not empty\n  225 |             // we put all globbed paths under current_dest\n  226 |             // preserving the file name as it is\n  227 |             ResourcePathsInnerIter::Glob { .. } => dest.join(path.file_name().unwrap()),\n  228 |           },\n  229 |           None => {\n  230 |             if dest.components().count() == 0 {\n  231 |               // if current_dest is empty while processing a file pattern\n  232 |               // we preserve the file name as it is\n  233 |               //\n  234 |               // e.g. `{ \"README.md\": \"\" }` is `README.md` -> `$RESOURCE/README.md`\n  235 |               //\n  236 |               // TODO: This behavior is a confusing special case,\n  237 |               // remove this in v3 or make other cases like this work\n  238 |               // > `{ \"README.md\": \"./folder/\" }` is `README.md` -> `$RESOURCE/folder/README.md` (this gives `$RESOURCE/folder` today)\n  239 |               PathBuf::from(path.file_name().unwrap())\n  240 |             } else {\n  241 |               dest.clone()\n  242 |             }\n  243 |           }\n  244 |         }\n  245 |       } else {\n  246 |         // If [`ResourcePathsIter::pattern_iter`] is a [`PatternIter::Slice`]\n  247 |         resource_relpath(&path)\n  248 |       },\n  249 |       path,\n  250 |     })\n  251 |   }","lines":47,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/resources.rs#L205-L251"}]},
{"id":"LOGIC_82","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"The `#[cfg(target_os = \"macos\")]` block around the iOS library linking code (lines 341-349) is dead when cross-compiling for iOS from a non-macOS host. Since iOS apps can only be built on macOS this is arguably intentional, but the guard is on the *host* OS (`#[cfg]`) rather than the *target* OS (`CARGO_CFG_TARGET_OS`). The inner `if target_os == \"ios\"` check is already the correct guard; the outer `#[cfg]` adds nothing useful and would silently skip the iOS link step if someone attempted a cross-compile from a Linux CI host.","fix":"Remove the `#[cfg(target_os = \"macos\")]` wrapper and rely solely on the `if target_os == \"ios\"` runtime check, matching the pattern used for Android.","locations":[{"ref":"crates/tauri/build.rs:335-343","code":"  335 |   #[cfg(target_os = \"macos\")]\n  336 |   {\n  337 |     if target_os == \"ios\" {\n  338 |       let lib_path =\n  339 |         PathBuf::from(std::env::var_os(\"CARGO_MANIFEST_DIR\").unwrap()).join(\"mobile/ios-api\");\n  340 |       tauri_utils::build::link_apple_library(\"Tauri\", &lib_path);\n  341 |       println!(\"cargo:ios_library_path={}\", lib_path.display());\n  342 |     }\n  343 |   }","lines":9,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/build.rs#L335-L343"}]},
{"id":"LOGIC_83","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `define_permissions`, `generate_docs` is called with `plugin.strip_prefix(\"tauri-plugin-\")` as the plugin name, but all plugins in the `PLUGINS` constant have names like `\"core:path\"`, `\"core:window\"` etc. - none start with `\"tauri-plugin-\"`. The strip always falls back to the full plugin name unchanged, making the strip_prefix call a no-op that creates misleading intent.","fix":"Change to `plugin.strip_prefix(\"core:\").unwrap_or(plugin)` to be consistent with the `plugin_directory_name` logic used on line 375, or remove the strip entirely if docs output should use the full plugin name.","locations":[{"ref":"crates/tauri/build.rs:430-433","code":"  430 |       &docs_out_dir,\n  431 |       plugin.strip_prefix(\"tauri-plugin-\").unwrap_or(plugin),\n  432 |     )\n  433 |     .expect(\"failed to generate plugin documentation page\");","lines":4,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/build.rs#L430-L433"}]},
{"id":"LOGIC_84","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `app.rs`, `Listener::listen` and `Listener::once` implementations for both `App<R>` and `AppHandle<R>` call `EventName::new(...).unwrap()` (lines 1187, 1198) which panics if the caller provides an event name with invalid characters. A public API should return a `Result` or at minimum document the panic.","fix":"Document the panic in the function docs, or change the trait to return `Result<EventId, crate::Error>` so the caller can handle invalid names gracefully.","locations":[{"ref":"crates/tauri/src/app.rs:1189-1190","code":" 1189 |         let event = EventName::new(event.into()).unwrap();\n 1190 |         self.manager.listen(event, EventTarget::App, handler)","lines":2,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/app.rs#L1189-L1190"},{"ref":"crates/tauri/src/app.rs:1200-1201","code":" 1200 |         let event = EventName::new(event.into()).unwrap();\n 1201 |         self.manager.once(event, EventTarget::App, handler)","lines":2,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/app.rs#L1200-L1201"}]},
{"id":"LOGIC_85","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `Listeners::unlisten`, the implementation scans *all* event handler maps linearly (`lock.values_mut().for_each(...)`) instead of storing a reverse index from `EventId` to event name. This makes unlisten O(total registered handlers) instead of O(1), which becomes costly if many event types and listeners are active.","fix":"Maintain a `HashMap<EventId, EventName>` alongside `handlers` so that `unlisten` can look up the event name directly, then remove the entry from that one map.","locations":[{"ref":"crates/tauri/src/event/listener.rs:182-189","code":"  182 |   pub(crate) fn unlisten(&self, id: EventId) {\n  183 |     match self.inner.handlers.try_lock() {\n  184 |       Err(_) => self.insert_pending(Pending::Unlisten(id)),\n  185 |       Ok(mut lock) => lock.values_mut().for_each(|handler| {\n  186 |         handler.remove(&id);\n  187 |       }),\n  188 |     }\n  189 |   }","lines":8,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/event/listener.rs#L182-L189"}]},
{"id":"LOGIC_86","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `listen_js_script` and `unlisten_js_script` in `event/mod.rs`, the generated JavaScript code hardcodes property access on `window['{listeners_object_name}']` and uses `configurable: true` for event listener objects, but properties set with `Object.defineProperty` without `writable: true` are read-only. If code on the page tries to update a listener slot directly (not through the defined protocol), it silently fails on strict mode or throws in non-strict mode.","fix":"Add `writable: false` explicitly or `configurable: false` to prevent accidental overwrite, and document the design intent.","locations":[{"ref":"crates/tauri/src/event/mod.rs:168-192","code":"  168 |   listeners_object_name: &str,\n  169 |   serialized_target: &str,\n  170 |   event: EventName<&str>,\n  171 |   event_id: EventId,\n  172 |   handler: CallbackFn,\n  173 | ) -> String {\n  174 |   let handler_id = handler.0;\n  175 |   format!(\n  176 |     \"(function () {{\n  177 |       if (window['{listeners_object_name}'] === void 0) {{\n  178 |         Object.defineProperty(window, '{listeners_object_name}', {{ value: Object.create(null) }});\n  179 |       }}\n  180 |       if (window['{listeners_object_name}']['{event}'] === void 0) {{\n  181 |         Object.defineProperty(window['{listeners_object_name}'], '{event}', {{ value: Object.create(null) }});\n  182 |       }}\n  183 |       const eventListeners = window['{listeners_object_name}']['{event}']\n  184 |       const listener = {{\n  185 |         target: {serialized_target},\n  186 |         handlerId: {handler_id}\n  187 |       }};\n  188 |       Object.defineProperty(eventListeners, '{event_id}', {{ value: listener, configurable: true }});\n  189 |     }})()\n  190 |   \",\n  191 |   )\n  192 | }","lines":25,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/event/mod.rs#L168-L192"}]},
{"id":"LOGIC_87","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`emit_js_script` in `event/mod.rs` embeds the event name and JSON payload directly into a JavaScript string via format! without any escaping. If the event name or payload contains a single-quote or back-slash, the generated script can be syntactically invalid or allow injection.","fix":"Ensure that `emit_args.event` cannot contain characters that break out of the JS string literal (it is validated by `EventName`, so single-quotes are excluded by the alphanumeric+limited-charset rule - this is safe for the event name). The payload is a `serde_json`-serialized string so it is safe JSON but is inserted bare into the JS expression. Document the safety invariants explicitly with a comment.","locations":[{"ref":"crates/tauri/src/event/mod.rs:194-206","code":"  194 | pub(crate) fn emit_js_script(\n  195 |   event_emit_function_name: &str,\n  196 |   emit_args: &EmitArgs,\n  197 |   serialized_ids: &str,\n  198 | ) -> crate::Result<String> {\n  199 |   Ok(format!(\n  200 |     \"(function () {{ const fn = window['{}']; fn && fn({{event: '{}', payload: {}}}, {ids}) }})()\",\n  201 |     event_emit_function_name,\n  202 |     emit_args.event,\n  203 |     emit_args.payload,\n  204 |     ids = serialized_ids,\n  205 |   ))\n  206 | }","lines":13,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/event/mod.rs#L194-L206"}]},
{"id":"LOGIC_88","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In the `ios.rs` file, `run_plugin_command` takes `id: i32` but the FFI callback type `PluginMessageCallbackFn` uses `c_int` for the first argument. On platforms where `c_int != i32` (unusual but possible), there could be a type mismatch. Similarly `c_ulonglong` is assumed to match `u64` in the channel callback.","fix":"Use `std::os::raw::c_int` consistently in the Swift-side binding declaration, or add a static assertion that `c_int` is the same size as `i32`.","locations":[{"ref":"crates/tauri/src/ios.rs:12-41","code":"   12 | type PluginMessageCallbackFn = unsafe extern \"C\" fn(c_int, c_int, *const c_char);\n   13 | pub struct PluginMessageCallback(pub PluginMessageCallbackFn);\n   14 | \n   15 | impl<'a> SwiftArg<'a> for PluginMessageCallback {\n   16 |   type ArgType = PluginMessageCallbackFn;\n   17 | \n   18 |   unsafe fn as_arg(&'a self) -> Self::ArgType {\n   19 |     self.0\n   20 |   }\n   21 | }\n   22 | \n   23 | type ChannelSendDataCallbackFn = unsafe extern \"C\" fn(c_ulonglong, *const c_char);\n   24 | pub struct ChannelSendDataCallback(pub ChannelSendDataCallbackFn);\n   25 | \n   26 | impl<'a> SwiftArg<'a> for ChannelSendDataCallback {\n   27 |   type ArgType = ChannelSendDataCallbackFn;\n   28 | \n   29 |   unsafe fn as_arg(&'a self) -> Self::ArgType {\n   30 |     self.0\n   31 |   }\n   32 | }\n   33 | \n   34 | swift!(pub fn run_plugin_command(\n   35 |   id: i32,\n   36 |   name: &SRString,\n   37 |   method: &SRString,\n   38 |   data: &SRString,\n   39 |   callback: PluginMessageCallback,\n   40 |   send_channel_data_callback: ChannelSendDataCallback\n   41 | ));","lines":30,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/ios.rs#L12-L41"}]},
{"id":"LOGIC_89","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `CapabilityBuilder::permission` and `CapabilityBuilder::permission_scoped`, the identifier is cloned before the `try_into()` call, and if the conversion fails the `panic!` message references the original string. However the `clone()` is unnecessary - `permission.as_str()` or a reference would suffice since the string is only needed for the error message.","fix":"Use `permission.try_into().unwrap_or_else(|_| panic!(\"invalid permission identifier '{permission}'\"))` on the original value and pass the reference for the error message, avoiding the `.clone()`.","locations":[{"ref":"crates/tauri/src/ipc/capability_builder.rs:90-98","code":"   90 |     let permission = permission.into();\n   91 |     self.0.permissions.push(PermissionEntry::PermissionRef(\n   92 |       permission\n   93 |         .clone()\n   94 |         .try_into()\n   95 |         .unwrap_or_else(|_| panic!(\"invalid permission identifier '{permission}'\")),\n   96 |     ));\n   97 |     self\n   98 |   }","lines":9,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/ipc/capability_builder.rs#L90-L98"},{"ref":"crates/tauri/src/ipc/capability_builder.rs:107-111","code":"  107 |     let permission = permission.into();\n  108 |     let identifier = permission\n  109 |       .clone()\n  110 |       .try_into()\n  111 |       .unwrap_or_else(|_| panic!(\"invalid permission identifier '{permission}'\"));","lines":5,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/ipc/capability_builder.rs#L107-L111"}]},
{"id":"LOGIC_90","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `channel.rs`, the `on_drop` callback for a `JavaScriptChannelId`-created channel sends an `{ end: true, index: current_index }` message to notify the frontend that the channel is closed (lines 186-192). However the `current_index` loaded in the drop closure is the value *at drop time* via `Ordering::Relaxed`. If the drop races with an in-flight `on_message` call that has already incremented the counter but not yet delivered the message, the frontend may receive the `end` signal before some messages, causing missed events.","fix":"Use `Ordering::Acquire` on the load and `Ordering::Release` on message sends, or use a synchronization barrier before sending the `end` message.","locations":[{"ref":"crates/tauri/src/ipc/channel.rs:186-193","code":"  186 |       Some(Box::new(move || {\n  187 |         let current_index = counter_clone.load(Ordering::Relaxed);\n  188 |         let _ = webview_clone.eval(format_raw_js(\n  189 |           callback_id,\n  190 |           format!(\"{{ end: true, index: {current_index} }}\"),\n  191 |         ));\n  192 |       })),\n  193 |     )","lines":8,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/ipc/channel.rs#L186-L193"}]},
{"id":"LOGIC_91","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `channel.rs`, the `fetch` command handler (lines 318-337) retrieves data from `ChannelDataIpcQueue` by parsing the `CHANNEL_ID_HEADER_NAME` header. However, there is no authentication or verification that the requesting webview is the same one that originally received the channel. Any webview in the application can request any channel data by guessing or observing a `data_id`, leaking IPC data across webview boundaries.","fix":"Store the originating webview label alongside the data in the queue and verify the requesting webview label matches before returning the data.","locations":[{"ref":"crates/tauri/src/ipc/channel.rs:318-337","code":"  318 | #[command(root = \"crate\")]\n  319 | fn fetch(\n  320 |   request: Request<'_>,\n  321 |   cache: State<'_, ChannelDataIpcQueue>,\n  322 | ) -> Result<Response, &'static str> {\n  323 |   if let Some(id) = request\n  324 |     .headers()\n  325 |     .get(CHANNEL_ID_HEADER_NAME)\n  326 |     .and_then(|v| v.to_str().ok())\n  327 |     .and_then(|id| id.parse().ok())\n  328 |   {\n  329 |     if let Some(data) = cache.0.lock().unwrap().remove(&id) {\n  330 |       Ok(Response::new(data))\n  331 |     } else {\n  332 |       Err(\"data not found\")\n  333 |     }\n  334 |   } else {\n  335 |     Err(\"missing channel id header\")\n  336 |   }\n  337 | }","lines":20,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/ipc/channel.rs#L318-L337"}]},
{"id":"LOGIC_92","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The MIN_JSON_PARSE_LEN threshold comment says it was set arbitrarily at 10 KiB and should be benchmarked. Applying JSON.parse to objects/arrays below this threshold is cheaper via direct JS evaluation, but the actual crossover point depends on the JS engine and input. The TODO has been present since the feature was added and represents a latent performance regression for callers with medium-sized JSON payloads.","fix":"Benchmark the crossover point across the supported JS engines (WebKit, Blink, Gecko) and set an evidence-based threshold, or expose it as a configurable option.","locations":[{"ref":"crates/tauri/src/ipc/format_callback.rs:21-23","code":"   21 | // TODO: this number should be benchmarked and checked for optimal range, I set 10 KiB arbitrarily\n   22 | // we don't want to lose the gained object parsing time to extra allocations preparing it\n   23 | const MIN_JSON_PARSE_LEN: usize = 10_240;","lines":3,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/ipc/format_callback.rs#L21-L23"}]},
{"id":"LOGIC_93","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In the qc_formatting quickcheck test, the assertion checks that the formatted callback contains either the JSON.parse form or the raw form of the value. However when a string is short (<10 KiB), format_raw generates the raw JSON representation. The test correctly handles both branches, but the assertion uses String::contains on the full output, which could yield a false positive if the callback_id or the JSON value happened to appear coincidentally inside a longer string.","fix":"Use assert!(fc == ... || fc == ...) with full equality instead of contains, so the test is unambiguous.","locations":[{"ref":"crates/tauri/src/ipc/format_callback.rs:232-244","code":"  232 |   fn qc_formatting(f: CallbackFn, a: String) -> bool {\n  233 |     // call format callback\n  234 |     let fc = format(f, &a).unwrap();\n  235 |     fc.contains(&format!(\n  236 |       \"window.__TAURI_INTERNALS__.runCallback({}, JSON.parse('{}'))\",\n  237 |       f.0,\n  238 |       serde_json::Value::String(a.clone()),\n  239 |     )) || fc.contains(&format!(\n  240 |       r#\"window.__TAURI_INTERNALS__.runCallback({}, {})\"#,\n  241 |       f.0,\n  242 |       serde_json::Value::String(a),\n  243 |     ))\n  244 |   }","lines":13,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/ipc/format_callback.rs#L232-L244"}]},
{"id":"LOGIC_94","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"Android PathResolver: `app_config_dir()` resolves to `getConfigDir` which returns the raw config directory, but its docstring claims it resolves to `config_dir/${bundle_identifier}`. The desktop implementation appends the bundle identifier but the Android one does not, creating a platform inconsistency.","fix":"Either let the Android Kotlin side append the bundle identifier (as the desktop side does), or append it in Rust: `self.call_resolve(\"getConfigDir\").map(|dir| dir.join(bundle_id))`.","locations":[{"ref":"crates/tauri/src/path/android.rs:139-141","code":"  139 |   pub fn app_config_dir(&self) -> Result<PathBuf> {\n  140 |     self.call_resolve(\"getConfigDir\")\n  141 |   }","lines":3,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/path/android.rs#L139-L141"}]},
{"id":"LOGIC_95","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In the emit() method, emitting.store(false) is done while the event_listeners Mutex is still held (inside the block that locks listeners). If a listener callback calls listen() or unlisten() from the same thread (possible on single-threaded executors), the emitting flag is already cleared before the pending queue is drained, breaking the ordering guarantee and potentially causing duplicate delivery or missed unlisten.","fix":"Move the emitting.store(false) call to after the listeners lock is released, i.e. after the closing brace on line 332, before draining pending.","locations":[{"ref":"crates/tauri/src/scope/fs.rs:313-344","code":"  313 |   fn emit(&self, event: Event) {\n  314 |     let was_emitting = self.inner.emitting.swap(true, Ordering::Relaxed);\n  315 |     if was_emitting {\n  316 |       self\n  317 |         .inner\n  318 |         .pending\n  319 |         .lock()\n  320 |         .unwrap()\n  321 |         .push(Pending::Emit(event));\n  322 |       return;\n  323 |     }\n  324 | \n  325 |     {\n  326 |       let listeners = self.inner.event_listeners.lock().unwrap();\n  327 |       let handlers = listeners.values();\n  328 |       for listener in handlers {\n  329 |         listener(&event);\n  330 |       }\n  331 |       self.inner.emitting.store(false, Ordering::Relaxed);\n  332 |     }\n  333 | \n  334 |     let pending = {\n  335 |       let mut lock = self.inner.pending.lock().unwrap();\n  336 |       std::mem::take(&mut *lock)\n  337 |     };\n  338 |     for action in pending {\n  339 |       match action {\n  340 |         Pending::Unlisten(id) => self.unlisten(id),\n  341 |         Pending::Listen { id, handler } => self.listen_with_id(id, handler),\n  342 |         Pending::Emit(event) => self.emit(event),\n  343 |       }\n  344 |     }","lines":32,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/scope/fs.rs#L313-L344"}]},
{"id":"LOGIC_96","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"is_forbidden returns true when the path does not exist (canonicalize fails). The doc comment says 'May return true if the path points to a broken symlink', but the same happens for any non-existent path, which is a broader and surprising contract - any permission check on a non-existent path will report it as forbidden even if no forbidden pattern was ever set.","fix":"Distinguish the 'path does not exist' case from a genuine error and return false (not forbidden) when the path simply does not exist yet.","locations":[{"ref":"crates/tauri/src/scope/fs.rs:453-468","code":"  453 |   pub fn is_forbidden<P: AsRef<Path>>(&self, path: P) -> bool {\n  454 |     let path = try_resolve_symlink_and_canonicalize(path);\n  455 | \n  456 |     if let Ok(path) = path {\n  457 |       let path: PathBuf = path.components().collect();\n  458 |       self\n  459 |         .inner\n  460 |         .forbidden_patterns\n  461 |         .lock()\n  462 |         .unwrap()\n  463 |         .iter()\n  464 |         .any(|p| p.matches_path_with(&path, self.inner.match_options))\n  465 |     } else {\n  466 |       true\n  467 |     }\n  468 |   }","lines":16,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/scope/fs.rs#L453-L468"}]},
{"id":"LOGIC_97","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"tray/plugin.rs: the new command accepts both menu_on_left_click (deprecated) and show_menu_on_left_click. When both are supplied in the same JSON payload, both branches execute in sequence (lines 83-89), with show_menu_on_left_click applied last, silently overriding the deprecated field. There is no validation that the two fields are mutually exclusive, and no diagnostic for the caller. If a JS client accidentally supplies both with contradicting values the behavior is non-obvious.","fix":"Reject or warn when both fields are provided, or consolidate them into a single Option that prefers show_menu_on_left_click.","locations":[{"ref":"crates/tauri/src/tray/plugin.rs:83-89","code":"   83 |   #[allow(deprecated)]\n   84 |   if let Some(menu_on_left_click) = options.menu_on_left_click {\n   85 |     builder = builder.menu_on_left_click(menu_on_left_click);\n   86 |   }\n   87 |   if let Some(show_menu_on_left_click) = options.show_menu_on_left_click {\n   88 |     builder = builder.show_menu_on_left_click(show_menu_on_left_click);\n   89 |   }","lines":7,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/tray/plugin.rs#L83-L89"}]},
{"id":"LOGIC_98","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"vibrancy/mod.rs silently does nothing when effects are cleared on macOS (the else branch only calls clear_effects on Windows). If a macOS user calls set_window_effects(window, None), no action is taken and existing vibrancy is not cleared, contrary to the expected behavior.","fix":"Add a macOS clear_effects implementation or document explicitly that clearing effects is not supported on macOS.","locations":[{"ref":"crates/tauri/src/vibrancy/mod.rs:19-30","code":"   19 | ) -> crate::Result<()> {\n   20 |   if let Some(_effects) = effects {\n   21 |     #[cfg(windows)]\n   22 |     windows::apply_effects(window, _effects);\n   23 |     #[cfg(target_os = \"macos\")]\n   24 |     macos::apply_effects(window, _effects);\n   25 |   } else {\n   26 |     #[cfg(windows)]\n   27 |     windows::clear_effects(window);\n   28 |   }\n   29 |   Ok(())\n   30 | }","lines":12,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/vibrancy/mod.rs#L19-L30"}]},
{"id":"LOGIC_99","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"zoom-hotkey.js uses a floating-point accumulator (zoomLevel) for zoom level, which accumulates floating-point rounding errors over time. After 10 increments of +0.2 starting from 1.0, zoomLevel becomes approximately 2.9999999... instead of 3.0. This can cause the zoom level to oscillate around expected values and makes the '0' reset unreliable because the IPC call receives a slightly wrong value.","fix":"Track zoom as an integer step count (e.g. steps from 0), compute the float as Math.round(steps * 0.2 * 10) / 10, and clamp from integer bounds.","locations":[{"ref":"crates/tauri/src/webview/scripts/zoom-hotkey.js:7-43","code":"    7 | let zoomLevel = 1\n    8 | \n    9 | const MAX_ZOOM_LEVEL = 10\n   10 | const MIN_ZOOM_LEVEL = 0.2\n   11 | \n   12 | window.addEventListener('keydown', (event) => {\n   13 |   if (OS_NAME === 'macos' ? event.metaKey : event.ctrlKey) {\n   14 |     if (event.key === '-') {\n   15 |       zoomLevel -= 0.2\n   16 |     } else if (event.key === '=' || event.key === '+') {\n   17 |       zoomLevel += 0.2\n   18 |     } else if (event.key === '0') {\n   19 |       zoomLevel = 1\n   20 |     } else {\n   21 |       return\n   22 |     }\n   23 |     zoomLevel = Math.min(Math.max(zoomLevel, MIN_ZOOM_LEVEL), MAX_ZOOM_LEVEL)\n   24 |     window.__TAURI_INTERNALS__.invoke('plugin:webview|set_webview_zoom', {\n   25 |       value: zoomLevel\n   26 |     })\n   27 |   }\n   28 | })\n   29 | \n   30 | window.addEventListener('mousewheel', (event) => {\n   31 |   if (event.ctrlKey) {\n   32 |     event.preventDefault()\n   33 |     if (event.deltaY < 0) {\n   34 |       zoomLevel += 0.2\n   35 |     } else {\n   36 |       zoomLevel -= 0.2\n   37 |     }\n   38 |     zoomLevel = Math.min(Math.max(zoomLevel, MIN_ZOOM_LEVEL), MAX_ZOOM_LEVEL)\n   39 |     window.__TAURI_INTERNALS__.invoke('plugin:webview|set_webview_zoom', {\n   40 |       value: zoomLevel\n   41 |     })\n   42 |   }\n   43 | })","lines":37,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/webview/scripts/zoom-hotkey.js#L7-L43"}]},
{"id":"LOGIC_100","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"zoom-hotkey.js uses the non-standard 'mousewheel' event (deprecated, not in W3C spec), which is unsupported in Firefox. The standard replacement is 'wheel'.","fix":"Replace addEventListener('mousewheel', ...) with addEventListener('wheel', ...) and use event.deltaY for the delta (already used in the handler).","locations":[{"ref":"crates/tauri/src/webview/scripts/zoom-hotkey.js:30","code":"   30 | window.addEventListener('mousewheel', (event) => {","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/webview/scripts/zoom-hotkey.js#L30"}]},
{"id":"LOGIC_101","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `drag.js`, `isDragRegion` checks `isClickableElement(el) && attr === null` to block drag, but `isClickableElement` tests `el.getAttribute('tabindex') !== '-1'`. An element with `tabindex=\"0\"` (focusable but not interactive) will therefore block dragging even without any drag region annotation, which is likely unintended for plain focusable containers.","fix":"Consider restricting the `tabindex` check to values that explicitly mark an element as a UI control (e.g. restrict to `tabindex` >= 0 only when combined with an ARIA role, or remove the `tabindex` clause from `isClickableElement` entirely).","locations":[{"ref":"crates/tauri/src/window/scripts/drag.js:32-39","code":"   32 |   function isClickableElement(el) {\n   33 |     return (\n   34 |       CLICKABLE_TAGS.has(el.tagName)\n   35 |       || (el.hasAttribute('contenteditable')\n   36 |         && el.getAttribute('contenteditable') !== 'false')\n   37 |       || (el.hasAttribute('tabindex') && el.getAttribute('tabindex') !== '-1')\n   38 |       || INTERACTIVE_ROLES.has(el.getAttribute('role'))\n   39 |     )","lines":8,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/window/scripts/drag.js#L32-L39"}]},
{"id":"LOGIC_102","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `drag.js` the macOS double-click-to-maximize path on `mouseup` compares `e.clientX === initialX && e.clientY === initialY` using strict equality on floating-point coordinates. Sub-pixel pointer movement between `mousedown` and `mouseup` (common with touchpads) will silently suppress the maximize action even when the user clearly intended a double-click.","fix":"Allow a small tolerance (e.g. `Math.abs(e.clientX - initialX) <= 2 && Math.abs(e.clientY - initialY) <= 2`) instead of exact equality.","locations":[{"ref":"crates/tauri/src/window/scripts/drag.js:117-120","code":"  117 |         // and the cursor hasn't moved from initial mousedown\n  118 |         && e.clientX === initialX\n  119 |         && e.clientY === initialY\n  120 |         // and the event path contains a drag region (with no clickable element in between)","lines":4,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/window/scripts/drag.js#L117-L120"}]},
{"id":"LOGIC_103","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In the file-associations example, when constructing the JS initialization script, only backslashes are escaped. A file path containing a double-quote character (which is valid on Linux and macOS) would break out of the JS string literal and allow injection of arbitrary JavaScript into the initialization script.","fix":"Also escape double-quote characters: `.replace('\"', \"\\\\\\\"\")` before wrapping the path in quotes, or use a proper JSON serialization (e.g. via `serde_json::to_string`).","locations":[{"ref":"examples/file-associations/src-tauri/src/main.rs:35-45","code":"   35 |   let files = files\n   36 |     .into_iter()\n   37 |     .map(|f| {\n   38 |       let file = f.to_string_lossy().replace('\\\\', \"\\\\\\\\\"); // escape backslash\n   39 |       format!(\"\\\"{file}\\\"\",) // wrap in quotes for JS array\n   40 |     })\n   41 |     .collect::<Vec<_>>()\n   42 |     .join(\",\");\n   43 | \n   44 |   tauri::WebviewWindowBuilder::new(&app, \"main\", Default::default())\n   45 |     .initialization_script(format!(\"window.openedFiles = [{files}]\"))","lines":11,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/examples/file-associations/src-tauri/src/main.rs#L35-L45"}]},
{"id":"LOGIC_104","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `packages/api/src/event.ts`, the `_unlisten` function calls `window.__TAURI_EVENT_PLUGIN_INTERNALS__.unregisterListener(event, eventId)` synchronously and then awaits the IPC `plugin:event|unlisten` call. If the IPC call fails, the local listener is already unregistered, leaving the backend and frontend in inconsistent state. The reverse order (await IPC first, then unregister locally) would be safer.","fix":"Await the `invoke('plugin:event|unlisten', ...)` call before calling `unregisterListener`, or tolerate partial failure by catching the IPC error.","locations":[{"ref":"packages/api/src/event.ts:85-91","code":"   85 | async function _unlisten(event: string, eventId: number): Promise<void> {\n   86 |   window.__TAURI_EVENT_PLUGIN_INTERNALS__.unregisterListener(event, eventId)\n   87 |   await invoke('plugin:event|unlisten', {\n   88 |     event,\n   89 |     eventId\n   90 |   })\n   91 | }","lines":7,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/packages/api/src/event.ts#L85-L91"}]},
