{"id":"PANIC_76","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"handle_user_message() explicitly panics for Message::RequestExit, Message::Window(Close) and Message::Window(Destroy) when reached from the main-thread fast-path in send_user_message(). A caller that invokes close()/destroy() directly from the main thread (which is possible through run_on_main_thread) will trigger a panic rather than a graceful error.","fix":"Return early with a log::error! or, better, route these messages to the event-loop path unconditionally regardless of the calling thread.","locations":[{"ref":"crates/tauri-runtime-wry/src/lib.rs:3190","code":" 3190 |     Message::RequestExit(_code) => panic!(\"cannot handle RequestExit on the main thread\"),","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-runtime-wry/src/lib.rs#L3190"},{"ref":"crates/tauri-runtime-wry/src/lib.rs:3362-3367","code":" 3362 |           WindowMessage::Close => {\n 3363 |             panic!(\"cannot handle `WindowMessage::Close` on the main thread\")\n 3364 |           }\n 3365 |           WindowMessage::Destroy => {\n 3366 |             panic!(\"cannot handle `WindowMessage::Destroy` on the main thread\")\n 3367 |           }","lines":6,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-runtime-wry/src/lib.rs#L3362-L3367"}]},
{"id":"PANIC_77","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"WindowMessage::GtkBox handler calls window.default_vbox().unwrap(). Same issue as above: if the underlying GTK vbox is absent this panics on the main thread, crashing the whole app.","fix":"Send an error through the channel on None: `match window.default_vbox() { Some(b) => tx.send(GtkBox(b.clone())).unwrap(), None => { /* send error or log */ } }`","locations":[{"ref":"crates/tauri-runtime-wry/src/lib.rs:3312","code":" 3312 |             .send(GtkBox(window.default_vbox().unwrap().clone()))","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-runtime-wry/src/lib.rs#L3312"}]},
{"id":"PANIC_78","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"The drag-drop handler closure contains `_ => unimplemented!()` for unrecognised WryDragDropEvent variants. If a new variant is added to wry, the event loop thread will panic when the user drags a file onto the window.","fix":"Change to `_ => return` or `_ => { log::warn!(\"unhandled drag-drop event\"); return; }` to avoid panicking in an event handler.","locations":[{"ref":"crates/tauri-runtime-wry/src/lib.rs:4749","code":" 4749 |         _ => unimplemented!(),","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-runtime-wry/src/lib.rs#L4749"}]},
{"id":"PANIC_79","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"In the new_window_handler closure (desktop path), windows.borrow().get(&window_id).unwrap() and .webviews.first().unwrap() are chained unwraps with no error handling. If the window_id supplied by the JS new-window request no longer exists or has no webview, the main event loop thread panics.","fix":"Use `?` or match to propagate the error; return `wry::NewWindowResponse::Deny` when the window/webview is unavailable.","locations":[{"ref":"crates/tauri-runtime-wry/src/lib.rs:4799-4806","code":" 4799 |           let webview = windows\n 4800 |             .borrow()\n 4801 |             .get(&window_id)\n 4802 |             .unwrap()\n 4803 |             .webviews\n 4804 |             .first()\n 4805 |             .unwrap()\n 4806 |             .clone();","lines":8,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-runtime-wry/src/lib.rs#L4799-L4806"}]},
{"id":"PANIC_80","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In create_webview(), `window.default_vbox().unwrap()` is called on Linux for both WebviewKind::WindowChild and WebviewKind::WindowContent paths. default_vbox() returns Option<GtkBox>, so if the GTK vbox is not present (which can happen with raw/custom windows created via Message::CreateRawWindow) this panics.","fix":"Propagate the Option as an error: `let vbox = window.default_vbox().ok_or(Error::CreateWebview(...))?;`","locations":[{"ref":"crates/tauri-runtime-wry/src/lib.rs:5137","code":" 5137 |         let vbox = window.default_vbox().unwrap();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-runtime-wry/src/lib.rs#L5137"},{"ref":"crates/tauri-runtime-wry/src/lib.rs:5137","code":" 5137 |         let vbox = window.default_vbox().unwrap();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-runtime-wry/src/lib.rs#L5137"}]},
{"id":"PANIC_81","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`define_permissions` calls `p.parent().unwrap().file_name().unwrap()` to filter schema directories. Same root-path panic risk as in `parse_capabilities` above.","fix":"Same fix as above: use `and_then` chain.","locations":[{"ref":"crates/tauri-utils/src/acl/build.rs:88","code":"   88 |     .filter(|p| p.parent().unwrap().file_name().unwrap() != PERMISSION_SCHEMAS_FOLDER_NAME)","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/acl/build.rs#L88"}]},
{"id":"PANIC_82","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`parse_capabilities` calls `p.parent().unwrap().file_name().unwrap()` for every globbed path. If a path has no parent (e.g. a bare filename) or the parent has no file name (e.g. the root `/`), this panics. While unusual in practice, glob patterns that resolve to root-level files would trigger this.","fix":"Replace with `p.parent().and_then(|p| p.file_name()).map_or(false, |n| n != CAPABILITIES_SCHEMA_FOLDER_NAME)`.","locations":[{"ref":"crates/tauri-utils/src/acl/build.rs:217","code":"  217 |     .filter(|p| p.parent().unwrap().file_name().unwrap() != CAPABILITIES_SCHEMA_FOLDER_NAME)","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/acl/build.rs#L217"}]},
{"id":"PANIC_83","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`autogenerate_command_permissions` calls `env::current_dir().unwrap()` and `path.strip_prefix(&cwd).unwrap_or(path).components().count()`, and then immediately calls `write_if_changed(...).unwrap_or_else(|_| panic!(...))` for every generated file. Two separate panic paths: (1) `current_dir()` failure is unrecoverable (unlikely but possible in sandboxed CI) and (2) `write_if_changed` failure converts the I/O error into a panic, discarding the error message entirely.","fix":"Return `Result<AutogeneratedPermissions, Error>` from this function and propagate errors instead of panicking. For the `current_dir` unwrap, fall back to an empty path instead.","locations":[{"ref":"crates/tauri-utils/src/acl/build.rs:266-309","code":"  266 |     let cwd = env::current_dir().unwrap();\n  267 |     let components_len = path.strip_prefix(&cwd).unwrap_or(path).components().count();\n  268 |     let schema_path = (1..components_len)\n  269 |       .map(|_| \"..\")\n  270 |       .collect::<PathBuf>()\n  271 |       .join(PERMISSION_SCHEMAS_FOLDER_NAME)\n  272 |       .join(PERMISSION_SCHEMA_FILE_NAME);\n  273 |     format!(\n  274 |       \"\\n\\\"$schema\\\" = \\\"{}\\\"\\n\",\n  275 |       dunce::simplified(&schema_path)\n  276 |         .display()\n  277 |         .to_string()\n  278 |         .replace('\\\\', \"/\")\n  279 |     )\n  280 |   } else {\n  281 |     \"\".to_string()\n  282 |   };\n  283 | \n  284 |   let mut autogenerated = AutogeneratedPermissions {\n  285 |     allowed: Vec::new(),\n  286 |     denied: Vec::new(),\n  287 |   };\n  288 | \n  289 |   for command in commands {\n  290 |     let slugified_command = command.replace('_', \"-\");\n  291 | \n  292 |     let toml = format!(\n  293 |       r###\"{license_header}# Automatically generated - DO NOT EDIT!\n  294 | {schema_entry}\n  295 | [[permission]]\n  296 | identifier = \"allow-{slugified_command}\"\n  297 | description = \"Enables the {command} command without any pre-configured scope.\"\n  298 | commands.allow = [\"{command}\"]\n  299 | \n  300 | [[permission]]\n  301 | identifier = \"deny-{slugified_command}\"\n  302 | description = \"Denies the {command} command without any pre-configured scope.\"\n  303 | commands.deny = [\"{command}\"]\n  304 | \"###,\n  305 |     );\n  306 | \n  307 |     let out_path = path.join(format!(\"{command}.toml\"));\n  308 |     write_if_changed(&out_path, toml)\n  309 |       .unwrap_or_else(|_| panic!(\"unable to autogenerate {out_path:?}\"));","lines":44,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/acl/build.rs#L266-L309"}]},
{"id":"PANIC_84","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In `CapabilityFile::load`, `path.extension().unwrap()` panics if the file has no extension. The callers in `parse_capabilities` guard by extension, but `get_capabilities` calls `CapabilityFile::load` directly from `additional_capability_files` paths with no extension check.","fix":"Return `Err(super::Error::UnknownCapabilityFormat(...))` for the None case rather than unwrapping.","locations":[{"ref":"crates/tauri-utils/src/acl/capability.rs:273","code":"  273 |     let ext = path.extension().unwrap().to_string_lossy().to_string();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/acl/capability.rs#L273"},{"ref":"crates/tauri-utils/src/acl/mod.rs:380","code":"  380 |       let capability = CapabilityFile::load(path)","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/acl/mod.rs#L380"}]},
{"id":"PANIC_85","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`get_permission_set_permissions` calls `Identifier::try_from(perm.clone()).expect(\"invalid identifier in permission set?\")` for every permission string stored inside a permission set. These strings come from user-authored permission files, so a malformed identifier panics at runtime instead of returning a proper error.","fix":"Propagate the `ParseIdentifierError` via `?`. The function already returns `Result`, so `map_err` is sufficient.","locations":[{"ref":"crates/tauri-utils/src/acl/resolved.rs:434","code":"  434 |     let id = Identifier::try_from(perm.clone()).expect(\"invalid identifier in permission set?\");","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/acl/resolved.rs#L434"}]},
{"id":"PANIC_86","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`extend_permission_entry_schema` calls `any_of.last_mut().unwrap()` and then destructures the result with an `unreachable!()` on an unexpected variant. While the schema is generated by `schemars` and unlikely to change unexpectedly, the comment `unreachable!(\"PermissionsEntry should be an object not a boolean\")` indicates this is a silent assumption. Any future change to `PermissionEntry`'s schemars output would cause a silent misbehaviour or panic.","fix":"Return a descriptive error from `generate_capability_schema` if the schema structure is unexpected, rather than using `unwrap` and `unreachable!`.","locations":[{"ref":"crates/tauri-utils/src/acl/schema.rs:252-253","code":"  252 |     let any_of = obj.subschemas().any_of.as_mut().unwrap();\n  253 |     let Schema::Object(extend_permission_entry) = any_of.last_mut().unwrap() else {","lines":2,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/acl/schema.rs#L252-L253"}]},
{"id":"PANIC_87","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`extend_permission_entry_schema` calls `manifest.global_scope_schema().unwrap_or_else(|e| panic!(...))` for every plugin manifest. An invalid scope schema in any plugin causes a panic instead of a reported error, terminating the build.","fix":"Return `Result` from `generate_capability_schema` and propagate the error from `global_scope_schema()` instead of panicking.","locations":[{"ref":"crates/tauri-utils/src/acl/schema.rs:269","code":"  269 |         .unwrap_or_else(|e| panic!(\"invalid JSON schema for plugin {name}: {e}\"))","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/acl/schema.rs#L269"}]},
{"id":"PANIC_88","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"Unconditional unwrap on serde_json::Number::from_f64 in the From<Value> for serde_json::Value conversion. from_f64 returns None for NaN and infinite floats, so any ACL value holding NaN/Inf will panic at runtime during the JSON conversion.","fix":"Replace .unwrap() with a fallback, e.g.: serde_json::Number::from_f64(f).unwrap_or_else(|| serde_json::Number::from(0)). Alternatively, return serde_json::Value::Null for non-finite floats, or reject them earlier in the From<f64> for Number constructor.","locations":[{"ref":"crates/tauri-utils/src/acl/value.rs:69","code":"   69 |         serde_json::Value::Number(serde_json::Number::from_f64(f).unwrap())","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/acl/value.rs#L69"}]},
{"id":"PANIC_89","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"does_supported_file_name_exist calls path.file_name().unwrap() without checking if the path has a file name component. Paths that end with '..' or '/' will return None from file_name(), causing a panic.","fix":"Use `let Some(source_file_name) = path.file_name() else { return false; };` instead of `.unwrap()`.","locations":[{"ref":"crates/tauri-utils/src/config/parse.rs:212","code":"  212 |   let source_file_name = path.file_name().unwrap();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/config/parse.rs#L212"}]},
{"id":"PANIC_90","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"serialize_node() calls unwrap() on the result of serialize_node_ref_internal(). Although the internal serializer writes to a Vec<u8> (which is infallible), any future change to the serializer could make this propagate silently as a panic in production code.","fix":"Propagate the error instead: change the function signature to return crate::Result<Vec<u8>> and use `?` instead of `.unwrap()`.","locations":[{"ref":"crates/tauri-utils/src/html.rs:109","code":"  109 |   serialize_node_ref_internal(node, &mut ser, TraversalScope::IncludeNode).unwrap();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/html.rs#L109"}]},
{"id":"PANIC_91","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"plugin.rs build functions use multiple unconditional expect()/panic!() calls inside what is conceptually library code (build scripts). If canonicalize fails, or serde_json serialization fails, or file I/O fails, the entire build panics with no structured error.","fix":"Return Result<(), Box<dyn std::error::Error>> from the public functions and replace expect/panic with `?` propagation.","locations":[{"ref":"crates/tauri-utils/src/plugin.rs:27","code":"   27 |         .expect(\"failed to canonicalize global API script path\")","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/plugin.rs#L27"},{"ref":"crates/tauri-utils/src/plugin.rs:57-59","code":"   57 |       serde_json::to_string(&scripts).expect(\"failed to serialize global API script paths\"),\n   58 |     )\n   59 |     .expect(\"failed to write global API script\");","lines":3,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/plugin.rs#L57-L59"},{"ref":"crates/tauri-utils/src/plugin.rs:70","code":"   70 |       .expect(\"failed to read plugin global API script paths\");","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/plugin.rs#L70"},{"ref":"crates/tauri-utils/src/plugin.rs:72","code":"   72 |       .expect(\"failed to parse plugin global API script paths\");","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/plugin.rs#L72"},{"ref":"crates/tauri-utils/src/plugin.rs:78-82","code":"   78 |           fs::read_to_string(&p).unwrap_or_else(|e| {\n   79 |             panic!(\n   80 |               \"failed to read plugin global API script {}: {e}\",\n   81 |               p.display()\n   82 |             )","lines":5,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/plugin.rs#L78-L82"}]},
{"id":"PANIC_92","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"Unconditional unwrap on `self.current_iter` inside `next_current_iter`. The method is only called from `Iterator::next` when `self.current_iter.is_some()` and from recursive skip-directory calls, but the `?` early-return on `current_iter.next()` does NOT clear `self.current_iter`. Subsequent re-entry via the outer `Iterator::next` guard would still be fine, but any direct call from a future refactor (or the recursive call on line 179 when the inner iterator is concurrently drained) reaches the `unwrap()` without the outer guard protecting it.","fix":"Replace `.unwrap()` with a guard: `let current_iter = self.current_iter.as_mut()?;` and propagate `None` instead of panicking.","locations":[{"ref":"crates/tauri-utils/src/resources.rs:189","code":"  189 |     let current_iter = self.current_iter.as_mut().unwrap();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/resources.rs#L189"}]},
{"id":"PANIC_93","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`path.file_name().unwrap()` inside `resource_from_path`. When a glob pattern matches a path that ends with `/` (e.g. a path that resolved to a bare root or a path whose last component is `.`), `file_name()` returns `None`, causing an unconditional panic at runtime. Glob patterns that match directories already pass the `is_dir` skip check, but paths normalised by `normalize()` could still produce a name-less tail on certain OS path forms.","fix":"Return `Err(crate::Error::ResourcePathNotFound(path))` or a descriptive error when `file_name()` is `None` instead of calling `.unwrap()`.","locations":[{"ref":"crates/tauri-utils/src/resources.rs:227","code":"  227 |             ResourcePathsInnerIter::Glob { .. } => dest.join(path.file_name().unwrap()),","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/resources.rs#L227"}]},
{"id":"PANIC_94","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`default_runtime` in `async_runtime.rs` calls `TokioRuntime::new().unwrap()` (line 223). If the OS refuses to create threads (e.g. resource limit reached), this panics with no useful diagnostic. This function is called lazily the first time any async API is used.","fix":"Use `.expect(\"failed to create Tokio runtime\")` at minimum; ideally make `default_runtime` fallible and propagate the error.","locations":[{"ref":"crates/tauri/src/async_runtime.rs:223","code":"  223 |   let runtime = Runtime::Tokio(TokioRuntime::new().unwrap());","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/async_runtime.rs#L223"}]},
{"id":"PANIC_95","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`ScopeManager::get_command_scope_typed` calls `self.command_cache.get(key).unwrap()` at line 780. If the scope cache does not contain the expected key (e.g. after a race where `add_capability_inner` inserts a scope but skips its cache entry), the thread panics. This is on a hot IPC path.","fix":"Return an `Err(crate::Error::BadResourceId(...))` or a suitable error rather than unwrapping; alternatively, use `ok_or_else` to convert the `None` to an error.","locations":[{"ref":"crates/tauri/src/ipc/authority.rs:778","code":"  778 |     let cache = self.command_cache.get(key).unwrap();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/ipc/authority.rs#L778"}]},
{"id":"PANIC_96","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`ScopeManager::get_command_scope_typed` also calls `unwrap_or_else(|| panic!(\"missing command scope for key {key}\"))` at line 787. The panic message leaks an internal `ScopeKey` value. More importantly this is a runtime panic on the IPC dispatch path triggered by data that can mismatch after `add_capability_inner` partially updates the scope.","fix":"Replace with a graceful error return instead of a panic.","locations":[{"ref":"crates/tauri/src/ipc/authority.rs:785","code":"  785 |           .unwrap_or_else(|| panic!(\"missing command scope for key {key}\"));","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/ipc/authority.rs#L785"}]},
{"id":"PANIC_97","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"InvokeBody::Json serialization in From<InvokeBody> for InvokeResponseBody uses unwrap(). serde_json::to_string of a serde_json::Value should never fail, but this is still a latent panic if the value contains non-serializable types such as raw numbers out of f64 range; it also makes the code unnecessarily fragile.","fix":"Use serde_json::to_string(&v).unwrap_or_else(|_| \"null\".to_owned()) or, better, change the conversion to return a Result.","locations":[{"ref":"crates/tauri/src/ipc/mod.rs:121","code":"  121 |       InvokeBody::Json(v) => Self::Json(serde_json::to_string(&v).unwrap()),","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/ipc/mod.rs#L121"}]},
{"id":"PANIC_98","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"return_result in InvokeResolver calls .expect(\"resolver consumed\") on the Option inside the Mutex, turning a logical double-response into a panic instead of a graceable error. If any code path accidentally calls respond/resolve/reject twice on the same resolver, the whole thread panics.","fix":"Return an error or log a warning instead of panicking when the responder has already been taken. Use Option::take and match on None.","locations":[{"ref":"crates/tauri/src/ipc/mod.rs:485","code":"  485 |     (responder.lock().unwrap().take().expect(\"resolver consumed\"))(","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/ipc/mod.rs#L485"}]},
{"id":"PANIC_99","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"Two _ => unimplemented!() arms exist in on_webview_event and prepare_webview. DragDropEvent is non-exhaustive from the perspective of the runtime crate; new variants added there will reach these arms at runtime and panic instead of being silently ignored or logged.","fix":"Replace unimplemented!() with a log::warn! or just a no-op comment, since these branches handle future unknown events. The same applies to the wildcard in on_window_event.","locations":[{"ref":"crates/tauri/src/manager/webview.rs:500","code":"  500 |       _ => unimplemented!(),","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/manager/webview.rs#L500"},{"ref":"crates/tauri/src/manager/webview.rs:763","code":"  763 |       _ => unimplemented!(),","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/manager/webview.rs#L763"}]},
{"id":"PANIC_100","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"_ => unimplemented!() in on_window_event's DragDropEvent match will panic on any DragDropEvent variant that is not explicitly handled (Enter, Over, Drop, Leave). Adding a new variant to the runtime crate without updating this match causes a runtime panic.","fix":"Replace with _ => {} or log::warn!(\"unhandled DragDropEvent variant\").","locations":[{"ref":"crates/tauri/src/manager/window.rs:269","code":"  269 |       _ => unimplemented!(),","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/manager/window.rs#L269"}]},
{"id":"PANIC_101","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"Multiple `unwrap()` calls on mutex locks (`MenuChannels`, `PENDING_PLUGIN_CALLS`, `CHANNELS`) throughout the codebase. If a thread panics while holding one of these mutexes, all subsequent lock attempts will also panic (poisoned mutex).","fix":"Use `.unwrap_or_else(|e| e.into_inner())` (poison recovery) or propagate the error.","locations":[{"ref":"crates/tauri/src/menu/plugin.rs:168","code":"  168 |         .unwrap()","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/menu/plugin.rs#L168"},{"ref":"crates/tauri/src/menu/plugin.rs:224","code":"  224 |         .unwrap()","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/menu/plugin.rs#L224"},{"ref":"crates/tauri/src/menu/plugin.rs:263","code":"  263 |         .unwrap()","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/menu/plugin.rs#L263"},{"ref":"crates/tauri/src/menu/plugin.rs:463","code":"  463 |   channels.0.lock().unwrap().insert(id.clone(), handler);","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/menu/plugin.rs#L463"},{"ref":"crates/tauri/src/plugin/mobile.rs:103","code":"  103 |     .lock()","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/plugin/mobile.rs#L103"}]},
{"id":"PANIC_102","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`options.predefined_item.unwrap()` in `new` command (menu plugin) panics when `ItemKind::Predefined` is requested but no `predefined_item` field was supplied in `NewOptions`. The error is propagated to the JS caller as a panic rather than a structured error.","fix":"Replace `.unwrap()` with `.ok_or_else(|| crate::Error::from(anyhow::anyhow!(\"predefined_item is required for Predefined kind\")))?`.","locations":[{"ref":"crates/tauri/src/menu/plugin.rs:421","code":"  421 |         item: options.predefined_item.unwrap(),","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/menu/plugin.rs#L421"}]},
{"id":"PANIC_103","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`rx.recv().unwrap()` in `run_mobile_plugin` and `register_android_plugin` will panic if the sender is dropped before sending (e.g. if the Android context thread terminates unexpectedly). This leaves the calling thread in a permanent hang-then-panic state.","fix":"Map the `RecvError` to `PluginInvokeError::UnreachableWebview` and return `Err(...)` instead of panicking.","locations":[{"ref":"crates/tauri/src/plugin/mobile.rs:281","code":"  281 |     rx.recv().unwrap()?;","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/plugin/mobile.rs#L281"},{"ref":"crates/tauri/src/plugin/mobile.rs:340","code":"  340 |     let response = rx.recv().unwrap();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/plugin/mobile.rs#L340"}]},
{"id":"PANIC_104","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"Scope::Debug impl calls .unwrap() on both Mutex locks. If either Mutex is poisoned the debug formatter panics, which can crash the process during logging/formatting.","fix":"Use .lock().unwrap_or_else(|e| e.into_inner()) or map to a placeholder string on poison.","locations":[{"ref":"crates/tauri/src/scope/fs.rs:71-88","code":"   71 |           .lock()\n   72 |           .unwrap()\n   73 |           .iter()\n   74 |           .map(|p| p.as_str())\n   75 |           .collect::<Vec<&str>>(),\n   76 |       )\n   77 |       .field(\n   78 |         \"forbidden_patterns\",\n   79 |         &self\n   80 |           .inner\n   81 |           .forbidden_patterns\n   82 |           .lock()\n   83 |           .unwrap()\n   84 |           .iter()\n   85 |           .map(|p| p.as_str())\n   86 |           .collect::<Vec<&str>>(),\n   87 |       )\n   88 |       .finish()","lines":18,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/scope/fs.rs#L71-L88"}]},
{"id":"PANIC_105","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In `WindowBuilder::with_webview`, `window.webviews().first().unwrap()` will panic if the window was somehow created without any attached webview. Although the previous `build_internal` call should guarantee one exists, the invariant is implicit and the unwrap gives no diagnostic context.","fix":"Replace with `.ok_or_else(|| crate::Error::WebviewNotFound)?.clone()` and propagate the error through the `Result` return type.","locations":[{"ref":"crates/tauri/src/window/mod.rs:346","code":"  346 |     let webview = window.webviews().first().unwrap().clone();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/window/mod.rs#L346"}]},
{"id":"PANIC_106","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`Window::add_child` calls `tx.send(res).unwrap()` inside the `run_on_main_thread` closure and `rx.recv().unwrap()` on the calling thread. If `run_on_main_thread` panics or the runtime drops the closure without executing it, the channel send never happens and `recv()` either blocks forever or panics on disconnect.","fix":"Use `rx.recv().map_err(|_| crate::Error::FailedToReceiveMessage)?` and handle the `send` failure gracefully inside the closure (e.g. `let _ = tx.send(res)`).","locations":[{"ref":"crates/tauri/src/window/mod.rs:1156-1158","code":" 1156 |       tx.send(res).unwrap();\n 1157 |     })?;\n 1158 |     rx.recv().unwrap()","lines":3,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/window/mod.rs#L1156-L1158"}]},
{"id":"PANIC_107","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`Window::listen` and `Window::once` call `EventName::new(...).unwrap()`, panicking at runtime if the caller passes an invalid event name string. The same pattern exists in `WebviewWindow`'s `Listener` implementation.","fix":"The `Listener` trait returns `EventId` with no error channel; add a debug assertion or validate in a helper that emits a clear error message, or change the trait signature to return `Option<EventId>`.","locations":[{"ref":"crates/tauri/src/window/mod.rs:2370","code":" 2370 |     let event = EventName::new(event.into()).unwrap();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/window/mod.rs#L2370"},{"ref":"crates/tauri/src/window/mod.rs:2370","code":" 2370 |     let event = EventName::new(event.into()).unwrap();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/window/mod.rs#L2370"},{"ref":"crates/tauri/src/webview/webview_window.rs:2731","code":" 2731 |     let event = EventName::new(event.into()).unwrap();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/webview/webview_window.rs#L2731"},{"ref":"crates/tauri/src/webview/webview_window.rs:2731","code":" 2731 |     let event = EventName::new(event.into()).unwrap();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/webview/webview_window.rs#L2731"}]},
{"id":"PANIC_108","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In the resources example's `setup` closure, both `app.path().resolve(...)` and `std::fs::read_to_string(...)` are called with `.unwrap()`. Any misconfigured resource path or missing file will crash the application on startup instead of returning a setup error.","fix":"Replace `.unwrap()` with `?` so errors propagate as a setup failure and display a meaningful message.","locations":[{"ref":"examples/resources/src-tauri/src/main.rs:17-22","code":"   17 |       let path = app\n   18 |         .path()\n   19 |         .resolve(\"assets/index.js\", tauri::path::BaseDirectory::Resource)\n   20 |         .unwrap();\n   21 | \n   22 |       let content = std::fs::read_to_string(&path).unwrap();","lines":6,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/examples/resources/src-tauri/src/main.rs#L17-L22"}]},
{"id":"PANIC_109","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In the splashscreen example, `close_splashscreen` calls `.unwrap()` on both `get_webview_window(\"splashscreen\")` and `get_webview_window(\"main\")`. If either window is missing (e.g. the command is invoked more than once, or the window names in `tauri.conf.json` differ), the app will panic.","fix":"Use `if let Some(w) = app.get_webview_window(...)` and return an error or no-op if the window is not found.","locations":[{"ref":"examples/splashscreen/main.rs:10-18","code":"   10 | fn close_splashscreen(app: AppHandle) {\n   11 |   // Close splashscreen\n   12 |   app\n   13 |     .get_webview_window(\"splashscreen\")\n   14 |     .unwrap()\n   15 |     .close()\n   16 |     .unwrap();\n   17 |   // Show main window\n   18 |   app.get_webview_window(\"main\").unwrap().show().unwrap();","lines":9,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/examples/splashscreen/main.rs#L10-L18"}]},
{"id":"PANIC_110","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In acl.rs, write_if_changed().unwrap_or_else(|_| panic!(\"unable to autogenerate {default_permission_path:?}\")) is a redundant double-panic pattern. The unwrap_or_else catches an error only to panic immediately, losing the original error message.","fix":"Use the ? operator to propagate the error: write_if_changed(...)?.","locations":[{"ref":"crates/tauri-build/src/acl.rs:206","code":"  206 |           .unwrap_or_else(|_| panic!(\"unable to autogenerate {default_permission_path:?}\"));","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-build/src/acl.rs#L206"}]},
{"id":"PANIC_111","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"copy_dir in fs_utils.rs calls to.parent().expect(\"No data in parent\"). Same issue as copy_file.","fix":"Same fix as copy_file: use ok_or_else and ?.","locations":[{"ref":"crates/tauri-bundler/src/utils/fs_utils.rs:114","code":"  114 |   let parent = to.parent().expect(\"No data in parent\");","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-bundler/src/utils/fs_utils.rs#L114"}]},
{"id":"PANIC_112","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"capability/new.rs line 97 calls .unwrap_or_else(|_| panic!(\"invalid permission {p}\")) when converting a permission string into a PermissionEntry. This is triggered by user-supplied input from the CLI, where a proper error message should be returned instead.","fix":"Use .map_err(|_| crate::Error::...(format!(\"invalid permission {p}\")))? inside a collect::<Result<Vec<_>>>() instead of panicking.","locations":[{"ref":"crates/tauri-cli/src/acl/capability/new.rs:96-98","code":"   96 |             .try_into()\n   97 |             .unwrap_or_else(|_| panic!(\"invalid permission {p}\")),\n   98 |         )","lines":3,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/acl/capability/new.rs#L96-L98"}]},
{"id":"PANIC_113","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In build.rs, web_asset_path.file_name().unwrap() is called after checking that the path exists but without verifying it has a file name component (i.e. it is not \"/\" or ends with \"..\").","fix":"Use .and_then(|n| Some(p.join(n))) and handle the None case by falling through to the current_dir fallback.","locations":[{"ref":"crates/tauri-cli/src/build.rs:217","code":"  217 |         .map(|p| p.join(web_asset_path.file_name().unwrap()))","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/build.rs#L217"}]},
{"id":"PANIC_114","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"p.parent().unwrap().to_path_buf() in resolve_tauri_dir() and p.parent().unwrap().to_path_buf() in resolve_frontend_dir() unconditionally unwrap parent, which panics if a lookup result is a root path (extremely unlikely but possible in adversarial environments).","fix":"Guard with .and_then(|p| p.parent()).map(...) and handle None gracefully.","locations":[{"ref":"crates/tauri-cli/src/helpers/app_paths.rs:125-126","code":"  125 |       p.parent().unwrap().to_path_buf()\n  126 |     }","lines":2,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/helpers/app_paths.rs#L125-L126"},{"ref":"crates/tauri-cli/src/helpers/app_paths.rs:166","code":"  166 |   .map(|p| p.parent().unwrap().to_path_buf())","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/helpers/app_paths.rs#L166"}]},
{"id":"PANIC_115","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"tauri.parent().unwrap().to_path_buf() is called without checking whether the path has a parent. If tauri_dir is a filesystem root (e.g. \"/\") this panics.","fix":"Use .unwrap_or_else(|| tauri.clone()) or return an error if the parent is absent.","locations":[{"ref":"crates/tauri-cli/src/helpers/app_paths.rs:141","code":"  141 |     resolve_frontend_dir().unwrap_or_else(|| tauri.parent().unwrap().to_path_buf())","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/helpers/app_paths.rs#L141"}]},
{"id":"PANIC_116","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"config_path.parent().unwrap() in helpers/config.rs is called without guarding against a root path, which would make parent() return None and panic.","fix":"Use .ok_or_else(|| Error::GenericError(\"config path has no parent\".into()))? to propagate as a proper error.","locations":[{"ref":"crates/tauri-cli/src/helpers/config.rs:209","code":"  209 |   set_current_dir(config_path.parent().unwrap()).context(\"failed to set current directory\")?;","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/helpers/config.rs#L209"}]},
{"id":"PANIC_117","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"FileLock::file() unconditionally unwraps self.f, but f is an Option. After drop (when f is taken out), calling file() on an already-dropped lock would panic. The invariant is maintained by the current code but the API is fragile.","fix":"Return Option<&File> or add a debug_assert that the lock is not in Unlocked state, mirroring the path() and parent() methods which already assert.","locations":[{"ref":"crates/tauri-cli/src/helpers/flock.rs:33","code":"   33 |     self.f.as_ref().unwrap()","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/helpers/flock.rs#L33"}]},
{"id":"PANIC_118","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In helpers/template.rs, path.parent().unwrap() is called on each file path without checking that a parent exists.","fix":"Replace .unwrap() with .ok_or_else(|| io::Error::new(io::ErrorKind::Other, \"template file path has no parent\"))? and propagate.","locations":[{"ref":"crates/tauri-cli/src/helpers/template.rs:49","code":"   49 |     let parent = path.parent().unwrap().to_path_buf();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/helpers/template.rs#L49"}]},
{"id":"PANIC_119","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In helpers/template.rs, handlebars.render_template_to_write(...).expect(\"Failed to render template\") panics on any Handlebars render error, such as an undefined variable or syntax error in a template file.","fix":"Propagate the error: `.map_err(|e| Error::Context(\"Failed to render template\".into(), Box::new(e)))?`.","locations":[{"ref":"crates/tauri-cli/src/helpers/template.rs:85","code":"   85 |           .expect(\"Failed to render template\");","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/helpers/template.rs#L85"}]},
{"id":"PANIC_120","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In helpers/updater_signature.rs, KP::generate_encrypted_keypair(password).unwrap(), pk.to_box().unwrap(), and sk.to_box(None).unwrap() all panic on cryptographic errors without any context message.","fix":"Use .context(\"failed to generate keypair\")? etc., adapting the minisign error type with a Box<dyn Error> wrapper or a conversion.","locations":[{"ref":"crates/tauri-cli/src/helpers/updater_signature.rs:36-39","code":"   36 |   let KP { pk, sk } = KP::generate_encrypted_keypair(password).unwrap();\n   37 | \n   38 |   let pk_box_str = pk.to_box().unwrap().to_string();\n   39 |   let sk_box_str = sk.to_box(None).unwrap().to_string();","lines":4,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/helpers/updater_signature.rs#L36-L39"}]},
{"id":"PANIC_121","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In helpers/updater_signature.rs, bin_path.file_name().unwrap() in sign_file() panics if the binary path ends with \"..\" or is a root path.","fix":"Use .ok_or_else(|| Error::GenericError(format!(\"path {} has no file name\", bin_path.display())))? .","locations":[{"ref":"crates/tauri-cli/src/helpers/updater_signature.rs:135","code":"  135 |     bin_path.file_name().unwrap().to_string_lossy()","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/helpers/updater_signature.rs#L135"}]},
{"id":"PANIC_122","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"unix_timestamp() calls .expect(\"system clock is incorrect\") on duration_since(UNIX_EPOCH). This panics if the system clock is set before the Unix epoch (1970), which can occur on misconfigured embedded or CI systems.","fix":"Use .unwrap_or(Duration::ZERO) or propagate a Result.","locations":[{"ref":"crates/tauri-cli/src/helpers/updater_signature.rs:190-192","code":"  190 |     .duration_since(UNIX_EPOCH)\n  191 |     .expect(\"system clock is incorrect\");\n  192 |   since_the_epoch.as_secs()","lines":3,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/helpers/updater_signature.rs#L190-L192"}]},
{"id":"PANIC_123","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In icon.rs, tiny_skia::Pixmap::new(size, size).unwrap() panics if size is 0. While size comes from a bundled JSON, a defensive check costs nothing.","fix":"Add `if size == 0 { return DynamicImage::new_rgba8(0, 0); }` or map the None to an error.","locations":[{"ref":"crates/tauri-cli/src/icon.rs:258","code":"  258 |   let mut pixmap = tiny_skia::Pixmap::new(size, size).unwrap();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/icon.rs#L258"}]},
{"id":"PANIC_124","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In icon.rs, input.parent().unwrap() is used in multiple places to resolve manifest-relative paths. If the manifest path has no parent component (e.g. it is just a bare filename passed as a CLI argument resolved relative to cwd), this panics.","fix":"Use input.parent().unwrap_or(Path::new(\".\")) or canonicalize first and handle the error.","locations":[{"ref":"crates/tauri-cli/src/icon.rs:333","code":"  333 |     Some(ref manifest) => input.parent().unwrap().join(manifest.default.clone()),","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/icon.rs#L333"},{"ref":"crates/tauri-cli/src/icon.rs:628","code":"  628 |       Some(read_source(input.parent().unwrap().join(","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/icon.rs#L628"},{"ref":"crates/tauri-cli/src/icon.rs:650","code":"  650 |       let bg = read_source(input.parent().unwrap().join(background_path))?;","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/icon.rs#L650"},{"ref":"crates/tauri-cli/src/icon.rs:659","code":"  659 |       let mc = read_source(input.parent().unwrap().join(monochrome_path))?;","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/icon.rs#L659"}]},
{"id":"PANIC_125","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In icon.rs, IconType::from_ostype(entry.ostype.parse().unwrap()).unwrap() double-unwraps parsing of ICNS ostype strings loaded from a bundled JSON. A malformed or mismatched JSON value would panic at runtime.","fix":"Replace the two unwrap() calls with .context(\"invalid icns ostype\")? after adding appropriate error mapping.","locations":[{"ref":"crates/tauri-cli/src/icon.rs:428","code":"  428 |         IconType::from_ostype(entry.ostype.parse().unwrap()).unwrap(),","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/icon.rs#L428"}]},
{"id":"PANIC_126","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"init::command calls current_dir().expect(\"failed to read cwd\") in two places. If the working directory has been deleted or permissions revoked, these panic.","fix":"Propagate with current_dir().context(\"failed to read cwd\")?.","locations":[{"ref":"crates/tauri-cli/src/init.rs:274","code":"  274 |       let mut dir = current_dir().expect(\"failed to read cwd\");","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/init.rs#L274"}]},
{"id":"PANIC_127","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"init::command calls serde_json::to_string_pretty(&config).unwrap() inside the data-building block. This can only fail on non-serialisable values (not possible here) but is still an unnecessary unwrap.","fix":"Use serde_json::to_string_pretty(&config).context(\"failed to serialize config\")?.","locations":[{"ref":"crates/tauri-cli/src/init.rs:319","code":"  319 |       to_json(serde_json::to_string_pretty(&config).unwrap()),","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/init.rs#L319"}]},
{"id":"PANIC_128","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In Rust::dev(), rx.recv().unwrap() on the sync_channel can panic if the sender was dropped before sending (e.g. on_exit is never called due to early process exit).","fix":"Use let _ = rx.recv(); or match on the Result to handle a disconnected channel gracefully.","locations":[{"ref":"crates/tauri-cli/src/interface/rust.rs:219","code":"  219 |       rx.recv().unwrap();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/interface/rust.rs#L219"}]},
{"id":"PANIC_129","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"Several `or_insert_with(|| Value::Object(Default::default())).as_object_mut().unwrap()` chains in `migrate_config` will panic if the user's config already has a non-object value at the corresponding key (e.g. `\"plugins\": \"some-string\"` or `\"bundle\": 42`). Although unusual, a malformed config file can cause the migration to crash instead of emitting a helpful error.","fix":"Replace `.unwrap()` with `.context(\"expected '...' to be an object in config\")?` and propagate the error from `migrate_config`.","locations":[{"ref":"crates/tauri-cli/src/migrate/migrations/v1/config.rs:90-95","code":"   90 |     let mut plugins = config\n   91 |       .entry(\"plugins\")\n   92 |       .or_insert_with(|| Value::Object(Default::default()))\n   93 |       .as_object_mut()\n   94 |       .unwrap()\n   95 |       .clone();","lines":6,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/migrate/migrations/v1/config.rs#L90-L95"},{"ref":"crates/tauri-cli/src/migrate/migrations/v1/config.rs:168-171","code":"  168 |         .entry(\"bundle\")\n  169 |         .or_insert_with(|| Value::Object(Default::default()))\n  170 |         .as_object_mut()\n  171 |         .unwrap();","lines":4,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/migrate/migrations/v1/config.rs#L168-L171"},{"ref":"crates/tauri-cli/src/migrate/migrations/v1/config.rs:447-451","code":"  447 |     let security = tauri_config\n  448 |       .entry(\"security\")\n  449 |       .or_insert_with(|| Value::Object(Default::default()))\n  450 |       .as_object_mut()\n  451 |       .unwrap();","lines":5,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/migrate/migrations/v1/config.rs#L447-L451"}]},
{"id":"PANIC_130","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"The package version parsed from config is validated with `semver::Version::from_str` (which returns an error properly), but then the generated code inlines `#package_version.parse().unwrap()`. If the version string in the config somehow bypasses the earlier validation (e.g. via a TAURI_CONFIG env merge), this unwrap will panic at runtime in the generated code.","fix":"Replace the inline `.unwrap()` with `.expect(\"invalid semver version\")` or generate a compile-time constant assertion. Given the pre-validation at line 274 the risk is low but the unwrap in generated code is fragile.","locations":[{"ref":"crates/tauri-codegen/src/context.rs:274-282","code":"  274 |     semver::Version::from_str(version)?;\n  275 |     quote!(#version.to_string())\n  276 |   } else {\n  277 |     quote!(env!(\"CARGO_PKG_VERSION\").to_string())\n  278 |   };\n  279 |   let package_info = quote!(\n  280 |     #root::PackageInfo {\n  281 |       name: #package_name,\n  282 |       version: #package_version.parse().unwrap(),","lines":9,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-codegen/src/context.rs#L274-L282"}]},
{"id":"PANIC_131","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`BufWriter::into_inner().unwrap()` when serializing the plist. `into_inner` can fail if flush fails, but the error is swallowed and the unwrap panics. Because the underlying writer is a `Vec<u8>` this flush never actually fails in practice, but it is still an unchecked unwrap.","fix":"Use `.expect(\"plist BufWriter into_inner failed\")` or, preferably, explicitly flush before consuming.","locations":[{"ref":"crates/tauri-codegen/src/context.rs:340","code":"  340 |       String::from_utf8_lossy(&plist_contents.into_inner().unwrap()).into_owned();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-codegen/src/context.rs#L340"}]},
{"id":"PANIC_132","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"Several `win32job` API calls in `main` on Windows use `.unwrap()` with no error message. Failure to create, configure, or assign the job object (e.g. due to insufficient privileges) panics the process.","fix":"Use `expect(\"...\")` with descriptive messages, or handle the errors gracefully and warn the user instead of crashing.","locations":[{"ref":"crates/tauri-driver/src/main.rs:33-37","code":"   33 |     let job = win32job::Job::create().unwrap();\n   34 |     let mut info = job.query_extended_limit_info().unwrap();\n   35 |     info.limit_kill_on_job_close();\n   36 |     job.set_extended_limit_info(&info).unwrap();\n   37 |     job.assign_current_process().unwrap();","lines":5,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-driver/src/main.rs#L33-L37"}]},
{"id":"PANIC_133","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In `forward_to_native_driver`, the `host` header is expected to always be present using `.expect()`. An HTTP/1.0 or malformed request without a Host header would panic the handler task.","fix":"Return an error response (e.g., `400 Bad Request`) rather than panicking.","locations":[{"ref":"crates/tauri-driver/src/server.rs:115","code":"  115 |     headers.remove(\"host\").expect(\"hyper request has host\")","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-driver/src/server.rs#L115"}]},
{"id":"PANIC_134","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In `generate_self_signed`, an unrecognized `algorithm` string panics with a message saying it should have been validated by the arg parser. This is an internal contract that callers can violate.","fix":"Return `Err(Error::...)` instead of calling `panic!`. Consider using an enum type for the algorithm rather than a raw `String`.","locations":[{"ref":"crates/tauri-macos-sign/src/certificate.rs:41","code":"   41 |     value => panic!(\"algorithm values should have been validated by arg parser: {value}\"),","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-macos-sign/src/certificate.rs#L41"}]},
{"id":"PANIC_135","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`os_pipe::dup_stdin().unwrap()` and `os_pipe::dup_stderr().unwrap()` in `get_pem_list`. These can fail if the process has insufficient file descriptors or the OS call fails, producing an unchecked panic instead of a handled error.","fix":"Propagate with `?` by mapping to an appropriate `Error` variant, or use `.map_err(|e| Error::CommandFailed {...})?`.","locations":[{"ref":"crates/tauri-macos-sign/src/keychain/identity.rs:19-20","code":"   19 |     .stdin(os_pipe::dup_stdin().unwrap())\n   20 |     .stderr(os_pipe::dup_stderr().unwrap())","lines":2,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-macos-sign/src/keychain/identity.rs#L19-L20"}]},
{"id":"PANIC_136","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In `notarize_inner`, `app_bundle_path.file_stem()` and path `.to_str()` are guarded with `.expect()` which panics on non-UTF-8 paths - a real possibility on some systems.","fix":"Return a proper error instead of panicking: map `None` from `file_stem()` and `to_str()` to an `Error` variant.","locations":[{"ref":"crates/tauri-macos-sign/src/lib.rs:143-161","code":"  143 |   let bundle_stem = app_bundle_path\n  144 |     .file_stem()\n  145 |     .expect(\"failed to get bundle filename\");\n  146 | \n  147 |   let tmp_dir = tempfile::tempdir().map_err(Error::TempDir)?;\n  148 |   let zip_path = tmp_dir\n  149 |     .path()\n  150 |     .join(format!(\"{}.zip\", bundle_stem.to_string_lossy()));\n  151 |   let zip_args = vec![\n  152 |     \"-c\",\n  153 |     \"-k\",\n  154 |     \"--keepParent\",\n  155 |     \"--sequesterRsrc\",\n  156 |     app_bundle_path\n  157 |       .to_str()\n  158 |       .expect(\"failed to convert bundle_path to string\"),\n  159 |     zip_path\n  160 |       .to_str()\n  161 |       .expect(\"failed to convert zip_path to string\"),","lines":19,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-macos-sign/src/lib.rs#L143-L161"}]},
{"id":"PANIC_137","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In `staple_app`, `file_name()` and `to_str()` also use `.expect()` on the bundle path, which will panic on non-UTF-8 or missing filenames.","fix":"Map None to an appropriate error and propagate with `?`.","locations":[{"ref":"crates/tauri-macos-sign/src/lib.rs:254-258","code":"  254 |   let filename = app_bundle_path_clone\n  255 |     .file_name()\n  256 |     .expect(\"failed to get bundle filename\")\n  257 |     .to_str()\n  258 |     .expect(\"failed to convert bundle filename to string\");","lines":5,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-macos-sign/src/lib.rs#L254-L258"}]},
{"id":"PANIC_138","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`decode_base64` calls `.expect()` on `base64_input.to_str()`, which panics when the certificate input is not valid UTF-8. Since it is an `OsString` this failure path is reachable.","fix":"Return an error (e.g. `Error::Base64Decode` or a new variant) rather than panicking.","locations":[{"ref":"crates/tauri-macos-sign/src/lib.rs:339","code":"  339 |     .expect(\"failed to convert base64 to string\");","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-macos-sign/src/lib.rs#L339"}]},
{"id":"PANIC_139","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In `tauri-macros/src/command/wrapper.rs`, `path.path.segments.last().unwrap()` is called without a check on whether the segments are empty. A path with no segments (which syn could theoretically produce from unusual input) would panic inside the proc macro.","fix":"Use `path.path.segments.last().ok_or_else(...)` and return a syn error.","locations":[{"ref":"crates/tauri-macros/src/command/wrapper.rs:194","code":"  194 |             let last = path.path.segments.last().unwrap();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-macros/src/command/wrapper.rs#L194"}]},
{"id":"PANIC_140","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"The scroll_bar_style match arm uses `_ => unreachable!()`. While ScrollBarStyle currently only has Default and FluentOverlay, this will panic at runtime (not compile-time) if a new variant is ever added to the Windows-only enum.","fix":"Add an explicit match arm for every variant, or replace with `_ => WryScrollBarStyle::Default` as a safe default.","locations":[{"ref":"crates/tauri-runtime-wry/src/lib.rs:4945","code":" 4945 |         _ => unreachable!(),","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-runtime-wry/src/lib.rs#L4945"}]},
{"id":"PANIC_141","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"inner_size() on macOS calls webviews.first().unwrap() inside an `if !has_children && !webviews.is_empty()` guard. While safe at the time of writing, the guard and the unwrap are not co-located, making future regressions easy. A minor refactor that moves the unwrap outside the branch could cause a panic.","fix":"Replace `.first().unwrap()` with `if let Some(webview) = webviews.first()` to make the safety invariant local.","locations":[{"ref":"crates/tauri-runtime-wry/src/lib.rs:5244","code":" 5244 |     let webview = webviews.first().unwrap();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-runtime-wry/src/lib.rs#L5244"}]},
{"id":"PANIC_142","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In the `build` module of `identifier.rs`, the `ToTokens` impl emits `Identifier::try_from(#s.to_string()).unwrap()` in generated code. An identifier stored in the ACL should always be valid since it was validated on construction, but `unwrap` in generated code surfaces as a confusing runtime panic rather than a compile-time or descriptive error.","fix":"Use `expect` with a message explaining where the identifier came from.","locations":[{"ref":"crates/tauri-utils/src/acl/identifier.rs:305","code":"  305 |         .append_all(quote! { ::tauri::utils::acl::Identifier::try_from(#s.to_string()).unwrap() })","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/acl/identifier.rs#L305"}]},
{"id":"PANIC_143","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In `manifest.rs` build module, `NonZeroU64::new(#v).unwrap()` is emitted in generated code for the `version` field. `v` comes from `NonZeroU64::get()` which is guaranteed non-zero, so this is safe, but `unwrap` is still confusing in generated code.","fix":"Use `expect(\"version is non-zero by construction\")` or use `NonZeroU64::MIN.max(...)` to avoid unwrap.","locations":[{"ref":"crates/tauri-utils/src/acl/manifest.rs:141-143","code":"  141 |         let v = v.get();\n  142 |         quote!(::core::num::NonZeroU64::new(#v).unwrap())\n  143 |       }));","lines":3,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/acl/manifest.rs#L141-L143"}]},
{"id":"PANIC_144","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In the `build` module of `mod.rs`, the `ToTokens` impl for `ExecutionContext` emits `.parse().unwrap()` for the remote URL pattern string in generated code. Same risk as above.","fix":"Use `expect` with a clear message.","locations":[{"ref":"crates/tauri-utils/src/acl/mod.rs:483","code":"  483 |           quote! { #prefix::Remote { url: #url.parse().unwrap() } }","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/acl/mod.rs#L483"}]},
{"id":"PANIC_145","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In the `build` module of `resolved.rs`, the `ToTokens` impl for `ResolvedCommand` emits `.parse().unwrap()` for window and webview glob patterns in generated code. If a stored pattern string is somehow invalid, the generated code panics at runtime. The patterns are validated in `parse_glob_patterns` before being stored, so this is low-risk but still undesirable in generated code.","fix":"Use `expect` with a clear message, or validate again at the call site to make it clear these strings are already-validated patterns.","locations":[{"ref":"crates/tauri-utils/src/acl/resolved.rs:515-519","code":"  515 |         let w = window.as_str();\n  516 |         quote!(#w.parse().unwrap())\n  517 |       });\n  518 |       let webviews = vec_lit(&self.webviews, |window| {\n  519 |         let w = window.as_str();","lines":5,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/acl/resolved.rs#L515-L519"}]},
{"id":"PANIC_146","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`generate_capability_schema` calls `serde_json::to_string_pretty(&schema).unwrap()`. Serialisation of a `schemars::schema::RootSchema` should not fail in practice, but the panic is nevertheless avoidable since the function already returns a `Result`.","fix":"Use `?` to propagate the error.","locations":[{"ref":"crates/tauri-utils/src/acl/schema.rs:319","code":"  319 |   let schema_str = serde_json::to_string_pretty(&schema).unwrap();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/acl/schema.rs#L319"}]},
{"id":"PANIC_147","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"AppUrl::Display for the Files variant calls serde_json::to_string(files).unwrap(). Serialization of Vec<PathBuf> can fail on Windows if a path contains non-UTF-8 components, silently aborting the formatter.","fix":"Use write!(f, \"{}\", serde_json::to_string(files).map_err(|_| fmt::Error)?) or emit a placeholder on error.","locations":[{"ref":"crates/tauri-utils/src/config_v1/mod.rs:2659","code":" 2659 |       Self::Files(files) => write!(f, \"{}\", serde_json::to_string(files).unwrap()),","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/config_v1/mod.rs#L2659"}]},
{"id":"PANIC_148","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"inject_nonce() in html.rs calls node.as_element().unwrap() after obtaining a node from a CSS element selector. The kuchiki selector API always returns Element nodes for element selectors, but the unwrap creates an undocumented assumption and a potential panic if the API behaviour ever changes.","fix":"Replace with `if let Some(element) = node.as_element()` and continue on None.","locations":[{"ref":"crates/tauri-utils/src/html.rs:135","code":"  135 |       let element = node.as_element().unwrap();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/html.rs#L135"}]},
{"id":"PANIC_149","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"resource_dir_from() calls exe.as_ref().parent().expect() which panics if the executable path has no parent (e.g. is a bare filename). Unlikely in practice but the expect converts an edge case into an unconditional abort.","fix":"Return Err(crate::Error::UnsupportedPlatform) (or a dedicated error variant) when parent() is None instead of panicking.","locations":[{"ref":"crates/tauri-utils/src/platform.rs:286","code":"  286 |   let exe_dir = exe.as_ref().parent().expect(\"failed to get exe directory\");","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/platform.rs#L286"}]},
{"id":"PANIC_150","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`path.file_name().unwrap()` is called again in the `None` (empty dest) branch of `resource_from_path`. Same class of issue as above: a path whose final component normalises to empty will panic.","fix":"Replace with `path.file_name().ok_or_else(|| crate::Error::ResourcePathNotFound(path.clone()))?` and propagate the error.","locations":[{"ref":"crates/tauri-utils/src/resources.rs:239","code":"  239 |               PathBuf::from(path.file_name().unwrap())","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/resources.rs#L239"}]},
{"id":"PANIC_151","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`url_lit` emits a `.parse().unwrap()` token stream for a `Url` value. The generated code that ends up in expanded macros will unconditionally panic at runtime if the URL string somehow fails to round-trip through `Url::as_str()` -> `str::parse::<Url>()`. In practice `Url::as_str` is canonical so this is safe, but the generated code embeds an unchecked panic that is invisible to users of the expanded output.","fix":"Use `Url::from_str` and emit a `expect` with a descriptive message, or use a `const`-friendly approach so failures are caught at compile time rather than runtime.","locations":[{"ref":"crates/tauri-utils/src/tokens.rs:90-93","code":"   90 | pub fn url_lit(url: &Url) -> TokenStream {\n   91 |   let url = url.as_str();\n   92 |   quote! { #url.parse().unwrap() }\n   93 | }","lines":4,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/tokens.rs#L90-L93"}]},
{"id":"PANIC_152","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`manifest.to_str().unwrap()` in `embed_manifest_for_tests` will panic if the path constructed from `current_dir()` contains non-UTF-8 characters. The manifest path is assembled from `current_dir()` which can theoretically return a non-UTF-8 path on Linux.","fix":"Use `manifest.display()` (same as is already done for the `rerun-if-changed` line above) or call `.to_str().expect(\"manifest path is not UTF-8\")`.","locations":[{"ref":"crates/tauri/build.rs:494","code":"  494 |     manifest.to_str().unwrap()","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/build.rs#L494"}]},
{"id":"PANIC_153","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In `app.rs`, `prevent_exit` calls `self.tx.send(ExitRequestedEventAction::Prevent).unwrap()` (line 92), and `prevent_close` calls `self.0.send(true).unwrap()` (line 104). Both panic if the event loop has already exited and the receiver is dropped.","fix":"Silently ignore a send error here (the event loop is already gone) or log a warning instead of panicking.","locations":[{"ref":"crates/tauri/src/app.rs:92","code":"   92 |       self.tx.send(ExitRequestedEventAction::Prevent).unwrap();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/app.rs#L92"},{"ref":"crates/tauri/src/app.rs:104","code":"  104 |     self.0.send(true).unwrap();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/app.rs#L104"}]},
{"id":"PANIC_154","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`App::set_device_event_filter` calls `self.runtime.as_mut().unwrap()` (line 1340) which panics if the runtime has already been taken (i.e. after `run` or `run_return` consumes it). This is a public API.","fix":"Return a `Result` or document that the method must not be called after `run`/`run_return`.","locations":[{"ref":"crates/tauri/src/app.rs:1338-1341","code":" 1338 |       .runtime\n 1339 |       .as_mut()\n 1340 |       .unwrap()\n 1341 |       .set_device_event_filter(filter);","lines":4,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/app.rs#L1338-L1341"}]},
{"id":"PANIC_155","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`safe_block_on` in `async_runtime.rs` calls `tx.send(...).unwrap()` and `rx.recv().unwrap()` (lines 310, 312). If `spawn_blocking` panics or the receiver is dropped before receiving, these unwraps panic on the calling thread.","fix":"Handle the send/receive errors explicitly; for example use `rx.recv().expect(\"blocking task panicked\")`.","locations":[{"ref":"crates/tauri/src/async_runtime.rs:310-312","code":"  310 |       tx.send(handle_.block_on(task)).unwrap();\n  311 |     });\n  312 |     rx.recv().unwrap()","lines":3,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/async_runtime.rs#L310-L312"}]},
{"id":"PANIC_156","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In `capability_builder.rs`, `RuntimeCapability for T: AsRef<str>` calls `.expect(\"invalid capability\")` on a user-supplied string (line 22). This panics instead of returning an error, making it a poor API for dynamically-constructed capability strings.","fix":"Consider returning a `Result` from `build()` in the `RuntimeCapability` trait, or at least using a descriptive expect message that includes the actual string content.","locations":[{"ref":"crates/tauri/src/ipc/capability_builder.rs:21-24","code":"   21 |   fn build(self) -> CapabilityFile {\n   22 |     self.as_ref().parse().expect(\"invalid capability\")\n   23 |   }\n   24 | }","lines":4,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/ipc/capability_builder.rs#L21-L24"}]},
{"id":"PANIC_157","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"serde_json::to_vec(&e.0).unwrap() is called on an InvokeError's inner serde_json::Value. Serializing a serde_json::Value must succeed (it has no non-serializable types), but the unwrap silently hides this assumption. A future refactor could make e.0 a generic type that fails to serialize.","fix":"Use serde_json::to_vec(&e.0).unwrap_or_else(|_| b\"null\".to_vec()) or propagate the error.","locations":[{"ref":"crates/tauri/src/ipc/protocol.rs:122","code":"  122 |                       http::Response::new(serde_json::to_vec(&e.0).unwrap().into()),","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/ipc/protocol.rs#L122"}]},
{"id":"PANIC_158","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In the IPC custom-protocol handler, response_header.parse().unwrap() is called on a compile-time constant string. While this cannot panic in practice, the same pattern on mime_type.essence_str() could panic if a future mime type introduced a non-ASCII essence string. HeaderValue::from_static should be used for compile-time-known strings.","fix":"Use HeaderValue::from_static for constant strings. For mime_type.essence_str() (always ASCII) the risk is negligible but using from_static where possible avoids the parse() allocation and the unwrap().","locations":[{"ref":"crates/tauri/src/ipc/protocol.rs:129","code":"  129 |                     .insert(TAURI_RESPONSE_HEADER_NAME, response_header.parse().unwrap());","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/ipc/protocol.rs#L129"},{"ref":"crates/tauri/src/ipc/protocol.rs:136","code":"  136 |                     HeaderValue::from_str(mime_type.essence_str()).unwrap(),","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/ipc/protocol.rs#L136"}]},
{"id":"PANIC_159","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"Url::parse(&request.uri().to_string()).expect(\"invalid IPC request URL\") in handle_ipc_message converts a URI to a string and then re-parses it. If the URI cannot be represented as a valid URL (e.g. an opaque URI scheme), this panics rather than returning an error to the caller.","fix":"Return an error message to the webview (eval a console.error call) instead of panicking. Use Url::parse(...).map_err(|_| ...) and handle the Err case like the surrounding match arms do.","locations":[{"ref":"crates/tauri/src/ipc/protocol.rs:305","code":"  305 |         url: Url::parse(&request.uri().to_string()).expect(\"invalid IPC request URL\"),","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/ipc/protocol.rs#L305"}]},
{"id":"PANIC_160","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"listen_any and once_any call EventName::new(...).unwrap() without documenting the panic in the doc comment above the function signature. The Panics section is documented only on the once_any variant but missing on listen_any.","fix":"Add a `# Panics` doc section to listen_any mirroring the one already on once_any, or return a Result.","locations":[{"ref":"crates/tauri/src/lib.rs:915","code":"  915 |     let event = EventName::new(event.into()).unwrap();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/lib.rs#L915"},{"ref":"crates/tauri/src/lib.rs:928","code":"  928 |     let event = EventName::new(event.into()).unwrap();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/lib.rs#L928"}]},
{"id":"PANIC_161","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"TrayIconEvent::from(tray_icon::TrayIconEvent) ends with a catchall arm `_ => todo!()`. If the upstream tray_icon crate adds a new event variant and Tauri is not updated, any new event will panic the process at runtime.","fix":"Replace todo!() with a non-panicking fallback, e.g. log the unknown event and return a sentinel or skip it.","locations":[{"ref":"crates/tauri/src/tray/mod.rs:196-198","code":"  196 |       _ => todo!(),\n  197 |     }\n  198 |   }","lines":3,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/tray/mod.rs#L196-L198"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"In find_failure_function() (kmp/mod.rs), the expression `let end_i = pattern_length - 1` on a usize will underflow (wrap to usize::MAX in release builds, panic in debug) when pattern is empty. The outer index_of() short-circuits for an empty pattern via the while condition, but find_failure_function itself is unsound when called with an empty slice.","fix":"Add an early return at the top of find_failure_function: `if pattern_length == 0 { return vec![]; }`.","locations":[{"ref":"crates/tauri-bundler/src/bundle/kmp/mod.rs:44","code":"   44 |   let end_i = pattern_length - 1;","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-bundler/src/bundle/kmp/mod.rs#L44"}]},
