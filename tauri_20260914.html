{"id":"LOGIC_105","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `packages/api/src/global.d.ts` line 24, the `ipc` method's `options` parameter is typed as `InvokeOptions`, but `InvokeOptions` is never imported in this file. It is only defined in `core.ts` and imported there as a local interface. Because `global.d.ts` is a pure declaration file that imports only `invoke`, `transformCallback`, and `convertFileSrc` types, `InvokeOptions` is an unresolved reference and the declaration is technically incorrect.","fix":"Add `import type { InvokeOptions } from './core'` to the file, or inline the type as `{ headers: HeadersInit }` at the usage site.","locations":[{"ref":"packages/api/src/global.d.ts:24","code":"   24 |         options?: InvokeOptions","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/packages/api/src/global.d.ts#L24"}]},
{"id":"LOGIC_106","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"The `vite-env.d.ts` file in `templates/plugin/__example-api/tauri-app/src/` references `/// <reference types=\"svelte\" />` and `/// <reference types=\"vite/client\" />`. The file only makes sense for Svelte projects but the template directory is named `__example-api` and may be used for non-Svelte frontends, making this reference incorrect in other frontend contexts.","fix":"The `/// <reference types=\"svelte\" />` line should only be present if the template is strictly a Svelte template; add a conditional or rename the template directory to reflect its Svelte specificity.","locations":[{"ref":"crates/tauri-cli/templates/plugin/__example-api/tauri-app/src/vite-env.d.ts:1-2","code":"    1 | /// <reference types=\"svelte\" />\n    2 | /// <reference types=\"vite/client\" />","lines":2,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/templates/plugin/__example-api/tauri-app/src/vite-env.d.ts#L1-L2"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"medium","description":"In `run_adb_reverse`, the `stderr_file` argument receives `os_pipe::dup_stdout()` instead of `os_pipe::dup_stderr()`. This redirects the subprocess's stderr to the process's stdout, mixing error output into the stdout stream and hiding adb errors from the terminal's stderr.","fix":"Change `os_pipe::dup_stdout().unwrap()` on that line to `os_pipe::dup_stderr().unwrap()`.","locations":[{"ref":"crates/tauri-cli/src/mobile/android/android_studio_script.rs:315","code":"  315 |     .stderr_file(os_pipe::dup_stdout().unwrap())","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/mobile/android/android_studio_script.rs#L315"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"medium","description":"In helpers/updater_signature.rs, the variable is named decoded_publick (missing 'e' at end) in pub_key(), an apparent copy-paste typo from similar code.","fix":"Rename decoded_publick to decoded_public.","locations":[{"ref":"crates/tauri-cli/src/helpers/updater_signature.rs:178","code":"  178 |   let decoded_publick = decode_key(public_key).context(\"failed to decode base64 pubkey\")?;","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/helpers/updater_signature.rs#L178"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"output_ok() silently ignores I/O errors inside the reader threads (the `Err(_) => ()` arms). If a pipe read fails mid-stream, the error is dropped, the loop breaks without signalling anything to the caller, and the output buffer will be truncated. The caller sees a success status even though stdout/stderr were not fully captured.","fix":"Store the I/O error in a shared AtomicBool or a Mutex<Option<io::Error>>, check it after child.wait(), and return an error if a read failed.","locations":[{"ref":"crates/tauri-bundler/src/utils/mod.rs:70-72","code":"   70 |           }\n   71 |           Err(_) => (),\n   72 |         }","lines":3,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-bundler/src/utils/mod.rs#L70-L72"},{"ref":"crates/tauri-bundler/src/utils/mod.rs:88-90","code":"   88 |             lines.extend(line.as_bytes().to_vec());\n   89 |           }\n   90 |           Err(_) => (),","lines":3,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-bundler/src/utils/mod.rs#L88-L90"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"In add.rs, the call to `acl::permission::add::command(...)` at line 122 silently discards any error with `let _ = ...`. If adding the ACL permission fails (e.g. no capabilities directory), the user gets no warning and the plugin is left without its default permission.","fix":"Log the error at warn level: `if let Err(e) = acl::permission::add::command(...) { log::warn!(\"Failed to add default permission: {e}\"); }`.","locations":[{"ref":"crates/tauri-cli/src/add.rs:122-125","code":"  122 |     let _ = acl::permission::add::command(acl::permission::add::Options {\n  123 |       identifier: format!(\"{plugin}:default\"),\n  124 |       capability: None,\n  125 |     });","lines":4,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/add.rs#L122-L125"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"In helpers/cargo_manifest.rs, serde_json::from_reader(...).unwrap() on the crates.io API response panics if the response body cannot be deserialized (e.g. API schema changes, network error mid-body). The caller wraps the whole function in Option via ok()?, so the panic is uncaught.","fix":"Replace .unwrap() with .ok()? to return None on deserialization failure instead of panicking.","locations":[{"ref":"crates/tauri-cli/src/helpers/cargo_manifest.rs:136","code":"  136 |     serde_json::from_reader(response.body_mut().as_reader()).unwrap();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/helpers/cargo_manifest.rs#L136"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`migrate_permissions` in the v2-beta migration only processes capability files with the `.json` extension. The Tauri runtime supports `.toml` and (with the `config-json5` feature) `.json5` capability files as well. Permissions in those files are not prefixed with `core:` during migration, leaving them broken after the upgrade.","fix":"Extend the extension filter to also handle `toml` and `json5` and apply the corresponding deserialiser / serialiser for each format when rewriting permission identifiers.","locations":[{"ref":"crates/tauri-cli/src/migrate/migrations/v2_beta.rs:99","code":"   99 |     if path.extension().is_some_and(|ext| ext == \"json\") {","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/migrate/migrations/v2_beta.rs#L99"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`config.ipa_path()` error is silently discarded via `if let Ok(ipa_path)`. If the IPA was not produced (e.g. export failed partially) the build reports success with an empty `out_files` rather than returning an error.","fix":"Propagate the error with `?` - or at minimum log a warning and return `Err` so the caller is aware the IPA was not produced.","locations":[{"ref":"crates/tauri-cli/src/mobile/ios/build.rs:566-572","code":"  566 |         if let Ok(ipa_path) = config.ipa_path() {\n  567 |           fs::create_dir_all(&out_dir)\n  568 |             .fs_context(\"failed to create Xcode output directory\", out_dir.clone())?;\n  569 |           let path = out_dir.join(ipa_path.file_name().unwrap());\n  570 |           fs::rename(&ipa_path, &path).fs_context(\"failed to rename IPA\", ipa_path)?;\n  571 |           out_files.push(path);\n  572 |         }","lines":7,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/mobile/ios/build.rs#L566-L572"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"In `tauri-driver/server.rs`, `TcpListener::bind` failure is silently swallowed - the server just prints a message and the `srv` future returns normally. The `run()` function then returns `Ok(())`, hiding the bind failure from the caller.","fix":"Change the bind failure branch to store an error and return it, or propagate it out of the async block. The current code silently exits leaving the driver process running with no listener.","locations":[{"ref":"crates/tauri-driver/src/server.rs:206-235","code":"  206 |   let srv = async move {\n  207 |     if let Ok(listener) = TcpListener::bind(address).await {\n  208 |       loop {\n  209 |         let client = client.clone();\n  210 |         let args = args.clone();\n  211 |         if let Ok((stream, _)) = listener.accept().await {\n  212 |           let io = TokioIo::new(stream);\n  213 | \n  214 |           tokio::task::spawn(async move {\n  215 |             if let Err(err) = auto::Builder::new(TokioExecutor::new())\n  216 |               .http1()\n  217 |               .title_case_headers(true)\n  218 |               .preserve_header_case(true)\n  219 |               .serve_connection(\n  220 |                 io,\n  221 |                 service_fn(|request| handle(client.clone(), request, args.clone())),\n  222 |               )\n  223 |               .await\n  224 |             {\n  225 |               println!(\"Error serving connection: {err:?}\");\n  226 |             }\n  227 |           });\n  228 |         } else {\n  229 |           println!(\"accept new stream fail, ignore here\");\n  230 |         }\n  231 |       }\n  232 |     } else {\n  233 |       println!(\"can not listen to address: {address:?}\");\n  234 |     }\n  235 |   };","lines":30,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-driver/src/server.rs#L206-L235"}]},
{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`listener.accept()` failure is silently ignored with a `println!` and the loop continues. On a continuous stream of accept errors this would spin the loop printing indefinitely without backing off.","fix":"Log the error and either break the loop or add a brief sleep/backoff before retrying.","locations":[{"ref":"crates/tauri-driver/src/server.rs:228-230","code":"  228 |         } else {\n  229 |           println!(\"accept new stream fail, ignore here\");\n  230 |         }","lines":3,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-driver/src/server.rs#L228-L230"}]},
{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"WebviewMessage::Url handler calls `.expect(\"invalid webview URL\")` on the result of parsing the URL string returned by wry. If wry ever returns a URL string that Rust's `url` crate cannot parse (e.g. a data: URI with unusual encoding), the main-thread event loop panics, crashing the entire application. The error should be propagated via the channel.","fix":"Replace `.expect(\"invalid webview URL\")` with `.map_err(|_| Error::FailedToSendMessage)` and nest inside the outer `map_err`.","locations":[{"ref":"crates/tauri-runtime-wry/src/lib.rs:3776","code":" 3776 |                 .map(|u| u.parse().expect(\"invalid webview URL\"))","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-runtime-wry/src/lib.rs#L3776"}]},
{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"capability_from_path in permission/add.rs silently returns None for any read or parse error (using .ok()). This means a corrupted or permission-denied capability file is silently skipped rather than reported to the user.","fix":"Log a warning when the file exists but cannot be read/parsed, so users are aware of problematic files.","locations":[{"ref":"crates/tauri-cli/src/acl/permission/add.rs:111-123","code":"  111 | fn capability_from_path<P: AsRef<Path>>(path: P) -> Option<TomlOrJson> {\n  112 |   match path.as_ref().extension().and_then(|o| o.to_str()) {\n  113 |     Some(\"toml\") => std::fs::read_to_string(&path)\n  114 |       .ok()\n  115 |       .and_then(|c| c.parse::<toml_edit::DocumentMut>().ok())\n  116 |       .map(TomlOrJson::Toml),\n  117 |     Some(\"json\") => std::fs::read(&path)\n  118 |       .ok()\n  119 |       .and_then(|c| serde_json::from_slice::<serde_json::Value>(&c).ok())\n  120 |       .map(TomlOrJson::Json),\n  121 |     _ => None,\n  122 |   }\n  123 | }","lines":13,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/acl/permission/add.rs#L111-L123"}]},
{"id":"ERR_10","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In dev.rs kill_before_dev_process(), file.metadata().unwrap().permissions() panics if stat() fails on the freshly created script file. This runs inside a best-effort cleanup path, so a panic here prevents the child process from being killed.","fix":"Use if let Ok(meta) = file.metadata() { ... } to make the chmod step non-fatal.","locations":[{"ref":"crates/tauri-cli/src/dev.rs:360","code":"  360 |           let mut permissions = file.metadata().unwrap().permissions();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/dev.rs#L360"}]},
{"id":"ERR_11","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In builtin_dev_server.rs, `tcp.set_nonblocking(true).unwrap()` panics if the syscall fails. This runs inside a loop that is trying ports; a panic here is unrecoverable even though the failure is non-fatal.","fix":"Propagate: `tcp.set_nonblocking(true).fs_context(\"failed to set socket non-blocking\", ...)?`.","locations":[{"ref":"crates/tauri-cli/src/dev/builtin_dev_server.rs:41","code":"   41 |       tcp.set_nonblocking(true).unwrap();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/dev/builtin_dev_server.rs#L41"}]},
{"id":"ERR_12","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In builtin_dev_server.rs, the tokio runtime build inside the spawned thread uses .expect(), and axum::serve uses .expect(). Panics in a thread that owns the HTTP server silently kill the server without notifying the main CLI process.","fix":"Capture the JoinHandle from std::thread::spawn and check it, or use a channel to report startup errors back to the caller.","locations":[{"ref":"crates/tauri-cli/src/dev/builtin_dev_server.rs:64-76","code":"   64 |     tokio::runtime::Builder::new_current_thread()\n   65 |       .enable_io()\n   66 |       .build()\n   67 |       .expect(\"failed to start tokio runtime for builtin dev server\")\n   68 |       .block_on(async move {\n   69 |         let router = axum::Router::new()\n   70 |           .fallback(handler)\n   71 |           .route(\"/__tauri_cli\", axum::routing::get(ws_handler))\n   72 |           .with_state(state);\n   73 | \n   74 |         axum::serve(tokio::net::TcpListener::from_std(tcp_listener)?, router).await\n   75 |       })\n   76 |       .expect(\"builtin server errored\");","lines":13,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/dev/builtin_dev_server.rs#L64-L76"}]},
{"id":"ERR_13","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In builtin_dev_server.rs, the watcher thread uses .expect() twice. A panic in the watcher thread silently kills file-change detection without notifying the server or the user.","fix":"Return errors to the caller via a channel or log the error and allow graceful degradation (no live-reload, but server keeps running).","locations":[{"ref":"crates/tauri-cli/src/dev/builtin_dev_server.rs:152-157","code":"  152 |     let mut watcher = notify_debouncer_full::new_debouncer(Duration::from_secs(1), None, tx)\n  153 |       .expect(\"failed to start builtin server fs watcher\");\n  154 | \n  155 |     watcher\n  156 |       .watch(&dir, notify::RecursiveMode::Recursive)\n  157 |       .expect(\"builtin server failed to watch dir\");","lines":6,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/dev/builtin_dev_server.rs#L152-L157"}]},
{"id":"ERR_14","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In Rust::new, the rx.recv_timeout result is explicitly discarded (let _ = ...). If the watcher never fires (e.g. on a non-inotify filesystem), the timeout silently expires and execution continues as if the manifest was already processed.","fix":"This is by design (best-effort wait) but should have a comment explaining the intent. Consider logging a debug message on timeout expiry.","locations":[{"ref":"crates/tauri-cli/src/interface/rust.rs:154","code":"  154 |         let _ = rx.recv_timeout(Duration::from_secs(2));","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/interface/rust.rs#L154"}]},
{"id":"ERR_15","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`get_config` calls `process::exit(1)` when the Android source directory is missing. This bypasses all Rust drop handlers, flushed buffers, and any cleanup registered elsewhere in the process. The function already receives a `Result`-returning call chain, so the error should be propagated instead.","fix":"Replace `exit(1)` with `crate::error::bail!(...)` so the error propagates through the normal `Result` chain and callers can perform cleanup.","locations":[{"ref":"crates/tauri-cli/src/mobile/android/mod.rs:179-185","code":"  179 |       log::error!(\n  180 |       \"Project directory {} does not exist. Did you update the package name in `Cargo.toml` or the bundle identifier in `tauri.conf.json > identifier`? Save your changes, delete the `gen/android` folder and run `tauri android init` to recreate the Android project.\",\n  181 |       src_main_dir.display()\n  182 |     );\n  183 |       exit(1);\n  184 |     }\n  185 |   }","lines":7,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/mobile/android/mod.rs#L179-L185"}]},
{"id":"ERR_16","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `notarize_inner`, when the status branch `else if let Ok(output) = Command::new(\"xcrun\").args([\"notarytool\", \"log\"]).output()` fails (the `Err` branch at the end), the error from `xcrun notarytool log` is silently discarded and only the log_message is returned. The actual failure reason from the log retrieval is lost.","fix":"In the `else` branch, include a note that the log retrieval also failed, to give users better diagnostics.","locations":[{"ref":"crates/tauri-macos-sign/src/lib.rs:232-243","code":"  232 |     } else if let Ok(output) = Command::new(\"xcrun\")\n  233 |       .args([\"notarytool\", \"log\"])\n  234 |       .arg(&submit_output.id)\n  235 |       .notarytool_args(auth, tmp_dir.path())?\n  236 |       .output()\n  237 |     {\n  238 |       Err(Error::Notarize(format!(\n  239 |         \"{log_message}\\nLog:\\n{}\",\n  240 |         String::from_utf8_lossy(&output.stdout)\n  241 |       )))\n  242 |     } else {\n  243 |       Err(Error::Notarize(log_message))","lines":12,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-macos-sign/src/lib.rs#L232-L243"}]},
{"id":"ERR_17","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`staple_app` calls `Command::output()` but ignores the exit status of `xcrun stapler staple`. A non-zero exit (e.g. stapling failed because notarization is still in progress) is silently discarded, making the caller think stapling succeeded.","fix":"Check `output.status.success()` and return an error if stapling failed.","locations":[{"ref":"crates/tauri-macos-sign/src/lib.rs:262-269","code":"  262 |   Command::new(\"xcrun\")\n  263 |     .args(vec![\"stapler\", \"staple\", \"-v\", filename])\n  264 |     .current_dir(app_bundle_path)\n  265 |     .output()\n  266 |     .map_err(|error| Error::CommandFailed {\n  267 |       command: \"xcrun stapler staple\".to_string(),\n  268 |       error,\n  269 |     })?;","lines":8,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-macos-sign/src/lib.rs#L262-L269"}]},
{"id":"ERR_18","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"The Reparent handler silently swallows the case where new_parent_window_webviews would be modified but `new_parent_window` is None (i.e. the target window has been closed). In that case neither the success nor the error path of `tx.send` is reached - the sender drops without sending, so `rx.recv().unwrap()` at line 1779 will panic with a RecvError.","fix":"Add an `else` branch after the `if let Some((Some(new_parent_window), ...))` that sends `tx.send(Err(Error::WindowNotFound)).unwrap()`.","locations":[{"ref":"crates/tauri-runtime-wry/src/lib.rs:3566-3611","code":" 3566 |         if let Some(webview) = webview_handle {\n 3567 |           if let Some((Some(new_parent_window), new_parent_window_webviews)) = windows\n 3568 |             .0\n 3569 |             .borrow_mut()\n 3570 |             .get_mut(&new_parent_window_id)\n 3571 |             .map(|w| (w.inner.clone(), &mut w.webviews))\n 3572 |           {\n 3573 |             #[cfg(target_os = \"macos\")]\n 3574 |             let reparent_result = {\n 3575 |               use wry::WebViewExtMacOS;\n 3576 |               webview.inner.reparent(new_parent_window.ns_window() as _)\n 3577 |             };\n 3578 |             #[cfg(windows)]\n 3579 |             let reparent_result = { webview.inner.reparent(new_parent_window.hwnd()) };\n 3580 | \n 3581 |             #[cfg(any(\n 3582 |               target_os = \"linux\",\n 3583 |               target_os = \"dragonfly\",\n 3584 |               target_os = \"freebsd\",\n 3585 |               target_os = \"netbsd\",\n 3586 |               target_os = \"openbsd\"\n 3587 |             ))]\n 3588 |             let reparent_result = {\n 3589 |               if let Some(container) = new_parent_window.default_vbox() {\n 3590 |                 webview.inner.reparent(container)\n 3591 |               } else {\n 3592 |                 Err(wry::Error::MessageSender)\n 3593 |               }\n 3594 |             };\n 3595 | \n 3596 |             match reparent_result {\n 3597 |               Ok(_) => {\n 3598 |                 new_parent_window_webviews.push(webview);\n 3599 |                 tx.send(Ok(())).unwrap();\n 3600 |               }\n 3601 |               Err(e) => {\n 3602 |                 log::error!(\"failed to reparent webview: {e}\");\n 3603 |                 tx.send(Err(Error::FailedToSendMessage)).unwrap();\n 3604 |               }\n 3605 |             }\n 3606 |           }\n 3607 |         } else {\n 3608 |           tx.send(Err(Error::FailedToSendMessage)).unwrap();\n 3609 |         }\n 3610 | \n 3611 |         return;","lines":46,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-runtime-wry/src/lib.rs#L3566-L3611"}]},
{"id":"ERR_19","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"WebviewMessage::Reparent: when reparent_result is Err, the error is logged and `tx.send(Err(Error::FailedToSendMessage))` is sent - but the specific reparent error is discarded. The caller only sees a generic `FailedToSendMessage`, making debugging difficult.","fix":"Add a dedicated `Error::FailedToReparentWebview(String)` variant and send `Err(Error::FailedToReparentWebview(e.to_string()))`.","locations":[{"ref":"crates/tauri-runtime-wry/src/lib.rs:3601-3604","code":" 3601 |               Err(e) => {\n 3602 |                 log::error!(\"failed to reparent webview: {e}\");\n 3603 |                 tx.send(Err(Error::FailedToSendMessage)).unwrap();\n 3604 |               }","lines":4,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-runtime-wry/src/lib.rs#L3601-L3604"}]},
{"id":"ERR_20","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `try_next_schema` (schema-worker/config.rs), the function fetches all releases and takes the maximum pre-release version. If `releases` is empty (network failure was swallowed earlier), `max()` returns `None` and `context(\"Couldn't find latest pre-release\")` produces a generic error with no indication that the upstream crates.io call may have failed.","fix":"Check `releases.is_empty()` and return a more descriptive error, or propagate the crates.io HTTP error before filtering.","locations":[{"ref":"crates/tauri-schema-worker/src/config.rs:103-110","code":"  103 |   let releases = crate_releases(\"tauri\").await?;\n  104 |   let version = releases\n  105 |     .into_iter()\n  106 |     .filter(|r| !r.version.pre.is_empty())\n  107 |     .map(|r| r.version)\n  108 |     .max()\n  109 |     .context(\"Couldn't find latest pre-release\")?;\n  110 |   schema_file_for_version(version).await","lines":8,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-schema-worker/src/config.rs#L103-L110"}]},
{"id":"ERR_21","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `examples/api/src-tauri/src/lib.rs`, the `on_new_window` closure calls `.build().unwrap()` for every window opened via `window.open()` from JS. If window creation fails (resource exhaustion, duplicate label race) the application panics.","fix":"Return an appropriate `NewWindowResponse` error variant or log the failure instead of unwrapping.","locations":[{"ref":"examples/api/src-tauri/src/lib.rs:103-104","code":"  103 |             let window = builder.build().unwrap();\n  104 |             tauri::webview::NewWindowResponse::Create { window }","lines":2,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/examples/api/src-tauri/src/lib.rs#L103-L104"}]},
{"id":"ERR_22","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `examples/api/src-tauri/src/lib.rs`, the iOS `SceneRequested` branch calls `.build().unwrap()` without any error handling. A failure (e.g. duplicate label) would panic the event loop.","fix":"Log or ignore the error: `if let Err(e) = WebviewWindowBuilder::new(...).build() { eprintln!(\"scene window error: {e}\"); }`.","locations":[{"ref":"examples/api/src-tauri/src/lib.rs:190-197","code":"  190 |         WebviewWindowBuilder::new(\n  191 |           _app_handle,\n  192 |           format!(\"main-from-scene-{counter}\"),\n  193 |           WebviewUrl::default(),\n  194 |         )\n  195 |         .build()\n  196 |         .unwrap();\n  197 |       }","lines":8,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/examples/api/src-tauri/src/lib.rs#L190-L197"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"The sign_command function on non-Windows without a custom sign_command returns `Ok(Command::new(\"\"))` - an empty-string command that would fail unpredictably if ever executed. The comment says 'should not be reachable' but the public API surface makes it callable. If called and then executed, the OS would return a not-found or permission error.","fix":"Return `Err(crate::Error::GenericError(\"signing is not supported on this platform without a custom sign_command\".into()))` to make the invalid state explicit and fail fast.","locations":[{"ref":"crates/tauri-bundler/src/bundle/windows/sign.rs:195-197","code":"  195 |     #[cfg(not(windows))]\n  196 |     None => Ok(Command::new(\"\")),\n  197 |   }","lines":3,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-bundler/src/bundle/windows/sign.rs#L195-L197"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"In build.rs and bundle.rs, std::env::set_var(\"MACOSX_DEPLOYMENT_TARGET\", ...) is called without any synchronization. On macOS, if multiple build commands run concurrently (e.g. from test harnesses), this mutates shared process state.","fix":"Pass the deployment target via explicit cargo flags (e.g. `--env MACOSX_DEPLOYMENT_TARGET=...`) rather than mutating the process environment.","locations":[{"ref":"crates/tauri-cli/src/build.rs:118","code":"  118 |     std::env::set_var(\"MACOSX_DEPLOYMENT_TARGET\", minimum_system_version);","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/build.rs#L118"},{"ref":"crates/tauri-cli/src/bundle.rs:151","code":"  151 |   if let Some(minimum_system_version) = &config.bundle.macos.minimum_system_version {","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/bundle.rs#L151"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"In helpers/config.rs, std::env::set_var() is called to export TAURI_CONFIG and per-plugin config env vars. set_var is not thread-safe (UB in Rust if called concurrently with other env reads/writes). dev.rs also spawns a thread for mismatched-package checks concurrently with setup() which calls set_var.","fix":"Ensure set_var calls happen before any threads are spawned, or use a Mutex-protected environment map passed explicitly to child processes rather than relying on the process environment.","locations":[{"ref":"crates/tauri-cli/src/helpers/config.rs:182","code":"  182 |     set_var(\"TAURI_CONFIG\", merge_config_str);","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/helpers/config.rs#L182"},{"ref":"crates/tauri-cli/src/helpers/config.rs:215-220","code":"  215 |     set_var(\n  216 |       format!(\n  217 |         \"TAURI_{}_PLUGIN_CONFIG\",\n  218 |         plugin.to_uppercase().replace('-', \"_\")\n  219 |       ),\n  220 |       serde_json::to_string(&conf).context(\"failed to serialize config\")?,","lines":6,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/helpers/config.rs#L215-L220"},{"ref":"crates/tauri-cli/src/helpers/config.rs:225","code":"  225 |     std::env::set_var(REMOVE_UNUSED_COMMANDS_ENV_VAR, tauri_dir);","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/helpers/config.rs#L225"},{"ref":"crates/tauri-cli/src/dev.rs:142-146","code":"  142 |   std::thread::spawn(|| {\n  143 |     if let Err(error) = check_mismatched_packages(dirs.frontend, dirs.tauri) {\n  144 |       log::error!(\"{error}\");\n  145 |     }\n  146 |   });","lines":5,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/dev.rs#L142-L146"}]},
{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"get_library_path slices output.stdout starting at index 2 (output.stdout[2..]) to strip the '-L' prefix without checking that the output is at least 2 bytes long. If pkg-config returns a shorter unexpected response, this causes an out-of-bounds slice panic.","fix":"Use output.stdout.get(2..).unwrap_or_default() or check output.stdout.len() >= 2 before slicing.","locations":[{"ref":"crates/tauri-cli/src/interface/rust.rs:1717","code":" 1717 |         let word = output.stdout[2..].to_vec();","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/interface/rust.rs#L1717"}]},
{"id":"API_5","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"platform.rs uses a `static mut &str` to hold the bundle type token, which is then read inside an `unsafe` block without synchronization. Reading a `static mut` without a lock is undefined behaviour in Rust (data race if the value is ever written concurrently). While in practice the value is only patched by the bundler before the binary runs, the compiler is allowed to perform UB-based optimisations.","fix":"Replace `static mut __TAURI_BUNDLE_TYPE: &str` with `static __TAURI_BUNDLE_TYPE: &str` (immutable static). Since the value is patched by the bundler by overwriting bytes in the binary before execution, it is effectively read-only at runtime. Removing mut eliminates the UB and the unsafe block entirely.","locations":[{"ref":"crates/tauri-utils/src/platform.rs:346-370","code":"  346 | #[used]\n  347 | // Marked as `mut` because it could get optimized away without it,\n  348 | // see https://github.com/tauri-apps/tauri/pull/13812\n  349 | static mut __TAURI_BUNDLE_TYPE: &str = \"__TAURI_BUNDLE_TYPE_VAR_UNK\";\n  350 | \n  351 | /// Get the type of the bundle current binary is packaged in.\n  352 | /// If the bundle type is unknown, it returns [`Option::None`].\n  353 | pub fn bundle_type() -> Option<BundleType> {\n  354 |   unsafe {\n  355 |     match __TAURI_BUNDLE_TYPE {\n  356 |       \"__TAURI_BUNDLE_TYPE_VAR_DEB\" => Some(BundleType::Deb),\n  357 |       \"__TAURI_BUNDLE_TYPE_VAR_RPM\" => Some(BundleType::Rpm),\n  358 |       \"__TAURI_BUNDLE_TYPE_VAR_APP\" => Some(BundleType::AppImage),\n  359 |       \"__TAURI_BUNDLE_TYPE_VAR_MSI\" => Some(BundleType::Msi),\n  360 |       \"__TAURI_BUNDLE_TYPE_VAR_NSS\" => Some(BundleType::Nsis),\n  361 |       _ => {\n  362 |         if cfg!(target_os = \"macos\") {\n  363 |           Some(BundleType::App)\n  364 |         } else {\n  365 |           None\n  366 |         }\n  367 |       }\n  368 |     }\n  369 |   }\n  370 | }","lines":25,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/platform.rs#L346-L370"}]},
{"id":"API_6","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"In try_build() (lib.rs line 534), env::set_var() is called to propagate TAURI_ENV_TARGET_TRIPLE into the process environment for the codegen step. env::set_var is unsound in multithreaded programs (Rust 1.82+ marks it unsafe). Build scripts run single-threaded but Cargo may run multiple build scripts in the same process in future versions; the comment in the code also acknowledges this is 'far from ideal'.","fix":"Pass the target triple via a parameter to the codegen function rather than going through the process environment.","locations":[{"ref":"crates/tauri-build/src/lib.rs:587","code":"  587 |   env::set_var(\"TAURI_ENV_TARGET_TRIPLE\", &target_triple);","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-build/src/lib.rs#L587"}]},
{"id":"API_7","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"generate_github_mirror_url_from_base sets the entire URL as the path component of the CDN base URL (cdn.set_path(github_url)). set_path expects a relative path, but github_url is an absolute URL string beginning with 'https://...'. This results in a CDN URL like `https://mirror.example.com/https://github.com/...` rather than an appropriate mirror URL.","fix":"Strip the scheme and host from github_url before using it as a path, or use URL joining correctly. Alternatively, document that TAURI_BUNDLER_TOOLS_GITHUB_MIRROR expects the full URL prefix and use string concatenation.","locations":[{"ref":"crates/tauri-bundler/src/utils/http_utils.rs:35-43","code":"   35 | fn generate_github_mirror_url_from_base(github_url: &str) -> Option<String> {\n   36 |   std::env::var(\"TAURI_BUNDLER_TOOLS_GITHUB_MIRROR\")\n   37 |     .ok()\n   38 |     .and_then(|cdn| Url::parse(&cdn).ok())\n   39 |     .map(|mut cdn| {\n   40 |       cdn.set_path(github_url);\n   41 |       cdn.to_string()\n   42 |     })\n   43 | }","lines":9,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-bundler/src/utils/http_utils.rs#L35-L43"}]},
{"id":"API_8","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"In get_cargo_option, when the option is given as '--target-dir=value' (with '='), splitting on '=' and returning the right side is correct. However, when given as '--target-dir value' (space-separated), the function returns args.get(i+1). If the next argument is itself an option flag (e.g. '--target-dir --release'), a flag is silently treated as the target directory value.","fix":"Add a guard: if the candidate value starts with '--', return None to indicate the option has no value.","locations":[{"ref":"crates/tauri-cli/src/interface/rust.rs:1309-1317","code":" 1309 |   args\n 1310 |     .iter()\n 1311 |     .position(|a| a.starts_with(option))\n 1312 |     .and_then(|i| {\n 1313 |       args[i]\n 1314 |         .split_once('=')\n 1315 |         .map(|(_, p)| Some(p))\n 1316 |         .unwrap_or_else(|| args.get(i + 1).map(|s| s.as_str()))\n 1317 |     })","lines":9,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/interface/rust.rs#L1309-L1317"}]},
{"id":"API_9","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`Builder::build()` in `plugin.rs` calls `self.try_build().expect(\"valid plugin\")`. If a plugin name happens to be `\"core\"` or `\"tauri\"` (RESERVED_PLUGIN_NAMES), this panics at plugin registration time with a non-actionable message. Third-party code that uses `build()` directly (rather than `try_build()`) cannot recover from this.","fix":"Document that `build()` panics for reserved names and recommend `try_build()` for code that may not control the plugin name.","locations":[{"ref":"crates/tauri/src/plugin.rs:754-756","code":"  754 |   pub fn build(self) -> TauriPlugin<R, C> {\n  755 |     self.try_build().expect(\"valid plugin\")\n  756 |   }","lines":3,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/plugin.rs#L754-L756"}]},
{"id":"API_10","type":"api_misuse","type_label":"Api Misuse","severity":"negligible","difficulty":"medium","description":"`plugins_from_permissions` takes `&Vec<PermissionEntry>` instead of `&[PermissionEntry]`. Passing a reference to a `Vec` is an anti-pattern flagged by Clippy (`clippy::ptr_arg`): the function should accept a slice so it works with any contiguous collection without an unnecessary level of indirection.","fix":"Change the parameter type to `permissions: &[PermissionEntry]`.","locations":[{"ref":"crates/tauri-cli/src/migrate/migrations/v1/config.rs:712","code":"  712 | fn plugins_from_permissions(permissions: &Vec<PermissionEntry>) -> HashSet<String> {","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/migrate/migrations/v1/config.rs#L712"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In manifest.rs, features_diff() uses Vec::contains() for membership checks inside loops over both the 'current' and 'expected' slices. This is O(n*m) when O(n+m) is achievable with HashSet. For small feature lists this is negligible, but the pattern is unnecessarily quadratic.","fix":"Convert one of the slices to a HashSet before the loop to achieve linear-time lookup.","locations":[{"ref":"crates/tauri-build/src/manifest.rs:105-121","code":"  105 | fn features_diff(current: &[String], expected: &[String]) -> Diff {\n  106 |   let mut remove = Vec::new();\n  107 |   let mut add = Vec::new();\n  108 |   for feature in current {\n  109 |     if !expected.contains(feature) {\n  110 |       remove.push(feature.clone());\n  111 |     }\n  112 |   }\n  113 | \n  114 |   for feature in expected {\n  115 |     if !current.contains(feature) {\n  116 |       add.push(feature.clone());\n  117 |     }\n  118 |   }\n  119 | \n  120 |   Diff { remove, add }\n  121 | }","lines":17,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-build/src/manifest.rs#L105-L121"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"package_types() in settings.rs calls platform_types.clone().into_iter() inside a loop over package_types to check membership. The clone is unnecessary since into_iter() consumes the Vec - a reference iterator would suffice - and the check could be a HashSet lookup.","fix":"Convert platform_types into a HashSet<PackageType> before the loop and use .contains(&package_type).","locations":[{"ref":"crates/tauri-bundler/src/bundle/settings.rs:1134-1143","code":" 1134 |       let mut types = vec![];\n 1135 |       for package_type in package_types {\n 1136 |         let package_type = *package_type;\n 1137 |         if platform_types\n 1138 |           .clone()\n 1139 |           .into_iter()\n 1140 |           .any(|t| t == package_type)\n 1141 |         {\n 1142 |           types.push(package_type);\n 1143 |         }","lines":10,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-bundler/src/bundle/settings.rs#L1134-L1143"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"create_zip reads the entire source file into memory with read_to_end before writing it into the ZIP archive. For large installer files (potentially hundreds of MB) this doubles peak memory usage.","fix":"Use std::io::copy(&mut f, &mut zip) to stream the file content directly, avoiding the intermediate buffer.","locations":[{"ref":"crates/tauri-bundler/src/bundle/updater_bundle.rs:222-224","code":"  222 |   let mut buffer = Vec::new();\n  223 |   f.read_to_end(&mut buffer)?;\n  224 |   zip.write_all(&buffer)?;","lines":3,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-bundler/src/bundle/updater_bundle.rs#L222-L224"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In helpers/app_paths.rs, walk_builder() writes a gitignore file to the temp directory on every call. resolve_dirs() calls lookup() which calls walk_builder(), so every directory lookup recreates the temp file. This is safe because the file content is always the same, but it incurs unnecessary I/O.","fix":"Cache the temp file path in a OnceLock<PathBuf> and skip writing if the file already exists with the correct content, or check existence before creating.","locations":[{"ref":"crates/tauri-cli/src/helpers/app_paths.rs:35-50","code":"   35 |   let mut default_gitignore = std::env::temp_dir();\n   36 |   default_gitignore.push(\".gitignore\");\n   37 |   if !default_gitignore.exists() {\n   38 |     if let Ok(mut file) = std::fs::File::create(default_gitignore.clone()) {\n   39 |       use std::io::Write;\n   40 |       let _ = file.write_all(TAURI_GITIGNORE);\n   41 |     }\n   42 |   }\n   43 | \n   44 |   let mut builder = WalkBuilder::new(path);\n   45 |   builder.add_custom_ignore_filename(\".taurignore\");\n   46 |   builder.git_global(false);\n   47 |   builder.parents(false);\n   48 |   let _ = builder.add_ignore(default_gitignore);\n   49 |   builder\n   50 | }","lines":16,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/helpers/app_paths.rs#L35-L50"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In helpers/npm.rs, current_package_version() compiles a regex with Regex::new(...).unwrap() on every call (both for the YarnBerry branch at line 241 and the fallback at line 272). Regex compilation is expensive and should be cached.","fix":"Use std::sync::OnceLock or the once_cell / lazy_static pattern to compile each regex exactly once.","locations":[{"ref":"crates/tauri-cli/src/helpers/npm.rs:241","code":"  241 |       ),","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/helpers/npm.rs#L241"},{"ref":"crates/tauri-cli/src/helpers/npm.rs:272","code":"  272 |       let regex = regex.unwrap_or_else(|| regex::Regex::new(\"@(\\\\d[\\\\da-zA-Z\\\\-\\\\.]+)\").unwrap());","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/helpers/npm.rs#L272"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In find_dependencies (rust.rs), found_dependency_paths.contains(path) does a linear scan of the Vec on every dependency lookup. For large workspaces with many cross-dependencies this is O(N^2).","fix":"Change found_dependency_paths to a HashSet<PathBuf> to get O(1) contains checks, converting to Vec only at the return site if callers require it.","locations":[{"ref":"crates/tauri-cli/src/interface/rust.rs:1253-1270","code":" 1253 | fn find_dependencies(\n 1254 |   package: &Package,\n 1255 |   workspace_packages: &Vec<&Package>,\n 1256 |   found_dependency_paths: &mut Vec<PathBuf>,\n 1257 | ) {\n 1258 |   for dependency in &package.dependencies {\n 1259 |     if let Some(path) = &dependency.path {\n 1260 |       if let Some(package) = workspace_packages.iter().find(|workspace_package| {\n 1261 |         workspace_package.name == dependency.name\n 1262 |           && path.join(\"Cargo.toml\") == workspace_package.manifest_path\n 1263 |           && !found_dependency_paths.contains(path)\n 1264 |       }) {\n 1265 |         found_dependency_paths.push(path.to_owned());\n 1266 |         find_dependencies(package, workspace_packages, found_dependency_paths);\n 1267 |       }\n 1268 |     }\n 1269 |   }\n 1270 | }","lines":18,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/interface/rust.rs#L1253-L1270"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In `create_ipa` the directory-traversal loop uses a `Vec` as a stack with `pop()` (DFS) and then separately stores all found paths in `app_files` before iterating them. This doubles the peak memory allocation for large `.app` bundles. Entries could be written directly to the zip as they are discovered.","fix":"Process each directory entry as it is discovered rather than collecting into `app_files` first, or use `walkdir` which avoids the manual stack entirely.","locations":[{"ref":"crates/tauri-cli/src/mobile/ios/build.rs:599-637","code":"  599 |   let mut app_files = Vec::new();\n  600 |   let mut stack = vec![app_path.to_path_buf()];\n  601 |   while let Some(path) = stack.pop() {\n  602 |     if path.is_dir() {\n  603 |       app_files.push(path.clone());\n  604 |       for entry in fs::read_dir(&path).fs_context(\"failed to read directory\", path.clone())? {\n  605 |         stack.push(\n  606 |           entry\n  607 |             .fs_context(\"failed to read directory entry\", path.clone())?\n  608 |             .path(),\n  609 |         );\n  610 |       }\n  611 |     } else {\n  612 |       app_files.push(path);\n  613 |     }\n  614 |   }\n  615 | \n  616 |   for file_path in app_files {\n  617 |     let name = file_path.strip_prefix(app_path.parent().unwrap()).unwrap();\n  618 |     let mut name_str = name.to_string_lossy().to_string();\n  619 |     // zip expects forward slashes\n  620 |     if std::path::MAIN_SEPARATOR == '\\\\' {\n  621 |       name_str = name_str.replace('\\\\', \"/\");\n  622 |     }\n  623 |     let mut name_in_zip = format!(\"Payload/{name_str}\");\n  624 | \n  625 |     if file_path.is_dir() {\n  626 |       name_in_zip.push('/');\n  627 |       zip\n  628 |         .add_directory(name_in_zip, options)\n  629 |         .context(\"failed to add directory to zip\")?;\n  630 |     } else {\n  631 |       zip\n  632 |         .start_file(name_in_zip, options)\n  633 |         .context(\"failed to start file in zip\")?;\n  634 |       let mut f = fs::File::open(&file_path).fs_context(\"failed to open file\", file_path)?;\n  635 |       std::io::copy(&mut f, &mut zip).context(\"failed to copy file to zip\")?;\n  636 |     }\n  637 |   }","lines":39,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/mobile/ios/build.rs#L599-L637"}]},
{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In `EmbeddedAssets::compress_file`, `OUT_DIR` is resolved and `create_dir_all` is called for every single asset file. With many assets this repeatedly calls `canonicalize` and `create_dir_all` per file instead of resolving it once before the loop.","fix":"Resolve and canonicalize `OUT_DIR` once in `EmbeddedAssets::new` before the fold, then pass it into `compress_file`.","locations":[{"ref":"crates/tauri-codegen/src/embedded_assets.rs:334-342","code":"  334 |     // we must canonicalize the base of our paths to allow long paths on windows\n  335 |     let out_dir = std::env::var(\"OUT_DIR\")\n  336 |       .map_err(|_| EmbeddedAssetsError::OutDir)\n  337 |       .map(PathBuf::from)\n  338 |       .and_then(|p| p.canonicalize().map_err(|_| EmbeddedAssetsError::OutDir))\n  339 |       .map(|p| p.join(TARGET_PATH))?;\n  340 | \n  341 |     // make sure that our output directory is created\n  342 |     std::fs::create_dir_all(&out_dir).map_err(|_| EmbeddedAssetsError::OutDir)?;","lines":9,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-codegen/src/embedded_assets.rs#L334-L342"}]},
{"id":"PERF_9","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`Team::certificate_name()` clones the string on every call rather than returning a reference. It is called multiple times per signing operation.","fix":"Return `&str` from `certificate_name` instead of a new `String`.","locations":[{"ref":"crates/tauri-macos-sign/src/keychain/identity.rs:82-84","code":"   82 |   pub fn certificate_name(&self) -> String {\n   83 |     self.certificate_name.clone()\n   84 |   }","lines":3,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-macos-sign/src/keychain/identity.rs#L82-L84"}]},
{"id":"PERF_10","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"plugins.lock().unwrap() is called at the top of every single event-loop iteration (both in make_event_handler and run_iteration), including for the very common no-plugins case. The lock acquisition and contention overhead accumulates for high-frequency events like mouse-move or resize.","fix":"Cache a flag `has_plugins: bool` (set once when plugins are registered) and skip the lock+iterate when false.","locations":[{"ref":"crates/tauri-runtime-wry/src/lib.rs:3126","code":" 3126 |     for p in plugins.lock().unwrap().iter_mut() {","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-runtime-wry/src/lib.rs#L3126"},{"ref":"crates/tauri-runtime-wry/src/lib.rs:3126","code":" 3126 |     for p in plugins.lock().unwrap().iter_mut() {","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-runtime-wry/src/lib.rs#L3126"}]},
{"id":"PERF_11","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"In handle_event_loop, on every TaoWindowEvent::Resized event, `windows.0.borrow()` is called and `w.webviews.clone()` clones the entire Vec of WebviewWrapper. Each WebviewWrapper contains an Rc<WebView> plus several Arc<Mutex<...>> fields. For windows with many webviews this is an unnecessary allocation on every resize event (which fires continuously during a resize drag).","fix":"Hold the borrow for the duration of the loop instead of cloning: borrow the window and iterate over `w.webviews` directly, since the event handler does not re-borrow windows.","locations":[{"ref":"crates/tauri-runtime-wry/src/lib.rs:4216-4236","code":" 4216 |           TaoWindowEvent::Resized(size) => {\n 4217 |             if let Some((Some(window), webviews)) = windows\n 4218 |               .0\n 4219 |               .borrow()\n 4220 |               .get(&window_id)\n 4221 |               .map(|w| (w.inner.clone(), w.webviews.clone()))\n 4222 |             {\n 4223 |               let size = size.to_logical::<f32>(window.scale_factor());\n 4224 |               for webview in webviews {\n 4225 |                 if let Some(b) = &*webview.bounds.lock().unwrap() {\n 4226 |                   if let Err(e) = webview.set_bounds(wry::Rect {\n 4227 |                     position: LogicalPosition::new(size.width * b.x_rate, size.height * b.y_rate)\n 4228 |                       .into(),\n 4229 |                     size: LogicalSize::new(size.width * b.width_rate, size.height * b.height_rate)\n 4230 |                       .into(),\n 4231 |                   }) {\n 4232 |                     log::error!(\"failed to autoresize webview: {e}\");\n 4233 |                   }\n 4234 |                 }\n 4235 |               }\n 4236 |             }","lines":21,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-runtime-wry/src/lib.rs#L4216-L4236"}]},
{"id":"PERF_12","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In `resolved.rs`, `get_permissions` builds the `available` string for the error message by joining all ACL keys on every lookup failure: `acl.keys().cloned().collect::<Vec<_>>().join(\", \")`. In a build with many plugins this allocates a potentially large string on every failed permission lookup, including during normal error handling. The string is only needed for the error message.","fix":"Defer the join into a `format!` inside the error variant's `Display` impl, or lazily compute it only when displaying the error.","locations":[{"ref":"crates/tauri-utils/src/acl/resolved.rs:391-393","code":"  391 |     key: display_perm_key(key).to_string(),\n  392 |     available: acl.keys().cloned().collect::<Vec<_>>().join(\", \"),\n  393 |   })?;","lines":3,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/acl/resolved.rs#L391-L393"}]},
{"id":"PERF_13","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"Csp::DirectiveMap iterates the HashMap to format the CSP string. HashMap has non-deterministic iteration order, so the CSP string produced by Display varies between runs. This causes instability in HTTP headers sent to the browser (not a security issue, but causes cache-busting and makes builds non-reproducible). The ToTokens impl works around this with explicit sorting, but the Display impl does not.","fix":"In the Display impl, collect the entries into a sorted Vec before formatting: `let mut entries: Vec<_> = m.iter().collect(); entries.sort_by_key(|(k, _)| k.as_str());` and then iterate entries.","locations":[{"ref":"crates/tauri-utils/src/config.rs:2581-2595","code":" 2581 |       Self::DirectiveMap(m) => {\n 2582 |         let len = m.len();\n 2583 |         let mut i = 0;\n 2584 |         for (directive, sources) in m {\n 2585 |           let sources: Vec<String> = sources.clone().into();\n 2586 |           write!(f, \"{} {}\", directive, sources.join(\" \"))?;\n 2587 |           i += 1;\n 2588 |           if i != len {\n 2589 |             write!(f, \"; \")?;\n 2590 |           }\n 2591 |         }\n 2592 |         Ok(())\n 2593 |       }\n 2594 |     }\n 2595 |   }","lines":15,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/config.rs#L2581-L2595"}]},
{"id":"PERF_14","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"HeaderSource::Map Display iterates a HashMap, producing non-deterministic header value ordering (e.g. for Permission-Policy). Like Csp::DirectiveMap, this makes response headers non-deterministic.","fix":"Sort entries before iteration: `let mut entries: Vec<_> = m.iter().collect(); entries.sort_by_key(|(k,_)| k.as_str());` then iterate entries.","locations":[{"ref":"crates/tauri-utils/src/config.rs:2741-2754","code":" 2741 |       Self::Map(m) => {\n 2742 |         let len = m.len();\n 2743 |         let mut i = 0;\n 2744 |         for (key, value) in m {\n 2745 |           write!(f, \"{key} {value}\")?;\n 2746 |           i += 1;\n 2747 |           if i != len {\n 2748 |             write!(f, \"; \")?;\n 2749 |           }\n 2750 |         }\n 2751 |         Ok(())\n 2752 |       }\n 2753 |     }\n 2754 |   }","lines":14,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/config.rs#L2741-L2754"}]},
{"id":"PERF_15","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In `map_lit` in `tokens.rs`, the iterator is consumed to build `items` after calling `map.len()`. Because the `ExactSizeIterator` bound requires consuming the iterator to get the length, the code calls `map.len()` on the already-consumed iterator value held in `let map = map.into_iter()`. In fact Rust allows calling `.len()` on an `ExactSizeIterator` without advancing it, so this is fine - but the code then calls `map.map(...)` which moves the already-checked iterator. The real issue is that `map.len()` is called AFTER `into_iter()` which on some types (e.g. a `HashMap`) produces a non-rewindable iterator; if `len()` advanced the iterator the condition would be wrong. Currently safe because `len()` doesn't advance, but fragile.","fix":"Check emptiness before consuming: `let map: Vec<_> = map.into_iter().collect(); if map.is_empty() { ... } else { let items = map.into_iter()... }`.","locations":[{"ref":"crates/tauri-utils/src/tokens.rs:113-115","code":"  113 |   let map = map.into_iter();\n  114 | \n  115 |   if map.len() > 0 {","lines":3,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-utils/src/tokens.rs#L113-L115"}]},
{"id":"PERF_16","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"In `image/mod.rs`, `Image::from_bytes` decodes the image and then collects pixels into a `Vec<u8>` using `.flat_map(|(_, _, pixel)| pixel.0).collect()`. The `.flat_map` allocates an iterator adapter per pixel. Using `img.to_rgba8().into_raw()` would be faster and cleaner.","fix":"Replace with `let img = img.to_rgba8(); let pixels = img.into_raw();` which avoids repeated iterator dispatch.","locations":[{"ref":"crates/tauri/src/image/mod.rs:79-88","code":"   79 |     let img = image::load_from_memory(bytes)?;\n   80 |     let pixels = img\n   81 |       .pixels()\n   82 |       .flat_map(|(_, _, pixel)| pixel.0)\n   83 |       .collect::<Vec<_>>();\n   84 |     Ok(Self {\n   85 |       rgba: Cow::Owned(pixels),\n   86 |       width: img.width(),\n   87 |       height: img.height(),\n   88 |     })","lines":10,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/image/mod.rs#L79-L88"}]},
{"id":"PERF_17","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"In `image/mod.rs` both `TryFrom<Image<'_>> for muda::Icon` and `TryFrom<Image<'_>> for tray_icon::Icon` call `img.rgba.to_vec()` which copies the RGBA data even when it is already an owned `Cow::Owned` vector. The `Cow` ownership could be consumed directly.","fix":"Use `img.rgba.into_owned()` instead of `img.rgba.to_vec()` to avoid an unnecessary copy when the `Cow` is already owned.","locations":[{"ref":"crates/tauri/src/image/mod.rs:141-155","code":"  141 | impl TryFrom<Image<'_>> for muda::Icon {\n  142 |   type Error = crate::Error;\n  143 | \n  144 |   fn try_from(img: Image<'_>) -> Result<Self, Self::Error> {\n  145 |     muda::Icon::from_rgba(img.rgba.to_vec(), img.width, img.height).map_err(Into::into)\n  146 |   }\n  147 | }\n  148 | \n  149 | #[cfg(all(desktop, feature = \"tray-icon\"))]\n  150 | impl TryFrom<Image<'_>> for tray_icon::Icon {\n  151 |   type Error = crate::Error;\n  152 | \n  153 |   fn try_from(img: Image<'_>) -> Result<Self, Self::Error> {\n  154 |     tray_icon::Icon::from_rgba(img.rgba.to_vec(), img.width, img.height).map_err(Into::into)\n  155 |   }","lines":15,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/image/mod.rs#L141-L155"}]},
{"id":"PERF_18","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"In `authority.rs`, the debug-only `resolve_access_message` method constructs `print_references` and `print_allowed_on` closures that each allocate and join `Vec<String>` results. These are only needed when ACL is denied and debug mode is on, which is acceptable, but `print_allowed_on` traverses the full `resolved` slice twice (once for `last_index`, once in the for loop) unnecessarily.","fix":"Use `resolved.iter().enumerate()` and compare `index + 1 == resolved.len()` instead of computing `last_index` separately.","locations":[{"ref":"crates/tauri/src/ipc/authority.rs:250-295","code":"  250 |     fn print_allowed_on(resolved: &[ResolvedCommand]) -> String {\n  251 |       if resolved.is_empty() {\n  252 |         \"command not allowed on any window/webview/URL context\".to_string()\n  253 |       } else {\n  254 |         let mut s = \"allowed on: \".to_string();\n  255 | \n  256 |         let last_index = resolved.len() - 1;\n  257 |         for (index, cmd) in resolved.iter().enumerate() {\n  258 |           let windows = cmd\n  259 |             .windows\n  260 |             .iter()\n  261 |             .map(|w| format!(\"\\\"{}\\\"\", w.as_str()))\n  262 |             .collect::<Vec<_>>()\n  263 |             .join(\", \");\n  264 |           let webviews = cmd\n  265 |             .webviews\n  266 |             .iter()\n  267 |             .map(|w| format!(\"\\\"{}\\\"\", w.as_str()))\n  268 |             .collect::<Vec<_>>()\n  269 |             .join(\", \");\n  270 | \n  271 |           s.push('[');\n  272 | \n  273 |           if !windows.is_empty() {\n  274 |             s.push_str(&format!(\"windows: {windows}, \"));\n  275 |           }\n  276 | \n  277 |           if !webviews.is_empty() {\n  278 |             s.push_str(&format!(\"webviews: {webviews}, \"));\n  279 |           }\n  280 | \n  281 |           match &cmd.context {\n  282 |             ExecutionContext::Local => s.push_str(\"URL: local\"),\n  283 |             ExecutionContext::Remote { url } => s.push_str(&format!(\"URL: {}\", url.as_str())),\n  284 |           }\n  285 | \n  286 |           s.push(']');\n  287 | \n  288 |           if index != last_index {\n  289 |             s.push_str(\", \");\n  290 |           }\n  291 |         }\n  292 | \n  293 |         s\n  294 |       }\n  295 |     }","lines":46,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/ipc/authority.rs#L250-L295"}]},
{"id":"PERF_19","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"In the tracing path (feature = \"tracing\") inside protocol::get, serde_json::to_string is called unconditionally on the request body just to record a tracing span field. This serializes potentially large byte arrays to strings even when tracing is not actively recording the span.","fix":"Use a lazy field recorder (tracing::field::debug or a closure) so serialization only occurs if the span is actually enabled.","locations":[{"ref":"crates/tauri/src/ipc/protocol.rs:66-70","code":"   66 |                 \"request\",\n   67 |                 match &request.body {\n   68 |                   super::InvokeBody::Json(j) => serde_json::to_string(j).unwrap(),\n   69 |                   super::InvokeBody::Raw(b) => serde_json::to_string(b).unwrap(),\n   70 |                 },","lines":5,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/ipc/protocol.rs#L66-L70"}]},
{"id":"PERF_20","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"replace_with_callback rebuilds the output String by copying substrings one at a time using unsafe get_unchecked. The result String is not pre-allocated with capacity, so it reallocates as it grows. The original string length is available before the loop.","fix":"Add result.reserve(original.len()) before the loop to pre-allocate approximately the right capacity, reducing reallocations.","locations":[{"ref":"crates/tauri/src/manager/mod.rs:114-124","code":"  114 | ) -> String {\n  115 |   let mut result = String::new();\n  116 |   let mut last_end = 0;\n  117 |   for (start, part) in original.match_indices(pattern) {\n  118 |     result.push_str(unsafe { original.get_unchecked(last_end..start) });\n  119 |     result.push_str(&replacement());\n  120 |     last_end = start + part.len();\n  121 |   }\n  122 |   result.push_str(unsafe { original.get_unchecked(last_end..original.len()) });\n  123 |   result\n  124 | }","lines":11,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/manager/mod.rs#L114-L124"}]},
{"id":"PERF_21","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"webviews() and windows() in AppManager clone the entire HashMap (including all Arc-wrapped entries) on every call. These methods are used in emit paths and other hot paths. Callers that only need iteration should use a different API.","fix":"Consider providing an iterate-without-clone API or document that these methods are expensive. Callers in hot emit paths should be audited.","locations":[{"ref":"crates/tauri/src/manager/mod.rs:675-685","code":"  675 |   pub fn windows(&self) -> HashMap<String, Window<R>> {\n  676 |     self.window.windows_lock().clone()\n  677 |   }\n  678 | \n  679 |   pub fn get_webview(&self, label: &str) -> Option<Webview<R>> {\n  680 |     self.webview.webviews_lock().get(label).cloned()\n  681 |   }\n  682 | \n  683 |   pub fn webviews(&self) -> HashMap<String, Webview<R>> {\n  684 |     self.webview.webviews_lock().clone()\n  685 |   }","lines":11,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/manager/mod.rs#L675-L685"}]},
{"id":"PERF_22","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"eval_script_all in WebviewManager clones the entire webviews HashMap values into a Vec before iterating, holding the mutex lock while doing so. Under high webview counts this causes an O(n) allocation while holding the lock.","fix":"Collect labels instead of full Webview clones, then look up each webview without holding the lock, or accept the trade-off and document it.","locations":[{"ref":"crates/tauri/src/manager/webview.rs:693-699","code":"  693 |   pub fn eval_script_all<S: Into<String>>(&self, script: S) -> crate::Result<()> {\n  694 |     let script = script.into();\n  695 |     let webviews = self.webviews_lock().values().cloned().collect::<Vec<_>>();\n  696 |     webviews\n  697 |       .iter()\n  698 |       .try_for_each(|webview| webview.eval(&script))\n  699 |   }","lines":7,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/manager/webview.rs#L693-L699"}]},
{"id":"PERF_23","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`Menu::get()` and `Submenu::get()` call `self.items()` which dispatches to the main thread, iterates all items, then performs a linear scan. For menus with many items this is O(n) and incurs a main-thread hop per lookup. The `unwrap_or_default()` on the error silently swallows main-thread communication failures.","fix":"Consider using `muda`'s direct item-by-id lookup if the upstream API provides it, or at minimum document the O(n) complexity and the silent error swallowing.","locations":[{"ref":"crates/tauri/src/menu/menu.rs:363-373","code":"  363 |   pub fn get<'a, I>(&self, id: &'a I) -> Option<MenuItemKind<R>>\n  364 |   where\n  365 |     I: ?Sized,\n  366 |     MenuId: PartialEq<&'a I>,\n  367 |   {\n  368 |     self\n  369 |       .items()\n  370 |       .unwrap_or_default()\n  371 |       .into_iter()\n  372 |       .find(|i| i.id() == &id)\n  373 |   }","lines":11,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/menu/menu.rs#L363-L373"},{"ref":"crates/tauri/src/menu/submenu.rs:324-334","code":"  324 |   pub fn get<'a, I>(&self, id: &'a I) -> Option<MenuItemKind<R>>\n  325 |   where\n  326 |     I: ?Sized,\n  327 |     MenuId: PartialEq<&'a I>,\n  328 |   {\n  329 |     self\n  330 |       .items()\n  331 |       .unwrap_or_default()\n  332 |       .into_iter()\n  333 |       .find(|i| i.id() == &id)\n  334 |   }","lines":11,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/menu/submenu.rs#L324-L334"}]},
{"id":"PERF_24","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"Scope::allowed_patterns and Scope::forbidden_patterns clone the entire HashSet on every call (lines 247-253). If called frequently (e.g. inside a hot request path) this is an unnecessary heap allocation. The public API exposes cloned sets rather than references, so callers cannot iterate without cloning.","fix":"Consider adding an iterate API (e.g. a method taking a closure) that holds the lock only during iteration, avoiding the full clone.","locations":[{"ref":"crates/tauri/src/scope/fs.rs:246-253","code":"  246 |   /// The list of allowed patterns.\n  247 |   pub fn allowed_patterns(&self) -> HashSet<Pattern> {\n  248 |     self.inner.allowed_patterns.lock().unwrap().clone()\n  249 |   }\n  250 | \n  251 |   /// The list of forbidden patterns.\n  252 |   pub fn forbidden_patterns(&self) -> HashSet<Pattern> {\n  253 |     self.inner.forbidden_patterns.lock().unwrap().clone()","lines":8,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/scope/fs.rs#L246-L253"}]},
{"id":"PERF_25","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`Window::webviews()` acquires the global webviews lock, iterates all webviews in the process, filters by label, and collects into a `Vec`. This is called from `is_webview_window` which is itself called on every IPC command dispatch. For applications with many webviews this is an O(n) lock-under-contention path on every IPC call.","fix":"Cache the `is_webview_window` flag as an `AtomicBool` on `Window` at construction time, or maintain a per-window webview count so the check is O(1) without locking the global map.","locations":[{"ref":"crates/tauri/src/window/mod.rs:1162-1171","code":" 1162 |   pub fn webviews(&self) -> Vec<Webview<R>> {\n 1163 |     self\n 1164 |       .manager\n 1165 |       .webview\n 1166 |       .webviews_lock()\n 1167 |       .values()\n 1168 |       .filter(|w| w.window_label() == self.label())\n 1169 |       .cloned()\n 1170 |       .collect()\n 1171 |   }","lines":10,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/window/mod.rs#L1162-L1171"},{"ref":"crates/tauri/src/window/mod.rs:1173-1175","code":" 1173 |   pub(crate) fn is_webview_window(&self) -> bool {\n 1174 |     self.webviews().iter().all(|w| w.label() == self.label())\n 1175 |   }","lines":3,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri/src/window/mod.rs#L1173-L1175"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"In kmp/mod.rs, the `else` branch that fires when p_i == 0 contains the dead assignment `p_i = 0;`. Since the condition is `if p_i == 0`, assigning 0 to p_i is a no-op that only adds noise.","fix":"Remove the `p_i = 0;` line. The branch only needs `t_i += 1;`.","locations":[{"ref":"crates/tauri-bundler/src/bundle/kmp/mod.rs:29","code":"   29 |         p_i = 0;","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-bundler/src/bundle/kmp/mod.rs#L29"}]},

{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"The action_if_err builder method in SectionItem is commented out but the action_if_err field and run_action_if_err method remain live code. This creates an always-None field and a method that can never have any effect.","fix":"Either restore the action_if_err builder method (removing the comment) or remove the field and run_action_if_err method entirely.","locations":[{"ref":"crates/tauri-cli/src/info/mod.rs:129","code":"  129 |   action_if_err: Option<Box<dyn FnMut() -> ActionResult>>,","lines":1,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/info/mod.rs#L129"},{"ref":"crates/tauri-cli/src/info/mod.rs:159-162","code":"  159 |   // fn action_if_err<F: FnMut() -> ActionResult + 'static>(mut self, action: F) -> Self {\n  160 |   //   self.action_if_err = Some(Box::new(action));\n  161 |   //   self\n  162 |   // }","lines":4,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/info/mod.rs#L159-L162"},{"ref":"crates/tauri-cli/src/info/mod.rs:177-183","code":"  177 |   fn run_action_if_err(&mut self) {\n  178 |     let mut res = ActionResult::None;\n  179 |     if let Some(action) = &mut self.action_if_err {\n  180 |       res = action();\n  181 |     }\n  182 |     self.apply_action_result(res);\n  183 |   }","lines":7,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/crates/tauri-cli/src/info/mod.rs#L177-L183"}]},

{"id":"DEAD_7","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In the streaming example, `random_boundary()` builds the hex string using `.fold(String::new(), |mut a, x| { a.push_str(x.as_str()); a })` with an intermediate `format!` per byte. This is equivalent to a `collect::<String>()` but allocates one intermediate `String` per byte. The fold pattern is unnecessarily verbose.","fix":"Replace with `x.iter().map(|b| format!(\"{b:x}\")).collect::<String>()` or use `hex::encode(&x)` if a hex crate is available.","locations":[{"ref":"examples/streaming/main.rs:157-167","code":"  157 | fn random_boundary() -> String {\n  158 |   let mut x = [0_u8; 30];\n  159 |   getrandom::fill(&mut x).expect(\"failed to get random bytes\");\n  160 |   (x[..])\n  161 |     .iter()\n  162 |     .map(|&x| format!(\"{x:x}\"))\n  163 |     .fold(String::new(), |mut a, x| {\n  164 |       a.push_str(x.as_str());\n  165 |       a\n  166 |     })\n  167 | }","lines":11,"link":"https://github.com/tauri-apps/tauri/blob/1fbadc8776b71c94ed858ba18721409e45696ff3/examples/streaming/main.rs#L157-L167"}]},
