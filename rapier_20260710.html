<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e2e8f0;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}

.group-label{font-size:.8rem;color:#94a3b8;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}

.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}

.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}

.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}

<script type="application/json" id="D">[{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`msh.rs::parse` reads four i32 counts (nvertex, nnormal, ntexcoord, nface) from untrusted bytes and\ncasts them directly to `usize` with `as usize`. In Rust, a negative i32 (e.g. -1) cast to usize\non a 64-bit target produces 4294967295 (wrapping). The subsequent `vec![0.0f32; nvertex * 3]`\nthen tries to allocate ~16 GiB, panicking with OOM. Additionally, if both nvertex and nface are\nlarge but the file is truncated, `read_exact` will return an I/O error rather than panic, but the\nallocation attempt itself can trigger an abort before that.","fix":"Validate each count is non-negative before casting:\n\n```\nlet raw = cur.read_i32::<LittleEndian>()?;\nif raw < 0 { return Err(std::io::Error::new(std::io::ErrorKind::InvalidData, \"negative count\")); }\nlet nvertex = raw as usize;\n```\n\nApply the same pattern to `nnormal`, `ntexcoord`, and `nface`.","locations":[{"ref":"crates/mjcf-rs/src/msh.rs:38-49","code":"   38 |     let nvertex = cur.read_i32::<LittleEndian>()? as usize;\n   39 |     let nnormal = cur.read_i32::<LittleEndian>()? as usize;\n   40 |     let ntexcoord = cur.read_i32::<LittleEndian>()? as usize;\n   41 |     let nface = cur.read_i32::<LittleEndian>()? as usize;\n   42 | \n   43 |     let mut vertices = vec![0.0f32; nvertex * 3];\n   44 |     cur.read_exact(bytemuck_safe_cast(&mut vertices))?;\n   45 |     let mut normals = vec![0.0f32; nnormal * 3];\n   46 |     cur.read_exact(bytemuck_safe_cast(&mut normals))?;\n   47 |     let mut texcoords = vec![0.0f32; ntexcoord * 2];\n   48 |     cur.read_exact(bytemuck_safe_cast(&mut texcoords))?;\n   49 |     let mut faces = vec![0i32; nface * 3];","lines":12,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/crates/mjcf-rs/src/msh.rs#L38-L49"}]},{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`RigidBody::with_ref` and `with_mut` call `.expect(...)` on the result of `RigidBodySet::get`/`get_mut` when the backing is `InSet`. If a body is removed from the set while a `RigidBody` view is still alive (which Python's GC allows — the view and the set are independent Python objects), the next property access on the view panics with a thread-local Rust panic that PyO3 converts to `SystemError` or `PanicException`, rather than a clean `InvalidHandle` exception. The docstring only says \"panics, surfacing as a Python exception\", but `PanicException` is not a subclass of `rapier.InvalidHandle` and is harder to catch.","fix":"Replace the two `.expect(...)` calls with a `match`/`?` that returns a proper `PyResult` (propagate up through `with_ref`/`with_mut` by making their return type `PyResult<R>`):\n\n```rust\nfn with_ref<R>(&self, f: impl FnOnce(&rapier::dynamics::RigidBody) -> PyResult<R>) -> PyResult<R> {\n    match &self.backing {\n        RigidBodyBacking::Owned(b) => f(b),\n        RigidBodyBacking::InSet { set, handle } => Python::with_gil(|py| {\n            let set = set.bind(py).borrow();\n            let body = set.0.get(*handle).ok_or_else(|| {\n                crate::errors::InvalidHandle::new_err(format!(\n                    \"RigidBody refers to a body that was removed from its set: {:?}\",\n                    handle.into_raw_parts()\n                ))\n            })?;\n            f(body)\n        }),\n    }\n}\n```\nAll callers must then propagate `PyResult` with `?`. This is a significant refactor but converts a panic into a proper, catchable Python exception.","locations":[{"ref":"python/rapier-py-3d/src/dynamics.rs:1476-1504","code":" 1476 |     fn with_ref<R>(&self, f: impl FnOnce(&rapier::dynamics::RigidBody) -> R) -> R {\n 1477 |         match &self.backing {\n 1478 |             RigidBodyBacking::Owned(b) => f(b),\n 1479 |             RigidBodyBacking::InSet { set, handle } => Python::with_gil(|py| {\n 1480 |                 let set = set.bind(py).borrow();\n 1481 |                 let body = set\n 1482 |                     .0\n 1483 |                     .get(*handle)\n 1484 |                     .expect(\"RigidBody refers to a body that was removed from its set\");\n 1485 |                 f(body)\n 1486 |             }),\n 1487 |         }\n 1488 |     }\n 1489 | \n 1490 |     /// Run `f` with a mutable reference to the underlying body, writing\n 1491 |     /// straight through to the set for an `InSet` view.\n 1492 |     fn with_mut<R>(&mut self, f: impl FnOnce(&mut rapier::dynamics::RigidBody) -> R) -> R {\n 1493 |         match &mut self.backing {\n 1494 |             RigidBodyBacking::Owned(b) => f(b),\n 1495 |             RigidBodyBacking::InSet { set, handle } => Python::with_gil(|py| {\n 1496 |                 let mut set = set.bind(py).borrow_mut();\n 1497 |                 let body = set\n 1498 |                     .0\n 1499 |                     .get_mut(*handle)\n 1500 |                     .expect(\"RigidBody refers to a body that was removed from its set\");\n 1501 |                 f(body)\n 1502 |             }),\n 1503 |         }\n 1504 |     }","lines":29,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/dynamics.rs#L1476-L1504"}]},{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`with_ref` and `with_mut` call `.expect(...)` on the result of `ColliderSet::get` / `get_mut`, which panics if the collider has already been removed from its set. A Python user can easily trigger this by removing a collider from its `ColliderSet` and then reading any property through an old `Collider` view object. Because `Collider` views hold a `Py<ColliderSet>` handle and the rapier handle only, there is no way to detect staleness without trying the lookup - but the correct response is a Python exception, not a process abort.","fix":"Replace the `.expect(...)` calls with error-propagating alternatives. Because `with_ref` / `with_mut` currently return `R` directly they must be changed to `PyResult<R>`:\n\n```rust\nfn with_ref<R>(&self, f: impl FnOnce(&rapier::geometry::Collider) -> R) -> PyResult<R> {\n    match &self.backing {\n        ColliderBacking::Owned(c) => Ok(f(c)),\n        ColliderBacking::InSet { set, handle } => Python::with_gil(|py| {\n            let set = set.bind(py).borrow();\n            let c = set.0.get(*handle).ok_or_else(|| {\n                crate::errors::InvalidHandle::new_err(\"collider was removed from its set\")\n            })?;\n            Ok(f(c))\n        }),\n    }\n}\n```\nAll call-sites (every `#[getter]`, `#[setter]`, etc.) would propagate `PyResult` automatically since they already return `PyResult<_>` or can be changed to.","locations":[{"ref":"python/rapier-py-3d/src/geometry.rs:3030-3032","code":" 3030 |                     .get(*handle)\n 3031 |                     .expect(\"Collider refers to a collider that was removed from its set\");\n 3032 |                 f(c)","lines":3,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/geometry.rs#L3030-L3032"},{"ref":"python/rapier-py-3d/src/geometry.rs:3044-3047","code":" 3044 |                 let c = set\n 3045 |                     .0\n 3046 |                     .get_mut(*handle)\n 3047 |                     .expect(\"Collider refers to a collider that was removed from its set\");","lines":4,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/geometry.rs#L3044-L3047"}]},{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"`quat_from_euler` in `parse_utils.rs` indexes into a fixed-length `[f64; 3]` array using the\nloop index `i` over `seq.chars().enumerate()`. If `eulerseq` contains more than 3 characters\n(e.g. `eulerseq=\"xyzx\"` from a malformed or malicious MJCF file) the access `angles[i]` with\ni >= 3 will panic with an index-out-of-bounds.","fix":"Cap the iteration at 3 elements:\n\n```\nfor (i, ch) in seq.chars().take(3).enumerate() {\n```\n\nAlternatively validate `seq` length in `parse_compiler` and return `ParseError::BadAttributeValue`.","locations":[{"ref":"crates/mjcf-rs/src/loader/parse_utils.rs:263-278","code":"  263 | fn quat_from_euler(angles: [f64; 3], seq: &str) -> DQuat {\n  264 |     let mut q = DQuat::IDENTITY;\n  265 |     for (i, ch) in seq.chars().enumerate() {\n  266 |         let angle = angles[i];\n  267 |         let intrinsic = ch.is_ascii_lowercase();\n  268 |         let axis = match ch.to_ascii_lowercase() {\n  269 |             'x' => DVec3::X,\n  270 |             'y' => DVec3::Y,\n  271 |             'z' => DVec3::Z,\n  272 |             _ => continue,\n  273 |         };\n  274 |         let r = DQuat::from_axis_angle(axis, angle);\n  275 |         q = if intrinsic { q * r } else { r * q };\n  276 |     }\n  277 |     q.normalize()\n  278 | }","lines":16,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/crates/mjcf-rs/src/loader/parse_utils.rs#L263-L278"}]},{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`smooth_vertex_normals` in `normals.rs` indexes into `vertices` and `rep` using the u32 triangle\nindex values cast to usize (lines 57-59 and 63). If any index in `indices` is out of range for\n`vertices`, this panics. The function is a public API with no contract enforcing this invariant\nin its signature, so callers from external mesh files (STL/OBJ/MSH) can trigger the panic via\nmalformed index data.","fix":"Add a bounds check at entry:\n\n```\nlet n_verts = vertices.len();\nfor tri in indices {\n    if tri.iter().any(|&i| i as usize >= n_verts) {\n        return vec![[0.0; 3]; n_verts]; // or return Result\n    }\n}\n```","locations":[{"ref":"crates/mjcf-rs/src/normals.rs:57-79","code":"   57 |         let a = vertices[t[0] as usize];\n   58 |         let b = vertices[t[1] as usize];\n   59 |         let c = vertices[t[2] as usize];\n   60 |         // Un-normalized cross product = 2·area·unit_normal → area weighting.\n   61 |         face_n.push(cross(sub(b, a), sub(c, a)));\n   62 |         for &corner in t {\n   63 |             incident[rep[corner as usize]].push(fi);\n   64 |         }\n   65 |     }\n   66 | \n   67 |     // Blend each corner from the incident faces within the crease angle.\n   68 |     let mut out = vec![[0.0f32; 3]; vertices.len()];\n   69 |     for (fi, t) in indices.iter().enumerate() {\n   70 |         let nf = normalize_or(face_n[fi], [0.0, 0.0, 1.0]);\n   71 |         for &corner in t {\n   72 |             let mut acc = [0.0f64; 3];\n   73 |             for &gf in &incident[rep[corner as usize]] {\n   74 |                 if smooth || dot(nf, normalize_or(face_n[gf], nf)) >= CREASE_COS {\n   75 |                     acc = add(acc, face_n[gf]);\n   76 |                 }\n   77 |             }\n   78 |             let n = normalize_or(acc, nf);\n   79 |             out[corner as usize] = [n[0] as f32, n[1] as f32, n[2] as f32];","lines":23,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/crates/mjcf-rs/src/normals.rs#L57-L79"}]},{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`insert_using_multibody_joints` in `rapier3d-urdf/src/lib.rs` calls\n`joint_set.get_mut(joint).unwrap_or_else(|| unreachable!())` immediately after inserting the\njoint and getting back `Some(handle)`. While the assertion is logically sound today, any future\nrefactor that moves insertion and retrieval apart, or any bug in rapier's internal bookkeeping,\nconverts the `unreachable!()` into a panic in production code. The `unreachable!()` macro\nunconditionally panics with no recovery path.","fix":"Replace with a graceful degradation that skips the self-contacts configuration rather than panicking:\n\n```\n// Before\nlet (multibody, _) = joint_set.get_mut(joint).unwrap_or_else(|| unreachable!());\n\n// After\nif let Some((multibody, _)) = joint_set.get_mut(joint) {\n    multibody.set_self_contacts_enabled(\n        !multibody_options.contains(UrdfMultibodyOptions::DISABLE_SELF_CONTACTS),\n    );\n}\n```","locations":[{"ref":"crates/rapier3d-urdf/src/lib.rs:538","code":"  538 |                     let (multibody, _) = joint_set.get_mut(joint).unwrap_or_else(|| unreachable!());","lines":1,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/crates/rapier3d-urdf/src/lib.rs#L538"}]},{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"examples3d-f64/debug_serialized3.rs calls bincode::deserialize(&bytes).unwrap() (line 21) without any error handling. If state.bin is present but corrupted or from an incompatible rapier version, this panics the entire testbed instead of printing a user-friendly message.","fix":"Use match or ?, consistent with how the surrounding examples handle deserialization errors (see debug_deserialize3.rs:30-65 for the correct pattern).","locations":[{"ref":"examples3d-f64/debug_serialized3.rs:21","code":"   21 |     let state: State = bincode::deserialize(&bytes).unwrap();","lines":1,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/examples3d-f64/debug_serialized3.rs#L21"}]},{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"In voxels3.rs the OBJ scaling step divides by `diag` (line 97), which is `(aabb.maxs - aabb.mins).length()`. If an OBJ file contains only a single unique vertex or all vertices are coincident, the AABB is a point and diag == 0.0, causing a division by zero that produces NaN/Inf in all vertex coordinates. This silently corrupts the mesh without any error.","fix":"Guard the division: `if diag > 1e-9 { vertices.iter_mut().for_each(|p| *p = (*p - center_v) * 6.0 / diag); }` and skip or warn on degenerate meshes.","locations":[{"ref":"examples3d/voxels3.rs:93-97","code":"   93 |                 let diag = (aabb.maxs - aabb.mins).length();\n   94 | \n   95 |                 vertices\n   96 |                     .iter_mut()\n   97 |                     .for_each(|p| *p = (*p - center_v) * 6.0 / diag);","lines":5,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/examples3d/voxels3.rs#L93-L97"}]},{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"All `Mutex::lock().unwrap()` calls across `PyEventHandler`, `PyPhysicsHooks`, `ChannelEventCollector`, and `ChannelEventCollectorAdapter` will panic if the mutex is poisoned. A mutex is poisoned when a thread panics while holding it. Since `PhysicsPipeline::step` can run callbacks on worker threads (with the GIL re-acquired inside `Python::with_gil`), a Rust panic in another Mutex-holding context could poison the slot and cause all subsequent `lock().unwrap()` calls to panic — converting one error into an unrecoverable panic cascade rather than a clean error.","fix":"Use `.unwrap_or_else` or handle the `PoisonError` explicitly:\n\n```rust\n// Instead of:\nlet slot = self.err_slot.lock().unwrap();\n// Use:\nlet Ok(slot) = self.err_slot.lock() else { return; };\n```\nFor drain/clear methods on `ChannelEventCollector` that are called from Python, propagate as a `PyResult`:\n```rust\nfn drain_collision_events(&self) -> PyResult<Vec<CollisionEvent>> {\n    self.collisions.lock()\n        .map(|mut g| std::mem::take(&mut *g))\n        .map_err(|_| pyo3::exceptions::PyRuntimeError::new_err(\"event collector mutex poisoned\"))\n}\n```","locations":[{"ref":"python/rapier-py-3d/src/events_hooks.rs:525","code":"  525 |             let slot = self.err_slot.lock().unwrap();","lines":1,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/events_hooks.rs#L525"},{"ref":"python/rapier-py-3d/src/events_hooks.rs:543","code":"  543 |                 let mut s = self.err_slot.lock().unwrap();","lines":1,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/events_hooks.rs#L543"},{"ref":"python/rapier-py-3d/src/events_hooks.rs:645","code":"  645 |         std::mem::take(&mut *self.collisions.lock().unwrap())","lines":1,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/events_hooks.rs#L645"},{"ref":"python/rapier-py-3d/src/events_hooks.rs:660-661","code":"  660 |         self.collisions.lock().unwrap().clear();\n  661 |         self.forces.lock().unwrap().clear();","lines":2,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/events_hooks.rs#L660-L661"}]},{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"`TriMesh::vertices` calls `.expect(\"contiguous ndarray\")` on `PyArray2::from_vec2_bound`. The argument is a `Vec<Vec<Real>>` built from scratch here, so it should always succeed - but if the upstream numpy API contract ever changes or the `Vec` is empty in an unexpected way the process will abort rather than raise a Python exception. Same pattern is used in `TriMesh::indices`, `Voxels::centers`, `HeightField::heights`, `ConvexPolyhedron::points`, and `ConvexPolyhedron::indices`.","fix":"Before: `PyArray2::from_vec2_bound(py, &v).expect(\"contiguous ndarray\")`\nAfter:\n```rust\nPyArray2::from_vec2_bound(py, &v)\n    .map_err(|e| PyValueError::new_err(format!(\"failed to build ndarray: {e}\")))?\n```\nAll affected getters must change their return type to `PyResult<Bound<'py, PyArray2<_>>>`.","locations":[{"ref":"python/rapier-py-3d/src/geometry.rs:1801-1801","code":" 1801 |         PyArray2::from_vec2_bound(py, &v).expect(\"contiguous ndarray\")","lines":1,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/geometry.rs#L1801"},{"ref":"python/rapier-py-3d/src/geometry.rs:1808-1808","code":" 1808 |         PyArray2::from_vec2_bound(py, &v).expect(\"contiguous ndarray\")","lines":1,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/geometry.rs#L1808"},{"ref":"python/rapier-py-3d/src/geometry.rs:1863-1863","code":" 1863 |         crate::numpy::PyArray2::from_vec2_bound(py, &v).expect(\"contiguous ndarray\")","lines":1,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/geometry.rs#L1863"},{"ref":"python/rapier-py-3d/src/geometry.rs:2837-2838","code":" 2837 |         PyArray2::from_vec2_bound(py, &flat.chunks(3).map(|c| c.to_vec()).collect::<Vec<_>>())\n 2838 |             .expect(\"contiguous 2D ndarray\")","lines":2,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/geometry.rs#L2837-L2838"},{"ref":"python/rapier-py-3d/src/geometry.rs:2866-2866","code":" 2866 |         PyArray2::from_vec2_bound(py, &tris).expect(\"contiguous 2D ndarray\")","lines":1,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/geometry.rs#L2866"},{"ref":"python/rapier-py-3d/src/geometry.rs:2887-2887","code":" 2887 |         crate::numpy::PyArray2::from_vec2_bound(py, &rows).expect(\"contiguous 2D ndarray\")","lines":1,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/geometry.rs#L2887"}]},{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`ccd2.rs` calls `.unwrap()` twice on each collision-event's collider handles (lines 108 and 110,\n114 and 116). A collider could have been removed between when the event was queued and when the\nchannel is drained, causing a panic. In this particular example removal never happens, but the\npattern is fragile and copy-pasted into any derivative example could cause a real crash.","fix":"Use `if let` or `?` chaining:\n\n  if let Some(col1) = world.colliders.get(prox.collider1())\n      && let Some(parent1) = col1.parent()\n  {\n      ...\n  }","locations":[{"ref":"examples2d/ccd2.rs:105-116","code":"  105 |                 let parent_handle1 = world\n  106 |                     .colliders\n  107 |                     .get(prox.collider1())\n  108 |                     .unwrap()\n  109 |                     .parent()\n  110 |                     .unwrap();\n  111 |                 let parent_handle2 = world\n  112 |                     .colliders\n  113 |                     .get(prox.collider2())\n  114 |                     .unwrap()\n  115 |                     .parent()\n  116 |                     .unwrap();","lines":12,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/examples2d/ccd2.rs#L105-L116"}]},{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`convex_polygons2.rs` calls `ColliderBuilder::convex_hull(&points).unwrap()` on 10 random\n2-D points. `convex_hull` returns `None` when the point set is degenerate (collinear, or all\npoints coincide). With the seeded PRNG this never triggers in practice, but if the seed or\nthe point-generation logic ever changes, the example will panic.","fix":"Replace `.unwrap()` with `.unwrap_or_else(|| ColliderBuilder::ball(0.1))` or skip the body\nentirely with an `if let Some(c) = ... { world.insert(...); }` guard.","locations":[{"ref":"examples2d/convex_polygons2.rs:61","code":"   61 |             let collider = ColliderBuilder::convex_hull(&points).unwrap();","lines":1,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/examples2d/convex_polygons2.rs#L61"}]},{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"examples2d/utils/svg.rs calls usvg::Tree::from_str(...).unwrap() on a bundled SVG constant (line 47). Although the SVG is embedded at compile time, any future change to the string or usvg API would cause a runtime panic rather than a compile-time or startup error.","fix":"Replace .unwrap() with .expect(\"embedded SVG failed to parse\") to provide a clearer message, or parse the tree once at initialization and cache it.","locations":[{"ref":"examples2d/utils/svg.rs:47","code":"   47 |     let rtree = usvg::Tree::from_str(svg_str, &opt).unwrap();","lines":1,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/examples2d/utils/svg.rs#L47"}]},{"id":"PANIC_14","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"examples3d/dynamic_trimesh3.rs (also reached from convex_decomposition3.rs) opens each .obj file with File::open(obj_path).unwrap() (line 61). If any asset file is missing (e.g. after a fresh checkout without assets), the whole example panics instead of printing a useful error and skipping.","fix":"Match on the Result and print an error + continue to the next geometry if the file cannot be opened, consistent with the early-return pattern used in debug_serialized3.rs.","locations":[{"ref":"examples3d/dynamic_trimesh3.rs:61","code":"   61 |         let input = BufReader::new(File::open(obj_path).unwrap());","lines":1,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/examples3d/dynamic_trimesh3.rs#L61"}]},{"id":"PANIC_15","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"examples3d/dynamic_trimesh3.rs converts a flat polygon-vertex-index list with .chunks(3) (line 92) and then hard-indexes [v[0], v[1], v[2]] (line 93). If the OBJ file contains polygons with more or fewer than 3 vertices (quads are common), chunks(3) silently produces wrong triangles and the last partial chunk causes an index-out-of-bounds panic.","fix":"Triangulate quads (and larger polys) explicitly by fan-decomposition before chunking, or use a crate that handles OBJ polygons. At minimum, assert or filter that every chunk has exactly 3 elements.","locations":[{"ref":"examples3d/dynamic_trimesh3.rs:91-93","code":"   91 |             let indices: Vec<_> = indices\n   92 |                 .chunks(3)\n   93 |                 .map(|idx| [idx[0] as u32, idx[1] as u32, idx[2] as u32])","lines":3,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/examples3d/dynamic_trimesh3.rs#L91-L93"}]},{"id":"PANIC_16","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"mjcf3.rs (line 22) and urdf3.rs (line 24) both call `.unwrap()` on file loading. If the asset files are absent (e.g., fresh checkout without downloading assets), the examples panic instead of producing a helpful error message. These are example entry points that new users run.","fix":"Replace `.unwrap()` with `.expect(\"asset not found - run `download_assets.sh`\")` or propagate the error via `?` since both functions already return `anyhow::Result`.","locations":[{"ref":"examples3d/mjcf3.rs:22","code":"   22 |         MjcfRobot::from_file(\"assets/3d/agility_cassie/scene.xml\", options).unwrap();","lines":1,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/examples3d/mjcf3.rs#L22"},{"ref":"examples3d/urdf3.rs:24","code":"   24 |         UrdfRobot::from_file(\"assets/3d/T12/urdf/T12.URDF\", options, None).unwrap();","lines":1,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/examples3d/urdf3.rs#L24"}]},{"id":"PANIC_17","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"stress_tests/convex_polyhedron3.rs line 55 calls `ColliderBuilder::round_convex_hull(&points, border_rad).unwrap()`. While the seed is fixed (StdRng::seed_from_u64(0)), if the random point cloud happens to be planar or nearly degenerate, the convex hull builder may return an error, causing a panic. There is no documented guarantee that the seeded sequence is always non-degenerate.","fix":"Replace `.unwrap()` with `.expect(\"convex hull failed\")` or handle the error by skipping degenerate point sets with a warning.","locations":[{"ref":"examples3d/stress_tests/convex_polyhedron3.rs:55","code":"   55 |                 let collider = ColliderBuilder::round_convex_hull(&points, border_rad).unwrap();","lines":1,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/examples3d/stress_tests/convex_polyhedron3.rs#L55"}]},{"id":"PANIC_18","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"In utils/character.rs line 151, `character_body.colliders()[0]` is an unchecked index into the body's collider list. If the character rigid body has no colliders attached (which is possible if the caller builds the body without any collider, or after collider removal), this panics with an index out of bounds.","fix":"Use `.colliders().first().expect(\"character body must have at least one collider\")` or handle the empty-collider case explicitly.","locations":[{"ref":"examples3d/utils/character.rs:151","code":"  151 |     let character_collider = &phx.colliders[character_body.colliders()[0]];","lines":1,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/examples3d/utils/character.rs#L151"}]},{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`extract_indices` silently truncates large `i64` index values when casting to `u32`. If Python passes an index value larger than `u32::MAX` (e.g. 4294967296) it will be silently wrapped, producing an invalid triangle index that can later cause out-of-bounds access or incorrect geometry with no error raised.","fix":"Add range-checking before the cast:\n```rust\nfor chunk in slice.chunks_exact(3) {\n    let check = |v: i64| -> PyResult<u32> {\n        u32::try_from(v).map_err(|_| PyValueError::new_err(\n            format!(\"index {v} out of u32 range\")\n        ))\n    };\n    out.push([check(chunk[0])?, check(chunk[1])?, check(chunk[2])?]);\n}\n```","locations":[{"ref":"python/rapier-py-3d/src/geometry.rs:46-48","code":"   46 |         for chunk in slice.chunks_exact(3) {\n   47 |             out.push([chunk[0] as u32, chunk[1] as u32, chunk[2] as u32]);\n   48 |         }","lines":3,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/geometry.rs#L46-L48"}]},{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`SharedShape::voxels` and `Collider::voxels` cast `i64` coordinates to the `IVector` element type with `as _` (lines 2288 and 3665), which silently truncates if the coordinate overflows the target integer width (typically `i32` on 64-bit platforms for parry's `IVector`). No bounds check or error is raised.","fix":"Check the element type width and validate before casting:\n```rust\nlet coords: Vec<rapier::math::IVector> = raw\n    .iter()\n    .map(|&(x, y, z)| -> PyResult<rapier::math::IVector> {\n        let cx = i32::try_from(x).map_err(|_| PyValueError::new_err(format!(\"voxel x={x} out of range\")))?;\n        let cy = i32::try_from(y).map_err(|_| PyValueError::new_err(format!(\"voxel y={y} out of range\")))?;\n        let cz = i32::try_from(z).map_err(|_| PyValueError::new_err(format!(\"voxel z={z} out of range\")))?;\n        Ok(rapier::math::IVector::new(cx, cy, cz))\n    })\n    .collect::<PyResult<_>>()?;\n```","locations":[{"ref":"python/rapier-py-3d/src/geometry.rs:2285-2293","code":" 2285 |         let raw: Vec<(i64, i64, i64)> = grid_coords.extract()?;\n 2286 |         let coords: Vec<rapier::math::IVector> = raw\n 2287 |             .iter()\n 2288 |             .map(|&(x, y, z)| rapier::math::IVector::new(x as _, y as _, z as _))\n 2289 |             .collect();\n 2290 |         Ok(Self(rapier::parry::shape::SharedShape::voxels(\n 2291 |             voxel_size.0.into(),\n 2292 |             &coords,\n 2293 |         )))","lines":9,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/geometry.rs#L2285-L2293"},{"ref":"python/rapier-py-3d/src/geometry.rs:3661-3669","code":" 3661 |     fn voxels(voxel_size: PyVector, grid_coords: &Bound<'_, PyAny>) -> PyResult<ColliderBuilder> {\n 3662 |         let raw: Vec<(i64, i64, i64)> = grid_coords.extract()?;\n 3663 |         let coords: Vec<rapier::math::IVector> = raw\n 3664 |             .iter()\n 3665 |             .map(|&(x, y, z)| rapier::math::IVector::new(x as _, y as _, z as _))\n 3666 |             .collect();\n 3667 |         Ok(ColliderBuilder {\n 3668 |             builder: rapier::geometry::ColliderBuilder::voxels(voxel_size.0.into(), &coords),\n 3669 |         })","lines":9,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/geometry.rs#L3661-L3669"}]},{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"`merged_actuator_proto` in `defaults.rs` applies the kind-specific actuator prototype (e.g.\n`motor`, `position`) first, then unconditionally applies the `general` prototype on top of it.\nThis reverses the MJCF inheritance order: kind-specific defaults are supposed to be more specific\nand thus take priority over `<default><general>`. As coded, a `<default><general kp=\"2.0\"/>` will\noverwrite any `<default><motor kp=\"1.0\"/>`, which is the opposite of the intended semantics.","fix":"Apply `general` first, then overlay the kind-specific proto on top:\n\n```\nfor c in self.class_chain(class).into_iter().rev() {\n    if let Some(d) = self.defaults.get(&c) {\n        if let Some(p) = &d.general {\n            acc = merge_actuator_proto(Some(acc), p.clone());\n        }\n        if let Some(p) = pick(d) {\n            acc = merge_actuator_proto(Some(acc), p);\n        }\n    }\n}\n```","locations":[{"ref":"crates/mjcf-rs/src/loader/defaults.rs:427-452","code":"  427 |     pub(super) fn merged_actuator_proto(\n  428 |         &self,\n  429 |         kind: ActuatorKind,\n  430 |         class: Option<&str>,\n  431 |     ) -> ActuatorPrototype {\n  432 |         let mut acc = ActuatorPrototype::default();\n  433 |         let pick = |d: &DefaultsClass| match kind {\n  434 |             ActuatorKind::Motor => d.motor.clone(),\n  435 |             ActuatorKind::Position => d.position.clone(),\n  436 |             ActuatorKind::Velocity => d.velocity.clone(),\n  437 |             ActuatorKind::IntVelocity => d.intvelocity.clone(),\n  438 |             ActuatorKind::Damper => d.damper.clone(),\n  439 |             _ => d.general.clone(),\n  440 |         };\n  441 |         for c in self.class_chain(class).into_iter().rev() {\n  442 |             if let Some(d) = self.defaults.get(&c) {\n  443 |                 if let Some(p) = pick(d) {\n  444 |                     acc = merge_actuator_proto(Some(acc), p);\n  445 |                 }\n  446 |                 if let Some(p) = &d.general {\n  447 |                     acc = merge_actuator_proto(Some(acc), p.clone());\n  448 |                 }\n  449 |             }\n  450 |         }\n  451 |         acc\n  452 |     }","lines":26,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/crates/mjcf-rs/src/loader/defaults.rs#L427-L452"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"The impulse-joint path for `<joint springdamper>` uses omega = 2pi/timeconst (treating timeconst\nas a period), while MuJoCo's definition is omega = 1/(timeconst * dampratio) (treating timeconst\nas a time constant of the damped system). For a typical dampratio=1, critical-damping case with\ntimeconst=1s the impulse-joint spring is ~(2pi)^2 ~39.5x stiffer and 2pi ~6.3x more damped than\nwhat the MJCF specifies. The multibody path (mass.rs lines 363-364) correctly implements\nstiffness = I/(T^2*zeta^2) and damping = 2*I/T. The two paths therefore produce wildly different\ndynamics for the same model, and the impulse-joint result is wrong relative to MuJoCo.","fix":"Change the omega computation from `TAU / sd[0]` to `1.0 / (sd[0] * sd[1])` to match MuJoCo's AutoSpringDamper definition (`omega = 1 / (timeconst * dampratio)`), which is what the multibody path already implements:\n\n```\n// Before\nlet omega = std::f64::consts::TAU / sd[0];\nSome((omega * omega, 2.0 * sd[1] * omega))\n\n// After\nlet omega = 1.0 / (sd[0] * sd[1]);\nSome((omega * omega, 2.0 * sd[1] * omega))\n```","locations":[{"ref":"crates/rapier3d-mjcf/src/loader/joint.rs:111-116","code":"  111 |             let springdamper = match joint.springdamper {\n  112 |                 Some(sd) if sd[0] > 0.0 && sd[1] > 0.0 => {\n  113 |                     let omega = std::f64::consts::TAU / sd[0];\n  114 |                     Some((omega * omega, 2.0 * sd[1] * omega))\n  115 |                 }\n  116 |                 _ => None,","lines":6,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/crates/rapier3d-mjcf/src/loader/joint.rs#L111-L116"}]},{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"PidController.axes property setter is silently broken. The getter is declared as `#[getter] fn axes(...)` but the setter is `#[setter] fn set_axes_attr(...)`. PyO3 strips the 'set_' prefix to determine the property name, so this setter binds to a non-existent property 'axes_attr', not 'axes'. Attempting `pid.axes = mask` raises AttributeError at runtime; the axes are read-only with no Python-visible way to change them post-construction.","fix":"Rename `set_axes_attr` to `set_axes` so PyO3 correctly pairs it with the `axes` getter.","locations":[{"ref":"python/rapier-py-3d/src/controllers.rs:1262-1270","code":" 1262 |     #[getter]\n 1263 |     fn axes(&self) -> AxesMask {\n 1264 |         AxesMask(self.0.axes())\n 1265 |     }\n 1266 |     #[setter]\n 1267 |     /// Replace the :class:`AxesMask` selecting controlled DOFs.\n 1268 |     fn set_axes_attr(&mut self, v: &AxesMask) {\n 1269 |         self.0.set_axes(v.0);\n 1270 |     }","lines":9,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/controllers.rs#L1262-L1270"}]},{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`BroadPhasePairEvent::__repr__` only formats `collider1` in both branches. The `Removed` branch prints the same field as the `Added` branch, so `collider2` is never shown in the repr of either variant, making the output misleading and potentially hiding bugs.","fix":"```rust\nfn __repr__(&self) -> String {\n    let kind = if self.added { \"Added\" } else { \"Removed\" };\n    format!(\n        \"BroadPhasePairEvent.{}(collider1={:?}, collider2={:?})\",\n        kind,\n        self.pair.collider1.0.into_raw_parts(),\n        self.pair.collider2.0.into_raw_parts(),\n    )\n}\n```","locations":[{"ref":"python/rapier-py-3d/src/geometry.rs:1341-1353","code":" 1341 |     fn __repr__(&self) -> String {\n 1342 |         if self.added {\n 1343 |             format!(\n 1344 |                 \"BroadPhasePairEvent.Added({:?})\",\n 1345 |                 self.pair.collider1.0.into_raw_parts()\n 1346 |             )\n 1347 |         } else {\n 1348 |             format!(\n 1349 |                 \"BroadPhasePairEvent.Removed({:?})\",\n 1350 |                 self.pair.collider1.0.into_raw_parts()\n 1351 |             )\n 1352 |         }\n 1353 |     }","lines":13,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/geometry.rs#L1341-L1353"}]},{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `asset.rs`, the `face=` attribute of an inline `<mesh>` element is parsed via\n`parse_f64_list` (treating the values as floating-point) and then cast to `u32` with `*x as u32`.\nThe MJCF spec documents face indices as integers. Negative values silently become 0 (Rust's\nsaturating float-to-int cast since 1.45), and fractional values are silently truncated. The round\ntrip `\"0 1 2\" -> parse_f64 -> u32` works by accident for typical data, but `\"-1 0 1\"` gives\n`[0, 0, 1]`, corrupting the mesh topology without any error.","fix":"Parse face indices as integers directly:\n\n```\n\"face\" => {\n    let s = attr.value();\n    let mut faces = Vec::new();\n    for tok in s.split_ascii_whitespace() {\n        faces.push(parse_u32(tok)?);\n    }\n    m.inline_faces = Some(faces);\n}\n```","locations":[{"ref":"crates/mjcf-rs/src/loader/asset.rs:53-55","code":"   53 |                             \"face\" => {\n   54 |                                 let v = parse_f64_list(attr.value())?;\n   55 |                                 m.inline_faces = Some(v.iter().map(|x| *x as u32).collect());","lines":3,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/crates/mjcf-rs/src/loader/asset.rs#L53-L55"}]},{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The `subtreemass` and `subtreecom` sensors in `read_sensor` return only the single queried\nrigid-body's mass / centre-of-mass, not the aggregated values for the entire kinematic subtree\nrooted at that body. MuJoCo's specification for both sensors is the subtree aggregate. Any code\nrelying on these sensors for a non-leaf body will receive a silently wrong value.","fix":"Walk `robot.bodies` to find all bodies whose `mjcf_body_id` falls under the queried body's\nsubtree (using the parent chain in `robot.joints`), then sum their masses and compute the\nmass-weighted average of their world-space CoM positions. This requires access to the\n`MjcfRobot` bodies/joints structures - it can be threaded as additional parameters if needed.","locations":[{"ref":"crates/rapier3d-mjcf/src/loader/runtime.rs:791-799","code":"  791 |             (\"subtreemass\", SensorObjectRef::Body(b)) => {\n  792 |                 let rb = body_handle_of(*b)?;\n  793 |                 Some(MjcfSensorValue::Scalar(rb.mass()))\n  794 |             }\n  795 |             (\"subtreecom\", SensorObjectRef::Body(b)) => {\n  796 |                 let rb = body_handle_of(*b)?;\n  797 |                 let local_com = rb.mass_properties().local_mprops.local_com;\n  798 |                 Some(MjcfSensorValue::Vector3(*rb.position() * local_com))\n  799 |             }","lines":9,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/crates/rapier3d-mjcf/src/loader/runtime.rs#L791-L799"}]},{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `debug_intersection2.rs`, every iteration of the `for intersection in intersections` loop\nfirst resets ALL body colours to grey, then reddens only the current intersection's body. With N\nintersecting bodies the effect is: iteration k re-greys bodies highlighted by iterations 0..k-1\nand only ever leaves the LAST body red. All earlier intersecting bodies end up grey, defeating\nthe purpose of the visualization. The grey-all pass must run once outside the loop.","fix":"Move the \"grey all\" loop before the intersections loop:\n\n```\n// Before\nfor intersection in intersections {\n    for (handle, _) in world.bodies.iter() {\n        viewer.set_body_color(handle, GREY, false);\n    }\n    let collider = world.colliders.get(intersection.0).unwrap();\n    ...\n    viewer.set_body_color(body_handle, RED, false);\n}\n\n// After\nfor (handle, _) in world.bodies.iter() {\n    viewer.set_body_color(handle, GREY, false);\n}\nfor intersection in intersections {\n    let collider = world.colliders.get(intersection.0).unwrap();\n    ...\n    viewer.set_body_color(body_handle, RED, false);\n}\n```","locations":[{"ref":"examples2d/debug_intersection2.rs:66-76","code":"   66 |             for intersection in intersections {\n   67 |                 for (handle, _) in world.bodies.iter() {\n   68 |                     viewer.set_body_color(handle, GREY, false);\n   69 |                 }\n   70 | \n   71 |                 let collider = world.colliders.get(intersection.0).unwrap();\n   72 |                 let body_handle = collider.parent().unwrap();\n   73 | \n   74 |                 viewer.set_body_color(body_handle, RED, false);\n   75 |             }\n   76 |         }","lines":11,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/examples2d/debug_intersection2.rs#L66-L76"}]},{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"collision_groups3.rs swaps the visual colors of the green and blue floors. The collider named 'green_floor' (collision group GREEN_GROUP) is rendered BLUE, and 'blue_floor' (BLUE_GROUP) is rendered GREEN. This makes the demo misleading: objects of a given color collide with the wrongly-colored floor.","fix":"Swap the color arguments: set green_collider_handle to GREEN and blue_collider_handle to BLUE.","locations":[{"ref":"examples3d/collision_groups3.rs:37-47","code":"   37 |     viewer.set_initial_collider_color(green_collider_handle, BLUE);\n   38 | \n   39 |     /*\n   40 |      * A blue floor that will collide with the BLUE group only.\n   41 |      */\n   42
