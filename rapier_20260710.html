                SphericalJointBuilder::new().local_anchor2(Vector::new(-shift, 0.0, 0.0));\n  352 |                 world.insert_impulse_joint(parent_handle, child_handle, joint);\n  353 |             }","lines":8,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/examples3d/joints3.rs#L346-L353"}]},{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"DebugLineCollector.lines() documents itself as returning a '(N, 2, D)' NumPy array in both the method docstring (line 743) and the class-level docstring (line 704), but it actually returns a 2D array of shape (2N, D) - a flat list of endpoints with no inner 'pair' dimension. Only render_to_arrays() performs the reshape to (N, 2, D). Users who zip lines() with colors() or objects() will index incorrectly: colors has N rows but lines has 2N rows.","fix":"Either reshape the output of lines() to (N, 2, D) before returning (use PyArray3 as render_to_arrays does), or update the docstring to accurately describe the (2N, D) shape and warn users that colors()[i] corresponds to lines()[2*i] and lines()[2*i+1].","locations":[{"ref":"python/rapier-py-3d/src/debug_render.rs:704-706","code":"  704 | /// call `.lines()`, `.colors()`, `.objects()` for `(N, 2, D)`, `(N, 4)`,\n  705 | /// `(N,)` NumPy arrays respectively (each call returns a fresh **copy**\n  706 | /// of the underlying data).","lines":3,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/debug_render.rs#L704-L706"},{"ref":"python/rapier-py-3d/src/debug_render.rs:743-759","code":"  743 |     /// Return a fresh `(N, 2, D)` NumPy array of segment endpoints.\n  744 |     fn lines<'py>(&self, py: Python<'py>) -> Bound<'py, crate::numpy::PyArray2<Real>> {\n  745 |         use crate::numpy::PyArray2;\n  746 |         let lines = self.lines.lock().unwrap();\n  747 |         // Flatten as N*2 rows of D columns; reshape on the Python side\n  748 |         // if a (N, 2, D) view is desired (we expose `(N*2, D)` then\n  749 |         // reshape via numpy in the helper `render_to_arrays`).\n  750 |         let mut flat: Vec<Vec<Real>> = Vec::with_capacity(lines.len() * 2);\n  751 |         for ln in lines.iter() {\n  752 |             flat.push(_svec_to_row::<3>(ln.a));\n  753 |             flat.push(_svec_to_row::<3>(ln.b));\n  754 |         }\n  755 |         let arr = PyArray2::<Real>::from_vec2_bound(py, &flat)\n  756 |             .unwrap_or_else(|_| PyArray2::<Real>::zeros_bound(py, [0, 3], false));\n  757 |         // Reshape (N*2, D) → (N, 2, D). We do this via numpy at the\n  758 |         // Python side; here we just return the (2N, D) view.\n  759 |         arr","lines":17,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/debug_render.rs#L743-L759"}]},{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`RigidBodyActivation` exposes two *aliases* that cover the same underlying field (`normalized_linear_threshold`): `linear_threshold` / `set_linear_threshold` and `sleep_threshold` / `set_sleep_threshold`. The `sleep_threshold` getter's doc says \"Alias for `linear_threshold`\" and the setter says \"Alias for `set_linear_threshold`\" — but users reading the `__repr__` output will see only `linear_threshold` printed, while they may have used `sleep_threshold` to set the value. More importantly, the alias creates the false impression that `sleep_threshold` is a distinct concept (e.g. some global sleep threshold vs. per-axis threshold). Either remove the alias or clearly document they are byte-identical, and ensure `__repr__` reflects this.","fix":"Remove the `sleep_threshold` / `set_sleep_threshold` pair and update the docstring to explain the single `linear_threshold` property, or keep both but add a clear `# deprecated alias` notice and test that setting one is reflected by the other.","locations":[{"ref":"python/rapier-py-3d/src/dynamics.rs:294-303","code":"  294 |     /// Alias for ``linear_threshold`` (read+write).\n  295 |     #[getter]\n  296 |     fn sleep_threshold(&self) -> Real {\n  297 |         self.0.normalized_linear_threshold\n  298 |     }\n  299 |     /// Alias for ``set_linear_threshold``.\n  300 |     #[setter]\n  301 |     fn set_sleep_threshold(&mut self, v: Real) {\n  302 |         self.0.normalized_linear_threshold = v;\n  303 |     }","lines":10,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/dynamics.rs#L294-L303"}]},{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`same_island` returns `true` if and only if both bodies are in the *active set*, which is a superset of any single island. Two bodies can both be active but in completely different islands (disconnected rigid-body graphs). The function's docstring acknowledges this approximation but the name `same_island` is semantically wrong and silently returns incorrect results for any multi-island scene. User code that relies on this to test \"are these bodies interacting\" will get false positives.","fix":"Either remove the method entirely (since it cannot be correctly implemented without internal rapier island IDs being exposed), or rename it to `both_active` and update the docstring to be explicit about what it actually checks:\n\n```rust\n/// Return `True` if both bodies are currently in the active (awake) set.\n/// This is NOT a test for being in the same simulation island.\nfn both_active(&self, h1: &RigidBodyHandle, h2: &RigidBodyHandle) -> bool { ... }\n```","locations":[{"ref":"python/rapier-py-3d/src/dynamics.rs:499-519","code":"  499 |     ///\n  500 |     /// Currently approximated as both being in the active set;\n  501 |     /// returns ``False`` if either body is sleeping.\n  502 |     fn same_island(&self, h1: &RigidBodyHandle, h2: &RigidBodyHandle) -> bool {\n  503 |         // No public per-island id; approximate \"same island\" as both\n  504 |         // being in the active set. The pipeline integration wires this properly.\n  505 |         let mut a = false;\n  506 |         let mut b = false;\n  507 |         for h in self.0.active_bodies() {\n  508 |             if h == h1.0 {\n  509 |                 a = true;\n  510 |             }\n  511 |             if h == h2.0 {\n  512 |                 b = true;\n  513 |             }\n  514 |             if a && b {\n  515 |                 break;\n  516 |             }\n  517 |         }\n  518 |         a && b\n  519 |     }","lines":21,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/dynamics.rs#L499-L519"}]},{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`add_gravitational_force` multiplies the gravity vector by the body's raw `mass()` but ignores `gravity_scale`. The engine's own gravity integration multiplies by `mass * gravity_scale`; this helper produces a different force magnitude for any body where `gravity_scale != 1.0`. A body with `gravity_scale = 0.0` (zero-g) that also has `add_gravitational_force` called on it will receive a full gravitational force that the user did not intend.","fix":"Multiply by `gravity_scale` as well:\n\n```rust\nfn add_gravitational_force(&mut self, gravity: PyVector) {\n    let g: rapier::math::Vector = gravity.0.into();\n    let (m, scale) = self.with_ref(|b| (b.mass(), b.gravity_scale()));\n    self.with_mut(|b| b.add_force(g * m * scale, true));\n}\n```","locations":[{"ref":"python/rapier-py-3d/src/dynamics.rs:1979-1984","code":" 1979 |     fn add_gravitational_force(&mut self, gravity: PyVector) {\n 1980 |         // Add gravity * mass as a force.\n 1981 |         let g: rapier::math::Vector = gravity.0.into();\n 1982 |         let m = self.with_ref(|b| b.mass());\n 1983 |         self.with_mut(|b| b.add_force(g * m, true));\n 1984 |     }","lines":6,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/dynamics.rs#L1979-L1984"}]},{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`RigidBodySet::clear` re-initialises the inner set but does not remove bodies from any associated `IslandManager`, `ColliderSet`, `ImpulseJointSet`, or `MultibodyJointSet`. After calling `set.clear()`, the island manager and joint sets still hold references to stale body handles. Subsequent `PhysicsWorld.step()` calls will encounter dangling handles, likely causing incorrect simulation results or panics inside rapier.","fix":"Require the caller to pass all dependent sets (like `remove` does), or remove `clear()` from the public API and document that users should rebuild the entire world instead. If keeping it, at minimum document prominently that the caller must clear all other sets too:\n\n```rust\nfn clear(\n    &mut self,\n    islands: &mut IslandManager,\n    colliders: &mut ColliderSet,\n    impulse_joints: &mut ImpulseJointSet,\n    multibody_joints: &mut MultibodyJointSet,\n) {\n    // remove each body individually so all sets stay consistent\n    let handles: Vec<_> = self.0.iter().map(|(h, _)| h).collect();\n    for h in handles {\n        self.0.remove(h, &mut islands.0, &mut colliders.0,\n                      &mut impulse_joints.0, &mut multibody_joints.0, true);\n    }\n}\n```","locations":[{"ref":"python/rapier-py-3d/src/dynamics.rs:2667-2671","code":" 2667 |     /// Remove every body from the set.\n 2668 |     fn clear(&mut self) {\n 2669 |         // RigidBodySet doesn't expose `clear()`, so we re-init.\n 2670 |         self.0 = rapier::dynamics::RigidBodySet::new();\n 2671 |     }","lines":5,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/dynamics.rs#L2667-L2671"}]},{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`RigidBodySetIter` snapshots handles at iteration start but returns live views that read through to the set. If a body is removed from the set between `__iter__` and a `__next__` call, the returned `RigidBody` view holds a stale handle. Any subsequent property access on that view will panic (see the `with_ref`/`with_mut` findings). No error or warning is surfaced at `__next__` time — the iterator silently yields a view that is a time-bomb.","fix":"In `__next__`, check whether the handle is still in the set before building the view, and skip or raise if not:\n\n```rust\nfn __next__(mut slf: PyRefMut<'_, Self>) -> PyResult<Option<(RigidBodyHandle, RigidBody)>> {\n    while slf.i < slf.handles.len() {\n        let handle = slf.handles[slf.i];\n        slf.i += 1;\n        let py = slf.py();\n        let set_ref = slf.set.bind(py);\n        if set_ref.borrow().0.get(handle).is_some() {\n            let set = slf.set.clone_ref(py);\n            return Ok(Some((RigidBodyHandle(handle),\n                RigidBody { backing: RigidBodyBacking::InSet { set, handle } })));\n        }\n    }\n    Ok(None)\n}\n```","locations":[{"ref":"python/rapier-py-3d/src/dynamics.rs:2715-2729","code":" 2715 |     fn __next__(mut slf: PyRefMut<'_, Self>) -> Option<(RigidBodyHandle, RigidBody)> {\n 2716 |         if slf.i >= slf.handles.len() {\n 2717 |             return None;\n 2718 |         }\n 2719 |         let py = slf.py();\n 2720 |         let handle = slf.handles[slf.i];\n 2721 |         slf.i += 1;\n 2722 |         let set = slf.set.clone_ref(py);\n 2723 |         Some((\n 2724 |             RigidBodyHandle(handle),\n 2725 |             RigidBody {\n 2726 |                 backing: RigidBodyBacking::InSet { set, handle },\n 2727 |             },\n 2728 |         ))\n 2729 |     }","lines":15,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/dynamics.rs#L2715-L2729"}]},{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`PyEventHandler::handle_collision_event` passes `py.None()` for both the `bodies` and `colliders` arguments when calling the Python `handle_collision_event` method. The rapier `EventHandler` trait receives the full `RigidBodySet` and `ColliderSet` for context, and user implementations of the protocol will expect these to be queryable objects. Silently passing `None` means any handler that tries to look up body/collider properties will get an `AttributeError` at runtime with no indication of why.","fix":"Either pass the actual `RigidBodySet`/`ColliderSet` Python objects (requires them to be stored on the handler or passed through from the pipeline), or document clearly in the Python protocol that these two arguments will always be `None` in this implementation and should be ignored. The same issue exists in `handle_contact_force_event` at lines 582-585.","locations":[{"ref":"python/rapier-py-3d/src/events_hooks.rs:538-541","code":"  538 |             let res = self.obj.bind(py).call_method1(\n  539 |                 \"handle_collision_event\",\n  540 |                 (py.None(), py.None(), py_event, py_pair),\n  541 |             );","lines":4,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/events_hooks.rs#L538-L541"}]},{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`BvhOptimizationStrategy::to_rapier` maps `OPTIMIZE_FOR_INTERACTIONS`, `OPTIMIZE_FOR_SPATIAL_QUERIES`, and `SUBTREE_OPTIMIZER` all to `rapier::geometry::BvhOptimizationStrategy::SubtreeOptimizer`, and maps `AUTO` the same way. This means four distinct enum variants that the Python user thinks have different effects all silently do the same thing. The Python enum variants `OPTIMIZE_FOR_INTERACTIONS` and `OPTIMIZE_FOR_SPATIAL_QUERIES` are advertised as distinct strategies, but rapier only has two strategies. If rapier adds more strategies later this mapping will need updating, and currently the mismatch is undocumented.","fix":"Either reduce the Python enum to only two meaningful values (`NONE`/`OPTIMIZE`), or document explicitly in the class docstring that `OPTIMIZE_FOR_INTERACTIONS`, `OPTIMIZE_FOR_SPATIAL_QUERIES`, and `SUBTREE_OPTIMIZER` are aliases for the same underlying rapier strategy.","locations":[{"ref":"python/rapier-py-3d/src/geometry.rs:1153-1163","code":" 1153 |     pub(crate) fn to_rapier(self) -> rapier::geometry::BvhOptimizationStrategy {\n 1154 |         match self {\n 1155 |             Self::AUTO\n 1156 |             | Self::OPTIMIZE_FOR_INTERACTIONS\n 1157 |             | Self::OPTIMIZE_FOR_SPATIAL_QUERIES\n 1158 |             | Self::SUBTREE_OPTIMIZER => {\n 1159 |                 rapier::geometry::BvhOptimizationStrategy::SubtreeOptimizer\n 1160 |             }\n 1161 |             Self::NO_OPTIMIZATION | Self::NONE => rapier::geometry::BvhOptimizationStrategy::None,\n 1162 |         }\n 1163 |     }","lines":11,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/geometry.rs#L1153-L1163"}]},{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`extract_verts_for_dim` tries `PyReadonlyArray2<Real>` (f32) first, then separately tries `PyReadonlyArray2<f32>`. Because `Real = f32` in this crate, the second branch (`f32`) is unreachable - if the first `extract` succeeds the function returns early; if it fails (e.g. because the array is f64), numpy will not downcast it to f32 automatically, so the second `if let Ok` also fails. The intent was to handle both precisions, but the first and second branches are identical for the f32 build, wasting one extract attempt on every call.","fix":"Remove the redundant second `if let Ok(arr) = obj.extract::<PyReadonlyArray2<f32>>()` branch (lines 1567-1585). The first branch already handles the native `Real = f32` case; the third branch already handles f64 via lossy cast.","locations":[{"ref":"python/rapier-py-3d/src/geometry.rs:1550-1586","code":" 1550 |     if let Ok(arr) = obj.extract::<PyReadonlyArray2<Real>>() {\n 1551 |         let (nrows, ncols) = (arr.shape()[0], arr.shape()[1]);\n 1552 |         if ncols != 3 {\n 1553 |             return Err(crate::pyo3::exceptions::PyValueError::new_err(format!(\n 1554 |                 \"expected ndarray with shape (N, 3); got (N, {ncols})\"\n 1555 |             )));\n 1556 |         }\n 1557 |         let slice = arr.as_slice().map_err(|_| {\n 1558 |             crate::pyo3::exceptions::PyValueError::new_err(\"ndarray must be contiguous\")\n 1559 |         })?;\n 1560 |         let mut out = Vec::with_capacity(nrows);\n 1561 |         for c in slice.chunks_exact(3) {\n 1562 |             out.push(rapier::math::Vector::new(c[0], c[1], c[2]));\n 1563 |         }\n 1564 |         return Ok(out);\n 1565 |     }\n 1566 |     // Try the other precision (lossy cast).\n 1567 |     if let Ok(arr) = obj.extract::<PyReadonlyArray2<f32>>() {\n 1568 |         let (nrows, ncols) = (arr.shape()[0], arr.shape()[1]);\n 1569 |         if ncols != 3 {\n 1570 |             return Err(crate::pyo3::exceptions::PyValueError::new_err(format!(\n 1571 |                 \"expected ndarray with shape (N, 3); got (N, {ncols})\"\n 1572 |             )));\n 1573 |         }\n 1574 |         let slice = arr.as_slice().map_err(|_| {\n 1575 |             crate::pyo3::exceptions::PyValueError::new_err(\"ndarray must be contiguous\")\n 1576 |         })?;\n 1577 |         let mut out = Vec::with_capacity(nrows);\n 1578 |         for c in slice.chunks_exact(3) {\n 1579 |             out.push(rapier::math::Vector::new(\n 1580 |                 c[0] as Real,\n 1581 |                 c[1] as Real,\n 1582 |                 c[2] as Real,\n 1583 |             ));\n 1584 |         }\n 1585 |         return Ok(out);\n 1586 |     }","lines":37,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/geometry.rs#L1550-L1586"}]},{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`ColliderSetIter::__next__` does not check whether the handle it is about to yield still exists in the set. If a collider is removed from the set between `__iter__` (which snapshots the handle list) and a subsequent `__next__` call, the iterator yields a `Collider` view whose backing handle is stale. Any property access on that view will then `expect`-panic (see the first finding). The iterator should either re-validate or document this contract.","fix":"Add a validity check before yielding:\n```rust\nif slf.set.bind(py).borrow().0.get(handle).is_none() {\n    slf.i += 1;\n    continue; // skip removed colliders\n}\n```\nOr document in the class docstring that removing colliders while iterating is undefined behaviour.","locations":[{"ref":"python/rapier-py-3d/src/geometry.rs:4116-4130","code":" 4116 |     fn __next__(mut slf: PyRefMut<'_, Self>) -> Option<(ColliderHandle, Collider)> {\n 4117 |         if slf.i >= slf.handles.len() {\n 4118 |             return None;\n 4119 |         }\n 4120 |         let py = slf.py();\n 4121 |         let handle = slf.handles[slf.i];\n 4122 |         slf.i += 1;\n 4123 |         let set = slf.set.clone_ref(py);\n 4124 |         Some((\n 4125 |             ColliderHandle(handle),\n 4126 |             Collider {\n 4127 |                 backing: ColliderBacking::InSet { set, handle },\n 4128 |             },\n 4129 |         ))\n 4130 |     }","lines":15,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/geometry.rs#L4116-L4130"}]},{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `squeeze_empty_fixed_links` (urdf lib.rs), when an empty link that has a parent joint is\nspliced out, the surviving child joint inherits the empty link's parent joint's `mimic` and\n`calibration` fields (lines 928-929). These fields reference other joints by name, and those\nname references may no longer be valid after the splice removes the intermediate link - the\nmimic target could refer to a joint that was also removed, or the calibration rising/falling\npositions no longer correspond to the new joint's origin. The URDF loader itself ignores both\nfields (they appear in the TODO at line 782), but users who extract the modified Robot struct\nfrom `from_file` and use it for something else (e.g. visualization) will get stale references.","fix":"After the splice, set `cj.mimic = None` and `cj.calibration = None` to prevent callers from receiving stale mimic/calibration data after the topology change. Alternatively, validate that the mimic target still exists and clear it if not.","locations":[{"ref":"crates/rapier3d-urdf/src/lib.rs:928-929","code":"  928 |                         cj.limit = parent_joint.limit.clone();\n  929 |                         cj.dynamics = parent_joint.dynamics.clone();","lines":2,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/crates/rapier3d-urdf/src/lib.rs#L928-L929"}]},{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"examples3d/debug_boxes3.rs inserts 6 identical fixed ground bodies at the exact same position and orientation (lines 16-21), and 2 identical dynamic box bodies at the same position (lines 24-31). This is likely leftover from debugging: the duplicate ground bodies waste memory and the duplicate dynamic boxes will start perfectly overlapping and immediately explode.","fix":"Remove the loops and insert each body exactly once, or if the duplication is intentional for stress-testing, document the intent.","locations":[{"ref":"examples3d/debug_boxes3.rs:16-21","code":"   16 |     for _ in 0..6 {\n   17 |         let rigid_body =\n   18 |             RigidBodyBuilder::fixed().translation(Vector::new(0.0, -ground_height, 0.0));\n   19 |         let collider = ColliderBuilder::cuboid(ground_size, ground_height, ground_size);\n   20 |         let (_handle, _) = world.insert(rigid_body, collider);\n   21 |     }","lines":6,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/examples3d/debug_boxes3.rs#L16-L21"},{"ref":"examples3d/debug_boxes3.rs:24-31","code":"   24 |     for _ in 0..2 {\n   25 |         let rigid_body = RigidBodyBuilder::dynamic()\n   26 |             .translation(Vector::new(1.1, 0.0, 0.0))\n   27 |             // .rotation(Vector::new(0.8, 0.2, 0.1))\n   28 |             .can_sleep(false);\n   29 |         let collider = ColliderBuilder::cuboid(2.0, 0.1, 1.0);\n   30 |         let (_handle, _) = world.insert(rigid_body, collider);\n   31 |     }","lines":8,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/examples3d/debug_boxes3.rs#L24-L31"}]},{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"debug_sleeping_kinematic3.rs contains a dead inner condition: the outer guard on line 65 is '!(timestep_id < start_tick || timestep_id >= stop_tick)', i.e. start_tick <= timestep_id < stop_tick. The inner check 'if timestep_id == start_tick' on line 66 can only be true on the very first step that satisfies the outer condition, but by that point 'timestep_id == start_tick' is guaranteed - the inner if can be replaced with a one-time setup. More critically, the asserts inside (lines 70-71) will panic if the simulation hasn't slept the platforms yet, which depends on timing and is not guaranteed.","fix":"Use a separate boolean flag to run start-of-movement setup exactly once, and downgrade the sleep asserts to if-checks with a warning print to avoid false panics.","locations":[{"ref":"examples3d/debug_sleeping_kinematic3.rs:65-77","code":"   65 |             if !(timestep_id < start_tick || timestep_id >= stop_tick) {\n   66 |                 if timestep_id == start_tick {\n   67 |                     println!(\"Platforms should start moving now and never stop.\");\n   68 |                     println!(\"The slow platform should move up and not sleep.\");\n   69 |                     // Platforms should have had plenty of time to fall asleep before we start moving them.\n   70 |                     assert!(world.bodies[platform_handle].is_sleeping());\n   71 |                     assert!(world.bodies[slow_platform_handle].is_sleeping());\n   72 | \n   73 |                     let slow_velocity = Vector::new(0.0, 0.01, 0.0);\n   74 |                     if let Some(slow_platform) = world.bodies.get_mut(slow_platform_handle) {\n   75 |                         slow_platform.set_linvel(slow_velocity, true);\n   76 |                     }\n   77 |                 }","lines":13,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/examples3d/debug_sleeping_kinematic3.rs#L65-L77"}]},{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`math.py` exports `lerp` directly from `_math_helpers` AND also provides `linear_interp` as a thin wrapper around `lerp`. Both are listed in `__all__`. This is confusing: `lerp` and `linear_interp` are identical in behaviour, but users seeing both in autocomplete may wonder which to prefer. `linear_interp` adds a layer of indirection with no added value.","fix":"Remove `linear_interp` from `math.py` and from `__all__`, leaving only `lerp`. If backward compatibility requires keeping `linear_interp`, mark it deprecated:\n```python\ndef linear_interp(a, b, t):\n    # Deprecated: use `lerp` instead.\n    return lerp(a, b, t)\n```\nand add a `DeprecationWarning`.","locations":[{"ref":"python/rapier-py-3d/python/rapier3d/math.py:11-15","code":"   11 | def linear_interp(a, b, t):\n   12 |     return lerp(a, b, t)\n   13 | \n   14 | \n   15 | __all__ = [\"lerp\", \"linear_interp\", \"rotation_from_angle\", \"wrap_to_pi\"]","lines":5,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/python/rapier3d/math.py#L11-L15"}]},{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In move_shape, when the query-filter predicate raises a Python exception, the code stores the error in pred_err and returns `true` (line 679) - meaning the collider is included in the sweep. This causes move_shape to run to completion with incorrect filtering, then discards the movement result and raises the stored exception. While exceptions from predicates are unusual, the 'include on error' behavior can corrupt physics output silently (the erroneous movement is computed but then thrown away with the exception). At minimum the behavior should be documented.","fix":"Document the 'returns true (include) on error' behavior explicitly. Alternatively return false (exclude) to be conservative, or short-circuit by checking pred_err at the start of the closure and returning early.","locations":[{"ref":"python/rapier-py-3d/src/controllers.rs:676-680","code":"  676 |                             Ok(r) => r.extract::<bool>(py).unwrap_or(true),\n  677 |                             Err(e) => {\n  678 |                                 *pred_err.borrow_mut() = Some(e);\n  679 |                                 true\n  680 |                             }","lines":5,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/controllers.rs#L676-L680"},{"ref":"python/rapier-py-3d/src/controllers.rs:719-722","code":"  719 |             if let Some(e) = pred_err.into_inner() {\n  720 |                 return Err(e);\n  721 |             }\n  722 |             result","lines":4,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/controllers.rs#L719-L722"}]},{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`InteractionTestMode::from_rapier` maps the rapier `And` variant to `Self::DEFAULT`, discarding the information about whether the original Python value was `DEFAULT`, `AND`, or `ONLY_DYNAMIC`. Any round-trip through rapier (e.g. reading back `test_mode` after setting it to `AND`) always returns `DEFAULT`. This is a silent semantics change for the user inspecting a previously set value.","fix":"This is a fundamental constraint of mapping three Python variants to one rapier variant. Add a doc comment noting that `test_mode` getter always returns `DEFAULT` (not `AND` or `ONLY_DYNAMIC`) even if those were set.","locations":[{"ref":"python/rapier-py-3d/src/geometry.rs:777-782","code":"  777 |     pub(crate) fn from_rapier(t: rapier::geometry::InteractionTestMode) -> Self {\n  778 |         match t {\n  779 |             rapier::geometry::InteractionTestMode::And => Self::DEFAULT,\n  780 |             rapier::geometry::InteractionTestMode::Or => Self::OR,\n  781 |         }\n  782 |     }","lines":6,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/geometry.rs#L777-L782"}]},{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`ContactData::contact_id` is always hardcoded to `0` in both `ContactPair::manifolds` and `ContactPair::find_deepest_contact`. This field exists in the struct and is exposed to Python users, but it is never populated with the actual contact identifier from rapier's `TrackedContact::contact_id`. Users relying on this field to identify contacts across frames will always get 0.","fix":"If rapier's `TrackedContact` exposes a `contact_id` field, populate it: `contact_id: c.contact_id`. If it does not, remove the field from `ContactData` or document it as always-zero.","locations":[{"ref":"python/rapier-py-3d/src/geometry.rs:2642-2642","code":" 2642 |                             contact_id: 0,","lines":1,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/geometry.rs#L2642"},{"ref":"python/rapier-py-3d/src/geometry.rs:2685-2685","code":" 2685 |                 contact_id: 0,","lines":1,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/geometry.rs#L2685"}]},{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"`ActiveHooks` exposes two class attributes with different names but identical values: `FILTER_CONTACT_PAIR` (singular) and `FILTER_CONTACT_PAIRS` (plural) both map to `rapier::pipeline::ActiveHooks::FILTER_CONTACT_PAIRS`. One of them was clearly added by copy-paste and the singular form is likely an accident. Having two names for the same bit-flag confuses the API.","fix":"Before:\n```rust\n#[classattr]\nconst FILTER_CONTACT_PAIR: ActiveHooks =\n    ActiveHooks(rapier::pipeline::ActiveHooks::FILTER_CONTACT_PAIRS);\n#[classattr]\nconst FILTER_CONTACT_PAIRS: ActiveHooks =\n    ActiveHooks(rapier::pipeline::ActiveHooks::FILTER_CONTACT_PAIRS);\n```\nAfter: remove the singular `FILTER_CONTACT_PAIR` variant; keep only `FILTER_CONTACT_PAIRS` to match rapier's naming.","locations":[{"ref":"python/rapier-py-3d/src/geometry.rs:419-422","code":"  419 |     const FILTER_CONTACT_PAIR: ActiveHooks =\n  420 |         ActiveHooks(rapier::pipeline::ActiveHooks::FILTER_CONTACT_PAIRS);\n  421 |     #[classattr]\n  422 |     const FILTER_CONTACT_PAIRS: ActiveHooks =","lines":4,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/geometry.rs#L419-L422"}]},{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`filter_intersection_pair` returns `true` when the error slot is `aborted`. Returning `true` means \"keep the intersection pair active\" (sensor still fires). In strict-abort mode the intent is to stop Python callbacks early, but the fallback value for `filter_intersection_pair` silently enables all sensor events rather than disabling them. Whether `true` is the right conservative default is debatable, but it is inconsistent with the user's mental model of \"stop processing after error\". The symmetric `filter_contact_pair` on abort returns `Some(SolverFlags::default())` (compute impulses), so contacts are also not suppressed.","fix":"Decide and document the intended semantics for the abort defaults. If the intent is \"fail safe, allow everything through\", the current behaviour is correct but needs a comment. If the intent is \"stop processing\", both methods should document that rapier does not support mid-step aborts and the fallback is inherently a no-op. At minimum, add a comment:\n\n```rust\n// aborted: return the permissive default — rapier cannot cancel a\n// mid-step computation, so we let existing pairs through unchanged.\nreturn true;\n```","locations":[{"ref":"python/rapier-py-3d/src/events_hooks.rs:820-826","code":"  820 |     fn filter_intersection_pair(&self, context: &rapier::pipeline::PairFilterContext) -> bool {\n  821 |         {\n  822 |             let slot = self.err_slot.lock().unwrap();\n  823 |             if slot.aborted {\n  824 |                 return true;\n  825 |             }\n  826 |         }","lines":7,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/events_hooks.rs#L820-L826"}]},{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"In `blocks.rs`, when parsing `<equality><weld relpose=\"...\">`, an attribute value that does not\ncontain exactly 7 floats is silently dropped: the `if v.len() == 7 { ... }` block has no `else`\nbranch - no error is returned, no warning is logged, and `w.relpose` stays `None`. A typo in the\nXML (e.g., `relpose=\"0 0 0 1\"` missing the quaternion part) produces wrong simulation behavior\nwith no diagnostic.","fix":"Add a warning or return an error for the wrong-length case:\n\n```\n} else {\n    log::warn!(\"<weld relpose>: expected 7 floats (pos quat), got {}; ignoring\", v.len());\n}\n```","locations":[{"ref":"crates/mjcf-rs/src/loader/blocks.rs:120-130","code":"  120 |                             \"relpose\" => {\n  121 |                                 let v = parse_f64_list(attr.value())?;\n  122 |                                 if v.len() == 7 {\n  123 |                                     // `relpose` is `pos(3) quat(w, x, y, z)(4)`.\n  124 |                                     let pose = Pose::from_parts(\n  125 |                                         DVec3::new(v[0], v[1], v[2]),\n  126 |                                         DQuat::from_xyzw(v[4], v[5], v[6], v[3]),\n  127 |                                     );\n  128 |                                     w.relpose = Some(pose);\n  129 |                                 }\n  130 |                             }","lines":11,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/crates/mjcf-rs/src/loader/blocks.rs#L120-L130"}]},{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`filter_intersection_pair` calls `v.extract::<bool>().unwrap_or(true)` on the Python return value without handling an extraction error as a deferred exception. If the Python callback returns a non-bool-coercible object and `extract` fails (e.g. a custom class without `__bool__`), the extraction error is silently swallowed and `true` is returned. Other hooks in the same file (e.g. `filter_contact_pair`) stash the error properly.","fix":"Replace the silent `unwrap_or` with explicit error stashing, consistent with `filter_contact_pair`:\n\n```rust\nOk(v) => match v.extract::<bool>() {\n    Ok(b) => b,\n    Err(e) => {\n        let mut s = self.err_slot.lock().unwrap();\n        if s.err.is_none() { s.err = Some(e); }\n        if s.policy_strict { s.aborted = true; }\n        true // safe default\n    }\n}\n```","locations":[{"ref":"python/rapier-py-3d/src/events_hooks.rs:864","code":"  864 |                 Ok(v) => v.extract::<bool>().unwrap_or(true),","lines":1,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/events_hooks.rs#L864"}]},{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"easy","description":"PdController and PidController both document that Kp/Kd/Ki accept a 'scalar (broadcast)' value, but the gain-setting code calls `let v: PyVector = k.extract()?` (line 1096/1111 for PdController; 1217/1231/1245 for PidController) BEFORE attempting a scalar extraction. `PyVector::extract_bound` calls `extract_floats(obj, 3)` which requires a 3-element sequence/ndarray/vec-like; a bare Python float has no `to_tuple()` and is not a sequence of length 3, so the extraction fails with TypeError and the scalar broadcast path (which comes later, inside the ang_kp block) is never reached. Calling `PdController(Kp=60.0)` raises TypeError despite the documented scalar support.","fix":"Try scalar extraction first: `if let Ok(f) = k.extract::<Real>() { inner.lin_kp = rapier::math::Vector::splat(f).into(); inner.ang_kp = rapier::math::AngVector::splat(f); } else { let v: PyVector = k.extract()?; inner.lin_kp = v.0.into(); inner.ang_kp = ... }`","locations":[{"ref":"pyt 15-L1229"}]},{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"very_easy","description":"DynamicRayCastVehicleController.set_index_up_axis and set_index_forward_axis accept any usize with no validation. Internally rapier uses these as array indices into a 3-element vector (via nalgebra's `Vector::ith(axis, 1.0)`). Passing a value >= 3 causes a panic (index out of bounds) when update_vehicle is next called. The boundary is not obvious from the Python API.","fix":"Add a bounds check in the setters and return PyValueError for values >= 3: `if v >= 3 { return Err(PyValueError::new_err(\"axis index must be 0, 1, or 2\")); }`","locations":[{"ref":"python/rapier-py-3d/src/controllers.rs:1867-1881","code":" 1867 |     #[setter]\n 1868 |     /// Set the chassis-local up-axis index (``0=X``, ``1=Y``, ``2=Z``).\n 1869 |     fn set_index_up_axis(&mut self, v: usize) {\n 1870 |         self.0.index_up_axis = v;\n 1871 |     }\n 1872 |     /// Index of the forward-axis in chassis-local coords (``0=X``, ``1=Y``, ``2=Z``).\n 1873 |     #[getter]\n 1874 |     fn index_forward_axis(&self) -> usize {\n 1875 |         self.0.index_forward_axis\n 1876 |     }\n 1877 |     #[setter]\n 1878 |     /// Set the chassis-local forward-axis index (``0=X``, ``1=Y``, ``2=Z``).\n 1879 |     fn set_index_forward_axis(&mut self, v: usize) {\n 1880 |         self.0.index_forward_axis = v;\n 1881 |     }","lines":15,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/controllers.rs#L1867-L1881"}]},{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"`MeshConverter` exposes `COMPOUND` and `CONVEX_DECOMPOSITION` as two separate `#[classattr]` factory methods in separate `pymethods` blocks, but both produce `rapier::geometry::MeshConverter::ConvexDecomposition`. A user seeing two distinct names (`COMPOUND` vs `CONVEX_DECOMPOSITION`) expects err(format!(\n 1785 |                 \"wheel index {} out of range (len={})\",\n 1786 |                 idx,\n 1787 |                 wheels.len()\n 1788 |             )));\n 1789 |         }\n 1790 |         wheels[idx].brake = brake;\n 1791 |         Ok(())","lines":11,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/controllers.rs#L1781-L1791"},{"ref":"python/rapier-py-3d/src/controllers.rs:1797-1807","code":" 1797 |     fn set_steering(&mut self, idx: usize, steering: Real) -> PyResult<()> {\n 1798 |         let wheels = self.0.wheels_mut();\n 1799 |         if idx >= wheels.len() {\n 1800 |             return Err(PyTypeError::new_err(format!(\n 1801 |                 \"wheel index {} out of range (len={})\",\n 1802 |                 idx,\n 1803 |                 wheels.len()\n 1804 |             )));\n 1805 |         }\n 1806 |         wheels[idx].steering = steering;\n 1807 |         Ok(())","lines":11,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/controllers.rs#L1797-L1807"},{"ref":"python/rapier-py-3d/src/controllers.rs:1813-1823","code":" 1813 |     fn apply_engine_force(&mut self, idx: usize, force: Real) -> PyResult<()> {\n 1814 |         let wheels = self.0.wheels_mut();\n 1815 |         if idx >= wheels.len() {\n 1816 |             return Err(PyTypeError::new_err(format!(\n 1817 |                 \"wheel index {} out of range (len={})\",\n 1818 |                 idx,\n 1819 |                 wheels.len()\n 1820 |             )));\n 1821 |         }\n 1822 |         wheels[idx].engine_force = force;\n 1823 |         Ok(())","lines":11,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/controllers.rs#L1813-L1823"},{"ref":"python/rapier-py-3d/src/controllers.rs:1834-1842","code":" 1834 |     fn wheel(&self, idx: usize) -> PyResult<Wheel> {\n 1835 |         let wheel kinematics` call via a `Vec<MultibodyIndex>` and deduplicates with `Vec::contains`,\nan O(n) search per insertion. For robots with many joints (e.g. dextrous hands with 20+ joints),\nthis makes the deduplication O(joints^2). A `HashSet<MultibodyIndex>` would make it O(joints).","fix":"Replace `Vec<MultibodyIndex>` with `HashSet<MultibodyIndex>` (or `BTreeSet` to avoid hashing if `MultibodyIndex` doesn't implement `Hash`):\n\n```\nuse std::collections::HashSet;\nlet mut touched: HashSet<MultibodyIndex> = HashSet::new();\n// closure becomes: touched.insert(idx);\n// final loop iterates touched directly\n```","locations":[{"ref":"crates/rapier3d-mjcf/src/loader/runtime.rs:243-289","code":"  243 |         let mut touched: Vec<MultibodyIndex> = Vec::new();\n  244 |         let touch = |touched: &mut Vec<MultibodyIndex>, idx: MultibodyIndex| {\n  245 |             if !touched.contains(&idx) {\n  246 |                 touched.push(idx);\n  247 |             }\n  248 |         };\n  249 | \n  250 |         let mut qpos_i = 0;\n  251 |         let mut qvel_i = 0;\n  252 |         for dof in &robot.qpos_dofs {\n  253 |             let qpos = key.qpos.get(qpos_i..qpos_i + dof.kind.qpos_width());\n  254 |             let qvel = key.qvel.get(qvel_i..qvel_i + dof.kind.qvel_width());\n  255 |             qpos_i += dof.kind.qpos_width();\n  256 |             qvel_i += dof.kind.qvel_width();\n  257 | \n  258 |             if dof.kind == MjcfDofKind::Free {\n  259 |                 let Some(handle) = self.bodies.get(dof.body).and_then(|b| b.as_ref()) else {\n  260 |                     continue;\n  261 |                 };\n  262 |                 if let Some(rb) = bodies.get_mut(handle.body) {\n  263 |                     if let Some(qp) = qpos {\n  264 |                         rb.set_position(free_pose(qp, dof.scale, robot.base_shift), true);\n  265 |                     }\n  266 |                     if let Some(qv) = qvel {\n  267 |                         let lin =\n  268 | `log::debug!` so it is\nsuppressed unless explicitly enabled. If the purpose is to observe force growth, consider\nprinting only on significant milestones (e.g. `if force.x.is_finite() && force.x as u32 % 100_000 == 0`).","locations":[{"ref":"examples2d/debug_compression2.rs:70","code":"   70 |             println!(\"force: {}\", force.x);","lines":1,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/examples2d/debug_compression2.rs#L70"}]},{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"examples3d/joint_motor_position3.rs calls println! inside the per-step simulation loop (line 76-81), once per impulse joint per frame. With 17 joints this prints 17 lines every simulation tick, flooding stdout and incurring sync I/O overhead that can meaningfully slow down an interactive demo.","fix":"Gate the output behind a step_id modulo check (e.g. print only every 60 steps) or remove the logging from the hot loop.","locations":[{"ref":"examples3d/joint_motor_position3.rs:72-82","code":"   72 |             for ((_, joint), target) in world.impulse_joints.iter().zip(target_angles.iter()) {\n   73 |                 let rb1 = &world.bodies[joint.body1()];\n   74 |                 let rb2 = &world.bodies[joint.body2()];\n   75 |                 let revolute = joint.data.as_revolute().unwrap();\n   76 |                 println!(\n   77 |                     \"[Step {}] rev angle: {} (target = {})\",\n   78 |                     step_id,\n   79 |                     revolute.angle(rb1.rotation(), rb2.rotation()),\n   80 |                     target\n   81 |                 );\n   82 |             }","lines":11,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/examples3d/joint_motor_position3.rs#L72-L82"}]},{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"In stress_tests/ray r j in 0usize..1 { ... }` (line 57). The loop body executes exactly once and `j` is only used in `j as f32 * shift + centery` which evaluates to `centery`. The outer loop is meaningless and obscures intent.","fix":"Remove the `for j in 0usize..1` wrapper and inline the single iteration's body directly.","locations":[{"ref":"examples3d/vehicle_controller3.rs:57-69","code":"   57 |     for j in 0usize..1 {\n   58 |         for k in 0usize..4 {\n   59 |             for i in 0..num {\n   60 |                 let x = i as f32 * shift - centerx;\n   61 |                 let y = j as f32 * shift + centery;\n   62 |                 let z = k as f32 * shift + centerx;\n   63 | \n   64 |                 let rigid_body = RigidBodyBuilder::dynamic().translation(Vector::new(x, y, z));\n   65 |                 let collider = ColliderBuilder::cuboid(rad, rad, rad);\n   66 |                 world.insert(rigid_body, collider);\n   67 |             }\n   68 |         }\n   69 |     }","lines":13,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/examples3d/vehicle_controller3.rs#L57-L69"}]},{"id":"DEAD_7","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"vehicle_joints3.rs contains a large commented-out block (lines 136-157) that duplicates cube-spawning code nearly identical to vehicle_controller3.rs. It adds no documentation value and clutters the file.","fix":"Delete the commented-out block.","locations":[{"ref":"examples3d/vehicle_joints3.rs:135-157","code":"  135 |      */\n  136 |     // let num = 8;\n  137 |     // let rad = 0.1;\n  138 |     //\n  139 |     // let shift = rad * 2.0;\n  140 |     // let centerx = shift * (num / 2) as f32;\n  141 |     // let centery = rad;\n  142 |     //\n  143 |     // for j in 0usize..1 {\n  144 |     //     for k in 0usize..4 {\n  145 |     //         for i in 0..num {\n  146 |     //             let x = i as f32 * shift - centerx;\n  147 |     //             let y = j as f32 * shift + centery;\n  148 |     //             let z = k as f32 * shift + centerx;\n  149 |     //\n  150 |     //             let rigid_body = RigidBodyBuilder::dynamic().translation(Vector::new(x, y, z));\n  151 |     //             let handle = bodies.insert(rigid_body);\n  152 |     //             let collider = ColliderBuilder::cuboid(rad, rad, rad);\n  153 |     //             colliders.insert_with_parent(collider, handle, &mut bodies);\n  154 |     //         }\n  155 |     //     }\n  156 |     // }\n  157 | ","lines":23,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/examples3d/vehicle_joints3.rs#L135-L157"}]},{"id":"DEAD_8","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"In `_pickle_setup.py`, after the guard `if not isinstance(cls, type): continue`, the next check `if isinstance(cls, types.ModuleType): continue` is unreachable dead code. An object that passes `isinstance(cls, type)` is a class object; class objects are never instances of `types.ModuleType` (which is the type of module *instances*, not of the ModuleType class itself). This branch can never execute.","fix":"Remove lines 31-32 (`if isinstance(cls, types.ModuleType): continue`). If the intent was to skip module objects that somehow appear in `dir(mod)`, the correct check before the `isinstance(cls, type)` guard would be `if isinstance(obj, types.ModuleType): continue` (where `obj = getattr(mod, name)`).","locations":[{"ref":"python/rapier-py-3d/python/rapier3d/_pickle_setup.py:31-32","code":"   31 |         # objects, skip those.\n   32 |         if isinstance(cls, types.ModuleType):","lines":2,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/python/rapier3d/_pickle_setup.py#L31-L32"}]},{"id":"DEAD_9","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"rapier3d/math.py exposes `linear_interp` as a public alias that does nothing except call `lerp(a, b, t)` with no transformation. Both names appear in `__all__`. This is redundant API surface that duplicates the already-exported `lerp`.","fix":"Remove `linear_interp` and drop it from `__all__`. If backward compatibility is needed, mark it deprecated with a one-line wrapper.","locations":[{"ref":"python/rapier-py-3d/python/rapier3d/math.py:11-15","code":"   11 | def linear_interp(a, b, t):\n   12 |     return lerp(a, b, t)\n   13 | \n   14 | \n   15 | __all__ = [\"lerp\", \"linear_interp\", \"rotation_from_angle\", \"wrap_to_pi\"]","lines":5,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/python/rapier3d/math.py#L11-L15"}]},{"id":"DEAD_10","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`active_set_offset` always returns `0` and is documented as \"Reserved for future use\". It accepts a `RigidBodyHandle` parameter `h` that is immediately discarded (suppressed via `#[allow(unused_variables)]`). Exposing this as a public Python method with a non-functional implementation gives users a false API surface and can cause silent logic bugs if they treat `0` as a real offset.","fix":"Remove the method entirely until it has a real implementation. Before:\n```rust\n#[allow(unused_variables)]\nfn active_set_offset(&self, h: &RigidBodyHandle) -> usize {\n    0\n}\n```\nAfter: delete the method and remove it from any stub/type-hint files.","locations":[{"ref":"python/rapier-py-3d/src/dynamics.rs:524-528","code":"  524 |     #[allow(unused_variables)]\n  525 |     fn active_set_offset(&self, h: &RigidBodyHandle) -> usize {\n  526 |         // Not exposed publicly in the engine; a later revision may surface it.\n  527 |         0\n  528 |     }","lines":5,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/dynamics.rs#L524-L528"}]},{"id":"DEAD_11","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`CCDSolver::clear` has an empty body with a comment claiming the solver is stateless. The method is registered as part of the Python API and can be called by users, but does nothing. The comment says \"may be revisited\" but this has been left in a no-op state, silently succeeding and making users think they've cleared solver state.","fix":"Before:\n```rust\nfn clear(&mut self) {\n    // Stateless w.r.t. the public API; may be revisited.\n}\n```\nAfter: either remove the method or raise `NotImplementedError` so users are alerted, consistent with how `solve_ccd` is handled:\n```rust\nfn clear(&mut self) -> PyResult<()> {\n    Err(PyNotImplementedError::new_err(\n        \"CCDSolver.clear is not implemented. The solver has no user-visible state to clear.\",\n    ))\n}\n```","locations":[{"ref":"python/rapier-py-3d/src/dynamics.rs:579-582","code":"  579 |     /// Clear any per-step CCD state.\n  580 |     fn clear(&mut self) {\n  581 |         // Stateless w.r.t. the public API; may be revisited.\n  582 |     }","lines":4,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/dynamics.rs#L579-L582"}]},{"id":"DEAD_12","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`ColliderType::to_rapier` and `ColliderType::from_rapier` are both annotated `#[allow(dead_code)]`. They are never called anywhere in the module. The enum itself is registered in the module, but these conversion methods are dead.","fix":"Before: both methods carry `#[allow(dead_code)]`.\nAfter: remove both methods if they are genuinely unused, or remove the suppression attribute and use them somewhere meaningful (e.g. in `Collider::collider_type` getter if that API is desired).","locations":[{"ref":"python/rapier-py-3d/src/geometry.rs:252-266","code":"  252 |     #[allow(dead_code)]\n  253 |     pub(crate) fn to_rapier(self) -> rapier::geometry::ColliderType {\n  254 |         match self {\n  255 |             Self::SOLID => rapier::geometry::ColliderType::Solid,\n  256 |             Self::SENSOR => rapier::geometry::ColliderType::Sensor,\n  257 |         }\n  258 |     }\n  259 |     #[allow(dead_code)]\n  260 |     pub(crate) fn from_rapier(t: rapier::geometry::ColliderType) -> Self {\n  261 |         match t {\n  262 |             rapier::geometry::ColliderType::Solid => Self::SOLID,\n  263 |             rapier::geometry::ColliderType::Sensor => Self::SENSOR,\n  264 |         }\n  265 |     }\n  266 | }","lines":15,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/geometry.rs#L252-L266"}]},{"id":"DEAD_13","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`ColliderEnabled::from_rapier` is annotated `#[allow(dead_code)]`. Its only consumer would be a `Collider::enabled` getter, which does not exist - `ColliderFlags` has an `enabled` getter that calls `from_rapier`, but the `Collider` struct itself exposes only `is_enabled: bool`, not a `ColliderEnabled` enum. So `from_rapier` on the type level is partially dead.","fix":"Check if `ColliderEnabled::from_rapier` is used anywhere (it is used via `ColliderFlags::enabled`). If only used from `ColliderFlags`, remove the `#[allow(dead_code)]` annotation so the compiler enforces it; if not used at all, remove the method.","locations":[{"ref":"python/rapier-py-3d/src/geometry.rs:287-294","code":"  287 |     pub(crate) fn from_rapier(t: rapier::geometry::ColliderEnabled) -> Self {\n  288 |         match t {\n  289 |             rapier::geometry::ColliderEnabled::Enabled => Self::ENABLED,\n  290 |             rapier::geometry::ColliderEnabled::DisabledByParent => Self::DISABLED_BY_PARENT,\n  291 |             rapier::geometry::ColliderEnabled::Disabled => Self::DISABLED,\n  292 |         }\n  293 |     }\n  294 | }","lines":8,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/geometry.rs#L287-L294"}]},{"id":"DEAD_14","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `build_geom_shape_with` (geom.rs), the variable `s_real` is assigned from `s` which is\nitself `self.options.scale`. The indirection adds no clarity - both names refer to the same\n`Real` value and `s_real` is only used within the same function. The compiler will optimise\nit away, but it creates a minor readability hazard (reader might assume `s` and `s_real`\ndiffer).","fix":"Remove `let s_real = s;` (line 69) and replace the four uses of `s_real` with `s` directly.","locations":[{"ref":"crates/rapier3d-mjcf/src/loader/geom.rs:61-69","code":"   61 |         let s = self.options.scale;\n   62 |         // Apply optional `fromto`.\n   63 |         let (size, _pose) = if let Some(ft) = g.fromto {\n   64 |             from_to_size_and_pose(g.type_, ft, &g.size)\n   65 |         } else {\n   66 |             (g.size, g.pose)\n   67 |         };\n   68 |         let body_frame_pose = self.geom_body_frame_pose(g);\n   69 |         let s_real = s;","lines":9,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/crates/rapier3d-mjcf/src/loader/geom.rs#L61-L69"}]},{"id":"DEAD_15","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"examples3d/debug_pop3.rs uses 'for _ in 0..1' loops (lines 16 and 24) which execute the body exactly once. These are no-op loops, likely remnants of a stress-test template. They add no value and mislead readers into thinking iteration is intended.","fix":"Replace each 'for _ in 0..1 { ... }' with the body directly.","locations":[{"ref":"examples3d/debug_pop3.rs:16","code":"   16 |     for _ in 0..1 {","lines":1,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/examples3d/debug_pop3.rs#L16"},{"ref":"examples3d/debug_pop3.rs:24","code":"   24 |     for _ in 0..1 {","lines":1,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/examples3d/debug_pop3.rs#L24"}]},{"id":"DEAD_16","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In python/examples/character/stairs.py the variable `last` is set inside the loop (line 61) but is never read afterward; it is only suppressed with `_ = last` at the end (line 69). The comment '# unused, just kept for readability' acknowledges this. The variable adds noise without documenting anything useful.","fix":"Remove the `last` variable and the `_ = last` suppression entirely.","locations":[{"ref":"python/examples/character/stairs.py:47-69","code":"   47 |     last = pose.translation\n   48 | \n   49 |     # Drive forward at 3 m/s for ~5s of sim time.\n   50 |     for _ in range(300):\n   51 |         mv = ctrl.move_shape(\n   52 |             1.0 / 60.0,\n   53 |             world.rigid_bodies,\n   54 |             world.colliders,\n   55 |             world.query_pipeline,\n   56 |             shape,\n   57 |             pose,\n   58 |             (0.05, -0.05, 0.0),\n   59 |             rp.QueryFilter(),\n   60 |         )\n   61 |         last = mv.translation\n   62 |         pose = rp.Isometry3.from_translation(\n   63 |             pose.translation.x + mv.translation.x,\n   64 |             pose.translation.y + mv.translation.y,\n   65 |             0.0,\n   66 |         )\n   67 | \n   68 |     print(f\"climbed: x={pose.translation.x:.2f} y={pose.translation.y:.2f}\")\n   69 |     _ = last  # unused, just kept for readability","lines":23,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/examples/character/stairs.py#L47-L69"}]},{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"medium","difficulty":"easy","description":"The comment immediately above `_extract_char_length` (line 144) claims it accepts a `(value, \"kind\")` tuple as input, but the implementation only handles `CharacterLength` instances and bare floats. There is no tuple-parsing branch. The error message returned to users also omits tuples. This misleads future maintainers and users who read the source.","fix":"Either implement tuple extraction (extract a 2-tuple of (Real, str) and construct CharacterLength), or remove the tuple claim from the comment and the error message.","locations":[{"ref":"python/rapier-py-3d/src/controllers.rs:143-159","code":"  143 | \n  144 | // Accept a `(value, \"kind\")` tuple, a `CharacterLength` instance, or\n  145 | // a bare float (interpreted as Absolute).\n  146 | fn _extract_char_length(obj: &Bound<'_, PyAny>) -> PyResult<CharacterLength> {\n  147 |     if let Ok(c) = obj.extract::<CharacterLength>() {\n  148 |         return Ok(c);\n  149 |     }\n  150 |     if let Ok(f) = obj.extract::<Real>() {\n  151 |         return Ok(CharacterLength {\n  152 |             kind: \"absolute\",\n  153 |             value: f,\n  154 |         });\n  155 |     }\n  156 |     Err(PyTypeError::new_err(\n  157 |         \"expected a CharacterLength, a float (interpreted as absolute), or use CharacterLength.absolute/.relative\",\n  158 |     ))\n  159 | }","lines":17,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/controllers.rs#L143-L159"}]},{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The comment block in `mass.rs` at line 341 claims MuJoCo's AutoSpringDamper formula is\n`stiffness = inertia / (T^2 * zeta^2)` and `damping = 2 * inertia / T`. While the code is\ncorrect (this follows from omega = 1/(T*zeta)), the comment omits the definition of omega\nthat makes the formula readable. Readers familiar with the oscillator literature expect\n`stiffness = I * omega^2` and `damping = 2*I*zeta*omega` with an explicit statement of what\nomega is. Without that, the formula looks like it violates standard oscillator design\n(normally k = m*omega^2 uses the undamped natural frequency, not 1/(T*zeta)).\nAdditionally, the comment in `joint.rs` at line 105 claims it \"maps to (omega^2, 2*zeta*omega)\"\nbut then uses `omega = TAU/sd[0]`, which is inconsistent with how the multibody path defines\nomega. These two comments together give a contradictory picture of what omega means.","fix":"Add an explicit omega definition to the comment so both paths are consistent:\n\n```\n// MuJoCo AutoSpringDamper: omega_n = 1 / (timeconst * dampratio)\n// stiffness = I * omega_n^2 = I / (T^2 * zeta^2)\n// damping   = 2 * I * zeta * omega_n = 2 * I / T\n```","locations":[{"ref":"crates/rapier3d-mjcf/src/loader/mass.rs:341-342","code":"  341 |     // MuJoCo `AutoSpringDamper`: inertia = ndof / Σ invweight0, then\n  342 |     // stiffness = inertia / (T²·ζ²), damping = 2·inertia / T.","lines":2,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/crates/rapier3d-mjcf/src/loader/mass.rs#L341-L342"},{"ref":"crates/rapier3d-mjcf/src/loader/joint.rs:105-108","code":"  105 |             // the effective stiffness from the link inertia — so `springdamper`\n  106 |             // maps to `(ω², 2·ζ·ω)` with no inertia term (the multibody path's\n  107 |             // implicit spring, built in `conversion.rs`, does fold the inertia\n  108 |             // in because it applies a physical force). MuJoCo requires both","lines":4,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/crates/rapier3d-mjcf/src/loader/joint.rs#L105-L108"}]},{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"Multiple comments across joints3.rs and stress_tests/joint_fixed3.rs say 'Because physx will crash if we add a joint between these.' Rapier is not PhysX and never was. These are copy-pasted from an old PhysX backend experiment that no longer exists. The constraint they describe (no two consecutive fixed bodies in a joint chain) may or may not apply to Rapier, so the comment is both stale and potentially misleading.","fix":"Remove or rewrite the comments to describe any real Rapier-specific constraint, or drop them entirely.","locations":[{"ref":"examples3d/joints3.rs:265-267","code":"  265 |             // NOTE: the num - 2 test is to avoid two consecutive\n  266 |             // fixed bodies. Because physx will crash if we add\n  267 |             // a joint between these.","lines":3,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/examples3d/joints3.rs#L265-L267"},{"ref":"examples3d/joints3.rs:419-421","code":"  419 |         // NOTE: the num - 2 test is to avoid two consecutive\n  420 |         // fixed bodies. Because physx will crash if we add\n  421 |         // a joint between these.","lines":3,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/examples3d/joints3.rs#L419-L421"},{"ref":"examples3d/joints3.rs:483-485","code":"  483 |         // NOTE: the num - 2 test is to avoid two consecutive\n  484 |         // fixed bodies. Because physx will crash if we add\n  485 |         // a joint between these.","lines":3,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/examples3d/joints3.rs#L483-L485"},{"ref":"examples3d/stress_tests/joint_fixed3.rs:30-32","code":"   30 |                         // NOTE: the num - 2 test is to avoid two consecutive\n   31 |                         // fixed bodies. Because physx will crash if we add\n   32 |                         // a joint between these.","lines":3,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/examples3d/stress_tests/joint_fixed3.rs#L30-L32"}]},{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"locked_rotations3.rs starts with a module-level comment 'This shows a bug when a cylinder is in contact with a very large but very thin cuboid. In this case the EPA returns an incorrect contact normal...' The file is a public example; shipping an example that is explicitly documented as demonstrating a bug is confusing to users.","fix":"If the bug is fixed, remove the comment. If the bug is still open, track it in an issue and add a link, or move the file to a dedicated debug directory.","locations":[{"ref":"examples3d/locked_rotations3.rs:4-6","code":"    4 | // This shows a bug when a cylinder is in contact with a very large\n    5 | // but very thin cuboid. In this case the EPA returns an incorrect\n    6 | // contact normal, resulting in the cylinder falling through the floor.","lines":3,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/examples3d/locked_rotations3.rs#L4-L6"}]},{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"In stress_tests/many_sleep3.rs line 38, the call `.sleeping(true)` has a trailing comment `// j < num - 1)`. This appears to be a leftover from when the argument was a conditional expression (`sleeping(j < num - 1)`). The comment looks like dangling code and is misleading.","fix":"Remove the dead comment: change `.sleeping(true); // j < num - 1)` to `.sleeping(true);`.","locations":[{"ref":"examples3d/stress_tests/many_sleep3.rs:38","code":"   38 |                     .sleeping(true); // j < num - 1);","lines":1,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/examples3d/stress_tests/many_sleep3.rs#L38"}]},{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The module-level comment in `dynamics.rs` (lines 40-47) contains two large block comments that are now stale: they reference \"the dynamics macro is invoked AFTER the geometry macro by each cdylib\" and \"The joints macro is invoked BEFORE this one in each cdylib\". The module doc at lines 7-9 explicitly states that macros no longer exist (\"There is now a single concrete target\"). These comments describe an obsolete code-generation approach.","fix":"Before:\n```rust\n// ============================================================\n// ColliderHandle / ColliderSet live in `geometry.rs`.\n// The dynamics macro is invoked AFTER the geometry macro by each\n// cdylib, so those types are already in scope here.\n// ============================================================\n\n// ============================================================\n// ImpulseJointSet / MultibodyJointSet live in `joints.rs`. The joints macro is invoked BEFORE this one in each cdylib,\n// so those types are already in scope here.\n// ============================================================\n```\nAfter: remove both comments, or replace with:\n```rust\n// ColliderHandle / ColliderSet are defined in `geometry.rs`.\n// ImpulseJointSet / MultibodyJointSet are defined in `joints.rs`.\n```","locations":[{"ref":"python/rapier-py-3d/src/dynamics.rs:39-47","code":"   39 | // ColliderHandle / ColliderSet live in `geometry.rs`.\n   40 | // The dynamics macro is invoked AFTER the geometry macro by each\n   41 | // cdylib, so those types are already in scope here.\n   42 | // ============================================================\n   43 | \n   44 | // ============================================================\n   45 | // ImpulseJointSet / MultibodyJointSet live in `joints.rs`. The joints macro is invoked BEFORE this one in each cdylib,\n   46 | // so those types are already in scope here.\n   47 | // ============================================================","lines":9,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/dynamics.rs#L39-L47"}]},{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The inline comment in `apply_kwarg` for the `\"body_type\"` arm (line 2124) says \"For simplicity, just panic if people mix base ctor with body_type kwarg.\" The code does not actually panic — it returns a `PyTypeError`. The word \"panic\" is misleading to future readers.","fix":"Before:\n```rust\n// Re-create builder of that type, preserving fields.\n// Simplest: clone and `.set_body_type` doesn't exist on\n// the builder. We swap base type while keeping the rest.\n// RigidBodyBuilder has no `.body_type` setter; build &\n// re-create. For simplicity, just panic if\n// people mix base ctor with body_type kwarg.\nlet _ = bt;\nreturn Err(PyTypeError::new_err(...));\n```\nAfter:\n```rust\n// `RigidBodyBuilder` has no `.body_type` setter post-construction.\n// Reject this kwarg and direct the user to `RigidBody.new_body()`.\nlet _ = bt;\nreturn Err(PyTypeError::new_err(...));\n```","locations":[{"ref":"python/rapier-py-3d/src/dynamics.rs:2120-2130","code":" 2120 |                 // Re-create builder of that type, preserving fields.\n 2121 |                 // Simplest: clone and `.set_body_type` doesn't exist on\n 2122 |                 // the builder. We swap base type while keeping the rest.\n 2123 |                 // RigidBodyBuilder has no `.body_type` setter; build &\n 2124 |                 // re-create. For simplicity, just panic if\n 2125 |                 // people mix base ctor with body_type kwarg.\n 2126 |                 let _ = bt;\n 2127 |                 return Err(PyTypeError::new_err(\n 2128 |                     \"Use RigidBody.new_body(body_type=...) to set body_type — \\\n 2129 |                      can't combine with the existing builder factory.\",\n 2130 |                 ));","lines":11,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/dynamics.rs#L2120-L2130"}]},{"id":"CMT_8","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The module-level doc comment (lines 1-7) says \"This module used to be generated by a `(Real, DIM)`-parameterized macro\". That historical note has no value for readers of the current code and adds noise to the module documentation.","fix":"Remove lines 4-7 (the historical implementation note); keep line 1-3 as they describe the current purpose.","locations":[{"ref":"python/rapier-py-3d/src/geometry.rs:1-7","code":"    1 | //! The concrete 3D / `f32` geometry, shape, and collider `#[pyclass]` types,\n    2 | //! plus the `register_geometry` function used by `#[pymodule]`.\n    3 | //!\n    4 | //! This module used to be generated by a `(Real, DIM)`-parameterized macro so\n    5 | //! that several cdylibs could each expand their own concrete types. There is\n    6 | //! now a single concrete target — 3D, `f32` — so the types are written out\n    7 | //! directly, with no macros.","lines":7,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/geometry.rs#L1-L7"}]},{"id":"CMT_9","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The comment at line 2232 says `// Alias for convex_hull in 3D since parry's convex_polyhedron / takes already-prepared points.` This is misleading: `convex_polyhedron` in this binding calls `Self::convex_hull`, which computes the hull from scratch. It is NOT equivalent to parry's lower-level `convex_polyhedron` that expects pre-prepared convex vertices. A user reading this docstring and comment may believe their points are used as-is.","fix":"Before:\n```rust\n// Alias for convex_hull in 3D since parry's convex_polyhedron\n// takes already-prepared points.\nSelf::convex_hull(points)\n```\nAfter: remove the misleading comment and update the docstring to say this computes the convex hull of the input point cloud (identical to `convex_hull`).","locations":[{"ref":"python/rapier-py-3d/src/geometry.rs:2229-2235","code":" 2229 |     /// Alias of `convex_hull` (3D).\n 2230 |     #[staticmethod]\n 2231 |     fn convex_polyhedron(points: &Bound<'_, PyAny>) -> PyResult<Self> {\n 2232 |         // Alias for convex_hull in 3D since parry's convex_polyhedron\n 2233 |         // takes already-prepared points.\n 2234 |         Self::convex_hull(points)\n 2235 |     }","lines":7,"link":"https://github.com/dimforge/rapier/blob/a1ef31035613154dfb97a9e1d480c6a5eb9d0010/python/rapier-py-3d/src/geometry.rs#L2229-L2235"}]},{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"very_easy","description":"The four-arm `match` block that parses the `\"inertia\"` attribute on `<mesh>` elements into a\n`MeshInertia` enum is duplicated verbatim in two places: `asset.rs` (lines 60-74, for concrete\n`<mesh>` elements) and `defaults.rs` (lines 255-270, for `<default><mesh>`). If a new\n`MeshInertia` variant is added, one site can easily be missed, silently returning an error while\nthe other site accepts it.","fix":"Extract a `parse_mesh_inertia(value: &str) -> Result<MeshInertia, ParseError>` helper in `parse_utils.rs` and call it from both sites.","locations":[{"ref":"crates/mjcf-rs/src/loader/asset.rs:59-75","code":"   59 |                             \"inertia\" => {\n   60 |                                 m.inertia = match attr.value() {\n   61 |                                     \"shell\" => MeshInertia::Shell,\n   62 |                                     \"convex\" => MeshInertia::Convex,\n   63 |                                     \"exact\" => MeshInertia::Exact,\n   64 |                                     \"legacy\" => MeshInertia::Legacy,\n   65 |                                     v => {\n   66 |                                         return Err(Parse w","difficulty":"medium","description":"`move_motor_damping_to_multibody`, `add_armature_to_multibody`, and `add_spring_to_multibody`\nin `mass.rs` all share a ~15-line pattern: (1) look up `(multibody, link_id)` by handle, (2)\nwalk `multibody.links().enumerate()` to compute the DoF offset for that link, (3) look up the\nlink again to read `locked_axes.bits()`. The three copies are nearly identical. Any fix to the\noffset computation (e.g. an off-by-one in the DoF count) must be applied in three places.","fix":"Extract a helper that resolves `(multibody, link_id)` -> `(dof_offset, locked_bits)`:\n\n```\nfn resolve_link_dof_info(\n    multibody: &Multibody,\n    link_id: usize,\n) -> Option<(usize, u8)> {\n    let mut offset = 0;\n    for (i, link) in multibody.links().enumerate() {\n        if i == link_id {\n            let locked = link.joint.data.locked_axes.bits();\n            return Some((offset, locked));\n        }\n        offset += link.joint().ndofs();\n    }\n    None\n}\n```\n\nThen each of the three functions calls this helper to obtain `(offset, locked_bits)` instead of re-implementing the loop.","locations":[{"ref":"crates/rapier3d-mjcf/src/loader/mass.rs:169-212","code":"  169 | pub(super) fn move_motor_damping_to_multibody(\n  170 |     multibody_joints: &mut MultibodyJointSet,\n  171 |     handle: MultibodyJointHandle,\n  172 |     damping: Real,\n  173 | ) {\n  174 |     use rapier3d::math::SPATIAL_DIM;\n  175 |     let Some((multibody, link_id)) = multibody_joints.get_mut(handle) else {\n  176 |         return;\n  177 |     };\n  178 |     // Walk the link list once to compute this link's DoF offset in the\n  179 |     // multibody's flat damping vector (rapier doesn't expose\n  180 |     // `MultibodyLink::assembly_id` publicly, so we reconstruct it).\n  181 |     let mut offset = 0;\n  182 |     for (i, link) in multibody.links().enumerate() {\n  183 |         if i == link_id {\n  184 |             break;\n  185 |         }\n  186 |         o
