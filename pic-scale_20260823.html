<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

<script type="application/json" id="D">[{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`pic_scale_scale_generic` calls `j.chunks_exact(src_stride)`, `dst_store.as_bytes().chunks_exact(dst_store.stride())`, and `dst_slice.chunks_exact_mut(dst_stride)` without ever checking that `src_stride`/`dst_stride` are non-zero. `chunks_exact`/`chunks_exact_mut` panic immediately if the chunk size is `0`. Since this function backs `extern \"C\" fn` exports with no `catch_unwind`, a caller passing `src_stride == 0` or `dst_stride == 0` (e.g. a naive C caller that forgot to set the stride, or intentionally passed `0` meaning \"tightly packed\") triggers a Rust panic that unwinds into `extern \"C\"` code, which Rust documents as immediately aborting the process — a crash reachable purely from FFI input validation, not encoded as one of the documented error codes.","fix":"Validate `src_stride != 0 && dst_stride != 0` (and that both are at least `width * size_of::<T>()` / `new_width * size_of::<T>()`) before using them, returning an error code instead of reaching the panicking `chunks_exact` calls:\n```rust\nif src_stride == 0 || dst_stride == 0 {\n    return PicScaleError::Generic(\"zero stride\".to_string()).code();\n}\n```","locations":[{"ref":"picscale/src/lib.rs:100-186","code":"  100 |         if src as usize % required_align_of_t != 0 || src_stride % size_of_t != 0 {\n  101 |             let mut _src_slice = vec![T::default(); width as usize * height as usize * N];\n  102 |             let j = slice::from_raw_parts(src as *const u8, src_stride * height as usize);\n  103 | \n  104 |             for (dst, src) in _src_slice\n  105 |                 .chunks_exact_mut(width as usize * N)\n  106 |                 .zip(j.chunks_exact(src_stride))\n  107 |             {\n  108 |                 for (dst, src) in dst.iter_mut().zip(src.chunks_exact(N)) {\n  109 |                     let src_pixel = src.as_ptr() as *const T;\n  110 |                     *dst = src_pixel.read_unaligned();\n  111 |                 }\n  112 |             }\n  113 |             source_image = std::borrow::Cow::Owned(_src_slice);\n  114 |             j_src_stride = width as usize * N;\n  115 |         } else {\n  116 |             source_image = std::borrow::Cow::Borrowed(slice::from_raw_parts(\n  117 |                 src,\n  118 |                 src_stride / size_of_t * height as usize,\n  119 |             ));\n  120 |         }\n  121 | \n  122 |         let source_store = ImageStore::<T, N> {\n  123 |             buffer: source_image,\n  124 |             channels: N,\n  125 |             width: width as usize,\n  126 |             height: height as usize,\n  127 |             stride: j_src_stride,\n  128 |             bit_depth: bit_depth as usize,\n  129 |         };\n  130 | \n  131 |         let mut options = ScalingOptions::default();\n  132 |         if flags & PIC_SCALE_PREMULTIPLY_ALPHA != 0 {\n  133 |             options.premultiply_alpha = true;\n  134 |         }\n  135 |         if flags & PIC_SCALE_USE_MULTITHREADING != 0 {\n  136 |             options.threading_policy = ThreadingPolicy::Adaptive;\n  137 |         }\n  138 |         options.resampling_function = resizing_filter.to_resampling();\n  139 | \n  140 |         if dst as usize % required_align_of_t != 0 && dst_stride % size_of_t != 0 {\n  141 |             let mut dst_store = ImageStoreMut::alloc_with_depth(\n  142 |                 new_width as usize,\n  143 |                 new_height as usize,\n  144 |                 bit_depth as usize,\n  145 |             );\n  146 | \n  147 |             let result = source_store.scale(&mut dst_store, options);\n  148 |             let result_code = map_error_code(result);\n  149 |             if result_code != 0 {\n  150 |                 return result_code;\n  151 |             }\n  152 | \n  153 |             let dst_slice =\n  154 |                 slice::from_raw_parts_mut(dst as *mut u s fully public (both the trait and the type are public, and the impl itself carries no `pub(crate)` restriction), so any downstream crate calling `Ar30ByteOrder::from(some_usize)` (or relying on `.into()`) with an out-of-range value gets an unconditional panic instead of a recoverable error, even though the crate otherwise goes out of its way to return `PicScaleError` variants for bad input (e.g. `PicScaleError::UnsupportedBitDepth`). The sibling `impl From<usize> for Rgb30` has the identical pattern but is `pub(crate)` and currently unused (call sites construct `Rgb30::Ar30`/`Rgb30::Ra30` directly), so it is not reachable from outside the crate.","fix":"Replace the panicking `From<usize>` with a fallible conversion so callers can handle bad input gracefully, e.g.:\n```rust\nimpl TryFrom<usize> for Ar30ByteOrder {\n    type Error = PicScaleError;\n    fn try_from(value: usize) -> Result<Self, Self::Error> {\n        match value {\n            0 => Ok(Ar30ByteOrder::Host),\n            1 => Ok(Ar30ByteOrder::Network),\n            _ => Err(PicScaleError::Generic(format!(\n                \"Ar30ByteOrder is not implemented for value {value}\"\n            ))),\n        }\n    }\n}\n```\nIf source compatibility with the existing `From<usize>` call sites (all presumably passing `0`/`1` literals) must be kept, at minimum document the panic clearly and keep it `pub(crate)`-only rather than exposing it on a public enum.","locations":[{"ref":"src/factory/ar30.rs:110-120","code":"  110 | impl From<usize> for Ar30ByteOrder {\n  111 |     fn from(value: usize) -> Self {\n  112 |         match value {\n  113 |             0 => Ar30ByteOrder::Host,\n  114 |             1 => Ar30ByteOrder::Network,\n  115 |             _ => {\n  116 |                 unimplemented!(\"Rgb30ByteOrder is not implemented for value {}\", value)\n  117 |             }\n  118 |         }\n  119 |     }\n  120 | }","lines":11,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/factory/ar30.rs#L110-L120"}]},{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`ImageStore`/`ImageStoreMut::bit_depth` is a plain public `usize` field, settable to any value via the public `alloc_with_depth`/`try_alloc_with_depth` constructors in `src/image_store.rs`, and `validate()` (`src/image_store.rs:225-265`) never checks it is within a sane range. Several NEON consumers assume `1..=16` and defensively `assert!((1..=16).contains(&bit_depth))` (e.g. `src/neon/alpha_u16.rs:66-67,182-183`), but `src/neon/cbcr_u16.rs` does not: `convolve_horizontal_cbcr_neon_rows_4_f32_u16` and `convolve_horizontal_cbcr_neon_f32_u16_row` both compute `vdupq_n_f32(((1u32 << bit_depth) - 1) as f32)` directly from the caller-supplied `bit_depth: u32` with no bounds check. If a caller constructs a `u16` CbCr store with `bit_depth >= 32` (reachable purely through the public `alloc_with_depth`/`try_alloc_with_depth` APIs, since nothing rejects it), `1u32 << bit_depth` is a shift-amount overflow: it panics in debug builds and, in release builds, wraps the shift amount (`bit_depth % 32`), producing a nonsensical clamp bound (e.g. `0` if `bit_depth == 32`) that silently zeroes/corrupts every resampled Cb/Cr sample instead of erroring.","fix":"Either validate `bit_depth` in `ImageStoreMut::validate()` so out-of-range values are rejected before reaching any SIMD kernel:\n```rust\nif self.bit_depth > 16 {\n    return Err(PicScaleError::UnsupportedBitDepth(self.bit_depth));\n}\n```\nor, at minimum, add the same defensive `assert!((1..=16).contains(&bit_depth))` already used in `src/neon/alpha_u16.rs` to the `cbcr_u16.rs` entry points so the two files behave consistently.","locations":[{"ref":"src/neon/cbcr_u16.rs:172","code":"  172 |         let v_max = vdupq_n_f32(((1u32 << bit_depth) - 1) as f32);","lines":1,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/neon/cbcr_u16.rs#L172"},{"ref":"src/neon/cbcr_u16.rs:274","code":"  274 |         let v_max = vdupq_n_f32(((1u32 << bit_depth) - 1) as f32);","lines":1,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/neon/cbcr_u16.rs#L274"},{"ref":"src/image_store.rs:225-265","code":"  225 |     pub(crate) fn validate(&self) -> Result<(), PicScaleError> {\n  226 |         if self.width == 0 || self.height == 0 {\n  227 |             return Err(PicScaleError::ZeroImageDimensions);\n  228 |         }\n  229 | \n  230 |         if check_image_size_overflow(\n  231 |             self.width,\n  232 |             self.height,\n  233 |             self.channels,\n  234 |             size_of::<T>() as isize,\n  235 |         ) {\n  236 |             return Err(PicScaleError::SourceImageIsTooLarge);\n  237 |         }\n  238 | \n  239 |         if check_image_size_overflow_with_stride(\n  240 |             self.width,\n  241 |             self.height,\n  242 |             self.stride(),\n  243 |             self.channels,\n  244 |             size_of::<T>() as isize,\n  245 |         ) {\n  246 |             return Err(PicScaleError::SourceImageIsTooLarge);\n  247 |         }\n  248 | \n  249 |         let valid_size = self.stride() * (self.height - 1) + self.width * N;\n  250 | \n  251 |         if self.stride() < self.width * N {\n  252 |             return Err(PicScaleError::InvalidStride(self.width * N, self.stride));\n  253 |         }\n  254 | \n  255 |         if self.buffer.borrow().len() < valid_size {\n  256 |             return Err(PicScaleError::BufferMismatch(PicScaleBufferMismatch {\n  257 |                 expected: valid_size,\n  258 |                 width: self.width,\n  259 |                 height: self.height,\n  260 |                 channels: N,\n  261 |                 slice_len: self.buffer.borrow().len(),\n  262 |             }));\n  263 |         }\n  264 |         Ok(())\n  265 |     }","lines":41,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/image_store.rs#L225-L265"},{"ref":"src/image_store.rs:419-451","code":"  419 |     /// Allocates new mutable image storage with required bit-depth\n  420 |     pub fn alloc_with_depth(\n  421 |         width: usize,\n  422 |         height: usize,\n  423 |         bit_depth: usize,\n  424 |     ) -> ImageStoreMut<'a, T, N> {\n  425 |         let vc = vec![T::default(); width * N * height];\n  426 |         ImageStoreMut::<T, N> {\n  427 |             buffer: BufferStore::Owned(vc),\n  428 |             channels: N,\n  429 |             width,\n  430 |             height,\n  431 |             stride: width * N,\n  432 |             bit_depth,\n  433 |         }\n  434 |     }\n  435 | \n  436 |     /// Tries to allocate new mutable image storage with required bit-depth\n  437 |     pub fn try_alloc_with_depth(\n  438 |         width: usize,\n  439 |         height: usize,\n  440 |         bit_depth: usize,\n  441 |     ) -> Result<ImageStoreMut<'a, T, N>, PicScaleError> {\n  442 |         let vc = try_vec![T::default(); width * N * height];\n  443 |         Ok(ImageStoreMut::<T, N> {\n  444 |             buffer: BufferStore::Owned(vc),\n  445 |             channels: N,\n  446 |             width,\n  447 |             height,\n  448 |             stride: width * N,\n  449 |             bit_depth,\n  450 |         })\n  451 |     }","lines":33,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/image_store.rs#L419-L451"}]},{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In `src/avx512/check_alpha.rs`, `avx512_has_non_constant_cap_alpha_rgba8_impl` only guards against a totally empty buffer (`if store.is_empty() { return true; }`) before doing `let first_alpha = store[3];`. If `store` is non-empty but shorter than 4 bytes (for example a malformed/degenerate call with `store.len()` in `1..=3`), the unchecked index `store[3]` panics instead of being treated the same as the empty case.","fix":"Guard on the minimum size needed instead of only emptiness, e.g. `if store.len() < 4 { return true; }` before reading `store[3]`.","locations":[{"ref":"src/avx512/check_alpha.rs:47-58","code":"   47 |         if store.is_empty() {\n   48 |             return true;\n   49 |         }\n   50 | \n   51 |         let sh0 = _mm512_set_epi8(\n   52 |             -1, -1, -1, 63, -1, -1, -1, 59, -1, -1, -1, 55, -1, -1, -1, 51, -1, -1, -1, 47, -1, -1,\n   53 |             -1, 43, -1, -1, -1, 39, -1, -1, -1, 35, -1, -1, -1, 31, -1, -1, -1, 27, -1, -1, -1, 23,\n   54 |             -1, -1, -1, 19, -1, -1, -1, 15, -1, -1, -1, 11, -1, -1, -1, 7, -1, -1, -1, 3,\n   55 |         );\n   56 | \n   57 |         let first_alpha = store[3];\n   58 |         let base_mask = _mm512_set1_epi8(first_alpha as i8);","lines":12,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/avx512/check_alpha.rs#L47-L58"}]},{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`ImageSize`'s `Sub<usize>` and `Add<usize>` implementations in `src/image_size.rs` perform raw `self.width - rhs` / `self.width + rhs` on `usize` fields with no bounds checking. `ImageSize` and these trait impls are public API (`pub struct ImageSize`, re-exported from `lib.rs`), so any caller doing `image_size - n` with `n > image_size.width` (or `height`) will panic from an unchecked integer underflow in a release build (debug builds also panic, but release panics catch users by surprise since integer overflow checks are normally off) - and `image_size + n` can overflow to a huge/wrapped value on release builds where overflow checks are disabled.","fix":"Use saturating (or checked) arithmetic so the public operators can't panic or silently wrap:\n```rust\nimpl Sub<usize> for ImageSize {\n    type Output = ImageSize;\n    fn sub(self, rhs: usize) -> ImageSize {\n        ImageSize::new(self.width.saturating_sub(rhs), self.height.saturating_sub(rhs))\n    }\n}\n\nimpl Add<usize> for ImageSize {\n    type Output = ImageSize;\n    fn add(self, rhs: usize) -> ImageSize {\n        ImageSize::new(self.width.saturating_add(rhs), self.height.saturating_add(rhs))\n    }\n}\n```","locations":[{"ref":"src/image_size.rs:45-57","code":"   45 | impl Sub<usize> for ImageSize {\n   46 |     type Output = ImageSize;\n   47 |     fn sub(self, rhs: usize) -> ImageSize {\n   48 |         ImageSize::new(self.width - rhs, self.height - rhs)\n   49 |     }\n   50 | }\n   51 | \n   52 | impl Add<usize> for ImageSize {\n   53 |     type Output = ImageSize;\n   54 |     fn add(self, rhs: usize) -> ImageSize {\n   55 |         ImageSize::new(self.width + rhs, self.height + rhs)\n   56 |     }\n   57 | }","lines":13,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/image_size.rs#L45-L57"}]},{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"critical","difficulty":"medium","description":"In `pic_scale_scale_generic` (the shared generic implementation behind every `pic_scale_resize_*` C-ABI export), the misaligned-`dst` slow path computes the length of the raw output byte slice as `new_width as usize * dst_stride` instead of `new_height as usize * dst_stride`:\n```rust\nlet dst_slice =\n    slice::from_raw_parts_mut(dst as *mut u8, new_width as usize * dst_stride);\n```\n`dst_stride` is bytes-per-row, so the correct buffer length is `new_height * dst_stride` (this is exactly what the analogous source-side code does a few lines earlier: `src_stride * height as usize`). When `new_width > new_height`, `slice::from_raw_parts_mut` is told the destination buffer is larger than what the C caller actually allocated (`new_height * dst_stride` bytes), which is instant undefined behavior and, once the `chunks_exact_mut(dst_stride)` / per-pixel `write_unaligned` loop runs, an out-of-bounds heap write reachable from the public C ABI (`pic_scale_resize_rgba8`, `pic_scale_resize_rgba16`, `pic_scale_resize_rgba_f32`, `pic_scale_resize_rgba_f16`, etc.) whenever the caller passes a misaligned `dst` pointer together with a misaligned `dst_stride` (the two conditions gating this branch, see the separate `&&`/`||` finding).","fix":"Use `new_height` instead of `new_width` when computing the destination byte-slice length, mirroring the source-side computation:\n```rust\nlet dst_slice =\n    slice::from_raw_parts_mut(dst as *mut u8, new_height as usize * dst_stride);\n```\nAlso add a `checked_mul` around this (and the analogous source-side) computation and return a dedicated error code instead of silently truncating/overflowing on 32-bit targets.","locations":[{"ref":"picscale/src/lib.rs:153-154","code":"  153 |             let dst_slice =\n  154 |                 slice::from_raw_parts_mut(dst as *mut u8, new_width as usize * dst_stride);","lines":2,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/picscale/src/lib.rs#L153-L154"}]},{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"`make_linearization16` (present, nearly identically, in both `src/colors/linear_scaler.rs` and `src/colors/linear_precise_scaler.rs`) only validates the *lower* bound of its `bit_depth: usize` parameter (`if bit_depth < 8 { return Err(PicScaleError::UnsupportedBitDepth(bit_depth)); }`) but never checks an upper bound before doing `let max_lin_depth = (1u32 << bit_depth) - 1;` and `let keep_max = 1u32 << bit_depth;`. `bit_depth` is a plain `usize` supplied by the caller of the fully public APIs `LinearScaler::plan_rgb_resampling16` / `plan_rgba_resampling16` / `plan_cbcr_resampling16` / `plan_planar_resampling16` / `plan_gray_alpha_resampling16` (and the equivalent `LinearApproxScaler` methods), with no clamp anywhere in the call chain (the methods just forward `bit_depth` straight to `make_linearization16` after also calling `self.scaler.plan_*_resampling_f32(...)`, which does not touch `bit_depth` at all). Passing e.g. `bit_depth: 32` shifts a `u32` by an amount `>=` its bit width, which panics with \"attempt to shift left with overflow\" in debug builds, and in release builds silently wraps (`1u32 << 32` behaves like `1u32 << 0 == 1`), producing `max_lin_depth == 0` and then `let rcp_bit_depth = 1. / max_lin_depth as f32;` which is `f32::INFINITY`, silently corrupting the entire linearization LUT with `inf`/`NaN` values instead of returning an error.","fix":"Validate the upper bound alongside the existing lower-bound check, e.g.:\n```rust\nfn make_linearization16(\n    transfer_function: TransferFunction,\n    bit_depth: usize,\n) -> Result<Linearization16, PicScaleError> {\n    if !(8..=16).contains(&bit_depth) {\n        return Err(PicScaleError::UnsupportedBitDepth(bit_depth));\n    }\n    ...\n}\n```\n`16` is the natural upper bound here since the `linearization`/`gamma` LUTs are sized for at most 16-bit data (`Box<[f32; 65536]>` / `Box<[u16; 262144]>`); anything above that cannot be represented by these tables anyway.","locations":[{"ref":"src/colors/linear_precise_scaler.rs:283-313","code":"  283 | fn make_linearization16(\n  284 |     transfer_function: TransferFunction,\n  285 |     bit_depth: usize,\n  286 | ) -> Result<Linearization16, PicScaleError> {\n  287 |     if bit_depth < 8 {\n  288 |         return Err(PicScaleError::UnsupportedBitDepth(bit_depth));\n  289 |     }\n  290 |     let mut linearizing = Box::new([0f32; 65536]);\n  291 |     let max_lin_depth = (1u32 << bit_depth) - 1;\n  292 |     let keep_max = 1u32 << bit_depth;\n  293 |     let mut gamma = Box::new([0u16; 262144]);\n  294 | \n  295 |     let rcp_bit_depth = 1. / max_lin_depth as f32;\n  296 | \n  297 |     for (i, dst) in linearizing.iter_mut().take(keep_max as usize).enumerate() {\n  298 |         *dst = transfer_function.linearize(i as f32 * rcp_bit_depth);\n  299 |     }\n  300 | \n  301 |     const RCP_LUT_CAP: f32 = 1. / 262143.;\n  302 | \n  303 |     for (i, dst) in gamma.iter_mut().enumerate() {\n  304 |         *dst = (transfer_function.gamma(i as f32 * RCP_LUT_CAP) * max_lin_depth as f32)\n  305 |             .cpu_round()\n  306 |             .min(max_lin_depth as f32) as u16;\n  307 |     }\n  308 | \n  309 |     Ok(Linearization16 {\n  310 |         linearization: linearizing,\n  311 |         gamma,\n  312 |     })\n  313 | }","lines":31,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/colors/linear_precise_scaler.rs#L283-L313"},{"ref":"src/colors/linear_scaler.rs:194-226","code":"  194 | fn make_linearization16(\n  195 |     transfer_function: TransferFunction,\n  196 |     bit_depth: usize,\n  197 | ) -> Result<Linearization16, PicScaleError> {\n  198 |     if bit_depth < 8 {\n  199 |         return Err(PicScaleError::UnsupportedBitDepth(bit_depth));\n  200 |     }\n  201 |     let mut linearizing = Box::new([0u16; 65536]);\n  202 |     let max_lin_depth = (1u32 << bit_depth) - 1;\n  203 |     let keep_max = 1u32 << bit_depth;\n  204 |     let mut gamma = Box::new([0u16; 65536]);\n  205 | \n  206 |     let rcp_max_lin_depth = 1. / max_lin_depth as f32;\n  207 | \n  208 |     for (i, dst) in linearizing.iter_mut().take(keep_max as usize).enumerate() {\n  209 |         *dst = (transfer_function.linearize(i as f32 * rcp_max_lin_depth) * 65535.)\n  210 |             .cpu_round()\n  211 |             .min(65535.) as u16;\n  212 |     }\n  213 | \n  214 |     const S: f32 = 1. / 65535.;\n  215 | \n  216 |     for (i, dst) in gamma.iter_mut().enumerate() {\n  217 |         *dst = (transfer_function.gamma(i as f32 * S) * max_lin_depth as f32)\n  218 |             .cpu_round()\n  219 |             .min(max_lin_depth as f32) as u16;\n  220 |     }\n  221 | \n  222 |     Ok(Linearization16 {\n  223 |         linearization: linearizing,\n  224 |         gamma,\n  225 |     })\n  226 | }","lines":33,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/colors/linear_scaler.rs#L194-L226"}]},{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"`ImageStore::new`/`borrow`/`alloc` and `ImageStoreMut::new`/`borrow`/`alloc`/`alloc_with_depth` all compute `width * height * N` (or `width * N * height`) with plain `usize` multiplication *before* any overflow check is performed, and use the result both to validate the caller-supplied buffer length and to size freshly allocated buffers (`vec![T::default(); width * N * height]`). `width`/`height` come directly from public API callers. In a release build this multiplication silently wraps instead of panicking; a wrapped `expected_size` can be far smaller than the real `width * height * N`, so `new`/`borrow` would accept a buffer that is too small for the claimed `width`/`height`, and `alloc`/`alloc_with_depth` would allocate a much smaller `Vec` than the struct's `width`/`height` imply. Only the separate `validate()` method (called later, not from these constructors) uses `check_image_size_overflow`/`check_image_size_overflow_with_stride` to catch this - so any code path that constructs a store and uses `width`/`height`/`stride` before calling `validate()` (or relies on the constructor alone for safety) is exposed to an inconsistent width/height vs. buffer-length invariant.","fix":"Perform the same overflow check the struct already has available (`check_image_size_overflow`) inside these constructors before multiplying, e.g.:\n```rust\npub fn new(slice_ref: Vec<T>, width: usize, height: usize) -> Result<ImageStore<'a, T, N>, PicScaleError> {\n    if check_image_size_overflow(width, height, N, size_of::<T>() as isize) {\n        return Err(PicScaleError::SourceImageIsTooLarge);\n    }\n    let expected_size = width * height * N;\n    ...\n}\n```\nApply the equivalent guard to `alloc`, `alloc_with_depth`, and their `ImageStoreMut` counterparts so an attacker-controlled `width`/`height` can never produce a silently-truncated buffer.","locations":[{"ref":"src/image_store.rs:128-151","code":"  128 |     pub fn new(\n  129 |         slice_ref: Vec<T>,\n  130 |         width: usize,\n  131 |         height: usize,\n  132 |     ) -> Result<ImageStore<'a, T, N>, PicScaleError> {\n  133 |         let expected_size = width * height * N;\n  134 |         if slice_ref.len() < width * height * N {\n  135 |             return Err(PicScaleError::BufferMismatch(PicScaleBufferMismatch {\n  136 |                 expected: expected_size,\n  137 |                 width,\n  138 |                 height,\n  139 |                 channels: N,\n  140 |                 slice_len: slice_ref.len(),\n  141 |             }));\n  142 |         }\n  143 |         Ok(ImageStore::<T, N> {\n  144 |             buffer: std::borrow::Cow::Owned(slice_ref),\n  145 |             channels: N,\n  146 |             width,\n  147 |             height,\n  148 |             stride: width * N,\n  149 |             bit_depth: 0,\n  150 |         })\n  151 |     }","lines":24,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/image_store.rs#L128-L151"},{"ref":"src/image_store.rs:179-190","code":"  179 |     /// Allocates new owned image store\n  180 |     pub fn alloc(width: usize, height: usize) -> ImageStore<'a, T, N> {\n  181 |         let vc = vec![T::default(); width * N * height];\n  182 |         ImageStore::<T, N> {\n  183 |             buffer: std::borrow::Cow::Owned(vc),\n  184 |             channels: N,\n  185 |             width,\n  186 |             height,\n  187 |             stride: width * N,\n  188 |             bit_depth: 0,\n  189 |         }\n  190 |     }","lines":12,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/image_store.rs#L179-L190"},{"ref":"src/image_store.rs:333-356","code":"  333 |     pub fn new(\n  334 |         slice_ref: Vec<T>,\n  335 |         width: usize,\n  336 |         height: usize,\n  337 |     ) -> Result<ImageStoreMut<'a, T, N>, PicScaleError> {\n  338 |         let expected_size = width * height * N;\n  339 |         if slice_ref.len() < width * height * N {\n  340 |             return Err(PicScaleError::BufferMismatch(PicScaleBufferMismatch {\n  341 |                 expected: expected_size,\n  342 |                 width,\n  343 |                 height,\n  344 |                 channels: N,\n  345 |                 slice_len: slice_ref.len(),\n  346 |             }));\n  347 |         }\n  348 |         Ok(ImageStoreMut::<T, N> {\n  349 |             buffer: BufferStore::Owned(slice_ref),\n  350 |             channels: N,\n  351 |             width,\n  352 |             height,\n  353 |             stride: width * N,\n  354 |             bit_depth: 0,\n  355 |         })\n  356 |     }","lines":24,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/image_store.rs#L333-L356"},{"ref":"src/image_store.rs:389-399","code":"  389 |     pub fn alloc(width: usize, height: usize) -> ImageStoreMut<'a, T, N> {\n  390 |         let vc = vec![T::default(); width * N * height];\n  391 |         ImageStoreMut::<T, N> {\n  392 |             buffer: BufferStore::Owned(vc),\n  393 |             channels: N,\n  394 |             width,\n  395 |             height,\n  396 |             stride: width * N,\n  397 |             bit_depth: 0,\n  398 |         }\n  399 |     }","lines":11,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/image_store.rs#L389-L399"}]},{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"Both the horizontal and vertical \"low bit-depth\" (`_lb_`) SSE u16 kernels compute a max-color clamp with `_mm_set1_epi16((1 << bit_depth) - 1)` while asserting (or documenting) that `bit_depth` can be as large as 16:\n\n```rust\n// src/sse/rgba_u16_lb.rs\nassert!((1..=16).contains(&bit_depth));\n...\nlet v_max_colors = _mm_set1_epi16((1 << bit_depth) - 1);   // also at line 335, without even an assert\n\n// src/sse/vertical_u16_lb.rs\nassert!((1..=16).contains(&bit_depth));\nlet max_colors = (1 << bit_depth) - 1;   // inferred as i16 because of _mm_set1_epi16 below\n...\nlet v_max_colors = _mm_set1_epi16(max_colors);\n```\nBecause the literal is typed as `i16` (inferred from `_mm_set1_epi16`'s `i16` parameter), `1i16 << bit_depth` is only valid for `bit_depth <= 14`. For `bit_depth == 16` the shift amount equals the type's bit width, which panics with \"attempt to shift left with overflow\" in debug builds (and is masked to a shift of 0 in release, producing `max_colors == 0`, i.e. every pixel clamped to black). For `bit_depth == 15`, `1i16 << 15` is `i16::MIN`, and the subsequent `- 1` panics with \"attempt to subtract with overflow\" in debug builds. Currently every call site in `src/factory/rgba_u16.rs` and `src/factory/plane_u16.rs` only dispatches to these `_lb_` kernels when `options.bit_depth <= 12`, so the bug is not presently reachable, but the functions' own asserts falsely advertise support for the full `1..=16` range.","fix":"Either tighten the assert to the range these fixed-point kernels actually support safely, e.g.:\n```rust\nassert!((1..=14).contains(&bit_depth));\n```\nor compute the clamp value in a wider type before narrowing, e.g. `let max_colors = ((1i32 << bit_depth) - 1) as i16;` (still only safe up to `bit_depth == 15`), and route `bit_depth == 16` to the non-`_lb_` kernel instead.","locations":[{"ref":"src/sse/rgba_u16_lb.rs:199-203","code":"  199 |         assert!((1..=16).contains(&bit_depth));\n  200 |         const CN: usize = 4;\n  201 |         let init = _mm_set1_epi32(ROUNDING_CONST);\n  202 | \n  203 |         let v_max_colors = _mm_set1_epi16((1 << bit_depth) - 1);","lines":5,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/sse/rgba_u16_lb.rs#L199-L203"},{"ref":"src/sse/rgba_u16_lb.rs:333-335","code":"  333 |         const CN: usize = 4;\n  334 | \n  335 |         let v_max_colors = _mm_set1_epi16((1 << bit_depth) - 1);","lines":3,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/sse/rgba_u16_lb.rs#L333-L335"},{"ref":"src/sse/vertical_u16_lb.rs:62-69","code":"   62 |         assert!((1..=16).contains(&bit_depth));\n   63 |         let max_colors = (1 << bit_depth) - 1;\n   64 |         let mut cx = 0usize;\n   65 | \n   66 |         let zeros = _mm_setzero_si128();\n   67 |         let initial_store = _mm_set1_epi32(ROUNDING_CONST);\n   68 | \n   69 |         let v_max_colors = _mm_set1_epi16(max_colors);","lines":8,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/sse/vertical_u16_lb.rs#L62-L69"}]},{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"critical","difficulty":"easy","description":"In `pic_scale_scale_generic`, the alignment/stride check that decides whether the misaligned-pointer safe path (byte-wise copy with `write_unaligned`) must be used for the destination buffer uses `&&` where the source-side equivalent correctly uses `||`:\n```rust\nif src as usize % required_align_of_t != 0 || src_stride % size_of_t != 0 {   // correct: OR\n    ...\n}\n...\nif dst as usize % required_align_of_t != 0 && dst_stride % size_of_t != 0 {   // bug: AND\n    ...\n} else {\n    let dst_slice =\n        slice::from_raw_parts_mut(dst, new_height as usize * (dst_stride / size_of_t));\n    ...\n}\n```\nWith `&&`, a misaligned `dst` pointer combined with an aligned `dst_stride` (a perfectly plausible caller combination — e.g. a `dst` pointer offset by an odd number of bytes into an otherwise well-strided buffer) fails to trigger the safe copy path and instead falls into the `else` branch, which calls `slice::from_raw_parts_mut(dst, ...)` directly on the misaligned `*mut T` pointer. Constructing a `&mut [T]` from a pointer that is not aligned to `align_of::<T>()` is undefined behavior in Rust regardless of whether the slice is subsequently read — this is UB at the point the reference/slice is formed, not just when accessed.","fix":"Change the `&&` to `||` so any misalignment (pointer or stride) routes through the byte-wise `write_unaligned` path, matching the source-side logic:\n```rust\nif dst as usize % required_align_of_t != 0 || dst_stride % size_of_t != 0 {\n    ...\n}\n```","locations":[{"ref":"picscale/src/lib.rs:140-186","code":"  140 |         if dst as usize % required_align_of_t != 0 && dst_stride % size_of_t != 0 {\n  141 |             let mut dst_store = ImageStoreMut::alloc_with_depth(\n  142 |                 new_width as usize,\n  143 |                 new_height as usize,\n  144 |                 bit_depth as usize,\n  145 |             );\n  146 | \n  147 |             let result = source_store.scale(&mut dst_store, options);\n  148 |             let result_code = map_error_code(result);\n  149 |             if result_code != 0 {\n  150 |                 return result_code;\n  151 |             }\n  152 | \n  153 |             let dst_slice =\n  154 |                 slice::from_raw_parts_mut(dst as *mut u8, new_width as usize * dst_stride);\n  155 | \n  156 |             for (src, dst) in dst_store\n  157 |                 .as_bytes()\n  158 |                 .chunks_exact(dst_store.stride())\n  159 |                 .zip(dst_slice.chunks_exact_mut(dst_stride))\n  160 |             {\n  161 |                 for (src, dst) in src.iter().zip(dst.as_chunks_mut::<N>().0.iter_mut()) {\n  162 |                     let dst_ptr = dst.as_mut_ptr() as *mut T;\n  163 |                     dst_ptr.write_unaligned(*src);\n  164 |                 }\n  165 |             }\n  166 |             0\n  167 |         } else {\n  168 |             let dst_slice =\n  169 |                 slice::from_raw_parts_mut(dst, new_height as usize * (dst_stride / size_of_t));\n  170 |             let buffer = BufferStore::Borrowed(dst_slice);\n  171 |             let mut dst_store = ImageStoreMut::<T, N> {\n  172 |                 buffer,\n  173 |                 width: new_width as usize,\n  174 |                 height: new_height as usize,\n  175 |                 bit_depth: bit_depth as usize,\n  176 |                 channels: N,\n  177 |                 stride: dst_stride / size_of_t,\n  178 |             };\n  179 | \n  180 |             let result = source_store.scale(&mut dst_store, options);\n  181 |             let result_code = map_error_code(result);\n  182 |             if result_code != 0 {\n  183 |                 return result_code;\n  184 |             }\n  185 |             0\n  186 |         }","lines":47,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/picscale/src/lib.rs#L140-L186"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"critical","difficulty":"very_easy","description":"In `src/neon/rgba_f16.rs`, the scalar tail loop inside `convolve_horizontal_rgba_neon_row_one_f16` uses `while jx <= bounds.size` instead of `while jx < bounds.size`. Every sibling tail loop in this crate slice (including the 4-row variant `convolve_horizontal_rgba_neon_rows_4_f16` in the very same file, at the equivalent spot) correctly uses `jx < bounds.size`. Because of the `<=`, when `jx` reaches `bounds.size` the loop body still executes one extra time: it calls `weights.get_unchecked(jx)` one past the intended filter tap, and it calls `conv_horiz_rgba_1_f16(bounds_start, src, weight0, store)` with `bounds_start = bounds.start + bounds.size`, i.e. one pixel column past the convolution window. `conv_horiz_rgba_1_f16` then does `src.get_unchecked(start_x * CN..)` and `vld1_u16(src_ptr.cast())`, reading 4 `f16` elements starting at that out-of-range column. When the affected destination column is the last one in a row (a very common case, since `bounds.start + bounds.size` frequently equals the source width there), this reads past the end of the source row/buffer via an unchecked slice index, which is undefined behavior (out-of- bounds read), and even when it happens not to fault it silently adds a bogus extra weighted term to `store`, corrupting the computed pixel value.","fix":"Change the loop condition from `while jx <= bounds.size` to `while jx < bounds.size`, matching every other tail loop in the file (e.g. `convolve_horizontal_rgba_neon_rows_4_f16` a few dozen lines below):\n```rust\nwhile jx < bounds.size {\n    let bounds_start = bounds.start + jx;\n    let w_s = weights.get_unchecked(jx);\n    let weight0 = vld1q_dup_f32(w_s);\n    store = conv_horiz_rgba_1_f16(bounds_start, src, weight0, store);\n    jx += 1;\n}\n```","locations":[{"ref":"src/neon/rgba_f16.rs:215-221","code":"  215 |             while jx <= bounds.size {\n  216 |                 let bounds_start = bounds.start + jx;\n  217 |                 let w_s = weights.get_unchecked(jx);\n  218 |                 let weight0 = vld1q_dup_f32(w_s);\n  219 |                 store = conv_horiz_rgba_1_f16(bounds_start, src, weight0, store);\n  220 |                 jx += 1;\n  221 |             }","lines":7,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/neon/rgba_f16.rs#L215-L221"}]},{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`finish_monochrome` (used for 4:0:0 HEIC decode) silently discards the alpha channel for monochrome images that have one, in both the 8-bit and 16-bit paths. In the 8-bit branch it correctly builds an interleaved gray+alpha buffer `new_img`, but then returns `DynamicImage::ImageLuma8` built from `y` alone — `new_img` is computed and immediately thrown away:\n```rust\nlet mut new_img = vec![0u8; dec.width as usize * dec.height as usize * 2];\nfor ((dst, src), alpha) in new_img.as_chunks_mut::<2>().0.iter_mut().zip(y.iter()).zip(alpha.iter()) {\n    dst[0] = *src;\n    dst[1] = *alpha;\n}\nDynamicImage::ImageLuma8(   // <- uses `y` only; `new_img` (with alpha) is never used\n    image::GrayImage::from_raw(w, h, y.to_vec())\n        .ok_or_else(|| PicError::Format(\"HEIC RGB mismatch\".into()))?,\n)\n```\nThe 16-bit (`high_bit`) branch is worse: it doesn't even check `dec.alpha` at all and always returns `DynamicImage::ImageLuma16`. Any monochrome HEIC/HEIF image with an alpha plane loses its transparency entirely on decode through this crate, silently producing a fully-opaque image instead of an error or a correct `LumaA8`/`LumaA16` result.","fix":"Return the interleaved buffer that was already built, and add the missing alpha handling to the 16-bit path:\n```rust\nif let Some(alpha) = dec.alpha.as_ref() {\n    // ...build new_img as before...\n    DynamicImage::ImageLumaA8(\n        image::GrayAlphaImage::from_raw(w, h, new_img)\n            .ok_or_else(|| PicError::Format(\"HEIC RGBA8 mismatch\".into()))?,\n    )\n} else {\n    DynamicImage::ImageLuma8(image::GrayImage::from_raw(w, h, y.to_vec())...)\n}\n```\nand mirror the same interleave-into-`LumaA16` logic in the `high_bit` branch when `dec.alpha` is `Some`.","locations":[{"ref":"pic-scale-js/src/heif.rs:400-406","code":"  400 |     let img = if high_bit {\n  401 |         let mut y = dec.y.as_u16().expect(\"high-bit luma is u16\").to_vec();\n  402 |         expand_to_16bit(&mut y, is_12);\n  403 |         DynamicImage::ImageLuma16(\n  404 |             image::ImageBuffer::<Luma<u16>, Vec<u16>>::from_raw(w, h, y.to_vec())\n  405 |                 .ok_or_else(|| PicError::Format(\"HEIC RGB mismatch\".into()))?,\n  406 |         )","lines":7,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/pic-scale-js/src/heif.rs#L400-L406"},{"ref":"pic-scale-js/src/heif.rs:409-441","code":"  409 |         if let Some(alpha) = dec.alpha.as_ref() {\n  410 |             let y = match dec.y.as_u8() {\n  411 |                 None => {\n  412 |                     return Err(PicError::Format(\n  413 |                         \"HEIC RGBA8 luma 8 is not actually 8\".into(),\n  414 |                     ));\n  415 |                 }\n  416 |                 Some(v) => v,\n  417 |             };\n  418 |             let alpha = match alpha.as_u8() {\n  419 |                 None => {\n  420 |                     return Err(PicError::Format(\n  421 |                         \"HEIC RGBA8 alpha 8 is not actually 8\".into(),\n  422 |                     ));\n  423 |                 }\n  424 |                 Some(v) => v,\n  425 |             };\n  426 |             let mut new_img = vec![0u8; dec.width as usize * dec.height as usize * 2];\n  427 |             for ((dst, src), alpha) in new_img\n  428 |                 .as_chunks_mut::<2>()\n  429 |                 .0\n  430 |                 .iter_mut()\n  431 |                 .zip(y.iter())\n  432 |                 .zip(alpha.iter())\n  433 |             {\n  434 |                 dst[0] = *src;\n  435 |                 dst[1] = *alpha;\n  436 |             }\n  437 |             DynamicImage::ImageLuma8(\n  438 |                 image::GrayImage::from_raw(w, h, y.to_vec())\n  439 |                     .ok_or_else(|| PicError::Format(\"HEIC RGB mismatch\".into()))?,\n  440 |             )\n  441 |         } else {","lines":33,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/pic-scale-js/src/heif.rs#L409-L441"}]},{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"hard","description":"The Node.js `Image.resize`/`resizeSync` and the WASM `Image.resize` bindings silently break the `\"fit\"`, `\"cover\"`, `\"fit_width\"`, and `\"fit_height\"` resize modes. Both call `CoreImage::resize_with_metadata(width, height, ...)` first — which unconditionally performs a plain stretch-`resize` to the *target* `(width, height)` regardless of `mode` — and only afterwards call `.resize_mode(width, height, ..., mode, ...)` on the already-resized image:\n```rust\n// napi_bindings.rs\nlet (oriented, _) =\n    core.resize_with_metadata(width, height, &filter, premul, workers, &meta_opts)?;\noriented.resize_mode(width, height, &filter, mode, premul, workers, bg)\n```\nBy the time `resize_mode` runs, `oriented`'s dimensions already equal `(width, height)` (the target box), because `resize_with_metadata` (`core.rs`) always calls `self.resize(dst_w, dst_h, ...)` — a `Fill`-style stretch — with no awareness of `mode`. `compute_geometry(src_w, src_h, box_w, box_h, mode)` is then invoked with `src_w == box_w` and `src_h == box_h`, so for every mode the computed `scale` is always `1.0`: `Cover`'s crop becomes a no-op crop (`crop_w == src_w`, `crop_x == 0`), and `Fit`'s padding branch (`if mode == ResizeMode::Fit && (scale_w != box_w || scale_h != box_h)`) can never trigger. The net effect is that `\"fit\"`, `\"cover\"`, `\"fit_width\"`, and `\"fit_height\"` all behave identically to `\"fill\"` (aspect ratio is always destroyed by the first stretch, and no cropping/letterboxing is ever applied), even though the WASM binding's own comments claim the opposite (\"resize_mode on the already-sized image just handles crop/pad; the pixel scaling was already done above\" — this premise is false, since the \"pixel scaling\" already applied the wrong (Fill) geometry).","fix":"Do not resize inside the orientation step. Split `resize_with_metadata` into an orientation-only helper that returns the (still original-size, orientation-corrected) image, and let `resize_mode` perform the *only* resize, computing crop/scale geometry from the true original `src_w`/`src_h`:\n```rust\npub fn apply_orientation_only(&self, meta_opts: &MetadataOptions) -> Result<(CoreImage, Option<Metadata>)> {\n    let orientation = self.metadata.as_ref().map(|m| m.orientation).unwrap_or(Orientation::Normal);\n    let oriented = if meta_opts.auto_orient && !orientation.is_normal() {\n        CoreImage { inner: apply_orientation(self.inner.clone(), orientation), metadata: self.metadata.clone() }\n    } else {\n        CoreImage { inner: self.inner.clone(), metadata: self.metadata.clone() }\n    };\n    Ok((oriented, self.metadata.clone()))\n}\n```\nThen in the bindings: `let (oriented, _) = core.apply_orientation_only(&meta_opts)?; oriented.resize_mode(width, height, &filter, mode, premul, workers, bg)`. For the `Fill` case, `resize_mode` already handles it correctly (`compute_geometry` returns `(0,0,src_w,src_h,box_w,box_h)`), so no separate \"always-Fill\" pre-resize is needed at all.","locations":[{"ref":"pic-scale-js/src/napi_bindings.rs:174-186","code":"  174 |         let core = Arc::clone(&self.core);\n  175 |         let resized = tokio::task::spawn_blocking(move || {\n  176 |             let (oriented, _) =\n  177 |                 core.resize_with_metadata(width, height, &filter, premul, workers, &meta_opts)?;\n  178 |             oriented.resize_mode(width, height, &filter, mode, premul, workers, bg)\n  179 |         })\n  180 |         .await\n  181 |         .map_err(|e| napi::Error::from_reason(e.to_string()))?\n  182 |         .map_err(map_err)?;\n  183 |         Ok(Image {\n  184 |             core: Arc::new(resized),\n  185 |         })\n  186 |     }","lines":13,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/pic-scale-js/src/napi_bindings.rs#L174-L186"},{"ref":"pic-scale-js/src/napi_bindings.rs:227-236","code":"  227 |         let (oriented, _) = self\n  228 |             .core\n  229 |             .resize_with_metadata(width, height, filter, premul, workers, &meta_opts)\n  230 |             .map_err(map_err)?;\n  231 |         let resized = oriented\n  232 |             .resize_mode(width, height, filter, mode, premul, workers, bg)\n  233 |             .map_err(map_err)?;\n  234 |         Ok(Image {\n  235 |             core: Arc::new(resized),\n  236 |         })","lines":10,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/pic-scale-js/src/napi_bindings.rs#L227-L236"},{"ref":"pic-scale-js/src/wasm_bindings.rs:161-196","code":"  161 |         // 1. Apply EXIF orientation + resize to (width, height) via the\n  162 |         //    mode-unaware path — resize_with_metadata always does Fill.\n  163 |         // 2. Then apply the crop/pad mode on the oriented+scaled result\n  164 |         //    so the final output matches exactly (width, height).\n  165 | \n  166 |         let workers: usize = workers\n  167 |             .map(|w| {\n  168 |                 let v: JsValue = w.into();\n  169 |                 if let Some(n) = v.as_f64() {\n  170 |                     return n as usize;\n  171 |                 }\n  172 |                 match v.as_string().as_deref() {\n  173 |                     Some(\"Adaptive\") => 0,\n  174 |                     Some(\"Single\") => 1,\n  175 |                     _ => 1,\n  176 |                 }\n  177 |             })\n  178 |             .unwrap_or(1);\n  179 | \n  180 |         let (oriented_and_scaled, _) = self\n  181 |             .core\n  182 |             .resize_with_metadata(width, height, filter, premultiply, workers, &meta_opts)\n  183 |             .map_err(map_err)?;\n  184 | \n  185 |         let mut resized = if mode != crate::core::ResizeMode::Fill {\n  186 |             // resize_mode on the already-sized image just handles crop/pad;\n  187 |             // the pixel scaling was already done above.\n  188 |             let meta_clone = oriented_and_scaled.metadata.clone();\n  189 |             let mut r = oriented_and_scaled\n  190 |                 .resize_mode(width, height, filter, mode, premultiply, workers, bg)\n  191 |                 .map_err(map_err)?;\n  192 |             r.metadata = meta_clone;\n  193 |             r\n  194 |  | \n  576 |         // 2. Resize\n  577 |         let resized = oriented.resize(dst_w, dst_h, filter, premultiply_alpha, workers)?;\n  578 |         let meta = self.metadata.clone();\n  579 |         Ok((resized, meta))\n  580 |     }","lines":46,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/pic-scale-js/src/core.rs#L535-L580"},{"ref":"pic-scale-js/src/core.rs:641-682","code":"  641 | fn compute_geometry(\n  642 |     src_w: u32,\n  643 |     src_h: u32,\n  644 |     box_w: u32,\n  645 |     box_h: u32,\n  646 |     mode: ResizeMode,\n  647 | ) -> (u32, u32, u32, u32, u32, u32) {\n  648 |     match mode {\n  649 |         ResizeMode::Fill => (0, 0, src_w, src_h, box_w, box_h),\n  650 |         ResizeMode::FitWidth => {\n  651 |             let scale = box_w as f64 / src_w as f64;\n  652 |             let h = (src_h as f64 * scale).round() as u32;\n  653 |             (0, 0, src_w, src_h, box_w, h.max(1))\n  654 |         }\n  655 |         ResizeMode::FitHeight => {\n  656 |             let scale = box_h as f64 / src_h as f64;\n  657 |             let w = (src_w as f64 * scale).round() as u32;\n  658 |             (0, 0, src_w, src_h, w.max(1), box_h)\n  659 |         }\n  660 |         ResizeMode::Fit => {\n  661 |             let scale = (box_w as f64 / src_w as f64).min(box_h as f64 / src_h as f64);\n  662 |             let w = (src_w as f64 * scale).round() as u32;\n  663 |             let h = (src_h as f64 * scale).round() as u32;\n  664 |             (0, 0, src_w, src_h, w.max(1), h.max(1))\n  665 |         }\n  666 |         ResizeMode::Cover => {\n  667 |             let scale = (box_w as f64 / src_w as f64).max(box_h as f64 / src_h as f64);\n  668 |             let crop_w = (box_w as f64 / scale).round() as u32;\n  669 |             let crop_h = (box_h as f64 / scale).round() as u32;\n  670 |             let crop_x = (src_w.saturating_sub(crop_w)) / 2;\n  671 |             let crop_y = (src_h.saturating_sub(crop_h)) / 2;\n  672 |             (\n  673 |                 crop_x,\n  674 |                 crop_y,\n  675 |                 crop_w.min(src_w),\n  676 |                 crop_h.min(src_h),\n  677 |                 box_w,\n  678 |                 box_h,\n  679 |             )\n  680 |         }\n  681 |     }\n  682 | }","lines":42,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/pic-scale-js/src/core.rs#L641-L682"}]},{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"The `bartlett` resampling kernel in `src/math/bartlett.rs` computes an inverted, unbounded ramp instead of the standard triangular (Bartlett) window. Every other kernel in the `math` module (`welch`, `quadric`, `cubic_spline`, `bc_spline`, `blackman`, `bohman`, `hann`/`hamming`/`hanning`) evaluates to its maximum at `x == 0` (the centre tap) and tapers to `0` at the edge of its support. `bartlett` does the opposite: for `x` in `[0, 1]` it returns `2 * x` (so `bartlett(0) == 0`, meaning the pixel that exactly coincides with the sample point gets zero weight), and for any `x` outside `[0, 1]` - including all negative `x` and any `x > 1` - it falls through to `mla(-2, x, 2)` (`2 - 2*x`), which is never clamped to zero. For `x = 3` this returns `-4`, i.e. the kernel keeps producing large, unbounded (even negative) weights arbitrarily far from the centre instead of vanishing outside its support. Unlike `bartlett_hann` in the same file (which has a detailed derivation comment and a full test suite), plain `bartlett` has zero test coverage, so this defect went undetected. Selecting `ResamplingFunction::Bartlett` (wired in `sampler.rs`) will therefore produce visibly wrong/aliased resampling output.","fix":"Rewrite `bartlett` as a proper zero-centred triangular window that peaks at `x == 0` and is clamped to `0` outside its support, e.g. for a unit-radius triangle:\n```rust\npub(crate) fn bartlett<...>(x: V) -> V\nwhere\n    f32: AsPrimitive<V>,\n{\n    let x = x.abs();\n    if x >= 1f32.as_() {\n        return 0f32.as_();\n    }\n    1f32.as_() - x\n}\n```\nIf a wider support was actually intended (matching the two-branch shape), keep two branches but make the first branch decreasing from `1` at `x=0` and clamp the second branch to `0` once it reaches `0`, and add a partition-of-unity test like the ones already present for `bc_spline`/`spline_n` to catch regressions.","locations":[{"ref":"src/math/bartlett.rs:36-55","code":"   36 | pub(crate) fn bartlett<\n   37 |     V: Copy\n   38 |         + Sub<Output = V>\n   39 |         + Mul<Output = V>\n   40 |         + 'static\n   41 |         + PartialOrd\n   42 |         + MulAdd<V, Output = V>\n   43 |         + Add<V, Output = V>\n   44 |         + Neg<Output = V>,\n   45 | >(\n   46 |     x: V,\n   47 | ) -> V\n   48 | where\n   49 |     f32: AsPrimitive<V>,\n   50 | {\n   51 |     if x >= 0f32.as_() && x <= 1f32.as_() {\n   52 |         return 2f32.as_() * x;\n   53 |     }\n   54 |     mla(-2f32.as_(), x, 2f32.as_())\n   55 | }","lines":20,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/math/bartlett.rs#L36-L55"}]},{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"hard","description":"`convolve_horizontal_rgb_neon_rows_4_impl` in `src/sve2/rgb_u8_dot.rs` computes the 4-row RGB output by narrowing `store_0..store_3` (via `svqshrunb_n_s32`) and then extracting each row's 3-byte RGB result from a single packed vector with fixed byte offsets `svext_u8::<4>`, `svext_u8::<8>`, `svext_u8::<12>` (lines 170-172). Those offsets are only correct when the SVE vector length (`svcntb()`) is exactly 16 bytes (128 bits, the NEON-equivalent minimum).\n\nThe function never queries `svcntb()` (unlike the sibling files `src/sve2/vertical_u8_dot.rs` and `src/sve2/vertical_u16_dot.rs`, which correctly compute `let vl = svcntb() as usize;`/`svcnth()` and size their loops dynamically). The table lookup `v_tbl` and weight broadcast `v_weights` (lines 63-65) are only defined/zero-padded for the first 16 bytes, so on hardware where `svcntb() > 16` (any SVE2 implementation with a vector length wider than 128 bits, which the ISA explicitly allows up to 2048 bits), the dot-product accumulators `store_0..store_3` pick up extra non-zero, data-dependent \"garbage\" lanes beyond byte 16 (from `svtbl_u8` returning `rgb_pixel[0]` for out-of-range table indices, multiplied by the fully-broadcast weight vector `vw`).\n\nBecause the narrowing instructions (`svqshrunb_n_s32`, `svqxtnb_u16`) are \"bottom\" narrow instructions that place results at even-strided lane positions across the *whole* vector (not per-128-bit segment), that extra garbage shifts where each row's real RGB bytes land inside `packed`. For `svcntb() == 32` (256-bit SVE2), row0's bytes are still at `packed[0..3]` (correct), but row1's real RGB ends up at `packed[8..11]` instead of the assumed `packed[4..7]`, row2's at `packed[16..19]`, etc. The hardcoded `svext_u8::<4>`/`<8>`/`<12>` then read garbage for `chunk1`/`chunk3` and mis-attribute row1's data to `chunk2`, corrupting the image silently (no panic, no crash - just wrong pixel colors) whenever this SVE2+`i8mm` path is selected (see `src/factory/rgb_u8.rs`, gated only by `is_aarch64_feature_detected!(\"sve2\")` and `(\"i8mm\")`, with no vector-length check).","fix":"Query the runtime vector length with `svcntb()` and either (a) fall back to a scalar/`i8mm`-NEON path when `svcntb() != 16`, or (b) rewrite the packing to be vector-length agnostic, e.g. using the quadword-segmented permute intrinsics (`svuzp1q_u8`/`svextq_u8` equivalents, i.e. operations that operate per 128-bit segment) instead of whole-vector `svuzp1_u8`/`svext_u8` combined with fixed byte offsets. For example, guard the fast path:\n```rust\n#[target_feature(enable = \"sve2,sve,i8mm\")]\nfn convolve_horizontal_rgb_neon_rows_4_impl(...) {\n    debug_assert_eq!(unsafe { svcntb() }, 16, \"rows_4 SVE2 dot path assumes a 128-bit vector length\");\n    ...\n}\n```\nand dispatch to this function only when `svcntb() == 16`, otherwise use the already-correct `sve_convolve_horizontal_rgb_neon_row_one_dot` (which uses the VL-agnostic `pack_s32x4_to_u8!` macro) in a loop, or a NEON `i8mm` fallback.","locations":[{"ref":"src/sve2/rgb_u8_dot.rs:63-65","code":"   63 |     static TBL0: [u8; 16] = [0, 3, 6, 9, 1, 4, 7, 10, 2, 5, 8, 11, 255, 255, 255, 255];\n   64 |     let v_tbl = unsafe { svld1_u8(svwhilelt_b8_u32(0u32, 16u32), TBL0.as_ptr()) };\n   65 |     let v_weights = svreinterpret_u8_u32(svdup_n_u32(u32::from_ne_bytes([0, 1, 2, 3])));","lines":3,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/sve2/rgb_u8_dot.rs#L63-L65"},{"ref":"src/sve2/rgb_u8_dot.rs:160-178","code":"  160 |         let n0 = svqshrunb_n_s32::<7>(store_0);\n  161 |         let n1 = svqshrunb_n_s32::<7>(store_1);\n  162 |         let n2 = svqshrunb_n_s32::<7>(store_2);\n  163 |         let n3 = svqshrunb_n_s32::<7>(store_3);\n  164 | \n  165 |         let s01 = svuzp1_u16(n0, n1);\n  166 |         let s23 = svuzp1_u16(n2, n3);\n  167 |         let packed = svuzp1_u8(svqxtnb_u16(s01), svqxtnb_u16(s23));\n  168 | \n  169 |         unsafe {\n  170 |             let sq1 = svext_u8::<4>(packed, svdup_n_u8(0));\n  171 |             let sq2 = svext_u8::<8>(packed, svdup_n_u8(0));\n  172 |             let sq3 = svext_u8::<12>(packed, svdup_n_u8(0));\n  173 | \n  174 |             svst1_u8(pg3, chunk0.as_mut_ptr(), packed);\n  175 |             svst1_u8(pg3, chunk1.as_mut_ptr(), sq1);\n  176 |             svst1_u8(pg3, chunk2.as_mut_ptr(), sq2);\n  177 |             svst1_u8(pg3, chunk3.as_mut_ptr(), sq3);\n  178 |         }","lines":19,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/sve2/rgb_u8_dot.rs#L160-L178"}]},{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`CoreImage::from_bytes` has an `is_avif()` detector but no working AVIF decode path. HEIC/HEIF bytes are routed to `decode_heic` (libheif) only `if is_heic(bytes) && !is_avif(bytes)`; AVIF-flavoured ISOBMFF (`ftyp` box `avif`/`avis`, which `is_heic` also matches) is explicitly excluded from that branch and falls through to the generic `image::ImageReader`, which has no built-in AVIF decoder in this crate's dependency set (the only AVIF support wired up anywhere in this module is the *encode* side via `maroontree`/AV1 in `avif_enc.rs`). The practical effect is that this library can encode AVIF but cannot decode it — `Image.open()`/`Image.fromBuffer()` on a real AVIF file will fail with a generic/confusing \"unsupported format\" error from `image::ImageReader::decode()` instead of either decoding it or a clear \"AVIF decode not supported\" error.","fix":"Either wire AVIF decode through the existing HEIC path (many libheif builds decode AV1-coded HEIF/AVIF too — try removing the `&& !is_avif(bytes)` exclusion and see if `decode_heic` handles it), or, if AVIF decode is intentionally unsupported, fail fast with an explicit message instead of falling through silently:\n```rust\nif is_avif(bytes) {\n    return Err(PicError::Format(\"AVIF decoding is not supported; only AVIF encoding is available\".into()));\n}\n```","locations":[{"ref":"pic-scale-js/src/core.rs:132-140","code":"  132 | fn is_avif(bytes: &[u8]) -> bool {\n  133 |     if bytes.len() < 12 {\n  134 |         return false;\n  135 |     }\n  136 |     if &bytes[4..8] != b\"ftyp\" {\n  137 |         return false;\n  138 |     }\n  139 |     matches!(&bytes[8..12], b\"avif\" | b\"avis\")\n  140 | }","lines":9,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/pic-scale-js/src/core.rs#L132-L140"},{"ref":"pic-scale-js/src/core.rs:182-210","code":"  182 |     pub fn from_bytes(bytes: &[u8]) -> Result<Self>
