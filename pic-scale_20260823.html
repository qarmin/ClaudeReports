itive<V>,\n{\n    let x = x.abs();\n    if x > 1f32.as_() {\n        return 0f32.as_();\n    }\n    let i0a = 1.0f64.as_() / 6.33f64.as_().bessel_i0();\n    (6.33f64.as_() * mla(-x, x, 1.0f64.as_()).sqrt()).bessel_i0() * i0a\n}\n```","locations":[{"ref":"src/math/kaiser.rs:52-76","code":"   52 | pub(crate) fn kaiser<\n   53 |     V: Copy\n   54 |         + Mul<Output = V>\n   55 |         + Div<Output = V>\n   56 |         + MulAssign\n   57 |         + AddAssign\n   58 |         + 'static\n   59 |         + PartialOrd\n   60 |         + Sub<Output = V>\n   61 |         + Float\n   62 |         + BesselI0\n   63 |         + MulAdd<Output = V>,\n   64 | >(\n   65 |     x: V,\n   66 | ) -> V\n   67 | where\n   68 |     f64: AsPrimitive<V>,\n   69 |     f32: AsPrimitive<V>,\n   70 | {\n   71 |     if x > 1f32.as_() {\n   72 |         return 0f32.as_();\n   73 |     }\n   74 |     let i0a = 1.0f64.as_() / 6.33f64.as_().bessel_i0();\n   75 |     (6.33f64.as_() * mla(-x, x, 1.0f64.as_()).sqrt()).bessel_i0() * i0a\n   76 | }","lines":25,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/math/kaiser.rs#L52-L76"}]},{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`welch` in `src/math/welch.rs` does not clamp or `abs()` its argument before branching: `if x == 0 { 1 } else if x >= 1 { 0 } else { mla(-x, x, 1) }`. For any `x <= -1` (e.g. `x = -1.5`), none of the first two arms match (`x >= 1` is false for negative `x`), so it falls into the `else` branch and computes `mla(-x, x, 1) = -x*x + 1`, e.g. `-2.25 + 1 = -1.25` for `x = -1.5` - a large negative, unbounded value instead of the `0` a windowed kernel must return outside its support. As with `kaiser`, the current call site in `weights.rs` always passes an `abs`-ed distance so this is not observed today, but the function is `pub(crate)` and inconsistent with every sibling kernel in the module, which all clamp/`abs()` symmetrically.","fix":"Take the absolute value first so the function is correct for the full domain, e.g.:\n```rust\npub(crate) fn welch<...>(x: V) -> V\nwhere\n    f32: AsPrimitive<V>,\n{\n    let x = x.abs();\n    if x == 0f32.as_() {\n        1f32.as_()\n    } else if x >= 1f32.as_() {\n        0.0f32.as_()\n    } else {\n        mla(-x, x, 1f32.as_())\n    }\n}\n```","locations":[{"ref":"src/math/welch.rs:34-56","code":"   34 | pub(crate) fn welch<\n   35 |     V: Copy\n   36 |         + PartialOrd\n   37 |         + Mul<Output = V>\n   38 |         + Sub<Output = V>\n   39 |         + 'static\n   40 |         + MulAdd<Output = V>\n   41 |         + Neg<Output = V>\n   42 |         + Add<V, Output = V>,\n   43 | >(\n   44 |     x: V,\n   45 | ) -> V\n   46 | where\n   47 |     f32: AsPrimitive<V>,\n   48 | {\n   49 |     if x == 0f32.as_() {\n   50 |         1f32.as_()\n   51 |     } else if x >= 1f32.as_() {\n   52 |         0.0f32.as_()\n   53 |     } else {\n   54 |         mla(-x, x, 1f32.as_())\n   55 |     }\n   56 | }","lines":23,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/math/welch.rs#L34-L56"}]},{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`_mm_div_by_255_epi16` in `src/sse/alpha_u8.rs` is documented as \"Exact division by 255 with rounding to nearest\" but its formula differs from the crate's own scalar reference `div_by_255` in `src/alpha_handle_u8.rs`:\n\n```rust\n// src/sse/alpha_u8.rs\npub(crate) fn _mm_div_by_255_epi16(v: __m128i) -> __m128i {\n    let addition = _mm_set1_epi16(127);\n    let j0 = _mm_add_epi16(v, addition);   // v + 127\n    let j1 = _mm_srli_epi16::<8>(v);       // v >> 8   (uses raw v, not v+127!)\n    _mm_srli_epi16::<8>(_mm_add_epi16(j0, j1))\n}\n\n// src/alpha_handle_u8.rs (scalar reference)\npub(crate) fn div_by_255(v: u16) -> u8 {\n    ((((v + 0x80) >> 8) + v + 0x80) >> 8) as u8\n}\n```\nThe scalar version uses `t = v + 128` consistently for both the addend and the `>> 8` term (the standard `SkDiv255Round`-style trick). The SSE version instead adds `127` for one term but shifts the *un-added* `v` for the other term. Exhaustively comparing both formulas over the full product range `v` in `0..=65025` (all possible `u8 * u8` products used for premultiply) shows they disagree at 380 distinct values (e.g. `v=128` gives `0` from the SSE path but `1` from the scalar path, `v=383` gives `1` vs `2`, etc. - a pattern recurring roughly every 255). This means `sse_premultiply_alpha_rgba` (which calls this helper via `Sse41PremultiplyExecutor8Default::premultiply_chunk`) produces color channel values that are off by one from the scalar/AVX2/NEON implementations for about 0.58% of all `color*alpha` products, breaking exact cross-backend pixel reproducibility and contradicting the \"Exact division\" doc comment.","fix":"Match the scalar `div_by_255` formula exactly by adding `128` (not `127`) before computing both terms:\n```rust\npub(crate) fn _mm_div_by_255_epi16(v: __m128i) -> __m128i {\n    unsafe {\n        let addition = _mm_set1_epi16(128);\n        let t = _mm_add_epi16(v, addition);\n        let j1 = _mm_srli_epi16::<8>(t);\n        _mm_srli_epi16::<8>(_mm_add_epi16(t, j1))\n    }\n}\n```\nThis mirrors `((v + 128) + ((v + 128) >> 8)) >> 8` used by `div_by_255`, eliminating the 380-value discrepancy.","locations":[{"ref":"src/sse/alpha_u8.rs:42-50","code":"   42 | /// Exact division by 255 with rounding to nearest\n   43 | #[inline(always)]\n   44 | pub(crate) fn _mm_div_by_255_epi16(v: __m128i) -> __m128i {\n   45 |     unsafe {\n   46 |         let addition = _mm_set1_epi16(127);\n   47 |         let j0 = _mm_add_epi16(v, addition);\n   48 |         let j1 = _mm_srli_epi16::<8>(v);\n   49 |         _mm_srli_epi16::<8>(_mm_add_epi16(j0, j1))\n   50 |     }","lines":9,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/sse/alpha_u8.rs#L42-L50"}]},{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`CpuRound::cpu_round` in `src/mixed_storage.rs` (used on targets without SSE4.1/`aarch64`, e.g. plain x86 or wasm builds) rounds half-way values via the classic \"add-then-subtract a shifter constant\" trick, adding `f32::EPSILON` / `f64::EPSILON` first specifically (per the inline comment) \"to break\" the round-half-to-even behavior at exact `N.5` values. `f32::EPSILON` (~1.19e-7) and `f64::EPSILON` (~2.22e-16) are the ULP near `1.0`, not near the magnitude of `self`. For any `self` whose own ULP is larger than the epsilon constant (which happens for `|self|` roughly `>= 2` for `f32`, or `>= 2` for `f64`), `self + f32::EPSILON` rounds back to exactly `self` before the shifter is ever added, so the nudge has no effect and ties still resolve via round-to-even instead of the documented \"always break the tie\" behavior - silently reintroducing the very bug the comment says the epsilon fixes, for all but very small magnitudes.","fix":"Scale the nudge to the magnitude of `self` instead of using a fixed epsilon, e.g. add half an ULP of `self` (`self * f32::EPSILON` clamped to a minimum, or use `self.next_up()` style bit manipulation), or simply document that this fallback path only guarantees round-half-up for small magnitudes and rely on `self.round()` (already used on the SIMD-capable targets) by widening the `cfg` gate rather than shipping a fallback that silently stops working above a certain magnitude.","locations":[{"ref":"src/mixed_storage.rs:51-65","code":"   51 |         #[cfg(not(any(\n   52 |             all(\n   53 |                 any(target_arch = \"x86\", target_arch = \"x86_64\"),\n   54 |                 target_feature = \"sse4.1\"\n   55 |             ),\n   56 |             target_arch = \"aarch64\"\n   57 |         )))]\n   58 |         {\n   59 |             // This is always wrong for exactly N.5, so\n   60 |             // we add just one eps to break this behavior.\n   61 |             // This method is not valid for NaN, |x| = Inf, |x| >= 2^23\n   62 |             const SHIFTER: f32 = ((1u32 << 23) + (1u32 << 22)) as f32;\n   63 |             ((self + f32::EPSILON) + SHIFTER) - SHIFTER\n   64 |         }\n   65 |     }","lines":15,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/mixed_storage.rs#L51-L65"},{"ref":"src/mixed_storage.rs:81-94","code":"   81 |         #[cfg(not(any(\n   82 |             all(\n   83 |                 any(target_arch = \"x86\", target_arch = \"x86_64\"),\n   84 |                 target_feature = \"sse4.1\"\n   85 |             ),\n   86 |             target_arch = \"aarch64\"\n   87 |         )))]\n   88 |         {\n   89 |             // This is always wrong for exactly N.5, so\n   90 |             // we add just one eps to break this behavior.\n   91 |             // This method is not valid for NaN, |x| = Inf, |x| >= 2^52.\n   92 |             const SHIFTER: f64 = ((1u64 << 52) + (1u64 << 51)) as f64;\n   93 |             ((self + f64::EPSILON) + SHIFTER) - SHIFTER\n   94 |         }","lines":14,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/mixed_storage.rs#L81-L94"}]},{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`_mm_srai_epi64x::<IMM8>` in `src/sse/utils.rs` is meant to emulate a 64-bit arithmetic right shift using only logical-shift intrinsics (SSE2 has no native `_mm_srai_epi64`):\n```rust\npub(crate) fn _mm_srai_epi64x<const IMM8: i32>(a: __m128i) -> __m128i {\n    unsafe {\n        let m = _mm_set1_epi64x(1 << (64 - 1));   // always bit 63, regardless of IMM8\n        let x = _mm_srli_epi64::<IMM8>(a);\n        _mm_sub_epi64(_mm_xor_si128(x, m), m)\n    }\n}\n```\nThe standard `(x XOR m) - m` trick for turning a logical shift into an arithmetic one requires `m` to track the *post-shift* sign-bit position, i.e. `m = 1 << (63 - IMM8)`, which itself must be logically shifted right by `IMM8` along with `x`. Here `m` is hard-coded to `1 << 63` and never shifted, so the identity only happens to hold for `IMM8 == 0`. For any other shift amount the result is wrong: e.g. for `a = -4i64` and `IMM8 = 1`, the correct arithmetic shift is `-2`, but this function returns `0x7FFFFFFFFFFFFFFE` (a huge positive value) instead. `_mm_srai_epi64x` is not currently called anywhere else in the crate (grep across `src/` only finds its own definition), so the bug is latent/dead for now, but the function is `pub(crate)` and looks safe to reach for by a future caller needing a 64-bit arithmetic shift on SSE2-only targets.","fix":"Shift the sign mask by `IMM8` as well, so it lines up with where the original sign bit ends up after the logical shift:\n```rust\npub(crate) fn _mm_srai_epi64x<const IMM8: i32>(a: __m128i) -> __m128i {\n    unsafe {\n        let m = _mm_srli_epi64::<IMM8>(_mm_set1_epi64x(1 << 63));\n        let x = _mm_srli_epi64::<IMM8>(a);\n        _mm_sub_epi64(_mm_xor_si128(x, m), m)\n    }\n}\n```","locations":[{"ref":"src/sse/utils.rs:252-260","code":"  252 | #[inline(always)]\n  253 | /// Arithmetic shift for i64, shifting with sign bits\n  254 | pub(crate) fn _mm_srai_epi64x<const IMM8: i32>(a: __m128i) -> __m128i {\n  255 |     unsafe {\n  256 |         let m = _mm_set1_epi64x(1 << (64 - 1));\n  257 |         let x = _mm_srli_epi64::<IMM8>(a);\n  258 |         _mm_sub_epi64(_mm_xor_si128(x, m), m)\n  259 |     }\n  260 | }","lines":9,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/sse/utils.rs#L252-L260"}]},{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"easy","description":"`SigmoidalRgbaSplitter` in `src/colors/sigmoidal_scaler.rs` is supposed to convert RGBA into the *sigmoidized* colorspace (that is the entire point of `SigmoidalScaler`, and the RGB-only sibling `SigmoidalRgbSplitter` does exactly that via `rgb_to_sigmoidal`/`sigmoidal_to_rgb`). Instead, `split` calls `rgba_to_xyz_with_alpha` and `merge` calls `xyz_with_alpha_to_rgba` - the same functions used by `XyzRgbaSplitter` in `src/colors/xyz_scaler.rs`. This is a clear copy-paste artifact: whoever wrote the RGBA variant of `SigmoidalScaler` copied `xyz_scaler.rs`'s RGBA splitter and never swapped the conversion calls. As a result, `SigmoidalScaler::plan_rgba_resampling` silently resamples in linear XYZ space instead of the sigmoidal space, while `SigmoidalScaler::plan_rgb_resampling` (no alpha) correctly uses sigmoidal. Any user who picks `SigmoidalScaler` specifically for its perceptual/edge behavior on RGBA images gets completely different (XYZ-space) results with no error or warning. The `colorutils_rs` crate already exposes the correct alpha-aware functions needed to fix this: `rgba_to_sigmoidal(src: &ImageBuffer<u8>, dst: &mut ImageBufferMut<f32>)` and `sigmoidal_to_rgba(src: &ImageBuffer<f32>, dst: &mut ImageBufferMut<u8>)` (see `colorutils-rs-0.8.0/src/image_to_sigmoidal.rs` and `sigmoidal_to_image.rs`), with signatures that take no matrix/transfer-function arguments, mirroring `rgb_to_sigmoidal`/`sigmoidal_to_rgb` already used a few lines above in the same file.","fix":"Use the alpha-aware sigmoidal conversion functions instead of the XYZ ones, matching the pattern already used by `SigmoidalRgbSplitter`:\n```rust\nuse colorutils_rs::{\n    TransferFunction, rgb_to_sigmoidal, rgba_to_sigmoidal, sigmoidal_to_rgb, sigmoidal_to_rgba,\n};\n// ...\nimpl Splitter<u8, f32, 4> for SigmoidalRgbaSplitter {\n    fn split(\n        &self,\n        from: &ImageStore<'_, u8, 4>,\n        into: &mut ImageStoreMut<'_, f32, 4>,\n    ) -> Result<(), PicScaleError> {\n        let mut dst_buffer = into.to_colorutils_buffer_mut();\n        rgba_to_sigmoidal(&from.to_colorutils_buffer(), &mut dst_buffer)\n            .map_err(|x| PicScaleError::Generic(x.to_ th path (`convolve_horizontal_rgba_sse_rows_4_u16` / `convolve_horizontal_rgba_sse_u16_row`). Confirmed by inspecting `src/sse/`: there is a `src/sse/rgba_u16.rs` and `src/sse/rgba_u16_lb.rs`, but no `rgb_u16.rs`/`rgb_u16_lb.rs` equivalent exists anywhere under `src/sse/`. The practical effect is that on any x86_64/x86 CPU that has SSE4.1 but not AVX2 (or when the `avx` cargo feature is disabled but `sse` is enabled), scaling a 3-channel 16-bit RGB image always falls back to the fully scalar fixed-point/floating- point handlers, while the same CPU scaling a 4-channel RGBA image gets a proper SSE-accelerated path. This is the exact kind of RGB-vs-RGBA divergence between otherwise-mirrored factory files that indicates a missing implementation rather than an intentional difference.","fix":"Add `src/sse/rgb_u16_lb.rs` and an SSE high-bit-depth RGB kernel analogous to `src/sse/rgba_u16_lb.rs` / `src/sse/rgba_u16.rs` (de-interleaving 3 channels instead of 4), and wire them into `src/factory/rgb_u16.rs::horizontal_plan` the same way `src/factory/rgba_u16.rs` wires in `convolve_horizontal_rgba_sse_rows_4_lb_u16` / `convolve_horizontal_rgba_sse_u16_lb_row` and `convolve_horizontal_rgba_sse_rows_4_u16` / `convolve_horizontal_rgba_sse_u16_row`. Until that SIMD work is done, at minimum leave a `// TODO` comment noting the intentionally-missing SSE path so future readers don't mistake the asymmetry for an accident (which is exactly what this audit did).","locations":[{"ref":"src/factory/rgb_u16.rs:44-108","code":"   44 |         if options.bit_depth <= 12 {\n   45 |             let approx =\n   46 |                 filter_weights.numerical_approximation_i16::<{ crate::support::PRECISION }>(0);\n   47 |             #[cfg(all(target_arch = \"aarch64\", feature = \"neon\"))]\n   48 |             {\n   49 |                 use crate::neon::{\n   50 |                     convolve_horizontal_rgb_neon_rows_4_lb_u16,\n   51 |                     convolve_horizontal_rgb_neon_u16_lb_row,\ se in the crate (e.g. `src/sse/vertical_u16_lb.rs`, `src/sse/rgba_u16_lb.rs`) specifically for the fixed-point/`i16`-weight kernels reserved for `bit_depth <= 12`, whereas this file's kernel takes `weight: &[f32]` and is dispatched for `bit_depth > 12`. The names appear to be copy-pasted from the actual low-bit-depth file, which can mislead future maintainers into thinking this is the low-bit-depth path.","fix":"Rename the helpers to drop the misleading `_lb_` infix, e.g. `convolve_column_u16_def` / `convolve_column_u16_impl`, matching what the public entry point `convolve_column_sse_u16` and its `weight: &[f32]` signature actually represent.","locations":[{"ref":"src/sse/vertical_u16.rs:52-63","code":"   52 | #[target_feature(enable = \"sse4.1\")]\n   53 | /// This inlining is required to activate all features for runtime dispatch\n   54 | fn convolve_column_lb_u16_def(\n   55 |     bounds: &FilterBounds,\n   56 |     src: &[u16],\n   57 |     dst: &mut [u16],\n   58 |     src_stride: usize,\n   59 |     weight: &[f32],\n   60 |     bit_depth: u32,\n   61 | ) {\n   62 |     convolve_column_lb_u16_impl::<false>(bounds, src, dst, src_stride, weight, bit_depth);\n   63 | }","lines":12,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/sse/vertical_u16.rs#L52-L63"}]},{"id":"CPY_6","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"very_easy","description":"In `src/wasm32/rgb_u8.rs`, the two helper functions `conv_horiz_rgba_2_u8` (line 68) and `conv_horiz_rgba_1_u8` (line 93) are named as if they operate on RGBA pixels, but both hardcode `const CN: usize = 3;` and are only ever called from the RGB convolution code in this same file (`convolve_horizontal_rgb_neon_rows_4_impl`, `convolve_horizontal_rgb_neon_row_one_impl`). This is leftover naming from copying the RGBA implementation (`src/wasm32/rgba_u8.rs` has its own, distinct `conv_horiz_rgba_2_u8`/`conv_horiz_rgba_1_u8` with `CN = 4`) and ada gFunction` is selected.","fix":"Add the same eager validation used by the other planners at the top of `plan_resize_ar30`, before the `Nearest` short-circuit:\n```rust\npub(crate) fn plan_resize_ar30<const AR30_ORDER: usize>(\n    &self,\n    ar30_type: Rgb30,\n    source_size: ImageSize,\n    destination_size: ImageSize,\n) -> Result<Arc<Resampling<u8, 4>>, PicScaleError> {\n    if destination_size.width == 0 || destination_size.height == 0 {\n        return Err(PicScaleError::ZeroImageDimensions);\n    }\n    if self.function == ResamplingFunction::Nearest {\n        return Ok(Arc::new(ResampleNearestPlan { ... }));\n    }\n    ...\n}\n```","locations":[{"ref":"src/scaler.rs:847-861","code":"  847 |     pub(crate) fn plan_resize_ar30<const AR30_ORDER: usize>(\n  848 |         &self,\n  849 |         ar30_type: Rgb30,\n  850 |         source_size: ImageSize,\n  851 |         destination_size: ImageSize,\n  852 |     ) -> Result<Arc<Resampling<u8, 4>>, PicScaleError> {\n  853 |         if self.function == ResamplingFunction::Nearest {\n  854 |             return Ok(Arc::new(ResampleNearestPlan {\n  855 |                 source_size,\n  856 |                 target_size: destination_size,\n  857 |                 _threading_policy: self.threading_policy,\n  858 |                 _phantom_data: PhantomData,\n  859 |             }));\n  860 |         }\n  861 |         let inner_plan = self.plan_rgb_resampling16(source_size, destination_size, 10)?;","lines":15,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/scaler.rs#L847-L861"},{"ref":"src/plan/default_planner.rs:130-142","code":"  130 |         if destination_size.width == 0 || destination_size.height == 0 {\n  131 |             return Err(PicScaleError::ZeroImageDimensions);\n  132 |         }\n  133 |         if check_image_size_overflow(\n  134 |             destination_size.width,\n  135 |             destination_size.height,\n  136 |             N,\n  137 | src.iter().zip(dst.as_chunks_mut::<N>().0.iter_mut()) {\n  162 |                     let dst_ptr = dst.as_mut_ptr() as *mut T;\n  163 |                     dst_ptr.write_unaligned(*src);\n  164 |                 }\n  165 |             }\n  166 |             0\n  167 |         } else {\n  168 |             let dst_slice =\n  169 |                 slice::from_raw_parts_mut(dst, new_height as usize * (dst_stride / size_of_t));\n  170 |             let buffer = BufferStore::Borrowed(dst_slice);\n  171 |             let mut dst_store = ImageStoreMut::<T, N> {\n  172 |                 buffer,\n  173 |                 width: new_width as usize,\n  174 |                 height: new_height as usize,\n  175 |                 bit_depth: bit_depth as usize,\n  176 |                 channels: N,\n  177 |                 stride: dst_stride / size_of_t,\n  178 |             };\n  179 | \n  180 |             let result = source_store.scale(&mut dst_store, options);\n  181 |             let result_code = map_error_code(result);\n  182 |             if result_code != 0 {\n  183 |                 return result_code;\n  184 |             }\n  185 |             0\n  186 |         }\n  187 |     }\n  188 | }","lines":117,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/picscale/src/lib.rs#L72-L188"}]},{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"`ImageStore::copied_to_mut` in `src/image_store.rs` copies row-by-row and pixel-by-pixel using `.zip()` on both the row iterators (`self.projected().chunks(self.stride()).zip(dst_buffer.chunks_mut(into_stride))`) and the per-row element iterators, but never checks that `self.width == into.width` / `self.height == into.height`. `.zip()` silently stops at the shorter of the two iterators, so if `into` is smaller than `self` the copy silently produces a partially-filled destination (remaining rows/columns left at whatever they were before the call) with no error, panic, or other signal to the caller that the copy was incomplete. Given the function's only contract is \"deep copy immutable image into mutable\", a caller passing a mismatched destination gets a corrupted image instead of a diagnosable failure.","fix":"Validate the shapes match (or return a `Result` and an error) before copying:\n```rust\npub fn copied_to_mut(&self, into: &mut ImageStoreMut<T, N>) -> Result<(), PicScaleError> {\n    if self.width != into.width || self.height != into.height {\n        return Err(PicScaleError::BufferMismatch(...));\n    }\n    ...\n    Ok(())\n}\n```","locations":[{"ref":"src/image_store.rs:613-626","code":"  613 |     /// Deep copy immutable image into mutable\n  614 |     pub fn copied_to_mut(&self, into: &mut ImageStoreMut<T, N>) {\n  615 |         let into_stride = into.stride();\n  616 |         let dst_buffer = into.projected();\n  617 |         for (src_row, dst_row) in self\n  618 |             .projected()\n  619 |             .chunks(self.stride())\n  620 |             .zip(dst_buffer.chunks_mut(into_stride))\n  621 |         {\n  622 |             for (&src, dst) in src_row.iter().zip(dst_row.iter_mut()) {\n  623 |                 *dst = src;\n  624 |             }\n  625 |         }\n  626 |     }","lines":14,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/image_store.rs#L613-L626"}]},{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"`convolve_horizontal_plane_neon_rdm_row` in `src/neon/plane_u8_rdm.rs` is declared `pub fn`, while every other function in this file (`convolve_horizontal_plane_neon_rows_rdm_4_u8`) and every other function across the whole `src/neon` module that is exported via `mod.rs` is declared `pub(crate) fn`. This is an accidental widening of visibility beyond what the rest of the codebase's convention intends for this internal SIMD kernel; `mod.rs` even re-exports it as `pub(crate) use plane_u8_rdm::{ convolve_horizontal_plane_neon_rdm_row, ... }`, showing the re-export site itself expects crate-private visibility.","fix":"Change the declaration to match every sibling function:\n```rust\npub(crate) fn convolve_horizontal_plane_neon_rdm_row(\n```","locations":[{"ref":"src/neon/plane_u8_rdm.rs:286","code":"  286 | pub fn convolve_horizontal_plane_neon_rdm_row(","lines":1,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/neon/plane_u8_rdm.rs#L286"}]},{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"hard","description":"Both `src/factory/cbcr8.rs` (`u8`, 2-channel CbCr) and `src/factory/cbcr16.rs` (`u16`, 2-channel CbCr) only dispatch to NEON and SSE4.1 kernels on top of the scalar fallback - there is no `#[cfg(all(target_arch = \"x86_64\", feature = \"avx\"))]` branch in either file, unlike every other pixel-layout factory file (`rgb_u8.rs`, `rgba_u8.rs`, `rgb_u16.rs`, `rgba_u16.rs`, `plane_u8.rs`, `plane_u16.rs`, all the `*_f32.rs` files), which all have AVX2 (and in some cases AVX-VNNI) fast paths. Grepping `src/avx2/*.rs` for any `cbcr`-named function turns up nothing at all, confirming this isn't a wiring bug in `cbcr8.rs`/`cbcr16.rs` themselves but a genuine gap: no AVX2 kernel for the interleaved 2-channel (CbCr) layout has ever been written. This means CbCr plane resizing (a common operation for YUV 4:2:0/4:2:2 image pipelines) never benefits from AVX2 on x86_64 even when it is available, unlike RGB/RGBA/single-plane data, which is a noticeable and easily-overlooked performance cliff given how central CbCr planes are to video/YUV workflows.","fix":"Add AVX2 (and ideally AVX-VNNI) horizontal kernels for the 2-channel interleaved layout, mirroring the existing `src/avx2/rgb_u8.rs`/`rgba_u8.rs` kernels but de-interleaving 2 channels instead of 3/4, and wire them into `cbcr8.rs`/`cbcr16.rs::horizontal_plan` behind `std::arch::is_x86_feature_detected!(\"avx2\")` the same way `rgb_u8.rs` does. If this is intentionally deprioritized, document it with a short comment in both files so the gap doesn't look like an oversight during future audits.","locations":[{"ref":"src/factory/cbcr8.rs:39-111","code":"   39 | impl HorizontalFilterPass<u8, f32, 2> for ImageStore<'_, u8, 2> {\n   40 |     fn horizontal_plan(\n   41 |         filter_weights: FilterWeights<f32>,\n   42 |         threading_policy: ThreadingPolicy,\n   43 |         _options: ConvolutionOptions,\n   44 |     ) -> Arc<dyn RowFilter<u8, 2> + Send + Sync> {\n   45 |         let _scale_factor = _options.src_size.width as f32 / _options.dst_size.width as f32;\n   46 |         let mut _dispatcher_4_rows: Option<\n   47 |             fn(&[u8], usize, &mut [u8], usize, &FilterWeights<i16>, u32),\n   48 |         > = Some(handle_fixed_rows_4_u8::<2>);\n   49 |         let mut _dispatcher_1_row: fn(&[u8], &mut [u8], &FilterWeights<i16>, u32) =\n   50 |             handle_fixed_row_u8::<2>;\n   51 |         #[cfg(all(target_arch = \"aarch64\", feature = \"neon\"))]\n   52 |         {\n   53 |             use crate::neon::{\n   54 |                 convolve_horizontal_cbcr_neon_row, convolve_horizontal_cbcr_neon_rows_4_u8,\n   55 |             };\n   56 |             _dispatcher_4_rows = Some(convolve_horizontal_cbcr_neon_rows_4_u8);\n   57 |             _dispatcher_1_row = convolve_horizontal_cbcr_neon_row;\n   58 |             #[cfg(feature = \"rdm\")]\n   59 |             if _scale_factor < 8.\n   60 |                 && std::arch::is_aarch64_feature_detected!(\"rdm\")\n   61 |                 && _options.workload_strategy == crate::WorkloadStrategy::PreferSpeed\n   62 |             {\n   63 |                 use crate::neon::{\n   64 |                     convolve_horizontal_cbcr_neon_rdm_row,\n   65 |                     convolve_horizontal_cbcr_neon_rows_rdm_4_u8,\n   66 |                 };\n   67 |                 _dispatcher_4_rows = Some(convolve_horizontal_cbcr_neon_rows_rdm_4_u8);\n   68 |                 _dispatcher_1_row = convolve_horizontal_cbcr_neon_rdm_row;\n   69 |             }\n   70 |             #[cfg(feature = \"nightly_i8mm\")]\n   71 |             if _scale_factor < 10.\n   72 |                 && std::arch::is_aarch64_feature_detected!(\"i8mm\")\n   73 |                 && _options.workload_strategy == crate::WorkloadStrategy::PreferSpeed\n   74 |             {\n   75 |                 use crate::neon::{\n   76 |                     convolve_horizontal_cbcr_neon_dot_row,\n   77 |                     convolve_horizontal_cbcr_neon_rows_dot_4_u8,\n   78 |                 };\n   79 |                 let dispatcher_4_rows: Option<\n   80 |                     fn(&[u8], usize, &mut [u8], usize, &FilterWeights<i8>, u32),\n   81 |                 > = Some(convolve_horizontal_cbcr_neon_rows_dot_4_u8);\n   82 |                 let dispatcher_1_row = convolve_horizontal_cbcr_neon_dot_row;\n   83 |                 let i_weights = filter_weights.numerical_approximation_q0_7(0);\n   84 |                 return Arc::new(HorizontalFiltering {\n   85 |                     filter_weights: i_weights,\n   86 |                     filter_4_rows: dispatcher_4_rows,\n   87 |                     filter_row: dispatcher_1_row,\n   88 |                     _threading_policy: threading_policy,\n   89 |                 });\n   90 |             }\n   91 |         }\n   92 |         #[cfg(all(any(target_arch = \"x86_64\", target_arch = \"x86\"), feature = \"sse\"))]\n   93 |         {\n   94 |             if std::arch::is_x86_feature_detected!(\"sse4.1\") {\n   95 |                 use crate::sse::{\n   96 |                     convolve_horizontal_cbcr_sse_row_one, convolve_horizontal_cbcr_sse_rows_4,\n   97 |                 };\n   98 |                 _dispatcher_4_rows = Some(convolve_horizontal_cbcr_sse_rows_4);\n   99 |                 _dispatcher_1_row = convolve_horizontal_cbcr_sse_row_one;\n  100 |             }\n  101 |         }\n  102 |         use crate::support::PRECISION;\n  103 |         let i_weights = filter_weights.numerical_approximation::<i16, PRECISION>(0);\n  104 |         Arc::new(HorizontalFiltering {\n  105 |             filter_weights: i_weights,\n  106 |             filter_4_rows: _dispatcher_4_rows,\n  107 |             filter_row: _dispatcher_1_row,\n  108 |             _threading_policy: threading_policy,\n  109 |         })\n  110 |     }\n  111 | }","lines":73,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/factory/cbcr8.rs#L39-L111"},{"ref":"src/factory/cbcr16.rs:38-99","code":"   38 | impl HorizontalFilterPass<u16, f32, 2> for ImageStore<'_, u16, 2> {\n   39 |     fn horizontal_plan(\n   40 |         filter_weights: FilterWeights<f32>,\n   41 |         threading_policy: ThreadingPolicy,\n   42 |         options: ConvolutionOptions,\n   43 |     ) -> Arc<dyn RowFilter<u16, 2> + Send + Sync> {\n   44 |         if options.bit_depth <= 12 {\n   45 |             let approx =\n   46 |                 filter_weights.numerical_approximation_i16::<{ crate::support::PRECISION }>(0);\n   47 |             #[cfg(all(target_arch = \"aarch64\", feature = \"neon\"))]\n   48 |             {\n   49 |                 use crate::neon::{\n   50 |                     convolve_horizontal_gray_alpha_neon_rows_4_lb_u16,\n   51 |                     convolve_horizontal_gray_alpha_neon_u16_lb_row,\n   52 |                 };\n   53 |                 return Arc::new(HorizontalFiltering {\n   54 |                     filter_weights: approx,\n   55 |                     filter_4_rows: Some(convolve_horizontal_gray_alpha_neon_rows_4_lb_u16),\n   56 |                     filter_row: convolve_horizontal_gray_alpha_neon_u16_lb_row,\n   57 |                     _threading_policy: threading_policy,\n   58 |                 });\n   59 |             }\n   60 |             #[cfg(not(all(target_arch = \"aarch64\", feature = \"neon\")))]\n   61 |             {\n   62 |                 use crate::fixed_point_horizontal::{\n   63 |                     convolve_row_handler_fixed_point, convolve_row_handler_fixed_point_4,\n   64 |                 };\n   65 |                 return Arc::new(HorizontalFiltering {\n   66 |                     filter_weights: approx,\n   67 |                     filter_4_rows: Some(convolve_row_handler_fixed_point_4::<u16, i32, 2>),\n   68 |                     filter_row: convolve_row_handler_fixed_point::<u16, i32, 2>,\n   69 |                     _threading_policy: threading_policy,\n   70 |                 });\n   71 |             }\n   72 |         }\n   73 |         #[cfg(all(target_arch = \"aarch64\", feature = \"neon\"))]\n   74 |         {\n   75 |             use crate::neon::{\n   76 |                 convolve_horizontal_cbcr_neon_f32_u16_row,\n   77 |                 convolve_horizontal_cbcr_neon_rows_4_f32_u16,\n   78 |             };\n   79 |             Arc::new(HorizontalFiltering {\n   80 |                 filter_weights,\n   81 |                 filter_4_rows: Some(convolve_horizontal_cbcr_neon_rows_4_f32_u16),\n   82 |                 filter_row: convolve_horizontal_cbcr_neon_f32_u16_row,\n   83 |                 _threading_policy: threading_policy,\n   84 |             })\n   85 |         }\n   86 |         #[cfg(not(all(target_arch = \"aarch64\", feature = \"neon\")))]\n   87 |         {\n   88 |             use crate::floating_point_horizontal::{\n   89 |                 convolve_row_handler_floating_point, convolve_row_handler_floating_point_4,\n   90 |             };\n   91 |             Arc::new(HorizontalFiltering {\n   92 |                 filter_weights,\n   93 |                 filter_4_rows: Some(convolve_row_handler_floating_point_4::<u16, f32, f32, 2>),\n   94 |                 filter_row: convolve_row_handler_floating_point::<u16, f32, f32, 2>,\n   95 |                 _threading_policy: threading_policy,\n   96 |             })\n   97 |         }\n   98 |     }\n   99 | }","lines":62,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/factory/cbcr16.rs#L38-L99"}]},{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"In `src/neon/rgb_f32_f64.rs`, `convolve_horizontal_rgb_neon_row_one_f32_f64` uses `while jx + 2 < bounds.size` for its 2-wide vectorized loop, whereas the otherwise-identical 4-row sibling `convolve_horizontal_rgb_neon_rows_4_f32_f64` (and every other `+2`-wide loop across `plane_f32.rs`, `plane_f32_f64.rs` and this same file's own `<= ` version) uses `jx + 2 <= bounds.size`. With the strict `<`, whenever `bounds.size` is exactly `jx + 2` at the last iteration (e.g. any even-sized bound), the fast 2-wide `ld2x3_rgb`/`vfmaq_laneq_f64` path is skipped for the final pair, and the two elements silently fall through to the scalar `ld1x3_rgb` single-element tail loop instead. The result is numerically equivalent (all elements still get processed, just via two scalar FMAs into the same accumulators instead of one vector FMA), so this is a missed-vectorization/performance regression rather than a memory-safety or correctness bug, but it is a clear divergence from the sibling implementation and defeats the purpose of the SIMD fast path for a whole class of bound sizes.","fix":"Change the condition to match the sibling rows-4 implementation:\n```rust\nwhile jx + 2 <= bounds.size {\n```","locations":[{"ref":"src/neon/rgb_f32_f64.rs:207","code":"  207 |             while jx + 2 < bounds.size {","lines":1,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/neon/rgb_f32_f64.rs#L207"}]},{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`sse_unpremultiply_alpha_rgba_f16` picks between a software and hardware (`f16c`) conversion path at runtime:\n```rust\npub(crate) fn sse_unpremultiply_alpha_rgba_f16(in_place: &mut [f16]) {\n    unsafe {\n        if is_x86_feature_detected!(\"f16c\") {\n            sse_unpremultiply_alpha_rgba_f16c(in_place);\n        } else {\n            sse_unpremultiply_alpha_rgba_f16_regular(in_place);\n        }\n    }\n}\n```\nbut its sibling `sse_premultiply_alpha_rgba_f16` never does the equivalent check and always takes the software path:\n```rust\npub(crate) fn sse_premultiply_alpha_rgba_f16(dst: &mut [f16], src: &[f16]) {\n    unsafe {\n        sse_premultiply_alpha_rgba_f16_regular(dst, src);\n    }\n}\n```\nBoth eventually call the same generic `<const F16C: bool>` implementation (`sse_premultiply_alpha_rgba_row_f16_impl` / `sse_unpremultiply_alpha_rgba_f16_row_impl`), which does support an `F16C = true` fast path using `_mm_cvtph_psx`/`_mm_cvtps_phx` hardware conversion — but there is no `#[target_feature(enable = \"sse4.1\", enable = \"f16c\")]` wrapper for premultiply analogous to `sse_unpremultiply_alpha_rgba_f16c`, so `sse_premultiply_alpha_rgba_row_f16_impl::<true>` is never instantiated/called anywhere in the crate. Every RGBA-`f16` premultiply on x86 with SSE therefore always uses the slower software `f16`<->`f32` conversion, even on CPUs that support `f16c`.","fix":"Add an `f16c` dispatch wrapper for premultiply symmetric to the unpremultiply one:\n```rust\npub(crate) fn sse_premultiply_alpha_rgba_f16(dst: &mut [f16], src: &[f16]) {\n    unsafe {\n        if is_x86_feature_detected!(\"f16c\") {\n            sse_premultiply_alpha_rgba_f16c(dst, src);\n        } else {\n            sse_premultiply_alpha_rgba_f16_regular(dst, src);\n        }\n    }\n}\n\n#[target_feature(enable = \"sse4.1\", enable = \"f16c\")]\nfn sse_premultiply_alpha_rgba_f16c(dst: &mut [f16], src: &[f16]) {\n    sse_premultiply_alpha_rgba_row_f16_impl::<true>(dst, src);\n}\n```","locations":[{"ref":"src/sse/alpha_f16.rs:39-48","code":"   39 | pub(crate) fn sse_premultiply_alpha_rgba_f16(dst: &mut [f16], src: &[f16]) {\n   40 |     unsafe {\n   41 |         sse_premultiply_alpha_rgba_f16_regular(dst, src);\n   42 |     }\n   43 | }\n   44 | \n   45 | #[target_feature(enable = \"sse4.1\")]\n   46 | fn sse_premultiply_alpha_rgba_f16_regular(dst: &mut [f16], src: &[f16]) {\n   47 |     sse_premultiply_alpha_rgba_row_f16_impl::<false>(dst, src);\n   48 | }","lines":10,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/sse/alpha_f16.rs#L39-L48"},{"ref":"src/sse/alpha_f16.rs:107-125","code":"  107 | pub(crate) fn sse_unpremultiply_alpha_rgba_f16(in_place: &mut [f16]) {\n  108 |     unsafe {\n  109 |         if is_x86_feature_detected!(\"f16c\") {\n  110 |             sse_unpremultiply_alpha_rgba_f16c(in_place);\n  111 |         } else {\n  112 |             sse_unpremultiply_alpha_rgba_f16_regular(in_place);\n  113 |         }\n  114 |     }\n  115 | }\n  116 | \n  117 | #[target_feature(enable = \"sse4.1\")]\n  118 | fn sse_unpremultiply_alpha_rgba_f16_regular(in_place: &mut [f16]) {\n  119 |     sse_unpremultiply_alpha_rgba_f16_row_impl::<false>(in_place);\n  120 | }\n  121 | \n  122 | #[target_feature(enable = \"sse4.1\", enable = \"f16c\")]\n  123 | fn sse_unpremultiply_alpha_rgba_f16c(in_place: &mut [f16]) {\n  124 |     sse_unpremultiply_alpha_rgba_f16_row_impl::<true>(in_place);\n  125 | }","lines":19,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/sse/alpha_f16.rs#L107-L125"}]},{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"In `src/wasm32/rgba_u8.rs`, the horizontal-convolution tap loops in `convolve_horizontal_rgba_wasm_rows_4_u8_impl` (lines 151, 165) and `convolve_horizontal_rgba_wasm_row_impl` (lines 243, 254) use strict `<` in their loop guards:\n```rust\nwhile jx + 4 < bounds_size { ... }\nwhile jx + 2 < bounds_size { ... }\n```\nwhereas the equivalent RGB loops in `src/wasm32/rgb_u8.rs` (lines 181, 195, 226, 276) correctly use `<=`:\n```rust\nwhile jx + 4 <= bounds.size { ... }\nwhile jx + 2 <= bounds.size { ... }\n```\nWith `<`, whenever `bounds_size` is an exact multiple of 4 (or the remainder is exactly 2), the last full 4-wide (or 2-wide) SIMD group is skipped and instead falls through to the slower 2-wide/1-wide/scalar tail paths. The final results are numerically identical (every tap is still consumed exactly once), so this is not a correctness bug, but it silently discards vectorization opportunities on every call where the tap count lines up on a 4- or 2-element boundary - a common case (e.g. box/bilinear filters with small, round tap counts).","fix":"Change the loop guards to `<=` to match `src/wasm32/rgb_u8.rs`:\n```rust\nwhile jx + 4 <= bounds_size { ... }\nwhile jx + 2 <= bounds_size { ... }\n```\nso the largest available SIMD group is always used before falling back to narrower/scalar taps.","locations":[{"ref":"src/wasm32/rgba_u8.rs:151","code":"  151 |             while jx + 4 < bounds_size {","lines":1,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/wasm32/rgba_u8.rs#L151"},{"ref":"src/wasm32/rgba_u8.rs:165","code":"  165 |             while jx + 2 < bounds_size {","lines":1,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/wasm32/rgba_u8.rs#L165"},{"ref":"src/wasm32/rgba_u8.rs:243","code":"  243 |             while jx + 4 < bounds_size {","lines":1,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/wasm32/rgba_u8.rs#L243"},{"ref":"src/wasm32/rgba_u8.rs:254","code":"  254 |             while jx + 2 < bounds_size {","lines":1,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/wasm32/rgba_u8.rs#L254"}]},{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"high","difficulty":"medium","description":"In `src/avx512/check_alpha.rs`, `avx512_has_non_constant_cap_alpha_rgba8_impl` scans each row for non-constant alpha via `for chunk in row.as_chunks::<64>().0.iter()`. `[T]::as_chunks::<64>()` returns `(&[[T; 64]], &[T])`: `.0` holds only the complete 64-byte chunks, `.1` holds the trailing remainder (`row.len() % 64` bytes). The code only iterates `.0` and never touches `.1`, so whenever `width * 4` is not a multiple of 64 (i.e. `width` is not a multiple of 16), the last few pixels of every row are silently skipped by the alpha scan.\nAs a direct consequence, the `let working_mask: __mmask64 = if chunk.len() == 64 {...} else {...}` branch is dead: every `chunk` yielded by `.0.iter()` always has `chunk.len() == 64`, so the partial-mask `else` arm (lines 68-69) can never execute even though it was clearly written to handle the tail.\nThis makes the function silently under-report `true` (non-constant alpha) as `false` (constant alpha) whenever the varying alpha byte(s) live in the untested tail of a row, which can lead to using an incorrect \"constant alpha\" fast path (e.g. skipping premultiply/unpremultiply per-pixel work) on images whose alpha does vary. The two unit tests in this file both use `image_size = 256` (`256*4 = 1024`, an exact multiple of 64), so they never exercise the buggy tail path.","fix":"Iterate the remainder from `as_chunks::<64>().1` as well (with a mask sized to its actual length), e.g.:\n```rust\nfor chunk in row.as_chunks::<64>().0.iter() {\n    let mut r0 = _mm512_mask_loadu_epi8(base_mask, 0xffff_ffff_ffff_ffff, chunk.as_ptr() as *const _);\n    r0 = _mm512_shuffle_epi8(r0, sh0);\n    r0 = _mm512_xor_si512(r0, def_alpha);\n    sums = _mm512_add_epi32(sums, r0);\n}\nlet tail = row.as_chunks::<64>().1;\nif !tail.is_empty() {\n    let working_mask: __mmask64 = 0xffff_ffff_ffff_ffff >> (64 - tail.len());\n    let mut r0 = _mm512_mask_loadu_epi8(base_mask, working_mask, tail.as_ptr() as *const _);\n    r0 = _mm512_shuffle_epi8(r0, sh0);\n    r0 = _mm512_xor_si512(r0, def_alpha);\n    sums = _mm512_add_epi32(sums, r0);\n}\n```\nThis also makes the previously-dead partial-`working_mask` branch reachable and meaningful.","locations":[{"ref":"src/avx512/check_alpha.rs:61-78","code":"   61 |         for row in store.chunks(stride) {\n   62 |             let row = &row[..width * 4];\n   63 |             let mut sums = _mm512_set1_epi32(0);\n   64 | \n   65 |             for chunk in row.as_chunks::<64>().0.iter() {\n   66 |                 let working_mask: __mmask64 = if chunk.len() == 64 {\n   67 |                     0xffff_ffff_ffff_ffff\n   68 |                 } else {\n   69 |                     0xffff_ffff_ffff_ffff >> (64 - chunk.len())\n   70 |                 };\n   71 | \n   72 |                 let mut r0 =\n   73 |                     _mm512_mask_loadu_epi8(base_mask, working_mask, chunk.as_ptr() as *const _);\n   74 |                 r0 = _mm512_shuffle_epi8(r0, sh0);\n   75 |                 r0 = _mm512_xor_si512(r0, def_alpha);\n   76 | \n   77 |                 sums = _mm512_add_epi32(sums, r0);\n   78 |             }","lines":18,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/avx512/check_alpha.rs#L61-L78"}]},{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"medium","difficulty":"very_easy","description":"In `CoreImage::encode_with_metadata`, the third `is_heif_format(&fmt_lower)` check is unreachable: the first `is_heif_format` block earlier in the same function already handles that case unconditionally and returns from the function, so control can never reach the second check.\n```rust\nif is_heif_format(&fmt_lower) {\n    ...\n    return encode_heic(&self.inner, opts.quality, icc, exif);   // always returns here\n}\nif is_avif_format(&fmt_lower) { ... return Ok(encoded); }\nif is_heif_format(&fmt_lower) {          // dead: `fmt_lower` already handled above\n    return Err(PicError::Format(\n        \"HEIF/AVIF encoding is not supported in WASM builds\".into(),\n    ));\n}\n```\nThis looks like a leftover from an intended `#[cfg(target_arch = \"wasm32\")]` split (native builds call `encode_heic`, WASM builds should instead return the \"not supported\" error) that was never wired up with the actual `cfg` attributes, leaving confusing, unreachable code.","fix":"Gate the two blocks by target so the intent is actually enforced:\n```rust\n#[cfg(not(target_arch = \"wasm32\"))]\nif is_heif_format(&fmt_lower) {\n    ...\n    return encode_heic(&self.inner, opts.quality, icc, exif);\n}\nif is_avif_format(&fmt_lower) { ... }\n#[cfg(target_arch = \"wasm32\")]\nif is_heif_format(&fmt_lower) {\n    return Err(PicError::Format(\"HEIF/AVIF encoding is not supported in WASM builds\".into()));\n}\n```\nOr simply delete the dead second `is_heif_format` block if native-only builds are the only target that matters.","locations":[{"ref":"pic-scale-js/src/core.rs:460-500","code":"  460 |         if is_heif_format(&fmt_lower) {\n  461 |             let icc = if meta_opts.icc {\n  462 |                 src_meta.and_then(|m| m.icc.as_deref())\n  463 |             } else {\n  464 |                 None\n  465 |             };\n  466 |             let exif = if meta_opts.exif {\n  467 |                 src_meta.and_then(|m| m.exif.as_deref())\n  468 |             } else {\n  469 |                 None\n  470 |             };\n  471 |             return encode_heic(&self.inner, opts.quality, icc, exif);\n  472 |         }\n  473 |         if is_avif_format(&fmt_lower) {\n  474 |             let mut cfg = maroontree::EncodeConfig::new()\n  475 |                 .with_quality(opts.quality)\n  476 |                 .with_threads(\n  477 |                     std::thread::available_parallelism()\n  478 |                         .unwrap_or(NonZeroUsize::new(1).unwrap())\n  479 |                         .get(),\n  480 |                 );\n  481 |             if let Some(icc) = src_meta.and_then(|m| m.icc.as_deref()) {\n  482 |                 cfg = cfg.with_icc_profile(icc.to_vec());\n  483 |             }\n  484 | "difficulty":"easy","description":"In `plan_intermediate_sizes`, the early-return meant to skip multi-step planning for filters with an unbounded kernel is unreachable:\n```rust\nlet max_ratio = function\n    .get_resampling_filter::<f32>()\n    .min_kernel_size\n    .max(1.5)\n    .min(4.0) as f64;\n\n// For filters with no effective ratio limit just do a single step.\nif max_ratio == f64::MAX {\n    return Vec::new();\n}\n```\n`max_ratio` is clamped with `.min(4.0)` *before* the comparison, so it can never equal `f64::MAX` no matter what `min_kernel_size` was. A search of every `ResamplingFilter` constructed in `get_resampling_filter` (in `src/sampler.rs`) confirms `min_kernel_size` is always a small literal (`1f32` .. `6f32`); no variant ever sets it to `f32::MAX`. So the `if max_ratio == f64::MAX` branch is dead code, and whatever intent it encoded (skip step-splitting entirely for some class of filter) never fires — every non-Nearest filter always goes through the log-space step distribution below, even ones for which fewer/no intermediate steps might be intended.","fix":"Either remove the dead check, or fix the ordering/condition so it can actually trigger, e.g. compare the *unclamped* value:\n```rust\nlet raw_kernel_size = function.get_resampling_filter::<f32>().min_kernel_size;\nif raw_kernel_size == f32::MAX {\n    return Vec::new();\n}\nlet max_ratio = raw_kernel_size.max(1.5).min(4.0) as f64;\n```\nIf no filter is ever meant to opt out of multi-step planning this way, delete the dead branch and the misleading comment instead.","locations":[{"ref":"src/plan/superresolution.rs:39-48","code":"   39 |     let max_ratio = function\n   40 |         .get_resampling_filter::<f32>()\n   41 |         .min_kernel_size\n   42 |         .max(1.5)\n   43 |         .min(4.0) as f64;\n   44 | \n   45 |     // For filters with no effective ratio limit just do a single step.\n   46 |     if max_ratio == f64::MAX {\n   47 |         return Vec::new();\n   48 |     }","lines" N: i32 = 15;\n  415 |             const ROUNDING: i32 = 1 << (PRECISION - 1);\n  416 | \n  417 |             let init = _mm_set1_epi32(ROUNDING);","lines":9,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/avx2/horizontal_ar30.rs#L409-L417"}]},{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"In `src/avx2/horizontal_ar30.rs`, the comment directly above `let v_cut_off = _mm_set1_epi16(1023);` warns that \"Building it with `_mm_set1_epi32` leaves every odd 16-bit lane zero, which clamps green to 0\", describing a bug scenario for code that uses `_mm_set1_epi32`. However the actual line of code uses `_mm_set1_epi16(1023)`, not `_mm_set1_epi32`, so the described failure mode does not apply to the code as written. The comment is misleading/inaccurate for the current implementation and reads like a warning against a hypothetical edit rather than documentation of the real code.","fix":"Remove or rewrite the comment so it documents the actual code (`_mm_set1_epi16(1023)` broadcasts the AR30 10-bit max into every 16-bit lane, which is what the subsequent `_mm_min_epi16` clamp needs) instead of warning about a `_mm_set1_epi32` variant that is not present.","locations":[{"ref":"src/avx2/horizontal_ar30.rs:419-422","code":"  419 |             // 16-bit lanes: the clamp is applied with `_mm_min_epi16` after\n  420 |             // `_mm_packus_epi32`. Building it with `_mm_set1_epi32` leaves every odd\n  421 |             // 16-bit lane zero, which clamps green to 0.\n  422 |             let v_cut_off = _mm_set1_epi16(1023);","lines":4,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/avx2/horizontal_ar30.rs#L419-L422"}]},{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment on `Scaler::plan_rgba_resampling_f16` claims alpha premultiplication ignores its own parameter:\n```rust\n/// The `f16` variant of [`plan_rgba_resampling`]. Alpha premultiplication is always\n/// applied — RGB channels are pre-multiplied by alpha before resampling and\n/// un-multiplied afterward — regardless of the `premultiply_alpha` flag.\n...\npub fn plan_rgba_resampling_f16(\n    &self,\n    source_size: ImageSize,\n    target_size: ImageSize,\n    premultiply_alpha: bool,\n) -> Result<Arc<Resampling<f16, 4>>, PicScaleError> {\n    AlphaPlanner::plan_generic_resize_with_alpha::<f16, f32, 4>(\n        self, source_size, target_size, 8, premultiply_alpha,\n    )\n}\n```\nThe implementation passes `premultiply_alpha` straight through as `needs_alpha_premultiplication`. Tracing `AlphaPlanner::plan_generic_resize_with_alpha` -> `build_single_step_plan_with_alpha`, when both the forward and backward flags are `false` it explicitly falls back to `DefaultPlanner::plan_generic_resize` (no alpha handling at all): `if !needs_alpha_premultiplication_backward && !needs_alpha_premultiplication_forward { return DefaultPlanner::plan_generic_resize(...); }`. So `premultiply_alpha: false` does skip premultiplication, contradicting the doc comment's claim that it is \"always applied ... regardless of the flag\".","fix":"Correct the doc comment to match the other `plan_*_resampling` variants (e.g. `plan_rgba_resampling`), which correctly document that premultiplication is conditional on the flag:\n```rust\n/// The `f16` variant of [`plan_rgba_resampling`]. When `premultiply_alpha` is `true`\n/// the RGB channels are pre-multiplied by alpha before resampling and un-multiplied\n/// afterward, preventing dark fringing around transparent edges.\n```","locations":[{"ref":"src/scaler_f16.rs:121-152","code":"  121 |     /// Creates a resampling plan for a four-channel RGBA `f16` image.\n  122 |     ///\n  123 |     /// The `f16` variant of [`plan_rgba_resampling`]. Alpha premultiplication is always\n  124 |     /// applied — RGB channels are pre-  |             }\n  103 |         } else {\n  104 |             for (&src, dst) in from.as_bytes().iter().zip(into.buffer.borrow_mut()) {\n  105 |                 *dst = self.linearization[src as usize];\n  106 |             }\n  107 |         }\n  108 |         Ok(())\n  109 |     }\n  110 | \n  111 |     fn merge(\n  112 |         &self,\n  113 |         from: &ImageStore<'_, u16, N>,\n  114 |         into: &mut ImageStoreMut<'_, u8, N>,\n  115 |     ) -> Result<(), PicScaleError> {\n  116 |         into.bit_depth = 8;\n  117 |         let lut_cap = (1 << 12) - 1;\n  118 |         if N == 4 {\n  119 |             for (src, dst) in from\n  120 |                 .as_bytes()\n  121 |                 .as_chunks::<4>()\n  122 |                 .0\n  123 |                 .iter()\n  124 |                 .zip(into.buffer.borrow_mut().as_chunks_mut::<4>().0.iter_mut())\n  125 |             {\n  126 |                 dst[0] = self.gamma[src[0] as usize];\n  127 |                 dst[1] = self.gamma[src[1] as usize];\n  128 |                 dst[2] = self.gamma[src[2] as usize];\n  129 |                 dst[3] = (src[3] >> 4).min(255) as u8;\n  130 |             }\n  131 |         } else if N == 2 && self.has_alpha {\n  132 |             for (src, dst) in from\n  133 |                 .as_bytes()\n  134 |                 .as_chunks::<2>()\n  135 |                 .0\n  136 |                 .iter()\n  137 |                 .zip(into.buffer.borrow_mut().as_chunks_mut::<2>().0.iter_mut())\n  138 |             {\n  139 |                 dst[0] = self.gamma[src[0] as usize];\n  140 |                 dst[1] = (src[1] >> 4).min(255) as u8;\n  141 |             }\n  142 |         } else {\n  143 |             for (&src, dst) in from.as_bytes().iter().zip(into.buffer.borrow_mut()) {\n  144 |                 *dst = self.gamma[(src as usize).min(lut_cap)];\n  145 |             }\n  146 |         }\n  147 |         Ok(())\n  148 |     }\n  149 | \n  150 |     fn bit_depth(&self) -> usize {\n  151 |         12\n  152 |     }\n  153 | }\n  154 | \n  155 | struct Linearization {\n  156 |     linearization: Box<[u16; 256]>,\n  157 |     gamma: Box<[u8; 65536]>,\n  158 | }\n  159 | \n  160 | struct Linearization16 {\n  161 |     linearization: Box<[u16; 65536]>,\n  162 |     gamma: Box<[u16; 65536]>,\n  163 | }\n  164 | \n  165 | fn make_linearization(transfer_function: TransferFunction) -> Linearization {\n  166 |     let mut linearizing = Box::new([0u16; 256]);\n  167 |     let max_lin_depth = (1u32 << 12) - 1;\n  168 |     let mut gamma = Box::new([0u8; 65536]);\n  169 | \n  170 |     const S: f32 = 1. / 255.;\n  171 | \n  172 |     for (i, dst) in linearizing.iter_mut().enumerate() {\n  173 |         *dst = (transfer_function.linearize(i as f32 * S) * max_lin_depth as f32)\n  174 |             .cpu_round()\n  175 |             .min(max_lin_depth as f32) as u16;\n  176 |     }\n  177 | \n  178 |     let max_keep = 1u32 << 12;\n  179 | \n  180 |     let rcp_max_lin_depth = 1. / max_lin_depth as f32;\n  181 | \n  182 |     for (i, dst) in gamma.iter_mut().take(max_keep as usize).enumerate() {\n  183 |         *dst = (transfer_function.gamma(i as f32 * rcp_max_lin_depth) * 255.)\n  184 |             .cpu_round()\n  185 |             .min(255.) as u8;\n  186 |     }\n  187 | \n  188 |     Linearization {\n  189 |         linearization: linearizing,\n  190 |         gamma,\n  191 |     }\n  192 | }\n  193 | \n  194 | fn make_linearization16(\n  195 |     transfer_function: TransferFunction,\n  196 |     bit_depth: usize,\n  197 | ) -> Result<Linearization16, PicScaleError> {\n  198 |     if bit_depth < 8 {\n  199 |         return Err(PicScaleError::UnsupportedBitDepth(bit_depth));\n  200 |     }\n  201 |     let mut linearizing = Box::new([0u16; 65536]);\n  202 |     let max_lin_depth = (1u32 << bit_depth) - 1;\n  203 |     let keep_max = 1u32 << bit_depth;\n  204 |     let mut gamma = Box::new([0u16; 65536]);\n  205 | \n  206 |     let rcp_max_lin_depth = 1. / max_lin_depth as f32;\n  207 | \n  208 |     for (i, dst) in linearizing.iter_mut().take(keep_max as usize).enumerate() {\n  209 |         *dst = (transfer_function.linearize(i as f32 * rcp_max_lin_depth) * 65535.)\n  210 |             .cpu_round()\n  211 |             .min(65535.) as u16;\n  212 |     }\n  213 | \n  214 |     const S: f32 = 1. / 65535.;\n  215 | \n  216 |     for (i, dst) in gamma.iter_mut().enumerate() {\n  217 |         *dst = (transfer_function.gamma(i as f32 * S) * max_lin_depth as f32)\n  218 |             .cpu_round()\n  219 |             .min(max_lin_depth as f32) as u16;\n  220 |     }\n  221 | \n  222 |     Ok(Linearization16 {\n  223 |         linearization: linearizing,\n  224 |         gamma,\n  225 |     })\n  226 | }\n  227 | \n  228 | impl LinearApproxScaler {\n  229 |     pub fn set_threading_policy(&mut self, threading_policy: ThreadingPolicy) -> Self {\n  230 |         self.scaler.threading_policy = threading_policy;\n  231 |         *self\n  232 |     }\n  233 | \n  234 |     pub fn plan_planar_resampling(\n  235 |         &self,\n  236 |         source_size: ImageSize,\n  237 |         target_size: ImageSize,\n  238 |     ) -> Result<Arc<Resampling<u8, 1>>, PicScaleError> {\n  239 |         let intercept = self\n  240 |             .scaler\n  241 |             .plan_planar_resampling16(source_size, target_size, 12)?;\n  242 |         let scratch_size = intercept.scratch_size();\n  243 |         let lin = make_linearization(self.transfer_function);\n  244 |         Ok(Arc::new(SplitPlanInterceptor {\n  245 |             intercept,\n  246 |             splitter: Arc::new(Common8BitSplitter {\n  247 |                 linearization: lin.linearization,\n  248 |                 gamma: lin.gamma,\n  249 |                 has_alpha: false,\n  250 |             }),\n  251 |             inner_scratch: scratch_size,\n  252 |         }))\n  253 |     }\n  254 | \n  255 |     pub fn plan_cbcr_resampling(\n  256 |         &self,\n t back.\n   39 | ///\n   40 | /// This is more precise and slower than scaling in linear fixed point.\n   41 | ///\n   42 | /// This is an expensive method, and its precision might not be required,\n   43 | /// consider to use [LinearApproxScaler] instead\n   44 | pub struct LinearScaler {\n   45 |     pub(crate) scaler: Scaler,\n   46 |     pub(crate) transfer_function: TransferFunction,\n   47 | }\n   48 | \n   49 | impl LinearScaler {\n   50 |     /// Creates new instance with sRGB transfer function\n   51 |     pub fn new(filter: ResamplingFunction) -> Self {\n   52 |         LinearScaler {\n   53 |             scaler: Scaler::new(filter),\n   54 |             transfer_function: TransferFunction::Srgb,\n   55 |         }\n   56 |     }\n   57 | \n   58 |     /// Creates new instance with requested transfer function\n   59 |     pub fn new_with_transfer(\n   60 |         filter: ResamplingFunction,\n   61 |         transfer_function: TransferFunction,\n   62 |     ) -> Self {\n   63 |         LinearScaler {\n   64 |             scaler: Scaler::new(filter),\n   65 |             transfer_function,\n   66 |         }\n   67 |     }\n   68 | }\n   69 | \n   70 | struct Common8BitSplitter<const N: usize> {\n   71 |     linearization: Box<[f32; 256]>,\n   72 |     gamma: Box<[u8; 65536]>,\n   73 |     has_alpha: bool,\n   74 | }\n   75 | \n   76 | impl<const N: usize> Splitter<u8, f32, N> for Common8BitSplitter<N> {\n   77 |     fn split(\n   78 |         &self,\n   79 |         from: &ImageStore<'_, u8, N>,\n   80 |         into: &mut ImageStoreMut<'_, f32, N>,\n   81 |     ) -> Result<(), PicScaleError> {\n   82 |         const S: f32 = 1. / 255.;\n   83 |         if N == 4 {\n   84 |             for (src, dst) in from\n   85 |                 .as_bytes()\n   86 |                 .as_chunks::<4>()\n   87 |                 .0\n   88 |                 .iter()\n   89 |                 .zip(into.buffer.borrow_mut().as_chunks_mut::<4>().0.iter_mut())\n   90 |             {\n   91 |                 dst[0] = self.linearization[src[0] as usize];\n   92 |                 dst[1] = self.linearization[src[1] as usize];\n   93 |                 dst[2] = self.linearization[src[2] as usize];\n   94 |                 dst[3] = src[3] as f32 * S;\n   95 |             }\n   96 |         } else if N == 2 && self.has_alpha {\n   97 |             for (src, dst) in from\n   98 |                 .as_bytes()\n   99 |                 .as_chunks::<2>()\n  100 |                 .0\n  101 |                 .iter()\n  102 |                 .zip(into.buffer.borrow_mut().as_chunks_mut::<2>().0.iter_mut())\n  103 |             {\n  104 |                 dst[0] = self.linearization[src[0] as usize];\n  105 |                 dst[1] = src[1] as f32 * S;\n  106 |             }\n  107 |         } else {\n  108 |             for (&src, dst) in from.as_bytes().iter().zip(into.buffer.borrow_mut()) {\n  109 |                 *dst = self.linearization[src as usize];\n  110 |             }\n  111 |         }\n  112 |         Ok(())\n  113 |     }\n  114 | \n  115 |     fn merge(\n  116 |         &self,\n  117 |         from: &ImageStore<'_, f32, N>,\n  118 |         into: &mut ImageStoreMut<'_, u8, N>,\n  119 |     ) -> Result<(), PicScaleError> {\n  120 |         if N == 4 {\n  121 |             for (src, dst) in from\n  122 |                 .as_bytes()\n  123 |                 .as_chunks::<4>()\n  124 |                 .0\n  125 |                 .iter()\n  126 |                 .zip(into.buffer.borrow_mut().as_chunks_mut::<4>().0.iter_mut())\n  127 |             {\n  128 |                 let v0 = (src[0] * 65535.).cpu_round() as u16;\n  129 |                 let v1 = (src[1] * 65535.).cpu_round() as u16;\n  130 |                 let v2 = (src[2] * 65535.).cpu_round() as u16;\n  131 | \n  132 |                 dst[0] = self.gamma[v0 as usize];\n  133 |                 dst[1] = self.gamma[v1 as usize];\n  134 |                 dst[2] = self.gamma[v2 as usize];\n  135 |                 dst[3] = (src[3] * 255.).cpu_round() as u8;\n  136 |             }\n  137 |         } else if N == 2 && self.has_alpha {\n  138 |             for (src, dst) in from\n  139 |                 .as_bytes()\n  140 |                 .as_chunks::<2>()\n  141 |                 .0\n  142 |                 .iter()\n  143 |                 .zip(into.buffer.borrow_mut().as_chunks_mut::<2>().0.iter_mut())\n  144 |             {\n  145 |                 let v0 = (src[0] * 65535.).cpu_round() as u16;\n  146 | \n  147 |                 dst[0] = self.gamma[v0 as usize];\n  148 |                 dst[1] = (src[1] * 255.).cpu_round() as u8;\n  149 |             }\n  150 |         } else {\n  151 |             for (&src, dst) in from.as_bytes().iter().zip(into.buffer.borrow_mut()) {\n  152 |                 let v = (src * 65535.).cpu_round() as u16;\n  153 |                 *dst = self.gamma[v as usize];\n  154 |             }\n  155 |         }\n  156 |         Ok(())\n  157 |     }\n  158 | \n  159 |     fn bit_depth(&self) -> usize {\n  160 |         8\n  161 |     }\n  162 | }\n  163 | \n  164 | struct Common16BitSplitter<const N: usize> {\n  165 |     linearization: Box<[f32; 65536]>,\n  166 |     gamma: Box<[u16; 262144]>,\n  167 |     has_alpha: bool,\n  168 |     bit_depth: usize,\n  169 | }\n  170 | \n  171 | impl<const N: usize> Splitter<u16, f32, N> for Common16BitSplitter<N> {\n  172 |     fn split(\n  173 |         &self,\n  174 |         from: &ImageStore<'_, u16, N>,\n  175 |         into: &mut ImageStoreMut<'_, f32, N>,\n  176 |     ) -> Result<(), PicScaleError> {\n  177 |         if N == 4 {\n  178 |             let max_bit_depth_value = ((1u32 << self.bit_depth) - 1) as f32;\n  179 | \n  180 |             let v_recip = 1. / max_bit_depth_value;\n  181 | \n  182 |             for (src, dst) in from\n  183 |                 .as_bytes()\n  184 |                 .as_chunks::<4>()\n  185 |                 .0\n  186 |                 .iter()\n  187 |                 .zip(into.buffer.borrow_mut().as_chunks_mut::<4>().0.iter_mut())\n  188 |             {\n  189 |                 dst[0] = self.linearization[src[0] as usize];\n  190 |                 dst[1] = self.linearization[src[1] as usize];\n  191 |                 dst[2] = self.linearization[src[2] as usize];\n  192 |                 dst[3] = src[3] as f32 * v_recip;\n  193 |             }\n  194 |         } else if N == 2 && self.has_alpha {\n  195 |             let max_bit_depth_value = ((1u32 << self.bit_depth) - 1) as f32;\n  196 |             let v_recip = 1. / max_bit_depth_value;\n  197 | \n  198 |             for (src, dst) in from\n  199 |                 .as_bytes()\n  200 |                 .as_chunks::<2>()\n  201 |                 .0\n  202 |                 .iter()\n  203 |                 .zip(into.buffer.borrow_mut().as_chunks_mut::<2>().0.iter_mut())\n  204 |             {\n  205 |                 dst[0] = self.linearization[src[0] as usize];\n  206 |                 dst[1] = src[1] as f32 * v_recip;\n  207 |             }\n  208 |         } else {\n  209 |             for (&src, dst) in from.as_bytes().iter().zip(into.buffer.borrow_mut()) {\n  210 |                 *dst = self.linearization[src as usize];\n  211 |             }\n  212 |         }\n  213 |         Ok(())\n  214 |     }\n  215 | \n  216 |     fn merge(\n  217 |         &self,\n  218 |         from: &ImageStore<'_, f32, N>,\n  219 |         into: &mut ImageStoreMut<'_, u16, N>,\n  220 |     ) -> Result<(), PicScaleError> {\n  221 |         if N == 4 {\n  222 |             let max_bit_depth_value = ((1u32 << self.bit_depth) - 1) as f32;\n  223 |             for (src, dst) in from\n  224 |                 .as_bytes()\n  225 |                 .as_chunks::<4>()\n  226 |                 .0\n  227 |                 .iter()\n  228 |                 .zip(into.buffer.borrow_mut().as_chunks_mut::<4>().0.iter_mut())\n  229 |             {\n  230 |                 let v0 = ((src[0] * 262143.).cpu_round().max(0.) as u32).min(262143);\n  231 |                 let v1 = ((src[1] * 262143.).cpu_round().max(0.) as u32).min(262143);\n  232 |                 let v2 = ((src[2] * 262143.).cpu_round().max(0.) as u32).min(262143);\n  233 | \n  234 |                 dst[0] = self.gamma[v0 as usize];\n  235 |                 dst[1] = self.gamma[v1 as usize];\n  236 |                 dst[2] = self.gamma[v2 as usize];\n  237 |                 dst[3] = (src[3] * max_bit_depth_value)\n  238 |                     .cpu_round()\n  239 |                     .min(max_bit_depth_value)\n  240 |                     .max(0.) as u16;\n  241 |             }\n  242 |         } else if N == 2 && self.has_alpha {\n  243 |             let max_bit_depth_value = ((1u32 << self.bit_depth) - 1) as f32;\n  244 |             for (src, dst) in from\n  245 |                 .as_bytes()\n  246 |                 .as_chunks::<2>()\n  247 |                 .0\n  248 |                 .iter()\n  249 |                 .zip(into.buffer.borrow_mut().as_chunks_mut::<2>().0.iter_mut())\n  250 |             {\n  251 |                 let v0 = ((src[0] * 262143.).cpu_round().max(0.) as u32).min(262143);\n  252 | \n  253 |                 dst[0] = self.gamma[v0 as usize];\n  254 |                 dst[1] = (src[1] * max_bit_depth_value)\n  255 |                     .cpu_round()\n  256 |                     .min(max_bit_depth_value)\n  257 |                     .max(0.) as u16;\n  258 |             }\n  259 |         } else {\n  260 |             for (&src, dst) in from.as_bytes().iter().zip(into.buffer.borrow_mut()) {\n  261 |                 let v = ((src * 262143.).cpu_round().max(0.) as u32).min(262143);\n  262 |                 *dst = self.gamma[v as usize];\n  263 |             }\n  264 |         }\n  265 |         Ok(())\n  266 |     }\n  267 | \n  268 |     fn bit_depth(&self) -> usize {\n  269 |         8\n  270 |     }\n  271 | }\n  272 | \n  273 | struct Linearization {\n  274 |     linearization: Box<[f32; 256]>,\n  275 |     gamma: Box<[u8; 65536]>,\n  276 | }\n  277 | \n  278 | struct Linearization16 {\n  279 |     linearization: Box<[f32; 65536]>,\n  280 |     gamma: Box<[u16; 262144]>,\n  281 | }\n  282 | \n  283 | fn make_linearization16(\n  284 |     transfer_function: TransferFunction,\n  285 |     bit_depth: usize,\n  286 | ) -> Result<Linearization16, PicScaleError> {\n  287 |     if bit_depth < 8 {\n  288 |         return Err(PicScaleError::UnsupportedBitDepth(bit_depth));\n  289 |     }\n  290 |     let mut linearizing = Box::new([0f32; 65536]);\n  291 |     let max_lin_depth = (1u32 << bit_depth) - 1;\n  292 |     let keep_max = 1u32 << bit_depth;\n  293 |     let mut gamma = Box::new([0u16; 262144]);\n  294 | \n  295 |     let rcp_bit_depth = 1. / max_lin_depth as f32;\n  296 | \n  297 |     for (i, dst) in linearizing.iter_mut().take(keep_max as usize).enumerate() {\n  298 |         *dst = transfer_function.linearize(i as f32 * rcp_bit_depth);\n  299 |     }\n  300 | \n  301 |     const RCP_LUT_CAP: f32 = 1. / 262143.;\n  302 | \n  303 |     for (i, dst) in gamma.iter_mut().enumerate() {\n  304 |         *dst = (transfer_function.gamma(i as f32 * RCP_LUT_CAP) * max_lin_depth as f32)\n  305 |             .cpu_round()\n  306 |             .min(max_lin_depth as f32) as u16;\n  307 |     }\n  308 | \n  309 |     Ok(Linearization16 {\n  310 |         linearization: linearizing,\n  311 |         gamma,\n  312 |     })\n  313 | }\n  314 | \n  315 | fn make_linearization(transfer_function: TransferFunction) -> Linearization {\n  316 |     let mut linearizing = Box::new([0f32; 256]);\n  317 |     let mut gamma = Box::new([0u8; 65536]);\n  318 | \n  319 |     const S: f32 = 1. / 255.;\n  320 | \n  321 |     for (i, dst) in linearizing.iter_mut().enumerate() {\n  322 |         *dst = transfer_function.linearize(i as f32 * S);\n  323 |     }\n  324 | \n  325 |     const RCP_LUT_CAP: f32 = 1. / 65535.;\n  326 | \n  327 |     for (i, dst) in gamma.iter_mut().enumerate() {\n  328 |         *dst = (transfer_function.gamma(i as f32 * RCP_LUT_CAP) * 255.)\n  329 |             .cpu_round()\n  330 |             .min(255.) as u8;\n  331 |     }\n  332 | \n  333 |     Linearization {\n  334 |         linearization: linearizing,\n  335 |         gamma,\n  336 |     }\n  337 | }\n  338 | \n  339 | impl LinearScaler {\n  340 |     pub fn set_threading_policy(&mut self, threading_policy: ThreadingPolicy) -> Self {\n  341 |         self.scaler.threading_policy = threading_policy;\n  342 |         *self\n  343 |     }\n  344 | \n  345 |     pub fn plan_planar_resampling(\n  346 |         &self,\n  347 |         source_size: ImageSize,\n  348 |         target_size: ImageSize,\n  349 |     ) -> Result<Arc<Resampling<u8, 1>>, PicScaleError> {\n  350 |         let intercept = self\n  351 |             .scaler\n  352 |             .plan_planar_resampling_f32(source_size, target_size)?;\n  353 |         let scratch_size = intercept.scratch_size();\n  354 |         let lin = make_linearization(self.transfer_function);\n  355 |         Ok(Arc::new(SplitPlanInterceptor {\n  356 |             intercept,\n  357 |             splitter: Arc::new(Common8BitSplitter {\n  358 |                 linearization: lin.linearization,\n  359 |                 gamma: lin.gamma,\n  360 |                 has_alpha: false,\n  361 |             }),\n  362 |             inner_scratch: scratch_size,\n  363 |         }))\n  364 |     }\n  365 | \n  366 |     pub fn plan_cbcr_resampling(\n  367 |         &self,\n  368 |         source_size: ImageSize,\n  369 |         target_size: ImageSize,\n  370 |     ) -> Result<Arc<Resampling<u8, 2>>, PicScaleError> {\n  371 |         let intercept = self\n  372 |             .scaler\n  373 |             .plan_cbcr_resampling_f32(source_size, target_size)?;\n  374 |         let scratch_size = intercept.scratch_size();\n  375 |         let lin = make_linearization(self.transfer_function);\n  376 |         Ok(Arc::new(SplitPlanInte  very large, deeply-nested functions (several exceed 100-150 lines with 4+ levels of `#[cfg]`/`if` nesting) that are hard to visually diff against each other - which is exactly how the RGB16-vs-RGBA16 SSE-coverage gap and the RGB-f32 dead `PreferQuality` branch (reported separately in this file) went unnoticed: the only reliable way to find such divergences is a mechanical diff, not reading the code in place.","fix":"Consider extracting the common \"start from scalar fallback, then override via a table of `(feature_name, runtime_detector, row_fn, rows4_fn)` entries selected by target arch\" shape into a small shared builder/macro (something like `dispatch_horizontal!(scalar_row, scalar_rows4, [(cfg, feature, row_fn, rows4_fn), ...])`) used by all of `plane_*`, `cbcr*`, `rgb_*`, `rgba_*`. This would not change runtime behavior but would make the per-layout/per-type files much shorter, and would let a single macro change or a single generated test enforce that every pixel layout that has an SSE/AVX2/NEON kernel for one channel count also has it for the others (or documents why not), preventing regressions like the RGB16 SSE gap found in this report.","locations":[{"ref":"src/factory/rgb_u8.rs:52-151","code":"   52 | impl HorizontalFilterPass<u8, f32, 3> for ImageStore<'_, u8, 3> {\n   53 |     fn horizontal_plan(\n   54 |         filter_weights: FilterWeights<f32>,\n   55 |         threading_policy: ThreadingPolicy,\n   56 |         _options: ConvolutionOptions,\n   57 |     ) -> Arc<dyn RowFilter<u8, 3> + Send + Sync> {\n   58 |         let _scale_factor = _options.src_size.width as f32 / _options.dst_size.width as f32;\n   59 |         let mut _dispatcher_4_rows: Option<\n   60 |             fn(&[u8], usize, &mut [u8], usize, &FilterWeights<i16>, u32),\n   61 |         > = Some(handle_fixed_rows_4_u8::<3>);\n   62 |         let mut _dispatcher_1_row: fn(&[u8], &mut [u8], &FilterWeights<i16>, u32) =\n   63 |             handle_fixed_row_u8::<3>;\n   64 |         #[cf ;\n    }\n}\n```\n(and have `plan_multi_step_upscale_with_alpha` accept the already-computed `intermediates` instead of recomputing them, avoiding the duplicate call to `plan_intermediate_sizes`).","locations":[{"ref":"src/plan/alpha_planner.rs:266-278","code":"  266 | \n  267 |         let is_upscale = destination_size.width >= source_size.width\n  268 |             && destination_size.height >= source_size.height;\n  269 | \n  270 |         if scaler.multi_step_upscaling && is_upscale {\n  271 |             return Self::plan_multi_step_upscale_with_alpha::<T, W, N>(\n  272 |                 scaler,\n  273 |                 source_size,\n  274 |                 destination_size,\n  275 |                 bit_depth,\n  276 |                 needs_alpha_premultiplication,\n  277 |             );\n  278 |         }","lines":13,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/plan/alpha_planner.rs#L266-L278"},{"ref":"src/plan/default_planner.rs:156-169","code":"  156 |         if scaler.multi_step_upscaling && is_upscale {\n  157 |             let intermediates =\n  158 |                 plan_intermediate_sizes(source_size, destination_size, scaler.function);\n  159 | \n  160 |             if !intermediates.is_empty() {\n  161 |                 return Self::plan_multi_step_upscale_simple::<T, W, N>(\n  162 |                     scaler,\n  163 |                     source_size,\n  164 |                     destination_size,\n  165 |                     bit_depth,\n  166 |                     &intermediates,\n  167 |                 );\n  168 |             }\n  169 |         }","lines":14,"link":"https://github.com/awxkee/pic-scale/blob/5be8fc42c7d61bf95d4d218aee5cdf9b58908704/src/plan/default_planner.rs#L156-L169"}]},{"id":"OTHER_1","type":"other","type_label":"Other","severity":"medium","difficulty":"easy","description":"Inconsistent `#[target_feature]` gating between sibling functions that call the same fp16-arithmetic helpers. In `src/neon/rgb_f16_fhm.rs`, the helper functions `conv_horiz_4_rgb_f16`, `conv_horiz_2_rgb_f16` and `conv_horiz_1_rgb_f16` are all declared `#[target_feature(enable = \"neon,fp16,fhm\")]` because they use `vfmlalq_lane_low_f16`/`vfmlalq_lane_high_f16`, which require the `fp16` extension in addition to `fhm`. The 4-row driver `convolve_horizontal_rgb_neon_rows_4_f16_impl` correctly declares `#[target_feature(enable = \"fp16,fhm\")]`, but its sibling `convolve_horizontal_rgb_neon_row_one_f16_impl` (the single-row driver, calling the exact same helper functions) is declared with only `#[target_feature(enable = \"fhm\")]`, omitting `fp16`. The same omission (missing `fp16`) is present, consistently this time, on both drivers in `src/neon/rgba_f16_fhm.rs` (`convolve_horizontal_rgba_neon_row_one_f16_impl` and `convolve_horizontal_rgba_neon_rows_4_f16_impl`), whose helpers `conv_horiz_rgba_8_f16`/`conv_horiz_rgba_4_f16`/`conv_horiz_rgba_2_f32`/`conv_horiz_rgba_1_f16` are all gated with `#[target_feature(enable = \"fp16,fhm\")]`. In practice `FEAT_FHM` architecturally requires `FEAT_FP16` on real ARM cores, so this is unlikely to crash on hardware, but the inconsistent/incomplete attribute is a latent gating bug: it makes the crate's own within-file convention (`rgb_f16_fhm.rs` rows-4 vs. row-one) self-contradictory, and relies on an unstated architectural assumption instead of the explicit feature list used everywhere else for this same code path.","fix":"Make all four driver functions declare the same feature set as the helpers they call, e.g.:\n```rust\n#[target_feature(enable = \"fp16,fhm\")]\nfn convolve_horizontal_rgb_neon_row_one_f16_impl(\n```\nand likewise for the two `rgba_f16_fhm.rs` drivers, so every function in the call chain explicitly lists `fp16,fhm` instead of relying on `fhm` implying `fp16`.","locations":[{"ref":"src/neon/rgb_f16_fhm.rs:151","code":"  151 | #[target_feature(enable = \"fp16,fhm\")]","lines":1,"link":"https://github.com/awxkee/pic-sca
