{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`Strip::cell`/`empty` build the child Ui id salt from `self.size_index` *after* `next_cell_size()` has already incremented it, so the id is derived from the next cell's index rather than the current cell's. It still happens to be unique per cell, but it is off-by-one relative to the logical cell index and inconsistent with intent (and with the index reported in the over-allocation panic message).","fix":"Capture the index before incrementing (e.g. return it from `next_cell_size`) and use that for `egui::Id::new(...)`.","locations":[{"ref":"crates/egui_extras/src/strip.rs:191-204","code":"  191 |     pub fn cell(&mut self, add_contents: impl FnOnce(&mut Ui)) {\n  192 |         let (width, height) = self.next_cell_size();\n  193 |         let flags = StripLayoutFlags {\n  194 |             clip: self.clip,\n  195 |             ..Default::default()\n  196 |         };\n  197 |         self.layout.add(\n  198 |             flags,\n  199 |             width,\n  200 |             height,\n  201 |             egui::Id::new(self.size_index),\n  202 |             add_contents,\n  203 |         );\n  204 |     }","lines":14,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui_extras/src/strip.rs#L191-L204"},{"ref":"crates/egui_extras/src/strip.rs:170-187","code":"  170 |     #[cfg_attr(debug_assertions, track_caller)]\n  171 |     fn next_cell_size(&mut self) -> (CellSize, CellSize) {\n  172 |         let size = if let Some(size) = self.sizes.get(self.size_index) {\n  173 |             self.size_index += 1;\n  174 |             *size\n  175 |         } else {\n  176 |             crate::log_or_panic!(\n  177 |                 \"Added more `Strip` cells than were pre-allocated ({} pre-allocated)\",\n  178 |                 self.sizes.len()\n  179 |             );\n  180 |             8.0 // anything will look wrong, so pick something that is obviously wrong\n  181 |         };\n  182 | \n  183 |         match self.direction {\n  184 |             CellDirection::Horizontal => (CellSize::Absolute(size), CellSize::Remainder),\n  185 |             CellDirection::Vertical => (CellSize::Remainder, CellSize::Absolute(size)),\n  186 |         }\n  187 |     }","lines":18,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui_extras/src/strip.rs#L170-L187"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"MarginF32 -> Margin conversion uses `marginf.left as _` (f32->i8), which truncates toward zero, whereas Margin::from(f32)/from(Vec2) use `.round()`. So 2.9 becomes 2 here but 3 via From<f32>: inconsistent and lossy rounding between two conversions to the same type.","fix":"Use `.round() as _` for consistency with Margin::from(f32).","locations":[{"ref":"crates/epaint/src/margin_f32.rs:32-42","code":"   32 | impl From<MarginF32> for Margin {\n   33 |     #[inline]\n   34 |     fn from(marginf: MarginF32) -> Self {\n   35 |         Self {\n   36 |             left: marginf.left as _,\n   37 |             right: marginf.right as _,\n   38 |             top: marginf.top as _,\n   39 |             bottom: marginf.bottom as _,\n   40 |         }\n   41 |     }\n   42 | }","lines":11,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/epaint/src/margin_f32.rs#L32-L42"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"resize_to_min_height doubles the atlas height while `required_height >= image.height()`. Atlas rows occupy indices [0, required_height), so a height equal to required_height already fits; the `>=` doubles one extra time in the exact-fit case, wasting up to ~2x texture memory and triggering an unnecessary full-atlas dirty/reupload.","fix":"Change the condition to `while required_height > image.height()`.","locations":[{"ref":"crates/epaint/src/texture_atlas.rs:266-269","code":"  266 | fn resize_to_min_height(image: &mut ColorImage, required_height: usize) -> bool {\n  267 |     while required_height >= image.height() {\n  268 |         image.size[1] *= 2; // double the height\n  269 |     }","lines":4,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/epaint/src/texture_atlas.rs#L266-L269"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"medium","description":"In `zoom_with_keyboard`, both ZOOM_IN (Cmd+Plus) and ZOOM_IN_SECONDARY (Cmd+Equals) are consumed and each independently calls `zoom_in`. If both shortcuts were somehow active in the same frame they would zoom in twice (+0.2). In practice the two key combos can't both be pressed at once, so impact is negligible, but the `||` short-circuit was likely intended to zoom only once.","fix":"The `||` already short-circuits the second consume when the first matches, so behavior is fine; if defensive single-zoom is desired, gate ZOOM_OUT in an `else` like ZOOM_RESET does. No change strictly required.","locations":[{"ref":"crates/egui/src/gui_zoom.rs:37-44","code":"   37 |         if ctx.input_mut(|i| i.consume_shortcut(&kb_shortcuts::ZOOM_IN))\n   38 |             || ctx.input_mut(|i| i.consume_shortcut(&kb_shortcuts::ZOOM_IN_SECONDARY))\n   39 |         {\n   40 |             zoom_in(ctx);\n   41 |         }\n   42 |         if ctx.input_mut(|i| i.consume_shortcut(&kb_shortcuts::ZOOM_OUT)) {\n   43 |             zoom_out(ctx);\n   44 |         }","lines":8,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/gui_zoom.rs#L37-L44"}]},
{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"medium","description":"`syntax_highlighting` extracts a file extension via `response.url.rsplitn(2, '.').collect()` and takes `.first()`. `rsplitn` yields the part AFTER the last dot first, so for URLs with no extension but dots in the host (e.g. `https://picsum.photos/seed/x/640`) the \"extension\" becomes the whole path segment `photos/seed/x/640`. This isn't a panic (highlighting just no-ops on an unknown extension) but the extraction is wrong for any URL whose path has no dot.","fix":"Parse the path segment after the last `/` first, then take its extension; or only treat the suffix as an extension if it contains no `/`.","locations":[{"ref":"crates/egui_demo_app/src/apps/http_app.rs:223-224","code":"  223 |     let extension_and_rest: Vec<&str> = response.url.rsplitn(2, '.').collect();\n  224 |     let extension = extension_and_rest.first()?;","lines":2,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui_demo_app/src/apps/http_app.rs#L223-L224"}]},
{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"medium","description":"`ScrollStickTo::ui` increments `self.n_items` by one every frame and unconditionally requests a repaint, so the row count grows without bound for as long as the demo window is open. In a long-running session this is an ever-growing counter (theoretically overflows usize, and the row list grows unboundedly). It is intentional for the 'stick to end' visual but has no cap.","fix":"Cap `n_items` at a reasonable maximum, or use `saturating_add(1)`, to avoid unbounded growth.","locations":[{"ref":"crates/egui_demo_lib/src/demo/scrolling.rs:389-390","code":"  389 |         self.n_items += 1;\n  390 |         ui.request_repaint();","lines":2,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui_demo_lib/src/demo/scrolling.rs#L389-L390"}]},
{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"medium","description":"FontColorTransferFunction matches the identity case with the float-literal pattern `Self::Gamma(1.0)`. Float-literal patterns rely on exact bit equality and are a deny-by-default future-incompat lint in newer Rust; behavior is correct today but fragile.","fix":"Replace with a match guard: `Self::Gamma(g) if g == 1.0 => ...`.","locations":[{"ref":"crates/epaint/src/image.rs:405","code":"  405 |             Self::Off | Self::Gamma(1.0) => input_color,","lines":1,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/epaint/src/image.rs#L405"},{"ref":"crates/epaint/src/image.rs:426","code":"  426 |             Self::Off | Self::Gamma(1.0) => coverage,","lines":1,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/epaint/src/image.rs#L426"}]},
{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"medium","description":"LocationHash::new returns `LocationHash(0)` for the empty (default) coords fast-path, but a non-empty location hashed with `crate::util::hash` can also legitimately produce 0. Such a collision would make a non-default variation location share a glyph/advance cache key with the default location, yielding wrong cached metrics/glyphs. Probability ~2^-64, but a real key-collision hazard.","fix":"Use a non-hash sentinel for the empty case (an Option or enum), or fold a discriminant into the hash so the empty case can never collide.","locations":[{"ref":"crates/epaint/src/text/styled_metrics.rs:14-19","code":"   14 |         if location.coords().is_empty() {\n   15 |             // Fast path for the (common) default-coords case.\n   16 |             Self(0)\n   17 |         } else {\n   18 |             Self(crate::util::hash(location))\n   19 |         }","lines":6,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/epaint/src/text/styled_metrics.rs#L14-L19"}]},
{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"medium","description":"`age` is a `u32` bounded to `0..=120` by the slider, but the \"Increment\" button does `self.age += 1` with no cap, so the value can exceed the slider range (and would panic on overflow in debug at u32::MAX, unreachable in practice). Since these hello_world examples are the most-copied starting points, the unbounded increment past the advertised range is a mildly misleading pattern.","fix":"Use `self.age = self.age.saturating_add(1)` or clamp to the slider range, so the displayed value stays consistent with the slider bounds.","locations":[{"ref":"examples/hello_world/src/main.rs:48-50","code":"   48 |             if ui.button(\"Increment\").clicked() {\n   49 |                 self.age += 1;\n   50 |             }","lines":3,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/examples/hello_world/src/main.rs#L48-L50"},{"ref":"examples/hello_world_par/src/main.rs:53-55","code":"   53 |                 if ui.button(\"Increment\").clicked() {\n   54 |                     self.age += 1;\n   55 |                 }","lines":3,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/examples/hello_world_par/src/main.rs#L53-L55"},{"ref":"examples/custom_keypad/src/main.rs:57-59","code":"   57 |                 if ui.button(\"Increment\").clicked() {\n   58 |                     self.age += 1;\n   59 |                 }","lines":3,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/examples/custom_keypad/src/main.rs#L57-L59"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"In `Hsva::from_rgba_premultiplied`, the check for fully-transparent black omits the green channel: it tests `r == 0.0 && b == 0.0 && a == 0.0`. A pure-green additive color such as `(0.0, g, 0.0, 0.0)` therefore takes the `Self::default()` branch (all zeros), losing the green value, instead of being treated as an additive color via `from_additive_rgb`. Classic copy-paste omission of the `g` term.","fix":"Add the missing green check: `if r == 0.0 && g == 0.0 && b == 0.0 && a == 0.0`.","locations":[{"ref":"crates/ecolor/src/hsva.rs:44-49","code":"   44 |         if a <= 0.0 {\n   45 |             if r == 0.0 && b == 0.0 && a == 0.0 {\n   46 |                 Self::default()\n   47 |             } else {\n   48 |                 Self::from_additive_rgb([r, g, b])\n   49 |             }","lines":6,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/ecolor/src/hsva.rs#L44-L49"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"Copy-paste bug in the syntect highlighter: the `underline` flag is derived from the ITALIC font style instead of the UNDERLINE font style. As a result text is underlined whenever it is italic, and never underlined for syntect themes that mark tokens as underlined. The line above already reads ITALIC into `italics`.","fix":"Change the second line to `let underline = style.font_style.contains(FontStyle::UNDERLINE);`.","locations":[{"ref":"crates/egui_extras/src/syntax_highlighting.rs:586-587","code":"  586 |                 let italics = style.font_style.contains(FontStyle::ITALIC);\n  587 |                 let underline = style.font_style.contains(FontStyle::ITALIC);","lines":2,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui_extras/src/syntax_highlighting.rs#L586-L587"}]},
{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"The non-persistence `SerializableAny` bound reads `'static + Any + Clone + for<'a> Send + Sync`. The `for<'a>` higher-ranked binder binds a lifetime never used by `Send + Sync`; it is an inert leftover copied from the persistence version (where it correctly qualifies `for<'a> serde::Deserialize<'a>`). Misleading.","fix":"Remove `for<'a>`: `pub trait SerializableAny: 'static + Any + Clone + Send + Sync {}` and the matching impl.","locations":[{"ref":"crates/egui/src/util/id_type_map.rs:51-54","code":"   51 | pub trait SerializableAny: 'static + Any + Clone + for<'a> Send + Sync {}\n   52 | \n   53 | #[cfg(not(feature = \"persistence\"))]\n   54 | impl<T> SerializableAny for T where T: 'static + Any + Clone + for<'a> Send + Sync {}","lines":4,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/util/id_type_map.rs#L51-L54"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"medium","description":"find_cross_t divides by `a`, `3*a*a`, and `27*a*a*a` (computing h, p, q) with no guard for `a == 0.0`. The leading cubic coefficient `a` vanishes for many ordinary closed curves (symmetric control points where the t^3 term cancels). When a is 0 the divisions yield NaN/Inf which propagate through sqrt/acos/cbrt; the `p > 0.0` early-out does NOT catch NaN (NaN comparisons are false), so correctness relies on the resulting NaN t-values incidentally failing the 0..1 range checks rather than on an explicit degenerate branch. The cubic-root solver is also simply wrong for the a==0 (quadratic) case, so fill-splitting of such cubic beziers can be incorrect.","fix":"Before computing h/p/q, branch on `a == 0.0` (or |a| < epsilon) and either return None or solve the reduced quadratic `b*t^2 + c*t + d = 0` for the crossing t.","locations":[{"ref":"crates/epaint/src/shapes/bezier_shape.rs:246-254","code":"  246 |         let h = -b / (3.0 * a);\n  247 |         let p = (3.0 * a * c - b * b) / (3.0 * a * a);\n  248 |         let q = (2.0 * b * b * b - 9.0 * a * b * c + 27.0 * a * a * d) / (27.0 * a * a * a);\n  249 | \n  250 |         if p > 0.0 {\n  251 |             return None;\n  252 |         }\n  253 |         let r = (-(p / 3.0).powi(3)).sqrt();\n  254 |         let theta = (-q / (2.0 * r)).acos() / 3.0;","lines":9,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/epaint/src/shapes/bezier_shape.rs#L246-L254"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"In `Context::tessellate`, when no font matches the requested `pixels_per_point`, the fallback path does `ctx.fonts.iter().next().expect(\"No fonts loaded\")`. `ctx.fonts` is an `Option<Fonts>`, so `.iter().next()` yields the single font set if present and `None` otherwise; if `tessellate` is ever called before fonts are created (no prior `run_ui`), this panics. The surrounding API is public and the panic message (\"No fonts loaded\") would surface as a hard crash rather than a graceful degradation.","fix":"Handle the no-fonts case gracefully (e.g. return an empty tessellation or skip tessellation with a logged warning) instead of `.expect(...)`, since `tessellate` is callable independently of `run_ui`.","locations":[{"ref":"crates/egui/src/context.rs:3050-3059","code":" 3050 |             let texture_atlas = if let Some(fonts) = ctx.fonts.as_ref() {\n 3051 |                 fonts.texture_atlas()\n 3052 |             } else {\n 3053 |                 log::warn!(\"No font size matching {pixels_per_point} pixels per point found.\");\n 3054 |                 ctx.fonts\n 3055 |                     .iter()\n 3056 |                     .next()\n 3057 |                     .expect(\"No fonts loaded\")\n 3058 |                     .texture_atlas()\n 3059 |             };","lines":10,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/context.rs#L3050-L3059"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In `FileStorage::flush`, the previous save's `JoinHandle::join()` result is discarded with `.ok()`, swallowing both join errors (panicked persist thread) and the (unit) result. A panic in the background `save_to_disk` thread is silently ignored, so persistent serialization failures that manifest as panics leave no trace and the next flush proceeds as if nothing happened.","fix":"Log when `join()` returns `Err` (a panicked persist thread) so silent data-loss is at least observable.","locations":[{"ref":"crates/eframe/src/native/file_storage.rs:167-194","code":"  167 |     fn flush(&mut self) {\n  168 |         if self.dirty {\n  169 |             profiling::scope!(\"FileStorage::flush\");\n  170 |             self.dirty = false;\n  171 | \n  172 |             let file_path = self.ron_filepath.clone();\n  173 |             let kv = self.kv.clone();\n  174 | \n  175 |             if let Some(join_handle) = self.last_save_join_handle.take() {\n  176 |                 // wait for previous save to complete.\n  177 |                 join_handle.join().ok();\n  178 |             }\n  179 | \n  180 |             let result = std::thread::Builder::new()\n  181 |                 .name(\"eframe_persist\".to_owned())\n  182 |                 .spawn(move || {\n  183 |                     save_to_disk(&file_path, &kv);\n  184 |                 });\n  185 |             match result {\n  186 |                 Ok(join_handle) => {\n  187 |                     self.last_save_join_handle = Some(join_handle);\n  188 |                 }\n  189 |                 Err(err) => {\n  190 |                     log::warn!(\"Failed to spawn thread to save app state: {err}\");\n  191 |                 }\n  192 |             }\n  193 |         }\n  194 |     }","lines":28,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/eframe/src/native/file_storage.rs#L167-L194"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`pos_from_mouse_event`, `pos_from_touch`, and the IME `move_to` clamping all divide by `ctx.zoom_factor()` without guarding against a zero/negative zoom factor. `egui::Context::set_zoom_factor` does not strictly prevent a 0 value from user code; a zero zoom factor would produce `inf`/`NaN` pointer positions feeding into egui hit-testing.","fix":"Clamp `zoom_factor` to a small positive minimum before dividing, or rely on egui guaranteeing a positive zoom factor and document that invariant.","locations":[{"ref":"crates/eframe/src/web/input.rs:3-14","code":"    3 | pub fn pos_from_mouse_event(\n    4 |     canvas: &web_sys::HtmlCanvasElement,\n    5 |     event: &web_sys::MouseEvent,\n    6 |     ctx: &egui::Context,\n    7 | ) -> egui::Pos2 {\n    8 |     let rect = canvas_content_rect(canvas);\n    9 |     let zoom_factor = ctx.zoom_factor();\n   10 |     egui::Pos2 {\n   11 |         x: (event.client_x() as f32 - rect.left()) / zoom_factor,\n   12 |         y: (event.client_y() as f32 - rect.top()) / zoom_factor,\n   13 |     }\n   14 | }","lines":12,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/eframe/src/web/input.rs#L3-L14"},{"ref":"crates/eframe/src/web/input.rs:74-84","code":"   74 | fn pos_from_touch(\n   75 |     canvas_rect: egui::Rect,\n   76 |     touch: &web_sys::Touch,\n   77 |     egui_ctx: &egui::Context,\n   78 | ) -> egui::Pos2 {\n   79 |     let zoom_factor = egui_ctx.zoom_factor();\n   80 |     egui::Pos2 {\n   81 |         x: (touch.client_x() as f32 - canvas_rect.left()) / zoom_factor,\n   82 |         y: (touch.client_y() as f32 - canvas_rect.top()) / zoom_factor,\n   83 |     }\n   84 | }","lines":11,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/eframe/src/web/input.rs#L74-L84"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`EguiGlow::new` unwraps the result of `Painter::new` after only logging the error, so any shader-compile or buffer-creation failure aborts the whole app via panic instead of being propagated. The surrounding code has a `TODO(emilk): return error instead of unwrap`, confirming this is a known rough edge worth flagging.","fix":"Make `EguiGlow::new` return `Result<Self, PainterError>` and propagate the painter error to the caller instead of unwrapping.","locations":[{"ref":"crates/egui_glow/src/winit.rs:31-36","code":"   31 |         #[expect(clippy::unwrap_used)] // TODO(emilk): return error instead of unwrap\n   32 |         let painter = crate::Painter::new(gl, \"\", shader_version, dithering)\n   33 |             .map_err(|err| {\n   34 |                 log::error!(\"error occurred in initializing painter:\\n{err}\");\n   35 |             })\n   36 |             .unwrap();","lines":6,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui_glow/src/winit.rs#L31-L36"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`ns_view_from_handle` returns `Option<&NSView>` whose lifetime is elided to the input `&AppKitWindowHandle`, but the `NSView` it points to is owned by AppKit, not by the handle. The returned reference's lifetime is therefore tied to an unrelated borrow. While the immediate caller (`window_chrome_metrics`) uses it within scope and the SAFETY comment notes the AppKit ownership assumption, the misleading lifetime makes it easy for a future refactor to extend the reference's apparent lifetime beyond what is actually sound, risking a use-after-free.","fix":"Return an owned `objc2::rc::Retained<NSView>` (retain the view) instead of a borrowed `&NSView`, so the lifetime reflects real ownership and cannot dangle.","locations":[{"ref":"crates/eframe/src/native/macos.rs:60-76","code":"   60 | fn ns_view_from_handle(handle: &AppKitWindowHandle) -> Option<&NSView> {\n   61 |     let ns_view_ptr = handle.ns_view.as_ptr().cast::<NSView>();\n   62 | \n   63 |     // Validate the pointer is non-null\n   64 |     if ns_view_ptr.is_null() {\n   65 |         None\n   66 |     } else {\n   67 |         // SAFETY:\n   68 |         // - We've verified the pointer is non-null\n   69 |         // - The pointer comes from the windowing system, so it should be valid\n   70 |         // - NSView pointers from AppKit are expected to remain valid for the window lifetime\n   71 |         #[expect(unsafe_code)]\n   72 |         unsafe {\n   73 |             ns_view_ptr.as_ref()\n   74 |         }\n   75 |     }\n   76 | }","lines":17,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/eframe/src/native/macos.rs#L60-L76"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`combo_box_dyn` registers the same `button_id` widget twice in one frame: once inside the `button_frame` content closure (`ui.interact(button_rect, button_id, Sense::click())`) to pick visuals, and again in `button_frame` itself (`ui.interact(outer_rect, id, sense)`) using a differently-computed rect. Double-registering the same id with two different rects is a smell and can cause subtle hit-test/interact_rect inconsistencies; only the visuals from the inner call are used.","fix":"Compute the button rect once and interact a single time, or derive the visuals from the response returned by `button_frame` instead of doing a second `ui.interact` with the same id.","locations":[{"ref":"crates/egui/src/containers/combo_box.rs:363-391","code":"  363 |         let (_, rect) = ui.allocate_space(Vec2::new(actual_width, actual_height));\n  364 |         let button_rect = ui.min_rect().expand2(ui.spacing().button_padding);\n  365 |         let response = ui.interact(button_rect, button_id, Sense::click());\n  366 |         // response.active |= is_popup_open;\n  367 | \n  368 |         if ui.is_rect_visible(rect) {\n  369 |             let icon_rect = Align2::RIGHT_CENTER.align_size_within_rect(icon_size, rect);\n  370 |             let visuals = if is_popup_open {\n  371 |                 &ui.visuals().widgets.open\n  372 |             } else {\n  373 |                 ui.style().interact(&response)\n  374 |             };\n  375 | \n  376 |             if let Some(icon) = icon {\n  377 |                 icon(\n  378 |                     ui,\n  379 |                     icon_rect.expand(visuals.expansion),\n  380 |                     visuals,\n  381 |                     is_popup_open,\n  382 |                 );\n  383 |             } else {\n  384 |                 paint_default_icon(ui.painter(), icon_rect.expand(visuals.expansion), visuals);\n  385 |             }\n  386 | \n  387 |             let text_rect = Align2::LEFT_CENTER.align_size_within_rect(galley.size(), rect);\n  388 |             ui.painter()\n  389 |                 .galley(text_rect.min, galley, visuals.text_color());\n  390 |         }\n  391 |     });","lines":29,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/containers/combo_box.rs#L363-L391"},{"ref":"crates/egui/src/containers/combo_box.rs:424-446","code":"  424 | fn button_frame(\n  425 |     ui: &mut Ui,\n  426 |     id: Id,\n  427 |     is_popup_open: bool,\n  428 |     sense: Sense,\n  429 |     add_contents: impl FnOnce(&mut Ui),\n  430 | ) -> Response {\n  431 |     let where_to_put_background = ui.painter().add(Shape::Noop);\n  432 | \n  433 |     let margin = ui.spacing().button_padding;\n  434 |     let interact_size = ui.spacing().interact_size;\n  435 | \n  436 |     let mut outer_rect = ui.available_rect_before_wrap();\n  437 |     outer_rect.set_height(outer_rect.height().at_least(interact_size.y));\n  438 | \n  439 |     let inner_rect = outer_rect.shrink2(margin);\n  440 |     let mut content_ui = ui.new_child(UiBuilder::new().max_rect(inner_rect));\n  441 |     add_contents(&mut content_ui);\n  442 | \n  443 |     let mut outer_rect = content_ui.min_rect().expand2(margin);\n  444 |     outer_rect.set_height(outer_rect.height().at_least(interact_size.y));\n  445 | \n  446 |     let response = ui.interact(outer_rect, id, sense);","lines":23,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/containers/combo_box.rs#L424-L446"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`Id::from_high_entropy_bits` is marked `unsafe` but the doc explicitly states it is \"not unsafe in terms of memory safety\" and its only failure mode is a `panic` on a zero value. Using `unsafe` for a non-memory-safety invariant is misleading: it forces callers into `unsafe {}` blocks for no soundness reason and dilutes the meaning of `unsafe` in the codebase.","fix":"Make the function safe (it already panics on zero), or return `Option<Id>`/`Result` instead of panicking; reserve `unsafe` for genuine memory-safety invariants.","locations":[{"ref":"crates/egui/src/id.rs:118-131","code":"  118 |     ///\n  119 |     /// # Safety\n  120 |     /// You need to ensure that the value is high-entropy since it might be used in\n  121 |     /// a [`IdSet`] or [`IdMap`], which rely on the assumption that [`Id`]s have good entropy.\n  122 |     ///\n  123 |     /// The method is not unsafe in terms of memory safety.\n  124 |     ///\n  125 |     /// # Panics\n  126 |     /// If the value is zero, this will panic.\n  127 |     #[doc(hidden)]\n  128 |     #[expect(unsafe_code)]\n  129 |     pub unsafe fn from_high_entropy_bits(value: u64) -> Self {\n  130 |         Self(NonZeroU64::new(value).expect(\"Id must be non-zero.\"))\n  131 |     }","lines":14,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/id.rs#L118-L131"}]},
{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"negligible","difficulty":"medium","description":"`Layout` derives `PartialEq, Eq` and the commented-out serde derive line is left in source (line 101). Minor dead/commented code; not a correctness issue, but the dangling `// #[cfg_attr(feature = \"serde\", ...)]` suggests an unfinished decision about serializing Layout.","fix":"Either enable serde for Layout or remove the commented-out attribute to avoid confusion.","locations":[{"ref":"crates/egui/src/layout.rs:100-101","code":"  100 | #[derive(Clone, Copy, Debug, PartialEq, Eq)]\n  101 | // #[cfg_attr(feature = \"serde\", derive(serde::Deserialize, serde::Serialize))]","lines":2,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/layout.rs#L100-L101"}]},
{"id":"API_5","type":"api_misuse","type_label":"Api Misuse","severity":"negligible","difficulty":"medium","description":"Several `aligns.iter().find(...).unwrap()` calls assume the current `Align2` value is always one of the 9 listed combinations. This holds today (all 9 Align2 combos are listed and the value is only ever set via the same list), but the `.unwrap()` is a latent panic if the value source ever changes (e.g. serde-loaded state in TextRotation). Defensive only.","fix":"Use `.map_or(\"?\", |(_, name)| *name)` or similar fallback instead of `.unwrap()` on the selected-text lookup.","locations":[{"ref":"crates/egui_demo_lib/src/demo/misc_demo_window.rs:921","code":"  921 |             .selected_text(aligns.iter().find(|(a, _)| *a == self.align).unwrap().1)","lines":1,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui_demo_lib/src/demo/misc_demo_window.rs#L921"},{"ref":"crates/egui_demo_lib/src/demo/popups.rs:205","code":"  205 |                     .selected_text(aligns.iter().find(|(a, _)| a == align).unwrap().1)","lines":1,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui_demo_lib/src/demo/popups.rs#L205"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`InputState::begin_pass` clones the entire `Vec<Event>` every frame (`events: new.events.clone()`), then moves `new` (the RawInput, which still holds its own `events`) into `self.raw` on the next line, so the event vector is duplicated and allocated every input frame on the hot path. The author flagged it with a TODO.","fix":"Store events once: e.g. `events: std::mem::take(&mut new.events)` and read `self.raw.events` where the duplicate is needed, eliminating the per-frame clone+allocation.","locations":[{"ref":"crates/egui/src/input_state/mod.rs:490-491","code":"  490 |             events: new.events.clone(), // TODO(emilk): remove clone() and use raw.events\n  491 |             raw: new,","lines":2,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/input_state/mod.rs#L490-L491"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`FileStorage::flush` clones the entire `kv` HashMap (`self.kv.clone()`) on every flush to hand it to the background save thread, even when the data is large. For apps that persist big blobs of egui memory plus user state, this doubles peak memory and adds a full copy on each autosave (every 30s) and on focus-loss saves.","fix":"Serialize to a `String`/`Vec<u8>` on the calling thread (or wrap `kv` in an `Arc` snapshot) and move only the serialized bytes into the persist thread, avoiding cloning the whole map.","locations":[{"ref":"crates/eframe/src/native/file_storage.rs:172-184","code":"  172 |             let file_path = self.ron_filepath.clone();\n  173 |             let kv = self.kv.clone();\n  174 | \n  175 |             if let Some(join_handle) = self.last_save_join_handle.take() {\n  176 |                 // wait for previous save to complete.\n  177 |                 join_handle.join().ok();\n  178 |             }\n  179 | \n  180 |             let result = std::thread::Builder::new()\n  181 |                 .name(\"eframe_persist\".to_owned())\n  182 |                 .spawn(move || {\n  183 |                     save_to_disk(&file_path, &kv);\n  184 |                 });","lines":13,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/eframe/src/native/file_storage.rs#L172-L184"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`Atoms::text()` returns a `Cow<str>` that starts borrowed but, as soon as there is more than one text atom, calls `to_mut()` and reallocates/copies the whole concatenation every call. `text()` is called once per frame for buttons/checkboxes/radio (for widget_info / accessibility), so multi-text widgets (e.g. menu buttons with shortcut text) allocate a String every frame even when nothing changed.","fix":"This is largely inherent to producing a single label; acceptable but worth caching. If kept, document the allocation. Alternatively, only build the owned string lazily inside the widget_info closure (which is itself lazy) rather than eagerly in the widget body.","locations":[{"ref":"crates/egui/src/atomics/atoms.rs:51-74","code":"   51 |     pub fn text(&self) -> Option<Cow<'_, str>> {\n   52 |         let mut string: Option<Cow<'_, str>> = None;\n   53 |         for atom in &self.0 {\n   54 |             if let AtomKind::Text(text) = &atom.kind {\n   55 |                 if let Some(string) = &mut string {\n   56 |                     let string = string.to_mut();\n   57 |                     string.push(' ');\n   58 |                     string.push_str(text.text());\n   59 |                 } else {\n   60 |                     string = Some(Cow::Borrowed(text.text()));\n   61 |                 }\n   62 |             }\n   63 |         }\n   64 | \n   65 |         // If there is no text, try to find an image with alt text.\n   66 |         if string.is_none() {\n   67 |             string = self.iter().find_map(|a| match &a.kind {\n   68 |                 AtomKind::Image(image) => image.alt_text.as_deref().map(Cow::Borrowed),\n   69 |                 _ => None,\n   70 |             });\n   71 |         }\n   72 | \n   73 |         string\n   74 |     }","lines":24,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/atomics/atoms.rs#L51-L74"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`title_ui` calls `ui.fonts_mut(|f| f.row_height(...))` on every frame the window title bar is shown, taking a write lock on the fonts just to read a row height. For windows this runs every frame. A read-only `fonts` access (or caching the heading row height) would avoid taking the mutable lock in a per-frame path.","fix":"Use a read-only `ui.fonts(|f| f.row_height(...))` accessor if available, or cache the heading row height.","locations":[{"ref":"crates/egui/src/containers/window.rs:1312-1314","code":" 1312 |     let heading_font_height =\n 1313 |         ui.fonts_mut(|f| f.row_height(&TextStyle::Heading.resolve(ui.style())));\n 1314 |     let button_allocation_size = Vec2::splat(heading_font_height);","lines":3,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/containers/window.rs#L1312-L1314"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`Context::begin_pass`/`end_pass` and several internal helpers repeatedly do `self.viewports.entry(self.viewport_id()).or_default()` (e.g. lines 429 and 452 fetch the viewport twice in a single `begin_pass`, with unrelated work in between that does not need the first borrow). Each `entry().or_default()` is a hash lookup; doing it twice per begin_pass for the same id is redundant work in the hottest path.","fix":"Fetch the viewport once and reuse the reference (restructuring the zoom-factor block so it does not force an early borrow release), avoiding the duplicate `entry().or_default()` lookup.","locations":[{"ref":"crates/egui/src/context.rs:442-465","code":"  442 |         let viewport = self.viewports.entry(viewport_id).or_default();\n  443 | \n  444 |         if is_outermost_viewport && let Some(new_zoom_factor) = self.new_zoom_factor.take() {\n  445 |             let ratio = self.memory.options.zoom_factor / new_zoom_factor;\n  446 |             self.memory.options.zoom_factor = new_zoom_factor;\n  447 | \n  448 |             let input = &viewport.input;\n  449 |             // This is a bit hacky, but is required to avoid jitter:\n  450 |             let mut rect = input.content_rect();\n  451 |             rect.min = (ratio * rect.min.to_vec2()).to_pos2();\n  452 |             rect.max = (ratio * rect.max.to_vec2()).to_pos2();\n  453 |             new_raw_input.screen_rect = Some(rect);\n  454 |             // We should really scale everything else in the input too,\n  455 |             // but the `screen_rect` is the most important part.\n  456 |         }\n  457 |         let native_pixels_per_point = new_raw_input\n  458 |             .viewport()\n  459 |             .native_pixels_per_point\n  460 |             .unwrap_or(1.0);\n  461 |         let pixels_per_point = self.memory.options.zoom_factor * native_pixels_per_point;\n  462 | \n  463 |         let all_viewport_ids: ViewportIdSet = self.all_viewport_ids();\n  464 | \n  465 |         let viewport = self.viewports.entry(self.viewport_id()).or_default();","lines":24,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/context.rs#L442-L465"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`Context::end_pass` unconditionally calls `self.options(|o| o.quit_shortcuts.clone())` every pass, cloning the `Vec<KeyboardShortcut>` even when it is empty or unchanged. This is a small allocation in the hot per-pass path; similarly the `zoom_with_keyboard` option is read separately. Minor but avoidable.","fix":"Avoid cloning the shortcut list each pass, e.g. by consuming shortcuts inside a single `self.write(...)` closure that borrows `quit_shortcuts`, or early-out when the list is empty.","locations":[{"ref":"crates/egui/src/context.rs:2628-2632","code":" 2628 |         for shortcut in self.options(|o| o.quit_shortcuts.clone()) {\n 2629 |             if self.input_mut(|i| i.consume_shortcut(&shortcut)) {\n 2630 |                 self.send_viewport_cmd(ViewportCommand::Close);\n 2631 |             }\n 2632 |         }","lines":5,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/context.rs#L2628-L2632"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"Cache `byte_size()` implementations count only the payload and ignore the memory held by the cache keys/structures themselves: the `Cow<'static, str>` URIs in `DefaultBytesLoader`, and the `PrimaryKey { uri: String, .. }` + per-bucket HashMap allocations in `DefaultTextureLoader`. With many distinct URIs (notably SVGs cached per size-hint), this under-reports the cache size that the trait docs say should be returned, which can defeat memory-budget logic built on `byte_size`.","fix":"Include key overhead in the sums (e.g. `key.uri.len()` for the bytes loader, `key.uri.len() + size_of::<PrimaryKey>()` plus bucket-map overhead for the texture loader), or document explicitly that the figure is payload-only.","locations":[{"ref":"crates/egui/src/load/bytes_loader.rs:66-68","code":"   66 |     fn byte_size(&self) -> usize {\n   67 |         self.cache.lock().values().map(|bytes| bytes.len()).sum()\n   68 |     }","lines":3,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/load/bytes_loader.rs#L66-L68"},{"ref":"crates/egui/src/load/texture_loader.rs:137-149","code":"  137 |     fn byte_size(&self) -> usize {\n  138 |         self.state\n  139 |             .lock()\n  140 |             .cache\n  141 |             .values()\n  142 |             .map(|bucket| {\n  143 |                 bucket\n  144 |                     .values()\n  145 |                     .map(|texture| texture.handle.byte_size())\n  146 |                     .sum::<usize>()\n  147 |             })\n  148 |             .sum()\n  149 |     }","lines":13,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/load/texture_loader.rs#L137-L149"}]},
{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`Ui::end_row` clones the `Painter` on every call (`&self.painter().clone()`) only to satisfy the borrow checker (self.placer is borrowed mutably while self.painter is borrowed immutably). For grids/wrapping layouts end_row is called once per row, so this is a small but avoidable per-row allocation/Arc-bump in the UI-building hot path.","fix":"Restructure so the painter reference can be passed without cloning, e.g. split out the painter before borrowing the placer, or have Placer::end_row take the ctx/clip-rect it actually needs.","locations":[{"ref":"crates/egui/src/ui.rs:2505-2508","code":" 2505 |     pub fn end_row(&mut self) {\n 2506 |         self.placer\n 2507 |             .end_row(self.spacing().item_spacing, &self.painter().clone());\n 2508 |     }","lines":4,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/ui.rs#L2505-L2508"}]},
{"id":"PERF_9","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`PersistedMap::from_map` calls `generation.elements.clone()` for every kept generation when building the persisted list. Each `SerializedElement` holds an `Arc<str>`, so this bumps refcounts and reallocates the Vec, even though `types_map` is a throwaway local that could be consumed. Runs on every serialization/save.","fix":"Consume the local map by value (`for stats in types_map.into_values()` / `into_values()` on generations) and move with `persisted.append(&mut generation.elements)` or `persisted.extend(generation.elements)`, dropping the `.clone()`.","locations":[{"ref":"crates/egui/src/util/id_type_map.rs:738","code":"  738 |                         persisted.append(&mut generation.elements.clone());","lines":1,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/util/id_type_map.rs#L738"}]},
{"id":"PERF_10","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`TextEdit::show` unconditionally clones the entire buffer into a fresh `String` (`let prev_text = text.as_str().to_owned();`) on every frame for every TextEdit, but it is only consumed inside the lazily-evaluated `widget_info` closures (and only the 'changed' branch truly needs it). This is a wasted full-buffer allocation each frame for the common case where the text did not change.","fix":"Capture `prev_text` only when needed (e.g. inside the `response.changed()` branch / behind a `text_changed` guard), avoiding the per-frame clone when the text is unchanged.","locations":[{"ref":"crates/egui/src/widgets/text_edit/builder.rs:537","code":"  537 |         let prev_text = text.as_str().to_owned();","lines":1,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/widgets/text_edit/builder.rs#L537"}]},
{"id":"PERF_11","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`TextEdit::events` calls `state.undoer.lock().feed_state(time, &(cursor_range, text.as_str().to_owned()))` both before and after the event loop, each performing a full owned `String` clone of the entire buffer on every frame the widget has focus. For large multiline editors this is two full-buffer allocations+copies per frame regardless of whether anything changed.","fix":"Have the undoer borrow `&str` and clone only when it actually decides to push a snapshot, or skip the pre-loop `feed_state` clone (the post-loop one already captures the latest state).","locations":[{"ref":"crates/egui/src/widgets/text_edit/builder.rs:1102-1105","code":" 1102 |     state.undoer.lock().feed_state(\n 1103 |         ui.input(|i| i.time),\n 1104 |         &(cursor_range, text.as_str().to_owned()),\n 1105 |     );","lines":4,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/widgets/text_edit/builder.rs#L1102-L1105"},{"ref":"crates/egui/src/widgets/text_edit/builder.rs:1102-1105","code":" 1102 |     state.undoer.lock().feed_state(\n 1103 |         ui.input(|i| i.time),\n 1104 |         &(cursor_range, text.as_str().to_owned()),\n 1105 |     );","lines":4,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/widgets/text_edit/builder.rs#L1102-L1105"}]},
{"id":"PERF_12","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`Gradient::to_pixel_row` simply clones the inner Vec and returns it; the only caller (`TextureManager::get`) immediately consumes the result to build a ColorImage. The clone is redundant - the method exists only to copy the data.","fix":"Use `gradient.0.clone()` (or pass the slice directly) inline in `TextureManager::get` and remove the `to_pixel_row` helper, or have it return `&[Color32]`.","locations":[{"ref":"crates/egui_demo_lib/src/rendering_test.rs:408-410","code":"  408 |     pub fn to_pixel_row(&self) -> Vec<Color32> {\n  409 |         self.0.clone()\n  410 |     }","lines":3,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui_demo_lib/src/rendering_test.rs#L408-L410"},{"ref":"crates/egui_demo_lib/src/rendering_test.rs:417-428","code":"  417 |     fn get(&mut self, ctx: &egui::Context, gradient: &Gradient) -> &TextureHandle {\n  418 |         self.0.entry(gradient.clone()).or_insert_with(|| {\n  419 |             let pixels = gradient.to_pixel_row();\n  420 |             let width = pixels.len();\n  421 |             let height = 1;\n  422 |             ctx.load_texture(\n  423 |                 \"color_test_gradient\",\n  424 |                 epaint::ColorImage::new([width, height], pixels),\n  425 |                 TextureOptions::LINEAR,\n  426 |             )\n  427 |         })\n  428 |     }","lines":12,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui_demo_lib/src/rendering_test.rs#L417-L428"}]},
{"id":"PERF_13","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`Painter::paint_mesh` (glow backend) calls `buffer_data_u8_slice` with `glow::STREAM_DRAW` for both the vertex and index buffers once per mesh, reallocating/orphaning GPU buffer storage on every draw call every frame. For UIs with many separate meshes this is a per-mesh GPU buffer re-upload. This mirrors a known trade-off but is worth noting as a per-frame reallocation hotspot compared to the wgpu backend which uses a single grown-on-demand sliced buffer.","fix":"Consider growing a persistent vertex/index buffer (orphaning only when capacity must grow) and using `buffer_sub_data` into a pre-sized buffer, similar to the `SlicedBuffer` strategy in the wgpu renderer.","locations":[{"ref":"crates/egui_glow/src/painter.rs:474-488","code":"  474 |             unsafe {\n  475 |                 self.gl.bind_buffer(glow::ARRAY_BUFFER, Some(self.vbo));\n  476 |                 self.gl.buffer_data_u8_slice(\n  477 |                     glow::ARRAY_BUFFER,\n  478 |                     bytemuck::cast_slice(&mesh.vertices),\n  479 |                     glow::STREAM_DRAW,\n  480 |                 );\n  481 | \n  482 |                 self.gl\n  483 |                     .bind_buffer(glow::ELEMENT_ARRAY_BUFFER, Some(self.element_array_buffer));\n  484 |                 self.gl.buffer_data_u8_slice(\n  485 |                     glow::ELEMENT_ARRAY_BUFFER,\n  486 |                     bytemuck::cast_slice(&mesh.indices),\n  487 |                     glow::STREAM_DRAW,\n  488 |                 );","lines":15,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui_glow/src/painter.rs#L474-L488"}]},
{"id":"PERF_14","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"In `automatic_area_position` the `existing` rectangles vector is collected and sorted every time a new area needs an automatic position. This only runs when an area has no stored position (first frame), so impact is minor, but the column-bucketing loop re-includes `existing[0]` (it is seeded into `column_bbs` and then iterated again), doing a redundant self-union on the first element.","fix":"Start the iteration at `existing[1..]` since `column_bbs` is already seeded with `existing[0]`, avoiding the redundant self-union (purely cosmetic).","locations":[{"ref":"crates/egui/src/containers/area.rs:702-734","code":"  702 | fn automatic_area_position(ctx: &Context, constrain_rect: Rect, layer_id: LayerId) -> Pos2 {\n  703 |     let mut existing: Vec<Rect> = ctx.memory(|mem| {\n  704 |         mem.areas()\n  705 |             .visible_windows()\n  706 |             .filter(|(id, _)| id != &layer_id) // ignore ourselves\n  707 |             .filter(|(_, state)| state.pivot_pos.is_some() && state.size.is_some())\n  708 |             .map(|(_, state)| state.rect())\n  709 |             .collect()\n  710 |     });\n  711 |     existing.sort_by_key(|r| r.left().round() as i32);\n  712 | \n  713 |     let spacing = 16.0;\n  714 |     let left = constrain_rect.left() + spacing;\n  715 |     let top = constrain_rect.top() + spacing;\n  716 | \n  717 |     if existing.is_empty() {\n  718 |         return pos2(left, top);\n  719 |     }\n  720 | \n  721 |     // Separate existing rectangles into columns:\n  722 |     let mut column_bbs = vec![existing[0]];\n  723 | \n  724 |     for &rect in &existing {\n  725 |         #[expect(clippy::unwrap_used)]\n  726 |         let current_column_bb = column_bbs.last_mut().unwrap();\n  727 |         if rect.left() < current_column_bb.right() {\n  728 |             // same column\n  729 |             *current_column_bb |= rect;\n  730 |         } else {\n  731 |             // new column\n  732 |             column_bbs.push(rect);\n  733 |         }\n  734 |     }","lines":33,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/containers/area.rs#L702-L734"}]},
{"id":"PERF_15","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`GridLayout::save` clones the entire `curr_state` (two `Vec<f32>`) to store it: `self.curr_state.clone().store(...)`. This runs every frame the grid sizes change. `store` takes `self` by value, so the clone exists only because `save` takes `&self`.","fix":"Have `save` take `&mut self` (or `self`) and move `curr_state` into `store` (e.g. `std::mem::take(&mut self.curr_state)`) to avoid the per-frame Vec clone.","locations":[{"ref":"crates/egui/src/grid.rs:289-296","code":"  289 |     pub(crate) fn save(&self) {\n  290 |         // We need to always save state on the first frame, otherwise request_discard\n  291 |         // would be called repeatedly (see #5132)\n  292 |         if self.curr_state != self.prev_state || self.is_first_frame {\n  293 |             self.curr_state.clone().store(&self.ctx, self.id);\n  294 |             self.ctx.request_repaint();\n  295 |         }\n  296 |     }","lines":8,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/grid.rs#L289-L296"}]},
{"id":"PERF_16","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`PluginsOrdered::ordered_plugins`/`Plugins::ordered_plugins` clones the entire `Vec<Arc<Mutex<PluginHandle>>>` (`PluginsOrdered::clone`) on every `begin_pass`, `end_pass`, `on_input`, and `on_output` call (four times per pass), just to iterate it without holding the context lock. Each clone bumps the refcount of every plugin Arc. With few plugins this is cheap, but it is an avoidable per-pass allocation.","fix":"Store the ordered plugin list behind a shared `Arc<Vec<...>>` so it can be cloned cheaply (single refcount bump), or restructure so iteration borrows without cloning.","locations":[{"ref":"crates/egui/src/plugin.rs:207-210","code":"  207 | impl Plugins {\n  208 |     pub fn ordered_plugins(&self) -> PluginsOrdered {\n  209 |         self.plugins_ordered.clone()\n  210 |     }","lines":4,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/plugin.rs#L207-L210"},{"ref":"crates/egui/src/context.rs:850","code":"  850 |         let plugins = self.read(|ctx| ctx.plugins.ordered_plugins());","lines":1,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/context.rs#L850"},{"ref":"crates/egui/src/context.rs:850","code":"  850 |         let plugins = self.read(|ctx| ctx.plugins.ordered_plugins());","lines":1,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/context.rs#L850"},{"ref":"crates/egui/src/context.rs:2641","code":" 2641 |         let plugins = self.read(|ctx| ctx.plugins.ordered_plugins());","lines":1,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/context.rs#L2641"}]},
{"id":"PERF_17","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`Style::text_styles()` allocates a new `Vec<TextStyle>` (cloning every key) on each call. It is used in the panic path of `TextStyle::resolve` and in the style editor combo-boxes; the latter calls it inside `show_ui` closures. Not a hot path for normal rendering, but the allocation+clone is avoidable when only iteration is needed.","fix":"Where only iteration is needed (e.g. the combo-box population), iterate `self.text_styles.keys()` directly instead of materializing a Vec.","locations":[{"ref":"crates/egui/src/style.rs:376-378","code":"  376 |     pub fn text_styles(&self) -> Vec<TextStyle> {\n  377 |         self.text_styles.keys().cloned().collect()\n  378 |     }","lines":3,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/style.rs#L376-L378"}]},
{"id":"PERF_18","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`Hyperlink::new` calls `url.to_string()` then `url.clone()` to populate both the `url` field and the `text` field, performing two allocations of the same string. Minor, but avoidable.","fix":"Build the text from the already-owned url without an extra clone, e.g. `let url = url.to_string(); Self { text: url.clone().into(), url, new_tab: false }` is unavoidable for two owners, but the WidgetText could borrow; alternatively accept the single extra clone and document it. (Negligible.)","locations":[{"ref":"crates/egui/src/widgets/hyperlink.rs:100-107","code":"  100 |     pub fn new(url: impl ToString) -> Self {\n  101 |         let url = url.to_string();\n  102 |         Self {\n  103 |             url: url.clone(),\n  104 |             text: url.into(),\n  105 |             new_tab: false,\n  106 |         }\n  107 |     }","lines":8,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/widgets/hyperlink.rs#L100-L107"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`test_parse_query` compares `parse_query_map(...)` (which returns `BTreeMap<String, Vec<String>>`) against `BTreeMap::from_iter([(\"foo\", \"\")])` which infers `BTreeMap<&str, &str>`. These types are not comparable, so the test cannot compile. It is only saved by the fact that the whole `web` module is wasm32-only and the test is never actually built/run, as the comment on line 182 admits. The test gives a false sense of coverage and is effectively dead/invalid code.","fix":"Move `parse_query_map` and its test out of the wasm-only module (or behind a `#[cfg(test)]` that compiles on the host target) and fix the expected-value types to `String`/`Vec<String>` so the test actually compiles and runs.","locations":[{"ref":"crates/eframe/src/web/backend.rs:200-228","code":"  200 | // TODO(emilk): this test is never acgtually run, because this whole module is wasm32 only 🤦‍♂️\n  201 | #[test]\n  202 | fn test_parse_query() {\n  203 |     assert_eq!(parse_query_map(\"\"), BTreeMap::default());\n  204 |     assert_eq!(parse_query_map(\"foo\"), BTreeMap::from_iter([(\"foo\", \"\")]));\n  205 |     assert_eq!(\n  206 |         parse_query_map(\"foo=bar\"),\n  207 |         BTreeMap::from_iter([(\"foo\", \"bar\")])\n  208 |     );\n  209 |     assert_eq!(\n  210 |         parse_query_map(\"foo=bar&baz=42\"),\n  211 |         BTreeMap::from_iter([(\"foo\", \"bar\"), (\"baz\", \"42\")])\n  212 |     );\n  213 |     assert_eq!(\n  214 |         parse_query_map(\"foo&baz=42\"),\n  215 |         BTreeMap::from_iter([(\"foo\", \"\"), (\"baz\", \"42\")])\n  216 |     );\n  217 |     assert_eq!(\n  218 |         parse_query_map(\"foo&baz&&\"),\n  219 |         BTreeMap::from_iter([(\"foo\", \"\"), (\"baz\", \"\")])\n  220 |     );\n  221 |     assert_eq!(\n  222 |         parse_query_map(\"badger=data.rrd%3Fparam1%3Dfoo%26param2%3Dbar&mushroom=snake\"),\n  223 |         BTreeMap::from_iter([\n  224 |             (\"badger\", \"data.rrd?param1=foo&param2=bar\"),\n  225 |             (\"mushroom\", \"snake\")\n  226 |         ])\n  227 |     );\n  228 | }","lines":29,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/eframe/src/web/backend.rs#L200-L228"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"Permanently-dead `if true { … } else { … }` branch. The `else` arm (which would set `content_max_size[d] = f32::INFINITY` for scrollable axes) can never execute, so it is unreachable dead code that just confuses readers.","fix":"Delete the `if true { … } else { … }` scaffold, keeping only the comment that documents why we fit content to the available size. If the alternative behavior is wanted in the future, gate it behind a real flag.","locations":[{"ref":"crates/egui/src/containers/scroll_area.rs:786-796","code":"  786 |         if true {\n  787 |             // Tell the inner Ui to *try* to fit the content without needing to scroll,\n  788 |             // i.e. better to wrap text and shrink images than showing a horizontal scrollbar!\n  789 |         } else {\n  790 |             // Tell the inner Ui to use as much space as possible, we can scroll to see it!\n  791 |             for d in 0..2 {\n  792 |                 if direction_enabled[d] {\n  793 |                     content_max_size[d] = f32::INFINITY;\n  794 |                 }\n  795 |             }\n  796 |         }","lines":11,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/containers/scroll_area.rs#L786-L796"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"The expression computing `d` in find_cross_t algebraically cancels to exactly 0: `p0.x*(p3.y-p0.y)` cancels `p0.x*(p0.y-p3.y)`, and `-p0.y*(p3.x-p0.x)` cancels `+p0.y*(p3.x-p0.x)`. The cubic's constant term is indeed 0, so this is misleading dead arithmetic that obscures intent and invites copy-paste error.","fix":"Replace with `let d = 0.0;` (constant term is zero) or remove the redundant terms.","locations":[{"ref":"crates/epaint/src/shapes/bezier_shape.rs:242-244","code":"  242 |         let d = p0.x * (p3.y - p0.y) - p0.y * (p3.x - p0.x)\n  243 |             + p0.x * (p0.y - p3.y)\n  244 |             + p0.y * (p3.x - p0.x);","lines":3,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/epaint/src/shapes/bezier_shape.rs#L242-L244"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"`install_dpr_change_event` wraps its only real work in `if true { … }`. The constant condition is dead-code scaffolding that obscures intent and can never take the (missing) else branch.","fix":"Remove the `if true` wrapper and inline the canvas-resize block.","locations":[{"ref":"crates/eframe/src/web/events.rs:469-476","code":"  469 |         if true {\n  470 |             // Explicitly resize canvas to match the new DPR.\n  471 |             // This is a bit ugly, but I haven't found a better way to do it.\n  472 |             let canvas = app_runner.canvas();\n  473 |             canvas.set_width((canvas.width() as f32 * new_dpr / original_dpr).round() as _);\n  474 |             canvas.set_height((canvas.height() as f32 * new_dpr / original_dpr).round() as _);\n  475 |             log::debug!(\"Resized canvas to {}x{}\", canvas.width(), canvas.height());\n  476 |         }","lines":8,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/eframe/src/web/events.rs#L469-L476"}]},
{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"Commented-out leftover code `// response.active |= is_popup_open;` inside `combo_box_dyn`. Stale commented code should not be left in the source.","fix":"Remove the commented-out line.","locations":[{"ref":"crates/egui/src/containers/combo_box.rs:366","code":"  366 |         // response.active |= is_popup_open;","lines":1,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/containers/combo_box.rs#L366"}]},
{"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"The `InTouch` enum variant uses a plain `//` comment for its documentation while the sibling variants `Static` and `Smoothing` use `///` doc comments. As a result `InTouch` has no rustdoc, an inconsistency that drops it from generated docs.","fix":"Change the `// We're in-between` comment above `InTouch` to a `///` doc comment.","locations":[{"ref":"crates/egui/src/input_state/wheel_state.rs:27-34","code":"   27 |     /// Not scrolling,\n   28 |     Static,\n   29 | \n   30 |     /// We're smoothing out previous scroll events\n   31 |     Smoothing,\n   32 | \n   33 |     // We're in-between [`TouchPhase::Start`] and [`TouchPhase::End`] of a trackpad scroll.\n   34 |     InTouch,","lines":8,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/input_state/wheel_state.rs#L27-L34"}]},

{"id":"DEAD_8","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"`color_picker_hsvag_2d` contains two `if false { color_slider_1d(...) }` blocks for the saturation and value 1D sliders. This is permanently-disabled dead code kept inline, cluttering the function and confusing readers about whether the 1D S/V sliders are ever shown.","fix":"Remove the `if false` blocks (the 2D slider on the next lines replaces them), or gate them behind a real config flag if they are meant to be optionally enabled.","locations":[{"ref":"crates/egui/src/widgets/color_picker.rs:394-400","code":"  394 |     if false {\n  395 |         color_slider_1d(ui, s, |s| HsvaGamma { s, ..opaque }.into()).on_hover_text(\"Saturation\");\n  396 |     }\n  397 | \n  398 |     if false {\n  399 |         color_slider_1d(ui, v, |v| HsvaGamma { v, ..opaque }.into()).on_hover_text(\"Value\");\n  400 |     }","lines":7,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/widgets/color_picker.rs#L394-L400"}]},

{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"Contradictory doc on the `hex_color!` macro: the prose states \"Note that despite being checked at compile-time, this macro is not usable in `const` contexts because creating the Color32 instance requires floating-point arithmetic.\" but a later doctest in the same comment demonstrates `const COLOR: ecolor::Color32 = ecolor::hex_color!(\"#202122\");` working, and the macro expands to the const-capable `from_rgb` / `from_rgba_unmultiplied_const`. The 'not usable in const' note is stale/incorrect.","fix":"Remove or correct the outdated note; the macro is usable in const contexts (it uses `from_rgb` and `from_rgba_unmultiplied_const`).","locations":[{"ref":"crates/ecolor/src/hex_color_macro.rs:11-12","code":"   11 | ///\n   12 | /// See also [`crate::Color32::from_hex`] and [`crate::Color32::to_hex`].","lines":2,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/ecolor/src/hex_color_macro.rs#L11-L12"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"Doc comment for the `Hex8` variant of `HexColor` says \"8 hexadecimal digits, one for each of the r, g, b, a channels\", copied from `Hex4`. Hex8 uses two digits per channel, not one.","fix":"Change the `Hex8` doc to \"8 hexadecimal digits, two for each of the r, g, b, a channels\".","locations":[{"ref":"crates/ecolor/src/hex_color_runtime.rs:26-27","code":"   26 |     /// 8 hexadecimal digits, one for each of the r, g, b, a channels\n   27 |     Hex8(Color32),","lines":2,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/ecolor/src/hex_color_runtime.rs#L26-L27"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"Comments in `Context::constrain_window_rect_to_area` describe the wrong directions. Line 2365 (`pos.y = pos.y.at_most(...)`, moving the window up) is annotated \"move right if needed\", and line 2366 (`pos.y.at_least(...)`, moving down) is annotated \"move down if needed\". The X comments are about left/right but the Y comments copy-paste \"right\"/\"down\" incorrectly, misleading future readers.","fix":"Fix the directional comments: the `at_most` on `pos.y` moves the window up, and `at_least` on `pos.y` moves it down; the X lines' \"left\"/\"right\" wording should also be checked for accuracy.","locations":[{"ref":"crates/egui/src/context.rs:2609-2612","code":" 2609 |         pos.x = pos.x.at_most(area.right() + margin_x - window.width()); // move left if needed\n 2610 |         pos.x = pos.x.at_least(area.left() - margin_x); // move right if needed\n 2611 |         pos.y = pos.y.at_most(area.bottom() + margin_y - window.height()); // move right if needed\n 2612 |         pos.y = pos.y.at_least(area.top() - margin_y); // move down if needed","lines":4,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/context.rs#L2609-L2612"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The doc comment on `Event::PointerGone` says \"On touch-up first send `PointerButton{pressed: false, ...}` followed by `PointerLeft`.\" There is no `PointerLeft` event in egui; the variant being documented is `PointerGone`. Leftover from a rename.","fix":"Change `PointerLeft` to `PointerGone`.","locations":[{"ref":"crates/egui/src/data/input/event.rs:112","code":"  112 |     /// On touch-up first send `PointerButton{pressed: false, …}` followed by `PointerLeft`.","lines":1,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/data/input/event.rs#L112"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"Doc comment for `UiBuilder::max_rect` is truncated mid-sentence: \"the [`Ui`] will make room for it by expanding both `min_rect` and\" — the sentence ends abruptly with a dangling `and` and the following paragraph starts a new thought.","fix":"Complete the sentence, e.g. \"...by expanding both `min_rect` and `max_rect`.\"","locations":[{"ref":"crates/egui/src/ui_builder.rs:96-101","code":"   96 |     ///\n   97 |     /// If a new widget doesn't fit within the `max_rect` then the\n   98 |     /// [`Ui`] will make room for it by expanding both `min_rect` and\n   99 |     ///\n  100 |     /// If not set, this will be set to the parent\n  101 |     /// [`Ui::available_rect_before_wrap`].","lines":6,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/ui_builder.rs#L96-L101"}]},
{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The `Slider` doc comment says clamping is changed \"by passing `false` to [`Slider::clamping`]\", but `Slider::clamping` takes a `SliderClamping` enum (e.g. `SliderClamping::Never`), not a bool. The comment is misleading and predates the enum-based API.","fix":"Update the comment to: \"You can change this behavior by passing e.g. `SliderClamping::Never` to [`Slider::clamping`].\"","locations":[{"ref":"crates/egui/src/widgets/slider.rs:81-82","code":"   81 | /// By default all values are clamped to this range, even when not interacted with.\n   82 | /// You can change this behavior by passing `false` to [`Slider::clamping`].","lines":2,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/widgets/slider.rs#L81-L82"}]},
{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The assertion message claims `intrinsic_size should be set for \"Button\"`, but the surrounding loop iterates over both `Ui::button` and `Ui::label`. For the label case the message names the wrong widget, which is misleading when the assertion fires.","fix":"Make the message widget-agnostic, e.g. `intrinsic_size should always be set`, or include the actual widget under test.","locations":[{"ref":"tests/egui_tests/tests/test_atoms.rs:103-106","code":"  103 |                     assert!(\n  104 |                         response.intrinsic_size().is_some(),\n  105 |                         \"intrinsic_size should be set for `Button`\"\n  106 |                     );","lines":4,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/tests/egui_tests/tests/test_atoms.rs#L103-L106"}]},
{"id":"CMT_8","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"Comment typos/wrong references that mislead readers: `init_webgl1` calls `.expect(\"Failed to query about WebGL2 context\")` (says WebGL2 in the WebGL1 path), and the immediate-viewport surface attribute uses `.expect(\"Failed to get display handle\")` while actually calling `window.window_handle()` (says display, gets window).","fix":"Correct the messages to match the actual operation (\"WebGL1 context\" and \"Failed to get window handle\").","locations":[{"ref":"crates/eframe/src/web/web_painter_glow.rs:121-123","code":"  121 |     let gl1_ctx = canvas\n  122 |         .get_context(\"webgl\")\n  123 |         .expect(\"Failed to query about WebGL2 context\");","lines":3,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/eframe/src/web/web_painter_glow.rs#L121-L123"},{"ref":"crates/eframe/src/native/glow_integration.rs:1337-1341","code":" 1337 |                     .build(\n 1338 |                         window\n 1339 |                             .window_handle()\n 1340 |                             .expect(\"Failed to get display handle\")\n 1341 |                             .as_raw(),","lines":5,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/eframe/src/native/glow_integration.rs#L1337-L1341"}]},

{"id":"CMT_11","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"Doc comment claims the default zoom range is `0.0..=1.0` (\"you zan make things arbitrarily small\"), but `Scene::default` actually uses `Rangef::new(f32::EPSILON, 1.0)`, i.e. a minimum of `f32::EPSILON`, not `0.0`. Minor but the doc and code disagree.","fix":"Either change the default min to `0.0` or update the doc to say the default minimum is `f32::EPSILON`.","locations":[{"ref":"crates/egui/src/containers/scene.rs:104-115","code":"  104 |     /// Set the allowed zoom range.\n  105 |     ///\n  106 |     /// The default zoom range is `0.0..=1.0`,\n  107 |     /// which mean you zan make things arbitrarily small, but you cannot zoom in past a `1:1` ratio.\n  108 |     ///\n  109 |     /// If you want to allow zooming in, you can set the zoom range to `0.0..=f32::INFINITY`.\n  110 |     /// Note that text rendering becomes blurry when you zoom in: <https://github.com/emilk/egui/issues/4813>.\n  111 |     #[inline]\n  112 |     pub fn zoom_range(mut self, zoom_range: impl Into<Rangef>) -> Self {\n  113 |         self.zoom_range = zoom_range.into();\n  114 |         self\n  115 |     }","lines":12,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/containers/scene.rs#L104-L115"},{"ref":"crates/egui/src/containers/scene.rs:78-80","code":"   78 |         Self {\n   79 |             zoom_range: Rangef::new(f32::EPSILON, 1.0),\n   80 |             sense: Sense::click_and_drag(),","lines":3,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/containers/scene.rs#L78-L80"}]},

{"id":"CMT_15","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"Several doc-comment typos in the wheel-state types: \"deviced\" (should be \"devices\"), \"Discreen\" (should be \"Discrete\"), \"discreet scroll events\" (should be \"discrete\"), \"we consider use to be scrolling\" (\"use\" should be \"us\"). These are user-facing rustdoc.","fix":"Correct the spellings: devices, Discrete, discrete, us.","locations":[{"ref":"crates/egui/src/input_state/wheel_state.rs:7-24","code":"    7 | /// There are two important types of scroll input deviced:\n    8 | /// * Discreen scroll wheels on a mouse\n    9 | /// * Smooth scroll input from a trackpad\n   10 | ///\n   11 | /// Scroll wheels will usually fire one single scroll event,\n   12 | /// so it is important that egui smooths it out over time.\n   13 | ///\n   14 | /// On the contrary, trackpads usually provide smooth scroll input,\n   15 | /// and with kinetic scrolling (which on Mac is implemented by the OS)\n   16 | /// scroll events can arrive _after_ the user lets go of the trackpad.\n   17 | ///\n   18 | /// In either case, we consider use to be scrolling until there is no more\n   19 | /// scroll events expected.\n   20 | ///\n   21 | /// This means there are a few different states we can be in:\n   22 | /// * Not scrolling\n   23 | /// * \"Smooth scrolling\" (low-pass filter of discreet scroll events)\n   24 | /// * Trackpad-scrolling (we receive begin/end phases for these)","lines":18,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/input_state/wheel_state.rs#L7-L24"}]},
