<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"The entire glow integration file is compiled with `#![expect(clippy::unwrap_used)]` and contains many `.unwrap()`/`.expect()` calls on fallible GPU / windowing operations. In particular `change_gl_context` unwraps `make_not_current()` and `make_current()` (GL context switches that can genuinely fail), and `GlutinWindowContext::resize` unwraps `current_gl_context.as_ref()`. A driver/context loss turns these into hard panics that crash the whole app instead of surfacing a `crate::Error`. The file's own module doc even flags this (\"like removing a bunch of `unwraps`\").","fix":"Propagate these failures as `crate::Error` (the surrounding functions already return `Result`), or at minimum log and bail gracefully. Replace `.unwrap()` on `make_current`/`make_not_current`/`current_gl_context.as_ref()` with `?`-based error handling.","locations":[{"ref":"crates/eframe/src/native/glow_integration.rs:1031-1044","code":" 1031 |     let not_current = if let Some(not_current_context) = not_current_gl_context.take() {\n 1032 |         not_current_context\n 1033 |     } else {\n 1034 |         profiling::scope!(\"make_not_current\");\n 1035 |         current_gl_context\n 1036 |             .take()\n 1037 |             .unwrap()\n 1038 |             .make_not_current()\n 1039 |             .unwrap()\n 1040 |     };\n 1041 | \n 1042 |     profiling::scope!(\"make_current\");\n 1043 |     *current_gl_context = Some(not_current.make_current(gl_surface).unwrap());\n 1044 | }","lines":14,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/eframe/src/native/glow_integration.rs#L1031-L1044"},{"ref":"crates/eframe/src/native/glow_integration.rs:1420-1439","code":" 1420 |     fn resize(&mut self, viewport_id: ViewportId, physical_size: winit::dpi::PhysicalSize<u32>) {\n 1421 |         let width_px = NonZeroU32::new(physical_size.width).unwrap_or(NonZeroU32::MIN);\n 1422 |         let height_px = NonZeroU32::new(physical_size.height).unwrap_or(NonZeroU32::MIN);\n 1423 | \n 1424 |         if let Some(viewport) = self.viewports.get(&viewport_id)\n 1425 |             && let Some(gl_surface) = &viewport.gl_surface\n 1426 |         {\n 1427 |             change_gl_context(\n 1428 |                 &mut self.current_gl_context,\n 1429 |                 &mut self.not_current_gl_context,\n 1430 |                 gl_surface,\n 1431 |             );\n 1432 |             gl_surface.resize(\n 1433 |                 self.current_gl_context\n 1434 |                     .as_ref()\n 1435 |                     .expect(\"failed to get current context to resize surface\"),\n 1436 |                 width_px,\n 1437 |                 height_px,\n 1438 |             );\n 1439 |         }","lines":20,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/eframe/src/native/glow_integration.rs#L1420-L1439"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`render_immediate_viewport` (glow) unwraps `current_gl_context.as_ref()` right after `change_gl_context`. If the context switch left `current_gl_context` as `None` (e.g. a transient failure in the non-panicking Windows path was added later), this panics inside user-driven immediate-viewport rendering. The surrounding function returns `()` and already uses graceful `let-else`/`if let Err` everywhere else, so this single unwrap is inconsistent and crash-prone.","fix":"Use `let Some(current_gl_context) = current_gl_context.as_ref() else { log::error!(...); return; };` to match the graceful error handling used elsewhere in this function.","locations":[{"ref":"crates/eframe/src/native/glow_integration.rs:1715-1717","code":" 1715 |     change_gl_context(current_gl_context, not_current_gl_context, gl_surface);\n 1716 | \n 1717 |     let current_gl_context = current_gl_context.as_ref().unwrap();","lines":3,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/eframe/src/native/glow_integration.rs#L1715-L1717"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`init_webgl1`/`init_webgl2` call `.expect(\"Failed to query about WebGL2 context\")` on `canvas.get_context(...)` and `.unwrap()` on the `dyn_into` cast. A `get_context` call can return `Err` (e.g. when the canvas already has an incompatible context type bound, which happens if the user reuses a canvas), turning recoverable WebGL setup failure into an uncatchable wasm panic instead of the intended `Err(\"WebGL isn't supported\")` path.","fix":"Convert the `.expect()` on `get_context` into `.ok().flatten()` returning `None`, and handle the `dyn_into` failure as `None`, so the caller falls through to the proper WebGL-unsupported error.","locations":[{"ref":"crates/eframe/src/web/web_painter_glow.rs:120-159","code":"  120 | fn init_webgl1(canvas: &HtmlCanvasElement) -> Option<(glow::Context, &'static str)> {\n  121 |     let gl1_ctx = canvas\n  122 |         .get_context(\"webgl\")\n  123 |         .expect(\"Failed to query about WebGL2 context\");\n  124 | \n  125 |     let gl1_ctx = gl1_ctx?;\n  126 |     log::debug!(\"WebGL1 selected.\");\n  127 | \n  128 |     let gl1_ctx = gl1_ctx\n  129 |         .dyn_into::<web_sys::WebGlRenderingContext>()\n  130 |         .unwrap();\n  131 | \n  132 |     let shader_prefix = if webgl1_requires_brightening(&gl1_ctx) {\n  133 |         log::debug!(\"Enabling webkitGTK brightening workaround.\");\n  134 |         \"#define APPLY_BRIGHTENING_GAMMA\"\n  135 |     } else {\n  136 |         \"\"\n  137 |     };\n  138 | \n  139 |     let gl = glow::Context::from_webgl1_context(gl1_ctx);\n  140 | \n  141 |     Some((gl, shader_prefix))\n  142 | }\n  143 | \n  144 | fn init_webgl2(canvas: &HtmlCanvasElement) -> Option<(glow::Context, &'static str)> {\n  145 |     let gl2_ctx = canvas\n  146 |         .get_context(\"webgl2\")\n  147 |         .expect(\"Failed to query about WebGL2 context\");\n  148 | \n  149 |     let gl2_ctx = gl2_ctx?;\n  150 |     log::debug!(\"WebGL2 selected.\");\n  151 | \n  152 |     let gl2_ctx = gl2_ctx\n  153 |         .dyn_into::<web_sys::WebGl2RenderingContext>()\n  154 |         .unwrap();\n  155 |     let gl = glow::Context::from_webgl2_context(gl2_ctx);\n  156 |     let shader_prefix = \"\";\n  157 | \n  158 |     Some((gl, shader_prefix))\n  159 | }","lines":40,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/eframe/src/web/web_painter_glow.rs#L120-L159"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`PaintList::reset_shape` indexes `self.0[idx.0]` directly with no bounds check, unlike the sibling methods `set` (which checks `len() <= idx.0` and warns) and `mutate_shape` (which uses `get_mut`). A stale or out-of-range `ShapeIdx` (e.g. an index allocated in a different/cleared `PaintList`) will panic with an out-of-bounds index. `transform_range` (slicing `self.0[start.0..end.0]`) has the same unchecked-panic risk.","fix":"Make `reset_shape` bounds-check like `set`/`mutate_shape` (e.g. `if let Some(s) = self.0.get_mut(idx.0) { s.shape = Shape::Noop; }`), and guard `transform_range` against `start`/`end` exceeding `len()`.","locations":[{"ref":"crates/egui/src/layers.rs:159-162","code":"  159 |     #[inline(always)]\n  160 |     pub fn reset_shape(&mut self, idx: ShapeIdx) {\n  161 |         self.0[idx.0].shape = Shape::Noop;\n  162 |     }","lines":4,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/layers.rs#L159-L162"},{"ref":"crates/egui/src/layers.rs:177-183","code":"  177 |     /// Transform each [`Shape`] and clip rectangle in range by this much, in-place\n  178 |     pub fn transform_range(&mut self, start: ShapeIdx, end: ShapeIdx, transform: TSTransform) {\n  179 |         for ClippedShape { clip_rect, shape } in &mut self.0[start.0..end.0] {\n  180 |             *clip_rect = transform.mul_rect(*clip_rect);\n  181 |             shape.transform(transform);\n  182 |         }\n  183 |     }","lines":7,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/layers.rs#L177-L183"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"The EasyMark highlighter assumes the character after a backslash escape is exactly one byte: when `text.starts_with('\\')` it sets `skip = 2`, then slices `text[skip..]` (lines 109/112). If the escaped character is multi-byte UTF-8 (e.g. `\\é`), `text[2..]` slices in the middle of the character and panics. The highlighter runs on the live editor buffer, so this is reachable by typing into the EasyMark editor.","fix":"Compute the byte length of the escaped char: `let skip = 1 + text[1..].chars().next().map_or(0, |c| c.len_utf8());` instead of the hard-coded `2`.","locations":[{"ref":"crates/egui_demo_lib/src/easy_mark/easy_mark_highlighter.rs:61-62","code":"   61 |         if text.starts_with('\\\\') && text.len() >= 2 {\n   62 |             skip = 2;","lines":2,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui_demo_lib/src/easy_mark/easy_mark_highlighter.rs#L61-L62"},{"ref":"crates/egui_demo_lib/src/easy_mark/easy_mark_highlighter.rs:109-114","code":"  109 |         let line_end = text[skip..]\n  110 |             .find('\\n')\n  111 |             .map_or_else(|| text.len(), |i| skip + i + 1);\n  112 |         let end = text[skip..]\n  113 |             .find(&['*', '`', '~', '_', '/', '$', '^', '\\\\', '<', '['][..])\n  114 |             .map_or_else(|| text.len(), |i| (skip + i).max(1));","lines":6,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui_demo_lib/src/easy_mark/easy_mark_highlighter.rs#L109-L114"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"The EasyMark parser slices the byte right after a backslash escape on hard-coded byte offsets: `&self.s[1..2]` and `&self.s[2..]`. When the character following `\\` is a multi-byte UTF-8 character (e.g. typing `\\é` in the EasyMark editor), index 1 and/or 2 fall in the middle of that character and `str` indexing panics. This is reachable from the live EasyMark editor/viewer with arbitrary user text.","fix":"Take the next char by its real byte length instead of assuming 1 byte: e.g. `let c = self.s[1..].chars().next(); let len = c.map_or(0, |c| c.len_utf8()); let text = &self.s[1..1+len]; self.s = &self.s[1+len..];`.","locations":[{"ref":"crates/egui_demo_lib/src/easy_mark/easy_mark_parser.rs:214-219","code":"  214 |             if self.s.starts_with('\\\\') && self.s.len() >= 2 {\n  215 |                 let text = &self.s[1..2];\n  216 |                 self.s = &self.s[2..];\n  217 |                 self.start_of_line = false;\n  218 |                 return Some(Item::Text(self.style, text));\n  219 |             }","lines":6,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui_demo_lib/src/easy_mark/easy_mark_parser.rs#L214-L219"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`AnimatedImage::get_image` indexes `self.frames[index % self.frames.len()]`. If `load_gif` decodes an animation with zero frames (e.g. a malformed/empty GIF that still decodes), `frames.len()` is 0 and the modulo panics with divide-by-zero, taking down the UI thread on untrusted image input.","fix":"Guard against empty frames: return an error from `load_gif` if no frames were decoded, or have `get_image` return `Option`/a placeholder when `frames.is_empty()`.","locations":[{"ref":"crates/egui_extras/src/loaders/gif_loader.rs:55-58","code":"   55 |     /// Gets image at index\n   56 |     pub fn get_image(&self, index: usize) -> Arc<ColorImage> {\n   57 |         Arc::clone(&self.frames[index % self.frames.len()])\n   58 |     }","lines":4,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui_extras/src/loaders/gif_loader.rs#L55-L58"},{"ref":"crates/egui_extras/src/loaders/gif_loader.rs:19-40","code":"   19 |     fn load_gif(data: &[u8]) -> Result<Self, String> {\n   20 |         let decoder = image::codecs::gif::GifDecoder::new(Cursor::new(data))\n   21 |             .map_err(|err| format!(\"Failed to decode gif: {err}\"))?;\n   22 |         let mut images = vec![];\n   23 |         let mut durations = vec![];\n   24 |         for frame in decoder.into_frames() {\n   25 |             let frame = frame.map_err(|err| format!(\"Failed to decode gif: {err}\"))?;\n   26 |             let img = frame.buffer();\n   27 |             let pixels = img.as_flat_samples();\n   28 | \n   29 |             let delay: Duration = frame.delay().into();\n   30 |             images.push(Arc::new(ColorImage::from_rgba_unmultiplied(\n   31 |                 [img.width() as usize, img.height() as usize],\n   32 |                 pixels.as_slice(),\n   33 |             )));\n   34 |             durations.push(delay);\n   35 |         }\n   36 |         Ok(Self {\n   37 |             frames: images,\n   38 |             frame_durations: FrameDurations::new(durations),\n   39 |         })\n   40 |     }","lines":22,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui_extras/src/loaders/gif_loader.rs#L19-L40"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"Same zero-frame divide-by-zero panic risk as the GIF loader: `AnimatedImage::get_image_by_index` indexes `self.frames[index % self.frames.len()]` with no check that `frames` is non-empty. A WebP that reports `has_animation()` but yields zero decoded frames will panic.","fix":"Reject animations with zero frames during decode, or make `get_image_by_index` handle the empty case without a modulo-by-zero.","locations":[{"ref":"crates/egui_extras/src/loaders/webp_loader.rs:111-113","code":"  111 |     pub fn get_image_by_index(&self, index: usize) -> Arc<ColorImage> {\n  112 |         Arc::clone(&self.frames[index % self.frames.len()])\n  113 |     }","lines":3,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui_extras/src/loaders/webp_loader.rs#L111-L113"},{"ref":"crates/egui_extras/src/loaders/webp_loader.rs:29-49","code":"   29 |             let mut images = vec![];\n   30 |             let mut durations = vec![];\n   31 | \n   32 |             for frame in decoder.into_frames() {\n   33 |                 let frame =\n   34 |                     frame.map_err(|error| format!(\"WebP frame decode failure ({error})\"))?;\n   35 |                 let image = frame.buffer();\n   36 |                 let pixels = image.as_flat_samples();\n   37 | \n   38 |                 images.push(Arc::new(ColorImage::from_rgba_unmultiplied(\n   39 |                     [image.width() as usize, image.height() as usize],\n   40 |                     pixels.as_slice(),\n   41 |                 )));\n   42 | \n   43 |                 let delay: Duration = frame.delay().into();\n   44 |                 durations.push(delay);\n   45 |             }\n   46 |             Ok(Self::Animated(AnimatedImage {\n   47 |                 frames: images,\n   48 |                 frame_durations: FrameDurations::new(durations),\n   49 |             }))","lines":21,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui_extras/src/loaders/webp_loader.rs#L29-L49"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`ShaderVersion::parse` contains several `unwrap()`s that panic on malformed driver version strings. `glsl_ver.find(|c| char::is_ascii_digit(&c)).unwrap()` panics if the version string contains no digit at all, and the final `.try_into().unwrap()` panics if the collected `Vec<u8>` does not have exactly 2 elements (it can have length 1 when the version string has a digit but no `.`, e.g. `\"3\"`, since `splitn(3,'.').take(2)` yields a single element). A driver returning an unusual `SHADING_LANGUAGE_VERSION` string would crash egui_glow at startup rather than falling back to a default.","fix":"Handle the no-digit case by returning a sane default (e.g. `Gl120`) instead of unwrapping `find`, and build `[maj, min]` without `try_into().unwrap()` (pad missing components with 0).","locations":[{"ref":"crates/egui_glow/src/shader_version.rs:33-45","code":"   33 |     pub(crate) fn parse(glsl_ver: &str) -> Self {\n   34 |         let start = glsl_ver.find(|c| char::is_ascii_digit(&c)).unwrap();\n   35 |         let es = glsl_ver[..start].contains(\" ES \");\n   36 |         let ver = glsl_ver[start..]\n   37 |             .split_once(' ')\n   38 |             .map_or(&glsl_ver[start..], |x| x.0);\n   39 |         let [maj, min]: [u8; 2] = ver\n   40 |             .splitn(3, '.')\n   41 |             .take(2)\n   42 |             .map(|x| x.parse().unwrap_or_default())\n   43 |             .collect::<Vec<u8>>()\n   44 |             .try_into()\n   45 |             .unwrap();","lines":13,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui_glow/src/shader_version.rs#L33-L45"}]},
{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"split_to_u16's inner loop guard only checks `index_cursor < self.indices.len()`, but the body then reads `self.indices[index_cursor + i]` for i in 0..3. If `indices.len()` is not a multiple of 3 (an invalid mesh that can still reach here, since the release build's `is_valid` debug_assert is compiled out), this indexes out of bounds and panics. The common-case fast path (vertices.len() <= 65535) hides this for small meshes, but a large mesh with a non-multiple-of-3 index count panics.","fix":"Guard with `index_cursor + 3 <= self.indices.len()` before reading the three indices, or assert `indices.len() % 3 == 0` at the top of split_to_u16.","locations":[{"ref":"crates/epaint/src/mesh.rs:265-271","code":"  265 |             while index_cursor < self.indices.len() {\n  266 |                 let (mut new_min, mut new_max) = (min_vindex, max_vindex);\n  267 |                 for i in 0..3 {\n  268 |                     let idx = self.indices[index_cursor + i];\n  269 |                     new_min = new_min.min(idx);\n  270 |                     new_max = new_max.max(idx);\n  271 |                 }","lines":7,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/epaint/src/mesh.rs#L265-L271"}]},
{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`ContextImpl::accesskit_node_builder` resolves an accesskit parent via the recursive helper `find_accesskit_parent`, which walks `parent_map` with no cycle detection. If `parent_map` ever contains a cycle (e.g. A's parent is B and B's parent is A, due to a misuse of `register_accesskit_parent`), this recurses infinitely and overflows the stack. Accesskit parent registration comes from user-influenced `UiBuilder::accessibility_parent`.","fix":"Add cycle/`depth` protection to `find_accesskit_parent` (e.g. bound the recursion depth or track visited ids) so a malformed parent map cannot cause unbounded recursion.","locations":[{"ref":"crates/egui/src/context.rs:618-640","code":"  618 |             /// Find the first ancestor that already has an accesskit node.\n  619 |             fn find_accesskit_parent(\n  620 |                 parent_map: &IdMap<Id>,\n  621 |                 node_map: &IdMap<accesskit::Node>,\n  622 |                 id: Id,\n  623 |             ) -> Option<Id> {\n  624 |                 if let Some(parent_id) = parent_map.get(&id) {\n  625 |                     if node_map.contains_key(parent_id) {\n  626 |                         Some(*parent_id)\n  627 |                     } else {\n  628 |                         find_accesskit_parent(parent_map, node_map, *parent_id)\n  629 |                     }\n  630 |                 } else {\n  631 |                     None\n  632 |                 }\n  633 |             }\n  634 | \n  635 |             let parent_id = find_accesskit_parent(&state.parent_map, builders, id)\n  636 |                 .unwrap_or_else(crate::accesskit_root_id);\n  637 | \n  638 |             let parent_builder = builders.get_mut(&parent_id)?;\n  639 |             parent_builder.push_child(id.accesskit_id());\n  640 |         }","lines":23,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/context.rs#L618-L640"}]},
{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`TextStyle::resolve` panics (via `unwrap_or_else(|| panic!(...))`) if the style is missing from `Style::text_styles`. Since user code can freely mutate `style.text_styles` (e.g. remove `Body`), a missing entry will crash the whole UI rather than degrading gracefully. `FontSelection::resolve` ultimately funnels through here for the default body style too.","fix":"Consider falling back to a sane default FontId (and logging a warning once) instead of panicking, so a misconfigured text_styles map cannot crash the app.","locations":[{"ref":"crates/egui/src/style.rs:112-121","code":"  112 |     pub fn resolve(&self, style: &Style) -> FontId {\n  113 |         style.text_styles.get(self).cloned().unwrap_or_else(|| {\n  114 |             panic!(\n  115 |                 \"Failed to find {:?} in Style::text_styles. Available styles:\\n{:#?}\",\n  116 |                 self,\n  117 |                 style.text_styles()\n  118 |             )\n  119 |         })\n  120 |     }\n  121 | }","lines":10,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/style.rs#L112-L121"}]},
{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`match self.degree` handles only 3 and 4, with `_ => unreachable!()`. `degree` is a serde-persisted `usize` (the struct derives Deserialize with serde(default)), so a corrupted or out-of-date persisted state with any other value reaches `unreachable!()` and panics on startup.","fix":"Clamp/validate `degree` to {3,4} when used (e.g. treat any non-3 value as 4), or replace `unreachable!()` with a graceful fallback that paints nothing.","locations":[{"ref":"crates/egui_demo_lib/src/demo/paint_bezier.rs:126-154","code":"  126 |         match self.degree {\n  127 |             3 => {\n  128 |                 let points = points_in_screen.clone().try_into().unwrap();\n  129 |                 let shape =\n  130 |                     QuadraticBezierShape::from_points_stroke(points, true, self.fill, self.stroke);\n  131 |                 painter.add(epaint::RectShape::stroke(\n  132 |                     shape.visual_bounding_rect(),\n  133 |                     0.0,\n  134 |                     self.bounding_box_stroke,\n  135 |                     StrokeKind::Outside,\n  136 |                 ));\n  137 |                 painter.add(shape);\n  138 |             }\n  139 |             4 => {\n  140 |                 let points = points_in_screen.clone().try_into().unwrap();\n  141 |                 let shape =\n  142 |                     CubicBezierShape::from_points_stroke(points, true, self.fill, self.stroke);\n  143 |                 painter.add(epaint::RectShape::stroke(\n  144 |                     shape.visual_bounding_rect(),\n  145 |                     0.0,\n  146 |                     self.bounding_box_stroke,\n  147 |                     StrokeKind::Outside,\n  148 |                 ));\n  149 |                 painter.add(shape);\n  150 |             }\n  151 |             _ => {\n  152 |                 unreachable!();\n  153 |             }\n  154 |         }","lines":29,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui_demo_lib/src/demo/paint_bezier.rs#L126-L154"}]},
{"id":"PANIC_14","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"The datepicker year/month arrows mutate `popup_state.year` with no bounds, and `last_day_of_month`/`month_data`/the Save handler call `Date::new(year, month, ...).expect(...)`. jiff's `Date` only supports years in `-9999..=9999`; holding the `<<<`/`>>>` (year) arrows past that range makes `Date::new` return `Err` and the `expect` panics. Likewise `month_data` uses `start.yesterday().unwrap()`/`tomorrow().unwrap()` which panic at the min/max representable date.","fix":"Clamp `popup_state.year` to jiff's supported range (e.g. `-9999..=9999`) after each arrow, and handle the `Date::new` result instead of unwrapping.","locations":[{"ref":"crates/egui_extras/src/datepicker/popup.rs:19-25","code":"   19 | impl DatePickerPopupState {\n   20 |     fn last_day_of_month(&self) -> i8 {\n   21 |         Date::new(self.year, self.month, 1)\n   22 |             .expect(\"Could not create Date\")\n   23 |             .days_in_month()\n   24 |     }\n   25 | }","lines":7,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui_extras/src/datepicker/popup.rs#L19-L25"},{"ref":"crates/egui_extras/src/datepicker/popup.rs:186-191","code":"  186 |                                         popup_state.year -= 1;\n  187 |                                         popup_state.day =\n  188 |                                             popup_state.day.min(popup_state.last_day_of_month());\n  189 |                                         ui.data_mut(|data| {\n  190 |                                             data.insert_persisted(id, popup_state.clone());\n  191 |                                         });","lines":6,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui_extras/src/datepicker/popup.rs#L186-L191"}]},
{"id":"PANIC_15","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`WgpuTestRenderer::render` rounds the content size to `u32` pixels and unconditionally creates a render-target texture of that size. If the harness content rect is empty (zero width or height, e.g. an empty UI or a degenerate `with_size`), `screen.size_in_pixels` becomes `[0, 0]` and `create_texture` will panic / validation-error in wgpu (textures must have non-zero extent). A test author with an empty UI hits an opaque GPU panic instead of a clear error.","fix":"Clamp `size_in_pixels` to a minimum of 1 in each dimension (e.g. `.max(1)`), or return a `RenderError` describing the empty render area.","locations":[{"ref":"crates/egui_kittest/src/wgpu.rs:175-207","code":"  175 |         let size = ctx.content_rect().size() * ctx.pixels_per_point();\n  176 |         let screen = ScreenDescriptor {\n  177 |             pixels_per_point: ctx.pixels_per_point(),\n  178 |             size_in_pixels: [size.x.round() as u32, size.y.round() as u32],\n  179 |         };\n  180 | \n  181 |         let tessellated = ctx.tessellate(output.shapes.clone(), ctx.pixels_per_point());\n  182 | \n  183 |         let user_buffers = renderer.update_buffers(\n  184 |             &self.render_state.device,\n  185 |             &self.render_state.queue,\n  186 |             &mut encoder,\n  187 |             &tessellated,\n  188 |             &screen,\n  189 |         );\n  190 | \n  191 |         let texture = self\n  192 |             .render_state\n  193 |             .device\n  194 |             .create_texture(&wgpu::TextureDescriptor {\n  195 |                 label: Some(\"Egui Texture\"),\n  196 |                 size: wgpu::Extent3d {\n  197 |                     width: screen.size_in_pixels[0],\n  198 |                     height: screen.size_in_pixels[1],\n  199 |                     depth_or_array_layers: 1,\n  200 |                 },\n  201 |                 mip_level_count: 1,\n  202 |                 sample_count: 1,\n  203 |                 dimension: wgpu::TextureDimension::D2,\n  204 |                 format: self.render_state.target_format,\n  205 |                 usage: wgpu::TextureUsages::RENDER_ATTACHMENT | wgpu::TextureUsages::COPY_SRC,\n  206 |                 view_formats: &[],\n  207 |             });","lines":33,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui_kittest/src/wgpu.rs#L175-L207"}]},
{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"`DefaultTextureLoader::end_pass` only evicts stale entries from a bucket when `2 <= bucket.len()`. A `PrimaryKey` whose bucket holds exactly one entry is never evicted by age, regardless of how many passes elapse since `last_used`. The single-entry case is the common one for normal (non-SVG) images, so any image/URI shown once stays in the GPU texture cache for the rest of the session unless an explicit `forget`/`forget_all` is called. Apps that cycle through many distinct image URIs (galleries, avatar lists) grow the texture cache unbounded.","fix":"Evict any entry whose `texture.last_used + N < *pass_index` regardless of bucket length (with a generous N or configurable policy), then drop empty buckets.","locations":[{"ref":"crates/egui/src/load/texture_loader.rs:119-135","code":"  119 |     fn end_pass(&self, pass_index: u64) {\n  120 |         let mut state = self.state.lock();\n  121 |         state.pass_index = pass_index;\n  122 | \n  123 |         let State { pass_index, cache } = &mut *state;\n  124 | \n  125 |         cache.retain(|_key, bucket| {\n  126 |             if 2 <= bucket.len() {\n  127 |                 // There are multiple textures of the same URI (e.g. SVGs of different scales).\n  128 |                 // This could be because someone has an SVG in a resizable container,\n  129 |                 // and so we get a lot of different sizes of it.\n  130 |                 // This could wast VRAM, so we remove the ones that are not used in this frame.\n  131 |                 bucket.retain(|_, texture| *pass_index <= texture.last_used + 1);\n  132 |             }\n  133 |             !bucket.is_empty()\n  134 |         });\n  135 |     }","lines":17,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/load/texture_loader.rs#L119-L135"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"In `tint_color_towards`, for very low non-zero alpha values the divisor `(2 * 255 / a as i32) as u8` overflows `u8`. For `a == 1` the i32 value is `510`, which truncates to `254` when cast to `u8` (not a panic, but a silently wrong tint divisor). The intermediate computation should not be narrowed to `u8` before use, since `2 * 255 / a` can exceed 255 for `a < 3`.","fix":"Keep the divisor as `i32` (or `u32`) for the division: e.g. `let div = (2 * 255 / a as i32).max(1); r = r / 2 + (target.r() as i32 / div) as u8;` Avoid casting the divisor to `u8`.","locations":[{"ref":"crates/ecolor/src/lib.rs:192-199","code":"  192 |     } else if a < 170 {\n  193 |         // Cheapish and looks ok.\n  194 |         // Works for e.g. grid stripes.\n  195 |         let div = (2 * 255 / a as i32) as u8;\n  196 |         r = r / 2 + target.r() / div;\n  197 |         g = g / 2 + target.g() / div;\n  198 |         b = b / 2 + target.b() / div;\n  199 |         a /= 2;","lines":8,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/ecolor/src/lib.rs#L192-L199"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`load_svg_bytes_with_size` divides by `source_size.x` / `source_size.y` when computing the scaled size. An SVG that reports a zero width or height produces inf/NaN, which becomes `0` or a garbage `u32` after `as u32`. The subsequent `Pixmap::new(w, h)` returns `None` and the error is surfaced, so it does not crash, but the error message (`Failed to create SVG Pixmap of size 0x0`) is misleading and the NaN path is fragile.","fix":"Early-return a clear error when `source_size.x == 0.0 || source_size.y == 0.0` before doing the divisions.","locations":[{"ref":"crates/egui_extras/src/image.rs:91-120","code":"   91 |     let source_size = Vec2::new(rtree.size().width(), rtree.size().height());\n   92 | \n   93 |     let scaled_size = match size_hint {\n   94 |         SizeHint::Size {\n   95 |             width,\n   96 |             height,\n   97 |             maintain_aspect_ratio,\n   98 |         } => {\n   99 |             if maintain_aspect_ratio {\n  100 |                 // As large as possible, without exceeding the given size:\n  101 |                 let mut size = source_size;\n  102 |                 size *= width as f32 / source_size.x;\n  103 |                 if size.y > height as f32 {\n  104 |                     size *= height as f32 / size.y;\n  105 |                 }\n  106 |                 size\n  107 |             } else {\n  108 |                 Vec2::new(width as _, height as _)\n  109 |             }\n  110 |         }\n  111 |         SizeHint::Height(h) => source_size * (h as f32 / source_size.y),\n  112 |         SizeHint::Width(w) => source_size * (w as f32 / source_size.x),\n  113 |         SizeHint::Scale(scale) => scale.into_inner() * source_size,\n  114 |     };\n  115 | \n  116 |     let scaled_size = scaled_size.round();\n  117 |     let (w, h) = (scaled_size.x as u32, scaled_size.y as u32);\n  118 | \n  119 |     let mut pixmap =\n  120 |         Pixmap::new(w, h).ok_or_else(|| format!(\"Failed to create SVG Pixmap of size {w}x{h}\"))?;","lines":30,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui_extras/src/image.rs#L91-L120"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"Margin's From<f32> and From<Vec2> do `v.round() as _` into i8 with no range check. A margin of e.g. 200.0 silently saturates (f32->i8 `as` saturates) to 127, and large negatives to -128, losing the intended value with no warning - surprising for a public conversion.","fix":"Document the i8 clamping, or debug_assert the value fits in i8 before casting.","locations":[{"ref":"crates/epaint/src/margin.rs:108-120","code":"  108 | impl From<f32> for Margin {\n  109 |     #[inline]\n  110 |     fn from(v: f32) -> Self {\n  111 |         Self::same(v.round() as _)\n  112 |     }\n  113 | }\n  114 | \n  115 | impl From<Vec2> for Margin {\n  116 |     #[inline]\n  117 |     fn from(v: Vec2) -> Self {\n  118 |         Self::symmetric(v.x.round() as _, v.y.round() as _)\n  119 |     }\n  120 | }","lines":13,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/epaint/src/margin.rs#L108-L120"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"split_to_u16 computes `new_span_size = new_max - new_min + 1` in u32. For a maliciously crafted/huge index range where `new_max - new_min == u32::MAX`, the `+ 1` wraps to 0, which passes the `<= MAX_SIZE` check, so an impossibly large span is wrongly accepted and the later `vertices[min..=max]` slice panics or mis-slices.","fix":"Compute the span in u64: `(new_max - new_min) as u64 + 1` and compare against `MAX_SIZE as u64`.","locations":[{"ref":"crates/epaint/src/mesh.rs:273-274","code":"  273 |                 let new_span_size = new_max - new_min + 1; // plus one, because it is an inclusive range\n  274 |                 if new_span_size <= MAX_SIZE {","lines":2,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/epaint/src/mesh.rs#L273-L274"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"A rasterized glyph's pixel extent (from kurbo f64 bounds.width()/height()) is cast to u16. At very large font sizes a glyph extent can exceed 65535 and silently truncate to a small/garbage value. The atlas `allocate` assert checks the already-truncated value, so it never catches the overflow and the glyph renders at the wrong size.","fix":"Clamp width/height to the atlas size before casting, or keep them as usize and only cast the final atlas-bounded coordinates.","locations":[{"ref":"crates/epaint/src/text/font_face.rs:149-150","code":"  149 |         let width = bounds.width() as u16;\n  150 |         let height = bounds.height() as u16;","lines":2,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/epaint/src/text/font_face.rs#L149-L150"}]},
{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`max_rows_remaining -= galley.rows.len()` can underflow (debug panic / release wrap) if a paragraph layout ever returns more rows than the remaining budget. It relies entirely on the layout invariant that a job laid out with `max_rows = max_rows_remaining` never returns more than that many rows; any off-by-one there becomes a crash here.","fix":"Use `max_rows_remaining = max_rows_remaining.saturating_sub(galley.rows.len());`.","locations":[{"ref":"crates/epaint/src/text/galley_cache.rs:229-231","code":"  229 |             if max_rows_remaining != usize::MAX {\n  230 |                 max_rows_remaining -= galley.rows.len();\n  231 |             }","lines":3,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/epaint/src/text/galley_cache.rs#L229-L231"}]},
{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"resize_to_min_height doubles `image.size[1]` with no upper bound. A degenerate/huge `required_height` can overflow usize or attempt an enormous allocation before any guard. The `allocate` caller checks max_height before calling, but this helper is unguarded on its own.","fix":"Use checked/saturating doubling and assert `required_height` is within a sane bound.","locations":[{"ref":"crates/epaint/src/texture_atlas.rs:266-269","code":"  266 | fn resize_to_min_height(image: &mut ColorImage, required_height: usize) -> bool {\n  267 |     while required_height >= image.height() {\n  268 |         image.size[1] *= 2; // double the height\n  269 |     }","lines":4,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/epaint/src/texture_atlas.rs#L266-L269"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`sin_in` is mathematically wrong. The canonical AHEasing reference is `sin((p - 1) * PI/2) + 1`, which gives a quarter-sine ease-in. The code uses `((t - 1.0) * 2.0 * PI).sin() + 1.0`, a full sine cycle, so the curve oscillates wildly between 0 and 2 instead of being a monotone ease-in from 0 to 1 (e.g. `sin_in(0.75) = sin(-PI/2)+1 = 0`, should be ~0.62).","fix":"Use the half-pi factor: `((t - 1.0) * 0.5 * PI).sin() + 1.0`.","locations":[{"ref":"crates/emath/src/easing.rs:78-81","code":"   78 | #[inline]\n   79 | pub fn sin_in(t: f32) -> f32 {\n   80 |     ((t - 1.) * 2. * PI).sin() + 1.\n   81 | }","lines":4,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/emath/src/easing.rs#L78-L81"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`sin_out` is mathematically wrong. The doc-comment says it models a quarter sine wave, and the canonical AHEasing reference (cited in the module header) is `sin(p * PI/2)`, which must satisfy `f(0)=0, f(1)=1`. The code uses `(t * 2.0 * PI).sin()`, a full sine cycle, so `sin_out(1.0) = sin(2*PI) = 0.0` instead of `1.0`, and `sin_out(0.25) = sin(PI/2) = 1.0` instead of ~0.38. The easing curve is completely broken (it oscillates and ends at 0).","fix":"Use the half-pi factor: `(t * 0.5 * PI).sin()` (i.e. `std::f32::consts::FRAC_PI_2 * t`).","locations":[{"ref":"crates/emath/src/easing.rs:86-89","code":"   86 | #[inline]\n   87 | pub fn sin_out(t: f32) -> f32 {\n   88 |     (t * 2. * PI).sin()\n   89 | }","lines":4,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/emath/src/easing.rs#L86-L89"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`circular_out` computes the wrong formula. The canonical AHEasing reference is `CircularEaseOut(p) = sqrt((2 - p) * p)`, but the code computes `(2.0 - t).sqrt() * t`, i.e. `sqrt(2-t) * t` instead of `sqrt((2-t) * t)`. Endpoints happen to match (0 and 1) but intermediate values are wrong, e.g. `circular_out(0.5)` yields ~0.612 instead of the correct ~0.866.","fix":"Multiply inside the sqrt: `((2.0 - t) * t).sqrt()`.","locations":[{"ref":"crates/emath/src/easing.rs:110-113","code":"  110 | #[inline]\n  111 | pub fn circular_out(t: f32) -> f32 {\n  112 |     (2. - t).sqrt() * t\n  113 | }","lines":4,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/emath/src/easing.rs#L110-L113"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`Order::allow_interaction` is a `match` over all five variants that unconditionally returns `true`, so the method is dead logic that can never return `false`. Worse, it contradicts the documentation of `Order::Tooltip` (\"You cannot interact with these\"): tooltips are treated as interactable. Either the method or the doc is wrong, and a reader cannot tell which behavior was intended.","fix":"Decide the real semantics: if tooltips should not be interactable, return `false` for `Self::Tooltip` (and `Self::Debug` per its doc); otherwise simplify to `true` and fix the `Tooltip` doc comment.","locations":[{"ref":"crates/egui/src/layers.rs:40-47","code":"   40 |     #[inline(always)]\n   41 |     pub fn allow_interaction(&self) -> bool {\n   42 |         match self {\n   43 |             Self::Background | Self::Middle | Self::Foreground | Self::Tooltip | Self::Debug => {\n   44 |                 true\n   45 |             }\n   46 |         }\n   47 |     }","lines":8,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/layers.rs#L40-L47"},{"ref":"crates/egui/src/layers.rs:21-23","code":"   21 |     /// Things floating on top of everything else, like tooltips.\n   22 |     /// You cannot interact with these.\n   23 |     Tooltip,","lines":3,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/layers.rs#L21-L23"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`Anchor::all()` omits the `ImageViewer` variant, even though `ImageViewer` is a valid anchor (gated on the same `image_viewer` feature) and is shown in `apps_iter_mut`. On the web build, `from_str_case_insensitive` is built from `all()`, so the URL hash `#imageviewer` will never be recognized and deep-linking / restoring the Image Viewer tab from the URL silently fails.","fix":"Add `#[cfg(feature = \"image_viewer\")] Self::ImageViewer,` to the vec returned by `Anchor::all()`, matching the other feature-gated variants.","locations":[{"ref":"crates/egui_demo_app/src/wrap_app.rs:110-121","code":"  110 |     fn all() -> Vec<Self> {\n  111 |         vec![\n  112 |             Self::Demo,\n  113 |             Self::EasyMarkEditor,\n  114 |             #[cfg(feature = \"http\")]\n  115 |             Self::Http,\n  116 |             Self::Clock,\n  117 |             #[cfg(any(feature = \"glow\", feature = \"wgpu\"))]\n  118 |             Self::Custom3d,\n  119 |             Self::Rendering,\n  120 |         ]\n  121 |     }","lines":12,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui_demo_app/src/wrap_app.rs#L110-L121"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`TSTransform::is_valid` only checks `translation.x.is_finite()` and never checks `translation.y`. A transform with a NaN/infinite y translation will be reported as valid, defeating the purpose of the check and potentially propagating non-finite coordinates downstream.","fix":"Also check the y component: `self.scaling.is_finite() && self.translation.is_finite() && self.scaling != 0.0` (Vec2 already has `is_finite`).","locations":[{"ref":"crates/emath/src/ts_transform.rs:55-57","code":"   55 |     pub fn is_valid(&self) -> bool {\n   56 |         self.scaling.is_finite() && self.translation.x.is_finite() && self.scaling != 0.0\n   57 |     }","lines":3,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/emath/src/ts_transform.rs#L55-L57"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"ColorImage::region casts region coordinates to usize via `as usize` and only asserts `min_x <= max_x && min_y <= max_y`. The doc comment explicitly claims it 'Panics ... if a region larger than the image is passed', but there is no bounds check against `self.size`: if `max_x > width` or `max_y > height`, the slice `pixels[row*stride+min_x .. row*stride+max_x]` silently reads into the following row (wrong pixels) or panics with an opaque slice-index error rather than the documented assertion. NaN/inf coords cast to 0/usize::MAX silently.","fix":"Add `assert!(max_x <= self.size[0] && max_y <= self.size[1], ...)` (matching the documented behavior) and reject non-finite region coordinates.","locations":[{"ref":"crates/epaint/src/image.rs:249-268","code":"  249 |     pub fn region(&self, region: &emath::Rect, pixels_per_point: Option<f32>) -> Self {\n  250 |         let pixels_per_point = pixels_per_point.unwrap_or(1.0);\n  251 |         let min_x = (region.min.x * pixels_per_point) as usize;\n  252 |         let max_x = (region.max.x * pixels_per_point) as usize;\n  253 |         let min_y = (region.min.y * pixels_per_point) as usize;\n  254 |         let max_y = (region.max.y * pixels_per_point) as usize;\n  255 |         assert!(\n  256 |             min_x <= max_x && min_y <= max_y,\n  257 |             \"Screenshot region is invalid: {region:?}\"\n  258 |         );\n  259 |         let width = max_x - min_x;\n  260 |         let height = max_y - min_y;\n  261 |         let mut output = Vec::with_capacity(width * height);\n  262 |         let row_stride = self.size[0];\n  263 | \n  264 |         for row in min_y..max_y {\n  265 |             output.extend_from_slice(\n  266 |                 &self.pixels[row * row_stride + min_x..row * row_stride + max_x],\n  267 |             );\n  268 |         }","lines":20,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/epaint/src/image.rs#L249-L268"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"Mesh::clear is documented as 'Restore to default state, but without freeing memory', and clears indices/vertices to keep their capacity. But the next line reassigns `self.vertices = Default::default()`, which drops the just-cleared vertex Vec and frees its capacity, defeating the stated purpose and creating an asymmetry: indices keep capacity, vertices do not. This forces a reallocation of the vertex buffer on the next fill, a per-frame cost in the tessellation hot path.","fix":"Remove the `self.vertices = Default::default();` line so both vectors retain their capacity, matching the doc comment.","locations":[{"ref":"crates/epaint/src/mesh.rs:85-89","code":"   85 |     pub fn clear(&mut self) {\n   86 |         self.indices.clear();\n   87 |         self.vertices.clear();\n   88 |         self.vertices = Default::default();\n   89 |     }","lines":5,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/epaint/src/mesh.rs#L85-L89"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The default cubic/quadratic bezier flattening tolerance is derived only from the X distance between the curve endpoints, ignoring Y. A vertical/near-vertical curve (points[0].x == last.x) gets tolerance ~0.0, forcing pathologically fine flattening: num_quadratics = (err/(432*tol^2))^(1/6) explodes and is cast `as u32` (saturating up to ~4 billion), driving the flatten loop into an effective hang. A tall, narrow curve likewise gets a tolerance far too small for its true extent.","fix":"Base the default tolerance on the full chord length, e.g. `(points[0]-points[last]).length()*0.001`, clamped to a small positive minimum so a zero-length chord cannot produce tolerance 0.0.","locations":[{"ref":"crates/epaint/src/shapes/bezier_shape.rs:298-299","code":"  298 |         let tolerance =\n  299 |             tolerance.unwrap_or_else(|| (self.points[0].x - self.points[3].x).abs() * 0.001);","lines":2,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/epaint/src/shapes/bezier_shape.rs#L298-L299"},{"ref":"crates/epaint/src/shapes/bezier_shape.rs:314-315","code":"  314 |         let tolerance =\n  315 |             tolerance.unwrap_or_else(|| (self.points[0].x - self.points[3].x).abs() * 0.001);","lines":2,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/epaint/src/shapes/bezier_shape.rs#L314-L315"},{"ref":"crates/epaint/src/shapes/bezier_shape.rs:521-522","code":"  521 |         let tolerance =\n  522 |             tolerance.unwrap_or_else(|| (self.points[0].x - self.points[2].x).abs() * 0.001);","lines":2,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/epaint/src/shapes/bezier_shape.rs#L521-L522"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`ViewportState::set_visible_recursive` takes a `visible: bool` parameter and sets `self.visible = visible`, but the recursive call to children hard-codes `true` instead of forwarding `visible`. Calling it with `false` would set the parent invisible while leaving children visible. It happens to work today only because the single call site always passes `true`, making the parameter misleading and the recursion buggy.","fix":"Forward the argument: `child.write().set_visible_recursive(visible);`.","locations":[{"ref":"tests/test_viewports/src/main.rs:106-111","code":"  106 |     pub fn set_visible_recursive(&mut self, visible: bool) {\n  107 |         self.visible = visible;\n  108 |         for child in &self.children {\n  109 |             child.write().set_visible_recursive(true);\n  110 |         }\n  111 |     }","lines":6,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/tests/test_viewports/src/main.rs#L106-L111"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In the wgpu `WebPainterWgpu::paint_and_update_textures`, when `get_current_texture()` returns `Suboptimal`, the code sets `needs_reconfigure = true` and proceeds to render into the suboptimal frame this same pass; `needs_reconfigure` is only consumed at the top of the next paint and only inside the non-zero-sized branch. If the surface stays at a zero size (canvas collapsed) the reconfigure never happens; more importantly, the reconfigure-on-next-frame requires another paint to be scheduled, but the `Suboptimal` arm does not call `request_repaint`, unlike the `RecreateSurface` arm. A surface that is permanently suboptimal but no longer animating may never reconfigure.","fix":"When marking `needs_reconfigure = true` for a suboptimal frame, also call `self.ctx.request_repaint()` so a follow-up paint is guaranteed to consume the flag, mirroring the `RecreateSurface` handling.","locations":[{"ref":"crates/eframe/src/web/web_painter_wgpu.rs:244-274","code":"  244 |             if self.needs_reconfigure {\n  245 |                 self.surface\n  246 |                     .configure(&render_state.device, &self.surface_configuration);\n  247 |                 self.needs_reconfigure = false;\n  248 |             }\n  249 | \n  250 |             let output_frame = match self.surface.get_current_texture() {\n  251 |                 wgpu::CurrentSurfaceTexture::Success(frame) => frame,\n  252 |                 wgpu::CurrentSurfaceTexture::Suboptimal(frame) => {\n  253 |                     self.needs_reconfigure = true;\n  254 |                     frame\n  255 |                 }\n  256 |                 other => {\n  257 |                     match (*self.on_surface_status)(&other) {\n  258 |                         SurfaceErrorAction::Reconfigure => {\n  259 |                             self.surface\n  260 |                                 .configure(&render_state.device, &self.surface_configuration);\n  261 |                         }\n  262 |                         SurfaceErrorAction::RecreateSurface => {\n  263 |                             // Full recovery needs `&mut self`, which conflicts with the live\n  264 |                             // `render_state` / `self.surface` borrows here. Defer to the top\n  265 |                             // of the next paint via the `needs_recreate` flag, and request a\n  266 |                             // repaint so the next frame actually invokes `paint` to consume it.\n  267 |                             self.needs_recreate = true;\n  268 |                             self.ctx.request_repaint();\n  269 |                         }\n  270 |                         SurfaceErrorAction::SkipFrame => {}\n  271 |                     }\n  272 |                     return Ok(());\n  273 |                 }\n  274 |             };","lines":31,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/eframe/src/web/web_painter_wgpu.rs#L244-L274"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `Atom::into_sized`, the wrap_mode computed at line 112-113 (set to `Extend` when not shrink and max width is infinite) is unconditionally overwritten to `Truncate` at line 119-121 whenever `max_size.x` is finite. The two branches use the same `is_infinite`/`is_finite` discriminant on the same value, so the first assignment is only meaningful in the infinite case and the second only in the finite case; written as two sequential `if`s this is confusing and the intermediate state is dead. More importantly, a caller-provided `wrap_mode` is silently discarded for any atom with a finite max width, even Wrap.","fix":"Combine into a single if/else on `max_size.x.is_finite()` and only override `wrap_mode` when it was `None`/unset, so an explicit Wrap request from the caller is honored: `if wrap_mode.is_none() { wrap_mode = Some(if finite { Truncate } else { Extend }); }`.","locations":[{"ref":"crates/egui/src/atomics/atom.rs:150-159","code":"  150 |         if !self.shrink && self.max_size.x.is_infinite() {\n  151 |             wrap_mode = Some(TextWrapMode::Extend);\n  152 |         }\n  153 |         available_size = available_size.at_most(self.max_size);\n  154 |         if let Some(size) = self.size {\n  155 |             available_size = available_size.at_most(size);\n  156 |         }\n  157 |         if self.max_size.x.is_finite() {\n  158 |             wrap_mode = Some(TextWrapMode::Truncate);\n  159 |         }","lines":10,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/atomics/atom.rs#L150-L159"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`DragAndDrop::on_end_pass` only sets the `Grabbing` cursor when the current cursor is `CursorIcon::Default`. Because this runs at end-of-pass and inspects `output.cursor_icon`, any widget that legitimately set the cursor to `Default` explicitly this frame (which is indistinguishable from \"unset\") will get overridden to `Grabbing` while a payload is held. The heuristic conflates \"user did not set a cursor\" with \"user set Default\".","fix":"Track whether the cursor was explicitly set this frame (e.g. an `Option<CursorIcon>` in output, or a per-frame dirty flag) rather than comparing against `CursorIcon::Default`.","locations":[{"ref":"crates/egui/src/drag_and_drop.rs:63-69","code":"   63 |                 // We set the cursor icon only if its default, as the user code might have\n   64 |                 // explicitly set it already.\n   65 |                 ui.output_mut(|o| {\n   66 |                     if o.cursor_icon == CursorIcon::Default {\n   67 |                         o.cursor_icon = CursorIcon::Grabbing;\n   68 |                     }\n   69 |                 });","lines":7,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/drag_and_drop.rs#L63-L69"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`GridLayout::new` debug-asserts `initial_available.min.x.is_finite()` with the message \"Grid not yet available for right-to-left layouts\", but the grid is always created inside `Grid::show_dyn` via `ui.horizontal(...)` which is left-to-right (or right-to-left if `prefer_right_to_left`). In a right-to-left context this assert will fire in debug builds, i.e. grids silently misbehave / crash-on-assert rather than being explicitly unsupported at the API level.","fix":"Either properly support RTL grids, or document the limitation and degrade gracefully (force LTR for the grid's inner Ui) instead of relying on a debug_assert that only triggers in debug builds.","locations":[{"ref":"crates/egui/src/grid.rs:106-112","code":"  106 |         let initial_available = ui.placer().max_rect().intersect(ui.cursor());\n  107 |         debug_assert!(\n  108 |             initial_available.min.x.is_finite(),\n  109 |             \"Grid not yet available for right-to-left layouts\"\n  110 |         );\n  111 | \n  112 |         ui.ctx().check_for_id_clash(id, initial_available, \"Grid\");","lines":7,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/grid.rs#L106-L112"},{"ref":"crates/egui/src/grid.rs:475-476","code":"  475 |         ui.scope_builder(ui_builder, |ui| {\n  476 |             ui.horizontal(|ui| {","lines":2,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/grid.rs#L475-L476"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"MultiTouchInfo divides by `avg_distance` / `avg_abs_distance2` without guarding against zero. `avg_distance` is the mean distance of touches from their centroid; if two or more fingers report identical positions (reachable from raw device input), the denominator is 0.0 and `zoom_delta` becomes `inf` or `NaN` (0/0). The 2D variants have the same issue. A NaN/inf zoom factor then propagates into transforms and can corrupt downstream layout/painting.","fix":"Guard each division: `let zoom_delta = if state_previous.avg_distance > 0.0 { state.current.avg_distance / state_previous.avg_distance } else { 1.0 };` and likewise return 1.0 for the 2D components when the previous abs-distance is 0.0.","locations":[{"ref":"crates/egui/src/input_state/touch_state.rs:196-208","code":"  196 |             let zoom_delta = state.current.avg_distance / state_previous.avg_distance;\n  197 | \n  198 |             let zoom_delta_2d = match state.pinch_type {\n  199 |                 PinchType::Horizontal => Vec2::new(\n  200 |                     state.current.avg_abs_distance2.x / state_previous.avg_abs_distance2.x,\n  201 |                     1.0,\n  202 |                 ),\n  203 |                 PinchType::Vertical => Vec2::new(\n  204 |                     1.0,\n  205 |                     state.current.avg_abs_distance2.y / state_previous.avg_abs_distance2.y,\n  206 |                 ),\n  207 |                 PinchType::Proportional => Vec2::splat(zoom_delta),\n  208 |             };","lines":13,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/input_state/touch_state.rs#L196-L208"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`ViewportCommand::requires_parent_repaint` returns true only for `Self::Close`. Other commands that affect the parent's view of a child viewport are not flagged, but more importantly the method's narrow definition is easy to silently break: adding a new parent-affecting command will not be caught, and there is no test asserting the set. This is fragile coupling between command semantics and repaint scheduling in `send_viewport_cmd_to`.","fix":"Document precisely why only `Close` requires a parent repaint, and add a test (or exhaustive `match`) so new variants force a deliberate decision.","locations":[{"ref":"crates/egui/src/viewport.rs:1234-1238","code":" 1234 |     /// This command requires the parent viewport to repaint.\n 1235 |     pub fn requires_parent_repaint(&self) -> bool {\n 1236 |         self == &Self::Close\n 1237 |     }\n 1238 | }","lines":5,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/viewport.rs#L1234-L1238"},{"ref":"crates/egui/src/context.rs:4214-4222","code":" 4214 |     pub fn send_viewport_cmd_to(&self, id: ViewportId, command: ViewportCommand) {\n 4215 |         self.request_repaint_of(id);\n 4216 | \n 4217 |         if command.requires_parent_repaint() {\n 4218 |             self.request_repaint_of(self.parent_viewport_id());\n 4219 |         }\n 4220 | \n 4221 |         self.write(|ctx| ctx.viewport_for(id).commands.push(command));\n 4222 |     }","lines":9,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/context.rs#L4214-L4222"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`color_slider_2d` doc comment claims \"bottom-right: black `[s: 0.0, v: 1.0]`\" but bottom-right of the 2D area corresponds to s=1.0 (or high s) and v=0.0 (black), i.e. `[s: 1.0, v: 0.0]`. The listed values `[s: 0.0, v: 1.0]` are the same as top-left and are wrong; this misleads anyone using the documented `color_at` convention.","fix":"Correct the comment to describe bottom-right as `[s: 1.0, v: 0.0]` (black at full saturation, zero value), matching the actual axis mapping where y maps bottom->top as v 0->1.","locations":[{"ref":"crates/egui/src/widgets/color_picker.rs:241-242","code":"  241 | /// * top-right: fully saturated color `[s: 1.0, v: 1.0]`\n  242 | /// * bottom-right: black `[s: 0.0, v: 1.0].`","lines":2,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/widgets/color_picker.rs#L241-L242"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `DragValue::ui`, the on-hover explanation tooltip formats the value as `value as f32` while the comment says \"Show full precision value on-hover\". Casting an f64 to f32 truncates precision, directly contradicting the stated intent (the TODO on the same line acknowledges this). For f64-backed DragValues this shows a lower-precision number on hover than the widget actually holds.","fix":"Format the f64 directly (e.g. `format!(\"{value}\")` or with a chosen precision) instead of casting to f32, or remove the misleading comment if the f32 cast is intentional.","locations":[{"ref":"crates/egui/src/widgets/drag_value.rs:673-678","code":"  673 |             if ui.style().explanation_tooltips {\n  674 |                 response = response.on_hover_text(format!(\n  675 |                     \"{}\\nDrag to edit or click to enter a value.\\nPress 'Shift' while dragging for better control.\",\n  676 |                     value as f32, // Show full precision value on-hover. TODO(emilk): figure out f64 vs f32\n  677 |                 ));\n  678 |             }","lines":6,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/widgets/drag_value.rs#L673-L678"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`decrease_indentation` (Shift+Tab) deletes `len` indentation chars at `line_start` and then does `if *ccursor != line_start { *ccursor -= len; }`. If the caret sits strictly inside the removed indent (e.g. 2 chars into a 4-char indent), it still subtracts the full `len`, moving the caret before the line start (onto the previous line's content). The CCursor subtraction saturates so no panic, but the caret lands in the wrong place.","fix":"Clamp the shift to the distance actually before the cursor: only when `ccursor.index > line_start.index`, subtract `len.min(ccursor.index - line_start.index)`.","locations":[{"ref":"crates/egui/src/widgets/text_edit/text_buffer.rs:113-118","code":"  113 |         if let Some(len) = remove_len {\n  114 |             self.delete_char_range(line_start.index..(line_start.index + len));\n  115 |             if *ccursor != line_start {\n  116 |                 *ccursor -= len;\n  117 |             }\n  118 |         }","lines":6,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui/src/widgets/text_edit/text_buffer.rs#L113-L118"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The sub-second field is computed as hundredths of a second (`time % 1.0 * 100.0`, range 0-99) but formatted with `{:03}` as if it were milliseconds. The label reads e.g. `12:00:00.012` for 0.12s elapsed instead of `.120`, making the fractional part misleading (it can never exceed 099). The analogous `clock_button` in wrap_app.rs correctly uses `{:02}` for the same hundredths value.","fix":"Either format with `{:02}` to match that it is hundredths, or compute milliseconds (`time % 1.0 * 1000.0`) and keep `{:03}`.","locations":[{"ref":"crates/egui_demo_app/src/apps/fractal_clock.rs:67-73","code":"   67 |             ui.label(format!(\n   68 |                 \"Local time: {:02}:{:02}:{:02}.{:03}\",\n   69 |                 (self.time % (24.0 * 60.0 * 60.0) / 3600.0).floor(),\n   70 |                 (self.time % (60.0 * 60.0) / 60.0).floor(),\n   71 |                 (self.time % 60.0).floor(),\n   72 |                 (self.time % 1.0 * 100.0).floor()\n   73 |             ));","lines":7,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui_demo_app/src/apps/fractal_clock.rs#L67-L73"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `Sizing::to_lengths`, the remainder-reservation loop subtracts each below-minimum remainder's `range.min` and decrements `num_remainders`, but it computes `avg_remainder_length` only once before the loop and compares every remainder against that single stale average. It never re-iterates after shrinking the pool, so when several remainders are below the minimum the final per-remainder length can still be below some of their minimums (the final `range.clamp` then over-allocates relative to `length`). This is an approximation that can mis-size columns when multiple `Remainder` columns have different `at_least` minimums.","fix":"Iterate to a fixed point (repeatedly recompute the average and remove newly-below-min remainders) instead of a single pass, or document the limitation.","locations":[{"ref":"crates/egui_extras/src/sizing.rs:141-159","code":"  141 |         let avg_remainder_length = if num_remainders == 0 {\n  142 |             0.0\n  143 |         } else {\n  144 |             let mut remainder_length = length - sum_non_remainder;\n  145 |             let avg_remainder_length = 0.0f32.max(remainder_length / num_remainders as f32).floor();\n  146 |             for &size in &self.sizes {\n  147 |                 if let Size::Remainder { range } = size\n  148 |                     && avg_remainder_length < range.min\n  149 |                 {\n  150 |                     remainder_length -= range.min;\n  151 |                     num_remainders -= 1;\n  152 |                 }\n  153 |             }\n  154 |             if num_remainders > 0 {\n  155 |                 0.0f32.max(remainder_length / num_remainders as f32)\n  156 |             } else {\n  157 |                 0.0\n  158 |             }\n  159 |         };","lines":19,"link":"https://github.com/emilk/egui/blob/7053d3917af714090c3f363764efde0744c19fcb/crates/egui_extras/src/sizing.rs#L141-L159"}]},
