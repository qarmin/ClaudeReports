<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"UAF_1","type":"use_after_free","type_label":"Use After Free","severity":"critical","difficulty":"hard","description":"`WasmWebPool::scoped_computation_impl` (`src/pool/pool_impl/wasm_web.rs:360-399`) stores the address of its stack-local `scope_runtime` into the single global `runtime().shared.state.active_scope_addr`, and worker threads recover this pointer purely from that shared global slot when they pop a `Task` in `worker_loop` (`state.active_scope_addr.expect(\"active scope must be set while queue is non-empty\")`, lines 217-221). Unlike `BasicPool`'s `Task` (`src/pool/pool_impl/basic.rs`), which carries its own `runtime: Arc<ScopeRuntime>` per task, `wasm_web.rs`'s `Task` (lines 161-165) carries no runtime reference at all - it is entirely dependent on whichever `ScopeRuntime` happens to be the *current* global `active_scope_addr` at the moment the task is popped. Because `runtime()` always returns the same process-wide `WASM_WEB3_RUNTIME` singleton regardless of which `WasmWebPool` value invoked it, and `ParThreadPool::scoped_computation` only requires `&mut self` (not `&mut` of some shared handle), two independent `WasmWebPool` instances used concurrently (e.g. from two different threads, or a reentrant/nested parallel call) can call `scoped_computation` at the same time. The invariant that only one scope may be active is enforced solely by `debug_assert!(state.active_scope_addr.is_none())` (line 370), which is compiled out in release builds. If violated, a task queued for scope A that is still pending when scope B becomes active will have its completion mis-attributed to scope B's `ScopeRuntime` (corrupting B's pending count and potentially letting B's `wait_for_completion` return before B's own real tasks finish, i.e. a use-after-free of data B's closures borrowed), while scope A's own `pending` counter for that task is never decremented, hanging scope A's `wait_for_completion` forever.","fix":"Give the wasm `Task` its own scope reference the way `basic.rs` does (e.g. an `Arc<ScopeRuntime>` or a raw pointer captured per-task rather than looked up from a shared mutable slot), so a task always completes against the runtime it was actually submitted for. Additionally, replace the `debug_assert!` guarding `active_scope_addr` with a real runtime check (e.g. an atomic compare-exchange \"in use\" flag) that returns an error or panics on reentrant/overlapping use instead of silently overwriting the pointer in release builds.","locations":[{"ref":"src/pools/pool_impl/wasm_web.rs:149-171","code":"  149 | pub struct ScopeRef<'env> {\n  150 |     shared: *const WorkerShared,\n  151 |     runtime: *const ScopeRuntime,\n  152 |     inline_only: bool,\n  153 |     _marker: PhantomData<&'env ()>,\n  154 | }\n  155 | \n  156 | impl<'env> ScopeRef<'env> {\n  157 |     fn shared(&self) -> &WorkerShared {\n  158 |         unsafe { &*self.shared }\n  159 |     }\n  160 | \n  161 |     fn runtime(&self) -> &ScopeRuntime {\n  162 |         unsafe { &*self.runtime }\n  163 |     }\n  164 | }\n  165 | \n  166 | #[cfg_attr(not(target_feature = \"atomics\"), allow(dead_code))]\n  167 | struct Task {\n  168 |     data: *mut (),\n  169 |     run_fn: unsafe fn(*mut ()),\n  170 |     drop_fn: unsafe fn(*mut ()),\n  171 | }","lines":23,"link":"https://github.com/orxfun/orx-parallel/blob/1dd65eb7addc8f7cc5028b51e5ffd9debb4b9405/src/pools/pool_impl/wasm_web.rs#L149-L171"},{"ref":"src/pools/pool_impl/wasm_web.rs:214-241","code":"  214 | fn worker_loop(shared: Arc<WorkerShared>) {\n  215 |     loop {\n  216 |         let (task, runtime_ptr) = {\n  217 |             let mut state = shared.state.lock().expect(\"poisoned pool lock\");\n  218 |             loop {\n  219 |                 if state.shutdown {\n  220 |                     return;\n  221 |                 }\n  222 | \n  223 |                 if let Some(task) = state.queue.pop_front() {\n  224 |                     let runtime_ptr = state\n  225 |                         .active_scope_addr\n  226 |                         .expect(\"active scope must be set while queue is non-empty\");\n  227 |                     break (task, runtime_ptr as *const ScopeRuntime);\n  228 |                 }\n  229 | \n  230 |                 state = shared.cv.wait(state).expect(\"poisoned pool lock\");\n  231 |             }\n  232 |         };\n  233 | \n  234 |         let runtime = unsafe { &*runtime_ptr };\n  235 |         let result = catch_unwind(AssertUnwindSafe(|| unsafe { task.run() }));\n  236 |         if let Err(err) = result {\n  237 |             runtime.record_panic(err);\n  238 |         }\n  239 |         runtime.complete_task();\n  240 |     }\n  241 | }","lines":28,"link":"https://github.com/orxfun/orx-parallel/blob/1dd65eb7addc8f7cc5028b51e5ffd9debb4b9405/src/pools/pool_impl/wasm_web.rs#L214-L241"}]},
{"id":"UAF_2","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"hard","description":"`MergeSubTask::execute` in `src/sort/sort_slice.rs` moves values between the `orig` slice and the `aux` `MaybeUninit<T>` buffer with raw `core::ptr::copy_nonoverlapping` calls, with no panic-safety guard. `T: Ord` only requires a `<`/`<=` comparison (used both in the fast-path checks and in the standard-merge loop at lines 98-110), and nothing prevents a user-supplied `Ord`/`PartialOrd` impl from panicking mid-comparison. If a panic occurs partway through the standard-merge loop (after some elements have already been bit-copied from `src_a`/`src_b` into `dst`, but before the rest), the source location for an already-copied element still holds a byte-identical stale duplicate of that value (since `copy_nonoverlapping` never invalidates/drops the source). Because merge passes ping-pong between `orig_ptr` and `aux_ptr` using the same address ranges pass after pass, a mid-merge panic leaves `orig_ptr[0..n]` with some slots holding fresh values and other slots still holding stale-but-live-looking duplicates of values that have already been relocated elsewhere for this pass. When the caller's slice/`Vec<T>` is eventually dropped (as part of unwinding or later normal use), Rust will run `T`'s destructor once per slot in `orig_ptr`, which can now double-drop a value whose duplicate byte pattern appears at two live-looking slots (double free / UB) while silently leaking another value that was overwritten early and never reached `orig_ptr` at all. The standard library's own merge sort avoids exactly this class of bug via drop guards (e.g. `MergeHole`); this implementation has none.","fix":"Add panic-safety to the merge: either wrap the destination writes in a drop guard that tracks how far the merge has progressed and, on unwind, forgets/patches up the `aux`/`orig` buffers to avoid double drops (mirroring `alloc::slice::merge`'s `MergeHole` pattern), or require `T: Ord` comparisons to be assumed panic-free only after wrapping calls to `<`/`<=` with `catch_unwind`-based abort-on-panic semantics so a partial state can never be observed. At minimum, document that `par_experimental_sort` is unsound for panicking `Ord` implementations, since it is gated behind the `experimental` feature.","locations":[{"ref":"src/sort/sort_slice.rs:50-121","code":"   50 | impl<T: Ord> MergeSubTask<T> {\n   51 |     #[inline]\n   52 |     fn execute(self) {\n   53 |         if self.len_a == 0 {\n   54 |             if self.len_b > 0 {\n   55 |                 unsafe {\n   56 |                     core::ptr::copy_nonoverlapping(self.src_b, self.dst, self.len_b);\n   57 |                 }\n   58 |             }\n   59 |             return;\n   60 |         }\n   61 |         if self.len_b == 0 {\n   62 |             unsafe {\n   63 |                 core::ptr::copy_nonoverlapping(self.src_a, self.dst, self.len_a);\n   64 |             }\n   65 |             return;\n   66 |         }\n   67 | \n   68 |         // Fast-path: if all elements of A <= all elements of B\n   69 |         let last_a = unsafe { &*self.src_a.add(self.len_a - 1) };\n   70 |         let first_b = unsafe { &*self.src_b };\n   71 |         if last_a <= first_b {\n   72 |             unsafe {\n   73 |                 core::ptr::copy_nonoverlapping(self.src_a, self.dst, self.len_a);\n   74 |                 core::ptr::copy_nonoverlapping(self.src_b, self.dst.add(self.len_a), self.len_b);\n   75 |             }\n   76 |             return;\n   77 |         }\n   78 | \n   79 |         // Fast-path: if all elements of B < all elements of A\n   80 |         let last_b = unsafe { &*self.src_b.add(self.len_b - 1) };\n   81 |         let first_a = unsafe { &*self.src_a };\n   82 |         if last_b < first_a {\n   83 |             unsafe {\n   84 |                 core::ptr::copy_nonoverlapping(self.src_b, self.dst, self.len_b);\n   85 |                 core::ptr::copy_nonoverlapping(self.src_a, self.dst.add(self.len_b), self.len_a);\n   86 |             }\n   87 |             return;\n   88 |         }\n   89 | \n   90 |         // Standard merge\n   91 |         unsafe {\n   92 |             let mut ptr_a = self.src_a;\n   93 |             let end_a = self.src_a.add(self.len_a);\n   94 |             let mut ptr_b = self.src_b;\n   95 |             let end_b = self.src_b.add(self.len_b);\n   96 |             let mut out = self.dst;\n   97 | \n   98 |             while ptr_a < end_a && ptr_b < end_b {\n   99 |                 match *ptr_b < *ptr_a {\n  100 |                     true => {\n  101 |                         core::ptr::copy_nonoverlapping(ptr_b, out, 1);\n  102 |                         ptr_b = ptr_b.add(1);\n  103 |                     }\n  104 |                     false => {\n  105 |                         core::ptr::copy_nonoverlapping(ptr_a, out, 1);\n  106 |                         ptr_a = ptr_a.add(1);\n  107 |                     }\n  108 |                 }\n  109 |                 out = out.add(1);\n  110 |             }\n  111 | \n  112 |             if ptr_a < end_a {\n  113 |                 let rem = end_a.offset_from(ptr_a) as usize;\n  114 |                 core::ptr::copy_nonoverlapping(ptr_a, out, rem);\n  115 |             } else if ptr_b < end_b {\n  116 |                 let rem = end_b.offset_from(ptr_b) as usize;\n  117 |                 core::ptr::copy_nonoverlapping(ptr_b, out, rem);\n  118 |             }\n  119 |         }\n  120 |     }\n  121 | }","lines":72,"link":"https://github.com/orxfun/orx-parallel/blob/1dd65eb7addc8f7cc5028b51e5ffd9debb4b9405/src/sort/sort_slice.rs#L50-L121"},{"ref":"src/sort/sort_slice.rs:155-302","code":"  155 | pub fn par_experimental_sort<T, R>(slice: &mut [T], runner: &mut R, params: Params)\n  156 | where\n  157 |     T: Ord + Send,\n  158 |     R: ParRunner,\n  159 | {\n  160 |     let n = slice.len();\n  161 |     if n <= 1 {\n  162 |         return;\n  163 |     }\n {"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"In `State::record_chunk` (`src/runner/runner_variants/adaptive_chunk/state.rs:90-99`), convergence stability is computed as `let threshold = prev_avg / CONVERGENCE_STABILITY_DIVISOR; let stable = change < threshold;`. Since `CONVERGENCE_STABILITY_DIVISOR = 50` and this is integer division, whenever `prev_avg < 50` (i.e. per-item cost under 50ns, a common case for cheap workloads), `threshold` truncates to `0`, and `change < 0` can never be true for an unsigned `change`. Convergence-based early stopping (`converged_samples`) therefore can never fire for workloads with sub-50ns average per-item cost, silently disabling that optimization path and forcing exploration to fall back only on the `elapsed_ms >= EXPLORATION_MIN_MS` / tiny-work / min-samples checks.","fix":"Avoid truncating the threshold before comparing; compare using multiplication instead of division, e.g. `let stable = change.saturating_mul(CONVERGENCE_STABILITY_DIVISOR) < prev_avg;` so small `prev_avg` values still produce a meaningful (sub-unit) threshold.","locations":[{"ref":"src/runner/runner_variants/adaptive_chunk/state.rs:90-99","code":"   90 |         let prev_avg = self.prev_avg_ns_per_item.load(Ordering::Relaxed);\n   91 |         if prev_avg > 0 {\n   92 |             let change = updated_avg.abs_diff(prev_avg);\n   93 |             let threshold = prev_avg / CONVERGENCE_STABILITY_DIVISOR;\n   94 |             let stable = change < threshold;\n   95 |             match stable {\n   96 |                 true => _ = self.converged_samples.fetch_add(1, Ordering::Relaxed),\n   97 |                 false => self.converged_samples.store(0, Ordering::Relaxed), // reset\n   98 |             }\n   99 |         }","lines":10,"link":"https://github.com/orxfun/orx-parallel/blob/1dd65eb7addc8f7cc5028b51e5ffd9debb4b9405/src/runner/runner_variants/adaptive_chunk/state.rs#L90-L99"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In the adaptive-chunk runner, `AdaptiveChunkRunner::complete_chunk` (`src/runner/runner_variants/adaptive_chunk/adaptive_chunk_runner.rs`) unconditionally calls `state.record_chunk(chunk_state)` whenever `state.mode() == Mode::Explore`, but the callers (e.g. `src/result_use/thread_execution/next.rs`, `collect.rs`, `next_any.rs`, `reduce.rs`, `collect_arb.rs`, and `src/result/thread_execution/next_any.rs`/`reduce.rs`) call `Q::complete_chunk(state, chunk_state)` unconditionally after every loop iteration, including the `None => {}` branch where `iter.next_by`/`chunk_puller.pull()` returned no item at all (a transient empty pull while `iter.is_completed_when_none_returned()` is false, i.e. a busy-retry noted by the `// TODO: a good back-off strategy` comment). In that case `record_chunk` still records a sample with `items = chunk_state.requested_chunk_size.max(1)` divided into a near-zero `elapsed_ns`, injecting spurious near-zero-cost samples into `avg_ns_per_item`/`avg_abs_deviation_ns_per_item` via `EWMA_PARAMS_AVG.ewma(...)`. Under contention (many threads racing on the same `ConcurrentIter`), this systematically biases the EWMA average downward and can cause `choose_fixed_chunk_size` to select a smaller-than-optimal fixed chunk size for the rest of the computation.","fix":"Only feed `record_chunk` with samples that correspond to actually-processed items: either skip calling `Q::complete_chunk` (or a new `Q::abort_chunk`) when the pull returned `None`/an empty chunk, or pass the actually-consumed item count (not `requested_chunk_size`) into `ChunkState`/`record_chunk` so `elapsed_ns / items` reflects real per-item cost, e.g. `chunk_state.actual_items` set from the length of the pulled chunk instead of the requested `chunk_size`.","locations":[{"ref":"src/runner/runner_variants/adaptive_chunk/adaptive_chunk_runner.rs:95-103","code":"   95 |     #[inline(always)]\n   96 |     fn complete_chunk(state: &Self::State, chunk_state: Self::ChunkState) {\n   97 |         if state.mode() == Mode::Explore {\n   98 |             state.record_chunk(chunk_state);\n   99 |             if state.should_stop_exploration() {\n  100 |                 state.complete_exploration();\n  101 |             }\n  102 |         }\n  103 |     }","lines":9,"link":"https://github.com/orxfun/orx-parallel/blob/1dd65eb7addc8f7cc5028b51e5ffd9debb4b9405/src/runner/runner_variants/adaptive_chunk/adaptive_chunk_runner.rs#L95-L103"},{"ref":"src/runner/runner_variants/adaptive_chunk/state.rs:70-102","code":"   70 |     pub(super) fn record_chunk(&self, chunk_state: ChunkState) {\n   71 |         let elapsed_ns = chunk_state.elapsed_ns();\n   72 |         let items = chunk_state.requested_chunk_size.max(1);\n   73 |         let sample_ns_per_item = elapsed_ns / items as u64;\n   74 | \n   75 |         let previous_avg = self.avg_ns_per_item.load(Ordering::Relaxed);\n   76 |         let updated_avg = EWMA_PARAMS_AVG.ewma(previous_avg, sample_ns_per_item);\n   77 |         self.avg_ns_per_item.store(updated_avg, Ordering::Relaxed);\n   78 | \n   79 |         let deviation = updated_avg.abs_diff(sample_ns_per_item);\n   80 |         let previous_dev = self.avg_abs_deviation_ns_per_item.load(Ordering::Relaxed);\n   81 |         let updated_dev = EWMA_PARAMS_DEV.ewma(previous_dev, deviation);\n   82 |         self.avg_abs_deviation_ns_per_item\n   83 |             .store(updated_dev, Ordering::Relaxed);\n   84 | \n   85 |         self.explored_tasks.fetch_add(items, Ordering::Relaxed);\n   86 | \n   87 |         // Track convergence: if average is stable, increment counter\n   88 |         // average stable == change < prev_avg / CONVERGENCE_STABILITY_DIVISOR\n   89 |         // (i.e., percentage change < 1/CONVERGENCE_STABILITY_DIVISOR ≈ 2%)\n   90 |         let prev_avg = self.prev_avg_ns_per_item.load(Ordering::Relaxed);\n   91 |         if prev_avg > {"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `src/pool/pool_impl/wasm_web_start_workers.js`, the worker-bootstrap handler posts `{ type: \"orx_parallel_worker_ready\" }` (line 15) *before* checking `typeof pkg.wasm_web_start_worker !== \"function\"` (lines 16-18) and before actually invoking `pkg.wasm_web_start_worker()` (line 19). If the wasm binary was built without the `atomics` target-feature, `wasm_web_start_worker` is not exported (it is `#[cfg(target_feature = \"atomics\")]`-gated in `src/pool/pool_impl/wasm_web.rs`), so the worker still announces `\"orx_parallel_worker_ready\"` first and only afterwards throws and posts `\"orx_parallel_worker_error\"`. Since `startWorkers()`'s `Promise.race([onWorkerReady, onWorkerInitError, onWorkerError, onWorkerTimeout])` already resolves via the premature ready message, the subsequent (and correct) error message arrives too late to be observed - the caller believes the worker initialized successfully when it never entered its work loop.","fix":"Move the readiness check/call before signalling readiness:\n```js\n// before\nawait pkg.default(init);\npostMessage({ type: \"orx_parallel_worker_ready\" });\nif (typeof pkg.wasm_web_start_worker !== \"function\") {\n    throw new Error(\"wasm worker entrypoint is missing: expected wasm_web_start_worker\");\n}\npkg.wasm_web_start_worker();\n\n// after\nawait pkg.default(init);\nif (typeof pkg.wasm_web_start_worker !== \"function\") {\n    throw new Error(\"wasm worker entrypoint is missing: expected wasm_web_start_worker\");\n}\npostMessage({ type: \"orx_parallel_worker_ready\" });\npkg.wasm_web_start_worker();\n```","locations":[{"ref":"src/pools/pool_impl/wasm_web_start_workers.js:11-24","code":"   11 | waitForMsgType(self, \"orx_parallel_worker_init\").then(async ({ init }) => {\n   12 |     try {\n   13 |         const pkg = await import(\"../../../../..\");\n   14 |         await pkg.default(init);\n   15 |         postMessage({ type: \"orx_parallel_worker_ready\" });\n   16 |         if (typeof pkg.wasm_web_start_worker !== \"function\") {\n   17 |             throw new Error(\"wasm worker entrypoint is missing: expected wasm_web_start_worker\");\n   18 |         }\n   19 |         pkg.wasm_web_start_worker();\n   20 |     } catch (err) {\n   21 |         const message = err instanceof Error ? err.message : String(err);\n   22 |         postMessage({ type: \"orx_parallel_worker_error\", message });\n   23 |     }\n   24 | });","lines":14,"link":"https://github.com/orxfun/orx-parallel/blob/1dd65eb7addc8f7cc5028b51e5ffd9debb4b9405/src/pools/pool_impl/wasm_web_start_workers.js#L11-L24"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`IterOptManyBin::count`, `IterResManyBin::count`, `IterUseOptManyBin::count`, and `IterUseResManyBin::count` in `src/sizes/size_pairs/many_bin.rs` are implemented as `self.iter.take_while(|x| x.is_some()/is_ok()).count()`, which is inconsistent with these same types' own `next()`/`fold()` implementations. `next()` skips (does not emit, does not stop) elements where the upstream `M` was present but `x2.bin_value(...)`/`bin_value` returned `None` (a bin/filter miss), and it *does* emit the terminal `None`/`Err` marker as one final item. The `count()` override instead counts every upstream `Some`/`Ok` element regardless of whether `bin_value` filtered it out (over-counting filtered-out elements), and excludes the terminal `None`/`Err` marker entirely (under-counting by one when the sequence ends in a fail marker). `fold()` in the same file already implements the correct semantics.","fix":"Remove the manual `count()` overrides (letting the default `Iterator::count` delegate to the already-correct `fold`), or reimplement them as `self.fold(0, |acc, _| acc + 1)` to match `next()`'s actual filtering/termination semantics.","locations":[{"ref":"src/sizes/size_pairs/many_bin.rs:166-172","code":"  166 |     #[inline]\n  167 |     fn count(self) -> usize\n  168 |     where\n  169 |         Self: Sized,\n  170 |     {\n  171 |         self.iter.take_while(|x| x.is_some()).count()\n  172 |     }","lines":7,"link":"https://github.com/orxfun/orx-parallel/blob/1dd65eb7addc8f7cc5028b51e5ffd9debb4b9405/src/sizes/size_pairs/many_bin.rs#L166-L172"},{"ref":"src/sizes/size_pairs/many_bin.rs:246-252","code":"  246 |     #[inline]\n  247 |     fn count(self) -> usize\n  248 |     where\n  249 |         Self: Sized,\n  250 |     {\n  251 |         self.iter.take_while(|x| x.is_ok()).count()\n  252 |     }","lines":7,"link":"https://github.com/orxfun/orx-parallel/blob/1dd65eb7addc8f7cc5028b51e5ffd9debb4b9405/src/sizes/size_pairs/many_bin.rs#L246-L252"},{"ref":"src/sizes/size_pairs/many_bin.rs:327-333","code":"  327 |     #[inline]\n  328 |     fn count(self) -> usize\n  329 |     where\n  330 |         Self: Sized,\n  331 |     {\n  332 |         self.iter.take_while(|x| x.is_some()).count()\n  333 |     }","lines":7,"link":"https://github.com/orxfun/orx-parallel/blob/1dd65eb7addc8f7cc5028b51e5ffd9debb4b9405/src/sizes/size_pairs/many_bin.rs#L327-L333"},{"ref":"src/sizes/size_pairs/many_bin.rs:408-414","code":"  408 |     #[inline]\n  409 |     fn count(self) -> usize\n  410 |     where\n  411 |         Self: Sized,\n  412 |     {\n  413 |         self.iter.take_while(|x| x.is_ok()).count()\n  414 |     }","lines":7,"link":"https://github.com/orxfun/orx-parallel/blob/1dd65eb7addc8f7cc5028b51e5ffd9debb4b9405/src/sizes/size_pairs/many_bin.rs#L408-L414"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`IdUse<X, U>`'s `XapUseEnumByInput` impl in `src/infallible_use/xap_variants/id.rs` is bounded as `impl<X: XapEnumByInput<Size = One>, U> XapUseEnumByInput for IdUse<X, U>`, hard-coding `Size = One` even though `IdUse<X, U>`'s own `XapUse::Size` is simply `X::Size` (any size, per the `XapUse` impl a few lines above: `type Size = X::Size;`). This means `.enumerate()` on a `ParUse` pipeline entered via `use_new`/`use_vec`/`use_slice` is unnecessarily blocked whenever the pipeline's underlying `Xap1`/`Xap2` has `Size = Bin` or `Size = Many` - even in cases where that xap is built purely from `BinM`/`ManyM` (map-only) steps that themselves do implement `XapEnumByInput`. The `Size = One` constraint on `IdUse`'s impl serves no purpose since `IdUse` is a transparent identity wrapper and doesn't care about the wrapped xap's cardinality.","fix":"Relax the bound to `impl<X: XapEnumByInput, U> XapUseEnumByInput for IdUse<X, U>` (dropping `<Size = One>`), matching the unconstrained `Size = X::Size` used by `IdUse`'s `XapUse` impl.","locations":[{"ref":"src/infallible_use/xap_variants/id.rs:45-52","code":"   45 | impl<X: XapEnumByInput<Size = One>, U> XapUseEnumByInput for IdUse<X, U> {\n   46 |     type Enumerated = IdUse<X::Enumerated, U>;\n   47 | \n   48 |     fn enumerate(self) -> Self::Enumerated {\n   49 |         let x = self.x.enumerate();\n   50 |         IdUse::new(x)\n   51 |     }\n   52 | }","lines":8,"link":"https://github.com/orxfun/orx-parallel/blob/1dd65eb7addc8f7cc5028b51e5ffd9debb4b9405/src/infallible_use/xap_variants/id.rs#L45-L52"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `src/result_use/thread_execution/reduce.rs:112-126`, only the last of four structurally-identical accumulation blocks introduces a pointless alias `let u2 = u;` (line 117) and then dereferences `u2` instead of `u` (`f(unsafe { &mut *u2 }, acc, a)`), while the three earlier blocks in the same function correctly use `f(unsafe { &mut *u }, ...)` directly. Since `u: *mut U` is `Copy`, `u2` is not needed for aliasing/borrow-checker reasons and is leftover copy-paste noise.","fix":"```rust\nSome(chunk) => {\n    for a in chunk.flat_map(|i| S::xap_use_res(u, x1, x2, i)) {\n        acc = match a {\n            Ok(a) => f(unsafe { &mut *u }, acc, a),\n            Err(e) => {\n                Q::broadcast_stop(iter, state, chunk_state);\n                return Err(e);\n            }\n        };\n    }\n}\n```","locations":[{"ref":"src/result_use/thread_execution/reduce.rs:112-126","code":"  112 |                     c => {\n  113 |                         chunk_puller.resize_for_chunk_size(c);\n  114 | \n  115 |                         match chunk_puller.pull() {\n  116 |                             Some(chunk) => {\n  117 |                                 let u2 = u;\n  118 |                                 for a in chunk.flat_map(|i| S::xap_use_res(u, x1, x2, i)) {\n  119 |                                     acc = match a {\n  120 |                                         Ok(a) => f(unsafe { &mut *u2 }, acc, a),\n  121 |                                         Err(e) => {\n  122 |                                             Q::broadcast_stop(iter, state, chunk_state);\n  123 |                                             return Err(e);\n  124 |                                         }\n  125 |                                     };\n  126 |                                 }","lines":15,"link":"https://github.com/orxfun/orx-parallel/blob/1dd65eb7addc8f7cc5028b51e5ffd9debb4b9405/src/result_use/thread_execution/reduce.rs#L112-L126"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"high","difficulty":"hard","description":"On `target_arch = \"wasm32\"`, `ScopeRuntime::wait_for_completion` (`src/pool/pool_impl/wasm_web.rs:108-114`) busy-spins with `while self.pending.load(Ordering::Acquire) != 0 { core::hint::spin_loop(); }` instead of blocking on the `completion_cv`/`completion_lock` pair used on other targets. This function runs on whichever thread called `scoped_computation` - typically the browser's main/UI thread issuing the parallel computation. A tight spin loop there pins that thread at 100% CPU for the entire duration of every parallel computation and prevents it from servicing any other JS/event-loop work (messages, timers, rendering) until all worker tasks finish, effectively freezing the page for the length of the computation - the opposite of what an off-main-thread worker pool is meant to achieve.","fix":"Avoid unconditional busy-spinning on the calling thread: e.g. yield periodically (exponential backoff), only allow `scoped_computation` to be called from within a worker context so the main thread is never blocked, or use a bounded `Atomics.wait`/`Atomics.waitAsync`-based scheme (with a small time budget) so the calling thread can make forward progress on its event loop between checks.","locations":[{"ref":"src/pools/pool_impl/wasm_web.rs:114-120","code":"  114 |     fn wait_for_completion(&self) {\n  115 |         #[cfg(target_arch = \"wasm32\")]\n  116 |         {\n  117 |             while self.pending.load(Ordering::Acquire) != 0 {\n  118 |                 core::hint::spin_loop();\n  119 |             }\n  120 |         }","lines":7,"link":"https://github.com/orxfun/orx-parallel/blob/1dd65eb7addc8f7cc5028b51e5ffd9debb4b9405/src/pools/pool_impl/wasm_web.rs#L114-L120"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"high","difficulty":"hard","description":"`Timing::now()` for wasm32 (`src/runner/runner_variants/adaptive_chunk/timing/timing_wasm.rs:6-9`) is implemented as `(js_sys::Date::now() * 1_000_000.0) as u64`. `Date::now()` only has millisecond resolution (and in many browsers is throttled further), so multiplying by `1_000_000.0` fabricates fake nanosecond units without adding real precision: two calls to `Timing::now()` within the same JS-clock millisecond tick yield identical values, so `elapsed_ns_from` (via `saturating_sub`) returns exactly `0` for the very common case where a chunk finishes in under ~1ms. `State::record_chunk` then computes `sample_ns_per_item = elapsed_ns / items = 0`, which is fed into the EWMA average (`EWMA_PARAMS_AVG.ewma`), repeatedly biasing `avg_ns_per_item` toward zero on wasm and undermining the heavy-work / high-variability chunk-size decisions the adaptive runner is designed to make (`choose_fixed_chunk_size` in `state.rs`).","fix":"Use a higher-resolution wasm clock, e.g. `web_sys::Window::performance()`/`WorkerGlobalScope::performance()`'s `Performance::now()` (sub-millisecond resolution, monotonic), instead of `js_sys::Date::now()`, before scaling to nanosecond-like units.","locations":[{"ref":"src/runner/runner_variants/adaptive_chunk/timing/timing_wasm.rs:1-20","code":"    1 | pub type Instant = u64;\n    2 | \n    3 | pub struct Timing;\n    4 | \n    5 | impl Timing {\n    6 |     #[inline(always)]\n    7 |     pub fn now() -> Instant {\n    8 |         (js_sys::Date::now() * 1_000_000.0) as u64\n    9 |     }\n   10 | \n   11 |     #[inline(always)]\n   12 |     pub fn elapsed_ns_from(from: Instant) -> u64 {\n   13 |         Timing::now().saturating_sub(from)\n   14 |     }\n   15 | \n   16 |     #[inline(always)]\n   17 |     pub fn elapsed_millis_from(from: Instant) -> u128 {\n   18 |         Timing::now().saturating_sub(from).saturating_div(1_000_000) as u128\n   19 |     }\n   20 | }","lines":20,"link":"https://github.com/orxfun/orx-parallel/blob/1dd65eb7addc8f7cc5028b51e5ffd9debb4b9405/src/runner/runner_variants/adaptive_chunk/timing/timing_wasm.rs#L1-L20"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"medium","difficulty":"hard","description":"In `src/infallible_use/thread_execution/reduce.rs`, both the `0 | 1` and chunked branches of the polling loops handle a `None` result from `iter.next_by(th_idx)`/`chunk_puller.pull()` with a bare `None => {}` when `!iter.is_completed_when_none_returned()`, immediately looping back to `Q::next_chunk_size`/`Q::begin_chunk` again with no delay or back-off. This is a tight busy-spin: a worker thread that races ahead of a slower-producing concurrent iterator (e.g. a recursively-expanding source) will burn 100% CPU polling in a loop until either new work appears or completion is signalled, rather than yielding/backing off. The code itself flags this with `// TODO: a good back-off strategy might be used, needs benchmark with ConcurrentQueue` at both occurrences, confirming it is a known, unresolved gap rather than intentional final behavior. The identical unthrottled retry pattern also appears in the sibling `collect.rs`, `collect_arb.rs`, `next.rs`, and `next_any.rs` in the same directory.","fix":"Add a back-off strategy on repeated `None` results (e.g. `core::hint::spin_loop()` for a few iterations, then a short sleep/yield, similar to typical spin-wait patterns for lock-free queues) before retrying `next_chunk_size`/`begin_chunk`, and benchmark against `ConcurrentQueue`-backed sources as the existing TODO suggests.","locations":[{"ref":"src/infallible_use/thread_execution/reduce.rs:42-45","code":"   42 |                     // TODO: a good back-off strategy might be used, needs benchmark with ConcurrentQueue\n   43 |                     None if iter.is_completed_when_none_returned() => break,\n   44 |                     None => {}\n   45 |                 }","lines":4,"link":"https://github.com/orxfun/orx-parallel/blob/1dd65eb7addc8f7cc5028b51e5ffd9debb4b9405/src/infallible_use/thread_execution/reduce.rs#L42-L45"},{"ref":"src/infallible_use/thread_execution/reduce.rs:89-92","code":"   89 |                             // TODO: a good back-off strategy might be used, needs benchmark with ConcurrentQueue\n   90 |                             None if iter.is_completed_when_none_returned() => break,\n   91 |                             None => {}\n   92 |                         }","lines":4,"link":"https://github.com/orxfun/orx-parallel/blob/1dd65eb7addc8f7cc5028b51e5ffd9debb4b9405/src/infallible_use/thread_execution/reduce.rs#L89-L92"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"medium","difficulty":"hard","description":"In `src/option/thread_execution/{collect.rs,collect_arb.rs,next.rs,next_any.rs,reduce.rs}` and their `src/option_use/thread_execution/` counterparts, every polling loop handles a `None` from `iter.next_by`/`iter.next_with_idx_by`/`chunk_puller.pull(_with_idx)` (when `!iter.is_completed_when_none_returned()`) with a bare `None => {}`, immediately looping back to `Q::next_chunk_size`/`Q::begin_chunk` with no back-off. This is an unthrottled busy-spin: a worker that races ahead of a slower/lazily-producing concurrent iterator will spin at 100% CPU until new work appears or completion is signalled. The `reduce.rs` files in both directories even carry a `// TODO: a good back-off strategy might be used, needs benchmark with ConcurrentQueue` comment acknowledging this as an unresolved gap, but the identical unthrottled pattern is silently repeated (without the TODO note) in the sibling `collect.rs`, `collect_arb.rs`, `next.rs`, and `next_any.rs` in both `option` and `option_use`.","fix":"Add a shared back-off helper (e.g. a few `core::hint::spin_loop()` iterations followed by a short yield/sleep) invoked from the `None => {}` arms across all of `option`'s and `option_use`'s `thread_execution` functions before retrying, consistent with the TODO already present in `reduce.rs`, and benchmark against `ConcurrentQueue`-backed sources as noted.","locations":[{"ref":"src/option/thread_execution/reduce.rs:46-48","code":"   46 |                     // TODO: a good back-off strategy might be used, needs benchmark with ConcurrentQueue\n   47 |                     None if iter.is_completed_when_none_returned() => break,\n   48 |                     None => {}","lines":3,"link":"https://github.com/orxfun/orx-parallel/blob/1dd65eb7addc8f7cc5028b51e5ffd9debb4b9405/src/option/thread_execution/reduce.rs#L46-L48"},{"ref":"src/option/thread_execution/reduce.rs:101-103","code" {"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"medium","difficulty":"easy","description":"The top-level code in `src/pool/pool_impl/wasm_web_start_workers.js` (lines 1-24) registers a `message` listener on `self` waiting for `\"orx_parallel_worker_init\"`, then imports the wasm package, calls `pkg.default(init)`, posts `\"orx_parallel_worker_ready\"`, and calls `pkg.wasm_web_start_worker()` - logic that is clearly meant to run inside a spawned Worker's global scope. However, `startWorkers()` in the same file (line 40) creates each `Worker` pointing at a *different* script, `new URL(\"./worker_helpers.js\", import.meta.url)`, and no `worker_helpers.js` file exists anywhere in this repository (confirmed by search). This means lines 1-24 never run in their intended context: whenever this module is loaded on the main thread (its actual real usage, since it is the `#[wasm_bindgen(module = ...)]` target providing `startWorkers`), `self` refers to the main-thread global, so the listener is registered but the expected `\"orx_parallel_worker_init\"` message is never delivered to it (it is only ever posted to the spawned `worker_helpers.js` workers, via `worker.postMessage(workerInit)` at line 60). The real worker bootstrap script is apparently supplied externally by the companion `orx-parallel-wasm` npm package (per `docs/wasm.md`, which says its build step \"copies the worker helper beside the generated worker entry\"), making this block an unused, easily-mistaken-for-authoritative copy that can silently drift out of sync with the real `worker_helpers.js` content.","fix":"Remove the dead top-level listener block from `wasm_web_start_workers.js` (it never executes in its current usage), or add a comment clarifying it is a reference template for the externally-supplied `worker_helpers.js` and must be kept in sync manually, to avoid confusing future maintainers into thinking it is live code.","locations":[{"ref":"src/pools/pool_impl/wasm_web_start_workers.js:1-24","code":"    1 | function waitForMsgType(target, type) {\n    2 |     return new Promise((resolve) => {\n    3 |         target.addEventListener(\"message\", function onMsg({ data }) {\n    4 |             if (data == null || data.type !== type) return;\n    5 |             target.removeEventListener(\"message\", onMsg);\n    6 |             resolve(data);\n    7 |         });\n    8 |     });\n    9 | }\n   10 | \n   11 | waitForMsgType(self, \"orx_parallel_worker_init\").then(async ({ init }) => {\n   12 |     try {\n   13 |         const pkg = await import(\"../../../../..\");\n   14 |         await pkg.default(init);\n   15 |         postMessage({ type: \"orx_parallel_worker_ready\" });\n   16 |         if (typeof pkg.wasm_web_start_worker !== \"function\") {\n   17 |             throw new Error(\"wasm worker entrypoint is missing: expected wasm_web_start_worker\");\n   18 |         }\n   19 |         pkg.wasm_web_start_worker();\n   20 |     } catch (err) {\n   21 |         const message = err instanceof Error ? err.message : String(err);\n   22 |         postMessage({ type: \"orx_parallel_worker_error\", message });\n   23 |     }\n   24 | });","lines":24,"link":"https://github.com/orxfun/orx-parallel/blob/1dd65eb7addc8f7cc5028b51e5ffd9debb4b9405/src/pools/pool_impl/wasm_web_start_workers.js#L1-L24"},{"ref":"src/pools/pool_impl/wasm_web_start_workers.js:28-66","code":"   28 | export async function startWorkers(module, memory, numThreads) {\n   29 |     if (numThreads === 0) {\n   30 |         throw new Error(\"num_threads must be > 0.\");\n   31 |     }\n   32 | \n   33 |     const workerInit = {\n   34 |         type: \"orx_parallel_worker_init\",\n   35 |         init: { module_or_path: module, memory },\n   36 |     };\n   37 | \n   38 |     _workers = await Promise.all(\n   39 |         Array.from({ length: numThreads }, async (_, idx) => {\n   40 |             const worker = new Worker(new URL(\"./worker_helpers.js\", import.meta.url), {\n   41 |                 type: \"module\",\n   42 |             });\n   43 | \n   44 |             const onWorkerError = new Promise((_, reject) => {\n   45 |                 worker.addEventListener(\"error\", (event) => {\n   46 |                     reject(new Error(`worker ${idx} script error: ${event.message || \"unknown error\"}`));\n   47 |                 }, { once: true });\n   48 |             });\n   49 | \n   50 |             const onWorkerInitError = waitForMsgType(worker, \"orx_parallel_worker_error\").then((data) => {\n   51 |                 throw new Error(`worker ${idx} init failed: ${data.message || \"unknown error\"}`);\n   52 |             });\n   53 | \n   54 |             const onWorkerReady = waitForMsgType(worker, \"orx_parallel_worker_ready\");\n   55 | \n   56 |             const onWorkerTimeout = new Promise((_, reject) => {\n   57 |                 setTimeout(() => reject(new Error(`worker ${idx} init timed out`)), 10000);\n   58 |             });\n   59 | \n   60 |             worker.postMessage(workerInit);\n   61 | \n   62 |             await Promise.race([onWorkerReady, onWorkerInitError, onWorkerError, onWorkerTimeout]);\n   63 |             return worker;\n   64 |         })\n   65 |     );\n   66 | }","lines":39,"link":"https://github.com/orxfun/orx-parallel/blob/1dd65eb7addc8f7cc5028b51e5ffd9debb4b9405/src/pools/pool_impl/wasm_web_start_workers.js#L28-L66"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`WasmWebPool::run_in_scope` (`src/pool/pool_impl/wasm_web.rs:409-434`) has an `if s.inline_only { ... }` fallback branch that runs work synchronously in place. `inline_only` is set from `runtime().spawned_workers == 0` (line 377), but `spawned_workers` is always populated from a `NonZeroUsize` in `init_runtime` (`spawned_workers: num_threads.get()`, line 250), and `runtime()` panics via `assert_wasm_thread_pool_initialized` before that value could ever be read as zero. Consequently `inline_only` is always `false` at runtime, and lines 417-424 can never execute, despite looking like a supported zero-worker fallback path.","fix":"Either remove the dead `if s.inline_only { ... }` branch and the `inline_only` field entirely, or make it actually reachable (e.g. allow `init_wasm_thread_pool`/`WasmWebPool` to be configured with zero spawned workers and run everything inline in that case).","locations":[{"ref":"src/pools/pool_impl/wasm_web.rs:375-377","code":"  375 |             runtime: &scope_runtime,\n  376 |             inline_only: runtime().spawned_workers == 0,\n  377 |             _marker: PhantomData,","lines":3,"link":"https://github.com/orxfun/orx-parallel/blob/1dd65eb7addc8f7cc5028b51e5ffd9debb4b9405/src/pools/pool_impl/wasm_web.rs#L375-L377"}]},

{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"In `src/infallible/xap.rs`, `XapBin::bin_value` carries a `// SAFETY: by definition the result has exactly zero or one element` comment directly above `self.xap(i).into_iter().next()`, but that line contains no `unsafe` block at all - it is a plain, always-safe `Option`-returning call. The comment was clearly copy-pasted from the sibling `XapOne::one_value` a few lines above, which does contain an `unsafe { ... unwrap_unchecked() }` call that genuinely needs a safety justification. The identical stale comment is duplicated in `src/infallible_use/xap.rs` on `XapUseBin::bin_value`. A `SAFETY:` comment on code with no `unsafe` is misleading to readers and to tools (like `clippy::undocumented_unsafe_blocks`) that expect `SAFETY:` to precede an `unsafe` block.","fix":"Remove the `SAFETY:` prefix (or the comment entirely) from `bin_value`/`XapUseBin::bin_value` since there is no `unsafe` code to justify there, e.g. change the comment to a plain `// zero-or-one element, so `next()` yields at most one value` note, or delete it.","locations":[{"ref":"src/infallible/xap.rs:100-107","code":"  100 | /// Convenience methods for xaps that yield zero or one value.\n  101 | pub trait XapBin: Xap<Size = Bin> {\n  102 |     #[inline(always)]\n  103 |     /// Returns the optional output value.\n  104 |     fn bin_value(&self, i: Self::I) -> Option<Self::O> {\n  105 |         // SAFETY: by definition the result has exactly zero or one element\n  106 |         self.xap(i).into_iter().next()\n  107 |     }","lines":8,"link":"https://github.com/orxfun/orx-parallel/blob/1dd65eb7addc8f7cc5028b51e5ffd9debb4b9405/src/infallible/xap.rs#L100-L107"},{"ref":"src/infallible_use/xap.rs:86-92","code":"   86 | pub trait XapUseBin: XapUse<Size = Bin> {\n   87 |     #[inline(always)]\n   88 |     fn bin_value(&self, u: *mut Self::U, i: Self::I) -> Option<Self::O> {\n   89 |         // SAFETY: by definition the result has exactly zero or one element\n   90 |         self.xap_use(u, i).into_iter().next()\n   91 |     }\n   92 | }","lines":7,"link":"https://github.com/orxfun/orx-parallel/blob/1dd65eb7addc8f7cc5028b51e5ffd9debb4b9405/src/infallible_use/xap.rs#L86-L92"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"In `IterOptOneMany::next` and `IterUseOptOneMany::next` (`src/sizes/size_pairs/one_many.rs`), the `Fail(false)` arm carries a `// SAFETY: ...` comment referencing an \"error [that] can be taken out only once\" and (for `IterUseOptOneMany`) claiming \"the error variant must be created with Some of an error\" - but this arm contains no `unsafe` block at all; it's a plain `*taken = true; Some(None)` on a `bool` flag, not an `Option<E>` being taken. The comment appears to be copy-pasted from the sibling `IterResOneMany`/`IterUseResOneMany` types (`src/sizes/size_pairs/one_many.rs:217-224` and `:382-389`), which do use `unsafe { e.take().unwrap_unchecked() }` and where the comment is actually accurate.","fix":"Remove the misleading `SAFETY` comment from the `Fail(false)` arms of `IterOptOneMany::next` and `IterUseOptOneMany::next` (there is no unsafe code there), or replace it with a short note that the `bool` flag simply guards against yielding the sentinel `None` more than once.","locations":[{"ref":"src/sizes/size_pairs/one_many.rs:136-145","code":"  136 |             Self::Fail(taken) => {\n  137 |                 match taken {\n  138 |                     false => {\n  139 |                         // SAFETY: error can be taken out only once; and on construction\n  140 |                         // the error is not taken\n  141 |                         *taken = true;\n  142 |                         Some(None)\n  143 |                     }\n  144 |                     true => None, // the error is already taken and returned\n  145 |                 }","lines":10,"link":"https://github.com/orxfun/orx-parallel/blob/1dd65eb7addc8f7cc5028b51e5ffd9debb4b9405/src/sizes/size_pairs/one_many.rs#L136-L145"},{"ref":"src/sizes/size_pairs/one_many.rs:303-311","code":"  303 |             Self::Fail(taken) => match taken {\n  304 |                 false = {"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"medium","difficulty":"medium","description":"`src/sizes/size_pairs/one_many.rs` defines four iterator adapters - `IterOptOneMany`, `IterResOneMany`, `IterUseOptOneMany`, `IterUseResOneMany` - where `IterOptOneMany` (lines 110-191) and `IterUseOptOneMany` (lines 277-356) are character-for-character identical in structure and logic (differ only in name), and likewise `IterResOneMany` (lines 195-273) and `IterUseResOneMany` (lines 360-438) are identical. Over 250 lines are duplicated this way, so a future bug fix or behavior change (e.g. the `next`/`fold`/`count`/`size_hint`/`len` logic) applied to one pair member is easy to forget to apply to its twin, as already evidenced by the stale `SAFETY` comment divergence noted separately.","fix":"Factor the shared `Success(I)`/`Fail(...)` iterator logic into one generic implementation (e.g. a single `IterOneMany<I, Sentinel>` parameterized over the sentinel-producing type, or a `macro_rules!` that generates both the plain and `Use`-flavored variants from one template) instead of maintaining two hand-copied pairs of iterator types.","locations":[{"ref":"src/sizes/size_pairs/one_many.rs:114-195","code":"  114 | pub enum IterOptOneMany<I: Iterator> {\n  115 |     Success(I),\n  116 |     Fail(bool),\n  117 | }\n  118 | \n  119 | impl<I: Iterator> IterOptOneMany<I> {\n  120 |     pub fn ok(i: I) -> Self {\n  121 |         Self::Success(i)\n  122 |     }\n  123 | \n  124 |     pub fn err() -> Self {\n  125 |         Self::Fail(false)\n  126 |     }\n  127 | }\n  128 | \n  129 | impl<I: Iterator> Iterator for IterOptOneMany<I> {\n  130 |     type Item = Option<I::Item>;\n  131 | \n  132 |     #[inline]\n  133 |     fn next(&mut self) -> Option<Self::Item> {\n  134 |         match self {\n  135 |             Self::Success(iter) => iter.next().map(Some),\n  136 |             Self::Fail(taken) => {\n  137 |                 match taken {\n  138 | {"id":"DUP_2","type":"duplicate_code","type_label":"Duplicate Code","severity":"negligible","difficulty":"easy","description":"In `src/infallible/fun/map/basic.rs`, `src/infallible/fun/map/cloned_copied.rs`, `src/infallible/fun/map/inspect.rs`, `src/infallible/fun/filter_map/basic.rs`, `src/infallible/fun/filter_map/filter.rs`, `src/infallible/fun/flat_map/basic.rs`, and `src/infallible/fun/flat_map/flatten.rs`, every adapter struct (`FnMap`, `FnCloned`, `FnCopied`, `FnIns`, `FnFilMap`, `FnFil`, `FnFlatMap`, `FnFlatten`) has a manual `unsafe impl Send for ...` even though the wrapped closure type parameter `F` is already bound by `Send` (or the struct holds only `PhantomData`). These are not bugs (the `unsafe impl` is sound because the structs never actually store a value of the phantom type), but they are boilerplate duplicated verbatim across eight near-identical files, matching the pattern the audit was asked to watch for.","fix":"Consider factoring the `Clone + Copy + unsafe Send` boilerplate for these zero-sized/closure-wrapper adapters into a shared macro to reduce duplicated unsafe code that has to be independently re-audited in each of the eight files.","locations":[{"ref":"src/infallible/fun/map/basic.rs:15","code":"   15 | unsafe impl<I, O, F: Fn(I) -> O + Copy + Send> Send for FnMap<I, O, F> {}","lines":1,"link":"https://github.com/orxfun/orx-parallel/blob/1dd65eb7addc8f7cc5028b51e5ffd9debb4b9405/src/infallible/fun/map/basic.rs#L15"},{"ref":"src/infallible/fun/map/cloned_copied.rs:17","code":"   17 | unsafe impl<'a, I: Clone> Send for FnCloned<'a, I> {}","lines":1,"link":"https://github.com/orxfun/orx-parallel/blob/1dd65eb7addc8f7cc5028b51e5ffd9debb4b9405/src/infallible/fun/map/cloned_copied.rs#L17"},{"ref":"src/infallible/fun/map/cloned_copied.rs:56","code":"   56 | unsafe impl<'a, I: Copy> Send for FnCopied<'a, I> {}","lines":1,"link":"https://github.com/orxfun/orx-parallel/blob/1dd65eb7addc8f7cc5028b51e5ffd9debb4b9405/src/infallible/fun/map/cloned_copied.rs#L56"},{"ref":"src/infallible/fun/map/inspect.rs:15","code":"   15 | unsafe impl<I, F: Fn(&I) + Copy + Send> Send for FnIns<I, F> {}","lines":1,"link":"https://github.com/orxfun/orx-parallel/blob/1dd65eb7addc8f7cc5028b51e5ffd9debb4b9405/src/infallible/fun/map/inspect.rs#L15"},{"ref":"src/infallible/fun/filter_map/basic.rs:15","code":"   15 | unsafe impl<I, O, F: Fn(I) -> Option<O> + Copy + Send> Send for FnFilMap<I, O, F> {}","lines":1,"link":"https://github.com/orxfun/orx-parallel/blob/1dd65eb7addc8f7cc5028b51e5ffd9debb4b9405/src/infallible/fun/filter_map/basic.rs#L15"},{"ref":"src/infallible/fun/filter_map/filter.rs:15","code":"   15 | unsafe impl<I, F: Fn(&I) -> bool + Copy + Send> Send for FnFil<I, F> {}","lines":1,"link":"https://github.com/orxfun/orx-parallel/blob/1dd65eb7addc8f7cc5028b51e5ffd9debb4b9405/src/infallible/fun/filter_map/filter.rs#L15"},{"ref":"src/infallible/fun/flat_map/basic.rs:15","code":"   15 | unsafe impl<I, O: IntoIterator, F: Fn(I) -> O + Copy + Send> Send for FnFlatMap<I, O, F> {}","lines":1,"link":"https://github.com/orxfun/orx-parallel/blob/1dd65eb7addc8f7cc5028b51e5ffd9debb4b9405/src/infallible/fun/flat_map/basic.rs#L15"},{"ref":"src/infallible/fun/flat_map/flatten.rs:15","code":"   15 | unsafe impl<I: IntoIterator> Send for FnFlatten<I> {}","lines":1,"link":"https://github.com/orxfun/orx-parallel/blob/1dd65eb7addc8f7cc5028b51e5ffd9debb4b9405/src/infallible/fun/flat_map/flatten.rs#L15"}]},
{"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"medium","difficulty":"hard","description":"`XapEnumByInput` (and its `infallible_use` twin `XapUseEnumByInput`) is only implemented for the identity xap (`Id`/`IdUse`) and the `*M` (map-only) variants `OneM`, `BinM`, `ManyM` (and `UOneM`, `UBinM`, `UManyM`). The `*F` (filter/filter_map) variants `OneF`, `BinF`, `ManyF` and the `*X` (flat_map/flatten) variants `OneX`, `BinX`, `ManyX` - plus their `infallible_use` counterparts `UOneF`/`UBinF`/`UManyF`/`UOneX`/`UBinX`/`UManyX` - never implement `XapEnumByInput`/`XapUseEnumByInput`. Since `EnumeratePar::enumerate`/`EnumerateParUse::enumerate` require the whole current `Xap`/`XapUse` chain to implement this trait (it recursively calls `.enumerate()` on the wrapped inner xap too), once a pipeline uses `.filter()`, `.filter_map()`, `.flat_map()`, or `.flatten()` anywhere before `.enumerate()`, the `.enumerate()` call stops compiling (`XapEnumByInput`/`XapUseEnumByInput` bound unsatisfied) - even though every rustdoc example in `src/infallible/par_enum.rs` and `src/infallible_use/par_enum.rs` only demonstrates calling `.enumerate()` immediately after source creation, with no mention of this restriction. Users who write `.filter(...).enumerate()` or `.flat_map(...).enumerate()` get a confusing trait-bound compile error instead of a documented limitation.","fix":"Either (a) document explicitly on `EnumeratePar`/`EnumerateParUse` (and in `.filter`/`.filter_map`/`.flat_map`/`.flatten` docs) that `.enumerate()` must be called before any filtering/flat-mapping step, or (b) implement `XapEnumByInput`/`XapUseEnumByInput` for the `*F` and `*X` variants too (threading `(usize, ...)` through the zero-or-many cardinality the same way `*M` variants thread it through the one-to-one case), so `.filter(...).enumerate()` compiles and behaves as users would expect from a rayon/std-like API.","locations":[{"ref":"src/infallible/xap_variants/bin_f.rs:1-39","code":" {"id":"OTHER_1","type":"other","type_label":"Other","severity":"medium","difficulty":"medium","description":"`WithDiagnostics`'s `TaskCounts::push` and `ThreadLifetimes::begin`/`end` (`src/runner/runner_variants/with_diagnostics.rs:84-119`) take `&self` and obtain per-index `&mut Vec<usize>` / `&mut Option<Instant>` via raw-pointer casts (`&mut *(self.0.as_ptr().add(th_idx) as *mut Vec<usize>)`) on plain `Vec<Vec<usize>>` / `Vec<Option<Instant>>` fields that are not wrapped in `UnsafeCell`. Mutating through a `*mut` derived from a shared `&self` reference without interior mutability is UB under Rust's aliasing model (the compiler is permitted to assume memory behind a `&T` is not concurrently mutated), even though in practice each `th_idx` is only ever touched by one thread at a time and the outer `Vec`s are pre-sized and never reallocated during the computation.","fix":"Wrap the per-slot storage in `UnsafeCell` (e.g. `Vec<UnsafeCell<Vec<usize>>>` / `Vec<UnsafeCell<Option<Instant>>>`) so the mutation is backed by proper interior mutability, or switch to `Vec<Mutex<...>>`/atomics given this is diagnostics-only, non-hot-path code.","locations":[{"ref":"src/runner/runner_variants/with_diagnostics.rs:84-95","code":"   84 | struct TaskCounts(Vec<Vec<usize>>);\n   85 | \n   86 | impl TaskCounts {\n   87 |     fn new(max_num_threads: usize) -> Self {\n   88 |         Self((0..max_num_threads).map(|_| Vec::new()).collect())\n   89 |     }\n   90 | \n   91 |     fn push(&self, th_idx: usize, chunk_size: usize) {\n   92 |         let vec = unsafe { &mut *(self.0.as_ptr().add(th_idx) as *mut Vec<usize>) };\n   93 |         vec.push(chunk_size);\n   94 |     }\n   95 | }","lines":12,"link":"https://github.com/orxfun/orx-parallel/blob/1dd65eb7addc8f7cc5028b51e5ffd9debb4b9405/src/runner/runner_variants/with_diagnostics.rs#L84-L95"},{"ref":"src/runner/runner_variants/with_diagnostics.rs:97-119","code":"   97 | struct ThreadLifetimes {\n   98 |     begin: Vec<Option<Instant>>,\n (function(){
'use strict';

// Data

// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};
const PRESENT_DIFFS = DIFFICULTY_ORDER.filter(d => FINDINGS.some(f => f.difficulty === d));
const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;

  clearTimeout(_hashTimer);

    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));

    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));

    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
