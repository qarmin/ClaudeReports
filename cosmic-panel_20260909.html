{"id":"CPY_10","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"very_easy","description":"The `event_created_child!` invocation for `ZcosmicOverlapNotificationV1` passes `ZcosmicOverlapNotifyV1` as the interface argument. That argument is only used to build the panic message for an unhandled child-creating opcode (`Missing event_created_child specialization for event opcode {} of {}`), so an unhandled opcode would report the wrong interface name and send debugging in the wrong direction.","fix":"Before:\n```rust\nevent_created_child!(GlobalState, ZcosmicOverlapNotifyV1, [\n    0 => (ExtForeignToplevelHandleV1, Default::default())\n]);\n```\nAfter:\n```rust\nevent_created_child!(GlobalState, ZcosmicOverlapNotificationV1, [\n    0 => (ExtForeignToplevelHandleV1, Default::default())\n]);\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/overlap.rs:54-56","code":"   54 |     event_created_child!(GlobalState, ZcosmicOverlapNotifyV1, [\n   55 |         0 => (ExtForeignToplevelHandleV1, Default::default())\n   56 |     ]);","lines":3,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/overlap.rs#L54-L56"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"The applet-management thread is spawned with a closure returning `anyhow::Result<()>` and the returned `JoinHandle` is dropped immediately, so the `Result` is never inspected. If `runtime::Builder::new_current_thread().enable_all().build()` fails (out of fds, `epoll_create` failure, …) the thread exits silently, `applet_rx` is dropped, and from then on **every** applet launch, socket-pair cleanup and notification-fd request fails silently because the corresponding `send`/`try_send` calls are all discarded with `let _ =`. The panel comes up looking empty with nothing in the log explaining why.","fix":"Build the runtime before spawning (propagating the error out of `main`), or log inside the thread:\n```rust\nstd::thread::spawn(move || {\n    let rt = match runtime::Builder::new_current_thread().enable_all().build() {\n        Ok(rt) => rt,\n        Err(err) => { error!(\"Failed to build applet runtime: {err}\"); return; },\n    };\n    ...\n});\n```","locations":[{"ref":"cosmic-panel-bin/src/main.rs:200-204","code":"  200 |     std::thread::spawn(move || -> anyhow::Result<()> {\n  201 |         let rt = runtime::Builder::new_current_thread().enable_all().build()?;\n  202 |         let mut process_ids: HashMap<String, Vec<ProcessKey>> = HashMap::new();\n  203 | \n  204 |         rt.block_on(async move {","lines":5,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/main.rs#L200-L204"},{"ref":"cosmic-panel-bin/src/main.rs:310-313","code":"  310 |         });\n  311 | \n  312 |         Ok(())\n  313 |     });","lines":4,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/main.rs#L310-L313"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"In the \"panel is autohidden, just clear the surface\" path, `egl_surface.swap_buffers` is only reached inside `if let Ok(sync_point) = frame.finish()`. If `finish()` fails the error is dropped on the floor, no buffer is swapped, yet `wl_surface.commit()` is still issued, the damage tracker is reset, and both `self.is_dirty` and `self.has_frame` are cleared before returning `Ok(())`. The caller therefore believes the hide frame was presented; nothing will ever retry, and the panel stays on screen with stale contents until some unrelated event marks it dirty again.","fix":"Propagate the failure and leave the dirty flags alone so the next iteration retries:\n```rust\nlet sync_point = frame.finish().map_err(|e| anyhow::anyhow!(\"Failed to finish clear frame: {e:?}\"))?;\nif let Err(err) = sync_point.wait() {\n    tracing::error!(\"Error waiting for sync point: {:?}\", err);\n}\ndrop(f);\negl_surface.swap_buffers(None)?;\n```","locations":[{"ref":"cosmic-panel-bin/src/space/render.rs:156-175","code":"  156 |                 if let Ok(sync_point) = frame.finish() {\n  157 |                     if let Err(err) = sync_point.wait() {\n  158 |                         tracing::error!(\"Error waiting for sync point: {:?}\", err);\n  159 |                     }\n  160 |                     drop(f);\n  161 |                     egl_surface.swap_buffers(None)?;\n  162 |                 }\n  163 |                 let wl_surface = self.layer.as_ref().unwrap().wl_surface();\n  164 |                 wl_surface.frame(qh, wl_surface.clone());\n  165 |                 wl_surface.commit();\n  166 |                 // reset the damage tracker\n  167 |                 *my_renderer = OutputDamageTracker::new(\n  168 |                     dim,\n  169 |                     self.scale,\n  170 |                     smithay::utils::Transform::Flipped180,\n  171 |                 );\n  172 | \n  173 |                 self.is_dirty = false;\n  174 |                 self.has_frame = false;\n  175 |                 return Ok(());","lines":20,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/render.rs#L156-L175"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"very_easy","description":"`SpaceContainer::reposition_popup` returns an error even on success: after `space.reposition_popup(...)?` succeeds,\ncontrol falls through to the unconditional `anyhow::bail!(\"Failed to find popup with matching client id\")`. Every\nsuccessful reposition is therefore reported as a failure with a misleading message. It is currently masked because\nthe only caller does `let _ = self.space.reposition_popup(...)` (`xdg_shell_wrapper/server/handlers/xdg_shell.rs:102`),\nbut any future error handling (or logging) will be wrong.","fix":"Return the inner result instead of falling through. Before:\n\n```rust\nif let Some(space) = space_for_client_mut(&mut self.space_list, p_client.as_ref()) {\n    space.reposition_popup(popup, positioner_state, token)?\n}\nanyhow::bail!(\"Failed to find popup with matching client id\")\n```\n\nAfter:\n\n```rust\nif let Some(space) = space_for_client_mut(&mut self.space_list, p_client.as_ref()) {\n    space.reposition_popup(popup, positioner_state, token)\n} else {\n    anyhow::bail!(\"Failed to find popup with matching client id\")\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/space_container/wrapper_space.rs:379-385","code":"  379 |         let p_client = popup.wl_surface().client().map(|c| c.id());\n  380 | \n  381 |         if let Some(space) = space_for_client_mut(&mut self.space_list, p_client.as_ref()) {\n  382 |             space.reposition_popup(popup, positioner_state, token)?\n  383 |         }\n  384 |         anyhow::bail!(\"Failed to find popup with matching client id\")\n  385 |     }","lines":7,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space_container/wrapper_space.rs#L379-L385"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`space.handle_events(..)` - the call that performs all layout, focus and rendering work for every panel each iteration - has its result discarded with `let _ =`. Any failure (render error, missing display handle, applet spawn failure) is invisible: no log line, no recovery, the loop just spins and the panel appears frozen.","fix":"```rust\nif let Err(err) = space.handle_events(..) {\n    tracing::error!(?err, \"error handling events\");\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/mod.rs:145-154","code":"  145 |             let _ = space.handle_events(\n  146 |                 &s_dh,\n  147 |                 &global_state.client_state.queue_handle,\n  148 |                 &mut global_state.server_state.popup_manager,\n  149 |                 global_state.start_time.elapsed().as_millis().try_into()?,\n  150 |                 // Fallback frame-callback throttle for embedded applets;\n  151 |                 // panels override it with the frame duration of their own\n  152 |                 // output (see `PanelSpace::render`).\n  153 |                 Some(Duration::from_millis(16)),\n  154 |             );","lines":10,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/mod.rs#L145-L154"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"Several fallible operations in `main` are silently discarded: `let _ = c.write_entries();` twice (a failure to persist the recovered/migrated panel configuration is invisible, so the same errors reappear on every start), `let _ = process_manager.set_restart_mode(..)` and `let _ = process_manager.set_max_restarts(999999)` (if these fail, applets get default restart behaviour with no indication), and `let _ = calloop_tx.send(PanelCalloopMsg::ClientSocketPair(client_id))` (a failed send means the client's socket pair is never cleaned up).","fix":"Replace each `let _ = ...` with an `if let Err(err) = ... { error!(\"...: {err}\"); }` (or `.inspect_err(|err| error!(..))`) so failures are at least visible in the journal.","locations":[{"ref":"cosmic-panel-bin/src/main.rs:99","code":"   99 |                 let _ = c.write_entries();","lines":1,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/main.rs#L99"},{"ref":"cosmic-panel-bin/src/main.rs:110-112","code":"  110 |     if cosmic_panel_config::NEEDS_MIGRATION.swap(false, std::sync::atomic::Ordering::Relaxed) {\n  111 |         let _ = config.write_entries();\n  112 |     }","lines":3,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/main.rs#L110-L112"},{"ref":"cosmic-panel-bin/src/main.rs:206-211","code":"  206 |             let _ = process_manager\n  207 |                 .set_restart_mode(launch_pad::RestartMode::ExponentialBackoff(\n  208 |                     Duration::from_millis(2),\n  209 |                 ))\n  210 |                 .await;\n  211 |             let _ = process_manager.set_max_restarts(999999).await;","lines":6,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/main.rs#L206-L211"},{"ref":"cosmic-panel-bin/src/main.rs:284-286","code":"  284 |                     space::AppletMsg::ClientSocketPair(client_id) => {\n  285 |                         let _ = calloop_tx.send(PanelCalloopMsg::ClientSocketPair(client_id));\n  286 |                     },","lines":3,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/main.rs#L284-L286"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`configure_panel_popup` returns immediately when `renderer` is `None`, silently discarding the entire configure event - including the `wrapper_rectangle` update and the `s.send_configure()` that propagates the compositor's chosen size to the embedded applet. Nothing re-delivers the configure later, so a popup that gets configured before the panel's renderer exists is left with a stale size and an applet that never learns its geometry. Only the lazy `EGLSurface` creation actually needs the renderer.","fix":"Do not early-return. Perform the size/state/`send_configure` bookkeeping unconditionally and guard only the `EGLSurface` creation:\n```rust\nif p.egl_surface.is_none()\n    && let Some(renderer) = renderer.as_deref_mut()\n{\n    // ... create the EGL surface\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/space/popup.rs:59-62","code":"   59 |     ) {\n   60 |         let Some(renderer) = renderer else {\n   61 |             return;\n   62 |         };","lines":4,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/popup.rs#L59-L62"}]},
{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`SpaceContainer::update_output` discards the per-space result with `let _ = s.update_output(...)`. `PanelSpace::update_output`\ncan only return `Ok(true)` today, but the container also derives its own `found` flag from the loop, and the\nhandler in `xdg_shell_wrapper/client/handlers/output.rs:110-129` reacts to `Ok(false)` by calling `new_output` again -\na path that currently destroys the panel (see the `new_output` finding). Swallowing the inner result means a future\nfailure to reconfigure a single panel is invisible.","fix":"Log or propagate:\n\n```rust\nif let Err(err) = s.update_output(c_output.clone(), s_output.clone(), info.clone()) {\n    tracing::error!(?err, \"failed to update output for panel {}\", s.config.name);\n} else {\n    found = true;\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/space_container/wrapper_space.rs:785-794","code":"  785 |         let mut found = false;\n  786 |         for s in &mut self.space_list {\n  787 |             if s.output.as_ref().map(|o| &o.0) == Some(&c_output) {\n  788 |                 let _ = s.update_output(c_output.clone(), s_output.clone(), info.clone());\n  789 |                 found = true;\n  790 |             }\n  791 |         }\n  792 |         self.apply_toplevel_changes();\n  793 | \n  794 |         Ok(found)","lines":10,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space_container/wrapper_space.rs#L785-L794"}]},
{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"`CosmicWorkspaces::hide` discards the DBus result with `let _ = proxy.hide().await;`. If `com.system76.CosmicWorkspaces` is not running or the call is rejected, the overlay stays open and nothing is logged, making the \"panel button does not close the workspaces overlay\" class of bug undiagnosable.","fix":"Log the failure. Before:\n```rust\nlet _ = proxy.hide().await;\n```\nAfter:\n```rust\nif let Err(err) = proxy.hide().await {\n    tracing::warn!(?err, \"Failed to hide the workspaces overlay\");\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/workspaces_dbus.rs:67-72","code":"   67 |     pub fn hide(&self) {\n   68 |         let proxy = self.proxy.clone();\n   69 |         self.runtime.spawn(async move {\n   70 |             let _ = proxy.hide().await;\n   71 |         });\n   72 |     }","lines":6,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/workspaces_dbus.rs#L67-L72"}]},
{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`send_request` silently drops the `WritePipe` when neither branch matches (DnD with no `seat.server.dnd_source`, or a selection request with no `seat.server.selection_source`) and discards the result of `request_data_device_client_selection` with `_ =`. The requesting client just sees an empty transfer with no indication of why, which makes \"paste produced nothing\" impossible to diagnose from logs.","fix":"Log both failure modes:\n```rust\n} else if seat.server.selection_source.is_some() {\n    if let Err(err) = request_data_device_client_selection(&seat.server.seat, mime, fd.into()) {\n        tracing::warn!(?err, \"Failed to forward selection request\");\n    }\n} else {\n    tracing::warn!(is_dnd, \"No server source to forward the data request to\");\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/data_device/data_source.rs:41-49","code":"   41 |         // TODO write from server source to fd\n   42 |         // could be a selection source or a dnd source\n   43 |         if is_dnd {\n   44 |             if let Some(dnd_source) = seat.server.dnd_source.as_ref() {\n   45 |                 dnd_source.send(mime, fd.as_fd());\n   46 |             }\n   47 |         } else if seat.server.selection_source.as_ref().is_some() {\n   48 |             _ = request_data_device_client_selection(&seat.server.seat, mime, fd.into());\n   49 |         }","lines":9,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/data_device/data_source.rs#L41-L49"}]},
{"id":"ERR_10","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"If `UnixStream::connect_addr(&addr)` fails, `create_listener` returns early with `?` after the `wp_security_context_v1` object has already been created and both fds have been handed to the compositor. The proxy is never `destroy()`ed and, because the local pipe ends are then both dropped without a correct hangup handshake, the compositor may keep the listening socket around with no owner. The error path leaves an orphaned listener rather than tearing the context down.","fix":"Wrap the tail in a closure / use a scope guard so that on any error after the object has been created you call `wp_security_context.destroy()` and drop the pipe write end before returning the error.","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/wp_security_context.rs:57-75","code":"   57 |         let listener = UnixListener::bind_addr(&addr)?;\n   58 |         let wp_security_context: WpSecurityContextV1 = self.manager.create_listener(\n   59 |             listener.as_fd(),\n   60 |             close_fd.as_fd(),\n   61 |             qh,\n   62 |             SecurityContext { conn: Arc::new(Mutex::new(None)) },\n   63 |         );\n   64 |         let conn = UnixStream::connect_addr(&addr)?;\n   65 |         // XXX make sure no one else can connect to the listener\n   66 |         drop(close_fd_ours);\n   67 | \n   68 |         // we need to store the connection somewhere\n   69 |         {\n   70 |             let data = wp_security_context.data::<SecurityContext>().unwrap();\n   71 |             let mut guard = data.conn.lock().unwrap();\n   72 |             *guard = Some((conn, listener));\n   73 |         }\n   74 | \n   75 |         Ok(wp_security_context)","lines":19,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/wp_security_context.rs#L57-L75"}]},
{"id":"ERR_11","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"The cursor buffer upload retry loop tries `write_and_attach_buffer` up to five times, logs each failure at\n`info!` level, and if all five attempts fail simply falls off the end of the loop with no warning and no cursor\nchange - the user is left with whatever cursor was previously set. Worse, when `buf` holds\n`BufferAssignment::Removed`, `write_and_attach_buffer` takes its final branch which *commits a null buffer to the\ncursor surface and then bails*, so all five iterations re-run the same unconditional failure, committing the\ncursor surface five times in a row for no reason.","fix":"Match on the `BufferAssignment` before entering the loop so the `Removed` case is handled once\n(`ptr.set_cursor(last_enter, None, 0, 0)`), and escalate the final failure to `warn!`:\n```rust\nif attempts_exhausted {\n    tracing::warn!(\"failed to attach cursor buffer after 5 attempts\");\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/mod.rs:160-171","code":"  160 |                         for ctr in 0..5 {\n  161 |                             if let Err(e) = write_and_attach_buffer(\n  162 |                                 buf.as_ref().unwrap(),\n  163 |                                 cursor_surface,\n  164 |                                 ctr,\n  165 |                                 multipool,\n  166 |                             ) {\n  167 |                                 info!(\"failed to attach buffer to cursor surface: {}\", e);\n  168 |                             } else {\n  169 |                                 break;\n  170 |                             }\n  171 |                         }","lines":12,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/mod.rs#L160-L171"},{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/util.rs:92-98","code":"   92 |         }\n   93 |     } else {\n   94 |         cursor_surface.attach(None, 0, 0);\n   95 |         cursor_surface.damage(0, 0, i32::MAX, i32::MAX);\n   96 |         cursor_surface.commit();\n   97 |         bail!(\"Missing new buffer.\")\n   98 |     }","lines":7,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/util.rs#L92-L98"}]},
{"id":"ERR_12","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`XdgShellHandler::grab` and `XdgShellHandler::reposition_request` discard the space's result with `let _ = ...`.\nIf `grab_popup` or `reposition_popup` fails (e.g. the popup is no longer in the space, or the client-side grab is\nrefused by the host compositor), nothing is logged and, in the `grab` case, the code goes on to hide the workspace\noverview as though the grab had succeeded. Silent failures here manifest as popups that stay open forever or that\nnever move, with no diagnostic.","fix":"Log and, for `grab`, bail out before hiding the overview:\n```rust\nif let Err(err) = self.space.grab_popup(surface, seat_pair.client._seat.clone(), serial) {\n    tracing::warn!(\"Failed to grab popup: {err}\");\n    return;\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/xdg_shell.rs:81-104","code":"   81 |     fn grab(&mut self, surface: PopupSurface, seat: wl_seat::WlSeat, _serial: Serial) {\n   82 |         let seat = Seat::from_resource(&seat).unwrap();\n   83 |         let Some(seat_pair) = self.server_state.seats.iter().find(|s| s.server.seat == seat) else {\n   84 |             return;\n   85 |         };\n   86 |         let _ = self.space.grab_popup(\n   87 |             surface,\n   88 |             seat_pair.client._seat.clone(),\n   89 |             seat_pair.client.get_serial_of_last_seat_event(),\n   90 |         );\n   91 |         if let Some(cosmic_workspaces) = &self.space.shared.cosmic_workspaces {\n   92 |             cosmic_workspaces.hide();\n   93 |         }\n   94 |     }\n   95 | \n   96 |     fn reposition_request(\n   97 |         &mut self,\n   98 |         surface: PopupSurface,\n   99 |         positioner: PositionerState,\n  100 |         token: u32,\n  101 |     ) {\n  102 |         let _ = self.space.reposition_popup(surface.clone(), positioner, token);\n  103 |         self.server_state.popup_manager.commit(surface.wl_surface());\n  104 |     }","lines":24,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/xdg_shell.rs#L81-L104"}]},
{"id":"ERR_13","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`CosmicPanelContainerConfig::write_entries` writes the `entries` index list *first*, then loops writing each\nindividual panel config. If `Config::new(...)` or `entry.write_entry(&config)` fails part-way through, the\nfunction returns `Err` but the already-written `entries` key now advertises panel profiles whose config files\nwere never created. On the next `load_from_config`, `CosmicPanelConfig::get_entry` for those names falls back to\n`CosmicPanelConfig::default()` (name `\"\"`, `size: M`, `opacity: 0.8`), silently replacing the user's panel with a\ndefault one rather than reporting a missing profile.","fix":"Write the individual entries first and only update the `entries` index once they have all succeeded:\n```rust\npub fn write_entries(&self) -> Result<(), cosmic_config::Error> {\n    let config = Self::cosmic_config()?;\n    for entry in &self.config_list {\n        let entry_config = Config::new(format!(\"{}.{}\", NAME, entry.name).as_str(), VERSION)?;\n        entry.write_entry(&entry_config)?;\n    }\n    config.set(\"entries\", self.config_list.iter().map(|c| c.name.clone()).collect::<Vec<_>>())\n}\n```","locations":[{"ref":"cosmic-panel-config/src/container_config.rs:119-128","code":"  119 |     pub fn write_entries(&self) -> Result<(), cosmic_config::Error> {\n  120 |         let config = Self::cosmic_config()?;\n  121 |         let entry_names = self.config_list.iter().map(|c| c.name.clone()).collect::<Vec<_>>();\n  122 |         config.set(\"entries\", entry_names)?;\n  123 |         for entry in &self.config_list {\n  124 |             let config = Config::new(format!(\"{}.{}\", NAME, entry.name).as_str(), VERSION)?;\n  125 |             entry.write_entry(&config)?;\n  126 |         }\n  127 |         Ok(())\n  128 |     }","lines":10,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-config/src/container_config.rs#L119-L128"}]},
{"id":"ERR_14","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"negligible","difficulty":"very_easy","description":"The minimize-rectangle notification to the compositor is sent with `_ = self.shared.panel_tx.send(...)`, discarding the `SendError`. If the calloop channel is closed (the event loop is shutting down or the receiver was dropped) every subsequent layout pass silently re-attempts the send, and `self.minimize_applet_rect` / `self.last_minimize_update` are updated as if it had succeeded, so the failure is entirely invisible.","fix":"Before:\n```rust\n_ = self.shared.panel_tx.send(crate::PanelCalloopMsg::MinimizeRect { .. });\n```\nAfter:\n```rust\nif let Err(err) = self.shared.panel_tx.send(crate::PanelCalloopMsg::MinimizeRect { .. }) {\n    tracing::warn!(\"Failed to send MinimizeRect: {err}\");\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/space/layout.rs:735-746","code":"  735 |                         self.minimize_applet_rect = new_rect;\n  736 |                         self.last_minimize_update = Instant::now();\n  737 |                         let output = self.output.as_ref().map(|o| o.1.name()).unwrap_or_default();\n  738 |                         _ = self.shared.panel_tx.send(crate::PanelCalloopMsg::MinimizeRect {\n  739 |                             output,\n  740 |                             applet_info: MinimizeApplet {\n  741 |                                 priority: if is_dock { 1 } else { 0 },\n  742 |                                 rect: new_rect,\n  743 |                                 surface: layer.wl_surface().clone(),\n  744 |                             },\n  745 |                         });\n  746 |                     }","lines":12,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/layout.rs#L735-L746"}]},
{"id":"ERR_15","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"negligible","difficulty":"very_easy","description":"`_ = unsafe { renderer.egl_context().make_current_with_surface(s) };` discards the EGL error. The very next statement calls `s.resize(...)` on that surface, which is only valid if the context was successfully made current - so a failed `make_current` is silently followed by an operation that depends on it. The adjacent `// TODO do we need to have the renderer for` comment is also truncated mid-sentence and conveys nothing.","fix":"Before:\n```rust\nif let Some(s) = p.egl_surface.as_ref() {\n    _ = unsafe { renderer.egl_context().make_current_with_surface(s) };\n    // TODO do we need to have the renderer for\n    s.resize(scaled_size.w.max(1), scaled_size.h.max(1), 0, 0);\n}\n```\nAfter:\n```rust\nif let Some(s) = p.egl_surface.as_ref() {\n    match unsafe { renderer.egl_context().make_current_with_surface(s) } {\n        Ok(()) => { s.resize(scaled_size.w.max(1), scaled_size.h.max(1), 0, 0); },\n        Err(err) => tracing::warn!(\"Failed to make EGL context current for overflow popup: {err}\"),\n    }\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/space/overflow.rs:221-225","code":"  221 |                     if let Some(s) = p.egl_surface.as_ref() {\n  222 |                         _ = unsafe { renderer.egl_context().make_current_with_surface(s) };\n  223 |                         // TODO do we need to have the renderer for\n  224 |                         s.resize(scaled_size.w.max(1), scaled_size.h.max(1), 0, 0);\n  225 |                     }","lines":5,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/overflow.rs#L221-L225"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"easy","description":"`SecurityContextManager::create_listener` swaps the two ends of the `close_fd` pipe. `rustix::pipe::pipe()` returns `(read_end, write_end)`, so `close_fd_ours` is the *read* end and `close_fd` is the *write* end. The code hands the **write** end to the compositor as `close_fd` and then drops the **read** end. Per `wp_security_context_manager_v1.create_listener`, `close_fd` \"is a FD that will signal hangup when the compositor should stop accepting new connections\" - a hangup on a pipe is only observable on the *read* end when all write ends are closed. With the ends swapped the compositor polls a write-end whose only reader is gone, which reports `POLLERR` immediately (and never `POLLHUP`); depending on the compositor's event source this either tears the listener down at once or busy-loops on a level-triggered error that can never be cleared. Additionally the local write end (`close_fd`) is dropped at the end of the function, so there is no longer any way to deliberately signal \"stop listening\".","fix":"Name the ends correctly and pass the read end to the compositor, keeping the write end until the listener should be closed:\n```rust\nlet (close_read, close_write) = smithay::reexports::rustix::pipe::pipe()?;\n// ...\nlet wp_security_context = self.manager.create_listener(\n    listener.as_fd(),\n    close_read.as_fd(),\n    qh,\n    SecurityContext { conn: Arc::new(Mutex::new(None)) },\n);\nlet conn = UnixStream::connect_addr(&addr)?;\n// closing the write end signals hangup so no one else can connect\ndrop(close_write);\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/wp_security_context.rs:53-66","code":"   53 |         let (close_fd_ours, close_fd) = smithay::reexports::rustix::pipe::pipe()?;\n   54 |         let s: String = Alphanumeric.sample_string(&mut rand::rng(), 50);\n   55 |         let addr = SocketAddr::from_abstract_name(s)?;\n   56 |         // this also listens on the socket\n   57 |         let listener = UnixListener::bind_addr(&addr)?;\n   58 |         let wp_security_context: WpSecurityContextV1 = self.manager.create_listener(\n   59 |             listener.as_fd(),\n   60 |             close_fd.as_fd(),\n   61 |             qh,\n   62 |             SecurityContext { conn: Arc::new(Mutex::new(None)) },\n   63 |         );\n   64 |         let conn = UnixStream::connect_addr(&addr)?;\n   65 |         // XXX make sure no one else can connect to the listener\n   66 |         drop(close_fd_ours);","lines":14,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/wp_security_context.rs#L53-L66"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"`update_toplevel` calls `toplevel_mngr.manager.set_rectangle(.., &info.surface, ..)` with the `WlSurface` stored in `minimized_applets` without checking `info.surface.is_alive()`. Entries in `minimized_applets` are never removed (see `space_container.rs:64`, only ever inserted/updated from `set_rectangles`), so after a minimize applet is unloaded or its panel is destroyed the map still holds a dead client-side proxy. Sending a request with a destroyed object argument is a Wayland protocol violation and gets the panel's client connection killed by the compositor. `set_rectangles` does perform an `is_alive()` check (line 61), which makes the omission here an inconsistency rather than a deliberate choice.","fix":"Add `&& info.surface.is_alive()` to the `find` predicate (or check it before calling `set_rectangle`) and prune dead entries from `state.space.minimized_applets` when they are found, e.g. `state.space.minimized_applets.retain(|_, i| i.surface.is_alive());` at the top of both functions.","locations":[{"ref":"cosmic-panel-bin/src/minimize.rs:27-44","code":"   27 |     if let Some((_, info)) = minimized_applets.iter().find(|(output_name, _)| {\n   28 |         toplevel_info.output.iter().any(|o| {\n   29 |             let Some(i) = state.client_state.output_state.info(o) else {\n   30 |                 return false;\n   31 |             };\n   32 |             i.name.as_ref() == Some(output_name)\n   33 |         })\n   34 |     }) {\n   35 |         toplevel_mngr.manager.set_rectangle(\n   36 |             // If cosmic toplevel manager exists, cosmic toplevel info should too\n   37 |             toplevel_info.cosmic_toplevel.as_ref().unwrap(),\n   38 |             &info.surface,\n   39 |             info.rect.loc.x,\n   40 |             info.rect.loc.y,\n   41 |             info.rect.size.w,\n   42 |             info.rect.size.h,\n   43 |         );\n   44 |     }","lines":18,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/minimize.rs#L27-L44"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"`DataSourceHandler::cancelled` only searches `seat.client.dnd_source` and returns early for anything else. `wl_data_source.cancelled` is also delivered for *selection* sources - the protocol states that the source is no longer valid and \"the client should clean up and destroy this data source\". The `CopyPasteSource` created in `new_selection` therefore stays in `seat.client.copy_paste_source` after another client takes the clipboard: the stale `wl_data_source` object is kept alive, `send_request` can still match it and hand out clipboard data the panel no longer owns, and a new `copy_paste_source` is only destroyed when it is eventually overwritten.","fix":"Handle both source kinds, e.g. first try `copy_paste_source`:\n```rust\nif let Some(seat) = self.server_state.seats.iter_mut()\n    .find(|s| s.client.copy_paste_source.as_ref().is_some_and(|s| s.inner() == source))\n{\n    seat.client.copy_paste_source = None; // Drop destroys the wl_data_source\n    seat.server.selection_source = None;\n    return;\n}\n```\nbefore falling through to the existing DnD handling.","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/data_device/data_source.rs:71-100","code":"   71 |     fn cancelled(\n   72 |         &mut self,\n   73 |         conn: &sctk::reexports::client::Connection,\n   74 |         qh: &sctk::reexports::client::QueueHandle<Self>,\n   75 |         source: &WlDataSource,\n   76 |     ) {\n   77 |         let seat = match self.server_state.seats.iter_mut().find(|seat| {\n   78 |             seat.client.dnd_source.iter().any(|dnd_source| dnd_source.inner() == source)\n   79 |         }) {\n   80 |             Some(seat) => seat,\n   81 |             None => return,\n   82 |         };\n   83 | \n   84 |         // cancel client DnD\n   85 |         if let Some(dnd_source) = seat.client.dnd_source.take() {\n   86 |             dnd_source.inner().destroy();\n   87 |             seat.client.dnd_icon = None;\n   88 |             seat.client.next_dnd_offer_is_mine = false;\n   89 |         }\n   90 | \n   91 |         if let Some(dnd_source) = seat.server.dnd_source.take() {\n   92 |             dnd_source.cancelled();\n   93 |             seat.server.dnd_icon = None;\n   94 |             seat.server.seat.get_pointer().unwrap().unset_grab(\n   95 |                 self,\n   96 |                 SERIAL_COUNTER.next_serial(),\n   97 |                 0,\n   98 |             );\n   99 |         }\n  100 |     }","lines":30,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/data_device/data_source.rs#L71-L100"}]},
{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"All three manager requests silently drop the `New<..>` object id when the lookup fails: `GetCornerRadius` when `get_toplevel` returns `None`, `GetCornerRadiusSurface` when the xdg surface matches neither a toplevel nor a popup, and `GetCornerRadiusLayer` when no layer surface matches. A `new_id` argument must always be initialised (or the client killed with a protocol error); dropping the `New` leaves the client believing it owns an object that the server never created, so every subsequent request on it is an \"invalid object\" protocol error at an unrelated point in time. The `// TODO: can this fail?` comments show this was never resolved.","fix":"In each `else` branch either `data_init.init(id, ..)` an inert object (and have its requests be no-ops) or `resource.post_error(..)` with a suitable error code before returning, so the object id is never left uninitialised.","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/cosmic_corner_radius.rs:118-128","code":"  118 |             cosmic_corner_radius_manager_v1::Request::GetCornerRadius { id, toplevel } => {\n  119 |                 if let Some(surface) = state.xdg_shell_state().get_toplevel(&toplevel) {\n  120 |                     new_xdg(\n  121 |                         surface.wl_surface(),\n  122 |                         CornerRadiusSurface::Toplevel(surface.xdg_toplevel().downgrade()),\n  123 |                         resource,\n  124 |                         data_init,\n  125 |                         id,\n  126 |                     )\n  127 |                 } // TODO: can this fail?\n  128 |             },","lines":11,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/cosmic_corner_radius.rs#L118-L128"},{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/cosmic_corner_radius.rs:129-161","code":"  129 |             cosmic_corner_radius_manager_v1::Request::GetCornerRadiusSurface { id, surface } => {\n  130 |                 if let Some(toplevel) =\n  131 |                     state.xdg_shell_state().toplevel_surfaces().iter().find(|toplevel| {\n  132 |                         toplevel\n  133 |                             .xdg_toplevel()\n  134 |                             .data::<XdgShellSurfaceUserData>()\n  135 |                             .unwrap()\n  136 |                             .xdg_surface()\n  137 |                             == &surface\n  138 |                     })\n  139 |                 {\n  140 |                     new_xdg(\n  141 |                         toplevel.wl_surface(),\n  142 |                         CornerRadiusSurface::Toplevel(toplevel.xdg_toplevel().downgrade()),\n  143 |                         resource,\n  144 |                         data_init,\n  145 |                         id,\n  146 |                     )\n  147 |                 } else if let Some(popup) =\n  148 |                     state.xdg_shell_state().popup_surfaces().iter().find(|popup| {\n  149 |                         popup.xdg_popup().data::<XdgShellSurfaceUserData>().unwrap().xdg_surface()\n  150 |                             == &surface\n  151 |                     })\n  152 |                 {\n  153 |                     new_xdg(\n  154 |                         popup.wl_surface(),\n  155 |                         CornerRadiusSurface::Popup(popup.xdg_popup().downgrade()),\n  156 |                         resource,\n  157 |                         data_init,\n  158 |                         id,\n  159 |                     )\n  160 |                 }\n  161 |             },","lines":33,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/cosmic_corner_radius.rs#L129-L161"},{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/cosmic_corner_radius.rs:162-205","code":"  162 |             cosmic_corner_radius_manager_v1::Request::GetCornerRadiusLayer { id, layer } => {\n  163 |                 if let Some(surface) = state\n  164 |                     .shell_state()\n  165 |                     .layer_surfaces()\n  166 |                     .find(|surface| surface.shell_surface() == &layer)\n  167 |                 {\n  168 |                     let radius_exists = with_states(surface.wl_surface(), |surface_data| {\n  169 |                         let hook_id = surface_data\n  170 |                             .data_map\n  171 |                             .get_or_insert_threadsafe(|| ToplevelHookId::new(None));\n  172 |                         let guard = hook_id.lock().unwrap();\n  173 |                         guard.as_ref().map(|(_, t)| t.upgrade().is_ok())\n  174 |                     });\n  175 |                     if radius_exists.unwrap_or_default() {\n  176 |                         resource.post_error(\n  177 |                             cosmic_corner_radius_manager_v1::Error::CornerRadiusExists as u32,\n  178 |                             format!(\n  179 |                                 \"{resource:?} CosmicCornerRadiusToplevelV1 object already exists \\\n  180 |                                  for the surface\"\n  181 |                             ),\n  182 |                         );\n  183 |                     }\n  184 |                     let data = Mutex::new(CornerRadiusInternal {\n  185 |                         surface: CornerRadiusSurface::Layer(layer.downgrade()),\n  186 |                         corners: None,\n  187 |                         padding: None,\n  188 |                     });\n  189 |                     let obj = data_init.init(id, data);\n  190 |                     let obj_downgrade = obj.downgrade();\n  191 | \n  192 |                     let needs_hook = radius_exists.is_none();\n  193 |                     if needs_hook {\n  194 |                         let hook_id =\n  195 |                             add_pre_commit_hook::<D, _>(surface.wl_surface(), layer_radius_hook);\n  196 |                         with_states(surface.wl_surface(), |surface_data| {\n  197 |                             let hook_ids = surface_data\n  198 |                                 .data_map\n  199 |                                 .get_or_insert_threadsafe(|| LayerHookId::new(None));\n  200 |                             let mut guard = hook_ids.lock().unwrap();\n  201 |                             *guard = Some((hook_id, obj_downgrade));\n  202 |                         });\n  203 |                     }\n  204 |                 } // TODO: can this fail?\n  205 |             },","lines":44,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/cosmic_corner_radius.rs#L162-L205"}]},
{"id":"API_5","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"`c_wl_surface.set_buffer_scale(self.scale as i32)` truncates the fractional scale toward zero. `wl_surface.set_buffer_scale` requires a *positive* integer; a value of `0` (or negative) is a `wl_surface.error.invalid_scale` protocol error that kills the client. `self.scale` is an `f64` that carries fractional values (it is fed to `to_physical(self.scale)` throughout this file), so `1.5` silently becomes `1` and a hypothetical sub-1 scale becomes `0`.","fix":"Before:\n```rust\nif fractional_scale.is_none() {\n    c_wl_surface.set_buffer_scale(self.scale as i32);\n}\n```\nAfter:\n```rust\nif fractional_scale.is_none() {\n    c_wl_surface.set_buffer_scale((self.scale.round() as i32).max(1));\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/space/overflow.rs:111-113","code":"  111 |         if fractional_scale.is_none() {\n  112 |             c_wl_surface.set_buffer_scale(self.scale as i32);\n  113 |         }","lines":3,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/overflow.rs#L111-L113"}]},
{"id":"API_6","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`close_popups` collects clones of the `xdg_popup` and `wl_surface` proxies and destroys them after the `retain_mut` pass. But `Vec::retain_mut` drops the removed `WrapperPopup`s *during* the pass, and sctk's `Popup` -> `PopupInner`/`XdgShellSurface`/`Surface` `Drop` chain already sends `xdg_popup.destroy()`, `xdg_surface.destroy()` and `wl_surface.destroy()`. Both `popup.destroy()` and `surface.destroy()` in the loop are therefore requests on already-destroyed objects. wayland-rs swallows these silently today, but relying on that is fragile, and the code reads as if it were responsible for the teardown when it is not - which is exactly why the genuinely-needed `fractional_scale`/`viewport` destroys are missing here.","fix":"Drop the `popup.destroy()` / `surface.destroy()` calls, keep the surface only for the focus-list `retain` filters, and let `PanelPopup`/sctk `Drop` do the protocol teardown (after adding the missing `viewport`/`fractional_scale` destroys to `PanelPopup::drop`).","locations":[{"ref":"cosmic-panel-bin/src/space/popup.rs:39-51","code":"   39 |         for (popup, surface, s_surface) in to_destroy {\n   40 |             self.shared.c_focused_surface.borrow_mut().retain(|s| s.0 != surface);\n   41 |             self.shared.c_hovered_surface.borrow_mut().retain(|s| s.0 != surface);\n   42 | \n   43 |             if let Some(s_surface) = s_surface {\n   44 |                 self.s_focused_surface\n   45 |                     .retain(|s| !s.0.wl_surface().is_some_and(|s| s.as_ref() == &s_surface));\n   46 |                 self.s_hovered_surface\n   47 |                     .retain(|s| !s.surface.wl_surface().is_some_and(|s| s.as_ref() == &s_surface));\n   48 |             }\n   49 |             popup.destroy();\n   50 |             surface.destroy();\n   51 |         }","lines":13,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/popup.rs#L39-L51"}]},
{"id":"API_7","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"`cancelled` explicitly calls `dnd_source.inner().destroy()` on the `DragSource` it just took out of the seat, and then lets the `DragSource` drop at the end of the block - sctk's `impl Drop for DragSource` calls `self.inner.destroy()` a second time. wayland-rs swallows the request to the already-dead object, so nothing breaks today, but the code documents an incorrect ownership model and would produce a real protocol error if the id were recycled.","fix":"Let the `Drop` impl do the destroying. Before:\n```rust\nif let Some(dnd_source) = seat.client.dnd_source.take() {\n    dnd_source.inner().destroy();\n    seat.client.dnd_icon = None;\n    seat.client.next_dnd_offer_is_mine = false;\n}\n```\nAfter:\n```rust\nif seat.client.dnd_source.take().is_some() {\n    seat.client.dnd_icon = None;\n    seat.client.next_dnd_offer_is_mine = false;\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/data_device/data_source.rs:84-89","code":"   84 |         // cancel client DnD\n   85 |         if let Some(dnd_source) = seat.client.dnd_source.take() {\n   86 |             dnd_source.inner().destroy();\n   87 |             seat.client.dnd_icon = None;\n   88 |             seat.client.next_dnd_offer_is_mine = false;\n   89 |         }","lines":6,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/data_device/data_source.rs#L84-L89"}]},
{"id":"API_8","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`XdgShellHandler::grab` ignores the serial the client passed (the parameter is named `_serial`, with a\n`// TODO: Validate serial` comment) and instead forwards\n`seat_pair.client.get_serial_of_last_seat_event()` to the host compositor. The xdg-shell protocol requires the\ncompositor to validate that the serial corresponds to a recent input event that the client actually received;\nskipping that check lets any embedded applet steal a popup grab at an arbitrary time (e.g. replaying a stale\nserial or passing garbage), and lets it do so with a serial it never saw.","fix":"Validate the client's serial against the seat's recent event serials before translating it, and send\n`xdg_popup.popup_done` / raise `xdg_wm_base.invalid_grab` when it does not match, e.g.\n```rust\nif !seat_pair.server.seat.validate_grab_serial(serial) {\n    surface.send_popup_done();\n    return;\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/xdg_shell.rs:80-94","code":"   80 |     // TODO: Validate serial\n   81 |     fn grab(&mut self, surface: PopupSurface, seat: wl_seat::WlSeat, _serial: Serial) {\n   82 |         let seat = Seat::from_resource(&seat).unwrap();\n   83 |         let Some(seat_pair) = self.server_state.seats.iter().find(|s| s.server.seat == seat) else {\n   84 |             return;\n   85 |         };\n   86 |         let _ = self.space.grab_popup(\n   87 |             surface,\n   88 |             seat_pair.client._seat.clone(),\n   89 |             seat_pair.client.get_serial_of_last_seat_event(),\n   90 |         );\n   91 |         if let Some(cosmic_workspaces) = &self.space.shared.cosmic_workspaces {\n   92 |             cosmic_workspaces.hide();\n   93 |         }\n   94 |     }","lines":15,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/xdg_shell.rs#L80-L94"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"high","difficulty":"medium","description":"`PanelRenderElement` implements `smithay::backend::renderer::element::Element` by hand but only forwards `id`, `current_commit`, `src` and `geometry`. The trait methods `damage_since`, `opaque_regions`, `transform`, `alpha` and `kind` are left at their trait defaults. The default `damage_since` returns *the whole element geometry* whenever the commit counter differs, so every applet surface that commits a 1-pixel change reports its full rectangle as damage to `OutputDamageTracker::render_output`. Fine-grained per-surface damage that `WaylandSurfaceRenderElement` already computes is thrown away, which defeats the entire point of the damage-tracked render path. The default `opaque_regions` returns an empty set, so the tracker can never skip occluded elements or the background, and the default `transform` returns `Transform::Normal`, which silently mis-renders any client that sets a non-normal `wl_surface` buffer transform.","fix":"Either generate the enum with smithay's `render_elements!` macro (which forwards every method), or add explicit forwarding arms for `damage_since`, `opaque_regions`, `transform`, `alpha` and `kind`, e.g.\n```rust\nfn damage_since(\n    &self,\n    scale: smithay::utils::Scale<f64>,\n    commit: Option<smithay::backend::renderer::utils::CommitCounter>,\n) -> smithay::backend::renderer::element::utils::DamageSet<i32, Physical> {\n    match self {\n        Self::Wayland(e) => e.damage_since(scale, commit),\n        Self::Crop(e) => e.damage_since(scale, commit),\n        // keep the existing scale hack for iced elements\n        Self::Iced(e) => e.damage_since(1.0.into(), commit),\n    }\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/space/render.rs:35-94","code":"   35 | impl smithay::backend::renderer::element::Element for PanelRenderElement {\n   36 |     fn id(&self) -> &smithay::backend::renderer::element::Id {\n   37 |         match self {\n   38 |             Self::Wayland(e, ..) => e.id(),\n   39 |             Self::Crop(e) => e.id(),\n   40 |             Self::Iced(e) => e.id(),\n   41 |         }\n   42 |     }\n   43 | \n   44 |     fn current_commit(&self) -> smithay::backend::renderer::utils::CommitCounter {\n   45 |         match self {\n   46 |             Self::Wayland(e, ..) => e.current_commit(),\n   47 |             Self::Crop(e) => e.current_commit(),\n   48 |             Self::Iced(e) => e.current_commit(),\n   49 |         }\n   50 |     }\n   51 | \n   52 |     fn src(&self) -> Rectangle<f64, Buffer> {\n   53 |         match self {\n   54 |             Self::Wayland(e) => e.src(),\n   55 |             Self::Crop(e) => e.src(),\n   56 |             Self::Iced(e) => e.src(),\n   57 |         }\n   58 |     }\n   59 | \n   60 |     fn geometry(&self, scale: smithay::utils::Scale<f64>) -> Rectangle<i32, Physical> {\n   61 |         match self {\n   62 |             Self::Wayland(e) => e.geometry(scale),\n   63 |             Self::Crop(e) => e.geometry(scale),\n   64 |             // XXX hack don't know how else to avoid scaling twice\n   65 |             Self::Iced(e) => e.geometry(1.0.into()),\n   66 |         }\n   67 |     }\n   68 | }\n   69 | \n   70 | impl RenderElement<GlesRenderer> for PanelRenderElement {\n   71 |     fn draw(\n   72 |         &self,\n   73 |         frame: &mut GlesFrame<'_, '_>,\n   74 |         src: Rectangle<f64, Buffer>,\n   75 |         dst: Rectangle<i32, Physical>,\n   76 |         damage: &[Rectangle<i32, Physical>],\n   77 |         opaque_regions: &[Rectangle<i32, Physical>],\n   78 |         cache: Option<&UserDataMap>,\n   79 |     ) -> Result<(), GlesError> {\n   80 |         match self {\n   81 |             Self::Wayland(e, ..) => e.draw(frame, src, dst, damage, opaque_regions, cache),\n   82 |             Self::Crop(e) => e.draw(frame, src, dst, damage, opaque_regions, cache),\n   83 |             Self::Iced(e) => e.draw(frame, src, dst, damage, opaque_regions, cache),\n   84 |         }\n   85 |     }\n   86 | \n   87 |     fn underlying_storage(&self, renderer: &mut GlesRenderer) -> Option<UnderlyingStorage<'_>> {\n   88 |         match self {\n   89 |             PanelRenderElement::Wayland(e, ..) => e.underlying_storage(renderer),\n   90 |             PanelRenderElement::Crop(e) => e.underlying_storage(renderer),\n   91 |             PanelRenderElement::Iced(e) => e.underlying_storage(renderer),\n   92 |         }\n   93 |     }\n   94 | }","lines":60,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/render.rs#L35-L94"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"high","difficulty":"easy","description":"At the end of every `render()` call, if an overflow popup is open, `update_hidden_applet_frame()` is invoked. That helper (`layout.rs`) sets `self.is_dirty = true` **and** `self.needs_layout = true` for every window parked in an overflow space. Because `is_dirty`/`needs_layout` are the two flags that gate re-rendering and re-layout, the panel enters a self-sustaining loop: render -> mark dirty -> render again on the next frame callback -> mark dirty ... At the same time `handle_events` will run a full `layout_()` pass every iteration because `needs_layout` is set. So simply having an overflow popup open pins the panel to a full relayout plus a full redraw at the display refresh rate. `main.rs` already drives `update_hidden_applet_frame()` from a 1-second calloop timer, which is the intended pacing, making this per-frame call redundant as well as harmful.","fix":"Remove the call from `render()` and rely on the existing 1 s timer in `main.rs`, or, if a faster cadence is needed while the popup is open, make `update_hidden_applet_frame()` only call `send_frame`/`refresh` and stop setting `self.is_dirty` / `self.needs_layout`.","locations":[{"ref":"cosmic-panel-bin/src/space/render.rs:536-538","code":"  536 |         if self.overflow_popup.as_ref().is_some_and(|p| p.0.c_popup.wl_surface().is_alive()) {\n  537 |             self.update_hidden_applet_frame();\n  538 |         }","lines":3,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/render.rs#L536-L538"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`render_elements` unconditionally re-rasterizes the entire iced scene on every render pass, even when `update(force)` returned early because nothing changed. Per element, per frame it: allocates a fresh `tiny_skia::Mask` of `size.w * size.h` bytes, allocates a `Vec` for the damage list, calls `buffer.render().draw(..)` which forces smithay to mark the whole `MemoryRenderBuffer` damaged, and runs `iced_tiny_skia`'s full-viewport `renderer.draw(..)`. `space/render.rs` calls this for the background element and for every overflow button/popup on each redraw, so a hover animation or a per-second clock tick repaints pixels that are provably identical to the previous frame.","fix":"Track a dirty flag: have `IcedElementInternal::update` report whether `State::update` actually rebuilt the UI, store it in the struct, and skip the whole `buffer.render().draw(..)` block when the element is clean and the buffer already holds a valid frame. Cache the `tiny_skia::Mask` alongside the `MemoryRenderBuffer` in `buffers` instead of allocating it per frame, and return the real sub-rect damage from the `draw` closure so smithay's damage tracking can skip untouched regions.","locations":[{"ref":"cosmic-panel-bin/src/iced/mod.rs:900-943","code":"  900 |         if let Some((buffer, _)) = internal_ref.buffers.get_mut(&OrderedFloat(scale.x)) {\n  901 |             let size: Size<i32, BufferCoords> =\n  902 |                 internal_ref.size.to_f64().to_buffer(scale.x, Transform::Normal).to_i32_round();\n  903 |             if size.w > 0 && size.h > 0 {\n  904 |                 let state_ref = &internal_ref.state;\n  905 |                 let mut clip_mask = tiny_skia::Mask::new(size.w as u32, size.h as u32).unwrap();\n  906 | \n  907 |                 _ = buffer.render().draw(|buf| {\n  908 |                     let mut pixels =\n  909 |                         tiny_skia::PixmapMut::from_bytes(buf, size.w as u32, size.h as u32)\n  910 |                             .expect(\"Failed to create pixel map\");\n  911 | \n  912 |                     let background_color = state_ref.program().0.background_color();\n  913 |                     let bounds = IcedSize::new(size.w as u32, size.h as u32);\n  914 |                     let viewport = Viewport::with_physical_size(bounds, scale.x);\n  915 | \n  916 |                     let damage = vec![cosmic::iced::Rectangle::new(\n  917 |                         cosmic::iced::Point::default(),\n  918 |                         viewport.logical_size(),\n  919 |                     )];\n  920 | \n  921 |                     internal_ref.renderer.draw(\n  922 |                         &mut pixels,\n  923 |                         &mut clip_mask,\n  924 |                         &viewport,\n  925 |                         &damage,\n  926 |                         background_color,\n  927 |                     );\n  928 | \n  929 |                     let damage = damage\n  930 |                         .into_iter()\n  931 |                         .filter_map(|x| x.snap())\n  932 |                         .map(|damage_rect| {\n  933 |                             Rectangle::new(\n  934 |                                 (damage_rect.x as i32, damage_rect.y as i32).into(),\n  935 |                                 (bounds.width as i32, bounds.height as i32).into(),\n  936 |                             )\n  937 |                         })\n  938 |                         .collect::<Vec<_>>();\n  939 |                     state_ref.program().0.foreground(&mut pixels, &damage, scale.x as f32);\n  940 | \n  941 |                     Result::<_, ()>::Ok(damage)\n  942 |                 });\n  943 |             }","lines":44,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/iced/mod.rs#L900-L943"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"medium","difficulty":"easy","description":"The nested `self.popups.iter().any(...)` inside the outer `self.popups.iter().any(...)` is both redundant and quadratic. The inner closure re-binds `p`, shadowing the outer one, and its body does not depend on the outer `p` at all - it is a verbatim copy of the outer predicate. So the whole expression evaluates to the same boolean as a single `any`, but costs `O(popups^2)` per hovered surface. `handle_focus` runs once per event-loop iteration for every panel.","fix":"Delete the inner `any`:\n```rust\n|| self.popups.iter().any(|p| p.popup.c_popup.wl_surface() == surface)\n```","locations":[{"ref":"cosmic-panel-bin/src/space/panel_space.rs:833-839","code":"  833 |                             || self.popups.iter().any(|p| {\n  834 |                                 p.popup.c_popup.wl_surface() == surface\n  835 |                                     || self\n  836 |                                         .popups\n  837 |                                         .iter()\n  838 |                                         .any(|p| p.popup.c_popup.wl_surface() == surface)\n  839 |                             }))","lines":7,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/panel_space.rs#L833-L839"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"medium","difficulty":"easy","description":"`apply_animation_state` allocates a brand new `OutputDamageTracker` on *every* call while an animation is running, and does so before it even checks whether the animation has finished. `handle_events` calls this once per event-loop iteration, so during the 300 ms colour/gap animation the damage tracker is destroyed and recreated dozens of times. A fresh `OutputDamageTracker` has no history, so it reports full-surface damage for every frame - exactly the situation the tracker exists to avoid - and the per-frame allocation is pure waste. On the final iteration the tracker is built and then immediately discarded by the `progress >= 1.0` early return.","fix":"Only rebuild the tracker when the output geometry actually changes; for the animation just set `self.is_dirty = true` and let the render pass damage the background element. If a full redraw really is required per animation frame, keep the existing tracker and pass an explicit full-surface damage rectangle instead of reallocating it.","locations":[{"ref":"cosmic-panel-bin/src/space/panel_space.rs:1144-1167","code":" 1144 |     fn apply_animation_state(&mut self) {\n 1145 |         if let Some(animation_state) = self.animate_state.as_mut() {\n 1146 |             self.damage_tracked_renderer = Some(OutputDamageTracker::new(\n 1147 |                 self.dimensions.to_f64().to_physical(self.scale).to_i32_round(),\n 1148 |                 self.scale,\n 1149 |                 smithay::utils::Transform::Flipped180,\n 1150 |             ));\n 1151 |             let progress = (Instant::now().duration_since(animation_state.started_at).as_millis()\n 1152 |                 as f32)\n 1153 |                 / animation_state.duration.as_millis() as f32;\n 1154 |             self.is_dirty = true;\n 1155 |             self.needs_layout = true;\n 1156 |             if progress >= 1.0 {\n 1157 |                 tracing::info!(\"Animation finished, setting bg_color to end value\");\n 1158 |                 if let CosmicPanelBackground::Color(c) = self.config.background {\n 1159 |                     self.colors = PanelColors::new(self.colors.theme.clone())\n 1160 |                         .with_color_override(Some([c[0], c[1], c[2], self.config.opacity]));\n 1161 |                 } else {\n 1162 |                     self.colors.color_override = None;\n 1163 |                 }\n 1164 |                 self.animate_state = None;\n 1165 |                 self.relax_all();\n 1166 |                 return;\n 1167 |             }","lines":24,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/panel_space.rs#L1144-L1167"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"medium","difficulty":"easy","description":"The main panel surface always swaps with `None` damage, throwing away the damage rectangles that `OutputDamageTracker::render_output` just computed (the result is bound to `_res` and the line that would have used it is commented out right below). Every panel frame therefore uploads/presents the full surface even when a single applet pixel changed. Every other surface in the same function - popups (line 356), subsurfaces (line 410) and the overflow popup (line 528) - correctly forwards `res.damage.cloned()` to `swap_buffers`, so the panel surface is the odd one out.","fix":"Forward the tracked damage like the other three call sites do:\n```rust\nlet res = my_renderer.render_output(renderer, &mut f, age, &elements, clear_color)?;\ndrop(f);\nlet mut dmg = res.damage.cloned();\negl_surface.swap_buffers(dmg.as_deref_mut())?;\n```","locations":[{"ref":"cosmic-panel-bin/src/space/render.rs:279-284","code":"  279 |                 let _res =\n  280 |                     my_renderer.render_output(renderer, &mut f, age, &elements, clear_color)?;\n  281 |                 drop(f);\n  282 |                 // let mut dmg = res.damage.cloned();\n  283 | \n  284 |                 egl_surface.swap_buffers(None)?;","lines":6,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/render.rs#L279-L284"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"The `WrapperSpace::config` trait method returns `Self::Config` **by value**, and both implementations are\n`self.config.clone()` (`space/wrapper_space.rs:373-375`, `space_container/wrapper_space.rs:412-414`).\n`CosmicPanelConfig` contains a `String` plus two `Option<Vec<String>>` plugin lists (a dozen+ heap-allocated\nstrings in the default configuration), so every call performs a deep clone. It is called purely to read a boolean\nin the layout hot path - `layout.rs` alone does `self.config().is_horizontal()` at lines 600, 628, 647 and 767,\ninside per-element loops, and `panel_space.rs` does the same at 945, 1009, 1070 and 1086. Note the same functions\nalso use the cheap `self.config.is_horizontal()` a few lines later, so half the calls already avoid the clone.","fix":"Change the trait method to borrow:\n```rust\n/// gets the config\nfn config(&self) -> &Self::Config;\n```\nupdate the two impls to `&self.config`, and fix the handful of call sites in\n`client/handlers/output.rs` that need an owned value to clone explicitly.","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/space/space.rs:222-223","code":"  222 |     /// gets the config\n  223 |     fn config(&self) -> Self::Config;","lines":2,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/space/space.rs#L222-L223"}]},
{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`State::update` builds `uncaptured_events` on every call by zipping the queued events with their statuses and **cloning** each ignored `Event` into a fresh `Vec`. The only caller, `IcedElementInternal::update`, immediately discards it with `.1`. Since `update` runs on every pointer motion sample and, with `pending_update`, up to once per frame per element, this is a per-motion-event allocation plus clone that is guaranteed to be thrown away.","fix":"Drop the `Vec<Event>` from the return type of `State::update` (return just `Option<Task<P::Message>>`), or gate its construction behind a caller-supplied flag. Remove the now unnecessary `.1` in `IcedElementInternal::update`.","locations":[{"ref":"cosmic-panel-bin/src/iced/state.rs:106-112","code":"  106 |         let uncaptured_events = self\n  107 |             .queued_events\n  108 |             .iter()\n  109 |             .zip(event_statuses)\n  110 |             .filter_map(|(event, status)| matches!(status, event::Status::Ignored).then_some(event))\n  111 |             .cloned()\n  112 |             .collect();","lines":7,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/iced/state.rs#L106-L112"},{"ref":"cosmic-panel-bin/src/iced/mod.rs:430-445","code":"  430 |         let actions = self\n  431 |             .state\n  432 |             .update(\n  433 |                 ID.clone(),\n  434 |                 IcedSize::new(self.size.w as f32, self.size.h as f32),\n  435 |                 cursor,\n  436 |                 &mut self.renderer,\n  437 |                 &self.theme,\n  438 |                 &Style {\n  439 |                     scale_factor: 1.0, // TODO: why is this\n  440 |                     icon_color: self.theme.cosmic().on_bg_color().into(),\n  441 |                     text_color: self.theme.cosmic().on_bg_color().into(),\n  442 |                 },\n  443 |                 &mut NullClipboard,\n  444 |             )\n  445 |             .1;","lines":16,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/iced/mod.rs#L430-L445"}]},
{"id":"PERF_9","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`shrink_clients()` calls `self.move_to_overflow(overflow, ..., clients.clone(), section)` - a deep clone of the whole `OverflowClientPartition` (both `Vec<ShrinkableClient>` and `Vec<(Window, u32)>`, each element an `Arc`-bump plus a `Vec` allocation) - and `shrink_clients()` can recurse once, so up to two clones per layout pass on a path that runs whenever the panel is resized or an applet changes size.\n\n`move_to_overflow()` only ever consumes `clients.movable`; it never touches `clients.shrinkable`.","fix":"Change `move_to_overflow()` to take `movable: &[(Window, u32)]` (or `std::mem::take(&mut clients.movable)`) instead of an owned `OverflowClientPartition`, removing the clone. Taking the vector also fixes the second problem: on the `force_smaller` recursion the same already-moved windows are handed to `move_to_overflow()` a second time and re-unmapped/re-mapped at new grid positions.","locations":[{"ref":"cosmic-panel-bin/src/space/layout.rs:1327-1334","code":" 1327 |         if overflow > 0 {\n 1328 |             overflow = self.move_to_overflow(\n 1329 |                 overflow,\n 1330 |                 self.config.is_horizontal(),\n 1331 |                 clients.clone(),\n 1332 |                 section,\n 1333 |             );\n 1334 |         }","lines":8,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/layout.rs#L1327-L1334"},{"ref":"cosmic-panel-bin/src/space/layout.rs:1346-1352","code":" 1346 |     fn move_to_overflow(\n 1347 |         &mut self,\n 1348 |         mut overflow: u32,\n 1349 |         is_horizontal: bool,\n 1350 |         clients: OverflowClientPartition,\n 1351 |         section: OverflowSection,\n 1352 |     ) -> u32 {","lines":7,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/layout.rs#L1346-L1352"}]},
{"id":"PERF_10","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`tracing::info!(\"Waiting for configure event\")` is emitted from `handle_events`, which runs once per event-loop dispatch. While the panel is waiting for its first configure (and on every subsequent `WaitConfigure` re-arm) this floods the journal at the dispatch rate. The `info!(\"{:?}\", self.space_event)` a few lines below has the same problem on every pending-dimension commit, as does `tracing::info!(\"Configuring popup: {:?}\", config)` in `popup.rs`, which fires on every popup resize.","fix":"Downgrade these to `trace!`:\n```rust\n// before\ntracing::info!(\"Waiting for configure event\");\n// after\ntracing::trace!(\"Waiting for configure event\");\n```","locations":[{"ref":"cosmic-panel-bin/src/space/panel_space.rs:1248-1251","code":" 1248 |             Some(SpaceEvent::WaitConfigure { first, width, height }) if first => {\n 1249 |                 tracing::info!(\"Waiting for configure event\");\n 1250 |                 self.space_event.replace(Some(SpaceEvent::WaitConfigure { first, width, height }));\n 1251 |             },","lines":4,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/panel_space.rs#L1248-L1251"},{"ref":"cosmic-panel-bin/src/space/panel_space.rs:1297","code":" 1297 |                     info!(\"{:?}\", self.space_event);","lines":1,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/panel_space.rs#L1297"},{"ref":"cosmic-panel-bin/src/space/popup.rs:74","code":"   74 |             tracing::info!(\"Configuring popup: {:?}\", config);","lines":1,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/popup.rs#L74"}]},
{"id":"PERF_11","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`configure_panel_layer` always constructs a fresh `EGLContext` via `EGLContext::new_with_config` on the first configure, but a few lines later it discards it whenever a renderer already exists (`if let Some(renderer) = renderer.take() { renderer }` takes the `else` branch's context out of play). For every panel after the first on a multi-panel/multi-output setup this is a full EGL context creation and destruction for nothing, and it can fail with `expect(...)` (aborting the process) even though the result would have been thrown away.","fix":"Only build the context on the path that needs it:\n```rust\nlet mut new_renderer = if let Some(renderer) = renderer.take() {\n    renderer\n} else {\n    let egl_context = EGLContext::new_with_config(/* ... */)?;\n    unsafe {\n        _ = egl_context.make_current();\n        let capabilities = GlesRenderer::supported_capabilities(&egl_context)?;\n        GlesRenderer::with_capabilities(egl_context, capabilities)?\n    }\n};\n```","locations":[{"ref":"cosmic-panel-bin/src/space/panel_space.rs:1400-1437","code":" 1400 |                         let new_egl_display = if let Some(renderer) = renderer.as_ref() {\n 1401 |                             renderer.egl_context().display().clone()\n 1402 |                         } else {\n 1403 |                             let client_egl_display = ClientEglDisplay {\n 1404 |                                 display: self.c_display.as_ref().unwrap().clone(),\n 1405 |                             };\n 1406 |                             unsafe {\n 1407 |                                 EGLDisplay::new(client_egl_display)\n 1408 |                                     .expect(\"Failed to create EGL display\")\n 1409 |                             }\n 1410 |                         };\n 1411 | \n 1412 |                         let egl_context = EGLContext::new_with_config(\n 1413 |                             &new_egl_display,\n 1414 |                             GlAttributes {\n 1415 |                                 version: (2, 0),\n 1416 |                                 profile: None,\n 1417 |                                 debug: cfg!(debug_assertions),\n 1418 |                                 vsync: false,\n 1419 |                             },\n 1420 |                             PixelFormatRequirements::_8_bit(),\n 1421 |                         )\n 1422 |                         .expect(\"Failed to create EGL context\");\n 1423 | \n 1424 |                         let mut new_renderer = if let Some(renderer) = renderer.take() {\n 1425 |                             renderer\n 1426 |                         } else {\n 1427 |                             unsafe {\n 1428 |                                 _ = egl_context.make_current();\n 1429 | \n 1430 |                                 let capabilities =\n 1431 |                                     GlesRenderer::supported_capabilities(&egl_context)\n 1432 |                                         .expect(\"Failed to query EGL Context\");\n 1433 |                                 // capabilities.retain(|cap| *cap != Capability::);\n 1434 |                                 GlesRenderer::with_capabilities(egl_context, capabilities)\n 1435 |                                     .expect(\"Failed to create EGL Surface\")\n 1436 |                             }\n 1437 |                         };","lines":38,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/panel_space.rs#L1400-L1437"}]},
