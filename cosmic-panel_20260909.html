{"id":"LOGIC_46","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`SeatHandler::focus_changed` returns early when `focused` is `None` (`let Some(id) = ... else { return; }`), so\n`set_data_device_focus` and `set_primary_focus` are never called with `None`. The consequence is that when\nkeyboard focus is *lost* the previously focused client keeps its `wl_data_device` selection focus and its\nprimary-selection focus - it can continue to read clipboard/primary contents it should no longer have access to,\nand it will keep receiving `wl_data_device.selection` events. The same early-return also skips clearing when\n`dh.get_client(id)` fails (dead client), which is exactly the case where clearing matters most.","fix":"Compute the client as an `Option` and always call both setters:\n```rust\nlet client = focused\n    .and_then(|s| s.wl_surface())\n    .and_then(|s| dh.get_client(s.id()).ok());\nset_data_device_focus(dh, seat, client.clone());\nset_primary_focus(dh, seat, client);\n```\nThis also removes the redundant second `dh.get_client(id).unwrap()` lookup.","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/mod.rs:71-85","code":"   71 |     fn focus_changed(\n   72 |         &mut self,\n   73 |         seat: &smithay::input::Seat<Self>,\n   74 |         focused: Option<&Self::KeyboardFocus>,\n   75 |     ) {\n   76 |         let dh = &self.server_state.display_handle;\n   77 |         let Some(id) = focused.and_then(|s| s.wl_surface()).map(|s| s.id()) else {\n   78 |             return;\n   79 |         };\n   80 |         if let Ok(client) = dh.get_client(id.clone()) {\n   81 |             set_data_device_focus(dh, seat, Some(client));\n   82 |             let client2 = dh.get_client(id).unwrap();\n   83 |             set_primary_focus(dh, seat, Some(client2))\n   84 |         }\n   85 |     }","lines":15,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/mod.rs#L71-L85"}]},
{"id":"LOGIC_47","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`GlobalState::draw_dnd_icon` renders the DnD icon surface tree with a hard-coded location `(1, 1)` and hard-coded\nscales `1.0, 1.0`, while the `OutputDamageTracker` it renders into was created in `dnd_requested` with\n`self.space.space_list[0].scale`. On any HiDPI/fractional-scale output the icon is rasterised at scale 1.0 into a\nbuffer sized for a different scale, so the drag icon appears at the wrong size and in the wrong place (it is also\noffset by one pixel for no stated reason).","fix":"Thread the same scale used to build the tracker through the render call:\n```rust\nlet scale = self.space.space_list.first().map(|s| s.scale).unwrap_or(1.0);\nlet elements = render_elements_from_surface_tree(renderer, s_icon, (0, 0), scale, 1.0, Kind::Unspecified);\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/shared_state.rs:186-198","code":"  186 |             };\n  187 |             info!(\"draw_dnd_icon bound renderer\");\n  188 |             let elements: Vec<WaylandSurfaceRenderElement<GlesRenderer>> =\n  189 |                 render_elements_from_surface_tree(\n  190 |                     renderer,\n  191 |                     s_icon,\n  192 |                     (1, 1),\n  193 |                     1.0,\n  194 |                     1.0,\n  195 |                     smithay::backend::renderer::element::Kind::Unspecified,\n  196 |                 );\n  197 | \n  198 |             _ = output_tracker.render_output(renderer, &mut f, age, &elements, *clear_color);","lines":13,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/shared_state.rs#L186-L198"}]},
{"id":"LOGIC_48","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`GlobalState::draw_dnd_icon` sends frame callbacks with a constant timestamp:\n`send_frames_surface_tree(s_icon, &o.1, Duration::from_millis(16), None, ...)`. The `time` argument of\n`send_frames_surface_tree` is the monotonic presentation timestamp handed to `wl_callback.done`; clients expect it\nto increase. Passing a fixed 16 ms means any animated drag icon sees time standing still and never advances its\nanimation. `GlobalState` already stores `start_time` for exactly this purpose (it is used elsewhere in the crate).","fix":"Before:\n```rust\nsend_frames_surface_tree(s_icon, &o.1, Duration::from_millis(16), None, move |_, _| Some(output.clone()));\n```\nAfter:\n```rust\nlet now = self.start_time.elapsed();\nsend_frames_surface_tree(s_icon, &o.1, now, None, move |_, _| Some(output.clone()));\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/shared_state.rs:208-217","code":"  208 |             for o in &self.client_state.outputs {\n  209 |                 let output = &o.1;\n  210 |                 send_frames_surface_tree(\n  211 |                     s_icon,\n  212 |                     &o.1,\n  213 |                     Duration::from_millis(16),\n  214 |                     None,\n  215 |                     move |_, _| Some(output.clone()),\n  216 |                 );\n  217 |             }","lines":10,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/shared_state.rs#L208-L217"}]},
{"id":"LOGIC_49","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`PartialEq for CosmicPanelConfig` is hand-written and omits three fields that are part of the struct:\n`autohide_behavior`, `autohover_delay_ms` and `padding_overlap`. This `==` is what\n`SpaceContainer::update_space` uses to decide whether a config reload requires re-creating the panel\n(`let ret = s.config == entry; ... info!(\"config unchanged, skipping\")`). As a result, changing the autohide\nwait/transition/handle/unhide timings, the autohover popup delay, or the padding-overlap ratio in\n`cosmic-settings` has no effect until the panel is restarted. The impl also compares `size_center` and\n`size_wings` twice (lines 479-480 and again at 488-489), which is dead redundancy that hints the field list was\nedited without care.","fix":"Delete the duplicated `size_center`/`size_wings` comparisons and add the missing fields:\n```rust\n&& self.autohide_behavior == other.autohide_behavior\n&& self.autohover_delay_ms == other.autohover_delay_ms\n&& (self.padding_overlap - other.padding_overlap).abs() < f32::EPSILON\n```\nBetter still, derive `PartialEq` and give `opacity`/`padding_overlap` a wrapper type with the tolerant\ncomparison, so new fields cannot be forgotten again.","locations":[{"ref":"cosmic-panel-config/src/panel_config.rs:467-493","code":"  467 | impl PartialEq for CosmicPanelConfig {\n  468 |     fn eq(&self, other: &Self) -> bool {\n  469 |         self.name == other.name\n  470 |             && self.anchor == other.anchor\n  471 |             && self.anchor_gap == other.anchor_gap\n  472 |             && self.layer == other.layer\n  473 |             && self.keyboard_interactivity == other.keyboard_interactivity\n  474 |             && self.size == other.size\n  475 |             && self.output == other.output\n  476 |             && self.background == other.background\n  477 |             && self.plugins_wings == other.plugins_wings\n  478 |             && self.plugins_center == other.plugins_center\n  479 |             && self.size_center == other.size_center\n  480 |             && self.size_wings == other.size_wings\n  481 |             && self.expand_to_edges == other.expand_to_edges\n  482 |             && self.padding == other.padding\n  483 |             && self.spacing == other.spacing\n  484 |             && self.border_radius == other.border_radius\n  485 |             && self.exclusive_zone == other.exclusive_zone\n  486 |             && self.autohide == other.autohide\n  487 |             && self.margin == other.margin\n  488 |             && self.size_center == other.size_center\n  489 |             && self.size_wings == other.size_wings\n  490 |             && (self.opacity - other.opacity).abs() < 0.01\n  491 |             && self.keep_style_on_maximize == other.keep_style_on_maximize\n  492 |     }\n  493 | }","lines":27,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-config/src/panel_config.rs#L467-L493"}]},
{"id":"LOGIC_50","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`PointerTarget::enter` schedules `state.space.iced_request_redraw(panel_id)` on an idle callback unconditionally, while the corresponding `PointerTarget::leave` only does so inside `if internal.request_redraws`. The `pending_update` assignment right above it in `enter` *is* gated on `request_redraws`, which makes the missing guard on the `insert_idle` look like a copy/paste slip. The effect is that hovering the panel background or an overflow popup (both created with `request_redraws == false`) marks the entire panel space `is_dirty` **and** `needs_layout`, forcing a full relayout plus repaint for an element that has explicitly opted out of redraw-on-input.","fix":"Before:\n```rust\nif internal.request_redraws {\n    internal.pending_update = Some(Instant::now());\n}\nlet panel_id = internal.panel_id;\ninternal.handle.insert_idle(move |state| {\n    state.space.iced_request_redraw(panel_id);\n});\n```\nAfter:\n```rust\nif internal.request_redraws {\n    internal.pending_update = Some(Instant::now());\n    let panel_id = internal.panel_id;\n    internal.handle.insert_idle(move |state| {\n        state.space.iced_request_redraw(panel_id);\n    });\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/iced/mod.rs:463-472","code":"  463 |     fn enter(&self, _seat: &Seat<GlobalState>, _data: &mut GlobalState, event: &MotionEvent) {\n  464 |         let mut internal = self.0.lock().unwrap();\n  465 |         if internal.request_redraws {\n  466 |             internal.pending_update = Some(Instant::now());\n  467 |         }\n  468 |         let panel_id = internal.panel_id;\n  469 |         internal.handle.insert_idle(move |state| {\n  470 |             state.space.iced_request_redraw(panel_id);\n  471 |         });\n  472 |         internal.state.queue_event(Event::Mouse(MouseEvent::CursorEntered));","lines":10,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/iced/mod.rs#L463-L472"}]},
{"id":"LOGIC_51","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`layout_()` and `layout()` each compute their own `is_dock`, with different definitions:\n\n- `layout_()` line 199: `!self.config.expand_to_edges() || self.animate_state.as_ref().is_some_and(|a| !(a.cur.expanded > 0.5))`\n- `layout()` line 254: `!self.config.expand_to_edges()`\n\n`layout_()`'s version decides whether the left/right lists are merged into the centre list, while `layout()`'s version decides whether the left/right overflow buttons are unmapped, whether `container_length` collapses to the content length, and which input-region branch runs. During an expand/collapse animation the two disagree, so for example with `expand_to_edges == false` and `a.cur.expanded > 0.5` the three lists stay separate (per `layout_()`) while `layout()` still unmaps the left and right overflow buttons - any applets already in `overflow_left`/`overflow_right` become unreachable for the duration of the animation.","fix":"Compute `is_dock` once (e.g. a `PanelSpace::is_dock(&self) -> bool` method that includes the animation term) and pass it from `layout_()` into `layout()` as a parameter, so both passes agree.","locations":[{"ref":"cosmic-panel-bin/src/space/layout.rs:199-208","code":"  199 |         let is_dock = !self.config.expand_to_edges()\n  200 |             || self.animate_state.as_ref().is_some_and(|a| !(a.cur.expanded > 0.5));\n  201 | \n  202 |         if is_dock {\n  203 |             windows_center = windows_left\n  204 |                 .drain(..)\n  205 |                 .chain(windows_center)\n  206 |                 .chain(windows_right.drain(..))\n  207 |                 .collect_vec();\n  208 |         }","lines":10,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/layout.rs#L199-L208"},{"ref":"cosmic-panel-bin/src/space/layout.rs:254-262","code":"  254 |         let is_dock = !self.config.expand_to_edges();\n  255 |         if is_dock {\n  256 |             if let Some(left_button) = left_overflow_button.take() {\n  257 |                 self.space.unmap_elem(&CosmicMappedInternal::OverflowButton(left_button));\n  258 |             }\n  259 |             if let Some(right_button) = right_overflow_button.take() {\n  260 |                 self.space.unmap_elem(&CosmicMappedInternal::OverflowButton(right_button));\n  261 |             }\n  262 |         }","lines":9,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/layout.rs#L254-L262"}]},
{"id":"LOGIC_52","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"The measuring pass and the placement pass disagree about how much shrinkable padding to remove.\n\n`map_fn()` returns `padding_shrinkable.value() as i32 * applet_padding as i32`, truncating the `f32` `applet_padding` (which is `get_applet_shrinkable_padding(true) as f32 * padding_overlap`, e.g. `18 * 0.75 == 13.5`) down to an integer. `map_windows()` instead subtracts the full `f32`/`f64` value.\n\nWith a fractional `padding_overlap` the two therefore differ by up to 1 px per shrinkable applet, so the sum used to size the panel (`left_sum`/`center_sum`/`right_sum`, and hence `new_list_length`) drifts away from where the applets are actually mapped, and the last applet in a section can be clipped or leave a gap.","fix":"Round once, up front, and share the value:\n\n```rust\nlet applet_padding =\n    (self.config.size.get_applet_shrinkable_padding(true) as f32 * padding_overlap).round();\n```\n\nthen use the same `applet_padding` (as `f64`) in `map_fn()` (`padding_shrinkable.value() as f64 * applet_padding`) and in `map_windows()`, so both passes consume identical numbers.","locations":[{"ref":"cosmic-panel-bin/src/space/layout.rs:323-340","code":"  323 |             match anchor {\n  324 |                 PanelAnchor::Left | PanelAnchor::Right => (\n  325 |                     alignment,\n  326 |                     *i,\n  327 |                     size.h,\n  328 |                     size.w,\n  329 |                     suggested_bounds.h.min(size.h),\n  330 |                     padding_shrinkable.value() as i32 * applet_padding as i32,\n  331 |                 ),\n  332 |                 PanelAnchor::Top | PanelAnchor::Bottom => (\n  333 |                     alignment,\n  334 |                     *i,\n  335 |                     size.w,\n  336 |                     size.h,\n  337 |                     suggested_bounds.w.min(size.w),\n  338 |                     padding_shrinkable.value() as i32 * applet_padding as i32,\n  339 |                 ),\n  340 |             }","lines":18,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/layout.rs#L323-L340"},{"ref":"cosmic-panel-bin/src/space/layout.rs:694-703","code":"  694 |                     (x, y) = (cur.0 as i32, cur.1);\n  695 |                     prev += size.w + spacing_u32 as f64\n  696 |                         - if matches!(\n  697 |                             padding_shrinkable,\n  698 |                             ShrinkablePadding::Both | ShrinkablePadding::Start\n  699 |                         ) {\n  700 |                             applet_padding\n  701 |                         } else {\n  702 |                             0.\n  703 |                         } as f64;","lines":10,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/layout.rs#L694-L703"}]},
{"id":"LOGIC_53","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"When `num_lists == 0` (no applets on any side and no overflow buttons), `one_third` divides by `3.min(0) == 0` and `one_half` divides by `2.min(0) == 0`. IEEE-754 makes these `+inf` (or `NaN` if `layer_major == 0`), which then flows into `target_center_len`, `target_left_len` and `target_right_len` via `.max(one_third)` / `.max(one_half)`. The subsequent `.min(layer_major as f64)` happens to mask the `inf` case, but a `NaN` propagates through every comparison (`center_overflow < suggested_size` becomes `false`, `> 0` becomes `false`) and silently disables overflow handling.","fix":"Guard the divisor:\n\n```rust\nlet list_divisor = 3.min(num_lists).max(1) as f64;\nlet one_third = (layer_major as f64 - (spacing_u32 * num_lists.saturating_sub(1)) as f64) / list_divisor;\nlet one_half = layer_major as f64 / 2.min(num_lists).max(1) as f64;\n```\nor return early when `num_lists == 0`.","locations":[{"ref":"cosmic-panel-bin/src/space/layout.rs:482-484","code":"  482 |         let one_third = (layer_major as f64 - (spacing_u32 * num_lists.saturating_sub(1)) as f64)\n  483 |             / (3.min(num_lists) as f64);\n  484 |         let one_half = layer_major as f64 / (2.min(num_lists) as f64);","lines":3,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/layout.rs#L482-L484"}]},
{"id":"LOGIC_54","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`shrinkable_is_relaxed()` compares a *logical* geometry against a *scaled* bounds value: `cur_size.w.saturating_sub((s.w as f64 * scale).round() as i32)`.\n\n`w.geometry().size` is in logical coordinates, and `bounds` is the xdg-toplevel `configure_bounds`, also logical - it is written by `shrink_clients()` from `w.geometry().size.to_f64()` (line 1279 / 1329), i.e. logical. Multiplying `s.w` by `scale` therefore mixes units: on a 2x display `s.w * 2` is always larger than `cur_size.w`, the `saturating_sub` clamps to `0`, and the comparison is permanently `false`. A shrunk applet is then never reported as \"relaxed\" on HiDPI, so `relax_overflow_*()` keeps taking the `relax_overflow_clients()` branch instead of moving applets back out of the overflow popup.","fix":"Drop the `* scale` factor (both `cur_size` and `bounds` are logical):\n\n```rust\ncur_size.w.saturating_sub(s.w) > self.suggested_size as i32\n```\nand likewise for the vertical branch. If a physical comparison is really wanted, convert *both* operands with `.to_f64().to_physical(scale)`.","locations":[{"ref":"cosmic-panel-bin/src/space/layout.rs:1893-1921","code":" 1893 |     fn shrinkable_is_relaxed(&self, is_horizontal: bool, scale: f64) -> bool {\n 1894 |         self.shrinkable.is_empty() || {\n 1895 |             self.shrinkable.iter().all(|ShrinkableClient { window: w, .. }| {\n 1896 |                 w.toplevel().is_some_and(|t| {\n 1897 |                     let bounds = t.with_committed_state(|s| s.as_ref().and_then(|s| s.bounds));\n 1898 |                     let cur_size = w.geometry().size;\n 1899 |                     if is_horizontal {\n 1900 |                         bounds.is_none()\n 1901 |                             || bounds.is_some_and(|s| {\n 1902 |                                 s.w == 0\n 1903 |                                     || cur_size\n 1904 |                                         .w\n 1905 |                                         .saturating_sub((s.w as f64 * scale).round() as i32)\n 1906 |                                         > self.suggested_size as i32\n 1907 |                             })\n 1908 |                     } else {\n 1909 |                         bounds.is_none()\n 1910 |                             || bounds.is_some_and(|s| {\n 1911 |                                 s.h == 0\n 1912 |                                     || cur_size\n 1913 |                                         .h\n 1914 |                                         .saturating_sub((s.h as f64 * scale).round() as i32)\n 1915 |                                         > self.suggested_size as i32\n 1916 |                             })\n 1917 |                     }\n 1918 |                 })\n 1919 |             })\n 1920 |         }\n 1921 |     }","lines":29,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/layout.rs#L1893-L1921"}]},
{"id":"LOGIC_55","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`handle_overflow_popup_events()` rebuilds the popup's `OutputDamageTracker` from a size computed with the popup's own scale (`p.rectangle.size.to_f64().to_physical(p.scale)`) but passes `self.scale` as the tracker's scale. If the panel's scale changed after the popup was created (output rescale, fractional-scale event), the tracker is constructed with a size in one scale and a scale factor from another, producing wrong damage rectangles and visual corruption/stale regions in the popup.\n\n`scaled_size` is also not clamped, so a zero-sized `p.rectangle` yields a `0x0` damage tracker even though the neighbouring `s.resize(scaled_size.w.max(1), scaled_size.h.max(1), 0, 0)` guards against exactly that.","fix":"Before:\n```rust\np.damage_tracked_renderer = OutputDamageTracker::new(\n    scaled_size,\n    self.scale,\n    smithay::utils::Transform::Flipped180,\n);\n```\nAfter:\n```rust\np.damage_tracked_renderer = OutputDamageTracker::new(\n    (scaled_size.w.max(1), scaled_size.h.max(1)).into(),\n    p.scale,\n    smithay::utils::Transform::Flipped180,\n);\n```\n(or set `p.scale = self.scale;` first, so size and scale are derived from the same value).","locations":[{"ref":"cosmic-panel-bin/src/space/overflow.rs:215-234","code":"  215 |                 if let Some(WrapperPopupState::Rectangle { width, height, x, y }) = p.state {\n  216 |                     p.dirty = true;\n  217 |                     p.rectangle = Rectangle::new((x, y).into(), (width, height).into());\n  218 |                     let scaled_size: Size<i32, _> =\n  219 |                         p.rectangle.size.to_f64().to_physical(p.scale).to_i32_round();\n  220 | \n  221 |                     if let Some(s) = p.egl_surface.as_ref() {\n  222 |                         _ = unsafe { renderer.egl_context().make_current_with_surface(s) };\n  223 |                         // TODO do we need {"id":"LOGIC_56","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"For panels that have autohide *disabled*, `handle_focus` still writes `self.visibility = Visibility::Hidden` whenever nothing is hovered or focused. `Visibility::Hidden` is consumed elsewhere as \"the panel is slid off screen\": `layout.rs:934` uses `if !matches!(self.visibility, Visibility::Hidden) || self.additional_gap == 0` to decide whether to populate the input region, and then unconditionally calls `layer.wl_surface().set_input_region(Some(input_region.wl_region()))`. So a *stacked* non-autohide panel (`additional_gap != 0`) publishes an empty input region as soon as the pointer leaves it, and can never be hovered again to flip back to `Visible`. `space_container::visibility()` also reads it to pick the event-loop dispatch ceiling (300 ms vs 100 ms).","fix":"Do not overload `Visibility` for non-autohide panels - leave `self.visibility` at `Visibility::Visible` and introduce a separate `is_hovered: bool` (or reuse `hover_track`) for the \"stacked panel is behind another panel\" case that `layout.rs:934` actually wants to detect.","locations":[{"ref":"cosmic-panel-bin/src/space/panel_space.rs:815-822","code":"  815 |             if !self.config.autohide_enabled() {\n  816 |                 if no_hover_focus && self.animate_state.is_none() {\n  817 |                     self.visibility = Visibility::Hidden;\n  818 |                 } else {\n  819 |                     self.visibility = Visibility::Visible;\n  820 |                 }\n  821 |                 return;\n  822 |             };","lines":8,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/panel_space.rs#L815-L822"}]},
{"id":"LOGIC_57","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"On the first configure the panel's `WlEglSurface` is created with the *logical* size `dim.w, dim.h`, while every other place (including the `resize` five lines below and the `None` configure branch) uses the physical size `dim.to_f64().to_physical(self.scale).to_i32_round()`. The immediately following `resize` only runs `if dim.w > 20 && dim.h > 20`, so on a fractional-scale output with a small initial configure the surface is left at the wrong buffer size, mismatching `self.damage_tracked_renderer`, which is built from the physical size unconditionally.","fix":"Create the `WlEglSurface` at the physical size, e.g.\n```rust\nlet scaled = dim.to_f64().to_physical(self.scale).to_i32_round();\nWlEglSurface::new(self.layer.as_ref().unwrap().wl_surface().id(), scaled.w.max(1), scaled.h.max(1))\n```","locations":[{"ref":"cosmic-panel-bin/src/space/panel_space.rs:1389-1399","code":" 1389 |                         let client_egl_surface = unsafe {\n 1390 |                             ClientEglSurface::new(\n 1391 |                                 WlEglSurface::new(\n 1392 |                                     self.layer.as_ref().unwrap().wl_surface().id(),\n 1393 |                                     dim.w,\n 1394 |                                     dim.h,\n 1395 |                                 )\n 1396 |                                 .unwrap(), // TODO remove unwrap\n 1397 |                                 self.layer.as_ref().unwrap().wl_surface().clone(),\n 1398 |                             )\n 1399 |                         };","lines":11,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/panel_space.rs#L1389-L1399"}]},
{"id":"LOGIC_58","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"The lazy `EGLSurface` creation scales the popup size with the *panel's* `self.scale`, but every other place that sizes a popup's EGL surface uses the popup's own `scale` field (`WrapperPopup::handle_events` uses `self.popup.scale`, `handle_overflow_popup_events` uses `p.scale`). `scale_factor_changed` maintains per-popup scales precisely because they can differ from the layer surface's scale, so if the popup's `wp_fractional_scale_v1` `preferred_scale` arrives before the first configure, the surface is created at the wrong pixel size.","fix":"Use the popup's own scale:\n```rust\nlet width_scaled = (width as f64 * p.scale).ceil() as i32;\nlet height_scaled = (height as f64 * p.scale).ceil() as i32;\n```","locations":[{"ref":"cosmic-panel-bin/src/space/popup.rs:100-107","code":"  100 |             if p.egl_surface.is_none() {\n  101 |                 let width_scaled = (width as f64 * self.scale).ceil() as i32;\n  102 |                 let height_scaled = (height as f64 * self.scale).ceil() as i32;\n  103 |                 let wl_egl_surface = match WlEglSurface::new(\n  104 |                     p.c_popup.wl_surface().id(),\n  105 |                     width_scaled,\n  106 |                     height_scaled,\n  107 |                 ) {","lines":8,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/popup.rs#L100-L107"},{"ref":"cosmic-panel-bin/src/space/popup.rs:153-160","code":"  153 |             if p.egl_surface.is_none() {\n  154 |                 let width_scaled = (width as f64 * self.scale).ceil() as i32;\n  155 |                 let height_scaled = (height as f64 * self.scale).ceil() as i32;\n  156 |                 let wl_egl_surface = match WlEglSurface::new(\n  157 |                     p.c_popup.wl_surface().id(),\n  158 |                     width_scaled,\n  159 |                     height_scaled,\n  160 |                 ) {","lines":8,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/popup.rs#L153-L160"}]},
{"id":"LOGIC_59","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"The background element's physical position is computed with a truncating cast (`(pos.0 as f64 * self.scale) as i32`) while every other coordinate in the same function goes through `to_i32_round()` / `to_physical_precise_round()`. On a fractional-scale output the background is therefore offset by up to one physical pixel relative to the applets drawn on top of it, producing a visible seam at the panel's rounded corners. Negative logical positions (which `layout.rs` does produce, e.g. `-self.anchor_gap` for right/bottom anchors) truncate toward zero rather than down, making the error direction-dependent.","fix":"Round consistently with the rest of the render path:\n```rust\nlet pos = Point::<i32, Logical>::from(e.with_program(|p| p.logical_pos))\n    .to_f64()\n    .to_physical(self.scale)\n    .to_i32_round();\ne.render_elements(renderer, pos, self.scale.into(), 1.0)\n```","locations":[{"ref":"cosmic-panel-bin/src/space/render.rs:262-277","code":"  262 |                 if let Some(bg) = self.background_element.as_ref().map(|e| {\n  263 |                     let pos = e.with_program(|p| p.logical_pos);\n  264 |                     e.render_elements(\n  265 |                         renderer,\n  266 |                         Point::from((\n  267 |                             (pos.0 as f64 * self.scale) as i32,\n  268 |                             (pos.1 as f64 * self.scale) as i32,\n  269 |                         )),\n  270 |                         self.scale.into(),\n  271 |                         1.0,\n  272 |                     )\n  273 |                     .into_iter()\n  274 |                     .map(PanelRenderElement::Iced)\n  275 |                 }) {\n  276 |                     elements.extend(bg);\n  277 |                 };","lines":16,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/render.rs#L262-L277"}]},
{"id":"LOGIC_60","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In the overflow-popup render block, `bg_render_element` is assigned with `=` (not accumulated) inside the `filter_map` closure, so if the overflow space ever contains more than one `PopupMappedInternal::Popup` element only the last one is drawn - the earlier ones are silently swallowed (the closure returns `None` for them, so they are not added to `elements` either). The comment \"move to bg_render_element\" does not hint that this is a last-one-wins assignment.","fix":"Accumulate instead of overwriting:\n```rust\nlet mut bg_render_elements: Vec<PanelRenderElement> = Vec::new();\n// ...\nbg_render_elements.extend(\n    e.render_elements(renderer, (0, 0).into(), self.scale.into(), 1.0)\n        .into_iter()\n        .map(PanelRenderElement::Iced),\n);\n```\nand `elements.extend(bg_render_elements);` at the end.","locations":[{"ref":"cosmic-panel-bin/src/space/render.rs:449-462","code":"  449 |             let mut bg_render_element = None;\n  450 |             let mut elements: Vec<PanelRenderElement> = space\n  451 |                 .elements()\n  452 |                 .filter_map(|e| match e {\n  453 |                     crate::iced::elements::PopupMappedInternal::Popup(e) => {\n  454 |                         // move to bg_render_element\n  455 |                         bg_render_element = Some(\n  456 |                             e.render_elements(renderer, (0, 0).into(), self.scale.into(), 1.0)\n  457 |                                 .into_iter()\n  458 |                                 .map(PanelRenderElement::Iced)\n  459 |                                 .collect::<Vec<_>>(),\n  460 |                         );\n  461 |                         None\n  462 |                     },","lines":14,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/render.rs#L449-L462"}]},
{"id":"LOGIC_61","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`PanelSpace::reposition_popup` sets `p.popup.state = Some(WrapperPopupState::WaitConfigure)` unconditionally, but the\nclient-side `reposition` request (the only thing that will produce the matching `popup_configure`) is only sent when\n`positioner.version() >= 3`. With an older `xdg_wm_base`, the popup is left in `WaitConfigure` forever; rendering is\ngated on `state.is_none()` (`space/render.rs:324`, `space/render.rs:431-436`), so the popup silently freezes.","fix":"Only enter the wait state when a reposition was actually requested:\n\n```rust\nif positioner.version() >= 3 {\n    p.popup.c_popup.reposition(positioner, token);\n    p.popup.state = Some(WrapperPopupState::WaitConfigure);\n    popup.send_repositioned(token);\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/space/wrapper_space.rs:350-365","code":"  350 |         if let Some(i) = self.popups.iter().position(|wp| wp.s_surface == popup) {\n  351 |             let p = &self.popups[i];\n  352 | \n  353 |             let positioner: &sctk::shell::xdg::XdgPositioner = &p.popup.positioner;\n  354 |             self.apply_positioner_state(positioner, pos_state, &p.s_surface);\n  355 |             let p = &mut self.popups[i];\n  356 |             let positioner: &sctk::shell::xdg::XdgPositioner = &p.popup.positioner;\n  357 | \n  358 |             if positioner.version() >= 3 {\n  359 |                 p.popup.c_popup.reposition(positioner, token);\n  360 |             }\n  361 |             p.popup.state = Some(WrapperPopupState::WaitConfigure);\n  362 |             if positioner.version() >= 3 {\n  363 |                 popup.send_repositioned(token);\n  364 |             }\n  365 |         }","lines":16,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/wrapper_space.rs#L350-L365"}]},
{"id":"LOGIC_62","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`PanelSpace::frame` marks the layer surface and the regular popups as having received a frame callback, but it never\ntouches `self.overflow_popup`. The overflow popup carries the same `has_frame` field (initialised to `true` in\n`space/overflow.rs:162`) and it is therefore permanently stale; consequently the overflow popup's render path\n(`space/render.rs:431-436`) had to be written without any `has_frame` gate, so the overflow popup is not throttled to\nthe compositor's frame callbacks the way every other surface is.","fix":"Handle the overflow popup as well:\n\n```rust\n} else if let Some((p, _)) = self.overflow_popup.as_mut().filter(|(p, _)| p.c_popup.wl_surface() == surface) {\n    p.has_frame = true;\n}\n```\n\nand add `&& p.has_frame` to the overflow popup render condition.","locations":[{"ref":"cosmic-panel-bin/src/space/wrapper_space.rs:1647-1655","code":" 1647 |     fn frame(&mut self, surface: &c_wl_surface::WlSurface, _time: u32) {\n 1648 |         if Some(surface) == self.layer.as_ref().map(|l| l.wl_surface()) {\n 1649 |             self.has_frame = true;\n 1650 |         } else if let Some(p) =\n 1651 |             self.popups.iter_mut().find(|p| surface == p.popup.c_popup.wl_surface())\n 1652 |         {\n 1653 |             p.popup.has_frame = true;\n 1654 |         }\n 1655 |     }","lines":9,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/wrapper_space.rs#L1647-L1655"}]},
{"id":"LOGIC_63","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`SpaceContainer::new_output` unconditionally pushes `(c_output, s_output, output_info)` onto `self.outputs` without checking whether the output is already tracked, while `update_output` does `retain(|o| o.0 != c_output)` before pushing. The client-side `OutputHandler::update_output` calls `space.update_output(..)` and, when it returns `Ok(false)`, immediately calls `space.new_output(..)` for the same `WlOutput`. In that sequence `self.outputs` first gets the entry from `update_output` and then a second, duplicate entry from `new_output`. Every later scan of `self.outputs` (for example `maximized_outputs()` comparisons) then sees the same output twice.","fix":"Make `new_output` idempotent, e.g. `self.outputs.retain(|o| o.0 != c_output);` before the `push`, or use a `HashMap<ObjectId, ..>` keyed by the output id instead of a `Vec`.","locations":[{"ref":"cosmic-panel-bin/src/space_container/wrapper_space.rs:155","code":"  155 |         self.outputs.push((c_output.clone(), s_output.clone(), output_info.clone()));","lines":1,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space_container/wrapper_space.rs#L155"},{"ref":"cosmic-panel-bin/src/space_container/wrapper_space.rs:783-784","code":"  783 |         self.outputs.retain(|o| o.0 != c_output);\n  784 |         self.outputs.push((c_output.clone(), s_output.clone(), info.clone()));","lines":2,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space_container/wrapper_space.rs#L783-L784"}]},
{"id":"LOGIC_64","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The \"reuse an existing space\" path in the `CosmicPanelOuput::All` arm of `new_output` can only ever destroy the space it tries to reuse. The lookup at lines 176-179 selects a space that already has `s.output == Some(c_output)`; the space is then taken out of `space_list` with `remove(s)` and `s.new_output(..)` is invoked on it. `PanelSpace::new_output` starts with `if self.output.is_some() { bail!(\"output already setup for this panel\") }`, so the call is guaranteed to fail, `is_ok()` is `false`, `None` is returned from the `filter_map` and the removed, fully functional panel is dropped and never re-inserted into `space_list`. If this branch is ever reached (duplicate output advertisement, or a future caller), the user silently loses a panel.","fix":"Either skip the config entirely when a space for that `(config.name, c_output)` pair already exists, or keep the removed space and re-insert it when `new_output` fails, e.g. collect the space back into `new_spaces` in the `else` branch of `if s.new_output(..).is_ok()` instead of returning `None`.","locations":[{"ref":"cosmic-panel-bin/src/space_container/wrapper_space.rs:176-235","code":"  176 |                         let mut s = if let Some(s) = self.space_list.iter_mut().position(|s| {\n  177 |                             s.config.name == config.name\n  178 |                                 && Some(&c_output) == s.output.as_ref().map(|o| &o.0)\n  179 |                         }) {\n  180 |                             self.space_list.remove(s)\n  181 |                         } else {\n  182 |                             let mut s = PanelSpace::new(\n  183 |                                 config.clone(),\n  184 |                                 &self.shared,\n  185 |                                 c,\n  186 |                                 self.s_display.clone().unwrap(),\n  187 |                                 conn,\n  188 |                                 qh,\n  189 |                                 self.corner_radius_manager.as_ref(),\n  190 |                             );\n  191 |                             s.setup(\n  192 |                                 compositor_state,\n  193 |                                 fractional_scale_manager,\n  194 |                                 self.shared.security_context_manager.borrow().clone(),\n  195 |                                 viewport,\n  196 |                                 layer_state,\n  197 |                                 conn,\n  198 |                                 qh,\n  199 |                                 self.overlap_notify.clone(),\n  200 |                             );\n  201 |                             if let Some(s_display) = self.s_display.as_ref() {\n  202 |                                 s.set_display_handle(s_display.clone());\n  203 |                             }\n  204 |                             s\n  205 |                         };\n  206 |                         s.setup(\n  207 |                             compositor_state,\n  208 |                             fractional_scale_manager,\n  209 |                             self.shared.security_context_manager.borrow().clone(),\n  210 |                             viewport,\n  211 |                             layer_state,\n  212 |                             conn,\n  213 |                             qh,\n  214 |                             self.overlap_notify.clone(),\n  215 |                         );\n  216 | \n  217 |                         s.enable_blur_capacity(blur_manager.as_ref());\n  218 | \n  219 |                         if s.new_output(\n  220 |                             compositor_state,\n  221 |                             fractional_scale_manager,\n  222 |                             viewport,\n  223 |                             layer_state,\n  224 |                             conn,\n  225 |                             qh,\n  226 |                             Some(c_output.clone()),\n  227 |                             Some(s_output.clone()),\n  228 |                             Some(output_info.clone()),\n  229 |                         )\n  230 |                         .is_ok()\n  231 |                         {\n  232 |                             Some(s)\n  233 |                         } else {\n  234 |                             None\n  235 |                         }","lines":60,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space_container/wrapper_space.rs#L176-L235"}]},
{"id":"LOGIC_65","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`KeyboardHandler::leave` looks the focus entry up by surface only (`c_focused_surface.iter().position(|f| &f.0 == surface)`), whereas `enter` looks it up by seat (`|f| f.1 == seat_name`). With more than one seat focused on the same client surface, a `leave` on seat A flips the entry belonging to seat B to `FocusStatus::LastFocused`, and seat A's own entry (if it is not the first match) is left as `Focused` forever - which in turn keeps the panel from auto-hiding.","fix":"Match on both the seat and the surface: `c_focused_surface.iter().position(|f| f.1 == name && &f.0 == surface)`.","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/keyboard.rs:88-96","code":"   88 |         let kbd_focus = {\n   89 |             let mut c_focused_surface = self.client_state.focused_surface.borrow_mut();\n   90 |             if let Some(i) = c_focused_surface.iter().position(|f| &f.0 == surface) {\n   91 |                 c_focused_surface[i].2 = FocusStatus::LastFocused(Instant::now());\n   92 |                 true\n   93 |             } else {\n   94 |                 false\n   95 |             }\n   96 |         };","lines":9,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/keyboard.rs#L88-L96"}]},
{"id":"LOGIC_66","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`PointerEventKind::Leave` calls `self.client_state.delayed_surface_motion.clear()`, dropping the pending motion events of *all* surfaces and *all* seats, not just those belonging to the seat/surface that was left. The map is keyed by server `WlSurface` and is consumed in `server/handlers/compositor.rs` on commit, so a pointer leaving one panel silently discards a motion event that a different applet was about to receive, leaving that applet with a stale hover position.","fix":"Remove only the entries that belong to the surface being left, e.g. `self.client_state.delayed_surface_motion.retain(|_, (ev, ptr, _)| ev.surface != e.surface || ptr != pointer);`.","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/pointer.rs:100-107","code":"  100 |                     let mut c_hovered_surface = self.client_state.hovered_surface.borrow_mut();\n  101 |                     for f in c_hovered_surface.iter_mut().filter(|f| f.0 == e.surface) {\n  102 |                         f.2 = FocusStatus::LastFocused(Instant::now());\n  103 |                     }\n  104 |                     drop(c_hovered_surface);\n  105 |                     self.client_state.delayed_surface_motion.clear();\n  106 | \n  107 |                     self.space.pointer_leave(&seat_name, Some(e.surface.clone()));","lines":8,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/pointer.rs#L100-L107"}]},
{"id":"LOGIC_67","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`ExtBackgroundEffectHandler::unset_blur_region` only clears the pending cached state; unlike `set_blur_region` it never calls `hook_commit`. If a client's first (or only) action is `unset_blur_region` - for instance to clear a region inherited from a previous configuration - no pre-commit hook has been installed yet, so `commit_blur` is never invoked and the client-side `set_blur_region(None)` is never forwarded to the real compositor.","fix":"Call `hook_commit::<GlobalState>(&surface);` at the end of `unset_blur_region`, mirroring `set_blur_region`.","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/ext_background_effect.rs:113-119","code":"  113 |     fn unset_blur_region(&mut self, surface: WlSurface) {\n  114 |         with_states(&surface, |states| {\n  115 |             let mut blur_state = states.cached_state.get::<ComputedBlurRegionCachedState>();\n  116 | \n  117 |             blur_state.pending().blur_region.take();\n  118 |         })\n  119 |     }","lines":7,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/ext_background_effect.rs#L113-L119"}]},
{"id":"LOGIC_68","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In the `CursorImageStatus::Surface` branch of `cursor_image`, the panel's single persistent cursor viewport\n(`client_state.cursor_vp`) is only ever *set*, never reset: `set_destination`/`set_source` are called only when\nthe incoming surface's `ViewportCachedState` actually carries `dst`/`src`. Because the same `wp_viewport` object\nis reused for every cursor of every client, once one client sets a cursor with a viewport crop/scale, the next\nclient's cursor (which has no viewport state) is rendered with the previous client's stale source rectangle and\ndestination size.","fix":"Always drive the viewport to a defined state:\n```rust\nif let Some(vp_obj) = self.client_state.cursor_vp.as_ref() {\n    match vp.dst { Some(dst) => vp_obj.set_destination(dst.w, dst.h), None => vp_obj.set_destination(-1, -1) }\n    match vp.src {\n        Some(src) => vp_obj.set_source(src.loc.x, src.loc.y, src.size.w, src.size.h),\n        None => vp_obj.set_source(-1.0, -1.0, -1.0, -1.0),\n    }\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/mod.rs:114-125","code":"  114 |             smithay::input::pointer::CursorImageStatus::Surface(surface) => {\n  115 |                 trace!(\"received surface with cursor image\");\n  116 |                 let vp = with_states(&surface, |states| {\n  117 |                     *states.cached_state.get::<ViewportCachedState>().current()\n  118 |                 });\n  119 | \n  120 |                 if let Some((vp, dst)) = self.client_state.cursor_vp.as_ref().zip(vp.dst) {\n  121 |                     vp.set_destination(dst.w, dst.h);\n  122 |                 }\n  123 |                 if let Some((vp, src)) = self.client_state.cursor_vp.as_ref().zip(vp.src) {\n  124 |                     vp.set_source(src.loc.x, src.loc.y, src.size.w, src.size.h);\n  125 |                 }","lines":12,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/mod.rs#L114-L125"}]},
{"id":"LOGIC_69","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`GlobalState::cleanup` releases at most **one** stuck key per invocation: it uses `Vec::position` to find the\nfirst `last_key_pressed` entry whose layer-shell surface is dead. Worse, if the matching seat cannot be found\n(`self.server_state.seats.iter().find(...)` returns `None`, e.g. the seat was removed together with the surface),\nthe entry is *not* removed from `last_key_pressed`, so `position` keeps returning the same dead entry on every\n2-second cleanup tick, the release event is never sent, and the vector never shrinks. Any keys pressed after that\nalso accumulate behind it.","fix":"Drain all dead entries unconditionally first, then dispatch releases for the ones whose seat still exists:\n```rust\nlet dead: Vec<_> = {\n    let (dead, alive) = std::mem::take(&mut self.client_state.last_key_pressed)\n        .into_iter()\n        .partition(|(_, _, s)| !s.is_alive());\n    self.client_state.last_key_pressed = alive;\n    dead\n};\nfor entry in dead { /* look up seat, send release if found */ }\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/shared_state.rs:56-93","code":"   56 |     pub(crate) fn cleanup(&mut self) {\n   57 |         // cleanup popup manager\n   58 |         self.server_state.popup_manager.cleanup();\n   59 | \n   60 |         // handle funky keyboard state.\n   61 |         // if a client layer shell surface is closed, then it won't receive the release\n   62 |         // event then the client will keep receiving input\n   63 |         // so we send the release here instead\n   64 |         let press = if let Some((key_pressed, kbd)) = self\n   65 |             .client_state\n   66 |             .last_key_pressed\n   67 |             .iter()\n   68 |             .position(|(_, _, layer_shell_wl_surface)| !layer_shell_wl_surface.is_alive())\n   69 |             .and_then(|key_pressed| {\n   70 |                 self.server_state\n   71 |                     .seats\n   72 |                     .iter()\n   73 |                     .find(|s| s.name == self.client_state.last_key_pressed[key_pressed].0)\n   74 |                     .and_then(|s| {\n   75 |                         s.server.seat.get_keyboard().map(|kbd| {\n   76 |                             (self.client_state.last_key_pressed.remove(key_pressed), kbd)\n   77 |                         })\n   78 |                     })\n   79 |             }) {\n   80 |             Some((key_pressed, kbd))\n   81 |         } else {\n   82 |             None\n   83 |         };\n   84 |         if let Some((key_pressed, kbd)) = press {\n   85 |             kbd.input::<(), _>(\n   86 |                 self,\n   87 |                 key_pressed.1.0.into(),\n   88 |                 KeyState::Released,\n   89 |                 SERIAL_COUNTER.next_serial(),\n   90 |                 key_pressed.1.1.wrapping_add(1),\n   91 |                 move |_, _modifiers, _keysym| FilterResult::Forward,\n   92 |             );\n   93 |         }","lines":38,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/shared_state.rs#L56-L93"}]},
{"id":"LOGIC_70","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`WrapperPopup::handle_events` is inconsistent about clamping the configured popup size. It clamps for the EGL\nsurface (`s.resize(scaled_size.w.max(1), scaled_size.h.max(1), 0, 0)`) and for the viewport\n(`viewport.set_destination(...w.max(1), ...h.max(1))`), but passes the *unclamped* values to\n`xdg_surface.set_window_geometry(0, 0, width, height)` - where a non-positive width/height is an\n`xdg_surface::error::invalid_size` protocol error that disconnects the panel - and to\n`OutputDamageTracker::new(scaled_size, ...)`, which then tracks a zero-sized output while the EGL surface is 1x1.","fix":"Clamp once at the top of the branch and use the clamped values everywhere:\n```rust\nlet width = width.max(1);\nlet height = height.max(1);\nself.popup.rectangle = Rectangle::new((x, y).into(), (width, height).into());\nlet scaled_size: Size<i32, _> = self.popup.rectangle.size.to_f64()\n    .to_physical(self.popup.scale).to_i32_round();\nlet scaled_size = Size::from((scaled_size.w.max(1), scaled_size.h.max(1)));\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/space/popup.rs:136-162","code":"  136 |         if let Some(WrapperPopupState::Rectangle { width, height, x, y }) = self.popup.state {\n  137 |             self.popup.dirty = true;\n  138 |             self.popup.rectangle = Rectangle::new((x, y).into(), (width, height).into());\n  139 |             let scaled_size: Size<i32, _> =\n  140 |                 self.popup.rectangle.size.to_f64().to_physical(self.popup.scale).to_i32_round();\n  141 |             if let Some(s) = self.popup.egl_surface.as_mut() {\n  142 |                 _ = unsafe { renderer.egl_context().make_current_with_surface(s) };\n  143 |                 _ = renderer.bind(s);\n  144 |                 s.resize(scaled_size.w.max(1), scaled_size.h.max(1), 0, 0);\n  145 |             }\n  146 |             if let Some(viewport) = self.popup.viewport.as_ref() {\n  147 |                 viewport.set_destination(\n  148 |                     self.popup.rectangle.size.w.max(1),\n  149 |                     self.popup.rectangle.size.h.max(1),\n  150 |                 );\n  151 |             }\n  152 |             self.popup.c_popup.xdg_surface().set_window_geometry(0, 0, width, height);\n  153 | \n  154 |             self.popup.damage_tracked_renderer = OutputDamageTracker::new(\n  155 |                 scaled_size,\n  156 |                 self.popup.scale,\n  157 |                 smithay::utils::Transform::Flipped180,\n  158 |             );\n  159 | \n  160 |             popup_manager.commit(self.s_surface.wl_surface());\n  161 |             self.popup.state = None;\n  162 |         };","lines":27,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/space/popup.rs#L136-L162"}]},
{"id":"LOGIC_71","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"`ProgramWrapper<P>` implements `IcedProgram` but only forwards `update` and `view`; it does not forward `background_color` or `foreground`. Anything reaching the program through the `IcedProgram` trait therefore gets `Color::TRANSPARENT` and a no-op `foreground`, silently ignoring the `Program` implementation. It happens to work today only because `render_elements` reaches past the wrapper with `state_ref.program().0.background_color()` / `.foreground(..)`, i.e. it calls the inner `Program` directly - a coupling that will break the moment the rendering path is refactored to go through the trait.","fix":"Add the missing forwarding methods to `impl<P: Program> IcedProgram for ProgramWrapper<P>`:\n```rust\nfn background_color(&self) -> Color { self.0.background_color() }\nfn foreground(&self, pixels: &mut tiny_skia::PixmapMut<'_>, damage: &[Rectangle<i32, BufferCoords>], scale: f32) {\n    self.0.foreground(pixels, damage, scale)\n}\n```\nand then use `state_ref.program().background_color()` / `.foreground(..)` in `render_elements`.","locations":[{"ref":"cosmic-panel-bin/src/iced/mod.rs:185-196","code":"  185 | struct ProgramWrapper<P: Program>(P, LoopHandle<'static, GlobalState>);\n  186 | impl<P: Program> IcedProgram for ProgramWrapper<P> {\n  187 |     type Message = <P as Program>::Message;\n  188 | \n  189 |     fn update(&mut self, message: <P as Program>::Message) -> Task<<P as Program>::Message> {\n  190 |         self.0.update(message, &self.1)\n  191 |     }\n  192 | \n  193 |     fn view(&self) -> cosmic::Element<'_, <P as Program>::Message> {\n  194 |         self.0.view()\n  195 |     }\n  196 | }","lines":12,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/iced/mod.rs#L185-L196"},{"ref":"cosmic-panel-bin/src/iced/mod.rs:912-939","code":"  912 |                     let background_color = state_ref.program().0.background_color();\n  913 |                     let bounds = IcedSize::new(size.w as u32, size.h as u32);\n  914 |                     let viewport = Viewport::with_physical_size(bounds, scale.x);\n  915 | \n  916 |                     let damage = vec![cosmic::iced::Rectangle::new(\n  917 |                         cosmic::iced::Point::default(),\n  918 |                         viewport.logical_size(),\n  919 |                     )];\n  920 | \n  921 |                     internal_ref.renderer.draw(\n  922 |                         &mut pixels,\n  923 |                         &mut clip_mask,\n  924 |                         &viewport,\n  925 |                         &damage,\n  926 |                         background_color,\n  927 |                     );\n  928 | \n  929 |                     let damage = damage\n  930 |                         .into_iter()\n  931 |                         .filter_map(|x| x.snap())\n  932 |                         .map(|damage_rect| {\n  933 |                             Rectangle::new(\n  934 |                                 (damage_rect.x as i32, damage_rect.y as i32).into(),\n  935 |                                 (bounds.width as i32, bounds.height as i32).into(),\n  936 |                             )\n  937 |                         })\n  938 |                         .collect::<Vec<_>>();\n  939 |                     state_ref.program().0.foreground(&mut pixels, &damage, scale.x as f32);","lines":28,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/iced/mod.rs#L912-L939"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"easy","description":"In the `GetCornerRadiusLayer` branch the \"does a corner-radius object already exist for this surface?\" probe reads and inserts a `ToplevelHookId` (the type used for xdg surfaces) while the hook that is actually installed a few lines below is stored in a `LayerHookId`. Because the two are distinct types in the surface `data_map`, `radius_exists` is always `None` for layer surfaces, so (a) the `corner_radius_exists` protocol error can never be raised for layer surfaces and (b) `needs_hook` is always `true`, so a brand new `add_pre_commit_hook` is registered on the surface on *every* `get_corner_radius_layer` call. The hooks are never removed, so they accumulate and all run on every commit. The error text at line 179 also still says `CosmicCornerRadiusToplevelV1` in the layer branch.","fix":"Use `LayerHookId` for the probe in the layer branch:\n```rust\nlet hook_id = surface_data.data_map.get_or_insert_threadsafe(|| LayerHookId::new(None));\n```\nand fix the error message to mention `CosmicCornerRadiusLayerV1`.","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/cosmic_corner_radius.rs:168-203","code":"  168 |                     let radius_exists = with_states(surface.wl_surface(), |surface_data| {\n  169 |                         let hook_id = surface_data\n  170 |                             .data_map\n  171 |                             .get_or_insert_threadsafe(|| ToplevelHookId::new(None));\n  172 |                         let guard = hook_id.lock().unwrap();\n  173 |                         guard.as_ref().map(|(_, t)| t.upgrade().is_ok())\n  174 |                     });\n  175 |                     if radius_exists.unwrap_or_default() {\n  176 |                         resource.post_error(\n  177 |                             cosmic_corner_radius_manager_v1::Error::CornerRadiusExists as u32,\n  178 |                             format!(\n  179 |                                 \"{resource:?} CosmicCornerRadiusToplevelV1 object already exists \\\n  180 |                                  for the surface\"\n  181 |                             ),\n  182 |                         );\n  183 |                     }\n  184 |                     let data = Mutex::new(CornerRadiusInternal {\n  185 |                         surface: CornerRadiusSurface::Layer(layer.downgrade()),\n  186 |                         corners: None,\n  187 |                         padding: None,\n  188 |                     });\n  189 |                     let obj = data_init.init(id, data);\n  190 |                     let obj_downgrade = obj.downgrade();\n  191 | \n  192 |                     let needs_hook = radius_exists.is_none();\n  193 |                     if needs_hook {\n  194 |                         let hook_id =\n  195 |                             add_pre_commit_hook::<D, _>(surface.wl_surface(), layer_radius_hook);\n  196 |                         with_states(surface.wl_surface(), |surface_data| {\n  197 |                             let hook_ids = surface_data\n  198 |                                 .data_map\n  199 |                                 .get_or_insert_threadsafe(|| LayerHookId::new(None));\n  200 |                             let mut guard = hook_ids.lock().unwrap();\n  201 |                             *guard = Some((hook_id, obj_downgrade));\n  202 |                         });\n  203 |                     }","lines":36,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/cosmic_corner_radius.rs#L168-L203"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"The minimize-target rectangle reported to the compositor uses `size.w` for **both** the width and the height of the applet: `size: ((size.w.ceil() as i32).max(1), (size.w.ceil() as i32).max(1)).into()`. The height must come from `size.h`.\n\nFor a horizontal panel a minimize applet is typically much wider than it is tall (or vice-versa on a vertical panel), so the rectangle handed to `PanelCalloopMsg::MinimizeRect` is wrong and the compositor's minimize animation targets the wrong area.","fix":"Before:\n```rust\nsize: ((size.w.ceil() as i32).max(1), (size.w.ceil() as i32).max(1)).into(),\n```\nAfter:\n```rust\nsize: ((size.w.ceil() as i32).max(1), (size.h.ceil() as i32).max(1)).into(),\n```","locations":[{"ref":"cosmic-panel-bin/src/space/layout.rs:726-731","code":"  726 |                 if minimize_priority.is_some() {\n  727 |                     let new_rect = Rectangle {\n  728 |                         loc: (x, y).into(),\n  729 |                         size: ((size.w.ceil() as i32).max(1), (size.w.ceil() as i32).max(1)).into(),\n  730 |                     };\n  731 |                     if new_rect != self.minimize_applet_rect","lines":6,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/layout.rs#L726-L731"}]},
{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"In the `is_dock` branch that builds the panel input region, `PanelAnchor::Left` and `PanelAnchor::Top` add `anim_gap` to the region size, but `PanelAnchor::Right` and `PanelAnchor::Bottom` shift `loc` by `-anim_gap` **without** growing the size by `anim_gap`. The non-dock branch immediately below (lines 990-995) correctly adds `anim_gap` to the size for all four anchors.\n\n`anim_gap` is `self.anchor_gap`, which is non-zero while the panel is sliding for autohide (`anchor_gap = -(list_thickness) + hide_handle`), so on a right- or bottom-anchored dock the clickable/input region is offset by `anim_gap` but is `|anim_gap|` pixels too short, leaving a strip of the dock non-interactive (and the `self.blur(...)` rectangle, which reuses the same `loc`/`size`, mismatched with the drawn background).","fix":"Make the dock branch match the non-dock branch:\n\n```rust\nPanelAnchor::Right => (\n    (-anim_gap, side),\n    (new_logical_crosswise_dim + self.gap() as i32 + anim_gap, container_length),\n),\nPanelAnchor::Bottom => (\n    (side, -anim_gap),\n    (container_length, new_logical_crosswise_dim + self.gap() as i32 + anim_gap),\n),\n```","locations":[{"ref":"cosmic-panel-bin/src/space/layout.rs:934-957","code":"  934 |                 let (mut loc, mut size) = match self.config.anchor {\n  935 |                     PanelAnchor::Left => (\n  936 |                         (0, side as i32),\n  937 |                         (\n  938 |                             new_logical_crosswise_dim + self.gap() as i32 + anim_gap,\n  939 |                             container_length,\n  940 |                         ),\n  941 |                     ),\n  942 |                     PanelAnchor::Right => (\n  943 |                         (-anim_gap, side as i32),\n  944 |                         (new_logical_crosswise_dim + self.gap() as i32, container_length),\n  945 |                     ),\n  946 |                     PanelAnchor::Top => (\n  947 |                         (side as i32, 0),\n  948 |                         (\n  949 |                             container_length,\n  950 |                             new_logical_crosswise_dim + self.gap() as i32 + anim_gap,\n  951 |                         ),\n  952 |                     ),\n  953 |                     PanelAnchor::Bottom => (\n  954 |                         (side as i32, -anim_gap),\n  955 |                         (container_length, new_logical_crosswise_dim + self.gap() as i32),\n  956 |                     ),\n  957 |                 };","lines":24,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/layout.rs#L934-L957"},{"ref":"cosmic-panel-bin/src/space/layout.rs:981-986","code":"  981 |                 let (mut loc, mut size) = match self.config.anchor {\n  982 |                     PanelAnchor::Left => ((0, 0), (new_dim.w + anim_gap, new_dim.h)),\n  983 |                     PanelAnchor::Right => ((-anim_gap, 0), (new_dim.w + anim_gap, new_dim.h)),\n  984 |                     PanelAnchor::Top => ((0, 0), (new_dim.w, new_dim.h + anim_gap)),\n  985 |                     PanelAnchor::Bottom => ((0, -anim_gap), (new_dim.w, new_dim.h + anim_gap)),\n  986 |                 };","lines":6,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/layout.rs#L981-L986"}]},
{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"`move_to_overflow()` and `reorder_overflow_space()` place overflow applets on the same 8-column grid, but `move_to_overflow()` maps the element at `(x, y / 2)` while `reorder_overflow_space()` maps it at `(x, y)`. The stray `/ 2` halves the row offset (and, for a vertical panel where `x` and `y` have already been swapped, halves the *column* offset), so newly moved applets are drawn overlapping each other until the next `reorder_overflow_space()` pass silently corrects them.\n\nThe two calls also disagree on the `activate` argument (`true` vs `false`), which needlessly raises the moved applet in the overflow space stacking order.","fix":"Before (`layout.rs:1425`):\n```rust\noverflow_space.map_element(PopupMappedInternal::Window(w.0.clone()), (x, y / 2), true);\n```\nAfter:\n```rust\noverflow_space.map_element(PopupMappedInternal::Window(w.0.clone()), (x, y), false);\n```\nBetter still, extract the grid-position computation into a single shared helper used by both functions.","locations":[{"ref":"cosmic-panel-bin/src/space/layout.rs:1406-1416","code":" 1406 |             let x_i = overflow_cnt % 8;\n 1407 |             let mut x =\n 1408 |                 x_i as i32 * (applet_size_unit_major as i32 + spacing as i32) + BORDER_WIDTH as i32;\n 1409 |             let mut y = BORDER_WIDTH as i32\n 1410 |                 + (overflow_cnt / 8) as i32 * (applet_size_unit_cross + spacing) as i32;\n 1411 |             if !self.config.is_horizontal() {\n 1412 |                 std::mem::swap(&mut x, &mut y);\n 1413 |             }\n 1414 | \n 1415 |             space.unmap_elem(&CosmicMappedInternal::Window(w.0.clone()));\n 1416 |             overflow_space.map_element(PopupMappedInternal::Window(w.0.clone()), (x, y / 2), true);","lines":11,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/layout.rs#L1406-L1416"},{"ref":"cosmic-panel-bin/src/space/layout.rs:1104-1112","code":" 1104 |                         let x_i = overflow_cnt % 8;\n 1105 |                         let mut x = BORDER_WIDTH as i32\n 1106 |                             + x_i as i32 * (applet_size_unit_major as i32 + spacing);\n 1107 |                         let mut y = BORDER_WIDTH as i32\n 1108 |                             + (overflow_cnt / 8) as i32 * (applet_size_unit_cross as i32 + spacing);\n 1109 |                         if !self.config.is_horizontal() {\n 1110 |                             std::mem::swap(&mut x, &mut y);\n 1111 |                         }\n 1112 |                         space.map_element(e, (x, y), false);","lines":9,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/layout.rs#L1104-L1112"}]},
{"id":"CPY_5","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"`add_spacer_element_to_end` appends the synthetic `spacer-end` client with `push()` (i.e. at the end of the list), but `clear_spacer_end` looks at `first()` and calls `remove(0)`. This is a copy of `clear_spacer_start` (where `remove(0)` *is* correct because the start spacer is `insert(0, ..)`ed) that was not adapted. As a result the `spacer-end` `PanelClient` is essentially never removed - the `first()` check only matches when the list has exactly one entry - so a phantom client stays in `clients_right` (and possibly `clients_center`) forever after a layer overlap has been seen once, skewing the client indices used for applet ordering in `layout_`. The leading comment (\"remove fake client from end of right client list\") also contradicts the code, which removes from the front.","fix":"Mirror the `push` used by `add_spacer_element_to_end`:\n```rust\n// before\nif right_guard.first().is_some_and(|c| c.name == \"spacer-end\") {\n    right_guard.remove(0);\n} else if center_guard.first().is_some_and(|c| c.name == \"spacer-end\") {\n    center_guard.remove(0);\n}\n// after\nif right_guard.last().is_some_and(|c| c.name == \"spacer-end\") {\n    right_guard.pop();\n} else if center_guard.last().is_some_and(|c| c.name == \"spacer-end\") {\n    center_guard.pop();\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/space/panel_space.rs:592-602","code":"  592 |     fn clear_spacer_end(&mut self) {\n  593 |         // remove fake client from end of right client list\n  594 |         // this is used to create a spacer element\n  595 |         let mut right_guard = self.clients_right.lock().unwrap();\n  596 |         let mut center_guard = self.clients_center.lock().unwrap();\n  597 | \n  598 |         if right_guard.first().is_some_and(|c| c.name == \"spacer-end\") {\n  599 |             right_guard.remove(0);\n  600 |         } else if center_guard.first().is_some_and(|c| c.name == \"spacer-end\") {\n  601 |             center_guard.remove(0);\n  602 |         }","lines":11,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/panel_space.rs#L592-L602"}]},
{"id":"CPY_6","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"The two configure branches of `configure_panel_layer` clamp the incoming size differently. The `WaitConfigure` branch guards with `if width <= 0` / `if height <= 0`, while the `None` branch only guards with `if width == 0` / `if height == 0`. Since `width` comes from `w as i32` where `w: u32` is compositor-supplied, a value above `i32::MAX` truncates to a negative number that the `None` branch lets through. A negative dimension then flows into `constrain_dim`, where `w.clamp(range.start as i32, range.end as i32 - 1)` and the subsequent `Size` arithmetic operate on nonsense, and into `OutputDamageTracker::new` / `egl_surface.resize`.","fix":"Match the other branch:\n```rust\n// before\nif width == 0 {\n    width = 1;\n}\nif height == 0 {\n    height = 1;\n}\n// after\nif width <= 0 {\n    width = 1;\n}\nif height <= 0 {\n    height = 1;\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/space/panel_space.rs:1513-1518","code":" 1513 |                 if width == 0 {\n 1514 |                     width = 1;\n 1515 |                 }\n 1516 |                 if height == 0 {\n 1517 |                     height = 1;\n 1518 |                 }","lines":6,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/panel_space.rs#L1513-L1518"}]},
{"id":"CPY_7","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"The fallback arm of `PanelSpace::update_pointer` (the surface belongs to neither the layer, nor a popup, nor the\noverflow popup) removes the stale hover entry only if the previously hovered surface is still found in `self.space`\nor `self.overflow_left`. `self.overflow_center` and `self.overflow_right` are missing from the chain, unlike every\nother place in this file that walks the overflow spaces (e.g. lines 841-842 and 1727-1730). If the pointer was\nhovering an applet that had overflowed into the center or right overflow space, its `ServerPointerFocus` entry is\nnever removed from `s_hovered_surface`, so button presses keep being delivered to the stale target.","fix":"Chain all three overflow spaces. Before:\n\n```rust\n.chain(self.overflow_left.elements().filter_map(|e| e.wl_surface()))\n```\n\nAfter:\n\n```rust\n.chain(self.overflow_left.elements().filter_map(|e| e.wl_surface()))\n.chain(self.overflow_center.elements().filter_map(|e| e.wl_surface()))\n.chain(self.overflow_right.elements().filter_map(|e| e.wl_surface()))\n```","locations":[{"ref":"cosmic-panel-bin/src/space/wrapper_space.rs:1071-1086","code":" 1071 |         } else {\n 1072 |             if self\n 1073 |                 .space\n 1074 |                 .elements()\n 1075 |                 .filter_map(|e| e.wl_surface())\n 1076 |                 .chain(self.overflow_left.elements().filter_map(|e| e.wl_surface()))\n 1077 |                 .any(|e| {\n 1078 |                     e.wl_surface()\n 1079 |                         .zip(prev_hover.as_ref().map(|s| s.1.surface.wl_surface()))\n 1080 |                         .is_some_and(|(s, prev_hover)| Some(s) == prev_hover)\n 1081 |                 })\n 1082 |             {\n 1083 |                 let (pos, _) = prev_hover.unwrap();\n 1084 |                 self.s_hovered_surface.remove(pos);\n 1085 |             }\n 1086 |             return None;","lines":16,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/wrapper_space.rs#L1071-L1086"}]},
{"id":"CPY_8","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"`cosmic_corner_radius_layer_v1::Request::UnsetPadding` clears `guard.corners` instead of `guard.padding`. The cached state written afterwards is the right one (`CacheablePadding(None)`), but the object's internal record is left inconsistent: the previously set padding stays in `guard.padding` (so a later `SetPadding`/re-read sees a stale value) while the corner radii are wiped for no reason. It is a straight copy of the `UnsetRadius` arm above.","fix":"```rust\n// before\ncosmic_corner_radius_layer_v1::Request::UnsetPadding => {\n    let mut guard = data.lock().unwrap();\n    guard.corners = None;\n// after\ncosmic_corner_radius_layer_v1::Request::UnsetPadding => {\n    let mut guard = data.lock().unwrap();\n    guard.padding = None;\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/cosmic_corner_radius.rs:516-518","code":"  516 |             cosmic_corner_radius_layer_v1::Request::UnsetPadding => {\n  517 |                 let mut guard = data.lock().unwrap();\n  518 |                 guard.corners = None;","lines":3,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/cosmic_corner_radius.rs#L516-L518"}]},
{"id":"CPY_9","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `DataDeviceHandler::enter` the update branch writes the handler argument `surface` into the hovered-surface list while the insert branch pushes `offer.surface`. The two are normally the same object, but the inconsistency means that if they ever differ (the offer's surface is captured when the offer was created) the panel records a different surface depending on whether an entry for the seat already existed.","fix":"Use the same value in both branches. Before:\n```rust\nc_hovered_surface.push((\n    offer.surface.clone(),\n    seat.name.clone(),\n    FocusStatus::Focused,\n));\n```\nAfter:\n```rust\nc_hovered_surface.push((\n    surface.clone(),\n    seat.name.clone(),\n    FocusStatus::Focused,\n));\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/data_device/data_device.rs:93-105","code":"   93 |         {\n   94 |             let mut c_hovered_surface = self.client_state.hovered_surface.borrow_mut();\n   95 |             if let Some(i) = c_hovered_surface.iter().position(|f| f.1 == seat.name) {\n   96 |                 c_hovered_surface[i].0 = surface.clone();\n   97 |                 c_hovered_surface[i].2 = FocusStatus::Focused;\n   98 |             } else {\n   99 |                 c_hovered_surface.push((\n  100 |                     offer.surface.clone(),\n  101 |                     seat.name.clone(),\n  102 |                     FocusStatus::Focused,\n  103 |                 ));\n  104 |             }\n  105 |         }","lines":13,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/data_device/data_device.rs#L93-L105"}]},
