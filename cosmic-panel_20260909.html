{"id":"MEM_16","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"`WrapperSubsurface::handle_events` destroys only `c_subsurface` when the server surface dies. The caller\n(`space/panel_space.rs:1337`, `self.subsurfaces.retain_mut(|s| s.handle_events())`) then drops the whole\n`PanelSubsurface`, which still owns `c_surface: c_WlSurface`, `viewport: Option<WpViewport>` and\n`fractional_scale: Option<WpFractionalScaleV1>` - all raw wayland-client proxies that are never destroyed and\nhave no `Drop` impl (`PanelSubsurface`, unlike `PanelPopup`, has none at all). Every applet subsurface that comes\nand goes leaks a `wl_surface`, a `wp_viewport` and a `wp_fractional_scale_v1`. Note the popup path right above it\nin `panel_space.rs` *does* destroy `fractional_scale`/`viewport`, so this is an inconsistently applied cleanup.","fix":"Add a `Drop` impl for `PanelSubsurface` that tears everything down in the right order (EGL surface first, then\nsubsurface, then viewport/fractional scale, then the `wl_surface`):\n```rust\nimpl Drop for PanelSubsurface {\n    fn drop(&mut self) {\n        self.c_subsurface.destroy();\n        if let Some(vp) = self.viewport.take() { vp.destroy(); }\n        if let Some(fs) = self.fractional_scale.take() { fs.destroy(); }\n        self.c_surface.destroy();\n    }\n}\n```\nand reduce `handle_events` to just `self.s_surface.alive()`.","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/space/subsurface.rs:23-65","code":"   23 | #[derive(Debug)]\n   24 | pub struct PanelSubsurface {\n   25 |     // XXX implicitly drops egl_surface first to avoid segfault\n   26 |     /// the egl surface\n   27 |     pub egl_surface: EGLSurface,\n   28 | \n   29 |     /// the subsurface on the layer shell surface\n   30 |     pub c_subsurface: c_WlSubsurface,\n   31 | \n   32 |     /// the wl_surface\n   33 |     pub c_surface: c_WlSurface,\n   34 |     /// whether or not the subsurface needs to be rendered\n   35 |     pub dirty: bool,\n   36 |     /// full rectangle of the inner subsurface, including dropshadow borders\n   37 |     pub rectangle: Rectangle<i32, Logical>,\n   38 |     /// location of the subsurface wrapper\n   39 |     pub wrapper_rectangle: Point<i32, Logical>,\n   40 |     /// received a frame callback\n   41 |     pub has_frame: bool,\n   42 |     /// fractional scale for the subsurface\n   43 |     pub fractional_scale: Option<WpFractionalScaleV1>,\n   44 |     /// viewport for the subsurface\n   45 |     pub viewport: Option<WpViewport>,\n   46 |     /// scale factor for the subsurface\n   47 |     pub scale: f64,\n   48 |     /// damage tracking renderer\n   49 |     pub damage_tracked_renderer: OutputDamageTracker,\n   50 |     /// parent of the subsurface\n   51 |     pub parent: c_WlSurface,\n   52 | }\n   53 | \n   54 | impl WrapperSubsurface {\n   55 |     /// Handles any events that have occurred since the last call, redrawing if\n   56 |     /// needed. Returns true if the surface is alive.\n   57 |     pub fn handle_events(&mut self) -> bool {\n   58 |         if !self.s_surface.alive() {\n   59 |             self.subsurface.c_subsurface.destroy();\n   60 |             false\n   61 |         } else {\n   62 |             true\n   63 |         }\n   64 |     }\n   65 | }","lines":43,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/space/subsurface.rs#L23-L65"}]},
{"id":"MEM_17","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"`mem::forget(w)` deliberately leaks the `Vec<RecommendedWatcher>` returned by `watch_cosmic_theme` in order to keep the inotify watchers alive for the process lifetime. Each `RecommendedWatcher` owns an inotify fd and a background thread, and there is no comment explaining why the leak is intentional, so a future refactor that calls `watch_cosmic_theme` more than once (e.g. on theme-daemon restart) will accumulate watcher threads and fds with no way to reclaim them. `watch_config`'s watchers are stored in `space.watchers` right next to this, which shows the correct pattern already exists.","fix":"Store the theme watchers in a long-lived owner rather than leaking them, e.g. add a `theme_watchers: Vec<RecommendedWatcher>` field to `SpaceContainer` and do `space.theme_watchers = w;`. If the leak really must stay, replace `mem::forget(w)` with `Box::leak(Box::new(w))` plus a one-line comment stating the watchers must outlive the event loop.","locations":[{"ref":"cosmic-panel-bin/src/main.rs:136-139","code":"  136 |     match watch_cosmic_theme(event_loop.handle()) {\n  137 |         Ok(w) => mem::forget(w),\n  138 |         Err(e) => error!(\"Error while watching cosmic theme: {:?}\", e),\n  139 |     };","lines":4,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/main.rs#L136-L139"}]},
{"id":"MEM_18","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"`state.space.minimized_applets` is a `HashMap<String, MinimizeApplet>` keyed by output name that is only ever inserted into / updated by `set_rectangles`; nothing anywhere in the crate removes entries. Each `MinimizeApplet` holds a `WlSurface` client proxy, so surfaces belonging to unplugged outputs or unloaded minimize applets are kept alive indefinitely, and `update_toplevel` will keep matching against them (see the related dead-proxy finding). Growth is bounded by the number of distinct output names seen over the session, which on a docking-station workflow is unbounded in practice.","fix":"Prune the map when an output is removed (`OutputHandler::output_destroyed` in the client handlers) and drop entries whose `surface` is no longer alive, e.g. `state.space.minimized_applets.retain(|_, i| i.surface.is_alive());` at the start of `set_rectangles`.","locations":[{"ref":"cosmic-panel-bin/src/minimize.rs:47-65","code":"   47 | pub fn set_rectangles(state: &mut GlobalState, output: String, info: MinimizeApplet) {\n   48 |     // if surface matches cur & is different, or is higher priority, replace\n   49 |     let mut changed = false;\n   50 |     let minimized_applets = &mut state.space.minimized_applets;\n   51 | \n   52 |     let old_info = minimized_applets.entry(output.clone()).or_insert_with(|| {\n   53 |         changed = true;\n   54 |         info.clone()\n   55 |     });\n   56 | \n   57 |     if !changed {\n   58 |         if old_info.surface == info.surface && old_info.rect != info.rect {\n   59 |             old_info.rect = info.rect;\n   60 |             changed = true;\n   61 |         } else if old_info.priority < info.priority || !old_info.surface.is_alive() {\n   62 |             *old_info = info.clone();\n   63 |             changed = true;\n   64 |         }\n   65 |     }","lines":19,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/minimize.rs#L47-L65"}]},
{"id":"MEM_19","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"`SelectionHandler::new_selection`'s \"unset\" branch calls `seat.client.data_device.unset_selection(serial)` but\nleaves `seat.client.copy_paste_source` and `seat.server.selection_source` set to their previous values. The stale\n`CopyPasteSource` (and thus the underlying `wl_data_source` object in the host compositor) stays alive until the\nnext selection replaces it, and `send_selection`/`data_source.rs` continue to see a non-`None`\n`selection_source`, so the panel can still act as if it owns a selection it just gave up.","fix":"Clear both handles in the `else` branch:\n```rust\n} else {\n    seat.client.data_device.unset_selection(serial);\n    seat.client.copy_paste_source = None;  // Drop destroys the wl_data_source\n    seat.server.selection_source = None;\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/mod.rs:459-472","code":"  459 |         if let Some(source) = source {\n  460 |             seat.client.next_selection_offer_is_mine = true;\n  461 |             let mime_types = source.mime_types();\n  462 |             let copy_paste_source = self\n  463 |                 .client_state\n  464 |                 .data_device_manager\n  465 |                 .create_copy_paste_source(&self.client_state.queue_handle, mime_types);\n  466 |             copy_paste_source.set_selection(&seat.client.data_device, serial);\n  467 |             seat.client.copy_paste_source = Some(copy_paste_source);\n  468 |             seat.server.selection_source = Some(source);\n  469 |         } else {\n  470 |             seat.client.data_device.unset_selection(serial)\n  471 |         }\n  472 |     }","lines":14,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/mod.rs#L459-L472"}]},
{"id":"MEM_20","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"`GlobalState::bind_display` unconditionally builds a fresh `DmabufState` and calls `create_global`, then\n`self.server_state.dmabuf_state.replace((state, global))`. Dropping the previous `(DmabufState, DmabufGlobal)`\npair does *not* remove the previously advertised `zwp_linux_dmabuf_v1` global from the display -\n`DmabufState::disable_global`/`destroy_global` must be called explicitly. Today `bind_display` is only invoked\nonce (`xdg_shell_wrapper/mod.rs:93`), but any future GPU-reset/renderer-recreation path that calls it again will\nleave a dangling global advertised to clients whose backing state has been dropped.","fix":"Tear down the old global before installing the new one:\n```rust\nif let Some((mut old_state, old_global)) = self.server_state.dmabuf_state.take() {\n    old_state.destroy_global::<GlobalState>(dh, old_global);\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/shared_state.rs:137-151","code":"  137 | impl GlobalState {\n  138 |     /// bind the display for the space\n  139 |     pub fn bind_display(&mut self, dh: &DisplayHandle) {\n  140 |         if let Some(renderer) = self.space.renderer() {\n  141 |             let res = renderer.bind_wl_display(dh);\n  142 |             if let Err(err) = res {\n  143 |                 error!(\"{:?}\", err);\n  144 |             } else {\n  145 |                 let dmabuf_formats = renderer.dmabuf_formats().into_iter().collect_vec();\n  146 |                 let mut state = DmabufState::new();\n  147 |                 let global = state.create_global::<GlobalState>(dh, dmabuf_formats);\n  148 |                 self.server_state.dmabuf_state.replace((state, global));\n  149 |             }\n  150 |         }\n  151 |     }","lines":15,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/shared_state.rs#L137-L151"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"`relax_all()` calls `relax_overflow_left/center/right(u32::MAX, ...)`. When the section is not already relaxed, those functions forward `extra_space` to `relax_overflow_clients()`, which immediately does `let expand = extra_space as i32;`. `u32::MAX as i32` is `-1`, so instead of relaxing the applet the code executes `size.w = size.w.saturating_add(-1)` (or `size.h`), i.e. it *shrinks* every constrained applet by one pixel and then sends a configure. `extra_space.saturating_sub(expand as u32)` then evaluates to `u32::MAX - u32::MAX == 0`, so the loop exits after one applet.\n\n`relax_all()` is called at the end of every panel animation (`apply_animation_state()` in `panel_space.rs`), so every show/hide/expand animation can shave a pixel off the highest-priority constrained applet instead of restoring it to its natural size.","fix":"Clamp before casting and distribute the space instead of handing all of it to the first applet:\n\n```rust\nlet expand = i32::try_from(extra_space).unwrap_or(i32::MAX);\n```\n\nand have `relax_all()` pass a bounded amount (e.g. `i32::MAX as u32`) rather than `u32::MAX`.","locations":[{"ref":"cosmic-panel-bin/src/space/layout.rs:1729-1779","code":" 1729 |     fn relax_overflow_clients(&self, clients: &mut OverflowClientPartition, mut extra_space: u32) {\n 1730 |         if self.remap_attempts > 0 {\n 1731 |             return;\n 1732 |         }\n 1733 |         for ShrinkableClient { window: w, .. } in\n 1734 |             clients.constrained_shrinkables(self.config.is_horizontal(), self.scale).drain(..).rev()\n 1735 |         {\n 1736 |             let expand = extra_space as i32;\n 1737 |             tracing::info!(\"Relaxing overflow client by {expand}, {:?}\", w.geometry().size);\n 1738 |             if extra_space == 0 {\n 1739 |                 tracing::info!(\"No more space to relax\");\n 1740 |                 break;\n 1741 |             }\n 1742 | \n 1743 |             let Some(t) = w.toplevel() else {\n 1744 |                 continue;\n 1745 |             };\n 1746 | \n 1747 |             let is_horizontal: bool = self.config.is_horizontal();\n 1748 | \n 1749 |             let skip = t.with_pending_state(|state| {\n 1750 |                 state.size = None;\n 1751 |                 if let Some(size) = &mut state.bounds {\n 1752 |                     info!(\"Old size: {:?}\", size);\n 1753 |                     if is_horizontal {\n 1754 |                         size.h = 0;\n 1755 |                         if size.w != 0 {\n 1756 |                             size.w = size.w.saturating_add(expand);\n 1757 |                         } else {\n 1758 |                             return true;\n 1759 |                         }\n 1760 |                     } else {\n 1761 |                         size.w = 0;\n 1762 |                         if size.h != 0 {\n 1763 |                             size.h = size.h.saturating_add(expand);\n 1764 |                         } else {\n 1765 |                             return true;\n 1766 |                         }\n 1767 |                     }\n 1768 | \n 1769 |                     info!(\"New size: {:?}\", state.size);\n 1770 |                     false\n 1771 |                 } else {\n 1772 |                     true\n 1773 |                 }\n 1774 |             });\n 1775 |             t.send_pending_configure();\n 1776 |             if !skip {\n 1777 |                 extra_space = extra_space.saturating_sub(expand as u32);\n 1778 |             }\n 1779 |         }","lines":51,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/layout.rs#L1729-L1779"},{"ref":"cosmic-panel-bin/src/space/layout.rs:1674-1676","code":" 1674 |         self.relax_overflow_left(u32::MAX, &mut left_overflow_button);\n 1675 |         self.relax_overflow_center(u32::MAX, &mut center_overflow_button);\n 1676 |         self.relax_overflow_right(u32::MAX, &mut right_overflow_button);","lines":3,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/layout.rs#L1674-L1676"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"`pad_rect` uses `i32::checked_sub`, which only returns `None` on *arithmetic overflow*, never when the result is merely negative. `10i32.checked_sub(20)` is `Some(-10)`, so a padding larger than the surface silently yields a rectangle with negative width/height instead of `None`. Consequences: (1) the `padding_too_large` protocol error in `layer_radius_hook` is effectively unreachable, and (2) the subsequent radius check computes `(padded_box.size.w.min(padded_box.size.h) / 2) as u32` on a negative `i32`, which wraps to a huge `u32` (e.g. `-10 / 2 = -5` -> `4294967291`), so the `radius_too_large` check always passes too. Both validations that this hook exists for are bypassed, and a negative-size rectangle is handed to `commit_wlr`. The same unchecked `as u32` cast on a `/ 2` of possibly-negative geometry exists in `xdg_radius_hook`.","fix":"Reject negative results explicitly and clamp before casting:\n```rust\nfn pad_rect(mut rect: Rectangle<i32, Logical>, padding: &Padding) -> Option<Rectangle<i32, Logical>> {\n    if padding.top < 0 || padding.right < 0 || padding.bottom < 0 || padding.left < 0 {\n        return None;\n    }\n    rect.loc.x += padding.left;\n    rect.loc.y += padding.top;\n    rect.size.w = rect.size.w.checked_sub(padding.left + padding.right).filter(|w| *w >= 0)?;\n    rect.size.h = rect.size.h.checked_sub(padding.top + padding.bottom).filter(|h| *h >= 0)?;\n    Some(rect)\n}\n```\nand compute the radius bound with `let half_min_dim = padded_box.size.w.min(padded_box.size.h).max(0) as u32 / 2;`.","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/cosmic_corner_radius.rs:584-595","code":"  584 | fn pad_rect(\n  585 |     mut rect: Rectangle<i32, Logical>,\n  586 |     padding: &Padding,\n  587 | ) -> Option<Rectangle<i32, Logical>> {\n  588 |     rect.size.h = rect.size.h.checked_sub(padding.top)?;\n  589 |     rect.loc.x += padding.left;\n  590 |     rect.size.w = rect.size.w.checked_sub(padding.left)?;\n  591 |     rect.loc.y += padding.top;\n  592 |     rect.size.h = rect.size.h.checked_sub(padding.bottom)?;\n  593 |     rect.size.w = rect.size.w.checked_sub(padding.right)?;\n  594 |     Some(rect)\n  595 | }","lines":12,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/cosmic_corner_radius.rs#L584-L595"},{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/cosmic_corner_radius.rs:622-628","code":"  622 |         if corners.0.as_ref().is_some_and(|corners| {\n  623 |             let half_min_dim = (padded_box.size.w.min(padded_box.size.h) / 2) as u32;\n  624 |             corners.top_right > half_min_dim\n  625 |                 || corners.top_left > half_min_dim\n  626 |                 || corners.bottom_right > half_min_dim\n  627 |                 || corners.bottom_left > half_min_dim\n  628 |         }) && let Some(hook) = surface_data.data_map.get::<LayerHookId>()","lines":7,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/cosmic_corner_radius.rs#L622-L628"},{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/cosmic_corner_radius.rs:555-564","code":"  555 |             .pending()\n  556 |             .geometry\n  557 |             .zip(corners.0.as_ref())\n  558 |             .is_some_and(|(geo, corners)| {\n  559 |                 let half_min_dim = (geo.size.w.min(geo.size.h) / 2) as u32;\n  560 |                 corners.top_right > half_min_dim\n  561 |                     || corners.top_left > half_min_dim\n  562 |                     || corners.bottom_right > half_min_dim\n  563 |                     || corners.bottom_left > half_min_dim\n  564 |             })","lines":10,"link":"https://github.com/pop-os/cosmic-panel/blob/f66 {"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"very_easy","description":"`let side = (layer_length as u32 - actual_length as u32) / 2;` performs an **unchecked unsigned subtraction** on two `i32` values that are cast to `u32`. `layer_length` is `new_dim.w`/`new_dim.h` (the *constrained* dimension, clamped by `constrain_dim()`), while `actual_length` is `self.actual_size.w`/`.h`, which is only clamped on the *cross* axis (see lines 421-426: for a horizontal panel only `self.actual_size.h` is overwritten with the constrained value).\n\nWhenever the computed content length exceeds the clamp (rounding through `.to_f64().to_logical(self.scale).to_i32_round()`, an unresolvable overflow, or a stale `suggested_length`), `actual_length > layer_length` and the expression panics in debug builds (\"attempt to subtract with overflow\") or wraps to roughly `2^31` in release, so `side as i32` becomes a nonsensical coordinate and the panel's input region (and blur rectangle) is placed far off-surface, making the dock unclickable.","fix":"Before:\n```rust\nlet side = (layer_length as u32 - actual_length as u32) / 2;\n```\nAfter:\n```rust\nlet side = (layer_length.saturating_sub(actual_length).max(0)) / 2;\n```\n(and use `side` directly as an `i32`, dropping the `side as i32` casts below).","locations":[{"ref":"cosmic-panel-bin/src/space/layout.rs:927-932","code":"  927 |                 let (layer_length, actual_length) = if self.config.is_horizontal() {\n  928 |                     (new_dim.w, self.actual_size.w)\n  929 |                 } else {\n  930 |                     (new_dim.h, self.actual_size.h)\n  931 |                 };\n  932 |                 let side = (layer_length as u32 - actual_length as u32) / 2;","lines":6,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/layout.rs#L927-L932"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"Timestamps are produced with `self.start_time.elapsed().as_millis().try_into().unwrap()` and `time.try_into().unwrap()` (`time` is the `u128` millisecond count). `u128 -> u32` fails once the panel has been running for more than `u32::MAX` ms (~49.7 days), at which point every pointer event panics and the panel dies. Wayland timestamps are explicitly allowed to wrap, so truncation is the correct behaviour here, not an abort.","fix":"Use a wrapping conversion, e.g. `let time = start_time.elapsed().as_millis() as u32;` once at the top of `pointer_frame_inner` and `*time = self.start_time.elapsed().as_millis() as u32;` in `update_generated_event_serial`, and drop the `try_into().unwrap()` calls.","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/pointer.rs:29-53","code":"   29 |     pub fn update_generated_event_serial(&self, events: &mut Vec<PointerEvent>) {\n   30 |         for e in events {\n   31 |             match &mut e.kind {\n   32 |                 sctk::seat::pointer::PointerEventKind::Enter { serial } => {\n   33 |                     *serial = SERIAL_COUNTER.next_serial().into();\n   34 |                 },\n   35 |                 sctk::seat::pointer::PointerEventKind::Leave { serial } => {\n   36 |                     *serial = SERIAL_COUNTER.next_serial().into();\n   37 |                 },\n   38 |                 sctk::seat::pointer::PointerEventKind::Motion { time } => {\n   39 |                     *time = self.start_time.elapsed().as_millis().try_into().unwrap();\n   40 |                 },\n   41 |                 sctk::seat::pointer::PointerEventKind::Press { time, serial, .. } => {\n   42 |                     *time = self.start_time.elapsed().as_millis().try_into().unwrap();\n   43 |                     *serial = SERIAL_COUNTER.next_serial().into();\n   44 |                 },\n   45 |                 sctk::seat::pointer::PointerEventKind::Release { time, serial, .. } => {\n   46 |                     *time = self.start_time.elapsed().as_millis().try_into().unwrap();\n   47 |                     *serial = SERIAL_COUNTER.next_serial().into();\n   48 |                 },\n   49 |                 sctk::seat::pointer::PointerEventKind::Axis { time, .. } => {\n   50 |                     *time = self.start_time.elapsed().as_millis().try_into().unwrap();\n   51 |                 },\n   52 |             }\n   53 |         }","lines":25,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/pointer.rs#L29-L53"},{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/pointer.rs:79-88","code":"   79 |                 sctk::seat::pointer::PointerEventKind::Leave { .. } => {\n   80 |                     ptr.motion(\n   81 |                         self,\n   82 |                         None,\n   83 |                         &MotionEvent {\n   84 |                             location: (0.0, 0.0).into(),\n   85 |                             serial: SERIAL_COUNTER.next_serial(),\n   86 |                             time: time.try_into().unwrap(),\n   87 |                         },\n   88 |                     );","lines":10,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/pointer.rs#L79-L88"},{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/pointer.rs:135-143","code":"  135 |                         ptr.motion(\n  136 |                             self,\n  137 |                             Some((s_surface.into(), Point::default())),\n  138 |                             &MotionEvent {\n  139 |                                 location: Point::from((surface_x, surface_y)),\n  140 |                                 serial: SERIAL_COUNTER.next_serial(),\n  141 |                                 time: time.try_into().unwrap(),\n  142 |                             },\n  143 |                         );","lines":9,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/pointer.rs#L135-L143"},{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/pointer.rs:162-170","code":"  162 |                             ptr.motion(\n  163 |                                 self,\n  164 |                                 Some((surface, s_pos)),\n  165 |                                 &MotionEvent {\n  166 |                                     location: c_pos.to_f64() + Point::from((surface_x, surface_y)),\n  167 |                                     serial: SERIAL_COUNTER.next_serial(),\n  168 |                                     time: time.try_into().unwrap(),\n  169 |                                 },\n  170 |                             );","lines":9,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/pointer.rs#L162-L170"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"The main loop converts the process uptime to the `u32` millisecond timestamp expected by Wayland with `global_state.start_time.elapsed().as_millis().try_into()?`. After roughly 49.7 days of uptime the value no longer fits in a `u32`, `try_into` returns `Err`, the `?` propagates out of `run()` and the panel exits. Wayland timestamps are explicitly defined as wrapping 32-bit milliseconds, so failing here is wrong.","fix":"Let the value wrap instead of erroring: `global_state.start_time.elapsed().as_millis() as u32` (compute it once before the two uses).","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/mod.rs:145-154","code":"  145 |             let _ = space.handle_events(\n  146 |                 &s_dh,\n  147 |                 &global_state.client_state.queue_handle,\n  148 |                 &mut global_state.server_state.popup_manager,\n  149 |                 global_state.start_time.elapsed().as_millis().try_into()?,\n  150 |                 // Fallback frame-callback throttle for embedded applets;\n  151 |                 // panels override it with the frame duration of their own\n  152 |                 // output (see `PanelSpace::render`).\n  153 |                 Some(Duration::from_millis(16)),\n  154 |             );","lines":10,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/mod.rs#L145-L154"},{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/mod.rs:158-163","code":"  158 |         if let Some(renderer) = global_state.space.renderer() {\n  159 |             global_state.client_state.draw_layer_surfaces(\n  160 |                 renderer,\n  161 |                 global_state.start_time.elapsed().as_millis().try_into()?,\n  162 |             );\n  163 |         }","lines":6,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/mod.rs#L158-L163"}]},
{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`PanelSize::Custom(u32)` is deserialized from user config with no upper bound, and all the derived-size helpers\ndo unchecked arithmetic on it:\n- `get_applet_padding`: `(s / 4) as u16` and `(s * 3 / 20) as u16` silently truncate for any `s > 262_140`\n  (e.g. `Custom(300000)` yields `9464` instead of `75000`).\n- `get_applet_shrinkable_padding`: `4 + (s / 4) as u16` truncates *then* adds, so it panics in debug and wraps in\n  release once `(s / 4) as u16` exceeds `65531`.\n- `get_applet_icon_size`: `s * 7 / 10` overflows `u32` for `s > 613_566_756`.\n- `get_applet_icon_size_with_padding`: adds a `u32` icon size to `padding as u32 * 2` with no checks.\n- `get_dimensions`: `s * 2 + 1 + gap` overflows `u32` for large `s`.\nIn release these wrap silently and produce absurd layout values; in debug they abort the panel.","fix":"Clamp `Custom` once, at the source, to a sane range and do the arithmetic in a wide type. Add a single helper:\n```rust\nimpl PanelSize {\n    const MAX_CUSTOM: u32 = 512;\n    fn normalized_custom(s: u32) -> u32 { s.clamp(16, Self::MAX_CUSTOM) / 4 * 4 }\n}\n```\nuse it in place of the six copies of `(*s).max(16) / 4 * 4`, and replace the `as u16` casts with\n`u16::try_from(..).unwrap_or(u16::MAX)`.","locations":[{"ref":"cosmic-panel-config/src/panel_config.rs:143-232","code":"  143 | impl PanelSize {\n  144 |     /// get applet icon dimensions\n  145 |     pub fn get_applet_icon_size(&self, is_symbolic: bool) -> u32 {\n  146 |         if is_symbolic {\n  147 |             match self {\n  148 |                 PanelSize::XS => 16,\n  149 |                 PanelSize::S => 20,\n  150 |                 PanelSize::M => 28,\n  151 |                 PanelSize::L => 32,\n  152 |                 PanelSize::XL => 48,\n  153 |                 PanelSize::Custom(s) => {\n  154 |                     let s = (*s).max(16) / 4 * 4;\n  155 |                     s / 2\n  156 |                 },\n  157 |             }\n  158 |         } else {\n  159 |             match self {\n  160 |                 PanelSize::XS => 24,\n  161 |                 PanelSize::S => 32,\n  162 |                 PanelSize::M => 40,\n  163 |                 PanelSize::L => 48,\n  164 |                 PanelSize::XL => 56,\n  165 |                 PanelSize::Custom(s) => {\n  166 |                     let s = (*s).max(16) / 4 * 4;\n  167 |                     s * 7 / 10\n  168 |                 },\n  169 |             }\n  170 |         }\n  171 |     }\n  172 | \n  173 |     pub fn get_applet_padding(&self, is_symbolic: bool) -> u16 {\n  174 |         if is_symbolic {\n  175 |             match self {\n  176 |                 PanelSize::XS => 8,\n  177 |                 PanelSize::S => 10,\n  178 |                 PanelSize::M => 14,\n  179 |                 PanelSize::L => 16,\n  180 |                 PanelSize::XL => 16,\n  181 |                 PanelSize::Custom(s) => {\n  182 |                     let s = (*s).max(16) / 4 * 4;\n  183 |                     (s / 4) as u16\n  184 |                 },\n  185 |             }\n  186 |         } else {\n  187 |             match self {\n  188 |                 PanelSize::XS => 4,\n  189 |                 PanelSize::S => 4,\n  190 |                 PanelSize::M => 8,\n  191 |                 PanelSize::L => 8,\n  192 |                 PanelSize::XL => 12,\n  193 |                 PanelSize::Custom(s) => {\n  194 |                     let s = (*s).max(16) / 4 * 4;\n  195 |                     (s * 3 / 20) as u16\n  196 |                 },\n  197 |             }\n  198 |         }\n  199 |     }\n  200 | \n  201 |     pub fn get_applet_shrinkable_padding(&self, is_symbolic: bool) -> u16 {\n  202 |         if is_symbolic {\n  203 |             match self {\n  204 |                 PanelSize::XS => 12,\n  205 |                 PanelSize::S => 14,\n  206 |                 PanelSize::M => 18,\n  207 |                 PanelSize::L => 20,\n  208 |                 PanelSize::XL => 20,\n  209 |                 PanelSize::Custom(s) => {\n  210 |                     let s = (*s).max(16) / 4 * 4;\n  211 |                     4 + (s / 4) as u16\n  212 |                 },\n  213 |             }\n  214 |         } else {\n  215 |             match self {\n  216 |                 PanelSize::XS => 8,\n  217 |                 PanelSize::S => 8,\n  218 |                 PanelSize::M => 12,\n  219 |                 PanelSize::L => 12,\n  220 |                 PanelSize::XL => 16,\n  221 |                 PanelSize::Custom(s) => {\n  222 |                     let s = (*s).max(16) / 4 * 4;\n  223 |                     4 + (s * 3 / 20) as u16\n  224 |                 },\n  225 |             }\n  226 |         }\n  227 |     }\n  228 | \n  229 |     pub fn get_applet_icon_size_with_padding(&self, is_symbolic: bool) -> u32 {\n  230 |         self.get_applet_icon_size(is_symbolic) + self.get_applet_padding(is_symbolic) as u32 * 2\n  231 |     }\n  232 | }","lines":90,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-config/src/panel_config.rs#L143-L232"},{"ref":"cosmic-panel-config/src/panel_config.rs:709-719","code":"  709 |         let bar_thickness = match &self.size {\n  710 |             PanelSize::XS => 8 + gap..61 + gap,\n  711 |             PanelSize::S => 8 + gap..81 + gap,\n  712 |             PanelSize::M => 8 + gap..101 + gap,\n  713 |             PanelSize::L => 8 + gap..121 + gap,\n  714 |             PanelSize::XL => 8 + gap..141 + gap,\n  715 |             PanelSize::Custom(s) => {\n  716 |                 let s = (*s).max(16) / 4 * 4;\n  717 |                 8 + gap..s * 2 + 1 + gap\n  718 |             },\n  719 |         };","lines":11,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-config/src/panel_config.rs#L709-L719"}]},
{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`constrain_dim` computes the clamp bounds as `w_range.start as i32` and `w_range.end as i32 - 1` from `u32` values that ultimately originate from compositor-supplied configure sizes (`suggested_length` feeds `o_w..o_w + 1` in `CosmicPanelConfig::get_dimensions`). A `u32` above `i32::MAX` truncates to a negative `i32`, producing `min > max`, and `i32::clamp` panics on `assert!(min <= max)`. The same truncation makes the returned dimension meaningless for merely large values.","fix":"Use checked conversions and guard the ordering:\n```rust\nif let Some(r) = constrained_w {\n    let lo = i32::try_from(r.start).unwrap_or(i32::MAX);\n    let hi = i32::try_from(r.end).unwrap_or(i32::MAX).saturating_sub(1);\n    w = w.clamp(lo.min(hi), hi.max(lo));\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/space/panel_space.rs:1132-1139","code":" 1132 |         let (constrained_w, constrained_h) =\n 1133 |             self.config.get_dimensions(output_dims, self.suggested_length, active_gap);\n 1134 |         if let Some(w_range) = constrained_w {\n 1135 |             w = w.clamp(w_range.start as i32, w_range.end as i32 - 1);\n 1136 |         }\n 1137 |         if let Some(h_range) = constrained_h {\n 1138 |             h = h.clamp(h_range.start as i32, h_range.end as i32 - 1);\n 1139 |         }","lines":8,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/panel_space.rs#L1132-L1139"}]},
{"id":"OVF_8","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`self.scale` is an `f64` fractional scale, and it is passed to `wl_surface.set_buffer_scale` through a truncating\n`as i32` cast in three places. `1.5` truncates to `1` (the buffer is then interpreted at the wrong size), and any\nscale below `1.0` truncates to `0`, which is a `wl_surface` protocol error (`invalid_scale`) and disconnects the\npanel from the compositor.","fix":"Round and clamp to the protocol's valid range, e.g. `let buffer_scale = (scale.round() as i32).max(1);` and use\n`buffer_scale` for both `set_buffer_scale` and `smithay::output::Scale::Integer`.","locations":[{"ref":"cosmic-panel-bin/src/space/wrapper_space.rs:290-292","code":"  290 |         if fractional_scale.is_none() {\n  291 |             c_wl_surface.set_buffer_scale(self.scale as i32);\n  292 |         }","lines":3,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/wrapper_space.rs#L290-L292"},{"ref":"cosmic-panel-bin/src/space/wrapper_space.rs:1693-1700","code":" 1693 |             if legacy && self.layer_fractional_scale.is_none() {\n 1694 |                 surface.set_buffer_scale(scale as i32);\n 1695 |                 if let Some(output) = self.output.as_ref() {\n 1696 |                     output.1.change_current_state(\n 1697 |                         None,\n 1698 |                         None,\n 1699 |                         Some(smithay::output::Scale::Integer(scale as i32)),\n 1700 |                         None,","lines":8,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/wrapper_space.rs#L1693-L1700"},{"ref":"cosmic-panel-bin/src/space/wrapper_space.rs:1799-1800","code":" 1799 |                 if legacy {\n 1800 |                     popup.c_popup.wl_surface().set_buffer_scale(scale as i32);","lines":2,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/wrapper_space.rs#L1799-L1800"}]},
{"id":"OVF_9","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"The axis handling multiplies a compositor-supplied `i32` by 120 (`horizontal.discrete * 120`, `vertical.discrete * 120`) with no bounds check. `discrete` comes straight from `wl_pointer.axis_discrete`; a value above `i32::MAX / 120` panics in debug builds and silently wraps to a negative scroll amount in release builds.","fix":"Use a saturating multiply. Before:\n```rust\n} else if horizontal.discrete != 0 {\n    af = af.v120(Axis::Horizontal, horizontal.discrete * 120);\n}\n```\nAfter:\n```rust\n} else if horizontal.discrete != 0 {\n    af = af.v120(Axis::Horizontal, horizontal.discrete.saturating_mul(120));\n}\n```\n(and the same for `vertical.discrete`).","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/pointer.rs:377-403","code":"  377 |                     if !horizontal.is_none() {\n  378 |                         if horizontal.value120 != 0 {\n  379 |                             af = af.v120(Axis::Horizontal, horizontal.value120);\n  380 |                         } else if horizontal.discrete != 0 {\n  381 |                             af = af.v120(Axis::Horizontal, horizontal.discrete * 120);\n  382 |                         }\n  383 |                         if horizontal.absolute != 0.0 {\n  384 |                             af = af.value(Axis::Horizontal, horizontal.absolute);\n  385 |                         }\n  386 |                         if horizontal.stop {\n  387 |                             af = af.stop(Axis::Horizontal);\n  388 |                         }\n  389 |                     }\n  390 | \n  391 |                     if !vertical.is_none() {\n  392 |                         if vertical.value120 != 0 {\n  393 |                             af = af.v120(Axis::Vertical, vertical.value120);\n  394 |                         } else if vertical.discrete != 0 {\n  395 |                             af = af.v120(Axis::Vertical, vertical.discrete * 120);\n  396 |                         }\n  397 |                         if vertical.absolute != 0.0 {\n  398 |                             af = af.value(Axis::Vertical, vertical.absolute);\n  399 |                         }\n  400 |                         if vertical.stop {\n  401 |                             af = af.stop(Axis::Vertical);\n  402 |                         }\n  403 |                     }","lines":27,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/pointer.rs#L377-L403"}]},
{"id":"OVF_10","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"`GlobalState::scale_factor_changed` does `surface.set_buffer_scale(scale_factor as i32)` in the legacy path.\n`scale_factor` is an `f64` and `as i32` truncates towards zero, so a fractional scale of `1.75` becomes `1` and a\nscale of `0.5` becomes `0` - and `wl_surface.set_buffer_scale(0)` is a protocol error\n(`wl_surface::error::invalid_scale`) that kills the panel's connection to the compositor.","fix":"Before:\n```rust\nsurface.set_buffer_scale(scale_factor as i32);\n```\nAfter:\n```rust\nsurface.set_buffer_scale((scale_factor.round() as i32).max(1));\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/shared_state.rs:104-107","code":"  104 |             if tracked_surface.3.wl_surface() == surface {\n  105 |                 if legacy {\n  106 |                     surface.set_buffer_scale(scale_factor as i32);\n  107 |                 }","lines":4,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/shared_state.rs#L104-L107"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"critical","difficulty":"very_easy","description":"`CornerRadiusHandler::commit_wlr` has the exact same inverted guard as `commit_blur`: it `continue`s when the proxied layer surface *is* the one whose corner radius/padding changed, so the radius and padding are pushed onto every unrelated proxied layer surface and never onto the surface that requested them. `PanelSpace::update_popup_corners` (the popup equivalent) correctly matches with `find(|p| p.s_surface.wl_surface() == surface)`.","fix":"```rust\n// before\nif s_layer_shell_surface.wl_surface() == wl_surface {\n    continue;\n}\n// after\nif s_layer_shell_surface.wl_surface() != wl_surface {\n    continue;\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/cosmic_corner_radius.rs:759-764","code":"  759 |         for (_, _, s_layer_shell_surface, c_layer_shell_surface, _, _, _, _, corner, _) in\n  760 |             &mut self.client_state.proxied_layer_surfaces\n  761 |         {\n  762 |             if s_layer_shell_surface.wl_surface() == wl_surface {\n  763 |                 continue;\n  764 |             }","lines":6,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/cosmic_corner_radius.rs#L759-L764"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"critical","difficulty":"very_easy","description":"`GlobalState::commit_blur` iterates the proxied layer surfaces and *skips* the surface that the blur region was actually set on, then applies the region to every *other* proxied layer surface. The condition is inverted: `if s_layer_shell_surface.wl_surface() == surface { continue; }` means the matching surface is the only one that never gets its blur region updated. Compare with `PanelSpace::commit_popup_blur`, which correctly does `self.popups.iter_mut().find(|p| p.s_surface.wl_surface() == surface)`. Result: blur is applied to unrelated layer surfaces (with coordinates belonging to a different surface) and never to the requesting one.","fix":"Invert the guard so that only the matching surface is processed:\n```rust\n// before\nif s_layer_shell_surface.wl_surface() == surface {\n    continue;\n}\n// after\nif s_layer_shell_surface.wl_surface() != surface {\n    continue;\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/ext_background_effect.rs:47-52","code":"   47 |         for (_, _, s_layer_shell_surface, c_layer_shell_surface, _, _, _, _, _, blur_surface) in\n   48 |             &mut self.client_state.proxied_layer_surfaces\n   49 |         {\n   50 |             if s_layer_shell_surface.wl_surface() == surface {\n   51 |                 continue;\n   52 |             }","lines":6,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/ext_background_effect.rs#L47-L52"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"The `ConfigUpdate::Entries` handler uses `return` instead of `continue` when `CosmicPanelConfig::cosmic_config(&entry)` fails. A single bad/unreadable panel entry therefore aborts the whole event handler: every remaining new entry in `to_update` is skipped **and** the entire removal pass below (lines 169-180, which calls `state.space.remove_space`) never runs. The result is that panels that were deleted from the configuration stay on screen, and panels added in the same update never appear, until the process is restarted.","fix":"Change the error arm to skip only the offending entry:\n```rust\nlet cosmic_config = match CosmicPanelConfig::cosmic_config(&entry) {\n    Ok(config) => config,\n    Err(err) => {\n        error!(\"Failed to load cosmic config: {:?}\", err);\n        continue;\n    },\n};\n```","locations":[{"ref":"cosmic-panel-bin/src/config_watching.rs:117-124","code":"  117 |                 for entry in to_update {\n  118 |                     let cosmic_config = match CosmicPanelConfig::cosmic_config(&entry) {\n  119 |                         Ok(config) => config,\n  120 |                         Err(err) => {\n  121 |                             error!(\"Failed to load cosmic config: {:?}\", err);\n  122 |                             return;\n  123 |                         },\n  124 |                     };","lines":8,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/config_watching.rs#L117-L124"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"The overflow popup's cross-axis size is computed with `.ceil().min(1.0)`, which *caps* the number of applet rows at one. The applets themselves are laid out in rows of 8 (`overflow_cnt / 8` selects the row in both `reorder_overflow_space()` and `move_to_overflow()`), so as soon as there are 9 or more overflow applets the popup surface is exactly one row tall while the content needs two or more rows. Everything below the first row is clipped out of the popup.\n\nThe same expression also collapses to `0.0` when `actual`/`overflow_cnt` is `0`, producing a popup of size `2 * BORDER_WIDTH`. The intent is clearly \"at least one row\", i.e. `.max(1.0)`.","fix":"Replace `.min(1.0)` with `.max(1.0)` in both places.\n\nBefore (`layout.rs:1132-1133`):\n```rust\nlet mut popup_cross = 2. * BORDER_WIDTH as f32\n    + (actual as f32 / 8.).ceil().min(1.0) * applet_size_unit_cross as f32;\n```\nAfter:\n```rust\nlet mut popup_cross = 2. * BORDER_WIDTH as f32\n    + (actual as f32 / 8.).ceil().max(1.0) * applet_size_unit_cross as f32;\n```\n\nBefore (`layout.rs:1453-1454`):\n```rust\nlet mut popup_cross = 2. * BORDER_WIDTH as f32\n    + (overflow_cnt as f32 / 8.).ceil().min(1.0) * applet_size_unit_cross as f32;\n```\nAfter:\n```rust\nlet mut popup_cross = 2. * BORDER_WIDTH as f32\n    + (overflow_cnt as f32 / 8.).ceil().max(1.0) * applet_size_unit_cross as f32;\n```","locations":[{"ref":"cosmic-panel-bin/src/space/layout.rs:1123-1124","code":" 1123 |                         let mut popup_cross = 2. * BORDER_WIDTH as f32\n 1124 |                             + (actual as f32 / 8.).ceil().min(1.0) * applet_size_unit_cross as f32;","lines":2,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/layout.rs#L1123-L1124"},{"ref":"cosmic-panel-bin/src/space/layout.rs:1444-1445","code":" 1444 |         let mut popup_cross = 2. * BORDER_WIDTH as f32\n 1445 |             + (overflow_cnt as f32 / 8.).ceil().min(1.0) * applet_size_unit_cross as f32;","lines":2,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/layout.rs#L1444-L1445"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`apply_layer_overlaps` subtracts `spacing` and adds `margin` **inside** the loop over `self.layer_overlaps.values()`, so the correction is applied once per overlapping layer instead of once in total. With two overlapping layer-shell surfaces on the same side the result is off by `margin - spacing`; with `N` overlaps it is off by `(N-1) * (margin - spacing)`. Worse, the `.max()` compares the *already corrected* accumulator against a *raw* candidate value, so the outcome depends on the iteration order of `self.layer_overlaps`, which is a `HashMap` and therefore non-deterministic between runs. The resulting `logical_layer_start_overlap` / `logical_layer_end_overlap` feed both the spacer sizing (`add_spacer_element_to_start`/`_end`) and the background/input-region geometry in `layout.rs`, so the panel content is visibly mispositioned.","fix":"Accumulate the raw maxima in the loop and apply the `spacing`/`margin` correction once afterwards:\n```rust\nfor rect in self.layer_overlaps.values() {\n    // ... only `self.logical_layer_start_overlap =\n    //          self.logical_layer_start_overlap.max(raw);` here\n}\nlet correction = self.config.margin as i32 - self.config.spacing as i32;\nif self.logical_layer_start_overlap > 0 {\n    self.logical_layer_start_overlap += correction;\n}\nif self.logical_layer_end_overlap > 0 {\n    self.logical_layer_end_overlap += correction;\n}\n```\nAlso consider using a `BTreeMap` for `layer_overlaps` so iteration order is deterministic.","locations":[{"ref":"cosmic-panel-bin/src/space/panel_space.rs:520-546","code":"  520 |         self.logical_layer_start_overlap = 0;\n  521 |         self.logical_layer_end_overlap = 0;\n  522 |         for rect in self.layer_overlaps.values() {\n  523 |             if self.config.is_horizontal() {\n  524 |                 if rect.loc.x + rect.size.w < self.dimensions.w / 2 {\n  525 |                     self.logical_layer_start_overlap =\n  526 |                         self.logical_layer_start_overlap.max(rect.loc.x + rect.size.w)\n  527 |                             - self.config.spacing as i32\n  528 |                             + self.config.margin as i32;\n  529 |                 } else {\n  530 |                     self.logical_layer_end_overlap =\n  531 |                         self.logical_layer_end_overlap.max(self.dimensions.w - rect.loc.x)\n  532 |                             - self.config.spacing as i32\n  533 |                             + self.config.margin as i32;\n  534 |                 }\n  535 |             } else if rect.loc.y + rect.size.h < self.dimensions.h / 2 {\n  536 |                 self.logical_layer_start_overlap =\n  537 |                     self.logical_layer_start_overlap.max(rect.loc.y + rect.size.h)\n  538 |                         - self.config.spacing as i32\n  539 |                         + self.config.margin as i32;\n  540 |             } else {\n  541 |                 self.logical_layer_end_overlap =\n  542 |                     self.logical_layer_end_overlap.max(self.dimensions.h - rect.loc.y)\n  543 |                         - self.config.spacing as i32\n  544 |                         + self.config.margin as i32;\n  545 |             }\n  546 |         }","lines":27,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/panel_space.rs#L520-L546"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`Spacer::is_in_input_region` unconditionally returns `false` (`space/spacer.rs`), and `Space::element_under` only returns an element whose input region contains the query point. Consequently `element_under` can **never** return a `CosmicMappedInternal::Spacer`, which breaks all four spacer helpers:\n\n* `clear_spacer_start` / `clear_spacer_end` filter for `matches!(e.0, Spacer(_))`, so the filter always yields `None` and the spacer element is **never unmapped from the space**. Once a layer overlap appears the spacer stays in the panel layout forever, permanently shifting applets.\n* `add_spacer_element_to_start` / `add_spacer_element_to_end` filter for `!matches!(e.0, Spacer(_))`, which now matches a **real applet window** sitting under the probe point, and then calls `self.space.unmap_elem(&e)` on it. A live applet is silently removed from the space (it is not moved to `unmapped_windows`, so nothing puts it back) - the applet disappears from the panel.\n\nThe comments (\"remove from space\", \"add to space if not already there\") describe an intent the code does not implement.","fix":"Do not use hit-testing to find the spacer. Look it up by identity instead, e.g.\n```rust\nlet existing = self\n    .space\n    .elements()\n    .find(|e| matches!(e, CosmicMappedInternal::Spacer(s) if s.name == \"spacer-start\"))\n    .cloned();\nif let Some(e) = existing {\n    self.space.unmap_elem(&e);\n}\n```\nand drop the `unmap_elem` of a non-spacer element from `add_spacer_element_to_*` entirely - it can only ever destroy a real applet.","locations":[{"ref":"cosmic-panel-bin/src/space/panel_space.rs:581-589","code":"  581 |         // remove from space\n  582 |         if let Some(element) = self\n  583 |             .space\n  584 |             .element_under((0., 0.))\n  585 |             .filter(|e| matches!(e.0, CosmicMappedInternal::Spacer(_)))\n  586 |             .map(|e| e.0.clone())\n  587 |         {\n  588 |             self.space.unmap_elem(&element);\n  589 |         }","lines":9,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/panel_space.rs#L581-L589"},{"ref":"cosmic-panel-bin/src/space/panel_space.rs:604-612","code":"  604 |         // remove from space\n  605 |         if let Some(element) = self\n  606 |             .space\n  607 |             .element_under((self.dimensions.w as f64, self.dimensions.h as f64))\n  608 |             .filter(|e| matches!(e.0, CosmicMappedInternal::Spacer(_)))\n  609 |             .map(|e| e.0.clone())\n  610 |         {\n  611 |             self.space.unmap_elem(&element);\n  612 |         }","lines":9,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/panel_space.rs#L604-L612"},{"ref":"cosmic-panel-bin/src/space/panel_space.rs:644-652","code":"  644 |         // add to space if not already there\n  645 |         if let Some(e) = self\n  646 |             .space\n  647 |             .element_under((0.5, 0.5))\n  648 |             .filter(|e| !matches!(e.0, CosmicMappedInternal::Spacer(_)))\n  649 |             .map(|e| e.0.clone())\n  650 |         {\n  651 |             self.space.unmap_elem(&e);\n  652 |         }","lines":9,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/panel_space.rs#L644-L652"},{"ref":"cosmic-panel-bin/src/space/panel_space.rs:701-708","code":"  701 |         if let Some(e) = self\n  702 |             .space\n  703 |             .element_under((self.dimensions.w as f64, self.dimensions.h as f64))\n  704 |             .filter(|e| !matches!(e.0, CosmicMappedInternal::Spacer(_)))\n  705 |             .map(|e| e.0.clone())\n  706 |         {\n  707 |             self.space.unmap_elem(&e);\n  708 |         }","lines":8,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/panel_space.rs#L701-L708"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"The frame-callback throttle for *non-hovered* applets uses `min` where `max` is required, so the intended 10 Hz cap is never applied. `throttle` at this point is the output's frame duration (e.g. `16ms` for 60 Hz, `6.9ms` for 144 Hz). For a window that is **not** hovered the code computes `throttle.map(|t| t.min(Duration::from_millis(100)))`, which returns `min(16ms, 100ms) == 16ms` - i.e. exactly the same throttle the hovered window gets. The `else` arm is therefore a no-op in the common case and every embedded applet keeps animating at the display refresh rate even when the pointer is nowhere near it. Only the `unwrap_or_else(|| Duration::from_millis(100))` fallback (used when the output mode is unknown) actually slows anything down. Since `send_frame`'s `throttle` argument is the *minimum interval between frame callbacks*, a larger value means fewer callbacks, so `max` is the correct combinator. This wastes CPU/GPU and battery proportionally to the number of applets on the panel.","fix":"Use `max` so non-hovered applets are throttled to at most 10 Hz:\n```rust\n// before\nthrottle.map(|t| t.min(Duration::from_millis(100)))\n// after\nthrottle.map(|t| t.max(Duration::from_millis(100)))\n```","locations":[{"ref":"cosmic-panel-bin/src/space/render.rs:290-299","code":"  290 |                     let throttle =\n  291 |                         if window.wl_surface().is_some_and(|s| hovered_clients.contains(&s.id())) {\n  292 |                             throttle\n  293 |                         } else {\n  294 |                             Some(\n  295 |                                 throttle\n  296 |                                     .map(|t| t.min(Duration::from_millis(100)))\n  297 |                                     .unwrap_or_else(|| Duration::from_millis(100)),\n  298 |                             )\n  299 |                         };","lines":10,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/render.rs#L290-L299"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`SpaceContainer::update_space` computes `output_count` and then early-returns \"config unchanged, skipping\" when\n`self.space_list.iter_mut().any(|s| { ...; output_count <= 0 })`. The predicate returns `output_count <= 0`\n*unconditionally*, i.e. even when the space did not match the entry. When `output_count` starts at `0` the first\nelement of `space_list` immediately makes `any` return `true` and the update is dropped. `output_count` is `0`\nwhenever the entry is a *new* panel (`CosmicPanelOuput::Name(_)` / `Active`), because it is initialised to\n`self.space_list.iter().filter(|s| s.config.name == entry.name).count()`, which is `0` for a name that has no space\nyet. So adding a new panel profile for a specific output while any other panel already exists is silently ignored\n(`update_space` is the code path used by `ConfigUpdate::EntryList`/`EntryChanged` in `config_watching.rs`).","fix":"Only treat the config as unchanged when at least one space actually matched, e.g. count the matches and compare\nafterwards instead of short-circuiting inside `any`:\n\n```rust\nlet matching = self.space_list.iter().filter(|s| config_matches(s, &entry)).count() as isize;\nif force_output.is_none() && output_count > 0 && matching >= output_count {\n    info!(\"config unchanged, skipping\");\n    return;\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/space_container/space_container.rs:263-289","code":"  263 |         let mut output_count = if matches!(entry.output, CosmicPanelOuput::All) {\n  264 |             self.outputs.len()\n  265 |         } else {\n  266 |             self.space_list.iter().filter(|s| s.config.name == entry.name).count()\n  267 |         } as isize;\n  268 | \n  269 |         if force_output.is_none()\n  270 |             && self.space_list.iter_mut().any(|s| {\n  271 |                 let ret = if matches!(entry.output, CosmicPanelOuput::All) {\n  272 |                     entry.output = s.config.output.clone();\n  273 |                     let ret = s.config == entry;\n  274 |                     entry.output = CosmicPanelOuput::All;\n  275 |                     ret\n  276 |                 } else {\n  277 |                     s.config == entry\n  278 |                 };\n  279 |                 if ret {\n  280 |                     output_count -= 1;\n  281 |                 }\n  282 |                 output_count <= 0\n  283 |             })\n  284 |         {\n  285 |             info!(\"config unchanged, skipping\");\n  286 |             return;\n  287 |         } else {\n  288 |             info!(\"config changed, updating\");\n  289 |         }","lines":27,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space_container/space_container.rs#L263-L289"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`SpaceContainer::new_output` handles the case where a `PanelSpace` for the same config/output already exists by\n*removing* it from `space_list` (`self.space_list.remove(s)`) and then calling `s.new_output(...)` on it again.\nBut `PanelSpace::new_output` starts with\n\n```rust\nif self.output.is_some() {\n    bail!(\"output already setup for this panel\");\n}\n```\n\nso for an already-configured space the call *always* returns `Err`, the `if s.new_output(..).is_ok() { Some(s) } else { None }`\narm yields `None`, and the space is dropped instead of being put back into `space_list`. `PanelSpace`'s `Drop` impl\nsends `AppletMsg::Cleanup` and clears all `PanelClient`s, so the panel and all of its applets are destroyed and never\nrecreated. This path is reachable: `OutputHandler::update_output` calls `WrapperSpace::new_output` again whenever\n`SpaceContainer::update_output` returns `Ok(false)`, and the `CosmicPanelOuput::Name` arm matches purely on\n`config.name`/`config.output` (it does not even compare the `WlOutput`), so any output update that does not find a\nmatching live space silently deletes the existing panel.","fix":"Do not remove the existing space until you know it can be re-initialised. Either keep it in place and return early\n(the space is already set up for that output), or reset it (`s.output = None`, drop the old `layer`) before calling\n`s.new_output(...)`. At minimum, push the space back into `self.space_list` when `new_output` fails instead of\nreturning `None`:\n\n```rust\nmatch s.new_output(/* ... */) {\n    Ok(()) => Some(s),\n    Err(err) => {\n        tracing::warn!(?err, \"reusing existing space for output\");\n        self.space_list.push(s); // do not drop a live panel\n        None\n    },\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/space_container/wrapper_space.rs:176-181","code":"  176 |                         let mut s = if let Some(s) = self.space_list.iter_mut().position(|s| {\n  177 |                             s.config.name == config.name\n  178 |                                 && Some(&c_output) == s.output.as_ref().map(|o| &o.0)\n  179 |                         }) {\n  180 |                             self.space_list.remove(s)\n  181 |                         } else {","lines":6,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space_container/wrapper_space.rs#L176-L181"},{"ref":"cosmic-panel-bin/src/space_container/wrapper_space.rs:219-235","code":"  219 |                         if s.new_output(\n  220 |                             compositor_state,\n  221 |                             fractional_scale_manager,\n  222 |                             viewport,\n  223 |                             layer_state,\n  224 |                             conn,\n  225 |                             qh,\n  226 |                             Some(c_output.clone()),\n  227 |                             Some(s_output.clone()),\n  228 |                             Some(output_info.clone()),\n  229 |                         )\n  230 |                         .is_ok()\n  231 |                         {\n  232 |                             Some(s)\n  233 |                         } else {\n  234 |                             None\n  235 |                         }","lines":17,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space_container/wrapper_space.rs#L219-L235"},{"ref":"cosmic-panel-bin/src/space_container/wrapper_space.rs:238-241","code":"  238 |                         let mut s = if let Some(s) = self.space_list.iter_mut().position(|s| {\n  239 |                             s.config.name == config.name && config.output == s.config.output\n  240 |                         }) {\n  241 |                             self.space_list.remove(s)","lines":4,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space_container/wrapper_space.rs#L238-L241"},{"ref":"cosmic-panel-bin/src/space_container/wrapper_space.rs:274-290","code":"  274 |                         if s.new_output(\n  275 |                             compositor_state,\n  276 |                             fractional_scale_manager,\n  277 |                             viewport,\n  278 |                             layer_state,\n  279 |                             conn,\n  280 |                             qh,\n  281 |                             Some(c_output.clone()),\n  282 |                             Some(s_output.clone()),\n  283 |                             Some(output_info.clone()),\n  284 |                         )\n  285 |                         .is_ok()\n  286 |                         {\n  287 |                             Some(s)\n  288 |                         } else {\n  289 |                             None\n  290 |                         }","lines":17,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space_container/wrapper_space.rs#L274-L290"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"Every DnD branch in `DataSourceHandler` is guarded by `seat.server.dnd_source`, which is **never assigned** - the only write is the commented-out `// seat.server.dnd_source = source;` in `server/handlers/mod.rs:324`, and the field is otherwise only set to `None`. Consequences for a drag started *by* a panel applet:\n* `send_request` (lines 43-46) drops the `WritePipe` without writing anything, so the drop target receives an empty transfer - outgoing drag-and-drop silently transfers no data.\n* `accept_mime`, `dnd_dropped` and `action` are no-ops, so the applet never learns the target's mime type or the chosen action.\n* `dnd_finished` never runs its body, so `seat.client.dnd_source`, `seat.client.dnd_icon` and, crucially, `seat.client.next_dnd_offer_is_mine` are never reset after a successful drop (`DndGrabHandler::dropped` clears the first two but not the flag). With `next_dnd_offer_is_mine` stuck at `true`, the check in `data_device.rs:134` makes the *next* incoming drag skip `pointer.set_grab(..)` entirely - dragging anything into the panel stops working after the first outgoing drag.","fix":"Store the server-side source when the drag starts (restore `seat.server.dnd_source` in `WaylandDndGrabHandler::dnd_requested`, adapting it to smithay's generic `Source`), and make the cleanup in `dnd_finished` unconditional:\n```rust\nseat.server.dnd_icon = None;\nseat.client.dnd_icon = None;\nseat.client.dnd_source = None;\nseat.client.next_dnd_offer_is_mine = false;\nif let Some(dnd_source) = seat.server.dnd_source.take() {\n    dnd_source.dnd_finished();\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/data_device/data_source.rs:41-49","code":"   41 |         // TODO write from server source to fd\n   42 |         // could be a selection source or a dnd source\n   43 |         if is_dnd {\n   44 |             if let Some(dnd_source) = seat.server.dnd_source.as_ref() {\n   45 |                 dnd_source.send(mime, fd.as_fd());\n   46 |             }\n   47 |         } else if seat.server.selection_source.as_ref().is_some() {\n   48 |             _ = request_data_device_client_selection(&seat.server.seat, mime, fd.into());\n   49 |         }","lines":9,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/data_device/data_source.rs#L41-L49"},{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/data_device/data_source.rs:121-146","code":"  121 |     fn dnd_finished(\n  122 |         &mut self,\n  123 |         _conn: &sctk::reexports::client::Connection,\n  124 |         _qh: &sctk::reexports::client::QueueHandle<Self>,\n  125 |         source: &WlDataSource,\n  126 |     ) {\n  127 |         let seat = match self.server_state.seats.iter_mut().find(|seat| {\n  128 |             seat.client.dnd_source.iter().any(|dnd_source| dnd_source.inner() == source)\n  129 |         }) {\n  130 |             Some(seat) => seat,\n  131 |             None => return,\n  132 |         };\n  133 | \n  134 |         if let Some(dnd_source) = seat.server.dnd_source.take() {\n  135 |             dnd_source.dnd_finished();\n  136 |             seat.server.dnd_icon = None;\n  137 |             seat.client.dnd_icon = None;\n  138 |             seat.client.dnd_source = None;\n  139 |             seat.client.next_dnd_offer_is_mine = false;\n  140 |             seat.server.seat.get_pointer().unwrap().unset_grab(\n  141 |                 self,\n  142 |                 SERIAL_COUNTER.next_serial(),\n  143 |                 0,\n  144 |             );\n  145 |         }\n  146 |     }","lines":26,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/data_device/data_source.rs#L121-L146"},{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/data_device/data_device.rs:134-157","code":"  134 |         if !seat.client.next_dnd_offer_is_mine {\n  135 |             let focus = server_focus;\n  136 | \n  137 |             let pointer_start_data = GrabStartData {\n  138 |                 focus: focus.map(|f| (f.surface, f.s_pos.to_f64())),\n  139 |                 button: 0x110, // assume left button for now, maybe there is another way..\n  140 |                 location: (x, y).into(),\n  141 |             };\n  142 |             if let Some(pointer) = seat.server.seat.get_pointer() {\n  143 |                 use crate::xdg_shell_wrapper::server::handlers::ServerGrabSource;\n  144 |                 use smithay::input::dnd::DnDGrab;\n  145 |                 use smithay::input::pointer::Focus;\n  146 |                 let source = ServerGrabSource { metadata, dnd_offer: offer };\n  147 |                 let dnd_grab = DnDGrab::new_pointer(\n  148 |                     &self.server_state.display_handle,\n  149 |                     pointer_start_data,\n  150 |                     source,\n  151 |                     seat.server.seat.clone(),\n  152 |                 );\n  153 |                 pointer.set_grab(self, dnd_grab, SERIAL_COUNTER.next_serial(), Focus::Keep);\n  154 |             }\n  155 |         } else {\n  156 |             tracing::info!(\"Internal DND not starting server drag\");\n  157 |         }","lines":24,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/data_device/data_device.rs#L134-L157"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"`blur_hook` compares the pending and current cached blur state and returns `None` (i.e. does nothing) exactly when they *differ*, and returns `Some(pending)` when they are identical. That is backwards: the pre-commit hook must forward the new region when it changed and can skip the work when nothing changed. As written, every real blur-region change is dropped and only no-op commits reach `commit_blur`.","fix":"```rust\n// before\nif *blur_state.current() != pending {\n    return None;\n} else {\n    return Some(pending);\n}\n// after\nif *blur_state.current() == pending { None } else { Some(pending) }\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/ext_background_effect.rs:147-159","code":"  147 | fn blur_hook<D: 'static + BlurHandler>(state: &mut D, _dh: &DisplayHandle, surface: &WlSurface) {\n  148 |     let region = with_states(surface, |states| {\n  149 |         let mut blur_state = states.cached_state.get::<ComputedBlurRegionCachedState>();\n  150 |         let pending = blur_state.pending().clone();\n  151 |         if *blur_state.current() != pending {\n  152 |             return None;\n  153 |         } else {\n  154 |             return Some(pending);\n  155 |         }\n  156 |     });\n  157 |     if let Some(region) = region {\n  158 |         state.commit_blur(region.blur_region, surface);\n  159 |     }","lines":13,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/ext_background_effect.rs#L147-L159"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In `WaylandDndGrabHandler::dnd_requested` the line that records the server-side drag source is commented out\n(`// seat.server.dnd_source = source;`), so `ServerSeat::dnd_source` is *never* set to `Some`. Every consumer of\nthat field therefore silently does nothing: `data_source.rs::send_request` never forwards the requested mime\ndata (`if let Some(dnd_source) = seat.server.dnd_source.as_ref() { dnd_source.send(mime, fd.as_fd()) }`),\n`accept_mime` never calls `target`, and `cancelled`/`dnd_dropped` never notify the originating client. The net\neffect is that dragging content *out of* an embedded applet to an outside client transfers nothing - the drop\ntarget receives an empty stream. This is an unfinished refactor: `dnd_requested` now takes a generic\n`source: S where S: Source` while `ServerSeat::dnd_source` is still typed `Option<WlDataSource>`, so the\nassignment no longer type-checks and was commented out rather than fixed.","fix":"Change `ServerSeat::dnd_source` to hold the boxed generic source (e.g. `Option<Box<dyn Source>>` or an enum over\nthe concrete source types used) and restore the assignment in `dnd_requested`:\n```rust\nseat.server.dnd_source = Some(Box::new(source));\n```\nso that `send_request`, `accept_mime`, `cancelled` and `dnd_dropped` in\n`client/handlers/data_device/data_source.rs` can actually reach the originating client.","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/mod.rs:320-325","code":"  320 |             }\n  321 |             seat.client.dnd_source = Some(dnd_source);\n  322 |         }\n  323 | \n  324 |         // seat.server.dnd_source = source;\n  325 |         seat.server.dnd_icon = icon;","lines":6,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/mod.rs#L320-L325"},{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/state.rs:99-104","code":"   99 | pub(crate) struct ServerSeat {\n  100 |     pub(crate) seat: Seat<GlobalState>,\n  101 |     pub(crate) selection_source: Option<SelectionSource>,\n  102 |     pub(crate) dnd_source: Option<WlDataSource>,\n  103 |     pub(crate) dnd_icon: Option<WlSurface>,\n  104 | }","lines":6,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/server/state.rs#L99-L104"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`IcedElementInternal::update` only ever consumes the *first* item produced by a task's stream: `into_stream(action)` yields a `Stream`, `.into_future()` resolves to `(Option<Item>, Stream)` and the tail stream in `f.1` is dropped by the `.map(|f| match f.0 { .. })` closure. Any `Task` that emits more than one action - which is exactly what `State::update` builds with `Task::batch(messages.into_iter().map(|m| self.program.update(m)))` when several messages are processed in one pass - silently loses every action after the first. In addition, every non-`Action::Output` variant (widget operations such as focus/scroll, clipboard, window actions) is mapped to `None` and dropped without any diagnostic, so `cosmic::task::widget(..)` style tasks are inert.","fix":"Drive the whole stream instead of just its head, e.g. schedule `t.for_each(|action| async { /* forward each action */ })` or repeatedly poll the stream inside the scheduled future, forwarding each `Action::Output(msg)` through the channel. Handle `Action::Widget(op)` by routing it to the already-implemented but currently unused `State::operate`, and `tracing::warn!` on the action variants that are intentionally unsupported.","locations":[{"ref":"cosmic-panel-bin/src/iced/mod.rs:447-458","code":"  447 |         actions\n  448 |             .into_iter()\n  449 |             .filter_map(|action| {\n  450 |                 if let Some(t) = into_stream(action) {\n  451 |                     let _ = self.scheduler.schedule(t.into_future().map(|f| match f.0 {\n  452 |                         Some(Action::Output(msg)) => Some(msg),\n  453 |                         _ => None,\n  454 |                     }));\n  455 |                 }\n  456 |                 None\n  457 |             })\n  458 |             .collect::<Vec<_>>()","lines":12,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/iced/mod.rs#L447-L458"}]},
