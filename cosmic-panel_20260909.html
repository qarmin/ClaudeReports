{"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"medium","difficulty":"hard","description":"`proxied_layer_surfaces` is a `Vec` of ten-element anonymous tuples mixing an `EGLSurface`, a damage tracker, both the server- and client-side layer surfaces, a state enum, an `f64` scale and four optional protocol objects. Every consumer accesses it positionally - `tracked_surface.2`, `tracked_surface.5`, `s.2.wl_surface()`, `|(_, _, _, s, ..)|`, and a ten-binding destructuring pattern in `commit_wlr`/`commit_blur` - across at least eight files. Nothing checks that the position used matches the field intended, which is precisely how the \"skip the matching surface\" bugs and the missing `destroy()` calls survived.","fix":"Replace the tuple with a named `struct ProxiedLayerSurface { egl_surface, damage_tracker, s_layer_surface, c_layer_surface, state, scale, fractional_scale, viewport, corner_radius, blur_surface }` and implement `Drop` on it to destroy the four optional protocol objects.","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/state.rs:181-192","code":"  181 |     pub(crate) proxied_layer_surfaces: Vec<(\n  182 |         EGLSurface,\n  183 |         OutputDamageTracker,\n  184 |         SmithayLayerSurface,\n  185 |         LayerSurface,\n  186 |         SurfaceState,\n  187 |         f64,\n  188 |         Option<WpFractionalScaleV1>,\n  189 |         Option<WpViewport>,\n  190 |         Option<CosmicCornerRadiusLayerV1>, // TODO destroy on drop\n  191 |         Option<ExtBackgroundEffectSurfaceV1>, // TODO destroy on drop\n  192 |     )>,","lines":12,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/state.rs#L181-L192"},{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/cosmic_corner_radius.rs:759-761","code":"  759 |         for (_, _, s_layer_shell_surface, c_layer_shell_surface, _, _, _, _, corner, _) in\n  760 | {"id":"ARCH_2","type":"architecture","type_label":"Architecture","severity":"medium","difficulty":"hard","description":"`CompositorHandler::commit` is a single ~300 line function that dispatches on the surface role via a chain of `role == \"...\".into()` string comparisons and inlines five completely unrelated responsibilities: delayed pointer-motion replay for toplevels, popup commit, creation *and* resize of proxied layer surfaces (including EGL surface construction, viewport, fractional scale and damage tracker setup), DnD icon EGL setup, and subsurface handling. The layer branch alone is 137 lines with three nesting levels and several early `return`s that skip the remaining roles.","fix":"Split into `commit_toplevel`, `commit_popup`, `create_proxied_layer_surface`, `update_proxied_layer_surface`, `commit_dnd_icon` and `commit_subsurface`, and match the role once into an enum instead of repeated string comparisons.","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/compositor.rs:30-331","code":"   30 |     fn commit(&mut self, surface: &WlSurface) {\n   31 |         let dh = self.server_state.display_handle.clone();\n   32 |         let role = get_role(surface);\n   33 |         trace!(\"role: {:?} surface: {:?}\", &role, &surface);\n   34 | \n   35 |         if role == \"xdg_toplevel\".into() {\n   36 |             on_commit_buffer_handler::<GlobalState>(surface);\n   37 |             self.space.dirty_window(&dh, surface);\n   38 |             // check for pending motion events and send them now\n   39 |             if let Some((pending_event, pointer, iter_count)) =\n   40 |                 self.client_state.delayed_surface_motion.remove(surface)\n   41 |             {\n   42 |                 if iter_count == self.iter_count {\n   43 |                     self.client_state\n   44 |                         .delayed_surface_motion\n   45 |                         .insert(surface.clone(), (pending_event, pointer, iter_count));\n   46 | {"id":"ARCH_3","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"hard","description":"`panel_space.rs` is 2269 lines and mixes at least eight unrelated responsibilities on one type: applet process/client bookkeeping (`AppletMsg`, `PanelClient`, `ClientShrinkSize`, `AppletAutoClickAnchor`), theming/animation (`PanelColors`, `AnimateState`, `apply_animation_state`, `set_theme`), autohide state machine (`handle_focus`, `show_delay_done`, `update_workspaces_shown`), layer-overlap/spacer management, EGL/renderer bootstrapping (`configure_panel_layer`), subsurface creation (`dirty_subsurface`), xdg-positioner translation, and blur/corner-radius protocol plumbing. `configure_panel_layer` alone is ~195 lines with two large near-duplicate resize blocks, and `handle_focus` is ~255 lines of nested state machine. This is where several of the bugs above (the duplicated `<= 0`/`== 0` clamps, the duplicated resize blocks, the inconsistent popup teardown) come from.","fix":"Split the file along the existing seams: move `AppletMsg`/`PanelClient`/`ClientShrinkSize`/`AppletAutoClickAnchor` into `space/client.rs`, `PanelColors`/`AnimatableState`/`AnimateState` plus `apply_animation_state`/`set_theme` into `space/theme.rs`, the autohide state machine into `space/visibility.rs`, and the EGL bootstrap + resize handling into `space/egl.rs`. Factor the two resize blocks in `configure_panel_layer` into one `fn resize_layer_egl(&mut self, dim, renderer)`.","locations":[{"ref":"cosmic-panel-bin/src/space/panel_space.rs:1350-1544","code":" 1350 |     pub fn configure_panel_layer(\n 1351 |         &mut self,\n 1352 |         _layer: &LayerSurface,\n 1353 |         configure: LayerSurfaceConfigure,\n 1354 |         renderer: &mut Option<GlesRenderer>,\n 1355 |     ) {\n 1356 |         self.is_dirty = true;\n 1357 |         self.needs_layout = true;\n 1358 |         let (w, h) = configure.new_size;\n 1359 |         match self.space_event.take() {\n 1360 | {"id":"ARCH_4","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"`GlobalState::scale_factor_changed` manipulates `client_state.proxied_layer_surfaces`, a\n`Vec<(EGLSurface, OutputDamageTracker, SmithayLayerSurface, LayerSurface, SurfaceState, f64, Option<WpFractionalScaleV1>, Option<WpViewport>, Option<CosmicCornerRadiusLayerV1>, Option<ExtBackgroundEffectSurfaceV1>)>` -\na ten-element anonymous tuple - entirely through positional indices (`tracked_surface.3`, `.5`, `.2`, `.1`, `.7`,\n`.0`). Nothing prevents a future reordering of the tuple from silently swapping, say, the EGL surface with the\ndamage tracker; the compiler cannot help because several elements share compatible types (`Option<WpFractionalScaleV1>`\nvs `Option<WpViewport>` are distinct, but `.6`/`.7`/`.8`/`.9` are all `Option<...>`). The tuple definition itself\nalready carries two `// TODO destroy on drop` notes, indicating it is under-maintained.","fix":"Replace the tuple with a named struct (`struct ProxiedLayerSurface { egl_surface, damage_tracker, s_surface,\nc_surface, state, scale, fractional_scale, viewport, corner_radius, blur }`) with a `Drop` impl that destroys the\nwayland proxies, and update the field accesses accordingly.","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/shared_state.rs:99-134","code":"   99 |     pub fn scale_factor_changed(&mut self, surface: &WlSurface, scale_factor: f64, legacy: bool) {\n  100 |         if legacy && self.client_state.fractional_scaling_manager.is_some() {\n  101 |             return;\n  102 |         }\n  103 |         for tracked_surface in &mut self.client_state.proxied_layer_surfaces {\n  104 |             if tracked_surface.3.wl_surface() == surface {\n  105 |                 if legacy {\n  106 |                     surface.set_buffer_scale(scale_factor as i32);\n  107 |                 }\n  108 |                 tracked_surface.5 = scale_factor;\n  109 |                 let mut size {"id":"ARCH_5","type":"architecture","type_label":"Architecture","severity":"negligible","difficulty":"hard","description":"`trait WrapperSpace` is a 30-method god-trait that mixes wholly unrelated responsibilities: output management\n(`new_output`, `update_output`, `output_leave`), input routing (`update_pointer`, `touch_under`,\n`keyboard_enter/leave`, `pointer_enter/leave`, `handle_button`), surface lifecycle (`add_window`, `add_popup`,\n`grab_popup`, `reposition_popup`, `close_popup`, `close_layer`), rendering (`renderer`, `frame`, `dirty_window`,\n`dirty_popup`, `scale_factor_changed`, `transform_changed`, `get_scale_factor`), process management\n(`spawn_clients`) and configuration (`config`). The file itself carries the note\n`// TODO break this trait into several traits so that it can be better organized / not all \"space\"\nimplementations really need all of these exact methods`. Every implementor is forced to provide stubs\n(`space/wrapper_space.rs` has several `bail!(\"...should be handled by the container\")` and empty-body methods),\nwhich turns compile-time contracts into runtime failures.","fix":"Split into focused traits, e.g. `WrapperSpaceOutputs`, `WrapperSpaceInput`, `WrapperSpaceSurfaces`,\n`WrapperSpaceRender`, with `WrapperSpace: WrapperSpaceOutputs + WrapperSpaceInput + ...` as an umbrella. Types\nlike `PanelSpace` that genuinely cannot handle output changes then simply do not implement\n`WrapperSpaceOutputs`, replacing the `bail!(\"Output leaving should be handled by the container\")` stubs with a\ncompile-time guarantee.","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/space/space.rs:76-295","code":"   76 | // TODO break this trait into several traits so that it can be better organized\n   77 | // not all \"space\" implementations really need all of these exact methods as\n   78 | // long as they are wrapped by a space that does see cosmic-panel for an example\n   79 | \n   80 | /// Wrapper Space\n   81 | /// manages and renders x {"id":"OTHER_1","type":"other","type_label":"Other","severity":"high","difficulty":"hard","description":"`IcedElementInternal<P>` is force-marked `Send` with a stale, hand-wavy safety comment that refers to `iced_native::program::State` (a type that no longer exists in this codebase - the state type is the local `crate::iced::state::State`). The struct genuinely is **not** `Send`: it holds `handle: LoopHandle<'static, GlobalState>` (calloop's `LoopHandle` is `!Send` because it wraps `Rc` internals), a `Scheduler<...>`, a `std::sync::mpsc::Receiver` and `cosmic::Renderer` (tiny-skia renderer holding `Rc`-based font/glyph caches). `ProgramWrapper<P>` also stores a `LoopHandle`. Because `IcedElement<P>` is `Arc<Mutex<IcedElementInternal<P>>>`, this `unsafe impl` makes `IcedElement` both `Send` and `Sync`, so nothing stops the element - and with it a `LoopHandle` and `Rc` refcounts - from being moved to or shared with another thread, which is an unsynchronized-refcount data race and undefined behaviour. It also silently propagates `Send` onto `CosmicMappedInternal` / `SpaceTarget`.","fix":"Remove the blanket `unsafe impl Send for IcedElementInternal<P>` and keep the element thread-confined (e.g. replace `Arc<Mutex<..>>` with `Rc<RefCell<..>>`, since every use site is already on the event-loop thread). If `Send` really is required by a smithay bound, wrap the `!Send` parts (`LoopHandle`, `cosmic::Renderer`, `Scheduler`) in a thread-checked newtype that panics on cross-thread access, and rewrite the safety comment to state the *actual* invariant being relied on instead of naming a type that no longer exists.","locations":[{"ref":"cosmic-panel-bin/src/iced/mod.rs:76-78","code":"   76 | // SAFETY: We cannot really be sure about `iced_native::program::State` sadly,\n   77 | // but the rest should be fine.\n   78 | unsafe impl<P: Program + Send + 'static> Send for IcedElementInternal<P> {}","lines":3,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/iced/mod.rs#L76-L78"},{"ref":"cosmic-panel-bin/src/iced/mod.rs:198-221","code":"  198 | struct IcedElementInternal<P: Program + Send + 'static> {\n  199 |     // draw buffer\n  200 |     outputs: HashSet<Output>,\n  201 |     buffers: HashMap<OrderedFloat<f64>, (MemoryRenderBuffer, Color)>,\n  202 |     pending_update: Option<Instant>,\n  203 |     request_redraws: bool,\n  204 | \n  205 |     // state\n  206 |     size: Size<i32, Logical>,\n  207 |     cursor_pos: Option<Point<f64, Logical>>,\n  208 |     panel_id: usize,\n  209 |     touch_map: HashMap<Finger, IcedPoint>,\n  210 | \n  211 |     // iced\n  212 |     theme: Theme,\n  213 |     renderer: cosmic::Renderer,\n  214 |     state: State<ProgramWrapper<P>>,\n  215 | \n  216 |     // futures\n  217 |     handle: LoopHandle<'static, GlobalState>,\n  218 |     scheduler: Scheduler<Option<<P as Program>::Message>>,\n  219 |     executor_token: Option<RegistrationToken>,\n  220 |     rx: Receiver<Option<<P as Program>::Message>>,\n  221 | }","lines":24,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/iced/mod.rs#L198-L221"}]},
{"id":"OTHER_2","type":"other","type_label":"Other","severity":"high","difficulty":"medium","description":"TOCTOU / privilege window on the security-context listener. `create_listener` binds an abstract `AF_UNIX` socket, hands it to the compositor and only afterwards connects to it itself. Abstract socket names are **not** secret: every process in the same network namespace can read them from `/proc/net/unix`, so the 50-character random name from `Alphanumeric.sample_string` provides no protection. Between `UnixListener::bind_addr` and the point where the compositor observes hangup on `close_fd`, any local process can `connect(2)` and obtain a Wayland connection stamped with the applet's sandbox engine / app id, i.e. with whatever privileges cosmic-comp grants that security context. The `// XXX make sure no one else can connect to the listener` comment acknowledges the problem but the code does not close the window (and, per the swapped-pipe bug above, the hangup is never signalled correctly).","fix":"Use a `socketpair(2)`-style handoff instead of a publicly reachable listener, or - if the listener is required by the protocol - accept exactly one connection and immediately signal hangup on the correct pipe end before returning, and additionally verify the peer credentials of the accepted connection with `SO_PEERCRED` so a racing process cannot steal the slot.","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/wp_security_context.rs:54-66","code":"   54 |         let s: String = Alphanumeric.sample_string(&mut rand::rng(), 50);\n   55 |         let addr = SocketAddr::from_abstract_name(s)?;\n   56 |         // this also listens on the socket\n   57 |         let listener = UnixListener::bind_addr(&addr)?;\n   58 |         let wp_security_context: WpSecurityContextV1 = self.manager.create_listener(\n   59 |             listener.as_fd(),\n   60 |             close_fd.as_fd(),\n   61 |             qh,\n   62 |             SecurityContext { conn: Arc::new(Mutex::new(None)) },\n   63 |         );\n   64 |         let conn = UnixStream::connect_addr(&addr)?;\n   65 |         // XXX make sure no one else can connect to the listener\n   66 |         drop(close_fd_ours);","lines":13,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/wp_security_context.rs#L54-L66"}]},
{"id":"OTHER_3","type":"other","type_label":"Other","severity":"medium","difficulty":"easy","description":"`IcedElement::deep_clone` deadlocks. It acquires the element's `std::sync::Mutex` into `internal`, and while that guard is still alive it calls `self.force_update()`, which does `self.0.lock().unwrap()` on the *same* non-reentrant mutex. Any call to `deep_clone` on an element whose event/message queue is not empty hangs the compositor thread forever. The method has no callers today, so the bug is latent, but it is guaranteed to fire the moment it is used.","fix":"Do the forced update before taking the guard, or operate on the guard directly:\n```rust\npub fn deep_clone(&self) -> Self {\n    let mut internal = self.0.lock().unwrap();\n    if !internal.state.is_queue_empty() {\n        internal.update(true);\n    }\n    IcedElement(Arc::new(Mutex::new(internal.clone())))\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/iced/mod.rs:404-412","code":"  404 | impl<P: Program + Send + 'static + Clone> IcedElement<P> {\n  405 |     pub fn deep_clone(&self) -> Self {\n  406 |         let internal = self.0.lock().unwrap();\n  407 |         if !internal.state.is_queue_empty() {\n  408 |             self.force_update();\n  409 |         }\n  410 |         IcedElement(Arc::new(Mutex::new(internal.clone())))\n  411 |     }\n  412 | }","lines":9,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/iced/mod.rs#L404-L412"}]},
{"id":"OTHER_4","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"The closing brace of the `.any(|c| { ... })` closure in `must_recreate` is placed at the end of line 353, so line 354\n(`|| c.name != entry.name && old_priority != new_priority && c.anchor == entry.anchor`) *looks* like it belongs to the\nouter `||` chain while it is in fact still part of the closure body (`|c| { ... } || ...` parses as a boolean\nexpression). The code behaves as intended, but the formatting invites a wrong edit - and it survived because the block\nis not rustfmt-formatted.","fix":"Move the brace to after the last term of the closure. Before:\n\n```rust\n                && (old_priority < c.get_priority() && new_priority > c.get_priority() || old_priority > c.get_priority() && new_priority < c.get_priority())}\n            || c.name != entry.name && old_priority != new_priority && c.anchor == entry.anchor\n```\n\nAfter:\n\n```rust\n                && (old_priority < c.get_priority() && new_priority > c.get_priority()\n                    || old_priority > c.get_priority() && new_priority < c.get_priority())\n            || c.name != entry.name && old_priority != new_priority && c.anchor == entry.anchor\n        }\n```","locations":[{"ref":"cosmic-panel-bin/src/space_container/space_container.rs:350-357","code":"  350 |             // Priority change to conflict with adjacent panel\n  351 |             || c.name != entry.name\n  352 |                 && Some(c.anchor) != opposite_anchor\n  353 |                 && (old_priority < c.get_priority() && new_priority > c.get_priority() || old_priority > c.get_priority() && new_priority < c.get_priority())}\n  354 |             || c.name != entry.name && old_priority != new_priority && c.anchor == entry.anchor\n  355 |             // || self.space_list.iter().any(|s| s.has_layer_overlap())\n  356 | \n  357 |         );","lines":8,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689b {"id":"OTHER_5","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`AutoHideBehavior::handle_size` is documented as \"size of the handle in pixels / should be > 0\" but nothing\nenforces it - it is a plain `u32` deserialized from user config. `get_hide_handle()` returns it verbatim and\n`panel_space.rs` uses it as `-(list_thickness as i32) + self.config.get_hide_handle() as i32` and as an offset in\nthe hide/show animation. A configured `handle_size: 0` makes a hidden auto-hide panel completely unreachable (no\nhover strip to bring it back), and a huge value pushes the \"hidden\" panel back on screen. The neighbouring\n`wait_time`/`transition_time`/`unhide_delay` are likewise unbounded and are fed straight into\n`Duration::from_millis`.","fix":"Clamp in the accessors so the documented invariant actually holds:\n```rust\npub fn get_hide_handle(&self) -> u32 {\n    self.autohide_behavior.handle_size.clamp(1, 64)\n}\n```\nand similarly bound `wait_time`/`transition_time`/`unhide_delay` to a sane maximum.","locations":[{"ref":"cosmic-panel-config/src/panel_config.rs:292-310","code":"  292 | #[derive(Debug, Deserialize, Serialize, Clone, PartialEq, Eq)]\n  293 | #[serde(deny_unknown_fields)]\n  294 | pub struct AutoHideBehavior {\n  295 |     /// time in milliseconds without pointer focus before hiding\n  296 |     pub wait_time: u32,\n  297 |     /// time in milliseconds that it should take to transition\n  298 |     pub transition_time: u32,\n  299 |     /// size of the handle in pixels\n  300 |     /// should be > 0\n  301 |     pub handle_size: u32,\n  302 |     /// time in milliseconds before the panel should un-hide\n  303 |     pub unhide_delay: u32,\n  304 | }\n  305 | \n  306 | impl Default for AutoHideBehavior {\n  307 |     fn default() -> Self {\n  308 |         Self { wait_time: 1000, transition_time: 200, handle_size: 4, unhide_delay: 200 }\n  309 |     }\n  310 | }","lines":19,"link":"https://github.com/pop-os/cosmic-pa {"id":"OTHER_6","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`CosmicPanelConfig::opacity` is an unvalidated `f32` read from user config and used directly as the alpha\nchannel: `bg_color_override` returns `Some([c[0], c[1], c[2], self.opacity])`, and `panel_space.rs` feeds it to\n`colors.bg_color(...)` and `s.end.bg_color[3] = self.config.opacity`. A value outside `[0.0, 1.0]` (or `NaN`,\nwhich RON/serde will happily parse from `opacity: NaN`) propagates into GL clear colours and blend factors,\nproducing undefined rendering. Note the neighbouring `padding_overlap` field *does* have a clamping accessor\n(`padding_overlap()` -> `self.padding_overlap.clamp(0., 1.)`), so the omission for `opacity` is inconsistent.","fix":"Add a clamping accessor next to `padding_overlap()` and use it everywhere `opacity` is read:\n```rust\npub fn opacity(&self) -> f32 {\n    if self.opacity.is_finite() { self.opacity.clamp(0.0, 1.0) } else { 1.0 }\n}\n```\nand make the `opacity` field non-`pub` (or `#[serde(deserialize_with = ...)]`-validated) so raw reads are impossible.","locations":[{"ref":"cosmic-panel-config/src/panel_config.rs:453-461","code":"  453 |     /// margin between the panel and the edge of the output\n  454 |     pub margin: u16,\n  455 |     /// opacity of the panel\n  456 |     pub opacity: f32,\n  457 |     /// autohover popup delay duration in milliseconds\n  458 |     /// If None, then it is disabled\n  459 |     pub autohover_delay_ms: Option<u32>,\n  460 |     /// padding overlap ratio\n  461 |     pub padding_overlap: f32,","lines":9,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-config/src/panel_config.rs#L453-L461"},{"ref":"cosmic-panel-config/src/panel_config.rs:536-538","code":"  536 |     pub fn padding_overlap(&self) -> f32 {\n  537 |         self.padding_overlap.clamp(0., 1.)\n  538 |     }","lines":3,"link":"https://github.com/pop-os/cosmic-panel/blob/f6 (function(){

// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};

// URL hash — debounced so rapid filter changes don't thrash history

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));

  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';

}

  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();

  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build a [project] header block from embedded PROJECT_INFO, so the exported
// findings.toml is self-contained (doesn't depend on a sibling project-info.toml
// that a second, separately-triggered download could silently fail to save).
// '' when there is no project info at all.
function buildProjectToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = PROJECT_INFO || {};
  if (!Object.keys(pi).length) return '';
  const lines = ['[project]'];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n\n';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return buildProjectToml() + chunks.join('\n\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystacks per finding (cleared on full re-render).
// Two variants: everything (default), and file/folder paths only - for when a
// search term (e.g. a directory name like 'dlls/abc') also happens to appear
// inside description/fix prose and you only want path matches.
const _hay = new Map();
const _hayLoc = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}
function hayLocOf(f) {
  if (!_hayLoc.has(f.id)) {
    _hayLoc.set(f.id, f.locations.map(l => l.ref).join(' ').toLowerCase());
  }
  return _hayLoc.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (S.searchScope === 'locations') {
      if (!hayLocOf(f).includes(q)) return false;
    } else if (!hayOf(f).includes(q) && !st.includes(q)) {
      return false;
    }
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  _hayLoc.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    // Single download (was two) - a second auto-triggered download is commonly
    // blocked by the browser unless the user explicitly allows it, which silently
    // drops project-info.toml. Embedding [project] in findings.toml itself avoids
    // that failure mode entirely.
    downloadText(buildFindingsToml(), 'findings.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});
document.getElementById('search-scope').addEventListener('click', e => {
  S.searchScope = S.searchScope === 'locations' ? 'all' : 'locations';
  e.currentTarget.classList.toggle('active', S.searchScope === 'locations');
  scheduleRender();
});

loadStatuses();
