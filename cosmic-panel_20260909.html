{"id":"PERF_12","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"Several avoidable per-frame allocations in the hot render path: a `HashSet<ObjectId>` of hovered clients is rebuilt from scratch every frame even though it is usually empty or has one entry; every space element allocates its own intermediate `Vec<PanelRenderElement>` inside `filter_map`, which is then flattened into a second `Vec` by `collect_vec`; and `Space::element_location(w)` is looked up twice for the same element (once for `loc`, once inside the `configured_size` computation) even though the value is identical.","fix":"Keep a reusable `Vec<PanelRenderElement>` (and a reusable `HashSet`) as fields on `PanelSpace`, `clear()` them at the top of `render`, and use `flat_map` writing directly into the shared buffer. Hoist `let loc_logical = self.space.element_location(w).unwrap_or_default();` above the `OverflowButton` branch and reuse it for both `loc` and `configured_size`.","locations":[{"ref":"cosmic-panel-bin/src/space/render.rs:127-131","code":"  127 |             let hovered_clients: HashSet<_> = self\n  128 |                 .s_hovered_surface\n  129 |                 .iter()\n  130 |                 .filter_map(|c| c.surface.wl_surface().map(|s| s.id()))\n  131 |                 .collect();","lines":5,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/render.rs#L127-L131"},{"ref":"cosmic-panel-bin/src/space/render.rs:187-260","code":"  187 |                 let mut elements = self\n  188 |                     .space\n  189 |                     .elements()\n  190 |                     .filter_map(|w| {\n  191 |                         let loc = self\n  192 |                             .space\n  193 |                             .element_location(w)\n  194 |                             .unwrap_or_default()\n  195 |                             .to_f64()\n  196 | r.size.h == 0 {\n  230 |                                         r.size.h = i32::MAX;\n  231 |                                     }\n  232 |                                     r\n  233 |                                 });\n  234 | \n  235 |                             render_elements_from_surface_tree(\n  236 |                                 renderer,\n  237 |                                 t.wl_surface(),\n  238 |                                 loc,\n  239 |                                 self.scale,\n  240 |                                 1.0,\n  241 |                                 smithay::backend::renderer::element::Kind::Unspecified,\n  242 |                             )\n  243 |                             .into_iter()\n  244 |                             .filter_map(|r: WaylandSurfaceRenderElement<GlesRenderer>| {\n  245 |                                 if let Some(configured_size) = configured_size {\n  246 |                                     return CropRenderElement::from_element(\n  247 |                                         r,\n  248 |                                         self.scale,\n  249 |                                         configured_size,\n  250 |                                     )\n  251 |                                     .map(PanelRenderElement::Crop);\n  252 |                                 }\n  253 | \n  254 |                                 Some(PanelRenderElement::Wayland(r))\n  255 |                             })\n  256 |                             .collect::<Vec<_>>()\n  257 |                         })\n  258 |                     })\n  259 |                     .flatten()\n  260 |                     .collect_vec();","lines":74,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/render.rs#L187-L260"}]},
{"id":"PERF_13","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`Hash for Spacer` builds a tuple containing `self.name.clone()`, i.e. it heap-allocates and copies the spacer's name\non every hash. `Spacer` is a `smithay::desktop::Space` element, so it is hashed on every map/unmap/lookup of the\nelement in the space's internal maps.","fix":"Hash the fields directly - `str` implements `Hash` and needs no allocation. Before:\n\n```rust\nfn hash<H: std::hash::Hasher>(&self, state: &mut H) {\n    (self.bbox.loc.x, self.bbox.loc.y, self.bbox.size.w, self.bbox.size.h, self.name.clone())\n        .hash(state);\n}\n```\n\nAfter:\n\n```rust\nfn hash<H: std::hash::Hasher>(&self, state: &mut H) {\n    self.bbox.loc.x.hash(state);\n    self.bbox.loc.y.hash(state);\n    self.bbox.size.w.hash(state);\n    self.bbox.size.h.hash(state);\n    self.name.hash(state);\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/space/spacer.rs:10-15","code":"   10 | impl std::hash::Hash for Spacer {\n   11 |     fn hash<H: std::hash::Hasher>(&self, state: &mut H) {\n   12 |         (self.bbox.loc.x, self.bbox.loc.y, self.bbox.size.w, self.bbox.size.h, self.name.clone())\n   13 |             .hash(state);\n   14 |     }\n   15 | }","lines":6,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/spacer.rs#L10-L15"}]},
{"id":"PERF_14","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`SpaceContainer::apply_toplevel_changes` iterates the four `PanelAnchor` values and, for each of them, re-scans the\nwhole `space_list` filtering on `s.config.anchor == anchor`. Since every space has exactly one anchor, the anchor loop\nonly partitions the same set - the body is equivalent to a single pass over the spaces, but costs 4x the scans (and 4x\nthe `o.1.name()` string comparisons per space). The function is called from every toplevel add/update/close, every\nworkspace update, `configure_layer` and `update_output`, so it is on a hot path.","fix":"Drop the anchor loop and iterate the spaces once:\n\n```rust\nfor (c_output, name) in self.outputs.iter().map(|o| (o.0.clone(), o.1.name())).collect::<Vec<_>>() {\n    for s in self.space_list.iter_mut().filter(|s| s.output.as_ref().is_some_and(|o| o.1.name() == name)) {\n        s.minimized_toplevels.clear();\n        // ... same body ...\n        s.handle_focus();\n    }\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/space_container/toplevel.rs:164-187","code":"  164 |     pub(crate) fn apply_toplevel_changes(&mut self) {\n  165 |         for output in self.outputs.iter().map(|o| (o.0.clone(), o.1.name())).collect::<Vec<_>>() {\n  166 |             for anchor in\n  167 |                 [PanelAnchor::Top, PanelAnchor::Bottom, PanelAnchor::Left, PanelAnchor::Right]\n  168 |             {\n  169 |                 for s in self.space_list.iter_mut().filter(|s| {\n  170 |                     s.output.as_ref().is_some_and(|o| o.1.name() == output.1)\n  171 |                         && s.config.anchor == anchor\n  172 |                 }) {\n  173 |                     s.minimized_toplevels.clear();\n  174 |                     for t in &self.toplevels {\n  175 |                         if !t.output.contains(&output.0) {\n  176 |                             continue;\n  177 |                         }\n  178 | \n  179 |                         if t.state.contains(&zcosmic_toplevel_handle_v1::State::Minimized) {\n  180 |                             s.minimized_toplevels.insert(t.foreign_toplevel.id());\n  181 |                         }\n  182 |                     }\n  183 |                     s.handle_focus();\n  184 |                 }\n  185 |             }\n  186 |         }\n  187 |     }","lines":24,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space_container/toplevel.rs#L164-L187"}]},
{"id":"PERF_15","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`SpaceContainer::visibility` evaluates a loop-invariant condition once per space: the\n`self.shared.c_hovered_surface.borrow().iter().any(...)` term does not depend on `s`, so the shared focus list is\nre-borrowed and re-scanned for every panel. It is also semantically odd - the closure returns `true` for a panel that\nis neither hovered nor animating, purely because some *other* panel is hovered. This runs on every event-loop\niteration that queries visibility.","fix":"Hoist the invariant out of the loop:\n\n```rust\nlet any_focused = self.shared.c_hovered_surface.borrow().iter().any(|f| matches!(f.2, FocusStatus::Focused));\nlet visible = any_focused\n    || self.space_list.iter().any(|s| {\n        !matches!(s.visibility, Visibility::Visible | Visibility::Hidden)\n            || s.animate_state.is_some()\n            || !s.popups.is_empty()\n    });\n```","locations":[{"ref":"cosmic-panel-bin/src/space_container/wrapper_space.rs:724-737","code":"  724 |     fn visibility(&self) -> Visibility {\n  725 |         let visible = self.space_list.iter().any(|s| {\n  726 |             self.shared.c_hovered_surface\n  727 |                 .borrow()\n  728 |                 .iter()\n  729 |                 .any(|f| matches!(f.2, FocusStatus::Focused))\n  730 |                 // transitions should try to be smooth\n  731 |                 || !matches!(s.visibility, Visibility::Visible | Visibility::Hidden)\n  732 |                 || s.animate_state.is_some()\n  733 |                 || !s.popups.is_empty()\n  734 |         });\n  735 | \n  736 |         if visible { Visibility::Visible } else { Visibility::Hidden }\n  737 |     }","lines":14,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space_container/wrapper_space.rs#L724-L737"}]},
{"id":"PERF_16","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`OverlapNotificationV1::event` rebuilds a `HashMap<String, (priority, bool)>` - cloning every panel's config name - on *every* overlap event, including `ToplevelEnter`/`ToplevelLeave`/`LayerLeave`, which never look at the map. Overlap events fire continuously while a window is dragged over a panel, so this allocates and frees a map plus N `String`s per event on the Wayland dispatch path.","fix":"Build the map only inside the `LayerEnter` arm, or avoid the allocation entirely by looking the namespace up directly: `state.space.space_list.iter().find(|s| s.config.name == *namespace).map(|s| (s.config.get_priority(), s.config.is_horizontal()))`.","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/overlap.rs:66-72","code":"   66 |         // build map of namespace to priority\n   67 |         let namespace_map = state\n   68 |             .space\n   69 |             .space_list\n   70 |             .iter()\n   71 |             .map(|s| (s.config.name.clone(), (s.config.get_priority(), s.config.is_horizontal())))\n   72 |             .collect::<HashMap<_, _>>();","lines":7,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/overlap.rs#L66-L72"}]},
{"id":"PERF_17","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`write_and_attach_buffer` wraps the destination shm slice in a `BufWriter`: `let mut writer = BufWriter::new(to);`.\n`to` is a `&mut [u8]` already in memory, so the `BufWriter` adds an 8 KiB heap allocation plus an extra memcpy on\nevery cursor update, for no benefit whatsoever (there is no syscall to amortise).","fix":"Before:\n```rust\nlet mut writer = BufWriter::new(to);\n...\nwriter.write_all(&from[offset..(offset + height * stride)])?;\nwriter.flush()?;\n```\nAfter:\n```rust\nlet src = &from[offset..(offset + height * stride)];\nto.get_mut(..src.len()).context(\"destination shm slice too small\")?.copy_from_slice(src);\n```\n(and drop the now-unused `BufWriter`/`Write` imports).","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/util.rs:71-78","code":"   71 |                         let mut writer = BufWriter::new(to);\n   72 |                         let from: &[u8] = unsafe { std::slice::from_raw_parts(from, length) };\n   73 |                         let offset: usize = offset.try_into()?;\n   74 |                         let height: usize = height.try_into()?;\n   75 |                         let stride: usize = stride.try_into()?;\n   76 | \n   77 |                         writer.write_all(&from[offset..(offset + height * stride)])?;\n   78 |                         writer.flush()?;","lines":8,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/util.rs#L71-L78"}]},
{"id":"PERF_18","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"`OverflowButton::view` allocates a new `Rc<dyn Fn(..)>` via `theme::Svg::Custom(Rc::new(|theme| ..))` and clones the icon name `Cow` on every call. `view()` is invoked twice per `State::update` whenever a message is produced (`build_user_interface` is called again after `program.update`), and `update(true)` runs on every pointer motion sample over the button, so this is a heap allocation per input event on the panel's input path.","fix":"Hoist the SVG style closure into a `static`/`LazyLock<Rc<..>>` (or store it as a field on `OverflowButton` built once in `OverflowButton::new`) and reuse the `Rc` via `Rc::clone`, instead of constructing a fresh one on every `view()`.","locations":[{"ref":"cosmic-panel-bin/src/iced/elements/overflow_button.rs:165-185","code":"  165 |     fn view(&self) -> crate::iced::Element<'_, Self::Message> {\n  166 |         Element::from(\n  167 |             button::custom(\n  168 |                 layer_container(\n  169 |                     cosmic::widget::icon(cosmic::widget::icon::from_name(self.icon.clone()).into())\n  170 |                         .class(theme::Svg::Custom(Rc::new(|theme| cosmic::widget::svg::Style {\n  171 |                             color: Some(theme.cosmic().background(theme.transparent).on.into()),\n  172 |                         })))\n  173 |                         .width(Length::Fixed(self.icon_size as f32))\n  174 |                         .height(Length::Fixed(self.icon_size as f32)),\n  175 |                 )\n  176 |                 .align_x(cosmic::iced::Alignment::Center)\n  177 |                 .align_y(cosmic::iced::Alignment::Center)\n  178 |                 .width(Length::Fixed(self.icon_size as f32 + self.button_padding.x()))\n  179 |                 .height(Length::Fixed(self.icon_size as f32 + self.button_padding.y())),\n  180 |             )\n  181 |             .selected(self.selected.load(Ordering::Relaxed))\n  182 |             .class(Button::AppletIcon)\n  183 |             .on_press(Message::TogglePopup),\n  184 |         )\n  185 |     }","lines":21,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/iced/elements/overflow_button.rs#L165-L185"}]},
{"id":"PERF_19","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"`IcedElement::set_theme` clones the `cosmic::Theme` it already owns by value before storing it. `cosmic::Theme` is a large struct (full palette, corner radii, spacing, typography), and `set_theme` is called for every overflow button and every overflow popup on each theme/mode change (`panel_space.rs:1582` and `:1594`), so the clone is pure waste. The `mut` on the parameter is only needed for the `theme.transparent` assignment.","fix":"Before:\n```rust\nlet mut guard = self.0.lock().unwrap();\nguard.theme = theme.clone();\n```\nAfter:\n```rust\nlet mut guard = self.0.lock().unwrap();\nguard.theme = theme;\n```","locations":[{"ref":"cosmic-panel-bin/src/iced/mod.rs:391-395","code":"  391 |     pub fn set_theme(&self, mut theme: cosmic::Theme) {\n  392 |         theme.transparent = theme.cosmic().frosted_applets;\n  393 |         let mut guard = self.0.lock().unwrap();\n  394 |         guard.theme = theme.clone();\n  395 |     }","lines":5,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/iced/mod.rs#L391-L395"}]},
{"id":"PERF_20","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"`DataDeviceHandler::motion` clones the `WlPointer` proxy twice: once into `ptr` (used for `space.update_pointer`) and again at the end of the function for `pointer_frame`, re-doing the `seat.client.ptr.as_ref().map(..)` lookup that already produced `ptr`.","fix":"Reuse the existing binding. Before:\n```rust\nif let Some(pointer) = seat.client.ptr.as_ref().map(|p| p.pointer().clone()) {\n    self.pointer_frame(conn, qh, &pointer, &[motion_event]);\n}\n```\nAfter:\n```rust\nself.pointer_frame(conn, qh, &ptr, &[motion_event]);\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/data_device/data_device.rs:232-259","code":"  232 |         let Some(ptr) = seat.client.ptr.as_ref().map(|p| p.pointer().clone()) else {\n  233 |             tracing::error!(\"Missing pointer on seat for dnd motion\");\n  234 |             return;\n  235 |         };\n  236 | \n  237 |         let server_focus = self.space.update_pointer(\n  238 |             (offer.x as i32, offer.y as i32),\n  239 |             &seat.name,\n  240 |             offer.surface.clone(),\n  241 |             &ptr,\n  242 |         );\n  243 | \n  244 |         let client = if let Some(ServerPointerFocus { surface: w, .. }) = server_focus {\n  245 |             w.wl_surface().and_then(|s| s.client())\n  246 |         } else {\n  247 |             None\n  248 |         };\n  249 | \n  250 |         set_data_device_focus(&self.server_state.display_handle, &seat.server.seat, client);\n  251 |         let motion_event = PointerEvent {\n  252 |             surface: offer.surface.clone(),\n  253 |             kind: PointerEventKind::Motion { time: offer.time.unwrap_or_default() },\n  254 |             position: (offer.x, offer.y),\n  255 |         };\n  256 | \n  257 |         if let Some(pointer) = seat.client.ptr.as_ref().map(|p| p.pointer().clone()) {\n  258 | {"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"medium","difficulty":"easy","description":"`MyExecutor` is a complete, never-instantiated dead subsystem: nothing in the crate references it, no `iced` application is created that would use `iced::Executor`, and its only reason for existing - reading the `EVENT_LOOP_HANDLE` thread-local that `main.rs:119-119` populates - means that thread-local is also dead weight. The implementation is broken anyway: `let (tx, _rx) = std::sync::mpsc::channel();` drops the receiver at once, so the `tx.send(message)` inside the calloop callback always fails and every future's output is silently discarded; `executor_token` is stored but never removed, so the calloop source would leak; and `block_on` is `panic!(\"block_on is not supported\")`.","fix":"Delete `MyExecutor`, the `EVENT_LOOP_HANDLE` thread-local and the `EVENT_LOOP_HANDLE.with(..)` call in `main`. If the executor is meant to be wired up later, at least keep the `Receiver` alive, remove `executor_token` in a `Drop` impl and return an error from `block_on` instead of panicking.","locations":[{"ref":"cosmic-panel-bin/src/iced/mod.rs:144-183","code":"  144 | pub struct MyExecutor {\n  145 |     // scheduler: Scheduler<Option<<P as Program>::Message>>,\n  146 |     // executor_token: Option<RegistrationToken>,\n  147 |     // rx: Receiver<Option<<P as Program>::Message>>,\n  148 |     scheduler: Scheduler<()>,\n  149 |     executor_token: Option<RegistrationToken>,\n  150 | }\n  151 | \n  152 | impl iced::Executor for MyExecutor {\n  153 |     fn new() -> Result<Self, futures::io::Error>\n  154 |     where\n  155 |         Self: Sized,\n  156 |     {\n  157 |         let (executor, scheduler) = calloop::futures::executor()\n  158 |             .map_err(|_| futures::io::Error::other(\"Failed to create executor\"))?;\n  159 |         let (tx, _rx) = std::sync::mpsc::channel();\n  160 |         let handle = EVENT_LOOP_HANDLE.with(|l| {\n  161 |             let {"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"medium","difficulty":"easy","description":"`IcedElementInternal::update` is declared as returning `Vec<Task<<P as Program>::Message>>`, but the closure passed to `filter_map` schedules the stream as a side effect and then unconditionally returns `None`, so the function always returns an empty `Vec`. Every one of the ~14 call sites writes `let _ = internal.update(..)`. The return type, the `.collect::<Vec<_>>()` allocation and the `filter_map` are all pure noise, and the signature actively misleads a reader into thinking the caller is responsible for driving the returned tasks.","fix":"Change the signature to `fn update(&mut self, mut force: bool)`, replace the `filter_map(..).collect()` chain with a plain `for action in actions { if let Some(t) = into_stream(action) { ... } }`, and drop the `let _ =` prefixes at the call sites.","locations":[{"ref":"cosmic-panel-bin/src/iced/mod.rs:415-459","code":"  415 |     fn update(&mut self, mut force: bool) -> Vec<Task<<P as Program>::Message>> {\n  416 |         while let Ok(Some(message)) = self.rx.try_recv() {\n  417 |             self.state.queue_message(message);\n  418 |             force = true;\n  419 |         }\n  420 | \n  421 |         if !force {\n  422 |             return Vec::new();\n  423 |         }\n  424 | \n  425 |         let cursor = self\n  426 |             .cursor_pos\n  427 |             .map(|p| IcedPoint::new(p.x as f32, p.y as f32))\n  428 |             .map(Cursor::Available)\n  429 |             .unwrap_or(Cursor::Unavailable);\n  430 |         let actions = self\n  431 |             .state\n  432 |             .update(\n  433 |                 ID.clone(),\n  434 |                 IcedSize::new(self.size.w as f32, self.size.h as f32),\n  435 |                 cursor,\n  436 |                 &mut self.renderer,\n  437 |                 &self.theme,\n  438 |                 &Style {\n  439 |                     scale_factor: {"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"medium","difficulty":"easy","description":"In `PanelSpace::scale_factor_changed`, `self.clear()` is called at line 1782, and `PanelSpace::clear` unconditionally\ndoes `self.overflow_popup = None;` (`space/panel_space.rs:1605`). The block that follows, guarded by\n`if let Some((popup, _)) = self.overflow_popup.as_mut()`, is therefore unreachable: the overflow popup's `scale`,\n`state`, buffer scale and viewport destination are never updated on a scale change. The comment\n`// check overflow popup` describes an intent that the code cannot fulfil, and since the enclosing `if` at line 1686\nis also entered for the overflow popup surface, a scale change on that surface currently only destroys the popup.","fix":"Move the overflow popup update *before* `self.clear()`, or drop the block entirely if destroying the popup on scale\nchange is the intended behaviour (in which case also remove the misleading `// check overflow popup` comment).","locations":[{"ref":"cosmic-panel-bin/src/space/wrapper_space.rs:1784-1808","code":" 1784 |             self.clear();\n 1785 | \n 1786 |             // check overflow popup\n 1787 |             if let Some((popup, _)) = self.overflow_popup.as_mut() {\n 1788 |                 popup.scale = scale;\n 1789 |                 let Rectangle { loc, size } = popup.rectangle;\n 1790 |                 if popup.state.is_none() {\n 1791 |                     popup.state = Some(WrapperPopupState::Rectangle {\n 1792 |                         x: loc.x,\n 1793 |                         y: loc.y,\n 1794 |                         width: size.w,\n 1795 |                         height: size.h,\n 1796 |                     });\n 1797 |                 }\n 1798 | \n 1799 |                 if legacy {\n 1800 |                     popup.c_popup.wl_surface().set_buffer_scale(scale as i32);\n 1801 |                 } else {\n 1802 |                     popup.c_popup.wl_surface().set_buffer_scale(1);\n 1803 | \n 1804 |                     if let Some(viewport) = popup.viewport.as_ref() {\n 1805 |                         viewport.set_destination(size.w.max(1), size.h.max(1));\n 1806 |                     }\n 1807 |                 }\n 1808 |             }","lines":25,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/wrapper_space.rs#L1784-L1808"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"medium","difficulty":"very_easy","description":"`server/handlers/toplevel.rs` and `server/handlers/workspace.rs` are orphaned files: `server/handlers/mod.rs`\ndeclares only `compositor`, `cosmic_corner_radius`, `cursor`, `ext_background_effect`, `fractional`, `layer`,\n`viewporter` and `xdg_shell`, so neither file is part of the module tree. They are also un-compilable: they\n`use cstk::{...}` but `cstk` is not a dependency of any crate in the workspace (it appears nowhere in\n`Cargo.toml`), and they reference `self.server_state.toplevel_info_state`, `self.server_state.workspace_state`\nand `crate::xdg_shell_wrapper::server_state::WrapperWorkspaceClientState`, none of which exist on `ServerState`.\nThey also contain a stub `commit_requests(&mut self, dh: &DisplayHandle, requests: Vec<cstk::workspace::Request>)`\nwith an empty `// TODO` body and non-underscored unused parameters. Keeping them around misleads readers into\nthinking the panel handles toplevel/workspace protocols server-side.","fix":"Delete both files.\n\nBefore (`server/handlers/`): `mod.rs`, `toplevel.rs`, `viewporter.rs`, `workspace.rs`, `xdg_shell.rs`, ...\nAfter (`server/handlers/`): `mod.rs`, `viewporter.rs`, `xdg_shell.rs`, ...\n\nIf the functionality is still wanted, re-add `pub(crate) mod toplevel;` / `pub(crate) mod workspace;` to\n`mod.rs`, add the `cstk` dependency, and add the missing `toplevel_info_state` / `toplevel_management_state` /\n`workspace_state` fields to `ServerState`.","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/toplevel.rs:1-28","code":"    1 | use cstk::{\n    2 |     delegate_toplevel_info, delegate_toplevel_management,\n    3 |     toplevel_info::{ToplevelInfoHandler, ToplevelInfoState},\n    4 |     toplevel_management::ToplevelManagementHandler,\n    5 | };\n    6 | \n    7 | use crate::xdg_shell_wrapper::{shared_state::GlobalState, space::WrapperSpace};\n    8 | \n    9 {"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`overflow_button_element` destructures `button_padding` into its four fields and immediately rebuilds an identical `Padding` from them - a complete no-op that only obscures the code. The `icon_size` handling in the same function is another round trip: `icon_size` (a `u16`) is cast to `f32`, then converted back with `icon_size.round() as u16` before being handed to `OverflowButton::new`, which is the identity function for any `u16`.","fix":"Before:\n```rust\nlet icon_size = icon_size as f32;\nlet Padding { top, right, bottom, left } = button_padding;\nlet button_padding = Padding { top, right, bottom, left };\nlet size = (\n    (icon_size + button_padding.x()).round() as i32,\n    (icon_size + button_padding.y()).round() as i32,\n);\nIcedElement::new(\n    OverflowButton::new(id, pos, icon_size.round() as u16, button_padding, selected, icon, panel_id),\n```\nAfter:\n```rust\nlet icon_size_f = f32::from(icon_size);\nlet size = (\n    (icon_size_f + button_padding.x()).round() as i32,\n    (icon_size_f + button_padding.y()).round() as i32,\n);\nIcedElement::new(\n    OverflowButton::new(id, pos, icon_size, button_padding, selected, icon, panel_id),\n```","locations":[{"ref":"cosmic-panel-bin/src/iced/elements/overflow_button.rs:33-44","code":"   33 |     let icon_size = icon_size as f32;\n   34 |     let Padding { top, right, bottom, left } = button_padding;\n   35 |     let button_padding = Padding { top, right, bottom, left };\n   36 |     let size = (\n   37 |         (icon_size + button_padding.x()).round() as i32,\n   38 |         (icon_size + button_padding.y()).round() as i32,\n   39 |     );\n   40 |     IcedElement::new(\n   41 |         OverflowButton::new(\n   42 |             id,\n   43 |             pos,\n   44 |             icon_size.round() as u16,","lines":12,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e410 {"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"A large part of the `IcedElement` public API has no callers anywhere in the crate: `minimum_size`, `loop_handle`, `resize`, `force_update` (only reachable from the equally unused `deep_clone`), `deep_clone` itself and therefore the whole `Clone for IcedElementInternal` impl, plus `State::mouse_interaction` and `State::operate` in `iced/state.rs`. This is ~120 lines of unexercised code that nevertheless contains real bugs (the `deep_clone` deadlock, and `Clone` sharing the `MemoryRenderBuffer`s - `MemoryRenderBuffer` is internally `Arc`-shared, so a cloned element would rasterize into the very same buffer as the original). Also unused: the entire `iced/panel_message.rs` module (`PanelIcedMessage` is referenced nowhere but its `mod` declaration) and `overflow_button::Message::HidePopup`, which is never constructed.","fix":"Delete the unused items (`minimum_size`, `loop_handle`, `resize`, `deep_clone`, `Clone for IcedElementInternal`, `State::mouse_interaction`, `State::operate`, the `panel_message` module and its `pub mod panel_message;` declaration, and the `Message::HidePopup` variant together with its `update` arm). Anything intended for imminent use should be `#[allow(dead_code)]`-annotated with a comment so the compiler stops hiding the rot.","locations":[{"ref":"cosmic-panel-bin/src/iced/mod.rs:223-264","code":"  223 | impl<P: Program + Send + Clone + 'static> Clone for IcedElementInternal<P> {\n  224 |     fn clone(&self) -> Self {\n  225 |         let handle = self.handle.clone();\n  226 |         let (executor, scheduler) = calloop::futures::executor().expect(\"Out of file descriptors\");\n  227 |         let (tx, rx) = std::sync::mpsc::channel();\n  228 |         let executor_token = handle\n  229 |             .insert_source(executor, move |message, _, _| {\n  230 |                 let _ = tx.send(message);\n  231 |             })\n  232 | {"id":"DEAD_7","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"The `id: id::Id` threaded through `State::new`, `State::update`, `State::operate` and into `build_user_interface` is completely ignored - `build_user_interface` binds it as `_id` and never uses it. `IcedElementInternal::update` pays for a needless `ID.clone()` on every single update because of it, and `State::update` clones it a second time (`id.clone()` at line 94) to satisfy the two `build_user_interface` calls. Worse, `ID` is a single process-wide `LazyLock<Id>` shared by *every* `IcedElement`, so if the parameter were ever honoured all panel elements would collide on the same widget id.","fix":"Either remove the `id` parameter from `State::new`/`State::update`/`State::operate` and `build_user_interface` entirely (and delete the `ID` static plus the `ID.clone()` calls), or actually pass it to `UserInterface::build` and give each `IcedElement` its own `Id` derived from `panel_id`.","locations":[{"ref":"cosmic-panel-bin/src/iced/state.rs:194-204","code":"  194 | fn build_user_interface<'a, P: Program>(\n  195 |     _id: id::Id,\n  196 |     program: &'a mut P,\n  197 |     cache: user_interface::Cache,\n  198 |     renderer: &mut cosmic::Renderer,\n  199 |     size: Size,\n  200 | ) -> UserInterface<'a, P::Message, cosmic::Theme, cosmic::Renderer> {\n  201 |     let view = program.view();\n  202 | \n  203 |     UserInterface::build(view, size, cache, renderer)\n  204 | }","lines":11,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/iced/state.rs#L194-L204"},{"ref":"cosmic-panel-bin/src/iced/state.rs:93-99","code":"   93 |         let mut user_interface = build_user_interface(\n   94 |             id.clone(),\n   95 |             &mut self.program,\n   96 |             self.cache.take().unwrap(),\n   97 |             renderer,\n   98 |             bounds,\n   99 |         );","lines":7,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/iced/state.rs#L93-L99"},{"ref":"cosmic-panel-bin/src/iced/mod.rs:61","code":"   61 | static ID: LazyLock<Id> = LazyLock::new(|| Id::new(\"Program\"));","lines":1,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/iced/mod.rs#L61"}]},
{"id":"DEAD_8","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`let usage = \"USAGE: cosmic-panel\";` is never read - `--help`/`-h` just calls `std::process::exit(1)` without printing anything, and so does the catch-all arm for any unrecognised argument. Asking for help prints nothing and exits with a failure status, and passing a typo'd flag gives the user no diagnostic at all.","fix":"Before:\n```rust\nlet usage = \"USAGE: cosmic-panel\";\nlet config = match arg.as_ref().map(|s| &s[..]) {\n    Some(arg) if arg == \"--help\" || arg == \"-h\" => {\n        std::process::exit(1);\n    },\n```\nAfter:\n```rust\nconst USAGE: &str = \"USAGE: cosmic-panel\";\nlet config = match arg.as_deref() {\n    Some(\"--help\" | \"-h\") => {\n        println!(\"{USAGE}\");\n        std::process::exit(0);\n    },\n```\nand print `USAGE` to stderr before `std::process::exit(1)` in the catch-all arm.","locations":[{"ref":"cosmic-panel-bin/src/main.rs:87-106","code":"   87 |     let arg = std::env::args().nth(1);\n   88 |     let usage = \"USAGE: cosmic-panel\";\n   89 |     let config = match arg.as_ref().map(|s| &s[..]) {\n   90 |         Some(arg) if arg == \"--help\" || arg == \"-h\" => {\n   91 |             std::process::exit(1);\n   92 |         },\n   93 |         None => match cosmic_panel_config::CosmicPanelContainerConfig::load() {\n   94 |             Ok(c) => c,\n   95 |             Err((errors, c)) => {\n   96 |                 for e in errors {\n   97 |                     error!(\"Panel Entry Error: {:?}\", e);\n   98 |                 }\n   99 |                 let _ = c.write_entries();\n  100 |                 c\n  101 |             },\n  102 |         },\n  103 |         _ => {\n  104 |             std::process::exit(1);\n  105 |         },\n  106 |     };","lines":20,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/main.rs#L87-L106"}]},
{"id":"DEAD_9","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`self.remap_attempts` is initialised to `0` (`panel_space.rs:467`), decremented with `saturating_sub(1)` at the top of `layout_()`, and read in exactly one place - `relax_overflow_clients()`'s early return `if self.remap_attempts > 0 { return; }`. Nothing in the whole crate ever assigns a non-zero value (verified by grepping `remap_attempts`), so the decrement is a no-op on `0` and the guard is unreachable-true, i.e. the \"don't relax while remapping\" throttle silently does nothing.\n\nEither the assignment was lost in a refactor (a real behavioural regression: relaxing is no longer suppressed while applets are being remapped) or the whole mechanism is vestigial.","fix":"Decide which it is. If the throttle is wanted, set `self.remap_attempts` when applets are moved in/out of overflow (e.g. `self.remap_attempts = 2;` in `move_to_overflow()` / `move_from_overflow()`). If it is not, delete the field, the `saturating_sub` at `layout_()` and the `if self.remap_attempts > 0 { return; }` guard.","locations":[{"ref":"cosmic-panel-bin/src/space/layout.rs:69-71","code":"   69 |     pub(crate) fn layout_(&mut self) -> anyhow::Result<()> {\n   70 |         self.needs_layout = false;\n   71 |         self.remap_attempts = self.remap_attempts.saturating_sub(1);","lines":3,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/layout.rs#L69-L71"},{"ref":"cosmic-panel-bin/src/space/layout.rs:1729-1732","code":" 1729 |     fn relax_overflow_clients(&self, clients: &mut OverflowClientPartition, mut extra_space: u32) {\n 1730 |         if self.remap_attempts > 0 {\n 1731 |             return;\n 1732 |         }","lines":4,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/layout.rs#L1729-L1732"}]},
{"id":"DEAD_10","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`bg_color` is fetched from `self.bg_color()` and each of its RGB channels is premultiplied by the alpha channel, but the resulting local is never read again anywhere in `layout()` - the background element is built later from a fresh, *non*-premultiplied `self.bg_color()` call at line 915. The premultiplication loop is pure dead computation, and its presence is misleading (a reader will assume the panel background is premultiplied somewhere).","fix":"Delete the dead code:\n\nBefore:\n```rust\nlet mut bg_color = self.bg_color();\nfor c in 0..3 {\n    bg_color[c] *= bg_color[3];\n}\n```\nAfter: (removed)","locations":[{"ref":"cosmic-panel-bin/src/space/layout.rs:238-241","code":"  238 |         let mut bg_color = self.bg_color();\n  239 |         for c in 0..3 {\n  240 |             bg_color[c] *= bg_color[3];\n  241 |         }","lines":4,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/layout.rs#L238-L241"}]},
{"id":"DEAD_11","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`reorder_overflow_space()` computes two values into deliberately underscore-prefixed locals that are never used: `_applet_size_unit` (which calls `get_applet_icon_size_with_padding`) and `_padding`. The real values used later are recomputed at lines 1097-1105. This is leftover from a refactor and just adds noise on a per-layout code path.","fix":"Before:\n```rust\nlet _applet_size_unit = self.config.size.get_applet_icon_size_with_padding(true);\nlet _padding = self.config.padding as i32;\nlet spacing = self.config.spacing as i32;\n```\nAfter:\n```rust\nlet spacing = self.config.spacing as i32;\n```","locations":[{"ref":"cosmic-panel-bin/src/space/layout.rs:1054-1055","code":" 1054 |         let _applet_size_unit = self.config.size.get_applet_icon_size_with_padding(true);\n 1055 |         let _padding = self.config.padding as i32;","lines":2,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/layout.rs#L1054-L1055"}]},
{"id":"DEAD_12","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"In `PanelSpace::add_popup` the accumulator `area` is computed with `saturating_add`/`saturating_mul` for every input\nregion rectangle but is never read afterwards - the value is dead.","fix":"Remove it. Before:\n\n```rust\nlet mut area: i32 = 0;\nfor r in input_regions.rects {\n    area = area.saturating_add(r.1.size.w.saturating_mul(r.1.size.h));\n    input_region.add(0, 0, r.1.size.w, r.1.size.h);\n}\n```\n\nAfter:\n\n```rust\nfor r in input_regions.rects {\n    input_region.add(r.1.loc.x, r.1.loc.y, r.1.size.w, r.1.size.h);\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/space/wrapper_space.rs:267-271","code":"  267 |             let mut area: i32 = 0;\n  268 |             for r in input_regions.rects {\n  269 |                 area = area.saturating_add(r.1.size.w.saturating_mul(r.1.size.h));\n  270 |                 input_region.add(0, 0, r.1.size.w, r.1.size.h);\n  271 |             }","lines":5,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/wrapper_space.rs#L267-L271"}]},
{"id":"DEAD_13","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"The loop that forwards the panel environment to applets contains\n\n```rust\nfor (key, val) in &env_vars {\n    if !requests_wayland_display && *key == \"WAYLAND_DISPLAY\" {\n        continue;\n    }\n    applet_env.push((key.clone(), val.clone()));\n}\n```\n\nbut `env_vars` is built a few lines above and only ever contains `COSMIC_PANEL_NAME`, `COSMIC_PANEL_OUTPUT`,\n`COSMIC_PANEL_SPACING`, `COSMIC_PANEL_ANCHOR`, `COSMIC_PANEL_BACKGROUND` and `COSMIC_PANEL_PADDING_OVERLAP`. The\n`WAYLAND_DISPLAY` guard can never fire, so the code reads as if unprivileged applets are prevented from seeing the\ncompositor socket while in fact nothing is filtered here.","fix":"Drop the dead condition. Before:\n\n```rust\nfor (key, val) in &env_vars {\n    if !requests_wayland_display && *key == \"WAYLAND_DISPLAY\" {\n        continue;\n    }\n    applet_env.push((key.clone(), val.clone()));\n}\n```\n\nAfter:\n\n```rust\napplet_env.extend(env_vars.iter().cloned());\n```\n\nIf unprivileged applets really must not inherit `WAYLAND_DISPLAY`, filter the *process* environment explicitly\ninstead (`Process::with_env` only adds variables; the parent environment is inherited).","locations":[{"ref":"cosmic-panel-bin/src/space/wrapper_space.rs:446-453","code":"  446 |             let env_vars = vec![\n  447 |                 (\"COSMIC_PANEL_NAME\".to_string(), config_name),\n  448 |                 (\"COSMIC_PANEL_OUTPUT\".to_string(), active_output.clone()),\n  449 |                 (\"COSMIC_PANEL_SPACING\".to_string(), config_spacing),\n  450 |                 (\"COSMIC_PANEL_ANCHOR\".to_string(), config_anchor),\n  451 |                 (\"COSMIC_PANEL_BACKGROUND\".to_string(), config_bg),\n  452 |                 (\"COSMIC_PANEL_PADDING_OVERLAP\".to_string(), config_padding_overlap),\n  453 |             ];","lines":8,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a3 {"id":"DEAD_14","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In `PanelSpace::new_output` the check\n\n```rust\nif matches!(self.config.output, CosmicPanelOuput::Active) && self.layer.is_some() {\n    return Ok(());\n}\n```\n\nis unreachable: it lives inside the `if let (Some(_c_output), Some(s_output), Some(output_info))` branch, and the\n`match &self.config.output` immediately above already does `CosmicPanelOuput::Active => bail!(\"output does not match\nconfig\")`. Any `Active` config leaves the function before reaching this line.","fix":"Delete the dead `if`, or move it above the `match &self.config.output` block if the intent was to make repeated\n`new_output` calls for an `Active` panel idempotent.","locations":[{"ref":"cosmic-panel-bin/src/space/wrapper_space.rs:1513-1526","code":" 1513 |             match &self.config.output {\n 1514 |                 CosmicPanelOuput::Active => {\n 1515 |                     bail!(\"output does not match config\")\n 1516 |                 },\n 1517 |                 CosmicPanelOuput::Name(config_name)\n 1518 |                     if output_info.name != Some(config_name.to_string()) =>\n 1519 |                 {\n 1520 |                     bail!(\"output does not match config\")\n 1521 |                 },\n 1522 |                 _ => {},\n 1523 |             };\n 1524 |             if matches!(self.config.output, CosmicPanelOuput::Active) && self.layer.is_some() {\n 1525 |                 return Ok(());\n 1526 |             }","lines":14,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/wrapper_space.rs#L1513-L1526"}]},
{"id":"DEAD_15","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`let scaled = self.dimensions.to_f64(); self.dimensions = scaled.to_i32_round();` is a no-op round-trip\n(`Size<i32>` -> `Size<f64>` -> `Size<i32>`). Given that it sits in `scale_factor_changed`, the author most likely\nintended to rescale the dimensions by the new scale factor; as written the statement does nothing.","fix":"Delete the two lines, or apply the scale if that was the intent. Before:\n\n```rust\nlet scaled = self.dimensions.to_f64();\nself.dimensions = scaled.to_i32_round();\n```\n\nAfter (delete), or:\n\n```rust\nself.dimensions = self.dimensions.to_f64().to_physical(scale).to_logical(self.scale).to_i32_round();\n```","locations":[{"ref":"cosmic-panel-bin/src/space/wrapper_space.rs:1780-1781","code":" 1780 |             let scaled = self.dimensions.to_f64();\n 1781 |             self.dimensions = scaled.to_i32_round();","lines":2,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/wrapper_space.rs#L1780-L1781"}]},

{"id":"DEAD_17","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"In `SpaceContainer::new_output`, the `CosmicPanelOuput::All` arm calls `s.setup(...)` twice for a freshly created space: once inside the `else` branch that constructs the `PanelSpace` (lines 191-200) and again immediately after the `if let`/`else` (lines 206-215). The second call also runs for a space that was *reused* from `space_list`, re-assigning `overlap_notify`. The `CosmicPanelOuput::Name(..)` arm right below performs the setup only once, so the two near-identical arms disagree. `PanelSpace::setup` currently only stores `overlap_notify`, so this is a redundant operation today, but it is exactly the kind of duplication that turns into double resource creation as soon as `setup` grows a body.","fix":"Delete the second, unconditional `setup` call so the arm matches the `Name` arm. Before:\n```rust\n            s\n        };\n        s.setup(\n            compositor_state,\n            fractional_scale_manager,\n            self.shared.security_context_manager.borrow().clone(),\n            viewport,\n            layer_state,\n            conn,\n            qh,\n            self.overlap_notify.clone(),\n        );\n\n        s.enable_blur_capacity(blur_manager.as_ref());\n```\nAfter:\n```rust\n            s\n        };\n\n        s.enable_blur_capacity(blur_manager.as_ref());\n```","locations":[{"ref":"cosmic-panel-bin/src/space_container/wrapper_space.rs:191-215","code":"  191 |                             s.setup(\n  192 |                                 compositor_state,\n  193 |                                 fractional_scale_manager,\n  194 |                                 self.shared.security_context_manager.borrow().clone(),\n  195 |                                 viewport,\n  196 |                                 layer_state,\n  197 |                                 conn,\n  198 |                                 qh,\n  199 | {"id":"DEAD_18","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`SpaceContainer::keyboard_enter` explicitly throws away the result of the popup space with `if let Some(p_ret) = popup_space.keyboard_enter(..) { drop(p_ret); }` and then searches all *other* spaces for a focus surface. `PanelSpace::keyboard_enter` (`space/wrapper_space.rs:1423`) unconditionally returns `None`, so the `drop(p_ret)` branch is unreachable and the whole `find_map` can only ever produce `None`. The caller `KeyboardHandler::enter` therefore always executes `kbd.set_focus(self, None, ..)`. Whatever the `drop` was meant to express (deliberately not focusing the popup?) is invisible and the code misleads the reader into thinking a focus surface can be returned.","fix":"Either make `PanelSpace::keyboard_enter` return the focused surface and propagate `Some(p_ret)` (as `pointer_enter` does), or delete the popup-space special case and the `drop(p_ret)` and document that panel clients only receive keyboard focus through `handle_button`.","locations":[{"ref":"cosmic-panel-bin/src/space_container/wrapper_space.rs:621-638","code":"  621 |     fn keyboard_enter(\n  622 |         &mut self,\n  623 |         seat_name: &str,\n  624 |         surface: c_wl_surface::WlSurface,\n  625 |     ) -> Option<wl_surface::WlSurface> {\n  626 |         if let Some((popup_space_i, popup_space)) =\n  627 |             self.space_list.iter_mut().enumerate().find(|(_, s)| !s.popups.is_empty())\n  628 |         {\n  629 |             if let Some(p_ret) = popup_space.keyboard_enter(seat_name, surface.clone()) {\n  630 |                 drop(p_ret);\n  631 |             }\n  632 |             self.space_list.iter_mut().enumerate().find_map(|(i, s)| {\n  633 |                 if i != popup_space_i { s.keyboard_enter(seat_name, surface.clone()) } else { None }\n  634 |             })\n  635 |         } else {\n  636 |             self.space_list.iter_mut().find_map(|s| s.keyboard_enter(seat_name, surface.clone()))\n  637 |         }\n  638 |     }","lines":18,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space_container/wrapper_space.rs#L621-L638"}]},
{"id":"DEAD_19","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`SpaceContainer::keyboard_enter` calls `popup_space.keyboard_enter(...)` and then explicitly throws the result away\nwith `drop(p_ret)` before querying all the other spaces - i.e. the space that actually owns the popup can never\nprovide the focused surface. The whole dispatch is moot anyway because `PanelSpace::keyboard_enter` unconditionally\nreturns `None` (`space/wrapper_space.rs:1423-1425`), so this function always returns `None` after doing an O(n) walk\nof the space list.","fix":"Either return the popup space's answer (`if let Some(p_ret) = popup_space.keyboard_enter(..) { return Some(p_ret); }`)\nor, if `PanelSpace::keyboard_enter` is intentionally a no-op, collapse the container implementation to `None` and drop\nthe dead traversal.","locations":[{"ref":"cosmic-panel-bin/src/space_container/wrapper_space.rs:626-638","code":"  626 |         if let Some((popup_space_i, popup_space)) =\n  627 |             self.space_list.iter_mut().enumerate().find(|(_, s)| !s.popups.is_empty())\n  628 |         {\n  629 |             if let Some(p_ret) = popup_space.keyboard_enter(seat_name, surface.clone()) {\n  630 |                 drop(p_ret);\n  631 |             }\n  632 |             self.space_list.iter_mut().enumerate().find_map(|(i, s)| {\n  633 |                 if i != popup_space_i { s.keyboard_enter(seat_name, surface.clone()) } else { None }\n  634 |             })\n  635 |         } else {\n  636 |             self.space_list.iter_mut().find_map(|s| s.keyboard_enter(seat_name, surface.clone()))\n  637 |         }\n  638 |     }","lines":13,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space_container/wrapper_space.rs#L626-L638"},{"ref":"cosmic-panel-bin/src/space/wrapper_space.rs:1425-1427","code":" 1425 |     fn keyboard_enter(&mut self, _: &str, _: c_wl_surface::WlSurface) -> Option<s_WlSurface> {\n 1426 |         None\n 1427 |     }","lines":3,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/wrapper_space.rs#L1425-L1427"}]},
{"id":"DEAD_20","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`_pad_rect` is an unused, underscore-prefixed near-duplicate of `pad_rect` that takes the padding as a `[i32; 4]` instead of a `Padding`. It carries the same `checked_sub`-does-not-detect-negatives bug and will drift further from the real implementation.","fix":"Delete the whole function; `pad_rect` already covers the functionality.\n```rust\n// before\npub fn _pad_rect(\n    mut rect: Rectangle<i32, Logical>,\n    padding: &[i32; 4],\n) -> Option<Rectangle<i32, Logical>> {\n    ...\n}\n// after\n(removed)\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/cosmic_corner_radius.rs:812-823","code":"  812 | pub fn _pad_rect(\n  813 |     mut rect: Rectangle<i32, Logical>,\n  814 |     padding: &[i32; 4],\n  815 | ) -> Option<Rectangle<i32, Logical>> {\n  816 |     rect.size.h = rect.size.h.checked_sub(padding[0])?;\n  817 |     rect.loc.x += padding[3];\n  818 |     rect.size.w = rect.size.w.checked_sub(padding[1])?;\n  819 |     rect.size.h = rect.size.h.checked_sub(padding[2])?;\n  820 |     rect.size.w = rect.size.w.checked_sub(padding[3])?;\n  821 |     rect.loc.y += padding[0];\n  822 |     Some(rect)\n  823 | }","lines":12,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/cosmic_corner_radius.rs#L812-L823"}]},
{"id":"DEAD_21","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`hook_commit` defines a local marker `struct Blur`, computes `let blur_id = std::any::TypeId::of::<Blur>();` and stores it in the `BlurHookId` tuple, but nothing ever reads the `TypeId` back out - only the `HookId` half is (partially) used. The type alias `type BlurHookId = Mutex<Option<(HookId, TypeId)>>` carries the dead field, and the function also has a redundant `'static` bound both inline (`D: BlurHandler + 'static`) and in the `where` clause (`D: 'static`).","fix":"```rust\n// before\ntype BlurHookId = Mutex<Option<(HookId, TypeId)>>;\n// after\ntype BlurHookId = Mutex<Option<HookId>>;\n```\nDelete `struct Blur`, `blur_id`, the `use std::any::TypeId;` import and the duplicated `where D: 'static` bound.","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/ext_background_effect.rs:122-145","code":"  122 | type BlurHookId = Mutex<Option<(HookId, TypeId)>>;\n  123 | \n  124 | fn hook_commit<D: BlurHandler + 'static>(wl_surface: &WlSurface)\n  125 | where\n  126 |     D: 'static,\n  127 | {\n  128 |     struct Blur;\n  129 |     let blur_exists = with_states(wl_surface, |surface_data| {\n  130 |         let hook_id = surface_data.data_map.get_or_insert_threadsafe(|| BlurHookId::new(None));\n  131 |         let guard = hook_id.lock().unwrap();\n  132 |         guard.is_some()\n  133 |     });\n  134 |     if blur_exists {\n  135 |         return;\n  136 |     }\n  137 |     let blur_id = std::any::TypeId::of::<Blur>();\n  138 | \n  139 |     let hook_id = add_pre_commit_hook::<D, _>(wl_surface, blur_hook);\n  140 |     with_states(wl_surface, |surface_data| {\n  141 |         let hook_ids = surface_data.data_map.get_or_insert_threadsafe(|| BlurHookId::new(None));\n  142 |         let mut guard = hook_ids.lock().unwrap();\n  143 |         *guard = Some((hook_id, blur_id));\n  144 |     });\n  145 | }","lines":24,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/ext_background_effect.rs#L122-L145"}]},
{"id":"DEAD_22","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`self.client_state.cursor_surface.get_or_insert_with(|| ...create_surface(...))` can never take the\n`insert_with` path: `cursor_surface` is unconditionally initialised to `Some(...)` during startup in\n`xdg_shell_wrapper/mod.rs:61-79`, before the event loop begins. The closure is dead. It is also subtly wrong if\nit ever did run: the `wp_viewport` and `wp_fractional_scale_v1` in `client_state.cursor_vp` /\n`client_state.cursor_scale` are bound to the *original* surface, so a replacement surface would be unscaled and\nuncropped.","fix":"Before:\n```rust\nlet cursor_surface = self.client_state.cursor_surface.get_or_insert_with(|| {\n    self.client_state.compositor_state.create_surface(&self.client_state.queue_handle)\n});\n```\nAfter:\n```rust\nlet Some(cursor_surface) = self.client_state.cursor_surface.as_ref() else {\n    error!(\"cursor surface is missing!\");\n    return;\n};\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/mod.rs:137-141","code":"  137 |                 let cursor_surface = self.client_state.cursor_surface.get_or_insert_with(|| {\n  138 |                     self.client_state\n  139 |                         .compositor_state\n  140 |                         .create_surface(&self.client_state.queue_handle)\n  141 |                 });","lines":5,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/mod.rs#L137-L141"}]},
{"id":"DEAD_23","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`println!(\"FOO METADATA\");` is a leftover debug print inside `Source::metadata` for `ServerGrabSource`. It writes\nto the panel's stdout (bypassing the `tracing` infrastructure used everywhere else in the file) on every metadata\nquery during a drag, spamming the journal.","fix":"Before:\n```rust\nfn metadata(&self) -> Option<SourceMetadata> {\n    println!(\"FOO METADATA\");\n    Some(self.metadata.clone())\n}\n```\nAfter:\n```rust\nfn metadata(&self) -> Option<SourceMetadata> {\n    Some(self.metadata.clone())\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/mod.rs:371-375","code":"  371 | impl smithay::input::dnd::Source for ServerGrabSource {\n  372 |     fn metadata(&self) -> Option<SourceMetadata> {\n  373 |         println!(\"FOO METADATA\");\n  374 |         Some(self.metadata.clone())\n  375 |     }","lines":5,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/mod.rs#L371-L375"}]},
{"id":"DEAD_24","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`CosmicPanelContainerConfigEntry` is declared `pub` with a `CosmicConfigEntry` derive and `#[version = 1]`, but it\nis referenced nowhere in the entire workspace - `CosmicPanelContainerConfig::load_from_config` reads the\n`\"entries\"` key by hand with `config.get::<Vec<String>>(\"entries\")` instead of using it, and `write_entries`\nwrites it with `config.set(\"entries\", entry_names)`. It is a leftover that duplicates the manual key handling and\nwill silently drift from it.","fix":"Before:\n```rust\n#[derive(Default, Debug, Deserialize, Serialize, Clone, PartialEq, CosmicConfigEntry)]\n#[version = 1]\n#[serde(deny_unknown_fields)]\npub struct CosmicPanelContainerConfigEntry {\n    pub entries: Vec<String>,\n}\n```\nAfter: delete the struct (or actually use it in `load_from_config`/`write_entries` in place of the raw\n`\"entries\"` key access).","locations":[{"ref":"cosmic-panel-config/src/container_config.rs:8-13","code":"    8 | #[derive(Default, Debug, Deserialize, Serialize, Clone, PartialEq, CosmicConfigEntry)]\n    9 | #[version = 1]\n   10 | #[serde(deny_unknown_fields)]\n   11 | pub struct CosmicPanelContainerConfigEntry {\n   12 |     pub entries: Vec<String>,\n   13 | }","lines":6,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-config/src/container_config.rs#L8-L13"}]},
{"id":"DEAD_25","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"`buffers` is typed `HashMap<OrderedFloat<f64>, (MemoryRenderBuffer, Color)>`, but the `Color` half of the tuple is only ever written (`cosmic::iced::Color::TRANSPARENT` in `output_enter` and `refresh`) and never read - every read site destructures it away as `(buffer, _)` or `(buffer, ..)`. It is a leftover from a background-colour-change-detection scheme that no longer exists.","fix":"Change the field to `buffers: HashMap<OrderedFloat<f64>, MemoryRenderBuffer>` and drop the `cosmic::iced::Color::TRANSPARENT` entries from the two insertion sites and the `_`/`..` patterns from the read sites.","locations":[{"ref":"cosmic-panel-bin/src/iced/mod.rs:201","code":"  201 |     buffers: HashMap<OrderedFloat<f64>, (MemoryRenderBuffer, Color)>,","lines":1,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/iced/mod.rs#L201"},{"ref":"cosmic-panel-bin/src/iced/mod.rs:810-822","code":"  810 |             internal.buffers.insert(\n  811 |                 OrderedFloat(scale),\n  812 |                 (\n  813 |                     MemoryRenderBuffer::new(\n  814 |                         Fourcc::Argb8888,\n  815 |                         buffer_size,\n  816 |                         1,\n  817 |                         Transform::Normal,\n  818 |                         None,\n  819 |                     ),\n  820 |                     cosmic::iced::Color::TRANSPARENT,\n  821 |                 ),\n  822 |             );","lines":13,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/iced/mod.rs#L810-L822"},{"ref":"cosmic-panel-bin/src/iced/mod.rs:856-868","code":"  856 |             internal_ref.buffers.insert(\n  857 |                 scale,\n  858 |                 (\n  859 |                     MemoryRenderBuffer::new(\n  860 | {"id":"DEAD_26","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"Three items in this slice are never read:\n\n- `ShrinkablePadding::is_shrinkable()` has no callers anywhere in the crate.\n- `ShrinkableClient::padding_overlap` is written (always `0.0`, at lines 1201 and 1213) but never read.\n- The `Alignment` enum is passed into `map_fn()` and returned as the first tuple element, but every consumer destructures it as `_` (`(_, _, _, _, suggested_length, padding)` and `(_, _, _, thickness, ..)`). The `usize` index `*i` in the same tuple is likewise never read.","fix":"Delete `ShrinkablePadding::is_shrinkable`, delete the `padding_overlap` field from `ShrinkableClient` (and the two `padding_overlap: 0.0` initialisers), and drop the `alignment: Alignment` parameter plus the `Alignment` and `usize` tuple slots from `map_fn`'s return type, so it becomes `-> (i32, i32, i32, i32)`. Remove `pub enum Alignment` from `space/mod.rs` if it has no other users.","locations":[{"ref":"cosmic-panel-bin/src/space/layout.rs:63-65","code":"   63 |     pub fn is_shrinkable(&self) -> bool {\n   64 |         matches!(self, ShrinkablePadding::Start | ShrinkablePadding::End | ShrinkablePadding::Both)\n   65 |     }","lines":3,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/layout.rs#L63-L65"},{"ref":"cosmic-panel-bin/src/space/layout.rs:1845-1851","code":" 1845 | #[derive(Debug, Clone)]\n 1846 | pub struct ShrinkableClient {\n 1847 |     window: Window,\n 1848 |     priority: i32,\n 1849 |     shrink_size: ClientShrinkSize,\n 1850 |     padding_overlap: f32,\n 1851 | }","lines":7,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/layout.rs#L1845-L1851"},{"ref":"cosmic-panel-bin/src/space/mod.rs:16-21","code":"   16 | #[derive(Debug)]\n   17 | pub enum Alignment {\n   18 |     Left,\n   19 |     Cent {"id":"DEAD_28","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`ExtBackgroundEffectManager::blur` and `ExtBackgroundEffectManager::capabilities` have no callers anywhere in the crate - every call site uses `manager.get_background_effect(..)` on the public `manager` field directly, and the cached `capabilities` field is only ever written. `blur` also takes `&mut self` although it needs only `&self`.","fix":"Delete the two unused methods, or route the existing call sites through them:\n```rust\n    pub fn blur(\n        &self,\n        surface: &WlSurface,\n        queue_handle: &QueueHandle<GlobalState>,\n    ) -> ExtBackgroundEffectSurfaceV1 {\n        self.manager.get_background_effect(surface, queue_handle, ())\n    }\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/ext_background_effect.rs:28-39","code":"   28 |     pub fn blur(\n   29 |         &mut self,\n   30 |         surface: &WlSurface,\n   31 |         queue_handle: &QueueHandle<GlobalState>,\n   32 |     ) -> ExtBackgroundEffectSurfaceV1 {\n   33 |         self.manager.get_background_effect(surface, queue_handle, ())\n   34 |     }\n   35 | \n   36 |     pub fn capabilities(&self) -> Capability {\n   37 |         self.capabilities\n   38 |     }\n   39 | }","lines":12,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/ext_background_effect.rs#L28-L39"}]},

{"id":"DEAD_31","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`#[serde(deny_unknown_fields)]` is applied to `enum AutoHide`, which (a) has only unit variants, so there are no\nfields to deny, and (b) derives only `Serialize` - its `Deserialize` is hand-written below, so a\ndeserialization-only serde attribute cannot have any effect. The attribute is inert and misleadingly suggests the\nmanual `Deserialize` impl enforces strictness.","fix":"Before:\n```rust\n#[derive(Debug, Default, Serialize, Clone, Copy, PartialEq, Eq)]\n#[serde(deny_unknown_fields)]\npub enum AutoHide {\n```\nAfter:\n```rust\n#[derive(Debug, Default, Serialize, Clone, Copy, PartialEq, Eq)]\npub enum AutoHide {\n```","locations":[{"ref":"cosmic-panel-config/src/panel_config.rs:312-322","code":"  312 | #[derive(Debug, Default, Serialize, Clone, Copy, PartialEq, Eq)]\n  313 | #[serde(deny_unknown_fields)]\n  314 | pub enum AutoHide {\n  315 |     /// Panel never hides\n  316 |     #[default]\n  317 |     Never,\n  318 |     /// Panel hides on window overlap (intellihide)\n  319 |     OnOverlap,\n  320 |     /// Panel always hides\n  321 |     Always,\n  322 | }","lines":11,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-config/src/panel_config.rs#L312-L322"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"medium","difficulty":"easy","description":"The long comment states that, because clients handle keyboard/pointer removal badly, the wrapper \"just always expose[s] a keyboard and pointer\". That is only true on the `new_seat` path (which, per the previous finding, is not the path taken for seats that already exist at startup). On the `new_capability` path the server-side devices are added *conditionally* (`if info.has_keyboard`, `if info.has_pointer`), and `remove_capability` actively calls `remove_keyboard()` / `remove_pointer()` - exactly the behaviour the comment says must be avoided. The comment therefore documents an invariant the code does not maintain.","fix":"Pick one policy and make the code match the comment: either always call `add_keyboard` / `add_pointer` / `add_touch` when the `SeatPair` is created (in both creation paths) and make `remove_capability` a no-op for the server seat, or delete the comment and document that capabilities are mirrored one-to-one.","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/seat.rs:54-66","code":"   54 |             // A lot of clients bind keyboard and pointer unconditionally once on launch..\n   55 |             // Initial clients might race the compositor on adding periheral and\n   56 |             // end up in a state, where they are not able to receive input.\n   57 |             // Additionally a lot of clients don't handle keyboards/pointer objects being\n   58 |             // removed very well either and we don't want to crash applications, because the\n   59 |             // user is replugging their keyboard or mouse.\n   60 |             //\n   61 |             // So instead of doing the right thing (and initialize these capabilities as\n   62 |             // matching devices appear), we have to surrender to reality and\n   63 |             // just always expose a keyboard and pointer.\n   64 |             new_server_seat.add_keyboard(Default::default(), 200, 20).unwrap();\n   65 |             new_server_seat.add_pointer();\n   66 |             new_server_seat.add_touch();","lines":13,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/seat.rs#L54-L66"},{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/seat.rs:149-181","code":"  149 |         match capability {\n  150 |             sctk::seat::Capability::Keyboard => {\n  151 |                 if info.has_keyboard {\n  152 |                     sp.server.seat.add_keyboard(Default::default(), 200, 20).unwrap();\n  153 |                     if let Ok(kbd) = self.client_state.seat_state.get_keyboard(qh, &seat, None) {\n  154 |                         sp.client.kbd.replace(kbd);\n  155 |                     }\n  156 |                 }\n  157 |             },\n  158 |             sctk::seat::Capability::Pointer => {\n  159 |                 if info.has_pointer {\n  160 |                     sp.server.seat.add_pointer();\n  161 |                     if let Ok(ptr) = self.client_state.seat_state.get_pointer_with_theme(\n  162 |                         qh,\n  163 |                         &seat,\n  164 |                         self.client_state.shm_state.wl_shm(),\n  165 |                         self.client_state.compositor_state.create_surface(qh),\n  166 |                         ThemeSpec::System,\n  167 |                     ) {\n  168 |                         sp.client.ptr.replace(ptr);\n  169 |                     }\n  170 |                 }\n  171 |             },\n  172 |             sctk::seat::Capability::Touch => {\n  173 |                 if info.has_touch {\n  174 |                     sp.server.seat.add_touch();\n  175 |                     if let Ok(touch) = self.client_state.seat_state.get_touch(qh, &seat) {\n  176 |                         sp.client.touch.replace(touch);\n  177 |                     }\n  178 |                 }\n  179 |             },\n  180 |             _ => unimplemented!(),\n  181 |         }","lines":33,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/seat.rs#L149-L181"},{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/seat.rs:198-207","code":"  198 |         match capability {\n  199 |             sctk::seat::Capability::Keyboard => {\n  200 |                 sp.server.seat.remove_keyboard();\n  201 |             },\n  202 |             sctk::seat::Capability::Pointer => {\n  203 |                 sp.server.seat.remove_pointer();\n  204 |             },\n  205 |             sctk::seat::Capability::Touch => {}, // TODO\n  206 |             _ => unimplemented!(),\n  207 |         }","lines":10,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/seat.rs#L198-L207"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"`info!(\"Removing entries: {:?}\", entries)` logs `entries`, i.e. the *new* list of panel entries that should be kept, not the entries that are about to be removed. The set actually being removed (`to_remove`) is only computed on the following line. The log therefore always reports the exact opposite of what happens, which is actively harmful when debugging panel add/remove issues. The earlier `info!(\"Received entries: {:?}\", to_update)` has the mirror-image problem: it is labelled \"Received\" but prints only the filtered subset of new entries.","fix":"Move the log after the computation:\n```rust\nlet to_remove = state\n    .space\n    .config\n    .config_list\n    .iter()\n    .filter(|c| !entries.contains(&c.name))\n    .map(|c| c.name.clone())\n    .collect::<Vec<String>>();\ninfo!(\"Removing entries: {:?}\", to_remove);\n```\nand relabel the earlier one to `info!(\"New entries: {:?}\", to_update);`.","locations":[{"ref":"cosmic-panel-bin/src/config_watching.rs:169-177","code":"  169 |                 info!(\"Removing entries: {:?}\", entries);\n  170 |                 let to_remove = state\n  171 |                     .space\n  172 |                     .config\n  173 |                     .config_list\n  174 |                     .iter()\n  175 |                     .filter(|c| !entries.contains(&c.name))\n  176 |                     .map(|c| c.name.clone())\n  177 |                     .collect::<Vec<String>>();","lines":9,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/config_watching.rs#L169-L177"}]},

{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The comment claims the guard exists to \"keep the published size in lockstep\" with `render()`'s 20 px floor, but the code only skips `egl_surface.resize` and `viewport.set_destination`; `self.dimensions = (dim.w, dim.h).into()` and the `OutputDamageTracker::new(...)` immediately below run unconditionally, so the panel's own notion of its size *does* go below 20 px while the EGL surface and viewport keep the old one. The sentence is also missing punctuation between \"20px\" and \"keep\".","fix":"Either move `self.dimensions` and the damage-tracker rebuild inside the `if dim.w > 20 && dim.h > 20` guard so the comment is true, or reword it to\n```rust\n// The panel deliberately collapses to a degenerate size to force a reconfigure.\n// Don't publish that size to the compositor (a too-small surface triggers a fatal\n// `radius_too_large`); `render()` refuses to draw below 20px anyway.\n```","locations":[{"ref":"cosmic-panel-bin/src/space/panel_space.rs:1476-1494","code":" 1476 |                         // The panel deliberately collapses to a degenerate size to force a\n 1477 |                         // reconfigure but that size must not be *published*\n 1478 |                         // to the compositor because a too-small surface causes fatal\n 1479 |                         // `radius_too_large`. `render()` already refuses to\n 1480 |                         // draw below 20px keep the published size in lockstep with that.\n 1481 |                         if dim.w > 20 && dim.h > 20 {\n 1482 |                             egl_surface.resize(scaled_size.w, scaled_size.h, 0, 0);\n 1483 |                             if let Some(viewport) = self.layer_viewport.as_ref() {\n 1484 |                                 viewport.set_destination(dim.w.max(1), dim.h.max(1));\n 1485 |                             }\n 1486 |                         }\n 1487 |                     }\n 1488 | \n 1489 |                     self.dimensions = (dim.w, dim.h).into();\n 1490 |                     self.damage_tracked_renderer = Some(OutputDamageTracker::new(\n 1491 |                         dim.to_f64().to_physical(self.scale).to_i32_round(),\n 1492 |                         self.scale,\n 1493 |                         smithay::utils::Transform::Flipped180,\n 1494 |                     ));","lines":19,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/panel_space.rs#L1476-L1494"}]},
{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"`ServerPointerFocus` carries `#[allow(missing_debug_implementations)]` immediately above\n`#[derive(Debug, Clone)]`. The allow is contradicted by the very next line - the type *does* implement `Debug` -\nso the attribute is noise that suppresses a lint which could never fire here.","fix":"Before:\n```rust\n#[allow(missing_debug_implementations)]\n#[derive(Debug, Clone)]\n/// Information for tracking the server pointer focus\npub struct ServerPointerFocus {\n```\nAfter:\n```rust\n#[derive(Debug, Clone)]\n/// Information for tracking the server pointer focus\npub struct ServerPointerFocus {\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/state.rs:29-32","code":"   29 | #[allow(missing_debug_implementations)]\n   30 | #[derive(Debug, Clone)]\n   31 | /// Information for tracking the server pointer focus\n   32 | pub struct ServerPointerFocus {","lines":4,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/server/state.rs#L29-L32"}]},

{"id":"DUP_10","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"easy","description":"`get_priority` and `get_stack_priority` are byte-for-byte identical apart from the `+= 1000` vs `+= 100000`\nconstant in the autohide branch. Both also call `self.name.to_lowercase()`, which heap-allocates a new `String`\non every invocation; `configs_for_output` passes `get_priority` to `sort_by_key`, so the allocation happens\nO(n log n) times per output query. Any future rule added to one function will silently diverge from the other.","fix":"Factor the shared body out:\n```rust\nfn priority_with(&self, autohide_weight: u32) -> u32 {\n    let mut priority = if self.expand_to_edges() { 10000 } else { 0 };\n    if !self.autohide_enabled() { priority += autohide_weight; }\n    if self.margin == 0 { priority += 200; }\n    if !self.anchor_gap { priority += 100; }\n    if self.name.as_bytes().windows(5).any(|w| w.eq_ignore_ascii_case(b\"panel\")) { priority += 10; }\n    priority\n}\npub fn get_priority(&self) -> u32 { self.priority_with(1000) }\npub fn get_stack_priority(&self) -> u32 { self.priority_with(100_000) }\n```\nand use `sort_by_cached_key` in `configs_for_output`.","locations":[{"ref":"cosmic-panel-config/src/panel_config.rs:576-612","code":"  576 |     /// get the priority of the panel\n  577 |     /// higher priority panels will be created first and given more space when\n  578 |     /// competing for space\n  579 |     pub fn get_priority(&self) -> u32 {\n  580 |         let mut priority = if self.expand_to_edges() { 10000 } else { 0 };\n  581 |         if !self.autohide_enabled() {\n  582 |             priority += 1000;\n  583 |         }\n  584 |         if self.margin == 0 {\n  585 |             priority += 200;\n  586 |         }\n  587 |         if !self.anchor_gap {\n  588 |             priority += 100;\n  589 |         }\n  590 |         if self.name.to_lowercase().contains(\"panel\") {\n  591 |             priority += 10;\n  5
