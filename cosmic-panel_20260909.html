<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}

#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}

.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}

.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}

.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}

.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}

.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"Every `cosmic_config` watch callback in `watch_cosmic_theme` unwraps the result of `entries_tx_clone.send(..)`. These callbacks run on the `notify` watcher thread. `calloop::channel::SyncSender::send` returns `Err` as soon as the receiving side is gone - which happens during shutdown, or if the calloop source is removed - so a normal teardown turns into a panic on a background thread (six separate `.unwrap()` calls). The same pattern with `.expect(\"Failed to send Config Update\")` is repeated in `watch_config`.","fix":"Replace `.unwrap()` / `.expect(..)` on `send` with logging, e.g. `if let Err(err) = entries_tx_clone.send(ThemeUpdate::Mode(entry.is_dark)) { warn!(\"theme update dropped: {err}\"); }`. The watcher threads must never panic on a closed channel.","locations":[{"ref":"cosmic-panel-bin/src/config_watching.rs:52-95","code":"   52 |     let entries_tx_clone = entries_tx.clone();\n   53 |     let theme_watcher_mode = config_mode_helper\n   54 |         .watch(move |helper, _keys| match ThemeMode::get_entry(helper) {\n   55 |             Ok(entry) => {\n   56 |                 entries_tx_clone.send(ThemeUpdate::Mode(entry.is_dark)).unwrap();\n   57 |             },\n   58 |             Err((err, entry)) => {\n   59 |                 for e in err {\n   60 |                     error!(\"Failed to get theme entry value: {:?}\", e);\n   61 |                 }\n   62 |                 entries_tx_clone.send(ThemeUpdate::Mode(entry.is_dark)).unwrap();\n   63 |             },\n   64 |         })\n   65 |         .map_err(|e| anyhow!(format!(\"{:?}\", e)))?;\n   66 | \n   67 |     let entries_tx_clone = entries_tx.clone();\n   68 |     let theme_watcher_light = config_light_helper\n   69 |         .watch(move |helper, _keys| match Theme::get_entry(helper) {\n   70 |             Ok(entry) => {\n   71 |                 entries_tx_clone.send(ThemeUpdate::Light(entry) link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/config_watching.rs#L236-L238"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"The `ConfigUpdate::Entries` branch runs inside a calloop event callback (i.e. on the main compositor thread) and contains three hard panics on recoverable conditions: `CosmicPanelConfig::cosmic_config(&name_clone).expect(\"Failed to load cosmic config\")`, `helper.watch(..).expect(\"Failed to watch cosmic config\")` and the `send(..).expect(..)` inside the watcher closure. A malformed or transiently unreadable panel config file - something a user can produce by hand-editing `~/.config/cosmic/com.system76.CosmicPanel.<name>/` - therefore kills the whole panel process. Note the code path immediately above already handles the *same* failure gracefully with `error!` logging, so the panics are inconsistent as well.","fix":"Convert the three `.expect(..)` calls to `match`/`if let Err(..)` arms that log with `error!` and `continue` to the next entry, mirroring the handling already used at lines 118-134.","locations":[{"ref":"cosmic-panel-bin/src/config_watching.rs:136-156","code":"  136 |                     let entries_tx_clone = entries_tx_clone.clone();\n  137 |                     let name_clone = entry.name.clone();\n  138 |                     let helper = CosmicPanelConfig::cosmic_config(&name_clone)\n  139 |                         .expect(\"Failed to load cosmic config\");\n  140 |                     let watcher = helper\n  141 |                         .watch(move |helper, _keys| {\n  142 |                             let new = match CosmicPanelConfig::get_entry(helper) {\n  143 |                                 Ok(entry) => entry,\n  144 |                                 Err((err, entry)) => {\n  145 |                                     for error in err {\n  146 |                                         error!(\"Failed to get entry value: {:?}\", error);\n  147 |                                     }\n  148 |                                     entry\n  149 |                                 },\n  150 |                             };\n  151 |                             entries_tx_clone\n  152 |                                 .send(ConfigUpdate::EntryChanged(new))\n  153 |                                 .expect(\"Failed to send Config Update\");\n  154 |                         })\n  155 |                         .expect(\"Failed to watch cosmic config\");\n  156 |                     state.space.watchers.insert(entry.name.clone(), watcher);","lines":21,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/config_watching.rs#L136-L156"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`helper.get::<Vec<String>>(&keys[0])` indexes the `keys` slice without checking that it is non-empty. `cosmic_config`'s watch callback is invoked with the set of changed keys, and a `notify` event that maps to zero changed keys (file rewritten atomically, directory-level event, whole-file removal, etc.) yields an empty slice. The callback runs on the `cosmic_config`/`notify` watcher thread, so the resulting index panic aborts that thread and permanently stops all panel-configuration hot-reloading.","fix":"Iterate over the keys and ignore ones that are not the entries key, e.g.\n```rust\n.watch(move |helper, keys| {\n    for key in keys {\n        match helper.get::<Vec<String>>(key) {\n            Ok(entries) => { let _ = entries_tx_clone.send(ConfigUpdate::Entries(entries)); },\n            Err(err) => error!(\"Failed to get entries: {:?}\", err),\n        }\n    }\n})\n```","locations":[{"ref":"cosmic-panel-bin/src/config_watching.rs:203-213","code":"  203 |     let entries_watcher = cosmic_config_entries\n  204 |         .watch(move |helper, keys| match helper.get::<Vec<String>>(&keys[0]) {\n  205 |             Ok(entries) => {\n  206 |                 entries_tx_clone\n  207 |                     .send(ConfigUpdate::Entries(entries))\n  208 |                     .expect(\"Failed to send entries\");\n  209 |             },\n  210 |             Err(err) => {\n  211 |                 error!(\"Failed to get entries: {:?}\", err);\n  212 |             },\n  213 |         })","lines":11,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/config_watching.rs#L203-L213"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`layout()` unconditionally assumes the first element of `windows_center` is a `CosmicMappedInternal::Spacer` and hard-panics otherwise: `let (_, CosmicMappedInternal::Spacer(s), ..) = windows_center.remove(0) else { panic!(\"No spacer found\"); };`.\n\nThe spacer element is inserted by `PanelSpace::apply_layer_overlaps()` (in `panel_space.rs`), which decides whether a spacer is needed using `is_overlapping_start` computed from the *previous* `self.container_length`. `layout()` recomputes `is_overlapping_start` at lines 610-613 from the *freshly computed* `container_length`. The two values can disagree (the container length changes on every applet add/remove/shrink), so `layout()` can decide `is_overlapping_start == true` on a pass where `apply_layer_overlaps()` had called `clear_spacer_start()` and no spacer exists.\n\nA second reachable path: `apply_layer_overlaps()` inserts the spacer client into `clients_left` when `clients_left` is non-empty, but `windows_left` in `layout()` is built from *mapped surfaces*, not from the client list. If none of the left clients have a mapped/alive toplevel yet (startup, applet crash/restart), `windows_left.is_empty()` is true while the spacer client lives in `clients_left`, so `windows_center[0]` is an ordinary applet.\n\nIn both cases the panel process aborts. Note also that `remove(0)` mutates the vector before the pattern is checked.","fix":"Do not panic on a layout heuristic. Peek before removing and fall through gracefully, e.g.:\n\n```rust\nif windows_left.is_empty() && is_overlapping_start\n    && matches!(windows_center.first(), Some((_, CosmicMappedInternal::Spacer(_), ..)))\n{\n    let (_, CosmicMappedInternal::Spacer(s), ..) = windows_center.remove(0) else {\n        unreachable!(\"checked above\")\n    };\n    // ... existing body ...\n}\n```\n\nAdditionally, make `apply_layer_overlaps()` and `layout()` agree by deriving `is_overlapping_start` /\n`is_overlapping_end` from one shared helper that takes the container length as an argument.","locations":[{"ref":"cosmic-panel-bin/src/space/layout.rs:610-636","code":"  610 |         let is_overlapping_start =\n  611 |             layer_major.saturating_sub(container_length) < 2 * self.logical_layer_start_overlap;\n  612 |         let is_overlapping_end =\n  613 |             layer_major.saturating_sub(container_length) < 2 * self.logical_layer_end_overlap;\n  614 |         // XXX this is a bit of a hack around the fact that we want the spacer to be\n  615 |         // placed before the overflow button\n  616 |         if windows_left.is_empty() && !windows_center.is_empty() && is_overlapping_start {\n  617 |             let (_, CosmicMappedInternal::Spacer(s), ..) = windows_center.remove(0) else {\n  618 |                 panic!(\"No spacer found\");\n  619 |             };\n  620 |             let size = s.bbox().size.to_f64();\n  621 |             let crosswise_pos = if self.config.is_horizontal() {\n  622 |                 margin_offset\n  623 |                     + center_in_bar(new_logical_crosswise_dim.try_into().unwrap(), size.h as u32)\n  624 |             } else {\n  625 |                 margin_offset\n  626 |                     + center_in_bar(new_logical_crosswise_dim.try_into().unwrap(), size.w as u32)\n  627 |             };\n  628 |             let loc = if self.config().is_horizontal() {\n  629 |                 (center_pos.round() as i32, crosswise_pos)\n  630 |             } else {\n  631 |                 (crosswise_pos, center_pos.round() as i32)\n  632 |             };\n  633 |             let major_dim = if self.config.is_horizontal() { size.w } else { size.h };\n  634 |             self.space.map_element(CosmicMappedInternal::Spacer(s), loc, false);\n  635 |             center_pos += major_dim + spacing_u32 as f64;\n  636 |         }","lines":27,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c78 {"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`apply_config` calls `panic!` when the new config's anchor differs from the current one. `apply_config` is reached from `update_config`, which is driven by the cosmic-config watcher (`space_container.rs`), i.e. by ordinary user edits to the panel configuration. A user moving a panel from the top edge to the left edge therefore aborts the whole `cosmic-panel` process, taking every panel and dock on every output down with it. A recoverable error (or an explicit \"recreate the space\" message, which the code comment says is the right answer) is required here.","fix":"Make `apply_config` fallible and have `update_config` route an anchor change through the existing space-recreation path instead of aborting:\n```rust\nif config.anchor() != self.config.anchor() {\n    tracing::warn!(\"Anchor changed; requesting panel re-creation instead of applying in place\");\n    let _ = self.shared.panel_tx.send(PanelCalloopMsg::RestartSpace(config, output));\n    return;\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/space/panel_space.rs:1710-1717","code":" 1710 |         // can't animate anchor changes\n 1711 |         // return early\n 1712 |         if config.anchor() != self.config.anchor() {\n 1713 |             panic!(\n 1714 |                 \"Can't apply anchor changes when orientation changes. Requires re-creation of the \\\n 1715 |                  panel.\"\n 1716 |             );\n 1717 |         }","lines":8,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/panel_space.rs#L1710-L1717"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`pointer_frame_inner` starts with three unconditional `unwrap()`s: the seat lookup by `WlPointer`, `server.seat.get_pointer()` and `server.seat.get_keyboard()`. All three are reachable. `SeatHandler::remove_capability` (`client/handlers/seat.rs:198-207`) calls `remove_pointer()` / `remove_keyboard()` on the *server* seat while leaving `client.ptr` in place, so any pointer event still queued (or delivered before the capability change is processed) makes `get_pointer().unwrap()` or `get_keyboard().unwrap()` abort the panel. A seat that never advertised a keyboard, or a pointer event arriving after `remove_seat`, hits the same code. Unplugging a mouse or keyboard should never crash the panel.","fix":"Replace all three with graceful early returns:\n```rust\nlet Some(seat_index) = self.server_state.seats.iter().position(|SeatPair { client, .. }| {\n    client.ptr.as_ref().is_some_and(|p| p.pointer() == pointer)\n}) else {\n    return;\n};\nlet seat_name = self.server_state.seats[seat_index].name.to_string();\nlet (Some(ptr), Some(kbd)) = (\n    self.server_state.seats[seat_index].server.seat.get_pointer(),\n    self.server_state.seats[seat_index].server.seat.get_keyboard(),\n) else {\n    return;\n};\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/pointer.rs:62-75","code":"   62 |         let start_time = self.start_time;\n   63 |         let time = start_time.elapsed().as_millis();\n   64 | \n   65 |         let seat_index = self\n   66 |             .server_state\n   67 |             .seats\n   68 |             .iter()\n   69 |             .position(|SeatPair { client, .. }| {\n   70 |                 client.ptr.as_ref().map(|p| p.pointer() == pointer).unwrap_or(false)\n   71 |             })\n   72 |             .unwrap();\n   73 |         let seat_name = self.server_state.seats[seat_index].name.to_string();\n   74 |         let ptr = self.server_state.seats[seat_index].server.seat.get_pointer().unwrap();\n   75 |         let kbd = self.server_state.seats[seat_index].server.seat.get_keyboard().unwrap();","lines":14,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/pointer.rs#L62-L75"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`SeatHandler::cursor_image` unwraps the surface's pending buffer: `write_and_attach_buffer(buf.as_ref().unwrap(), ...)`.\n`buf` is `surface_attributes.buffer.as_mut()`, i.e. `Option<&mut BufferAssignment>`, and it is `None` whenever a\nclient committed a cursor surface without ever attaching a buffer - which is legal Wayland and is the usual way to\nshow an \"empty\" cursor. The surrounding `if let Some(hotspot)` guard only checks the hotspot, not the buffer, so any\nembedded applet can crash the whole panel by calling `wl_pointer.set_cursor` with a bufferless surface that has\n`CursorImageAttributes` set.","fix":"Guard on the buffer as well, e.g.\n```rust\nif let (Some(buf), Some(hotspot)) = (buf.as_ref(), data.data_map.get::<Mutex<CursorImageAttributes>>()\n        .and_then(|m| m.lock().ok()).map(|attr| attr.hotspot)) {\n```\nand fall back to `ptr.set_cursor(last_enter, None, 0, 0)` when there is no buffer.","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/mod.rs:145-173","code":"  145 |                 with_states(&surface, |data| {\n  146 |                     let mut guard = data.cached_state.get::<SurfaceAttributes>();\n  147 | \n  148 |                     let surface_attributes = guard.current();\n  149 |                     let buf = surface_attributes.buffer.as_mut();\n  150 |                     if let Some(hotspot) = data\n  151 |                         .data_map\n  152 |                         .get::<Mutex<CursorImageAttributes>>()\n  153 |                         .and_then(|m| m.lock().ok())\n  154 |                         .map(|attr| attr.hotspot)\n  155 |                     {\n  156 |                         trace!(\"Setting cursor {:?}\", hotspot);\n  157 |                         let ptr = ptr.pointer();\n  158 |                         ptr.set_cursor(last_enter, Some(cursor_surface), hotspot.x, hotspot.y);\n  159 | \n  160 |                         for ctr in 0..5 {\n  161 |                             if let Err(e) = write_and_attach_buffer(\n  162 |                                 buf.as_ref().unwrap(),\n  163 |                                 cursor_surface,\n  164 |                                 ctr,\n  165 |                                 multipool,\n  166 |                             ) {\n  167 |                                 info!(\"failed to attach buffer to cursor surface: {}\", e);\n  168 |                             } else {\n  169 |                                 break;\n  170 |                             }\n  171 |                         }\n  172 |                     }\n  173 |                 });","lines":29,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/mod.rs#L145-L173"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`CosmicPanelConfig::get_dimensions` ends with a hard `assert!(2 * self.padding + gap < bar_thickness.end)`.\nBoth `self.padding` (a plain `u32` deserialized straight out of the user's RON config with no validation) and\n`gap` (derived from `self.margin`) are attacker/user controlled, and `bar_thickness.end` is a small constant\n(`61 + gap` for `PanelSize::XS`, `101 + gap` for `PanelSize::M`, ...). A user who writes `padding: 32` into\n`com.system76.CosmicPanel.Panel` with `size: XS` makes `2 * 32 + 0 = 64 >= 61`, so the assertion fires and the\nwhole panel process aborts on startup and on every config reload. `assert!` is **not** compiled out in release\nbuilds. `get_dimensions` is reached from `PanelSpace::constrain_dim`, which runs on every layout pass, so the\ncrash is fully reachable in normal operation. Additionally `2 * self.padding + gap` itself wraps for large\n`padding`, which in release turns the crash into a silently wrong (wrapped) comparison.","fix":"Never `assert!` on user configuration. Clamp instead, e.g. replace the assertion with\n```rust\nlet max_padding = bar_thickness.end.saturating_sub(gap).saturating_sub(1) / 2;\nlet padding = self.padding.min(max_padding);\n```\nand use the clamped `padding` for the rest of the computation, or validate/clamp `padding` once at\ndeserialization time and return a `Result` from `get_dimensions`.","locations":[{"ref":"cosmic-panel-config/src/panel_config.rs:702-728","code":"  702 |     pub fn get_dimensions(\n  703 |         &self,\n  704 |         output_dims: Option<(u32, u32)>,\n  705 |         suggested_length: Option<u32>,\n  706 |         gap: Option<u32>,\n  707 |     ) -> (Option<Range<u32>>, Option<Range<u32>>) {\n  708 |         let gap = gap.unwrap_or_else(|| self.get_effective_anchor_gap());\n  709 |         let bar_thickness = match &self.size {\n  710 |             PanelSize::XS => 8 + gap..61 + gap,\n  711 |             PanelSize::S => 8 + gap..81 + gap,\n  712 |             PanelSize::M => 8 + gap..101 + gap,\n  713 |             PanelSize::L => 8 + gap..121 + gap,\n  714 |             PanelSize::XL => 8 + gap..141 + gap,\n  715 |             PanelSize::Custom(s) => {\n  716 |                 let s = (*s).max(16) / 4 * 4;\n  717 |                 8 + gap..s * 2 + 1 + gap\n  718 |             },\n  719 |         };\n  720 |         assert!(2 * self.padding + gap < bar_thickness.end);\n  721 |         let o_h = suggested_length.unwrap_or_else(|| output_dims.unwrap_or_default().1);\n  722 |         let o_w = suggested_length.unwrap_or_else(|| output_dims.unwrap_or_default().0);\n  723 | \n  724 |         match self.anchor {\n  725 |             PanelAnchor::Left | PanelAnchor::Right => (Some(bar_thickness), Some(o_h..o_h + 1)),\n  726 |             PanelAnchor::Top | PanelAnchor::Bottom => (Some(o_w..o_w + 1), Some(bar_thickness)),\n  727 |         }\n  728 |     }","lines":27,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-config/src/panel_config.rs#L702-L728"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"Both `TryFrom` impls for `SpaceTarget` call `w.toplevel().unwrap()` on a `smithay::desktop::Window`. `Window::toplevel()` returns `Option<&ToplevelSurface>` and yields `None` for any window that is not backed by an xdg-toplevel, and also for a window whose toplevel has already been destroyed by the client. Because these conversions are fallible by design (`Error = anyhow::Error`, and the other arms use `bail!`), the `unwrap()` is both avoidable and inconsistent with the surrounding code: an applet that dies at the wrong moment can take the whole panel down.","fix":"Use the existing error channel instead of `unwrap`:\n```rust\nCosmicMappedInternal::Window(w) => {\n    let toplevel = w.toplevel().ok_or_else(|| anyhow::anyhow!(\"window has no xdg toplevel\"))?;\n    Ok(SpaceTarget::Surface(toplevel.wl_surface().clone()))\n},\n```\nand the same in the `PopupMappedInternal` impl.","locations":[{"ref":"cosmic-panel-bin/src/iced/elements/target.rs:52-54","code":"   52 |             CosmicMappedInternal::Window(w) => {\n   53 |                 Ok(SpaceTarget::Surface(w.toplevel().unwrap().wl_surface().clone()))\n   54 |             },","lines":3,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/iced/elements/target.rs#L52-L54"},{"ref":"cosmic-panel-bin/src/iced/elements/target.rs:68-70","code":"   68 |             PopupMappedInternal::Window(w) => {\n   69 |                 Ok(SpaceTarget::Surface(w.toplevel().unwrap().wl_surface().clone()))\n   70 |             },","lines":3,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/iced/elements/target.rs#L68-L70"}]},
{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"`Drop for IcedElementInternal` does `self.handle.remove(self.executor_token.take().unwrap())`, but `executor_token` is an `Option<RegistrationToken>` that is deliberately built with `.ok()` in both `IcedElement::new` and `Clone for IcedElementInternal`, i.e. it is `None` whenever `LoopHandle::insert_source` failed. In that case the element panics while being dropped. A panic in `Drop` during unwinding aborts the process.","fix":"Before:\n```rust\nfn drop(&mut self) {\n    self.handle.remove(self.executor_token.take().unwrap());\n}\n```\nAfter:\n```rust\nfn drop(&mut self) {\n    if let Some(token) = self.executor_token.take() {\n        self.handle.remove(token);\n    }\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/iced/mod.rs:284-288","code":"  284 | impl<P: Program + Send + 'static> Drop for IcedElementInternal<P> {\n  285 |     fn drop(&mut self) {\n  286 |         self.handle.remove(self.executor_token.take().unwrap());\n  287 |     }\n  288 | }","lines":5,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/iced/mod.rs#L284-L288"}]},
{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`toplevel_info.cosmic_toplevel.as_ref().unwrap()` is called in two places, guarded only by the comment \"If cosmic toplevel manager exists, cosmic toplevel info should too\". `zcosmic_toplevel_manager_v1` and the cosmic toplevel-info protocol are two independent Wayland globals: a compositor may advertise the manager while `cctk`'s `ToplevelInfo::cosmic_toplevel` is still `None` (either because the info global is absent or because the handle has not been created yet for a freshly mapped toplevel). The assumption is an unchecked cross-protocol invariant and violating it crashes the panel.","fix":"Replace the `unwrap()` with a guard, e.g. `let Some(cosmic_toplevel) = toplevel_info.cosmic_toplevel.as_ref() else { continue; };` (or `return` in `update_toplevel`), and drop the comment asserting the invariant.","locations":[{"ref":"cosmic-panel-bin/src/minimize.rs:35-43","code":"   35 |         toplevel_mngr.manager.set_rectangle(\n   36 |             // If cosmic toplevel manager exists, cosmic toplevel info should too\n   37 |             toplevel_info.cosmic_toplevel.as_ref().unwrap(),\n   38 |             &info.surface,\n   39 |             info.rect.loc.x,\n   40 |             info.rect.loc.y,\n   41 |             info.rect.size.w,\n   42 |             info.rect.size.h,\n   43 |         );","lines":9,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/minimize.rs#L35-L43"},{"ref":"cosmic-panel-bin/src/minimize.rs:82-90","code":"   82 |             toplevel_mngr.manager.set_rectangle(\n   83 |                 // If cosmic toplevel manager exists, cosmic toplevel info should too\n   84 |                 toplevel_info.cosmic_toplevel.as_ref().unwrap(),\n   85 |                 &info.surface,\n   86 |                 info.rect.loc.x,\n   87 |                 info.rect.loc.y,\n   88 |                 info.rect.size.w,\n   89 |                 info.rect.size.h,\n   90 |             );","lines":9,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/minimize.rs#L82-L90"}]},
{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"`layout()` hard-panics if either `self.input_region` or `self.layer` is `None`. Both are `Option` fields that are only populated once the layer surface has been created (`wrapper_space.rs:1562-1564`), and `self.input_region` is also replaced wholesale by `PanelSpace::cleanup()`. Every other failure path in this function returns `anyhow::bail!(...)`, which the caller (`panel_space.rs:1301`, `_ = self.layout_();`) handles by retrying later - panicking here kills the whole panel process instead.","fix":"Before:\n```rust\nlet (input_region, layer) = match (self.input_region.as_ref(), self.layer.as_ref()) {\n    (Some(r), Some(layer)) => (r, layer),\n    _ => panic!(\"input region or layer missing\"),\n};\n```\nAfter:\n```rust\nlet (Some(input_region), Some(layer)) = (self.input_region.as_ref(), self.layer.as_ref()) else {\n    self.is_dirty = true;\n    self.needs_layout = true;\n    bail!(\"input region or layer missing\");\n};\n```","locations":[{"ref":"cosmic-panel-bin/src/space/layout.rs:572-576","code":"  572 |         // update input region of panel when list changes\n  573 |         let (input_region, layer) = match (self.input_region.as_ref(), self.layer.as_ref()) {\n  574 |             (Some(r), Some(layer)) => (r, layer),\n  575 |             _ => panic!(\"input region or layer missing\"),\n  576 |         };","lines":5,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/layout.rs#L572-L576"}]},
{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"`shrink_clients()` calls `.unwrap()` on the result of `w.toplevel().map(...)`, which is `None` for any `Window` whose underlying surface is not an xdg toplevel. The very same loop body defensively handles the `None` case 45 lines later (`if let Some(t) = w.toplevel()` at line 1322), so the code is internally inconsistent and a window that loses its toplevel between `shrinkable_clients()` and this loop aborts the whole panel process instead of being skipped.","fix":"Before:\n```rust\nlet suggested_bounds = w\n    .toplevel()\n    .map(|t| {\n        t.with_committed_state(|s| s.as_ref().and_then(|s| s.bounds).unwrap_or_default())\n    })\n    .unwrap();\n```\nAfter:\n```rust\nlet Some(suggested_bounds) = w\n    .toplevel()\n    .map(|t| t.with_committed_state(|s| s.as_ref().and_then(|s| s.bounds).unwrap_or_default()))\nelse {\n    continue;\n};\n```","locations":[{"ref":"cosmic-panel-bin/src/space/layout.rs:1261-1268","code":" 1261 |             let suggested_bounds = w\n 1262 |                 .toplevel()\n 1263 |                 .map(|t| {\n 1264 |                     t.with_committed_state(|s| {\n 1265 |                         s.as_ref().and_then(|s| s.bounds).unwrap_or_default()\n 1266 |                     })\n 1267 |                 })\n 1268 |                 .unwrap();","lines":8,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/layout.rs#L1261-L1268"}]},
{"id":"PANIC_14","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"The first-configure path of `configure_panel_layer` is a chain of hard failures on compositor- and driver-controlled operations: `WlEglSurface::new(...).unwrap()` (with a `// TODO remove unwrap` next to it), `EGLDisplay::new(...).expect(\"Failed to create EGL display\")`, `EGLContext::new_with_config(...).expect(\"Failed to create EGL context\")`, `GlesRenderer::supported_capabilities(...).expect(\"Failed to query EGL Context\")`, `GlesRenderer::with_capabilities(...).expect(\"Failed to create EGL Surface\")` (message describes the wrong object), `pixel_format().expect(\"Failed to get pixel format from EGL context \")` and `EGLSurface::new(...).expect(\"Failed to create EGL Surface\")`. Any of these aborts every panel on the machine. `self.layer.as_ref().unwrap()` appears three times in the same block as well.","fix":"Make `configure_panel_layer` fallible (`-> anyhow::Result<()>`) or, at minimum, convert the block into a `match`/`let ... else` chain that logs and leaves `self.egl_surface` as `None` so the panel is skipped rather than the process aborted. Also fix the two mislabelled messages (`\"Failed to create EGL Surface\"` for `GlesRenderer::with_capabilities`, and the trailing space in `\"Failed to get pixel format from EGL context \"`).","locations":[{"ref":"cosmic-panel-bin/src/space/panel_space.rs:1389-1465","code":" 1389 |                         let client_egl_surface = unsafe {\n 1390 |                             ClientEglSurface::new(\n 1391 |                                 WlEglSurface::new(\n 1392 |                                     self.layer.as_ref().unwrap().wl_surface().id(),\n 1393 |                                     dim.w,\n 1394 |                                     dim.h,\n 1395 |                                 )\n 1396 |                                 .unwrap(), // TODO remove unwrap\n 1397 |                                 self.                              .expect(\"Failed to query EGL Context\");\n 1433 |                                 // capabilities.retain(|cap| *cap != Capability::);\n 1434 |                                 GlesRenderer::with_capabilities(egl_context, capabilities)\n 1435 |                                     .expect(\"Failed to create EGL Surface\")\n 1436 |                             }\n 1437 |                         };\n 1438 | \n 1439 |                         let mut egl_surface = unsafe {\n 1440 |                             EGLSurface::new(\n 1441 |                                 &new_egl_display,\n 1442 |                                 new_renderer\n 1443 |                                     .egl_context()\n 1444 |                                     .pixel_format()\n 1445 |                                     .expect(\"Failed to get pixel format from EGL context \"),\n 1446 |                                 new_renderer.egl_context().config_id(),\n 1447 |                                 client_egl_surface,\n 1448 |                             )\n 1449 |                             .expect(\"Failed to create EGL Surface\")\n 1450 |                         };\n 1451 |                         _ = unsafe {\n 1452 |                             new_renderer.egl_context().make_current_with_surface(&egl_surface)\n 1453 |                         };\n 1454 | \n 1455 |                         // bind before setting swap interval\n 1456 |                         let _ = new_renderer.bind(&mut egl_surface);\n 1457 |                         let swap_success =\n 1458 |                             unsafe { SwapInterval(new_egl_display.get_display_handle().handle, 0) }\n 1459 |                                 == 1;\n 1460 |                         if !swap_success {\n 1461 |                             error!(\"Failed to set swap interval\");\n 1462 |                         }\n 1463 | \n 1464 |                         renderer.replace(new_renderer);\n 1465 |                         self.egl_surface.replace(egl_surface);","lines":77,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/panel_space.rs#L1389-L1465"}]},
{"id":"PANIC_15","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`configure_panel_popup` uses `.expect(\"Failed to get pixel format from EGL context \")` and `.expect(\"Failed to initialize EGL Surface\")` in both branches. These run on a compositor-driven event (`xdg_popup.configure`) with a compositor-chosen size, so any transient EGL failure (driver reset, out of memory, degenerate size) aborts the whole panel process rather than dropping one popup. The surrounding code already demonstrates the graceful pattern: `WlEglSurface::new` a few lines above logs the error and returns. Note also the stray trailing space inside the `expect` message.","fix":"Handle both failures like the `WlEglSurface::new` case:\n```rust\nlet Some(pixel_format) = renderer.egl_context().pixel_format() else {\n    tracing::error!(\"Failed to get pixel format from EGL context\");\n    return;\n};\nlet egl_surface = match unsafe {\n    EGLSurface::new(renderer.egl_context().display(), pixel_format,\n                    renderer.egl_context().config_id(), client_egl_surface)\n} {\n    Ok(s) => s,\n    Err(err) => {\n        tracing::error!(\"Failed to initialize EGL Surface: {err:?}\");\n        return;\n    },\n};\n```","locations":[{"ref":"cosmic-panel-bin/src/space/popup.rs:117-128","code":"  117 |                 let egl_surface = unsafe {\n  118 |                     EGLSurface::new(\n  119 |                         renderer.egl_context().display(),\n  120 |                         renderer\n  121 |                             .egl_context()\n  122 |                             .pixel_format()\n  123 |                             .expect(\"Failed to get pixel format from EGL context \"),\n  124 |                         renderer.egl_context().config_id(),\n  125 |                         client_egl_surface,\n  126 |                     )\n  127 |                     .expect(\"Failed to initialize EGL Surface\")\n  128 |                 };","lines":12,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/popup.rs#L117-L128"},{"ref":"cosmic-panel-bin/src/space/popup.rs:170-181","code":"  170 |                 let egl_surface = unsafe {\n  171 |                     EGLSurface::new(\n  172 |                         renderer.egl_context().display(),\n  173 |                         renderer\n  174 |                             .egl_context()\n  175 |                             .pixel_format()\n  176 |                             .expect(\"Failed to get pixel format from EGL context \"),\n  177 |                         renderer.egl_context().config_id(),\n  178 |                         client_egl_surface,\n  179 |                     )\n  180 |                     .expect(\"Failed to initialize EGL Surface\")\n  181 |                 };","lines":12,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/popup.rs#L170-L181"}]},
{"id":"PANIC_16","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`render()` unconditionally unwraps `self.egl_surface`. The surface is only ever created in the `SpaceEvent::WaitConfigure { first: true, .. }` arm of `configure_panel_layer`; if that arm bails early (for example `WlEglSurface::new` panicking is caught elsewhere, or the space is re-created and receives a configure that lands in the `None` arm before the first one), `egl_surface` stays `None` and this line panics. Every neighbouring optional resource in the same function is handled gracefully (`damage_tracked_renderer` does `None => return Ok(())` two lines above), so the unwrap is also inconsistent with the surrounding style.","fix":"Mirror the `damage_tracked_renderer` handling:\n```rust\nlet Some(egl_surface) = self.egl_surface.as_mut() else {\n    return Ok(());\n};\n```","locations":[{"ref":"cosmic-panel-bin/src/space/render.rs:133-140","code":"  133 |             let my_renderer = match self.damage_tracked_renderer.as_mut() {\n  134 |                 Some(r) => r,\n  135 |                 None => return Ok(()),\n  136 |             };\n  137 |             let egl_surface = self.egl_surface.as_mut().unwrap();\n  138 |             _ = unsafe { renderer.egl_context().make_current_with_surface(egl_surface) };\n  139 |             let age = egl_surface.buffer_age().unwrap_or_default() as usize;\n  140 |             let mut f = renderer.bind(egl_surface)?;","lines":8,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/render.rs#L133-L140"}]},
{"id":"PANIC_17","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"`PanelSpace::spawn_clients` parses the desktop entry's `Exec=` line with `shlex` and unwraps the first token:\n\n```rust\nlet mut exec_iter = Shlex::new(panel_client.exec.as_deref().unwrap());\nlet exec = exec_iter.next().expect(\"exec parameter must contain at least on word\");\n```\n\n`DesktopEntry::exec()` returns `Some(\"\")` for an empty `Exec=` key, and `Shlex` yields no token for an empty string\nor for a string with an unterminated quote, so a malformed third-party `.desktop` file in\n`freedesktop_desktop_entry::default_paths()` crashes the whole panel process (all panels, all outputs). The message\nalso contains a typo (\"at least on word\").","fix":"Skip the applet instead of panicking. Before:\n\n```rust\nlet mut exec_iter = Shlex::new(panel_client.exec.as_deref().unwrap());\nlet exec = exec_iter.next().expect(\"exec parameter must contain at least on word\");\n```\n\nAfter:\n\n```rust\nlet mut exec_iter = Shlex::new(panel_client.exec.as_deref().unwrap_or_default());\nlet Some(exec) = exec_iter.next() else {\n    error!(\"Empty or malformed Exec for applet {}\", &panel_client.name);\n    continue;\n};\n```","locations":[{"ref":"cosmic-panel-bin/src/space/wrapper_space.rs:546-547","code":"  546 |                 let mut exec_iter = Shlex::new(panel_client.exec.as_deref().unwrap());\n  547 |                 let exec = exec_iter.next().expect(\"exec parameter must contain at least on word\");","lines":2,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/wrapper_space.rs#L546-L547"}]},
{"id":"PANIC_18","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"The security-context path unwraps three times in a row:\n`security_context.data::<SecurityContext>().unwrap()` and `data.conn.lock().unwrap().take().unwrap()`. The final\n`.take().unwrap()` panics if the socket was already taken (i.e. if the same `SecurityContext` object is used twice),\nand `.lock().unwrap()` panics if the mutex was poisoned by an unrelated panic in another thread. The same pattern is\nrepeated verbatim inside the `with_on_exit` restart closure, where a panic happens on the process-manager task and is\nmuch harder to diagnose. A failure here kills the whole panel rather than a single applet.","fix":"Handle the failure locally, e.g.\n\n```rust\nlet Some(privileged_socket) =\n    security_context.data::<SecurityContext>().and_then(|d| d.conn.lock().ok()?.take())\nelse {\n    error!(\"No privileged socket for {}\", panel_client.name);\n    continue;\n};\n```","locations":[{"ref":"cosmic-panel-bin/src/space/wrapper_space.rs:575-585","code":"  575 |                             security_context.commit();\n  576 | \n  577 |                             let data = security_context.data::<SecurityContext>().unwrap();\n  578 |                             let privileged_socket = data.conn.lock().unwrap().take().unwrap();\n  579 |                             applet_env.push((\n  580 |                                 \"X_PRIVILEGED_WAYLAND_SOCKET\".to_string(),\n  581 |                                 privileged_socket.0.as_raw_fd().to_string(),\n  582 |                             ));\n  583 | \n  584 |                             fds.push(privileged_socket.0.into());\n  585 |                             panel_client.security_ctx = Some(security_context);","lines":11,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/wrapper_space.rs#L575-L585"},{"ref":"cosmic-panel-bin/src/space/wrapper_space.rs:697-705","code":"  697 |                                             let data =\n  698 |                                                 security_context.data::<SecurityContext>().unwrap();\n  699 |                                             let privileged_socket =\n  700 |                                                 data.conn.lock().unwrap().take().unwrap();\n  701 |                                             applet_env.push((\n  702 |                                                 \"X_PRIVILEGED_WAYLAND_SOCKET\".to_string(),\n  703 |                                                 privileged_socket.0.as_raw_fd().to_string(),\n  704 |                                             ));\n  705 |                                             fds.push(privileged_socket.0.into());","lines":9,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/wrapper_space.rs#L697-L705"}]},
{"id":"PANIC_19","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"`CosmicWorkspaces::new` returns `zbus::Result<Self>` but panics instead of returning an error when the tokio runtime cannot be created: `Runtime::new().expect(\"failed to create tokio runtime\")`. Runtime creation fails for ordinary environmental reasons (fd/thread limits reached), and the panel has no reason to abort just because the workspaces DBus integration is unavailable - every other failure in this constructor is propagated as an error.","fix":"Map the error into the function's error type. Before:\n```rust\nlet runtime = Runtime::new().expect(\"failed to create tokio runtime\");\n```\nAfter:\n```rust\nlet runtime = Runtime::new().map_err(|err| zbus::Error::InputOutput(std::sync::Arc::new(err)))?;\n```","locations":[{"ref":"cosmic-panel-bin/src/workspaces_dbus.rs:23-31","code":"   23 |     pub fn new() -> zbus::Result<Self> {\n   24 |         let runtime = Runtime::new().expect(\"failed to create tokio runtime\");\n   25 |         let conn = runtime.block_on(zbus::Connection::session())?;\n   26 |         let proxy = runtime.block_on(CosmicWorkspacesProxy::new(\n   27 |             &conn,\n   28 |             \"com.system76.CosmicWorkspaces\",\n   29 |             \"/com/system76/CosmicWorkspaces\",\n   30 |         ))?;\n   31 |         Ok(Self { proxy, runtime: Arc::new(runtime) })","lines":9,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/workspaces_dbus.rs#L23-L31"}]},
{"id":"PANIC_20","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`is_shown_event_source` spawns a task whose first statement is `workspaces.is_shown_stream().await.unwrap()`. `is_shown_stream` performs three DBus calls (`receive_shown`, `receive_hidden`, `receive_owner_changed`), each of which adds a match rule on the bus and can fail (bus disconnected, message-bus rejects the match rule, service not activatable). The `unwrap` panics inside the tokio worker; tokio catches the panic, so the panel does not crash, but the `calloop` channel is silently closed and the panel never learns about the workspaces overlay again - a failure mode with no log line at all.","fix":"Replace the `unwrap` with logging and an early return:\n```rust\nlet mut stream = match workspaces.is_shown_stream().await {\n    Ok(stream) => stream,\n    Err(err) => {\n        tracing::warn!(?err, \"Failed to subscribe to CosmicWorkspaces show/hide signals\");\n        return;\n    },\n};\n```","locations":[{"ref":"cosmic-panel-bin/src/workspaces_dbus.rs:51-65","code":"   51 |     pub fn is_shown_event_source(&self) -> calloop::channel::Channel<bool> {\n   52 |         let (sender, channel) = calloop::channel::channel();\n   53 |         let workspaces = self.clone();\n   54 |         self.runtime.spawn(async move {\n   55 |             use cosmic::iced::futures::StreamExt;\n   56 |             let mut stream = workspaces.is_shown_stream().await.unwrap();\n   57 |             while let Some(value) = stream.next().await {\n   58 |                 if sender.send(value).is_err() {\n   59 |                     // Other end of channel is disconnected\n   60 |                     break;\n   61 |                 }\n   62 |             }\n   63 |         });\n   64 |         channel\n   65 |     }","lines":15,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/workspaces_dbus.rs#L51-L65"}]},
{"id":"PANIC_21","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"`cancelled` and `dnd_finished` both call `seat.server.seat.get_pointer().unwrap()` to unset the DnD grab. `get_pointer()` returns `None` for a seat whose pointer capability was removed (`SeatHandler::remove_capability` calls `remove_pointer()`), which is exactly the sort of event that also cancels an in-flight drag - unplugging the mouse mid-drag aborts the panel.","fix":"Before:\n```rust\nseat.server.seat.get_pointer().unwrap().unset_grab(\n    self,\n    SERIAL_COUNTER.next_serial(),\n    0,\n);\n```\nAfter:\n```rust\nif let Some(pointer) = seat.server.seat.get_pointer() {\n    pointer.unset_grab(self, SERIAL_COUNTER.next_serial(), 0);\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/data_device/data_source.rs:91-99","code":"   91 |         if let Some(dnd_source) = seat.server.dnd_source.take() {\n   92 |             dnd_source.cancelled();\n   93 |             seat.server.dnd_icon = None;\n   94 |             seat.server.seat.get_pointer().unwrap().unset_grab(\n   95 |                 self,\n   96 |                 SERIAL_COUNTER.next_serial(),\n   97 |                 0,\n   98 |             );\n   99 |         }","lines":9,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/data_device/data_source.rs#L91-L99"},{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/data_device/data_source.rs:134-145","code":"  134 |         if let Some(dnd_source) = seat.server.dnd_source.take() {\n  135 |             dnd_source.dnd_finished();\n  136 |             seat.server.dnd_icon = None;\n  137 |             seat.client.dnd_icon = None;\n  138 |             seat.client.dnd_source = None;\n  139 |             seat.client.next_dnd_offer_is_mine = false;\n  140 |             seat.server.seat.get_pointer().unwrap().unset_grab(\n  141 |                 self,\n  142 |                 SERIAL_COUNTER.next_serial(),\n  143 |                 0,\n  144 |             );\n  145 |         }","lines":12,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/data_device/data_source.rs#L134-L145"}]},
{"id":"PANIC_22","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`Seat::add_keyboard` returns `Result` because compiling the XKB keymap can fail (bad `XKB_DEFAULT_LAYOUT`/`XKB_DEFAULT_OPTIONS` in the environment, missing xkeyboard-config data, OOM). Both call sites `.unwrap()` it, so a user with a broken XKB configuration crashes the whole panel process the moment a seat appears.","fix":"Log and continue instead of unwinding:\n```rust\nif let Err(err) = new_server_seat.add_keyboard(Default::default(), 200, 20) {\n    tracing::error!(?err, \"failed to add keyboard to seat {name}\");\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/seat.rs:64-66","code":"   64 |             new_server_seat.add_keyboard(Default::default(), 200, 20).unwrap();\n   65 |             new_server_seat.add_pointer();\n   66 |             new_server_seat.add_touch();","lines":3,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/seat.rs#L64-L66"},{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/seat.rs:150-156","code":"  150 |             sctk::seat::Capability::Keyboard => {\n  151 |                 if info.has_keyboard {\n  152 |                     sp.server.seat.add_keyboard(Default::default(), 200, 20).unwrap();\n  153 |                     if let Ok(kbd) = self.client_state.seat_state.get_keyboard(qh, &seat, None) {\n  154 |                         sp.client.kbd.replace(kbd);\n  155 |                     }\n  156 |                 }","lines":7,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/seat.rs#L150-L156"}]},
{"id":"PANIC_23","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"Every touch handler resolves the seat with `position(..).unwrap()` and the smithay touch handle with `get_touch().unwrap()`. Both are reachable: `remove_seat` `swap_remove`s the `SeatPair` while touch events for that `wl_touch` may still be sitting in the event queue (unplugging a touchscreen mid gesture), and `remove_capability(Capability::Touch)` is an explicit no-op so the wrapper can also end up with a client `WlTouch` whose server seat no longer exposes touch. Either case aborts the whole panel.","fix":"Make `get_touch_handle` return `Option<(String, TouchHandle<GlobalState>)>` and have every handler bail out with `let Some(..) = get_touch_handle(self, touch) else { return; };`. Use it in `down` too instead of the inlined duplicate of the same lookup.","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/touch.rs:12-24","code":"   12 | fn get_touch_handle(state: &GlobalState, touch: &WlTouch) -> (String, TouchHandle<GlobalState>) {\n   13 |     let seat_index = state\n   14 |         .server_state\n   15 |         .seats\n   16 |         .iter()\n   17 |         .position(|SeatPair { client, .. }| {\n   18 |             client.touch.as_ref().map(|t| t == touch).unwrap_or(false)\n   19 |         })\n   20 |         .unwrap();\n   21 |     let seat_name = state.server_state.seats[seat_index].name.to_string();\n   22 |     let touch = state.server_state.seats[seat_index].server.seat.get_touch().unwrap();\n   23 |     (seat_name, touch)\n   24 | }","lines":13,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/touch.rs#L12-L24"},{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/touch.rs:38-47","code":"   38 |         let seat_index = self\n   39 |             .server_state\n   40 |             .seats\n   41 |             .iter()\n   42 |             .position(|SeatPair { client, .. }| {\n   43 |                 client.touch.as_ref().map(|t| t == touch).unwrap_or(false)\n   44 |             })\n   45 |             .unwrap();\n   46 |         let seat_name = self.server_state.seats[seat_index].name.to_string();\n   47 |         let touch = self.server_state.seats[seat_index].server.seat.get_touch().unwrap();","lines":10,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/touch.rs#L38-L47"}]},
{"id":"PANIC_24","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`draw_layer_surfaces` runs once per main-loop iteration and `unwrap()`s both `dmg_tracked_renderer.render_output(..)` and `egl_surface.swap_buffers(None)`. Both fail in normal operation (GPU reset, surface lost after a hot-unplug/resize, EGL_BAD_SURFACE), and either one aborts the panel process. The neighbouring `renderer.bind(..)` failure in the same loop is handled gracefully with `continue`, which shows the inconsistency.","fix":"Replace both `unwrap()`s with error logging plus `continue`, e.g.\n```rust\nif let Err(err) = dmg_tracked_renderer.render_output(renderer, &mut f, age, &elements, *clear_color) {\n    tracing::error!(?err, \"failed to render proxied layer surface\");\n    continue;\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/state.rs:359-370","code":"  359 |             _ = unsafe { renderer.egl_context().make_current_with_surface(egl_surface) };\n  360 |             let age = egl_surface.buffer_age().unwrap_or_default() as usize;\n  361 |             let Ok(mut f) = renderer.bind(egl_surface) else {\n  362 |                 continue;\n  363 |             };\n  364 |             let elements: Vec<WaylandSurfaceRenderElement<GlesRenderer>> =\n  365 |                 s_layer.render_elements(renderer, (0, 0).into(), (*scale).into(), 1.0);\n  366 |             dmg_tracked_renderer\n  367 |                 .render_output(renderer, &mut f, age, &elements, *clear_color)\n  368 |                 .unwrap();\n  369 |             drop(f);\n  370 |             egl_surface.swap_buffers(None).unwrap();","lines":12,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/state.rs#L359-L370"}]},
{"id":"PANIC_25","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"Creating the EGL surface for a client-provided layer surface and for a DnD icon uses `WlEglSurface::new(..).unwrap()` (with a `// TODO remove unwrap`) and `.expect(\"Failed to get pixel format from EGL context \")` / `.expect(\"Failed to create EGL Surface\")`. These are driver-level failures (out of GPU memory, lost context, unsupported config) triggered by data an *embedded applet* controls, so a misbehaving or unlucky applet takes the whole panel down instead of just losing its own surface.","fix":"Propagate the failure: match on the `Result`, `tracing::error!` it and `return` from the commit handler (optionally closing the offending layer surface) instead of `unwrap`/`expect`.","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/compositor.rs:137-160","code":"  137 |                 let client_egl_surface = unsafe {\n  138 |                     ClientEglSurface::new(\n  139 |                         WlEglSurface::new(\n  140 |                             client_surface.wl_surface().id(),\n  141 |                             size.w.max(1),\n  142 |                             size.h.max(1),\n  143 |                         )\n  144 |                         .unwrap(), // TODO remove unwrap\n  145 |                         client_surface.wl_surface().clone(),\n  146 |                     )\n  147 |                 };\n  148 | \n  149 |                 let egl_surface = unsafe {\n  150 |                     EGLSurface::new(\n  151 |                         renderer.egl_context().display(),\n  152 |                         renderer\n  153 |                             .egl_context()\n  154 |                             .pixel_format()\n  155 |                             .expect(\"Failed to get pixel format from EGL context \"),\n  156 |                         renderer.egl_context().config_id(),\n  157 |                         client_egl_surface,\n  158 |                     )\n  159 |                     .expect(\"Failed to create EGL Surface\")\n  160 |                 };","lines":24,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/compositor.rs#L137-L160"},{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/compositor.rs:279-298","code":"  279 |                             let client_egl_surface = unsafe {\n  280 |                                 ClientEglSurface::new(\n  281 |                                     WlEglSurface::new(c_surface.id(), size.w.max(1), size.h.max(1))\n  282 |                                         .unwrap(), // TODO remove unwrap\n  283 |                                     c_surface.clone(),\n  284 |                                 )\n  285 |                             };\n  286 | \n  287 |                             let mut egl_surface = unsafe {\n  288 |                                 EGLSurface::new(\n  289 |                                     renderer.egl_context().display(),\n  290 |                                     renderer\n  291 |                                         .egl_context()\n  292 |                                         .pixel_format()\n  293 |                                         .expect(\"Failed to get pixel format from EGL context \"),\n  294 |                                     renderer.egl_context().config_id(),\n  295 |                                     client_egl_surface,\n  296 |                                 )\n  297 |                                 .expect(\"Failed to create EGL Surface\")\n  298 |                             };","lines":20,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/compositor.rs#L279-L298"}]},
{"id":"PANIC_26","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"The `dnd_icon` commit path indexes `self.space.space_list[0]` to obtain a scale factor. `space_list` is empty whenever no panel/output is currently configured (start-up, all outputs disconnected, config reload), so a drag started in that window panics the whole panel with an index out of bounds.","fix":"Use `self.space.space_list.first().map(|s| s.scale).unwrap_or(1.0)` (or better, the scale of the output the drag icon is actually on).","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/compositor.rs:307-311","code":"  307 |                     c_icon.output_tracker = OutputDamageTracker::new(\n  308 |                         (size.w.max(1), size.h.max(1)),\n  309 |                         self.space.space_list[0].scale,\n  310 |                         Transform::Flipped180,\n  311 |                     );","lines":5,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/compositor.rs#L307-L311"}]},
{"id":"PANIC_27","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`dnd_requested` indexes `self.space.space_list[0].scale` to build the DnD icon's `OutputDamageTracker`. The\n`space_list` is empty whenever no panel space has been created yet (no matching output, all panels configured\naway, or during output hot-unplug), so starting a drag in that window panics with an index-out-of-bounds. The\nsame expression also hard-codes a `(32, 32)` icon size, which silently clips any DnD icon larger than 32x32\nphysical pixels regardless of the actual icon surface geometry.","fix":"Use a checked lookup and the real icon size:\n```rust\nlet scale = self.space.space_list.first().map(|s| s.scale).unwrap_or(1.0);\nlet size = icon.as_ref().map(|s| bbox_of_surface_tree(s).size).unwrap_or((32, 32).into());\noutput_tracker: OutputDamageTracker::new(size, scale, Transform::Flipped180),\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/mod.rs:304-319","code":"  304 |                 if let Some(client_surface) = c_icon_surface.as_ref() {\n  305 |                     client_surface.frame(&self.client_state.queue_handle, client_surface.clone());\n  306 |                     client_surface.commit();\n  307 | \n  308 |                     seat.client.dnd_icon = Some(DndIcon {\n  309 |                         surface: client_surface.clone(),\n  310 |                         egl_surface: None,\n  311 |                         output_tracker: OutputDamageTracker::new(\n  312 |                             (32, 32),\n  313 |                             self.space.space_list[0].scale,\n  314 |                             Transform::Flipped180,\n  315 |                         ),\n  316 |                         is_ready: false,\n  317 |                         has_frame: false,\n  318 |                     });\n  319 |                 }","lines":16,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/mod.rs#L304-L319"}]},
{"id":"PANIC_28","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`XdgShellHandler::new_popup` calls `self.server_state.popup_manager.track_popup(PopupKind::Xdg(surface.clone())).unwrap()`.\n`PopupManager::track_popup` returns `Err` when the popup's parent cannot be resolved into an already-tracked\npopup tree (for example a popup whose parent is another popup that the panel never tracked, or a parent that has\nalready been destroyed between `add_popup` succeeding and this call). A misbehaving or merely racy applet can\ntherefore abort the whole panel. Note the surrounding code is otherwise defensive - it bails out gracefully when\n`XdgPositioner::new` or `add_popup` fail - so the `.unwrap()` is an inconsistency.","fix":"Handle the error instead of unwrapping:\n```rust\nif let Err(err) = self.server_state.popup_manager.track_popup(PopupKind::Xdg(surface.clone())) {\n    tracing::warn!(\"Failed to track popup: {err}\");\n    return;\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/xdg_shell.rs:35-66","code":"   35 |         if self\n   36 |             .space\n   37 |             .add_popup(\n   38 |                 &self.client_state.compositor_state,\n   39 |                 self.client_state.fractional_scaling_manager.as_ref(),\n   40 |                 self.client_state.viewporter_state.as_ref(),\n   41 |                 &self.client_state.connection,\n   42 |                 &self.client_state.queue_handle,\n   43 |                 &mut self.client_state.xdg_shell_state,\n   44 |                 surface.clone(),\n   45 |                 positioner,\n   46 |                 positioner_state,\n   47 |             )\n   48 |             .is_ok()\n   49 |         {\n   50 |             self.server_state.popup_manager.track_popup(PopupKind::Xdg(surface.clone())).unwrap();\n   51 |             self.server_state.popup_manager.commit(surface.wl_surface());\n   52 |             for kbd in self\n   53 |                 .server_state\n   54 |                 .seats\n   55 |                 .iter()\n   56 |                 .filter_map(|s| s.server.seat.get_keyboard())\n   57 |                 .collect_vec()\n   58 |             {\n   59 |                 kbd.set_focus(\n   60 |                     self,\n   61 |                     Some(SpaceTarget::Surface(surface.wl_surface().clone())),\n   62 |                     SERIAL_COUNTER.next_serial(),\n   63 |                 );\n   64 |             }\n   65 |         }\n   66 |     }","lines":32,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/xdg_shell.rs#L35-L66"}]},
{"id":"PANIC_29","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"`GlobalState::draw_dnd_icon` ends with `egl_surface.swap_buffers(None).unwrap()`. `swap_buffers` returns\n`Result<(), SwapBuffersError>` and legitimately fails (`EGL_BAD_SURFACE` / `EGL_CONTEXT_LOST` after a GPU reset,\nDRM device hot-unplug, or when the underlying `wl_surface` has been destroyed by the compositor mid-drag).\nEvery other fallible call in the same function is handled gracefully with `let Ok(..) else { return }` or\n`_ = ...`, so this single `.unwrap()` is the odd one out and turns a recoverable render error into a hard crash\nof the panel.","fix":"Before:\n```rust\negl_surface.swap_buffers(None).unwrap();\n```\nAfter:\n```rust\nif let Err(err) = egl_surface.swap_buffers(None) {\n    error!(\"Failed to swap buffers for dnd icon: {err:?}\");\n    return;\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/shared_state.rs:198-201","code":"  198 |             _ = output_tracker.render_output(renderer, &mut f, age, &elements, *clear_color);\n  199 |             drop(f);\n  200 |             egl_surface.swap_buffers(None).unwrap();\n  201 |             // FIXME: damage tracking issues on integrated graphics but not nvidia","lines":4,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/shared_state.rs#L198-L201"}]},
{"id":"PANIC_30","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`EGLNativeSurface::create` for `ClientEglSurface` calls `panic!(\"recieved a null pointer for the wl_egl_surface.\")`\neven though the function's return type is `Result<*const c_void, EGLError>` and is designed to report failures.\n`wayland_egl::WlEglSurface` can end up with a null pointer when `wl_egl_window_create` fails (out of memory, or a\ndead `wl_surface`), so an EGL surface re-creation on a torn-down surface aborts the panel instead of returning an\nerror that `EGLSurface::new` would surface to the caller. The message also misspells \"received\".","fix":"Before:\n```rust\nif ptr.is_null() {\n    panic!(\"recieved a null pointer for the wl_egl_surface.\");\n}\n```\nAfter:\n```rust\nif ptr.is_null() {\n    return Err(EGLError::BadNativeWindow);\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/space/egl_surface.rs:54-72","code":"   54 | unsafe impl EGLNativeSurface for ClientEglSurface {\n   55 |     unsafe fn create(\n   56 |         &self,\n   57 |         display: &Arc<EGLDisplayHandle>,\n   58 |         config_id: ffi::egl::types::EGLConfig,\n   59 |     ) -> Result<*const c_void, EGLError> {\n   60 |         let ptr = self.wl_egl_surface.ptr();\n   61 |         if ptr.is_null() {\n   62 |             panic!(\"recieved a null pointer for the wl_egl_surface.\");\n   63 |         }\n   64 |         wrap_egl_call_ptr(|| unsafe {\n   65 |             ffi::egl::CreatePlatformWindowSurfaceEXT(\n   66 |                 display.handle,\n   67 |                 config_id,\n   68 |                 ptr as *mut _,\n   69 |                 SURFACE_ATTRIBUTES.as_ptr(),\n   70 |             )\n   71 |         })\n   72 |     }","lines":19,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/space/egl_surface.rs#L54-L72"}]},
{"id":"PANIC_31","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`get_client_sock` contains two `.unwrap()` calls on fallible operations that depend on process-wide resources:\n`UnixStream::pair().unwrap()` fails with `EMFILE`/`ENFILE` once the panel has exhausted its file-descriptor limit\n(easy to hit with many applets plus one socket pair each), and\n`display.insert_client(...).unwrap()` fails when the wayland-server backend rejects the client. Both abort the\nwhole panel instead of failing to spawn a single applet. The function is called from the applet-spawning path, so\nit runs on every panel/applet (re)start.","fix":"Change the signature to `pub fn get_client_sock(display: &mut DisplayHandle) -> anyhow::Result<(Client, UnixStream)>`\nand propagate with `?`, letting the caller log and skip the offending applet rather than terminating the process.","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/util.rs:24-37","code":"   24 | /// helper function for inserting a wrapped applet client\n   25 | pub fn get_client_sock(display: &mut wayland_server::DisplayHandle) -> (Client, UnixStream) {\n   26 |     let (display_sock, client_sock) = UnixStream::pair().unwrap();\n   27 | \n   28 |     (\n   29 |         display\n   30 |             .insert_client(\n   31 |                 display_sock,\n   32 |                 Arc::new(WrapperClientCompositorState { compositor_state: Default::default() }),\n   33 |             )\n   34 |             .unwrap(),\n   35 |         client_sock,\n   36 |     )\n   37 | }","lines":14,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/util.rs#L24-L37"}]},
{"id":"PANIC_32","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`smithay::reexports::wayland_server::Display::new().unwrap()` panics with an opaque `called Option::unwrap()/Result::unwrap() on an Err value` message if the server display cannot be created. `main` already returns `anyhow::Result<()>`, so the error can be propagated with a useful context message instead.","fix":"Before:\n```rust\nlet server_display = smithay::reexports::wayland_server::Display::new().unwrap();\n```\nAfter:\n```rust\nlet server_display = smithay::reexports::wayland_server::Display::new()\n    .context(\"failed to create the wayland server display\")?;\n```\n(with `use anyhow::Context;`).","locations":[{"ref":"cosmic-panel-bin/src/main.rs:315","code":"  315 |     let server_display = smithay::reexports::wayland_server::Display::new().unwrap();","lines":1,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/main.rs#L315"}]},
