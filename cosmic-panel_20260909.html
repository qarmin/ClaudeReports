{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"All four `TouchTarget` handlers queue an iced touch event and then call `internal.update(false)`. `IcedElementInternal::update` returns immediately when `force` is `false` and no message arrived on `rx`, so the queued `TouchEvent` is left sitting in `State::queued_events` and is never fed to the widget tree. Every `PointerTarget` handler in the same file uses `internal.update(true)`. Consequences: (a) for elements created with `request_redraws == true` (the overflow button) the touch is only processed on the next `render_elements` call that happens more than 25 ms after `pending_update` was set, so taps are delayed and a `FingerPressed`/`FingerLifted` pair can be coalesced into one update; (b) for elements created with `request_redraws == false` (`background_element`, `overflow_popup_element`) `pending_update` is never set, so `update` is never forced and `queued_events` grows without bound for the lifetime of the element - one leaked `Event` per touch sample.","fix":"Change the four `let _ = internal.update(false);` calls in `TouchTarget::{down, up, motion, cancel}` to `let _ = internal.update(true);` so touch events are processed immediately, exactly like the `PointerTarget` handlers do.","locations":[{"ref":"cosmic-panel-bin/src/iced/mod.rs:686-696","code":"  686 |         let mut internal = self.0.lock().unwrap();\n  687 |         if internal.request_redraws {\n  688 |             internal.pending_update = Some(Instant::now());\n  689 |         }\n  690 |         let id = Finger(i32::from(event.slot) as u64);\n  691 |         let position = IcedPoint::new(event.location.x as f32, event.location.y as f32);\n  692 |         internal.state.queue_event(Event::Touch(TouchEvent::FingerPressed { id, position }));\n  693 |         internal.touch_map.insert(id, position);\n  694 |         internal.cursor_pos = Some(event.location);\n  695 |         let _ = internal.update(false);\n  696 |     }","lines":11,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/iced/mod.rs#L686-L696"},{"ref":"cosmic-panel-bin/src/iced/mod.rs:705-714","code":"  705 |         let mut internal = self.0.lock().unwrap();\n  706 |         if internal.request_redraws {\n  707 |             internal.pending_update = Some(Instant::now());\n  708 |         }\n  709 |         let id = Finger(i32::from(event.slot) as u64);\n  710 |         if let Some(position) = internal.touch_map.remove(&id) {\n  711 |             internal.state.queue_event(Event::Touch(TouchEvent::FingerLifted { id, position }));\n  712 |             let _ = internal.update(false);\n  713 |         }\n  714 |     }","lines":10,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/iced/mod.rs#L705-L714"},{"ref":"cosmic-panel-bin/src/iced/mod.rs:723-733","code":"  723 |         let mut internal = self.0.lock().unwrap();\n  724 |         if internal.request_redraws {\n  725 |             internal.pending_update = Some(Instant::now());\n  726 |         }\n  727 |         let id = Finger(i32::from(event.slot) as u64);\n  728 |         let position = IcedPoint::new(event.location.x as f32, event.location.y as f32);\n  729 |         internal.state.queue_event(Event::Touch(TouchEvent::FingerMoved { id, position }));\n  730 |         internal.touch_map.insert(id, position);\n  731 |         internal.cursor_pos = Some(event.location);\n  732 |         let _ = internal.update(false);\n  733 |     }","lines":11,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/iced/mod.rs#L723-L733"},{"ref":"cosmic-panel-bin/src/iced/mod.rs:749-757","code":"  749 |         let mut internal = self.0.lock().unwrap();\n  750 |         if internal.request_redraws {\n  751 |             internal.pending_update = Some(Instant::now());\n  752 |         }\n  753 |         for (id, position) in std::mem::take(&mut internal.touch_map) {\n  754 |             internal.state.queue_event(Event::Touch(TouchEvent::FingerLost { id, position }));\n  755 |         }\n  756 |         let _ = internal.update(false);\n  757 |     }","lines":9,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/iced/mod.rs#L749-L757"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `AsRenderElements::render_elements` the damage rectangles handed to `Program::foreground` are built with the *origin* of each damage rect but the *size of the whole buffer*: `Rectangle::new((damage_rect.x as i32, damage_rect.y as i32).into(), (bounds.width as i32, bounds.height as i32).into())`. The `damage_rect.width` / `damage_rect.height` fields are computed and then thrown away. On top of that the units are mixed: `damage_rect` comes from `viewport.logical_size()` (logical points) while `bounds` is the physical buffer size, and the target type is `Rectangle<i32, BufferCoords>`. Today this is masked because the only damage rect is always at (0, 0), but any real partial-damage tracking, or a `foreground` implementation that trusts the rect, will read out of the intended region.","fix":"Scale the damage rect to buffer coordinates and use its own dimensions:\n```rust\n.map(|damage_rect| {\n    let s = scale.x;\n    Rectangle::new(\n        (((damage_rect.x as f64) * s) as i32, ((damage_rect.y as f64) * s) as i32).into(),\n        (((damage_rect.width as f64) * s) as i32, ((damage_rect.height as f64) * s) as i32).into(),\n    )\n})\n```","locations":[{"ref":"cosmic-panel-bin/src/iced/mod.rs:929-938","code":"  929 |                     let damage = damage\n  930 |                         .into_iter()\n  931 |                         .filter_map(|x| x.snap())\n  932 |                         .map(|damage_rect| {\n  933 |                             Rectangle::new(\n  934 |                                 (damage_rect.x as i32, damage_rect.y as i32).into(),\n  935 |                                 (bounds.width as i32, bounds.height as i32).into(),\n  936 |                             )\n  937 |                         })\n  938 |                         .collect::<Vec<_>>();","lines":10,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/iced/mod.rs#L929-L938"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"When a notifications applet is requested but `notifications_proxy` is `None`, the `let ... else` block tries to reconnect - and then unconditionally logs `\"Can't start notifications applet without a connection\"` and `continue`s, discarding the applet's `process`, `env` and `fds` even when the reconnect just succeeded. The applet is therefore never started on the first request after a dropped connection; it only works if the *same* applet asks again later. The `warn!` message is also emitted on the success path, which makes the logs misleading.","fix":"Retry with the freshly created proxy instead of bailing out, e.g. restructure as\n```rust\nif notifications_proxy.is_none() {\n    notifications_proxy = match tokio::time::timeout(Duration::from_secs(1), notifications_conn()).await {\n        Ok(Ok(p)) => Some(p),\n        _ => None,\n    };\n}\nlet Some(proxy) = notifications_proxy.as_mut() else {\n    warn!(\"Can't start notifications applet without a connection\");\n    continue;\n};\n```\n(note this also requires fixing the fd-reuse bug in `notifications_conn`).","locations":[{"ref":"cosmic-panel-bin/src/main.rs:237-252","code":"  237 |                         let Some(proxy) = notifications_proxy.as_mut() else {\n  238 |                             notifications_proxy = match tokio::time::timeout(\n  239 |                                 Duration::from_secs(1),\n  240 |                                 notifications_conn(),\n  241 |                             )\n  242 |                             .await\n  243 |                             {\n  244 |                                 Ok(Ok(p)) => Some(p),\n  245 |                                 _ => {\n  246 |                                     error!(\"Failed to connect to the notifications daemon\",);\n  247 |                                     None\n  248 |                                 },\n  249 |                             };\n  250 |                             warn!(\"Can't start notifications applet without a connection\");\n  251 |                             continue;\n  252 |                         };","lines":16,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/main.rs#L237-L252"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`suggested_size` (the \"there is enough slack to relax\" threshold) is multiplied by `self.scale`, making it a *physical* pixel value, but it is compared against `center_overflow`, `left_overflow` and `right_overflow`, which are all *logical* values (`left_sum = left_sum_scaled / self.scale`, and `target_left_len` is derived from `layer_major`, which comes from `self.dimensions`, a logical size).\n\nOn a 2x display the relax threshold is therefore twice as large as intended, and on a 1.5x fractional scale it is 1.5x too large: applets are only un-shrunk / moved back out of the overflow popup when far more slack accumulates than the \"1.5 applets\" of wiggle room the comment claims.","fix":"Drop the `* self.scale` factor so the threshold stays in logical pixels:\n\n```rust\nlet suggested_size = ((self.config.size.get_applet_icon_size(true) as f64\n    + self.config.size.get_applet_padding(true) as f64 * 2.)\n    * -1.5) as i32; // allows some wiggle room\n```","locations":[{"ref":"cosmic-panel-bin/src/space/layout.rs:528-532","code":"  528 |         let suggested_size = ((self.config.size.get_applet_icon_size(true) as f64\n  529 |             + self.config.size.get_applet_padding(true) as f64 * 2.)\n  530 |             * -1.5 // allows some wiggle room\n  531 |             * self.scale) as i32;\n  532 |         let center_overflow = (center_sum - target_center_len) as i32;","lines":5,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/layout.rs#L528-L532"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"The overflow popup's stored `count` is written with two different meanings, so the popup element is destroyed and rebuilt on **every** layout pass once it has been created by `reorder_overflow_space()`.\n\n- `move_to_overflow()` (else branch, no popup yet) computes `let count = overflow_space.elements().count();` *before* mapping the popup, so `count == N` (windows only).\n- `reorder_overflow_space()` computes `cur_cnt = elements.len()`, which counts the windows **plus** the popup itself, so `cur_cnt == N + 1`, sees `prev_cnt != cur_cnt`, and recreates the popup with `actual = cur_cnt - 1 == N`.\n\nThe recreated popup again stores `N`, while the next pass again computes `cur_cnt == N + 1` - the mismatch never converges. Each pass allocates a fresh `IcedElement`, calls `output_enter`, unmaps and remaps it, and marks the space dirty, i.e. unbounded per-frame churn for a static overflow list.","fix":"Use one consistent definition of \"number of overflow applets\" everywhere. E.g. in both `move_to_overflow()` and `reorder_overflow_space()` compute\n\n```rust\nlet count = space\n    .elements()\n    .filter(|e| matches!(e, PopupMappedInternal::Window(w) if w.alive()))\n    .count();\n```\n\nand compare `p.with_program(|p| p.count) != count` (dropping the `saturating_sub(1)` fudge).","locations":[{"ref":"cosmic-panel-bin/src/space/layout.rs:1117-1119","code":" 1117 |                     let prev_cnt = p.with_program(|p| p.count);\n 1118 |                     if prev_cnt != cur_cnt {\n 1119 |                         let actual = cur_cnt.saturating_sub(1);","lines":3,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/layout.rs#L1117-L1119"},{"ref":"cosmic-panel-bin/src/space/layout.rs:1483-1495","code":" 1483 |         let count = overflow_space.elements().count();\n 1484 |         if let Some(overflow_popup) = popup {\n 1485 |             let e = new_popup(count);\n 1486 |             let output = self.output.as_ref().map(|o| &o.1).unwrap();\n 1487 | \n 1488 |             e.output_enter(output, Default::default());\n 1489 |             overflow_space.unmap_elem(&overflow_popup);\n 1490 |             overflow_space.map_element(e, (0, 0), false);\n 1491 |         } else {\n 1492 |             let output = self.output.as_ref().map(|o| &o.1).unwrap();\n 1493 |             let new_popup = new_popup(count);\n 1494 |             new_popup.output_enter(output, Default::default());\n 1495 |             overflow_space.map_element(new_popup, (0, 0), false);","lines":13,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/layout.rs#L1483-L1495"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`move_to_overflow()` seeds the grid index with `let mut overflow_cnt = overflow_space.elements().count();`, but the overflow space also contains the `PopupMappedInternal::Popup` background element (mapped at `(0, 0)` by this same function and by `reorder_overflow_space()`), plus any not-yet-reaped dead windows.\n\nAs a result, once a popup exists, the first applet moved into overflow is placed at grid slot 1 instead of 0, leaving a hole, and the popup size computed from the *filtered* count (line 1443-1446) does not match the slots actually used. `reorder_overflow_space()`, in contrast, starts `overflow_cnt` at `0` and only counts alive windows.","fix":"Count only live applet windows, matching `reorder_overflow_space()`:\n\n```rust\nlet mut overflow_cnt = overflow_space\n    .elements()\n    .filter(|e| matches!(e, PopupMappedInternal::Window(w) if w.alive()))\n    .count();\n```","locations":[{"ref":"cosmic-panel-bin/src/space/layout.rs:1372","code":" 1372 |         let mut overflow_cnt = overflow_space.elements().count();","lines":1,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/layout.rs#L1372"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`shrink_center()` deliberately treats the whole panel as one list when `!self.config.expand_to_edges` - it chains `clients_left`, `clients_center` and `clients_right` before building the shrink partition. Its inverse, `relax_overflow_center()`, only ever looks at `self.clients_center`.\n\nConsequence: on a dock (`expand_to_edges == false`) applets belonging to `clients_left`/`clients_right` can be shrunk or pushed into `overflow_center`, but `relax_overflow_center()` never sees them. `shrinkable_is_relaxed()` is then evaluated over the (often empty) center partition and returns `true`, so `relax_overflow_clients()` is never invoked for those applets - they stay shrunk until an unrelated `relax_all()` happens to run.","fix":"Factor the \"which clients belong to the center list\" decision into one helper and use it from both `shrink_center()` and `relax_overflow_center()`:\n\n```rust\nfn center_partition(&self) -> OverflowClientPartition {\n    let g = self.clients_center.lock().unwrap();\n    if self.config.expand_to_edges {\n        self.shrinkable_clients(g.iter())\n    } else {\n        let l = self.clients_left.lock().unwrap();\n        let r = self.clients_right.lock().unwrap();\n        self.shrinkable_clients(l.iter().chain(g.iter()).chain(r.iter()))\n    }\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/space/layout.rs:1618-1625","code":" 1618 |     fn relax_overflow_center(\n 1619 |         &mut self,\n 1620 |         extra_space: u32,\n 1621 |         center_overflow_button: &mut Option<IcedElement<OverflowButton>>,\n 1622 |     ) {\n 1623 |         let center: MutexGuard<Vec<PanelClient>> = self.clients_center.lock().unwrap();\n 1624 |         let mut clients = self.shrinkable_clients(center.iter());\n 1625 |         drop(center);","lines":8,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/layout.rs#L1618-L1625"},{"ref":"cosmic-panel-bin/src/space/layout.rs:1221-1234","code":" 1221 |     fn shrink_center(&mut self, overflow: u32) -> u32 {\n 1222 |         let g = self.clients_center.lock().unwrap();\n 1223 |         let left_g = self.clients_left.lock().unwrap();\n 1224 |         let right_g = self.clients_right.lock().unwrap();\n 1225 |         let center: Vec<&PanelClient> = if self.config.expand_to_edges {\n 1226 |             g.iter().collect()\n 1227 |         } else {\n 1228 |             left_g.iter().chain(g.iter()).chain(right_g.iter()).collect()\n 1229 |         };\n 1230 |         let mut clients = self.shrinkable_clients(center.into_iter());\n 1231 |         drop(g);\n 1232 |         drop(left_g);\n 1233 |         drop(right_g);\n 1234 |         self.shrink_clients(overflow, &mut clients, OverflowSection::Center, false)","lines":14,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/layout.rs#L1221-L1234"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`OverflowClientPartition::constrained_shrinkables()` is supposed to return the clients that are currently *constrained* (and therefore candidates for relaxing), but its predicate is\n`bounds.is_none() || bounds.is_some_and(|s| s.w != 0 || cur_size.w.saturating_sub((s.w as f64 * scale) as i32) > self.suggested_size as i32)`.\n\nTwo problems:\n1. `bounds.is_none()` returns `true` for clients that were *never* constrained, so unconstrained applets are included; `relax_overflow_clients()` then wastes an iteration on them and bails via the `else { true }` skip path.\n2. Because of the `s.w != 0 ||` short circuit, the `cur_size.w.saturating_sub((s.w as f64 * scale) as i32)` term is **only ever evaluated when `s.w == 0`**, i.e. it always reduces to `cur_size.w > self.suggested_size`. The scale multiplication and the subtraction are dead arithmetic; the intended test (is the applet actually constrained below its natural size?) is never performed. The sibling predicate `shrinkable_is_relaxed()` uses `s.w == 0 || ...`, which strongly suggests the operator here was meant to be `&&`/`==`.","fix":"Express the predicate as the actual condition, e.g.:\n\n```rust\n.filter(|ShrinkableClient { window: w, .. }| {\n    w.toplevel().is_some_and(|t| {\n        let Some(bounds) = t.with_committed_state(|s| s.as_ref().and_then(|s| s.bounds)) else {\n            return false; // never constrained -> nothing to relax\n        };\n        let cur = w.geometry().size;\n        if is_horizontal { bounds.w != 0 && bounds.w < cur.w } else { bounds.h != 0 && bounds.h < cur.h }\n    })\n})\n```\nand make `shrinkable_is_relaxed()` its exact negation.","locations":[{"ref":"cosmic-panel-bin/src/space/layout.rs:1865-1891","code":" 1865 |     fn constrained_shrinkables(&self, is_horizontal: bool, scale: f64) -> Vec<ShrinkableClient> {\n 1866 |         self.shrinkable\n 1867 |             .iter()\n 1868 |             .filter(|ShrinkableClient { window: w, .. }| {\n 1869 |                 w.toplevel().is_some_and(|t| {\n 1870 |                     let bounds = t.with_committed_state(|s| s.as_ref().and_then(|s| s.bounds));\n 1871 |                     let cur_size = w.geometry().size;\n 1872 |                     if is_horizontal {\n 1873 |                         bounds.is_none()\n 1874 |                             || bounds.is_some_and(|s| {\n 1875 |                                 s.w != 0\n 1876 |                                     || cur_size.w.saturating_sub((s.w as f64 * scale) as i32)\n 1877 |                                         > self.suggested_size as i32\n 1878 |                             })\n 1879 |                     } else {\n 1880 |                         bounds.is_none()\n 1881 |                             || bounds.is_some_and(|s| {\n 1882 |                                 s.h != 0\n 1883 |                                     || cur_size.h.saturating_sub((s.h as f64 * scale) as i32)\n 1884 |                                         > self.suggested_size as i32\n 1885 |                             })\n 1886 |                     }\n 1887 |                 })\n 1888 |             })\n 1889 |             .cloned()\n 1890 |             .collect_vec()\n 1891 |     }","lines":27,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/layout.rs#L1865-L1891"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`PanelColors::bg_color` ignores both of its arguments whenever `color_override` is `Some`: `self.color_override.unwrap_or_else(|| ...)` returns the override verbatim, including its own alpha, so neither the `alpha` parameter nor the `opaque` flag has any effect. A panel configured with `CosmicPanelBackground::Color(..)` (which sets `color_override` via `bg_color_override()`) therefore never becomes fully opaque when a window is maximized, and per-panel opacity updates are silently dropped for such panels. The frosted-alpha multiplication a few lines above is likewise dead work in that case.","fix":"Apply the same alpha/opacity rules to the override colour:\n```rust\nmatch self.color_override {\n    Some([r, g, b, a]) => [r, g, b, if opaque { 1. } else { a.min(alpha) }],\n    None => {\n        let c = self.theme.cosmic().bg_color();\n        [c.red, c.green, c.blue, alpha]\n    },\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/space/panel_space.rs:264-276","code":"  264 |     pub fn bg_color(&self, mut alpha: f32, opaque: bool) -> [f32; 4] {\n  265 |         if self.theme.cosmic().frosted_panel && self.blur_enabled {\n  266 |             alpha *= self.theme.cosmic().alpha_map.blurred_alpha(self.theme.cosmic().frosted);\n  267 |         }\n  268 |         if opaque {\n  269 |             alpha = 1.;\n  270 |         }\n  271 | \n  272 |         self.color_override.unwrap_or_else(|| {\n  273 |             let c = self.theme.cosmic().bg_color();\n  274 |             [c.red, c.green, c.blue, alpha]\n  275 |         })\n  276 |     }","lines":13,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/panel_space.rs#L264-L276"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"The \"add to list if not already there\" checks in the spacer helpers are inverted with respect to the empty-list case and allow a *second* spacer client to be inserted. `left_guard.first().is_some_and(|c| c.name != \"spacer-start\")` is `false` both when the left list is empty **and** when it already starts with the spacer, and the two cases fall through to the same `else if` branch. So once the left list already holds a `spacer-start` entry, the next call also inserts a `spacer-start` into `clients_center`. Since `layout_`'s `map_clients` matches spacers by name (`matches!(w, Spacer(ref s) if s.name == c.name)`), the single `Spacer` element in the space is then matched by *both* client lists and laid out twice. `clear_spacer_start` only removes one of the two (it checks left first), so the center list keeps a stale entry indefinitely. `add_spacer_element_to_end` has the identical defect with `last()`.","fix":"Test explicitly for \"no spacer anywhere\" before inserting, and pick the target list from whether the left/right list is empty rather than from the name of its first element:\n```rust\nlet already_present = left_guard.iter().chain(center_guard.iter()).any(|c| c.name == \"spacer-start\");\nif !already_present {\n    if left_guard.is_empty() { center_guard.insert(0, spacer_client); }\n    else { left_guard.insert(0, spacer_client); }\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/space/panel_space.rs:637-642","code":"  637 |         // add to list if not already there\n  638 |         if left_guard.first().is_some_and(|c| c.name != \"spacer-start\") {\n  639 |             left_guard.insert(0, spacer_client);\n  640 |         } else if center_guard.first().is_some_and(|c| c.name != \"spacer-start\") {\n  641 |             center_guard.insert(0, spacer_client);\n  642 |         }","lines":6,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/panel_space.rs#L637-L642"},{"ref":"cosmic-panel-bin/src/space/panel_space.rs:687-692","code":"  687 |         // add to list if not already there\n  688 |         if right_guard.last().is_some_and(|c| c.name != \"spacer-end\") {\n  689 |             right_guard.push(spacer_client);\n  690 |         } else if center_guard.last().is_some_and(|c| c.name != \"spacer-end\") {\n  691 |             center_guard.push(spacer_client);\n  692 |         }","lines":6,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/panel_space.rs#L687-L692"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`set_maximized` computes the animation's target background colour with the **previous** maximized state: `self.colors.bg_color(opacity, was_maximized)`. The second argument is `bg_color`'s `opaque` flag, so when the panel is transitioning *into* the maximized state (`was_maximized == false`, `maximized == true`) it is asked for a non-opaque colour, and the frosted/blur alpha multiplier stays applied - the maximized panel ends up translucent instead of opaque. The reverse transition passes `true` (opaque) and then has to be patched up afterwards by overwriting `s.end.bg_color[3]`, which is a strong hint the flag is simply the wrong way round.","fix":"Use the target state and drop the after-the-fact alpha patch:\n```rust\n// before\nlet bg_color = self.colors.bg_color(opacity, was_maximized);\n// after\nlet bg_color = self.colors.bg_color(opacity, maximized);\n```","locations":[{"ref":"cosmic-panel-bin/src/space/panel_space.rs:1895-1913","code":" 1895 |     pub fn set_maximized(&mut self, maximized: bool, config: CosmicPanelConfig, opacity: f32) {\n 1896 |         let was_maximized = self.maximized;\n 1897 |         if was_maximized == maximized && self.config == config {\n 1898 |             return;\n 1899 |         }\n 1900 | \n 1901 |         let bg_color = self.colors.bg_color(opacity, was_maximized);\n 1902 |         let animate = !self.config.autohide_enabled();\n 1903 |         if !was_maximized {\n 1904 |             self.apply_config(config, Some(bg_color), animate);\n 1905 |             self.maximized = maximized;\n 1906 |         } else {\n 1907 |             self.maximized = maximized;\n 1908 |             self.apply_config(config, Some(bg_color), animate);\n 1909 |             if let Some(s) = self.animate_state.as_mut() {\n 1910 |                 s.end.bg_color[3] = self.config.opacity;\n 1911 |             }\n 1912 |         }\n 1913 |     }","lines":19,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/panel_space.rs#L1895-L1913"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"For the overflow popup, `configure_panel_popup` collapses the popup state to `None` (`None | Some(WaitConfigure) => None`) instead of storing a `WrapperPopupState::Rectangle` the way the regular-popup branch does. `handle_overflow_popup_events` is the *only* place that resizes the overflow popup's `EGLSurface`, updates its `wp_viewport` destination and rebuilds its `OutputDamageTracker`, and it only runs when the state is `Some(Rectangle { .. })`. Since the overflow popup is created with `set_reactive()`, the compositor can and does send follow-up configures with a new size/position; those update `p.wrapper_rectangle` only. `p.rectangle`, the EGL surface size and the damage tracker keep their original values, so the popup renders into a wrongly sized buffer with a stale damage tracker after any reposition or resize.","fix":"Set the same state the regular-popup branch sets, so `handle_overflow_popup_events` performs the resize:\n```rust\np.state = Some(WrapperPopupState::Rectangle {\n    x: config.position.0,\n    y: config.position.1,\n    width: config.width,\n    height: config.height,\n});\n```","locations":[{"ref":"cosmic-panel-bin/src/space/popup.rs:146-152","code":"  146 |             let (width, height) = (config.width, config.height);\n  147 |             p.wrapper_rectangle = Rectangle::new(config.position.into(), (width, height).into());\n  148 | \n  149 |             p.state = match p.state {\n  150 |                 None | Some(WrapperPopupState::WaitConfigure) => None,\n  151 |                 Some(r) => Some(r),\n  152 |             };","lines":7,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/popup.rs#L146-L152"}]},
{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"The overflow popup render block does not gate on `p.has_frame` and never clears it, unlike the popup loop (`&& p.popup.has_frame` at line 324, `p.popup.has_frame = false` at line 373) and the subsurface loop (line 380 / line 427). On top of that, `WrapperSpace::frame` in `wrapper_space.rs` only sets `has_frame = true` for the layer surface and for entries in `self.popups`; it never matches the overflow popup at all. So the overflow popup's `has_frame` is set once at creation and is dead state, and the popup is rendered whenever `dirty` is set, completely outside the compositor's frame-callback pacing. It still requests a frame callback every render (line 530), which the compositor delivers and `frame()` then discards.","fix":"Add `&& p.has_frame` to the filter, set `p.has_frame = false;` next to `p.dirty = false;`, and extend `WrapperSpace::frame` to match `self.overflow_popup`:\n```rust\n} else if let Some((p, _)) = self\n    .overflow_popup\n    .as_mut()\n    .filter(|(p, _)| surface == p.c_popup.wl_surface())\n{\n    p.has_frame = true;\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/space/render.rs:432-437","code":"  432 |         if let Some((p, section)) = self.overflow_popup.as_mut().filter(|(p, _)| {\n  433 |             p.dirty\n  434 |                 && p.egl_surface.is_some()\n  435 |                 && p.state.is_none()\n  436 |                 && p.c_popup.wl_surface().is_alive()\n  437 |         }) {","lines":6,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/render.rs#L432-L437"},{"ref":"cosmic-panel-bin/src/space/render.rs:529-533","code":"  529 |             p.egl_surface.as_ref().unwrap().swap_buffers(dmg.as_deref_mut())?;\n  530 |             let wl_surface = p.c_popup.wl_surface();\n  531 |             wl_surface.frame(qh, wl_surface.clone());\n  532 |             p.dirty = false;\n  533 |             wl_surface.commit();","lines":5,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/render.rs#L529-L533"}]},
{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`PanelSpace::add_popup` builds a `parent_parents` chain in order to keep the whole ancestor chain of the new popup\nalive, but the chain is never used: the `while !parent_parents.is_empty()` loop only pushes into `parent_parents`,\nit never pushes into `clear_exclude`, and `parent_parents` is dropped right after the loop. The subsequent\n`self.close_popups(|p| clear_exclude.contains(&p.c_popup) || !p.grab)` therefore keeps only the *direct* parent, so\nopening a third-level popup destroys its grandparent popup.\nThe traversal itself is also broken: `mem::take(&mut parent_parents)` is executed inside the `for p in ...` loop, so\nthe first popup examined drains the whole work list and the remaining popups iterate over an empty vector - which\nancestors are found depends on the order of `self.popups`.","fix":"Collect the ancestors into `clear_exclude` and make the traversal order-independent, e.g.:\n\n```rust\nlet mut queue = std::mem::take(&mut parent_parents);\nwhile let Some(w) = queue.pop() {\n    if let Some(p) = self\n        .popups\n        .iter()\n        .map(|p| &p.popup)\n        .chain(self.overflow_popup.iter().map(|p| &p.0))\n        .find(|p| p.c_popup.wl_surface() == &w)\n    {\n        clear_exclude.push(p.c_popup.clone());\n        queue.push(p.parent.clone());\n    }\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/space/wrapper_space.rs:222-235","code":"  222 |         // TODO maybe extract this to a function if it's needed elsewhere\n  223 |         while !parent_parents.is_empty() {\n  224 |             for p in\n  225 |                 self.popups.iter().map(|p| &p.popup).chain(self.overflow_popup.iter().map(|p| &p.0))\n  226 |             {\n  227 |                 for w in mem::take(&mut parent_parents) {\n  228 |                     if &w == p.c_popup.wl_surface() {\n  229 |                         parent_parents.push(p.parent.clone());\n  230 |                     }\n  231 |                 }\n  232 |             }\n  233 |         }\n  234 | \n  235 |         self.close_popups(|p| clear_exclude.contains(&p.c_popup) || !p.grab);","lines":14,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/wrapper_space.rs#L222-L235"}]},
{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"When mirroring the server-side popup input region onto the client-side surface, `PanelSpace::add_popup` ignores both\nthe rectangle location and the region operation kind:\n\n```rust\nfor r in input_regions.rects {\n    area = area.saturating_add(r.1.size.w.saturating_mul(r.1.size.h));\n    input_region.add(0, 0, r.1.size.w, r.1.size.h);\n}\n```\n\n`r.0` is the `RegionKind` (`Add`/`Subtract`) and `r.1.loc` is the rectangle origin. Every rectangle is added at\n`(0, 0)`, so a popup whose input region is, say, a small area in the lower-right corner ends up with an input region\nanchored at the top-left, and `Subtract` rectangles *add* input area instead of removing it. The compositor then\nroutes pointer/touch events to the wrong parts of the popup surface.","fix":"Honour the location and the kind:\n\n```rust\nfor (kind, rect) in input_regions.rects {\n    match kind {\n        RegionKind::Add => input_region.add(rect.loc.x, rect.loc.y, rect.size.w, rect.size.h),\n        RegionKind::Subtract => {\n            input_region.subtract(rect.loc.x, rect.loc.y, rect.size.w, rect.size.h)\n        },\n    }\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/space/wrapper_space.rs:262-273","code":"  262 |         if let Some(input_regions) = with_states(s_surface.wl_surface(), |states| {\n  263 |             let mut guard_attr = states.cached_state.get::<SurfaceAttributes>();\n  264 |             let attr = guard_attr.pending();\n  265 |             attr.input_region.clone()\n  266 |         }) {\n  267 |             let mut area: i32 = 0;\n  268 |             for r in input_regions.rects {\n  269 |                 area = area.saturating_add(r.1.size.w.saturating_mul(r.1.size.h));\n  270 |                 input_region.add(0, 0, r.1.size.w, r.1.size.h);\n  271 |             }\n  272 |             c_wl_surface.set_input_region(Some(input_region.wl_region()));\n  273 |         }","lines":12,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/wrapper_space.rs#L262-L273"}]},
{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `PanelSpace::new_output` the corner-radius object is created *inside* the `if let Some(blur_manager)` block:\n\n```rust\nif let Some(blur_manager) = self.blur_manager.as_ref() {\n    self.blur_surface = Some(blur_manager.get_background_effect(...));\n    self.corner_radius_wlr = self.corner_radius_manager.as_ref().filter(..).map(..);\n}\n```\n\nThe two protocols (`ext_background_effect_v1` and `cosmic_corner_radius_v1`) are independent. On a compositor that\nadvertises corner radius but not background effects, `self.corner_radius_wlr` stays `None` and the panel is rendered\nwith square corners even though the config asks for rounded ones.","fix":"Split the two blocks:\n\n```rust\nif let Some(blur_manager) = self.blur_manager.as_ref() {\n    self.blur_surface = Some(blur_manager.get_background_effect(client_surface.wl_surface(), qh, ()));\n}\nself.corner_radius_wlr = self.corner_radius_manager.as_ref().filter(|m| m.version() >= 2).map(|m| {\n    m.get_corner_radius_layer(match client_surface.kind() { SurfaceKind::Wlr(w) => w, _ => unimplemented!() }, qh, ())\n});\n```","locations":[{"ref":"cosmic-panel-bin/src/space/wrapper_space.rs:1597-1611","code":" 1597 |         if let Some(blur_manager) = self.blur_manager.as_ref() {\n 1598 |             self.blur_surface =\n 1599 |                 Some(blur_manager.get_background_effect(client_surface.wl_surface(), &qh, ()));\n 1600 |             self.corner_radius_wlr =\n 1601 |                 self.corner_radius_manager.as_ref().filter(|m| m.version() >= 2).map(|m| {\n 1602 |                     m.get_corner_radius_layer(\n 1603 |                         match client_surface.kind() {\n 1604 |                             SurfaceKind::Wlr(w) => w,\n 1605 |                             _ => unimplemented!(),\n 1606 |                         },\n 1607 |                         &qh,\n 1608 |                         (),\n 1609 |                     )\n 1610 |                 });\n 1611 |         }","lines":15,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/wrapper_space.rs#L1597-L1611"}]},
{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`SpaceContainer::new_output` pushes the new output into `self.outputs` unconditionally. The output handler can call\n`WrapperSpace::new_output` for an output that is already known: `OutputHandler::update_output` invokes\n`space.new_output(...)` whenever `SpaceContainer::update_output` returned `Ok(false)` (no space currently owns that\noutput), and `update_output` has already re-inserted the output into `self.outputs` at that point. The result is a\nduplicate `(WlOutput, Output, OutputInfo)` entry, which corrupts everything derived from `self.outputs`:\n`update_space` uses `self.outputs.len()` as the expected panel count for `CosmicPanelOuput::All`,\n`apply_toplevel_changes` iterates outputs (doing duplicate work), and `output_leave` only removes matching entries\nonce per event.","fix":"De-duplicate before pushing, mirroring `update_output`:\n\n```rust\nself.outputs.retain(|o| o.0 != c_output);\nself.outputs.push((c_output.clone(), s_output.clone(), output_info.clone()));\n```","locations":[{"ref":"cosmic-panel-bin/src/space_container/wrapper_space.rs:151-155","code":"  151 |         let output_name = match output_info.name.clone() {\n  152 |             Some(n) => n,\n  153 |             None => anyhow::bail!(\"Output missing name\"),\n  154 |         };\n  155 |         self.outputs.push((c_output.clone(), s_output.clone(), output_info.clone()));","lines":5,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space_container/wrapper_space.rs#L151-L155"}]},
{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"After creating the new spaces, `SpaceContainer::new_output` maps the freshly added output into the internal\n`smithay::desktop::Space` of *every* panel, including panels that live on completely different outputs:\n\n```rust\nfor s in &mut self.space_list {\n    s.space.map_output(&s_output, output_info.location);\n}\n```\n\n`PanelSpace::new_output` already maps the output into its own space (`space/wrapper_space.rs:1506-1509`), so this\nloop only adds foreign outputs. Smithay uses the mapped output set to compute `output_enter`/`output_leave` for\nelements (which turns into `wl_surface.enter/leave` for applet surfaces) and for per-output damage, so applets can be\ntold they entered an output their panel is not on. Nothing ever calls `unmap_output`, so the entries also survive\noutput unplug.","fix":"Delete the loop (each `PanelSpace` maps its own output in `PanelSpace::new_output`), or restrict it to the space that\nowns the output:\n\n```rust\nfor s in self.space_list.iter_mut().filter(|s| s.output.as_ref().map(|o| &o.0) == Some(&c_output)) {\n    s.space.map_output(&s_output, output_info.location);\n}\n```\n\nand add the corresponding `unmap_output` in `output_leave`.","locations":[{"ref":"cosmic-panel-bin/src/space_container/wrapper_space.rs:295-299","code":"  295 |         self.space_list.append(&mut new_spaces);\n  296 |         // add output to space\n  297 |         for s in &mut self.space_list {\n  298 |             s.space.map_output(&s_output, output_info.location);\n  299 |         }","lines":5,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space_container/wrapper_space.rs#L295-L299"}]},
{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`SpaceContainer::reposition_popup` always returns `Err`. The success path calls `space.reposition_popup(popup, positioner_state, token)?` inside the `if let`, but the `anyhow::bail!` that was meant for the *not found* case sits **after** the `if let` block, so it is executed unconditionally. Every successful reposition is reported as `Failed to find popup with matching client id`. The caller (`server/handlers/xdg_shell.rs`) does `let _ = self.space.reposition_popup(...)`, so today the bogus error is silently swallowed, but any future caller that checks the result (or any log added on the error path) will see a permanent false failure and never see a genuine one.","fix":"Return `Ok(())` from the success branch. Before:\n```rust\nif let Some(space) = space_for_client_mut(&mut self.space_list, p_client.as_ref()) {\n    space.reposition_popup(popup, positioner_state, token)?\n}\nanyhow::bail!(\"Failed to find popup with matching client id\")\n```\nAfter:\n```rust\nif let Some(space) = space_for_client_mut(&mut self.space_list, p_client.as_ref()) {\n    space.reposition_popup(popup, positioner_state, token)\n} else {\n    anyhow::bail!(\"Failed to find popup with matching client id\")\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/space_container/wrapper_space.rs:372-385","code":"  372 |     fn reposition_popup(\n  373 |         &mut self,\n  374 |         popup: smithay::wayland::shell::xdg::PopupSurface,\n  375 |         positioner_state: smithay::wayland::shell::xdg::PositionerState,\n  376 |         token: u32,\n  377 |     ) -> anyhow::Result<()> {\n  378 |         // add popup to the space with a client that matches the window\n  379 |         let p_client = popup.wl_surface().client().map(|c| c.id());\n  380 | \n  381 |         if let Some(space) = space_for_client_mut(&mut self.space_list, p_client.as_ref()) {\n  382 |             space.reposition_popup(popup, positioner_state, token)?\n  383 |         }\n  384 |         anyhow::bail!(\"Failed to find popup with matching client id\")\n  385 |     }","lines":14,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space_container/wrapper_space.rs#L372-L385"}]},
{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"When translating the client-side DnD source actions into smithay's `SourceMetadata`, an `else if` chain is used, so at most **one** action ever ends up in `dnd_actions`. A source that offers `Copy | Move` (the common case for a file manager drag) is advertised to the wrapped applet as copy-only, so the applet cannot offer a move and the negotiated action is wrong. The equivalent translation in `data_source.rs:162-171` correctly uses three independent `if`s.","fix":"Use independent `if`s. Before:\n```rust\nif c_action.contains(ClientDndAction::Copy) {\n    dnd_actions.push(DndAction::Copy);\n} else if c_action.contains(ClientDndAction::Move) {\n    dnd_actions.push(DndAction::Move);\n} else if c_action.contains(ClientDndAction::Ask) {\n    dnd_actions.push(DndAction::Ask);\n}\n```\nAfter:\n```rust\nif c_action.contains(ClientDndAction::Copy) {\n    dnd_actions.push(DndAction::Copy);\n}\nif c_action.contains(ClientDndAction::Move) {\n    dnd_actions.push(DndAction::Move);\n}\nif c_action.contains(ClientDndAction::Ask) {\n    dnd_actions.push(DndAction::Ask);\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/data_device/data_device.rs:110-120","code":"  110 |         let mut dnd_actions = SmallVec::new();\n  111 |         let c_action = offer.source_actions;\n  112 |         if c_action.contains(ClientDndAction::Copy) {\n  113 |             dnd_actions.push(DndAction::Copy);\n  114 |         } else if c_action.contains(ClientDndAction::Move) {\n  115 |             dnd_actions.push(DndAction::Move);\n  116 |         } else if c_action.contains(ClientDndAction::Ask) {\n  117 |             dnd_actions.push(DndAction::Ask);\n  118 |         }\n  119 | \n  120 |         let metadata = SourceMetadata { mime_types, dnd_actions };","lines":11,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/data_device/data_device.rs#L110-L120"}]},
{"id":"LOGIC_34","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`DataDeviceHandler::leave` synthesises a pointer event named `leave_event` that is in fact a `PointerEventKind::Motion` at `position: (0.0, 0.0)`. Feeding that into `pointer_frame` makes `pointer_frame_inner` treat the DnD leave as a real pointer motion to the top-left corner of the surface, which re-runs `space.update_pointer(0, 0, ..)` and can leave an applet in the corner of the panel hovered (and the panel itself marked as `Focused`) after the drag has left. The variable name and the comment-free code hide the mismatch.","fix":"Emit a real leave: `kind: PointerEventKind::Leave { serial: SERIAL_COUNTER.next_serial().into() }` (and rename the local accordingly), so the existing `Leave` arm of `pointer_frame_inner` performs the proper unfocus/`pointer_leave` bookkeeping.","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/data_device/data_device.rs:193-206","code":"  193 |         let duration_since = Instant::now().duration_since(self.start_time).as_millis() as u32;\n  194 | \n  195 |         let leave_event = PointerEvent {\n  196 |             surface,\n  197 |             kind: PointerEventKind::Motion { time: duration_since },\n  198 |             position: (0.0, 0.0),\n  199 |         };\n  200 |         if let Some(s) = s_ptr {\n  201 |             s.unset_grab(self, SERIAL_COUNTER.next_serial(), 0);\n  202 |         }\n  203 | \n  204 |         if let Some(pointer) = c_ptr {\n  205 |             self.pointer_frame(conn, qh, &pointer, &[leave_event]);\n  206 |         }","lines":14,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/data_device/data_device.rs#L193-L206"}]},
{"id":"LOGIC_35","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`DataOfferHandler::source_actions` and `selected_action` are empty stubs, and `DataDeviceHandler::enter` reads `offer.source_actions` at the moment the `wl_data_device.enter` event is processed. Per the `wl_data_offer` specification the `source_actions` event is sent *right after* `wl_data_device.enter`, so at that point the field is still empty for every drag: the `SourceMetadata` handed to `DnDGrab::new_pointer` therefore advertises **no** DnD actions at all, and because `selected_action` is also not forwarded the wrapped applet never learns which action was finally chosen. Dragging into a panel applet is effectively action-less.","fix":"Implement `source_actions` so that it updates the metadata of the running `DnDGrab` (or store the actions on the seat and re-issue `SourceMetadata` when they arrive), and implement `selected_action` to forward the chosen action to the server-side offer via smithay's DnD API.","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/data_device/data_offer.rs:6-29","code":"    6 | impl DataOfferHandler for GlobalState {\n    7 |     // TODO DnD\n    8 |     fn source_actions(\n    9 |         &mut self,\n   10 |         _conn: &sctk::reexports::client::Connection,\n   11 |         _qh: &sctk::reexports::client::QueueHandle<Self>,\n   12 |         _offer: &mut sctk::data_device_manager::data_offer::DragOffer,\n   13 |         _actions: DndAction,\n   14 |     ) {\n   15 |         // TODO forward the source actions event\n   16 |         // for when it was received after the Enter event\n   17 |     }\n   18 | \n   19 |     fn selected_action(\n   20 |         &mut self,\n   21 |         _conn: &sctk::reexports::client::Connection,\n   22 |         _qh: &sctk::reexports::client::QueueHandle<Self>,\n   23 |         _offer: &mut sctk::data_device_manager::data_offer::DragOffer,\n   24 |         _actions: DndAction,\n   25 |     ) {\n   26 |         // TODO forward the selected action event\n   27 |         // could be useful when we are selecting the action?\n   28 |     }\n   29 | }","lines":24,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/data_device/data_offer.rs#L6-L29"},{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/data_device/data_device.rs:107-121","code":"  107 |         let wl_offer = offer.inner();\n  108 | \n  109 |         let mime_types = wl_offer.data::<DataOfferData>().unwrap().with_mime_types(|m| m.to_vec());\n  110 |         let mut dnd_actions = SmallVec::new();\n  111 |         let c_action = offer.source_actions;\n  112 |         if c_action.contains(ClientDndAction::Copy) {\n  113 |             dnd_actions.push(DndAction::Copy);\n  114 |         } else if c_action.contains(ClientDndAction::Move) {\n  115 |             dnd_actions.push(DndAction::Move);\n  116 |         } else if c_action.contains(ClientDndAction::Ask) {\n  117 |             dnd_actions.push(DndAction::Ask);\n  118 |         }\n  119 | \n  120 |         let metadata = SourceMetadata { mime_types, dnd_actions };\n  121 |         let (x, y) = (offer.x, offer.y);","lines":15,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/data_device/data_device.rs#L107-L121"}]},
{"id":"LOGIC_36","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`press_key` records the *raw* evdev code in `client_state.last_key_pressed` (`(seat_name, (event.raw_code, serial), c_focus)`) while the key is delivered to the server side as `KeyCode::new(event.raw_code.saturating_add(8))` (the X11/xkb offset). `GlobalState::cleanup` (`shared_state.rs:84-93`) uses that stored value to synthesise the missing release for a client whose surface died: `kbd.input(self, key_pressed.1.0.into(), KeyState::Released, ..)`. Because the `+ 8` offset is missing there, the synthetic release is emitted for a *different* key than the one that was pressed: the stuck key stays stuck and an unrelated key gets a spurious release. `release_key` is consistent with the stored value, so only the recovery path is broken - exactly the path that exists to fix stuck keys.","fix":"Store the already-offset keycode so producers and consumers agree:\n```rust\nself.client_state.last_key_pressed.push((\n    seat_name,\n    (event.raw_code.saturating_add(8), serial),\n    c_focus,\n))\n```\nand adjust the `retain` in `release_key` to compare against `event.raw_code.saturating_add(8)` (or, alternatively, add the `+ 8` in `GlobalState::cleanup`).","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/keyboard.rs:137-155","code":"  137 |         let c_kbd_focus = {\n  138 |             let c_focused_surface = self.client_state.focused_surface.borrow_mut();\n  139 |             c_focused_surface\n  140 |                 .iter()\n  141 |                 .find_map(|f| if f.1 == seat_name { Some(f.0.clone()) } else { None })\n  142 |         };\n  143 | \n  144 |         if let Some(c_focus) = c_kbd_focus {\n  145 |             self.client_state.last_key_pressed.push((seat_name, (event.raw_code, serial), c_focus))\n  146 |         }\n  147 | \n  148 |         let _ = kbd.input::<(), _>(\n  149 |             self,\n  150 |             KeyCode::new(event.raw_code.saturating_add(8)),\n  151 |             KeyState::Pressed,\n  152 |             SERIAL_COUNTER.next_serial(),\n  153 |             event.time,\n  154 |             move |_, _modifiers, _keysym| FilterResult::Forward,\n  155 |         );","lines":19,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/keyboard.rs#L137-L155"}]},
{"id":"LOGIC_37","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`LayerShellHandler::configure` only forwards a configure to the wrapped (server-side) layer surface when `requested_size != configure.new_size`. `requested_size` is initialised from `configure.new_size` and is only overwritten in the `SurfaceState::Waiting`/`WaitingFirst` arms. In the `SurfaceState::Dirty` arm it therefore still equals `configure.new_size`, the condition is always `false`, and `send_configure()` is never called. That means once a proxied layer surface has been configured, any compositor-initiated resize (output mode change, scale change, exclusive-zone driven resize) is acknowledged by sctk but never propagated to the client that owns the surface, which keeps rendering at the old size.","fix":"Track the size that was last sent to the inner client and compare against that, e.g. store the last configured size in `SurfaceState` and send a configure whenever `Some(configure.new_size) != last_sent_size`, instead of comparing `configure.new_size` with itself in the `Dirty` case.","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/layer_shell.rs:38-73","code":"   38 |         if let Some((_, _, s_layer_surface, _, state, ..)) = self\n   39 |             .client_state\n   40 |             .proxied_layer_surfaces\n   41 |             .iter_mut()\n   42 |             .find(|(_, _, _, s, ..)| s.wl_surface() == layer.wl_surface())\n   43 |         {\n   44 |             let mut requested_size = configure.new_size;\n   45 |             let generation = match state {\n   46 |                 SurfaceState::Waiting(generation, size) => {\n   47 |                     requested_size.0 = size.w as u32;\n   48 |                     requested_size.1 = size.h as u32;\n   49 |                     let generation = *generation;\n   50 |                     *state = SurfaceState::Dirty(generation);\n   51 |                     generation\n   52 |                 },\n   53 |                 SurfaceState::Dirty(generation) => *generation,\n   54 |                 SurfaceState::WaitingFirst(generation, size) => {\n   55 |                     requested_size.0 = size.w as u32;\n   56 |                     requested_size.1 = size.h as u32;\n   57 |                     let generation = *generation;\n   58 |                     *state = SurfaceState::Dirty(generation);\n   59 |                     generation\n   60 |                 },\n   61 |             };\n   62 |             tracing::trace!(\"Layer surface configure: {configure:?}, generation: {generation}\");\n   63 |             if requested_size != configure.new_size {\n   64 |                 s_layer_surface.layer_surface().with_pending_state(|pending_state| {\n   65 |                     pending_state.size =\n   66 |                         Some((configure.new_size.0 as i32, configure.new_size.1 as i32).into());\n   67 |                 });\n   68 |                 s_layer_surface.layer_surface().send_configure();\n   69 |             }\n   70 |         } else {\n   71 |             self.space.configure_layer(layer, configure);\n   72 |         }\n   73 |     }","lines":36,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/layer_shell.rs#L38-L73"}]},
{"id":"LOGIC_38","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"On `PointerEventKind::Enter` the handler clears the *entire* shared hovered-surface list (`c_hovered_surface.clear()`) before pushing the entry for the current seat. The list is keyed by `(surface, seat_name)` and holds one entry per seat (plus extra entries pushed by `SpaceContainer::update_pointer` for stacked panels). Clearing it destroys the hover state of every other seat, so with two pointers - or a pointer plus the touch/DnD code paths that also write this list - a panel that is still hovered by seat B is treated as unhovered and auto-hides underneath the user's cursor. Every other writer of this list (`keyboard.rs`, `data_device.rs`, `SpaceContainer::update_pointer`) correctly updates only the entry matching the seat.","fix":"Update or insert only this seat's entry instead of clearing:\n```rust\nlet mut c_hovered_surface = self.client_state.hovered_surface.borrow_mut();\nc_hovered_surface.retain(|f| f.1 != seat_name);\nc_hovered_surface.push((e.surface.clone(), seat_name.to_string(), FocusStatus::Focused));\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/pointer.rs:109-122","code":"  109 |                 sctk::seat::pointer::PointerEventKind::Enter { serial } => {\n  110 |                     seat.client.last_enter = serial;\n  111 | \n  112 |                     let (surface_x, surface_y) = e.position;\n  113 | \n  114 |                     {\n  115 |                         let mut c_hovered_surface = self.client_state.hovered_surface.borrow_mut();\n  116 |                         c_hovered_surface.clear();\n  117 |                         c_hovered_surface.push((\n  118 |                             e.surface.clone(),\n  119 |                             seat_name.to_string(),\n  120 |                             FocusStatus::Focused,\n  121 |                         ));\n  122 |                     }","lines":14,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/pointer.rs#L109-L122"}]},
{"id":"LOGIC_39","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`SeatHandler::new_seat` is invoked by `sctk` from `RegistryHandler::new_global`, i.e. immediately after `wl_registry.bind`, *before* any `wl_seat.name` or `wl_seat.capabilities` event has been received. At that moment `SeatData::has_keyboard/has_pointer/has_touch` are still `AtomicBool::new(false)` and `name` is still `None`. Therefore `info.has_keyboard`, `info.has_pointer` and `info.has_touch` are *always* false here - the three `if` branches that create the client keyboard/pointer/touch are dead code and always store `None` - and `info.name.unwrap_or_default()` always yields the empty string, so every hot-plugged seat is registered (client side *and* server side, via `new_wl_seat`) under the name `\"\"`. Seat names are used as identity keys elsewhere (`ClientFocus` entries, `WrapperSpace::touch_under(.., seat_name, ..)`, `pointer_under`), so with more than one hot-plugged seat these lookups match the wrong seat.","fix":"Do not read `SeatInfo` in `new_seat`. Create only the `SeatPair` shell there (or nothing at all) and let `new_capability` - which runs when the `capabilities` event arrives, after `name` - populate the devices. Update the pair's `name` (and the smithay seat's name) once `info.name` becomes available rather than latching the empty default.","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/seat.rs:18-52","code":"   18 |     fn new_seat(&mut self, _conn: &Connection, qh: &QueueHandle<Self>, seat: wl_seat::WlSeat) {\n   19 |         if let Some(info) = self.client_state.seat_state.info(&seat) {\n   20 |             let name = info.name.unwrap_or_default();\n   21 | \n   22 |             let mut new_server_seat = self\n   23 |                 .server_state\n   24 |                 .seat_state\n   25 |                 .new_wl_seat(&self.server_state.display_handle, name.clone());\n   26 | \n   27 |             let kbd = if info.has_keyboard {\n   28 |                 self.client_state.seat_state.get_keyboard(qh, &seat, None).ok()\n   29 |             } else {\n   30 |                 None\n   31 |             };\n   32 | \n   33 |             let ptr = if info.has_pointer {\n   34 |                 self.client_state\n   35 |                     .seat_state\n   36 |                     .get_pointer_with_theme(\n   37 |                         qh,\n   38 |                         &seat,\n   39 |                         self.client_state.shm_state.wl_shm(),\n   40 |                         self.client_state.compositor_state.create_surface(qh),\n   41 |                         ThemeSpec::System,\n   42 |                     )\n   43 |                     .ok()\n   44 |             } else {\n   45 |                 None\n   46 |             };\n   47 | \n   48 |             let touch = if info.has_touch {\n   49 |                 self.client_state.seat_state.get_touch(qh, &seat).ok()\n   50 |             } else {\n   51 |                 None\n   52 |             };","lines":35,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/seat.rs#L18-L52"}]},
{"id":"LOGIC_40","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"For a hot-plugged seat, `new_seat` already calls `add_keyboard`, `add_pointer` and `add_touch` unconditionally; `new_capability` then finds the existing `SeatPair` and calls them again. `smithay::input::Seat::add_keyboard` drops the existing keyboard handle, broadcasts the reduced capability set, installs a fresh handle and broadcasts again. Embedded applets therefore see the keyboard (and pointer) disappear and reappear right after the seat shows up, and any keyboard focus / pressed-key state tracked on the old handle is lost.","fix":"Guard the server-side additions, e.g. `if sp.server.seat.get_keyboard().is_none() { sp.server.seat.add_keyboard(Default::default(), 200, 20)?; }` (and equivalently `get_pointer()` / `get_touch()` for the other two arms), or remove the unconditional adds from `new_seat`.","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/seat.rs:149-179","code":"  149 |         match capability {\n  150 |             sctk::seat::Capability::Keyboard => {\n  151 |                 if info.has_keyboard {\n  152 |                     sp.server.seat.add_keyboard(Default::default(), 200, 20).unwrap();\n  153 |                     if let Ok(kbd) = self.client_state.seat_state.get_keyboard(qh, &seat, None) {\n  154 |                         sp.client.kbd.replace(kbd);\n  155 |                     }\n  156 |                 }\n  157 |             },\n  158 |             sctk::seat::Capability::Pointer => {\n  159 |                 if info.has_pointer {\n  160 |                     sp.server.seat.add_pointer();\n  161 |                     if let Ok(ptr) = self.client_state.seat_state.get_pointer_with_theme(\n  162 |                         qh,\n  163 |                         &seat,\n  164 |                         self.client_state.shm_state.wl_shm(),\n  165 |                         self.client_state.compositor_state.create_surface(qh),\n  166 |                         ThemeSpec::System,\n  167 |                     ) {\n  168 |                         sp.client.ptr.replace(ptr);\n  169 |                     }\n  170 |                 }\n  171 |             },\n  172 |             sctk::seat::Capability::Touch => {\n  173 |                 if info.has_touch {\n  174 |                     sp.server.seat.add_touch();\n  175 |                     if let Ok(touch) = self.client_state.seat_state.get_touch(qh, &seat) {\n  176 |                         sp.client.touch.replace(touch);\n  177 |                     }\n  178 |                 }\n  179 |             },","lines":31,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/seat.rs#L149-L179"}]},
{"id":"LOGIC_41","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`client_state.touch_surfaces` is populated in `down` but no entry is ever removed - neither in `up` nor in `cancel`. The map therefore permanently holds a `WlSurface` proxy clone for every touch slot that was ever used (keeping proxies for surfaces that have since been destroyed alive), and a `motion` event for a slot id that was released but re-used out of order is resolved against the stale surface from the previous gesture, so `touch_under` can pick the wrong target surface.","fix":"Remove the slot in `up` (`self.client_state.touch_surfaces.remove(&id);`) and clear the whole map in `cancel` (`self.client_state.touch_surfaces.clear();`).","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/touch.rs:50","code":"   50 |         self.client_state.touch_surfaces.insert(id, surface.clone());","lines":1,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/touch.rs#L50"},{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/touch.rs:69-88","code":"   69 |     fn up(\n   70 |         &mut self,\n   71 |         _conn: &Connection,\n   72 |         _qh: &QueueHandle<Self>,\n   73 |         touch: &WlTouch,\n   74 |         _serial: u32,\n   75 |         time: u32,\n   76 |         id: i32,\n   77 |     ) {\n   78 |         let (_, touch) = get_touch_handle(self, touch);\n   79 | \n   80 |         touch.up(\n   81 |             self,\n   82 |             &touch::UpEvent {\n   83 |                 slot: Some(id as u32).into(),\n   84 |                 serial: SERIAL_COUNTER.next_serial(),\n   85 |                 time,\n   86 |             },\n   87 |         );\n   88 |     }","lines":20,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/touch.rs#L69-L88"},{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/touch.rs:144-147","code":"  144 |     fn cancel(&mut self, _conn: &Connection, _qh: &QueueHandle<Self>, touch: &WlTouch) {\n  145 |         let (_, touch) = get_touch_handle(self, touch);\n  146 |         touch.cancel(self);\n  147 |     }","lines":4,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/touch.rs#L144-L147"}]},
{"id":"LOGIC_42","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`TouchHandler::up` calls `touch.up(..)` but never `touch.frame(self)`, while `down` and `motion` both do. `wl_touch` requires a `frame` event to delimit a set of touch events; without it a conforming embedded applet does not process the release until some later unrelated frame arrives, so taps look stuck down.","fix":"```rust\n// before\n        touch.up(self, &touch::UpEvent { .. });\n    }\n// after\n        touch.up(self, &touch::UpEvent { .. });\n        touch.frame(self);\n    }\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/touch.rs:78-88","code":"   78 |         let (_, touch) = get_touch_handle(self, touch);\n   79 | \n   80 |         touch.up(\n   81 |             self,\n   82 |             &touch::UpEvent {\n   83 |                 slot: Some(id as u32).into(),\n   84 |                 serial: SERIAL_COUNTER.next_serial(),\n   85 |                 time,\n   86 |             },\n   87 |         );\n   88 |     }","lines":11,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/touch.rs#L78-L88"}]},
{"id":"LOGIC_43","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`ClientSeat::get_serial_of_last_seat_event` picks the pointer serial whenever there is a tie in the timestamps, even if the pointer event is the *oldest* of the three. With `last_key_press = (s, 5)`, `last_pointer_press = (p, 3)`, `last_touch_down = (t, 5)` neither strict comparison succeeds (`5 > 5` is false), so the stale pointer serial `p` is returned. Since this serial is used to validate popup grabs and drag-and-drop starts, the compositor rejects the request and the popup/DnD silently fails. Timestamp equality between a key press and a touch down is common because both come from the same input frame in milliseconds.","fix":"Pick the maximum by time instead of chained strict comparisons:\n```rust\npub fn get_serial_of_last_seat_event(&self) -> u32 {\n    [self.last_key_press, self.last_pointer_press, self.last_touch_down]\n        .into_iter()\n        .max_by_key(|(_, time)| *time)\n        .map(|(serial, _)| serial)\n        .unwrap_or_default()\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/state.rs:94-107","code":"   94 | impl ClientSeat {\n   95 |     pub fn get_serial_of_last_seat_event(&self) -> u32 {\n   96 |         let (key_serial, key_time) = self.last_key_press;\n   97 |         let (pointer_serial, pointer_time) = self.last_pointer_press;\n   98 |         let (touch_serial, touch_time) = self.last_touch_down;\n   99 |         if key_time > pointer_time && key_time > touch_time {\n  100 |             key_serial\n  101 |         } else if touch_time > key_time && touch_time > pointer_time {\n  102 |             touch_serial\n  103 |         } else {\n  104 |             pointer_serial\n  105 |         }\n  106 |     }\n  107 | }","lines":14,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/state.rs#L94-L107"}]},
{"id":"LOGIC_44","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"When an embedded client creates a `zwlr_layer_surface_v1`, the pending entry is removed from `pending_layer_surfaces` with `swap_remove` *before* the renderer is checked. If `self.space.renderer()` is `None` (which happens before the first output has been configured), the function returns and the removed `(LayerSurface, output, namespace)` tuple is dropped on the floor. The client's layer surface is then never proxied, never receives a `configure`, and the request is lost forever with no error and no retry.","fix":"Only remove the pending entry once the proxy has actually been created - peek with `iter().position(..)`, bail out early while leaving the entry in place if `self.space.renderer()` is `None`, and `swap_remove` afterwards. Log a warning when the surface is deferred.","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/compositor.rs:55-72","code":"   55 |         } else if role == \"zwlr_layer_surface_v1\".into() {\n   56 |             if let Some(pos) = self\n   57 |                 .client_state\n   58 |                 .pending_layer_surfaces\n   59 |                 .iter()\n   60 |                 .position(|s| s.0.wl_surface() == surface)\n   61 |             {\n   62 |                 let (surface, output, namespace) =\n   63 |                     self.client_state.pending_layer_surfaces.swap_remove(pos);\n   64 |                 // layer created by client\n   65 |                 // request received here\n   66 |                 // layer created in compositor & tracked by xdg-shell-wrapper in its own space\n   67 |                 // that spans all outputs get renderer from wrapper space and\n   68 |                 // draw to it\n   69 |                 let renderer = match self.space.renderer() {\n   70 |                     Some(r) => r,\n   71 |                     None => return,\n   72 |                 };","lines":18,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/compositor.rs#L55-L72"}]},
{"id":"LOGIC_45","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"Both `new_xdg` and the `GetCornerRadiusLayer` branch detect that a corner-radius object already exists for the surface and call `resource.post_error(..)` - but then fall through and continue to `data_init.init(id, data)`, install a pre-commit hook and overwrite the stored `Weak`. `post_error` does not unwind; it marks the client for disconnection. Creating further state for a client that is being killed is at best wasted work and at worst leaves a dangling hook keyed to an object that will never live. There is also a second inconsistency: `needs_hook = radius_exists.is_none()`, so when a hook exists but its object is dead (`Some(false)`) no new hook is registered *and* the stale `Weak` is never replaced, permanently breaking error reporting for that surface.","fix":"`return` immediately after `post_error`, and when `radius_exists == Some(false)` overwrite the stored `(HookId, Weak<..>)` with the new object's `downgrade()` rather than leaving the dead one in place.","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/cosmic_corner_radius.rs:175-203","code":"  175 |                     if radius_exists.unwrap_or_default() {\n  176 |                         resource.post_error(\n  177 |                             cosmic_corner_radius_manager_v1::Error::CornerRadiusExists as u32,\n  178 |                             format!(\n  179 |                                 \"{resource:?} CosmicCornerRadiusToplevelV1 object already exists \\\n  180 |                                  for the surface\"\n  181 |                             ),\n  182 |                         );\n  183 |                     }\n  184 |                     let data = Mutex::new(CornerRadiusInternal {\n  185 |                         surface: CornerRadiusSurface::Layer(layer.downgrade()),\n  186 |                         corners: None,\n  187 |                         padding: None,\n  188 |                     });\n  189 |                     let obj = data_init.init(id, data);\n  190 |                     let obj_downgrade = obj.downgrade();\n  191 | \n  192 |                     let needs_hook = radius_exists.is_none();\n  193 |                     if needs_hook {\n  194 |                         let hook_id =\n  195 |                             add_pre_commit_hook::<D, _>(surface.wl_surface(), layer_radius_hook);\n  196 |                         with_states(surface.wl_surface(), |surface_data| {\n  197 |                             let hook_ids = surface_data\n  198 |                                 .data_map\n  199 |                                 .get_or_insert_threadsafe(|| LayerHookId::new(None));\n  200 |                             let mut guard = hook_ids.lock().unwrap();\n  201 |                             *guard = Some((hook_id, obj_downgrade));\n  202 |                         });\n  203 |                     }","lines":29,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/cosmic_corner_radius.rs#L175-L203"},{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/cosmic_corner_radius.rs:239-260","code":"  239 |     if radius_exists.unwrap_or_default() {\n  240 |         resource.post_error(\n  241 |             cosmic_corner_radius_manager_v1::Error::CornerRadiusExists as u32,\n  242 |             format!(\n  243 |                 \"{resource:?} CosmicCornerRadiusToplevelV1 object already exists for the surface\"\n  244 |             ),\n  245 |         );\n  246 |     }\n  247 |     let data = Mutex::new(CornerRadiusInternal { surface, corners: None, padding: None });\n  248 |     let obj = data_init.init(id, data);\n  249 |     let obj_downgrade = obj.downgrade();\n  250 | \n  251 |     let needs_hook = radius_exists.is_none();\n  252 |     if needs_hook {\n  253 |         let hook_id = add_pre_commit_hook::<D, _>(wl_surface, xdg_radius_hook);\n  254 |         with_states(wl_surface, |surface_data| {\n  255 |             let hook_ids =\n  256 |                 surface_data.data_map.get_or_insert_threadsafe(|| ToplevelHookId::new(None));\n  257 |             let mut guard = hook_ids.lock().unwrap();\n  258 |             *guard = Some((hook_id, obj_downgrade));\n  259 |         });\n  260 |     }","lines":22,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/cosmic_corner_radius.rs#L239-L260"}]},
