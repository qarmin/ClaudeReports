{"id":"PANIC_33","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`toggle_overflow_popup()` contains four `.unwrap()` calls on values that can legitimately be absent, any of which aborts the panel process on a user click:\n\n- line 63: `XdgPositioner::new(xdg_shell_state).unwrap()` - fails if the compositor is out of resources / the global is gone.\n- line 100 and line 167: `self.layer.as_ref().unwrap()` - `self.layer` is an `Option` that is `None` before the layer surface is created and after it is torn down (the same field is checked with `if self.layer.is_some()` before layout is run in `panel_space.rs:1298`).\n- line 121: `Region::new(compositor_state).unwrap()`.\n\nThe function already returns `anyhow::Result<()>` and uses `bail!`/`?` elsewhere, so there is no reason to panic.","fix":"Replace each with a propagating form, e.g.:\n\n```rust\nlet positioner = XdgPositioner::new(xdg_shell_state)?;\nlet Some(layer) = self.layer.as_ref() else { bail!(\"no layer surface\") };\nlayer.get_popup(c_popup.xdg_popup());\n...\nlet region = Region::new(compositor_state)?;\n```\nand reuse the single `layer` binding at line 167 instead of unwrapping again.","locations":[{"ref":"cosmic-panel-bin/src/space/overflow.rs:63","code":"   63 |         let positioner = XdgPositioner::new(xdg_shell_state).unwrap();","lines":1,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/overflow.rs#L63"},{"ref":"cosmic-panel-bin/src/space/overflow.rs:100-101","code":"  100 |         self.layer.as_ref().unwrap().get_popup(c_popup.xdg_popup());\n  101 |         c_popup.xdg_popup().grab(&seat.1, seat.0);","lines":2,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/overflow.rs#L100-L101"},{"ref":"cosmic-panel-bin/src/space/overflow.rs:117-127","code":"  117 |         let blur_surface = if let Some(blur_manager) = self.blur_manager.as_ref()\n  118 |             && self.colors.theme.cosmic().frosted_applets\n  119 |         {\n  120 |             let b = blur_manager.get_background_effect(c_popup.wl_surface(), &self.qh, ());\n  121 |             let region = Region::new(compositor_state).unwrap();\n  122 |             region.add(0, 0, popup_bbox.size.w, popup_bbox.size.h);\n  123 |             b.set_blur_region(Some(region.wl_region()));\n  124 |             Some(b)\n  125 |         } else {\n  126 |             None\n  127 |         };","lines":11,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/overflow.rs#L117-L127"},{"ref":"cosmic-panel-bin/src/space/overflow.rs:167","code":"  167 |                 parent: self.layer.as_ref().unwrap().wl_surface().clone(),","lines":1,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/overflow.rs#L167"}]},
{"id":"PANIC_34","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`handle_events` converts the pending dimensions with `size.w.try_into().unwrap()` / `size.h.try_into().unwrap()`. `pending_dimensions` is an `Option<Size<i32, Logical>>` written from several places (`layout.rs:453` from computed layout arithmetic, `wrapper_space.rs:1482` from `self.dimensions`), none of which is guaranteed non-negative after the subtractions performed in `layout_`. A negative value here aborts the process instead of clamping.","fix":"Clamp instead of unwrapping:\n```rust\n// before\nlet width: u32 = size.w.try_into().unwrap();\nlet height: u32 = size.h.try_into().unwrap();\n// after\nlet width: u32 = size.w.max(0) as u32;\nlet height: u32 = size.h.max(0) as u32;\n```","locations":[{"ref":"cosmic-panel-bin/src/space/panel_space.rs:1253-1257","code":" 1253 |                 if let (Some(size), Some(layer_surface)) =\n 1254 |                     (self.pending_dimensions.take(), self.layer.as_ref())\n 1255 |                 {\n 1256 |                     let width: u32 = size.w.try_into().unwrap();\n 1257 |                     let height: u32 = size.h.try_into().unwrap();","lines":5,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/panel_space.rs#L1253-L1257"}]},
{"id":"PANIC_35","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`enable_blur_capacity` calls `unimplemented!()` when the layer surface's `SurfaceKind` is not `SurfaceKind::Wlr`. `SurfaceKind` is a `#[non_exhaustive]` sctk enum, so a future sctk release adding a variant, or any path that produces a non-wlr layer surface, turns a purely cosmetic feature (blur / corner radius) into a process abort.","fix":"Degrade gracefully instead of aborting:\n```rust\n// before\nself.corner_radius_wlr = self.corner_radius_manager.as_ref().filter(|m| m.version() >= 2).map(|m| {\n    m.get_corner_radius_layer(\n        match surface.kind() { SurfaceKind::Wlr(w) => w, _ => unimplemented!() },\n        &self.qh, (),\n    )\n});\n// after\nself.corner_radius_wlr = match surface.kind() {\n    SurfaceKind::Wlr(w) => self\n        .corner_radius_manager\n        .as_ref()\n        .filter(|m| m.version() >= 2)\n        .map(|m| m.get_corner_radius_layer(w, &self.qh, ())),\n    _ => None,\n};\n```","locations":[{"ref":"cosmic-panel-bin/src/space/panel_space.rs:2158-2168","code":" 2158 |                 self.corner_radius_wlr =\n 2159 |                     self.corner_radius_manager.as_ref().filter(|m| m.version() >= 2).map(|m| {\n 2160 |                         m.get_corner_radius_layer(\n 2161 |                             match surface.kind() {\n 2162 |                                 SurfaceKind::Wlr(w) => w,\n 2163 |                                 _ => unimplemented!(),\n 2164 |                             },\n 2165 |                             &self.qh,\n 2166 |                             (),\n 2167 |                         )\n 2168 |                     });","lines":11,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/panel_space.rs#L2158-L2168"}]},
{"id":"PANIC_36","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`PanelSpace::add_popup` unwraps `self.layer` twice (`self.layer.as_ref().unwrap().get_popup(...)` and\n`.unwrap_or(self.layer.as_ref().unwrap().wl_surface().clone())` when computing the popup's `parent`). `layer` is\n`Option<LayerSurface>` and is only set at the end of `new_output`; a popup request that arrives from an applet before\n(or after a failed) layer-surface creation panics the panel. Note that `add_popup` is reached from the server-side\nxdg-shell handler, i.e. it is driven by untrusted client requests.","fix":"Bail out early instead:\n\n```rust\nlet Some(layer) = self.layer.as_ref() else {\n    anyhow::bail!(\"Cannot add a popup to a panel without a layer surface\");\n};\n```\n\nand reuse `layer` for both `get_popup` and the `parent` fallback.","locations":[{"ref":"cosmic-panel-bin/src/space/wrapper_space.rs:243-245","code":"  243 |         if parent.is_none() {\n  244 |             self.layer.as_ref().unwrap().get_popup(c_popup.xdg_popup());\n  245 |         }","lines":3,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/wrapper_space.rs#L243-L245"},{"ref":"cosmic-panel-bin/src/space/wrapper_space.rs:315-317","code":"  315 |                 parent: parent\n  316 |                     .map(|p| p.wl_surface().clone())\n  317 |                     .unwrap_or(self.layer.as_ref().unwrap().wl_surface().clone()),","lines":3,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/wrapper_space.rs#L315-L317"}]},
{"id":"PANIC_37","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`spawn_clients` aborts the whole process with `panic!(\"Failed to get client\")` when a `PanelClient` has no client.\nEvery other failure in this loop (`stream.take()`, missing `exec`) uses `continue`, so a single broken applet entry\nshould not be fatal.","fix":"Before:\n\n```rust\nlet Some(client) = panel_client.client.as_ref() else {\n    panic!(\"Failed to get client\");\n};\n```\n\nAfter:\n\n```rust\nlet Some(client) = panel_client.client.as_ref() else {\n    error!(\"Failed to get client for {}\", &panel_client.name);\n    continue;\n};\n```","locations":[{"ref":"cosmic-panel-bin/src/space/wrapper_space.rs:607-609","code":"  607 |                 let Some(client) = panel_client.client.as_ref() else {\n  608 |                     panic!(\"Failed to get client\");\n  609 |                 };","lines":3,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/wrapper_space.rs#L607-L609"}]},
{"id":"PANIC_38","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`WrapperSpace::destroy` for `PanelSpace` is `unimplemented!()`, while `SpaceContainer::destroy` calls `s.destroy()`\nfor every space. Any future use of the container's `destroy` (a shutdown path is the obvious candidate) panics\ninstead of cleaning up. `PanelSpace` already does its cleanup in `Drop` (`space/panel_space.rs:2254-2267`).","fix":"Before:\n\n```rust\nfn destroy(&mut self) {\n    unimplemented!()\n}\n```\n\nAfter:\n\n```rust\nfn destroy(&mut self) {\n    // cleanup happens in `Drop`\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/space/wrapper_space.rs:811-813","code":"  811 |     fn destroy(&mut self) {\n  812 |         unimplemented!()\n  813 |     }","lines":3,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/wrapper_space.rs#L811-L813"},{"ref":"cosmic-panel-bin/src/space_container/wrapper_space.rs:426-430","code":"  426 |     fn destroy(&mut self) {\n  427 |         for s in &mut self.space_list {\n  428 |             s.destroy();\n  429 |         }\n  430 |     }","lines":5,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space_container/wrapper_space.rs#L426-L430"}]},
{"id":"PANIC_39","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`self.s_display.clone().unwrap()` is used in three places to obtain the server `DisplayHandle`, yet a few lines later the very same field is treated as optional with `if let Some(s_display) = self.s_display.as_ref()`. The two styles contradict each other; if `setup`/`new_output` is ever reached before `set_display_handle`, the panel aborts instead of skipping the space.","fix":"Bind the handle once and bail out instead of unwrapping. Before:\n```rust\nlet mut s = PanelSpace::new(\n    config.clone(),\n    &self.shared,\n    c,\n    self.s_display.clone().unwrap(),\n```\nAfter:\n```rust\nlet Some(s_display) = self.s_display.clone() else {\n    tracing::error!(\"No display handle set, skipping panel space creation\");\n    return None;\n};\nlet mut s = PanelSpace::new(config.clone(), &self.shared, c, s_display,\n```","locations":[{"ref":"cosmic-panel-bin/src/space_container/wrapper_space.rs:86","code":"   86 |                             self.s_display.clone().unwrap(),","lines":1,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space_container/wrapper_space.rs#L86"},{"ref":"cosmic-panel-bin/src/space_container/wrapper_space.rs:186-203","code":"  186 |                                 self.s_display.clone().unwrap(),\n  187 |                                 conn,\n  188 |                                 qh,\n  189 |                                 self.corner_radius_manager.as_ref(),\n  190 |                             );\n  191 |                             s.setup(\n  192 |                                 compositor_state,\n  193 |                                 fractional_scale_manager,\n  194 |                                 self.shared.security_context_manager.borrow().clone(),\n  195 |                                 viewport,\n  196 |                                 layer_state,\n  197 |                                 conn,\n  198 |                                 qh,\n  199 |                                 self.overlap_notify.clone(),\n  200 |                             );\n  201 |                             if let Some(s_display) = self.s_display.as_ref() {\n  202 |                                 s.set_display_handle(s_display.clone());\n  203 |                             }","lines":18,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space_container/wrapper_space.rs#L186-L203"},{"ref":"cosmic-panel-bin/src/space_container/wrapper_space.rs:252-270","code":"  252 |                                 self.s_display.clone().unwrap(),\n  253 |                                 conn,\n  254 |                                 qh,\n  255 |                                 self.corner_radius_manager.as_ref(),\n  256 |                             );\n  257 |                             s.setup(\n  258 |                                 compositor_state,\n  259 |                                 fractional_scale_manager,\n  260 |                                 self.shared.security_context_manager.borrow().clone(),\n  261 |                                 viewport,\n  262 |                                 layer_state,\n  263 |                                 conn,\n  264 |                                 qh,\n  265 |                                 self.overlap_notify.clone(),\n  266 |                             );\n  267 | \n  268 |                             if let Some(s_display) = self.s_display.as_ref() {\n  269 |                                 s.set_display_handle(s_display.clone());\n  270 |                             }","lines":19,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space_container/wrapper_space.rs#L252-L270"}]},
{"id":"PANIC_40","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`SpaceContainer::destroy` loops over `space_list` calling `s.destroy()`, but `PanelSpace::destroy` is `unimplemented!()` (`space/wrapper_space.rs:813-815`). The container method is currently never called, so it is dead code, but it is a public `WrapperSpace` trait method: the first caller that tries to shut the panel down cleanly aborts the process.","fix":"Implement `PanelSpace::destroy` (drop the layer surface, popups and spawned clients) or remove both `destroy` implementations from the trait so the impossible call cannot be made.","locations":[{"ref":"cosmic-panel-bin/src/space_container/wrapper_space.rs:426-430","code":"  426 |     fn destroy(&mut self) {\n  427 |         for s in &mut self.space_list {\n  428 |             s.destroy();\n  429 |         }\n  430 |     }","lines":5,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space_container/wrapper_space.rs#L426-L430"}]},
{"id":"PANIC_41","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"All three `Dispatch` implementations for the corner-radius protocol bodies are `match event { _ => unimplemented!() }`. A compositor event on any of these objects aborts the whole panel process. Even if the current protocol revision defines no events, a compositor speaking a newer revision (the manager is bound with `1..=2`) or a buggy/hostile compositor can deliver one, and `unimplemented!()` is the worst possible response for a client-side event handler.","fix":"Ignore unknown events with a log line instead of aborting. Before:\n```rust\nmatch event {\n    _ => unimplemented!(),\n}\n```\nAfter:\n```rust\ntracing::warn!(?event, \"Unexpected cosmic corner radius event\");\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/cosmic_corner_radius.rs:38-40","code":"   38 |         match event {\n   39 |             _ => unimplemented!(),\n   40 |         }","lines":3,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/cosmic_corner_radius.rs#L38-L40"},{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/cosmic_corner_radius.rs:53-55","code":"   53 |         match event {\n   54 |             _ => unimplemented!(),\n   55 |         }","lines":3,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/cosmic_corner_radius.rs#L53-L55"},{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/cosmic_corner_radius.rs:68-70","code":"   68 |         match event {\n   69 |             _ => unimplemented!(),\n   70 |         }","lines":3,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/cosmic_corner_radius.rs#L68-L70"}]},
{"id":"PANIC_42","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`update_repeat_info` converts compositor-supplied values without checking them: `delay.try_into().unwrap()` panics whenever the compositor sends a `delay` (a `u32` in `RepeatInfo::Repeat`) larger than `i32::MAX`, and `u32::from(rate) as i32` silently wraps to a negative repeat rate for large values. Both values come straight off the wire, so a buggy or hostile compositor can abort the panel with one `wl_keyboard.repeat_info` event.","fix":"Saturate instead of unwrapping/casting. Before:\n```rust\nRepeatInfo::Repeat { rate, delay } => {\n    kbd.change_repeat_info(u32::from(rate) as i32, delay.try_into().unwrap())\n},\n```\nAfter:\n```rust\nRepeatInfo::Repeat { rate, delay } => kbd.change_repeat_info(\n    i32::try_from(u32::from(rate)).unwrap_or(i32::MAX),\n    i32::try_from(delay).unwrap_or(i32::MAX),\n),\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/keyboard.rs:220-225","code":"  220 |             match info {\n  221 |                 RepeatInfo::Repeat { rate, delay } => {\n  222 |                     kbd.change_repeat_info(u32::from(rate) as i32, delay.try_into().unwrap())\n  223 |                 },\n  224 |                 RepeatInfo::Disable => kbd.change_repeat_info(0, 0),\n  225 |             };","lines":6,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/keyboard.rs#L220-L225"}]},
{"id":"PANIC_43","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`sctk::seat::Capability` is declared `#[non_exhaustive]`, and the `_ => unimplemented!()` arms in `new_capability` and `remove_capability` will abort the panel if a future `sctk` release adds a capability (e.g. tablet/switch). The same pattern appears in the corner-radius request matches, where `_ => unimplemented!()` aborts the *server* side on any request added by a future revision of the protocol - a client-triggerable crash rather than a protocol error.","fix":"Replace `unimplemented!()` with `_ => tracing::warn!(\"unhandled capability/request {:?}\", ..)` on the client side, and with a protocol error / warning (never a panic) on the server side.","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/seat.rs:180-181","code":"  180 |             _ => unimplemented!(),\n  181 |         }","lines":2,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/seat.rs#L180-L181"},{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/seat.rs:206-207","code":"  206 |             _ => unimplemented!(),\n  207 |         }","lines":2,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/seat.rs#L206-L207"},{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/cosmic_corner_radius.rs:206-207","code":"  206 |             _ => unimplemented!(),\n  207 |         }","lines":2,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/cosmic_corner_radius.rs#L206-L207"},{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/cosmic_corner_radius.rs:382-383","code":"  382 |             _ => unimplemented!(),\n  383 |         }","lines":2,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/cosmic_corner_radius.rs#L382-L383"},{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/cosmic_corner_radius.rs:540-541","code":"  540 |             _ => unimplemented!(),\n  541 |         }","lines":2,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/cosmic_corner_radius.rs#L540-L541"}]},
{"id":"PANIC_44","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`ToplevelManagerHandler::toplevel_manager_state` and `ToplevelInfoHandler::toplevel_info_state` `unwrap()` `Option`s that are populated by `ToplevelManagerState::try_new` / `ToplevelInfoState::try_new`, both of which return `None` when the compositor does not advertise the protocol. `WorkspaceHandler::workspace_state` and `done` do the same three times. The very same file guards the identical access defensively in `new_toplevel`/`update_toplevel` (`if let Some(s) = ... else { return; }`), so the code is internally inconsistent about whether these can be `None`.","fix":"Either document/enforce the invariant (initialise these unconditionally in `ClientState::new` and make the fields non-`Option`), or return early like `new_toplevel` does instead of `unwrap()`ing.","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/toplevel.rs:11-31","code":"   11 | impl ToplevelManagerHandler for GlobalState {\n   12 |     fn toplevel_manager_state(&mut self) -> &mut cctk::toplevel_management::ToplevelManagerState {\n   13 |         self.client_state.toplevel_manager_state.as_mut().unwrap()\n   14 |     }\n   15 | \n   16 |     fn capabilities(\n   17 |         &mut self,\n   18 |         conn: &Connection,\n   19 |         _: &QueueHandle<Self>,\n   20 |         capabilities: Vec<\n   21 |             WEnum<zcosmic_toplevel_manager_v1::ZcosmicToplelevelManagementCapabilitiesV1>,\n   22 |         >,\n   23 |     ) {\n   24 |         self.space.capabilities(conn, capabilities);\n   25 |     }\n   26 | }\n   27 | \n   28 | impl ToplevelInfoHandler for GlobalState {\n   29 |     fn toplevel_info_state(&mut self) -> &mut ToplevelInfoState {\n   30 |         self.client_state.toplevel_info_state.as_mut().unwrap()\n   31 |     }","lines":21,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/toplevel.rs#L11-L31"},{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/workspace.rs:6-16","code":"    6 | impl WorkspaceHandler for GlobalState {\n    7 |     fn workspace_state(&mut self) -> &mut cctk::workspace::WorkspaceState {\n    8 |         self.client_state.workspace_state.as_mut().unwrap()\n    9 |     }\n   10 | \n   11 |     fn done(&mut self) {\n   12 |         let groups = self.client_state.workspace_state.as_ref().unwrap().workspace_groups();\n   13 |         let workspaces = self.client_state.workspace_state.as_ref().unwrap().workspaces();\n   14 |         WorkspaceHandlerSpace::update(&mut self.space, groups, workspaces);\n   15 |     }\n   16 | }","lines":11,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/workspace.rs#L6-L16"}]},
{"id":"PANIC_45","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"Both `Dispatch::event` implementations for the security-context protocol contain the comment `// No events.` immediately followed by `unimplemented!()`. The comment and the code contradict each other, and if the compositor ever sends anything on these objects (a future protocol revision, or a non-conforming compositor) the panel aborts instead of ignoring it. Every other `Dispatch` in the tree with the same \"no events\" situation (`wp_viewporter.rs`, `wp_fractional_scaling.rs`, `ext_background_effect.rs`) has an empty body.","fix":"```rust\n// before\n        // No events.\n        unimplemented!()\n// after\n        // No events.\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/wp_security_context.rs:87-90","code":"   87 |     ) {\n   88 |         // No events.\n   89 |         unimplemented!()\n   90 |     }","lines":4,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/wp_security_context.rs#L87-L90"},{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/wp_security_context.rs:101-104","code":"  101 |     ) {\n  102 |         // No events.\n  103 |         unimplemented!()\n  104 |     }","lines":4,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/wp_security_context.rs#L101-L104"}]},
{"id":"PANIC_46","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`ClientState::new` returns `anyhow::Result<Self>` yet `unwrap()`s two fallible calls: `registry_queue_init(&connection)` (fails when the compositor closes the connection or the registry handshake fails) and `WaylandSource::new(..).insert(loop_handle)` (fails when the event source cannot be registered). Both should be propagated with `?` like `Connection::connect_to_env()` two lines above.","fix":"```rust\n// before\nlet (globals, event_queue) = registry_queue_init(&connection).unwrap();\n...\nWaylandSource::new(connection, event_queue).insert(loop_handle).unwrap();\n// after\nlet (globals, event_queue) = registry_queue_init(&connection)?;\n...\nWaylandSource::new(connection, event_queue)\n    .insert(loop_handle)\n    .map_err(|err| anyhow::anyhow!(\"failed to insert wayland source: {err}\"))?;\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/state.rs:258-262","code":"  258 |         let connection = Connection::connect_to_env()?;\n  259 | \n  260 |         let (globals, event_queue) = registry_queue_init(&connection).unwrap();\n  261 |         let qh = event_queue.handle();\n  262 |         let registry_state = RegistryState::new(&globals);","lines":5,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/state.rs#L258-L262"},{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/state.rs:343-345","code":"  343 |         WaylandSource::new(connection, event_queue).insert(loop_handle).unwrap();\n  344 | \n  345 |         Ok(client_state)","lines":3,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/state.rs#L343-L345"}]},
{"id":"PANIC_47","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`write_and_attach_buffer` slices the client's shm mapping with values taken straight from the buffer metadata:\n`&from[offset..(offset + height * stride)]`. `offset`, `height` and `stride` are client-supplied\n`wl_shm_pool.create_buffer` parameters; if any validation gap exists between smithay's shm bookkeeping and the\nactual mapping length (`length`), this is an out-of-bounds slice index that panics inside a\n`with_buffer_contents` callback while holding the shm lock. There is no bounds check even though `length` is\nright there in the same closure.","fix":"Bound-check before slicing:\n```rust\nlet end = offset.checked_add(height.checked_mul(stride).context(\"shm size overflow\")?)\n    .context(\"shm size overflow\")?;\nif end > length {\n    bail!(\"shm buffer metadata exceeds pool mapping ({end} > {length})\");\n}\nwriter.write_all(&from[offset..end])?;\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/util.rs:71-78","code":"   71 |                         let mut writer = BufWriter::new(to);\n   72 |                         let from: &[u8] = unsafe { std::slice::from_raw_parts(from, length) };\n   73 |                         let offset: usize = offset.try_into()?;\n   74 |                         let height: usize = height.try_into()?;\n   75 |                         let stride: usize = stride.try_into()?;\n   76 | \n   77 |                         writer.write_all(&from[offset..(offset + height * stride)])?;\n   78 |                         writer.flush()?;","lines":8,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/util.rs#L71-L78"}]},
{"id":"PANIC_48","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`FromStr for CosmicPanelOuput` byte-slices a `&str` at fixed indices: `&s[..5]` and `s[5..s.len() - 1]`. `str`\nindexing panics when the index is not a UTF-8 char boundary. Any input at least 6 bytes long whose byte 5 falls\ninside a multi-byte character (e.g. `\"Name€\"` -> the `€` starts at byte 4, so byte 5 is a continuation byte)\npanics with \"byte index 5 is not a char boundary\" instead of returning the intended\n`bail!(\"Failed to parse output.\")`. This is a `pub` API of a config crate consumed by other COSMIC components, so\narbitrary strings reach it.","fix":"Use boundary-safe string operations:\n```rust\ns => match s.strip_prefix(\"Name(\").and_then(|s| s.strip_suffix(')')) {\n    Some(name) => Ok(Self::Name(name.to_string())),\n    None => bail!(\"Failed to parse output.\"),\n},\n```","locations":[{"ref":"cosmic-panel-config/src/panel_config.rs:381-394","code":"  381 | impl FromStr for CosmicPanelOuput {\n  382 |     type Err = anyhow::Error;\n  383 | \n  384 |     fn from_str(s: &str) -> Result<Self, Self::Err> {\n  385 |         match s {\n  386 |             \"All\" => Ok(Self::All),\n  387 |             \"Active\" => Ok(Self::Active),\n  388 |             s if s.len() >= 6 && &s[..5] == \"Name(\" && s.ends_with(')') => {\n  389 |                 Ok(Self::Name(s[5..s.len() - 1].to_string()))\n  390 |             },\n  391 |             _ => bail!(\"Failed to parse output.\"),\n  392 |         }\n  393 |     }\n  394 | }","lines":14,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-config/src/panel_config.rs#L381-L394"}]},
{"id":"UAF_1","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"medium","description":"`notifications_conn()` takes ownership of a raw file descriptor number read from the `PANEL_NOTIFICATIONS_FD` environment variable via `rustix::fd::OwnedFd::from_raw_fd(fd)`, but the environment variable is never cleared. `main.rs` calls `notifications_conn()` more than once: once at startup under a 5 s `tokio::time::timeout`, and again later when a notifications applet is spawned while `notifications_proxy` is `None`. On the first call the fd is moved into `UnixStream` -> `tokio::net::UnixStream` -> the `zbus` connection; if that call fails or is cancelled by the timeout, the `OwnedFd` is dropped and the descriptor is **closed**. The second call then re-wraps the very same integer in a new `OwnedFd`. By that point the number may already have been recycled by an unrelated `open`/`socket` (the process opens Wayland sockets, applet socketpairs and D-Bus connections concurrently), so the panel will drive D-Bus traffic over - and eventually close - somebody else's descriptor. Even in the benign case it is a double-close of a descriptor the process no longer owns.","fix":"Take the descriptor exactly once. Read and remove the variable up-front (`std::env::var(...)` followed by `unsafe { std::env::remove_var(PANEL_NOTIFICATIONS_FD) }`), store the resulting `OwnedFd` in a `OnceCell`/`Option` owned by the applet task, and have `notifications_conn()` accept an `OwnedFd`/`&mut Option<OwnedFd>` argument rather than re-reading the environment. Any reconnect attempt after the fd has been consumed must fail fast instead of fabricating a new `OwnedFd` from the stale number.","locations":[{"ref":"cosmic-panel-bin/src/notifications.rs:22-38","code":"   22 |     let fd_num = std::env::var(PANEL_NOTIFICATIONS_FD)\n   23 |         .map_err(|_| anyhow::anyhow!(\"No {} env var found\", PANEL_NOTIFICATIONS_FD))?;\n   24 |     let fd = fd_num\n   25 |         .parse::<RawFd>()\n   26 |         .map_err(|_| anyhow::anyhow!(\"Invalid {} env var\", PANEL_NOTIFICATIONS_FD))?;\n   27 |     let fd = unsafe { rustix::fd::OwnedFd::from_raw_fd(fd) };\n   28 | \n   29 |     let res = fcntl_getfd(&fd).and_then(|flags| fcntl_setfd(&fd, FdFlags::CLOEXEC.union(flags)));\n   30 | \n   31 |     let daemon_stream = match res {\n   32 |         // CLOEXEC worked and we can startup with session IPC\n   33 |         Ok(_) => UnixStream::from(fd),\n   34 |         // CLOEXEC didn't work, something is wrong with the fd, just close it\n   35 |         Err(err) => {\n   36 |             return Err(err.into());\n   37 |         },\n   38 |     };","lines":17,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/notifications.rs#L22-L38"},{"ref":"cosmic-panel-bin/src/main.rs:237-252","code":"  237 |                         let Some(proxy) = notifications_proxy.as_mut() else {\n  238 |                             notifications_proxy = match tokio::time::timeout(\n  239 |                                 Duration::from_secs(1),\n  240 |                                 notifications_conn(),\n  241 |                             )\n  242 |                             .await\n  243 |                             {\n  244 |                                 Ok(Ok(p)) => Some(p),\n  245 |                                 _ => {\n  246 |                                     error!(\"Failed to connect to the notifications daemon\",);\n  247 |                                     None\n  248 |                                 },\n  249 |                             };\n  250 |                             warn!(\"Can't start notifications applet without a connection\");\n  251 |                             continue;\n  252 |                         };","lines":16,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/main.rs#L237-L252"}]},
{"id":"UAF_2","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"medium","description":"`DataDeviceHandler::selection` caches the incoming offer in `seat.client.selection_offer`, but that cache is never invalidated, while sctk destroys the underlying `wl_data_offer` behind its back. In sctk's `wl_data_device` dispatch, `Event::Selection` first does `if let Some(offer) = inner.selection_offer.take() { offer.destroy(); }` and only calls `state.selection(..)` when the new `id` is `Some`. Two consequences:\n1. When the selection is *cleared* (`id == None`), the handler is not invoked at all, so `seat.client.selection_offer` keeps a `SelectionOffer` whose proxy has already been destroyed.\n2. When the panel itself owns the selection, the handler returns early at the `next_selection_offer_is_mine` check - again leaving the previously stored, now-destroyed offer in place.\n`send_selection` (`server/handlers/mod.rs:486-487`) later calls `receive_to_fd(offer.inner(), ..)` on that dead proxy: the request is dropped by wayland-rs, the passed fd is closed, and the applet's paste silently returns no data.","fix":"Clear the cache whenever it can go stale: set `seat.client.selection_offer = None` in the `next_selection_offer_is_mine` early-return branch, and guard the use in `send_selection` with `offer.inner().is_alive()`. Because sctk never reports a cleared selection, also reset the field from the `new_selection`/`unset_selection` path in `server/handlers/mod.rs`.","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/data_device/data_device.rs:40-59","code":"   40 |         // ignore our own selection offer\n   41 |         if seat.client.next_selection_offer_is_mine {\n   42 |             seat.client.next_selection_offer_is_mine = false;\n   43 |             return;\n   44 |         }\n   45 | \n   46 |         let offer = match data_device.data::<DataDeviceData>().unwrap().selection_offer() {\n   47 |             Some(offer) => offer,\n   48 |             None => return,\n   49 |         };\n   50 |         let wl_offer = offer.inner();\n   51 | \n   52 |         let mime_types = wl_offer.data::<DataOfferData>().unwrap().with_mime_types(|m| m.to_vec());\n   53 |         seat.client.selection_offer = Some(offer);\n   54 |         set_data_device_selection(\n   55 |             &self.server_state.display_handle,\n   56 |             &seat.server.seat,\n   57 |             mime_types,\n   58 |             (),\n   59 |         );","lines":20,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/data_device/data_device.rs#L40-L59"}]},
{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"easy","description":"`commit_wlr` calls `cosmic_corner_radius_manager.get_corner_radius_layer(...)` on every commit and overwrites the previously stored object in `*corner` without destroying it. Each commit therefore leaks a `CosmicCornerRadiusLayerV1` proxy on both sides of the connection, and attaching a second corner-radius object to the same `zwlr_layer_surface_v1` is exactly the kind of `corner_radius_exists` situation the protocol treats as a fatal error (the server-side half of this very file raises it). The blur code in `ext_background_effect.rs:54-71` was already fixed for this identical bug and carries an explicit comment about it; the corner-radius copy was not updated.","fix":"Reuse the stored object exactly like the blur path does:\n```rust\nlet corner_surface = if let Some(existing) = corner.as_ref() {\n    existing.clone()\n} else {\n    let new_corner = cosmic_corner_radius_manager.get_corner_radius_layer(\n        wlr, &self.client_state.queue_handle, (),\n    );\n    *corner = Some(new_corner.clone());\n    new_corner\n};\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/cosmic_corner_radius.rs:766-808","code":"  766 |             let Some(cosmic_corner_radius_manager) =\n  767 |                 self.client_state.cosmic_corner_radius_manager.as_ref()\n  768 |             else {\n  769 |                 break;\n  770 |             };\n  771 | \n  772 |             if cosmic_corner_radius_manager.version() < 2 {\n  773 |                 break;\n  774 |             }\n  775 | \n  776 |             let SurfaceKind::Wlr(wlr) = c_layer_shell_surface.kind() else {\n  777 |                 break;\n  778 |             };\n  779 | \n  780 |             let corner_surface = cosmic_corner_radius_manager.get_corner_radius_layer(\n  781 |                 wlr,\n  782 |                 &self.client_state.queue_handle,\n  783 |                 (),\n  784 |             );\n  785 | \n  786 |             if let Some(padding) = padding.0 {\n  787 |                 corner_surface.set_padding(\n  788 |                     padding.top,\n  789 |                     padding.right,\n  790 |                     padding.bottom,\n  791 |                     padding.left,\n  792 |                 );\n  793 |             } else {\n  794 |                 corner_surface.unset_padding();\n  795 |             }\n  796 | \n  797 |             if let Some(corners) = corners.0 {\n  798 |                 corner_surface.set_radius(\n  799 |                     corners.top_left,\n  800 |                     corners.top_right,\n  801 |                     corners.bottom_right,\n  802 |                     corners.bottom_left,\n  803 |                 );\n  804 |             } else {\n  805 |                 corner_surface.unset_radius();\n  806 |             }\n  807 |             *corner = Some(corner_surface);\n  808 |         }","lines":43,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/cosmic_corner_radius.rs#L766-L808"}]},
{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"`toggle_overflow_popup()` creates a client `wl_surface` at line 53 (`compositor_state.create_surface(qh)`), which is a raw `wl_surface::WlSurface` proxy - `wayland-client` proxies do **not** destroy themselves on drop. Two paths return before the surface is ever handed to a `Popup` (which would own it):\n\n- line 55-59: `bail!(\"No element found with id: {:?}\", element_id)` when `overflow_elements_for_id()` finds no button or no popup element in the overflow space;\n- line 86-92: the `?` on `popup::Popup::from_surface(...)`.\n\nEach such call leaks one `wl_surface` in the compositor for the lifetime of the panel process. Because the function is driven by user clicks on the overflow button, a user repeatedly clicking a stale button grows the compositor-side object table without bound.","fix":"Move the `create_surface` call after all fallible pre-conditions, or destroy it on the error paths:\n\n```rust\nlet (Some((element, section)), Some(popup_element)) = self.overflow_elements_for_id(&element_id) else {\n    bail!(\"No element found with id: {:?}\", element_id);\n};\nlet c_wl_surface = compositor_state.create_surface(qh);\nlet c_popup = match popup::Popup::from_surface(None, &positioner, qh, c_wl_surface.clone(), xdg_shell_state) {\n    Ok(p) => p,\n    Err(e) => {\n        c_wl_surface.destroy();\n        return Err(e.into());\n    },\n};\n```","locations":[{"ref":"cosmic-panel-bin/src/space/overflow.rs:53-59","code":"   53 |         let c_wl_surface = compositor_state.create_surface(qh);\n   54 | \n   55 |         let (Some((element, section)), Some(popup_element)) =\n   56 |             self.overflow_elements_for_id(&element_id)\n   57 |         else {\n   58 |             bail!(\"No element found with id: {:?}\", element_id);\n   59 |         };","lines":7,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/overflow.rs#L53-L59"},{"ref":"cosmic-panel-bin/src/space/overflow.rs:86-92","code":"   86 |         let c_popup = popup::Popup::from_surface(\n   87 |             None,\n   88 |             &positioner,\n   89 |             qh,\n   90 |             c_wl_surface.clone(),\n   91 |             xdg_shell_state,\n   92 |         )?;","lines":7,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/overflow.rs#L86-L92"}]},
{"id":"MEM_3","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"The overflow popup creates a `wp_fractional_scale_v1` (line 103-104) and a `wp_viewport` (line 106-110) and stores them in `PanelPopup::fractional_scale` / `PanelPopup::viewport`, but nothing ever destroys them:\n\n- `PanelPopup`'s `Drop` impl (`xdg_shell_wrapper/space/popup.rs:46-54`) only destroys `blur_surface` and `corner_radius`.\n- `PanelSpace::close_popups()` (`space/popup.rs:38-50`), which is what actually tears the overflow popup down (it is invoked from line 39 of this function), destroys only `xdg_popup` and `wl_surface`.\n\nThe regular applet popup path explicitly destroys them (`panel_space.rs:1312-1317`), which confirms this is an oversight rather than intentional. Every open/close cycle of the overflow popup therefore leaks two Wayland objects. Destroying the parent `wl_surface` without first destroying the `wp_viewport`/`wp_fractional_scale_v1` attached to it is also a protocol contract violation in both extensions.","fix":"Move the cleanup into `PanelPopup::drop` so every construction site is covered:\n\n```rust\nimpl Drop for PanelPopup {\n    fn drop(&mut self) {\n        if let Some(v) = self.viewport.take() { v.destroy(); }\n        if let Some(f) = self.fractional_scale.take() { f.destroy(); }\n        if let Some(blur) = self.blur_surface.take() { blur.destroy(); }\n        if let Some(corners) = self.corner_radius.take() { corners.destroy(); }\n    }\n}\n```\nand drop the now-redundant explicit `destroy()` calls in `panel_space.rs`.","locations":[{"ref":"cosmic-panel-bin/src/space/overflow.rs:103-113","code":"  103 |         let fractional_scale =\n  104 |             fractional_scale_manager.map(|f| f.fractional_scaling(&c_wl_surface, qh));\n  105 | \n  106 |         let viewport = viewport.map(|v| {\n  107 |             let viewport = v.get_viewport(&c_wl_surface, qh);\n  108 |             viewport.set_destination(popup_bbox.size.w.max(1), popup_bbox.size.h.max(1));\n  109 |             viewport\n  110 |         });\n  111 |         if fractional_scale.is_none() {\n  112 |             c_wl_surface.set_buffer_scale(self.scale as i32);\n  113 |         }","lines":11,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/overflow.rs#L103-L113"}]},
{"id":"MEM_4","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"`Drop for PanelSpace` only destroys `blur_surface` and `corner_radius_wlr`. The `wp_viewport` (`layer_viewport`), the `wp_fractional_scale_v1` (`layer_fractional_scale`) and the `zcosmic_overlap_notification_v1` (`notification_subscription`) are never destroyed - neither here nor anywhere else in the crate (they are only ever assigned, including a plain overwrite in `wrapper_space.rs`). Panels are dropped and recreated on output hotplug, scale changes, anchor changes and `RestartSpace` messages, so each cycle leaks three compositor-side objects.","fix":"Destroy the remaining client objects in `Drop`:\n```rust\nif let Some(v) = self.layer_viewport.take() { v.destroy(); }\nif let Some(f) = self.layer_fractional_scale.take() { f.destroy(); }\nif let Some(n) = self.notification_subscription.take() { n.destroy(); }\n```","locations":[{"ref":"cosmic-panel-bin/src/space/panel_space.rs:2254-2267","code":" 2254 | impl Drop for PanelSpace {\n 2255 |     fn drop(&mut self) {\n 2256 |         // request processes to stop\n 2257 |         let _ = self.shared.applet_tx.try_send(AppletMsg::Cleanup(self.id()));\n 2258 |         self.clients_center.lock().unwrap().clear();\n 2259 |         self.clients_left.lock().unwrap().clear();\n 2260 |         self.clients_right.lock().unwrap().clear();\n 2261 |         if let Some(blur_surface) = self.blur_surface.take() {\n 2262 |             blur_surface.destroy();\n 2263 |         }\n 2264 |         if let Some(corner_radius_wlr) = self.corner_radius_wlr.take() {\n 2265 |             corner_radius_wlr.destroy();\n 2266 |         }\n 2267 |     }","lines":14,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/panel_space.rs#L2254-L2267"}]},
{"id":"MEM_5","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"`close_popups` tears down popups without destroying their `wp_fractional_scale_v1` and `wp_viewport` objects. `PanelPopup`'s `Drop` impl (`xdg_shell_wrapper/space/popup.rs`) only destroys `blur_surface` and `corner_radius`, and sctk's `Popup`/`XdgShellSurface`/`Surface` drops only cover `xdg_popup`, `xdg_surface` and `wl_surface`. The *other* teardown path - the `retain_mut` in `PanelSpace::handle_events` - does destroy `p.popup.fractional_scale` and `p.popup.viewport`, which proves the intent. `close_popups` is by far the hotter path (it runs on every popup dismissal, every autohide transition, `clear()`, `reset_overflow()`, `toggle_overflow_popup()`), so two compositor-side Wayland objects are leaked per popup open/close cycle for the lifetime of the process. The same leak applies to the overflow popup branch and to `clear()`, which just assigns `self.overflow_popup = None`.","fix":"Move the cleanup into `PanelPopup::drop` so every teardown path is covered, and delete the duplicated destroy calls from `PanelSpace::handle_events`:\n```rust\nimpl Drop for PanelPopup {\n    fn drop(&mut self) {\n        if let Some(v) = self.viewport.take() { v.destroy(); }\n        if let Some(f) = self.fractional_scale.take() { f.destroy(); }\n        if let Some(blur) = self.blur_surface.take() { blur.destroy(); }\n        if let Some(corners) = self.corner_radius.take() { corners.destroy(); }\n    }\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/space/popup.rs:13-52","code":"   13 |     pub(crate) fn close_popups(&mut self, exclude: impl Fn(&PanelPopup) -> bool) {\n   14 |         let mut to_destroy = Vec::with_capacity(self.popups.len());\n   15 |         self.popups.retain_mut(|p| {\n   16 |             if exclude(&p.popup) {\n   17 |                 return true;\n   18 |             }\n   19 | \n   20 |             tracing::info!(\"Closing popup: {:?}\", p.popup.c_popup.wl_surface());\n   21 |             p.s_surface.send_popup_done();\n   22 |             to_destroy.push((\n   23 |                 p.popup.c_popup.xdg_popup().clone(),\n   24 |                 p.popup.c_popup.wl_surface().clone(),\n   25 |                 Some(p.s_surface.wl_surface().clone()),\n   26 |             ));\n   27 |             false\n   28 |         });\n   29 |         if self.overflow_popup.as_ref().is_some_and(|(p, _)| !exclude(p)) {\n   30 |             let (popup, _) = self.overflow_popup.take().unwrap();\n   31 |             tracing::info!(\"Closing overflow popup: {:?}\", popup.c_popup.wl_surface());\n   32 |             to_destroy.push((\n   33 |                 popup.c_popup.xdg_popup().clone(),\n   34 |                 popup.c_popup.wl_surface().clone(),\n   35 |                 None,\n   36 |             ));\n   37 |         }\n   38 | \n   39 |         for (popup, surface, s_surface) in to_destroy {\n   40 |             self.shared.c_focused_surface.borrow_mut().retain(|s| s.0 != surface);\n   41 |             self.shared.c_hovered_surface.borrow_mut().retain(|s| s.0 != surface);\n   42 | \n   43 |             if let Some(s_surface) = s_surface {\n   44 |                 self.s_focused_surface\n   45 |                     .retain(|s| !s.0.wl_surface().is_some_and(|s| s.as_ref() == &s_surface));\n   46 |                 self.s_hovered_surface\n   47 |                     .retain(|s| !s.surface.wl_surface().is_some_and(|s| s.as_ref() == &s_surface));\n   48 |             }\n   49 |             popup.destroy();\n   50 |             surface.destroy();\n   51 |         }\n   52 |     }","lines":40,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/popup.rs#L13-L52"},{"ref":"cosmic-panel-bin/src/space/panel_space.rs:1600-1612","code":" 1600 |     /// clear the panel\n 1601 |     pub fn clear(&mut self) {\n 1602 |         self.is_dirty = true;\n 1603 |         self.needs_layout = true;\n 1604 |         self.close_popups(|_| false);\n 1605 |         self.overflow_popup = None;\n 1606 |         self.damage_tracked_renderer = Some(OutputDamageTracker::new(\n 1607 |             self.dimensions.to_f64().to_physical(self.scale).to_i32_round(),\n 1608 |             self.scale,\n 1609 |             smithay::utils::Transform::Flipped180,\n 1610 |         ));\n 1611 |         self.space.refresh();\n 1612 |     }","lines":13,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space/panel_space.rs#L1600-L1612"}]},
{"id":"MEM_6","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"`SpaceContainer::cleanup_client` is the handler for a restarted applet (`PanelCalloopMsg::ClientSocketPair` carries the\n*old* `ClientId`). It has two gaps:\n1. it uses `.find(...)` and unmaps at most **one** window per space, so a client that mapped more than one toplevel\n   leaves dead `Window` elements in `s.space` forever;\n2. it only looks at `s.space`, never at `s.overflow_left` / `s.overflow_center` / `s.overflow_right`. Applets that\n   have overflowed live in those spaces, so a restart of an overflowed applet leaves a `Window` wrapping a dead\n   `wl_surface` in the overflow space, which is then still iterated by the layout and render code.","fix":"Collect *all* matching elements and clean the overflow spaces too:\n\n```rust\nlet dead: Vec<_> = s.space.elements()\n    .filter(|w| w.toplevel().is_some_and(|t| t.wl_surface().client().map(|c| c.id()).as_ref() == Some(&old_client_id)))\n    .cloned()\n    .collect();\nfor w in &dead { s.space.unmap_elem(w); }\nfor space in [&mut s.overflow_left, &mut s.overflow_center, &mut s.overflow_right] {\n    let dead: Vec<_> = space.elements().filter(/* same predicate */).cloned().collect();\n    for w in &dead { space.unmap_elem(w); }\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/space_container/space_container.rs:190-222","code":"  190 |     pub fn cleanup_client(&mut self, old_client_id: ClientId) {\n  191 |         for s in &mut self.space_list {\n  192 |             // cleanup leftover windows\n  193 |             let w = {\n  194 |                 s.space\n  195 |                     .elements()\n  196 |                     .find(|w| {\n  197 |                         w.toplevel().is_some_and(|t| {\n  198 |                             t.wl_surface().client().map(|c| c.id()).as_ref() == Some(&old_client_id)\n  199 |                         })\n  200 |                     })\n  201 |                     .cloned()\n  202 |             };\n  203 |             let mut found_window = false;\n  204 |             if let Some(w) = w {\n  205 |                 s.space.unmap_elem(&w);\n  206 |                 found_window = true;\n  207 |             }\n  208 |             let len = s.popups.len();\n  209 |             // TODO handle cleanup of nested popups\n  210 |             s.popups.retain(|p| {\n  211 |                 let Some(client) = p.s_surface.wl_surface().client() else {\n  212 |                     return false;\n  213 |                 };\n  214 |                 client.id() != old_client_id\n  215 |             });\n  216 |             if found_window || len != s.popups.len() {\n  217 |                 s.is_dirty = true;\n  218 |                 s.needs_layout = true;\n  219 |                 break;\n  220 |             }\n  221 |         }\n  222 |     }","lines":33,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space_container/space_container.rs#L190-L222"}]},
{"id":"MEM_7","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"`SpaceContainer::output_leave` only drops the output tuple and the panel spaces bound to it. It never\n- unmaps the `Output` from the `smithay::desktop::Space` of the remaining panels (they were all given the output by\n  `new_output`, see the related finding), so every unplugged monitor stays referenced inside every panel's space;\n- removes the entry for that output from `self.minimized_applets` (a `HashMap<String /* output name */, MinimizeApplet>`\n  that is only ever inserted into, in `minimize.rs:52`).\n\nOver repeated hotplug cycles (docking, DPMS/monitor re-enumeration) both collections grow without bound and hold on to\ndead `WlOutput`/`Output` objects; stale `minimized_applets` entries can also be matched later by\n`minimize::update_toplevel` for a re-plugged monitor with the same name.","fix":"Clean up all state keyed by the output:\n\n```rust\nfn output_leave(&mut self, c_output: WlOutput, s_output: Output) -> anyhow::Result<()> {\n    self.outputs.retain(|o| o.0 != c_output);\n    self.space_list.retain(|s| s.output.as_ref().map(|o| &o.0) != Some(&c_output));\n    self.minimized_applets.remove(&s_output.name());\n    for s in &mut self.space_list {\n        s.space.unmap_output(&s_output);\n    }\n    Ok(())\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/space_container/wrapper_space.rs:767-775","code":"  767 |     fn output_leave(\n  768 |         &mut self,\n  769 |         c_output: sctk::reexports::client::protocol::wl_output::WlOutput,\n  770 |         _s_output: Output,\n  771 |     ) -> anyhow::Result<()> {\n  772 |         self.outputs.retain(|o| o.0 != c_output);\n  773 |         self.space_list.retain(|s| s.output.as_ref().map(|o| &o.0) != Some(&c_output));\n  774 |         Ok(())\n  775 |     }","lines":9,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/space_container/wrapper_space.rs#L767-L775"}]},
{"id":"MEM_8","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"`LayerShellHandler::closed` removes the tuple from `client_state.proxied_layer_surfaces` and relies on `Drop` to release everything. Only `EGLSurface` and sctk's `LayerSurface` have a `Drop` impl; the tuple also holds `Option<WpFractionalScaleV1>`, `Option<WpViewport>`, `Option<CosmicCornerRadiusLayerV1>` and `Option<ExtBackgroundEffectSurfaceV1>` (the last two are even marked `// TODO destroy on drop` in `client/state.rs:181-192`). Those are bare proxies: dropping the Rust handle does not send a `destroy` request, so up to four server-side protocol objects leak for every proxied layer surface that is closed. In addition the server-side `SmithayLayerSurface` (tuple field `.2`) is not sent `send_close()`, so the wrapped client is never told its layer surface went away and keeps the surface alive forever.","fix":"Destroy the auxiliary objects and notify the inner client before dropping the entry:\n```rust\nlet (_egl, _dmg, s_layer, _c_layer, _state, _scale, frac, vp, corner, blur) =\n    self.client_state.proxied_layer_surfaces.remove(i);\nif let Some(f) = frac { f.destroy(); }\nif let Some(v) = vp { v.destroy(); }\nif let Some(c) = corner { c.destroy(); }\nif let Some(b) = blur { b.destroy(); }\ns_layer.layer_surface().send_close();\n```\nBetter still, wrap the tuple in a struct whose `Drop` performs this (as `CornerRadiusWrapper` already does).","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/layer_shell.rs:12-28","code":"   12 |     fn closed(\n   13 |         &mut self,\n   14 |         _conn: &sctk::reexports::client::Connection,\n   15 |         _qh: &sctk::reexports::client::QueueHandle<Self>,\n   16 |         layer: &LayerSurface,\n   17 |     ) {\n   18 |         if let Some(i) = self\n   19 |             .client_state\n   20 |             .proxied_layer_surfaces\n   21 |             .iter()\n   22 |             .position(|(_, _, _, s, ..)| s.wl_surface() == layer.wl_surface())\n   23 |         {\n   24 |             self.client_state.proxied_layer_surfaces.remove(i);\n   25 |         } else {\n   26 |             self.space.close_layer(layer);\n   27 |         }\n   28 |     }","lines":17,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/layer_shell.rs#L12-L28"}]},
{"id":"MEM_9","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"`OutputHandler::update_output` creates a brand new smithay `Output` **and a new server global** with `c_output_as_s_output(display_handle, &info)` when `space.update_output(..)` returns `Ok(false)`, then hands it to `space.new_output(..)`. The newly created `(Output, GlobalId)` pair is never stored in `client_state.outputs` (the stale entry found at line 108 is left untouched) and the previous global is never removed. Consequences: (a) one extra `wl_output` global is advertised to the wrapped clients on every such update, (b) `client_state.outputs` and the space now reference two *different* smithay `Output` objects for the same physical monitor, so `output_destroyed` later removes/leaves the wrong one.","fix":"Reuse `saved_output.1.clone()` (and its existing `GlobalId`) instead of building a second `Output`; if a new one really is needed, `remove_global` the old id and replace the entry in `client_state.outputs` with the new `(output, s_output, global)` tuple.","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/output.rs:107-130","code":"  107 |         if configured_outputs.iter().any(|configured| Some(configured) == info.name.as_ref())\n  108 |             && let Some(saved_output) = self.client_state.outputs.iter_mut().find(|o| o.0 == output)\n  109 |         {\n  110 |             let res = space.update_output(output.clone(), saved_output.1.clone(), info.clone());\n  111 |             if let Err(err) = res {\n  112 |                 error!(\"{}\", err);\n  113 |             } else if matches!(res, Ok(false)) {\n  114 |                 let s_output = c_output_as_s_output(display_handle, &info);\n  115 | \n  116 |                 if let Err(err) = space.new_output(\n  117 |                     compositor_state,\n  118 |                     fractional_scaling_manager.as_ref(),\n  119 |                     viewporter_state.as_ref(),\n  120 |                     layer_state,\n  121 |                     conn,\n  122 |                     qh,\n  123 |                     Some(output),\n  124 |                     Some(s_output.0),\n  125 |                     Some(info),\n  126 |                 ) {\n  127 |                     warn!(\"{}\", err);\n  128 |                 }\n  129 |             }\n  130 |         }","lines":24,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/output.rs#L107-L130"}]},
{"id":"MEM_10","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"`OutputHandler::output_destroyed` removes the `(WlOutput, Output, GlobalId)` entry from `client_state.outputs` and drops the `GlobalId`. Dropping a `GlobalId` does **not** remove the global from the server display - `DisplayHandle::remove_global` must be called explicitly (there is no `remove_global` call anywhere in the code base). Every monitor unplug therefore leaves a dead `wl_output` global advertised to all wrapped applet clients, which keep binding to an output that no longer exists, and the associated smithay `Output` state is never freed.","fix":"Remove the global when the output goes away:\n```rust\nlet (c, s, global) = self.client_state.outputs.remove(saved_output);\nself.server_state.display_handle.remove_global::<GlobalState>(global);\nif let Err(err) = space.output_leave(c, s) { warn!(\"{}\", err); }\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/output.rs:155-163","code":"  155 |         if configured_outputs.iter().any(|configured| Some(configured) == info.name.as_ref())\n  156 |             && let Some(saved_output) = self.client_state.outputs.iter().position(|o| o.0 == output)\n  157 |         {\n  158 |             let (c, s, _) = self.client_state.outputs.remove(saved_output);\n  159 |             if let Err(err) = space.output_leave(c, s) {\n  160 |                 warn!(\"{}\", err);\n  161 |             }\n  162 |         }\n  163 |     }","lines":9,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/output.rs#L155-L163"}]},
{"id":"MEM_11","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"Client-side seat devices are never released. `wayland-client` proxies such as `WlKeyboard`, `WlTouch` and the `wl_pointer` inside `sctk`'s `ThemedPointer` have no `Drop` impl (unlike `DataDevice`), so: (1) `sp.client.kbd.replace(kbd)` / `ptr.replace(ptr)` / `touch.replace(touch)` in `new_capability` silently leak the previous object plus, for the pointer, the freshly created cursor `wl_surface` from `compositor_state.create_surface(qh)`; (2) `remove_seat` `swap_remove`s the `SeatPair` and drops the whole `ClientSeat` without calling `release()` on keyboard/pointer/touch. Repeated seat or capability hot-plug therefore grows the compositor's object table without bound.","fix":"Release the old objects before replacing, and on seat removal, e.g.\n```rust\nif let Some(old) = sp.client.kbd.replace(kbd) { old.release(); }\n```\nand in `remove_seat` destructure the removed `SeatPair` and call `release()` on `kbd`, on `ptr.pointer()` and its `surface()`, and on `touch`. Also handle `Capability::Touch` in `remove_capability` instead of leaving the `// TODO` no-op, which currently keeps a dead `WlTouch` in `sp.client.touch`.","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/seat.rs:149-181","code":"  149 |         match capability {\n  150 |             sctk::seat::Capability::Keyboard => {\n  151 |                 if info.has_keyboard {\n  152 |                     sp.server.seat.add_keyboard(Default::default(), 200, 20).unwrap();\n  153 |                     if let Ok(kbd) = self.client_state.seat_state.get_keyboard(qh, &seat, None) {\n  154 |                         sp.client.kbd.replace(kbd);\n  155 |                     }\n  156 |                 }\n  157 |             },\n  158 |             sctk::seat::Capability::Pointer => {\n  159 |                 if info.has_pointer {\n  160 |                     sp.server.seat.add_pointer();\n  161 |                     if let Ok(ptr) = self.client_state.seat_state.get_pointer_with_theme(\n  162 |                         qh,\n  163 |                         &seat,\n  164 |                         self.client_state.shm_state.wl_shm(),\n  165 |                         self.client_state.compositor_state.create_surface(qh),\n  166 |                         ThemeSpec::System,\n  167 |                     ) {\n  168 |                         sp.client.ptr.replace(ptr);\n  169 |                     }\n  170 |                 }\n  171 |             },\n  172 |             sctk::seat::Capability::Touch => {\n  173 |                 if info.has_touch {\n  174 |                     sp.server.seat.add_touch();\n  175 |                     if let Ok(touch) = self.client_state.seat_state.get_touch(qh, &seat) {\n  176 |                         sp.client.touch.replace(touch);\n  177 |                     }\n  178 |                 }\n  179 |             },\n  180 |             _ => unimplemented!(),\n  181 |         }","lines":33,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/seat.rs#L149-L181"},{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/seat.rs:210-218","code":"  210 |     fn remove_seat(&mut self, _conn: &Connection, _qh: &QueueHandle<Self>, seat: wl_seat::WlSeat) {\n  211 |         let _ = if let Some(sp_i) =\n  212 |             self.server_state.seats.iter().position(|sp| sp.client._seat == seat)\n  213 |         {\n  214 |             self.server_state.seats.swap_remove(sp_i)\n  215 |         } else {\n  216 |             return;\n  217 |         };\n  218 |     }","lines":9,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/handlers/seat.rs#L210-L218"}]},
{"id":"MEM_12","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"Both corner-radius `Destroy` handlers clear the stored `Option<(HookId, Weak<..>)>` (`*hook_id = None`) but never call `smithay::wayland::compositor::remove_pre_commit_hook`. The pre-commit hook stays registered on the `wl_surface` and keeps running on every commit, and since its `HookId` has been dropped it can never be removed afterwards. Worse, because the \"already installed?\" probe keys off that now-`None` slot, the next `get_corner_radius*` request for the same surface installs *another* hook, so a client that repeatedly creates and destroys corner-radius objects accumulates unbounded per-commit hooks (O(n) work on every single commit of that surface).","fix":"Take the `HookId` out of the slot and unregister the hook, e.g.\n```rust\nif let Some(hook_ids_mutex) = surface_data.data_map.get::<ToplevelHookId>()\n    && let Some((hook_id, _)) = hook_ids_mutex.lock().unwrap().take()\n{\n    remove_pre_commit_hook(surface_data, hook_id);\n}\n```\n(do the same with `LayerHookId` in the layer handler).","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/cosmic_corner_radius.rs:303-312","code":"  303 |                 with_states(&wl_surface, |surface_data| {\n  304 |                     if let Some(hook_ids_mutex) = surface_data.data_map.get::<ToplevelHookId>() {\n  305 |                         let mut hook_id = hook_ids_mutex.lock().unwrap();\n  306 |                         *hook_id = None;\n  307 |                     }\n  308 | \n  309 |                     let mut cached = surface_data.cached_state.get::<CacheableCorners>();\n  310 |                     let pending = cached.pending();\n  311 |                     *pending = CacheableCorners(None);\n  312 |                 });","lines":10,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/cosmic_corner_radius.rs#L303-L312"},{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/cosmic_corner_radius.rs:423-436","code":"  423 |                 with_states(layer_surface.wl_surface(), |surface_data| {\n  424 |                     if let Some(hook_ids_mutex) = surface_data.data_map.get::<LayerHookId>() {\n  425 |                         let mut hook_id = hook_ids_mutex.lock().unwrap();\n  426 |                         *hook_id = None;\n  427 |                     }\n  428 | \n  429 |                     let mut cached = surface_data.cached_state.get::<CacheableCorners>();\n  430 |                     let pending = cached.pending();\n  431 |                     *pending = CacheableCorners(None);\n  432 | \n  433 |                     let mut cached = surface_data.cached_state.get::<CacheablePadding>();\n  434 |                     let pending = cached.pending();\n  435 |                     *pending = CacheablePadding(None);\n  436 |                 });","lines":14,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/cosmic_corner_radius.rs#L423-L436"}]},
{"id":"MEM_13","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"`WlrLayerShellHandler::layer_destroyed` removes the tuple from `proxied_layer_surfaces` with `retain`, which merely *drops* the contained Wayland proxies. Plain `wayland-client` proxies have no `Drop` impl, so `WpFractionalScaleV1` (field 6), `WpViewport` (field 7), `CosmicCornerRadiusLayerV1` (field 8) and `ExtBackgroundEffectSurfaceV1` (field 9) are never destroyed and leak server-side objects for the lifetime of the panel. The struct definition even carries `// TODO destroy on drop` comments on two of these fields.","fix":"Extract the entry instead of dropping it and destroy every proxy, e.g.\n```rust\nif let Some(i) = self.client_state.proxied_layer_surfaces\n    .iter().position(|s| s.2.wl_surface() == surface.wl_surface())\n{\n    let (_, _, _, _, _, _, scale, viewport, corner, blur) =\n        self.client_state.proxied_layer_surfaces.remove(i);\n    if let Some(s) = scale { s.destroy(); }\n    if let Some(v) = viewport { v.destroy(); }\n    if let Some(c) = corner { c.destroy(); }\n    if let Some(b) = blur { b.destroy(); }\n}\n```\nBetter still, replace the 10-tuple with a named struct that implements `Drop`.","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/layer.rs:22-27","code":"   22 |     fn layer_destroyed(&mut self, surface: smithay::wayland::shell::wlr_layer::LayerSurface) {\n   23 |         // cleanup proxied surfaces\n   24 |         self.client_state\n   25 |             .proxied_layer_surfaces\n   26 |             .retain(|s| s.2.wl_surface() != surface.wl_surface());\n   27 |     }","lines":6,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/layer.rs#L22-L27"},{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/client/state.rs:186-192","code":"  186 |         SurfaceState,\n  187 |         f64,\n  188 |         Option<WpFractionalScaleV1>,\n  189 |         Option<WpViewport>,\n  190 |         Option<CosmicCornerRadiusLayerV1>, // TODO destroy on drop\n  191 |         Option<ExtBackgroundEffectSurfaceV1>, // TODO destroy on drop\n  192 |     )>,","lines":7,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/client/state.rs#L186-L192"}]},
{"id":"MEM_14","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"`dnd_requested` creates a fresh client `wl_surface` for the drag icon via\n`self.client_state.compositor_state.create_surface(...)`. `CompositorState::create_surface` returns a raw\n`wl_surface::WlSurface` proxy (not sctk's RAII `Surface` wrapper), and wayland-client proxies do **not** send a\ndestroy request when dropped. `DndGrabHandler::dropped` simply does `seat.client.dnd_icon = None;`, so the\n`DndIcon` - and with it the `WlSurface` proxy - is dropped without ever calling `.destroy()`. Every drag-and-drop\noperation therefore leaks one `wl_surface` object (plus its `wl_egl_surface`/buffers) in the host compositor for\nthe lifetime of the panel process.","fix":"Destroy the client surface when the icon goes away, e.g. in `dropped`:\n```rust\nif let Some(icon) = seat.client.dnd_icon.take() {\n    drop(icon.egl_surface);\n    icon.surface.destroy();\n}\n```\nor, better, give `DndIcon` a `Drop` impl that destroys `surface` after `egl_surface` has been dropped.","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/mod.rs:292-319","code":"  292 |                 let c_icon_surface = icon.as_ref().map(|_| {\n  293 |                     self.client_state\n  294 |                         .compositor_state\n  295 |                         .create_surface(&self.client_state.queue_handle)\n  296 |                 });\n  297 | \n  298 |                 dnd_source.start_drag(\n  299 |                     &seat.client.data_device,\n  300 |                     &focus.0,\n  301 |                     c_icon_surface.as_ref(),\n  302 |                     seat.client.get_serial_of_last_seat_event(),\n  303 |                 );\n  304 |                 if let Some(client_surface) = c_icon_surface.as_ref() {\n  305 |                     client_surface.frame(&self.client_state.queue_handle, client_surface.clone());\n  306 |                     client_surface.commit();\n  307 | \n  308 |                     seat.client.dnd_icon = Some(DndIcon {\n  309 |                         surface: client_surface.clone(),\n  310 |                         egl_surface: None,\n  311 |                         output_tracker: OutputDamageTracker::new(\n  312 |                             (32, 32),\n  313 |                             self.space.space_list[0].scale,\n  314 |                             Transform::Flipped180,\n  315 |                         ),\n  316 |                         is_ready: false,\n  317 |                         has_frame: false,\n  318 |                     });\n  319 |                 }","lines":28,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/mod.rs#L292-L319"},{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/mod.rs:233-251","code":"  233 | impl DndGrabHandler for GlobalState {\n  234 |     fn dropped(\n  235 |         &mut self,\n  236 |         _: Option<DndTarget<'_, Self>>,\n  237 |         _: bool,\n  238 |         seat: Seat<Self>,\n  239 |         _location: Point<f64, Logical>,\n  240 |     ) {\n  241 |         let seat = match self.server_state.seats.iter_mut().find(|s| s.server.seat == seat) {\n  242 |             Some(s) => s,\n  243 |             None => return,\n  244 |         };\n  245 |         // XXX is this correct?\n  246 |         seat.server.dnd_source = None;\n  247 |         seat.server.dnd_icon = None;\n  248 |         seat.client.dnd_icon = None;\n  249 |         seat.client.dnd_source = None;\n  250 |     }\n  251 | }","lines":19,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/server/handlers/mod.rs#L233-L251"}]},
{"id":"MEM_15","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"`Drop for PanelPopup` destroys `blur_surface` and `corner_radius` but not `viewport: Option<WpViewport>` or\n`fractional_scale: Option<WpFractionalScaleV1>`. Those two are raw wayland-client proxies with no `Drop`\nbehaviour. Destruction of them is only performed at one call site\n(`space/panel_space.rs:1311-1317`, the `handle_events`-returned-false path); every other path that drops a\n`WrapperPopup` - notably `PanelSpace::close_popups` in `space/popup.rs`, which is what runs when a popup is\ndismissed by clicking away or by `close_popup` - leaks one `wp_viewport` and one `wp_fractional_scale_v1` per\npopup. Opening and dismissing applet popups repeatedly grows the compositor's object table without bound.","fix":"Move the destruction into the `Drop` impl so every path is covered, and delete the now-redundant destroy calls in\n`space/panel_space.rs`:\n```rust\nimpl Drop for PanelPopup {\n    fn drop(&mut self) {\n        if let Some(blur) = self.blur_surface.take() { blur.destroy(); }\n        if let Some(corners) = self.corner_radius.take() { corners.destroy(); }\n        if let Some(vp) = self.viewport.take() { vp.destroy(); }\n        if let Some(fs) = self.fractional_scale.take() { fs.destroy(); }\n    }\n}\n```","locations":[{"ref":"cosmic-panel-bin/src/xdg_shell_wrapper/space/popup.rs:47-56","code":"   47 | impl Drop for PanelPopup {\n   48 |     fn drop(&mut self) {\n   49 |         if let Some(blur) = self.blur_surface.take() {\n   50 |             blur.destroy();\n   51 |         }\n   52 |         if let Some(corners) = self.corner_radius.take() {\n   53 |             corners.destroy();\n   54 |         }\n   55 |     }\n   56 | }","lines":10,"link":"https://github.com/pop-os/cosmic-panel/blob/f664a34c788f09689be9efa88e41040d7e6361f1/cosmic-panel-bin/src/xdg_shell_wrapper/space/popup.rs#L47-L56"}]},
