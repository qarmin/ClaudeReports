<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>
<body>
<script type="application/json" id="D">[{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"critical","difficulty":"very_easy","description":"`premultiply_luma_alpha_f32` in `src/alpha.rs` iterates with `in_place.chunks_exact_mut(2)`, so each `chunk` has exactly 2 valid indices (0 and 1), yet the loop body writes `chunk[2] = a;`. This is an out-of-bounds index that panics on every call where the input is non-empty (verified empirically: `thread 'main' panicked at ...: index out of bounds: the len is 2 but the index is 2`). Since this is a `pub fn` re-exported from `lib.rs` via `pub use alpha::*;`, any external caller of the public API for luma-alpha f32 premultiplication will crash immediately, which directly contradicts the crate's \"safe\" scaling premise. The equivalent `unpremultiply_luma_alpha_f32` (same file) correctly uses only indices 0 and 1, confirming this is a copy-paste mistake from the 4-channel RGBA version (`chunk[3] = a`) that wasn't adjusted for the 2-channel stride.","fix":"Remove the out-of-bounds write, since `chunk[1]` already holds the alpha value: replace the body with just `let a = chunk[1] as f32; chunk[0] *= a;` (drop the `chunk[2] = a;` line entirely), mirroring the correct pattern already used in `unpremultiply_luma_alpha_f32`.","locations":[{"ref":"src/alpha.rs:467-471","code":"  467 |     for chunk in in_place.chunks_exact_mut(2) {\n  468 |         let a = chunk[1];\n  469 |         chunk[0] *= a;\n  470 |         chunk[2] = a;\n  471 |     }","lines":5,"link":"https://github.com/awxkee/pic-scale-safe/blob/83c4801428c436678d7c6b6bea74af800924a469/src/alpha.rs#L467-L471"}]},{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"critical","difficulty":"very_easy","description":"`premultiplied_luma_alpha_f32` in `src/alpha.rs` zips `target.chunks_exact_mut(2)` with `source.chunks_exact(2)`, so `src` has only indices 0 and 1, but the loop reads `let a = src[2];`. This is an out-of-bounds slice index that panics on every non-empty input (confirmed by direct reproduction). This is the same copy-paste bug as in `premultiply_luma_alpha_f32`, carried over from the RGBA version's `src[3]`, and it makes the public `premultiplied_luma_alpha_f32` function (re-exported via `pub use alpha::*;` in `src/lib.rs`) unusable for any real data.","fix":"Read alpha from `src[1]` instead of `src[2]`: `let a = src[1]; dst[0] = src[0] * a; dst[1] = a;`.","locations":[{"ref":"src/alpha.rs:487-491","code":"  487 |     for (dst, src) in target.chunks_exact_mut(2).zip(source.chunks_exact(2)) {\n  488 |         let a = src[2];\n  489 |         dst[0] = src[0] * a;\n  490 |         dst[1] = a;\n  491 |     }","lines":5,"link":"https://github.com/awxkee/pic-scale-safe/blob/83c4801428c436678d7c6b6bea74af800924a469/src/alpha.rs#L487-L491"}]},{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`has_non_constant_alpha` and `has_non_constant_alpha_f32_impl` in `src/alpha_check.rs` only guard against an empty `store` (`if store.is_empty() { return false; }`) before calling `store.chunks_exact(width * CHANNELS)`. `Slice::chunks_exact` panics if the chunk size is zero. If `width == 0` while `store` is non-empty (a plausible mismatch when a caller passes an `ImageSize`/width parameter that does not agree with the actual buffer length, e.g. a zero-width image whose buffer wasn't correspondingly truncated), `width * CHANNELS` is `0` and the call panics with `chunk size must be non-zero` (verified by direct reproduction of the same pattern). This directly affects the \"zero-sized image\" edge case the alpha-detection helpers are supposed to handle gracefully.","fix":"Add an explicit `if width == 0 { return false; }` guard (in addition to the existing `store.is_empty()` check) before calling `chunks_exact` in both `has_non_constant_alpha` and `has_non_constant_alpha_f32_impl`.","locations":[{"ref":"src/alpha_check.rs:126-138","code":"  126 |     if store.is_empty() {\n  127 |         return false;\n  128 |     }\n  129 |     let first = store[0];\n  130 |     let mut row_sums: J = 0u32.as_();\n  131 |     for row in store.chunks_exact(width * CHANNELS) {\n  132 |         for color in row.chunks_exact(CHANNELS) {\n  133 |             row_sums += color[ALPHA_CHANNEL_INDEX].bitxor(first).as_();\n  134 |         }\n  135 |         if row_sums != 0.as_() {\n  136 |             return true;\n  137 |         }\n  138 |     }","lines":13,"link":"https://github.com/awxkee/pic-scale-safe/blob/83c4801428c436678d7c6b6bea74af800924a469/src/alpha_check.rs#L126-L138"},{"ref":"src/alpha_check.rs:150-164","code":"  150 |     assert!(ALPHA_CHANNEL_INDEX < CHANNELS);\n  151 |     assert!(CHANNELS > 0 && CHANNELS <= 4);\n  152 |     if store.is_empty() {\n  153 |         return false;\n  154 |     }\n  155 |     let first = store[0].to_bits();\n  156 |     let mut row_sums: u64 = 0u64;\n  157 |     for row in store.chunks_exact(width * CHANNELS) {\n  158 |         for color in row.chunks_exact(CHANNELS) {\n  159 |             row_sums += color[ALPHA_CHANNEL_INDEX].to_bits().bitxor(first) as u64;\n  160 |         }\n  161 |         if row_sums != 0 {\n  162 |             return true;\n  163 |         }\n  164 |     }","lines":15,"link":"https://github.com/awxkee/pic-scale-safe/blob/83c4801428c436678d7c6b6bea74af800924a469/src/alpha_check.rs#L150-L164"}]},{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In `resize_fixed_point` the input-size validation at `if src.len() != source_size.width * CHANNELS * source_size.height` computes `source_size.width * CHANNELS * source_size.height` with plain (unchecked) `usize` multiplication, both in the condition and again inside the `format!` for the error message. Immediately below, the same function goes out of its way to compute `source_size.width.overflowing_mul(CHANNELS)` and further `overflowing_mul` checks specifically to avoid a `usize` overflow panic. Because the very first multiplication is not overflow-checked, a crafted `source_size` whose `width * CHANNELS * height` exceeds `usize::MAX` triggers Rust's debug-mode 'attempt to multiply with overflow' panic before the code ever reaches the `overflowing_mul` guards that were added to prevent exactly this. The identical pattern exists in `resize_floating_point`.","fix":"Compute the expected length with `checked_mul`/`overflowing_mul` (reusing the same helper as the later `src_stride`/`dst_stride` checks) before comparing against `src.len()`, e.g. `let expected = source_size.width.checked_mul(CHANNELS).and_then(|v| v.checked_mul(source_size.height)); if expected != Some(src.len()) { return Err(...); }`, so an overflow is reported as an `Err` instead of panicking.","locations":[{"ref":"src/resize_fixed_point.rs:89-95","code":"   89 |     if src.len() != source_size.width * CHANNELS * source_size.height {\n   90 |         return Err(format!(\n   91 |             \"Source slice size must be width * channels * height ({}) but got {}\",\n   92 |             source_size.width * CHANNELS * source_size.height,\n   93 |             src.len(),\n   94 |         ));\n   95 |     }","lines":7,"link":"https://github.com/awxkee/pic-scale-safe/blob/83c4801428c436678d7c6b6bea74af800924a469/src/resize_fixed_point.rs#L89-L95"},{"ref":"src/resize_floating_point.rs:109-115","code":"  109 |     if src.len() != source_size.width * CHANNELS * source_size.height {\n  110 |         return Err(format!(\n  111 |             \"Source slice size must be width * channels * height ({}) but got {}\",\n  112 |             source_size.width * CHANNELS * source_size.height,\n  113 |             src.len(),\n  114 |         ));\n  115 |     }","lines":7,"link":"https://github.com/awxkee/pic-scale-safe/blob/83c4801428c436678d7c6b6bea74af800924a469/src/resize_floating_point.rs#L109-L115"}]},{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"`div_by_2pn_m1(v, n)` in `src/alpha.rs` computes `let round = 1 << (n - 1); let v = v + round; (((v >> n) + v) >> n) as u16`, entirely in `u32`. It is called from `premultiply_rgba16`/`premultiplied_rgba16`/`premultiply_la16`/`premultiplied_la16` with `v = chunk[i] as u32 * a` where `chunk[i]` and `a` are raw `u16` values taken directly from the caller-supplied slice, without ever checking that those values actually fit within `(1 << bit_depth) - 1`. If the slice contains values outside the declared `bit_depth`'s range (e.g. `bit_depth = 1` or `10` but the buffer holds full-range `u16` data, which can happen with mismatched/corrupted bit-depth metadata from an untrusted image), the intermediate `v + round` and `(v >> n) + v` additions overflow `u32`. This was verified directly: with `px = a = 65535` and `n = 1`, `div_by_2pn_m1` panics with `attempt to add with overflow` under debug assertions, and silently produces a wildly wrong result (`32769` instead of a value near `65535`) in release mode. Conforming data (values that actually respect `bit_depth`) never triggers this, but nothing in `premultiply_rgba16`/`premultiply_la16` enforces that precondition on the public API.","fix":"Either clamp/mask each component to `max_colors` before multiplying (`let v = (chunk[i] as u32).min(max_colors) as u32 * a.min(max_colors);`), or perform the multiply-and-round in a wider integer type (`u64`) inside `div_by_2pn_m1` so the intermediate additions cannot overflow regardless of the input's actual range, then narrow the final result back to `u16`.","locations":[{"ref":"src/alpha.rs:176-183","code":"  176 | /// Computes `round(v / (2**n - 1))`. The result is expected to fit in u16.\n  177 | #[inline(always)]\n  178 | fn div_by_2pn_m1(v: u32, n: u32) -> u16 {\n  179 |     debug_assert!(n > 0 && n <= 16);\n  180 |     let round = 1 << (n - 1);\n  181 |     let v = v + round;\n  182 |     (((v >> n) + v) >> n) as u16\n  183 | }","lines":8,"link":"https://github.com/awxkee/pic-scale-safe/blob/83c4801428c436678d7c6b6bea74af800924a469/src/alpha.rs#L176-L183"},{"ref":"src/alpha.rs:209-247","code":"  209 | pub fn premultiply_rgba16(in_place: &mut [u16], bit_depth: u32) {\n  210 |     // Almost all loops are not auto-vectorised without doing anything dirty.\n  211 |     // So everywhere is just added something beautiful.\n  212 |     assert!(bit_depth > 0 && bit_depth <= 16);\n  213 |     let max_colors = (1 << bit_depth) - 1;\n  214 |     if bit_depth == 10 {\n  215 |         for chunk in in_place.chunks_exact_mut(4) {\n  216 |             let a = chunk[3] as u32;\n  217 |             chunk[0] = div_by_1023(chunk[0] as u32 * a);\n  218 |             chunk[1] = div_by_1023(chunk[1] as u32 * a);\n  219 |             chunk[2] = div_by_1023(chunk[2] as u32 * a);\n  220 |             chunk[3] = div_by_1023(1023 * a);\n  221 |         }\n  222 |     } else if bit_depth == 12 {\n  223 |         for chunk in in_place.chunks_exact_mut(4) {\n  224 |             let a = chunk[3] as u32;\n  225 |             chunk[0] = div_by_4095(chunk[0] as u32 * a);\n  226 |             chunk[1] = div_by_4095(chunk[1] as u32 * a);\n  227 |             chunk[2] = div_by_4095(chunk[2] as u32 * a);\n  228 |             chunk[3] = div_by_4095(4095 * a);\n  229 |         }\n  230 |     } else if bit_depth == 16 {\n  231 |         for chunk in in_place.chunks_exact_mut(4) {\n  232 |             let a = chunk[3] as u32;\n  233 |             chunk[0] = div_by_65535(chunk[0] as u32 * a);\n  234 |             chunk[1] = div_by_65535(chunk[1] as u32 * a);\n  235 |             chunk[2] = div_by_65535(chunk[2] as u32 * a);\n  236 |             chunk[3] = div_by_65535(65535 * a);\n  237 |         }\n  238 |     } else {\n  239 |         for chunk in in_place.chunks_exact_mut(4) {\n  240 |             let a = chunk[3] as u32;\n  241 |             chunk[0] = div_by_2pn_m1(chunk[0] as u32 * a, bit_depth);\n  242 |             chunk[1] = div_by_2pn_m1(chunk[1] as u32 * a,  in `resizer.rs`.","locations":[{"ref":"src/resize_fixed_point.rs:41-46","code":"   41 | /// Resizing using integral approximations\n   42 | ///\n   43 | /// Implemented only for [u8, i32], [u8, i64], [u16, i32], [u16, i64].\n   44 | /// For `u16` it slower using approximation for 16 bit-depth image rather than `f32` accumulator\n   45 | /// without SIMD. This is might be faster only for [u16, i32] for 10, 12 bit-depth\n   46 | ///","lines":6,"link":"https://github.com/awxkee/pic-scale-safe/blob/83c4801428c436678d7c6b6bea74af800924a469/src/resize_fixed_point.rs#L41-L46"},{"ref":"src/fixed_point_horizontal.rs:57-86","code":"   57 |     for ((chunk, &bounds), weights) in dst\n   58 |         .chunks_exact_mut(CHANNELS)\n   59 |         .zip(filter_weights.bounds.iter())\n   60 |         .zip(\n   61 |             filter_weights\n   62 |                 .weights\n   63 |                 .chunks_exact(filter_weights.aligned_size),\n   64 |         )\n   65 |     {\n   66 |         let mut sums = ColorGroup::<CHANNELS, J>::dup(ROUNDING_CONST.as_());\n   67 | \n   68 |         let start_x = bounds.start;\n   69 |         let bounds_size = bounds.size;\n   70 | \n   71 |         let px = start_x * CHANNELS;\n   72 | \n   73 |         let src_ptr0 = &src[px..(px + bounds_size * CHANNELS)];\n   74 |         for (&k_weight, src) in weights[..bounds.size]\n   75 |             .iter()\n   76 |             .zip(src_ptr0.chunks_exact(CHANNELS))\n   77 |         {\n   78 |             let weight: J = k_weight.as_();\n   79 |             let new_px = load_color_group!(src, CHANNELS, J);\n   80 |             sums += new_px * weight;\n   81 |         }\n   82 | \n   83 |         let narrowed = sums.saturate_narrow(bit_depth);\n   84 |         store_color_group!(narrowed, chunk, CHANNELS);\n   85 |     }\n   86 | }","lines":30,"link":"https://github.com/awxkee/pic-scale-safe/blob/83c4801428c436678d7c6b6bea74af800924a469/src/fixed_point_horizontal.rs#L57-L86"},{"ref":"src/fixed_point_horizontal.rs:89-176","code":"   89 | pub(crate) fn convolve_row_handler_fixed_point_4<\n   90 |     T: Copy + 'static + AsPrimitive<J> + Default,\n   91 |     J: Copy\n   92 |         + 'static\n   93 |         + AsPrimitive<T>\n   94 |         + Mul<Output = J>\n   95 |         + AddAssign\n   96 |         + SaturateNarrow<T>\n   97 |         + Default\n   98 |         + Add<J, Output = J>,\n   99 |     const CHANNELS: usize,\n  100 | >(\n  101 |     src: &[T],\n  102 |     src_stride: usize,\n  103 |     dst: &mut [T],\n  104 |     dst_stride: usize,\n  105 |     filter_weights: &FilterWeights<i16>,\n  106 |     bit_depth: u32,\n  107 | ) where\n  108 |     i32: AsPrimitive<J>,\n  109 |     i16: AsPrimitive<J>,\n  110 | {\n  111 |     let (row0_ref, rest) = dst.split_at_mut(dst_stride);\n  112 |     let (row1_ref, rest) = rest.split_at_mut(dst_stride);\n  113 |     let (row2_ref, row3_ref) = rest.split_at_mut(dst_stride);\n  114 | \n  115 |     let iter_row0 = row0_ref.chunks_exact_mut(CHANNELS);\n  116 |     let iter_row1 = row1_ref.chunks_exact_mut(CHANNELS);\n  117 |     let iter_row2 = row2_ref.chunks_exact_mut(CHANNELS);\n  118 |     let iter_row3 = row3_ref.chunks_exact_mut(CHANNELS);\n  119 | \n  120 |     for (((((chunk0, chunk1), chunk2), chunk3), &bounds), weights) in iter_row0\n  121 |         .zip(iter_row1)\n  122 |         .zip(iter_row2)\n  123 |         .zip(iter_row3)\n  124 |         .zip(filter_weights.bounds.iter())\n  125 |         .zip(\n  126 |             filter_weights\n  127 |                 .weights\n  128 |                 .chunks_exact(filter_weights.aligned_size),\n  129 |         )\n  130 |     {\n  131 |         let mut sums0 = ColorGroup::<CHANNELS, J>::dup(ROUNDING_CONST.as_());\n  132 |         let mut sums1 = ColorGroup::<CHANNELS, J>::dup(ROUNDING_CONST.as_());\n  133 |         let mut sums2 = ColorGroup::<CHANNELS, J>::dup(ROUNDING_CONST.as_());\n  134 |         let mut sums3 = ColorGroup::<CHANNELS, J>::dup(ROUNDING_CONST.as  CHANNELS);\n  174 |         store_color_group!(narrowed3, chunk3, CHANNELS);\n  175 |     }\n  176 | }","lines":88,"link":"https://github.com/awxkee/pic-scale-safe/blob/83c4801428c436678d7c6b6bea74af800924a469/src/fixed_point_horizontal.rs#L89-L176"}]},{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`resize_nearest` computes the fixed-point scale factors with `let k_x: u64 = ((src_width as u64) << SHIFT) / dst_width as u64;` and the analogous `k_y`, where `SHIFT = 32`. If `src_width` (or `src_height`) is `>= 2^32`, the left shift by 32 silently discards the high bits of the `u64` value (Rust's `<<` only panics when the shift amount itself is out of range, not when data is shifted out), so `k_x`/`k_y` become wrong - in the extreme case `src_width == 2^32` the result truncates to `0`. With `k_x == 0`, `src_x_fixed` never advances past `0`, so every destination pixel silently samples source column `0` (or row `0` for `k_y`) instead of a correct nearest-neighbor mapping or an error, for a case the function has no way to detect.","fix":"Use `checked_shl`/`checked_mul` (or widen the intermediate math, e.g. `u128`) when computing `k_x`/`k_y`, and return an error (or clamp) from the caller if `src_width`/`src_height` cannot be represented in the fixed-point `SHIFT`-bit fractional format instead of silently truncating.","locations":[{"ref":"src/resize_nearest.rs:44-45","code":"   44 |     let k_x: u64 = ((src_width as u64) << SHIFT) / dst_width as u64;\n   45 |     let k_y: u64 = ((src_height as u64) << SHIFT) / dst_height as u64;","lines":2,"link":"https://github.com/awxkee/pic-scale-safe/blob/83c4801428c436678d7c6b6bea74af800924a469/src/resize_nearest.rs#L44-L45"}]},{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In the component-wise `Mul<ColorGroup<COMPS, J>> for ColorGroup<COMPS, J>` implementation in `src/color_group.rs`, the `COMPS == 4` branch multiplies the alpha component using the wrong field: `self.a * rhs.b` instead of `self.a * rhs.a`. Every other binary operator on `ColorGroup` (`Add`, `Sub`, `MulAdd`, `AddAssign`, `SubAssign`) correctly pairs `self.a` with `rhs.a` in their respective `COMPS == 4` branches, confirming this is a copy-paste mistake rather than intentional. If this operator is ever used on a 4-channel `ColorGroup` (e.g. RGBA color multiplication), the resulting alpha channel would be silently corrupted with the blue channel's value instead. A repository-wide search found no current internal call site for this specific `ColorGroup * ColorGroup` overload (only the scalar `Mul<J>` is exercised in the resize hot loops), so it is presently a latent bug rather than an active one, but it sits on the public trait surface of `pub(crate) struct ColorGroup` and will silently corrupt data the moment any future code uses it.","fix":"Change `self.a * rhs.b` to `self.a * rhs.a` on line 265.","locations":[{"ref":"src/color_group.rs:260-266","code":"  260 |         } else if COMPS == 4 {\n  261 |             ColorGroup::from_components(\n  262 |                 self.r * rhs.r,\n  263 |                 self.g * rhs.g,\n  264 |                 self.b * rhs.b,\n  265 |                 self.a * rhs.b,\n  266 |             )","lines":7,"link":"https://github.com/awxkee/pic-scale-safe/blob/83c4801428c436678d7c6b6bea74af800924a469/src/color_group.rs#L260-L266"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`bartlett` in `src/math/bartlett.rs` does not implement a valid triangular/Bartlett window. For `0 <= x <= 1` it returns `2*x` (reaching `2.0` at `x == 1`), and for every other `x` (including `x` just above `1`, and any negative `x`) it returns `2 - 2*x`. This makes the function discontinuous at `x == 1`: `bartlett(1.0)` returns `2.0` via the first branch, while `bartlett(1.0001)` returns `2 - 2*1.0001 ≈ -0.0002` via the second branch, i.e. the value jumps from `2.0` down to roughly `0` at essentially the same point. Beyond `x == 1` the second branch keeps decreasing without bound as `x` grows (e.g. `bartlett(2.0) == -2.0`), producing large negative weights instead of tapering smoothly to `0`. Every other kernel in this module (`bilinear`, `welch`, `quadric`, `blackman`, `kaiser`, `hamming`, `hanning`, etc.) peaks at `1` at `x == 0` and decays monotonically to `0` at the edge of its support; `bartlett` (registered with `min_kernel_size = 2f32` in `ResamplingFunction::get_resampling_filter` in `src/sampler.rs`) does neither, so selecting `ResamplingFunction::Bartlett` produces a badly corrupted resampling kernel.","fix":"Replace the body with a proper triangular taper over the intended support of `2`, e.g.:\n```rust\npub(crate) fn bartlett<V: Copy + Sub<Output = V> + Mul<Output = V> + 'static + PartialOrd>(x: V) -> V\nwhere\n    f32: AsPrimitive<V>,\n{\n    let x = if x < 0f32.as_() { -x } else { x };\n    if x >= 2f32.as_() {\n        return 0f32.as_();\n    }\n    1f32.as_() - x * (1f32.as_() / 2f32.as_())\n}\n```\nThis matches the peak-at-center, decay-to-zero-at-the-edge pattern used by every other kernel function in the module.","locations":[{"ref":"src/math/bartlett.rs:34-45","code":"   34 | #[inline(always)]\n   35 | pub(crate) fn bartlett<V: Copy + Sub<Output = V> + Mul<Output = V> + 'static + PartialOrd>(\n   36 |     x: V,\n   37 | ) -> V\n   38 | where\n   39 |     f32: AsPrimitive<V>,\n   40 | {\n   41 |     if x >= 0f32.as_() && x <= 1f32.as_() {\n   42 |         return 2f32.as_() * x;\n   43 |     }\n   44 |     2f32.as_() - 2f32.as_() * x\n   45 | }","lines":12,"link":"https://github.com/awxkee/pic-scale-safe/blob/83c4801428c436678d7c6b6bea74af800924a469/src/math/bartlett.rs#L34-L45"}]},{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`jinc_f64`/`jinc_f32` in `src/math/bessel_order_one.rs` special-case `x == 0` and return `0.0`, but the mathematically correct limit of `j1(x)/x` as `x -> 0` is `0.5` (since `j1(x) ~= 0.5*x` for small `x`, matching the small-`x` branch of `j1` itself at line 103, `(0.5 + z) * x`). Returning `0` instead of `0.5` at `x == 0` introduces a discontinuity exactly at the peak of the `jinc` kernel. This is compounded by `lanczos_jinc` in `src/math/lanczos.rs`, which independently short-circuits `x == 0` to also return `0` before ever calling `jinc`. Since `jinc`/`lanczos_jinc` is used as the resampling kernel for `ResamplingFunction::Ginseng`, `ResamplingFunction::HaasnSoft`, `ResamplingFunction::Lanczos2Jinc`, `ResamplingFunction::Lanczos3Jinc`, `ResamplingFunction::Lanczos4Jinc`, and `ResamplingFunction::Lanczos6Jinc` (see `src/sampler.rs`), any destination sample that lands exactly on a source sample (`dx == 0`, the single tap that should contribute the strongest, non-zero weight) is instead assigned a weight of `0`, i.e. the central/dominant tap of these kernels is silently zeroed out.","fix":"Return the true limit instead of `0` in `jinc_f64`/`jinc_f32`, e.g. `if x == 0f64 { return 0.5f64; }`, and remove the redundant `x == 0f32.as_()` branch in `lanczos_jinc` (or likewise change it to return the correct non-zero peak value) so the center tap is not forced to zero.","locations":[{"ref":"src/math/bessel_order_one.rs:320-334","code":"  320 | #[inline]\n  321 | pub(crate) fn jinc_f64(x: f64) -> f64 {\n  322 |     if x == 0f64 {\n  323 |         return 0f64;\n  324 |     }\n  325 |     j1(x) / x\n  326 | }\n  327 | \n  328 | #[inline]\n  329 | pub(crate) fn jinc_f32(x: f32) -> f32 {\n  330 |     if x == 0f32 {\n  331 |         return 0f32;\n  332 |     }\n  333 |     (j1(x as f64) / x as f64) as f32\n  334 | }","lines":15,"link":"https://github.com/awxkee/pic-scale-safe/blob/83c4801428c436678d7c6b6bea74af800924a469/src/math/bessel_order_one.rs#L320-L334"},{"ref":"src/math/lanczos.rs:48-49","code":"   48 |     if x == 0f32.as_() || x > 16.247661874700962f32.as_() {\n   49 |         return 0f32.as_();","lines":2,"link":"https://github.com/awxkee/pic-scale-safe/blob/83c4801428c436678d7c6b6bea74af800924a469/src/math/lanczos.rs#L48-L49"}]},{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`gaussian` in `src/math/gaussian.rs` implements the Gaussian kernel incorrectly. The standard Gaussian is `exp(-x^2 / (2*sigma^2)) / (sigma*sqrt(2*pi))`, but the code computes `den = 2*sigma*sigma` and then squares it again with `den *= den` (giving `den = 4*sigma^4` instead of `2*sigma^2`), and the exponent uses the raw `x` instead of `x*x` (`(-x / den).exp()` instead of `(-x*x / den).exp()`). This makes the function neither symmetric nor shaped like a Gaussian: for the negative-`x` branch (reachable if `gaussian` is ever called directly with a signed offset) the exponent becomes positive and `exp()` blows up, and even restricted to non-negative `x` (as it is currently invoked, via `dx.abs()` in `generate_weights` in `src/compute_weights.rs`) the decay is a plain exponential in `x` rather than a Gaussian bell in `x^2`, with a badly wrong effective width because `den` is `sigma^2` squared instead of `sigma^2`. With `sigma = 0.35`, `gaussian(1.0)` evaluates to `exp(-1/0.060025) ≈ 5.8e-8`, whereas the correct Gaussian value `exp(-1/0.245) ≈ 0.017` is nearly six orders of magnitude larger, so the resulting resize kernel is far narrower than intended.","fix":"Compute the denominator once (`let den = 2f32.as_() * sigma * sigma;`, without the extra `den *= den`) and square `x` in the exponent: `(1f32.as_() / ((2f32.as_() * pi).sqrt() * sigma)) * (-(x * x) / den).exp()`.","locations":[{"ref":"src/math/gaussian.rs:43-48","code":"   43 |     let sigma: V = 0.35f32.as_();\n   44 |     let pi = V::const_pi();\n   45 |     let mut den = 2f32.as_() * sigma * sigma;\n   46 |     den *= den;\n   47 |     (1f32.as_() / ((2f32.as_() * pi).sqrt() * sigma)) * (-x / den).exp()\n   48 | }","lines":6,"link":"https://github.com/awxkee/pic-scale-safe/blob/83c4801428c436678d7c6b6bea74af800924a469/src/math/gaussian.rs#L43-L48"}]},{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`trc_linear` in `src/trc.rs` is supposed to clamp its input to the `[0, 1]` range (it backs `TransferFunction::Linear` for both `TransferFunction::linearize` and `TransferFunction::gamma`), but it is implemented as `v.min(1.).min(0.)` instead of `v.max(0.).min(1.)`. Because `min(1.)` followed by `min(0.)` always returns a value `<= 0`, every non-negative input is mapped to `0.0`, and only already-negative inputs pass through unchanged. Any caller using `TransferFunction::Linear` with `image_to_linear`, `linear_to_gamma_image`, `image16_to_linear16`, `linear16_to_gamma_image16`, `image_f32_to_linear_f32`, or `linear_f32_to_gamma_image_f32` gets an image silently zeroed out instead of passed through/clamped.","fix":"Replace the body of `trc_linear` with a proper clamp: `v.max(0.).min(1.)` (or `v.clamp(0., 1.)`).","locations":[{"ref":"src/trc.rs:219-223","code":"  219 | #[inline]\n  220 | /// Gamma transfer function for HLG\n  221 | pub fn trc_linear(v: f32) -> f32 {\n  222 |     v.min(1.).min(0.)\n  223 | }","lines":5,"link":"https://github.com/awxkee/pic-scale-safe/blob/83c4801428c436678d7c6b6bea74af800924a469/src/trc.rs#L219-L223"}]},{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`bartlett_hann` in `src/math/bartlett.rs` produces values well outside the normal `[0,1]`-ish range expected of a tapering window as `x` approaches the edge of its support (~2, matching its `min_kernel_size = 2f32` registration in `src/sampler.rs`). With `l = 2.0`, `fac = |x/(l-1) - 0.5|`, at `x = 2.0`: `fac = 1.5`, `cos(2*pi*1.5) = cos(3*pi) = -1`, giving `0.62 - 0.4832*1.5 + 0.38*(-1) ≈ -0.4848`, a large negative weight instead of a value tapering toward `0`. The classic Bartlett-Hann window is `a0 - a1*|n/(N-1) - 0.5| + a2*cos(2*pi*n/(N-1))`; substituting a center-relative offset shows the cosine argument should use the raw (signed) fractional position, and via the trig identity `cos(2*pi*n/(N-1)) = -cos(2*pi*fac)`, the sign of the `0.38` term here is inverted relative to that identity. The magic constant `0.4832` also differs from the commonly cited coefficient `0.48` for this window, which looks like an unintentional typo.","fix":"Re-derive the term so the sign matches the standard formula (flip to `- 0.38*(...).cos()`), use the standard `0.48` coefficient, and clamp the result to `[0, 1]` (or explicitly zero it out beyond the window edge) so it cannot go negative near the support boundary, e.g. `0.62f32.as_() - 0.48f32.as_() * fac - 0.38f32.as_() * (2f32.as_() * V::const_pi() * fac).cos()`.","locations":[{"ref":"src/math/bartlett.rs:47-63","code":"   47 | #[inline(always)]\n   48 | pub(crate) fn bartlett_hann<\n   49 |     V: Copy + Sub<Output = V> + Mul<Output = V> + Float + ConstPI + 'static,\n   50 | >(\n   51 |     x: V,\n   52 | ) -> V\n   53 | where\n   54 |     f32: AsPrimitive<V>,\n   55 | {\n   56 |     let x = x.abs();\n   57 |     if x > 2f32.as_() {\n   58 |         return 0f32.as_();\n   59 |     }\n   60 |     let l = 2.0f32.as_();\n   61 |     let fac = (x / (l - 1.0f32.as_()) - 0.5f32.as_()).abs();\n   62 |     0.62f32.as_() - 0.4832.as_() * fac + 0.38f32.as_() * (2f32.as_() * V::const_pi() * fac).cos()\n   63 | }","lines":17,"link":"https://github.com/awxkee/pic-scale-safe/blob/83c4801428c436678d7c6b6bea74af800924a469/src/math/bartlett.rs#L47-L63"}]},{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `generate_weights`, the general (non-area) weight-normalization branch only writes normalized weights `if weights_sum != 0f32.as_()` and has no `else`, so if a kernel's summed weights are exactly zero for a given output index, `weights` keeps its default-initialized `0` values for that row's `bound` and the corresponding destination pixel is convolved with an all-zero kernel (i.e. it is silently dropped to `0`/black). The sibling area-filter branch handles the identical situation explicitly with `weights[filter_position] = 1.as_();` as a fallback so at least one sample is used. The two branches are inconsistent.","fix":"Add the same `else { weights[filter_position] = 1.as_(); }` fallback to the general branch (mirroring the area-filter branch) so a degenerate zero-weight-sum kernel still passes through the nearest sample instead of zeroing the pixel.","locations":[{"ref":"src/compute_weights.rs:144-161","code":"  144 |             let size = end - start;\n  145 | \n  146 |             *bound = FilterBounds::new(start, size);\n  147 | \n  148 |             if weights_sum != 0f32.as_() {\n  149 |                 let recpeq = 1f32.as_() / weights_sum;\n  150 | \n  151 |                 for (dst, src) in weights\n  152 |                     .iter_mut()\n  153 |                     .skip(filter_position)\n  154 |                     .take(size)\n  155 |                     .zip(local_filters.iter().take(size))\n  156 |                 {\n  157 |                     *dst = *src * recpeq;\n  158 |                 }\n  159 |             }\n  160 | \n  161 |             filter_position += kernel_size;","lines":18,"link":"https://github.com/awxkee/pic-scale-safe/blob/83c4801428c436678d7c6b6bea74af800924a469/src/compute_weights.rs#L144-L161"},{"ref":"src/compute_weights.rs:208-227","code":"  208 |             weights_sum += weight0;\n  209 |             if size > 1 {\n  210 |                 weights_sum += weight1;\n  211 |             }\n  212 |             *bound = FilterBounds::new(start, size);\n  213 | \n  214 |             if weights_sum != 0f32.as_() {\n  215 |                 let recpeq = 1f32.as_() / weights_sum;\n  216 | \n  217 |                 for (dst, src) in weights\n  218 |                     .iter_mut()\n  219 |                     .skip(filter_position)\n  220 |                     .take(size)\n  221 |                     .zip(local_filters.iter().take(size))\n  222 |                 {\n  223 |                     *dst = *src * recpeq;\n  224 |                 }\n  225 |             } else {\n  226 |                 weights[filter_position] = 1.as_();\n  227 |             }","lines":20,"link":"https://github.com/awxkee/pic-scale-safe/blob/83c4801428c436678d7c6b6bea74af800924a469/src/compute_weights.rs#L208-L227"}]},{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`kaiser` in `src/math/kaiser.rs` only guards against `x > 1f32.as_()`, not against `x < -1f32.as_()`. If `kaiser` is ever invoked with a negative argument whose absolute value exceeds `1` (it is currently always called with `dx.abs()` from `generate_weights` in `src/compute_weights.rs`, so this path is not reachable today), `1.0 - x * x` becomes negative and `.sqrt()` on a negative number returns `NaN`, which then propagates through `bessel_i0(...)` and poisons the resulting weight.","fix":"Use the absolute value in the guard, e.g. `if x.abs() > 1f32.as_() { return 0f32.as_(); }`, so the function is domain-safe regardless of caller behavior.","locations":[{"ref":"src/math/kaiser.rs:72-74","code":"   72 |     if x > 1f32.as_() {\n   73 |         return 0f32.as_();\n   74 |     }","lines":3,"link":"https://github.com/awxkee/pic-scale-safe/blob/83c4801428c436678d7c6b6bea74af800924a469/src/math/kaiser.rs#L72-L74"}]},{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`welch` in `src/math/welch.rs` never takes `x.abs()`. Its zero-check is `x >= 1f32.as_()`, which does not catch `x <= -1f32.as_()`. For such inputs (not reachable today since `generate_weights` in `src/compute_weights.rs` always passes `dx.abs()`), the function falls fe/blob/83c4801428c436678d7c6b6bea74af800924a469/src/trc_handler.rs#L229-L252"}]},{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"Across `src/alpha.rs`, the premultiply functions recompute the (unchanged) alpha channel via a full division instead of a direct copy. For example `premultiply_rgba8`/`premultiplied_rgba8` compute `chunk[3] = div_by_255(255 * a)` and `premultiply_la8`/`premultiplied_la8` compute `chunk[1] = div_by_255(255 * a)`, even though `div_by_255(255 * a)` is mathematically always exactly `a` (verified: `255 * a` is an exact multiple of 255, so the rounding division recovers `a` exactly for every `a` in `0..=255`). The same redundant pattern repeats for every bit depth in `premultiply_rgba16`/`premultiplied_rgba16`/`premultiply_la16`/`premultiplied_la16` via `div_by_1023(1023 * a)`, `div_by_4095(4095 * a)`, `div_by_65535(65535 * a)`, and `div_by_2pn_m1(max_colors * a, bit_depth)`. This adds an unnecessary multiply + divide-by-magic-constant per pixel, in the hottest loop of the crate, purely to reproduce a value already held in a register.","fix":"Replace each of these alpha-recomputation lines with a direct assignment/cast of the already-known alpha value, e.g. `chunk[3] = a as u8;` in the 8-bit case and `chunk[1] = a as u16;` / `dst[1] = a as u16;` in the 16-bit cases, dropping the redundant `div_by_255`/`div_by_1023`/`div_by_4095`/`div_by_65535`/`div_by_2pn_m1` call for the alpha channel.","locations":[{"ref":"src/alpha.rs:73","code":"   73 |         chunk[3] = div_by_255(255 * a);","lines":1,"link":"https://github.com/awxkee/pic-scale-safe/blob/83c4801428c436678d7c6b6bea74af800924a469/src/alpha.rs#L73"},{"ref":"src/alpha.rs:95","code":"   95 |         dst[3] = div_by_255(255 * a);","lines":1,"link":"https://github.com/awxkee/pic-scale-safe/blob/83c4801428c436678d7c6b6bea74af800924a469/src/alpha.rs#L95"},{"ref":"src/alpha.rs:133","code":"  133 |         chunk[1] = div_by_255(255 * d_point` (`src/fixed_point_dispatch.rs`), `scratch_len` is computed as `src_stride * 4.min(destination_size.height)` and a `vec![T::default(); scratch_len]` is allocated once up front. When `destination_size.height < 4`, `quads` is `0`, so the quad-processing loop never runs and only `scratch[..src_stride]` (a single row) is ever used through `scratch_row`; the remaining `src_stride * (height - 1)` elements of the allocation are wasted. The same pattern exists in `convolve_trampoline_floating_point`.","fix":"When `quads == 0`, allocate the scratch buffer with `src_stride` elements only (matching what the rayon branch already does for its remainder-only fallback with `vec![T::default(); src_stride]`), instead of sizing it by `4.min(destination_size.height)`.","locations":[{"ref":"src/fixed_point_dispatch.rs:118-154","code":"  118 |     let scratch_len = src_stride * 4.min(destination_size.height);\n  119 | \n  120 |     let quads = destination_size.height / 4;\n  121 |     let (dst_quads, dst_rem) = destination.split_at_mut(quads * 4 * dst_stride);\n  122 | \n  123 |     #[cfg(not(feature = \"rayon\"))]\n  124 |     {\n  125 |         let mut scratch = vec![T::default(); scratch_len];\n  126 | \n  127 |         for (quad, dst) in dst_quads.chunks_exact_mut(dst_stride * 4).enumerate() {\n  128 |             vertical_pass_into_scratch::<T, J>(\n  129 |                 image_store,\n  130 |                 src_stride,\n  131 |                 &mut scratch,\n  132 |                 &v_weights,\n  133 |                 quad * 4,\n  134 |                 bit_depth,\n  135 |             );\n  136 |             T::handle_row_4::<CHANNELS>(\n  137 |                 &scratch, src_stride, dst, dst_stride, &h_weights, bit_depth,\n  138 |             );\n  139 |         }\n  140 | \n  141 |         let scratch_row = &mut scratch[..src_stride];\n  142 | \n  143 |         for (y, dst) in dst_rem.chunks_exact_mut(dst_stride).enumerate() {\n  144 |             vertical_pass_into_scratch::<T, J>(\n  145 |                 image_store,\n  146 |                 src_stride,\n  147 |                 scratch_row,\n  148 |                 &v_weights,\n  149 |                 quads * 4 + y,\n  150 |                 bit_depth,\n  151 |             );\n  152 |             T::handle_row::<CHANNELS>(scratch_row, dst, &h_weights, bit_depth);\n  153 |         }\n  154 |     }","lines":37,"link":"https://github.com/awxkee/pic-scale-safe/blob/83c4801428c436678d7c6b6bea74af800924a469/src/fixed_point_dispatch.rs#L118-L154"},{"ref":"src/floating_point_dispatch.rs:118-159","code":"  118 |     let scratch_len = src_stride * 4.min(destination_size.height);\n  119 | \n  120 |     let quads = destination_size.height / 4;\n  121 |     let (dst_quads, dst_rem) = destination.split_at_mut(quads * 4 * dst_stride);\n  122 | \n  123 |     #[cfg(not(feature = \"rayon\"))]\n  124 |     {\n  125 |         let mut scratch = vec![T::default(); scratch_len];\n  126 | \n  127 |         for (quad, dst) in dst_quads.chunks_exact_mut(dst_stride * 4).enumerate() {\n  128 |             vertical_pass_into_scratch::<T, J, F>(\n  129 |                 image_store,\n  130 |                 src_stride,\n  131 |                 &mut scratch,\n  132 |                 &vertical_weights,\n  133 |                 quad * 4,\n  134 |                 bit_depth,\n  135 |             );\n  136 |             T::handle_row_4::<CHANNELS>(\n  137 |                 &scratch,\n  138 |                 src_stride,\n  139 |                 dst,\n  140 |                 dst_stride,\n  141 |                 &horizontal_weights,\n  142 |                 bit_depth,\n  143 |             );\n  144 |         }\n  145 | \n  146 |         let scratch_row = &mut scratch[..src_stride];\n  147 | \n  148 |         for (y, dst) in dst_rem.chunks_exact_mut(dst_stride).enumerate() {\n  149 |             vertical_pass_into_scratch::<T, J, F>(\n  150 |                 image_store,\n  151 |                 src_stride,\n  152 | ro (either no full row was ever processed, or every processed row summed to zero). In both cases the final expression necessarily evaluates to `false`, making the trailing `zeros`/`ne` computation dead code that always returns `false`, which could simply be written as `false`.","fix":"Replace the trailing `let zeros = ...; row_sums.ne(&zeros)` in both functions with a plain `false`, since that branch is only reached when `row_sums` is provably still zero.","locations":[{"ref":"src/alpha_check.rs:140-142","code":"  140 |     let zeros = 0.as_();\n  141 | \n  142 |     row_sums.ne(&zeros)","lines":3,"link":"https://github.com/awxkee/pic-scale-safe/blob/83c4801428c436678d7c6b6bea74af800924a469/src/alpha_check.rs#L140-L142"},{"ref":"src/alpha_check.rs:166-168","code":"  166 |     let zeros = 0;\n  167 | \n  168 |     row_sums.ne(&zeros)","lines":3,"link":"https://github.com/awxkee/pic-scale-safe/blob/83c4801428c436678d7c6b6bea74af800924a469/src/alpha_check.rs#L166-L168"}]},{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"very_easy","description":"The bit-depth validation `if bit_depth > 16 || bit_depth == 0 { return Err(\"Bit depth cannot be greater than 16 and not a zero\".to_string()); }` together with the `if bit_depth == 10 || bit_depth == 12 { resize_fixed_point } else { resize_floating_point }` dispatch is copy-pasted verbatim across `resize_rgba16`, `resize_rgb16`, `resize_plane16`, and `resize_plane16_with_alpha` in `src/resizer.rs`. Any future change to the validation rule (e.g. adding another fixed-point bit depth) has to be replicated in four places and can easily drift out of sync.","fix":"Factor the bit-depth check and fixed/floating dispatch decision into a small private helper, e.g. `fn validate_bit_depth(bit_depth: u32) -> Result<(), String>` plus a `fn use_fixed_point(bit_depth: u32) -> bool`, and call it from all four `resize_*16` functions instead of duplicating the logic.","locations":[{"ref":"src/res // Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a

}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return chunks.join('\n\n') + '\n';
}

// Build project-info.toml from embedded PROJECT_INFO (same format as gen_project_info.py).
function buildProjectInfoToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = Object.assign({}, PROJECT_INFO);
  if (!('description' in pi)) pi.description = '';
  const lines = [
    '# Project metadata for the code audit report (all fields optional).',
    '# Hand-edit freely (e.g. fill in description); re-run the audit without --force to keep edits.',
    '', '[project]'
  ];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystack per finding (cleared on full re-render)
const _hay = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (!hayOf(f).includes(q) && !st.includes(q)) return false;
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    downloadText(buildFindingsToml(),    'findings.toml',     'application/toml');
    downloadText(buildProjectInfoToml(), 'project-info.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
