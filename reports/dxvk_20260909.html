{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"Several resource-binding setters index fixed-size `std::array` state directly with `StartSlot + i` derived from application-supplied `StartSlot`/`NumXxx` parameters, without ever validating that `StartSlot + NumXxx` stays within the array bounds. This is inconsistent with sibling code in the same file: `IAGetVertexBuffers`, `GetShaderResources`, `GetSamplers`, `GetConstantBuffers`, `CSGetUnorderedAccessViews`, `OMGetRenderTargetsAndUnorderedAccessViews`, and `RSSetViewports`/`RSSetScissorRects` all explicitly clamp or reject out-of-range indices (e.g. `if (unlikely(NumViewports > m_state.rs.viewports.size())) return;`), but the corresponding setters do not:\n- `IASetVertexBuffers` writes `m_state.ia.vertexBuffers[StartSlot + i]` (array size `D3D11_IA_VERTEX_INPUT_RESOURCE_SLOT_COUNT`).\n- `SOSetTargets` writes `m_state.so.targets[i]` for `i` up to `NumBuffers` (array size `D3D11_SO_BUFFER_SLOT_COUNT` = 4) with no clamp on `NumBuffers`.\n- `SetConstantBuffers`/`SetConstantBuffers1` write `bindings.buffers[StartSlot + i]` (size `D3D11_COMMONSHADER_CONSTANT_BUFFER_API_SLOT_COUNT`).\n- `SetShaderResources` writes `bindings.views[StartSlot + i]` (size `D3D11_COMMONSHADER_INPUT_RESOURCE_SLOT_COUNT`).\n- `SetSamplers` writes `bindings.samplers[StartSlot + i]` (size `D3D11_COMMONSHADER_SAMPLER_SLOT_COUNT`).\n- `CSSetUnorderedAccessViews` writes `m_state.uav.views[StartSlot + i]` (size `D3D11_1_UAV_SLOT_COUNT`).\n- `SetRenderTargetsAndUnorderedAccessViews` writes `m_state.om.uavs[i]` for `i` up to `std::max(oldMaxUav, newMaxUav)` where `newMaxUav = UAVStartSlot + NumUAVs` is never clamped to `m_state.om.uavs.size()`.\nSince DXVK's `D3D11CommonContext` is itself the top-level `ID3D11DeviceContext` implementation (there is no separate Microsoft runtime performing parameter validation before the call reaches this code), any application or driver-shim that passes an out-of-range `StartSlot`/`NumXxx` combination to these entry points causes an out-of-bounds write into these fixed-size arrays, corrupting adjacent context state and potentially crashing the process.","fix":"Add an explicit range check at the top of each setter (matching the pattern already used in `RSSetViewports`), e.g. for `IASetVertexBuffers`:\n```cpp\nif (unlikely(uint64_t(StartSlot) + NumBuffers > m_state.ia.vertexBuffers.size()))\n  return;\n```\nand equivalent guards using each array's `.size()` in `SOSetTargets`, `SetConstantBuffers[1]`, `SetShaderResources`, `SetSamplers`, `CSSetUnorderedAccessViews`, and the UAV loop bounds in `SetRenderTargetsAndUnorderedAccessViews`.","locations":[{"ref":"src/d3d11/d3d11_context.cpp:1268-1296","code":" 1268 |   void STDMETHODCALLTYPE D3D11CommonContext<ContextType>::IASetVertexBuffers(\n 1269 |           UINT                              StartSlot,\n 1270 |           UINT                              NumBuffers,\n 1271 |           ID3D11Buffer* const*              ppVertexBuffers,\n 1272 |     const UINT*                             pStrides,\n 1273 |     const UINT*                             pOffsets) {\n 1274 |     D3D10DeviceLock lock = LockContext();\n 1275 | \n 1276 |     for (uint32_t i = 0; i < NumBuffers; i++) {\n 1277 |       auto newBuffer = static_cast<D3D11Buffer*>(ppVertexBuffers[i]);\n 1278 | \n 1279 |       if (m_state.ia.vertexBuffers[StartSlot + i].buffer != newBuffer) {\n 1280 |         m_state.ia.vertexBuffers[StartSlot + i].buffer = newBuffer;\n 1281 |         m_state.ia.vertexBuffers[StartSlot + i].offset = pOffsets[i];\n 1282 |         m_state.ia.vertexBuffers[StartSlot + i].stride = pStrides[i];\n 1283 | \n 1284 |         BindVertexBuffer(StartSlot + i, newBuffer, pOffsets[i], pStrides[i]);\n 1285 |       } else if (m_state.ia.vertexBuffers[StartSlot + i].offset != pOffsets[i]\n 1286 |               || m_state.ia.vertexBuffers[StartSlot + i].stride != pStrides[i]) {\n 1287 |         m_state.ia.vertexBuffers[StartSlot + i].offset = pOffsets[i];\n 1288 |         m_state.ia.vertexBuffers[StartSlot + i].stride = pStrides[i];\n 1289 | \n 1290 |         BindVertexBufferRange(StartSlot + i, newBuffer, pOffsets[i], pStrides[i]);\n 1291 |       }\n 1292 |     }\n 1293 | \n 1294 |     m_state.ia.maxVbCount = std::clamp(StartSlot + NumBuffers,\n 1295 |       m_state.ia.maxVbCount, uint32_t(m_state.ia.vertexBuffers.size()));\n 1296 |   }","lines":29,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d11/d3d11_context.cpp#L1268-L1296"},{"ref":"src/d3d11/d3d11_context.cpp:2142-2196","code":" 2142 |   void STDMETHODCALLTYPE D3D11CommonContext<ContextType>::CSSetUnorderedAccessViews(\n 2143 |           UINT                              StartSlot,\n 2144 |           UINT                              NumUAVs,\n 2145 |           ID3D11UnorderedAccessView* const* ppUnorderedAccessViews,\n 2146 |     const UINT*                             pUAVInitialCounts) {\n 2147 |     D3D10DeviceLock lock = LockContext();\n 2148 | \n 2149 |     if (TestRtvUavHazards(0, nullptr, NumUAVs, ppUnorderedAccessViews))\n 2150 |       return;\n 2151 | \n 2152 |     // Unbind previously bound conflicting UAVs\n 2153 |     int32_t uavId = m_state.uav.mask.findNext(0);\n 2154 | \n 2155 |     while (uavId >= 0) {\n 2156 |       if (uint32_t(uavId) < StartSlot || uint32_t(uavId) >= StartSlot + NumUAVs) {\n 2157 |         for (uint32_t i = 0; i < NumUAVs; i++) {\n 2158 |           auto uav = static_cast<D3D11UnorderedAccessView*>(ppUnorderedAccessViews[i]);\n 2159 | \n 2160 |           if (CheckViewOverlap(uav, m_state.uav.views[uavId].ptr())) {\n 2161 |             m_state.uav.views[uavId] = nullptr;\n 2162 |             m_state.uav.mask.clr(uavId);\n 2163 | \n 2164 |             if (!DirtyComputeUnorderedAccessView(uavId, true))\n 2165 |               BindUnorderedAccessView(D3D11ShaderType::eCompute, uavId, nullptr);\n 2166 |           }\n 2 {"id":"OVF_8","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"In `D3D11DXGIResource::CreateSharedHandle`, the code builds a kernel object name into a fixed-size stack buffer `WCHAR buffer[MAX_PATH]` by first writing a `\\Sessions\\%u\\BaseNamedObjects\\` prefix with `swprintf`, then doing `memcpy(buffer + len, lpName, (name_len + 1) * sizeof(WCHAR))` where `name_len = wcslen(lpName)`. `lpName` is the caller-supplied name from `IDXGIResource1::CreateSharedHandle`, and its length is never checked against the remaining space in `buffer` (which is `MAX_PATH`, i.e. 260 `WCHAR`s, minus the ~33-character session prefix). A sufficiently long `lpName` overflows `buffer` on the stack, corrupting adjacent stack memory (including `attr`, `name_str`, and potentially the return address / saved registers depending on layout).","fix":"Validate the combined length before copying, e.g.:\n```cpp\nWCHAR buffer[MAX_PATH];\nUNICODE_STRING name_str;\nif (lpName) {\n    DWORD session, len, name_len = wcslen(lpName);\n\n    ProcessIdToSessionId(GetCurrentProcessId(), &session);\n    len = swprintf(buffer, ARRAYSIZE(buffer), L\"\\\\Sessions\\\\%u\\\\BaseNamedObjects\\\\\", session);\n\n    if (len + name_len + 1 > ARRAYSIZE(buffer))\n      return E_INVALIDARG;\n\n    memcpy(buffer + len, lpName, (name_len + 1) * sizeof(WCHAR));\n    ...\n}\n```","locations":[{"ref":"src/d3d11/d3d11_resource.cpp:308-322","code":"  308 |     WCHAR buffer[MAX_PATH];\n  309 |     UNICODE_STRING name_str;\n  310 |     if (lpName) {\n  311 |         DWORD session, len, name_len = wcslen(lpName);\n  312 | \n  313 |         ProcessIdToSessionId(GetCurrentProcessId(), &session);\n  314 |         len = swprintf(buffer, ARRAYSIZE(buffer), L\"\\\\Sessions\\\\%u\\\\BaseNamedObjects\\\\\", session);\n  315 |         memcpy(buffer + len, lpName, (name_len + 1) * sizeof(WCHAR));\n  316 |         name_str.MaximumLength = name_str.Length = (len + name_len) * sizeof(WCHAR);\n  317 |         name_str.MaximumLength += sizeof(WCHAR);\n  318 |         name_str.Buffer = buffer;\n  319 | \n  320 |         attr.ObjectName = &name_str;\n  321 |         attr.Attributes = OBJ_CASE_INSENSITIVE;\n  322 |     }","lines":15,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d11/d3d11_resource.cpp#L308-L322"}]},
{"id":"OVF_9","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"very_easy","description":"`D3D9DeviceEx::GetRenderTarget()` validates `RenderTargetIndex` with `RenderTargetIndex > caps::MaxSimultaneousRenderTargets`, but `m_state.renderTargets` is a `std::array<Com<D3D9Surface, false>, caps::MaxSimultaneousRenderTargets>` (declared in `src/d3d9/d3d9_state.h:709`), i.e. valid indices are `0 .. MaxSimultaneousRenderTargets - 1`. Using `>` instead of `>=` lets `RenderTargetIndex == caps::MaxSimultaneousRenderTargets` pass validation, after which `m_state.renderTargets[RenderTargetIndex]` reads one element past the end of the array and `.ref()` is called on it, incrementing a reference count through whatever garbage/adjacent-object bytes happen to sit there. This is directly reachable from the public `IDirect3DDevice9::GetRenderTarget` API with a single out-of-range call and can corrupt memory or crash the process. Note the sibling function `SetRenderTargetInternal()` (line 1643) correctly uses `>=` for the same array, confirming this is a copy/paste off-by-one rather than intentional behavior.","fix":"```cpp\n// before\nif (unlikely(ppRenderTarget == nullptr || RenderTargetIndex > caps::MaxSimultaneousRenderTargets))\n  return D3DERR_INVALIDCALL;\n\n// after\nif (unlikely(ppRenderTarget == nullptr || RenderTargetIndex >= caps::MaxSimultaneousRenderTargets))\n  return D3DERR_INVALIDCALL;\n```","locations":[{"ref":"src/d3d9/d3d9_device.cpp:1780-1796","code":" 1780 |   HRESULT STDMETHODCALLTYPE D3D9DeviceEx::GetRenderTarget(\n 1781 |           DWORD               RenderTargetIndex,\n 1782 |           IDirect3DSurface9** ppRenderTarget) {\n 1783 |     D3D9DeviceLock lock = LockDevice();\n 1784 | \n 1785 |     InitReturnPtr(ppRenderTarget);\n 1786 | \n 1787 |     if (unlikely(ppRenderTarget == nullptr || RenderTargetIndex > caps::MaxSimultaneousRenderTargets))\n 1788 |       return D3DERR_INVALIDCALL;\n 1789 | \n 1790 |     if (m_state.renderTargets[RenderTargetIndex] == nullptr)\n 1791 |       return D3DERR_NOTFOUND;\n 1792 | \n 1793 |     *ppRenderTarget = m_state.renderTargets[RenderTargetIndex].ref();\n 1794 | \n 1795 |     return D3D_OK;\n 1796 |   }","lines":17,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d9/d3d9_device.cpp#L1780-L1796"}]},
{"id":"OVF_10","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"`D3D9DeviceEx::CreateVertexDeclaration()` in `src/d3d9/d3d9_device.cpp:3388-3411` takes an application-supplied `D3DVERTEXELEMENT9` array and only scans it for the `D3DDECL_END` terminator (`Stream == 0xFF`); it never validates the `Stream` or `UsageIndex` fields of the individual elements. That raw array is forwarded straight into `D3D9VertexDecl`'s constructor (`src/d3d9/d3d9_vertex_declaration.cpp:18-26`), which calls `Classify()` (`src/d3d9/d3d9_vertex_declaration.cpp:355-380`).\n\n`Classify()` does:\n```\nm_sizes[element.Stream] = std::max(m_sizes[element.Stream], ...);\n...\nm_texcoordMask |= GetDecltypeCount(...) << (element.UsageIndex * 3);\n...\nm_streamMask |= 1 << element.Stream;\n```\n`m_sizes` is a fixed-size `std::array<uint32_t, caps::MaxStreams>` (`caps::MaxStreams == 16`, see `src/d3d9/d3d9_vertex_declaration.h:103` and `src/d3d9/d3d9_caps.h:9`). Since `element.Stream` can be any value from `0` to `0xFE` (only `0xFF` is reserved as the terminator) and is never bounds-checked, a game (or a fuzzer/malicious loader) that passes a declaration with `Stream >= 16` triggers an out-of-bounds write into `m_sizes`, and `1 << element.Stream` is undefined behavior once `Stream >= 32`. Likewise `element.UsageIndex` is an unchecked `BYTE`, so `element.UsageIndex * 3` can exceed 31, making the shift for `m_texcoordMask` undefined behavior as well. Real D3D9 validates `Stream < MaxStreams` (16) and rejects declarations that violate it; dxvk does not, so malformed input from any application can corrupt adjacent memory in the `D3D9VertexDecl` object.","fix":"Validate every element in `CreateVertexDeclaration` before constructing `D3D9VertexDecl`, e.g.:\n```cpp\nfor (const D3DVERTEXELEMENT9* e = pVertexElements; e->Stream != 0xFF; e++) {\n  if (e->Stream >= caps::MaxStreams || e->UsageIndex >= 16)\n    return D3DERR_INVALIDCALL;\n}\n```\nAlternatively, add the same check at the top of `D3D9VertexDecl::Classify()` and skip/reject elements whose `Stream`/`UsageIndex` are out of range instead of indexing `m_sizes` and shifting by an unchecked value.","locations":[{"ref":"src/d3d9/d3d9_device.cpp:3406-3429","code":" 3406 |   HRESULT STDMETHODCALLTYPE D3D9DeviceEx::CreateVertexDeclaration(\n 3407 |     const D3DVERTEXELEMENT9*            pVertexElements,\n 3408 |           IDirect3DVertexDeclaration9** ppDecl) {\n 3409 |     InitReturnPtr(ppDecl);\n 3410 | \n 3411 |     if (unlikely(ppDecl == nullptr || pVertexElements == nullptr))\n 3412 |       return D3DERR_INVALIDCALL;\n 3413 | \n 3414 |     const D3DVERTEXELEMENT9* counter = pVertexElements;\n 3415 |     while (counter->Stream != 0xFF)\n 3416 |       counter++;\n 3417 | \n 3418 |     const uint32_t declCount = uint32_t(counter - pVertexElements);\n 3419 | \n 3420 |     try {\n 3421 |       const Com<D3D9VertexDecl> decl = new D3D9VertexDecl(this, pVertexElements, declCount);\n 3422 |       *ppDecl = decl.ref();\n 3423 |       return D3D_OK;\n 3424 |     }\n 3425 |     catch (const DxvkError & e) {\n 3426 |       Logger::err(e.message());\n 3427 |       return D3DERR_INVALIDCALL;\n 3428 |     }\n 3429 |   }","lines":24,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d9/d3d9_device.cpp#L3406-L3429"},{"ref":"src/d3d9/d3d9_vertex_declaration.cpp:355-380","code":"  355 |   void D3D9VertexDecl::Classify() {\n  356 |     for (const auto& element : m_elements) {\n  357 |       if (element.Type != D3DDECLTYPE_UNUSED)\n  358 |         m_sizes[element.Stream] = std::max(m_sizes[element.Stream], element.Offset + GetDecltypeSize(D3DDECLTYPE(element.Type)));\n  359 | \n  360 |       if (element.Usage == D3DDECLUSAGE_COLOR && element.UsageIndex == 0)\n  361 |         m_flags.set(D3D9VertexDeclFlag::HasColor0);\n  362 |       else if (element.Usage == D3DDECLUSAGE_COLOR && element.UsageIndex == 1)\n  363 |         m_flags.set(D3D9VertexDeclFlag::HasColor1);\n  364 |       else if (element.Usage == D3DDECLUSAGE_POSITIONT)\n  365 |         m_flags.set(D3D9VertexDeclFlag::HasPositionT);\n  366 |       else if (element.Usage == D3DDECLUSAGE_PSIZE)\n  367 |         m_flags.set(D3D9VertexDeclFlag::HasPointSize);\n  368 |       else if (element.Usage == D3DDECLUSAGE_FOG)\n  369 |         m_flags.set(D3D9VertexDeclFlag::HasFog);\n  370 |       else if (element.Usage == D3DDECLUSAGE_BLENDWEIGHT)\n  371 |         m_flags.set(D3D9VertexDeclFlag::HasBlendWeight);\n  372 |       else if (element.Usage == D3DDECLUSAGE_BLENDINDICES)\n  373 |         m_flags.set(D3D9VertexDeclFlag::HasBlendIndices);\n  374 | \n  375 |       if (element.Usage == D3DDECLUSAGE_TEXCOORD)\n  376 |         m_texcoordMask |= GetDecltypeCount(D3DDECLTYPE(element.Type)) << (element.UsageIndex * 3);\n  377 | \n  378 |       m_streamMask |= 1 << element.Stream;\n  379 |     }\n  380 |   }","lines":26,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d9/d3d9_vertex_declaration.cpp#L355-L380"},{"ref":"src/d3d9/d3d9_vertex_declaration.h:103","code":"  103 |     std::array<uint32_t, caps::MaxStreams> m_sizes = {};","lines":1,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d9/d3d9_vertex_declaration.h#L103"}]},
{"id":"OVF_11","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"`D3D9DeviceEx::GetShaderConstants` (used directly by `GetVertexShaderConstantF/I/B` and `GetPixelShaderConstantF/I/B`, which forward the application-supplied `StartRegister`/`Count` completely unvalidated) guards against out-of-range register access with `if (StartRegister + Count > regCountSoftware) return D3DERR_INVALIDCALL;`. Both `StartRegister` and `Count` are `UINT`, so this addition can wrap around: e.g. `StartRegister = 0xFFFFFFFF`, `Count = 1` gives `StartRegister + Count == 0`, which is never greater than `regCountSoftware`, so the bounds check passes even though `StartRegister` is wildly out of range. The subsequent `Count` re-derivation only clamps `Count`, it never clamps `StartRegister` itself. Execution then falls into `set->fConsts[StartRegister].data` / `set->iConsts[StartRegister].data` (or, for bools, `set->bConsts[arrayIdx]` with `arrayIdx = (StartRegister + i) / 32`), indexing the constant array far out of bounds and `memcpy`-ing (or copying bit-by-bit) attacker-influenced out-of-bounds memory into the caller-supplied output buffer - an out-of-bounds read / information-disclosure primitive reachable directly from the public `IDirect3DDevice9::GetVertexShaderConstantF` etc. APIs.","fix":"Validate `StartRegister` before adding `Count` to it, so the comparison cannot wrap:\n```cpp\nif (StartRegister > regCountSoftware || Count > regCountSoftware - StartRegister)\n  return D3DERR_INVALIDCALL;\n```\nThis guarantees `StartRegister <= regCountSoftware` before it is ever used to index `fConsts`/`iConsts`/`bConsts`, eliminating the overflow-based bypass.","locations":[{"ref":"src/d3d9/d3d9_device.h:1389-1426","code":" 1389 |         if (StartRegister + Count > regCountSoftware)\n 1390 |           return D3DERR_INVALIDCALL;\n 1391 | \n 1392 |         Count = UINT(\n 1393 |           std::max<INT>(\n 1394 |             std::clamp<INT>(Count + StartRegister, 0, regCountHardware) - INT(StartRegister),\n 1395 |             0));\n 1396 | \n 1397 |         if (Count == 0)\n 1398 |           return D3D_OK;\n 1399 | \n 1400 |         if (pConstantData == nullptr)\n 1401 |           return D3DERR_INVALIDCALL;\n 1402 | \n 1403 |         if constexpr (ConstantType == D3D9ConstantType::Float) {\n 1404 |           const float* source = set->fConsts[StartRegister].data;\n 1405 |           const size_t size   = Count * sizeof(Vector4);\n 1406 | \n 1407 |           std::memcpy(pConstantData, source, size);\n 1408 |         }\n 1409 |         else if constexpr (ConstantType == D3D9ConstantType::Int) {\n 1410 |           const int*  source = set->iConsts[StartRegister].data;\n 1411 |           const size_t size  = Count * sizeof(Vector4i);\n 1412 | \n 1413 |           std::memcpy(pConstantData, source, size);\n 1414 |         }\n 1415 |         else {\n 1416 |           for (uint32_t i = 0; i < Count; i++) {\n 1417 |             const uint32_t constantIdx = StartRegister + i;\n 1418 |             const uint32_t arrayIdx    = constantIdx / 32;\n 1419 |             const uint32_t bitIdx      = constantIdx % 32;\n 1420 | \n 1421 |             const uint32_t bit         = (1u << bitIdx);\n 1422 | \n 1423 |             bool constValue = set->bConsts[arrayIdx] & bit;\n 1424 |             pConstantData[i] = constValue ? TRUE : FALSE;\n 1425 |           }\n 1426 |         }","lines":38,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d9/d3d9_device.h#L1389-L1426"}]},
{"id":"OVF_12","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"In `D3D9SWVPShaderGenerator::convertShader`, unmatched vertex-declaration byte offsets are padded with dummy UAV members and named via `str::format(\"unused\" + (unusedCount++)).c_str()`. `\"unused\"` decays to a `const char*`, so `\"unused\" + (unusedCount++)` performs **pointer arithmetic** (advancing the pointer by `unusedCount` bytes into the 7-byte string literal `\"unused\\0\"`), not string concatenation — `str::format` is a variadic template (`str::format(const Args&...)`) and was clearly meant to be called as `str::format(\"unused\", unusedCount++)`. For `unusedCount >= 7` the pointer already points past the end of the `\"unused\\0\"` literal, and `str::format` (via `operator<<`) will read from that dangling `const char*` until it happens to find a NUL byte, i.e. an out-of-bounds heap/rodata read of unbounded length, which can crash the process or leak adjacent memory into the shader's debug name. This is reachable because `element.Offset` (`D3D9CompactVertexElement::Offset`, sourced from the application-supplied `D3DVERTEXELEMENT9::Offset`, a `WORD`) can be up to 65535: the `while ((memberOffset = uavType.byteSize()) <= maxOffset)` loop pads every unmatched 4-byte-aligned offset up to `maxOffset`, so a vertex declaration with one element at a large `Offset` easily produces far more than 7 padding members, guaranteeing an out-of-bounds read of thousands of bytes.","fix":"Use `str::format` the way it is designed to be used, with the count as a separate argument so it gets stringified rather than added to the pointer:\n```cpp\nbuilder.add(ir::Op::DebugMemberName(uav, memberIndex,\n  str::format(\"unused\", unusedCount++).c_str()));\n```","locations":[{"ref":"src/d3d9/d3d9_swvp_emu.cpp:150-156","code":"  150 |         } else {\n  151 |           // No element found, pad with empty u32.\n  152 |           uavType.addStructMember(ir::ScalarType::eU32);\n  153 | \n  154 |           builder.add(ir::Op::DebugMemberName(uav, memberIndex,\n  155 |             str::format(\"unused\" + (unusedCount++)).c_str()));\n  156 |         }","lines":7,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d9/d3d9_swvp_emu.cpp#L150-L156"}]},
{"id":"OVF_13","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"In `Win32File`'s constructor the path is transcoded into a fixed buffer and then\nnull-terminated with `pathCvt[len] = '\\0'`. The buffer is `std::array<WCHAR, MAX_PATH + 1u>`\nand `transcodeString` is called with `dstLength = pathCvt.size()` (i.e. `MAX_PATH + 1`).\n`transcodeString` may fill the entire destination and return a `len` equal to `dstLength`\n(`MAX_PATH + 1`). Writing `pathCvt[MAX_PATH + 1]` is then one element past the end of the\narray, a stack buffer overflow. Note that `env::createDirectory` performs the identical\npattern but correctly passes `widePath.size() - 1u` as the length to reserve room for the\nterminator, confirming this is an oversight here.","fix":"Pass `pathCvt.size() - 1u` (i.e. `MAX_PATH`) as the destination length to `transcodeString` so index `len` is always in bounds, as done in `env::createDirectory`.","locations":[{"ref":"src/util/util_file.cpp:41-47","code":"   41 |       std::array<WCHAR, MAX_PATH + 1u> pathCvt;\n   42 | \n   43 |       size_t len = str::transcodeString(\n   44 |         pathCvt.data(), pathCvt.size(),\n   45 |         path.data(), path.size());\n   46 | \n   47 |       pathCvt[len] = '\\0';","lines":7,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/util/util_file.cpp#L41-L47"}]},
{"id":"OVF_14","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"In the GLFW backend `getDisplayMode`, the monitor array is indexed BEFORE the display-id validity check.\n`displayId` comes from `fromHmonitor(hMonitor)`, which returns `reinterpret_cast<intptr_t>(hMonitor) - 1`,\nso a null/invalid `HMONITOR` yields `-1`. The code does:\n```\nconst int32_t displayId = fromHmonitor(hMonitor);\nint32_t displayCount = 0;\nGLFWmonitor** monitors = glfwGetMonitors(&displayCount);\nGLFWmonitor* monitor = monitors[displayId];   // OOB read when displayId is -1 or >= displayCount\n\nif (!isDisplayValid(displayId))\n  return false;\n```\n`monitors[displayId]` is an out-of-bounds read (e.g. `monitors[-1]`) whenever `hMonitor` is invalid, and\n`monitors` itself can be `nullptr` if no monitors are present. Every sibling function in the same file\n(`getDesktopCoordinates`, `getCurrentDisplayMode`, `getDesktopDisplayMode`) performs the `isDisplayValid`\ncheck first - only `getDisplayMode` has the ordering wrong, indicating a copy-paste inconsistency.","fix":"Move the `isDisplayValid(displayId)` check above the `glfwGetMonitors`/`monitors[displayId]` access, mirroring\nthe other accessors:\n```\nconst int32_t displayId = fromHmonitor(hMonitor);\nif (!isDisplayValid(displayId))\n  return false;\n\nint32_t displayCount = 0;\nGLFWmonitor** monitors = glfwGetMonitors(&displayCount);\nGLFWmonitor* monitor = monitors[displayId];\n```","locations":[{"ref":"src/wsi/glfw/wsi_monitor_glfw.cpp:102-123","code":"  102 |   bool GlfwWsiDriver::getDisplayMode(\n  103 |       HMONITOR hMonitor,\n  104 |       uint32_t ModeNumber,\n  105 |       WsiMode* pMode) {\n  106 |     const int32_t displayId = fromHmonitor(hMonitor);\n  107 |     int32_t displayCount = 0;\n  108 |     GLFWmonitor** monitors = glfwGetMonitors(&displayCount);\n  109 |     GLFWmonitor* monitor = monitors[displayId];\n  110 | \n  111 |     if (!isDisplayValid(displayId))\n  112 |       return false;\n  113 | \n  114 |     int32_t count = 0;\n  115 |     const GLFWvidmode* modes = glfwGetVideoModes(monitor, &count);\n  116 | \n  117 |     if(ModeNumber >= uint32_t(count))\n  118 |       return false;\n  119 | \n  120 |     convertMode(modes[ModeNumber], pMode);\n  121 | \n  122 |     return true;\n  123 |   }","lines":22,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/wsi/glfw/wsi_monitor_glfw.cpp#L102-L123"}]},
{"id":"OVF_15","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"In `D3D11VideoContext::BlitStream`'s command-stream lambda, `srcRect`/`viewport` are derived directly from application-supplied `RECT`s (`cStreamState.srcRect`, `cStreamState.dstRect`) with no validation that `right >= left` / `bottom >= top`. `srcRect.extent.width/height` are `uint32_t` fields of a `VkRect2D`; if the app supplies an inverted or out-of-range rect, `right - left` (computed as signed `LONG` arithmetic) can be negative and then implicitly converts to a huge `uint32_t` when stored into `VkExtent2D`, producing a garbage `coordMatrix` scale and out-of-bounds texture sampling coordinates on the GPU. Similarly `viewport.width`/`viewport.height` (computed from `cStreamState.dstRect`) can end up negative, which is invalid for `vkCmdSetViewport` (viewport width/height must be >= 0) and will trigger validation errors or driver-dependent undefined rendering.","fix":"Clamp/validate the source and destination rectangles before using them, e.g. reject or clamp inverted rects when `VideoProcessorSetStreamSourceRect`/`VideoProcessorSetStreamDestRect` are called, or clamp `srcRect.extent`/`viewport.width`/`viewport.height` to be non-negative in `BlitStream` before building the UBO/viewport:\n```cpp\nLONG left = std::min(cStreamState.srcRect.left, cStreamState.srcRect.right);\nLONG right = std::max(cStreamState.srcRect.left, cStreamState.srcRect.right);\n// ... use left/right (and top/bottom) consistently\n```","locations":[{"ref":"src/d3d11/d3d11_video.cpp:1487-1505","code":" 1487 |       if (cStreamState.dstRectEnabled) {\n 1488 |         viewport.x      = cDstSizeFactX * float(cStreamState.dstRect.left);\n 1489 |         viewport.y      = cDstSizeFactY * float(cStreamState.dstRect.top);\n 1490 |         viewport.width  = cDstSizeFactX * float(cStreamState.dstRect.right) - viewport.x;\n 1491 |         viewport.height = cDstSizeFactY * float(cStreamState.dstRect.bottom) - viewport.y;\n 1492 |       }\n 1493 | \n 1494 |       VkExtent3D viewExtent = cViews[0]->mipLevelExtent(0);\n 1495 | \n 1496 |       VkRect2D srcRect;\n 1497 |       srcRect.offset = { 0, 0 };\n 1498 |       srcRect.extent = { viewExtent.width, viewExtent.height };\n 1499 | \n 1500 |       if (cStreamState.srcRectEnabled) {\n 1501 |         srcRect.offset.x      = cStreamState.srcRect.left;\n 1502 |         srcRect.offset.y      = cStreamState.srcRect.top;\n 1503 |         srcRect.extent.width  = cStreamState.srcRect.right - srcRect.offset.x;\n 1504 |         srcRect.extent.height = cStreamState.srcRect.bottom - srcRect.offset.y;\n 1505 |       }","lines":19,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d11/d3d11_video.cpp#L1487-L1505"}]},
{"id":"OVF_16","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`D3D11DepthStencilView::NormalizeDesc` clamps the array size with `if (pDesc->Texture1DArray.ArraySize > numLayers - pDesc->Texture1DArray.FirstArraySlice) pDesc->Texture1DArray.ArraySize = numLayers - pDesc->Texture1DArray.FirstArraySlice;` (and the same pattern for `Texture2DArray`/`Texture2DMSArray`). `numLayers` and `FirstArraySlice` are unsigned; if the application supplies a `FirstArraySlice` greater than the resource's actual array size (which is never validated before this point — `D3D11Device::CreateDepthStencilView` calls `NormalizeDesc` directly after copying the caller-supplied desc), `numLayers - FirstArraySlice` underflows to a huge value, the `>` comparison is false, and `ArraySize` is left unclamped. The out-of-range `FirstArraySlice`/`ArraySize` then flow into `viewInfo.layerIndex`/`layerCount` used to create the Vulkan image view, resulting in an out-of-bounds subresource range being requested from the driver.","fix":"Validate `FirstArraySlice` against `numLayers` before doing the subtraction, e.g.:\n```cpp\ncase D3D11_DSV_DIMENSION_TEXTURE1DARRAY:\n  if (pDesc->Texture1DArray.FirstArraySlice >= numLayers)\n    return E_INVALIDARG;\n  if (pDesc->Texture1DArray.ArraySize > numLayers - pDesc->Texture1DArray.FirstArraySlice)\n    pDesc->Texture1DArray.ArraySize = numLayers - pDesc->Texture1DArray.FirstArraySlice;\n  break;\n```\n(same fix applies to the `Texture2DARRAY` and `Texture2DMSARRAY` cases).","locations":[{"ref":"src/d3d11/d3d11_view_dsv.cpp:273-291","code":"  273 |     switch (pDesc->ViewDimension) {\n  274 |       case D3D11_DSV_DIMENSION_TEXTURE1DARRAY:\n  275 |         if (pDesc->Texture1DArray.ArraySize > numLayers - pDesc->Texture1DArray.FirstArraySlice)\n  276 |           pDesc->Texture1DArray.ArraySize = numLayers - pDesc->Texture1DArray.FirstArraySlice;\n  277 |         break;\n  278 |       \n  279 |       case D3D11_DSV_DIMENSION_TEXTURE2DARRAY:\n  280 |         if (pDesc->Texture2DArray.ArraySize > numLayers - pDesc->Texture2DArray.FirstArraySlice)\n  281 |           pDesc->Texture2DArray.ArraySize = numLayers - pDesc->Texture2DArray.FirstArraySlice;\n  282 |         break;\n  283 |       \n  284 |       case D3D11_DSV_DIMENSION_TEXTURE2DMSARRAY:\n  285 |         if (pDesc->Texture2DMSArray.ArraySize > numLayers - pDesc->Texture2DMSArray.FirstArraySlice)\n  286 |           pDesc->Texture2DMSArray.ArraySize = numLayers - pDesc->Texture2DMSArray.FirstArraySlice;\n  287 |         break;\n  288 |       \n  289 |       default:\n  290 |         break;\n  291 |     }","lines":19,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d11/d3d11_view_dsv.cpp#L273-L291"}]},
{"id":"OVF_17","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"very_easy","description":"`D3D8BatchBuffer::Lock()` performs no bounds checking whatsoever before handing back a pointer into its backing store:\n```cpp\nHRESULT STDMETHODCALLTYPE Lock(\n        UINT   OffsetToLock,\n        UINT   SizeToLock,\n        BYTE** ppbData,\n        DWORD  Flags) final {\n  *ppbData = m_data.data() + OffsetToLock;\n  return D3D_OK;\n}\n```\n`m_data` is a `std::vector<BYTE>` sized exactly to the buffer's `Length`. If `OffsetToLock` (or `OffsetToLock + SizeToLock`) exceeds `m_data.size()`, the returned pointer is out of bounds, and the caller (the game, writing vertex data) will write past the end of the heap allocation - a heap buffer overflow. Real `IDirect3DVertexBuffer9::Lock()` implementations validate the requested range; this shim silently hands out an invalid pointer instead.","fix":"Validate the requested range before returning the pointer, treating `SizeToLock == 0` as \"lock to end of buffer\" per D3D9/D3D8 convention:\n```cpp\nHRESULT STDMETHODCALLTYPE Lock(\n        UINT   OffsetToLock,\n        UINT   SizeToLock,\n        BYTE** ppbData,\n        DWORD  Flags) final {\n  UINT size = SizeToLock != 0 ? SizeToLock : (m_data.size() - OffsetToLock);\n  if (unlikely(ppbData == nullptr || OffsetToLock > m_data.size() || size > m_data.size() - OffsetToLock))\n    return D3DERR_INVALIDCALL;\n  *ppbData = m_data.data() + OffsetToLock;\n  return D3D_OK;\n}\n```","locations":[{"ref":"src/d3d8/d3d8_batch.h:32-39","code":"   32 |     HRESULT STDMETHODCALLTYPE Lock(\n   33 |             UINT   OffsetToLock,\n   34 |             UINT   SizeToLock,\n   35 |             BYTE** ppbData,\n   36 |             DWORD  Flags) final {\n   37 |       *ppbData = m_data.data() + OffsetToLock;\n   38 |       return D3D_OK;\n   39 |     }","lines":8,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d8/d3d8_batch.h#L32-L39"}]},
{"id":"OVF_18","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`D3D9CommonTexture::AddDirtyBox()` only clamps the high side of each axis of the incoming `D3DBOX` to the texture dimensions (`box.Right = std::min(box.Right, m_desc.Width); box.Bottom = std::min(box.Bottom, m_desc.Height); box.Back = std::min(box.Back, m_desc.Depth);`), but never clamps `box.Left`, `box.Top`, or `box.Front`. The only earlier validation is `box.Right <= box.Left || box.Bottom <= box.Top || box.Back <= box.Front` (rejecting degenerate/inverted boxes as given). If `Left`/`Top`/`Front` is at or beyond the texture dimension while `Right`/`Bottom`/`Back` is larger still (a case the early-out does not catch), the subsequent clamp can make `Right < Left` (etc.), silently storing an inverted `D3DBOX` in `m_dirtyBoxes`. Consumers of `GetDirtyBox()` compute extents as `Right - Left` etc. on unsigned `UINT` fields, so an inverted box underflows to a huge value, which can propagate into copy/upload size calculations.","fix":"Also clamp the low side of the box before storing it, e.g. `box.Left = std::min(box.Left, m_desc.Width); box.Top = std::min(box.Top, m_desc.Height); box.Front = std::min(box.Front, m_desc.Depth);` (clamped before the `Right`/`Bottom`/`Back` clamps), or re-validate `Right > Left && Bottom > Top && Back > Front` after clamping and drop the box if it became degenerate.","locations":[{"ref":"src/d3d9/d3d9_common_texture.h:406-432","code":"  406 |     void AddDirtyBox(CONST D3DBOX* pDirtyBox, uint32_t layer) {\n  407 |       if (pDirtyBox) {\n  408 |         D3DBOX box = *pDirtyBox;\n  409 |         if (box.Right <= box.Left\n  410 |           || box.Bottom <= box.Top\n  411 |           || box.Back <= box.Front)\n  412 |           return;\n  413 | \n  414 |         box.Right = std::min(box.Right, m_desc.Width);\n  415 |         box.Bottom = std::min(box.Bottom, m_desc.Height);\n  416 |         box.Back = std::min(box.Back, m_desc.Depth);\n  417 | \n  418 |         D3DBOX& dirtyBox = m_dirtyBoxes[layer];\n  419 |         if (dirtyBox.Left == dirtyBox.Right) {\n  420 |           dirtyBox = box;\n  421 |         } else {\n  422 |           dirtyBox.Left    = std::min(dirtyBox.Left,   box.Left);\n  423 |           dirtyBox.Right   = std::max(dirtyBox.Right,  box.Right);\n  424 |           dirtyBox.Top     = std::min(dirtyBox.Top,    box.Top);\n  425 |           dirtyBox.Bottom  = std::max(dirtyBox.Bottom, box.Bottom);\n  426 |           dirtyBox.Front   = std::min(dirtyBox.Front,  box.Front);\n  427 |           dirtyBox.Back    = std::max(dirtyBox.Back,   box.Back);\n  428 |         }\n  429 |       } else {\n  430 |         m_dirtyBoxes[layer] = { 0, 0, m_desc.Width, m_desc.Height, 0, m_desc.Depth };\n  431 |       }\n  432 |     }","lines":27,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d9/d3d9_common_texture.h#L406-L432"}]},
{"id":"OVF_19","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"`D3D9CommonTexture::m_totalSize` and the per-subresource `m_memoryOffset` array are declared as `uint32_t` (`src/d3d9/d3d9_common_texture.h:509-515`), while they are accumulated from `GetMipSize()`, which returns a 64-bit `VkDeviceSize`: `m_memoryOffset[i] = m_totalSize; m_totalSize += GetMipSize(i);` (`src/d3d9/d3d9_common_texture.cpp:87-90`). For texture arrays/cubemaps/mip chains of large uncompressed formats, the cumulative size across subresources can exceed 4 GiB even though each individual `GetMipSize()` call is well below that (and even if the overflow described in the sibling finding is fixed). When the running `uint32_t` total wraps, `paddedSize` passed to `CreateBuffer()`/`MemoryFileRegion` allocation becomes far smaller than the real data footprint, and `m_memoryOffset[i]` for later subresources becomes wrong/aliased, causing out-of-bounds writes when subresources are locked and populated at their (corrupted) offsets.","fix":"Widen `m_totalSize` and `m_memoryOffset` (and the related `GetTotalSize()`/`CreateBuffer()` size parameter) to `VkDeviceSize`/`uint64_t`, or explicitly clamp/reject texture descriptors whose total footprint would not fit in 32 bits before creating the resource.","locations":[{"ref":"src/d3d9/d3d9_common_texture.h:509-515","code":"  509 |     D3D9SubresourceArray<\n  510 |       uint64_t>                   m_seqs = { };\n  511 | \n  512 |     D3D9SubresourceArray<\n  513 |       uint32_t>                   m_memoryOffset = { };\n  514 |     \n  515 |     uint32_t                      m_totalSize = 0;","lines":7,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d9/d3d9_common_texture.h#L509-L515"},{"ref":"src/d3d9/d3d9_common_texture.cpp:87-90","code":"   87 |     for (uint32_t i = 0; i < CountSubresources(); i++) {\n   88 |       m_memoryOffset[i] = m_totalSize;\n   89 |       m_totalSize += GetMipSize(i);\n   90 |     }","lines":4,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d9/d3d9_common_texture.cpp#L87-L90"}]},
{"id":"OVF_20","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`D3D9Options::textureMemory` is declared as `int32_t` (see `d3d9_options.h:154`), but it is computed as `config.getOption<int32_t>(\"d3d9.textureMemory\", 100) << 20` (megabytes to bytes). Left-shifting a signed 32-bit value by 20 overflows (undefined behaviour) for any configured value of `2048` MB (2 GiB) or more, which silently wraps to a negative/garbage value. This value is later reinterpreted as `uint32_t` in `D3D9DeviceEx` (e.g. `uint32_t(m_d3d9Options.textureMemory)` and `m_d3d9Options.textureMemory / 4`), so a user who sets `d3d9.textureMemory` to a large-but-reasonable value (several GB, which is a realistic override for modern GPUs) ends up with a corrupted texture-memory budget/threshold instead of the intended value.","fix":"Perform the shift in a wider type and clamp before truncating back to the stored type:\n```cpp\nthis->textureMemory = int32_t(std::min<int64_t>(\n  int64_t(config.getOption<int32_t>(\"d3d9.textureMemory\", 100)) << 20,\n  int64_t(INT32_MAX)));\n```\nor simply widen `D3D9Options::textureMemory` to `int64_t`/`uint64_t`.","locations":[{"ref":"src/d3d9/d3d9_options.cpp:73","code":"   73 |     this->textureMemory                 = config.getOption<int32_t>     (\"d3d9.textureMemory\",                 100) << 20;","lines":1,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d9/d3d9_options.cpp#L73"},{"ref":"src/d3d9/d3d9_options.h:154","code":"  154 |     int32_t textureMemory;","lines":1,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d9/d3d9_options.h#L154"}]},
{"id":"OVF_21","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`D3D9ShaderAnalysis::HandleTextureSample` computes `samplerIndex` from `dst.getIndex()`/`src1.getIndex()` (an unvalidated 11-bit field taken directly from shader bytecode, range 0-2047) and then does `m_usedSamplers |= 1u << samplerIndex;`. `m_usedSamplers` is a `uint32_t`, so shifting by 32 or more is undefined behavior in C++ (and on most platforms silently masks the shift amount, setting an unintended bit). The same unvalidated-shift pattern also occurs in `HandleDcl` via `m_usedSamplers |= 1u << index;`. Because `index`/`samplerIndex` are attacker/application controlled through shader bytecode, a malformed shader can trigger this UB, producing an incorrect sampler usage mask (and, per the compiler, potentially other miscompiled behavior) instead of just being rejected.","fix":"Bound the register index (e.g. to `caps::MaxTexturesPS`/`caps::MaxTexturesVS`, matching the 16-entry `m_imageViewTypes` array) before using it in a shift or array index, rejecting the shader (return `false` from `HandleInstruction`) if it is out of range.","locations":[{"ref":"src/d3d9/d3d9_shader_analysis.cpp:269","code":"  269 |     m_usedSamplers |= 1u << samplerIndex;","lines":1,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d9/d3d9_shader_analysis.cpp#L269"},{"ref":"src/d3d9/d3d9_shader_analysis.cpp:297","code":"  297 |       m_usedSamplers |= 1u << index;","lines":1,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d9/d3d9_shader_analysis.cpp#L297"}]},
{"id":"OVF_22","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`DecodeMultiSampleType()` computes the sample count for `D3DMULTISAMPLE_NONMASKABLE` as `sampleCount = 1u << MultisampleQuality;` (`src/d3d9/d3d9_util.cpp:47-48`) *before* validating that the value is in range. `MultisampleQuality` is a `DWORD` taken directly from application-supplied `D3DPRESENT_PARAMETERS`/texture-creation parameters (see callers in `src/d3d9/d3d9_common_texture.cpp:187,426` and `src/d3d9/d3d9_device.cpp:8520,8561`) and is never validated before reaching this function. If an application passes `D3DMULTISAMPLE_NONMASKABLE` together with a `MultisampleQuality >= 32`, the shift `1u << MultisampleQuality` is undefined behavior (shift amount exceeding the width of `unsigned int`), long before the subsequent `if (sampleCount > 16u) return D3DERR_INVALIDCALL;` bounds check has a chance to reject the value.","fix":"Clamp/validate `MultisampleQuality` before shifting:\n```cpp\nif (MultiSample == D3DMULTISAMPLE_NONMASKABLE) {\n  if (MultisampleQuality >= 32)\n    return D3DERR_INVALIDCALL;\n  sampleCount = 1u << MultisampleQuality;\n}\n```","locations":[{"ref":"src/d3d9/d3d9_util.cpp:41-63","code":"   41 |   HRESULT DecodeMultiSampleType(\n   42 |           D3DMULTISAMPLE_TYPE       MultiSample,\n   43 |           DWORD                     MultisampleQuality,\n   44 |           VkSampleCountFlagBits*    pSampleCount) {\n   45 |     uint32_t sampleCount = std::max<uint32_t>(MultiSample, 1u);\n   46 | \n   47 |     if (MultiSample == D3DMULTISAMPLE_NONMASKABLE)\n   48 |       sampleCount = 1u << MultisampleQuality;\n   49 | \n   50 |     // 16 is the largest entry in the D3DMULTISAMPLE_TYPE enum\n   51 |     // and the largest sample count realistically supported by any hardware.\n   52 |     if (sampleCount > 16u)\n   53 |       return D3DERR_INVALIDCALL;\n   54 | \n   55 |     // Check if this is a power of two...\n   56 |     if (sampleCount & (sampleCount - 1))\n   57 |       return D3DERR_NOTAVAILABLE;\n   58 | \n   59 |     if (pSampleCount)\n   60 |       *pSampleCount = VkSampleCountFlagBits(sampleCount);\n   61 | \n   62 |     return D3D_OK;\n   63 |   }","lines":23,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d9/d3d9_util.cpp#L41-L63"}]},
{"id":"OVF_23","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"hard","description":"`DxvkImage::queryLayout(const VkImageSubresourceRange&)` derives the aspect used to look up the\nreference layout with `subresources.aspectMask & (subresources.aspectMask - 1u)`, which *clears\nthe lowest set aspect bit* rather than isolating a single aspect:\n\n```\nsubresource.aspectMask = subresources.aspectMask & (subresources.aspectMask - 1u);\n...\nVkImageLayout baseLayout = queryLayout(subresource);\n```\n`queryLayout(subresource)` feeds that aspect into `computeSubresourceIndex`, which calls\n`vk::getPlaneIndex(aspect)` (`aspect / VK_IMAGE_ASPECT_PLANE_1_BIT`). For a 3-plane format the\nrange mask is `PLANE_0|PLANE_1|PLANE_2` (`0x70`); clearing the low bit leaves `0x60`\n(`PLANE_1|PLANE_2`), and `getPlaneIndex(0x60)` returns `3`, an out-of-range plane index. The\nresulting subresource index then reads `m_localLayouts` (sized `numLayers*mipLevels*planeCount`)\nout of bounds. Single-aspect (color) and 2-plane cases happen to work by coincidence, masking\nthe bug.","fix":"Isolate the lowest set aspect instead of clearing it: use `subresources.aspectMask & (~subresources.aspectMask + 1u)` (i.e. `mask & -mask`), which yields a single valid aspect (`COLOR`, `DEPTH`, or `PLANE_0`) for all format classes.","locations":[{"ref":"src/dxvk/dxvk_image.cpp:467-472","code":"  467 |     VkImageSubresource subresource = { };\n  468 |     subresource.aspectMask = subresources.aspectMask & (subresources.aspectMask - 1u);\n  469 |     subresource.mipLevel = subresources.baseMipLevel;\n  470 |     subresource.arrayLayer = subresources.baseArrayLayer;\n  471 | \n  472 |     VkImageLayout baseLayout = queryLayout(subresource);","lines":6,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_image.cpp#L467-L472"}]},
{"id":"OVF_24","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"In `DxvkReflexLatencyTrackerNv::getFrameReports`, `gpuActiveTime` is computed as `currFrame.gpuExecEnd - currFrame.gpuExecStart - currFrame.gpuIdleTime`, which can be negative (e.g. when the frame never executed on the GPU so both timestamps are default `time_point()`, or when accumulated `gpuIdleTime` exceeds the exec span). `.count()` returns a signed `int64_t`; passing it to `std::max<uint64_t>(0u, ...)` implicitly converts the negative value to a huge `uint64_t`, so the intended clamp-to-zero is defeated and a bogus multi-billion microsecond `gpuActiveTimeUs` is reported.","fix":"Clamp the signed duration before converting to unsigned, e.g.:\n```cpp\nauto gpuActiveUs = std::chrono::duration_cast<std::chrono::microseconds>(gpuActiveTime).count();\nreports[i].gpuActiveTimeUs = gpuActiveUs > 0 ? uint64_t(gpuActiveUs) : 0u;\n```","locations":[{"ref":"src/dxvk/dxvk_latency_reflex.cpp:428-432","code":"  428 |       auto gpuActiveTime = currFrame.gpuExecEnd - currFrame.gpuExecStart - currFrame.gpuIdleTime;\n  429 | \n  430 |       reports[i].report = report;\n  431 |       reports[i].gpuActiveTimeUs = std::max<uint64_t>(0u,\n  432 |         std::chrono::duration_cast<std::chrono::microseconds>(gpuActiveTime).count());","lines":5,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_latency_reflex.cpp#L428-L432"}]},
{"id":"OVF_25","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`D3D9ConstantBufferCopy::writeBoolRange()` processes `range.count` bool constants using SSE loads/stores of 4 `int`s (16 bytes) at a time, incrementing the loop counter by 4 regardless of whether `range.count` is a multiple of 4: `for (uint32_t i = 0u; i < range.count; i += 4u) { auto data = _mm_loadu_si128(...srcPtr + i...); _mm_stream_si128(...dstPtr + i..., data); }`. If a range's `count` is not a multiple of 4 (possible for statically-indexed layouts built by the generic `D3D9ConstantBufferLayout` constructors, which pack ranges tightly based on shader use-masks), the final iteration reads/writes up to 3 `int`s past the end of the intended range, i.e. past the end of `args.constBoolApi`/`args.boolBuffer` if the range ends at the boundary of the underlying array. Current call sites in `d3d9_device.cpp` happen to back the bool source with an oversized array (`D3D9ShaderConstantsVSSoftware::bConsts[64]`) and force `boolBufferSize = 0` for pixel shaders, which masks the issue today, but the helper itself has no such guarantee built in and is fragile to future callers or reordering.","fix":"Either pad every source/destination bool buffer to a multiple of 16 bytes unconditionally, or fall back to the scalar `std::memcpy` path (already present in the `#else` branch) whenever `range.count % 4 != 0`, mirroring the safer element-at-a-time approach used in `writeIntRange()`.","locations":[{"ref":"src/d3d9/d3d9_constant_copy.cpp:368-381","code":"  368 |   void D3D9ConstantBufferCopy::writeBoolRange(const D3D9ConstantBufferCopyArgs& args, const D3D9ConstantRange& range) const {\n  369 |     #if defined(DXVK_ARCH_X86) && (defined(__GNUC__) || defined(__clang__) || defined(_MSC_VER))\n  370 |     auto dstPtr = reinterpret_cast<      int*>(args.boolBuffer) + range.dstIndex;\n  371 |     auto srcPtr = reinterpret_cast<const int*>(args.constBoolApi) + range.srcIndex;\n  372 | \n  373 |     for (uint32_t i = 0u; i < range.count; i += 4u) {\n  374 |       auto data = _mm_loadu_si128(reinterpret_cast<const __m128i*>(srcPtr + i));\n  375 |       _mm_stream_si128(reinterpret_cast<__m128i*>(dstPtr + i), data);\n  376 |     }\n  377 |     #else\n  378 |     std::memcpy(reinterpret_cast<uint32_t*>(args.boolBuffer) + range.dstIndex,\n  379 |       args.constBoolApi + range.srcIndex, range.count * sizeof(uint32_t));\n  380 |     #endif\n  381 |   }","lines":14,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d9/d3d9_constant_copy.cpp#L368-L381"}]},
{"id":"OVF_26","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"In `DxvkDevice::createBuiltInGraphicsPipeline` the sample mask is built with\n`uint32_t sampleMask = (1u << uint32_t(state.sampleCount)) - 1u;`. `state.sampleCount`\nis a `VkSampleCountFlagBits` whose numeric value equals the sample count, so for\n`VK_SAMPLE_COUNT_32_BIT` (`32`) or `VK_SAMPLE_COUNT_64_BIT` (`64`) the expression\nevaluates `1u << 32` / `1u << 64`. Shifting a 32-bit `unsigned int` by `>= 32` is\nundefined behavior, producing a garbage sample mask (and a compiler-dependent result).","fix":"Perform the shift in a 64-bit type and/or clamp, e.g.\n`uint32_t sampleMask = uint32_t((1ull << uint32_t(state.sampleCount)) - 1ull);`\n(and note that a 64-sample mask cannot be represented in 32 bits, so this path should\nbe reconsidered if `VK_SAMPLE_COUNT_64_BIT` is ever actually used).","locations":[{"ref":"src/dxvk/dxvk_device.cpp:398","code":"  398 |     uint32_t sampleMask = (1u << uint32_t(state.sampleCount)) - 1u;","lines":1,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_device.cpp#L398"}]},
{"id":"OVF_27","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`DxvkShaderCache::writeShaderIo()` writes the variable count truncated to a single byte (`write(stream, uint8_t(io.getVarCount()))`) but then iterates over the full `io.getVarCount()` (a `uint32_t`) writing every variable. `readShaderIo()` reads back a `uint8_t varCount` and reads only that many variables. If a shader ever has more than 255 I/O variables, the on-disk count wraps (e.g. 300 -> 44) while all 300 variable records are still written. On read-back only 44 are consumed and the remaining serialized bytes are misinterpreted as the following metadata fields (topologies, xfb strides, layout, etc.), silently corrupting the deserialized shader. The IR checksum only covers the IR blob, not this metadata, so the corruption is not detected.","fix":"Use a width that cannot silently wrap for the persisted count (e.g. `uint32_t`) on both the write (`writeShaderIo`) and read (`readShaderIo`) sides, or assert/bail when `io.getVarCount() > 255`. The write count type and read count type must match and must not truncate the real element count.","locations":[{"ref":"src/dxvk/dxvk_shader_cache.cpp:548-564","code":"  548 |   bool DxvkShaderCache::writeShaderIo(util::File& stream, const DxvkShaderIo& io) {\n  549 |     bool status = write(stream, uint8_t(io.getVarCount()));\n  550 | \n  551 |     for (uint32_t i = 0u; i < io.getVarCount(); i++) {\n  552 |       const auto& var = io.getVar(i);\n  553 | \n  554 |       status = status && write(stream, var.builtIn)\n  555 |                       && write(stream, var.location)\n  556 |                       && write(stream, var.componentIndex)\n  557 |                       && write(stream, var.componentCount)\n  558 |                       && write(stream, var.isPatchConstant)\n  559 |                       && write(stream, var.semanticIndex)\n  560 |                       && writeString(stream, var.semanticName);\n  561 |     }\n  562 | \n  563 |     return status;\n  564 |   }","lines":17,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_shader_cache.cpp#L548-L564"},{"ref":"src/dxvk/dxvk_shader_cache.cpp:324-346","code":"  324 |   bool DxvkShaderCache::readShaderIo(util::File& stream, size_t& offset, DxvkShaderIo& io) {\n  325 |     uint8_t varCount = 0u;\n  326 | \n  327 |     if (!read(stream, offset, varCount))\n  328 |       return false;\n  329 | \n  330 |     for (uint32_t i = 0u; i < varCount; i++) {\n  331 |       DxvkShaderIoVar var = { };\n  332 | \n  333 |       if (!read(stream, offset, var.builtIn)\n  334 |        || !read(stream, offset, var.location)\n  335 |        || !read(stream, offset, var.componentIndex)\n  336 |        || !read(stream, offset, var.componentCount)\n  337 |        || !read(stream, offset, var.isPatchConstant)\n  338 |        || !read(stream, offset, var.semanticIndex)\n  339 |        || !readString(stream, offset, var.semanticName))\n  340 |         return false;\n  341 | \n  342 |       io.add(std::move(var));\n  343 |     }\n  344 | \n  345 |     return true;\n  346 |   }","lines":23,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_shader_cache.cpp#L324-L346"}]},
{"id":"OVF_28","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`DxvkShaderHash`'s constructor folds the input hashes 4 bytes at a time using `getDword(&hash[i])`, which unconditionally dereferences `dw[0..3]`:\n```\nfor (size_t i = 0u; i < hashSize; i += 4u)\n  m_hash[index] ^= getDword(&hash[i]);\n```\nIf `hashSize` (or `metaSize`) is not a multiple of 4, the final iteration reads up to 3 bytes past the end of the supplied buffer (out-of-bounds read). Current callers in `d3d11_device.cpp` happen to pass a container hash and an MD5 digest, both multiples of 4, so it is latent, but the public constructor documents only \"hash size, in bytes\" and enforces no such constraint.","fix":"Guard the tail: only fold complete dwords (`i + 4u <= hashSize`) and handle any remaining `hashSize % 4` bytes by loading them into a zero-padded temporary, or assert that `hashSize` and `metaSize` are multiples of 4.","locations":[{"ref":"src/dxvk/dxvk_shader_key.cpp:28-37","code":"   28 |     for (size_t i = 0u; i < hashSize; i += 4u) {\n   29 |       m_hash[index] ^= getDword(&hash[i]);\n   30 |       index = (index + 1u) % m_hash.size();\n   31 |     }\n   32 | \n   33 |     for (size_t i = 0u; i < metaSize; i += 4u) {\n   34 |       m_hash[index] ^= getDword(&metaHash[i]);\n   35 |       index = (index + 1u) % m_hash.size();\n   36 |     }\n   37 |   }","lines":10,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_shader_key.cpp#L28-L37"},{"ref":"src/dxvk/dxvk_shader_key.cpp:96-101","code":"   96 |   size_t DxvkShaderHash::getDword(const uint8_t* dw) {\n   97 |     return  (uint32_t(dw[0u]))\n   98 |           | (uint32_t(dw[1u]) << 8u)\n   99 |           | (uint32_t(dw[2u]) << 16u)\n  100 |           | (uint32_t(dw[3u]) << 24u);\n  101 |   }","lines":6,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_shader_key.cpp#L96-L101"}]},
{"id":"OVF_29","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`computeSnorm` returns a signed value reinterpreted as `uint32_t`: `return int32_t((f * float((1u << (bits - 1u)) - 1u)) + (f < 0.0f ? -0.5f : 0.5f));`. For a negative input (e.g. `f = -0.5f`, `bits = 8`) the result is a negative `int32_t` (e.g. `-64`) that becomes `0xFFFFFFC0` when widened to `uint32_t`. `encodeClearBlockValue` then stores this value directly into `result.uint32[0]` (and `result.uint32[2]` for BC5) without masking to the intended 8 bits. The upper `0xFFFFFF` bytes spill into the block's `red1` byte and index bits, so the encoded BC4_SNORM / BC5_SNORM clear block no longer represents a uniform color for negative clear values. This path is reachable from the D3D9 compressed-image clear code (`d3d9_device.cpp` calls `util::encodeClearBlockValue`).","fix":"Mask the encoded SNORM byte(s) to the relevant width before packing, e.g. in the BC4/BC5 SNORM cases:\n```cpp\nresult.uint32[0] = computeSnorm(color.float32[0], 8) & 0xffu;\n```\n(and likewise for `result.uint32[2]` in the BC5 case), or have `computeSnorm` itself return the value masked to `bits`.","locations":[{"ref":"src/dxvk/dxvk_util.h:585-601","code":"  585 |       case VK_FORMAT_BC4_SNORM_BLOCK: {\n  586 |         result.uint32[0] = computeSnorm(color.float32[0], 8);\n  587 |       } return result;\n  588 | \n  589 |       case VK_FORMAT_BC4_UNORM_BLOCK: {\n  590 |         result.uint32[0] = computeUnorm(color.float32[0], 8);\n  591 |       } return result;\n  592 | \n  593 |       case VK_FORMAT_BC5_SNORM_BLOCK: {\n  594 |         result.uint32[0] = computeSnorm(color.float32[0], 8);\n  595 |         result.uint32[2] = computeSnorm(color.float32[1], 8);\n  596 |       } return result;\n  597 | \n  598 |       case VK_FORMAT_BC5_UNORM_BLOCK: {\n  599 |         result.uint32[0] = computeUnorm(color.float32[0], 8);\n  600 |         result.uint32[2] = computeUnorm(color.float32[1], 8);\n  601 |       } return result;","lines":17,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_util.h#L585-L601"},{"ref":"src/dxvk/dxvk_util.h:532-536","code":"  532 |   inline uint32_t computeSnorm(float f, uint32_t bits) {\n  533 |     f = std::max(f, -1.0f);\n  534 |     f = std::min(f,  1.0f);\n  535 |     return int32_t((f * float((1u << (bits - 1u)) - 1u)) + (f < 0.0f ? -0.5f : 0.5f));\n  536 |   }","lines":5,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_util.h#L532-L536"}]},
{"id":"OVF_30","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`Config::parseOptionValue(const std::string&, int32_t&)` accumulates the value with `intval *= 10; intval += value[i] - '0';` on a signed `int32_t` with no range check. A config value with more digits than fit in `int32_t` (e.g. `dxgi.maxFrameRate = 99999999999`) causes signed integer overflow, which is undefined behavior, and yields a garbage result that is still reported as successfully parsed (`return true`).","fix":"Accumulate into a wider unsigned type and reject values that exceed the representable `int32_t` range (returning `false`), or use `std::from_chars` which reports overflow via `std::errc::result_out_of_range`.","locations":[{"ref":"src/util/config/config.cpp:1610-1622","code":" 1610 |     int32_t intval = 0;\n 1611 | \n 1612 |     for (size_t i = start; i < value.size(); i++) {\n 1613 |       if (value[i] < '0' || value[i] > '9')\n 1614 |         return false;\n 1615 | \n 1616 |       intval *= 10;\n 1617 |       intval += value[i] - '0';\n 1618 |     }\n 1619 | \n 1620 |     // Apply sign and return\n 1621 |     result = sign * intval;\n 1622 |     return true;","lines":13,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/util/config/config.cpp#L1610-L1622"}]},
{"id":"OVF_31","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`bit::unpack` computes the field mask as `(T(1) << count) - 1`. When `count` equals the bit\nwidth of `T` (e.g. `count == 32` for `uint32_t`), the shift `T(1) << count` is undefined\nbehavior in C++ (shift count >= type width). The author guarded the store with\n`shift < Bits` but did not guard the mask against a full-width `count`. `pack` avoids the\nissue since it does not build such a mask.","fix":"Guard the full-width case, e.g. `T mask = count >= Bits ? ~T(0) : ((T(1) << count) - 1);` and use `mask` in the store.","locations":[{"ref":"src/util/util_bit.h:216-223","code":"  216 |   template<typename T>\n  217 |   uint32_t unpack(T& dst, T src, uint32_t& shift, uint32_t count) {\n  218 |     constexpr uint32_t Bits = 8 * sizeof(T);\n  219 |     if (likely(shift < Bits))\n  220 |       dst = (src >> shift) & ((T(1) << count) - 1);\n  221 |     shift += count;\n  222 |     return shift > Bits ? shift - Bits : 0;\n  223 |   }","lines":8,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/util/util_bit.h#L216-L223"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`D3D8Batcher::DrawPrimitive()`'s `D3DPT_TRIANGLESTRIP` case builds a corrupted index list. A triangle strip of `N` triangles needs `N+2` vertex indices, but the trailing loop only appends `PrimitiveCount` (`N`) indices (`batch->Indices[batch->Offset++] = (StartVertex + i + 0);` for `i` in `[0, N)`), never writing the final two vertices of the strip. `batch->Indices` was `resize()`d to `batch->Offset + PrimitiveCount + 2`, so those last two slots are left as whatever `std::vector::resize()` default-initializes them to (`0` for `uint16_t`), instead of the intended geometry.\n\nThe join path (taken when `batch->Offset > 0`, i.e. when a second `D3DPT_TRIANGLESTRIP` draw call is being stitched onto a previous one with a degenerate triangle) is similarly off-by-one: `batch->Indices[batch->Offset + 1] = batch->Indices[batch->Offset-2];` and `batch->Indices[batch->Offset += 2] = StartVertex;` only ever write to slots `Offset+1` and `Offset+2`, leaving slot `Offset` (which should repeat the previous strip's last vertex to form the degenerate join triangle) as an unwritten `0`.\n\nBoth cases leave stray `0` index values inside the batched index buffer. Later, `D3D8Batcher::StateChange()` does `for (auto& index : draw.Indices) index -= draw.MinVertex;` on `uint16_t` indices - subtracting `MinVertex` from a leftover `0` entry underflows the `uint16_t`, producing a huge index value. That index is then used with `DrawIndexedPrimitiveUP()` against the batch vertex buffer (`m_stream->GetPtr(draw.MinVertex * m_stride)`), causing an out-of-bounds read of the `D3D8BatchBuffer`'s backing `std::vector<BYTE>` in addition to rendering visibly broken/garbled triangle strips whenever the `d3d8.batching` option is enabled and the game uses `D3DPT_TRIANGLESTRIP`.","fix":"Write all `PrimitiveCount + 2` strip vertices, and correctly place the degenerate-join indices. For example:\n```cpp\ncase D3DPT_TRIANGLESTRIP:\n  // Join with degenerate triangle\n  // 1 2 3, 3 4, 4 5 6\n  batch->Indices.resize(batch->Offset + PrimitiveCount + 2);\n  if (batch->Offset > 0) {\n    batch->Indices[batch->Offset]     = batch->Indices[batch->Offset - 1];\n    batch->Indices[batch->Offset + 1] = StartVertex;\n    batch->Offset += 2;\n  }\n  for (uint32_t i = 0; i < PrimitiveCount + 2; i++) {\n    batch->Indices[batch->Offset++] = (StartVertex + i);\n  }\n  break;\n```\n(Adjust indices/counts to match whatever exact join convention is intended, but the key fix is that the un-joined path must emit `PrimitiveCount + 2` indices, and the joined path must not leave any slot unwritten.)","locations":[{"ref":"src/d3d8/d3d8_batch.h:183-194","code":"  183 |         case D3DPT_TRIANGLESTRIP:\n  184 |           // Join with degenerate triangle\n  185 |           // 1 2 3, 3 4, 4 5 6\n  186 |           batch->Indices.resize(batch->Offset + PrimitiveCount + 2);\n  187 |           if (batch->Offset > 0) {\n  188 |             batch->Indices[batch->Offset + 1] = batch->Indices[batch->Offset-2];\n  189 |             batch->Indices[batch->Offset += 2] = StartVertex;\n  190 |           }\n  191 |           for (uint32_t i = 0; i < PrimitiveCount; i++) {\n  192 |             batch->Indices[batch->Offset++] = (StartVertex + i + 0);\n  193 |           }\n  194 |           break;","lines":12,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d8/d3d8_batch.h#L183-L194"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`allocateScratchMemory()` has inverted suballocation logic that both defeats the ring-buffer allocation and can produce out-of-bounds slices. It computes an aligned `offset` but then (a) reallocates/resets when the slice *does* fit (`if (offset + size < m_scratchBuffer->info().size)`) instead of when it does *not* fit, (b) resets `m_scratchOffset = 0u` and returns a slice at the stale `m_scratchOffset` (via `getSliceInfo(m_scratchOffset, size)`) rather than at the computed `offset`, and (c) advances with `m_scratchOffset += align(size, alignment)` instead of setting it to `offset + size`. When a request does not fit (`offset + size >= m_scratchBuffer->info().size`), no reset happens and `getSliceInfo(m_scratchOffset, size)` returns a slice that runs past the end of the backing buffer, causing GPU out-of-bounds access. In the common (fitting) case it needlessly discards and reallocates scratch storage on every call. `offset` is effectively dead since the slice is taken at `m_scratchOffset`.","fix":"Reset only when the slice does not fit and take the slice at the aligned `offset`:\n```cpp\nVkDeviceSize offset = align(m_scratchOffset, alignment);\n\nif (offset + size > m_scratchBuffer->info().size) {\n  invalidateBuffer(m_scratchBuffer, m_scratchBuffer->allocateStorage());\n  offset = 0u;\n}\n\nDxvkResourceBufferInfo slice = m_scratchBuffer->getSliceInfo(offset, size);\nm_scratchOffset = offset + size;\n```","locations":[{"ref":"src/dxvk/dxvk_context.cpp:10973-10981","code":"10973 |     VkDeviceSize offset = align(m_scratchOffset, alignment);\n10974 | \n10975 |     if (offset + size < m_scratchBuffer->info().size) {\n10976 |       invalidateBuffer(m_scratchBuffer, m_scratchBuffer->allocateStorage());\n10977 |       m_scratchOffset = 0u;\n10978 |     }\n10979 | \n10980 |     DxvkResourceBufferInfo slice = m_scratchBuffer->getSliceInfo(m_scratchOffset, size);\n10981 |     m_scratchOffset += align(size, alignment);","lines":9,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_context.cpp#L10973-L10981"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`DxvkGpuQueryAllocator::allocQuery()` dereferences a null pointer if query pool\ncreation fails. When `m_free` is null it calls `createQueryPool()`, but\n`createQueryPool()` only logs an error and returns without setting `m_free` when\n`vkCreateQueryPool` fails. Control then reaches\n`return std::exchange(m_free, m_free->m_next);` where `m_free` is still `nullptr`,\nso `m_free->m_next` is a null-pointer dereference and the process crashes.","fix":"Check for allocation failure before dereferencing, e.g. after\n`if (!m_free) createQueryPool();` add `if (!m_free) return nullptr;` and make\ncallers tolerate a null query, or propagate the failure from `createQueryPool()`.","locations":[{"ref":"src/dxvk/dxvk_gpu_query.cpp:195-202","code":"  195 |   Rc<DxvkGpuQuery> DxvkGpuQueryAllocator::allocQuery() {\n  196 |     std::lock_guard<dxvk::mutex> lock(m_mutex);\n  197 | \n  198 |     if (!m_free)\n  199 |       createQueryPool();\n  200 | \n  201 |     return std::exchange(m_free, m_free->m_next);\n  202 |   }","lines":8,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_gpu_query.cpp#L195-L202"},{"ref":"src/dxvk/dxvk_gpu_query.cpp:211-255","code":"  211 |   void DxvkGpuQueryAllocator::createQueryPool() {\n  212 |     auto vk = m_device->vkd();\n  213 | \n  214 |     VkQueryPoolCreateInfo info = { VK_STRUCTURE_TYPE_QUERY_POOL_CREATE_INFO };\n  215 |     info.queryType  = m_queryType;\n  216 |     info.queryCount = m_queryPoolSize;\n  217 | \n  218 |     if (m_queryType == VK_QUERY_TYPE_PIPELINE_STATISTICS) {\n  219 |       info.pipelineStatistics\n  220 |         = VK_QUERY_PIPELINE_STATISTIC_INPUT_ASSEMBLY_VERTICES_BIT\n  221 |         | VK_QUERY_PIPELINE_STATISTIC_INPUT_ASSEMBLY_PRIMITIVES_BIT\n  222 |         | VK_QUERY_PIPELINE_STATISTIC_VERTEX_SHADER_INVOCATIONS_BIT\n  223 |         | VK_QUERY_PIPELINE_STATISTIC_GEOMETRY_SHADER_INVOCATIONS_BIT\n  224 |         | VK_QUERY_PIPELINE_STATISTIC_GEOMETRY_SHADER_PRIMITIVES_BIT\n  225 |         | VK_QUERY_PIPELINE_STATISTIC_CLIPPING_INVOCATIONS_BIT\n  226 |         | VK_QUERY_PIPELINE_STATISTIC_CLIPPING_PRIMITIVES_BIT\n  227 |         | VK_QUERY_PIPELINE_STATISTIC_FRAGMENT_SHADER_INVOCATIONS_BIT\n  228 |         | VK_QUERY_PIPELINE_STATISTIC_TESSELLATION_CONTROL_SHADER_PATCHES_BIT\n  229 |         | VK_QUERY_PIPELINE_STATISTIC_TESSELLATION_EVALUATION_SHADER_INVOCATIONS_BIT\n  230 |         | VK_QUERY_PIPELINE_STATISTIC_COMPUTE_SHADER_INVOCATIONS_BIT;\n  231 |     }\n  232 | \n  233 |     VkQueryPool queryPool = VK_NULL_HANDLE;\n  234 | \n  235 |     if (vk->vkCreateQueryPool(vk->device(), &info, nullptr, &queryPool)) {\n  236 |       Logger::err(str::format(\"DXVK: Failed to create query pool (\", m_queryType, \"; \", m_queryPoolSize, \")\"));\n  237 |       return;\n  238 |     }\n  239 | \n  240 |     auto& pool = m_pools.emplace_back();\n  241 |     pool.pool = queryPool;\n  242 |     pool.queries = new DxvkGpuQuery [m_queryPoolSize];\n  243 | \n  244 |     for (uint32_t i = 0; i < m_queryPoolSize; i++) {\n  245 |       auto& query = pool.queries[i];\n  246 |       query.m_allocator = this;\n  247 |       query.m_pool = queryPool;\n  248 |       query.m_index = i;\n  249 | \n  250 |       if (i + 1u < m_queryPoolSize)\n  251 |         query.m_next = &pool.queries[i + 1u];\n  252 |     }\n  253 | \n  254 |     m_free = &pool.queries[0u];\n  255 |   }","lines":45,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_gpu_query.cpp#L211-L255"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`DxvkGraphicsPipelineVertexInputState::eq` compares vertex-binding divisors in a loop whose\ncondition is missing the `&& eq` guard that the two preceding loops (bindings, attributes) use:\n\n```\nfor (uint32_t i = 0; i < viDivisorInfo.vertexBindingDivisorCount; i++) {\n  const auto& a = viDivisors[i];\n  const auto& b = other.viDivisors[i];\n  eq = a.binding == b.binding && a.divisor == b.divisor;   // overwrites, does not accumulate\n}\n```\nBecause `eq` is *reassigned* every iteration instead of being accumulated, two things break:\n(1) any inequality established by the earlier binding/attribute loops is discarded whenever\n`vertexBindingDivisorCount > 0`, and (2) if an early divisor differs but the last one matches,\n`eq` is reset to `true`. As a result `eq` can return `true` for two genuinely different vertex\ninput states. The corresponding `hash()` (lines 213-216) does hash every divisor, so two states\nthat differ only in an earlier divisor will hash differently yet compare equal, which can hand\nback the wrong `DxvkGraphicsPipelineVertexInputLibrary` for a draw.","fix":"Add the same short-circuit guard the other loops use, i.e. `for (uint32_t i = 0; i < viDivisorInfo.vertexBindingDivisorCount && eq; i++)`, so a mismatch in any divisor (or in a previously compared binding/attribute) is preserved.","locations":[{"ref":"src/dxvk/dxvk_graphics.cpp:179-185","code":"  179 |     for (uint32_t i = 0; i < viDivisorInfo.vertexBindingDivisorCount; i++) {\n  180 |       const auto& a = viDivisors[i];\n  181 |       const auto& b = other.viDivisors[i];\n  182 | \n  183 |       eq = a.binding    == b.binding\n  184 |         && a.divisor    == b.divisor;\n  185 |     }","lines":7,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_graphics.cpp#L179-L185"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In `DxvkMetaResolveObjects::createPipeline`, the trailing `else` branch writes the resolve\n`key.format` into `state.colorFormats[0]` for every format that is not a bitwise-stencil resolve.\nFor depth or depth-stencil formats this stores a depth/stencil format (e.g. `VK_FORMAT_D32_SFLOAT`,\n`VK_FORMAT_D24_UNORM_S8_UINT`) into the color attachment slot, while `state.depthFormat` is also set.\nThe pipeline then advertises a color attachment whose format is actually a depth-stencil format,\nwhich is invalid. The analogous copy path in `createCopyToImagePipeline` correctly treats color and\ndepth as mutually exclusive (`if (dstAspects & (DEPTH|STENCIL)) { state.depthFormat = ...; } else { state.colorFormats[0] = ...; }`).\nThe `else { state.colorFormats[0] = key.format; }` block is a leftover and should be removed; color\nformats are already correctly set by the earlier `if (formatInfo->aspectMask & VK_IMAGE_ASPECT_COLOR_BIT)`.","fix":"Delete the erroneous `else` block so depth-stencil resolves do not set a color format:\n```cpp\nif ((formatInfo->aspectMask & VK_IMAGE_ASPECT_STENCIL_BIT) && key.modeStencil != VK_RESOLVE_MODE_NONE && key.bitwiseStencil) {\n  state.dynamicStateCount = dynState.size();\n  state.dynamicStates = dynState.data();\n}\n```\nThe color format is already handled by the earlier `if (formatInfo->aspectMask & VK_IMAGE_ASPECT_COLOR_BIT) state.colorFormats[0] = key.format;`.","locations":[{"ref":"src/dxvk/dxvk_meta_resolve.cpp:395-410","code":"  395 |     if (formatInfo->aspectMask & VK_IMAGE_ASPECT_COLOR_BIT)\n  396 |       state.colorFormats[0] = key.format;\n  397 | \n  398 |     if (formatInfo->aspectMask & (VK_IMAGE_ASPECT_DEPTH_BIT | VK_IMAGE_ASPECT_STENCIL_BIT)) {\n  399 |       state.depthFormat = key.format;\n  400 |       state.dsState = &dsState;\n  401 |     }\n  402 | \n  403 |     if ((formatInfo->aspectMask & VK_IMAGE_ASPECT_STENCIL_BIT) && key.modeStencil != VK_RESOLVE_MODE_NONE && key.bitwiseStencil) {\n  404 |       // When resolving stencil in discard mode, we essentially write one bit at\n  405 |       // a time by adjusting the write mask. Add the corresponding dynamic state.\n  406 |       state.dynamicStateCount = dynState.size();\n  407 |       state.dynamicStates = dynState.data();\n  408 |     } else {\n  409 |       state.colorFormats[0] = key.format;\n  410 |     }","lines":16,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_meta_resolve.cpp#L395-L410"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`MemoryFileRegion::operator bool()` returns `m_allocation > 0`, but a valid allocation\nindex of `0` is possible and treated as valid everywhere else in the class (e.g. `map()`\nuses `m_allocation >= 0`, `free()` uses `m_allocation >= 0`, and the move constructor\ninitializes the empty state to `-1`). `MemoryFilePool::alloc()` returns\n`int32_t(m_allocations.size())` which is `0` for the very first allocation when the free\nlist is empty. As a result, the first successfully allocated region reports itself as\ninvalid via the `bool` conversion, which can cause callers to skip using or freeing it.\nThe trailing `;;` is also a leftover typo.","fix":"Change `return m_allocation > 0;;` to `return m_allocation >= 0;` so index `0` is treated as a valid allocation, matching `map()`/`free()`.","locations":[{"ref":"src/util/util_unmap.h:274-276","code":"  274 |     explicit operator bool () const {\n  275 |       return m_allocation > 0;;\n  276 |     }","lines":3,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/util/util_unmap.h#L274-L276"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `UpdateTileMappings`, `bindIndices` is described as a \"lookup table in case the app tries to bind the same page multiple times\" so that \"we should resolve that here and only consider the last bind to any given page.\" The dedup logic reads `bindIndices[resourceTile]` to decide whether to overwrite an existing entry in `bindInfo.binds` or push a new one, but `bindIndices[resourceTile]` is never written anywhere in the loop after being initialized to `~0u`. As a result the `bindIndices[resourceTile] < bindInfo.binds.size()` branch can (in practice) never be taken, and every tile update always takes the `bindInfo.binds.push_back(bind)` path, even when the same `resourceTile` is targeted multiple times within a single `UpdateTileMappings` call. This can result in the same sparse page being bound more than once in a single `DxvkSparseBindInfo`/`vkQueueBindSparse` batch, contrary to the stated intent, and to what the surrounding code assumes.","fix":"Record the index after pushing a new bind so subsequent occurrences of the same page overwrite it:\n```cpp\nif (resourceTile < pageTable->getPageCount()) {\n  if (bindIndices[resourceTile] < bindInfo.binds.size()) {\n    bindInfo.binds[bindIndices[resourceTile]] = bind;\n  } else {\n    bindIndices[resourceTile] = uint32_t(bindInfo.binds.size());\n    bindInfo.binds.push_back(bind);\n  }\n}\n```","locations":[{"ref":"src/d3d11/d3d11_context.cpp:2923-3012","code":" 2923 |     // Lookup table in case the app tries to bind the same\n 2924 |     // page multiple times. We should resolve that here and\n 2925 |     // only consider the last bind to any given page.\n 2926 |     std::vector<uint32_t> bindIndices(pageTable->getPageCount(), ~0u);\n 2927 | \n 2928 |     // This function allows pretty much every parameter to be nullptr\n 2929 |     // in some way, so initialize some defaults as necessary\n 293
