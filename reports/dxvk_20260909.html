{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `D3D11DXGIDevice::CreateSurface`, the cleanup loop for a partially-failed batch of surfaces can call `Release()` on a null pointer. Inside the creation loop, `surfacesCreated = i + 1` is executed unconditionally right after `hr = texture->QueryInterface(__uuidof(IDXGISurface), ...)`, even if that `QueryInterface` call itself failed (in which case `ppSurface[i]` is left as `nullptr`, per standard COM convention of zeroing the out-pointer on failure). If `QueryInterface` fails, the subsequent cleanup block `for (uint32_t i = 0; i < surfacesCreated; i++) ppSurface[i]->Release();` then calls `Release()` on that null entry, dereferencing a null pointer through the vtable and crashing the process instead of cleanly returning the error.","fix":"Only count a surface as created once `QueryInterface` has actually succeeded:\n```cpp\nhr = m_d3d11Device.CreateTexture2D(&desc, nullptr, &texture);\n\nif (SUCCEEDED(hr)) {\n  hr = texture->QueryInterface(__uuidof(IDXGISurface),\n    reinterpret_cast<void**>(&ppSurface[i]));\n\n  if (SUCCEEDED(hr))\n    surfacesCreated = i + 1;\n}\n\nif (FAILED(hr))\n  break;\n```","locations":[{"ref":"src/d3d11/d3d11_device.cpp:3995-4014","code":" 3995 |     for (uint32_t i = 0; i < NumSurfaces; i++) {\n 3996 |       Com<ID3D11Texture2D> texture;\n 3997 | \n 3998 |       hr = m_d3d11Device.CreateTexture2D(&desc, nullptr, &texture);\n 3999 | \n 4000 |       if (SUCCEEDED(hr)) {\n 4001 |         hr = texture->QueryInterface(__uuidof(IDXGISurface),\n 4002 |           reinterpret_cast<void**>(&ppSurface[i]));\n 4003 |         surfacesCreated = i + 1;\n 4004 |       }\n 4005 | \n 4006 |       if (FAILED(hr))\n 4007 |         break;\n 4008 |     }\n 4009 | \n 4010 |     // Don't leak surfaces if we failed to create one\n 4011 |     if (FAILED(hr)) {\n 4012 |       for (uint32_t i = 0; i < surfacesCreated; i++)\n 4013 |         ppSurface[i]->Release();\n 4014 |     }","lines":20,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d11/d3d11_device.cpp#L3995-L4014"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`D3D11VideoProcessorEnumerator::GetVideoProcessorCaps` advertises `pCaps->MaxInputStreams = 52` and `pCaps->MaxStreamStates = 52`, but `D3D11VideoProcessor` only stores stream state for `D3D11_VK_VIDEO_STREAM_COUNT` (8) streams (`D3D11VideoProcessorStreamState m_streams[D3D11_VK_VIDEO_STREAM_COUNT];` in `src/d3d11/d3d11_video.h`). `D3D11VideoProcessor::GetStreamState` returns `nullptr` for any `StreamIndex >= 8`, and every `VideoProcessorSetStream*`/`VideoProcessorGetStream*` call as well as `VideoProcessorBlt` silently no-ops for stream indices 8..51 (`if (!state) return;` / `if (!pStreams[i].Enable || !streamState) continue;`). An application that queries the reported capability and creates more than 8 concurrent streams will have the extra streams silently ignored instead of processed, which is a functional correctness bug disguised as a stub-caps mismatch.","fix":"Report a `MaxInputStreams`/`MaxStreamStates` value that matches the actual backing storage, e.g. `pCaps->MaxInputStreams = D3D11_VK_VIDEO_STREAM_COUNT;`, or increase `D3D11_VK_VIDEO_STREAM_COUNT` (and the `m_streams` array size) to match the advertised capability.","locations":[{"ref":"src/d3d11/d3d11_video.cpp:81-85","code":"   81 |     *pCaps = {};\n   82 |     pCaps->RateConversionCapsCount = 1;\n   83 |     pCaps->MaxInputStreams = 52;\n   84 |     pCaps->MaxStreamStates = 52;\n   85 |     return S_OK;","lines":5,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d11/d3d11_video.cpp#L81-L85"},{"ref":"src/d3d11/d3d11_video.h:7","code":"    7 |   static constexpr uint32_t D3D11_VK_VIDEO_STREAM_COUNT = 8;","lines":1,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d11/d3d11_video.h#L7"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `D3D11VideoContext::BlitStream`, the check `if (cStreamState.colorSpace.Nominal_Range)` treats any non-zero value of the `Nominal_Range` bitfield as \"limited/studio range (16-235)\" and remaps `yMin`/`yMax` to `0.0627451f`/`0.9215686f`. However `D3D11_VIDEO_PROCESSOR_COLOR_SPACE::Nominal_Range` is a 2-bit field with three meaningful values: `0` = undefined, `1` = `D3D11_VIDEO_PROCESSOR_NOMINAL_RANGE_0_255` (full range, no remap needed), and `2` = `D3D11_VIDEO_PROCESSOR_NOMINAL_RANGE_16_235` (limited range, remap needed). Because the code only checks truthiness instead of comparing against the limited-range value, streams that explicitly request full range (`Nominal_Range == 1`) are incorrectly treated as limited range, crushing luma black/white levels and producing washed-out or clipped video output.","fix":"Only apply the limited-range remap when the nominal range is explicitly 16-235:\n```cpp\nif (cStreamState.colorSpace.Nominal_Range == 2 /* D3D11_VIDEO_PROCESSOR_NOMINAL_RANGE_16_235 */) {\n  uboData.yMin = 0.0627451f;\n  uboData.yMax = 0.9215686f;\n}\n```","locations":[{"ref":"src/d3d11/d3d11_video.cpp:1524-1527","code":" 1524 |       if (cStreamState.colorSpace.Nominal_Range) {\n 1525 |         uboData.yMin = 0.0627451f;\n 1526 |         uboData.yMax = 0.9215686f;\n 1527 |       }","lines":4,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d11/d3d11_video.cpp#L1524-L1527"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`D3D9CommonTexture::GetMipSize()` clamps the plane count with `std::min(GetPlaneCount(), 2u)` before multiplying it into the mip size. `D3D9Format::YV12` maps to `VK_FORMAT_G8_B8_R8_3PLANE_420_UNORM`, a genuine 3-plane format (`GetPlaneCount()` returns 3 for it, see `src/dxvk/dxvk_format.cpp:560-565`). The comment directly above this code states the size should be \"the size of plane 0 * plane count\", but the `min(...,2u)` clamp caps the multiplier at 2 for any multi-plane format, undercounting one full plane's worth of data for YV12 (its 3rd, V, plane). The same `min(GetPlaneCount(), 2u)` pattern is repeated at the other call site in `D3D9DeviceEx::UpdateTexture`/blit conversion code (`src/d3d9/d3d9_device.cpp:5392` and `:5403`), so it is applied consistently, but for YV12 specifically this silently drops/misses the last chroma plane's data from both the size computation and the packing logic, contradicting the stated intent of the comment.","fix":"Use the actual `GetPlaneCount()` (not clamped to 2) when computing the mip size and pitch/packing for 3-plane formats such as YV12, or explicitly document/reject 3-plane multi-plane formats if only 2-plane (NV12-style) layouts are actually supported by the conversion pipeline.","locations":[{"ref":"src/d3d9/d3d9_common_texture.cpp:366-382","code":"  366 |     VkExtent3D blockSize = formatInfo->blockSize;\n  367 |     uint32_t elementSize = formatInfo->elementSize;\n  368 |     if (unlikely(formatInfo->flags.test(DxvkFormatFlag::MultiPlane))) {\n  369 |       // D3D9 doesn't allow specifying the plane when locking a texture.\n  370 |       // So the subsampled planes inherit the pitch of the first plane.\n  371 |       // That means the size is the size of plane 0 * plane count\n  372 |       elementSize = formatInfo->planes[0].elementSize;\n  373 |       blockSize = { formatInfo->planes[0].blockSize.width, formatInfo->planes[0].blockSize.height, 1u };\n  374 |     }\n  375 | \n  376 |     const VkExtent3D blockCount = util::computeBlockCount(\n  377 |       mipExtent, blockSize);\n  378 | \n  379 |     return std::min(GetPlaneCount(), 2u)\n  380 |          * align(elementSize * blockCount.width, 4)\n  381 |          * blockCount.height\n  382 |          * blockCount.depth;","lines":17,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d9/d3d9_common_texture.cpp#L366-L382"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`D3D9VkInteropInterface::GetInstanceExtensions` is documented (see `ID3D9VkInteropInterface1::GetInstanceExtensions` in `d3d9_interfaces.h`) to return `D3DERR_MOREDATA` if the caller's buffer was too small and the extension list got truncated. The implementation instead compares the number of extensions actually written (`count`, which is `min(m_extensions.size(), maxCount)`) against the caller-supplied buffer size `maxCount` rather than against the true extension count `m_extensions.size()`. Concretely: if the caller passes a buffer larger than the number of available extensions (e.g. `maxCount = 10`, 5 extensions available), `count == 5 < maxCount == 10`, so the function wrongly reports `D3DERR_MOREDATA` even though nothing was truncated. Conversely, if the caller's buffer is smaller than the extension list (e.g. `maxCount = 5`, 10 extensions available - genuine truncation), `count == maxCount == 5`, so the condition `count < maxCount` is false and the function wrongly reports `D3D_OK`, silently hiding the fact that the list was truncated.","fix":"Compare the written count against the real number of extensions instead of against the caller's buffer size:\n```cpp\n*pExtensionCount = count;\nreturn (count < m_extensions.size()) ? D3DERR_MOREDATA : D3D_OK;\n```","locations":[{"ref":"src/d3d9/d3d9_interop.cpp:54-74","code":"   54 |   HRESULT STDMETHODCALLTYPE D3D9VkInteropInterface::GetInstanceExtensions(\n   55 |           UINT* pExtensionCount, const char** ppExtensions) {\n   56 |     if (pExtensionCount == nullptr)\n   57 |       return D3DERR_INVALIDCALL;\n   58 | \n   59 |     if (!ppExtensions) {\n   60 |       *pExtensionCount = m_extensions.size();\n   61 |       return D3D_OK;\n   62 |     }\n   63 | \n   64 |     UINT count = 0;\n   65 |     UINT maxCount = *pExtensionCount;\n   66 | \n   67 |     for (uint32_t i = 0; i < m_extensions.size() && i < maxCount; i++) {\n   68 |       ppExtensions[i] = m_extensions[i].extensionName;\n   69 |       count++;\n   70 |     }\n   71 | \n   72 |     *pExtensionCount = count;\n   73 |     return (count < maxCount) ? D3DERR_MOREDATA : D3D_OK;\n   74 |   }","lines":21,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d9/d3d9_interop.cpp#L54-L74"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`D3D9SwapChainEx::SetGammaRamp` rejects an invalid gamma ramp with `if (unlikely(!validateGammaRamp(pRamp->red) && !validateGammaRamp(pRamp->blue) && !validateGammaRamp(pRamp->green))) return;`. Using `&&` here means the ramp is only rejected when **all three** channels fail validation; if e.g. only the green channel is inverted/non-monotonic/has huge jumps while red and blue are fine, the condition evaluates to `false` (because `!validateGammaRamp(red)` is `false`), so the function proceeds to apply the invalid ramp anyway. The intent (matching the individual `Logger::warn` messages inside `validateGammaRamp` for each channel) is clearly to reject the ramp if *any* channel is invalid.","fix":"Use `||` (De Morgan's law of the intended `!(validate(red) && validate(blue) && validate(green))`) so any single invalid channel rejects the whole ramp:\n```cpp\nif (unlikely(!validateGammaRamp(pRamp->red)\n          || !validateGammaRamp(pRamp->blue)\n          || !validateGammaRamp(pRamp->green)))\n  return;\n```","locations":[{"ref":"src/d3d9/d3d9_swapchain.cpp:705-711","code":"  705 |     if (unlikely(pRamp == nullptr))\n  706 |       return;\n  707 | \n  708 |     if (unlikely(!validateGammaRamp(pRamp->red)\n  709 |               && !validateGammaRamp(pRamp->blue)\n  710 |               && !validateGammaRamp(pRamp->green)))\n  711 |       return;","lines":7,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d9/d3d9_swapchain.cpp#L705-L711"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`D3D9WindowMessageFilter`'s constructor and destructor look up the window's entry in `g_windowProcMap` and unconditionally dereference the returned iterator without checking it against `end()`:\n```cpp\nD3D9WindowMessageFilter::D3D9WindowMessageFilter(HWND window, bool filter)\n  : m_window(window) {\n  std::lock_guard lock(g_windowProcMapMutex);\n  auto it = g_windowProcMap.find(m_window);\n  m_filter = std::exchange(it->second.filter, filter);   // no end() check\n}\n\nD3D9WindowMessageFilter::~D3D9WindowMessageFilter() {\n  std::lock_guard lock(g_windowProcMapMutex);\n  auto it = g_windowProcMap.find(m_window);\n  it->second.filter = m_filter;                          // no end() check\n}\n```\n(`src/d3d9/d3d9_window.cpp:21-32`). Every other lookup of `g_windowProcMap` in this file (e.g. in `D3D9WindowProc`, `ResetWindowProc`, `SetActivateProcessed`) does check `it != g_windowProcMap.end()` before touching `it->second`, so this pair of functions is inconsistent with the rest of the file.\n\n`D3D9WindowMessageFilter` is constructed inside `D3D9WindowProc` while handling `WM_ACTIVATEAPP` (`src/d3d9/d3d9_window.cpp:67`), using a `window` value that was captured under the lock earlier in the same call but which may since have been unhooked (e.g. because another thread called `HookWindowProc`/`ResetWindowProc` for the same `HWND`, which happens whenever a swap chain is reset/recreated). If that race occurs, `g_windowProcMap.find(m_window)` returns `end()` and `it->second` is a dereference of the end iterator, which is undefined behavior and can crash.","fix":"Guard both lookups the same way the rest of the file does:\n```cpp\nD3D9WindowMessageFilter::D3D9WindowMessageFilter(HWND window, bool filter)\n  : m_window(window) {\n  std::lock_guard lock(g_windowProcMapMutex);\n  auto it = g_windowProcMap.find(m_window);\n  m_filter = it != g_windowProcMap.end() ? std::exchange(it->second.filter, filter) : filter;\n}\n\nD3D9WindowMessageFilter::~D3D9WindowMessageFilter() {\n  std::lock_guard lock(g_windowProcMapMutex);\n  auto it = g_windowProcMap.find(m_window);\n  if (it != g_windowProcMap.end())\n    it->second.filter = m_filter;\n}\n```","locations":[{"ref":"src/d3d9/d3d9_window.cpp:21-32","code":"   21 |   D3D9WindowMessageFilter::D3D9WindowMessageFilter(HWND window, bool filter)\n   22 |     : m_window(window) {\n   23 |     std::lock_guard lock(g_windowProcMapMutex);\n   24 |     auto it = g_windowProcMap.find(m_window);\n   25 |     m_filter = std::exchange(it->second.filter, filter);\n   26 |   }\n   27 | \n   28 |   D3D9WindowMessageFilter::~D3D9WindowMessageFilter() {\n   29 |     std::lock_guard lock(g_windowProcMapMutex);\n   30 |     auto it = g_windowProcMap.find(m_window);\n   31 |     it->second.filter = m_filter;\n   32 |   }","lines":12,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d9/d3d9_window.cpp#L21-L32"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`g_dxgiFormats` and `g_dxgiFamilies` in `src/dxgi/dxgi_format.cpp` are declared as `std::array<..., 133>` and are looked up by casting a `DXGI_FORMAT` value directly to an array index (`GetFormatMapping`/`GetPackedFormatMapping`/`GetFormatFamily` in `src/dxgi/dxgi_format.cpp:907-962`). The real `DXGI_FORMAT` enum has a gap: `DXGI_FORMAT_B4G4R4A4_UNORM == 115`, then values `116`-`129` are reserved/unused, and `DXGI_FORMAT_P208 == 130`, `DXGI_FORMAT_V208 == 131`, `DXGI_FORMAT_V408 == 132`.\n\nBoth tables list their entries positionally with no padding for the reserved range: the `// DXGI_FORMAT_B4G4R4A4_UNORM` entry is immediately followed by `// DXGI_FORMAT_P208`, `// DXGI_FORMAT_V208`, `// DXGI_FORMAT_V408` (`src/dxgi/dxgi_format.cpp:535-546` and `:849-857`). Counting the braced initializers shows only 119 entries are supplied (indices `0`-`118`) even though the array holds 133 slots, so the remaining 14 slots (`119`-`132`) are value-initialized to `{}` by the compiler. Consequently:\n- The initializers intended for `P208`/`V208`/`V408` actually land at array indices `116`/`117`/`118`, which correspond to unused/reserved `DXGI_FORMAT` values that no real format ever uses.\n- Looking up the *real* `DXGI_FORMAT_P208` (130), `DXGI_FORMAT_V208` (131) or `DXGI_FORMAT_V408` (132) hits the implicitly zero-initialized tail entries instead of the ones written in the source.\n\nToday this is silently harmless only because the three implicitly-zeroed entries happen to produce the same all-`VK_FORMAT_UNDEFINED` result as the explicitly written `{ }, // Unsupported` entries for those formats. But the table is positionally wrong and fragile: adding real Vulkan mappings for `P208`/`V208`/`V408`, or extending the tables for newer formats (e.g. `DXGI_FORMAT_A4B4G4R4_UNORM == 191`), will silently look up the wrong slot or fall outside the 133-element array.","fix":"Insert 14 placeholder entries for the reserved `DXGI_FORMAT` range `116`-`129` in both `g_dxgiFormats` and `g_dxgiFamilies`, right after the `B4G4R4A4_UNORM` entry and before `P208`, so that array position matches the real enum value, e.g.:\n```cpp\n// DXGI_FORMAT_B4G4R4A4_UNORM\n{ VK_FORMAT_A4R4G4B4_UNORM_PACK16, ... },\n// 116-129 reserved / unused DXGI_FORMAT values\n{ }, { }, { }, { }, { }, { }, { }, { }, { }, { }, { }, { }, { }, { },\n// DXGI_FORMAT_P208\n{ }, // Unsupported\n...\n```\nAlternatively, switch `GetFormatMapping`/`GetFormatFamily` to a lookup helper that maps enum value ranges explicitly instead of relying on positional/index equivalence with a partially-populated array.","locations":[{"ref":"src/dxgi/dxgi_format.cpp:535-546","code":"  535 |     // DXGI_FORMAT_B4G4R4A4_UNORM\n  536 |     { VK_FORMAT_A4R4G4B4_UNORM_PACK16,\n  537 |       VK_FORMAT_UNDEFINED,\n  538 |       VK_FORMAT_UNDEFINED,\n  539 |       VK_IMAGE_ASPECT_COLOR_BIT },\n  540 |     // DXGI_FORMAT_P208\n  541 |     { }, // Unsupported\n  542 |     // DXGI_FORMAT_V208\n  543 |     { }, // Unsupported\n  544 |     // DXGI_FORMAT_V408\n  545 |     { }, // Unsupported\n  546 |   }};","lines":12,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxgi/dxgi_format.cpp#L535-L546"},{"ref":"src/dxgi/dxgi_format.cpp:849-857","code":"  849 |     // DXGI_FORMAT_B4G4R4A4_UNORM\n  850 |     { }, // Unsupported\n  851 |     // DXGI_FORMAT_P208\n  852 |     { }, // Unsupported\n  853 |     // DXGI_FORMAT_V208\n  854 |     { }, // Unsupported\n  855 |     // DXGI_FORMAT_V408\n  856 |     { }, // Unsupported\n  857 |   }};","lines":9,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxgi/dxgi_format.cpp#L849-L857"},{"ref":"src/dxgi/dxgi_format.h:144-145","code":"  144 |     std::array<DXGI_VK_FORMAT_MAPPING, 133> m_dxgiFormats;\n  145 |     std::array<DXGI_VK_FORMAT_FAMILY,  133> m_dxgiFamilies;","lines":2,"link":"https {"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"hard","description":"`DxvkCsThread::synchronize` reads the plain `uint64_t m_queueOrdered.seqDispatch` without\nholding `m_mutex` (`if (seq == SynchronizeAll) seq = m_queueOrdered.seqDispatch;`), while\n`dispatchChunk`/`injectChunk` write that same field under `m_mutex`. This is a data race\non a non-atomic 64-bit value. On the 32-bit targets DXVK supports, a torn read can yield a\nbogus sequence value, causing `synchronize` to either return early (missing a required\nwait) or wait on `m_condOnSync` for a value that is never reached (hang). The inline\ncomment only justifies the higher-level ordering race, not the torn-read hazard.","fix":"Make `DxvkCsChunkQueue::seqDispatch` an `std::atomic<uint64_t>` (or snapshot it under\n`m_mutex`) so the `SynchronizeAll` read in `synchronize` is not a torn/unsynchronized\naccess to a value concurrently written under the lock.","locations":[{"ref":"src/dxvk/dxvk_cs.cpp:169-174","code":"  169 |     if (seq > m_seqOrdered.load()) {\n  170 |       // We don't need to lock the queue here, if synchronization\n  171 |       // happens while another thread is submitting then there is\n  172 |       // an inherent race anyway\n  173 |       if (seq == SynchronizeAll)\n  174 |         seq = m_queueOrdered.seqDispatch;","lines":6,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_cs.cpp#L169-L174"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`VrInstance::initInstanceExtensions` guards against re-initialization by testing `m_initializedDevExt`\n(the device-extension flag) instead of `m_initializedInsExt`, yet it sets `m_initializedInsExt = true`\nat the end. As confirmed by grep, `m_initializedInsExt` is never read in `dxvk_openvr.cpp` (only the\nunrelated OpenXR class reads its own copy), so the instance-extension init flag is dead and the wrong\nflag gates the function. If `initInstanceExtensions` is invoked more than once before device extensions\nare initialized, it will re-open the registry key and re-query the compositor/registry every time\ninstead of short-circuiting.","fix":"Change the guard to `if (m_no_vr || m_initializedInsExt) return;` so the instance-extension initialization is actually gated by its own flag.","locations":[{"ref":"src/dxvk/dxvk_openvr.cpp:55","code":"   55 |     if (m_no_vr || m_initializedDevExt)","lines":1,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_openvr.cpp#L55"},{"ref":"src/dxvk/dxvk_openvr.cpp:73","code":"   73 |     m_initializedInsExt = true;","lines":1,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_openvr.cpp#L73"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"hard","description":"In `Presenter::acquireNextImage`, the initial acquire path copies the sync object into a local that shadows the `sync` out-parameter: `PresenterSync sync = m_semaphores.at(m_frameIndex);` followed by `waitForSwapchainFence(sync);`. `waitForSwapchainFence` performs `vkResetFences` on the (shared) fence handle and then sets `sync.fenceSignaled = VK_FALSE`, but because `sync` here is a by-value copy, the reset of `fenceSignaled` is never written back to `m_semaphores[m_frameIndex]`; the stored `fenceSignaled` stays `VK_TRUE` even though the fence has just been reset to the unsignaled state. This is inconsistent with the post-present path, which correctly uses a reference: `PresenterSync& nextSync = m_semaphores.at(m_frameIndex);`. If the subsequent `vkAcquireNextImageKHR` fails (e.g. `VK_ERROR_OUT_OF_DATE_KHR`) so the fence is never resubmitted, the following `recreateSwapChain` -> `destroySwapchain` iterates every semaphore calling `waitForSwapchainFence`, which sees the stale `fenceSignaled == VK_TRUE` and issues `vkWaitForFences(..., ~0ull)` on an unsignaled, un-submitted fence, blocking forever.","fix":"Take a reference to the stored entry instead of a copy so the `fenceSignaled` writeback persists, e.g. `PresenterSync& swapSync = m_semaphores.at(m_frameIndex); waitForSwapchainFence(swapSync); ... vkAcquireNextImageKHR(..., swapSync.acquire, ...);`. Use a distinct name to avoid shadowing the `sync` out-parameter.","locations":[{"ref":"src/dxvk/dxvk_presenter.cpp:101-109","code":"  101 |     if (m_acquireStatus == VK_NOT_READY && m_swapchain) {\n  102 |       PresenterSync sync = m_semaphores.at(m_frameIndex);\n  103 | \n  104 |       waitForSwapchainFence(sync);\n  105 | \n  106 |       m_acquireStatus = m_vkd->vkAcquireNextImageKHR(m_vkd->device(),\n  107 |         m_swapchain, std::numeric_limits<uint64_t>::max(),\n  108 |         sync.acquire, VK_NULL_HANDLE, &m_imageIndex);\n  109 |     }","lines":9,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_presenter.cpp#L101-L109"},{"ref":"src/dxvk/dxvk_presenter.cpp:1285-1300","code":" 1285 |   void Presenter::waitForSwapchainFence(\n 1286 |           PresenterSync&            sync) {\n 1287 |     if (!sync.fenceSignaled)\n 1288 |       return;\n 1289 | \n 1290 |     VkResult vr = m_vkd->vkWaitForFences(m_vkd->device(),\n 1291 |       1, &sync.fence, VK_TRUE, ~0ull);\n 1292 | \n 1293 |     if (vr)\n 1294 |       Logger::err(str::format(\"Presenter: Failed to wait for WSI fence: \", vr));\n 1295 | \n 1296 |     if ((vr = m_vkd->vkResetFences(m_vkd->device(), 1, &sync.fence)))\n 1297 |       Logger::err(str::format(\"Presenter: Failed to reset WSI fence: \", vr));\n 1298 | \n 1299 |     sync.fenceSignaled = VK_FALSE;\n 1300 |   }","lines":16,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_presenter.cpp#L1285-L1300"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`SpirvInstructionIterator` can enter an infinite loop when parsing a SPIR-V instruction whose declared word count is `0`. `operator++` calls `advance(SpirvInstruction(...).length())`, and `length()` returns `arg(0) >> spv::WordCountShift`, which is `0` for a malformed instruction with a zero word count. In `advance(uint32_t n)` the guard `if (m_offset + n < m_length)` is then taken with `n == 0`, so `m_offset += 0` leaves the offset unchanged and the iterator never reaches the end sentinel. Any `for (auto it = buf.begin(); it != buf.end(); ++it)` loop over such data hangs. This is reachable because `SpirvCodeBuffer` can be constructed from an arbitrary `std::istream` (e.g. a shader cache file on disk).","fix":"Treat a zero-length instruction as end-of-stream (or advance by at least one word) so the iterator always terminates. For example, in `advance`, bail out to the null sentinel when `n == 0`:\n```\nvoid advance(uint32_t n) {\n  if (n != 0 && m_offset + n < m_length) {\n    m_offset += n;\n  } else {\n    m_code = nullptr; m_offset = 0; m_length = 0;\n  }\n}\n```","locations":[{"ref":"src/spirv/spirv_instruction.h:113-116","code":"  113 |     SpirvInstructionIterator& operator ++ () {\n  114 |       this->advance(SpirvInstruction(m_code, m_offset, m_length).length());\n  115 |       return *this;\n  116 |     }","lines":4,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/spirv/spirv_instruction.h#L113-L116"},{"ref":"src/spirv/spirv_instruction.h:146-153","code":"  146 |     void advance(uint32_t n) {\n  147 |       if (m_offset + n < m_length) {\n  148 |         m_offset += n;\n  149 |       } else {\n  150 |         m_code   = nullptr;\n  151 |         m_offset = 0;\n  152 |         m_length = 0;\n  153 |       }","lines":8,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/spirv/spirv_instruction.h#L146-L153"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`Lazy::get()` implements broken double-checked locking. The fast path\n`if (m_object) return *m_object;` reads the non-atomic `std::unique_ptr<T> m_object`\nwithout holding `m_mutex`, while another thread may be assigning it under the lock inside\n`std::make_unique`. This is a data race (undefined behavior). On weakly-ordered\narchitectures (DXVK supports ARM64), a thread can observe `m_object` as non-null while the\npointed-to object is still partially constructed, or observe a torn pointer value. The\nwhole point of the class is thread-safe lazy init, but the fast path defeats the mutex.","fix":"Make the pointer an `std::atomic<T*>` (or a flag) with acquire/release ordering, or store a `std::atomic<bool> m_initialized` loaded with `memory_order_acquire` in the fast path and set with `memory_order_release` under the lock. Alternatively use `std::call_once`.","locations":[{"ref":"src/util/util_lazy.h:18-31","code":"   18 |     template<typename... Args>\n   19 |     T& get(Args... args) {\n   20 |       if (m_object)\n   21 |         return *m_object;\n   22 | \n   23 |       std::lock_guard lock(m_mutex);\n   24 | \n   25 |       if (!m_object) {\n   26 |         m_object = std::make_unique<T>(\n   27 |           std::forward<Args>(args)...);\n   28 |       }\n   29 | \n   30 |       return *m_object;\n   31 |     }","lines":14,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/util/util_lazy.h#L18-L31"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`D3D11ClassInstance::MatchesTypeName` compares names with `std::strncmp(pName, m_typeName.c_str(), m_typeName.size())`, i.e. it only compares as many characters as `m_typeName` is long. This means any `pName` that merely starts with `m_typeName` as a prefix (e.g. `m_typeName == \"Light\"` and `pName == \"LightPoint\"`) is reported as a match even though the type names are different. This is used from `D3D11InterfaceInfo::EncodeInstanceData` (`src/d3d11/d3d11_class_linkage.cpp:24-27`) to resolve the correct dynamic-linkage function table for a class instance; a prefix collision between two distinct interface type names can silently select the wrong `functionTable`/`typeId`, corrupting dynamic shader linkage (`HLSL` interfaces/`ClassLinkage`) at runtime.","fix":"Compare full strings for equality instead of a length-truncated prefix compare:\n```cpp\nbool D3D11ClassInstance::MatchesTypeName(\n  const char*                   pName) const {\n  return m_typeName == pName;\n}\n```\n(or `!std::strcmp(pName, m_typeName.c_str())` if a `const char*` comparison is preferred).","locations":[{"ref":"src/d3d11/d3d11_class_linkage.cpp:203-206","code":"  203 |   bool D3D11ClassInstance::MatchesTypeName(\n  204 |     const char*                   pName) const {\n  205 |     return !std::strncmp(pName, m_typeName.c_str(), m_typeName.size());\n  206 |   }","lines":4,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d11/d3d11_class_linkage.cpp#L203-L206"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"hard","description":"`D3D11Fence::GetCompletedValue` returns `m_fence->getValue()` directly, with a comment acknowledging that \"in the case of rewinds, the stored value may be higher\" than the true completed value, and that for shared fences calling `vkGetSemaphoreCounterValue` could alleviate the issue. This is a known-incorrect fast path: `ID3D11Fence::GetCompletedValue` can report a fence value that has not actually completed on the GPU when the fence value sequence rewinds (e.g. after a shared fence is reset by another process/API), which could cause callers relying on `GetCompletedValue`/`SetEventOnCompletion` for cross-API synchronization (e.g. D3D12/Vulkan interop) to proceed prematurely.","fix":"For shared fences, query the underlying Vulkan timeline semaphore value directly (e.g. via `vkGetSemaphoreCounterValue`) instead of trusting the cached/tracked value, as noted in the existing TODO.","locations":[{"ref":"src/d3d11/d3d11_fence.cpp:132-137","code":"  132 |   UINT64 STDMETHODCALLTYPE D3D11Fence::GetCompletedValue() {\n  133 |     // TODO in the case of rewinds, the stored value may be higher.\n  134 |     // For shared fences, calling vkGetSemaphoreCounterValue here could alleviate the issue.\n  135 | \n  136 |     return m_fence->getValue();\n  137 |   }","lines":6,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d11/d3d11_fence.cpp#L132-L137"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`D3D9GlobalAnnotationList::m_shouldAnnotate` is set to `true` the first time `RegisterAnnotator()` is ever called, but `UnregisterAnnotator()` never resets it back to `false` even when the last annotator is removed (`src/d3d9/d3d9_annotation.cpp:19-31`). As a result, once any `D3D9UserDefinedAnnotation` has been created and destroyed once during the process lifetime (e.g. a debugging/profiling tool briefly attached), `m_shouldAnnotate` stays `true` forever: `BeginEvent`/`EndEvent`/`SetMarker` keep taking the mutex and iterating an empty `m_annotations` vector for the rest of the process, and `GetStatus()` keeps reporting `1` (\"being profiled/debugged\") to the application even though no annotator is registered anymore, which can affect app behavior that branches on this status.","fix":"Recompute `m_shouldAnnotate` from the emptiness of `m_annotations` in both `RegisterAnnotator()` and `UnregisterAnnotator()`, e.g. `m_shouldAnnotate = !m_annotations.empty();` after the push_back/erase.","locations":[{"ref":"src/d3d9/d3d9_annotation.cpp:19-31","code":"   19 |   void D3D9GlobalAnnotationList::RegisterAnnotator(IDXVKUserDefinedAnnotation* annotation) {\n   20 |     auto lock = std::unique_lock(m_mutex);\n   21 |     m_shouldAnnotate = true;\n   22 |     m_annotations.push_back(annotation);\n   23 |   }\n   24 | \n   25 | \n   26 |   void D3D9GlobalAnnotationList::UnregisterAnnotator(IDXVKUserDefinedAnnotation* annotation) {\n   27 |     auto lock = std::unique_lock(m_mutex);\n   28 |     auto iter = std::find(m_annotations.begin(), m_annotations.end(), annotation);\n   29 |     if (iter != m_annotations.end())\n   30 |         m_annotations.erase(iter);\n   31 |   }","lines":13,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d9/d3d9_annotation.cpp#L19-L31"},{"ref":"src/d3d9/d3d9_annotation.h:47","code":"   47 |     std::atomic<bool> m_shouldAnnotate;","lines":1,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d9/d3d9_annotation.h#L47"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`flushDeferredClear()` and `findOverlappingDeferredClear()` test aspect-mask overlap with a bitwise OR against the queried aspects: `((entry.clearAspects | entry.discardAspects) | subresources.aspectMask)`. Since `subresources.aspectMask` is always non-zero, this sub-expression is always truthy, so the intended aspect-intersection check is dead code and matching is decided solely by the image identity and `vk::checkSubresourceRangeOverlap()`. As a result a deferred clear/discard that touches only one aspect of a depth-stencil image is treated as overlapping a query for the other aspect. The nearby `findDeferredClear()` correctly uses `&` (`(subresources.aspectMask & entry.clearAspects) == subresources.aspectMask`). Impact is limited (over-eager flushing / disabling out-of-order transfers, i.e. conservative) but the condition is semantically wrong.","fix":"Use a bitwise AND so the aspects actually have to intersect, matching `findDeferredClear()`:\n```cpp\n&& ((entry.clearAspects | entry.discardAspects) & subresources.aspectMask)\n```\nin both `flushDeferredClear()` and `findOverlappingDeferredClear()`.","locations":[{"ref":"src/dxvk/dxvk_context.cpp:7698-7700","code":" 7698 |       if ((entry.imageView->image() == &image)\n 7699 |        && ((entry.clearAspects | entry.discardAspects) | subresources.aspectMask)\n 7700 |        && (vk::checkSubresourceRangeOverlap(entry.imageView->imageSubresources(), subresources))) {","lines":3,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_context.cpp#L7698-L7700"},{"ref":"src/dxvk/dxvk_context.cpp:7741-7744","code":" 7741 |     for (auto& entry : m_deferredClears) {\n 7742 |       if ((entry.imageView->image() == &image)\n 7743 |        && ((entry.clearAspects | entry.discardAspects) | subresources.aspectMask)\n 7744 |        && (vk::checkSubresourceRangeOverlap(entry.imageView->imageSubresources(), subresources)))","lines":4,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_context.cpp#L7741-L7744"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`DxvkFence::run()` permanently stops processing enqueued waits after a Vulkan\nerror without clearing `m_running`. If `vkGetSemaphoreCounterValue` (line 128)\nor `vkWaitSemaphores` (line 157) returns an error, the worker thread `return`s\nwhile `m_running` is still `true`. Subsequent `enqueueWait()` calls see\n`m_running == true` and only call `m_condVar.notify_one()` instead of restarting\nthe thread, so their events are never signaled and any fence waiters block\nforever.","fix":"On the error-return paths in `run()`, reset the running state under the lock\n(`m_running = false;`) before returning so a later `enqueueWait()` will spawn a\nfresh worker thread, or handle the error without abandoning the queue.","locations":[{"ref":"src/dxvk/dxvk_fence.cpp:113-165","code":"  113 |   void DxvkFence::run() {\n  114 |     uint64_t value = 0ull;\n  115 | \n  116 |     VkSemaphoreWaitInfo waitInfo = { VK_STRUCTURE_TYPE_SEMAPHORE_WAIT_INFO };\n  117 |     waitInfo.semaphoreCount = 1;\n  118 |     waitInfo.pSemaphores = &m_semaphore;\n  119 |     waitInfo.pValues = &value;\n  120 | \n  121 |     while (true) {\n  122 |       std::unique_lock<dxvk::mutex> lock(m_mutex);\n  123 | \n  124 |       m_condVar.wait(lock, [&]() { return !m_queue.empty() || !m_running; });\n  125 | \n  126 |       // Query actual semaphore value and start from there, so that\n  127 |       // we can skip over large increments in the semaphore value\n  128 |       VkResult vr = m_vkd->vkGetSemaphoreCounterValue(m_vkd->device(), m_semaphore, &value);\n  129 | \n  130 |       if (vr != VK_SUCCESS) {\n  131 |         Logger::err(str::format(\"Failed to query semaphore value: \", vr));\n  132 |         return;\n  133 |       }\n  134 | \n  135 |       // Signal all enqueued events whose value is not greater than\n  136 |       // the current semaphore value\n  137 |       while (!m_queue.empty() && m_queue.top().value <= value) {\n  138 |         m_queue.top().event();\n  139 |         m_queue.pop();\n  140 |       }\n  141 | \n  142 |       if (!m_running)\n  143 |         return;\n  144 | \n  145 |       if (m_queue.empty())\n  146 |         continue;\n  147 | \n  148 |       lock.unlock();\n  149 | \n  150 |       // Wait for the semaphore to be singaled again and update state.\n  151 |       // The timeout is unfortunate, but we can't always know when a\n  152 |       // signal operation has been recorded, and the alternative would\n  153 |       // be to create a teardown semaphore and use WAIT_ANY, which may\n  154 |       // be fall back to a busy-wait loop on some drivers.\n  155 |       value += 1;\n  156 | \n  157 |       vr = m_vkd->vkWaitSemaphores(\n  158 |         m_vkd->device(), &waitInfo, 10'000'000ull);\n  159 | \n  160 |       if (vr != VK_SUCCESS && vr != VK_TIMEOUT) {\n  161 |         Logger::err(str::format(\"Failed to wait for semaphore: \", vr));\n  162 |         return;\n  163 |       }\n  164 |     }\n  165 |   }","lines":53,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_fence.cpp#L113-L165"},{"ref":"src/dxvk/dxvk_fence.cpp:83-98","code":"   83 |   void DxvkFence::enqueueWait(uint64_t value, DxvkFenceEvent&& event) {\n   84 |     if (value > getValue()) {\n   85 |       std::unique_lock<dxvk::mutex> lock(m_mutex);\n   86 |       m_queue.emplace(value, std::move(event));\n   87 | \n   88 |       if (!m_running) {\n   89 |         m_running = true;\n   90 |         m_thread = dxvk::thread([this] { run(); });\n   91 |       } else {\n   92 |         m_condVar.notify_one();\n   93 |       }\n   94 |       lock.unlock();\n   95 |     } else {\n   96 |       event();\n   97 |     }\n   98 |   }","lines":16,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_fence.cpp#L83-L98"}]},
{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `createBufferResource`, the suitability check for reusing a previously obtained allocation tests `(allocation->m_address & requirements.memoryRequirements.alignment)` to detect misalignment. `alignment` is a power of two, so the correct misalignment test is `& (alignment - 1u)`. As written it only checks a single bit: a genuinely misaligned address whose set bits don't overlap that one bit (e.g. `m_address = 128`, `alignment = 512`) is wrongly treated as aligned, while an aligned address that happens to have that bit set (e.g. `m_address = 256`, `alignment = 256`) is wrongly rejected. In practice `allocation` here is usually `nullptr` or a dedicated allocation with `m_address = DedicatedChunkAddress`, so it is mostly latent, but the alignment predicate is incorrect.","fix":"Use `(allocation->m_address & (requirements.memoryRequirements.alignment - 1u))` for the alignment check.","locations":[{"ref":"src/dxvk/dxvk_memory.cpp:1059-1061","code":" 1059 |       if (!allocation || !(requirements.memoryRequirements.memoryTypeBits & (1u << allocation->m_type->index))\n 1060 |        || (allocation->m_size < requirements.memoryRequirements.size)\n 1061 |        || (allocation->m_address & requirements.memoryRequirements.alignment))","lines":3,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_memory.cpp#L1059-L1061"}]},
{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`DxvkPipelineWorkers` calls `pipeline->acquirePipeline()` in `compileGraphicsPipeline` before enqueuing a graphics-pipeline job, and the matching `releasePipeline()` is only invoked inside `runWorker` after the job is actually compiled. On shutdown this pairing is broken: `runWorker`'s wait predicate pops a work item from the queue and returns `true` (lines `entry = m_buckets[i].queue.front(); m_buckets[i].queue.pop();`), but immediately afterwards `if (!m_workersRunning) break;` exits the loop without ever running `entry.graphicsPipeline->releasePipeline()`. Any graphics-pipeline jobs still queued when `stopWorkers()` runs therefore keep `DxvkGraphicsPipeline::m_useCount` permanently incremented, so the base-pipeline cleanup in `releasePipeline` never runs for them. Impact is limited because `stopWorkers` runs at device teardown, but it is a genuine acquire/release imbalance.","fix":"Before `break`ing out on `!m_workersRunning` in `runWorker`, release any work item that was popped by the predicate, e.g. call `if (entry.graphicsPipeline) entry.graphicsPipeline->releasePipeline();` for the discarded entry. Alternatively, do not pop entries in the predicate when `!m_workersRunning`, and drain and release the remaining queue explicitly in `stopWorkers`.","locations":[{"ref":"src/dxvk/dxvk_pipemanager.cpp:40-44","code":"   40 |     pipeline->acquirePipeline();\n   41 |     m_tasksTotal += 1;\n   42 | \n   43 |     m_buckets[uint32_t(priority)].queue.emplace(pipeline, state);\n   44 |     notifyWorkers(priority);","lines":5,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_pipemanager.cpp#L40-L44"},{"ref":"src/dxvk/dxvk_pipemanager.cpp:145-169","code":"  145 |           for (uint32_t i = 0; i <= maxPriorityIndex; i++) {\n  146 |             if (!m_buckets[i].queue.empty()) {\n  147 |               entry = m_buckets[i].queue.front();\n  148 |               m_buckets[i].queue.pop();\n  149 |               return true;\n  150 |             }\n  151 |           }\n  152 | \n  153 |           return !m_workersRunning;\n  154 |         });\n  155 | \n  156 |         bucket.idleWorkers -= 1;\n  157 | \n  158 |         // Skip pending work, exiting early is\n  159 |         // more important in this case.\n  160 |         if (!m_workersRunning)\n  161 |           break;\n  162 |       }\n  163 | \n  164 |       if (entry.pipelineLibrary) {\n  165 |         entry.pipelineLibrary->compilePipeline();\n  166 |       } else if (entry.graphicsPipeline) {\n  167 |         entry.graphicsPipeline->compilePipeline(entry.graphicsState);\n  168 |         entry.graphicsPipeline->releasePipeline();\n  169 |       }","lines":25,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_pipemanager.cpp#L145-L169"}]},
{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`DxvkSubmitEntry::result` (a plain `VkResult`) has no default initializer, and in `DxvkSubmissionQueue::submitCmdLists` the per-iteration `DxvkSubmitEntry entry;` is default-constructed. `entry.result` is only assigned inside the `entry.submit.cmdList != nullptr` and `entry.present.presenter != nullptr` branches. If an entry ever has both `submit.cmdList == nullptr` and `present.presenter == nullptr` (e.g. `submit()` called with a null `cmdList`), `entry.result` is read uninitialized at `entry.status->result = entry.result;` and in the `doForward` computation, producing an undefined result code reported to the caller and used to decide forwarding.","fix":"Give the field a default value, e.g. `VkResult result = VK_SUCCESS;` in `DxvkSubmitEntry`, or initialize `entry.result` explicitly at the top of the loop body in `submitCmdLists`.","locations":[{"ref":"src/dxvk/dxvk_queue.h:68-75","code":"   68 |   struct DxvkSubmitEntry {\n   69 |     VkResult            result;\n   70 |     DxvkSubmitStatus*   status;\n   71 |     DxvkSubmitInfo      submit;\n   72 |     DxvkPresentInfo     present;\n   73 |     DxvkLatencyInfo     latency;\n   74 |     DxvkTimelineSemaphoreValues timelines;\n   75 |   };","lines":8,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_queue.h#L68-L75"}]},
{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`matchFileExtension` never verifies that the target extension `ext` is fully consumed. The\n`std::accumulate` lambda advances `ext` once per character of the file's actual extension\nand checks `current && *ext && a == *(ext++)`, but if the file's extension is a proper\nprefix of `ext`, the loop ends with `ext` still pointing at unmatched characters and\n`matches` remains `true`. For example, `matchFileExtension(\"game.ex\", \"exe\")` returns a\nmatch because `ex` matches the first two characters of `exe`. Through `getExeBaseName`\nthis would incorrectly strip the extension of such files.","fix":"After the accumulate, also require the target to be fully consumed, e.g. `return (matches && *ext == '\\0') ? pos : std::string::npos;` (capture `ext` such that the final position is checkable).","locations":[{"ref":"src/util/util_env.cpp:48-62","code":"   48 |   size_t matchFileExtension(const std::string& name, const char* ext) {\n   49 |     auto pos = name.find_last_of('.');\n   50 | \n   51 |     if (pos == std::string::npos)\n   52 |       return pos;\n   53 | \n   54 |     bool matches = std::accumulate(name.begin() + pos + 1, name.end(), true,\n   55 |       [&ext] (bool current, char a) {\n   56 |         if (a >= 'A' && a <= 'Z')\n   57 |           a += 'a' - 'A';\n   58 |         return current && *ext && a == *(ext++);\n   59 |       });\n   60 | \n   61 |     return matches ? pos : std::string::npos;\n   62 |   }","lines":15,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/util/util_env.cpp#L48-L62"}]},
{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`small_vector::pick_capacity` grows via `while (newCapacity < n) newCapacity *= 2;` starting\nfrom the current capacity. If the vector is ever instantiated with `N == 0`\n(`EmbeddedCapacity == 0`), the initial capacity is `0`, `0 *= 2` stays `0`, and any\n`reserve(n >= 1)` spins forever. The growth logic silently assumes a non-zero embedded\ncapacity.","fix":"Start growth from a non-zero base, e.g. `size_t newCapacity = std::max<size_t>(capacity(), 1);`, or `static_assert(N > 0)`.","locations":[{"ref":"src/util/util_small_vector.h:339-346","code":"  339 |   size_t pick_capacity(size_t n) {\n  340 |     size_t newCapacity = capacity();\n  341 | \n  342 |     while (newCapacity < n)\n  343 |       newCapacity *= 2;\n  344 | \n  345 |     return newCapacity;\n  346 |   }","lines":8,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/util/util_small_vector.h#L339-L346"}]},
{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In the GLFW backend `enterFullscreenMode`, `hMonitor` is validated (`displayId` / `isDisplayValid`) but then\ncompletely ignored: the code always fullscreens onto `glfwGetPrimaryMonitor()` rather than the monitor the\ncaller requested. On a multi-monitor system this puts the window fullscreen on the wrong display. The `TODO`\ncomment acknowledges it, but the validated `displayId` should be used to select the target monitor (as in the\n`monitors[displayId]` pattern used elsewhere in the file).","fix":"Resolve the target monitor from the validated `displayId` via `glfwGetMonitors`, e.g.\n`GLFWmonitor* monitor = monitors[displayId];`, and use that instead of `glfwGetPrimaryMonitor()`.","locations":[{"ref":"src/wsi/glfw/wsi_window_glfw.cpp:87-106","code":"   87 |   bool GlfwWsiDriver::enterFullscreenMode(\n   88 |       HMONITOR hMonitor,\n   89 |       HWND hWindow,\n   90 |       DxvkWindowState* pState,\n   91 |       bool ModeSwitch) {\n   92 |     const int32_t displayId = fromHmonitor(hMonitor);\n   93 |     GLFWwindow* window = fromHwnd(hWindow);\n   94 | \n   95 |     if (!isDisplayValid(displayId))\n   96 |       return false;\n   97 | \n   98 |     GLFWmonitor* monitor = glfwGetPrimaryMonitor();\n   99 |     auto videoMode = glfwGetVideoMode(monitor);\n  100 | \n  101 |     // TODO: Set this on the correct monitor.\n  102 |     // Docs aren't clear on this...\n  103 |     glfwSetWindowMonitor(window, monitor, 0, 0, videoMode->width, videoMode->height, videoMode->refreshRate);\n  104 | \n  105 |     return true;\n  106 |   }","lines":20,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/wsi/glfw/wsi_window_glfw.cpp#L87-L106"}]},
{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In the SDL3 backend `enterFullscreenMode`, when `ModeSwitch` is true the refresh rate is computed as\n`float(mode.refreshRate.numerator) / float(mode.refreshRate.denominator)`. `mode` is\n`pState->sdl3.fullscreenMode`, which is default-initialized to `{ }` (numerator and denominator both `0`)\nunless `setWindowMode` was previously called. If `enterFullscreenMode` runs with `ModeSwitch=true` before any\n`setWindowMode`, this evaluates to `0.0f / 0.0f` (NaN), which is then passed to\n`SDL_GetClosestFullscreenDisplayMode`. Any `WsiMode` with a zero `denominator` triggers the same undefined\nfloat result.","fix":"Guard against a zero denominator before dividing, e.g. pass `0.0f` (let SDL pick a default) when\n`mode.refreshRate.denominator == 0`, mirroring the numerator!=0 guards used elsewhere.","locations":[{"ref":"src/wsi/sdl3/wsi_window_sdl3.cpp:102-110","code":"  102 |     if (ModeSwitch) {\n  103 |       const auto& mode = pState->sdl3.fullscreenMode;\n  104 | \n  105 |       if (!SDL_GetClosestFullscreenDisplayMode(displayId, mode.width, mode.height,\n  106 |           float(mode.refreshRate.numerator) / float(mode.refreshRate.denominator), true, &closestMode)) {\n  107 |         Logger::err(str::format(\"SDL3 WSI: enterFullscreenMode: SDL_GetClosestFullscreenDisplayMode: \", SDL_GetError()));\n  108 |         return false;\n  109 |       }\n  110 |     }","lines":9,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/wsi/sdl3/wsi_window_sdl3.cpp#L102-L110"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"In the GLFW backend `setWindowMode`, the window height argument is wrong: `glfwSetWindowMonitor` is\ncalled with `wantedMode.width` passed for BOTH the width and the height parameter:\n```\nglfwSetWindowMonitor(window, monitor, 0, 0, wantedMode.width, wantedMode.width, wantedMode.refreshRate);\n```\nThe 6th argument (height) should be `wantedMode.height`. As written, the window is always resized to a\nsquare of `width` x `width`, so any non-square resolution is applied incorrectly. This is a classic\ncopy-paste slip - the surrounding SDL2/SDL3 equivalents correctly use both `w`/`width` and `h`/`height`.","fix":"Pass the height as the 6th argument:\n```\nglfwSetWindowMonitor(window, monitor, 0, 0, wantedMode.width, wantedMode.height, wantedMode.refreshRate);\n```","locations":[{"ref":"src/wsi/glfw/wsi_window_glfw.cpp:82","code":"   82 |     glfwSetWindowMonitor(window, monitor, 0, 0, wantedMode.width, wantedMode.width, wantedMode.refreshRate);","lines":1,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/wsi/glfw/wsi_window_glfw.cpp#L82"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"`SetResourceMinLOD` and `GetResourceMinLOD` intend to log an unimplemented-feature warning only once, following the same pattern used elsewhere in this file (e.g. `SetPredication`, `GetHardwareProtectionState`, `SetHardwareProtectionState`, all of which use `static bool s_errorShown = false;` together with `if (!std::exchange(s_errorShown, true))`). Here, however, `s_errorShown` is declared as a plain (non-`static`) local variable, and the condition is not negated: `bool s_errorShown = false; if (std::exchange(s_errorShown, true)) Logger::err(...);`. Since the local is freshly `false` on every call, `std::exchange` always returns `false`, so the `if` never evaluates to `true` and `Logger::err` is unreachable dead code. These two stub methods silently do nothing and never warn, unlike every other 'not implemented' stub in this file.","fix":"Match the pattern used by the neighboring stubs:\n```cpp\nvoid STDMETHODCALLTYPE D3D11CommonContext<ContextType>::SetResourceMinLOD(\n        ID3D11Resource*                   pResource,\n        FLOAT                             MinLOD) {\n  static bool s_errorShown = false;\n\n  if (!std::exchange(s_errorShown, true))\n    Logger::err(\"D3D11DeviceContext::SetResourceMinLOD: Not implemented\");\n}\n```\nand analogously for `GetResourceMinLOD`.","locations":[{"ref":"src/d3d11/d3d11_context.cpp:2698-2717","code":" 2698 |   template<typename ContextType>\n 2699 |   void STDMETHODCALLTYPE D3D11CommonContext<ContextType>::SetResourceMinLOD(\n 2700 |           ID3D11Resource*                   pResource,\n 2701 |           FLOAT                             MinLOD) {\n 2702 |     bool s_errorShown = false;\n 2703 | \n 2704 |     if (std::exchange(s_errorShown, true))\n 2705 |       Logger::err(\"D3D11DeviceContext::SetResourceMinLOD: Not implemented\");\n 2706 |   }\n 2707 |   \n 2708 |   \n 2709 |   template<typename ContextType>\n 2710 |   FLOAT STDMETHODCALLTYPE D3D11CommonContext<ContextType>::GetResourceMinLOD(ID3D11Resource* pResource) {\n 2711 |     bool s_errorShown = false;\n 2712 | \n 2713 |     if (std::exchange(s_errorShown, true))\n 2714 |       Logger::err(\"D3D11DeviceContext::GetResourceMinLOD: Not implemented\");\n 2715 | \n 2716 |     return 0.0f;\n 2717 |   }","lines":20,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d11/d3d11_context.cpp#L2698-L2717"}]},
{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"`D3D9On12::UnwrapUnderlyingResource` and `D3D9On12::ReturnUnderlyingResource` both log an error message that says `\"D3D9On12::GetD3D12Device: ...\"`, copy-pasted from the sibling `GetD3D12Device` stub instead of naming the actual method. This makes the logged diagnostics misleading when troubleshooting D3D9on12 issues, since the log will point at the wrong function.","fix":"Fix the copy-pasted method names in the log strings:\n```cpp\nHRESULT STDMETHODCALLTYPE D3D9On12::UnwrapUnderlyingResource(IDirect3DResource9* resource, ID3D12CommandQueue* command_queue, REFIID riid, void** object) {\n  Logger::err(\"D3D9On12::UnwrapUnderlyingResource: Stub\");\n  return E_NOINTERFACE;\n}\nHRESULT STDMETHODCALLTYPE D3D9On12::ReturnUnderlyingResource(IDirect3DResource9* resource, UINT num_sync, UINT64* signal_values, ID3D12Fence** fences) {\n  if (num_sync)\n    Logger::err(\"D3D9On12::ReturnUnderlyingResource: Stub\");\n\n  m_device->FlushAndSync9On12();\n  return S_OK;\n}\n```","locations":[{"ref":"src/d3d9/d3d9_on_12.cpp:28-34","code":"   28 |   HRESULT STDMETHODCALLTYPE D3D9On12::UnwrapUnderlyingResource(IDirect3DResource9* resource, ID3D12CommandQueue* command_queue, REFIID riid, void** object) {\n   29 |     Logger::err(\"D3D9On12::GetD3D12Device: UnwrapUnderlyingResource: Stub\");\n   30 |     return E_NOINTERFACE;\n   31 |   }\n   32 |   HRESULT STDMETHODCALLTYPE D3D9On12::ReturnUnderlyingResource(IDirect3DResource9* resource, UINT num_sync, UINT64* signal_values, ID3D12Fence** fences) {\n   33 |     if (num_sync)\n   34 |       Logger::err(\"D3D9On12::GetD3D12Device: ReturnUnderlyingResource: Stub\");","lines":7,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d9/d3d9_on_12.cpp#L28-L34"}]},
{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"The `DxvkGraphicsPipelineFragmentOutputLibrary` constructor throws `DxvkError(\"Failed to create vertex input pipeline library\")` on `vkCreateGraphicsPipelines` failure, but this is the fragment-output library, not the vertex-input library. The message was copied from `DxvkGraphicsPipelineVertexInputLibrary` (`src/dxvk/dxvk_graphics.cpp:258`) and misidentifies the failing object in logs.","fix":"Change the message to `\"Failed to create fragment output pipeline library\"`.","locations":[{"ref":"src/dxvk/dxvk_graphics.cpp:542","code":"  542 |       throw DxvkError(\"Failed to create vertex input pipeline library\");","lines":1,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_graphics.cpp#L542"}]},
{"id":"CPY_5","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `DxvkMetaBlitObjects::createVs` the integer-to-float conversion of the queried image size uses `ir::Op::Op::ConvertItoF` with a doubled `Op::` qualifier, unlike every other call in the file (e.g. lines 96, 108 use `ir::Op::ConvertItoF`). It compiles only because `Op::Op` names the injected-class-name and resolves back to `Op`, but it is a clear copy-paste/typo.","fix":"Change `ir::Op::Op::ConvertItoF(coordTypeF, size)` to `ir::Op::ConvertItoF(coordTypeF, size)`.","locations":[{"ref":"src/dxvk/dxvk_meta_blit.cpp:124","code":"  124 |       size = builder.add(ir::Op::Op::ConvertItoF(coordTypeF, size));","lines":1,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_meta_blit.cpp#L124"}]},
{"id":"CPY_6","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"The error log in `DxvkMetaCopyObjects::determineWorkgroupSize(const DxvkMetaImageToBufferCopy::Key&)` references the wrong class name, printing `\"DxvkMetaClearObjects: Unhandled view type: \"` from within `DxvkMetaCopyObjects`. This is a copy-paste leftover that would mislead anyone diagnosing an unhandled view type.","fix":"Change the message to reference `DxvkMetaCopyObjects` (or the specific pipeline), e.g. `Logger::err(str::format(\"DxvkMetaCopyObjects: Unhandled view type: \", key.srcViewType));`.","locations":[{"ref":"src/dxvk/dxvk_meta_copy.cpp:1133","code":" 1133 |         Logger::err(str::format(\"DxvkMetaClearObjects: Unhandled view type: \", key.srcViewType));","lines":1,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_meta_copy.cpp#L1133"}]},
{"id":"CPY_7","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `DxvkSparseBindSubmission::logSparseBindingInfo`, the section that logs the regular (non-opaque) image binds was copy-pasted from the opaque-bind section and never adjusted. The header string reads `\"  Opaque image binds (\"` and, more importantly, it prints `info->imageOpaqueBindCount` instead of `info->imageBindCount`. Since this block is guarded by `if (info->imageBindCount)` but prints the opaque count, the logged count is wrong (and misleading), while the loop below correctly iterates `info->imageBindCount`.","fix":"Change the header to reflect the actual image binds and use the correct counter:\n```cpp\nstr << \"  Image binds (\" << std::dec << info->imageBindCount << \"):\" << std::endl;\n```","locations":[{"ref":"src/dxvk/dxvk_sparse.cpp:794-795","code":"  794 |     if (info->imageBindCount) {\n  795 |       str << \"  Opaque image binds (\" << std::dec << info->imageOpaqueBindCount << \"):\" << std::endl;","lines":2,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_sparse.cpp#L794-L795"}]},
{"id":"CPY_8","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"very_easy","description":"In `D3D11Query::QueryInterface` and in the `D3D11Shader<D3D11Interface, D3D10Interface>::QueryInterface` template, the second `if` block that resolves the D3D10 interface repeats `riid == __uuidof(IUnknown)` as one of its conditions, even though `IUnknown` was already matched and returned in the first `if` block a few lines above. The condition can never be true at that point, making it dead/confusing code left over from copy-pasting the first block.","fix":"Drop the redundant `riid == __uuidof(IUnknown) ||` clause from the second `if` in both places, since it is already handled by the first branch.","locations":[{"ref":"src/d3d11/d3d11_query.cpp:95-110","code":"   95 |     if (riid == __uuidof(IUnknown)\n   96 |      || riid == __uuidof(ID3D11DeviceChild)\n   97 |      || riid == __uuidof(ID3D11Asynchronous)\n   98 |      || riid == __uuidof(ID3D11Query)\n   99 |      || riid == __uuidof(ID3D11Query1)) {\n  100 |       *ppvObject = ref(this);\n  101 |       return S_OK;\n  102 |     }\n  103 |     \n  104 |     if (riid == __uuidof(IUnknown)\n  105 |      || riid == __uuidof(ID3D10DeviceChild)\n  106 |      || riid == __uuidof(ID3D10Asynchronous)\n  107 |      || riid == __uuidof(ID3D10Query)) {\n  108 |       *ppvObject = ref(&m_d3d10);\n  109 |       return S_OK;\n  110 |     }","lines":16,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d11/d3d11_query.cpp#L95-L110"},{"ref":"src/d3d11/d3d11_shader.h:225-237","code":"  225 |       if (riid == __uuidof(IUnknown)\n  226 |        || riid == __uuidof(ID3D11DeviceChild)\n  227 |        || riid == __uuidof(D3D11Interface)) {\n  228 |         *ppvObject = ref(this);\n  229 |         return S_OK;\n  230 |       }\n  231 |       \n  232 |       if (riid == __uuidof(IUnknown)\n  233 |        || riid == __uuidof(ID3D10DeviceChild)\n  234 |        || riid == __uuidof(D3D10Interface)) {\n  235 |         *ppvObject = ref(&m_d3d10);\n  236 |         return S_OK;\n  237 |       }","lines":13,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d11/d3d11_shader.h#L225-L237"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"In `D3D10CoreCreateDevice()`, the results of `d3d11Device->QueryInterface(__uuidof(ID3D10Multithread), ...)` and `d3d11Device->QueryInterface(__uuidof(IDXGIDXVKDevice), ...)` are discarded, and the resulting `Com<>` pointers are immediately dereferenced with `multithread->SetMultithreadProtected(...)` and `dxvkDevice->SetAPIVersion(10)`. If either `QueryInterface` call were to fail (e.g. `E_NOINTERFACE`), `multithread`/`dxvkDevice` stay null and the subsequent calls dereference a null pointer, crashing the process. In this codebase these interfaces always happen to be implemented by `D3D11Device`, but the missing checks make the function fragile against future refactors and inconsistent with the explicit `FAILED(hr)` checks used elsewhere in the same function (e.g. right above, for `CheckInterfaceSupport` and `D3D11CoreCreateDevice`).","fix":"Check the `HRESULT` of both `QueryInterface` calls before dereferencing, consistent with the rest of the function:\n```cpp\nCom<ID3D10Multithread> multithread;\nhr = d3d11Device->QueryInterface(__uuidof(ID3D10Multithread), reinterpret_cast<void**>(&multithread));\nif (FAILED(hr))\n  return hr;\nmultithread->SetMultithreadProtected(!(Flags & D3D10_CREATE_DEVICE_SINGLETHREADED));\n\nCom<IDXGIDXVKDevice> dxvkDevice;\nhr = d3d11Device->QueryInterface(__uuidof(IDXGIDXVKDevice), reinterpret_cast<void**>(&dxvkDevice));\nif (FAILED(hr))\n  return hr;\ndxvkDevice->SetAPIVersion(10);\n```","locations":[{"ref":"src/d3d10/d3d10_core.cpp:44-50","code":"   44 |     Com<ID3D10Multithread> multithread;\n   45 |     d3d11Device->QueryInterface(__uuidof(ID3D10Multithread), reinterpret_cast<void**>(&multithread));\n   46 |     multithread->SetMultithreadProtected(!(Flags & D3D10_CREATE_DEVICE_SINGLETHREADED));\n   47 | \n   48 |     Com<IDXGIDXVKDevice> dxvkDevice;\n   49 |     d3d11Device->QueryInterface(__uuidof(IDXGIDXVKDevice), reinterpret_cast<void**>(&dxvkDevice));\n   50 |     dxvkDevice->SetAPIVersion(10);","lines":7,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d10/d3d10_core.cpp#L44-L50"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"If `D3DKMTCreateDCFromMemory` fails in the `D3D11GDISurface` constructor, the failure is only logged via `Logger::err`; the constructor does not throw or otherwise mark the object as invalid, and `m_hdc`/`m_hbitmap` end up null (since `desc.hDc`/`desc.hBitmap` were pre-initialized to `nullptr` and never populated by the failed call). `D3D11GDISurface::Acquire` has no check for this and unconditionally sets `*phdc = m_hdc` and returns `S_OK`, so callers of `IDXGISurface1::GetDC` receive a `NULL` HDC together with a success code instead of an error, and will likely crash or misbehave when using that HDC.","fix":"Track DC-creation success (e.g. store the NTSTATUS from `D3DKMTCreateDCFromMemory` or check `m_hdc == nullptr`) and have `Acquire` return `E_FAIL` when the underlying DC was never successfully created, instead of returning `S_OK` with a null HDC.","locations":[{"ref":"src/d3d11/d3d11_gdi.cpp:35-39","code":"   35 |     if (D3DKMTCreateDCFromMemory(&desc))\n   36 |       Logger::err(str::format(\"D3D11: Failed to create GDI DC\"));\n   37 |     \n   38 |     m_hdc     = desc.hDc;\n   39 |     m_hbitmap = desc.hBitmap;","lines":5,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d11/d3d11_gdi.cpp#L35-L39"},{"ref":"src/d3d11/d3d11_gdi.cpp:54-100","code":"   54 |   HRESULT D3D11GDISurface::Acquire(BOOL Discard, HDC* phdc) {\n   55 |     if (!phdc)\n   56 |       return E_INVALIDARG;\n   57 |     \n   58 |     *phdc = nullptr;\n   59 | \n   60 |     if (m_acquired)\n   61 |       return DXGI_ERROR_INVALID_CALL;\n   62 |     \n   63 |     if (!Discard) {\n   64 |       // Create a staging resource that we can map\n   65 |       if (!m_readback && FAILED(CreateReadbackResource())) {\n   66 |         Logger::err(\"D3D11: Failed to create GDI readback resource\");\n   67 |         return E_FAIL;\n   68 |       }\n   69 | \n   70 |       // Copy subresource to staging image\n   71 |       Com<ID3D11Device>         device;\n   72 |       Com<ID3D11DeviceContext>  context;\n   73 | \n   74 |       m_resource->GetDevice(&device);\n   75 |       device->GetImmediateContext(&context);\n   76 | \n   77 |       context->CopySubresourceRegion(m_readback, 0,\n   78 |         0, 0, 0, m_resource, m_subresource, nullptr);\n   79 | \n   80 |       // Copy staging image to DC memory\n   81 |       auto tex       = GetCommonTexture(m_resource)->Desc();\n   82 |       auto rowData   = reinterpret_cast<char*>(m_data.data());\n   83 |       auto rowLength = sizeof(uint32_t) * tex->Width;\n   84 | \n   85 |       D3D11_MAPPED_SUBRESOURCE sr;\n   86 |       context->Map(m_readback, 0, D3D11_MAP_READ, 0, &sr);\n   87 | \n   88 |       for (uint32_t i = 0; i < tex->Height; i++) {\n   89 |         std::memcpy(rowData + rowLength * i,\n   90 |           reinterpret_cast<const char*>(sr.pData) + sr.RowPitch * i,\n   91 |           rowLength);\n   92 |       }\n   93 | \n   94 |       context->Unmap(m_readback, 0);\n   95 |     }\n   96 |     \n   97 |     m_acquired = true;\n   98 |     *phdc      = m_hdc;\n   99 |     return S_OK;\n  100 |   }","lines":47,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d11/d3d11_gdi.cpp#L54-L100"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"very_easy","description":"In `D3D11On12CreateDevice`, after calling `d3d12Device->CheckFeatureSupport(D3D12_FEATURE_FEATURE_LEVELS, &featureLevel, sizeof(featureLevel))`, the code checks `if (FAILED(hr) || !featureLevel.MaxSupportedFeatureLevel) { ...; return hr; }`. If `CheckFeatureSupport` itself succeeds (`hr == S_OK`) but reports `MaxSupportedFeatureLevel == 0` (e.g. because none of the requested feature levels were supported), the function still `return hr`, i.e. returns `S_OK` even though device creation was aborted and `*ppDevice`/`*ppImmediateContext` were never populated (they were reset to null via `InitReturnPtr` at the top). Callers checking `SUCCEEDED()` would incorrectly believe device creation succeeded while holding null pointers.","fix":"Return a failure code explicitly when the feature level check fails but the API call itself succeeded:\n```cpp\nif (FAILED(hr) || !featureLevel.MaxSupportedFeatureLevel) {\n  Logger::err(str::format(\"D3D11On12CreateDevice: Minimum required feature level not supported\"));\n  return FAILED(hr) ? hr : E_INVALIDARG;\n}\n```","locations":[{"ref":"src/d3d11/d3d11_main.cpp:345-350","code":"  345 |     HRESULT hr = d3d12Device->CheckFeatureSupport(D3D12_FEATURE_FEATURE_LEVELS, &featureLevel, sizeof(featureLevel));\n  346 | \n  347 |     if (FAILED(hr) || !featureLevel.MaxSupportedFeatureLevel) {\n  348 |       Logger::err(str::format(\"D3D11On12CreateDevice: Minimum required feature level not supported\"));\n  349 |       return hr;\n  350 |     }","lines":6,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d11/d3d11_main.cpp#L345-L350"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`DxvkCommandList::createDescriptorRange()` can fail and, on failure, sets `m_descriptorRange = nullptr` and returns `false` (see the `if (m_execBuffer)` branch). Both internal callers `bindResourcesDescriptorHeap` and `bindResourcesDescriptorBuffer` call it as `if (!canAllocateDescriptors(layout)) createDescriptorRange();` and ignore the return value. If it returns `false`, execution continues to `auto storage = allocateDescriptors(setLayout);`, which dereferences the now-null `m_descriptorRange` (`allocateDescriptors` does `m_descriptorRange->alloc(...)`), causing a null-pointer dereference. The functions document a precondition that they are not called inside a secondary command buffer (the only case where the failure branch triggers), but the ignored return value makes this a latent crash if that precondition is ever violated, and it is inconsistent with `dxvk_context.cpp:7278` which does check the result.","fix":"Have both call sites honor the return value, e.g. bail out of the bind path when `createDescriptorRange()` returns `false` instead of proceeding to `allocateDescriptors`, or `assert`/early-return so a violated precondition does not turn into a null dereference in `m_descriptorRange->alloc(...)`.","locations":[{"ref":"src/dxvk/dxvk_cmdlist.cpp:657-658","code":"  657 |       if (!canAllocateDescriptors(layout))\n  658 |         createDescriptorRange();","lines":2,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_cmdlist.cpp#L657-L658"},{"ref":"src/dxvk/dxvk_cmdlist.cpp:754-755","code":"  754 |       if (!canAllocateDescriptors(layout))\n  755 |         createDescriptorRange();","lines":2,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_cmdlist.cpp#L754-L755"},{"ref":"src/dxvk/dxvk_cmdlist.cpp:873-890","code":"  873 |     if (unlikely(newBaseAddress != oldBaseAddress)) {\n  874 |       if (m_execBuffer) {\n  875 |         // Can't rebind heap on secondary\n  876 |         m_descriptorRange = nullptr;\n  877 |         return false;\n  878 |       }\n  879 | \n  880 |       if (m_device->canUseDescriptorHeap())\n  881 |         rebindResourceHeap();\n  882 |       else if (m_device->canUseDescriptorBuffer())\n  883 |         rebindDescriptorBuffers();\n  884 |     }\n  885 | \n  886 |     m_descriptorOffset = m_descriptorRange->getAllocationOffset();\n  887 | \n  888 |     track(m_descriptorRange);\n  889 |     return true;\n  890 |   }","lines":18,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_cmdlist.cpp#L873-L890"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`DxvkCsThread::threadFunc` wraps the entire processing loop in a single\n`try { while (!m_stopped) { ... } } catch (const DxvkError& e) { ...log... }`. If any command\nthrows a `DxvkError` (or any other exception), the loop is exited permanently and the thread\nterminates without setting `m_stopped` or advancing `m_seqOrdered`/`m_seqHighPrio`. Any\nsubsequent `synchronize`/`injectChunk(..., synchronize=true)` will then wait on `m_condOnSync`\nforever (deadlock), and remaining queued chunks are never executed. A non-`DxvkError`\nexception escapes the `catch` entirely and calls `std::terminate`.","fix":"Handle exceptions per-chunk (inside the inner processing loop) so a single failed command\ndoes not tear down the whole CS thread, and on a fatal error signal the counters / set a\nfailure state so waiters in `synchronize` are released instead of blocking indefinitely.","locations":[{"ref":"src/dxvk/dxvk_cs.cpp:201-275","code":"  201 |     try {\n  202 |       while (!m_stopped.load()) {\n  203 |         { std::unique_lock<dxvk::mutex> lock(m_mutex);\n  204 | \n  205 |           auto pred = [this] { return\n  206 |               !m_queueOrdered.queue.empty()\n  207 |               || !m_queueHighPrio.queue.empty()\n  208 |               || m_stopped.load();\n  209 |           };\n  210 | \n  211 |           if (unlikely(!pred())) {\n  212 |             auto t0 = dxvk::high_resolution_clock::now();\n  213 | \n  214 |             m_condOnAdd.wait(lock, [&] {\n  215 |               return pred();\n  216 |             });\n  217 | \n  218 |             auto t1 = dxvk::high_resolution_clock::now();\n  219 |             m_device->addStatCtr(DxvkStatCounter::CsIdleTicks, std::chrono::duration_cast<std::chrono::microseconds>(t1 - t0).count());\n  220 |           }\n  221 | \n  222 |           std::swap(ordered, m_queueOrdered.queue);\n  223 |           std::swap(highPrio, m_queueHighPrio.queue);\n  224 | \n  225 |           m_hasHighPrio.store(false);\n  226 |         }\n  227 | \n  228 |         size_t orderedIndex = 0u;\n  229 |         size_t highPrioIndex = 0u;\n  230 | \n  231 |         while (highPrioIndex < highPrio.size() || orderedIndex < ordered.size()) {\n  232 |           // Re-fill local high-priority queue if the app has queued anything up\n  233 |           // in the meantime, we want to reduce possible synchronization delays.\n  234 |           if (highPrioIndex >= highPrio.size() && m_hasHighPrio.load()) {\n  235 |             highPrio.clear();\n  236 |             highPrioIndex = 0u;\n  237 | \n  238 |             std::unique_lock<dxvk::mutex> lock(m_mutex);\n  239 |             std::swap(highPrio, m_queueHighPrio.queue);\n  240 | \n  241 |             m_hasHighPrio.store(false);\n  242 |           }\n  243 | \n  244 |           // Drain high-priority queue first\n  245 |           bool isHighPrio = highPrioIndex < highPrio.size();\n  246 |           auto& entry = isHighPrio ? highPrio[highPrioIndex++] : ordered[orderedIndex++];\n  247 | \n  248 |           m_context->addStatCtr(DxvkStatCounter::CsChunkCount, 1);\n  249 | \n  250 |           entry.chunk->executeAll(m_context.ptr());\n  251 | \n  252 |           if (entry.seq) {\n  253 |             // Use a separate mutex for the chunk counter, this will only\n  254 |             // ever be contested if synchronization is actually necessary.\n  255 |             std::lock_guard lock(m_counterMutex);\n  256 | \n  257 |             auto& counter = isHighPrio ? m_seqHighPrio : m_seqOrdered;\n  258 |             counter.store(entry.seq);\n  259 | \n  260 |             m_condOnSync.notify_one();\n  261 |           }\n  262 | \n  263 |           // Immediately free the chunk to release\n  264 |           // references to any resources held by it\n  265 |           entry.chunk = DxvkCsChunkRef();\n  266 |         }\n  267 | \n  268 |         ordered.clear();\n  269 |         highPrio.clear();\n  270 |       }\n  271 |     } catch (const DxvkError& e) {\n  272 |       Logger::err(\"Exception on CS thread!\");\n  273 |       Logger::err(e.message());\n  274 |     }\n  275 |   }","lines":75,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_cs.cpp#L201-L275"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`DxvkDeviceCapabilities::isSuitable()` may leave the error buffer without a\nNUL terminator. It calls `std::strncpy(error, message->c_str(), errorSize - 1u);`\nwhich copies at most `errorSize - 1` bytes but does not write a terminating NUL\nat `error[errorSize - 1]`. If `message` is at least `errorSize - 1` characters\nlong, `error` is not NUL-terminated, causing out-of-bounds reads when the\ncaller treats it as a C string.","fix":"Explicitly terminate the buffer after copying, e.g. add\n`error[errorSize - 1u] = '\\0';` immediately after the `std::strncpy` call.","locations":[{"ref":"src/dxvk/dxvk_device_info.cpp:197-204","code":"  197 |   bool DxvkDeviceCapabilities::isSuitable(size_t errorSize, char* error) {\n  198 |     auto message = checkDeviceCompatibility();\n  199 | \n  200 |     if (message && errorSize)\n  201 |       std::strncpy(error, message->c_str(), errorSize - 1u);\n  202 | \n  203 |     return !message;\n  204 |   }","lines":8,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_device_info.cpp#L197-L204"}]},
