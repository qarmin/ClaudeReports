<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`D3D11Device::CreateInputLayout` writes into fixed-size `std::array` objects using `.at()` with indices that come directly from application-supplied data without any prior bounds check: `attrList.at(i)` is indexed by the loop counter `i`, which runs up to `NumElements` (an unclamped `UINT` parameter, never checked against `D3D11_IA_VERTEX_INPUT_RESOURCE_SLOT_COUNT`), and `bindList.at(binding.binding)` is indexed by `pInputElementDescs[i].InputSlot`, which is also never validated to be `< D3D11_IA_VERTEX_INPUT_RESOURCE_SLOT_COUNT`. `std::array::at()` throws `std::out_of_range` on an out-of-range index, but the enclosing `try` block only has `catch (const DxvkError& e)` (`DxvkError` is a plain, unrelated class, not derived from `std::exception`). The `std::out_of_range` exception is therefore never caught inside this `STDMETHODCALLTYPE` COM method and propagates across the COM ABI boundary, which for callers not expecting C++ exceptions typically results in `std::terminate()`/process crash. Any application (or malformed/fuzzed input) that passes `NumElements > 32` or an `InputSlot >= 32` triggers a denial-of-service crash instead of the expected `E_INVALIDARG`.","fix":"Validate indices before using them, and return `E_INVALIDARG` instead of throwing:\n```cpp\nif (NumElements > D3D11_IA_VERTEX_INPUT_RESOURCE_SLOT_COUNT)\n  return E_INVALIDARG;\n...\nif (pInputElementDescs[i].InputSlot >= D3D11_IA_VERTEX_INPUT_RESOURCE_SLOT_COUNT)\n  return E_INVALIDARG;\n```\nAdd these checks at the top of the per-element loop before any `.at()` call.","locations":[{"ref":"src/d3d11/d3d11_device.cpp:662-784","code":"  662 |   HRESULT STDMETHODCALLTYPE D3D11Device::CreateInputLayout(\n  663 |     const D3D11_INPUT_ELEMENT_DESC*   pInputElementDescs,\n  664 |           UINT                        NumElements,\n  665 |     const void*                       pShaderBytecodeWithInputSignature,\n  666 |           SIZE_T                      BytecodeLength,\n  667 |           ID3D11InputLayout**         ppInputLayout) {\n  668 |     InitReturnPtr(ppInputLayout);\n  669 | \n  670 |     // This check is somehow even correct, passing null with zero\n  671 |     // size will always fail but passing non-null with zero size\n  672 |     // works, provided the shader does not have any actual inputs\n  673 |     if (!pInputElementDescs)\n  674 |       return E_INVALIDARG;\n  675 | \n  676 |     try {\n  677 |       dxbc_spv::dxbc::Container container(pShaderBytecodeWithInputSignature, BytecodeLength);\n  678 |       auto isgnChunk = container.getInputSignatureChunk();\n  679 | \n  680 |       if (!isgnChunk)\n  681 |         return E_INVALIDARG;\n  682 | \n  683 |       dxbc_spv::dxbc::Signature inputSignature(std::move(isgnChunk));\n  684 | \n  685 |       uint32_t attrMask = 0;\n  686 |       uint32_t bindMask = 0;\n  687 |       uint32_t locationMask = 0;\n  688 |       uint32_t bindingsDefined = 0;\n  689 | \n  690 |       std::array<DxvkVertexAttribute, D3D11_IA_VERTEX_INPUT_RESOURCE_SLOT_COUNT> attrList = { };\n  691 |       std::array<DxvkVertexBinding,   D3D11_IA_VERTEX_INPUT_RESOURCE_SLOT_COUNT> bindList = { };\n  692 | \n  693 |       for (uint32_t i = 0; i < NumElements; i++) {\n  694 |         auto entry = inputSignature.findSemantic(0u,\n  695 |           pInputElementDescs[i].SemanticName,\n  696 |           pInputElementDescs[i].SemanticIndex);\n  697 | \n  698 |         // Create vertex input attribute description\n  699 |         DxvkVertexAttribute attrib = { };\n  700 |         attrib.location = entry != inputSignature.end() ? entry->getRegisterIndex() : 0;\n  701 |         attrib.binding  = pInputElementDescs[i].InputSlot;\n  702 |         attrib.format   = LookupFormat(pInputElementDescs[i].Format, DXGI_VK_FORMAT_MODE_COLOR).Format;\n  703 |         attrib.offset   = pInputElementDescs[i].AlignedByteOffset;\n  704 | \n  705 |         // The application may choose to let the implementation\n  706 |         // generate the exact vertex layout. In that case we'll\n  707 |         // pack attributes on the same binding in the order they\n  708 |         // are declared, aligning each attribute to four bytes.\n  709 |         const DxvkFormatInfo* formatInfo = lookupFormatInfo(attrib.format);\n  710 |         VkDeviceSize alignment = std::min<VkDeviceSize>(formatInfo->elementSize, 4);\n  711 | \n  712 |         if (attrib.offset == D3D11_APPEND_ALIGNED_ELEMENT) {\n  713 |           attrib.offset = 0;\n  714 | \n  715 |           for (uint32_t j = 1; j <= i; j++) {\n  716 |             const DxvkVertexAttribute& prev = attrList.at(i - j);\n  717 | \n  718 |             if (prev.binding == attrib.binding) {\n  719 |               attrib.offset = align(prev.offset + lookupFormatInfo(prev.format)->elementSize, alignment);\n  720 |               break;\n  721 |             }\n  722 |           }\n  723 |         } else if (attrib.offset & (alignment - 1)) {\n  724 |           return E_INVALIDARG;\n  725 |         }\n  726 | \n  727 |         attrList.at(i) = attrib;\n  728 | \n  729 |         // Create vertex input binding description. The\n  730 |         // stride is dynamic state in D3D11 and will be\n  731 |         // set by D3D11DeviceContext::IASetVertexBuffers.\n  732 |         DxvkVertexBinding binding = { };\n  733 |         binding.binding   = pInputElementDescs[i].InputSlot;\n  734 |         binding.divisor   = pInputElementDescs[i].InstanceDataStepRate;\n  735 |         binding.inputRate = pInputElementDescs[i].InputSlotClass == D3D11_INPUT_PER_INSTANCE_DATA\n  736 |           ? VK_VERTEX_INPUT_RATE_INSTANCE : VK_VERTEX_INPUT_RATE_VERTEX;\n  737 |         binding.extent    = entry != inputSignature.end() ? uint32_t(attrib.offset + formatInfo->elementSize) : 0u;\n  738 | \n  739 |         // Check if the binding was already defined. If so, the\n  740 |         // parameters must be identical (name n/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d11/d3d11_device.cpp#L662-L784"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`D3D11Device::CreateGeometryShaderWithStreamOutput` writes `xfbOffsets.at(i) = pBufferStrides[i]` for `i` in `[0, NumStrides)` without validating `NumStrides` against `D3D11_SO_BUFFER_SLOT_COUNT` (the capacity of the `xfbOffsets` array). Unlike the `pSODeclaration` loop just above it (which does check `so->OutputSlot >= D3D11_SO_BUFFER_SLOT_COUNT`), this loop has no bound check at all, and the whole function has no `try`/`catch` block. An application passing `NumStrides > D3D11_SO_BUFFER_SLOT_COUNT` causes `std::array::at()` to throw `std::out_of_range`, which propagates uncaught out of this COM method and crashes the process.","fix":"Validate `NumStrides` before the loop:\n```cpp\nif (NumStrides > D3D11_SO_BUFFER_SLOT_COUNT)\n  return E_INVALIDARG;\n\nfor (uint32_t i = 0; i < NumStrides; i++)\n  xfbOffsets.at(i) = pBufferStrides[i];\n```","locations":[{"ref":"src/d3d11/d3d11_device.cpp:888-890","code":"  888 |     // If necessary, override the buffer strides\n  889 |     for (uint32_t i = 0; i < NumStrides; i++)\n  890 |       xfbOffsets.at(i) = pBufferStrides[i];","lines":3,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d11/d3d11_device.cpp#L888-L890"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"high","difficulty":"very_easy","description":"`D3D11Device::CreateCounter` dereferences `pCounterDesc` unconditionally (`pCounterDesc->Counter`) without checking it for `nullptr` first. `CreateCounter` is a public `ID3D11Device::CreateCounter` entry point, and `pCounterDesc` is an application-supplied, nullable pointer per the D3D11 API contract (real D3D11 returns `E_INVALIDARG` for a null description instead of crashing). Calling `ID3D11Device::CreateCounter(nullptr, ...)` (a legal way for apps to probe support/parameter validation) crashes DXVK with a null-pointer dereference.","fix":"```cpp\nHRESULT STDMETHODCALLTYPE D3D11Device::CreateCounter(\n  const D3D11_COUNTER_DESC*         pCounterDesc,\n        ID3D11Counter**             ppCounter) {\n  InitReturnPtr(ppCounter);\n\n  if (!pCounterDesc)\n    return E_INVALIDARG;\n\n  Logger::err(str::format(\"D3D11: Unsupported counter: \", pCounterDesc->Counter));\n  return E_INVALIDARG;\n}\n```","locations":[{"ref":"src/d3d11/d3d11_device.cpp:1274-1281","code":" 1274 |   HRESULT STDMETHODCALLTYPE D3D11Device::CreateCounter(\n 1275 |     const D3D11_COUNTER_DESC*         pCounterDesc,\n 1276 |           ID3D11Counter**             ppCounter) {\n 1277 |     InitReturnPtr(ppCounter);\n 1278 |     \n 1279 |     Logger::err(str::format(\"D3D11: Unsupported counter: \", pCounterDesc->Counter));\n 1280 |     return E_INVALIDARG;\n 1281 |   }","lines":8,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d11/d3d11_device.cpp#L1274-L1281"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`D3D11DeviceContextExt<ContextType>::LaunchCubinShaderNVX()` immediately does `static_cast<CubinShaderWrapper*>(hShader)` and then calls `cubinShader->cuFunction()` / `cubinShader->blockDim()` with no null check on `hShader`. `hShader` is an opaque handle supplied by the caller (normally obtained from `CreateCubinComputeShaderWithNameNVX`, which can fail and leave the output handle unset per `src/d3d11/d3d11_device.cpp:2982-3013`). A caller that doesn't check the creation result, or that simply passes `nullptr`, causes a null pointer dereference and crashes the process instead of a controlled failure.","fix":"Validate the handle before use:\n```cpp\nCubinShaderWrapper* cubinShader = static_cast<CubinShaderWrapper*>(hShader);\nif (!cubinShader)\n  return false;\n```","locations":[{"ref":"src/d3d11/d3d11_context_ext.cpp:172-229","code":"  172 |   bool STDMETHODCALLTYPE D3D11DeviceContextExt<ContextType>::LaunchCubinShaderNVX(IUnknown* hShader, uint32_t GridX, uint32_t GridY, uint32_t GridZ,\n  173 |       const void* pParams, uint32_t ParamSize, void* const* pReadResources, uint32_t NumReadResources, void* const* pWriteResources, uint32_t NumWriteResources) {\n  174 |     D3D10DeviceLock lock = m_ctx->LockContext();\n  175 | \n  176 |     CubinShaderWrapper* cubinShader = static_cast<CubinShaderWrapper*>(hShader);\n  177 |     CubinShaderLaunchInfo launchInfo;\n  178 | \n  179 |     const uint32_t maxResources = NumReadResources + NumWriteResources;\n  180 |     launchInfo.buffers.reserve(maxResources);\n  181 |     launchInfo.images.reserve(maxResources);\n  182 | \n  183 |     for (uint32_t i = 0; i < NumReadResources; i++)\n  184 |       launchInfo.insertResource(static_cast<ID3D11Resource*>(pReadResources[i]), DxvkAccess::Read);\n  185 | \n  186 |     for (uint32_t i = 0; i < NumWriteResources; i++)\n  187 |       launchInfo.insertResource(static_cast<ID3D11Resource*>(pWriteResources[i]), DxvkAccess::Write);\n  188 | \n  189 |     launchInfo.paramSize = ParamSize;\n  190 |     launchInfo.params.resize(launchInfo.paramSize);\n  191 |     std::memcpy(launchInfo.params.data(), pParams, ParamSize);\n  192 | \n  193 |     launchInfo.cuLaunchConfig[0] = reinterpret_cast<void*>(0x01); // CU_LAUNCH_PARAM_BUFFER_POINTER\n  194 |     launchInfo.cuLaunchConfig[1] = launchInfo.params.data();\n  195 |     launchInfo.cuLaunchConfig[2] = reinterpret_cast<void*>(0x02); // CU_LAUNCH_PARAM_BUFFER_SIZE\n  196 |     launchInfo.cuLaunchConfig[3] = &launchInfo.paramSize; // yes, this actually requires a pointer to a size_t containing the parameter size\n  197 |     launchInfo.cuLaunchConfig[4] = reinterpret_cast<void*>(0x00); // CU_LAUNCH_PARAM_END\n  198 | \n  199 |     launchInfo.nvxLaunchInfo.function       = cubinShader->cuFunction();\n  200 |     launchInfo.nvxLaunchInfo.gridDimX       = GridX;\n  201 |     launchInfo.nvxLaunchInfo.gridDimY       = GridY;\n  202 |     launchInfo.nvxLaunchInfo.gridDimZ       = GridZ;\n  203 |     launchInfo.nvxLaunchInfo.blockDimX      = cubinShader->blockDim().width;\n  204 |     launchInfo.nvxLaunchInfo.blockDimY      = cubinShader->blockDim().height;\n  205 |     launchInfo.nvxLaunchInfo.blockDimZ      = cubinShader->blockDim().depth;\n  206 |     launchInfo.nvxLaunchInfo.sharedMemBytes = 0;\n  207 |     launchInfo.nvxLaunchInfo.paramCount     = 0;\n  208 |     launchInfo.nvxLaunchInfo.pParams        = nullptr;\n  209 |     launchInfo.nvxLaunchInfo.extraCount     = 1;\n  210 |     launchInfo.nvxLaunchInfo.pExtras        = launchInfo.cuLaunchConfig.data();\n  211 | \n  212 |     launchInfo.shader = cubinShader;\n  213 | \n  214 |     /* Need to capture by value in case this gets called from a deferred context */\n  215 |     m_ctx->AddCost(GpuCostEstimate::Dispatch);\n  216 | \n  217 |     m_ctx->EmitCs([cLaunchInfo = std::move(launchInfo)] (DxvkContext* ctx) {\n  218 |       ctx->launchCuKernelNVX(cLa {"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`D3D11ImmediateContext::ExecuteCommandList()` casts `pCommandList` to `D3D11CommandList*` without a null check and then unconditionally calls `commandList->EmitToCsThread(...)`. If an application passes `nullptr` as `pCommandList` (e.g. after a failed `FinishCommandList()` call, or simple misuse), this dereferences a null pointer and crashes the process instead of returning a graceful error. The equivalent `D3D11DeferredContext::ExecuteCommandList()` in `src/d3d11/d3d11_context_def.cpp:144-169` has the same gap, passing the unchecked null pointer straight into `m_commandList->AddCommandList(commandList)`.","fix":"Add an early-out guard, mirroring the pattern already used in `Signal`/`Wait`:\n```cpp\nvoid STDMETHODCALLTYPE D3D11ImmediateContext::ExecuteCommandList(\n        ID3D11CommandList*  pCommandList,\n        BOOL                RestoreContextState) {\n  D3D10DeviceLock lock = LockContext();\n\n  auto commandList = static_cast<D3D11CommandList*>(pCommandList);\n  if (unlikely(!commandList))\n    return;\n  ...\n```\nApply the analogous check in the deferred-context version before calling `m_commandList->AddCommandList(commandList)`.","locations":[{"ref":"src/d3d11/d3d11_context_imm.cpp:227-273","code":"  227 |   void STDMETHODCALLTYPE D3D11ImmediateContext::ExecuteCommandList(\n  228 |           ID3D11CommandList*  pCommandList,\n  229 |           BOOL                RestoreContextState) {\n  230 |     D3D10DeviceLock lock = LockContext();\n  231 | \n  232 |     auto commandList = static_cast<D3D11CommandList*>(pCommandList);\n  233 | \n  234 |     // Reset dirty binding tracking before submitting any CS chunks.\n  235 |     // This is needed so that any submission that might occur during\n  236 |     // this call does not disrupt bindings set by the deferred context.\n  237 |     ResetDirtyTracking();\n  238 | \n  239 |     // Clear state so that the command list can't observe any\n  240 |     // current context state. The command list itself will clean\n  241 |     // up after execution to ensure that no state changes done\n  242 |     // by the command list are visible to the immediate context.\n  243 |     ResetCommandListState();\n  244 | \n  245 |     // Flush any outstanding commands so that\n  246 |     // we don't mess up the execution order\n  247 |     FlushCsChunk();\n  248 |     \n  249 |     // As an optimization, flush everything if the\n  250 |     // number of pending draw calls is high enough.\n  251 |     ConsiderFlush(GpuFlushType::ImplicitWeakHint);\n  252 | \n  253 |     // Dispatch command list to the CS thread\n  254 |     commandList->EmitToCsThread([this] (DxvkCsChunkRef&& chunk, uint64_t cost, GpuFlushType flushType) {\n  255 |       EmitCsChunk(std::move(chunk));\n  256 | \n  257 |       // Return the sequence number from before the flush since\n  258 |       // that is actually going to be needed for resource tracking\n  259 |       uint64_t csSeqNum = m_csSeqNum;\n  260 | \n  261 |       // Consider a flush after every chunk in case the app\n  262 |       // submits a very large command list or the GPU is idle\n  263 |       AddCost(cost);\n  264 |       ConsiderFlush(flushType);\n  265 |       return csSeqNum;\n  266 |     });\n  267 | \n  268 |     // Restore the immediate context's state\n  269 |     if (RestoreContextState)\n  270 |       RestoreCommandListState();\n  271 |     else\n  272 |       ResetContextState();\n  273 |   }","lines":47,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d11/d3d11_context_imm.cpp#L227-L273"},{"ref":"src/d3d11/d3d11_context_def.cpp:144-169","code":"  144 |   void STDMETHODCALLTYPE D3D11DeferredContext::ExecuteCommandList(\n  145 |           ID3D11CommandList*  pCommandList,\n  146 |           BOOL                RestoreContextState) {\n  147 |     D3D10DeviceLock lock = LockContext();\n  148 | \n  149 |     // Clear state so that the command list can't observe any\n  150 |     // current context state. The command list itself will clean\n  151 |     // up after execution to ensure that no state changes done\n  152 |     // by the command list are visible to the immediate context.\n  153 |     ResetCommandListState();\n  154 | \n  155 |     // Flush any outstanding commands so that\n  156 |     // we don't mess up the execution order\n  157 |     FlushCsChunk();\n  158 |     \n  159 |     // Record any chunks from the given command list into the\n  160 |     // current command list and deal with context state\n  161 |     auto commandList = static_cast<D3D11CommandList*>(pCommandList);\n  162 |     m_chunkId = m_commandList->AddCommandList(commandList);\n  163 |     \n  164 |     // Restore deferred context state\n  165 |     if (RestoreContextState)\n  166 |       RestoreCommandListState();\n  167 |     else\n  168 |       ResetContextState();\n  169 |   }","lines":26,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d11/d3d11_context_def.cpp#L144-L169"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"`D3D11DXGISurface::Map` guards the early reset of `pLockedRect->Pitch`/`pLockedRect->pBits` with `if (pLockedRect)`, and correctly passes `pLockedRect ? &sr : nullptr` to `context->Map(...)`, but after a successful map it unconditionally writes `pLockedRect->Pitch = sr.RowPitch;` and `pLockedRect->pBits = ...` without re-checking for null. If `pLockedRect` is `nullptr`, this dereferences a null pointer and crashes. The presence of the earlier null check shows the function was meant to tolerate a null `pLockedRect`, but the final write path forgot the guard, and `sr` itself is left uninitialized in that case (since `nullptr` was passed to `context->Map`).","fix":"Guard the final writes the same way the initial reset is guarded:\n```cpp\nif (hr != S_OK)\n  return hr;\n\nif (pLockedRect) {\n  pLockedRect->Pitch = sr.RowPitch;\n  pLockedRect->pBits = reinterpret_cast<unsigned char*>(sr.pData);\n}\nreturn hr;\n```","locations":[{"ref":"src/d3d11/d3d11_texture.cpp:1086-1113","code":" 1086 |     if (pLockedRect) {\n 1087 |       pLockedRect->Pitch = 0;\n 1088 |       pLockedRect->pBits = nullptr;\n 1089 |     }\n 1090 | \n 1091 |     D3D11_MAP mapType;\n 1092 | \n 1093 |     if (MapFlags & DXGI_MAP_READ && MapFlags & DXGI_MAP_WRITE)\n 1094 |       mapType = D3D11_MAP_READ_WRITE;\n 1095 |     else if (MapFlags & DXGI_MAP_READ)\n 1096 |       mapType = D3D11_MAP_READ;\n 1097 |     else if (MapFlags & DXGI_MAP_WRITE && MapFlags & DXGI_MAP_DISCARD)\n 1098 |       mapType = D3D11_MAP_WRITE_DISCARD;\n 1099 |     else if (MapFlags & DXGI_MAP_WRITE)\n 1100 |       mapType = D3D11_MAP_WRITE;\n 1101 |     else\n 1102 |       return DXGI_ERROR_INVALID_CALL;\n 1103 |     \n 1104 |     D3D11_MAPPED_SUBRESOURCE sr;\n 1105 |     HRESULT hr = context->Map(m_resource, m_subresource,\n 1106 |       mapType, 0, pLockedRect ? &sr : nullptr);\n 1107 | \n 1108 |     if (hr != S_OK)\n 1109 |       return hr;\n 1110 | \n 1111 |     pLockedRect->Pitch = sr.RowPitch;\n 1112 |     pLockedRect->pBits = reinterpret_cast<unsigned char*>(sr.pData);\n 1113 |     return hr;","lines":28,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d11/d3d11_texture.cpp#L1086-L1113"}]},
{"id":"UAF_1","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"medium","description":"`D3D8StateBlock` captures D3D8-level object bindings (textures, stream-source vertex buffers, index buffer) into plain raw pointers with no reference counting at all:\n```cpp\nstruct D3D8VBOP {\n  IDirect3DVertexBuffer8* buffer = nullptr;\n  UINT                    stride = 0;\n};\nstruct D3D8CapturableState {\n  std::array<D3D8VBOP, d8caps::MAX_STREAMS>                      streams;\n  std::array<IDirect3DBaseTexture8*, d8caps::MAX_TEXTURE_STAGES> textures;\n  IDirect3DIndexBuffer8* indices = nullptr;\n  ...\n};\n```\n`D3D8StateBlock::Capture()` (`src/d3d8/d3d8_state_block.cpp:71-91`) stores these raw pointers straight from `m_device->m_streams[stream].buffer.ptr()` / `m_device->m_textures[stage].ptr()` / `m_device->m_indices.ptr()` without taking any reference. `D3D8Device` itself keeps its own bound resources alive using `Com<D3D8Texture2D, false>` / `Com<D3D8VertexBuffer, false>` (a private, non-public refcount - see `m_textures`/`m_streams`/`m_indices` in `src/d3d8/d3d8_device.h:460-465`), specifically so that internally-cached bindings survive the app releasing its own public COM reference. `D3D8StateBlock` does not follow this same pattern for its captured D3D8-level state.\n\nIf the application creates/records a state block, then `Release()`s a texture or vertex/index buffer that was bound at capture time (dropping it to zero total refcount, since the device's own private ref only covers what is *currently* bound, not what was bound when a state block was captured), the wrapper object is destroyed. A later `IDirect3DDevice8::ApplyStateBlock()` call (`D3D8StateBlock::Apply()`, `src/d3d8/d3d8_state_block.cpp:96-130`) then calls `m_device->SetTexture(stage, m_state.textures[stage])` / `SetStreamSource(...)` / `SetIndices(...)` with a dangling pointer, which is subsequently `static_cast` and dereferenced (e.g. `GetD3D9Nullable()`, or `tex->GetLevelDesc(...)` under `shadowPerspectiveDivide`) - a use-after-free.","fix":"Store the captured D3D8-level bindings using the same private-refcount `Com<T, false>` idiom the device itself uses for `m_textures`/`m_streams`/`m_indices`, e.g.:\n```cpp\nstruct D3D8VBOP {\n  Com<D3D8VertexBuffer, false> buffer;\n  UINT                         stride = 0;\n};\nstruct D3D8CapturableState {\n  std::array<D3D8VBOP, d8caps::MAX_STREAMS>                             streams;\n  std::array<Com<D3D8Texture2D, false>, d8caps::MAX_TEXTURE_STAGES>     textures;\n  Com<D3D8IndexBuffer, false> indices;\n  ...\n};\n```\nso that captured resources are guaranteed to stay alive (via the existing private-refcount mechanism) between `Capture()` and `Apply()`/state-block destruction, regardless of what the application does with its own public references in the meantime.","locations":[{"ref":"src/d3d8/d3d8_state_block.h:39-54","code":"   39 |   struct D3D8VBOP {\n   40 |     IDirect3DVertexBuffer8* buffer = nullptr;\n   41 |     UINT                    stride = 0;\n   42 |   };\n   43 | \n   44 |   struct D3D8CapturableState {\n   45 |     std::array<D3D8VBOP, d8caps::MAX_STREAMS>                      streams;\n   46 |     std::array<IDirect3DBaseTexture8*, d8caps::MAX_TEXTURE_STAGES> textures;\n   47 | \n   48 |     IDirect3DIndexBuffer8* indices = nullptr;\n   49 |     UINT  baseVertexIndex    = 0;\n   50 |     DWORD vertexShaderHandle = 0;\n   51 |     DWORD pixelShaderHandle  = 0;\n   52 | \n   53 |     bool isSWVP = false; // D3DRS_SOFTWAREVERTEXPROCESSING\n   54 |   };","lines":16,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d8/d3d8_state_block.h#L39-L54"},{"ref":"src/d3d8/d3d8_state_block.cpp:71-91","code":"   71 |     if (m_captures.flags.test(D3D8CapturedStateFlag::VertexBuffers)) {\n   72 |       for (DWORD stream = 0; stream < m_state.streams.size(); stream++) {\n   73 |         if (m_captures.streams.get(stream)) {\n   74 |           m_state.streams[stream].buffer = m_device->m_streams[stream].buffer.ptr();\n   75 |           m_state.streams[stream].stride = m_device->m_streams[stream].stride;\n   76 |         }\n   77 |       }\n   78 |     }\n   79 | \n   80 |     if (m_captures.flags.test(D3D8CapturedStateFlag::Textures)) {\n   81 |       for (DWORD stage = 0; stage < m_state.textures.size(); stage++) {\n   82 |         if (m_captures.textures.get(stage))\n   83 |           m_state.textures[stage] = m_device->m_textures[stage].ptr();\n   84 |       }\n   85 |     }\n   86 | \n   87 |     if (m_captures.flags.test(D3D8CapturedStateFlag::VertexShader))\n   88 |       m_device->GetVertexShader(&m_state.vertexShaderHandle);\n   89 | \n   90 |     if (m_captures.flags.test(D3D8CapturedStateFlag::PixelShader))\n   91 |       m_device->GetPixelShader(&m_state.pixelShaderHandle);","lines":21,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d8/d3d8_state_block.cpp#L71-L91"},{"ref":"src/d3d8/d3d8_state_block.cpp:109-127","code":"  109 |     if (m_captures.flags.test(D3D8CapturedStateFlag::VertexBuffers)) {\n  110 |       for (DWORD stream = 0; stream < m_state.streams.size(); stream++) {\n  111 |         if (m_captures.streams.get(stream))\n  112 |           m_device->SetStreamSource(stream, m_state.streams[stream].buffer, m_state.streams[stream].stride);\n  113 |       }\n  114 |     }\n  115 | \n  116 |     if (m_captures.flags.test(D3D8CapturedStateFlag::Textures)) {\n  117 |       for (DWORD stage = 0; stage < m_state.textures.size(); stage++) {\n  118 |         if (m_captures.textures.get(stage))\n  119 |           m_device->SetTexture(stage, m_state.textures[stage]);\n  120 |       }\n  121 |     }\n  122 | \n  123 |     if (m_captures.flags.test(D3D8CapturedStateFlag::VertexShader))\n  124 |       m_device->SetVertexShader(m_state.vertexShaderHandle);\n  125 | \n  126 |     if (m_captures.flags.test(D3D8CapturedStateFlag::PixelShader))\n  127 |       m_device->SetPixelShader(m_state.pixelShaderHandle);","lines":19,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d8/d3d8_state_block.cpp#L109-L127"}]},
{"id":"UAF_2","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"hard","description":"`DxvkShaderCache::freeInstance()` has an inverted destruction condition. `decRef()` calls `freeInstance()` only when the reference count drops to `0`. Inside `freeInstance()` the object is deleted when `m_useCount.load() || s_instance.instance != this` is true, i.e. it deletes precisely when the count is *non-zero* (revived by a racing `getInstance()`), and does *nothing* in the normal case where `m_useCount == 0` and `s_instance.instance == this`.\n```\nif (m_useCount.load() || s_instance.instance != this) {\n  if (s_instance.instance == this)\n    s_instance.instance = nullptr;\n  delete this;\n}\n```\nConsequences:\n- Normal path (`m_useCount == 0`, `instance == this`): condition is `false || false` -> the object is never deleted and `s_instance.instance` keeps pointing at a zero-refcount object, so the destructor (which joins/flushes the writer thread) never runs. The cache singleton and its writer thread leak.\n- Revival race: after `fetch_sub` reaches 0 but before `freeInstance()` takes the lock, another thread runs `getInstance()`, takes the lock first and returns an `Rc` (incrementing the count to 1). When `freeInstance()` then runs, `m_useCount.load()` is `1`, the branch is taken, `s_instance.instance` is nulled and `delete this` frees the object that the other thread now holds a live reference to -> use-after-free.\nThe comment above the block (\"Don't destroy the object if another thread has essentially revived it\") documents the intended behavior, which is the opposite of what the code does.","fix":"Delete only when the object is truly dead (not revived): `if (!m_useCount.load()) { if (s_instance.instance == this) s_instance.instance = nullptr; delete this; }`. The `s_instance.instance != this` term must not be OR-ed with the ref-count check.","locations":[{"ref":"src/dxvk/dxvk_shader_cache.cpp:680-692","code":"  680 |   void DxvkShaderCache::freeInstance() {\n  681 |     std::lock_guard lock(s_instance.mutex);\n  682 | \n  683 |     // The ref count can only be incremented from 0 to 1 inside a locked\n  684 |     // context, so this check is safe. Don't destroy the object if another\n  685 |     // thread has essentially revived it.\n  686 |     if (m_useCount.load() || s_instance.instance != this) {\n  687 |       if (s_instance.instance == this)\n  688 |         s_instance.instance = nullptr;\n  689 | \n  690 |       delete this;\n  691 |     }\n  692 |   }","lines":13,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_shader_cache.cpp#L680-L692"}]},
{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"easy","description":"In `D3D9InterfaceEx::CreateDeviceEx`, the newly-constructed `D3D9DeviceEx` is created with `new` and never wrapped in a reference-counted smart pointer before `InitialReset` is called. `D3D9DeviceEx` derives from `ComObjectClamp`, whose `m_refCount`/`m_refPrivate` both start at `0`; the object is only wired up for COM lifetime management once `ref(device)` (an `AddRef`) is called on success. If `device->InitialReset(...)` fails (`FAILED(hr)`), the function does `return hr;` without ever calling `AddRef`/`Release`/`delete` on `device`, so the whole `D3D9DeviceEx` (plus the `DxvkDevice`, internal allocators, constant buffers, etc. it owns) is leaked. The same leak happens if `device->InitialReset` (or anything after construction) throws a `DxvkError`, since the `catch` block also just logs and returns `D3DERR_NOTAVAILABLE` without freeing `device`. This is reachable any time an application requests device creation with parameters that pass `ValidatePresentationParameters` but later fail during `InitialReset` (e.g. swapchain/backbuffer creation failure, out of memory), so it can be triggered repeatedly.","fix":"Delete (or otherwise properly dispose of) `device` on every failure path, e.g.:\n```cpp\nauto* device = new D3D9DeviceEx(\n  this, adapter, DeviceType, hFocusWindow, BehaviorFlags, dxvkDevice);\n\nif (!pPresentationParameters->Windowed)\n  ActivateFocusWindow(hFocusWindow ? hFocusWindow : pPresentationParameters->hDeviceWindow);\n\nhr = device->InitialReset(pPresentationParameters, pFullscreenDisplayMode);\n\nif (unlikely(FAILED(hr))) {\n  delete device;\n  return hr;\n}\n\n*ppReturnedDeviceInterface = ref(device);\n```\nBetter still, hold `device` in a scope-guarded smart pointer (e.g. `std::unique_ptr<D3D9DeviceEx>`) from the point of construction and only `.release()` it into `ppReturnedDeviceInterface` on the success path, so both the early `return hr;` and the `catch` block clean it up automatically.","locations":[{"ref":"src/d3d9/d3d9_interface.cpp:412-439","code":"  412 |     try {\n  413 |       auto dxvkDevice = dxvkAdapter->createDevice();\n  414 | \n  415 |       auto* device = new D3D9DeviceEx(\n  416 |         this,\n  417 |         adapter,\n  418 |         DeviceType,\n  419 |         hFocusWindow,\n  420 |         BehaviorFlags,\n  421 |         dxvkDevice);\n  422 | \n  423 |       if (!pPresentationParameters->Windowed)\n  424 |         ActivateFocusWindow(hFocusWindow ? hFocusWindow : pPresentationParameters->hDeviceWindow);\n  425 | \n  426 |       hr = device->InitialReset(pPresentationParameters, pFullscreenDisplayMode);\n  427 | \n  428 |       if (unlikely(FAILED(hr)))\n  429 |         return hr;\n  430 | \n  431 |       *ppReturnedDeviceInterface = ref(device);\n  432 |     }\n  433 |     catch (const DxvkError& e) {\n  434 |       Logger::err(e.message());\n  435 |       return D3DERR_NOTAVAILABLE;\n  436 |     }\n  437 | \n  438 |     return D3D_OK;\n  439 |   }","lines":28,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d9/d3d9_interface.cpp#L412-L439"}]},
{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"`D3D11GDISurface::D3D11GDISurface` creates a GDI device context with `desc.hDeviceDc = CreateCompatibleDC(nullptr)` before calling `D3DKMTCreateDCFromMemory(&desc)`. This `hDeviceDc` handle is only used as an input to `D3DKMTCreateDCFromMemory` and is never released afterward (there is no matching `DeleteDC` call anywhere in this file, nor in `~D3D11GDISurface`, which only tears down `m_hdc`/`m_hbitmap` via `D3DKMTDestroyDCFromMemory`). Every `D3D11GDISurface` constructed (i.e. every `IDXGISurface1::GetDC` call on a texture) leaks one GDI DC handle.","fix":"Delete the temporary compatible DC once it has been consumed by `D3DKMTCreateDCFromMemory`:\n```cpp\nHDC hDeviceDc = CreateCompatibleDC(nullptr);\ndesc.hDeviceDc = hDeviceDc;\n...\nif (D3DKMTCreateDCFromMemory(&desc))\n  Logger::err(str::format(\"D3D11: Failed to create GDI DC\"));\n\nDeleteDC(hDeviceDc);\n```","locations":[{"ref":"src/d3d11/d3d11_gdi.cpp:24-40","code":"   24 |     D3DKMT_CREATEDCFROMMEMORY desc;\n   25 |     desc.pMemory     = m_data.data();\n   26 |     desc.Format      = D3DFMT_A8R8G8B8;\n   27 |     desc.Width       = tex->Width;\n   28 |     desc.Height      = tex->Height;\n   29 |     desc.Pitch       = tex->Width * sizeof(uint32_t);\n   30 |     desc.hDeviceDc   = CreateCompatibleDC(nullptr);\n   31 |     desc.pColorTable = nullptr;\n   32 |     desc.hDc         = nullptr;\n   33 |     desc.hBitmap     = nullptr;\n   34 | \n   35 |     if (D3DKMTCreateDCFromMemory(&desc))\n   36 |       Logger::err(str::format(\"D3D11: Failed to create GDI DC\"));\n   37 |     \n   38 |     m_hdc     = desc.hDc;\n   39 |     m_hbitmap = desc.hBitmap;\n   40 |   }","lines":17,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d11/d3d11_gdi.cpp#L24-L40"}]},
{"id":"MEM_3","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"`DxvkFence` leaks its timeline semaphore when semaphore import fails. The\nsemaphore is created by `vkCreateSemaphore` at lines 39-40, but if\n`vkImportSemaphoreWin32HandleKHR` fails the constructor throws\n`DxvkError(\"Failed to import timeline semaphore\")`. Because the object is not\nfully constructed, `~DxvkFence()` (which calls `vkDestroySemaphore`) never runs,\nso the already-created `m_semaphore` is leaked.","fix":"Destroy `m_semaphore` before throwing on the import-failure path, e.g. call\n`m_vkd->vkDestroySemaphore(m_vkd->device(), m_semaphore, nullptr);` prior to\n`throw DxvkError(\"Failed to import timeline semaphore\");`, or use RAII so the\nsemaphore is released on any early exit.","locations":[{"ref":"src/dxvk/dxvk_fence.cpp:39-58","code":"   39 |     VkResult vr = m_vkd->vkCreateSemaphore(m_vkd->device(),\n   40 |       &semaphoreInfo, nullptr, &m_semaphore);\n   41 | \n   42 |     if (vr != VK_SUCCESS)\n   43 |       throw DxvkError(\"Failed to create timeline semaphore\");\n   44 | \n   45 |     if (info.sharedHandle != INVALID_HANDLE_VALUE) {\n   46 |       if (externalFeatures & VK_EXTERNAL_SEMAPHORE_FEATURE_IMPORTABLE_BIT) {\n   47 |         VkImportSemaphoreWin32HandleInfoKHR importInfo = { VK_STRUCTURE_TYPE_IMPORT_SEMAPHORE_WIN32_HANDLE_INFO_KHR };\n   48 |         importInfo.semaphore = m_semaphore;\n   49 |         importInfo.handleType = info.sharedType;\n   50 |         importInfo.handle = info.sharedHandle;\n   51 | \n   52 |         vr = m_vkd->vkImportSemaphoreWin32HandleKHR(m_vkd->device(), &importInfo);\n   53 |         if (vr != VK_SUCCESS)\n   54 |           throw DxvkError(\"Failed to import timeline semaphore\");\n   55 |       } else {\n   56 |         Logger::warn(str::format(\"Importing semaphores of type \", info.sharedType, \" not supported by device\"));\n   57 |       }\n   58 |     }","lines":20,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_fence.cpp#L39-L58"}]},
{"id":"MEM_4","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"In `DxvkResourceAllocation::~DxvkResourceAllocation()` the `delete m_sparsePageTable;` is nested inside the `if (m_flags.test(DxvkAllocationFlag::OwnsMemory))` block. Sparse resources do not always own a `VkDeviceMemory`: `createBufferResource` creates a sparse buffer via `createAllocation(new DxvkSparsePageTable(...), allocationInfo)` (the 3-arg overload), which sets `m_sparsePageTable` and later `DxvkAllocationFlag::OwnsBuffer`, but never `OwnsMemory` (`m_memory` stays `VK_NULL_HANDLE`). Likewise `createImageResource` for a sparse image with no metadata pages uses `createAllocation(pageTable.release(), allocationInfo)` (no `OwnsMemory`), and the metadata path only sets `OwnsMemory` when the metadata allocation happens to be dedicated (a small metadata allocation is usually suballocated). For all these cases the heap-allocated `DxvkSparsePageTable` is never `delete`d, leaking it (and its internal page metadata) on every sparse resource destruction.","fix":"Move the sparse page table cleanup out of the `OwnsMemory` branch so it is always freed, e.g. add an unconditional block after the memory handling:\n```cpp\nif (unlikely(m_flags.test(DxvkAllocationFlag::OwnsMemory))) {\n  auto vk = m_allocator->device()->vkd();\n  vk->vkFreeMemory(vk->device(), m_memory, nullptr);\n}\n\nif (unlikely(m_sparsePageTable))\n  delete m_sparsePageTable;\n```","locations":[{"ref":"src/dxvk/dxvk_memory.cpp:309-315","code":"  309 |     if (unlikely(m_flags.test(DxvkAllocationFlag::OwnsMemory))) {\n  310 |       auto vk = m_allocator->device()->vkd();\n  311 |       vk->vkFreeMemory(vk->device(), m_memory, nullptr);\n  312 | \n  313 |       if (unlikely(m_sparsePageTable))\n  314 |         delete m_sparsePageTable;\n  315 |     }","lines":7,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_memory.cpp#L309-L315"}]},
{"id":"MEM_5","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"In the Win32 backend `getMonitorEdid`, the device info set returned by `SetupDiGetClassDevsW` is never\nreleased. `const HDEVINFO devInfo = ::SetupDiGetClassDevsW(...)` is opened but `SetupDiDestroyDeviceInfoList(devInfo)`\nis never called on ANY return path (the early `return {}` when opening the reg key fails, the successful\n`return edidData` inside the loop, and the final `return {}`). Each call to `getMonitorEdid` (invoked during\nHDR/colorimetry initialization) therefore leaks an `HDEVINFO` handle. Additionally the return value is not\nchecked against `INVALID_HANDLE_VALUE` before use.","fix":"Check `devInfo != INVALID_HANDLE_VALUE` after `SetupDiGetClassDevsW`, and ensure `::SetupDiDestroyDeviceInfoList(devInfo)`\nruns on every exit path (e.g. via a scope guard / RAII wrapper, or by refactoring the returns to a single exit).","locations":[{"ref":"src/wsi/win32/wsi_monitor_win32.cpp:322-363","code":"  322 |     const HDEVINFO devInfo = ::SetupDiGetClassDevsW(&GUID_DEVINTERFACE_MONITOR, nullptr, nullptr, DIGCF_DEVICEINTERFACE);\n  323 | \n  324 |     SP_DEVICE_INTERFACE_DATA interfaceData;\n  325 |     memset(&interfaceData, 0, sizeof(interfaceData));\n  326 |     interfaceData.cbSize = sizeof(interfaceData);\n  327 | \n  328 |     for (DWORD monitorIdx = 0; ::SetupDiEnumDeviceInterfaces(devInfo, nullptr, &GUID_DEVINTERFACE_MONITOR, monitorIdx, &interfaceData); monitorIdx++) {\n  329 |       DxvkDeviceInterfaceDetail detailData;\n  330 |       // Josh: I'm taking no chances here. I don't trust this API at all.\n  331 |       memset(&detailData, 0, sizeof(detailData));\n  332 |       detailData.base.cbSize = sizeof(SP_DEVICE_INTERFACE_DETAIL_DATA_W);\n  333 | \n  334 |       SP_DEVINFO_DATA devInfoData;\n  335 |       memset(&devInfoData, 0, sizeof(devInfoData));\n  336 |       devInfoData.cbSize = sizeof(devInfoData);\n  337 | \n  338 |       if (!::SetupDiGetDeviceInterfaceDetailW(devInfo, &interfaceData, &detailData.base, sizeof(detailData), nullptr, &devInfoData))\n  339 |         continue;\n  340 | \n  341 |       // Check that this monitor matches the same one we are looking for.\n  342 |       // Note: For some reason the casing mismatches here, because this\n  343 |       // is a well-designed API.\n  344 |       // If it isn't what we are looking for, move along.\n  345 |       if (_wcsicmp(monitorDevicePath.c_str(), detailData.base.DevicePath) != 0)\n  346 |         continue;\n  347 | \n  348 |       HKEY deviceRegKey = ::SetupDiOpenDevRegKey(devInfo, &devInfoData, DICS_FLAG_GLOBAL, 0, DIREG_DEV, KEY_READ);\n  349 |       if (deviceRegKey == INVALID_HANDLE_VALUE) {\n  350 |         Logger::err(\"getMonitorEdid: Failed to open monitor device registry key.\");\n  351 |         return {};\n  352 |       }\n  353 | \n  354 |       auto edidData = readMonitorEdidFromKey(deviceRegKey);\n  355 | \n  356 |       ::RegCloseKey(deviceRegKey);\n  357 | \n  358 |       return edidData;\n  359 |     }\n  360 | \n  361 |     Logger::err(\"getMonitorEdid: Failed to find device interface for monitor using setupapi.\");\n  362 |     return {};\n  363 |   }","lines":42,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/wsi/win32/wsi_monitor_win32.cpp#L322-L363"}]},
{"id":"MEM_6","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"`VrInstance::getCompositor` loads the OpenVR module via `loadLibrary()` (setting `m_loadedOvrApi = true`)\nbefore attempting to obtain the compositor interface. On two failure paths it returns `nullptr` without\nfreeing the module: when `VR_GetGenericInterface` is not found, and when `VR_InitInternal` fails. Only\nthe third failure path (interface query fails after a successful `initInternal`) calls `shutdown()`.\nWhen `getCompositor` returns `nullptr`, `initInstanceExtensions` returns early and `initDeviceExtensions`\nalso returns early (both because `!m_vr_key && !m_compositor`), so `shutdown()`/`freeLibrary()` is never\nreached and the loaded `openvr_api_dxvk.dll` (or the referenced `openvr_api.dll`) reference leaks for the\nprocess lifetime.","fix":"Call `this->shutdown()` (or at least `freeLibrary()`) before every `return nullptr;` in `getCompositor` after `loadLibrary()` has succeeded, so the module reference is released on all failure paths.","locations":[{"ref":"src/dxvk/dxvk_openvr.cpp:247-282","code":"  247 |     if (!g_vrFunctions.getGenericInterface) {\n  248 |       Logger::warn(\"OpenVR: VR_GetGenericInterface not found\");\n  249 |       return nullptr;\n  250 |     }\n  251 |     \n  252 |     // Retrieve the compositor interface\n  253 |     vr::EVRInitError error = vr::VRInitError_None;\n  254 |     \n  255 |     vr::IVRCompositor* compositor = reinterpret_cast<vr::IVRCompositor*>(\n  256 |       g_vrFunctions.getGenericInterface(vr::IVRCompositor_Version, &error));\n  257 |     \n  258 |     if (error != vr::VRInitError_None || !compositor) {\n  259 |       if (!g_vrFunctions.initInternal\n  260 |        || !g_vrFunctions.shutdownInternal) {\n  261 |         Logger::warn(\"OpenVR: VR_InitInternal or VR_ShutdownInternal not found\");\n  262 |         return nullptr;\n  263 |       }\n  264 | \n  265 |       // If the app has not initialized OpenVR yet, we need\n  266 |       // to do it now in order to grab a compositor instance\n  267 |       g_vrFunctions.initInternal(&error, vr::VRApplication_Background);\n  268 |       m_initializedOpenVr = error == vr::VRInitError_None;\n  269 | \n  270 |       if (error != vr::VRInitError_None) {\n  271 |         Logger::warn(\"OpenVR: Failed to initialize OpenVR\");\n  272 |         return nullptr;\n  273 |       }\n  274 | \n  275 |       compositor = reinterpret_cast<vr::IVRCompositor*>(\n  276 |         g_vrFunctions.getGenericInterface(vr::IVRCompositor_Version, &error));\n  277 |       \n  278 |       if (error != vr::VRInitError_None || !compositor) {\n  279 |         Logger::warn(\"OpenVR: Failed to query compositor interface\");\n  280 |         this->shutdown();\n  281 |         return nullptr;\n  282 |       }","lines":36,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_openvr.cpp#L247-L282"},{"ref":"src/dxvk/dxvk_openvr.cpp:66-70","code":"   66 |     if (!m_vr_key && !m_compositor)\n   67 |       m_compositor = this->getCompositor();\n   68 | \n   69 |     if (!m_vr_key && !m_compositor)\n   70 |       return;","lines":5,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_openvr.cpp#L66-L70"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"critical","difficulty":"medium","description":"In `D3D11CommonContext::UpdateResource` (the shared implementation behind `UpdateSubresource`/`UpdateSubresource1`), the buffer-destination path validates a caller-supplied `D3D11_BOX` with `offset = pDstBox->left; length = pDstBox->right - offset;` followed by `if (unlikely(offset + length > bufferSize)) return;`. Both `left` and `right` are attacker/application-controlled `UINT` fields. If the caller passes a malformed box where `pDstBox->right < pDstBox->left` (never explicitly rejected here, unlike the texture path in `UpdateTexture` which does check `pDstBox->left >= pDstBox->right`), the unsigned subtraction `pDstBox->right - offset` wraps around to a huge `uint64_t` value close to `UINT64_MAX`. The subsequent `offset + length` then wraps back around (modular 64-bit arithmetic) to a small value that passes the `> bufferSize` bounds check, defeating the validation entirely. Execution then falls through to `context->UpdateBuffer(bufferResource, offset, length, pSrcData)`, whose `Length` parameter is a 32-bit `UINT`, truncating the huge 64-bit value to a large-but-nonzero 32-bit length. This length is used to size a staging allocation and drive `std::memcpy(stagingSlice.mapPtr(0), pSrcData, Length)` in `UpdateBuffer`, reading far past the end of the caller's actual source data buffer (`pSrcData`) and writing into an oversized staging/GPU buffer, resulting in an out-of-bounds read (and likely a crash or memory corruption / staging buffer overflow).","fix":"Explicitly reject an inverted box before doing arithmetic, mirroring the check already present in `UpdateTexture` (`src/d3d11/d3d11_context.cpp:5636-5640`):\n```cpp\nif (pDstBox) {\n  if (unlikely(pDstBox->left >= pDstBox->right))\n    return;\n\n  offset = pDstBox->left;\n  length = pDstBox->right - offset;\n}\n\nif (unlikely(offset + length > bufferSize))\n  return;\n```","locations":[{"ref":"src/d3d11/d3d11_context.cpp:5797-5821","code":" 5797 |       // Validate buffer range to update\n 5798 |       uint64_t offset = 0;\n 5799 |       uint64_t length = bufferSize;\n 5800 | \n 5801 |       if (pDstBox) {\n 5802 |         offset = pDstBox->left;\n 5803 |         length = pDstBox->right - offset;\n 5804 |       }\n 5805 | \n 5806 |       if (unlikely(offset + length > bufferSize))\n 5807 |         return;\n 5808 | \n 5809 |       // Still try to be fast if a box is provided but we update the full buffer\n 5810 |       if (likely(bufferResource->GetMapMode() == D3D11_COMMON_BUFFER_MAP_MODE_DIRECT)) {\n 5811 |         CopyFlags &= D3D11_COPY_DISCARD | D3D11_COPY_NO_OVERWRITE;\n 5812 | \n 5813 |         if (likely(length == bufferSize) || unlikely(CopyFlags != 0)) {\n 5814 |           context->UpdateMappedBuffer(bufferResource, offset, length, pSrcData, CopyFlags);\n 5815 |           return;\n 5816 |         }\n 5817 |       }\n 5818 | \n 5819 |       // Otherwise we can't really do anything fancy, so just do a GPU copy\n 5820 |       if (likely(length))\n 5821 |         context->UpdateBuffer(bufferResource, offset, length, pSrcData);","lines":25,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d11/d3d11_context.cpp#L5797-L5821"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"critical","difficulty":"easy","description":"In `D3D11Fence::CreateSharedHandle`, `lpName` is copied into a fixed-size stack buffer `WCHAR buffer[MAX_PATH]` without any length check. The code first writes a `\\Sessions\\<id>\\BaseNamedObjects\\` prefix via `swprintf` (roughly 30-40 wide characters) and then does `memcpy(buffer + len, lpName, (name_len + 1) * sizeof(WCHAR))` where `name_len = wcslen(lpName)` is completely attacker/application controlled. If `lpName` is longer than `MAX_PATH - len` characters, this overflows the stack buffer, corrupting adjacent stack memory (return address, other locals), which can crash the process or potentially be leveraged for code execution. `ID3D11Fence::CreateSharedHandle` is a public D3D11 API entry point, so any caller supplying a long shared-fence name can trigger this.","fix":"Bound-check the name length before copying, e.g.:\n```cpp\nDWORD session, len, name_len = wcslen(lpName);\nProcessIdToSessionId(GetCurrentProcessId(), &session);\nlen = swprintf(buffer, ARRAYSIZE(buffer), L\"\\\\Sessions\\\\%u\\\\BaseNamedObjects\\\\\", session);\nif (len + name_len + 1 > ARRAYSIZE(buffer))\n  return E_INVALIDARG;\nmemcpy(buffer + len, lpName, (name_len + 1) * sizeof(WCHAR));\n```\nAlternatively use a dynamically sized buffer (e.g. `std::vector<WCHAR>`) sized to `len + name_len + 1`.","locations":[{"ref":"src/d3d11/d3d11_fence.cpp:76-94","code":"   76 |     OBJECT_ATTRIBUTES attr = { };\n   77 |     attr.Length = sizeof(attr);\n   78 |     attr.SecurityDescriptor = const_cast<SECURITY_ATTRIBUTES*>(pAttributes);\n   79 | \n   80 |     WCHAR buffer[MAX_PATH];\n   81 |     UNICODE_STRING name_str;\n   82 |     if (lpName) {\n   83 |         DWORD session, len, name_len = wcslen(lpName);\n   84 | \n   85 |         ProcessIdToSessionId(GetCurrentProcessId(), &session);\n   86 |         len = swprintf(buffer, ARRAYSIZE(buffer), L\"\\\\Sessions\\\\%u\\\\BaseNamedObjects\\\\\", session);\n   87 |         memcpy(buffer + len, lpName, (name_len + 1) * sizeof(WCHAR));\n   88 |         name_str.MaximumLength = name_str.Length = (len + name_len) * sizeof(WCHAR);\n   89 |         name_str.MaximumLength += sizeof(WCHAR);\n   90 |         name_str.Buffer = buffer;\n   91 | \n   92 |         attr.ObjectName = &name_str;\n   93 |         attr.Attributes = OBJ_CASE_INSENSITIVE;\n   94 |     }","lines":19,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d11/d3d11_fence.cpp#L76-L94"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"critical","difficulty":"easy","description":"`D3D9DeviceEx::SetLight()` and `D3D9DeviceEx::LightEnable()` grow `m_state.lights` (a `std::vector<D3D9LightState>`) using `m_state.lights.resize(Index + 1)`, where `Index` is the caller-supplied `DWORD Index` parameter (a 32-bit unsigned type). If the application passes `Index == 0xFFFFFFFF`, the expression `Index + 1` is evaluated entirely in 32-bit unsigned arithmetic and wraps around to `0`, so `resize(0)` is called instead of growing the vector. The very next line, `auto& light = m_state.lights[Index];` (with the original, non-wrapped `Index` value), then indexes an empty (or otherwise far-too-small) vector at offset `0xFFFFFFFF`, producing a massive out-of-bounds heap access. `SetLight()` subsequently writes through this reference (`light.isValid = true; light.light = *pLight;`), turning this into an out-of-bounds heap **write** at an attacker/application-controlled offset, which is a severe memory-corruption primitive reachable directly from the public `IDirect3DDevice9::SetLight`/`LightEnable` API. Even without integer wraparound, passing a large but still 32-bit-safe `Index` (e.g. `0x7FFFFFFF`) causes an attempt to allocate tens of gigabytes for the vector, throwing an uncaught `std::bad_alloc` out of a `STDMETHODCALLTYPE` boundary and crashing the process (denial of service).","fix":"Bound-check `Index` before resizing and perform the size arithmetic in a wide type so it cannot wrap, e.g.:\n```cpp\nconstexpr DWORD MaxLightIndex = 0xffffu; // sane upper bound, no real title needs more\n\nif (unlikely(Index > MaxLightIndex))\n  return D3DERR_INVALIDCALL;\n\nif (Index >= m_state.lights.size())\n  m_state.lights.resize(size_t(Index) + 1);\n```\nApply the same fix to both `SetLight()` and `LightEnable()`, which contain the identical pattern.","locations":[{"ref":"src/d3d9/d3d9_device.cpp:2180-2202","code":" 2180 |   HRESULT STDMETHODCALLTYPE D3D9DeviceEx::SetLight(DWORD Index, const D3DLIGHT9* pLight) {\n 2181 |     D3D9DeviceLock lock = LockDevice();\n 2182 | \n 2183 |     if (unlikely(pLight == nullptr))\n 2184 |       return D3DERR_INVALIDCALL;\n 2185 | \n 2186 |     if (unlikely(ShouldRecord())) {\n 2187 |       m_recorder->SetLight(Index, pLight);\n 2188 |       return D3D_OK;\n 2189 |     }\n 2190 | \n 2191 |     if (Index >= m_state.lights.size())\n 2192 |       m_state.lights.resize(Index + 1);\n 2193 | \n 2194 |     auto& light = m_state.lights[Index];\n 2195 |     light.isValid = true;\n 2196 |     light.light = *pLight;\n 2197 | \n 2198 |     if (light.isEnabled)\n 2199 |       m_dirty.set(D3D9DeviceDirtyFlag::FFVertexData);\n 2200 | \n 2201 |     return D3D_OK;\n 2202 |   }","lines":23,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d9/d3d9_device.cpp#L2180-L2202"},{"ref":"src/d3d9/d3d9_device.cpp:2224-2245","code":" 2224 |   HRESULT STDMETHODCALLTYPE D3D9DeviceEx::LightEnable(DWORD Index, BOOL Enable) {\n 2225 |     D3D9DeviceLock lock = LockDevice();\n 2226 | \n 2227 |     if (unlikely(ShouldRecord())) {\n 2228 |       m_recorder->LightEnable(Index, Enable);\n 2229 |       return D3D_OK;\n 2230 |     }\n 2231 | \n 2232 |     if (unlikely(Index >= m_state.lights.size()))\n 2233 |       m_state.lights.resize(Index + 1);\n 2234 | \n 2235 |     auto& light = m_state.lights[Index];\n 2236 | \n 2237 |     if (light.isEnabled == bool(Enable))\n 2238 |       return D3D_OK;\n 2239 | \n 2240 |     light.isValid = true;\n 2241 |     light.isEnabled = bool(Enable);\n 2242 | \n 2243 |     m_dirty.set(D3D9DeviceDirtyFlag::FFVertexData);\n 2244 |     return D3D_OK;\n 2245 |   }","lines":22,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d9/d3d9_device.cpp#L2224-L2245"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"critical","difficulty":"easy","description":"`D3D9ShaderAnalysis::HandleDcl` writes `m_imageViewTypes[index] = ...` and ORs into `m_usedSamplers` using `index = dst.getIndex()`, which comes straight from the raw SM3 bytecode operand token. `Operand::getIndex()` (in `subprojects/dxbc-spirv/sm3/sm3_parser.h`) extracts an 11-bit field (`util::bextract(m_token, 0u, 11u)`), i.e. any value from 0 to 2047, and nothing in the SM3 parser or in `HandleDcl` clamps or validates this value against the actual number of sampler slots. `m_imageViewTypes` is declared as `std::array<VkImageViewType, 16u>` in `d3d9_shader_analysis.h`. A crafted vertex/pixel shader blob passed to `IDirect3DDevice9::CreateVertexShader`/`CreatePixelShader` containing a `dcl` instruction for a sampler register with an out-of-range index (e.g. register `s2000`) causes an out-of-bounds write to `m_imageViewTypes[index]`, corrupting adjacent memory of the `D3D9ShaderAnalysis` object. This runs unconditionally as part of `D3D9DeviceEx::CreateShaderModule` (`D3D9ShaderAnalysis analysis(reader, CanSWVP())` at d3d9_device.cpp:7890), i.e. on every shader the application submits, well before any bytecode length or well-formedness is otherwise confirmed, making this reachable from a single malformed/malicious shader blob.","fix":"Clamp/validate the sampler register index before using it as an array index, e.g.:\n```cpp\nif (registerType == RegisterType::eSampler) {\n  if (index >= m_imageViewTypes.size())\n    return false; // reject malformed shader\n\n  switch (dcl.getTextureType()) {\n    ...\n  }\n  m_usedSamplers |= 1u << index;\n  return true;\n}\n```\nThe same bound should be applied to every place that indexes `m_imageViewTypes` or shifts `m_usedSamplers` by a register index taken directly from bytecode.","locations":[{"ref":"src/d3d9/d3d9_shader_analysis.cpp:275-298","code":"  275 |   bool D3D9ShaderAnalysis::HandleDcl(const Instruction& op) {\n  276 |     dxbc_spv_assert(op.hasDcl());\n  277 |     const auto& dcl = op.getDcl();\n  278 |     dxbc_spv_assert(op.hasDst());\n  279 |     const auto& dst = op.getDst();\n  280 | \n  281 |     RegisterType registerType = dst.getRegisterType();\n  282 |     uint32_t index = dst.getIndex();\n  283 | \n  284 |     if (registerType == RegisterType::eSampler) {\n  285 |       switch (dcl.getTextureType()) {\n  286 |         case TextureType::eTexture3D:\n  287 |           m_imageViewTypes[index] = VK_IMAGE_VIEW_TYPE_3D;\n  288 |           break;\n  289 |         case TextureType::eTextureCube:\n  290 |           m_imageViewTypes[index] = VK_IMAGE_VIEW_TYPE_CUBE;\n  291 |           break;\n  292 |         case TextureType::eTexture2D:\n  293 |         default:\n  294 |           m_imageViewTypes[index] = VK_IMAGE_VIEW_TYPE_2D;\n  295 |           break;\n  296 |       }\n  297 |       m_usedSamplers |= 1u << index;\n  298 |       return true;","lines":24,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d9/d3d9_shader_analysis.cpp#L275-L298"},{"ref":"src/d3d9/d3d9_shader_analysis.h:264","code":"  264 |   std::array<VkImageViewType, 16u> m_imageViewTypes = {};","lines":1,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d9/d3d9_shader_analysis.h#L264"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"critical","difficulty":"easy","description":"`D3D9StateBlock::SetLight` and `D3D9StateBlock::LightEnable` take an application-controlled `DWORD Index` and do `if (Index >= m_state.lights.size()) m_state.lights.resize(Index + 1);` followed by `m_state.lights[Index]`. Since `Index` is a 32-bit unsigned value, if the caller passes `Index == 0xFFFFFFFF`, `Index + 1` wraps around to `0`, so `m_state.lights.resize(0)` shrinks (or leaves empty) the vector, and the subsequent `m_state.lights[Index]` indexes `std::vector::operator[]` at position `0xFFFFFFFF` with no bounds checking, which is a massive out-of-bounds access (effectively a wild pointer dereference), leading to a crash or memory corruption. This is reachable simply by recording a state block and calling `IDirect3DStateBlock9::SetLight`/light-enable equivalents (via `D3D9DeviceEx::SetLight`/`LightEnable` forwarding to `m_recorder` while `ShouldRecord()` is true) with a large `Index`; no malformed shader is required, just a large light index from the application.","fix":"Guard against the overflow and unreasonable indices, e.g.:\n```cpp\nHRESULT D3D9StateBlock::SetLight(DWORD Index, const D3DLIGHT9* pLight) {\n  if (Index >= caps::MaxEnabledLights * 64 /* sane upper bound */)\n    return D3DERR_INVALIDCALL;\n\n  if (Index >= m_state.lights.size())\n    m_state.lights.resize(size_t(Index) + 1);\n  ...\n}\n```\nUsing `size_t(Index) + 1` avoids the 32-bit wraparound, and an explicit upper bound avoids unbounded allocation from a single huge `Index`. Apply the same fix to `LightEnable`, and to the equivalent code path in `D3D9DeviceEx::SetLight`/`LightEnable`.","locations":[{"ref":"src/d3d9/d3d9_stateblock.cpp:190-200","code":"  190 |   HRESULT D3D9StateBlock::SetLight(DWORD Index, const D3DLIGHT9* pLight) {\n  191 |     if (Index >= m_state.lights.size())\n  192 |       m_state.lights.resize(Index + 1);\n  193 | \n  194 |     auto& light = m_state.lights[Index];\n  195 |     light.isValid = true;\n  196 |     light.light = *pLight;\n  197 | \n  198 |     m_captures.flags.set(D3D9CapturedStateFlag::Lights);\n  199 |     return D3D_OK;\n  200 |   }","lines":11,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d9/d3d9_stateblock.cpp#L190-L200"},{"ref":"src/d3d9/d3d9_stateblock.cpp:203-218","code":"  203 |   HRESULT D3D9StateBlock::LightEnable(DWORD Index, BOOL Enable) {\n  204 |     if (unlikely(Index >= m_state.lights.size()))\n  205 |       m_state.lights.resize(Index + 1);\n  206 | \n  207 |     // Apply default light on enable, but not disable.\n  208 |     // No idea if this is correct, but matches the old logic.\n  209 |     auto& light = m_state.lights[Index];\n  210 |     light.isEnabled = bool(Enable);\n  211 | \n  212 |     if (Enable)\n  213 |       light.isValid = true;\n  214 | \n  215 |     m_captures.lightEnabledChanges.set(Index, true);\n  216 |     m_captures.flags.set(D3D9CapturedStateFlag::Lights);\n  217 |     return D3D_OK;\n  218 |   }","lines":16,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d9/d3d9_stateblock.cpp#L203-L218"}]},
{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"Many `ID3D10Device` \"Get\" accessor methods in `D3D10Device` copy pipeline state into a fixed-size local stack array sized to the maximum D3D10 slot count, but forward the caller-supplied count (`NumBuffers`/`NumViews`/`NumSamplers`/`NumViewports`) straight to the corresponding `D3D11ImmediateContext` method without first clamping/rejecting it, unlike their `Set*` counterparts in the very same file which do perform this check (e.g. `IASetVertexBuffers` at `src/d3d10/d3d10_device.cpp:927-928`, `VSSetConstantBuffers` at `:1028-1029`). The underlying `D3D11CommonContext<ContextType>::GetConstantBuffers`/`GetShaderResources`/`GetSamplers`/`RSGetViewports`/`SOGetTargetsWithOffsets` implementations (see `src/d3d11/d3d11_context.cpp:4679-4708`, `:4711-4724`, `:4727-4739`, `:2529-2553`, `:2624-2645`) simply loop `for (i = 0; i < NumX; i++)` and write `ppOut[i]` with no awareness of the destination buffer's real capacity. If an application passes a count larger than the D3D10 maximum slot count (14/16/32 depending on the array), these functions write past the end of the local stack array in `D3D10Device`, corrupting the stack. This is a real out-of-bounds write reachable directly from the D3D10 COM interface, i.e. from guest application input crossing the compatibility-shim trust boundary. Affected: `IAGetVertexBuffers`, `VSGetConstantBuffers`, `VSGetShaderResources`, `VSGetSamplers`, `GSGetConstantBuffers`, `GSGetShaderResources`, `GSGetSamplers`, `PSGetConstantBuffers`, `PSGetShaderResources`, `PSGetSamplers`, `OMGetRenderTargets`, `RSGetViewports`, `SOGetTargets`.","fix":"Clamp/reject the count parameter the same way the `Set*` variants already do, before calling into `m_context`, e.g. for `VSGetConstantBuffers`:\n```cpp\nvoid STDMETHODCALLTYPE D3D10Device::VSGetConstantBuffers(\n        UINT                              StartSlot,\n        UINT                              NumBuffers,\n        ID3D10Buffer**                    ppConstantBuffers) {\n  ID3D11Buffer* d3d11Buffers[D3D11_COMMONSHADER_CONSTANT_BUFFER_API_SLOT_COUNT];\n\n  if (NumBuffers > D3D11_COMMONSHADER_CONSTANT_BUFFER_API_SLOT_COUNT)\n    return;\n\n  m_context->VSGetConstantBuffers(StartSlot, NumBuffers, d3d11Buffers);\n  ...\n```\nApply the analogous bound check (against the array's declared size) to every method listed above.","locations":[{"ref":"src/d3d10/d3d10_device.cpp:975-995","code":"  975 |   void STDMETHODCALLTYPE D3D10Device::IAGetVertexBuffers(\n  976 |           UINT                              StartSlot,\n  977 |           UINT                              NumBuffers,\n  978 |           ID3D10Buffer**                    ppVertexBuffers,\n  979 |           UINT*                             pStrides,\n  980 |           UINT*                             pOffsets) {\n  981 |     ID3D11Buffer* d3d11Buffers[D3D10_IA_VERTEX_INPUT_RESOURCE_SLOT_COUNT];\n  982 | \n  983 |     m_context->IAGetVertexBuffers(\n  984 |       StartSlot, NumBuffers,\n  985 |       ppVertexBuffers ? d3d11Buffers : nullptr,\n  986 |       pStrides, pOffsets);\n  987 | \n  988 |     if (ppVertexBuffers) {\n  989 |       for (uint32_t i = 0; i < NumBuffers; i++) {\n  990 |         ppVertexBuffers[i] = d3d11Buffers[i]\n  991 |           ? static_cast<D3D11Buffer*>(d3d11Buffers[i])->GetD3D10Iface()\n  992 |           : nullptr;\n  993 |       }\n  994 |     }\n  995 |   }","lines":21,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d10/d3d10_device.cpp#L975-L995"},{"ref":"src/d3d10/d3d10_device.cpp:1088-1100","code":" 1088 |   void STDMETHODCALLTYPE D3D10Device::VSGetConstantBuffers(\n 1089 |           UINT                              StartSlot,\n 1090 |           UINT                              NumBuffers,\n 1091 |           ID3D10Buffer**                    ppConstantBuffers) {\n 1092 |     ID3D11Buffer* d3d11Buffers[D3D11_COMMONSHADER_CONSTANT_BUFFER_API_SLOT_COUNT];\n 1093 |     m_context->VSGetConstantBuffers(StartSlot, NumBuffers, d3d11Buffers);\n 1094 | \n 1095 |     for (uint32_t i = 0; i < NumBuffers; i++) {\n 1096 |       ppConstantBuffers[i] = d3d11Buffers[i]\n 1097 |         ? static_cast<D3D11Buffer*>(d3d11Buffers[i])->GetD3D10Iface()\n 1098 |         : nullptr;\n 1099 |     }\n 1100 |   }","lines":13,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d10/d3d10_device.cpp#L1088-L1100"},{"ref":"src/d3d10/d3d10_device.cpp:1103-1115","code":" 1103 |   void STDMETHODCALLTYPE D3D10Device::VSGetShaderResources(\n 1104 |           UINT                              StartSlot,\n 1105 |           UINT                              NumViews,\n 1106 |           ID3D10ShaderResourceView**        ppShaderResourceViews) {\n 1107 |     ID3D11ShaderResourceView* d3d11Views[D3D10_COMMONSHADER_INPUT_RESOURCE_SLOT_COUNT];\n 1108 |     m_context->VSGetShaderResources(StartSlot, NumViews, d3d11Views);\n 1109 | \n 1110 |     for (uint32_t i = 0; i < NumViews; i++) {\n 1111 |       ppShaderResourceViews[i] = d3d11Views[i]\n 1112 |         ? static_cast<D3D11ShaderResourceView*>(d3d11Views[i])->GetD3D10Iface()\n 1113 |         : nullptr;\n 1114 |     }\n 1115 |   }","lines":13,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d10/d3d10_device.cpp#L1103-L1115"},{"ref":"src/d3d10/d3d10_device.cpp:1118-1130","code":" 1118 |   void STDMETHODCALLTYPE D3D10Device::VSGetSamplers(\n 1119 |           UINT                              StartSlot,\n 1120 |           UINT                              NumSamplers,\n 1121 |           ID3D10SamplerState**              ppSamplers) {\n 1122 |     ID3D11SamplerState* d3d11Samplers[D3D10_COMMONSHADER_SAMPLER_SLOT_COUNT];\n 1123 |     m_context->VSGetSamplers(StartSlot, NumSamplers, d3d11Samplers);\n 1124 | \n 1125 |     for (uint32_t i = 0; i < NumSamplers; i++) {\n 112
