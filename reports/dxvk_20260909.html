{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`DxvkShaderCache::loadCachedShaderLocked()` allocates a buffer sized by the untrusted, on-disk `entry.binarySize` (a `uint32_t` read verbatim from the LUT file) before performing any bounds or checksum validation: `std::vector<uint8_t> ir(entry.binarySize);`. A corrupted or truncated cache LUT can contain a `binarySize` of up to `0xFFFFFFFF` (~4 GB). Nothing checks that `entry.offset + entry.binarySize <= m_binFile.size()` prior to the allocation, so a bad value triggers a huge allocation and a likely `std::bad_alloc`. `lookupShader()` and its callers do not wrap this in a `try`/`catch`, so an uncaught exception during allocation would propagate/terminate rather than being handled as a cache miss.","fix":"Before allocating, validate the entry against the actual bin-file size, e.g. reject the entry (return `nullptr`) if `entry.binarySize == 0` or `entry.offset + entry.binarySize > m_binFile.size()`. Optionally cap `binarySize` to a sane maximum. This keeps a corrupt cache file from causing a massive allocation.","locations":[{"ref":"src/dxvk/dxvk_shader_cache.cpp:274-282","code":"  274 |   Rc<DxvkIrShader> DxvkShaderCache::loadCachedShaderLocked(const LutKey& key, const LutEntry& entry) {\n  275 |     std::vector<uint8_t> ir(entry.binarySize);\n  276 | \n  277 |     size_t offset = entry.offset;\n  278 | \n  279 |     if (!readBytes(m_binFile, ir.data(), offset, entry.binarySize)) {\n  280 |       Logger::warn(\"Failed to read cached shader binary\");\n  281 |       return nullptr;\n  282 |     }","lines":9,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_shader_cache.cpp#L274-L282"}]},
{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`HudItemSet::parseOption` only catches `std::invalid_argument` from `std::stof`, but `std::stof` also throws `std::out_of_range` when the value is out of `float` range (e.g. `\"1e999\"`). Since the HUD option string comes from the user-controlled `DXVK_HUD` environment variable / config, a value like `opacity=1e999` throws `std::out_of_range`, which propagates uncaught and terminates the process.","fix":"Also catch `std::out_of_range` (or catch `const std::exception&`) and leave `value` unchanged:\n```\ntry {\n  value = std::stof(str);\n} catch (const std::invalid_argument&) {\n  return;\n} catch (const std::out_of_range&) {\n  return;\n}\n```","locations":[{"ref":"src/dxvk/hud/dxvk_hud_item.cpp:91-97","code":"   91 |   void HudItemSet::parseOption(const std::string& str, float& value) {\n   92 |     try {\n   93 |       value = std::stof(str);\n   94 |     } catch (const std::invalid_argument&) {\n   95 |       return;\n   96 |     }\n   97 |   }","lines":7,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/hud/dxvk_hud_item.cpp#L91-L97"}]},
{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`D3D11on12Device::CreateWrappedResource`, `ReleaseWrappedResources`, and `AcquireWrappedResources` all call `m_d3d12Device->QueryInterface(__uuidof(ID3D12DXVKInteropDevice), ...)` into the local `interopDevice` without checking the returned `HRESULT`. If the query ever failed, `interopDevice` would remain null and the subsequent calls (`interopDevice->GetVulkanResourceInfo(...)`, `interopDevice->GetVulkanImageLayout(...)`) would dereference a null COM pointer. In practice `m_d3d12Device` is only ever a device that was already verified to expose `ID3D12DXVKInteropDevice` at `D3D11On12CreateDevice` time, so this is currently unreachable, but the missing check removes the safety net if that invariant is ever broken (e.g. a future code path constructing `D3D11on12Device` differently).","fix":"Check the `HRESULT` of each `QueryInterface` call and bail out (return `E_INVALIDARG` from `CreateWrappedResource`, or log-and-skip in the `Release`/`Acquire` loops) if it fails, mirroring the pattern already used for `pResource12->QueryInterface(__uuidof(ID3D12Resource), ...)` a few lines below.","locations":[{"ref":"src/d3d11/d3d11_on_12.cpp:49-50","code":"   49 |     Com<ID3D12DXVKInteropDevice> interopDevice;\n   50 |     m_d3d12Device->QueryInterface(__uuidof(ID3D12DXVKInteropDevice), reinterpret_cast<void**>(&interopDevice));","lines":2,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d11/d3d11_on_12.cpp#L49-L50"},{"ref":"src/d3d11/d3d11_on_12.cpp:112-113","code":"  112 |     Com<ID3D12DXVKInteropDevice> interopDevice;\n  113 |     m_d3d12Device->QueryInterface(__uuidof(ID3D12DXVKInteropDevice), reinterpret_cast<void**>(&interopDevice));","lines":2,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d11/d3d11_on_12.cpp#L112-L113"},{"ref":"src/d3d11/d3d11_on_12.cpp:133-134","code":"  133 |     Com<ID3D12DXVKInteropDevice> interopDevice;\n  134 |     m_d3d12Device->QueryInterface(__uuidof(ID3D12DXVKInteropDevice), reinterpret_cast<void**>(&interopDevice));","lines":2,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d11/d3d11_on_12.cpp#L133-L134"}]},
{"id":"ERR_10","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"Several `DxgiOutput` methods dereference their out-parameter without a null check, unlike sibling\nmethods (e.g. `GetDesc`/`GetDesc1`) which validate and return `DXGI_ERROR_INVALID_CALL`. `GetGammaControl`\nwrites `*pArray`, `SetGammaControl` reads `*pArray`, `GetGammaControlCapabilities` writes `*pGammaCaps`,\nand `GetFrameStatistics` writes `*pStats`, all without validating the pointer. A null pointer from the\napplication crashes instead of returning an error, and the handling is inconsistent across the class.","fix":"Add a `if (!pArray) / if (!pGammaCaps) / if (!pStats) return DXGI_ERROR_INVALID_CALL;` guard at the top\nof each of these methods, matching the pattern already used in `GetDesc`.","locations":[{"ref":"src/dxgi/dxgi_output.cpp:394-404","code":"  394 |   HRESULT STDMETHODCALLTYPE DxgiOutput::GetGammaControl(DXGI_GAMMA_CONTROL* pArray) {\n  395 |     DXGI_VK_MONITOR_DATA* monitorInfo = nullptr;\n  396 |     HRESULT hr = m_monitorInfo->AcquireMonitorData(m_monitor, &monitorInfo);\n  397 | \n  398 |     if (FAILED(hr))\n  399 |       return hr;\n  400 |     \n  401 |     *pArray = monitorInfo->GammaCurve;\n  402 |     m_monitorInfo->ReleaseMonitorData();\n  403 |     return S_OK;\n  404 |   }","lines":11,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxgi/dxgi_output.cpp#L394-L404"},{"ref":"src/dxgi/dxgi_output.cpp:407-416","code":"  407 |   HRESULT STDMETHODCALLTYPE DxgiOutput::GetGammaControlCapabilities(DXGI_GAMMA_CONTROL_CAPABILITIES* pGammaCaps) {\n  408 |     pGammaCaps->ScaleAndOffsetSupported = FALSE;\n  409 |     pGammaCaps->MaxConvertedValue       = 1.0f;\n  410 |     pGammaCaps->MinConvertedValue       = 0.0f;\n  411 |     pGammaCaps->NumGammaControlPoints   = DXGI_VK_GAMMA_CP_COUNT;\n  412 |     \n  413 |     for (uint32_t i = 0; i < pGammaCaps->NumGammaControlPoints; i++)\n  414 |       pGammaCaps->ControlPointPositions[i] = GammaControlPointLocation(i);\n  415 |     return S_OK;\n  416 |   }","lines":10,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxgi/dxgi_output.cpp#L407-L416"},{"ref":"src/dxgi/dxgi_output.cpp:372-391","code":"  372 |   HRESULT STDMETHODCALLTYPE DxgiOutput::GetFrameStatistics(DXGI_FRAME_STATISTICS* pStats) {\n  373 |     DXGI_VK_MONITOR_DATA* monitorInfo = nullptr;\n  374 |     HRESULT hr = m_monitorInfo->AcquireMonitorData(m_monitor, &monitorInfo);\n  375 | \n  376 |     if (FAILED(hr))\n  377 |       return hr;\n  378 | \n  379 |     // Need to acquire swap chain and unlock monitor data, since querying\n  380 |     // frame statistics from the swap chain will also access monitor data.\n  381 |     Com<IDXGISwapChain> swapChain = monitorInfo->pSwapChain;\n  382 |     m_monitorInfo->ReleaseMonitorData();\n  383 | \n  384 |     // This API only works if there is a full-screen swap chain active.\n  385 |     if (swapChain == nullptr) {\n  386 |       *pStats = DXGI_FRAME_STATISTICS();\n  387 |       return S_OK;\n  388 |     }\n  389 | \n  390 |     return swapChain->GetFrameStatistics(pStats);\n  391 |   }","lines":20,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxgi/dxgi_output.cpp#L372-L391"},{"ref":"src/dxgi/dxgi_output.cpp:436-452","code":"  436 |   HRESULT STDMETHODCALLTYPE DxgiOutput::SetGammaControl(const DXGI_GAMMA_CONTROL* pArray) {\n  437 |     DXGI_VK_MONITOR_DATA* monitorInfo = nullptr;\n  438 |     HRESULT hr = m_monitorInfo->AcquireMonitorData(m_monitor, &monitorInfo);\n  439 | \n  440 |     if (FAILED(hr))\n  441 |       return hr;\n  442 |     \n  443 |     monitorInfo->GammaCurve = *pArray;\n  444 | \n  445 |     if (monitorInfo->pSwapChain) {\n  446 |       hr = monitorInfo->pSwapChain->SetGammaControl(\n  447 |         DXGI_VK_GAMMA_CP_COUNT, pArray->GammaCurve);\n  448 |     }\n  449 | \n  450 |     m_monitorInfo->ReleaseMonitorData();\n  451 |     return hr;\n  452 |   }","lines":17,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxgi/dxgi_output.cpp#L436-L452"}]},
{"id":"ERR_11","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `DxgiSwapChain::SetFullscreenState`, the result of `pTarget->QueryInterface(IID_PPV_ARGS(&target))`\nis not checked before the returned interface is dereferenced with `target->GetDesc(&desc)`. `pTarget`\nis an arbitrary `IDXGIOutput*` supplied by the application; if it does not implement `IDXGIOutput1`\n(for example a foreign or wrapped output), `target` stays `nullptr` and `target->GetDesc(&desc)`\ndereferences a null pointer instead of returning an error.","fix":"Check the `HRESULT` from `QueryInterface` (or that `target != nullptr`) and return\n`DXGI_ERROR_INVALID_CALL` / `E_NOINTERFACE` before calling `target->GetDesc(&desc)`.","locations":[{"ref":"src/dxgi/dxgi_swapchain.cpp:539-550","code":"  539 |     if (pTarget) {\n  540 |       DXGI_OUTPUT_DESC desc;\n  541 | \n  542 |       pTarget->QueryInterface(IID_PPV_ARGS(&target));\n  543 |       target->GetDesc(&desc);\n  544 | \n  545 |       if (!m_descFs.Windowed && Fullscreen && m_monitor != desc.Monitor) {\n  546 |         HRESULT hr = this->LeaveFullscreenMode();\n  547 |         if (FAILED(hr))\n  548 |           return hr;\n  549 |       }\n  550 |     }","lines":12,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxgi/dxgi_swapchain.cpp#L539-L550"}]},
{"id":"ERR_12","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"`DxgiSwapChain::GetMaximumFrameLatency` writes `*pMaxLatency` without checking `pMaxLatency` for null,\nwhereas the analogous `GetSourceSize` guards each pointer. A null argument crashes rather than\nreturning an error.","fix":"Before:\n```\n    if (!(m_desc.Flags & DXGI_SWAP_CHAIN_FLAG_FRAME_LATENCY_WAITABLE_OBJECT))\n      return DXGI_ERROR_INVALID_CALL;\n\n    std::lock_guard<dxvk::recursive_mutex> lock(m_lockWindow);\n    *pMaxLatency = m_presenter->GetFrameLatency();\n```\nAfter:\n```\n    if (!(m_desc.Flags & DXGI_SWAP_CHAIN_FLAG_FRAME_LATENCY_WAITABLE_OBJECT))\n      return DXGI_ERROR_INVALID_CALL;\n\n    if (!pMaxLatency)\n      return E_INVALIDARG;\n\n    std::lock_guard<dxvk::recursive_mutex> lock(m_lockWindow);\n    *pMaxLatency = m_presenter->GetFrameLatency();\n```","locations":[{"ref":"src/dxgi/dxgi_swapchain.cpp:605-613","code":"  605 |   HRESULT STDMETHODCALLTYPE DxgiSwapChain::GetMaximumFrameLatency(\n  606 |           UINT*                     pMaxLatency) {\n  607 |     if (!(m_desc.Flags & DXGI_SWAP_CHAIN_FLAG_FRAME_LATENCY_WAITABLE_OBJECT))\n  608 |       return DXGI_ERROR_INVALID_CALL;\n  609 | \n  610 |     std::lock_guard<dxvk::recursive_mutex> lock(m_lockWindow);\n  611 |     *pMaxLatency = m_presenter->GetFrameLatency();\n  612 |     return S_OK;\n  613 |   }","lines":9,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxgi/dxgi_swapchain.cpp#L605-L613"}]},
{"id":"ERR_13","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `getExePath` on Linux, `readlink` returns `ssize_t` and can return `-1` on error, but the\nresult is stored in `size_t count`. On failure `count` becomes `SIZE_MAX`, and\n`std::string(exePath.begin(), exePath.begin() + count)` then constructs a string from a\nwildly out-of-bounds range, causing a crash or memory error. `readlink` also does not\nnull-terminate, so relying on `count` is required but the error case is unhandled.","fix":"Capture the result as `ssize_t count = readlink(...)` and handle `count < 0` (return `\"\"`) before constructing the string; clamp `count` to `exePath.size()`.","locations":[{"ref":"src/util/util_env.cpp:99-104","code":"   99 | #elif defined(__linux__)\n  100 |     std::array<char, PATH_MAX> exePath = {};\n  101 | \n  102 |     size_t count = readlink(\"/proc/self/exe\", exePath.data(), exePath.size());\n  103 | \n  104 |     return std::string(exePath.begin(), exePath.begin() + count);","lines":6,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/util/util_env.cpp#L99-L104"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"very_easy","description":"`D3D10Device::CreatePredicate` dereferences `pPredicateDesc->Query` and `pPredicateDesc->MiscFlags` without checking `pPredicateDesc` for `nullptr`, unlike the near-identical `CreateQuery` (`src/d3d10/d3d10_device.cpp:614-615`) which explicitly checks `if (pQueryDesc == nullptr) return E_INVALIDARG;` before touching the descriptor. A caller passing a null predicate description crashes with a null-pointer dereference instead of getting a defined `E_INVALIDARG` error.","fix":"Add the same guard used in `CreateQuery`:\n```cpp\nHRESULT STDMETHODCALLTYPE D3D10Device::CreatePredicate(\n  const D3D10_QUERY_DESC*                 pPredicateDesc,\n        ID3D10Predicate**                 ppPredicate) {\n  InitReturnPtr(ppPredicate);\n\n  if (pPredicateDesc == nullptr)\n    return E_INVALIDARG;\n\n  D3D11_QUERY_DESC d3d11Desc;\n  ...\n```","locations":[{"ref":"src/d3d10/d3d10_device.cpp:633-651","code":"  633 |   HRESULT STDMETHODCALLTYPE D3D10Device::CreatePredicate(\n  634 |     const D3D10_QUERY_DESC*                 pPredicateDesc,\n  635 |           ID3D10Predicate**                 ppPredicate) {\n  636 |     InitReturnPtr(ppPredicate);\n  637 | \n  638 |     D3D11_QUERY_DESC d3d11Desc;\n  639 |     d3d11Desc.Query      = D3D11_QUERY(pPredicateDesc->Query);\n  640 |     d3d11Desc.MiscFlags  = pPredicateDesc->MiscFlags;\n  641 | \n  642 |     ID3D11Predicate* d3d11Predicate = nullptr;\n  643 |     HRESULT hr = m_device->CreatePredicate(&d3d11Desc,\n  644 |       ppPredicate ? &d3d11Predicate : nullptr);\n  645 | \n  646 |     if (hr != S_OK)\n  647 |       return hr;\n  648 |     \n  649 |     *ppPredicate = D3D11Query::FromPredicate(d3d11Predicate)->GetD3D10Iface();\n  650 |     return S_OK;\n  651 |   }","lines":19,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d10/d3d10_device.cpp#L633-L651"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"very_easy","description":"`D3D8Device::CreateAdditionalSwapChain()` does not call `m_parent->ValidatePresentationParameters(pPresentationParameters)` before converting and forwarding the parameters to D3D9, unlike both `D3D8Interface::CreateDevice()` and `D3D8Device::Reset()`, which both validate first. This means D3D8-specific rules - e.g. rejecting `D3DSWAPEFFECT_COPY` with more than one back buffer, or rejecting a non-default `FullScreen_PresentationInterval` in windowed mode - are silently skipped for additional swap chains, even though the same struct type and the same D3D8 rules apply. This is an inconsistency that lets otherwise-invalid `D3DPRESENT_PARAMETERS` through for this one entry point.","fix":"Validate parameters the same way `Reset()` does:\n```cpp\nHRESULT STDMETHODCALLTYPE D3D8Device::CreateAdditionalSwapChain(\n    D3DPRESENT_PARAMETERS* pPresentationParameters,\n    IDirect3DSwapChain8** ppSwapChain) {\n  InitReturnPtr(ppSwapChain);\n\n  if (unlikely(pPresentationParameters == nullptr || ppSwapChain == nullptr))\n    return D3DERR_INVALIDCALL;\n\n  HRESULT res = m_parent->ValidatePresentationParameters(pPresentationParameters);\n  if (unlikely(FAILED(res)))\n    return res;\n  ...\n```","locations":[{"ref":"src/d3d8/d3d8_device.cpp:178-198","code":"  178 |   HRESULT STDMETHODCALLTYPE D3D8Device::CreateAdditionalSwapChain(\n  179 |       D3DPRESENT_PARAMETERS* pPresentationParameters,\n  180 |       IDirect3DSwapChain8** ppSwapChain) {\n  181 |     InitReturnPtr(ppSwapChain);\n  182 | \n  183 |     if (unlikely(pPresentationParameters == nullptr || ppSwapChain == nullptr))\n  184 |       return D3DERR_INVALIDCALL;\n  185 | \n  186 |     Com<d3d9::IDirect3DSwapChain9> pSwapChain9;\n  187 |     d3d9::D3DPRESENT_PARAMETERS params = ConvertPresentParameters9(pPresentationParameters);\n  188 |     HRESULT res = GetD3D9()->CreateAdditionalSwapChain(\n  189 |       &params,\n  190 |       &pSwapChain9\n  191 |     );\n  192 |     if (unlikely(FAILED(res)))\n  193 |       return res;\n  194 | \n  195 |     *ppSwapChain = ref(new D3D8SwapChain(this, pPresentationParameters, std::move(pSwapChain9)));\n  196 | \n  197 |     return D3D_OK;\n  198 |   }","lines":21,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d8/d3d8_device.cpp#L178-L198"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"hard","description":"`DxvkGraphicsPipeline::getOptimizedPipeline` emplaces into the `std::unordered_map`\n`m_fastPipelines`, releases `m_fastMutex`, and then keeps using the returned *iterator*\n`entry.first` to read and write the mapped value:\n\n```\nauto entry = m_fastPipelines.emplace(...);\nlock.unlock();\n...\nentry.first->second.pipeline = handle;\nentry.first->second.status.store(status);\n...\nreturn entry.first->second.pipeline;   // busy-wait path also derefs entry.first\n```\nFor `std::unordered_map`, insertion that triggers a rehash invalidates *all iterators*\n(only references/pointers to existing elements survive). After `unlock()`, another thread\nmay call `getOptimizedPipeline` and `emplace` a new pipeline, rehashing the table and\ninvalidating `entry.first`; the subsequent `entry.first->second` accesses are then undefined\nbehaviour and can read/write freed control blocks.","fix":"Capture a stable pointer to the mapped value while still holding the lock (references/pointers into `unordered_map` are stable across rehash), e.g. `auto* obj = &entry.first->second;` before `lock.unlock()`, and use `obj->...` afterwards instead of the iterator.","locations":[{"ref":"src/dxvk/dxvk_graphics.cpp:1412-1438","code":" 1412 |     auto entry = m_fastPipelines.emplace(std::piecewise_construct,\n 1413 |       std::tuple(key),\n 1414 |       std::tuple(VK_NOT_READY, VK_NULL_HANDLE));\n 1415 | \n 1416 |     lock.unlock();\n 1417 | \n 1418 |     if (entry.second) {\n 1419 |       // Pipeline doesn't exist yet. Compile it and write the status back last\n 1420 |       // so that other threads can safely read the pipeline handle.\n 1421 |       auto [status, handle] = createOptimizedPipeline(key);\n 1422 | \n 1423 |       entry.first->second.pipeline = handle;\n 1424 |       entry.first->second.status.store(status);\n 1425 | \n 1426 |       return handle;\n 1427 |     } else {\n 1428 |       // Pipeline already exists. Busy-wait until status becomes something\n 1429 |       // other than VK_NOT_READY in order to avoid compiling the same pipeline\n 1430 |       // on multiple threads in parallel, which is problematic on some drivers.\n 1431 |       // This should be quite rare anyway.\n 1432 |       sync::spin(1000u, [&entry] {\n 1433 |         auto status = entry.first->second.status.load();\n 1434 |         return status != VK_NOT_READY;\n 1435 |       });\n 1436 | \n 1437 |       return entry.first->second.pipeline;\n 1438 |     }","lines":27,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_graphics.cpp#L1412-L1438"}]},
{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"`D3D11SwapChain::DestroyFrameLatencyEvent` unconditionally calls `CloseHandle(m_frameLatencyEvent)`. `m_frameLatencyEvent` is only assigned a real handle in `CreateFrameLatencyEvent` when `DXGI_SWAP_CHAIN_FLAG_FRAME_LATENCY_WAITABLE_OBJECT` is set; for the common case of a non-waitable swap chain it stays `nullptr`, so every such swap chain destruction calls `CloseHandle(nullptr)`, which is an invalid-handle usage (flagged by tools like Application Verifier / gflags handle checks, and simply wasted work otherwise).","fix":"Guard the call:\n```cpp\nvoid D3D11SwapChain::DestroyFrameLatencyEvent() {\n  if (m_frameLatencyEvent)\n    CloseHandle(m_frameLatencyEvent);\n}\n```","locations":[{"ref":"src/d3d11/d3d11_swapchain.cpp:688-690","code":"  688 |   void D3D11SwapChain::DestroyFrameLatencyEvent() {\n  689 |     CloseHandle(m_frameLatencyEvent);\n  690 |   }","lines":3,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d11/d3d11_swapchain.cpp#L688-L690"}]},
{"id":"API_5","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"`D3D11VideoContext::VideoProcessorGetStreamAutoProcessingMode` writes `*pEnabled = state->autoProcessingEnabled;` unconditionally, whereas every other `VideoProcessorGetStream*`/`VideoProcessorGetOutput*` getter in this file (e.g. `VideoProcessorGetStreamFrameFormat`, `VideoProcessorGetStreamColorSpace`, `VideoProcessorGetStreamSourceRect`, `VideoProcessorGetOutputStereoMode`) guards the write with `if (pEnabled) ...`. This is an inconsistency that will null-pointer-dereference if `pEnabled` is ever null, unlike its sibling functions.","fix":"Guard the write like the other getters:\n```cpp\nif (pEnabled)\n  *pEnabled = state->autoProcessingEnabled;\n```","locations":[{"ref":"src/d3d11/d3d11_video.cpp:1138-1150","code":" 1138 |   void STDMETHODCALLTYPE D3D11VideoContext::VideoProcessorGetStreamAutoProcessingMode(\n 1139 |           ID3D11VideoProcessor*           pVideoProcessor,\n 1140 |           UINT                            StreamIndex,\n 1141 |           BOOL*                           pEnabled) {\n 1142 |     D3D10DeviceLock lock = m_ctx->LockContext();\n 1143 | \n 1144 |     auto state = static_cast<D3D11VideoProcessor*>(pVideoProcessor)->GetStreamState(StreamIndex);\n 1145 | \n 1146 |     if (!state)\n 1147 |       return;\n 1148 | \n 1149 |     *pEnabled = state->autoProcessingEnabled;\n 1150 |   }","lines":13,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d11/d3d11_video.cpp#L1138-L1150"}]},
{"id":"API_6","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"In `DisassembleShader()` (`src/d3d9/d3d9_util.cpp:15-38`), if both `LoadLibraryA(\"d3dx9.dll\")` and `LoadLibraryA(\"d3dx9_43.dll\")` fail, `d3d9x` stays `nullptr` and is passed straight into `GetProcAddress(d3d9x, \"D3DXDisassembleShader\")` without a null check:\n```cpp\nHMODULE d3d9x = LoadLibraryA(\"d3dx9.dll\");\nif (d3d9x == nullptr)\n  d3d9x = LoadLibraryA(\"d3dx9_43.dll\");\n\ng_pfnDisassembleShader =\n  reinterpret_cast<D3DXDisassembleShader>(GetProcAddress(d3d9x, \"D3DXDisassembleShader\"));\n```\nCalling `GetProcAddress` with an invalid/`NULL` module handle is undefined per the Win32 contract for the function (the handle is documented as required); relying on it merely returning `NULL` instead of failing on some loader implementations (including Wine's) is not guaranteed.","fix":"Skip the `GetProcAddress` call when the library failed to load:\n```cpp\nHMODULE d3d9x = LoadLibraryA(\"d3dx9.dll\");\nif (d3d9x == nullptr)\n  d3d9x = LoadLibraryA(\"d3dx9_43.dll\");\n\nif (d3d9x != nullptr) {\n  g_pfnDisassembleShader =\n    reinterpret_cast<D3DXDisassembleShader>(GetProcAddress(d3d9x, \"D3DXDisassembleShader\"));\n}\n```","locations":[{"ref":"src/d3d9/d3d9_util.cpp:20-27","code":"   20 |     if (g_pfnDisassembleShader == nullptr) {\n   21 |       HMODULE d3d9x = LoadLibraryA(\"d3dx9.dll\");\n   22 | \n   23 |       if (d3d9x == nullptr)\n   24 |         d3d9x = LoadLibraryA(\"d3dx9_43.dll\");\n   25 | \n   26 |       g_pfnDisassembleShader = \n   27 |         reinterpret_cast<D3DXDisassembleShader>(GetProcAddress(d3d9x, \"D3DXDisassembleShader\"));","lines":8,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d9/d3d9_util.cpp#L20-L27"}]},
{"id":"API_7","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`DxvkComputePipeline` has an unbalanced acquire/release on its shader pipeline library. `~DxvkComputePipeline()` unconditionally calls `m_library->releasePipelineHandle()`, but the matching `m_library->acquirePipelineHandle()` is only performed lazily on first use in `getPipelineHandle()` (guarded by `if (!m_libraryHandle)`). If a compute pipeline object is created (via `DxvkPipelineManager::createComputePipeline`, which always stores a non-null library) but `getPipelineHandle()` is never called - e.g. a compute shader is bound but never dispatched before device teardown - then `releasePipelineHandle()` runs without a prior `acquirePipelineHandle()`. When `mustTrackPipelineLifetime()` is true (32-bit + GPL builds), `releasePipelineHandle` executes `--m_useCount` on a `uint32_t m_useCount = 0u`, underflowing it to `0xFFFFFFFF` and leaking the library's pipeline (the `if (!(--m_useCount))` branch that would destroy it is never taken). The graphics pipeline pairs acquire/release 1:1 via `m_basePipelines`; compute does not.","fix":"Track whether the handle was acquired and only release when it was, e.g. release inside `if (m_libraryHandle)` in the destructor, or acquire eagerly in the constructor so acquire and release are always balanced. Mirror the 1:1 pairing used by `DxvkGraphicsPipeline`.","locations":[{"ref":"src/dxvk/dxvk_compute.cpp:29-35","code":"   29 |   DxvkComputePipeline::~DxvkComputePipeline() {\n   30 |     m_library->releasePipelineHandle();\n   31 | \n   32 |     m_pipelines.forEach([this] (const DxvkComputePipelineInstance& instance) {\n   33 |       this->destroyPipeline(instance.handle);\n   34 |     });\n   35 |   }","lines":7,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_compute.cpp#L29-L35"},{"ref":"src/dxvk/dxvk_compute.cpp:38-65","code":"   38 |   VkPipeline DxvkComputePipeline::getPipelineHandle(\n   39 |     const DxvkComputePipelineStateInfo& state) {\n   40 |     if (!m_libraryHandle) {\n   41 |       // Retrieve actual pipeline handle on first use. This\n   42 |       // may wait for an ongoing compile job to finish, or\n   43 |       // compile the pipeline immediately on the calling thread.\n   44 |       m_libraryHandle = m_library->acquirePipelineHandle().handle;\n   45 |     }\n   46 | \n   47 |     if (*m_libraryHandle) {\n   48 |       // Compute pipelines without spec constants are always\n   49 |       // pre-compiled, so we'll almost always hit this path\n   50 |       return *m_libraryHandle;\n   51 |     } else {\n   52 |       // Slow path for compute shaders that do use spec constants\n   53 |       DxvkComputePipelineInstance* instance = this->findInstance(state);\n   54 | \n   55 |       if (unlikely(!instance)) {\n   56 |         std::lock_guard<dxvk::mutex> lock(m_mutex);\n   57 |         instance = this->findInstance(state);\n   58 | \n   59 |         if (!instance)\n   60 |           instance = this->createInstance(state);\n   61 |       }\n   62 | \n   63 |       return instance->handle;\n   64 |     }\n   65 |   }","lines":28,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_compute.cpp#L38-L65"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`D3D11ShaderModuleSet::GetShaderModule` takes `std::unique_lock<dxvk::mutex> lock(m_mutex)` and holds it for the entire duration of the function, including the potentially expensive `D3D11CommonShader(...)` constructor call (DXBC parsing, IR conversion / SPIR-V generation via `D3D11ShaderConverter`). Since this is a single mutex shared by the whole `D3D11Device` (one `D3D11ShaderModuleSet` per device), any two threads compiling different (non-cached) shaders concurrently - e.g. during a game's parallel shader-warmup pass - are fully serialized on this lock, even though their compilations touch disjoint map entries and have no real data dependency.","fix":"Only hold the lock for the map lookup and for inserting the finished module; perform the actual `D3D11CommonShader` construction outside the lock (accepting the possibility of redundant concurrent compiles for the same key, then only keeping the first one inserted), or shard the map/mutex by shader key to reduce contention.","locations":[{"ref":"src/d3d11/d3d11_shader.cpp:328-359","code":"  328 |   HRESULT D3D11ShaderModuleSet::GetShaderModule(\n  329 |           D3D11Device*            pDevice,\n  330 |           D3D11ClassLinkage*      pLinkage,\n  331 |     const DxvkShaderHash&         ShaderKey,\n  332 |     const DxvkIrShaderCreateInfo& ModuleInfo,\n  333 |     const void*                   pShaderBytecode,\n  334 |           size_t                  BytecodeLength,\n  335 |     const D3D11ShaderIcbInfo&     Icb,\n  336 |     const D3D11BindingMask&       BindingMask,\n  337 |           D3D11CommonShader*      pShader) {\n  338 |     std::unique_lock<dxvk::mutex> lock(m_mutex);\n  339 | \n  340 |     auto entry = m_modules.find(ShaderKey);\n  341 |     if (entry != m_modules.end()) {\n  342 |       *pShader = entry->second;\n  343 |       return S_OK;\n  344 |     }\n  345 | \n  346 |     D3D11CommonShader module;\n  347 | \n  348 |     try {\n  349 |       module = D3D11CommonShader(pDevice, pLinkage, ShaderKey,\n  350 |         ModuleInfo, pShaderBytecode, BytecodeLength, Icb, BindingMask);\n  351 |     } catch (const DxvkError& e) {\n  352 |       Logger::err(e.message());\n  353 |       return E_INVALIDARG;\n  354 |     }\n  355 | \n  356 |     m_modules.insert({ ShaderKey, module });\n  357 |     *pShader = std::move(module);\n  358 |     return S_OK;\n  359 |   }","lines":32,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d11/d3d11_shader.cpp#L328-L359"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`D3D11DeferredContext::m_mappedResources` (declared `src/d3d11/d3d11_context_def.h:89`) is a flat `std::vector` that `AddMapEntry()` only ever appends to; entries for the same resource cookie are never removed or deduplicated, and the vector is cleared only once per `FinishCommandList()` call. Engines that issue many `Map(D3D11_MAP_WRITE_DISCARD)`/`Map(D3D11_MAP_WRITE_NO_OVERWRITE)` pairs on a small set of buffers within a single deferred command-list recording (a very common per-draw constant-buffer update pattern) will accumulate one stale entry per `Map` call for the lifetime of the recording, growing memory usage unboundedly and making `FindMapEntry()`'s reverse linear scan progressively more expensive whenever a less-recently-touched buffer is looked up.","fix":"Replace the append-only vector with a structure that keeps at most one live entry per cookie, e.g. a hash map keyed by `Cookie`, or overwrite the existing entry in place when `AddMapEntry` is called again for a cookie that is already present:\n```cpp\nvoid D3D11DeferredContext::AddMapEntry(\n        uint64_t                      Cookie,\n  const D3D11_MAPPED_SUBRESOURCE&     MapInfo) {\n  for (auto& entry : m_mappedResources) {\n    if (entry.ResourceCookie == Cookie) {\n      entry.MapInfo = MapInfo;\n      return;\n    }\n  }\n  m_mappedResources.push_back({ Cookie, MapInfo });\n}\n```","locations":[{"ref":"src/d3d11/d3d11_context_def.h:86-95","code":"   86 |     // Info about currently mapped (sub)resources. Using a vector\n   87 |     // here is reasonable since there will usually only be a small\n   88 |     // number of mapped resources per command list.\n   89 |     std::vector<D3D11DeferredContextMapEntry> m_mappedResources;\n   90 |     \n   91 |     // Begun and ended queries, will also be stored in command list\n   92 |     std::vector<Com<D3D11Query, false>> m_queriesBegun;\n   93 | \n   94 |     // Chunk ID within the current command list\n   95 |     uint64_t m_chunkId = 0ull;","lines":10,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d11/d3d11_context_def.h#L86-L95"},{"ref":"src/d3d11/d3d11_context_def.cpp:427-448","code":"  427 |   D3D11_MAPPED_SUBRESOURCE D3D11DeferredContext::FindMapEntry(\n  428 |           uint64_t                      Cookie) {\n  429 |     // Recently mapped resources as well as entries with\n  430 |     // up-to-date map infos will be located at the end\n  431 |     // of the resource array, so scan in reverse order.\n  432 |     size_t size = m_mappedResources.size();\n  433 | \n  434 |     for (size_t i = 1; i <= size; i++) {\n  435 |       const auto& entry = m_mappedResources[size - i];\n  436 | \n  437 |       if (entry.ResourceCookie == Cookie)\n  438 |         return entry.MapInfo;\n  439 |     }\n  440 | \n  441 |     return D3D11_MAPPED_SUBRESOURCE();\n  442 |   }\n  443 | \n  444 |   void D3D11DeferredContext::AddMapEntry(\n  445 |           uint64_t                      Cookie,\n  446 |     const D3D11_MAPPED_SUBRESOURCE&     MapInfo) {\n  447 |     m_mappedResources.push_back({ Cookie, MapInfo });\n  448 |   }","lines":22,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d11/d3d11_context_def.cpp#L427-L448"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`DxvkCommandList` declares the member `std::vector<Rc<DxvkDescriptorPool>> m_descriptorPools;` but it is never read or written anywhere in the codebase (the active descriptor pool is the separate single `m_descriptorPool` member). It is dead state that adds confusion and a small per-command-list footprint.","fix":"Remove the unused member.\nbefore:\n```\n    std::vector<Rc<DxvkDescriptorPool>> m_descriptorPools;\n\n    Rc<DxvkDescriptorPool>    m_descriptorPool;\n```\nafter:\n```\n    Rc<DxvkDescriptorPool>    m_descriptorPool;\n```","locations":[{"ref":"src/dxvk/dxvk_cmdlist.h:1384","code":" 1384 |     std::vector<Rc<DxvkDescriptorPool>> m_descriptorPools;","lines":1,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_cmdlist.h#L1384"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`DxvkDescriptorPool` declares `constexpr static uint32_t MaxDesiredPoolCount = 2;` but\nit is never referenced anywhere in the codebase. The pool-recycling logic in\n`getNextPool` grows `m_pools` without ever consulting a desired maximum, so the constant\nis leftover dead code.","fix":"Remove the unused `MaxDesiredPoolCount` constant, or actually use it to bound `m_pools` growth in `getNextPool`.","locations":[{"ref":"src/dxvk/dxvk_descriptor_pool.h:21","code":"   21 |     constexpr static uint32_t MaxDesiredPoolCount = 2;","lines":1,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_descriptor_pool.h#L21"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"In `DxvkDeviceCapabilities::decodeDriverVersion`, the `break;` after the\n`return Version(...)` in the `VK_DRIVER_ID_NVIDIA_PROPRIETARY` case is\nunreachable dead code, since the `return` statement always exits first.","fix":"Remove the unreachable `break;` on line 1103.","locations":[{"ref":"src/dxvk/dxvk_device_info.cpp:1103-1107","code":" 1103 |         return Version(\n 1104 |           (version >> 22) & 0x3ff,\n 1105 |           (version >> 14) & 0x0ff,\n 1106 |           (version >>  6) & 0x0ff);\n 1107 |         break;","lines":5,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_device_info.cpp#L1103-L1107"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`DxvkImageViewImageProperties::layout` is declared and default-initialized to `VK_IMAGE_LAYOUT_UNDEFINED` but is never written or read. `DxvkImageView::updateProperties` only sets `m_properties.samples` and `m_properties.access`, and no code path reads `m_properties.layout` (the view layout is obtained via `getLayout()`/`m_image->pickLayout(m_key.layout)` instead). The field and its comment about \"pointer chasing\" are misleading dead state.","fix":"Remove the unused `layout` member from `DxvkImageViewImageProperties`, or populate it in `updateProperties` if it is meant to cache the image's current layout.","locations":[{"ref":"src/dxvk/dxvk_image.h:116-120","code":"  116 |   struct DxvkImageViewImageProperties {\n  117 |     VkImageLayout         layout  = VK_IMAGE_LAYOUT_UNDEFINED;\n  118 |     VkSampleCountFlagBits samples = VK_SAMPLE_COUNT_FLAG_BITS_MAX_ENUM;\n  119 |     VkAccessFlags         access  = 0u;\n  120 |   };","lines":5,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_image.h#L116-L120"},{"ref":"src/dxvk/dxvk_image.cpp:820-823","code":"  820 |   void DxvkImageView::updateProperties() {\n  821 |     m_properties.samples = m_image->info().sampleCount;\n  822 |     m_properties.access = m_image->info().access;\n  823 |   }","lines":4,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_image.cpp#L820-L823"}]},
{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`extern VrInstance g_vrInstance;` is declared in the OpenVR header but the singleton is actually the static member `VrInstance::s_instance` (defined at `dxvk_openvr.cpp:23`). `g_vrInstance` has no definition and is never referenced, so the declaration is dead.","fix":"Remove the unused `extern VrInstance g_vrInstance;` declaration.","locations":[{"ref":"src/dxvk/dxvk_openvr.h:81","code":"   81 |   extern VrInstance g_vrInstance;","lines":1,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_openvr.h#L81"}]},
{"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In `DxvkPipelineManager::createGraphicsPipeline` the branch `if (!vsLibrary) { vsLibrary = createPipelineLibraryLocked(vsKey); }` is dead code. `vsLibrary` is obtained from `findPipelineLibraryLocked(vsKey)`, and `findPipelineLibraryLocked` never returns `nullptr`: when the key is not found it falls through to `return createPipelineLibraryLocked(key)`, which `emplace`s an entry and returns `&iter.first->second` (always non-null). Therefore the `if (!vsLibrary)` block can never execute, and the comment about \"create a pipeline library so that it can potentially be reused\" is misleading since the library was already created by the lookup.","fix":"Remove the redundant `if (!vsLibrary) { ... }` block, since `findPipelineLibraryLocked` already creates the library on demand. If a non-creating lookup was intended, add a separate lookup-only helper (e.g. returning `nullptr` when absent) and call that instead.","locations":[{"ref":"src/dxvk/dxvk_pipemanager.cpp:240-248","code":"  240 |     DxvkShaderPipelineLibrary* vsLibrary = findPipelineLibraryLocked(vsKey);\n  241 | \n  242 |     if (!vsLibrary) {\n  243 |       // If multiple shader stages are participating, create a\n  244 |       // pipeline library so that it can potentially be reused.\n  245 |       // Don't dispatch the pipeline library to a worker thread\n  246 |       // since it should be compiled on demand anyway.\n  247 |       vsLibrary = createPipelineLibraryLocked(vsKey);\n  248 |     }","lines":9,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_pipemanager.cpp#L240-L248"},{"ref":"src/dxvk/dxvk_pipemanager.cpp:407-415","code":"  407 |   DxvkShaderPipelineLibrary* DxvkPipelineManager::findPipelineLibraryLocked(\n  408 |     const DxvkShaderPipelineLibraryKey& key) {\n  409 |     auto pair = m_shaderLibraries.find(key);\n  410 | \n  411 |     if (pair != m_shaderLibraries.end())\n  412 |       return &pair->second;\n  413 | \n  414 |     return createPipelineLibraryLocked(key);\n  415 |   }","lines":9,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_pipemanager.cpp#L407-L415"}]},
{"id":"DEAD_7","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `DXGIVkSwapChainFactory::CreateSwapChain`, the local variable `vki` (`auto vki = m_device->GetDXVKDevice()->adapter()->vki();`) is computed but never used before the function creates the `D3D11SwapChain` and returns.","fix":"Remove the unused `vki` local, or pass it into `D3D11SwapChain`'s constructor if it was intended to be used there.","locations":[{"ref":"src/d3d11/d3d11_device.cpp:3714-3718","code":" 3714 |     try {\n 3715 |       auto vki = m_device->GetDXVKDevice()->adapter()->vki();\n 3716 | \n 3717 |       Com<D3D11SwapChain> presenter = new D3D11SwapChain(\n 3718 |         m_container, m_device, pSurfaceFactory, pDesc);","lines":5,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d11/d3d11_device.cpp#L3714-L3718"}]},
{"id":"DEAD_8","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`D3D11Device::InitCommandThreshold` is declared as a `constexpr static uint64_t` member but is never referenced anywhere in the codebase, making it dead code left over from a previous implementation.","fix":"Remove the unused `InitCommandThreshold` constant, or wire it into the actual init-command flushing logic in `D3D11Initializer` if it was meant to be used there.","locations":[{"ref":"src/d3d11/d3d11_device.h:51","code":"   51 |     constexpr static uint64_t InitCommandThreshold = 50;","lines":1,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d11/d3d11_device.h#L51"}]},
{"id":"DEAD_9","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`D3D9Initializer::NotifyContextFlushLocked()` is declared as a private member function in the class but is never defined anywhere in `d3d9_initializer.cpp`, nor is it called from any file. Only the (differently-locked) `NotifyContextFlush()` is implemented and used (from `D3D9DeviceEx`). The declaration is stale/vestigial and should either be removed or, if it was meant to be an internal locked variant used from within the class, implemented and wired up.","fix":"Remove the unused `void NotifyContextFlushLocked();` declaration from `D3D9Initializer` (or implement and call it if a lock-already-held variant of `NotifyContextFlush` was actually intended).","locations":[{"ref":"src/d3d9/d3d9_initializer.h:80","code":"   80 |     void NotifyContextFlushLocked();","lines":1,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d9/d3d9_initializer.h#L80"}]},
{"id":"DEAD_10","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"There is a stray, orphaned `#` character on its own line between the end of `D3D9ShaderModuleSet::GetShaderModule` and the closing `}` of the `dxvk` namespace. A lone `#` is parsed by the preprocessor as a harmless null directive, so it does not break the build, but it is clearly editing debris (e.g. a leftover from a removed `#if`/`#endif` or similar) rather than intentional code, and hurts readability/maintainability.","fix":"Remove the stray `#` line.","locations":[{"ref":"src/d3d9/d3d9_shader.cpp:1223","code":" 1223 | #","lines":1,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d9/d3d9_shader.cpp#L1223"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The comments above `fromHmonitor()` and `toHmonitor()` in `native_sdl3.h` say \"Offset so null HMONITORs go to -1\" / \"Offset so -1 display id goes to 0 == NULL\", copy-pasted from `native_glfw.h` / `native_sdl2.h`. But the SDL3 implementation does not perform any `+1`/`-1` offset at all (unlike the GLFW and SDL2 versions, which do `reinterpret_cast<intptr_t>(hMonitor) - 1` and `displayId + 1`). The comments describe behavior that was dropped when the function was adapted for `SDL_DisplayID`, which is misleading for anyone reading or modifying this code.","fix":"Update the comments to reflect the actual SDL3 behavior, e.g.:\n```cpp\n// SDL3 display IDs are opaque non-zero handles, so HMONITOR == nullptr\n// already maps to the invalid SDL_DisplayID 0 without needing an offset.\ninline SDL_DisplayID fromHmonitor(HMONITOR hMonitor) {\n  return SDL_DisplayID(reinterpret_cast<uintptr_t>(hMonitor));\n}\n\ninline HMONITOR toHmonitor(SDL_DisplayID display) {\n  return reinterpret_cast<HMONITOR>(uintptr_t(display));\n}\n```","locations":[{"ref":"include/native/wsi/native_sdl3.h:15-23","code":"   15 |   // Offset so null HMONITORs go to -1\n   16 |   inline SDL_DisplayID fromHmonitor(HMONITOR hMonitor) {\n   17 |     return SDL_DisplayID(reinterpret_cast<uintptr_t>(hMonitor));\n   18 |   }\n   19 | \n   20 |   // Offset so -1 display id goes to 0 == NULL\n   21 |   inline HMONITOR toHmonitor(SDL_DisplayID display) {\n   22 |     return reinterpret_cast<HMONITOR>(uintptr_t(display));\n   23 |   }","lines":9,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/include/native/wsi/native_sdl3.h#L15-L23"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment for `DxvkDescriptorUpdateList::update` documents a `buffers` parameter\n(`\\param [in] buffers Pointer to raw buffer ranges`) that does not exist; the function\nsignature only takes `dst` and `descriptors`. The stale parameter description is\nmisleading about the calling contract.","fix":"Delete the `\\param [in] buffers` line so the documentation matches the actual `update(void* dst, const DxvkDescriptor** descriptors)` signature.","locations":[{"ref":"src/dxvk/dxvk_descriptor_info.h:116-127","code":"  116 |      * \\param [in] dst Pointer to descriptor memory\n  117 |      * \\param [in] descriptors Pointer to source descriptor list\n  118 |      * \\param [in] buffers Pointer to raw buffer ranges\n  119 |      */\n  120 |     void update(\n  121 |             void*                   dst,\n  122 |       const DxvkDescriptor**        descriptors) const {\n  123 |       for (size_t i = 0u; i < m_entries.size(); i++) {\n  124 |         const auto& e = m_entries[i];\n  125 |         e.fn(dst, descriptors, e.range);\n  126 |       }\n  127 |     }","lines":12,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_descriptor_info.h#L116-L127"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment for `DxvkQuery::getData` claims it returns\n`DxvkGpuQueryStatus::Signaled`, but no such enumerator exists in\n`DxvkGpuQueryStatus` (whose values are `Invalid`, `Pending`, `Available`,\n`Failed`). The function actually returns `DxvkGpuQueryStatus::Available` on\nsuccess.","fix":"Update the comment to reference `DxvkGpuQueryStatus::Available` instead of\n`DxvkGpuQueryStatus::Signaled`.","locations":[{"ref":"src/dxvk/dxvk_gpu_query.h:213-225","code":"  213 |     /**\n  214 |      * \\brief Retrieves query data\n  215 |      * \n  216 |      * If all query data is available, this will\n  217 |      * return \\c DxvkGpuQueryStatus::Signaled, and\n  218 |      * the destination structure will be filled\n  219 |      * with the data retrieved from all associated\n  220 |      * query handles.\n  221 |      * \\param [out] queryData Query data\n  222 |      * \\returns Current query status\n  223 |      */\n  224 |     DxvkGpuQueryStatus getData(\n  225 |             DxvkQueryData&      queryData);","lines":13,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_gpu_query.h#L213-L225"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The Doxygen comment for `ComObject` has a stray `+` in place of the `*` comment continuation marker on one line, and a typo `refefence`. The line `+ greater than they expect. DXVK sometimes requires` breaks the visual comment block (it happens to compile only because it is inside a `/* ... */` block).","fix":"Change the leading `+` to `*` and fix the typo `refefence` -> `reference`:\n```\n   * references if the reference count of an object is\n   * greater than they expect. DXVK sometimes requires\n```","locations":[{"ref":"src/util/com/com_object.h:31-32","code":"   31 |    * references if the refefence count of an object is\n   32 |    + greater than they expect. DXVK sometimes requires","lines":2,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/util/com/com_object.h#L31-L32"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The doc comment on `DxvkPageAllocator::reviveChunk` says \"Makes all disabled chunks available for\nallocations again\", but the function only re-enables the single chunk identified by `chunkIndex`\n(`m_chunks[chunkIndex].disabled = false`). The \"all chunks\" wording actually describes `reviveChunks`\n(the parameterless overload declared just below) and was evidently copy-pasted.","fix":"Before:\n```\n     * \\brief Re-enables a chunk\n     *\n     * Makes all disabled chunks available for allocations again.\n     * Should be used before allocating new chunk memory.\n```\nAfter:\n```\n     * \\brief Re-enables a chunk\n     *\n     * Makes the given disabled chunk available for allocations again.\n     * Should be used before allocating new chunk memory.\n```","locations":[{"ref":"src/dxvk/dxvk_allocator.h:154-161","code":"  154 |     /**\n  155 |      * \\brief Re-enables a chunk\n  156 |      *\n  157 |      * Makes all disabled chunks available for allocations again.\n  158 |      * Should be used before allocating new chunk memory.\n  159 |      * \\param [in] chunkIndex Chunk index\n  160 |      */\n  161 |     void reviveChunk(uint32_t chunkIndex);","lines":8,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_allocator.h#L154-L161"}]},
{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The doc comment on `DxvkPoolAllocator::MaxSize` reads \"Minimum supported allocation size\", but the\nconstant is the maximum allocation size (`PageSize >> 1u`, half a page). The comment appears to be a\ncopy of the `MinSize` description and is misleading.","fix":"Before:\n```\n    /// Minimum supported allocation size. Always set to half a page\n    /// so that any pools we manage can at least hold two allocations.\n    constexpr static uint64_t MaxSize = DxvkPageAllocator::PageSize >> 1u;\n```\nAfter:\n```\n    /// Maximum supported allocation size. Always set to half a page\n    /// so that any pools we manage can at least hold two allocations.\n    constexpr static uint64_t MaxSize = DxvkPageAllocator::PageSize >> 1u;\n```","locations":[{"ref":"src/dxvk/dxvk_allocator.h:235-237","code":"  235 |     /// Minimum supported allocation size. Always set to half a page\n  236 |     /// so that any pools we manage can at least hold two allocations.\n  237 |     constexpr static uint64_t MaxSize = DxvkPageAllocator::PageSize >> 1u;","lines":3,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_allocator.h#L235-L237"}]},
{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"very_easy","description":"In `determineSparseMemoryTypes`, the dummy sparse buffer's `usage` lists `VK_BUFFER_USAGE_STORAGE_BUFFER_BIT` twice in the OR chain. Harmless (idempotent), but redundant and likely a copy-paste error where a different flag was intended.","fix":"Remove the duplicated `VK_BUFFER_USAGE_STORAGE_BUFFER_BIT` line (or replace it with the intended flag).","locations":[{"ref":"src/dxvk/dxvk_memory.cpp:2015-2016","code":" 2015 |                             | VK_BUFFER_USAGE_STORAGE_BUFFER_BIT\n 2016 |                             | VK_BUFFER_USAGE_STORAGE_BUFFER_BIT","lines":2,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/dxvk/dxvk_memory.cpp#L2015-L2016"}]},
{"id":"DUP_2","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"The `roundToNextPow2` helper and the `convertMode` helper are copy-pasted nearly verbatim between the GLFW and\nSDL2 monitor backends (`roundToNextPow2` is byte-identical apart from whitespace), while SDL3 re-implements the\nsame rounding inline with a different `bit::lzcnt`-based expression. Keeping three divergent copies of the same\nBPP-rounding / mode-conversion logic invites exactly the kind of one-backend-only fixes seen elsewhere in this\ndirectory. Consider hoisting a single shared helper (e.g. into `wsi_monitor.h`) used by all backends.","fix":"Extract one shared `roundToNextPow2`/`convertMode`-style helper and have GLFW, SDL2 and SDL3 all call it,\neliminating the divergent duplicates.","locations":[{"ref":"src/wsi/glfw/wsi_monitor_glfw.cpp:77-99","code":"   77 |   static inline uint32_t roundToNextPow2(uint32_t num) {\n   78 |     if (num-- == 0)\n   79 |       return 0;\n   80 | \n   81 |     num |= num >> 1;\n   82 |     num |= num >> 2;\n   83 |     num |= num >> 4;\n   84 |     num |= num >> 8;\n   85 |     num |= num >> 16;\n   86 | \n   87 |     return ++num;\n   88 |   }\n   89 | \n   90 | \n   91 |   static inline void convertMode(const GLFWvidmode& mode, WsiMode* pMode) {\n   92 |     pMode->width = uint32_t(mode.width);\n   93 |     pMode->height = uint32_t(mode.height);\n   94 |     pMode->refreshRate = WsiRational{uint32_t(mode.refreshRate) * 1000, 1000};\n   95 |     // BPP should always be a power of two\n   96 |     // to match Windows behaviour of including padding.\n   97 |     pMode->bitsPerPixel = roundToNextPow2(mode.blueBits + mode.redBits + mode.greenBits);\n   98 |     pMode->interlaced = false;\n   99 |   }","lines":23,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/wsi/glfw/wsi_monitor_glfw.cpp#L77-L99"},{"ref":"src/wsi/sdl2/wsi_monitor_sdl2.cpp:72-92","code":"   72 |   static inline uint32_t roundToNextPow2(uint32_t num) {\n   73 |     if (num-- == 0)\n   74 |       return 0;\n   75 | \n   76 |     num |= num >> 1; num |= num >> 2;\n   77 |     num |= num >> 4; num |= num >> 8;\n   78 |     num |= num >> 16;\n   79 | \n   80 |     return ++num;\n   81 |   }\n   82 | \n   83 | \n   84 |   static inline void convertMode(const SDL_DisplayMode& mode, WsiMode* pMode) {\n   85 |     pMode->width          = uint32_t(mode.w);\n   86 |     pMode->height         = uint32_t(mode.h);\n   87 |     pMode->refreshRate    = WsiRational{ uint32_t(mode.refresh_rate) * 1000, 1000 }; \n   88 |     // BPP should always be a power of two\n   89 |     // to match Windows behaviour of including padding.\n   90 |     pMode->bitsPerPixel   = roundToNextPow2(SDL_BITSPERPIXEL(mode.format));\n   91 |     pMode->interlaced     = false;\n   92 |   }","lines":21,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/wsi/sdl2/wsi_monitor_sdl2.cpp#L72-L92"},{"ref":"src/wsi/sdl3/wsi_platform_sdl3.h:19-38","code":"   19 |     static void convertMode(const SDL_DisplayMode& mode, WsiMode* pMode) {\n   20 |       pMode->width          = uint32_t(mode.w);\n   21 |       pMode->height         = uint32_t(mode.h);\n   22 |       if (mode.refresh_rate_numerator) {\n   23 |         pMode->refreshRate  = WsiRational {\n   24 |           uint32_t(mode.refresh_rate_numerator),\n   25 |           uint32_t(mode.refresh_rate_denominator) };\n   26 |       } else if (mode.refresh_rate > 0.0f) {\n   27 |         pMode->refreshRate  = WsiRational {\n   28 |           uint32_t(mode.refresh_rate * 1000.0f),\n   29 |           1000 };\n   30 |       } else {\n   31 |         // Platform gave us no refresh rate to work with, assume 60Hz :(\n   32 |         pMode->refreshRate  = WsiRational { 60, 1 };\n   33 |       }\n   34 |       // BPP should always be a power of two\n   35 |       // to match Windows behaviour of including padding.\n   36 |       pMode->bitsPerPixel   = (uint32_t(-1) >> bit::lzcnt(uint32_t(SDL_BITSPERPIXEL(mode.format) - 1u))) + 1u;\n   37 |       pMode->interlaced     = false;\n   38 |     }","lines":20,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/wsi/sdl3/wsi_platform_sdl3.h#L19-L38"}]},
{"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"high","difficulty":"medium","description":"When the `d3d8.batching` option is enabled, `D3D8Device::CreateVertexBuffer()` always returns a `D3D8BatchBuffer` (see `src/d3d8/d3d8_device.cpp:426-429`), which is backed purely by a system-memory `std::vector` and has no real D3D9 vertex buffer (`D3D8VertexBuffer(pDevice, nullptr, ...)` in `src/d3d8/d3d8_batch.h:27`). Consequently `D3D8VertexBuffer::GetD3D9Nullable()` returns `nullptr` for these buffers, and `D3D8Device::SetStreamSource()` always programs the real D3D9 device's stream 0 to `nullptr` whenever a batch buffer is bound (`GetD3D9()->SetStreamSource(StreamNumber, D3D8VertexBuffer::GetD3D9Nullable(buffer), 0, Stride);`), relying on `D3D8Batcher` to later feed vertex data directly via `DrawIndexedPrimitiveUP()`.\n\nHowever, `D3D8Device::DrawIndexedPrimitive()` (`src/d3d8/d3d8_device.cpp:1495-1511`) never consults `ShouldBatch()`/`m_batcher` and never calls `StateChange()` to flush pending batched draws. It forwards straight to `GetD3D9()->DrawIndexedPrimitive(...)`. Two problems result whenever batching is active and stream 0 currently holds a batch buffer:\n1. The real D3D9 device has a `nullptr` stream 0 bound (per above), so the indexed draw call executes with no actual vertex data bound, producing missing/garbage geometry.\n2. Even if a non-batched stream were bound, any primitives already queued in `m_batches` via prior `DrawPrimitive()` calls are not flushed before this indexed draw executes on the real device, so draw order is corrupted (the indexed draw renders before earlier, still-queued non-indexed batched draws).\n\nThis makes the `batching` option silently incompatible with any game that mixes `DrawIndexedPrimitive` with `DrawPrimitive`, with no validation, warning, or fallback.","fix":"At minimum, flush the batcher before issuing a real indexed draw call, mirroring what `DrawPrimitiveUP`/`DrawIndexedPrimitiveUP` already do:\n```cpp\nHRESULT STDMETHODCALLTYPE D3D8Device::DrawIndexedPrimitive(...) {\n  D3D8DeviceLock lock = LockDevice();\n  StateChange();\n  ...\n}\n```\nThat alone still leaves stream 0 bound to `nullptr` when a batch buffer is active, so a complete fix additionally needs the batcher to either reject/flag `CreateVertexBuffer` usage combined with indexed draws, or fall back the currently-bound stream to a real D3D9 buffer before an indexed draw executes.","locations":[{"ref":"src/d3d8/d3d8_device.cpp:1479-1495","code":" 1479 |   HRESULT STDMETHODCALLTYPE D3D8Device::DrawIndexedPrimitive(\n 1480 |           D3DPRIMITIVETYPE PrimitiveType,\n 1481 |           UINT             MinVertexIndex,\n 1482 |           UINT             NumVertices,\n 1483 |           UINT             StartIndex,\n 1484 |           UINT             PrimitiveCount) {\n 1485 |     D3D8DeviceLock lock = LockDevice();\n 1486 | \n 1487 |     return GetD3D9()->DrawIndexedPrimitive(\n 1488 |       d3d9::D3DPRIMITIVETYPE(PrimitiveType),\n 1489 |       static_cast<INT>(std::min(m_baseVertexIndex, // set by SetIndices()\n 1490 |                                 static_cast<UINT>(std::numeric_limits<int32_t>::max()))),\n 1491 |       MinVertexIndex,\n 1492 |       NumVertices,\n 1493 |       StartIndex,\n 1494 |       PrimitiveCount);\n 1495 |   }","lines":17,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d8/d3d8_device.cpp#L1479-L1495"},{"ref":"src/d3d8/d3d8_batch.h:215-233","code":"  215 |     inline void SetStream(UINT num, D3D8VertexBuffer* stream, UINT stride) {\n  216 |       if (unlikely(num != 0)) {\n  217 |         StateChange();\n  218 |         return;\n  219 |       }\n  220 |       if (unlikely(m_stream != stream || m_stride != stride)) {\n  221 |         StateChange();\n  222 |         m_stream = static_cast<D3D8BatchBuffer*>(stream);\n  223 |         m_stride = stride;\n  224 |       }\n  225 |     }\n  226 | \n  227 |     inline void SetIndices(D3D8IndexBuffer* indices, INT baseVertexIndex) {\n  228 |       if (m_indices != indices || m_baseVertexIndex != baseVertexIndex) {\n  229 |         StateChange();\n  230 |         m_indices = indices;\n  231 |         m_baseVertexIndex = baseVertexIndex;\n  232 |       }\n  233 |     }","lines":19,"link":"https://github.com/doitsujin/dxvk/blob/c833ea7e9af2a22ea6c88a202f95517f100ed945/src/d3d8/d3d8_batch.h#L215-L233"}]},
{"id":"ARCH_2","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"hard","description":"`D3D11ImmediateContext::MapImage()` is roughly 200 lines with deeply nested branching across texture map modes (`DIRECT`, `DYNAMIC`, `BUFFER`/`STAGING`), map types, and four combinable `doFlags` bits (`DoInvalidate`, `DoPreserve`, `DoWait`, plus a mode-specific bypass) that are set up in one large `if/else if` chain and consumed in another further down. This mixes resource-mode dispatch, GPU-wait heuristics, buffer readback, and staging invalidation/preserve logic in a single function, making it hard to reason about which combination of flags is reachable for a given mode/usage/CPU-access combination and increasing the risk that a future edit to one branch silently breaks an unrelated mode.","fix":"Split the mode-specific logic into smaller helper functions (e.g. one per `D3D11_COMMON_TEXTURE_MAP_MODE_*` value) that each compute and immediately act on their own wait/invalidate decision, rather than funneling every mode through one shared `doFlags` bitmask and a single large dispatch function.","locations":[{"ref":"src/d3d11/d3d11_context_imm.cpp:432-627","code":"  432 |   HRESULT D3D11ImmediateContext::MapImage(\n  433 |           D3D11CommonTexture*         pResource,\n  434 |           UINT                        Subresource,\n  435 |           D3D11_MAP                   MapType,\n  436 |           UINT                        MapFlags,\n  437 |           D3D11_MAPPED_SUBRESOURCE*   pMappedResource) {\n  438 |     auto mapMode = pResource->GetMapMode();\n  439 | \n  440 |     if (pMappedResource)\n  441 |       pMappedResource->pData = nullptr;\n  442 | \n  443 |     if (unlikely(Subresource >= pResource->CountSubresources()))\n  444 |       return E_INVALIDARG;\n  445 | \n  446 |     switch (MapType) {\n  447 |       case D3D11_MAP_READ: {\n  448 |         if (!(pResource->Desc()->CPUAccessFlags & D3D11_CPU_ACCESS_READ))\n  449 |           return E_INVALIDARG;\n  450 |       } break;\n  451 | \n  452 |       case D3D11_MAP_READ_WRITE: {\n  453 |         if (!(pResource->Desc()->CPUAccessFlags & D3D11_CPU_ACCESS_READ)\n  454 |          || !(pResource->Desc()->CPUAccessFlags & D3D11_CPU_ACCESS_WRITE))\n  455 |           return E_INVALIDARG;\n  456 |       } break;\n  457 | \n  458 |       case D3D11_MAP_WRITE: {\n  459 |         if (!(pResource->Desc()->CPUAccessFlags & D3D11_CPU_ACCESS_WRITE)\n  460 |          || (pResource->Desc()->Usage == D3D11_USAGE_DYNAMIC))\n  461 |           return E_INVALIDARG;\n  462 |       } break;\n  463 | \n  464 |       case D3D11_MAP_WRITE_DISCARD: {\n  465 |         if (!(pResource->Desc()->CPUAccessFlags & D3D11_CPU_ACCESS_WRITE)\n  466 |          || pResource->Desc()->Usage != D3D11_USAGE_DYNAMIC)\n  467 |           return E_INVALIDARG;\n  468 |       } break;\n  469 | \n  470 |       case D3D11_MAP_WRITE_NO_OVERWRITE: {\n  471 |         // NO_OVERWRITE is explcitly banned for dynamic images\n  472 |         if (!(pResource->Desc()->CPUAccessFlags & D3D11_CPU_ACCESS_WRITE)\n  473 |          || (pResource->Desc()->Usage != D3D11_USAGE_DEFAULT))\n  474 |           return E_INVALIDARG;\n  475 |       } break;\n  476 |     }\n  477 | \n  478 |     if (likely(pMappedResource != nullptr)) {\n  479 |       // Resources with an unknown memory layout cannot return a pointer\n  480 |       if (pResource->Desc()->Usage         == D3D11_USAGE_DEFAULT\n  481 |        && pResource->Desc()->TextureLayout == D3D11_TEXTURE_LAYOUT_UNDEFINED)\n  482 |         return E_INVALIDARG;\n  483 |     } else {\n  484 |       if (pResource->Desc()->Usage != D3D11_USAGE_DEFAULT)\n  485 |         return E_INVALIDARG;\n  486 |     }\n  487 | \n  488 |     VkFormat packedFormat = m_parent->LookupPackedFormat(\n  489 |       pResource->Desc()->Format, pResource->GetFormatMode()).Format;\n  490 |     \n  491 |     uint64_t sequenceNumber = pResource->GetSequenceNumber(Subresource);\n  492 | \n  493 |     auto formatInfo = lookupFormatInfo(packedFormat);\n  494 |     auto layout = pResource->GetSubresourceLayout(formatInfo->aspectMask, Subresource);\n  495 | \n  496 |     if (mapMode == D3D11_COMMON_TEXTURE_MAP_MODE_DIRECT) {\n  497 |       Rc<DxvkImage> mappedImage = pResource->GetImage();\n  498 | \n  499 |       if (MapType == D3D11_MAP_WRITE_DISCARD) {\n  500 |         EmitCs([\n  501 |           cImage = std::move(mappedImage),\n  502 |           cStorage = pResource->DiscardStorage()\n  503 |         ] (DxvkContext* ctx) {\n  504 |           ctx->invalidateImage(cImage, Rc<DxvkResourceAllocation>(cStorage), VK_IMAGE_LAYOUT_PREINITIALIZED);\n  505 |         });\n  506 | \n  507 |         ThrottleDiscard(layout.Size);\n  508 |       } else if (MapType != D3D11_MAP_WRITE_NO_OVERWRITE) {\n  509 |         if (!WaitForResource(*mappedImage, sequenceNumber, MapType, MapFlags))\n  510 |           return DXGI_ERROR_WAS_STILL_DRAWING;\n  511 |       }\n  512 |     } else if (mapMode == D3D11_COMMON_TEXTURE_MAP_MODE_DYNAMIC) {\n  513 |       // Nothing else to really do here, NotifyMap will ensure that we\n  514 |       // actually get a staging buffer that isn't currently in use.\n  515 |       ThrottleDiscard(layout.Size);\n  516 |     } else {\n  517 |       Rc<DxvkBuffer> mappedBuffer = pResource->GetMappedBuffer(Subresource);\n  518 | \n  519 |       constexpr uint32_t DoInvalidate = (1u << 0);\n  520 |       constexpr uint32_t DoPreserve   = (1u << 1);\n  521 |       constexpr uint32_t DoWait       = (1u << 2);\n  522 |       uint32_t doFlags;\n  523 | \n  524 |       if (mapMode == D3D11_COMMON_TEXTURE_MAP_MODE_BUFFER) {\n  525 |         // If the image can be written by the GPU, we need to update the\n  526 |         // mapped staging buffer to reflect the current image contents.\n  527 |         if (pResource->Desc()->Usage == D3D11_USAGE_DEFAULT) {\n  528 |           bool needsReadback = !pResource->NeedsDirtyRegionTracking();\n  529 | \n  530 |           needsReadba g GPU writes, need to wait for those\n  566 |           doFlags = DoWait;\n  567 |         } else if (mappedBuffer->isInUse(DxvkAccess::Read)) {\n  568 |           // All pending GPU accesses are reads, so the buffer data\n  569 |           // is still current, and we can prevent GPU synchronization\n  570 |           // by creating a new slice with an exact copy of the data.\n  571 |           doFlags = DoInvalidate | DoPreserve;\n  572 |         } else {\n  573 |           // There are no pending accesses, so we don't need to wait\n  574 |           doFlags = 0;\n  575 |         }\n  576 |       } else {\n  577 |         // No need to synchronize staging resources with NO_OVERWRITE\n  578 |         // since the buffer will be used directly.\n  579 |         doFlags = 0;\n  580 |       }\n  581 | \n  582 |       if (doFlags & DoInvalidate) {\n  583 |         VkDeviceSize bufferSize = mappedBuffer->info().size;\n  584 | \n  585 |         auto srcSlice = pResource->GetMappedSlice(Subresource);\n  586 |         auto dstSlice = pResource->DiscardSlice(Subresource);\n  587 | \n  588 |         auto srcPtr = srcSlice->mapPtr();\n  589 |         auto dstPtr = dstSlice->mapPtr();\n  590 | \n  591 |         EmitCs([\n  592 |           cImageBuffer      = std::move(mappedBuffer),\n  593 |           cImageBufferSlice = std::move(dstSlice)\n  594 |         ] (DxvkContext* ctx) mutable {\n  595 |           ctx->invalidateBuffer(cImageBuffer, std::move(cImageBufferSlice));\n  596 |         });\n  597 | \n  598 |         if (doFlags & DoPreserve)\n  599 |           std::memcpy(dstPtr, srcPtr, bufferSize);\n  600 | \n  601 |         ThrottleDiscard(bufferSize);\n  602 |       } else {\n  603 |         if (doFlags & DoWait) {\n  604 |           // We cannot respect DO_NOT_WAIT for buffer-mapped resources since\n  605 |           // our internal copies need to be transparent to the application.\n  606 |           if (mapMode == D3D11_COMMON_TEXTURE_MAP_MODE_BUFFER)\n  607 |
