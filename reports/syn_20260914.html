<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"scope_delimiter and start_of_buffer both `unreachable!()` if a Cursor's `scope` pointer does not point at an Entry::End. This is an internal invariant (all cursors are created via create/begin/empty, whose scope is always an End entry), so it is not currently reachable. However scope_delimiter is pub(crate) and consumed by lookahead error formatting; if a future refactor ever constructs a Cursor whose scope is a non-End entry, these become a hard panic during error reporting rather than a graceful path. The invariant is undocumented at the call sites.","fix":"Add a short comment at each unreachable!() documenting the invariant 'scope always points at an Entry::End (see Cursor::create)', so future editors do not break it inadvertently.","locations":[{"ref":"src/buffer.rs:399-407","code":"  399 |     pub(crate) fn scope_delimiter(self) -> Delimiter {\n  400 |         match unsafe { &*self.scope } {\n  401 |             Entry::End(_, offset) => match unsafe { &*self.scope.offset(*offset) } {\n  402 |                 Entry::Group(group, _) => group.delimiter(),\n  403 |                 _ => Delimiter::None,\n  404 |             },\n  405 |             _ => unreachable!(),\n  406 |         }\n  407 |     }","lines":9,"link":"https://github.com/dtolnay/syn/blob/d55bcd2546a3a34923c46da569edd65b38b3788d/src/buffer.rs#L399-L407"},{"ref":"src/buffer.rs:444-451","code":"  444 | fn start_of_buffer(cursor: Cursor) -> *const Entry {\n  445 |     unsafe {\n  446 |         match &*cursor.scope {\n  447 |             Entry::End(offset, _) => cursor.scope.offset(*offset),\n  448 |             _ => unreachable!(),\n  449 |         }\n  450 |     }\n  451 | }","lines":8,"link":"https://github.com/dtolnay/syn/blob/d55bcd2546a3a34923c46da569edd65b38b3788d/src/buffer.rs#L444-L451"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`multi_index` parses a field-access float token like `1.2` by splitting `float_repr` on '.' and feeding each part to `crate::parse_str::<Index>`. Each `Index::parse` runs `base10_digits().parse::<u32>()` (line 3042-3045). For a token such as `999999999999.0` the integer part exceeds u32 and produces a parse error that is surfaced as a normal syn error, which is fine; but note `multi_index` is reached from `trailer_helper` for any `<expr>.<float>` produced by proc-macro2 tokenization, so the u32 truncation boundary is externally driven. This is correctly returned as an Err (not a panic), so impact is limited; flagging the externally-derived integer parse for completeness.","fix":"No change required for correctness (overflow is reported as a parse error). Optionally document that tuple field indices are limited to u32 so callers are aware of the bound.","locations":[{"ref":"src/expr.rs:3143-3175","code":" 3143 |     fn multi_index(e: &mut Expr, dot_token: &mut Token![.], float: LitFloat) -> Result<bool> {\n 3144 |         let float_token = float.token();\n 3145 |         let float_span = float_token.span();\n 3146 |         let mut float_repr = float_token.to_string();\n 3147 |         let trailing_dot = float_repr.ends_with('.');\n 3148 |         if trailing_dot {\n 3149 |             float_repr.truncate(float_repr.len() - 1);\n 3150 |         }\n 3151 | \n 3152 |         let mut offset = 0;\n 3153 |         for part in float_repr.split('.') {\n 3154 |             let mut index: Index =\n 3155 |                 crate::parse_str(part).map_err(|err| Error::new(float_span, err))?;\n 3156 |             let part_end = offset + part.len();\n 3157 |             index.span = float_token.subspan(offset..part_end).unwrap_or(float_span);\n 3158 | \n 3159 |             let base = mem::replace(e, Expr::PLACEHOLDER);\n 3160 |             *e = Expr::Field(ExprField {\n 3161 |                 attrs: Vec::new(),\n 3162 |                 base: Box::new(base),\n 3163 |                 dot_token: Token![.](dot_token.span),\n 3164 |                 member: Member::Unnamed(index),\n 3165 |             });\n 3166 | \n 3167 |             let dot_span = float_token\n 3168 |                 .subspan(part_end..part_end + 1)\n 3169 |                 .unwrap_or(float_span);\n 3170 |             *dot_token = Token![.](dot_span);\n 3171 |             offset = part_end + 1;\n 3172 |         }\n 3173 | \n 3174 |         Ok(!trailing_dot)\n 3175 |     }","lines":33,"link":"https://github.com/dtolnay/syn/blob/d55bcd2546a3a34923c46da569edd65b38b3788d/src/expr.rs#L3143-L3175"},{"ref":"src/expr.rs:3126-3141","code":" 3126 |     impl Parse for Index {\n 3127 |         fn parse(input: ParseStream) -> Result<Self> {\n 3128 |             let lit: LitInt = input.parse()?;\n 3129 |             if lit.suffix().is_empty() {\n 3130 |                 Ok(Index {\n 3131 |                     index: lit\n 3132 |                         .base10_digits()\n 3133 |                         .parse()\n 3134 |                         .map_err(|err| Error::new(lit.span(), err))?,\n 3135 |                     span: lit.span(),\n 3136 |                 })\n 3137 |             } else {\n 3138 |                 Err(Error::new(lit.span(), \"expected unsuffixed integer\"))\n 3139 |             }\n 3140 |         }\n 3141 |     }","lines":16,"link":"https://github.com/dtolnay/syn/blob/d55bcd2546a3a34923c46da569edd65b38b3788d/src/expr.rs#L3126-L3141"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`xid_ok` calls `chars.next().unwrap()` on the first character, assuming the\ninput is never empty. It is a `pub(crate)` helper; every current caller happens\nto guarantee a non-empty slice (the float/int suffix paths guard with\n`suffix.is_empty() ||` and `Lifetime::new` rejects the lone `'` first), so the\npanic is not reachable today. But the invariant is implicit and undocumented:\nany future caller passing an empty string would hit an index-style panic rather\nthan getting `false`. The function would be both safer and more obviously\ncorrect using `chars.next()` with a match/`?`-style early return.","fix":"Handle the empty case explicitly, e.g.:\n`let Some(first) = chars.next() else { return false; };`\nThis makes the \"empty is not a valid identifier\" decision local and removes the\nlatent panic, with no behavior change for existing callers.","locations":[{"ref":"src/ident.rs:37-49","code":"   37 | pub(crate) fn xid_ok(symbol: &str) -> bool {\n   38 |     let mut chars = symbol.chars();\n   39 |     let first = chars.next().unwrap();\n   40 |     if !(first == '_' || unicode_ident::is_xid_start(first)) {\n   41 |         return false;\n   42 |     }\n   43 |     for ch in chars {\n   44 |         if !unicode_ident::is_xid_continue(ch) {\n   45 |             return false;\n   46 |         }\n   47 |     }\n   48 |     true\n   49 | }","lines":13,"link":"https://github.com/dtolnay/syn/blob/d55bcd2546a3a34923c46da569edd65b38b3788d/src/ident.rs#L37-L49"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"very_easy","description":"`Members::next` increments a `u32` index with `self.index += 1` without checked arithmetic. A struct/variant with more than u32::MAX fields would overflow (panic in debug, wrap in release). This is not reachable in practice since such an input could never be parsed or compiled, so impact is negligible.","fix":"No change needed; field counts are bounded far below u32::MAX in any real input.","locations":[{"ref":"src/data.rs:206","code":"  206 | }","lines":1,"link":"https://github.com/dtolnay/syn/blob/d55bcd2546a3a34923c46da569edd65b38b3788d/src/data.rs#L206"},{"ref":"src/data.rs:261","code":"  261 |         self.index += 1;","lines":1,"link":"https://github.com/dtolnay/syn/blob/d55bcd2546a3a34923c46da569edd65b38b3788d/src/data.rs#L261"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`impl From<usize> for Index` asserts `index < u32::MAX as usize`, which rejects exactly `u32::MAX`. The `Index::index` field is a `u32`, so the full valid range is `0..=u32::MAX`; the strict `<` makes the largest representable tuple index (`u32::MAX`) panic even though it fits. This is an off-by-one in the bound and is inconsistent with the field's actual capacity.","fix":"Use an inclusive bound: `assert!(index <= u32::MAX as usize);` (or `u32::try_from(index).expect(...)`), so the full u32 range is accepted.","locations":[{"ref":"src/expr.rs:1138-1146","code":" 1138 | impl From<usize> for Index {\n 1139 |     fn from(index: usize) -> Index {\n 1140 |         assert!(index < u32::MAX as usize);\n 1141 |         Index {\n 1142 |             index: index as u32,\n 1143 |             span: Span::call_site(),\n 1144 |         }\n 1145 |     }\n 1146 | }","lines":9,"link":"https://github.com/dtolnay/syn/blob/d55bcd2546a3a34923c46da569edd65b38b3788d/src/expr.rs#L1138-L1146"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"Token matching uses byte length `token.len()` as the terminal-character index while iterating over `token.chars()`. The two only agree because every token literal fed in via the `define_punctuation!` / `Token!` macros is pure ASCII. This is a latent coupling: if any non-ASCII punctuation token were ever added, `i == token.len() - 1` would no longer mark the final char, silently breaking parse/peek/print. The same byte-vs-char assumption appears in `printing::punct` (asserts `s.len() == spans.len()`). Not a live bug given the current ASCII-only token set.","fix":"Either count chars (`token.chars().count()`) for the terminal-index comparison, or document/enforce the ASCII-only invariant on the token literals. Lowest-risk fix is to compute `let last = token.chars().count() - 1;` once and compare `i == last`.","locations":[{"ref":"src/token.rs:1024-1039","code":" 1024 |             for (i, ch) in token.chars().enumerate() {\n 1025 |                 match cursor.punct() {\n 1026 |                     Some((punct, rest)) => {\n 1027 |                         spans[i] = punct.span();\n 1028 |                         if punct.as_char() != ch {\n 1029 |                             break;\n 1030 |                         } else if i == token.len() - 1 {\n 1031 |                             return Ok(((), rest));\n 1032 |                         } else if punct.spacing() != Spacing::Joint {\n 1033 |                             break;\n 1034 |                         }\n 1035 |                         cursor = rest;\n 1036 |                     }\n 1037 |                     None => break,\n 1038 |                 }\n 1039 |             }","lines":16,"link":"https://github.com/dtolnay/syn/blob/d55bcd2546a3a34923c46da569edd65b38b3788d/src/token.rs#L1024-L1039"},{"ref":"src/token.rs:1046-1063","code":" 1046 |     pub fn peek_punct(mut cursor: Cursor, token: &str) -> bool {\n 1047 |         for (i, ch) in token.chars().enumerate() {\n 1048 |             match cursor.punct() {\n 1049 |                 Some((punct, rest)) => {\n 1050 |                     if punct.as_char() != ch {\n 1051 |                         break;\n 1052 |                     } else if i == token.len() - 1 {\n 1053 |                         return true;\n 1054 |                     } else if punct.spacing() != Spacing::Joint {\n 1055 |                         break;\n 1056 |                     }\n 1057 |                     cursor = rest;\n 1058 |                 }\n 1059 |                 None => break,\n 1060 |             }\n 1061 |         }\n 1062 |         false\n 1063 |     }","lines":18,"link":"https://github.com/dtolnay/syn/blob/d55bcd2546a3a34923c46da569edd65b38b3788d/src/token.rs#L1046-L1063"},{"ref":"src/token.rs:1076-1087","code":" 1076 |         assert_eq!(s.len(), spans.len());\n 1077 | \n 1078 |         let mut chars = s.chars();\n 1079 |         let mut spans = spans.iter();\n 1080 |         let ch = chars.next_back().unwrap();\n 1081 |         let span = spans.next_back().unwrap();\n 1082 |         for (ch, span) in chars.zip(spans) {\n 1083 |             tokens.append(Punct::new_spanned(ch, Spacing::Joint, *span));\n 1084 |         }\n 1085 | \n 1086 |         tokens.append(Punct::new_spanned(ch, Spacing::Alone, *span));\n 1087 |     }","lines":12,"link":"https://github.com/dtolnay/syn/blob/d55bcd2546a3a34923c46da569edd65b38b3788d/src/token.rs#L1076-L1087"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"negligible","difficulty":"medium","description":"In `punct_helper`, on a character mismatch the loop writes `spans[i] = punct.span()` before checking `punct.as_char() != ch`, so when it breaks and constructs the error it reports `spans[0]`, which for a multi-char token may have just been overwritten by the span of a partially-matched punct rather than the start of the expected token. Only affects the diagnostic span of an already-failing parse, never correctness.","fix":"Capture the original start span (e.g. `let begin = input.span();`) and use it in `Error::new` instead of `spans[0]`, or perform the `as_char` check before mutating `spans[i]`.","locations":[{"ref":"src/token.rs:1019-1042","code":" 1019 |     fn punct_helper(input: ParseStream, token: &str, spans: &mut [Span]) -> Result<()> {\n 1020 |         input.step(|cursor| {\n 1021 |             let mut cursor = *cursor;\n 1022 |             assert_eq!(token.len(), spans.len());\n 1023 | \n 1024 |             for (i, ch) in token.chars().enumerate() {\n 1025 |                 match cursor.punct() {\n 1026 |                     Some((punct, rest)) => {\n 1027 |                         spans[i] = punct.span();\n 1028 |                         if punct.as_char() != ch {\n 1029 |                             break;\n 1030 |                         } else if i == token.len() - 1 {\n 1031 |                             return Ok(((), rest));\n 1032 |                         } else if punct.spacing() != Spacing::Joint {\n 1033 |                             break;\n 1034 |                         }\n 1035 |                         cursor = rest;\n 1036 |                     }\n 1037 |                     None => break,\n 1038 |                 }\n 1039 |             }\n 1040 | \n 1041 |             Err(Error::new(spans[0], format!(\"expected `{}`\", token)))\n 1042 |         })","lines":24,"link":"https://github.com/dtolnay/syn/blob/d55bcd2546a3a34923c46da569edd65b38b3788d/src/token.rs#L1019-L1042"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"The six filtering iterators (Lifetimes, LifetimesMut, TypeParams, TypeParamsMut, ConstParams, ConstParamsMut) all implement `next` by recursing via `self.next()` to skip non-matching params instead of looping. This recursion has depth proportional to the number of consecutively-skipped params. Rust does not guarantee tail-call elimination, so in debug builds (and any build where LLVM declines the optimization) iterating e.g. `generics.lifetimes()` over a `Generics` containing tens of thousands of type/const params can overflow the stack. A `while let` loop would be both clearer and immune to this.","fix":"Replace the recursive `self.next()` tail call with a loop, e.g. `while let Some(param) = self.0.next() { if let GenericParam::Lifetime(lifetime) = param { return Some(lifetime); } } None`.","locations":[{"ref":"src/generics.rs:191-197","code":"  191 |     fn next(&mut self) -> Option<Self::Item> {\n  192 |         if let GenericParam::Lifetime(lifetime) = self.0.next()? {\n  193 |             Some(lifetime)\n  194 |         } else {\n  195 |             self.next()\n  196 |         }\n  197 |     }","lines":7,"link":"https://github.com/dtolnay/syn/blob/d55bcd2546a3a34923c46da569edd65b38b3788d/src/generics.rs#L191-L197"},{"ref":"src/generics.rs:205-211","code":"  205 |     fn next(&mut self) -> Option<Self::Item> {\n  206 |         if let GenericParam::Lifetime(lifetime) = self.0.next()? {\n  207 |             Some(lifetime)\n  208 |         } else {\n  209 |             self.next()\n  210 |         }\n  211 |     }","lines":7,"link":"https://github.com/dtolnay/syn/blob/d55bcd2546a3a34923c46da569edd65b38b3788d/src/generics.rs#L205-L211"},{"ref":"src/generics.rs:219-225","code":"  219 |     fn next(&mut self) -> Option<Self::Item> {\n  220 |         if let GenericParam::Type(type_param) = self.0.next()? {\n  221 |             Some(type_param)\n  222 |         } else {\n  223 |             self.next()\n  224 |         }\n  225 |     }","lines":7,"link":"https://github.com/dtolnay/syn/blob/d55bcd2546a3a34923c46da569edd65b38b3788d/src/generics.rs#L219-L225"},{"ref":"src/generics.rs:233-239","code":"  233 |     fn next(&mut self) -> Option<Self::Item> {\n  234 |         if let GenericParam::Type(type_param) = self.0.next()? {\n  235 |             Some(type_param)\n  236 |         } else {\n  237 |             self.next()\n  238 |         }\n  239 |     }","lines":7,"link":"https://github.com/dtolnay/syn/blob/d55bcd2546a3a34923c46da569edd65b38b3788d/src/generics.rs#L233-L239"},{"ref":"src/generics.rs:247-253","code":"  247 |     fn next(&mut self) -> Option<Self::Item> {\n  248 |         if let GenericParam::Const(const_param) = self.0.next()? {\n  249 |             Some(const_param)\n  250 |         } else {\n  251 |             self.next()\n  252 |         }\n  253 |     }","lines":7,"link":"https://github.com/dtolnay/syn/blob/d55bcd2546a3a34923c46da569edd65b38b3788d/src/generics.rs#L247-L253"},{"ref":"src/generics.rs:261-267","code":"  261 |     fn next(&mut self) -> Option<Self::Item> {\n  262 |         if let GenericParam::Const(const_param) = self.0.next()? {\n  263 |             Some(const_param)\n  264 |         } else {\n  265 |             self.next()\n  266 |         }\n  267 |     }","lines":7,"link":"https://github.com/dtolnay/syn/blob/d55bcd2546a3a34923c46da569edd65b38b3788d/src/generics.rs#L261-L267"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"`MetaList::parse_args_with` clones the entire `tokens` TokenStream on every invocation (`self.tokens.clone()`). For attributes with large argument token streams this is a needless allocation each time args are parsed. It is unavoidable given the by-reference `&self` API and the fact that `parse_scoped` consumes a TokenStream, so this is informational only.","fix":"No straightforward fix without an owned/borrowed parse variant; acceptable given the API contract. Noted for completeness.","locations":[{"ref":"src/attr.rs:581-584","code":"  581 |     pub fn parse_args_with<F: Parser>(&self, parser: F) -> Result<F::Output> {\n  582 |         let scope = self.delimiter.span().close();\n  583 |         crate::parse::parse_scoped(parser, scope, self.tokens.clone())\n  584 |     }","lines":4,"link":"https://github.com/dtolnay/syn/blob/d55bcd2546a3a34923c46da569edd65b38b3788d/src/attr.rs#L581-L584"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`peek_precedence` calls `input.fork().parse()` to try a `BinOp`, allocating/cloning a fork of the parse stream cursor on every call. It is invoked once per iteration of `parse_binop_rhs`'s inner loop (1450), which itself runs inside the main precedence-climbing loop, so for deeply nested binary expressions this fork-and-discard happens on a hot path. proc-macro2 ParseStream forks are cheap (Cell-based copy of a cursor), so impact is negligible, but the speculative `BinOp` parse on a fork could be replaced by direct `peek` checks for the operator tokens to avoid constructing a throwaway BinOp value.","fix":"Where feasible, peek operator tokens directly (as the later `else if` arms already do) instead of `input.fork().parse::<BinOp>()`, to avoid building and dropping a BinOp on each call.","locations":[{"ref":"src/expr.rs:1572-1584","code":" 1572 |     fn peek_precedence(input: ParseStream) -> Precedence {\n 1573 |         if let Ok(op) = input.fork().parse() {\n 1574 |             Precedence::of_binop(&op)\n 1575 |         } else if input.peek(Token![=]) && !input.peek(Token![=>]) {\n 1576 |             Precedence::Assign\n 1577 |         } else if input.peek(Token![..]) {\n 1578 |             Precedence::Range\n 1579 |         } else if input.peek(Token![as]) {\n 1580 |             Precedence::Cast\n 1581 |         } else {\n 1582 |             Precedence::MIN\n 1583 |         }\n 1584 |     }","lines":13,"link":"https://github.com/dtolnay/syn/blob/d55bcd2546a3a34923c46da569edd65b38b3788d/src/expr.rs#L1572-L1584"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`parse_lit_float` eagerly allocates a fresh heap buffer for every float literal\nvia `input.to_owned().into_bytes()` even when the literal contains no\nunderscores and no `+` to strip (the common case, e.g. `1.0`, `3.14f64`). In\nthat case the in-place compaction copies each byte onto itself and the buffer is\nthen re-wrapped into a `String`/`Box<str>`, so the allocation+copy is pure\noverhead relative to slicing the original. This is a hot path (every float\ntoken in a token stream), but the cost is a single small allocation, hence\nnegligible severity.","fix":"Optionally scan for the first `_`/`+` and, if none is present before the\nsuffix, slice `input` directly into (digits, suffix) without allocating; fall\nback to the existing compaction only when ignorable characters are actually\npresent.","locations":[{"ref":"src/lit.rs:1796-1874","code":" 1796 |         let mut bytes = input.to_owned().into_bytes();\n 1797 | \n 1798 |         let start = (*bytes.first()? == b'-') as usize;\n 1799 |         match bytes.get(start)? {\n 1800 |             b'0'..=b'9' => {}\n 1801 |             _ => return None,\n 1802 |         }\n 1803 | \n 1804 |         let mut read = start;\n 1805 |         let mut write = start;\n 1806 |         let mut has_dot = false;\n 1807 |         let mut has_e = false;\n 1808 |         let mut has_sign = false;\n 1809 |         let mut has_exponent = false;\n 1810 |         while read < bytes.len() {\n 1811 |             match bytes[read] {\n 1812 |                 b'_' => {\n 1813 |                     // Don't increase write\n 1814 |                     read += 1;\n 1815 |                     continue;\n 1816 |                 }\n 1817 |                 b'0'..=b'9' => {\n 1818 |                     if has_e {\n 1819 |                         has_exponent = true;\n 1820 |                     }\n 1821 |                     bytes[write] = bytes[read];\n 1822 |                 }\n 1823 |                 b'.' => {\n 1824 |                     if has_e || has_dot {\n 1825 |                         return None;\n 1826 |                     }\n 1827 |                     has_dot = true;\n 1828 |                     bytes[write] = b'.';\n 1829 |                 }\n 1830 |                 b'e' | b'E' => {\n 1831 |                     match bytes[read + 1..]\n 1832 |                         .iter()\n 1833 |                         .find(|b| **b != b'_')\n 1834 |                         .unwrap_or(&b'\\0')\n 1835 |                     {\n 1836 |                         b'-' | b'+' | b'0'..=b'9' => {}\n 1837 |                         _ => break,\n 1838 |                     }\n 1839 |                     if has_e {\n 1840 |                         if has_exponent {\n 1841 |                             break;\n 1842 |                         } else {\n 1843 |                             return None;\n 1844 |                         }\n 1845 |                     }\n 1846 |                     has_e = true;\n 1847 |                     bytes[write] = b'e';\n 1848 |                 }\n 1849 |                 b'-' | b'+' => {\n 1850 |                     if has_sign || has_exponent || !has_e {\n 1851 |                         return None;\n 1852 |                     }\n 1853 |                     has_sign = true;\n 1854 |                     if bytes[read] == b'-' {\n 1855 |                         bytes[write] = bytes[read];\n 1856 |                     } else {\n 1857 |                         // Omit '+'\n 1858 |                         read += 1;\n 1859 |                         continue;\n 1860 |                     }\n 1861 |                 }\n 1862 |                 _ => break,\n 1863 |             }\n 1864 |             read += 1;\n 1865 |             write += 1;\n 1866 |         }\n 1867 | \n 1868 |         if has_e && !has_exponent {\n 1869 |             return None;\n 1870 |         }\n 1871 | \n 1872 |         let mut digits = String::from_utf8(bytes).unwrap();\n 1873 |         let suffix = digits.split_off(read);\n 1874 |         digits.truncate(write);","lines":79,"link":"https://github.com/dtolnay/syn/blob/d55bcd2546a3a34923c46da569edd65b38b3788d/src/lit.rs#L1796-L1874"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"inner_unexpected walks the Unexpected chain calling cell_clone at each link, and cell_clone does take() + clone() + set() on the Cell. For Unexpected::Chain this clones an Rc (atomic-free refcount bump) per hop. This runs only at group/delimiter boundaries and parse completion (not per-token), so impact is minimal, but for deeply nested fork/advance_to chains the per-hop Rc clone is avoidable since the chain is only being traversed, not mutated.","fix":"Traverse the chain by inspecting the Cell without cloning the Rc at intermediate Chain links (e.g. a dedicated read that returns the terminal cell), reserving the clone for the returned terminal Rc only.","locations":[{"ref":"src/parse.rs:422-440","code":"  422 | // We call this on Cell<Unexpected> and Cell<Option<T>> where temporarily\n  423 | // swapping in a None is cheap.\n  424 | fn cell_clone<T: Default + Clone>(cell: &Cell<T>) -> T {\n  425 |     let prev = cell.take();\n  426 |     let ret = prev.clone();\n  427 |     cell.set(prev);\n  428 |     ret\n  429 | }\n  430 | \n  431 | fn inner_unexpected(buffer: &ParseBuffer) -> (Rc<Cell<Unexpected>>, Option<(Span, Delimiter)>) {\n  432 |     let mut unexpected = get_unexpected(buffer);\n  433 |     loop {\n  434 |         match cell_clone(&unexpected) {\n  435 |             Unexpected::None => return (unexpected, None),\n  436 |             Unexpected::Some(span, delimiter) => return (unexpected, Some((span, delimiter))),\n  437 |             Unexpected::Chain(next) => unexpected = next,\n  438 |         }\n  439 |     }\n  440 | }","lines":19,"link":"https://github.com/dtolnay/syn/blob/d55bcd2546a3a34923c46da569edd65b38b3788d/src/parse.rs#L422-L440"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In the `full` version of `parse_expr`, the loop's first arm at line 1324 unconditionally `break`s when `lhs` is an `Expr::Range`. Consequently the two later guards that re-test for `Expr::Range` are dead: the `if let Expr::Range(_) = lhs { break; }` inside the `Assign` precedence branch (1332-1336) can never be true, and the `match lhs { Expr::Range(_) => false, _ => true }` guard on the `=` assignment branch (1355-1358) is always `true`. The non-`full` variant of `parse_expr` (1397) confirms these checks are not needed. This is redundant code that obscures the actual control flow.","fix":"Remove the inner `if let Expr::Range(_) = lhs { break; }` block (1332-1336) and replace the `&& match lhs { Expr::Range(_) => false, _ => true }` condition on the assignment branch (1355-1358) with nothing, since the top-of-loop guard already guarantees `lhs` is not a Range.","locations":[{"ref":"src/expr.rs:1420-1456","code":" 1420 |         loop {\n 1421 |             let ahead = input.fork();\n 1422 |             if let Expr::Range(_) = lhs {\n 1423 |                 // A range cannot be the left-hand side of another binary operator.\n 1424 |                 break;\n 1425 |             } else if let Ok(op) = ahead.parse::<BinOp>() {\n 1426 |                 let precedence = Precedence::of_binop(&op);\n 1427 |                 if precedence < base {\n 1428 |                     break;\n 1429 |                 }\n 1430 |                 if precedence == Precedence::Assign {\n 1431 |                     if let Expr::Range(_) = lhs {\n 1432 |                         break;\n 1433 |                     }\n 1434 |                 }\n 1435 |                 if precedence == Precedence::Compare {\n 1436 |                     if let Expr::Binary(lhs) = &lhs {\n 1437 |                         if Precedence::of_binop(&lhs.op) == Precedence::Compare {\n 1438 |                             return Err(input.error(\"comparison operators cannot be chained\"));\n 1439 |                         }\n 1440 |                     }\n 1441 |                 }\n 1442 |                 input.advance_to(&ahead);\n 1443 |                 let right = parse_binop_rhs(input, allow_struct, precedence)?;\n 1444 |                 lhs = Expr::Binary(ExprBinary {\n 1445 |                     attrs: Vec::new(),\n 1446 |                     left: Box::new(lhs),\n 1447 |                     op,\n 1448 |                     right,\n 1449 |                 });\n 1450 |             } else if Precedence::Assign >= base\n 1451 |                 && input.peek(Token![=])\n 1452 |                 && !input.peek(Token![=>])\n 1453 |                 && match lhs {\n 1454 |                     Expr::Range(_) => false,\n 1455 |                     _ => true,\n 1456 |                 }","lines":37,"link":"https://github.com/dtolnay/syn/blob/d55bcd2546a3a34923c46da569edd65b38b3788d/src/expr.rs#L1420-L1456"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"In `Pat::parse_single`, the branch at line 312 tests `lookahead.peek(Token![const])` and routes to `pat_lit_or_range` (which handles a `const` bound via `pat_range_bound` -> `PatRangeBound::Const`). Because that branch is checked first, the later `else if lookahead.peek(Token![const])` branch at lines 329-330 that calls `pat_const` can never be reached. Consequently the entire `pat_const` helper (lines 798-808) is unreachable dead code. A `const { ... }` pattern is parsed by the earlier `const` branch, not by `pat_const`.","fix":"Remove the unreachable `else if lookahead.peek(Token![const])` arm (lines 329-330) and delete the now-unused `pat_const` function, or reorder/restructure the branches if `pat_const` was intended to handle a case that `pat_lit_or_range` does not.","locations":[{"ref":"src/pat.rs:315","code":"  315 |             } else if input.peek(Token![-]) || lookahead.peek(Lit) || lookahead.peek(Token![const])","lines":1,"link":"https://github.com/dtolnay/syn/blob/d55bcd2546a3a34923c46da569edd65b38b3788d/src/pat.rs#L315"},{"ref":"src/pat.rs:332-333","code":"  332 |             } else if lookahead.peek(Token![const]) {\n  333 |                 input.call(pat_const).map(Pat::Verbatim)","lines":2,"link":"https://github.com/dtolnay/syn/blob/d55bcd2546a3a34923c46da569edd65b38b3788d/src/pat.rs#L332-L333"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The doc comment on Entry::End states the second field is 'offset (negative) to the matching Group entry'. This is true for group-close End entries, but the single top-level End entry pushed in TokenBuffer::new2 stores 0 in that field (no matching Group). Code in Cursor::span and scope_delimiter relies on that 0 meaning 'no group' (offset(0) lands back on the End itself), so the comment's 'negative' qualifier is not universally accurate and slightly understates the sentinel meaning of 0.","fix":"Amend the comment to note that the top-level End entry uses 0 in the second field as a sentinel meaning there is no enclosing group.","locations":[{"ref":"src/buffer.rs:27-29","code":"   27 |     // End entries contain the offset (negative) to the start of the buffer, and\n   28 |     // offset (negative) to the matching Group entry.\n   29 |     End(isize, isize),","lines":3,"link":"https://github.com/dtolnay/syn/blob/d55bcd2546a3a34923c46da569edd65b38b3788d/src/buffer.rs#L27-L29"},{"ref":"src/buffer.rs:77","code":"   77 |         entries.push(Entry::End(-(entries.len() as isize), 0));","lines":1,"link":"https://github.com/dtolnay/syn/blob/d55bcd2546a3a34923c46da569edd65b38b3788d/src/buffer.rs#L77"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Inconsistent inline annotation in the doc-comment for `leftmost_subexpression_in_optional_operand`. The first example line is annotated `needs parens` without the leading `//` comment marker, whereas the parallel second line uses `// no parens`. Every other paired example in this struct (e.g. lines 23/25, 50/58, 85/88, 96/99, 107/109) consistently prefixes the annotation with `//`. The missing marker makes this one example read inconsistently.","fix":"Change the annotation to `//     if break ({ x }).field + 1 {}  // needs parens` to match the `// no parens` style on the following line.","locations":[{"ref":"src/fixup.rs:116","code":"  116 |     //     if break ({ x }).field + 1 {}  needs parens","lines":1,"link":"https://github.com/dtolnay/syn/blob/d55bcd2546a3a34923c46da569edd65b38b3788d/src/fixup.rs#L116"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Doc examples for several items use module paths that no longer match the prose: ItemUse documents `use alloc::collections::HashMap` (line 310/77) and ItemConst/others reference `core`/`alloc`, while the type docstrings elsewhere use `std`-style examples. These are cosmetic doc inconsistencies (HashMap is not in alloc::collections), not code bugs, but the `use alloc::collections::HashMap` example is factually wrong as a real import.","fix":"Use a path that actually exists, e.g. `use std::collections::HashMap`, or pick a type that lives in alloc::collections (e.g. BTreeMap).","locations":[{"ref":"src/item.rs:79","code":"   79 |         /// A use declaration: `use alloc::collections::HashMap`.","lines":1,"link":"https://github.com/dtolnay/syn/blob/d55bcd2546a3a34923c46da569edd65b38b3788d/src/item.rs#L79"},{"ref":"src/item.rs:508-509","code":"  508 |     /// A use declaration: `use alloc::collections::HashMap`.\n  509 |     #[cfg_attr(docsrs, doc(cfg(feature = \"full\")))]","lines":2,"link":"https://github.com/dtolnay/syn/blob/d55bcd2546a3a34923c46da569edd65b38b3788d/src/item.rs#L508-L509"}]},

{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The doc comment on `byte()` says it returns \"a default of `b'\\0'`\" past the end\nof the buffer, but the code returns the integer literal `0` (which equals\n`b'\\0'`, so behavior is correct). Minor: the surrounding parsers rely on this\nsentinel `0` being treated as \"no more input\"; the comment is accurate in value\nbut it is worth keeping the wording (`b'\\0'`) and the literal (`0`) consistent\nso a reader does not assume a different sentinel.","fix":"Write the sentinel as `b'\\0'` in the code (or `0` in the comment) so the\ndocumented value and the returned value are textually identical; no logic\nchange.","locations":[{"ref":"src/lit.rs:1247-1256","code":" 1247 |     /// Get the byte at offset idx, or a default of `b'\\0'` if we're looking\n 1248 |     /// past the end of the input buffer.\n 1249 |     pub(crate) fn byte<S: AsRef<[u8]> + ?Sized>(s: &S, idx: usize) -> u8 {\n 1250 |         let s = s.as_ref();\n 1251 |         if idx < s.len() {\n 1252 |             s[idx]\n 1253 |         } else {\n 1254 |             0\n 1255 |         }\n 1256 |     }","lines":10,"link":"https://github.com/dtolnay/syn/blob/d55bcd2546a3a34923c46da569edd65b38b3788d/src/lit.rs#L1247-L1256"}]},
{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"Cursor::group, Cursor::any_group, and Cursor::any_group_token share an almost identical body: matching Entry::Group, computing end_of_group = self.ptr.add(*end_offset), and building inside_of_group / after_group cursors via Cursor::create. The triplication means any future change to the group-entry pointer math (e.g. the offset convention) has to be applied in three places, and is exactly the kind of place where a copy-paste slip could introduce an unsoundness in unsafe pointer arithmetic. Could be factored into one private helper returning (inside, end_of_group, after) that the three public methods wrap.","fix":"Extract a private `fn enter_group(self) -> Option<(Group, *const Entry)>` (or similar) that does the single `self.ptr.add(*end_offset)` computation, and have group/any_group/any_group_token call Cursor::create on its result.","locations":[{"ref":"src/buffer.rs:268-312","code":"  268 |     pub fn group(mut self, delim: Delimiter) -> Option<(Cursor<'a>, DelimSpan, Cursor<'a>)> {\n  269 |         // If we're not trying to enter a none-delimited group, we want to\n  270 |         // ignore them. We have to make sure to _not_ ignore them when we want\n  271 |         // to enter them, of course. For obvious reasons.\n  272 |         if delim != Delimiter::None {\n  273 |             self.ignore_none();\n  274 |         }\n  275 | \n  276 |         if let Entry::Group(group, end_offset) = self.entry() {\n  277 |             if group.delimiter() == delim {\n  278 |                 let span = group.delim_span();\n  279 |                 let end_of_group = unsafe { self.ptr.add(*end_offset) };\n  280 |                 let inside_of_group = unsafe { Cursor::create(self.ptr.add(1), end_of_group) };\n  281 |                 let after_group = unsafe { Cursor::create(end_of_group, self.scope) };\n  282 |                 return Some((inside_of_group, span, after_group));\n  283 |             }\n  284 |         }\n  285 | \n  286 |         None\n  287 |     }\n  288 | \n  289 |     /// If the cursor is pointing at a `Group`, returns a cursor into the group\n  290 |     /// and one pointing to the next `TokenTree`.\n  291 |     pub fn any_group(self) -> Option<(Cursor<'a>, Delimiter, DelimSpan, Cursor<'a>)> {\n  292 |         if let Entry::Group(group, end_offset) = self.entry() {\n  293 |             let delimiter = group.delimiter();\n  294 |             let span = group.delim_span();\n  295 |             let end_of_group = unsafe { self.ptr.add(*end_offset) };\n  296 |             let inside_of_group = unsafe { Cursor::create(self.ptr.add(1), end_of_group) };\n  297 |             let after_group = unsafe { Cursor::create(end_of_group, self.scope) };\n  298 |             return Some((inside_of_group, delimiter, span, after_group));\n  299 |         }\n  300 | \n  301 |         None\n  302 |     }\n  303 | \n  304 |     pub(crate) fn any_group_token(self) -> Option<(Group, Cursor<'a>)> {\n  305 |         if let Entry::Group(group, end_offset) = self.entry() {\n  306 |             let end_of_group = unsafe { self.ptr.add(*end_offset) };\n  307 |             let after_group = unsafe { Cursor::create(end_of_group, self.scope) };\n  308 |             return Some((group.clone(), after_group));\n  309 |         }\n  310 | \n  311 |         None\n  312 |     }","lines":45,"link":"https://github.com/dtolnay/syn/blob/d55bcd2546a3a34923c46da569edd65b38b3788d/src/buffer.rs#L268-L312"}]},

{"id":"DUP_6","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"easy","description":"The suffix is recovered from the leftover byte slice with the identical, fiddly\nexpression `s[s.len() - v.len() + 1..]` in three cooked-literal parsers\n(byte-string, C-string, and byte). The `+ 1` (to skip the closing quote) plus\nthe `s.len() - v.len()` offset arithmetic is exactly the kind of off-by-one that\nis easy to break independently in one copy during maintenance. Factoring the\n\"remaining length to suffix &str\" computation into a tiny helper would remove\nthe triplicated arithmetic.","fix":"Introduce a helper such as\n`fn suffix_after_quote(orig: &str, remaining: &[u8]) -> Box<str>` returning\n`orig[orig.len() - remaining.len() + 1..].to_owned().into_boxed_str()` and call\nit from all three sites, so the offset math lives in exactly one place.","locations":[{"ref":"src/lit.rs:1525","code":" 1525 |         let suffix = s[s.len() - v.len() + 1..].to_owned().into_boxed_str();","lines":1,"link":"https://github.com/dtolnay/syn/blob/d55bcd2546a3a34923c46da569edd65b38b3788d/src/lit.rs#L1525"},{"ref":"src/lit.rs:1578","code":" 1578 |         let suffix = s[s.len() - v.len() + 1..].to_owned().into_boxed_str();","lines":1,"link":"https://github.com/dtolnay/syn/blob/d55bcd2546a3a34923c46da569edd65b38b3788d/src/lit.rs#L1578"},{"ref":"src/lit.rs:1578","code":" 1578 |         let suffix = s[s.len() - v.len() + 1..].to_owned().into_boxed_str();","lines":1,"link":"https://github.com/dtolnay/syn/blob/d55bcd2546a3a34923c46da569edd65b38b3788d/src/lit.rs#L1578"}]},
{"id":"DUP_7","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"easy","description":"Parser::parse2 and Parser::__parse_scoped are near-identical: both build a TokenBuffer, create a parse buffer, run the closure, call check_unexpected(), then run span_of_unexpected_ignoring_nones and map to err_unexpected_token. The only difference is scope (Span::call_site() vs the passed scope). The tail 'check_unexpected + span_of_unexpected_ignoring_nones' logic is duplicated and could drift between the two entry points.","fix":"Have parse2 delegate to __parse_scoped with Span::call_site(), or extract a shared private fn that takes the scope and tokens and performs buffer creation + run + post-parse validation.","locations":[{"ref":"src/parse.rs:1293-1321","code":" 1293 |     fn parse2(self, tokens: TokenStream) -> Result<T> {\n 1294 |         let buf = TokenBuffer::new2(tokens);\n 1295 |         let state = tokens_to_parse_buffer(&buf);\n 1296 |         let node = self(&state)?;\n 1297 |         state.check_unexpected()?;\n 1298 |         if let Some((unexpected_span, delimiter)) =\n 1299 |             span_of_unexpected_ignoring_nones(state.cursor())\n 1300 |         {\n 1301 |             Err(err_unexpected_token(unexpected_span, delimiter))\n 1302 |         } else {\n 1303 |             Ok(node)\n 1304 |         }\n 1305 |     }\n 1306 | \n 1307 |     fn __parse_scoped(self, scope: Span, tokens: TokenStream) -> Result<Self::Output> {\n 1308 |         let buf = TokenBuffer::new2(tokens);\n 1309 |         let cursor = buf.begin();\n 1310 |         let unexpected = Rc::new(Cell::new(Unexpected::None));\n 1311 |         let state = new_parse_buffer(scope, cursor, unexpected);\n 1312 |         let node = self(&state)?;\n 1313 |         state.check_unexpected()?;\n 1314 |         if let Some((unexpected_span, delimiter)) =\n 1315 |             span_of_unexpected_ignoring_nones(state.cursor())\n 1316 |         {\n 1317 |             Err(err_unexpe {"id":"DUP_8","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"The `+`-separated bound accumulation loop (`while let Some(plus) = input.parse()? { push_punct; push_value(TypeParamBound::parse_single(input, false, false)?) }`) is copy-pasted in three places inside `ambig_ty`: the parenthesized `?Trait` branch, the parenthesized `+` trait-object branch, and could share logic with the Ident branch's `+` loop. The bodies are byte-identical including the `allow_precise_capture = false; allow_const = false;` locals.","fix":"Factor the repeated `while let Some(plus)` accumulation into a small helper that appends additional plus-separated bounds to an existing `Punctuated`.","locations":[{"ref":"src/ty.rs:434-445","code":"  434 |                         while let Some(plus) = input.parse()? {\n  435 |                             bounds.push_punct(plus);\n  436 |                             bounds.push_value({\n  437 |                                 let allow_precise_capture = false;\n  438 |                                 let allow_const = false;\n  439 |                                 TypeParamBound::parse_single(\n  440 |                                     input,\n  441 |                                     allow_precise_capture,\n  442 |                                     allow_const,\n  443 |                                 )?\n  444 |                             });\n  445 |                         }","lines":12,"link":"https://github.com/dtolnay/syn/blob/d55bcd2546a3a34923c46da569edd65b38b3788d/src/ty.rs#L434-L445"},{"ref":"src/ty.rs:517-528","code":"  517 |                             while let Some(plus) = input.parse()? {\n  518 |                                 bounds.push_punct(plus);\n  519 |                                 bounds.push_value({\n  520 |                                     let allow_precise_capture = false;\n  521 |                                     let allow_const = false;\n  522 | {"id":"OTHER_1","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"The compile-time assertion that `Error: Send + Sync` (struct `_Test`) is gated behind `#[cfg(test)]`, so the Send/Sync guarantee that ecosystem error-handling crates rely on is only verified when building syn's own test target, not in ordinary library builds. A regression that broke Send/Sync (e.g. a future field change) would compile fine for downstream users and only surface in syn's test runs. Making the assertion unconditional (or a `const _`) would catch such regressions in every build.","fix":"Drop the `#[cfg(test)]` gate and express the bound as an always-compiled assertion, e.g. `const _: fn() = || { fn assert<T: Send + Sync>() {} assert::<Error>(); };`","locations":[{"ref":"src/error.rs:129-132","code":"  129 | #[cfg(test)]\n  130 | struct _Test\n  131 | where\n  132 |     Error: Send + Sync;","lines":4,"link":"https://github.com/dtolnay/syn/blob/d55bcd2546a3a34923c46da569edd65b38b3788d/src/error.rs#L129-L132"}]},
{"id":"OTHER_2","type":"other","type_label":"Other","severity":"negligible","difficulty":"medium","description":"Lookahead1::peek (via peek_impl) pushes display() into the comparisons list every time a peek fails, with no deduplication. Peeking the same token type twice against one Lookahead1, or peeking both End and a literal close-paren token (both of which display as `)`), produces duplicate entries in the generated 'expected one of: ...' error message. The retain_mut pass in error() rewrites `)` per the scope delimiter but does not dedup, so duplicate alternatives can appear in the message. Cosmetic only.","fix":"Optionally dedup comparisons (e.g. skip pushing a display string already present) before formatting the message, or dedup after the retain_mut pass.","locations":[{"ref":"src/lookahead.rs:79-89","code":"   79 | fn peek_impl(\n   80 |     lookahead: &Lookahead1,\n   81 |     peek: fn(Cursor) -> bool,\n   82 |     display: fn() -> &'static str,\n   83 | ) -> bool {\n   84 |     if peek(lookahead.cursor) {\n   85 |         return true;\n   86 |     }\n   87 |     lookahead.comparisons.borrow_mut().push(display());\n   88 |     false\n   89 | }","lines":11,"link":"https://github.com/dtolnay/syn/blob/d55bcd2546a3a34923c46da569edd65b38b3788d/src/lookahead.rs#L79-L89"},{"ref":"src/lookahead.rs:115-148","code":"  115 |     pub fn error(self) -> Error {\n  116 |         let mut comparisons = self.comparisons.into_inner();\n  117 |         comparisons.retain_mut(|display| {\n  118 |             if *display == \"`)`\" {\n  119 |                 *display = match self.cursor.scope_delimiter() {\n  120 |                     Delimiter::Parenthesis => \"`)`\",\n  121 |                     Delimiter::Brace => \"`}`\",\n  122 |                     Delimiter::Bracket => \"`]`\",\n  123 |                     Delimiter::None => return false,\n  124 |                 }\n  125 |             }\n  126 |             true\n  127 |         });\n  128 |         match comparisons.len() {\n  129 |             0 => {\n  130 |                 if self.cursor.eof() {\n  131 |                     Error::new(self.scope, \"unexpected end of input\")\n  132 |                 } else {\n  133 |                     Error::new(self.cursor.span(), \"unexpected token\")\n  134 |                 }\n  135 |             }\n  136 |             1 => {\n  137 |                 let message = format!(\"expected {}\", comparisons[0]);\n  138 |                 error::new_at(self.scope, self.cursor, message)\n  139 |             }\n  140 |             2 => {\n  141 |                 let message = format!(\"expected {} or {}\", comparisons[0], comparisons[1]);\n  142 |                 error::new_at(self.scope, self.cursor, message)\n  143 |             }\n  144 |             _ => {\n  145 |                 let message = format!(\"expected one of: {}\", CommaSeparated(&comparisons));\n  146 |                 error::new_at(self.scope, self.cursor, message)\n  147 |             }\n  148 |         }","lines":34,"link":"https://github.com/dtolnay/syn/blob/d55bcd2546a3a34923c46da569edd65b38b3788d/src/lookahead.rs#L115-L148"}]},

<script>
(function(){
'use strict';

// Data
const FINDINGS     = JSON.parse(document.getElementById('D').textContent);
const PROJECT_INFO = JSON.parse(document.getElementById('PI').textContent);
const SEVS     = ['critical','high','medium','low','negligible'];

const ALL_TYPES = [...new Set(FINDINGS.map(f => f.type))].sort(cmpTypes);
// Build lookup map for O(1) access
const FINDING_BY_ID = new Map(FINDINGS.map(f => [f.id, f]));
// Only severities actually present in the report — the filter bar hides the rest.
const PRESENT_SEVS = SEVS.filter(s => FINDINGS.some(f => (f.severity || 'medium') === s));
// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};
const PRESENT_DIFFS = DIFFICULTY_ORDER.filter(d => FINDINGS.some(f => f.difficulty === d));
const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', searchScope: 'all', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),
};

// Persistence
function loadStatuses() {
  try { Object.assign(statuses, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}
}
function saveStatuses() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    if (S.searchScope !== 'all') p.set('qs', S.searchScope);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('qs'))  { S.searchScope = p.get('qs'); }
  document.getElementById('search-scope').classList.toggle('active', S.searchScope === 'locations');
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
