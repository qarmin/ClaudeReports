{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `MirrorHead`, after detecting that the requested head is already a mirror target or is itself mirroring (the `MirroredHeadBusy` condition), `extension_obj.post_error(...)` is called but there is no `return` afterward. Execution falls through and still creates the `PendingOutputConfiguration` with `mirroring` set and pushes `(head, Some(conf_head))` into `pending.heads`, i.e. the compositor accepts the configuration it just told the client was invalid. If the client has already queued a subsequent `Apply`/`Test` request in the same read (a common client pattern - fire requests without waiting for an error round-trip), that request can be dispatched before the connection is actually torn down and will operate on this invalid pending head configuration.","fix":"Add an early `return;` right after the `extension_obj.post_error(...)` call for the `MirroredHeadBusy` case, before creating and pushing the pending output configuration.","locations":[{"ref":"src/wayland/protocols/output_configuration/handlers/cosmic.rs:192-242","code":"  192 |             zcosmic_output_configuration_v1::Request::MirrorHead {\n  193 |                 id,\n  194 |                 head,\n  195 |                 mirroring,\n  196 |             } => {\n  197 |                 if let Ok(obj) = obj.upgrade() {\n  198 |                     let data = obj.data::<PendingConfiguration>().unwrap();\n  199 |                     if let Some(output) = mirroring.data::<WeakOutput>().unwrap().upgrade() {\n  200 |                         let mut pending = data.lock().unwrap();\n  201 |                         if pending.heads.iter().any(|(h, _)| *h == head) {\n  202 |                             obj.post_error(\n  203 |                                 zwlr_output_configuration_v1::Error::AlreadyConfiguredHead,\n  204 |                                 format!(\"{:?} was already configured\", head),\n  205 |                             );\n  206 |                             return;\n  207 |                         }\n  208 | \n  209 |                         if pending.heads.iter().any(|(h, c)| {\n  210 |                             match c.as_ref() {\n  211 |                                 Some(c) => {\n  212 |                                     let conf = c.data::<PendingOutputConfiguration>().unwrap();\n  213 |                                     match conf.lock().unwrap().mirroring.as_ref() {\n  214 |                                         Some(mirrored) => {\n  215 |                                             head.data::<WeakOutput>().unwrap() == mirrored // we are already a mirror target -> invalid\n  216 |                                             || *h == mirroring // our target already mirrors -> invalid\n  217 |                                         }\n  218 |                                         None => false,\n  219 |                                     }\n  220 |                                 }\n  221 |                                 None => *h == mirroring, // disabled state for our mirror target -> invalid\n  222 |                             }\n  223 |                         }) {\n  224 |                             extension_obj.post_error(\n  225 |                             zcosmic_output_configuration_v1::Error::MirroredHeadBusy,\n  226 |                             format!(\"{:?} can't mirror, it is either a mirror target itself or {:?} is not enabled/already mirroring\", head, mirroring),\n  227 |                         );\n  228 |                         }\n  229 | \n  230 |                         let output_conf = PendingOutputConfiguration::default();\n  231 |                         output_conf.lock().unwrap().mirroring = Some(output.clone());\n  232 |                         let conf_head = data_init.init(id, output_conf);\n  233 |                         pending.heads.push((head, Some(conf_head)));\n  234 |                     } else {\n  235 |                         let output_conf = PendingOutputConfiguration::default();\n  236 |                         data_init.init(id, output_conf);\n  237 |                     }\n  238 |                 } else {\n  239 |                     let output_conf = PendingOutputConfiguration::default();\n  240 |                     data_init.init(id, output_conf);\n  241 |                 }\n  242 |             }","lines":51,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/wayland/protocols/output_configuration/handlers/cosmic.rs#L192-L242"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"hard","description":"There is no Xwayland respawn/crash-loop-recovery logic anywhere in this file. `launch_xwayland` refuses to run again once `self.common.xwayland_state.is_some()` (line 110-112). Once `XWaylandState` is created (on `XWaylandEvent::Ready`), it is never reset back to `None` except by explicitly disconnecting the XWM (`disconnected()`, lines 1286-1289), which only clears `xwm` and leaves `xwayland_state` itself `Some`. Consequently, once Xwayland exits or its X11 connection drops for any reason after a successful start, the compositor can never spawn a new Xwayland instance for the rest of its lifetime (`launch_xwayland`'s guard blocks it) even though `launch_xwayland` is only ever called once at backend startup and nothing else drives a retry. Every X11 client becomes permanently unusable until the whole compositor process is restarted.","fix":"On `disconnected`/fatal `XWaylandEvent::Error`, fully clear `self.common.xwayland_state = None` (not just `xwm`) and trigger a bounded, backoff-limited call to `launch_xwayland` again, so a crashed Xwayland can be relaunched instead of permanently disabling X11 support.","locations":[{"ref":"src/xwayland.rs:110-114","code":"  110 | impl State {\n  111 |     pub fn launch_xwayland(&mut self, render_node: Option<DrmNode>) {\n  112 |         if self.common.xwayland_state.is_some() {\n  113 |             return;\n  114 |         }","lines":5,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/xwayland.rs#L110-L114"},{"ref":"src/xwayland.rs:1323-1326","code":" 1323 |     fn disconnected(&mut self, _xwm: XwmId) {\n 1324 |         let xwayland_state = self.common.xwayland_state.as_mut().unwrap();\n 1325 |         xwayland_state.xwm = None;\n 1326 |     }","lines":4,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/xwayland.rs#L1323-L1326"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `MenuGrab::motion` (both the pointer and touch variants), when the cursor is not over any menu element the code sends `leave` only to `elements.iter_mut().filter(|e| e.pointer_entered).skip(1)`. In the common case of a menu with no open submenu, exactly one element has `pointer_entered == true`; `skip(1)` then drops it from the iterator entirely, so no `leave` event is ever delivered to that lone element when the pointer moves off the menu. The element's `pointer_entered` flag is also never reset to `false`, so the embedded Iced widget's hover highlighting can remain visually stuck, and a later `motion()` back into the menu will use `PointerTarget::motion` (assuming already-entered state) instead of re-sending `enter`.","fix":"When no element contains the cursor, send `leave` to every entered element found via the filter (drop the `.skip(1)`), or explicitly track and skip only elements that are legitimately meant to stay highlighted (e.g. parents of an open submenu) rather than unconditionally skipping the first match.","locations":[{"ref":"src/shell/grabs/menu/mod.rs:580-595","code":"  580 |             } else {\n  581 |                 elements\n  582 |                     .iter_mut()\n  583 |                     .filter(|element| element.pointer_entered)\n  584 |                     .skip(1)\n  585 |                     .for_each(|element| {\n  586 |                         PointerTarget::leave(\n  587 |                             &element.iced,\n  588 |                             &self.seat,\n  589 |                             state,\n  590 |                             event.serial,\n  591 |                             event.time,\n  592 |                         );\n  593 |                         element.pointer_entered = false;\n  594 |                     })\n  595 |             }","lines":16,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/shell/grabs/menu/mod.rs#L580-L595"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`OutputZoomState::animating_level` computes `percentage = elapsed / ANIMATION_DURATION` and feeds it directly into `ease(Linear, old_level, self.level, percentage)` without clamping to `[0, 1]` or checking whether the animation already finished. Its sibling `animating_focal_point` explicitly checks `duration_since > ANIMATION_DURATION` and early-returns the final value in that case. If `animating_level` is ever queried before the per-frame `refresh()` call clears an expired `previous_level` (or refresh lags behind for any output), `percentage` can exceed `1.0`, and `keyframe::ease` with `Linear` will overshoot past the target level instead of clamping to it.","fix":"Mirror the pattern used in `animating_focal_point`: check if `duration_since(*start) > ANIMATION_DURATION`, and if so, clear `previous_level` and return `self.level` directly; otherwise clamp `percentage` to `.min(1.0)` before calling `ease`.","locations":[{"ref":"src/shell/zoom.rs:143-152","code":"  143 |     pub fn animating_level(&self) -> f64 {\n  144 |         if let Some((old_level, start)) = self.previous_level.as_ref() {\n  145 |             let percentage = Instant::now().duration_since(*start).as_millis() as f32\n  146 |                 / ANIMATION_DURATION.as_millis() as f32;\n  147 | \n  148 |             ease(Linear, *old_level, self.level, percentage)\n  149 |         } else {\n  150 |             self.level\n  151 |         }\n  152 |     }","lines":10,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/shell/zoom.rs#L143-L152"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`surface_corners` computes `half_min_dim` as a safety clamp so a client-supplied corner radius can never be large enough to disconnect the surface outline: `u8::try_from(size.w.min(size.h) / 2).unwrap_or(u8::MAX)`. If the conversion fails (e.g. because the dimension is negative, which can happen transiently for surfaces without a settled geometry), the fallback is `u8::MAX` (255) -- i.e. the *least* restrictive value -- which defeats the purpose of the guard instead of failing safe.","fix":"Fall back to `0` (or clamp negative sizes to 0 before the `min`/division) instead of `u8::MAX`, e.g. `u8::try_from(size.w.min(size.h).max(0) / 2).unwrap_or(0)`, so an unexpected/negative size disables corner rounding rather than allowing an unbounded radius.","locations":[{"ref":"src/wayland/handlers/corner_radius.rs:25-45","code":"   25 | pub fn surface_corners(states: &SurfaceData, size: Size<i32, Logical>) -> Option<[u8; 4]> {\n   26 |     let mut guard = states.cached_state.get::<CacheableCorners>();\n   27 | \n   28 |     // guard against corner radius being too large, potentially disconnecting the outline\n   29 |     let half_min_dim = u8::try_from(size.w.min(size.h) / 2).unwrap_or(u8::MAX);\n   30 |     let corners = guard.current().0?;\n   31 | \n   32 |     Some([\n   33 |         u8::try_from(corners.top_left)\n   34 |             .unwrap_or(u8::MAX)\n   35 |             .min(half_min_dim),\n   36 |         u8::try_from(corners.top_right)\n   37 |             .unwrap_or(u8::MAX)\n   38 |             .min(half_min_dim),\n   39 |         u8::try_from(corners.bottom_right)\n   40 |             .unwrap_or(u8::MAX)\n   41 |             .min(half_min_dim),\n   42 |         u8::try_from(corners.bottom_left)\n   43 |             .unwrap_or(u8::MAX)\n   44 |             .min(half_min_dim),\n   45 |     ])","lines":21,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/wayland/handlers/corner_radius.rs#L25-L45"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`send_workspace_to_client` in ext.rs only sends the one-shot `id` event when `handle_state.ext_id.is_none()`, but `handle_state.ext_id` is never assigned anywhere in the file (the `WorkspaceDataInner.ext_id` field is only ever read, never written). Consequently the guard is always true and `instance.id(id)` fires on every call to `send_workspace_to_client`, i.e. on every `refresh`/output update, not just once as the ext-workspace protocol intends for this immutable identifier event.","fix":"After sending `instance.id(id)`, persist it: `handle_state.ext_id = Some(id);` (and use that stored value for `instance.id(...)` instead of re-cloning from `workspace.ext_id` each time) so the event is only emitted once per workspace handle.","locations":[{"ref":"src/wayland/protocols/workspace/ext.rs:487-491","code":"  487 |     if handle_state.ext_id.is_none()\n  488 |         && let Some(id) = workspace.ext_id.clone()\n  489 |     {\n  490 |         instance.id(id);\n  491 |     }","lines":5,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/wayland/protocols/workspace/ext.rs#L487-L491"},{"ref":"src/wayland/protocols/workspace/ext.rs:48-56","code":"   48 | pub struct WorkspaceDataInner {\n   49 |     pub(super) group: Option<ExtWorkspaceGroupHandleV1>,\n   50 |     name: String,\n   51 |     capabilities: Option<ext_workspace_handle_v1::WorkspaceCapabilities>,\n   52 |     coordinates: Vec<u32>,\n   53 |     states: Option<ext_workspace_handle_v1::State>,\n   54 |     ext_id: Option<String>,\n   55 |     pub(super) cosmic_v2_handle: Option<Weak<ZcosmicWorkspaceHandleV2>>,\n   56 | }","lines":9,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/wayland/protocols/workspace/ext.rs#L48-L56"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`WorkspaceUpdateGuard::move_workspace_to_group` always removes the workspace from its current group and pushes it onto the end of the target group's `workspaces` Vec, even when `group_handle` refers to the group the workspace is already in. In that case the call still silently reorders the workspace to the end of the list (remove + re-append) instead of leaving its position unchanged, which can visibly reshuffle workspace ordering for clients in response to what should be a no-op 'assign to current group' request.","fix":"Early-return (or skip the remove/push) when the workspace's current group id already equals `group_handle.id`.","locations":[{"ref":"src/wayland/protocols/workspace/mod.rs:419-454","code":"  419 |     pub fn move_workspace_to_group(\n  420 |         &mut self,\n  421 |         group_handle: WorkspaceGroupHandle,\n  422 |         workspace_handle: WorkspaceHandle,\n  423 |     ) {\n  424 |         // Get index of new group\n  425 |         let Some(group_idx) = self.0.groups.iter().position(|g| g.id == group_handle.id) else {\n  426 |             // If the new group doesn't exist, we shouldn't remove the workspace from its old group\n  427 |             return;\n  428 |         };\n  429 | \n  430 |         // Find old group index, and remove the workspace\n  431 |         let Some(workspace) = self.0.groups.iter_mut().find_map(|group| {\n  432 |             let idx = group\n  433 |                 .workspaces\n  434 |                 .iter()\n  435 |                 .position(|w| w.id == workspace_handle.id)?;\n  436 |             Some(group.workspaces.remove(idx))\n  437 |         }) else {\n  438 |             // Workspace not found in any group\n  439 |             return;\n  440 |         };\n  441 | \n  442 |         // Send `workspace_leave` for ever instance with old group.\n  443 |         //\n  444 |         // `workspace_enter` will be sent in `send_group_to_client`, but if a group is destroyed,\n  445 |         // we need to make sure `workspace_leave` is sent first.\n  446 |         for instance in &workspace.ext_instances {\n  447 |             let workspace_data = instance.data::<WorkspaceData>().unwrap();\n  448 |             if let Some(group_instance) = workspace_data.inner.lock().unwrap().group.take() {\n  449 |                 group_instance.workspace_leave(instance);\n  450 |             }\n  451 |         }\n  452 | \n  453 |         self.0.groups[group_idx].workspaces.push(workspace);\n  454 |     }","lines":36,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/wayland/protocols/workspace/mod.rs#L419-L454"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"`CosmicSurface::try_force_undecorated` sets the KDE server-decoration protocol mode to `KdeMode::Server` in both the `enable == true` branch (forcing decorations off because the window just joined a stack) and the `enable == false` branch (restoring the window's normal decoration when it leaves a stack). The `else` branch is a verbatim copy of the `if` branch's KDE block instead of reverting the KDE decoration mode. Compare with `KdeDecorationHandler::new_decoration` in wayland/handlers/decoration.rs, which only assigns `KdeMode::Server` when the window `is_stack()` and `KdeMode::Client` otherwise - so a legacy KDE/Qt client that requests server-side decorations should go back to `Client` mode once un-stacked, but this code leaves it forced to `Server`, so such clients keep rendering without their own title bar/decorations after being removed from a stack.","fix":"In the `else` branch, set the KDE objects' mode based on whether the window is still part of a stack (mirroring `new_decoration`'s `is_stack()` check), e.g. `obj.mode(KdeMode::Client)` instead of unconditionally `obj.mode(KdeMode::Server)`.","locations":[{"ref":"src/shell/element/surface.rs:395-407","code":"  395 |                 } else {\n  396 |                     let previous_mode = PreferredDecorationMode::mode(&self.0);\n  397 |                     toplevel.with_pending_state(|pending| {\n  398 |                         pending.decoration_mode = previous_mode;\n  399 |                     });\n  400 |                     with_states(toplevel.wl_surface(), |data| {\n  401 |                         if let Some(kde_data) = data.data_map.get::<KdeDecorationData>() {\n  402 |                             for obj in kde_data.lock().unwrap().objs.iter() {\n  403 |                                 obj.mode(KdeMode::Server);\n  404 |                             }\n  405 |                         }\n  406 |                     })\n  407 |                 }","lines":13,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/shell/element/surface.rs#L395-L407"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"In the `UnsetPadding` request handler for `CosmicCornerRadiusLayerV1`, the code clears `guard.corners = None;` instead of `guard.padding = None;` (this line was clearly copy-pasted from the `UnsetRadius`/`Destroy` handlers just above). As a result, calling `unset_padding` erroneously wipes the tracked corner-radius state (which is not what the request commits to `CacheableCorners`, so the internal `CornerRadiusInternal.corners` field now silently diverges from the actually-committed `CacheableCorners` value) while the `padding` field it was supposed to clear is left untouched, even though the cached `CacheablePadding` pending state below IS reset to `None`. This desyncs `CornerRadiusInternal`'s tracked `corners`/`padding` from the values actually committed to the surface's cached state.","fix":"Change line 578 from `guard.corners = None;` to `guard.padding = None;`.","locations":[{"ref":"src/wayland/protocols/corner_radius.rs:578-606","code":"  578 |             cosmic_corner_radius_layer_v1::Request::UnsetPadding => {\n  579 |                 let mut guard = data.lock().unwrap();\n  580 |                 guard.corners = None;\n  581 | \n  582 |                 let CornerRadiusSurface::Layer(layer_surface) = &guard.surface else {\n  583 |                     unreachable!(\"corner_radius_layer without layer shell?\");\n  584 |                 };\n  585 |                 let Some(layer_surface) = layer_surface.upgrade().ok().and_then(|layer| {\n  586 |                     state\n  587 |                         .shell_state()\n  588 |                         .layer_surfaces()\n  589 |                         .find(|s| s.shell_surface() == &layer)\n  590 |                 }) else {\n  591 |                     resource.post_error(\n  592 |                         cosmic_corner_radius_layer_v1::Error::LayerDestroyed as u32,\n  593 |                         format!(\"{:?} No layer found\", resource),\n  594 |                     );\n  595 |                     return;\n  596 |                 };\n  597 | \n  598 |                 with_states(layer_surface.wl_surface(), |s| {\n  599 |                     let mut cached = s.cached_state.get::<CacheablePadding>();\n  600 |                     let pending = cached.pending();\n  601 |                     *pending = CacheablePadding(None);\n  602 |                 });\n  603 |                 drop(guard);\n  604 | \n  605 |                 state.unset_padding(data);\n  606 |             }","lines":29,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/wayland/protocols/corner_radius.rs#L578-L606"}]},
{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"`TilingExceptions::new` validates the `title` regex but logs `exception.appid` in the warning instead of `exception.title`, making the diagnostic message misleading when a title regex fails to compile (it will print the app-id string, not the invalid title pattern that actually caused the error).","fix":"Change the warning to reference `exception.title`: `warn!(\"Invalid regex for title: {}, {}\", exception.title, e);`","locations":[{"ref":"src/shell/layout/mod.rs:76-78","code":"   76 |             if let Err(e) = Regex::new(&exception.title) {\n   77 |                 warn!(\"Invalid regex for title: {}, {}\", exception.appid, e);\n   78 |                 continue;","lines":3,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/shell/layout/mod.rs#L76-L78"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"easy","description":"In the `XWaylandEvent::Ready` handler, if `X11Wm::start_wm` fails, the closure logs the error and returns early without ever calling `data.notify_ready()`. `notify_ready` uses `Once::call_once` and is otherwise only invoked from the `Ready`/`Error` branches of this same handler and from `launch_xwayland`'s own early failure paths, and from the non-Xwayland branches in the KMS/winit/x11 backends (which are skipped when Xwayland is enabled). If WM startup fails after Xwayland itself came up, readiness is never signalled: systemd is never told the service is ready, `session::run_socket` (cosmic-session IPC) is never set up, and a kiosk-mode child command is never launched, effectively hanging session startup.","fix":"Call `data.notify_ready();` in the `Err(err)` arm before returning, mirroring the `XWaylandEvent::Error` branch below it.","locations":[{"ref":"src/xwayland.rs:161-172","code":"  161 |                     let wm = match X11Wm::start_wm(\n  162 |                         data.common.event_loop_handle.clone(),\n  163 |                         &data.common.display_handle,\n  164 |                         x11_socket,\n  165 |                         client.clone(),\n  166 |                     ) {\n  167 |                         Ok(wm) => wm,\n  168 |                         Err(err) => {\n  169 |                             error!(?err, \"Failed to start Xwayland WM\");\n  170 |                             return;\n  171 |                         }\n  172 |                     };","lines":12,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/xwayland.rs#L161-L172"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`try_vulkan_allocator` is explicitly written to gracefully fall back to the GBM allocator on any Vulkan failure (instance creation errors and enumeration errors are both handled with `match`/early `return None`), but the device-selection closure calls `phd.primary_node().unwrap()` and `phd.render_node().unwrap()` directly. If a Vulkan physical device fails to report its DRM node (a legitimate `Err` on some restricted/virtual drivers), this unwrap panics and crashes compositor startup instead of falling back to GBM as the rest of the function intends.","fix":"Replace the `.unwrap()` calls with `.ok().flatten()` (or a nested `match`) so a query error is treated like 'no match', consistent with the surrounding fallback logic, e.g. `phd.primary_node().ok().flatten() == Some(*node) || phd.render_node().ok().flatten() == Some(*node)`.","locations":[{"ref":"src/backend/x11.rs:295-305","code":"  295 |     let Some(device) = devices\n  296 |         .filter(|phd| {\n  297 |             phd.has_device_extension(smithay::reexports::ash::ext::physical_device_drm::NAME)\n  298 |         })\n  299 |         .find(|phd| {\n  300 |             phd.primary_node().unwrap() == Some(*node) || phd.render_node().unwrap() == Some(*node)\n  301 |         })\n  302 |     else {\n  303 |         debug!(?node, \"No vulkan device for node, falling back to gbm.\");\n  304 |         return None;\n  305 |     };","lines":11,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/backend/x11.rs#L295-L305"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`OutputPowerState::refresh` silently does nothing when `data.output.upgrade()` fails (the output was destroyed) or `state.get_dpms(&output)` returns `None` (dpms state unavailable) - the entry is left in `output_powers` with a stale mode and the client is never told anything changed. This is inconsistent with the `SetMode` request handler, which explicitly calls `obj.failed()` and removes the entry from `output_powers` in the same situation (output gone / dpms unavailable). Clients relying on `refresh`-driven updates (e.g. an output removed while a `zwlr_output_power_v1` object is bound to it) never receive a `failed` event and keep believing the last known power mode is current.","fix":"In the `else` branch of the `if let Some(output) = ... && let Some(on) = ...` in `refresh`, call `output_power.failed()` and remove the entry from `output_powers`, mirroring the cleanup already done in the `SetMode` handler.","locations":[{"ref":"src/wayland/protocols/output_power.rs:57-72","code":"   57 |     pub fn refresh<D: OutputPowerHandler>(state: &mut D) {\n   58 |         let mut output_powers = mem::take(&mut state.output_power_state().output_powers);\n   59 |         for (output_power, old_mode) in output_powers.iter_mut() {\n   60 |             let data = output_power.data::<OutputPowerData>().unwrap();\n   61 |             if let Some(output) = data.output.upgrade()\n   62 |                 && let Some(on) = state.get_dpms(&output)\n   63 |             {\n   64 |                 let mode = output_power_mode(on);\n   65 |                 if mode != *old_mode {\n   66 |                     output_power.mode(mode);\n   67 |                     *old_mode = mode;\n   68 |                 }\n   69 |             }\n   70 |         }\n   71 |         state.output_power_state().output_powers = output_powers;\n   72 |     }","lines":16,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/wayland/protocols/output_power.rs#L57-L72"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"In `DisableHead`, when the disabled head is currently used as a mirroring target by another pending head config, the code falls back to `head.post_error(zwlr_output_configuration_v1::Error::UnconfiguredHead, ...)` when there is no `extension_obj`. `head` here is a `&ZwlrOutputHeadV1` resource, but `zwlr_output_configuration_v1::Error` is the error enum of a *different* interface (`zwlr_output_configuration_v1`). `Resource::post_error` is generic over `impl Into<u32>` so this compiles, but it sends a wl_display error event on the `zwlr_output_head_v1` object carrying an error code number that is meaningless for that interface, which well-behaved clients/libwayland may reject or misinterpret as protocol corruption. Additionally, in both branches, the request falls through to `pending.heads.push((head, None))` regardless of whether the busy error was raised - there is no early `return` after posting the error (contrast with `EnableHead` just above, which does `return` after `AlreadyConfiguredHead`), leaving inconsistent/undefined pending head configuration state after a fatal protocol error was already raised for the client.","fix":"Post the `MirroredHeadBusy`/error on the correct object (e.g. always via `extension_obj` when present, otherwise post the error on `obj` (`ZwlrOutputConfigurationV1`) using an error code defined on that interface) and add an early `return;` after posting the error, matching the pattern used in `EnableHead`.","locations":[{"ref":"src/wayland/protocols/output_configuration/handlers/wlr.rs:218-252","code":"  218 |             zwlr_output_configuration_v1::Request::DisableHead { head } => {\n  219 |                 let mut pending = data.lock().unwrap();\n  220 |                 if pending.heads.iter().any(|(h, _)| *h == head) {\n  221 |                     obj.post_error(\n  222 |                         zwlr_output_configuration_v1::Error::AlreadyConfiguredHead,\n  223 |                         format!(\"{:?} was already configured\", head),\n  224 |                     );\n  225 |                     return;\n  226 |                 }\n  227 | \n  228 |                 if pending.heads.iter().any(|(_, c)| match c {\n  229 |                     Some(conf) => {\n  230 |                         let output_conf = conf.data::<PendingOutputConfiguration>().unwrap();\n  231 |                         let output = head.data::<WeakOutput>().unwrap();\n  232 |                         let pending_conf = output_conf.lock().unwrap();\n  233 |                         pending_conf.mirroring.as_ref().is_some_and(|o| o == output)\n  234 |                     }\n  235 |                     None => false,\n  236 |                 }) {\n  237 |                     if let Some(extension_obj) = pending.extension_obj.as_ref() {\n  238 |                         extension_obj.post_error(\n  239 |                             zcosmic_output_configuration_v1::Error::MirroredHeadBusy,\n  240 |                             format!(\"{:?} is disabled and mirrored\", head),\n  241 |                         );\n  242 |                     } else {\n  243 |                         // unreachable?\n  244 |                         head.post_error(\n  245 |                             zwlr_output_configuration_v1::Error::UnconfiguredHead,\n  246 |                             format!(\"{:?} is disabled and mirrored\", head),\n  247 |                         );\n  248 |                     }\n  249 |                 }\n  250 | \n  251 |                 pending.heads.push((head, None));\n  252 |             }","lines":35,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/wayland/protocols/output_configuration/handlers/wlr.rs#L218-L252"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"high","difficulty":"medium","description":"In the cosmic-session socket read handler installed by `run_socket`, `stream.stream.read(&mut stream.buffer)` returning `Ok(0)` (peer closed the connection / EOF) is not distinguished from a partial read. The code only checks `stream.read_bytes != 0 && stream.read_bytes == stream.size as usize` to decide completion; on EOF, `read_bytes` stays unchanged (often 0) and the handler falls through to `Ok(PostAction::Continue)`. Since the fd is registered with `Interest::READ` and `Mode::Level`, a closed/EOF'd socket remains readable-level-triggered forever, so calloop will call this callback again immediately, `read()` will again return `Ok(0)`, and so on - a tight busy loop pinning a CPU core for as long as cosmic-comp runs after cosmic-session's socket is closed (e.g. if cosmic-session crashes or exits before cosmic-comp).","fix":"Treat `Ok(0)` from `read()` as connection closed and return `Ok(PostAction::Remove)` (similar to how the `Err` branches already do), instead of only checking against the expected message size.","locations":[{"ref":"src/session.rs:106-153","code":"  106 |             handle.insert_source(\n  107 |                 Generic::new(StreamWrapper::from(session_socket), Interest::READ, Mode::Level),\n  108 |                 move |_, stream, _state| {\n  109 |                     // SAFETY: We don't drop the stream!\n  110 |                     let stream = unsafe { stream.get_mut() };\n  111 | \n  112 |                     if stream.size == 0 {\n  113 |                         let mut len = [0u8; 2];\n  114 |                         match stream.stream.read_exact(&mut len) {\n  115 |                             Ok(()) => {\n  116 |                                 stream.size = u16::from_ne_bytes(len);\n  117 |                                 stream.buffer = vec![0; stream.size as usize];\n  118 |                             },\n  119 |                             Err(err) => {\n  120 |                                 warn!(?err, \"Error reading from session socket\");\n  121 |                                 return Ok(PostAction::Remove);\n  122 |                             }\n  123 |                         }\n  124 |                     }\n  125 | \n  126 |                     stream.read_bytes += match stream.stream.read(&mut stream.buffer) {\n  127 |                         Ok(size) => size,\n  128 |                         Err(err) => {\n  129 |                             error!(?err, \"Error reading from session socket\");\n  130 |                             return Ok(PostAction::Remove);\n  131 |                         }\n  132 |                     };\n  133 | \n  134 |                     if stream.read_bytes != 0 && stream.read_bytes == stream.size as usize {\n  135 |                         stream.size = 0;\n  136 |                         stream.read_bytes = 0;\n  137 |                         match std::str::from_utf8(&stream.buffer) {\n  138 |                             Ok(message) => {\n  139 |                                 match serde_json::from_str::<'_, Message>(message) {\n  140 |                                     Ok(Message::SetEnv { .. }) => warn!(\"Got SetEnv from session? What is this?\"),\n  141 |                                     _ => warn!(\"Unknown session socket message, are you using incompatible cosmic-session and cosmic-comp versions?\"),\n  142 |                                 };\n  143 |                                 Ok(PostAction::Continue)\n  144 |                             },\n  145 |                             Err(err) => {\n  146 |                                 warn!(?err, \"Invalid message from session sock\");\n  147 |                                 Ok(PostAction::Continue)\n  148 |                             }\n  149 |                         }\n  150 |                     } else {\n  151 |                         Ok(PostAction::Continue)\n  152 |                     }\n  153 |                 },","lines":48,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/session.rs#L106-L153"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`CosmicWindow::min_size` and `CosmicWindow::max_size` each call `self.0.with_program(...)` twice - once to fetch the min/max size and a second time, inside the `Option::map` closure, just to re-check `is_decorated`. Each `with_program` call acquires the `IcedElement`'s internal lock. This is a minor but easily avoidable redundant lock/borrow per call.","fix":"Fetch both the size and the decoration flag from a single `with_program` closure and use the results afterward, e.g. `self.0.with_program(|p| (p.window.min_size_without_ssd(), !p.window.is_decorated(false)))`.","locations":[{"ref":"src/shell/element/window.rs:633-643","code":"  633 |     pub fn min_size(&self) -> Option<Size<i32, Logical>> {\n  634 |         self.0\n  635 |             .with_program(|p| p.window.min_size_without_ssd())\n  636 |             .map(|size| {\n  637 |                 if self.0.with_program(|p| !p.window.is_decorated(false)) {\n  638 |                     size + (0, SSD_HEIGHT).into()\n  639 |                 } else {\n  640 |                     size\n  641 |                 }\n  642 |             })\n  643 |     }","lines":11,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/shell/element/window.rs#L633-L643"},{"ref":"src/shell/element/window.rs:644-654","code":"  644 |     pub fn max_size(&self) -> Option<Size<i32, Logical>> {\n  645 |         self.0\n  646 |             .with_program(|p| p.window.max_size_without_ssd())\n  647 |             .map(|size| {\n  648 |                 if self.0.with_program(|p| !p.window.is_decorated(false)) {\n  649 |                     size + (0, SSD_HEIGHT).into()\n  650 |                 } else {\n  651 |                     size\n  652 |                 }\n  653 |             })\n  654 |     }","lines":11,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/shell/element/window.rs#L644-L654"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`WorkspaceState::done()` tracks a single global `changed` boolean across the full `ext_instances x groups` cross product. If any single group changed for any single client, `instance.done()` is then sent to *every* `ExtWorkspaceManagerV1` instance, including clients whose groups/workspaces had no actual changes. Per the ext-workspace protocol this is not incorrect (extra `done` events are harmless), but it means every client receives a wakeup/round of protocol traffic on every unrelated state change anywhere in the compositor instead of only clients that actually had something change.","fix":"Track a per-instance (or per-client) changed flag - e.g. collect the set of instances that actually received a change from `send_group_to_client` - and only call `.done()` on those instances.","locations":[{"ref":"src/wayland/protocols/workspace/mod.rs:305-319","code":"  305 |     fn done(&mut self) {\n  306 |         let mut changed = false;\n  307 |         for instance in &self.ext_instances {\n  308 |             for group in &mut self.groups {\n  309 |                 if ext::send_group_to_client::<D>(&self.dh, instance, group) {\n  310 |                     changed = true;\n  311 |                 }\n  312 |             }\n  313 |         }\n  314 |         if changed {\n  315 |             for instance in &self.ext_instances {\n  316 |                 instance.done();\n  317 |             }\n  318 |         }\n  319 |     }","lines":15,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/wayland/protocols/workspace/mod.rs#L305-L319"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"`WorkspaceUpdateGuard::remove_workspace` loops over every group in `self.0.groups` and unconditionally calls `group.workspaces.retain(|w| w.id != workspace.id)` on all of them, even though workspace ids are generated globally uniquely via `next_workspace_id()` and a given workspace can only ever belong to one group. The function does a full scan of every group's workspace list on every removal instead of stopping once the (single) owning group is found.","fix":"Use `self.0.groups.iter_mut().find(...)` to locate the single owning group, process its `ext_instances`/removal there, and `break`/return instead of scanning and retaining across every group.","locations":[{"ref":"src/wayland/protocols/workspace/mod.rs:403-417","code":"  403 |     pub fn remove_workspace(&mut self, workspace: WorkspaceHandle) {\n  404 |         for group in &mut self.0.groups {\n  405 |             if let Some(workspace) = group.workspaces.iter().find(|w| w.id == workspace.id) {\n  406 |                 for instance in &workspace.ext_instances {\n  407 |                     let workspace_data = instance.data::<WorkspaceData>().unwrap();\n  408 |                     if let Some(group_instance) = &workspace_data.inner.lock().unwrap().group {\n  409 |                         group_instance.workspace_leave(instance);\n  410 |                     }\n  411 |                     instance.removed();\n  412 |                 }\n  413 |             }\n  414 |             group.workspaces.retain(|w| w.id != workspace.id);\n  415 |         }\n  416 |         WORKSPACE_IDS.lock().unwrap().remove(&workspace.id);\n  417 |     }","lines":15,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/wayland/protocols/workspace/mod.rs#L403-L417"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"`SurfaceThreadState::postprocess_textures` is typed as `HashMap<DrmNode, PostprocessState>`, but the only place it is ever written to is `self.postprocess_textures.entry(self.target_node)` in `redraw()`, and `self.target_node` is a constant set once at construction and never reassigned. The map therefore only ever holds 0 or 1 entries, making the `HashMap` keyed lookup pointless complexity over a plain `Option<PostprocessState>`. As a side effect, `node_removed()` never removes the entry for a node from this map even though it removes the node from the renderer API, though this is currently harmless since `target_node` (the only key ever used) is not a node that gets removed via `node_removed` while the surface is alive.","fix":"Replace `postprocess_textures: HashMap<DrmNode, PostprocessState>` with `postprocess_state: Option<PostprocessState>` (re-creating it when the output config changes, as is already done on entry mismatch), removing the misleading multi-node abstraction.","locations":[{"ref":"src/backend/kms/surface/mod.rs:149","code":"  149 |     postprocess_textures: HashMap<DrmNode, PostprocessState>,","lines":1,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/backend/kms/surface/mod.rs#L149"},{"ref":"src/backend/kms/surface/mod.rs:1113-1133","code":" 1113 |             let postprocess_state = match self.postprocess_textures.entry(self.target_node) {\n 1114 |                 hash_map::Entry::Occupied(occupied) => {\n 1115 |                     let postprocess_state = occupied.into_mut();\n 1116 |                     // If output config is different, re-create offscreen state\n 1117 |                     if postprocess_state.output_config != offscreen_output_config {\n 1118 |                         *postprocess_state = PostprocessState::new_with_renderer(\n 1119 |                             &mut renderer,\n 1120 |                             compositor.format(),\n 1121 |                             offscreen_output_config,\n 1122 |                         )?\n 1123 |                     }\n 1124 |                     postprocess_state\n 1125 |                 }\n 1126 |                 hash_map::Entry::Vacant(vacant) => {\n 1127 |                     vacant.insert(PostprocessState::new_with_renderer(\n 1128 |                         &mut renderer,\n 1129 |                         compositor.format(),\n 1130 |                         offscreen_output_config,\n 1131 |                     )?)\n 1132 |                 }\n 1133 |             };","lines":21,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/backend/kms/surface/mod.rs#L1113-L1133"},{"ref":"src/backend/kms/surface/mod.rs:740-744","code":"  740 |     fn node_removed(&mut self, node: DrmNode) {\n  741 |         self.api.as_mut().remove_node(&node);\n  742 |         // force enumeration\n  743 |         let _ = self.api.devices();\n  744 |     }","lines":5,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/backend/kms/surface/mod.rs#L740-L744"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`CursorStateInner::current_image` is written in `draw_cursor` (`state.current_image = Some(frame);`) but is never read anywhere in the codebase, making it a write-only field that adds bookkeeping cost (an `Image` clone every frame a named cursor is drawn) with no observable effect.","fix":"Remove the `current_image` field (and the clone/assignment that populates it) if it is truly unused, or wire it up to whatever consumer it was intended for.","locations":[{"ref":"src/backend/render/cursor.rs:462","code":"  462 |     current_image: Option<Image>,","lines":1,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/backend/render/cursor.rs#L462"},{"ref":"src/backend/render/cursor.rs:694","code":"  694 |             current_image: None,","lines":1,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/backend/render/cursor.rs#L694"},{"ref":"src/backend/render/cursor.rs:816","code":"  816 |         state.current_image = Some(frame);","lines":1,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/backend/render/cursor.rs#L816"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`RubberBand` (with `band`, `derivative`, `clamp`, `clamp_derivative` methods) and `GestureState::projected_end_pos` are defined but never referenced anywhere in the codebase (confirmed via a repo-wide grep). This appears to be leftover/ported code (comment references niri's rubber_band.rs) that was never wired up to any gesture rubber-banding behavior.","fix":"Either wire `RubberBand`/`projected_end_pos` into the swipe-gesture handling (e.g. to rubber-band overscroll past the first/last workspace) or remove the unused code.","locations":[{"ref":"src/input/gestures/mod.rs:107-111","code":"  107 |     /// Computes the gesture end position after decelerating to a halt.\n  108 |     pub fn projected_end_pos(&self) -> f64 {\n  109 |         let vel = self.velocity();\n  110 |         self.delta - vel / (1000. * DECELERATION_TOUCHPAD.ln())\n  111 |     }","lines":5,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/input/gestures/mod.rs#L107-L111"},{"ref":"src/input/gestures/mod.rs:134-173","code":"  134 | // rubber_band.rs from Niri (GPL-3.0) https://github.com/YaLTeR/niri/blob/db49deb7fd2fbe805ceec060aa4dec65009ad7a7/src/rubber_band.rs\n  135 | #[derive(Debug, Clone, Copy)]\n  136 | pub struct RubberBand {\n  137 |     pub stiffness: f64,\n  138 |     pub limit: f64,\n  139 | }\n  140 | \n  141 | impl RubberBand {\n  142 |     pub fn band(&self, x: f64) -> f64 {\n  143 |         let c = self.stiffness;\n  144 |         let d = self.limit;\n  145 | \n  146 |         (1. - (1. / (x * c / d + 1.))) * d\n  147 |     }\n  148 | \n  149 |     pub fn derivative(&self, x: f64) -> f64 {\n  150 |         let c = self.stiffness;\n  151 |         let d = self.limit;\n  152 | \n  153 |         c * d * d / (c * x + d).powi(2)\n  154 |     }\n  155 | \n  156 |     pub fn clamp(&self, min: f64, max: f64, x: f64) -> f64 {\n  157 |         let clamped = x.clamp(min, max);\n  158 |         let sign = if x < clamped { -1. } else { 1. };\n  159 |         let diff = (x - clamped).abs();\n  160 | \n  161 |         clamped + sign * self.band(diff)\n  162 |     }\n  163 | \n  164 |     pub fn clamp_derivative(&self, min: f64, max: f64, x: f64) -> f64 {\n  165 |         if min <= x && x <= max {\n  166 |             return 1.;\n  167 |         }\n  168 | \n  169 |         let clamped = x.clamp(min, max);\n  170 |         let diff = (x - clamped).abs();\n  171 |         self.derivative(diff)\n  172 |     }\n  173 | }","lines":40,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/input/gestures/mod.rs#L134-L173"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`Seats::remove_seat` and `Seats::update_last_active` are `pub fn`s but are never called anywhere in the codebase (only `add_seat` is invoked once at startup in `src/backend/mod.rs`, and no code path removes or reassigns the active seat after that). This leaves dead API surface, and as a side effect the `Seats::last_active()` panic guard (`.expect(\"No seat?\")`) for an empty seat list is currently unreachable since seats are never removed - which itself suggests `remove_seat` was intended to be wired up (e.g. for hot-unplug of the last input backend or seat teardown) but isn't.","fix":"Either wire `remove_seat`/`update_last_active` into the seat lifecycle where they were meant to be used (e.g. libinput seat removal), or delete them if seat removal is genuinely out of scope for this compositor.","locations":[{"ref":"src/shell/seats.rs:64-71","code":"   64 |     pub fn remove_seat(&mut self, seat: &Seat<State>) {\n   65 |         self.seats.retain(|s| s != seat);\n   66 |         if self.seats.is_empty() {\n   67 |             self.last_active = None;\n   68 |         } else if self.last_active.as_ref().is_some_and(|s| s == seat) {\n   69 |             self.last_active = Some(self.seats[0].clone());\n   70 |         }\n   71 |     }","lines":8,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/shell/seats.rs#L64-L71"},{"ref":"src/shell/seats.rs:81-83","code":"   81 |     pub fn update_last_active(&mut self, seat: &Seat<State>) {\n   82 |         self.last_active = Some(seat.clone());\n   83 |     }","lines":3,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/shell/seats.rs#L81-L83"}]},
{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`_group_color` is never called anywhere in the codebase; the tiling layout code uses a separate `GROUP_COLOR` constant (see `src/shell/layout/tiling/mod.rs`) instead. The leading underscore in the name only suppresses unused-variable warnings, not unused-function (`dead_code`) warnings, so this function is genuinely dead weight.","fix":"Remove `_group_color`, or if it's meant to be kept for future use, mark it explicitly with `#[allow(dead_code)]` and a comment explaining why.","locations":[{"ref":"src/theme.rs:10-13","code":"   10 | pub(crate) fn _group_color(theme: &Theme) -> [f32; 3] {\n   11 |     let neutral_8 = theme.palette.neutral_8;\n   12 |     [neutral_8.red, neutral_8.green, neutral_8.blue]\n   13 | }","lines":4,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/theme.rs#L10-L13"}]},
{"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"The `XWaylandEvent::Error` handler does `if let Some(mut xwayland_state) = data.common.xwayland_state.take() { xwayland_state.xwm = None; }`. This takes `xwayland_state` fully out of `Common` into a local binding and then mutates a field on that now-orphaned local, which is dropped at the end of the block with no observable effect - the assignment is a complete no-op. In addition, since the underlying `calloop::EventSource` for `XWayland` always returns `PostAction::Disable` after emitting exactly one of `Ready` or `Error` (see smithay's `xwayland/xserver.rs`), `Error` can only fire before `Ready` ever ran, meaning `xwayland_state` (only ever set inside the `Ready` arm above) is always `None` at this point in practice - so the whole `if let Some(...)` block is unreachable in normal operation.","fix":"Simplify to just `data.common.xwayland_state = None;` (harmless even though it's already `None`) and drop the pointless post-take mutation, or remove the block entirely and just call `data.notify_ready();`.","locations":[{"ref":"src/xwayland.rs:182-187","code":"  182 |                 XWaylandEvent::Error => {\n  183 |                     if let Some(mut xwayland_state) = data.common.xwayland_state.take() {\n  184 |                         xwayland_state.xwm = None;\n  185 |                     }\n  186 |                     data.notify_ready();\n  187 |                 }","lines":6,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/xwayland.rs#L182-L187"}]},
{"id":"DEAD_7","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"A ~24 line commented-out `merge_workspaces` function is left in the file behind a `/* We will probably need this again at some point ... */` block comment. Dead, non-compiling code left inline makes the surrounding `Workspaces`/`WorkspaceSet` API harder to scan and will bit-rot silently (it already references `remove_fullscreen`/`toplevel_info_state` signatures that may drift from the live code without anyone noticing, since the compiler never checks it).","fix":"Delete the commented-out block and rely on version control (git history) to resurrect it if actually needed later.","locations":[{"ref":"src/shell/mod.rs:465-489","code":"  465 | /* We will probably need this again at some point\n  466 | fn merge_workspaces(\n  467 |     mut workspace: Workspace,\n  468 |     into: &mut Workspace,\n  469 |     workspace_state: &mut WorkspaceUpdateGuard<'_, State>,\n  470 |     toplevel_info_state: &mut ToplevelInfoState<State, CosmicSurface>,\n  471 | ) {\n  472 |     if into.fullscreen.is_some() {\n  473 |         // Don't handle the returned original workspace, for this nieche case.\n  474 |         let _ = workspace.remove_fullscreen();\n  475 |     }\n  476 | \n  477 |     for element in workspace.mapped() {\n  478 |         // fixup toplevel state\n  479 |         for (toplevel, _) in element.windows() {\n  480 |             toplevel_info_state.toplevel_leave_workspace(&toplevel, &workspace.handle);\n  481 |             toplevel_info_state.toplevel_enter_workspace(&toplevel, &into.handle);\n  482 |         }\n  483 |     }\n  484 |     // TODO: merge minimized windows\n  485 |     into.tiling_layer.merge(workspace.tiling_layer);\n  486 |     into.floating_layer.merge(workspace.floating_layer);\n  487 |     workspace_state.remove_workspace(workspace.handle);\n  488 | }\n  489 | */","lines":25,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daa {"id":"DEAD_8","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `OverlapNotifyState::refresh`, the loop `for other_surface in map.layers().filter(|s| *s != layer_surface)` already excludes `layer_surface` via the `LayerSurface` equality check in the `filter`. The subsequent `if other_surface.wl_surface().id() == layer_surface.wl_surface().id() { continue; }` re-checks the same condition through the underlying `wl_surface` id and can never be true, since two distinct `LayerSurface`s sharing the same `WlSurface` id would already be equal under the outer filter's `PartialEq`.","fix":"Remove the redundant inner `if ... { continue; }` check since the outer `.filter(|s| *s != layer_surface)` already guarantees it.","locations":[{"ref":"src/wayland/protocols/overlap_notify.rs:147-150","code":"  147 |                         for other_surface in map.layers().filter(|s| *s != layer_surface) {\n  148 |                             if other_surface.wl_surface().id() == layer_surface.wl_surface().id() {\n  149 |                                 continue;\n  150 |                             }","lines":4,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/wayland/protocols/overlap_notify.rs#L147-L150"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The module-level comment in `theme.rs` says the watcher updates \"a Arc<Mutex<Theme>> in the state\", but `Common::theme` is a plain `cosmic::Theme` field (see `src/state.rs:250`) guarded by the shell's `RwLock`, not an `Arc<Mutex<Theme>>`. The comment describes an outdated/incorrect data structure and is misleading to a future reader.","fix":"Update the comment to reflect the actual implementation, e.g. \"updates `Common::theme` in place and propagates it to the shell via `Shell::set_theme` on change\".","locations":[{"ref":"src/theme.rs:1-3","code":"    1 | // insert into the event loop, a watcher for the theme & theme mode for changes\n    2 | \n    3 | // update a Arc<Mutex<Theme>> in the state on change of the theme and mark all interfaces for a redraw.","lines":3,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/theme.rs#L1-L3"}]},

{"id":"DUP_5","type":"duplicate_code","type_label":"Duplicate Code","severity":"medium","difficulty":"medium","description":"The same asymmetric \"only fix rounding deficit, not surplus\" bug from `update_orientation` (see\nthe other finding at lines 2116-2123) is duplicated verbatim in `geometries_for_groupview`'s\nper-frame size rescale. Here `sum` is only clamped up (`if sum < new_length`), never down, so a\nrounding overshoot leaves the rendered child rectangles summing to more than the parent's length\nfor that frame (visible as a 1px overlap/flicker between adjacent tiles during animations). Being\nrecomputed every frame this instance is self-correcting/cosmetic rather than persisted, but it is\nthe same copy-pasted bug pattern and should be fixed together with the tree-mutating instance.","fix":"Use the symmetric fixup: `if sum != new_length { *sizes.last_mut().unwrap() += new_length - sum; }`,\nmatching `Data::update_geometry`.","locations":[{"ref":"src/shell/layout/tiling/mod.rs:4766-4776","code":" 4766 |                     let mut sizes = sizes\n 4767 |                         .iter()\n 4768 |                         .map(|len| {\n 4769 |                             (((*len as f64) / (previous_length as f64)) * (new_length as f64))\n 4770 |                                 .round() as i32\n 4771 |                         })\n 4772 |                         .collect::<Vec<_>>();\n 4773 |                     let sum: i32 = sizes.iter().sum();\n 4774 |                     if sum < new_length {\n 4775 |                         *sizes.last_mut().unwrap() += new_length - sum;\n 4776 |                     }","lines":11,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/shell/layout/tiling/mod.rs#L4766-L4776"}]},

{"id":"DUP_16","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"`xwayland_notify_key_event` and `xwayland_notify_pointer_button_event` duplicate the same 'track pressed state, ignore release without a matching press' pattern almost verbatim: both push onto a `Vec` on press, and on release use `.retain(|x| ...)` with a `removed` bool to detect whether the released key/button had actually been recorded, then bail out with an identical comment if not. Any future fix to this logic (e.g. the eavesdropping-reset race noted in the comment at line 514) has to be kept in sync across both copies.","fix":"Factor the press/release tracking into a small generic helper, e.g. `fn track_press<T: PartialEq>(pressed: &mut Vec<T>, item: T, is_press: bool) -> bool` returning whether the event should be forwarded, and call it from both handlers.","locations":[{"ref":"src/xwayland.rs:427-459","code":"  427 |         if state == KeyState::Pressed {\n  428 |             match config {\n  429 |                 EavesdroppingKeyboardMode::Modifiers => {\n  430 |                     if !is_modifier {\n  431 |                         return;\n  432 |                     }\n  433 |                 }\n  434 |                 EavesdroppingKeyboardMode::Combinations => {\n  435 |                     // don't forward alpha-numeric keys, just because shift is held, but forward shift itself\n  436 |                     if !(is_modifier || modifiers.alt || modifiers.ctrl || modifiers.logo) {\n  437 |                         return;\n  438 |                     }\n  439 |                 }\n  440 |                 _ => {}\n  441 |             }\n  442 | \n  443 |             xstate.pressed_keys.push(code);\n  444 |         } else {\n  445 |             let mut removed = false;\n  446 |             xstate.pressed_keys.retain(|c| {\n  447 |                 if *c == code {\n  448 |                     removed = true;\n  449 |                     fa {"id":"ARCH_3","type":"architecture","type_label":"Architecture","severity":"medium","difficulty":"hard","description":"`update_x11_stacking_order` builds the entire window stacking order as a single ~100-line expression using deeply nested `.chain()`/`.flat_map()`/`.filter()` combinators (5+ levels of nesting covering sticky layer, per-output active/inactive ordering, fullscreen-vs-focus-stack interleaving, and minimized windows). This is very hard to read, step through, or modify safely - a small change to the ordering rules risks being lost in the nesting, and the function has no unit-testable seams.","fix":"Split the iterator chain into named helper functions/methods (e.g. `sticky_layer_stacking_order`, `workspace_stacking_order`) that each return a `Vec<CosmicSurface>`, and compose them in `update_x11_stacking_order` with clear, commented steps instead of one large chained expression.","locations":[{"ref":"src/xwayland.rs:527-637","code":"  527 |     #[profiling::function]\n  528 |     pub fn update_x11_stacking_order(&mut self) {\n  529 |         let shell = self.shell.read();\n  530 |         let seat = shell.seats.last_active();\n  531 |         let active_output = seat.active_output();\n  532 | \n  533 |         if let Some(xwm) = self\n  534 |             .xwayland_state\n  535 |             .as_mut()\n  536 |             .and_then(|state| state.xwm.as_mut())\n  537 |         {\n  538 |             // front to back, given that is how the workspace enumerates\n  539 |             let order = shell\n  540 |                 .workspaces\n  541 |                 .sets\n  542 |                 .iter()\n  543 |                 .filter(|(output, _)| *output == &active_output)\n  544 |                 .chain(\n  545 |                     shell\n  546 |                         .workspaces\n  547 |                         .sets\n  548 |                         .iter()\n  549 |                         .filter(|(output, _)| *output != &active_output),\n  550 | {"id":"ARCH_4","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"easy","description":"`focus_target_is_valid` reads as a pure predicate (its name and boolean return type both suggest a\nside-effect-free check), but for the `KeyboardFocusTarget::Element` case it mutates shell state -\ncalling `shell.append_focus_stack(mapped, seat)` when a sticky window is valid but not yet the top\nof the focus stack. A validity check silently mutating the focus stack as a side effect is\nsurprising and easy to miss when reasoning about or reusing this function elsewhere.","fix":"Rename the function to make the side effect explicit (e.g. `ensure_focus_target_valid`), or move\nthe `append_focus_stack` call out to the caller (`Common::refresh_focus`) so the sticky-window\nfixup happens explicitly alongside the other \"fixup focus\" logic rather than inside the validity\ncheck.","locations":[{"ref":"src/shell/focus/mod.rs:646-679","code":"  646 |     match target {\n  647 |         KeyboardFocusTarget::Element(mapped) => {\n  648 |             if seat\n  649 |                 .user_data()\n  650 |                 .get::<SeatMoveGrabState>()\n  651 |                 .is_some_and(|state| {\n  652 |                     state\n  653 |                         .lock()\n  654 |                         .unwrap()\n  655 |                         .as_ref()\n  656 |                         .is_some_and(|state| state.element() == mapped)\n  657 |                 })\n  658 |             {\n  659 |                 return true;\n  660 |             }\n  661 | \n  662 |             let is_sticky = shell\n  663 |                 .workspaces\n  664 |                 .sets\n  665 |                 .get(output)\n  666 |                 .unwrap()\n  667 |                 .sticky_layer\n  668 |                 .mapped()\n  669 |                 .any(|m| m == &mapped);\n  670 | \n  671 |             let workspace = shell.active_space(output).unwrap();\n  672 |             let f   const p = new URLSearchParams(location.hash.slice(1));
