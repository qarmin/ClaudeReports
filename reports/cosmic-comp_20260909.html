<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"critical","difficulty":"easy","description":"`window_from_handle(toplevel).unwrap()` is called for every request in the `ZcosmicToplevelManagerV1` dispatch (`Activate`, `Close`, `SetFullscreen`, `UnsetFullscreen`, `SetMaximized`, `UnsetMaximized`, `SetMinimized`, `UnsetMinimized`, `SetSticky`, `UnsetSticky`, `SetRectangle`, `MoveToExtWorkspace`). `window_from_handle` returns `None` whenever the `ZcosmicToplevelHandleV1` was created via the fallback path in `toplevel_info.rs`'s `GetCosmicToplevel` handler for a `foreign_toplevel` that is not registered with `ToplevelInfoHandler` (see `ToplevelHandleStateInner::empty()` at toplevel_info.rs:215, which explicitly sets `window: None` and only logs an error - it does not refuse to create the handle). A client can trivially trigger this by calling `zcosmic_toplevel_info_v1.get_cosmic_toplevel` with an `ext_foreign_toplevel_handle_v1` the compositor never registered, then issuing any `zcosmic_toplevel_manager_v1` request on the resulting handle, crashing the entire compositor process for all connected clients.","fix":"Replace every `window_from_handle(toplevel).unwrap()` with a graceful path, e.g. `let Some(window) = window_from_handle(toplevel) else { return; };`, mirroring the `None` handling already used elsewhere in the file. Alternatively, refuse to create the `ZcosmicToplevelHandleV1` at all (post a protocol error) when the window can't be resolved in `toplevel_info.rs`.","locations":[{"ref":"src/wayland/protocols/toplevel_management.rs:187-267","code":"  187 |         match request {\n  188 |             zcosmic_toplevel_manager_v1::Request::Activate { toplevel, seat } => {\n  189 |                 let window = window_from_handle(toplevel).unwrap();\n  190 |                 state.activate(dh, &window, Seat::from_resource(&seat));\n  191 |             }\n  192 |             zcosmic_toplevel_manager_v1::Request::Close { toplevel } => {\n  193 | \n  225 |                 let window = window_from_handle(toplevel).unwrap();\n  226 |                 state.unset_sticky(dh, &window);\n  227 |             }\n  228 |             zcosmic_toplevel_manager_v1::Request::SetRectangle {\n  229 |                 toplevel,\n  230 |                 surface,\n  231 |                 x,\n  232 |                 y,\n  233 |                 width,\n  234 |                 height,\n  235 |             } => {\n  236 |                 let window =\n  237 |                     window_from_handle::<<D as ToplevelInfoHandler>::Window>(toplevel).unwrap();\n  238 |                 if let Some(toplevel_state) = window.user_data().get::<ToplevelState>() {\n  239 |                     let mut toplevel_state = toplevel_state.lock().unwrap();\n  240 |                     toplevel_state\n  241 |                         .rectangles\n  242 |                         .retain(|(s, _)| s.id() != surface.id());\n  243 |                     if width != 0 || height != 0 {\n  244 |                         toplevel_state.rectangles.push((\n  245 |                             surface.downgrade(),\n  246 |                             Rectangle::new((x, y).into(), (width, height).into()),\n  247 |                         ));\n  248 |                     }\n  249 |                 }\n  250 |             }\n  251 |             zcosmic_toplevel_manager_v1::Request::MoveToWorkspace { .. } => {}\n  252 |             zcosmic_toplevel_manager_v1::Request::MoveToExtWorkspace {\n  253 |                 toplevel,\n  254 |                 workspace,\n  255 |                 output,\n  256 |             } => {\n  257 |                 let window = window_from_handle(toplevel).unwrap();\n  258 |                 if let Some(workspace_handle) =\n  259 |                     state.workspace_state().get_ext_workspace_handle(&workspace)\n  260 |                     && let Some(output) = Output::from_resource(&output)\n  261 |                 {\n  262 | {"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"critical","difficulty":"easy","description":"`Common::xwayland_reset_eavesdropping` unconditionally calls `self.xwayland_state.as_mut().unwrap()`, with no check that Xwayland is actually running. It is invoked from `config/mod.rs` whenever the `xwayland_eavesdropping` cosmic-config key changes, with no guard on `xwayland_state` being `Some`. `xwayland_state` is `None` for the entire process lifetime when cosmic-comp is started with `--no-xwayland` (see `src/lib.rs:128-131`), and is also `None` during the startup window before `XWaylandEvent::Ready` fires, or after `XWayland::spawn`/`insert_source` fails. In any of those states, simply toggling the eavesdropping keyboard/pointer setting (e.g. via cosmic-settings) crashes the whole compositor with an unwrap panic.","fix":"Make `xwayland_reset_eavesdropping` a no-op when Xwayland isn't running: `let Some(xstate) = self.xwayland_state.as_mut() else { return; };` instead of `.unwrap()`.","locations":[{"ref":"src/xwayland.rs:374-391","code":"  374 |     pub fn xwayland_reset_eavesdropping(&mut self, serial: Serial) {\n  375 |         let seat = self.shell.read().seats.last_active().clone();\n  376 |         let keyboard = seat.get_keyboard().unwrap();\n  377 |         let pointer = seat.get_pointer().unwrap();\n  378 | \n  379 |         let xstate = self.xwayland_state.as_mut().unwrap();\n  380 |         xstate.last_modifier_state.take();\n  381 |         for key in xstate.pressed_keys.drain(..).rev() {\n  382 |             for wl_keyboard in keyboard.client_keyboards(&xstate.client) {\n  383 |                 wl_keyboard.key(serial.into(), 0, key.raw() - 8, KeyState::Released.into());\n  384 |             }\n  385 |         }\n  386 |         for button in xstate.pressed_buttons.drain(..).rev() {\n  387 |             for wl_pointer in pointer.client_pointers(&xstate.client) {\n  388 |                 wl_pointer.button(serial.into(), 0, button, ButtonState::Released.into());\n  389 |             }\n  390 |         }\n  391 |     }","lines":18,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/xwayland.rs#L374-L391"},{"ref":"src/config/mod.rs:926-934","code":"  926 |             \"xwayland_eavesdropping\" => {\n  927 |                 let new = get_config::<XwaylandEavesdropping>(&config, \"xwayland_eavesdropping\");\n  928 |                 if new != state.common.config.cosmic_conf.xwayland_eavesdropping {\n  929 |                     state.common.config.cosmic_conf.xwayland_eavesdropping = new;\n  930 |                     state\n  931 |                         .common\n  932 |                         .xwayland_reset_eavesdropping(SERIAL_COUNTER.next_serial());\n  933 |                 }\n  934 |             }","lines":9,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/config/mod.rs#L926-L934"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"high","difficulty":"very_easy","description":"`load_outputs` checks `path.exists()` and then opens the file with `OpenOptions::new().read(true).open(path).unwrap()`. This is a TOCTOU race (file can be removed/replaced between the check and the open) and also panics on any other open failure (permission error, path becomes a directory, etc.), crashing the compositor at startup while loading the persisted output configuration, even though the very next step (`ron::de::from_reader`) already has a full graceful-degradation path (log + delete + reset to default) for parse failures.","fix":"Handle the `open()` `Result` the same way parse errors are handled: on `Err`, warn and fall back to the default `OutputsConfig` instead of unwrapping.","locations":[{"ref":"cosmic-comp-config/src/output/comp.rs:81-84","code":"   81 |         if path.exists() {\n   82 |             match ron::de::from_reader::<_, OutputsConfig>(\n   83 |                 OpenOptions::new().read(true).open(path).unwrap(),\n   84 |             ) {","lines":4,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/cosmic-comp-config/src/output/comp.rs#L81-L84"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"When re-negotiating the DRM mode for an already-active surface, the closest-refresh-rate search does `(output_config.0.mode.1.unwrap() as i32 - refresh_rate as i32).abs()`, unconditionally unwrapping the optional stored refresh rate (`OutputConfig::mode: ((i32,i32), Option<u32>)`). `OutputConfig::default()` sets this field to `((0,0), None)`, and the very same struct (`CompOutputConfig`) already exposes a panic-safe accessor `mode_refresh()` (`src/config/mod.rs:94-96`) that does `self.0.mode.1.unwrap_or(60_000)` for exactly this reason. Any output config that reaches this code path with `mode.1 == None` (e.g. a manually edited/older `outputs.ron`, or a config produced by a code path that leaves refresh unset) crashes the whole compositor instead of using the existing safe fallback.","fix":"Use the existing safe accessor instead of unwrapping the raw field, e.g. `(output_config.mode_refresh() as i32 - refresh_rate as i32).abs()`.","locations":[{"ref":"src/backend/kms/mod.rs:1049-1052","code":" 1049 |                     .min_by_key(|mode| {\n 1050 |                         let refresh_rate = drm_helpers::calculate_refresh_rate(**mode);\n 1051 |                         (output_config.0.mode.1.unwrap() as i32 - refresh_rate as i32).abs()\n 1052 |                     })","lines":4,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/backend/kms/mod.rs#L1049-L1052"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`draw_cursor` computes `let actual_scale = (frame.size / state.size()).max(1);` where `state.size()` is `CursorStateInner::cursor_size`, a `u32` loaded straight from the `XCURSOR_SIZE` environment variable via `load_cursor_env()` (`.and_then(|s| s.parse().ok()).unwrap_or(24)`). If a user (or session manager) sets `XCURSOR_SIZE=0`, `cursor_size` becomes `0` and this integer division panics with 'attempt to divide by zero', crashing the compositor as soon as a named cursor is drawn. The `.max(1)` guard is applied only to the *result* of the division, too late to prevent the panic.","fix":"Clamp the parsed cursor size to at least 1 in `load_cursor_env` (e.g. `.map(|v: u32| v.max(1))`), or guard the division in `draw_cursor` with `state.size().max(1)`.","locations":[{"ref":"src/backend/render/cursor.rs:668-677","code":"  668 | pub fn load_cursor_env() -> (String, u32) {\n  669 |     let name = std::env::var(\"XCURSOR_THEME\")\n  670 |         .ok()\n  671 |         .unwrap_or_else(|| \"default\".into());\n  672 |     let size = std::env::var(\"XCURSOR_SIZE\")\n  673 |         .ok()\n  674 |         .and_then(|s| s.parse().ok())\n  675 |         .unwrap_or(24);\n  676 |     (name, size)\n  677 | }","lines":10,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/backend/render/cursor.rs#L668-L677"},{"ref":"src/backend/render/cursor.rs:808","code":"  808 |         let actual_scale = (frame.size / state.size()).max(1);","lines":1,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/backend/render/cursor.rs#L808"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`CosmicWindowInternal` stores pointer-hover state in a single `pointer_entered: AtomicU8` field, with a `TODO: This needs to be per seat` comment acknowledging it isn't seat-aware. `PointerTarget::enter` for `CosmicWindow` does `let old_focus = p.swap_focus(Some(next)); assert_eq!(old_focus, None);` which panics (crashing the whole compositor) if the field already held a non-None value when `enter` is called again. On a multi-seat setup, if a second seat's pointer enters the same window while a first seat's pointer is still hovering it (so the shared field is already non-zero), this assertion fails and the compositor panics. Even single-seat, any smithay-side double-`enter` without an intervening `leave` (e.g. driven by cursor-image/grab reconfiguration) would hit the same panic given the field is not per-seat.","fix":"Make `pointer_entered`/focus tracking per-seat (e.g. keyed by seat name/id in a map) as the TODO already notes, and drop the `assert_eq!` in favor of simply overwriting the stored focus, so a second seat's enter can't crash the compositor.","locations":[{"ref":"src/shell/element/window.rs:92-102","code":"   92 | #[derive(Debug)]\n   93 | pub struct CosmicWindowInternal {\n   94 |     pub(super) window: CosmicSurface,\n   95 |     activated: AtomicBool,\n   96 |     /// TODO: This needs to be per seat\n   97 |     pointer_entered: AtomicU8,\n   98 |     last_title: Mutex<String>,\n   99 |     tiled: AtomicBool,\n  100 |     theme: Mutex<cosmic::Theme>,\n  101 |     appearance_conf: Mutex<AppearanceConfig>,\n  102 | }","lines":11,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/shell/element/window.rs#L92-L102"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`raise_with_children` recurses over floating-layer elements whose `xdg_toplevel` parent points at\n`focused`, and recurses into each child with no visited-set / cycle guard. `xdg_toplevel.parent`\nis entirely client-controlled (via `set_parent`), and a client can set toplevel A's parent to its\nown toplevel B and B's parent back to A, since both toplevels belong to the same client\nconnection so both `set_parent` requests are valid protocol calls. Once such a 2-cycle (or longer)\nexists between mapped windows, calling `raise_with_children` (invoked from `Shell::update_active`\non every focus change) recurses forever between A and B, causing unbounded stack growth and a\nstack overflow that aborts the whole compositor process - a remotely triggerable DoS from a single\nmisbehaving client.","fix":"Track visited elements while walking the parent chain, e.g. pass a `HashSet<CosmicMapped>` (or\ncompare surface ids) down the recursion and skip/stop when an element has already been visited, or\nrewrite the traversal iteratively with an explicit worklist and a visited set.","locations":[{"ref":"src/shell/focus/mod.rs:464-493","code":"  464 | fn raise_with_children(floating_layer: &mut FloatingLayout, focused: &CosmicMapped) {\n  465 |     if floating_layer.mapped().any(|m| m == focused) {\n  466 |         floating_layer.space.raise_element(focused, true);\n  467 |         for element in floating_layer\n  468 |             .space\n  469 |             .elements()\n  470 |             .filter(|elem| elem != &focused)\n  471 |             .filter(|elem| {\n  472 |                 let parent = elem\n  473 |                     .active_window()\n  474 |                     .0\n  475 |                     .toplevel()\n  476 |                     .and_then(|toplevel| toplevel.parent());\n  477 |                 parent.is_some_and(|parent| {\n  478 |                     focused\n  479 |                         .active_window()\n  480 |                         .wl_surface()\n  481 |                         .map(Cow::into_owned)\n  482 |                         .map(|focused| parent == focused)\n  483 |                         .unwrap_or(false)\n  484 |                 })\n  485 |             })\n  486 |             .cloned()\n  487 |             .collect::<Vec<_>>()\n  488 |             .into_iter()\n  489 |         {\n  490 |             raise_with_children(floating_layer, &element);\n  491 |         }\n  492 |     }\n  493 | }","lines":30,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/shell/focus/mod.rs#L464-L493"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"MoveGrab's Drop impl schedules an idle closure that dereferences the drag's `output`/`cursor_output` with several `.unwrap()` calls (`shell.active_space(&output).unwrap()`, `shell.workspaces.sets.get_mut(&output).unwrap()`, `shell.active_space_mut(&output).unwrap()`, `shell.workspaces.active_mut(&cursor_output).unwrap()`). `Shell::remove_output`/`WorkspaceSets::remove_output` (src/shell/mod.rs and src/shell/workspace.rs) shift-remove the output's entire `set` from `self.sets` on monitor unplug and do not cancel in-flight pointer/touch grabs. If a monitor is disconnected while a window is being dragged (grab still active, referencing that output), the idle closure runs after the output is already gone from `shell.workspaces.sets`, so every one of these `.unwrap()` calls panics and crashes the whole compositor.","fix":"Before unwrapping, verify the output is still present, e.g. `let Some(workspace) = shell.active_space(&output) else { /* fall back to another output or drop the window without crashing */ };` for each lookup, mirroring the defensive `self.output.upgrade()` pattern already used in `ResizeForkGrab::update_location`.","locations":[{"ref":"src/shell/grabs/moving.rs:925","code":"  925 |                     let workspace_handle = shell.active_space(&output).unwrap().handle;","lines":1,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/shell/grabs/moving.rs#L925"},{"ref":"src/shell/grabs/moving.rs:943","code":"  943 |                             let set = shell.workspaces.sets.get_mut(&output).unwrap();","lines":1,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/shell/grabs/moving.rs#L943"},{"ref":"src/shell/grabs/moving.rs:951","code":"  951 |                             if shell.active_space(&output).unwrap().tiling_enabled =>","lines":1,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/shell/grabs/moving.rs#L951"},{"ref":"src/shell/grabs/moving.rs:953-957","code":"  953 |                             let (window, location) = shell\n  954 |                                 .active_space_mut(&output)\n  955 |                                 .unwrap()\n  956 |                                 .tiling_layer\n  957 |                                 .drop_window(grab_state.window);","lines":5,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/shell/grabs/moving.rs#L953-L957"},{"ref":"src/shell/grabs/moving.rs:966","code":"  966 |                             let workspace = shell.active_space_mut(&output).unwrap();","lines":1,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/shell/grabs/moving.rs#L966"},{"ref":"src/shell/grabs/moving.rs:1038-1041","code":" 1038 |                 .active_mut(&cursor_output)\n 1039 |                 .unwrap()\n 1040 |                 .tiling_layer\n 1041 |                 .cleanup_drag();","lines":4,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/shell/grabs/moving.rs#L1038-L1041"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`Shell::resize()` (keyboard-driven resize via `Trigger`/`ResizeDirection` shortcuts, as opposed to the pointer/touch `ResizeGrab`) stashes `(KeyboardFocusTarget, ResizeDirection, ResizeEdge, i32, usize, Output)` into `self.resize_state`, capturing the *current* `Output` and workspace index at the time the resize step happens. Nothing clears or refreshes `resize_state` when that output is later removed - `Workspaces::remove_output` (mod.rs:921-1013) clears a seat's `active_output`/`focused_output` but never touches `Shell::resize_state`. When the resize gesture ends, `set_resize_mode(None, ...)` calls `Shell::finish_resize(direction, edge)`, which does `self.resize_state.take()` and, if the window isn't currently in any output's sticky layer, falls into `.or_else(|| { let workspace = self.workspaces.get(idx, &output).unwrap(); ... })`. `Workspaces::get` returns `Option<&Workspace>` (`None` if `output` is no longer a key in `self.sets`, or if `idx` is out of range for that output's workspace vec), so if the output referenced by the stale `resize_state` was unplugged/removed while the keyboard-resize gesture was still in progress, this `.unwrap()` panics and takes down the whole compositor. Concretely: start a keyboard resize (Super+arrow) on a tiled/floating window on output B while a second output A exists, unplug/disable output B mid-gesture, then release the resize modifier - `finish_resize` runs with `output == B` (no longer in `self.sets`) and crashes.","fix":"Store a `WeakOutput` (as `previous_workspace_idx` already does) instead of a strong `Output` in `resize_state`, or clear `self.resize_state` from `Workspaces::remove_output`/`Shell` when the referenced output disappears. At minimum, replace the `.unwrap()` at mod.rs:4608 with a graceful `else { return; }` (via `?` or a `let Some(..) = ... else { return None }` pattern) so a stale output/idx can't crash the compositor.","locations":[{"ref":"src/shell/mod.rs:4593-4623","code":" 4593 |     pub fn resize(&mut self, seat: &Seat<State>, direction: ResizeDirection, edge: ResizeEdge) {\n 4594 |         let Some(output) = seat.focused_output() else {\n 4595 |             return;\n 4596 |         };\n 4597 |         let (_, idx) = self.workspaces.active_num(&output);\n 4598 |         let Some(focused) = seat.get_keyboard().unwrap().current_focus() else {\n 4599 |             return;\n 4600 |         };\n 4601 |         let amount = (self\n 4602 |             .resize_state\n 4603 |             .take()\n 4604 |             .map(|(_, _, _, amount, _, _)| amount)\n 4605 |             .unwrap_or(10)\n 4606 |             + 2)\n 4607 |         .min(20);\n 4608 | \n 4609 |         if self\n 4610 |             .workspaces\n 4611 |             .sets\n 4612 |             .get_mut(&output)\n 4613 |             .unwrap()\n 4614 |             .sticky_layer\n 4615 |             .resize(&focused, direction, edge, amount)\n 4616 |         {\n 4617 |             self.resize_state = Some((focused, direction, edge, amount, idx, output));\n 4618 |         } else if let Some(workspace) = self.workspaces.get_mut(idx, &output)\n 4619 |             && workspace.resize(&focused, direction, edge, amount)\n 4620 |         {\n 4621 |             self.resize_state = Some((focused, direction, edge, amount, idx, output));\n 4622 |         }\n 4623 |     }","lines":31,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/shell/mod.rs#L4593-L4623"},{"ref":"src/shell/mod.rs:4625-4661","code":" 4625 |     pub fn finish_resize(&mut self, direction: ResizeDirection, edge: ResizeEdge) {\n 4626 |         if let Some((old_focused, old_direction, old_edge, _, idx, output)) =\n 4627 |             self.resize_state.take()\n 4628 |             && old_direction == direction\n 4629 |             && old_edge == edge\n 4630 |         {\n 4631 |             let Some(toplevel) = old_focused.toplevel() else {\n 4632 |                 return;\n 4633 |             };\n 4634 |             let Some(mapped) = self\n 4635 |                 .workspaces\n 4636 |                 .sets\n 4637 |                 .values()\n 4638 |                 .find_map(|set| {\n 4639 |                     set.sticky_layer\n 4640 |                         .mapped()\n 4641 |                         .find(|m| m.has_surface(&toplevel, WindowSurfaceType::TOPLEVEL))\n 4642 |                 })\n 4643 |                 .cloned()\n 4644 |                 .or_else(|| {\n 4645 |                     let workspace = self.workspaces.get(idx, &output).unwrap();\n 4646 |                     workspace\n 4647 |                         .mapped()\n 4648 |                         .find(|m| m.has_surface(&toplevel, WindowSurfaceType::TOPLEVEL))\n 4649 |                         .cloned()\n 4650 |                 })\n 4651 |             else {\n 4652 |                 return;\n 4653 |             };\n 4654 | \n 4655 |             let mut resize_state = mapped.resize_state.lock().unwrap();\n 4656 |             if let Some(ResizeState::Resizing(data)) = *resize_state {\n 4657 |                 mapped.set_resizing(false);\n 4658 |                 *resize_state = Some(ResizeState::WaitingForCommit(data));\n 4659 |             }\n 4660 |         }\n 4661 |     }","lines":37,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/shell/mod.rs#L4625-L4661"},{"ref":"src/shell/mod.rs:4645","code":" 4645 |                     let workspace = self.workspaces.get(idx, &output).unwrap();","lines":1,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/shell/mod.rs#L4645"}]},
{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"While normalizing invalid `Mirroring` tags, the code looks up the mirror target's index `j` within the `Vec<OutputInfo>` key (`info`) and then indexes `config_clone[j]`, where `config_clone` is a clone of the corresponding `Vec<OutputConfig>` value. This assumes `info.len() == config.len()` for every entry in the `HashMap<Vec<OutputInfo>, Vec<OutputConfig>>`. That invariant is not checked anywhere on load; a hand-edited or corrupted `outputs.ron` with a shorter `Vec<OutputConfig>` than `Vec<OutputInfo>` (or a `j` beyond the config vector's length) causes an out-of-bounds panic while merely trying to sanitize the config.","fix":"Use `config_clone.get(j)` instead of `config_clone[j]` and treat a missing entry the same as the \"not found\" branch (reset to `Enabled`).","locations":[{"ref":"cosmic-comp-config/src/output/comp.rs:86-109","code":"   86 |                     for (info, config) in config.config.iter_mut() {\n   87 |                         let config_clone = config.clone();\n   88 |                         for conf in config.iter_mut() {\n   89 |                             if let OutputState::Mirroring(conn) = &conf.enabled {\n   90 |                                 if let Some((j, _)) = info\n   91 |                                     .iter()\n   92 |                                     .enumerate()\n   93 |                                     .find(|(_, info)| &info.connector == conn)\n   94 |                                 {\n   95 |                                     if config_clone[j].enabled != OutputState::Enabled {\n   96 |                                         warn!(\n   97 |                                             \"Invalid Mirroring tag, overriding with `Enabled` instead\"\n   98 |                                         );\n   99 |                                         conf.enabled = OutputState::Enabled;\n  100 |                                     }\n  101 |                                 } else {\n  102 |                                     warn!(\n  103 |                                         \"Invalid Mirroring tag, overriding with `Enabled` instead\"\n  104 |                                     );\n  105 |                                     conf.enabled = OutputState::Enabled;\n  106 |                                 }\n  107 |                             }\n  108 |                         }\n  109 |                     }","lines":24,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/cosmic-comp-config/src/output/comp.rs#L86-L109"}]},
{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"medium","difficulty":"hard","description":"`Spring::duration()`'s Newton's-method branch (the overdamped case) divides by the numerically estimated slope `m = (self.oscillate(x0 + DELTA) - y0) / DELTA` when computing `x1 = (self.to - y0 + m * x0) / m`. When `from == to` and `initial_velocity == 0` with overdamped parameters (`damping_ratio > 1`), `oscillate` is constant (`to`) for all `t`, so `m` is exactly `0.0`, making `x1` `NaN`. The while-loop condition `(self.to - y1).abs() > epsilon` is `false` for `NaN` comparisons, so the loop exits immediately and `Duration::from_secs_f64(x1)` is called with `NaN`, which panics (') 'seconds' must be finite). The single current call site (`WorkspaceDelta::new_gesture_end` in `src/shell/mod.rs`) always uses `damping_ratio = 1.0` (critically damped), which takes an earlier return path and avoids this branch, but the function is public API for animation springs and any future overdamped/no-op spring (e.g. a gesture where `from == to`) will crash the compositor.","fix":"Guard against `m == 0.0` before dividing (e.g. treat it as already-at-rest and return `Duration::ZERO`/`Duration::MAX` as appropriate), or special-case `from == to && initial_velocity == 0.0` at the top of `duration()`.","locations":[{"ref":"src/backend/render/animations/spring.rs:75-97","code":"   75 |         let mut y0 = self.oscillate(x0);\n   76 |         let m = (self.oscillate(x0 + DELTA) - y0) / DELTA;\n   77 | \n   78 |         let mut x1 = (self.to - y0 + m * x0) / m;\n   79 |         let mut y1 = self.oscillate(x1);\n   80 | \n   81 |         let mut i = 0;\n   82 |         while (self.to - y1).abs() > self.params.epsilon {\n   83 |             if i > 1000 {\n   84 |                 return Duration::ZERO;\n   85 |             }\n   86 | \n   87 |             x0 = x1;\n   88 |             y0 = y1;\n   89 | \n   90 |             let m = (self.oscillate(x0 + DELTA) - y0) / DELTA;\n   91 | \n   92 |             x1 = (self.to - y0 + m * x0) / m;\n   93 |             y1 = self.oscillate(x1);\n   94 |             i += 1;\n   95 |         }\n   96 | \n   97 |         Duration::from_secs_f64(x1)","lines":23,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/backend/render/animations/spring.rs#L75-L97"}]},
{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"In `CosmicStack::handle_focus`, `previous_index` (`prev_idx`) is only populated when `seat.last_modifier_change()` returns `Some`, and starts out as `None`. The `FocusDirection::Up | FocusDirection::Down` arm unconditionally calls `prev_idx.unwrap().1`, and the `Left`/`Right` arms fall back to the same `prev_idx.unwrap().1` whenever `fetch_update` fails (i.e. focus is already at the first/last tab). If a focus-direction shortcut is triggered before any modifier key transition has ever been recorded for that seat (e.g. a keybinding without a modifier, or the very first such shortcut in a session under unusual timing), `prev_idx` is still `None` and this `unwrap()` panics, crashing the compositor.","fix":"Replace the `prev_idx.unwrap().1` calls with a fallback (e.g. keep the current `active` index, or fall back to `0`) when `prev_idx` is `None`, instead of unwrapping unconditionally.","locations":[{"ref":"src/shell/element/stack.rs:311-421","code":"  311 |     pub fn handle_focus(\n  312 |         &self,\n  313 |         seat: &Seat<State>,\n  314 |         direction: FocusDirection,\n  315 |         swap: Option<NodeDesc>,\n  316 |     ) -> bool {\n  317 |         let (result, update) = self.0.with_program(|p| {\n  318 |             let last_mod_serial = seat.last_modifier_change();\n  319 |             let mut prev_idx = p.previous_index.lock().unwrap();\n  320 |             if !prev_idx.is_some_and(|(serial, _)| Some(serial) == last_mod_serial) {\n  321 |                 *prev_idx = last_mod_serial.map(|s| (s, p.active.load(Ordering::SeqCst)));\n  322 |             }\n  323 | \n  324 |             match direction {\n  325 |                 FocusDirection::Left => {\n  326 |                     if !p.group_focused.load(Ordering::SeqCst) {\n  327 |                         if let Ok(old) =\n  328 |                             p.active\n  329 |                                 .fetch_update(Ordering::SeqCst, Ordering::SeqCst, |val| {\n  330 |                                     val.checked_sub(1)\n  331 |                                 })\n  332 |                         {\n  333 |                             p.previous_keyboard.store(old, Ordering::SeqCst);\n  334 |                             p.scroll_to_focus.store(true, Ordering::SeqCst);\n  335 |                             (true, true)\n  336 |                         } else {\n  337 |                             let new = prev_idx.unwrap().1;\n  338 |                             let old = p.active.swap(new, Ordering::SeqCst);\n  339 |                             if old != new {\n  340 |                                 p.previous_keyboard.store(old, Ordering::SeqCst);\n  341 |                                 p.scroll_to_focus.store(true, Ordering::SeqCst);\n  342 |                                 (false, true)\n  343 |                             } else {\n  344 |                                 (false, false)\n  345 |                             }\n  346 |                         }\n  347 |                     } else {\n  348 |                         (false, false)\n  349 |                     }\n  350 |                 }\n  351 |                 FocusDirection::Right => {\n  352 |                     if !p.group_focused.load(Ordering::SeqCst) {\n  353 |                         let max = p.windows.lock().unwrap().len();\n  354 |                         if let Ok(old) =\n  355 |                             p.active\n  356 |                                 .fetch_update(Ordering::SeqCst, Ordering::SeqCst, |val| {\n  357 |                                     if val < max - 1 { Some(val + 1) } else { None }\n  358 |                                 })\n  359 |                         {\n  360 |                             p.previous_keyboard.store(old, Ordering::SeqCst);\n  361 |                             p.scroll_to_focus.store(true, Ordering::SeqCst);\n  362 |                             (true, true)\n  363 |                         } else {\n  364 |                             let new = prev_idx.unwrap().1;\n  365 |                             let old = p.active.swap(new, Ordering::SeqCst);\n  366 |                             if old != new {\n  367 |                                 p.previous_keyboard.store(old, Ordering::SeqCst);\n  368 |                                 p.scroll_to_focus.store(true, Ordering::SeqCst);\n  369 |                                 (false, true)\n  370 |                             } else {\n  371 |                                 (false, false)\n  372 |                             }\n  373 |                         }\n  374 |                     } else {\n  375 |                         (false, false)\n  376 |                     }\n  377 |                 }\n  378 |                 FocusDirection::Out if swap.is_none() => {\n  379 |                     if !p.group_focused.swap(true, Ordering::SeqCst) {\n  380 |                         p.windows.lock().unwrap().iter().for_each(|w| {\n  381 |                             w.set_activated(false);\n  382 |                             w.send_configure();\n  383 |                         });\n  384 |                         (true, true)\n  385 |                     } else {\n  386 |                         (false, false)\n  387 |                     }\n  388 |                 }\n  389 |                 FocusDirection::In if swap.is_none() => {\n  390 |                     if !p.group_focused.swap(false, Ordering::SeqCst) {\n  391 |                         p.windows\n  392 |                             .lock()\n  393 |                             .unwrap()\n  394 |                             .iter()\n  395 |                             .enumerate()\n  396 |                             .for_each(|(i, w)| {\n  397 |                                 w.set_activated(p.active.load(Ordering::SeqCst) == i);\n  398 |                                 w.send_configure();\n  399 |                             });\n  400 | \n  401 |                         (true, true)\n  402 |                     } else {\n  403 |                         (false, false)\n  404 |                     }\n  405 |                 }\n  406 |                 FocusDirection::Up | FocusDirection::Down => {\n  407 |                     if !p.group_focused.load(Ordering::SeqCst) {\n  408 |                         let new = prev_idx.unwrap().1;\n  409 |                         let old = p.active.swap(new, Ordering::SeqCst);\n  410 |                         if old != new {\n  411 |                             p.previous_keyboard.store(old, Ordering::SeqCst);\n  412 |                             p.scroll_to_focus.store(true, Ordering::SeqCst);\n  413 |                         }\n  414 |                         (false, true)\n  415 |                     } else {\n  416 |                         (false, false)\n  417 |                     }\n  418 |                 }\n  419 |                 _ => (false, false),\n  420 |             }\n  421 |         });","lines":111,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/shell/element/stack.rs#L311-L421"}]},
{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"medium","difficulty":"hard","description":"`render_new_tree` calls `swap_desc.unwrap()` twice while building the iterator chain, guarded only\nby `swap_tree.into_iter()` being non-empty (i.e. `swap_tree: Option<&Tree<Data>>` being `Some`).\n`swap_tree` and `swap_desc` are threaded in from two independent sources in the caller\n(`render_new_tree_windows`/`render_new_tree_popups`): `swap_tree` comes from\n`overview.1` (`Option<(SwapIndicator, Option<&Tree<Data>>)>`), while `swap_desc` comes from\n`overview.0.trigger()` matching `Trigger::KeyboardSwap`. Nothing in this file enforces that these\ntwo are always set together; if a caller ever constructs `overview` with `overview.1 = Some((_, Some(tree)))`\nwhile `overview.0`'s trigger is not `Trigger::KeyboardSwap` (e.g. a pointer-driven swap indicator,\nor a future code path), `swap_desc` is `None` and both `.unwrap()` calls panic.","fix":"Make the local invariant explicit instead of relying on an implicit cross-module pairing: zip\n`swap_tree` with `swap_desc` up front (e.g. `let swap_ctx = swap_tree.zip(swap_desc);`) and only\nenter the branch when both are present, so a mismatch degrades to \"no swap subtree rendered\" instead\nof panicking.","locations":[{"ref":"src/shell/layout/tiling/mod.rs:5793-5809","code":" 5793 |         .chain(\n 5794 |             swap_tree\n 5795 |                 .into_iter()\n 5796 |                 .flat_map(|tree| {\n 5797 |                     let sub_root = &swap_desc.unwrap().node;\n 5798 |                     if swap_desc.unwrap().stack_window.is_none() {\n 5799 |                         Some(\n 5800 |                             tree.traverse_pre_order_ids(sub_root)\n 5801 |                                 .unwrap()\n 5802 |                                 .map(move |id| (tree, id)),\n 5803 |                         )\n 5804 |                     } else {\n 5805 |                         None\n 5806 |                     }\n 5807 |                 })\n 5808 |                 .flatten(),\n 5809 |         )","lines":17,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/shell/layout/tiling/mod.rs#L5793-L5809"}]},
{"id":"PANIC_14","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`scale_cursor` computes `let image_scale = (image.size / cursor_size).max(1);` before clamping, so if `cursor_size` is `0` this is an integer division by zero and panics. `cursor_size` comes from `load_cursor_env()` (`src/backend/render/cursor.rs`), which parses the `XCURSOR_SIZE` environment variable with `.and_then(|s| s.parse().ok())` and accepts any valid `u32`, including `0`. `reload_cursor` (called on every Xwayland start and every scale/DPI update) passes this value straight into `scale_cursor` with no validation, so setting `XCURSOR_SIZE=0` in the environment crashes the compositor as soon as Xwayland starts or the display scale changes.","fix":"Clamp `cursor_size` to at least 1 before using it, e.g. `let cursor_size = cursor_size.max(1);` at the top of `scale_cursor`, or validate/clamp it once in `load_cursor_env`.","locations":[{"ref":"src/xwayland.rs:198-214","code":"  198 | fn scale_cursor(\n  199 |     scale: f64,\n  200 |     cursor_size: u32,\n  201 |     image: &Image,\n  202 | ) -> Result<(Vec<u8>, Size<u16, Logical>, Point<u16, Logical>), PixmanError> {\n  203 |     let mut renderer = PixmanRenderer::new()?;\n  204 |     let image_scale = (image.size / cursor_size).max(1);\n  205 |     let pixel_size = (cursor_size as f64 * scale).round() as i32;\n  206 |     let buffer_size = Size::<i32, BufferCoords>::from((pixel_size, pixel_size));\n  207 |     let output_size = buffer_size.to_logical(1, Transform::Normal).to_physical(1);\n  208 | \n  209 |     let image_buffer = MemoryRenderBuffer::from_slice(\n  210 |         &image.pixels_rgba,\n  211 |         Fourcc::Abgr8888,\n  212 |         (image.width as i32, image.height as i32),\n  213 |         image_scale as i32,\n  214 |         Transform::Normal,","lines":17,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/xwayland.rs#L198-L214"}]},
{"id":"PANIC_15","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`Timings::new` uses `assert_eq!(interval.as_secs(), 0)` and `NonZeroU64::new(interval.subsec_nanos().into()).unwrap()` for both `refresh_interval` and `min_interval` when they are `Some(..)`. Any interval of one second or more panics the assert, and any interval whose `subsec_nanos()` is exactly `0` (e.g. `Duration::ZERO`, or a whole-second interval) panics the `unwrap`. The only current call site passes `Timings::new(None, None, false, target_node)`, so this is currently dead/unreachable, but it is a public-ish constructor with no graceful handling, unlike `set_refresh_interval`/`set_min_refresh_interval` right below it, which use `.and_then(NonZeroU64::new)` and degrade to `None` instead of panicking.","fix":"Make `Timings::new` degrade the same way `set_refresh_interval`/`set_min_refresh_interval` do (`.and_then(NonZeroU64::new)`) instead of asserting/unwrapping, so passing an out-of-range interval can't crash the surface thread.","locations":[{"ref":"src/backend/kms/surface/timings.rs:56-74","code":"   56 |     pub fn new(\n   57 |         refresh_interval: Option<Duration>,\n   58 |         min_interval: Option<Duration>,\n   59 |         vrr: bool,\n   60 |         node: DrmNode,\n   61 |     ) -> Self {\n   62 |         let refresh_interval_ns = if let Some(interval) = &refresh_interval {\n   63 |             assert_eq!(interval.as_secs(), 0);\n   64 |             Some(NonZeroU64::new(interval.subsec_nanos().into()).unwrap())\n   65 |         } else {\n   66 |             None\n   67 |         };\n   68 | \n   69 |         let min_refresh_interval_ns = if let Some(interval) = &min_interval {\n   70 |             assert_eq!(interval.as_secs(), 0);\n   71 |             Some(NonZeroU64::new(interval.subsec_nanos().into()).unwrap())\n   72 |         } else {\n   73 |             None\n   74 |         };","lines":19,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/backend/kms/surface/timings.rs#L56-L74"}]},
{"id":"PANIC_16","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`Config::load_numlock` and `Config::load_filter_state` check `path.exists()` and then unconditionally `.unwrap()` the subsequent `OpenOptions::new().read(true).open(path)`. Between the existence check and the open call the file can be removed by another process (or by a previous failed run of this same function racing itself), turning what is designed to be a resettable, best-effort state file into a hard panic.","fix":"Replace the `.exists()` + `.unwrap()` pattern with a single `File::open(path)` call whose `Err` (including `NotFound`) is handled the same way the deserialize error already is (log and fall back to default), removing the TOCTOU window entirely.","locations":[{"ref":"src/config/mod.rs:359-375","code":"  359 |     fn load_numlock(path: &Option<PathBuf>) -> NumlockStateConfig {\n  360 |         path.as_deref()\n  361 |             .filter(|path| path.exists())\n  362 |             .and_then(|path| {\n  363 |                 ron::de::from_reader::<_, NumlockStateConfig>(\n  364 |                     OpenOptions::new().read(true).open(path).unwrap(),\n  365 |                 )\n  366 |                 .map_err(|err| {\n  367 |                     warn!(?err, \"Failed to read numlock.ron, resetting..\");\n  368 |                     if let Err(err) = std::fs::remove_file(path) {\n  369 |                         error!(?err, \"Failed to remove numlock.ron.\");\n  370 |                     }\n  371 |                 })\n  372 |                 .ok()\n  373 |             })\n  374 |             .unwrap_or_default()\n  375 |     }","lines":17,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/config/mod.rs#L359-L375"},{"ref":"src/config/mod.rs:377-398","code":"  377 |     fn load_filter_state(path: &Option<PathBuf>) -> ScreenFilter {\n  378 |         if let Some(path) = path.as_ref()\n  379 |             && path.exists()\n  380 |         {\n  381 |             match ron::de::from_reader::<_, ScreenFilter>(\n  382 |                 OpenOptions::new().read(true).open(path).unwrap(),\n  383 |             ) {\n  384 |                 Ok(config) => return config,\n  385 |                 Err(err) => {\n  386 |                     warn!(?err, \"Failed to read screen_filter state, resetting..\");\n  387 |                     if let Err(err) = std::fs::remove_file(path) {\n  388 |                         error!(?err, \"Failed to remove screen_filter state.\");\n  389 |                     }\n  390 |                 }\n  391 |             };\n  392 |         }\n  393 | \n  394 |         ScreenFilter {\n  395 |             inverted: false,\n  396 |             color_filter: None,\n  397 |         }\n  398 |     }","lines":22,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/config/mod.rs#L377-L398"}]},
{"id":"PANIC_17","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`DeviceIdentifier::matches` reads vendor/device IDs from sysfs (`/sys/dev/char/{major}:{minor}/device/vendor` and `.../device`) and slices the result with `ven[2..]` / `dev[2..]` to strip an assumed `0x` prefix, without checking the string length first. Unlike `try_parse_dev_from_str` (which checks `val.starts_with(\"0x\")` before doing the equivalent slice on user-supplied env var text), this code path has no such guard on the file contents. If the sysfs file is empty, shorter than 2 bytes, or doesn't start with `0x` for any reason, `ven[2..]` panics with a byte-index-out-of-bounds error, crashing the compositor instead of just failing the match.","fix":"Check the string length/prefix before slicing, e.g. `ven.strip_prefix(\"0x\").and_then(|v| u32::from_str_radix(v.trim(), 16).ok())`, mirroring the guard already used in `try_parse_dev_from_str`.","locations":[{"ref":"src/utils/env.rs:22-38","code":"   22 |                 let (major, minor) = (dev_node.major(), dev_node.minor());\n   23 |                 let Some(dev_vendor) = std::fs::read_to_string(format!(\n   24 |                     \"/sys/dev/char/{}:{}/device/vendor\",\n   25 |                     major, minor\n   26 |                 ))\n   27 |                 .ok()\n   28 |                 .and_then(|ven| u32::from_str_radix(ven[2..].trim(), 16).ok()) else {\n   29 |                     return false;\n   30 |                 };\n   31 |                 let Some(dev_device) = std::fs::read_to_string(format!(\n   32 |                     \"/sys/dev/char/{}:{}/device/device\",\n   33 |                     major, minor\n   34 |                 ))\n   35 |                 .ok()\n   36 |                 .and_then(|dev| u32::from_str_radix(dev[2..].trim(), 16).ok()) else {\n   37 |                     return false;\n   38 |                 };","lines":17,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/utils/env.rs#L22-L38"}]},
{"id":"PANIC_18","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`assert_eq!(buffer.stride(), (buffer_size.w * 4) as usize);` is a hard, always-on assertion (not `debug_assert!`) inside `scale_cursor`. Every other failure mode in this function is handled gracefully via `Result`/`?` and the caller (`reload_cursor`) already has a fallback path for `Err` (falling back to the unscaled cursor image), but a stride mismatch from the Pixman renderer - e.g. due to a future alignment/padding change - takes down the whole compositor via panic instead of returning an error through the existing `Result<_, PixmanError>` plumbing.","fix":"Replace the `assert_eq!` with a proper error return, e.g. `if buffer.stride() != (buffer_size.w * 4) as usize { return Err(...); }`, so a stride mismatch degrades to the existing cursor fallback instead of crashing.","locations":[{"ref":"src/xwayland.rs:241","code":"  241 |     assert_eq!(buffer.stride(), (buffer_size.w * 4) as usize);","lines":1,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/xwayland.rs#L241"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"hard","description":"`calculate_refresh_rate` divides by `htotal` and `vtotal` (`mode.hsync().2` / `mode.vsync().2`) without any zero check, unlike the nearby `calculate_scale`, which has an explicit comment about being \"really careful\" not to divide by zero for EDID-derived values. A degenerate/corrupted mode timing (bad EDID, buggy driver) with `htotal == 0` or `vtotal == 0` triggers an integer division-by-zero panic. Even if the division doesn't panic but rounds to a refresh rate of `0`, `Surface::resume` computes `Duration::from_secs_f64(1_000. / calculate_refresh_rate(mode) as f64)`, and `1000./0.0` is `inf`; `Duration::from_secs_f64` panics on non-finite input, crashing the surface thread on resume.","fix":"Guard against zero totals in `calculate_refresh_rate` (return `None`/an error, or clamp to a minimum), and have `resume()` fall back to a sane default interval when the computed refresh rate is zero instead of feeding it straight into `Duration::from_secs_f64`.","locations":[{"ref":"src/backend/kms/drm_helpers.rs:259-276","code":"  259 | pub fn calculate_refresh_rate(mode: Mode) -> u32 {\n  260 |     let htotal = mode.hsync().2 as u32;\n  261 |     let vtotal = mode.vsync().2 as u32;\n  262 |     let mut refresh =\n  263 |         (mode.clock() as u64 * 1000000_u64 / htotal as u64 + vtotal as u64 / 2) / vtotal as u64;\n  264 | \n  265 |     if mode.flags().contains(ModeFlags::INTERLACE) {\n  266 |         refresh *= 2;\n  267 |     }\n  268 |     if mode.flags().contains(ModeFlags::DBLSCAN) {\n  269 |         refresh /= 2;\n  270 |     }\n  271 |     if mode.vscan() > 1 {\n  272 |         refresh /= mode.vscan() as u64;\n  273 |     }\n  274 | \n  275 |     refresh as u32\n  276 | }","lines":18,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/backend/kms/drm_helpers.rs#L259-L276"},{"ref":"src/backend/kms/surface/mod.rs:703-705","code":"  703 |         let interval =\n  704 |             Duration::from_secs_f64(1_000. / drm_helpers::calculate_refresh_rate(mode) as f64);\n  705 |         self.timings.set_refresh_interval(Some(interval));","lines":3,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/backend/kms/surface/mod.rs#L703-L705"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"When computing the rescale for an animating fullscreen surface, the scale factor is derived by dividing by the surface's own geometry size: `target_geo.size.w as f64 / fullscreen_geo.size.w as f64` (and `.h`). `fullscreen_geo` comes directly from `fullscreen.surface.0.geometry()`, which can legitimately be `0x0` for a surface that has just been made fullscreen but has not yet committed a buffer/geometry matching the request (or a client that briefly reports a zero-sized geometry). In that case the division yields `NaN` or `Infinity`, which is then fed into `RescaleRenderElement::from_element`, producing an undefined/broken render transform for that frame.","fix":"Guard against a zero-sized `fullscreen_geo` before dividing, e.g. skip the rescale (fall back to `Scale { x: 1.0, y: 1.0 }` or skip animation for that frame) when `fullscreen_geo.size.w == 0 || fullscreen_geo.size.h == 0`.","locations":[{"ref":"src/shell/workspace.rs:1689-1693","code":" 1689 |                 let fullscreen_geo = fullscreen.surface.0.geometry();\n 1690 |                 let scale = Scale {\n 1691 |                     x: target_geo.size.w as f64 / fullscreen_geo.size.w as f64,\n 1692 |                     y: target_geo.size.h as f64 / fullscreen_geo.size.h as f64,\n 1693 |                 };","lines":5,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/shell/workspace.rs#L1689-L1693"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`position.x.abs()` / `position.y.abs()` are called on an `i32` that comes directly from a client's `set_position` request on the wlr-output-management / cosmic output-configuration protocol (see `src/wayland/protocols/output_configuration/handlers/wlr.rs:427`, `pending.position = Some(Point::from((x, y)))` with no range validation). If a client sends `i32::MIN` for either coordinate, `i32::MIN.abs()` overflows: in a debug build (default `overflow-checks = true`) this panics and takes down the whole compositor for all clients; in a release build it silently wraps back to `i32::MIN`, so `offset.0.max(position.x.abs())` fails to compute a positive correction, and the later `current_config.position = (position.x as u32, position.y as u32)` cast turns the still-negative value into a huge, essentially garbage `u32` output position instead of the intended sanitized non-negative value.","fix":"Use `position.x.unsigned_abs()` / `saturating_abs()` (or clamp with `position.x.checked_abs().unwrap_or(i32::MAX)`) instead of the panicking `.abs()`, e.g.:\n```rust\nif position.x.is_negative() {\n    offset.0 = offset.0.max(position.x.unsigned_abs() as i32);\n}\n```\nAlso consider validating/clamping `position` at the point it's parsed from the protocol request in `wlr.rs`/`cosmic.rs` before it ever reaches this handler.","locations":[{"ref":"src/wayland/handlers/output_configuration.rs:63-67","code":"   63 |                     if position.x.is_negative() {\n   64 |                         offset.0 = offset.0.max(position.x.abs());\n   65 |                     }\n   66 |                     if position.y.is_negative() {\n   67 |                         offset.1 = offset.1.max(position.y.abs());","lines":5,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/wayland/handlers/output_configuration.rs#L63-L67"},{"ref":"src/wayland/handlers/output_configuration.rs:137-139","code":"  137 |                     if let Some(position) = position {\n  138 |                         current_config.position = (position.x as u32, position.y as u32);\n  139 |                     }","lines":3,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/wayland/handlers/output_configuration.rs#L137-L139"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`Data::add_window` computes the new child's size as `new_size = last_length - used_size` where\n`used_size` is the sum of the *rounded* rescaled sibling sizes. Because each sibling size is\nindependently rounded to the nearest integer, `used_size` can overshoot `remainder` by up to\n~0.5px per sibling; with enough siblings in a group this can push `used_size` above `last_length`,\nmaking `new_size` negative, i.e. a newly inserted window gets a negative tile size inserted into\n`sizes`. `Data::remove_window` (same file, lines 255-282) and `Data::update_geometry`\n(lines 292-326) have the complementary issue: they divide by `remaining_size`/`previous_length`\nwithout checking for zero, so a group whose accumulated size has degenerated to 0 (e.g. after\nrepeated resizes/removals driving a sibling to a 0-length tile) produces `0.0/0.0 = NaN`, which\nRust's `as i32` cast silently truncates to `0` rather than panicking - masking the invalid state\ninstead of surfacing it, and leaving the tile permanently zero-sized.","fix":"Clamp `new_size` in `add_window` to a sane minimum (e.g. `.max(1)`) and compensate by shrinking the\nlargest existing sibling instead of the rounding remainder; guard the divisions in `remove_window`/\n`update_geometry` against `remaining_size == 0` / `previous_length == 0` by falling back to an even\nsplit instead of dividing.","locations":[{"ref":"src/shell/layout/tiling/mod.rs:219-244","code":"  219 |     fn add_window(&mut self, idx: usize) {\n  220 |         match self {\n  221 |             Data::Group {\n  222 |                 sizes,\n  223 |                 last_geometry,\n  224 |                 orientation,\n  225 |                 ..\n  226 |             } => {\n  227 |                 let last_length = match orientation {\n  228 |                     Orientation::Horizontal => last_geometry.size.h,\n  229 |                     Orientation::Vertical => last_geometry.size.w,\n  230 |                 };\n  231 |                 let equal_sizing = last_length / (sizes.len() as i32 + 1); // new window size\n  232 |                 let remainder = last_length - equal_sizing; // size for the rest of the windowns\n  233 | \n  234 |                 for size in sizes.iter_mut() {\n  235 |                     *size = ((*size as f64 / last_length as f64) * remainder as f64).round() as i32;\n  236 |                 }\n  237 |                 let used_size: i32 = sizes.iter().sum();\n  238 |                 let new_size = last_length - used_size;\n  239 | \n  240 |                 sizes.insert(idx, new_size);\n  241 |             }\n  242 |             _ => panic!(\"Adding window to leaf?\"),\n  243 |         }\n  244 |     }","lines":26,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/shell/layout/tiling/mod.rs#L219-L244"},{"ref":"src/shell/layout/tiling/mod.rs:255-282","code":"  255 |     fn remove_window(&mut self, idx: usize) {\n  256 |         match self {\n  257 |             Data::Group {\n  258 |                 sizes,\n  259 |                 last_geometry,\n  260 |                 orientation,\n  261 |                 ..\n  262 |             } => {\n  263 |                 let last_length = match orientation {\n  264 |                     Orientation::Horizontal => last_geometry.size.h,\n  265 |                     Orientation::Vertical => last_geometry.size.w,\n  266 |                 };\n  267 |                 let old_size = sizes.remove(idx);\n  268 |                 let remaining_size: i32 = sizes.iter().sum();\n  269 | \n  270 |                 for size in sizes.iter_mut() {\n  271 |                     *size +=\n  272 |                         ((*size as f64 / remaining_size as f64) * old_size as f64).round() as i32;\n  273 |                 }\n  274 |                 let used_size: i32 = sizes.iter().sum();\n  275 |                 let overflow = last_length - used_size;\n  276 |                 if overflow != 0 {\n  277 |                     *sizes.last_mut().unwrap() += overflow;\n  278 |                 }\n  279 |             }\n  280 |             _ => panic!(\"Added window to leaf?\"),\n  281 |         }\n  282 |     }","lines":28,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/shell/layout/tiling/mod.rs#L255-L282"},{"ref":"src/shell/layout/tiling/mod.rs:292-326","code":"  292 |     fn update_geometry(&mut self, geo: Rectangle<i32, Local>) {\n  293 |         match self {\n  294 |             Data::Group {\n  295 |                 orientation,\n  296 |                 sizes,\n  297 |                 last_geometry,\n  298 |                 ..\n  299 |             } => {\n  300 |                 let previous_length = match orientation {\n  301 |                     Orientation::Horizontal => last_geometry.size.h,\n  302 |                     Orientation::Vertical => last_geometry.size.w,\n  303 |                 };\n  304 |                 let new_length = match orientation {\n  305 |                     Orientation::Horizontal => geo.size.h,\n  306 |                     Orientation::Vertical => geo.size.w,\n  307 |                 };\n  308 | \n  309 |                 sizes.iter_mut().for_each(|len| {\n  310 |                     *len = (((*len as f64) / (previous_length as f64)) * (new_length as f64))\n  311 |                         .round() as i32;\n  312 |                 });\n  313 |                 let sum: i32 = sizes.iter().sum();\n  314 | \n  315 |                 // fix rounding issues\n  316 |                 if sum != new_length {\n  317 |                     let diff = new_length - sum;\n  318 |                     *sizes.last_mut().unwrap() += diff;\n  319 |                 }\n  320 |                 *last_geometry = geo;\n  321 |             }\n  322 |             Data::Mapped { last_geometry, .. } | Data::Placeholder { last_geometry, .. } => {\n  323 |                 *last_geometry = geo;\n  324 |             }\n  325 |         }\n  326 |     }","lines":35,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/shell/layout/tiling/mod.rs#L292-L326"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`WorkspaceSet::add_empty_workspace` and `WorkspaceSet::update_workspace_idxs` compute the 1-based workspace index as `self.workspaces.len() as u8 + 1` / `i as u8 + 1` and pass it to `workspace_set_idx`. If a workspace set ever reaches 255 workspaces, `255u8 + 1` overflows: this panics in debug builds (`attempt to add with overflow`) and silently wraps to `0` in release builds, producing a wrong/duplicate workspace coordinate/name sent over the `zcosmic_workspace_handle_v2` protocol. Dynamic-workspace mode can in principle grow the workspace count without an explicit user-facing limit, so this is a real (if unlikely-to-be-hit) truncation bug rather than a purely theoretical one.","fix":"Use `u32` (matching `set_workspace_coordinates`'s `&[idx as u32]`) instead of `u8` for the intermediate index computation, e.g. `self.workspaces.len() as u32 + 1`, removing the narrowing cast and its overflow risk.","locations":[{"ref":"src/shell/mod.rs:622-640","code":"  622 |     fn add_empty_workspace(&mut self, state: &mut WorkspaceUpdateGuard<State>) {\n  623 |         let workspace = create_workspace(\n  624 |             state,\n  625 |             &self.output,\n  626 |             &self.group,\n  627 |             false,\n  628 |             self.tiling_enabled,\n  629 |             self.theme.clone(),\n  630 |             self.appearance,\n  631 |         );\n  632 |         workspace_set_idx(\n  633 |             state,\n  634 |             self.workspaces.len() as u8 + 1,\n  635 |             &workspace.handle,\n  636 |             workspace.name.as_deref(),\n  637 |             // this method is only used by code paths related to dynamic workspaces, so this should be fine\n  638 |         );\n  639 |         self.workspaces.push(workspace);\n  640 |     }","lines":19,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/shell/mod.rs#L622-L640"},{"ref":"src/shell/mod.rs:696-705","code":"  696 |     fn update_workspace_idxs(&self, state: &mut WorkspaceUpdateGuard<'_, State>) {\n  697 |         for (i, workspace) in self.workspaces.iter().enumerate() {\n  698 |             workspace_set_idx(\n  699 |                 state,\n  700 |                 i as u8 + 1,\n  701 |                 &workspace.handle,\n  702 |                 workspace.name.as_deref(),\n  703 |             );\n  704 |         }\n  705 |     }","lines":10,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/shell/mod.rs#L696-L705"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`calculate_scale` computes the physical screen diagonal with `(w_in.powf(2.) * h_in.powf(2.)).sqrt()`, which algebraically equals `w_in * h_in` (the screen area), not the diagonal `sqrt(w_in^2 + h_in^2)`. The subsequent branching (`diag < 20` = laptop, `diag >= 40 && h_in >= 19` = TV) is documented and tested against a true diagonal-in-inches value, but the buggy formula returns a value that grows roughly with area and is almost always far larger than the true diagonal for any panel bigger than a few inches. In practice this makes the `diag < 20` \"likely laptop\" branch effectively unreachable for any non-eDP/LVDS/DSI interface (e.g. small external monitors connected via HDMI/DP never take the laptop-DPI-stepping path), silently changing the scale heuristic. The unit tests still pass only because they either use an eDP/LVDS interface (which short-circuits the check via `interface == EmbeddedDisplayPort`) or use panel sizes large enough that both the correct and buggy diagonal cross the same 40in threshold.","fix":"Use the Pythagorean sum, not the product: `let diag = (w_in.powf(2.) + h_in.powf(2.)).sqrt();`","locations":[{"ref":"src/backend/kms/device.rs:1339","code":" 1339 |     let diag = (w_in.powf(2.) * h_in.powf(2.)).sqrt();","lines":1,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/backend/kms/device.rs#L1339"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"When a background (non-active) tab of a `CosmicStack` is removed while positioned before the currently active tab's index, `active` is not decremented to compensate for the leftward shift of `Vec::remove`. `remove_window`/`remove_idx` only clamp `active` with `fetch_min(windows.len() - 1, ...)`, which is a no-op unless `active` was pointing past the new end. Concretely: if tab 0 is closed while tab 2 is active, `windows.remove(0)` shifts what used to be tab 3 into slot 2, but `p.active` stays at 2 - so the stack silently starts showing/focusing a different window than the one the user was actually looking at, without any user action to switch tabs. The same root cause exists in `SpaceElement::refresh`, which clones the currently-active window, prunes dead windows with `windows.retain(IsAlive::alive)`, and then only clamps `p.active` if it now exceeds the new length instead of re-locating the previously-active window inside the retained vector - so if any dead tab earlier in the list is pruned, `active` again silently points at the wrong (but in-bounds) window.","fix":"When removing at `idx`, decrement `active` if `idx < active` instead of only clamping: e.g. `if idx < p.active.load(Ordering::SeqCst) { p.active.fetch_sub(1, Ordering::SeqCst); } else { p.active.fetch_min(windows.len() - 1, Ordering::SeqCst); }`. In `refresh`, after `windows.retain(...)`, re-locate the previously active window by identity (`windows.iter().position(|w| w == &active)`) instead of only clamping the numeric index.","locations":[{"ref":"src/shell/element/stack.rs:241-271","code":"  241 |     pub fn remove_window(&self, window: &CosmicSurface) {\n  242 |         self.0.with_program(|p| {\n  243 |             let mut windows = p.windows.lock().unwrap();\n  244 |             if windows.len() == 1 {\n  245 |                 p.override_alive.store(false, Ordering::SeqCst);\n  24
