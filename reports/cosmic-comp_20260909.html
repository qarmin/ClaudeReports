{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"hard","description":"DelayGrab defers starting a real pointer/touch grab until the cursor/finger has moved past a\ndistance threshold: on `motion()` it takes `grab_factory` and schedules an idle callback\n(`event_loop_handle.insert_idle`) that later calls `set_grab(...)` to install the real grab.\nMeanwhile `button()`/`up()`/`cancel()` end the *current* DelayGrab via `handle.unset_grab(...)`\nas soon as all buttons are released (or the touch point is lifted/cancelled), but `unset()` is a\nno-op (`fn unset(&mut self, _data: &mut State) {}`) and does nothing to cancel the already\nscheduled idle closure. If the button-release (or touch up/cancel) event is processed in the same\nevent-loop iteration as the motion event that crossed the threshold - a realistic scenario, e.g. a\nfast click-drag-release - the idle callback still runs afterwards and unconditionally calls\n`seat.get_pointer().unwrap().set_grab(...)` / `seat.get_touch().unwrap().set_grab(...)`,\ninstalling a real move/resize grab even though the input that was supposed to drive it has\nalready ended. Because the new grab only terminates on a future button-release/touch-up, this\nleaves a \"stuck\" grab that keeps following the pointer until the next click.","fix":"Share a cancellation flag between `DelayGrab` and the scheduled idle closure, e.g.:\n```rust\nlet cancelled = Rc::new(Cell::new(false));\n// stash `cancelled.clone()` in DelayGrab and check it before calling `factory`\ndata.common.event_loop_handle.insert_idle(move |data| {\n    if cancelled.get() { return; }\n    if let Some((grab, focus)) = factory(data) {\n        seat.get_pointer().unwrap().set_grab(data, grab, serial, focus);\n    }\n});\n```\nand set `cancelled.set(true)` from `DelayGrab::unset()` (called by `handle.unset_grab(...)` in\n`button()`/`up()`/`cancel()`) so the idle callback becomes a no-op once the underlying input has\nalready ended.","locations":[{"ref":"src/shell/grabs/delay.rs:73-96","code":"   73 |     fn motion(\n   74 |         &mut self,\n   75 |         data: &mut State,\n   76 |         handle: &mut PointerInnerHandle<'_, State>,\n   77 |         focus: Option<(<State as SeatHandler>::PointerFocus, Point<f64, Logical>)>,\n   78 |         event: &PointerMotionEvent,\n   79 |     ) {\n   80 |         handle.motion(data, focus, event);\n   81 | \n   82 |         let distance = self.start_data.distance(event.location);\n   83 |         if distance >= 1.\n   84 |             && let Some(factory) = self.grab_factory.take()\n   85 |         {\n   86 |             let serial = self.serial.unwrap_or(event.serial);\n   87 |             let seat = self.seat.clone();\n   88 |             data.common.event_loop_handle.insert_idle(move |data| {\n   89 |                 if let Some((grab, focus)) = factory(data) {\n   90 |                     seat.get_pointer()\n   91 |                         .unwrap()\n   92 |                         .set_grab(data, grab, serial, focus);\n   93 |                 }\n   94 |             });\n   95 |         }\n   96 |     }","lines":24,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/shell/grabs/delay.rs#L73-L96"},{"ref":"src/shell/grabs/delay.rs:212","code":"  212 |     fn unset(&mut self, _data: &mut State) {}","lines":1,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/shell/grabs/delay.rs#L212"},{"ref":"src/shell/grabs/delay.rs:239-260","code":"  239 |     fn motion(\n  240 |         &mut self,\n  241 |         data: &mut State,\n  242 |         handle: &mut TouchInnerHandle<'_, State>,\n  243 |         focus: Option<(<State as SeatHandler>::TouchFocus, Point<f64, Logical>)>,\n  244 |         event: &TouchMotionEvent,\n  245 |     ) {\n  246 |         handle.motion(data, focus, event);\n  247 | \n  248 |         let distance = self.start_data.distance(event.location);\n  2 {"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `push_render_elements_from_surface_tree`, for a given surface the window's own `WaylandSurfaceRenderElement` is routed to `push_above`/`push_below` based on `passed_main` *before* `passed_main` is set to `true` for `main_surface`, but the surface's own `BlurElement` is routed *after* `passed_main` has just been flipped to `true`. So for the main surface itself, the window content goes into `push_above` while its own blur backdrop goes into `push_below` - the two visually-paired elements end up split across the two output buckets. This function is called with a real `Some(push_below)` from `CosmicSurface::push_render_elements` (used for window rendering with frosted/blur enabled), so the window's blur backdrop can be misordered relative to its own content.","fix":"Compute whether the current surface `is_main` once, and use the *same* `passed_main` value (captured before updating it) for both the surface element and its associated blur element, e.g. evaluate `let use_below = passed_main;` before pushing the surface element, then reuse `use_below` for the blur element instead of re-reading `passed_main` after it was updated.","locations":[{"ref":"src/backend/render/wayland/mod.rs:72-141","code":"   72 |         |surface, states, location| {\n   73 |             let mut location = *location;\n   74 |             let kind = kind.eval(states);\n   75 |             let data = states.data_map.get::<RendererSurfaceStateUserData>();\n   76 |             let mut blur = Ok(None);\n   77 | \n   78 |             if let Some(data) = data {\n   79 |                 let has_view = if let Some(view) = data.lock().unwrap().view() {\n   80 |                     location += view.offset.to_f64().to_physical(scale);\n   81 | \n   82 |                     true\n   83 |                 } else {\n   84 |                     false\n   85 |                 };\n   86 | \n   87 |                 if has_view {\n   88 |                     match WaylandSurfaceRenderElement::from_surface(\n   89 |                         renderer, surface, states, location, alpha, kind,\n   90 |                     ) {\n   91 |                         Ok(Some(surface)) => {\n   92 |                             let blur_geo = blur_geometry.unwrap_or(geometry);\n   93 |                             blur = BlurElement::from_surface(\n   94 |                                 renderer,\n   95 |                                 states,\n   96 |                                 blur_geo,\n   97 |                                 scale.x,\n   98 |                                 radii,\n   99 |                                 blur_strength,\n  100 |                             );\n  101 |                             let elem: SurfaceRenderElement<R> = if radii.iter().any(|r| *r != 0)\n  102 |                                 && should_clip\n  103 |                                 && ClippedSurfaceRenderElement::will_clip(\n  104 |                                     &surface, scale, geometry, radii,\n  105 |                                 ) {\n  106 |                                 ClippedSurfaceRenderElement::new(\n  107 |                                     renderer, surface, scale, geometry, radii,\n  108 |                                 )\n  109 |                                 .into()\n  110 |                             } else {\n  111 |                                 surface.into()\n  112 |                             };\n  113 |                             if let Some(push_below) = push_below.as_mut()\n  114 |                                 && passed_main\n  115 |                             {\n  116 |                                 push_below(elem);\n  117 |                             } else {\n  118 |                                 push_above(elem);\n  119 |                             }\n  120 |                         }\n  121 |                         Ok(None) => {} // surface is not mapped\n  122 |                         Err(err) => {\n  123 |                             warn!(\"Failed to import surface: {}\", err);\n  124 |                         }\n  125 |                     };\n  126 |                 }\n  127 |             }\n  128 | \n  129 |             if surface == main_surface {\n  130 |                 passed_main = true;\n  131 |             }\n  132 | \n  133 |             if let Ok(Some(elem)) = blur {\n  134 |                 if let Some(push_below) = push_below.as_mut()\n  135 |                     && passed_main\n  136 |                 {\n  137 |                     push_below(elem.into());\n  138 |                 } else {\n  139 |                     push_above(elem.into());\n  140 |                 }\n  141 |             }","lines":70,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/backend/render/wayland/mod.rs#L72-L141"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`InputEvent::TouchUp` explicitly checks whether the active overview-mode trigger is `Trigger::Touch(slot)` for the terminating slot and clears overview mode (lines 1391-1397). `InputEvent::TouchCancel`, which represents the abnormal/interrupted counterpart of TouchUp (touch sequence aborted by the compositor/driver, e.g. due to a gesture takeover), performs no such cleanup. If a touch-driven overview-mode gesture is cancelled instead of ending normally, `shell.overview_mode`'s active trigger keeps referencing a slot that will never send TouchUp, leaving the compositor stuck in overview mode until some unrelated logic clears it.","fix":"Mirror the TouchUp cleanup in the TouchCancel handler: if `shell.overview_mode().0.active_trigger()` is `Trigger::Touch(slot)` matching `event.slot()`, call `shell.set_overview_mode(None, ...)` there as well.","locations":[{"ref":"src/input/mod.rs:1531-1537","code":" 1531 |             InputEvent::TouchUp { event, .. } => {\n 1532 |                 let mut shell = self.common.shell.write();\n 1533 |                 if let Some(Trigger::Touch(slot)) = shell.overview_mode().0.active_trigger()\n 1534 |                     && *slot == event.slot()\n 1535 |                 {\n 1536 |                     shell.set_overview_mode(None, self.common.event_loop_handle.clone());\n 1537 |                 }","lines":7,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/input/mod.rs#L1531-L1537"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"hard","description":"In `Tabs::layout`, when the flex-fit check fails (`(size.width / (element_count as f32 - 5.)).ceil() < MIN_ACTIVE_TAB_WIDTH`), the code falls into a 'manual approach' branch that computes `min_width = (size.width - MIN_ACTIVE_TAB_WIDTH as f32 - 4.) / (element_count as f32 - 6.)`. `element_count` is `tabs.len() + 5`, and a `CosmicStack` can legitimately have exactly one tab (`CosmicStack::new(std::iter::once(surface), ...)` is used e.g. in shell/element/mod.rs:546), making `element_count == 6` and the divisor `element_count as f32 - 6.` exactly `0.0`. Since the branch is only reached when `size.width < MIN_ACTIVE_TAB_WIDTH` (140px), a single-tab stack narrower than 140 logical pixels computes `min_width` as `-infinity` (division of a negative numerator by `0.0`), which then feeds into `Limits::new(Size::new(min_width, ...), ...)` for child layout - producing degenerate/infinite layout constraints instead of a panic-free fallback.","fix":"Guard the manual-approach branch for the single-tab case (e.g. skip the division and just use the available width directly when `element_count <= 6`), or clamp the divisor with `.max(1.0)` before dividing.","locations":[{"ref":"src/shell/element/stack/tabs.rs:349-432","code":"  349 |     fn layout(&mut self, tree: &mut Tree, renderer: &cosmic::Renderer, limits: &Limits) -> Node {\n  350 |         let limits = limits.width(self.width).height(self.height);\n  351 |         let element_count = self.elements.len();\n  352 |         // calculate the smallest possible size\n  353 |         let child_limits = Limits::new(\n  354 |             Size::new(0.0, limits.min().height),\n  355 |             Size::new(f32::INFINITY, limits.max().height),\n  356 |         )\n  357 |         .width(Length::Shrink)\n  358 |         .height(Length::Shrink);\n  359 | \n  360 |         let mut nodes = self.elements[2..element_count - 2]\n  361 |             .iter_mut()\n  362 |             .zip(tree.children.iter_mut().skip(2))\n  363 |             .map(|(tab, tab_tree)| {\n  364 |                 tab.as_widget_mut()\n  365 |                     .layout(tab_tree, renderer, &child_limits)\n  366 |             })\n  367 |             .collect::<Vec<_>>();\n  368 | \n  369 |         // sum up\n  370 |         let min_size = nodes\n  371 |             .iter()\n  372 |             .map(Node::size)\n  373 |             .fold(Size::new(0., 0.), |a, b| Size {\n  374 |                 width: a.width + b.width,\n  375 |                 height: a.height.max(b.height),\n  376 |             });\n  377 |         let size = limits.resolve(self.width, self.height, min_size);\n  378 | \n  379 |         if min_size.width <= size.width {\n  380 |             // we don't need to scroll\n  381 | \n  382 |             let element_count = self.elements.len();\n  383 |             // can we make every tab equal weight and keep the active large enough?\n  384 |             let children = if (size.width / (element_count as f32 - 5.)).ceil() as i32\n  385 |                 >= MIN_ACTIVE_TAB_WIDTH\n  386 |             {\n  387 |                 // just use a flex layout\n  388 |                 cosmic::iced::core::layout::flex::resolve(\n  389 |                     cosmic::iced::core::layout::flex::Axis::Horizontal,\n  390 |                     renderer,\n  391 |                     &limits,\n  392 |                     self.width,\n  393 |                     self.height,\n  394 |                     0.into(),\n  395 |                     0.,\n  396 |                     cosmic::iced::Alignment::Center,\n  397 |                     &mut self.elements[2..element_count - 2],\n  398 |                     &mut tree.children[2..element_count - 2],\n  399 |                 )\n  400 |                 .children()\n  401 |                 .to_vec()\n  402 |             } else {\n  403 |                 // otherwise we need a more manual approach\n  404 |                 let min_width =\n  405 |                     (size.width - MIN_ACTIVE_TAB_WIDTH as f32 - 4.) / (element_count as f32 - 6.);\n  406 |                 let mut offset = 0.;\n  407 | \n  408 |                 let mut nodes = self.elements[2..element_count - 3]\n  409 |                     .iter_mut()\n  410 |                     .zip(tree.children[2..element_count - 3].iter_mut())\n  411 |                     .map(|(tab, tab_tree)| {\n  412 |                         let child_limits = Limits::new(\n  413 |                             Size::new(min_width, limits.min().height),\n  414 |                             Size::new(f32::INFINITY, limits.max().height),\n  415 |                         )\n  416 |                         .width(Length::Shrink)\n  417 |                         .height(Length::Shrink);\n  418 | \n  419 |                         let mut node =\n  420 |                             tab.as_widget_mut()\n  421 |                                 .layout(tab_tree, renderer, &child_limits);\n  422 |                         node = node.move_to(Point::new(offset, 0.));\n  423 |                         offset += node.bounds().width;\n  424 |                         node\n  425 |                     })\n  426 |                     .collect::<Vec<_>>();\n  427 |                 nodes.push({\n  428 |                     let node = Node::new(Size::new(4., limits.max().height));\n  429 |                     node.move_to(Point::new(offset, 0.))\n  430 |                 });\n  431 |                 nodes\n  432 |             };","lines":84,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/shell/element/stack/tabs.rs#L349-L432"},{"ref":"src/shell/element/stack/tabs.rs:404-405","code":"  404 |                 let min_width =\n  405 |                     (size.width - MIN_ACTIVE_TAB_WIDTH as f32 - 4.) / (element_count as f32 - 6.);","lines":2,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/shell/element/stack/tabs.rs#L404-L405"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`FloatingLayout::resize_request` gates creation of the resize grab purely on `seat.get_pointer().is_some()`, even though the passed-in `start_data: GrabStartData` can be `GrabStartData::Touch`. On a seat that only exposes a touch device (no pointer capability), a touch-initiated edge-resize request on a floating window silently returns `None` and no grab is created, even though the analogous tiling-resize path and `ResizeSurfaceGrab` itself fully support touch grabs (`is_touch_grab()`).","fix":"Gate on the actual grab source instead of unconditional pointer presence, e.g. `if matches!(start_data, GrabStartData::Touch(_)) || seat.get_pointer().is_some() { ... }`, or simply drop the capability check since `ResizeSurfaceGrab::new` already works with either start-data variant.","locations":[{"ref":"src/shell/layout/floating/mod.rs:912-940","code":"  912 |     pub fn resize_request(\n  913 |         &mut self,\n  914 |         mapped: &CosmicMapped,\n  915 |         seat: &Seat<State>,\n  916 |         start_data: GrabStartData,\n  917 |         edges: ResizeEdge,\n  918 |         edge_snap_threshold: u32,\n  919 |         release: ReleaseMode,\n  920 |     ) -> Option<ResizeSurfaceGrab> {\n  921 |         if seat.get_pointer().is_some() {\n  922 |             let location = self.space.element_location(mapped)?.as_local();\n  923 |             let size = mapped.geometry().size;\n  924 |             mapped.moved_since_mapped.store(true, Ordering::SeqCst);\n  925 | \n  926 |             Some(grabs::ResizeSurfaceGrab::new(\n  927 |                 start_data,\n  928 |                 mapped.clone(),\n  929 |                 edges,\n  930 |                 self.space.outputs().next().cloned().unwrap(),\n  931 |                 edge_snap_threshold,\n  932 |                 location,\n  933 |                 size,\n  934 |                 seat,\n  935 |                 release,\n  936 |             ))\n  937 |         } else {\n  938 |             None\n  939 |         }\n  940 |     }","lines":29,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/shell/layout/floating/mod.rs#L912-L940"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`update_orientation()` rescales a group's `sizes` to the new orientation's length and then only\ncorrects the rounding error when the new sum undershoots the target: `if sum < new_length { *sizes.last_mut().unwrap() += new_length - sum; }`.\nIf rounding causes the sum to *overshoot* (`sum > new_length`, equally likely with `.round()`), no\ncorrection happens and the persisted `sizes` vector (which is written back into the live tree and\npushed onto the animation queue) permanently sums to more than the group's actual pixel length.\nEvery sibling function that does the equivalent rescale (`Data::update_geometry` at\nsrc/shell/layout/tiling/mod.rs:313-319, and the `remap` restore-state rescale at\nsrc/shell/layout/tiling/mod.rs:479-483) uses the symmetric `if sum != new_length { diff = new_length - sum; ... }`\nform, which handles both directions - this function is the odd one out. The corrupted sizes make\nsubsequent `update_positions` calls lay out children whose rectangles extend past the group's\nbounds (overlapping the next group or clipping off-screen), and the error is carried forward by\nevery later proportional rescale since they all scale relative to the (now wrong) stored sizes.","fix":"Use the same symmetric correction as `Data::update_geometry`:\n```rust\nlet sum: i32 = sizes.iter().sum();\nif sum != new_length {\n    let diff = new_length - sum;\n    *sizes.last_mut().unwrap() += diff;\n}\n```","locations":[{"ref":"src/shell/layout/tiling/mod.rs:2116-2123","code":" 2116 |             sizes.iter_mut().for_each(|len| {\n 2117 |                 *len = (((*len as f64) / (previous_length as f64)) * (new_length as f64)).round()\n 2118 |                     as i32;\n 2119 |             });\n 2120 |             let sum: i32 = sizes.iter().sum();\n 2121 |             if sum < new_length {\n 2122 |                 *sizes.last_mut().unwrap() += new_length - sum;\n 2123 |             }","lines":8,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/shell/layout/tiling/mod.rs#L2116-L2123"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`render_popups()` computes the animation `percentage` directly as\n`Instant::now().duration_since(animation_start).as_millis() as f32 / duration.as_millis() as f32`\nwith no guard for `duration == Duration::ZERO`. `render()` (the sibling function used for the main\nrender path, ~40 lines above/below in the same impl block) explicitly special-cases this:\n`if *duration == Duration::ZERO { 1.0 } else { ... }`. Tree durations of `Duration::ZERO` are a\nnormal occurrence: `TreeQueue::push_tree` defaults to `Duration::ZERO` when `None` is passed, and\nseveral call sites do pass `None` (e.g. `TilingLayout::resize` at line 2613, `set_output` at line\n392). When such a zero-duration tree is the animation target, `render_popups` divides by zero,\nproducing `f32::INFINITY`/`NaN`, which is then fed into `ease(EaseInOutCubic, 0.0, 1.0, percentage)`\nand subsequently used to interpolate popup rectangles, corrupting their position/size for that\nframe (popups can flash at (0,0) or collapse to zero size).","fix":"Mirror the guard already used in `render()`:\n```rust\nlet percentage = if let Some(animation_start) = self.queue.animation_start {\n    if *duration == Duration::ZERO {\n        1.0\n    } else {\n        let percentage = Instant::now().duration_since(animation_start).as_millis() as f32\n            / duration.as_millis() as f32;\n        ease(EaseInOutCubic, 0.0, 1.0, percentage)\n    }\n} else {\n    1.0\n};\n```","locations":[{"ref":"src/shell/layout/tiling/mod.rs:4213-4216","code":" 4213 |         let percentage = if let Some(animation_start) = self.queue.animation_start {\n 4214 |             let percentage = Instant::now().duration_since(animation_start).as_millis() as f32\n 4215 |                 / duration.as_millis() as f32;\n 4216 |             ease(EaseInOutCubic, 0.0, 1.0, percentage)","lines":4,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/shell/layout/tiling/mod.rs#L4213-L4216"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"The overview-mode fade alpha is computed with integer division before the cast to f32: `Instant::now().duration_since(*started).as_millis() / ANIMATION_DURATION.as_millis()` divides two `u128` values, which truncates to `0` for the entire ~200ms transition (since elapsed < ANIMATION_DURATION) and only jumps to `1` once the animation is already over. As a result the alpha value is pinned at a constant (1.0 during `Started`, 0.6 during `Ended`) for the whole animation and then snaps instantly to the other value instead of easing smoothly, i.e. the overview-mode fade-in/fade-out animation doesn't actually animate. The correct pattern (cast to f32/f64 before dividing) is used correctly a few lines below in the same function (`(...).as_millis() as f64 / 100.0`) and elsewhere in `shell/mod.rs` (e.g. `ANIMATION_DURATION.as_millis() as f32`), confirming this is a copy/paste mistake rather than intentional.","fix":"Cast each `as_millis()` call to f32 before dividing, e.g.:\n```rust\nOverviewMode::Started(_, started) => {\n    (1.0 - (Instant::now().duration_since(*started).as_millis() as f32\n        / ANIMATION_DURATION.as_millis() as f32))\n        .max(0.0)\n        * 0.4\n        + 0.6\n}\n```\nApply the same fix to the `Ended` arm and to the duplicate block in `render_popups`.","locations":[{"ref":"src/shell/workspace.rs:1750-1766","code":" 1750 |             let alpha = match &overview.0 {\n 1751 |                 OverviewMode::Started(_, started) => {\n 1752 |                     (1.0 - (Instant::now().duration_since(*started).as_millis()\n 1753 |                         / ANIMATION_DURATION.as_millis()) as f32)\n 1754 |                         .max(0.0)\n 1755 |                         * 0.4\n 1756 |                         + 0.6\n 1757 |                 }\n 1758 |                 OverviewMode::Ended(_, ended) => {\n 1759 |                     ((Instant::now().duration_since(*ended).as_millis()\n 1760 |                         / ANIMATION_DURATION.as_millis()) as f32)\n 1761 |                         * 0.4\n 1762 |                         + 0.6\n 1763 |                 }\n 1764 |                 OverviewMode::Active(_) => 0.6,\n 1765 |                 OverviewMode::None => 1.0,\n 1766 |             };","lines":17,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/shell/workspace.rs#L1750-L1766"},{"ref":"src/shell/workspace.rs:1937-1953","code":" 1937 |             let alpha = match &overview.0 {\n 1938 |                 OverviewMode::Started(_, started) => {\n 1939 |                     (1.0 - (Instant::now().duration_since(*started).as_millis()\n 1940 |                         / ANIMATION_DURATION.as_millis()) as f32)\n 1941 |                         .max(0.0)\n 1942 |                         * 0.4\n 1943 |                         + 0.6\n 1944 |                 }\n 1945 |                 OverviewMode::Ended(_, ended) => {\n 1946 |                     ((Instant::now().duration_since(*ended).as_millis()\n 1947 |                         / ANIMATION_DURATION.as_millis()) as f32)\n 1948 |                         * 0.4\n 1949 |                         + 0.6\n 1950 |                 }\n 1951 |                 OverviewMode::Active(_) => 0.6,\n 1952 |                 OverviewMode::None => 1.0,\n 1953 |             };","lines":17,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/shell/workspace.rs#L1937-L1953"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `systemd::ready`, the `DISPLAY` environment variable passed to `systemctl --user import-environment` is computed as `common.xwayland_state.as_ref().map(|s| format!(\":{}\", s.display)).unwrap_or_default()`. When Xwayland is disabled or hasn't started yet (`xwayland_state` is `None`), this evaluates to an empty string, so `systemctl --user import-environment ... DISPLAY` imports `DISPLAY=\"\"` into the systemd user manager's environment. This can overwrite/clobber a previously-valid `DISPLAY` value already present in the systemd user environment (e.g. from a prior session or nested X11), breaking X11 app launches for user services started afterwards, instead of simply leaving `DISPLAY` untouched.","fix":"Only pass/import `DISPLAY` when `xwayland_state` is `Some`; when it is `None`, drop `DISPLAY` from the `--user import-environment` argument list and `.env()` call entirely instead of importing an empty value.","locations":[{"ref":"src/systemd.rs:8-21","code":"    8 | pub fn ready(common: &Common) {\n    9 |     if booted() {\n   10 |         match Command::new(\"systemctl\")\n   11 |             .args([\"--user\", \"import-environment\", \"WAYLAND_DISPLAY\", \"DISPLAY\"])\n   12 |             .env(\"WAYLAND_DISPLAY\", &common.socket)\n   13 |             .env(\n   14 |                 \"DISPLAY\",\n   15 |                 common\n   16 |                     .xwayland_state\n   17 |                     .as_ref()\n   18 |                     .map(|s| format!(\":{}\", s.display))\n   19 |                     .unwrap_or_default(),\n   20 |             )\n   21 |             .status()","lines":14,"link":"https://github.com/pop-os/cosmic-comp/blob/7d1daab7bc5db7ef0c4be64af1e35c8a24acfa9b/src/systemd.rs#L8-L21"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"hard","description":"Neither `Dispatch<CosmicCornerRadiusToplevelV1, CornerRadiusData, D>` nor `Dispatch<CosmicCornerRadiusLayerV1, CornerRadiusData, D>` implements `fn destroyed(...)`. If a client's corner-radius object goes away without an explicit `Request::Destroy` (e.g. the client disconnects or crashes), the `ToplevelHookId`/`LayerHookId` stored in the surface's `data_map` keeps pointing at the now-dead `Weak` reference forever. Later, `GetCornerRadius`/`GetCornerRadiusSurface`/`GetCornerRadiusLayer` compute `radius_exists = Some(false)` for that surface (hook entry present but its weak upgrade fails), so `needs_hook = radius_exists.is_none()` is `false` and the hook is never re-pointed at the newly created object (see corner_radius.rs:213-224 and corner_radius.rs:278-288). The pre-commit hook (`xdg_radius_hook`/`layer_radius_hook`) keeps upgrading the stale dead weak reference and silently does nothing, so radius validation (`RadiusTooLarge`/`PaddingTooLarge` protocol errors) permanently stops working for that surface for the rest of the compositor's lifetime, even though new corner-radius clients can still set arbitrary corner values via `CacheableCorners`.","fix":"Implement `fn destroyed()` for both `CosmicCornerRadiusToplevelV1` and `CosmicCornerRadiusLayerV1` dispatch impls that clears the surface's `ToplevelHookId`/`LayerHookId` and resets the cached corners/padding, the same way the `Request::Destroy` arms already do, so a subsequent `Get*` request correctly re-attaches a working hook.","locations":[{"ref":"src/wayland/protocols/corner_radius.rs:293-421","code":"  293 | impl<D>\n  294 |     Dispatch<cosmic_corner_radius_toplevel_v1::CosmicCornerRadiusToplevelV1, CornerRadiusData, D>\n  295 |     for CornerRadiusState\n  296 | where\n  297 |     D: GlobalDispatch<cosmic_corner_radius_manager_v1::CosmicCornerRadiusManagerV1, ()>\n  298 |         + Dispatch<c
