{"id":"API_6","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"The metrics authorization token is compared with a plain `!=` (`provided_token != Some(expected_token.expose_secret())`). String equality short-circuits on the first differing byte, leaking timing information about the secret. This is an internal metrics endpoint, but it is still a bearer-token check that should be constant-time.","fix":"Compare the provided and expected tokens with a constant-time comparison (e.g. `subtle::ConstantTimeEq` / `constant_time_eq`).","locations":[{"ref":"src/controllers/metrics.rs:26-28","code":"   26 |         if provided_token != Some(expected_token.expose_secret()) {\n   27 |             return Err(forbidden(\"invalid or missing authorization token\"));\n   28 |         }","lines":3,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/controllers/metrics.rs#L26-L28"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`VersionOwnerAction::all()` loads the entire `version_owner_actions` table into memory with no `LIMIT`, `WHERE`, or pagination. On a production database this table grows with every publish/yank/unyank across all crates and could contain millions of rows. Any caller of this method risks loading the whole table into memory at once.","fix":"Remove this method if unused, or replace it with a paginated/filtered query (e.g. by version id or time range) that bounds the result set.","locations":[{"ref":"crates/crates_io_database/src/models/action.rs:53-55","code":"   53 |     pub async fn all(mut conn: &AsyncPgConnection) -> QueryResult<Vec<Self>> {\n   54 |         Self::query().load(&mut conn).await\n   55 |     }","lines":3,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/crates/crates_io_database/src/models/action.rs#L53-L55"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`PagerdutyClient::send` rebuilds a fresh `reqwest::Client` (`Client::builder()...build()?`) on every call. A reqwest client owns a connection pool and is meant to be built once and reused; rebuilding per request defeats connection reuse and adds TLS/setup cost on each page. The sibling clients (Fastly, RealDocsRsClient, TeamRepoImpl) all store the client in their struct - PagerdutyClient stores only the service key.","fix":"Build the `reqwest::Client` once in `PagerdutyClient::new`, store it in the struct, and reuse it in `send`.","locations":[{"ref":"crates/crates_io_pagerduty/src/lib.rs:41-53","code":"   41 |     pub async fn send(&self, event: &Event) -> Result<()> {\n   42 |         let service_key = self.service_key.expose_secret();\n   43 | \n   44 |         let client = Client::builder()\n   45 |             .user_agent(crates_io_version::user_agent())\n   46 |             .build()?;\n   47 | \n   48 |         let response = client\n   49 |             .post(\"https://events.pagerduty.com/generic/2010-04-15/create_event.json\")\n   50 |             .header(header::ACCEPT, \"application/vnd.pagerduty+json;version=2\")\n   51 |             .json(&FullEvent { service_key, event })\n   52 |             .send()\n   53 |             .await?;","lines":13,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/crates/crates_io_pagerduty/src/lib.rs#L41-L53"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"The unfiltered crates listing performs a full `COUNT(*)` over the `crates` table on every request to populate `meta.total` (acknowledged in the in-code comment). For the very common filterless/first-page browse this is a full index scan per request and is a known scalability hot spot. The comment notes it \"could be denormalized\" but nothing caps or caches it, so a high request rate against `/api/v1/crates` forces repeated full counts.","fix":"Denormalize the total crate count (e.g. a maintained counter / materialized value) for the filterless happy path, or cache the count with a short TTL, instead of issuing COUNT(*) on every request.","locations":[{"ref":"src/controllers/krate/search.rs:254-274","code":"  254 |         // This does a full index-only scan over the crates table to gather how many crates were\n  255 |         // published. Unfortunately on PostgreSQL counting the rows in a table requires scanning\n  256 |         // the table, and the `total` field is part of the stable registries API.\n  257 |         //\n  258 |         // If this becomes a problem in the future the crates count could be denormalized, at least\n  259 |         // for the filterless happy path.\n  260 |         let count_query = filter_params.make_query().count();\n  261 |         let query = query.pages_pagination_with_count_query(pagination, count_query);\n  262 |         let span = info_span!(\"db.query\", message = \"SELECT ..., COUNT(*) FROM crates\");\n  263 |         let data = query.load::<Record>(&mut conn).instrument(span).await?;\n  264 |         (\n  265 |             data.total(),\n  266 |             data.next_seek_params(|last| seek.to_payload(last))?\n  267 |                 .map(|p| req.query_with_params(p)),\n  268 |             None,\n  269 |             data.into_iter().collect::<Vec<_>>(),\n  270 |         )\n  271 |     } else {\n  272 |         let count_query = filter_params.make_query().count();\n  273 |         let query = query.pages_pagination_with_count_query(pagination, count_query);\n  274 |         let span = info_span!(\"db.query\", message = \"SELECT ..., COUNT(*) FROM crates\");","lines":21,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/controllers/krate/search.rs#L254-L274"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`EncodableCategory::from` allocates an entire `Vec` via `category.rsplit(\"::\").collect::<Vec<_>>()[0]` only to read the first element (the segment after the last `::`). This needlessly heap-allocates a vector of all path segments on every conversion.","fix":"Use the iterator directly: `category.rsplit(\"::\").next().unwrap_or(&category).to_string()` (rsplit always yields at least one item).","locations":[{"ref":"crates/crates_io_api_types/src/lib.rs:78","code":"   78 |             category: category.rsplit(\"::\").collect::<Vec<_>>()[0].to_string(),","lines":1,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/crates/crates_io_api_types/src/lib.rs#L78"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`list_crate_owner_invitations_for_user` resolves each invitation's inviter username with a linear `users.iter().find(...)` inside the per-invitation map. This is O(invitations * users); since `users` is already keyed data it should be an indexed lookup. Low impact given small page sizes, but it is an avoidable nested scan over data already loaded into a map structure upstream.","fix":"Build a `HashMap<i32, &EncodablePublicUser>` (or reuse the existing `IndexMap`) keyed by user id once, then look up `inviter_id` directly.","locations":[{"ref":"src/controllers/crate_owner_invitation.rs:67-85","code":"   67 |     let crate_owner_invitations = invitations\n   68 |         .into_iter()\n   69 |         .map(|private| {\n   70 |             Ok(EncodableCrateOwnerInvitationV1 {\n   71 |                 invited_by_username: users\n   72 |                     .iter()\n   73 |                     .find(|u| u.id == private.inviter_id)\n   74 |                     .ok_or_else(|| internal(format!(\"missing user {}\", private.inviter_id)))?\n   75 |                     .login\n   76 |                     .clone(),\n   77 |                 invitee_id: private.invitee_id,\n   78 |                 inviter_id: private.inviter_id,\n   79 |                 crate_name: private.crate_name,\n   80 |                 crate_id: private.crate_id,\n   81 |                 created_at: private.created_at,\n   82 |                 expires_at: private.expires_at,\n   83 |             })\n   84 |         })\n   85 |         .collect::<AppResult<Vec<EncodableCrateOwnerInvitationV1>>>()?;","lines":19,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/controllers/crate_owner_invitation.rs#L67-L85"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`update_crate` loads the full crate via `path.load_crate` (a `SELECT * FROM crates`), then `update_inner` re-queries the same crate with all its joins (`Crate::by_name(&krate.name) ... .first()`) at the end to build the response. The first full load is only needed for `krate.id`, `krate.name`, and `krate.trustpub_only`; the final reload duplicates work already partially done. This is an extra DB round-trip on every settings update.","fix":"Either select only the needed columns in the initial load, or restructure so a single joined query provides both the permission/setting data and the encodable response data.","locations":[{"ref":"src/controllers/krate/update.rs:68","code":"   68 |     let krate = path.load_crate(&conn).await?;","lines":1,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/controllers/krate/update.rs#L68"},{"ref":"src/controllers/krate/update.rs:152-175","code":"  152 |     let (krate, downloads, recent_downloads, default_version, yanked, num_versions): (\n  153 |         Crate,\n  154 |         i64,\n  155 |         Option<i64>,\n  156 |         Option<String>,\n  157 |         Option<bool>,\n  158 |         Option<i32>,\n  159 |     ) = Crate::by_name(&krate.name)\n  160 |         .inner_join(crate_downloads::table)\n  161 |         .left_join(recent_crate_downloads::table)\n  162 |         .left_join(default_versions::table)\n  163 |         .left_join(versions::table.on(default_versions::version_id.eq(versions::id)))\n  164 |         .select((\n  165 |             Crate::as_select(),\n  166 |             crate_downloads::downloads,\n  167 |             recent_crate_downloads::downloads.nullable(),\n  168 |             versions::num.nullable(),\n  169 |             versions::yanked.nullable(),\n  170 |             default_versions::num_versions.nullable(),\n  171 |         ))\n  172 |         .first(conn)\n  173 |         .await\n  174 |         .optional()?\n  175 |         .ok_or_else(|| crate_not_found(&krate.name))?;","lines":24,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/controllers/krate/update.rs#L152-L175"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`update_email_notifications` loads all of the user's `crate_owners` rows and re-upserts every one of them, including rows whose `email_notifications` value is unchanged. The comment claims rows whose value will not change are removed, but the `.map` keeps every row (it only computes the value, never filters), so the upsert touches all owned crates on every call. For a user owning many crates this is a needless large write.","fix":"Filter the loaded rows to those whose `email_notifications` actually differs from the requested update before building `to_insert`, or restrict the query/upsert to the crate ids present in `updates`.","locations":[{"ref":"src/controllers/user/email_notifications.rs:68-94","code":"   68 |         .into_iter()\n   69 |         // Remove records whose `email_notifications` will not change from their current value\n   70 |         .map(\n   71 |             |(c_id, o_id, o_kind, e_notifications): (i32, i32, i32, bool)| {\n   72 |                 let current_e_notifications = *updates.get(&c_id).unwrap_or(&e_notifications);\n   73 |                 (\n   74 |                     crate_owners::crate_id.eq(c_id),\n   75 |                     crate_owners::owner_id.eq(o_id),\n   76 |                     crate_owners::owner_kind.eq(o_kind),\n   77 |                     crate_owners::email_notifications.eq(current_e_notifications),\n   78 |                 )\n   79 |             },\n   80 |         )\n   81 |         .collect::<Vec<_>>();\n   82 | \n   83 |     // Upsert crate owners; this should only actually execute updates\n   84 |     diesel::insert_into(crate_owners::table)\n   85 |         .values(&to_insert)\n   86 |         .on_conflict((\n   87 |             crate_owners::crate_id,\n   88 |             crate_owners::owner_id,\n   89 |             crate_owners::owner_kind,\n   90 |         ))\n   91 |         .do_update()\n   92 |         .set(crate_owners::email_notifications.eq(excluded(crate_owners::email_notifications)))\n   93 |         .execute(&mut conn)\n   94 |         .await?;","lines":27,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/controllers/user/email_notifications.rs#L68-L94"}]},
{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"On every metrics scrape, LogEncoder::encode deep-clones each metric's VectorMetricData and tags IndexMap into a new HashMap solely to emit an info-level log line, then serializes the events a second time for the actual base64 chunks. Metrics are serialized twice and all per-metric data/tags cloned just for logging.","fix":"Build the log JSON from references (serialize &events / borrow data and tags) or drop/lower the info! log, avoiding the second serialization and the clones.","locations":[{"ref":"src/metrics/log_encoder.rs:48-67","code":"   48 |         let events = families_to_json_events(families);\n   49 | \n   50 |         let metrics = events\n   51 |             .iter()\n   52 |             .map(|event| {\n   53 |                 let value = MapMetric {\n   54 |                     data: event.metric.data.clone(),\n   55 |                     tags: event.metric.tags.clone(),\n   56 |                 };\n   57 |                 (event.metric.name, value)\n   58 |             })\n   59 |             .collect::<HashMap<_, _>>();\n   60 | \n   61 |         match serde_json::to_string(&metrics) {\n   62 |             Ok(json) => info!(target: \"metrics\", \"{{\\\"metrics\\\":{json}}}\"),\n   63 |             Err(error) => warn!(target: \"metrics\", \"Failed to serialize metrics: {error}\"),\n   64 |         }\n   65 | \n   66 |         let chunks = serialize_and_split_list(events.iter(), CHUNKS_MAX_SIZE_BYTES)\n   67 |             .map_err(|e| Error::Msg(e.to_string()))?;","lines":20,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/metrics/log_encoder.rs#L48-L67"}]},
{"id":"PERF_9","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"log_requests collects per-request custom metadata into a temporary HashMap purely to serialize it, cloning every (key, value) pair out of the underlying Vec under the lock on every request.","fix":"Serialize directly from the locked Vec via a borrowed map view, avoiding the intermediate HashMap and per-entry clone.","locations":[{"ref":"src/middleware/log_request.rs:81-85","code":"   81 |     let custom_metadata = {\n   82 |         let metadata = custom_metadata.lock();\n   83 |         let metadata = metadata.iter().cloned().collect::<HashMap<&str, String>>();\n   84 |         serde_json::to_string(&metadata).unwrap_or_default()\n   85 |     };","lines":5,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/middleware/log_request.rs#L81-L85"}]},
{"id":"PERF_10","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"RequestLog::add calls value.to_string() twice per invocation (once for the Vec push, once for sentry set_extra), allocating the string twice. add is called on multiple per-request code paths.","fix":"Compute the string once (`let value = value.to_string();`) and reuse it for both the Vec push and the sentry extra.","locations":[{"ref":"src/middleware/log_request.rs:113-118","code":"  113 |     pub fn add<V: Display>(&self, key: &'static str, value: V) {\n  114 |         let mut metadata = self.lock();\n  115 |         metadata.push((key, value.to_string()));\n  116 | \n  117 |         sentry::configure_scope(|scope| scope.set_extra(key, value.to_string().into()));\n  118 |     }","lines":6,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/middleware/log_request.rs#L113-L118"}]},
{"id":"PERF_11","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"update_metrics produces the responses_by_status_code_total label via `status.to_string()` on every request, allocating a fresh String for a small fixed set of status codes on the hot path.","fix":"Use a precomputed status-code->label map/array or itoa into a stack buffer to avoid a per-request heap allocation.","locations":[{"ref":"src/middleware/update_metrics.rs:33-37","code":"   33 |     let status = response.status().as_u16();\n   34 |     metrics\n   35 |         .responses_by_status_code_total\n   36 |         .with_label_values(&[&status.to_string()])\n   37 |         .inc();","lines":5,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/middleware/update_metrics.rs#L33-L37"}]},
{"id":"PERF_12","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"query_with_params allocates an owned (String, String) for every existing query parameter via `.into_owned()` just to filter and re-serialize, on the request hot path used for pagination link building.","fix":"Build the Serializer directly from the borrowed parsed pairs (filtering keys in new_params), avoiding the intermediate into_owned Vec.","locations":[{"ref":"src/util/request_helpers.rs:53-67","code":"   53 |     fn query_with_params(&self, new_params: IndexMap<String, String>) -> String {\n   54 |         let query_bytes = self.uri().query().unwrap_or(\"\").as_bytes();\n   55 | \n   56 |         let mut params = url::form_urlencoded::parse(query_bytes)\n   57 |             .into_owned()\n   58 |             .filter(|(key, _)| !new_params.contains_key(key))\n   59 |             .collect::<Vec<_>>();\n   60 | \n   61 |         params.extend(new_params);\n   62 | \n   63 |         let query_string = url::form_urlencoded::Serializer::new(String::new())\n   64 |             .extend_pairs(params)\n   65 |             .finish();\n   66 |         format!(\"?{query_string}\")\n   67 |     }","lines":15,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/util/request_helpers.rs#L53-L67"}]},
{"id":"PERF_13","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"The RSS feed jobs (`SyncCrateFeed`, `SyncCratesFeed`, `SyncUpdatesFeed`) all run a first query filtered by the 'always include' age threshold with no LIMIT, and only when that returns fewer than NUM_ITEMS rows do they run a second query with a LIMIT. In the common steady state (fewer than NUM_ITEMS recent items) this means two queries are executed every run where one would do.","fix":"Use a single query that returns rows newer than the threshold OR the most recent NUM_ITEMS (e.g. UNION / window function), or order+limit with a fallback computed in one round trip.","locations":[{"ref":"src/worker/jobs/rss/sync_crate_feed.rs:102-126","code":"  102 | async fn load_version_updates(\n  103 |     name: &str,\n  104 |     mut conn: &AsyncPgConnection,\n  105 | ) -> QueryResult<Vec<VersionUpdate>> {\n  106 |     let threshold_dt = chrono::Utc::now().naive_utc() - ALWAYS_INCLUDE_AGE;\n  107 | \n  108 |     let updates = VersionUpdate::query()\n  109 |         .filter(crates::name.eq(name))\n  110 |         .filter(versions::created_at.gt(threshold_dt))\n  111 |         .order(versions::created_at.desc())\n  112 |         .load(&mut conn)\n  113 |         .await?;\n  114 | \n  115 |     let num_updates = updates.len();\n  116 |     if num_updates as i64 >= NUM_ITEMS {\n  117 |         return Ok(updates);\n  118 |     }\n  119 | \n  120 |     VersionUpdate::query()\n  121 |         .filter(crates::name.eq(name))\n  122 |         .order(versions::created_at.desc())\n  123 |         .limit(NUM_ITEMS)\n  124 |         .load(&mut conn)\n  125 |         .await\n  126 | }","lines":25,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/worker/jobs/rss/sync_crate_feed.rs#L102-L126"},{"ref":"src/worker/jobs/rss/sync_crates_feed.rs:89-108","code":"   89 | async fn load_new_crates(mut conn: &AsyncPgConnection) -> QueryResult<Vec<NewCrate>> {\n   90 |     let threshold_dt = chrono::Utc::now().naive_utc() - ALWAYS_INCLUDE_AGE;\n   91 | \n   92 |     let new_crates = NewCrate::query()\n   93 |         .filter(crates::created_at.gt(threshold_dt))\n   94 |         .order(crates::created_at.desc())\n   95 |         .load(&mut conn)\n   96 |         .await?;\n   97 | \n   98 |     let num_new_crates = new_crates.len();\n   99 |     if num_new_crates as i64 >= NUM_ITEMS {\n  100 |         return Ok(new_crates);\n  101 |     }\n  102 | \n  103 |     NewCrate::query()\n  104 |         .order(crates::created_at.desc())\n  105 |         .limit(NUM_ITEMS)\n  106 |         .load(&mut conn)\n  107 |         .await\n  108 | }","lines":20,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/worker/jobs/rss/sync_crates_feed.rs#L89-L108"},{"ref":"src/worker/jobs/rss/sync_updates_feed.rs:89-108","code":"   89 | async fn load_version_updates(mut conn: &AsyncPgConnection) -> QueryResult<Vec<VersionUpdate>> {\n   90 |     let threshold_dt = chrono::Utc::now().naive_utc() - ALWAYS_INCLUDE_AGE;\n   91 | \n   92 |     let updates = VersionUpdate::query()\n   93 |         .filter(versions::created_at.gt(threshold_dt))\n   94 |         .order(versions::created_at.desc())\n   95 |         .load(&mut conn)\n   96 |         .await?;\n   97 | \n   98 |     let num_updates = updates.len();\n   99 |     if num_updates as i64 >= NUM_ITEMS {\n  100 |         return Ok(updates);\n  101 |     }\n  102 | \n  103 |     VersionUpdate::query()\n  104 |         .order(versions::created_at.desc())\n  105 |         .limit(NUM_ITEMS)\n  106 |         .load(&mut conn)\n  107 |         .await\n  108 | }","lines":20,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/worker/jobs/rss/sync_updates_feed.rs#L89-L108"}]},
{"id":"PERF_14","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`Crate::top_versions` loads every non-yanked version (created_at + num) of a crate with no limit. For crates with very large version histories this loads the full set into memory just to compute the highest/newest version. Acceptable for typical crates but unbounded by crate.","fix":"If this becomes hot, compute highest/newest in SQL (e.g. via `semver_ord_v2` ordering as `default_versions` already does) instead of loading all rows.","locations":[{"ref":"crates/crates_io_database/src/models/krate.rs:197-205","code":"  197 |     pub async fn top_versions(&self, mut conn: &AsyncPgConnection) -> QueryResult<TopVersions> {\n  198 |         Ok(TopVersions::from_date_version_pairs(\n  199 |             Version::belonging_to(self)\n  200 |                 .filter(versions::yanked.eq(false))\n  201 |                 .select((versions::created_at, versions::num))\n  202 |                 .load(&mut conn)\n  203 |                 .await?,\n  204 |         ))\n  205 |     }","lines":9,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/crates/crates_io_database/src/models/krate.rs#L197-L205"}]},
{"id":"PERF_15","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"render_og_images.rs paginates with OFFSET/LIMIT over `crates ORDER BY name`, incrementing offset by batch_size each loop. OFFSET pagination re-scans and discards `offset` rows on every batch, making the full backfill O(n^2) in rows scanned.","fix":"Use keyset pagination (WHERE name > $last_name ORDER BY name LIMIT batch_size) instead of growing OFFSET.","locations":[{"ref":"src/bin/crates-io/admin/render_og_images.rs:58-122","code":"   58 |     loop {\n   59 |         // Fetch batch of crate names\n   60 |         let crate_names: Vec<String> = build_query()\n   61 |             .order(crates::name)\n   62 |             .offset(offset)\n   63 |             .limit(opts.batch_size as i64)\n   64 |             .load(&mut conn)\n   65 |             .await\n   66 |             .context(\"Failed to load crate names\")?;\n   67 | \n   68 |         if crate_names.is_empty() {\n   69 |             break;\n   70 |         }\n   71 | \n   72 |         let batch_size = crate_names.len();\n   73 |         info!(\n   74 |             \"Enqueueing batch {}-{} of {total_crates}\",\n   75 |             offset + 1,\n   76 |             offset + batch_size as i64\n   77 |         );\n   78 | \n   79 |         // Create batch of jobs\n   80 |         let jobs = crate_names\n   81 |             .into_iter()\n   82 |             .map(|crate_name| {\n   83 |                 if opts.skip_invalidation {\n   84 |                     GenerateOgImage::without_cdn_invalidation(crate_name)\n   85 |                 } else {\n   86 |                     GenerateOgImage::new(crate_name)\n   87 |                 }\n   88 |             })\n   89 |             .map(|job| {\n   90 |                 Ok((\n   91 |                     background_jobs::job_type.eq(GenerateOgImage::JOB_NAME),\n   92 |                     background_jobs::data.eq(serde_json::to_value(job)?),\n   93 |                     background_jobs::priority.eq(-10),\n   94 |                 ))\n   95 |             })\n   96 |             .collect::<serde_json::Result<Vec<_>>>()\n   97 |             .context(\"Failed to enqueue background jobs\")?;\n   98 | \n   99 |         // Batch insert all jobs\n  100 |         let result = diesel::insert_into(background_jobs::table)\n  101 |             .values(jobs)\n  102 |             .execute(&mut conn)\n  103 |             .await;\n  104 | \n  105 |         match result {\n  106 |             Ok(inserted_count) => {\n  107 |                 enqueued += inserted_count;\n  108 |                 info!(\"Enqueued {enqueued} jobs so far...\");\n  109 |             }\n  110 |             Err(e) => {\n  111 |                 errors += batch_size;\n  112 |                 warn!(\"Failed to enqueue batch of OG image jobs: {e}\");\n  113 |             }\n  114 |         }\n  115 | \n  116 |         // Break if we've processed fewer than batch_size (last batch)\n  117 |         if batch_size < opts.batch_size {\n  118 |             break;\n  119 |         }\n  120 | \n  121 |         offset += opts.batch_size as i64;\n  122 |     }","lines":65,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/bin/crates-io/admin/render_og_images.rs#L58-L122"}]},
{"id":"PERF_16","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`find_crate` clones the full `Crate` (`krate.clone()`) to build the encodable crate while still needing `krate.name` afterwards for encoding versions. The clone copies all crate string fields unnecessarily; only `name` is needed after the encodable crate is constructed.","fix":"Extract `krate.name` (clone just the name) before moving `krate` into `EncodableCrate::from`, avoiding the full struct clone.","locations":[{"ref":"src/controllers/krate/metadata.rs:186-202","code":"  186 |     let encodable_crate = EncodableCrate::from(\n  187 |         krate.clone(),\n  188 |         default_version.as_deref(),\n  189 |         num_versions.unwrap_or_default(),\n  190 |         yanked,\n  191 |         top_versions.as_ref(),\n  192 |         ids,\n  193 |         kws.as_deref(),\n  194 |         cats.as_deref(),\n  195 |         false,\n  196 |         downloads,\n  197 |         recent_downloads,\n  198 |     );\n  199 | \n  200 |     let encodable_versions = versions_publishers_and_audit_actions.map(|vpa| {\n  201 |         vpa.into_iter()\n  202 |             .map(|(v, pb, aas)| EncodableVersion::from(v, &krate.name, pb, aas))","lines":17,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/controllers/krate/metadata.rs#L186-L202"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"`PublishWarnings` is always constructed with empty vectors (`invalid_categories`, `invalid_badges`, `other` all `vec![]`) and the surrounding comment confirms crates.io currently never returns any warnings. The three fields and the warning-assembly code are effectively dead, serving only API shape compatibility.","fix":"Either keep but document clearly that these are always empty for schema-compat, or remove the unused fields if the API contract allows.","locations":[{"ref":"src/controllers/krate/publish.rs:705-712","code":"  705 |         // The `other` field on `PublishWarnings` was introduced to handle a temporary warning\n  706 |         // that is no longer needed. As such, crates.io currently does not return any `other`\n  707 |         // warnings at this time, but if we need to, the field is available.\n  708 |         let warnings = PublishWarnings {\n  709 |             invalid_categories: vec![],\n  710 |             invalid_badges: vec![],\n  711 |             other: vec![],\n  712 |         };","lines":8,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/controllers/krate/publish.rs#L705-L712"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"The `InvalidCrateName::Start` error message says \"the first character must be an ASCII character\", but `validate_create_ident` actually requires the first character to be ASCII *alphabetic* (`is_ascii_alphabetic`), having rejected digits separately. ASCII symbols like `_` or `-` are ASCII characters yet are rejected with this misleading message, understating the real requirement.","fix":"Reword the message to \"the first character must be an ASCII letter\" to match `is_ascii_alphabetic`.","locations":[{"ref":"crates/crates_io_validation/src/lib.rs:46-54","code":"   46 |     #[error(\n   47 |         \"invalid character `{first_char}` in {what} name: `{name}`, \\\n   48 |         the first character must be an ASCII character\"\n   49 |     )]\n   50 |     Start {\n   51 |         first_char: char,\n   52 |         what: String,\n   53 |         name: String,\n   54 |     },","lines":9,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/crates/crates_io_validation/src/lib.rs#L46-L54"},{"ref":"crates/crates_io_validation/src/lib.rs:122-128","code":"  122 |         if !ch.is_ascii_alphabetic() {\n  123 |             return Err(InvalidCrateName::Start {\n  124 |                 first_char: ch,\n  125 |                 what: for_what.into(),\n  126 |                 name: name.into(),\n  127 |             });\n  128 |         }","lines":7,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/crates/crates_io_validation/src/lib.rs#L122-L128"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"metrics/macros.rs doc comment describes HISTOGRAM_BUCKETS as '0.5ms to 100ms' and '100ms to 5 seconds', but the array is [0.0005 .. 5.0] seconds (0.5ms to 5s) with boundaries jumping 0.1 -> 0.5 -> 1.0 -> 5.0. It also states buckets contain the count 'equal or greater to the bucket value', but Prometheus buckets are cumulative counts LESS THAN OR EQUAL TO the upper bound. Both descriptions are wrong/inverted.","fix":"Correct the comment to describe the actual buckets (0.5ms to 5s) and Prometheus 'le' (cumulative <=) bucket semantics.","locations":[{"ref":"src/metrics/macros.rs:3-16","code":"    3 | /// Prometheus's histograms work by dividing datapoints in buckets, with each bucket containing\n    4 | /// the count of datapoints equal or greater to the bucket value.\n    5 | ///\n    6 | /// The buckets used by crates.io are geared towards measuring the response time of our requests,\n    7 | /// going from 0.5ms to 100ms with a higher resolution and from 100ms to 5 seconds with a slightly\n    8 | /// lower resolution. This allows us to properly measure download requests (which take around 1ms)\n    9 | /// and other requests (our 95h is around 10-20ms).\n   10 | ///\n   11 | /// Histogram buckets are not an exact science, so feel free to tweak the buckets if you see that\n   12 | /// the histograms are not really accurate. Just avoid adding too many buckets as that increases\n   13 | /// the number of exported metric series.\n   14 | const HISTOGRAM_BUCKETS: &[f64] = &[\n   15 |     0.0005, 0.001, 0.0025, 0.005, 0.01, 0.025, 0.05, 0.1, 0.5, 1.0, 5.0,\n   16 | ];","lines":14,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/metrics/macros.rs#L3-L16"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"util/tracing.rs comments state Sentry is configured to 'include all INFO level events', but event_filter maps INFO (and WARN) to EventFilter::Breadcrumb, not Event - INFO events are only recorded as breadcrumbs, never sent to Sentry as events. The comment is misleading about what Sentry captures.","fix":"Reword the comment to state INFO/WARN are attached as breadcrumbs and only ERROR-level events are sent to Sentry as events.","locations":[{"ref":"src/util/tracing.rs:13-14","code":"   13 | /// This function also sets up the Sentry error reporting integration for the\n   14 | /// `tracing` framework, which is hardcoded to include all `INFO` level events.","lines":2,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/util/tracing.rs#L13-L14"},{"ref":"src/util/tracing.rs:43-59","code":"   43 |     let sentry_layer = sentry::integrations::tracing::layer()\n   44 |         .event_filter(event_filter)\n   45 |         .with_filter(LevelFilter::INFO);\n   46 | \n   47 |     tracing_subscriber::registry()\n   48 |         .with(log_layer)\n   49 |         .with(sentry_layer)\n   50 |         .init();\n   51 | }\n   52 | \n   53 | pub fn event_filter(metadata: &Metadata<'_>) -> EventFilter {\n   54 |     match metadata.level() {\n   55 |         &Level::ERROR if metadata.target() == \"http\" => EventFilter::Breadcrumb,\n   56 |         &Level::ERROR => EventFilter::Event,\n   57 |         &Level::WARN | &Level::INFO => EventFilter::Breadcrumb,\n   58 |         &Level::DEBUG | &Level::TRACE => EventFilter::Ignore,\n   59 |     }","lines":17,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/util/tracing.rs#L43-L59"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"The `insert_or_update` SQL comment explains the conflict target as `WHERE gh_id > 0` to exclude backfilled `-1` rows, but the actual conflict predicate is `(gh_id) WHERE gh_id > 0` while the dedicated lookup `find_by_login` excludes those rows with `gh_id.ne(-1)` (i.e. `<> -1`, which also keeps `0`). The two filters describe slightly different exclusion sets (`> 0` vs `<> -1`); the comment's rationale ('there are multiple records with gh_id of -1') maps to `<> -1`, not `> 0`, making the chosen `> 0` predicate and its justification inconsistent.","fix":"Align the two predicates (use `<> -1` consistently, or `> 0` consistently) and update the comment so the exclusion set it describes matches the SQL.","locations":[{"ref":"crates/crates_io_database/src/models/user.rs:168-176","code":"  168 |             // We need the `WHERE gh_id > 0` condition here because `gh_id` set\n  169 |             // to `-1` indicates that we were unable to find a GitHub ID for\n  170 |             // the associated GitHub login at the time that we backfilled\n  171 |             // GitHub IDs. Therefore, there are multiple records in production\n  172 |             // that have a `gh_id` of `-1` so we need to exclude those when\n  173 |             // considering uniqueness of `gh_id` values. The `> 0` condition isn't\n  174 |             // necessary for most fields in the database to be used as a conflict\n  175 |             // target :)\n  176 |             .on_conflict(sql::<Integer>(\"(gh_id) WHERE gh_id > 0\"))","lines":9,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/crates/crates_io_database/src/models/user.rs#L168-L176"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"The doc comment on `slug_commit` describes `HEROKU_SLUG_COMMIT` as the variable the crate \"continues to use\" for backward compatibility, but `commit()` actually prefers `build_commit()` (`HEROKU_BUILD_COMMIT`) first and only falls back to `slug_commit()`. The wording is a leftover from before the build_commit preference was added and is now misleading about which variable is primary.","fix":"Update the `slug_commit` doc comment to state it is only the fallback, consistent with `commit()`.","locations":[{"ref":"crates/crates_io_heroku/src/lib.rs:48-51","code":"   48 | /// Note: `HEROKU_SLUG_COMMIT` is deprecated by Heroku in favor of\n   49 | /// `HEROKU_BUILD_COMMIT`, but this function continues to use\n   50 | /// `HEROKU_SLUG_COMMIT` for backward compatibility with existing\n   51 | /// deployments.","lines":4,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/crates/crates_io_heroku/src/lib.rs#L48-L51"}]},
{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"Comment on line 79 of `secret_scanning.rs` says `OkResponse`-style 'OwnerKind::User' restating the filter `crate_owners::owner_kind.eq(OwnerKind::User)` immediately to its left; it adds nothing. More notably, the doc above `send_trustpub_notification_emails` claims it gathers 'verified owner emails' which is correct, but the inline `// OwnerKind::User` is pure restatement of self-documenting code.","fix":"Remove the redundant trailing `// OwnerKind::User` comment.","locations":[{"ref":"src/controllers/github/secret_scanning.rs:271","code":"  271 |         .filter(crate_owners::owner_kind.eq(OwnerKind::User)) // OwnerKind::User","lines":1,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/controllers/github/secret_scanning.rs#L271"}]},
{"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"high","difficulty":"medium","description":"GitLab namespace identity is bound lazily and never verified against any GitLab API at config-creation time, unlike GitHub (which resolves `repository_owner_id` through the GitHub API in create.rs before storing). A freshly created GitLab config has `namespace_id = NULL`; the FIRST successful token exchange writes whatever `namespace_id` the presented JWT carries (exchange/mod.rs:295-310) and only SUBSEQUENT exchanges are checked against it. Consequently, between config creation and first use there is a window in which any actor able to obtain a valid GitLab OIDC token for a project whose path matches the configured `namespace/project` (e.g. after a namespace was deleted and re-registered by a different party, \"namespace resurrection\") can claim the config and publish. GitHub avoids this by binding `repository_owner_id` up front. This is a design gap, not a coding mistake, but it materially weakens GitLab trusted publishing relative to GitHub and should be documented and/or hardened.","fix":"Resolve and store the GitLab `namespace_id` at config-creation time via the GitLab API (mirroring the GitHub flow), so the binding is established before any token exchange rather than on first use.","locations":[{"ref":"src/controllers/trustpub/tokens/exchange/mod.rs:299-334","code":"  299 |     // First, handle resurrection protection by lazily storing namespace_id and\n  300 |     // verifying it on subsequent exchanges, before checking workflow/environment.\n  301 |     let configs_to_update: Vec<i32> = repo_configs\n  302 |         .iter()\n  303 |         .filter(|config| config.namespace_id.is_none())\n  304 |         .map(|config| config.id)\n  305 |         .collect();\n  306 | \n  307 |     if !configs_to_update.is_empty() {\n  308 |         diesel::update(trustpub_configs_gitlab::table)\n  309 |             .filter(trustpub_configs_gitlab::id.eq_any(&configs_to_update))\n  310 |             .filter(trustpub_configs_gitlab::namespace_id.is_null())\n  311 |             .set(trustpub_configs_gitlab::namespace_id.eq(&signed_claims.namespace_id))\n  312 |             .execute(conn)\n  313 |             .await?;\n  314 |     }\n  315 | \n  316 |     // Remove configs that have a stored namespace_id which doesn't match\n  317 |     let mismatched_namespace_ids: Vec<String> = repo_configs\n  318 |         .extract_if(.., |config| {\n  319 |             config\n  320 |                 .namespace_id\n  321 |                 .as_ref()\n  322 |                 .is_some_and(|stored| stored != &signed_claims.namespace_id)\n  323 |         })\n  324 |         .filter_map(|config| config.namespace_id)\n  325 |         .collect();\n  326 | \n  327 |     if repo_configs.is_empty() {\n  328 |         let message = format!(\n  329 |             \"The Trusted Publishing config for repository `{project_path}` does not match the namespace ID ({}) in the JWT. Expected namespace IDs: {}. Please recreate the Trusted Publishing config to update the namespace ID.\",\n  330 |             signed_claims.namespace_id,\n  331 |             mismatched_namespace_ids.join(\", \")\n  332 |         );\n  333 |         return Err(bad_request(message));\n  334 |     }","lines":36,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/controllers/trustpub/tokens/exchange/mod.rs#L299-L334"},{"ref":"src/controllers/trustpub/gitlab_configs/create.rs:90-100","code":"   90 |     // Save the new GitLab OIDC config to the database\n   91 | \n   92 |     let new_config = NewGitLabConfig {\n   93 |         crate_id: krate.id,\n   94 |         namespace: &json_config.namespace,\n   95 |         project: &json_config.project,\n   96 |         workflow_filepath: &json_config.workflow_filepath,\n   97 |         environment: json_config.environment.as_deref(),\n   98 |     };\n   99 | \n  100 |     let saved_config = new_config.insert(&conn).await?;","lines":11,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/controllers/trustpub/gitlab_configs/create.rs#L90-L100"}]},
{"id":"ARCH_2","type":"architecture","type_label":"Architecture","severity":"medium","difficulty":"medium","description":"real_ip middleware unconditionally trusts X-Forwarded-For: whatever process_xff_headers() extracts from request headers becomes the authoritative client IP, with no configured set of trusted proxy ranges visible at this layer. The resulting RealIp is then used for IP blocklisting (block_traffic::block_by_ip) and rate-limiting/abuse decisions. If the app is ever exposed without a stripping reverse proxy in front (or a proxy that does not overwrite XFF), a client can spoof X-Forwarded-For to evade IP blocks or impersonate another source IP. Trust must be anchored to known proxy hops.","fix":"Only honor X-Forwarded-For from trusted proxy source addresses (configurable CIDR allowlist), and parse the chain right-to-left skipping trusted hops; otherwise fall back to the socket peer address. Confirm crates_io_real_ip enforces this; if not, gate it here.","locations":[{"ref":"src/middleware/real_ip.rs:12-28","code":"   12 | pub async fn middleware(\n   13 |     ConnectInfo(socket_addr): ConnectInfo<SocketAddr>,\n   14 |     mut req: Request,\n   15 |     next: Next,\n   16 | ) -> impl IntoResponse {\n   17 |     let xff_ip = process_xff_headers(req.headers());\n   18 |     let real_ip = xff_ip\n   19 |         .inspect(|ip| debug!(target: \"real_ip\", \"Using X-Forwarded-For header as real IP: {ip}\"))\n   20 |         .unwrap_or_else(|| {\n   21 |             let ip = socket_addr.ip();\n   22 |             debug!(target: \"real_ip\", \"Using socket address as real IP: {ip}\");\n   23 |             ip\n   24 |         });\n   25 | \n   26 |     req.extensions_mut().insert(RealIp(real_ip));\n   27 | \n   28 |     next.run(req).await","lines":17,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/middleware/real_ip.rs#L12-L28"}]},
{"id":"OTHER_1","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"GitHub API path components are interpolated into request paths via `format!` without\npercent-encoding: `get_user(name)`, `org_by_name(org_name)`,\n`team_by_name(org_name, team_name)`, `team_membership(..., username)`, and\n`org_membership(..., username)`. A value containing `/`, `..`, or `?`/`#` could alter\nthe request path or query (path-segment injection), e.g. selecting a different endpoint\nthan intended. These names are normally validated GitHub identifiers, but the crate\nitself performs no validation or encoding, so safety depends entirely on every caller.","fix":"Percent-encode each user-controlled path segment (e.g. with\n`url::form_urlencoded`/`percent_encoding`) before interpolating, or validate that the\ninputs match the expected GitHub identifier pattern.","locations":[{"ref":"crates/crates_io_github/src/lib.rs:254-307","code":"  254 |     async fn get_user(&self, name: &str, auth: &GitHubAuth) -> Result<GitHubUser> {\n  255 |         let url = format!(\"/users/{name}\");\n  256 |         self.request(&url, auth).await\n  257 |     }\n  258 | \n  259 |     async fn get_user_by_id(&self, account_id: i64, auth: &GitHubAuth) -> Result<GitHubUser> {\n  260 |         let url = format!(\"/user/{account_id}\");\n  261 |         self.request(&url, auth).await\n  262 |     }\n  263 | \n  264 |     async fn org_by_name(&self, org_name: &str, auth: &GitHubAuth) -> Result<GitHubOrganization> {\n  265 |         let url = format!(\"/orgs/{org_name}\");\n  266 |         self.request(&url, auth).await\n  267 |     }\n  268 | \n  269 |     async fn team_by_name(\n  270 |         &self,\n  271 |         org_name: &str,\n  272 |         team_name: &str,\n  273 |         auth: &GitHubAuth,\n  274 |     ) -> Result<GitHubTeam> {\n  275 |         let url = format!(\"/orgs/{org_name}/teams/{team_name}\");\n  276 |         self.request(&url, auth).await\n  277 |     }\n  278 | \n  279 |     async fn team_membership(\n  280 |         &self,\n  281 |         org_id: i32,\n  282 |         team_id: i32,\n  283 |         username: &str,\n  284 |         auth: &GitHubAuth,\n  285 |     ) -> Result<Option<GitHubTeamMembership>> {\n  286 |         let url = format!(\"/organizations/{org_id}/team/{team_id}/memberships/{username}\");\n  287 |         match self.request(&url, auth).await {\n  288 |             Ok(membership) => Ok(Some(membership)),\n  289 |             // Officially how `false` is returned\n  290 |             Err(GitHubError::NotFound(_)) => Ok(None),\n  291 |             Err(err) => Err(err),\n  292 |         }\n  293 |     }\n  294 | \n  295 |     async fn org_membership(\n  296 |         &self,\n  297 |         org_id: i32,\n  298 |         username: &str,\n  299 |         auth: &GitHubAuth,\n  300 |     ) -> Result<Option<GitHubOrgMembership>> {\n  301 |         let url = format!(\"/organizations/{org_id}/memberships/{username}\");\n  302 |         match self.request(&url, auth).await {\n  303 |             Ok(membership) => Ok(Some(membership)),\n  304 |             Err(GitHubError::NotFound(_)) => Ok(None),\n  305 |             Err(err) => Err(err),\n  306 |         }\n  307 |     }","lines":54,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/crates/crates_io_github/src/lib.rs#L254-L307"},{"ref":"crates/crates_io_github/src/lib.rs:317-393","code":"  317 |     async fn get_ref(\n  318 |         &self,\n  319 |         owner: &str,\n  320 |         repo: &str,\n  321 |         ref_name: &str,\n  322 |         auth: &GitHubAuth,\n  323 |     ) -> Result<GitRef> {\n  324 |         let ref_path = ref_name.strip_prefix(\"refs/\").unwrap_or(ref_name);\n  325 |         let path = format!(\"/repos/{owner}/{repo}/git/ref/{ref_path}\");\n  326 |         self.request(&path, auth).await\n  327 |     }\n  328 | \n  329 |     async fn get_commit(\n  330 |         &self,\n  331 |         owner: &str,\n  332 |         repo: &str,\n  333 |         sha: &str,\n  334 |         auth: &GitHubAuth,\n  335 |     ) -> Result<GitCommit> {\n  336 |         let path = format!(\"/repos/{owner}/{repo}/git/commits/{sha}\");\n  337 |         self.request(&path, auth).await\n  338 |     }\n  339 | \n  340 |     async fn create_commit<'a>(\n  341 |         &self,\n  342 |         owner: &str,\n  343 |         repo: &str,\n  344 |         input: &CreateCommit<'a>,\n  345 |         auth: &GitHubAuth,\n  346 |     ) -> Result<GitCommit> {\n  347 |         let path = format!(\"/repos/{owner}/{repo}/git/commits\");\n  348 |         self._mutate(reqwest::Method::POST, &path, input, auth)\n  349 |             .await\n  350 |     }\n  351 | \n  352 |     async fn create_ref(\n  353 |         &self,\n  354 |         owner: &str,\n  355 |         repo: &str,\n  356 |         ref_name: &str,\n  357 |         sha: &str,\n  358 |         auth: &GitHubAuth,\n  359 |     ) -> Result<GitRef> {\n  360 |         #[derive(Serialize)]\n  361 |         struct Body<'a> {\n  362 |             #[serde(rename = \"ref\")]\n  363 |             ref_name: &'a str,\n  364 |             sha: &'a str,\n  365 |         }\n  366 | \n  367 |         let path = format!(\"/repos/{owner}/{repo}/git/refs\");\n  368 |         let body = Body { ref_name, sha };\n  369 |         self._mutate(reqwest::Method::POST, &path, &body, auth)\n  370 |             .await\n  371 |     }\n  372 | \n  373 |     async fn update_ref(\n  374 |         &self,\n  375 |         owner: &str,\n  376 |         repo: &str,\n  377 |         ref_name: &str,\n  378 |         sha: &str,\n  379 |         force: bool,\n  380 |         auth: &GitHubAuth,\n  381 |     ) -> Result<GitRef> {\n  382 |         #[derive(Serialize)]\n  383 |         struct Body<'a> {\n  384 |             sha: &'a str,\n  385 |             force: bool,\n  386 |         }\n  387 | \n  388 |         let ref_path = ref_name.strip_prefix(\"refs/\").unwrap_or(ref_name);\n  389 |         let path = format!(\"/repos/{owner}/{repo}/git/refs/{ref_path}\");\n  390 |         let body = Body { sha, force };\n  391 |         self._mutate(reqwest::Method::PATCH, &path, &body, auth)\n  392 |             .await\n  393 |     }","lines":77,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/crates/crates_io_github/src/lib.rs#L317-L393"}]},
{"id":"OTHER_2","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"Multi-audience JWTs are rejected only as a side effect of `aud` being typed as `String` in the claims struct, so a token whose `aud` is a JSON array fails with a confusing serde error (\"invalid type: sequence, expected a string\") rather than a clear audience-validation error (see the `test_decode_multi_audience` tests). While safe, the OIDC spec permits `aud` to be an array, and a legitimate issuer that ever emits an array-valued audience containing crates.io would be rejected. This is a robustness/spec-conformance gap relying on a type quirk for security-relevant behavior.","fix":"Deserialize `aud` as a type that accepts both string and array forms and explicitly require that the configured audience is the sole/expected entry, returning a clear audience error.","locations":[{"ref":"crates/crates_io_trustpub/src/github/claims.rs:17","code":"   17 |     pub aud: String,","lines":1,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/crates/crates_io_trustpub/src/github/claims.rs#L17"},{"ref":"crates/crates_io_trustpub/src/gitlab/claims.rs:17","code":"   17 |     pub aud: String,","lines":1,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/crates/crates_io_trustpub/src/gitlab/claims.rs#L17"}]}
