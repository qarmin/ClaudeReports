<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`relative_index_file_helper` slices the crate name by byte offsets (`&name[..1]`,\n`&name[0..2]`, `&name[2..4]`) but `match name.len()` is a byte length, not a char\ncount. For a name containing multi-byte UTF-8 characters these byte indices can fall\ninside a character boundary and panic. Example: a 3-byte single-character name like\n`\"€\"` makes the `len() == 3` arm execute `&name[..1]`, which panics; a 4-byte\ntwo-character name (e.g. two 2-byte chars) makes the `_` arm execute `&name[0..2]` /\n`&name[2..4]`, splitting the chars and panicking. This is reachable from the public\n`relative_index_file`, `relative_index_file_for_url`, `read_entry`, `upsert_entry`,\nand `remove_entry` APIs which all accept an arbitrary `&str` crate name. The\n`to_lowercase()` step does not guarantee ASCII output.","fix":"Operate on character boundaries, not byte indices, or restrict the function to\nvalidated ASCII names. For example use `name.chars()` / `char_indices()` to take the\nfirst 1/2/4 characters, or assert the name is ASCII before slicing and return an error\notherwise instead of panicking.","locations":[{"ref":"crates/crates_io_index/src/repo.rs:163-170","code":"  163 |     fn relative_index_file_helper(name: &str) -> Vec<&str> {\n  164 |         match name.len() {\n  165 |             1 => vec![\"1\", name],\n  166 |             2 => vec![\"2\", name],\n  167 |             3 => vec![\"3\", &name[..1], name],\n  168 |             _ => vec![&name[0..2], &name[2..4], name],\n  169 |         }\n  170 |     }","lines":8,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/crates/crates_io_index/src/repo.rs#L163-L170"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`http_backend` parses the raw stdout of `git http-backend` with several unchecked unwraps that will panic (crashing the worker task) on malformed CGI output: `line.split_once(':').unwrap()` panics on a header line without a colon; `&value[1..]` panics (byte index out of bounds / not on a char boundary) when the header value after the colon is empty; and `key.parse::<HeaderName>().unwrap()` / `HeaderValue::from_str(value).unwrap()` panic on any header name/value that is not valid. While git output is normally well-formed, a panic here is avoidable and turns a parsing edge case into a task crash rather than a 500.","fix":"Replace the unwraps with graceful error handling returning `StatusCode::INTERNAL_SERVER_ERROR`: skip/ignore lines that don't `split_once(':')`, use `value.strip_prefix(' ').unwrap_or(value)` instead of `&value[1..]`, and `?`/`map_err` the header name/value parsing.","locations":[{"ref":"src/controllers/git.rs:61-66","code":"   61 |             let (key, value) = line.split_once(':').unwrap();\n   62 |             let value = &value[1..];\n   63 |             headers.insert(\n   64 |                 key.parse::<HeaderName>().unwrap(),\n   65 |                 HeaderValue::from_str(value).unwrap(),\n   66 |             );","lines":6,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/controllers/git.rs#L61-L66"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`process_tarball()` is documented to guarantee a `package` section, but the subsequent `.as_local().unwrap()` calls assume every optional manifest field that is present resolves to a local (non-inherited) value. `process_tarball` is said to reject inheritance, but these unwraps still assume that invariant holds for every field (version, description, license, license_file, homepage, documentation, repository, rust_version, edition, keywords, categories). If the tarball-processing layer ever fails to strip an inherited/workspace value for any of these fields (attacker-controlled upload), the unwrap panics and takes down the worker thread handling the publish request instead of returning a 400. These are attacker-controllable inputs reaching `unwrap()`.","fix":"Replace the chain of `.as_local().unwrap()` calls with proper error handling that maps a non-local/inherited value to `bad_request(...)`, so malformed manifests return 400 instead of panicking.","locations":[{"ref":"src/controllers/krate/publish.rs:282-307","code":"  282 |     let package = tarball_info.manifest.package.unwrap();\n  283 |     if package.name != metadata.name {\n  284 |         let message = format!(\n  285 |             \"metadata name `{}` does not match manifest name `{}`\",\n  286 |             metadata.name, package.name\n  287 |         );\n  288 |         return Err(bad_request(message));\n  289 |     }\n  290 | \n  291 |     let manifest_version = package.version.map(|it| it.as_local().unwrap()).unwrap();\n  292 |     if manifest_version != metadata.vers {\n  293 |         let message = format!(\n  294 |             \"metadata version `{}` does not match manifest version `{manifest_version}`\",\n  295 |             metadata.vers\n  296 |         );\n  297 |         return Err(bad_request(message));\n  298 |     }\n  299 | \n  300 |     let description = package.description.map(|it| it.as_local().unwrap());\n  301 |     let mut license = package.license.map(|it| it.as_local().unwrap());\n  302 |     let license_file = package.license_file.map(|it| it.as_local().unwrap());\n  303 |     let homepage = package.homepage.map(|it| it.as_local().unwrap());\n  304 |     let documentation = package.documentation.map(|it| it.as_local().unwrap());\n  305 |     let repository = package.repository.map(|it| it.as_local().unwrap());\n  306 |     let rust_version = package.rust_version.map(|rv| rv.as_local().unwrap());\n  307 |     let edition = package.edition.map(|rv| rv.as_local().unwrap());","lines":26,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/controllers/krate/publish.rs#L282-L307"},{"ref":"src/controllers/krate/publish.rs:361-364","code":"  361 |     let keywords = package\n  362 |         .keywords\n  363 |         .map(|it| it.as_local().unwrap())\n  364 |         .unwrap_or_default();","lines":4,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/controllers/krate/publish.rs#L361-L364"},{"ref":"src/controllers/krate/publish.rs:380-383","code":"  380 |     let categories = package\n  381 |         .categories\n  382 |         .map(|it| it.as_local().unwrap())\n  383 |         .unwrap_or_default();","lines":4,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/controllers/krate/publish.rs#L380-L383"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"EMAIL_ENV is a LazyLock that reads `src/email/templates` from the filesystem with `.expect(...)`/panic on every error (missing directory, unreadable file, invalid UTF-8 filename, template parse error). Because it is lazily initialized on first email send rather than at boot, a packaging/CWD issue where the templates directory is not present surfaces as a panic inside a request/worker task the first time an email is sent, not at startup. Templates are loaded relative to the process CWD (`src/email/templates`), which is fragile in production deployments.","fix":"Embed templates at compile time (include_dir/RustEmbed) or load them eagerly at startup and fail the health check; do not depend on the runtime CWD for a request-path resource.","locations":[{"ref":"src/email.rs:17-81","code":"   17 | static EMAIL_ENV: LazyLock<Environment<'static>> = LazyLock::new(|| {\n   18 |     let mut env = Environment::new();\n   19 | \n   20 |     // Load templates from the templates directory\n   21 |     let entries = std::fs::read_dir(\"src/email/templates\");\n   22 |     let entries = entries.expect(\"Failed to read email templates directory\");\n   23 | \n   24 |     for entry in entries {\n   25 |         let entry = entry.expect(\"Failed to read directory entry\");\n   26 | \n   27 |         let path = entry.path();\n   28 |         let file_type = entry.file_type().expect(\"Failed to get file type\");\n   29 | \n   30 |         // Handle base template files\n   31 |         if file_type.is_file() && path.extension().and_then(|s| s.to_str()) == Some(\"j2\") {\n   32 |             let template_name = entry.file_name();\n   33 |             let template_name = template_name.to_str();\n   34 |             let template_name = template_name.expect(\"Invalid UTF-8 in template filename\");\n   35 | \n   36 |             let template_contents = std::fs::read_to_string(&path)\n   37 |                 .unwrap_or_else(|error| panic!(\"Failed to read template {template_name}: {error}\"));\n   38 | \n   39 |             env.add_template_owned(template_name.to_string(), template_contents)\n   40 |                 .expect(\"Failed to add template\");\n   41 |         }\n   42 | \n   43 |         if !file_type.is_dir() {\n   44 |             continue;\n   45 |         }\n   46 | \n   47 |         // Handle email template directories\n   48 |         let dir_name = entry.file_name();\n   49 |         let email_name = dir_name.to_str();\n   50 |         let email_name = email_name.expect(\"Invalid UTF-8 in email template directory name\");\n   51 | \n   52 |         // Load subject.txt.j2 file\n   53 |         let subject_path = path.join(\"subject.txt.j2\");\n   54 |         let subject_contents = std::fs::read_to_string(&subject_path).unwrap_or_else(|error| {\n   55 |             panic!(\"Failed to read subject template for {email_name}: {error}\")\n   56 |         });\n   57 |         let filename = format!(\"{email_name}/subject.txt.j2\");\n   58 |         env.add_template_owned(filename, subject_contents)\n   59 |             .expect(\"Failed to add subject template\");\n   60 | \n   61 |         // Load body.txt.j2 file\n   62 |         let body_path = path.join(\"body.txt.j2\");\n   63 |         let body_contents = std::fs::read_to_string(&body_path).unwrap_or_else(|error| {\n   64 |             panic!(\"Failed to read body template for {email_name}: {error}\")\n   65 |         });\n   66 |         let filename = format!(\"{email_name}/body.txt.j2\");\n   67 |         env.add_template_owned(filename, body_contents)\n   68 |             .expect(\"Failed to add body template\");\n   69 | \n   70 |         // Load body.html.j2 file\n   71 |         let html_path = path.join(\"body.html.j2\");\n   72 |         let html_contents = std::fs::read_to_string(&html_path).unwrap_or_else(|error| {\n   73 |             panic!(\"Failed to read HTML body template for {email_name}: {error}\")\n   74 |         });\n   75 |         let filename = format!(\"{email_name}/body.html.j2\");\n   76 |         env.add_template_owned(filename, html_contents)\n   77 |             .expect(\"Failed to add HTML body template\");\n   78 |     }\n   79 | \n   80 |     env\n   81 | });","lines":65,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/email.rs#L17-L81"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"families_to_json_events panics via `panic!(\"unsupported metric type\")` on any metric family that is not COUNTER/GAUGE/HISTOGRAM (e.g. SUMMARY/UNTYPED). LogEncoder::encode is the production Heroku metrics path, so a single unexpected metric type crashes the scrape/encoding path. The sibling datadog.rs deliberately logs-and-skips unsupported types, making this inconsistent and riskier.","fix":"Log a warning and skip/continue on unsupported metric types instead of panicking, matching datadog.rs.","locations":[{"ref":"src/metrics/log_encoder.rs:115-117","code":"  115 |                 other => {\n  116 |                     panic!(\"unsupported metric type: {other:?}\")\n  117 |                 }","lines":3,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/metrics/log_encoder.rs#L115-L117"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"normalize_path_inner re-parses the rebuilt path-and-query with `.parse().unwrap()`. The path is attacker-controlled and reconstructed via PathBuf/to_string_lossy, which can introduce characters (e.g. U+FFFD, or sequences invalid in a URI) that fail PathAndQuery parsing, panicking the request task on crafted input. CatchPanicLayer turns this into a 500, but it is needless per-request panic/log noise driven by untrusted input.","fix":"Use `if let Ok(paq) = format!(...).parse()` and skip normalization (leave the original URI) on parse failure instead of unwrapping.","locations":[{"ref":"src/middleware/normalize_path.rs:48-55","code":"   48 |         let new_path_and_query = uri.path_and_query().map(|path_and_query| {\n   49 |             match path_and_query.query() {\n   50 |                 Some(query) => format!(\"{path}?{query}\"),\n   51 |                 None => path,\n   52 |             }\n   53 |             .parse()\n   54 |             .unwrap()\n   55 |         });","lines":8,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/middleware/normalize_path.rs#L48-L55"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"check_rate_limit computes `retry_after = bucket.last_refill + chrono::Duration::from_std(rate).unwrap()`. `chrono::Duration::from_std` returns Err if the std Duration exceeds chrono's representable range. The `rate` originates from configuration (RATE_LIMIT_* env vars / config). A misconfigured very large rate duration would panic the request thread on every rate-limited response. Request-time unwrap on config-derived data.","fix":"Use `chrono::Duration::from_std(...).unwrap_or_else(|_| chrono::Duration::max_value())` or validate the configured rate at startup so it cannot exceed chrono's range.","locations":[{"ref":"src/rate_limiter.rs:90-95","code":"   90 |             Err(Box::new(TooManyRequests {\n   91 |                 action: performed_action,\n   92 |                 retry_after: bucket.last_refill\n   93 |                     + chrono::Duration::from_std(self.config_for_action(performed_action).rate)\n   94 |                         .unwrap(),\n   95 |             }))","lines":6,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/rate_limiter.rs#L90-L95"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"StorageConfig::from_environment uses `.unwrap()` on several required_var()/current_dir() calls (S3_INDEX_BUCKET, AWS_ACCESS_KEY, AWS_SECRET_KEY, current_dir). Storage::from_config additionally `panic!`s on missing S3_CDN and `.unwrap()`s LocalFileSystem/S3 builder results. These run at boot so failing fast is mostly acceptable, but they discard the structured error and produce a bare panic message instead of a clean startup error; the `panic!(\"Missing S3_CDN ...\")` is reached only after S3 clients are already built (wasted work) and is inconsistent with the Option-returning style used in cloudfront.rs.","fix":"Return a Result from from_environment/from_config and surface a single clean startup error; move the S3_CDN presence check before building the S3 clients.","locations":[{"ref":"src/storage.rs:70-116","code":"   70 |     pub fn from_environment() -> Self {\n   71 |         if let Ok(bucket) = dotenvy::var(\"S3_BUCKET\") {\n   72 |             let region = dotenvy::var(\"S3_REGION\").ok();\n   73 |             let cdn_prefix = dotenvy::var(\"S3_CDN\").ok();\n   74 | \n   75 |             let index_bucket = required_var(\"S3_INDEX_BUCKET\").unwrap();\n   76 |             let index_region = dotenvy::var(\"S3_INDEX_REGION\").ok();\n   77 | \n   78 |             let access_key = required_var(\"AWS_ACCESS_KEY\").unwrap();\n   79 |             let secret_key: SecretString = required_var(\"AWS_SECRET_KEY\").unwrap().into();\n   80 | \n   81 |             let default = S3Config {\n   82 |                 bucket,\n   83 |                 region,\n   84 |                 access_key: access_key.clone(),\n   85 |                 secret_key: secret_key.clone(),\n   86 |             };\n   87 | \n   88 |             let index = S3Config {\n   89 |                 bucket: index_bucket,\n   90 |                 region: index_region,\n   91 |                 access_key,\n   92 |                 secret_key,\n   93 |             };\n   94 | \n   95 |             let backend = StorageBackend::S3 { default, index };\n   96 | \n   97 |             return Self {\n   98 |                 backend,\n   99 |                 cdn_prefix,\n  100 |             };\n  101 |         }\n  102 | \n  103 |         let current_dir = std::env::current_dir()\n  104 |             .context(\"Failed to read the current directory\")\n  105 |             .unwrap();\n  106 | \n  107 |         let path = current_dir.join(\"local_uploads\");\n  108 | \n  109 |         let backend = StorageBackend::LocalFileSystem { path };\n  110 | \n  111 |         Self {\n  112 |             backend,\n  113 |             cdn_prefix: None,\n  114 |         }\n  115 |     }\n  116 | }","lines":47,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/storage.rs#L70-L116"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"The HTTP-client constructors build reqwest clients (and a TLS certificate) with `.unwrap()`: `RealDocsRsClient::new`, `Fastly::new`, and `TeamRepoImpl::build_client` (including `Certificate::from_pem(...).unwrap()`). A reqwest/TLS backend initialization failure would panic the process at construction time rather than surfacing a recoverable error.","fix":"Return a `Result` from the constructors and propagate the build error, or document why a startup panic is acceptable here.","locations":[{"ref":"crates/crates_io_docs_rs/src/lib.rs:51-54","code":"   51 |             client: reqwest::Client::builder()\n   52 |                 .user_agent(crates_io_version::user_agent())\n   53 |                 .build()\n   54 |                 .unwrap(),","lines":4,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/crates/crates_io_docs_rs/src/lib.rs#L51-L54"},{"ref":"crates/crates_io_fastly/src/lib.rs:43-46","code":"   43 |         let client = ClientBuilder::new()\n   44 |             .user_agent(user_agent())\n   45 |             .build()\n   46 |             .unwrap();","lines":4,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/crates/crates_io_fastly/src/lib.rs#L43-L46"},{"ref":"crates/crates_io_team_repo/src/lib.rs:44-52","code":"   44 | fn build_client() -> Client {\n   45 |     let x1_cert = Certificate::from_pem(certs::ISRG_ROOT_X1).unwrap();\n   46 |     let x2_cert = Certificate::from_pem(certs::ISRG_ROOT_X2).unwrap();\n   47 | \n   48 |     Client::builder()\n   49 |         .tls_certs_only([x1_cert, x2_cert])\n   50 |         .build()\n   51 |         .unwrap()\n   52 | }","lines":9,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/crates/crates_io_team_repo/src/lib.rs#L44-L52"}]},
{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`RepositoryConfig::from_environment` uses `.expect(...)` when base64-decoding the SSH\nkey and when converting the decoded bytes to UTF-8. A malformed `GIT_SSH_KEY`\nenvironment variable (bad base64 or non-UTF-8 content) will panic the process at\nstartup instead of returning the `anyhow::Result` that the function signature promises.","fix":"Replace both `.expect()` calls with `?` and `.context(...)` so a bad key value returns an error instead of panicking.","locations":[{"ref":"crates/crates_io_index/src/repo.rs:35-39","code":"   35 |                 let key = general_purpose::STANDARD\n   36 |                     .decode(ssh_key.expose_secret())\n   37 |                     .expect(\"failed to base64 decode the ssh key\");\n   38 |                 let key =\n   39 |                     String::from_utf8(key).expect(\"failed to convert the ssh key to a string\");","lines":5,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/crates/crates_io_index/src/repo.rs#L35-L39"}]},
{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`get_files_modified_since` calls `file.path().unwrap()` on each diff delta's new file.\n`git2::DiffFile::path()` returns `Option<&Path>` and is `None` when the path is not\nvalid UTF-8 (libgit2 only exposes the path through the UTF-8 accessor). A non-UTF-8\npath in the index tree would therefore panic instead of producing an error. The index\nis trusted, so impact is limited, but it is an avoidable unwrap on data derived from a\nremote git repository.","fix":"Use `filter_map` and skip (or error on) deltas whose `new_file().path()` is `None` instead of unwrapping.","locations":[{"ref":"crates/crates_io_index/src/repo.rs:322-327","code":"  322 |         let files = diff\n  323 |             .deltas()\n  324 |             .map(|delta| delta.new_file())\n  325 |             .filter(|file| file.exists())\n  326 |             .map(|file| file.path().unwrap().to_path_buf())\n  327 |             .collect();","lines":6,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/crates/crates_io_index/src/repo.rs#L322-L327"}]},
{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"authenticate_via_cookie uses `.expect(\"missing cookie session\")` on the SessionExtension. This relies on the session middleware always running before authentication. If route wiring ever changes so that an authenticated handler is reachable without the session layer, every request to it panics. It is reachable indirectly from request handling rather than being a pure boot-time invariant.","fix":"Return an internal error (or treat as no session) instead of panicking when the SessionExtension is absent.","locations":[{"ref":"src/auth.rs:263-266","code":"  263 |     let session = parts\n  264 |         .extensions()\n  265 |         .get::<SessionExtension>()\n  266 |         .expect(\"missing cookie session\");","lines":4,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/auth.rs#L263-L266"}]},
{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In the blocking closure of `http_backend`, `p.stdin.take().unwrap()` and `p.stdout.take().unwrap()` unwrap the child's piped handles. These are configured just above so they are normally present, but if the handles were already taken or unavailable this panics inside the spawned task. Minor, but consistent with the other fragile error handling in this function.","fix":"Use `ok_or(StatusCode::INTERNAL_SERVER_ERROR)?` on `.take()` instead of `.unwrap()`.","locations":[{"ref":"src/controllers/git.rs:44-52","code":"   44 |         std::io::copy(&mut body_reader, &mut p.stdin.take().unwrap())\n   45 |             .map_err(|_| StatusCode::INTERNAL_SERVER_ERROR)?;\n   46 | \n   47 |         // Parse the headers coming out, and the pass through the rest of the\n   48 |         // process back down the stack.\n   49 |         //\n   50 |         // Note that we have to be careful to not drop the process which will wait\n   51 |         // for the process to exit (and we haven't read stdout)\n   52 |         let mut rdr = std::io::BufReader::new(p.stdout.take().unwrap());","lines":9,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/controllers/git.rs#L44-L52"}]},
{"id":"PANIC_14","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`relevance_candidate_ids` and several `seek_after` branches call `self.q_string.as_ref().expect(\"q_string should not be None\")`. These are only reached when a relevance/query sort is active, which implies `q_string` is set, but the invariant is enforced implicitly by control flow far away from these `expect()` calls. If a future refactor lets a `Seek::Relevance`/`Seek::Query` payload be produced without `q_string`, an attacker-supplied seek token could trigger a panic. The coupling between seek state and `q_string` presence is fragile.","fix":"Carry `q_string` inside the relevance/query seek state (or pass it explicitly) so the relationship is type-enforced, eliminating the `expect()`.","locations":[{"ref":"src/controllers/krate/search.rs:543","code":"  543 |         let q_string = self.q_string.as_ref().expect(\"q_string should not be None\");","lines":1,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/controllers/krate/search.rs#L543"},{"ref":"src/controllers/krate/search.rs:676","code":"  676 |                 let q_string = self.q_string.as_ref().expect(\"q_string should not be None\");","lines":1,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/controllers/krate/search.rs#L676"},{"ref":"src/controllers/krate/search.rs:710","code":"  710 |                 let q_string = self.q_string.as_ref().expect(\"q_string should not be None\");","lines":1,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/controllers/krate/search.rs#L710"}]},
{"id":"PANIC_15","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"connection_url uses `Url::parse(config.url.expose_secret()).expect(\"Invalid database URL\")`. A malformed DATABASE_URL panics at boot with the connection URL potentially included in the panic/backtrace context; expose_secret() pulls the secret out for parsing. Boot-time, but the secret database URL should not be at risk of appearing in a panic message.","fix":"Return a Result and produce a redacted error message that does not echo the URL on parse failure.","locations":[{"ref":"src/db.rs:26-27","code":"   26 | pub fn connection_url(config: &config::DbPoolConfig) -> String {\n   27 |     let mut url = Url::parse(config.url.expose_secret()).expect(\"Invalid database URL\");","lines":2,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/db.rs#L26-L27"}]},
{"id":"PANIC_16","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"XRequestId::encode does `HeaderValue::from_str(&self.0).unwrap()`. The String was originally decoded from a header via to_str() (so it is ASCII/valid at decode time), but XRequestId is a public type and nothing prevents constructing/round-tripping a value that fails from_str (e.g. if the struct is built from another source). Encoding then panics. Header encode paths should not panic on value content.","fix":"Handle the from_str error gracefully (skip/encode a sanitized value) instead of unwrapping in the Header::encode implementation.","locations":[{"ref":"src/headers.rs:30-36","code":"   30 |     fn encode<E>(&self, values: &mut E)\n   31 |     where\n   32 |         E: Extend<HeaderValue>,\n   33 |     {\n   34 |         let value = HeaderValue::from_str(&self.0).unwrap();\n   35 |         values.extend(std::iter::once(value));\n   36 |     }","lines":7,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/headers.rs#L30-L36"}]},
{"id":"PANIC_17","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"frontend_html init_template_env panics if svelte/build/200.html is missing/unreadable. TEMPLATE_ENV is lazily initialized on the first HTML request, so a misconfigured deployment panics on the first user request instead of failing fast at boot.","fix":"Load and validate the template eagerly at startup so a missing template fails boot/health checks.","locations":[{"ref":"src/middleware/frontend_html.rs:38-53","code":"   38 | async fn init_template_env() -> Arc<minijinja::Environment<'static>> {\n   39 |     let mut env = minijinja::Environment::empty();\n   40 | \n   41 |     let template = tokio::fs::read_to_string(TEMPLATE_PATH)\n   42 |         .await\n   43 |         .unwrap_or_else(|err| {\n   44 |             panic!(\n   45 |                 \"Error loading {TEMPLATE_PATH} template: {err}. Is the Svelte frontend built yet?\"\n   46 |             )\n   47 |         });\n   48 | \n   49 |     env.add_template_owned(TEMPLATE_NAME, template)\n   50 |         .expect(\"Error loading template\");\n   51 | \n   52 |     Arc::new(env)\n   53 | }","lines":16,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/middleware/frontend_html.rs#L38-L53"},{"ref":"src/middleware/frontend_html.rs:62-64","code":"   62 | pub async fn serve(state: AppState, request: Request, next: Next) -> Response {\n   63 |     static TEMPLATE_ENV: LazyLock<TemplateEnvFut> =\n   64 |         LazyLock::new(|| init_template_env().boxed().shared());","lines":3,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/middleware/frontend_html.rs#L62-L64"}]},
{"id":"PANIC_18","type":"panic","type_label":"Panic","severity":"negligible","difficulty":"medium","description":"`head_oid` unwraps `head.target()`, which is `None` for a symbolic HEAD reference.\nIn a bare clone HEAD normally resolves to a commit, so this is unlikely in practice,\nbut a repository whose HEAD is unexpectedly symbolic would panic rather than error.","fix":"Return an error (e.g. `head.target().context(\"HEAD is not a direct reference\")?`) instead of unwrapping.","locations":[{"ref":"crates/crates_io_index/src/repo.rs:281-285","code":"  281 |     pub fn head_oid(&self) -> anyhow::Result<git2::Oid> {\n  282 |         let repo = &self.repository;\n  283 |         let head = repo.head().context(\"Failed to read HEAD reference\")?;\n  284 |         Ok(head.target().unwrap())\n  285 |     }","lines":5,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/crates/crates_io_index/src/repo.rs#L281-L285"}]},
{"id":"PANIC_19","type":"panic","type_label":"Panic","severity":"negligible","difficulty":"medium","description":"create_database_pool ends with `.build().unwrap()` and the ServiceMetrics/InstanceMetrics builder defaults use `.expect(...)`. github_oauth_from_config uses `AuthUrl::new(...).unwrap()`/`TokenUrl::new(...).unwrap()` on constant strings. All are boot-time on constants/validated config, so low risk, but they panic rather than returning a startup error.","fix":"Propagate startup errors via Result where practical; the constant URL unwraps are acceptable but could use expect with context.","locations":[{"ref":"src/app.rs:180-187","code":"  180 |     DeadpoolPool::builder(manager)\n  181 |         .runtime(Runtime::Tokio1)\n  182 |         .max_size(config.pool_size)\n  183 |         .wait_timeout(Some(config.connection_timeout))\n  184 |         .post_create(connection_config)\n  185 |         .build()\n  186 |         .unwrap()\n  187 | }","lines":8,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/app.rs#L180-L187"},{"ref":"src/app.rs:66-71","code":"   66 |     #[builder(default = ServiceMetrics::new().expect(\"could not initialize service metrics\"))]\n   67 |     pub service_metrics: ServiceMetrics,\n   68 | \n   69 |     /// Metrics related to this specific instance of the service\n   70 |     #[builder(default = InstanceMetrics::new().expect(\"could not initialize instance metrics\"))]\n   71 |     pub instance_metrics: InstanceMetrics,","lines":6,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/app.rs#L66-L71"},{"ref":"src/app.rs:87-90","code":"   87 |         let auth_url = \"https://github.com/login/oauth/authorize\";\n   88 |         let auth_url = AuthUrl::new(auth_url.into()).unwrap();\n   89 |         let token_url = \"https://github.com/login/oauth/access_token\";\n   90 |         let token_url = TokenUrl::new(token_url.into()).unwrap();","lines":4,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/app.rs#L87-L90"}]},
{"id":"PANIC_20","type":"panic","type_label":"Panic","severity":"negligible","difficulty":"medium","description":"`RepositoryLock`'s `Deref`/`DerefMut` call `self.repo.as_ref().unwrap()` / `as_mut().unwrap()`. This is sound today because `lock_index()` always sets the `Option` to `Some` before constructing the lock, but the invariant is implicit: any future code path that hands out a `RepositoryLock` wrapping a `None` would panic on every deref.","fix":"Consider storing the lock as a guard over a guaranteed-initialised value, or add a debug_assert/expect with a message documenting the invariant.","locations":[{"ref":"src/worker/environment.rs:142-154","code":"  142 | impl Deref for RepositoryLock<'_> {\n  143 |     type Target = Repository;\n  144 | \n  145 |     fn deref(&self) -> &Self::Target {\n  146 |         self.repo.as_ref().unwrap()\n  147 |     }\n  148 | }\n  149 | \n  150 | impl DerefMut for RepositoryLock<'_> {\n  151 |     fn deref_mut(&mut self) -> &mut Self::Target {\n  152 |         self.repo.as_mut().unwrap()\n  153 |     }\n  154 | }","lines":13,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/worker/environment.rs#L142-L154"},{"ref":"src/worker/environment.rs:55-78","code":"   55 | impl Environment {\n   56 |     #[instrument(skip_all)]\n   57 |     pub fn lock_index(&self) -> anyhow::Result<RepositoryLock<'_>> {\n   58 |         let lock_start = Instant::now();\n   59 |         let mut repo = self.repository.lock();\n   60 |         info!(duration = lock_start.elapsed().as_nanos(), \"Index locked\");\n   61 | \n   62 |         if repo.is_none() {\n   63 |             info!(\"Cloning index\");\n   64 |             let clone_start = Instant::now();\n   65 | \n   66 |             // The worker only ever reads the current tip and commits/pushes on\n   67 |             // top of it, so a shallow clone is sufficient and avoids fetching\n   68 |             // the large index history.\n   69 |             *repo = Some(Repository::open_shallow(&self.repository_config)?);\n   70 | \n   71 |             let clone_duration = clone_start.elapsed();\n   72 |             info!(duration = clone_duration.as_nanos(), \"Index cloned\");\n   73 |         }\n   74 | \n   75 |         let repo_lock = RepositoryLock { repo };\n   76 |         repo_lock.reset_head()?;\n   77 |         Ok(repo_lock)\n   78 |     }","lines":24,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/worker/environment.rs#L55-L78"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"The retry-backoff SQL filter computes `power(2, retries)` where `power` is declared as `fn power(x: Integer, y: Integer) -> Integer` (i32) and `retries` is an Int4 column with no cap. At `retries = 31` the i32 `power` overflows and Postgres raises an \"integer out of range\" error; the interval multiplication `1 minute * 2^retries` overflows far earlier. Once a job in a queue accumulates a large retry count, `find_next_unlocked_job`'s `retriable()` filter raises a runtime SQL error, so the worker can no longer dequeue ANY job whose `job_type` is in that batch - the queue stalls. There is no cap on the retry counter or on the computed backoff interval.","fix":"Cap the exponent before exponentiating, e.g. `power(2, least(background_jobs::retries, 20))`, and/or compute on bigint and clamp the resulting interval. This prevents both the i32 power overflow and the interval-multiplication overflow.","locations":[{"ref":"crates/crates_io_worker/src/storage.rs:16-25","code":"   16 | fn retriable() -> Box<dyn BoxableExpression<background_jobs::table, Pg, SqlType = Bool>> {\n   17 |     use diesel::dsl::*;\n   18 | \n   19 |     define_sql_function!(fn power(x: Integer, y: Integer) -> Integer);\n   20 | \n   21 |     Box::new(\n   22 |         background_jobs::last_retry\n   23 |             .lt(now - 1.minute().into_sql::<Interval>() * power(2, background_jobs::retries)),\n   24 |     )\n   25 | }","lines":10,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/crates/crates_io_worker/src/storage.rs#L16-L25"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"`save_to_version_downloads` upserts download counts with `version_downloads.downloads + EXCLUDED.downloads`. The `version_downloads.downloads` column is `Int4` (i32, signed 32-bit) in Postgres. For very popular crate/version/date rows the accumulated sum can exceed i32::MAX (~2.1 billion). When that happens Postgres raises `integer out of range`, which fails the whole `ProcessCdnLog` job. Because the log file is only marked processed inside the same transaction that performs this insert, the failure rolls back the `processed_log_files` insert too, so the job is retried forever and that CDN log file can never be processed - blocking all later download accounting that depends on it.","fix":"Widen the `version_downloads.downloads` (and `counted`) columns to BIGINT, or clamp/saturate the summed value. At minimum, handle the overflow error so a single oversized row does not wedge the job permanently.","locations":[{"ref":"src/worker/jobs/downloads/process_log.rs:319-325","code":"  319 |                 INSERT INTO version_downloads (version_id, date, downloads)\n  320 |                 SELECT joined_data.id, joined_data.date, joined_data.downloads\n  321 |                 FROM joined_data\n  322 |                 WHERE joined_data.id IS NOT NULL\n  323 |                 ORDER BY joined_data.id, joined_data.date\n  324 |                 ON CONFLICT (version_id, date)\n  325 |                 DO UPDATE SET downloads = version_downloads.downloads + EXCLUDED.downloads","lines":7,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/worker/jobs/downloads/process_log.rs#L319-L325"},{"ref":"crates/crates_io_database/src/schema.rs:1061-1066","code":" 1061 |         /// The `downloads` column of the `version_downloads` table.\n 1062 |         ///\n 1063 |         /// Its SQL type is `Int4`.\n 1064 |         ///\n 1065 |         /// (Automatically generated by Diesel.)\n 1066 |         downloads -> Int4,","lines":6,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/crates/crates_io_database/src/schema.rs#L1061-L1066"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"The aggregate crate counts in the category SQL queries cast `sum(crates_cnt)` to a 4-byte integer (`::int`). `crates_cnt` is `int4` per category, and a top-level category that aggregates many subcategories can in principle sum past `i32::MAX`, which would raise a Postgres `integer out of range` error at runtime rather than returning a result. Summing into `bigint` and only narrowing if needed would be safer.","fix":"Use `sum(c2.crates_cnt)::bigint` (and a corresponding `i64` field) or otherwise avoid the i32 narrowing of an aggregate sum.","locations":[{"ref":"crates/crates_io_database/src/models/toplevel.sql:6","code":"    6 |   sum(c2.crates_cnt)::int as crates_cnt,","lines":1,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/crates/crates_io_database/src/models/toplevel.sql#L6"},{"ref":"crates/crates_io_database/src/models/subcategories.sql:3","code":"    3 |     SELECT sum(c2.crates_cnt)::int","lines":1,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/crates/crates_io_database/src/models/subcategories.sql#L3"},{"ref":"crates/crates_io_database/src/models/parent_categories.sql:3","code":"    3 |     SELECT sum(c2.crates_cnt)::int from categories c2","lines":1,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/crates/crates_io_database/src/models/parent_categories.sql#L3"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"populate.rs accumulates per-day download count `dls` (i32) with random deltas in [-100, 100) and can drift below zero, inserting negative version_downloads. Test-data tool, but produces invalid data.","fix":"Clamp dls to a minimum of 0 after each adjustment.","locations":[{"ref":"src/bin/crates-io/admin/populate.rs:27-41","code":"   27 |     for id in opts.version_ids {\n   28 |         let mut dls = rand::rng().random_range(5_000i32..10_000);\n   29 | \n   30 |         for day in 0..90 {\n   31 |             dls += rand::rng().random_range(-100..100);\n   32 | \n   33 |             diesel::insert_into(version_downloads::table)\n   34 |                 .values((\n   35 |                     version_downloads::version_id.eq(id),\n   36 |                     version_downloads::downloads.eq(dls),\n   37 |                     version_downloads::date.eq(date(now - day.days())),\n   38 |                 ))\n   39 |                 .execute(conn)\n   40 |                 .await?;\n   41 |         }","lines":15,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/bin/crates-io/admin/populate.rs#L27-L41"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"invalidate_many sets `.quantity(paths.len() as i32)`. If `paths` ever exceeds i32::MAX entries the cast wraps to a negative/incorrect quantity. In practice the path list is bounded by callers, but the unchecked usize->i32 cast is a latent truncation. CloudFront also caps paths per invalidation, so a large list should be rejected/chunked rather than silently mis-counted.","fix":"Use a checked conversion (e.g. i32::try_from(paths.len())) and chunk/validate against CloudFront's per-invalidation path limit.","locations":[{"ref":"src/cloudfront.rs:128-133","code":"  128 |         let paths = Paths::builder()\n  129 |             // It looks like you have to set quantity even if you provide a full blown Vec, because\n  130 |             // reasons.\n  131 |             .quantity(paths.len() as i32)\n  132 |             .set_items(Some(paths))\n  133 |             .build()?;","lines":6,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/cloudfront.rs#L128-L133"}]},
{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`next_page_params` computes `(n + 1)` on a `u32` page number that is fully attacker-controlled via `?page=`. For endpoints that use `pages_pagination` without `limit_page_numbers()` (e.g. `list_keywords`, `get_authenticated_user_updates`), `page` can be as large as `u32::MAX`. With `n == u32::MAX` the `n + 1` addition overflows: it panics in debug/test builds and silently wraps to `0` (producing a bogus `page=0` next-page link) in release. The result set must be a full page for this branch to be reached, but the arithmetic is unguarded.","fix":"Use checked/saturating arithmetic (e.g. `n.saturating_add(1)`) or cap the page number for page-based endpoints the same way `limit_page_numbers()` does, and apply that cap to all `pages_pagination` callers.","locations":[{"ref":"src/controllers/helpers/pagination.rs:203-207","code":"  203 |         match self.options.page {\n  204 |             Page::Numeric(n) => opts.insert(\"page\".into(), (n + 1).to_string()),\n  205 |             Page::Unspecified => opts.insert(\"page\".into(), 2.to_string()),\n  206 |             Page::Seek(_) => return None,\n  207 |         };","lines":5,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/controllers/helpers/pagination.rs#L203-L207"}]},
{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`content_length as i32` (a u64 derived from the tarball length) is stored as the version size. The comment claims max upload sizes are always far below i32::MAX, but `publish_limits.upload_size` is a configurable `u32` (up to ~4.2GB) and `max_upload_size()` comes from the per-crate DB column. If either is configured above 2^31-1 the cast silently wraps to a negative size. Not exploitable with default config, but it is a latent truncation that depends on operator configuration rather than a hard invariant.","fix":"Store the size as i64, or explicitly clamp/validate `content_length` against i32::MAX and return an error if exceeded, rather than relying on an unchecked `as i32` cast.","locations":[{"ref":"src/controllers/krate/publish.rs:535-537","code":"  535 |             // Downcast is okay because the file length must be less than the max upload size\n  536 |             // to get here, and max upload sizes are way less than i32 max\n  537 |             .size(content_length as i32)","lines":3,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/controllers/krate/publish.rs#L535-L537"}]},
{"id":"OVF_8","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"refresh_pool_stats computes `status.size - status.available` on unsigned pool counters then casts to i64. If `available` momentarily exceeds `size` (deadpool's status fields are not read atomically), the unsigned subtraction underflows: panic in debug, wrap to a huge value in release. Runs on every Prometheus scrape.","fix":"Use saturating subtraction: `status.size.saturating_sub(status.available) as i64`.","locations":[{"ref":"src/metrics/instance.rs:75-77","code":"   75 |         self.database_used_conns\n   76 |             .get_metric_with_label_values(&[name])?\n   77 |             .set((status.size - status.available) as i64);","lines":3,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/metrics/instance.rs#L75-L77"}]},
{"id":"OVF_9","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"take_token computes `refill_rate = (config.rate.as_millis() as i64).milliseconds()`. `Duration::as_millis()` returns u128; casting a very large configured rate to i64 truncates/overflows silently, producing a negative or wrong interval that would corrupt the token-refill SQL arithmetic (negative interval advancing last_refill backwards). Config-derived, so impact is limited, but there is no validation.","fix":"Validate the configured rate fits in i64 milliseconds at config load, or use a checked conversion and clamp.","locations":[{"ref":"src/rate_limiter.rs:114-115","code":"  114 |         let config = self.config_for_action(performed_action);\n  115 |         let refill_rate = (config.rate.as_millis() as i64).milliseconds();","lines":2,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/rate_limiter.rs#L114-L115"}]},
{"id":"OVF_10","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`NewDownload::from` converts the parsed download count `u64` straight to `i64` with `downloads as i64`, and the value ultimately targets an INTEGER (i32) column. A corrupted/malicious log producing a download count above i32::MAX (or above i64::MAX, wrapping to a negative i64) would either insert a negative number or fail the INSERT. The count comes from parsing untrusted CDN log files, so it is not fully bounded by real traffic.","fix":"Use `u32::try_from(downloads)` (or `i32::try_from`) and clamp/skip on overflow instead of an unchecked `as` cast.","locations":[{"ref":"src/worker/jobs/downloads/process_log.rs:196-205","code":"  196 | impl From<(String, Version, NaiveDate, u64)> for NewDownload {\n  197 |     fn from((name, version, date, downloads): (String, Version, NaiveDate, u64)) -> Self {\n  198 |         Self {\n  199 |             name,\n  200 |             version: version.to_string(),\n  201 |             date,\n  202 |             downloads: downloads as i64,\n  203 |         }\n  204 |     }\n  205 | }","lines":10,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/worker/jobs/downloads/process_log.rs#L196-L205"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"check_rate_limit treats the rate limit as satisfied when the returned bucket has `tokens >= 1`, but take_token has ALREADY decremented and clamped the token count via `least(burst, greatest(0, tokens - 1) + tokens_to_add)`. The returned value is the count AFTER taking a token. A bucket that had exactly 1 token returns 0 (correctly rejected); a bucket with 2 returns 1 (allowed). This is consistent, but the boundary is subtle: a brand-new bucket is created with `tokens = burst` (NOT burst-1), so the very first request for a user does not consume a token at all (insert sets tokens=burst, and on a fresh insert the `do_update` decrement does not run). This effectively grants `burst + 1` requests in the first window instead of `burst`, a small but real rate-limit over-grant on the first action of every user/action pair.","fix":"On initial insert, set `tokens = burst - 1` (the first request consumes a token) so the total allowance equals `burst`, matching the documented bucket semantics.","locations":[{"ref":"src/rate_limiter.rs:84-97","code":"   84 |         let bucket = self\n   85 |             .take_token(uploader, performed_action, Utc::now(), conn)\n   86 |             .await?;\n   87 |         if bucket.tokens >= 1 {\n   88 |             Ok(())\n   89 |         } else {\n   90 |             Err(Box::new(TooManyRequests {\n   91 |                 action: performed_action,\n   92 |                 retry_after: bucket.last_refill\n   93 |                     + chrono::Duration::from_std(self.config_for_action(performed_action).rate)\n   94 |                         .unwrap(),\n   95 |             }))\n   96 |         }\n   97 |     }","lines":14,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/rate_limiter.rs#L84-L97"},{"ref":"src/rate_limiter.rs:138-160","code":"  138 |         diesel::insert_into(publish_limit_buckets::table)\n  139 |             .values((\n  140 |                 publish_limit_buckets::user_id.eq(uploader),\n  141 |                 publish_limit_buckets::action.eq(performed_action),\n  142 |                 publish_limit_buckets::tokens.eq(burst),\n  143 |                 publish_limit_buckets::last_refill.eq(now),\n  144 |             ))\n  145 |             .on_conflict((\n  146 |                 publish_limit_buckets::user_id,\n  147 |                 publish_limit_buckets::action,\n  148 |             ))\n  149 |             .do_update()\n  150 |             .set((\n  151 |                 publish_limit_buckets::tokens.eq(least(\n  152 |                     burst,\n  153 |                     greatest(0, publish_limit_buckets::tokens - 1) + tokens_to_add,\n  154 |                 )),\n  155 |                 publish_limit_buckets::last_refill.eq(publish_limit_buckets::last_refill\n  156 |                     + refill_rate.into_sql::<Interval>() * tokens_to_add),\n  157 |             ))\n  158 |             .returning(Bucket::as_returning())\n  159 |             .get_result(conn)\n  160 |             .await","lines":23,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/rate_limiter.rs#L138-L160"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`PathDetails::from_path` classifies test/example/benchmark files via `path_str.contains(...)` substring matching on the whole lowercased path: `contains(\"test/\")`, `contains(\"tests/\")`, `contains(\"testing/\")`, `contains(\"examples/\")`, `contains(\"benches/\")`, `contains(\"benchmark/\")`. Because these are unanchored substring matches, unrelated directories are misclassified and excluded from line counts: `latest/` and `greatest/` and `contests/` all contain `test/`; a crate or path segment named `testing` matches too. This silently skews per-category line counts.","fix":"Match on path components: split the path on `/` and compare each segment exactly (e.g. any segment == \"tests\" / \"test\" / \"examples\" / \"benches\"), rather than substring `contains`.","locations":[{"ref":"crates/crates_io_linecount/src/paths.rs:16-22","code":"   16 |         let path_str = path.to_string_lossy().to_lowercase();\n   17 | \n   18 |         let is_benchmark = path_str.contains(\"benches/\") || path_str.contains(\"benchmark/\");\n   19 |         let is_example = path_str.contains(\"examples/\");\n   20 |         let is_test = path_str.contains(\"tests/\")\n   21 |             || path_str.contains(\"test/\")\n   22 |             || path_str.contains(\"testing/\");","lines":7,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/crates/crates_io_linecount/src/paths.rs#L16-L22"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`validate_feature` uses `name.split_once(\"dep:\")` to detect the `dep:THIS` form. `split_once` matches the substring `dep:` ANYWHERE in the string and discards everything before it (`if let Some((_, dep)) = ...`). So inputs like `adep:foo`, `x dep:foo`, or `!!!dep:bar` are accepted as valid: only the part after `dep:` is validated as a dependency name and the arbitrary prefix is silently ignored. This is a validation gap on untrusted feature strings taken directly from a published crate's manifest.","fix":"Use `name.strip_prefix(\"dep:\")` instead of `name.split_once(\"dep:\")`, e.g. `} else if let Some(dep) = name.strip_prefix(\"dep:\") { validate_dependency_name(dep) }`. Anything with junk before `dep:` then falls through to `validate_feature_name` and is correctly rejected.","locations":[{"ref":"crates/crates_io_validation/src/lib.rs:206-208","code":"  206 |     } else if let Some((_, dep)) = name.split_once(\"dep:\") {\n  207 |         validate_dependency_name(dep)?;\n  208 |         Ok(())","lines":3,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/crates/crates_io_validation/src/lib.rs#L206-L208"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"authenticate() tries cookie auth first, then token auth. If a request carries BOTH a valid session cookie AND an `Authorization` header (e.g. a browser/proxy that forwards both), the cookie path wins and the request is treated as a cookie (website) authentication even though the client also sent a token. Endpoints gated with `AuthCheck::only_cookie()` then succeed, and token endpoint/crate scopes are never enforced for that request. While verify_origin() mitigates CSRF, mixing both credential types and silently preferring the cookie is surprising and can let a token-bearing automated client bypass token-scope restrictions if it also happens to carry a session cookie.","fix":"Decide auth method deterministically: if an `Authorization` header is present, authenticate via token (and reject if also cookie-authenticated, or ignore the cookie); only fall back to cookie when no auth header exists.","locations":[{"ref":"src/auth.rs:319-346","code":"  319 | #[instrument(skip_all)]\n  320 | async fn authenticate(parts: &Parts, conn: &mut AsyncPgConnection) -> AppResult<Authentication> {\n  321 |     controllers::util::verify_origin(parts)?;\n  322 | \n  323 |     match authenticate_via_cookie(parts, conn).await {\n  324 |         Ok(None) => {}\n  325 |         Ok(Some(auth)) => {\n  326 |             parts.request_log().add(\"auth_type\", \"cookie\");\n  327 |             return Ok(Authentication::Cookie(auth));\n  328 |         }\n  329 |         Err(err) => return Err(err),\n  330 |     }\n  331 | \n  332 |     match authenticate_via_token(parts, conn).await {\n  333 |         Ok(None) => {}\n  334 |         Ok(Some(auth)) => {\n  335 |             parts.request_log().add(\"auth_type\", \"token\");\n  336 |             return Ok(Authentication::Token(auth));\n  337 |         }\n  338 |         Err(err) => return Err(err),\n  339 |     }\n  340 | \n  341 |     // Unable to authenticate the user\n  342 |     let cause = \"no cookie session or auth header found\";\n  343 |     parts.request_log().add(\"cause\", cause);\n  344 | \n  345 |     return Err(forbidden(\"this action requires authentication\"));\n  346 | }","lines":28,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/auth.rs#L319-L346"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"sync_index.rs declares `--no-git` / `--no-sparse` with `ArgAction::SetFalse` on fields `git`/`sparse` but without `default_value_t = true`. With SetFalse the bool defaults to false, so `git`/`sparse` default to false and both index syncs are skipped unless the flag is passed (which also sets them false). The flags can never enable syncing; the tool effectively never syncs.","fix":"Add `default_value_t = true` to the `git` and `sparse` args so the default is to sync and `--no-git`/`--no-sparse` opt out.","locations":[{"ref":"src/bin/crates-io/admin/sync_index.rs:54-60","code":"   54 |     /// Skip syncing to the git index\n   55 |     #[arg(long = \"no-git\", action = ArgAction::SetFalse)]\n   56 |     git: bool,\n   57 | \n   58 |     /// Skip syncing to the sparse index\n   59 |     #[arg(long = \"no-sparse\", action = ArgAction::SetFalse)]\n   60 |     sparse: bool,","lines":7,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/bin/crates-io/admin/sync_index.rs#L54-L60"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"categories_from_toml / sync_with_connection upsert categories and then DELETE every category whose slug is not in the returned set. Slugs are lowercased, so two TOML keys differing only by case (e.g. `Foo` and `foo`) collapse to the same slug and silently overwrite/delete each other, dropping a configured category without error.","fix":"Detect duplicate slugs after lowercasing and error out explicitly rather than relying on on_conflict + delete-by-returned-slugs.","locations":[{"ref":"src/boot/categories.rs:74-83","code":"   74 |         if let Some(categories) = details.get(\"categories\") {\n   75 |             let categories = categories\n   76 |                 .as_table()\n   77 |                 .with_context(|| format!(\"child categories of {slug} were not a table\"))?;\n   78 | \n   79 |             result.extend(categories_from_toml(categories, Some(&category))?);\n   80 |         }\n   81 | \n   82 |         result.push(category)\n   83 |     }","lines":10,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/boot/categories.rs#L74-L83"},{"ref":"src/boot/categories.rs:96-120","code":"   96 |             (\n   97 |                 categories::slug.eq(c.slug.to_lowercase()),\n   98 |                 categories::category.eq(c.name),\n   99 |                 categories::description.eq(c.description),\n  100 |             )\n  101 |         })\n  102 |         .collect::<Vec<_>>();\n  103 | \n  104 |     conn.transaction(async |conn| {\n  105 |         let slugs: Vec<String> = diesel::insert_into(categories::table)\n  106 |             .values(&to_insert)\n  107 |             .on_conflict(categories::slug)\n  108 |             .do_update()\n  109 |             .set((\n  110 |                 categories::category.eq(excluded(categories::category)),\n  111 |                 categories::description.eq(excluded(categories::description)),\n  112 |             ))\n  113 |             .returning(categories::slug)\n  114 |             .get_results(conn)\n  115 |             .await?;\n  116 | \n  117 |         diesel::delete(categories::table)\n  118 |             .filter(categories::slug.ne_all(slugs))\n  119 |             .execute(conn)\n  120 |             .await?;","lines":25,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/boot/categories.rs#L96-L120"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The crate-deletion eligibility rule counts ALL owners (users + teams) via `owners.len() > 1`, but the doc comment and the later reverse-dependency / individual-owner logic talk about a \"single owner\". A crate with one user owner plus one team owner has `owners.len() == 2` and is blocked from deletion after 72h even though it effectively has a single human owner; conversely the intent of \"single owner\" is ambiguous. This makes the deletion gate behave inconsistently with its documentation.","fix":"Decide and document whether teams count toward the owner limit; if only individual owners should count, filter owners by `OwnerKind::User` before checking the count.","locations":[{"ref":"src/controllers/krate/delete.rs:94-98","code":"   94 |     if age > TimeDelta::hours(72) {\n   95 |         if owners.len() > 1 {\n   96 |             let msg = \"only crates with a single owner can be deleted after 72 hours\";\n   97 |             return Err(custom(StatusCode::UNPROCESSABLE_ENTITY, msg));\n   98 |         }","lines":5,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/controllers/krate/delete.rs#L94-L98"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"GitHub workflow filename matching is case-sensitive while every other GitHub identifier (repository owner and repository name) is matched case-insensitively via `lower()`. In `handle_github_token_inner` the config is filtered with `config.workflow_filename != workflow_filename` (exact, case-sensitive). The same holds for GitLab's `config.workflow_filepath != workflow_filepath`. This is not an impersonation hole (case-sensitive is stricter), but it is an inconsistency that can cause legitimate publishes to be rejected when the stored config differs in case from the path GitHub/GitLab reports, producing confusing \"does not match the workflow filename\" errors. Worth confirming the asymmetry (owner/repo case-insensitive, workflow case-sensitive) is intended.","fix":"Decide on one casing policy and document it; if filenames should be case-insensitive too, compare with `to_lowercase()` / `eq_ignore_ascii_case` consistently with owner/repo.","locations":[{"ref":"src/controllers/trustpub/tokens/exchange/mod.rs:175-178","code":"  175 |     let mismatched_workflows: Vec<String> = repo_configs\n  176 |         .extract_if(.., |config| config.workflow_filename != workflow_filename)\n  177 |         .map(|config| format!(\"`{}`\", config.workflow_filename))\n  178 |         .collect();","lines":4,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/controllers/trustpub/tokens/exchange/mod.rs#L175-L178"},{"ref":"src/controllers/trustpub/tokens/exchange/mod.rs:337-340","code":"  337 |     let mismatched_workflows: Vec<String> = repo_configs\n  338 |         .extract_if(.., |config| config.workflow_filepath != workflow_filepath)\n  339 |         .map(|config| format!(\"`{}`\", config.workflow_filepath))\n  340 |         .collect();","lines":4,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/controllers/trustpub/tokens/exchange/mod.rs#L337-L340"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"ensure_json_errors (cargo_compat) only converts error responses whose content-type is exactly `text/plain; charset=utf-8` into JSON. Plain-text error bodies without that exact content-type (or other non-JSON bodies) pass through unchanged, violating the documented contract that /api/ always returns JSON errors. The 1_000_000-byte body cap in convert_to_json_response also turns larger error bodies into a 500.","fix":"Match the content-type by parsed mime type (text/plain regardless of charset parameter); reconsider/raise/document the body cap and avoid converting available text into a 500 on overflow.","locations":[{"ref":"src/middleware/cargo_compat.rs:105-108","code":"  105 |     let content_type = res.headers().get(\"content-type\");\n  106 |     if !matches!(content_type, Some(content_type) if content_type == \"text/plain; charset=utf-8\") {\n  107 |         return res;\n  108 |     }","lines":4,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/middleware/cargo_compat.rs#L105-L108"},{"ref":"src/middleware/cargo_compat.rs:124","code":"  124 |     let bytes = axum::body::to_bytes(body, 1_000_000).await?;","lines":1,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/middleware/cargo_compat.rs#L124"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"require_user_agent exempts the download endpoint from the user-agent requirement using a `path.ends_with(\"download\")` substring check. This matches more than the intended route (any path ending in the literal `download`, e.g. crafted paths), letting clients bypass the no-user-agent block on unintended routes.","fix":"Match the actual download route via the MatchedPath route template instead of a `path.ends_with(\"download\")` substring check.","locations":[{"ref":"src/middleware/require_user_agent.rs:33","code":"   33 |     let is_download = req.uri().path().ends_with(\"download\");","lines":1,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/middleware/require_user_agent.rs#L33"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The openapi handler caches the rendered document in two global OnceLocks (PUBLIC_BYTES / FULL_BYTES) keyed only on whether `internal` is Some. The `internal` query parameter is accepted from any client with NO authentication check in this handler. That means the full/internal OpenAPI document (including operations marked x-internal) is served to anyone who appends `?internal=anything`. If x-internal endpoints are meant to be hidden from the public, this leaks their existence/shape to unauthenticated callers.","fix":"Require authentication/authorization (e.g. admin or internal network) before serving the internal variant, or remove the public-facing `internal` toggle.","locations":[{"ref":"src/openapi.rs:98-123","code":"   98 | #[derive(Deserialize)]\n   99 | pub struct Params {\n  100 |     #[serde(default)]\n  101 |     internal: Option<String>,\n  102 | }\n  103 | \n  104 | pub async fn handler(\n  105 |     Extension(doc): Extension<Arc<OpenApiDoc>>,\n  106 |     Query(params): Query<Params>,\n  107 | ) -> impl IntoResponse {\n  108 |     static PUBLIC_BYTES: OnceLock<Bytes> = OnceLock::new();\n  109 |     static FULL_BYTES: OnceLock<Bytes> = OnceLock::new();\n  110 | \n  111 |     let cache = match params.internal {\n  112 |         None => &PUBLIC_BYTES,\n  113 |         Some(_) => &FULL_BYTES,\n  114 |     };\n  115 | \n  116 |     let bytes = cache.get_or_init(|| {\n  117 |         let mut doc = (*doc).clone();\n  118 |         apply_visibility(&mut doc, params.internal.is_some());\n  119 |         Bytes::from(serde_json::to_vec(&doc).expect(\"OpenAPI serialization failed\"))\n  120 |     });\n  121 | \n  122 |     (TypedHeader(ContentType::json()), bytes.clone())\n  123 | }","lines":26,"link":"https://github.com/rust-lang/crates.io/blob/087b1b5bfd6b66cb200321776f2a162377cd37bb/src/openapi.rs#L98-L123"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"TopCrates::new orders the top-N typosquat corpus by downloads.desc() with no deterministic secondary sort key. Crates with equal download counts have a non-deterministic top-N cutoff, so the typosquat corpus is unstable between runs (different crates can enter/leave the corpus), causing inconsistent typosquat decisions.","fix":"Add a deterministic secondary ordering (e.g. `.then(crates::id.asc())`) so the top-N corpus is stable.","locations":[{"ref":"src/typosquat/database.rs:42-90","code":"   42 |         let crates = models::Crate::query()\n   43 |             .inner_join(crate_downloads::table)\n   44 |             .order(crate_downloads::downloads.desc())\n   45 |             .limit(num)\n   46 |             .load_stream::<models::Crate>(conn)\n   47 |             .await?\n   48 |             .try_fold(crates, |mut crates, krate| {\n   49 |                 crates.insert(\n   50 |                     krate.id,\n   51 |                     (\n   52 |                         krate.name,\n   53 |                         Crate {\n   54 |                             owners: HashSet::new(),\n   55 |                         },\n   56 |                     ),\n   57 |                 );\n   58 | \n   59 |                 futures_util::future::ready(Ok(crates))\n   60 |             })\n   61 |             .await?;\n   62 | \n   63 |         // This query might require more low level knowledge of crate_owners than we really want\n   64 |         // outside of the models module. It would probably make more sense in the long term to have\n   65 |         // this live in the Owner type, but for now I want to keep the typosquatting logic as\n   66 |         // self-contained as possible in case we decide not to go ahead with this in the longer\n   67 |         // term.\n   68 |         let crates = crate_owners::table\n   69 |             .filter(crate_owne
