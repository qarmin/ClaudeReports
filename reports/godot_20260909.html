{"id":"MEM_11","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"very_easy","description":"Potential memory leak in tvg_svg_in_ot.cpp. In tvg_svg_in_ot_preset_slot(), when picture->load() fails at line 207 or subsequent operations fail, tvg::Paint::rel(picture) is called to release the picture, but the function returns with ERR_FAIL_V_MSG without cleaning up state->glyph_map entry that may have been partially initialized. More importantly, if picture allocation via tvg::Picture::gen() fails (returns nullptr), the code proceeds without null-checking.","fix":"After tvg::Picture::gen() on line 204 and 313, check if picture is nullptr before calling methods on it. If picture allocation fails, ensure the gl_state is not marked as ready.","locations":[{"ref":"modules/text_server_adv/thorvg_svg_in_ot.cpp:338-341","code":"  338 | \tres = sw_canvas->add(picture);\n  339 | \tif (res != tvg::Result::Success) {\n  340 | \t\tERR_FAIL_V_MSG(FT_Err_Invalid_Outline, \"Failed to set SVG canvas source.\");\n  341 | \t}","lines":4,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/text_server_adv/thorvg_svg_in_ot.cpp#L338-L341"}]},
{"id":"MEM_12","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"very_easy","description":"In GodotJavaWrapper::set_window_color(), a jstring is created via NewStringUTF() but never released with DeleteLocalRef(). This causes a JNI local reference leak.","fix":"Add 'env->DeleteLocalRef(jStrColor);' after line 612, before the closing brace of the if statement.","locations":[{"ref":"platform/android/java_godot_wrapper.cpp:606-614","code":"  606 | void GodotJavaWrapper::set_window_color(const Color &p_color) {\n  607 | \tif (_set_window_color) {\n  608 | \t\tJNIEnv *env = get_jni_env();\n  609 | \t\tERR_FAIL_NULL(env);\n  610 | \t\tString color = \"#\" + p_color.to_html(false);\n  611 | \t\tjstring jStrColor = env->NewStringUTF(color.utf8().get_data());\n  612 | \t\tenv->CallVoidMethod(godot_native_bridge, _set_window_color, jStrColor);\n  613 | \t}\n  614 | }","lines":9,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/android/java_godot_wrapper.cpp#L606-L614"}]},
{"id":"MEM_13","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"very_easy","description":"In GodotJavaWrapper::on_editor_workspace_selected(), a jstring is created via NewStringUTF() but never released with DeleteLocalRef(). This causes a JNI local reference leak.","fix":"Add 'env->DeleteLocalRef(j_workspace);' after line 622, before the closing brace of the if statement.","locations":[{"ref":"platform/android/java_godot_wrapper.cpp:616-624","code":"  616 | void GodotJavaWrapper::on_editor_workspace_selected(const String &p_workspace) {\n  617 | \tif (_on_editor_workspace_selected) {\n  618 | \t\tJNIEnv *env = get_jni_env();\n  619 | \t\tERR_FAIL_NULL(env);\n  620 | \n  621 | \t\tjstring j_workspace = env->NewStringUTF(p_workspace.utf8().get_data());\n  622 | \t\tenv->CallVoidMethod(godot_native_bridge, _on_editor_workspace_selected, j_workspace);\n  623 | \t}\n  624 | }","lines":9,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/android/java_godot_wrapper.cpp#L616-L624"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"critical","difficulty":"very_easy","description":"Division by zero: Line 434 performs 'p_process_step = 1.0 / fixed_fps' without verifying that fixed_fps is non-zero. The fixed_fps field is initialized to 0 by default (main_timer_sync.h:112) and only checked for != -1 at line 433. If fixed_fps is 0 (the default), this will cause a floating-point divide by zero.","fix":"Change the condition from 'if (fixed_fps != -1)' to 'if (fixed_fps > 0)' to ensure fixed_fps is positive before division. The check should reject both -1 (disabled) and 0 (uninitialized/invalid).","locations":[{"ref":"main/main_timer_sync.cpp:433-435","code":"  433 | \tif (fixed_fps != -1) {\n  434 | \t\tp_process_step = 1.0 / fixed_fps;\n  435 | \t}","lines":3,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/main/main_timer_sync.cpp#L433-L435"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"Off-by-one buffer overread in ScriptStackDump deserialization. Line 51 checks CHECK_SIZE(p_arr, size) but then accesses elements from p_arr[1] to p_arr[size-1] in the loop. The check should verify size >= 1 + size (total needed), not just size. If p_arr.size() exactly equals size, accessing p_arr[size] will be out of bounds. Similar issue at line 137 in OutputError deserialization.","fix":"Increase CHECK_SIZE requirement by 1: For ScriptStackDump at line 51 change to CHECK_SIZE(p_arr, size + 1). For OutputError at line 137, the stack frame data ends at idx which needs to fit, so change to CHECK_SIZE(p_arr, 11 + stack_size). Ensure final idx is within bounds.","locations":[{"ref":"core/debugger/debugger_marshalls.cpp:49-63","code":"   49 | \tCHECK_SIZE(p_arr, 1, \"ScriptStackDump\");\n   50 | \tuint32_t size = p_arr[0];\n   51 | \tCHECK_SIZE(p_arr, size, \"ScriptStackDump\");\n   52 | \tint idx = 1;\n   53 | \tfor (uint32_t i = 0; i < size / 3; i++) {\n   54 | \t\tScriptLanguage::StackInfo sf;\n   55 | \t\tsf.file = p_arr[idx];\n   56 | \t\tsf.line = p_arr[idx + 1];\n   57 | \t\tsf.func = p_arr[idx + 2];\n   58 | \t\tframes.push_back(sf);\n   59 | \t\tidx += 3;\n   60 | \t}\n   61 | \tCHECK_END(p_arr, idx, \"ScriptStackDump\");\n   62 | \treturn true;\n   63 | }","lines":15,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/core/debugger/debugger_marshalls.cpp#L49-L63"},{"ref":"core/debugger/debugger_marshalls.cpp:124-149","code":"  124 | bool DebuggerMarshalls::OutputError::deserialize(const Array &p_arr) {\n  125 | \tCHECK_SIZE(p_arr, 11, \"OutputError\");\n  126 | \thr = p_arr[0];\n  127 | \tmin = p_arr[1];\n  128 | \tsec = p_arr[2];\n  129 | \tmsec = p_arr[3];\n  130 | \tsource_file = p_arr[4];\n  131 | \tsource_func = p_arr[5];\n  132 | \tsource_line = p_arr[6];\n  133 | \terror = p_arr[7];\n  134 | \terror_descr = p_arr[8];\n  135 | \twarning = p_arr[9];\n  136 | \tunsigned int stack_size = p_arr[10];\n  137 | \tCHECK_SIZE(p_arr, stack_size, \"OutputError\");\n  138 | \tint idx = 11;\n  139 | \tcallstack.resize(stack_size / 3);\n  140 | \tScriptLanguage::StackInfo *w = callstack.ptrw();\n  141 | \tfor (unsigned int i = 0; i < stack_size / 3; i++) {\n  142 | \t\tw[i].file = p_arr[idx];\n  143 | \t\tw[i].func = p_arr[idx + 1];\n  144 | \t\tw[i].line = p_arr[idx + 2];\n  145 | \t\tidx += 3;\n  146 | \t}\n  147 | \tCHECK_END(p_arr, idx, \"OutputError\");\n  148 | \treturn true;\n  149 | }","lines":26,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/core/debugger/debugger_marshalls.cpp#L124-L149"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"very_easy","description":"Integer overflow in Expression token parser when parsing $N input parameter indices. The code multiplies index by 10 in a loop without overflow checking, allowing maliciously crafted expressions like '$9999999999' to cause integer overflow.","fix":"Add overflow check before multiplying: if (index > INT_MAX / 10) { _set_error(\"Input parameter index too large\"); return ERR_PARSE_ERROR; }","locations":[{"ref":"core/math/expression.cpp:78-94","code":"   78 | \t\t\tcase '$': {\n   79 | \t\t\t\tr_token.type = TK_INPUT;\n   80 | \t\t\t\tint index = 0;\n   81 | \t\t\t\tdo {\n   82 | \t\t\t\t\tif (!is_digit(expression[str_ofs])) {\n   83 | \t\t\t\t\t\t_set_error(\"Expected number after '$'\");\n   84 | \t\t\t\t\t\tr_token.type = TK_ERROR;\n   85 | \t\t\t\t\t\treturn ERR_PARSE_ERROR;\n   86 | \t\t\t\t\t}\n   87 | \t\t\t\t\tindex *= 10;\n   88 | \t\t\t\t\tindex += expression[str_ofs] - '0';\n   89 | \t\t\t\t\tstr_ofs++;\n   90 | \n   91 | \t\t\t\t} while (is_digit(expression[str_ofs]));\n   92 | \n   93 | \t\t\t\tr_token.value = index;\n   94 | \t\t\t\treturn OK;","lines":17,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/core/math/expression.cpp#L78-L94"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"very_easy","description":"Integer overflow in hex_encode_buffer: The calculation `p_len * 2 + 1` can overflow when p_len is large (e.g., > INT_MAX/2). This can cause incorrect buffer size allocation, leading to buffer overrun.","fix":"Check for overflow before multiplication: if (p_len > INT_MAX / 2) return appropriate error or use size_t for calculations.","locations":[{"ref":"core/string/ustring.cpp:1649","code":" 1649 | \tret.resize_uninitialized(p_len * 2 + 1);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/core/string/ustring.cpp#L1649"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"Integer overflow/underflow in _replace_common size calculation. When calculating replacement string size, the code performs (int)found.size() * (with_length - key_length) without overflow checking. The subtraction between int and size_t can cause unexpected type promotion and underflow, and the multiplication can overflow.","fix":"Cast all values to a consistent type (e.g., int64_t or size_t) and add overflow checking before the multiplication and addition operations. Example: int64_t size_diff = (int64_t)with_length - (int64_t)key_length; if (size_diff > INT32_MAX / found.size()) { ... handle overflow ... }","locations":[{"ref":"core/string/ustring.cpp:3642","code":" 3642 | \tnew_string.resize_uninitialized(old_length + int(found.size()) * (with_length - key_length) + 1);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/core/string/ustring.cpp#L3642"},{"ref":"core/string/ustring.cpp:3701","code":" 3701 | \tnew_string.resize_uninitialized(old_length + int(found.size()) * (with_length - key_length) + 1);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/core/string/ustring.cpp#L3701"}]},
{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"very_easy","description":"In func_PackedByteArray_encode_var at line 1150: The check 'uint64_t(p_offset + len) > size' is vulnerable to signed integer overflow. Since p_offset is int64_t and len is int (signed), if p_offset approaches INT64_MAX and len is positive, the addition p_offset + len overflows in signed arithmetic before the cast to uint64_t. This could bypass the bounds check and allow out-of-bounds write.","fix":"Cast operands to unsigned before addition: 'if (uint64_t(p_offset) + uint64_t(len) > size)' to perform the comparison in unsigned arithmetic without overflow.","locations":[{"ref":"core/variant/variant_call.cpp:1149","code":" 1149 | \t\tif (uint64_t(p_offset + len) > size) {","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/core/variant/variant_call.cpp#L1149"}]},
{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"very_easy","description":"Integer overflow in texture resizing calculation. The multiplication target_image->get_height() * new_width and target_image->get_width() * new_height can overflow an int. For example, if both dimensions are near 32000, the product could overflow. The correct approach is to cast to int64_t before multiplication.","fix":"Cast to int64_t before multiplication: int new_height = int((int64_t)target_image->get_height() * new_width / target_image->get_width()); and similarly for line 834.","locations":[{"ref":"editor/import/resource_importer_texture.cpp:852","code":"  852 | \t\t\t\tint new_height = target_image->get_height() * new_width / target_image->get_width();","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/import/resource_importer_texture.cpp#L852"},{"ref":"editor/import/resource_importer_texture.cpp:861","code":"  861 | \t\t\t\tint new_width = target_image->get_width() * new_height / target_image->get_height();","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/import/resource_importer_texture.cpp#L861"}]},
{"id":"OVF_8","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"very_easy","description":"Integer overflow when calculating texture memory size. Image::get_image_data_size() returns int64_t, but the result is stored in const int after multiplication with texture->get_depth(). For large textures (e.g., 4096x4096x256), this can overflow 32-bit signed integer limits (~2GB), causing negative memory values to be passed to String::humanize_size() and potentially displaying incorrect memory usage information.","fix":"Change 'const int memory' to 'const int64_t memory' on both lines 169 and 180 to preserve the full range of the multiplication result.","locations":[{"ref":"editor/scene/texture/texture_3d_editor_plugin.cpp:173","code":"  173 | \t\tconst int memory = Image::get_image_data_size(texture->get_width(), texture->get_height(), format, true) * texture->get_depth();","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/scene/texture/texture_3d_editor_plugin.cpp#L173"},{"ref":"editor/scene/texture/texture_3d_editor_plugin.cpp:184","code":"  184 | \t\tconst int memory = Image::get_image_data_size(texture->get_width(), texture->get_height(), format, false) * texture->get_depth();","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/scene/texture/texture_3d_editor_plugin.cpp#L184"}]},
{"id":"OVF_9","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"Potential integer overflow when multiplying untrusted input values. In gltf_accessor.cpp line 1099 and similar locations, 'input_size * vector_size' is computed where input_size comes from untrusted glTF data (p_input_data.size()). If input_size is large, this multiplication could overflow int64_t.","fix":"Add overflow checks before the multiplication, e.g., check if input_size > INT64_MAX / vector_size before multiplying, and fail gracefully if overflow would occur.","locations":[{"ref":"modules/gltf/structures/gltf_accessor.cpp:1099","code":" 1099 | \tnumbers.resize(input_size * vector_size);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/gltf/structures/gltf_accessor.cpp#L1099"},{"ref":"modules/gltf/structures/gltf_accessor.cpp:613","code":"  613 | \tconst int64_t raw_number_count = raw_vector_count * vector_size;","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/gltf/structures/gltf_accessor.cpp#L613"},{"ref":"modules/gltf/structures/gltf_accessor.cpp:747","code":"  747 | \tERR_FAIL_COND_V_MSG(sparse_values.size() != sparse_count * vector_size, ret_numbers, \"glTF import: Sparse values size does not match the sparse count.\");","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/gltf/structures/gltf_accessor.cpp#L747"}]},
{"id":"OVF_10","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"very_easy","description":"Integer truncation when assigning uint64_t offset to int32_t index array in visibility mask extension. The offset variable tracks cumulative vertex counts across multiple meshes and can exceed INT32_MAX, causing incorrect mesh indices when stored in the int32_t array.","fix":"Change the indices array from PackedInt32Array to PackedUint32Array, or cast offset to int32_t with proper bounds checking. The indices array should use uint32_t since it represents offsets into vertex buffers which are typically large.","locations":[{"ref":"modules/openxr/extensions/openxr_visibility_mask_extension.cpp:250-266","code":"  250 | \t\tuint64_t offset = 0;\n  251 | \n  252 | \t\tVector3 *v_out = vertices.ptrw();\n  253 | \t\tint32_t *i_out = indices.ptrw();\n  254 | \n  255 | \t\tfor (uint32_t i = 0; i < mesh_count; i++) {\n  256 | \t\t\tconst XrVector2f *v_in = mesh_data[i].vertices.ptr();\n  257 | \t\t\tfor (uint32_t j = 0; j < mesh_data[i].vertices.size(); j++) {\n  258 | \t\t\t\tv_out->x = v_in->x;\n  259 | \t\t\t\tv_out->y = v_in->y;\n  260 | \t\t\t\tv_out->z = float(i); // We store our view in our Z component, our shader will filter the right faces out.\n  261 | \t\t\t\tv_out++;\n  262 | \t\t\t\tv_in++;\n  263 | \t\t\t}\n  264 | \t\t\tconst uint32_t *i_in = mesh_data[i].indices.ptr();\n  265 | \t\t\tfor (uint32_t j = 0; j < mesh_data[i].indices.size(); j++) {\n  266 | \t\t\t\t*i_out = offset + *i_in;","lines":17,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/openxr/extensions/openxr_visibility_mask_extension.cpp#L250-L266"}]},
{"id":"OVF_11","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"Integer overflow in audio sample registration: frames_total is computed as (int) * (double), then stored in int. If mix_rate is large (e.g., 48000) and length > 90000 seconds, the multiplication overflows int32. This causes buffer allocation and processing to use incorrect sizes.","fix":"Change 'int frames_total = mix_rate * length;' to 'int64_t frames_total = (int64_t)mix_rate * length;' then validate frames_total fits in expected bounds before use.","locations":[{"ref":"platform/web/audio_driver_web.cpp:239","code":"  239 | \tint frames_total = mix_rate * length;","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/web/audio_driver_web.cpp#L239"}]},
{"id":"OVF_12","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"very_easy","description":"Division by zero at line 390 in draw_nine_patch_stretched(). The expression divides by max_middle_real_size without checking if it's zero, similar to line 346 bug. Line 404 has the same issue.","fix":"Wrap both lines with conditional checks: if (max_middle_real_size > 0.0) { center_mapped_from_real_width = (width_total * 0.5 - topleft.x) / max_middle_real_size * max_middle_texture_size + topleft.x; } else { center_mapped_from_real_width = topleft.x; }","locations":[{"ref":"scene/gui/texture_progress_bar.cpp:390","code":"  390 | \t\t\t\tdouble center_mapped_from_real_width = (width_total * 0.5 - topleft.x) / max_middle_real_size * max_middle_texture_size + topleft.x;","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/gui/texture_progress_bar.cpp#L390"},{"ref":"scene/gui/texture_progress_bar.cpp:404","code":"  404 | \t\t\t\tdouble center_mapped_from_real_width = (width_total * 0.5 - topleft.y) / max_middle_real_size * max_middle_texture_size + topleft.y;","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/gui/texture_progress_bar.cpp#L404"}]},
{"id":"OVF_13","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"Integer overflow in mesh_add_surface. Multiplication of int values (expected_size * mesh->blend_shape_count) at line 339 without overflow checking. With large vertex counts and blend shape counts, this can wrap around and cause buffer validation to pass when it shouldn't, or cause out-of-bounds memory access.","fix":"Use safe multiplication with overflow detection, or use uint64_t for intermediate calculations and verify no overflow occurred before casting to int","locations":[{"ref":"servers/rendering/renderer_rd/storage_rd/mesh_storage.cpp:336-341","code":"  336 | \t\tint expected_size = stride * p_surface.vertex_count;\n  337 | \t\tERR_FAIL_COND_MSG(expected_size != p_surface.vertex_data.size(), \"Size of vertex data provided (\" + itos(p_surface.vertex_data.size()) + \") does not match expected (\" + itos(expected_size) + \")\");\n  338 | \n  339 | \t\tint bs_expected_size = expected_size * mesh->blend_shape_count;\n  340 | \n  341 | \t\tERR_FAIL_COND_MSG(bs_expected_size != p_surface.blend_shape_data.size(), \"Size of blend shape data provided (\" + itos(p_surface.blend_shape_data.size()) + \") does not match expected (\" + itos(bs_expected_size) + \")\");","lines":6,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/servers/rendering/renderer_rd/storage_rd/mesh_storage.cpp#L336-L341"}]},
{"id":"OVF_14","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"Integer overflow in acceleration structure geometry validation: `rd_geometry.vertex_offset + rd_geometry.vertex_count * rd_geometry.vertex_stride` can overflow if vertex_count and vertex_stride are large. The multiplication is performed with no overflow checking before adding the offset.","fix":"Use checked multiplication: ensure `rd_geometry.vertex_count` and `rd_geometry.vertex_stride` do not multiply to overflow uint64_t before adding offset. Consider: `if (rd_geometry.vertex_count > UINT64_MAX / rd_geometry.vertex_stride)` before the multiplication.","locations":[{"ref":"servers/rendering/rendering_device.cpp:376","code":"  376 | \t\tERR_FAIL_COND_V_MSG((rd_geometry.vertex_offset + rd_geometry.vertex_count * rd_geometry.vertex_stride) > vertex_buffer->size, RID(), \"The specified vertex offset and count are outside the range of the vertex buffer.\");","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/servers/rendering/rendering_device.cpp#L376"}]},
{"id":"OVF_15","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"Integer overflow in index buffer geometry validation: `rd_geometry.index_offset + rd_geometry.index_count * index_stride` can overflow if index_count and index_stride are large. Similar to vertex buffer case above.","fix":"Use checked multiplication: `if (rd_geometry.index_count > UINT64_MAX / index_stride)` before the multiplication to prevent overflow in the bounds check.","locations":[{"ref":"servers/rendering/rendering_device.cpp:398","code":"  398 | \t\t\tERR_FAIL_COND_V_MSG((rd_geometry.index_offset + rd_geometry.index_count * index_stride) > index_buffer->size, RID(), \"The specified index offset and count are outside the range of the index buffer.\");","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/servers/rendering/rendering_device.cpp#L398"}]},
{"id":"OVF_16","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"Integer overflow in instance buffer pointer arithmetic: `instance_buffer.data_ptr + instance_buffer_offset + (instance_size * i)` on line 564 can overflow if instance_size and loop counter i are large. No overflow check before pointer arithmetic.","fix":"Add overflow check: verify `instance_size <= UINT64_MAX / p_instances.size()` before the loop to ensure `instance_size * i` cannot overflow.","locations":[{"ref":"servers/rendering/rendering_device.cpp:611","code":"  611 | \t\tdriver->acceleration_structure_instance_write(instance_buffer.data_ptr + instance_buffer_offset + (instance_size * i), rdd_instance);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/servers/rendering/rendering_device.cpp#L611"}]},
{"id":"OVF_17","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"very_easy","description":"Off-by-one error in instance_index bounds validation. Line 10043 correctly validates custom_instance_index with >= comparison, but line 10209 uses > comparison when auto-incrementing instance_index. This allows instance_index to reach MAX_INSTANCE_UNIFORM_INDICES (16) when the valid range is 0-15, enabling out-of-bounds writes to the instance uniform index array.","fix":"Change line 10209 from 'if (instance_index > MAX_INSTANCE_UNIFORM_INDICES)' to 'if (instance_index >= MAX_INSTANCE_UNIFORM_INDICES)' to match the validation at line 10043. The post-increment at line 10208 means after assigning index 15, instance_index becomes 16, which should fail the check.","locations":[{"ref":"servers/rendering/shader_language.cpp:10128","code":"10128 | \t\t\t\t\t\t\t\t\tif (custom_instance_index >= MAX_INSTANCE_UNIFORM_INDICES) {","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/servers/rendering/shader_language.cpp#L10128"},{"ref":"servers/rendering/shader_language.cpp:10304","code":"10304 | \t\t\t\t\t\t\tif (instance_index > MAX_INSTANCE_UNIFORM_INDICES) {","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/servers/rendering/shader_language.cpp#L10304"}]},
{"id":"OVF_18","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"Potential integer overflow in write_array_std140 template function. Lines 301-302 compute 'elements * p_array_size' and 'p_stride * p_array_size' without checking for overflow. With large inputs this can wrap around, causing incorrect memset size on line 306 and out-of-bounds buffer writes on line 313.","fix":"Add overflow validation before multiplications: if (p_array_size > 0 && elements > INT_MAX / p_array_size) { handle_error(); }","locations":[{"ref":"servers/rendering/storage/variant_converters.h:301-302","code":"  301 | \tconst int dst_count = elements * p_array_size;\n  302 | \tconst int stride_count = p_stride * p_array_size;","lines":2,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/servers/rendering/storage/variant_converters.h#L301-L302"},{"ref":"servers/rendering/storage/variant_converters.h:306","code":"  306 | \tmemset(p_write, 0, sizeof(To) * stride_count);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/servers/rendering/storage/variant_converters.h#L306"},{"ref":"servers/rendering/storage/variant_converters.h:313","code":"  313 | \t\t\t\tp_write[j + e] = read[i + e];","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/servers/rendering/storage/variant_converters.h#L313"}]},
{"id":"OVF_19","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"very_easy","description":"Integer overflow in Memory::alloc_aligned_static() at line 57. The offset (uintptr_t) is cast to uint32_t without checking if the value exceeds UINT32_MAX. If p_alignment is extremely large (> 2^32), the cast truncates the offset, causing free_aligned_static() to read the wrong offset value and corrupt memory or crash when freeing. While rare with typical alignments, this is a latent vulnerability.","fix":"Either assert that offset fits in uint32_t, or use size_t/uintptr_t for the offset field if available: DEV_ASSERT((uintptr_t)p2 - (uintptr_t)p1 <= UINT32_MAX); before the cast","locations":[{"ref":"core/os/memory.cpp:65","code":"   65 | \t*((uint32_t *)p2 - 1) = (uint32_t)((uintptr_t)p2 - (uintptr_t)p1);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/core/os/memory.cpp#L65"}]},
{"id":"OVF_20","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"very_easy","description":"Truncating cast from int64_t to int in VariantUtilityFunctions::wrap() at line 616. The code calls 'wrapi((int)p_x, (int)p_min, (int)p_max)' but wrapi() expects int64_t arguments (see line 630). Casting int64_t values to 32-bit int causes silent truncation of values outside the int32 range, leading to incorrect results.","fix":"Change 'wrapi((int)p_x, (int)p_min, (int)p_max)' to 'wrapi((int64_t)p_x, (int64_t)p_min, (int64_t)p_max)' to preserve 64-bit values and match the function signature on line 630.","locations":[{"ref":"core/variant/variant_utility.cpp:617","code":"  617 | \t\t\t\tvalue = wrapi((int)p_x, (int)p_min, (int)p_max);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/core/variant/variant_utility.cpp#L617"}]},
{"id":"OVF_21","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"very_easy","description":"Type mismatch: uint32_t rear = -1 initializes an unsigned variable with -1, which becomes UINT32_MAX. Then at line 186 the modulo operation (rear + 1) % size on first call: (UINT32_MAX + 1) % size = 0 which happens to work correctly but is misleading and error-prone","fix":"Change to int32_t rear = -1; or use uint32_t rear = UINT32_MAX; with explicit intent","locations":[{"ref":"drivers/metal/rendering_context_driver_metal.cpp:152","code":"  152 | \tuint32_t rear = -1;","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/drivers/metal/rendering_context_driver_metal.cpp#L152"}]},
{"id":"OVF_22","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"Potential truncation in texture buffer size comparison: At line 1509, the size is cast to uint32_t: `(uint32_t)p_data.size() != size_bytes`. If p_data.size() is larger than UINT32_MAX, the cast truncates silently. This allows oversized data to pass validation if the truncated value happens to match size_bytes.","fix":"Check sizes match before cast: compare `p_data.size() != size_bytes` without casting, ensuring the actual size (which can be uint64_t) matches the expected size exactly.","locations":[{"ref":"servers/rendering/rendering_device.cpp:1574","code":" 1574 | \tERR_FAIL_COND_V(p_data.size() && (uint32_t)p_data.size() != size_bytes, RID());","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/servers/rendering/rendering_device.cpp#L1574"}]},
{"id":"OVF_23","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"Integer overflow potential in _raytracing_pipeline_create_sbt_buffer(). At line 5089, raygen_sbt_size is calculated as p_raygen_shader_count * raygen_shader_group_stride. At line 5092, miss_sbt_size is calculated as p_miss_shader_count * shader_group_stride. If either multiplier count is large (e.g., UINT32_MAX), multiplication will overflow without detection. The result is stored in uint32_t. Line 5094 adds these together: miss_sbt_offset + miss_sbt_size could also overflow. No validation of these values before buffer allocation.","fix":"Add overflow checks: verify that p_raygen_shader_count * raygen_shader_group_stride and p_miss_shader_count * shader_group_stride don't overflow uint32_t. Use safer multiplication or check intermediate values before buffer allocation.","locations":[{"ref":"servers/rendering/rendering_device.cpp:5226-5231","code":" 5226 | \tuint32_t raygen_sbt_size = p_raygen_shader_count * raygen_shader_group_stride;\n 5227 | \tuint32_t miss_sbt_offset = STEPIFY(raygen_sbt_size, shader_group_base_alignment);\n 5228 | \t// Reserve handle-aligned slots for miss shaders.\n 5229 | \tuint32_t miss_sbt_size = p_miss_shader_count * shader_group_stride;\n 5230 | \n 5231 | \tr_sbt_buffer.size = miss_sbt_offset + miss_sbt_size;","lines":6,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/servers/rendering/rendering_device.cpp#L5226-L5231"}]},
{"id":"OVF_24","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"Potential integer overflow in os_version calculation: (uint32_t)ver.majorVersion * 10000 could overflow if majorVersion > 429496, though unlikely in practice for OS version numbers","fix":"Use safer calculation: os_version = (uint64_t)ver.majorVersion * 10000 + ... then cast to uint32_t if within range, or reconsider the encoding scheme","locations":[{"ref":"drivers/metal/metal_device_properties.cpp:356","code":"  356 | \tos_version = (uint32_t)ver.majorVersion * 10000 + (uint32_t)ver.minorVersion * 100 + (uint32_t)ver.patchVersion;","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/drivers/metal/metal_device_properties.cpp#L356"}]},
{"id":"OVF_25","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"In get_stdin_buffer() and get_stdin_string() at lines 2102 and 2113, data.size() (which can be size_t/64-bit) is implicitly cast to DWORD (32-bit) when passed to ReadFile(). If p_buffer_size exceeds 4GB, the cast truncates and ReadFile reads less than intended. On 32-bit systems, this is less critical, but on 64-bit systems with large buffers, this could cause issues.","fix":"Add explicit size clamping: 'DWORD read_size = (data.size() > MAXDWORD) ? MAXDWORD : (DWORD)data.size();' and use read_size in ReadFile().","locations":[{"ref":"platform/windows/os_windows.cpp:2100","code":" 2100 | \tif (ReadFile(GetStdHandle(STD_INPUT_HANDLE), data.ptrw(), data.size(), &count, nullptr)) {","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/windows/os_windows.cpp#L2100"},{"ref":"platform/windows/os_windows.cpp:2111","code":" 2111 | \tif (ReadFile(GetStdHandle(STD_INPUT_HANDLE), data.ptrw(), data.size(), &count, nullptr)) {","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/windows/os_windows.cpp#L2111"}]},
{"id":"OVF_26","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"At lines 482 and 485, multiplying uint32_t instance_size by tlas->max_instance_count or p_instances.size() could theoretically overflow. However, instance_size is device-provided and both multiplications are constrained by API limits and actual memory allocation.","fix":"Add safe multiplication checks or use uint64_t for intermediate calculations: 'uint64_t instance_buffer_size = uint64_t(instance_size) * tlas->max_instance_count' to prevent silent overflow.","locations":[{"ref":"servers/rendering/rendering_device.cpp:531","code":"  531 | \tuint32_t instance_buffer_size = instance_size * tlas->max_instance_count;","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/servers/rendering/rendering_device.cpp#L531"},{"ref":"servers/rendering/rendering_device.cpp:534","code":"  534 | \tuint32_t instance_buffer_used_size = instance_size * p_instances.size();","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/servers/rendering/rendering_device.cpp#L534"},{"ref":"servers/rendering/rendering_device.cpp:8196","code":" 8196 | \t\t\tuint32_t instance_buffer_size = driver->api_trait_get(RDD::API_TRAIT_ACCELERATION_STRUCTURE_INSTANCE_SIZE) * acceleration_structure.max_instance_count;","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/servers/rendering/rendering_device.cpp#L8196"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"critical","difficulty":"very_easy","description":"In command_clear_depth_stencil_texture(), multiple DSV descriptors are created to the same handle location in a loop without advancing the handle. The loop creates mipmap_count DSVs all to cmd_buf_info->dsv_alloc.cpu_handle, overwriting each one. This will cause the last iteration's DSV to be cleared with potentially incorrect descriptor data.","fix":"Either allocate multiple DSV descriptors (one per mipmap level), or use get_cpu_handle() to advance the handle for each iteration like the code does elsewhere (e.g., line 3187 and 3194).","locations":[{"ref":"drivers/d3d12/rendering_device_driver_d3d12.cpp:4252-4266","code":" 4252 | \t\tfor (uint32_t i = 0; i < p_subresources.mipmap_count; i++) {\n 4253 | \t\t\tD3D12_DEPTH_STENCIL_VIEW_DESC dsv_desc = _make_dsv_for_texture(tex_info, p_subresources.base_mipmap + i, p_subresources.base_layer, p_subresources.layer_count, false);\n 4254 | \t\t\tdevice->CreateDepthStencilView(\n 4255 | \t\t\t\t\ttex_info->resource,\n 4256 | \t\t\t\t\t&dsv_desc,\n 4257 | \t\t\t\t\tcmd_buf_info->dsv_alloc.cpu_handle);\n 4258 | \n 4259 | \t\t\tcmd_buf_info->cmd_list->ClearDepthStencilView(\n 4260 | \t\t\t\t\tcmd_buf_info->dsv_alloc.cpu_handle,\n 4261 | \t\t\t\t\tclear_flags,\n 4262 | \t\t\t\t\tp_depth,\n 4263 | \t\t\t\t\tp_stencil,\n 4264 | \t\t\t\t\t0,\n 4265 | \t\t\t\t\tnullptr);\n 4266 | \t\t}","lines":15,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/drivers/d3d12/rendering_device_driver_d3d12.cpp#L4252-L4266"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"critical","difficulty":"very_easy","description":"At line 216-218, the condition 'if (current_shape == SHAPE_NONE)' directly contradicts the intent. When current_shape is SHAPE_NONE, get_current_shape_index() returns -1, causing an array out-of-bounds access on shapes[-1]. The logic should be 'if (current_shape != SHAPE_NONE)'.","fix":"Change line 216 from 'if (current_shape == SHAPE_NONE)' to 'if (current_shape != SHAPE_NONE)' to prevent invalid array indexing when SHAPE_NONE is selected.","locations":[{"ref":"scene/gui/color_picker.cpp:216-218","code":"  216 | \t\t\t\t\tif (current_shape == SHAPE_NONE) {\n  217 | \t\t\t\t\t\tshapes[get_current_shape_index()]->echo_multiplier = 1;\n  218 | \t\t\t\t\t}","lines":3,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/gui/color_picker.cpp#L216-L218"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"critical","difficulty":"very_easy","description":"Line 2164: In OP_NEGATE case for float types, negates uninitialized scalar.real instead of p_a.real. Results in uninitialized data being returned when negating float constants.","fix":"Change 'scalar.real = -scalar.real;' to 'scalar.real = -p_a.real;'","locations":[{"ref":"servers/rendering/shader_language.cpp:2194","code":" 2194 | \t\t\t\tscalar.real = -scalar.real;","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/servers/rendering/shader_language.cpp#L2194"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"critical","difficulty":"very_easy","description":"Line 2340: Type mismatch in comparison. p_va.size() returns size_t but is compared with p_ret_type (a DataType enum). Should compare p_va.size() against 'size' (the uint32_t computed on line 2339). This causes all unary vector operations to fail validation and be treated as non-evaluable, breaking compile-time constant folding.","fix":"Change 'if (p_va.size() != p_ret_type)' to 'if (p_va.size() != size)'","locations":[{"ref":"servers/rendering/shader_language.cpp:2370","code":" 2370 | \tif (p_va.size() != p_ret_type) {","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/servers/rendering/shader_language.cpp#L2370"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"Type mixing and logic error in engine.cpp line 45: Assignment to max_user_physics_steps_per_frame uses MAX with mismatched variable names (comparing max_physics_steps_per_frame twice instead of using the calculated product). The multiplication of integer by double (_user_time_scale) causes implicit double-to-int conversion, and the logic doesn't make semantic sense for computing a 'user' scaled value.","fix":"Correct the logic: 'max_user_physics_steps_per_frame = MAX(1, (int)(max_physics_steps_per_frame * _user_time_scale));' to properly scale the physics steps by the user time scale factor.","locations":[{"ref":"core/config/engine.cpp:48","code":"   48 | \tmax_user_physics_steps_per_frame = MAX(max_physics_steps_per_frame, max_physics_steps_per_frame * _user_time_scale);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/core/config/engine.cpp#L48"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"Incorrect alpha blending bounds in _overlay function. Line 1228 uses MIN((uint16_t)(p_alpha * 256.0f), 256) but then uses values in range [0, 256]. This allows alpha=256 which is out of bounds, causing p_dst[i] * (256 - 256) = 0 and potentially wrong pixel values when alpha is exactly 1.0.","fix":"Clamp alpha to [0, 255] instead of [0, 256]: uint16_t alpha = MIN((uint16_t)(p_alpha * 255.0f + 0.5f), 255);","locations":[{"ref":"core/io/image.cpp:1253","code":" 1253 | \tuint16_t alpha = MIN((uint16_t)(p_alpha * 256.0f), 256);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/core/io/image.cpp#L1253"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"Weight scale not applied when jumping is enabled in AStarGrid2D::_solve(). The weight_scale is initialized to 1.0 and only updated in the non-jumping branch (line 555). When jumping is enabled and _jump() returns a point, the weight_scale remains 1.0 regardless of the jumped-to point's actual weight_scale. This violates the expected behavior where pathfinding should respect each point's weight. A TODO comment at line 546 acknowledges this limitation.","fix":"Add weight_scale retrieval after jumping: After line 550 (the !e check), add:\n  if (jumping_enabled && e) {\n    weight_scale = e->weight_scale;\n  }\nThis ensures jumped-to points also have their weight_scale applied.","locations":[{"ref":"core/math/a_star_grid_2d.cpp:543-556","code":"  543 | \t\t\treal_t weight_scale = 1.0;\n  544 | \n  545 | \t\t\tif (jumping_enabled) {\n  546 | \t\t\t\t// TODO: Make it works with weight_scale.\n  547 | \t\t\t\te = _jump(p, e);\n  548 | \t\t\t\tif (!e || e->closed_pass == pass) {\n  549 | \t\t\t\t\tcontinue;\n  550 | \t\t\t\t}\n  551 | \t\t\t} else {\n  552 | \t\t\t\tif (_get_solid_unchecked(e->id) || e->closed_pass == pass) {\n  553 | \t\t\t\t\tcontinue;\n  554 | \t\t\t\t}\n  555 | \t\t\t\tweight_scale = e->weight_scale;\n  556 | \t\t\t}","lines":14,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/core/math/a_star_grid_2d.cpp#L543-L556"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In Object::free_instance_binding(), the element removal logic incorrectly shifts array elements during iteration. When a matching token is found (line 2219), 'found' is set to true (line 2223). However, the code then immediately enters the 'if(found)' block (line 2225) on the same iteration and performs array shifts (line 2227), continuing to shift for every subsequent iteration. This causes the elements to be shifted multiple times, corrupting the array structure and potentially losing data or accessing invalid memory.","fix":"Refactor the removal logic to either: (1) Remove the element immediately and break the loop, or (2) Iterate backwards through the array when removing elements. A corrected version would break after finding and shifting: if (!found && _instance_bindings[i].token == p_token) { ... found = true; } if (found && i + 1 < _instance_binding_count) { _instance_bindings[i] = _instance_bindings[i + 1]; } else if (found) { break; }","locations":[{"ref":"core/object/object.cpp:2286-2307","code":" 2286 | void Object::free_instance_binding(void *p_token) {\n 2287 | \tbool found = false;\n 2288 | \tMutexLock instance_binding_lock(_instance_binding_mutex);\n 2289 | \tfor (uint32_t i = 0; i < _instance_binding_count; i++) {\n 2290 | \t\tif (!found && _instance_bindings[i].token == p_token) {\n 2291 | \t\t\tif (_instance_bindings[i].free_callback) {\n 2292 | \t\t\t\t_instance_bindings[i].free_callback(_instance_bindings[i].token, this, _instance_bindings[i].binding);\n 2293 | \t\t\t}\n 2294 | \t\t\tfound = true;\n 2295 | \t\t}\n 2296 | \t\tif (found) {\n 2297 | \t\t\tif (i + 1 < _instance_binding_count) {\n 2298 | \t\t\t\t_instance_bindings[i] = _instance_bindings[i + 1];\n 2299 | \t\t\t} else {\n 2300 | \t\t\t\t_instance_bindings[i] = { nullptr };\n 2301 | \t\t\t}\n 2302 | \t\t}\n 2303 | \t}\n 2304 | \tif (found) {\n 2305 | \t\t_instance_binding_count--;\n 2306 | \t}\n 2307 | }","lines":22,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/core/object/object.cpp#L2286-L2307"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"Hash collision vulnerability in profiling.cpp: The _intern_name function only checks hash equality (line 94: 'if (_data->hash == hash)') without verifying that the actual names are equal. This allows hash collisions to return incorrect cached StringInternData, leading to memory safety issues.","fix":"Add name equality check after hash comparison: 'if (_data->hash == hash && _data->name == p_name)' to properly handle hash collisions.","locations":[{"ref":"core/profiling/profiling.cpp:94","code":"   94 | \t\tif (_data->hash == hash) {","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/core/profiling/profiling.cpp#L94"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"Same bug as above in String::split() with char* parameter. Incorrect substr length when maxsplit limit is hit at line 1091.","fix":"Change 'ret.push_back(substr(from, len));' to 'ret.push_back(substr(from, len - from));'","locations":[{"ref":"core/string/ustring.cpp:1095","code":" 1095 | \t\t\t\t\tret.push_back(substr(from, len));","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/core/string/ustring.cpp#L1095"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"Incorrect comparison in simplify_path when checking Windows drive letters. Line 4185 compares p < s.find_char('/'), but find_char returns -1 when not found. If '/' is not found, the comparison becomes p < -1, which is incorrectly true for positive p values due to unsigned integer comparison semantics.","fix":"Split the condition: check if s.find_char('/') != -1 first, then only compare if it's valid. Or handle the -1 case explicitly: int slash_pos = s.find_char('/'); if (p != -1 && (slash_pos == -1 || p < slash_pos)) { ... }","locations":[{"ref":"core/string/ustring.cpp:4199","code":" 4199 | \t\t\tif (p != -1 && p < s.find_char('/')) {","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/core/string/ustring.cpp#L4199"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"Incorrect hex digit validation in uri_decode and uri_file_decode. The code only checks for uppercase hex digits (is_digit || is_ascii_upper_case) but not lowercase 'a'-'f'. Valid lowercase hex in percent-encoded URLs won't be decoded properly.","fix":"Use is_hex_digit() function instead, or explicitly check: if (is_hex_digit(ord1)) instead of (is_digit(ord1) || is_ascii_upper_case(ord1))","locations":[{"ref":"core/string/ustring.cpp:4430-4432","code":" 4430 | \t\t\tif (is_digit(ord1) || is_ascii_upper_case(ord1)) {\n 4431 | \t\t\t\tchar ord2 = src[i + 2];\n 4432 | \t\t\t\tif (is_digit(ord2) || is_ascii_upper_case(ord2)) {","lines":3,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/core/string/ustring.cpp#L4430-L4432"},{"ref":"core/string/ustring.cpp:4430-4432","code":" 4430 | \t\t\tif (is_digit(ord1) || is_ascii_upper_case(ord1)) {\n 4431 | \t\t\t\tchar ord2 = src[i + 2];\n 4432 | \t\t\t\tif (is_digit(ord2) || is_ascii_upper_case(ord2)) {","lines":3,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/core/string/ustring.cpp#L4430-L4432"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"Incorrect variable returned in operator<(). The function signature specifies return type 'bool', but line 875 returns 'r' which is a Variant type. The actual bool result from the evaluate() call is assigned to variable 'v' (line 873), but 'v' is never used. The Variant-to-bool conversion is implicit and may not produce the intended comparison result.","fix":"Change line 875 from 'return r;' to 'return v;' to return the actual boolean result from the evaluate() function call.","locations":[{"ref":"core/variant/variant.cpp:896-904","code":"  896 | bool Variant::operator<(const Variant &p_variant) const {\n  897 | \tif (type != p_variant.type) { //if types differ, then order by type first\n  898 | \t\treturn type < p_variant.type;\n  899 | \t}\n  900 | \tbool v;\n  901 | \tVariant r;\n  902 | \tevaluate(OP_LESS, *this, p_variant, r, v);\n  903 | \treturn r;\n  904 | }","lines":9,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/core/variant/variant.cpp#L896-L904"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"Incorrect use of AND operator in condition at line 2110. The condition checks if line_point_count differs AND if vertex_array is non-zero, but the logic should be checking if either differs (line_point_count OR sdf_point_count) before freeing resources. If sdf_point_count changes but line_point_count doesn't, the vertices won't be properly freed/reallocated.","fix":"Change AND (&&) to OR (||) in the condition: `if (oc->sdf_index_count != sdf_indices.size() || oc->sdf_point_count != p_points.size() && oc->sdf_vertex_array != 0)`. Also should be consistent with line 2007 pattern.","locations":[{"ref":"drivers/gles3/rasterizer_canvas_gles3.cpp:2110","code":" 2110 | \tif (oc->sdf_index_count != sdf_indices.size() && oc->sdf_point_count != p_points.size() && oc->sdf_vertex_array != 0) {","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/drivers/gles3/rasterizer_canvas_gles3.cpp#L2110"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"Incorrect logical operator in roughness texture detection - uses OR (||) instead of AND (&&) to check if hint is within ROUGHNESS range. This causes the roughness detection callback to be invoked for almost all texture hints, not just roughness hints, leading to incorrect callback invocation.","fix":"Change the condition from:\n  if (tex->detect_roughness_callback && (p_texture_uniforms[i].hint >= ShaderLanguage::ShaderNode::Uniform::HINT_ROUGHNESS_R || p_texture_uniforms[i].hint <= ShaderLanguage::ShaderNode::Uniform::HINT_ROUGHNESS_GRAY))\nto:\n  if (tex->detect_roughness_callback && (p_texture_uniforms[i].hint >= ShaderLanguage::ShaderNode::Uniform::HINT_ROUGHNESS_R && p_texture_uniforms[i].hint <= ShaderLanguage::ShaderNode::Uniform::HINT_ROUGHNESS_GRAY))\nThis properly restricts the callback to only roughness texture hints.","locations":[{"ref":"drivers/gles3/storage/material_storage.cpp:959","code":"  959 | \t\t\t\t\tif (tex->detect_roughness_callback && (p_texture_uniforms[i].hint >= ShaderLanguage::ShaderNode::Uniform::HINT_ROUGHNESS_R || p_texture_uniforms[i].hint <= ShaderLanguage::ShaderNode::Uniform::HINT_ROUGHNESS_GRAY)) {","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/drivers/gles3/storage/material_storage.cpp#L959"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"Incorrect type casting from signed to unsigned in audio sample channel mixing. When mixing audio channels with uneven counts, the code casts signed int32_t samples to uint32_t, which causes incorrect behavior for negative sample values. This results in audio distortion or clipping when processing negative-valued audio samples.","fix":"Change 'uint32_t l' and 'uint32_t r' to 'int32_t l' and 'int32_t r'. This matches the pattern used in WASAPI driver (drivers/wasapi/audio_driver_wasapi.cpp:801-802) and preserves the signed nature of audio samples through the mixing operation.","locations":[{"ref":"drivers/pulseaudio/audio_driver_pulseaudio.cpp:437-438","code":"  437 | \t\t\t\t\t\tuint32_t l = ad->samples_in[in_idx++] >> 16;\n  438 | \t\t\t\t\t\tuint32_t r = ad->samples_in[in_idx++] >> 16;","lines":2,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/drivers/pulseaudio/audio_driver_pulseaudio.cpp#L437-L438"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"Type mismatch in _update_visibility(): bool variable 'any_visible' is assigned a Control pointer instead of true. This is misleading code with incorrect semantics.","fix":"Change 'any_visible = c;' to 'any_visible = true;'","locations":[{"ref":"editor/docks/editor_dock_manager.cpp:76","code":"   76 | \t\tany_visible = c;","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/docks/editor_dock_manager.cpp#L76"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"Array size mismatch in _convert_dialog_action() at lines 2006-2008. The code fills `converted_resources` only when `conversion_id == selected_conversion_id` (inner loop with break), but `selected_resources` contains all selected resources. Later, it loops through `converted_resources.size()` and accesses `selected_resources.get(i)`, causing an out-of-bounds access when sizes differ.","fix":"Match the loop condition to `selected_resources.size()` instead of `converted_resources.size()`, or ensure equal-sized vectors are built by tracking conversion success per resource.","locations":[{"ref":"editor/docks/filesystem_dock.cpp:1995-2033","code":" 1995 | \tfor (Ref<Resource> res : selected_resources) {\n 1996 | \t\tVector<Ref<EditorResourceConversionPlugin>> conversions = EditorNode::get_singleton()->find_resource_conversion_plugin_for_resource(res);\n 1997 | \t\tfor (const Ref<EditorResourceConversionPlugin> &conversion : conversions) {\n 1998 | \t\t\tint conversion_id = 0;\n 1999 | \t\t\tfor (const String &target : cached_valid_conversion_targets) {\n 2000 | \t\t\t\tif (conversion_id == selected_conversion_id && conversion->converts_to() == target) {\n 2001 | \t\t\t\t\tRef<Resource> converted_res = conversion->convert(res);\n 2002 | \t\t\t\t\tERR_FAIL_COND(converted_res.is_null());\n 2003 | \t\t\t\t\tERR_FAIL_COND(res.is_null());\n 2004 | \t\t\t\t\tconverted_resources.push_back(converted_res);\n 2005 | \t\t\t\t\tresources_to_erase_history_for.insert(res);\n 2006 | \t\t\t\t\tbreak;\n 2007 | \t\t\t\t}\n 2008 | \t\t\t\tconversion_id++;\n 2009 | \t\t\t}\n 2010 | \t\t}\n 2011 | \t}\n 2012 | \n 2013 | \t// Clear history for the objects being replaced.\n 2014 | \tEditorUndoRedoManager *undo_redo = EditorUndoRedoManager::get_singleton();\n 2015 | \tfor (Ref<Resource> res : resources_to_erase_history_for) {\n 2016 | \t\tundo_redo->clear_history(true, undo_redo->get_history_id_for_object(res.ptr()));\n 2017 | \t}\n 2018 | \n 2019 | \t// Updates all the resources existing as node properties.\n 2020 | \tEditorNode::get_singleton()->replace_resources_in_scenes(selected_resources, converted_resources);\n 2021 | \n 2022 | \t// Overwrite the old resources.\n 2023 | \tfor (int i = 0; i < converted_resources.size(); i++) {\n 2024 | \t\tRef<Resource> original_resource = selected_resources.get(i);\n 2025 | \t\tRef<Resource> new_resource = converted_resources.get(i);\n 2026 | \n 2027 | \t\t// Notify plugins that the original resource is removed.\n 2028 | \t\temit_signal(SNAME(\"file_removed\"), original_resource->get_path());\n 2029 | \t\t// Overwrite the path.\n 2030 | \t\tnew_resource->set_path(original_resource->get_path(), true);\n 2031 | \n 2032 | \t\tResourceSaver::save(new_resource);\n 2033 | \t}","lines":39,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/docks/filesystem_dock.cpp#L1995-L2033"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"Inverted boolean logic in line 5115. The condition checks `!target_node || !target_node->is_queued_for_deletion()` but should be `!target_node || target_node->is_queued_for_deletion()` (missing negation on second part). The code attempts to reacquire the node when it exists AND is NOT marked for deletion, which is backwards - it should reacquire when it's marked for deletion or doesn't exist.","fix":"Change line 5115 from `if (!target_node || !target_node->is_queued_for_deletion())` to `if (!target_node || target_node->is_queued_for_deletion())`","locations":[{"ref":"editor/editor_node.cpp:5207","code":" 5207 | \t\t\tif (!target_node || !target_node->is_queued_for_deletion()) {","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/editor_node.cpp#L5207"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In CodeSignRequirements::_parse_key(), the r_pos variable is incremented at line 474 before being used at line 475. This causes incorrect pointer arithmetic when reading string data - it reads from the updated position (which is past the data) instead of the original position. The data buffer offset calculation becomes (new_r_pos + 4) instead of (original_r_pos + 4), reading from wrong memory location.","fix":"Move the r_pos increment to after the String::utf8() call, or save the position before incrementing: 'uint32_t old_pos = r_pos; r_pos += 4 + key_size + PAD(key_size, 4); r_out += \"[\" + String::utf8((const char *)blob.ptr() + old_pos + 4, key_size) + \"]\";'","locations":[{"ref":"editor/export/codesign.cpp:468-476","code":"  468 | _FORCE_INLINE_ void CodeSignRequirements::_parse_key(uint32_t &r_pos, String &r_out, uint32_t p_rq_size) const {\n  469 | #define _R(x) BSWAP32(*(uint32_t *)(blob.ptr() + x))\n  470 | \tERR_FAIL_COND_MSG(r_pos >= p_rq_size, \"CodeSign/Requirements: Out of bounds.\");\n  471 | \tconst uint32_t key_size = _R(r_pos);\n  472 | \tERR_FAIL_COND_MSG(r_pos + key_size > p_rq_size, \"CodeSign/Requirements: Out of bounds.\");\n  473 | \tr_pos += 4 + key_size + PAD(key_size, 4);\n  474 | \tr_out += \"[\" + String::utf8((const char *)blob.ptr() + r_pos + 4, key_size) + \"]\";\n  475 | #undef _R\n  476 | }","lines":9,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/export/codesign.cpp#L468-L476"}]},
