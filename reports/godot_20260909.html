{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"Incomplete array insertion logic: If no matching lightmap_cache entry is found during iteration, the new lightmap_cache is never inserted into r_lightmap_caches. The loop breaks only when new_md5 < md5 (inserts at position) or new_md5 == md5 (duplicate, breaks), but if new_md5 > all existing values, the insertion is skipped entirely.","fix":"After the loop at line 2806, add: if (i == r_lightmap_caches.size()) { r_lightmap_caches.push_back(lightmap_cache); } to insert the item at the end if no insertion occurred during the loop.","locations":[{"ref":"editor/import/3d/resource_importer_scene.cpp:2848-2861","code":" 2848 | \t\t\t\t\t\t\tString new_md5 = String::md5(lightmap_cache.ptr()); // MD5 is stored at the beginning of the cache data\n 2849 | \n 2850 | \t\t\t\t\t\t\tfor (int i = 0; i < r_lightmap_caches.size(); i++) {\n 2851 | \t\t\t\t\t\t\t\tString md5 = String::md5(r_lightmap_caches[i].ptr());\n 2852 | \t\t\t\t\t\t\t\tif (new_md5 < md5) {\n 2853 | \t\t\t\t\t\t\t\t\tr_lightmap_caches.insert(i, lightmap_cache);\n 2854 | \t\t\t\t\t\t\t\t\tbreak;\n 2855 | \t\t\t\t\t\t\t\t}\n 2856 | \n 2857 | \t\t\t\t\t\t\t\tif (new_md5 == md5) {\n 2858 | \t\t\t\t\t\t\t\t\tbreak;\n 2859 | \t\t\t\t\t\t\t\t}\n 2860 | \t\t\t\t\t\t\t}\n 2861 | \t\t\t\t\t\t}","lines":14,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/import/3d/resource_importer_scene.cpp#L2848-L2861"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"HashMap operator[] inserts keys on access. At line 289, accessing import_variation_data_b->settings[E.key] may modify settings dictionary by inserting keys that don't exist, which is unintended during a comparison check. This is inconsistent with the code's own pattern elsewhere (lines 53, 62, 66) which uses .has() before accessing.","fix":"Use .has() to check before accessing: match = match && (import_variation_data_b->settings.has(E.key) && import_variation_data_b->settings[E.key] == E.value);","locations":[{"ref":"editor/import/dynamic_font_import_settings.cpp:289","code":"  289 | \t\t\t\t\tmatch = match && (import_variation_data_b->settings[E.key] == E.value);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/import/dynamic_font_import_settings.cpp#L289"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"EditorPropertyProjection::_set_read_only() loops only through indices 0-11, but the class has 16 spin sliders (spin[0] to spin[15]). This causes spin[12], spin[13], spin[14], spin[15] to never be set as read-only, leaving them editable even when the property should be read-only.","fix":"Change line 2844 from 'for (int i = 0; i < 12; i++)' to 'for (int i = 0; i < 16; i++)' to match the 16 spin sliders declared and used in the class (lines 2863-2866, 2888-2891, 2927).","locations":[{"ref":"editor/inspector/editor_properties.cpp:2847-2850","code":" 2847 | void EditorPropertyProjection::_set_read_only(bool p_read_only) {\n 2848 | \tfor (int i = 0; i < 12; i++) {\n 2849 | \t\tspin[i]->set_read_only(p_read_only);\n 2850 | \t}","lines":4,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/inspector/editor_properties.cpp#L2847-L2850"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"Hash mismatch in file comparison: hash_before is computed using String::hash() (uint32_t) at line 331, while hash_after is computed using String::hash64() (uint64_t) at line 455. These return completely different hash values computed by different algorithms. Comparing them at line 458 will not reliably detect if a file was changed, potentially causing modified files to be incorrectly identified as unchanged or vice versa.","fix":"Use consistent hash functions. Either use .hash() for both variables (and declare both as uint32_t), or use .hash64() for both (and declare both as uint64_t). The fix should be: change line 331 from 'uint64_t hash_before = file_content_before.hash();' to 'uint64_t hash_before = file_content_before.hash64();' to match line 455.","locations":[{"ref":"editor/project_upgrade/project_converter_3_to_4.cpp:330","code":"  330 | \t\tuint64_t hash_before = file_content_before.hash();","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/project_upgrade/project_converter_3_to_4.cpp#L330"},{"ref":"editor/project_upgrade/project_converter_3_to_4.cpp:454","code":"  454 | \t\t\tuint64_t hash_after = file_content_after.hash64();","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/project_upgrade/project_converter_3_to_4.cpp#L454"},{"ref":"editor/project_upgrade/project_converter_3_to_4.cpp:457","code":"  457 | \t\t\tif (hash_before != hash_after || file_name.ends_with(\".gdshader\")) {","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/project_upgrade/project_converter_3_to_4.cpp#L457"}]},
{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"MeshInstance3DEditor::_menu_option() checks `mesh.is_null()` on line 468 but should check `mesh2.is_null()` since `mesh2` was assigned on line 467. The variable `mesh` was already checked on line 429-430. This causes incorrect null validation and may proceed with a null mesh2.","fix":"Change line 468 from `if (mesh.is_null())` to `if (mesh2.is_null())`.","locations":[{"ref":"editor/scene/3d/mesh_instance_3d_editor_plugin.cpp:468","code":"  468 | \t\t\tif (mesh.is_null()) {","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/scene/3d/mesh_instance_3d_editor_plugin.cpp#L468"}]},
{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In ThemeItemEditorDialog::_remove_data_type_items(), line 1674 incorrectly uses member variable 'edited_item_type' instead of function parameter 'p_item_type' when clearing theme items. This causes wrong theme type's items to be cleared.","fix":"Replace 'edited_item_type' with 'p_item_type' in the third argument of clear_theme_item call","locations":[{"ref":"editor/scene/gui/theme_editor_plugin.cpp:1674","code":" 1674 | \t\tnew_snapshot->clear_theme_item(p_data_type, E, edited_item_type);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/scene/gui/theme_editor_plugin.cpp#L1674"}]},
{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In _item_remove_cbk, the has_font check occurs after add_do_method with clear_font, so it always returns false. The check should happen on the current state before adding the clear command. This causes incorrect undo behavior - the font will always be restored as an empty Ref instead of the actual value.","fix":"Move the has_font check before line 3132, and store the font value first. Pattern: get current value, check if exists, then add clear/set undo based on what was checked.","locations":[{"ref":"editor/scene/gui/theme_editor_plugin.cpp:3133-3139","code":" 3133 | \t\tcase Theme::DATA_TYPE_FONT: {\n 3134 | \t\t\tur->add_do_method(*edited_theme, \"clear_font\", p_item_name, edited_type);\n 3135 | \t\t\tif (edited_theme->has_font(p_item_name, edited_type)) {\n 3136 | \t\t\t\tur->add_undo_method(*edited_theme, \"set_font\", p_item_name, edited_type, edited_theme->get_font(p_item_name, edited_type));\n 3137 | \t\t\t} else {\n 3138 | \t\t\t\tur->add_undo_method(*edited_theme, \"set_font\", p_item_name, edited_type, Ref<Font>());\n 3139 | \t\t\t}","lines":7,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/scene/gui/theme_editor_plugin.cpp#L3133-L3139"}]},
{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"Inverted condition in _get_debug_tooltip: checks if tooltips are ENABLED and returns empty, should check if DISABLED. This breaks debug tooltips when enabled.","fix":"Change line 176 from 'if (EDITOR_GET(...)' to 'if (!EDITOR_GET(...)'","locations":[{"ref":"editor/script/script_editor_plugin.cpp:891","code":"  891 | \tif (EDITOR_GET(\"text_editor/behavior/documentation/enable_tooltips\")) {","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/script/script_editor_plugin.cpp#L891"}]},
{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In EditorBuildProfile::load_from_file(), the kv.value from the dictionary is never used when loading disabled_build_options. The function always sets build_options_disabled[i] = true regardless of the actual value stored in the file, making it impossible to correctly restore disabled states. The value should be checked against build_option_disable_values[i] to determine the actual disabled state.","fix":"Change line 597 from 'build_options_disabled[i] = true;' to properly interpret kv.value by comparing it with build_option_disable_values[i]: 'bool value_matches_disable = (bool)kv.value == build_option_disable_values[i]; build_options_disabled[i] = value_matches_disable;'","locations":[{"ref":"editor/settings/editor_build_profile.cpp:606-616","code":"  606 | \t\tfor (const KeyValue<Variant, Variant> &kv : disabled_build_options_arr) {\n  607 | \t\t\tString key = kv.key;\n  608 | \n  609 | \t\t\tfor (int i = 0; i < BUILD_OPTION_MAX; i++) {\n  610 | \t\t\t\tString f = build_option_identifiers[i];\n  611 | \t\t\t\tif (f == key) {\n  612 | \t\t\t\t\tbuild_options_disabled[i] = true;\n  613 | \t\t\t\t\tbreak;\n  614 | \t\t\t\t}\n  615 | \t\t\t}\n  616 | \t\t}","lines":11,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/settings/editor_build_profile.cpp#L606-L616"}]},
{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In EditorSettingsDialog::drop_data_fw(), after removing an event at index_moving_from (line 867), the target_event_index used in the insert operation (line 868) is not adjusted. If index_moving_from < target_event_index, the target_event_index should be decremented by 1 to account for the shift caused by remove_at(). This can cause events to be inserted at the wrong position.","fix":"After line 867 (events.remove_at(index_moving_from)), add adjustment logic: 'if (index_moving_from < target_event_index) { target_event_index--; }' before the insert operation on line 868.","locations":[{"ref":"editor/settings/editor_settings_dialog.cpp:901-903","code":"  901 | \tVariant event_moved = events[index_moving_from];\n  902 | \tevents.remove_at(index_moving_from);\n  903 | \tevents.insert(target_event_index, event_moved);","lines":3,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/settings/editor_settings_dialog.cpp#L901-L903"}]},
{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"File descriptor leak in _query_device method. When the VIDIOC_QUERYCAP ioctl fails at line 60, ERR_FAIL_MSG is invoked which returns early without closing the file descriptor that was opened at line 55. This will leak the file descriptor on every failed device query.","fix":"Either close the file_descriptor before ERR_FAIL_MSG, or use a scoped RAII pattern to ensure cleanup on all paths","locations":[{"ref":"modules/camera/camera_feed_linux.cpp:55-60","code":"   55 | \tfile_descriptor = open(p_device_name.ascii().get_data(), O_RDWR | O_NONBLOCK, 0);\n   56 | \tERR_FAIL_COND_MSG(file_descriptor == -1, vformat(\"Cannot open file descriptor for %s. Error: %d.\", p_device_name, errno));\n   57 | \n   58 | \tstruct v4l2_capability capability;\n   59 | \tif (ioctl(file_descriptor, VIDIOC_QUERYCAP, &capability) == -1) {\n   60 | \t\tERR_FAIL_MSG(vformat(\"Cannot query device. Error: %d.\", errno));","lines":6,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/camera/camera_feed_linux.cpp#L55-L60"}]},
{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"Incorrect padding calculation for BC compressed DDS textures. The code adds the remainder instead of computing proper padding to round up to the nearest divisor. This causes width and height values to be padded incorrectly, leading to miscalculated buffer sizes and potential buffer overflows or underflows when reading mipmap data.","fix":"Replace w += w % info.divisor; h += h % info.divisor; with: w = (w + info.divisor - 1) & ~(info.divisor - 1); h = (h + info.divisor - 1) & ~(info.divisor - 1);","locations":[{"ref":"modules/dds/texture_loader_dds.cpp:155-156","code":"  155 | \t\tw += w % info.divisor;\n  156 | \t\th += h % info.divisor;","lines":2,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/dds/texture_loader_dds.cpp#L155-L156"}]},
{"id":"LOGIC_34","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"Type mismatch in OPCODE_ITERATE_BEGIN_VECTOR2I: counter is initialized as Variant::FLOAT but then written to using get_int(). This creates an inconsistent Variant state where the type is marked as FLOAT but contains INT data. Subsequent operations on this variant will interpret the bit pattern incorrectly.","fix":"Change line 3154 from 'VariantInternal::initialize(counter, Variant::FLOAT);' to 'VariantInternal::initialize(counter, Variant::INT);' to match the INT write operation on line 3155.","locations":[{"ref":"modules/gdscript/gdscript_vm.cpp:3168-3169","code":" 3168 | \t\t\t\tVariantInternal::initialize(counter, Variant::FLOAT);\n 3169 | \t\t\t\t*VariantInternal::get_int(counter) = bounds->x;","lines":2,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/gdscript/gdscript_vm.cpp#L3168-L3169"}]},
{"id":"LOGIC_35","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"Incorrect find() result check in skin_tool.cpp line 69. The Vector::find() method returns -1 if not found, or >= 0 if found. The condition 'find(p_node_index) > 0' will incorrectly return false when the element is at index 0, causing logic errors in skin handling.","fix":"Change the condition from '> 0' to '>= 0' or use '!= -1' to correctly check if find() succeeded.","locations":[{"ref":"modules/gltf/skin_tool.cpp:69","code":"   69 | \tif (p_skin->joints.find(p_node_index) > 0) {","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/gltf/skin_tool.cpp#L69"}]},
{"id":"LOGIC_36","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"Vector::find() returns index, not boolean. Line 69 checks if find() > 0, which incorrectly returns false when element is at index 0. Should be >= 0 or != -1.","fix":"Change 'if (p_skin->joints.find(p_node_index) > 0)' to 'if (p_skin->joints.find(p_node_index) != -1)' or '!= -1' or '>= 0'.","locations":[{"ref":"modules/gltf/skin_tool.cpp:69-71","code":"   69 | \tif (p_skin->joints.find(p_node_index) > 0) {\n   70 | \t\treturn true;\n   71 | \t}","lines":3,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/gltf/skin_tool.cpp#L69-L71"}]},
{"id":"LOGIC_37","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"Unchecked bounds access in sparse accessor value assignment at gltf_accessor.cpp lines 751-753. The check at line 751 verifies 'array_offset < ret_numbers.size()' but then line 753 writes to 'array_offset + in_vec' where in_vec ranges from 0 to vector_size-1. If array_offset == ret_numbers.size() - 1 and vector_size > 1, the write at array_offset + in_vec will exceed bounds.","fix":"Change line 751 to check 'array_offset + vector_size <= ret_numbers.size()' instead of just checking array_offset, or ensure the bounds check accounts for the full range of writes in the inner loop.","locations":[{"ref":"modules/gltf/structures/gltf_accessor.cpp:751-753","code":"  751 | \t\tERR_FAIL_INDEX_V_MSG(array_offset, ret_numbers.size(), ret_numbers, \"glTF import: Sparse indices were out of bounds for the accessor.\");\n  752 | \t\tfor (int64_t in_vec = 0; in_vec < vector_size; in_vec++) {\n  753 | \t\t\tret_numbers.set(array_offset + in_vec, sparse_values[in_sparse * vector_size + in_vec]);","lines":3,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/gltf/structures/gltf_accessor.cpp#L751-L753"}]},
{"id":"LOGIC_38","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"State corruption in pin_vertex: the vertex index is added to pinned_vertices vector at line 357 BEFORE validation of the index against map_visual_to_physics at line 360. If the validation fails (ERR_FAIL_COND at line 360), the vertex remains in the pinned list but was never properly initialized, causing inconsistent state where pinned_vertices contains invalid references.","fix":"Move the pinned_vertices.push_back(p_index) to line 366, after all validations pass.","locations":[{"ref":"modules/godot_physics_3d/godot_soft_body_3d.cpp:351-368","code":"  351 | void GodotSoftBody3D::pin_vertex(int p_index) {\n  352 | \tERR_FAIL_COND(p_index < 0);\n  353 | \n  354 | \tif (is_vertex_pinned(p_index)) {\n  355 | \t\treturn;\n  356 | \t}\n  357 | \n  358 | \tpinned_vertices.push_back(p_index);\n  359 | \n  360 | \tif (!soft_mesh.is_null()) {\n  361 | \t\tERR_FAIL_COND(p_index >= (int)map_visual_to_physics.size());\n  362 | \t\tuint32_t node_index = map_visual_to_physics[p_index];\n  363 | \n  364 | \t\tERR_FAIL_COND(node_index >= nodes.size());\n  365 | \t\tNode &node = nodes[node_index];\n  366 | \t\tnode.im = 0.0;\n  367 | \t}\n  368 | }","lines":18,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/godot_physics_3d/godot_soft_body_3d.cpp#L351-L368"}]},
{"id":"LOGIC_39","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"Incorrect loop bounds in audio playlist mixing. Line 291 uses 'for (int k = i; k < todo - i; k++)' to fill silence at end of buffer. The condition 'todo - i' doesn't correctly represent the number of frames to fill. Should be 'k < to_mix' to fill the rest of the current mix buffer.","fix":"Change the loop condition: for (int k = i; k < to_mix; k++) to properly fill remaining frames in the current mix buffer.","locations":[{"ref":"modules/interactive_music/audio_stream_playlist.cpp:289","code":"  289 | \t\t\t\t\t\t\tfor (int k = i; k < todo - i; k++) {","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/interactive_music/audio_stream_playlist.cpp#L289"}]},
{"id":"LOGIC_40","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"Inverted condition causes incorrect magnetometer scaling logic. The condition 'if (!(mag_current_max.x - mag_current_min.x))' should be 'if ((mag_current_max.x - mag_current_min.x))'. When max equals min (no range), the code should skip scaling, not apply it. This occurs three times (for x, y, z axes) and causes incorrect sensor data processing when magnetometer min and max are equal.","fix":"Remove the '!' (NOT) operator from the conditions on lines 86, 91, and 96. Change 'if (!(mag_current_max.x - mag_current_min.x))' to 'if ((mag_current_max.x - mag_current_min.x))'","locations":[{"ref":"modules/mobile_vr/mobile_vr_interface.cpp:86-88","code":"   86 | \tif (!(mag_current_max.x - mag_current_min.x)) {\n   87 | \t\tmag_raw.x -= (mag_current_min.x + mag_current_max.x) / 2.0;\n   88 | \t\tmag_scaled.x = (mag_raw.x - mag_current_min.x) / ((mag_current_max.x - mag_current_min.x) * 2.0 - 1.0);","lines":3,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/mobile_vr/mobile_vr_interface.cpp#L86-L88"},{"ref":"modules/mobile_vr/mobile_vr_interface.cpp:91-93","code":"   91 | \tif (!(mag_current_max.y - mag_current_min.y)) {\n   92 | \t\tmag_raw.y -= (mag_current_min.y + mag_current_max.y) / 2.0;\n   93 | \t\tmag_scaled.y = (mag_raw.y - mag_current_min.y) / ((mag_current_max.y - mag_current_min.y) * 2.0 - 1.0);","lines":3,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/mobile_vr/mobile_vr_interface.cpp#L91-L93"},{"ref":"modules/mobile_vr/mobile_vr_interface.cpp:96-98","code":"   96 | \tif (!(mag_current_max.z - mag_current_min.z)) {\n   97 | \t\tmag_raw.z -= (mag_current_min.z + mag_current_max.z) / 2.0;\n   98 | \t\tmag_scaled.z = (mag_raw.z - mag_current_min.z) / ((mag_current_max.z - mag_current_min.z) * 2.0 - 1.0);","lines":3,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/mobile_vr/mobile_vr_interface.cpp#L96-L98"}]},
{"id":"LOGIC_41","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"resize() followed by push_back() causes array to grow to 2x expected size. Line 148 pre-allocates polygon_count*3 entries, but lines 153-155 use push_back() which appends, resulting in polygon_count*6 total entries instead of polygon_count*3.","fix":"Remove the resize() call at line 148, or change push_back() calls to use indexed write[] access. Correct approach: `face_vertex_array[i*3 + j] = vertices[polygon[j]]` instead of `face_vertex_array.push_back(...)`","locations":[{"ref":"modules/navigation_3d/editor/navigation_region_3d_gizmo_plugin.cpp:148-156","code":"  148 | \tface_vertex_array.resize(polygon_count * 3);\n  149 | \n  150 | \tfor (int i = 0; i < polygon_count; i++) {\n  151 | \t\tVector<int> polygon = navigationmesh->get_polygon(i);\n  152 | \n  153 | \t\tface_vertex_array.push_back(vertices[polygon[0]]);\n  154 | \t\tface_vertex_array.push_back(vertices[polygon[1]]);\n  155 | \t\tface_vertex_array.push_back(vertices[polygon[2]]);\n  156 | \t}","lines":9,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/navigation_3d/editor/navigation_region_3d_gizmo_plugin.cpp#L148-L156"}]},
{"id":"LOGIC_42","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"Same resize-then-push_back bug at lines 193-204. Line 193 pre-allocates polygon_count*6 entries, but lines 198-203 use push_back() which appends, resulting in polygon_count*12 total entries instead of polygon_count*6.","fix":"Remove the resize() call at line 193, or change push_back() calls to indexed write[] access with proper index calculation.","locations":[{"ref":"modules/navigation_3d/editor/navigation_region_3d_gizmo_plugin.cpp:207-218","code":"  207 | \t\tline_vertex_array.resize(polygon_count * 6);\n  208 | \n  209 | \t\tfor (int i = 0; i < polygon_count; i++) {\n  210 | \t\t\tVector<int> polygon = navigationmesh->get_polygon(i);\n  211 | \n  212 | \t\t\tline_vertex_array.push_back(vertices[polygon[0]]);\n  213 | \t\t\tline_vertex_array.push_back(vertices[polygon[1]]);\n  214 | \t\t\tline_vertex_array.push_back(vertices[polygon[1]]);\n  215 | \t\t\tline_vertex_array.push_back(vertices[polygon[2]]);\n  216 | \t\t\tline_vertex_array.push_back(vertices[polygon[2]]);\n  217 | \t\t\tline_vertex_array.push_back(vertices[polygon[0]]);\n  218 | \t\t}","lines":12,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/navigation_3d/editor/navigation_region_3d_gizmo_plugin.cpp#L207-L218"}]},
{"id":"LOGIC_43","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"Incorrect condition in set_custom_data_layer_name() at line 1129. The condition 'if (p_value.is_empty() && custom_data_layers_by_name.has(p_value))' will never be true because an empty string would never be a key in the map. More importantly, when renaming a layer to a new non-empty name, the old name entry is never removed from the custom_data_layers_by_name map, causing stale references.","fix":"Replace the logic at lines 1129-1133 with proper handling of renaming: first remove the old layer name from the map if it exists, then add the new name. Should be something like: 'for (auto it = custom_data_layers_by_name.begin(); it != custom_data_layers_by_name.end(); ++it) { if (it->value == p_layer_id) { custom_data_layers_by_name.erase(it->key); break; } } if (!p_value.is_empty()) { custom_data_layers_by_name[p_value] = p_layer_id; }'","locations":[{"ref":"modules/tilemap/tile_set.cpp:1117-1137","code":" 1117 | void TileSet::set_custom_data_layer_name(int p_layer_id, String p_value) {\n 1118 | \tERR_FAIL_INDEX(p_layer_id, custom_data_layers.size());\n 1119 | \n 1120 | \t// Exit if another property has the same name.\n 1121 | \tif (!p_value.is_empty()) {\n 1122 | \t\tfor (int other_layer_id = 0; other_layer_id < get_custom_data_layers_count(); other_layer_id++) {\n 1123 | \t\t\tif (other_layer_id != p_layer_id && get_custom_data_layer_name(other_layer_id) == p_value) {\n 1124 | \t\t\t\tERR_FAIL_MSG(vformat(\"There is already a custom property named %s\", p_value));\n 1125 | \t\t\t}\n 1126 | \t\t}\n 1127 | \t}\n 1128 | \n 1129 | \tif (p_value.is_empty() && custom_data_layers_by_name.has(p_value)) {\n 1130 | \t\tcustom_data_layers_by_name.erase(p_value);\n 1131 | \t} else {\n 1132 | \t\tcustom_data_layers_by_name[p_value] = p_layer_id;\n 1133 | \t}\n 1134 | \n 1135 | \tcustom_data_layers.write[p_layer_id].name = p_value;\n 1136 | \temit_changed();\n 1137 | }","lines":21,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/tilemap/tile_set.cpp#L1117-L1137"}]},

roxies) {\n 1346 | \t\tArray a = E.key;\n 1347 | \t\tif (has_source(a[0]) && get_source(a[0])->has_tile(a[1]) && get_source(a[0])->has_alternative_tile(a[1], a[2])) {\n 1348 | \t\t\talternative_to_remove.push_back(a);\n 1349 | \t\t}\n 1350 | \t}\n 1351 | \tfor (int i = 0; i < alternative_to_remove.size(); i++) {\n 1352 | \t\tArray a = alternative_to_remove[i];\n 1353 | \t\tremove_alternative_level_tile_proxy(a[0], a[1], a[2]);\n 1354 | \t}\n 1355 | }","lines":38,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/tilemap/tile_set.cpp#L1318-L1355"}]},
{"id":"LOGIC_45","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"VisualShaderNodeCompare::generate_code() missing newline character in SCALAR FUNC_EQUAL and FUNC_NOT_EQUAL cases (lines 7545, 7547). The generated GLSL code for these comparison types lacks '\\n' at the end, while all other branches include it. This causes malformed shader code where the next statement runs on the same line.","fix":"Add '\\n' at the end of lines 7545 and 7547: change the string endings from '...\");' to '...\");\\n'","locations":[{"ref":"modules/visual_shader/vs_nodes/visual_shader_nodes.cpp:7456-7458","code":" 7456 | \t\t\t\tcode += \"\t\" + p_output_vars[0] + \" = (abs(\" + p_input_vars[0] + \" - \" + p_input_vars[1] + \") < \" + p_input_vars[2] + \");\";\n 7457 | \t\t\t} else if (func == FUNC_NOT_EQUAL) {\n 7458 | \t\t\t\tcode += \"\t\" + p_output_vars[0] + \" = !(abs(\" + p_input_vars[0] + \" - \" + p_input_vars[1] + \") < \" + p_input_vars[2] + \");\";","lines":3,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/visual_shader/vs_nodes/visual_shader_nodes.cpp#L7456-L7458"}]},
{"id":"LOGIC_46","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In FileAccessAndroid::_get_size(), the function takes a parameter p_file (the path to get size for) but completely ignores it and instead returns the size of the currently open asset. This breaks the intended API contract. The function should open p_file, get its size, and return it.","fix":"Reimplement _get_size() to properly handle the p_file parameter: open the file at p_file, call AAsset_getLength64() on it, close it, and return the size. The correct implementation should mirror the pattern used in file_access_unix.cpp.","locations":[{"ref":"platform/android/file_access_android.cpp:136-138","code":"  136 | int64_t FileAccessAndroid::_get_size(const String &p_file) {\n  137 | \treturn AAsset_getLength64(asset);\n  138 | }","lines":3,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/android/file_access_android.cpp#L136-L138"}]},
{"id":"LOGIC_47","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"Uninitialized jvalue returned in non-TOOLS_ENABLED builds. jvalue result declared at line 575 is only initialized inside #ifdef TOOLS_ENABLED block (line 583). When TOOLS_ENABLED is false, result.l is uninitialized garbage returned to Java.","fix":"Initialize result at declaration: `jvalue result = {};` at line 575.","locations":[{"ref":"platform/android/java_godot_lib_jni.cpp:602-616","code":"  602 | \tjvalue result;\n  603 | \n  604 | #ifdef TOOLS_ENABLED\n  605 | \tif (EditorSettings::get_singleton() != nullptr) {\n  606 | \t\tString section = jstring_to_string(p_section, env);\n  607 | \t\tString key = jstring_to_string(p_key, env);\n  608 | \t\tVariant default_value = _jobject_to_variant(env, p_default_value);\n  609 | \t\tVariant data = EditorSettings::get_singleton()->get_project_metadata(section, key, default_value);\n  610 | \t\tresult.l = _variant_to_jobject(env, data.get_type(), &data);\n  611 | \t}\n  612 | #else\n  613 | \tWARN_PRINT(\"Access to the Editor Settings Project Metadata is only available on Editor builds\");\n  614 | #endif\n  615 | \n  616 | \treturn result.l;","lines":15,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/android/java_godot_lib_jni.cpp#L602-L616"}]},
{"id":"LOGIC_48","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In get_entropy() with NO_URANDOM path, the loop at line 298 reads the full p_bytes size on every iteration instead of reading only the remaining bytes (left) and offset the buffer pointer correctly. This causes incomplete entropy collection - only the last chunk read overwrites the buffer, losing data from previous iterations.","fix":"Line 298 should be: ssize_t ret = read(r, r_buffer + (p_bytes - left), left); This reads only the remaining bytes into the correct offset position.","locations":[{"ref":"platform/linuxbsd/os_linuxbsd.cpp:1264-1271","code":" 1264 | \tint r = open(\"/dev/urandom\", O_RDONLY);\n 1265 | \tERR_FAIL_COND_V(r < 0, FAILED);\n 1266 | \tint left = p_bytes;\n 1267 | \tdo {\n 1268 | \t\tssize_t ret = read(r, r_buffer, p_bytes);\n 1269 | \t\tERR_FAIL_COND_V(ret <= 0, FAILED);\n 1270 | \t\tleft -= ret;\n 1271 | \t} while (left > 0);","lines":8,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/linuxbsd/os_linuxbsd.cpp#L1264-L1271"}]},
{"id":"LOGIC_49","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In _wl_touch_on_frame, lines 2656-2658 have inverted logic: if tp.touched_id == INVALID_WINDOW_ID, the code calls window_get_state(INVALID_WINDOW_ID), which is pointless. The check should be != INVALID_WINDOW_ID or the assignment should happen unconditionally, as ws is already fetched at line 2627.","fix":"Line 2656 condition should be '!=' instead of '==', or this block should be removed entirely since ws is already assigned on line 2627.","locations":[{"ref":"platform/linuxbsd/wayland/wayland_thread.cpp:2664-2666","code":" 2664 | \t\tif (tp.touched_id == DisplayServerEnums::INVALID_WINDOW_ID) {\n 2665 | \t\t\tws = wayland_thread->window_get_state(tp.touched_id);\n 2666 | \t\t}","lines":3,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/linuxbsd/wayland/wayland_thread.cpp#L2664-L2666"}]},
{"id":"LOGIC_50","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"UTF-8 to UTF-32 cursor position conversion logic in _wp_text_input_on_preedit_string has a critical flaw. The function decrements cursor_begin/end as it iterates through UTF-8 characters. When cursor_begin reaches exactly 0, it records the position. However, if cursor_begin skips past 0 and becomes negative, the condition `if (cursor_begin == 0)` will never be true for that iteration, leaving cursor_begin_utf32 as 0. This causes incorrect IME cursor position reporting.","fix":"Change the condition from `if (cursor_begin == 0)` to `if (cursor_begin <= 0 && cursor_begin_utf32 == 0)` to properly capture the position even if cursor_begin goes negative. Alternatively, check `if (cursor_begin <= 0 && cursor_begin > -byte_length_of_current_char)` to ensure we're in the right character range.","locations":[{"ref":"platform/linuxbsd/wayland/wayland_thread.cpp:3604-3654","code":" 3604 | void WaylandThread::_wp_text_input_on_preedit_string(void *data, struct zwp_text_input_v3 *wp_text_input_v3, const char *text, int32_t cursor_begin, int32_t cursor_end) {\n 3605 | \tSeatState *ss = (SeatState *)data;\n 3606 | \tif (!ss) {\n 3607 | \t\treturn;\n 3608 | \t}\n 3609 | \n 3610 | \tif (ss->ime_window_id == DisplayServerEnums::INVALID_WINDOW_ID) {\n 3611 | \t\treturn;\n 3612 | \t}\n 3613 | \n 3614 | \tss->ime_text = String::utf8(text);\n 3615 | \n 3616 | \t// Convert cursor positions from UTF-8 to UTF-32 offset.\n 3617 | \tint32_t cursor_begin_utf32 = 0;\n 3618 | \tint32_t cursor_end_utf32 = 0;\n 3619 | \tfor (int i = 0; i < ss->ime_text.length(); i++) {\n 3620 | \t\tuint32_t c = ss->ime_text[i];\n 3621 | \t\tif (c <= 0x7f) { // 7 bits.\n 3622 | \t\t\tcursor_begin -= 1;\n 3623 | \t\t\tcursor_end -= 1;\n 3624 | \t\t} else if (c <= 0x7ff) { // 11 bits\n 3625 | \t\t\tcursor_begin -= 2;\n 3626 | \t\t\tcursor_end -= 2;\n 3627 | \t\t} else if (c <= 0xffff) { // 16 bits\n 3628 | \t\t\tcursor_begin -= 3;\n 3629 | \t\t\tcursor_end -= 3;\n 3630 | \t\t} else if (c <= 0x001fffff) { // 21 bits\n 3631 | \t\t\tcursor_begin -= 4;\n 3632 | \t\t\tcursor_end -= 4;\n 3633 | \t\t} else if (c <= 0x03ffffff) { // 26 bits\n 3634 | \t\t\tcursor_begin -= 5;\n 3635 | \t\t\tcursor_end -= 5;\n 3636 | \t\t} else if (c <= 0x7fffffff) { // 31 bits\n 3637 | \t\t\tcursor_begin -= 6;\n 3638 | \t\t\tcursor_end -= 6;\n 3639 | \t\t} else {\n 3640 | \t\t\tcursor_begin -= 1;\n 3641 | \t\t\tcursor_end -= 1;\n 3642 | \t\t}\n 3643 | \t\tif (cursor_begin == 0) {\n 3644 | \t\t\tcursor_begin_utf32 = i + 1;\n 3645 | \t\t}\n 3646 | \t\tif (cursor_end == 0) {\n 3647 | \t\t\tcursor_end_utf32 = i + 1;\n 3648 | \t\t}\n 3649 | \t\tif (cursor_begin <= 0 && cursor_end <= 0) {\n 3650 | \t\t\tbreak;\n 3651 | \t\t}\n 3652 | \t}\n 3653 | \tss->ime_cursor = Vector2i(cursor_begin_utf32, cursor_end_utf32 - cursor_begin_utf32);\n 3654 | }","lines":51,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/linuxbsd/wayland/wayland_thread.cpp#L3604-L3654"}]},
{"id":"LOGIC_51","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"Bitwise OR instead of AND in poll event checking. Lines 3827 and 6046 use `if (poll_fd.revents | POLLIN)` which always evaluates to true if any bits are set (because | is OR), instead of `if (poll_fd.revents & POLLIN)` which properly checks if POLLIN bit is set. This causes the else branch to be unreachable, bypassing wl_display_cancel_read() when poll returns no input ready.","fix":"Change both `if (poll_fd.revents | POLLIN)` to `if (poll_fd.revents & POLLIN)` to properly check if the POLLIN bit is set in the revents bitmask.","locations":[{"ref":"platform/linuxbsd/wayland/wayland_thread.cpp:3855","code":" 3855 | \t\tif (poll_fd.revents | POLLIN) {","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/linuxbsd/wayland/wayland_thread.cpp#L3855"},{"ref":"platform/linuxbsd/wayland/wayland_thread.cpp:6095","code":" 6095 | \tif (poll_fd.revents | POLLIN) {","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/linuxbsd/wayland/wayland_thread.cpp#L6095"}]},
{"id":"LOGIC_52","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"Incorrect string substring operation in _xim_preedit_draw_callback at line 4480. When chg_length >= 0, the code uses 'substr(call_data->chg_length)' but should use 'substr(call_data->chg_first + call_data->chg_length)'. The current code treats chg_length as a starting position rather than calculating the correct offset after the replaced range.","fix":"Change 'ds->im_text.substr(call_data->chg_length)' to 'ds->im_text.substr(call_data->chg_first + call_data->chg_length)' to correctly skip over the replaced text range.","locations":[{"ref":"platform/linuxbsd/x11/display_server_x11.cpp:4528","code":" 4528 | \t\t\t\tds->im_text = ds->im_text.substr(0, call_data->chg_first) + changed_text + ds->im_text.substr(call_data->chg_length);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/linuxbsd/x11/display_server_x11.cpp#L4528"}]},
{"id":"LOGIC_53","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"Line 637: Incorrect array indexing in run-length encoding detection. The third condition compares src[i] (raw byte value) instead of src[(i + 2) * 4 + p_ch] (pixel i+2's color channel). This breaks the packbits RLE encoding algorithm which is trying to detect when three consecutive pixels have the same color value. The bug compares a single byte value against pixel data, causing incorrect icon encoding for macOS bundle icons.","fix":"Change src[i] to src[(i + 2) * 4 + p_ch] on line 637. The condition should be: if (i + 2 < src_len && src[i * 4 + p_ch] == src[(i + 1) * 4 + p_ch] && src[i * 4 + p_ch] == src[(i + 2) * 4 + p_ch])","locations":[{"ref":"platform/macos/export/export_plugin.cpp:637","code":"  637 | \t\t\tif (i + 2 < src_len && src[i * 4 + p_ch] == src[(i + 1) * 4 + p_ch] && src[i] == src[(i + 2) * 4 + p_ch]) {","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/macos/export/export_plugin.cpp#L637"}]},
