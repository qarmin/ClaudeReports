<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"UAF_1","type":"use_after_free","type_label":"Use After Free","severity":"critical","difficulty":"medium","description":"In jolt_space_3d.cpp lines 82-84 and 91-93, TryGetBody() can return nullptr, but the code dereferences it without null-checking. The jolt_body pointer is used directly in a reinterpret_cast and then object->pre_step(p_step) is called without validation that object is non-null.","fix":"Add ERR_CONTINUE checks after TryGetBody calls to ensure jolt_body is not nullptr before dereferencing","locations":[{"ref":"modules/jolt_physics/spaces/jolt_space_3d.cpp:82-84","code":"   82 | \t\tJPH::Body *jolt_body = lock_iface.TryGetBody(active_rigid_bodies[i]);\n   83 | \t\tJoltObject3D *object = reinterpret_cast<JoltObject3D *>(jolt_body->GetUserData());\n   84 | \t\tobject->pre_step(p_step);","lines":3,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/jolt_physics/spaces/jolt_space_3d.cpp#L82-L84"},{"ref":"modules/jolt_physics/spaces/jolt_space_3d.cpp:91-93","code":"   91 | \t\tJPH::Body *jolt_body = lock_iface.TryGetBody(active_soft_bodies[i]);\n   92 | \t\tJoltObject3D *object = reinterpret_cast<JoltObject3D *>(jolt_body->GetUserData());\n   93 | \t\tobject->pre_step(p_step);","lines":3,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/jolt_physics/spaces/jolt_space_3d.cpp#L91-L93"}]},
{"id":"UAF_2","type":"use_after_free","type_label":"Use After Free","severity":"critical","difficulty":"medium","description":"Pointer-based hash map key becomes invalid due to array data movement. The code creates a hash map with const int* keys pointing into an array (line 57-62), then uses memcpy to copy array data (line 73), which invalidates the stored pointers. Subsequent hash map operations on lines 68 and 76 use these dangling pointers, causing use-after-free and memory corruption.","fix":"Replace the pointer-based key with a value-based approach. Instead of AHashMap<const int*, ...>, use a container that stores the triangle values directly or converts pointers to values before using them as keys. Alternatively, rearrange the code to avoid modifying array contents after storing pointers to them in the hash map.","locations":[{"ref":"scene/resources/surface_tool.cpp:48-81","code":"   48 | void SurfaceTool::strip_mesh_arrays(PackedVector3Array &r_vertices, PackedInt32Array &r_indices) {\n   49 | \tERR_FAIL_COND_MSG(!generate_remap_func || !remap_vertex_func || !remap_index_func, \"Meshoptimizer library is not initialized.\");\n   50 | \n   51 | \tVector<uint32_t> remap;\n   52 | \tremap.resize(r_vertices.size());\n   53 | \tuint32_t new_vertex_count = generate_remap_func(remap.ptrw(), (unsigned int *)r_indices.ptr(), r_indices.size(), r_vertices.ptr(), r_vertices.size(), sizeof(Vector3));\n   54 | \tremap_vertex_func(r_vertices.ptrw(), r_vertices.ptr(), r_vertices.size(), sizeof(Vector3), remap.ptr());\n   55 | \tr_vertices.resize(new_vertex_count);\n   56 | \tremap_index_func((unsigned int *)r_indices.ptrw(), (unsigned int *)r_indices.ptr(), r_indices.size(), remap.ptr());\n   57 | \n   58 | \tAHashMap<const int *, bool, TriangleHasher, TriangleHasher> found_triangles;\n   59 | \tint *idx_ptr = r_indices.ptrw();\n   60 | \n   61 | \tint filtered_indices_count = 0;\n   62 | \tfor (int i = 0; i < r_indices.size() / 3; i++) {\n   63 | \t\tconst int *tri = idx_ptr + (i * 3);\n   64 | \n   65 | \t\tif (tri[0] == tri[1] || tri[1] == tri[2] || tri[2] == tri[0]) {\n   66 | \t\t\tcontinue;\n   67 | \t\t}\n   68 | \n   69 | \t\tif (found_triangles.has(tri)) {\n   70 | \t\t\tcontinue;\n   71 | \t\t}\n   72 | \n   73 | \t\tif (i != filtered_indices_count) {\n   74 | \t\t\tmemcpy(idx_ptr + (filtered_indices_count * 3), tri, sizeof(int) * 3);\n   75 | \t\t}\n   76 | \n   77 | \t\tfound_triangles.insert_new(tri, true);\n   78 | \t\tfiltered_indices_count++;\n   79 | \t}\n   80 | \tr_indices.resize(filtered_indices_count * 3);\n   81 | }","lines":34,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/resources/surface_tool.cpp#L48-L81"}]},
{"id":"UAF_3","type":"use_after_free","type_label":"Use After Free","severity":"medium","difficulty":"very_easy","description":"At line 422, if caller_pool_thread is non-null (indicating a pool thread), the code accesses caller_pool_thread->current_task->self without first checking if current_task is null. While unlikely in normal operation, a pool thread could call wait_for_task_completion before being assigned any task, leading to a null pointer dereference.","fix":"Change line 422 condition to: if (caller_pool_thread && caller_pool_thread->current_task && p_task_id <= caller_pool_thread->current_task->self)","locations":[{"ref":"core/object/worker_thread_pool.cpp:421-422","code":"  421 | \tThreadData *caller_pool_thread = thread_ids.has(Thread::get_caller_id()) ? &threads[thread_ids[Thread::get_caller_id()]] : nullptr;\n  422 | \tif (caller_pool_thread && p_task_id <= caller_pool_thread->current_task->self) {","lines":2,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/core/object/worker_thread_pool.cpp#L421-L422"}]},
{"id":"UAF_4","type":"use_after_free","type_label":"Use After Free","severity":"medium","difficulty":"medium","description":"API misuse: Calling method on wrong object type in undo/redo. At lines 5890-5891, when mesh_instance is valid and we want to call set_surface_override_material, the code incorrectly calls it on geometry_instance instead of mesh_instance. This is a copy-paste error where the variable name wasn't updated. The undo_redo calls should use mesh_instance, not geometry_instance.","fix":"Replace 'geometry_instance' with 'mesh_instance' on lines 5890-5891 so the method calls are on the correct object.","locations":[{"ref":"editor/scene/3d/node_3d_editor_viewport.cpp:5894-5895","code":" 5894 | \t\t\tundo_redo->add_do_method(geometry_instance, \"set_surface_override_material\", spatial_editor->get_preview_material_surface(), spatial_editor->get_preview_material());\n 5895 | \t\t\tundo_redo->add_undo_method(geometry_instance, \"set_surface_override_material\", spatial_editor->get_preview_material_surface(), spatial_editor->get_preview_reset_material());","lines":2,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/scene/3d/node_3d_editor_viewport.cpp#L5894-L5895"}]},
{"id":"UAF_5","type":"use_after_free","type_label":"Use After Free","severity":"medium","difficulty":"very_easy","description":"In _wl_registry_on_global_remove, when handling xdg_toplevel_icon_manager_name removal (lines 1014-1020), xdg_icon and icon_buffer are destroyed but not set to nullptr, unlike the proper cleanup at lines 710 and 715. This could lead to use-after-free if these pointers are accessed after destruction without checking for nullability.","fix":"Add null assignments after destroy calls: after line 1015 add 'registry->wayland_thread->xdg_icon = nullptr;' and after line 1019 add 'registry->wayland_thread->icon_buffer = nullptr;'","locations":[{"ref":"platform/linuxbsd/wayland/wayland_thread.cpp:1013-1019","code":" 1013 | \t\tif (registry->wayland_thread->xdg_icon) {\n 1014 | \t\t\txdg_toplevel_icon_v1_destroy(registry->wayland_thread->xdg_icon);\n 1015 | \t\t}\n 1016 | \n 1017 | \t\tif (registry->wayland_thread->icon_buffer) {\n 1018 | \t\t\twl_buffer_destroy(registry->wayland_thread->icon_buffer);\n 1019 | \t\t}","lines":7,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/linuxbsd/wayland/wayland_thread.cpp#L1013-L1019"}]},
{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"very_easy","description":"In parse_igd method, the xml pointer allocated from load_description() is not freed on early returns. At line 128-130, if status_code != 200, the function returns without freeing xml. Additionally at lines 133-135, if !xml or size < 1, the function returns without freeing. Though one path may have xml as null, the status_code != 200 path definitely leaks memory.","fix":"Add free(xml); before each return statement that exits before line 142, or restructure to use a single cleanup path at the end","locations":[{"ref":"modules/upnp/upnp_miniupnp.cpp:128-143","code":"  128 | \tif (status_code != 200) {\n  129 | \t\tdev->set_igd_status(UPNPDevice::IGD_STATUS_HTTP_ERROR);\n  130 | \t\treturn;\n  131 | \t}\n  132 | \n  133 | \tif (!xml || size < 1) {\n  134 | \t\tdev->set_igd_status(UPNPDevice::IGD_STATUS_HTTP_EMPTY);\n  135 | \t\treturn;\n  136 | \t}\n  137 | \n  138 | \tstruct UPNPUrls urls = {};\n  139 | \tstruct IGDdatas data;\n  140 | \n  141 | \tparserootdesc(xml, size, &data);\n  142 | \tfree(xml);\n  143 | \txml = nullptr;","lines":16,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/upnp/upnp_miniupnp.cpp#L128-L143"}]},
{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"very_easy","description":"JNI local reference leak in FileAccessFilesystemJAndroid::setup(). The local reference 'c' obtained from GetObjectClass is converted to a global reference but the local reference is never deleted. This can cause local reference frame overflow in long-running applications.","fix":"Add 'env->DeleteLocalRef(c);' after line 352 to properly release the local reference. The corrected code should be: 'jclass c = env->GetObjectClass(file_access_handler); cls = (jclass)env->NewGlobalRef(c); env->DeleteLocalRef(c);'","locations":[{"ref":"platform/android/file_access_filesystem_jandroid.cpp:351-352","code":"  351 | \tjclass c = env->GetObjectClass(file_access_handler);\n  352 | \tcls = (jclass)env->NewGlobalRef(c);","lines":2,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/android/file_access_filesystem_jandroid.cpp#L351-L352"}]},
{"id":"MEM_3","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"very_easy","description":"JNI local reference leak in Java_org_godotengine_godot_GodotLib_setup(). The jstring local references obtained from GetObjectArrayElement in the loop (line 208) are never explicitly deleted. Only ReleaseStringUTFChars is called, which does not delete the local reference. This accumulates local references on the JNI stack.","fix":"Add 'env->DeleteLocalRef(string);' after line 212 inside the loop to delete each jstring local reference. The corrected code should include: 'for (int i = 0; i < cmdlen; i++) { jstring string = (jstring)env->GetObjectArrayElement(p_cmdline, i); const char *rawString = env->GetStringUTFChars(string, nullptr); cmdline[i] = rawString; j_cmdline[i] = string; env->DeleteLocalRef(string); }'","locations":[{"ref":"platform/android/java_godot_lib_jni.cpp:208-214","code":"  208 | \t\t\tfor (int i = 0; i < cmdlen; i++) {\n  209 | \t\t\t\tjstring string = (jstring)env->GetObjectArrayElement(p_cmdline, i);\n  210 | \t\t\t\tconst char *rawString = env->GetStringUTFChars(string, nullptr);\n  211 | \n  212 | \t\t\t\tcmdline[i] = rawString;\n  213 | \t\t\t\tj_cmdline[i] = string;\n  214 | \t\t\t}","lines":7,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/android/java_godot_lib_jni.cpp#L208-L214"}]},
{"id":"MEM_4","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"medium","description":"In _clipboard_get_impl at line 836, code reads 'unsigned long initial_size = *(unsigned long *)data;' without validating that len >= sizeof(unsigned long). X11 property data comes from external sources and can be truncated. This enables OOB read, and the unchecked initial_size is then used for incr_data.resize(), allowing unbounded allocation attacks from malicious X servers.","fix":"Before line 836, add validation: 'if (len < sizeof(unsigned long)) { done = true; break; }' and add upper bound check on initial_size before resize.","locations":[{"ref":"platform/linuxbsd/x11/display_server_x11.cpp:836","code":"  836 | \t\t\t\t\t\t\t\tunsigned long initial_size = *(unsigned long *)data;","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/linuxbsd/x11/display_server_x11.cpp#L836"}]},

{"id":"MEM_8","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"very_easy","description":"IShellItem interface pointer 'shellitem' is allocated via SHCreateItemFromParsingName() at line 720 but is never released. COM objects obtained with QueryInterface/CreateInstance must be released with Release() to avoid memory leaks. The shellitem is used with pfd->SetDefaultFolder() and pfd->SetFolder() but never Release()'d.","fix":"Add 'if (shellitem) { shellitem->Release(); }' after SetFolder() call at line 723, before or after the pfd->Show() call.","locations":[{"ref":"platform/windows/display_server_windows.cpp:746-751","code":"  746 | \t\tIShellItem *shellitem = nullptr;\n  747 | \t\thr = SHCreateItemFromParsingName((LPCWSTR)dir.utf16().ptr(), nullptr, IID_IShellItem, (void **)&shellitem);\n  748 | \t\tif (SUCCEEDED(hr)) {\n  749 | \t\t\tpfd->SetDefaultFolder(shellitem);\n  750 | \t\t\tpfd->SetFolder(shellitem);\n  751 | \t\t}","lines":6,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/windows/display_server_windows.cpp#L746-L751"}]},
