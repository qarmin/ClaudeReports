{"id":"LOGIC_55","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"Impossible condition: 'fd->mode < 0 && fd->mode >= DisplayServerEnums::FILE_DIALOG_MODE_SAVE_MAX' can never be true since an integer cannot be both negative AND >= positive constant. Should be OR not AND.","fix":"Change '&&' to '||': if (fd->mode < 0 || fd->mode >= DisplayServerEnums::FILE_DIALOG_MODE_SAVE_MAX)","locations":[{"ref":"platform/windows/display_server_windows.cpp:606-609","code":"  606 | \tif (fd->mode < 0 && fd->mode >= DisplayServerEnums::FILE_DIALOG_MODE_SAVE_MAX) {\n  607 | \t\tfd->finished.set();\n  608 | \t\treturn;\n  609 | \t}","lines":4,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/windows/display_server_windows.cpp#L606-L609"}]},
{"id":"LOGIC_56","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"Impossible condition: Validates both 'fd->mode < 0' AND 'fd->mode >= FILE_DIALOG_MODE_SAVE_MAX' simultaneously. This condition can never be true (a value cannot be negative AND exceed an upper bound at the same time). The intent is likely to check if mode is OUT OF BOUNDS, which requires OR logic instead of AND.","fix":"Change && to || to properly check for invalid range: if (fd->mode < 0 || fd->mode >= DisplayServerEnums::FILE_DIALOG_MODE_SAVE_MAX)","locations":[{"ref":"platform/windows/display_server_windows.cpp:606","code":"  606 | \tif (fd->mode < 0 && fd->mode >= DisplayServerEnums::FILE_DIALOG_MODE_SAVE_MAX) {","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/windows/display_server_windows.cpp#L606"}]},
{"id":"LOGIC_57","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"GLManagerNative_Windows::window_make_current() at line 488 uses operator[] on RBMap which implicitly inserts a default-initialized entry if the key doesn't exist. The comment says \"crash if our data structures are out of sync, i.e. not found\" but it won't crash - it will silently create an invalid window entry. This masks programming errors and creates undefined behavior.","fix":"Use RBMap::find() or has() to check if the window exists before accessing it. If not found, use ERR_FAIL with appropriate message instead of silently creating an invalid entry.","locations":[{"ref":"platform/windows/gl_manager_windows_native.cpp:476-495","code":"  476 | void GLManagerNative_Windows::window_make_current(DisplayServerEnums::WindowID p_window_id) {\n  477 | \tif (p_window_id == -1) {\n  478 | \t\treturn;\n  479 | \t}\n  480 | \n  481 | \t// crash if our data structures are out of sync, i.e. not found\n  482 | \tGLWindow &win = _windows[p_window_id];\n  483 | \n  484 | \t// noop\n  485 | \tif (&win == _current_window) {\n  486 | \t\treturn;\n  487 | \t}\n  488 | \n  489 | \tconst GLDisplay &disp = get_display(win.gldisplay_id);\n  490 | \tif (!gd_wglMakeCurrent(win.hDC, disp.hRC)) {\n  491 | \t\tERR_PRINT(\"Could not switch OpenGL context to other window: \" + format_error_message(GetLastError()));\n  492 | \t}\n  493 | \n  494 | \t_current_window = &win;\n  495 | }","lines":20,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/windows/gl_manager_windows_native.cpp#L476-L495"}]},
{"id":"LOGIC_58","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In the FallbackTextAnalysisSource class at line 1755, the QueryInterface() implementation checks for IID_IMMNotificationClient but the class inherits from IDWriteTextAnalysisSource, not IMMNotificationClient. This appears to be copy-paste error from another COM class implementation.","fix":"The IID_IMMNotificationClient check should be __uuidof(IDWriteTextAnalysisSource): 'else if (__uuidof(IDWriteTextAnalysisSource) == riid) { AddRef(); *ppvInterface = (IDWriteTextAnalysisSource *)this; }'","locations":[{"ref":"platform/windows/os_windows.cpp:1753","code":" 1753 | \t\t} else if (__uuidof(IMMNotificationClient) == riid) {","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/windows/os_windows.cpp#L1753"}]},
{"id":"LOGIC_59","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"The _can_connect() function at lines 1546-1557 has dead code. After checking if p_name exists in states at line 1547 (returns true if found), it checks slice count at lines 1552-1554 but then unconditionally returns false at line 1556. This means for any node name with slash separators (nested paths), the function always returns false, making it impossible to create transitions to/from nested states. The intended logic likely should return true for nodes with slice_count >= 2.","fix":"Change the final return statement from 'return false;' to 'return true;' or implement the proper logic for nested state validation. The current code makes add_transition() fail for any non-existent states with nested paths, which is likely a regression.","locations":[{"ref":"scene/animation/animation_node_state_machine.cpp:1546-1557","code":" 1546 | bool AnimationNodeStateMachine::_can_connect(const StringName &p_name) {\n 1547 | \tif (states.has(p_name)) {\n 1548 | \t\treturn true;\n 1549 | \t}\n 1550 | \n 1551 | \tString node_name = p_name;\n 1552 | \tif (node_name.get_slice_count(\"/\") < 2) {\n 1553 | \t\treturn false;\n 1554 | \t}\n 1555 | \n 1556 | \treturn false;\n 1557 | }","lines":12,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/animation/animation_node_state_machine.cpp#L1546-L1557"}]},
{"id":"LOGIC_60","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In _lines_edited_from(), line 4079 incorrectly uses lines_edited_from instead of lines_edited_to when calculating the maximum. This causes lines_edited_to to track the minimum edited line range instead of the maximum, corrupting the line editing tracking logic used for breakpoint updates.","fix":"Change 'MAX(lines_edited_from, MAX(p_from_line, p_to_line))' to 'MAX(lines_edited_to, MAX(p_from_line, p_to_line))'","locations":[{"ref":"scene/gui/code_edit.cpp:4197","code":" 4197 | \tlines_edited_to = (lines_edited_to == -1) ? MAX(p_from_line, p_to_line) : MAX(lines_edited_from, MAX(p_from_line, p_to_line));","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/gui/code_edit.cpp#L4197"}]},
{"id":"LOGIC_61","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In set_offsets_preset() at line 1280, the variable 'x' is initialized to 'parent_rect.size.x' (the width) instead of a position offset. This causes incorrect offset calculations for all preset modes. In RTL mode (line 1282), this produces 'x = parent_rect.size.x - parent_rect.size.x - new_size.x = -new_size.x', which is incorrect. The variable should be initialized to 0 (representing the anchor/offset origin position).","fix":"Change line 1280 from 'real_t x = parent_rect.size.x;' to 'real_t x = 0;' to represent the position offset from the origin.","locations":[{"ref":"scene/gui/control.cpp:1334-1336","code":" 1334 | \treal_t x = parent_rect.size.x;\n 1335 | \tif (is_layout_rtl()) {\n 1336 | \t\tx = parent_rect.size.x - x - new_size.x;","lines":3,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/gui/control.cpp#L1334-L1336"}]},
{"id":"LOGIC_62","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"Array out-of-bounds access in gui_input at mouse double-click handler. At line 548, the loop 'for (int i = 0; i < words.size(); i = i + 2)' accesses words[i+1] without checking bounds. If words array has odd size, this causes out-of-bounds access when i == words.size()-1.","fix":"Add condition: 'for (int i = 0; i + 1 < words.size(); i = i + 2)' or 'for (int i = 0; i < words.size() - 1; i = i + 2)' to ensure i+1 is always valid.","locations":[{"ref":"scene/gui/line_edit.cpp:547-559","code":"  547 | \t\t\t\t\t\tfor (int i = 0; i < words.size(); i = i + 2) {\n  548 | \t\t\t\t\t\t\tif (words[i] <= caret_column && words[i + 1] >= caret_column) {\n  549 | \t\t\t\t\t\t\t\tselection.enabled = true;\n  550 | \t\t\t\t\t\t\t\tselection.begin = words[i];\n  551 | \t\t\t\t\t\t\t\tselection.end = words[i + 1];\n  552 | \t\t\t\t\t\t\t\tselection.double_click = true;\n  553 | \t\t\t\t\t\t\t\tselection.creating = true;\n  554 | \t\t\t\t\t\t\t\tselection.start_column = caret_column;\n  555 | \t\t\t\t\t\t\t\tset_caret_column(selection.end);\n  556 | \t\t\t\t\t\t\t\tqueue_accessibility_update();\n  557 | \t\t\t\t\t\t\t\tbreak;\n  558 | \t\t\t\t\t\t\t}\n  559 | \t\t\t\t\t\t}","lines":13,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/gui/line_edit.cpp#L547-L559"}]},
{"id":"LOGIC_63","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In ScrollContainer drag deceleration (NOTIFICATION_INTERNAL_PROCESS), when deceleration reduces val_x or val_y to negative values, these negative values are used directly in line 619 to compute the new drag_speed. This causes reversed scroll direction instead of stopping. For example, if drag_speed.x=4 pixels/frame, after deceleration val_x becomes -12, resulting in drag_speed.x = -12, making content scroll backwards. Should clamp to 0.","fix":"Clamp val_x and val_y to 0 before using them at line 619. Change lines 605 and 613 to: 'val_x = MAX(0, val_x - 1000 * get_process_delta_time());' and similarly for val_y.","locations":[{"ref":"scene/gui/scroll_container.cpp:696-712","code":"  696 | \t\t\t\t\tfloat sgn_x = drag_speed.x < 0 ? -1 : 1;\n  697 | \t\t\t\t\tfloat val_x = Math::abs(drag_speed.x);\n  698 | \t\t\t\t\tval_x -= 1000 * get_process_delta_time();\n  699 | \n  700 | \t\t\t\t\tif (val_x < 0) {\n  701 | \t\t\t\t\t\tturnoff_h = true;\n  702 | \t\t\t\t\t}\n  703 | \n  704 | \t\t\t\t\tfloat sgn_y = drag_speed.y < 0 ? -1 : 1;\n  705 | \t\t\t\t\tfloat val_y = Math::abs(drag_speed.y);\n  706 | \t\t\t\t\tval_y -= 1000 * get_process_delta_time();\n  707 | \n  708 | \t\t\t\t\tif (val_y < 0) {\n  709 | \t\t\t\t\t\tturnoff_v = true;\n  710 | \t\t\t\t\t}\n  711 | \n  712 | \t\t\t\t\tdrag_speed = Vector2(sgn_x * val_x, sgn_y * val_y);","lines":17,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/gui/scroll_container.cpp#L696-L712"}]},
{"id":"LOGIC_64","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"Inverted condition at line 3372 in _update_placeholder(). Code checks if (placeholder_bidi_override.is_empty()) and then calls set_bidi_override with the empty array. Should be if (!placeholder_bidi_override.is_empty()) to only set when data exists. As written, bidi override is only set when it's empty, which is backwards.","fix":"Change condition from 'if (placeholder_bidi_override.is_empty())' to 'if (!placeholder_bidi_override.is_empty())'","locations":[{"ref":"scene/gui/text_edit.cpp:3849-3852","code":" 3849 | \tplaceholder_bidi_override = structured_text_parser(st_parser, st_args, placeholder_translated);\n 3850 | \tif (placeholder_bidi_override.is_empty()) {\n 3851 | \t\tTS->shaped_text_set_bidi_override(placeholder_data_buf->get_rid(), placeholder_bidi_override);\n 3852 | \t}","lines":4,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/gui/text_edit.cpp#L3849-L3852"}]},
{"id":"LOGIC_65","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In get_parent_rect(), line 3098 checks if x < s.size.x but should check if x < s.position.x + s.size.x to determine if x is within the screen bounds. The check is comparing window position against screen size directly without accounting for screen position offset.","fix":"Change condition from 'x >= s.position.x && x < s.size.x' to 'x >= s.position.x && x < s.position.x + s.size.x'","locations":[{"ref":"scene/main/window.cpp:3116","code":" 3116 | \t\t\tif (x >= s.position.x && x < s.size.x) {","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/main/window.cpp#L3116"}]},
{"id":"LOGIC_66","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"track_move_down has incorrect bounds checking. The condition `(uint32_t)p_track < tracks.size()` at line 3894 allows p_track=0, which then attempts to swap with tracks[p_track - 1] = tracks[-1], causing an out-of-bounds array access when p_track is 0. The check should ensure p_track > 0.","fix":"Change line 3894 from `if ((uint32_t)p_track < tracks.size())` to `if ((uint32_t)p_track > 0 && (uint32_t)p_track < tracks.size())` or simply `if (p_track > 0)`. This prevents attempting to access index -1 when p_track=0.","locations":[{"ref":"scene/resources/animation.cpp:3893-3899","code":" 3893 | void Animation::track_move_down(int p_track) {\n 3894 | \tif ((uint32_t)p_track < tracks.size()) {\n 3895 | \t\tSWAP(tracks[p_track], tracks[p_track - 1]);\n 3896 | \t}\n 3897 | \n 3898 | \temit_changed();\n 3899 | }","lines":7,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/resources/animation.cpp#L3893-L3899"}]},
{"id":"LOGIC_67","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"Divide-by-zero error in GradientTexture1D::_update() when width is 1. The validation in set_width() allows width >= 1, but the update code divides by (width-1) without checking for width==1.","fix":"Add a check before the loop: if (width < 2) return; or use MAX(width - 1, 1) instead of (width - 1) in the denominator.","locations":[{"ref":"scene/resources/gradient_texture.cpp:104","code":"  104 | \t\t\tfloat ofs = float(i) / (width - 1);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/resources/gradient_texture.cpp#L104"},{"ref":"scene/resources/gradient_texture.cpp:123","code":"  123 | \t\t\t\tfloat ofs = float(i) / (width - 1);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/resources/gradient_texture.cpp#L123"}]},
{"id":"LOGIC_68","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"Missing emit_changed() call in set_instance_transform (3D). The 2D variant (set_instance_transform_2d at line 268) calls emit_changed() to notify observers of changes, but the 3D variant (set_instance_transform at line 261) does not. This inconsistency means 3D transform changes won't trigger property updates, potentially causing UI/editor synchronization issues.","fix":"Add 'emit_changed();' call after line 261 in set_instance_transform, matching the behavior of set_instance_transform_2d.","locations":[{"ref":"scene/resources/multimesh.cpp:258-262","code":"  258 | void MultiMesh::set_instance_transform(int p_instance, const Transform3D &p_transform) {\n  259 | \tERR_FAIL_INDEX_MSG(p_instance, instance_count, \"Instance index out of bounds. Instance index must be less than `instance_count` and greater than or equal to zero.\");\n  260 | \tERR_FAIL_COND_MSG(transform_format == TRANSFORM_2D, \"Can't set Transform3D on a Multimesh configured to use Transform2D. Ensure that you have set the `transform_format` to `TRANSFORM_3D`.\");\n  261 | \tRenderingServer::get_singleton()->multimesh_instance_set_transform(multimesh, p_instance, p_transform);\n  262 | }","lines":5,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/resources/multimesh.cpp#L258-L262"}]},
{"id":"LOGIC_69","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"Incorrect arithmetic in AudioFilterSW::prepare_coefficients() at lines 183-184. The division operations use '0.0 - a0' instead of '-a0'. While mathematically equivalent (0.0 - a0 = -a0), this pattern is unusual and suggests a copy-paste error or typo. The expression '/= 0.0 - a0' is equivalent to '/= -a0', but writing it this way is confusing and potentially indicates an unintended operation. This affects filter coefficient calculations and could lead to incorrect audio filtering.","fix":"Change 'p_coeffs->a1 /= 0.0 - a0;' to 'p_coeffs->a1 /= -a0;' and 'p_coeffs->a2 /= 0.0 - a0;' to 'p_coeffs->a2 /= -a0;'","locations":[{"ref":"servers/audio/audio_filter_sw.cpp:183-184","code":"  183 | \tp_coeffs->a1 /= 0.0 - a0;\n  184 | \tp_coeffs->a2 /= 0.0 - a0;","lines":2,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/servers/audio/audio_filter_sw.cpp#L183-L184"}]},
{"id":"LOGIC_70","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"Incorrect validation check in voxel_gi_get_distance_field - checks data_buffer.is_valid() but uses sdf_texture. If data_buffer is valid but sdf_texture is null, the function will attempt to call texture_get_data on a null/invalid texture, resulting in undefined behavior or crash.","fix":"Change line 231 from 'if (voxel_gi->data_buffer.is_valid())' to 'if (voxel_gi->sdf_texture.is_valid())' to properly validate the texture before accessing it.","locations":[{"ref":"servers/rendering/renderer_rd/environment/gi.cpp:231-232","code":"  231 | \tif (voxel_gi->data_buffer.is_valid()) {\n  232 | \t\treturn RD::get_singleton()->texture_get_data(voxel_gi->sdf_texture, 0);","lines":2,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/servers/rendering/renderer_rd/environment/gi.cpp#L231-L232"}]},
{"id":"LOGIC_71","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"Incorrect logical operator in roughness hint check: uses OR instead of AND. Line 996 checks `hint >= HINT_ROUGHNESS_R || hint <= HINT_ROUGHNESS_GRAY`, which will always be true for any hint value (since any value is either >= some value OR <= some value). Should use AND (&&) to check if hint is within the range [HINT_ROUGHNESS_R, HINT_ROUGHNESS_GRAY].","fix":"Change `||` to `&&` in the condition: `(p_texture_uniforms[i].hint >= ShaderLanguage::ShaderNode::Uniform::HINT_ROUGHNESS_R && p_texture_uniforms[i].hint <= ShaderLanguage::ShaderNode::Uniform::HINT_ROUGHNESS_GRAY)`","locations":[{"ref":"servers/rendering/renderer_rd/storage_rd/material_storage.cpp:1014","code":" 1014 | \t\t\t\t\tif (tex->detect_roughness_callback && (p_texture_uniforms[i].hint >= ShaderLanguage::ShaderNode::Uniform::HINT_ROUGHNESS_R || p_texture_uniforms[i].hint <= ShaderLanguage::ShaderNode::Uniform::HINT_ROUGHNESS_GRAY)) {","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/servers/rendering/renderer_rd/storage_rd/material_storage.cpp#L1014"}]},
{"id":"LOGIC_72","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In create_texture_view(), the function calls update_sizes(named_texture) but should call update_sizes(view_texture). The view_texture was just created on line 381 and needs its 'sizes' array initialized. Currently, the original named_texture's sizes get updated instead, leaving the newly-created view_texture with uninitialized sizes. This will cause get_texture_slice_size() to return garbage values when called on the view texture.","fix":"Change 'update_sizes(named_texture)' to 'update_sizes(view_texture)' on line 386 to initialize the correct texture's sizes array.","locations":[{"ref":"servers/rendering/renderer_rd/storage_rd/render_scene_buffers_rd.cpp:386","code":"  386 | \tupdate_sizes(named_texture);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/servers/rendering/renderer_rd/storage_rd/render_scene_buffers_rd.cpp#L386"}]},
{"id":"LOGIC_73","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"Off-by-one logic error in draw_list_bind_uniform_set, identical to the compute_list version. Condition at line 5783 uses '>' instead of '>=', causing the same set_count tracking issue.","fix":"Change line 5783 from 'if (p_index > draw_list.state.set_count)' to 'if (p_index >= draw_list.state.set_count)' and line 5784 from 'draw_list.state.set_count = p_index;' to 'draw_list.state.set_count = p_index + 1;'","locations":[{"ref":"servers/rendering/rendering_device.cpp:5918-5920","code":" 5918 | \tif (p_index > draw_list.state.set_count) {\n 5919 | \t\tdraw_list.state.set_count = p_index;\n 5920 | \t}","lines":3,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/servers/rendering/rendering_device.cpp#L5918-L5920"}]},
{"id":"LOGIC_74","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"Off-by-one logic error in compute_list_bind_uniform_set. The condition at line 6752 uses '>' instead of '>=', and line 6753 sets set_count=p_index instead of p_index+1. This causes the first bound uniform set at index 0 to not be counted in set_count, potentially skipping its execution in the dispatch loop which checks 'i < set_count'.","fix":"Change line 6752 from 'if (p_index > compute_list.state.set_count)' to 'if (p_index >= compute_list.state.set_count)' and line 6753 from 'compute_list.state.set_count = p_index;' to 'compute_list.state.set_count = p_index + 1;'","locations":[{"ref":"servers/rendering/rendering_device.cpp:6887-6889","code":" 6887 | \tif (p_index > compute_list.state.set_count) {\n 6888 | \t\tcompute_list.state.set_count = p_index;\n 6889 | \t}","lines":3,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/servers/rendering/rendering_device.cpp#L6887-L6889"}]},
{"id":"LOGIC_75","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In rendering_device_graph.cpp line 532-537, when a slice is inserted into the parent's dirty_shared_list, the texture_slice_or_dirty_rect is not properly initialized before the first merge(). If the dirty_shared_list is empty (parent->dirty_shared_list == nullptr), the condition at line 532 prevents the merge, but line 533 still calls merge() on an uninitialized Rect2i. The else branch at 535 may have the same issue if the prior list was processed.","fix":"Check whether texture_slice_or_dirty_rect is initialized (via an additional flag or by checking Rect2i validity) before calling merge(). Alternatively, ensure the rect is always initialized to a default value before any merge operation.","locations":[{"ref":"servers/rendering/rendering_device_graph.cpp:568","code":"  568 | \t\t\t\t\tif (resource_tracker->parent->dirty_shared_list != nullptr) {","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/servers/rendering/rendering_device_graph.cpp#L568"}]},
{"id":"LOGIC_76","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"Line 2268: Logic error in division validation. Condition 'p_ret_type == TYPE_UINT && p_ret_type <= TYPE_UVEC4' is impossible - p_ret_type cannot be equal to TYPE_UINT AND be less than or equal to TYPE_UVEC4 simultaneously. Should use >= to check if p_ret_type is in the unsigned integer range. This prevents unsigned integer division by zero detection.","fix":"Change 'p_ret_type == TYPE_UINT &&' to 'p_ret_type >= TYPE_UINT &&'","locations":[{"ref":"servers/rendering/shader_language.cpp:2298","code":" 2298 | \t\t\t} else if (p_ret_type == TYPE_UINT && p_ret_type <= TYPE_UVEC4) {","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/servers/rendering/shader_language.cpp#L2298"}]},
{"id":"LOGIC_77","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"MAGIC_POSITION_WRITE check has a critical logic bug: multiple consecutive _get_token() calls in the same if condition each advance the token position independently. The check expects the tokens to be TK_OP_ASSIGN, TK_TYPE_VEC4, TK_PARENTHESIS_OPEN, and TK_COMMA in sequence, but each _get_token() call advances past one token, making the entire pattern check impossible to succeed. For example, after _get_token() returns type TK_OP_ASSIGN, the next _get_token() call will check the token AFTER TK_TYPE_VEC4, not TK_TYPE_VEC4 itself.","fix":"Save each token result in a variable and check in sequence, or use separate _get_token() calls with _set_tkpos() for backtracking.","locations":[{"ref":"servers/rendering/shader_language.cpp:6816-6826","code":" 6816 | \t\t\t\t\t\t\tTkPos prev_pos = _get_tkpos();\n 6817 | \t\t\t\t\t\t\tif (_get_token().type == TK_OP_ASSIGN &&\n 6818 | \t\t\t\t\t\t\t\t\t_get_token().type == TK_TYPE_VEC4 &&\n 6819 | \t\t\t\t\t\t\t\t\t_get_token().type == TK_PARENTHESIS_OPEN &&\n 6820 | \t\t\t\t\t\t\t\t\t_get_token().text == \"VERTEX\" &&\n 6821 | \t\t\t\t\t\t\t\t\t_get_token().type == TK_COMMA) {\n 6822 | \t\t\t\t\t\t\t\t_add_line_warning(ShaderWarning::MAGIC_POSITION_WRITE);\n 6823 | \t\t\t\t\t\t\t}\n 6824 | \n 6825 | \t\t\t\t\t\t\t// Reset the position so compiling can continue as normal.\n 6826 | \t\t\t\t\t\t\t_set_tkpos(prev_pos);","lines":11,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/servers/rendering/shader_language.cpp#L6816-L6826"}]},
{"id":"LOGIC_78","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"PACKED_VECTOR2_ARRAY float path does not advance buffer and len pointers after decoding data. The 64-bit path (lines 1100-1101) correctly updates len and buf, but the 32-bit/float path (ending at line 1125) is missing these updates. This causes the buffer position to not advance correctly, leading to incorrect parsing of subsequent data.","fix":"Add 'len -= adv;' and 'buf += adv;' after line 1124 to match the 64-bit path behavior.","locations":[{"ref":"core/io/marshalls.cpp:1072-1086","code":" 1072 | \t\t\t\tif (count) {\n 1073 | \t\t\t\t\tvarray.resize(count);\n 1074 | \t\t\t\t\tVector2 *w = varray.ptrw();\n 1075 | \n 1076 | \t\t\t\t\tfor (int32_t i = 0; i < count; i++) {\n 1077 | \t\t\t\t\t\tw[i].x = decode_float(buf + i * sizeof(float) * 2 + sizeof(float) * 0);\n 1078 | \t\t\t\t\t\tw[i].y = decode_float(buf + i * sizeof(float) * 2 + sizeof(float) * 1);\n 1079 | \t\t\t\t\t}\n 1080 | \n 1081 | \t\t\t\t\tint adv = sizeof(float) * 2 * count;\n 1082 | \n 1083 | \t\t\t\t\tif (r_len) {\n 1084 | \t\t\t\t\t\t(*r_len) += adv;\n 1085 | \t\t\t\t\t}\n 1086 | \t\t\t\t}","lines":15,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/core/io/marshalls.cpp#L1072-L1086"}]},
{"id":"LOGIC_79","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"Incorrect substr length parameter in String::split() when maxsplit limit is hit. At line 1042, substr(from, len) should be substr(from, len - from) because 'len' is the full string length, not the remaining length from position 'from'.","fix":"Change 'ret.push_back(substr(from, len));' to 'ret.push_back(substr(from, len - from));'","locations":[{"ref":"core/string/ustring.cpp:1046","code":" 1046 | \t\t\t\t\tret.push_back(substr(from, len));","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/core/string/ustring.cpp#L1046"}]},
{"id":"LOGIC_80","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"At line 2119, get_slice(\"::\", 2) is used to extract the script path from a dependency string, but this returns an empty string when the format is \"path::type\" (which has only 2 parts: indices 0 and 1). This should be get_slice(\"::\", 0) to get the path component, as used in line 1000. The current code silently fails to look up the icon path.","fix":"Change `script_dep.get_slice(\"::\", 2)` to `script_dep.get_slice(\"::\", 0)` to correctly extract the path component before the first \"::\" separator.","locations":[{"ref":"editor/file_system/editor_file_system.cpp:2105","code":" 2105 | \t\tconst String &script_path = script_dep.contains(\"::\") ? script_dep.get_slice(\"::\", 2) : script_dep;","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/file_system/editor_file_system.cpp#L2105"}]},
{"id":"LOGIC_81","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"Missing insertion of lightmap cache entry when new_md5 is greater than all existing entries. The loop at line 539-549 only inserts if new_md5 < existing_md5 or breaks on equality, but if the loop completes without inserting (when new_md5 is largest), the entry is never added to r_lightmap_caches.","fix":"After the loop, check if the entry was inserted; if not, push it to the end of r_lightmap_caches.","locations":[{"ref":"editor/import/3d/resource_importer_obj.cpp:548-558","code":"  548 | \t\t\t\tfor (int i = 0; i < r_lightmap_caches.size(); i++) {\n  549 | \t\t\t\t\tconst String md5 = String::md5(r_lightmap_caches[i].ptr());\n  550 | \t\t\t\t\tif (new_md5 < md5) {\n  551 | \t\t\t\t\t\tr_lightmap_caches.insert(i, lightmap_cache);\n  552 | \t\t\t\t\t\tbreak;\n  553 | \t\t\t\t\t}\n  554 | \n  555 | \t\t\t\t\tif (new_md5 == md5) {\n  556 | \t\t\t\t\t\tbreak;\n  557 | \t\t\t\t\t}\n  558 | \t\t\t\t}","lines":11,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/import/3d/resource_importer_obj.cpp#L548-L558"}]},
{"id":"LOGIC_82","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In ResourceImporterScene::_get_skinned_pose_transforms() at lines 2680-2688, when bone_idx is -1 (indicating bone not found), the code falls through to line 2687 and uses the loop counter 'i' instead of bone_idx to access skeleton->get_bone_global_pose(). This silently reads the wrong bone's transform, potentially corrupting imported mesh bind poses.","fix":"Add 'continue;' or ERR_CONTINUE when bone_idx == -1 to skip invalid bones instead of silently using the wrong bone index.","locations":[{"ref":"editor/import/3d/resource_importer_scene.cpp:2734-2742","code":" 2734 | \t\t\t\tint bone_idx = bind_name.is_empty() ? skin->get_bind_bone(i) : skeleton->find_bone(bind_name);\n 2735 | \t\t\t\tERR_FAIL_COND_V(bone_idx >= skeleton->get_bone_count(), Array());\n 2736 | \n 2737 | \t\t\t\tTransform3D bp_global_rest;\n 2738 | \t\t\t\tif (bone_idx >= 0) {\n 2739 | \t\t\t\t\tbp_global_rest = skeleton->get_bone_global_pose(bone_idx);\n 2740 | \t\t\t\t} else {\n 2741 | \t\t\t\t\tbp_global_rest = skeleton->get_bone_global_pose(i);\n 2742 | \t\t\t\t}","lines":9,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/import/3d/resource_importer_scene.cpp#L2734-L2742"}]},
{"id":"LOGIC_83","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In EditorInspectorArray::_move_element() at lines 3071-3073, the undo loop for removing an element uses: for (int i = count; i > p_element_index; i--) which may not correctly undo the shifts performed in the do loop (lines 3067-3069). The loop bounds and what gets undone may be mismatched.","fix":"Verify the undo loop correctly mirrors the do loop. Should likely iterate through the same range: for (int i = count; i > p_element_index + 1; i--) or adjust bounds to ensure proper reversal of all shifts.","locations":[{"ref":"editor/inspector/editor_inspector.cpp:3227","code":" 3227 | \t\t\t\t\tfor (int i = count; i > p_element_index; i--) {","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/inspector/editor_inspector.cpp#L3227"}]},
{"id":"LOGIC_84","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In MultiNodeEdit::_set_impl, line 105 uses the untransformed parameter p_name instead of the transformed variable 'name'. This causes the undo/redo system to store the wrong previous value when property names require transformation (e.g., 'scripts'->'script' or 'Metadata/...' -> 'metadata/...'). The old_value retrieved will be from a different property than the one being set in line 104.","fix":"Change line 105 from 'Variant old_value = n->get(p_name);' to 'Variant old_value = n->get(name);' to use the transformed property name consistently with line 104.","locations":[{"ref":"editor/inspector/multi_node_edit.cpp:105","code":"  105 | \t\t\tVariant old_value = n->get(p_name);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/inspector/multi_node_edit.cpp#L105"}]},
{"id":"LOGIC_85","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In MultiNodeEdit::_property_can_revert, the function returns true if the class has the property and at least one node exists in the scene. However, it should return true only if the property can actually be reverted on at least one of the nodes. The current implementation doesn't call node->property_can_revert(p_name) like the related function _property_get_revert does, meaning it may return true even though no node actually allows reverting that property.","fix":"Change the logic in _property_can_revert to iterate through nodes and check node->property_can_revert(p_name) on each, returning true only if at least one node allows reverting. This makes it consistent with _property_get_revert behavior and correctly reports whether the property is actually revertible.","locations":[{"ref":"editor/inspector/multi_node_edit.cpp:233-252","code":"  233 | bool MultiNodeEdit::_property_can_revert(const StringName &p_name) const {\n  234 | \tNode *es = EditorNode::get_singleton()->get_edited_scene();\n  235 | \tif (!es) {\n  236 | \t\treturn false;\n  237 | \t}\n  238 | \n  239 | \tif (ClassDB::has_property(get_edited_class_name(), p_name)) {\n  240 | \t\tfor (const NodePath &E : nodes) {\n  241 | \t\t\tNode *node = es->get_node_or_null(E);\n  242 | \t\t\tif (node) {\n  243 | \t\t\t\treturn true;\n  244 | \t\t\t}\n  245 | \t\t}\n  246 | \n  247 | \t\treturn false;\n  248 | \t}\n  249 | \n  250 | \t// Don't show the revert button if the edited class doesn't have the property.\n  251 | \treturn false;\n  252 | }","lines":20,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/inspector/multi_node_edit.cpp#L233-L252"}]},
{"id":"LOGIC_86","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"Off-by-one error in get_object_of_execution function at line 1411. The function returns 'line.substr(variable_start, (end - variable_start))' where 'end' is set to 'line.size() - 1' (the index of the last character). The length parameter of substr should be '(end - variable_start + 1)' to include the last character. This causes the returned substring to be one character too short. Test case at line 1004-1010 expects input 'var roman = kieliszek.' to return 'kieliszek.' but the function will return 'kieliszek' (missing the final dot).","fix":"Change line 1411 from 'return line.substr(variable_start, (end - variable_start));' to 'return line.substr(variable_start, (end - variable_start + 1));' to include all characters up to and including the last character of the string.","locations":[{"ref":"editor/project_upgrade/project_converter_3_to_4.cpp:1372-1409","code":" 1372 | \tint end = line.size() - 1; // Last one is \\0\n 1373 | \tint variable_start = end - 1;\n 1374 | \tint start = end - 1;\n 1375 | \n 1376 | \tbool is_possibly_nodepath = false;\n 1377 | \tbool is_valid_nodepath = false;\n 1378 | \n 1379 | \twhile (start >= 0) {\n 1380 | \t\tchar32_t character = line[start];\n 1381 | \t\tbool is_variable_char = (character >= 'A' && character <= 'Z') || (character >= 'a' && character <= 'z') || character == '.' || character == '_';\n 1382 | \t\tbool is_nodepath_start = character == '$';\n 1383 | \t\tbool is_nodepath_sep = character == '/';\n 1384 | \t\tif (is_variable_char || is_nodepath_start || is_nodepath_sep) {\n 1385 | \t\t\tif (start == 0) {\n 1386 | \t\t\t\tbreak;\n 1387 | \t\t\t} else if (is_nodepath_sep) {\n 1388 | \t\t\t\t// Freeze variable_start, try to fetch more chars since this might be a Node path literal.\n 1389 | \t\t\t\tis_possibly_nodepath = true;\n 1390 | \t\t\t} else if (is_nodepath_start) {\n 1391 | \t\t\t\t// Found $, this is a Node path literal.\n 1392 | \t\t\t\tis_valid_nodepath = true;\n 1393 | \t\t\t\tbreak;\n 1394 | \t\t\t}\n 1395 | \t\t\tif (!is_possibly_nodepath) {\n 1396 | \t\t\t\tvariable_start--;\n 1397 | \t\t\t}\n 1398 | \t\t\tstart--;\n 1399 | \t\t\tcontinue;\n 1400 | \t\t} else {\n 1401 | \t\t\t// Abandon all hope, this is neither a variable nor a Node path literal.\n 1402 | \t\t\tvariable_start++; // Found invalid character, needs to be ignored.\n 1403 | \t\t\tbreak;\n 1404 | \t\t}\n 1405 | \t}\n 1406 | \tif (is_valid_nodepath) {\n 1407 | \t\tvariable_start = start;\n 1408 | \t}\n 1409 | \treturn line.substr(variable_start, (end - variable_start));","lines":38,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/project_upgrade/project_converter_3_to_4.cpp#L1372-L1409"}]},
{"id":"LOGIC_87","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"Vector with uninitialized elements passed to geometry function. After resizing polys vector and skipping invalid polygon indices with continue, the vector contains uninitialized Vector2(0,0) values for skipped indices. These are passed to Geometry2D::is_point_in_polygon(), which may give incorrect polygon inclusion results.","fix":"Instead of skipping with continue and leaving uninitialized values, either: (1) collect only valid points into a separate vector, or (2) only resize to actual valid point count, or (3) filter and only pass valid indices to the geometry function.","locations":[{"ref":"editor/scene/2d/polygon_2d_editor_plugin.cpp:736-748","code":"  736 | \t\t\t\t\tfor (int i = polygons.size() - 1; i >= 0; i--) {\n  737 | \t\t\t\t\t\tVector<int> points = polygons[i];\n  738 | \t\t\t\t\t\tVector<Vector2> polys;\n  739 | \t\t\t\t\t\tpolys.resize(points.size());\n  740 | \t\t\t\t\t\tfor (int j = 0; j < polys.size(); j++) {\n  741 | \t\t\t\t\t\t\tint idx = points[j];\n  742 | \t\t\t\t\t\t\tif (idx < 0 || idx >= editing_points.size()) {\n  743 | \t\t\t\t\t\t\t\tcontinue;\n  744 | \t\t\t\t\t\t\t}\n  745 | \t\t\t\t\t\t\tpolys.write[j] = mtx.xform(editing_points[idx]);\n  746 | \t\t\t\t\t\t}\n  747 | \n  748 | \t\t\t\t\t\tif (Geometry2D::is_point_in_polygon(mb->get_position(), polys)) {","lines":13,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/scene/2d/polygon_2d_editor_plugin.cpp#L736-L748"}]},
{"id":"LOGIC_88","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"_set method always returns false even when properties are successfully set. This breaks the property system's ability to recognize that properties were handled, potentially causing warnings or incorrect behavior in the inspector.","fix":"Change line 105 from 'return false;' to 'return true;' so the method returns true when properties are successfully handled, and only returns false when the property name doesn't match any known property (which is already handled at line 102).","locations":[{"ref":"editor/scene/3d/mesh_library_editor_plugin.cpp:105","code":"  105 | \t\treturn false;","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/scene/3d/mesh_library_editor_plugin.cpp#L105"}]},
{"id":"LOGIC_89","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In _vertex_snap_commit(), line 1026 uses += operator to add a delta to vertex_snap_source, which should be a position vector. The loop breaks immediately after processing the first valid node. This appears to be incorrectly accumulating a delta onto a position, when it likely should be setting the position directly or computing a cumulative offset correctly.","fix":"Change line 1026 from 'vertex_snap_source += node->get_global_position() - E.value;' to appropriate logic based on intended behavior. If computing offset of first node, use '=' instead of '+='. If accumulating offsets across multiple nodes, remove the break statement.","locations":[{"ref":"editor/scene/3d/node_3d_editor_viewport.cpp:996-1002","code":"  996 | \tfor (const KeyValue<ObjectID, Vector3> &E : vertex_snap_original_positions) {\n  997 | \t\tNode3D *node = ObjectDB::get_instance<Node3D>(E.key);\n  998 | \t\tif (node) {\n  999 | \t\t\tvertex_snap_source += node->get_global_position() - E.value;\n 1000 | \t\t\tbreak;\n 1001 | \t\t}\n 1002 | \t}","lines":7,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/scene/3d/node_3d_editor_viewport.cpp#L996-L1002"}]},
{"id":"LOGIC_90","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In _item_add_cbk STYLEBOX case (line 3049-3055), sb is initialized as empty Ref<StyleBox>(), then checked with is_stylebox_pinned(sb) at line 3053. An empty/null Ref will never be pinned, so the condition is always false. The stylebox should be retrieved from the default theme before setting, similar to the COLOR and FONT_SIZE cases.","fix":"For STYLEBOX case in _item_add_cbk, either: (1) keep sb empty (matching ICON/FONT behavior) and remove the pinning check, or (2) retrieve default stylebox like COLOR case does.","locations":[{"ref":"editor/scene/gui/theme_editor_plugin.cpp:3050-3058","code":" 3050 | \t\tcase Theme::DATA_TYPE_STYLEBOX: {\n 3051 | \t\t\tRef<StyleBox> sb;\n 3052 | \t\t\tur->add_do_method(*edited_theme, \"set_stylebox\", item_name, edited_type, sb);\n 3053 | \t\t\tur->add_undo_method(*edited_theme, \"clear_stylebox\", item_name, edited_type);\n 3054 | \n 3055 | \t\t\tif (is_stylebox_pinned(sb)) {\n 3056 | \t\t\t\tur->add_undo_method(this, \"_unpin_leading_stylebox\");\n 3057 | \t\t\t}\n 3058 | \t\t} break;","lines":9,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/scene/gui/theme_editor_plugin.cpp#L3050-L3058"},{"ref":"editor/scene/gui/theme_editor_plugin.cpp:3101-3109","code":" 3101 | \t\tcase Theme::DATA_TYPE_STYLEBOX: {\n 3102 | \t\t\tRef<StyleBox> sb;\n 3103 | \t\t\tur->add_do_method(*edited_theme, \"set_stylebox\", p_item_name, edited_type, sb);\n 3104 | \t\t\tur->add_undo_method(*edited_theme, \"clear_stylebox\", p_item_name, edited_type);\n 3105 | \n 3106 | \t\t\tif (is_stylebox_pinned(sb)) {\n 3107 | \t\t\t\tur->add_undo_method(this, \"_unpin_leading_stylebox\");\n 3108 | \t\t\t}\n 3109 | \t\t} break;","lines":9,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/scene/gui/theme_editor_plugin.cpp#L3101-L3109"}]},
{"id":"LOGIC_91","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In _cell_button_pressed() at line 191 and _update_node_tooltip() at line 700, the same operation (breaking a string into word-wrapped lines) uses inconsistent logic: line 191 uses 'all_warnings.substr(start, end - start)' but line 700 uses 'get_editor_description().substr(start, end - start + 1)'. The +1 difference will cause the strings to be cut at different boundaries, and one is likely incorrect based on how string_get_word_breaks() API works.","fix":"Verify the correct behavior with Godot's string_get_word_breaks() documentation. The boundaries array should contain pairs of (start, end). Determine whether 'end' is inclusive or exclusive, then make both usages consistent. Most likely, 'end - start' is correct (treating 'end' as exclusive index, similar to C++ string::substr convention). Remove the +1 from line 700.","locations":[{"ref":"editor/scene/scene_tree_editor.cpp:286-291","code":"  286 | \t\tconst PackedInt32Array boundaries = TS->string_get_word_breaks(all_warnings, \"\", 80);\n  287 | \t\tPackedStringArray lines;\n  288 | \t\tfor (int i = 0; i < boundaries.size(); i += 2) {\n  289 | \t\t\tconst int start = boundaries[i];\n  290 | \t\t\tconst int end = boundaries[i + 1];\n  291 | \t\t\tconst String line = all_warnings.substr(start, end - start);","lines":6,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/scene/scene_tree_editor.cpp#L286-L291"},{"ref":"editor/scene/scene_tree_editor.cpp:796-802","code":"  796 | \t\tconst PackedInt32Array boundaries = TS->string_get_word_breaks(p_node->get_editor_description(), \"\", 80);\n  797 | \t\ttooltip += \"\\n\";\n  798 | \n  799 | \t\tfor (int i = 0; i < boundaries.size(); i += 2) {\n  800 | \t\t\tconst int start = boundaries[i];\n  801 | \t\t\tconst int end = boundaries[i + 1];\n  802 | \t\t\ttooltip += \"\\n\" + p_node->get_editor_description().substr(start, end - start + 1).rstrip(\"\\n\");","lines":7,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/scene/scene_tree_editor.cpp#L796-L802"}]},
{"id":"LOGIC_92","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"Inconsistent image format between instantiate and set_data calls in SeparateYuyvBufferDecoder::decode. When y_image is invalid and needs to be created (line 100), it instantiates with FORMAT_RGB8 but the actual data is in FORMAT_L8 (as confirmed by line 98 which uses FORMAT_L8 for set_data on valid images). Same issue occurs at line 105 for cbcr_image. This mismatch could cause incorrect image interpretation.","fix":"Change FORMAT_RGB8 to FORMAT_L8 on lines 100 and 105 to match the actual pixel data format","locations":[{"ref":"modules/camera/buffer_decoder.cpp:100","code":"  100 | \t\ty_image.instantiate(width, height, false, Image::FORMAT_RGB8, y_image_data);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/camera/buffer_decoder.cpp#L100"},{"ref":"modules/camera/buffer_decoder.cpp:105","code":"  105 | \t\tcbcr_image.instantiate(width, height, false, Image::FORMAT_RGB8, cbcr_image_data);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/camera/buffer_decoder.cpp#L105"}]},
{"id":"LOGIC_93","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"Inconsistent image format between instantiate and set_data calls in YuyvToGrayscaleBufferDecoder::decode. Line 131 uses FORMAT_L8 for set_data on valid images, but line 133 instantiates new images with FORMAT_RGB8. This format mismatch could cause incorrect image interpretation or data layout issues.","fix":"Change FORMAT_RGB8 to FORMAT_L8 on line 133 to match the actual grayscale pixel data format","locations":[{"ref":"modules/camera/buffer_decoder.cpp:131-133","code":"  131 | \t\timage->set_data(width, height, false, Image::FORMAT_L8, image_data);\n  132 | \t} else {\n  133 | \t\timage.instantiate(width, height, false, Image::FORMAT_RGB8, image_data);","lines":3,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/camera/buffer_decoder.cpp#L131-L133"}]},
{"id":"LOGIC_94","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"Off-by-one error in get_left_function_call(): The function position character is decremented before being assigned, causing the cursor position to be placed one character before the actual opening parenthesis. The loop decrements 'c' on line 767, but then on line 769 assigns this decremented value to r_func_pos.character. This results in pointing to the wrong position, which would cause incorrect function parameter help to be shown to the user.","fix":"Either assign r_func_pos.character before decrementing c (move the assignment to before line 767), or assign 'c + 1' on line 769 instead of 'c'. The intended behavior is to capture the position of the opening parenthesis itself.","locations":[{"ref":"modules/gdscript/language_server/gdscript_extend_parser.cpp:752-780","code":"  752 | \t\twhile (c >= 0) {\n  753 | \t\t\tconst char32_t &character = line[c];\n  754 | \t\t\tif (character == ')') {\n  755 | \t\t\t\t++bracket_stack;\n  756 | \t\t\t} else if (character == '(') {\n  757 | \t\t\t\t--bracket_stack;\n  758 | \t\t\t\tif (bracket_stack < 0) {\n  759 | \t\t\t\t\tfound = true;\n  760 | \t\t\t\t}\n  761 | \t\t\t}\n  762 | \t\t\tif (bracket_stack <= 0 && character == ',') {\n  763 | \t\t\t\t++index;\n  764 | \t\t\t}\n  765 | \t\t\t--c;\n  766 | \t\t\tif (found) {\n  767 | \t\t\t\tr_func_pos.character = c;\n  768 | \t\t\t\tbreak;\n  769 | \t\t\t}\n  770 | \t\t}\n  771 | \n  772 | \t\tif (found) {\n  773 | \t\t\tr_func_pos.line = l;\n  774 | \t\t\tr_arg_index = index;\n  775 | \t\t\treturn OK;\n  776 | \t\t}\n  777 | \t}\n  778 | \n  779 | \treturn ERR_METHOD_NOT_FOUND;\n  780 | }","lines":29,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/gdscript/language_server/gdscript_extend_parser.cpp#L752-L780"}]},
{"id":"LOGIC_95","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"Line 489 has incomplete parent-child relationship logic. Condition 'p_parent_node_index < new_index' prevents appending child to parent if indices don't strictly increase. Valid parents with p_parent_node_index >= new_index are silently ignored.","fix":"Change 'else if (p_parent_node_index < new_index)' to 'else if (p_parent_node_index >= 0)' to handle all valid parent indices.","locations":[{"ref":"modules/gltf/gltf_state.cpp:490-491","code":"  490 | \t} else if (p_parent_node_index < new_index) {\n  491 | \t\tnodes.write[p_parent_node_index]->append_child_index(new_index);","lines":2,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/gltf/gltf_state.cpp#L490-L491"}]},

{"id":"LOGIC_97","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"Fragile bounds check: nav_mesh_queries_3d.cpp line 111 validates rrp_face_index < size but doesn't enforce lower bound. Code then accesses vertices[rrp_face_index-1] at line 113 assuming index>=2. While map building ensures this (starts at 2), the bounds check should explicitly validate both bounds to prevent future refactoring bugs","fix":"Change check to ERR_FAIL_COND_V(rrp_face_index < 2 || rrp_face_index >= rr_polygon.vertices.size(), Vector3()); to explicitly enforce the lower bound assumption","locations":[{"ref":"modules/navigation_3d/3d/nav_mesh_queries_3d.cpp:111-113","code":"  111 | \t\tERR_FAIL_UNSIGNED_INDEX_V(rrp_face_index, rr_polygon.vertices.size(), Vector3());\n  112 | \n  113 | \t\tconst Face3 face(rr_polygon.vertices[0], rr_polygon.vertices[rrp_face_index - 1], rr_polygon.vertices[rrp_face_index]);","lines":3,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/navigation_3d/3d/nav_mesh_queries_3d.cpp#L111-L113"}]},
{"id":"LOGIC_98","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"in_creation_polygon is cleared before being used in undo_redo.add_do_method(). This causes the undo/redo system to attempt to re-add an empty polygon instead of the actual polygon that was created. When users undo after creating a polygon, the polygon list will be restored incorrectly.","fix":"Save the polygon value before clearing it: Vector<Vector2> polygon_to_undo = in_creation_polygon; in_creation_polygon.clear(); then use polygon_to_undo in the undo_redo call instead of the now-empty in_creation_polygon.","locations":[{"ref":"modules/tilemap/editor/tile_data_editors.cpp:590-608","code":"  590 | \t\t\t\t\tif (in_creation_polygon.size() >= 3 && mb->get_position().distance_to(xform.xform(in_creation_polygon[0])) < grab_threshold) {\n  591 | \t\t\t\t\t\t// Closes and create polygon.\n  592 | \t\t\t\t\t\tif (!multiple_polygon_mode) {\n  593 | \t\t\t\t\t\t\tclear_polygons();\n  594 | \t\t\t\t\t\t}\n  595 | \t\t\t\t\t\tint added = add_polygon(in_creation_polygon);\n  596 | \n  597 | \t\t\t\t\t\tin_creation_polygon.clear();\n  598 | \t\t\t\t\t\tbutton_edit->set_pressed(true);\n  599 | \t\t\t\t\t\tundo_redo->create_action(TTR(\"Edit Polygons\"));\n  600 | \t\t\t\t\t\tif (!multiple_polygon_mode) {\n  601 | \t\t\t\t\t\t\tundo_redo->add_do_method(this, \"clear_polygons\");\n  602 | \t\t\t\t\t\t}\n  603 | \t\t\t\t\t\tundo_redo->add_do_method(this, \"add_polygon\", in_creation_polygon);\n  604 | \t\t\t\t\t\tundo_redo->add_do_method(base_control, \"queue_redraw\");\n  605 | \t\t\t\t\t\tundo_redo->add_undo_method(this, \"remove_polygon\", added);\n  606 | \t\t\t\t\t\tundo_redo->add_undo_method(base_control, \"queue_redraw\");\n  607 | \t\t\t\t\t\tundo_redo->commit_action(false);\n  608 | \t\t\t\t\t\temit_signal(SNAME(\"polygons_changed\"));","lines":19,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/tile {"id":"LOGIC_99","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"Uninitialized variable top_left at line 876. Variable is declared but never initialized, then conditionally used in line 881. Although the logic appears safe (if tile_map_selection is empty, the loop doesn't execute so top_left isn't read), this is poor practice and could be a latent bug.","fix":"Initialize top_left with a default value: Vector2i top_left = Vector2i(); or at minimum defer initialization until after the conditional check.","locations":[{"ref":"modules/tilemap/editor/tile_map_layer_editor.cpp:879-886","code":"  879 | \t\t\t\tVector2i top_left;\n  880 | \t\t\t\tif (!tile_map_selection.is_empty()) {\n  881 | \t\t\t\t\ttop_left = tile_map_selection.front()->get();\n  882 | \t\t\t\t}\n  883 | \t\t\t\tfor (const Vector2i &E : tile_map_selection) {\n  884 | \t\t\t\t\ttop_left = top_left.min(E);\n  885 | \t\t\t\t}\n  886 | \t\t\t\tVector2i offset = drag_start_mouse_pos - tile_set->map_to_local(top_left);","lines":8,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/tilemap/editor/tile_map_layer_editor.cpp#L879-L886"}]},
{"id":"LOGIC_100","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"TileSetAtlasSource::get_alternative_tile_id() at line 5466 applies alternative_no_transform() to a parameter named p_index, which is meant to be an array index, not an alternative ID. The function signature indicates p_index is an index into alternatives_ids array, but alternative_no_transform() masks transform bits (intended for IDs, not indices). This will corrupt array indexing when the index value has certain bit patterns.","fix":"Remove the alternative_no_transform() call at line 5466. The parameter p_index should be used directly as an array index without bit masking. If transform handling is needed, it should be applied to alternative IDs separately, not to array indices.","locations":[{"ref":"modules/tilemap/tile_set.cpp:5464-5470","code":" 5464 | int TileSetAtlasSource::get_alternative_tile_id(const Vector2i p_atlas_coords, int p_index) const {\n 5465 | \tERR_FAIL_COND_V_MSG(!tiles.has(p_atlas_coords), TileSetSource::INVALID_TILE_ALTERNATIVE, vformat(\"The TileSetAtlasSource atlas has no tile at %s.\", String(p_atlas_coords)));\n 5466 | \tp_index = alternative_no_transform(p_index);\n 5467 | \tERR_FAIL_INDEX_V(p_index, tiles[p_atlas_coords].alternatives_ids.size(), TileSetSource::INVALID_TILE_ALTERNATIVE);\n 5468 | \n 5469 | \treturn tiles[p_atlas_coords].alternatives_ids[p_index];\n 5470 | }","lines":7,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/tilemap/tile_set.cpp#L5464-L5470"}]},
{"id":"LOGIC_101","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"UV panning formula has operands in wrong order. The FUNC_PANNING case generates 'output = offset * scale + uv' when it should generate 'output = uv * scale + offset'. This results in incorrect shader code that doesn't properly apply UV scaling and offsetting for panning effects.","fix":"Change line 3494 from 'vformat(\"\\t%s = %s * %s + %s;\\n\", p_output_vars[0], offset_pivot, scale, uv)' to 'vformat(\"\\t%s = %s * %s + %s;\\n\", p_output_vars[0], uv, scale, offset_pivot)'. The vformat arguments should be reordered so that uv is multiplied by scale, then offset is added.","locations":[{"ref":"modules/visual_shader/vs_nodes/visual_shader_nodes.cpp:3450","code":" 3450 | \t\t\tcode += vformat(\"\t%s = %s * %s + %s;\\n\", p_output_vars[0], offset_pivot, scale, uv);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/visual_shader/vs_nodes/visual_shader_nodes.cpp#L3450"}]},
{"id":"LOGIC_102","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"VisualShaderNodeTransformParameter::set_default_value() missing idempotency check (6323-6326). Unlike other parameter types, it doesn't check if the value has changed before emitting.","fix":"Add Transform3D equality check before emit_changed().","locations":[{"ref":"modules/visual_shader/vs_nodes/visual_shader_nodes.cpp:6255-6258","code":" 6255 | void VisualShaderNodeTransformParameter::set_default_value(const Transform3D &p_value) {\n 6256 | \tdefault_value = p_value;\n 6257 | \temit_changed();\n 6258 | }","lines":4,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/visual_shader/vs_nodes/visual_shader_nodes.cpp#L6255-L6258"}]},
{"id":"LOGIC_103","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In java_class_wrapper.cpp ARG_NUMBER_CLASS_BIT | ARG_ARRAY_BIT | ARG_TYPE_CHAR case, when null array element is encountered at index i, 'count' variable is reassigned to i (line 1251). However, the buffer was already resized to original_count*2 at line 1245 before the loop. The reassignment doesn't affect the buffer size, leading to potential unused allocated memory and inconsistent state where the buffer size doesn't match the actual number of elements processed.","fix":"Either (1) shrink the buffer after the loop if a null was encountered, or (2) use a separate variable for tracking incomplete reads instead of modifying count. Example: Store the actual read count in a separate variable and use it in the loop, preserving count for the resize operation if needed.","locations":[{"ref":"platform/android/java_class_wrapper.cpp:1494-1517","code":" 1494 | \t\tcase ARG_NUMBER_CLASS_BIT | ARG_ARRAY_BIT | ARG_TYPE_CHAR: {\n 1495 | \t\t\tPackedByteArray ret;\n 1496 | \t\t\tjobjectArray arr = (jobjectArray)obj;\n 1497 | \n 1498 | \t\t\tint count = env->GetArrayLength(arr);\n 1499 | \t\t\t// Char arrays are UTF-16 encoded, so it's double the length.\n 1500 | \t\t\tret.resize(count * 2);\n 1501 | \n 1502 | \t\t\tjchar *ptr = (jchar *)ret.ptrw();\n 1503 | \t\t\tfor (int i = 0; i < count; i++) {\n 1504 | \t\t\t\tjobject o = env->GetObjectArrayElement(arr, i);\n 1505 | \t\t\t\tif (!o) {\n 1506 | \t\t\t\t\tcount = i;\n 1507 | \t\t\t\t\tbreak;\n 1508 | \t\t\t\t} else {\n 1509 | \t\t\t\t\tint val = env->CallCharMethod(o, JavaClassWrapper::singleton->Character_characterValue);\n 1510 | \t\t\t\t\tptr[i] = (jchar)val;\n 1511 | \t\t\t\t}\n 1512 | \t\t\t\tenv->DeleteLocalRef(o);\n 1513 | \t\t\t}\n 1514 | \n 1515 | \t\t\tvar = ret;\n 1516 | \t\t\treturn true;\n 1517 | \t\t} break;","lines":24,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/android/java_class_wrapper.cpp#L1494-L1517"}]},
{"id":"LOGIC_104","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Array size tracking bug in ARG_NUMBER_CLASS_BIT | ARG_ARRAY_BIT | ARG_TYPE_CHAR case. The PackedByteArray is resized to 'count * 2' at line 1245 to account for UTF-16 encoding. However, when a null jobject is encountered at line 1251, the code sets 'count = i' to break early. This causes a mismatch: the array has capacity for count*2 elements (where count is the original array length), but count is later reduced to i. This inconsistency could lead to wasted memory or incorrect size reporting if the returned array size is used elsewhere. The array will contain garbage/uninitialized data in the unused portion beyond index i.","fix":"Either (1) resize the array after the loop when count is final, or (2) track the actual number of elements written separately and resize before returning, or (3) remove the early size assignment and let the full sized array be returned (document that partial nulls result in zero-filled remainder).","locations":[{"ref":"platform/android/java_class_wrapper.cpp:1506","code":" 1506 | \t\t\t\t\tcount = i;","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/android/java_class_wrapper.cpp#L1506"}]},
{"id":"LOGIC_105","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In export_plugin.cpp, at line 327-329, when a 32-bit executable has embedded data >= 4 GiB, the code calls add_message() with an error but does NOT return. The function continues executing, potentially leading to invalid data being written to the file since the size check fails but execution continues.","fix":"Add 'return ERR_FILE_CORRUPT;' or similar error return after the add_message() call to prevent further processing when this constraint is violated.","locations":[{"ref":"platform/linuxbsd/export/export_plugin.cpp:327-329","code":"  327 | \tif (bits == 32 && p_embedded_size >= 0x100000000) {\n  328 | \t\tadd_message(EXPORT_MESSAGE_ERROR, TTR(\"PCK Embedding\"), TTR(\"32-bit executables cannot have embedded data >= 4 GiB.\"));\n  329 | \t}","lines":3,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/linuxbsd/export/export_plugin.cpp#L327-L329"}]},
{"id":"LOGIC_106","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"UTF-8 to UTF-32 conversion logic may skip or miscount characters in _js_utterance_callback. The loop increments 'i' inside the loop body as well as the for statement, causing double-increments for multibyte UTF-8 sequences. When i is incremented by 1, 2, or 3 for continuation bytes, the for loop then adds another 1, skipping characters.","fix":"Change the for loop to explicitly control the increment: 'for (int i = 0; i < string.length(); ) { ... i++; }' and remove the i += N statements, replacing with logic that skips the continuation bytes without double-incrementing.","locations":[{"ref":"platform/web/display_server_web.cpp:488-498","code":"  488 | \t\t\tfor (int i = 0; i < MIN(p_pos, string.length()); i++) {\n  489 | \t\t\t\tuint8_t c = string[i];\n  490 | \t\t\t\tif ((c & 0xe0) == 0xc0) {\n  491 | \t\t\t\t\ti += 1;\n  492 | \t\t\t\t} else if ((c & 0xf0) == 0xe0) {\n  493 | \t\t\t\t\ti += 2;\n  494 | \t\t\t\t} else if ((c & 0xf8) == 0xf0) {\n  495 | \t\t\t\t\ti += 3;\n  496 | \t\t\t\t}\n  497 | \t\t\t\tpos++;\n  498 | \t\t\t}","lines":11,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/web/display_server_web.cpp#L488-L498"}]},
{"id":"LOGIC_107","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"Logic error in polygon_2d.cpp line 369: The condition 'needs_clear |= has_bones || has_bones != last_has_bones;' is malformed. The OR operator creates a tautology where if has_bones is true, the entire expression is true regardless of comparison with last_has_bones. This should be a simple equality check like the other conditions above it.","fix":"Change line 369 from:\n\t\t\tneeds_clear |= has_bones || has_bones != last_has_bones;\nTo:\n\t\t\tneeds_clear |= has_bones != last_has_bones;","locations":[{"ref":"scene/2d/polygon_2d.cpp:369","code":"  369 | \t\t\tneeds_clear |= has_bones || has_bones != last_has_bones;","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/2d/polygon_2d.cpp#L369"}]},
{"id":"LOGIC_108","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"PARAM_SHADOW_FADE_START is set twice with different values in Light3D constructor. Line 502 initializes it to 0.8, but line 509 immediately overwrites it with 1. This looks like a copy-paste bug where line 509 should either be removed or set a different parameter entirely. The second assignment overrides the first.","fix":"Review line 509 - either remove it if it's a duplicate, or replace it with the correct parameter that was meant to be initialized (likely PARAM_INTENSITY has its own initialization on line 511, so line 509 appears to be erroneous).","locations":[{"ref":"scene/3d/light_3d.cpp:502-509","code":"  502 | \tset_param(PARAM_SHADOW_FADE_START, 0.8);\n  503 | \tset_param(PARAM_SHADOW_PANCAKE_SIZE, 20.0);\n  504 | \tset_param(PARAM_SHADOW_OPACITY, 1.0);\n  505 | \tset_param(PARAM_SHADOW_BLUR, 1.0);\n  506 | \tset_param(PARAM_SHADOW_BIAS, 0.1);\n  507 | \tset_param(PARAM_SHADOW_NORMAL_BIAS, 1.0);\n  508 | \tset_param(PARAM_TRANSMITTANCE_BIAS, 0.05);\n  509 | \tset_param(PARAM_SHADOW_FADE_START, 1);","lines":8,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/3d/light_3d.cpp#L502-L509"}]},
{"id":"LOGIC_109","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"VehicleBody3D::_resolve_single_bilateral() computes relative velocity via Jacobian entry (line 641-645) but then immediately overwrites it with a different computation (line 647). The Jacobian calculation result is discarded, making that computation dead code. The comment at line 638-640 explicitly flags this as a FIXME issue - investigation needed to determine if this is intentional design or a bug.","fix":"Verify the intended logic: either remove the Jacobian computation if line 647 is correct, or replace line 647 with the proper projection (possibly remove the immediate overwrite or use the computed value). The comment suggests: 'rel_vel = normal.dot(rel_vel);' where rel_vel is from the Jacobian result.","locations":[{"ref":"scene/3d/physics/vehicle_body_3d.cpp:638-647","code":"  638 | \t// FIXME: rel_vel assignment here is overwritten by the following assignment.\n  639 | \t// What seems to be intended in the next assignment is: rel_vel = normal.dot(rel_vel);\n  640 | \t// Investigate why.\n  641 | \treal_t rel_vel = jac.getRelativeVelocity(\n  642 | \t\t\ts->get_linear_velocity(),\n  643 | \t\t\ts->get_transform().basis.transposed().xform(s->get_angular_velocity()),\n  644 | \t\t\tb2lv,\n  645 | \t\t\tb2trans.xform(b2av));\n  646 | \n  647 | \trel_vel = normal.dot(vel);","lines":10,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/3d/physics/vehicle_body_3d.cpp#L638-L647"}]},
{"id":"LOGIC_110","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In grow_to_desired_size() at line 2050, the condition is inverted. The code checks 'if (data.expanded_by_desired_size)' and then always expands, but it should only expand if NOT already expanded (condition should be negated). This causes the function to redundantly try to expand even when already expanded, and skips the condition that checks if the new size is actually larger.","fix":"Change line 2050 from 'if (data.expanded_by_desired_size)' to 'if (!data.expanded_by_desired_size)' and remove the redundant 'data.expanded_by_desired_size = true;' assignment at line 2052 (or merge both branches)","locations":[{"ref":"scene/gui/control.cpp:2101-2107","code":" 2101 | \tif (data.expanded_by_desired_size) {\n 2102 | \t\tset_size(desired_size);\n 2103 | \t\tdata.expanded_by_desired_size = true;\n 2104 | \t} else if (desired_size.x > get_size().x || desired_size.y > get_size().y) {\n 2105 | \t\tset_size(desired_size);\n 2106 | \t\tdata.expanded_by_desired_size = true;\n 2107 | \t}","lines":7,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/gui/control.cpp#L2101-L2107"}]},
{"id":"LOGIC_111","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"Nested conditional branches in line_edit.cpp set_caret_column at lines 2354-2364. The else clause (starting at line 2357) contains a duplicate if(rtl) check that will never execute for the RTL case because the outer if(rtl) at line 2355 already handled it. This creates unreachable code at lines 2359-2361.","fix":"Remove the inner if(rtl) block at lines 2358-2363. Replace with direct assignment: x_ofs = MAX(style->get_margin(SIDE_LEFT), x_ofs - right_icon_size.width - style->get_margin(SIDE_RIGHT));","locations":[{"ref":"scene/gui/line_edit.cpp:2360-2370","code":" 2360 | \t\t} else {\n 2361 | \t\t\tif (rtl) {\n 2362 | \t\t\t\tx_ofs = MAX(style->get_margin(SIDE_LEFT) + right_icon_size.width, x_ofs);\n 2363 | \t\t\t} else {\n 2364 | \t\t\t\tif (rtl) {\n 2365 | \t\t\t\t\tx_ofs = MAX(style->get_margin(SIDE_LEFT) + right_icon_size.width, x_ofs);\n 2366 | \t\t\t\t} else {\n 2367 | \t\t\t\t\tx_ofs = MAX(style->get_margin(SIDE_LEFT), x_ofs - right_icon_size.width - style->get_margin(SIDE_RIGHT));\n 2368 | \t\t\t\t}\n 2369 | \t\t\t}\n 2370 | \t\t}","lines":11,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/gui/line_edit.cpp#L2360-L2370"}]},
{"id":"LOGIC_112","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Off-by-one risk in _move_caret_to_line_end() at line 3118-3120. Loop initializes row_end_col to -1 and adds lengths. For empty wrapped rows, this could produce incorrect column values. Logic appears to calculate cumulative position but depends on rows not being empty.","fix":"Initialize row_end_col to 0 instead of -1, or add explicit handling for empty rows vector","locations":[{"ref":"scene/gui/text_edit.cpp:3593-3596","code":" 3593 | \t\tint row_end_col = -1;\n 3594 | \t\tfor (int j = 0; j < wi + 1; j++) {\n 3595 | \t\t\trow_end_col += rows[j].length();\n 3596 | \t\t}","lines":4,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/gui/text_edit.cpp#L3593-L3596"}]},
{"id":"LOGIC_113","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In TextEdit::search() at line 4928, when searching backwards, current_column is set to MIN(current_column, text[p_from_line].length() - p_key.length()). If p_key.length() > text[p_from_line].length(), this results in a negative current_column, which is then passed to rfind(). This causes integer underflow and incorrect search behavior for keys longer than the starting line.","fix":"Change line 4928 to: current_column = MIN(current_column, MAX(0, (int)text[p_from_line].length() - (int)p_key.length())); to ensure current_column never goes negative.","locations":[{"ref":"scene/gui/text_edit.cpp:5502-5505","code":" 5502 | \tif (p_search_flags & SEARCH_BACKWARDS) {\n 5503 | \t\t// `rfind` requires the from index to be within the bounds of the last possible match position.\n 5504 | \t\tcurrent_column = MIN(current_column, text[p_from_line].length() - p_key.length());\n 5505 | \t}","lines":4,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/gui/text_edit.cpp#L5502-L5505"}]},
{"id":"LOGIC_114","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In _popup_base() line 2283, when repositioning an invalidly-placed window, the calculation set_position((parent_rect.size - size) / 2) should be set_position(parent_rect.position + (parent_rect.size - size) / 2) to properly center within parent_rect bounds.","fix":"Change to: set_position(parent_rect.position + (parent_rect.size - size) / 2);","locations":[{"ref":"scene/main/window.cpp:2301","code":" 2301 | \t\tset_position((parent_rect.size - size) / 2);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/main/window.cpp#L2301"}]},

{"id":"LOGIC_116","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In BitMap::resize(), when p_new_size has zero dimensions, the method checks 'lw = (width == 0) ? 0 : p_new_size.width' which prevents accessing current bitmap data. But if current width is 0 and p_new_size.width is 0, lw becomes 0, leading to division by zero risk at line 656 when computing scale_x = width / p_new_size.width (0/0). Additionally the logic seems inverted - should be checking p_new_size dimensions, not current width.","fix":"Fix the scale calculation to handle zero-sized destinations: check p_new_size for zero and return early, or guard division with a check: 'float scale_x = (p_new_size.width != 0) ? (float)width / p_new_size.width : 1.0f;'","locations":[{"ref":"scene/resources/bit_map.cpp:653-657","code":"  653 | \tint lw = (width == 0) ? 0 : p_new_size.width;\n  654 | \tint lh = (height == 0) ? 0 : p_new_size.height;\n  655 | \n  656 | \tfloat scale_x = ((float)width / p_new_size.width);\n  657 | \tfloat scale_y = ((float)height / p_new_size.height);","lines":5,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/resources/bit_map.cpp#L653-L657"}]},

{"id":"LOGIC_119","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In render_forward_mobile.cpp line 1605, there is a comment stating 'Why is this inverted? Do we assume flip in shadow logic?' followed by code setting flip_y to the inverse of p_flip_y. This suggests the code may have inverted logic. The negation appears intentional but is confusing and potentially incorrect depending on the shadow rendering contract.","fix":"Either remove the negation to match the parameter directly (scene_data.flip_y = p_flip_y;) or document why the inversion is necessary and remove the question in the comment.","locations":[{"ref":"servers/rendering/renderer_rd/forward_mobile/render_forward_mobile.cpp:1633","code":" 1633 | \tscene_data.flip_y = !p_flip_y; // Q: Why is this inverted? Do we assume flip in shadow logic?","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/servers/rendering/renderer_rd/forward_mobile/render_forward_mobile.cpp#L1633"}]},

{"id":"LOGIC_123","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In _item_override_cbk STYLEBOX case (line 3099-3107), sb is initialized as empty Ref<StyleBox>(), then checked with is_stylebox_pinned(sb) at line 3104. The condition is always false for an empty Ref, making the undo method for unpinning never execute.","fix":"Don't initialize sb as empty. This case doesn't set any value (unlike other cases which set to default/empty values), which may be incomplete. Consider adding stylebox value or removing the pinning check.","locations":[{"ref":"editor/scene/gui/theme_editor_plugin.cpp:3101-3109","code":" 3101 | \t\tcase Theme::DATA_TYPE_STYLEBOX: {\n 3102 | \t\t\tRef<StyleBox> sb;\n 3103 | \t\t\tur->add_do_method(*edited_theme, \"set_stylebox\", p_item_name, edited_type, sb);\n 3104 | \t\t\tur->add_undo_method(*edited_theme, \"clear_stylebox\", p_item_name, edited_type);\n 3105 | \n 3106 | \t\t\tif (is_stylebox_pinned(sb)) {\n 3107 | \t\t\t\tur->add_undo_method(this, \"_unpin_leading_stylebox\");\n 3108 | \t\t\t}\n 3109 | \t\t} break;","lines":9,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/scene/gui/theme_editor_plugin.cpp#L3101-L3109"}]},
