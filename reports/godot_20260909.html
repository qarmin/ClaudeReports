st_pass[p_instance->decals[i]] == current_frame) {\n  146 | \t\t\tp_instance_data->decals[ofs] &= mask;\n  147 | \t\t\tp_instance_data->decals[ofs] |= uint32_t(forward_id_storage_mobile->forward_id_allocators[RendererRD::FORWARD_ID_TYPE_DECAL].map[p_instance->decals[i]]) << shift;\n  148 | \t\t\tidx++;\n  149 | \t\t}\n  150 | \t}\n  151 | \n  152 | \tp_instance_data->reflection_probes[0] = 0xFFFFFFFF;\n  153 | \tp_instance_data->reflection_probes[1] = 0xFFFFFFFF;\n  154 | \n  155 | \tForwardIDByMapSort sorted_reflection_probes[MAX_RDL_CULL];\n  156 | \tfor (uint32_t i = 0; i < p_instance->reflection_probe_count; i++) {\n  157 | \t\tsorted_reflection_probes[i].forward_id = p_instance->reflection_probes[i];\n  158 | \t\tsorted_reflection_probes[i].map = forward_id_storage_mobile->forward_id_allocators[RendererRD::FORWARD_ID_TYPE_REFLECTION_PROBE].map[p_instance->reflection_probes[i]];\n  159 | \t}\n  160 | \n  161 | \tSortArray<ForwardIDByMapSort> sort_array;\n  162 | \tsort_array.sort(sorted_reflection_probes, p_instance->reflection_probe_count);\n  163 | \n  164 | \tidx = 0;\n  165 | \tfor (uint32_t i = 0; i < p_instance->reflection_probe_count; i++) {\n  166 | \t\tuint32_t ofs = idx < 4 ? 0 : 1;\n  167 | \t\tuint32_t shift = (idx & 0x3) << 3;\n  168 | \t\tuint32_t mask = ~(0xFF << shift);\n  169 | \t\tif (forward_id_storage_mobile->forward_id_allocators[RendererRD::FORWARD_ID_TYPE_REFLECTION_PROBE].last_pass[sorted_reflection_probes[i].forward_id] == current_frame) {\n  170 | \t\t\tp_instance_data->reflection_probes[ofs] &= mask;\n  171 | \t\t\tp_instance_data->reflection_probes[ofs] |= uint32_t(forward_id_storage_mobile->forward_id_allocators[RendererRD::FORWARD_ID_TYPE_REFLECTION_PROBE].map[sorted_reflection_probes[i].forward_id]) << shift;\n  172 | \t\t\tidx++;\n  173 | \t\t}\n  174 | \t}\n  175 | }","lines":88,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/servers/rendering/renderer_rd/forward_mobile/render_forward_mobile.cpp#L88-L175"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"very_easy","description":"The deflate() function return value is not checked before using the compressed data. The function can return Z_STREAM_ERROR, Z_BUF_ERROR, or other error codes, but the code ignores these and proceeds to calculate the output size and return it. This can result in returning invalid/corrupted compressed data.","fix":"Add error checking: `int ret = deflate(&strm, Z_FINISH); if (ret != Z_STREAM_END) { deflateEnd(&strm); return -1; }`","locations":[{"ref":"core/io/compression.cpp:109","code":"  109 | \t\t\tdeflate(&strm, Z_FINISH);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/core/io/compression.cpp#L109"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"medium","description":"Invalid use of WEXITSTATUS on pclose() result without WIFEXITED check. Line 915 returns 'pclose(f)' which is already the exit status in shell context, but line 918 calls WEXITSTATUS(rv) which expects a raw wait() status. This misinterprets the exit code - WEXITSTATUS is designed for values from waitpid(), not pclose().","fix":"For pclose(), the return value is already the exit status encoded by the shell. Use WIFEXITED(rv) == false ? -1 : WEXITSTATUS(rv), or simpler: WEXITSTATUS(rv << 8) if rv is raw shell status, or just use 'rv' directly as it's already the exit code.","locations":[{"ref":"drivers/unix/os_unix.cpp:875-878","code":"  875 | \t\tint rv = pclose(f);\n  876 | \n  877 | \t\tif (r_exitcode) {\n  878 | \t\t\t*r_exitcode = WEXITSTATUS(rv);","lines":4,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/drivers/unix/os_unix.cpp#L875-L878"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"very_easy","description":"AudioEffectRecordInstance::is_recording flag is a data race. The flag is written from main thread (line 178) without synchronization while the IO thread reads it in _io_thread_process() (line 73). No mutex or atomic protects this shared bool.","fix":"Use std::atomic<bool> for is_recording or protect with a mutex. Convert is_recording to atomic<bool> and use load()/store() with proper memory ordering.","locations":[{"ref":"servers/audio/effects/audio_effect_record.cpp:179","code":"  179 | \t\t\tcurrent_instance->is_recording = false;","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/servers/audio/effects/audio_effect_record.cpp#L179"},{"ref":"servers/audio/effects/audio_effect_record.cpp:74","code":"   74 | \twhile (is_recording) {","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/servers/audio/effects/audio_effect_record.cpp#L74"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"cowdata.h set() method at line 184 uses CRASH_COND on _copy_on_write() result. If copy-on-write fails due to OOM, the program crashes immediately instead of returning an error. TODO comment at line 183 acknowledges this issue.","fix":"Return Error code from set() instead of crashing. Change to 'Error set(Size p_index, const T &p_elem)' and return _copy_on_write() error for proper error handling.","locations":[{"ref":"core/templates/cowdata.h:183-188","code":"  183 | \t_FORCE_INLINE_ void set(Size p_index, const T &p_elem) {\n  184 | \t\tERR_FAIL_INDEX(p_index, size());\n  185 | \t\t// TODO Returning the error would be more appropriate.\n  186 | \t\tCRASH_COND(_copy_on_write());\n  187 | \t\t_ptr[p_index] = p_elem;\n  188 | \t}","lines":6,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/core/templates/cowdata.h#L183-L188"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"Same error message mismatch in resource_importer_bmfont.cpp at line 110. Reports '.res' but actually saves '.fontdata'.","fix":"Change error message from '.res' to '.fontdata' to match the actual file being saved (line 109).","locations":[{"ref":"editor/import/resource_importer_bmfont.cpp:109-110","code":"  109 | \terr = ResourceSaver::save(font, p_save_path + \".fontdata\", flg);\n  110 | \tERR_FAIL_COND_V_MSG(err != OK, err, \"Cannot save font to file \\\"\" + p_save_path + \".res\\\".\");","lines":2,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/import/resource_importer_bmfont.cpp#L109-L110"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"Error message mismatch at line 380 in resource_importer_imagefont.cpp. The error message reports saving to '.res' file but the actual code saves to '.fontdata' file (line 379). This misleads users about what went wrong.","fix":"Change error message from 'Cannot save font to file \"' + p_save_path + '.res\"' to 'Cannot save font to file \"' + p_save_path + '.fontdata\"' to match actual file extension being saved.","locations":[{"ref":"editor/import/resource_importer_imagefont.cpp:379-380","code":"  379 | \terr = ResourceSaver::save(font, p_save_path + \".fontdata\", flg);\n  380 | \tERR_FAIL_COND_V_MSG(err != OK, err, \"Cannot save font to file \\\"\" + p_save_path + \".res\\\".\");","lines":2,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/import/resource_importer_imagefont.cpp#L379-L380"}]},
{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"very_easy","description":"API call result is not checked. xrPathToString() is called at line 521 without checking its return value (XrResult). If the call fails, the buffer may contain invalid data or the size output may be incorrect, yet the code proceeds as if the conversion succeeded.","fix":"Check the return value of xrPathToString: `XrResult result = xrPathToString(instance, paths[i], 1024, &size, buffer); if (XR_FAILED(result)) { continue; }` before using the buffer.","locations":[{"ref":"modules/openxr/extensions/openxr_render_model_extension.cpp:521","code":"  521 | \t\t\txrPathToString(instance, paths[i], 1024, &size, buffer);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/openxr/extensions/openxr_render_model_extension.cpp#L521"}]},
{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In macho.cpp MachO::alloc_signature() at line 70, lc_offset is computed as 'fa->get_length() + PAD(...)' which could theoretically overflow if file length is near uint32_t max, then is unconditionally BSWAP32'd. While unlikely in practice, there's no overflow guard.","fix":"Use explicit uint64_t intermediate or add overflow check before casting to uint32.","locations":[{"ref":"editor/export/macho.cpp:70-77","code":"   70 | \t\tuint32_t lc_offset = fa->get_length() + PAD(fa->get_length(), 16);\n   71 | \t\tuint32_t lc_size = 0;\n   72 | \t\tif (swap) {\n   73 | \t\t\tlc_offset = BSWAP32(lc_offset);\n   74 | \t\t\tlc_size = BSWAP32(lc_size);\n   75 | \t\t}\n   76 | \t\tfa->store_32(lc_offset);\n   77 | \t\tfa->store_32(lc_size);","lines":8,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/export/macho.cpp#L70-L77"}]},
{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"In SkeletonProfile::set_reference_pose(), the D_METHOD binding at line 446 has parameter name 'bone_name' instead of 'reference_pose'. This is a documentation/binding mismatch that could confuse users about what the parameter does.","fix":"Change D_METHOD parameter from 'bone_name' to 'reference_pose' to match actual method signature: ClassDB::bind_method(D_METHOD(\"set_reference_pose\", \"bone_idx\", \"reference_pose\"), &SkeletonProfile::set_reference_pose);","locations":[{"ref":"scene/resources/skeleton_profile.cpp:446","code":"  446 | \tClassDB::bind_method(D_METHOD(\"set_reference_pose\", \"bone_idx\", \"bone_name\"), &SkeletonProfile::set_reference_pose);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/resources/skeleton_profile.cpp#L446"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"medium","description":"Endianness mismatch in remote debugger peer TCP communication. Line 142 reads the packet size by directly reading raw bytes into a uint32_t variable without decoding, while line 117 on the write side uses encode_uint32(). This will fail on big-endian systems or when endianness doesn't match. The read side should use decode_uint32() to match the write side encoding.","fix":"Use decode_uint32 to read the size: uint32_t size = decode_uint32((const uint8_t *)&size_bytes); where size_bytes are read from tcp_client->get_partial_data. Or read 4 bytes then call decode_uint32 on those bytes.","locations":[{"ref":"core/debugger/remote_debugger_peer.cpp:142","code":"  142 | \t\t\terr = tcp_client->get_partial_data((uint8_t *)&size, 4, read);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/core/debugger/remote_debugger_peer.cpp#L142"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"very_easy","description":"strlen() called on char32_t* pointer instead of wchar_t*-aware or char32_t-aware length calculation. strlen() only counts char (1-byte) characters and will produce incorrect results for multi-byte character strings.","fix":"Replace strlen(p_contents) with a proper null-termination detection for char32_t strings, or use wcslen() family appropriately. The line should likely not use Span with manual length calculation if the function expects null-terminated strings.","locations":[{"ref":"core/extension/gdextension_interface.cpp:906","code":"  906 | \tdest->append_utf32(Span(p_contents, p_contents ? strlen(p_contents) : 0));","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/core/extension/gdextension_interface.cpp#L906"},{"ref":"core/extension/gdextension_interface.cpp:917","code":"  917 | \t\tstring->append_utf32(Span((const char32_t *)p_contents, p_contents ? strlen(p_contents) : 0));","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/core/extension/gdextension_interface.cpp#L917"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"very_easy","description":"strlen() called on wchar_t* pointer (when sizeof(wchar_t)==4) instead of proper wide-character aware length calculation. strlen() counts bytes not wide characters and will return incorrect length.","fix":"For wchar_t that is 32-bit wide, use wcslen() or platform-specific wide character length function, or ensure the implementation handles null-termination correctly without manual length specification.","locations":[{"ref":"core/extension/gdextension_interface.cpp:906","code":"  906 | \tdest->append_utf32(Span(p_contents, p_contents ? strlen(p_contents) : 0));","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/core/extension/gdextension_interface.cpp#L906"},{"ref":"core/extension/gdextension_interface.cpp:917","code":"  917 | \t\tstring->append_utf32(Span((const char32_t *)p_contents, p_contents ? strlen(p_contents) : 0));","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/core/extension/gdextension_interface.cpp#L917"}]},
{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"very_easy","description":"In filter_radiance function, glUniform4fv is called with sample_count as the count parameter (line 192), but only index samples were actually written to the sample_directions array. Some loop iterations skip writing due to the 'continue' statement when light_vec.z <= 0.0, causing only index samples to be valid. This results in uninitialized memory being sent to the GPU shader.","fix":"Change the count parameter in glUniform4fv from sample_count to index to match the actual number of valid samples written to the array.","locations":[{"ref":"drivers/gles3/effects/cubemap_filter.cpp:192","code":"  192 | \t\tglUniform4fv(cubemap_filter.shader.version_get_uniform(CubemapFilterShaderGLES3::SAMPLE_DIRECTIONS_MIP, cubemap_filter.shader_version, mode), sample_count, sample_directions.ptr());","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/drivers/gles3/effects/cubemap_filter.cpp#L192"}]},
{"id":"API_5","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"medium","description":"Reallocation callback incorrectly casts user_data to VkObjectType instead of VkTrackedObjectType. The user_data stores an index into the VkTrackedObjectType enum (0 to VK_TRACKED_OBJECT_TYPE_COUNT-1), which extends beyond the standard VkObjectType enum range. Casting this to VkObjectType and passing to get_allocation_callbacks results in an invalid type being passed to vk_object_to_tracked_object, causing potential array index out-of-bounds or incorrect type tracking.","fix":"Change line 298 from 'VkObjectType type = static_cast<VkObjectType>(*reinterpret_cast<uint32_t *>(p_user_data));' to 'VkTrackedObjectType type = static_cast<VkTrackedObjectType>(*reinterpret_cast<uint32_t *>(p_user_data));' to match the allocation callback's type handling.","locations":[{"ref":"drivers/vulkan/rendering_context_driver_vulkan.cpp:298-299","code":"  298 | \t\t\t\tVkObjectType type = static_cast<VkObjectType>(*reinterpret_cast<uint32_t *>(p_user_data));\n  299 | \t\t\t\treturn get_allocation_callbacks(type)->pfnAllocation(p_user_data, size, alignment, allocation_scope);","lines":2,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/drivers/vulkan/rendering_context_driver_vulkan.cpp#L298-L299"}]},
{"id":"API_6","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"very_easy","description":"Incorrect VkObjectType passed to vkDestroyImage allocation callbacks. At line 2587, vkDestroyImage is called with VK_OBJECT_TYPE_BUFFER instead of VK_OBJECT_TYPE_IMAGE when extra GPU memory tracking is enabled. This causes incorrect callback dispatch and resource tracking.","fix":"Change VK_OBJECT_TYPE_BUFFER to VK_OBJECT_TYPE_IMAGE in the vkDestroyImage call","locations":[{"ref":"drivers/vulkan/rendering_device_driver_vulkan.cpp:2649","code":" 2649 | \t\t\tvkDestroyImage(vk_device, tex_info->vk_image, VKC::get_allocation_callbacks(VK_OBJECT_TYPE_BUFFER));","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/drivers/vulkan/rendering_device_driver_vulkan.cpp#L2649"}]},
{"id":"API_7","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"very_easy","description":"Unsafe HashMap access at lines 243, 1172, and 4160. The code accesses `folder_colors[color_name]` where `color_name` comes from user-editable project settings (assigned_folder_colors). If a color name in assigned_folder_colors doesn't exist in folder_colors, this causes a crash or undefined behavior.","fix":"Use `folder_colors.has()` check before access, or use `folder_colors.get(color_name, default_color)` to provide a fallback when the color key doesn't exist.","locations":[{"ref":"editor/docks/filesystem_dock.cpp:246","code":"  246 | \tColor custom_color = has_custom_color ? folder_colors[assigned_folder_colors[lpath]] : Color();","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/docks/filesystem_dock.cpp#L246"},{"ref":"editor/docks/filesystem_dock.cpp:1183","code":" 1183 | \t\t\t\t\tColor this_folder_color = has_custom_color ? folder_colors[assigned_folder_colors[dpath]] : inherited_folder_color;","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/docks/filesystem_dock.cpp#L1183"},{"ref":"editor/docks/filesystem_dock.cpp:4226","code":" 4226 | \t\t\tfolder_icon_color = singleton->folder_colors[color_name];","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/docks/filesystem_dock.cpp#L4226"}]},
{"id":"API_8","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"medium","description":"_find_file() return value is ignored at line 3039, causing potential use of stale/invalid fs and cpos if the file is not found on the second lookup. If file indices shifted or the file was deleted between the initial lookup at line 2808 and the update at line 3039, this would lead to out-of-bounds array access at lines 3042-3050. The code accesses fs->files[cpos] without verifying that _find_file succeeded.","fix":"Check the return value of _find_file() at line 3039 before accessing fs->files[cpos]. If _find_file returns false, either handle the error appropriately or skip the update.","locations":[{"ref":"editor/file_system/editor_file_system.cpp:3039-3053","code":" 3039 | \tif (p_update_file_system) {\n 3040 | \t\t// Update cpos, newly created files could've changed the index of the reimported p_file.\n 3041 | \t\t_find_file(p_file, &fs, cpos);\n 3042 | \n 3043 | \t\t// Update modified times, to avoid reimport.\n 3044 | \t\tfs->files[cpos]->modified_time = FileAccess::get_modified_time(p_file);\n 3045 | \t\tfs->files[cpos]->import_modified_time = FileAccess::get_modified_time(p_file + \".import\");\n 3046 | \t\tfs->files[cpos]->import_md5 = FileAccess::get_md5(p_file + \".import\");\n 3047 | \t\tfs->files[cpos]->import_dest_paths = dest_paths;\n 3048 | \t\tfs->files[cpos]->deps = _get_dependencies(p_file);\n 3049 | \t\tfs->files[cpos]->type = importer->get_resource_type();\n 3050 | \t\tfs->files[cpos]->resource_script_class = ResourceLoader::get_resource_script_class(p_file);\n 3051 | \t\tfs->files[cpos]->uid = uid;\n 3052 | \t\tfs->files[cpos]->import_valid = fs->files[cpos]->type == \"TextFile\" ? true : ResourceLoader::is_import_valid(p_file);\n 3053 | \t}","lines":15,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/file_system/editor_file_system.cpp#L3039-L3053"}]},
{"id":"API_9","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"medium","description":"Memory management issue in VersionControlEditorPlugin::get_singleton(). The function allocates a new VersionControlEditorPlugin with memnew() when singleton is null, but doesn't properly manage ownership. The pattern `return singleton ? singleton : memnew(VersionControlEditorPlugin)` creates an object and returns it without ensuring the caller takes ownership or that it's properly registered in the scene tree before being returned.","fix":"Either: (1) Change get_singleton() to only return existing singleton and use a separate initialize() method to create it, or (2) Ensure the newly created object is immediately registered before returning, or (3) Use a factory pattern that properly handles ownership.","locations":[{"ref":"editor/version_control/version_control_editor_plugin.cpp:122-124","code":"  122 | VersionControlEditorPlugin *VersionControlEditorPlugin::get_singleton() {\n  123 | \treturn singleton ? singleton : memnew(VersionControlEditorPlugin);\n  124 | }","lines":3,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/version_control/version_control_editor_plugin.cpp#L122-L124"}]},
{"id":"API_10","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"medium","description":"In send_command() at line 282, when broadcasting to multiple peers (p_to <= 0), the return value of _send() is not checked. If _send() fails for any peer in the broadcast loop, the failure is silently ignored and the function returns OK, masking transmission errors to some or all peers.","fix":"Capture the return value from _send() and either: (1) return the first error encountered, or (2) collect all errors and return a combined error status. Example: Error result = OK; for (const int &pid : connected_peers) { ... Error err = _send(p_packet, p_packet_len); if (err != OK) result = err; } return result;","locations":[{"ref":"modules/multiplayer/scene_multiplayer.cpp:278-285","code":"  278 | \t\t\tif (p_to && pid == -p_to) {\n  279 | \t\t\t\tcontinue;\n  280 | \t\t\t}\n  281 | \t\t\tmultiplayer_peer->set_target_peer(pid);\n  282 | \t\t\t_send(p_packet, p_packet_len);\n  283 | \t\t}\n  284 | \t\treturn OK;\n  285 | \t}","lines":8,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/multiplayer/scene_multiplayer.cpp#L278-L285"}]},
{"id":"API_11","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"very_easy","description":"Multiple unchecked JNI method calls in Dictionary parsing (lines 435-442). GetMethodID result not checked at line 435 before use at line 436. CallObjectMethod result at line 436 not checked before GetObjectClass at line 438. GetObjectClass result at line 438 not checked before use at line 439.","fix":"Add null checks: `if (!entrySet) return ret;` after line 435, `if (!entrySetObj) return ret;` after line 436, `if (!setClass) return ret;` after line 438.","locations":[{"ref":"platform/android/jni_utils.cpp:435-442","code":"  435 | \t\tjmethodID entrySet = env->GetMethodID(oclass, \"entrySet\", \"()Ljava/util/Set;\");\n  436 | \t\tjobject entrySetObj = env->CallObjectMethod(obj, entrySet);\n  437 | \n  438 | \t\tjclass setClass = env->GetObjectClass(entrySetObj);\n  439 | \t\tjmethodID iterator = env->GetMethodID(setClass, \"iterator\", \"()Ljava/util/Iterator;\");\n  440 | \t\tjobject iteratorObj = env->CallObjectMethod(entrySetObj, iterator);\n  441 | \n  442 | \t\tjclass iteratorClass = env->GetObjectClass(iteratorObj);","lines":8,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/android/jni_utils.cpp#L435-L442"}]},
{"id":"API_12","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"very_easy","description":"Use of uninitialized variable 'xic' instead of 'wd.xic' in XmbLookupString call. The bare 'xic' variable is not defined in local scope and refers to an uninitialized/undefined value, leading to undefined behavior.","fix":"Change 'XmbLookupString(xic, ...' to 'XmbLookupString(wd.xic, ...' to use the window-specific input context, consistent with usage on lines 4010 and 4015.","locations":[{"ref":"platform/linuxbsd/x11/display_server_x11.cpp:4132","code":" 4132 | \t\t\tint mnbytes = XmbLookupString(xic, xkeyevent, xmbstring, xmblen - 1, &keysym_unicode, &status);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/linuxbsd/x11/display_server_x11.cpp#L4132"}]},
{"id":"API_13","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"very_easy","description":"Unchecked HashMap access without validation - swap_buffers() accesses windows[current_window] without checking if current_window is valid or exists in the map. If current_window is INVALID_WINDOW_ID or a stale ID, this will cause an out-of-bounds access or undefined behavior.","fix":"Add a validity check before accessing the window. Similar to window_make_current (line 216-219), use windows.find(current_window) to verify the window exists before dereferencing.","locations":[{"ref":"platform/macos/embedded_gl_manager.mm:228","code":"  228 | \tGLWindow &win = windows[current_window];","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/macos/embedded_gl_manager.mm#L228"}]},
{"id":"API_14","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"very_easy","description":"SendMessage() is called with potentially null HWND. When fd->hwnd_owner is nullptr (set at line 874 when no valid window owner exists), SendMessage is called with this nullptr at lines 603 and 607. While SendMessage may technically handle nullptr, it's incorrect API usage and may cause unpredictable behavior. The HWND should be validated before use.","fix":"Add null check before SendMessage calls: if (fd->hwnd_owner) { HICON w_icon = (HICON)SendMessage(...); }","locations":[{"ref":"platform/windows/display_server_windows.cpp:630","code":"  630 | \t\tHICON w_icon = (HICON)SendMessage(fd->hwnd_owner, WM_GETICON, ICON_SMALL, 0);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/windows/display_server_windows.cpp#L630"},{"ref":"platform/windows/display_server_windows.cpp:634","code":"  634 | \t\tw_icon = (HICON)SendMessage(fd->hwnd_owner, WM_GETICON, ICON_BIG, 0);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/windows/display_server_windows.cpp#L634"}]},
{"id":"API_15","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"medium","description":"Logic error in cursor_set_shape(): checks cursors_cache.has(p_shape) but then uses cursors[p_shape] without null verification. Mismatched cache and array access patterns.","fix":"Verify cursors[p_shape] is not nullptr before calling SetCursor, or use consistent cache-first validation.","locations":[{"ref":"platform/windows/display_server_windows.cpp:3351-3392","code":" 3351 | void DisplayServerWindows::cursor_set_shape(DisplayServerEnums::CursorShape p_shape) {\n 3352 | \t_THREAD_SAFE_METHOD_\n 3353 | \n 3354 | \tERR_FAIL_INDEX(p_shape, DisplayServerEnums::CURSOR_MAX);\n 3355 | \n 3356 | \tif (cursor_shape == p_shape) {\n 3357 | \t\treturn;\n 3358 | \t}\n 3359 | \n 3360 | \tif (mouse_mode != DisplayServerEnums::MOUSE_MODE_VISIBLE && mouse_mode != DisplayServerEnums::MOUSE_MODE_CONFINED) {\n 3361 | \t\tcursor_shape = p_shape;\n 3362 | \t\treturn;\n 3363 | \t}\n 3364 | \n 3365 | \tstatic const LPCTSTR win_cursors[DisplayServerEnums::CURSOR_MAX] = {\n 3366 | \t\tIDC_ARROW,\n 3367 | \t\tIDC_IBEAM,\n 3368 | \t\tIDC_HAND, // Finger.\n 3369 | \t\tIDC_CROSS,\n 3370 | \t\tIDC_WAIT,\n 3371 | \t\tIDC_APPSTARTING,\n 3372 | \t\tIDC_SIZEALL,\n 3373 | \t\tIDC_ARROW,\n 3374 | \t\tIDC_NO,\n 3375 | \t\tIDC_SIZENS,\n 3376 | \t\tIDC_SIZEWE,\n 3377 | \t\tIDC_SIZENESW,\n 3378 | \t\tIDC_SIZENWSE,\n 3379 | \t\tIDC_SIZEALL,\n 3380 | \t\tIDC_SIZENS,\n 3381 | \t\tIDC_SIZEWE,\n 3382 | \t\tIDC_HELP\n 3383 | \t};\n 3384 | \n 3385 | \tif (cursors_cache.has(p_shape)) {\n 3386 | \t\tSetCursor(cursors[p_shape]);\n 3387 | \t} else {\n 3388 | \t\tSetCursor(LoadCursor(hInstance, win_cursors[p_shape]));\n 3389 | \t}\n 3390 | \n 3391 | \tcursor_shape = p_shape;\n 3392 | }","lines":42,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/windows/display_server_windows.cpp#L3351-L3392"}]},
{"id":"API_16","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"very_easy","description":"In Area2D::_body_inout(), at lines 239-240, when condition '!node || in_tree' evaluates to true with !node being true (meaning the object has been deleted), the code emits a signal with a null or dangling 'obj' pointer. This is incorrect because: (1) 'obj' becomes a dangling pointer if the object was deleted between its retrieval at line 186 and usage at line 240, and (2) the signal expects a valid Node2D object, not null. The correct pattern (as seen in RigidBody2D::_body_inout at line 137) should check 'if (node && in_tree)' before emitting, ensuring the object is still valid. The condition should be changed from '!node || in_tree' to 'node && in_tree', and obj should be replaced with node for consistency.","fix":"Change condition from 'if (!node || in_tree)' to 'if (node && in_tree)' and use 'node' instead of 'obj' in the emit_signal call: emit_signal(SceneStringName(body_shape_exited), p_body, node, p_body_shape, p_area_shape);","locations":[{"ref":"scene/2d/physics/area_2d.cpp:240-241","code":"  240 | \t\tif (!node || in_tree) {\n  241 | \t\t\temit_signal(SceneStringName(body_shape_exited), p_body, obj, p_body_shape, p_area_shape);","lines":2,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/2d/physics/area_2d.cpp#L240-L241"}]},
{"id":"API_17","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"very_easy","description":"In Area2D::_area_inout(), at lines 350-351, the same bug pattern exists as in _body_inout(). The condition '!node || in_tree' with !node being true means the object has been deleted, and the code emits a signal passing a null or dangling 'obj' pointer. This violates the signal's expectation of a valid Area2D object. The fix should match the RigidBody2D pattern: check 'if (node && in_tree)' before emitting and pass 'node' instead of 'obj'.","fix":"Change condition from 'if (!node || in_tree)' to 'if (node && in_tree)' and use 'node' instead of 'obj' in the emit_signal call: emit_signal(SceneStringName(area_shape_exited), p_area, node, p_area_shape, p_self_shape);","locations":[{"ref":"scene/2d/physics/area_2d.cpp:351-352","code":"  351 | \t\tif (!node || in_tree) {\n  352 | \t\t\temit_signal(SceneStringName(area_shape_exited), p_area, obj, p_area_shape, p_self_shape);","lines":2,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/2d/physics/area_2d.cpp#L351-L352"}]},
{"id":"API_18","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"very_easy","description":"Incorrect use of NativeMenu::add_item() return value to index items array in add_submenu_node_item(). The code assigns int index from nmenu->add_item() and then uses it to access items.write[index].submenu_bound. However, the returned index from nmenu->add_item() is for NativeMenu operations and may not correspond to the position in the items array. The item was added to items at position items.size() - 1 (line 2122), so that position should be used instead.","fix":"Change line 2129 from 'items.write[index].submenu_bound = true;' to 'items.write[items.size() - 1].submenu_bound = true;' or store the index as 'int item_index = items.size() - 1;' and use that consistently.","locations":[{"ref":"scene/gui/popup_menu.cpp:2104","code":" 2104 | \t\titems.write[index].submenu_bound = true;","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/gui/popup_menu.cpp#L2104"}]},
{"id":"API_19","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"very_easy","description":"Missing caret index parameter in set_caret_column() call at line 3066 in _move_caret_down(). Function signature expects 'int p_caret' parameter but only 2 args provided. Should pass 'i' to maintain multi-caret behavior.","fix":"Change 'set_caret_column(text[get_caret_line(i)].length());' to 'set_caret_column(text[get_caret_line(i)].length(), i == 0, i);'","locations":[{"ref":"scene/gui/text_edit.cpp:3541","code":" 3541 | \t\t\tset_caret_column(text[get_caret_line(i)].length());","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/gui/text_edit.cpp#L3541"}]},
{"id":"API_20","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"very_easy","description":"Type mismatch: assigning Error return value to bool variable. Lines 1212, 1372, 1452 assign the return value of try_*_track_interpolate() (which returns Error) to a bool variable named 'err'. Error is not implicitly convertible to bool in a meaningful way - OK=0 converts to false, and any error converts to true, but this is confusing and inconsistent with line 1292 which uses Error type.","fix":"Change 'bool err' to 'Error err' to match the function signature and be consistent with rotation_track_interpolate (line 1292)","locations":[{"ref":"scene/resources/animation.cpp:1212","code":" 1212 | \tbool err = try_position_track_interpolate(p_track, p_time, &ret, p_backward);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/resources/animation.cpp#L1212"},{"ref":"scene/resources/animation.cpp:1372","code":" 1372 | \tbool err = try_scale_track_interpolate(p_track, p_time, &ret, p_backward);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/resources/animation.cpp#L1372"},{"ref":"scene/resources/animation.cpp:1452","code":" 1452 | \tbool err = try_blend_shape_track_interpolate(p_track, p_time, &ret, p_backward);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/resources/animation.cpp#L1452"}]},
{"id":"API_21","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"medium","description":"Unsafe implicit cast from Ref<Material> to Ref<BaseMaterial3D> without type checking. Line 3148 assigns current_next_pass (which is Ref<Material>) to stencil_next_pass (which is Ref<BaseMaterial3D>) without verifying that current_next_pass is actually a BaseMaterial3D subclass. This can lead to incorrect behavior if a non-BaseMaterial3D Material is assigned as next_pass, since the cast happens silently without type validation.","fix":"Use cast_to to safely verify the type: stencil_next_pass = Object::cast_to<BaseMaterial3D>(current_next_pass); or use Ref<BaseMaterial3D>::cast_to() to safely perform the cast.","locations":[{"ref":"scene/resources/material.cpp:3186","code":" 3186 | \t\tstencil_next_pass = current_next_pass;","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/resources/material.cpp#L3186"}]},
{"id":"API_22","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"very_easy","description":"Incorrect parameter name in D_METHOD bind call for set_resolution. The bind declares parameter as 'min_volume_per_convex_hull' but the actual function signature has 'resolution'. This causes incorrect reflection and binding information.","fix":"Change D_METHOD(\"set_resolution\", \"min_volume_per_convex_hull\") to D_METHOD(\"set_resolution\", \"resolution\")","locations":[{"ref":"scene/resources/mesh.cpp:161","code":"  161 | \tClassDB::bind_method(D_METHOD(\"set_resolution\", \"min_volume_per_convex_hull\"), &MeshConvexDecompositionSettings::set_resolution);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/resources/mesh.cpp#L161"}]},
{"id":"API_23","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"very_easy","description":"Incorrect size parameter passed to Image constructor in portable_compressed_texture.cpp. At line 99, when loading PNG/WEBP mipmaps, the code passes 'data_size' (remaining buffer size after the 4-byte size header) instead of 'mipsize' (actual mipmap size extracted from the header at line 94). This causes the Image loader to potentially read beyond the current mipmap's boundaries into subsequent data, causing buffer overread or incorrect mipmap parsing.","fix":"Change line 99 from 'memnew(Image(data, data_size))' to 'memnew(Image(data, (int)mipsize))'. Also update line 100 similarly from 'loader_func(data, data_size)' to 'loader_func(data, (int)mipsize)'.","locations":[{"ref":"scene/resources/portable_compressed_texture.cpp:98-100","code":"   98 | \t\t\t\tRef<Image> img = loader_func == nullptr\n   99 | \t\t\t\t\t\t? memnew(Image(data, data_size))\n  100 | \t\t\t\t\t\t: Ref<Image>(loader_func(data, data_size));","lines":3,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/resources/portable_compressed_texture.cpp#L98-L100"}]},
{"id":"API_24","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"very_easy","description":"fprintf used instead of Godot logging. Line 368 in video_stream_theora.cpp uses C-style fprintf(stderr, ...) instead of Godot's ERR_PRINT macro for error logging, breaking consistency with the engine's logging infrastructure.","fix":"Replace fprintf(stderr, 'End of file while searching for codec headers.\\n'); with ERR_PRINT('End of file while searching for codec headers.');","locations":[{"ref":"modules/theora/video_stream_theora.cpp:368","code":"  368 | \t\t\t\tfprintf(stderr, \"End of file while searching for codec headers.\\n\");","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/theora/video_stream_theora.cpp#L368"}]},
{"id":"API_25","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"very_easy","description":"In java_godot_io_wrapper.cpp constructor (lines 59-60), method ID assignments are separated by commas instead of semicolons. While this compiles due to the comma operator in C++, it creates unusual and potentially confusing code where expressions are sequenced rather than individually assigned. This is poor practice and could hide bugs.","fix":"Replace the commas with semicolons on lines 59-60 to make the individual assignments clear and conventional: _get_display_cutouts = p_env->GetMethodID(cls, \"getDisplayCutouts\", \"()[I\"); and _get_display_safe_area = p_env->GetMethodID(cls, \"getDisplaySafeArea\", \"()[I\");","locations":[{"ref":"platform/android/java_godot_io_wrapper.cpp:59-60","code":"   59 | \t\t_get_display_cutouts = p_env->GetMethodID(cls, \"getDisplayCutouts\", \"()[I\"),\n   60 | \t\t_get_display_safe_area = p_env->GetMethodID(cls, \"getDisplaySafeArea\", \"()[I\"),","lines":2,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/android/java_godot_io_wrapper.cpp#L59-L60"}]},
{"id":"API_26","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"very_easy","description":"Unsafe pointer casting pattern. At line 216 in tts_android.cpp: `jobjectArray *arr = reinterpret_cast<jobjectArray *>(&voices_object);` takes address of local variable to create pointer, which is unusual and error-prone. Should directly cast jobject to jobjectArray.","fix":"Use direct cast: `jobjectArray arr = (jobjectArray)voices_object;` and remove the * dereference from subsequent array accesses.","locations":[{"ref":"platform/android/tts_android.cpp:216","code":"  216 | \t\tjobjectArray *arr = reinterpret_cast<jobjectArray *>(&voices_object);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/android/tts_android.cpp#L216"}]},
{"id":"API_27","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"very_easy","description":"In string_to_multibyte(), WideCharToMultiByte() is called with charstr.size() which includes the null terminator. This causes the null terminator to be encoded as part of the string data, which is typically not desired. The function should either pass charstr.length() (excluding null) or use -1 to enable null-termination detection.","fix":"Change 'charstr.size()' to 'charstr.length()' or use -1 with the CP_SYMBOL/CP_UTF8 flags for automatic null-termination detection. For example: 'int total_mbchars = WideCharToMultiByte(*encoding, 0, (const wchar_t *)charstr.ptr(), -1, nullptr, 0, nullptr, nullptr);'","locations":[{"ref":"platform/windows/os_windows.cpp:1232","code":" 1232 | \tint total_mbchars = WideCharToMultiByte(*encoding, 0, (const wchar_t *)charstr.ptr(), charstr.size(), nullptr, 0, nullptr, nullptr);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/windows/os_windows.cpp#L1232"}]},
{"id":"API_28","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"very_easy","description":"In install_iat_hook() at lines 2857 and 2862, VirtualProtect() is called with a hardcoded size of 8 bytes. However, the protected object is 'first_thunk->u1.Function' which is a DWORD_PTR. On 32-bit systems, this is 4 bytes, not 8. The hardcoded size assumes 64-bit pointers and may protect incorrect memory ranges or page protection on 32-bit systems.","fix":"Use 'sizeof(first_thunk->u1.Function)' instead of hardcoded 8: 'VirtualProtect((LPVOID)(&first_thunk->u1.Function), sizeof(first_thunk->u1.Function), PAGE_READWRITE, &old_protect);'","locations":[{"ref":"platform/windows/os_windows.cpp:2891","code":" 2891 | \t\t\t\t\t\tVirtualProtect((LPVOID)(&first_thunk->u1.Function), 8, PAGE_READWRITE, &old_protect);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/windows/os_windows.cpp#L2891"},{"ref":"platform/windows/os_windows.cpp:2896","code":" 2896 | \t\t\t\t\t\tVirtualProtect((LPVOID)(&first_thunk->u1.Function), 8, old_protect, nullptr);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/windows/os_windows.cpp#L2896"}]},
{"id":"API_29","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"very_easy","description":"In TextEdit::_adjust_viewport_to_caret_horizontally() at line 8939, is_caret_after_selection_origin() is called without arguments. The function signature requires an int p_caret parameter (line 6319). This will use default argument DEFVAL(0) from binding (line 7461), always checking caret 0 instead of the intended p_caret passed to _adjust_viewport_to_caret_horizontally().","fix":"Change line 8939 from 'is_caret_after_selection_origin()' to 'is_caret_after_selection_origin(p_caret)'","locations":[{"ref":"scene/gui/text_edit.cpp:9580","code":" 9580 | \t\tprioritize_end = is_caret_after_selection_origin();","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/gui/text_edit.cpp#L9580"}]},
{"id":"API_30","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"very_easy","description":"Returning literal false (bool, value 0) from a function that returns double. Lines 1983, 1995, 2007, 2019 in track_get_key_time all use ERR_FAIL_COND_V(!fetch_compressed_success, false) when the function signature requires returning double.","fix":"Replace 'false' with a valid double value like '-1.0' or use a different error handling approach. These lines should return a double, not a bool.","locations":[{"ref":"scene/resources/animation.cpp:1983","code":" 1983 | \t\t\t\tERR_FAIL_COND_V(!fetch_compressed_success, false);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/resources/animation.cpp#L1983"},{"ref":"scene/resources/animation.cpp:1995","code":" 1995 | \t\t\t\tERR_FAIL_COND_V(!fetch_compressed_success, false);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/resources/animation.cpp#L1995"},{"ref":"scene/resources/animation.cpp:2007","code":" 2007 | \t\t\t\tERR_FAIL_COND_V(!fetch_compressed_success, false);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/resources/animation.cpp#L2007"},{"ref":"scene/resources/animation.cpp:2019","code":" 2019 | \t\t\t\tERR_FAIL_COND_V(!fetch_compressed_success, false);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/resources/animation.cpp#L2019"}]},
{"id":"API_31","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"very_easy","description":"NavigationMesh::get_agent_radius() is missing const qualifier. The method reads only a member variable but is not marked const, making it inconsistent with getter pattern and preventing use in const contexts.","fix":"Change method signature from 'float NavigationMesh::get_agent_radius()' to 'float NavigationMesh::get_agent_radius() const'","locations":[{"ref":"scene/resources/navigation_mesh.cpp:181-183","code":"  181 | float NavigationMesh::get_agent_radius() {\n  182 | \treturn agent_radius;\n  183 | }","lines":3,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/resources/navigation_mesh.cpp#L181-L183"}]},
{"id":"API_32","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"very_easy","description":"In shader_rd.cpp line 853, version_set_raytracing_code() does not acquire a mutex lock before modifying version members. All other version_set_* functions (lines 815-846) use MutexLock, but this one doesn't. This can cause race conditions when raytracing shaders are being updated from multiple threads.","fix":"Add `MutexLock lock(*version->mutex);` at the start of version_set_raytracing_code() function, similar to the other version_set_* functions.","locations":[{"ref":"servers/rendering/renderer_rd/shader_rd.cpp:847-861","code":"  847 | void ShaderRD::version_set_raytracing_code(RID p_version, const HashMap<String, String> &p_code, const String &p_uniforms, const String &p_raygen_globals, const String &p_any_hit_globals, const String &p_closest_hit_globals, const String &p_miss_globals, const String &p_intersection_globals, const Vector<String> &p_custom_defines) {\n  848 | \tERR_FAIL_COND(pipeline_type != RD::PIPELINE_TYPE_RAYTRACING);\n  849 | \n  850 | \tVersion *version = version_owner.get_or_null(p_version);\n  851 | \tERR_FAIL_NULL(version);\n  852 | \n  853 | \tversion->raygen_globals = p_raygen_globals.utf8();\n  854 | \tversion->any_hit_globals = p_any_hit_globals.utf8();\n  855 | \tversion->closest_hit_globals = p_closest_hit_globals.utf8();\n  856 | \tversion->miss_globals = p_miss_globals.utf8();\n  857 | \tversion->intersection_globals = p_intersection_globals.utf8();\n  858 | \tversion->uniforms = p_uniforms.utf8();\n  859 | \n  860 | \t_version_set(version, p_code, p_custom_defines);\n  861 | }","lines":15,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/servers/rendering/renderer_rd/shader_rd.cpp#L847-L861"}]},
{"id":"API_33","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"very_easy","description":"Incorrect initialization of Variant in TextServerExtension::shaped_get_span_object(). At line 1351, a Variant is initialized to 'false' (a bool literal), when it should be initialized to an empty Variant() or left uninitialized since GDVIRTUAL_CALL will populate it. This causes improper type semantics.","fix":"Change 'Variant ret = false;' to 'Variant ret;' to allow GDVIRTUAL_CALL to properly initialize the return value without type confusion.","locations":[{"ref":"servers/text/text_server_extension.cpp:1362","code":" 1362 | \tVariant ret = false;","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/servers/text/text_server_extension.cpp#L1362"}]},
{"id":"API_34","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"Inconsistent error code checking in WASAPI audio driver. Line 472 uses 'hr == OK' to check HRESULT success, while all other error checks in the file correctly use 'hr == S_OK' or 'hr != S_OK'. While OK and S_OK both evaluate to 0, using S_OK is the correct Windows API convention for HRESULT comparisons.","fix":"Change 'if (hr == OK)' to 'if (hr == S_OK)' to be consistent with Windows API conventions and the rest of the codebase (all other 30+ HRESULT checks use S_OK).","locations":[{"ref":"drivers/wasapi/audio_driver_wasapi.cpp:472","code":"  472 | \t\t\tif (hr == OK) {","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/drivers/wasapi/audio_driver_wasapi.cpp#L472"}]},
{"id":"API_35","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"Type mismatch in function calls at lines 7447 and 7464. Both calls pass a float -1.0 as the third argument to _anim_duplicate_keys() and _anim_paste_keys(), which expect an int. The float -1.0 will be implicitly converted and truncated to int -1, which works correctly by accident, but represents incorrect typing. The intent appears to be to pass -1 (an invalid track index marker), not -1.0.","fix":"Change '_anim_duplicate_keys(-1.0, false, -1.0)' to '_anim_duplicate_keys(-1.0, false, -1)' on line 7447; change '_anim_paste_keys(-1.0, false, -1.0)' to '_anim_paste_keys(-1.0, false, -1)' on line 7464.","locations":[{"ref":"editor/animation/animation_track_editor.cpp:7478","code":" 7478 | \t\t\t_anim_duplicate_keys(-1.0, false, -1.0);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/animation/animation_track_editor.cpp#L7478"},{"ref":"editor/animation/animation_track_editor.cpp:7495","code":" 7495 | \t\t\t_anim_paste_keys(-1.0, false, -1.0);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/animation/animation_track_editor.cpp#L7495"}]},
{"id":"API_36","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"In _wl_pointer_on_frame, inconsistent use of Math::abs vs std::abs. Line 2235 uses Math::abs but line 2241 uses std::abs. Should be consistent with Godot API.","fix":"Replace std::abs on line 2241 with Math::abs to maintain consistency with Godot API patterns.","locations":[{"ref":"platform/linuxbsd/wayland/wayland_thread.cpp:2243-2249","code":" 2243 | \t\t\t\t\t\tmb->set_factor(Math::abs(pd.discrete_scroll_vector_120.y / (float)120));\n 2244 | \t\t\t\t\t}\n 2245 | \n 2246 | \t\t\t\t\tif (test_button == MouseButton::WHEEL_RIGHT || test_button == MouseButton::WHEEL_LEFT) {\n 2247 | \t\t\t\t\t\t// If this is a discrete scroll, specify how many \"clicks\" it did for this\n 2248 | \t\t\t\t\t\t// pointer frame.\n 2249 | \t\t\t\t\t\tmb->set_factor(std::abs(pd.discrete_scroll_vector_120.x / (float)120));","lines":7,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/linuxbsd/wayland/wayland_thread.cpp#L2243-L2249"}]},
{"id":"API_37","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"Method is_mouse_target_enabled() should be marked const as it only returns a member variable without modification. Missing const qualifier in both declaration and implementation.","fix":"Add const qualifier: bool is_mouse_target_enabled() const { return mouse_target; }","locations":[{"ref":"scene/gui/subviewport_container.h:68","code":"   68 | \tbool is_mouse_target_enabled();","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/gui/subviewport_container.h#L68"},{"ref":"scene/gui/subviewport_container.cpp:247-248","code":"  247 | bool SubViewportContainer::is_mouse_target_enabled() {\n  248 | \treturn mouse_target;","lines":2,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/gui/subviewport_container.cpp#L247-L248"}]},
{"id":"API_38","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"In set_theme() at line 2555, uses 'cast_to<Window>' instead of 'Object::cast_to<Window>' which is inconsistent with all other cast_to usages in the file and may fail to compile or behave unexpectedly.","fix":"Change 'Window *parent_w = cast_to<Window>(get_parent());' to 'Window *parent_w = Object::cast_to<Window>(get_parent());'","locations":[{"ref":"scene/main/window.cpp:2573","code":" 2573 | \tWindow *parent_w = cast_to<Window>(get_parent());","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/main/window.cpp#L2573"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"critical","difficulty":"medium","description":"VisualShaderNodeRemap::generate_code() performs unchecked division by __input_range on multiple lines (8336, 8341, 8346, 8351, 8356, 8361, 8366) for all op_type cases. If input_min equals input_max, the generated shader code will contain division by zero, causing undefined behavior (NaN/Inf).","fix":"Add safety check in generated code or at code generation time: if (__input_range is approximately zero) use a safe default output (e.g., output_min or clamp to reasonable range).","locations":[{"ref":"modules/visual_shader/vs_nodes/visual_shader_nodes.cpp:8245-8277","code":" 8245 | \t\t\tcode += vformat(\"\t\tfloat __input_range = %s - %s;\\n\", p_input_vars[2], p_input_vars[1]);\n 8246 | \t\t\tcode += vformat(\"\t\tfloat __output_range = %s - %s;\\n\", p_input_vars[4], p_input_vars[3]);\n 8247 | \t\t\tcode += vformat(\"\t\t%s = %s + __output_range * ((%s - %s) / __input_range);\\n\", p_output_vars[0], p_input_vars[3], p_input_vars[0], p_input_vars[1]);\n 8248 | \t\t} break;\n 8249 | \t\tcase OP_TYPE_VECTOR_2D: {\n 8250 | \t\t\tcode += vformat(\"\t\tvec2 __input_range = %s - %s;\\n\", p_input_vars[2], p_input_vars[1]);\n 8251 | \t\t\tcode += vformat(\"\t\tvec2 __output_range = %s - %s;\\n\", p_input_vars[4], p_input_vars[3]);\n 8252 | \t\t\tcode += vformat(\"\t\t%s = %s + __output_range * ((%s - %s) / __input_range);\\n\", p_output_vars[0], p_input_vars[3], p_input_vars[0], p_input_vars[1]);\n 8253 | \t\t} break;\n 8254 | \t\tcase OP_TYPE_VECTOR_2D_SCALAR: {\n 8255 | \t\t\tcode += vformat(\"\t\tvec2 __input_range = vec2(%s - %s);\\n\", p_input_vars[2], p_input_vars[1]);\n 8256 | \t\t\tcode += vformat(\"\t\tvec2 __output_range = vec2(%s - %s);\\n\", p_input_vars[4], p_input_vars[3]);\n 8257 | \t\t\tcode += vformat(\"\t\t%s = vec2(%s) + __output_range * ((%s - vec2(%s)) / __input_range);\\n\", p_output_vars[0], p_input_vars[3], p_input_vars[0], p_input_vars[1]);\n 8258 | \t\t} break;\n 8259 | \t\tcase OP_TYPE_VECTOR_3D: {\n 8260 | \t\t\tcode += vformat(\"\t\tvec3 __input_range = %s - %s;\\n\", p_input_vars[2], p_input_vars[1]);\n 8261 | \t\t\tcode += vformat(\"\t\tvec3 __output_range = %s - %s;\\n\", p_input_vars[4], p_input_vars[3]);\n 8262 | \t\t\tcode += vformat(\"\t\t%s = %s + __output_range * ((%s - %s) / __input_range);\\n\", p_output_vars[0], p_input_vars[3], p_input_vars[0], p_input_vars[1]);\n 8263 | \t\t} break;\n 8264 | \t\tcase OP_TYPE_VECTOR_3D_SCALAR: {\n 8265 | \t\t\tcode += vformat(\"\t\tvec3 __input_range = vec3(%s - %s);\\n\", p_input_vars[2], p_input_vars[1]);\n 8266 | \t\t\tcode += vformat(\"\t\tvec3 __output_range = vec3(%s - %s);\\n\", p_input_vars[4], p_input_vars[3]);\n 8267 | \t\t\tcode += vformat(\"\t\t%s = vec3(%s) + __output_range * ((%s - vec3(%s)) / __input_range);\\n\", p_output_vars[0], p_input_vars[3], p_input_vars[0], p_input_vars[1]);\n 8268 | \t\t} break;\n 8269 | \t\tcase OP_TYPE_VECTOR_4D: {\n 8270 | \t\t\tcode += vformat(\"\t\tvec4 __input_range = %s - %s;\\n\", p_input_vars[2], p_input_vars[1]);\n 8271 | \t\t\tcode += vformat(\"\t\tvec4 __output_range = %s - %s;\\n\", p_input_vars[4], p_input_vars[3]);\n 8272 | \t\t\tcode += vformat(\"\t\t%s = %s + __output_range * ((%s - %s) / __input_range);\\n\", p_output_vars[0], p_input_vars[3], p_input_vars[0], p_input_vars[1]);\n 8273 | \t\t} break;\n 8274 | \t\tcase OP_TYPE_VECTOR_4D_SCALAR: {\n 8275 | \t\t\tcode += vformat(\"\t\tvec4 __input_range = vec4(%s - %s);\\n\", p_input_vars[2], p_input_vars[1]);\n 8276 | \t\t\tcode += vformat(\"\t\tvec4 __output_range = vec4(%s - %s);\\n\", p_input_vars[4], p_input_vars[3]);\n 8277 | \t\t\tcode += vformat(\"\t\t%s = vec4(%s) + __output_range * ((%s - vec4(%s)) / __input_range);\\n\", p_output_vars[0], p_input_vars[3], p_input_vars[0], p_input_vars[1]);","lines":33,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/visual_shader/vs_nodes/visual_shader_nodes.cpp#L8245-L8277"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"medium","difficulty":"very_easy","description":"EditorNode3DGizmo::add_vertices() accumulates max distance in loop but always assigns instead of comparing. Line 319: `md = MAX(0, p_vertices[i].length())` should accumulate the maximum over all iterations, but it overwrites md each iteration instead of finding the max. This results in incorrect AABB size calculation.","fix":"Change `md = MAX(0, p_vertices[i].length())` to `md = MAX(md, p_vertices[i].length())` to properly accumulate the maximum value.","locations":[{"ref":"editor/scene/3d/node_3d_editor_gizmos.cpp:319-321","code":"  319 | \t\tfor (int i = 0; i < p_vertices.size(); i++) {\n  320 | \t\t\tmd = MAX(0, p_vertices[i].length());\n  321 | \t\t}","lines":3,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/scene/3d/node_3d_editor_gizmos.cpp#L319-L321"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"medium","difficulty":"very_easy","description":"EditorNode3DGizmo::add_handles() has the same AABB calculation bug as add_vertices(). Line 452 accumulates max distance incorrectly with `md = MAX(0, p_handles[i].length())` instead of `md = MAX(md, p_handles[i].length())`.","fix":"Change `md = MAX(0, p_handles[i].length())` to `md = MAX(md, p_handles[i].length())`.","locations":[{"ref":"editor/scene/3d/node_3d_editor_gizmos.cpp:452-454","code":"  452 | \t\tfor (int i = 0; i < p_handles.size(); i++) {\n  453 | \t\t\tmd = MAX(0, p_handles[i].length());\n  454 | \t\t}","lines":3,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/scene/3d/node_3d_editor_gizmos.cpp#L452-L454"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"Inefficient string replacement in loop in get_csharp_project_name(). Lines 244-246 call string.replace() inside a for loop for each invalid character (13 iterations). Each replace() likely creates a new string, making this O(n*m). Should be optimized to a single pass.","fix":"Batch operations: iterate through the string once and build result, replacing all invalid chars in a single pass, or use an accumulator to avoid repeated string allocations.","locations":[{"ref":"modules/mono/utils/path_utils.cpp:244-246","code":"  244 | \t\tfor (int i = 0; i < invalid_chars.size(); i++) {\n  245 | \t\t\tname = name.replace(invalid_chars[i], \"-\");\n  246 | \t\t}","lines":3,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/mono/utils/path_utils.cpp#L244-L246"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"In _verify_synchronizer() at line 692, the bitwise OR with 0x80000000 is applied twice. Line 691 sets r_net_id = path_id | 0x80000000, and then line 692 sets the high bit again via p_sync->set_net_id(r_net_id | 0x80000000). The second operation is redundant since the bit is already set. While this doesn't break functionality, it's wasteful and suggests copy-paste error or incomplete refactoring.","fix":"Remove the redundant bitwise OR from line 692: p_sync->set_net_id(r_net_id);","locations":[{"ref":"modules/multiplayer/scene_replication_interface.cpp:691-692","code":"  691 | \t\t\tr_net_id = path_id | 0x80000000;\n  692 | \t\t\tp_sync->set_net_id(r_net_id | 0x80000000);","lines":2,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/multiplayer/scene_replication_interface.cpp#L691-L692"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"ConvexPolygonShape2D::get_enclosing_radius() calls get_points() twice per iteration instead of caching it once. The 3D version (ConvexPolygonShape3D) and the 2D concave version (ConcavePolygonShape2D) both cache the result in a local variable before looping, which is more efficient.","fix":"Cache the points array: `Vector<Vector2> points = get_points(); const Vector2 *read = points.ptr(); for (int i = 0; i < points.size(); i++) { r = MAX(read[i].length_squared(), r); }`","locations":[{"ref":"scene/resources/2d/convex_polygon_shape_2d.cpp:134-139","code":"  134 | real_t ConvexPolygonShape2D::get_enclosing_radius() const {\n  135 | \treal_t r = 0.0;\n  136 | \tfor (int i(0); i < get_points().size(); i++) {\n  137 | \t\tr = MAX(get_points()[i].length_squared(), r);\n  138 | \t}\n  139 | \treturn Math::sqrt(r);","lines":6,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/resources/2d/convex_polygon_shape_2d.cpp#L134-L139"}]},

{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"high","difficulty":"medium","description":"At line 567 in text_edit.cpp, there is an ERR_FAIL_COND check in remove_range() after removing lines. The comment says 'BUG', suggesting the developer flagged this as problematic. The check occurs after decrementing total_visible_line_count and may incorrectly fail if hidden lines are removed, since total_visible_line_count only tracks non-hidden lines but the diff calculation removes all lines.","fix":"The logic should ensure that when removing lines, the calculation properly accounts for only visible lines being decremented. The BUG comment suggests the developer recognized this as a potential issue needing investigation.","locations":[{"ref":"scene/gui/text_edit.cpp:578","code":"  578 | \tERR_FAIL_COND(total_visible_line_count < 0); // BUG","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/scene/gui/text_edit.cpp#L578"}]},

{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"medium","difficulty":"very_easy","description":"Semantically incorrect field names used on Point2i objects. In FindReplaceBar::_replace() and _replace_all(), selection_begin and selection_end (which store line, column pairs) use .width/.height accessors instead of .x/.y. While this technically works due to aliasing in Godot's Point2i implementation, it's semantically wrong and confusing—Point2i is designed for coordinates, not dimensions. The code should use .x/.y consistently.","fix":"Replace .width with .x and .height with .y in all four locations. This maintains semantic correctness and consistency with other uses of selection_begin/selection_end throughout the same functions (e.g., line 291).","locations":[{"ref":"editor/gui/code_editor.cpp:265-266","code":"  265 | \t\ttext_editor->set_caret_line(selection_begin.width, false, true, -1, 0);\n  266 | \t\ttext_editor->set_caret_column(selection_begin.height, true, 0);","lines":2,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/gui/code_editor.cpp#L265-L266"},{"ref":"editor/gui/code_editor.cpp:333-334","code":"  333 | \t\ttext_editor->set_caret_line(selection_begin.width, false, true, -1, 0);\n  334 | \t\ttext_editor->set_caret_column(selection_begin.height, true, 0);","lines":2,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/gui/code_editor.cpp#L333-L334"}]},
