{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"Incorrect error message format in script reload error handling. Line 711 incorrectly includes error_names[err] in the message context where err refers to a previous ResourceLoader operation, not the current null script check. The message text says 'Not a script!' but then appends an unrelated error code, which is misleading and incorrect.","fix":"Remove error_names[err] from the vformat call: ERR_CONTINUE_MSG(script.is_null(), vformat(\"Could not reload script '%s': Not a script!\", path));","locations":[{"ref":"core/debugger/remote_debugger.cpp:711","code":"  711 | \t\t\t\tERR_CONTINUE_MSG(script.is_null(), vformat(\"Could not reload script '%s': Not a script!\", path, error_names[err]));","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/core/debugger/remote_debugger.cpp#L711"}]},
{"id":"CPY_5","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"Copy-paste bug in operator Vector2i(). Four branches (lines 1769, 1771, 1773, 1775) return Vector2() instead of Vector2i(). This causes implicit type conversion where int vectors are incorrectly returned as float vectors. The function signature is 'operator Vector2i()' but returns Vector2 in the fallback cases for VECTOR3, VECTOR3I, VECTOR4, and VECTOR4I types.","fix":"Change all occurrences of 'Vector2(' to 'Vector2i(' in lines 1769, 1771, 1773, 1775. For example, line 1769: 'return Vector2(reinterpret_cast<const Vector3 *>(_data._mem)->x, reinterpret_cast<const Vector3 *>(_data._mem)->y);' should be 'return Vector2i(reinterpret_cast<const Vector3 *>(_data._mem)->x, reinterpret_cast<const Vector3 *>(_data._mem)->y);'","locations":[{"ref":"core/variant/variant.cpp:1795-1811","code":" 1795 | Variant::operator Vector2i() const {\n 1796 | \tif (type == VECTOR2I) {\n 1797 | \t\treturn *reinterpret_cast<const Vector2i *>(_data._mem);\n 1798 | \t} else if (type == VECTOR2) {\n 1799 | \t\treturn *reinterpret_cast<const Vector2 *>(_data._mem);\n 1800 | \t} else if (type == VECTOR3) {\n 1801 | \t\treturn Vector2(reinterpret_cast<const Vector3 *>(_data._mem)->x, reinterpret_cast<const Vector3 *>(_data._mem)->y);\n 1802 | \t} else if (type == VECTOR3I) {\n 1803 | \t\treturn Vector2(reinterpret_cast<const Vector3i *>(_data._mem)->x, reinterpret_cast<const Vector3i *>(_data._mem)->y);\n 1804 | \t} else if (type == VECTOR4) {\n 1805 | \t\treturn Vector2(reinterpret_cast<const Vector4 *>(_data._mem)->x, reinterpret_cast<const Vector4 *>(_data._mem)->y);\n 1806 | \t} else if (type == VECTOR4I) {\n 1807 | \t\treturn Vector2(reinterpret_cast<const Vector4i *>(_data._mem)->x, reinterpret_cast<const Vector4i *>(_data._mem)->y);\n 1808 | \t} else {\n 1809 | \t\treturn Vector2i();\n 1810 | \t}\n 1811 | }","lines":17,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/core/variant/variant.cpp#L1795-L1811"}]},
{"id":"CPY_6","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"Duplicate buffer deletion in destructor. Lines 2906-2907 delete data.canvas_quad_vertices and data.canvas_quad_array, then lines 2909-2910 immediately repeat the same deletion. This will attempt to delete already-freed resources, causing undefined behavior.","fix":"Remove the duplicate deletion at lines 2909-2910. These should likely be deletion of particle_quad_vertices and particle_quad_array instead, or should simply be removed.","locations":[{"ref":"drivers/gles3/rasterizer_canvas_gles3.cpp:2906-2910","code":" 2906 | \tglDeleteBuffers(1, &data.canvas_quad_vertices);\n 2907 | \tglDeleteVertexArrays(1, &data.canvas_quad_array);\n 2908 | \n 2909 | \tglDeleteBuffers(1, &data.canvas_quad_vertices);\n 2910 | \tglDeleteVertexArrays(1, &data.canvas_quad_array);","lines":5,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/drivers/gles3/rasterizer_canvas_gles3.cpp#L2906-L2910"}]},
{"id":"CPY_7","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"medium","description":"Wrong image format conversion for RGBA16 fallback - converts to RGH (2-channel half-float) instead of RGBAH (4-channel half-float). This causes data loss when RGBA16 textures cannot be supported and must fall back to half-float format.","fix":"Change lines 685-687 from:\n  p_image->convert(Image::FORMAT_RGH);\n  r_real_format = Image::FORMAT_RGH;\nto:\n  p_image->convert(Image::FORMAT_RGBAH);\n  r_real_format = Image::FORMAT_RGBAH;\nThe alpha channel must be preserved for proper RGBA16 fallback behavior.","locations":[{"ref":"drivers/gles3/storage/texture_storage.cpp:697-699","code":"  697 | \t\t\t\t\t\tp_image->convert(Image::FORMAT_RGH);\n  698 | \t\t\t\t\t}\n  699 | \t\t\t\t\tr_real_format = Image::FORMAT_RGH;","lines":3,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/drivers/gles3/storage/texture_storage.cpp#L697-L699"}]},
{"id":"CPY_8","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"In uniform_set_create(), for UNIFORM_TYPE_ACCELERATION_STRUCTURE case, the code uses vk_writes[i] instead of vk_writes[writes_amount] when setting descriptorType and pNext. This corrupts the writes array by writing to the wrong index, potentially overwriting data from other uniform types and causing descriptor set updates to fail or use incorrect data.","fix":"Change vk_writes[i] to vk_writes[writes_amount] on lines 4873-4874 to match the pattern used throughout the rest of the switch statement.","locations":[{"ref":"drivers/vulkan/rendering_device_driver_vulkan.cpp:4934-4935","code":" 4934 | \t\t\t\tvk_writes[i].descriptorType = VK_DESCRIPTOR_TYPE_ACCELERATION_STRUCTURE_KHR;\n 4935 | \t\t\t\tvk_writes[i].pNext = acceleration_structure_write;","lines":2,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/drivers/vulkan/rendering_device_driver_vulkan.cpp#L4934-L4935"}]},
{"id":"CPY_9","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"In _cleanup_animation(), when handling audio track trimming, the code uses the member variable 'animation->' instead of the parameter 'p_animation->' in three places (lines 7824-7825, 7829). This causes the wrong animation object to be accessed, leading to incorrect audio key manipulation. The code should use p_animation instead of animation for consistency with the parameter passed to the function.","fix":"Change 'animation->audio_track_get_key_stream(i, j)' to 'p_animation->audio_track_get_key_stream(i, j)' on line 7824; change 'animation->audio_track_get_key_start_offset(i, j)' to 'p_animation->audio_track_get_key_start_offset(i, j)' on line 7825; change 'animation->track_get_key_time(i, j)' to 'p_animation->track_get_key_time(i, j)' on line 7829.","locations":[{"ref":"editor/animation/animation_track_editor.cpp:7864-7865","code":" 7864 | \t\t\t\t\t\tRef<AudioStream> stream = animation->audio_track_get_key_stream(i, j);\n 7865 | \t\t\t\t\t\tdouble len = stream->get_length() - animation->audio_track_get_key_start_offset(i, j);","lines":2,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/animation/animation_track_editor.cpp#L7864-L7865"},{"ref":"editor/animation/animation_track_editor.cpp:7869","code":" 7869 | \t\t\t\t\t\tdouble prev_time = animation->track_get_key_time(i, j);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/animation/animation_track_editor.cpp#L7869"}]},
{"id":"CPY_10","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"Copy-paste bug at line 1649. The X and Y offsets both use title_bar->get_global_position().y. Should use .x for the first parameter of Vector2i. This causes incorrect window button offset positioning.","fix":"Change first parameter from 'title_bar->get_global_position().y' to 'title_bar->get_global_position().x': Vector2i(title_bar->get_global_position().x + title_bar->get_size().y / 2, title_bar->get_global_position().y + title_bar->get_size().y / 2)","locations":[{"ref":"editor/editor_node.cpp:1695","code":" 1695 | \tDisplayServer::get_singleton()->window_set_window_buttons_offset(Vector2i(title_bar->get_global_position().y + title_bar->get_size().y / 2, title_bar->get_global_position().y + title_bar->get_size().y / 2), DisplayServerEnums::MAIN_WINDOW_ID);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/editor_node.cpp#L1695"}]},
{"id":"CPY_11","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"Copy-paste bug in hash calculation for scene customization. Line 1468 updates custom_resources_hash instead of custom_scene_hash when processing customize_scenes plugins. This causes the custom_scene_hash to be initialized with only the configuration hash, missing the plugin name hash that should be part of it.","fix":"Change line 1468 from 'custom_resources_hash = hash_murmur3_one_64(export_plugins[i]->get_name().hash64(), custom_resources_hash);' to 'custom_scene_hash = hash_murmur3_one_64(export_plugins[i]->get_name().hash64(), custom_scene_hash);'","locations":[{"ref":"editor/export/editor_export_platform.cpp:1424","code":" 1424 | \t\t\tcustom_resources_hash = hash_murmur3_one_64(export_plugins[i]->get_name().hash64(), custom_resources_hash);","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/editor/export/editor_export_platform.cpp#L1424"}]},
{"id":"CPY_12","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"In write_type_adjust() function, Variant::VECTOR4 case incorrectly appends OPCODE_TYPE_ADJUST_VECTOR3 instead of OPCODE_TYPE_ADJUST_VECTOR4. Similarly, Variant::VECTOR4I case incorrectly appends OPCODE_TYPE_ADJUST_VECTOR3I instead of OPCODE_TYPE_ADJUST_VECTOR4I. This causes Vector4 and Vector4i values to be adjusted with the wrong type opcode, leading to incorrect type conversions and potentially data corruption.","fix":"Line 470: change 'OPCODE_TYPE_ADJUST_VECTOR3' to 'OPCODE_TYPE_ADJUST_VECTOR4'; Line 473: change 'OPCODE_TYPE_ADJUST_VECTOR3I' to 'OPCODE_TYPE_ADJUST_VECTOR4I'","locations":[{"ref":"modules/gdscript/gdscript_byte_codegen.cpp:469-474","code":"  469 | \t\tcase Variant::VECTOR4:\n  470 | \t\t\tappend_opcode(GDScriptFunction::OPCODE_TYPE_ADJUST_VECTOR3);\n  471 | \t\t\tbreak;\n  472 | \t\tcase Variant::VECTOR4I:\n  473 | \t\t\tappend_opcode(GDScriptFunction::OPCODE_TYPE_ADJUST_VECTOR3I);\n  474 | \t\t\tbreak;","lines":6,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/gdscript/gdscript_byte_codegen.cpp#L469-L474"}]},
{"id":"CPY_13","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"Certificate chain iteration bug in X509CertificateMbedTLS::save(): The loop iterates over 'crt' but always uses 'cert.raw.p' and 'cert.raw.len' instead of 'crt->raw.p' and 'crt->raw.len'. This causes only the first certificate to be written repeatedly instead of iterating through the chain.","fix":"Change line 196 from 'cert.raw.p, cert.raw.len' to 'crt->raw.p, crt->raw.len'","locations":[{"ref":"modules/mbedtls/crypto_mbedtls.cpp:282-299","code":"  282 | Error X509CertificateMbedTLS::save(const String &p_path) {\n  283 | \tRef<FileAccess> f = FileAccess::open(p_path, FileAccess::WRITE);\n  284 | \tERR_FAIL_COND_V_MSG(f.is_null(), ERR_INVALID_PARAMETER, vformat(\"Cannot save X509CertificateMbedTLS file '%s'.\", p_path));\n  285 | \n  286 | \tmbedtls_x509_crt *crt = &cert;\n  287 | \twhile (crt) {\n  288 | \t\tunsigned char w[4096];\n  289 | \t\tsize_t wrote = 0;\n  290 | \t\tint ret = mbedtls_pem_write_buffer(PEM_BEGIN_CRT, PEM_END_CRT, cert.raw.p, cert.raw.len, w, sizeof(w), &wrote);\n  291 | \t\tif (ret != 0 || wrote == 0) {\n  292 | \t\t\tERR_FAIL_V_MSG(FAILED, \"Error writing certificate '\" + itos(ret) + \"'.\");\n  293 | \t\t}\n  294 | \n  295 | \t\tf->store_buffer(w, wrote - 1); // don't write the string terminator\n  296 | \t\tcrt = crt->next;\n  297 | \t}\n  298 | \treturn OK;\n  299 | }","lines":18,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/mbedtls/crypto_mbedtls.cpp#L282-L299"}]},
{"id":"CPY_14","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"In nav_agent_3d.cpp get_avoidance_data(), the time_horizon_obstacles for 3D avoidance is hardcoded to 0.0 instead of using the actual rvo_agent_3d.timeHorizonObst_ value, while the 2D version correctly uses rvo_agent_2d.timeHorizonObst_. This causes incorrect debug data to be returned for 3D agents.","fix":"Change `_avoidance_data[\"time_horizon_obstacles\"] = 0.0;` to `_avoidance_data[\"time_horizon_obstacles\"] = float(rvo_agent_3d.timeHorizonObst_);`","locations":[{"ref":"modules/navigation_3d/nav_agent_3d.cpp:363","code":"  363 | \t\t_avoidance_data[\"time_horizon_obstacles\"] = 0.0;","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/modules/navigation_3d/nav_agent_3d.cpp#L363"}]},
{"id":"CPY_15","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"medium","description":"In _wl_registry_on_global_remove, lines 1106-1108 handle removal of wp_pointer_constraints but incorrectly destroy wp_relative_pointer instead. The block should destroy wp_pointer_constraints or related pointer constraint objects, not wp_relative_pointer which is already handled in its own removal block at lines 1071-1091.","fix":"Verify the intended behavior: should probably destroy wp_locked_pointer and wp_confined_pointer constraints, not wp_relative_pointer which has its own manager.","locations":[{"ref":"platform/linuxbsd/wayland/wayland_thread.cpp:1105-1108","code":" 1105 | \t\t\tif (ss->wp_relative_pointer) {\n 1106 | \t\t\t\tzwp_relative_pointer_v1_destroy(ss->wp_relative_pointer);\n 1107 | \t\t\t\tss->wp_relative_pointer = nullptr;\n 1108 | \t\t\t}","lines":4,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/linuxbsd/wayland/wayland_thread.cpp#L1105-L1108"}]},
{"id":"CPY_16","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"In screen_get_usable_rect at lines 1571-1576, the code checks 'right_rect.size.y' instead of 'bottom_rect.size.y' when validating bottom strut rectangle. This copy-paste error causes incorrect workarea calculations when a bottom panel exists, as the condition evaluates the wrong rectangle's height.","fix":"Change condition from 'if (intersection.has_area() && right_rect.size.y < rect.size.y)' to 'if (intersection.has_area() && bottom_rect.size.y < rect.size.y)'","locations":[{"ref":"platform/linuxbsd/x11/display_server_x11.cpp:1573","code":" 1573 | \t\t\t\t\t\t\t\t\tif (intersection.has_area() && right_rect.size.y < rect.size.y) {","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/linuxbsd/x11/display_server_x11.cpp#L1573"}]},
{"id":"CPY_17","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"Scancode mappings are inconsistent between key_mapping_x11.cpp and key_mapping_xkb.cpp. Four scancode-to-Key mappings have been swapped or incorrectly substituted. Scancode 0x22 maps to BRACKETLEFT in X11 but BRACELEFT in XKB (should be consistent). Similarly, 0x23, 0x31, and 0x5E have mismatched mappings. This will cause Wayland/XKB systems to report incorrect keys for these scancodes, breaking keyboard input for bracket and section keys.","fix":"Align the scancode_map values in key_mapping_xkb.cpp with key_mapping_x11.cpp. Change line 226-227 from BRACELEFT/BRACERIGHT to BRACKETLEFT/BRACKETRIGHT. Change line 241 from SECTION to QUOTELEFT. Change line 286 from QUOTELEFT to SECTION. Both files map hardware scancodes which are identical across X11 and Wayland, so values must match.","locations":[{"ref":"platform/linuxbsd/x11/key_mapping_x11.cpp:220-221","code":"  220 | \tscancode_map[0x22] = Key::BRACKETLEFT;\n  221 | \tscancode_map[0x23] = Key::BRACKETRIGHT;","lines":2,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/linuxbsd/x11/key_mapping_x11.cpp#L220-L221"},{"ref":"platform/linuxbsd/wayland/key_mapping_xkb.cpp:226-227","code":"  226 | \tscancode_map[0x22] = Key::BRACELEFT;\n  227 | \tscancode_map[0x23] = Key::BRACERIGHT;","lines":2,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/linuxbsd/wayland/key_mapping_xkb.cpp#L226-L227"},{"ref":"platform/linuxbsd/x11/key_mapping_x11.cpp:235","code":"  235 | \tscancode_map[0x31] = Key::QUOTELEFT;","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/linuxbsd/x11/key_mapping_x11.cpp#L235"},{"ref":"platform/linuxbsd/wayland/key_mapping_xkb.cpp:241","code":"  241 | \tscancode_map[0x31] = Key::SECTION;","lines":1,"link":"https://github.com/godotengine/go {"id":"CPY_18","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"Line 94: Wrong environment variable constant passed. The second call to get_or_env should use ENV_MAC_CODESIGN_CERT_PASS instead of ENV_MAC_CODESIGN_CERT_FILE. This causes the certificate password to read from the wrong environment variable (GODOT_MACOS_CODESIGN_CERTIFICATE_FILE instead of GODOT_MACOS_CODESIGN_CERTIFICATE_PASSWORD), potentially leading to code signing failures when users set certificate password via environment variable.","fix":"Change the second ENV_MAC_CODESIGN_CERT_FILE to ENV_MAC_CODESIGN_CERT_PASS on line 94. The line should read: ad_hoc = p_preset->get_or_env(\"codesign/certificate_file\", ENV_MAC_CODESIGN_CERT_FILE).operator String().is_empty() || p_preset->get_or_env(\"codesign/certificate_password\", ENV_MAC_CODESIGN_CERT_PASS).operator String().is_empty();","locations":[{"ref":"platform/macos/export/export_plugin.cpp:94","code":"   94 | \t\t\t\tad_hoc = p_preset->get_or_env(\"codesign/certificate_file\", ENV_MAC_CODESIGN_CERT_FILE).operator String().is_empty() || p_preset->get_or_env(\"codesign/certificate_password\", ENV_MAC_CODESIGN_CERT_FILE).operator String().is_empty();","lines":1,"link":"https://github.com/godotengine/godot/blob/9552dfb6859a1aaba1e570b8e0ef5c599b830f19/platform/macos/export/export_plugin.cpp#L94"}]},
