{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"set_compose computes the new preedit range as `start..start + text.len()` without checking that `start` is a valid char boundary in all paths. When not already composing and the selection is non-collapsed, `start = self.editor.selection.text_range().start`, which is a cursor index and is a char boundary. However the bigger risk is that `start + text.len()` and the subsequent `cursor_at(start + cursor.0)` / `cursor_at(start + cursor.1)` can land on non-char-boundary or out-of-range indices because `cursor` byte offsets come from the IME and are only debug_asserted (`cursor.1 <= text.len()`) - in release builds an IME supplying a cursor offset that is not on a char boundary of `text`, or `cursor.0 > text.len()`, will produce indices that are not char boundaries. cursor_at -> Cursor::from_byte_index tolerates out-of-range (clamps to text_len) but a mid-char index will snap via Cluster::from_byte_index; this is at least a correctness hazard and the asserts give a false sense of validation.","fix":"Validate IME-provided cursor offsets at runtime (not just debug_assert): clamp each to `text.len()` and round to the nearest char boundary of `text` before adding to `start`, and reject/clamp if not on a boundary.","locations":[{"ref":"parley/src/editing/editor.rs:358-391","code":"  358 |     pub fn set_compose(&mut self, text: &str, cursor: Option<(usize, usize)>) {\n  359 |         debug_assert!(!text.is_empty());\n  360 |         debug_assert!(cursor.map(|cursor| cursor.1 <= text.len()).unwrap_or(true));\n  361 | \n  362 |         let start = if let Some(preedit_range) = &self.editor.compose {\n  363 |             self.editor\n  364 |                 .buffer\n  365 |                 .replace_range(preedit_range.clone(), text);\n  366 |             preedit_range.start\n  367 |         } else {\n  368 |             if self.editor.selection.is_collapsed() {\n  369 |                 self.editor\n  370 |                     .buffer\n  371 |                     .insert_str(self.editor.selection.text_range().start, text);\n  372 |             } else {\n  373 |                 self.editor\n  374 |                     .buffer\n  375 |                     .replace_range(self.editor.selection.text_range(), text);\n  376 |             }\n  377 |             self.editor.selection.text_range().start\n  378 |         };\n  379 |         self.editor.compose = Some(start..start + text.len());\n  380 |         self.editor.show_cursor = cursor.is_some();\n  381 |         self.update_layout();\n  382 | \n  383 |         // Select the location indicated by the IME. If `cursor` is none, collapse the selection to\n  384 |         // a caret at the start of the preedit text. As `self.editor.show_cursor` is `false`, it\n  385 |         // won't show up.\n  386 |         let cursor = cursor.unwrap_or((0, 0));\n  387 |         self.editor.set_selection(Selection::new(\n  388 |             self.editor.cursor_at(start + cursor.0),\n  389 |             self.editor.cursor_at(start + cursor.1),\n  390 |         ));\n  391 |     }","lines":34,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/parley/src/editing/editor.rs#L358-L391"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"WordBreakSegmentIter advances `self.char_indices` with `.next().unwrap()` while scanning to a style boundary (`while self.current_char.0 < style_start_index { ... self.char_indices.next().unwrap() }`). This assumes every `style_run.range.start` lands on a char boundary at or before text end. If style run ranges are ever inconsistent with the text (e.g. a range.start beyond the last char, or not on a char boundary), this unwraps `None` and panics. `new()` similarly unwraps the first `char_indices.next()`.","fix":"These rely on invariants established by the style builders; add a debug assertion documenting the invariant, and consider returning/handling `None` gracefully (break out and emit the remaining substring) rather than panicking, since the input ultimately derives from user style ranges.","locations":[{"ref":"parley_engine/src/analysis.rs:417-420","code":"  417 |                 while self.current_char.0 < style_start_index {\n  418 |                     prev_char_index = self.current_char;\n  419 |                     self.current_char = self.char_indices.next().unwrap();\n  420 |                 }","lines":4,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/parley_engine/src/analysis.rs#L417-L420"},{"ref":"parley_engine/src/analysis.rs:384-385","code":"  384 |             let mut char_indices = text.char_indices();\n  385 |             let current_char_len = char_indices.next().unwrap();","lines":2,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/parley_engine/src/analysis.rs#L384-L385"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In the bidi N0 bracket-pair rule, an opening bracket's mirroring glyph is unwrapped unconditionally: `bracket_stack.push(i, bracket.mirroring_glyph.unwrap())`. The code only checks `paired_bracket_type == Open`, but does not guarantee that `mirroring_glyph` is `Some`. If ICU ever reports a paired-bracket-type of Open without a mirroring glyph (or for any future data inconsistency), this panics inside the hot bidi resolution path on attacker-supplied text.","fix":"Use `if let Some(mirror) = bracket.mirroring_glyph { bracket_stack.push(i, mirror); }` (or `let Some(..) else { continue; }`) instead of `.unwrap()`, so malformed/unexpected bracket data is skipped rather than panicking.","locations":[{"ref":"parley_engine/src/bidi.rs:510-516","code":"  510 |                     match bracket.paired_bracket_type {\n  511 |                         BidiPairedBracketType::Open => {\n  512 |                             if bracket_stack.depth == MAX_BRACKET_STACK {\n  513 |                                 break;\n  514 |                             }\n  515 |                             bracket_stack.push(i, bracket.mirroring_glyph.unwrap());\n  516 |                         }","lines":7,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/parley_engine/src/bidi.rs#L510-L516"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`enclosing_char_span` contains `unreachable!()` if the backward scan reaches index 0 without finding a char boundary. This is reached only via a `TextStorage` implementor whose `is_char_boundary` is inconsistent (reports a non-boundary index but reports index 0 as a non-boundary too). Because `TextStorage` is a public, user-implementable trait, a buggy or adversarial impl turns a validation error into a hard panic inside error construction.","fix":"Replace the `unreachable!()` with a graceful fallback: break out of the loop (or return `Some((0, index))`/`None`) when `s == 0`, so a misbehaving `TextStorage` yields a best-effort `BoundaryInfo` rather than panicking.","locations":[{"ref":"attributed_text/src/error.rs:195-207","code":"  195 |     let mut s = index;\n  196 |     for _ in 0..4 {\n  197 |         // We can never wrap around `0` here, as when `s == 0` before the decrement,\n  198 |         // the previous call to `text.is_char_boundary` (either in this loop or above)\n  199 |         // will have returned `true`.\n  200 |         if s == 0 {\n  201 |             unreachable!(\"`s` should never reach 0 before finding a char boundary\");\n  202 |         }\n  203 |         s -= 1;\n  204 |         if text.is_char_boundary(s) {\n  205 |             break;\n  206 |         }\n  207 |     }","lines":13,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/attributed_text/src/error.rs#L195-L207"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"to_access_position unwraps `layout_access.span_paths_by_cluster_path.get(&path)` directly. Every other map lookup in this function uses `?` to return None on a miss; this lone `.unwrap()` will panic if the cluster path is not present in the accessibility map (e.g. a stale LayoutAccessibility relative to the layout, or a path produced for a phantom/edge cluster).","fix":"Replace `.unwrap()` with `?` to gracefully return None, consistent with the surrounding lookups.","locations":[{"ref":"parley/src/editing/cursor.rs:443-447","code":"  443 |             let span_path = layout_access.span_paths_by_cluster_path.get(&path).unwrap();\n  444 |             (\n  445 |                 *span_path,\n  446 |                 path.logical_index() - span_path.logical_index() + offset,\n  447 |             )","lines":5,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/parley/src/editing/cursor.rs#L443-L447"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`finish_line` accesses `self.lines.lines[idx - 1]` (line 901) and indexes `self.lines.lines[line_idx]` (903) directly. It is called from `start_new_line` with `self.lines.lines.len() - 1`, which underflows/panics if `commit_line` did not push a line. `commit_line` always pushes, so it is safe today, but the direct indexing is fragile relative to the unwrap on `last_line_data` (line 365) which already assumes a line exists.","fix":"Since the invariant is that commit_line always pushes, add a debug_assert documenting it, or return early/Option to make the dependency explicit.","locations":[{"ref":"parley/src/layout/line_break.rs:1162-1167","code":" 1162 |     fn finish_line(&mut self, line_idx: usize, line_height: f32) {\n 1163 |         let prev_line_metrics = match line_idx {\n 1164 |             0 => None,\n 1165 |             idx => Some(self.lines.lines[idx - 1].metrics),\n 1166 |         };\n 1167 |         let line = &mut self.lines.lines[line_idx];","lines":6,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/parley/src/layout/line_break.rs#L1162-L1167"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`FontInfo::synthesis` casts an oblique angle to `i8` via `synth.skew = degrees as i8`. `degrees` comes from font data / `FontStyle::Oblique(angle)` and is an unclamped `f32`. An out-of-range or NaN angle truncates/saturates unexpectedly (e.g. 200.0 -> -56, NaN -> 0), producing a wrong faux-oblique skew. The italic branch hardcodes 14 which is safe, but the oblique branch does not clamp.","fix":"Clamp the angle before casting, e.g. `synth.skew = degrees.clamp(-90.0, 90.0) as i8;` and handle NaN explicitly.","locations":[{"ref":"fontique/src/font.rs:130-141","code":"  130 |                 FontStyle::Oblique(angle) => {\n  131 |                     if self.style == FontStyle::Normal {\n  132 |                         let degrees = angle.unwrap_or(14.0);\n  133 |                         if self.has_slant_axis() {\n  134 |                             synth.vars[len] = (Tag::new(b\"slnt\"), degrees);\n  135 |                             len += 1;\n  136 |                         } else if self.has_italic_axis() && degrees > 0. {\n  137 |                             synth.vars[len] = (Tag::new(b\"ital\"), 1.0);\n  138 |                             len += 1;\n  139 |                         } else {\n  140 |                             synth.skew = degrees as i8;\n  141 |                         }","lines":12,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/fontique/src/font.rs#L130-L141"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`FontWeight::from_fontconfig` divides by `fc_b - fc_a` during linear interpolation. The first two MAP entries are `(0,0)` and `(100,0)`, both with fontconfig value 0. For a negative `weight` input the loop enters the `weight < fc_b` branch at i=1 with fc_a=0, fc_b=0, yielding a division by zero (`t` becomes +/-inf or NaN) and a garbage `FontWeight`. Fontconfig FC_WEIGHT values are read from font/config data and are not validated to be non-negative.","fix":"Guard against `fc_b == fc_a` (skip/clamp), or clamp `weight` to `>= 0` before interpolation.","locations":[{"ref":"fontique/src/impl_fontconfig.rs:50-69","code":"   50 |         for i in 1..MAP.len() {\n   51 |             let (ot_b, fc_b) = MAP[i];\n   52 |             if weight == fc_b {\n   53 |                 return Self::new(ot_b as f32);\n   54 |             }\n   55 | \n   56 |             // Linear interpolation if not an exact match.\n   57 |             if weight < fc_b {\n   58 |                 let weight = weight as f32;\n   59 |                 let fc_b = fc_b as f32;\n   60 |                 let ot_b = ot_b as f32;\n   61 | \n   62 |                 let (ot_a, fc_a) = MAP[i - 1];\n   63 |                 let fc_a = fc_a as f32;\n   64 |                 let ot_a = ot_a as f32;\n   65 | \n   66 |                 let t = (weight - fc_a) / (fc_b - fc_a);\n   67 |                 return Self::new(ot_a + (ot_b - ot_a) * t);\n   68 |             }\n   69 |         }","lines":20,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/fontique/src/impl_fontconfig.rs#L50-L69"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"resolve_range computes `*n + 1` for both an excluded start bound and an included end bound without overflow protection. If a caller passes a range whose start is `Bound::Excluded(usize::MAX)` or whose end is `Bound::Included(usize::MAX)` the addition overflows, panicking in debug builds and wrapping to 0 in release builds (turning a tail range into an empty/inverted range silently). Such ranges are reachable from the public `RangedBuilder::push` / `StyleRunBuilder::push_style_run` APIs which accept arbitrary `impl RangeBounds<usize>`.","fix":"Use saturating/checked arithmetic, e.g. `n.saturating_add(1)` for the `Excluded` start and `Included` end arms (then clamp with `.min(len)` as already done).","locations":[{"ref":"parley/src/builder.rs:385-397","code":"  385 | fn resolve_range(range: impl RangeBounds<usize>, len: usize) -> Range<usize> {\n  386 |     let start = match range.start_bound() {\n  387 |         Bound::Unbounded => 0,\n  388 |         Bound::Included(n) => *n,\n  389 |         Bound::Excluded(n) => *n + 1,\n  390 |     };\n  391 |     let end = match range.end_bound() {\n  392 |         Bound::Unbounded => len,\n  393 |         Bound::Included(n) => *n + 1,\n  394 |         Bound::Excluded(n) => *n,\n  395 |     };\n  396 |     start.min(len)..end.min(len)\n  397 | }","lines":13,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/parley/src/builder.rs#L385-L397"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"Style indices are stored and cast as u16 throughout (StyleRun::style_index, Char::style_index, ResolvedStyle table index `as u16`). resolve_current_style_id does `self.style_table.len() as u16` and range.rs does `style_index as u16` with no bounds check. A document with more than 65535 distinct resolved styles silently truncates the index, mapping runs to the wrong style (and potentially out-of-bounds on lookup if the truncated value collides differently).","fix":"Add a debug assertion (`debug_assert!(self.style_table.len() <= u16::MAX as usize)`) or return an error when the style table exceeds u16 capacity, so truncation is detected rather than silently corrupting style assignment.","locations":[{"ref":"parley/src/resolve/tree.rs:151-153","code":"  151 |         let style_id = self.style_table.len() as u16;\n  152 |         self.style_table.push(self.current_style());\n  153 |         self.tree[self.current_span].style_id = Some(style_id);","lines":3,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/parley/src/resolve/tree.rs#L151-L153"},{"ref":"parley/src/resolve/range.rs:158-163","code":"  158 |         for (style_index, style) in styles.drain(..).enumerate() {\n  159 |             style_table.push(style.style);\n  160 |             style_runs.push(StyleRun {\n  161 |                 style_index: style_index as u16,\n  162 |                 range: style.range,\n  163 |             });","lines":6,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/parley/src/resolve/range.rs#L158-L163"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"LayoutContext::clone discards all internal state and returns a brand new instance (`Self::new()`). This silently violates the usual `Clone` contract that a clone equals the original. While the internal state is scratch space, callers cloning a configured/warmed context (font caches, shape caches, analysis data sources) get a cold default instead, which is surprising and can cause performance cliffs or subtle behavioral differences. The behavior is documented only in a terse inline comment.","fix":"Either implement a real clone, or do not implement `Clone` at all (force callers to construct a new context explicitly), or rename to a `fresh()`/`new_like()` method so the non-cloning semantics are explicit.","locations":[{"ref":"parley/src/context.rs:199-204","code":"  199 | impl<B: Brush> Clone for LayoutContext<B> {\n  200 |     fn clone(&self) -> Self {\n  201 |         // None of the internal state is visible so just return a new instance.\n  202 |         Self::new()\n  203 |     }\n  204 | }","lines":6,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/parley/src/context.rs#L199-L204"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"previous_visual_word and next_visual_word use asymmetric word-boundary conditions that look like a copy/paste/refactor divergence. next_visual_word's non-RTL branch tests `right.is_word_boundary() && !left.is_space_or_nbsp()` (mixing right's boundary flag with left's space check), while previous_visual_word's non-RTL branch tests `right.is_word_boundary() && !right.is_space_or_nbsp()`. The RTL branches also differ (next checks `left.is_word_boundary() && !left.is_space_or_nbsp()`; previous has a compound condition involving both left and right). The `!left.is_space_or_nbsp()` in next_visual_word's else branch is suspicious - it pairs right's boundary with left's whitespace, which can cause the word-forward stop to skip or stop at the wrong boundary around spaces.","fix":"Audit the four branches against the intended word-navigation semantics; the non-RTL forward branch most likely should test `right.is_word_boundary() && !right.is_space_or_nbsp()` (matching the backward variant) so forward/backward word motion is symmetric around whitespace.","locations":[{"ref":"parley/src/editing/cursor.rs:196-244","code":"  196 |     pub fn next_visual_word<B: Brush>(&self, layout: &Layout<B>) -> Self {\n  197 |         let mut cur = *self;\n  198 |         loop {\n  199 |             let next = cur.next_visual(layout);\n  200 |             if next == cur {\n  201 |                 break;\n  202 |             }\n  203 |             cur = next;\n  204 |             let [Some(left), Some(right)] = cur.visual_clusters(layout) else {\n  205 |                 break;\n  206 |             };\n  207 |             if left.is_rtl() {\n  208 |                 if left.is_word_boundary() && !left.is_space_or_nbsp() {\n  209 |                     break;\n  210 |                 }\n  211 |             } else if right.is_word_boundary() && !left.is_space_or_nbsp() {\n  212 |                 break;\n  213 |             }\n  214 |         }\n  215 |         cur\n  216 |     }\n  217 | \n  218 |     /// Returns a new cursor that is positioned at the previous word boundary\n  219 |     /// in visual order.\n  220 |     #[must_use]\n  221 |     pub fn previous_visual_word<B: Brush>(&self, layout: &Layout<B>) -> Self {\n  222 |         let mut cur = *self;\n  223 |         loop {\n  224 |             let next = cur.previous_visual(layout);\n  225 |             if next == cur {\n  226 |                 break;\n  227 |             }\n  228 |             cur = next;\n  229 |             let [Some(left), Some(right)] = cur.visual_clusters(layout) else {\n  230 |                 break;\n  231 |             };\n  232 |             if left.is_rtl() {\n  233 |                 if left.is_word_boundary()\n  234 |                     && (left.is_space_or_nbsp()\n  235 |                         || (right.is_word_boundary() && !right.is_space_or_nbsp()))\n  236 |                 {\n  237 |                     break;\n  238 |                 }\n  239 |             } else if right.is_word_boundary() && !right.is_space_or_nbsp() {\n  240 |                 break;\n  241 |             }\n  242 |         }\n  243 |         cur\n  244 |     }","lines":49,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/parley/src/editing/cursor.rs#L196-L244"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"update_compose_for_replaced_range only adjusts the compose range for shrink/grow when the edit is entirely before (`compose.start >= old_range.end`) or entirely after, or an overlap that shrinks. For an edit that overlaps the compose region and GROWS (new_len > old_range.len() with old_range overlapping compose), no branch handles it: the final `if new_len < old_range.len()` block is skipped and compose end is left stale, so the preedit range no longer covers the intended text. Most callers pass new_len=0 (deletion) so this is latent, but replace_selection passes s.len() and could overlap a compose region.","fix":"Add handling for the overlap-and-grow case (clamp/extend compose.end relative to old_range.start + new_len), or document/guarantee that edits never overlap an active compose region.","locations":[{"ref":"parley/src/editing/editor.rs:1132-1159","code":" 1132 |     fn update_compose_for_replaced_range(&mut self, old_range: Range<usize>, new_len: usize) {\n 1133 |         if new_len == old_range.len() {\n 1134 |             return;\n 1135 |         }\n 1136 |         let Some(compose) = &mut self.compose else {\n 1137 |             return;\n 1138 |         };\n 1139 |         if compose.end <= old_range.start {\n 1140 |             return;\n 1141 |         }\n 1142 |         if compose.start >= old_range.end {\n 1143 |             if new_len > old_range.len() {\n 1144 |                 let diff = new_len - old_range.len();\n 1145 |                 *compose = compose.start + diff..compose.end + diff;\n 1146 |             } else {\n 1147 |                 let diff = old_range.len() - new_len;\n 1148 |                 *compose = compose.start - diff..compose.end - diff;\n 1149 |             }\n 1150 |             return;\n 1151 |         }\n 1152 |         if new_len < old_range.len() {\n 1153 |             if compose.start >= (old_range.start + new_len) {\n 1154 |                 self.compose = None;\n 1155 |                 return;\n 1156 |             }\n 1157 |             compose.end = compose.end.min(old_range.start + new_len);\n 1158 |         }\n 1159 |     }","lines":28,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/parley/src/editing/editor.rs#L1132-L1159"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`commit_line` computes `first_run_pos`/`last_run_pos` with `position(is_text_run).unwrap_or(0)` / `rposition(is_text_run).unwrap_or(0)`. When the committed item slice contains NO text run (e.g. only inline boxes), both default to 0, so the cluster-range override logic at lines 1208-1213 is applied to item index 0 even though it is not a text run. Because that item is an InlineBox the override branch is never hit for it, so the effect is benign today, but the `unwrap_or(0)` silently masks the 'no text run' case and is a latent bug if item 0's kind changes.","fix":"Guard the override with an explicit check that a text run exists (e.g. use `Option<usize>` and only apply start/end overrides when `Some`), instead of defaulting the position to 0.","locations":[{"ref":"parley/src/layout/line_break.rs:1466-1468","code":" 1466 |     let is_text_run = |item: &LayoutItem| item.kind == LayoutItemKind::TextRun;\n 1467 |     let first_run_pos = items_to_commit.iter().position(is_text_run).unwrap_or(0);\n 1468 |     let last_run_pos = items_to_commit.iter().rposition(is_text_run).unwrap_or(0);","lines":3,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/parley/src/layout/line_break.rs#L1466-L1468"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`AttributedText::attributes_for_range` is documented to yield attributes that 'overlap the given range', but `TextRange::overlaps` uses strictly-less comparisons (`start < other.end && end > other.start`), so a zero-length query range (start == end) never overlaps anything and a zero-length attribute span is never reported. Callers querying an insertion point (caret position) get no attributes even when a span covers that point. This may be intended but is undocumented and surprising.","fix":"Document that empty ranges never overlap (and that empty spans are excluded), or provide a point-query path (reuse `attributes_at`) for callers needing caret-position semantics.","locations":[{"ref":"attributed_text/src/text_range.rs:104-107","code":"  104 |     #[inline]\n  105 |     pub const fn overlaps(self, other: Self) -> bool {\n  106 |         self.start < other.end && self.end > other.start\n  107 |     }","lines":4,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/attributed_text/src/text_range.rs#L104-L107"},{"ref":"attributed_text/src/attributed_text.rs:131-142","code":"  131 |     pub fn attributes_for_range(\n  132 |         &self,\n  133 |         range: TextRange,\n  134 |     ) -> impl Iterator<Item = (TextRange, &Attr)> {\n  135 |         self.attributes.iter().filter_map(move |(attr_span, attr)| {\n  136 |             if attr_span.overlaps(range) {\n  137 |                 Some((*attr_span, attr))\n  138 |             } else {\n  139 |                 None\n  140 |             }\n  141 |         })\n  142 |     }","lines":12,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/attributed_text/src/attributed_text.rs#L131-L142"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"Android `fonts.xml` parsing: when a `<family>` has a `name` attribute, the inner loop over `child.children()` is an empty body (only TODO comments) so no fonts are ever associated with the named family from XML; and the `und-<script>` branch uses `scr.parse().unwrap_or(Script::UNKNOWN)`, silently mapping malformed script tags to UNKNOWN which then pollutes `script_fallback` with bogus UNKNOWN -> family entries that can shadow real fallbacks.","fix":"Skip pushing fallback entries when the script tag fails to parse instead of inserting `Script::UNKNOWN`; and complete (or remove) the empty named-family child loop so the behavior matches the doc comments.","locations":[{"ref":"fontique/src/backend/android.rs:98-108","code":"   98 |                         \"family\" => {\n   99 |                             if let Some(name) = child.attribute(\"name\") {\n  100 |                                 let f = name_map.get_or_insert(name);\n  101 |                                 let _id = f.id();\n  102 |                                 for _child in child.children() {\n  103 |                                     // TODO: map using postScriptName when available other­\n  104 |                                     //       wise use the file name, and perhaps if necess­\n  105 |                                     //       ary (e.g. if it's a collection), do something\n  106 |                                     //       smarter, or something dumb that meets expecta­\n  107 |                                     //       tions on Android.\n  108 |                                 }","lines":11,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/fontique/src/backend/android.rs#L98-L108"},{"ref":"fontique/src/backend/android.rs:129-135","code":"  129 |                                         for lang in langs {\n  130 |                                             if let Some(scr) = lang.strip_prefix(\"und-\") {\n  131 |                                                 // Undefined lang for script-only fallbacks\n  132 |                                                 script_fallback.push((\n  133 |                                                     scr.parse().unwrap_or(Script::UNKNOWN),\n  134 |                                                     *family,\n  135 |                                                 ));","lines":7,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/fontique/src/backend/android.rs#L129-L135"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`unicode_to_mac_roman` truncates the input codepoint to `u16` (`let u = c as u16`) before searching `UNICODE_TO_MAC_ROMAN`. A supplementary-plane codepoint that shares the low 16 bits with a Mac Roman entry (e.g. U+1F8FF vs U+F8FF) would falsely match. The caller only invokes this for `is_mac_roman && c > 0x7F`, and Mac Roman targets are all BMP, but the silent truncation is a latent correctness hazard for codepoints > 0xFFFF.","fix":"Return 0 early when `c > 0xFFFF` before truncating, or compare against `c` (u32) widened entries.","locations":[{"ref":"fontique/src/charmap.rs:121-127","code":"  121 | fn unicode_to_mac_roman(c: u32) -> u32 {\n  122 |     let u = c as u16;\n  123 |     let Some(index) = UNICODE_TO_MAC_ROMAN.iter().position(|m| *m == u) else {\n  124 |         return 0;\n  125 |     };\n  126 |     (0x80 + index) as u32\n  127 | }","lines":7,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/fontique/src/charmap.rs#L121-L127"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`Inner::clear` (non-no_std shared branch) clears the shared store under the lock, bumps the version, and then unconditionally falls through to `self.data.clear()` at the end of the function. The trailing `self.data.clear()` runs in BOTH the shared and unshared branches, so in the unshared branch `self.data.clear()` executes twice. It is harmless (idempotent) but indicates the control flow was not intended; the shared branch also clears local `data` immediately, which will be re-synced from the shared store on next `sync_shared`, making the intent unclear.","fix":"Move `self.data.clear()` into the `else` branch only (mirroring the other shared/unshared methods), so the shared branch relies on `sync_shared` and the unshared branch clears once.","locations":[{"ref":"fontique/src/collection/mod.rs:578-587","code":"  578 |     pub fn clear(&mut self) {\n  579 |         #[cfg(feature = \"std\")]\n  580 |         if let Some(shared) = &self.shared {\n  581 |             shared.data.lock().unwrap().clear();\n  582 |             shared.bump_version();\n  583 |         } else {\n  584 |             self.data.clear();\n  585 |         }\n  586 |         self.data.clear();\n  587 |     }","lines":10,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/fontique/src/collection/mod.rs#L578-L587"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`scan_path_impl` checks `if depth > max_depth { return None; }` only AFTER confirming the path is a directory, and recurses with `depth + 1`. With `max_depth = 0` (used by the CoreText backend and the default `from_paths(..., 0)`), the top-level directory has depth 0 so it is read, and its entries are visited at depth 1 which exceeds max_depth and are skipped only if they are themselves directories - regular font files at depth 1 are still scanned. The semantics of `max_depth` are therefore off-by-one / ambiguous (it limits directory recursion depth, not file depth), and the CoreText path relies on this quirk implicitly.","fix":"Clarify and document the meaning of `max_depth`; check the depth bound before issuing the `read_dir` recursion so the limit is consistent for both files and directories.","locations":[{"ref":"fontique/src/scan.rs:147-168","code":"  147 | #[cfg(feature = \"std\")]\n  148 | fn scan_path_impl(\n  149 |     path: &Path,\n  150 |     max_depth: u32,\n  151 |     f: &mut impl FnMut(&ScannedFont<'_>),\n  152 |     depth: u32,\n  153 | ) -> Option<()> {\n  154 |     let metadata = path.metadata().ok()?;\n  155 |     if metadata.is_dir() {\n  156 |         if depth > max_depth {\n  157 |             return None;\n  158 |         }\n  159 |         for entry in std::fs::read_dir(path).ok()?.filter_map(|entry| entry.ok()) {\n  160 |             scan_path_impl(entry.path().as_path(), max_depth, f, depth + 1);\n  161 |         }\n  162 |     } else {\n  163 |         let file = std::fs::File::open(path).ok()?;\n  164 |         let mapped = unsafe { memmap2::Mmap::map(&file) }.ok()?;\n  165 |         scan_memory_impl(&mapped, Some(path), f);\n  166 |     }\n  167 |     Some(())\n  168 | }","lines":22,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/fontique/src/scan.rs#L147-L168"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In next_visual the two soft-line-break sub-branches (RTL-downstream and LTR-upstream) compute `index` with identical bodies (both: if right.is_rtl() right.text_range().end else right.text_range().start), only the resulting affinity differs (Upstream vs Downstream). The duplicated index computation suggests at least one branch may be using the wrong endpoint relative to its affinity; the parallel structure in previous_visual uses left.text_range() for one branch and right.text_range() for the other. Worth verifying the LTR-upstream branch isn't a copy-paste of the RTL-downstream branch.","fix":"Verify both soft-line-break branches against intended visual movement; if correct, hoist the shared index computation and only vary affinity to make the intent explicit.","locations":[{"ref":"parley/src/editing/cursor.rs:157-174","code":"  157 |         if let (Some(left), Some(right)) = (&left, &right) {\n  158 |             if left.is_soft_line_break() {\n  159 |                 if left.is_rtl() && self.affinity == Affinity::Downstream {\n  160 |                     let index = if right.is_rtl() {\n  161 |                         right.text_range().end\n  162 |                     } else {\n  163 |                         right.text_range().start\n  164 |                     };\n  165 |                     return Self::from_byte_index(layout, index, Affinity::Upstream);\n  166 |                 } else if !left.is_rtl() && self.affinity == Affinity::Upstream {\n  167 |                     let index = if right.is_rtl() {\n  168 |                         right.text_range().end\n  169 |                     } else {\n  170 |                         right.text_range().start\n  171 |                     };\n  172 |                     return Self::from_byte_index(layout, index, Affinity::Downstream);\n  173 |                 }\n  174 |             }","lines":18,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/parley/src/editing/cursor.rs#L157-L174"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"cursor_at uses `index >= self.buffer.len()` to decide Upstream vs Downstream affinity, but it is called from set_compose/clear_compose/ime_cursor_area with indices into a buffer that may currently include the preedit text. At index == buffer.len() it forces Upstream and clamps to buffer.len(); that is fine, but the threshold `>=` means a caret at exactly end-of-buffer always gets Upstream affinity even when the IME explicitly requested a downstream position, subtly altering cursor visual placement at the buffer end.","fix":"Consider preserving the requested affinity rather than unconditionally forcing Upstream at the end of the buffer, or document why end-of-buffer is always upstream.","locations":[{"ref":"parley/src/editing/editor.rs:1121-1130","code":" 1121 |     /// Make a cursor at a given byte index.\n 1122 |     fn cursor_at(&self, index: usize) -> Cursor {\n 1123 |         // TODO: Do we need to be non-dirty?\n 1124 |         // FIXME: `Selection` should make this easier\n 1125 |         if index >= self.buffer.len() {\n 1126 |             Cursor::from_byte_index(&self.layout, self.buffer.len(), Affinity::Upstream)\n 1127 |         } else {\n 1128 |             Cursor::from_byte_index(&self.layout, index, Affinity::Downstream)\n 1129 |         }\n 1130 |     }","lines":10,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/parley/src/editing/editor.rs#L1121-L1130"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"shift_click_extension picks the new anchor with `if target.index < start.index { end } else { start }`. When the click lands exactly at `start.index` (target.index == start.index), it chooses `start` as the anchor and `target` as focus, collapsing the selection to a single point even though the user shift-clicked the existing anchor-base boundary. With word/line anchor bases this discards the granularity that the user expects to be preserved; the boundary case `target.index == start.index` arguably should keep `end` as anchor so the word/line remains selected.","fix":"Reconsider the tie case `target.index == start.index`; likely should use `<=` or otherwise keep the far edge so a shift-click on the anchor boundary does not collapse the word/line selection.","locations":[{"ref":"parley/src/editing/selection.rs:471-490","code":"  471 |     pub fn shift_click_extension<B: Brush>(&self, layout: &Layout<B>, x: f32, y: f32) -> Self {\n  472 |         let target = Cursor::from_point(layout, x, y);\n  473 |         match self.anchor_base {\n  474 |             AnchorBase::Cluster => Self::new(self.anchor, target),\n  475 |             AnchorBase::Word(start, end) | AnchorBase::Line(start, end) => {\n  476 |                 // Place the focus where the user just clicked, and the anchor on the \"far\" side of the anchorbase.\n  477 |                 let anchor = if target.index < start.index {\n  478 |                     end\n  479 |                 } else {\n  480 |                     start\n  481 |                 };\n  482 |                 Self {\n  483 |                     anchor,\n  484 |                     focus: target,\n  485 |                     anchor_base: self.anchor_base,\n  486 |                     h_pos: None,\n  487 |                 }\n  488 |             }\n  489 |         }\n  490 |     }","lines":20,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/parley/src/editing/selection.rs#L471-L490"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In geometry_with, when the focus/anchor line cannot be resolved the end line index falls back to `layout.len() + 1`. As the upper bound of an inclusive range `line_start_ix..=line_end_ix`, this iterates one line index (`layout.len()`) that is always out of bounds (lines are 0..layout.len()-1), plus `layout.len()+1` is never reachable since get() returns None and continues. The `+ 1` is meaningless and misleading; the intended fallback was presumably `layout.len().saturating_sub(1)` (last valid line).","fix":"Use `.unwrap_or(layout.len().saturating_sub(1))` for the fallback end line index, matching how line_start_ix would resolve to a valid line.","locations":[{"ref":"parley/src/editing/selection.rs:532-536","code":"  532 |         let line_end_ix = end\n  533 |             .line(layout)\n  534 |             .map(|(ix, _)| ix)\n  535 |             .unwrap_or(layout.len() + 1);\n  536 |         for line_ix in line_start_ix..=line_end_ix {","lines":5,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/parley/src/editing/selection.rs#L532-L536"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`from_point_impl` fallback at the end returns the nearest cluster only when `y <= 0.0 && !exact` (above the layout). There is no symmetric fallback for `y` below the last line: when the point is below all lines and not exact, `line_for_offset` clamps to the last line and the inner loop runs, so it is usually handled, but a point past the end of the last line's content on the x-axis falls through to `None` for the non-exact case because `is_last_cluster`/`is_last_run` short-circuits only handle the in-line case. Behavior for below-and-past-end points is inconsistent with the above-layout fallback.","fix":"Review and document the intended nearest-cluster behavior for points below/right of all content in the non-exact mode; add a symmetric fallback if needed.","locations":[{"ref":"parley/src/layout/cluster.rs:137-141","code":"  137 |         if y <= 0.0 && !exact {\n  138 |             Some((path.cluster(layout)?, ClusterSide::Left))\n  139 |         } else {\n  140 |             None\n  141 |         }","lines":5,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/parley/src/layout/cluster.rs#L137-L141"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"Assertion in `break_next_line_or_box` allows `line_max_advance` to exceed `layout_max_advance` by up to 1.0 (`self.state.line_max_advance - self.state.layout_max_advance < 1.0`) yet the comment on the field (line 157) states 'This must be <= the layout_max_advance.' The assertion contradicts the documented invariant by a 1.0 slack with no explanation.","fix":"Document the 1.0 floating-point slack in the field comment, or tighten the assertion/field doc to agree.","locations":[{"ref":"parley/src/layout/line_break.rs:609-612","code":"  609 |         assert!(\n  610 |             self.state.layout_max_advance == f32::INFINITY\n  611 |                 || self.state.line_max_advance - self.state.layout_max_advance < 1.0\n  612 |         );","lines":4,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/parley/src/layout/line_break.rs#L609-L612"},{"ref":"parley/src/layout/line_break.rs:283-285","code":"  283 |     layout_max_advance: f32,\n  284 |     /// The max advance (max width) of the current line. This must be <= the `layout_max_advance`.\n  285 |     line_max_advance: f32,","lines":3,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/parley/src/layout/line_break.rs#L283-L285"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`break_next_with_length` computes `is_last_item = self.state.item_idx >= self.layout.data.items.len()` for the inline-box branch (line 758) but `append_inline_box_to_line` already incremented `item_idx`, so this checks whether the box was the last item; for the TextRun branch (line 815) it uses `item_idx + 1 >= len` because `item_idx` has not yet been incremented. The two branches use inconsistent off-by-one logic for the same 'is this the final item' question, which is fragile and easy to break.","fix":"Normalize the 'last item' computation between the two branches (account for the box branch's pre-incremented item_idx explicitly).","locations":[{"ref":"parley/src/layout/line_break.rs:1005","code":" 1005 |                         let is_last_item = self.state.item_idx >= self.layout.data.items.len();","lines":1,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/parley/src/layout/line_break.rs#L1005"},{"ref":"parley/src/layout/line_break.rs:1063-1064","code":" 1063 |                             let is_last_item =\n 1064 |                                 self.state.item_idx + 1 >= self.layout.data.items.len();","lines":2,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/parley/src/layout/line_break.rs#L1063-L1064"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In RangedStyleBuilder::finish, properties with `prop.range.start > prop.range.end` are skipped, but zero-length ranges (`start == end`) are not. resolve_range can produce start==end (e.g. an empty user range), and such a property is then run through split_range/apply, doing work and potentially inserting/splitting spans for a range that covers no text. At best wasted work, at worst it creates an empty-range span that downstream code (analyze_text asserts `range.start < range.end`) may reject.","fix":"Change the guard to `if prop.range.start >= prop.range.end { continue; }` so zero-length property ranges are ignored, matching the downstream assertion that style runs are non-empty.","locations":[{"ref":"parley/src/resolve/range.rs:92-95","code":"   92 |         for prop in &self.properties {\n   93 |             if prop.range.start > prop.range.end {\n   94 |                 continue;\n   95 |             }","lines":4,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/parley/src/resolve/range.rs#L92-L95"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"nearly_eq uses a fixed absolute tolerance of `f32::EPSILON` (~1.19e-7). This is only meaningful for values near 1.0. For large magnitudes (e.g. font sizes, letter/word spacing, line heights in absolute pixels) two values that differ by less than one representable ULP cannot be distinguished, while values that are 'visually equal' but differ by more than 1.19e-7 are reported as not equal. It is used widely (LineHeight::nearly_eq, resolve comparisons, shaping). An absolute epsilon of EPSILON is almost never the right choice for a general float 'nearly equal'.","fix":"Use a relative/ULP comparison or a context-appropriate absolute tolerance (e.g. a small fraction of a pixel), or document that nearly_eq is intentionally an exact-ish check only valid near unit magnitude.","locations":[{"ref":"parley/src/util.rs:6-12","code":"    6 | pub(crate) fn nearly_eq(x: f32, y: f32) -> bool {\n    7 |     (x - y).abs() < f32::EPSILON\n    8 | }\n    9 | \n   10 | pub(crate) fn nearly_zero(x: f32) -> bool {\n   11 |     nearly_eq(x, 0.)\n   12 | }","lines":7,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/parley/src/util.rs#L6-L12"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`DWriteSystemFonts::new(false).unwrap()` will panic the whole `SystemFonts::new` (and thus `Collection::new` with system fonts enabled) if DirectWrite factory creation or system font collection retrieval fails (e.g. in restricted/headless Windows sessions). Every other backend degrades gracefully to an empty `SystemFonts` on failure; the Windows backend hard-unwraps.","fix":"Make `SystemFonts::new` fall back to an empty/default collection when `DWriteSystemFonts::new` returns `Err`, matching the fontconfig/coretext backends.","locations":[{"ref":"fontique/src/backend/dwrite.rs:53-54","code":"   53 |     pub(crate) fn new() -> Self {\n   54 |         let dwrite_fonts = DWriteSystemFonts::new(false).unwrap();","lines":2,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/fontique/src/backend/dwrite.rs#L53-L54"},{"ref":"fontique/src/backend/dwrite.rs:141-159","code":"  141 |     fn new(update: bool) -> windows_core::Result<Self> {\n  142 |         unsafe {\n  143 |             let factory = DWriteCreateFactory::<IDWriteFactory>(DWRITE_FACTORY_TYPE_SHARED)?;\n  144 |             let mut collection: Option<IDWriteFontCollection> = None;\n  145 |             factory.GetSystemFontCollection(&mut collection, update)?;\n  146 |             let collection = collection.ok_or_else(|| {\n  147 |                 windows_core::Error::new(STATUS_NOT_FOUND.to_hresult(), \"no collection\")\n  148 |             })?;\n  149 |             let fallback = factory\n  150 |                 .cast::<IDWriteFactory2>()\n  151 |                 .and_then(|f| f.GetSystemFontFallback())\n  152 |                 .ok();\n  153 |             Ok(Self {\n  154 |                 collection,\n  155 |                 fallback,\n  156 |                 map_buf: vec![],\n  157 |             })\n  158 |         }\n  159 |     }","lines":19,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/fontique/src/backend/dwrite.rs#L141-L159"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"Throughout the fontconfig backend, boolean-returning FFI setters (`add_string`, `add_charset`, `add_langset`, `add`) have their return values silently discarded at the call sites in `new`, `fallback`, and `family_uncached`. A failure to add a family/charset/langset to a pattern (e.g. OOM) is ignored and silently produces a degraded match rather than an error or retry.","fix":"Check the boolean results and propagate failure (return None / skip the entry) where a failed add would otherwise corrupt the query semantics.","locations":[{"ref":"fontique/src/backend/fontconfig.rs:678-679","code":"  678 |             let mut pattern = Pattern::new().unwrap();\n  679 |             pattern.add_string(FC_FAMILY, name);","lines":2,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/fontique/src/backend/fontconfig.rs#L678-L679"},{"ref":"fontique/src/backend/fontconfig.rs:754-759","code":"  754 |         if let Some(set) = locale_lang_set {\n  755 |             pattern.add_langset(FC_LANG, &set);\n  756 |         }\n  757 |         if let Some(set) = script_char_set {\n  758 |             pattern.add_charset(FC_CHARSET, set);\n  759 |         }","lines":6,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/fontique/src/backend/fontconfig.rs#L754-L759"},{"ref":"fontique/src/backend/fontconfig.rs:778","code":"  778 |         pattern.add_string(FC_FAMILY, CString::new(name.name()).ok()?.as_c_str());","lines":1,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/fontique/src/backend/fontconfig.rs#L778"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`SystemFonts::new` (fontconfig) uses `.unwrap()` on `Pattern::new()` and `config.font_sort(&pattern, true)` while building the generic family map. `Pattern::new` returns None on fontconfig OOM and `font_sort` returns `Err` on a non-match; either unwrap panics during collection construction even though the surrounding code is otherwise written to degrade gracefully (returns `Self::default()` on earlier failures).","fix":"Replace the `.unwrap()`s with graceful handling (`let Some(..) = ... else { continue; }` / `let Ok(..) = ... else { continue; }`) so a single generic-family resolution failure does not panic the whole collection.","locations":[{"ref":"fontique/src/backend/fontconfig.rs:678","code":"  678 |             let mut pattern = Pattern::new().unwrap();","lines":1,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/fontique/src/backend/fontconfig.rs#L678"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In the non-quoted font-family branch, when the UTF-8 decode of the token fails the error is reported at byte offset `start`, but the slice that failed decoding is `start..end` and `start` here is the (whitespace-untrimmed) token start; for a token preceded by whitespace inside the field the reported offset points at leading whitespace rather than the offending byte. Minor diagnostic inaccuracy (UTF-8 validity of a &str-derived slice cannot actually fail here, so this branch is also effectively unreachable for `&str` input).","fix":"Since `source` originates from a `&str`, the `from_utf8` of any sub-slice on char boundaries cannot fail; either remove the unreachable error branch or, if kept for defensiveness, point the offset at the precise failing index.","locations":[{"ref":"parlance/src/font_family.rs:342-355","code":"  342 |         let name = match self\n  343 |             .source\n  344 |             .get(start..end)\n  345 |             .and_then(|bytes| core::str::from_utf8(bytes).ok())\n  346 |         {\n  347 |             Some(s) => s.trim(),\n  348 |             None => {\n  349 |                 self.done = true;\n  350 |                 return Some(Err(ParseFontFamilyError::new(\n  351 |                     ParseFontFamilyErrorKind::InvalidSyntax,\n  352 |                     start,\n  353 |                 )));\n  354 |             }\n  355 |         };","lines":14,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/parlance/src/font_family.rs#L342-L355"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"hard_line_start contains an `unreachable!` that asserts a smaller line index must exist if a larger one does. This is an invariant about Layout internals enforced from the editing layer; if Layout ever produces a sparse/Non-contiguous line index set (or the focus line index is computed against a different/refreshed layout), this becomes a hard panic in production rather than a graceful fallback.","fix":"Replace the unreachable! with a graceful break (treat as start-of-document) so a layout inconsistency degrades gracefully instead of panicking.","locations":[{"ref":"parley/src/editing/selection.rs:354-360","code":"  354 |                 let Some(line) = layout.get(prev_index) else {\n  355 |                     unreachable!(\n  356 |                         \"{hard_line_start_index} is a valid line in the layout, but {prev_index} isn't, despite the latter being smaller.\\n\\\n  357 |                         The layout has {} lines.\",\n  358 |                         layout.len()\n  359 |                     );\n  360 |                 };","lines":7,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/parley/src/editing/selection.rs#L354-L360"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`TextSource` (an `IDWriteTextAnalysisSource` implementation) hands DirectWrite raw pointers into `self.text`/`self.locale` slices via `transmute` to `*mut u16`. The COM object is constructed on the stack inside `family_name_for_text` and passed by reference to `MapCharacters`. This is sound only because `MapCharacters` does not retain the source past the call, but the `'a` lifetime is erased through the COM boundary and the implementation casts `*const` to `*mut` for data DirectWrite must treat as read-only. If DirectWrite ever held the reference or wrote through the pointer this would be UB; there is no comment documenting the retain assumption.","fix":"Document the invariant that DirectWrite treats the analysis source as borrowed read-only for the duration of `MapCharacters`, and avoid the `*const -> *mut` transmute by keeping the buffers in a form whose pointer is legitimately mutable, or assert the API contract in a comment.","locations":[{"ref":"fontique/src/backend/dwrite.rs:331-394","code":"  331 | #[implement(IDWriteTextAnalysisSource)]\n  332 | struct TextSource<'a> {\n  333 |     text: &'a [u16],\n  334 |     locale: &'a [u16],\n  335 | }\n  336 | \n  337 | impl IDWriteTextAnalysisSource_Impl for TextSource_Impl<'_> {\n  338 |     fn GetLocaleName(\n  339 |         &self,\n  340 |         textposition: u32,\n  341 |         textlength: *mut u32,\n  342 |         localename: *mut *mut u16,\n  343 |     ) -> windows::core::Result<()> {\n  344 |         unsafe {\n  345 |             *textlength = (self.text.len() as u32).saturating_sub(textposition);\n  346 |             *localename = core::mem::transmute::<*const u16, *mut u16>(self.locale.as_ptr());\n  347 |         }\n  348 |         Ok(())\n  349 |     }\n  350 | \n  351 |     fn GetNumberSubstitution(\n  352 |         &self,\n  353 |         textposition: u32,\n  354 |         textlength: *mut u32,\n  355 |         numbersubstitution: OutRef<'_, IDWriteNumberSubstitution>,\n  356 |     ) -> windows::core::Result<()> {\n  357 |         numbersubstitution.write(None)?;\n  358 |         unsafe {\n  359 |             *textlength = (self.text.len() as u32).saturating_sub(textposition);\n  360 |         }\n  361 |         Ok(())\n  362 |     }\n  363 | \n  364 |     fn GetParagraphReadingDirection(&self) -> DWRITE_READING_DIRECTION {\n  365 |         DWRITE_READING_DIRECTION_LEFT_TO_RIGHT\n  366 |     }\n  367 | \n  368 |     fn GetTextAtPosition(\n  369 |         &self,\n  370 |         textposition: u32,\n  371 |         textstring: *mut *mut u16,\n  372 |         textlength: *mut u32,\n  373 |     ) -> windows::core::Result<()> {\n  374 |         unsafe {\n  375 |             let text = self.text.get(textposition as usize..).unwrap_or_default();\n  376 |             *textlength = text.len() as _;\n  377 |             *textstring = core::mem::transmute::<*const u16, *mut u16>(text.as_ptr());\n  378 |         }\n  379 |         Ok(())\n  380 |     }\n  381 | \n  382 |     fn GetTextBeforePosition(\n  383 |         &self,\n  384 |         textposition: u32,\n  385 |         textstring: *mut *mut u16,\n  386 |         textlength: *mut u32,\n  387 |     ) -> windows::core::Result<()> {\n  388 |         unsafe {\n  389 |             let text = self.text.get(..textposition as usize).unwrap_or_default();\n  390 |             *textlength = text.len() as _;\n  391 |             *textstring = core::mem::transmute::<*const u16, *mut u16>(text.as_ptr());\n  392 |         }\n  393 |         Ok(())\n  394 |     }","lines":64,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/fontique/src/backend/dwrite.rs#L331-L394"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"CoreText `create_base_font` calls `CFDictionary::new(...)` and then `attrs.unwrap()`. If dictionary creation returns None this panics inside system-font discovery. Given the rest of the backend is written to fall back gracefully (`scan_system_fonts` returns Option, `unwrap_or_default`), this lone unwrap can abort font enumeration.","fix":"Handle the None case (return a sensible default font or propagate Option) rather than unwrapping.","locations":[{"ref":"fontique/src/backend/coretext.rs:179-183","code":"  179 |     unsafe {\n  180 |         let attrs = CFDictionary::new(None, null_mut(), null_mut(), 0, null(), null());\n  181 |         let desc = CTFontDescriptor::with_attributes(&attrs.unwrap());\n  182 |         CTFont::with_font_descriptor(&desc, 0.0, null())\n  183 |     }","lines":5,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/fontique/src/backend/coretext.rs#L179-L183"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`update_active_for_boundary` maintains the active set with `Vec::binary_search` + `Vec::insert`/`Vec::remove`, each O(n) due to element shifting. For a segment with many simultaneously active spans this makes per-boundary work O(active_len) per event and O(active_len^2) worst case across a boundary, undercutting the otherwise linear bucketed-events design.","fix":"If active-set sizes can be large, consider a different structure (e.g. a presence bitset/array indexed by span id with a separate ordered list, or tombstoning) so removals/insertions avoid mid-vector shifts; for small active sets the current approach is fine and this can be left as-is with a note.","locations":[{"ref":"attributed_text/src/attribute_segments.rs:163-180","code":"  163 | fn update_active_for_boundary(workspace: &mut AttributeSegmentsWorkspace, boundary_index: usize) {\n  164 |     let end_range = workspace.end_offsets[boundary_index] as usize\n  165 |         ..workspace.end_offsets[boundary_index + 1] as usize;\n  166 |     for &id in &workspace.end_events[end_range] {\n  167 |         if let Ok(ix) = workspace.active.binary_search(&id) {\n  168 |             workspace.active.remove(ix);\n  169 |         }\n  170 |     }\n  171 | \n  172 |     let start_range = workspace.start_offsets[boundary_index] as usize\n  173 |         ..workspace.start_offsets[boundary_index + 1] as usize;\n  174 |     for &id in &workspace.start_events[start_range] {\n  175 |         match workspace.active.binary_search(&id) {\n  176 |             Ok(_) => {}\n  177 |             Err(ix) => workspace.active.insert(ix, id),\n  178 |         }\n  179 |     }\n  180 | }","lines":18,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/attributed_text/src/attribute_segments.rs#L163-L180"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`SystemFonts::new` (fontconfig) iterates every system font pattern only to populate the family-name map, then for each generic family does a separate `font_sort` with `trim` and dedup via a fresh `HashSet`. The initial full enumeration over `font_set.iter()` constructs a `Pattern` (with an `FcPatternReference` refcount bump) for every system font just to read FC_FAMILY strings, which is the dominant cost of collection construction on systems with many fonts.","fix":"This is largely inherent to fontconfig, but consider avoiding the per-font `Pattern` wrapper (and its refcount churn) by reading FC_FAMILY directly from the raw `FcPattern` during the initial enumeration, or lazily building the name map.","locations":[{"ref":"fontique/src/backend/fontconfig.rs:657-673","code":"  657 |         let mut name_map = FamilyNameMap::default();\n  658 |         for pattern in font_set.iter() {\n  659 |             let mut i = 0;\n  660 | \n  661 |             let mut first_name_id = None;\n  662 |             // For fonts with more than one family name, the second one is\n  663 |             // *often* (but not always) an RBIZ name.\n  664 |             while let Ok(name) = pattern.get_string(FC_FAMILY, i) {\n  665 |                 if i == 0 {\n  666 |                     // First name\n  667 |                     first_name_id = Some(name_map.get_or_insert(&name).id());\n  668 |                 } else if let Some(first_name_id) = first_name_id {\n  669 |                     name_map.add_alias(first_name_id, &name);\n  670 |                 }\n  671 |                 i += 1;\n  672 |             }\n  673 |         }","lines":17,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/fontique/src/backend/fontconfig.rs#L657-L673"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`FamilyNameMap::get` (and `add_alias`/`get_or_insert`) builds a `NameKey` by lowercasing the entire family name into a fresh `SmallVec<[u8;128]>` on every lookup. Family lookups happen on every `family_id`/`family_by_name`/query, so each query allocates+lowercases. For the hot query path this is avoidable overhead.","fix":"Consider caching the lowercased key or using a case-insensitive hashing/equality wrapper to avoid rebuilding the key buffer on every lookup.","locations":[{"ref":"fontique/src/family_name.rs:47-50","code":"   47 |     pub fn get(&self, name: &str) -> Option<&FamilyName> {\n   48 |         let key = NameKey::from_str(name);\n   49 |         self.name_map.get(key.as_bytes())\n   50 |     }","lines":4,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/fontique/src/family_name.rs#L47-L50"},{"ref":"fontique/src/family_name.rs:102-124","code":"  102 | /// Key for case-insensitive lookup of family names.\n  103 | #[derive(Default)]\n  104 | struct NameKey {\n  105 |     data: SmallVec<[u8; 128]>,\n  106 | }\n  107 | \n  108 | impl NameKey {\n  109 |     fn from_str(s: &str) -> Self {\n  110 |         let mut res = Self::default();\n  111 |         let mut buf = [0_u8; 4];\n  112 |         for ch in s.chars() {\n  113 |             for ch in ch.to_lowercase() {\n  114 |                 res.data\n  115 |                     .extend_from_slice(ch.encode_utf8(&mut buf).as_bytes());\n  116 |             }\n  117 |         }\n  118 |         res\n  119 |     }\n  120 | \n  121 |     pub fn as_bytes(&self) -> &[u8] {\n  122 |         &self.data\n  123 |     }\n  124 | }","lines":23,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/fontique/src/family_name.rs#L102-L124"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`Script::sample` performs a `binary_search_by` to find the index, then redundantly calls `SCRIPT_SAMPLES.get(ix)`. Since `binary_search_by` already returns a valid in-bounds index on `Ok`, the `.get(ix)` is an unnecessary bounds check and `Option` round-trip.","fix":"Use the index directly: `Some(SCRIPT_SAMPLES[ix].1)` (the index from a successful binary search is always valid).","locations":[{"ref":"fontique/src/script.rs:21-26","code":"   21 |     fn sample(&self) -> Option<&'static str> {\n   22 |         let ix = SCRIPT_SAMPLES\n   23 |             .binary_search_by(|entry| entry.0.cmp(self))\n   24 |             .ok()?;\n   25 |         SCRIPT_SAMPLES.get(ix).map(|entry| entry.1)\n   26 |     }","lines":6,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/fontique/src/script.rs#L21-L26"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"build_into_layout sorts inline_boxes with `sort_by_key(|b| b.index)` on every build even when there are zero or one inline boxes, and copies the full style table into the layout via `extend(... .map(as_layout_style))`. as_layout_style is called once per style-table entry per build. For the common hot path of many small re-layouts these are minor but unconditional; the sort in particular allocates/recurses for the general case when a cheap `is_sorted` check or len<=1 early-out would skip it.","fix":"Guard the sort with `if lcx.inline_boxes.len() > 1` (and optionally a sortedness check), since the typical case has no inline boxes.","locations":[{"ref":"parley/src/builder.rs:355-363","code":"  355 |     // Copy the visual styles into the layout\n  356 |     layout\n  357 |         .data\n  358 |         .styles\n  359 |         .extend(lcx.style_table.iter().map(|s| s.as_layout_style()));\n  360 | \n  361 |     // Sort the inline boxes as subsequent code assumes that they are in text index order.\n  362 |     // Note: It's important that this is a stable sort to allow users to control the order of contiguous inline boxes\n  363 |     lcx.inline_boxes.sort_by_key(|b| b.index);","lines":9,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/parley/src/builder.rs#L355-L363"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"next_visual_word / previous_visual_word call self.next_visual/previous_visual in a loop, and each iteration recomputes visual_clusters (which itself does two Cluster::from_byte_index lookups). For long whitespace runs or long lines this is O(n) cluster lookups per word jump, repeated; on large buffers word navigation can become noticeably slow. Same pattern in hard_line_start/hard_line_end which scan line-by-line.","fix":"Consider caching the cluster pair across the loop iterations (the `right` of one step is the `left` of the next) to avoid redundant from_byte_index lookups.","locations":[{"ref":"parley/src/editing/cursor.rs:196-244","code":"  196 |     pub fn next_visual_word<B: Brush>(&self, layout: &Layout<B>) -> Self {\n  197 |         let mut cur = *self;\n  198 |         loop {\n  199 |             let next = cur.next_visual(layout);\n  200 |             if next == cur {\n  201 |                 break;\n  202 |             }\n  203 |             cur = next;\n  204 |             let [Some(left), Some(right)] = cur.visual_clusters(layout) else {\n  205 |                 break;\n  206 |             };\n  207 |             if left.is_rtl() {\n  208 |                 if left.is_word_boundary() && !left.is_space_or_nbsp() {\n  209 |                     break;\n  210 |                 }\n  211 |             } else if right.is_word_boundary() && !left.is_space_or_nbsp() {\n  212 |                 break;\n  213 |             }\n  214 |         }\n  215 |         cur\n  216 |     }\n  217 | \n  218 |     /// Returns a new cursor that is positioned at the previous word boundary\n  219 |     /// in visual order.\n  220 |     #[must_use]\n  221 |     pub fn previous_visual_word<B: Brush>(&self, layout: &Layout<B>) -> Self {\n  222 |         let mut cur = *self;\n  223 |         loop {\n  224 |             let next = cur.previous_visual(layout);\n  225 |             if next == cur {\n  226 |                 break;\n  227 |             }\n  228 |             cur = next;\n  229 |             let [Some(left), Some(right)] = cur.visual_clusters(layout) else {\n  230 |                 break;\n  231 |             };\n  232 |             if left.is_rtl() {\n  233 |                 if left.is_word_boundary()\n  234 |                     && (left.is_space_or_nbsp()\n  235 |                         || (right.is_word_boundary() && !right.is_space_or_nbsp()))\n  236 |                 {\n  237 |                     break;\n  238 |                 }\n  239 |             } else if right.is_word_boundary() && !right.is_space_or_nbsp() {\n  240 |                 break;\n  241 |             }\n  242 |         }\n  243 |         cur\n  244 |     }","lines":49,"link":"https://github.com/linebender/parley/blob/435aa1d798b5004c77ea47ef7400886a1f4d4216/parley/src/editing/cursor.rs#L196-L244"},{"ref":"parley/src/editing/selection.rs:346-436","code":"  346 |     pub fn hard_line_start<B: Brush>(&self, layout: &Layout<B>, extend: bool) -> Self {\n  347 |         if let Some((mut hard_line_start_index, line)) = self.focus.line(layout) {\n  348 |             let mut result_byte_index = line.text_range().start;\n  349 |             loop {\n  350 |                 if hard_line_start_index == 0 {\n  351 |                     break;\n  352 |                 }\n  353 |                 let prev_index = hard_line_start_index - 1;\n  354 |                 let Some(line) = layout.get(prev_index) else {\n  355 |                     unreachable!(\n  356 |                         \"{hard_line_start_index} is a valid line in the layout, but {prev_index} isn't, despite the latter being smaller.\\n\\\n  357 |                         The layout has {} lines.\",\n  358 |                         layout.len()\n  359 |                     );\n  360 |                 };\n  361 |                 if matches!(line.break_reason(), BreakReason::Explicit) {\n  362 |                     // The start of the line 'hard_line_start_index' is the target point.\n  363 |                     break;\n  364 |                 }\n  365 |                 result_byte_index = line.text_range().start;\n  366 |                 hard_line_start_index = prev_index;\n  367 |             }\n  368 |             self.maybe_extend(\n  369 |                 Cursor::from_byte_index(layout, result_byte_index, Affinity::Downstream),\n  370 |                 extend,\n  371 |             )\n  372 |         } else {\n  373 |             *self\n  374 |         }\n  375 |     }\n  376 | \n  377 |     /// Returns a new selection with the focus moved to the end of the\n  378 |     /// current line.\n  379 |     ///\n  380 |     /// If `extend` is `true` then the current anchor will be retained,\n  381 |     /// otherwise the new selection will be collapsed.\n  382 |     #[must_use]\n  383 |     pub fn line_end<B: Brush>(&self, layout: &Layout<B>, extend: bool) -> Self {\n  384 |         if let Some((_, line)) = self.focus.line(layout) {\n  385 |             let (index, affinity) = (line.break_reason() == BreakReason::Explicit)\n  386 |                 .then(|| {\n  387 |                     Cluster::from_byte_index(layout, line.text_range().end - 1)\n  388 |                         .map(|cluster| (cluster.text_range().start, Affinity::Downstream))\n  389 |                 })\n  390 |                 .flatten()\n  391 |                 .unwrap_or_else(|| (line.text_range().end, Affinity::Upstream));\n  392 |             self.maybe_extend(Cursor::from_byte_index(layout, index, affinity), extend)\n  393 |         } else {\n  394 |             *self\n  395 |         }\n  396 |     }\n  397 | \n  398 |     /// Returns a new selection with the focus moved to just before the next hard line break.\n  399 |     ///\n  400 |     /// If `extend` is `true` then the current anchor will be retained,\n  401 |     /// otherwise the new selection will be collapsed.\n  402 |     #[must_u
