{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `UnixListener::bind_with_config`, `config.reuse_port` is checked but its body is entirely\ncommented out (line 41-43). The function silently does nothing when `reuse_port: true` is\nrequested, with a `// TODO` comment noting possible kernel-version issues but providing no\nerror to the caller. Users who rely on SO_REUSEPORT get silent no-op behaviour.","fix":"Return an `io::Error` with `ErrorKind::Unsupported` when `reuse_port` is requested but\ncannot be set, or actually call `sys_listener.set_reuse_port(true)?` and propagate the\nkernel error.","locations":[{"ref":"monoio/src/net/unix/listener.rs:40-43","code":"   40 |         if config.reuse_port {\n   41 |             // TODO: properly handle this. Warn?\n   42 |             // this seems to cause an error on current (>6.x) kernels:\n   43 |             // sys_listener.set_reuse_port(true)?;","lines":4,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/net/unix/listener.rs#L40-L43"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"In UringInner::tick (uring/mod.rs lines 376-396), completion events with user_data values\nbetween MIN_REVERSED_USERDATA and u64::MAX (excluding the exact values TIMEOUT_USERDATA,\nEVENTFD_USERDATA, POLLER_USERDATA, CANCEL_USERDATA) are silently ignored via the catch-all arm\n'_ if index >= MIN_REVERSED_USERDATA => ()'. CANCEL_USERDATA is u64::MAX which is also >=\nMIN_REVERSED_USERDATA, so cancel completions are silently discarded, which is intentional. But\nthe comment on MIN_REVERSED_USERDATA says 'u64::MAX - 3', and any future userdata value in that\nrange would be silently dropped without notice. More importantly, if a CQE arrives with a\nuser_data that maps to a valid slab index but has been freed (races from a kernel bug or\nincorrect cancel), ops.complete would call unwrap_unchecked on a None slab entry, triggering UB.","fix":"Add a safety check: replace unwrap_unchecked with an explicit is_none check that logs/ignores stale completions, guarding against out-of-range or already-freed slab indices.","locations":[{"ref":"monoio/src/driver/uring/mod.rs:376-396","code":"  376 |     fn tick(&mut self) -> io::Result<()> {\n  377 |         let cq = self.uring.completion();\n  378 | \n  379 |         for cqe in cq {\n  380 |             let index = cqe.user_data();\n  381 |             match index {\n  382 |                 #[cfg(feature = \"sync\")]\n  383 |                 EVENTFD_USERDATA => self.eventfd_installed = false,\n  384 |                 #[cfg(feature = \"poll-io\")]\n  385 |                 POLLER_USERDATA => {\n  386 |                     self.poller_installed = false;\n  387 |                     self.poll.tick(Some(Duration::ZERO))?;\n  388 |                 }\n  389 |                 _ if index >= MIN_REVERSED_USERDATA => (),\n  390 |                 // # Safety\n  391 |                 // Here we can make sure the result is valid.\n  392 |                 _ => unsafe { self.ops.complete(index as _, resultify(&cqe), cqe.flags()) },\n  393 |             }\n  394 |         }\n  395 |         Ok(())\n  396 |     }","lines":21,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/driver/uring/mod.rs#L376-L396"},{"ref":"monoio/src/driver/uring/mod.rs:597-603","code":"  597 |     // # Safety\n  598 |     // Caller must make sure the result is valid.\n  599 |     #[inline]\n  600 |     unsafe fn complete(&mut self, index: usize, result: io::Result<u32>, flags: u32) {\n  601 |         let lifecycle = unsafe { self.slab.get(index).unwrap_unchecked() };\n  602 |         lifecycle.complete(result, flags);\n  603 |     }","lines":7,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/driver/uring/mod.rs#L597-L603"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"On Windows, `UdpSocket::set_reuse_address` (lines 178-183) creates a `socket2::Socket` from\nthe raw socket but never calls `socket.set_reuse_address(reuse)`. It immediately calls\n`into_raw_socket()` and unconditionally returns `Ok(())`. The SO_REUSEADDR socket option is\ntherefore never applied on Windows, while the caller receives success.\nThe same silent no-op exists in `set_reuse_port` on Windows (lines 197-202).","fix":"Call `socket.set_reuse_address(reuse)?` (and `socket.set_reuse_port(reuse)?`) before\n`into_raw_socket()` on the Windows path, propagating any error.","locations":[{"ref":"monoio/src/net/udp.rs:178-184","code":"  178 |         #[cfg(windows)]\n  179 |         let r = {\n  180 |             let socket = unsafe { socket2::Socket::from_raw_socket(self.fd.as_raw_socket()) };\n  181 |             let _ = socket.into_raw_socket();\n  182 |             Ok(())\n  183 |         };\n  184 |         r","lines":7,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/net/udp.rs#L178-L184"},{"ref":"monoio/src/net/udp.rs:197-203","code":"  197 |         #[cfg(windows)]\n  198 |         let r = {\n  199 |             let socket = unsafe { socket2::Socket::from_raw_socket(self.fd.as_raw_socket()) };\n  200 |             let _ = socket.into_raw_socket();\n  201 |             Ok(())\n  202 |         };\n  203 |         r","lines":7,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/net/udp.rs#L197-L203"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"critical","difficulty":"easy","description":"WriteVecAt::uring_op passes libc::AT_FDCWD as the file descriptor instead of self.fd.raw_fd().\nThis means any io-uring scatter-write-at operation silently writes to the current working directory\nfile descriptor rather than the intended file. The legacy_call path (line 241) correctly uses\nself.fd.raw_fd(), so only the io-uring path is broken.","fix":"Replace types::Fd(libc::AT_FDCWD) with types::Fd(self.fd.raw_fd()) in WriteVecAt::uring_op.","locations":[{"ref":"monoio/src/driver/op/write.rs:222-229","code":"  222 |     fn uring_op(&mut self) -> io_uring::squeue::Entry {\n  223 |         opcode::Writev::new(\n  224 |             types::Fd(libc::AT_FDCWD),\n  225 |             self.buf_vec.read_iovec_ptr(),\n  226 |             self.buf_vec.read_iovec_len() as _,\n  227 |         )\n  228 |         .offset(self.offset)\n  229 |         .build()","lines":8,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/driver/op/write.rs#L222-L229"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"medium","description":"In monoio/src/driver/iocp/mod.rs, update_sockets_events() retains update_queue entries\nwhere error.is_some(). This keeps permanently-failing sockets in the queue so they are\nretried on every subsequent park() call. Because update() resets error to None at the\nstart and then may set it again, a socket whose AFD poll registration always fails will\nspin indefinitely, consuming CPU on every poll wake-up without making progress or\nsurfacing the error to the user.","fix":"The retain predicate should keep sockets that still need processing (e.g., those with a\npending deletion or those whose update did not yet complete), not only the errored ones.\nTypically the queue should be drained entirely after each update pass and sockets re-added\nwhen they need another update (as mio does), or errored sockets should be reported to callers\nrather than silently re-queued.","locations":[{"ref":"monoio/src/driver/iocp/mod.rs:83-92","code":"   83 |     unsafe fn update_sockets_events(&self) -> std::io::Result<()> {\n   84 |         let mut queue = self.update_queue.lock().unwrap();\n   85 |         for sock in queue.iter_mut() {\n   86 |             let mut sock_internal = sock.lock().unwrap();\n   87 |             if !sock_internal.delete_pending {\n   88 |                 sock_internal.update(sock)?;\n   89 |             }\n   90 |         }\n   91 | \n   92 |         queue.retain(|sock| sock.lock().unwrap().error.is_some());","lines":10,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/driver/iocp/mod.rs#L83-L92"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`UnixListener::into_raw_fd` (lines 169-185) uses `MaybeUninit::uninit().assume_init()` to\nmanufacture fake values of `SharedFd` and `Option<std::os::unix::net::UnixListener>` so that\nthey can be swapped out of the `ManuallyDrop<Self>`. Both types have non-trivial `Drop`\nimpls; calling `assume_init()` on uninitialized memory for types with such invariants is\nundefined behaviour per the Rust reference, even if those fake values never reach `drop`\nin practice. The `#[allow(invalid_value)]` suppressor confirms the intent but not the safety.","fix":"Use `std::ptr::read` to move values out of the `ManuallyDrop`, which is the standard safe\npattern for this situation:\n  let fd = unsafe { std::ptr::read(&this.fd) };\n  let sys_listener = unsafe { std::ptr::read(&this.sys_listener) };\n  let _ = sys_listener.unwrap().into_raw_fd();\n  fd.try_unwrap().expect(\"unexpected multiple reference to rawfd\")","locations":[{"ref":"monoio/src/net/unix/listener.rs:170-184","code":"  170 |         let mut this = ManuallyDrop::new(self);\n  171 |         #[allow(invalid_value)]\n  172 |         #[allow(clippy::uninit_assumed_init)]\n  173 |         let (mut fd, mut sys_listener) = unsafe {\n  174 |             (\n  175 |                 MaybeUninit::uninit().assume_init(),\n  176 |                 MaybeUninit::uninit().assume_init(),\n  177 |             )\n  178 |         };\n  179 |         std::mem::swap(&mut this.fd, &mut fd);\n  180 |         std::mem::swap(&mut this.sys_listener, &mut sys_listener);\n  181 |         let _ = sys_listener.take().unwrap().into_raw_fd();\n  182 | \n  183 |         fd.try_unwrap()\n  184 |             .expect(\"unexpected multiple reference to rawfd\")","lines":15,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/net/unix/listener.rs#L170-L184"}]},
{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"`uring_detect.rs` uses `static mut URING_SUPPORTED: bool` (line 67) read outside the\n`Once::call_once` closure (line 74). While `std::sync::Once` provides an acquire barrier on\nreturn that makes the write visible, `static mut` accessed from multiple threads - even with\n`Once` synchronization - is flagged as undefined behavior by the Rust compiler (starting from\nthe `static_mut_refs` lint) and by Miri. The correct idiom is `OnceLock<bool>` or\n`AtomicBool` with `Relaxed` load after `Once`.","fix":"Replace `static mut URING_SUPPORTED: bool` with `static URING_SUPPORTED: OnceLock<bool>` and\nuse `URING_SUPPORTED.get_or_init(detect_uring_inner)` to avoid both the unsafe block and the\n`Once` boilerplate.","locations":[{"ref":"monoio/src/utils/uring_detect.rs:67-75","code":"   67 |     static mut URING_SUPPORTED: bool = false;\n   68 |     static INIT: std::sync::Once = std::sync::Once::new();\n   69 | \n   70 |     unsafe {\n   71 |         INIT.call_once(|| {\n   72 |             URING_SUPPORTED = detect_uring_inner();\n   73 |         });\n   74 |         URING_SUPPORTED\n   75 |     }","lines":9,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/utils/uring_detect.rs#L67-L75"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"In EventWaker::wake the error return value of libc::write is silently discarded. While this is\nacceptable for a best-effort wakeup (the comment explains it), the actual return type is\nio::Result<()> which implies the write succeeded. A failed write means the io_uring ring will not\nwake up, causing the runtime to sleep until the next timeout instead of processing pending work.\nThe return value should either be checked or the function signature should reflect the\nbest-effort nature.","fix":"Either check the libc::write return value and return the error, or change the function to return () and update callers to not expect a Result.","locations":[{"ref":"monoio/src/driver/uring/waker.rs:31-37","code":"   31 |         let buf = 0x1u64.to_ne_bytes();\n   32 |         unsafe {\n   33 |             // SAFETY: Writing number to eventfd is thread safe.\n   34 |             libc::write(self.raw, buf.as_ptr().cast(), buf.len());\n   35 |             Ok(())\n   36 |         }\n   37 |     }","lines":7,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/driver/uring/waker.rs#L31-L37"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In monoio-compat/src/safe_wrapper.rs poll_write(), when a write future completes\nimmediately (Poll::Ready on the first poll after arming), the code copies user data into\nthe owned buffer and launches AsyncWriteRentExt::write_all. If the underlying stream can\naccept the data synchronously the write completes in the same poll_write call, which is\nefficient. However, write_all is used instead of write, meaning if the stream can only\naccept N < len bytes the write_all will loop internally, keeping the write_fut armed and\ncausing the NEXT poll_write to see an armed future and wait for completion before accepting\nnew data. The effective throughput is serialized per write_all even when partial writes\nwould allow pipelining. Using write() and buffering partial bytes would better match the\ntokio AsyncWrite contract.","fix":"Replace AsyncWriteRentExt::write_all with a single AsyncWriteRent::write, track how many\nbytes were accepted, and return that count from poll_write. Use the existing write buffer\nto hold the pending bytes and manage the partial-write state across poll invocations.","locations":[{"ref":"monoio-compat/src/safe_wrapper.rs:131-163","code":"  131 |         // now we should arm it again.\n  132 |         // we will copy the data and return Ready.\n  133 |         // Though return Ready does not mean really ready, but this helps preventing\n  134 |         // poll_write different data.\n  135 | \n  136 |         // # Safety\n  137 |         // We always make sure the write_buf is Some.\n  138 |         let mut owned_buf = unsafe { this.write_buf.take().unwrap_unchecked() };\n  139 |         let owned_buf_mut = owned_buf.buf_to_write();\n  140 |         let len = buf.len().min(owned_buf_mut.len());\n  141 |         // # Safety\n  142 |         // We can make sure the buf and buf_mut_slice have len size data.\n  143 |         unsafe { std::ptr::copy_nonoverlapping(buf.as_ptr(), owned_buf_mut.as_mut_ptr(), len) };\n  144 |         unsafe { owned_buf.set_init(len) };\n  145 | \n  146 |         // we must leak the stream\n  147 |         let stream = unsafe { &mut *this.stream.get() };\n  148 |         this.write_fut\n  149 |             .arm_future(AsyncWriteRentExt::write_all(stream, owned_buf));\n  150 |         match this.write_fut.poll(cx) {\n  151 |             std::task::Poll::Ready((ret, mut buf)) => {\n  152 |                 unsafe { buf.set_init(0) };\n  153 |                 this.write_buf = Some(buf);\n  154 |                 if ret.is_err() {\n  155 |                     return std::task::Poll::Ready(ret);\n  156 |                 }\n  157 |             }\n  158 |             std::task::Poll::Pending => (),\n  159 |         }\n  160 |         // if there is no error, no matter it is sending or sent, we will\n  161 |         // return Ready.\n  162 |         std::task::Poll::Ready(Ok(len))\n  163 |     }","lines":33,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio-compat/src/safe_wrapper.rs#L131-L163"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`raw_waker` in `task/waker.rs` (lines 90-103) allocates a `RawWakerVTable` on the stack\nand returns a reference to it as part of `RawWaker`. For the vtable address to be stable\nand consistent (required for `Waker::will_wake` to work correctly across waker instances\nfor the same task), Rust must const-promote this value to a static. This promotion is\nimplementation-defined and not guaranteed by the language spec for all configurations.\n\nAdditionally, `waker_ref` (lines 19-38) documents the intent to use \"a single vtable\"\nto fix `will_wake` (see the comment at line 24), but `raw_waker` creates a new vtable on\nevery call. If const-promotion does not deduplicate vtable addresses across monomorphization\nunits, `Waker::will_wake` will always return `false`, causing unnecessary redundant scheduling\nof tasks that re-register the same waker.","fix":"Use a lazily-initialized or `const`-declared static `RawWakerVTable` per `(T, S)` pair\nto guarantee a stable vtable address. For example:\n  fn get_vtable<T: Future, S: Schedule>() -> &'static RawWakerVTable {\n      &RawWakerVTable::new(clone_waker::<T,S>, wake_by_val::<T,S>, wake_by_ref::<T,S>, drop_waker::<T,S>)\n  }\n(Rust will const-promote this since all arguments are fn-pointer constants.)","locations":[{"ref":"monoio/src/task/waker.rs:90-103","code":"   90 | pub(super) fn raw_waker<T, S>(header: *const Header) -> RawWaker\n   91 | where\n   92 |     T: Future,\n   93 |     S: Schedule,\n   94 | {\n   95 |     let ptr = header as *const ();\n   96 |     let vtable = &RawWakerVTable::new(\n   97 |         clone_waker::<T, S>,\n   98 |         wake_by_val::<T, S>,\n   99 |         wake_by_ref::<T, S>,\n  100 |         drop_waker::<T, S>,\n  101 |     );\n  102 |     RawWaker::new(ptr, vtable)\n  103 | }","lines":14,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/task/waker.rs#L90-L103"},{"ref":"monoio/src/task/waker.rs:19-38","code":"   19 | pub(super) fn waker_ref<T, S>(header: &Header) -> WakerRef<'_, S>\n   20 | where\n   21 |     T: Future,\n   22 |     S: Schedule,\n   23 | {\n   24 |     // `Waker::will_wake` uses the VTABLE pointer as part of the check. This\n   25 |     // means that `will_wake` will always return false when using the current\n   26 |     // task's waker. (discussion at rust-lang/rust#66281).\n   27 |     //\n   28 |     // To fix this, we use a single vtable. Since we pass in a reference at this\n   29 |     // point and not an *owned* waker, we must ensure that `drop` is never\n   30 |     // called on this waker instance. This is done by wrapping it with\n   31 |     // `ManuallyDrop` and then never calling drop.\n   32 |     let waker = unsafe { ManuallyDrop::new(Waker::from_raw(raw_waker::<T, S>(header))) };\n   33 | \n   34 |     WakerRef {\n   35 |         waker,\n   36 |         _p: PhantomData,\n   37 |     }\n   38 | }","lines":20,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/task/waker.rs#L19-L38"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`Slab::mark_remove()` resets `w_page_id` to 0 on every compaction interval (line 110),\nforcing the next `insert` to scan all pages from the beginning even if a non-zero write page\nis valid. After a compact run where no pages are freed (the last page is not empty), the\nwriter will unnecessarily iterate over all lower pages before finding the correct write page,\nadding O(NUM_PAGES) overhead proportional to how many pages are allocated.","fix":"Only reset `w_page_id` to 0 when a page is actually freed, not unconditionally.","locations":[{"ref":"monoio/src/utils/slab.rs:105-126","code":"  105 |     pub(crate) fn mark_remove(&mut self) {\n  106 |         // compact\n  107 |         self.generation = self.generation.wrapping_add(1);\n  108 |         if self.generation.is_multiple_of(COMPACT_INTERVAL) {\n  109 |             // reset write page index\n  110 |             self.w_page_id = 0;\n  111 |             // find the last allocated page and try to drop\n  112 |             if let Some((id, last_page)) = self\n  113 |                 .pages\n  114 |                 .iter_mut()\n  115 |                 .enumerate()\n  116 |                 .rev()\n  117 |                 .find_map(|(id, p)| p.as_mut().map(|p| (id, p)))\n  118 |             {\n  119 |                 if last_page.is_empty() && id > 0 {\n  120 |                     unsafe {\n  121 |                         *self.pages.get_unchecked_mut(id) = None;\n  122 |                     }\n  123 |                 }\n  124 |             }\n  125 |         }\n  126 |     }","lines":22,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/utils/slab.rs#L105-L126"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"monoio/src/driver/iocp/event.rs Events::clear() re-zeroes every entry in the statuses\nboxed slice (up to the full capacity) even though only a subset of them were populated in\nthe last poll. For large capacity values this is unnecessary work on each poll cycle.","fix":"Track the high-water mark of used entries and only zero those, or zero entries lazily when\nthey are written in get_many rather than eagerly on clear.","locations":[{"ref":"monoio/src/driver/iocp/event.rs:116-121","code":"  116 |     pub fn clear(&mut self) {\n  117 |         self.events.clear();\n  118 |         for status in self.statuses.iter_mut() {\n  119 |             *status = unsafe { std::mem::zeroed() };\n  120 |         }\n  121 |     }","lines":6,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/driver/iocp/event.rs#L116-L121"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"The file monoio/src/driver/pool.rs (Pool, ProvidedBuf) is never included in any module declaration\nin the driver. There is no 'mod pool' or 'pub(crate) mod pool' anywhere in\nmonoio/src/driver/mod.rs or any other file. The file is orphaned and its types are unused. This\nalso means the memory-leak bug in Pool::new has no current runtime impact, but the file adds\nmaintenance confusion.","fix":"Either add the module to driver/mod.rs and wire it up correctly, or delete the file.","locations":[{"ref":"monoio/src/driver/pool.rs:1-78","code":"    1 | use crate::driver;\n    2 | \n    3 | use io_uring::{opcode, IoUring};\n    4 | use std::io;\n    5 | use std::mem::ManuallyDrop;\n    6 | \n    7 | /// Buffer pool shared with kernel\n    8 | pub(crate) struct Pool {\n    9 |     mem: *mut u8,\n   10 |     num: usize,\n   11 |     size: usize,\n   12 | }\n   13 | \n   14 | pub(crate) struct ProvidedBuf {\n   15 |     buf: ManuallyDrop<Vec<u8>>,\n   16 |     driver: driver::Handle,\n   17 | }\n   18 | \n   19 | impl Pool {\n   20 |     pub(super) fn new(num: usize, size: usize) -> Pool {\n   21 |         let total = num * size;\n   22 |         let mut mem = ManuallyDrop::new(Vec::<u8>::with_capacity(total));\n   23 | \n   24 |         assert_eq!(mem.capacity(), total);\n   25 | \n   26 |         Pool {\n   27 |             mem: mem.as_mut_ptr(),\n   28 |             num,\n   29 |             size,\n   30 |         }\n   31 |     }\n   32 | \n   33 |     pub(super) fn provide_buffers(&self, uring: &mut IoUring) -> io::Result<()> {\n   34 |         let op = opcode::ProvideBuffers::new(self.mem, self.size as _, self.num as _, 0, 0)\n   35 |             .build()\n   36 |             .user_data(0);\n   37 | \n   38 |         // Scoped to ensure `sq` drops before trying to submit\n   39 |         {\n   40 |             let mut sq = uring.submission();\n   41 | \n   42 |             if unsafe { sq.push(&op) }.is_err() {\n   43 |                 unimplemented!(\"when is this hit?\");\n   44 |             }\n   45 |         }\n   46 | \n   47 |         uring.submit_and_wait(1)?;\n   48 | \n   49 |         let mut cq = uring.completion();\n   50 |         for cqe in &mut cq {\n   51 |             assert_eq!(cqe.user_data(), 0);\n   52 |         }\n   53 | \n   54 |         Ok(())\n   55 |     }\n   56 | }\n   57 | \n   58 | impl ProvidedBuf {}\n   59 | \n   60 | impl Drop for ProvidedBuf {\n   61 |     fn drop(&mut self) {\n   62 |         let mut driver = self.driver.borrow_mut();\n   63 |         let pool = &driver.pool;\n   64 | \n   65 |         let ptr = self.buf.as_mut_ptr();\n   66 |         let bid = (ptr as usize - pool.mem as usize) / pool.size;\n   67 | \n   68 |         let op = opcode::ProvideBuffers::new(ptr, pool.size as _, 1, 0, bid as _)\n   69 |             .build()\n   70 |             .user_data(u64::MAX);\n   71 | \n   72 |         let mut sq = driver.uring.submission();\n   73 | \n   74 |         if unsafe { sq.push(&op) }.is_err() {\n   75 |             unimplemented!();\n   76 |         }\n   77 |     }\n   78 | }","lines":78,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/driver/pool.rs#L1-L78"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"`monoio/src/utils/mod.rs` applies `#[allow(dead_code)]` to both `pub(crate) mod slab` and\n`pub(crate) mod thread_id` (lines 5-8). Both modules ARE actively used by the driver code\n(slab by `driver/uring/mod.rs`, `driver/legacy/mod.rs`, `driver/poll.rs`; thread_id by\n`runtime.rs`). The blanket suppressor hides any future dead code introduced inside those\nmodules and gives a false impression that the modules are unused. Additionally, `linked_list.rs`\nhas a file-level `#![allow(unused)]` (line 10) that similarly masks dead-code warnings across\nthe entire file.","fix":"Remove the `#[allow(dead_code)]` attributes from the module declarations in mod.rs and the `#![allow(unused)]` from linked_list.rs; apply targeted `#[allow(dead_code)]` only to specific items that are intentionally unused (e.g. the `prev`/`next` fields in `PointersInner`).","locations":[{"ref":"monoio/src/utils/mod.rs:5-8","code":"    5 | #[allow(dead_code)]\n    6 | pub(crate) mod slab;\n    7 | #[allow(dead_code)]\n    8 | pub(crate) mod thread_id;","lines":4,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/utils/mod.rs#L5-L8"},{"ref":"monoio/src/utils/linked_list.rs:10","code":"   10 | #![allow(unused)]","lines":1,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/utils/linked_list.rs#L10"}]},

{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"medium","difficulty":"easy","description":"In Send::uring_op the zero_copy_flag_guard function has a comment saying zero-copy is only\neffective for writes over around '10 KB', but the threshold constant is actually 10 * 1024 * 1024\n= 10 MB. The constant value is plausible (some sources cite a higher threshold), but the comment\nis wrong by a factor of 1024 and will mislead maintainers.","fix":"Change the comment to say '10 MB' to match the actual value, or adjust the threshold to match documentation intent.","locations":[{"ref":"monoio/src/driver/op/send.rs:63-66","code":"   63 |             // According to Linux's documentation, zero copy introduces extra overhead and\n   64 |             // is only considered effective for at writes over around 10 KB.\n   65 |             // see also: https://www.kernel.org/doc/html/v4.16/networking/msg_zerocopy.html\n   66 |             const MSG_ZEROCOPY_THRESHOLD: usize = 10 * 1024 * 1024;","lines":4,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/driver/op/send.rs#L63-L66"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The IoBuf trait safety comment says only \"impl it safely\" (monoio/src/buf/io_buf.rs, line 21),\nwhich is a placeholder that provides no actual guidance. The trait is `unsafe` and\nimplementors must uphold specific pointer-stability invariants that are not documented here.","fix":"Replace \"impl it safely\" with a meaningful description of the invariants implementors must\nuphold: read_ptr() must return a stable pointer that does not move while the runtime holds\nthe buffer, and bytes_init() must not exceed the actual number of initialized bytes at that\naddress.","locations":[{"ref":"monoio/src/buf/io_buf.rs:20-22","code":"   20 | /// # Safety\n   21 | /// impl it safely\n   22 | pub unsafe trait IoBuf: Unpin + 'static {","lines":3,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/buf/io_buf.rs#L20-L22"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The comment at the end of `blocking::read_vectored` in `windows.rs` reads:\n\"Due to `read` will init each buffer, so we do need to set buffer len here.\"\nThe phrasing is self-contradictory: \"do need to\" implies the code is about to do something,\nbut the very next line simply returns without setting the initialized length. The intent was\napparently \"do NOT need to\" (because each inner `read()` call calls `set_init` on its\ntemporary `ManuallyDrop<Vec>`). However even that reasoning is incorrect: `set_init` is called\non the temporary wrapper, not on `buf_vec` itself. The comment misleads future maintainers.","fix":"Rewrite the comment to accurately describe what is happening. If `buf_vec.set_init()` is intentionally omitted (relying on the inner reads), document why that is safe. Otherwise add `unsafe { buf_vec.set_init(total_bytes_read) };` before the return.","locations":[{"ref":"monoio/src/fs/file/windows.rs:79","code":"   79 |         // Due to `read` will init each buffer, so we do need to set buffer len here.","lines":1,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/fs/file/windows.rs#L79"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"`MissedTickBehavior::Skip::next_timeout` (interval.rs line 322-330) includes a comment\nclaiming the `try_into()` failure condition is \"period would have to be longer than\n`now - timeout`\". This is backwards: the modulo result is always strictly less than\n`period.as_nanos()`, so the `try_into::<u64>()` fails only when `period` itself exceeds\n`u64::MAX` nanoseconds (~584 years), not when `now - timeout` is large. Additionally, the\n`expect` message \"too much time has elapsed since the interval was supposed to tick\" is\nmisleading - the error is caused by an excessively long period, not elapsed time.","fix":"Correct the comment and expect message:\n```rust\n// Fails only if `period` itself exceeds ~584 years (u64::MAX nanoseconds).\n.expect(\"period is longer than 584 years, which is unsupported\")\n```","locations":[{"ref":"monoio/src/time/interval.rs:319-332","code":"  319 |                     - Duration::from_nanos(\n  320 |                         ((now - timeout).as_nanos() % period.as_nanos())\n  321 |                             .try_into()\n  322 |                             // This operation is practically guaranteed not to\n  323 |                             // fail, as in order for it to fail, `period` would\n  324 |                             // have to be longer than `now - timeout`, and both\n  325 |                             // would have to be longer than 584 years.\n  326 |                             //\n  327 |                             // If it did fail, there's not a good way to pass\n  328 |                             // the error along to the user, so we just panic.\n  329 |                             .expect(\n  330 |                                 \"too much time has elapsed since the interval was supposed to tick\",\n  331 |                             ),\n  332 |                     )","lines":14,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/time/interval.rs#L319-L332"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"Three spelling errors in comments/doc strings:\n1. examples/tcp_legacy.rs:48 - \"read form it\" should be \"read from it\"\n2. examples/tcp_uring.rs:52 - same \"read form it\" typo\n3. monoio-macros/src/entry.rs:308 - \"parallism\" should be \"parallelism\"\n4. monoio/src/buf/slice.rs:223 - \"Ofset\" should be \"Offset\"\n5. monoio/src/blocking.rs:27 - \"contrusted\" should be \"constructed\"","fix":"Fix spelling in each location.","locations":[{"ref":"examples/tcp_legacy.rs:48","code":"   48 |             println!(\"[Server] Accepted a new connection, will read form it\");","lines":1,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/examples/tcp_legacy.rs#L48"},{"ref":"examples/tcp_uring.rs:52","code":"   52 |             println!(\"[Server] Accepted a new connection, will read form it\");","lines":1,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/examples/tcp_uring.rs#L52"},{"ref":"monoio-macros/src/entry.rs:308","code":"  308 |             // auto detected parallism","lines":1,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio-macros/src/entry.rs#L308"},{"ref":"monoio/src/buf/slice.rs:223","code":"  223 |     /// Ofset in the underlying buffer at which this slice ends.","lines":1,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/buf/slice.rs#L223"},{"ref":"monoio/src/blocking.rs:27","code":"   27 | /// BlockingTask is contrusted by monoio, ThreadPool impl","lines":1,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/blocking.rs#L27"}]},

const FINDINGS     = JSON.parse(document.getElementById('D').textContent);
const PROJECT_INFO = JSON.parse(document.getElementById('PI').textContent);
const SEVS     = ['critical','high','medium','low','negligible'];
const STATUSES = ['open','fixed','wont-fix','false-positive'];
const ALL_TYPES = [...new Set(FINDINGS.map(f => f.type))].sort();
// Build lookup map for O(1) access
const FINDING_BY_ID = new Map(FINDINGS.map(f => [f.id, f]));
// Only severities actually present in the report — the filter bar hides the rest.
const PRESENT_SEVS = SEVS.filter(s => FINDINGS.some(f => (f.severity || 'medium') === s));
// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};
const PRESENT_DIFFS = DIFFICULTY_ORDER.filter(d => FINDINGS.some(f => f.difficulty === d));
const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', searchScope: 'all', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),
};
const statuses = {};

// Persistence
function loadStatuses() {
  try { Object.assign(statuses, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}
}
function saveStatuses() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    if (S.searchScope !== 'all') p.set('qs', S.searchScope);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('qs'))  { S.searchScope = p.get('qs'); }
  document.getElementById('search-scope').classList.toggle('active', S.searchScope === 'locations');
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build a [project] header block from embedded PROJECT_INFO, so the exported
// findings.toml is self-contained (doesn't depend on a sibling project-info.toml
// that a second, separately-triggered download could silently fail to save).
// '' when there is no project info at all.
function buildProjectToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = PROJECT_INFO || {};
  if (!Object.keys(pi).length) return '';
  const lines = ['[project]'];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n\n';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return buildProjectToml() + chunks.join('\n\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystacks per finding (cleared on full re-render).
// Two variants: everything (default), and file/folder paths only - for when a
// search term (e.g. a directory name like 'dlls/abc') also happens to appear
// inside description/fix prose and you only want path matches.
const _hay = new Map();
const _hayLoc = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}
function hayLocOf(f) {
  if (!_hayLoc.has(f.id)) {
    _hayLoc.set(f.id, f.locations.map(l => l.ref).join(' ').toLowerCase());
  }
  return _hayLoc.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (S.searchScope === 'locations') {
      if (!hayLocOf(f).includes(q)) return false;
    } else if (!hayOf(f).includes(q) && !st.includes(q)) {
      return false;
    }
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  _hayLoc.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    // Single download (was two) - a second auto-triggered download is commonly
    // blocked by the browser unless the user explicitly allows it, which silently
    // drops project-info.toml. Embedding [project] in findings.toml itself avoids
    // that failure mode entirely.
    downloadText(buildFindingsToml(), 'findings.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});
document.getElementById('search-scope').addEventListener('click', e => {
  S.searchScope = S.searchScope === 'locations' ? 'all' : 'locations';
  e.currentTarget.classList.toggle('active', S.searchScope === 'locations');
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
