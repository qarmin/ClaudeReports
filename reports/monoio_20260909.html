<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"File::sync_all and File::sync_data call Op::fsync / Op::datasync with .unwrap() on the result of\nOp::submit_with. If the driver is unavailable or the submission queue is full, these calls panic\ninstead of returning an io::Result error to the caller. The surrounding async fn already returns\nio::Result<()>, so propagating the error with ? would be safe and consistent.","fix":"Replace .unwrap() with ? on both Op::fsync and Op::datasync calls.","locations":[{"ref":"monoio/src/fs/file/mod.rs:461","code":"  461 |         let op = Op::fsync(&self.fd).unwrap();","lines":1,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/fs/file/mod.rs#L461"},{"ref":"monoio/src/fs/file/mod.rs:501","code":"  501 |         let op = Op::datasync(&self.fd).unwrap();","lines":1,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/fs/file/mod.rs#L501"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"In IoVecMeta::consume (used by several op result handlers via set_init) the function calls\npanic!('try to consume more than owned') if the caller passes a byte count larger than the total\nbuffer size. The set_init contract is 'safety: the kernel wrote n bytes', so a buggy driver\nreturning a count larger than the buffer length (e.g., due to io-uring kernel bug or race) will\npanic the runtime thread rather than returning an error. This is not in the audited files but\nthe panic propagates through read/recv completion paths in op/read.rs and op/recv.rs.","fix":"Add a bounds check in set_init / consume and return an error or saturate instead of panicking.","locations":[{"ref":"monoio/src/driver/op/read.rs:30-33","code":"   30 |                     if let Ok(read_len) = res {\n   31 |                         // Safety: the kernel wrote `n` bytes to the buffer\n   32 |                         unsafe { buf.set_init(read_len) };\n   33 |                     }","lines":4,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/driver/op/read.rs#L30-L33"},{"ref":"monoio/src/driver/op/recv.rs:71-76","code":"   71 |         if let Ok(n) = res {\n   72 |             // Safety: the kernel wrote `n` bytes to the buffer.\n   73 |             unsafe {\n   74 |                 buf.set_init(n);\n   75 |             }\n   76 |         }","lines":6,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/driver/op/recv.rs#L71-L76"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`Metadata::modified()` and `Metadata::accessed()` cast `st_mtime` / `st_atime` (both `i64`\non Linux and macOS) to `u64` without checking for negative values. Files with modification\nor access timestamps before the Unix epoch (1970-01-01) have negative values. Casting a\nnegative `i64` to `u64` wraps to a very large number (e.g. `-1i64 as u64 == u64::MAX`).\n`SystemTime::UNIX_EPOCH + Duration::new(u64::MAX, ...)` panics in debug mode and overflows\nsilently in release. Negative timestamps are used by some tools (e.g. tar archives, test\nfixtures) and can also arise after clock adjustments.","fix":"Mirror the standard library's approach: check `mtime >= 0` and use either\n`UNIX_EPOCH + Duration::from_secs(mtime as u64)` or\n`UNIX_EPOCH - Duration::from_secs((-mtime) as u64)` accordingly. Return an error if the\ntimestamp cannot be represented.","locations":[{"ref":"monoio/src/fs/metadata/mod.rs:199-202","code":"  199 |         let mtime = self.0.stat.st_mtime;\n  200 |         let mtime_nsec = self.0.stat.st_mtime_nsec as u32;\n  201 | \n  202 |         Ok(SystemTime::UNIX_EPOCH + std::time::Duration::new(mtime as u64, mtime_nsec))","lines":4,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/fs/metadata/mod.rs#L199-L202"},{"ref":"monoio/src/fs/metadata/mod.rs:221-224","code":"  221 |         let atime = self.0.stat.st_atime;\n  222 |         let atime_nsec = self.0.stat.st_atime_nsec as u32;\n  223 | \n  224 |         Ok(SystemTime::UNIX_EPOCH + std::time::Duration::new(atime as u64, atime_nsec))","lines":4,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/fs/metadata/mod.rs#L221-L224"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"The `uring_op!` macro (used in the Windows blocking file I/O path and elsewhere) calls\n`.unwrap()` on the `Op::new(...)` result. `Op` creation can fail with `io::Error` when the\nio_uring submission ring is full (`EBUSY`), or in legacy mode when the poller cannot\naccept new entries. Panicking here instead of propagating the error contradicts the function's\n`BufResult<usize, T>` return type and can crash the entire runtime under load.","fix":"Convert the panic to a proper error return, consuming the buffer:\n```rust\nlet op = match $crate::driver::op::Op::$op_name(fd, $buf_name, $($pos)?) {\n    Ok(op) => op,\n    Err(e) => return (Err(e), /* buf recovered somehow */),\n};\n```\nBecause the buf was moved into the Op constructor, this requires the constructor to return\nthe buffer on failure, similar to how `asyncify_op!` handles it.","locations":[{"ref":"monoio/src/fs/mod.rs:90","code":"   90 |             let op = $crate::driver::op::Op::$op_name(fd, $buf_name, $($pos)?).unwrap();","lines":1,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/fs/mod.rs#L90"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`FilePermissions::mode()` is marked `unimplemented!()` on all non-Linux targets. The public\n`PermissionsExt::mode()` on `Permissions` delegates directly to this function. Any call to\n`permissions.mode()` on macOS or other non-Linux Unix platforms panics at runtime with\n`not implemented`. There is no `#[cfg]` guard on the public trait impl to prevent this.","fix":"Either implement the function for all unix targets (the `mode` field already stores the full\nmode bits on all platforms), or add a `#[cfg(target_os = \"linux\")]` guard to the\n`PermissionsExt` impl and document the limitation. The simplest fix is to remove the\nplatform guard on the `fn mode` helper and just return `self.mode as u32` everywhere.","locations":[{"ref":"monoio/src/fs/permissions.rs:30-33","code":"   30 |     #[cfg(not(target_os = \"linux\"))]\n   31 |     fn mode(&self) -> u32 {\n   32 |         unimplemented!()\n   33 |     }","lines":4,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/fs/permissions.rs#L30-L33"},{"ref":"monoio/src/fs/permissions.rs:57-61","code":"   57 | impl PermissionsExt for Permissions {\n   58 |     /// Returns the underlying raw `mode_t` bits that are used by the OS.\n   59 |     fn mode(&self) -> u32 {\n   60 |         self.0.mode()\n   61 |     }","lines":5,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/fs/permissions.rs#L57-L61"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`Instant`'s `Sub<Duration>` operator calls `checked_sub(...).unwrap()` with no documentation\nof the panic. Any caller that subtracts a `Duration` larger than the `Instant`'s age (e.g.\n`instant - too_large_duration`) will panic with an unhelpful message. The standard library's\nown `Instant - Duration` also panics, so this is consistent, but the wrapper type gives no\nindication via docs or a `#[track_caller]` that this can fail in user code.","fix":"Add a `# Panics` doc section to the `Sub<Duration>` impl, or implement it with `checked_sub` returning `Option<Instant>` and provide a separate checked variant.","locations":[{"ref":"monoio/src/time/instant.rs:196-198","code":"  196 |     fn sub(self, rhs: Duration) -> Instant {\n  197 |         Instant::from_std(self.std.checked_sub(rhs).unwrap())\n  198 |     }","lines":3,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/time/instant.rs#L196-L198"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In pool.rs ProvidedBuf::drop, the buffer-ID calculation is:\n  let bid = (ptr as usize - pool.mem as usize) / pool.size;\nIf ptr is somehow not within the pool allocation (due to a bug in the higher-level caller),\nthis subtraction underflows (wrapping subtraction in debug mode panics, in release mode gives a\nhuge bid). Since pool.rs is dead code this has no current runtime impact, but it is a latent\nsafety issue if the file were activated.","fix":"Add a debug_assert that ptr >= pool.mem && ptr < pool.mem + pool.num * pool.size before computing bid.","locations":[{"ref":"monoio/src/driver/pool.rs:63-66","code":"   63 |         let pool = &driver.pool;\n   64 | \n   65 |         let ptr = self.buf.as_mut_ptr();\n   66 |         let bid = (ptr as usize - pool.mem as usize) / pool.size;","lines":4,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/driver/pool.rs#L63-L66"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`UCred::get_peer_cred` on macOS (`ucred.rs`, line 72) uses `assert!` instead of a proper\nerror return to verify that `getsockopt` returned a `pid_size` equal to `size_of::<pid_t>()`.\nIf the kernel somehow writes a different-sized value (defensive programming case), the\nfunction panics rather than returning an `io::Error`, crashing the process.","fix":"Replace `assert!(pid_size.assume_init() == ...)` with an explicit `if` that returns\n`Err(io::Error::new(io::ErrorKind::InvalidData, \"unexpected pid_size\"))`.","locations":[{"ref":"monoio/src/net/unix/ucred.rs:72","code":"   72 |             assert!(pid_size.assume_init() == (size_of::<pid_t>() as u32));","lines":1,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/net/unix/ucred.rs#L72"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`get_current_thread_id()` in `thread_id.rs` (line 15-17) calls `CURRENT.with(...)` which\nasserts that the scoped thread-local is set (panics with \"cannot access a scoped thread local\nvariable without calling `set` first\" if called outside the monoio runtime). This function is\n`pub(crate)` and called from `runtime.rs` in paths that are already inside the runtime, but\nthe panic is entirely undocumented and could surprise someone adding a new call site.","fix":"Add a `# Panics` doc comment explaining the runtime-context requirement, or use `try_get_current_thread_id` in contexts where the runtime may not be active.","locations":[{"ref":"monoio/src/utils/thread_id.rs:15-17","code":"   15 | pub(crate) fn get_current_thread_id() -> usize {\n   16 |     crate::runtime::CURRENT.with(|ctx| ctx.thread_id)\n   17 | }","lines":3,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/utils/thread_id.rs#L15-L17"}]},
{"id":"UAF_1","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"medium","description":"`Slab::get()` creates two simultaneous `&mut` references to the same allocation: `slab` (a\nraw-pointer-derived `&mut Slab<T>`) and `page` (a `&mut Page<T>` that is a field inside\n`slab.pages`). Both are stored in the returned `Ref<'a, T>` struct. Having two overlapping\n`&mut` references coexist in a live struct is undefined behavior under Rust's aliasing model,\nregardless of whether accesses actually interleave at runtime. In `Ref::remove()` (line 150),\n`self.page.remove()` is called first and then `self.slab.mark_remove()`. If the page becomes\nempty and is the last allocated page, `mark_remove()` may set `self.slab.pages[id] = None`,\ndropping the `Page<T>` while `self.page` still nominally holds a `&mut Page<T>` to it (the\nreference is dead at that point but the compiler is not guaranteed to know this).","fix":"Avoid the dual-mut-ref pattern. Instead of storing `&mut Slab` alongside `&mut Page`, store\nonly the page index in `Ref` and resolve the page borrow on each access. Alternatively, use\nraw pointers (NonNull<Page<T>>) for the page field and retain only the `&mut Slab` for\n`mark_remove`.","locations":[{"ref":"monoio/src/utils/slab.rs:46-61","code":"   46 |     pub(crate) fn get(&mut self, key: usize) -> Option<Ref<'_, T>> {\n   47 |         let page_id = get_page_id(key);\n   48 |         // here we make 2 mut ref so we must make it safe.\n   49 |         let slab = unsafe { &mut *(self as *mut Slab<T>) };\n   50 |         let page = match unsafe { self.pages.get_unchecked_mut(page_id) } {\n   51 |             Some(page) => page,\n   52 |             None => return None,\n   53 |         };\n   54 |         let index = key - page.prev_len;\n   55 |         match page.get_entry_mut(index) {\n   56 |             None => None,\n   57 |             Some(entry) => match entry {\n   58 |                 Entry::Vacant(_) => None,\n   59 |                 Entry::Occupied(_) => Some(Ref { slab, page, index }),\n   60 |             },\n   61 |         }","lines":16,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/utils/slab.rs#L46-L61"},{"ref":"monoio/src/utils/slab.rs:139-153","code":"  139 | pub(crate) struct Ref<'a, T> {\n  140 |     slab: &'a mut Slab<T>,\n  141 |     page: &'a mut Page<T>,\n  142 |     index: usize,\n  143 | }\n  144 | \n  145 | impl<T> Ref<'_, T> {\n  146 |     #[allow(unused)]\n  147 |     pub(crate) fn remove(self) -> T {\n  148 |         // # Safety\n  149 |         // We make sure the index is valid.\n  150 |         let val = unsafe { self.page.remove(self.index).unwrap_unchecked() };\n  151 |         self.slab.mark_remove();\n  152 |         val\n  153 |     }","lines":15,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/utils/slab.rs#L139-L153"}]},
{"id":"UAF_2","type":"use_after_free","type_label":"Use After Free","severity":"medium","difficulty":"medium","description":"monoio-compat/src/tcp_unsafe.rs uses RawBuf to hold a raw pointer into the caller's buffer\nslice while a kernel I/O operation is in flight. The struct's safety contract (documented in\nthe module comment) requires callers to keep the slice alive until Poll::Ready is returned,\nbut nothing in the Rust type system enforces this. A caller that moves or deallocates the\nbuffer between poll invocations results in the io_uring or epoll kernel operation writing\ninto freed memory. The Dst helper adds a weak assertion (assert_eq on ptr/len), but this\nonly catches a DIFFERENT buffer being supplied on a retry, not the original buffer being\nfreed before the operation completes.","fix":"This is an intentional unsafe design; the safety doc is the primary mitigation. Consider\nadding a PhantomData<&'a [u8]> lifetime marker or upgrading to the safe StreamWrapper for\nany new code. At minimum ensure the documented safety invariant is preserved in all\ntest usages.","locations":[{"ref":"monoio-compat/src/tcp_unsafe.rs:71-104","code":"   71 | impl tokio::io::AsyncRead for TcpStreamCompat {\n   72 |     fn poll_read(\n   73 |         self: std::pin::Pin<&mut Self>,\n   74 |         cx: &mut std::task::Context<'_>,\n   75 |         buf: &mut tokio::io::ReadBuf<'_>,\n   76 |     ) -> std::task::Poll<std::io::Result<()>> {\n   77 |         let this = self.get_mut();\n   78 |         let buf_unfilled = unsafe { buf.unfilled_mut() };\n   79 |         let (ptr, len) = (buf_unfilled.as_ptr() as *const u8, buf_unfilled.len());\n   80 | \n   81 |         // Set or check read_dst\n   82 |         // Note: the check can not prevent memory crash when user misuse it.\n   83 |         let raw_buf = this.read_dst.check_and_to_rawbuf(ptr, len);\n   84 |         if !this.read_fut.armed() {\n   85 |             // we must leak the stream\n   86 |             let stream = unsafe { &mut *this.stream.get() };\n   87 |             this.read_fut\n   88 |                 .arm_future(AsyncReadRent::read(stream, raw_buf));\n   89 |         }\n   90 | \n   91 |         let (ret, _) = match this.read_fut.poll(cx) {\n   92 |             std::task::Poll::Ready(r) => r,\n   93 |             std::task::Poll::Pending => {\n   94 |                 return std::task::Poll::Pending;\n   95 |             }\n   96 |         };\n   97 |         this.read_dst.reset();\n   98 |         std::task::Poll::Ready(ret.map(|n| {\n   99 |             unsafe {\n  100 |                 buf.assume_init(n);\n  101 |             }\n  102 |             buf.advance(n);\n  103 |         }))\n  104 |     }","lines":34,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio-compat/src/tcp_unsafe.rs#L71-L104"},{"ref":"monoio-compat/src/buf.rs:5-12","code":"    5 | /// RawBuf is not a real buf. It only hold the pointer of the buffer.\n    6 | /// Users must make sure the buffer behind the pointer is always valid.\n    7 | /// Which means, user must:\n    8 | /// 1. await the future with RawBuf Ready before drop the real buffer\n    9 | /// 2. make sure the pointer and length is valid before the future Ready\n   10 | pub(crate) struct RawBuf {\n   11 |     ptr: *const u8,\n   12 |     len: usize,","lines":8,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio-compat/src/buf.rs#L5-L12"}]},
{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"medium","description":"Pool::new allocates a heap buffer using ManuallyDrop<Vec<u8>> and stores only the raw pointer in\nPool.mem, with no Drop implementation on Pool. When a Pool value is dropped the allocated memory\nis never freed, constituting a guaranteed memory leak. The size is num*size bytes (e.g. 1024*4096\n= 4 MB for default settings). ProvidedBuf also borrows from this allocation so the unsafe contract\nrequires the Pool outlive all ProvidedBufs, yet there is no mechanism to enforce this.","fix":"Implement Drop for Pool: reconstruct the Vec from Pool.mem/num/size and let it drop normally, which will free the memory.","locations":[{"ref":"monoio/src/driver/pool.rs:20-31","code":"   20 |     pub(super) fn new(num: usize, size: usize) -> Pool {\n   21 |         let total = num * size;\n   22 |         let mut mem = ManuallyDrop::new(Vec::<u8>::with_capacity(total));\n   23 | \n   24 |         assert_eq!(mem.capacity(), total);\n   25 | \n   26 |         Pool {\n   27 |             mem: mem.as_mut_ptr(),\n   28 |             num,\n   29 |             size,\n   30 |         }\n   31 |     }","lines":12,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/driver/pool.rs#L20-L31"}]},
{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"In `UnixListener::accept` (and `cancelable_accept`) and `UnixSeqpacketListener::accept`,\nthe accepted fd is extracted with `fd.into_inner()` and then passed to `SharedFd::new::<false>(fd.into_inner() as _)?`.\nThe `?` operator can propagate an error after the raw fd integer has been consumed from the\ncompletion result. Because `into_inner()` converts the value to a raw integer with no `Drop`,\nand `SharedFd::new` failure returns an `io::Error` without closing the fd, the accepted\nconnection's file descriptor is leaked when `SharedFd::new` fails.\nThe same pattern exists in `UnixSeqpacketListener::accept`.","fix":"Close the raw fd before propagating the error:\n  let raw = fd.into_inner() as RawFd;\n  let shared = SharedFd::new::<false>(raw).map_err(|e| { unsafe { libc::close(raw); } e })?;\n  let stream = UnixStream::from_shared_fd(shared);","locations":[{"ref":"monoio/src/net/unix/listener.rs:80","code":"   80 |         let stream = UnixStream::from_shared_fd(SharedFd::new::<false>(fd.into_inner() as _)?);","lines":1,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/net/unix/listener.rs#L80"},{"ref":"monoio/src/net/unix/listener.rs:110","code":"  110 |         let stream = UnixStream::from_shared_fd(SharedFd::new::<false>(fd.into_inner() as _)?);","lines":1,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/net/unix/listener.rs#L110"},{"ref":"monoio/src/net/unix/seq_packet/listener.rs:53","code":"   53 |         let stream = UnixSeqpacket::from_shared_fd(SharedFd::new::<false>(fd.into_inner() as _)?);","lines":1,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/net/unix/seq_packet/listener.rs#L53"}]},
{"id":"MEM_3","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"In `UnixSeqpacket::pair`, the two raw file descriptors are obtained via `pair::<RawFd>(libc::SOCK_SEQPACKET)`.\n`RawFd` is just `i32` - it has no `Drop` that closes the OS fd.\nThe tuple is then constructed as:\n  Ok((Self::from_shared_fd(SharedFd::new::<false>(a)?), Self::from_shared_fd(SharedFd::new::<false>(b)?)))\nRust evaluates tuple fields left-to-right. If `SharedFd::new(a)` succeeds and `SharedFd::new(b)`\nfails (propagating `?`), the first `UnixSeqpacket` (holding `a`) is dropped and its fd is\ncorrectly closed, but `b` is a bare `RawFd` integer and its OS fd is never closed.","fix":"Wrap the raw fds in a scope-guard or close-on-drop type before calling SharedFd::new, e.g.:\n  let (a, b): (RawFd, RawFd) = pair(libc::SOCK_SEQPACKET)?;\n  let shared_a = SharedFd::new::<false>(a).map_err(|e| { unsafe { libc::close(a); } e })?;\n  let shared_b = SharedFd::new::<false>(b).map_err(|e| { unsafe { libc::close(b); } e })?;\n  Ok((Self::from_shared_fd(shared_a), Self::from_shared_fd(shared_b)))","locations":[{"ref":"monoio/src/net/unix/seq_packet/mod.rs:34-39","code":"   34 |     pub fn pair() -> io::Result<(Self, Self)> {\n   35 |         let (a, b) = pair(libc::SOCK_SEQPACKET)?;\n   36 |         Ok((\n   37 |             Self::from_shared_fd(SharedFd::new::<false>(a)?),\n   38 |             Self::from_shared_fd(SharedFd::new::<false>(b)?),\n   39 |         ))","lines":6,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/net/unix/seq_packet/mod.rs#L34-L39"}]},
{"id":"MEM_4","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"`CtrlC` stores a heap-allocated `Box<Waker>` in the global `WAKER: AtomicPtr<Waker>` when\npolled (line 36). If the `CtrlC` future is dropped after being polled at least once (waker\ninstalled) but before the Ctrl+C signal fires, no code ever retrieves and frees the waker\npointer. `CtrlC` has no `Drop` implementation to clear `WAKER`. Because `CtrlC::new()` returns\nan error on the second call (the `ctrlc` crate only allows one handler), the stale pointer can\nnever be cleared by subsequent `CtrlC` instances, resulting in a permanent `Box<Waker>` leak.","fix":"Implement `Drop for CtrlC` that atomically swaps `null` into `WAKER` and drops the resulting\n`Box<Waker>` if the pointer was non-null.","locations":[{"ref":"monoio/src/utils/ctrlc.rs:29-43","code":"   29 | impl Future for CtrlC {\n   30 |     type Output = ();\n   31 |     fn poll(self: Pin<&mut Self>, cx: &mut Context<'_>) -> Poll<Self::Output> {\n   32 |         if ACTIVE.swap(false, Ordering::SeqCst) {\n   33 |             Poll::Ready(())\n   34 |         } else {\n   35 |             let new_waker = Box::new(cx.waker().clone());\n   36 |             let old_waker_ptr = WAKER.swap(Box::into_raw(new_waker), Ordering::SeqCst);\n   37 |             if !old_waker_ptr.is_null() {\n   38 |                 let _ = unsafe { Box::from_raw(old_waker_ptr) };\n   39 |             }\n   40 |             Poll::Pending\n   41 |         }\n   42 |     }\n   43 | }","lines":15,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/utils/ctrlc.rs#L29-L43"},{"ref":"monoio/src/utils/ctrlc.rs:50-63","code":"   50 |     pub fn new() -> Result<Self, Error> {\n   51 |         let unpark_handler = UnparkHandle::current();\n   52 |         set_handler(move || {\n   53 |             ACTIVE.store(true, Ordering::SeqCst);\n   54 |             let waker_ptr = WAKER.swap(null_mut(), Ordering::SeqCst);\n   55 |             if !waker_ptr.is_null() {\n   56 |                 unsafe { Box::from_raw(waker_ptr) }.wake();\n   57 |             }\n   58 |             let _ = unpark_handler.unpark();\n   59 |         })?;\n   60 |         Ok(CtrlC {\n   61 |             _private: PhantomData,\n   62 |         })\n   63 |     }","lines":14,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/utils/ctrlc.rs#L50-L63"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`ClockTime::deadline_to_tick` (time/driver/mod.rs line 108-111) computes\n`t + Duration::from_nanos(999_999)` using standard `Add` for `Instant`, which panics\non overflow in debug builds. If `t` is extremely close to `Instant::MAX` (which cannot\nhappen through `Instant::far_future()` due to its 30-year cap, but could happen if\ncallers pass a manually-constructed near-max `Instant`), this panics rather than\nsaturating or returning an error.","fix":"Use `t.checked_add(Duration::from_nanos(999_999)).unwrap_or(t)` to avoid the panic on\noverflow, or document that the input must be at most `Instant::MAX - 1ms`.","locations":[{"ref":"monoio/src/time/driver/mod.rs:108-111","code":"  108 |     pub(self) fn deadline_to_tick(&self, t: Instant) -> u64 {\n  109 |         // Round up to the end of a ms\n  110 |         self.instant_to_tick(t + Duration::from_nanos(999_999))\n  111 |     }","lines":4,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/time/driver/mod.rs#L108-L111"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"critical","difficulty":"medium","description":"IoVecMeta::consume() does not advance iov_base when partially consuming an iovec. In the\nOrdering::Greater branch the code computes a new pointer with `iov_base.add(amt)` but\ndiscards the result (prefixed with `let _ =`), so only iov_len is reduced while iov_base\nstays at the original address. When this partially-consumed IoVecMeta is later passed to a\nwritev/readv syscall the kernel writes to the BEGINNING of the buffer rather than after the\nalready-written bytes, silently corrupting data in write_vectored_all loops.","fix":"Replace `let _ = unsafe { iovec.iov_base.add(amt) };` with\n`iovec.iov_base = unsafe { iovec.iov_base.add(amt) };`\nto actually advance the base pointer. The Windows branch (line 148) has the same problem:\n`_ = wsabuf.len.add(amt);` should be `wsabuf.buf = unsafe { wsabuf.buf.add(amt as usize) };`\ninstead of the no-op expression.","locations":[{"ref":"monoio/src/buf/vec_wrapper.rs:118-122","code":"  118 |                     std::cmp::Ordering::Greater => {\n  119 |                         let _ = unsafe { iovec.iov_base.add(amt) };\n  120 |                         iovec.iov_len -= amt;\n  121 |                         self.offset = offset;\n  122 |                         return;","lines":5,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/buf/vec_wrapper.rs#L118-L122"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"IoVecMeta::read_iovec_len() and write_iovec_len() return self.data.len() (the total number\nof iovec elements) instead of self.data.len() - self.offset (the number remaining after\npartial consumption). The corresponding ptr methods correctly advance to data[offset], so\nthe kernel receives a pointer past the start but a count that includes the already-consumed\nentries. In a write_vectored_all loop, after the first partial write calls consume(), the\nsubsequent writev syscall is given a count that extends past the end of the allocated vec,\ncausing the kernel to read uninitialized or foreign memory as iovec descriptors.","fix":"Change `self.data.len()` to `self.data.len() - self.offset` in all four\nread_iovec_len / write_iovec_len / read_wsabuf_len / write_wsabuf_len impls of IoVecMeta\n(lines 170, 178, 190, 200).","locations":[{"ref":"monoio/src/buf/vec_wrapper.rs:170-171","code":"  170 |     fn read_iovec_len(&self) -> usize {\n  171 |         self.data.len()","lines":2,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/buf/vec_wrapper.rs#L170-L171"},{"ref":"monoio/src/buf/vec_wrapper.rs:190-191","code":"  190 |     fn write_iovec_len(&mut self) -> usize {\n  191 |         self.data.len()","lines":2,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/buf/vec_wrapper.rs#L190-L191"},{"ref":"monoio/src/io/async_write_rent_ext.rs:58-74","code":"   58 |         while written < len {\n   59 |             let (res, meta_) = self.writev(meta).await;\n   60 |             meta = meta_;\n   61 |             match res {\n   62 |                 Ok(0) => {\n   63 |                     return (\n   64 |                         Err(std::io::Error::new(\n   65 |                             std::io::ErrorKind::WriteZero,\n   66 |                             \"failed to write whole buffer\",\n   67 |                         )),\n   68 |                         buf,\n   69 |                     )\n   70 |                 }\n   71 |                 Ok(n) => {\n   72 |                     written += n;\n   73 |                     meta.consume(n);\n   74 |                 }","lines":17,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/io/async_write_rent_ext.rs#L58-L74"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"RecvMsg::wait calls complete.data.info.0.assume_init() (the sockaddr_storage) even when the\nreceive succeeded with 0 bytes from a connection-oriented socket. For a 0-byte receive the kernel\nmay not have written a valid source address. More critically, if ss_family is neither AF_INET nor\nAF_INET6 (e.g., AF_UNIX, AF_UNSPEC on an unconnected socket, or a future protocol), the code hits\nunreachable!(), causing a panic. The wait method is exposed as a public async fn, so any caller\npassing a socket that receives a datagram from an unexpected address family will crash the process.","fix":"Return an error instead of calling unreachable!() for unknown address families, and guard assume_init behind a check that the received byte count is non-zero for connection-oriented cases.","locations":[{"ref":"monoio/src/driver/op/recv.rs:162-210","code":"  162 |     pub(crate) async fn wait(self) -> BufResult<(usize, SocketAddr), T> {\n  163 |         let complete = self.await;\n  164 |         let res = complete.meta.result.map(|v| v.into_inner() as _);\n  165 |         let mut buf = complete.data.buf;\n  166 | \n  167 |         let res = res.map(|n| {\n  168 |             let storage = unsafe { complete.data.info.0.assume_init() };\n  169 | \n  170 |             let addr = unsafe {\n  171 |                 match storage.ss_family as _ {\n  172 |                     AF_INET => {\n  173 |                         // Safety: if the ss_family field is AF_INET then storage must be a\n  174 |                         // sockaddr_in.\n  175 |                         let addr: &sockaddr_in = transmute(&storage);\n  176 |                         #[cfg(unix)]\n  177 |                         let ip = Ipv4Addr::from(addr.sin_addr.s_addr.to_ne_bytes());\n  178 |                         #[cfg(windows)]\n  179 |                         let ip = Ipv4Addr::from(addr.sin_addr.S_un.S_addr.to_ne_bytes());\n  180 |                         let port = u16::from_be(addr.sin_port);\n  181 |                         SocketAddr::V4(SocketAddrV4::new(ip, port))\n  182 |                     }\n  183 |                     AF_INET6 => {\n  184 |                         // Safety: if the ss_family field is AF_INET6 then storage must be a\n  185 |                         // sockaddr_in6.\n  186 |                         let addr: &sockaddr_in6 = transmute(&storage);\n  187 |                         #[cfg(unix)]\n  188 |                         let ip = Ipv6Addr::from(addr.sin6_addr.s6_addr);\n  189 |                         #[cfg(windows)]\n  190 |                         let ip = Ipv6Addr::from(addr.sin6_addr.u.Byte);\n  191 |                         let port = u16::from_be(addr.sin6_port);\n  192 |                         #[cfg(unix)]\n  193 |                         let scope_id = addr.sin6_scope_id;\n  194 |                         #[cfg(windows)]\n  195 |                         let scope_id = addr.Anonymous.sin6_scope_id;\n  196 |                         SocketAddr::V6(SocketAddrV6::new(ip, port, addr.sin6_flowinfo, scope_id))\n  197 |                     }\n  198 |                     _ => {\n  199 |                         unreachable!()\n  200 |                     }\n  201 |                 }\n  202 |             };\n  203 | \n  204 |             // Safety: the kernel wrote `n` bytes to the buffer.\n  205 |             unsafe { buf.set_init(n) };\n  206 | \n  207 |             (n, addr)\n  208 |         });\n  209 |         (res, buf)\n  210 |     }","lines":49,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/driver/op/recv.rs#L162-L210"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`AsyncReadRent` for `Cursor<T>` never advances the cursor position after a read or readv.\nBoth `read` and `readv` compute a temporary `&[u8]` slice starting at `pos` and delegate to\nthe `&[u8]` impl, which updates only the temporary reference (`*self = remainder`). The\n`Cursor` itself is never mutated via `set_position`. Every subsequent call to `read`/`readv`\ntherefore starts from the same position, causing `read_exact` (and similar loops) to re-read\nthe same bytes indefinitely instead of advancing.","fix":"After the delegated read, call `self.set_position(pos + n as u64)` where `n` is the number of\nbytes actually consumed. Example for `read`:\n```rust\nlet (res, buf) = (&slice[pos as usize..]).read(buf).await;\nif let Ok(n) = res {\n    self.set_position(pos + n as u64);\n}\n(res, buf)\n```","locations":[{"ref":"monoio/src/io/async_read_rent.rs:198-219","code":"  198 | impl<T: AsRef<[u8]>> AsyncReadRent for Cursor<T> {\n  199 |     async fn read<B: IoBufMut>(&mut self, buf: B) -> BufResult<usize, B> {\n  200 |         let pos = self.position();\n  201 |         let slice: &[u8] = (*self).get_ref().as_ref();\n  202 | \n  203 |         if pos > slice.len() as u64 {\n  204 |             return (Ok(0), buf);\n  205 |         }\n  206 | \n  207 |         (&slice[pos as usize..]).read(buf).await\n  208 |     }\n  209 | \n  210 |     async fn readv<B: IoVecBufMut>(&mut self, buf: B) -> BufResult<usize, B> {\n  211 |         let pos = self.position();\n  212 |         let slice: &[u8] = (*self).get_ref().as_ref();\n  213 | \n  214 |         if pos > slice.len() as u64 {\n  215 |             return (Ok(0), buf);\n  216 |         }\n  217 | \n  218 |         (&slice[pos as usize..]).readv(buf).await\n  219 |     }","lines":22,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/io/async_read_rent.rs#L198-L219"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`AsyncReadRentExt::read_u128` is declared and implemented with type `u16` instead of `u128`.\nThe trait method signature in the trait declaration uses `u16` (line 60), and the blanket impl\nalso instantiates `reader_be_impl!` with `u16` (line 148). Because `reader_be_impl!` reads\n`size_of::<$n_ty>()` bytes, `read_u128` reads only 2 bytes instead of 16, silently truncating\nthe result to a 16-bit value returned as a 16-bit type. Any caller expecting a 128-bit value\ngets garbage.","fix":"Change both occurrences of `u16` to `u128`: `reader_trait!(ReadU128Future, u128, read_u128)` and `reader_be_impl!(ReadU128Future, u128, read_u128)`.","locations":[{"ref":"monoio/src/io/async_read_rent_ext.rs:60","code":"   60 |     reader_trait!(ReadU128Future, u16, read_u128);","lines":1,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/io/async_read_rent_ext.rs#L60"},{"ref":"monoio/src/io/async_read_rent_ext.rs:148","code":"  148 |     reader_be_impl!(ReadU128Future, u16, read_u128);","lines":1,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/io/async_read_rent_ext.rs#L148"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`read_f32_le` and `read_f64_le` are implemented using `reader_be_impl!` instead of\n`reader_le_impl!`. The suffix `_le` promises little-endian byte order, but both methods\ncall `from_be_bytes` on the read data instead of `from_le_bytes`. The same bug is\npresent in the cancelable variants `cancelable_read_f32_le` and `cancelable_read_f64_le`.\nOn little-endian hosts (x86-64) these methods produce the wrong value for any non-zero input.","fix":"Replace `reader_be_impl!` with `reader_le_impl!` for `read_f32_le`, `read_f64_le`, `cancelable_read_f32_le`, and `cancelable_read_f64_le`.","locations":[{"ref":"monoio/src/io/async_read_rent_ext.rs:167-168","code":"  167 |     reader_be_impl!(ReadF32LEFuture, f32, read_f32_le);\n  168 |     reader_be_impl!(ReadF64LEFuture, f64, read_f64_le);","lines":2,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/io/async_read_rent_ext.rs#L167-L168"},{"ref":"monoio/src/io/async_rent_cancelable_ext.rs:174-175","code":"  174 |     reader_be_impl!(ReadF32LEFuture, f32, cancelable_read_f32_le);\n  175 |     reader_be_impl!(ReadF64LEFuture, f64, cancelable_read_f64_le);","lines":2,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/io/async_rent_cancelable_ext.rs#L174-L175"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"When a user future panics inside `poll_future` (called from `Harness::poll_inner`), the panic\nunwinds through the runtime loop without ever calling `transition_to_idle` or\n`transition_to_complete`. The task state is left permanently in `RUNNING`, its reference count\nis not decremented, and any `JoinHandle` awaiting it will wait forever (the join waker is\nnever invoked). Any subsequent attempt to poll the task (e.g., if the runtime loop is somehow\nre-entered) will find `Stage::Running` and trigger `unreachable!`.\n\nThe panic-catching guard code is present but commented out with a note \"For efficiency we do\nnot catch\", making this a deliberate trade-off that is not documented for users.","fix":"Re-enable the commented-out `catch_unwind` guard in `poll_future` (lines 416-431) so that\nfuture panics are caught, the future is dropped, the task transitions to complete, and the\njoin handle is notified with a panic payload. Document the performance trade-off clearly.","locations":[{"ref":"monoio/src/task/harness.rs:412-450","code":"  412 | fn poll_future<T: Future>(core: &CoreStage<T>, cx: Context<'_>) -> Poll<()> {\n  413 |     // CHIHAI: For efficiency we do not catch.\n  414 | \n  415 |     // Poll the future.\n  416 |     // let output = panic::catch_unwind(panic::AssertUnwindSafe(|| {\n  417 |     //     struct Guard<'a, T: Future> {\n  418 |     //         core: &'a CoreStage<T>,\n  419 |     //     }\n  420 |     //     impl<'a, T: Future> Drop for Guard<'a, T> {\n  421 |     //         fn drop(&mut self) {\n  422 |     //             // If the future panics on poll, we drop it inside the panic\n  423 |     //             // guard.\n  424 |     //             self.core.drop_future_or_output();\n  425 |     //         }\n  426 |     //     }\n  427 |     //     let guard = Guard { core };\n  428 |     //     let res = guard.core.poll(cx);\n  429 |     //     mem::forget(guard);\n  430 |     //     res\n  431 |     // }));\n  432 |     let output = core.poll(cx);\n  433 | \n  434 |     // Prepare output for being placed in the core stage.\n  435 |     let output = match output {\n  436 |         // Ok(Poll::Pending) => return Poll::Pending,\n  437 |         // Ok(Poll::Ready(output)) => Ok(output),\n  438 |         // Err(panic) => Err(JoinError::panic(panic)),\n  439 |         Poll::Pending => return Poll::Pending,\n  440 |         Poll::Ready(output) => output,\n  441 |     };\n  442 | \n  443 |     // Catch and ignore panics if the future panics on drop.\n  444 |     // let _ = panic::catch_unwind(panic::AssertUnwindSafe(|| {\n  445 |     //     core.store_output(output);\n  446 |     // }));\n  447 |     core.store_output(output);\n  448 | \n  449 |     Poll::Ready(())\n  450 | }","lines":39,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/task/harness.rs#L412-L450"},{"ref":"monoio/src/task/harness.rs:53-66","code":"   53 |     pub(super) fn poll(self) {\n   54 |         trace!(\"MONOIO DEBUG[Harness]:: poll\");\n   55 |         match self.poll_inner() {\n   56 |             PollFuture::Notified => {\n   57 |                 // We should re-schedule the task.\n   58 |                 self.header().state.ref_inc();\n   59 |                 self.core().scheduler.yield_now(self.get_new_task());\n   60 |             }\n   61 |             PollFuture::Complete => {\n   62 |                 self.complete();\n   63 |             }\n   64 |             PollFuture::Done => (),\n   65 |         }\n   66 |     }","lines":14,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/task/harness.rs#L53-L66"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`TimeDriver`'s doc comment (lines 42-43) states: \"When an instance is dropped, any outstanding\nSleep instance that has not elapsed will be notified with an error.\" However, the `Drop` impl\nat lines 343-345 has `self.shutdown()` commented out. Outstanding `Sleep` futures are therefore\nnever notified when the driver drops - they silently remain pending and can never complete,\ncausing any task awaiting them to hang indefinitely.\nThe documented contract is violated.","fix":"Implement a `shutdown` method that iterates all registered timer entries and fires them with\n`Err(Error::shutdown())`, then call it from `Drop`. Remove the comment-only stub.","locations":[{"ref":"monoio/src/time/driver/mod.rs:42-43","code":"   42 | /// When an instance is dropped, any outstanding [`Sleep`][sleep] instance that\n   43 | /// has not elapsed will be notified with an error. At this point, calling","lines":2,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/time/driver/mod.rs#L42-L43"},{"ref":"monoio/src/time/driver/mod.rs:343-345","code":"  343 |     fn drop(&mut self) {\n  344 |         // self.shutdown();\n  345 |     }","lines":3,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/time/driver/mod.rs#L343-L345"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In monoio-compat/src/buf.rs, Buf::write_ptr() always returns a pointer to the start of the\nbacking allocation (self.data.as_ptr()), ignoring self.offset. This is intentional for the\ninternal read-buffer use case (fresh reads always fill from the start), but set_init() also\nresets offset to 0 (line 85). However, if a caller obtains write_ptr(), writes some bytes,\nand then calls set_init(n) with n less than what was actually written, the already-written\ndata beyond n is invisible. More concretely, the unsafe IoBufMut impl promises that\nwrite_ptr() + bytes_total() is valid writable space, but bytes_total() returns self.capacity\n(always the full buffer), while read_ptr() returns self.data.as_ptr().add(self.offset). The\ninconsistency between read_ptr/write_ptr means that after a partial read places data at\noffset 0, advancing offset, write_ptr still goes to 0 - so a subsequent write would\noverwrite unconsumed read data.","fix":"Ensure write_ptr() and read_ptr() are consistent. If write_ptr() is always offset 0 for\nfill operations, the code relying on this should never call write_ptr() after advancing\noffset without resetting via set_init. Add a safety comment clarifying this invariant and\nadd a debug_assert that offset==0 when write_ptr() is called.","locations":[{"ref":"monoio-compat/src/buf.rs:76-88","code":"   76 |     fn write_ptr(&mut self) -> *mut u8 {\n   77 |         self.data.as_ptr() as *mut u8\n   78 |     }\n   79 | \n   80 |     fn bytes_total(&mut self) -> usize {\n   81 |         self.capacity\n   82 |     }\n   83 | \n   84 |     unsafe fn set_init(&mut self, init: usize) {\n   85 |         self.offset = 0;\n   86 |         self.init = init;\n   87 |     }\n   88 | }","lines":13,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio-compat/src/buf.rs#L76-L88"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"IoVecMeta::from<&T> and IoVecMeta::from<&mut T> set self.len = 1 (the number of elements,\nnot the byte count). All other IoVecMeta constructors (read_vec_meta, write_vec_meta) set\nself.len to the sum of all iovec byte lengths. The public len() method is documented to\nreturn the total byte length, so From<&T> returns 1 instead of buf.bytes_init(). If\nwrite_vectored_all or a similar loop ever uses IoVecMeta created via From<&T> as the\nbyte-count sentinel for loop termination, it will stop after writing 1 byte.","fix":"Change `len: 1` to `len: buf.bytes_init()` (for IoBuf) and `len: buf.bytes_total()`\n(for IoBufMut) in both From impls to make the len() method return the actual byte count\nconsistently with read_vec_meta / write_vec_meta.","locations":[{"ref":"monoio/src/buf/vec_wrapper.rs:220-224","code":"  220 |         Self {\n  221 |             data: vec![item],\n  222 |             offset: 0,\n  223 |             len: 1,\n  224 |         }","lines":5,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/buf/vec_wrapper.rs#L220-L224"},{"ref":"monoio/src/buf/vec_wrapper.rs:240-243","code":"  240 |             data: vec![item],\n  241 |             offset: 0,\n  242 |             len: 1,\n  243 |         }","lines":4,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/buf/vec_wrapper.rs#L240-L243"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In shared_fd.rs, cvt_uring_poll (poll-io feature) clears O_NONBLOCK with fcntl(fd, F_SETFL, 0)\non the error path of deregister (cvt_comp). This unconditionally sets all file status flags to 0,\nnot just clears O_NONBLOCK. If the file descriptor had other status flags set (e.g. O_APPEND,\nO_ASYNC), they will be silently cleared. The rollback on failure at line 97 restores O_NONBLOCK\nbut not the original flags.","fix":"Before setting O_NONBLOCK, save the current flags with fcntl(F_GETFL) and restore the original flags (minus O_NONBLOCK) on the error rollback path.","locations":[{"ref":"monoio/src/driver/shared_fd.rs:76-101","code":"   76 |     #[cfg(all(target_os = \"linux\", feature = \"iouring\"))]\n   77 |     pub(crate) fn cvt_comp(&mut self, fd: RawFd) -> io::Result<()> {\n   78 |         let inner = match self {\n   79 |             Self::Uring(UringState::Legacy(inner)) => inner,\n   80 |             _ => return Ok(()),\n   81 |         };\n   82 |         let Some(token) = inner else {\n   83 |             return Err(io::Error::other(\"empty token\"));\n   84 |         };\n   85 |         let mut source = mio::unix::SourceFd(&fd);\n   86 |         crate::syscall!(fcntl@RAW(fd, libc::F_SETFL, 0))?;\n   87 |         CURRENT\n   88 |             .with(|inner| match inner {\n   89 |                 #[cfg(all(target_os = \"linux\", feature = \"iouring\"))]\n   90 |                 crate::driver::Inner::Uring(r) => {\n   91 |                     super::IoUringDriver::deregister_poll_io(r, &mut source, *token)\n   92 |                 }\n   93 |                 #[cfg(feature = \"legacy\")]\n   94 |                 crate::driver::Inner::Legacy(_) => panic!(\"unexpected legacy runtime\"),\n   95 |             })\n   96 |             .inspect_err(|_| {\n   97 |                 let _ = crate::syscall!(fcntl@RAW(fd, libc::F_SETFL, libc::O_NONBLOCK));\n   98 |             })?;\n   99 |         *self = State::Uring(UringState::Init);\n  100 |         Ok(())\n  101 |     }","lines":26,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/driver/shared_fd.rs#L76-L101"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In shared_fd.rs the try_unwrap method (unix path, lines 324-368) reads the State via a raw\nUnsafeCell pointer after calling ManuallyDrop::new on the Inner. It then std::mem::swaps the\nstate into a MaybeUninit::uninit().assume_init() temporary. The swap is sound only because the\noriginal UnsafeCell location is about to be forgotten (via ManuallyDrop), but the\nMaybeUninit::uninit().assume_init() on line 334 instantiates an uninitialized value of type\nUnsafeCell<State> in Rust, which is undefined behaviour even before the swap. Clippy and the\ncompiler warn about this with #[allow(invalid_value)] and #[allow(clippy::uninit_assumed_init)],\nconfirming the code relies on undefined behaviour. A memory-safe alternative exists using\nOption::take or ManuallyDrop::into_inner.","fix":"Use ManuallyDrop::into_inner on the ManuallyDrop<Inner> to take ownership cleanly, then match on the inner.state field without involving MaybeUninit uninit tricks.","locations":[{"ref":"monoio/src/driver/shared_fd.rs:329-335","code":"  329 |             Ok(inner) => {\n  330 |                 // Only drop Inner's state, skip its drop impl.\n  331 |                 let mut inner_skip_drop = ManuallyDrop::new(inner);\n  332 |                 #[allow(invalid_value)]\n  333 |                 #[allow(clippy::uninit_assumed_init)]\n  334 |                 let mut state = unsafe { MaybeUninit::uninit().assume_init() };\n  335 |                 std::mem::swap(&mut inner_skip_drop.state, &mut state);","lines":7,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/driver/shared_fd.rs#L329-L335"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In IoUringDriver::drop_op (uring/mod.rs line 524-530), when async-cancel is enabled and the\ncancel SQE fails to push to the submission queue, the code calls inner.submit() to drain the\nqueue and then attempts to push again. If the second push also fails (which should not happen\ngiven the submit, but is not verified), the error is silently dropped and the in-flight operation\nwill remain in the Ignored state forever, leaking the associated data box and potentially the fd.","fix":"Log or propagate the error if the second push fails, and consider that the operation data may be leaked.","locations":[{"ref":"monoio/src/driver/uring/mod.rs:519-533","code":"  519 |             #[cfg(feature = \"async-cancel\")]\n  520 |             if !_must_finished && !_skip_cancel {\n  521 |                 unsafe {\n  522 |                     let cancel = opcode::AsyncCancel::new(index as u64)\n  523 |                         .build()\n  524 |                         .user_data(u64::MAX);\n  525 | \n  526 |                     // Try push cancel, if failed, will submit and re-push.\n  527 |                     if inner.uring.submission().push(&cancel).is_err() {\n  528 |                         let _ = inner.submit();\n  529 |                         let _ = inner.uring.submission().push(&cancel);\n  530 |                     }\n  531 |                 }\n  532 |             }\n  533 |         }","lines":15,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/driver/uring/mod.rs#L519-L533"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"read_exact_at and write_all_at (fs/file/mod.rs) accumulate 'read' and 'written' as usize values\nand then cast them to u64 when computing the next offset: pos + read as u64. If the buffer is\nlarger than usize::MAX bytes (theoretically possible on 32-bit targets where usize is 32 bits\nand the buffer is provided by the caller), the usize accumulator wraps around before the cast,\nsilently corrupting the file offset. While exceedingly large buffers are unusual, the cast order\nshould be 'pos + (read as u64)' to preserve intent (the current parenthesisation already does\nthis correctly) but the intermediate 'read' variable can overflow on 32-bit if a single read\nreturns more than usize::MAX, which is impossible in practice. The real issue is that these\nfunctions do not guard against pos overflowing u64 when pos + total_read exceeds u64::MAX.","fix":"Add a checked_add for the offset computation and return an error if it would overflow u64.","locations":[{"ref":"monoio/src/fs/file/mod.rs:267-289","code":"  267 |         let len = buf.bytes_total();\n  268 |         let mut read = 0;\n  269 |         while read < len {\n  270 |             let slice = unsafe { buf.slice_mut_unchecked(read..len) };\n  271 |             let (res, slice) = self.read_at(slice, pos + read as u64).await;\n  272 |             buf = slice.into_inner();\n  273 |             match res {\n  274 |                 Ok(0) => {\n  275 |                     return (\n  276 |                         Err(io::Error::new(\n  277 |                             io::ErrorKind::UnexpectedEof,\n  278 |                             \"failed to fill whole buffer\",\n  279 |                         )),\n  280 |                         buf,\n  281 |                     )\n  282 |                 }\n  283 |                 Ok(n) => {\n  284 |                     read += n;\n  285 |                 }\n  286 |                 Err(ref e) if e.kind() == io::ErrorKind::Interrupted => {}\n  287 |                 Err(e) => return (Err(e), buf),\n  288 |             };\n  289 |         }","lines":23,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/fs/file/mod.rs#L267-L289"},{"ref":"monoio/src/fs/file/mod.rs:407-431","code":"  407 |     pub async fn write_all_at<T: IoBuf>(&self, mut buf: T, pos: u64) -> crate::BufResult<(), T> {\n  408 |         let len = buf.bytes_init();\n  409 |         let mut written = 0;\n  410 |         while written < len {\n  411 |             let slice = unsafe { buf.slice_unchecked(written..len) };\n  412 |             let (res, slice) = self.write_at(slice, pos + written as u64).await;\n  413 |             buf = slice.into_inner();\n  414 |             match res {\n  415 |                 Ok(0) => {\n  416 |                     return (\n  417 |                         Err(io::Error::new(\n  418 |                             io::ErrorKind::WriteZero,\n  419 |                             \"failed to write whole buffer\",\n  420 |                         )),\n  421 |                         buf,\n  422 |                     )\n  423 |                 }\n  424 |                 Ok(n) => written += n,\n  425 |                 Err(ref e) if e.kind() == io::ErrorKind::Interrupted => {}\n  426 |                 Err(e) => return (Err(e), buf),\n  427 |             };\n  428 |         }\n  429 | \n  430 |         (Ok(()), buf)\n  431 |     }","lines":25,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/fs/file/mod.rs#L407-L431"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`StateCell::poll` in the timer entry only registers a waker if none is currently stored\n(`if w.is_none() { ... }`). If the same `Sleep` future is later polled from a different\nwaker (e.g., composed inside `select!` or a custom combinator that changes context between\npolls), the new waker is silently ignored. The driver will fire the stale waker instead of\nthe current one, causing the wrong task to be woken - or no observable notification - until\nthe stale waker's task happens to re-poll the `Sleep`.","fix":"Replace the `if w.is_none()` guard with an unconditional update, or use `will_wake` to check\nwhether an update is needed:\n  let mut w = self.waker.0.borrow_mut();\n  match w.as_ref() {\n      Some(existing) if existing.will_wake(waker) => {}\n      _ => { *w = Some(waker.clone()); }\n  }","locations":[{"ref":"monoio/src/time/driver/entry.rs:130-140","code":"  130 |     fn poll(&self, waker: &Waker) -> Poll<TimerResult> {\n  131 |         // We must register first. This ensures that either `fire` will\n  132 |         // observe the new waker, or we will observe a racing fire to have set\n  133 |         // the state, or both.\n  134 |         let mut w = self.waker.0.borrow_mut();\n  135 |         if w.is_none() {\n  136 |             let _ = w.insert(waker.clone());\n  137 |         }\n  138 | \n  139 |         self.read_state()\n  140 |     }","lines":11,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/time/driver/entry.rs#L130-L140"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Race condition between `CtrlC::poll` and the Ctrl+C signal handler that can silently lose a\nsignal. The sequence:\n1. `poll()` swaps `ACTIVE` from `true` to `false`, gets `false` (no signal yet).\n2. Signal fires: `ACTIVE.store(true)`, then `WAKER.swap(null)` returns `null` (waker not\n   installed yet), calls `unpark()`.\n3. `poll()` installs a new waker via `WAKER.swap(new_waker)`.\nNow `ACTIVE` is `true` but the waker will never be called - the signal was consumed by the\nswap in step 1 but the signal handler ran before the waker was registered in step 3. The\n`unpark()` in step 2 wakes the runtime's I/O loop but does not re-poll the specific `CtrlC`\nfuture, so it can remain stuck in `Pending` forever. A correct implementation should re-check\n`ACTIVE` after installing the waker.","fix":"After installing the waker (line 36-39), re-read `ACTIVE` and return `Poll::Ready(())` if it\nis still set (or was set between the initial check and waker installation). This closes the\nrace window:\n```rust\nlet new_waker = Box::new(cx.waker().clone());\nlet old = WAKER.swap(Box::into_raw(new_waker), Ordering::SeqCst);\nif !old.is_null() { let _ = unsafe { Box::from_raw(old) }; }\nif ACTIVE.swap(false, Ordering::SeqCst) {\n    return Poll::Ready(());\n}\nPoll::Pending\n```","locations":[{"ref":"monoio/src/utils/ctrlc.rs:31-42","code":"   31 |     fn poll(self: Pin<&mut Self>, cx: &mut Context<'_>) -> Poll<Self::Output> {\n   32 |         if ACTIVE.swap(false, Ordering::SeqCst) {\n   33 |             Poll::Ready(())\n   34 |         } else {\n   35 |             let new_waker = Box::new(cx.waker().clone());\n   36 |             let old_waker_ptr = WAKER.swap(Box::into_raw(new_waker), Ordering::SeqCst);\n   37 |             if !old_waker_ptr.is_null() {\n   38 |                 let _ = unsafe { Box::from_raw(old_waker_ptr) };\n   39 |             }\n   40 |             Poll::Pending\n   41 |         }\n   42 |     }","lines":12,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/utils/ctrlc.rs#L31-L42"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"IoVecMeta::read_iovec_len returns self.data.len() (the total number of iovec entries) regardless\nof self.offset. After some entries have been consumed via consume(), the returned length still\nincludes already-consumed slots. The pointer returned by read_iovec_ptr is correctly advanced by\nself.offset, but the length is not shrunk. This means after partial consumption the kernel would\nbe given stale, already-processed iovecs at the start of the slice, resulting in double-writes\nor reads from wrong memory. This affects any code that calls consume() then re-submits the same\nIoVecMeta as a scatter/gather buffer.","fix":"read_iovec_len and write_iovec_len in IoVecMeta should return self.data.len() - self.offset.","locations":[{"ref":"monoio/src/driver/op/read.rs:161-222","code":"  161 | impl<T: IoVecBufMut> OpAble for ReadVec<T> {\n  162 |     #[cfg(all(target_os = \"linux\", feature = \"iouring\"))]\n  163 |     fn uring_op(&mut self) -> io_uring::squeue::Entry {\n  164 |         let ptr = self.buf_vec.write_iovec_ptr() as _;\n  165 |         let len = self.buf_vec.write_iovec_len() as _;\n  166 | \n  167 |         // Refersto https://docs.rs/io-uring/latest/io_uring/opcode/struct.Readv.html.\n  168 |         // If `offset` is set to `-1`, the offset will use (and advance) the file position, like\n  169 |         // the readv(2) syscall.\n  170 |         opcode::Readv::new(types::Fd(self.fd.raw_fd()), ptr, len)\n  171 |             .offset(-1i64 as u64)\n  172 |             .build()\n  173 |     }\n  174 | \n  175 |     #[cfg(any(feature = \"legacy\", feature = \"poll-io\"))]\n  176 |     #[inline]\n  177 |     fn legacy_interest(&self) -> Option<(Direction, usize)> {\n  178 |         self.fd.registered_index().map(|idx| (Direction::Read, idx))\n  179 |     }\n  180 | \n  181 |     #[cfg(all(any(feature = \"legacy\", feature = \"poll-io\"), unix))]\n  182 |     fn legacy_call(&mut self) -> io::Result<MaybeFd> {\n  183 |         read_vectored(\n  184 |             self.fd.raw_fd(),\n  185 |             self.buf_vec.write_iovec_ptr(),\n  186 |             self.buf_vec.write_iovec_len().min(i32::MAX as usize) as _,\n  187 |         )\n  188 |     }\n  189 | \n  190 |     #[cfg(all(any(feature = \"legacy\", feature = \"poll-io\"), windows))]\n  191 |     fn legacy_call(&mut self) -> io::Result<MaybeFd> {\n  192 |         // There is no `readv`-like syscall of file on windows, but this will be used to send\n  193 |         // socket message.\n  194 | \n  195 |         use windows_sys::Win32::Networking::WinSock::{WSAGetLastError, WSARecv, WSAESHUTDOWN};\n  196 | \n  197 |         let mut nread = 0;\n  198 |         let mut flags = 0;\n  199 |         let ret = unsafe {\n  200 |             WSARecv(\n  201 |                 self.fd.raw_socket() as _,\n  202 |                 self.buf_vec.write_wsabuf_ptr(),\n  203 |                 self.buf_vec.write_wsabuf_len().min(u32::MAX as usize) as _,\n  204 |                 &mut nread,\n  205 |                 &mut flags,\n  206 |                 std::ptr::null_mut(),\n  207 |                 None,\n  208 |             )\n  209 |         };\n  210 |         match ret {\n  211 |             0 => Ok(MaybeFd::new_non_fd(nread)),\n  212 |             _ => {\n  213 |                 let error = unsafe { WSAGetLastError() };\n  214 |                 if error == WSAESHUTDOWN {\n  215 |                     Ok(MaybeFd::zero())\n  216 |                 } else {\n  217 |                     Err(io::Error::from_raw_os_error(error))\n  218 |                 }\n  219 |             }\n  220 |         }\n  221 |     }\n  222 | }","lines":62,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/driver/op/read.rs#L161-L222"},{"ref":"monoio/src/driver/op/write.rs:161-206","code":"  161 | impl<T: IoVecBuf> OpAble for WriteVec<T> {\n  162 |     #[cfg(all(target_os = \"linux\", feature = \"iouring\"))]\n  163 |     fn uring_op(&mut self) -> io_uring::squeue::Entry {\n  164 |         let ptr = self.buf_vec.read_iovec_ptr() as *const _;\n  165 |         let len = self.buf_vec.read_iovec_len() as _;\n  166 |         // Refers to https://docs.rs/io-uring/latest/io_uring/opcode/struct.Write.html.\n  167 |         //\n  168 |         // If `offset` is set to `-1`, the offset will use (and advance) the file position, like\n  169 |         // the writev(2) system calls\n  170 |         opcode::Writev::new(types::Fd(self.fd.raw_fd()), ptr, len)\n  171 |             .offset(-1i64 as u64)\n  172 |             .build()\n  173 |     }\n  174 | \n  175 |     #[cfg(any(feature = \"legacy\", feature = \"poll-io\"))]\n  176 |     #[inline]\n  177 |     fn legacy_interest(&self) -> Option<(Direction, usize)> {\n  178 |         self.fd\n  179 |             .registered_index()\n  180 |             .map(|idx| (Direction::Write, idx))\n  181 |     }\n  182 | \n  183 |     #[cfg(any(feature = \"legacy\", feature = \"poll-io\"))]\n  184 |     fn legacy_call(&mut self) -> io::Result<MaybeFd> {\n  185 |         #[cfg(windows)]\n  186 |         let fd = self.fd.as_raw_handle() as _;\n  187 |         #[cfg(unix)]\n  188 |         let fd = self.fd.as_raw_fd();\n  189 | \n  190 |         let (buf_vec, len) = {\n  191 |             #[cfg(unix)]\n  192 |             {\n  193 |                 (self.buf_vec.read_iovec_ptr(), self.buf_vec.read_iovec_len())\n  194 |             }\n  195 |             #[cfg(windows)]\n  196 |             {\n  197 |                 (\n  198 |                     self.buf_vec.read_wsabuf_ptr(),\n  199 |                     self.buf_vec.read_wsabuf_len(),\n  200 |                 )\n  201 |             }\n  202 |         };\n  203 | \n  204 |         write_vectored(fd, buf_vec, len)\n  205 |     }\n  206 | }","lines":46,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/driver/op/write.rs#L161-L206"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`OwnedWriteHalf::drop` calls `write.shutdown()` but does not `.await` the result (Rust does\nnot support async `Drop`). The comment on line 212 acknowledges this, but the implication is\nthat only the synchronous portion of `shutdown` runs. For many I/O types (e.g. `TcpStream`)\n`shutdown` submits an io_uring or epoll operation that requires polling to complete. The\nhalf-socket is closed via `SharedFd` Drop, but any buffered data that `shutdown` was meant to\nflush may be lost silently.","fix":"This is a fundamental limitation of async Drop in Rust. Document clearly that users must call\n`shutdown().await` explicitly before dropping `OwnedWriteHalf` if they need graceful close\nsemantics. Add a `#[must_use]` note or a debug-mode warning if shutdown has not been called.","locations":[{"ref":"monoio/src/io/util/split.rs:204-218","code":"  204 | impl<T> Drop for OwnedWriteHalf<T>\n  205 | where\n  206 |     T: AsyncWriteRent,\n  207 | {\n  208 |     #[inline]\n  209 |     fn drop(&mut self) {\n  210 |         let write = unsafe { &mut *self.0.get() };\n  211 |         // Notes:: shutdown is an async function but rust currently does not support async drop\n  212 |         // this drop will only execute sync part of `shutdown` function.\n  213 |         #[allow(unused_must_use)]\n  214 |         {\n  215 |             write.shutdown();\n  216 |         }\n  217 |     }\n  218 | }","lines":15,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/io/util/split.rs#L204-L218"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`TFO_CONNECT_AVAILABLE` on Linux (linux.rs, line 5) uses `#[thread_local]` with the `unstable`\nfeature, or `thread_local!` without it. The Linux `try_set_tcp_fastopen_connect` function sets\n`TFO_CONNECT_AVAILABLE.set(false)` only on `ENOPROTOOPT`, but silently ignores other errors\n(e.g., `EPERM`) when `debug` feature is disabled (lines 48-52). If TFO is silently not set\ndue to a non-ENOPROTOOPT error, the connection proceeds without TFO without notifying the\ncaller, yet the connect options requested TFO. This is an incorrect silent degradation rather\nthan a transparent error.","fix":"Consider treating all unexpected errors as \"TFO unavailable\" by also setting\nTFO_CONNECT_AVAILABLE to false on other errors, or surfacing the error to the caller\nvia the return type so they can decide how to proceed.","locations":[{"ref":"monoio/src/net/tcp/tfo/linux.rs:39-53","code":"   39 | pub(crate) fn try_set_tcp_fastopen_connect<S: AsRawFd>(fd: &S) {\n   40 |     if !TFO_CONNECT_AVAILABLE.get() {\n   41 |         return;\n   42 |     }\n   43 |     match set_tcp_fastopen_connect(fd) {\n   44 |         Ok(_) => (),\n   45 |         Err(e) if e.raw_os_error() == Some(libc::ENOPROTOOPT) => {\n   46 |             TFO_CONNECT_AVAILABLE.set(false);\n   47 |         }\n   48 |         Err(_e) => {\n   49 |             #[cfg(all(debug_assertions, feature = \"debug\"))]\n   50 |             tracing::warn!(\"set_tcp_fastopen_connect failed: {}\", _e);\n   51 |         }\n   52 |     }\n   53 | }","lines":15,"link":"https://github.com/monoio-rs/monoio/blob/f0931e48e13bbeb1bcc3a1dc881dbe5c9385aa6c/monoio/src/net/tcp/tfo/linux.rs#L39-L53"}]},
