{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `warn_on_requirements_txt_setting`, the warning emitted for the `no_build` mismatch begins with `Ignoring \\`--no-binary\\` setting from requirements file`, but this branch handles `--no-build` (the rest of the same message correctly references `--no-build`/`no-build`). This is a copy-paste from the `no_binary` branch directly above and produces a misleading, self-contradictory user-facing warning.","fix":"Change the leading token from `--no-binary` to `--no-build`: replace `\"Ignoring \\`--no-binary\\` setting from requirements file. Instead, use the \\`--no-build\\` ...\"` with `\"Ignoring \\`--no-build\\` setting from requirements file. Instead, use the \\`--no-build\\` ...\"`.","locations":[{"ref":"crates/uv/src/commands/project/mod.rs:3546-3550","code":" 3546 |     if !no_build.is_none() && settings.build_options.no_build() != no_build {\n 3547 |         warn_user_once!(\n 3548 |             \"Ignoring `--no-binary` setting from requirements file. Instead, use the `--no-build` command-line argument, or set `no-build` in a `uv.toml` or `pyproject.toml` file.\"\n 3549 |         );\n 3550 |     }","lines":5,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv/src/commands/project/mod.rs#L3546-L3550"}]},
{"id":"CPY_5","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In the `PipCommand::Install` arm, `build_constraints` are parsed with `RequirementsSource::from_overrides_txt`, whereas every other command (`pip compile`, `pip sync`, `build`, `tool run`, `tool install`) parses build constraints with `RequirementsSource::from_constraints_txt`. This is the lone outlier. Both constructors currently return the same `Self::RequirementsTxt(path)` value, so resolution behavior is unchanged, but the validation error message is wrong: passing e.g. a `pyproject.toml`/`.toml`/`pylock.toml` to `--build-constraints` of `uv pip install` produces `\"... but overrides must be specified in requirements.txt format\"` instead of `\"... but constraints must be specified ...\"`. It is also latently dangerous if the two constructors ever diverge in behavior.","fix":"Change the `.map(RequirementsSource::from_overrides_txt)` on line 974 to `.map(RequirementsSource::from_constraints_txt)` to match all other `build_constraints` call sites.","locations":[{"ref":"crates/uv/src/lib.rs:949-953","code":"  949 |             let build_constraints = args\n  950 |                 .build_constraints\n  951 |                 .into_iter()\n  952 |                 .map(RequirementsSource::from_overrides_txt)\n  953 |                 .collect::<Result<Vec<_>, _>>()?;","lines":5,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv/src/lib.rs#L949-L953"}]},
{"id":"CPY_6","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"very_easy","description":"In `python_patch`, the local binding for the patch component is misnamed `minor` (copied from `python_minor`). It reads `release()[2]` (the patch) but stores it in a variable called `minor`, which is confusing when reading the code.","fix":"Rename the binding: `let patch = self.markers.python_full_version().version.release()[2]; u8::try_from(patch).expect(\"invalid patch version\")`.","locations":[{"ref":"crates/uv-python/src/interpreter.rs:425-428","code":"  425 |     pub(crate) fn python_patch(&self) -> u8 {\n  426 |         let minor = self.markers.python_full_version().version.release()[2];\n  427 |         u8::try_from(minor).expect(\"invalid patch version\")\n  428 |     }","lines":4,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-python/src/interpreter.rs#L425-L428"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"In `Osv::query_identifiers`, the batch response is paired with the outgoing queries positionally via `pending_batch.iter().zip(batch_response.results.iter())` (`crates/uv-audit/src/service/osv.rs:323-325`). `zip` silently truncates to the shorter of the two iterators, so if the vulnerability service (attacker-controlled via `--service-url`, or simply buggy) returns fewer `results` entries than `queries` sent in the batch, the trailing dependencies in that batch are silently dropped from `result_map` with no error, no warning, and no log message. Because `uv-audit` is a security-auditing tool, this is a false-negative bug: some dependencies would be reported as vulnerability-free purely because the response was short, without any indication to the user that the audit was incomplete.","fix":"Validate that `batch_response.results.len() == pending_batch.len()` before zipping, and return an `Error` (or at least `tracing::warn!`) on mismatch instead of silently truncating:\n```rust\nif batch_response.results.len() != pending_batch.len() {\n    return Err(Error::MalformedRecord {\n        id: url.to_string(),\n        err: reqwest_middleware::Error::Middleware(anyhow::anyhow!(\n            \"OSV batch response length {} did not match request length {}\",\n            batch_response.results.len(),\n            pending_batch.len()\n        )),\n    });\n}\n```","locations":[{"ref":"crates/uv-audit/src/service/osv.rs:289-346","code":"  289 |         loop {\n  290 |             let mut next_pending = Vec::new();\n  291 |             for pending_batch in pending.chunks(OSV_QUERY_BATCH_SIZE) {\n  292 |                 let request = QueryBatchRequest {\n  293 |                     queries: pending_batch\n  294 |                         .iter()\n  295 |                         .map(|(dep, page_token)| QueryRequest {\n  296 |                             package: Package {\n  297 |                                 name: dep.name().to_string(),\n  298 |                                 ecosystem: \"PyPI\".to_string(),\n  299 |                             },\n  300 |                             version: dep.version().to_string(),\n  301 |                             page_token: page_token.clone(),\n  302 |                         })\n  303 |                         .collect(),\n  304 |                 };\n  305 | \n  306 |                 // NOTE: we need `uncached` here to access the underlying\n  307 |                 // client for our POST request.\n  308 |                 let batch_response: QueryBatchResponse = self\n  309 |                     .client\n  310 |                     .uncached()\n  311 |                     .for_host(&url)\n  312 |                     .raw_client()\n  313 |                     .post(url.as_ref())\n  314 |                     .json(&request)\n  315 |                     .send()\n  316 |                     .await?\n  317 |                     .error_for_status()\n  318 |                     .map_err(reqwest_middleware::Error::Reqwest)?\n  319 |                     .json()\n  320 |                     .await\n  321 |                     .map_err(reqwest_middleware::Error::Reqwest)?;\n  322 | \n  323 |                 for ((dep, _), batch_result) in\n  324 |                     pending_batch.iter().zip(batch_response.results.iter())\n  325 |                 {\n  326 |                     let ids = result_map.entry(dep).or_default();\n  327 |                     ids.extend(\n  328 |                         batch_result\n  329 |                             .vulns\n  330 |                             .iter()\n  331 |                             .filter(|v| filter.matches(&v.id))\n  332 |                             .map(|v| VulnerabilityID::new(v.id.clone())),\n  333 |                     );\n  334 |                     if let Some(token) = &batch_result.next_page_token {\n  335 |                         next_pending.push((*dep, Some(token.clone())));\n  336 |                     }\n  337 |                 }\n  338 |             }\n  339 | \n  340 |             if next_pending.is_empty() {\n  341 |                 break;\n  342 |             }\n  343 |             pending = next_pending;\n  344 |         }\n  345 | \n  346 |         Ok(result_map)","lines":58,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-audit/src/service/osv.rs#L289-L346"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`download_remote_script` streams the HTTP response body straight to a temp file without ever checking the response status. `reqwest` does not treat 4xx/5xx as errors, so if the remote script URL returns e.g. a 404 HTML page, that error page is written to the `.py` temp file and subsequently executed by the interpreter as if it were the user's script. Every sibling download path checks status - `resolve_gist_url` calls `response.error_for_status_ref()?` at `run.rs:1948` and `read_pylock_toml` calls it at `pylock.rs:38` - but neither the initial `send()` (`run.rs:1611-1615`) nor the post-Gist-redirect `send()` (`run.rs:1624-1628`) is validated here.","fix":"Call `response.error_for_status_ref()?;` immediately after each `.send().await?` in `download_remote_script` (after line 1615 and after line 1628), mirroring `resolve_gist_url` and `read_pylock_toml`, so a failed download surfaces the HTTP error instead of producing a script file containing the error body.","locations":[{"ref":"crates/uv/src/commands/project/run.rs:1590-1629","code":" 1590 |         let client = client_builder.build()?;\n 1591 |         let mut response = client\n 1592 |             .for_host(url)\n 1593 |             .get(Url::from(url.clone()))\n 1594 |             .send()\n 1595 |             .await?;\n 1596 | \n 1597 |         let gist_url;\n 1598 |         // If it's a Gist URL, use the GitHub API to get the raw URL.\n 1599 |         if response.url().host_str() == Some(\"gist.github.com\") {\n 1600 |             gist_url =\n 1601 |                 resolve_gist_url(DisplaySafeUrl::ref_cast(response.url()), client_builder).await?;\n 1602 |             url = &gist_url;\n 1603 | \n 1604 |             response = client\n 1605 |                 .for_host(url)\n 1606 |                 .get(Url::from(url.clone()))\n 1607 |                 .send()\n 1608 |                 .await?;\n 1609 |         }\n 1610 | \n 1611 |         let file_stem = url\n 1612 |             .path_segments()\n 1613 |             .and_then(Iterator::last)\n 1614 |             .and_then(|segment| segment.strip_suffix(\".py\"))\n 1615 |             .unwrap_or(\"script\");\n 1616 |         let file = tempfile::Builder::new()\n 1617 |             .prefix(file_stem)\n 1618 |             .suffix(\".py\")\n 1619 |             .tempfile()?;\n 1620 | \n 1621 |         // Stream the response to the file.\n 1622 |         let mut writer = file.as_file();\n 1623 |         let mut reader = response.bytes_stream();\n 1624 |         while let Some(chunk) = reader.next().await {\n 1625 |             use std::io::Write;\n 1626 |             writer.write_all(&chunk?)?;\n 1627 |         }\n 1628 | \n 1629 |         Ok(file)","lines":40,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv/src/commands/project/run.rs#L1590-L1629"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"In `uninstall`, the `ExitStatus` returned by `do_uninstall` is discarded via `?` (`do_uninstall(...).await?;`). `do_uninstall` returns `Ok(ExitStatus::Failure)` in several normal failure paths (no installations found at line 121, no matching installations at line 137, and removal errors at line 334), but the caller ignores that value, performs directory cleanup, and unconditionally returns `Ok(ExitStatus::Success)` at line 58. As a result `uv python uninstall <nonexistent>` and uninstalls that hit removal errors exit with status code 0 instead of a failure, breaking scripting and CI checks.","fix":"Capture and propagate the status, e.g. `let status = do_uninstall(&installations, targets, all, printer).await?;` and return `status` (or short-circuit `if status != ExitStatus::Success { return Ok(status); }`) instead of always returning `Ok(ExitStatus::Success)`. Decide explicitly whether directory cleanup should still run when `do_uninstall` reports failure.","locations":[{"ref":"crates/uv/src/commands/python/uninstall.rs:37-58","code":"   37 |     // Perform the uninstallation.\n   38 |     do_uninstall(&installations, targets, all, printer).await?;\n   39 | \n   40 |     // Clean up any empty directories.\n   41 |     if uv_fs::directories(installations.root())?.all(|path| uv_fs::is_temporary(&path)) {\n   42 |         fs_err::tokio::remove_dir_all(&installations.root()).await?;\n   43 | \n   44 |         if let Some(top_level) = installations.root().parent() {\n   45 |             // Remove the `toolchains` symlink.\n   46 |             match fs_err::tokio::remove_file(top_level.join(\"toolchains\")).await {\n   47 |                 Ok(()) => {}\n   48 |                 Err(err) if err.kind() == std::io::ErrorKind::NotFound => {}\n   49 |                 Err(err) => return Err(err.into()),\n   50 |             }\n   51 | \n   52 |             if uv_fs::directories(top_level)?.all(|path| uv_fs::is_temporary(&path)) {\n   53 |                 fs_err::tokio::remove_dir_all(top_level).await?;\n   54 |             }\n   55 |         }\n   56 |     }\n   57 | \n   58 |     Ok(ExitStatus::Success)","lines":22,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv/src/commands/python/uninstall.rs#L37-L58"},{"ref":"crates/uv/src/commands/python/uninstall.rs:119-137","code":"  119 |             if matches!(requests.as_slice(), [PythonRequest::Default]) {\n  120 |                 writeln!(printer.stderr(), \"No Python installations found\")?;\n  121 |                 return Ok(ExitStatus::Failure);\n  122 |             }\n  123 | \n  124 |             writeln!(\n  125 |                 printer.stderr(),\n  126 |                 \"No existing installations found for: {}\",\n  127 |                 request.cyan()\n  128 |             )?;\n  129 |         }\n  130 |     }\n  131 | \n  132 |     if matching_installations.is_empty() {\n  133 |         writeln!(\n  134 |             printer.stderr(),\n  135 |             \"No Python installations found matching the requests\"\n  136 |         )?;\n  137 |         return Ok(ExitStatus::Failure);","lines":19,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv/src/commands/python/uninstall.rs#L119-L137"},{"ref":"crates/uv/src/commands/python/uninstall.rs:325-335","code":"  325 |     if !errors.is_empty() {\n  326 |         for (key, err) in errors {\n  327 |             writeln!(\n  328 |                 printer.stderr(),\n  329 |                 \"Failed to uninstall {}: {}\",\n  330 |                 key.green(),\n  331 |                 err.to_string().trim()\n  332 |             )?;\n  333 |         }\n  334 |         return Ok(ExitStatus::Failure);\n  335 |     }","lines":11,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv/src/commands/python/uninstall.rs#L325-L335"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `uninstall_wheel`, when `fs_err::remove_file(&path)` fails with a non-`NotFound` error the code falls back to `fs_err::remove_dir_all(&path)`. If that fallback also fails, the inner arm `Err(_) => return Err(err.into())` returns the outer `err` (the original `remove_file` error) and discards the actual `remove_dir_all` error. On Unix, `remove_file` on a directory yields `EISDIR` (\"Is a directory\"), so the user is shown a misleading \"Is a directory\" message even though the real failure (e.g. `PermissionDenied` inside the tree) came from `remove_dir_all`.","fix":"Bind and propagate the inner error instead of the outer one: change `Err(_) => return Err(err.into())` to `Err(dir_err) => return Err(dir_err.into())` so the `remove_dir_all` failure is reported.","locations":[{"ref":"crates/uv-install-wheel/src/uninstall.rs:81-98","code":"   81 |         match fs_err::remove_file(&path) {\n   82 |             Ok(()) => {\n   83 |                 trace!(\"Removed file: {}\", path.display());\n   84 |                 file_count += 1;\n   85 |                 if let Some(parent) = path.parent() {\n   86 |                     visited.insert(normalize_path(parent));\n   87 |                 }\n   88 |             }\n   89 |             Err(err) if err.kind() == std::io::ErrorKind::NotFound => {}\n   90 |             Err(err) => match fs_err::remove_dir_all(&path) {\n   91 |                 Ok(()) => {\n   92 |                     trace!(\"Removed directory: {}\", path.display());\n   93 |                     dir_count += 1;\n   94 |                 }\n   95 |                 Err(err) if err.kind() == std::io::ErrorKind::NotFound => {}\n   96 |                 Err(_) => return Err(err.into()),\n   97 |             },\n   98 |         }","lines":18,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-install-wheel/src/uninstall.rs#L81-L98"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"Multiple doc comments and user-facing panic/error messages in `uv-preview` tell the reader to call `uv_preview::init`, but no such function exists. The public initialization entry point is `set` (see callers in `uv/src/lib.rs`, `uv-build/src/main.rs`, etc.). The `# Panics` doc on `get` references the broken intra-doc link `[`init`]`, the uninitialized-state `panic!` prints `Hint: Use `uv_preview::init` ...`, and the `with_features` guard prints `Cannot use ... after `uv_preview::init` has been called`. A user hitting these messages would search for a nonexistent `init` symbol.","fix":"Replace every `init` reference with the actual function name `set` (and fix the intra-doc link to `[`set`]`). For example, change the hint string to `Use `{}::set` or `{}::test::with_features` to initialize it` and the `with_features` message to `... after `uv_preview::set` has been called`.","locations":[{"ref":"crates/uv-preview/src/lib.rs:96-99","code":"   96 | /// # Panics\n   97 | ///\n   98 | /// When called before [`init`] or (with the `testing` feature) when the\n   99 | /// current thread does not hold a [`test::with_features`] guard.","lines":4,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-preview/src/lib.rs#L96-L99"},{"ref":"crates/uv-preview/src/lib.rs:122-126","code":"  122 |         None => panic!(\n  123 |             \"The preview configuration has not been initialized\\nHint: Use `{}::init` or `{}::test::with_features` to initialize it\",\n  124 |             module_path!(),\n  125 |             module_path!()\n  126 |         ),","lines":5,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-preview/src/lib.rs#L122-L126"},{"ref":"crates/uv-preview/src/lib.rs:199-201","code":"  199 |                 panic!(\n  200 |                     \"Cannot use `{}::with_features` after `uv_preview::init` has been called\",\n  201 |                     module_path!()","lines":3,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-preview/src/lib.rs#L199-L201"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`Error::RenameError` captures `stderr` from the failed `install_name_tool` invocation but the `#[error(...)]` attribute only formats `dylib`, so the captured `stderr` is never surfaced to the user. When patching the dylib install name fails, the underlying tool output (the actual reason for failure) is silently discarded even in the debug-mode `warn_user` path, which formats `{self}` (Display).","fix":"Include `stderr` in the error message, e.g. `#[error(\"Failed to update the install name of the Python dynamic library located at \\`{}\\`: {stderr}\", dylib.user_display())]`, so the diagnostic reaches the user.","locations":[{"ref":"crates/uv-python/src/macos_dylib.rs:45-46","code":"   45 |     #[error(\"Failed to update the install name of the Python dynamic library located at `{}`\", dylib.user_display())]\n   46 |     RenameError { dylib: PathBuf, stderr: String },","lines":2,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-python/src/macos_dylib.rs#L45-L46"},{"ref":"crates/uv-python/src/macos_dylib.rs:26-29","code":"   26 |     if !output.status.success() {\n   27 |         let stderr = String::from_utf8_lossy(&output.stderr).into_owned();\n   28 |         return Err(Error::RenameError { dylib, stderr });\n   29 |     }","lines":4,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-python/src/macos_dylib.rs#L26-L29"}]},
{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`pip_show` with `--files` opens `RECORD` via `File::open(path)?` and parses it with `read_record(...)?`, so a single installed distribution that lacks a `RECORD` file (e.g., some egg-info or legacy-editable installs) makes the whole `uv pip show --files` invocation fail with an I/O error instead of gracefully skipping/warning for that one package. `pip` degrades gracefully in this case.","fix":"Handle a missing `RECORD` locally: match on `File::open(&path)`; on `ErrorKind::NotFound` print a `Files:` header with a note (or skip) rather than propagating the error with `?`, so other packages still render.","locations":[{"ref":"crates/uv/src/commands/pip/show.rs:216-223","code":"  216 |         if files {\n  217 |             let path = distribution.install_path().join(\"RECORD\");\n  218 |             let record = read_record(&mut File::open(path)?)?;\n  219 |             writeln!(printer.stdout(), \"Files:\")?;\n  220 |             for entry in record {\n  221 |                 writeln!(printer.stdout(), \"  {}\", entry.path)?;\n  222 |             }\n  223 |         }","lines":8,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv/src/commands/pip/show.rs#L216-L223"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`SupportedEnvironments::serialize` passes the full vector length (`Some(self.0.len())`) as the sequence-length hint to `serialize_seq`, but then skips every element whose `element.contents()` is `None` (the trivially-true / universal marker, e.g. an environment marker that simplifies to always-true). For self-describing formats (TOML/JSON, the only ones this type is used with today via `pyproject.toml`/`uv.toml`) an inaccurate length hint is harmless, but for any length-prefixed format (bincode/postcard) the declared count would exceed the number of elements actually emitted, producing a corrupt/undeserializable stream. The declared length must match the number of elements actually serialized.","fix":"Compute the accurate count first, e.g. `let contents: Vec<_> = self.0.iter().filter_map(|e| e.contents()).collect(); let mut seq = serializer.serialize_seq(Some(contents.len()))?; for c in &contents { seq.serialize_element(c)?; }`, or pass `None` to `serialize_seq` so no bogus length is declared.","locations":[{"ref":"crates/uv-pypi-types/src/supported_environments.rs:47-59","code":"   47 | impl serde::Serialize for SupportedEnvironments {\n   48 |     fn serialize<S>(&self, serializer: S) -> Result<S::Ok, S::Error>\n   49 |     where\n   50 |         S: serde::Serializer,\n   51 |     {\n   52 |         let mut seq = serializer.serialize_seq(Some(self.0.len()))?;\n   53 |         for element in &self.0 {\n   54 |             if let Some(contents) = element.contents() {\n   55 |                 seq.serialize_element(&contents)?;\n   56 |             }\n   57 |         }\n   58 |         seq.end()\n   59 |     }","lines":13,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-pypi-types/src/supported_environments.rs#L47-L59"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"negligible","difficulty":"easy","description":"`MarkerEnvironment::platform_version` is declared `fn` (private) while every other sibling accessor (`os_name`, `platform_machine`, `python_full_version`, etc.) is `pub`, and a corresponding `pub` setter `with_platform_version` exists. This makes the public API asymmetric: callers can set `platform_version` but cannot read it directly (only indirectly via `get_string`). The doc link `[MarkerEnvironment::platform_version]` at line 237 also points at a private item. Likely an accidental omission of `pub`.","fix":"Make the accessor `pub fn platform_version(&self) -> &str` for consistency with the other getters and its public setter, unless the private visibility is intentional (in which case drop the public intra-doc link reference).","locations":[{"ref":"crates/uv-pep508/src/marker/environment.rs:146-149","code":"  146 |     #[inline]\n  147 |     fn platform_version(&self) -> &str {\n  148 |         &self.inner.platform_version\n  149 |     }","lines":4,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-pep508/src/marker/environment.rs#L146-L149"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`fetch_and_find_matching_version` in `crates/uv-bin-install/src/lib.rs:587-613` streams the NDJSON version manifest into an unbounded `Vec<u8>` buffer (`buffer.extend_from_slice(&chunk)` at line 596) with no maximum size check, and repeatedly calls `buffer.drain(..=newline_pos)` (line 602) to consume each completed line, which shifts all remaining buffered bytes left on every line (O(n) per line, so O(n^2) over a large manifest). Because the manifest URL can point at a user-configured mirror (`PYX`/Astral mirror env vars) or, on a compromised/MITM'd connection, an attacker-controlled server, a malicious or buggy server that never sends a newline (or sends an extremely long line) can force unbounded memory growth in the client process, and even a legitimate but large manifest incurs needless quadratic copying.","fix":"Cap the buffer size (e.g. reject/err out via `Error::ManifestParse`-style variant if `buffer.len()` exceeds a reasonable bound such as a few MB before a newline is found), and use a `VecDeque` or track a start offset instead of `Vec::drain` to consume processed lines in O(1) amortized time instead of shifting the whole buffer on every line.","locations":[{"ref":"crates/uv-bin-install/src/lib.rs:588-614","code":"  588 |     // Stream the response line by line\n  589 |     let mut stream = response.bytes_stream();\n  590 |     let mut buffer = Vec::new();\n  591 | \n  592 |     while let Some(chunk) = stream.next().await {\n  593 |         let chunk = chunk.map_err(|err| Error::ManifestFetch {\n  594 |             url: manifest_url.to_string(),\n  595 |             source: reqwest_middleware::Error::Reqwest(err),\n  596 |         })?;\n  597 |         buffer.extend_from_slice(&chunk);\n  598 | \n  599 |         // Process complete lines\n  600 |         while let Some(newline_pos) = buffer.iter().position(|&b| b == b'\\n') {\n  601 |             let line = &buffer[..newline_pos];\n  602 |             let result = parse_and_check(line)?;\n  603 |             buffer.drain(..=newline_pos);\n  604 | \n  605 |             if let Some(resolved) = result {\n  606 |                 return Ok(resolved);\n  607 |             }\n  608 |         }\n  609 |     }\n  610 | \n  611 |     // Process any remaining data in buffer (in case there's no trailing newline)\n  612 |     if let Some(resolved) = parse_and_check(&buffer)? {\n  613 |         return Ok(resolved);\n  614 |     }","lines":27,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-bin-install/src/lib.rs#L588-L614"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`HashReader::finish` allocates a fresh 8 KiB heap buffer on every loop iteration via `self.read(&mut vec![0; 8192])`. Since `finish` is used to drain (and hash) an entire download/archive, this performs one heap allocation per ~8 KiB of data, which is wasteful in a hot path that runs over every downloaded wheel, sdist, and Python interpreter.","fix":"Allocate the buffer once before the loop and reuse it:\n```rust\npub async fn finish(&mut self) -> Result<(), std::io::Error> {\n    let mut buffer = vec![0; 8192];\n    while self.read(&mut buffer).await? > 0 {}\n    Ok(())\n}\n```","locations":[{"ref":"crates/uv-extract/src/hash.rs:93-97","code":"   93 |     pub async fn finish(&mut self) -> Result<(), std::io::Error> {\n   94 |         while self.read(&mut vec![0; 8192]).await? > 0 {}\n   95 | \n   96 |         Ok(())\n   97 |     }","lines":5,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-extract/src/hash.rs#L93-L97"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`InternerGuard::only_extras` recurses over the ADD without memoization, while its structural twin `without_extras`/`without_extras_cached` uses an `FxHashMap<NodeId, NodeId>` cache precisely to keep the traversal polynomial over shared subgraphs. Because ADDs frequently contain duplicated subgraphs across branches (noted in the `and` memoization comment at lines 426-428), `only_extras` can recompute the same nodes repeatedly, giving worst-case exponential behavior on large markers. It is reachable in the resolver via `MarkerTree::only_extras` (`universal_marker.rs:389`).","fix":"Give `only_extras` a cached variant mirroring `without_extras_cached`: thread an `&mut FxHashMap<NodeId, NodeId>` through the recursion, returning early on cache hits and inserting the computed result keyed by the original `NodeId`.","locations":[{"ref":"crates/uv-pep508/src/marker/algebra.rs:705-726","code":"  705 |     pub(crate) fn only_extras(&mut self, mut i: NodeId) -> NodeId {\n  706 |         if matches!(i, NodeId::TRUE | NodeId::FALSE) {\n  707 |             return i;\n  708 |         }\n  709 | \n  710 |         let parent = i;\n  711 |         let node = self.shared.node(i);\n  712 |         if !matches!(node.var, Variable::Extra(_)) {\n  713 |             i = NodeId::FALSE;\n  714 |             for child in node.children.nodes() {\n  715 |                 i = self.or(i, child.negate(parent));\n  716 |             }\n  717 |             if i.is_true() {\n  718 |                 return NodeId::TRUE;\n  719 |             }\n  720 |             self.only_extras(i)\n  721 |         } else {\n  722 |             // Restrict all nodes recursively.\n  723 |             let children = node.children.map(i, |node| self.only_extras(node));\n  724 |             self.create_node(node.var.clone(), children)\n  725 |         }\n  726 |     }","lines":22,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-pep508/src/marker/algebra.rs#L705-L726"},{"ref":"crates/uv-pep508/src/marker/algebra.rs:657-697","code":"  657 |     pub(crate) fn without_extras(&mut self, i: NodeId) -> NodeId {\n  658 |         let mut cache = FxHashMap::default();\n  659 |         self.without_extras_cached(i, &mut cache)\n  660 |     }\n  661 | \n  662 |     fn without_extras_cached(\n  663 |         &mut self,\n  664 |         mut i: NodeId,\n  665 |         cache: &mut FxHashMap<NodeId, NodeId>,\n  666 |     ) -> NodeId {\n  667 |         if matches!(i, NodeId::TRUE | NodeId::FALSE) {\n  668 |             return i;\n  669 |         }\n  670 | \n  671 |         if let Some(&cached) = cache.get(&i) {\n  672 |             return cached;\n  673 |         }\n  674 | \n  675 |         let original = i;\n  676 |         let parent = i;\n  677 |         let node = self.shared.node(i);\n  678 |         let result = if matches!(node.var, Variable::Extra(_)) {\n  679 |             i = NodeId::FALSE;\n  680 |             for child in node.children.nodes() {\n  681 |                 i = self.or(i, child.negate(parent));\n  682 |             }\n  683 |             if i.is_true() {\n  684 |                 NodeId::TRUE\n  685 |             } else {\n  686 |                 self.without_extras_cached(i, cache)\n  687 |             }\n  688 |         } else {\n  689 |             // Restrict all nodes recursively.\n  690 |             let children = node\n  691 |                 .children\n  692 |                 .map(i, |node| self.without_extras_cached(node, cache));\n  693 |             self.create_node(node.var.clone(), children)\n  694 |         };\n  695 |         cache.insert(original, result);\n  696 |         result\n  697 |     }","lines":41,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-pep508/src/marker/algebra.rs#L657-L697"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`apply_filters` compiles every filter regex from scratch on each invocation via `Regex::new(matcher.as_ref())`. It is called for every snapshot assertion (through `run_and_format_silent`/`uv_snapshot!`), and each `TestContext` carries dozens of filters plus the global `INSTA_FILTERS`, so the test suite re-compiles the same regexes thousands of times. The existing `// TODO(konstin): Cache regex compilation` comment acknowledges this. Impact is limited to test-suite wall-clock time.","fix":"Cache compiled `Regex` values, e.g. keep a `OnceLock`/`LazyLock`-backed cache keyed by pattern string, or precompile the context filters once into `Vec<(Regex, String)>` when the `TestContext` is built rather than on every `apply_filters` call.","locations":[{"ref":"crates/uv-test/src/lib.rs:2291-2300","code":" 2291 | pub fn apply_filters<T: AsRef<str>>(mut snapshot: String, filters: impl AsRef<[(T, T)]>) -> String {\n 2292 |     for (matcher, replacement) in filters.as_ref() {\n 2293 |         // TODO(konstin): Cache regex compilation\n 2294 |         let re = Regex::new(matcher.as_ref()).expect(\"Do you need to regex::escape your filter?\");\n 2295 |         if re.is_match(&snapshot) {\n 2296 |             snapshot = re.replace_all(&snapshot, replacement.as_ref()).to_string();\n 2297 |         }\n 2298 |     }\n 2299 |     snapshot\n 2300 | }","lines":10,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-test/src/lib.rs#L2291-L2300"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"In `add_dependency`, when prepending to a non-empty list (`index == 0`), the code calls `deps.clone()` to read the prefix of the second element while sidestepping the borrow checker. This clones the entire `Array` (every dependency value and its decor) just to read one `RawString` prefix.","fix":"Read and clone only the needed prefix, releasing the borrow immediately, instead of cloning the whole array: `let prefix = deps.get(index + 1).unwrap().decor().prefix().unwrap().clone();` (no `deps.clone()`). The owned `prefix` no longer borrows `deps`, so the later `deps.get_mut(...)` calls are unaffected.","locations":[{"ref":"crates/uv-workspace/src/pyproject_mut.rs:1594-1602","code":" 1594 |             if deps.len() > 1 && index == 0 {\n 1595 |                 let prefix = deps\n 1596 |                     .clone()\n 1597 |                     .get(index + 1)\n 1598 |                     .unwrap()\n 1599 |                     .decor()\n 1600 |                     .prefix()\n 1601 |                     .unwrap()\n 1602 |                     .clone();","lines":9,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-workspace/src/pyproject_mut.rs#L1594-L1602"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"When clearing the whole cache, `cache_clean` walks the entire cache tree once with `walkdir::WalkDir::new(cache.root()).into_iter().count()` purely to size the progress reporter, then `cache.clear(...)` walks and removes the tree a second time. For a large cache (hundreds of thousands of files) this roughly doubles the filesystem traversal cost just to render a progress bar.","fix":"Avoid the pre-count traversal: either drive the progress reporter incrementally from within `cache.clear` (report as entries are removed) or use an indeterminate/spinner reporter so the extra full-tree walk is not needed.","locations":[{"ref":"crates/uv/src/commands/cache_clean.rs:62-68","code":"   62 |         let num_paths = walkdir::WalkDir::new(cache.root()).into_iter().count();\n   63 |         let reporter = CleaningDirectoryReporter::new(printer, Some(num_paths));\n   64 | \n   65 |         let root = cache.root().to_path_buf();\n   66 |         cache\n   67 |             .clear(Box::new(reporter))\n   68 |             .with_context(|| format!(\"Failed to clear cache at: {}\", root.user_display()))?","lines":7,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv/src/commands/cache_clean.rs#L62-L68"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"In `filter_and_convert_wheels`, `wheel.file.url.to_url()` is computed once into `url` (used only for the `name` filename comparison) and then computed a second, identical time for the `url:` field of `PylockTomlWheel`. The already-computed `url` can be reused, avoiding a redundant URL parse/allocation per wheel.","fix":"Reuse the previously computed value: set `url: Some(url)` instead of re-invoking `wheel.file.url.to_url().map_err(PylockTomlErrorKind::ToUrl)?` at line 685-690 (the local `url` is still owned and unused after the `name` check).","locations":[{"ref":"crates/uv-resolver/src/lock/export/pylock_toml.rs:801-834","code":"  801 |         let wheels = wheels\n  802 |             .into_iter()\n  803 |             .map(|wheel| {\n  804 |                 let url = wheel\n  805 |                     .file\n  806 |                     .url\n  807 |                     .to_url()\n  808 |                     .map_err(PylockTomlErrorKind::ToUrl)?;\n  809 |                 Ok(PylockTomlWheel {\n  810 |                     // Optional \"when the last component of path/ url would be the same value\".\n  811 |                     name: if url\n  812 |                         .filename()\n  813 |                         .is_ok_and(|filename| filename == *wheel.file.filename)\n  814 |                     {\n  815 |                         None\n  816 |                     } else {\n  817 |                         Some(wheel.filename.clone())\n  818 |                     },\n  819 |                     upload_time: wheel\n  820 |                         .file\n  821 |                         .upload_time_utc_ms\n  822 |                         .map(Timestamp::from_millisecond)\n  823 |                         .transpose()?,\n  824 |                     url: Some(\n  825 |                         wheel\n  826 |                             .file\n  827 |                             .url\n  828 |                             .to_url()\n  829 |                             .map_err(PylockTomlErrorKind::ToUrl)?,\n  830 |                     ),\n  831 |                     path: None,\n  832 |                     size: wheel.file.size,\n  833 |                     hashes: Hashes::from(wheel.file.hashes.clone()),\n  834 |                 })","lines":34,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-resolver/src/lock/export/pylock_toml.rs#L801-L834"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`process_json` in the `uv-python` build script is effectively a no-op that only re-boxes the top-level object: it iterates the input object and clones every `key`/`value` into a fresh `serde_json::Map`, returning a structurally identical object. The name (`process_json`) and the call-site variable `filtered_data` imply filtering/minification, but no filtering happens - the only \"minification\" comes from `serde_json::to_string` emitting compact JSON. The whole function and the object rebuild are dead work and the naming is misleading to future readers.","fix":"Delete `process_json` and serialize `json_data` directly (`serde_json::to_string(&json_data)`), or rename it and add a real filtering step if one was intended. At minimum rename `filtered_data` to `minified_data` so the name does not falsely imply filtering.","locations":[{"ref":"crates/uv-python/build.rs:9-19","code":"    9 | fn process_json(data: &serde_json::Value) -> serde_json::Value {\n   10 |     let mut out_data = serde_json::Map::new();\n   11 | \n   12 |     if let Some(obj) = data.as_object() {\n   13 |         for (key, value) in obj {\n   14 |             out_data.insert(key.clone(), value.clone());\n   15 |         }\n   16 |     }\n   17 | \n   18 |     serde_json::Value::Object(out_data)\n   19 | }","lines":11,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-python/build.rs#L9-L19"},{"ref":"crates/uv-python/build.rs:48","code":"   48 |     let filtered_data = process_json(&json_data);","lines":1,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-python/build.rs#L48"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"Four `RequirementsTxtParserError` variants are never constructed anywhere in the workspace: `ParsedUrl`, `UnsupportedRequirement`, `UrlConversion`, and `UnsupportedUrl`; they appear only in the `Display`/`source` match arms. Also the (dead) `ParsedUrl` `Display` arm has a broken message `write!(f, \"Couldn't URL at position {start}\")` missing the word `parse` (the parallel `RequirementsTxtFileError` arm correctly reads `Couldn't parse URL in ...`).","fix":"Remove the four unused variants (and their `Display`/`source` arms) or wire them up. If kept, fix the message to `Couldn't parse URL at position {start}`.","locations":[{"ref":"crates/uv-requirements-txt/src/lib.rs:1169-1170","code":" 1169 |     UrlConversion(String),\n 1170 |     UnsupportedUrl(String),","lines":2,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-requirements-txt/src/lib.rs#L1169-L1170"},{"ref":"crates/uv-requirements-txt/src/lib.rs:1200-1214","code":" 1200 |     UnsupportedRequirement {\n 1201 |         source: Box<Pep508Error<VerbatimParsedUrl>>,\n 1202 |         start: usize,\n 1203 |         end: usize,\n 1204 |     },\n 1205 |     Pep508 {\n 1206 |         source: Box<Pep508Error<VerbatimParsedUrl>>,\n 1207 |         start: usize,\n 1208 |         end: usize,\n 1209 |     },\n 1210 |     ParsedUrl {\n 1211 |         source: Box<Pep508Error<VerbatimParsedUrl>>,\n 1212 |         start: usize,\n 1213 |         end: usize,\n 1214 |     },","lines":15,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-requirements-txt/src/lib.rs#L1200-L1214"},{"ref":"crates/uv-requirements-txt/src/lib.rs:1286-1288","code":" 1286 |             Self::ParsedUrl { start, .. } => {\n 1287 |                 write!(f, \"Couldn't URL at position {start}\")\n 1288 |             }","lines":3,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-requirements-txt/src/lib.rs#L1286-L1288"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"The `Error::UnknownBoundKind(String)` variant is never constructed anywhere in the crate (confirmed by grep), and its `#[error(\"Unknown bound king {0}\")]` message contains a typo: `king` should be `kind`. It is dead code carrying a broken message.","fix":"Remove the unused `UnknownBoundKind(String)` variant. If it must be kept, fix the message: change `#[error(\"Unknown bound king {0}\")]` to `#[error(\"Unknown bound kind {0}\")]`.","locations":[{"ref":"crates/uv-workspace/src/pyproject_mut.rs:69-70","code":"   69 |     #[error(\"Unknown bound king {0}\")]\n   70 |     UnknownBoundKind(String),","lines":2,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-workspace/src/pyproject_mut.rs#L69-L70"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `map_matching_legacy_items` the inner condition `if search.is_empty() && require_unique` is nested inside `if require_unique { ... }`, so the `&& require_unique` is always true and redundant.","fix":"Drop the redundant conjunct: `if search.is_empty() {` (the surrounding `if require_unique` already guarantees it).","locations":[{"ref":"crates/uv-keyring/src/secret_service.rs:406-409","code":"  406 |         if require_unique {\n  407 |             if search.is_empty() && require_unique {\n  408 |                 return Err(ErrorCode::NoEntry);\n  409 |             } else if search.len() > 1 {","lines":4,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-keyring/src/secret_service.rs#L406-L409"}]},
{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`let p_credential = p_credential;` re-binds a `Copy` raw pointer to itself, which is a no-op with no effect on lifetime or ownership. It appears to be leftover code.","fix":"Remove the line `let p_credential = p_credential;`.","locations":[{"ref":"crates/uv-keyring/src/windows.rs:323","code":"  323 |             let p_credential = p_credential;","lines":1,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-keyring/src/windows.rs#L323"}]},
{"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"The `if !hashes.is_empty()` guard around the hash-emitting `for` loop is redundant: iterating an empty slice already emits nothing, so the check adds no behavior.","fix":"Remove the guard, keeping only the loop:\n```rust\nif self.hashes {\n    let mut hashes = package.hashes();\n    hashes.sort_unstable();\n    for hash in hashes.iter() {\n        writeln!(f, \" \\\\\")?;\n        write!(f, \"    --hash=\")?;\n        write!(f, \"{hash}\")?;\n    }\n}\n```","locations":[{"ref":"crates/uv-resolver/src/lock/export/requirements_txt.rs:171-181","code":"  171 |             if self.hashes {\n  172 |                 let mut hashes = package.hashes();\n  173 |                 hashes.sort_unstable();\n  174 |                 if !hashes.is_empty() {\n  175 |                     for hash in hashes.iter() {\n  176 |                         writeln!(f, \" \\\\\")?;\n  177 |                         write!(f, \"    --hash=\")?;\n  178 |                         write!(f, \"{hash}\")?;\n  179 |                     }\n  180 |                 }\n  181 |             }","lines":11,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-resolver/src/lock/export/requirements_txt.rs#L171-L181"}]},
{"id":"DEAD_7","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`PubGrubPackage::kind` is annotated `#[allow(dead_code)]` and documented as \"isn't actually used anywhere\". Per project guidance (`AGENTS.md`), `#[expect()]` is preferred over `#[allow()]` so the lint fires if the code becomes used, and dead debug-only helpers should be flagged.","fix":"Replace `#[allow(dead_code)]` with `#[expect(dead_code, reason = \"kept for printf-debugging\")]`, or remove the method if debug helpers are not desired in the tree.","locations":[{"ref":"crates/uv-resolver/src/pubgrub/package.rs:309-321","code":"  309 |     /// This isn't actually used anywhere, but can be useful for printf-debugging.\n  310 |     #[allow(dead_code)]\n  311 |     pub(crate) fn kind(&self) -> &'static str {\n  312 |         match &**self {\n  313 |             PubGrubPackageInner::Root(_) => \"root\",\n  314 |             PubGrubPackageInner::Python(_) => \"python\",\n  315 |             PubGrubPackageInner::System(_) => \"system\",\n  316 |             PubGrubPackageInner::Package { .. } => \"package\",\n  317 |             PubGrubPackageInner::Extra { .. } => \"extra\",\n  318 |             PubGrubPackageInner::Group { .. } => \"group\",\n  319 |             PubGrubPackageInner::Marker { .. } => \"marker\",\n  320 |         }\n  321 |     }","lines":13,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-resolver/src/pubgrub/package.rs#L309-L321"}]},
{"id":"DEAD_8","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `build_simple_api_response`, `insert_header(\"Content-Type\", \"application/vnd.pypi.simple.v1+json\")` is redundant: wiremock's `generate_response` unconditionally inserts (replacing) the `Content-Type` header from the mime passed to `set_body_raw`, which is the same value. The sibling helper `pypi_proxy::simple_api_response` sets it only once via `set_body_raw`.","fix":"Drop the redundant `.insert_header(\"Content-Type\", \"application/vnd.pypi.simple.v1+json\")` and rely on `set_body_raw(body_str, \"application/vnd.pypi.simple.v1+json\")` alone, as done in `pypi_proxy::simple_api_response`.","locations":[{"ref":"crates/uv-test/src/packse/server.rs:390-393","code":"  390 |     let body_str = body.to_string();\n  391 |     ResponseTemplate::new(200)\n  392 |         .insert_header(\"Content-Type\", \"application/vnd.pypi.simple.v1+json\")\n  393 |         .set_body_raw(body_str, \"application/vnd.pypi.simple.v1+json\")","lines":4,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-test/src/packse/server.rs#L390-L393"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"In `crates/uv-client/src/html.rs:251-256`, the comment says: \"Extract the filename from the body text, which MUST match that of the final path component of the URL.\" This is incorrect: `SimpleDetailHTML::parse_anchor` never reads the anchor's body/inner text at all (that is only done by the unrelated `SimpleIndexHtml::parse_anchor_project_name` at `html.rs:377`). The filename is extracted purely from the `href` URL's path component (`path.split('/').next_back()`), with no comparison against the link's visible text. The comment misleads future readers into thinking there is a body-text/URL consistency check being performed here, when there is none.","fix":"Correct the comment to describe what the code actually does, e.g.:\n```rust\n// Extract the filename from the final path component of the href URL.\nlet filename = path\n    .split('/')\n    .next_back()\n    .ok_or_else(|| Error::MissingFilename(href.to_string()))?;\n```","locations":[{"ref":"crates/uv-client/src/html.rs:251-256","code":"  251 |         // Extract the filename from the body text, which MUST match that of\n  252 |         // the final path component of the URL.\n  253 |         let filename = path\n  254 |             .split('/')\n  255 |             .next_back()\n  256 |             .ok_or_else(|| Error::MissingFilename(href.to_string()))?;","lines":6,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-client/src/html.rs#L251-L256"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"Several user-facing warning messages are built with `format!` string literals that wrap across source lines, embedding a literal newline plus the source indentation (many spaces) into the emitted message. For example the `Expected double quoted PEP 440 version to compare with {key},\\n                        found {r_value}...` text renders as a warning with an embedded newline and ~24 spaces of indentation. This produces malformed multi-line warning output for end users. The pattern is repeated across many of the `reporter.report(...)` calls in this file.","fix":"Join the message onto a single logical line using string concatenation across lines (`\"...\" \\\n\"...\"` with a trailing backslash, or adjacent string literals) so no literal newline/indentation is embedded, matching the single-line warning style used elsewhere.","locations":[{"ref":"crates/uv-pep508/src/marker/parse.rs:194-198","code":"  194 |                     format!(\n  195 |                         \"Expected double quoted PEP 440 version to compare with {key},\n  196 |                         found {r_value}, will be ignored\"\n  197 |                     ),\n  198 |                 );","lines":5,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-pep508/src/marker/parse.rs#L194-L198"},{"ref":"crates/uv-pep508/src/marker/parse.rs:219-223","code":"  219 |                         MarkerWarningKind::MarkerMarkerComparison,\n  220 |                         \"Comparing two markers with each other doesn't make any sense,\n  221 |                             will be ignored\"\n  222 |                             .to_string(),\n  223 |                     );","lines":5,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-pep508/src/marker/parse.rs#L219-L223"},{"ref":"crates/uv-pep508/src/marker/parse.rs:264-268","code":"  264 |                         MarkerWarningKind::ExtraInvalidComparison,\n  265 |                         \"Comparing extra with something other than a quoted string is wrong,\n  266 |                             will be ignored\"\n  267 |                             .to_string(),\n  268 |                     );","lines":5,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-pep508/src/marker/parse.rs#L264-L268"},{"ref":"crates/uv-pep508/src/marker/parse.rs:418-421","code":"  418 |                     format!(\n  419 |                         \"Expected PEP 440 versions to compare with {key}, found {value},\n  420 |                         will be ignored: {err}\"\n  421 |                     ),","lines":4,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-pep508/src/marker/parse.rs#L418-L421"},{"ref":"crates/uv-pep508/src/marker/parse.rs:465-468","code":"  465 |             format!(\n  466 |                 \"Expected PEP 440 version operator to compare {key} with `{version}`,\n  467 |                     found `{marker_operator}`, will be ignored\",\n  468 |                 version = pattern.version()","lines":4,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-pep508/src/marker/parse.rs#L465-L468"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment on `PythonDownloadRequest::prereleases` claims it \"defaults to true if `Self::version` is not None, and false otherwise\". The actual default computed in `allows_prereleases` is `self.version.as_ref().is_some_and(VersionRequest::allows_prereleases)`, i.e. it is only `true` when the version itself opts into pre-releases (e.g. a range with a pre-release bound or a pre-release version). For a stable version like `Some(3.12)` it returns `false`, contradicting the comment.","fix":"Update the comment to state the real behavior, e.g. `If not set, defaults to whether the version request itself allows pre-releases (`VersionRequest::allows_prereleases`), and false when there is no version.`","locations":[{"ref":"crates/uv-python/src/downloads.rs:227-230","code":"  227 |     /// Whether to allow pre-releases or not. If not set, defaults to true if [`Self::version`] is\n  228 |     /// not None, and false otherwise.\n  229 |     pub(crate) prereleases: Option<bool>,\n  230 | }","lines":4,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-python/src/downloads.rs#L227-L230"},{"ref":"crates/uv-python/src/downloads.rs:624-630","code":"  624 |     pub(crate) fn allows_prereleases(&self) -> bool {\n  625 |         self.prereleases.unwrap_or_else(|| {\n  626 |             self.version\n  627 |                 .as_ref()\n  628 |                 .is_some_and(VersionRequest::allows_prereleases)\n  629 |         })\n  630 |     }","lines":7,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-python/src/downloads.rs#L624-L630"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment on `is_alternative_implementation` describes the inverse of what the function computes. The comment reads `Whether this is a CPython installation.` and `Returns false if it is an alternative implementation, e.g., PyPy.`, but the function is named `is_alternative_implementation` and returns `true` for alternative implementations (`!matches!(..CPython..) || self.os().is_emscripten()`). The comment appears copy-pasted from a hypothetical `is_cpython`-style method and misleads readers about the return polarity.","fix":"Rewrite the doc comment to match the code, e.g. `/// Returns \\`true\\` if this is an alternative (non-CPython) implementation, e.g., PyPy or an Emscripten/Pyodide build.`","locations":[{"ref":"crates/uv-python/src/installation.rs:407-415","code":"  407 |     /// Whether this is a CPython installation.\n  408 |     ///\n  409 |     /// Returns false if it is an alternative implementation, e.g., PyPy.\n  410 |     pub(crate) fn is_alternative_implementation(&self) -> bool {\n  411 |         !matches!(\n  412 |             self.implementation(),\n  413 |             LenientImplementationName::Known(ImplementationName::CPython)\n  414 |         ) || self.os().is_emscripten()\n  415 |     }","lines":9,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-python/src/installation.rs#L407-L415"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment for `PythonRequirement::raises` states it returns `true` \"if the minimum version of Python required by the target is greater than the installed version\", but the body compares against the target's lower bound, not the installed version: `target.lower() > self.target.range().lower()`. `self.target` and `self.installed` are distinct fields, and callers in `resolver/mod.rs` (lines 4024-4025 and 4044-4045) rely on the target-vs-target comparison to decide whether a dependency raises the resolution's minimum-supported Python. The code is correct; the comment misdescribes it by saying \"installed\".","fix":"Change the doc comment to reference the target Python requirement, e.g. replace `greater than the installed version` with `greater than the current target Python requirement`.","locations":[{"ref":"crates/uv-resolver/src/python_requirement.rs:153-157","code":"  153 |     /// Returns `true` if the minimum version of Python required by the target is greater than the\n  154 |     /// installed version.\n  155 |     pub(crate) fn raises(&self, target: &RequiresPythonRange) -> bool {\n  156 |         target.lower() > self.target.range().lower()\n  157 |     }","lines":5,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-resolver/src/python_requirement.rs#L153-L157"}]},
{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"User-facing error message contains a double-negative grammatical error: `\"When using \\`--token\\`, a username cannot not be provided; found: {username}\"`. The `cannot not` should be `cannot`. The typo is also baked into snapshot tests (`crates/uv/tests/it/auth.rs:750` and `:931`).","fix":"Replace `a username cannot not be provided` with `a username cannot be provided` and update the two snapshot expectations in `crates/uv/tests/it/auth.rs`.","locations":[{"ref":"crates/uv/src/commands/auth/login.rs:60","code":"   60 |                 bail!(\"When using `--token`, a username cannot not be provided; found: {username}\");","lines":1,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv/src/commands/auth/login.rs#L60"}]},
{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The `RemoveTarget` enum has swapped variant doc comments and a wrong summary. The type doc says `Represents the destination where dependencies are added` (this is `remove.rs`, so it should say \"removed\"; copied from `add.rs`). The `Project(VirtualProject)` variant is documented `A PEP 723 script, with inline metadata.` and the `Script(Pep723Script)` variant is documented `A project with a \\`pyproject.toml\\`.` - the two variant descriptions are reversed relative to their actual types.","fix":"Update the summary to \"...where dependencies are removed...\" and swap the two variant doc comments so `Project(VirtualProject)` reads `/// A project with a \\`pyproject.toml\\`.` and `Script(Pep723Script)` reads `/// A PEP 723 script, with inline metadata.`.","locations":[{"ref":"crates/uv/src/commands/project/remove.rs:396-404","code":"  396 | /// Represents the destination where dependencies are added, either to a project or a script.\n  397 | #[derive(Debug)]\n  398 | #[expect(clippy::large_enum_variant)]\n  399 | enum RemoveTarget {\n  400 |     /// A PEP 723 script, with inline metadata.\n  401 |     Project(VirtualProject),\n  402 |     /// A project with a `pyproject.toml`.\n  403 |     Script(Pep723Script),\n  404 | }","lines":9,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv/src/commands/project/remove.rs#L396-L404"}]},
{"id":"CMT_8","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"In `PipListSettings::resolve`, the two mutually-exclusive CLI flags `--editable` and `--exclude-editable` are passed to `flag(editable, exclude_editable, \"exclude-editable\")`. The `flag` helper (`crates/uv-cli/src/options.rs:31`) assumes its two booleans are a `--<name>`/`--no-<name>` pair and, on conflict, emits `\"`--{name}` and `--no-{name}` cannot be used together\"`. Here that produces an error referencing `--exclude-editable` and `--no-exclude-editable` (a flag that does not exist), when the actual conflicting flags the user passed are `--editable` and `--exclude-editable`. Running `uv pip list --editable --exclude-editable` therefore prints a misleading error message.","fix":"Do not route these two non-paired flags through `flag`. Resolve `editable` explicitly, e.g. `editable: match (editable, exclude_editable) { (true, true) => bail!(\"`--editable` and `--exclude-editable` cannot be used together\"), (true, false) => Some(true), (false, true) => Some(false), (false, false) => None },`, so the error names the real flags.","locations":[{"ref":"crates/uv/src/settings.rs:4110","code":" 4110 |             editable: flag(editable, exclude_editable, \"exclude-editable\")?,","lines":1,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv/src/settings.rs#L4110"}]},
{"id":"CMT_9","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The doc comment on `VersionBump::Rc` has a stray trailing `]` after the intra-doc link: `you'd also include [\\`VersionBump::Major\\`].]` (note the extra `]` at the very end of the line). The parallel doc comments on the neighboring `Alpha` and `Beta` variants end correctly with just `[\\`VersionBump::Major\\`].` (no trailing bracket), showing this is a copy-paste typo rather than intentional Markdown/rustdoc syntax.","fix":"Remove the stray trailing `]`:\n```rust\n/// for 1.2.3 => 2.0.0rc1, you'd also include [`VersionBump::Major`].\n```","locations":[{"ref":"crates/uv-cli/src/lib.rs:752","code":"  752 |     /// for 1.2.3 => 2.0.0rc1, you'd also include [`VersionBump::Major`].]","lines":1,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-cli/src/lib.rs#L752"}]},
{"id":"CMT_10","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Typo in the crate-level docs: `dev versions, which can be attached to both table releases and pre-releases` should read `stable releases`, not `table releases`.","fix":"Change `both table releases and pre-releases` to `both stable releases and pre-releases`.","locations":[{"ref":"crates/uv-pep440/src/lib.rs:9-11","code":"    9 | //! * dev versions, which can be attached to both table releases and pre-releases. When attached to a\n   10 | //!   pre-release the dev version is ordered just below the normal pre-release, however when attached\n   11 | //!   to a stable version, the dev version is sorted before a pre-releases","lines":3,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-pep440/src/lib.rs#L9-L11"}]},
{"id":"CMT_11","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Several doc comments and one `unreachable!` message reference a variant named `Sentinel` that no longer exists; the variant was renamed to `Max` (`LocalVersion::Max` / `LocalVersionSlice::Max`). The intra-doc links `[`LocalVersion::Sentinel`]` are broken and the panic message names a nonexistent value.","fix":"Update the references from `Sentinel` to `Max`: e.g. change `[`LocalVersion::Sentinel`]` to `[`LocalVersion::Max`]`, `Like [`LocalVersion::Sentinel`]` to `Like [`LocalVersion::Max`]`, and the `unreachable!(\"found `LocalVersionSlice::Sentinel`, ...\")` message to say `LocalVersionSlice::Max`.","locations":[{"ref":"crates/uv-pep440/src/version.rs:1740-1741","code":" 1740 | /// Either a sequence of local segments or [`LocalVersion::Sentinel`], an internal-only value that\n 1741 | /// compares greater than all other local versions.","lines":2,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-pep440/src/version.rs#L1740-L1741"},{"ref":"crates/uv-pep440/src/version.rs:1760","code":" 1760 |     /// Like [`LocalVersion::Sentinel`]","lines":1,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-pep440/src/version.rs#L1760"},{"ref":"crates/uv-pep440/src/version_ranges.rs:206-208","code":"  206 |                 LocalVersionSlice::Max => unreachable!(\n  207 |                     \"found `LocalVersionSlice::Sentinel`, which should be an internal-only value\"\n  208 |                 ),","lines":3,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-pep440/src/version_ranges.rs#L206-L208"}]},
{"id":"CMT_12","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The doc comment on the `PlatformPythonImplementation` variant reads `Deprecated \\`platform.machine\\` from <https://peps.python.org/pep-0345/#environment-markers>`, which describes `platform.machine` (the previous variant `PlatformMachine`), not the Python implementation. It is a copy-paste leftover attached to the wrong variant and is misleading.","fix":"Change line 53 from `/// Deprecated \\`platform.machine\\` from <https://peps.python.org/pep-0345/#environment-markers>` to reference the deprecated `platform.python_implementation` marker, or remove the stray line so the comment for `PlatformPythonImplementation` only says `/// \\`platform_python_implementation\\``.","locations":[{"ref":"crates/uv-pep508/src/marker/lowering.rs:52-55","code":"   52 |     PlatformMachine,\n   53 |     /// Deprecated `platform.machine` from <https://peps.python.org/pep-0345/#environment-markers>\n   54 |     /// `platform_python_implementation`\n   55 |     PlatformPythonImplementation,","lines":4,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-pep508/src/marker/lowering.rs#L52-L55"}]},
{"id":"CMT_13","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Doc-comment typo: `Preview::all_enabled` is documented as `/// Check if all preview feature rae enabled.` (`feature rae` should read `features are`).","fix":"Change the comment to `/// Check if all preview features are enabled.`","locations":[{"ref":"crates/uv-preview/src/lib.rs:460","code":"  460 |     /// Check if all preview feature rae enabled.","lines":1,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-preview/src/lib.rs#L460"}]},
{"id":"CMT_14","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"In `PyxPublishingService::exchange_token`, the error-path comment reads \"something is misconfigured, e.g. a typo in the PyPI configuration ... https://docs.pypi.org/trusted-publishers/...\". This is the pyx (not PyPI) service; the comment was copy-pasted verbatim from `pypi.rs` and references PyPI docs/configuration that do not apply here.","fix":"Reword the comment to refer to the pyx trusted-publisher configuration (and its docs) rather than PyPI, or make it provider-agnostic.","locations":[{"ref":"crates/uv-publish/src/trusted_publishing/pypi.rs:134-138","code":"  134 |                 Some(claims) => {\n  135 |                     // An error here means that something is misconfigured, e.g. a typo in the PyPI\n  136 |                     // configuration, so we're showing the body and the JWT claims for more context, see\n  137 |                     // https://docs.pypi.org/trusted-publishers/troubleshooting/#token-minting\n  138 |                     // for what the body can mean.","lines":5,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-publish/src/trusted_publishing/pypi.rs#L134-L138"}]},

{"id":"CMT_21","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The doc comment on `resolve_activated_extras` contains two stacked, partially-duplicated summary paragraphs with no blank separation. The first paragraph (`Resolve the conflict markers in a [\\`MarkerTree\\`] ...` through `... assumed to be false in all environments.`) appears to be a stale leftover from before the function was generalized; it is immediately followed by a second summary starting `Resolve unencoded package extra markers and conflict-encoded extra markers in a [\\`MarkerTree\\`] ...`. The result reads as one run-on doc comment repeating the `Resolve ...` sentence, which is confusing/outdated.","fix":"Delete the stale first paragraph (lines 726-734) so only the current, accurate summary starting at `Resolve unencoded package extra markers ...` remains, keeping the `scope_package` explanation.","locations":[{"ref":"crates/uv-resolver/src/universal_marker.rs:753-767","code":"  753 | /// Resolve the conflict markers in a [`MarkerTree`] based on the conditions under which each\n  754 | /// conflict item is known to be true.\n  755 | ///\n  756 | /// For example, if the `cpu` extra is known to be enabled when `sys_platform == 'darwin'`, then\n  757 | /// given the combined marker `python_version >= '3.8' and extra == 'extra-7-project-cpu'`, this\n  758 | /// method would return `python_version >= '3.8' and sys_platform == 'darwin'`.\n  759 | ///\n  760 | /// If a conflict item isn't present in the map of known conflicts, it's assumed to be false in all\n  761 | /// environments.\n  762 | /// Resolve unencoded package extra markers and conflict-encoded extra markers in a\n  763 | /// [`MarkerTree`] based on the conditions under which each item is known to be true.\n  764 | ///\n  765 | /// When `scope_package` is set, unencoded package extras like `extra == 'cpu'` are interpreted\n  766 | /// relative to that package. Conflict-encoded extras and groups are resolved independent of\n  767 | /// `scope_package`.","lines":15,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-resolver/src/universal_marker.rs#L753-L767"}]},
{"id":"CMT_22","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The step-numbering comments in `DisplayDependencyGraph::new` are wrong: `// Step 2: Add all dependencies.` is followed by `// Step 2: Reverse the graph.` (duplicate `Step 2`) and then `// Step 3: Filter the graph...`, so the reverse and filter phases are mislabeled.","fix":"Renumber the later comments: change `// Step 2: Reverse the graph.` to `// Step 3: Reverse the graph.` and `// Step 3: Filter the graph to those nodes reachable from the target packages.` to `// Step 4: ...` (and adjust subsequent step numbers as needed).","locations":[{"ref":"crates/uv/src/commands/pip/tree.rs:252-253","code":"  252 |         // Step 2: Add all dependencies.\n  253 |         for index in graph.node_indices() {","lines":2,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv/src/commands/pip/tree.rs#L252-L253"},{"ref":"crates/uv/src/commands/pip/tree.rs:286-291","code":"  286 |         // Step 2: Reverse the graph.\n  287 |         if invert {\n  288 |             graph.reverse();\n  289 |         }\n  290 | \n  291 |         // Step 3: Filter the graph to those nodes reachable from the target packages.","lines":6,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv/src/commands/pip/tree.rs#L286-L291"}]},
{"id":"CMT_23","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The debug message in the \"required platforms\" invalidation branch of `ValidatedLock::validate` reads `Resolving despite existing lockfile due to change in supported environments`, but this block compares `lock.simplified_required_environments()` (required environments/platforms), not supported environments. The identical message is already (correctly) used for the supported-environments block just above at line 1256, so this log is misleading when diagnosing why a lock was invalidated.","fix":"Change the message to reference required environments, e.g. `\"Resolving despite existing lockfile due to change in required environments: ...\"`.","locations":[{"ref":"crates/uv/src/commands/project/lock.rs:1314-1328","code":" 1314 |         let expected = lock.simplified_required_environments();\n 1315 |         let actual = required_environments\n 1316 |             .map(SupportedEnvironments::as_markers)\n 1317 |             .unwrap_or_default()\n 1318 |             .iter()\n 1319 |             .copied()\n 1320 |             .map(|marker| lock.simplify_environment(marker))\n 1321 |             .collect::<Vec<_>>();\n 1322 |         if expected != actual {\n 1323 |             debug!(\n 1324 |                 \"Resolving despite existing lockfile due to change in supported environments: `{:?}` vs. `{:?}`\",\n 1325 |                 expected, actual\n 1326 |             );\n 1327 |             return Ok(Self::Versions(lock));\n 1328 |         }","lines":15,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv/src/commands/project/lock.rs#L1314-L1328"}]},

{"id":"CMT_25","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Two stray-typo comments and one misspelling. `run.rs:1759` and `run.rs:1796` end with `// See `install-wheel-rs::get_script_executable`.gd` - the trailing `.gd` is a typo. `run.rs:2005` says `that cannot ber parsed` ('ber' should be 'be').","fix":"Remove the trailing `.gd` from both `get_script_executable` comments and change `ber` to `be` in the `read_recursion_depth_from_environment_variable` doc comment.","locations":[{"ref":"crates/uv/src/commands/project/run.rs:1776","code":" 1776 |                 // See `install-wheel-rs::get_script_executable`.gd","lines":1,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv/src/commands/project/run.rs#L1776"},{"ref":"crates/uv/src/commands/project/run.rs:1776","code":" 1776 |                 // See `install-wheel-rs::get_script_executable`.gd","lines":1,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv/src/commands/project/run.rs#L1776"},{"ref":"crates/uv/src/commands/project/run.rs:1985","code":" 1985 | /// that cannot ber parsed as an integer.","lines":1,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv/src/commands/project/run.rs#L1985"}]},
{"id":"CMT_26","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The doc comment on `BarState::sizes` says the list is `in descending order`, but `on_request_start` maintains it in ascending order (`partition_point(|&len| len < size)` inserts before the first element `>= size`), and the adjacent comment at the insertion site explicitly says `Preserve ascending order.`. The field comment is misleading.","fix":"Change the comment from `/// A list of download bar sizes, in descending order.` to `/// A list of download bar sizes, in ascending order.`","locations":[{"ref":"crates/uv/src/commands/reporters.rs:75-76","code":"   75 |     /// A list of download bar sizes, in descending order.\n   76 |     sizes: Vec<u64>,","lines":2,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv/src/commands/reporters.rs#L75-L76"},{"ref":"crates/uv/src/commands/reporters.rs:226-228","code":"  226 |         // Preserve ascending order.\n  227 |         let position = size.map_or(0, |size| state.sizes.partition_point(|&len| len < size));\n  228 |         state.sizes.insert(position, size.unwrap_or(0));","lines":3,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv/src/commands/reporters.rs#L226-L228"}]},
