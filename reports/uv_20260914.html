{"id":"CMT_28","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The doc comment for `setup_logging` references a nonexistent enum variant `Level::Verbose` (the `Level` enum only has `Off`, `DebugUv`, `TraceUv`, `TraceAll`). The claim that a `Level` value \"includes targets and timestamps\" is also outdated: whether targets/timestamps are shown is now controlled by the separate `detailed_logging` parameter, not by the `Level`.","fix":"Update the doc comment to reference an existing variant and the `detailed_logging` parameter, e.g. describe that `Level::DebugUv` shows `uv=debug` messages and that `detailed_logging` adds targets/timestamps.","locations":[{"ref":"crates/uv/src/logging.rs:30-32","code":"   30 | /// The [`Level`] is used to dictate the default filters (which can be overridden by the `RUST_LOG`\n   31 | /// environment variable) along with the formatting of the output. For example, [`Level::Verbose`]\n   32 | /// includes targets and timestamps, along with all `uv=debug` messages by default.","lines":3,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv/src/logging.rs#L30-L32"},{"ref":"crates/uv/src/logging.rs:18-25","code":"   18 | #[derive(Debug, Default, Clone, Copy, PartialEq, Eq)]\n   19 | pub(crate) enum Level {\n   20 |     #[default]\n   21 |     Off,\n   22 |     DebugUv,\n   23 |     TraceUv,\n   24 |     TraceAll,\n   25 | }","lines":8,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv/src/logging.rs#L18-L25"}]},
{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"very_easy","description":"`KeyringProvider::store` and `KeyringProvider::remove` in `crates/uv-auth/src/keyring.rs` each independently rebuild the same 'target' string (strip credentials, decide host-only vs full-URL, prepend the scheme for non-`https` URLs, append the port) with byte-for-byte identical logic (`crates/uv-auth/src/keyring.rs:93-111` and `crates/uv-auth/src/keyring.rs:143-161`). Any future fix to this scheme-leak-prevention logic (already subtle, per the comment about avoiding leaking credentials across schemes) has to be made in two places, and the two copies can silently drift apart.","fix":"Extract the shared logic into a single helper and call it from both methods:\n```rust\nfn keyring_target(url: &DisplaySafeUrl) -> String {\n    let url = url.without_credentials();\n    if let Some(host) = url.host_str().filter(|_| !url.path().is_empty()) {\n        let mut target = String::new();\n        if url.scheme() != \"https\" {\n            target.push_str(url.scheme());\n            target.push_str(\"://\");\n        }\n        target.push_str(host);\n        if let Some(port) = url.port() {\n            target.push(':');\n            target.push_str(&port.to_string());\n        }\n        target\n    } else {\n        url.to_string()\n    }\n}\n```\nthen call `Self::keyring_target(url)` from both `store` and `remove`.","locations":[{"ref":"crates/uv-auth/src/keyring.rs:93-111","code":"   93 |         // Ensure we strip credentials from the URL before storing\n   94 |         let url = url.without_credentials();\n   95 | \n   96 |         // If there's no path, we'll perform a host-level login\n   97 |         let target = if let Some(host) = url.host_str().filter(|_| !url.path().is_empty()) {\n   98 |             let mut target = String::new();\n   99 |             if url.scheme() != \"https\" {\n  100 |                 target.push_str(url.scheme());\n  101 |                 target.push_str(\"://\");\n  102 |             }\n  103 |             target.push_str(host);\n  104 |             if let Some(port) = url.port() {\n  105 |                 target.push(':');\n  106 |                 target.push_str(&port.to_string());\n  107 |             }\n  108 |             target\n  109 |         } else {\n  110 |             url.to_string()\n  111 |         };","lines":19,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-auth/src/keyring.rs#L93-L111"},{"ref":"crates/uv-auth/src/keyring.rs:143-161","code":"  143 |         // Ensure we strip credentials from the URL before storing\n  144 |         let url = url.without_credentials();\n  145 | \n  146 |         // If there's no path, we'll perform a host-level login\n  147 |         let target = if let Some(host) = url.host_str().filter(|_| !url.path().is_empty()) {\n  148 |             let mut target = String::new();\n  149 |             if url.scheme() != \"https\" {\n  150 |                 target.push_str(url.scheme());\n  151 |                 target.push_str(\"://\");\n  152 |             }\n  153 |             target.push_str(host);\n  154 |             if let Some(port) = url.port() {\n  155 |                 target.push(':');\n  156 |                 target.push_str(&port.to_string());\n  157 |             }\n  158 |             target\n  159 |         } else {\n  160 |             url.to_string()\n  161 |         };","lines":19,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-auth/src/keyring.rs#L143-L161"}]},
{"id":"DUP_2","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"very_easy","description":"`Manifest::overrides` has two `match mode` arms (`DependencyMode::Transitive` and `DependencyMode::Direct`) whose bodies are byte-for-byte identical - both return `self.overrides.global_requirements().filter(...).filter(...).map(Cow::Borrowed)`. The `Either::Left`/`Either::Right` wrapping and the `mode` match add complexity without behavioral difference, obscuring that global overrides are mode-independent.","fix":"Drop the `match mode` and the `Either` wrapper entirely, returning the single expression: `self.overrides.global_requirements().filter(|requirement| !self.excludes.contains(&requirement.name)).filter(move |requirement| requirement.evaluate_markers(env.marker_environment(), &[])).map(Cow::Borrowed)`. The `mode` parameter can then be dropped or kept for API symmetry.","locations":[{"ref":"crates/uv-resolver/src/manifest.rs:213-240","code":"  213 |     pub(crate) fn overrides<'a>(\n  214 |         &'a self,\n  215 |         env: &'a ResolverEnvironment,\n  216 |         mode: DependencyMode,\n  217 |     ) -> impl Iterator<Item = Cow<'a, Requirement>> + 'a {\n  218 |         match mode {\n  219 |             // Include all direct and transitive requirements, with constraints and overrides applied.\n  220 |             DependencyMode::Transitive => Either::Left(\n  221 |                 self.overrides\n  222 |                     .global_requirements()\n  223 |                     .filter(|requirement| !self.excludes.contains(&requirement.name))\n  224 |                     .filter(move |requirement| {\n  225 |                         requirement.evaluate_markers(env.marker_environment(), &[])\n  226 |                     })\n  227 |                     .map(Cow::Borrowed),\n  228 |             ),\n  229 |             // Include direct requirements, with constraints and overrides applied.\n  230 |             DependencyMode::Direct => Either::Right(\n  231 |                 self.overrides\n  232 |                     .global_requirements()\n  233 |                     .filter(|requirement| !self.excludes.contains(&requirement.name))\n  234 |                     .filter(move |requirement| {\n  235 |                         requirement.evaluate_markers(env.marker_environment(), &[])\n  236 |                     })\n  237 |                     .map(Cow::Borrowed),\n  238 |             ),\n  239 |         }\n  240 |     }","lines":28,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-resolver/src/manifest.rs#L213-L240"}]},
{"id":"DUP_3","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"easy","description":"The `FileData` enum and its `bytes()` method are duplicated verbatim between `find_links.rs` and `packse/server.rs`. Both define `enum FileData { Bytes(Arc<[u8]>), Vendor(&'static VendorArtifact) }` and an identical `fn bytes(&self) -> anyhow::Result<Arc<[u8]>>` that clones for the `Bytes` variant and delegates to `artifact.bytes()` for `Vendor`. Since both modules already share `crate::http_server::content_type_for_filename` and `crate::vendor::{VendorArtifact, vendor_artifacts}`, the abstraction is a natural candidate for the shared module.","fix":"Move `FileData` and its `bytes()` impl into a shared module (e.g. `http_server` or `vendor`) and import it in both `find_links.rs` and `packse/server.rs` instead of redeclaring it.","locations":[{"ref":"crates/uv-test/src/find_links.rs:14-26","code":"   14 | enum FileData {\n   15 |     Bytes(Arc<[u8]>),\n   16 |     Vendor(&'static VendorArtifact),\n   17 | }\n   18 | \n   19 | impl FileData {\n   20 |     fn bytes(&self) -> anyhow::Result<Arc<[u8]>> {\n   21 |         match self {\n   22 |             Self::Bytes(bytes) => Ok(Arc::clone(bytes)),\n   23 |             Self::Vendor(artifact) => artifact.bytes(),\n   24 |         }\n   25 |     }\n   26 | }","lines":13,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-test/src/find_links.rs#L14-L26"},{"ref":"crates/uv-test/src/packse/server.rs:48-60","code":"   48 | enum FileData {\n   49 |     Bytes(Arc<[u8]>),\n   50 |     Vendor(&'static VendorArtifact),\n   51 | }\n   52 | \n   53 | impl FileData {\n   54 |     fn bytes(&self) -> anyhow::Result<Arc<[u8]>> {\n   55 |         match self {\n   56 |             Self::Bytes(bytes) => Ok(Arc::clone(bytes)),\n   57 |             Self::Vendor(artifact) => artifact.bytes(),\n   58 |         }\n   59 |     }\n   60 | }","lines":13,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-test/src/packse/server.rs#L48-L60"}]},
{"id":"DUP_4","type":"duplicate_code","type_label":"Duplicate Code","severity":"negligible","difficulty":"easy","description":"`directories`, `entries`, and `files` are three near-identical functions differing only by the `file_type` predicate applied (dir / none / file). The `read_dir` + NotFound-to-empty + warn-on-error + map-to-path boilerplate is copied verbatim three times.","fix":"Extract a private helper returning the common iterator of `DirEntry` (handling the NotFound and per-entry warning logic once), then have the three public functions layer their `file_type` filter and `path()` map on top of it.","locations":[{"ref":"crates/uv-fs/src/lib.rs:790-855","code":"  790 | pub fn directories(\n  791 |     path: impl AsRef<Path>,\n  792 | ) -> Result<impl Iterator<Item = PathBuf>, std::io::Error> {\n  793 |     let entries = match path.as_ref().read_dir() {\n  794 |         Ok(entries) => Some(entries),\n  795 |         Err(err) if err.kind() == std::io::ErrorKind::NotFound => None,\n  796 |         Err(err) => return Err(err),\n  797 |     };\n  798 |     Ok(entries\n  799 |         .into_iter()\n  800 |         .flatten()\n  801 |         .filter_map(|entry| match entry {\n  802 |             Ok(entry) => Some(entry),\n  803 |             Err(err) => {\n  804 |                 warn!(\"Failed to read entry: {err}\");\n  805 |                 None\n  806 |             }\n  807 |         })\n  808 |         .filter(|entry| entry.file_type().is_ok_and(|file_type| file_type.is_dir()))\n  809 |         .map(|entry| entry.path()))\n  810 | }\n  811 | \n  812 | /// Iterate over the entries in a directory.\n  813 | ///\n  814 | /// If the directory does not exist, returns an empty iterator.\n  815 | pub fn entries(path: impl AsRef<Path>) -> Result<impl Iterator<Item = PathBuf>, std::io::Error> {\n  816 |     let entries = match path.as_ref().read_dir() {\n  817 |         Ok(entries) => Some(entries),\n  818 |         Err(err) if err.kind() == std::io::ErrorKind::NotFound => None,\n  819 |         Err(err) => return Err(err),\n  820 |     };\n  821 |     Ok(entries\n  822 |         .into_iter()\n  823 |         .flatten()\n  824 |         .filter_map(|entry| match entry {\n  825 |             Ok(entry) => Some(entry),\n  826 |             Err(err) => {\n  827 |                 warn!(\"Failed to read entry: {err}\");\n  828 |                 None\n  829 |             }\n  830 |         })\n  831 |         .map(|entry| entry.path()))\n  832 | }\n  833 | \n  834 | /// Iterate over the files in a directory.\n  835 | ///\n  836 | /// If the directory does not exist, returns an empty iterator.\n  837 | pub fn files(path: impl AsRef<Path>) -> Result<impl Iterator<Item = PathBuf>, std::io::Error> {\n  838 |     let entries = match path.as_ref().read_dir() {\n  839 |         Ok(entries) => Some(entries),\n  840 |         Err(err) if err.kind() == std::io::ErrorKind::NotFound => None,\n  841 |         Err(err) => return Err(err),\n  842 |     };\n  843 |     Ok(entries\n  844 |         .into_iter()\n  845 |         .flatten()\n  846 |         .filter_map(|entry| match entry {\n  847 |             Ok(entry) => Some(entry),\n  848 |             Err(err) => {\n  849 |                 warn!(\"Failed to read entry: {err}\");\n  850 |                 None\n  851 |             }\n  852 |         })\n  853 |         .filter(|entry| entry.file_type().is_ok_and(|file_type| file_type.is_file()))\n  854 |         .map(|entry| entry.path()))\n  855 | }","lines":66,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-fs/src/lib.rs#L790-L855"}]},
{"id":"OTHER_1","type":"other","type_label":"Other","severity":"high","difficulty":"medium","description":"In `Osv::vuln_cache_entry`, the vulnerability `id` used to build the on-disk cache filename comes directly from the untrusted OSV batch-query response (`VulnSummary.id`, deserialized with no format validation) and is interpolated verbatim into a filename via `format!(\"{id}.msgpack\")`, then joined onto the cache directory with `CacheEntry::new` (`crates/uv-cache/src/lib.rs:57-59`, `dir.into().join(file)`). Because `PathBuf::join` honors `..`/`/` path components, a malicious or compromised vulnerability-service response (reachable via the user-configurable `--service-url` flag, or via a compromised/mirrored `osv.dev`) can supply an id such as `../../../../home/user/.bashrc` to make `fetch_vuln` write the fetched HTTP response (via `CachedClient::get_serde_with_retry` -> `write_atomic`, which does `tempfile_in(path.parent())` then renames into `path` with no path containment check) to an attacker-chosen location outside the intended `CacheBucket::Osv/vulnerability/` directory. This is a path-traversal / arbitrary file write primitive driven entirely by attacker-controlled network data, in a crate whose whole purpose is security auditing. The `types.rs` doc comment for `VulnerabilityID` explicitly says 'No assumptions should be made about the format of these identifiers', confirming the id is treated as opaque data, yet it is used unsanitized as a filesystem path component.","fix":"Validate/sanitize `id` before using it as a filesystem path component in `vuln_cache_entry`, e.g. reject or percent-encode any id containing `/`, `\\`, or `..`, or better, derive the cache filename from a hash of `id` (e.g. `uv_cache_key`) instead of the raw attacker-controlled string:\n```rust\nfn vuln_cache_entry(&self, id: &str) -> CacheEntry {\n    let bucket = self.cache.bucket(CacheBucket::Osv);\n    let safe_name = uv_cache_key::cache_digest(&id);\n    CacheEntry::new(bucket.join(\"vulnerability\"), format!(\"{safe_name}.msgpack\"))\n}\n```\nAlternatively, add a defensive check that `id` contains only the characters expected in vulnerability identifiers (alphanumeric, `-`, `_`, `.`) and return an `Error` otherwise.","locations":[{"ref":"crates/uv-audit/src/service/osv.rs:182-185","code":"  182 | #[derive(Debug, Clone, Deserialize)]\n  183 | struct VulnSummary {\n  184 |     id: String,\n  185 | }","lines":4,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-audit/src/service/osv.rs#L182-L185"},{"ref":"crates/uv-audit/src/service/osv.rs:260-263","code":"  260 |     fn vuln_cache_entry(&self, id: &str) -> CacheEntry {\n  261 |         let bucket = self.cache.bucket(CacheBucket::Osv);\n  262 |         CacheEntry::new(bucket.join(\"vulnerability\"), format!(\"{id}.msgpack\"))\n  263 |     }","lines":4,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-audit/src/service/osv.rs#L260-L263"},{"ref":"crates/uv-audit/src/service/osv.rs:394-400","code":"  394 |     async fn fetch_vuln(&self, id: &str) -> Result<Vulnerability, Error> {\n  395 |         let url = self\n  396 |             .base_url\n  397 |             .join(&format!(\"v1/vulns/{id}\"))\n  398 |             .map_err(|e| Error::Url(self.base_url.clone(), e))?;\n  399 | \n  400 |         let cache_entry = self.vuln_cache_entry(id);","lines":7,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-audit/src/service/osv.rs#L394-L400"},{"ref":"crates/uv-audit/src/types.rs:33-38","code":"   33 | /// An opaque identifier for a vulnerability. These are conventionally\n   34 | /// formatted as `SRC-XXXX-YYYY`, where `SRC` is an identifier for the vulnerability source,\n   35 | /// `XXXX` is typically a year or other \"bucket\" identifier, and `YYYY` is a unique identifier\n   36 | /// within that bucket. For example, `CVE-2026-12345` or `PYSEC-2023-0001`.\n   37 | ///\n   38 | /// No assumptions should be made about the format of these identifiers.","lines":6,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-audit/src/types.rs#L33-L38"}]},
{"id":"OTHER_2","type":"other","type_label":"Other","severity":"medium","difficulty":"easy","description":"`Osv::fetch_vuln` builds the vulnerability-detail request URL by directly formatting the untrusted, server-supplied `id` into a path segment: `self.base_url.join(&format!(\"v1/vulns/{id}\"))`. Since `Url::join` resolves `..` segments, an id containing traversal sequences (e.g. `../../admin/internal-endpoint`) lets a malicious or compromised vulnerability service redirect uv's own follow-up request to an arbitrary path on the same host (bypassing the intended `v1/vulns/` API surface). Combined with the fact that the batch query endpoint that supplies these ids is queried without any credential handling from the caller's side, this allows a malicious service to steer uv's outgoing requests to unexpected paths on the configured `--service-url` host.","fix":"Validate that `id` cannot alter the URL path structure before using it in `format!(\"v1/vulns/{id}\")`, e.g.:\n```rust\nif id.contains('/') || id.contains('\\\\') || id == \"..\" {\n    return Err(Error::MalformedRecord { id: id.to_string(), .. });\n}\n```\nor URL-encode `id` with `percent_encoding` before interpolating it into the path so that `/` and `..` cannot change the resolved path segments.","locations":[{"ref":"crates/uv-audit/src/service/osv.rs:394-398","code":"  394 |     async fn fetch_vuln(&self, id: &str) -> Result<Vulnerability, Error> {\n  395 |         let url = self\n  396 |             .base_url\n  397 |             .join(&format!(\"v1/vulns/{id}\"))\n  398 |             .map_err(|e| Error::Url(self.base_url.clone(), e))?;","lines":5,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-audit/src/service/osv.rs#L394-L398"}]},
{"id":"OTHER_3","type":"other","type_label":"Other","severity":"medium","difficulty":"easy","description":"`TextCredentialStore::write` in `crates/uv-auth/src/store.rs:312-337` writes the entire `credentials.toml` file (which can hold every stored credential across all realms) via a single non-atomic `fs::write(path, content)` call at line 335, acknowledged by the adjacent `// TODO(zanieb): We should use an atomic write here` comment. If the process is interrupted mid-write (crash, kill, power loss, disk full), the file can be left truncated or corrupted, causing the *entire* credential store to fail to parse (or silently lose entries) on next read, unlike a single-realm-scoped failure. This is a real data-loss risk, not just a style nit, since it can wipe out all saved credentials for every configured index.","fix":"Write to a temporary file in the same directory and then atomically rename it into place, e.g. ```rust\nlet tmp = path.as_ref().with_extension(\"toml.tmp\");\nfs::write(&tmp, content)?;\nfs::rename(&tmp, path.as_ref())?;\n``` so a crash mid-write leaves either the old or the new complete file, never a truncated one.","locations":[{"ref":"crates/uv-auth/src/store.rs:312-337","code":"  312 |     pub fn write<P: AsRef<Path>>(\n  313 |         self,\n  314 |         path: P,\n  315 |         _lock: LockedFile,\n  316 |     ) -> Result<(), TomlCredentialError> {\n  317 |         let credentials = self\n  318 |             .credentials\n  319 |             .into_iter()\n  320 |             .map(|((service, _username), credentials)| TomlCredential {\n  321 |                 service,\n  322 |                 credentials,\n  323 |             })\n  324 |             .collect::<Vec<_>>();\n  325 | \n  326 |         let toml_creds = TomlCredentials { credentials };\n  327 |         let content = toml::to_string_pretty(&toml_creds)?;\n  328 |         fs::create_dir_all(\n  329 |             path.as_ref()\n  330 |                 .parent()\n  331 |                 .ok_or(TomlCredentialError::CredentialsDirError)?,\n  332 |         )?;\n  333 | \n  334 |         // TODO(zanieb): We should use an atomic write here\n  335 |         fs::write(path, content)?;\n  336 |         Ok(())\n  337 |     }","lines":26,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-auth/src/store.rs#L312-L337"}]},
{"id":"OTHER_4","type":"other","type_label":"Other","severity":"low","difficulty":"hard","description":"`cache_digest` (used pervasively for cache directory naming, e.g. `WheelCache::root` in `crates/uv-cache/src/wheel.rs:27-46`) hashes attacker-influenceable input (index URLs, package URLs, path dependency URLs) down to a single 64-bit `SeaHasher` digest with no collision detection or fallback. `SeaHasher` is a fast, non-cryptographic hash, not designed to resist deliberate collision search. Two distinct URLs that collide on this 64-bit digest would be cached under the exact same directory, causing one URL's cached wheel/metadata to be silently served for a completely different URL (cache corruption/poisoning), with no code path anywhere checking that the directory's contents actually correspond to the hashed input.","fix":"Store the original canonicalized URL string (or a longer/cryptographic digest such as truncated `SHA-256`) alongside the cache entry and verify it on read, so a hash collision degrades to a cache miss instead of returning wrong data; alternatively, widen `cache_digest` to use a keyed/cryptographic hash for values derived from external, potentially adversarial input such as index and package URLs.","locations":[{"ref":"crates/uv-cache-key/src/digest.rs:11-20","code":"   11 | pub fn cache_digest<H: CacheKey>(hashable: &H) -> String {\n   12 |     /// Compute a u64 hash of a [`CacheKey`] object.\n   13 |     fn cache_key_u64<H: CacheKey>(hashable: &H) -> u64 {\n   14 |         let mut hasher = CacheKeyHasher::new();\n   15 |         hashable.cache_key(&mut hasher);\n   16 |         hasher.finish()\n   17 |     }\n   18 | \n   19 |     to_hex(cache_key_u64(hashable))\n   20 | }","lines":10,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-cache-key/src/digest.rs#L11-L20"},{"ref":"crates/uv-cache/src/wheel.rs:27-47","code":"   27 |     pub fn root(&self) -> PathBuf {\n   28 |         match self {\n   29 |             Self::Index(IndexUrl::Pypi(_)) => WheelCacheKind::Pypi.root(),\n   30 |             Self::Index(url) => WheelCacheKind::Index\n   31 |                 .root()\n   32 |                 .join(cache_digest(&CanonicalUrl::new(url.url().clone()))),\n   33 |             Self::Url(url) => WheelCacheKind::Url\n   34 |                 .root()\n   35 |                 .join(cache_digest(&CanonicalUrl::new((*url).clone()))),\n   36 |             Self::Path(url) => WheelCacheKind::Path\n   37 |                 .root()\n   38 |                 .join(cache_digest(&CanonicalUrl::new((*url).clone()))),\n   39 |             Self::Editable(url) => WheelCacheKind::Editable\n   40 |                 .root()\n   41 |                 .join(cache_digest(&CanonicalUrl::new((*url).clone()))),\n   42 |             Self::Git(url, sha) => WheelCacheKind::Git\n   43 |                 .root()\n   44 |                 .join(cache_digest(&CanonicalUrl::new((*url).clone())))\n   45 |                 .join(sha),\n   46 |         }\n   47 |     }","lines":21,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-cache/src/wheel.rs#L27-L47"}]},
{"id":"OTHER_5","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"In the `TrustedPublishing` enum, the `Automatic` variant has a proper `///` doc comment (used by both `clap::ValueEnum` to populate `--trusted-publishing=<VALUE>` possible-value help text, and by `schemars::JsonSchema` for the generated config schema description), but the `Always` and `Never` variants use plain `//` comments instead of `///`. Plain `//` comments are not picked up by either `clap`'s or `schemars`'s derive macros, so `uv publish --help` and the generated JSON schema will show a description for `automatic` but no description at all for `always`/`never`, which is an inconsistent, easily-missed regression risk for anyone extending this enum.","fix":"Change the two plain comments to doc comments so they are picked up by `clap`/`schemars`:\n```rust\n/// Force trusted publishing.\nAlways,\n/// Never try to get a trusted publishing token.\nNever,\n```","locations":[{"ref":"crates/uv-configuration/src/trusted_publishing.rs:13-16","code":"   13 |     // Force trusted publishing.\n   14 |     Always,\n   15 |     // Never try to get a trusted publishing token.\n   16 |     Never,","lines":4,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-configuration/src/trusted_publishing.rs#L13-L16"}]},
{"id":"OTHER_6","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"In `warn_uv_toml_masked_fields`, every masked field is pushed using its kebab-case TOML key (e.g. `\"cache-dir\"`, `\"override-dependencies\"`) except `cache_keys`, which is pushed as the snake_case identifier `\"cache_keys\"`. The user-facing warning (\"The following fields from `[tool.uv]` will be ignored...\") will therefore list `cache_keys` instead of the actual TOML key `cache-keys`, which is confusing and doesn't match what the user wrote in their file.","fix":"Change `masked_fields.push(\"cache_keys\");` to `masked_fields.push(\"cache-keys\");` to match the kebab-case key used by `#[serde(rename_all = \"kebab-case\")]` and every other entry in this function.","locations":[{"ref":"crates/uv-settings/src/lib.rs:642-644","code":"  642 |     if cache_keys.is_some() {\n  643 |         masked_fields.push(\"cache_keys\");\n  644 |     }","lines":3,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-settings/src/lib.rs#L642-L644"}]},
{"id":"OTHER_7","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"`Error::BadUncompressedSize` and `Error::BadCompressedSize` format byte counts (`u64` sizes) with `{computed:08x}` / `{expected:08x}`, i.e. zero-padded hexadecimal. Unlike a CRC32 (where hex is conventional), file sizes are expected to be shown in decimal, so a size mismatch prints e.g. `got 000f4240, expected 00100000`, which is confusing to users. The neighbouring size-related variants (e.g. the `Conflicting*Sizes` ones) correctly print sizes in decimal.","fix":"Drop the `:08x` hex formatting for the size fields, e.g. `\"Bad uncompressed size (got {computed}, expected {expected}) for file: {}\"`, matching the decimal formatting used by the `Conflicting*Sizes` variants.","locations":[{"ref":"crates/uv-extract/src/error.rs:41-52","code":"   41 |     #[error(\"Bad uncompressed size (got {computed:08x}, expected {expected:08x}) for file: {}\", path.display())]\n   42 |     BadUncompressedSize {\n   43 |         path: PathBuf,\n   44 |         computed: u64,\n   45 |         expected: u64,\n   46 |     },\n   47 |     #[error(\"Bad compressed size (got {computed:08x}, expected {expected:08x}) for file: {}\", path.display())]\n   48 |     BadCompressedSize {\n   49 |         path: PathBuf,\n   50 |         computed: u64,\n   51 |         expected: u64,\n   52 |     },","lines":12,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-extract/src/error.rs#L41-L52"}]},
{"id":"OTHER_8","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"The `#[error(...)]` format string for `Error::MissingLocalFileHeader` is missing the closing parenthesis around `{offset}`: it reads `... for: {} ({offset}` whereas the analogous `MissingCentralDirectoryEntry` variant directly above correctly reads `... for: {} ({offset})`. This renders a malformed, unbalanced user-facing error message (e.g. `... for: foo (123`).","fix":"Add the missing `)`: change `\"...header for: {} ({offset}\"` to `\"...header for: {} ({offset})\"`.","locations":[{"ref":"crates/uv-extract/src/error.rs:59-60","code":"   59 |     #[error(\"ZIP file contains an end-of-central-directory record entry, but no local file header for: {} ({offset}\", path.display())]\n   60 |     MissingLocalFileHeader { path: PathBuf, offset: u64 },","lines":2,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-extract/src/error.rs#L59-L60"}]},

<script>
(function(){
'use strict';

// Data
const FINDINGS     = JSON.parse(document.getElementById('D').textContent);
const PROJECT_INFO = JSON.parse(document.getElementById('PI').textContent);
const SEVS     = ['critical','high','medium','low','negligible'];
const STATUSES = ['open','fixed','wont-fix','false-positive'];
const ALL_TYPES = [...new Set(FINDINGS.map(f => f.type))].sort(cmpTypes);
// Build lookup map for O(1) access
const FINDING_BY_ID = new Map(FINDINGS.map(f => [f.id, f]));
// Only severities actually present in the report — the filter bar hides the rest.
const PRESENT_SEVS = SEVS.filter(s => FINDINGS.some(f => (f.severity || 'medium') === s));
// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};
const PRESENT_DIFFS = DIFFICULTY_ORDER.filter(d => FINDINGS.some(f => f.difficulty === d));
const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', searchScope: 'all', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),
};
const statuses = {};

// Persistence
function loadStatuses() {
  try { Object.assign(statuses, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}
}
function saveStatuses() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    if (S.searchScope !== 'all') p.set('qs', S.searchScope);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('qs'))  { S.searchScope = p.get('qs'); }
  document.getElementById('search-scope').classList.toggle('active', S.searchScope === 'locations');
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }
function isCustom(t)  { return String(t).toLowerCase() === 'custom'; }
function typeCls(t)   { return 'type-badge' + (isCustom(t) ? ' custom-type' : ''); }
// 'custom' findings are the user's own externally-sourced ones; pin them first
// everywhere types are listed so they never blend into the audit's own categories.
function cmpTypes(a, b) {
  if (isCustom(a) !== isCustom(b)) return isCustom(a) ? -1 : 1;
  return String(a).localeCompare(String(b));
}

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort(cmpTypes);

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build a [project] header block from embedded PROJECT_INFO, so the exported
// findings.toml is self-contained (doesn't depend on a sibling project-info.toml
// that a second, separately-triggered download could silently fail to save).
// '' when there is no project info at all.
function buildProjectToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = PROJECT_INFO || {};
  if (!Object.keys(pi).length) return '';
  const lines = ['[project]'];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n\n';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    // Pin the id so re-rendering this export - or filtering it down later - can't
    // renumber findings that were already referenced by id elsewhere.
    if (f.id && f.id !== '?') lns.push(pad('id') + '= ' + tomlStr(f.id));
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return buildProjectToml() + chunks.join('\n\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'folder') {
    if (!f.locations.length) return '(no location)';
    const path = f.locations[0].ref.replace(/:.*/,'');
    const idx = path.lastIndexOf('/');
    return idx === -1 ? '(root)' : path.slice(0, idx);
  }
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystacks per finding (cleared on full re-render).
// Two variants: everything (default), and file/folder paths only - for when a
// search term (e.g. a directory name like 'dlls/abc') also happens to appear
// inside description/fix prose and you only want path matches.
const _hay = new Map();
const _hayLoc = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}
function hayLocOf(f) {
  if (!_hayLoc.has(f.id)) {
    _hayLoc.set(f.id, f.locations.map(l => l.ref).join(' ').toLowerCase());
  }
  return _hayLoc.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (S.searchScope === 'locations') {
      if (!hayLocOf(f).includes(q)) return false;
    } else if (!hayOf(f).includes(q) && !st.includes(q)) {
      return false;
    }
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  if (S.groupBy === 'type') return [...keys].sort(cmpTypes);
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge ' + typeCls(f.type) + '" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge ' + typeCls(t) + '" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  _hayLoc.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    // Single download (was two) - a second auto-triggered download is commonly
    // blocked by the browser unless the user explicitly allows it, which silently
    // drops project-info.toml. Embedding [project] in findings.toml itself avoids
    // that failure mode entirely.
    downloadText(buildFindingsToml(), 'findings.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});
document.getElementById('search-scope').addEventListener('click', e => {
  S.searchScope = S.searchScope === 'locations' ? 'all' : 'locations';
  e.currentTarget.classList.toggle('active', S.searchScope === 'locations');
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
