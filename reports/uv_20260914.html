n (missing)\"),\n    }\n}\n```","locations":[{"ref":"crates/uv-client/src/html.rs:145-191","code":"  145 |     fn parse_project_status(parser: &Parser, head: &Node) -> Option<ProjectStatus> {\n  146 |         let children = head.children()?;\n  147 | \n  148 |         let mut status: Option<Status> = None;\n  149 |         let mut reason: Option<SmallString> = None;\n  150 |         for node in children.all(parser) {\n  151 |             let tag = match node.as_tag() {\n  152 |                 Some(tag) if is_tag(tag, b\"meta\") => tag,\n  153 |                 _ => continue,\n  154 |             };\n  155 | \n  156 |             let Some(name) = attribute(tag, \"name\") else {\n  157 |                 continue;\n  158 |             };\n  159 | \n  160 |             // Per PEP 792: both `pypi:project-status` and `pypi:project-status-reason`\n  161 |             // are optional, but if present should be well-formed.\n  162 |             match name.as_ref() {\n  163 |                 \"pypi:project-status\" => {\n  164 |                     status = {\n  165 |                         let status = attribute(tag, \"content\").as_deref().and_then(Status::new)?;\n  166 |                         Some(status)\n  167 |                     };\n  168 |                 }\n  169 |                 \"pypi:project-status-reason\" => {\n  170 |                     reason = {\n  171 |                         let Some(content) =\n  172 |                             attribute(tag, \"content\").as_deref().map(SmallString::from)\n  173 |                         else {\n  174 |                             // TODO: Make this a hard error instead?\n  175 |                             warn!(\"Invalid project status reason (missing)\");\n  176 |                             return None;\n  177 |                         };\n  178 |                         Some(content)\n  179 |                     }\n  180 |                 }\n  181 |                 _ => {}\n  182 |             }\n  183 |         }\n  184 | \n  185 |         if let Some(status) = status {\n  186 |             let status = ProjectStatus { status, reason };\n  187 |             Some(status)\n  188 |         } else {\n  189 |             None\n  190 |         }\n  191 |     }","lines":47,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-client/src/html.rs#L145-L191"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`TrustedHost::from_str` in `crates/uv-configuration/src/trusted_host.rs:89-120` strips a trailing path (`/...`) from the host component via `host.split('/').next()`, but does not do the same for the port component. When a `--trusted-host` / `trusted-host` config value includes both a port and a path (e.g. `\"https://example.com:8443/simple\"`), the code does `let mut parts = s.splitn(2, ':')`, takes `parts.next()` for the host (correctly stripping `/simple`), then takes `parts.next()` for the port, which yields the raw string `\"8443/simple\"`. `str::parse::<u16>` then fails on that string and the whole value is rejected with `TrustedHostError::InvalidPort`, even though the semantically-equivalent host without a port (e.g. `\"https://example.com/simple\"`, covered by the existing `parse` test) parses successfully. This is inconsistent: `TrustedHost` demonstrably supports trailing paths (per the `parse_proxy_url...`-style test `\"https://example.com/hello/world\"`), but only when no port is present.","fix":"Strip any trailing path segment from the port portion before parsing it, mirroring the host handling, e.g.:\n```rust\nlet port = parts\n    .next()\n    .map(|port| port.split('/').next().unwrap_or(port))\n    .map(str::parse)\n    .transpose()\n    .map_err(|_| TrustedHostError::InvalidPort(s.to_string()))?;\n```\nAdd a regression test such as `\"https://example.com:8443/simple\".parse::<TrustedHost>()` asserting it yields `Host { scheme: Some(\"https\".into()), host: \"example.com\".into(), port: Some(8443) }`.","locations":[{"ref":"crates/uv-configuration/src/trusted_host.rs:103-117","code":"  103 |         let mut parts = s.splitn(2, ':');\n  104 | \n  105 |         // Detect host.\n  106 |         let host = parts\n  107 |             .next()\n  108 |             .and_then(|host| host.split('/').next())\n  109 |             .map(ToString::to_string)\n  110 |             .ok_or_else(|| TrustedHostError::MissingHost(s.to_string()))?;\n  111 | \n  112 |         // Detect port.\n  113 |         let port = parts\n  114 |             .next()\n  115 |             .map(str::parse)\n  116 |             .transpose()\n  117 |             .map_err(|_| TrustedHostError::InvalidPort(s.to_string()))?;","lines":15,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-configuration/src/trusted_host.rs#L103-L117"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`BuiltWheelIndex::find` in `crates/uv-distribution/src/index/built_wheel_index.rs` is documented as preferring \"newer versions over older versions, and aims to maximize compatibility with the target platform\" (i.e. version should take priority, with compatibility only as a tiebreaker), but the actual override condition is `dist_info.filename.version > existing.filename.version || compatibility > existing.filename.compatibility(self.tags)`. Because this is an `||` rather than a lexicographic `(version, then compatibility)` comparison, a candidate wheel with a strictly *lower* version than the current best can still replace it purely because its platform-tag `compatibility` ranks higher (`TagCompatibility` derives `Ord`, confirmed in `crates/uv-platform-tags/src/tags.rs:62-71`). This directly contradicts the stated priority and differs from the equivalent, correct selection logic in the sibling `RegistryWheelIndex` (`crates/uv-distribution/src/index/registry_wheel_index.rs:364-379`), which explicitly sorts by `version.cmp(...).then_with(|| compatibility.cmp(...))`. In the common case a build-cache shard only contains wheels of one version (all built from the same source-distribution revision), so the bug is latent, but if a build backend produces different wheel versions for the same cached revision (e.g. dynamic/time-based versioning, or PEP 517 backends resolving version differently across builds), `find` can silently pick and reuse an older, stale built wheel over a newer one.","fix":"Mirror the ordering used in `RegistryWheelIndex` and make version strictly take priority over compatibility, only falling back to compatibility when versions are equal, e.g.:\n```rust\nif let Some(existing) = candidate.as_ref() {\n    let existing_compatibility = existing.filename.compatibility(self.tags);\n    let better = match dist_info.filename.version.cmp(&existing.filename.version) {\n        std::cmp::Ordering::Greater => true,\n        std::cmp::Ordering::Equal => compatibility > existing_compatibility,\n        std::cmp::Ordering::Less => false,\n    };\n    if better {\n        candidate = Some(dist_info);\n    }\n} else {\n    candidate = Some(dist_info);\n}\n```\nThis also avoids recomputing `existing.filename.compatibility(self.tags)` from scratch on every iteration by only computing it when actually needed for the tie-break.","locations":[{"ref":"crates/uv-distribution/src/index/built_wheel_index.rs:333-342","code":"  333 |                     if let Some(existing) = candidate.as_ref() {\n  334 |                         // Override if the wheel is newer, or \"more\" compatible.\n  335 |                         if dist_info.filename.version > existing.filename.version\n  336 |                             || compatibility > existing.filename.compatibility(self.tags)\n  337 |                         {\n  338 |                             candidate = Some(dist_info);\n  339 |                         }\n  340 |                     } else {\n  341 |                         candidate = Some(dist_info);\n  342 |                     }","lines":10,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-distribution/src/index/built_wheel_index.rs#L333-L342"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `fetch`, the short-commit-hash fast path for `GitReference::BranchOrTagOrCommit` is unreachable. `oid_to_fetch` is computed as `Some(rev)` only when the incoming `reference` is the `ReferenceOrOid::Oid` variant (line 681); it is `None` for every `ReferenceOrOid::Reference(...)` variant. But the `if let Some(oid_to_fetch) = oid_to_fetch.filter(|oid| is_short_hash_of(branch_or_tag_or_commit, *oid))` check at line 731-732 lives inside the `ReferenceOrOid::Reference(GitReference::BranchOrTagOrCommit(...))` arm, where `oid_to_fetch` is always `None`. A `GitReference` and a precise `Oid` are mutually exclusive here: `GitRemote::checkout` builds the reference as `locked_rev.map(ReferenceOrOid::Oid).unwrap_or(ReferenceOrOid::Reference(reference))`, so whenever a precise commit exists the reference is an `Oid` (handled by the separate arm at line 753) and never a `BranchOrTagOrCommit`. Consequently the intended optimization to fetch a single `+{oid}:refs/commit/{oid}` refspec for a pinned commit-hash reference never fires, and uv always falls into the `else` branch that fetches `+refs/heads/*`, `+HEAD`, and all tags. For a dependency pinned to a bare (short or full) commit hash that is not yet locked/precise, this forces a full fetch of every branch and tag instead of the single commit, which can be a large slowdown against big repositories. `is_short_hash_of` (line 947) is dead as a result.","fix":"Either remove the dead `if let Some(oid_to_fetch)` branch (and `is_short_hash_of`) since it can never execute, or actually make it reachable by deriving a fetchable commit for `BranchOrTagOrCommit`. If the goal is to fetch a specific commit for a pinned hash, the value must be threaded through: e.g. when the `BranchOrTagOrCommit(s)` string itself parses as a full `GitOid`, push `+{s}:refs/commit/{s}` directly, rather than relying on `oid_to_fetch` which is only populated for the `Oid` reference variant.","locations":[{"ref":"crates/uv-git/src/git.rs:688-701","code":"  688 |     let oid_to_fetch = if let ReferenceOrOid::Oid(rev) = reference {\n  689 |         let local_object = reference.resolve(repo).ok();\n  690 |         if let Some(local_object) = local_object {\n  691 |             if rev == local_object {\n  692 |                 return Ok(());\n  693 |             }\n  694 |         }\n  695 | \n  696 |         // If we know the reference is a full commit hash, we can just return it without\n  697 |         // querying GitHub.\n  698 |         Some(rev)\n  699 |     } else {\n  700 |         None\n  701 |     };","lines":14,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-git/src/git.rs#L688-L701"},{"ref":"crates/uv-git/src/git.rs:734-750","code":"  734 |         ReferenceOrOid::Reference(GitReference::BranchOrTagOrCommit(branch_or_tag_or_commit)) => {\n  735 |             // The `oid_to_fetch` is the exact commit we want to fetch. But it could be the exact\n  736 |             // commit of a branch or tag. We should only fetch it directly if it's the exact commit\n  737 |             // of a short commit hash.\n  738 |             if let Some(oid_to_fetch) =\n  739 |                 oid_to_fetch.filter(|oid| is_short_hash_of(branch_or_tag_or_commit, *oid))\n  740 |             {\n  741 |                 refspecs.push(format!(\"+{oid_to_fetch}:refs/commit/{oid_to_fetch}\"));\n  742 |             } else {\n  743 |                 // We don't know what the rev will point to. To handle this\n  744 |                 // situation we fetch all branches and tags, and then we pray\n  745 |                 // it's somewhere in there.\n  746 |                 refspecs.push(String::from(\"+refs/heads/*:refs/remotes/origin/*\"));\n  747 |                 refspecs.push(String::from(\"+HEAD:refs/remotes/origin/HEAD\"));\n  748 |                 tags = true;\n  749 |             }\n  750 |         }","lines":17,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-git/src/git.rs#L734-L750"},{"ref":"crates/uv-git/src/git.rs:953-960","code":"  953 | /// Whether `rev` is a shorter hash of `oid`.\n  954 | fn is_short_hash_of(rev: &str, oid: GitOid) -> bool {\n  955 |     let long_hash = oid.to_string();\n  956 |     match long_hash.get(..rev.len()) {\n  957 |         Some(truncated_long_hash) => truncated_long_hash.eq_ignore_ascii_case(rev),\n  958 |         None => false,\n  959 |     }\n  960 | }","lines":8,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-git/src/git.rs#L953-L960"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `Edges::from_python_versions`, each version in a `python_version in '...'` / `not in '...'` list is converted with `python_version_to_full_version(...)?` inside a `map` closure, then `flatten_ok().collect::<Result<Ranges<_>, NodeId>>()?`. A single list element that is unrepresentable as a `python_version` (a version whose trimmed release has a non-zero 3rd+ segment, e.g. `3.9.1`) makes `python_version_to_full_version` return `Err(NodeId::FALSE)`, which the `?` propagates so the WHOLE expression collapses to `NodeId::FALSE` before the `NotIn` complement at lines 1419-1421 is even applied. This is wrong for a set-membership (union) operator: such an element should contribute nothing and be dropped, not poison the set. Concretely, `python_version in '3.9 3.9.1'` becomes unsatisfiable (`false`) instead of `python_full_version == '3.9.*'`, and far worse, `python_version not in '3.9.1'` becomes unsatisfiable (`false`) even though it must always be `true` (a `python_version` value can never equal `3.9.1`). Note the direct (non-list) path is correct: `python_version != '3.9.1'` correctly simplifies to `true` (see `tree.rs` test at line 2509), so the list path is inconsistent with it. Existing tests only exercise `3.10.0`, which `only_release_trimmed` reduces to the valid 2-segment `3.10`, so the buggy branch is untested. In the resolver this can silently drop dependencies or make `not in` constraints vanish.","fix":"Do not let a single `Err(NodeId::FALSE)` short-circuit the union. Build the range by folding, dropping elements that map to `Err(NodeId::FALSE)` (they match no `python_version`), e.g.:\n```rust\nlet mut range: Ranges<Version> = Ranges::empty();\nfor version in versions {\n    let specifier = VersionSpecifier::equals_version(version.only_release());\n    match python_version_to_full_version(specifier) {\n        Ok(specifier) => {\n            range = range.union(&release_specifier_to_range(specifier, true));\n        }\n        // An unrepresentable `python_version` matches nothing; skip it.\n        Err(node) if node == NodeId::FALSE => {}\n        Err(node) => return Err(node),\n    }\n}\nif operator == ContainerOperator::NotIn {\n    range = range.complement();\n}\nOk(Self::Version { edges: Self::from_range(&range) })\n```\nThis keeps valid versions and applies the `NotIn` complement afterwards.","locations":[{"ref":"crates/uv-pep508/src/marker/algebra.rs:1432-1453","code":" 1432 |     fn from_python_versions(\n 1433 |         versions: Vec<Version>,\n 1434 |         operator: ContainerOperator,\n 1435 |     ) -> Result<Self, NodeId> {\n 1436 |         let mut range: Ranges<Version> = versions\n 1437 |             .into_iter()\n 1438 |             .map(|version| {\n 1439 |                 let specifier = VersionSpecifier::equals_version(version.only_release());\n 1440 |                 let specifier = python_version_to_full_version(specifier)?;\n 1441 |                 Ok(release_specifier_to_range(specifier, true))\n 1442 |             })\n 1443 |             .flatten_ok()\n 1444 |             .collect::<Result<Ranges<_>, NodeId>>()?;\n 1445 | \n 1446 |         if operator == ContainerOperator::NotIn {\n 1447 |             range = range.complement();\n 1448 |         }\n 1449 | \n 1450 |         Ok(Self::Version {\n 1451 |             edges: Self::from_range(&range),\n 1452 |         })\n 1453 |     }","lines":22,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-pep508/src/marker/algebra.rs#L1432-L1453"},{"ref":"crates/uv-pep508/src/marker/algebra.rs:1831-1844","code":" 1831 |     } else {\n 1832 |         let [major, minor, ..] = *specifier.version().release() else {\n 1833 |             unreachable!()\n 1834 |         };\n 1835 | \n 1836 |         Ok(match specifier.operator() {\n 1837 |             // `python_version` cannot have more than two release segments, and we know\n 1838 |             // that the following release segments aren't purely zeroes so equality is impossible.\n 1839 |             Operator::Equal | Operator::ExactEqual => {\n 1840 |                 return Err(NodeId::FALSE);\n 1841 |             }\n 1842 | \n 1843 |             // Similarly, inequalities are always `true`.\n 1844 |             Operator::NotEqual => return Err(NodeId::TRUE),","lines":14,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-pep508/src/marker/algebra.rs#L1831-L1844"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `registry_pythons`, the sort comparator arms for the version-present-vs-absent case are inverted relative to the stated intent. The comment says `Place entries with a version before those without a version`, but `(Some(_), None) => Ordering::Greater` makes a versioned entry compare as greater than a versionless one, so ascending `sort_by` places versionless entries FIRST. Since Python discovery on Windows consumes this list front-to-back and the `version_filter` in `discovery.rs` always accepts entries whose `version` is `None`, registry Pythons with an unknown `SysVersion` are tried ahead of properly-versioned, higher-priority ones, so uv can select the wrong interpreter.","fix":"Swap the two arms so versioned entries sort first: use `(Some(_), None) => Ordering::Less` and `(None, Some(_)) => Ordering::Greater` instead of the current `(Some(_), None) => Ordering::Greater` and `(None, Some(_)) => Ordering::Less`.","locations":[{"ref":"crates/uv-python/src/windows_registry.rs:73-85","code":"   73 |         match (&a.version, &b.version) {\n   74 |             // Place entries with a version before those without a version.\n   75 |             (Some(_), None) => Ordering::Greater,\n   76 |             (None, Some(_)) => Ordering::Less,\n   77 |             // We want the highest version on top, which is the inverse from the regular order. The\n   78 |             // path is an arbitrary but stable tie-breaker.\n   79 |             (Some(version_a), Some(version_b)) => {\n   80 |                 version_a.cmp(version_b).reverse().then(a.path.cmp(&b.path))\n   81 |             }\n   82 |             // Sort the entries without a version arbitrarily, but stable (by path).\n   83 |             (None, None) => a.path.cmp(&b.path),\n   84 |         }\n   85 |     });","lines":13,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-python/src/windows_registry.rs#L73-L85"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `timestamp_from_toml_datetime`, a custom TOML offset is reconstructed with `TimeZone::fixed(Offset::constant(hours))` where `hours = minutes / 60`. `jiff`'s `Offset::constant(hours: i8)` only accepts whole-hour offsets, so the sub-hour remainder of `minutes` is silently discarded via integer division. Any `upload-time` timestamp written with a non-integer-hour zone offset (e.g. `+05:30` for India, `+05:45` for Nepal, `+09:30` for parts of Australia) is parsed 30-45 minutes off. `minutes` is the total signed minute offset (`i16`), confirmed in `toml_datetime`.","fix":"Preserve the full offset by converting to seconds, e.g. replace `toml_edit::Offset::Custom { minutes } => { let hours = i8::try_from(minutes / 60)...; TimeZone::fixed(Offset::constant(hours)) }` with `toml_edit::Offset::Custom { minutes } => TimeZone::fixed(Offset::from_seconds(i32::from(minutes) * 60).map_err(serde::de::Error::custom)?)`. `Offset::from_seconds` accepts arbitrary sub-hour offsets.","locations":[{"ref":"crates/uv-resolver/src/lock/export/pylock_toml.rs:2052-2062","code":" 2052 |     let tz = if let Some(offset) = datetime.offset {\n 2053 |         match offset {\n 2054 |             toml_edit::Offset::Z => TimeZone::UTC,\n 2055 |             toml_edit::Offset::Custom { minutes } => {\n 2056 |                 let hours = i8::try_from(minutes / 60).map_err(serde::de::Error::custom)?;\n 2057 |                 TimeZone::fixed(Offset::constant(hours))\n 2058 |             }\n 2059 |         }\n 2060 |     } else {\n 2061 |         TimeZone::UTC\n 2062 |     };","lines":11,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-resolver/src/lock/export/pylock_toml.rs#L2052-L2062"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `pyproject_project`, the user-supplied `--description` value is interpolated directly into the generated TOML with `format!(\"\\ndescription = \\\"{description}\\\"\", ...)` without any escaping. A description containing a double quote (`\"`) or backslash (`\\`) - e.g. `uv init --description 'My \"cool\" tool'` - produces a syntactically invalid `pyproject.toml` (`description = \"My \"cool\" tool\"`). `uv init` itself writes the file and returns success, but the resulting `pyproject.toml` fails to parse on the next `uv` command. Note this is inconsistent with how `authors` are handled, which go through `toml_edit` (`Author::to_toml_string`) and are correctly escaped (as the unit test `author_to_toml_string_handles_inline_quotes` demonstrates).","fix":"Escape the description as a TOML string instead of raw interpolation. Build the value with `toml_edit::Value::from(description)` (mirroring `Author::to_toml_string`) and splice the rendered string in, or use a serializer, rather than wrapping the raw text in literal `\"` characters. For example replace the `format!(\"\\ndescription = \\\"{description}\\\"\", ...)` branch with something that renders `toml_edit::Value::from(description.unwrap_or(\"Add your description here\"))` to produce a properly escaped value.","locations":[{"ref":"crates/uv/src/commands/project/init.rs:877-892","code":"  877 |     indoc::formatdoc! {r#\"\n  878 |         [project]\n  879 |         name = \"{name}\"\n  880 |         version = \"0.1.0\"{description}{readme}{authors}\n  881 |         requires-python = \"{requires_python}\"\n  882 |         dependencies = []\n  883 |     \"#,\n  884 |         readme = if no_readme { \"\" } else { \"\\nreadme = \\\"README.md\\\"\" },\n  885 |         description = if no_description {\n  886 |             String::new()\n  887 |         } else {\n  888 |             format!(\"\\ndescription = \\\"{description}\\\"\", description = description.unwrap_or(\"Add your description here\"))\n  889 |         },\n  890 |         authors = author.map_or_else(String::new, |author| format!(\"\\nauthors = [\\n    {}\\n]\", author.to_toml_string())),\n  891 |         requires_python = requires_python.specifiers(),\n  892 |     }","lines":16,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv/src/commands/project/init.rs#L877-L892"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `PublishSettings::resolve`, the `trusted_publishing` value is combined config-first: `trusted_publishing.combine(args.trusted_publishing)`, where `trusted_publishing` is the value from the filesystem/`pyproject.toml` (`PublishOptions`) and `args.trusted_publishing` is the CLI `--trusted-publishing` value. Because `Combine` returns the left operand when it is `Some`, the configuration file takes precedence over the command line. This is inverted relative to every other field in the same function (`publish_url`, `keyring_provider`, `check_url` all use `args.X.combine(config)`), and relative to uv's documented CLI-over-config precedence. A user who sets `trusted-publishing` in `pyproject.toml` and then passes `--trusted-publishing never` (or `always`) on the command line will silently get the config value instead. It is the only `combine(args.` occurrence in the file.","fix":"Swap the operands so the CLI wins: `trusted_publishing: args.trusted_publishing.combine(trusted_publishing).unwrap_or_default(),` matching the sibling fields `publish_url`, `keyring_provider`, and `check_url`.","locations":[{"ref":"crates/uv/src/settings.rs:5319-5321","code":" 5319 |             trusted_publishing: trusted_publishing\n 5320 |                 .combine(args.trusted_publishing)\n 5321 |                 .unwrap_or_default(),","lines":3,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv/src/settings.rs#L5319-L5321"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`cache_name` is inconsistent about representing an empty truncation result. In the all-hex-digits fast path, `cache_name(name, Some(0))` (or any `max_len` that truncates a non-empty hex-only `name` down to zero bytes) returns `Some(Cow::Borrowed(\"\"))`, because only `name.is_empty()` (the *pre*-truncation length) is checked before returning `name.get(..limit)`. The general (non-hex) branch, by contrast, explicitly checks `normalized.is_empty()` *after* truncation and returns `None` in that case. So `cache_name(\"abc\", Some(0))` returns `Some(\"\")` while `cache_name(\"xyz\", Some(0))` (non-hex-only) returns `None` for the same effective truncation-to-empty scenario -- an inconsistent, easily-triggered edge case in a function meant to normalize cache directory/file names.","fix":"Check emptiness after truncation in the hex branch too: ```rust\nreturn if name.is_empty() {\n    None\n} else {\n    let truncated = name.get(..limit).unwrap_or(name);\n    if truncated.is_empty() { None } else { Some(Cow::Borrowed(truncated)) }\n};\n```","locations":[{"ref":"crates/uv-cache-key/src/digest.rs:45-57","code":"   45 | pub fn cache_name(name: &str, max_len: Option<usize>) -> Option<Cow<'_, str>> {\n   46 |     let limit = max_len.unwrap_or(usize::MAX);\n   47 | \n   48 |     if name\n   49 |         .bytes()\n   50 |         .all(|char| matches!(char, b'0'..=b'9' | b'a'..=b'f'))\n   51 |     {\n   52 |         return if name.is_empty() {\n   53 |             None\n   54 |         } else {\n   55 |             Some(Cow::Borrowed(name.get(..limit).unwrap_or(name)))\n   56 |         };\n   57 |     }","lines":13,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-cache-key/src/digest.rs#L45-L57"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `SimpleDetailHTML::parse_anchor` (`crates/uv-client/src/html.rs:253-256`), `path.split('/').next_back().ok_or_else(|| Error::MissingFilename(...))?` is meant to reject anchors whose URL has no derivable filename. However, `str::split` always yields at least one item, even for an empty string (`\"\".split('/').next_back()` is `Some(\"\")`), so `next_back()` can never return `None` and the `MissingFilename` error can never be raised here. A registry page containing a fragment-only `<a href=\"#note\">` (common as a same-page anchor, unrelated to package files, and explicitly the kind of tag PyPI-style pages sometimes include) decodes to an empty `path` before the `#`, which then silently produces a `PypiFile` with an empty `filename` and `url` instead of being rejected or skipped. This is inconsistent with the sibling filter that already excludes empty `href` values (`html.rs:211`) and defeats the apparent intent of the `ok_or_else` check.","fix":"Explicitly check for an empty filename instead of relying on `next_back()` returning `None`:\n```rust\nlet filename = path\n    .split('/')\n    .next_back()\n    .filter(|filename| !filename.is_empty())\n    .ok_or_else(|| Error::MissingFilename(href.to_string()))?;\n```","locations":[{"ref":"crates/uv-client/src/html.rs:253-256","code":"  253 |         let filename = path\n  254 |             .split('/')\n  255 |             .next_back()\n  256 |             .ok_or_else(|| Error::MissingFilename(href.to_string()))?;","lines":4,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-client/src/html.rs#L253-L256"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `locate_system_config_xdg` (`crates/uv-dirs/src/lib.rs:130-144`), the `XDG_CONFIG_DIRS` value is iterated with `config_dirs.split(':').take_while(|s| !s.is_empty())`. `take_while` stops the iteration entirely the first time it encounters an empty path segment, rather than merely skipping that segment. If a caller sets `XDG_CONFIG_DIRS` with a leading or doubled colon (e.g. `\":/etc/xdg\"` or `\"/a::/b\"`, which can happen from careless environment composition such as `\"$UNSET_VAR:$XDG_CONFIG_DIRS\"`), every directory listed after the first empty segment is silently never checked for `uv/uv.toml`, even though those later entries are otherwise valid absolute paths. This can cause `uv` to miss a legitimate system configuration file.","fix":"Use `.filter(|s| !s.is_empty())` instead of `.take_while(|s| !s.is_empty())` so that a single empty/malformed segment is skipped rather than terminating the search of subsequent directories:\n```rust\nfor dir in config_dirs.split(':').filter(|s| !s.is_empty()) {\n    let uv_toml_path = Path::new(dir).join(\"uv\").join(\"uv.toml\");\n    if uv_toml_path.is_file() {\n        return Some(uv_toml_path);\n    }\n}\n```","locations":[{"ref":"crates/uv-dirs/src/lib.rs:137","code":"  137 |     for dir in config_dirs.split(':').take_while(|s| !s.is_empty()) {","lines":1,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-dirs/src/lib.rs#L137"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`MemchrSplitter::next` in `splitter.rs` silently drops a trailing empty segment when the haystack ends with the delimiter byte, unlike `str::split`. Concretely, `MemchrSplitter::split(\"any.\", b'.')` yields only `[\"any\"]` instead of `[\"any\", \"\"]`. This was verified with a standalone reproduction using the actual iterator logic (delimiter at the last byte causes `self.offset == self.haystack.len()` after the final match, so the `None if self.offset < self.haystack.len()` arm never fires and the trailing empty item is never produced). `wheel.rs`'s `parse_large_tag_component` relies on `MemchrSplitter` to reject malformed tag components via `tag.is_empty() || !tag.bytes().all(is_tag_atom_byte)`, but because the trailing empty segment is never yielded, that check is bypassed for tags ending in a period. This was confirmed end-to-end: parsing the wheel filename `foo-1.2.3-py3-none-any..whl` (whose platform tag component is `any.`) succeeds and returns `Ok(WheelFilename { ... platform_tag: [Any], repr: \"py3-none-any.\" })` instead of being rejected, even though the filename is malformed (trailing period in a tag segment). The same asymmetry affects `expanded_tags.rs`'s `parse_expanded_tag`, which also uses `MemchrSplitter` to split multi-part tag components. Since this parser handles untrusted wheel filenames from package registries, this leniency means malformed/corrupted filenames are silently accepted rather than surfaced as parse errors, which can mask registry corruption or crafted filenames and cause inconsistent identity between the `repr` (verbatim) and the structured tag list.","fix":"Fix `MemchrSplitter::next` in `splitter.rs` to emit the trailing empty segment when the haystack ends with the delimiter, matching `str::split` semantics. For example, track whether the final delimiter has already been consumed and still emit one more empty item when `index + 1 == haystack.len()`, e.g. by changing the `None` arm to use `<=` semantics via an explicit `done` flag:\n```rust\nfn next(&mut self) -> Option<Self::Item> {\n    if self.offset > self.haystack.len() {\n        return None;\n    }\n    match self.memchr.next() {\n        Some(index) => {\n            let start = self.offset;\n            self.offset = index + 1;\n            Some(&self.haystack[start..index])\n        }\n        None => {\n            let start = self.offset;\n            self.offset = self.haystack.len() + 1; // sentinel: fully consumed\n            Some(&self.haystack[start..])\n        }\n    }\n}\n```\nAdd a unit test in `splitter.rs` asserting `MemchrSplitter::split(\"a.\", b'.').collect::<Vec<_>>() == [\"a\", \"\"]` to lock in the corrected behavior, then confirm `WheelFilename::from_str(\"foo-1.2.3-py3-none-any..whl\")` now returns an error.","locations":[{"ref":"crates/uv-distribution-filename/src/splitter.rs:24-38","code":"   24 |     fn next(&mut self) -> Option<Self::Item> {\n   25 |         match self.memchr.next() {\n   26 |             Some(index) => {\n   27 |                 let start = self.offset;\n   28 |                 self.offset = index + 1;\n   29 |                 Some(&self.haystack[start..index])\n   30 |             }\n   31 |             None if self.offset < self.haystack.len() => {\n   32 |                 let start = self.offset;\n   33 |                 self.offset = self.haystack.len();\n   34 |                 Some(&self.haystack[start..])\n   35 |             }\n   36 |             None => None,\n   37 |         }\n   38 |     }","lines":15,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-distribution-filename/src/splitter.rs#L24-L38"},{"ref":"crates/uv-distribution-filename/src/wheel.rs:305-324","code":"  305 | fn parse_large_tag_component<T: FromStr>(\n  306 |     component: &str,\n  307 |     filename: &str,\n  308 | ) -> Result<TagSet<T>, WheelFilenameError> {\n  309 |     if component.is_empty() {\n  310 |         return Err(invalid_tag_component(filename));\n  311 |     }\n  312 | \n  313 |     let mut tags = TagSet::new();\n  314 |     for tag in MemchrSplitter::split(component, b'.') {\n  315 |         if tag.is_empty() || !tag.bytes().all(is_tag_atom_byte) {\n  316 |             return Err(invalid_tag_component(filename));\n  317 |         }\n  318 |         if let Ok(tag) = T::from_str(tag) {\n  319 |             tags.push(tag);\n  320 |         }\n  321 |     }\n  322 | \n  323 |     Ok(tags)\n  324 | }","lines":20,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-distribution-filename/src/wheel.rs#L305-L324"},{"ref":"crates/uv-distribution-filename/src/expanded_tags.rs:92-144","code":"   92 | fn parse_expanded_tag(tag: &str) -> Result<WheelTag, ExpandedTagError> {\n   93 |     let mut splitter = memchr::Memchr::new(b'-', tag.as_bytes());\n   94 |     if tag.is_empty() {\n   95 |         return Err(ExpandedTagError::MissingLanguageTag(tag.to_string()));\n   96 |     }\n   97 |     let Some(python_tag_index) = splitter.next() else {\n   98 |         return Err(ExpandedTagError::MissingAbiTag(tag.to_string()));\n   99 |     };\n  100 |     let Some(abi_tag_index) = splitter.next() else {\n  101 |         return Err(ExpandedTagError::MissingPlatformTag(tag.to_string()));\n  102 |     };\n  103 |     if splitter.next().is_some() {\n  104 |         return Err(ExpandedTagError::ExtraSegment(tag.to_string()));\n  105 |     }\n  106 | \n  107 |     let python_tag = &tag[..python_tag_index];\n  108 |     let abi_tag = &tag[python_tag_index + 1..abi_tag_index];\n  109 |     let platform_tag = &tag[abi_tag_index + 1..];\n  110 | \n  111 |     let is_small = memchr(b'.', tag.as_bytes()).is_none();\n  112 | \n  113 |     if let Some(small) = is_small\n  114 |         .then(|| {\n  115 |             Some(WheelTagSmall {\n  116 |                 python_tag: LanguageTag {"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`IndexName::new` iterates over `name.chars()` to validate allowed characters but never checks for an empty string. Since the loop body never executes for `\"\"`, `IndexName::new(\"\")` returns `Ok(IndexName(\"\"))`. The dedicated `IndexNameError::EmptyName` variant (and the identically-named `IndexSourceError::EmptyName` in `index.rs`) exist specifically to reject this case but are never constructed anywhere in the codebase, so they are unreachable/dead code. In practice this means e.g. `--index =https://example.com/simple` (empty name before `=` in `Index::from_str`) or `name = \"\"` in a `[[tool.uv.index]]` table silently produces an index with an empty name instead of a clear validation error.","fix":"Add an explicit empty check at the top of `IndexName::new`: \n```rust\nfn new(name: &str) -> Result<Self, IndexNameError> {\n    if name.is_empty() {\n        return Err(IndexNameError::EmptyName);\n    }\n    for c in name.chars() {\n        ...\n    }\n    Ok(Self(SmallString::from(name)))\n}\n```\nThis makes the existing `EmptyName` error variants reachable and gives users a clear error instead of silently accepting an empty index name.","locations":[{"ref":"crates/uv-distribution-types/src/index_name.rs:19-32","code":"   19 |     fn new(name: &str) -> Result<Self, IndexNameError> {\n   20 |         for c in name.chars() {\n   21 |             match c {\n   22 |                 'a'..='z' | 'A'..='Z' | '0'..='9' | '-' | '_' | '.' => {}\n   23 |                 c if c.is_ascii() => {\n   24 |                     return Err(IndexNameError::UnsupportedCharacter(c, name.to_string()));\n   25 |                 }\n   26 |                 c => {\n   27 |                     return Err(IndexNameError::NonAsciiName(c, name.to_string()));\n   28 |                 }\n   29 |             }\n   30 |         }\n   31 |         Ok(Self(SmallString::from(name)))\n   32 |     }","lines":14,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-distribution-types/src/index_name.rs#L19-L32"},{"ref":"crates/uv-distribution-types/src/index_name.rs:90-93","code":"   90 | #[derive(Error, Debug)]\n   91 | pub enum IndexNameError {\n   92 |     #[error(\"Index included a name, but the name was empty\")]\n   93 |     EmptyName,","lines":4,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-distribution-types/src/index_name.rs#L90-L93"},{"ref":"crates/uv-distribution-types/src/index.rs:800-801","code":"  800 |     #[error(\"Index included a name, but the name was empty\")]\n  801 |     EmptyName,","lines":2,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-distribution-types/src/index.rs#L800-L801"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"The `uv-globfilter` debug/demo binary reads its walk root with `args().next().unwrap()`, which returns `argv[0]` (the path to the binary itself), not the first command-line argument. As a result `WalkDir::new(&walkdir_root)` walks the executable's own path rather than the directory the user passed, so the tool never inspects the intended directory.","fix":"Use the first real argument, e.g. replace `let walkdir_root = args().next().unwrap();` with `let walkdir_root = args().nth(1).expect(\"expected a directory argument\");`.","locations":[{"ref":"crates/uv-globfilter/src/main.rs:34","code":"   34 |     let walkdir_root = args().next().unwrap();","lines":1,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-globfilter/src/main.rs#L34"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"The `dependency_groups` parse path reports the wrong warning kind, and the dedicated kind is dead code. When a `'...' in dependency_groups` expression has an invalid group name, the code reports `MarkerWarningKind::ExtrasInvalidComparison` with a `dependency group name` message, rather than the purpose-built `MarkerWarningKind::DependencyGroupsInvalidComparison`. As a result `DependencyGroupsInvalidComparison` is defined but never constructed anywhere in the crate.\n\nBefore:\n```rust\nreporter.report(\n    MarkerWarningKind::ExtrasInvalidComparison,\n    format!(\"Expected dependency group name (found `{l_string}`): {err}\"),\n);\n```","fix":"Report `MarkerWarningKind::DependencyGroupsInvalidComparison` in the `MarkerValueList::DependencyGroups` arm so the dedicated kind is used and callers can distinguish it from extras warnings.","locations":[{"ref":"crates/uv-pep508/src/marker/parse.rs:331-345","code":"  331 |                         MarkerValueList::DependencyGroups => {\n  332 |                             match GroupName::from_str(&l_string) {\n  333 |                                 Ok(name) => CanonicalMarkerListPair::DependencyGroup(name),\n  334 |                                 Err(err) => {\n  335 |                                     reporter.report(\n  336 |                                     MarkerWarningKind::ExtrasInvalidComparison,\n  337 |                                     format!(\"Expected dependency group name (found `{l_string}`): {err}\"),\n  338 |                                 );\n  339 |                                     CanonicalMarkerListPair::Arbitrary {\n  340 |                                         key,\n  341 |                                         value: l_string.to_string(),\n  342 |                                     }\n  343 |                                 }\n  344 |                             }\n  345 |                         }","lines":15,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-pep508/src/marker/parse.rs#L331-L345"},{"ref":"crates/uv-pep508/src/marker/tree.rs:41","code":"   41 |     DependencyGroupsInvalidComparison,","lines":1,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-pep508/src/marker/tree.rs#L41"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`PartialEq` and `Hash` for `PythonRequest` are both derived from `to_canonical_string`, but `to_canonical_string` maps `Self::Directory(path)` and `Self::File(path)` to the identical string (`path.to_string_lossy()`). Consequently `PythonRequest::Directory(p) == PythonRequest::File(p)` returns `true` and the two hash equally, so the two semantically distinct variants collide when used as map/set keys. In practice a given path is either a file or a directory so real collisions are rare, but the equality/hash contract silently conflates the variants.","fix":"Disambiguate the two variants in `to_canonical_string` (e.g. prefix directory paths differently) or implement `PartialEq`/`Hash` structurally instead of via `to_canonical_string` so `Directory` and `File` are never considered equal.","locations":[{"ref":"crates/uv-python/src/discovery.rs:75-85","code":"   75 | impl PartialEq for PythonRequest {\n   76 |     fn eq(&self, other: &Self) -> bool {\n   77 |         self.to_canonical_string() == other.to_canonical_string()\n   78 |     }\n   79 | }\n   80 | \n   81 | impl std::hash::Hash for PythonRequest {\n   82 |     fn hash<H: std::hash::Hasher>(&self, state: &mut H) {\n   83 |         self.to_canonical_string().hash(state);\n   84 |     }\n   85 | }","lines":11,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-python/src/discovery.rs#L75-L85"},{"ref":"crates/uv-python/src/discovery.rs:2327-2340","code":" 2327 |     pub fn to_canonical_string(&self) -> Cow<'_, str> {\n 2328 |         match self {\n 2329 |             Self::Any => Cow::Borrowed(\"any\"),\n 2330 |             Self::Default => Cow::Borrowed(\"default\"),\n 2331 |             Self::Version(version) => Cow::Owned(version.to_string()),\n 2332 |             Self::Directory(path) | Self::File(path) => path.to_string_lossy(),\n 2333 |             Self::ExecutableName(name) => Cow::Borrowed(name),\n 2334 |             Self::Implementation(implementation) => Cow::Borrowed(implementation.long_name()),\n 2335 |             Self::ImplementationVersion(implementation, version) => {\n 2336 |                 Cow::Owned(format!(\"{implementation}@{version}\"))\n 2337 |             }\n 2338 |             Self::Key(request) => Cow::Owned(request.to_string()),\n 2339 |         }\n 2340 |     }","lines":14,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-python/src/discovery.rs#L2327-L2340"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`warn_uv_toml_masked_fields` destructures `no_sources_package: _` (line 420) and never adds it to `masked_fields`, even though `no-sources-package` is a valid `[tool.uv]` field in `pyproject.toml` (declared in `ResolverInstallerSchema`). If a user has both a `uv.toml` and a `pyproject.toml` `[tool.uv]` that sets `no-sources-package`, the `pyproject.toml` value is silently masked with no warning, unlike the sibling `no-sources` field which is warned. This is an inconsistency in the masking-warning coverage.","fix":"Bind `no_sources_package` in the destructure and add `if no_sources_package.is_some() { masked_fields.push(\"no-sources-package\"); }` alongside the `no-sources` check (or document explicitly why it is intentionally excluded).","locations":[{"ref":"crates/uv-settings/src/lib.rs:425-426","code":"  425 |                 no_sources,\n  426 |                 no_sources_package: _,","lines":2,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-settings/src/lib.rs#L425-L426"},{"ref":"crates/uv-settings/src/lib.rs:588-590","code":"  588 |     if no_sources.is_some() {\n  589 |         masked_fields.push(\"no-sources\");\n  590 |     }","lines":3,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-settings/src/lib.rs#L588-L590"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`backslash_escape` only escapes `\\` and `\"`, but it is used to build double-quoted POSIX shell snippets like `export PATH=\"{path}:$PATH\"` (Bash/Zsh/Ksh) and `setenv PATH \"{path}:$PATH\"` (Csh) that are written into shell rc files. Inside POSIX double quotes, `$` and backtick (`` ` ``) are still special, so a directory path containing `$` or a backtick would be subject to variable/command substitution when the rc file is sourced, corrupting the persisted `PATH`. The PowerShell counterpart `backtick_escape` correctly escapes `$`, showing the author was aware of this class of issue.","fix":"Escape `$` and `` ` `` in addition to `\\` and `\"` for the double-quoted POSIX shell forms (or single-quote the path and use the `escape_posix_for_single_quotes` approach already present in `shlex.rs`).","locations":[{"ref":"crates/uv-shell/src/lib.rs:324-338","code":"  324 | fn backslash_escape(s: &str) -> Cow<'_, str> {\n  325 |     if !s.chars().any(|c| matches!(c, '\\\\' | '\"')) {\n  326 |         return Cow::Borrowed(s);\n  327 |     }\n  328 | \n  329 |     let mut escaped = String::with_capacity(s.len());\n  330 |     for c in s.chars() {\n  331 |         match c {\n  332 |             '\\\\' | '\"' => escaped.push('\\\\'),\n  333 |             _ => {}\n  334 |         }\n  335 |         escaped.push(c);\n  336 |     }\n  337 |     Cow::Owned(escaped)\n  338 | }","lines":15,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-shell/src/lib.rs#L324-L338"},{"ref":"crates/uv-shell/src/lib.rs:270-281","code":"  270 |             Self::Bash | Self::Zsh | Self::Ksh => Some(format!(\n  271 |                 \"export PATH=\\\"{}:$PATH\\\"\",\n  272 |                 backslash_escape(&path.simplified_display().to_string()),\n  273 |             )),\n  274 |             Self::Fish => Some(format!(\n  275 |                 \"fish_add_path \\\"{}\\\"\",\n  276 |                 backslash_escape(&path.simplified_display().to_string()),\n  277 |             )),\n  278 |             Self::Csh => Some(format!(\n  279 |                 \"setenv PATH \\\"{}:$PATH\\\"\",\n  280 |                 backslash_escape(&path.simplified_display().to_string()),\n  281 |             )),","lines":12,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-shell/src/lib.rs#L270-L281"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`prepend_to_path` checks whether the directory is already on `PATH` with a raw sliding-window byte comparison: `existing_path.windows(path.len()).any(|p| *p == *path)`. This treats the whole `PATH` as one string and ignores the `;` separators, so it matches on any contiguous substring. If the new directory's path string is a substring of (or a prefix aligned with) an existing entry - e.g. adding `C:\\Users\\me\\bin` when `PATH` already contains `C:\\Users\\me\\bin2` - the check returns `true` and `prepend_path` returns `Ok(false)`, silently declining to add the directory that is genuinely not on `PATH`.","fix":"Split `existing_path` on `;` and compare each entry to `path` for exact (case-insensitive, per Windows) equality instead of using a byte-window substring search, so only a full path-component match counts as already-present.","locations":[{"ref":"crates/uv-shell/src/windows.rs:104-115","code":"  104 | fn prepend_to_path(existing_path: &HSTRING, path: HSTRING) -> Option<HSTRING> {\n  105 |     if existing_path.is_empty() {\n  106 |         Some(path)\n  107 |     } else if existing_path.windows(path.len()).any(|p| *p == *path) {\n  108 |         None\n  109 |     } else {\n  110 |         let mut new_path = path.to_os_string();\n  111 |         new_path.push(\";\");\n  112 |         new_path.push(existing_path.to_os_string());\n  113 |         Some(HSTRING::from(new_path))\n  114 |     }\n  115 | }","lines":12,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-shell/src/windows.rs#L104-L115"}]},
{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"When a dependency-group cycle is detected, the reported [`Cycle`] is built from the entire `parents` path (`parents.iter().copied().cloned().collect()`) and the [`Display`] impl closes the chain with `-> {first}` (the root group). If the cycle does not close on the first element (e.g. root `a` includes `b`, `b` includes `c`, `c` includes `b`), the detection fires at `name == b` with `parents == [a, b, c]`, producing the misleading message `a -> b -> c -> a` even though the real cycle is `b -> c -> b` and `a` is not part of it. The doc comment `Display a cycle, e.g., a -> b -> c -> a` assumes the cycle always re-enters the first element, which is not guaranteed.","fix":"Slice `parents` from the position of the repeated group so the reported cycle starts (and ends) at the actual repeated node. Replace the cycle branch with:\n```rust\nif let Some(pos) = parents.iter().position(|p| *p == name) {\n    return Err(DependencyGroupErrorInner::DependencyGroupCycle(Cycle(\n        parents[pos..].iter().copied().cloned().collect(),\n    )));\n}\n```\nThen `Display` (which appends `-> {first}`) prints the accurate cycle `b -> c -> b`.","locations":[{"ref":"crates/uv-workspace/src/dependency_groups.rs:116-120","code":"  116 |             if parents.contains(&name) {\n  117 |                 return Err(DependencyGroupErrorInner::DependencyGroupCycle(Cycle(\n  118 |                     parents.iter().copied().cloned().collect(),\n  119 |                 )));\n  120 |             }","lines":5,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-workspace/src/dependency_groups.rs#L116-L120"},{"ref":"crates/uv-workspace/src/dependency_groups.rs:322-335","code":"  322 | /// Display a cycle, e.g., `a -> b -> c -> a`.\n  323 | impl std::fmt::Display for Cycle {\n  324 |     fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {\n  325 |         let [first, rest @ ..] = self.0.as_slice() else {\n  326 |             return Ok(());\n  327 |         };\n  328 |         write!(f, \"`{first}`\")?;\n  329 |         for group in rest {\n  330 |             write!(f, \" -> `{group}`\")?;\n  331 |         }\n  332 |         write!(f, \" -> `{first}`\")?;\n  333 |         Ok(())\n  334 |     }\n  335 | }","lines":14,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-workspace/src/dependency_groups.rs#L322-L335"}]},
{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `Workspace::collect_required_members`, `required_members.insert(package.clone(), *editable)` unconditionally overwrites any previously recorded editability for a package. The conflict check only fires when both the existing and new values are `Some(_)`. When a package is required as a workspace source by two members - one specifying `{ workspace = true, editable = false }` and another (processed later, per `BTreeMap` ordering) specifying `{ workspace = true }` with no `editable` - the `Some(false)` is clobbered by `None`. Downstream, `members_requirements`/`group_requirements` resolve `None` via `.unwrap_or(true)`, so the explicit `editable = false` is silently flipped to `editable = true`. A later unspecified source should not override an earlier explicit value.","fix":"Only overwrite when the new value carries information, e.g. `let existing = required_members.get(package).copied();` then insert `editable.or(existing.flatten())` (preserving an explicit `Some(false)`), keeping the conflict check for the `Some != Some` case. Alternatively, `if editable.is_some() { required_members.insert(...); }` and skip the insert entirely when `editable` is `None` and an entry already exists.","locations":[{"ref":"crates/uv-workspace/src/workspace.rs:638-649","code":"  638 |                 let existing = required_members.insert(package.clone(), *editable);\n  639 |                 if let Some(Some(existing)) = existing {\n  640 |                     if let Some(editable) = editable {\n  641 |                         // If there are conflicting `editable` values, raise an error.\n  642 |                         if existing != *editable {\n  643 |                             return Err(WorkspaceError::from(\n  644 |                                 WorkspaceErrorKind::EditableConflict(package.clone()),\n  645 |                             ));\n  646 |                         }\n  647 |                     }\n  648 |                 }\n  649 |             }","lines":12,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-workspace/src/workspace.rs#L638-L649"},{"ref":"crates/uv-workspace/src/workspace.rs:560-566","code":"  560 |                         editable: Some(\n  561 |                             self.required_members\n  562 |                                 .get(name)\n  563 |                                 .copied()\n  564 |                                 .flatten()\n  565 |                                 .unwrap_or(true),\n  566 |                         ),","lines":7,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-workspace/src/workspace.rs#L560-L566"},{"ref":"crates/uv-workspace/src/workspace.rs:698-704","code":"  698 |                 source: if member.pyproject_toml().is_package(!is_required_member) {\n  699 |                     RequirementSource::Directory {\n  700 |                         install_path: member.root.clone().into_boxed_path(),\n  701 |                         editable: Some(editability.unwrap_or(true)),\n  702 |                         r#virtual: Some(false),\n  703 |                         url,\n  704 |                     }","lines":7,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-workspace/src/workspace.rs#L698-L704"}]},
{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`Changelog::is_empty` reports the changelog as empty when only `reinstalled` is non-empty, because it checks `self.installed.is_empty() && self.uninstalled.is_empty()` and ignores `self.reinstalled`. The docstring `Returns true if the changelog is empty` implies all three sets are considered. This method is used by `crates/uv/src/commands/tool/upgrade.rs:564` to classify an operation as `UpgradeOutcome::NoOp`. A `--reinstall` that reinstalls the tool's packages at the same version populates only `reinstalled` (a `CachedDist` and the prior `InstalledDist` of equal name+version compare equal via `LocalDist` and are partitioned into `reinstalled` in `Changelog::new`), so the environment actually changed but `is_empty()` returns `true`, mislabeling it a no-op.","fix":"Include `reinstalled` in the emptiness check: `self.installed.is_empty() && self.uninstalled.is_empty() && self.reinstalled.is_empty()`. (Reassess whether `includes` at lines 549-552 should also consider `reinstalled` for its callers.)","locations":[{"ref":"crates/uv/src/commands/pip/operations.rs:558-561","code":"  558 |     /// Returns `true` if the changelog is empty.\n  559 |     pub(crate) fn is_empty(&self) -> bool {\n  560 |         self.installed.is_empty() && self.uninstalled.is_empty()\n  561 |     }","lines":4,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv/src/commands/pip/operations.rs#L558-L561"},{"ref":"crates/uv/src/commands/pip/operations.rs:501-509","code":"  501 | #[derive(Debug, Clone, Default)]\n  502 | pub(crate) struct Changelog {\n  503 |     /// The distributions that were installed.\n  504 |     pub(crate) installed: HashSet<ChangedDist>,\n  505 |     /// The distributions that were uninstalled.\n  506 |     pub(crate) uninstalled: HashSet<ChangedDist>,\n  507 |     /// The distributions that were reinstalled.\n  508 |     pub(crate) reinstalled: HashSet<ChangedDist>,\n  509 | }","lines":9,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv/src/commands/pip/operations.rs#L501-L509"}]},
{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`resolve_gist_url` iterates `gist_data.files`, a `std::collections::HashMap`, and selects a `.py` file via `.iter().filter(...).next()`, then falls back to `gist_data.files.values().next()`. `HashMap` iteration order is non-deterministic, so when a Gist contains multiple `.py` files (or multiple files and no `.py`), the chosen file varies between runs. The comments 'Get the raw URL of the first `.py` file' and 'use the first file' are misleading because there is no defined 'first' element in a `HashMap`.","fix":"Deserialize into an order-preserving structure (e.g. `indexmap::IndexMap`, or capture the Gist API's file ordering) or explicitly sort the file names before selecting, so the chosen script is deterministic; then correct the comments to reflect the real selection rule.","locations":[{"ref":"crates/uv/src/commands/project/run.rs:1933-1946","code":" 1933 |     // Get the raw URL of the first `.py` file (or just the first file).\n 1934 |     let raw_url = gist_data\n 1935 |         .files\n 1936 |         .iter()\n 1937 |         .filter(|(name, _)| {\n 1938 |             Path::new(name)\n 1939 |                 .extension()\n 1940 |                 .is_some_and(|ext| ext.eq_ignore_ascii_case(\"py\"))\n 1941 |         })\n 1942 |         .map(|(_, file)| &file.raw_url)\n 1943 |         .next()\n 1944 |         // If no `.py` file is found, use the first file.\n 1945 |         .or_else(|| gist_data.files.values().next().map(|file| &file.raw_url))\n 1946 |         .ok_or_else(|| anyhow!(\"No files found in the Gist\"))?;","lines":14,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv/src/commands/project/run.rs#L1933-L1946"},{"ref":"crates/uv/src/commands/project/run.rs:55-59","code":"   55 | /// GitHub Gist API response structure\n   56 | #[derive(serde::Deserialize)]\n   57 | struct GistResponse {\n   58 |     files: std::collections::HashMap<String, GistFile>,\n   59 | }","lines":5,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv/src/commands/project/run.rs#L55-L59"}]},
{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"The experimental-JSON warning in `sync` has an inverted condition. Every other command warns when the feature is NOT enabled: `tree.rs:71` uses `matches!(format, TreeFormat::Json) && !preview.is_enabled(PreviewFeature::JsonOutput)` and `audit.rs:79` uses `!preview.is_enabled(PreviewFeature::JsonOutput)`. But `sync.rs:98` uses `preview.is_enabled(PreviewFeature::JsonOutput) && matches!(output_format, SyncFormat::Json)` (no `!`). As a result, a user running `uv sync --output-format json` WITHOUT the preview flag gets no warning that the schema is unstable, while a user who has already passed `--preview-features json-output` is told to 'Pass `--preview-features json-output` to disable this warning' - advice they have already followed and which cannot silence it. The intended audience never sees the warning and the opt-in audience sees a spurious, un-actionable one.","fix":"Add the missing negation so it matches `tree.rs`/`audit.rs`: change `if preview.is_enabled(PreviewFeature::JsonOutput) && matches!(output_format, SyncFormat::Json) {` to `if matches!(output_format, SyncFormat::Json) && !preview.is_enabled(PreviewFeature::JsonOutput) {`.","locations":[{"ref":"crates/uv/src/commands/project/sync.rs:98-103","code":"   98 |     if preview.is_enabled(PreviewFeature::JsonOutput) && matches!(output_format, SyncFormat::Json) {\n   99 |         warn_user!(\n  100 |             \"The `--output-format json` option is experimental and the schema may change without warning. Pass `--preview-features {}` to disable this warning.\",\n  101 |             PreviewFeature::JsonOutput\n  102 |         );\n  103 |     }","lines":6,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv/src/commands/project/sync.rs#L98-L103"}]},
{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"`FromStr for Arch` (uv-platform-tags) does not accept `wasm32`, even though the enum has an `Arch::Wasm32` variant and `Arch::name`/`Display` emit `\"wasm32\"`. This is a Display/FromStr round-trip asymmetry: any string produced for `Wasm32` cannot be parsed back. The same `from_str` also omits several aliases that the `serde` derive accepts (`arm64`, `amd64`, `i386`). Currently latent because wasm32 only ever appears in `pyodide_*`/`pyemscripten_*` tags (parsed separately), so no `linux_*`/`manylinux_*`/`musllinux_*` tag round-trips through `wasm32`, and wheel filenames use canonical names.","fix":"Add a `\"wasm32\" => Ok(Self::Wasm32)` arm to `FromStr for Arch` so it stays symmetric with `name()`; optionally add the `i386`/`arm64`/`amd64` aliases that the `serde(alias = ...)` attributes already accept, for consistency.","locations":[{"ref":"crates/uv-platform-tags/src/platform.rs:198-216","code":"  198 |     fn from_str(s: &str) -> Result<Self, Self::Err> {\n  199 |         match s {\n  200 |             \"aarch64\" => Ok(Self::Aarch64),\n  201 |             \"armv5tel\" => Ok(Self::Armv5TEL),\n  202 |             \"armv6l\" => Ok(Self::Armv6L),\n  203 |             // armv8l is 32-bit ARM running on ARMv8 hardware, compatible with armv7l\n  204 |             \"armv7l\" | \"armv8l\" => Ok(Self::Armv7L),\n  205 |             \"ppc64le\" => Ok(Self::Powerpc64Le),\n  206 |             \"ppc64\" => Ok(Self::Powerpc64),\n  207 |             \"ppc\" => Ok(Self::Powerpc),\n  208 |             \"i686\" => Ok(Self::X86),\n  209 |             \"x86_64\" => Ok(Self::X86_64),\n  210 |             \"s390x\" => Ok(Self::S390X),\n  211 |             \"loongarch64\" => Ok(Self::LoongArch64),\n  212 |             \"riscv64\" => Ok(Self::Riscv64),\n  213 |             _ => Err(format!(\"Unknown architecture: {s}\")),\n  214 |         }\n  215 |     }\n  216 | }","lines":19,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-platform-tags/src/platform.rs#L198-L216"},{"ref":"crates/uv-platform-tags/src/platform.rs:239-255","code":"  239 |     pub fn name(&self) -> &'static str {\n  240 |         match self {\n  241 |             Self::Aarch64 => \"aarch64\",\n  242 |             Self::Armv5TEL => \"armv5tel\",\n  243 |             Self::Armv6L => \"armv6l\",\n  244 |             Self::Armv7L => \"armv7l\",\n  245 |             Self::Powerpc64Le => \"ppc64le\",\n  246 |             Self::Powerpc64 => \"ppc64\",\n  247 |             Self::Powerpc => \"ppc\",\n  248 |             Self::X86 => \"i686\",\n  249 |             Self::X86_64 => \"x86_64\",\n  250 |             Self::S390X => \"s390x\",\n  251 |             Self::LoongArch64 => \"loongarch64\",\n  252 |             Self::Riscv64 => \"riscv64\",\n  253 |             Self::Wasm32 => \"wasm32\",\n  254 |         }\n  255 |     }","lines":17,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-platform-tags/src/platform.rs#L239-L255"}]},
{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"`Version.from_str` in the metadata fetch script does `major, minor, patch = version.split(\".\", 3)`. `maxsplit=3` yields up to 4 parts, so a version string with four numeric dot-separated components (e.g. `\"3.11.15.1\"`) makes the tuple unpack raise `ValueError`, and a two-component string (e.g. `\"3.11\"`) also fails to unpack into three names. Real interpreter versions are always three-component so this never triggers in practice, and this is a manually-run developer regeneration script (not a runtime path), hence negligible - but the `maxsplit=3` is a latent trap versus the intended three-field unpack.","fix":"Use `major, minor, patch = version.split(\".\", 2)` so the last split field always captures the remaining patch/prerelease text, matching the three-target unpack (the existing prerelease-stripping loop already handles trailing non-numeric content on `patch`).","locations":[{"ref":"crates/uv-python/fetch-download-metadata.py:126-137","code":"  126 |     @classmethod\n  127 |     def from_str(cls, version: str) -> Self:\n  128 |         major, minor, patch = version.split(\".\", 3)\n  129 |         prerelease = \"\"\n  130 |         for prerelease_kind in (\"a\", \"b\", \"rc\"):\n  131 |             parts = patch.split(prerelease_kind, 1)\n  132 |             if len(parts) == 2:\n  133 |                 patch = parts[0]\n  134 |                 prerelease = prerelease_kind + parts[1]\n  135 |                 break\n  136 | \n  137 |         return cls(int(major), int(minor), int(patch), prerelease)","lines":12,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-python/fetch-download-metadata.py#L126-L137"}]},
{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"`has_dependency_group` looks up the group by exact raw key (`groups.get(group.as_ref())`), whereas every other accessor in this file (`find_dependency`, `dependency_type_array_mut`, `remove_dependency_group_requirement`, etc.) normalizes each key via `GroupName::from_str` before comparing. A hand-written non-normalized key (e.g. `[dependency-groups]` with `Dev = [...]`) would not be found by `has_dependency_group` even though it normalizes to `dev`. Impact is negligible today because the only caller passes the already-normalized `DEV_DEPENDENCIES` and its fallback branches all resolve to the same group regardless, but the inconsistency is a latent trap for future callers.","fix":"Make `has_dependency_group` normalize like the rest: iterate `groups` and match with `GroupName::from_str(key).is_ok_and(|g| g == *group)` instead of `groups.get(group.as_ref()).is_some()`.","locations":[{"ref":"crates/uv-workspace/src/pyproject_mut.rs:1293-1299","code":" 1293 |     pub fn has_dependency_group(&self, group: &GroupName) -> bool {\n 1294 |         self.doc\n 1295 |             .get(\"dependency-groups\")\n 1296 |             .and_then(Item::as_table)\n 1297 |             .and_then(|groups| groups.get(group.as_ref()))\n 1298 |             .is_some()\n 1299 |     }","lines":7,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-workspace/src/pyproject_mut.rs#L1293-L1299"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"The `--config-setting-package`/`--config-settings-package` flag is defined inconsistently across subcommands. `InstallerArgs`, `ResolverArgs`, and `ResolverInstallerArgs` all name the field `config_settings_package` (plural \"settings\"), which clap derives as the primary flag `--config-settings-package`, with an `alias = \"config-settings-package\"` that is textually identical to the derived name (a redundant no-op alias). `ToolUpgradeArgs`, which manually re-implements a hidden/visible subset of `ResolverInstallerArgs` (per its own comment `// The following is equivalent to flattening \\`ResolverInstallerArgs\\`, ...`), instead names the field `config_setting_package` (singular), giving primary flag `--config-setting-package` with alias `--config-settings-package` (plural) — mirroring the sibling `config_setting`/`alias = \"config-settings\"` field, which is clearly the intended singular-primary/plural-alias convention. I confirmed the divergence by building the `uv` binary: `uv add --help` only exposes `--config-settings-package` (plural), while `uv tool upgrade --help` exposes `--config-setting-package` (singular) with the plural also accepted via alias. A user who learns the flag as `--config-setting-package` from `uv tool upgrade --help` (or from the analogous `--config-setting` flag, which is singular everywhere) gets an \"unrecognized argument\" error when they try the same flag name on `uv add`, `uv sync`, `uv run`, `uv lock`, `uv pip install/sync/compile`, `uv build`, etc., since those only accept the plural form.","fix":"Rename the field to `config_setting_package` (singular) in `InstallerArgs` (line 7419), `ResolverArgs` (line 7611), and `ResolverInstallerArgs` (line 7813) so the primary flag becomes `--config-setting-package` everywhere, matching `ToolUpgradeArgs` and the sibling `config_setting`/`alias = \"config-settings\"` convention, e.g.:\n```rust\n#[arg(long, alias = \"config-settings-package\", help_heading = \"Build options\", value_hint = ValueHint::Other)]\npub config_setting_package: Option<Vec<ConfigSettingPackageEntry>>,\n```\nKeep `alias = \"config-settings-package\"` (plural) on all of them for backward compatibility with any existing plural usage.","locations":[{"ref":"crates/uv-cli/src/lib.rs:6069-6084","code":" 6069 |     /// Settings to pass to the PEP 517 build backend, specified as `KEY=VALUE` pairs.\n 6070 |     #[arg(\n 6071 |         long,\n 6072 |         short = 'C',\n 6073 |         alias = \"config-settings\",\n 6074 |         help_heading = \"Build options\"\n 6075 |     )]\n 6076 |     pub config_setting: Option<Vec<ConfigSettingEntry>>,\n 6077 | \n 6078 |     /// Settings to pass to the PEP 517 build backend for a specific package, specified as `PACKAGE:KEY=VALUE` pairs.\n 6079 |     #[arg(\n 6080 |         long,\n 6081 |         alias = \"config-settings-package\",\n 6082 |         help_heading = \"Build options\"\n 6083 |     )]\n 6084 |     pub config_setting_package: Option<Vec<ConfigSettingPackageEntry>>,","lines":16,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-cli/src/lib.rs#L6069-L6084"},{"ref":"crates/uv-cli/src/lib.rs:7412-7427","code":" 7412 |     /// Settings to pass to the PEP 517 build backend, specified as `KEY=VALUE` pairs.\n 7413 |     #[arg(\n 7414 |         long,\n 7415 |         short = 'C',\n 7416 |         alias = \"config-settings\",\n 7417 |         help_heading = \"Build options\"\n 7418 |     )]\n 7419 |     config_setting: Option<Vec<ConfigSettingEntry>>,\n 7420 | \n 7421 |     /// Settings to pass to the PEP 517 build backend for a specific package, specified as `PACKAGE:KEY=VALUE` pairs.\n 7422 |     #[arg(\n 7423 |         long,\n 7424 |         alias = \"config-settings-package\",\n 7425 |         help_heading = \"Build options\"\n 7426 |     )]\n 7427 |     config_settings_package: Option<Vec<ConfigSettingPackageEntry>>,","lines":16,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-cli/src/lib.rs#L7412-L7427"},{"ref":"crates/uv-cli/src/lib.rs:7499-7514","code":" 7499 |     /// Settings to pass to the PEP 517 build backend, specified as `KEY=VALUE` pairs.\n 7500 |     #[arg(\n 7501 |         long,\n 7502 |         short = 'C',\n 7503 |         alias = \"config-settings\",\n 7504 |         help_heading = \"Build options\"\n 7505 |     )]\n 7506 |     config_setting: Option<Vec<ConfigSettingEntry>>,\n 7507 | \n 7508 |     /// Settings to pass to the PEP 517 build backend for a specific package, specified as `PACKAGE:KEY=VALUE` pairs.\n 7509 |     #[arg(\n 7510 |         long,\n 7511 |         alias = \"config-settings-package\",\n 7512 |         help_heading = \"Build options\"\n 7513 |     )]\n 7514 |     config_settings_package: Option<Vec<ConfigSettingPackageEntry>>,","lines":16,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-cli/src/lib.rs#L7499-L7514"},{"ref":"crates/uv-cli/src/lib.rs:7588-7605","code":" 7588 |     /// Settings to pass to the PEP 517 build backend, specified as `KEY=VALUE` pairs.\n 7589 |     #[arg(\n 7590 |         long,\n 7591 |         short = 'C',\n 7592 |         alias = \"config-settings\",\n 7593 |         help_heading = \"Build options\",\n 7594 |         value_hint = ValueHint::Other,\n 7595 |     )]\n 7596 |     pub config_setting: Option<Vec<ConfigSettingEntry>>,\n 7597 | \n 7598 |     /// Settings to pass to the PEP 517 build backend for a specific package, specified as `PACKAGE:KEY=VALUE` pairs.\n 7599 |     #[arg(\n 7600 |         long,\n 7601 |         alias = \"config-settings-package\",\n 7602 |         help_heading = \"Build options\",\n 7603 |         value_hint = ValueHint::Other,\n 7604 |     )]\n 7605 |     pub config_settings_package: Option<Vec<ConfigSettingPackageEntry>>,","lines":18,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-cli/src/lib.rs#L7588-L7605"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `PythonPinArgs`, the hidden `no_resolved` field declares `overrides_with(\"no_resolved\")`, i.e. it overrides itself instead of overriding its counterpart `resolved`. Every other boolean flag/negation pair in this file (e.g. `system`/`no_system`, `dev`/`no_dev`, `refresh`/`no_refresh`) declares `overrides_with` pointing at the *other* field so that whichever flag is passed last on the command line wins and clears the other. Because of the self-reference, passing `--resolved --no-resolved` (in either order) leaves both `resolved` and `no_resolved` set to `true` instead of one clearing the other (verified empirically against `clap` 4: with the self-reference both booleans end up `true` in both argument orders, whereas the correct pattern yields `(true,false)`/`(false,true)` depending on order). Downstream, `crates/uv/src/settings.rs::PythonPinSettings::resolve` calls `flag(resolved, no_resolved, \"resolved\")`, which explicitly `bail!`s with `ArgumentError` when both booleans are `true`. So `uv python pin --resolved --no-resolved` incorrectly errors out with a confusing \"arguments cannot be used together\" message instead of applying the intended last-flag-wins override.","fix":"Change the `no_resolved` field's attribute from `overrides_with(\"no_resolved\")` to `overrides_with(\"resolved\")`, matching the pattern used by every other flag/negation pair in the file:\n```rust\n#[arg(long, overrides_with(\"resolved\"))]\npub resolved: bool,\n\n#[arg(long, overrides_with(\"resolved\"), hide = true)]\npub no_resolved: bool,\n```\n(the second field must reference `resolved`, not itself).","locations":[{"ref":"crates/uv-cli/src/lib.rs:6625-6629","code":" 6625 |     #[arg(long, overrides_with(\"resolved\"))]\n 6626 |     pub resolved: bool,\n 6627 | \n 6628 |     #[arg(long, overrides_with(\"no_resolved\"), hide = true)]\n 6629 |     pub no_resolved: bool,","lines":5,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-cli/src/lib.rs#L6625-L6629"}]},
{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `handle_option`, the `example` attribute branch calls `get_string_literal(&meta, \"value_type\", \"option\")`, passing the meta-name `\"value_type\"` instead of `\"example\"`. The `meta_name` argument is only used to build the diagnostic message `expected {attribute_name} attribute to be a string: `{meta_name} = \"...\"``, so a malformed `#[option(example = 123)]` produces a misleading error that tells the developer to fix `value_type` rather than `example`.","fix":"Change the literal from `\"value_type\"` to `\"example\"`:\n```rust\nlet example_text = get_string_literal(&meta, \"example\", \"option\")?.value();\n```","locations":[{"ref":"crates/uv-macros/src/options_metadata.rs:289-291","code":"  289 |         } else if meta.path.is_ident(\"example\") {\n  290 |             let example_text = get_string_literal(&meta, \"value_type\", \"option\")?.value();\n  291 |             example = Some(dedent(&example_text).trim_matches('\\n').to_string());","lines":3,"link":"https://github.com/astral-sh/uv/blob/c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e/crates/uv-macros/src/options_metadata.rs#L289-L291"}]},
