{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In `write_event`'s first pass, when more than one string field in a single event exceeds 5KB, each StringRef object is serialized back-to-back to the file with no separator, and only a single `writeln!` is emitted after the whole loop. The result is concatenated JSON objects on one physical line like `{...StringRef...}{...StringRef...}\\n`, which is not valid JSON-lines and will break any line-based consumer (the devtools reader expects one JSON object per line). This is reachable for events such as `AssetsReady` / `ChunkGraphReady` that can carry several large string fields.","fix":"Emit a newline after each StringRef object inside the loop (e.g. `writeln!(file)` per written ref), or accumulate refs and write each on its own line. Do not rely on a single trailing writeln for multiple objects.","locations":[{"ref":"crates/rolldown_devtools/src/writer.rs:149-168","code":"  149 |   let mut wrote_ref = false;\n  150 |   for value in action_meta.values() {\n  151 |     if let serde_json::Value::String(s) = value {\n  152 |       if s.len() > 5 * 1024 {\n  153 |         let hash = blake3::hash(s.as_bytes()).to_hex().to_string();\n  154 |         if exist_hashes.insert(hash.clone()) {\n  155 |           let mut serializer = serde_json::Serializer::new(&mut *file);\n  156 |           let mut map = serializer.serialize_map(None)?;\n  157 |           map.serialize_entry(\"action\", \"StringRef\")?;\n  158 |           map.serialize_entry(\"id\", &hash)?;\n  159 |           map.serialize_entry(\"content\", s)?;\n  160 |           map.end()?;\n  161 |           wrote_ref = true;\n  162 |         }\n  163 |       }\n  164 |     }\n  165 |   }\n  166 |   if wrote_ref {\n  167 |     writeln!(file).map_err(serde_json::Error::io)?;\n  168 |   }","lines":20,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_devtools/src/writer.rs#L149-L168"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`MemoryFileSystem::exists` returns `self.fs.exists(...).is_ok()`. The underlying `vfs`\n`FileSystem::exists` returns `VfsResult<bool>` (i.e. `Result<bool, VfsError>`), so for a\npath whose parent exists but the file itself does not, the call returns `Ok(false)` and\n`.is_ok()` evaluates to `true`. The method therefore reports that nearly every queried path\nexists, the opposite of intended behavior. `exists` should unwrap the inner boolean\n(`== Ok(true)`), matching how `add_file_bytes` uses `fs.exists(...).unwrap()` to branch on\nthe bool. Affects the in-memory filesystem used by tests/REPL.","fix":"Return the inner boolean: `self.fs.exists(path.to_string_lossy().as_ref()) == Ok(true)` (or `.unwrap_or(false)`).","locations":[{"ref":"crates/rolldown_fs/src/memory.rs:73-75","code":"   73 |   fn exists(&self, path: &Path) -> bool {\n   74 |     self.fs.exists(path.to_string_lossy().as_ref()).is_ok()\n   75 |   }","lines":3,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_fs/src/memory.rs#L73-L75"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"ChunkImportMapPlugin::render_chunk lazily builds the shared `chunk_import_map` exactly once, guarded by an `AtomicBool` swap. render_chunk is invoked CONCURRENTLY for every chunk via `try_join_all` (crates/rolldown/src/stages/generate_stage/render_chunks.rs uses `try_join_all(assets.iter_mut()...)`). The single thread that wins `self.initialized.swap(true, ...)` builds the entire map (lines 41-79) while all other concurrent render_chunk calls skip the init block and immediately proceed to lines 81-96, reading the map before it is fully populated. Those threads filter placeholders with `contains_key` (line 82) against an incomplete map, so placeholders not yet inserted by the in-progress initializer are silently dropped and never replaced, leaving raw `!~{...}~` hash placeholders in the emitted code. The result is non-deterministic, depending on scheduling. The atomic only prevents double-initialization; it provides no happens-before guarantee that initialization has completed before other threads read the map.","fix":"Build the chunk_import_map in a hook that runs once before chunk rendering (e.g. a dedicated pre-pass / once-cell future that all render_chunk calls await), or wrap initialization in a `tokio::sync::OnceCell`/`Mutex` so every render_chunk thread blocks until the map is fully populated, instead of using a fire-and-forget AtomicBool swap.","locations":[{"ref":"crates/rolldown_plugin_chunk_import_map/src/lib.rs:41-96","code":"   41 |     if !self.initialized.swap(true, Ordering::SeqCst) {\n   42 |       let base = args.options.hash_characters.base();\n   43 |       let mut used_names = FxHashSet::default();\n   44 |       for chunk in args.chunks.values() {\n   45 |         let mut hash_placeholders =\n   46 |           find_hash_placeholders(&chunk.filename, &HASH_PLACEHOLDER_LEFT_FINDER).peekable();\n   47 |         if hash_placeholders.peek().is_none() {\n   48 |           continue;\n   49 |         }\n   50 |         let hasher = match &chunk.facade_module_id {\n   51 |           Some(module_id) => {\n   52 |             let mut hasher = Xxh3::with_seed(0);\n   53 |             module_id.as_str().hash(&mut hasher);\n   54 |             hasher\n   55 |           }\n   56 |           None => {\n   57 |             // Fallback logic for common chunk\n   58 |             let mut hasher = Xxh3::with_seed(1);\n   59 |             if used_names.contains(&chunk.name) {\n   60 |               // Reduce the impact factor\n   61 |               let Some(module_id) = chunk.module_ids.iter().min() else { continue };\n   62 |               module_id.as_str().hash(&mut hasher);\n   63 |             } else {\n   64 |               used_names.insert(chunk.name.clone());\n   65 |               chunk.name.hash(&mut hasher);\n   66 |             }\n   67 |             hasher\n   68 |           }\n   69 |         };\n   70 |         let hash = encode_hash_with_base(&hasher.digest128().to_le_bytes(), base);\n   71 |         let mut chunk_id = chunk.filename.to_string();\n   72 |         for (start, end, placeholder) in hash_placeholders {\n   73 |           let hash = hash[..end - start].to_string();\n   74 |           unsafe { chunk_id.as_bytes_mut()[start..end].copy_from_slice(hash.as_bytes()) };\n   75 |           self.chunk_import_map.insert(placeholder.into(), hash);\n   76 |         }\n   77 |         self.chunk_import_map.insert(chunk.filename.clone(), chunk_id);\n   78 |       }\n   79 |     }\n   80 | \n   81 |     let placeholders: Vec<_> = find_hash_placeholders(&args.code, &HASH_PLACEHOLDER_LEFT_FINDER)\n   82 |       .filter(|placeholder| self.chunk_import_map.contains_key(placeholder.2))\n   83 |       .collect();\n   84 | \n   85 |     if placeholders.is_empty() {\n   86 |       return Ok(None);\n   87 |     }\n   88 | \n   89 |     let mut code = args.code.as_ref().clone();\n   90 |     for (start, end, placeholder) in placeholders {\n   91 |       let hash = self.chunk_import_map.get(placeholder).expect(\"hash placeholder must exist\");\n   92 |       debug_assert_eq!(hash.len(), end - start, \"hash length doesn't match placeholder size\");\n   93 |       unsafe {\n   94 |         code.as_bytes_mut()[start..end].copy_from_slice(hash.as_bytes());\n   95 |       }\n   96 |     }","lines":56,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_plugin_chunk_import_map/src/lib.rs#L41-L96"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`is_external_url` discards the result of its alphabetic-protocol check:\n`protocol.strip_suffix(':').map(|p| p.bytes().all(..is_ascii_alphabetic)).is_some()`.\n`.map(...)` yields `Some(bool)` and `.is_some()` is true whenever\n`strip_suffix(':')` succeeds, regardless of the inner boolean. So any id of the\nform `<anything>://...` whose pre-`//` segment ends with `:` is treated as an\nexternal URL even when the \"protocol\" contains digits or other non-alphabetic\ncharacters (e.g. `c1:abc//`).","fix":"Use `.is_some_and(|all_alpha| all_alpha)` (or `== Some(true)`) instead of `.is_some()`.","locations":[{"ref":"crates/rolldown_plugin_vite_resolve/src/vite_resolve_plugin.rs:658-669","code":"  658 | fn is_external_url(id: &str) -> bool {\n  659 |   if let Some(double_slash_pos) = id.find(\"//\") {\n  660 |     if double_slash_pos == 0 {\n  661 |       true\n  662 |     } else {\n  663 |       let protocol = &id[0..double_slash_pos];\n  664 |       protocol.strip_suffix(':').map(|p| p.bytes().all(|c| c.is_ascii_alphabetic())).is_some()\n  665 |     }\n  666 |   } else {\n  667 |     false\n  668 |   }\n  669 | }","lines":12,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_plugin_vite_resolve/src/vite_resolve_plugin.rs#L658-L669"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`finalize_normal_module` builds `transferred_import_record` from `chunk.remove_map` with empty-string values, and `transform_or_remove_import_export_stmt` later only populates a real source string when `transferred_import_record.contains_key(&rec_idx)`. For a CJS/ESM record present in the remove_map, the statement is rendered to a string AND the statement is removed (returns `true`). But if a record is in `remove_map` yet its importee is `WrapKind::None` (the first match arm), the transferred string is never populated and the statement is just dropped, leaving an empty-string entry in `transferred_import_record`. Downstream consumers of `transferred_import_record` may treat an empty string as \"no transferred code\" vs \"removed\"; verify the empty-string-vs-populated distinction is handled correctly by the consumer.","fix":"Audit the consumer of `transferred_import_record`: ensure WrapKind::None records that are removed but never re-rendered are handled (drop the entry, or document that empty string means removed-without-replacement).","locations":[{"ref":"crates/rolldown/src/module_finalizers/finalizer_context.rs:128-134","code":"  128 |       let transferred_import_record = self\n  129 |         .chunk\n  130 |         .remove_map\n  131 |         .get(&self.idx)\n  132 |         .cloned()\n  133 |         .map(|idxs| idxs.into_iter().map(|idx| (idx, String::new())).collect::<FxIndexMap<_, _>>())\n  134 |         .unwrap_or_default();","lines":7,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/module_finalizers/finalizer_context.rs#L128-L134"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Known-limitation memoization in `compute_tla::find_tla_source`: on a cycle hit the `Visiting` arm returns `None`, and that `None` is then memoized as `Visited(None)` for every node along the current DFS path even if a later sibling branch of the same parent would have discovered TLA through one of those nodes. A subsequent `require(...)` lookup that lands on a prematurely-memoized sibling silently misses the forbidden `require` of a TLA module (no diagnostic emitted). The code documents this but does not guard against it.","fix":"Defer memoization of nodes participating in an unresolved cycle until the enclosing SCC resolves (e.g. only memoize a definitive result, leave cycle-tainted nodes as NotVisited or track them separately).","locations":[{"ref":"crates/rolldown/src/stages/link_stage/compute_tla.rs:32-72","code":"   32 |     // Known limitation: on a cycle hit we return `None` for the visiting\n   33 |     // edge and then memoize modules along the current DFS path even\n   34 |     // though a later branch of the same parent might still discover TLA\n   35 |     // through them. If a subsequent `require(...)` lookup lands on one\n   36 |     // of those prematurely memoized siblings we silently miss the error.\n   37 |     // A proper fix would delay memoization until the enclosing SCC\n   38 |     // resolves.\n   39 |     fn find_tla_source(\n   40 |       module_idx: ModuleIdx,\n   41 |       module_table: &ModuleTable,\n   42 |       visited: &mut IndexVec<ModuleIdx, TlaVisitState>,\n   43 |     ) -> Option<ModuleIdx> {\n   44 |       match visited[module_idx] {\n   45 |         TlaVisitState::Visited(result) => return result,\n   46 |         TlaVisitState::Visiting => return None,\n   47 |         TlaVisitState::NotVisited => {}\n   48 |       }\n   49 | \n   50 |       visited[module_idx] = TlaVisitState::Visiting;\n   51 |       let module = &module_table[module_idx];\n   52 |       let is_self_tla = module\n   53 |         .as_normal()\n   54 |         .is_some_and(|module| module.ast_usage.contains(EcmaModuleAstUsage::TopLevelAwait));\n   55 |       if is_self_tla {\n   56 |         visited[module_idx] = TlaVisitState::Visited(Some(module_idx));\n   57 |         return Some(module_idx);\n   58 |       }\n   59 | \n   60 |       let tla_source = module\n   61 |         .import_records()\n   62 |         .iter()\n   63 |         .filter(|rec| matches!(rec.kind, ImportKind::Import))\n   64 |         .find_map(|rec| {\n   65 |           rec\n   66 |             .resolved_module\n   67 |             .and_then(|dep_idx| find_tla_source(module_table[dep_idx].idx(), module_table, visited))\n   68 |         });\n   69 | \n   70 |       visited[module_idx] = TlaVisitState::Visited(tla_source);\n   71 |       tla_source\n   72 |     }","lines":41,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/stages/link_stage/compute_tla.rs#L32-L72"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`acquire_all` discards the actual worker indices it receives, and `WorkerAllSemaphorePermit::drop` re-injects synthetic indices `0..worker_count` on release. This only happens to be correct when the pool is always exactly {0..worker_count} and `acquire`/`acquire_all` never interleave. If a per-worker `acquire` permit is outstanding when an `acquire_all` permit drops, the channel can end up with duplicate or missing indices, corrupting the `plugins[worker_index]` mapping used by `run_single`.","fix":"Have `acquire_all` collect and return the exact indices it took, or use a counting semaphore that doesn't carry per-permit identity for the bulk case.","locations":[{"ref":"crates/rolldown_binding/src/worker_manager.rs:32-41","code":"   32 |   pub async fn acquire_all(&self) -> WorkerAllSemaphorePermit {\n   33 |     for _ in 0..self.worker_count {\n   34 |       self.free_workers_receiver.recv().await.unwrap();\n   35 |     }\n   36 | \n   37 |     WorkerAllSemaphorePermit {\n   38 |       worker_count: self.worker_count,\n   39 |       sender: self.free_workers_sender.clone(),\n   40 |     }\n   41 |   }","lines":10,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_binding/src/worker_manager.rs#L32-L41"},{"ref":"crates/rolldown_binding/src/worker_manager.rs:73-84","code":"   73 | #[cfg(not(target_family = \"wasm\"))]\n   74 | impl Drop for WorkerAllSemaphorePermit {\n   75 |   fn drop(&mut self) {\n   76 |     let worker_count = self.worker_count;\n   77 |     (0..worker_count).for_each(|value| {\n   78 |       self\n   79 |         .sender\n   80 |         .send_blocking(value)\n   81 |         .expect(\"WorkerManager: failed to return workers to pool during bulk release - channel closed unexpectedly\");\n   82 |     });\n   83 |   }\n   84 | }","lines":12,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_binding/src/worker_manager.rs#L73-L84"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`treeshake: true`/absent and `treeshake: {}` produce different `invalidImportSideEffects` behaviour.\nIn `deserialize_treeshake`, the `None | Some(true)` branch sets `invalid_import_side_effects: None`, which the\naccessor `NormalizedTreeshakeOptions::invalid_import_side_effects()` resolves to `false`. But the `Object` branch\ndefaults the same field to `Some(true)`. So `treeshake: true` yields `false` while `treeshake: {}` yields `true`,\nwhich is surprising and almost certainly unintended.","fix":"Make both paths agree: either set `invalid_import_side_effects: Some(false)` in the object-branch fallback (matching the accessor default), or set the `true`-branch field to `Some(true)`. Pick the intended default and apply it uniformly.","locations":[{"ref":"crates/rolldown_common/src/inner_bundler_options/mod.rs:351-361","code":"  351 |     None | Some(Value::Bool(true)) => {\n  352 |       Ok(TreeshakeOptions::Option(types::treeshake::InnerOptions {\n  353 |         module_side_effects: types::treeshake::ModuleSideEffects::Boolean(true),\n  354 |         annotations: Some(true),\n  355 |         manual_pure_functions: None,\n  356 |         unknown_global_side_effects: None,\n  357 |         commonjs: Some(true),\n  358 |         property_read_side_effects: None,\n  359 |         property_write_side_effects: None,\n  360 |         invalid_import_side_effects: None,\n  361 |       }))","lines":11,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_common/src/inner_bundler_options/mod.rs#L351-L361"},{"ref":"crates/rolldown_common/src/inner_bundler_options/mod.rs:394-402","code":"  394 |       let invalid_import_side_effects = obj.get(\"invalidImportSideEffects\").map_or_else(\n  395 |         || Ok(Some(true)),\n  396 |         |v| match v {\n  397 |           Value::Bool(b) => Ok(Some(*b)),\n  398 |           _ => Err(serde::de::Error::custom(\n  399 |             \"invalid_import_side_effects should be a `true` or `false`\",\n  400 |           )),\n  401 |         },\n  402 |       )?;","lines":9,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_common/src/inner_bundler_options/mod.rs#L394-L402"},{"ref":"crates/rolldown_common/src/inner_bundler_options/types/treeshake.rs:72-74","code":"   72 |   pub fn invalid_import_side_effects(&self) -> bool {\n   73 |     self.as_ref().and_then(|item| item.invalid_import_side_effects).unwrap_or(false)\n   74 |   }","lines":3,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_common/src/inner_bundler_options/types/treeshake.rs#L72-L74"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`HybridIndexVec::push` on the `Map` variant derives the new index from `I::from_usize(m.len())`. The Map variant is\nexplicitly designed for sparse indices (it has an `insert(i, item)` method and `reserve` calls it a \"sparse index\nvec\"). If any entry was previously `insert`ed at a non-contiguous index, `m.len()` no longer corresponds to the next\nfree slot, so `push` can collide with / overwrite an existing entry or skip indices. Mixing `insert` and `push` on\nthe same Map instance is a latent correctness hazard.","fix":"Either forbid `push` on the Map variant (panic like `insert` does for IndexVec), or track a separate monotonic next-index counter for the Map variant instead of deriving it from `len()`.","locations":[{"ref":"crates/rolldown_common/src/types/hybrid_index_vec.rs:25-44","code":"   25 |   pub fn push(&mut self, item: T) -> I {\n   26 |     match self {\n   27 |       HybridIndexVec::IndexVec(v) => v.push(item),\n   28 |       HybridIndexVec::Map(m) => {\n   29 |         let idx = I::from_usize(m.len());\n   30 |         m.insert(idx, item);\n   31 |         idx\n   32 |       }\n   33 |     }\n   34 |   }\n   35 |   /// # Panic\n   36 |   /// This method is only available for `Sparse Map` variant.\n   37 |   pub fn insert(&mut self, i: I, item: T) {\n   38 |     match self {\n   39 |       HybridIndexVec::IndexVec(_) => unreachable!(),\n   40 |       HybridIndexVec::Map(m) => {\n   41 |         m.insert(i, item);\n   42 |       }\n   43 |     }\n   44 |   }","lines":20,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_common/src/types/hybrid_index_vec.rs#L25-L44"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`extract_context_variables_from_action` recurses into nested objects/arrays to collect `${var}` placeholders, but `inject_context_data` only walks the top-level object and never recurses. If a placeholder ever appears in a nested field, the variable is collected and resolved into `found_context_fields` but is never substituted back into the value - it stays as the literal `${var}` in the output. The two functions sitting next to each other with divergent traversal depth is a latent correctness trap for any future nested placeholder.","fix":"Make both functions use the same traversal: either recurse in `inject_context_data` too, or restrict extraction to the top level to match injection.","locations":[{"ref":"crates/rolldown_devtools/src/devtools_formatter.rs:98-118","code":"   98 | pub fn extract_context_variables_from_action(meta: &serde_json::Value) -> FxHashSet<String> {\n   99 |   fn visit(meta: &serde_json::Value, context_variables: &mut FxHashSet<String>) {\n  100 |     if let serde_json::Value::Object(map) = meta {\n  101 |       for (_key, value) in map {\n  102 |         match value {\n  103 |           serde_json::Value::String(value) if value.starts_with(\"${\") && value.ends_with('}') => {\n  104 |             // Check if the value is a placeholder for provided data\n  105 |             {\n  106 |               let var_name = &value[2..value.len() - 1];\n  107 |               context_variables.insert(var_name.to_string());\n  108 |             }\n  109 |           }\n  110 |           _ => visit(value, context_variables),\n  111 |         }\n  112 |       }\n  113 |     }\n  114 |   }\n  115 | \n  116 |   let mut contextual_fields = FxHashSet::default();\n  117 |   visit(meta, &mut contextual_fields);\n  118 |   contextual_fields","lines":21,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_devtools/src/devtools_formatter.rs#L98-L118"},{"ref":"crates/rolldown_devtools/src/devtools_formatter.rs:121-135","code":"  121 | pub fn inject_context_data(meta: &mut serde_json::Value, context_data: &FxHashMap<String, String>) {\n  122 |   if let serde_json::Value::Object(map) = meta {\n  123 |     for value in map.values_mut() {\n  124 |       if let serde_json::Value::String(value) = value {\n  125 |         if value.starts_with(\"${\") && value.ends_with('}') {\n  126 |           // Check if the value is a placeholder for provided data\n  127 |           let var_name = &value[2..value.len() - 1];\n  128 |           if let Some(replacement_value) = context_data.get(var_name) {\n  129 |             *value = replacement_value.clone();\n  130 |           }\n  131 |         }\n  132 |       }\n  133 |     }\n  134 |   }\n  135 | }","lines":15,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_devtools/src/devtools_formatter.rs#L121-L135"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Threshold mismatch between the two passes of `write_event`. Pass 1 emits a `StringRef` (content-bearing) line for any string longer than 5KB, but pass 2 only replaces a field with `$ref:<hash>` when the string is longer than 10KB. Consequently, strings in the (5KB, 10KB] range get a StringRef line written to the file (duplicating the content), yet are still inlined verbatim in the event line - the StringRef is orphaned (never referenced) and the deduplication/space-saving intent is defeated, roughly doubling on-disk size for those fields.","fix":"Use a single shared threshold constant for both passes (emit StringRef and substitute `$ref:` at the same size cutoff).","locations":[{"ref":"crates/rolldown_devtools/src/writer.rs:152-153","code":"  152 |       if s.len() > 5 * 1024 {\n  153 |         let hash = blake3::hash(s.as_bytes()).to_hex().to_string();","lines":2,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_devtools/src/writer.rs#L152-L153"},{"ref":"crates/rolldown_devtools/src/writer.rs:177-179","code":"  177 |         serde_json::Value::String(s) if s.len() > 10 * 1024 => {\n  178 |           let hash = blake3::hash(s.as_bytes()).to_hex().to_string();\n  179 |           map.serialize_entry(key, &format!(\"$ref:{hash}\"))?;","lines":3,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_devtools/src/writer.rs#L177-L179"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"The virtual-module help hint never triggers because the prefix string is wrong. `UnloadableDependency::resolved` stores the raw module id, and virtual module ids start with a single NUL byte `\\0` (see `transform_plugin_context.rs:71`, `normal_module.rs:120`, etc.). The check compares against the two-character literal backslash-zero (`\"\\0\"` in Rust source = `\\` followed by `0`), which a raw NUL-prefixed id can never start with. The `resolved` value is also not run through `stabilize_path` (which would escape `\\0` -> `\\\\0`), so even the escaped form is wrong. As a result the \"This module seems to be a virtual module...\" help is dead and users never see it. It should be `self.resolved.starts_with('\\0')`.","fix":"Change the guard to `if self.resolved.starts_with('\\0')` (single NUL char), matching how virtual ids are detected everywhere else.","locations":[{"ref":"crates/rolldown_error/src/build_diagnostic/events/unloadable_dependency.rs:67-71","code":"   67 |     if self.resolved.starts_with(\"\\\\0\") {\n   68 |       diagnostic.add_help(String::from(\n   69 |         \"This module seems to be a virtual module, but no plugin handled it via the load hook.\",\n   70 |       ));\n   71 |     }","lines":5,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_error/src/build_diagnostic/events/unloadable_dependency.rs#L67-L71"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`is_variable_declaration_prefix` indexes characters using a byte length.\n`s.chars().nth(s.len() - 6)` and the `let`/`var` equivalents treat `s.len()`\n(byte length) as a char index. `s` is the source text BEFORE a match and can\ncontain multi-byte UTF-8 (comments, identifiers, strings). When it does,\n`chars().nth(byte_len - N)` selects the wrong character (or `None`), so the\n\"word boundary before const/let/var\" check is computed against the wrong\nposition. This misdetects variable-declaration prefixes for any non-ASCII\ninput preceding the keyword, causing `prevent_assignment` to wrongly skip or\nwrongly perform replacements. `chars().nth()` is also O(n), making this an\nO(n^2) scan over the prefix.","fix":"Operate on `char` boundaries: check the char immediately preceding the keyword\nvia `s[..s.len()-5].chars().next_back()` (byte-slicing at a known ASCII\nkeyword boundary is safe) instead of `chars().nth(s.len()-N)`.","locations":[{"ref":"crates/rolldown_plugin_replace/src/plugin.rs:35-51","code":"   35 | fn is_variable_declaration_prefix(s: &str) -> bool {\n   36 |   // First check if there's any whitespace at the end\n   37 |   if !s.ends_with(|c: char| c.is_whitespace()) {\n   38 |     return false;\n   39 |   }\n   40 | \n   41 |   // Trim the trailing whitespace\n   42 |   let s = s.trim_end();\n   43 | \n   44 |   // Check for word boundary before the keywords\n   45 |   (s.ends_with(\"const\")\n   46 |     && (s.len() == 5 || !s.chars().nth(s.len() - 6).unwrap_or(' ').is_alphanumeric()))\n   47 |     || (s.ends_with(\"let\")\n   48 |       && (s.len() == 3 || !s.chars().nth(s.len() - 4).unwrap_or(' ').is_alphanumeric()))\n   49 |     || (s.ends_with(\"var\")\n   50 |       && (s.len() == 3 || !s.chars().nth(s.len() - 4).unwrap_or(' ').is_alphanumeric()))\n   51 | }","lines":17,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_plugin_replace/src/plugin.rs#L35-L51"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`is_json_ext` diverges from the Vite regex `/\\.json(?:$|\\?)(?!commonjs-(?:proxy|external))/`. The regex uses a negative lookahead that fails whenever the text after `.json?` merely STARTS WITH `commonjs-proxy` or `commonjs-external`. The Rust port instead requires FULL equality of the whole postfix string (`postfix != \"commonjs-proxy\" && postfix != \"commonjs-external\"`). So an id like `test.json?commonjs-proxy-extra` is rejected by Vite (lookahead matches the prefix) but accepted here (full string differs), producing different transform decisions for commonjs-proxy/external suffixed ids that carry trailing characters.","fix":"Match the prefix semantics of the lookahead: replace the equality checks with `!postfix.starts_with(\"commonjs-proxy\") && !postfix.starts_with(\"commonjs-external\")`.","locations":[{"ref":"crates/rolldown_plugin_vite_json/src/utils.rs:1-11","code":"    1 | /// /\\.json(?:$|\\?)(?!commonjs-(?:proxy|external))/\n    2 | pub fn is_json_ext(ext: &str) -> bool {\n    3 |   if ext.ends_with(\".json\") {\n    4 |     return true;\n    5 |   }\n    6 |   let Some(i) = memchr::memmem::rfind(ext.as_bytes(), b\".json?\") else {\n    7 |     return false;\n    8 |   };\n    9 |   let postfix = &ext[i + 6..];\n   10 |   postfix != \"commonjs-proxy\" && postfix != \"commonjs-external\"\n   11 | }","lines":11,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_plugin_vite_json/src/utils.rs#L1-L11"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In the reporter, the message truncation compares `message.len()` (byte length, including ANSI color escape sequences emitted by `utils::paint`) against the terminal width (display columns). For any colored message the byte length is far larger than the visible width, so messages that visually fit are still truncated, and the truncation point bears no relation to the actual rendered column. The displayed `transforming (...) <path>` line will be cut arbitrarily.","fix":"Measure the visible width by stripping ANSI escapes (or build the truncated plain string first, then apply styling), and compare that against the terminal column count.","locations":[{"ref":"crates/rolldown_plugin_vite_reporter/src/utils.rs:98-100","code":"   98 |   let message = terminal_size::terminal_size()\n   99 |     .map(|(width, _)| width.0 as usize)\n  100 |     .map_or(message, |width| if message.len() < width { message } else { &message[..width] });","lines":3,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_plugin_vite_reporter/src/utils.rs#L98-L100"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`is_use_strict_directive` trims any leading run of quote chars and any trailing run of quote/semicolon chars, then compares to `use strict`. This would also match malformed inputs like `'\"use strict;;'` or mixed quotes `'use strict\"`. Directives in practice are well-formed so this is low risk, but the asymmetric quote trimming (it does not require matching open/close quotes) is a latent correctness smell used to decide whether to inject/strip `\"use strict\"`.","fix":"Match the directive more strictly (e.g. exact `\"use strict\"` / `'use strict'` with optional trailing `;`) rather than trimming arbitrary runs of quote characters from both ends.","locations":[{"ref":"crates/rolldown/src/ecmascript/format/utils/mod.rs:184-189","code":"  184 | /// Returns `true` if the given directive string is a `\"use strict\"` directive.\n  185 | /// Handles both single-quoted (`'use strict'`) and double-quoted (`\"use strict\"`) forms,\n  186 | /// with or without a trailing semicolon.\n  187 | pub fn is_use_strict_directive(s: &str) -> bool {\n  188 |   s.trim_start_matches(['\\'', '\"']).trim_end_matches(['\\'', '\"', ';']) == \"use strict\"\n  189 | }","lines":6,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/ecmascript/format/utils/mod.rs#L184-L189"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The `JsonModule` flag is set on an import record purely by checking `resolved_id.id.ends_with(\".json\")`\nin vite mode. A resolved id that ends in `.json` but is not actually a JSON module (e.g. a virtual\nmodule or a plugin-produced id that merely has a `.json` suffix) is incorrectly tagged\n`ImportRecordMeta::JsonModule`, which later drives the special `__toCommonJS(...).default` unwrap\nin the HMR `require` rewrite. The detection should be tied to the module's actual resolved\n`ModuleType`, not a string suffix.","fix":"Key the `JsonModule` meta off the resolved module's `ModuleType`/asserted type rather than the `.json` filename suffix.","locations":[{"ref":"crates/rolldown/src/module_loader/module_loader.rs:546-550","code":"  546 |             if self.shared_context.options.experimental.vite_mode.unwrap_or_default()\n  547 |               && resolved_id.id.as_str().ends_with(\".json\")\n  548 |             {\n  549 |               raw_rec.meta.insert(ImportRecordMeta::JsonModule);\n  550 |             }","lines":5,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/module_loader/module_loader.rs#L546-L550"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`would_create_circular_dependency` seeds the BFS queue with the union of source and target dependencies and only marks a node visited *after* popping it. The `if chunk_idx == target_chunk_idx { return true; }` check at the top returns true if target is merely *reachable from* source/target deps, but the simulated back-edge (queue target when a node depends on source) can push target multiple times and the early-return-before-visited-insert means target itself can be re-enqueued and rechecked. Functionally it returns the right boolean, but the same target can be enqueued and popped repeatedly via the simulated edge, doing redundant work; combined with `is_reachable` having the cleaner pattern, the asymmetry suggests the dedup here is weaker than intended.","fix":"Guard the simulated `queue.push_back(target_chunk_idx)` with a `visited.contains` check (as is done for normal deps), and/or move the `chunk_idx == target` check to occur only on first visit, to avoid re-enqueuing already-visited nodes.","locations":[{"ref":"crates/rolldown/src/stages/generate_stage/chunk_optimizer.rs:222-250","code":"  222 |     // Start BFS from the combined deps of source and target.\n  223 |     let mut queue: VecDeque<ChunkIdx> = self.chunks[source_chunk_idx]\n  224 |       .dependencies\n  225 |       .iter()\n  226 |       .chain(self.chunks[target_chunk_idx].dependencies.iter())\n  227 |       .copied()\n  228 |       .collect();\n  229 |     let mut visited = FxHashSet::default();\n  230 | \n  231 |     while let Some(chunk_idx) = queue.pop_front() {\n  232 |       if chunk_idx == target_chunk_idx {\n  233 |         return true;\n  234 |       }\n  235 |       if !visited.insert(chunk_idx) {\n  236 |         continue;\n  237 |       }\n  238 |       for &dep in &self.chunks[chunk_idx].dependencies {\n  239 |         if !visited.contains(&dep) {\n  240 |           queue.push_back(dep);\n  241 |         }\n  242 |       }\n  243 |       // Any chunk that depends on source will depend on target after the merge.\n  244 |       // Simulate this by also queuing target when we encounter such a chunk.\n  245 |       if self.chunks[chunk_idx].dependencies.contains(&source_chunk_idx) {\n  246 |         queue.push_back(target_chunk_idx);\n  247 |       }\n  248 |     }\n  249 | \n  250 |     false","lines":29,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/stages/generate_stage/chunk_optimizer.rs#L222-L250"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `pick_relevance_split_index` the tie-break compares `(best_similarity - similarity).abs() > SIMILARITY_SIGNIFICANCE_THRESHOLD` while `best_similarity` is initialized to `i32::MAX`. On the very first candidate the subtraction `i32::MAX - similarity` overflows in debug builds (panic) and wraps in release builds. It happens to still select the first candidate because the wrapped value is large/positive and `similarity < best_similarity` is true, but relying on signed overflow is fragile and would panic under `overflow-checks=true`.","fix":"Special-case the first iteration (when `best_split_index.is_none()`) to unconditionally accept, or use `i64`/`saturating_sub` for the difference so the initial `i32::MAX` sentinel can't overflow.","locations":[{"ref":"crates/rolldown/src/stages/generate_stage/manual_code_splitting.rs:805-828","code":"  805 |   let mut best_split_index = None;\n  806 |   let mut best_similarity = i32::MAX;\n  807 |   let mut best_oversized_side_count = usize::MAX;\n  808 |   let mut best_max_side_size = f64::INFINITY;\n  809 | \n  810 |   for split_index in left_bound..=right_bound {\n  811 |     let left_size = prefix_sizes[split_index];\n  812 |     let right_size = total_size - left_size;\n  813 |     if left_size < min_size || right_size < min_size {\n  814 |       continue;\n  815 |     }\n  816 | \n  817 |     let similarity = stable_id_similarity(keys[split_index - 1], keys[split_index]);\n  818 |     let oversized_side_count =\n  819 |       usize::from(left_size > max_size) + usize::from(right_size > max_size);\n  820 |     let max_side_size = left_size.max(right_size);\n  821 | \n  822 |     let is_better = if (best_similarity - similarity).abs() > SIMILARITY_SIGNIFICANCE_THRESHOLD {\n  823 |       similarity < best_similarity\n  824 |     } else if oversized_side_count != best_oversized_side_count {\n  825 |       oversized_side_count < best_oversized_side_count\n  826 |     } else {\n  827 |       max_side_size < best_max_side_size\n  828 |     };","lines":24,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/stages/generate_stage/manual_code_splitting.rs#L805-L828"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `is_dynamic_entry_alive`, `entry.related_stmt_infos.iter().any(...)` both decides liveness and (as a side effect inside the closure) accumulates dead pure-dynamic-import records into `ret`. `any` short-circuits on the first lived stmt, so `ret` is only fully populated when the entry is dead; when alive, `ret` is discarded anyway, so the accumulation is effectively coupled to control flow in a non-obvious way. This works today but is brittle: any refactor that reads `ret` regardless of liveness would get a partial set.","fix":"Separate the liveness predicate from the dead-record collection (compute liveness first, then collect dead records only when not lived), or add a comment making the short-circuit coupling explicit.","locations":[{"ref":"crates/rolldown/src/stages/link_stage/tree_shaking/dynamic_entries.rs:176-216","code":"  176 |     let mut ret = vec![];\n  177 |     let is_lived = match entry_point.kind {\n  178 |       EntryPointKind::UserDefined | EntryPointKind::EmittedUserDefined => true,\n  179 |       EntryPointKind::DynamicImport => {\n  180 |         let is_dynamic_imported_module_exports_unused =\n  181 |           self.dynamic_import_exports_usage_map.get(&entry_point.idx).is_some_and(\n  182 |             |item| matches!(item, DynamicImportExportsUsage::Partial(set) if set.is_empty()),\n  183 |           );\n  184 | \n  185 |         // Mark the dynamic entry as lived if at least one statement that create this entry is included\n  186 |         entry_point.related_stmt_infos.iter().any(\n  187 |           |(module_idx, stmt_idx, node_id, import_record_idx)| {\n  188 |             if unreachable_import_expression_node_ids.contains(&(*module_idx, *node_id)) {\n  189 |               return false;\n  190 |             }\n  191 |             let module =\n  192 |               &self.module_table[*module_idx].as_normal().expect(\"should be a normal module\");\n  193 |             let all_dead_pure_dynamic_import = {\n  194 |               let import_record = &module.import_records[*import_record_idx];\n  195 |               let importee_side_effects = self.module_table[import_record.into_resolved_module()]\n  196 |                 .side_effects()\n  197 |                 .has_side_effects();\n  198 | \n  199 |               // Only consider it is unused if it is a top level pure dynamic import and the\n  200 |               // importee module has no side effects.\n  201 |               !importee_side_effects\n  202 |                 && import_record.meta.contains(ImportRecordMeta::TopLevelPureDynamicImport)\n  203 |             };\n  204 |             let is_stmt_included = is_stmt_included_vec[*module_idx].has_bit(*stmt_idx);\n  205 |             let lived = is_stmt_included\n  206 |               && (!is_dynamic_imported_module_exports_unused || !all_dead_pure_dynamic_import);\n  207 | \n  208 |             if !lived && all_dead_pure_dynamic_import {\n  209 |               ret.push((*module_idx, *import_record_idx));\n  210 |             }\n  211 |             lived\n  212 |           },\n  213 |         )\n  214 |       }\n  215 |     };\n  216 |     (!is_lived).then_some(ret)","lines":41,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/stages/link_stage/tree_shaking/dynamic_entries.rs#L176-L216"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`deconflict_filenames` only deconflicts chunks whose preliminary filename contains a hash\nplaceholder. For a chunk with no placeholder it inserts `preliminary_filename.to_lowercase()` into\n`taken` and `continue`s without checking whether that name was already taken. Two placeholder-less\nchunks (or a placeholder-less chunk colliding case-insensitively with an already-taken name) will\nsilently produce the same output filename, so one overwrites the other on write. The doc comment\nclaims it rehashes \"any chunk whose resolved file name would collide\", which does not hold for the\nno-placeholder branch.","fix":"Detect collisions in the no-placeholder branch as well (e.g. surface a diagnostic, since a\nplaceholder-less name cannot be rehashed), or update the doc comment to state that placeholder-less\nfilenames are assumed unique by construction and why.","locations":[{"ref":"crates/rolldown/src/utils/chunk/finalize_chunks.rs:393-409","code":"  393 |   let mut taken: FxHashSet<String> = FxHashSet::with_capacity(index_instantiated_chunks.len());\n  394 |   for (asset_idx, chunk) in index_instantiated_chunks.iter_enumerated() {\n  395 |     let preliminary_filename = chunk.preliminary_filename.as_str();\n  396 |     let Some(placeholders) = chunk.preliminary_filename.hash_placeholder() else {\n  397 |       taken.insert(preliminary_filename.to_lowercase());\n  398 |       continue;\n  399 |     };\n  400 |     loop {\n  401 |       let candidate =\n  402 |         resolve_filename(preliminary_filename, placeholders, &index_final_hashes[asset_idx].0);\n  403 |       if taken.insert(candidate.to_lowercase()) {\n  404 |         break;\n  405 |       }\n  406 |       index_final_hashes[asset_idx] = rehash(&index_final_hashes[asset_idx].0, hash_base);\n  407 |     }\n  408 |   }\n  409 | }","lines":17,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/utils/chunk/finalize_chunks.rs#L393-L409"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`get_order` maps `PluginOrder::PinPost` to the string `\"pre\"`, which is semantically backwards (PinPost is a post-phase ordering). It is guarded by `debug_assert!(false, ...)`, so debug builds abort if hit, but release builds silently return the wrong order. If a builtin plugin ever declared PinPost, JS-side ordering logic would be wrong.","fix":"Map `PinPost` to `\"post\"`, or return an explicit error/None instead of the misleading `\"pre\"`.","locations":[{"ref":"crates/rolldown_binding/src/options/plugin/binding_callable_builtin_plugin.rs:72-75","code":"   72 |           PluginOrder::PinPost => {\n   73 |             debug_assert!(false, \"PinPost order is not supported in BindingCallableBuiltinPlugin\");\n   74 |             \"pre\"\n   75 |           }","lines":4,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_binding/src/options/plugin/binding_callable_builtin_plugin.rs#L72-L75"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`BindingWatcher` accepts `Vec<BindingBundlerOptions>` (multiple builds) but derives the entire `WatcherConfig` (debounce, polling, poll interval, content comparison, etc.) solely from `configs.first()`. Watch options on configs[1..] are silently ignored, which is inconsistent with the Vec API and undocumented.","fix":"Document that only the first config's watch options apply, or merge/validate watch options across all configs and warn on conflict.","locations":[{"ref":"crates/rolldown_binding/src/watcher.rs:77-87","code":"   77 |     // Extract watcher config from the first config's watch options.\n   78 |     let watch = configs.first().and_then(|c| c.options.watch.as_ref());\n   79 |     let watcher_config = WatcherConfig {\n   80 |       debounce: watch.and_then(|w| w.build_delay).map(|ms| Duration::from_millis(u64::from(ms))),\n   81 |       use_polling: watch.is_some_and(|w| w.use_polling),\n   82 |       poll_interval: watch.and_then(|w| w.poll_interval),\n   83 |       compare_contents_for_polling: watch.is_some_and(|w| w.compare_contents_for_polling),\n   84 |       use_debounce: watch.is_some_and(|w| w.use_debounce),\n   85 |       debounce_delay: watch.and_then(|w| w.debounce_delay),\n   86 |       debounce_tick_rate: watch.and_then(|w| w.debounce_tick_rate),\n   87 |     };","lines":11,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_binding/src/watcher.rs#L77-L87"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`ChecksOptions -> EventKindSwitcher` starts from `EventKindSwitcher::all()` (all checks on) but sets\n`CircularDependency` from `unwrap_or(false)` while every other field uses `unwrap_or(true)`. So the circular-dependency\ncheck is OFF by default and inverted relative to all other checks. This asymmetry (likely intentional for noisy\nwarnings) is undocumented; if unintended it is a default-state bug. Note: generated file - the real fix is in the\ngenerator.","fix":"Confirm the intended default for `circular_dependency` in `tasks/generator/src/generators/checks.rs`; if it should default on like the others use `unwrap_or(true)`, otherwise document the asymmetry.","locations":[{"ref":"crates/rolldown_common/src/generated/checks_options.rs:43-47","code":"   43 |     flag.set(\n   44 |       rolldown_error::EventKindSwitcher::CircularDependency,\n   45 |       value.circular_dependency.unwrap_or(false),\n   46 |     );\n   47 |     flag.set(rolldown_error::EventKindSwitcher::Eval, value.eval.unwrap_or(true));","lines":5,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_common/src/generated/checks_options.rs#L43-L47"}]},
{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`property_read_side_effects`/`property_write_side_effects` accept the JSON string `\"false\"` but not the JSON boolean\n`false`, while rejecting everything else via a custom error. Rollup's API uses the boolean `false` here; passing the\nboolean hits the catch-all error arm. The \"Use string to make deserialization logic easier\" comment indicates a\nshortcut that diverges from the public boolean/`'always'` contract.","fix":"Also accept `Value::Bool(false)` -> `False` (and define behaviour for `true`) so both the boolean and string forms work, matching the public option shape.","locations":[{"ref":"crates/rolldown_common/src/inner_bundler_options/mod.rs:417-444","code":"  417 |       let property_read_side_effects = obj.get(\"propertyReadSideEffects\").map_or_else(\n  418 |         || Ok(None),\n  419 |         |v| match v {\n  420 |           Value::String(s) if s == \"always\" => {\n  421 |             Ok(Some(types::treeshake::PropertyReadSideEffects::Always))\n  422 |           }\n  423 |           Value::String(s) if s == \"false\" => {\n  424 |             Ok(Some(types::treeshake::PropertyReadSideEffects::False))\n  425 |           }\n  426 |           _ => {\n  427 |             Err(serde::de::Error::custom(\"propertyReadSideEffects should be 'false' or 'always'\"))\n  428 |           }\n  429 |         },\n  430 |       )?;\n  431 |       let property_write_side_effects = obj.get(\"propertyWriteSideEffects\").map_or_else(\n  432 |         || Ok(None),\n  433 |         |v| match v {\n  434 |           Value::String(s) if s == \"always\" => {\n  435 |             Ok(Some(types::treeshake::PropertyWriteSideEffects::Always))\n  436 |           }\n  437 |           Value::String(s) if s == \"false\" => {\n  438 |             Ok(Some(types::treeshake::PropertyWriteSideEffects::False))\n  439 |           }\n  440 |           _ => {\n  441 |             Err(serde::de::Error::custom(\"propertyWriteSideEffects should be 'false' or 'always'\"))\n  442 |           }\n  443 |         },\n  444 |       )?;","lines":28,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_common/src/inner_bundler_options/mod.rs#L417-L444"}]},
{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`StyledComponentsOptions::css_prop` and `top_level_import_paths` are documented as \"not yet implemented in oxc\" but\nare still forwarded unconditionally into `oxc::transformer::StyledComponentsOptions`, giving users the false\nimpression the features take effect when set.","fix":"Implement once oxc supports it, or explicitly warn/ignore these fields so users are not misled.","locations":[{"ref":"crates/rolldown_common/src/inner_bundler_options/types/transform_option/plugin_options.rs:49-54","code":"   49 |   /// Enables transformation of JSX `css` prop when using styled-components.\n   50 |   ///\n   51 |   /// **Note: This feature is not yet implemented in oxc.**\n   52 |   ///\n   53 |   /// @default true\n   54 |   pub css_prop: Option<bool>,","lines":6,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_common/src/inner_bundler_options/types/transform_option/plugin_options.rs#L49-L54"},{"ref":"crates/rolldown_common/src/inner_bundler_options/types/transform_option/plugin_options.rs:92-96","code":"   92 |       css_prop: options.css_prop.unwrap_or(ops.css_prop),\n   93 |       pure: options.pure.unwrap_or(ops.pure),\n   94 |       namespace: options.namespace,\n   95 |       meaningless_file_names: options.meaningless_file_names.unwrap_or(ops.meaningless_file_names),\n   96 |       top_level_import_paths: options.top_level_import_paths.unwrap_or(ops.top_level_import_paths),","lines":5,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_common/src/inner_bundler_options/types/transform_option/plugin_options.rs#L92-L96"}]},
{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `enhanced_transform`, after running `ReplaceGlobalDefines`, the scoping is only restored when the pass reported\nNO change: `if !ret.changed { scoping = Some(ret.scoping); }`. When defines DID change the AST, `ret.scoping`\n(still valid) is dropped and `scoping` stays `None`, forcing a full redundant `SemanticBuilder` rebuild a few lines\nlater. The condition reads inverted - the returned scoping is valid in both cases and could always be reused.","fix":"Always restore the returned scoping: `scoping = Some(ret.scoping);` (the pass returns an up-to-date scoping regardless of `changed`), avoiding the fallback rebuild at lines 389-391.","locations":[{"ref":"crates/rolldown_common/src/utils/enhanced_transform.rs:399-420","code":"  399 |         Ok(config) => {\n  400 |           let ret = ReplaceGlobalDefines::new(&allocator, config)\n  401 |             .build(scoping.take().unwrap(), &mut program);\n  402 |           if !ret.changed {\n  403 |             scoping = Some(ret.scoping);\n  404 |           }\n  405 |         }\n  406 |         Err(errs) => {\n  407 |           errors.extend(\n  408 |             errs\n  409 |               .into_iter()\n  410 |               .map(|err| BuildDiagnostic::invalid_define_config(err.message.to_string())),\n  411 |           );\n  412 |           return EnhancedTransformResult::new_for_error(errors, warnings, tsconfig_file_paths);\n  413 |         }\n  414 |       }\n  415 |     }\n  416 |   }\n  417 | \n  418 |   let scoping = scoping\n  419 |     .take()\n  420 |     .unwrap_or_else(|| semantic_builder_for_transform().build(&program).semantic.into_scoping());","lines":22,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_common/src/utils/enhanced_transform.rs#L399-L420"}]},
{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In both replacement loops, when the captured match is not found in the values\nmap the code does `else { break; }`, aborting the WHOLE iteration over the\nremaining matches rather than skipping just this one. With keys sorted\nlongest-first and a regex built from those keys, a non-match is not expected,\nbut the defensive branch should `continue` (skip this match) instead of\n`break` (stop processing all later matches in the file). As written, a single\nunexpected miss silently drops every subsequent replacement in the chunk.","fix":"Replace `break` with `continue` in both `else` arms.","locations":[{"ref":"crates/rolldown_plugin_replace/src/plugin.rs:115-117","code":"  115 |       let Some(replacement) = self.values.get(matched.as_str()) else {\n  116 |         break;\n  117 |       };","lines":3,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_plugin_replace/src/plugin.rs#L115-L117"},{"ref":"crates/rolldown_plugin_replace/src/plugin.rs:166-168","code":"  166 |       let Some(replacement) = self.values.get(&code[matched.clone()]) else {\n  167 |         break;\n  168 |       };","lines":3,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_plugin_replace/src/plugin.rs#L166-L168"}]},
{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`has_dynamic_import` after finding `import` not followed by `(` or `/` advances `i = j` (the position after trailing whitespace). Because `memchr::memmem::find` is then re-run on `&bytes[i..]`, overlapping later occurrences are still found, but when the word-boundary check fails it sets `i = abs_pos + 6` and continues - this can skip a following valid `import(` that begins inside the 6 bytes only in pathological cases. The loop bound `while i + 6 < bytes.len()` also excludes a buffer whose final 7 bytes are exactly `import(` at the very end is handled, but a file consisting solely of e.g. `a.import(x)` near the tail relies on the boundary advance being correct. Behaviour is correct for normal input; flagged as a fragile hand-rolled scanner worth a comment/test.","fix":"Add tests for `import(` at end-of-buffer and immediately after an identifier char, and document the boundary-advance invariant.","locations":[{"ref":"crates/rolldown_plugin_vite_dynamic_import_vars/src/utils.rs:21-56","code":"   21 | pub fn has_dynamic_import(code: &str) -> bool {\n   22 |   let bytes = code.as_bytes();\n   23 | \n   24 |   let mut i = 0;\n   25 |   while i + 6 < bytes.len() {\n   26 |     // Find \"import\"\n   27 |     if let Some(pos) = memchr::memmem::find(&bytes[i..], b\"import\") {\n   28 |       let abs_pos = i + pos;\n   29 | \n   30 |       // Check word boundary before \"import\"\n   31 |       if abs_pos > 0 {\n   32 |         let prev = bytes[abs_pos - 1];\n   33 |         if prev.is_ascii_alphanumeric() || prev == b'_' {\n   34 |           i = abs_pos + 6;\n   35 |           continue;\n   36 |         }\n   37 |       }\n   38 | \n   39 |       // Skip whitespace after \"import\"\n   40 |       let mut j = abs_pos + 6;\n   41 |       while j < bytes.len() && bytes[j].is_ascii_whitespace() {\n   42 |         j += 1;\n   43 |       }\n   44 | \n   45 |       // Check for '(' or '/' (slash covers comments between import and '(')\n   46 |       if j < bytes.len() && (bytes[j] == b'(' || bytes[j] == b'/') {\n   47 |         return true;\n   48 |       }\n   49 | \n   50 |       i = j;\n   51 |     } else {\n   52 |       break;\n   53 |     }\n   54 |   }\n   55 |   false\n   56 | }","lines":36,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_plugin_vite_dynamic_import_vars/src/utils.rs#L21-L56"}]},
{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`is_jsx` decides JSX eligibility by `id_without_query.ends_with('x')`. This matches `.jsx`/`.tsx`/`.mdx` but also matches any file whose path ends in the letter `x` (e.g. `foo.docx`, `bar.linux`, a file literally named `x`). Vite uses a precise extension regex (`/\\.([cm]?[jt]sx?|mdx)$/`). The over-broad check can mark unrelated modules as fast-refresh eligible; impact is limited because content-based guards follow, but it is still an incorrect, surprising heuristic.","fix":"Check for the actual JSX/TSX/MDX extensions (e.g. `.jsx`, `.tsx`, `.mdx`, with optional `c`/`m` prefixes) rather than a bare trailing `x`.","locations":[{"ref":"crates/rolldown_plugin_vite_react_refresh_wrapper/src/lib.rs:153-156","code":"  153 | fn is_jsx(id: &str) -> bool {\n  154 |   let id_without_query = id.split_once('?').map_or(id, |(id, _)| id);\n  155 |   id_without_query.ends_with('x')\n  156 | }","lines":4,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_plugin_vite_react_refresh_wrapper/src/lib.rs#L153-L156"}]},
{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`Resolver::try_rollup_compatibility_resolve` computes `importer_dir` from the importer's parent but\nthen ignores the importer's own absoluteness: it joins the specifier onto `self.cwd`\n(`self.cwd.join(specifier)`) and resolves that normalized absolute path against `importer_dir`. When\nan importer IS present and is not under cwd, the fallback resolves a cwd-relative path from a\ndifferent base directory, which can produce surprising results. The doc comment only describes the\nno-importer entry case; the importer-present branch's behavior is undocumented and arguably\ninconsistent with the stated Rollup compatibility intent.","fix":"Either resolve the specifier relative to `importer_dir` (not cwd) when an importer is present, or document why cwd-join is intended in that branch.","locations":[{"ref":"crates/rolldown_resolver/src/resolver.rs:211-232","code":"  211 |   fn try_rollup_compatibility_resolve(\n  212 |     &self,\n  213 |     resolver: &ResolverGeneric<Fs>,\n  214 |     importer: Option<&Path>,\n  215 |     specifier: &str,\n  216 |     original_resolution: Result<Resolution, ResolveError>,\n  217 |   ) -> Result<Resolution, ResolveError> {\n  218 |     if specifier.starts_with('.') || specifier.starts_with('/') {\n  219 |       return original_resolution;\n  220 |     }\n  221 | \n  222 |     let importer_dir = importer\n  223 |       .and_then(|importer_path| importer_path.parent())\n  224 |       .and_then(|parent_dir| parent_dir.components().next().is_some().then_some(parent_dir))\n  225 |       .unwrap_or(self.cwd.as_path());\n  226 | \n  227 |     // Try resolving relative to cwd as a fallback\n  228 |     let joined = self.cwd.join(specifier);\n  229 |     let specifier_path = joined.normalize();\n  230 |     let fallback = resolver.resolve(importer_dir, &specifier_path.to_string_lossy());\n  231 |     if fallback.is_ok() { fallback } else { original_resolution }\n  232 |   }","lines":22,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_resolver/src/resolver.rs#L211-L232"}]},
{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`BitSet::union` indexes `self.entries[i]` for every byte of `other` with no length check, panicking with index-out-of-bounds when `other` is longer than `self`. The sibling `intersect` explicitly handles a size mismatch, making the asymmetry surprising. Since `IndexBitSet::default()` yields a zero-length BitSet and `union` is used across the codebase, unioning a longer/sized set into an empty one panics rather than behaving as a set union.","fix":"Grow `self.entries` to `max(self.len(), other.len())` (resize with 0) before OR-ing, or zip the shorter side and extend with the remainder of `other`.","locations":[{"ref":"crates/rolldown_utils/src/bitset.rs:51-64","code":"   51 |   pub fn union(&mut self, other: &Self) {\n   52 |     for (i, &e) in other.entries.iter().enumerate() {\n   53 |       self.entries[i] |= e;\n   54 |     }\n   55 |   }\n   56 | \n   57 |   pub fn intersect(&mut self, other: &Self) {\n   58 |     for (left, right) in self.entries.iter_mut().zip(&other.entries) {\n   59 |       *left &= right;\n   60 |     }\n   61 |     if self.entries.len() > other.entries.len() {\n   62 |       self.entries[other.entries.len()..].fill(0);\n   63 |     }\n   64 |   }","lines":14,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_utils/src/bitset.rs#L51-L64"}]},
{"id":"LOGIC_34","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`is_data_url` trims leading whitespace (`s.trim_start().starts_with(\"data:\")`) but `parse_data_url` begins with a bare `tag(\"data:\")` and does not skip leading whitespace. A specifier with leading whitespace passes the `is_data_url` gate yet `parse_data_url` returns `None`, an inconsistent contract between the two functions that can make data-URL loading bail out as \"not a data URL\" for inputs `is_data_url` accepted.","fix":"Make the two agree: either have `is_data_url` not trim, or have the parser skip leading whitespace before `tag(\"data:\")`.","locations":[{"ref":"crates/rolldown_utils/src/dataurl.rs:12-14","code":"   12 | pub fn is_data_url(s: &str) -> bool {\n   13 |   s.trim_start().starts_with(\"data:\")\n   14 | }","lines":3,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_utils/src/dataurl.rs#L12-L14"},{"ref":"crates/rolldown_utils/src/dataurl.rs:22-52","code":"   22 | #[inline]\n   23 | // Parse the data URL with a more flexible approach\n   24 | fn parse_data_url_nom(input: &str) -> IResult<&str, ParsedDataUrl<'_>> {\n   25 |   // Start with \"data:\" prefix\n   26 |   let (input, _) = tag(\"data:\")(input)?;\n   27 | \n   28 |   // Parse the MIME type\n   29 |   let (input, mime) = recognize(take_till(|c| c == ';' || c == ',')).parse(input)?;\n   30 | \n   31 |   // Handle the case where there's no charset or base64 marker\n   32 |   if let Ok((remaining, data)) =\n   33 |     preceded(char::<_, Error<_>>(','), take_while(|_| true)).parse(input)\n   34 |   {\n   35 |     return Ok((\n   36 |       remaining,\n   37 |       ParsedDataUrl { mime: mime.trim(), is_base64: false, data: data.trim() },\n   38 |     ));\n   39 |   }\n   40 | \n   41 |   // Parse optional charset\n   42 |   let (input, _) =\n   43 |     opt(preceded(tag(\";charset=\"), take_till(|c| c == ';' || c == ','))).parse(input)?;\n   44 | \n   45 |   // Check for base64 encoding\n   46 |   let (input, is_base64) = map(opt(tag(\";base64\")), |opt_tag| opt_tag.is_some()).parse(input)?;\n   47 | \n   48 |   // Parse the data part after the comma\n   49 |   let (remaining, data) = preceded(char(','), take_while(|_| true)).parse(input)?;\n   50 | \n   51 |   Ok((remaining, ParsedDataUrl { mime: mime.trim(), is_base64, data: data.trim() }))\n   52 | }","lines":31,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_utils/src/dataurl.rs#L22-L52"}]},
{"id":"LOGIC_35","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`encode_as_percent_escaped` / the percent-escaping path collects the whole input into a `Vec<char>` solely for `chars[i+1]`/`chars[i+2]` lookahead when detecting an existing `%XY` escape. The lookahead only needs the next two ASCII bytes, so the Vec<char> materialization is an unnecessary heap allocation on every percent-escape (a hot data-URL/asset path).","fix":"Iterate `text.char_indices()` and inspect `text.as_bytes().get(i + 1)` / `get(i + 2)` for hex-digit lookahead instead of building `chars: Vec<char>`.","locations":[{"ref":"crates/rolldown_utils/src/percent_encoding.rs:9-33","code":"    9 |       let mut url = String::with_capacity(text.len() * 3);\n   10 |       let chars = text.chars().collect::<Vec<_>>();\n   11 |       let mut trailing_start = chars.len();\n   12 |       while trailing_start > 0 {\n   13 |         let c = chars[trailing_start - 1];\n   14 |         if c > 0x20 as char || matches!(c, '\\t' | '\\n' | '\\r') {\n   15 |           break;\n   16 |         }\n   17 |         trailing_start -= 1;\n   18 |       }\n   19 |       for (i, &c) in chars.iter().enumerate() {\n   20 |         if matches!(c, '\\t' | '\\n' | '\\r' | '#')\n   21 |           || i >= trailing_start\n   22 |           || (c == '%'\n   23 |             && i + 2 < chars.len()\n   24 |             && chars[i + 1].is_ascii_hexdigit()\n   25 |             && chars[i + 2].is_ascii_hexdigit())\n   26 |         {\n   27 |           url.push('%');\n   28 |           url.push(HEX[c as usize >> 4]);\n   29 |           url.push(HEX[c as usize & 15]);\n   30 |         } else {\n   31 |           url.push(c);\n   32 |         }\n   33 |       }","lines":25,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_utils/src/percent_encoding.rs#L9-L33"}]},
{"id":"LOGIC_36","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`slice` computes `slice_end = content.len() - (chunk.end() - end)` for the end chunk. This is only correct because line 57 errors out when an edited chunk contains the end with `chunk.end() != end`. The arithmetic mixes original-source byte distance (`chunk.end() - end`) with `content.len()` (possibly edited content length); the safety relies entirely on that guard. It is currently correct but fragile, and `slice_start`/`slice_end` can land on non-char boundaries if `start`/`end` are mid-codepoint, panicking at the `&content[slice_start..slice_end]` slice.","fix":"Add a char-boundary check on `start`/`end` (or document the precondition) and assert the edited-chunk invariant explicitly; consider computing `slice_end` only for the unedited branch.","locations":[{"ref":"crates/string_wizard/src/magic_string/slice.rs:55-79","code":"   55 |       let contains_end = chunk.start() < end && chunk.end() >= end;\n   56 | \n   57 |       if contains_end && chunk.edited_content.is_some() && chunk.end() != end {\n   58 |         return Err(format!(\"Cannot use replaced character {} as slice end anchor.\", end));\n   59 |       }\n   60 | \n   61 |       let slice_start = if idx == start_chunk_idx { (start - chunk.start()) as usize } else { 0 };\n   62 | \n   63 |       let content = if let Some(ref edited) = chunk.edited_content {\n   64 |         edited.as_ref()\n   65 |       } else {\n   66 |         chunk.span.text(&self.source)\n   67 |       };\n   68 | \n   69 |       let slice_end = if contains_end {\n   70 |         // end <= chunk.end() when contains_end is true, so we subtract\n   71 |         content.len() - (chunk.end() - end) as usize\n   72 |       } else {\n   73 |         content.len()\n   74 |       };\n   75 | \n   76 |       // Guard against reversed range within a single chunk (matches JS .slice() behavior\n   77 |       // which returns \"\" for reversed ranges instead of panicking).\n   78 |       if slice_start < slice_end {\n   79 |         result.push_str(&content[slice_start..slice_end]);","lines":25,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/string_wizard/src/magic_string/slice.rs#L55-L79"}]},
{"id":"LOGIC_37","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"medium","description":"`comments` normalization in `prepare_build_context` only lets `legalComments` override\n`comments.legal` when `raw_options.comments.is_none()`. It first builds `comments` from\n`unwrap_or_default()` and then conditionally overrides. The intent (legalComments overrides only\nwhen comments is unset) is correct, but `raw_options.comments` is checked twice (once via\n`unwrap_or_default`, once via `is_none`), and the `comments` local is computed even on the path\nwhere it is fully defaulted, making the precedence rule easy to break in future edits.","fix":"Restructure as a single `match raw_options.comments { Some(c) => c, None => { let mut c =\nCommentsOptions::default(); if let Some(legal) = raw_options.legal_comments { c.legal =\nmatches!(legal, LegalComments::Inline); } c } }` to make the precedence explicit.","locations":[{"ref":"crates/rolldown/src/utils/prepare_build_context.rs:439-448","code":"  439 |     comments: {\n  440 |       let mut comments = raw_options.comments.unwrap_or_default();\n  441 |       // When `comments` option is not explicitly set, `legalComments` can override `comments.legal`\n  442 |       if raw_options.comments.is_none() {\n  443 |         if let Some(legal) = raw_options.legal_comments {\n  444 |           comments.legal = matches!(legal, LegalComments::Inline);\n  445 |         }\n  446 |       }\n  447 |       comments\n  448 |     },","lines":10,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/utils/prepare_build_context.rs#L439-L448"}]},
{"id":"LOGIC_38","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"Default session id string is inconsistent: `DEFAULT_SESSION_ID` is `\"unknown-session\"` (hyphen) while `Session::dummy()` uses `\"unknown_session\"` (underscore). Events without a session context are written under the `unknown-session` directory, but a dummy session advertises a different id, which is confusing if either is ever matched/compared.","fix":"Use the single `DEFAULT_SESSION_ID` constant in `Session::dummy()` instead of a separate literal.","locations":[{"ref":"crates/rolldown_devtools/src/static_data.rs:1","code":"    1 | pub static DEFAULT_SESSION_ID: &str = \"unknown-session\";","lines":1,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_devtools/src/static_data.rs#L1"},{"ref":"crates/rolldown_devtools/src/init_tracing.rs:74-75","code":"   74 |     let session_id = Arc::from(\"unknown_session\");\n   75 |     Self { id: session_id, span: tracing::Span::none() }","lines":2,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_devtools/src/init_tracing.rs#L74-L75"}]},
{"id":"LOGIC_39","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"medium","description":"Inconsistent lazy-suffix matching in LazyCompilationPlugin. The load hook gates on `args.id.contains(\"rolldown-lazy=1\")` (line 142, missing the leading `?`), while resolve_id (line 92) and transform_ast (line 187) use `contains(\"?rolldown-lazy=1\")` and the split on line 145 uses `\"?rolldown-lazy=1\"`. The looser substring on line 142 could match an id that merely contains `rolldown-lazy=1` as part of an unrelated query value, and is inconsistent with the rest of the file.","fix":"Use the same `\"?rolldown-lazy=1\"` (or end-of-id) check consistently across resolve_id, load, and transform_ast.","locations":[{"ref":"crates/rolldown_plugin_lazy_compilation/src/lazy_compilation_plugin.rs:151-154","code":"  151 |     if args.id.contains(\"rolldown-lazy=1\") {\n  152 |       if self.lazy_entries.contains(args.id) {\n  153 |         // Extract original ID without the query string (this is the absolute path)\n  154 |         let original_id = args.id.split(\"?rolldown-lazy=1\").next().unwrap_or(args.id);","lines":4,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_plugin_lazy_compilation/src/lazy_compilation_plugin.rs#L151-L154"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`MemoryFileSystem::create_dir_all` is named after (and documented in the `FileSystem` trait as)\n`std::fs::create_dir_all`, which creates all missing parent directories. But it calls\n`self.fs.create_dir(...)`, the single-level, non-recursive vfs operation, which errors when an\nintermediate directory is missing. The crate's own test asserts that\n`create_dir_all(\"/module_2/utils\")` fails with `ErrorKind::Other` when `/module_2` does not exist,\nconfirming the method does NOT behave like `create_dir_all`. Callers relying on the documented\nrecursive semantics will get spurious failures on the memory FS.","fix":"Iterate `path.ancestors()` in reverse creating each missing component (as `add_file_bytes` already does), or otherwise emulate recursive creation.","locations":[{"ref":"crates/rolldown_fs/src/memory.rs:59-61","code":"   59 |   fn create_dir_all(&self, path: &Path) -> io::Result<()> {\n   60 |     self.fs.create_dir(&path.to_string_lossy()).map_err(io::Error::other)\n   61 |   }","lines":3,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_fs/src/memory.rs#L59-L61"},{"ref":"crates/rolldown_fs/src/file_system.rs:14-17","code":"   14 |   /// # Errors\n   15 |   ///\n   16 |   /// * See [std::fs::create_dir_all]\n   17 |   fn create_dir_all(&self, path: &Path) -> io::Result<()>;","lines":4,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_fs/src/file_system.rs#L14-L17"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"Comment typo in an `.expect()`: \"Module tasks did't complete as expected\" (\"did't\" should be\n\"didn't\"). Minor, but this string is what users see if the invariant is ever violated.","fix":"Fix the typo: \"Module tasks didn't complete as expected\".","locations":[{"ref":"crates/rolldown/src/module_loader/module_loader.rs:822","code":"  822 |         let mut module = module.expect(\"Module tasks did't complete as expected\");","lines":1,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/module_loader/module_loader.rs#L822"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`trace_action_assets_ready` uses `.try_into().unwrap()` when converting an asset's byte length (`usize`) to the `size` field. For a single asset larger than `u32::MAX` (4 GiB) this panics. Other size conversions in this slice (e.g. `package_info.size` in mod.rs uses `u32::try_from(...).unwrap_or(u32::MAX)`) defensively saturate; this one does not. Only reachable when devtools tracing is enabled, hence low severity.","fix":"Use `u32::try_from(asset.content.as_bytes().len()).unwrap_or(u32::MAX)` (saturating) to match the convention used elsewhere instead of `.unwrap()`.","locations":[{"ref":"crates/rolldown/src/stages/generate_stage/render_chunk_to_assets.rs:292-294","code":"  292 |           content: asset.content.try_as_inner_str().ok().map(str::to_string),\n  293 |           size: asset.content.as_bytes().len().try_into().unwrap(),\n  294 |           filename: asset.filename.to_string(),","lines":3,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/stages/generate_stage/render_chunk_to_assets.rs#L292-L294"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In `ScanStageCache::merge`, the `HybridIndexVec::IndexVec(_)` arm of the module_table match is\n`unreachable!()`. This is reached only in incremental/partial-scan merges, and the invariant that a\nmerge always carries the `Map` variant is enforced elsewhere; if a future change produces the\n`IndexVec` variant here the build panics with no context instead of a diagnostic.","fix":"Replace `unreachable!()` with a descriptive `unreachable!(\"...\")` message explaining the\ninvariant, or convert it into a `BuildResult` error to fail gracefully.","locations":[{"ref":"crates/rolldown/src/types/scan_stage_cache.rs:140-149","code":"  140 |     let modules = match scan_stage_output.module_table {\n  141 |       rolldown_common::HybridIndexVec::IndexVec(_index_vec) => {\n  142 |         unreachable!()\n  143 |       }\n  144 |       rolldown_common::HybridIndexVec::Map(map) => {\n  145 |         let mut modules = map.into_iter().collect_vec();\n  146 |         modules.sort_unstable_by_key(|(k, _)| *k);\n  147 |         modules\n  148 |       }\n  149 |     };","lines":10,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/types/scan_stage_cache.rs#L140-L149"}]},
