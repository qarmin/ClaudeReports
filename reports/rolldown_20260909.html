<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`trigger_full_build` is a `#[napi]`-exported method called from JS that does `self.inner.trigger_full_build().expect(\"Should handle this error\")`. Any engine error panics and aborts the Node process instead of surfacing a catchable JS error. The expect message itself admits the path is unhandled, and every sibling method correctly maps errors to `napi::Result`.","fix":"Make the method return `napi::Result<()>` and `.map_err(|e| napi::Error::from_reason(format!(\"Failed to trigger full build: {e:#?}\")))?`.","locations":[{"ref":"crates/rolldown_binding/src/binding_dev_engine.rs:236-239","code":"  236 |   #[napi]\n  237 |   pub fn trigger_full_build(&self) {\n  238 |     self.inner.trigger_full_build().expect(\"Should handle this error\");\n  239 |   }","lines":4,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_binding/src/binding_dev_engine.rs#L236-L239"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`register_hook_usage` calls `HookUsage::from_bits(self.inner.hook_usage).expect(\"Failed to register hook usage\")`. `hook_usage` is a `u32` supplied directly from JS (see BindingPluginOptions field). `from_bits` returns `None` for any value containing bits that don't correspond to a defined flag, so a malformed/out-of-range value from a JS plugin object aborts the entire Node process. This runs during bundler setup on every plugin.","fix":"Use `HookUsage::from_bits_truncate(self.inner.hook_usage)` (ignore unknown bits) or `from_bits_retain`; or validate at construction and return a `napi::Error`.","locations":[{"ref":"crates/rolldown_binding/src/options/plugin/js_plugin.rs:735-737","code":"  735 |   fn register_hook_usage(&self) -> HookUsage {\n  736 |     HookUsage::from_bits(self.inner.hook_usage).expect(\"Failed to register hook usage\")\n  737 |   }","lines":3,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_binding/src/options/plugin/js_plugin.rs#L735-L737"},{"ref":"crates/rolldown_binding/src/options/plugin/binding_plugin_options.rs:43","code":"   43 |   pub hook_usage: u32,","lines":1,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_binding/src/options/plugin/binding_plugin_options.rs#L43"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`ContextLoadCompletionManager::mark_completion` calls `sender.send(()).expect(...)` on a `tokio::sync::broadcast::Sender`. `broadcast::Sender::send` returns `Err` when there are no live receivers. The receiver (`rx`) is created in `wait_for_completion` and handed to the awaiting caller (`NativePluginContextImpl::load` -> `plugin_driver.wait_for_module_load_completion`). If that awaiting future is dropped/cancelled before the module finishes loading (task cancellation, build abort on another error, timeout, etc.), the only receiver is dropped while the map entry stays in `Pending`. A later `mark_completion` for that module then hits the `Pending` arm and panics. This is a reachable abort under normal cancellation, not just a programmer error.","fix":"Do not panic when the broadcast send fails: treat `Err` as 'no one is waiting' and still transition to `Completed` (e.g. `let _ = sender.send(());`), since a dropped receiver just means the waiter already went away.","locations":[{"ref":"crates/rolldown_plugin/src/plugin_driver/mod.rs:158-177","code":"  158 |   pub fn mark_completion(&self, module_id: ModuleId) {\n  159 |     match self.notifiers.entry(module_id) {\n  160 |       dashmap::Entry::Vacant(guard) => {\n  161 |         guard.insert(ContextLoadCompletionState::Completed);\n  162 |       }\n  163 |       dashmap::Entry::Occupied(mut guard) => match guard.get_mut() {\n  164 |         ContextLoadCompletionState::Pending(sender) => {\n  165 |           sender.send(()).expect(\n  166 |             \"PluginDriver: failed to send completion notification - receiver was dropped before wait_for_completion was called, indicating a race condition in module loading\"\n  167 |           );\n  168 |           *guard.get_mut() = ContextLoadCompletionState::Completed;\n  169 |         }\n  170 |         ContextLoadCompletionState::Completed => {\n  171 |           // This happens if `.mark_completion` is called multiple times, which is not expected\n  172 |           debug_assert!(false, \"mark_completion was called even though it was already completed\");\n  173 |           tracing::warn!(\"mark_completion was called even though it was already completed\");\n  174 |         }\n  175 |       },\n  176 |     }\n  177 |   }","lines":20,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_plugin/src/plugin_driver/mod.rs#L158-L177"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`write_line` truncates a message to the terminal width using a byte slice `&message[..width]`. `width` is the terminal column count, but `message` is sliced by byte index, so when the message contains a multi-byte UTF-8 character (e.g. a non-ASCII path produced by `Path::relative(...).to_string_lossy()` in the reporter's `transform` hook) the slice can land in the middle of a code point and panic. Additionally the message contains ANSI escape sequences (from `utils::paint`), so `message.len()` and the slice index are measured in bytes including escape codes rather than display columns - cutting mid-escape-sequence corrupts the terminal even when no panic occurs.","fix":"Truncate on a character boundary (e.g. iterate `char_indices()` to find a valid byte offset at or below `width`), and ideally compute display width excluding ANSI escape codes rather than using `message.len()`.","locations":[{"ref":"crates/rolldown_plugin_vite_reporter/src/utils.rs:94-104","code":"   94 | #[inline]\n   95 | pub fn write_line(message: &str) {\n   96 |   let mut lock = clear_line();\n   97 | \n   98 |   let message = terminal_size::terminal_size()\n   99 |     .map(|(width, _)| width.0 as usize)\n  100 |     .map_or(message, |width| if message.len() < width { message } else { &message[..width] });\n  101 | \n  102 |   let _ = write!(&mut lock, \"{message}\");\n  103 |   let _ = lock.flush();\n  104 | }","lines":11,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_plugin_vite_reporter/src/utils.rs#L94-L104"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`resolve_bare_import` calls `oxc_resolved_result.unwrap()` on a `Result` that\ncan be `Err`. `resolved` being `Some` does NOT imply `Ok`:\n`normalize_oxc_resolver_result` returns `Ok(Some(..))` for the\n`ResolveError::Ignored` case (id = BROWSER_EXTERNAL_ID, no extension) and the\noptional-peer-dep case, where the underlying result is `Err`. With\n`external == true`, `can_externalize_file(BROWSER_EXTERNAL_ID)` returns true\n(empty extension), so execution reaches the `is_deep_import(id) && ext differs`\nbranch and `oxc_resolved_result.unwrap()` panics on the `Err`.","fix":"Match on `&oxc_resolved_result` instead of unwrapping, e.g.\n`&& let Ok(res) = &oxc_resolved_result && let Some(pkg_json) = res.package_json()`.","locations":[{"ref":"crates/rolldown_plugin_vite_resolve/src/resolver.rs:525-544","code":"  525 |     if let Some(mut resolved) = resolved {\n  526 |       if !external || !can_externalize_file(&resolved.id) {\n  527 |         return Ok(Some(resolved));\n  528 |       }\n  529 | \n  530 |       let id = specifier;\n  531 |       let mut resolved_id = id;\n  532 |       if is_deep_import(id)\n  533 |         && get_extension(id) != get_extension(&resolved.id)\n  534 |         && let Some(pkg_json) = oxc_resolved_result.unwrap().package_json()\n  535 |       {\n  536 |         let has_exports_field = pkg_json.exports().is_some();\n  537 |         if !has_exports_field {\n  538 |           // id date-fns/locale\n  539 |           // resolve.id ...date-fns/esm/locale/index.js\n  540 |           if let Some(index) = resolved.id.find(id) {\n  541 |             resolved_id = &resolved.id[index..];\n  542 |           }\n  543 |         }\n  544 |       }","lines":20,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_plugin_vite_resolve/src/resolver.rs#L525-L544"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`finalized_string_pattern_for_symbol_ref` indexes `exporter_chunk.exports_to_other_chunks[&canonical_ref][0]`\ndirectly. Both the `HashMap` index (`[&canonical_ref]`) and the slice index (`[0]`) panic if the\ncanonical_ref is not an export of that chunk or its alias list is empty. This is in the CJS\ncross-chunk binding path; if the cross-chunk link bookkeeping and the rendered exports ever\ndisagree, this produces an index-out-of-bounds panic during code generation rather than a\ndiagnostic.","fix":"Use `.get(&canonical_ref).and_then(|aliases| aliases.first())` and emit a build error (or\n`debug_assert` with context) on the `None` case instead of relying on the index never being out of\nrange.","locations":[{"ref":"crates/rolldown/src/types/generator.rs:113-115","code":"  113 |           let exporter_chunk = &self.chunk_graph.chunk_table[chunk_idx_of_canonical_symbol];\n  114 |           let exported_name = &exporter_chunk.exports_to_other_chunks[&canonical_ref][0];\n  115 |           if exported_name == \"default\" {","lines":3,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/types/generator.rs#L113-L115"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`take_plugin_values` does `PLUGINS_MAP.remove(&self.id).expect(\"plugin list already taken\")`. The same id is also removed by `ObjectFinalize::finalize` when the JS registry object is GC'd. If finalization runs before/around `take_plugin_values`, the entry is gone and the `expect` aborts the Node process. The two removal paths race on the same key with no coordination.","fix":"Handle the missing entry gracefully: `let Some((_, plugins_list)) = PLUGINS_MAP.remove(&self.id) else { return PluginValues::default(); };`.","locations":[{"ref":"crates/rolldown_binding/src/parallel_js_plugin_registry.rs:42-43","code":"   42 |   pub fn take_plugin_values(&self) -> PluginValues {\n   43 |     let plugins_list = PLUGINS_MAP.remove(&self.id).expect(\"plugin list already taken\").1;","lines":2,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_binding/src/parallel_js_plugin_registry.rs#L42-L43"},{"ref":"crates/rolldown_binding/src/parallel_js_plugin_registry.rs:57-62","code":"   57 | impl ObjectFinalize for ParallelJsPluginRegistry {\n   58 |   fn finalize(self, mut _env: Env) -> napi::Result<()> {\n   59 |     PLUGINS_MAP.remove(&self.id);\n   60 |     Ok(())\n   61 |   }\n   62 | }","lines":6,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_binding/src/parallel_js_plugin_registry.rs#L57-L62"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`take_plugin_values` indexes `plugins_list[0]` to size a map. `PLUGINS_MAP` is initialized with an empty `vec![]` in the constructor (line 37) and only grows when `register_plugins` is called. If a registry is created but no worker ever registered plugins (e.g. zero plugins, or a worker race), `plugins_list` is empty and `plugins_list[0]` is an out-of-bounds index that panics and aborts Node.","fix":"Use `let cap = plugins_list.first().map_or(0, Vec::len);` and build the map from that; the loop handles the empty case naturally.","locations":[{"ref":"crates/rolldown_binding/src/parallel_js_plugin_registry.rs:42-54","code":"   42 |   pub fn take_plugin_values(&self) -> PluginValues {\n   43 |     let plugins_list = PLUGINS_MAP.remove(&self.id).expect(\"plugin list already taken\").1;\n   44 | \n   45 |     let mut map: FxHashMap<usize, Vec<BindingPluginOptions>> =\n   46 |       FxHashMap::with_capacity(plugins_list[0].len());\n   47 |     for plugins in plugins_list {\n   48 |       for plugin in plugins {\n   49 |         map.entry(plugin.index as usize).or_default().push(plugin.plugin);\n   50 |       }\n   51 |     }\n   52 | \n   53 |     map\n   54 |   }","lines":13,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_binding/src/parallel_js_plugin_registry.rs#L42-L54"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`enhanced_transform_internal` does `std::env::current_dir().expect(\"Failed to get current dir\")` when `options.cwd` is None. `current_dir()` can fail (cwd deleted, permissions). This runs inside the napi transform path so a failure aborts the Node process. The function already returns `napi::Result`, so the error is trivially propagatable.","fix":"Replace the `expect` with error propagation: `std::env::current_dir().map_err(|e| napi::Error::from_reason(format!(\"Failed to get current dir: {e}\")))?`.","locations":[{"ref":"crates/rolldown_binding/src/transform.rs:50-54","code":"   50 |   let cwd = options\n   51 |     .cwd\n   52 |     .clone()\n   53 |     .map(PathBuf::from)\n   54 |     .unwrap_or_else(|| std::env::current_dir().expect(\"Failed to get current dir\"));","lines":5,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_binding/src/transform.rs#L50-L54"}]},
{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"Several `#[napi]`-exposed `BindingWatcherEvent` accessors call `unreachable!()` when the event variant doesn't match (e.g. calling `bundleEndData()` on a `change` event). These are directly callable from JS; the official watcher.ts guards them, but any out-of-order or third-party JS call triggers a Rust panic that aborts the Node process instead of throwing a catchable error.","fix":"Return `napi::Result<...>` from these methods and replace `unreachable!(...)` with `return Err(napi::Error::from_reason(...))`.","locations":[{"ref":"crates/rolldown_binding/src/types/binding_watcher_event.rs:55-98","code":"   55 |   #[napi]\n   56 |   pub fn bundle_event_kind(&self) -> &str {\n   57 |     match &self.inner {\n   58 |       WatcherEventInner::BundleEvent(event) => event.as_str(),\n   59 |       _ => unreachable!(\"Expected BundleEvent\"),\n   60 |     }\n   61 |   }\n   62 | \n   63 |   #[napi]\n   64 |   pub fn bundle_end_data(&self) -> BindingBundleEndEventData {\n   65 |     match &self.inner {\n   66 |       WatcherEventInner::BundleEvent(WatchEvent::BundleEnd(data)) => BindingBundleEndEventData {\n   67 |         output: data.output.clone(),\n   68 |         duration: data.duration,\n   69 |         result: data.bundle_handle.clone(),\n   70 |       },\n   71 |       _ => unreachable!(\"Expected BundleEvent::BundleEnd\"),\n   72 |     }\n   73 |   }\n   74 | \n   75 |   #[napi]\n   76 |   pub fn bundle_error_data(&self) -> BindingBundleErrorEventData {\n   77 |     match &self.inner {\n   78 |       WatcherEventInner::BundleEvent(WatchEvent::Error(data)) => BindingBundleErrorEventData {\n   79 |         error: data\n   80 |           .diagnostics\n   81 |           .iter()\n   82 |           .map(|diagnostic| to_binding_error(diagnostic, data.cwd.clone()))\n   83 |           .collect(),\n   84 |         result: data.bundle_handle.clone(),\n   85 |       },\n   86 |       _ => unreachable!(\"Expected BundleEvent::Error\"),\n   87 |     }\n   88 |   }\n   89 | \n   90 |   #[napi]\n   91 |   pub fn watch_change_data(&self) -> BindingWatcherChangeData {\n   92 |     match &self.inner {\n   93 |       WatcherEventInner::Change { path, kind } => {\n   94 |         BindingWatcherChangeData { path: path.clone(), kind: kind.clone() }\n   95 |       }\n   96 |       _ => unreachable!(\"Expected Change event\"),\n   97 |     }\n   98 |   }","lines":44,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_binding/src/types/binding_watcher_event.rs#L55-L98"}]},
{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`WorkerManager::acquire` and `acquire_all` do `self.free_workers_receiver.recv().await.unwrap()`. `async_channel::recv` returns `Err(RecvError)` once all senders are dropped and the channel is empty. Under normal flow this is unlikely, but any path that drops the senders turns a recoverable condition into a process-aborting panic across the FFI boundary.","fix":"Propagate the error (return `Result`) or document/justify the invariant; do not `unwrap` on channel recv reachable from JS-driven bundling.","locations":[{"ref":"crates/rolldown_binding/src/worker_manager.rs:26-30","code":"   26 |   pub async fn acquire(&self) -> WorkerSemaphorePermit {\n   27 |     let worker_index = self.free_workers_receiver.recv().await.unwrap();\n   28 | \n   29 |     WorkerSemaphorePermit { worker_index, sender: self.free_workers_sender.clone() }\n   30 |   }","lines":5,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_binding/src/worker_manager.rs#L26-L30"},{"ref":"crates/rolldown_binding/src/worker_manager.rs:32-41","code":"   32 |   pub async fn acquire_all(&self) -> WorkerAllSemaphorePermit {\n   33 |     for _ in 0..self.worker_count {\n   34 |       self.free_workers_receiver.recv().await.unwrap();\n   35 |     }\n   36 | \n   37 |     WorkerAllSemaphorePermit {\n   38 |       worker_count: self.worker_count,\n   39 |       sender: self.free_workers_sender.clone(),\n   40 |     }\n   41 |   }","lines":10,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_binding/src/worker_manager.rs#L32-L41"}]},
{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"Deserializing `manualPureFunctions` calls `item.as_str().expect(\"manualPureFunctions should be a `Vec<String>`\")`.\nA non-string array element (e.g. `manualPureFunctions: [1]`) panics/aborts the bundler on user-controlled config\ninstead of returning a clean serde deserialization error. Every other field in this function reports errors via\n`serde::de::Error::custom`; this one is the outlier.","fix":"Replace the `expect` with a fallible map collected into `Result<FxHashSet<_>, _>`: `item.as_str().map(str::to_string).ok_or_else(|| serde::de::Error::custom(\"manualPureFunctions should be a Vec<String>\"))`.","locations":[{"ref":"crates/rolldown_common/src/inner_bundler_options/mod.rs:406-414","code":"  406 |           Value::Array(v) => Ok(\n  407 |             v.iter()\n  408 |               .map(|item| {\n  409 |                 item.as_str().expect(\"manualPureFunctions should be a `Vec<String>`\").to_string()\n  410 |               })\n  411 |               .collect::<FxHashSet<_>>(),\n  412 |           ),\n  413 |           _ => Err(serde::de::Error::custom(\"manualPureFunctions should be a `Vec<String>`\")),\n  414 |         },","lines":9,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_common/src/inner_bundler_options/mod.rs#L406-L414"}]},
{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`EsModuleFlag::from(String)` calls `unreachable!()` for any string other than `\"if-default-prop\"`, aborting the\nprocess on unexpected input rather than returning an error. It also cannot parse the serialized forms of the other\nvariants (`\"always\"`/`\"never\"`), so it is not a true inverse of the public string representation.","fix":"Make conversion fallible (`TryFrom` returning an error) or match all known strings (\"always\" => Always, \"never\" => Never, \"if-default-prop\" => IfDefaultProp) with a proper error for the unknown case.","locations":[{"ref":"crates/rolldown_common/src/inner_bundler_options/types/es_module_flag.rs:62-70","code":"   62 | impl From<String> for EsModuleFlag {\n   63 |   fn from(value: String) -> Self {\n   64 |     if value == \"if-default-prop\" {\n   65 |       Self::IfDefaultProp\n   66 |     } else {\n   67 |       unreachable!(\"unknown es module type\")\n   68 |     }\n   69 |   }\n   70 | }","lines":9,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_common/src/inner_bundler_options/types/es_module_flag.rs#L62-L70"}]},
{"id":"PANIC_14","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`BundlingTask::run_inner` passes the changed file path to the `watch_change` plugin hook via\n`changed_file.to_str().unwrap()`. `Path::to_str` returns `None` for paths that are not valid\nUTF-8, which is possible on Linux/macOS where filenames are arbitrary bytes. A non-UTF-8 path\nemitted by the watcher would panic the bundling task (the same paths are handled losslessly via\n`to_string_lossy` elsewhere in this file, e.g. `generate_hmr_updates` and `rebuild`).","fix":"Use `changed_file.to_string_lossy()` (as the rest of the file does) instead of `to_str().unwrap()`.","locations":[{"ref":"crates/rolldown_dev/src/bundling_task.rs:108-113","code":"  108 |       for (changed_file, event) in self.input.changed_files() {\n  109 |         if let Some(plugin_driver) =\n  110 |           bundler.last_bundle_handle.as_ref().map(rolldown::BundleHandle::plugin_driver)\n  111 |         {\n  112 |           if let Err(err) = plugin_driver.watch_change(changed_file.to_str().unwrap(), *event).await\n  113 |           {","lines":6,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_dev/src/bundling_task.rs#L108-L113"}]},
{"id":"PANIC_15","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`args.id.as_path().parent().unwrap()` panics if the transformed module id has no parent path component. This branch is reached when a file contains a bare (non-relative, non-absolute) variable dynamic import and a `resolver` is configured. A virtual or single-segment module id (no `/`) yields `None` from `parent()` and aborts the build with a panic instead of a graceful error/warning.","fix":"Use `args.id.as_path().parent().unwrap_or(ctx.cwd())` (or fall back to the configured root) instead of `unwrap()`.","locations":[{"ref":"crates/rolldown_plugin_vite_dynamic_import_vars/src/lib.rs:100","code":"  100 |         let importer = args.id.as_path().parent().unwrap();","lines":1,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_plugin_vite_dynamic_import_vars/src/lib.rs#L100"}]},
{"id":"PANIC_16","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`split_at` only guards `at_index == 0` and `at_index >= source.len()`; it never checks that `at_index` lies on a UTF-8 char boundary. A mid-codepoint index produces `Span(start, at_index)` / `Span(at_index, end)` whose `.text()` later does `&source[start..end]`, which panics (\"byte index is not a char boundary\"). Reachable from public `update`/`remove`/`relocate`/`reset` if a caller passes a byte offset inside a multibyte character. Only a `debug_assert!(is_char_boundary)` exists, and only in indent.rs, not in `split`/`Span::text`.","fix":"In `split_at` (or the public entry points) return an `Err` when `!source.is_char_boundary(at_index as usize)` instead of slicing on a non-boundary.","locations":[{"ref":"crates/string_wizard/src/magic_string/mod.rs:320-326","code":"  320 |   fn split_at(&mut self, at_index: u32) -> Result<(), String> {\n  321 |     if at_index == 0\n  322 |       || (at_index as usize) >= self.source.len()\n  323 |       || self.chunk_by_end.contains_key(&at_index)\n  324 |     {\n  325 |       return Ok(());\n  326 |     }","lines":7,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/string_wizard/src/magic_string/mod.rs#L320-L326"},{"ref":"crates/string_wizard/src/span.rs:13-15","code":"   13 |   pub fn text<'s>(&self, source: &'s str) -> &'s str {\n   14 |     &source[self.start() as usize..self.end() as usize]\n   15 |   }","lines":3,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/string_wizard/src/span.rs#L13-L15"},{"ref":"crates/string_wizard/src/chunk.rs:68-84","code":"   68 |   pub fn split<'a>(&'a mut self, text_index: u32) -> Result<Chunk<'str>, String> {\n   69 |     if let Some(ref content) = self.edited_content\n   70 |       && !content.is_empty()\n   71 |     {\n   72 |       return Err(\"Cannot split a chunk that has already been edited\".to_string());\n   73 |     }\n   74 |     let first_half_slice = Span(self.start(), text_index);\n   75 |     let second_half_slice = Span(text_index, self.end());\n   76 |     let mut new_chunk = Chunk::new(second_half_slice);\n   77 |     if self.is_edited() {\n   78 |       new_chunk\n   79 |         .edit(\"\".into(), EditOptions { store_name: self.keep_in_mappings, overwrite: false });\n   80 |     }\n   81 |     std::mem::swap(&mut new_chunk.outro, &mut self.outro);\n   82 |     self.span = first_half_slice;\n   83 |     Ok(new_chunk)\n   84 |   }","lines":17,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/string_wizard/src/chunk.rs#L68-L84"}]},
{"id":"PANIC_17","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`update_dynamic_import_binding_usage_info` uses `.expect(\"should have symbol id\")` on the\nresolved reference's `symbol_id()`. The reference id is only present here because the binding\nwas previously recorded as a dynamic-import binding reference, but a write reference or an\nunresolved reference id (e.g. due to shadowing or an oxc quirk) would yield `None` and panic\nduring scanning of otherwise valid user code.","fix":"Replace `.expect(...)` with `?` (early-return `None`) so an unexpected missing symbol id silently disables the optimization instead of aborting the build.","locations":[{"ref":"crates/rolldown/src/ast_scanner/dynamic_import.rs:24-29","code":"   24 |     let reference = self.result.symbol_ref_db.scoping().get_reference(ident.reference_id());\n   25 | \n   26 |     // panic because if program reached here, means the BindingIdentifier has referenced the\n   27 |     // IdentifierReference, but IdentifierReference did not saved the related `SymbolId`\n   28 |     // Something wrong with semantic analyze\n   29 |     let symbol_id = reference.symbol_id().expect(\"should have symbol id\");","lines":6,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/ast_scanner/dynamic_import.rs#L24-L29"}]},
{"id":"PANIC_18","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`unreachable!()` on a non-`BindingIdentifier` object-pattern rest argument. While\n`...rest` in a binding context is normally followed by an identifier, relying on\n`unreachable!()` for an AST-shape invariant is fragile: if oxc ever parses a more permissive\nrest target (or a recovered/invalid AST is passed in), this panics during scanning.","fix":"Replace the `unreachable!()` arm with a graceful bailout (e.g. `_ => return None` or just skip recording the rest binding).","locations":[{"ref":"crates/rolldown/src/ast_scanner/dynamic_import.rs:225-241","code":"  225 |         if let Some(rest) = &obj.rest {\n  226 |           match &rest.argument {\n  227 |             ast::BindingPattern::BindingIdentifier(id) => {\n  228 |               let symbol_id = id.symbol_id();\n  229 |               self\n  230 |                 .dynamic_import_usage_info\n  231 |                 .dynamic_import_binding_to_import_record_idx\n  232 |                 .insert(symbol_id, import_record_idx);\n  233 |               self\n  234 |                 .dynamic_import_usage_info\n  235 |                 .dynamic_import_binding_reference_id\n  236 |                 .extend(self.result.symbol_ref_db.scoping().get_resolved_reference_ids(symbol_id));\n  237 |             }\n  238 |             // If the rest argument is not a BindingIdentifier, this is an unexpected case\n  239 |             // because '...' must be followed by an identifier in declaration contexts.\n  240 |             _ => unreachable!(),\n  241 |           }","lines":17,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/ast_scanner/dynamic_import.rs#L225-L241"}]},
{"id":"PANIC_19","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"ESM concatenated-module group rendering uses unchecked map indexing and `.unwrap()` on `rendered_esm_runtime_expr` / `wrap_ref_name` for `group.entry`. Earlier in the same loop, per-module lookups use `.get(idx)` with a `continue` fallback, but the group entry is indexed directly three times (`module_idx_to_render_concatenated_module[&group.entry]`) and two `Option`s are unwrapped. If a multi-module group's entry lacks a rendered concatenated module (graph inconsistency), this panics.","fix":"Look the entry up once via `.get(&group.entry)` and bail/emit a diagnostic if missing or if the runtime-expr/wrap-name `Option`s are `None`, matching the defensive `.get`/`continue` style used for the other modules in the group.","locations":[{"ref":"crates/rolldown/src/ecmascript/format/esm.rs:264-273","code":"  264 |     let rendered_esm_runtime_expr = ctx.chunk.module_idx_to_render_concatenated_module\n  265 |       [&group.entry]\n  266 |       .rendered_esm_runtime_expr\n  267 |       .as_ref()\n  268 |       .unwrap()\n  269 |       .trim_end_matches([';', '\\n']);\n  270 |     let wrap_name = ctx.chunk.module_idx_to_render_concatenated_module[&group.entry]\n  271 |       .wrap_ref_name\n  272 |       .as_ref()\n  273 |       .unwrap();","lines":10,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/ecmascript/format/esm.rs#L264-L273"}]},
{"id":"PANIC_20","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`finalized_expr_for_cross_chunk_symbol` indexes `exports_to_other_chunks[&canonical_ref][0]` with both a map index and a slice index. If `canonical_ref` is absent from `exports_to_other_chunks`, or its vec is empty, this panics. It is reached on the CJS cross-chunk path for Esm/None wrap kinds or common chunks; correctness relies on an unstated invariant that the symbol is always registered as an export with at least one name.","fix":"Use `.get(&canonical_ref).and_then(|v| v.first())` and handle the `None` case explicitly (diagnostic or documented unreachable), instead of double unchecked indexing.","locations":[{"ref":"crates/rolldown/src/module_finalizers/mod.rs:705-707","code":"  705 |     let exported_name = &self.ctx.chunk_graph.chunk_table[target_chunk_idx].exports_to_other_chunks\n  706 |       [&canonical_ref][0];\n  707 |     let is_default_export = exported_name.as_str() == \"default\";","lines":3,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/module_finalizers/mod.rs#L705-L707"}]},
{"id":"PANIC_21","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`require` rewrite for external modules uses `call_expr.arguments.get_mut(0).expect(\"require should have an argument\")`. While `is_global_require_call` likely guarantees an argument, this is a hard expect on user-derived AST; a `require()` recognized as a global-require call but with zero arguments (e.g. constructed/edge cases) would panic instead of being left untouched.","fix":"Replace `.expect(...)` with `let Some(request_path) = call_expr.arguments.get_mut(0) else { return None; };` to degrade gracefully.","locations":[{"ref":"crates/rolldown/src/module_finalizers/mod.rs:1683-1684","code":" 1683 |             let request_path =\n 1684 |               call_expr.arguments.get_mut(0).expect(\"require should have an argument\");","lines":2,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/module_finalizers/mod.rs#L1683-L1684"}]},
{"id":"PANIC_22","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`find_merge_target` unwraps with `.expect(\"Should be normal module\")` on `module_table[*entry_module_idx].as_normal()`. The entry module indices come from `collect_entry_modules`, which calls `chunk.entry_module_idx()`. While entry modules are normally normal modules, this is an `expect` on a value derived from chunk-graph state during the merge-common-chunks optimization path; if an entry chunk ever references an external/non-normal entry module the optimizer would panic instead of bailing out gracefully like the rest of the function does (it returns `None`/`continue` for other unexpected cases).","fix":"Use `as_normal()?` (return `None` from the `find_map` closure) instead of `.expect(...)` so a non-normal entry module simply disqualifies that candidate rather than aborting the build.","locations":[{"ref":"crates/rolldown/src/stages/generate_stage/chunk_optimizer.rs:770-776","code":"  770 |     chunk_indices.iter().zip(entry_modules.iter()).find_map(|(chunk_idx, entry_module_idx)| {\n  771 |       let module = module_table[*entry_module_idx].as_normal().expect(\"Should be normal module\");\n  772 |       let can_merge = entry_modules.iter().all(|other_entry_module_idx| {\n  773 |         *entry_module_idx == *other_entry_module_idx\n  774 |           || module.importers_idx.contains(other_entry_module_idx)\n  775 |       });\n  776 |       can_merge.then_some(*chunk_idx)","lines":7,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/stages/generate_stage/chunk_optimizer.rs#L770-L776"}]},
{"id":"PANIC_23","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`add_exports_for_export_star` pushes `module_idx` onto `module_stack` (line 330), then bails via the `let Module::Normal(module) = &normal_modules[module_idx] else { return }` guard (lines 332-334) without ever calling the matching `module_stack.pop()` at line 399. This leaks a stale entry onto the shared `module_stack`, which corrupts the subsequent `module_stack.contains(&module_idx)` cycle check and the shadowing check at lines 362-366 for the rest of the recursion. It is currently latent because every call site reaches this function with a Normal module (the initial call filters, and the recursive call at 396 only passes `dep_id` values already checked Normal at line 349), but the guard is fragile dead code that becomes a real bug if an External idx ever reaches it.","fix":"Pop the just-pushed idx before the early `return` (or restructure so the push happens only after confirming the module is Normal).","locations":[{"ref":"crates/rolldown/src/stages/link_stage/bind_imports_and_exports.rs:495-499","code":"  495 |     module_stack.push(module_idx);\n  496 | \n  497 |     let Module::Normal(module) = &normal_modules[module_idx] else {\n  498 |       return;\n  499 |     };","lines":5,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/stages/link_stage/bind_imports_and_exports.rs#L495-L499"}]},
{"id":"PANIC_24","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`get_snapshot_mut`, `get_snapshot`, and `create_output` all call `self.snapshot.<...>().unwrap()`\non the `Option<NormalizedScanStageOutput>`. Their doc comments acknowledge they panic when the\nsnapshot is unset. These are reachable from incremental/HMR flows; a single mis-ordered call\n(snapshot not yet set, or dropped due to an earlier `?` bail elsewhere) turns into a hard panic\nrather than a recoverable error. The risk is elevated because `update_defer_sync_data` documents\nexactly the failure mode where a `?` could leave `snapshot == None`.","fix":"Return `BuildResult`/`Option` from these accessors (or assert with a descriptive message tying the\npanic to the invariant) so callers can surface a diagnostic instead of an unexplained crash.","locations":[{"ref":"crates/rolldown/src/types/scan_stage_cache.rs:53-55","code":"   53 |   pub fn get_snapshot_mut(&mut self) -> &mut NormalizedScanStageOutput {\n   54 |     self.snapshot.as_mut().unwrap()\n   55 |   }","lines":3,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/types/scan_stage_cache.rs#L53-L55"},{"ref":"crates/rolldown/src/types/scan_stage_cache.rs:78-80","code":"   78 |   pub fn get_snapshot(&self) -> &NormalizedScanStageOutput {\n   79 |     self.snapshot.as_ref().unwrap()\n   80 |   }","lines":3,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/types/scan_stage_cache.rs#L78-L80"},{"ref":"crates/rolldown/src/types/scan_stage_cache.rs:324-325","code":"  324 |   pub fn create_output(&mut self) -> NormalizedScanStageOutput {\n  325 |     let cache = self.snapshot.as_mut().unwrap();","lines":2,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/types/scan_stage_cache.rs#L324-L325"}]},
{"id":"PANIC_25","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`ScanStageCache::merge` indexes `self.module_id_to_idx[new_module.id()]` with the `Index`\noperator, which panics if the id is absent from the map. The function is incremental-build code\nwhere the set of modules in `module_id_to_idx` and the modules in `scan_stage_output` are derived\nseparately; if they ever diverge (e.g. a module present in the scan output but not yet recorded in\n`module_id_to_idx`) the build panics instead of returning a `BuildResult` error.","fix":"Use `self.module_id_to_idx.get(new_module.id())` and convert a missing entry into a\n`BuildResult` error (or handle the genuinely-new-module case explicitly) rather than panicking.","locations":[{"ref":"crates/rolldown/src/types/scan_stage_cache.rs:152-153","code":"  152 |     for (new_idx, new_module) in modules {\n  153 |       let idx = self.module_id_to_idx[new_module.id()].idx();","lines":2,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/types/scan_stage_cache.rs#L152-L153"}]},
{"id":"PANIC_26","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`prepare_build_context` calls `std::env::current_dir().expect(\"Failed to get current dir\")` when\nthe user did not supply `cwd`. `current_dir()` legitimately fails (e.g. the working directory was\ndeleted, or insufficient permissions), turning an environmental condition into a panic during\nbundler initialization instead of a `BuildResult` error.","fix":"Propagate the error via `?` after mapping it to a `BuildDiagnostic::bundler_initialize_error`,\nmatching how other initialization failures in this function are reported.","locations":[{"ref":"crates/rolldown/src/utils/prepare_build_context.rs:310-311","code":"  310 |   let cwd =\n  311 |     raw_options.cwd.unwrap_or_else(|| std::env::current_dir().expect(\"Failed to get current dir\"));","lines":2,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/utils/prepare_build_context.rs#L310-L311"}]},
{"id":"PANIC_27","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`BindingNormalizedOptions::input` decides `has_name` from only the first input, then `unwrap_or_else(|| unreachable!(...))` on every subsequent input's `name`. The 'all have names or none do' invariant is only checked against the first element; if a later input lacks a name while the first has one, this panics and aborts the process. Reachable via `#[napi(getter)]`.","fix":"Validate the invariant and return a JS-throwable error, or fall back to `unwrap_or_default()` rather than `unreachable!`.","locations":[{"ref":"crates/rolldown_binding/src/types/binding_normalized_options.rs:30-52","code":"   30 |   pub fn input(&self) -> Either<Vec<String>, HashMap<String, String, FxBuildHasher>> {\n   31 |     let mut inputs_iter = self.inner.input.iter().peekable();\n   32 |     let has_name = inputs_iter.peek().is_some_and(|input| input.name.is_some());\n   33 |     if has_name {\n   34 |       Either::B(\n   35 |         self\n   36 |           .inner\n   37 |           .input\n   38 |           .iter()\n   39 |           .map(|input| {\n   40 |             (\n   41 |               input.name.clone().unwrap_or_else(|| {\n   42 |                 unreachable!(\"Inputs passed from js side are either all have names or not\")\n   43 |               }),\n   44 |               input.import.clone(),\n   45 |             )\n   46 |           })\n   47 |           .collect(),\n   48 |       )\n   49 |     } else {\n   50 |       Either::A(self.inner.input.iter().map(|input| input.import.clone()).collect())\n   51 |     }\n   52 |   }","lines":23,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_binding/src/types/binding_normalized_options.rs#L30-L52"}]},
{"id":"PANIC_28","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`normalize_binding_options` does `worker_manager.as_ref().unwrap()` in the parallel-plugin branch. The invariant is that a `None` plugin slot (parallel plugin) implies a worker manager exists, but this couples two separate inputs (parallel_plugins_map and worker_manager) via an `unwrap`. If a caller supplies a parallel-plugin placeholder without a positive worker_count, this aborts the Node process instead of erroring.","fix":"Return a `napi::Error` when the worker manager is absent but a parallel plugin slot is encountered, rather than `unwrap`.","locations":[{"ref":"crates/rolldown_binding/src/utils/normalize_binding_options.rs:787-792","code":"  787 |           let plugins = parallel_plugins_map\n  788 |             .as_mut()\n  789 |             .and_then(|plugin| plugin.remove(&index))\n  790 |             .unwrap_or_default();\n  791 |           let worker_manager = worker_manager.as_ref().unwrap();\n  792 |           ParallelJsPlugin::new_shared(plugins, Arc::clone(worker_manager))","lines":6,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_binding/src/utils/normalize_binding_options.rs#L787-L792"}]},
{"id":"PANIC_29","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`generate_preliminary_filename` uses `expect(\"The file should have basename\")` on\n`PathBuf::from(file).file_name()`. A user-supplied `output.file` ending in `/`, `.`, or `..` yields no `file_name`\nand aborts the bundler with a panic instead of a user-facing error.","fix":"Validate `options.file` earlier and emit a build diagnostic, or fall back gracefully when `file_name()` is `None`.","locations":[{"ref":"crates/rolldown_common/src/chunk/mod.rs:197-204","code":"  197 |     if let Some(file) = &options.file {\n  198 |       let basename = PathBuf::from(file)\n  199 |         .file_name()\n  200 |         .expect(\"The file should have basename\")\n  201 |         .to_string_lossy()\n  202 |         .to_string();\n  203 |       return Ok(PreliminaryFilename::new(basename.into(), None));\n  204 |     }","lines":8,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_common/src/chunk/mod.rs#L197-L204"}]},
{"id":"PANIC_30","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`SanitizeFilename::value` calls `.expect(\"SanitizeFilename Fn should has value\")` when `self` is the `Fn(_)` variant\nbut `fn_sanitized_file_name` is `None`. Any caller passing the `Fn` variant without precomputing the JS-side result\npanics instead of getting an error.","fix":"Return a `Result`/`Option`, or at minimum make the panic message describe the calling contract (caller must precompute the sanitized name for the `Fn` variant).","locations":[{"ref":"crates/rolldown_common/src/inner_bundler_options/types/sanitize_filename.rs:39-50","code":"   39 |   pub fn value(&self, name: &str, fn_sanitized_file_name: Option<String>) -> ArcStr {\n   40 |     match self {\n   41 |       Self::Boolean(value) => {\n   42 |         if *value {\n   43 |           default_sanitize_file_name(name).into()\n   44 |         } else {\n   45 |           name.into()\n   46 |         }\n   47 |       }\n   48 |       Self::Fn(_) => fn_sanitized_file_name.expect(\"SanitizeFilename Fn should has value\").into(),\n   49 |     }\n   50 |   }","lines":12,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_common/src/inner_bundler_options/types/sanitize_filename.rs#L39-L50"}]},
{"id":"PANIC_31","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`RuntimeModuleBrief::resolve_symbol` unconditionally `panic!`s when a runtime symbol name is missing. The doc claims\nthis \"should not happen as symbols are validated upfront\", but `validate_symbols` only checks names passed to it; any\ncaller resolving a name outside that validated set (e.g. a plugin-modified runtime missing a helper) hits the panic.","fix":"Return `Option<SymbolRef>` / `Result` so callers can handle a missing runtime symbol gracefully instead of aborting.","locations":[{"ref":"crates/rolldown_common/src/module_loader/runtime_module_brief.rs:60-67","code":"   60 |   pub fn resolve_symbol(&self, name: &str) -> SymbolRef {\n   61 |     let symbol_id = self.name_to_symbol.get(name).unwrap_or_else(|| {\n   62 |       panic!(\n   63 |         \"Failed to resolve runtime symbol `{name}`. This should not happen as symbols are validated upfront.\"\n   64 |       )\n   65 |     });\n   66 |     (self.id, *symbol_id).into()\n   67 |   }","lines":8,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_common/src/module_loader/runtime_module_brief.rs#L60-L67"}]},
{"id":"PANIC_32","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`trace_action!` calls `serde_json::to_string(&$expr).unwrap()`. Although the current action structs serialize infallibly, this macro is the single emission point used across the whole bundler; any future action type containing a map with non-string keys, a non-finite float, or a custom `Serialize` that can error would turn a tracing call into a process panic.","fix":"Handle the serialization error gracefully (e.g. skip emitting and log at debug level) instead of unwrapping in a tracing macro.","locations":[{"ref":"crates/rolldown_devtools/src/trace_action_macro.rs:3-5","code":"    3 |   ($expr:expr) => {\n    4 |     tracing::trace!(devtoolsAction = serde_json::to_string(&$expr).unwrap());\n    5 |   };","lines":3,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_devtools/src/trace_action_macro.rs#L3-L5"}]},
{"id":"PANIC_33","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`DevtoolsActionFieldExtractor::record_str` unconditionally `unwrap()`s `serde_json::from_str(value)` for the `devtoolsAction` field. While the value normally comes from `trace_action!`'s `to_string`, any other code path emitting a `devtoolsAction` field with non-JSON text (or partially written/escaped data) would panic the formatting path rather than being ignored.","fix":"Use `serde_json::from_str(value).ok()` and only set `self.value` on success.","locations":[{"ref":"crates/rolldown_devtools/src/types/devtools_action_field_extractor.rs:8-12","code":"    8 |   fn record_str(&mut self, field: &tracing::field::Field, value: &str) {\n    9 |     if field.name() == \"devtoolsAction\" {\n   10 |       self.value = Some(serde_json::from_str(value).unwrap());\n   11 |     }\n   12 |   }","lines":5,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_devtools/src/types/devtools_action_field_extractor.rs#L8-L12"}]},
{"id":"PANIC_34","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`is_script_close_tag` calls `slice.try_into().unwrap()` to convert `&[u8]` into `[u8; 8]`, relying entirely on the single caller `contains_script_closing_tag` guaranteeing an exactly-8-byte slice. It does not panic today (the caller's `remaining.len() >= pos + 8` guard holds), but the `unwrap` is a latent footgun if the private helper is ever reused.","fix":"Use `let Ok(bytes): Result<[u8; 8], _> = slice.try_into() else { return false; };` instead of `.unwrap()`.","locations":[{"ref":"crates/rolldown_ecmascript_utils/src/source_utils.rs:22-31","code":"   22 | fn is_script_close_tag(slice: &[u8]) -> bool {\n   23 |   // Compiler condenses these operations to an 8-byte read, u64 AND, and u64 compare.\n   24 |   // https://godbolt.org/z/K8q68WGn6\n   25 |   let mut bytes: [u8; 8] = slice.try_into().unwrap();\n   26 |   for byte in bytes.iter_mut().skip(2) {\n   27 |     // `| 32` converts ASCII upper case letters to lower case.\n   28 |     *byte |= 32;\n   29 |   }\n   30 |   bytes == *b\"<\/script\"\n   31 | }","lines":10,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_ecmascript_utils/src/source_utils.rs#L22-L31"}]},
{"id":"PANIC_35","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`AmbiguousExternalNamespace::message` does `self.exporter.iter()...next_back().unwrap()`. If the `exporter` Vec is empty the unwrap panics. The constructor `BuildDiagnostic::ambiguous_external_namespace` accepts an arbitrary `Vec<AmbiguousExternalNamespaceModule>` with no non-empty guarantee, and this is the message-rendering path that runs while reporting another error, so a degenerate input would turn a diagnostic into a crash.","fix":"Guard against an empty exporter list (e.g. early-return a simpler message, or `if let Some(last) = exporter.next_back()`), instead of unwrapping.","locations":[{"ref":"crates/rolldown_error/src/build_diagnostic/events/ambiguous_external_namespace.rs:36-48","code":"   36 |   fn message(&self, _opts: &DiagnosticOptions) -> String {\n   37 |     let mut exporter = self.exporter.iter().map(|v| format!(r#\"\"{0}\"\"#, v.stable_id));\n   38 | \n   39 |     let last = exporter.next_back().unwrap();\n   40 | \n   41 |     format!(\n   42 |       r#\"\"{}\" re-exports \"{}\" from one of the modules {} and {} (will be ignored).\"#,\n   43 |       self.importee,\n   44 |       self.ambiguous_export_name,\n   45 |       exporter.collect::<Vec<_>>().join(\", \"),\n   46 |       last\n   47 |     )\n   48 |   }","lines":13,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_error/src/build_diagnostic/events/ambiguous_external_namespace.rs#L36-L48"}]},
{"id":"PANIC_36","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`Path::new(asset.filename.as_str()).file_name().unwrap()` and the analogous chunk-filename call panic if the filename has no final path component (e.g. empty string or a value ending in `/`). These are derived from output filenames so they are normally well-formed, but the unconditional `unwrap` turns any malformed/empty filename into a hard panic during `generate_bundle`.","fix":"Handle the `None` case from `file_name()` gracefully (e.g. fall back to the full filename via `unwrap_or` / `map_or`) instead of `unwrap()`.","locations":[{"ref":"crates/rolldown_plugin_vite_manifest/src/lib.rs:68-73","code":"   68 |             let file = asset.original_file_names.first().map_or_else(\n   69 |               || {\n   70 |                 Cow::Owned(rolldown_utils::concat_string!(\n   71 |                   \"_\",\n   72 |                   Path::new(asset.filename.as_str()).file_name().unwrap().to_string_lossy()\n   73 |                 ))","lines":6,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_plugin_vite_manifest/src/lib.rs#L68-L73"},{"ref":"crates/rolldown_plugin_vite_manifest/src/utils.rs:54-57","code":"   54 |       _ => rolldown_utils::concat_string!(\n   55 |         \"_\",\n   56 |         std::path::Path::new(chunk.filename.as_str()).file_name().unwrap().to_string_lossy()\n   57 |       ),","lines":4,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_plugin_vite_manifest/src/utils.rs#L54-L57"}]},
{"id":"PANIC_37","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`replace_all_placeholder_impl` computes `let offset = placeholder.len() - 1;` unconditionally. With an empty placeholder this underflows (debug panic; release wraps to `usize::MAX`, then `&placeholder[..offset]` panics). All current call sites pass non-empty literals, so it is not currently reachable, but the function has no guard or documented precondition.","fix":"Add `debug_assert!(!placeholder.is_empty())` or early-return when `placeholder` is empty.","locations":[{"ref":"crates/rolldown_utils/src/replace_all_placeholder.rs:54-64","code":"   54 | fn replace_all_placeholder_impl(\n   55 |   pattern: String,\n   56 |   is_len_enabled: bool,\n   57 |   mut placeholder: &str,\n   58 |   mut replacer: impl Replacer,\n   59 | ) -> SingleBuildResult<String> {\n   60 |   let offset = placeholder.len() - 1;\n   61 | \n   62 |   if is_len_enabled {\n   63 |     placeholder = &placeholder[..offset];\n   64 |   }","lines":11,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_utils/src/replace_all_placeholder.rs#L54-L64"}]},
{"id":"PANIC_38","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`WatchTask::build` does `bundler.last_bundle_handle.clone().expect(\"bundle handle should exist\nafter build\")`. If `with_cached_bundle_experimental` returns early with an error before a bundle\nhandle is recorded (e.g. a failure in the scan setup path), `last_bundle_handle` could be `None`,\nturning a recoverable build error into a panic that kills the coordinator task. The surrounding code\nalready treats build errors as recoverable (`BuildOutcome::Error`), so an `expect` here is a\nmismatch in error-handling strategy.","fix":"Handle `None` gracefully (e.g. fall through to a fatal-but-non-panicking error path) instead of `expect`, or document the invariant that guarantees a handle always exists.","locations":[{"ref":"crates/rolldown_watcher/src/watch_task.rs:136-138","code":"  136 |       // Extract the bundle handle for event data (watch files + close support)\n  137 |       let bundle_handle =\n  138 |         bundler.last_bundle_handle.clone().expect(\"bundle handle should exist after build\");","lines":3,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_watcher/src/watch_task.rs#L136-L138"}]},
{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"DataUrlPlugin stores every resolved data URL in `resolved_data_url: FxDashMap` keyed by a hash-derived id, and never removes entries. If the same plugin instance is reused across multiple builds (e.g. watch mode / dev server), the map grows monotonically with every distinct data URL ever seen, since there is no clearing on build_start or build_end.","fix":"Clear `resolved_data_url` at build_start (or use a per-build context) so entries do not accumulate across rebuilds when the plugin instance is shared.","locations":[{"ref":"crates/rolldown_plugin_data_url/src/lib.rs:22-25","code":"   22 | #[derive(Debug, Default)]\n   23 | pub struct DataUrlPlugin {\n   24 |   resolved_data_url: FxDashMap<ArcStr, ResolvedDataUrl>,\n   25 | }","lines":4,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_plugin_data_url/src/lib.rs#L22-L25"},{"ref":"crates/rolldown_plugin_data_url/src/lib.rs:69-74","code":"   69 |       let id: ArcStr =\n   70 |         format!(\"\\0rolldown/data-url:{}\", xxhash_base64_url(args.specifier.as_bytes())).into();\n   71 | \n   72 |       self.resolved_data_url.insert(id.clone(), ResolvedDataUrl { data, module_type });\n   73 | \n   74 |       return Ok(Some(HookResolveIdOutput { id, ..Default::default() }));","lines":6,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_plugin_data_url/src/lib.rs#L69-L74"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"`prepare_cross_module_optimization` computes `self.options.optimization.inline_const_pass() - 1` on a `u32`. `inline_const_pass()` returns the user-supplied `pass` value verbatim (`self.inline_const.map_or(1, |item| item.pass)`), and `normalize_optimization_option` passes `config.pass` through unchecked for the `InlineConstOption::Config` case (no minimum clamp). If a user configures `optimization.inlineConst = { pass: 0 }`, this subtraction underflows: panic in debug builds, wrap to `u32::MAX` in release. A wrapped `u32::MAX` then flows into `pass.max(other_optimization_pass)` and the `while ctx.config.pass > 0` loop, causing an effectively unbounded optimization loop.","fix":"Use `inline_const_pass().saturating_sub(1)`, or clamp `pass` to a minimum of 1 in `normalize_optimization_option`.","locations":[{"ref":"crates/rolldown/src/stages/link_stage/cross_module_optimization.rs:63-69","code":"   63 |     #[expect(clippy::bool_to_int_with_if)]\n   64 |     let other_optimization_pass = if has_side_effect_free_functions { 1 } else { 0 };\n   65 |     let cross_module_inline_const_pass = self.options.optimization.inline_const_pass() - 1;\n   66 |     CrossModuleOptimizationConfig {\n   67 |       pass: cross_module_inline_const_pass.max(other_optimization_pass),\n   68 |       inline_const_optimization: cross_module_inline_const_pass >= 1,\n   69 |     }","lines":7,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/stages/link_stage/cross_module_optimization.rs#L63-L69"},{"ref":"crates/rolldown_common/src/inner_bundler_options/types/optimization.rs:112-118","code":"  112 |     Some(InlineConstOption::Config(config)) => {\n  113 |       // When `mode` is unspecified, default to `Smart` to match the omitted-option\n  114 |       // default. See https://github.com/rolldown/rolldown/issues/9244.\n  115 |       let mode = config.mode.unwrap_or(InlineConstMode::Smart);\n  116 |       let pass = config.pass;\n  117 |       Some(NormalizedInlineConstConfig { mode, pass })\n  118 |     }","lines":7,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_common/src/inner_bundler_options/types/optimization.rs#L112-L118"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`cursor - 1` and `cursor - 2` are unguarded `usize` subtractions where `cursor =\nself.visit_path.len() - 1`. They are reached when the parent node is a member expression\n(`kind.is_member_expression_kind()`). In normal traversal a member expression always has a\nstatement/expression ancestor so `cursor >= 1`, but the code relies on that invariant\nimplicitly; if it is ever violated (e.g. a future caller invokes the analyzer with a shorter\npath) the subtraction underflows and the subsequent index panics rather than returning `None`.\nThe sibling `.get(cursor - 1)?` pattern suggests `None` was the intended fallback.","fix":"Use checked indexing throughout, e.g. `cursor.checked_sub(1).and_then(|i| self.visit_path.get(i))?`, so a too-short path yields `None` instead of panicking.","locations":[{"ref":"crates/rolldown/src/ast_scanner/cjs_export_analyzer.rs:53-94","code":"   53 |     let cursor = self.visit_path.len() - 1;\n   54 |     let parent = self.visit_path.get(cursor)?;\n   55 |     match parent {\n   56 |       kind if kind.is_member_expression_kind() => match ty {\n   57 |         // two scenarios:\n   58 |         // 1. module.exports.__esModule = true;\n   59 |         // 2. Object.defineProperty(module.exports, \"__esModule\", { value: true });\n   60 |         CjsGlobalAssignmentType::ModuleExportsAssignment => {\n   61 |           let member_expr = kind.as_member_expression_kind().unwrap();\n   62 |           let property_name = member_expr.static_property_name()?;\n   63 |           if property_name != \"exports\" {\n   64 |             return None;\n   65 |           }\n   66 |           let parent_parent_kind = self.visit_path.get(cursor - 1)?;\n   67 |           match parent_parent_kind {\n   68 |             parent_parent_kind if parent_parent_kind.is_member_expression_kind() => {\n   69 |               let parent_parent = parent_parent_kind.as_member_expression_kind().unwrap();\n   70 |               Self::check_assignment_target_property(\n   71 |                 &parent_parent,\n   72 |                 self.visit_path.get(cursor - 2)?,\n   73 |               )\n   74 |             }\n   75 |             AstKind::CallExpression(call_expr)\n   76 |               if call_expr\n   77 |                 .arguments\n   78 |                 .first()\n   79 |                 .is_some_and(|arg| arg.node_id() == parent.node_id()) =>\n   80 |             {\n   81 |               self.check_object_define_property(call_expr)\n   82 |             }\n   83 |             AstKind::AssignmentExpression(assignment_expr) => {\n   84 |               self.check_assignment_is_cjs_reexport(assignment_expr)\n   85 |             }\n   86 |             _ => None,\n   87 |           }\n   88 |         }\n   89 |         CjsGlobalAssignmentType::ExportsAssignment => {\n   90 |           // one scenario:\n   91 |           // 1. exports.__esModule = true;\n   92 |           let member_expr = kind.as_member_expression_kind().unwrap();\n   93 |           Self::check_assignment_target_property(&member_expr, self.visit_path.get(cursor - 1)?)\n   94 |         }","lines":42,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/ast_scanner/cjs_export_analyzer.rs#L53-L94"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"When rebuilding semantic stats for a transformed JSON module, `references` is computed as `declaration_binding_names.len() as u32 * 2u32` and `symbols`/`nodes` as `len() as u32`. Both the `as u32` cast (truncation for >4B keys is unrealistic) and the `* 2` multiplication are unchecked; this is only a stats hint to `SemanticBuilder` so a wrong value degrades to a reallocation rather than miscompiling, but the multiplication can overflow in release for a pathological JSON object.","fix":"Use `saturating_mul`/`try_into` with a saturating fallback, or cap the stats hint.","locations":[{"ref":"crates/rolldown/src/stages/link_stage/generate_lazy_export.rs:247-254","code":"  247 |   #[expect(clippy::cast_possible_truncation)]\n  248 |   let scoping = ecma_ast.make_symbol_table_and_scope_tree_with_semantic_builder(\n  249 |     SemanticBuilder::new().with_stats(Stats {\n  250 |       nodes: declaration_binding_names.len().next_power_of_two() as u32,\n  251 |       scopes: 1,\n  252 |       symbols: declaration_binding_names.len() as u32,\n  253 |       references: declaration_binding_names.len() as u32 * 2u32,\n  254 |     }),","lines":8,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/stages/link_stage/generate_lazy_export.rs#L247-L254"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`ByteLocator::byte_offset` computes `self.line_starts[line] + column` with no bounds relation between `column` and the actual line length, and the out-of-range branch returns `last_line_start + column`. The result is then cast `as u32` in `BuildDiagnostic::json_parse` to build a `Span`. For a large source (> 4 GiB) or a malformed/oversized column, the offset can exceed the real source length or overflow on the u32 cast, producing a span that points outside the source. Downstream span slicing (e.g. `is_context_too_long`, ariadne) then has to defend against an invalid span.","fix":"Clamp the computed offset to `source.len()` (and saturate on the u32 conversion) so a bad line/column degrades to a valid in-range span instead of an out-of-bounds one.","locations":[{"ref":"crates/rolldown_error/src/utils/locator.rs:25-31","code":"   25 |   pub fn byte_offset(&self, line: usize, column: usize) -> usize {\n   26 |     if line >= self.line_starts.len() {\n   27 |       // Return last position or handle error appropriately\n   28 |       return self.line_starts.last().copied().unwrap_or(0) + column;\n   29 |     }\n   30 |     self.line_starts[line] + column\n   31 |   }","lines":7,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_error/src/utils/locator.rs#L25-L31"},{"ref":"crates/rolldown_error/src/build_diagnostic/constructors.rs:405-418","code":"  405 |   #[expect(clippy::cast_possible_truncation)]\n  406 |   pub fn json_parse(\n  407 |     filename: ArcStr,\n  408 |     source: ArcStr,\n  409 |     line: usize,\n  410 |     column: usize,\n  411 |     message: ArcStr,\n  412 |   ) -> Self {\n  413 |     // This function expects 0-based `line` and `column` values, matching `ByteLocator::byte_offset`.\n  414 |     // Note: `serde_json::Error` reports 1-based line/column; conversion to 0-based is handled at the call site.\n  415 |     let offset = ByteLocator::new(source.as_str()).byte_offset(line, column);\n  416 |     let span = Span::new(offset as u32, offset as u32);\n  417 |     Self::new_inner(JsonParse { filename, source, span, message })\n  418 |   }","lines":14,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_error/src/build_diagnostic/constructors.rs#L405-L418"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`WorkerManager::acquire_all` drains `worker_count` permits one-by-one in a loop with no atomicity. Two concurrent `acquire_all` calls (or `acquire_all` racing `acquire`) can each grab a disjoint subset of permits and then block forever waiting for the rest - a classic deadlock. The channel-based pseudo-semaphore offers no all-or-nothing bulk acquisition. `run_all` depends on this for output hooks.","fix":"Use a real counting semaphore (e.g. `tokio::sync::Semaphore::acquire_many`) supporting atomic bulk acquisition, or serialize `acquire_all` behind a mutex.","locations":[{"ref":"crates/rolldown_binding/src/worker_manager.rs:32-41","code":"   32 |   pub async fn acquire_all(&self) -> WorkerAllSemaphorePermit {\n   33 |     for _ in 0..self.worker_count {\n   34 |       self.free_workers_receiver.recv().await.unwrap();\n   35 |     }\n   36 | \n   37 |     WorkerAllSemaphorePermit {\n   38 |       worker_count: self.worker_count,\n   39 |       sender: self.free_workers_sender.clone(),\n   40 |     }\n   41 |   }","lines":10,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_binding/src/worker_manager.rs#L32-L41"},{"ref":"crates/rolldown_binding/src/options/plugin/parallel_js_plugin.rs:59-76","code":"   59 |   #[cfg(not(target_family = \"wasm\"))]\n   60 |   async fn run_all<\n   61 |     'a,\n   62 |     R,\n   63 |     E: std::fmt::Debug,\n   64 |     F: FnMut(&'a JsPlugin) -> BoxFuture<'a, Result<R, E>>,\n   65 |   >(\n   66 |     &'a self,\n   67 |     f: F,\n   68 |   ) -> Result<Vec<R>, E> {\n   69 |     let _permit = self.worker_manager.acquire_all().await;\n   70 |     let results = future::join_all(self.plugins.iter().map(f)).await;\n   71 |     let mut ok_list: Vec<R> = Vec::with_capacity(results.len());\n   72 |     for result in results {\n   73 |       ok_list.push(result?);\n   74 |     }\n   75 |     Ok(ok_list)\n   76 |   }","lines":18,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_binding/src/options/plugin/parallel_js_plugin.rs#L59-L76"}]},
