{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"`compute_reachable_modules` documents \"all modules reachable FROM a given entry\nmodule\" but its result always includes the entry module itself (it is inserted\ninto `visited` unconditionally). Callers then treat the set as the chunk's\nreachable modules, so the entry is double-counted as one of its own\ndependencies. Either the comment or the inclusion of the seed is off.","fix":"Clarify the comment that the entry is included, or exclude the seed from the returned set if not intended.","locations":[{"ref":"crates/rolldown_plugin_bundle_analyzer/src/lib.rs:326-351","code":"  326 |   /// Compute all modules reachable from a given entry module\n  327 |   fn compute_reachable_modules(\n  328 |     &self,\n  329 |     entry_module_idx: usize,\n  330 |     dependencies: &FxHashMap<usize, FxHashSet<usize>>,\n  331 |   ) -> Vec<usize> {\n  332 |     let mut visited: FxHashSet<usize> = FxHashSet::default();\n  333 |     let mut stack: Vec<usize> = vec![entry_module_idx];\n  334 | \n  335 |     while let Some(module_idx) = stack.pop() {\n  336 |       if visited.contains(&module_idx) {\n  337 |         continue;\n  338 |       }\n  339 |       visited.insert(module_idx);\n  340 | \n  341 |       if let Some(deps) = dependencies.get(&module_idx) {\n  342 |         for &dep_idx in deps {\n  343 |           if !visited.contains(&dep_idx) {\n  344 |             stack.push(dep_idx);\n  345 |           }\n  346 |         }\n  347 |       }\n  348 |     }\n  349 | \n  350 |     visited.into_iter().collect()\n  351 |   }","lines":26,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_plugin_bundle_analyzer/src/lib.rs#L326-L351"}]},
{"id":"CMT_8","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"Misleading doc example on `OptionExt::unpack`: the example claims the panic prints the inner value type (e.g. `Option<usize>`). That holds for `unpack`, but `unpack_ref`/`unpack_ref_mut` call `self.as_ref().unpack()` / `self.as_mut().unpack()`, so inside `unpack` `Self` is `Option<&T>` / `Option<&mut T>` and the panic message for the ref variants prints `Option<&T>` / `Option<&mut T>`, not the value type the example implies.","fix":"Note in the doc that the ref helpers report `Option<&T>`/`Option<&mut T>`, or inline the panic in the ref methods so they report the original type.","locations":[{"ref":"crates/rolldown_std_utils/src/option_ext.rs:14-40","code":"   14 |   /// ```ignore\n   15 |   /// None::<usize>.unwrap();\n   16 |   /// // called `Option::unwrap()` on a `None` value\n   17 |   ///\n   18 |   /// None::<usize>.unpack();\n   19 |   /// // Got `None` value when calling `OptionExt::unpack()` on `Option<usize>`\n   20 |   /// ```\n   21 |   #[track_caller]\n   22 |   fn unpack(self) -> T {\n   23 |     match self {\n   24 |       Some(v) => v,\n   25 |       None => panic!(\n   26 |         \"Got `None` value when calling `OptionExt::unpack()` on `{type_name}`\",\n   27 |         type_name = pretty_type_name::<Self>()\n   28 |       ),\n   29 |     }\n   30 |   }\n   31 | \n   32 |   /// Shorthand for `self.as_ref().unpack()`.\n   33 |   fn unpack_ref(&self) -> &T {\n   34 |     self.as_ref().unpack()\n   35 |   }\n   36 | \n   37 |   /// Shorthand for `self.as_mut().unpack()`.\n   38 |   fn unpack_ref_mut(&mut self) -> &mut T {\n   39 |     self.as_mut().unpack()\n   40 |   }","lines":27,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_std_utils/src/option_ext.rs#L14-L40"}]},
{"id":"CMT_9","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The `HashPlaceholderGenerator` comment says the placeholder is \"Something like `~!{001}~`\" with a `~!{` prefix, but the actual prefix is `HASH_PLACEHOLDER_LEFT = \"!~{\"` and the real output is `!~{001}~` (verified by tests). The `~!` vs `!~` ordering is reversed/misleading.","fix":"Change the comment to `!~{001}~`.","locations":[{"ref":"crates/rolldown_utils/src/hash_placeholder.rs:107","code":"  107 |   // This is used to generate hash placeholder. Something like `~!{001}~`.","lines":1,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_utils/src/hash_placeholder.rs#L107"}]},

{"id":"CMT_11","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"Doc comment for `render_property_access` has a double-negative typo: \"If the name is not an invalid identifier, it will generate a caller like `.name`.\" It should say \"If the name is a valid identifier\".","fix":"Reword to \"If the name is a valid identifier, it generates `.name`; otherwise it generates `[\\\"...\\\"]`.\"","locations":[{"ref":"crates/rolldown/src/ecmascript/format/utils/namespace.rs:129-138","code":"  129 | /// It is a helper function to generate a caller for the given name.\n  130 | ///\n  131 | /// - If the name is not an invalid identifier, it will generate a caller like `.name`.\n  132 | /// - Otherwise, it will generate a caller like `[\"-foo\"]`.\n  133 | pub fn render_property_access(name: &str) -> String {\n  134 |   if is_validate_identifier_name(name) {\n  135 |     concat_string!(\".\", name)\n  136 |   } else {\n  137 |     concat_string!(\"[\\\"\", name, \"\\\"]\")\n  138 |   }","lines":10,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/ecmascript/format/utils/namespace.rs#L129-L138"}]},
{"id":"CMT_12","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"`MatchingContext::current_tracker` calls `self.tracker_stack.last().expect(\"tracker_stack is not empty\")`. The expect message is phrased as the property being asserted (\"is not empty\") rather than the failure condition, so the panic message reads as a true statement instead of an error. Minor, but misleading in a crash log.","fix":"Phrase the message as the violated expectation, e.g. `.expect(\"tracker_stack should not be empty\")`.","locations":[{"ref":"crates/rolldown/src/stages/link_stage/bind_imports_and_exports.rs:48-50","code":"   48 |   fn current_tracker(&self) -> &ImportTracker {\n   49 |     self.tracker_stack.last().expect(\"tracker_stack is not empty\")\n   50 |   }","lines":3,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/stages/link_stage/bind_imports_and_exports.rs#L48-L50"}]},
{"id":"CMT_13","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"The doc comment block for `rename_bindings_shadowing_wrapper_params` duplicates an entire example.\nA first `# Example` for the CJS-wrapper case (the `cjs-module.js` / `require_cjs` block) is written,\nthen immediately followed by a second summary (\"Rename nested bindings that would shadow\nwrapper/factory parameters. This handles two cases...\") with its own `# Example (external module)`.\nThe first paragraph is an orphaned, half-finished doc section preceding the real one, making the\ndocumentation confusing.","fix":"Merge the two doc sections: keep the combined summary describing both cases and a single Examples\nsection, removing the duplicated leading CJS-only block.","locations":[{"ref":"crates/rolldown/src/utils/renamer.rs:390-443","code":"  390 |   /// Rename nested bindings that would shadow CJS wrapper parameters.\n  391 |   ///\n  392 |   /// For CommonJS wrapped modules, nested scopes must avoid shadowing the synthetic\n  393 |   /// `exports` and `module` parameters injected by the CJS wrapper.\n  394 |   ///\n  395 |   /// # Example\n  396 |   ///\n  397 |   /// ```js\n  398 |   /// // cjs-module.js (detected as CommonJS)\n  399 |   /// function helper() {\n  400 |   ///   const exports = {};  // Would shadow CJS wrapper's exports parameter\n  401 |   ///   return exports;\n  402 |   /// }\n  403 |   /// module.exports = helper;\n  404 |   /// ```\n  405 |   ///\n  406 |   /// Output:\n  407 |   /// ```js\n  408 |   /// var require_cjs = __commonJS((exports, module) => {\n  409 |   ///   function helper() {\n  410 |   ///     const exports$1 = {};  // Renamed to avoid shadowing\n  411 |   ///     return exports$1;\n  412 |   ///   }\n  413 |   ///   module.exports = helper;\n  414 |   /// });\n  415 |   /// ```\n  416 |   /// Rename nested bindings that would shadow wrapper/factory parameters.\n  417 |   ///\n  418 |   /// This handles two cases:\n  419 |   /// 1. CJS wrapper params (\"exports\", \"module\") for CJS-wrapped modules\n  420 |   /// 2. External module factory params for IIFE/UMD/CJS formats\n  421 |   ///\n  422 |   /// # Example (external module)\n  423 |   ///\n  424 |   /// ```js\n  425 |   /// // entry.js\n  426 |   /// import Quill from 'quill';\n  427 |   /// export class Editor {\n  428 |   ///   constructor(quill) {     // Would shadow factory param 'quill'\n  429 |   ///     console.log(Quill);    // After bundling: quill.default (shadowed!)\n  430 |   ///   }\n  431 |   /// }\n  432 |   /// ```\n  433 |   ///\n  434 |   /// Output (fixed):\n  435 |   /// ```js\n  436 |   /// (function(exports, quill) {\n  437 |   ///   class Editor {\n  438 |   ///     constructor(quill$1) {   // Renamed to avoid shadowing\n  439 |   ///       console.log(quill.default);  // Correctly references factory param\n  440 |   ///     }\n  441 |   ///   }\n  442 |   /// })\n  443 |   /// ```","lines":54,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/utils/renamer.rs#L390-L443"}]},

{"id":"CMT_15","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"`BundleCoordinator::new` comment `// Initialize build state with initial build task` precedes\n`queued_tasks: VecDeque::from([])`, which initializes an EMPTY queue (the FullBuild task is actually\npushed later in `run`). The comment claims it seeds the initial build task, which it does not.","fix":"Remove or correct the comment; `VecDeque::from([])` could also just be `VecDeque::new()`.","locations":[{"ref":"crates/rolldown_dev/src/bundle_coordinator.rs:73-74","code":"   73 |       // Initialize build state with initial build task\n   74 |       queued_tasks: VecDeque::from([]),","lines":2,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_dev/src/bundle_coordinator.rs#L73-L74"}]},
{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"`Diagnostic::get_primary_location` reimplements byte-offset -> (line, utf16 column, utf16 offset) by scanning the whole source linearly, duplicating the logic already provided by `ByteLocator::locate_utf16` (used by `primary_location_with`). The two implementations can drift (e.g. `locate_utf16` clamps an out-of-range offset to EOF and uses a binary search; `get_primary_location` re-scans from offset 0 and has slightly different boundary behavior). Having two parallel coordinate-mapping routines is a maintenance hazard for a piece of logic that must stay exactly consistent.","fix":"Have `get_primary_location` build a `ByteLocator` and delegate to `locate_utf16`, returning the file id alongside, so there is a single source of truth.","locations":[{"ref":"crates/rolldown_error/src/build_diagnostic/diagnostic.rs:184-211","code":"  184 |   pub fn get_primary_location(&self) -> Option<(String, usize, usize, usize)> {\n  185 |     let first_label = self.labels.first()?;\n  186 |     let span = first_label.span();\n  187 |     let start = span.start();\n  188 |     let source = self.files.get(span.source())?;\n  189 | \n  190 |     let mut line = 1; // 1-based\n  191 |     let mut column = 0; // 0-based\n  192 |     let mut utf16_pos = 0;\n  193 |     let mut byte_count = 0;\n  194 | \n  195 |     for ch in source.chars() {\n  196 |       if byte_count >= start {\n  197 |         break;\n  198 |       }\n  199 |       if ch == '\\n' {\n  200 |         line += 1;\n  201 |         column = 0;\n  202 |       } else {\n  203 |         column += ch.len_utf16();\n  204 |       }\n  205 |       utf16_pos += ch.len_utf16();\n  206 |       byte_count += ch.len_utf8();\n  207 |     }\n  208 | \n  209 |     let file = span.source().to_string();\n  210 |     Some((file, line, column, utf16_pos))\n  211 |   }","lines":28,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_error/src/build_diagnostic/diagnostic.rs#L184-L211"},{"ref":"crates/rolldown_error/src/utils/locator.rs:39-53","code":"   39 |   pub fn locate_utf16(&self, source: &str, byte_offset: usize) -> (usize, usize, usize) {\n   40 |     // `line_starts` always begins with 0, so `partition_point` is >= 1 and the\n   41 |     // `- 1` cannot underflow.\n   42 |     let line_idx = self.line_starts.partition_point(|&start| start <= byte_offset) - 1;\n   43 |     let line_byte_start = self.line_starts[line_idx];\n   44 |     let line_utf16_start = self.line_utf16_starts[line_idx];\n   45 |     // Clamp so a (malformed) out-of-range offset degrades to the end-of-file\n   46 |     // position instead of yielding column 0.\n   47 |     let end = byte_offset.min(source.len());\n   48 |     let column: usize = source\n   49 |       .get(line_byte_start..end)\n   50 |       .map(|within_line| within_line.chars().map(char::len_utf16).sum())\n   51 |       .unwrap_or(0);\n   52 |     (line_idx + 1, column, line_utf16_start + column)\n   53 |   }","lines":15,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_error/src/utils/locator.rs#L39-L53"}]},

{"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"`process_identifier_ref_by_scope` is a single ~165-line function mixing many unrelated\nconcerns: CJS `module`/`exports`/`require` detection, eval detection, named/namespace import\nmember-expr reference recording, computed-member-write bailout flagging, const-assign\ndiagnostics, self-referenced-class tracking, and JSX-preserve marking. This makes the hottest\nidentifier-visiting path hard to reason about and to verify for correctness (several subtle\nflags are set inline).","fix":"Extract the Global, Root, and JSX-marking branches into separate well-named helper methods to reduce the function's size and isolate each concern.","locations":[{"ref":"crates/rolldown/src/ast_scanner/impl_visit.rs:472-636","code":"  472 |   fn process_identifier_ref_by_scope(&mut self, ident_ref: &IdentifierReference) {\n  473 |     match self.resolve_identifier_reference(ident_ref) {\n  474 |       super::IdentifierReferenceKind::Global => {\n  475 |         match ident_ref.name.as_str() {\n  476 |           \"module\" => {\n  477 |             self.result.ast_usage.insert(EcmaModuleAstUsage::ModuleRef);\n  478 |             let v = self.commonjs_export_analyzer(\n  479 |               ident_ref,\n  480 |               CjsGlobalAssignmentType::ModuleExportsAssignment,\n  481 |             );\n  482 |             self.update_ast_usage_for_commonjs_export(v.as_ref());\n  483 |           }\n  484 |           \"exports\" => {\n  485 |             self.result.ast_usage.insert(EcmaModuleAstUsage::ExportsRef);\n  486 |             // exports = {} will not change the module.exports object, so we just ignore it;\n  487 |             let v =\n  488 |               self.commonjs_export_analyzer(ident_ref, CjsGlobalAssignmentType::ExportsAssignment);\n  489 |             self.update_ast_usage_for_commonjs_export(v.as_ref());\n  490 |             match v {\n  491 |               // {"id":"ARCH_2","type":"architecture","type_label":"Architecture","severity":"negligible","difficulty":"medium","description":"`Diagnostic::render_batch` collects every source from every diagnostic into a deduplicated `files` map and a fresh ariadne `sources(...)` cache, but the per-diagnostic `convert_to_string_with_cache` still calls `init_report_builder`, which `clone()`s all labels and helps for each diagnostic, and ariadne reprints the full labelled line per diagnostic. The doc comment already calls out the residual O(N * line_len) cost for many diagnostics on one long line (minified bundles). This is acknowledged but remains a latent scaling cliff worth tracking.","fix":"Consider caching/reusing the report builder pieces or pre-truncating pathological single-line sources; at minimum keep the documented limitation visible so it is not mistaken for fully resolved.","locations":[{"ref":"crates/rolldown_error/src/build_diagnostic/diagnostic.rs:233-253","code":"  233 |   pub fn render_batch(diagnostics: &[Diagnostic], color: bool) -> Vec<RenderedDiagnostic> {\n  234 |     // Collect every source referenced by any diagnostic, deduplicated, so the\n  235 |     // ariadne cache builds each `Source` exactly once.\n  236 |     let mut files: FxHashMap<DiagnosticFileId, ArcStr> = FxHashMap::default();\n  237 |     for diagnostic in diagnostics {\n  238 |       for (id, content) in &diagnostic.files {\n  239 |         files.entry(id.clone()).or_insert_with(|| content.clone());\n  240 |       }\n  241 |     }\n  242 |     let mut cache = sources(files.iter().map(|(id, content)| (id.clone(), content.clone())));\n  243 |     let mut locators: FxHashMap<DiagnosticFileId, ByteLocator> = FxHashMap::default();\n  244 | \n  245 |     diagnostics\n  246 |       .iter()\n  247 |       .map(|diagnostic| {\n  248 |         let primary_location = diagnostic.primary_location_with(&files, &mut locators);\n  249 |         let message = diagnostic.convert_to_string_with_cache(color, &mut cache);\n  250 |         RenderedDiagnostic { message, primary_location }\n  251 |       })\n  252 |       .collect()\n  253 |   }","lines":21,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_error/src/build_diagnostic/diagnostic.rs#L233-L253"}]},
{"id":"OTHER_1","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"`ModuleLoader::drop` writes back `self.cache.importers` unconditionally from the intermediate\nstate. The HMR callers (`compute_hmr_update`, `compile_lazy_entry`) build a `ModuleLoader`, call\n`fetch_modules`, then `drop(module_loader)` explicitly before `self.cache.merge(...)`. If\n`fetch_modules` returns `Err`, the `?` propagates and `module_loader` is dropped via unwinding,\nwhich still overwrites `cache.importers` with the partially-built intermediate importers from the\nfailed scan. The cache's importer graph can thus be left in a partially-mutated state after a\nfailed partial scan, while the rest of the snapshot (module_table) is not merged - an\ninconsistent cache for the next HMR round.","fix":"On the error path, restore the previous `cache.importers` snapshot (or only commit the importer\nwrite-back when `fetch_modules` succeeded), so a failed partial scan leaves the cache unchanged.","locations":[{"ref":"crates/rolldown/src/module_loader/module_loader.rs:158-162","code":"  158 | impl<Fs: FileSystem + Clone> Drop for ModuleLoader<'_, Fs> {\n  159 |   fn drop(&mut self) {\n  160 |     self.cache.importers = std::mem::take(&mut self.intermediate_normal_modules.importers);\n  161 |   }\n  162 | }","lines":5,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/module_loader/module_loader.rs#L158-L162"}]},
{"id":"OTHER_2","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"The `DevtoolsFormatter` is attached to `fmt::layer()` with no filter, while only the context-extracting `DevtoolsLayer` carries the `devtoolsAction` event filter. As a result every tracing event in the entire process (all info/debug/trace from any crate) is routed through `format_event`, which constructs a `DevtoolsActionFieldExtractor`, visits the event's fields, and only then early-returns when no `devtoolsAction` field is present. On busy builds with other tracing output this is avoidable per-event overhead on every log site.","fix":"Apply the same `devtoolsAction` `FilterFn` to the fmt/formatter layer so non-devtools events are filtered before reaching the formatter.","locations":[{"ref":"crates/rolldown_devtools/src/init_tracing.rs:40-43","code":"   40 |     tracing_subscriber::registry()\n   41 |       .with(DevtoolsLayer.with_filter(devtools_event_filter))\n   42 |       .with(fmt::layer().event_format(DevtoolsFormatter))\n   43 |       .init();","lines":4,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_devtools/src/init_tracing.rs#L40-L43"},{"ref":"crates/rolldown_devtools/src/devtools_formatter.rs:39-42","code":"   39 |     let Some(mut action_value) = Self::extract_action(event) else {\n   40 |       // This branch means this event is not for devtools tracing.\n   41 |       return Ok(());\n   42 |     };","lines":4,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_devtools/src/devtools_formatter.rs#L39-L42"}]},
{"id":"OTHER_3","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"Errors from the user `on_log` callback are silently swallowed. `NativePluginContextImpl::log` spawns the callback with `let _ = on_log.call(level, log).await;`. The code even acknowledges this with a `// FIXME: should collect error happened here and cause the build to fail later`. A failing logger callback is dropped on the floor and the build proceeds as if logging succeeded.","fix":"Collect the callback error into a shared error sink so it can fail the build, instead of discarding it (as the FIXME notes).","locations":[{"ref":"crates/rolldown_plugin/src/plugin_context/native_plugin_context.rs:197-206","code":"  197 |   fn log(&self, level: LogLevel, log: LogWithoutPlugin) {\n  198 |     if let Some(on_log) = &self.options.on_log {\n  199 |       let on_log = on_log.clone();\n  200 |       let log = log.into_log(Some(self.plugin_name.to_string()));\n  201 |       rolldown_utils::futures::spawn(async move {\n  202 |         // FIXME: should collect error happened here and cause the build to fail later\n  203 |         let _ = on_log.call(level, log).await;\n  204 |       });\n  205 |     }\n  206 |   }","lines":10,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_plugin/src/plugin_context/native_plugin_context.rs#L197-L206"}]},

(function(){

// Data

const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};

const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),

}

    const p = new URLSearchParams();

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;

    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});

  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {

      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);

  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {

      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build a [project] header block from embedded PROJECT_INFO, so the exported
// findings.toml is self-contained (doesn't depend on a sibling project-info.toml
// that a second, separately-triggered download could silently fail to save).
// '' when there is no project info at all.
function buildProjectToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = PROJECT_INFO || {};
  if (!Object.keys(pi).length) return '';
  const lines = ['[project]'];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n\n';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return buildProjectToml() + chunks.join('\n\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystacks per finding (cleared on full re-render).
// Two variants: everything (default), and file/folder paths only - for when a
// search term (e.g. a directory name like 'dlls/abc') also happens to appear
// inside description/fix prose and you only want path matches.
const _hay = new Map();
const _hayLoc = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}
function hayLocOf(f) {
  if (!_hayLoc.has(f.id)) {
    _hayLoc.set(f.id, f.locations.map(l => l.ref).join(' ').toLowerCase());
  }
  return _hayLoc.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (S.searchScope === 'locations') {
      if (!hayLocOf(f).includes(q)) return false;
    } else if (!hayOf(f).includes(q) && !st.includes(q)) {
      return false;
    }
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  _hayLoc.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    // Single download (was two) - a second auto-triggered download is commonly
    // blocked by the browser unless the user explicitly allows it, which silently
    // drops project-info.toml. Embedding [project] in findings.toml itself avoids
    // that failure mode entirely.
    downloadText(buildFindingsToml(), 'findings.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});
document.getElementById('search-scope').addEventListener('click', e => {
  S.searchScope = S.searchScope === 'locations' ? 'all' : 'locations';
  e.currentTarget.classList.toggle('active', S.searchScope === 'locations');
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
