{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`process_code_and_sourcemap` calls `Path::new(filename).file_name().expect(\"should have file name\")`.\nThe filename comes from a user-configurable output pattern; values that end in `/`, `.`, `..`, or\nare empty make `file_name()` return `None` and panic here. `verify_raw_options` only validates\n`output.file` (not `entryFileNames`/`chunkFileNames`/`assetFileNames` patterns), so a crafted\nfilename pattern reaching this point panics during sourcemap processing.","fix":"Handle the `None` case by returning a `BuildDiagnostic` (e.g. an invalid-filename error) instead of\n`expect`, or set the map file name from the already-validated chunk basename.","locations":[{"ref":"crates/rolldown/src/utils/process_code_and_sourcemap.rs:37-38","code":"   37 |   let file_base_name = Path::new(filename).file_name().expect(\"should have file name\");\n   38 |   map.set_file(file_base_name.to_string_lossy().as_ref());","lines":2,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/utils/process_code_and_sourcemap.rs#L37-L38"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`ParallelJsPluginRegistry::from_napi_value` returns `napi::Error::from_status(napi::Status::GenericFailure)` with no message when the value isn't an instance of the class, losing all context about what was expected. It then uses `get_named_property_unchecked` for `id`/`workerCount`, bypassing type validation.","fix":"Use `napi::Error::new(Status::InvalidArg, \"Expected an instance of ParallelJsPluginRegistry\")`.","locations":[{"ref":"crates/rolldown_binding/src/parallel_js_plugin_registry.rs:64-80","code":"   64 | impl FromNapiValue for ParallelJsPluginRegistry {\n   65 |   unsafe fn from_napi_value(\n   66 |     env: napi::sys::napi_env,\n   67 |     napi_val: napi::sys::napi_value,\n   68 |   ) -> napi::Result<Self> {\n   69 |     unsafe {\n   70 |       let unknown = Unknown::from_napi_value(env, napi_val)?;\n   71 |       if !ParallelJsPluginRegistry::instance_of(&Env::from_raw(env), &unknown)? {\n   72 |         return Err(napi::Error::from_status(napi::Status::GenericFailure));\n   73 |       }\n   74 | \n   75 |       let object: Object = unknown.cast()?;\n   76 |       let id: u16 = object.get_named_property_unchecked(\"id\")?;\n   77 |       let worker_count: u16 = object.get_named_property_unchecked(\"workerCount\")?;\n   78 |       Ok(Self { id, worker_count })\n   79 |     }\n   80 |   }","lines":17,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_binding/src/parallel_js_plugin_registry.rs#L64-L80"}]},
{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In `dev_engine::DevEngine::run`, the spawned coordinator handle wrapper does\n`join_handle.await.unwrap()`. If the coordinator task panics (or is aborted), the `JoinError`\nunwrap propagates the panic into whatever awaits `wait_for_close`/`run`, rather than surfacing a\nclean error. The analogous code in `rolldown_watcher::watcher::Watcher::run` instead uses\n`let _ = join_handle.await;`, swallowing the JoinError. The two engines handle coordinator-task\nfailure inconsistently.","fix":"Pick one strategy; prefer logging the JoinError (`if let Err(e) = join_handle.await { tracing::error!(...) }`) over `unwrap()` so a coordinator panic doesn't cascade.","locations":[{"ref":"crates/rolldown_dev/src/dev_engine.rs:150-156","code":"  150 |     if let Some(coordinator) = coordinator_state.coordinator.take() {\n  151 |       let join_handle = tokio::spawn(coordinator.run());\n  152 |       let coordinator_handle = Box::pin(async move {\n  153 |         join_handle.await.unwrap();\n  154 |       }) as PinBoxSendStaticFuture;\n  155 |       coordinator_state.handle = Some(coordinator_handle.shared());\n  156 |     }","lines":7,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_dev/src/dev_engine.rs#L150-L156"},{"ref":"crates/rolldown_watcher/src/watcher.rs:118-124","code":"  118 |     if let Some(coordinator) = state.coordinator.take() {\n  119 |       let join_handle = tokio::spawn(coordinator);\n  120 |       let handle: Pin<Box<dyn Future<Output = ()> + Send>> = Box::pin(async move {\n  121 |         let _ = join_handle.await;\n  122 |       });\n  123 |       state.handle = Some(handle.shared());\n  124 |     }","lines":7,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_watcher/src/watcher.rs#L118-L124"}]},
{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"EsmExternalRequirePlugin::load builds a JS facade by interpolating the resolved module specifier directly into a single-quoted import: `concat_string!(\"import * as m from '\", module_id, \"';...\")`. `module_id` (the bare specifier after stripping the facade prefix) is not escaped, so a specifier containing a single quote, backslash, or newline produces broken/invalid JavaScript. While package specifiers rarely contain such characters, the specifier originates from user import statements and is not validated here.","fix":"Serialize the module specifier as a JSON string literal (e.g. serde_json::to_string) instead of wrapping it in raw single quotes, so quotes/backslashes are escaped.","locations":[{"ref":"crates/rolldown_plugin_esm_external_require/src/lib.rs:138-147","code":"  138 |     Ok(args.id.strip_prefix(CJS_EXTERNAL_FACADE_PREFIX).map(|module_id| {\n  139 |       let code = concat_string!(\n  140 |         \"import * as m from '\",\n  141 |         module_id,\n  142 |         \"';module.exports = \",\n  143 |         if is_nodejs_builtin_module(module_id) { \"m.default\" } else { \"{ ...m }\" },\n  144 |         \";\"\n  145 |       );\n  146 |       HookLoadOutput { code: code.into(), ..Default::default() }\n  147 |     }))","lines":10,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_plugin_esm_external_require/src/lib.rs#L138-L147"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"`load` enters the optional-peer-dep branch for any id starting with\n`OPTIONAL_PEER_DEP_ID` and then asserts exactly 3 colon-separated segments via\n`let [_, peer_dep, parent_dep] = id.splitn(3, \":\")... else { unreachable!() }`.\n`OPTIONAL_PEER_DEP_ID` itself contains no `:`, so an id like\n`__vite-optional-peer-dep` or `__vite-optional-peer-dep:x` (which any plugin /\nsource could produce) yields fewer than 3 segments and hits `unreachable!()`,\npanicking.","fix":"Replace `unreachable!()` with `return Ok(None)` (graceful fallthrough).","locations":[{"ref":"crates/rolldown_plugin_vite_resolve/src/vite_resolve_plugin.rs:568-571","code":"  568 |     if args.id.starts_with(OPTIONAL_PEER_DEP_ID) {\n  569 |       let [_, peer_dep, parent_dep] = args.id.splitn(3, \":\").collect::<Vec<&str>>()[..] else {\n  570 |         unreachable!()\n  571 |       };","lines":4,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_plugin_vite_resolve/src/vite_resolve_plugin.rs#L568-L571"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`SymbolRefDbForModule::merge_from_build` extends `self.classic_data` up to the build DB's symbol count but only\npreserves `IsFacade` flags from the build DB; any other per-symbol flag set during the build (e.g.\n`SideEffectsFreeFunction`, `HasComputedMemberWrite`) is discarded on merge-back. If such flags are mutated post-cache,\nthey are lost, risking stale results across incremental builds.","fix":"Confirm no flags other than `IsFacade` are mutated post-cache; if others are, merge them too (or document why only `IsFacade` survives).","locations":[{"ref":"crates/rolldown_common/src/types/symbol_ref_db.rs:137-154","code":"  137 |   pub fn merge_from_build(&mut self, build_db: SymbolRefDbForModule) {\n  138 |     // Extend classic_data for any symbols added during linking (e.g., facade symbols)\n  139 |     let new_len = build_db.ast_scopes.total_symbol_count();\n  140 |     let current_len = self.classic_data.len();\n  141 |     for _ in current_len..new_len {\n  142 |       self.classic_data.push(SymbolRefDataClassic::default());\n  143 |     }\n  144 | \n  145 |     // Preserve IsFacade flags for facade symbols added during linking\n  146 |     for (symbol_id, flags) in &build_db.flags {\n  147 |       if flags.contains(SymbolRefFlags::IsFacade) {\n  148 |         self.flags.entry(*symbol_id).or_default().insert(SymbolRefFlags::IsFacade);\n  149 |       }\n  150 |     }\n  151 | \n  152 |     let scoping = build_db.ast_scopes.into_scoping();\n  153 |     self.ast_scopes.set_scoping(scoping);\n  154 |   }","lines":18,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_common/src/types/symbol_ref_db.rs#L137-L154"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`unsafe { css_entries.as_ref().unwrap_unchecked() }` is used to extract a value that was just guaranteed `Some` a few lines above (the `if css_entries.is_none()` block always sets it). The unsafe `unwrap_unchecked` provides no measurable benefit here, only fragility: a future refactor that changes the control flow could introduce UB. A safe `unwrap()`/`expect()` would be optimized identically by the compiler in this branch.","fix":"Use `css_entries.as_ref().unwrap()` (or restructure so the value is bound in the same scope) instead of `unwrap_unchecked`.","locations":[{"ref":"crates/rolldown_plugin_vite_manifest/src/lib.rs:78","code":"   78 |             let css_entries = unsafe { css_entries.as_ref().unwrap_unchecked() };","lines":1,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_plugin_vite_manifest/src/lib.rs#L78"}]},
{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"negligible","difficulty":"easy","description":"Field type inconsistency for `call_id` across action definitions: `HookTransformCallStart`/`HookTransformCallEnd` use `call_id: String`, while every other hook action (`HookLoadCall*`, `HookResolveIdCall*`, `HookRenderChunk*`) uses `call_id: &'static str`. The transform path uses an owned uuid (`call_id.unwrap_or_default()`), the others use the `\"${call_id}\"` placeholder mechanism. The divergence is intentional at the call sites but makes the action API surface inconsistent and easy to mis-handle for consumers/maintainers.","fix":"Document the reason for the differing types, or unify the transform hook to use the same `${call_id}` placeholder mechanism as the other hooks.","locations":[{"ref":"crates/rolldown_devtools_action/src/definitions/hook_transform_call_start.rs:12","code":"   12 |   pub call_id: String,","lines":1,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_devtools_action/src/definitions/hook_transform_call_start.rs#L12"},{"ref":"crates/rolldown_devtools_action/src/definitions/hook_transform_call_end.rs:12","code":"   12 |   pub call_id: String,","lines":1,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_devtools_action/src/definitions/hook_transform_call_end.rs#L12"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`has_nested_scope_binding` does a full linear scan of every nested scope's binding map of the\nowning module (`scoping().iter_bindings().skip(1).any(|(_, bindings)| bindings.contains_key(name))`)\non every invocation. It is called from the renamer's `accept` closure\n(`is_name_available_with`) for each rejected `name$N` candidate during conflict resolution. In a\nmodule with many nested scopes and many colliding top-level names this becomes quadratic\n(candidates x scopes x bindings) on the renamer hot path (`deconflict_chunk_symbols`). The\nper-module nested-binding name set is recomputed from scratch every time instead of being built\nonce per module and cached.","fix":"Build a per-module `FxHashSet<&str>` (or `FxHashSet<CompactStr>`) of all nested-scope binding\nnames once when the module is first processed for deconfliction, then test membership in O(1)\ninstead of re-walking all scopes for each candidate.","locations":[{"ref":"crates/rolldown/src/utils/renamer.rs:259-265","code":"  259 | fn has_nested_scope_binding(symbol_db: &SymbolRefDb, module_idx: ModuleIdx, name: &str) -> bool {\n  260 |   let Some(db) = &symbol_db[module_idx] else {\n  261 |     return false;\n  262 |   };\n  263 |   // Skip root scope (index 0), check nested scopes only\n  264 |   db.ast_scopes.scoping().iter_bindings().skip(1).any(|(_, bindings)| bindings.contains_key(name))\n  265 | }","lines":7,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/utils/renamer.rs#L259-L265"},{"ref":"crates/rolldown/src/utils/renamer.rs:120-143","code":"  120 |   #[inline]\n  121 |   fn is_name_available_with(\n  122 |     symbol_db: &SymbolRefDb,\n  123 |     entry_module_idx: Option<ModuleIdx>,\n  124 |     candidate_name: &str,\n  125 |     symbol_ref: SymbolRef,\n  126 |     is_original_name: bool,\n  127 |   ) -> bool {\n  128 |     if let Some(entry_idx) = entry_module_idx {\n  129 |       if symbol_ref.owner == entry_idx {\n  130 |         // Entry module symbols can use their original names freely - shadowing is\n  131 |         // handled by reference-based renaming of nested bindings later\n  132 |         return true;\n  133 |       }\n  134 |     }\n  135 | \n  136 |     // Renamed candidates must not conflict with own module's nested bindings\n  137 |     // (original names are allowed to shadow - that's intentional)\n  138 |     if !is_original_name && has_nested_scope_binding(symbol_db, symbol_ref.owner, candidate_name) {\n  139 |       return false;\n  140 |     }\n  141 | \n  142 |     true\n  143 |   }","lines":24,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/utils/renamer.rs#L120-L143"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`ParallelJsPlugin::register_hook_usage` returns `HookUsage::all()` unconditionally, declaring every hook used regardless of which hooks the wrapped plugins actually implement. This defeats the hook-usage optimization (the bundler invokes every hook entry point, which then short-circuits via `first_plugin().<hook>.is_some()` checks) and is inconsistent with `JsPlugin::register_hook_usage` which reports real usage.","fix":"Compute usage from the representative plugin: `HookUsage::from_bits_truncate(self.first_plugin().inner.hook_usage)` (the wrapped plugins are identical copies across workers).","locations":[{"ref":"crates/rolldown/tests/rolldown/plugin/plugin_context/custom_arg_in_resolve/mod.rs:56-58","code":"   56 |   fn register_hook_usage(&self) -> HookUsage {\n   57 |     HookUsage::all()\n   58 |   }","lines":3,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/tests/rolldown/plugin/plugin_context/custom_arg_in_resolve/mod.rs#L56-L58"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"LazyCompilationPlugin::transform_ast runs LazyCompilationRuntimeInjector on EVERY non-proxy module and rewrites EVERY `import(...)` expression into `import(...).then(__unwrap_lazy_compilation_entry)`, plus injects the helper function declaration, regardless of whether the dynamic import actually targets a lazy module. visit_expression (runtime_injector.rs:25-52) matches all ImportExpression nodes unconditionally. This adds a runtime `.then()` allocation/microtask and a helper to every module with dynamic imports in the whole graph, even when lazy compilation is not relevant to that import. It also changes the resolved value semantics of all dynamic imports through the helper wrapper.","fix":"Only wrap/transform dynamic imports whose target is (or may be) a lazy entry, or gate the whole transform on whether any lazy entries exist, to avoid touching unrelated dynamic imports across the entire module graph.","locations":[{"ref":"crates/rolldown_plugin_lazy_compilation/src/lazy_compilation_plugin.rs:190-222","code":"  190 |   async fn transform_ast(\n  191 |     &self,\n  192 |     _ctx: &rolldown_plugin::PluginContext,\n  193 |     mut args: rolldown_plugin::HookTransformAstArgs<'_>,\n  194 |   ) -> rolldown_plugin::HookTransformAstReturn {\n  195 |     // Skip proxy modules (they have their own structure)\n  196 |     if args.id.contains(\"?rolldown-lazy=1\") {\n  197 |       return Ok(args.ast);\n  198 |     }\n  199 | \n  200 |     args.ast.program.with_mut(|fields| {\n  201 |       let mut visitor = LazyCompilationRuntimeInjector::new(fields.allocator);\n  202 |       visitor.visit_program(fields.program);\n  203 | \n  204 |       // Inject helper after directive prologues (e.g., \"use strict\")\n  205 |       if visitor.transformed_count > 0 {\n  206 |         let helper = create_unwrap_lazy_compilation_entry_helper(fields.allocator);\n  207 |         // Find insertion point after directive prologues\n  208 |         let insert_idx = fields\n  209 |           .program\n  210 |           .body\n  211 |           .iter()\n  212 |           .take_while(|stmt| {\n  213 |             matches!(stmt, oxc::ast::ast::Statement::ExpressionStatement(expr_stmt)\n  214 |               if matches!(&expr_stmt.expression, oxc::ast::ast::Expression::StringLiteral(_)))\n  215 |           })\n  216 |           .count();\n  217 |         fields.program.body.insert(insert_idx, helper);\n  218 |       }\n  219 |     });\n  220 | \n  221 |     Ok(args.ast)\n  222 |   }","lines":33,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_plugin_lazy_compilation/src/lazy_compilation_plugin.rs#L190-L222"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`get_internal_imports` does a linear scan over the entire `bundle` for every import filename (nested loop), making it O(imports * bundle_outputs). It is called twice per chunk (for `imports` and `dynamic_imports`) in `create_chunk`, which itself runs for every chunk, giving roughly quadratic behavior in the number of chunks. Additionally `get_chunk_name` is recomputed (with path allocation, normalization and string allocation) on every match. For large bundles this is a real hot spot.","fix":"Build a single `FxHashMap<&str filename, &OutputChunk>` (or filename -> precomputed chunk name) once before the chunk loop and look imports up by key, instead of rescanning the bundle and recomputing chunk names per import.","locations":[{"ref":"crates/rolldown_plugin_vite_manifest/src/utils.rs:94-112","code":"   94 |   fn get_internal_imports(\n   95 |     &self,\n   96 |     bundle: &Vec<Output>,\n   97 |     imports: &Vec<ArcStr>,\n   98 |     is_legacy: bool,\n   99 |   ) -> Vec<String> {\n  100 |     let mut filtered_imports = vec![];\n  101 |     for file in imports {\n  102 |       for output in bundle {\n  103 |         if let Output::Chunk(chunk) = output {\n  104 |           if chunk.filename == *file {\n  105 |             filtered_imports.push(self.get_chunk_name(chunk, is_legacy));\n  106 |             break;\n  107 |           }\n  108 |         }\n  109 |       }\n  110 |     }\n  111 |     filtered_imports\n  112 |   }","lines":19,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_plugin_vite_manifest/src/utils.rs#L94-L112"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`trim_start_pattern`/`trim_end_pattern` compile a fresh `regex::Regex` (`Regex::new(format!(...))`) on every invocation for any non-fast-path pattern, and these are called once per chunk inside the trim loops. For a custom `char_type` and many chunks this recompiles the same regex repeatedly (O(chunks) regex compilations), which dominates trim cost. The common patterns (`\\s`, `[\\r\\n]`) take a fast path, so the default/`trim_lines` cases are unaffected, but custom patterns are quadratic-ish in compilation work.","fix":"Compile the regex once per `trim`/`trim_with` call (e.g. build it in the public entry and pass the compiled `Regex` down), or cache compiled patterns in a thread-local/`OnceLock` keyed by pattern string.","locations":[{"ref":"crates/string_wizard/src/magic_string/trim.rs:211-231","code":"  211 | fn trim_start_pattern<'a>(s: &'a str, pattern: &str) -> &'a str {\n  212 |   // Fast path for common patterns\n  213 |   match pattern {\n  214 |     \"\\\\s\" => return s.trim_start(),\n  215 |     \"[\\\\r\\\\n]\" | \"[\\r\\n]\" => return s.trim_start_matches(['\\r', '\\n']),\n  216 |     _ => {}\n  217 |   }\n  218 | \n  219 |   // Use regex for custom patterns\n  220 |   let regex_pattern = format!(\"^({pattern})+\");\n  221 |   match regex::Regex::new(&regex_pattern) {\n  222 |     Ok(re) => {\n  223 |       if let Some(m) = re.find(s) {\n  224 |         &s[m.end()..]\n  225 |       } else {\n  226 |         s\n  227 |       }\n  228 |     }\n  229 |     Err(_) => s.trim_start(), // Fallback to whitespace on invalid regex\n  230 |   }\n  231 | }","lines":21,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/string_wizard/src/magic_string/trim.rs#L211-L231"},{"ref":"crates/string_wizard/src/magic_string/trim.rs:238-258","code":"  238 | fn trim_end_pattern<'a>(s: &'a str, pattern: &str) -> &'a str {\n  239 |   // Fast path for common patterns\n  240 |   match pattern {\n  241 |     \"\\\\s\" => return s.trim_end(),\n  242 |     \"[\\\\r\\\\n]\" | \"[\\r\\n]\" => return s.trim_end_matches(['\\r', '\\n']),\n  243 |     _ => {}\n  244 |   }\n  245 | \n  246 |   // Use regex for custom patterns\n  247 |   let regex_pattern = format!(\"({pattern})+$\");\n  248 |   match regex::Regex::new(&regex_pattern) {\n  249 |     Ok(re) => {\n  250 |       if let Some(m) = re.find(s) {\n  251 |         &s[..m.start()]\n  252 |       } else {\n  253 |         s\n  254 |       }\n  255 |     }\n  256 |     Err(_) => s.trim_end(), // Fallback to whitespace on invalid regex\n  257 |   }\n  258 | }","lines":21,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/string_wizard/src/magic_string/trim.rs#L238-L258"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`try_extract_parent_static_member_expr_chain` allocates a fresh `Vec<MemberExprProp>` on every\ninvocation, and is called once per resolved root identifier reference during scanning\n(`process_identifier_ref_by_scope`), plus for namespace/default imports it walks the entire\nvisit path (`usize::MAX` / `usize::MAX` max_len). On large modules with many member-expression\nreferences this is a steady stream of small heap allocations on a hot path.","fix":"Consider a reusable scratch buffer on the scanner (like `namespace_name_buf`) or returning a small-vec/iterator, and only build the props vec lazily after confirming the chain is non-trivial.","locations":[{"ref":"crates/rolldown/src/ast_scanner/mod.rs:1035-1070","code":" 1035 |   pub fn try_extract_parent_static_member_expr_chain(\n 1036 |     &self,\n 1037 |     max_len: usize,\n 1038 |   ) -> Option<(NodeId, Span, Vec<MemberExprProp>)> {\n 1039 |     let mut node_id = NodeId::DUMMY;\n 1040 |     let mut span = SPAN;\n 1041 |     let mut props = vec![];\n 1042 |     for ancestor_ast in self.visit_path.iter().rev().take(max_len) {\n 1043 |       match ancestor_ast {\n 1044 |         AstKind::StaticMemberExpression(expr) => {\n 1045 |           node_id = ancestor_ast.node_id();\n 1046 |           span = ancestor_ast.span();\n 1047 |           props.push(MemberExprProp {\n 1048 |             name: expr.property.name.as_str().into(),\n 1049 |             span: expr.property.span(),\n 1050 |             optional: expr.optional,\n 1051 |           });\n 1052 |         }\n 1053 |         AstKind::ComputedMemberExpression(expr) => {\n 1054 |           if let Some(name) = expr.static_property_name() {\n 1055 |             node_id = ancestor_ast.node_id();\n 1056 |             span = ancestor_ast.span();\n 1057 |             props.push(MemberExprProp {\n 1058 |               name: name.into(),\n 1059 |               span: expr.expression.span(),\n 1060 |               optional: expr.optional,\n 1061 |             });\n 1062 |           } else {\n 1063 |             break;\n 1064 |           }\n 1065 |         }\n 1066 |         _ => break,\n 1067 |       }\n 1068 |     }\n 1069 |     (!props.is_empty()).then_some((node_id, span, props))\n 1070 |   }","lines":36,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/ast_scanner/mod.rs#L1035-L1070"},{"ref":"crates/rolldown/src/ast_scanner/impl_visit.rs:545-597","code":"  545 |         if let Some(named_import) = self.result.named_imports.get(&root_symbol_id) {\n  546 |           let (ty, max_tract_len) = match named_import.imported {\n  547 |             rolldown_common::Specifier::Star => {\n  548 |               (MemberExprObjectReferencedType::Namespace, usize::MAX)\n  549 |             }\n  550 |             rolldown_common::Specifier::Literal(ref compact_str)\n  551 |               if compact_str.as_str() == \"default\" =>\n  552 |             {\n  553 |               (MemberExprObjectReferencedType::Default, 2)\n  554 |             }\n  555 |             rolldown_common::Specifier::Literal(_) => {\n  556 |               (MemberExprObjectReferencedType::Named, usize::MAX)\n  557 |             }\n  558 |           };\n  559 |           if let Some((node_id, span, props)) =\n  560 |             self.try_extract_parent_static_member_expr_chain(max_tract_len)\n  561 |           {\n  562 |             if !span.is_unspanned() {\n  563 |               is_inserted_before = true;\n  564 | \n  565 |               if matches!(ty, MemberExprObjectReferencedType::Namespace)\n  566 |                 && is_member_write\n  567 |                 && props[0].name == \"default\"\n  568 |               {\n  569 |                 // Write through namespace default (e.g. `ns.default.a = value`). Since\n  570 |                 // `ns.default` is the raw CJS exports object, any property write on it may\n  571 |                 // affect all `ns.xxx` reads. Mark the symbol so all CJS exports of the target\n  572 |                 // module are bailed out from constant inlining.\n  573 |                 let symbol_ref_flags = root_symbol_id.flags_mut(&mut self.result.symbol_ref_db);\n  574 |                 *symbol_ref_flags |= SymbolRefFlags::HasComputedMemberWrite;\n  575 |               }\n  576 |               self.add_member_expr_reference(MemberExprRef::new(\n  577 |                 root_symbol_id,\n  578 |                 props,\n  579 |                 node_id,\n  580 |                 span,\n  581 |                 ty,\n  582 |                 ident_ref.reference_id.get(),\n  583 |                 is_member_write,\n  584 |               ));\n  585 |             }\n  586 |           } else if is_member_write\n  587 |             && matches!(\n  588 |               ty,\n  589 |               MemberExprObjectReferencedType::Default | MemberExprObjectReferencedType::Namespace\n  590 |             )\n  591 |           {\n  592 |             // Computed member write (e.g. `cjs[name] = value`) where the key is dynamic.\n  593 |             // Mark the import symbol so all CJS exports of the target module won't be inlined.\n  594 |             let symbol_ref_flags = root_symbol_id.flags_mut(&mut self.result.symbol_ref_db);\n  595 |             *symbol_ref_flags |= SymbolRefFlags::HasComputedMemberWrite;\n  596 |           }\n  597 |         }","lines":53,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/ast_scanner/impl_visit.rs#L545-L597"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`merge_entries_aware_subgroups` recomputes a subgroup's total size from scratch (`sum_group_sizes` iterates every module) on every merge, even though both groups' sizes are already tracked incrementally in `EntriesAwareSubgroup::sizes`. With many small subgroups being merged the repeated full re-summation is O(modules) per merge and unnecessary.","fix":"Set `to_group.sizes += from_group.sizes;` instead of `to_group.sizes = sum_group_sizes(&to_group.modules, module_table);` (sizes are already maintained incrementally on insert).","locations":[{"ref":"crates/rolldown/src/stages/generate_stage/manual_code_splitting.rs:705-707","code":"  705 |   to_group.modules.extend(from_group.modules.drain());\n  706 |   to_group.sizes = sum_group_sizes(&to_group.modules, module_table);\n  707 |   to_group.bits.union(&from_group.bits);","lines":3,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/stages/generate_stage/manual_code_splitting.rs#L705-L707"}]},
{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`find_modules_referencing_constants` is called once per cross-module-optimization pass and scans every module's `named_imports`, computing `canonical_ref_for` for each local import symbol and checking membership in `new_constant_refs`. This is O(total named imports) per pass over the whole module table; for projects with many passes (`inline_const.pass > 1`) and large import surfaces it is repeated full scans. The TODO at the top of `cross_module_optimization` already acknowledges missing early-exit optimizations.","fix":"Build a reverse index (constant canonical ref -> importing modules) once, or restrict the scan to modules that import from modules where new constants were discovered.","locations":[{"ref":"crates/rolldown/src/stages/link_stage/cross_module_optimization.rs:132-153","code":"  132 |   fn find_modules_referencing_constants(\n  133 |     &self,\n  134 |     new_constant_refs: &FxHashSet<SymbolRef>,\n  135 |   ) -> FxHashSet<ModuleIdx> {\n  136 |     if new_constant_refs.is_empty() {\n  137 |       return FxHashSet::default();\n  138 |     }\n  139 | \n  140 |     self\n  141 |       .module_table\n  142 |       .iter()\n  143 |       .filter_map(|module| {\n  144 |         let normal_module = module.as_normal()?;\n  145 |         // Check if any of the module's named imports resolve to a newly discovered constant\n  146 |         let references_new_constant = normal_module.named_imports.keys().any(|local_symbol_ref| {\n  147 |           let canonical_ref = self.symbols.canonical_ref_for(*local_symbol_ref);\n  148 |           new_constant_refs.contains(&canonical_ref)\n  149 |         });\n  150 |         references_new_constant.then_some(normal_module.idx)\n  151 |       })\n  152 |       .collect()\n  153 |   }","lines":22,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/stages/link_stage/cross_module_optimization.rs#L132-L153"}]},
{"id":"PERF_9","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In `render_chunk_exports` (ESM branch) `export_items` is collected into a `Vec`, then mapped into\nanother `Vec<Cow<str>>` (`rendered_items`), and finally joined manually into the output string via\na per-item loop. The intermediate `rendered_items` allocation is unnecessary; the items could be\nwritten straight into `s` while tracking the separator, saving a `Vec` allocation and a second\npass per chunk.","fix":"Write each rendered export directly into `s` inside the iteration (emitting \", \" before all but the\nfirst), dropping the `rendered_items` `Vec`.","locations":[{"ref":"crates/rolldown/src/utils/chunk/render_chunk_exports.rs:213-254","code":"  213 |       let mut s = String::new();\n  214 |       let rendered_items = export_items\n  215 |         .into_iter()\n  216 |         .map(|(exported_name, export_ref)| {\n  217 |           let canonical_ref = link_output.symbol_db.canonical_ref_for(export_ref);\n  218 |           let symbol = link_output.symbol_db.get(canonical_ref);\n  219 |           let canonical_name = link_output\n  220 |             .symbol_db\n  221 |             .canonical_name_for_or_original(canonical_ref, &chunk.canonical_names);\n  222 |           if let Some(ns_alias) = &symbol.namespace_alias {\n  223 |             let canonical_ns_name = link_output\n  224 |               .symbol_db\n  225 |               .canonical_name_for_or_original(ns_alias.namespace_ref, &chunk.canonical_names);\n  226 |             let property_name = &ns_alias.property_name;\n  227 |             s.push_str(\"var \");\n  228 |             s.push_str(canonical_name);\n  229 |             s.push_str(\" = \");\n  230 |             s.push_str(canonical_ns_name);\n  231 |             s.push('.');\n  232 |             s.push_str(property_name);\n  233 |             s.push_str(\";\\n\");\n  234 |           }\n  235 | \n  236 |           if canonical_name == exported_name {\n  237 |             Cow::Borrowed(canonical_name)\n  238 |           } else {\n  239 |             Cow::Owned(concat_string!(\n  240 |               canonical_name,\n  241 |               \" as \",\n  242 |               to_module_import_export_name(&exported_name)\n  243 |             ))\n  244 |           }\n  245 |         })\n  246 |         .collect::<Vec<_>>();\n  247 |       s.push_str(\"export { \");\n  248 |       for (i, item) in rendered_items.iter().enumerate() {\n  249 |         if i > 0 {\n  250 |           s.push_str(\", \");\n  251 |         }\n  252 |         s.push_str(item);\n  253 |       }\n  254 |       s.push_str(\" };\");","lines":42,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/utils/chunk/render_chunk_exports.rs#L213-L254"}]},
{"id":"PERF_10","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`get_module_loader_from_file_extension` iterates over every `.` byte in the module id via\n`memchr_iter` and, for each, hashes and looks up the substring after that dot\n(`module_types.get(&id[i+1..])`). For a long path with many dots this performs many redundant\nhashmap lookups over progressively shorter suffixes. The first dot in a path component also makes\nit match across directory separators (e.g. a dotted directory name), though the registered keys\nare normal extensions so a false match is unlikely in practice.","fix":"Restrict the scan to the final path component (split on the last separator first) and/or stop after\nthe first registered match measured from the rightmost extension, reducing lookups and avoiding\ncross-separator matches.","locations":[{"ref":"crates/rolldown/src/utils/load_source.rs:147-158","code":"  147 | fn get_module_loader_from_file_extension<S: AsRef<str>>(\n  148 |   id: S,\n  149 |   module_types: &FxHashMap<Cow<'static, str>, ModuleType>,\n  150 | ) -> Option<ModuleType> {\n  151 |   let id = id.as_ref();\n  152 |   for i in memchr::memchr_iter(b'.', id.as_bytes()) {\n  153 |     if let Some(ty) = module_types.get(&id[i + 1..]) {\n  154 |       return Some(ty.clone());\n  155 |     }\n  156 |   }\n  157 |   None\n  158 | }","lines":12,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/utils/load_source.rs#L147-L158"}]},
{"id":"PERF_11","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"Source-map getters (`file`, `sources`, `sources_content`, `names`, `mappings`, `x_google_ignore_list`) each `.clone()` the underlying Vec/String on every JS property access. For large bundles these are large allocations re-done on every getter read, and `mappings` in particular can be very large.","fix":"Return references where napi allows (e.g. `&str`), or cache/move the JSON fields once instead of cloning per access.","locations":[{"ref":"crates/rolldown_binding/src/types/binding_magic_string.rs:275-308","code":"  275 |   #[napi(getter)]\n  276 |   pub fn file(&self) -> Option<String> {\n  277 |     self.json.file.clone()\n  278 |   }\n  279 | \n  280 |   /// The list of original source files.\n  281 |   #[napi(getter)]\n  282 |   pub fn sources(&self) -> Vec<String> {\n  283 |     self.json.sources.clone()\n  284 |   }\n  285 | \n  286 |   /// The original source contents (if `includeContent` was true).\n  287 |   #[napi(getter)]\n  288 |   pub fn sources_content(&self) -> Vec<Option<String>> {\n  289 |     self.json.sources_content.clone().unwrap_or_default()\n  290 |   }\n  291 | \n  292 |   /// The list of symbol names used in mappings.\n  293 |   #[napi(getter)]\n  294 |   pub fn names(&self) -> Vec<String> {\n  295 |     self.json.names.clone()\n  296 |   }\n  297 | \n  298 |   /// The VLQ-encoded mappings string.\n  299 |   #[napi(getter)]\n  300 |   pub fn mappings(&self) -> String {\n  301 |     self.json.mappings.clone()\n  302 |   }\n  303 | \n  304 |   /// The list of source indices that should be excluded from debugging.\n  305 |   #[napi(getter, js_name = \"x_google_ignoreList\")]\n  306 |   pub fn x_google_ignore_list(&self) -> Option<Vec<u32>> {\n  307 |     self.json.x_google_ignore_list.clone()\n  308 |   }","lines":34,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_binding/src/types/binding_magic_string.rs#L275-L308"},{"ref":"crates/rolldown_binding/src/types/binding_magic_string.rs:342-402","code":"  342 |   /// The generated file name.\n  343 |   #[napi(getter)]\n  344 |   pub fn file(&self) -> Option<String> {\n  345 |     self.json.file.clone()\n  346 |   }\n  347 | \n  348 |   /// The list of original source files.\n  349 |   #[napi(getter)]\n  350 |   pub fn sources(&self) -> Vec<String> {\n  351 |     self.json.sources.clone()\n  352 |   }\n  353 | \n  354 |   /// The original source contents (if `includeContent` was true).\n  355 |   #[napi(getter)]\n  356 |   pub fn sources_content(&self) -> Vec<Option<String>> {\n  357 |     self.json.sources_content.clone().unwrap_or_default()\n  358 |   }\n  359 | \n  360 |   /// The list of symbol names used in mappings.\n  361 |   #[napi(getter)]\n  362 |   pub fn names(&self) -> Vec<String> {\n  363 |     self.json.names.clone()\n  364 |   }\n  365 | \n  366 |   /// The decoded mappings as an array of line arrays.\n  367 |   /// Each line is an array of segments, where each segment is [generatedColumn, sourceIndex, originalLine, originalColumn, nameIndex?].\n  368 |   #[napi(getter)]\n  369 |   pub fn mappings(&self) -> Vec<Vec<Vec<i64>>> {\n  370 |     let mut lines: Vec<Vec<Vec<i64>>> = Vec::new();\n  371 | \n  372 |     for token in self.inner.get_tokens() {\n  373 |       // Fill in empty lines if needed\n  374 |       while lines.len() <= token.get_dst_line() as usize {\n  375 |         lines.push(Vec::new());\n  376 |       }\n  377 | \n  378 |       let current_line = token.get_dst_line();\n  379 | \n  380 |       let mut segment: Vec<i64> = vec![i64::from(token.get_dst_col())];\n  381 | \n  382 |       if let Some(source_id) = token.get_source_id() {\n  383 |         segment.push(i64::from(source_id));\n  384 |         segment.push(i64::from(token.get_src_line()));\n  385 |         segment.push(i64::from(token.get_src_col()));\n  386 | \n  387 |         if let Some(name_id) = token.get_name_id() {\n  388 |           segment.push(i64::from(name_id));\n  389 |         }\n  390 |       }\n  391 | \n  392 |       lines[current_line as usize].push(segment);\n  393 |     }\n  394 | \n  395 |     lines\n  396 |   }\n  397 | \n  398 |   /// The list of source indices that should be excluded from debugging.\n  399 |   #[napi(getter, js_name = \"x_google_ignoreList\")]\n  400 |   pub fn x_google_ignore_list(&self) -> Option<Vec<u32>> {\n  401 |     self.json.x_google_ignore_list.clone()\n  402 |   }","lines":61,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_binding/src/types/binding_magic_string.rs#L342-L402"}]},
{"id":"PERF_12","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`napi_error.rs` does a redundant double downcast in both `resolve_error` and `load_error`: it calls `err.downcast_ref::<napi::Error>().is_some()` and then, inside the branch, `err.downcast::<napi::Error>().unwrap()`, re-doing the type check. The first borrow is wasted and the `.unwrap()` is a latent footgun if the two lines drift apart.","fix":"Use a single fallible `match err.downcast::<napi::Error>() { Ok(cause) => ..., Err(err) => ... }`.","locations":[{"ref":"crates/rolldown_binding/src/utils/napi_error.rs:2-6","code":"    2 |   if err.downcast_ref::<napi::Error>().is_some() {\n    3 |     let mut new_err =\n    4 |       napi::Error::from_reason(format!(\"Errored while resolving {specifier:?} in `this.resolve`.\"));\n    5 |     new_err.set_cause(err.downcast::<napi::Error>().unwrap());\n    6 |     new_err","lines":5,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_binding/src/utils/napi_error.rs#L2-L6"},{"ref":"crates/rolldown_binding/src/utils/napi_error.rs:15-19","code":"   15 |   if err.downcast_ref::<napi::Error>().is_some() {\n   16 |     let mut new_err =\n   17 |       napi::Error::from_reason(format!(\"Errored while load {specifier:?} in `this.load`.\"));\n   18 |     new_err.set_cause(err.downcast::<napi::Error>().unwrap());\n   19 |     new_err","lines":5,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_binding/src/utils/napi_error.rs#L15-L19"}]},
{"id":"PERF_13","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"In `FilenameTemplate::render`, `let extname = if ext.is_empty() { \"\" } else { &format!(\".{ext}\") };` borrows a\ntemporary `String` (kept alive by temporary-lifetime extension). The `format!` allocation is created solely to take\na `&str` from it and the `&format!(...)` borrow pattern is fragile.","fix":"Bind an owned `String`: `let extname = if ext.is_empty() { String::new() } else { format!(\".{ext}\") };` then `tmp.replace_all(\"[extname]\", &extname)`.","locations":[{"ref":"crates/rolldown_common/src/inner_bundler_options/types/filename_template.rs:99-103","code":"   99 |     if let Some(ext) = extension {\n  100 |       let extname = if ext.is_empty() { \"\" } else { &format!(\".{ext}\") };\n  101 |       tmp = tmp.replace_all(\"[ext]\", ext);\n  102 |       tmp = tmp.replace_all(\"[extname]\", extname);\n  103 |     }","lines":5,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_common/src/inner_bundler_options/types/filename_template.rs#L99-L103"}]},
{"id":"PERF_14","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`PathsOutputOption::resolve_all` on the `FxHashMap` variant does `map.clone()` only to wrap the same map back into the\nsame variant, cloning every path string even when no async resolution is needed. Callers that only need lookups pay a\nfull HashMap clone.","fix":"Return `Cow` / take `self` by value where possible, or special-case the `FxHashMap` variant in callers to avoid the clone.","locations":[{"ref":"crates/rolldown_common/src/inner_bundler_options/types/output_option/paths.rs:39-51","code":"   39 |   pub async fn resolve_all<'a>(&self, ids: impl Iterator<Item = &'a str>) -> PathsOutputOption {\n   40 |     match self {\n   41 |       Self::FxHashMap(map) => Self::FxHashMap(map.clone()),\n   42 |       Self::Fn(f) => {\n   43 |         let mut resolved = FxHashMap::default();\n   44 |         for id in ids {\n   45 |           if let Ok(path) = f(id).await {\n   46 |             resolved.insert(id.to_string(), path);\n   47 |           }\n   48 |         }\n   49 |         Self::FxHashMap(resolved)\n   50 |       }\n   51 |     }","lines":13,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_common/src/inner_bundler_options/types/output_option/paths.rs#L39-L51"}]},
{"id":"PERF_15","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`to_module_info` pushes one `CompactStr::new(\"*\")` per export-star import record, producing duplicate `\"*\"` entries\nin the public `ModuleInfo.exports` list when a module has multiple `export * from` statements. Rollup exposes a\nsingle `\"*\"`. This both allocates redundantly and exposes a misleading deduped-looking list to plugins.","fix":"Collect star-export presence as a boolean and push a single `\"*\"` if any export-star record exists, instead of mapping each record to a separate `\"*\"`.","locations":[{"ref":"crates/rolldown_common/src/module/normal_module.rs:95-114","code":"   95 |       exports: {\n   96 |         let mut exports = self.ecma_view.named_exports.keys().cloned().collect_vec();\n   97 |         if let Some(e) = raw_import_records {\n   98 |           exports.extend(\n   99 |             e.iter()\n  100 |               .filter(|&rec| rec.meta.contains(ImportRecordMeta::IsExportStar))\n  101 |               .map(|_| CompactStr::new(\"*\")),\n  102 |           );\n  103 |         } else {\n  104 |           exports.extend(\n  105 |             self\n  106 |               .ecma_view\n  107 |               .import_records\n  108 |               .iter()\n  109 |               .filter(|&rec| rec.meta.contains(ImportRecordMeta::IsExportStar))\n  110 |               .map(|_| CompactStr::new(\"*\")),\n  111 |           );\n  112 |         }\n  113 |         exports\n  114 |       },","lines":20,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_common/src/module/normal_module.rs#L95-L114"}]},
{"id":"PERF_16","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`ImportedExports::merge` does `lhs.extend(rhs.clone())`, which allocates a full copy of the `rhs` `FxHashSet` and\nthen drops it. `extend(rhs.iter().cloned())` clones only the elements being inserted without the extra set allocation.","fix":"Replace `lhs.extend(rhs.clone())` with `lhs.extend(rhs.iter().cloned())`.","locations":[{"ref":"crates/rolldown_common/src/types/lazy_barrel.rs:98-104","code":"   98 |   pub fn merge(&mut self, other: &Self) {\n   99 |     match (&mut *self, other) {\n  100 |       (Self::All, _) => {}\n  101 |       (_, Self::All) => *self = Self::All,\n  102 |       (Self::Partial(lhs), Self::Partial(rhs)) => lhs.extend(rhs.clone()),\n  103 |     }\n  104 |   }","lines":7,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_common/src/types/lazy_barrel.rs#L98-L104"}]},
{"id":"PERF_17","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`extract_context_variables_from_action` is called for every devtools event and recursively visits every string value in the action payload, including large code/content strings inside arrays (e.g. `AssetsReady.assets[].content`, `HookRenderChunkStart.content`, module/chunk lists). Since real placeholders only ever occur at top level (build_id/session_id/call_id/trigger), scanning megabytes of user code on the hot formatting path is wasted work. It can also misfire: a content string that is exactly `${...}` would be wrongly treated as a context variable.","fix":"Only scan the top-level object for placeholders (placeholders are never nested), avoiding recursion into large content payloads.","locations":[{"ref":"crates/rolldown_devtools/src/devtools_formatter.rs:98-119","code":"   98 | pub fn extract_context_variables_from_action(meta: &serde_json::Value) -> FxHashSet<String> {\n   99 |   fn visit(meta: &serde_json::Value, context_variables: &mut FxHashSet<String>) {\n  100 |     if let serde_json::Value::Object(map) = meta {\n  101 |       for (_key, value) in map {\n  102 |         match value {\n  103 |           serde_json::Value::String(value) if value.starts_with(\"${\") && value.ends_with('}') => {\n  104 |             // Check if the value is a placeholder for provided data\n  105 |             {\n  106 |               let var_name = &value[2..value.len() - 1];\n  107 |               context_variables.insert(var_name.to_string());\n  108 |             }\n  109 |           }\n  110 |           _ => visit(value, context_variables),\n  111 |         }\n  112 |       }\n  113 |     }\n  114 |   }\n  115 | \n  116 |   let mut contextual_fields = FxHashSet::default();\n  117 |   visit(meta, &mut contextual_fields);\n  118 |   contextual_fields\n  119 | }","lines":22,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_devtools/src/devtools_formatter.rs#L98-L119"}]},
{"id":"PERF_18","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"IsolatedDeclarationPlugin::transform_ast, for every TS/TSX module, walks the AST to collect type-only import specifiers and then for each specifier performs an async `ctx.resolve` followed by `ctx.load` (lines 40-45). This forces full resolution and loading of every type-only dependency of every TS module during transform, which is comparatively expensive per-module work performed on the critical transform path. The loaded result is discarded (only used to ensure the module is in the graph for declaration emit).","fix":"Cache/deduplicate resolution+load of type-only specifiers (e.g. across modules) or load lazily only when isolated-declarations actually needs the referenced module, instead of eagerly resolving+loading every type import on every TS module transform.","locations":[{"ref":"crates/rolldown_plugin_isolated_declaration/src/lib.rs:34-45","code":"   34 |       let type_import_specifiers = args.ast.program.with_mut(|fields| {\n   35 |         let mut visitor = TypeImportVisitor { imported: vec![].into_in(fields.allocator) };\n   36 |         visitor.visit_program(fields.program);\n   37 |         visitor.imported\n   38 |       });\n   39 | \n   40 |       for specifier in type_import_specifiers {\n   41 |         let resolved_id = ctx.resolve(&specifier, Some(args.id), None).await??;\n   42 |         if matches!(resolved_id.external, ResolvedExternal::Bool(false)) {\n   43 |           ctx.load(&resolved_id.id, None, resolved_id.module_def_format).await?;\n   44 |         }\n   45 |       }","lines":12,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_plugin_isolated_declaration/src/lib.rs#L34-L45"}]},
{"id":"PERF_19","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`accumulate_sourcemap_data_size` counts collection sizes with `.count()` on `get_names()`/`get_sources()`/`get_tokens()`. `Iterator::count()` is not specialized for `ExactSizeIterator`, so each call fully traverses the underlying Vec; `get_tokens().count()` walks every token of every appended sourcemap purely to pre-size the builder, an extra O(total_tokens) pass in the bundling hot path on top of the traversal `join()` already performs.","fix":"Use a length accessor (e.g. `ExactSizeIterator::len()` if available, or an upstream count API) to size the builder in O(1) instead of re-walking every token.","locations":[{"ref":"crates/rolldown_sourcemap/src/source_joiner.rs:93-99","code":"   93 |   fn accumulate_sourcemap_data_size(&mut self, hint: &SourceMap) {\n   94 |     self.enable_sourcemap = true;\n   95 |     self.names_len += hint.get_names().count();\n   96 |     self.sources_len += hint.get_sources().count();\n   97 |     self.tokens_len += hint.get_tokens().count();\n   98 |     self.token_chunks_len += 1;\n   99 |   }","lines":7,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_sourcemap/src/source_joiner.rs#L93-L99"}]},
{"id":"PERF_20","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`WatchTask::is_watched_file` allocates a fresh `String` via `path.replace('\\\\', \"/\")` on every\ncall on Windows, even when the fast-path `contains` already succeeded for most paths. Since this is\ninvoked once per changed file per task during every debounce flush, the allocation is avoidable for\nthe common (forward-slash / already-watched) case. Minor, Windows-only.","fix":"Only compute the normalized form when `path` actually contains a backslash, or normalize watched paths once at insertion time so lookups never need to reallocate.","locations":[{"ref":"crates/rolldown_watcher/src/watch_task.rs:356-368","code":"  356 |   fn is_watched_file(&self, path: &str) -> bool {\n  357 |     if self.watched_files.contains(path) {\n  358 |       return true;\n  359 |     }\n  360 | \n  361 |     // Windows path normalization\n  362 |     #[cfg(windows)]\n  363 |     if self.watched_files.contains(path.replace('\\\\', \"/\").as_str()) {\n  364 |       return true;\n  365 |     }\n  366 | \n  367 |     false\n  368 |   }","lines":13,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_watcher/src/watch_task.rs#L356-L368"}]},
{"id":"PERF_21","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`enter_scope`/`leave_scope` recompute `TopLevel` and `IsRootLevel` by iterating the entire `scope_stack` (`.iter().rev().all(...)`) on every scope push/pop. For deeply nested code this is O(depth) per scope transition, i.e. O(depth^2) overall during a traversal. The flags could be maintained incrementally.","fix":"Track counts of non-top/non-block scopes incrementally (increment on enter, decrement on leave) and set the flags from those counts instead of rescanning the stack each time.","locations":[{"ref":"crates/rolldown/src/module_finalizers/impl_visit_mut.rs:118-142","code":"  118 |   fn enter_scope(\n  119 |     &mut self,\n  120 |     flags: oxc::semantic::ScopeFlags,\n  121 |     _scope_id: &std::cell::Cell<Option<oxc::semantic::ScopeId>>,\n  122 |   ) {\n  123 |     self.scope_stack.push(flags);\n  124 |     self.state.set(\n  125 |       TraverseState::TopLevel,\n  126 |       self.scope_stack.iter().rev().all(|flag| flag.is_block() || flag.is_top()),\n  127 |     );\n  128 |     self\n  129 |       .state\n  130 |       .set(TraverseState::IsRootLevel, self.scope_stack.iter().rev().all(|flag| flag.is_top()));\n  131 |   }\n  132 | \n  133 |   fn leave_scope(&mut self) {\n  134 |     self.scope_stack.pop();\n  135 |     self.state.set(\n  136 |       TraverseState::TopLevel,\n  137 |       self.scope_stack.iter().rev().all(|flag| flag.is_block() || flag.is_top()),\n  138 |     );\n  139 |     self\n  140 |       .state\n  141 |       .set(TraverseState::IsRootLevel, self.scope_stack.iter().rev().all(|flag| flag.is_top()));\n  142 |   }","lines":25,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/module_finalizers/impl_visit_mut.rs#L118-L142"}]},
{"id":"PERF_22","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`Renamer::new` allocates a `Vec` of `&str` (`manual_reserved`), then `extend`s it with two more\nentries, only to immediately consume it via `iter().chain(...).map(CompactStr::new)`. The\nintermediate `Vec` and the `extend` are avoidable; the format-specific reserved names could be\nchained as iterators directly into the `ConflictResolver::new` argument.","fix":"Build the reserved-name iterator by chaining slices (e.g.\n`base_reserved.iter().chain([\"Object\",\"Promise\"].iter()).chain(RESERVED_KEYWORDS.iter())...`)\nwithout the intermediate `Vec`/`extend`.","locations":[{"ref":"crates/rolldown/src/utils/renamer.rs:36-53","code":"   36 |     let mut manual_reserved = match format {\n   37 |       OutputFormat::Esm => vec![],\n   38 |       OutputFormat::Cjs => vec![\"module\", \"require\", \"__filename\", \"__dirname\", \"exports\"],\n   39 |       OutputFormat::Iife | OutputFormat::Umd => vec![\"exports\"], // Also for AMD, but we don't support it yet.\n   40 |     };\n   41 |     // https://github.com/rollup/rollup/blob/bfbea66569491f5466fbba99de2ba6a0225f851b/src/Chunk.ts#L1359\n   42 |     manual_reserved.extend([\"Object\", \"Promise\"]);\n   43 | \n   44 |     Self {\n   45 |       canonical_names: FxHashMap::default(),\n   46 |       symbol_db,\n   47 |       resolver: ConflictResolver::new(\n   48 |         manual_reserved\n   49 |           .iter()\n   50 |           .chain(RESERVED_KEYWORDS.iter())\n   51 |           .chain(GLOBAL_OBJECTS.iter())\n   52 |           .map(|s| CompactStr::new(s)),\n   53 |       ),","lines":18,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/utils/renamer.rs#L36-L53"}]},
{"id":"PERF_23","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"In the `moduleSideEffects` function branch, `id` is created as an owned `String` via `id.to_string()` and then passed as `id.clone()` to `invoke_async`, allocating a second copy needlessly. The closure is `move` and `id` is not used afterward.","fix":"Pass `id` directly instead of `id.clone()`.","locations":[{"ref":"crates/rolldown_binding/src/options/binding_input_options/binding_treeshake.rs:83-91","code":"   83 |           let id = id.to_string();\n   84 |           let ts_fn = Arc::clone(&ts_fn);\n   85 |           Box::pin(async move {\n   86 |             ts_fn\n   87 |               .invoke_async((id.clone(), is_external).into())\n   88 |               .await\n   89 |               .context(\"treeshake.moduleSideEffects option\")\n   90 |               .map_err(anyhow::Error::from)\n   91 |           })","lines":9,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_binding/src/options/binding_input_options/binding_treeshake.rs#L83-L91"}]},
{"id":"PERF_24","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`contains_script_closing_tag` constructs a fresh `memchr::memmem::Finder` and re-scans from the start of the shrinking `remaining` slice in a loop, advancing only by `pos + 2`. This is still O(n) but does redundant re-slicing/re-search versus iterating over the original buffer with absolute offsets.","fix":"Use `Finder::find_iter(source)` and index `source[pos..pos+8]` with bounds checks, avoiding repeated re-slicing of `remaining`.","locations":[{"ref":"crates/rolldown_ecmascript_utils/src/source_utils.rs:2-16","code":"    2 | pub fn contains_script_closing_tag(source: &[u8]) -> bool {\n    3 |   // Use memchr to find `\"<\/\"` (start of a closing tag), then check if followed by `script` (case insensitive)\n    4 |   let finder = memchr::memmem::Finder::new(b\"<\/\");\n    5 |   let mut remaining = source;\n    6 |   while let Some(pos) = finder.find(remaining) {\n    7 |     // Check if there's enough bytes for `<\/script` (8 bytes)\n    8 |     if remaining.len() >= pos + 8 {\n    9 |       if is_script_close_tag(&remaining[pos..pos + 8]) {\n   10 |         return true;\n   11 |       }\n   12 |     }\n   13 |     // Move past the current `<\/` to continue searching\n   14 |     remaining = &remaining[pos + 2..];\n   15 |   }\n   16 |   false","lines":15,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_ecmascript_utils/src/source_utils.rs#L2-L16"}]},
{"id":"PERF_25","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`update_options` allocates a fresh `String` for every options field (`str.value.to_string()`, `str.value.as_str().to_string()`) and the query object branch calls `v.value.to_string()` (NumericLiteral) producing a temporary that is then borrowed via `&v.value.to_string()` only to be written immediately. These are per-`import.meta.glob`-call allocations that could be avoided/reduced, though impact is small.","fix":"Where lifetimes allow, store borrowed `&str`/`Cow` and `write!` numeric values directly into the buffer instead of allocating intermediate `String`s.","locations":[{"ref":"crates/rolldown_plugin_vite_import_glob/src/utils.rs:624-641","code":"  624 |               let value = match &p.value {\n  625 |                 Expression::StringLiteral(v) => v.value.as_str(),\n  626 |                 Expression::BooleanLiteral(v) => {\n  627 |                   if v.value {\n  628 |                     \"true\"\n  629 |                   } else {\n  630 |                     \"false\"\n  631 |                   }\n  632 |                 }\n  633 |                 Expression::NumericLiteral(v) => &v.value.to_string(),\n  634 |                 Expression::NullLiteral(_) => \"null\",\n  635 |                 _ => continue,\n  636 |               };\n  637 | \n  638 |               if query_string.len() != 1 {\n  639 |                 query_string.push('&');\n  640 |               }\n  641 |               write!(query_string, \"{key}={value}\").unwrap();","lines":18,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_plugin_vite_import_glob/src/utils.rs#L624-L641"}]},
{"id":"PERF_26","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"In the reporter `write_bundle`, the entries are filtered per group inside the loop with `log_entries.iter().filter(|e| e.group == group).collect::<Vec<_>>()` for each of the three groups, allocating three temporary vectors and scanning all entries three times. Minor for typical bundle sizes.","fix":"Partition entries by group once (e.g. into three vectors or a single stable sort by group then size) instead of filtering per group.","locations":[{"ref":"crates/rolldown_plugin_vite_reporter/src/lib.rs:225-230","code":"  225 |       for group in utils::GROUPS {\n  226 |         let mut filtered = log_entries.iter().filter(|e| e.group == group).collect::<Vec<_>>();\n  227 |         if filtered.is_empty() {\n  228 |           continue;\n  229 |         }\n  230 |         filtered.sort_by_key(|a| a.size);","lines":6,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_plugin_vite_reporter/src/lib.rs#L225-L230"}]},
{"id":"PERF_27","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"`to_base64` allocates `Vec::with_capacity(16)` to encode a `u32`, but a `u32` in base-64 needs at most 6 digits. Harmless over-allocation but inaccurate.","fix":"Use `Vec::with_capacity(6)` or encode into a fixed `[u8; 6]` buffer.","locations":[{"ref":"crates/rolldown_utils/src/hash_placeholder.rs:88-103","code":"   88 | pub fn to_base64(mut value: u32) -> String {\n   89 |   let mut buffer = Vec::with_capacity(16);\n   90 | \n   91 |   loop {\n   92 |     let current_digit = value % BASE;\n   93 |     buffer.push(CHARS[current_digit as usize]);\n   94 |     value /= BASE;\n   95 | \n   96 |     if value == 0 {\n   97 |       break;\n   98 |     }\n   99 |   }\n  100 |   buffer.reverse();\n  101 |   // SAFETY: `buffer` is base64 characters, it is valid utf8 characters\n  102 |   unsafe { String::from_utf8_unchecked(buffer) }\n  103 | }","lines":16,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_utils/src/hash_placeholder.rs#L88-L103"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`impl From<[bool; RESOLVER_COUNT as usize]>` (RESOLVER_COUNT = 4) takes a\n`[bool; 4]` but `AdditionalOptions` has only 2 boolean fields; the impl reads\nonly indices 0 and 1, ignoring 2 and 3. The only caller `u8_to_bools(value).into()`\ninfers N = 4 purely to satisfy this impl. The array is mis-sized (semantically\nshould be ADDITIONAL_OPTIONS_FIELD_COUNT = 2); confusing and fragile if a field\nis added.","fix":"Size the array as `[bool; ADDITIONAL_OPTIONS_FIELD_COUNT as usize]`, or construct directly in `From<u8>`.","locations":[{"ref":"crates/rolldown_plugin_vite_resolve/src/resolver.rs:68-76","code":"   68 | impl From<[bool; RESOLVER_COUNT as usize]> for AdditionalOptions {\n   69 |   fn from(value: [bool; RESOLVER_COUNT as usize]) -> Self {\n   70 |     Self { is_require: value[0], prefer_relative: value[1] }\n   71 |   }\n   72 | }\n   73 | \n   74 | impl From<u8> for AdditionalOptions {\n   75 |   fn from(value: u8) -> Self {\n   76 |     u8_to_bools(value).into()","lines":9,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_plugin_vite_resolve/src/resolver.rs#L68-L76"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"`CreateEcmaViewReturn` / `create_ecma_view` destructures `cjs_reexport_require_node_ids: _` from the scan result and discards it, while keeping `cjs_reexport_import_record_ids`. If `cjs_reexport_require_node_ids` is never consumed anywhere, producing it in the scanner is wasted work; if it is consumed elsewhere via a different path, the discard here is fine. Worth confirming it is not silently dropped data that some format path needs.","fix":"Confirm `cjs_reexport_require_node_ids` is intentionally unused here; if it is unused project-wide, stop computing it in the scanner.","locations":[{"ref":"crates/rolldown/src/ecmascript/ecma_module_view_factory.rs:93-95","code":"   93 |     cjs_reexport_require_node_ids: _,\n   94 |     cjs_reexport_import_record_ids,\n   95 |   } = scan_result;","lines":3,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/ecmascript/ecma_module_view_factory.rs#L93-L95"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"Redundant `dependencies.reserve(1)` immediately after `Vec::with_capacity(externals.len())` and before a single `push`. The capacity already covers the externals; the extra `reserve(1)` for the single `'exports'`/`exports` element is a no-op-ish micro-optimization that just adds noise (appears in both `render_amd_dependencies` and `render_cjs_dependencies`).","fix":"Drop the `dependencies.reserve(1);` calls (or fold the +1 into the initial `with_capacity`).","locations":[{"ref":"crates/rolldown/src/ecmascript/format/umd.rs:145-149","code":"  145 |   let mut dependencies = Vec::with_capacity(externals.len());\n  146 |   if has_exports {\n  147 |     dependencies.reserve(1);\n  148 |     dependencies.push(\"'exports'\".to_string());\n  149 |   }","lines":5,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/ecmascript/format/umd.rs#L145-L149"},{"ref":"crates/rolldown/src/ecmascript/format/umd.rs:165-169","code":"  165 |   let mut dependencies = Vec::with_capacity(externals.len());\n  166 |   if has_exports {\n  167 |     dependencies.reserve(1);\n  168 |     dependencies.push(\"exports\".to_string());\n  169 |   }","lines":5,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/ecmascript/format/umd.rs#L165-L169"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"`WatcherState::is_closing_or_closed` and `WatcherState::debounce_deadline` are both `#[cfg(test)]`\nand additionally annotated `#[expect(dead_code)]`, i.e. they are unused even by tests. They are\ndead test helpers and can be removed.","fix":"Delete the two unused `#[cfg(test)]` helper methods.","locations":[{"ref":"crates/rolldown_watcher/src/watcher_state.rs:105-119","code":"  105 |   #[cfg(test)]\n  106 |   #[expect(dead_code)]\n  107 |   pub fn is_closing_or_closed(&self) -> bool {\n  108 |     matches!(self, WatcherState::Closing | WatcherState::Closed)\n  109 |   }\n  110 | \n  111 |   /// Get the debounce deadline if in debouncing state\n  112 |   #[cfg(test)]\n  113 |   #[expect(dead_code)]\n  114 |   pub fn debounce_deadline(&self) -> Option<Instant> {\n  115 |     match self {\n  116 |       WatcherState::Debouncing { deadline, .. } => Some(*deadline),\n  117 |       _ => None,\n  118 |     }\n  119 |   }","lines":15,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_watcher/src/watcher_state.rs#L105-L119"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"medium","difficulty":"medium","description":"Module `size` is set from the SOURCE module code length\n(`module_info.code.len()`), but is repeatedly presented as output size:\nfield/headers say \"Output Bytes\", \"% of Total\" (of total OUTPUT size),\n\"bytes contributed to the output bundle\", and \"[OUTPUT_BYTES:\". Source size\ndoes not equal a module's contribution to the final bundle (after\ntree-shaking, minification, transforms), so the report mislabels source bytes\nas output bytes and the per-module percentages of total output size are\nmeaningless.","fix":"Relabel these as \"Source Bytes\"/\"input size\", or compute true per-module output\ncontribution; do not divide source-module sizes by total OUTPUT chunk size.","locations":[{"ref":"crates/rolldown_plugin_bundle_analyzer/src/lib.rs:159-168","code":"  159 |           let module_info = ctx.get_module_info(module_id.as_str());\n  160 |           let size =\n  161 |             module_info.as_ref().and_then(|info| info.code.as_ref().map(|c| c.len())).unwrap_or(0);\n  162 | \n  163 |           modules_data.push(ModuleData {\n  164 |             id: format!(\"mod-{idx}\"),\n  165 |             path: stabilize_module_id(module_id, cwd),\n  166 |             size,\n  167 |             importers: None, // Will be filled in later\n  168 |           });","lines":10,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_plugin_bundle_analyzer/src/lib.rs#L159-L168"},{"ref":"crates/rolldown_plugin_bundle_analyzer/src/render_markdown.rs:82-101","code":"   82 | fn render_largest_modules(out: &mut String, data: &AnalyzeData, total_output_size: usize) {\n   83 |   out.push_str(\"## Largest Modules by Output Contribution\\n\\n\");\n   84 |   out.push_str(\n   85 |     \"Modules sorted by bytes contributed to the output bundle. Large modules may indicate bloat.\\n\\n\",\n   86 |   );\n   87 | \n   88 |   let mut all_modules: Vec<(usize, &ModuleData)> = data.modules.iter().enumerate().collect();\n   89 |   all_modules.sort_by_key(|b| std::cmp::Reverse(b.1.size));\n   90 | \n   91 |   out.push_str(\"| Output Bytes | % of Total | Module |\\n\");\n   92 |   out.push_str(\"|--------------|------------|--------|\\n\");\n   93 |   for &(_, module) in &all_modules {\n   94 |     let pct = if total_output_size > 0 {\n   95 |       (module.size as f64 / total_output_size as f64) * 100.0\n   96 |     } else {\n   97 |       0.0\n   98 |     };\n   99 |     writeln!(out, \"| {} | {pct:.1}% | `{}` |\", format_size(module.size), module.path).unwrap();\n  100 |   }\n  101 |   out.push('\\n');","lines":20,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_plugin_bundle_analyzer/src/render_markdown.rs#L82-L101"},{"ref":"crates/rolldown_plugin_bundle_analyzer/src/render_markdown.rs:424-428","code":"  424 |   out.push_str(\"### All Modules\\n\\n```\\n\");\n  425 |   for &(_, module) in &all_modules {\n  426 |     writeln!(out, \"[MODULE: {}]\", module.path).unwrap();\n  427 |     writeln!(out, \"[OUTPUT_BYTES: {} = {} bytes]\", module.path, module.size).unwrap();\n  428 |   }","lines":5,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_plugin_bundle_analyzer/src/render_markdown.rs#L424-L428"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"Misleading doc comment on the `is_top_level` field. It claims the field is \"A cache of\n[AstScanner::is_valid_tla_scope]\", but the field is actually computed from the free function\n`rolldown_ecmascript_utils::is_top_level(&self.scope_stack)` (set in `enter_scope`/`leave_scope`),\nwhich has different semantics than `is_valid_tla_scope` (the free function allows\n`ClassStaticBlock`; `is_valid_tla_scope` allows `StrictMode` and is used for top-level await).\nA reader could wrongly assume the two are interchangeable.","fix":"Update the comment to reference the free function `is_top_level(&scope_stack)` (and its block/class-static-block semantics) rather than `is_valid_tla_scope`.","locations":[{"ref":"crates/rolldown/src/ast_scanner/mod.rs:168-170","code":"  168 |   /// Whether the current position is at the top level (all parent scopes are block or top-level).\n  169 |   /// A cache of [AstScanner::is_valid_tla_scope].\n  170 |   is_top_level: bool,","lines":3,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/ast_scanner/mod.rs#L168-L170"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"Copy-paste error: UMD renderer's `entry_module` expect message reads \"iife format only have entry chunk\" inside the UMD code path. Misleading if the panic ever fires while rendering UMD.","fix":"Change the message to reference UMD, e.g. `.expect(\"umd format only have entry chunk\")`.","locations":[{"ref":"crates/rolldown/src/ecmascript/format/umd.rs:52-55","code":"   52 |   let entry_module = ctx\n   53 |     .chunk\n   54 |     .entry_module(&ctx.link_output.module_table)\n   55 |     .expect(\"iife format only have entry chunk\");","lines":4,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown/src/ecmascript/format/umd.rs#L52-L55"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"Doc comments in binding_sourcemap.rs cite specific line numbers that no longer match the code: line 5 references 'From<JSONSourceMap> impl (line 61)' but the impl is at line 83; line 6 references 'TryFrom<BindingSourcemap> impl (line 10)' but line 10 is a field declaration (impl at 13); line 28 references 'From<JSONSourceMap> impl (line 64)' (actually 68). These brittle line references drift on every edit.","fix":"Drop the inline line numbers; reference impls by name only.","locations":[{"ref":"crates/rolldown_binding/src/types/binding_sourcemap.rs:4-6","code":"    4 | // This struct is used to both pass to JS and receive from JS:\n    5 | // - Pass to JS: `From<JSONSourceMap>` impl (line 61) used in hook outputs\n    6 | // - Receive from JS: `TryFrom<BindingSourcemap>` impl (line 10) used in JsOutputChunk","lines":3,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_binding/src/types/binding_sourcemap.rs#L4-L6"},{"ref":"crates/rolldown_binding/src/types/binding_sourcemap.rs:26-29","code":"   26 | // This struct is used to both pass to JS and receive from JS:\n   27 | // - Part of BindingSourcemap Either type, used in both directions\n   28 | // - Pass to JS: Created in From<JSONSourceMap> impl (line 64)\n   29 | // - Receive from JS: Converted in TryFrom<BindingSourcemap> impl (line 16)","lines":4,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_binding/src/types/binding_sourcemap.rs#L26-L29"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The struct field comment \"emitted chunk corresponding reference_id, used to PluginContext#getFileName ...\" sits above\n`pre_rendered_chunk` but describes a `reference_id` field that does not exist on this struct - an orphaned/misplaced\ncomment.","fix":"Remove or correct the orphaned comment so it accurately describes `pre_rendered_chunk`.","locations":[{"ref":"crates/rolldown_common/src/chunk/mod.rs:76-78","code":"   76 |   pub file_name: Option<ArcStr>,\n   77 |   // emitted chunk corresponding reference_id, used to `PluginContext#getFileName` to search the emitted chunk name\n   78 |   pub pre_rendered_chunk: Option<RollupPreRenderedChunk>,","lines":3,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_common/src/chunk/mod.rs#L76-L78"}]},
{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"Doc comment on `ImportRecord::namespace_ref` reads \"It's useless if we imported n esm module.\" - a garbled sentence\n(\"n esm module\") that obscures the meaning (presumably \"an ESM module\").","fix":"Reword to e.g. 'It's unused if we imported an ESM module.'","locations":[{"ref":"crates/rolldown_common/src/types/import_record.rs:92-94","code":"   92 |   /// We will turn `import { foo } from './cjs.js'; console.log(foo);` to `var import_foo = require_cjs(); console.log(importcjs.foo)`;\n   93 |   /// `namespace_ref` represent the potential `import_foo` in above example. It's useless if we imported n esm module.\n   94 |   pub namespace_ref: SymbolRef,","lines":3,"link":"https://github.com/rolldown/rolldown/blob/9704b565076baf57b3703c98ebde973855506a68/crates/rolldown_common/src/types/import_record.rs#L92-L94"}]},
