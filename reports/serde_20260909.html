{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"FlatMapSerializeTupleVariantAsMapValue::end (line 1299-1302) serializes the buffered tuple\nvariant fields as Content::Seq, whereas the non-flat counterpart SerializeTupleVariantAsMapValue::end\n(lines 377-382) serializes them as Content::TupleStruct(self.name, self.fields).\nThis inconsistency means that when a tuple variant is flattened via #[serde(flatten)], the\nresulting serialized representation uses a plain sequence rather than a named tuple-struct,\ndropping the variant name from the buffered content. Serializers that distinguish between Seq\nand TupleStruct will produce different (and likely wrong) output for flattened vs non-flattened\ntuple variants containing the same data.","fix":"Change FlatMapSerializeTupleVariantAsMapValue to store the name (already present in the struct\ndefinition but the field is missing) and use Content::Tuple or the same Content::TupleStruct:\n\n    fn end(self) -> Result<(), Self::Error> {\n        tri!(self.map.serialize_value(&Content::Tuple(self.fields)));\n        Ok(())\n    }\n\nUsing Content::Tuple (rather than Content::TupleStruct which carries a struct name) is more\nappropriate here since the variant name has already been serialized as the map key by the\ncaller (serialize_tuple_variant at line 1166), and the value should be the tuple contents only.\nVerify that the non-flat path's use of TupleStruct is also intentional given that TupleStruct\ncarries a name that may be redundant with the already-emitted map key.","locations":[{"ref":"serde/src/private/ser.rs:1299-1302","code":" 1299 |     fn end(self) -> Result<(), Self::Error> {\n 1300 |         tri!(self.map.serialize_value(&Content::Seq(self.fields)));\n 1301 |         Ok(())\n 1302 |     }","lines":4,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde/src/private/ser.rs#L1299-L1302"},{"ref":"serde/src/private/ser.rs:377-382","code":"  377 |         fn end(mut self) -> Result<M::Ok, M::Error> {\n  378 |             tri!(self\n  379 |                 .map\n  380 |                 .serialize_value(&Content::TupleStruct(self.name, self.fields)));\n  381 |             self.map.end()\n  382 |         }","lines":6,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde/src/private/ser.rs#L377-L382"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Binary-format round-trip of `net::SocketAddrV6` silently drops `flow_info` and `scope_id`. The serializer emits only `(ip, port)` as a tuple (line ~899 in ser/impls.rs), and the deserializer reconstructs with `net::SocketAddrV6::new(ip, port, 0, 0)`. Any non-zero `flow_info` or `scope_id` is permanently lost after a serialize-deserialize cycle in binary formats.","fix":"Serialize SocketAddrV6 as a 4-tuple `(ip, port, flow_info, scope_id)` in the binary path, and deserialize correspondingly as `|(ip, port, flow_info, scope_id)| net::SocketAddrV6::new(ip, port, flow_info, scope_id)`. This is a breaking change to the binary wire format, so it needs a major-version consideration.","locations":[{"ref":"serde_core/src/de/impls.rs:1776-1780","code":" 1776 | #[cfg(any(feature = \"std\", not(no_core_net)))]\n 1777 | parse_socket_impl! {\n 1778 |     net::SocketAddrV6, \"IPv6 socket address\",\n 1779 |     |(ip, port)| net::SocketAddrV6::new(ip, port, 0, 0),\n 1780 | }","lines":5,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_core/src/de/impls.rs#L1776-L1780"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"The Content enum in serde_core/src/private/content.rs has integer variants only up to I64/U64 and has no I128 or U128 variants. When the derived flatten/untagged-enum machinery uses this type as a buffer and encounters an i128 or u128 field, deserialization silently falls through to the default Visitor::visit_i128/visit_u128 implementations which return an invalid_type error. This is documented in serde/src/private/de.rs as 'Cannot capture ... i128 and u128', but the limitation is not surfaced at compile time and the runtime error message ('invalid type: integer ... as i128, expected ...') is confusing and hard to debug.","fix":"Add I128(i128) and U128(u128) variants to the Content enum and implement the corresponding visitor dispatch in the ContentVisitor, matching the pattern used for the other integer types. This is a known open issue in serde.","locations":[{"ref":"serde_core/src/private/content.rs:10-39","code":"   10 | pub enum Content<'de> {\n   11 |     Bool(bool),\n   12 | \n   13 |     U8(u8),\n   14 |     U16(u16),\n   15 |     U32(u32),\n   16 |     U64(u64),\n   17 | \n   18 |     I8(i8),\n   19 |     I16(i16),\n   20 |     I32(i32),\n   21 |     I64(i64),\n   22 | \n   23 |     F32(f32),\n   24 |     F64(f64),\n   25 | \n   26 |     Char(char),\n   27 |     String(String),\n   28 |     Str(&'de str),\n   29 |     ByteBuf(Vec<u8>),\n   30 |     Bytes(&'de [u8]),\n   31 | \n   32 |     None,\n   33 |     Some(Box<Content<'de>>),\n   34 | \n   35 |     Unit,\n   36 |     Newtype(Box<Content<'de>>),\n   37 |     Seq(Vec<Content<'de>>),\n   38 |     Map(Vec<(Content<'de>, Content<'de>)>),\n   39 | }","lines":30,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_core/src/private/content.rs#L10-L39"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The `isize` type is serialized as `i64` and `usize` is serialized as `u64` via a cast (`primitive_impl!(isize, serialize_i64 as i64)` and `primitive_impl!(usize, serialize_u64 as u64)`). On any future 128-bit platform where `isize`/`usize` are 128 bits, this silently truncates values larger than `i64::MAX`/`u64::MAX` without any error or warning. The deserialization side would then reconstruct different values, violating round-trip correctness. Currently no mainstream Rust target has 128-bit pointers, but the code makes no static assertion and gives no runtime error.","fix":"Add a `static_assert!(size_of::<usize>() <= size_of::<u64>())` guard, or use `serialize_u128`/`serialize_i128` for `usize`/`isize` with a runtime check when the value exceeds the 64-bit range. Alternatively, document this as an explicit design limitation.","locations":[{"ref":"serde_core/src/ser/impls.rs:22-28","code":"   22 | primitive_impl!(isize, serialize_i64 as i64);\n   23 | primitive_impl!(i8, serialize_i8);\n   24 | primitive_impl!(i16, serialize_i16);\n   25 | primitive_impl!(i32, serialize_i32);\n   26 | primitive_impl!(i64, serialize_i64);\n   27 | primitive_impl!(i128, serialize_i128);\n   28 | primitive_impl!(usize, serialize_u64 as u64);","lines":7,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_core/src/ser/impls.rs#L22-L28"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Behavioral inconsistency between map and seq deserialization of adjacently tagged enum unit variants. In visit_map (line 249), a missing content key is handled gracefully for unit variants via the `missing_content` path which returns Ok(Variant). In visit_seq (lines 287-300), the second element is always required and its absence always yields `invalid_length(1, ...)`. This means a two-element sequence [\"tag\", <content>] is required for unit variants in seq format, but only the tag key is required in map format. A round-trip through a seq-capable format will fail for unit variants.","fix":"After reading the first element (__variant) in visit_seq, check if the variant is a unit variant. If so, call `SeqAccess::next_element::<IgnoredAny>` (consuming any trailing element) and return Ok(value) immediately rather than trying to deserialize a second element. Alternatively, apply the same `missing_content` logic: when next_element_seed returns None, check if the variant is unit-like and return the appropriate value instead of an error.","locations":[{"ref":"serde_derive/src/de/enum_adjacently.rs:287-300","code":"  287 |                         match _serde::de::SeqAccess::next_element_seed(\n  288 |                             &mut __seq,\n  289 |                             __Seed {\n  290 |                                 variant: __variant,\n  291 |                                 marker: _serde::#private::PhantomData,\n  292 |                                 lifetime: _serde::#private::PhantomData,\n  293 |                             },\n  294 |                         ) {\n  295 |                             _serde::#private::Ok(_serde::#private::Some(__ret)) => _serde::#private::Ok(__ret),\n  296 |                             // There is no second element.\n  297 |                             _serde::#private::Ok(_serde::#private::None) => {\n  298 |                                 _serde::#private::Err(_serde::de::Error::invalid_length(1, &self))\n  299 |                             }\n  300 |                             _serde::#private::Err(__err) => _serde::#private::Err(__err),","lines":14,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_derive/src/de/enum_adjacently.rs#L287-L300"},{"ref":"serde_derive/src/de/enum_adjacently.rs:249","code":"  249 |                             _serde::#private::None => #missing_content","lines":1,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_derive/src/de/enum_adjacently.rs#L249"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`should_allow_deprecated` in `deprecated.rs` checks the top-level item attributes and\nenum variant attributes for `#[deprecated]` / `#[allow(deprecated)]`, but it never\nchecks struct field attributes. If a user derives `Serialize`/`Deserialize` on a struct\nthat references a deprecated type through one of its fields, or if a struct field itself\ncarries `#[deprecated]`, the generated impl will not carry `#[allow(deprecated)]` and\ncompilation will produce a spurious deprecation warning from inside the macro-generated\ncode. Enum variant fields (bodies of variants) are also not inspected.","fix":"Extend `should_allow_deprecated` to iterate over struct fields (and enum variant fields)\nand call `contains_deprecated` on their attribute lists:\n```rust\nfn should_allow_deprecated(input: &syn::DeriveInput) -> bool {\n    if contains_deprecated(&input.attrs) {\n        return true;\n    }\n    match &input.data {\n        syn::Data::Struct(data) => {\n            for field in &data.fields {\n                if contains_deprecated(&field.attrs) {\n                    return true;\n                }\n            }\n        }\n        syn::Data::Enum(data) => {\n            for variant in &data.variants {\n                if contains_deprecated(&variant.attrs) {\n                    return true;\n                }\n                for field in &variant.fields {\n                    if contains_deprecated(&field.attrs) {\n                        return true;\n                    }\n                }\n            }\n        }\n        _ => {}\n    }\n    false\n}\n```","locations":[{"ref":"serde_derive/src/deprecated.rs:18-30","code":"   18 | fn should_allow_deprecated(input: &syn::DeriveInput) -> bool {\n   19 |     if contains_deprecated(&input.attrs) {\n   20 |         return true;\n   21 |     }\n   22 |     if let syn::Data::Enum(data_enum) = &input.data {\n   23 |         for variant in &data_enum.variants {\n   24 |             if contains_deprecated(&variant.attrs) {\n   25 |                 return true;\n   26 |             }\n   27 |         }\n   28 |     }\n   29 |     false\n   30 | }","lines":13,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_derive/src/deprecated.rs#L18-L30"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `TaggedContentVisitor::visit_map` (lines 859-886), when the tag field appears after content fields in the map, all the pre-tag content is buffered correctly. However, if the same tag key appears twice the code returns `Err(de::Error::duplicate_field(...))` which is correct. But if a non-self-describing format sends the tag as an integer index (via `visit_u64`), the `TagOrContentVisitor` only matches it as `TagOrContent::Content` (because `visit_u64` delegates entirely to `ContentVisitor::new().visit_u64(...)` without checking if the index equals the tag field index). This means integer-keyed formats that use field indices cannot trigger the `Tag` branch, silently treating the tag field index as opaque content.","fix":"This is a known limitation: internally tagged enums are documented to require self-describing formats (see comment at line 547). The comment at line 522 should be expanded to explicitly state that integer-keyed (index-based) formats are not supported for the tag field, so users are not surprised.","locations":[{"ref":"serde/src/private/de.rs:546-549","code":"  546 |             // Internally tagged enums are only supported in self-describing\n  547 |             // formats.\n  548 |             deserializer.deserialize_any(self)\n  549 |         }","lines":4,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde/src/private/de.rs#L546-L549"},{"ref":"serde/src/private/de.rs:600-638","code":"  600 |             ContentVisitor::new()\n  601 |                 .visit_i64(value)\n  602 |                 .map(TagOrContent::Content)\n  603 |         }\n  604 | \n  605 |         fn visit_u8<F>(self, value: u8) -> Result<Self::Value, F>\n  606 |         where\n  607 |             F: de::Error,\n  608 |         {\n  609 |             ContentVisitor::new()\n  610 |                 .visit_u8(value)\n  611 |                 .map(TagOrContent::Content)\n  612 |         }\n  613 | \n  614 |         fn visit_u16<F>(self, value: u16) -> Result<Self::Value, F>\n  615 |         where\n  616 |             F: de::Error,\n  617 |         {\n  618 |             ContentVisitor::new()\n  619 |                 .visit_u16(value)\n  620 |                 .map(TagOrContent::Content)\n  621 |         }\n  622 | \n  623 |         fn visit_u32<F>(self, value: u32) -> Result<Self::Value, F>\n  624 |         where\n  625 |             F: de::Error,\n  626 |         {\n  627 |             ContentVisitor::new()\n  628 |                 .visit_u32(value)\n  629 |                 .map(TagOrContent::Content)\n  630 |         }\n  631 | \n  632 |         fn visit_u64<F>(self, value: u64) -> Result<Self::Value, F>\n  633 |         where\n  634 |             F: de::Error,\n  635 |         {\n  636 |             ContentVisitor::new()\n  637 |                 .visit_u64(value)\n  638 |                 .map(TagOrContent::Content)","lines":39,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde/src/private/de.rs#L600-L638"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`ContentDeserializer::deserialize_string` and `ContentDeserializer::deserialize_str` both delegate to `deserialize_string` (lines 1248-1266), and both accept `Content::ByteBuf` / `Content::Bytes` as valid input, calling `visit_byte_buf` / `visit_borrowed_bytes` on a string visitor. A visitor that calls `expecting` for a string will receive raw bytes instead of a string, potentially confusing downstream visitors that do not implement `visit_bytes`. This is a cross-type coercion that silently succeeds when it should report a type mismatch.","fix":"Consider returning `Err(self.invalid_type(&visitor))` for `Content::ByteBuf` and `Content::Bytes` in `deserialize_str`/`deserialize_string` unless there is a documented format (e.g. CBOR) that requires this coercion path.","locations":[{"ref":"serde/src/private/de.rs:1248-1266","code":" 1248 |         fn deserialize_str<V>(self, visitor: V) -> Result<V::Value, Self::Error>\n 1249 |         where\n 1250 |             V: Visitor<'de>,\n 1251 |         {\n 1252 |             self.deserialize_string(visitor)\n 1253 |         }\n 1254 | \n 1255 |         fn deserialize_string<V>(self, visitor: V) -> Result<V::Value, Self::Error>\n 1256 |         where\n 1257 |             V: Visitor<'de>,\n 1258 |         {\n 1259 |             match self.content {\n 1260 |                 Content::String(v) => visitor.visit_string(v),\n 1261 |                 Content::Str(v) => visitor.visit_borrowed_str(v),\n 1262 |                 Content::ByteBuf(v) => visitor.visit_byte_buf(v),\n 1263 |                 Content::Bytes(v) => visitor.visit_borrowed_bytes(v),\n 1264 |                 _ => Err(self.invalid_type(&visitor)),\n 1265 |             }\n 1266 |         }","lines":19,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde/src/private/de.rs#L1248-L1266"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `PairDeserializer::deserialize_seq` (line 1797-1803) and `PairRefDeserializer::deserialize_seq` (line 2742-2749), the error reporting for leftover elements uses `2 - remaining` as the 'expected' count, where `remaining` comes from `pair_visitor.size_hint().unwrap()`. The `size_hint` for `PairVisitor` returns `Some(2)` when `self.0.is_some()`, `Some(1)` when only `self.1.is_some()`, and `Some(0)` otherwise. After the visitor has consumed the key (self.0 taken) but not the value (self.1 still present), `remaining` is `1` and the error says 'expected 1 element in sequence' but the actual data has 2 elements. The first argument `2` correctly states the data length, but `2 - remaining = 1` is the number of elements *consumed*, not the number *expected* by the deserialize implementation - a misleading error message.","fix":"Clarify the intent: if `remaining > 0` after the visitor exits, the visitor consumed fewer than 2 elements. Pass the actual count consumed (`2 - remaining`) as the expected-length argument only if that accurately reflects what the `Deserialize` impl expects. Add a comment that `ExpectedInSeq(2 - remaining)` means 'the deserialize impl consumed this many elements' to prevent future confusion.","locations":[{"ref":"serde/src/private/de.rs:1797-1804","code":" 1797 |             if pair_visitor.1.is_none() {\n 1798 |                 Ok(pair)\n 1799 |             } else {\n 1800 |                 let remaining = pair_visitor.size_hint().unwrap();\n 1801 |                 // First argument is the number of elements in the data, second\n 1802 |                 // argument is the number of elements expected by the Deserialize.\n 1803 |                 Err(de::Error::invalid_length(2, &ExpectedInSeq(2 - remaining)))\n 1804 |             }","lines":8,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde/src/private/de.rs#L1797-L1804"},{"ref":"serde/src/private/de.rs:2742-2750","code":" 2742 |             let pair = tri!(visitor.visit_seq(&mut pair_visitor));\n 2743 |             if pair_visitor.1.is_none() {\n 2744 |                 Ok(pair)\n 2745 |             } else {\n 2746 |                 let remaining = pair_visitor.size_hint().unwrap();\n 2747 |                 // First argument is the number of elements in the data, second\n 2748 |                 // argument is the number of elements expected by the Deserialize.\n 2749 |                 Err(de::Error::invalid_length(2, &ExpectedInSeq(2 - remaining)))\n 2750 |             }","lines":9,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde/src/private/de.rs#L2742-L2750"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In the `num_self!` and `num_as_self!` macros, when a signed nonzero integer type (e.g. NonZeroI8, NonZeroI16, ...) receives a zero value through a signed visitor method (visit_i8, visit_i16, etc.), the error is reported as `Unexpected::Unsigned(0)` instead of `Unexpected::Signed(0)`. The value arrived via a signed path but is incorrectly classified as unsigned in the error. Both format identically in messages today ('integer `0`'), so there is no user-visible impact currently, but it violates the semantic contract of Unexpected and could matter if a future change differentiates them.","fix":"Change `Err(Error::invalid_value(Unexpected::Unsigned(0), &self))` to `Err(Error::invalid_value(Unexpected::Signed(0), &self))` in the `nonzero` arms of `num_self!` and `num_as_self!` when the primitive type is a signed integer.","locations":[{"ref":"serde_core/src/de/impls.rs:165-176","code":"  165 |     (nonzero $primitive:ident $ty:ident : $visit:ident) => {\n  166 |         fn $visit<E>(self, v: $ty) -> Result<Self::Value, E>\n  167 |         where\n  168 |             E: Error,\n  169 |         {\n  170 |             if let Some(nonzero) = Self::Value::new(v) {\n  171 |                 Ok(nonzero)\n  172 |             } else {\n  173 |                 Err(Error::invalid_value(Unexpected::Unsigned(0), &self))\n  174 |             }\n  175 |         }\n  176 |     };","lines":12,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_core/src/de/impls.rs#L165-L176"},{"ref":"serde_core/src/de/impls.rs:199-210","code":"  199 |     (nonzero $primitive:ident $ty:ident : $visit:ident) => {\n  200 |         fn $visit<E>(self, v: $ty) -> Result<Self::Value, E>\n  201 |         where\n  202 |             E: Error,\n  203 |         {\n  204 |             if let Some(nonzero) = Self::Value::new(v as $primitive) {\n  205 |                 Ok(nonzero)\n  206 |             } else {\n  207 |                 Err(Error::invalid_value(Unexpected::Unsigned(0), &self))\n  208 |             }\n  209 |         }\n  210 |     };","lines":12,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_core/src/de/impls.rs#L199-L210"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In the `num_128!` macro's `nonzero` arm (line 492), when a 128-bit conversion to a signed nonzero type (e.g. NonZeroI128) produces zero, the error reports `Unexpected::Unsigned(0)`. This is semantically wrong for signed primitives.","fix":"Use `Unexpected::Signed(0)` when `$primitive` is a signed type (e.g. i128), and `Unexpected::Unsigned(0)` only for unsigned primitives. A simple approach is to pass the actual `v as $primitive` value (which would be 0) converted through the appropriate Unexpected variant.","locations":[{"ref":"serde_core/src/de/impls.rs:483-501","code":"  483 |     (nonzero $primitive:ident $ty:ident : $visit:ident) => {\n  484 |         fn $visit<E>(self, v: $ty) -> Result<Self::Value, E>\n  485 |         where\n  486 |             E: Error,\n  487 |         {\n  488 |             if v as i128 >= $primitive::MIN as i128 && v as u128 <= $primitive::MAX as u128 {\n  489 |                 if let Some(nonzero) = Self::Value::new(v as $primitive) {\n  490 |                     Ok(nonzero)\n  491 |                 } else {\n  492 |                     Err(Error::invalid_value(Unexpected::Unsigned(0), &self))\n  493 |                 }\n  494 |             } else {\n  495 |                 Err(Error::invalid_value(\n  496 |                     Unexpected::Other(stringify!($ty)),\n  497 |                     &self,\n  498 |                 ))\n  499 |             }\n  500 |         }\n  501 |     };","lines":19,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_core/src/de/impls.rs#L483-L501"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `de.rs`, the helper function `requires_default` uses a verbose `if let / else` pattern where the idiomatic `matches!` macro would be cleaner and less error-prone. Specifically: `if let attr::Default::Default = *field.default() { true } else { false }`. This pattern was common before `matches!` stabilized but is now a maintenance hazard: future developers may add arms or miss a branch.","fix":"Replace with `matches!(*field.default(), attr::Default::Default)`.","locations":[{"ref":"serde_derive/src/de.rs:249-255","code":"  249 | fn requires_default(field: &attr::Field, _variant: Option<&attr::Variant>) -> bool {\n  250 |     if let attr::Default::Default = *field.default() {\n  251 |         true\n  252 |     } else {\n  253 |         false\n  254 |     }\n  255 | }","lines":7,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_derive/src/de.rs#L249-L255"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In enum_adjacently.rs, `missing_content_arms` for Newtype variants without `deserialize_with` (line 78-83) generates `missing_field(#content).map(Variant)`. Here `#content` is the content *key* string (e.g. \"content\"), not the inner field's own name. This means when the content key is absent, the generated error message reads \"missing field `content`\" (or whatever the content key is named), rather than referring to the inner Newtype field. While technically correct (the content map key is what is missing), it can be confusing if the Newtype wraps a named field with a different deserialize name.","fix":"This is arguably by design (the missing entity is the content map key, not an inner field). If clearer errors are desired, pass the inner field's deserialize name instead of the content key name.","locations":[{"ref":"serde_derive/src/de/enum_adjacently.rs:78-83","code":"   78 |             Style::Newtype if variant.attrs.deserialize_with().is_none() => {\n   79 |                 let span = variant.original.span();\n   80 |                 let func = quote_spanned!(span=> _serde::#private::de::missing_field);\n   81 |                 quote! {\n   82 |                     #func(#content).map(#this_value::#variant_ident)\n   83 |                 }","lines":6,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_derive/src/de/enum_adjacently.rs#L78-L83"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `deserialize_identifier` (`identifier.rs`), when `collect_other_fields` is true (the\nflatten path), `bytes_to_str` is set to `None` (line 226-232). This means the\n`visit_borrowed_bytes` branch omits the UTF-8 conversion step, which is consistent with\nrouting bytes to `Content::Bytes`. However, the regular `visit_bytes` arm also skips\n`bytes_to_str` (also `None` in this code path), yet `visit_str` converts to\n`Content::String` via `ToString::to_string`. The asymmetry means `visit_bytes` and\n`visit_str` produce different `Content` variants for the same logical string key when\nflattening is in use. Depending on the downstream `FlatMapDeserializer`, this may cause\nkeys delivered as bytes to be silently missed if the inner deserializer only matches on\n`Content::String`.","fix":"Audit whether `Content::ByteBuf` vs `Content::String` are both handled equivalently by\n`FlatMapDeserializer` for map key matching. If not, convert bytes to string in\n`visit_bytes` / `visit_borrowed_bytes` under the `collect_other_fields` path, or ensure\nthe deserializer matches on both variants.","locations":[{"ref":"serde_derive/src/de/identifier.rs:226-232","code":"  226 |     let bytes_to_str = if fallthrough.is_some() || collect_other_fields {\n  227 |         None\n  228 |     } else {\n  229 |         Some(quote! {\n  230 |             let __value = &_serde::#private::from_utf8_lossy(__value);\n  231 |         })\n  232 |     };","lines":7,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_derive/src/de/identifier.rs#L226-L232"},{"ref":"serde_derive/src/de/identifier.rs:238-256","code":"  238 |         value_as_borrowed_bytes_content,\n  239 |     ) = if collect_other_fields {\n  240 |         (\n  241 |             Some(quote! {\n  242 |                 let __value = _serde::#private::de::Content::String(_serde::#private::ToString::to_string(__value));\n  243 |             }),\n  244 |             Some(quote! {\n  245 |                 let __value = _serde::#private::de::Content::Str(__value);\n  246 |             }),\n  247 |             Some(quote! {\n  248 |                 let __value = _serde::#private::de::Content::ByteBuf(__value.to_vec());\n  249 |             }),\n  250 |             Some(quote! {\n  251 |                 let __value = _serde::#private::de::Content::Bytes(__value);\n  252 |             }),\n  253 |         )\n  254 |     } else {\n  255 |         (None, None, None, None)\n  256 |     };","lines":19,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_derive/src/de/identifier.rs#L238-L256"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `check_flags` within `deserialize_map_in_place` (struct_.rs lines 616-618), the\ncondition for choosing the \"error-only\" branch is:\n  `field.attrs.default().is_none() && cattrs.default().is_none() && field.attrs.deserialize_with().is_some()`\nThis means: only skip the assignment when there is both no default and a `deserialize_with`.\nBut the comment says \"if missing_expr unconditionally returns an error\", which also covers\nthe case where there is no default and no `deserialize_with` - in that case `expr_is_missing`\nalso returns an error expression, yet the `else` branch is taken and the code tries to\nassign the error expression to `self.place.#member`. This results in a type mismatch in\nthe generated code (trying to assign a `Result<_, E>` to the field), which will cause a\ncompile error in user code. However, the non-in-place path in `deserialize_map` uses\n`Match(expr_is_missing(...))` which wraps the expression in a match arm properly, so\nthere is a divergence between the two paths. The generated code may silently produce a\ncompile error rather than a clear diagnostic.","fix":"The condition for the error-only (Stmts) path should also cover the case where there is\nno field default and no container default, regardless of `deserialize_with`:\n```rust\nif field.attrs.default().is_none() && cattrs.default().is_none() {\n    let missing_expr = Stmts(missing_expr);\n    quote! { if !#name { #missing_expr; } }\n} else {\n    let member = &field.member;\n    let missing_expr = Expr(missing_expr);\n    quote! { if !#name { self.place.#member = #missing_expr; }; }\n}\n```","locations":[{"ref":"serde_derive/src/de/struct_.rs:609-635","code":"  609 |     let check_flags = fields_names\n  610 |         .iter()\n  611 |         .filter(|&&(field, _)| !field.attrs.skip_deserializing())\n  612 |         .map(|(field, name)| {\n  613 |             let missing_expr = expr_is_missing(field, cattrs);\n  614 |             // If missing_expr unconditionally returns an error, don't try\n  615 |             // to assign its value to self.place.\n  616 |             if field.attrs.default().is_none()\n  617 |                 && cattrs.default().is_none()\n  618 |                 && field.attrs.deserialize_with().is_some()\n  619 |             {\n  620 |                 let missing_expr = Stmts(missing_expr);\n  621 |                 quote! {\n  622 |                     if !#name {\n  623 |                         #missing_expr;\n  624 |                     }\n  625 |                 }\n  626 |             } else {\n  627 |                 let member = &field.member;\n  628 |                 let missing_expr = Expr(missing_expr);\n  629 |                 quote! {\n  630 |                     if !#name {\n  631 |                         self.place.#member = #missing_expr;\n  632 |                     };\n  633 |                 }\n  634 |             }\n  635 |         });","lines":27,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_derive/src/de/struct_.rs#L609-L635"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`VecAttr::insert` records `first_dup_tokens` only when `values.len() == 1`, meaning it\ncaptures the second occurrence. For three or more duplicate attributes the error span\nalways points to the second occurrence, not the first duplicate encountered. This means\nthe diagnostic `cx.error_spanned_by(dup_token, msg)` in `at_most_one` will highlight the\nsecond `#[serde(...)]` attribute rather than the actual first duplicate.","fix":"Change the condition to capture on the first duplicate, or rename `first_dup_tokens` to\n`second_occurrence_tokens` to make the intent clear. To truly point at the first\nduplicate, store the first value's tokens in a separate field instead.","locations":[{"ref":"serde_derive/src/internals/attr.rs:110-115","code":"  110 |     fn insert<A: ToTokens>(&mut self, obj: A, value: T) {\n  111 |         if self.values.len() == 1 {\n  112 |             self.first_dup_tokens = obj.into_token_stream();\n  113 |         }\n  114 |         self.values.push(value);\n  115 |     }","lines":6,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_derive/src/internals/attr.rs#L110-L115"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`apply_to_field` for `ScreamingSnakeCase` at line 105 simply calls\n`field.to_ascii_uppercase()`. For a field named e.g. `myField` (camelCase, unusual for\nRust but valid), this produces `MYFIELD` instead of the expected `MY_FIELD`. The correct\nbehavior for `SCREAMING_SNAKE_CASE` on a field should first normalize through snake_case.\nIn practice, Rust fields are always snake_case so the distinction rarely matters. However,\n`apply_to_variant` for `ScreamingSnakeCase` correctly chains through `SnakeCase` first\n(line 73): `SnakeCase.apply_to_variant(variant).to_ascii_uppercase()`. The inconsistency\nbetween field and variant transformations for this rule is a latent logic error if a\nfield name contains uppercase letters.","fix":"For full correctness, `ScreamingSnakeCase.apply_to_field` could chain through SnakeCase:\n`SnakeCase.apply_to_field(field).to_ascii_uppercase()`. Since fields in Rust are\nconventionally already snake_case, this produces identical results for well-formed input\nbut correctly handles non-standard field names. The current behavior of `field.to_ascii_uppercase()`\nis also technically correct for conventionally named fields (which never have uppercase\nletters), so this is a low-priority documentation/consistency issue.","locations":[{"ref":"serde_derive/src/internals/case.rs:105","code":"  105 |             ScreamingSnakeCase => field.to_ascii_uppercase(),","lines":1,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_derive/src/internals/case.rs#L105"},{"ref":"serde_derive/src/internals/case.rs:73","code":"   73 |             ScreamingSnakeCase => SnakeCase.apply_to_variant(variant).to_ascii_uppercase(),","lines":1,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_derive/src/internals/case.rs#L73"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`check_internal_tag_field_name_conflict` returns immediately after the first\nconflict it finds (lines 334 and 340 both `return` out of the outer function after\ncalling `diagnose_conflict`). If two or more variants each have a field name that\ncollides with the internal tag, the user only sees one error per compilation and\nmust fix-and-recompile repeatedly to discover subsequent conflicts. Additionally,\nthe error is always spanned on `cont.original` (the container), so the user does\nnot know *which* variant or field is the culprit.","fix":"Remove the early `return`s inside the loop so all conflicts are collected. Span the error on the conflicting `field.original` (or `variant.original`) rather than `cont.original`.","locations":[{"ref":"serde_derive/src/internals/check.rs:311-347","code":"  311 |     let diagnose_conflict = || {\n  312 |         cx.error_spanned_by(\n  313 |             cont.original,\n  314 |             format!(\"variant field name `{}` conflicts with internal tag\", tag),\n  315 |         );\n  316 |     };\n  317 | \n  318 |     for variant in variants {\n  319 |         match variant.style {\n  320 |             Style::Struct => {\n  321 |                 if variant.attrs.untagged() {\n  322 |                     continue;\n  323 |                 }\n  324 |                 for field in &variant.fields {\n  325 |                     let check_ser =\n  326 |                         !(field.attrs.skip_serializing() || variant.attrs.skip_serializing());\n  327 |                     let check_de =\n  328 |                         !(field.attrs.skip_deserializing() || variant.attrs.skip_deserializing());\n  329 |                     let name = field.attrs.name();\n  330 |                     let ser_name = name.serialize_name();\n  331 | \n  332 |                     if check_ser && ser_name.value == tag {\n  333 |                         diagnose_conflict();\n  334 |                         return;\n  335 |                     }\n  336 | \n  337 |                     for de_name in field.attrs.aliases() {\n  338 |                         if check_de && de_name.value == tag {\n  339 |                             diagnose_conflict();\n  340 |                             return;\n  341 |                         }\n  342 |                     }\n  343 |                 }\n  344 |             }\n  345 |             Style::Unit | Style::Newtype | Style::Tuple => {}\n  346 |         }\n  347 |     }","lines":37,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_derive/src/internals/check.rs#L311-L347"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"When `#[serde(transparent)]`, `#[serde(from = \"...\")]`, and `#[serde(try_from = \"...\")]`\nare all present simultaneously, `check_transparent` (called first) emits two errors\n(one for `from`, one for `try_from`), and then `check_from_and_try_from` (called\nimmediately after) emits a *third* error for the `from`+`try_from` combination.\nThis gives the user three errors for what is conceptually one mistake, and the\nredundant error about `from`+`try_from` conflict is reported even when the user\nintends to fix the `transparent` conflict first.","fix":"In `check_from_and_try_from`, skip the check (or suppress the extra error) when `transparent` is also set, or reorder the checks so `check_from_and_try_from` runs first and `check_transparent` only reports the `from`/`try_from` errors if those checks already passed.","locations":[{"ref":"serde_derive/src/internals/check.rs:375-394","code":"  375 |     if cont.attrs.type_from().is_some() {\n  376 |         cx.error_spanned_by(\n  377 |             cont.original,\n  378 |             \"#[serde(transparent)] is not allowed with #[serde(from = \\\"...\\\")]\",\n  379 |         );\n  380 |     }\n  381 | \n  382 |     if cont.attrs.type_try_from().is_some() {\n  383 |         cx.error_spanned_by(\n  384 |             cont.original,\n  385 |             \"#[serde(transparent)] is not allowed with #[serde(try_from = \\\"...\\\")]\",\n  386 |         );\n  387 |     }\n  388 | \n  389 |     if cont.attrs.type_into().is_some() {\n  390 |         cx.error_spanned_by(\n  391 |             cont.original,\n  392 |             \"#[serde(transparent)] is not allowed with #[serde(into = \\\"...\\\")]\",\n  393 |         );\n  394 |     }","lines":20,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_derive/src/internals/check.rs#L375-L394"},{"ref":"serde_derive/src/internals/check.rs:470-477","code":"  470 | fn check_from_and_try_from(cx: &Ctxt, cont: &mut Container) {\n  471 |     if cont.attrs.type_from().is_some() && cont.attrs.type_try_from().is_some() {\n  472 |         cx.error_spanned_by(\n  473 |             cont.original,\n  474 |             \"#[serde(from = \\\"...\\\")] and #[serde(try_from = \\\"...\\\")] conflict with each other\",\n  475 |         );\n  476 |     }\n  477 | }","lines":8,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_derive/src/internals/check.rs#L470-L477"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"The `impl Error for fmt::Error` in `fmt.rs` silently drops the error message: `fn custom<T: Display>(_msg: T) -> Self { fmt::Error }`. Any serialization error that occurs when using a `fmt::Formatter` as a serializer is silently discarded and replaced by a generic `fmt::Error`. This means users who implement `Display` by delegating to `self.serialize(f)` will get opaque `fmt::Error` output with no indication of what went wrong. The error message is deliberately ignored, but there is no comment explaining why this is acceptable.","fix":"Add a comment explaining that `fmt::Error` carries no message, so the custom message is necessarily dropped. If the target platform supports it, consider using a thread-local or a wrapper type that can store the message for later retrieval via `Display`.","locations":[{"ref":"serde_core/src/ser/fmt.rs:4-8","code":"    4 | impl Error for fmt::Error {\n    5 |     fn custom<T: Display>(_msg: T) -> Self {\n    6 |         fmt::Error\n    7 |     }\n    8 | }","lines":5,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_core/src/ser/fmt.rs#L4-L8"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`FlatMapDeserializer::deserialize_enum` (lines 3228-3247) iterates over every entry in the flat map buffer on each call, doing a linear scan. In generated code for adjacently/internally tagged enums that also have many flattened fields, this becomes O(n) per enum variant lookup. For large flattened maps this is acceptable, but for deeply nested or frequently repeated deserialization this can be a hot path.","fix":"This is a known structural limitation of the flat-map buffering approach. Consider documenting the O(n) behavior. A HashMap index over the buffer keys would improve lookup to O(1) amortized at the cost of additional allocation.","locations":[{"ref":"serde/src/private/de.rs:3237-3247","code":" 3237 |         for entry in self.0 {\n 3238 |             if let Some((key, value)) = flat_map_take_entry(entry, variants) {\n 3239 |                 return visitor.visit_enum(EnumDeserializer::new(key, Some(value)));\n 3240 |             }\n 3241 |         }\n 3242 | \n 3243 |         Err(Error::custom(format_args!(\n 3244 |             \"no variant of enum {} found in flattened data\",\n 3245 |             name\n 3246 |         )))\n 3247 |     }","lines":11,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde/src/private/de.rs#L3237-L3247"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`Cow<'a, T>` always deserializes as `Cow::Owned(T::Owned::deserialize(...))`, even when the deserializer is capable of providing a borrowed reference (e.g. `&'de str` for `Cow<'_, str>`). This means every deserialization of `Cow<'a, str>` allocates a `String` regardless of whether the underlying format supports zero-copy access. A specialised impl for `Cow<'a, str>` and `Cow<'a, [u8]>` could return `Cow::Borrowed` when the deserializer provides a borrowed value.","fix":"Provide a specialised `Deserialize` impl for `Cow<'de, str>` and `Cow<'de, [u8]>` (via a `BorrowedStrVisitor` / `BorrowedBytesVisitor`) that attempts to return `Cow::Borrowed` from `visit_borrowed_str` / `visit_borrowed_bytes`, falling back to `Cow::Owned` for `visit_str` / `visit_bytes`.","locations":[{"ref":"serde_core/src/de/impls.rs:1978-1992","code":" 1978 | #[cfg(any(feature = \"std\", feature = \"alloc\"))]\n 1979 | #[cfg_attr(docsrs, doc(cfg(any(feature = \"std\", feature = \"alloc\"))))]\n 1980 | impl<'de, 'a, T> Deserialize<'de> for Cow<'a, T>\n 1981 | where\n 1982 |     T: ?Sized + ToOwned,\n 1983 |     T::Owned: Deserialize<'de>,\n 1984 | {\n 1985 |     #[inline]\n 1986 |     fn deserialize<D>(deserializer: D) -> Result<Self, D::Error>\n 1987 |     where\n 1988 |         D: Deserializer<'de>,\n 1989 |     {\n 1990 |         T::Owned::deserialize(deserializer).map(Cow::Owned)\n 1991 |     }\n 1992 | }","lines":15,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_core/src/de/impls.rs#L1978-L1992"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`NANOS_PER_SEC` is declared as `static` (a runtime memory location) instead of `const` in both the `Duration` and `SystemTime` deserialization `check_overflow` helpers. A `static u32` requires an indirection through a global address, while `const` would be inlined at each use site by the compiler, avoiding any memory access.","fix":"Change `static NANOS_PER_SEC: u32 = 1_000_000_000;` to `const NANOS_PER_SEC: u32 = 1_000_000_000;` in both occurrences.","locations":[{"ref":"serde_core/src/de/impls.rs:2191","code":" 2191 |             static NANOS_PER_SEC: u32 = 1_000_000_000;","lines":1,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_core/src/de/impls.rs#L2191"},{"ref":"serde_core/src/de/impls.rs:2330","code":" 2330 |             static NANOS_PER_SEC: u32 = 1_000_000_000;","lines":1,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_core/src/de/impls.rs#L2330"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In `bound::with_bound`, the `associated_type_usage` field is a `Vec<&'ast syn::TypePath>` rather than a `HashSet` or deduplicated collection. If two or more fields in the same struct/enum share the same associated type path (e.g., both fields have type `T::Item`), the generated where clause will contain duplicate predicates (`T::Item: Deserialize<'de>` appearing twice). While Rust's compiler accepts duplicate where clauses, it unnecessarily inflates generated code and compile time.","fix":"Change `associated_type_usage: Vec<&'ast syn::TypePath>` to a `IndexSet` or deduplicate the entries before emitting where predicates. A simple approach: collect into a `Vec`, then call `.dedup()` after sorting by the path's `to_token_stream().to_string()`.","locations":[{"ref":"serde_derive/src/bound.rs:115-116","code":"  115 |         associated_type_usage: Vec<&'ast syn::TypePath>,\n  116 |     }","lines":2,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_derive/src/bound.rs#L115-L116"},{"ref":"serde_derive/src/bound.rs:323-325","code":"  323 |     for bounded_ty in associated_type_usage {\n  324 |         dst_predicates.push(make_where_bounded_type(bounded_ty.clone(), bound));\n  325 |     }","lines":3,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_derive/src/bound.rs#L323-L325"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In enum_untagged.rs `deserialize`, the entire input is buffered into a `Content` value (line 46) before any variant is attempted. Each variant attempt then deserializes from `ContentRefDeserializer` which re-parses from the in-memory `Content` tree. For enums with many variants or complex content, this means the content is stored in memory and traversed once per failed variant attempt. No early-exit is possible once buffering has started. A streaming approach that avoids full buffering is not possible with the current architecture, but the cost is undocumented and may surprise users of large untagged enums.","fix":"Add a doc comment or attribute-level documentation warning that untagged enum deserialization buffers the entire input and retries, which has O(variants * input_size) worst-case complexity. No structural fix is possible without a serde runtime change.","locations":[{"ref":"serde_derive/src/de/enum_untagged.rs:46-55","code":"   46 |         let __content = _serde::de::DeserializeSeed::deserialize(_serde::#private::de::ContentVisitor::new(), __deserializer)?;\n   47 |         let __deserializer = _serde::#private::de::ContentRefDeserializer::<__D::Error>::new(&__content);\n   48 | \n   49 |         #first_attempt\n   50 | \n   51 |         #(\n   52 |             if let _serde::#private2::Ok(__ok) = #attempts {\n   53 |                 return _serde::#private2::Ok(__ok);\n   54 |             }\n   55 |         )*","lines":10,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_derive/src/de/enum_untagged.rs#L46-L55"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`deserialize_generated` in `identifier.rs` (line 133-136) collects a `Vec<_>` and\nimmediately takes a reference to it: `let field_idents: &Vec<_> = &deserialized_fields.iter()...collect()`.\nThe `&Vec<T>` reference is redundant; the variable is used only as an iterator source in\nthe `quote!` macro (line 158). This pattern forces an allocation of a temporary `Vec`\nand is an anti-idiomatic Rust pattern - the type annotation `&Vec<_>` suggests the\nauthor may have intended to borrow an existing slice rather than collect a new one.","fix":"Change to:\n```rust\nlet field_idents: Vec<_> = deserialized_fields.iter().map(|field| &field.ident).collect();\n```\nOr inline the iterator directly into the `quote!` macro if it is only used once.","locations":[{"ref":"serde_derive/src/de/identifier.rs:133-136","code":"  133 |     let field_idents: &Vec<_> = &deserialized_fields\n  134 |         .iter()\n  135 |         .map(|field| &field.ident)\n  136 |         .collect();","lines":4,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_derive/src/de/identifier.rs#L133-L136"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"In build.rs, the `target` string (line 44) and `emscripten` bool (line 45) are computed\nunconditionally after the early-return at line 28, but they are only used inside the\n`if minor < 60` branch (lines 48-66). On modern toolchains (Rust >= 1.60, which is the\nvast majority of users), these two env-var lookups and string comparisons are computed but\nnever consumed.","fix":"Move the `let target` and `let emscripten` bindings inside the `if minor < 60` block:\n\n    if minor < 60 {\n        let target = env::var(\"TARGET\").unwrap();\n        let emscripten = target == \"asmjs-unknown-emscripten\"\n            || target == \"wasm32-unknown-emscripten\";\n        // ... rest of block unchanged\n    }","locations":[{"ref":"serde_core/build.rs:44-45","code":"   44 |     let target = env::var(\"TARGET\").unwrap();\n   45 |     let emscripten = target == \"asmjs-unknown-emscripten\" || target == \"wasm32-unknown-emscripten\";","lines":2,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_core/build.rs#L44-L45"},{"ref":"serde_core/build.rs:48-66","code":"   48 |     if minor < 60 {\n   49 |         println!(\"cargo:rustc-cfg=no_target_has_atomic\");\n   50 |         // Allowlist of archs that support std::sync::atomic module. This is\n   51 |         // based on rustc's compiler/rustc_target/src/spec/*.rs.\n   52 |         let has_atomic64 = target.starts_with(\"x86_64\")\n   53 |             || target.starts_with(\"i686\")\n   54 |             || target.starts_with(\"aarch64\")\n   55 |             || target.starts_with(\"powerpc64\")\n   56 |             || target.starts_with(\"sparc64\")\n   57 |             || target.starts_with(\"mips64el\")\n   58 |             || target.starts_with(\"riscv64\");\n   59 |         let has_atomic32 = has_atomic64 || emscripten;\n   60 |         if minor < 34 || !has_atomic64 {\n   61 |             println!(\"cargo:rustc-cfg=no_std_atomic64\");\n   62 |         }\n   63 |         if minor < 34 || !has_atomic32 {\n   64 |             println!(\"cargo:rustc-cfg=no_std_atomic\");\n   65 |         }\n   66 |     }","lines":19,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_core/build.rs#L48-L66"}]},
{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"Every visit_* method on the IgnoredAny Visitor is marked #[inline] except visit_enum (line 222).\nThis inconsistency means calls to visit_enum may not be inlined at the call site, adding an\nunnecessary function call overhead for a method whose body is a single expression. Since\nIgnoredAny is designed as a zero-cost discard utility, all its methods should be inline.\nThe same is true in the copy at serde/src/core/de/ignored_any.rs:222.","fix":"Add #[inline] before `fn visit_enum` to match all other methods in the impl block.","locations":[{"ref":"serde_core/src/de/ignored_any.rs:222","code":"  222 |     fn visit_enum<A>(self, data: A) -> Result<Self::Value, A::Error>","lines":1,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_core/src/de/ignored_any.rs#L222"},{"ref":"serde/src/core/de/ignored_any.rs:222","code":"  222 |     fn visit_enum<A>(self, data: A) -> Result<Self::Value, A::Error>","lines":1,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde/src/core/de/ignored_any.rs#L222"}]},
{"id":"PERF_9","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"The `iterator_len_hint` function only reports a length when the size hint's lower and upper bounds are equal (`lo == hi`). For iterators that over-estimate but provide tight hints, this returns `None`, forcing `collect_seq` and `collect_map` to call `serialize_seq(None)`. Many serializers (like JSON) perform better with a known length upfront, so imprecise size hints cause unnecessary overhead. The function is intentionally conservative but the comment does not explain why it's not sufficient to use `hi` alone.","fix":"Add a comment explaining why only exact hints (`lo == hi`) are used rather than the upper bound `hi`. If upper-bound estimates are acceptable for the use case, consider returning `Some(hi)` when `hi` is available as an opt-in for better performance.","locations":[{"ref":"serde_core/src/ser/mod.rs:2002-2010","code":" 2002 | fn iterator_len_hint<I>(iter: &I) -> Option<usize>\n 2003 | where\n 2004 |     I: Iterator,\n 2005 | {\n 2006 |     match iter.size_hint() {\n 2007 |         (lo, Some(hi)) if lo == hi => Some(lo),\n 2008 |         _ => None,\n 2009 |     }\n 2010 | }","lines":9,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_core/src/ser/mod.rs#L2002-L2010"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`serde_if_integer128!` in integer128.rs is a deprecated no-op macro that expands its input unchanged. It is kept only for backward compatibility but contains no meaningful logic and is marked `#[deprecated]`. The macro body `$($tt)* => { $($tt)* }` simply re-emits its tokens, which is equivalent to removing the macro call entirely. Any new code using this macro wastes a proc-macro invocation for zero effect.","fix":"No code change needed for correctness, but document clearly in a comment that this entire file is kept only for semver compatibility with old crates that called `serde_if_integer128!`, so future maintainers do not accidentally remove it while it still has downstream users.","locations":[{"ref":"serde/src/integer128.rs:1-14","code":"    1 | #[macro_export]\n    2 | #[deprecated = \"\n    3 | This macro has no effect on any version of Serde released in the past 2 years.\n    4 | It was used long ago in crates that needed to support Rustc older than 1.26.0,\n    5 | or Emscripten targets older than 1.40.0, which did not yet have 128-bit integer\n    6 | support. These days Serde requires a Rust compiler newer than that so 128-bit\n    7 | integers are always supported.\n    8 | \"]\n    9 | #[doc(hidden)]\n   10 | macro_rules! serde_if_integer128 {\n   11 |     ($($tt:tt)*) => {\n   12 |         $($tt)*\n   13 |     };\n   14 | }","lines":14,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde/src/integer128.rs#L1-L14"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`Field::transparent` in `attr.rs` is a struct field (line 991, initialized to `false` at\nline 1260, exposed via `transparent()` at line 1330, and mutable via `mark_transparent`\nat line 1334). The `transparent` getter on `Field` is never called from within\n`serde_derive` (only `mark_transparent` and the field itself are used internally). The\npresence of an always-`false`-at-construction value and a separate mutation method is\nasymmetric with the rest of the `Attr`-based approach used for every other boolean\nattribute.","fix":"If `transparent()` on `Field` is not used by external consumers, remove the getter and\nkeep only `mark_transparent`/internal access. Alternatively, consider whether the field\nshould be initialized by examining `#[serde(transparent)]` at field level directly,\nmatching the rest of the attribute infrastructure.","locations":[{"ref":"serde_derive/src/internals/attr.rs:991","code":"  991 |     transparent: bool,","lines":1,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_derive/src/internals/attr.rs#L991"},{"ref":"serde_derive/src/internals/attr.rs:1260","code":" 1260 |             transparent: false,","lines":1,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_derive/src/internals/attr.rs#L1260"},{"ref":"serde_derive/src/internals/attr.rs:1330-1336","code":" 1330 |     pub fn transparent(&self) -> bool {\n 1331 |         self.transparent\n 1332 |     }\n 1333 | \n 1334 |     pub fn mark_transparent(&mut self) {\n 1335 |         self.transparent = true;\n 1336 |     }","lines":7,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_derive/src/internals/attr.rs#L1330-L1336"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"In the `int_to_uint!` macro (plain variant, line 296), after `if let Ok(v) = Self::Value::try_from(v as u64)`, the variable `v` is already of type `Self::Value`. The expression `v as Self::Value` is a no-op identity cast. It compiles away but adds visual noise and could confuse readers into thinking a real conversion is happening.","fix":"Replace `return Ok(v as Self::Value);` with `return Ok(v);`.","locations":[{"ref":"serde_core/src/de/impls.rs:293-298","code":"  293 |             if 0 <= v {\n  294 |                 #[allow(irrefutable_let_patterns)]\n  295 |                 if let Ok(v) = Self::Value::try_from(v as u64) {\n  296 |                     return Ok(v as Self::Value);\n  297 |                 }\n  298 |             }","lines":6,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_core/src/de/impls.rs#L293-L298"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"`let private2 = private;` in enum_untagged.rs is an unexplained alias. The alias is needed to avoid a quote macro hygiene issue: `#private` inside a `#(...)*` repetition would require `private` itself to be a repetition variable, so a local alias is captured instead. No comment explains this, making the code look like dead or accidental aliasing. The same pattern appears in identifier.rs (lines 197, 212) but there the binding is inside the closure so it is marginally clearer.","fix":"Add a brief comment: \"// Alias needed: `#private` cannot appear directly inside a repetition `#(...)*` in quote.\"","locations":[{"ref":"serde_derive/src/de/enum_untagged.rs:44","code":"   44 |     let private2 = private;","lines":1,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_derive/src/de/enum_untagged.rs#L44"}]},
{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"`serde_derive_internals/build.rs` always unconditionally emits\n`cargo:rerun-if-changed=src/mod.rs`, but `src/mod.rs` is a symlink that may not\nexist on Windows (the very scenario the build script is designed to handle). When\nthe symlink is absent the file does not exist, so Cargo will treat that\n`rerun-if-changed` as always-dirty and needlessly re-run the build script on every\nbuild on those systems.","fix":"Only emit `cargo:rerun-if-changed=src/mod.rs` when `mod_behind_symlink.exists()` returns true, matching the conditional logic that follows.","locations":[{"ref":"serde_derive_internals/build.rs:7","code":"    7 |     println!(\"cargo:rerun-if-changed=src/mod.rs\");","lines":1,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_derive_internals/build.rs#L7"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The module-level doc comment in `serde_core/src/ser/mod.rs` lists `Result<T, E>` under 'Common standard library types' without mentioning that it requires the `\"result\"` Cargo feature. By contrast, `Rc<T>` and `Arc<T>` are explicitly annotated with `*(if features = [\"rc\"] is enabled)*`. Since `\"result\"` is enabled by default, most users won't notice, but users who disable default features and don't re-enable `\"result\"` will be confused when `Result` is not serializable despite the docs implying unconditional support.","fix":"Add an annotation to the `Result<T, E>` entry in the doc comment, similar to the rc feature annotation: `Result\\<T, E\\>&emsp;*(if* features = \\[\"result\"\\] *is enabled)*`.","locations":[{"ref":"serde_core/src/ser/mod.rs:54-56","code":"   54 | //!    - Option\\<T\\>\n   55 | //!    - Result\\<T, E\\>\n   56 | //!    - PhantomData\\<T\\>","lines":3,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_core/src/ser/mod.rs#L54-L56"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"Typo in comment: \"if the we have a unit variant\" should be \"if we have a unit variant\". The spurious \"the\" makes the sentence grammatically wrong.","fix":"Change the comment to: \"// There is no second key; might be okay if we have a unit variant.\"","locations":[{"ref":"serde_derive/src/de/enum_adjacently.rs:248","code":"  248 |                             // There is no second key; might be okay if the we have a unit variant.","lines":1,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_derive/src/de/enum_adjacently.rs#L248"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"Comment at line 112 in enum_untagged.rs says `deserialize_newtype_variant` is used by adjacently tagged enums \"via `generate_variant`\". No function named `generate_variant` exists in the codebase. The actual caller is `enum_untagged::deserialize_variant` (called from enum_adjacently.rs line 41). The stale function name misleads anyone trying to trace the call graph.","fix":"Replace with: \"// Also used implicitly (via `deserialize_variant`) by adjacently tagged enums\"","locations":[{"ref":"serde_derive/src/de/enum_untagged.rs:112","code":"  112 | // Implicitly (via `generate_variant`) used by adjacently tagged enums","lines":1,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_derive/src/de/enum_untagged.rs#L112"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"`check_flatten_field` is called for both struct fields and enum variant fields, but\nthe error messages hard-code the word \"structs\" regardless of the context. When\n`#[serde(flatten)]` appears on a field of a tuple or newtype *variant*, the error\nreads \"#[serde(flatten)] cannot be used on tuple structs\" / \"...on newtype structs\",\nmisleading users who annotated an enum variant field rather than a struct field.","fix":"Pass context information (struct vs. variant) to `check_flatten_field` and choose the message accordingly, e.g. \"tuple struct or tuple variant\" / \"newtype struct or newtype variant\".","locations":[{"ref":"serde_derive/src/internals/check.rs:122-135","code":"  122 |         Style::Tuple => {\n  123 |             cx.error_spanned_by(\n  124 |                 field.original,\n  125 |                 \"#[serde(flatten)] cannot be used on tuple structs\",\n  126 |             );\n  127 |         }\n  128 |         Style::Newtype => {\n  129 |             cx.error_spanned_by(\n  130 |                 field.original,\n  131 |                 \"#[serde(flatten)] cannot be used on newtype structs\",\n  132 |             );\n  133 |         }\n  134 |         _ => {}\n  135 |     }","lines":14,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_derive/src/internals/check.rs#L122-L135"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"The comment at line 1441 in `ContentDeserializer::deserialize_enum` says 'enums are encoded in json as maps with a single key:value pair'. This comment conflates a JSON-specific encoding detail with the general serde Content representation, and appears verbatim in two places (`ContentDeserializer` and `ContentRefDeserializer`). It is inaccurate for non-JSON formats and misleads readers about the general contract.","fix":"Replace 'in json' with 'in self-describing formats' or remove the format-specific qualifier to accurately describe the general expectation.","locations":[{"ref":"serde/src/private/de.rs:1441","code":" 1441 |                     // enums are encoded in json as maps with a single key:value pair","lines":1,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde/src/private/de.rs#L1441"},{"ref":"serde/src/private/de.rs:2386","code":" 2386 |                     // enums are encoded in json as maps with a single key:value pair","lines":1,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde/src/private/de.rs#L2386"}]},
{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"The comment `// so easy` on line 719 inside `StrVisitor::visit_borrowed_str` is informal and adds no information beyond what the one-line function body already communicates.","fix":"Remove the `// so easy` comment.","locations":[{"ref":"serde_core/src/de/impls.rs:719","code":"  719 |         Ok(v) // so easy","lines":1,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_core/src/de/impls.rs#L719"}]},
{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"The FIXME comment in enum_externally.rs (lines 63-65) references `feature(exhaustive_patterns)` as a future stabilization that would allow cleaner code. This feature has been under RFC/unstable for many years and the comment provides no tracking issue link. The current workaround (calling `variant::<__Field>` and mapping over the result with `match __impossible {}`) is sound but the comment has grown stale without a reference for tracking progress.","fix":"Add a rust-lang tracking issue URL (https://github.com/rust-lang/rust/issues/51085) so maintainers can periodically revisit whether the feature is now stable enough to use.","locations":[{"ref":"serde_derive/src/de/enum_externally.rs:63-65","code":"   63 |             // FIXME: Once feature(exhaustive_patterns) is stable:\n   64 |             // let _serde::#private::Err(__err) = _serde::de::EnumAccess::variant::<__Field>(__data);\n   65 |             // _serde::#private::Err(__err)","lines":3,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_derive/src/de/enum_externally.rs#L63-L65"}]},
