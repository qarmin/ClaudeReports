<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"In `bound::type_of_item`, the function used to generate the `Self` bound for `#[serde(default)]` on containers with generics calls `panic!(\"Serde does not support const generics yet\")` when the container has a const generic parameter. This panic fires at proc-macro expansion time (compile time for the user), producing an opaque panic message rather than a proper compile error via `cx.error_spanned_by`. The proc macro itself is not supposed to panic - it should emit compiler errors. A user who writes `#[derive(Deserialize)] #[serde(default)] struct S<const N: usize>([u8; N])` will get a proc-macro panic with a confusing backtrace instead of a clean error message pointing at the offending attribute.","fix":"Replace `panic!(\"Serde does not support const generics yet\")` with a call to emit a proper compile error via `cx.error_spanned_by` and return a placeholder (e.g., skip the const param). The function should be changed to return a `Result` or accept a `Ctxt` parameter, or the caller should pre-check for const params and emit the error before calling `type_of_item`.","locations":[{"ref":"serde_derive/src/bound.rs:417-420","code":"  417 |                                 }\n  418 |                                 syn::GenericParam::Const(_) => {\n  419 |                                     panic!(\"Serde does not support const generics yet\");\n  420 |                                 }","lines":4,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_derive/src/bound.rs#L417-L420"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"build.rs calls `.unwrap()` on `env::var_os(\"OUT_DIR\")` and `env::var(\"CARGO_PKG_VERSION_PATCH\")` without any context. If either variable is absent (e.g. when build.rs is invoked outside of Cargo) the process panics with a bare 'called Option::unwrap() on a None value' or 'called Result::unwrap() on an Err value' message, giving no indication of which variable is missing or why.","fix":"Use `.expect(\"OUT_DIR not set\")` / `.expect(\"CARGO_PKG_VERSION_PATCH not set\")` so the panic message is actionable, or propagate as a proper build-script error by returning a non-zero exit code.","locations":[{"ref":"serde/build.rs:24-27","code":"   24 |     let out_dir = PathBuf::from(env::var_os(\"OUT_DIR\").unwrap());\n   25 |     let patch_version = env::var(\"CARGO_PKG_VERSION_PATCH\").unwrap();\n   26 |     let module = PRIVATE.replace(\"$$\", &patch_version);\n   27 |     fs::write(out_dir.join(\"private.rs\"), module).unwrap();","lines":4,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde/build.rs#L24-L27"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`MapDeserializer::next_value_seed` (line 1716) and `MapRefDeserializer::next_value_seed` (line 2662) call `.expect(\"MapAccess::next_value called before next_key\")`. While this panic is intentional and documents a programmer error, it can be triggered by a misbehaving `Deserializer` implementation that calls `next_value` out of order, turning a logic bug in external code into an unconditional panic inside serde's private internals - with no opportunity for the caller to catch it as a `Result::Err`.","fix":"This is an intentional design choice documented with a comment. If robustness against misbehaving deserializers is desired, return `Err(de::Error::custom(...))` instead of panicking, at the cost of masking the bug as a recoverable error. Otherwise leave as-is but ensure the comment explaining the intent is kept.","locations":[{"ref":"serde/src/private/de.rs:1713-1717","code":" 1713 |             let value = self.value.take();\n 1714 |             // Panic because this indicates a bug in the program rather than an\n 1715 |             // expected failure.\n 1716 |             let value = value.expect(\"MapAccess::next_value called before next_key\");\n 1717 |             seed.deserialize(ContentDeserializer::new(value))","lines":5,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde/src/private/de.rs#L1713-L1717"},{"ref":"serde/src/private/de.rs:2659-2663","code":" 2659 |             let value = self.value.take();\n 2660 |             // Panic because this indicates a bug in the program rather than an\n 2661 |             // expected failure.\n 2662 |             let value = value.expect(\"MapAccess::next_value called before next_key\");\n 2663 |             seed.deserialize(ContentRefDeserializer::new(value))","lines":5,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde/src/private/de.rs#L2659-L2663"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"ContentSerializer's SerializeMap::serialize_value (inside the `content` mod) panics via\n`.expect(\"serialize_value called before serialize_key\")` when the caller violates the protocol\nby calling serialize_value before serialize_key. The Serializer trait contract says this is a\ncaller error, but the correct response for a library is to return an Err, not to panic.\nAny downstream code that accidentally calls serialize_value out of order (possible in complex\ngeneric serialization chains) will cause an unconditional panic rather than a propagatable error.","fix":"Replace the .expect() with a proper error return:\n\n    let key = match self.key.take() {\n        Some(k) => k,\n        None => return Err(ser::Error::custom(\"serialize_value called before serialize_key\")),\n    };\n\nThis keeps the diagnostic message but turns a panic into a recoverable error consistent with\nthe rest of the serialization error-handling approach.","locations":[{"ref":"serde/src/private/ser.rs:913-916","code":"  913 |             let key = self\n  914 |                 .key\n  915 |                 .take()\n  916 |                 .expect(\"serialize_value called before serialize_key\");","lines":4,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde/src/private/ser.rs#L913-L916"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"visit_i128 and visit_u128 default Visitor implementations call write_fmt(...).unwrap() on a fixed-size stack buffer. If the formatted string ever exceeds the buffer length the Write impl returns Err(fmt::Error) and the unwrap panics. The buffer sizes (58 for i128, 57 for u128) are sized to the exact maximum string lengths by hand (e.g. 'integer `-170141183460469231731687303715884105728` as i128' is exactly 58 bytes). Any change to the format string that adds even one character would silently introduce a panic path that is only hit for extreme values.","fix":"Replace unwrap() with an explicit match or use write!() into a String (behind the alloc feature) to make the code robust to future format-string changes. Alternatively, increase the buffer sizes by a safety margin and add a debug_assert that the full string fits.","locations":[{"ref":"serde_core/src/de/mod.rs:1408-1415","code":" 1408 |         let mut buf = [0u8; 58];\n 1409 |         let mut writer = crate::format::Buf::new(&mut buf);\n 1410 |         fmt::Write::write_fmt(&mut writer, format_args!(\"integer `{}` as i128\", v)).unwrap();\n 1411 |         Err(Error::invalid_type(\n 1412 |             Unexpected::Other(writer.as_str()),\n 1413 |             &self,\n 1414 |         ))\n 1415 |     }","lines":8,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_core/src/de/mod.rs#L1408-L1415"},{"ref":"serde_core/src/de/mod.rs:1470-1477","code":" 1470 |         let mut buf = [0u8; 57];\n 1471 |         let mut writer = crate::format::Buf::new(&mut buf);\n 1472 |         fmt::Write::write_fmt(&mut writer, format_args!(\"integer `{}` as u128\", v)).unwrap();\n 1473 |         Err(Error::invalid_type(\n 1474 |             Unexpected::Other(writer.as_str()),\n 1475 |             &self,\n 1476 |         ))\n 1477 |     }","lines":8,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_core/src/de/mod.rs#L1470-L1477"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"The `serialize_display_bounded_length!` macro calls `.unwrap()` on the `write!` result. If any caller ever passes a value whose `Display` implementation writes more bytes than `MAX_LEN`, the macro panics at runtime. For the standard types that use this macro (`Ipv6Addr`, `SocketAddrV4`, `SocketAddrV6`), the documented constant is tight enough to prevent this, but the macro itself is a footgun for any future caller that guesses a wrong MAX_LEN - the panic message gives no indication of the root cause. The doc comment says 'Panics if the Display impl tries to write more than MAX_LEN bytes', but the panic message from the resulting code will just say 'called Result::unwrap() on an Err value', making debugging very hard.","fix":"Replace `.unwrap()` with an `expect(\"Display output exceeded MAX_LEN bytes\")` call to produce a clearer panic message, or propagate the error as a serialization error instead of panicking. Alternatively, convert a write error to an S::Error::custom message so serialization fails gracefully rather than panicking.","locations":[{"ref":"serde_core/src/ser/impls.rs:726-733","code":"  726 | macro_rules! serialize_display_bounded_length {\n  727 |     ($value:expr, $max:expr, $serializer:expr) => {{\n  728 |         let mut buffer = [0u8; $max];\n  729 |         let mut writer = crate::format::Buf::new(&mut buffer);\n  730 |         write!(&mut writer, \"{}\", $value).unwrap();\n  731 |         $serializer.serialize_str(writer.as_str())\n  732 |     }};\n  733 | }","lines":8,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_core/src/ser/impls.rs#L726-L733"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`deserialize_map_in_place` (the `#[cfg(feature = \"deserialize_in_place\")]` path in\n`struct_.rs`) asserts at proc-macro expansion time that the struct has no flattened\nfields. The assertion message is developer-facing only; users who somehow trigger this\npath (e.g. via macro bugs) will see an unhelpful panic rather than a compile error\nemitted through the `Ctxt` error mechanism. This is consistent with the adjacent\n`assert!` in `tuple.rs:19`, but the struct path is guarded by a prior `None` early return\nfor `has_flatten` (line 430-432), so the assert at line 518-521 is actually dead code -\nit can never fire - which makes it misleading.","fix":"Remove the redundant `assert!` at line 518-521; the check at lines 430-432 already\nguarantees `!has_flatten(fields)` by the time `deserialize_map_in_place` is called.\nAlternatively, convert it to `debug_assert!` to make the intent explicit.","locations":[{"ref":"serde_derive/src/de/struct_.rs:518-521","code":"  518 |     assert!(\n  519 |         !has_flatten(fields),\n  520 |         \"inplace deserialization of maps does not support flatten fields\"\n  521 |     );","lines":4,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_derive/src/de/struct_.rs#L518-L521"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`deserialize_in_place` for tuple structs (`tuple.rs`) asserts at proc-macro expansion\ntime that `fields[0].attrs.deserialize_with().is_none()` (line 214). This fires as a\nhard `panic!` (via `assert!`) rather than a user-friendly compile error when the\nsingle-field tuple struct uses `#[serde(deserialize_with = \"...\")]`. The comment says\n\"We do not generate deserialize_in_place if every field has a deserialize_with\", but the\ncheck at the call site (`de.rs`) should have excluded this case already. If the guard is\nmissed, the proc-macro crashes instead of emitting a diagnostic.","fix":"Replace the `assert!` with an early return of `None` (matching what the comment says\nshould happen) so that the macro degrades gracefully instead of panicking:\n```rust\nif fields[0].attrs.deserialize_with().is_some() {\n    return Fragment::Block(quote!());  // or handle appropriately\n}\n```\nOr, confirm the call site guard is sufficient and convert to `debug_assert!`.","locations":[{"ref":"serde_derive/src/de/tuple.rs:213-214","code":"  213 |         // deserialize_with.\n  214 |         assert!(fields[0].attrs.deserialize_with().is_none());","lines":2,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_derive/src/de/tuple.rs#L213-L214"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`CamelCase::apply_to_variant` and `CamelCase::apply_to_field` use byte-index slicing\n`variant[..1]` / `pascal[..1]` on the string. If the variant or field name starts with a\nmulti-byte Unicode character (valid in Rust identifiers when `#![allow(non_ascii_idents)]`\nis in effect), the slice will not be on a char boundary and Rust will panic at\nproc-macro expansion time. The same issue exists in `PascalCase::apply_to_field` for\n`pascal[..1]` / `pascal[1..]` (line 103).","fix":"Replace `variant[..1].to_ascii_lowercase() + &variant[1..]` with a char-aware split:\n```rust\nlet mut chars = variant.chars();\nmatch chars.next() {\n    Some(c) => c.to_ascii_lowercase().to_string() + chars.as_str(),\n    None => String::new(),\n}\n```\nApply the same pattern for `pascal[..1]` / `pascal[1..]`.","locations":[{"ref":"serde_derive/src/internals/case.rs:62","code":"   62 |             CamelCase => variant[..1].to_ascii_lowercase() + &variant[1..],","lines":1,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_derive/src/internals/case.rs#L62"},{"ref":"serde_derive/src/internals/case.rs:103","code":"  103 |                 pascal[..1].to_ascii_lowercase() + &pascal[1..]","lines":1,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_derive/src/internals/case.rs#L103"}]},
{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`serialize_struct` and `serialize_enum` use `assert!()` to guard against\nfield/variant counts exceeding u32::MAX. When that assertion fails the proc-macro\npanics during expansion, which the compiler surfaces as a cryptic\n\"proc-macro panicked\" message instead of a proper compile-time diagnostic. Although\nthe threshold (4 billion fields/variants) is unreachable in practice, the wrong\nfailure mode is used: these checks should emit a `cx.error_spanned_by` and\nreturn early, not `assert!()`.","fix":"Replace each `assert!(...)` with a call to `cx.error_spanned_by(cont.original, ...)` and return a dummy fragment, consistent with how all other limit violations are reported.","locations":[{"ref":"serde_derive/src/ser.rs:297-303","code":"  297 |     assert!(\n  298 |         fields.len() as u64 <= u64::from(u32::MAX),\n  299 |         \"too many fields in {}: {}, maximum supported count is {}\",\n  300 |         cattrs.name().serialize_name(),\n  301 |         fields.len(),\n  302 |         u32::MAX,\n  303 |     );","lines":7,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_derive/src/ser.rs#L297-L303"},{"ref":"serde_derive/src/ser.rs:396","code":"  396 |     assert!(variants.len() as u64 <= u64::from(u32::MAX));","lines":1,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_derive/src/ser.rs#L396"}]},
{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"build.rs calls `fs::write(...).unwrap()` when writing the generated private.rs file. A write failure (e.g. full disk, permission error) panics instead of printing a meaningful error message.","fix":"Replace `.unwrap()` with `.expect(\"failed to write OUT_DIR/private.rs\")` or handle the error with `eprintln!` and `process::exit(1)`.","locations":[{"ref":"serde/build.rs:27","code":"   27 |     fs::write(out_dir.join(\"private.rs\"), module).unwrap();","lines":1,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde/build.rs#L27"}]},
{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"OneOf::fmt panics unconditionally when names.len() == 0 (line 2340: '0 => panic!()').  The two call sites (Error::unknown_variant and Error::unknown_field) guard against empty slices with is_empty() checks before constructing OneOf, but the panic is a latent trap for any future caller who constructs OneOf directly or adds a new call site without the guard. A proper error message or a debug_assert would be safer.","fix":"Replace the panic!() arm with 'formatter.write_str(\"(no variants)\")' or an equivalent message, or at minimum change it to an unreachable!() with a descriptive message so the intent is obvious.","locations":[{"ref":"serde_core/src/de/mod.rs:2333-2355","code":" 2333 | struct OneOf {\n 2334 |     names: &'static [&'static str],\n 2335 | }\n 2336 | \n 2337 | impl Display for OneOf {\n 2338 |     fn fmt(&self, formatter: &mut fmt::Formatter) -> fmt::Result {\n 2339 |         match self.names.len() {\n 2340 |             0 => panic!(), // special case elsewhere\n 2341 |             1 => write!(formatter, \"`{}`\", self.names[0]),\n 2342 |             2 => write!(formatter, \"`{}` or `{}`\", self.names[0], self.names[1]),\n 2343 |             _ => {\n 2344 |                 tri!(formatter.write_str(\"one of \"));\n 2345 |                 for (i, alt) in self.names.iter().enumerate() {\n 2346 |                     if i > 0 {\n 2347 |                         tri!(formatter.write_str(\", \"));\n 2348 |                     }\n 2349 |                     tri!(write!(formatter, \"`{}`\", alt));\n 2350 |                 }\n 2351 |                 Ok(())\n 2352 |             }\n 2353 |         }\n 2354 |     }\n 2355 | }","lines":23,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_core/src/de/mod.rs#L2333-L2355"}]},
{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In `de.rs`, `Parameters::type_name()` calls `.segments.last().unwrap()` on `self.this_type`. While `syn::Path` objects produced from valid Rust identifiers always have at least one segment, the unwrap is unchecked. If any code path (e.g., a remote path like `some::remote::Type`) were to produce a `this_type` path with no segments due to a parsing edge case, the proc macro would panic rather than emit a proper error.","fix":"Replace `.unwrap()` with `.expect(\"this_type path has no segments\")` for a clearer panic message, or return a fallback `String` using `Option::unwrap_or_else(|| \"unknown\".to_string())` to avoid panics in all edge cases.","locations":[{"ref":"serde_derive/src/de.rs:167-169","code":"  167 |     fn type_name(&self) -> String {\n  168 |         self.this_type.segments.last().unwrap().ident.to_string()\n  169 |     }","lines":3,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_derive/src/de.rs#L167-L169"}]},
{"id":"PANIC_14","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`Ctxt::error_spanned_by` and `Ctxt::syn_error` both call `.as_mut().unwrap()` on\nthe `RefCell<Option<Vec<syn::Error>>>`. The `Option` is set to `None` when\n`Ctxt::check` is consumed (line 47). If any code calls `error_spanned_by` or\n`syn_error` after `check` has already been called on the same `Ctxt` instance, the\nunwrap panics. `check` consumes `self` by value so this cannot happen in safe\ncurrent usage, but the API silently relies on that invariant with no type-level\nenforcement; a future refactor that borrows `&mut self` for `check` (or calls\nerror methods from a reference alias) would introduce a hard-to-diagnose panic.","fix":"Optionally add a debug-mode assertion or a descriptive panic message on the `None` path (e.g. \"Ctxt::error_spanned_by called after check()\") to make the invariant explicit rather than relying on the silent unwrap.","locations":[{"ref":"serde_derive/src/internals/ctxt.rs:31-43","code":"   31 |     pub fn error_spanned_by<A: ToTokens, T: Display>(&self, obj: A, msg: T) {\n   32 |         self.errors\n   33 |             .borrow_mut()\n   34 |             .as_mut()\n   35 |             .unwrap()\n   36 |             // Curb monomorphization from generating too many identical methods.\n   37 |             .push(syn::Error::new_spanned(obj.into_token_stream(), msg));\n   38 |     }\n   39 | \n   40 |     /// Add one of Syn's parse errors.\n   41 |     pub fn syn_error(&self, err: syn::Error) {\n   42 |         self.errors.borrow_mut().as_mut().unwrap().push(err);\n   43 |     }","lines":13,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_derive/src/internals/ctxt.rs#L31-L43"}]},
{"id":"PANIC_15","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In `expand_derive_serialize` (and the parallel path in `de.rs`), when\n`Container::from_ast` returns `None`, the code calls `ctxt.check().unwrap_err()`\n(ser.rs:18). This assumes `from_ast` *always* records at least one error into `ctxt`\nbefore returning `None`. Currently that invariant holds (the only `return None` path\nin `ast.rs:81` is preceded by `cx.error_spanned_by`), but it is implicit and\nfragile. If a future contributor adds a `return None` without a preceding error, the\n`unwrap_err()` on an `Ok(())` result will panic during proc-macro expansion.","fix":"Add a fallback: `ctxt.check().unwrap_err_or_else(|| syn::Error::new(Span::call_site(), \"internal error: from_ast returned None without recording an error\"))`, or add a debug assertion inside `Container::from_ast` that ensures an error is present whenever `None` is returned.","locations":[{"ref":"serde_derive/src/ser.rs:17-19","code":"   17 |     let Some(cont) = Container::from_ast(&ctxt, input, Derive::Serialize, &private.ident()) else {\n   18 |         return Err(ctxt.check().unwrap_err());\n   19 |     };","lines":3,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_derive/src/ser.rs#L17-L19"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"TaggedSerializer::serialize_map and serialize_struct both add 1 to the caller-supplied length\nhint to account for the injected tag field. If the caller passes usize::MAX as the hint,\nthe additions `len + 1` (line 293) and `len.map(|len| len + 1)` (line 283) overflow.\nIn debug builds this panics; in release builds it silently wraps to 0, giving the delegate a\nmisleading hint of 0 entries instead of usize::MAX+1.\nWhile usize::MAX as a hint is pathological, the overflow in debug mode can cause unexpected\npanics in fuzz tests or adversarial inputs to generic serialization code.","fix":"Use saturating arithmetic to clamp instead of wrapping:\n\n    // line 283\n    len.map(|len| len.saturating_add(1))\n\n    // line 293\n    let mut state = tri!(self.delegate.serialize_struct(name, len.saturating_add(1)));\n\nThis correctly degrades to a hint of usize::MAX when the input is usize::MAX, which is\nstill just a hint and does not affect correctness.","locations":[{"ref":"serde/src/private/ser.rs:283","code":"  283 |         let mut map = tri!(self.delegate.serialize_map(len.map(|len| len + 1)));","lines":1,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde/src/private/ser.rs#L283"},{"ref":"serde/src/private/ser.rs:293","code":"  293 |         let mut state = tri!(self.delegate.serialize_struct(name, len + 1));","lines":1,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde/src/private/ser.rs#L293"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"IgnoredAny::visit_enum always calls .newtype_variant() regardless of the actual variant kind in the data.\nFor unit enum variants, VariantAccess implementations are permitted (and encouraged) to return an error\nfrom newtype_variant_seed, as demonstrated by value.rs (line 1761-1768) which returns\n`invalid_type(Unexpected::UnitVariant, &\"newtype variant\")`.\nThis means IgnoredAny silently fails to ignore unit enum variants when using strict format implementations\n(e.g. serde_json with internally-tagged enums that use value.rs-style VariantAccess), breaking the\ncore contract of IgnoredAny: it should silently discard any value.\nThe same defect exists in the copy at serde/src/core/de/ignored_any.rs:226.","fix":"Replace the single newtype_variant() call with a two-step approach that properly handles all variant kinds.\nAfter obtaining the VariantAccess, call unit_variant() and if that errors due to type mismatch,\nfall back to newtype_variant::<IgnoredAny>(). Alternatively, use the pattern already established\nin other parts of serde: try unit_variant() and if the format indicates there is more data, consume it:\n\n    let (_, access) = tri!(data.variant::<IgnoredAny>());\n    // unit_variant correctly handles unit, newtype, tuple, and struct variants\n    // on most format implementations; but for maximum compatibility, prefer:\n    access.newtype_variant::<IgnoredAny>()  // works only if format permits\n\nA robust fix is to introduce a local IgnoreVariantAccess helper that calls the correct method\nafter probing, or to require callers to use VariantAccess::unit_variant() and accept that non-unit\nvariants from strict formats are skipped by consuming their payload via IgnoredAny.\nThe least-invasive correct fix: call `.unit_variant()` for unit variants and `.newtype_variant()`\nfor others - but since we cannot inspect which it is, the real fix is for concrete format\ndeserializers to be lenient in newtype_variant_seed, which is the common practice. Document the\ncurrent limitation clearly, or change to unit_variant() which is more universally correct for\nIgnoredAny's purpose (it doesn't need the payload).","locations":[{"ref":"serde_core/src/de/ignored_any.rs:222-227","code":"  222 |     fn visit_enum<A>(self, data: A) -> Result<Self::Value, A::Error>\n  223 |     where\n  224 |         A: EnumAccess<'de>,\n  225 |     {\n  226 |         tri!(data.variant::<IgnoredAny>()).1.newtype_variant()\n  227 |     }","lines":6,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde_core/src/de/ignored_any.rs#L222-L227"},{"ref":"serde/src/core/de/ignored_any.rs:222-227","code":"  222 |     fn visit_enum<A>(self, data: A) -> Result<Self::Value, A::Error>\n  223 |     where\n  224 |         A: EnumAccess<'de>,\n  225 |     {\n  226 |         tri!(data.variant::<IgnoredAny>()).1.newtype_variant()\n  227 |     }","lines":6,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde/src/core/de/ignored_any.rs#L222-L227"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `build.rs`, the `if_docsrs_then_no_serde_core` cfg flag is emitted unconditionally (line 22) before the rustc version check, but the corresponding `rustc-check-cfg` declaration for it only appears when `minor >= 77` (line 36). On Rust < 1.77, Cargo will see an undeclared cfg value being set, which triggers the `unexpected_cfgs` lint and can cause build warnings or errors depending on the project's lint settings.","fix":"Move the `println!(\"cargo:rustc-cfg=if_docsrs_then_no_serde_core\")` call inside the `if minor >= 77` block, or emit its `check-cfg` declaration unconditionally alongside the cfg itself.","locations":[{"ref":"serde/build.rs:22","code":"   22 |     println!(\"cargo:rustc-cfg=if_docsrs_then_no_serde_core\");","lines":1,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde/build.rs#L22"},{"ref":"serde/build.rs:34-36","code":"   34 |     if minor >= 77 {\n   35 |         println!(\"cargo:rustc-check-cfg=cfg(feature, values(\\\"result\\\"))\");\n   36 |         println!(\"cargo:rustc-check-cfg=cfg(if_docsrs_then_no_serde_core)\");","lines":3,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde/build.rs#L34-L36"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `ContentDeserializer::deserialize_unit` (the owned variant), a `Content::Map` with zero entries is silently accepted as a unit value. This matches the internally-tagged enum workaround described in the comment, but the same permissiveness is not present in `ContentRefDeserializer::deserialize_unit` (line 2266-2273), creating an asymmetry: the same input succeeds through the owned deserializer and fails through the ref deserializer. Code that buffers content and replays it via the ref path will behave differently from code that uses content exactly once.","fix":"Either apply the same empty-map special case to `ContentRefDeserializer::deserialize_unit`, or document the intentional divergence clearly. If the asymmetry is intentional, add a comment explaining why the ref path is stricter.","locations":[{"ref":"serde/src/private/de.rs:1301-1320","code":" 1301 |         fn deserialize_unit<V>(self, visitor: V) -> Result<V::Value, Self::Error>\n 1302 |         where\n 1303 |             V: Visitor<'de>,\n 1304 |         {\n 1305 |             match self.content {\n 1306 |                 Content::Unit => visitor.visit_unit(),\n 1307 | \n 1308 |                 // Allow deserializing newtype variant containing unit.\n 1309 |                 //\n 1310 |                 //     #[derive(Deserialize)]\n 1311 |                 //     #[serde(tag = \"result\")]\n 1312 |                 //     enum Response<T> {\n 1313 |                 //         Success(T),\n 1314 |                 //     }\n 1315 |                 //\n 1316 |                 // We want {\"result\":\"Success\"} to deserialize into Response<()>.\n 1317 |                 Content::Map(ref v) if v.is_empty() => visitor.visit_unit(),\n 1318 |                 _ => Err(self.invalid_type(&visitor)),\n 1319 |             }\n 1320 |         }","lines":20,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde/src/private/de.rs#L1301-L1320"},{"ref":"serde/src/private/de.rs:2266-2274","code":" 2266 |         fn deserialize_unit<V>(self, visitor: V) -> Result<V::Value, Self::Error>\n 2267 |         where\n 2268 |             V: Visitor<'de>,\n 2269 |         {\n 2270 |             match *self.content {\n 2271 |                 Content::Unit => visitor.visit_unit(),\n 2272 |                 _ => Err(self.invalid_type(&visitor)),\n 2273 |             }\n 2274 |         }","lines":9,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde/src/private/de.rs#L2266-L2274"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `ContentDeserializer::deserialize_unit_struct`, both an empty `Content::Map` and an empty `Content::Seq` are accepted as unit struct values (lines 1345-1346). In the corresponding `ContentRefDeserializer::deserialize_unit_struct` (line 2276-2285), neither special case is present - it delegates to `self.deserialize_unit(visitor)` which only accepts `Content::Unit`. This means the same data that deserializes successfully with the owned path will fail with the ref path, breaking the invariant that `ContentRefDeserializer` is a re-playable version of `ContentDeserializer`.","fix":"Add the same empty-map and empty-seq special cases to `ContentRefDeserializer::deserialize_unit_struct`, mirroring the owned implementation.","locations":[{"ref":"serde/src/private/de.rs:1322-1349","code":" 1322 |         fn deserialize_unit_struct<V>(\n 1323 |             self,\n 1324 |             _name: &'static str,\n 1325 |             visitor: V,\n 1326 |         ) -> Result<V::Value, Self::Error>\n 1327 |         where\n 1328 |             V: Visitor<'de>,\n 1329 |         {\n 1330 |             match self.content {\n 1331 |                 // As a special case, allow deserializing untagged newtype\n 1332 |                 // variant containing unit struct.\n 1333 |                 //\n 1334 |                 //     #[derive(Deserialize)]\n 1335 |                 //     struct Info;\n 1336 |                 //\n 1337 |                 //     #[derive(Deserialize)]\n 1338 |                 //     #[serde(tag = \"topic\")]\n 1339 |                 //     enum Message {\n 1340 |                 //         Info(Info),\n 1341 |                 //     }\n 1342 |                 //\n 1343 |                 // We want {\"topic\":\"Info\"} to deserialize even though\n 1344 |                 // ordinarily unit structs do not deserialize from empty map/seq.\n 1345 |                 Content::Map(ref v) if v.is_empty() => visitor.visit_unit(),\n 1346 |                 Content::Seq(ref v) if v.is_empty() => visitor.visit_unit(),\n 1347 |                 _ => self.deserialize_any(visitor),\n 1348 |             }\n 1349 |         }","lines":28,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde/src/private/de.rs#L1322-L1349"},{"ref":"serde/src/private/de.rs:2276-2285","code":" 2276 |         fn deserialize_unit_struct<V>(\n 2277 |             self,\n 2278 |             _name: &'static str,\n 2279 |             visitor: V,\n 2280 |         ) -> Result<V::Value, Self::Error>\n 2281 |         where\n 2282 |             V: Visitor<'de>,\n 2283 |         {\n 2284 |             self.deserialize_unit(visitor)\n 2285 |         }","lines":10,"link":"https://github.com/serde-rs/serde/blob/a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb/serde/src/private/de.rs#L2276-L2285"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The Content enum (lines 426-467) has no I128/U128 variants, and ContentSerializer does not\noverride serialize_i128 or serialize_u128. This means the inherited default implementations\nfrom the Serializer trait return a generic error \"i128 is not supported\" rather than buffering\nthe value. Any struct or map containing i128/u128 fields that passes through the buffering path\n(used for #[serde(tag = ...)] and #[serde(flatten)] with tuple/struct variants) will silently\nfail to serialize even if the target format supports i128/u128. The error message is also\nmisleading because it comes from the default Serializer impl rather than from TaggedSerializer\nor FlatMapSerializer, hiding which field or context caused the failure.","fix":"Add Content::I128(i128) and Content::U128(u128) variants to the Content enum, add matching\narms to Content's Serialize impl (forwarding to serializer.serialize_i128/u128), and add\noverrides for serialize_i128/serialize_u128 in ContentSerializer that return Ok(Content::I128(v))\nand Ok(Content::U128(v)) respectively. This unblocks i128/u128 fields in tagged/flattened structs\nfor formats that support them.","locations":[{"ref":"serde/src/private/ser.rs:426-467","code":"  426 |     pub enum Content {\n  427 |         Bool(bool),\n  428 | \n  429 |         U8(u8),\n  430 |         U16(u16),\n  431 |         U32(u32),\n  432 |         U64(u64),\n  433 | \n  434 |         I8(i8),\n  435 |         I16(i16),\n  436 |         I32(i32),\n  437 |         I64(i64),\n  438 | \n  439 |         F32(f32),\n  440 |         F64(f64),\n  441 | \n  442 |         Char(char),\n  443 |         String(String),\n  444 |         Bytes(Vec<u8>),\n  445 | \n  446 |         None,\n  447 |         Some(Box<Content>),\n  448 | \n  449 |         Unit,\n  450 |         UnitStruct(&'static str),\n  451 |         UnitVariant(&'static str, u32, &'stati
