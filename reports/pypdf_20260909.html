<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`Font._collect_cid_character_widths` and `Font._collect_tt_t1_character_widths`\ncall `chr()` on character codes taken directly from a malformed `/W` (CID) or\n`/FirstChar` + `/Widths` array without bounds checking. `chr()` raises\n`ValueError` for any value above `0x10FFFF`. In `_collect_tt_t1_character_widths`\n`current_widths[chr(idx + first_char)]` blows up if `/FirstChar` is large; in the\nCID path `chr(_cidx)` over `range(cast(int, start_idx), cast(int, stop_idx + 1))`\ndoes the same, and a large `stop_idx` (format 2, e.g. `[0 2000000 500]`) also\nallocates a huge dict before failing (memory pressure / DoS). These functions are\ninvoked from `Font.from_font_resource`, which is called during\n`PageObject._extract_text`; the surrounding `try` there only catches\n`(AttributeError, TypeError)` (line 1841), so a `ValueError` propagates out and\ncrashes `extract_text()` on an otherwise readable document.","fix":"Validate the code point range before calling `chr()` and skip / warn on\nout-of-range or oversized entries, e.g. guard with\n`if not (0 <= _cidx <= 0x10FFFF): continue` in both loops, and cap the\nformat-2 range length. Alternatively broaden the `except` in\n`PageObject._extract_text` (line 1841) to also catch `ValueError`, but fixing at\nthe source in `_font.py` is preferable so widths are still partially collected.","locations":[{"ref":"pypdf/_font.py:154-155","code":"  154 |         for idx, width in enumerate(widths_array):\n  155 |             current_widths[chr(idx + first_char)] = int(width)","lines":2,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/_font.py#L154-L155"},{"ref":"pypdf/_page.py:1882-1891","code":" 1882 |             for font_resource in font_resources_dict:\n 1883 |                 try:\n 1884 |                     font_resource_object = cast(DictionaryObject, font_resources_dict[font_resource].get_object())\n 1885 |                     font_resources[font_resource] = font_resource_object\n 1886 |                     fonts[font_resource] = Font.from_font_resource(font_resource_object)\n 1887 |                     # Override space width, if applicable\n 1888 |                     if fonts[font_resource].character_widths.get(fonts[font_resource].space_char, 0) == 0:\n 1889 |                         fonts[font_resource].space_width = space_width\n 1890 |                 except (AttributeError, TypeError):\n 1891 |                     pass","lines":10,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/_page.py#L1882-L1891"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`get_author_mapping` computes `per_page = min(line_count, 100)` and then iterates\n`for _ in range(0, line_count, per_page)`. When `line_count == 0` (which happens when\n`get_git_commits_since_tag` finds no commits since the tag), `per_page` becomes `0` and\n`range(0, 0, 0)` raises `ValueError: range() arg 3 must not be zero`. This crashes before\n`main` can reach its `changes == \"\"` early-return, so the \"No changes\" path is unreachable\nwhen there really are no changes.","fix":"Return early when there is nothing to fetch: at the top of `get_author_mapping` add\n`if line_count == 0: return {}`, or clamp with `per_page = max(1, min(line_count, 100))`.","locations":[{"ref":"make_release.py:318-321","code":"  318 |     per_page = min(line_count, 100)\n  319 |     page = 1\n  320 |     mapping: dict[str, str] = {}\n  321 |     for _ in range(0, line_count, per_page):","lines":4,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/make_release.py#L318-L321"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`PdfDocCommon.xfa` iterates the `/XFA` array as (tag, value) pairs using\n`for f in i: tag = f; f = next(i)`. If `/XFA` has an odd number of elements (a\nmalformed but easily crafted array), the explicit `next(i)` on the final tag\nraises `StopIteration`. Since `xfa` is a plain property getter (not a generator),\nthe `StopIteration` propagates to the caller as an unexpected exception rather\nthan a clean end-of-iteration or `PdfReadError`.","fix":"Guard the second read, e.g. iterate over indices in steps of two with a length\ncheck, or wrap the pairing with `next(i, None)` and `break`/warn when the value is\n`None`, so a malformed odd-length `/XFA` array is handled gracefully instead of\nraising `StopIteration`.","locations":[{"ref":"pypdf/_doc_common.py:1539-1550","code":" 1539 |         if \"/XFA\" in tree:\n 1540 |             fields = cast(ArrayObject, tree[\"/XFA\"])\n 1541 |             i = iter(fields)\n 1542 |             for f in i:\n 1543 |                 tag = f\n 1544 |                 f = next(i)\n 1545 |                 if isinstance(f, IndirectObject):\n 1546 |                     field = cast(Optional[EncodedStreamObject], f.get_object())\n 1547 |                     if field:\n 1548 |                         es = _decompress_with_limit(field._data)\n 1549 |                         retval[tag] = es\n 1550 |         return retval","lines":12,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/_doc_common.py#L1539-L1550"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`PageObject.scale_to` divides by the media box dimensions without checking for\nzero: `sx = width / float(self.mediabox.width)` and\n`sy = height / float(self.mediabox.height)`. A page whose `/MediaBox` is degenerate\n(zero width or height, which occurs in malformed PDFs) triggers an uncaught\n`ZeroDivisionError`.","fix":"Validate the denominators before dividing and raise a clear error (or no-op) when\nthe media box has zero width/height, e.g. guard with\n`if not self.mediabox.width or not self.mediabox.height: raise ValueError(...)`.","locations":[{"ref":"pypdf/_page.py:1748-1760","code":" 1748 |     def scale_to(self, width: float, height: float) -> None:\n 1749 |         \"\"\"\n 1750 |         Scale a page to the specified dimensions by applying a transformation\n 1751 |         matrix to its content and updating the page size.\n 1752 | \n 1753 |         Args:\n 1754 |             width: The new width.\n 1755 |             height: The new height.\n 1756 | \n 1757 |         \"\"\"\n 1758 |         sx = width / float(self.mediabox.width)\n 1759 |         sy = height / float(self.mediabox.height)\n 1760 |         self.scale(sx, sy)","lines":13,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/_page.py#L1748-L1760"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In `_read_standard_xref_table`, the CRLF-adjustment loop dereferences `line[0]` without\nre-checking that the freshly read line is non-empty:\n\n```python\nwhile line[0] in b\"\\x0D\\x0A\":\n    stream.seek(-20 + 1, 1)\n    line = stream.read(20)\n```\n\nThe initial `line` is checked for emptiness above the loop, but each iteration seeks back\n19 bytes and re-reads 20. Near EOF (a malformed xref table whose entries are padded with\nruns of CR/LF), `stream.read(20)` can return `b\"\"`, after which the loop condition\nevaluates `b\"\"[0]` and raises `IndexError` instead of a `PdfReadError`.","fix":"Guard the loop condition on a non-empty line:\n\n```python\nwhile line and line[0] in b\"\\x0D\\x0A\":\n    stream.seek(-20 + 1, 1)\n    line = stream.read(20)\nif not line:\n    raise PdfReadError(\"Unexpected end of Xref table.\")\n```","locations":[{"ref":"pypdf/_reader.py:949-961","code":"  949 |                 line = stream.read(20)\n  950 |                 if not line:\n  951 |                     raise PdfReadError(\"Unexpected empty line in Xref table.\")\n  952 | \n  953 |                 # It's very clear in section 3.4.3 of the PDF spec\n  954 |                 # that all cross-reference table lines are a fixed\n  955 |                 # 20 bytes (as of PDF 1.7). However, some files have\n  956 |                 # 21-byte entries (or more) due to the use of \\r\\n\n  957 |                 # (CRLF) EOL's. Detect that case, and adjust the line\n  958 |                 # until it does not begin with a \\r (CR) or \\n (LF).\n  959 |                 while line[0] in b\"\\x0D\\x0A\":\n  960 |                     stream.seek(-20 + 1, 1)\n  961 |                     line = stream.read(20)","lines":13,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/_reader.py#L949-L961"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`fixed_width_page` guards against a zero effective font height but not against a zero\n`font_height_weight`:\n\n```python\nfh = line_data[0][\"font_height\"]\nblank_lines = 0 if fh == 0 else (\n    int(abs(y_coord - last_y_coord) / (fh * font_height_weight)) - 1\n)\n```\n\n`font_height_weight` is a user-supplied parameter (`extract_text(..., layout_mode_font_height_weight=...)`).\nPassing `0` while `fh != 0` divides by zero and raises `ZeroDivisionError`.","fix":"Include the weight in the zero check:\n\n```python\ndenom = fh * font_height_weight\nblank_lines = 0 if denom == 0 else (\n    int(abs(y_coord - last_y_coord) / denom) - 1\n)\n```","locations":[{"ref":"pypdf/_text_extraction/_layout_mode/_fixed_width_page.py:404-408","code":"  404 |         if space_vertically and lines:\n  405 |             fh = line_data[0][\"font_height\"]\n  406 |             blank_lines = 0 if fh == 0 else (\n  407 |                 int(abs(y_coord - last_y_coord) / (fh * font_height_weight)) - 1\n  408 |             )","lines":5,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/_text_extraction/_layout_mode/_fixed_width_page.py#L404-L408"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"The module-level helper `_complete()` (executed on import) unconditionally\noverwrites keys `/a0` .. `/a255` with `chr(i)`:\n```\ndef _complete() -> None:\n    for i in range(256):\n        adobe_glyphs[f\"/a{i}\"] = chr(i)\n    adobe_glyphs[\"/.notdef\"] = \"□\"\n```\nBut 16 of those names are already legitimate Adobe/Zapf-Dingbats glyph entries\ndefined literally in the dict (`/a1`, `/a2`, `/a3`, `/a4`, `/a40`, `/a41`,\n`/a42`, `/a43`, `/a48`, `/a49`, `/a50`, `/a51`, `/a58`, `/a59`, `/a60`, `/a61`\nat lines 13560-13575). `_complete()` runs after the literal definitions and\nsilently clobbers them with control/ASCII characters. Verified at runtime:\n```\n>>> adobe_glyphs[\"/a1\"]   # literal def says U+25C1 (◁)\n'\\x01'                    # actually U+0001 (SOH control char)\n>>> adobe_glyphs[\"/a61\"]  # literal def says U+2290\n'='                        # actually U+003D\n```\nSo these 16 glyph names extract as control/ASCII garbage instead of the\ndocumented symbols.","fix":"Do not let the fallback fill overwrite existing entries. Use `setdefault` so the\nliteral AGL definitions win:\n```\ndef _complete() -> None:\n    for i in range(256):\n        adobe_glyphs.setdefault(f\"/a{i}\", chr(i))\n    adobe_glyphs.setdefault(\"/.notdef\", \"□\")\n```\nAlternatively, if the `/a{i}` fallbacks were never meant to shadow the Zapf\nDingbats names, drop the loop entirely or gate it to only the indices that are\nnot already present. After the fix verify `adobe_glyphs[\"/a1\"] == \"\\u25C1\"`.","locations":[{"ref":"pypdf/_codecs/adobe_glyphs.py:17301-17307","code":"17301 | def _complete() -> None:\n17302 |     for i in range(256):\n17303 |         adobe_glyphs[f\"/a{i}\"] = chr(i)\n17304 |     adobe_glyphs[\"/.notdef\"] = \"□\"\n17305 | \n17306 | \n17307 | _complete()","lines":7,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/_codecs/adobe_glyphs.py#L17301-L17307"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `parse_commit_line` the guard checks for a bare colon but the split uses colon-plus-space:\n\n```python\nif \":\" in rest:\n    prefix, message = rest.split(\": \", 1)\nelse:\n    prefix = \"\"\n    message = rest\n```\n\nA commit subject that contains a `:` but no `: ` (colon immediately followed by a\nnon-space, e.g. `rest = \"BUG:fix typo\"`) satisfies `\":\" in rest` but\n`rest.split(\": \", 1)` returns a single-element list, so the tuple unpacking\n`prefix, message = ...` raises `ValueError: not enough values to unpack`.\nThis crashes the release changelog generator on an otherwise legitimate commit message.","fix":"Test for the exact separator being split on. Change the condition from `if \":\" in rest:`\nto `if \": \" in rest:` so the split is guaranteed to yield two parts:\n\n```python\nif \": \" in rest:\n    prefix, message = rest.split(\": \", 1)\nelse:\n    prefix = \"\"\n    message = rest\n```","locations":[{"ref":"make_release.py:381-385","code":"  381 |     if \":\" in rest:\n  382 |         prefix, message = rest.split(\": \", 1)\n  383 |     else:\n  384 |         prefix = \"\"\n  385 |         message = rest","lines":5,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/make_release.py#L381-L385"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In the non-strict AES-CBC decrypt fallback, when `unpad`/`PKCS7().unpadder()` raises a padding\nerror the code recovers by slicing off `padded_data[-1]` trailing bytes with\n`return padded_data[: -padded_data[-1]]`. This is wrong for two edge cases that are perfectly\nreachable when padding is already invalid (the branch is only entered on a padding error, so the\nlast byte is arbitrary):\n- If the last plaintext byte is `0`, then `-padded_data[-1]` is `-0 == 0`, so the expression\n  becomes `padded_data[:0]` which returns an empty `bytes`, silently discarding the entire\n  decrypted stream.\n- If the last byte value is greater than or equal to `len(padded_data)`, the negative slice start\n  clamps to the beginning and again returns empty `bytes`.\nIn both cases decrypted content is silently lost instead of being recovered, defeating the whole\npurpose of the non-strict recovery path. The bug exists identically in both crypto providers.","fix":"Guard the pad length before slicing so a zero/oversized trailing byte does not wipe the buffer,\ne.g. compute `pad_len = padded_data[-1]` and only strip when `0 < pad_len <= len(padded_data)`:\n```\npad_len = padded_data[-1]\nif 0 < pad_len <= len(padded_data):\n    return padded_data[:-pad_len]\nreturn padded_data\n```\nApply the same fix to both `pypdf/_crypt_providers/_cryptography.py` and\n`pypdf/_crypt_providers/_pycryptodome.py`.","locations":[{"ref":"pypdf/_crypt_providers/_cryptography.py:140-144","code":"  140 |         except ValueError as exception:\n  141 |             if strict:\n  142 |                 raise PdfStreamError(exception)\n  143 |             logger_warning(\"Ignoring padding error: %(exception)s\", source=__name__, exception=exception)\n  144 |             return padded_data[: -padded_data[-1]]","lines":5,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/_crypt_providers/_cryptography.py#L140-L144"},{"ref":"pypdf/_crypt_providers/_pycryptodome.py:82-86","code":"   82 |         except ValueError as exception:\n   83 |             if strict:\n   84 |                 raise PdfStreamError(exception)\n   85 |             logger_warning(\"Ignoring padding error: %(exception)s\", source=__name__, exception=exception)\n   86 |             return padded_data[: -padded_data[-1]]","lines":5,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/_crypt_providers/_pycryptodome.py#L82-L86"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`read_until_regex` raises `LimitReachedError` based on the number of *bytes read* rather\nthan the *position of the match*, so a valid token that ends within `length` can be\nrejected. The limit check runs before the regex search:\n\n```python\nif (current_length := total_length + token_length) >= length:\n    raise LimitReachedError(...)\n...\nsearch_match = regex.search(current_buffer)\n```\n\nBecause `chunk_size` grows geometrically (up to 8192), the final `stream.read(chunk_size)`\ncan pull far more bytes than the remaining allowance even when the delimiter sits well\ninside `length`. Example: `NumberObject.read` uses `length=64`; a 50-digit number\n(valid, `< 64`) followed by a delimiter is read as chunks of 16, 32, then 64 bytes.\nThe third read makes `current_length = 48 + 64 = 112 >= 64`, so it raises *before*\nsearching, even though the delimiter is at offset 50. The same window exists for\n`NameObject` (`length=4096`): names of length ~4080-4095 spuriously fail. Malformed\nerror on structurally valid input.","fix":"Search for the match before enforcing the limit, and only raise when no match is found\nwithin the allowance. For instance, compute the match first and raise only if\n`search_match is None and current_length >= length`, or cap the read so it never pulls\nmore than `length - total_length` bytes past the limit before searching.","locations":[{"ref":"pypdf/_utils.py:304-330","code":"  304 |     while True:\n  305 |         token = stream.read(chunk_size)\n  306 |         if not token:\n  307 |             return b\"\".join(parts)\n  308 |         token_length = len(token)\n  309 |         if (current_length := total_length + token_length) >= length:\n  310 |             raise LimitReachedError(\n  311 |                 f\"Read stream length of {current_length} exceeds maximum allowed length of {length}.\"\n  312 |             )\n  313 | \n  314 |         # Search overlap of previous tail + new chunk to catch\n  315 |         # multi-byte regex matches spanning chunk boundaries.\n  316 |         current_buffer = tail + token\n  317 |         search_match = regex.search(current_buffer)\n  318 |         parts.append(token)\n  319 |         if search_match is not None:\n  320 |             overlap = len(tail)\n  321 |             actual_start = total_length - overlap + search_match.start()\n  322 |             stream.seek(actual_start - total_length - token_length, 1)\n  323 |             return b\"\".join(parts)[:actual_start]\n  324 |         total_length += token_length\n  325 | \n  326 |         # Fixed overlap: 16 bytes is sufficient for the short\n  327 |         # delimiter patterns used in PDF parsing.\n  328 |         tail = token[-16:]\n  329 |         if chunk_size < 8192:\n  330 |             chunk_size <<= 1","lines":27,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/_utils.py#L304-L330"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`Text` annotation writes the caller-supplied `flags` value under the key `/Flags`, which is\n**not** a valid PDF annotation entry. The annotation flags field defined by the spec (and used by\nthe base class `AnnotationDictionary.flags` property) is `/F`. As a result, the `flags` constructor\nargument to `Text(...)` is silently written to a bogus key and has no effect on viewers, while every\nother annotation (e.g. `Highlight` uses `self.flags = ...` which writes `/F`) behaves differently.\nThis is a copy/paste-style inconsistency that makes a documented parameter a no-op.","fix":"Write the flags to `/F` (matching the base class property and the PDF spec). Before:\n```python\nself[NameObject(\"/Open\")] = BooleanObject(open)\nself[NameObject(\"/Flags\")] = NumberObject(flags)\n```\nAfter:\n```python\nself[NameObject(\"/Open\")] = BooleanObject(open)\nself[NameObject(\"/F\")] = NumberObject(flags)\n```\nBetter still, reuse the inherited setter with `self.flags = AnnotationFlag(flags)`.","locations":[{"ref":"pypdf/annotations/_markup_annotations.py:124-128","code":"  124 |         self[NameObject(\"/Subtype\")] = NameObject(\"/Text\")\n  125 |         self[NameObject(\"/Rect\")] = RectangleObject(rect)\n  126 |         self[NameObject(\"/Contents\")] = TextStringObject(text)\n  127 |         self[NameObject(\"/Open\")] = BooleanObject(open)\n  128 |         self[NameObject(\"/Flags\")] = NumberObject(flags)","lines":5,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/annotations/_markup_annotations.py#L124-L128"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`decode_stream_data` fetches the image height with a default of `()` (an empty tuple) and passes it\nstraight into `CCITTFaxDecode.decode`:\n```python\nheight = stream.get(ImageAttributes.HEIGHT, ())\ndata = CCITTFaxDecode.decode(data, params, height)\n```\n`CCITTFaxDecode._get_parameters` then does `CCITTParameters(rows=int(rows))`. When a CCITT stream is\nmissing `/Height` (malformed/untrusted input), `int(())` raises `TypeError: int() argument must be\na string, a bytes-like object or a real number, not 'tuple'` - an uncaught, non-`PdfError` exception\nduring stream decoding. Verified: `int(())` raises `TypeError`.","fix":"Use a numeric default: `height = stream.get(ImageAttributes.HEIGHT, 0)`, and/or make\n`_get_parameters` coerce non-int `rows` to `0` (e.g. `rows = int(rows) if isinstance(rows, (int, IndirectObject)) else 0`).\nThe `decode` signature already defaults `height` to `0`, so simply changing the `.get` default to `0`\nfixes the direct call path.","locations":[{"ref":"pypdf/filters.py:875-876","code":"  875 |             height = stream.get(ImageAttributes.HEIGHT, ())\n  876 |             data = CCITTFaxDecode.decode(data, params, height)","lines":2,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/filters.py#L875-L876"},{"ref":"pypdf/filters.py:658-659","code":"  658 |     ) -> CCITTParameters:\n  659 |         ccitt_parameters = CCITTParameters(rows=int(rows))","lines":2,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/filters.py#L658-L659"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In both `StreamObject.replicate` and `ContentStream.replicate`, the cached decoded stream is\nassigned back to `self.decoded_self` instead of the clone `d__.decoded_self`. This is a\ncopy-paste error: `replicate` should populate the clone, but instead it mutates the *source*\nobject's cache (pointing the source's `decoded_self` at an object cloned into `pdf_dest`, a\ndifferent document) and leaves `d__.decoded_self` at its `__init__` default of `None`.","fix":"Assign to the clone, not the source. Replace\n```\ndecoded_self = self.decoded_self\nif decoded_self is None:\n    self.decoded_self = None\nelse:\n    self.decoded_self = cast(\"DecodedStreamObject\", decoded_self.replicate(pdf_dest))\n```\nwith\n```\ndecoded_self = self.decoded_self\nif decoded_self is None:\n    d__.decoded_self = None\nelse:\n    d__.decoded_self = cast(\"DecodedStreamObject\", decoded_self.replicate(pdf_dest))\n```\nin both `StreamObject.replicate` and `ContentStream.replicate`.","locations":[{"ref":"pypdf/generic/_data_structures.py:982-991","code":"  982 |         try:\n  983 |             decoded_self = self.decoded_self\n  984 |             if decoded_self is None:\n  985 |                 self.decoded_self = None\n  986 |             else:\n  987 |                 self.decoded_self = cast(\n  988 |                     \"DecodedStreamObject\", decoded_self.replicate(pdf_dest)\n  989 |                 )\n  990 |         except Exception:\n  991 |             pass","lines":10,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/generic/_data_structures.py#L982-L991"},{"ref":"pypdf/generic/_data_structures.py:1285-1292","code":" 1285 |         try:\n 1286 |             decoded_self = self.decoded_self\n 1287 |             if decoded_self is None:\n 1288 |                 self.decoded_self = None\n 1289 |             else:\n 1290 |                 self.decoded_self = cast(\n 1291 |                     \"DecodedStreamObject\", decoded_self.replicate(pdf_dest)\n 1292 |                 )","lines":8,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/generic/_data_structures.py#L1285-L1292"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`ContentStream.replicate` copies `self._data` and the dictionary items into the clone `d__`,\nbut never sets the clone's `pdf`, `_operations`, or `forced_encoding`. The code that would\nset them (lines 1291-1295) is placed *after* a `return d__` statement, so it is unreachable\ndead code. As a result the returned clone keeps `pdf = None` (from `self.__class__(None, None)`)\nand an empty `_operations`/default `forced_encoding`, silently losing state during\n`replicate` (used by incremental `clone_document_from_root`).","fix":"Remove the premature `return d__` at line 1290 and keep the field-initialisation, or move the\nfield assignments before the single `return`. The clone must receive `d__.pdf = pdf_dest`,\n`d__._operations = list(self._operations)` and `d__.forced_encoding = self.forced_encoding`.\nThe trailing lines after the first `return` are dead code and must not remain.","locations":[{"ref":"pypdf/generic/_data_structures.py:1295-1304","code":" 1295 |         for k, v in self.items():\n 1296 |             d__[k.replicate(pdf_dest)] = (\n 1297 |                 v.replicate(pdf_dest) if hasattr(v, \"replicate\") else v\n 1298 |             )\n 1299 |         return d__\n 1300 |         d__.set_data(self._data)\n 1301 |         d__.pdf = pdf_dest\n 1302 |         d__._operations = list(self._operations)\n 1303 |         d__.forced_encoding = self.forced_encoding\n 1304 |         return d__","lines":10,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/generic/_data_structures.py#L1295-L1304"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`_xobj_to_image` computes `len(data) % (size[0] * size[1])` where `size` is taken directly\nfrom `/Width` and `/Height`. A malformed image with `/Width 0` or `/Height 0` makes the\nproduct `0`, so the modulo raises an uncaught `ZeroDivisionError` instead of a graceful\n`PdfReadError`. This is reachable via `StreamObject.decode_as_image` / `page.images` on\nattacker-controlled PDFs.","fix":"Guard against a zero pixel count before the modulo, e.g.\n```\npixel_count = size[0] * size[1]\nif pixel_count == 0:\n    raise PdfReadError(f\"Image has zero dimension: {size}\")\nif len(data) % pixel_count == 1 and data[-1] == 0x0A:\n    data = data[:-1]\n```","locations":[{"ref":"pypdf/generic/_image_xobject.py:600-605","code":"  600 |     size = (cast(int, x_object[ImageAttributes.WIDTH]), cast(int, x_object[ImageAttributes.HEIGHT]))\n  601 |     data = x_object.get_data()  # type: ignore[attr-defined]\n  602 |     if isinstance(data, str):  # pragma: no cover\n  603 |         data = data.encode()\n  604 |     if len(data) % (size[0] * size[1]) == 1 and data[-1] == 0x0A:  # i.e. '\\n'\n  605 |         data = data[:-1]","lines":6,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/generic/_image_xobject.py#L600-L605"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"XMP date properties (`dc_date`, `xmp_create_date`, `xmp_modify_date`, `xmp_metadata_date`) run\nattacker-controlled strings through `_converter_date`, which passes the parsed fields straight\ninto `datetime.datetime(...)`. The `iso8601` regex allows out-of-range values: `month` is\n`[0-9]{2}` (accepts `00`, `13`..`99`), `day` is `[0-9]+` (accepts `99`, `999`, ...), and a\n`second` of `60` is possible. Any of these makes `datetime.datetime` raise an uncaught\n`ValueError` (or `OverflowError` for huge day counts) that propagates out of the property\ngetter, turning a read of metadata into a crash.","fix":"Wrap the `datetime.datetime(...)`/`timedelta` construction in `_converter_date` and catch\n`(ValueError, OverflowError)`, converting to a domain error (or returning `None`). Alternatively\ntighten the regex ranges (month `0[1-9]|1[0-2]`, day `0[1-9]|[12][0-9]|3[01]`) and clamp the\nsecond to `0..59`. The getters that call the converter should also tolerate a conversion\nfailure rather than letting it escape.","locations":[{"ref":"pypdf/xmp.py:117-141","code":"  117 | def _converter_date(value: str) -> datetime.datetime:\n  118 |     matches = iso8601.match(value)\n  119 |     if matches is None:\n  120 |         raise ValueError(f\"Invalid date format: {value}\")\n  121 |     year = int(matches.group(\"year\"))\n  122 |     month = int(matches.group(\"month\") or \"1\")\n  123 |     day = int(matches.group(\"day\") or \"1\")\n  124 |     hour = int(matches.group(\"hour\") or \"0\")\n  125 |     minute = int(matches.group(\"minute\") or \"0\")\n  126 |     second = decimal.Decimal(matches.group(\"second\") or \"0\")\n  127 |     seconds_dec = second.to_integral(decimal.ROUND_FLOOR)\n  128 |     milliseconds_dec = (second - seconds_dec) * 1_000_000\n  129 | \n  130 |     seconds = int(seconds_dec)\n  131 |     milliseconds = int(milliseconds_dec)\n  132 | \n  133 |     tzd = matches.group(\"tzd\") or \"Z\"\n  134 |     dt = datetime.datetime(year, month, day, hour, minute, seconds, milliseconds)\n  135 |     if tzd != \"Z\":\n  136 |         tzd_hours, tzd_minutes = (int(x) for x in tzd.split(\":\"))\n  137 |         tzd_hours *= -1\n  138 |         if tzd_hours < 0:\n  139 |             tzd_minutes *= -1\n  140 |         dt = dt + datetime.timedelta(hours=tzd_hours, minutes=tzd_minutes)\n  141 |     return dt","lines":25,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/xmp.py#L117-L141"},{"ref":"pypdf/xmp.py:409-412","code":"  409 |     @property\n  410 |     def dc_date(self) -> Optional[list[datetime.datetime]]:\n  411 |         \"\"\"A sorted array of dates of significance to the resource. The dates and times are in UTC.\"\"\"\n  412 |         return self._get_seq_values(DC_NAMESPACE, \"date\", _converter_date)","lines":4,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/xmp.py#L409-L412"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`is_semantic_version` returns `bool([int(part) for part in version.split(\".\")])`. Because the\n`version.count(\".\") != 2` guard already ensures the split yields exactly three parts, the list\ncomprehension always produces a non-empty (hence truthy) list whenever the `int()` calls\nsucceed, so `bool([...])` is always `True`. The `bool(list)` wrapping is therefore misleading;\nthe real check is only \"do all three parts parse as ints\". It also accepts clearly invalid\nversions such as `-1.-2.-3`, `+1.2.3` and `1. 2 . 3` because `int()` tolerates signs and\nsurrounding whitespace.","fix":"Return an explicit boolean and reject non-plain-digit parts, e.g.\n`return all(part.isdigit() for part in version.split(\".\"))` (after the 3-part check), which is\nclearer and rejects signed/whitespace-padded components.","locations":[{"ref":"make_release.py:97-105","code":"   97 | def is_semantic_version(version: str) -> bool:\n   98 |     \"\"\"Check if the given version is a semantic version.\"\"\"\n   99 |     # This doesn't cover the edge-cases like pre-releases\n  100 |     if version.count(\".\") != 2:\n  101 |         return False\n  102 |     try:\n  103 |         return bool([int(part) for part in version.split(\".\")])\n  104 |     except Exception:\n  105 |         return False","lines":9,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/make_release.py#L97-L105"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`_pdfdoc_encoding` maps byte 22 to `\"\\u0000\"` while the file's own header comment states\n`# 22: should be '\\u0017'`. Because the value is `\"\\u0000\"`, byte 22 decodes to a NUL character\nduring PDFDocEncoding decoding, and `rev_encoding` explicitly skips `\"\\u0000\"` entries\n(`if char == \"\\u0000\": continue`), so this code point has no reverse mapping and cannot round-trip.\nThe placeholder is acknowledged as wrong in the comment but never corrected.","fix":"Replace the placeholder at index 22 with the intended control character (`\"\\u0016\"` for the SYN\ncontrol code at byte 0x16, or `\"\\u0017\"` if the comment's intent is authoritative) so the byte\ndecodes to a real code point and round-trips through `rev_encoding`.","locations":[{"ref":"pypdf/_codecs/pdfdoc.py:22-29","code":"   22 |     \"\\u0010\",\n   23 |     \"\\u0011\",\n   24 |     \"\\u0012\",\n   25 |     \"\\u0013\",\n   26 |     \"\\u0014\",\n   27 |     \"\\u0015\",\n   28 |     \"\\u0000\",\n   29 |     \"\\u0017\",  # 16 - 23","lines":8,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/_codecs/pdfdoc.py#L22-L29"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In the non-layout `TextExtraction`, `char_scale` (horizontal scaling, `Tz`) and\n`space_scale` (word spacing, `Tw`) are computed and pushed/popped on the `q`/`Q` graphics\nstack but are never read by any width/position calculation:\n\n```python\nself.char_scale = float(operands[0]) / 100 if operands else 1.0   # Tz\nself.space_scale = 1.0 + float(operands[0] if operands else 0.0)  # Tw\n```\n\nAdditionally, the caller routes `Tc` (character spacing) through\n`process_operation(b\"Tc\", ...)`, but `b\"Tc\"` is absent from `operation_handlers`, so it is\nsilently discarded. The net effect is that `Tz`, `Tw`, and `Tc` are ignored during\nnon-layout text extraction, degrading spacing accuracy for PDFs that rely on them, and\nleaving `char_scale`/`space_scale` as write-only state.","fix":"Either apply `char_scale`/`space_scale`/`Tc` in the spacing math\n(`crlf_space_check`/`_handle_tj` word-width and `space_tx` computations), or, if the\nsimplification is intentional, drop the unused state and document that `Tz`/`Tw`/`Tc` are\nnot honored. Do not leave computed-but-unused state that implies otherwise.","locations":[{"ref":"pypdf/_text_extraction/_text_extractor.py:266-272","code":"  266 |     def _handle_tz(self, operands: list[Any]) -> None:\n  267 |         \"\"\"Handle Tz (Set horizontal text scaling) operation - Table 5.2 page 398.\"\"\"\n  268 |         self.char_scale = float(operands[0]) / 100 if operands else 1.0\n  269 | \n  270 |     def _handle_tw(self, operands: list[Any]) -> None:\n  271 |         \"\"\"Handle Tw (Set word spacing) operation - Table 5.2 page 398.\"\"\"\n  272 |         self.space_scale = 1.0 + float(operands[0] if operands else 0.0)","lines":7,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/_text_extraction/_text_extractor.py#L266-L272"},{"ref":"pypdf/_text_extraction/_text_extractor.py:97-111","code":"   97 |         self.operation_handlers = {\n   98 |             b\"BT\": self._handle_bt,\n   99 |             b\"ET\": self._handle_et,\n  100 |             b\"q\": self._handle_save_graphics_state,\n  101 |             b\"Q\": self._handle_restore_graphics_state,\n  102 |             b\"cm\": self._handle_cm,\n  103 |             b\"Tz\": self._handle_tz,\n  104 |             b\"Tw\": self._handle_tw,\n  105 |             b\"TL\": self._handle_tl,\n  106 |             b\"Tf\": self._handle_tf,\n  107 |             b\"Td\": self._handle_td,\n  108 |             b\"Tm\": self._handle_tm,\n  109 |             b\"T*\": self._handle_t_star,\n  110 |             b\"Tj\": self._handle_tj_operation,\n  111 |         }","lines":15,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/_text_extraction/_text_extractor.py#L97-L111"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`insert_blank_page` promises `PageSizeNotDefinedError` when no size is given and there is no previous\npage, but on an empty writer (`num_pages == 0`) with `index == 0`, the condition\n`abs(index) <= num_pages` is `True`, so it computes `fixed_index = min(0, num_pages - 1) = -1` and\nevaluates `self.pages[-1].mediabox`, raising `IndexError` on the empty page list instead of the\ndocumented `PageSizeNotDefinedError`.","fix":"Handle the empty-document case explicitly: when `num_pages == 0` and `width`/`height` are not both\nprovided, raise `PageSizeNotDefinedError` (import from `pypdf.errors`) as documented, before\nattempting `self.pages[fixed_index]`.","locations":[{"ref":"pypdf/_writer.py:740-754","code":"  740 |         num_pages = self.get_num_pages()\n  741 |         if abs(index) <= num_pages:\n  742 |             # Use the chosen index, but do not exceed the available pages\n  743 |             fixed_index = min(index, num_pages - 1)\n  744 |             mediabox = self.pages[fixed_index].mediabox\n  745 |             if width is None or width <= 0:\n  746 |                 width = mediabox.width\n  747 |             if height is None or height <= 0:\n  748 |                 height = mediabox.height\n  749 |         else:\n  750 |             raise IndexError(f\"Index should be in range [-{num_pages}, {num_pages}]\")\n  751 | \n  752 |         page = PageObject.create_blank_page(self, width, height)\n  753 |         self.insert_page(page, index)\n  754 |         return page","lines":15,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/_writer.py#L740-L754"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `update_page_form_field_values`, the `/Btn` branch does `v = NameObject(value)` unconditionally.\n`NameObject` performs no validation and simply stringifies its argument, so passing a non-string\nvalue (e.g. a `list`, a `tuple` font spec, or `None`) yields a corrupt name rather than an error.\nVerified: `NameObject(['/a'])` produces `\"['/a']\"`, `NameObject(('/a','/b',1))` produces\n`\"('/a', '/b', 1)\"`, and `NameObject(None)` produces `\"None\"` - all invalid PDF names silently written\ninto `/AS` and `/V`.","fix":"Guard the button branch to only accept string values, e.g.\n`if not isinstance(value, str): logger_warning(...); continue` (or coerce via `str(value)` with a\nleading-slash check) before `v = NameObject(value)`, so malformed values do not produce corrupt\nappearance-state names.","locations":[{"ref":"pypdf/_writer.py:1046-1058","code":" 1046 |                 if parent_annotation.get(FA.FT) == \"/Btn\":\n 1047 |                     # Checkbox button (no /FT found in Radio widgets);\n 1048 |                     # We can find the associated appearance stream object\n 1049 |                     # within the annotation.\n 1050 |                     v = NameObject(value)\n 1051 |                     ap = cast(DictionaryObject, annotation[NameObject(AA.AP)])\n 1052 |                     normal_ap = cast(DictionaryObject, ap[\"/N\"])\n 1053 |                     if v not in normal_ap:\n 1054 |                         v = NameObject(\"/Off\")\n 1055 |                     appearance_stream_obj = normal_ap.get(v)\n 1056 |                     # Other cases will be updated through the for loop\n 1057 |                     annotation[NameObject(AA.AS)] = v\n 1058 |                     annotation[NameObject(FA.V)] = v","lines":13,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/_writer.py#L1046-L1058"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`PdfWriter.get_reference` and `PdfWriter.get_outline_root` locate objects with\n`self._objects.index(obj)`. `list.index` uses `==`, and `DictionaryObject`/`ArrayObject` inherit\nvalue-based equality from `dict`/`list`. Two distinct objects with identical contents therefore\ncompare equal, so `.index` returns the index of the *first* value-equal object, which may not be the\nintended one. The follow-up `assert ref.get_object() == obj` cannot catch this because it also only\nchecks value equality. Verified: for two equal `DictionaryObject`s `a`, `b`, `[a, b].index(b)`\nreturns `0`. Result: a reference silently pointing at the wrong indirect object.","fix":"Match by identity instead of equality, e.g. iterate with\n`next(i for i, o in enumerate(self._objects) if o is obj)`; or prefer the object's own\n`indirect_reference` when it is already set (as `_add_object` maintains) instead of scanning\n`self._objects`.","locations":[{"ref":"pypdf/_writer.py:1723-1727","code":" 1723 |     def get_reference(self, obj: PdfObject) -> IndirectObject:\n 1724 |         idnum = self._objects.index(obj) + 1\n 1725 |         ref = IndirectObject(idnum, 0, self)\n 1726 |         assert ref.get_object() == obj\n 1727 |         return ref","lines":5,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/_writer.py#L1723-L1727"},{"ref":"pypdf/_writer.py:1737-1739","code":" 1737 |             idnum = self._objects.index(outline) + 1\n 1738 |             outline_ref = IndirectObject(idnum, 0, self)\n 1739 |             assert outline_ref.get_object() == outline","lines":3,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/_writer.py#L1737-L1739"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `Action._create_new`, when the `/Next` entry is an `ArrayObject`, the walk advances with\n`current = next_node[-1]` and the next iteration calls `current.get(\"/Next\", None)`. Array elements\nare frequently `IndirectObject`s (references to action dictionaries), and `IndirectObject` has no\n`.get` method, so `current.get(...)` raises `AttributeError` on a legitimately-structured action tree\nwhose `/Next` array holds indirect references. The direct-dictionary branch works because those are\nresolved dicts, but the array branch does not resolve the element first.","fix":"Resolve before descending, e.g. `current = next_node[-1].get_object()` in the array branch (and\nsimilarly guard the dictionary branch with `.get_object()`), so that indirect references are\ndereferenced to the underlying `DictionaryObject` before `.get(\"/Next\")` is called.","locations":[{"ref":"pypdf/actions/_actions.py:119-140","code":"  119 |         while True:\n  120 |             next_node = current.get(\"/Next\", None)\n  121 | \n  122 |             if is_null_or_none(next_node):\n  123 |                 break\n  124 | \n  125 |             if not isinstance(next_node, (ArrayObject, DictionaryObject)):\n  126 |                 raise TypeError(\n  127 |                     f\"An action dictionary’s Next entry must be an Action dictionary \"\n  128 |                     f\"or an array of Action dictionaries: received type {type(next_node).__name__}.\"\n  129 |                 )\n  130 | \n  131 |             id_next = id(next_node)\n  132 |             if id_next in visited:\n  133 |                 logger_warning(\"Detected cycle in the action tree for %(current)s\", source=__name__, current=current)\n  134 |                 break\n  135 |             visited.add(id_next)\n  136 | \n  137 |             if isinstance(next_node, ArrayObject):\n  138 |                 current = next_node[-1]\n  139 |             else:\n  140 |                 current = next_node","lines":22,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/actions/_actions.py#L119-L140"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`FlateDecode.decode` TIFF-predictor path (predictor 2) computes bytes-per-pixel as\n`bpp = row_length // columns`. For sub-byte samples (e.g. `columns=100, colors=1, bits_per_component=1`\ngives `row_length = ceil(100/8) = 13`, `bpp = 13 // 100 = 0`), `bpp` becomes `0`. The loop then does\n`str_data_mut[i] = (str_data_mut[i] + str_data_mut[i - 0]) % 256`, i.e. it doubles each byte instead\nof applying horizontal differencing, silently corrupting the decoded image. The PNG predictor path\n(`_decode_png_prediction`) has the same `bpp = (row_length - 1) // columns` zero-collapse.","fix":"Compute `bpp` from bit depth with a floor of 1, e.g.\n`bpp = max(1, math.ceil(colors * bits_per_component / 8))`, so that sub-byte components do not yield\n`bpp == 0`; apply the same fix in `_decode_png_prediction`.","locations":[{"ref":"pypdf/filters.py:228-235","code":"  228 |             if predictor == 2:\n  229 |                 row_length -= 1  # remove the predictor byte\n  230 |                 bpp = row_length // columns\n  231 |                 str_data_mut = bytearray(str_data)\n  232 |                 for i in range(len(str_data_mut)):\n  233 |                     if i % row_length >= bpp:\n  234 |                         str_data_mut[i] = (str_data_mut[i] + str_data_mut[i - bpp]) % 256\n  235 |                 str_data = bytes(str_data_mut)","lines":8,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/filters.py#L228-L235"},{"ref":"pypdf/filters.py:283","code":"  283 |         bpp = (row_length - 1) // columns  # recomputed locally to not change params","lines":1,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/filters.py#L283"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`RunLengthDecode.decode` copies a literal run with `lst.append(data[index:(index + length)])` after\n`length += 1`, without checking that `index + length <= data_length`. On a truncated stream the slice\nis silently shortened, yet `total_length += length` still adds the full nominal `length`. The output\nis therefore truncated while the limit counter over-counts. This does not crash, but produces\nsilently wrong output on malformed input without any warning (unlike the sibling `>128` branch, which\nlogs when the replicated byte is missing).","fix":"After computing the literal `length`, detect a short read and warn: e.g. compare\n`len(data[index:index + length])` to `length`, emit `logger_warning(...)` when they differ, and add\nthe *actual* number of appended bytes to `total_length` so the limit accounting stays accurate.","locations":[{"ref":"pypdf/filters.py:476-479","code":"  476 |             if length < 128:\n  477 |                 length += 1\n  478 |                 lst.append(data[index : (index + length)])\n  479 |                 index += length","lines":4,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/filters.py#L476-L479"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`NumberObject.NumberPattern = re.compile(b\"[^+-.0-9]\")` intends the character class to contain\n`+`, `-`, `.`, and digits. Because `-` is placed between `+` (0x2B) and `.` (0x2E) it is\ninterpreted as a *range* `+`..`.`, which also matches `,` (0x2C). As a consequence\n`read_until_regex` will treat a comma as part of a number token, so input like `1,5` is read as\na single token and then coerced to `0` by `NumberObject.__new__`.","fix":"Escape the hyphen (or move it to the end of the class):\n`NumberPattern = re.compile(rb\"[^+.\\-0-9]\")` or `re.compile(rb\"[^-+.0-9]\")` so the class is an\nexplicit set rather than an unintended range.","locations":[{"ref":"pypdf/generic/_base.py:560","code":"  560 |     NumberPattern = re.compile(b\"[^+-.0-9]\")","lines":1,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/generic/_base.py#L560"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`DictionaryObject._clone` normalises `ignore_fields` by treating an `int` entry as a\n\"levels remaining\" counter that precedes a field name, deleting *two* consecutive entries\nwhen the counter reaches `0`:\n```\ndel ignore_fields[x]\ndel ignore_fields[x]\n```\nIf a caller passes an `ignore_fields` list that ends with a trailing `int` (no following field\nname), the second `del ignore_fields[x]` indexes past the now-shortened list and raises\n`IndexError`. Since `clone`/`_clone` do not catch this, a malformed `ignore_fields` argument\naborts the whole clone.","fix":"Guard the second deletion, e.g.\n```\nif cast(int, ignore_fields[x]) <= 0:\n    del ignore_fields[x]\n    if x < len(ignore_fields):\n        del ignore_fields[x]\n    continue\n```\nor validate that every `int` counter is followed by a name before processing.","locations":[{"ref":"pypdf/generic/_data_structures.py:336-344","code":"  336 |         x = 0\n  337 |         while x < len(ignore_fields):\n  338 |             if isinstance(ignore_fields[x], int):\n  339 |                 if cast(int, ignore_fields[x]) <= 0:\n  340 |                     del ignore_fields[x]\n  341 |                     del ignore_fields[x]\n  342 |                     continue\n  343 |                 ignore_fields[x] -= 1  # type:ignore\n  344 |             x += 1","lines":9,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/generic/_data_structures.py#L336-L344"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `_get_mode_and_invert_color`, when the color space is `/DeviceRGB` the local `mode` is set\nto `\"RGB\"`, but this assignment is immediately overwritten by the following `if/else`, which\nunconditionally reassigns `mode` (and `invert_color`) from `_get_image_mode(...)`. The\n`mode = \"RGB\"` branch therefore has no effect (dead assignment).","fix":"Either remove the dead `if ... == ColorSpaces.DEVICE_RGB: mode = \"RGB\"` block (it is redundant\nbecause `_get_image_mode` already resolves `/DeviceRGB` to `\"RGB\"`), or restructure so the\nDeviceRGB shortcut short-circuits the subsequent `if/else` instead of being clobbered by it.","locations":[{"ref":"pypdf/generic/_image_xobject.py:482-509","code":"  482 | def _get_mode_and_invert_color(\n  483 |     x_object: dict[str, Any], colors: int, color_space: Union[str, list[Any], Any]\n  484 | ) -> tuple[mode_str_type, bool]:\n  485 |     if (\n  486 |         ImageAttributes.COLOR_SPACE in x_object\n  487 |         and x_object[ImageAttributes.COLOR_SPACE] == ColorSpaces.DEVICE_RGB\n  488 |     ):\n  489 |         # https://pillow.readthedocs.io/en/stable/handbook/concepts.html#modes\n  490 |         mode: mode_str_type = \"RGB\"\n  491 |     if x_object.get(\"/BitsPerComponent\", 8) < 8:\n  492 |         mode, invert_color = _get_image_mode(\n  493 |             f\"{x_object.get('/BitsPerComponent', 8)}bit\", 0, \"\"\n  494 |         )\n  495 |     else:\n  496 |         mode, invert_color = _get_image_mode(\n  497 |             color_space,\n  498 |             2\n  499 |             if (\n  500 |                 colors == 1\n  501 |                 and (\n  502 |                     not is_null_or_none(color_space)\n  503 |                     and \"Gray\" not in color_space\n  504 |                 )\n  505 |             )\n  506 |             else colors,\n  507 |             \"\",\n  508 |         )\n  509 |     return mode, invert_color","lines":28,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/generic/_image_xobject.py#L482-L509"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`get_author_mapping` does `mapping[commit[\"sha\"]] = commit[\"author\"][\"login\"]`. The GitHub\ncommits API returns `\"author\": null` for any commit whose author email is not linked to a\nGitHub account, so `commit[\"author\"]` is `None` and `commit[\"author\"][\"login\"]` raises\n`TypeError: 'NoneType' object is not subscriptable`, aborting the whole release script.\nAdditionally, `parse_commit_line` later looks up `authors[commit_hash]` (line 364); the API\nonly returns commits reachable on the default branch in chronological pages, so any commit in\n`git log {tag}..HEAD` that is not present in the fetched pages produces a `KeyError`.","fix":"Guard against a missing/`None` author and a missing mapping entry, e.g.\n`author = commit.get(\"author\") or {}` then `mapping[commit[\"sha\"]] = author.get(\"login\", \"unknown\")`,\nand in `parse_commit_line` use `authors.get(commit_hash, \"unknown\")` instead of indexing.","locations":[{"ref":"make_release.py:327-329","code":"  327 |         for commit in commits:\n  328 |             mapping[commit[\"sha\"]] = commit[\"author\"][\"login\"]\n  329 |     return mapping","lines":3,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/make_release.py#L327-L329"},{"ref":"make_release.py:391","code":"  391 |     author_login = authors[commit_hash]","lines":1,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/make_release.py#L391"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`Encryption.read` accesses several required-but-attacker-controlled dictionary\nkeys with bare `[]` indexing, so a malformed `/Encrypt` dictionary raises a raw\n`KeyError` instead of a `PdfReadError`. Notably `filters = encryption_entry[\"/CF\"]`\n(line 1228) runs unconditionally whenever `/V >= 4`, even when `/StmF` and `/StrF`\nare `/Identity` and no `/CF` is actually required - a V4 document using only\nIdentity crypt filters and omitting `/CF` crashes with `KeyError: '/CF'`.\nSimilarly `encryption_entry[\"/R\"]`, `[\"/P\"]`, `[\"/O\"]`, `[\"/U\"]` (lines\n1249-1262) and `filters[stm_filter][\"/CFM\"]` (lines 1235-1239) raise `KeyError` on\nmalformed input rather than a controlled `PdfReadError`.","fix":"Fetch these entries defensively and raise `PdfReadError` with a clear message when\nmissing. For `/CF`, only read it when a non-`/Identity` filter is actually\nreferenced, e.g. resolve `filters = encryption_entry.get(\"/CF\")` and validate it\nis present before doing `filters[name][\"/CFM\"]` lookups; wrap the `/R`, `/P`,\n`/O`, `/U` reads in explicit presence checks that raise `PdfReadError`.","locations":[{"ref":"pypdf/_encryption.py:1227-1265","code":" 1227 |         if alg_ver >= 4:\n 1228 |             filters = encryption_entry[\"/CF\"]\n 1229 | \n 1230 |             stm_filter = encryption_entry.get(\"/StmF\", \"/Identity\")\n 1231 |             str_filter = encryption_entry.get(\"/StrF\", \"/Identity\")\n 1232 |             ef_filter = encryption_entry.get(\"/EFF\", stm_filter)\n 1233 | \n 1234 |             if stm_filter != \"/Identity\":\n 1235 |                 stm_filter = filters[stm_filter][\"/CFM\"]  # type: ignore[index]\n 1236 |             if str_filter != \"/Identity\":\n 1237 |                 str_filter = filters[str_filter][\"/CFM\"]  # type: ignore[index]\n 1238 |             if ef_filter != \"/Identity\":\n 1239 |                 ef_filter = filters[ef_filter][\"/CFM\"]  # type: ignore[index]\n 1240 | \n 1241 |             allowed_methods = (\"/Identity\", \"/V2\", \"/AESV2\", \"/AESV3\")\n 1242 |             if stm_filter not in allowed_methods:\n 1243 |                 raise NotImplementedError(f\"StmF Method {stm_filter} NOT supported!\")\n 1244 |             if str_filter not in allowed_methods:\n 1245 |                 raise NotImplementedError(f\"StrF Method {str_filter} NOT supported!\")\n 1246 |             if ef_filter not in allowed_methods:\n 1247 |                 raise NotImplementedError(f\"EFF Method {ef_filter} NOT supported!\")\n 1248 | \n 1249 |         alg_rev = cast(int, encryption_entry[\"/R\"])\n 1250 |         perm_flags = cast(int, encryption_entry[\"/P\"])\n 1251 |         key_bits = encryption_entry.get(\"/Length\", 40)\n 1252 |         if alg_ver == 4 and stm_filter == \"/AESV2\":\n 1253 |             cf_dict = cast(DictionaryObject, filters[encryption_entry[\"/StmF\"]])  # type: ignore[index]\n 1254 |             # CF /Length is in bytes (default 16 for AES-128), convert to bits\n 1255 |             key_bits = cast(int, cf_dict.get(\"/Length\", 16)) * 8\n 1256 |         encrypt_metadata = encryption_entry.get(\"/EncryptMetadata\")\n 1257 |         encrypt_metadata = (\n 1258 |             encrypt_metadata.value if encrypt_metadata is not None else True\n 1259 |         )\n 1260 |         values = EncryptionValues()\n 1261 |         values.O = cast(ByteStringObject, encryption_entry[\"/O\"]).original_bytes\n 1262 |         values.U = cast(ByteStringObject, encryption_entry[\"/U\"]).original_bytes\n 1263 |         values.OE = encryption_entry.get(\"/OE\", ByteStringObject()).original_bytes\n 1264 |         values.UE = encryption_entry.get(\"/UE\", ByteStringObject()).original_bytes\n 1265 |         values.Perms = encryption_entry.get(\"/Perms\", ByteStringObject()).original_bytes","lines":39,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/_encryption.py#L1227-L1265"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`_get_object_from_stream` reads an object stream referenced from untrusted xref data and\ntrusts its structure without guarding:\n\n```python\nobj_stm: EncodedStreamObject = IndirectObject(stmnum, 0, self).get_object()\nassert cast(str, obj_stm[\"/Type\"]) == \"/ObjStm\"\n...\nn = int(obj_stm[\"/N\"])\nfirst_offset = int(obj_stm[\"/First\"])\n```\n\nOn malformed PDFs where the compressed-object xref points at an object that is not a\nproper `/ObjStm` (or is missing `/N` / `/First`), this raises `KeyError`, `AssertionError`\n(stripped under `python -O`, turning a mismatch into silently-wrong parsing), or\n`ValueError` from `int(...)`. None of these is a `PdfReadError`, and the method is called\nfrom `get_object` without a wrapping handler, so the raw exception escapes to the caller.","fix":"Validate defensively and raise `PdfReadError` (or return `NullObject()` in non-strict\nmode). For example:\n\n```python\nif not isinstance(obj_stm, StreamObject) or obj_stm.get(\"/Type\") != \"/ObjStm\":\n    raise PdfReadError(f\"Object {stmnum} is not an object stream\")\ntry:\n    n = int(obj_stm[\"/N\"])\n    first_offset = int(obj_stm[\"/First\"])\nexcept (KeyError, ValueError) as exc:\n    raise PdfReadError(f\"Malformed object stream {stmnum}: {exc}\")\n```","locations":[{"ref":"pypdf/_reader.py:362-371","code":"  362 |         stmnum, _idx = self.xref_objStm[indirect_reference.idnum]\n  363 |         obj_stm: EncodedStreamObject = IndirectObject(stmnum, 0, self).get_object()  # type: ignore[assignment]\n  364 |         # This is an xref to a stream, so its type better be a stream\n  365 |         assert cast(str, obj_stm[\"/Type\"]) == \"/ObjStm\"\n  366 |         # Parse ALL objects in this stream in one pass and cache them.\n  367 |         # This avoids O(N²) behavior when many objects from the same stream\n  368 |         # are resolved individually (each call would re-parse the header).\n  369 |         stream_data = BytesIO(obj_stm.get_data())\n  370 |         n = int(obj_stm[\"/N\"])  # type: ignore[call-overload]\n  371 |         first_offset = int(obj_stm[\"/First\"])  # type: ignore[call-overload]","lines":10,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/_reader.py#L362-L371"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`_read_pdf15_xref_stream` validates the `/W` entry-size array of an untrusted\ncross-reference stream with `assert`:\n\n```python\nentry_sizes = cast(list[int], xref_stream.get(\"/W\"))\nassert len(entry_sizes) >= 3\n```\n\nTwo problems on malformed input:\n- If `/W` is missing, `get(\"/W\")` returns `None` and `len(None)` raises `TypeError`\n  (not `PdfReadError`).\n- If `/W` is present but shorter than 3 entries, the `assert` raises `AssertionError`\n  rather than a `PdfReadError`, and under `python -O` the assert is stripped entirely -\n  then `get_entry` indexes `entry_sizes[i]` for `i` up to `2` and raises `IndexError`.\n\nAll three are uncaught, non-`PdfReadError` exceptions escaping the parser on crafted\nbytes. `assert` must never guard untrusted-input validity.","fix":"Replace the assert with an explicit check that raises `PdfReadError` and handles the\nmissing key:\n\n```python\nentry_sizes = xref_stream.get(\"/W\")\nif not isinstance(entry_sizes, (list, ArrayObject)) or len(entry_sizes) < 3:\n    raise PdfReadError(f\"Invalid /W entry in XRef stream: {entry_sizes!r}\")\n```","locations":[{"ref":"pypdf/_reader.py:1243-1246","code":" 1243 |         entry_sizes = cast(list[int], xref_stream.get(\"/W\"))\n 1244 |         assert len(entry_sizes) >= 3\n 1245 |         if self.strict and len(entry_sizes) > 3:\n 1246 |             raise PdfReadError(f\"Too many entry sizes: {entry_sizes}\")","lines":4,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/_reader.py#L1243-L1246"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`rev_encoding` enforces the \"no duplicate glyph\" invariant with a bare `assert`:\n`assert char not in rev, f\"{char} at {i} already at {rev[char]}\"`. This runs at import time of\n`pypdf._codecs`. Under `python -O` (asserts stripped) the check silently disappears and a later\nduplicate simply overwrites the earlier mapping; without `-O` a bad encoding table would raise\n`AssertionError` during package import, which is not a normal recoverable error type for a\nlibrary. Using `assert` for a data-integrity check on module-level data is fragile either way.","fix":"Replace the `assert` with an explicit conditional that raises a real exception (e.g.\n`ValueError`) or logs and skips, so behavior is identical with and without `-O`, e.g.:\n```python\nif char in rev:\n    raise ValueError(f\"{char} at {i} already at {rev[char]}\")\n```","locations":[{"ref":"pypdf/_codecs/__init__.py:18-26","code":"   18 | def rev_encoding(enc: list[str]) -> dict[str, int]:\n   19 |     rev: dict[str, int] = {}\n   20 |     for i in range(256):\n   21 |         char = enc[i]\n   22 |         if char == \"\\u0000\":\n   23 |             continue\n   24 |         assert char not in rev, f\"{char} at {i} already at {rev[char]}\"\n   25 |         rev[char] = i\n   26 |     return rev","lines":9,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/_codecs/__init__.py#L18-L26"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`_get_image_mode` assumes `color_space[0]` is a name string and that indexed sub-elements exist.\nFor malformed image color spaces `color_space[0].startswith(\"/Cal\")` raises `AttributeError`\nwhen the element is not a string (e.g. a number), and accesses like `color_space[1]` /\n`color_space[2]` raise `IndexError` when the array is shorter than expected (e.g. a bare\n`[\"/ICCBased\"]`). These propagate as raw exceptions rather than `PdfReadError` when extracting\nimages from crafted PDFs.","fix":"Validate structure before indexing: check `isinstance(color_space[0], str)` before `.startswith`,\nand verify `len(color_space)` is large enough for each `/ICCBased`, `/Indexed`, `/Separation`,\n`/DeviceN` branch, raising `PdfReadError` on mismatch instead of letting `AttributeError`/\n`IndexError` escape.","locations":[{"ref":"pypdf/generic/_image_xobject.py:61-104","code":"   61 |     if isinstance(color_space, str):\n   62 |         color_space_str = color_space\n   63 |     elif not isinstance(color_space, list):\n   64 |         raise PdfReadError(\n   65 |             \"Cannot interpret color space\", color_space\n   66 |         )  # pragma: no cover\n   67 |     elif not color_space:\n   68 |         return \"\", False\n   69 |     elif color_space[0].startswith(\"/Cal\"):  # /CalRGB or /CalGray\n   70 |         color_space_str = \"/Device\" + color_space[0][4:]\n   71 |     elif color_space[0] == \"/ICCBased\":\n   72 |         icc_profile = color_space[1].get_object()\n   73 |         color_components = cast(int, icc_profile[\"/N\"])\n   74 |         color_space_str = icc_profile.get(\"/Alternate\", \"\")\n   75 |     elif color_space[0] == \"/Indexed\":\n   76 |         color_space_str = color_space[1].get_object()\n   77 |         mode, invert_color = _get_image_mode(\n   78 |             color_space_str, color_components, prev_mode, depth + 1\n   79 |         )\n   80 |         if mode in (\"RGB\", \"CMYK\"):\n   81 |             mode = \"P\"\n   82 |         return mode, invert_color\n   83 |     elif color_space[0] == \"/Separation\":\n   84 |         color_space_str = color_space[2].get_object()\n   85 |         mode, invert_color = _get_image_mode(\n   86 |             color_space_str, color_components, prev_mode, depth + 1\n   87 |         )\n   88 |         return mode, True\n   89 |     elif color_space[0] == \"/DeviceN\":\n   90 |         original_color_space = color_space\n   91 |         color_components = len(color_space[1])\n   92 |         color_space_str = color_space[2].get_object()\n   93 |         if color_space_str == \"/DeviceCMYK\" and color_components == 1:\n   94 |             if original_color_space[1][0] != \"/Black\":\n   95 |                 logger_warning(\n   96 |                     \"Color %(color)s converted to Gray. Please share PDF with pypdf dev team\",\n   97 |                     source=__name__,\n   98 |                     color=original_color_space[1][0],\n   99 |                 )\n  100 |             return \"L\", True\n  101 |         mode, invert_color = _get_image_mode(\n  102 |             color_space_str, color_components, prev_mode, depth + 1\n  103 |         )\n  104 |         return mode, invert_color","lines":44,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/generic/_image_xobject.py#L61-L104"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"`pypdf/__init__.py` imports the internal matrix-multiply helper `mult` from `_text_extraction`\nand re-exports it in the public `__all__`. `mult` is an undocumented low-level 2x3 affine matrix\nhelper used only internally for text extraction; publishing it as part of the top-level public\nAPI (`pypdf.mult`) pollutes the namespace and creates an implicit backward-compatibility promise\nfor a helper that was never intended to be public.","fix":"Remove the public export. Before:\n```python\nfrom ._text_extraction import mult\n...\n    \"mult\",\n```\nDelete the `from ._text_extraction import mult` import and the `\"mult\",` entry from `__all__`;\ninternal callers already import `mult` directly from `pypdf._text_extraction`.","locations":[{"ref":"pypdf/__init__.py:16","code":"   16 | from ._text_extraction import mult","lines":1,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/__init__.py#L16"},{"ref":"pypdf/__init__.py:50","code":"   50 |     \"mult\",","lines":1,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/__init__.py#L50"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"The pycryptodome provider constructs RC4 ciphers via `ARC4.ARC4Cipher(self.key)` /\n`ARC4.ARC4Cipher(key)` instead of the documented public factory `ARC4.new(key)`. `ARC4Cipher` is\nan internal implementation class; `ARC4.new` is the supported public API. Relying on the private\nclass is fragile across pycryptodome versions and inconsistent with the rest of the file (e.g.\n`AES.new(...)` is used for AES). It occurs in the `CryptRC4` methods and in the module-level\n`rc4_encrypt` / `rc4_decrypt` helpers.","fix":"Replace `ARC4.ARC4Cipher(self.key)` with `ARC4.new(self.key)` and `ARC4.ARC4Cipher(key)` with\n`ARC4.new(key)` in all four call sites.","locations":[{"ref":"pypdf/_crypt_providers/_pycryptodome.py:46-49","code":"   46 |         return ARC4.ARC4Cipher(self.key).encrypt(data)\n   47 | \n   48 |     def decrypt(self, data: bytes, *, strict: bool = True) -> bytes:\n   49 |         return ARC4.ARC4Cipher(self.key).decrypt(data)","lines":4,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/_crypt_providers/_pycryptodome.py#L46-L49"},{"ref":"pypdf/_crypt_providers/_pycryptodome.py:90-94","code":"   90 |     return ARC4.ARC4Cipher(key).encrypt(data)\n   91 | \n   92 | \n   93 | def rc4_decrypt(key: bytes, data: bytes) -> bytes:\n   94 |     return ARC4.ARC4Cipher(key).decrypt(data)","lines":5,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/_crypt_providers/_pycryptodome.py#L90-L94"}]},
