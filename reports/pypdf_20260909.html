{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"easy","description":"`PageObject._merge_resources` re-sorts and rebuilds the entire `new_res`\ndictionary on *every* iteration of the `for key in page2res` loop. The\n`lst = sorted(new_res.items()); new_res.clear(); for el in lst: ...` block is\nindented inside the loop, so for `n` resource entries it performs `O(n)` full sorts\nof a growing dict, i.e. `O(n^2 log n)` total, with `n` clears/rebuilds. The sort\nonly affects final ordering (it does not influence the `compute_unique_key`\nmembership tests), so doing it once after the loop yields identical output.","fix":"Dedent the sort/rebuild block so it runs once, after the loop finishes:\n\nBefore:\n```\n        for key in page2res:\n            ...\n                    new_res[newname] = page2res.raw_get(key)\n            lst = sorted(new_res.items())\n            new_res.clear()\n            for el in lst:\n                new_res[el[0]] = el[1]\n        return new_res, rename_res\n```\nAfter:\n```\n        for key in page2res:\n            ...\n                    new_res[newname] = page2res.raw_get(key)\n        lst = sorted(new_res.items())\n        new_res.clear()\n        for el in lst:\n            new_res[el[0]] = el[1]\n        return new_res, rename_res\n```","locations":[{"ref":"pypdf/_page.py:1058-1078","code":" 1058 |         for key in page2res:\n 1059 |             unique_key, same_value = compute_unique_key(key)\n 1060 |             newname = NameObject(unique_key)\n 1061 |             if key != unique_key:\n 1062 |                 # we have to use a different name for this\n 1063 |                 rename_res[key] = newname\n 1064 | \n 1065 |             if not same_value:\n 1066 |                 if is_pdf_writer:\n 1067 |                     new_res[newname] = page2res.raw_get(key).clone(pdf)\n 1068 |                     try:\n 1069 |                         new_res[newname] = new_res[newname].indirect_reference\n 1070 |                     except AttributeError:\n 1071 |                         pass\n 1072 |                 else:\n 1073 |                     new_res[newname] = page2res.raw_get(key)\n 1074 |             lst = sorted(new_res.items())\n 1075 |             new_res.clear()\n 1076 |             for el in lst:\n 1077 |                 new_res[el[0]] = el[1]\n 1078 |         return new_res, rename_res","lines":21,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/_page.py#L1058-L1078"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`main` in `check_gh_pages_updates.py` calls `get_latest_version(pkg)` for every regex match in\nevery HTML file with no memoization. The same CDN package (e.g. the same\n`cdn.jsdelivr.net/npm/<name>@<ver>` include repeated across many generated `gh-pages` HTML files,\nor multiple times within one file) triggers a fresh `https://registry.npmjs.org/<pkg>` HTTP\nrequest each time, multiplying network round-trips and slowing the CI check for no benefit.","fix":"Cache lookups by package name, e.g. decorate `get_latest_version` with\n`functools.lru_cache` (or keep a `dict[str, str]` in `main`) so each package version is fetched\nfrom the npm registry at most once per run.","locations":[{"ref":".github/scripts/check_gh_pages_updates.py:59-65","code":"   59 |         for m in matches:\n   60 |             pkg = m.group(\"name\")\n   61 |             current_version = m.group(\"version\")\n   62 |             full_url = m.group(1)\n   63 | \n   64 |             try:\n   65 |                 latest_version = get_latest_version(pkg)","lines":7,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/.github/scripts/check_gh_pages_updates.py#L59-L65"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"The XMP getter caches (`_get_single_value`, `_getter_bag`, `_get_seq_values`,\n`_get_langalt_values`) store their result in `self.cache` but gate the cache hit with\n`if cached:` (truthiness). When a property legitimately resolves to an empty result\n(`None`, an empty `list`, or an empty `dict`), the cached-empty value is treated as a miss and\nthe full XML tree is re-walked on every subsequent access, defeating the cache for exactly the\ncommon \"field absent\" case.","fix":"Distinguish \"absent from cache\" from \"cached empty value\", e.g. use a sentinel:\n```\n_MISSING = object()\ncached = self.cache.get(namespace, {}).get(name, _MISSING)\nif cached is not _MISSING:\n    return cached\n```\napplied consistently across the four getters.","locations":[{"ref":"pypdf/xmp.py:304-306","code":"  304 |         cached = self.cache.get(namespace, {}).get(name)\n  305 |         if cached:\n  306 |             return cached","lines":3,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/xmp.py#L304-L306"},{"ref":"pypdf/xmp.py:321-323","code":"  321 |         cached = self.cache.get(namespace, {}).get(name)\n  322 |         if cached:\n  323 |             return cast(list[str], cached)","lines":3,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/xmp.py#L321-L323"},{"ref":"pypdf/xmp.py:341-343","code":"  341 |         cached = self.cache.get(namespace, {}).get(name)\n  342 |         if cached:\n  343 |             return cast(list[Any], cached)","lines":3,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/xmp.py#L341-L343"},{"ref":"pypdf/xmp.py:365-367","code":"  365 |         cached = self.cache.get(namespace, {}).get(name)\n  366 |         if cached:\n  367 |             return cast(dict[Any, Any], cached)","lines":3,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/xmp.py#L365-L367"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"The pure-Python RC4 fallback builds output through a Python list of ints\n(`out = [0 for _ in range(len(data))]`) and then converts to `bytes(out)`. For large encrypted\nstreams this allocates a full Python-int list and is markedly slower and more memory-hungry than\nmutating a `bytearray`. This is the no-dependency fallback path, so impact is limited, but streams\ncan be large.","fix":"Use a preallocated `bytearray` and assign bytes directly, returning `bytes(out)` at the end:\n```\nout = bytearray(len(data))\n...\n    out[k] = data[k] ^ x\nreturn bytes(out)\n```","locations":[{"ref":"pypdf/_crypt_providers/_fallback.py:45-55","code":"   45 |     def encrypt(self, data: bytes) -> bytes:\n   46 |         s = bytearray(self.s)\n   47 |         out = [0 for _ in range(len(data))]\n   48 |         i, j = 0, 0\n   49 |         for k in range(len(data)):\n   50 |             i = (i + 1) % 256\n   51 |             j = (j + s[i]) % 256\n   52 |             s[i], s[j] = s[j], s[i]\n   53 |             x = s[(s[i] + s[j]) % 256]\n   54 |             out[k] = data[k] ^ x\n   55 |         return bytes(out)","lines":11,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/_crypt_providers/_fallback.py#L45-L55"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`write_release_msg_file` is defined but never called - its only call site is commented out.\nThe comment on the previous line (`# write_release_msg_file(...)`) documents that it is dead:\n\n```python\n    write_commit_msg_file(new_version, changes_with_author + trailer)\n    # write_release_msg_file(new_version, changes_with_author + trailer, today)\n```\n\nThe function body (lines 122-135) is therefore unreachable code.","fix":"Either remove the unused `write_release_msg_file` function and the commented-out call on\nline 52, or re-enable the call if tag-message generation is still wanted. Before:\n`    # write_release_msg_file(new_version, changes_with_author + trailer, today)` -> delete the\nfunction and this comment line.","locations":[{"ref":"make_release.py:52","code":"   52 |     # write_release_msg_file(new_version, changes_with_author + trailer, today)","lines":1,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/make_release.py#L52"},{"ref":"make_release.py:122-135","code":"  122 | def write_release_msg_file(\n  123 |     new_version: str, commit_changes: str, today: datetime\n  124 | ) -> None:\n  125 |     \"\"\"\n  126 |     Write a file that can be used as a git tag message.\n  127 | \n  128 |     Like this:\n  129 | \n  130 |         git tag -eF RELEASE_TAG_MSG.md && git push\n  131 |     \"\"\"\n  132 |     with open(\"RELEASE_TAG_MSG.md\", \"w\") as fp:\n  133 |         fp.write(f\"Version {new_version}, {today:%Y-%m-%d}\\n\\n\")\n  134 |         fp.write(\"## What's new\\n\")\n  135 |         fp.write(commit_changes)","lines":14,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/make_release.py#L122-L135"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`LzwCodec.decode` initializes decoding state three times redundantly. Lines 217-221 set\n`self._table_index`, `self._byte_pointer`, `self._next_data` and `self._next_bits`; then\n`self._initialize_decoding_table()` (line 226) overwrites `self._table_index` (and\n`self._bits_to_get`); then lines 227-229 set `self._byte_pointer`, `self._next_data` and\n`self._next_bits` again to the identical values. So the assignments on lines 219-221 (and the\n`self._table_index = 0` on line 217) are immediately overwritten and have no effect.","fix":"Drop the duplicate block. Keep a single initialization after `_initialize_decoding_table()`.\nBefore:\n```python\n        self._table_index = 0\n        self._bits_to_get = 9\n        self._byte_pointer = 0\n        self._next_data = 0\n        self._next_bits = 0\n\n        output_stream = io.BytesIO()\n        output_length = 0\n\n        self._initialize_decoding_table()\n        self._byte_pointer = 0\n        self._next_data = 0\n        self._next_bits = 0\n```\nAfter: remove lines 216-221 and keep only the post-`_initialize_decoding_table()` resets.","locations":[{"ref":"pypdf/_codecs/_codecs.py:216-229","code":"  216 |         self._and_table = [511, 1023, 2047, 4095]\n  217 |         self._table_index = 0\n  218 |         self._bits_to_get = 9\n  219 |         self._byte_pointer = 0\n  220 |         self._next_data = 0\n  221 |         self._next_bits = 0\n  222 | \n  223 |         output_stream = io.BytesIO()\n  224 |         output_length = 0\n  225 | \n  226 |         self._initialize_decoding_table()\n  227 |         self._byte_pointer = 0\n  228 |         self._next_data = 0\n  229 |         self._next_bits = 0","lines":14,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/_codecs/_codecs.py#L216-L229"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"In `crlf_space_check`, `cm_prev` is assigned the product matrix `m` but that value is\nnever read: it is unconditionally overwritten by `cm_matrix.copy()` just before the\n`return`, and nothing between the two assignments reads `cm_prev`. The intermediate\nassignment is dead and misleading (it suggests `m` is propagated as the previous cm,\nwhich it is not).","fix":"Remove the dead assignment.\n\nBefore:\n```python\n    scale_y = math.sqrt(tm_matrix[2]**2 + tm_matrix[3]**2)\n    cm_prev = m\n```\nAfter:\n```python\n    scale_y = math.sqrt(tm_matrix[2]**2 + tm_matrix[3]**2)\n```","locations":[{"ref":"pypdf/_text_extraction/__init__.py:136","code":"  136 |     cm_prev = m","lines":1,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/_text_extraction/__init__.py#L136"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"In `get_text_operands`, the branch is already inside `else:` of\n`if isinstance(operands[0], str):`, so `operands[0]` is guaranteed **not** a `str`. The\nternary that re-tests `isinstance(operands[0], str)` therefore always takes the `else`\narm; the `encode_pdfdocencoding(operands[0])` branch is unreachable dead code (likely a\ncopy-paste remnant).","fix":"Simplify to the always-taken branch.\n\nBefore:\n```python\n            tt: bytes = (\n                encode_pdfdocencoding(operands[0])\n                if isinstance(operands[0], str)\n                else operands[0]\n            )\n```\nAfter:\n```python\n            tt: bytes = operands[0]\n```","locations":[{"ref":"pypdf/_text_extraction/__init__.py:188-192","code":"  188 |             tt: bytes = (\n  189 |                 encode_pdfdocencoding(operands[0])\n  190 |                 if isinstance(operands[0], str)\n  191 |                 else operands[0]\n  192 |             )","lines":5,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/_text_extraction/__init__.py#L188-L192"}]},
{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In `Action._create_new`, after the `while True` loop that walks the `/Next` chain, there is a\nfollow-up check:\n```python\nif not is_null_or_none(next_node := current.get(\"/Next\")) and id(next_node) in visited:\n    logger_warning(\"Detected cycle in the action tree for %(current)s\", ...)\n```\nThe loop only breaks when `current.get(\"/Next\")` is null (or on a detected cycle / type error), so at\nthis point `current.get(\"/Next\")` is guaranteed null and `is_null_or_none(...)` is `True`, making the\n`and` branch unreachable. This block never logs and just re-reads `/Next` for no effect.","fix":"Remove the redundant post-loop `if ...` block, or restructure the loop so the cycle warning is issued\nwhere the cycle is actually detected (inside the loop, which already handles `id_next in visited`).","locations":[{"ref":"pypdf/actions/_actions.py:119-143","code":"  119 |         while True:\n  120 |             next_node = current.get(\"/Next\", None)\n  121 | \n  122 |             if is_null_or_none(next_node):\n  123 |                 break\n  124 | \n  125 |             if not isinstance(next_node, (ArrayObject, DictionaryObject)):\n  126 |                 raise TypeError(\n  127 |                     f\"An action dictionary’s Next entry must be an Action dictionary \"\n  128 |                     f\"or an array of Action dictionaries: received type {type(next_node).__name__}.\"\n  129 |                 )\n  130 | \n  131 |             id_next = id(next_node)\n  132 |             if id_next in visited:\n  133 |                 logger_warning(\"Detected cycle in the action tree for %(current)s\", source=__name__, current=current)\n  134 |                 break\n  135 |             visited.add(id_next)\n  136 | \n  137 |             if isinstance(next_node, ArrayObject):\n  138 |                 current = next_node[-1]\n  139 |             else:\n  140 |                 current = next_node\n  141 | \n  142 |         if not is_null_or_none(next_node := current.get(\"/Next\")) and id(next_node) in visited:\n  143 |             logger_warning(\"Detected cycle in the action tree for %(current)s\", source=__name__, current=current)","lines":25,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/actions/_actions.py#L119-L143"}]},
{"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`_next_code_decode` begins with the statement `self._next_data: int`. This is a bare variable\nannotation, not an assignment; on an instance attribute inside a method it does nothing at\nruntime (it does not even register in `__annotations__`). `self._next_data` is already\ninitialized in `decode`, so this line is a no-op.","fix":"Remove the line. Before: `        self._next_data: int` -> delete it. If a type hint is desired,\nannotate the attribute at class scope instead (`_next_data: int`).","locations":[{"ref":"pypdf/_codecs/_codecs.py:158","code":"  158 |         self._next_data: int","lines":1,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/_codecs/_codecs.py#L158"}]},
{"id":"DEAD_7","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `Version._parse_version`, `integer_prefix` comes from `match.group(1)` where group 1 is\n`(\\d+)` - a required, non-optional group of one or more digits. It can never be `None`\nwhen `match` is truthy, so the `if integer_prefix is None: integer_prefix = 0` branch is\nunreachable dead code.","fix":"Remove the dead guard.\n\nBefore:\n```python\n            integer_prefix = match.group(1)\n            suffix = match.group(2)\n            if integer_prefix is None:\n                integer_prefix = 0\n            parsed_components.append((int(integer_prefix), suffix))\n```\nAfter:\n```python\n            integer_prefix = match.group(1)\n            suffix = match.group(2)\n            parsed_components.append((int(integer_prefix), suffix))\n```","locations":[{"ref":"pypdf/_utils.py:647-651","code":"  647 |             integer_prefix = match.group(1)\n  648 |             suffix = match.group(2)\n  649 |             if integer_prefix is None:\n  650 |                 integer_prefix = 0\n  651 |             parsed_components.append((int(integer_prefix), suffix))","lines":5,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/_utils.py#L647-L651"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"In `_parse_encoding`, the `/BaseEncoding` branch logs the wrong variable. When\n`charset_encoding[enc[\"/BaseEncoding\"]]` raises (unknown base encoding), the `except` logs\n`encoding=encoding`, but at that point the assignment failed so `encoding` still holds its\ninitial value `[]` (an empty list). The message therefore reads \"Advanced encoding [] not\nimplemented yet\" instead of naming the actual unsupported base encoding, making the diagnostic\nuseless.","fix":"Log the offending base-encoding name instead of the empty accumulator:\n`logger_error(\"Advanced encoding %(encoding)s not implemented yet\", source=__name__, encoding=enc[\"/BaseEncoding\"])`.","locations":[{"ref":"pypdf/_cmap.py:102-110","code":"  102 |     elif isinstance(enc, DictionaryObject) and \"/BaseEncoding\" in enc:\n  103 |         try:\n  104 |             encoding = charset_encoding[cast(str, enc[\"/BaseEncoding\"])].copy()\n  105 |         except Exception:\n  106 |             logger_error(\n  107 |                 \"Advanced encoding %(encoding)s not implemented yet\",\n  108 |                 source=__name__, encoding=encoding\n  109 |             )\n  110 |             encoding = charset_encoding[\"/StandardEncoding\"].copy()","lines":9,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/_cmap.py#L102-L110"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"In `PageObject._get_ids_image` the comment `# Removes duplicates and preserves\norder` precedes `deduplicated = lst.copy()`, which performs no deduplication - it\nis a plain shallow copy. The subsequent loop appends inline-image names not already\npresent, but the labelled line itself does not deduplicate anything, so the comment\nis misleading.","fix":"Either remove/relabel the comment to reflect that it copies the list before\nappending inline images, or actually deduplicate if that was the intent.","locations":[{"ref":"pypdf/_page.py:702-711","code":"  702 |         # Removes duplicates and preserves order\n  703 |         deduplicated = lst.copy()\n  704 | \n  705 |         # Add inline images from _content_stream_images\n  706 |         for object_name, object_value in self._content_stream_images.items():\n  707 |             # inline images have cache populated\n  708 |             if object_name not in deduplicated and object_value:\n  709 |                 deduplicated.append(object_name)\n  710 | \n  711 |         return deduplicated","lines":10,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/_page.py#L702-L711"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"In `_converter_date` the sub-second remainder is scaled by `1_000_000` (microseconds) and\npassed as the 7th argument to `datetime.datetime`, which is microseconds, but the variable is\nnamed `milliseconds` (and `milliseconds_dec`). The naming is misleading; the value is correct\nmicroseconds.","fix":"Rename for accuracy:\n```\nmilliseconds_dec = (second - seconds_dec) * 1_000_000\nmilliseconds = int(milliseconds_dec)\n...\ndt = datetime.datetime(year, month, day, hour, minute, seconds, milliseconds)\n```\nto\n```\nmicroseconds_dec = (second - seconds_dec) * 1_000_000\nmicroseconds = int(microseconds_dec)\n...\ndt = datetime.datetime(year, month, day, hour, minute, seconds, microseconds)\n```","locations":[{"ref":"pypdf/xmp.py:128-134","code":"  128 |     milliseconds_dec = (second - seconds_dec) * 1_000_000\n  129 | \n  130 |     seconds = int(seconds_dec)\n  131 |     milliseconds = int(milliseconds_dec)\n  132 | \n  133 |     tzd = matches.group(\"tzd\") or \"Z\"\n  134 |     dt = datetime.datetime(year, month, day, hour, minute, seconds, milliseconds)","lines":7,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/xmp.py#L128-L134"}]},
{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"negligible","difficulty":"medium","description":"The non-trivial `CryptAES.decrypt` logic (strip 16-byte IV, early-return on empty payload,\nnon-strict padding repair, `PdfStreamError` wrapping, and the buggy `padded_data[: -padded_data[-1]]`\nrecovery) is duplicated almost verbatim between the `cryptography` and `pycryptodome` providers.\nOnly the backend primitive calls differ. Because the logic is copied, the padding-recovery bug\nnoted separately had to be (and must be) fixed in two places, and future changes risk drifting out\nof sync between the two providers.","fix":"Factor the shared decrypt orchestration (IV split, empty-payload short-circuit, padding-repair\ndecision, error wrapping, recovery slice) into a helper in `pypdf/_crypt_providers/_base.py` that\ntakes backend-specific `decrypt`/`unpad` callables, and have both providers call it. This keeps a\nsingle source of truth for the recovery/error-handling behaviour.","locations":[{"ref":"pypdf/_crypt_providers/_cryptography.py:117-144","code":"  117 |     def decrypt(self, data: bytes, *, strict: bool = True) -> bytes:\n  118 |         iv = data[:16]\n  119 |         data = data[16:]\n  120 |         # for empty encrypted data\n  121 |         if not data:\n  122 |             return data\n  123 | \n  124 |         if not strict and len(data) % 16 != 0:\n  125 |             logger_warning(\"Adding missing padding.\", source=__name__)\n  126 |             padder = PKCS7(128).padder()\n  127 |             data = padder.update(data) + padder.finalize()\n  128 | \n  129 |         cipher = Cipher(self.alg, CBC(iv))\n  130 |         decryptor = cipher.decryptor()\n  131 |         try:\n  132 |             padded_data = decryptor.update(data) + decryptor.finalize()\n  133 |         except ValueError as exception:\n  134 |             # Only raised in strict mode. Non-strict mode fixes padding.\n  135 |             raise PdfStreamError(exception)\n  136 | \n  137 |         unpadder = PKCS7(128).unpadder()\n  138 |         try:\n  139 |             return unpadder.update(padded_data) + unpadder.finalize()\n  140 |         except ValueError as exception:\n  141 |             if strict:\n  142 |                 raise PdfStreamError(exception)\n  143 |             logger_warning(\"Ignoring padding error: %(exception)s\", source=__name__, exception=exception)\n  144 |             return padded_data[: -padded_data[-1]]","lines":28,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/_crypt_providers/_cryptography.py#L117-L144"},{"ref":"pypdf/_crypt_providers/_pycryptodome.py:62-86","code":"   62 |     def decrypt(self, data: bytes, *, strict: bool = True) -> bytes:\n   63 |         iv = data[:16]\n   64 |         data = data[16:]\n   65 |         # for empty encrypted data\n   66 |         if not data:\n   67 |             return data\n   68 | \n   69 |         if not strict and len(data) % 16 != 0:\n   70 |             logger_warning(\"Adding missing padding.\", source=__name__)\n   71 |             data = pad(data, 16)\n   72 | \n   73 |         aes = AES.new(self.key, AES.MODE_CBC, iv)\n   74 |         try:\n   75 |             padded_data = aes.decrypt(data)\n   76 |         except ValueError as exception:\n   77 |             # Only raised in strict mode. Non-strict mode fixes padding.\n   78 |             raise PdfStreamError(exception)\n   79 | \n   80 |         try:\n   81 |             return unpad(padded_data, 16)\n   82 |         except ValueError as exception:\n   83 |             if strict:\n   84 |                 raise PdfStreamError(exception)\n   85 |             logger_warning(\"Ignoring padding error: %(exception)s\", source=__name__, exception=exception)\n   86 |             return padded_data[: -padded_data[-1]]","lines":25,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/_crypt_providers/_pycryptodome.py#L62-L86"}]},
{"id":"DUP_2","type":"duplicate_code","type_label":"Duplicate Code","severity":"negligible","difficulty":"easy","description":"`Rectangle` (Subtype `/Square`) and `Ellipse` (Subtype `/Circle`) are almost byte-for-byte identical:\nsame `super().__init__(**kwargs)`, same `self.update({... /Type /Annot, /Subtype, /Rect ...})`, and\nthe same `interior_color` -> `/IC` handling. The only difference is the `/Subtype` name.","fix":"Extract a shared private base (e.g. `_BoxAnnotation(subtype)`) or a small helper that both\n`Rectangle` and `Ellipse` call with their respective `/Subtype`, eliminating the duplicated body.","locations":[{"ref":"pypdf/annotations/_markup_annotations.py:257-277","code":"  257 | class Rectangle(MarkupAnnotation):\n  258 |     def __init__(\n  259 |         self,\n  260 |         rect: Union[RectangleObject, tuple[float, float, float, float]],\n  261 |         *,\n  262 |         interior_color: Optional[str] = None,\n  263 |         **kwargs: Any,\n  264 |     ) -> None:\n  265 |         super().__init__(**kwargs)\n  266 |         self.update(\n  267 |             {\n  268 |                 NameObject(\"/Type\"): NameObject(\"/Annot\"),\n  269 |                 NameObject(\"/Subtype\"): NameObject(\"/Square\"),\n  270 |                 NameObject(\"/Rect\"): RectangleObject(rect),\n  271 |             }\n  272 |         )\n  273 | \n  274 |         if interior_color:\n  275 |             self[NameObject(\"/IC\")] = ArrayObject(\n  276 |                 [FloatObject(n) for n in hex_to_rgb(interior_color)]\n  277 |             )","lines":21,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/annotations/_markup_annotations.py#L257-L277"},{"ref":"pypdf/annotations/_markup_annotations.py:305-326","code":"  305 | class Ellipse(MarkupAnnotation):\n  306 |     def __init__(\n  307 |         self,\n  308 |         rect: Union[RectangleObject, tuple[float, float, float, float]],\n  309 |         *,\n  310 |         interior_color: Optional[str] = None,\n  311 |         **kwargs: Any,\n  312 |     ) -> None:\n  313 |         super().__init__(**kwargs)\n  314 | \n  315 |         self.update(\n  316 |             {\n  317 |                 NameObject(\"/Type\"): NameObject(\"/Annot\"),\n  318 |                 NameObject(\"/Subtype\"): NameObject(\"/Circle\"),\n  319 |                 NameObject(\"/Rect\"): RectangleObject(rect),\n  320 |             }\n  321 |         )\n  322 | \n  323 |         if interior_color:\n  324 |             self[NameObject(\"/IC\")] = ArrayObject(\n  325 |                 [FloatObject(n) for n in hex_to_rgb(interior_color)]\n  326 |             )","lines":22,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/annotations/_markup_annotations.py#L305-L326"}]},
{"id":"OTHER_1","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"`_std_encoding` (used as `/StandardEncoding`) contains three glyphs that appear twice, all in the\nbyte range that is *undefined* in Adobe StandardEncoding: `U+00D8` (Ø) at index 216 and 233,\n`U+00E6` (æ) at index 230 and 241, and `U+00DF` (ß) at index 223 and 251. The correct\nStandardEncoding positions are 233 (Oslash), 241 (ae) and 251 (germandbls); the extra entries at\n216/223/230 are Latin-1 characters filled into slots that are undefined in the spec. This makes\ndecoding of those (undefined) bytes non-spec and, if a reverse map were ever built from this table\nvia `rev_encoding` (as is done for `_pdfdoc_encoding`), the duplicate-key `assert char not in rev`\nwould fire. Verified programmatically: the three duplicates are the only non-space duplicates.","fix":"Reconcile the high range (bytes 128-255) of `_std_encoding` against the authoritative Adobe\nStandardEncoding table. Undefined slots should map to a placeholder (`\"\\u0000\"`, which\n`rev_encoding` skips) rather than to Latin-1 glyphs that duplicate the correctly-positioned code\npoints at 233/241/251.","locations":[{"ref":"pypdf/_codecs/std.py:218-253","code":"  218 |     \"Ø\",\n  219 |     \"Ù\",\n  220 |     \"Ú\",\n  221 |     \"Û\",\n  222 |     \"Ü\",\n  223 |     \"Ý\",\n  224 |     \"Þ\",\n  225 |     \"ß\",\n  226 |     \"à\",\n  227 |     \"Æ\",\n  228 |     \"â\",\n  229 |     \"ª\",\n  230 |     \"ä\",\n  231 |     \"å\",\n  232 |     \"æ\",\n  233 |     \"ç\",\n  234 |     \"Ł\",\n  235 |     \"Ø\",\n  236 |     \"Œ\",\n  237 |     \"º\",\n  238 |     \"ì\",\n  239 |     \"í\",\n  240 |     \"î\",\n  241 |     \"ï\",\n  242 |     \"ð\",\n  243 |     \"æ\",\n  244 |     \"ò\",\n  245 |     \"ó\",\n  246 |     \"ô\",\n  247 |     \"ı\",\n  248 |     \"ö\",\n  249 |     \"÷\",\n  250 |     \"ł\",\n  251 |     \"ø\",\n  252 |     \"œ\",\n  253 |     \"ß\",","lines":36,"link":"https://gith {"id":"OTHER_2","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"`symbol.py`, `zapfding.py` and `pdfdoc.py` all end with a `assert len(...) == 256` sanity check,\nbut `std.py` omits it. The list is easy to edit and a length regression in `_std_encoding` would go\nundetected until an out-of-range index access at runtime.","fix":"Add the same guard after the list, matching the sibling files:\nBefore (end of `std.py`):\n```\n    \"ÿ\",\n]\n```\nAfter:\n```\n    \"ÿ\",\n]\nassert len(_std_encoding) == 256\n```","locations":[{"ref":"pypdf/_codecs/std.py:257-258","code":"  257 |     \"ÿ\",\n  258 | ]","lines":2,"link":"https://github.com/py-pdf/pypdf/blob/7bb71dd911553eeb27b149aa00804234a7f0eeae/pypdf/_codecs/std.py#L257-L258"}]},

<script>
(function(){
'use strict';

// Data
const FINDINGS     = JSON.parse(document.getElementById('D').textContent);
const PROJECT_INFO = JSON.parse(document.getElementById('PI').textContent);
const SEVS     = ['critical','high','medium','low','negligible'];
const STATUSES = ['open','fixed','wont-fix','false-positive'];
const ALL_TYPES = [...new Set(FINDINGS.map(f => f.type))].sort();
// Build lookup map for O(1) access
const FINDING_BY_ID = new Map(FINDINGS.map(f => [f.id, f]));
// Only severities actually present in the report — the filter bar hides the rest.
const PRESENT_SEVS = SEVS.filter(s => FINDINGS.some(f => (f.severity || 'medium') === s));
// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};
const PRESENT_DIFFS = DIFFICULTY_ORDER.filter(d => FINDINGS.some(f => f.difficulty === d));
const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', searchScope: 'all', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),
};
const statuses = {};

// Persistence
function loadStatuses() {
  try { Object.assign(statuses, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}
}
function saveStatuses() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    if (S.searchScope !== 'all') p.set('qs', S.searchScope);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('qs'))  { S.searchScope = p.get('qs'); }
  document.getElementById('search-scope').classList.toggle('active', S.searchScope === 'locations');
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build a [project] header block from embedded PROJECT_INFO, so the exported
// findings.toml is self-contained (doesn't depend on a sibling project-info.toml
// that a second, separately-triggered download could silently fail to save).
// '' when there is no project info at all.
function buildProjectToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = PROJECT_INFO || {};
  if (!Object.keys(pi).length) return '';
  const lines = ['[project]'];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n\n';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return buildProjectToml() + chunks.join('\n\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystacks per finding (cleared on full re-render).
// Two variants: everything (default), and file/folder paths only - for when a
// search term (e.g. a directory name like 'dlls/abc') also happens to appear
// inside description/fix prose and you only want path matches.
const _hay = new Map();
const _hayLoc = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}
function hayLocOf(f) {
  if (!_hayLoc.has(f.id)) {
    _hayLoc.set(f.id, f.locations.map(l => l.ref).join(' ').toLowerCase());
  }
  return _hayLoc.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (S.searchScope === 'locations') {
      if (!hayLocOf(f).includes(q)) return false;
    } else if (!hayOf(f).includes(q) && !st.includes(q)) {
      return false;
    }
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  _hayLoc.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    // Single download (was two) - a second auto-triggered download is commonly
    // blocked by the browser unless the user explicitly allows it, which silently
    // drops project-info.toml. Embedding [project] in findings.toml itself avoids
    // that failure mode entirely.
    downloadText(buildFindingsToml(), 'findings.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});
document.getElementById('search-scope').addEventListener('click', e => {
  S.searchScope = S.searchScope === 'locations' ? 'all' : 'locations';
  e.currentTarget.classList.toggle('active', S.searchScope === 'locations');
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
