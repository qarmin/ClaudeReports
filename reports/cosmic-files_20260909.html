{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"open_file groups paths by MIME and sets `all_archives` based on whether every path's MIME is a supported archive type, then returns `extract_to(paths)` for the whole batch. However `all_archives` is computed over MIME types via `mime_for_path` which may misclassify; more importantly when `all_archives` is true it extracts ALL paths (including non-archives that merely share an archive MIME guess) and never falls through to normal open handling. A single misdetected file silently turns a multi-open into an extract-to dialog for everything.","fix":"Only treat as archives the paths whose MIME is actually in SUPPORTED_ARCHIVE_TYPES and route only those to extract_to, opening the remainder normally; or require the user to explicitly choose extract for mixed selections.","locations":[{"ref":"src/app.rs:800-818","code":"  800 |         let mut groups: FxHashMap<Mime, Vec<PathBuf>> = FxHashMap::default();\n  801 |         let mut all_archives = true;\n  802 |         let supported_archive_types = crate::archive::SUPPORTED_ARCHIVE_TYPES;\n  803 |         for (mime, path) in paths.iter().map(|path| {\n  804 |             (\n  805 |                 mime_icon::mime_for_path(path, None, false),\n  806 |                 path.as_ref().to_owned(),\n  807 |             )\n  808 |         }) {\n  809 |             if all_archives && !supported_archive_types.iter().copied().any(|t| mime == t) {\n  810 |                 all_archives = false;\n  811 |             }\n  812 |             groups.entry(mime).or_default().push(path);\n  813 |         }\n  814 | \n  815 |         if all_archives {\n  816 |             // Use extract to dialog if all selected paths are supported archives\n  817 |             return self.extract_to(paths);\n  818 |         }","lines":19,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/app.rs#L800-L818"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"Message::DndExitNav and Message::DndExitTab both only reset hover Instants but the auto-navigate timeout tasks (DndHoverLocTimeout / DndHoverTabTimeout) are already in flight. Combined with the DndExitTab bug above, after leaving a tab the pending DndHoverTabTimeout still matches its stored entity and elapsed-duration check and will switch tabs even though the pointer left. The exit handlers should invalidate both hover fields consistently.","fix":"Ensure DndExitTab clears tab_dnd_hover (and DndExitNav clears nav_dnd_hover); the timeout guards already check the stored value, so clearing the correct field makes the stale timeout a no-op.","locations":[{"ref":"src/app.rs:5008-5010","code":" 5008 |             Message::DndExitNav => {\n 5009 |                 self.nav_dnd_hover = None;\n 5010 |             }","lines":3,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/app.rs#L5008-L5010"},{"ref":"src/app.rs:5070-5072","code":" 5070 |             Message::DndExitTab => {\n 5071 |                 self.nav_dnd_hover = None;\n 5072 |             }","lines":3,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/app.rs#L5070-L5072"},{"ref":"src/app.rs:5102-5111","code":" 5102 |             Message::DndHoverTabTimeout(entity) => {\n 5103 |                 if self\n 5104 |                     .tab_dnd_hover\n 5105 |                     .as_ref()\n 5106 |                     .is_some_and(|(e, i)| *e == entity && i.elapsed() >= HOVER_DURATION)\n 5107 |                 {\n 5108 |                     self.tab_dnd_hover = None;\n 5109 |                     return self.update(Message::TabActivate(entity));\n 5110 |                 }\n 5111 |             }","lines":10,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/app.rs#L5102-L5111"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In footer(), `total_progress /= count as f32` can divide by zero when `progress_operations` is non-empty but no pending operation reports `show_progress_notification()` and none of the progress ids are present in `complete_operations` (e.g. an operation removed from pending without being added to complete). This yields `total_progress = NaN`, which is then fed into the progress bar and `((total_progress * 100.0) as i32)` (NaN-to-int is 0), showing a broken/blank progress bar.","fix":"Guard the division: `if count > 0 { total_progress /= count as f32; } else { total_progress = 0.0; }` (or return None / skip rendering when count == 0).","locations":[{"ref":"src/app.rs:6467-6492","code":" 6467 |         let running = count;\n 6468 |         // Adjust the progress bar so it does not jump around when operations finish\n 6469 |         for id in &self.progress_operations {\n 6470 |             if self.complete_operations.contains_key(id) {\n 6471 |                 total_progress += 1.0;\n 6472 |                 count += 1;\n 6473 |             }\n 6474 |         }\n 6475 |         let finished = count - running;\n 6476 |         total_progress /= count as f32;\n 6477 |         if running >= 1 && (running > 1 || finished > 0) {\n 6478 |             if finished > 0 {\n 6479 |                 title = fl!(\n 6480 |                     \"operations-running-finished\",\n 6481 |                     running = running,\n 6482 |                     finished = finished,\n 6483 |                     percent = ((total_progress * 100.0) as i32)\n 6484 |                 );\n 6485 |             } else {\n 6486 |                 title = fl!(\n 6487 |                     \"operations-running\",\n 6488 |                     running = running,\n 6489 |                     percent = ((total_progress * 100.0) as i32)\n 6490 |                 );\n 6491 |             }\n 6492 |         }","lines":26,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/app.rs#L6467-L6492"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `zip_extract` the per-file progress denominator uses `total = file.size()` (archive-declared size). If the declared size is 0 but the file actually has bytes (corrupt/malicious header), `current < total` is never true so progress for that file is never reported (benign). More notably `file_progress = current / total` at line 250 divides by `total`; for a declared-0-size file that yields NaN, but the branch is guarded by `current < total` (0<0 false) so it is not reached — relying on that guard rather than an explicit zero check.","fix":"Guard explicitly: only compute/report file progress when `total > 0`, and consider validating declared size against bytes actually read.","locations":[{"ref":"src/archive.rs:234-257","code":"  234 |         let total = file.size();\n  235 |         let mut outfile = fs::File::create(&outpath)?;\n  236 |         let mut current = 0;\n  237 |         loop {\n  238 |             futures::executor::block_on(async {\n  239 |                 controller\n  240 |                     .check()\n  241 |                     .await\n  242 |                     .map_err(|s| io::Error::other(OperationError::from_state(s, &controller)))\n  243 |             })?;\n  244 | \n  245 |             let count = file.read(&mut buffer)?;\n  246 |             if count == 0 {\n  247 |                 break;\n  248 |             }\n  249 |             outfile.write_all(&buffer[..count])?;\n  250 |             current += count as u64;\n  251 | \n  252 |             if current < total {\n  253 |                 let file_progress = current as f32 / total as f32;\n  254 |                 let total_progress = (i as f32 + file_progress) / total_files as f32;\n  255 |                 controller.set_progress(total_progress);\n  256 |             }\n  257 |         }","lines":24,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/archive.rs#L234-L257"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`system_time_to_zip_date_time` and `zip_date_time_to_system_time` cast year/month/day/etc via `as i16`/`as u16`/`as i8`/`as u8` with no range checks. For dates outside the DOS/zip representable range (1980-2107) `zip::DateTime::from_date_and_time` returns Err (handled via `.ok()`), but the `as` casts on out-of-range jiff values silently wrap before validation, so a year like 2024 is fine but an extreme year could wrap into a spuriously-valid in-range value and be accepted as a wrong date.","fix":"Use checked conversions (`u16::try_from(date_time.year()).ok()?` etc.) before constructing the zip DateTime so out-of-range values are rejected rather than wrapped.","locations":[{"ref":"src/archive.rs:291-321","code":"  291 | fn zip_date_time_to_system_time(date_time: zip::DateTime) -> Option<SystemTime> {\n  292 |     let dt = DateTime::new(\n  293 |         date_time.year() as i16,\n  294 |         date_time.month() as i8,\n  295 |         date_time.day() as i8,\n  296 |         date_time.hour() as i8,\n  297 |         date_time.minute() as i8,\n  298 |         date_time.second() as i8,\n  299 |         0,\n  300 |     )\n  301 |     .ok()?;\n  302 |     TimeZone::system()\n  303 |         .to_ambiguous_zoned(dt)\n  304 |         .later()\n  305 |         .ok()\n  306 |         .map(SystemTime::from)\n  307 | }\n  308 | \n  309 | pub fn system_time_to_zip_date_time(system_time: SystemTime) -> Option<zip::DateTime> {\n  310 |     let date_time = Zoned::try_from(system_time).ok()?;\n  311 | \n  312 |     zip::DateTime::from_date_and_time(\n  313 |         date_time.year() as u16,\n  314 |         date_time.month() as u8,\n  315 |         date_time.day() as u8,\n  316 |         date_time.hour() as u8,\n  317 |         date_time.minute() as u8,\n  318 |         date_time.second() as u8,\n  319 |     )\n  320 |     .ok()\n  321 | }","lines":31,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/archive.rs#L291-L321"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`x-special/gnome-copied-files` is produced with the first line being the operation (`copy`/`cut`) followed by `\\n`-joined URIs, but `text_uri_list` is joined with CRLF while gnome-copied-files uses bare `\\n`. The asymmetry is intentional per convention, however the gnome-copied-files writer never appends a trailing separator and the parser uses `lines()` which tolerates either; no bug in round-trip, but the inconsistent line endings between the two representations are undocumented and fragile if a consumer expects CRLF.","fix":"Add a comment documenting that gnome-copied-files intentionally uses LF separators with the first line as the operation, to prevent a future 'fix' from breaking interop with GNOME/Nautilus.","locations":[{"ref":"src/clipboard.rs:67-71","code":"   67 |                     text_uri_list.push_str(url_str);\n   68 |                     text_uri_list.push_str(cr_nl);\n   69 | \n   70 |                     x_special_gnome_copied_files.push('\\n');\n   71 |                     x_special_gnome_copied_files.push_str(url_str);","lines":5,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/clipboard.rs#L67-L71"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"Message::Choice maps a CheckBox toggle through `usize::from(checked)` in button_view (line 613) then back via `*value = option_i > 0` in update (line 1381). This double conversion bool->usize->bool works but is fragile and obscures intent; any future caller sending Choice(i, n) with n>1 for a checkbox silently sets it true, and the ComboBox branch shares the same option_i space, so the meaning of option_i is overloaded between the two variants.","fix":"Use distinct messages for checkbox toggles vs combo-box selection, or pass a bool for checkboxes, to avoid the overloaded usize encoding.","locations":[{"ref":"src/dialog.rs:604-626","code":"  604 |         for (choice_i, choice) in self.choices.iter().enumerate() {\n  605 |             match choice {\n  606 |                 DialogChoice::CheckBox { label, value, .. } => {\n  607 |                     row = row.push(\n  608 |                         widget::checkbox(*value)\n  609 |                             .label(label)\n  610 |                             .on_toggle(move |checked| {\n  611 |                                 Message::Choice(choice_i, usize::from(checked))\n  612 |                             }),\n  613 |                     );\n  614 |                 }\n  615 |                 DialogChoice::ComboBox {\n  616 |                     label,\n  617 |                     options,\n  618 |                     selected,\n  619 |                     ..\n  620 |                 } => {\n  621 |                     row = row.push(widget::text::heading(label));\n  622 |                     row = row.push(widget::dropdown(options, *selected, move |option_i| {\n  623 |                         Message::Choice(choice_i, option_i)\n  624 |                     }));\n  625 |                 }\n  626 |             }","lines":23,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/dialog.rs#L604-L626"},{"ref":"src/dialog.rs:1370-1384","code":" 1370 |             Message::Choice(choice_i, option_i) => {\n 1371 |                 if let Some(choice) = self.choices.get_mut(choice_i) {\n 1372 |                     match choice {\n 1373 |                         DialogChoice::CheckBox { value, .. } => *value = option_i > 0,\n 1374 |                         DialogChoice::ComboBox {\n 1375 |                             options, selected, ..\n 1376 |                         } => {\n 1377 |                             if option_i < options.len() {\n 1378 |                                 *selected = Some(option_i);\n 1379 |                             } else {\n 1380 |                                 *selected = None;\n 1381 |                             }\n 1382 |                         }\n 1383 |                     }\n 1384 |                 }","lines":15,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/dialog.rs#L1370-L1384"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"Message::DialogUpdate writes to dialog_pages[0] (the front) but DialogCancel/DialogComplete pop_front. If two dialog pages are ever queued (e.g. a NewFolder push_back while a Replace is shown, or vice versa), an on_input update targeting the visible page (front) is correct, but DialogUpdate indexes [0] while the rest of the code treats the queue as a stack via push_back. Mixing push_back with front-based editing means the displayed page (front) and a newly pushed page (back) can desynchronize. Currently only one page is ever shown so impact is low, but the queue/stack model is inconsistent.","fix":"Pick one model: either a single Option<DialogPage>, or consistently push_front/pop_front. Editing front via index [0] is fine only if pushes also go to the front.","locations":[{"ref":"src/dialog.rs:1423-1427","code":" 1423 |             Message::DialogUpdate(dialog_page) => {\n 1424 |                 if !self.dialog_pages.is_empty() {\n 1425 |                     self.dialog_pages[0] = dialog_page;\n 1426 |                 }\n 1427 |             }","lines":5,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/dialog.rs#L1423-L1427"},{"ref":"src/dialog.rs:1570-1573","code":" 1570 |                     self.dialog_pages.push_back(DialogPage::NewFolder {\n 1571 |                         parent: path.clone(),\n 1572 |                         name: String::new(),\n 1573 |                     });","lines":4,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/dialog.rs#L1570-L1573"},{"ref":"src/dialog.rs:1710-1713","code":" 1710 |                         self.dialog_pages.push_back(DialogPage::Replace {\n 1711 |                             filename: filename.clone(),\n 1712 |                         });\n 1713 |                         return widget::button::focus(REPLACE_BUTTON_ID.clone());","lines":4,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/dialog.rs#L1710-L1713"}]},
{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `should_use_dedicated_worker`, `mb_needed = bytes_needed / MB_TO_BYTES` truncates toward zero, so an image needing e.g. 1.9 MB reports 1 MB. The comparison `mb_needed > per_worker_budget_mb` therefore under-counts the real requirement and can route a too-large image to the shared parallel pool, undershooting the memory budget. The same truncation appears in `check_ram_available` (line 204) but there the precise `bytes_needed` is used for the actual comparison, so only the dedicated-worker routing decision is affected.","fix":"Compare bytes directly: `if bytes_needed > per_worker_budget_mb.saturating_mul(MB_TO_BYTES)`, avoiding the lossy MB truncation for the routing decision.","locations":[{"ref":"src/large_image.rs:131-134","code":"  131 |     let mb_needed = bytes_needed / MB_TO_BYTES;\n  132 |     let per_worker_budget_mb = total_budget_mb / parallel_workers as u64;\n  133 | \n  134 |     if mb_needed > per_worker_budget_mb {","lines":4,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/large_image.rs#L131-L134"}]},
{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`decode_large_image` sets `limits.max_alloc` but never sets `limits.max_image_width`/`max_image_height`. `max_alloc` bounds a single allocation during decode, but a decompression-bomb image (e.g. tiny PNG declaring huge dimensions) can still allocate the final RGBA buffer up to GALLERY_MEMORY_LIMIT_MB (2 GB decimal). The RAM availability check in `try_decode` mitigates this on Linux only; on Windows/macOS there is no RAM gate, so a 2 GB allocation can be attempted.","fix":"Also set `limits.max_image_width` and `limits.max_image_height` to sane caps so malformed/bomb images are rejected before allocating the decoded buffer, on all platforms.","locations":[{"ref":"src/large_image.rs:277-279","code":"  277 |                         let mut limits = image::Limits::default();\n  278 |                         limits.max_alloc = Some(GALLERY_MEMORY_LIMIT_MB * DECIMAL_MB_TO_BYTES);\n  279 |                         reader.limits(limits);","lines":3,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/large_image.rs#L277-L279"}]},
{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`needs_redecode_for_size` divides `new_size.0 as f32 / old_size.0 as f32` (and height) without guarding against a stored `old_size` of 0. A previously stored display size of (0, 0) would produce inf/NaN; `inf > 0.2` is true so it would force redecode, NaN comparisons are false so it would not. Stored sizes come from `try_decode`'s `display_dimensions` which can in principle be (0,0). Low impact (worst case is a spurious redecode) but the math is unguarded.","fix":"Return false early if either component of `old_size` is 0, or use checked ratio computation.","locations":[{"ref":"src/large_image.rs:462-466","code":"  462 |         let width_increase = (new_size.0 as f32 / old_size.0 as f32) - 1.0;\n  463 |         let height_increase = (new_size.1 as f32 / old_size.1 as f32) - 1.0;\n  464 | \n  465 |         let needs_redecode =\n  466 |             width_increase > REDECODE_THRESHOLD || height_increase > REDECODE_THRESHOLD;","lines":5,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/large_image.rs#L462-L466"}]},
{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"selected_desktop_entry is only set when the matched .desktop item is encountered while `selected == 1` (i.e., it is the first selected item). If a non-desktop item is selected first and a single .desktop second, selected would be 2 at that point and the entry is never captured — but more subtly, if the FIRST selected item is a .desktop and a second item is then selected, selected_desktop_entry stays Some while selected becomes 2; the later `if selected == 1` guard (line 169) nullifies it, so behavior is correct, yet the in-loop `selected == 1` guard at line 144 is redundant/confusing and couples capture order to selection order.","fix":"Capture the desktop-entry candidate independent of count, then gate solely on the final `selected == 1` check, or document the order coupling.","locations":[{"ref":"src/menu.rs:153-158","code":"  153 |                     Some(Location::Path(path))\n  154 |                         if selected == 1\n  155 |                             && path.extension().and_then(|s| s.to_str()) == Some(\"desktop\") =>\n  156 |                     {\n  157 |                         selected_desktop_entry = Some(&**path);\n  158 |                     }","lines":6,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/menu.rs#L153-L158"},{"ref":"src/menu.rs:181-190","code":"  181 |     let selected_desktop_entry = selected_desktop_entry.and_then(|path| {\n  182 |         if selected == 1 {\n  183 |             let lang_id = crate::localize::LANGUAGE_LOADER.current_language();\n  184 |             let language = lang_id.language.as_str();\n  185 |             // Cache?\n  186 |             cosmic::desktop::load_desktop_file(&[language.into()], path.into())\n  187 |         } else {\n  188 |             None\n  189 |         }\n  190 |     });","lines":10,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/menu.rs#L181-L190"}]},
{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"menu_bar computes delete_item/delete_item_action with two arms that both yield Action::Delete and differ only in the label string. The action is identical, so the shift/in_trash branch only changes the displayed text; the actual permanent-vs-trash decision must happen elsewhere (in Action::Delete handling). This is easy to misread as routing to different actions and is brittle: label and behavior are decided in two separate places keyed on the same modifier.","fix":"Either select label only (drop the tuple), or route to a distinct Action::PermanentlyDelete for the shift/in_trash case to keep label and behavior in sync.","locations":[{"ref":"src/menu.rs:648-652","code":"  648 |     let (delete_item, delete_item_action) = if in_trash || modifiers.shift() {\n  649 |         (fl!(\"delete-permanently\"), Action::Delete)\n  650 |     } else {\n  651 |         (fl!(\"move-to-trash\"), Action::Delete)\n  652 |     };","lines":5,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/menu.rs#L648-L652"}]},
{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In menu_bar's File menu, the 'open' enabled predicate is `(selected > 0 && selected_dir == 0) || (selected_dir == 1 && selected == 1)`. This disables Open when multiple directories are selected, or when a mix of files and dirs is selected, even though the corresponding context_menu uses the same predicate to SHOW Open. Consistent with context menu, but means multi-directory selection cannot be opened from the menu bar; verify this matches intended UX (it silently greys out Open for >1 selected dirs).","fix":"If opening multiple directories is intended (e.g. open-in-new-tabs), broaden the predicate; otherwise document the limitation.","locations":[{"ref":"src/menu.rs:671-676","code":"  671 |                         menu_button_optional(\n  672 |                             fl!(\"open\"),\n  673 |                             Action::Open,\n  674 |                             (selected > 0 && selected_dir == 0)\n  675 |                                 || (selected_dir == 1 && selected == 1),\n  676 |                         ),","lines":6,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/menu.rs#L671-L676"},{"ref":"src/menu.rs:231-234","code":"  231 |             } else if selected > 0 {\n  232 |                 if selected_dir == 1 && selected == 1 || selected_dir == 0 {\n  233 |                     children.push(menu_item(fl!(\"open\"), Action::Open).into());\n  234 |                 }","lines":4,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/menu.rs#L231-L234"}]},
{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"State::click hardcodes mouse::Button::Left when constructing the chained Click regardless of which button triggered it. It is currently only called from the left-button/touch press path (line 601), so this is latent, but the function name and signature suggest general use; calling it for another button would mislabel the click and corrupt double-click detection.","fix":"Pass the actual mouse::Button into State::click, or document that it is left/touch only.","locations":[{"ref":"src/mouse_area.rs:261-285","code":"  261 |     fn click(&mut self, pos: Point) -> mouse::Click {\n  262 |         let now = Instant::now();\n  263 | \n  264 |         let new = if let Some((prev_click, prev_time)) = self.prev_click.take() {\n  265 |             if now.duration_since(prev_time) < DOUBLE_CLICK_DURATION {\n  266 |                 match prev_click.kind() {\n  267 |                     mouse::click::Kind::Single => {\n  268 |                         mouse::Click::new(pos, mouse::Button::Left, Some(prev_click))\n  269 |                     }\n  270 |                     mouse::click::Kind::Double => {\n  271 |                         mouse::Click::new(pos, mouse::Button::Left, Some(prev_click))\n  272 |                     }\n  273 |                     mouse::click::Kind::Triple => {\n  274 |                         mouse::Click::new(pos, mouse::Button::Left, Some(prev_click))\n  275 |                     }\n  276 |                 }\n  277 |             } else {\n  278 |                 mouse::Click::new(pos, mouse::Button::Left, None)\n  279 |             }\n  280 |         } else {\n  281 |             mouse::Click::new(pos, mouse::Button::Left, None)\n  282 |         };\n  283 |         self.prev_click = Some((new, now));\n  284 |         new\n  285 |     }","lines":25,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/mouse_area.rs#L261-L285"},{"ref":"src/mouse_area.rs:608-629","code":"  608 |     if let Event::Mouse(mouse::Event::ButtonPressed(mouse::Button::Left))\n  609 |     | Event::Touch(touch::Event::FingerPressed { .. }) = event\n  610 |     {\n  611 |         let click = state.click(cursor.position_in(layout_bounds).unwrap_or_default());\n  612 |         match click.kind() {\n  613 |             click::Kind::Single => {\n  614 |                 if let Some(message) = widget.on_press.as_ref() {\n  615 |                     shell.publish(message(cursor.position_in(layout_bounds)));\n  616 |                 }\n  617 |             }\n  618 |             click::Kind::Double => {\n  619 |                 if let Some(message) = widget.on_double_click.as_ref() {\n  620 |                     shell.publish(message(cursor.position_in(layout_bounds)));\n  621 |                 }\n  622 |             }\n  623 |             click::Kind::Triple => {\n  624 |                 // TODO what to do here\n  625 |                 if let Some(message) = widget.on_press.as_ref() {\n  626 |                     shell.publish(message(cursor.position_in(layout_bounds)));\n  627 |                 }\n  628 |             }\n  629 |         }","lines":22,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/mouse_area.rs#L608-L629"}]},
{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"on_resize fires whenever the viewport Rectangle changes (position or size), not only on size changes. viewport_changed is `state.viewport != Some(*viewport)`, which is true on scroll/translation as well as resize. Consumers expecting a true resize callback will be invoked on scroll. The trait is named OnResize and docs say 'on resizing'.","fix":"Compare only viewport.size() if the intent is resize, or rename/redocument to 'on viewport change'.","locations":[{"ref":"src/mouse_area.rs:531-539","code":"  531 |     let viewport_changed = state.viewport != Some(*viewport);\n  532 | \n  533 |     if let Some(message) = widget.on_resize.as_ref()\n  534 |         && viewport_changed\n  535 |     {\n  536 |         shell.publish(message(*viewport));\n  537 |     }\n  538 | \n  539 |     state.viewport = Some(*viewport);","lines":9,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/mouse_area.rs#L531-L539"}]},
{"id":"LOGIC_34","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`Operation::Delete` (move-to-trash) ignores the `_items_opt` result from `trash::delete` (mod.rs:861-864) and never aggregates failures: each path is trashed in a separate spawn_blocking and any per-path error is propagated by `?` aborting the rest, while a successful-but-empty trash result is silently dropped. There is also no overwrite/conflict handling and no `OperationSelection` of trashed items returned for undo (the TODO at mod.rs:864 notes restore is not wired up).","fix":"Capture trash items for undo support and decide on partial-failure semantics (collect and continue, or clearly report which paths failed).","locations":[{"ref":"src/operation/mod.rs:849-867","code":"  849 |             Self::Delete { paths } => {\n  850 |                 let total = paths.len();\n  851 |                 for (i, path) in paths.into_iter().enumerate() {\n  852 |                     futures::executor::block_on(async {\n  853 |                         controller\n  854 |                             .check()\n  855 |                             .await\n  856 |                             .map_err(|s| OperationError::from_state(s, &controller))\n  857 |                     })?;\n  858 | \n  859 |                     controller.set_progress((i as f32) / (total as f32));\n  860 | \n  861 |                     let _items_opt = compio::runtime::spawn_blocking(|| trash::delete(path))\n  862 |                         .await\n  863 |                         .map_err(wrap_compio_spawn_error)?;\n  864 |                     //TODO: items_opt allows for easy restore\n  865 |                 }\n  866 |                 Ok(OperationSelection::default())\n  867 |             }","lines":19,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/operation/mod.rs#L849-L867"}]},
{"id":"LOGIC_35","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`EmptyTrash` reports overall failure if any item fails to purge (mod.rs:939-954), but `DeleteTrash` purges items one-by-one and aborts on the first error via `?` (mod.rs:893-894), leaving the remaining selected trash items un-deleted with no indication of which succeeded. The two trash-deletion paths have inconsistent partial-failure handling; DeleteTrash should collect errors and continue like EmptyTrash does, or at least report which items were not deleted.","fix":"Make DeleteTrash collect per-item errors and continue (mirroring EmptyTrash at mod.rs:921-954) so a single bad item does not silently abort deletion of the rest.","locations":[{"ref":"src/operation/mod.rs:883-901","code":"  883 |                         for (i, item) in items.into_iter().enumerate() {\n  884 |                             futures::executor::block_on(async {\n  885 |                                 controller\n  886 |                                     .check()\n  887 |                                     .await\n  888 |                                     .map_err(|s| OperationError::from_state(s, &controller))\n  889 |                             })?;\n  890 | \n  891 |                             controller.set_progress(i as f32 / count as f32);\n  892 | \n  893 |                             trash::os_limited::purge_all([item])\n  894 |                                 .map_err(|e| OperationError::from_err(e, &controller))?;\n  895 |                         }\n  896 |                         Ok(())\n  897 |                     })\n  898 |                     .await\n  899 |                     .map_err(wrap_compio_spawn_error)?\n  900 |                     .map_err(|e| OperationError::from_err(e, &controller))?;\n  901 |                 }","lines":19,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/operation/mod.rs#L883-L901"}]},
{"id":"LOGIC_36","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"format_size uses decimal SI units (KB=1000, MB=1000*KB, ...) and labels them 'KB'/'MB'/'GB'/'TB'. For a file manager users typically expect either binary units (KiB) or at least consistency with the rest of the desktop; using 1000-based divisions with 'KB' labels yields sizes that disagree with `ls -l`/`du` (which often use 1024) and the label is technically ambiguous. (Flagged as a correctness/expectation issue, not a crash.)","fix":"Confirm the intended unit convention; if binary is desired use 1024 with KiB/MiB labels, otherwise the current SI choice is fine but should be intentional/documented.","locations":[{"ref":"src/tab.rs:349-366","code":"  349 | fn format_size(size: u64) -> String {\n  350 |     const KB: u64 = 1000;\n  351 |     const MB: u64 = 1000 * KB;\n  352 |     const GB: u64 = 1000 * MB;\n  353 |     const TB: u64 = 1000 * GB;\n  354 | \n  355 |     if size >= TB {\n  356 |         format!(\"{:.1} TB\", size as f64 / TB as f64)\n  357 |     } else if size >= GB {\n  358 |         format!(\"{:.1} GB\", size as f64 / GB as f64)\n  359 |     } else if size >= MB {\n  360 |         format!(\"{:.1} MB\", size as f64 / MB as f64)\n  361 |     } else if size >= KB {\n  362 |         format!(\"{:.1} KB\", size as f64 / KB as f64)\n  363 |     } else {\n  364 |         format!(\"{size} B\")\n  365 |     }\n  366 | }","lines":18,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/tab.rs#L349-L366"}]},
{"id":"LOGIC_37","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"format_time / FormatTime::from_secs only handle timestamps in the past: from_secs computes now - (now - secs) and returns None if secs is in the future (now_secs.checked_sub(secs) fails) or negative. File mtimes slightly in the future (clock skew, network filesystems, archives) will render as no time at all instead of the actual date, silently dropping the Modified column for such files.","fix":"Construct the SystemTime directly from the epoch seconds (UNIX_EPOCH +/- Duration) handling both past and future, rather than the now-relative subtraction dance.","locations":[{"ref":"src/tab.rs:416-435","code":"  416 |     fn from_secs(\n  417 |         secs: i64,\n  418 |         date_time_formatter: &'a DateTimeFormatter<fieldsets::YMDT>,\n  419 |         time_formatter: &'a DateTimeFormatter<fieldsets::T>,\n  420 |     ) -> Option<Self> {\n  421 |         // This looks convoluted because we need to ensure the units match up\n  422 |         let secs: u64 = secs.try_into().ok()?;\n  423 |         let now = SystemTime::now();\n  424 |         let filetime_diff = now\n  425 |             .duration_since(SystemTime::UNIX_EPOCH)\n  426 |             .map(|from_epoch| from_epoch.as_secs())\n  427 |             .ok()\n  428 |             .and_then(|now_secs| now_secs.checked_sub(secs))\n  429 |             .map(Duration::from_secs)?;\n  430 |         now.checked_sub(filetime_diff).map(|time| Self {\n  431 |             time,\n  432 |             date_time_formatter,\n  433 |             time_formatter,\n  434 |         })\n  435 |     }","lines":20,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/tab.rs#L416-L435"}]},
{"id":"LOGIC_38","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"children_opt for directories is populated with fs::read_dir(path).count() during item creation (item_from_entry / item_from_gvfs_info), which counts ALL entries including hidden files (dotfiles). The displayed 'N items' count therefore includes hidden files even when show_hidden is off, so the count shown in list/preview can disagree with what the user actually sees inside the folder.","fix":"Either document that the count includes hidden entries, or filter dotfiles to match the show_hidden setting (noting the count is computed at scan time, independent of the viewing tab's config).","locations":[{"ref":"src/tab.rs:854-867","code":"  854 |     let mut children_opt = None;\n  855 |     let mut dir_size = DirSize::NotDirectory;\n  856 |     if metadata.is_dir() && !remote {\n  857 |         dir_size = DirSize::Calculating(Controller::default());\n  858 |         //TODO: calculate children in the background (and make it cancellable?)\n  859 |         match fs::read_dir(&path) {\n  860 |             Ok(entries) => {\n  861 |                 children_opt = Some(entries.count());\n  862 |             }\n  863 |             Err(err) => {\n  864 |                 log::warn!(\"failed to read directory {}: {}\", path.display(), err);\n  865 |             }\n  866 |         }\n  867 |     }","lines":14,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/tab.rs#L854-L867"},{"ref":"src/tab.rs:729-742","code":"  729 |     let mut children_opt = None;\n  730 |     let mut dir_size = DirSize::NotDirectory;\n  731 |     if is_dir && !remote {\n  732 |         dir_size = DirSize::Calculating(Controller::default());\n  733 |         //TODO: calculate children in the background (and make it cancellable?)\n  734 |         match fs::read_dir(&path) {\n  735 |             Ok(entries) => {\n  736 |                 children_opt = Some(entries.count());\n  737 |             }\n  738 |             Err(err) => {\n  739 |                 log::warn!(\"failed to read directory {}: {}\", path.display(), err);\n  740 |             }\n  741 |         }\n  742 |     }","lines":14,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/tab.rs#L729-L742"}]},
{"id":"LOGIC_39","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"EditLocation::select uses `completions.len() - 1` for the backwards-wrap default. This is guarded by the preceding `completions.is_empty()` check so it cannot underflow in practice, but the value is computed via plain subtraction while the forward path carefully uses checked_add/checked_sub, an inconsistency that is fragile if the empty guard is ever refactored away.","fix":"Use completions.len().checked_sub(1).unwrap_or(0) for consistency and defense-in-depth.","locations":[{"ref":"src/tab.rs:1451-1479","code":" 1451 |     pub fn select(&mut self, forwards: bool) {\n 1452 |         if let Some(completions) = &self.completions {\n 1453 |             if completions.is_empty() {\n 1454 |                 self.selected = None;\n 1455 |             } else {\n 1456 |                 let mut selected = if forwards {\n 1457 |                     self.selected.and_then(|x| x.checked_add(1)).unwrap_or(0)\n 1458 |                 } else {\n 1459 |                     self.selected\n 1460 |                         .and_then(|x| x.checked_sub(1))\n 1461 |                         .unwrap_or(completions.len() - 1)\n 1462 |                 };\n 1463 |                 if selected >= completions.len() {\n 1464 |                     selected = 0;\n 1465 |                 }\n 1466 |                 self.selected = Some(selected);\n 1467 | \n 1468 |                 // Automatically resolve if there is only one completion\n 1469 |                 if completions.len() == 1\n 1470 |                     && let Some(resolved) = self.resolve()\n 1471 |                 {\n 1472 |                     self.location = resolved;\n 1473 |                     self.selected = None;\n 1474 |                 }\n 1475 |             }\n 1476 |         } else {\n 1477 |             self.selected = None;\n 1478 |         }\n 1479 |     }","lines":29,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/tab.rs#L1451-L1479"}]},
{"id":"LOGIC_40","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`thumbnail_uri` calls `fs::canonicalize(path)`, which resolves symlinks and requires the file to exist. This means the thumbnail cache key is keyed on the canonical (symlink-resolved) path, so two different symlink paths pointing at the same target share a thumbnail (usually fine), but it also means the URI written into the thumbnail differs from the freedesktop convention of using the original requested URI. More importantly, canonicalize fails (returns Err, propagated to `new`) for any not-yet-existing or permission-restricted path, disabling caching for those entirely.","fix":"Confirm the freedesktop spec expectation: the Thumb::URI should generally be the URI of the file as referenced. Consider using an absolute (non-canonicalized) path via `path.canonicalize().unwrap_or_else(|_| absolute path)` or `std::path::absolute` to remain robust when canonicalize fails.","locations":[{"ref":"src/thumbnail_cacher.rs:292-305","code":"  292 | fn thumbnail_uri(path: &Path) -> io::Result<String> {\n  293 |     let absolute_path = fs::canonicalize(path)?;\n  294 |     let url = Url::from_file_path(&absolute_path).map_err(|()| {\n  295 |         io::Error::other(format!(\n  296 |             \"failed to create URI for thumbnail_file: {}\",\n  297 |             absolute_path.display()\n  298 |         ))\n  299 |     })?;\n  300 |     // Technically square brackets don't need to be percent encoded,\n  301 |     // and they aren't by the url crate, but the thumbnailer used by\n  302 |     // Gnome Files does. In order to share thumbnails and not get duplicates\n  303 |     // we should do the same.\n  304 |     let url = url.as_str().replace('[', \"%5B\").replace(']', \"%5D\");\n  305 |     Ok(url)","lines":14,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/thumbnail_cacher.rs#L292-L305"}]},
{"id":"LOGIC_41","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `zoom_in_view`, values of `*icon_size` strictly between MAX_ZOOM (500) and step's post-loop value (525) are not clamped down to MAX_ZOOM. The final clamp `if *icon_size > step` uses `step == 525` (MAX_ZOOM + ZOOM_STEP) after the loop, so an icon size of e.g. 510 (which can come from a hand-edited or migrated config) stays 510 instead of being clamped to 500. Symmetrically `zoom_out_view` does not raise an out-of-range value below MIN_ZOOM (e.g. 40) up to MIN_ZOOM.","fix":"Clamp `*icon_size` to the [MIN_ZOOM, MAX_ZOOM] range up front, or compare against MAX_ZOOM/MIN_ZOOM constants in the final clamp rather than the over/undershot `step` value.","locations":[{"ref":"src/zoom.rs:16-30","code":"   16 | pub(crate) fn zoom_in_view(view: View, icon_sizes: &mut IconSizes) {\n   17 |     let icon_size = select_resized_icon(view, icon_sizes);\n   18 | \n   19 |     let mut step = MIN_ZOOM;\n   20 |     while step <= MAX_ZOOM {\n   21 |         if *icon_size < step {\n   22 |             *icon_size = step;\n   23 |             break;\n   24 |         }\n   25 |         step = step.saturating_add(ZOOM_STEP);\n   26 |     }\n   27 |     if *icon_size > step {\n   28 |         *icon_size = step;\n   29 |     }\n   30 | }","lines":15,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/zoom.rs#L16-L30"},{"ref":"src/zoom.rs:32-46","code":"   32 | pub(crate) fn zoom_out_view(view: View, icon_sizes: &mut IconSizes) {\n   33 |     let icon_size = select_resized_icon(view, icon_sizes);\n   34 | \n   35 |     let mut step = MAX_ZOOM;\n   36 |     while step >= MIN_ZOOM {\n   37 |         if *icon_size > step {\n   38 |             *icon_size = step;\n   39 |             break;\n   40 |         }\n   41 |         step = NonZeroU16::new(step.get().saturating_sub(ZOOM_STEP)).unwrap();\n   42 |     }\n   43 |     if *icon_size < step {\n   44 |         *icon_size = step;\n   45 |     }\n   46 | }","lines":15,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/zoom.rs#L32-L46"}]},
{"id":"LOGIC_42","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"medium","description":"`copy_unique_path` loops `for n in 0..` with no upper bound; `n` is only used in `format!`, so its type defaults to `i32`. In the pathological case of billions of existing colliding names it would overflow (panic in debug, wrap in release). Practically unreachable, but the unbounded counter type is fragile.","fix":"Use an explicit unbounded type (e.g. `for n in 0u64..`) or cap the search with a sane upper bound and a fallback (e.g. random suffix).","locations":[{"ref":"src/operation/mod.rs:287-304","code":"  287 |         for n in 0.. {\n  288 |             let new_name = if n == 0 {\n  289 |                 file_name.to_string()\n  290 |             } else {\n  291 |                 match ext {\n  292 |                     Some(ref ext) => format!(\"{} ({} {}).{}\", stem, fl!(\"copy_noun\"), n, ext),\n  293 |                     None => format!(\"{} ({} {})\", stem, fl!(\"copy_noun\"), n),\n  294 |                 }\n  295 |             };\n  296 | \n  297 |             to.push(&new_name);\n  298 | \n  299 |             if !matches!(to.try_exists(), Ok(true)) {\n  300 |                 break;\n  301 |             }\n  302 |             // Continue if a copy with index exists\n  303 |             to.pop();\n  304 |         }","lines":18,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/operation/mod.rs#L287-L304"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"In handle_overlap the sort comparator computes the second key as `a.1.width * b.1.height`, mixing element `a`'s width with element `b`'s height. This is a copy-paste error: it should be `a.1.width * a.1.height` so that overlaps are sorted by their own area. The bug makes the sort order of overlapping surfaces (docks/panels) incorrect, which can yield wrong desktop margins.","fix":"Replace the comparator with `(b.1.width * b.1.height).total_cmp(&(a.1.width * a.1.height))`.","locations":[{"ref":"src/app.rs:1085-1086","code":" 1085 |         sorted_overlaps\n 1086 |             .sort_by(|a, b| (b.1.width * b.1.height).total_cmp(&(a.1.width * b.1.height)));","lines":2,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/app.rs#L1085-L1086"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"medium","description":"Message::DndExitTab clears `self.nav_dnd_hover` instead of `self.tab_drag`/`self.tab_dnd_hover`. When a drag leaves a tab the tab hover state is never cleared, while an unrelated nav-bar hover state is wrongly reset. This means the DndHoverTabTimeout that switches tabs on hover can still fire after the cursor has left the tab (switching to the wrong tab), and nav DnD highlighting can be cleared spuriously. Clearly a copy-paste of the DndExitNav arm just above (4947-4949).","fix":"Change the body of the `Message::DndExitTab` arm to `self.tab_dnd_hover = None;`.","locations":[{"ref":"src/app.rs:5070-5072","code":" 5070 |             Message::DndExitTab => {\n 5071 |                 self.nav_dnd_hover = None;\n 5072 |             }","lines":3,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/app.rs#L5070-L5072"}]},
{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"In select_first_pos_opt, when two selected items share the same row, the column tie-break uses `col.min(first_row)` instead of `col.min(first_col)` (the row variable is compared against, not the column). This computes a meaningless min of a column index and a row index, so the 'first selected position' can be wrong, causing keyboard navigation (ItemLeft/ItemUp from a multi-selection) to focus the wrong item.","fix":"Change `Ordering::Equal => (row, col.min(first_row))` to `Ordering::Equal => (row, col.min(first_col))`.","locations":[{"ref":"src/tab.rs:3389","code":" 3389 |                     Ordering::Equal => (row, col.min(first_row)),","lines":1,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/tab.rs#L3389"}]},
{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"In select_last_pos_opt, the same column tie-break bug appears mirrored: `col.max(last_row)` is used instead of `col.max(last_col)` when two selected items are on the same row. The 'last selected position' can be wrong, breaking ItemRight/ItemDown navigation from a multi-selection.","fix":"Change `Ordering::Equal => (row, col.max(last_row))` to `Ordering::Equal => (row, col.max(last_col))`.","locations":[{"ref":"src/tab.rs:3414","code":" 3414 |                     Ordering::Equal => (row, col.max(last_row)),","lines":1,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/tab.rs#L3414"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"When parsing a pasted `text/uri-list` or `x-special/gnome-copied-files` payload, any single malformed line aborts the entire `TryFrom` with `?`, discarding all paths parsed so far. A clipboard with one bad URI (e.g. a trailing comment line, a `# ...` comment that the uri-list spec actually permits, or a non-file scheme URL) makes the whole paste fail instead of pasting the valid entries. The uri-list format explicitly allows comment lines beginning with '#', which `Url::parse` will reject.","fix":"Skip blank lines and lines starting with '#' (per the text/uri-list spec), and on a parse/conversion error for an individual line log a warning and `continue` rather than returning an error for the whole payload.","locations":[{"ref":"src/clipboard.rs:135-141","code":"  135 |                 for line in text.lines() {\n  136 |                     let url = Url::parse(line)?;\n  137 |                     match url.to_file_path() {\n  138 |                         Ok(path) => paths.push(path),\n  139 |                         Err(()) => Err(format!(\"invalid file URL {url:?}\"))?,\n  140 |                     }\n  141 |                 }","lines":7,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/clipboard.rs#L135-L141"},{"ref":"src/clipboard.rs:146-160","code":"  146 |                 for (i, line) in text.lines().enumerate() {\n  147 |                     if i == 0 {\n  148 |                         kind = match line {\n  149 |                             \"copy\" => ClipboardKind::Copy,\n  150 |                             \"cut\" => ClipboardKind::Cut { is_dnd: false },\n  151 |                             _ => Err(format!(\"unsupported clipboard operation {line:?}\"))?,\n  152 |                         };\n  153 |                     } else {\n  154 |                         let url = Url::parse(line)?;\n  155 |                         match url.to_file_path() {\n  156 |                             Ok(path) => paths.push(path),\n  157 |                             Err(()) => Err(format!(\"invalid file URL {url:?}\"))?,\n  158 |                         }\n  159 |                     }\n  160 |                 }","lines":15,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/clipboard.rs#L146-L160"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"On copy failure the partially-written destination is removed with `_ = compio::fs::remove_file(&self.to)` (recursive.rs:348-350), discarding the result. If that cleanup fails (e.g. permission change applied earlier at recursive.rs:481-488 made the file undeletable, or the path is now a directory), a corrupt/partial file is left behind silently with no log and no error surfaced to the user, who may mistake it for a complete copy.","fix":"Log a warning if the cleanup `remove_file` fails so partial files are not left silently, and ensure the destination is writable/deletable before attempting removal.","locations":[{"ref":"src/operation/recursive.rs:348-353","code":"  348 |                 if result.is_err() {\n  349 |                     _ = compio::fs::remove_file(&self.to).await;\n  350 |                 }\n  351 | \n  352 |                 crate::operation::actively_writing_remove(&self.to);\n  353 |                 return result;","lines":6,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/operation/recursive.rs#L348-L353"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"Cross-device (EXDEV) detection during move relies on `err.raw_os_error() == Some(EXDEV)` after a failed `hard_link` (recursive.rs:373-396). `hard_link` can fail with EXDEV not only for cross-filesystem moves but the fallback only triggers on exactly EXDEV; other errors (e.g. EPERM when the source filesystem disallows hardlinks even within the same device, EMLINK for too many links, or EOPNOTSUPP) are returned as hard errors with no copy fallback, so legitimately movable files on filesystems that don't support hardlinks (FAT, some network mounts) will fail the move entirely instead of falling back to copy+remove.","fix":"Fall back to the copy path for the broader set of errors that indicate hard_link is unsupported (EXDEV, EPERM, EMLINK, EOPNOTSUPP/ENOTSUP), not EXDEV alone.","locations":[{"ref":"src/operation/recursive.rs:372-398","code":"  372 |                 // This is atomic and ensures `to` is not created by any other process\n  373 |                 match compio::fs::hard_link(&self.from, &self.to).await {\n  374 |                     Ok(()) => {}\n  375 |                     Err(err) => {\n  376 |                         // https://docs.rs/windows-sys/latest/windows_sys/Win32/Foundation/constant.ERROR_NOT_SAME_DEVICE.html\n  377 |                         #[cfg(windows)]\n  378 |                         const EXDEV: i32 = 17;\n  379 |                         #[cfg(unix)]\n  380 |                         const EXDEV: i32 = libc::EXDEV as _;\n  381 | \n  382 |                         if err.raw_os_error() == Some(EXDEV) {\n  383 |                             if cross_device_copy {\n  384 |                                 // Do not clean up if cross_device_copy is set\n  385 |                                 self.skipped.cleanup.set(true);\n  386 |                             }\n  387 |                             // Try standard copy if hard link fails with cross device error\n  388 |                             let mut copy_op = Self {\n  389 |                                 kind: OpKind::Copy,\n  390 |                                 from: self.from.clone(),\n  391 |                                 to: self.to.clone(),\n  392 |                                 skipped: self.skipped.clone(),\n  393 |                                 is_cleanup: self.is_cleanup,\n  394 |                             };\n  395 |                             return Box::pin(copy_op.run(ctx, progress)).await;\n  396 |                         }\n  397 |                         return Err(err.into());\n  398 |                     }","lines":27,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/operation/recursive.rs#L372-L398"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"Permissions are copied to the destination before the file contents are written (recursive.rs:481-488). If the source file is read-only or has a restrictive mode, `set_permissions` applies that mode to the freshly created destination, then the subsequent `write_at` loop writes into it. On some filesystems/permission setups writing after setting a read-only mode on an open fd may still succeed (the fd was opened writable), but the ordering is fragile, and if the copy is interrupted the partial file is left with the final permissions before content is complete. Setting times/permissions should happen after content is fully written.","fix":"Write file contents first, then apply permissions and timestamps just before closing (as is already done for times at recursive.rs:563-585).","locations":[{"ref":"src/operation/recursive.rs:497-504","code":"  497 |         if let Some(metadata) = metadata.as_ref()\n  498 |             && let Err(why) = to_file.set_permissions(metadata.permissions()).await\n  499 |         {\n  500 |             // This error is not propagated upwards as some filesystems do not support setting permissions\n  501 |             if !matches!(why.kind(), std::io::ErrorKind::Unsupported) {\n  502 |                 tracing::warn!(?why, \"failed to set permissions for {}\", self.to.display(),);\n  503 |             }\n  504 |         }","lines":8,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/operation/recursive.rs#L497-L504"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"The Drop handler reads the destination directory with fs::read_dir to dedupe already-present paths, but on the early-return path (`from.paths.is_empty()`) it returns `commands` directly, bypassing the trailing logic at the end of update() that emits the context-menu close command and the scroll-to-top command. Returning mid-function from a handler in a function that has post-match side effects is fragile and can skip required UI updates.","fix":"Replace the early `return commands;` with breaking out of the dedupe loop / not pushing the DropFiles command, so control falls through to the common tail logic.","locations":[{"ref":"src/tab.rs:4778-4786","code":" 4778 |                         if let Ok(entries) = fs::read_dir(&to) {\n 4779 |                             for i in entries.into_iter().filter_map(Result::ok) {\n 4780 |                                 let i = i.path();\n 4781 |                                 from.paths.retain(|p| &i != p);\n 4782 |                                 if from.paths.is_empty() {\n 4783 |                                     log::info!(\"All dropped files already in target directory.\");\n 4784 |                                     return commands;\n 4785 |                                 }\n 4786 |                             }","lines":9,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/tab.rs#L4778-L4786"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"The applet `FileManager::open` spawns `cosmic-files` and blocks on `child.wait()` inside a synchronous D-Bus method handler. A long-running (daemonized) cosmic-files process would block the zbus method return; combined with the `//TODO: return error?` this means D-Bus callers (ShowFolders/ShowItems/ShowItemProperties) never receive a meaningful error and may stall.","fix":"Do not block on `wait()` inside the interface method; spawn detached (as the main app does via spawn_detached) and return promptly, optionally mapping spawn failures to a D-Bus error.","locations":[{"ref":"cosmic-files-applet/src/file_manager.rs:12-33","code":"   12 |     fn open(&self, uris: &[&str], _startup_id: &str) {\n   13 |         match process::Command::new(\"cosmic-files\").args(uris).spawn() {\n   14 |             Ok(mut child) => {\n   15 |                 log::info!(\"spawned cosmic-files with id {:?}\", child.id());\n   16 |                 match child.wait() {\n   17 |                     Ok(status) => {\n   18 |                         if status.success() {\n   19 |                             log::info!(\"cosmic-files exited with {status}\");\n   20 |                         } else {\n   21 |                             log::warn!(\"failed to run cosmic-files: exited with {status}\");\n   22 |                         }\n   23 |                     }\n   24 |                     Err(err) => {\n   25 |                         log::warn!(\"failed to run cosmic-files: {err}\");\n   26 |                     }\n   27 |                 }\n   28 |             }\n   29 |             Err(err) => {\n   30 |                 log::warn!(\"failed to spawn cosmic-files: {err}\");\n   31 |             }\n   32 |         }\n   33 |     }","lines":22,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/cosmic-files-applet/src/file_manager.rs#L12-L33"}]},
{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"update_notification() unwraps in three places when closing a notify_rust notification: `Arc::try_unwrap(notification_arc).unwrap()` (fails and panics if any other Arc clone still exists), `notification_mutex.into_inner().unwrap()` (panics on poisoned mutex), and `.await.unwrap()` on the spawn_blocking join (panics if the blocking task panicked). The code itself comments `//TODO: this is nasty`. A lingering Arc clone (the Message::Notification still in a queued message) would crash the app on operation completion.","fix":"Handle each fallible step gracefully: on `Arc::try_unwrap` failure, skip closing (or store back); use `into_inner().unwrap_or_else(PoisonError::into_inner)` style recovery; and match on the join result logging errors instead of unwrapping.","locations":[{"ref":"src/app.rs:1871-1882","code":" 1871 |             if let Some(notification_arc) = self.notification_opt.take() {\n 1872 |                 return Task::future(async move {\n 1873 |                     tokio::task::spawn_blocking(move || {\n 1874 |                         //TODO: this is nasty\n 1875 |                         let notification_mutex = Arc::try_unwrap(notification_arc).unwrap();\n 1876 |                         let notification = notification_mutex.into_inner().unwrap();\n 1877 |                         notification.close();\n 1878 |                     })\n 1879 |                     .await\n 1880 |                     .unwrap();\n 1881 |                     cosmic::action::app(Message::MaybeExit)\n 1882 |                 });","lines":12,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/app.rs#L1871-L1882"}]},
{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In Message::Open, update_recently_used's result is discarded with `let _ =`. A failure to record recents is non-fatal, but it is silently swallowed with no log line, unlike the rest of the file which logs warnings on IO failures. Inconsistent and makes recents bugs invisible.","fix":"Match the Result and log::warn! on Err, consistent with other fs error handling in this file.","locations":[{"ref":"src/dialog.rs:1648-1655","code":" 1648 |                             if self.flags.config.show_recents {\n 1649 |                                 let _ = update_recently_used(\n 1650 |                                     path,\n 1651 |                                     Self::APP_ID.to_string(),\n 1652 |                                     \"cosmic-files\".to_string(),\n 1653 |                                     None,\n 1654 |                                 );\n 1655 |                             }","lines":8,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/dialog.rs#L1648-L1655"}]},
{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"is_remote defaults to true when query_filesystem_info fails (line 65 and 496). Treating an unknown filesystem as remote disables local-path optimizations (size_opt, child counting, metadata) in network_scan for any mount whose remote attribute cannot be queried, even when it is in fact a fast local device. This is a conservative choice but can degrade behavior for local mounts that do not report the attribute.","fix":"Consider defaulting to false (local) when the attribute is unavailable, or distinguish 'query failed' from 'attribute absent' before deciding; at minimum document why remote-by-default is intended.","locations":[{"ref":"src/mounter/gvfs.rs:66-74","code":"   66 |             let root = MountExt::root(&mount);\n   67 |             let is_remote = root\n   68 |                 .query_filesystem_info(\n   69 |                     gio::FILE_ATTRIBUTE_FILESYSTEM_REMOTE,\n   70 |                     gio::Cancellable::NONE,\n   71 |                 )\n   72 |                 .ok()\n   73 |                 .map(|info| info.boolean(gio::FILE_ATTRIBUTE_FILESYSTEM_REMOTE))\n   74 |                 .unwrap_or(true); // Default to remote if query fails","lines":9,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/mounter/gvfs.rs#L66-L74"},{"ref":"src/mounter/gvfs.rs:521-527","code":"  521 |                                                     item.is_remote = root\n  522 |                                                         .query_filesystem_info(\n  523 |                                                             gio::FILE_ATTRIBUTE_FILESYSTEM_REMOTE,\n  524 |                                                             gio::Cancellable::NONE,\n  525 |                                                         )\n  526 |                                                         .ok().map(|info| info.boolean(gio::FILE_ATTRIBUTE_FILESYSTEM_REMOTE))\n  527 |                                                         .unwrap_or(true);","lines":7,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/mounter/gvfs.rs#L521-L527"}]},
{"id":"ERR_10","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"dir_info maps gio errors through but Gvfs::dir_info discards them with .and_then(|res| res.ok()), so any GVFS error (permission, not mounted, network failure) is silently turned into None with no logging, making failures hard to diagnose.","fix":"Log the error before discarding it, or propagate a Result so callers can distinguish 'no info' from 'error querying info'.","locations":[{"ref":"src/mounter/gvfs.rs:723-729","code":"  723 |     fn dir_info(&self, uri: &str) -> Option<(String, String, Option<PathBuf>)> {\n  724 |         let (result_tx, mut result_rx) = mpsc::channel(1);\n  725 |         self.command_tx\n  726 |             .send(Cmd::DirInfo(uri.to_string(), result_tx))\n  727 |             .unwrap();\n  728 |         result_rx.blocking_recv().and_then(|res| res.ok())\n  729 |     }","lines":7,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/mounter/gvfs.rs#L723-L729"}]},
{"id":"ERR_11","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `ThumbnailCacher::new`, when the thumbnail subdirectory does not exist the code logs at `error` level with the misleading message 'failed to create directory' BEFORE any creation is attempted, and the `let _: () = log::error!(...)` pattern is odd. The directory creation `fs::create_dir_all(&thumbnail_dir).unwrap_or(())` then silently swallows real failures, so a genuinely un-creatable cache dir produces a spurious error log on success and no error on actual failure (the later rename will fail confusingly).","fix":"Only log on actual creation failure: `if let Err(e) = fs::create_dir_all(&thumbnail_dir) { log::warn!(...) }`, and remove the unconditional preemptive error log and the `let _: ()` binding.","locations":[{"ref":"src/thumbnail_cacher.rs:35-45","code":"   35 |         if !thumbnail_dir.is_dir() {\n   36 |             log::warn!(\n   37 |                 \"{} is not a directory, creating one now\",\n   38 |                 thumbnail_dir.display()\n   39 |             );\n   40 |             let _: () = log::error!(\n   41 |                 \"{} failed to create directory, this error can be expected on first run\",\n   42 |                 thumbnail_dir.display()\n   43 |             );\n   44 |             fs::create_dir_all(&thumbnail_dir).unwrap_or(());\n   45 |         }","lines":11,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/thumbnail_cacher.rs#L35-L45"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"rescan_tab clones the entire `self.mounter_items` map (`self.mounter_items.clone()`) on every tab rescan, even though the clone is only used under `#[cfg(feature = \"gvfs\")]`. On non-gvfs builds this is a pure waste; on gvfs builds it deep-clones all mounter items per rescan (which happens on navigation, notify events, operation completion, etc.).","fix":"Gate the clone behind `#[cfg(feature = \"gvfs\")]`, or collect just the needed mounter paths (`Box<[PathBuf]>`) before spawning the blocking task instead of cloning the whole map.","locations":[{"ref":"src/app.rs:1520-1540","code":" 1520 |         let icon_sizes = self.config.tab.icon_sizes;\n 1521 |         let mounter_items = self.mounter_items.clone();\n 1522 | \n 1523 |         Task::future(async move {\n 1524 |             let location2 = location.clone();\n 1525 |             match tokio::task::spawn_blocking(move || location2.scan(icon_sizes)).await {\n 1526 |                 Ok((parent_item_opt, mut items)) => {\n 1527 |                     #[cfg(feature = \"gvfs\")]\n 1528 |                     {\n 1529 |                         let mounter_paths: Box<[_]> = mounter_items\n 1530 |                             .values()\n 1531 |                             .flatten()\n 1532 |                             .filter_map(MounterItem::path)\n 1533 |                             .collect();\n 1534 |                         if !mounter_paths.is_empty() {\n 1535 |                             for item in &mut items {\n 1536 |                                 item.is_mount_point =\n 1537 |                                     item.path_opt().is_some_and(|p| mounter_paths.contains(p));\n 1538 |                             }\n 1539 |                         }\n 1540 |                     }","lines":21,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/app.rs#L1520-L1540"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"update_config() clones the entire tab config into every tab by routing through `self.update(Message::TabMessage(...))` for each tab, and is invoked on nearly every config change (theme, show-details, sort, show-recents, etc.). Each call also rebuilds the full nav model via update_nav_model(), which re-reads favorites, re-stats every favorite path (`path.is_dir()` syscall per favorite, see update_nav_model 1776), re-sorts all mounter items, and rebuilds the segmented-button model. Triggering this for trivial toggles (e.g. show-details which is even explicitly preserved) is heavy.","fix":"Avoid calling update_nav_model() / per-tab config propagation for config changes that do not affect the nav model or tabs (e.g. only call update_nav_model when favorites/show_recents/mounter items change). Cache `is_dir` results or build nav icons without per-favorite filesystem stats on the hot path.","locations":[{"ref":"src/app.rs:1694-1707","code":" 1694 |     fn update_config(&mut self) -> Task<Message> {\n 1695 |         self.update_nav_model();\n 1696 |         // Tabs are collected first to placate the borrowck\n 1697 |         let tabs: Box<[_]> = self.tab_model.iter().collect();\n 1698 |         // Update main conf and each tab with the new config\n 1699 |         let commands = std::iter::once(cosmic::command::set_theme(self.config.app_theme.theme()))\n 1700 |             .chain(tabs.into_iter().map(|entity| {\n 1701 |                 self.update(Message::TabMessage(\n 1702 |                     Some(entity),\n 1703 |                     tab::Message::Config(self.config.tab),\n 1704 |                 ))\n 1705 |             }));\n 1706 |         Task::batch(commands)\n 1707 |     }","lines":14,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/app.rs#L1694-L1707"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`decode_large_image` always calls `img.into_rgba8()` to materialize the FULL-resolution RGBA buffer first, and only THEN resizes to the (much smaller) target dimensions. For a large source image this allocates the entire full-resolution RGBA buffer (width*height*4 bytes) even when the target is tiny, defeating much of the memory-budget purpose. The full buffer and the resized buffer both exist simultaneously during `imageops::resize`.","fix":"Decode to a scaled buffer where the format allows (e.g. use the decoder's downscale hints / `DynamicImage::resize` on the decoded image is unavoidable, but at minimum drop the full `rgba` buffer reference promptly), or decode then resize via `img.resize(..)` before `into_rgba8()` so the intermediate is the smaller image. Consider format-aware downscaling at decode time to avoid the full-resolution allocation.","locations":[{"ref":"src/large_image.rs:281-313","code":"  281 |                         match reader.decode() {\n  282 |                             Ok(img) => {\n  283 |                                 let rgba = img.into_rgba8();\n  284 |                                 let orig_width = rgba.width();\n  285 |                                 let orig_height = rgba.height();\n  286 | \n  287 |                                 // Resize if target dimensions provided\n  288 |                                 let (final_img, width, height) = if let Some((target_w, target_h)) = target_dimensions {\n  289 |                                     log::info!(\n  290 |                                         \"Resizing {}x{} -> {}x{} for memory optimization: {}\",\n  291 |                                         orig_width, orig_height, target_w, target_h,\n  292 |                                         path.display()\n  293 |                                     );\n  294 | \n  295 |                                     // Use Lanczos3 for high-quality downsampling\n  296 |                                     let resized = image::imageops::resize(\n  297 |                                         &rgba,\n  298 |                                         target_w,\n  299 |                                         target_h,\n  300 |                                         image::imageops::FilterType::Lanczos3,\n  301 |                                     );\n  302 | \n  303 |                                     let resized_w = resized.width();\n  304 |                                     let resized_h = resized.height();\n  305 | \n  306 |                                     log::info!(\n  307 |                                         \"Resize complete: {}x{} image now uses ~{} MB instead of ~{} MB\",\n  308 |                                         resized_w, resized_h,\n  309 |                                         (resized_w as u64 * resized_h as u64 * 4) / MB_TO_BYTES,\n  310 |                                         (orig_width as u64 * orig_height as u64 * 4) / MB_TO_BYTES\n  311 |                                     );\n  312 | \n  313 |                                     (resized, resized_w, resized_h)","lines":33,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/large_image.rs#L281-L313"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"scan_path / item_from_entry perform a blocking fs::read_dir(path).count() for every subdirectory encountered while scanning a directory, to compute children counts. Scanning a directory with many subdirectories thus does an extra full directory read per child (O(total entries across all children)) synchronously, which can be very slow on large trees or network mounts. The adjacent TODO ('calculate children in the background') acknowledges this.","fix":"Defer child-count computation to a background task (as the TODO suggests) or skip it for remote/large directories.","locations":[{"ref":"src/tab.rs:856-867","code":"  856 |     if metadata.is_dir() && !remote {\n  857 |         dir_size = DirSize::Calculating(Controller::default());\n  858 |         //TODO: calculate children in the background (and make it cancellable?)\n  859 |         match fs::read_dir(&path) {\n  860 |             Ok(entries) => {\n  861 |                 children_opt = Some(entries.count());\n  862 |             }\n  863 |             Err(err) => {\n  864 |                 log::warn!(\"failed to read directory {}: {}\", path.display(), err);\n  865 |             }\n  866 |         }\n  867 |     }","lines":12,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/tab.rs#L856-L867"}]},
