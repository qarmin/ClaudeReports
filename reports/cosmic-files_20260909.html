<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"In Message::AddToSidebar the code does `tab.items_opt.as_ref().and_then(|items| items.iter().find(|&i| i.path_opt() == Some(&path))).unwrap().location_opt.as_ref().unwrap()`. The `tab` variable is rebound to the active tab when `in_current_tab` is true, but `path` originates from `selected_paths(entity_opt)` (a possibly different tab). If the rebound tab does not contain `path`, or the matched item has `location_opt == None`, the chained `.unwrap()` calls panic and crash the application. Both unwraps are reachable with normal user interaction (adding a selection to the sidebar while tabs differ, or items without a location).","fix":"Replace the `find(...).unwrap().location_opt.as_ref().unwrap()` chain with proper Option handling, e.g. use `and_then` to look up the item and its `location_opt`, falling back to `Favorite::from_path(path)` when no network location is found instead of unwrapping.","locations":[{"ref":"src/app.rs:2909-2922","code":" 2909 |                         if let Location::Network(uri, _, _) = tab\n 2910 |                             .items_opt\n 2911 |                             .as_ref()\n 2912 |                             .and_then(|items| items.iter().find(|&i| i.path_opt() == Some(&path)))\n 2913 |                             .unwrap()\n 2914 |                             .location_opt\n 2915 |                             .as_ref()\n 2916 |                             .unwrap()\n 2917 |                         {\n 2918 |                             Some((uri.clone(), name, path.clone()))\n 2919 |                         } else {\n 2920 |                             None\n 2921 |                         }\n 2922 |                     });","lines":14,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/app.rs#L2909-L2922"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"Multiple channel sends on the glib worker thread unwrap and will panic the entire GVFS thread if the receiver was dropped (e.g. the requesting UI task was cancelled or the mpsc(1) receiver went away). items_tx.send(...).await.unwrap() (line 439), items_tx.blocking_send(...).unwrap() inside the mount callback (line 564), items_tx.send(...).await.unwrap() (line 580) and result_tx.send(...).await.unwrap() (line 584). A dropped one-shot/mpsc receiver is a normal occurrence (request abandoned), so this is a reachable panic that kills mounting/scanning for the rest of the session.","fix":"Replace .unwrap() with error logging (e.g. if let Err(err) = items_tx.send(...) { log::warn!(...) }) so a dropped receiver does not bring down the worker thread/main loop.","locations":[{"ref":"src/mounter/gvfs.rs:470","code":"  470 |                             items_tx.send(items(&monitor, sizes)).await.unwrap();","lines":1,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/mounter/gvfs.rs#L470"},{"ref":"src/mounter/gvfs.rs:595","code":"  595 |                                         items_tx.blocking_send(network_scan(&uri, sizes)).unwrap();","lines":1,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/mounter/gvfs.rs#L595"},{"ref":"src/mounter/gvfs.rs:611","code":"  611 |                                 items_tx.send(network_scan(&uri, sizes)).await.unwrap();","lines":1,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/mounter/gvfs.rs#L611"},{"ref":"src/mounter/gvfs.rs:615","code":"  615 |                             result_tx.send(dir_info(&uri)).await.unwrap();","lines":1,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/mounter/gvfs.rs#L615"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"DialogPage::ExtractPassword completion does `self.failed_operations.get(&id).unwrap()` and then `match &operation { Operation::Extract { .. } => ..., _ => unreachable!() }`. If the failed operation has already been removed (e.g. dialog races with another action that cleared failed_operations) or is somehow not an Extract operation, this panics. The id comes from a dialog page whose lifetime is independent of failed_operations.","fix":"Use `if let Some((operation, _, _)) = self.failed_operations.get(&id)` and `if let Operation::Extract { .. } = operation` guards, logging a warning and returning instead of unwrap/unreachable.","locations":[{"ref":"src/app.rs:3181-3191","code":" 3181 |                         DialogPage::ExtractPassword { id, password } => {\n 3182 |                             let (operation, _, _err) = self.failed_operations.get(&id).unwrap();\n 3183 |                             let new_op = match &operation {\n 3184 |                                 Operation::Extract { to, paths, .. } => Operation::Extract {\n 3185 |                                     to: to.clone(),\n 3186 |                                     paths: paths.clone(),\n 3187 |                                     password: Some(password),\n 3188 |                                 },\n 3189 |                                 _ => unreachable!(),\n 3190 |                             };\n 3191 |                             tasks.push(self.operation(new_op));","lines":11,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/app.rs#L3181-L3191"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"MounterItem::None match arms call unreachable!() in every accessor (name, uri, is_mounted, icon, path, is_remote). The None variant is constructed nowhere but is public-ish (#[allow(dead_code)]) and is the only variant when the gvfs feature is disabled; any code path holding a None variant and calling these methods panics. With gvfs disabled, MounterItem has only the None variant, so these methods are effectively all-panic.","fix":"Either remove the None variant entirely (and make the enum/methods conditional on the gvfs feature) or have the accessors return a sensible default/Option instead of unreachable!().","locations":[{"ref":"src/mounter/mod.rs:45-101","code":"   45 | #[derive(Clone, Debug)]\n   46 | pub enum MounterItem {\n   47 |     #[cfg(feature = \"gvfs\")]\n   48 |     Gvfs(gvfs::Item),\n   49 |     #[allow(dead_code)]\n   50 |     None,\n   51 | }\n   52 | \n   53 | impl MounterItem {\n   54 |     pub fn name(&self) -> String {\n   55 |         match self {\n   56 |             #[cfg(feature = \"gvfs\")]\n   57 |             Self::Gvfs(item) => item.name(),\n   58 |             Self::None => unreachable!(),\n   59 |         }\n   60 |     }\n   61 | \n   62 |     pub fn uri(&self) -> String {\n   63 |         match self {\n   64 |             #[cfg(feature = \"gvfs\")]\n   65 |             Self::Gvfs(item) => item.uri(),\n   66 |             Self::None => unreachable!(),\n   67 |         }\n   68 |     }\n   69 | \n   70 |     pub fn is_mounted(&self) -> bool {\n   71 |         match self {\n   72 |             #[cfg(feature = \"gvfs\")]\n   73 |             Self::Gvfs(item) => item.is_mounted(),\n   74 |             Self::None => unreachable!(),\n   75 |         }\n   76 |     }\n   77 | \n   78 |     pub fn icon(&self, symbolic: bool) -> Option<widget::icon::Handle> {\n   79 |         match self {\n   80 |             #[cfg(feature = \"gvfs\")]\n   81 |             Self::Gvfs(item) => item.icon(symbolic),\n   82 |             Self::None => unreachable!(),\n   83 |         }\n   84 |     }\n   85 | \n   86 |     pub fn path(&self) -> Option<PathBuf> {\n   87 |         match self {\n   88 |             #[cfg(feature = \"gvfs\")]\n   89 |             Self::Gvfs(item) => item.path(),\n   90 |             Self::None => unreachable!(),\n   91 |         }\n   92 |     }\n   93 | \n   94 |     pub fn is_remote(&self) -> bool {\n   95 |         match self {\n   96 |             #[cfg(feature = \"gvfs\")]\n   97 |             Self::Gvfs(item) => item.is_remote(),\n   98 |             Self::None => unreachable!(),\n   99 |         }\n  100 |     }\n  101 | }","lines":57,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/mounter/mod.rs#L45-L101"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"The thumbnail subscription and tab_complete subscription both call .unwrap() on the JoinHandle result of tokio::task::spawn_blocking. If the blocking closure panics (e.g. an unexpected panic deep in image decoding or ICU/regex code), the JoinError unwrap propagates the panic into the iced runtime task instead of being logged/handled.","fix":"Handle the JoinError (log it and emit a fallback message) instead of unwrapping the spawn_blocking result.","locations":[{"ref":"src/tab.rs:7048-7051","code":" 7048 |                                     })\n 7049 |                                     .await\n 7050 |                                     .unwrap()\n 7051 |                                 };","lines":4,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/tab.rs#L7048-L7051"},{"ref":"src/tab.rs:7048-7051","code":" 7048 |                                     })\n 7049 |                                     .await\n 7050 |                                     .unwrap()\n 7051 |                                 };","lines":4,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/tab.rs#L7048-L7051"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`thumbnailer()` does `THUMBNAILER_CACHE.lock().unwrap()`. If any thread panics while holding this Mutex (e.g. during `reload()` parsing), the lock is poisoned and every subsequent `thumbnailer()` call panics on `unwrap()`, cascading the failure across all thumbnail generation.","fix":"Recover from poisoning, e.g. `.lock().unwrap_or_else(|e| e.into_inner())`, so a single parse panic does not permanently break thumbnailing.","locations":[{"ref":"src/thumbnailer.rs:172","code":"  172 |     let thumbnailer_cache = THUMBNAILER_CACHE.lock().unwrap();","lines":1,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/thumbnailer.rs#L172"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"negligible","difficulty":"medium","description":"Message::TabNext computes `... % len as u16` where `len = self.tab_model.len()`. If `len` were ever 0 this is a divide-by-zero panic. In practice there is always at least one tab (enforced by TabClose closing the window on the last tab), so this is currently unreachable, but the invariant is implicit and the adjacent `.expect(\"should always be at least one tab open\")` relies on the same assumption.","fix":"Guard with `if len == 0 { return Task::none(); }` (or use checked arithmetic) to make the invariant explicit and robust against future refactors.","locations":[{"ref":"src/app.rs:4429-4437","code":" 4429 |             Message::TabNext => {\n 4430 |                 let len = self.tab_model.len();\n 4431 |                 let pos = (self\n 4432 |                     .tab_model\n 4433 |                     .position(self.tab_model.active())\n 4434 |                     .expect(\"should always be at least one tab open\")\n 4435 |                     + 1)\n 4436 |                     // Wraparound to 0 if i + 1 > num of tabs\n 4437 |                     % len as u16;","lines":9,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/app.rs#L4429-L4437"},{"ref":"src/app.rs:4444-4451","code":" 4444 |             Message::TabPrev => {\n 4445 |                 let pos = self\n 4446 |                     .tab_model\n 4447 |                     .position(self.tab_model.active())\n 4448 |                     .expect(\"should always be at least one tab open\")\n 4449 |                     .checked_sub(1)\n 4450 |                     // Subtraction underflow => last tab; i.e. it wraps around\n 4451 |                     .unwrap_or_else(|| (self.tab_model.len() as u16).saturating_sub(1));","lines":8,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/app.rs#L4444-L4451"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"negligible","difficulty":"medium","description":"`State::default()` and `Config`/`DesktopConfig`/`ThumbCfg`/`IconSizes` defaults use `100.try_into().unwrap()` / `4.try_into().unwrap()` etc. on `NonZeroU16`. These are correct today (all literals are non-zero), but they are panic points that depend on the literals staying non-zero; a future edit to `0` would compile and panic at startup.","fix":"Use `NonZeroU16::new(N).unwrap()` in a const context or `const { NonZeroU16::new(N).unwrap() }` so the non-zero invariant is checked at compile time rather than panicking at runtime.","locations":[{"ref":"src/config.rs:292-297","code":"  292 |             grid_spacing: 100.try_into().unwrap(),\n  293 |             icon_size: 100.try_into().unwrap(),\n  294 |             show_content: true,\n  295 |             show_mounted_drives: false,\n  296 |             show_trash: false,\n  297 |         }","lines":6,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/config.rs#L292-L297"},{"ref":"src/config.rs:344-346","code":"  344 |             jobs: 4.try_into().unwrap(),\n  345 |             max_mem_mb: 2000.try_into().unwrap(),\n  346 |             max_size_mb: 64.try_into().unwrap(),","lines":3,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/config.rs#L344-L346"},{"ref":"src/config.rs:398-399","code":"  398 |             list: 100.try_into().unwrap(),\n  399 |             grid: 100.try_into().unwrap(),","lines":2,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/config.rs#L398-L399"}]},
{"id":"RACE_1","type":"race_condition","type_label":"Race Condition","severity":"medium","difficulty":"medium","description":"MounterItem::Gvfs stores a positional index into monitor.mounts()/monitor.volumes() captured at items()/Rescan time. Mount, Unmount and the mount-success path all re-enumerate the live monitor and match by `i == item.index`. Between the snapshot and the command, volumes/mounts can be added or removed, so the index can refer to a different device. There is a name-equality guard that prevents acting on the wrong device, but when the index now points to a differently-named entry the operation is silently skipped (the loop just `continue`s/`break`s with no action and no user feedback), so a mount/unmount can silently fail after the device list shifts.","fix":"Match volumes/mounts by a stable identifier (e.g. volume/mount uri, GVolume identifier, or name) instead of, or in addition to, the enumeration index, and report an error back through the result channel when no matching device is found.","locations":[{"ref":"src/mounter/gvfs.rs:357","code":"  357 |     is_mounted: bool,","lines":1,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/mounter/gvfs.rs#L357"},{"ref":"src/mounter/gvfs.rs:488-497","code":"  488 |                             for (i, volume) in monitor.volumes().into_iter().enumerate() {\n  489 |                                 if i != item.index {\n  490 |                                     continue;\n  491 |                                 }\n  492 | \n  493 |                                 let name = VolumeExt::name(&volume);\n  494 |                                 if item.name != name {\n  495 |                                     log::warn!(\"trying to mount volume {} failed: name is {:?} when {:?} was expected\", i, name, item.name);\n  496 |                                     continue;\n  497 |                                 }","lines":10,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/mounter/gvfs.rs#L488-L497"},{"ref":"src/mounter/gvfs.rs:620-629","code":"  620 |                             for (i, mount) in monitor.mounts().into_iter().enumerate() {\n  621 |                                 if i != item.index {\n  622 |                                     continue;\n  623 |                                 }\n  624 | \n  625 |                                 let name = MountExt::name(&mount);\n  626 |                                 if item.name != name {\n  627 |                                     log::warn!(\"trying to unmount mount {} failed: name is {:?} when {:?} was expected\", i, name, item.name);\n  628 |                                     continue;\n  629 |                                 }","lines":10,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/mounter/gvfs.rs#L620-L629"}]},
{"id":"RACE_2","type":"race_condition","type_label":"Race Condition","severity":"medium","difficulty":"medium","description":"TOCTOU between conflict detection and the actual write. Destination existence is checked with `is_file()` (recursive.rs:362/412/445) and conflicts are pre-counted at recursive.rs:185-193, but the user dialog and the eventual write happen later. Copy mitigates this with `create_new(true)` (recursive.rs:467-471, atomic) and move uses `hard_link` (atomic) — good — but the symlink branch uses `std::os::unix::fs::symlink`/`symlink_file` which is NOT create-exclusive: between the `is_file()` check / dialog and the symlink call, another process could create the path, and the symlink call would then fail or (after a Replace remove_file) a new file could appear and be clobbered. The pre-counted `remaining_conflicts` can also be stale by the time each op runs.","fix":"Create symlinks atomically (e.g. symlink to a temp name then atomic rename, or use symlinkat with appropriate handling) and treat the existence checks as advisory, relying on atomic create semantics for correctness.","locations":[{"ref":"src/operation/recursive.rs:410-433","code":"  410 |             OpKind::Symlink { ref target } => {\n  411 |                 // Remove `to` if overwriting and it is an existing file\n  412 |                 if self.to.is_file() {\n  413 |                     match ctx.replace(self).await? {\n  414 |                         ControlFlow::Continue(to) => {\n  415 |                             self.to = to;\n  416 |                         }\n  417 |                         ControlFlow::Break(ret) => {\n  418 |                             return Ok(ret);\n  419 |                         }\n  420 |                     }\n  421 |                 }\n  422 |                 #[cfg(unix)]\n  423 |                 {\n  424 |                     std::os::unix::fs::symlink(target, &self.to)?;\n  425 |                 }\n  426 |                 #[cfg(windows)]\n  427 |                 {\n  428 |                     if target.is_dir() {\n  429 |                         std::os::windows::fs::symlink_dir(target, &self.to)?;\n  430 |                     } else {\n  431 |                         std::os::windows::fs::symlink_file(target, &self.to)?;\n  432 |                     }\n  433 |                 }","lines":24,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/operation/recursive.rs#L410-L433"}]},
{"id":"RACE_3","type":"race_condition","type_label":"Race Condition","severity":"low","difficulty":"medium","description":"`copy_unique_path` performs a check-then-use loop: it pushes a candidate name, tests `to.try_exists()`, and breaks if it does not exist (mod.rs:287-304). Between this check and the eventual create at the destination, another process (or another concurrent op in the same batch) may create that path, so the generated 'unique' name may collide. The copy/move final write uses `create_new(true)`/`hard_link` (atomic) so data is not clobbered, but the operation will then fail rather than picking the next free name.","fix":"Treat the generated name as a best-effort hint and retry name generation on EEXIST from the atomic create, rather than assuming the chosen name remains free.","locations":[{"ref":"src/operation/mod.rs:287-305","code":"  287 |         for n in 0.. {\n  288 |             let new_name = if n == 0 {\n  289 |                 file_name.to_string()\n  290 |             } else {\n  291 |                 match ext {\n  292 |                     Some(ref ext) => format!(\"{} ({} {}).{}\", stem, fl!(\"copy_noun\"), n, ext),\n  293 |                     None => format!(\"{} ({} {})\", stem, fl!(\"copy_noun\"), n),\n  294 |                 }\n  295 |             };\n  296 | \n  297 |             to.push(&new_name);\n  298 | \n  299 |             if !matches!(to.try_exists(), Ok(true)) {\n  300 |                 break;\n  301 |             }\n  302 |             // Continue if a copy with index exists\n  303 |             to.pop();\n  304 |         }\n  305 |     }","lines":19,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/operation/mod.rs#L287-L305"}]},
{"id":"RES_1","type":"resource_leak","type_label":"Resource Leak","severity":"low","difficulty":"medium","description":"In the success path of `copy`, `from_file` is never explicitly closed: only `to_file.close().await` is called (recursive.rs:587). On error paths both files are closed (e.g. recursive.rs:509, 532, 553), but on the normal completion path `from_file` is dropped without an explicit async close. With compio/io_uring, dropping a file without awaiting close can lead to a synchronous/blocking close or a deferred close that is not awaited; at minimum it is asymmetric with the error paths.","fix":"Explicitly `from_file.close().await` alongside `to_file.close().await` on the success path.","locations":[{"ref":"src/operation/recursive.rs:577-605","code":"  577 |         ctx.buf = buf_in;\n  578 | \n  579 |         if let Some(metadata) = metadata.as_ref() {\n  580 |             let mut times = fs::FileTimes::new();\n  581 |             if let Ok(time) = metadata.modified() {\n  582 |                 times = times.set_modified(time);\n  583 |             }\n  584 |             if let Ok(time) = metadata.accessed() {\n  585 |                 times = times.set_accessed(time);\n  586 |             }\n  587 |             //TODO: upstream set_times implementation to compio?\n  588 |             let op = AsyncifyFd::new(to_file.to_shared_fd(), move |file: &std::fs::File| {\n  589 |                 BufResult(file.set_times(times).map(|_| 0), ())\n  590 |             });\n  591 |             match compio::runtime::submit(op).await.0.map(|_| ()) {\n  592 |                 Ok(()) => {\n  593 |                     tracing::info!(\"set times for {} to {:?}\", self.to.display(), times);\n  594 |                 }\n  595 |                 Err(why) => {\n  596 |                     if !matches!(why.kind(), std::io::ErrorKind::Unsupported) {\n  597 |                         tracing::error!(?why, \"failed to set times for {}\", self.to.display());\n  598 |                     }\n  599 |                 }\n  600 |             }\n  601 |         }\n  602 | \n  603 |         _ = to_file.close().await;\n  604 | \n  605 |         Ok(true)","lines":29,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/operation/recursive.rs#L577-L605"}]},
{"id":"RES_2","type":"resource_leak","type_label":"Resource Leak","severity":"low","difficulty":"medium","description":"`update_with_image` creates a NamedTempFile via `tempfile_in`, then immediately opens a SECOND handle to the same path with `File::create(temp_file.path())` and writes the PNG through that handle. The NamedTempFile's own file handle is left open and unused; the PNG is written through the separately-created handle. While the temp file is still cleaned up on drop, this opens two handles to the same path and writes through the wrong one, relying on path-based reopen. It is fragile and wastes a descriptor.","fix":"Write through the NamedTempFile's own handle (e.g. `temp_file.as_file()` / `reopen`) instead of `File::create(temp_file.path())`, avoiding a redundant second descriptor and the reopen-by-path race.","locations":[{"ref":"src/thumbnail_cacher.rs:104-122","code":"  104 |         let temp_file = tempfile::Builder::new()\n  105 |             .prefix(\"cosmic-files-\")\n  106 |             .tempfile_in(&self.thumbnail_dir)?;\n  107 |         {\n  108 |             let file = File::create(temp_file.path())?;\n  109 |             let image = image\n  110 |                 .thumbnail(\n  111 |                     self.thumbnail_size.pixel_size(),\n  112 |                     self.thumbnail_size.pixel_size(),\n  113 |                 )\n  114 |                 .into_rgba8();\n  115 |             let writer = BufWriter::new(file);\n  116 |             let mut encoder = png::Encoder::new(writer, image.width(), image.height());\n  117 |             encoder.set_color(png::ColorType::Rgba);\n  118 |             encoder.set_depth(png::BitDepth::Eight);\n  119 |             encoder\n  120 |                 .write_header()?\n  121 |                 .write_image_data(&image.into_raw())?;\n  122 |         }","lines":19,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/thumbnail_cacher.rs#L104-L122"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"`should_use_dedicated_worker` computes `total_budget_mb / parallel_workers as u64` without guarding against `parallel_workers == 0`. A zero worker count (e.g. a misconfigured pool or `available_parallelism` returning a low value that gets decremented elsewhere) causes an integer divide-by-zero panic. The function already validates `width`/`height` but not the divisor it controls.","fix":"Guard the divisor: `let per_worker_budget_mb = total_budget_mb / parallel_workers.max(1) as u64;` or early-return the dedicated-worker path when `parallel_workers == 0`.","locations":[{"ref":"src/large_image.rs:132","code":"  132 |     let per_worker_budget_mb = total_budget_mb / parallel_workers as u64;","lines":1,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/large_image.rs#L132"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`zip_extract` allocates `Vec::with_capacity(file.size() as usize)` for a symlink target buffer using the archive-declared `file.size()`. A malicious zip can declare a huge size for a symlink entry, causing a large speculative allocation before any data is read (a mini decompression/allocation bomb). Regular files avoid this by streaming into a fixed 4 MB buffer, but the symlink branch trusts the declared size.","fix":"Cap the symlink target pre-allocation (symlink targets are bounded, e.g. PATH_MAX); use `Vec::with_capacity(file.size().min(4096) as usize)` or just `Vec::new()` and let `read_to_end` grow it.","locations":[{"ref":"src/archive.rs:192","code":"  192 |             let mut target = Vec::with_capacity(file.size() as usize);","lines":1,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/archive.rs#L192"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`calculate_target_dimensions` casts `display_width as f32 * DISPLAY_SCALE_FACTOR` to `u32`. If the display dimensions are pathologically large (close to u32::MAX) the multiply can exceed f32's exact-integer range and the `as u32` cast saturates, but more importantly a `display_height` of 0 makes `target_aspect = target_width / 0.0 = inf`, and `target_height` 0 makes the `else` branch compute `h = 0` then `.max(1)` recovers width only via aspect. The zero-display-size path produces target (target_width, 1)-ish dimensions silently rather than returning None. Low impact because display sizes are realistically bounded, but the function has no explicit zero/early guard.","fix":"Early-return `None` when `display_width == 0 || display_height == 0`, and clamp/validate before computing aspect ratios.","locations":[{"ref":"src/large_image.rs:47-68","code":"   47 |     let target_width = (display_width as f32 * DISPLAY_SCALE_FACTOR) as u32;\n   48 |     let target_height = (display_height as f32 * DISPLAY_SCALE_FACTOR) as u32;\n   49 | \n   50 |     if image_width <= target_width && image_height <= target_height {\n   51 |         return None;\n   52 |     }\n   53 | \n   54 |     let image_aspect = image_width as f32 / image_height as f32;\n   55 |     let target_aspect = target_width as f32 / target_height as f32;\n   56 | \n   57 |     let (new_width, new_height) = if image_aspect > target_aspect {\n   58 |         let w = target_width;\n   59 |         let h = (target_width as f32 / image_aspect) as u32;\n   60 |         (w, h)\n   61 |     } else {\n   62 |         let h = target_height;\n   63 |         let w = (target_height as f32 * image_aspect) as u32;\n   64 |         (w, h)\n   65 |     };\n   66 | \n   67 |     let new_width = new_width.max(1);\n   68 |     let new_height = new_height.max(1);","lines":22,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/large_image.rs#L47-L68"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`check_ram_available` computes `available_bytes = available_kb * 1024` without overflow protection. `mem_available` is a u64 of KB; on a machine with an absurd reported value this would wrap, but realistically KB*1024 cannot overflow u64 for any real system. Negligible-to-low: defensive `saturating_mul` would be cleaner and matches the `saturating_sub` used two lines below.","fix":"Use `available_kb.saturating_mul(1024)` for consistency with the surrounding saturating arithmetic.","locations":[{"ref":"src/large_image.rs:210-211","code":"  210 |             let available_kb = meminfo.mem_available.unwrap_or(0);\n  211 |             let available_bytes = available_kb * 1024;","lines":2,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/large_image.rs#L210-L211"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"Progress is computed as `current as f32 / total as f32` / op-count divisions in several places (e.g. mod.rs:181-187, mod.rs:717/752/819-822, mod.rs:859/891/935/983/1068/1137, reader.rs:41). f32 has only ~24 bits of mantissa, so byte counters above ~16 MiB lose precision and very large files (multi-GiB) yield coarse/inaccurate progress. More importantly, in OpReader (reader.rs:41) the divisor `self.metadata.len()` is the file size captured at open time; for a zero-length file this divides by zero producing NaN/inf progress that is then stored. The on_progress total-ops divisor in mod.rs:187 assumes `total_ops > 0`.","fix":"Guard zero-length / zero-op divisors (return 1.0 when total is 0, as is already done at mod.rs:177-179 for total_bytes), and consider computing progress ratios in f64 or as integer fractions to preserve precision on large files.","locations":[{"ref":"src/operation/reader.rs:41-42","code":"   41 |         let progress = self.current as f32 / self.metadata.len() as f32;\n   42 |         self.controller.set_progress(progress);","lines":2,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/operation/reader.rs#L41-L42"},{"ref":"src/operation/mod.rs:176-188","code":"  176 |                 let item_progress = match progress.total_bytes {\n  177 |                     Some(total_bytes) => {\n  178 |                         if total_bytes == 0 {\n  179 |                             1.0\n  180 |                         } else {\n  181 |                             progress.current_bytes as f32 / total_bytes as f32\n  182 |                         }\n  183 |                     }\n  184 |                     None => 0.0,\n  185 |                 };\n  186 |                 let total_progress =\n  187 |                     (item_progress + progress.current_ops as f32) / progress.total_ops as f32;\n  188 |                 controller.set_progress(total_progress);","lines":13,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/operation/mod.rs#L176-L188"}]},
{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"medium","description":"AutoScroll converts scroll_speed_float * 10.0 to i16 via `as i16`. If the f32 scroll speed ever exceeds 3276.7 (or is NaN/inf) the cast saturates/produces 0 silently. Comment acknowledges the lossy conversion. Realistic auto-scroll deltas are small so impact is negligible, but the unchecked cast is a latent footgun.","fix":"Use `.clamp()` before casting, or `num_traits`/`as` with an explicit range check; not strictly necessary given expected value range.","locations":[{"ref":"src/dialog.rs:1885-1893","code":" 1885 |                         tab::Command::AutoScroll(scroll_speed) => {\n 1886 |                             // converting an f32 to an i16 here by multiplying by 10 and casting to i16\n 1887 |                             // further resolution isn't necessary\n 1888 |                             if let Some(scroll_speed_float) = scroll_speed {\n 1889 |                                 self.auto_scroll_speed = Some((scroll_speed_float * 10.0) as i16);\n 1890 |                             } else {\n 1891 |                                 self.auto_scroll_speed = None;\n 1892 |                             }\n 1893 |                         }","lines":9,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/dialog.rs#L1885-L1893"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"zip symlink extraction on unix writes the symlink target verbatim from the archive (`OsString::from_vec(target)`) and creates the symlink with no validation that the target stays within the extraction directory. While the symlink FILE is placed at an `enclosed_name`-validated `outpath`, its TARGET is attacker-controlled and may be an absolute path or `../../etc/...`. A subsequent extracted entry whose path resolves THROUGH this symlink can then write outside the destination directory (classic symlink-based zip-slip). The tar path delegates to tar's `unpack` which has its own guarding, but the zip symlink path here is hand-rolled and unguarded.","fix":"Before creating symlinks, defer them and/or validate that resolving each later file path does not traverse a just-created symlink outside `directory`; or refuse symlinks whose target escapes the extraction root. At minimum, extract all regular files first and create symlinks last with target containment checks (the windows branch already resolves the target into the destination via join, but the unix branch writes the raw target).","locations":[{"ref":"src/archive.rs:191-231","code":"  191 |         if file.is_symlink() && (cfg!(unix) || cfg!(windows)) {\n  192 |             let mut target = Vec::with_capacity(file.size() as usize);\n  193 |             file.read_to_end(&mut target)?;\n  194 |             // File no longer needed, drop to allow reading target on windows\n  195 |             drop(file);\n  196 | \n  197 |             #[cfg(unix)]\n  198 |             {\n  199 |                 use std::os::unix::ffi::OsStringExt;\n  200 |                 let target = OsString::from_vec(target);\n  201 |                 std::os::unix::fs::symlink(&target, outpath.as_path())?;\n  202 |             }\n  203 |             #[cfg(windows)]\n  204 |             {\n  205 |                 let Ok(target) = String::from_utf8(target) else {\n  206 |                     return Err(ZipError::InvalidArchive(\n  207 |                         \"Invalid UTF-8 as symlink target\".into(),\n  208 |                     ));\n  209 |                 };\n  210 |                 let target_is_dir_from_archive = match password {\n  211 |                     None => archive.by_name(&target),\n  212 |                     Some(pwd) => archive.by_name_decrypt(&target, pwd.as_bytes()),\n  213 |                 }\n  214 |                 .map_or(false, |x| x.is_dir());\n  215 |                 let target_path = directory.as_ref().join(OsString::from(target.to_string()));\n  216 |                 let target_is_dir = if target_is_dir_from_archive {\n  217 |                     true\n  218 |                 } else if let Ok(meta) = std::fs::metadata(&target_path) {\n  219 |                     meta.is_dir()\n  220 |                 } else {\n  221 |                     false\n  222 |                 };\n  223 |                 if target_is_dir {\n  224 |                     std::os::windows::fs::symlink_dir(target_path, outpath.as_path())?;\n  225 |                 } else {\n  226 |                     std::os::windows::fs::symlink_file(target_path, outpath.as_path())?;\n  227 |                 }\n  228 |             }\n  229 | \n  230 |             written_files.push(outpath);\n  231 |             continue;","lines":41,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/archive.rs#L191-L231"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`Controller::unpause` uses a logical OR on two mutually-exclusive predicates: `if !self.is_cancelled() | !self.is_failed()`. Because the controller holds a single state value, at most one of `is_cancelled()`/`is_failed()` can be true at a time, so at least one of the negated terms is always true and the condition is effectively always true. This means a Cancelled or Failed operation will be forcibly reset to Running by `unpause()`. It also uses bitwise `|` instead of `||`. The intent was clearly `if !self.is_cancelled() && !self.is_failed()` (only resume to Running when neither cancelled nor failed). Resuming a cancelled/failed file operation can cause it to keep mutating user files after the user asked to stop.","fix":"Change to `if !self.is_cancelled() && !self.is_failed() { self.set_state(ControllerState::Running); }`.","locations":[{"ref":"src/operation/controller.rs:127-131","code":"  127 |     pub fn unpause(&self) {\n  128 |         if !self.is_cancelled() | !self.is_failed() {\n  129 |             self.set_state(ControllerState::Running);\n  130 |         }\n  131 |     }","lines":5,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/operation/controller.rs#L127-L131"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In the Move fast path, existing destinations are silently skipped without any Replace prompt and the source is left untouched. `copy_or_move` builds move pairs and, for each, `if to.exists() { return Some((from, to)); }` (mod.rs:139-141) defers to the recursive mover instead of attempting a rename. The recursive mover then hard-links `from` to `to`; but for the top-level item, when `to` is a directory that already exists, the WalkDir of `from` produces a Mkdir op whose `to` is the existing dir (handled by create_dir_all, fine), yet file children that already exist at the destination go through the `is_file()` replace gate. The net effect: the TODO at mod.rs:138 (\"show replace dialog here?\") means a top-level move onto an existing path of a different type may neither prompt nor move, leaving the user believing the move happened. The behavior of move-onto-existing is inconsistent with copy and not surfaced to the user.","fix":"Route move-onto-existing destinations through the same replace/conflict resolution used by copy (handle_replace), rather than blindly deferring to the recursive path which only resolves file conflicts.","locations":[{"ref":"src/operation/mod.rs:135-169","code":"  135 |         let from_to_pairs: Vec<(PathBuf, PathBuf)> = if matches!(method, Method::Move { .. }) {\n  136 |             from_to_pairs_iter\n  137 |                 .map(|(from, to)| async move {\n  138 |                     //TODO: show replace dialog here?\n  139 |                     if to.exists() {\n  140 |                         return Some((from, to));\n  141 |                     }\n  142 | \n  143 |                     match compio::fs::rename(&from, &to).await {\n  144 |                         Ok(()) => {\n  145 |                             log::info!(\"renamed {} to {}\", from.display(), to.display());\n  146 |                             None\n  147 |                         }\n  148 |                         Err(err) => {\n  149 |                             log::info!(\n  150 |                                 \"failed to rename {} to {}, fallback to recursive move: {}\",\n  151 |                                 from.display(),\n  152 |                                 to.display(),\n  153 |                                 err\n  154 |                             );\n  155 |                             Some((from, to))\n  156 |                         }\n  157 |                     }\n  158 |                 })\n  159 |                 .collect::<cosmic::iced::futures::stream::FuturesOrdered<_>>()\n  160 |                 .fold(Vec::new(), |mut pairs, pair| async move {\n  161 |                     if let Some(pair) = pair {\n  162 |                         pairs.push(pair);\n  163 |                     }\n  164 |                     pairs\n  165 |                 })\n  166 |                 .await\n  167 |         } else {\n  168 |             from_to_pairs_iter.collect()\n  169 |         };","lines":35,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/operation/mod.rs#L135-L169"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"Overwrite/conflict detection only treats the destination as a conflict when it is a regular file (`op.to.is_file()`). This is used for the conflict count (recursive.rs:191) and for the replace gate in copy (recursive.rs:445), move (recursive.rs:362), and symlink (recursive.rs:411-412). `Path::is_file()` follows symlinks and returns false for directories, symlinks-to-directories, FIFOs, sockets, device nodes, and broken symlinks. Consequences: (1) if `to` is an existing directory or special file, no Replace dialog is shown and the subsequent `create_new(true)`/`hard_link`/`symlink` call fails with an opaque error instead of prompting the user; (2) `is_file()` follows the link, so when `to` is itself a symlink the check inspects the link target, not the link — an existing symlink at the destination may be silently overwritten or cause a confusing failure. Destination existence should be checked with `symlink_metadata`/`try_exists` (not following links) so all existing entries are detected as conflicts.","fix":"Detect destination existence with `op.to.symlink_metadata().is_ok()` (or `fs::symlink_metadata`), not `is_file()`, so directories, symlinks, and special files at the destination also trigger the replace flow and are correctly counted/handled.","locations":[{"ref":"src/operation/recursive.rs:185-193","code":"  185 |         self.remaining_conflicts = ops\n  186 |             .iter()\n  187 |             .filter(|op| {\n  188 |                 matches!(\n  189 |                     op.kind,\n  190 |                     OpKind::Copy | OpKind::Move { .. } | OpKind::Symlink { .. }\n  191 |                 ) && op.to.is_file()\n  192 |             })\n  193 |             .count();","lines":9,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/operation/recursive.rs#L185-L193"},{"ref":"src/operation/recursive.rs:362","code":"  362 |                 if self.to.is_file() {","lines":1,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/operation/recursive.rs#L362"},{"ref":"src/operation/recursive.rs:412","code":"  412 |                 if self.to.is_file() {","lines":1,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/operation/recursive.rs#L412"},{"ref":"src/operation/recursive.rs:445","code":"  445 |         if self.to.is_file() {","lines":1,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/operation/recursive.rs#L445"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"When the user chooses Replace, `replace()` unconditionally calls `compio::fs::remove_file(&op.to)` (recursive.rs:268). If the destination conflict is a directory or a symlink-to-directory, `remove_file` fails (EISDIR/EPERM) and the whole operation aborts; the existing destination directory is left and the copy/move never completes. Combined with the `is_file()` gate above, replacing a directory with a file (or vice versa) is not handled. Even when the gate is fixed to detect directories, `remove_file` alone cannot remove a directory destination.","fix":"Before removing, stat the destination (without following links): use `remove_file` for files/symlinks and `remove_dir_all` for directories, or explicitly disallow replacing a directory with a non-directory and surface a clear error/dialog.","locations":[{"ref":"src/operation/recursive.rs:263-270","code":"  263 |         match replace_result {\n  264 |             ReplaceResult::Replace(apply_to_all) => {\n  265 |                 if apply_to_all {\n  266 |                     self.replace_result_opt = Some(replace_result);\n  267 |                 }\n  268 |                 compio::fs::remove_file(&op.to).await?;\n  269 |                 Ok(ControlFlow::Continue(op.to.clone()))\n  270 |             }","lines":8,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/operation/recursive.rs#L263-L270"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"Incremental search insertion assumes the items vector is sorted ascending by modified time, but search results are displayed sorted descending by modified time (sort_options() returns (Modified, false) for Search, and column_sort reverses the comparison). binary_search_by(|other| item_modified.cmp(&other.metadata.modified())) is therefore run against a descending-ordered slice, so the returned insertion index is essentially arbitrary. New search results are inserted at incorrect positions and the final on-screen order does not match the documented sort. The code's own TODO at line 4251 acknowledges this must match column_sort but it does not.","fix":"Match the descending order used by column_sort: invert the comparison to `other.metadata.modified().cmp(&item_modified)` (or sort/insert via the same key column_sort uses), so binary_search operates on the actual displayed ordering.","locations":[{"ref":"src/tab.rs:4567-4586","code":" 4567 |                                 //TODO: combine this with column_sort logic, they must match!\n 4568 |                                 let index =\n 4569 |                                     if let SearchItem::Path(_, _, ref metadata) = search_item {\n 4570 |                                         let item_modified = metadata.modified().ok();\n 4571 |                                         match items.binary_search_by(|other| {\n 4572 |                                             item_modified.cmp(&other.metadata.modified())\n 4573 |                                         }) {\n 4574 |                                             Ok(index) => index,\n 4575 |                                             Err(index) => index,\n 4576 |                                         }\n 4577 |                                     } else {\n 4578 |                                         items.len()\n 4579 |                                     };\n 4580 | \n 4581 |                                 if index < MAX_SEARCH_RESULTS {\n 4582 |                                     //TODO: use correct IconSizes\n 4583 |                                     let item =\n 4584 |                                         item_from_search_item(search_item, IconSizes::default());\n 4585 |                                     items.insert(index, item);\n 4586 |                                 }","lines":20,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/tab.rs#L4567-L4586"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Message::Copy and Message::Cut iterate `self.selected_paths(entity_opt)` twice: once to build `self.clipboard_cache` and again to build the `ClipboardCopy` written to the system clipboard. Because the iterator is lazily recomputed against current tab state, the two snapshots can diverge if selection changes between them (unlikely within one synchronous call, but the double traversal also re-walks all selected items and re-clones every PathBuf needlessly). More importantly it is fragile duplicated logic that can silently get out of sync.","fix":"Collect the selected paths once into a `Vec<PathBuf>`, then build both the cache (`ClipboardPaste { paths: paths.clone(), .. }`) and `ClipboardCopy::new(kind, paths.iter().cloned())` from that single snapshot.","locations":[{"ref":"src/app.rs:2979-2986","code":" 2979 |                 let paths = self.selected_paths(entity_opt);\n 2980 |                 self.clipboard_cache = ClipboardCache::Files(ClipboardPaste {\n 2981 |                     paths: paths.map(|p| p.to_path_buf()).collect(),\n 2982 |                     kind: ClipboardKind::Copy,\n 2983 |                 });\n 2984 |                 let contents =\n 2985 |                     ClipboardCopy::new(ClipboardKind::Copy, self.selected_paths(entity_opt));\n 2986 |                 return clipboard::write_data(contents);","lines":8,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/app.rs#L2979-L2986"},{"ref":"src/app.rs:3025-3035","code":" 3025 |                 let paths = self.selected_paths(entity_opt);\n 3026 |                 self.clipboard_cache = ClipboardCache::Files(ClipboardPaste {\n 3027 |                     paths: paths.map(|p| p.to_path_buf()).collect(),\n 3028 |                     kind: ClipboardKind::Cut { is_dnd: false },\n 3029 |                 });\n 3030 |                 let contents = ClipboardCopy::new(\n 3031 |                     ClipboardKind::Cut { is_dnd: false },\n 3032 |                     self.selected_paths(entity_opt),\n 3033 |                 );\n 3034 | \n 3035 |                 return clipboard::write_data(contents);","lines":11,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/app.rs#L3025-L3035"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"When building the `text/plain` clipboard representation, path strings are joined with CRLF but no escaping or sanitization is performed (the `//TODO: what if the path contains CR or NL?` even acknowledges this). A filename containing a newline produces a text/plain payload that, when parsed back as a line-delimited list, splits into multiple bogus paths. Filenames may legally contain newlines on Unix.","fix":"Either document that text/plain is best-effort display only, or filter/escape control characters (CR/LF) out of path strings before joining. Paste parsing should rely on uri-list / gnome-copied-files, not text/plain, which it already does.","locations":[{"ref":"src/clipboard.rs:51-52","code":"   51 |                     //TODO: what if the path contains CR or NL?\n   52 |                     text_plain.push_str(path_str);","lines":2,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/clipboard.rs#L51-L52"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"DialogLabel::from treats an escaped underscore incorrectly. An input '_' sets next_underline=true so the following char is underlined and consumed as the accelerator key. To render a literal underscore the convention would be '__', but the code path `if c == '_' && !underline` means the second '_' (with underline==true) is pushed as an underlined span and ALSO becomes the alt key bind, rather than producing a literal non-underlined '_'. There is no way to emit a literal underscore, and a label that legitimately contains an underscore (e.g. a filename-derived accept label) silently turns the next character into an Alt accelerator.","fix":"Handle '__' as an escape for a literal underscore: when c=='_' and underline is true (previous was an escape marker), push a literal '_' span with underline=false and do not set a key bind.","locations":[{"ref":"src/dialog.rs:154-181","code":"  154 |         for c in text.as_ref().chars() {\n  155 |             let underline = next_underline;\n  156 |             next_underline = false;\n  157 | \n  158 |             if c == '_' && !underline {\n  159 |                 next_underline = true;\n  160 |                 continue;\n  161 |             }\n  162 | \n  163 |             if underline && key_bind_opt.is_none() {\n  164 |                 key_bind_opt = Some(KeyBind {\n  165 |                     modifiers: vec![Modifier::Alt],\n  166 |                     key: Key::Character(c.to_lowercase().to_string().into()),\n  167 |                 });\n  168 |             }\n  169 | \n  170 |             if let Some(span) = spans.last_mut()\n  171 |                 && underline == span.underline\n  172 |             {\n  173 |                 span.text.push(c);\n  174 |                 continue;\n  175 |             }\n  176 | \n  177 |             spans.push(DialogLabelSpan {\n  178 |                 text: String::from(c),\n  179 |                 underline,\n  180 |             });\n  181 |         }","lines":28,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/dialog.rs#L154-L181"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Command-line argument parsing treats any arg that `url::Url::parse` accepts with a non-file scheme as a remote URI. A relative path or filename that happens to contain a colon (e.g. `foo:bar`, a valid Unix filename) parses as a URL with scheme `foo` and is pushed onto `uris` instead of being canonicalized as a local path. Windows drive paths like `C:\\dir` similarly parse as scheme `c`.","fix":"Before attempting URL parsing, check whether the argument refers to an existing path on disk (or starts with `/`, `./`, `../`, `~`), and only fall back to URL parsing for args that are clearly URIs (contain `://` or a recognized scheme).","locations":[{"ref":"src/lib.rs:172-182","code":"  172 |             let path = match url::Url::parse(&arg) {\n  173 |                 Ok(url) if url.scheme() == \"file\" => if let Ok(path) = url.to_file_path() { path } else {\n  174 |                     log::warn!(\"invalid argument {arg:?}\");\n  175 |                     continue;\n  176 |                 },\n  177 |                 Ok(url) => {\n  178 |                     uris.push(url);\n  179 |                     continue;\n  180 |                 }\n  181 |                 _ => PathBuf::from(arg),\n  182 |             };","lines":11,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/lib.rs#L172-L182"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"get_default_terminal strips the desktop suffix with string.trim().replace(\".desktop\", \"\"), which replaces every occurrence of \".desktop\" anywhere in the id, not just the trailing extension. A desktop id that legitimately contains the substring \".desktop\" (e.g. \"org.foo.desktopthing.desktop\") would be mangled, breaking the subsequent id comparison in terminal().","fix":"Use string.trim().strip_suffix(\".desktop\").unwrap_or(trimmed).to_string() to strip only the trailing suffix, matching the approach used in set_default (lines 468-471) and the defaults loop (line 357).","locations":[{"ref":"src/mime_app.rs:528-531","code":"  528 |         String::from_utf8(output.stdout)\n  529 |             .ok()\n  530 |             .map(|string| string.trim().replace(\".desktop\", \"\"))\n  531 |     }","lines":4,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/mime_app.rs#L528-L531"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In network_scan every enumerated child is assigned the hardcoded mime type \"inode/directory\", regardless of whether the entry is actually a file or a directory. The TODO on line 184 (\"get mime from content_type?\") acknowledges this. Downstream tab logic sorts and treats items by mime/is_dir, so plain files on a network share are mislabeled as directories, affecting sorting, icons (the icon fallback uses metadata.is_dir() separately so it can disagree with the mime), and open behavior.","fix":"Derive the mime from info.content_type() (gio FILE_ATTRIBUTE_STANDARD_CONTENT_TYPE) or from info.file_type(), and only use inode/directory when the entry is actually a directory; otherwise parse the content type or fall back to application/octet-stream.","locations":[{"ref":"src/mounter/gvfs.rs:213-220","code":"  213 |             (\n  214 |                 //TODO: get mime from content_type?\n  215 |                 \"inode/directory\".parse().unwrap(),\n  216 |                 file_icon(sizes.grid()),\n  217 |                 file_icon(sizes.list()),\n  218 |                 file_icon(sizes.list_condensed()),\n  219 |             )\n  220 |         };","lines":8,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/mounter/gvfs.rs#L213-L220"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Double-click is lost when on_press is set. On a left ButtonPressed, if click.kind() is Double the on_double_click message is published, but then lines 624-627 unconditionally `shell.capture_event(); return;` whenever on_press is Some. That is fine. However the prev_click reset logic on release (lines 647-668) requires a 'recent_click' within DOUBLE_CLICK_DURATION; if the user double-clicks slowly the second press is treated as Single. More importantly, the Triple arm (line 613) routes to on_press, so a triple click fires on_press again instead of on_double_click or a dedicated handler, silently dropping the triple-click distinction (TODO at line 614 acknowledges this).","fix":"Decide explicit behavior for Triple clicks; currently treating them as a fresh single press can cause an unexpected extra selection toggle.","locations":[{"ref":"src/mouse_area.rs:612-638","code":"  612 |         match click.kind() {\n  613 |             click::Kind::Single => {\n  614 |                 if let Some(message) = widget.on_press.as_ref() {\n  615 |                     shell.publish(message(cursor.position_in(layout_bounds)));\n  616 |                 }\n  617 |             }\n  618 |             click::Kind::Double => {\n  619 |                 if let Some(message) = widget.on_double_click.as_ref() {\n  620 |                     shell.publish(message(cursor.position_in(layout_bounds)));\n  621 |                 }\n  622 |             }\n  623 |             click::Kind::Triple => {\n  624 |                 // TODO what to do here\n  625 |                 if let Some(message) = widget.on_press.as_ref() {\n  626 |                     shell.publish(message(cursor.position_in(layout_bounds)));\n  627 |                 }\n  628 |             }\n  629 |         }\n  630 |         if widget.on_drag.is_some() {\n  631 |             state.drag_initiated = cursor.position();\n  632 |         }\n  633 | \n  634 |         if widget.on_press.is_some() {\n  635 |             shell.capture_event();\n  636 |             return;\n  637 |         }\n  638 |     }","lines":27,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/mouse_area.rs#L612-L638"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Symlink copies/moves preserve the link target verbatim via `fs::read_link` (recursive.rs:123-130) and recreate it at the new location (recursive.rs:422-433). For relative symlinks this can silently break the link when the destination is in a different directory (the relative path no longer resolves), and for absolute symlinks pointing inside the copied tree the copy will still point at the original tree rather than the copy. There is no rewriting of internal relative targets when copying a directory tree, which can produce dangling or cross-pointing links in the copied data.","fix":"Document/decide intended semantics; at minimum, when copying a directory tree, rewrite relative symlink targets that point within the source tree to point within the destination tree, or warn the user about links that will dangle.","locations":[{"ref":"src/operation/recursive.rs:123-130","code":"  123 |                 } else if file_type.is_symlink() {\n  124 |                     let target = fs::read_link(&from).map_err(|err| {\n  125 |                         OperationError::from_err(\n  126 |                             format!(\"failed to read link {}: {}\", from_parent.display(), err),\n  127 |                             &self.controller,\n  128 |                         )\n  129 |                     })?;\n  130 |                     OpKind::Symlink { target }","lines":8,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/operation/recursive.rs#L123-L130"},{"ref":"src/operation/recursive.rs:410-433","code":"  410 |             OpKind::Symlink { ref target } => {\n  411 |                 // Remove `to` if overwriting and it is an existing file\n  412 |                 if self.to.is_file() {\n  413 |                     match ctx.replace(self).await? {\n  414 |                         ControlFlow::Continue(to) => {\n  415 |                             self.to = to;\n  416 |                         }\n  417 |                         ControlFlow::Break(ret) => {\n  418 |                             return Ok(ret);\n  419 |                         }\n  420 |                     }\n  421 |                 }\n  422 |                 #[cfg(unix)]\n  423 |                 {\n  424 |                     std::os::unix::fs::symlink(target, &self.to)?;\n  425 |                 }\n  426 |                 #[cfg(windows)]\n  427 |                 {\n  428 |                     if target.is_dir() {\n  429 |                         std::os::windows::fs::symlink_dir(target, &self.to)?;\n  430 |                     } else {\n  431 |                         std::os::windows::fs::symlink_file(target, &self.to)?;\n  432 |                     }\n  433 |                 }","lines":24,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/operation/recursive.rs#L410-L433"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`remaining_conflicts` (the conflict count shown in the Replace dialog) is computed once before the loop (recursive.rs:185-193) and never decremented as conflicts are resolved. Every subsequent conflict dialog reports the original total rather than the number of conflicts still remaining, so the count shown to the user is wrong for all but the first conflict.","fix":"Decrement `self.remaining_conflicts` each time a conflict is resolved (in `replace()`), or recompute/pass the remaining count when invoking the on_replace callback.","locations":[{"ref":"src/operation/recursive.rs:185-193","code":"  185 |         self.remaining_conflicts = ops\n  186 |             .iter()\n  187 |             .filter(|op| {\n  188 |                 matches!(\n  189 |                     op.kind,\n  190 |                     OpKind::Copy | OpKind::Move { .. } | OpKind::Symlink { .. }\n  191 |                 ) && op.to.is_file()\n  192 |             })\n  193 |             .count();","lines":9,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/operation/recursive.rs#L185-L193"},{"ref":"src/operation/recursive.rs:257-261","code":"  257 |     async fn replace(&mut self, op: &Op) -> Result<ControlFlow<bool, PathBuf>, Box<dyn Error>> {\n  258 |         let replace_result = match self.replace_result_opt {\n  259 |             Some(result) => result,\n  260 |             None => (self.on_replace)(op, self.remaining_conflicts).await,\n  261 |         };","lines":5,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/operation/recursive.rs#L257-L261"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In the shift-click selection path, `max` defaults to indices.len() when range_max is not found in the sorted index list (position(...).unwrap_or(indices.len())). indices.len() is out of bounds for the index space (valid positions are 0..len-1); this is then used in max_real/min_real and take(max_real - min_real + 1). When range_max is missing, the take count is inflated by one, selecting one extra item beyond the intended range. The asymmetry with `min` (which uses unwrap_or_default() => 0) is suspicious.","fix":"Use a consistent, in-bounds fallback (e.g. unwrap_or(indices.len().saturating_sub(1)) for max) or bail out of the selection when either position lookup fails.","locations":[{"ref":"src/tab.rs:3665-3684","code":" 3665 |                             let min = indices\n 3666 |                                 .iter()\n 3667 |                                 .copied()\n 3668 |                                 .position(|offset| offset == range_min)\n 3669 |                                 .unwrap_or_default();\n 3670 |                             // We can't skip `min_real` elements here because the index of\n 3671 |                             // `max` may actually be before `min` in a sorted tab\n 3672 |                             let max = indices\n 3673 |                                 .iter()\n 3674 |                                 .copied()\n 3675 |                                 .position(|offset| offset == range_max)\n 3676 |                                 .unwrap_or(indices.len());\n 3677 |                             let min_real = min.min(max);\n 3678 |                             let max_real = max.max(min);\n 3679 | \n 3680 |                             if let Some(ref mut items) = self.items_opt {\n 3681 |                                 for index in indices\n 3682 |                                     .into_iter()\n 3683 |                                     .skip(min_real)\n 3684 |                                     .take(max_real - min_real + 1)","lines":20,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/tab.rs#L3665-L3684"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`Thumbnailer::command` arg handling only treats an arg as a placeholder when it EQUALS exactly `%i`/`%u`/`%o`/`%s`. Per the freedesktop thumbnailer Exec spec, codes can be embedded within an argument (and `%%` is a literal percent). Any arg merely starting with `%` that is not one of the four recognized whole-arg codes causes the whole command to be rejected (`return None`), and embedded codes like `--size=%s` are passed literally to the child process. This silently disables otherwise-valid thumbnailers.","fix":"Parse field codes per the Desktop Entry / thumbnailer spec, substituting embedded `%i/%u/%o/%s` within arguments and handling `%%`, rather than matching only whole-argument equality.","locations":[{"ref":"src/thumbnailer.rs:28-52","code":"   28 |         for arg in args {\n   29 |             if arg.starts_with('%') {\n   30 |                 match arg.as_str() {\n   31 |                     \"%i\" | \"%u\" => {\n   32 |                         command.arg(input);\n   33 |                     }\n   34 |                     \"%o\" => {\n   35 |                         command.arg(output);\n   36 |                     }\n   37 |                     \"%s\" => {\n   38 |                         command.arg(format!(\"{thumbnail_size}\"));\n   39 |                     }\n   40 |                     _ => {\n   41 |                         log::warn!(\n   42 |                             \"unsupported thumbnailer Exec code {:?} in {:?}\",\n   43 |                             arg,\n   44 |                             self.exec\n   45 |                         );\n   46 |                         return None;\n   47 |                     }\n   48 |                 }\n   49 |             } else {\n   50 |                 command.arg(arg);\n   51 |             }\n   52 |         }","lines":25,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/thumbnailer.rs#L28-L52"}]},
