{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"preview_view() and replace_view() construct a brand new DateTimeFormatter and time formatter via date_time_formatter()/time_formatter() on every render. These ICU formatter constructions are relatively expensive (DateTimeFormatter::try_new) and are rebuilt each frame, even though Tab already caches self.date_time_formatter / self.time_formatter for list_view. The preview pane re-creates them per redraw.","fix":"Pass the cached self.date_time_formatter/self.time_formatter into preview_view/replace_view (as list_view does via self.format_time) instead of building new formatters each render.","locations":[{"ref":"src/tab.rs:2519-2520","code":" 2519 |             let date_time_formatter = date_time_formatter(military_time);\n 2520 |             let time_formatter = time_formatter(military_time);","lines":2,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/tab.rs#L2519-L2520"},{"ref":"src/tab.rs:2519-2520","code":" 2519 |             let date_time_formatter = date_time_formatter(military_time);\n 2520 |             let time_formatter = time_formatter(military_time);","lines":2,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/tab.rs#L2519-L2520"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"select_first_prefix_match calls item.name.to_lowercase() (a heap allocation) for every item on every keystroke during type-ahead selection, and select_by_prefix may scan the list up to three times. For large directories this allocates one String per item per keypress.","fix":"Use a case-insensitive prefix comparison without allocating (e.g. compare char-by-char with to_lowercase per char, or use str::eq_ignore_ascii_case on the prefix length / unicode-aware starts_with helper), avoiding a full String allocation per item.","locations":[{"ref":"src/tab.rs:3201-3212","code":" 3201 |     fn select_first_prefix_match<'a>(\n 3202 |         prefix: &str,\n 3203 |         items: impl Iterator<Item = (usize, &'a mut Item)>,\n 3204 |     ) -> Option<usize> {\n 3205 |         for (i, item) in items {\n 3206 |             if item.name.to_lowercase().starts_with(prefix) {\n 3207 |                 item.selected = true;\n 3208 |                 return Some(i);\n 3209 |             }\n 3210 |         }\n 3211 |         None\n 3212 |     }","lines":12,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/tab.rs#L3201-L3212"},{"ref":"src/tab.rs:3106-3161","code":" 3106 |     pub fn select_by_prefix(&mut self, prefix: &str) -> bool {\n 3107 |         let prefix_lower = prefix.to_lowercase();\n 3108 |         let focus = self.select_focus.take();\n 3109 | \n 3110 |         if let Some(ref mut items) = self.items_opt {\n 3111 |             // First, deselect all items\n 3112 |             for item in items.iter_mut() {\n 3113 |                 item.selected = false;\n 3114 |             }\n 3115 | \n 3116 |             // Determine the start index of the search. When the index is before the currently focused item, it will be\n 3117 |             // considered first, otherwise last. Consider the focused item last when only a single character has been\n 3118 |             // typed, so we eagerly switch focus on the first character and stay on the same item as long as the prefix\n 3119 |             // matches.\n 3120 |             let single_char = prefix_lower.chars().count() == 1;\n 3121 |             let start = if single_char {\n 3122 |                 Self::index_after_focus(focus, self.sort_direction)\n 3123 |             } else {\n 3124 |                 Self::index_before_focus(focus, self.sort_direction)\n 3125 |             };\n 3126 |             self.select_focus = Self::select_first_prefix_from_index(\n 3127 |                 &prefix_lower,\n 3128 |                 items,\n 3129 |                 start,\n 3130 |                 self.sort_direction,\n 3131 |             );\n 3132 | \n 3133 |             if self.select_focus.is_some() || single_char {\n 3134 |                 return self.select_focus.is_some();\n 3135 |             }\n 3136 | \n 3137 |             let mut chars = prefix_lower.chars();\n 3138 |             let Some(first) = chars.next() else {\n 3139 |                 log::error!(\"search term is empty\");\n 3140 |                 return self.select_focus.is_some();\n 3141 |             };\n 3142 | \n 3143 |             // Check if all entered characters are the same\n 3144 |             if !chars.all(|c| c == first) {\n 3145 |                 return self.select_focus.is_some();\n 3146 |             }\n 3147 | \n 3148 |             // Search for a single character when all entered characters are the same.\n 3149 |             // This allows cycling through items starting with the same character by repeatedly pressing a key.\n 3150 |             let start = Self::index_after_focus(focus, self.sort_direction);\n 3151 |             self.select_focus = Self::select_first_prefix_from_index(\n 3152 |                 &first.to_string(),\n 3153 |                 items,\n 3154 |                 start,\n 3155 |                 self.sort_direction,\n 3156 |             );\n 3157 | \n 3158 |             return self.select_focus.is_some();\n 3159 |         }\n 3160 |         false\n 3161 |     }","lines":56,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/tab.rs#L3106-L3161"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"Message::Drop calls fs::read_dir on the target directory and iterates all of its entries (retaining against from.paths) synchronously inside update(), which runs on the UI thread. For a drop target containing many files this performs blocking I/O and an O(dir_entries * dropped_paths) scan during message handling, stalling the GUI.","fix":"Move the 'already in target directory' dedupe into the async DropFiles command/operation rather than doing blocking read_dir in update().","locations":[{"ref":"src/tab.rs:4778-4787","code":" 4778 |                         if let Ok(entries) = fs::read_dir(&to) {\n 4779 |                             for i in entries.into_iter().filter_map(Result::ok) {\n 4780 |                                 let i = i.path();\n 4781 |                                 from.paths.retain(|p| &i != p);\n 4782 |                                 if from.paths.is_empty() {\n 4783 |                                     log::info!(\"All dropped files already in target directory.\");\n 4784 |                                     return commands;\n 4785 |                                 }\n 4786 |                             }\n 4787 |                         }","lines":10,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/tab.rs#L4778-L4787"}]},
{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`update_thumbnail_text_metadata` fully decodes the just-written PNG (`reader.next_frame` into a heap buffer sized by `output_buffer_size`) and then re-encodes it from scratch solely to inject the Thumb::URI/MTime/Size text chunks. This is a full decode + full re-encode of every thumbnail (and the fail marker) just to add metadata, doubling the PNG work per thumbnail. PNG text chunks (tEXt) can be appended/streamed without re-decoding the pixel data.","fix":"Write the text chunks directly when first encoding the thumbnail in `update_with_image`/`create_fail_marker` (pass metadata into the original encoder), eliminating the decode+re-encode round trip entirely.","locations":[{"ref":"src/thumbnail_cacher.rs:143-199","code":"  143 |     fn update_thumbnail_text_metadata(&self, path: &Path) -> Result<(), Box<dyn Error>> {\n  144 |         let file = File::open(path)?;\n  145 |         let reader = BufReader::new(file);\n  146 | \n  147 |         let decoder = png::Decoder::new(reader);\n  148 |         let mut reader = decoder.read_info()?;\n  149 |         let (width, height, color_type, bit_depth, mut text_chunks) = {\n  150 |             let info = reader.info();\n  151 |             let text_chunks: FxHashMap<String, String> = info\n  152 |                 .uncompressed_latin1_text\n  153 |                 .iter()\n  154 |                 .map(|chunk| (chunk.keyword.clone(), chunk.text.clone()))\n  155 |                 .collect();\n  156 |             (\n  157 |                 info.width,\n  158 |                 info.height,\n  159 |                 info.color_type,\n  160 |                 info.bit_depth,\n  161 |                 text_chunks,\n  162 |             )\n  163 |         };\n  164 | \n  165 |         let mut image_data = vec![\n  166 |             0;\n  167 |             reader\n  168 |                 .output_buffer_size()\n  169 |                 .ok_or(\"The required image buffer size is too large.\")?\n  170 |         ];\n  171 |         reader.next_frame(&mut image_data)?;\n  172 | \n  173 |         let file = File::create(path)?;\n  174 |         let writer = BufWriter::new(file);\n  175 | \n  176 |         let mut encoder = png::Encoder::new(writer, width, height);\n  177 |         encoder.set_color(color_type);\n  178 |         encoder.set_depth(bit_depth);\n  179 | \n  180 |         text_chunks.insert(\"Software\".to_string(), \"COSMIC Files\".to_string());\n  181 |         text_chunks.insert(\"Thumb::URI\".to_string(), self.file_uri.clone());\n  182 |         let metadata = std::fs::metadata(&self.file_path)?;\n  183 |         let size = metadata.len();\n  184 |         text_chunks.insert(\"Thumb::Size\".to_string(), size.to_string());\n  185 |         let mtime = metadata\n  186 |             .modified()?\n  187 |             .duration_since(UNIX_EPOCH)\n  188 |             .unwrap_or_default()\n  189 |             .as_secs();\n  190 |         text_chunks.insert(\"Thumb::MTime\".to_string(), mtime.to_string());\n  191 | \n  192 |         for (keyword, text) in text_chunks {\n  193 |             encoder.add_text_chunk(keyword, text)?;\n  194 |         }\n  195 | \n  196 |         let mut writer = encoder.write_header()?;\n  197 |         writer.write_image_data(&image_data)?;\n  198 | \n  199 |         Ok(())","lines":57,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/thumbnail_cacher.rs#L143-L199"}]},
{"id":"PERF_9","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`zip_extract` blocks on the async controller check (`futures::executor::block_on`) on EVERY iteration of the inner read loop (per 4 MB chunk) in addition to once per file. For large files this spins up a block_on executor many times purely to poll a cancellation token, adding overhead to the hot copy loop.","fix":"Check cancellation less frequently (e.g. every N chunks or on a time interval), or use a cheap non-async atomic/flag check inside the tight loop instead of block_on per chunk.","locations":[{"ref":"src/archive.rs:238-243","code":"  238 |             futures::executor::block_on(async {\n  239 |                 controller\n  240 |                     .check()\n  241 |                     .await\n  242 |                     .map_err(|s| io::Error::other(OperationError::from_state(s, &controller)))\n  243 |             })?;","lines":6,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/archive.rs#L238-L243"}]},
{"id":"PERF_10","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"rescan_tab clones the entire mounter_items map (FxHashMap<MounterKey, MounterItems>) on every rescan, but the clone is only consumed inside `#[cfg(feature = \"gvfs\")]`. When gvfs is disabled the clone is pure waste (the variable is unused and would warn), and even when enabled only the paths are needed.","fix":"Gate the `let mounter_items = self.mounter_items.clone();` behind `#[cfg(feature = \"gvfs\")]`, or precompute and move only the set of mount paths into the async task.","locations":[{"ref":"src/dialog.rs:730-751","code":"  730 |     fn rescan_tab(&self, selection_paths: Option<Vec<PathBuf>>) -> Task<Message> {\n  731 |         let location = self.tab.location.clone();\n  732 |         let icon_sizes = self.tab.config.icon_sizes;\n  733 |         let mounter_items = self.mounter_items.clone();\n  734 |         Task::future(async move {\n  735 |             let location2 = location.clone();\n  736 |             match tokio::task::spawn_blocking(move || location2.scan(icon_sizes)).await {\n  737 |                 Ok((parent_item_opt, mut items)) => {\n  738 |                     #[cfg(feature = \"gvfs\")]\n  739 |                     {\n  740 |                         let mounter_paths: Box<[_]> = mounter_items\n  741 |                             .values()\n  742 |                             .flatten()\n  743 |                             .filter_map(MounterItem::path)\n  744 |                             .collect();\n  745 |                         if !mounter_paths.is_empty() {\n  746 |                             for item in &mut items {\n  747 |                                 item.is_mount_point =\n  748 |                                     item.path_opt().is_some_and(|p| mounter_paths.contains(p));\n  749 |                             }\n  750 |                         }\n  751 |                     }","lines":22,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/dialog.rs#L730-L751"}]},
{"id":"PERF_11","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"terminal() calls get_default_terminal() on every invocation, which spawns the external `xdg-mime query default x-scheme-handler/terminal` process and blocks on its output. If terminal() is called frequently (e.g. per context menu / per open-in-terminal action) this repeatedly forks a subprocess instead of caching the result, which is already computed on reload.","fix":"Resolve and cache the default terminal id once during reload() (store it on MimeAppCache) and read the cached value in terminal().","locations":[{"ref":"src/mime_app.rs:518-531","code":"  518 |     fn get_default_terminal(&self) -> Option<String> {\n  519 |         let output = process::Command::new(\"xdg-mime\")\n  520 |             .args([\"query\", \"default\", \"x-scheme-handler/terminal\"])\n  521 |             .output()\n  522 |             .ok()?;\n  523 | \n  524 |         if !output.status.success() {\n  525 |             return None;\n  526 |         }\n  527 | \n  528 |         String::from_utf8(output.stdout)\n  529 |             .ok()\n  530 |             .map(|string| string.trim().replace(\".desktop\", \"\"))\n  531 |     }","lines":14,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/mime_app.rs#L518-L531"},{"ref":"src/mime_app.rs:533-556","code":"  533 |     pub fn terminal(&self) -> Option<&Arc<MimeApp>> {\n  534 |         //TODO: consider rules in https://github.com/Vladimir-csp/xdg-terminal-exec\n  535 |         // The current approach works but might not adhere to the spec (yet)\n  536 | \n  537 |         // Look for and return preferred terminals\n  538 |         //TODO: fallback order beyond cosmic-term?\n  539 | \n  540 |         let mut preference_order = vec![\"com.system76.CosmicTerm\".to_string()];\n  541 | \n  542 |         if let Some(id) = self.get_default_terminal() {\n  543 |             preference_order.insert(0, id);\n  544 |         }\n  545 | \n  546 |         for id in &preference_order {\n  547 |             for terminal in &self.terminals {\n  548 |                 if &terminal.id == id {\n  549 |                     return Some(terminal);\n  550 |                 }\n  551 |             }\n  552 |         }\n  553 | \n  554 |         // Return whatever was the first terminal found\n  555 |         self.terminals.first()\n  556 |     }","lines":24,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/mime_app.rs#L533-L556"}]},

{"id":"PERF_13","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"In `Receiver::recv`, on every successful pop the code checks `queue.capacity() - queue.len() > 32` and may call `shrink_to`. For a high-throughput channel this adds reallocation churn on the hot path; the shrink target `queue.len().next_power_of_two()` can also be smaller than the current length is about to require, causing repeated grow/shrink cycles.","fix":"Only shrink periodically (e.g. when the queue fully drains) rather than on every pop, or remove the heuristic; the VecDeque will amortize allocations on its own.","locations":[{"ref":"src/channel.rs:53-56","code":"   53 |                     if queue.capacity() - queue.len() > 32 {\n   54 |                         let capacity = queue.len().next_power_of_two();\n   55 |                         queue.shrink_to(capacity);\n   56 |                     }","lines":4,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/channel.rs#L53-L56"}]},
{"id":"PERF_14","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"context_menu allocates a fresh String via find_key for every menu item by linearly scanning the entire key_binds HashMap (O(items * binds)) on each render of the context menu. Menus are rebuilt on each relevant render. For the small bind set this is fine, but it is a quadratic scan plus String allocation in a render path.","fix":"Build a reverse HashMap<Action, String> once before constructing items, or memoize.","locations":[{"ref":"src/menu.rs:63-70","code":"   63 |     let find_key = |action: &Action| -> String {\n   64 |         for (key_bind, key_action) in key_binds {\n   65 |             if action == key_action {\n   66 |                 return key_bind.to_string();\n   67 |             }\n   68 |         }\n   69 |         String::new()\n   70 |     };","lines":8,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/menu.rs#L63-L70"},{"ref":"src/menu.rs:88-105","code":"   88 |     let menu_item = |label, action| {\n   89 |         let key = find_key(&action);\n   90 |         menu_button!(\n   91 |             text::body(label),\n   92 |             space::horizontal(),\n   93 |             text::body(key).class(theme::Text::Custom(key_style))\n   94 |         )\n   95 |         .on_press(tab::Message::ContextAction(action))\n   96 |     };\n   97 | \n   98 |     let menu_item_disabled = |label, action: Action| {\n   99 |         let key = find_key(&action);\n  100 |         menu_button!(\n  101 |             text::body(label).class(theme::Text::Custom(disabled_style)),\n  102 |             space::horizontal(),\n  103 |             text::body(key).class(theme::Text::Custom(disabled_style))\n  104 |         )\n  105 |     };","lines":18,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/menu.rs#L88-L105"}]},

{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"State::click matches on prev_click.kind() with three arms (Single, Double, Triple) that all execute the identical expression `mouse::Click::new(pos, mouse::Button::Left, Some(prev_click))`. The match is pure dead code / noise; the kind() is never used to differentiate behavior.","fix":"Replace the inner match with a single `mouse::Click::new(pos, mouse::Button::Left, Some(prev_click))`.","locations":[{"ref":"src/mouse_area.rs:264-282","code":"  264 |         let new = if let Some((prev_click, prev_time)) = self.prev_click.take() {\n  265 |             if now.duration_since(prev_time) < DOUBLE_CLICK_DURATION {\n  266 |                 match prev_click.kind() {\n  267 |                     mouse::click::Kind::Single => {\n  268 |                         mouse::Click::new(pos, mouse::Button::Left, Some(prev_click))\n  269 |                     }\n  270 |                     mouse::click::Kind::Double => {\n  271 |                         mouse::Click::new(pos, mouse::Button::Left, Some(prev_click))\n  272 |                     }\n  273 |                     mouse::click::Kind::Triple => {\n  274 |                         mouse::Click::new(pos, mouse::Button::Left, Some(prev_click))\n  275 |                     }\n  276 |                 }\n  277 |             } else {\n  278 |                 mouse::Click::new(pos, mouse::Button::Left, None)\n  279 |             }\n  280 |         } else {\n  281 |             mouse::Click::new(pos, mouse::Button::Left, None)\n  282 |         };","lines":19,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/mouse_area.rs#L264-L282"}]},

{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"In ItemThumbnail::new, the local `tried_supported_file` is set true at line 2059 (`tried_supported_file = tried_supported_file || !thumbnailer(&mime).is_empty();`) but every subsequent branch that reads it (svg/text) re-assigns it to true before use, and the only later read is the fail-marker guard at line 2115. The line 2059 recomputation runs thumbnailer(&mime) again (a second lookup) whose result only matters when neither svg nor text branch is taken; this is subtle and largely redundant with the earlier external-thumbnailer attempt.","fix":"Clarify intent: track 'was this a thumbnailable type' once, or comment why thumbnailer(&mime) is queried a second time here.","locations":[{"ref":"src/tab.rs:2161","code":" 2161 |         tried_supported_file = tried_supported_file || !thumbnailer(&mime).is_empty();","lines":1,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/tab.rs#L2161"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"Auto-scroll variable naming is inverted relative to its meaning. `let bottom = viewport.y;` and `let top = viewport.y + viewport.height;` — in screen coordinates viewport.y is the TOP edge and viewport.y+height is the BOTTOM edge. The variables named 'bottom' and 'top' are swapped, making the code read backwards (e.g. `if virtual_position.y < bottom` actually means 'above the top edge'). Logic happens to be correct but the names actively mislead maintainers.","fix":"Rename: `let top = viewport.y;` and `let bottom = viewport.y + viewport.height;`.","locations":[{"ref":"src/mouse_area.rs:585-593","code":"  585 |                 let bottom = viewport.y;\n  586 |                 let top = viewport.y + viewport.height;\n  587 |                 if virtual_position.y < bottom {\n  588 |                     Some(virtual_position.y - bottom)\n  589 |                 } else if virtual_position.y > top {\n  590 |                     Some(virtual_position.y - top)\n  591 |                 } else {\n  592 |                     None\n  593 |                 }","lines":9,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/mouse_area.rs#L585-L593"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The doc comment on THUMB_SEMAPHORE says it 'Uses 4 workers', but the actual limit is num_cpus::get().min(4), i.e. up to 4 — on a 1- or 2-core machine it will be 1 or 2 workers, not 4. The comment is misleading about the concurrency level.","fix":"Reword to 'limited to min(num_cpus, 4) workers' to match the code.","locations":[{"ref":"src/tab.rs:85-88","code":"   85 | // Thumbnail generation semaphore - limits parallel thumbnail workers\n   86 | // Uses 4 workers for balanced throughput and memory usage\n   87 | pub static THUMB_SEMAPHORE: LazyLock<tokio::sync::Semaphore> =\n   88 |     LazyLock::new(|| tokio::sync::Semaphore::const_new(num_cpus::get().min(4)));","lines":4,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/tab.rs#L85-L88"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"Comment at the App struct says `// The [`App`] stores application-specific state.` using a `//` line comment with rustdoc intra-doc link syntax, which is not rendered as documentation and the backtick link is meaningless in a plain comment. Minor; several `//TODO` comments (e.g. 'this is nasty', 'this could change favorites IDs while they are in use') flag known unaddressed issues.","fix":"Convert to a doc comment (`///`) if documentation is intended, or drop the link syntax. Track the TODOs as issues.","locations":[{"ref":"src/app.rs:719","code":"  719 | // The [`App`] stores application-specific state.","lines":1,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/app.rs#L719"},{"ref":"src/app.rs:3545","code":" 3545 |                 //TODO: this could change favorites IDs while they are in use","lines":1,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/app.rs#L3545"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"Comment on `TabConfig::military_time` says the field is `#[serde(skip)]` because the user's global preference is used; this is accurate, but the field is documented as 'neither serialized nor deserialized' while `#[serde(default)]` on the struct means it is still populated from `Default` on load. The wording could mislead a reader into thinking the field is absent entirely.","fix":"Clarify the comment to state the value is sourced from the global time preference at runtime and defaults to false when not set.","locations":[{"ref":"src/config.rs:363-366","code":"  363 |     #[serde(skip)]\n  364 |     /// 24 hour clock; this is neither serialized nor deserialized because we use the user's global\n  365 |     /// preference rather than save it\n  366 |     pub military_time: bool,","lines":4,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/config.rs#L363-L366"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"Comment says 'Go back to home in any tabs that were unmounted' but there is only a single tab in the dialog (self.tab), not multiple tabs. The plural 'tabs' is copy-pasted from the main app's multi-tab handler and is misleading in the dialog context.","fix":"Reword to 'Go back to home if the current location was unmounted'.","locations":[{"ref":"src/dialog.rs:1542-1551","code":" 1542 |                 // Go back to home in any tabs that were unmounted\n 1543 |                 let mut commands = Vec::new();\n 1544 |                 {\n 1545 |                     let home_location = Location::Path(home_dir());\n 1546 |                     if unmounted.contains(&self.tab.location) {\n 1547 |                         self.tab.change_location(&home_location, None);\n 1548 |                         commands.push(self.update_watcher());\n 1549 |                         commands.push(self.rescan_tab(None));\n 1550 |                     }\n 1551 |                 }","lines":10,"link":"https://github.com/pop-os/cosmic-files/blob/089ad2b417edded26385029166e5b49c13432bf8/src/dialog.rs#L1542-L1551"}]},

<script>
(function(){
'use strict';

// Data
const FINDINGS     = JSON.parse(document.getElementById('D').textContent);
const PROJECT_INFO = JSON.parse(document.getElementById('PI').textContent);
const SEVS     = ['critical','high','medium','low','negligible'];
const STATUSES = ['open','fixed','wont-fix','false-positive'];
const ALL_TYPES = [...new Set(FINDINGS.map(f => f.type))].sort();
// Build lookup map for O(1) access
const FINDING_BY_ID = new Map(FINDINGS.map(f => [f.id, f]));
// Only severities actually present in the report — the filter bar hides the rest.
const PRESENT_SEVS = SEVS.filter(s => FINDINGS.some(f => (f.severity || 'medium') === s));
// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};
const PRESENT_DIFFS = DIFFICULTY_ORDER.filter(d => FINDINGS.some(f => f.difficulty === d));
const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', searchScope: 'all', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),
};
const statuses = {};

// Persistence
function loadStatuses() {
  try { Object.assign(statuses, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}
}
function saveStatuses() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    if (S.searchScope !== 'all') p.set('qs', S.searchScope);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('qs'))  { S.searchScope = p.get('qs'); }
  document.getElementById('search-scope').classList.toggle('active', S.searchScope === 'locations');
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build a [project] header block from embedded PROJECT_INFO, so the exported
// findings.toml is self-contained (doesn't depend on a sibling project-info.toml
// that a second, separately-triggered download could silently fail to save).
// '' when there is no project info at all.
function buildProjectToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = PROJECT_INFO || {};
  if (!Object.keys(pi).length) return '';
  const lines = ['[project]'];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n\n';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return buildProjectToml() + chunks.join('\n\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystacks per finding (cleared on full re-render).
// Two variants: everything (default), and file/folder paths only - for when a
// search term (e.g. a directory name like 'dlls/abc') also happens to appear
// inside description/fix prose and you only want path matches.
const _hay = new Map();
const _hayLoc = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}
function hayLocOf(f) {
  if (!_hayLoc.has(f.id)) {
    _hayLoc.set(f.id, f.locations.map(l => l.ref).join(' ').toLowerCase());
  }
  return _hayLoc.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (S.searchScope === 'locations') {
      if (!hayLocOf(f).includes(q)) return false;
    } else if (!hayOf(f).includes(q) && !st.includes(q)) {
      return false;
    }
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  _hayLoc.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    // Single download (was two) - a second auto-triggered download is commonly
    // blocked by the browser unless the user explicitly allows it, which silently
    // drops project-info.toml. Embedding [project] in findings.toml itself avoids
    // that failure mode entirely.
    downloadText(buildFindingsToml(), 'findings.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});
document.getElementById('search-scope').addEventListener('click', e => {
  S.searchScope = S.searchScope === 'locations' ? 'all' : 'locations';
  e.currentTarget.classList.toggle('active', S.searchScope === 'locations');
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
