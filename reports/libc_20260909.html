<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"The public builder `TestGenerator::edition(e: u32)` accepts any u32, but `RustTestTemplate::edition` panics on any value other than 2021 or 2024. So a caller doing e.g. `cfg.edition(2018)` or `cfg.edition(2015)` gets a panic deep inside `generate_files` rather than a returned `GenerationError`. A public API should not panic on plausible user input.","fix":"Validate the edition in the public `edition` setter (or in `generate_files`) and return `GenerationError` for unsupported editions, instead of `panic!` in the template's `edition` method.","locations":[{"ref":"ctest/src/generator.rs:286-289","code":"  286 |     pub fn edition(&mut self, e: u32) -> &mut Self {\n  287 |         self.edition = Some(e);\n  288 |         self\n  289 |     }","lines":4,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/ctest/src/generator.rs#L286-L289"},{"ref":"ctest/src/template.rs:45-57","code":"   45 |     pub(crate) fn edition(&mut self, edition: u32) -> &Self {\n   46 |         match edition {\n   47 |             2021 => {\n   48 |                 self.extern_keyword = \"extern\".into();\n   49 |             }\n   50 |             2024 => {\n   51 |                 // For now we only use this to convert extern to unsafe extern.\n   52 |                 self.extern_keyword = \"unsafe extern\".into();\n   53 |             }\n   54 |             _ => panic!(\"unsupported or invalid edition: {edition}\"),\n   55 |         }\n   56 |         self\n   57 |     }","lines":13,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/ctest/src/template.rs#L45-L57"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"rustc_minor_nightly() panics on rustc version strings that lack a patch component. After `version.split('.')`, it does `assert_eq!(pieces.next(), Some(\"rustc 1\"))` then expects a 2nd piece (minor) and a 3rd piece (`otry!(pieces.next())`) for the nightly suffix. A version string like \"rustc 1.85\" (no `.0`) makes the 3rd `pieces.next()` return None and the `otry!` macro panics with \"Failed to get rustc version\". Also `assert_eq!(..., Some(\"rustc 1\"))` hard-fails the day rustc reaches 2.0. These are build-script panics on unusual but well-formed rustc output.","fix":"Parse more defensively: split on whitespace to grab the `x.y.z` token, then split that on '.'; tolerate a missing patch component (default nightly=false) and avoid asserting the literal \"rustc 1\" major version.","locations":[{"ref":"build.rs:393-414","code":"  393 |     let version = otry!(str::from_utf8(&output.stdout).ok());\n  394 | \n  395 |     let mut pieces = version.split('.');\n  396 | \n  397 |     assert_eq!(\n  398 |         pieces.next(),\n  399 |         Some(\"rustc 1\"),\n  400 |         \"Failed to get rustc version\"\n  401 |     );\n  402 | \n  403 |     let minor = pieces.next();\n  404 | \n  405 |     // If `rustc` was built from a tarball, its version string\n  406 |     // will have neither a git hash nor a commit date\n  407 |     // (e.g. \"rustc 1.39.0\"). Treat this case as non-nightly,\n  408 |     // since a nightly build should either come from CI\n  409 |     // or a git checkout\n  410 |     let nightly_raw = otry!(pieces.next()).split('-').nth(1);\n  411 |     let nightly = nightly_raw.map_or(false, |raw| {\n  412 |         raw.starts_with(\"dev\") || raw.starts_with(\"nightly\")\n  413 |     });\n  414 |     let minor = otry!(otry!(minor).parse().ok());","lines":22,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/build.rs#L393-L414"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"extract_single_link_name panics (via panic! / multiple-attr check / unrecognized-syntax) on malformed or duplicate #[link_name = ...] attributes encountered while walking the AST. Because ctest parses macro-expanded libc source, a panic here aborts the whole test generation with a raw backtrace instead of a diagnostic. More importantly the collected link_name is never actually consumed (see the dead-code finding), so these panic paths add risk for data that is thrown away.","fix":"Return a Result/Option and surface a proper GenerationError instead of panic!, or (since link_name is unused) stop parsing link_name entirely until it is consumed.","locations":[{"ref":"ctest/src/ffi_items.rs:115-133","code":"  115 | fn extract_single_link_name(attrs: &[syn::Attribute]) -> Option<BoxStr> {\n  116 |     let mut link_name_iter = attrs\n  117 |         .iter()\n  118 |         .filter(|attr| attr.path().is_ident(\"link_name\"));\n  119 | \n  120 |     let link_name = link_name_iter.next()?;\n  121 |     if let Some(attr) = link_name_iter.next() {\n  122 |         panic!(\"multiple `#[link_name = ...]` attributes found: {attr:?}\");\n  123 |     }\n  124 | \n  125 |     if let syn::Meta::NameValue(nv) = &link_name.meta\n  126 |         && let syn::Expr::Lit(expr_lit) = &nv.value\n  127 |         && let syn::Lit::Str(lit_str) = &expr_lit.lit\n  128 |     {\n  129 |         return Some(lit_str.value().into_boxed_str());\n  130 |     }\n  131 | \n  132 |     panic!(\"unrecognized `link_name` syntax: {link_name:?}\");\n  133 | }","lines":19,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/ctest/src/ffi_items.rs#L115-L133"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"visit_foreign_item_fn uses unimplemented!() for any parameter pattern that is not Pat::Ident and unreachable!() for receivers. Macro-expanded libc is unlikely to hit these, but a foreign fn declared with a wildcard/tuple parameter pattern (legal in some extern signatures, e.g. `fn f(_: c_int)`) would hit the unimplemented! and abort generation. `_` parameters are common.","fix":"Handle Pat::Wild (and other patterns) by synthesizing a placeholder identifier instead of panicking; reserve unreachable! strictly for the receiver case.","locations":[{"ref":"ctest/src/ffi_items.rs:143-156","code":"  143 |         .map(|arg| match arg {\n  144 |             syn::FnArg::Typed(arg) => Parameter {\n  145 |                 ident: match arg.pat.deref() {\n  146 |                     syn::Pat::Ident(i) => i.ident.to_string().into_boxed_str(),\n  147 |                     _ => {\n  148 |                         unimplemented!(\"Foreign functions are unlikely to have any other pattern.\")\n  149 |                     }\n  150 |                 },\n  151 |                 ty: arg.ty.deref().clone(),\n  152 |             },\n  153 |             syn::FnArg::Receiver(_) => {\n  154 |                 unreachable!(\"Foreign functions can't have self/receiver parameters.\")\n  155 |             }\n  156 |         })","lines":14,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/ctest/src/ffi_items.rs#L143-L156"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"translate_path() calls args.args.first().unwrap() inside the `if let ... && let ...` chain. If a path segment has empty angle-bracketed arguments (Punctuated is empty), first() returns None and unwrap() panics instead of producing a TranslationError. The translator otherwise reports unsupported/odd types via Result, so this is an inconsistent hard panic in the parsing path.","fix":"Match on args.args.first() with `if let Some(syn::GenericArgument::Type(inner_ty)) = args.args.first()` (the chain already falls through when the pattern does not match), avoiding the unwrap.","locations":[{"ref":"ctest/src/translator.rs:217-219","code":"  217 |         if let syn::PathArguments::AngleBracketed(args) = &last.arguments\n  218 |             && let syn::GenericArgument::Type(inner_ty) = args.args.first().unwrap()\n  219 |         {","lines":3,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/ctest/src/translator.rs#L217-L219"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"Fuchsia CMSG_NXTHDR advances the cmsg pointer by sizeof(cmsghdr) units instead of bytes. __CMSG_NEXT does `cmsg.offset(__CMSG_LEN(cmsg))` where `cmsg: *const cmsghdr`. __CMSG_LEN returns the CMSG_ALIGN'd cmsg_len as a *byte* count, but `<*const cmsghdr>::offset` multiplies its argument by size_of::<cmsghdr>() (16 bytes on Fuchsia). The intended next header is `(char*)cmsg + CMSG_ALIGN(cmsg_len)`, but this computes `cmsg + 16 * CMSG_ALIGN(cmsg_len)` bytes, walking far past the real next header and past the control buffer. The `as *mut c_uchar` cast happens only after offset() has already scaled, so it does not help. CMSG_NXTHDR therefore returns a wild/out-of-bounds pointer (or spuriously NULL via the bounds check), corrupting ancillary-data iteration for every recvmsg user on Fuchsia. Contrast Android's correct version which uses byte arithmetic (`cmsg as usize + CMSG_ALIGN(...)`).","fix":"In __CMSG_NEXT advance by bytes, not by cmsghdr-sized units: `(cmsg as *const c_uchar).offset(__CMSG_LEN(cmsg)) as *mut c_uchar` or `(cmsg as usize + __CMSG_LEN(cmsg) as usize) as *mut c_uchar`.","locations":[{"ref":"src/fuchsia/mod.rs:3337-3344","code":" 3337 | fn __CMSG_LEN(cmsg: *const cmsghdr) -> ssize_t {\n 3338 |     ((unsafe { (*cmsg).cmsg_len as size_t } + size_of::<c_long>() - 1) & !(size_of::<c_long>() - 1))\n 3339 |         as ssize_t\n 3340 | }\n 3341 | \n 3342 | fn __CMSG_NEXT(cmsg: *const cmsghdr) -> *mut c_uchar {\n 3343 |     (unsafe { cmsg.offset(__CMSG_LEN(cmsg)) }) as *mut c_uchar\n 3344 | }","lines":8,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/src/fuchsia/mod.rs#L3337-L3344"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"collect_fields strips a leading `r#` from field identifiers and stores the bare name; Field::rust_ident() re-adds `r#` only for the hardcoded keyword list in is_rust_keyword. Struct/union/fn/const/static/type-alias identifiers (visit_item_* in ffi_items.rs) are NOT stripped of `r#`, so raw-identifier handling is inconsistent across item kinds: a raw-named field is normalized while a raw-named type keeps its `r#`. Any keyword not in the is_rust_keyword list (the list omits e.g. the weak keywords and is maintained by hand) that appears as a raw-ident field would be emitted without `r#` and fail to compile in the generated Rust test.","fix":"Centralize raw-identifier handling: either keep the original `r#`-prefixed string and never strip it, or strip uniformly across all item kinds and rely on a single complete keyword set. Avoid the strip-then-reconstruct round-trip that can drop the prefix for keywords missing from the manual list.","locations":[{"ref":"ctest/src/ffi_items.rs:99-112","code":"   99 |             field.ident.as_ref().map(|ident| {\n  100 |                 let ident = ident.to_string();\n  101 |                 Field {\n  102 |                     public: is_visible(&field.vis),\n  103 |                     ident: ident\n  104 |                         .strip_prefix(\"r#\")\n  105 |                         .unwrap_or(&ident)\n  106 |                         .to_string()\n  107 |                         .into_boxed_str(),\n  108 |                     ty: field.ty.clone(),\n  109 |                 }\n  110 |             })\n  111 |         })\n  112 |         .collect()","lines":14,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/ctest/src/ffi_items.rs#L99-L112"},{"ref":"ctest/src/ast/field.rs:18-81","code":"   18 |     pub fn rust_ident(&self) -> String {\n   19 |         if is_rust_keyword(&self. {"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"is_signed() classifies unsigned C types as signed. The fallthrough arm returns true when the C type name starts with \"uint\" (uint8_t, uint16_t, uint32_t, uint64_t) or \"unsigned \" (unsigned int, unsigned long, ...), and the explicit arm above lists \"size_t\" (which is unsigned in C) as signed. Since is_signed() gates whether a signededness test is emitted for an alias, every unsigned alias whose underlying type resolves to uint*_t / unsigned X / size_t is incorrectly treated as signed and gets an unnecessary signededness test generated, contradicting the function's documented intent of only testing signed aliases.","fix":"Remove \"size_t\" from the signed list on line 281 (it is unsigned), and fix the fallthrough so unsigned spellings are not matched: only return true for s.starts_with(\"int\") || s.starts_with(\"signed \"), and explicitly return false for \"uint\"/\"unsigned \" prefixes.","locations":[{"ref":"ctest/src/translator.rs:274-281","code":"  274 |                 match translate_primitive_type(&ident.to_string()).as_str() {\n  275 |                     \"char\" | \"short\" | \"long\" | \"long long\" | \"size_t\" | \"ssize_t\" => true,\n  276 |                     s => {\n  277 |                         s.starts_with(\"int\")\n  278 |                             || s.starts_with(\"uint\") | s.starts_with(\"signed \")\n  279 |                             || s.starts_with(\"unsigned \")\n  280 |                     }\n  281 |                 }","lines":8,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/ctest/src/translator.rs#L274-L281"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"ptr_with_inner() silently drops the pointee constness when the inner type is an Array or Fn. syn reports the constness on the pointee, and this helper pushes that constness into the inner CTy; but the match only handles CTy::Named and CTy::Ptr, with `_ => ()` swallowing Array/Fn. As a result `*const [T; N]` and `*mut [T; N]` (a Ptr whose elem is an Array, produced by translate_ptr) translate to the same C type, losing the const qualifier of the pointed-to array.","fix":"Handle the Array/Fn cases too: for CTy::Array, apply the qualifier to the array element (or attach a Qual to the array if the model supported it); at minimum do not silently discard constness. Consider emitting `const` on the appropriate inner element so `*const [T;N]` yields `const T (*)[N]`.","locations":[{"ref":"ctest/src/translator.rs:353-358","code":"  353 |     let mut ty = Box::new(inner);\n  354 |     match ty.deref_mut() {\n  355 |         cdecl::CTy::Named { name: _, qual } => qual.constness = constness,\n  356 |         cdecl::CTy::Ptr { ty: _, qual } => qual.constness = constness,\n  357 |         _ => (),\n  358 |     }","lines":6,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/ctest/src/translator.rs#L353-L358"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The style-checker's own unit tests (style_tests.rs) build the checker via `check_string`, which never sets `self.path` (it stays an empty PathBuf - only `check_file` sets it). When those tests record errors and call `finalize()`, the very first thing `finalize` does on the error path is `let source = fs::read_to_string(&error.path)?;` with an empty path, which fails and returns that IO error via `?` before any snippet is rendered. The `check_style_reject_*` tests only assert `checker.finalize().is_err()`, so they pass on the IO error regardless of whether the style violation was actually detected. They still catch the 'zero errors recorded' case (finalize returns Ok early when `errors` is empty), but they give false confidence: a wrong/missing error message, wrong span, or a panic in the annotate-snippets rendering path is never exercised, and a reject test cannot distinguish 'correct violation detected' from 'detected some unrelated error'.","fix":"In the in-memory tests render/assert on the recorded errors rather than the IO-dependent `finalize`, or make `finalize` not depend on re-reading the file from disk for in-memory sources (e.g. carry the source string in FileError, or skip the disk read when path is empty). Better: have the reject tests assert on the specific error title/count instead of just `is_err()`.","locations":[{"ref":"libc-test/tests/style_lib/mod.rs:159-190","code":"  159 |     pub fn finalize(self) -> Result<()> {\n  160 |         if self.errors.is_empty() {\n  161 |             return Ok(());\n  162 |         }\n  163 | \n  164 |         let renderer = Renderer::styled();\n  165 |         for error in self.errors {\n  166 |             let source = fs::read_to_string(&error.path)?;\n  167 | \n  168 |             let mut snippet = Snippet::source(&source)\n  169 |                 .origin(error.path.to_str().expect(\"path to be UTF-8\"))\n  170 |                 .fold(true)\n  171 |                 .annotation(Level::Error.span(error.span.byte_range()).label(&error.msg));\n  172 |             if let Some((help_span, help_msg)) = &error.help {\n  173 |                 if let Some(help_span) = help_span {\n  174 |                     snippet = snippet\n  175 |                         .annotation(Level::Help.span(help_span.byte_range()).label(help_msg));\n  176 |                 }\n  177 |             }\n  178 | \n  179 |             let mut msg = Level::Error.title(&error.title).snippet(snippet);\n  180 |             if let Some((help_span, help_msg)) = &error.help {\n  181 |                 if help_span.is_none() {\n  182 |                     msg = msg.footer(Level::Help.title(help_msg))\n  183 |                 }\n  184 |             }\n  185 | \n  186 |             eprintln!(\"{}\", renderer.render(msg));\n  187 |         }\n  188 | \n  189 |         Err(\"some tests failed\".into())\n  190 |     }","lines":32,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/libc-test/tests/style_lib/mod.rs#L159-L190"},{"ref":"libc-test/tests/style_tests.rs:40-43","code":"   40 |     let mut checker = StyleChecker::new();\n   41 |     checker.check_string(contents).unwrap();\n   42 |     assert!(checker.finalize().is_err());\n   43 | }","lines":4,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/libc-test/tests/style_tests.rs#L40-L43"},{"ref":"libc-test/tests/style_tests.rs:89-92","code":"   89 |     let mut checker = StyleChecker::new();\n   90 |     checker.check_string(contents).unwrap();\n   91 |     assert!(checker.finalize().is_err());\n   92 | }","lines":4,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/libc-test/tests/style_tests.rs#L89-L92"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`create-artifacts.py` picks the build directory from the *oldest* `ctest_output.c` (ascending mtime sort + index `[0]`), but the comment says it wants the 'most recently touched' file. The intended most-recent file is at `[-1]`.","fix":"Use `marker_files[-1]` (or sort with `reverse=True`).","locations":[{"ref":"ci/create-artifacts.py:19-23","code":"   19 |     # Find the most recently touched file named \"ctest_output.c\" in the target\n   20 |     # directory. This will be libc-tests's `OUT_DIR`\n   21 |     marker_files = [Path(p) for p in glob(\"target/**/ctest_output.c\", recursive=True)]\n   22 |     marker_files.sort(key=lambda path: path.stat().st_mtime)\n   23 |     build_dir = marker_files[0].parent","lines":5,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/ci/create-artifacts.py#L19-L23"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`--skip-semver` is declared without `action=\"store_true\"`, so argparse treats it as taking a value. `cfg.skip_semver = args.skip_semver` is therefore `None` (falsy) unless a value is supplied, meaning the documented flag-style usage `--skip-semver` would actually consume the following argument, and passing it alone at the end raises an error. It also can never be set true the way a flag is expected to work.","fix":"Declare it as `p.add_argument(\"--skip-semver\", action=\"store_true\", help=...)`.","locations":[{"ref":"ci/verify-build.py:457","code":"  457 |     p.add_argument(\"--skip-semver\", help=\"don't run semver checks\")","lines":1,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/ci/verify-build.py#L457"},{"ref":"ci/verify-build.py:473","code":"  473 |         skip_semver=args.skip_semver,","lines":1,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/ci/verify-build.py#L473"},{"ref":"ci/verify-build.py:441-445","code":"  441 |     if cfg.skip_semver:\n  442 |         eprint(\"Skipping semver checks\")\n  443 |         semver_ok = True\n  444 |     else:\n  445 |         semver_ok = do_semver_checks(cfg, target)","lines":5,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/ci/verify-build.py#L441-L445"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"visit_item_foreign_mod derives the ABI by lowercasing the abi string via Abi::from, but an extern block with an explicit unrecognized ABI (e.g. extern \"system\") is mapped to Abi::Other while a bare `extern { }` defaults to Abi::C. Since the abi field is #[expect(unused)] and never consulted during generation, all extern fns/statics are treated identically regardless of ABI - so a non-C-ABI extern block would still be tested as if it were C. Currently latent because abi is unused, but it means the collected ABI is misleading.","fix":"Either consume abi during generation (skip/flag non-C ABIs) or remove the abi field; do not collect data that is then ignored.","locations":[{"ref":"ctest/src/ffi_items.rs:235-255","code":"  235 |     fn visit_item_foreign_mod(&mut self, i: &'ast syn::ItemForeignMod) {\n  236 |         // Because we need to store the ABI we can't directly visit the foreign\n  237 |         // functions/statics.\n  238 | \n  239 |         // Since this is an extern block, assume extern \"C\" by default.\n  240 |         let abi = i\n  241 |             .abi\n  242 |             .name\n  243 |             .clone()\n  244 |             .map_or(Abi::C, |s| Abi::from(s.value().as_str()));\n  245 | \n  246 |         for item in &i.items {\n  247 |             match item {\n  248 |                 syn::ForeignItem::Fn(function) => visit_foreign_item_fn(self, function, &abi),\n  249 |                 syn::ForeignItem::Static(static_variable) => {\n  250 |                     visit_foreign_item_static(self, static_variable, &abi)\n  251 |                 }\n  252 |                 _ => (),\n  253 |             }\n  254 |         }\n  255 |     }","lines":21,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/ctest/src/ffi_items.rs#L235-L255"},{"ref":"ctest/src/ast/function.rs:12-14","code":"   12 |     pub(crate) public: bool,\n   13 |     #[expect(unused)]\n   14 |     pub(crate) abi: Abi,","lines":3,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/ctest/src/ast/function.rs#L12-L14"},{"ref":"ctest/src/ast/static_variable.rs:13-14","code":"   13 |     #[expect(unused)]\n   14 |     pub(crate) abi: Abi,","lines":2,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/ctest/src/ast/static_variable.rs#L13-L14"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"Skipping of C-enum constants matches the predicate against the constant's full *type* token stream (`constant.ty.to_token_stream().to_string()`), passed as `MapInput::CEnumType`. The alias C-enum skip just above (line 630-635) matches against the alias *ident*. So whether a constant is recognized as belonging to a skipped C enum depends on the textual rendering of its type (spacing/path qualification of the token stream), which is fragile and inconsistent with the ident-based matching used for the alias itself. A constant whose type prints with a path prefix or differing whitespace silently fails to be skipped.","fix":"Match the constant against the resolved type-alias name consistently with how aliases are matched (use the canonical ident), rather than the raw token-stream string of the type.","locations":[{"ref":"ctest/src/template.rs:643-658","code":"  643 |         let skipped = self\n  644 |             .filtered_ffi_items\n  645 |             .constants\n  646 |             .extract_if(.., |constant| {\n  647 |                 self.generator.skips.iter().any(|f| {\n  648 |                     f(&MapInput::CEnumType(\n  649 |                         &constant.ty.to_token_stream().to_string(),\n  650 |                     ))\n  651 |                 })\n  652 |             });\n  653 | \n  654 |         for item in skipped {\n  655 |             if verbose {\n  656 |                 eprintln!(\"Skipping C enum constant {}\", item.ident());\n  657 |             }\n  658 |         }","lines":16,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/ctest/src/template.rs#L643-L658"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"Mixed boolean operator precedence in is_signed(): the expression uses bitwise `|` between `s.starts_with(\"uint\")` and `s.starts_with(\"signed \")` while the surrounding operators are `||`. Because `|` binds tighter than `||`, this parses as `int || (uint | signed) || unsigned`. Beyond the correctness problem of treating uint/unsigned as signed, the bitwise `|` defeats short-circuit evaluation and is a clear copy/typo of the intended `||`.","fix":"Replace the `|` on line 284 with `||` so all the alternatives are logical-or, and re-verify the type classification per the previous finding.","locations":[{"ref":"ctest/src/translator.rs:277-280","code":"  277 |                         s.starts_with(\"int\")\n  278 |                             || s.starts_with(\"uint\") | s.starts_with(\"signed \")\n  279 |                             || s.starts_with(\"unsigned \")\n  280 |                     }","lines":4,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/ctest/src/translator.rs#L277-L280"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"translate_primitive_type() produces stray/duplicate spaces for the `c_long`-family aliases. `&ty[2..].replace(\"long\", \" long\")` turns \"long\" into \" long\" (leading space), so c_long -> \" long\", c_longlong -> \" long long\". For the unsigned/signed variants the `&s[1..]` slice keeps that leading space, so c_ulong -> \"unsigned  long\" and c_ulonglong -> \"unsigned  long long\" (double space). These spellings are then stored as the C type name and emitted into declarations. C compilers tolerate the extra whitespace, but the generated C is malformed-looking and inconsistent.","fix":"Normalize spacing, e.g. build the base as `ty[2..].replacen(\"long\", \"long\", 0)` is not it; instead detect the long-count and format explicitly, or trim/collapse spaces: `format!(\"unsigned {}\", &s[1..].trim_start())` and avoid prefixing a space when replacing \"long\".","locations":[{"ref":"ctest/src/translator.rs:333-341","code":"  333 |         ty if ty.starts_with(\"c_\") => {\n  334 |             let ty = &ty[2..].replace(\"long\", \" long\");\n  335 |             match ty.as_str() {\n  336 |                 \"short\" => \"short\".to_string(),\n  337 |                 s if s.starts_with('u') => format!(\"unsigned {}\", &s[1..]),\n  338 |                 s if s.starts_with('s') => format!(\"signed {}\", &s[1..]),\n  339 |                 s => s.to_string(),\n  340 |             }\n  341 |         }","lines":9,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/ctest/src/translator.rs#L333-L341"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The positive-#[cfg] detection for s! macros uses `meta_str.starts_with(\"not\")`, `starts_with(\"any\")`, `starts_with(\"all\")` and `starts_with(\"target_endian\")` on the stringified cfg tokens. These are prefix matches against bare identifiers, so a config predicate whose name merely begins with one of those words (e.g. `#[cfg(notarget)]`, `#[cfg(allow_foo)]`, `#[cfg(anything)]`) would be silently accepted as if it were a `not(...)`/`all(...)`/`any(...)` combinator, producing a false negative in the linter. Real cfg names like these are unlikely in libc today, but the check should match the combinator token, not a string prefix.","fix":"Parse the cfg meta with syn (Meta::List with path ident `not`/`any`/`all`) instead of doing `starts_with` on `tokens.to_string()`, or at minimum require the prefix to be followed by `(` / ` (`.","locations":[{"ref":"libc-test/tests/style_lib/mod.rs:272-284","code":"  272 |                 if !meta_str.starts_with(\"not\")\n  273 |                     && !meta_str.starts_with(\"any\")\n  274 |                     && !meta_str.starts_with(\"all\")\n  275 |                     && !meta_str.starts_with(\"target_endian\")\n  276 |                     && !ALLOWED_POSITIVE_S_CFGS.contains(&meta_str.as_str())\n  277 |                 {\n  278 |                     self.error(\n  279 |                         \"positive #[cfg] for s! macro\".to_string(),\n  280 |                         span,\n  281 |                         String::new(),\n  282 |                         (None, \"move it to the relevant file\".to_string()),\n  283 |                     );\n  284 |                 }","lines":13,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/libc-test/tests/style_lib/mod.rs#L272-L284"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"The duplicate-#[cfg] and positive-#[cfg] checks for s! macros only fire for the literal macro named `s` (`item_macro.mac.path.is_ident(\"s\")` in visit_item_macro). The other repeated macros `s_no_extra_traits` and `s_paren` are listed in ALLOWED_REPEATED_MACROS and treated as struct-state, but they are never passed to `handle_s_macro_with_attrs`. As a result a duplicated or standalone-positive `#[cfg]` on an `s_no_extra_traits!`/`s_paren!` block is not flagged, even though the same style rule logically applies.","fix":"Gate handle_s_macro_with_attrs on membership in ALLOWED_REPEATED_MACROS (the same set used in visit_macro) rather than only `is_ident(\"s\")`, if the cfg rules are meant to apply to all s-family macros.","locations":[{"ref":"libc-test/tests/style_lib/mod.rs:349-357","code":"  349 |     fn visit_item_macro(&mut self, item_macro: &'ast syn::ItemMacro) {\n  350 |         if item_macro.mac.path.is_ident(\"s\") {\n  351 |             if !item_macro.attrs.is_empty() {\n  352 |                 self.handle_s_macro_with_attrs(item_macro);\n  353 |             }\n  354 |         }\n  355 | \n  356 |         visit::visit_item_macro(self, item_macro);\n  357 |     }","lines":9,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/libc-test/tests/style_lib/mod.rs#L349-L357"},{"ref":"libc-test/tests/style_lib/mod.rs:248-287","code":"  248 |     fn handle_s_macro_with_attrs(&mut self, item_macro: &syn::ItemMacro) {\n  249 |         for attr in &item_macro.attrs {\n  250 |             let Ok(meta_list) = attr.meta.require_list() else {\n  251 |                 continue;\n  252 |             };\n  253 | \n  254 |             if meta_list.path.is_ident(\"cfg\") {\n  255 |                 let span = meta_list.span();\n  256 |                 let meta_str = meta_list.tokens.to_string();\n  257 | \n  258 |                 match self.seen_s_macro_cfgs.get(&meta_str) {\n  259 |                     Some(seen_span) => {\n  260 |                         self.error(\n  261 |                             \"duplicate #[cfg] for s! macro\".to_string(),\n  262 |                             span,\n  263 |                             \"duplicated #[cfg]\".to_string(),\n  264 |                             (Some(*seen_span), \"combine the two\".to_string()),\n  265 |                         );\n  266 |                     }\n  267 |                     None => {\n  268 |                         self.seen_s_macro_cfgs.insert(meta_str.clone(), span);\n  269 |                     }\n  270 |                 }\n  271 | \n  272 |                 if !meta_str.starts_with(\"not\")\n  273 |                     && !meta_str.starts_with(\"any\")\n  274 |                     && !meta_str.starts_with(\"all\")\n  275 |                     && !meta_str.starts_with(\"target_endian\")\n  276 |                     && !ALLOWED_POSITIVE_S_CFGS.contains(&meta_str.as_str())\n  277 |                 {\n  278 |                     self.error(\n  279 |                         \"positive #[cfg] for s! macro\".to_string(),\n  280 |                         span,\n  281 |                         String::new(),\n  282 |                         (None, \"move it to the relevant file\".to_string()),\n  283 |                     );\n  284 |                 }\n  285 |             }\n  286 |         }\n  287 |     }","lines":40,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/libc-test/tests/style_lib/mod.rs#L248-L287"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"After running the test binary via `adb shell`, the code asserts `status.success()` instead of `output.status.success()`. `status` is the exit status of the earlier `adb push` command (already asserted on line 29), so the assertion here is meaningless/always-true copy-paste and never validates that the `adb shell` invocation itself succeeded. The test-result heuristic below is the only thing checked.","fix":"Change the assertion to `assert!(output.status.success());`.","locations":[{"ref":"ci/runtest-android.rs:31-37","code":"   31 |     let output = Command::new(\"adb\")\n   32 |         .arg(\"shell\")\n   33 |         .arg(\"RUST_BACKTRACE=1\")\n   34 |         .arg(&dst)\n   35 |         .output()\n   36 |         .expect(\"failed to run: adb shell\");\n   37 |     assert!(status.success());","lines":7,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/ci/runtest-android.rs#L31-L37"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"The single test in errqueue.rs (which exercises libc::SO_EE_OFFENDER vs the C macro) is named `test_cmsg_data`, a copy-paste leftover from cmsg.rs. It has nothing to do with CMSG data; the misleading name makes test output and failure triage confusing.","fix":"Rename the test to `test_so_ee_offender`.","locations":[{"ref":"libc-test/tests/errqueue.rs:15-23","code":"   15 |     #[test]\n   16 |     fn test_cmsg_data() {\n   17 |         for l in 0..128 {\n   18 |             let ee = l as *const sock_extended_err;\n   19 |             unsafe {\n   20 |                 assert_eq!(libc::SO_EE_OFFENDER(ee), so_ee_offender(ee));\n   21 |             }\n   22 |         }\n   23 |     }","lines":9,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/libc-test/tests/errqueue.rs#L15-L23"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"The shellcheck-presence check catches only `sp.CalledProcessError`, but when shellcheck is not installed `subprocess` raises `FileNotFoundError`, which is not caught. The intended graceful 'ERROR: shellcheck not found' message and clean exit(1) never fire; instead the script dies with an unhandled traceback.","fix":"Catch `(sp.CalledProcessError, FileNotFoundError)` (or `OSError`) in the except clause.","locations":[{"ref":"ci/style.py:55-59","code":"   55 |     try:\n   56 |         run([\"shellcheck\", \"--version\"])\n   57 |     except sp.CalledProcessError:\n   58 |         eprint(\"ERROR: shellcheck not found\")\n   59 |         exit(1)","lines":5,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/ci/style.py#L55-L59"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`create-artifacts.py` assumes at least one `ctest_output.c` exists; if `glob` returns an empty list, `marker_files[0]` raises IndexError with no useful message. Since this script runs specifically when tests fail (and may run before any ctest build), an empty match is plausible.","fix":"Check `if not marker_files: sys.exit(...)` with a clear message before indexing.","locations":[{"ref":"ci/create-artifacts.py:21-24","code":"   21 |     marker_files = [Path(p) for p in glob(\"target/**/ctest_output.c\", recursive=True)]\n   22 |     marker_files.sort(key=lambda path: path.stat().st_mtime)\n   23 |     build_dir = marker_files[0].parent\n   24 |     print(f\"Located build directory '{build_dir}'\")","lines":4,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/ci/create-artifacts.py#L21-L24"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"GITHUB_ENV is opened with mode `\"w+\"`, which truncates the file. GITHUB_ENV is an append-only handoff file shared across steps; truncating it discards any variables exported by earlier steps. The convention is to append.","fix":"Open with mode `\"a\"` instead of `\"w+\"`.","locations":[{"ref":"ci/create-artifacts.py:54-56","code":"   54 |         with open(gh_env, \"w+\") as f:\n   55 |             f.write(f\"ARCHIVE_NAME={archive_name}\\n\")\n   56 |             f.write(f\"ARCHIVE_PATH={archive_path}\\n\")","lines":3,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/ci/create-artifacts.py#L54-L56"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In __run_test, when RUNNER is unset the binary is launched as `Command::new(test_binary)` and then `cmd.arg(test_binary)` appends the binary's own path as argv[1]. The compiled test main() ignores argv so it is currently harmless, but it is semantically wrong: the test process is invoked with itself as an argument. The single `cmd.arg(test_binary)` line is only correct for the RUNNER-set branch (where it is the argument to the runner program); it should not run for the no-runner branch.","fix":"Move `cmd.arg(test_binary.as_ref());` into the `else` branch (the RUNNER-set case) only, so the direct-execution path runs the binary with no spurious self-argument.","locations":[{"ref":"ctest/src/runner.rs:173-185","code":"  173 | pub fn __run_test<P: AsRef<Path>>(test_binary: P) -> Result<String> {\n  174 |     let runner = env::var(\"RUNNER\").unwrap_or_default();\n  175 |     let mut cmd;\n  176 |     if runner.is_empty() {\n  177 |         cmd = Command::new(test_binary.as_ref());\n  178 |     } else {\n  179 |         let mut args = runner.split_whitespace();\n  180 |         cmd = Command::new(args.next().unwrap());\n  181 |         cmd.args(args);\n  182 |     }\n  183 | \n  184 |     cmd.arg(test_binary.as_ref());\n  185 |     let output = cmd.output()?;","lines":13,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/ctest/src/runner.rs#L173-L185"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"negligible","difficulty":"easy","description":"`run.sh` parses `env`/`bits` from `rustc --print cfg` via a pipeline `rustc ... | sed ...`. Under `set -eu` (no pipefail) a failing `rustc` is masked and `env`/`bits` become empty, silently skipping the gnu 32-bit extra test matrix rather than failing. Low impact since rustc failing is unlikely, but it would silently reduce coverage.","fix":"Add pipefail handling or capture rustc output once and check it before sed.","locations":[{"ref":"ci/run.sh:49-50","code":"   49 | env=\"$(rustc --print cfg --target \"$target\" | sed -n 's/target_env=\"\\(.*\\)\"/\\1/p')\"\n   50 | bits=\"$(rustc --print cfg --target \"$target\" | sed -n 's/target_pointer_width=\"\\(.*\\)\"/\\1/p')\"","lines":2,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/ci/run.sh#L49-L50"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"expand(), __compile_test() and __run_test() build commands by passing env-var strings (RUNNER, FLAGS) through split_whitespace and interpolating LINKER/TARGET directly. RUNNER is split on whitespace and the first token becomes the program, but quoting is not handled, so a runner path containing spaces, or runner args needing quoting, cannot be expressed. Same for FLAGS. This is a usability/correctness limitation for cross-compilation setups (e.g. a wrapper script with a spaced path).","fix":"Document that these env vars are whitespace-split with no quoting, or parse them with a shell-words style splitter that honors quoting.","locations":[{"ref":"ctest/src/runner.rs:174-182","code":"  174 |     let runner = env::var(\"RUNNER\").unwrap_or_default();\n  175 |     let mut cmd;\n  176 |     if runner.is_empty() {\n  177 |         cmd = Command::new(test_binary.as_ref());\n  178 |     } else {\n  179 |         let mut args = runner.split_whitespace();\n  180 |         cmd = Command::new(args.next().unwrap());\n  181 |         cmd.args(args);\n  182 |     }","lines":9,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/ctest/src/runner.rs#L174-L182"},{"ref":"ctest/src/runner.rs:155-158","code":"  155 |     let flags = env::var(\"FLAGS\").unwrap_or_default();\n  156 |     if !flags.is_empty() {\n  157 |         cmd.args(flags.split_whitespace());\n  158 |     }","lines":4,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/ctest/src/runner.rs#L155-L158"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`TranslateHelper::c_type` uses `panic!` for six `MapInput` variants it considers illegal (StructType/UnionType/CEnumType/StructFieldType/UnionFieldType/Type) and `unimplemented!()` for `MapInput::Fn`. These are internal-invariant guards, but they are reachable purely through programmer error within the crate and abort the whole build with no context about which item triggered it. A returned error (or a typed-narrower input) would be safer than seven panic arms.","fix":"Narrow the accepted input type so illegal variants are unrepresentable, or return a `TranslationError` describing the offending variant/ident instead of panicking.","locations":[{"ref":"ctest/src/template.rs:692-714","code":"  692 |     pub(crate) fn c_type(&self, item: impl Into<MapInput<'a>>) -> Result<String, TranslationError> {\n  693 |         let item: MapInput = item.into();\n  694 | \n  695 |         let (ident, ty) = match item {\n  696 |             MapInput::Const(c) => (c.ident(), self.translator.translate_type(&c.ty)?),\n  697 |             MapInput::StructField(_, f) => (f.ident(), self.translator.translate_type(&f.ty)?),\n  698 |             MapInput::UnionField(_, f) => (f.ident(), self.translator.translate_type(&f.ty)?),\n  699 |             MapInput::Static(s) => (s.ident(), self.translator.translate_type(&s.ty)?),\n  700 |             // For functions, their type would be a bare fn signature, which would need to be saved\n  701 |             // inside of `Fn` when parsed.\n  702 |             MapInput::Fn(_) => unimplemented!(),\n  703 |             // For structs/unions/aliases, their type is the same as their identifier.\n  704 |             MapInput::Alias(a) => (a.ident(), cdecl::named(a.ident(), Constness::Mut)),\n  705 |             MapInput::Struct(s) => (s.ident(), cdecl::named(s.ident(), Constness::Mut)),\n  706 |             MapInput::Union(u) => (u.ident(), cdecl::named(u.ident(), Constness::Mut)),\n  707 | \n  708 |             MapInput::StructType(_) => panic!(\"MapInput::StructType is not allowed!\"),\n  709 |             MapInput::UnionType(_) => panic!(\"MapInput::UnionType is not allowed!\"),\n  710 |             MapInput::CEnumType(_) => panic!(\"MapInput::CEnumType is not allowed!\"),\n  711 |             MapInput::StructFieldType(_, _) => panic!(\"MapInput::StructFieldType is not allowed!\"),\n  712 |             MapInput::UnionFieldType(_, _) => panic!(\"MapInput::UnionFieldType is not allowed!\"),\n  713 |             MapInput::Type(_) => panic!(\"MapInput::Type is not allowed!\"),\n  714 |         };","lines":23,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/ctest/src/template.rs#L692-L714"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"high","difficulty":"medium","description":"All test generation work is performed twice. `generate_files` constructs a `RustTestTemplate` and a `CTestTemplate` separately, and each one's `::new` calls `TestTemplate::new`, which builds the complete set of tests from scratch (every populate_* pass over all aliases/structs/unions/constants/functions/statics). The two `TestTemplate`s are identical, so the entire translation/iteration pipeline runs twice for every build. For libc-sized inputs (thousands of items) this roughly doubles generation time.","fix":"Build the shared `TestTemplate` once in `generate_files` (or cache it) and pass/clone it into both `RustTestTemplate` and `CTestTemplate`, instead of recomputing it inside each template's `new`.","locations":[{"ref":"ctest/src/template.rs:33-42","code":"   33 | impl RustTestTemplate {\n   34 |     pub(crate) fn new(\n   35 |         ffi_items: &FfiItems,\n   36 |         generator: &TestGenerator,\n   37 |     ) -> Result<Self, TranslationError> {\n   38 |         Ok(Self {\n   39 |             template: TestTemplate::new(ffi_items, generator)?,\n   40 |             extern_keyword: \"extern\".into(),\n   41 |         })\n   42 |     }","lines":10,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/ctest/src/template.rs#L33-L42"},{"ref":"ctest/src/template.rs:68-78","code":"   68 | impl CTestTemplate {\n   69 |     pub(crate) fn new(\n   70 |         ffi_items: &FfiItems,\n   71 |         generator: &TestGenerator,\n   72 |     ) -> Result<Self, TranslationError> {\n   73 |         Ok(Self {\n   74 |             template: TestTemplate::new(ffi_items, generator)?,\n   75 |             headers: generator.headers.clone(),\n   76 |         })\n   77 |     }\n   78 | }","lines":11,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/ctest/src/template.rs#L68-L78"},{"ref":"ctest/src/generator.rs:1139-1161","code":" 1139 |         let mut rust_file = RustTestTemplate::new(&ffi_items, self)?\n 1140 |             .edition(self.edition.unwrap_or(DEFAULT_EDITION))\n 1141 |             .render()\n 1142 |             .map_err(GenerationError::RustTemplateRender)?;\n 1143 |         ensure_trailing_newline(&mut rust_file);\n 1144 | \n 1145 |         // Generate the Rust side of the tests.\n 1146 |         File::create(output_file_path.with_extension(\"rs\"))\n 1147 |             .map_err(GenerationError::OsError)?\n 1148 |             .write_all(rust_file.as_bytes())\n 1149 |             .map_err(GenerationError::OsError)?;\n 1150 | \n 1151 |         let mut c_file = CTestTemplate::new(&ffi_items, self)?\n 1152 |             .render()\n 1153 |             .map_err(GenerationError::CTemplateRender)?;\n 1154 |         ensure_trailing_newline(&mut c_file);\n 1155 | \n 1156 |         // Generate the C/Cxx side of the tests.\n 1157 |         let c_output_path = output_file_path.with_extension(self.language.extension());\n 1158 |         File::create(&c_output_path)\n 1159 |             .map_err(GenerationError::OsError)?\n 1160 |             .write_all(c_file.as_bytes())\n 1161 |             .map_err(GenerationError::OsError)?;","lines":23,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/ctest/src/generator.rs#L1139-L1161"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`TranslateHelper::new` does `filtered_ffi_items: ffi_items.clone()`, deep-cloning the entire `FfiItems` collection (all structs, unions, fields, constants, etc.) so it can run `extract_if` to drop skipped items. Combined with the double construction above, the full FFI item set is cloned twice per generation. The clone exists only to allow in-place filtering of a borrowed input.","fix":"Filter without owning a full copy: collect references/indices of retained items, or compute the skip predicate lazily at iteration time in the populate_* methods, rather than cloning all items up front.","locations":[{"ref":"ctest/src/template.rs:610-621","code":"  610 | impl<'a> TranslateHelper<'a> {\n  611 |     /// Create a new translation helper.\n  612 |     pub(crate) fn new(ffi_items: &'a FfiItems, generator: &'a TestGenerator) -> Self {\n  613 |         let mut helper = Self {\n  614 |             filtered_ffi_items: ffi_items.clone(),\n  615 |             generator,\n  616 |             translator: Translator::new(ffi_items, generator),\n  617 |         };\n  618 |         helper.filter_ffi_items();\n  619 | \n  620 |         helper\n  621 |     }","lines":12,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/ctest/src/template.rs#L610-L621"},{"ref":"ctest/src/template.rs:627-684","code":"  627 |     fn filter_ffi_items(&mut self) {\n  628 |         let verbose = self.generator.verbose_skip;\n  629 | \n  630 |         let skipped = self.filtered_ffi_items.aliases.extract_if(.., |alias| {\n  631 |             self.generator\n  632 |                 .skips\n  633 |                 .iter()\n  634 |                 .any(|f| f(&MapInput::CEnumType(alias.ident())))\n  635 |         });\n  636 | \n  637 |         for item in skipped {\n  638 |             if verbose {\n  639 |                 eprintln!(\"Skipping C enum type {}\", item.ident());\n  640 |             }\n  641 |         }\n  642 | \n  643 |         let skipped = self\n  644 |             .filtered_ffi_items\n  645 |             .constants\n  646 |             .extract_if(.., |constant| {\n  647 |                 self.generator.skips.iter().any(|f| {\n  648 |                     f(&MapInput::CEnumType(\n  649 |                         &constant.ty.to_token_stream().to_string(),\n  650 |                     ))\n  651 |                 })\n  652 |             });\n  653 | \n  654 |         for item in skipped {\n  655 |             if verbose {\n  656 |                 eprintln!(\"Skipping C enum constant {}\", item.ident());\n  657 |             }\n  658 |         }\n  659 | \n  660 |         macro_rules! filter {\n  661 |             ($field:ident, $variant:ident, $label:literal) => {{\n  662 |                 let skipped = self.filtered_ffi_items.$field.extract_if(.., |item| {\n  663 |                     (self.generator.skip_private && !item.public)\n  664 |                         || self\n  665 |                             .generator\n  666 |                             .skips\n  667 |                             .iter()\n  668 |                             .any(|f| f(&MapInput::$variant(item)))\n  669 |                 });\n  670 |                 for item in skipped {\n  671 |                     if verbose {\n  672 |                         eprintln!(\"Skipping {} \\\"{}\\\"\", $label, item.ident())\n  673 |                     }\n  674 |                 }\n  675 |             }};\n  676 |         }\n  677 | \n  678 |         filter!(aliases, Alias, \"alias\");\n  679 |         filter!(constants, Const, \"const\");\n  680 |         filter!(structs, Struct, \"struct\");\n  681 |         filter!(unions, Union, \"union\");\n  682 |         filter!(foreign_functions, Fn, \"fn\");\n  683 |         filter!(foreign_statics, Static, \"static\");\n  684 |     }","lines":58,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/ctest/src/template.rs#L627-L684"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"contains_struct / contains_union do a linear O(n) scan of the structs/unions Vec on every call. If these are invoked per-item during generation (e.g. to resolve a field type against known structs), overall behavior is O(n*m). For libc's thousands of types this is measurable. The collections are append-only after parsing.","fix":"Build a HashSet<BoxStr> of struct/union idents once after collection and use it for membership checks, or memoize.","locations":[{"ref":"ctest/src/ffi_items.rs:41-50","code":"   41 |     pub(crate) fn contains_struct(&self, ident: &str) -> bool {\n   42 |         self.structs()\n   43 |             .iter()\n   44 |             .any(|structure| structure.ident() == ident)\n   45 |     }\n   46 | \n   47 |     /// Return whether the type has parsed a union with the given identifier.\n   48 |     pub(crate) fn contains_union(&self, ident: &str) -> bool {\n   49 |         self.unions().iter().any(|union| union.ident() == ident)\n   50 |     }","lines":10,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/ctest/src/ffi_items.rs#L41-L50"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"Every populate_* method builds a `Test*` struct, then pushes a clone of it (`self.xxx.push(item.clone())`) only so it can read `item.test_name` afterwards to push into `test_idents`. This clones each test struct (including its `Field`/`Vec<Field>` for the field/roundtrip tests) once per item, purely to retain the name. This pattern is repeated in nearly every populate method.","fix":"Push `test_name.clone()` (a single BoxStr) into `test_idents` before moving `item` into its vec, or push `item` and read `self.xxx.last().unwrap().test_name.clone()`. Avoids cloning the whole struct.","locations":[{"ref":"ctest/src/template.rs:133-134","code":"  133 |                 self.const_cstr_tests.push(item.clone());\n  134 |                 self.test_idents.push(item.test_name);","lines":2,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/ctest/src/template.rs#L133-L134"},{"ref":"ctest/src/template.rs:144-145","code":"  144 |                 self.const_tests.push(item.clone());\n  145 |                 self.test_idents.push(item.test_name);","lines":2,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/ctest/src/template.rs#L144-L145"},{"ref":"ctest/src/template.rs:166-167","code":"  166 |             self.size_align_tests.push(item.clone());\n  167 |             self.test_idents.push(item.test_name);","lines":2,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/ctest/src/template.rs#L166-L167"},{"ref":"ctest/src/template.rs:272-273","code":"  272 |             self.field_size_offset_tests.push(item.clone());\n  273 |             self.test_idents.push(item.test_name);","lines":2,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/ctest/src/template.rs#L272-L273"},{"ref":"ctest/src/template.rs:327-328","code":"  327 |             self.roundtrip_tests.push(item.clone());\n  328 |             self.test_idents.push(item.test_name);","lines":2,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/ctest/src/template.rs#L327-L328"},{"ref":"ctest/src/template.rs:415-416","code":"  415 |             self.field_ptr_tests.push(item.clone());\n  416 |             self.test_idents.push(item.test_name);","lines":2,"link":"https://github.com/rust-lang/libc/blob/df6561676506cd9c36ebe84b3b2f000661b64767/ctest/src/template.rs#L415-L416"}]},

<script>
(function(){

// Data
const FINDINGS     = JSON.parse(document.getElementById('D').textContent);
const PROJECT_INFO = JSON.parse(document.getElementById('PI').textContent);

// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};
const PRESENT_DIFFS = DIFFICULTY_ORDER.filter(d => FINDINGS.some(f => f.difficulty === d));
const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

  hiddenSev: new Set(), hiddenType: new Set(),

// URL hash — debounced so rapid filter changes don't thrash history

    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));

  const p = new URLSearchParams(location.hash.slice(1));
