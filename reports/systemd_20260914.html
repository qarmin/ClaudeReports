{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"very_easy","description":"In `detect_vm_smbios()` the SMBIOS structure length byte is tested via `s[1] < 20` where `s` is a `char*`. On platforms where `char` is signed, a length byte with the high bit set (value >= 0x80) becomes negative and the comparison spuriously succeeds, causing the function to return `SMBIOS_VM_BIT_UNKNOWN`. Note the sibling access at line 247 correctly casts to `uint8_t` (`uint8_t byte = (uint8_t) s[19];`), so this is an inconsistency. Impact is negligible because `UNKNOWN` is a safe fallback (the caller then uses the product-name heuristic), but the signed comparison is incorrect.","fix":"Cast to `uint8_t` for the length check. Before:\n```\nif (readsize < 20 || s[1] < 20) {\n```\nAfter:\n```\nif (readsize < 20 || (uint8_t) s[1] < 20) {\n```","locations":[{"ref":"src/basic/virt.c:238","code":"  238 |         if (readsize < 20 || s[1] < 20) {","lines":1,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/virt.c#L238"}]},
{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"very_easy","description":"In the line-by-line IMA policy fallback, the error message concatenates the `IMA_POLICY_PATH` literal directly with the `%u` line-number conversion, producing a garbled string like `Failed to load the IMA custom policy file /etc/ima/ima-policy5: ...` (the line number `5` is glued onto the path with no separating text). The intent was clearly to report the failing line number.","fix":"Add a separator/label for the line number. Before:\n```c\nif (len > 0 && write(imafd, line, len) < 0)\n        return log_error_errno(errno, \"Failed to load the IMA custom policy file \"IMA_POLICY_PATH\"%u: %m\",\n                               lineno);\n```\nAfter:\n```c\nif (len > 0 && write(imafd, line, len) < 0)\n        return log_error_errno(errno, \"Failed to load the IMA custom policy file \"IMA_POLICY_PATH\" (line %u): %m\",\n                               lineno);\n```","locations":[{"ref":"src/core/ima-setup.c:80-82","code":"   80 |                 if (len > 0 && write(imafd, line, len) < 0)\n   81 |                         return log_error_errno(errno, \"Failed to load the IMA custom policy file \"IMA_POLICY_PATH\"%u: %m\",\n   82 |                                                lineno);","lines":3,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/core/ima-setup.c#L80-L82"}]},
{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"very_easy","description":"In `transfer_image_common()`, the initial progress bar is drawn with `c.progress` (a fraction in the range 0..1) whereas every other call site scales it to a percentage with `c->progress * 100` (see `match_log_message` and `match_progress_update`). The value here is always 0 at this point, so the rendered bar is coincidentally correct, but the expression is inconsistent with the rest of the file and would render 100x too small if `c.progress` were ever nonzero here.","fix":"Use the same scaling as the other call sites:\n```c\ndraw_progress_bar(PROGRESS_PREFIX, c.progress * 100);\n```","locations":[{"ref":"src/import/importctl.c:258","code":"  258 |                 draw_progress_bar(PROGRESS_PREFIX, c.progress);","lines":1,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/import/importctl.c#L258"}]},
{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"very_easy","description":"The `E2BIG` diagnostic for exceeding the layer limit prints `i->n_layers` (the current count, which at this point equals `LAYER_MAX`) instead of the actual limit `LAYER_MAX`, so the message `\"Too many layers in manifest (> 4096)\"` reflects the counter rather than the configured cap and would be wrong if the check were ever changed to a different threshold.","fix":"Print the constant instead of the counter:\n```c\n                if (i->n_layers >= LAYER_MAX)\n                        return log_error_errno(SYNTHETIC_ERRNO(E2BIG), \"Too many layers in manifest (> %u), refusing.\", LAYER_MAX);\n```","locations":[{"ref":"src/import/pull-oci.c:848-849","code":"  848 |                 if (i->n_layers >= LAYER_MAX)\n  849 |                         return log_error_errno(SYNTHETIC_ERRNO(E2BIG), \"Too many layers in manifest (> %zu), refusing.\", i->n_layers);","lines":2,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/import/pull-oci.c#L848-L849"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In `src/basic/escape.c`, `decescape()` and its sibling `octescape_full()` are near-identical implementations (decimal vs octal escaping), but `decescape()` was copy-pasted without preserving the `bad &&` NULL-guard. `octescape_full()` at line 481 correctly checks `(bad && strchr(bad, u))`, while `decescape()` at line 514 calls `strchr(bad, u)` unconditionally. `decescape()`'s prototype (`char* decescape(const char *s, size_t len, const char *bad) _nonnull_if_nonzero_(1, 2);`) does not mark `bad` as non-null, and unlike `octescape()` there is no `static inline` wrapper defaulting `bad` to `NULL`, so nothing at the API level prevents a future caller from passing `bad = NULL`, which would immediately call `strchr(NULL, u)` and crash. All current in-tree callers happen to pass a non-NULL `bad`, so this is currently latent, but the asymmetry with `octescape_full()` is a real inconsistency introduced during the copy.","fix":"Add the same guard used in `octescape_full()`. Change:\n\n```c\nif (u < ' ' || u >= 127 || IN_SET(u, '\\\\', '\"') || strchr(bad, u)) {\n```\n\nto:\n\n```c\nif (u < ' ' || u >= 127 || IN_SET(u, '\\\\', '\"') || (bad && strchr(bad, u))) {\n```","locations":[{"ref":"src/basic/escape.c:481","code":"  481 |                 if (u < ' ' || u >= 127 || IN_SET(u, '\\\\', '\"') || (bad && strchr(bad, u))) {","lines":1,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/escape.c#L481"},{"ref":"src/basic/escape.c:514","code":"  514 |                 if (u < ' ' || u >= 127 || IN_SET(u, '\\\\', '\"') || strchr(bad, u)) {","lines":1,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/escape.c#L514"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In `bus_socket_set_transient_property()` the handler for the SMACK IP-input label compares the incoming property name against `\"SmackLabelIPin\"` (lowercase `i` in `IPin`). Every other place spells this property `\"SmackLabelIPIn\"`: the vtable getter at `src/core/dbus-socket.c:136` (`SD_BUS_PROPERTY(\"SmackLabelIPIn\", ...)`), the client-side setter table in `src/shared/bus-unit-util.c:2830`, the config parser (`load-fragment-gperf.gperf.in` `Socket.SmackLabelIPIn`), and the docs. Because clients (e.g. `systemctl`, `StartTransientUnit`) send the name `\"SmackLabelIPIn\"`, the `streq()` never matches, the function falls through returning `0`, and the caller ultimately rejects the request as an unknown/unsettable property. As a result `SmackLabelIPIn=` cannot be set on transient socket units at all, while the analogous `SmackLabelIPOut` (line 380) works. This silently drops a security-relevant SMACK label.","fix":"Fix the string literal to match the actual property name. Before:\n```c\nif (streq(name, \"SmackLabelIPin\"))\n        return bus_set_transient_string(u, name, &s->smack_ip_in, message, flags, reterr_error);\n```\nAfter:\n```c\nif (streq(name, \"SmackLabelIPIn\"))\n        return bus_set_transient_string(u, name, &s->smack_ip_in, message, flags, reterr_error);\n```","locations":[{"ref":"src/core/dbus-socket.c:381-382","code":"  381 |         if (streq(name, \"SmackLabelIPin\"))\n  382 |                 return bus_set_transient_string(u, name, &s->smack_ip_in, message, flags, reterr_error);","lines":2,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/core/dbus-socket.c#L381-L382"}]},
{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `usb_classes()` the protocol-level filter guards on `klass != '00'` instead of `protocol != '00'`. The klass loop uses `klass != '00'`, the subclass loop uses `subclass != '00'`, so by the established pattern the protocol loop should test the current-level variable `protocol`. As written, for any non-`00` class every protocol (including the generic `00` protocol) is emitted, while for class `00` no protocol entries are emitted at all - an asymmetry versus the subclass handling that looks like a copy-paste slip carried over from the subclass block.","fix":"Change the protocol guard to test `protocol`:\n```python\nfor protocol_group in subclass_group.PROTOCOLS:\n    protocol = protocol_group.protocol.upper()\n    text = protocol_group.name.strip()\n    if protocol != '00' and not re.match(r'(\\?|None|Unused)\\s*$', text):\n        add_item(items, (klass, subclass, protocol), text)\n```","locations":[{"ref":"hwdb.d/ids_parser.py:215-219","code":"  215 |             for protocol_group in subclass_group.PROTOCOLS:\n  216 |                 protocol = protocol_group.protocol.upper()\n  217 |                 text = protocol_group.name.strip()\n  218 |                 if klass != '00' and not re.match(r'(\\?|None|Unused)\\s*$', text):\n  219 |                     add_item(items, (klass, subclass, protocol), text)","lines":5,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/hwdb.d/ids_parser.py#L215-L219"}]},
{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"The `CapabilityBoundingSet=~CAP_NET_(BIND_SERVICE|BROADCAST|RAW)` entry in `security_assessor_table` has `.json_field = \"CapabilityBoundingSet_CAP_NET_BIND_SERVICE_BROADCAST_RAW)\"` — note the stray trailing `)` copied over from the adjacent `.id` string (which legitimately contains parentheses). Every other `.json_field` in the table is a clean identifier; this one produces a malformed JSON object key when `systemd-analyze security --json=…` output is generated for this check.","fix":"Remove the stray closing parenthesis:\n\n```c\n// before\n.json_field = \"CapabilityBoundingSet_CAP_NET_BIND_SERVICE_BROADCAST_RAW)\",\n// after\n.json_field = \"CapabilityBoundingSet_CAP_NET_BIND_SERVICE_BROADCAST_RAW\",\n```","locations":[{"ref":"src/analyze/analyze-security.c:1152","code":" 1152 |                 .json_field = \"CapabilityBoundingSet_CAP_NET_BIND_SERVICE_BROADCAST_RAW)\",","lines":1,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/analyze/analyze-security.c#L1152"}]},
{"id":"CPY_5","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"When `oci_image_is_valid(image)` fails, the diagnostic logs the wrong variable: it prints `registry` instead of `image`. In the common case where the ref has no `/` (no registry), `registry` is `NULL`, so the message reports `(null)` (or the unrelated registry substring) rather than the offending image name. Copy-paste from the registry-validation branch just above.","fix":"Log the actual offending value:\n\nBefore:\n```c\nif (!oci_image_is_valid(image))\n        return log_debug_errno(SYNTHETIC_ERRNO(EINVAL), \"OCI image specification '%s' is not valid.\", registry);\n```\nAfter:\n```c\nif (!oci_image_is_valid(image))\n        return log_debug_errno(SYNTHETIC_ERRNO(EINVAL), \"OCI image specification '%s' is not valid.\", image);\n```","locations":[{"ref":"src/import/oci-util.c:144-145","code":"  144 |         if (!oci_image_is_valid(image))\n  145 |                 return log_debug_errno(SYNTHETIC_ERRNO(EINVAL), \"OCI image specification '%s' is not valid.\", registry);","lines":2,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/import/oci-util.c#L144-L145"}]},
{"id":"CPY_6","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In the `overrideImage` branch of `oci_ref_normalize()`, the debug log prints `data.override_registry` for the new image name instead of `data.override_image`. Since this branch is entered because `data.override_image` is set (and `data.override_registry` may well be NULL/unrelated here), the message is wrong/misleading.","fix":"Before:\n```c\nlog_debug(\"Overriding image to '%s' (was '%s') based on OCI registry database.\", data.override_registry, *image);\n```\nAfter:\n```c\nlog_debug(\"Overriding image to '%s' (was '%s') based on OCI registry database.\", data.override_image, *image);\n```","locations":[{"ref":"src/import/oci-util.c:281-282","code":"  281 |         if (data.override_image) {\n  282 |                 log_debug(\"Overriding image to '%s' (was '%s') based on OCI registry database.\", data.override_registry, *image);","lines":2,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/import/oci-util.c#L281-L282"}]},
{"id":"CPY_7","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"very_easy","description":"In `config_parse_mount_images`, the single-mount-options branch (`r == 1`) resolves specifiers in the variable `partition` (which in this branch holds the mount-options string), but the failure `log_syntax` message prints the unrelated variable `first` (the source image path). The sibling function `config_parse_extension_images` handles the identical case correctly by printing `partition` (line 5551). This is an inconsistently-edited duplicate: the user sees the wrong (misleading) string in the warning. No functional impact beyond the log text.","fix":"Print the variable actually being resolved, matching the sibling parser. Before:\n```c\nr = unit_full_printf(u, partition, &mount_options_resolved);\nif (r < 0) {\n        log_syntax(unit, LOG_WARNING, filename, line, r, \"Failed to resolve unit specifiers in %s, ignoring: %m\", first);\n        continue;\n}\n```\nAfter:\n```c\nr = unit_full_printf(u, partition, &mount_options_resolved);\nif (r < 0) {\n        log_syntax(unit, LOG_WARNING, filename, line, r, \"Failed to resolve unit specifiers in %s, ignoring: %m\", partition);\n        continue;\n}\n```","locations":[{"ref":"src/core/load-fragment.c:5409-5412","code":" 5409 |                                 r = unit_full_printf(u, partition, &mount_options_resolved);\n 5410 |                                 if (r < 0) {\n 5411 |                                         log_syntax(unit, LOG_WARNING, filename, line, r, \"Failed to resolve unit specifiers in %s, ignoring: %m\", first);\n 5412 |                                         continue;","lines":4,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/core/load-fragment.c#L5409-L5412"}]},
{"id":"CPY_8","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"very_easy","description":"`coredump_context_build_iovw()` formats the GID field `COREDUMP_GID=` with `UID_FMT` instead of `GID_FMT`. Both macros currently expand to `\"%\" PRIu32` so there is no runtime effect today, but it is a copy-paste inconsistency (the adjacent UID line uses `UID_FMT` correctly) that would break silently if the two format macros ever diverged.","fix":"Use `GID_FMT` for the GID field.\n\nBefore:\n```c\n        r = iovw_put_string_fieldf(&context->iovw, \"COREDUMP_GID=\", UID_FMT, context->gid);\n```\nAfter:\n```c\n        r = iovw_put_string_fieldf(&context->iovw, \"COREDUMP_GID=\", GID_FMT, context->gid);\n```","locations":[{"ref":"src/coredump/coredump-context.c:246","code":"  246 |         r = iovw_put_string_fieldf(&context->iovw, \"COREDUMP_GID=\", UID_FMT, context->gid);","lines":1,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/coredump/coredump-context.c#L246"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"In `verb_critical_chain`, the return value of `list_dependencies()` is discarded both in the `STRV_FOREACH` loop over user-supplied unit names and in the single-argument fallback call. `list_dependencies()` can return negative errors (e.g. from `sd_bus_get_property`, `sd_bus_message_read`, or OOM inside `list_dependencies_one`), but since the result is never checked, `verb_critical_chain` always falls through to `return EXIT_SUCCESS`. This means `systemd-analyze critical-chain` can silently fail (print nothing or a partial chain) while still reporting a successful exit code, which is misleading for scripts/automation relying on the exit status.","fix":"Capture and propagate the error, e.g. using `RET_GATHER`:\n\n```c\nint r = 0;\n\nif (argc > 1)\n        STRV_FOREACH(name, strv_skip(argv, 1))\n                RET_GATHER(r, list_dependencies(bus, *name));\nelse\n        RET_GATHER(r, list_dependencies(bus, SPECIAL_DEFAULT_TARGET));\n\nreturn r < 0 ? r : EXIT_SUCCESS;\n```","locations":[{"ref":"src/analyze/analyze-critical-chain.c:236-242","code":"  236 |         if (argc > 1)\n  237 |                 STRV_FOREACH(name, strv_skip(argv, 1))\n  238 |                         list_dependencies(bus, *name);\n  239 |         else\n  240 |                 list_dependencies(bus, SPECIAL_DEFAULT_TARGET);\n  241 | \n  242 |         return EXIT_SUCCESS;","lines":7,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/analyze/analyze-critical-chain.c#L236-L242"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"very_easy","description":"In `verb_set()` for the `STATUS_INDETERMINATE` case, when `left == 0` the code does `return log_error_errno(r, \"...cannot reset to indeterminate.\")`, but at this point `r` is `0` (last set by the successful `make_bad()`/`make_good()`/`acquire_path()` calls). `log_error_errno` expands to `log_full_errno`, which runs `ASSERT_NON_ZERO(_error)` - in developer builds (`BUILD_MODE_DEVELOPER`) this `assert((x) != 0)` aborts (panic). In production `log_full_errno_zerook` returns `-ESTRPIPE` (since the passed error is `0`), so the intended failure is reported with a nonsensical errno instead of a real error. Reachable by running `systemd-bless-boot indeterminate` on a boot whose `tries left` counter is already `0` (previously marked bad).","fix":"Use a synthetic errno instead of the stale `r`. Before:\n```\nif (left == 0)\n        return log_error_errno(r, \"Current boot entry was already marked bad in a previous boot, cannot reset to indeterminate.\");\n```\nAfter:\n```\nif (left == 0)\n        return log_error_errno(SYNTHETIC_ERRNO(EUNATCH), \"Current boot entry was already marked bad in a previous boot, cannot reset to indeterminate.\");\n```","locations":[{"ref":"src/bless-boot/bless-boot.c:488-489","code":"  488 |                 if (left == 0)\n  489 |                         return log_error_errno(r, \"Current boot entry was already marked bad in a previous boot, cannot reset to indeterminate.\");","lines":2,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/bless-boot/bless-boot.c#L488-L489"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"very_easy","description":"Two error paths call `log_error_errno(r, ...)` passing the stale, non-negative return value `r` of a previous successful call instead of `errno`, even though the failing syscall (`fstat`/`fsync`) set `errno`. Because of `log_full_errno` semantics, when `r` is `0` this aborts in developer builds (`ASSERT_NON_ZERO`) and in production returns `-ESTRPIPE` rather than the real error; when `r` is a positive success code (e.g. `1`) it feeds a bogus positive value to the logger. At homework-luks.c:2571 this is on the final `fsync()` of a freshly created home image: an `fsync` failure (e.g. `EIO`, `ENOSPC`) is not propagated as the correct error, so `home_create_luks()` can wrongly report success with data not durably synced. The `%m` text is still correct (it reads `errno`), which masks the fact that the returned value is wrong.","fix":"Pass `errno` (the value set by the failing syscall) instead of `r`.\n\nAt line 1350:\n```c\n// before\nif (fstat(setup->loop->fd, &st) < 0)\n        return log_error_errno(r, \"Failed to stat block device %s: %m\", n);\n// after\nif (fstat(setup->loop->fd, &st) < 0)\n        return log_error_errno(errno, \"Failed to stat block device %s: %m\", n);\n```\n\nAt line 2571:\n```c\n// before\nif (fsync(setup->image_fd) < 0)\n        return log_error_errno(r, \"Failed to synchronize image to disk: %m\");\n// after\nif (fsync(setup->image_fd) < 0)\n        return log_error_errno(errno, \"Failed to synchronize image to disk: %m\");\n```","locations":[{"ref":"src/home/homework-luks.c:1349-1350","code":" 1349 |                         if (fstat(setup->loop->fd, &st) < 0)\n 1350 |                                 return log_error_errno(r, \"Failed to stat block device %s: %m\", n);","lines":2,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/home/homework-luks.c#L1349-L1350"},{"ref":"src/home/homework-luks.c:2572-2573","code":" 2572 |         if (fsync(setup->image_fd) < 0)\n 2573 |                 return log_error_errno(r, \"Failed to synchronize image to disk: %m\");","lines":2,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/home/homework-luks.c#L2572-L2573"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"In `apply_elf_relative_relocation()` the target section for a relocation is located with `[target] = [pe_s for pe_s in sections if pe_s.VirtualAddress <= reloc['r_offset'] < pe_s.VirtualAddress + len(pe_s.data)]`. This list-unpacking assumes exactly one `PeSection` matches `reloc['r_offset']`. `elf2efi.py` explicitly exists to process build artifacts (untrusted/malformed ELF input per the module docstring), and a relocation entry whose `r_offset` falls outside every copied section (e.g. pointing into an ignored/stripped section, or into a padding gap) yields zero matches, while a crafted/corrupt ELF with overlapping section VMAs could yield more than one. Either case raises a bare `ValueError: not enough values to unpack` / `too many values to unpack` from the tuple-unpacking, instead of the module's own `BadSectionError` used consistently elsewhere for malformed input, giving a confusing crash instead of a diagnosable error.","fix":"Validate the match count explicitly instead of relying on list-unpack to enforce it:\n```python\ntargets = [\n    pe_s\n    for pe_s in sections\n    if pe_s.VirtualAddress <= reloc['r_offset'] < pe_s.VirtualAddress + len(pe_s.data)\n]\nif len(targets) != 1:\n    raise BadSectionError(\n        f'Relocation r_offset {reloc[\"r_offset\"]:#x} does not map to exactly one section'\n    )\ntarget = targets[0]\n```","locations":[{"ref":"tools/elf2efi.py:387-391","code":"  387 |     [target] = [\n  388 |         pe_s\n  389 |         for pe_s in sections\n  390 |         if pe_s.VirtualAddress <= reloc['r_offset'] < pe_s.VirtualAddress + len(pe_s.data)\n  391 |     ]","lines":5,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/tools/elf2efi.py#L387-L391"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"In `parse_cifs_service()`, when the `strdup()` call for the trailing path component fails due to memory allocation failure, the function returns `-EINVAL` instead of `-ENOMEM`. Every other allocation in this same function (`strndup()` for `h` and `ss`) correctly returns `-ENOMEM` on failure. Returning `-EINVAL` here misleads callers into believing the input string `s` was malformed (e.g. `homework-cifs.c` and `homectl.c` treat `parse_cifs_service()` failures as configuration errors), when in fact the process is out of memory.","fix":"Return `-ENOMEM` like the other allocations in the same function:\n\n```\n// Before\nx = strdup(skip_leading_chars(d, CHAR_TO_STR(delimiter)));\nif (!x)\n        return -EINVAL;\n\n// After\nx = strdup(skip_leading_chars(d, CHAR_TO_STR(delimiter)));\nif (!x)\n        return -ENOMEM;\n```","locations":[{"ref":"src/basic/fs-util.c:1010-1013","code":" 1010 |         if (!isempty(d)) {\n 1011 |                 x = strdup(skip_leading_chars(d, CHAR_TO_STR(delimiter)));\n 1012 |                 if (!x)\n 1013 |                         return -EINVAL;","lines":4,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/fs-util.c#L1010-L1013"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`memfd_new_and_seal()` in `src/basic/memfd-util.c` writes the caller-supplied buffer with a single `pwrite()` call and treats any short write as a hard failure:\n\n```c\nif (sz > 0) {\n        ssize_t n = pwrite(fd, data, sz, 0);\n        if (n < 0)\n                return -errno;\n        if ((size_t) n != sz)\n                return -EIO;\n}\n```\n\n`pwrite()`/`write()` on Linux can perform a short write for large buffers (the kernel caps a single transfer around `0x7ffff000` bytes, and short writes can also happen for other reasons), so for a sufficiently large `data`/`sz` this function can spuriously fail with `-EIO` even though the destination `memfd` is perfectly writable. Elsewhere in the codebase the same \"write a possibly-large in-memory buffer into a memfd\" operation is done with a retry loop, e.g. `src/shared/reboot-util.c:342` uses `loop_write(memfd, decompressed, decompressed_size)`, showing this is the established pattern for this exact use case. `memfd_new_and_seal()` is used, among others, in `src/core/exec-invoke.c:413` to seal `ExecContext.stdin_data` (`StandardInputData=`) supplied via unit files, so a large-enough blob would trip this short-write bug.","fix":"Use the existing `loop_write()` helper instead of a single `pwrite()`, so partial writes are retried until the whole buffer is written:\n\n```c\nif (sz > 0) {\n        r = loop_write(fd, data, sz);\n        if (r < 0)\n                return r;\n}\n```","locations":[{"ref":"src/basic/memfd-util.c:134-140","code":"  134 |         if (sz > 0) {\n  135 |                 ssize_t n = pwrite(fd, data, sz, 0);\n  136 |                 if (n < 0)\n  137 |                         return -errno;\n  138 |                 if ((size_t) n != sz)\n  139 |                         return -EIO;\n  140 |         }","lines":7,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/memfd-util.c#L134-L140"}]},
{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"In `fopen_tmpfile_linkable_at()`, when `take_fdopen(&fd, \"w\")` fails, the function unconditionally returns `-ENOMEM`, discarding the real reason `fdopen()` failed (which is reported via `errno`, e.g. `EMFILE`, `EINVAL`, `ENOSPC`). The sibling function `fmkostemp_safe()` in the same file, which wraps the exact same `take_fdopen()` call, correctly returns `-errno` on failure. Returning a hardcoded `-ENOMEM` misleads callers/log messages into thinking the process is out of memory when the actual cause could be something else entirely (e.g. too many open files).","fix":"Propagate the real `errno` like `fmkostemp_safe()` does:\n\n```c\n// before\nf = take_fdopen(&fd, \"w\");\nif (!f)\n        return -ENOMEM;\n\n// after\nf = take_fdopen(&fd, \"w\");\nif (!f)\n        return -errno;\n```","locations":[{"ref":"src/basic/tmpfile-util.c:329-331","code":"  329 |         f = take_fdopen(&fd, \"w\");\n  330 |         if (!f)\n  331 |                 return -ENOMEM;","lines":3,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/tmpfile-util.c#L329-L331"}]},
{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"In `load_via_boot_services()` the two error paths after `BS->LoadImage()` and `BS->HandleProtocol()` call `log_error_status(EFI_LOAD_ERROR, \"...: %m\")`, passing the hardcoded constant `EFI_LOAD_ERROR` as the status. The `%m` specifier in the boot printf resolves the *status argument* (via `status_to_string()`), not the real `err`, so the log always prints \"Load error\" regardless of the actual failure (e.g. `EFI_SECURITY_VIOLATION`, `EFI_OUT_OF_RESOURCES`, `EFI_ACCESS_DENIED`). The genuine `err` returned by the failing UEFI call is discarded, losing diagnostics on the security-boot UKI path. Contrast with line 113 which correctly uses `log_error_status(err, ...)`.","fix":"Log the real `err` in the message (still returning `EFI_LOAD_ERROR` if a normalized status is desired). Before:\n```\n        if (err != EFI_SUCCESS)\n                return log_error_status(EFI_LOAD_ERROR, \"Error loading inner kernel with shim: %m\");\n```\nAfter:\n```\n        if (err != EFI_SUCCESS)\n                return log_error_status(err, \"Error loading inner kernel with shim: %m\");\n```\nApply the same change to the `HandleProtocol` failure at line 90-91.","locations":[{"ref":"src/boot/linux.c:85-91","code":"   85 |         if (err != EFI_SUCCESS)\n   86 |                 return log_error_status(EFI_LOAD_ERROR, \"Error loading inner kernel with shim: %m\");\n   87 | \n   88 |         err = BS->HandleProtocol(\n   89 |                         kernel_image, MAKE_GUID_PTR(EFI_LOADED_IMAGE_PROTOCOL), (void **) &loaded_image);\n   90 |         if (err != EFI_SUCCESS)\n   91 |                 return log_error_status(EFI_LOAD_ERROR, \"Error getting kernel image from protocol from shim: %m\");","lines":7,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/boot/linux.c#L85-L91"}]},
{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`dm_ioctl_run()` emits `log_error_errno(r, \"DM ioctl failed: %m\")` at `LOG_ERR` for every ioctl failure except the `-ENXIO`/`DM_DEV_REMOVE` case, but several callers treat specific errors as non-fatal expected conditions. `verb_remove()` in `clonesetup.c` handles `-EBUSY` by retrying with a deferred removal, and `dm_clone_create()` handles `-EEXIST`. Because the low-level helper already logged at error level, a routine busy-device removal at shutdown prints a spurious `DM ioctl failed` error (and `-EEXIST`/`-EBUSY` paths log the error twice), producing misleading noise for conditions the code recovers from cleanly.","fix":"Downgrade the generic failure log in `dm_ioctl_run()` to `LOG_DEBUG` (mirroring the existing `-ENXIO` special case) and let callers that consider a failure fatal emit the user-facing error, so `-EBUSY`/`-EEXIST` recovery paths don't produce spurious `LOG_ERR` output.","locations":[{"ref":"src/clonesetup/clonesetup-ioctl.c:75-82","code":"   75 |         r = RET_NERRNO(ioctl(fd, cmd, dm));\n   76 |         if (r < 0) {\n   77 |                 if (r == -ENXIO && cmd == DM_DEV_REMOVE) {\n   78 |                         log_full_errno(LOG_DEBUG, r, \"Device \\\"%s\\\" is already inactive, ignoring: %m\", dm->name);\n   79 |                         return 0;\n   80 |                 }\n   81 |                 return log_error_errno(r, \"DM ioctl failed: %m\");\n   82 |         }","lines":8,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/clonesetup/clonesetup-ioctl.c#L75-L82"},{"ref":"src/clonesetup/clonesetup.c:135-137","code":"  135 |         r = dm_clone_remove_device(name);\n  136 |         if (r == -EBUSY)\n  137 |                 return dm_clone_remove_device_deferred(name);","lines":3,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/clonesetup/clonesetup.c#L135-L137"}]},
{"id":"ERR_10","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"In `property_get_cpuset` the return value of `cpu_set_to_dbus()` is discarded with `(void)`, but `allocated` is declared uninitialized (`size_t allocated;`). `cpu_set_to_dbus()` only writes `*ret_size` on success and returns `-ENOMEM` without touching it on allocation failure. On that failure path `array` stays `NULL` while `allocated` holds an indeterminate value, and it is then passed to `sd_bus_message_append_array(reply, 'y', array, allocated)`, i.e. a garbage length with a `NULL` base pointer. The sibling getter `property_get_cpu_affinity` (line 137) correctly checks the return value, making this an inconsistency.","fix":"Either propagate the error like `property_get_cpu_affinity` does, or at minimum initialize the size. Before:\n```\n        _cleanup_free_ uint8_t *array = NULL;\n        size_t allocated;\n```\nAfter:\n```\n        _cleanup_free_ uint8_t *array = NULL;\n        size_t allocated = 0;\n```\nPreferably replace `(void) cpu_set_to_dbus(cpus, &array, &allocated);` with a checked call returning `r` on failure.","locations":[{"ref":"src/core/dbus-cgroup.c:96-103","code":"   96 |         _cleanup_free_ uint8_t *array = NULL;\n   97 |         size_t allocated;\n   98 | \n   99 |         assert(bus);\n  100 |         assert(reply);\n  101 | \n  102 |         (void) cpu_set_to_dbus(cpus, &array, &allocated);\n  103 |         return sd_bus_message_append_array(reply, 'y', array, allocated);","lines":8,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/core/dbus-cgroup.c#L96-L103"}]},
{"id":"ERR_11","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"Same pattern as `property_get_cpuset`: `property_get_numa_mask` discards the result of `cpu_set_to_dbus()` while `allocated` is uninitialized (`size_t allocated;`). On `-ENOMEM` the function returns before setting `*ret_size`, so `sd_bus_message_append_array(reply, 'y', array, allocated)` is called with `array == NULL` and an indeterminate `allocated`.","fix":"Before:\n```\n        _cleanup_free_ uint8_t *array = NULL;\n        size_t allocated;\n```\nAfter:\n```\n        _cleanup_free_ uint8_t *array = NULL;\n        size_t allocated = 0;\n```\nor check the return value of `cpu_set_to_dbus()` and return it on failure.","locations":[{"ref":"src/core/dbus-execute.c:154-162","code":"  154 |         _cleanup_free_ uint8_t *array = NULL;\n  155 |         size_t allocated;\n  156 | \n  157 |         assert(bus);\n  158 |         assert(reply);\n  159 | \n  160 |         (void) cpu_set_to_dbus(&c->numa_policy.nodes, &array, &allocated);\n  161 | \n  162 |         return sd_bus_message_append_array(reply, 'y', array, allocated);","lines":9,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/core/dbus-execute.c#L154-L162"}]},
{"id":"ERR_12","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `exec_runtime_deserialize()` the return value of `dynamic_user_deserialize_one()` is ignored for both the `exec-runtime-dynamic-creds-user=` and `exec-runtime-dynamic-creds-group=` cases, unlike the serialize side which checks it. On an allocation failure inside `dynamic_user_deserialize_one()`, deserialization silently continues with `rt->dynamic_creds->user`/`group` left unset instead of propagating the error, masking the failure.","fix":"Capture and propagate the result, e.g. `r = dynamic_user_deserialize_one(NULL, val, fds, &rt->dynamic_creds->user); if (r < 0) return r;` for both the user and group branches.","locations":[{"ref":"src/core/execute-serialize.c:1038-1041","code":" 1038 |                 } else if ((val = startswith(l, \"exec-runtime-dynamic-creds-user=\")))\n 1039 |                         dynamic_user_deserialize_one(/* m= */ NULL, val, fds, &rt->dynamic_creds->user);\n 1040 |                 else if ((val = startswith(l, \"exec-runtime-dynamic-creds-group=\")))\n 1041 |                         dynamic_user_deserialize_one(/* m= */ NULL, val, fds, &rt->dynamic_creds->group);","lines":4,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/core/execute-serialize.c#L1038-L1041"}]},
{"id":"ERR_13","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"In `service_notify_message()` the `NOTIFYACCESS=` handler logs \"ignoring\" when `notify_access_from_string(e)` fails (`notify_access < 0`), but there is no `else` guarding the subsequent apply. Execution falls through to `if (service_get_notify_access(s) != notify_access)` with `notify_access` still holding the negative parse-error value, then calls `service_override_notify_access(s, notify_access)` storing that invalid value into `s->notify_access_override` and setting `notify_dbus = true`. Because `service_get_notify_access()` returns `notify_access_override` only when it is `>= 0`, a malformed `NOTIFYACCESS=` field silently clears/resets any previously-set access override to the configured base value instead of being ignored, contradicting the log message. Note the adjacent `ERRNO=` handler just below (`status_errno = parse_errno(e); if (status_errno < 0) ... else if (...)`) correctly uses `else`, confirming the intended pattern.","fix":"Guard the apply with `else`, mirroring the `ERRNO=` handler below:\n```c\nnotify_access = notify_access_from_string(e);\nif (notify_access < 0)\n        log_unit_warning_errno(u, notify_access,\n                               \"Failed to parse NOTIFYACCESS= field value '%s' in notification message, ignoring: %m\", e);\nelse if (service_get_notify_access(s) != notify_access) {\n        service_override_notify_access(s, notify_access);\n        notify_dbus = true;\n}\n```","locations":[{"ref":"src/core/service.c:5688-5704","code":" 5688 |         e = strv_find_startswith(tags, \"NOTIFYACCESS=\");\n 5689 |         if (e) {\n 5690 |                 NotifyAccess notify_access;\n 5691 | \n 5692 |                 notify_access = notify_access_from_string(e);\n 5693 |                 if (notify_access < 0)\n 5694 |                         log_unit_warning_errno(u, notify_access,\n 5695 |                                                \"Failed to parse NOTIFYACCESS= field value '%s' in notification message, ignoring: %m\", e);\n 5696 | \n 5697 |                 /* We don't need to check whether the new access mode is more strict than what is\n 5698 |                  * already in use, since only the privileged process is allowed to change it\n 5699 |                  * in the first place. */\n 5700 |                 if (service_get_notify_access(s) != notify_access) {\n 5701 |                         service_override_notify_access(s, notify_access);\n 5702 |                         notify_dbus = true;\n 5703 |                 }\n 5704 |         }","lines":17,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/core/service.c#L5688-L5704"}]},
{"id":"ERR_14","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"In `write_netlabel_rules()` the write-error check `if (!fputs(buf, dst))` is wrong. `fputs()` returns `EOF` (i.e. `-1`) on failure and a non-negative value on success, so on a real write error `!fputs(...)` is `!(-1)` which is `false` and the error branch is skipped, while a legitimate success that returns `0` (e.g. writing an empty line) spuriously enters the error branch, logs a failure, and `break`s out. The real write error is only caught incidentally by the subsequent `fflush_and_check(dst)`; the `fputs` check itself does the opposite of what is intended.","fix":"Compare against `EOF` explicitly:\n```c\nif (fputs(buf, dst) == EOF) {\n        log_error_errno(errno, \"Failed to write line to %s: %m\", \"/sys/fs/smackfs/netlabel\");\n        RET_GATHER(r, -errno);\n        break;\n}\n```","locations":[{"ref":"src/core/smack-setup.c:232-236","code":"  232 |                         if (!fputs(buf, dst)) {\n  233 |                                 log_error_errno(errno, \"Failed to write line to %s: %m\", \"/sys/fs/smackfs/netlabel\");\n  234 |                                 RET_GATHER(r, -errno);\n  235 |                                 break;\n  236 |                         }","lines":5,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/core/smack-setup.c#L232-L236"}]},
{"id":"ERR_15","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"In `add_credentials_to_table()`, when `fstatfs()` fails the error is logged with the stale variable `r` instead of `errno`. At this point `r` holds a leftover value (typically `1`, the success return of `open_credential_directory()`, or the result of a prior `table_add_many()`), not the `fstatfs` error. `fstatfs()` reports its failure via `errno`, so both the `%m` message and the propagated return value are wrong (passing a non-negative value into `log_error_errno` yields a bogus/`Success`-like error).","fix":"Use `errno`, which `fstatfs()` sets on failure:\n```c\nif (fstatfs(fd, &sfs) < 0)\n        return log_error_errno(errno, \"fstatfs() failed on '%s': %m\", de->d_name);\n```\nBefore: `return log_error_errno(r, \"fstatfs() failed on '%s': %m\", de->d_name);`\nAfter: `return log_error_errno(errno, \"fstatfs() failed on '%s': %m\", de->d_name);`","locations":[{"ref":"src/creds/creds.c:278-279","code":"  278 |                         if (fstatfs(fd, &sfs) < 0)\n  279 |                                 return log_error_errno(r, \"fstatfs() failed on '%s': %m\", de->d_name);","lines":2,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/creds/creds.c#L278-L279"}]},
{"id":"ERR_16","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`check_registered_passwords()` is declared to return `PassphraseType`, but on allocation failure it does `return log_oom();`, which returns the `int` value `-ENOMEM` (-12) reinterpreted as a `PassphraseType`. The caller in `verb_attach()` checks `if (passphrase_type == PASSPHRASE_NONE)` (0); `-12 != 0`, so the OOM is not detected. Execution then proceeds to `get_password()` with an out-of-range `passphrase_type`, and `passphrase_type_to_string(-12)` returns `NULL`, so the prompt text is built with `%s` on a NULL pointer (glibc prints `(null)`), i.e. the tool silently continues on an out-of-memory condition instead of failing cleanly. Only reachable under memory exhaustion.","fix":"Have `check_registered_passwords()` signal OOM unambiguously rather than smuggling `-ENOMEM` through the enum. Simplest option: change it to return `int` with the `PassphraseType` via an out-parameter, or map the allocation failure to a distinct sentinel the caller checks for (e.g. treat any negative return as fatal). At minimum, replace `return log_oom();` with logic the caller in `verb_attach()` recognizes as an error before dereferencing the value in `get_password()`.","locations":[{"ref":"src/cryptsetup/cryptsetup.c:815-817","code":"  815 |         slots = new(bool, slot_max);\n  816 |         if (!slots)\n  817 |                 return log_oom();","lines":3,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/cryptsetup/cryptsetup.c#L815-L817"},{"ref":"src/cryptsetup/cryptsetup.c:2659-2662","code":" 2659 |                                 if (passphrase_type == PASSPHRASE_NONE) {\n 2660 |                                         passphrase_type = check_registered_passwords(cd);\n 2661 |                                         if (passphrase_type == PASSPHRASE_NONE)\n 2662 |                                                 return log_error_errno(SYNTHETIC_ERRNO(EINVAL), \"No passphrase or recovery key registered.\");","lines":4,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/cryptsetup/cryptsetup.c#L2659-L2662"}]},
{"id":"ERR_17","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `curl_on_finished()` the HTTP-transient-error retry path ignores the return value of `context_schedule_retry()` with an explicit `(void)` cast, unlike the curl-transport-error path a few lines above which does `if (r < 0) return context_fail(c, r);`. When the retry budget (`RETRY_MAX`) is exhausted while the server keeps returning 503/429, `context_schedule_retry()` returns `-EUCLEAN` but it is discarded, so no failure is propagated and no timer is armed; the request then just stalls until the overall timeout (~40s) instead of failing promptly.","fix":"Handle the error the same way as the curl-error branch: `r = context_schedule_retry(c); if (r < 0) return context_fail(c, r); return 0;` instead of `(void) context_schedule_retry(c);`.","locations":[{"ref":"src/imds/imdsd.c:949-952","code":"  949 |         if (r == 0) { /* We shall retry */\n  950 |                 (void) context_schedule_retry(c);\n  951 |                 return 0;\n  952 |         }","lines":4,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/imds/imdsd.c#L949-L952"},{"ref":"src/imds/imdsd.c:929-934","code":"  929 |                 /* Automatically retry on some transient errors from curl itself */\n  930 |                 r = context_schedule_retry(c);\n  931 |                 if (r < 0)\n  932 |                         return context_fail(c, r);\n  933 | \n  934 |                 return 0;","lines":6,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/imds/imdsd.c#L929-L934"}]},
{"id":"ERR_18","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`convert_sections()` (called from `elf2efi()`) can legitimately return an empty `sections` list if an ELF has no `PT_LOAD`-backed section that survives the `IGNORE_SECTIONS`/`IGNORE_SECTION_TYPES`/`sh_size == 0` filtering in `iter_copy_sections()`. Nothing checks for this degenerate case. `next_section_address()` (used from `copy_sections()`) unconditionally indexes `sections[-1]`, and `convert_elf_relocations()` unconditionally indexes `sections[0].VirtualAddress`, so a malformed/degenerate ELF with zero eligible sections crashes with a bare `IndexError` rather than the module's `BadSectionError` used for other malformed-input conditions.","fix":"Fail fast with a clear diagnostic right after building the section list in `elf2efi()`:\n```python\nsections = convert_sections(file, opt)\nif not sections:\n    raise BadSectionError('No loadable ELF sections survived filtering; nothing to convert')\ncopy_sections(file, opt, args.copy_sections, sections)\n```","locations":[{"ref":"tools/elf2efi.py:243-244","code":"  243 | def next_section_address(sections: list[PeSection]) -> int:\n  244 |     return align_to(sections[-1].VirtualAddress + sections[-1].VirtualSize, SECTION_ALIGNMENT)","lines":2,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/tools/elf2efi.py#L243-L244"},{"ref":"tools/elf2efi.py:489-490","code":"  489 |     if sections[0].VirtualAddress < opt.SizeOfHeaders:\n  490 |         segment_offset = align_to(opt.SizeOfHeaders - sections[0].VirtualAddress, SECTION_ALIGNMENT)","lines":2,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/tools/elf2efi.py#L489-L490"}]},
{"id":"ERR_19","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `iter_copy_sections()`, when merging a run of ELF sections with the same characteristics, `pad_len = elf_s['sh_addr'] - pe_s.VirtualAddress - len(pe_s.data)` is passed straight into `bytearray(pad_len)`. This assumes ELF sections are visited in strictly ascending, non-overlapping `sh_addr` order, which the ELF format does not guarantee for the section header table (order and addresses are attacker/toolchain controlled for a malformed input). If a later section's `sh_addr` is less than the end of the already-accumulated `pe_s.data` (out-of-order or overlapping sections), `pad_len` goes negative and `bytearray(negative_int)` raises `ValueError: negative count`, again bypassing the module's own `BadSectionError` reporting path used for other malformed-input cases (e.g. the explicit overlap check in `convert_sections()` at line 335).","fix":"Check for the out-of-order/overlap condition before building the padding:\n```python\npad_len = elf_s['sh_addr'] - pe_s.VirtualAddress - len(pe_s.data)\nif pad_len < 0:\n    raise BadSectionError(\n        f'ELF section {elf_s.name!r} at {elf_s[\"sh_addr\"]:#x} overlaps or precedes the previous section'\n    )\npe_s.data += bytearray(pad_len) + elf_s.data()\n```","locations":[{"ref":"tools/elf2efi.py:296-299","code":"  296 |         if pe_s:\n  297 |             # Insert padding to properly align the section.\n  298 |             pad_len = elf_s['sh_addr'] - pe_s.VirtualAddress - len(pe_s.data)\n  299 |             pe_s.data += bytearray(pad_len) + elf_s.data()","lines":4,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/tools/elf2efi.py#L296-L299"}]},
{"id":"ERR_20","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `convert_elf_relocations()`, `[flags_tag] = dynamic.iter_tags('DT_FLAGS_1')` assumes the `.dynamic` section contains exactly one `DT_FLAGS_1` tag. For a malformed or hand-crafted ELF that omits the tag entirely, or repeats it, this list-unpack raises a bare `ValueError` (`not enough values to unpack` / `too many values to unpack`) instead of the module's `BadSectionError`/`ValueError` with a descriptive message used for every other malformed-input check in this function (e.g. the missing `.dynamic` section check two lines above, and the `not a PIE` check right after).","fix":"Check the tag count explicitly before unpacking:\n```python\nflags_tags = list(dynamic.iter_tags('DT_FLAGS_1'))\nif len(flags_tags) != 1:\n    raise BadSectionError('ELF .dynamic section does not contain exactly one DT_FLAGS_1 tag')\nflags_tag = flags_tags[0]\nif not flags_tag['d_val'] & elf.enums.ENUM_DT_FLAGS_1['DF_1_PIE']:\n    raise ValueError('ELF file is not a PIE')\n```","locations":[{"ref":"tools/elf2efi.py:463-465","code":"  463 |     [flags_tag] = dynamic.iter_tags('DT_FLAGS_1')\n  464 |     if not flags_tag['d_val'] & elf.enums.ENUM_DT_FLAGS_1['DF_1_PIE']:\n  465 |         raise ValueError('ELF file is not a PIE')","lines":3,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/tools/elf2efi.py#L463-L465"}]},
{"id":"ERR_21","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"negligible","difficulty":"easy","description":"In `scope_enter_running()` the return value of `scope_arm_timer()` for the runtime (`RuntimeMaxSec=`) timeout is ignored, unlike every other `scope_arm_timer()` call site which checks it. If arming the timer fails, the scope proceeds to `SCOPE_RUNNING` and the runtime limit is silently never enforced, with no diagnostic. Impact is minor since `unit_arm_timer()` rarely fails.","fix":"Either check the result and log/handle it, or at minimum cast to `(void)` to make the intentional ignoring explicit and consistent with codebase conventions: `(void) scope_arm_timer(s, /* relative= */ false, scope_running_timeout(s));`.","locations":[{"ref":"src/core/scope.c:414-415","code":"  414 |         /* Set the maximum runtime timeout. */\n  415 |         scope_arm_timer(s, /* relative= */ false, scope_running_timeout(s));","lines":2,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/core/scope.c#L414-L415"}]},
{"id":"ERR_22","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"negligible","difficulty":"very_easy","description":"The result of `strjoin(...)` assigned to `i->config_job->description` (and likewise `i->bearer_token_job->description`) is not checked for `NULL`, unlike other `description` assignments in this file (e.g. `oci_pull_redirect_manifest` and `oci_pull_start` both `return -ENOMEM` on failure). On OOM the description silently stays `NULL`; harmless because `pull_job_description()` falls back to the URL, but it is an inconsistent, unchecked allocation.","fix":"Either check the allocations for consistency (`if (!i->config_job->description) return log_oom();`) or add an explicit comment that a `NULL` description is acceptable here. Given `pull_job_description()` tolerates `NULL`, adding the `log_oom()` guard to match the surrounding code is the least surprising choice.","locations":[{"ref":"src/import/pull-oci.c:707","code":"  707 |         i->config_job->description = strjoin(\"Image configuration (\", url, \")\");","lines":1,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/import/pull-oci.c#L707"},{"ref":"src/import/pull-oci.c:1485","code":" 1485 |         i->bearer_token_job->description = strjoin(\"Bearer token (\", url, \")\");","lines":1,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/import/pull-oci.c#L1485"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"In `pidref_namespace_open()` (`src/basic/namespace-util.c`), all five output fd parameters (`pidns_fd`, `mntns_fd`, `netns_fd`, `userns_fd`, `root_fd`) are initialized to `-EBADF` and, by convention throughout this file, end up on a successful (`return 0`) path either as a valid `>= 0` file descriptor or left at `-EBADF`. `userns_fd` is the one exception: when `pidref_namespace_open_by_type_internal(pidref, NAMESPACE_USER, &need_verify)` returns `-ENOPKG` (meaning the target process's kernel/namespace doesn't support user namespaces), the code deliberately does not propagate that as a fatal error:\n\n```c\nif (ret_userns_fd) {\n        userns_fd = pidref_namespace_open_by_type_internal(pidref, NAMESPACE_USER, &need_verify);\n        if (userns_fd < 0 && userns_fd != -ENOPKG)\n                return userns_fd;\n}\n```\n\nbut then at the end of the function it is stored into the output parameter unconditionally, together with the valid fds:\n\n```c\nif (ret_userns_fd)\n        *ret_userns_fd = TAKE_FD(userns_fd);\n```\n\nSo on a `return 0` (success) result, `*ret_userns_fd` can silently be `-ENOPKG` instead of a real fd or the conventional `-EBADF` \"not present\" sentinel. Every current call site happens to guard with `fd >= 0` before use (e.g. `namespace_enter()`, `are_our_namespaces()`, `src/core/exec-credential.c:1320`), so this does not misbehave today, but it violates the fd-output contract that the rest of the function (and the rest of the codebase) relies on, and is a landmine for any future caller that instead compares against `-EBADF` or logs/`assert`s the fd is either valid or exactly unset.","fix":"Normalize the sentinel before returning, e.g.:\n\n```c\nif (ret_userns_fd)\n        *ret_userns_fd = TAKE_FD(userns_fd >= 0 ? userns_fd : -EBADF);\n```\n\nor reset `userns_fd = -EBADF;` right after the `-ENOPKG` case is accepted, so the output parameter is always either a valid descriptor or the documented `-EBADF` \"absent\" value, consistent with `pidns_fd`, `mntns_fd`, `netns_fd`, and `root_fd`.","locations":[{"ref":"src/basic/namespace-util.c:172-176","code":"  172 |         if (ret_userns_fd) {\n  173 |                 userns_fd = pidref_namespace_open_by_type_internal(pidref, NAMESPACE_USER, &need_verify);\n  174 |                 if (userns_fd < 0 && userns_fd != -ENOPKG)\n  175 |                         return userns_fd;\n  176 |         }","lines":5,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/namespace-util.c#L172-L176"},{"ref":"src/basic/namespace-util.c:206-207","code":"  206 |         if (ret_userns_fd)\n  207 |                 *ret_userns_fd = TAKE_FD(userns_fd);","lines":2,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/namespace-util.c#L206-L207"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`sd_dhcp6_option_new()` in `src/libsystemd-network/dhcp6-option.c` accepts an arbitrary `size_t length` and stores it verbatim via `memdup()` without validating it against the DHCPv6 option format's 16-bit length field:\n```c\nint sd_dhcp6_option_new(uint16_t option, const void *data, size_t length, uint32_t enterprise_identifier, sd_dhcp6_option **ret) {\n        assert_return(ret, -EINVAL);\n        assert_return(length == 0 || data, -EINVAL);\n\n        _cleanup_free_ void *q = memdup(data, length);\n        ...\n}\n```\nThe only place this bound is actually enforced is deep inside `option_append_hdr()` (called transitively from `dhcp6_option_append_vendor_option()` when the option is finally serialized), which rejects `optlen > 0xffff` with `-ENOBUFS`. This means a caller can successfully construct an `sd_dhcp6_option` with, say, a 1 MB payload via the public API, add it to a client via `sd_dhcp6_client_add_vendor_option()`, and only discover the problem much later (and with a fairly generic `-ENOBUFS`) when the client actually tries to send a message, instead of getting immediate, precise feedback at the point of misuse.","fix":"Validate `length` (and the resulting `4 + 2 + 2 + length` vendor-option total) up front in `sd_dhcp6_option_new()`:\n```c\nint sd_dhcp6_option_new(uint16_t option, const void *data, size_t length, uint32_t enterprise_identifier, sd_dhcp6_option **ret) {\n        assert_return(ret, -EINVAL);\n        assert_return(length == 0 || data, -EINVAL);\n        assert_return(length <= UINT16_MAX - 8, -EINVAL);\n        ...\n```\nso misuse is rejected immediately with a precise error, rather than silently deferred to serialization time.","locations":[{"ref":"src/libsystemd-network/dhcp6-option.c:897-919","code":"  897 | int sd_dhcp6_option_new(uint16_t option, const void *data, size_t length, uint32_t enterprise_identifier, sd_dhcp6_option **ret) {\n  898 |         assert_return(ret, -EINVAL);\n  899 |         assert_return(length == 0 || data, -EINVAL);\n  900 | \n  901 |         _cleanup_free_ void *q = memdup(data, length);\n  902 |         if (!q)\n  903 |                 return -ENOMEM;\n  904 | \n  905 |         sd_dhcp6_option *p = new(sd_dhcp6_option, 1);\n  906 |         if (!p)\n  907 |                 return -ENOMEM;\n  908 | \n  909 |         *p = (sd_dhcp6_option) {\n  910 |                 .n_ref = 1,\n  911 |                 .option = option,\n  912 |                 .enterprise_identifier = enterprise_identifier,\n  913 |                 .length = length,\n  914 |                 .data = TAKE_PTR(q),\n  915 |         };\n  916 | \n  917 |         *ret = p;\n  918 |         return 0;\n  919 | }","lines":23,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/libsystemd-network/dhcp6-option.c#L897-L919"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"high","difficulty":"medium","description":"`strv_env_is_valid()` in `src/basic/env-util.c` validates an environment string list and, for every entry `p`, scans all subsequent entries `STRV_FOREACH(q, p + 1)` to detect duplicate variable names - an `O(n^2)` algorithm. The same pattern appears in `strv_env_clean_with_callback()`. Both are reachable from PID 1's D-Bus API: `exec_context_apply_environment()` in `src/core/execute.c` only bounds the list length to `ENVIRONMENT_ASSIGNMENTS_MAX` (16384) via `strv_length(env) > ENVIRONMENT_ASSIGNMENTS_MAX` before calling `strv_env_is_valid()` (similarly in `src/core/dbus-manager.c` and `src/core/dbus-execute.c`). With close to the maximum 16384 entries, the nested loop performs on the order of `134` million `strneq()` comparisons (plus a full `env_assignment_is_valid()`/`utf8_is_valid()` pass per entry) on a single, synchronous call. Since `systemd --system` (PID 1) is effectively single-threaded for this code path, a client authorized to call `SetUnitProperties`/`Environment=` with a large, adversarial environment list can stall unit management for a noticeable, avoidable amount of time.","fix":"Replace the quadratic duplicate-scan with a linear-time approach, e.g. build a `Hashmap`/`Set` keyed by the variable name (the part before `=`) while iterating once, and reject/skip an entry when its name is already present, instead of re-scanning the remaining tail of the array for every entry. This turns both `strv_env_is_valid()` and `strv_env_clean_with_callback()` from `O(n^2)` into `O(n)` (amortized, given hash lookups).","locations":[{"ref":"src/basic/env-util.c:104-119","code":"  104 | bool strv_env_is_valid(char * const *e) {\n  105 |         STRV_FOREACH(p, e) {\n  106 |                 size_t k;\n  107 | \n  108 |                 if (!env_assignment_is_valid(*p))\n  109 |                         return false;\n  110 | \n  111 |                 /* Check if there are duplicate assignments */\n  112 |                 k = strcspn(*p, \"=\");\n  113 |                 STRV_FOREACH(q, p + 1)\n  114 |                         if (strneq(*p, *q, k) && (*q)[k] == '=')\n  115 |                                 return false;\n  116 |         }\n  117 | \n  118 |         return true;\n  119 | }","lines":16,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/env-util.c#L104-L119"},{"ref":"src/basic/env-util.c:608-641","code":"  608 | char** strv_env_clean_with_callback(char **l, void (*invalid_callback)(const char *p, void *userdata), void *userdata) {\n  609 |         int k = 0;\n  610 | \n  611 |         STRV_FOREACH(p, l) {\n  612 |                 size_t n;\n  613 |                 bool duplicate = false;\n  614 | \n  615 |                 if (!env_assignment_is_valid(*p)) {\n  616 |                         if (invalid_callback)\n  617 |                                 invalid_callback(*p, userdata);\n  618 |                         free(*p);\n  619 |                         continue;\n  620 |                 }\n  621 | \n  622 |                 n = strcspn(*p, \"=\");\n  623 |                 STRV_FOREACH(q, p + 1)\n  624 |                         if (strneq(*p, *q, n) && (*q)[n] == '=') {\n  625 |                                 duplicate = true;\n  626 |                                 break;\n  627 |                         }\n  628 | \n  629 |                 if (duplicate) {\n  630 |                         free(*p);\n  631 |                         continue;\n  632 |                 }\n  633 | \n  634 |                 l[k++] = *p;\n  635 |         }\n  636 | \n  637 |         if (l)\n  638 |                 l[k] = NULL;\n  639 | \n  640 |         return l;\n  641 | }","lines":34,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/env-util.c#L608-L641"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"medium","difficulty":"hard","description":"`dhcp_message_get_option_domains()` in `src/libsystemd-network/dhcp-message.c` re-implements DNS-style message-compression decoding (used for `SD_DHCP_OPTION_DOMAIN_SEARCH` and the domain-encoded form of `SD_DHCP_OPTION_SIP_SERVER`, per RFC 3397 / RFC 3361) directly over the untrusted option bytes received from a DHCP server. The pointer-following branch:\n```c\n} else if (FLAGS_SET(c, 0xc0)) {\n        if (pos >= len)\n                return -EBADMSG;\n        if (next_chunk == 0)\n                next_chunk = pos + 1;\n        pos = ((size_t) (c & ~0xc0) << 8) | ((size_t) buf[pos]);\n        if (pos >= jump_barrier)\n                return -EBADMSG;\n        jump_barrier = pos;\n}\n```\nonly guarantees that `jump_barrier` strictly decreases *within a single name*, and resets `jump_barrier = pos` back up to the start of the *next* name once a `0x00` terminator is reached. This bounds any individual jump chain to `O(len)` steps, but does not bound the aggregate work across the whole option: a maliciously crafted option can place a \"telescoping\" chain of adjacent 2-byte backward pointers (each pointing 2 bytes further back, terminating in one real short label at offset 0), and then append many independent 2-byte pointer-only \"names\" that all point back to the top of that same chain. Each such name walks the *entire* chain again before hitting the real terminator, so total work is `O(n)` chains times `O(n)` steps each, i.e. `O(n^2)` in the option length `n`. Since DHCP option data assembled via RFC 3396 concatenation (and delivered via `dhcp_message_get_option_alloc()`) can be tens of kilobytes, a single crafted DHCPOFFER/DHCPACK from a rogue or spoofed server can burn a large number of CPU cycles in the DHCP client's (typically single-threaded, event-loop-driven) parsing path.","fix":"Bound the *total* number of pointer jumps (or total bytes visited via jumps) performed while parsing the whole option, not just the per-name jump_barrier, e.g. accumulate a `jumps` counter across the entire `for` loop and bail out with `-EBADMSG` once it exceeds a small multiple of `len`:\n```c\nsize_t jumps = 0;\n...\n} else if (FLAGS_SET(c, 0xc0)) {\n        if (pos >= len)\n                return -EBADMSG;\n        if (++jumps > len) /* defend against O(n^2) chains of shared compression pointers */\n                return -EBADMSG;\n        ...\n}\n```","locations":[{"ref":"src/libsystemd-network/dhcp-message.c:1002-1113","code":" 1002 | int dhcp_message_get_option_domains(sd_dhcp_message *message, uint8_t code, char ***ret) {\n 1003 |         int r;\n 1004 | \n 1005 |         assert(message);\n 1006 | \n 1007 |         /* This is mostly for SD_DHCP_OPTION_DOMAIN_SEARCH and SD_DHCP_OPTION_SIP_SERVER. */\n 1008 | \n 1009 |         _cleanup_(iovec_done) struct iovec iov = {};\n 1010 |         r = dhcp_message_get_option_alloc(message, code, &iov);\n 1011 |         if (r < 0)\n 1012 |                 return r;\n 1013 | \n 1014 |         const uint8_t *buf = iov.iov_base;\n 1015 |         size_t len = iov.iov_len;\n 1016 | \n 1017 |         if (code == SD_DHCP_OPTION_SIP_SERVER) {\n 1018 |                 if (len == 0)\n 1019 |                         return -EBADMSG;\n 1020 | \n 1021 |                 if (buf[0] != 0) /* 'enc' field, 0: domains, 1: addresses */\n 1022 |                         return -ENODATA;\n 1023 | \n 1024 |                 len--;\n 1025 |                 buf++;\n 1026 |         }\n 1027 | \n 1028 |         _cleanup_strv_free_ char **names = NULL;\n 1029 |         size_t n_names = 0;\n 1030 | \n 1031 |         _cleanup_free_ char *name = NULL;\n 1032 |         size_t n = 0;\n 1033 | \n 1034 |         for (size_t pos = 0, jump_barrier = 0, next_chunk = 0; pos < len;) {\n 1035 |                 uint8_t c = buf[pos++];\n 1036 | \n 1037 |                 if (c == 0) {\n 1038 |                         /* End of name */\n 1039 | \n 1040 |                         if (!string_is_safe(name, /* flags= */ 0))\n 1041 |                                 return -EBADMSG;\n 1042 | \n 1043 |                         _cleanup_free_ char *normalized = NULL;\n 1044 |                         r = normalize_dns_name(name, &normalized);\n 1045 |                         if (r < 0)\n 1046 |                                 return r;\n 1047 | \n 1048 |                         r = strv_consume_with_size(&names, &n_names, TAKE_PTR(normalized));\n 1049 |                         if (r < 0)\n 1050 |                                 return r;\n 1051 | \n 1052 |                         if (next_chunk != 0)\n 1053 |                                 pos = next_chunk;\n 1054 | \n 1055 |                         next_chunk = 0;\n 1056 |                         jump_barrier = pos;\n 1057 | \n 1058 |                         name = mfree(name);\n 1059 |                         n = 0;\n 1060 | \n 1061 |                 } else if (c <= 63) {\n 1062 |                         /* Literal label */\n 1063 | \n 1064 |                         const char *label = (const char*) (buf + pos);\n 1065 |                         pos += c;\n 1066 | \n 1067 |                         if (pos >= len)\n 1068 |                                 return -EBADMSG;\n 1069 | \n 1070 |                         if (!GREEDY_REALLOC(name, n + 1 + DNS_LABEL_ESCAPED_MAX))\n 1071 |                                 return -ENOMEM;\n 1072 | \n 1073 |                         if (n != 0)\n 1074 |                                 name[n++] = '.';\n 1075 | \n 1076 |                         r = dns_label_escape(label, c, name + n, DNS_LABEL_ESCAPED_MAX);\n 1077 |                         if (r < 0)\n 1078 |                                 return r;\n 1079 | \n 1080 |                         n += r;\n 1081 | \n 1082 |                 } else if (FLAGS_SET(c, 0xc0)) {\n 1083 |                         /* Pointer */\n 1084 | \n 1085 |                         if (pos >= len) /* pointer is 2 bytes, hence we need to read at least one more byte. */\n 1086 |                                 return -EBADMSG;\n 1087 | \n 1088 |                         /* Save the current location so we don't end up re-parsing what's parsed so far. */\n 1089 |                         if (next_chunk == 0)\n 1090 |                                 next_chunk = pos + 1;\n 1091 | \n 1092 |                         pos = ((size_t) (c & ~0xc0) << 8) | ((size_t) buf[pos]);\n 1093 | \n 1094 |                         /* Jumps are limited to a \"prior occurrence\" (RFC-1035 4.1.4) */\n 1095 |                         if (pos >= jump_barrier)\n 1096 |                                 return -EBADMSG;\n 1097 | \n 1098 |                         jump_barrier = pos;\n 1099 | \n 1100 |                 } else\n 1101 |                         return -EBADMSG;\n 1102 |         }\n 1103 | \n 1104 |         if (!isempty(name)) /* trailing garbage?? Should not happen, but for safety. */\n 1105 |                 return -EBADMSG;\n 1106 | \n 1107 |         if (strv_isempty(names))\n 1108 |                 return -EBADMSG;\n 1109 | \n 1110 |         if (ret)\n 1111 |                 *ret = TAKE_PTR(names);\n 1112 |         return 0;\n 1113 | }","lines":112,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/libsystemd-network/dhcp-message.c#L1002-L1113"},{"ref":"src/libsystemd-network/dhcp-message.c:1082-1098","code":" 1082 |                 } else if (FLAGS_SET(c, 0xc0)) {\n 1083 |                         /* Pointer */\n 1084 | \n 1085 |                         if (pos >= len) /* pointer is 2 bytes, hence we need to read at least one more byte. */\n 1086 |                                 return -EBADMSG;\n 1087 | \n 1088 |                         /* Save the current location so we don't end up re-parsing what's parsed so far. */\n 1089 |                         if (next_chunk == 0)\n 1090 |                                 next_chunk = pos + 1;\n 1091 | \n 1092 |                         pos = ((size_t) (c & ~0xc0) << 8) | ((size_t) buf[pos]);\n 1093 | \n 1094 |                         /* Jumps are limited to a \"prior occurrence\" (RFC-1035 4.1.4) */\n 1095 |                         if (pos >= jump_barrier)\n 1096 |                                 return -EBADMSG;\n 1097 | \n 1098 |                         jump_barrier = pos;","lines":17,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/libsystemd-network/dhcp-message.c#L1082-L1098"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"In `decompress_blob_lz4()`, `unaligned_read_le64(src)` is called twice back-to-back on the same `src` pointer: once to assign `size`, and again purely to re-validate it against the truncated `int`. The second call is redundant work on every LZ4 blob decompression.","fix":"Read once and reuse the value:\n\n```c\n// Before\nsize = unaligned_read_le64(src);\nif (size < 0 || (unsigned) size != unaligned_read_le64(src))\n        return -EFBIG;\n\n// After\nuint64_t size64 = unaligned_read_le64(src);\nsize = (int) size64;\nif (size < 0 || (unsigned) size != size64)\n        return -EFBIG;\n```","locations":[{"ref":"src/basic/compress.c:808-810","code":"  808 |         size = unaligned_read_le64(src);\n  809 |         if (size < 0 || (unsigned) size != unaligned_read_le64(src))\n  810 |                 return -EFBIG;","lines":3,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/compress.c#L808-L810"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`exec_context_deserialize()` has a branch matching the serialized key `exec-context-private-non-blocking=` (setting `c->non_blocking`), but `exec_context_serialize()` only ever emits the key `exec-context-non-blocking` (via `serialize_bool_elide` at line 1699), which is separately handled at line 2741. The `exec-context-private-non-blocking=` prefix is never produced, so this branch is unreachable dead code (an apparent leftover / duplicate of the `exec-context-non-blocking=` handler).","fix":"Remove the unreachable `exec-context-private-non-blocking=` branch (lines 2642-2646); the correct `exec-context-non-blocking=` handler at 2741 already covers it.","locations":[{"ref":"src/core/execute-serialize.c:2716-2720","code":" 2716 |                 } else if ((val = startswith(l, \"exec-context-private-non-blocking=\"))) {\n 2717 |                         r = parse_boolean(val);\n 2718 |                         if (r < 0)\n 2719 |                                 return r;\n 2720 |                         c->non_blocking = r;","lines":5,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/core/execute-serialize.c#L2716-L2720"},{"ref":"src/core/execute-serialize.c:2815-2819","code":" 2815 |                 } else if ((val = startswith(l, \"exec-context-non-blocking=\"))) {\n 2816 |                         r = parse_boolean(val);\n 2817 |                         if (r < 0)\n 2818 |                                 return r;\n 2819 |                         c->non_blocking = r;","lines":5,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/core/execute-serialize.c#L2815-L2819"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`sdio_ids_grammar()` is defined but never called: the `__main__` block parses `sdio.ids` with `pci_ids_grammar()` (`p = pci_ids_grammar().parseFile(open('sdio.ids', ...))`), so the dedicated `sdio_ids_grammar()` function is unreachable dead code.","fix":"Either use `sdio_ids_grammar()` for parsing `sdio.ids` (replace `pci_ids_grammar()` at line 410 with `sdio_ids_grammar()`), or remove the unused `sdio_ids_grammar()` function.","locations":[{"ref":"hwdb.d/ids_parser.py:108-124","code":"  108 | def sdio_ids_grammar():\n  109 |     # fmt: off\n  110 |     vendor_line = NUM4('vendor') + text_eol('text')\n  111 |     device_line = TAB + NUM4('device') + text_eol('text')\n  112 |     vendor = (vendor_line('VENDOR') +\n  113 |               ZeroOrMore(Group(device_line)('DEVICES*') ^ COMMENTLINE.suppress()))\n  114 | \n  115 |     klass = klass_grammar()\n  116 | \n  117 |     commentgroup = OneOrMore(COMMENTLINE).suppress() ^ EMPTYLINE.suppress()\n  118 |     grammar = OneOrMore(Group(vendor)('VENDORS*')\n  119 |                         ^ Group(klass)('CLASSES*')\n  120 |                         ^ commentgroup) + stringEnd()\n  121 |     # fmt: on\n  122 | \n  123 |     grammar.parseWithTabs()\n  124 |     return grammar","lines":17,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/hwdb.d/ids_parser.py#L108-L124"},{"ref":"hwdb.d/ids_parser.py:409-412","code":"  409 |     if not args or 'sdio' in args:\n  410 |         p = pci_ids_grammar().parseFile(open('sdio.ids', errors='replace'))\n  411 |         sdio_vendor_model(p)\n  412 |         sdio_classes(p)","lines":4,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/hwdb.d/ids_parser.py#L409-L412"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"`sysctl_write_ip_neighbor_property()` asserts `assert(ifname);` at the top of the function, yet the very next lines branch on `if (ifname) { ... } else { ... }`, where the `else` branch builds a path using `net/.../neigh/default/<property>` for the case `ifname == NULL`. Because of the preceding assert, that `else` branch (`src/basic/sysctl-util.c:162-163`) is unreachable in any build where `assert()` is active (systemd's own asserts are effectively always compiled in). This contradicts the sibling functions `sysctl_read_ip_property()` and `sysctl_write_ip_property()` in the same file, which do not assert `ifname` and genuinely support `ifname == NULL` to mean \"the default interface\". This looks like a copy-paste leftover: either the function is meant to support `ifname == NULL` (and the `assert` is wrong), or it never should have, and the dead `else` branch should be removed.","fix":"Either drop the unreachable `else` branch (since `ifname` can never be `NULL` here) and keep just the `if (ifname) { ... }` body inline, or, if `NULL` should be supported for consistency with `sysctl_read_ip_property()`/`sysctl_write_ip_property()`, remove the `assert(ifname);` at `src/basic/sysctl-util.c:153` so the existing `else` branch becomes reachable.","locations":[{"ref":"src/basic/sysctl-util.c:185-203","code":"  185 | int sysctl_write_ip_neighbor_property(int af, const char *ifname, const char *property, const char *value, Hashmap **shadow) {\n  186 |         const char *p;\n  187 | \n  188 |         assert(property);\n  189 |         assert(value);\n  190 |         assert(ifname);\n  191 | \n  192 |         if (!IN_SET(af, AF_INET, AF_INET6))\n  193 |                 return -EAFNOSUPPORT;\n  194 | \n  195 |         if (ifname) {\n  196 |                 if (!ifname_valid_full(ifname, IFNAME_VALID_SPECIAL))\n  197 |                         return -EINVAL;\n  198 |                 p = strjoina(\"net/\", af_to_ipv4_ipv6(af), \"/neigh/\", ifname, \"/\", property);\n  199 |         } else\n  200 |                 p = strjoina(\"net/\", af_to_ipv4_ipv6(af), \"/neigh/default/\", property);\n  201 | \n  202 |         return sysctl_write_full(p, value, shadow);\n  203 | }","lines":19,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/sysctl-util.c#L185-L203"}]},
