{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In `append_strings_to_message` in `man/sd-bus-container-append.c`, `s` is declared as a single `const char *` and initialized with `s = *arr`, which dereferences the array once and yields the *first string* in `arr`. The loop `for (s = *arr; *s; s++)` then walks that one string *character by character* (checking `*s` and incrementing `s` by one byte each iteration), calling `sd_bus_message_append(m, \"s\", s)` on the shrinking suffix of the first string at each position. The outer array pointer `arr` itself is never advanced, so every entry after `arr[0]` is silently skipped, and the appended values are nonsensical (successive suffixes of the first string) instead of the intended one-entry-per-array-element strings. This file is directly included as the documented example in `man/sd_bus_message_open_container.xml` (see `<xi:include href=\"sd-bus-container-append.c\" .../>`), so this broken pattern is what readers of the systemd manual are shown as correct usage of `sd_bus_message_open_container`/`sd_bus_message_append`.","fix":"Iterate over the array of pointers directly instead of dereferencing once and walking the string's bytes:\n\n```c\nint append_strings_to_message(sd_bus_message *m, const char *const *arr) {\n  int r;\n\n  r = sd_bus_message_open_container(m, 'a', \"s\");\n  if (r < 0)\n    return r;\n\n  for (; *arr; arr++) {\n    r = sd_bus_message_append(m, \"s\", *arr);\n    if (r < 0)\n      return r;\n  }\n\n  return sd_bus_message_close_container(m);\n}\n```","locations":[{"ref":"man/sd-bus-container-append.c:5-20","code":"    5 | int append_strings_to_message(sd_bus_message *m, const char *const *arr) {\n    6 |   const char *s;\n    7 |   int r;\n    8 | \n    9 |   r = sd_bus_message_open_container(m, 'a', \"s\");\n   10 |   if (r < 0)\n   11 |     return r;\n   12 | \n   13 |   for (s = *arr; *s; s++) {\n   14 |     r = sd_bus_message_append(m, \"s\", s);\n   15 |     if (r < 0)\n   16 |       return r;\n   17 |   }\n   18 | \n   19 |   return sd_bus_message_close_container(m);\n   20 | }","lines":16,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/man/sd-bus-container-append.c#L5-L20"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In `capability_quintet_enforce()`, when the caller also wants to change the bounding set (`q->bounding != CAP_MASK_UNSET`) and `CAP_SETPCAP` isn't already effective/permitted, the code makes a copy `CapabilityQuintet tmp = c;` and then calls `SET_BIT(c.effective, CAP_SETPCAP)` / `SET_BIT(c.permitted, CAP_SETPCAP)` on `c` — but then applies `capability_apply(&tmp)`, i.e. it enforces the *unmodified* copy that lacks the temporary `CAP_SETPCAP` bit, defeating the whole point of the block (per the adjacent comment: \"In order to change the bounding caps, we need to keep `CAP_SETPCAP` for a bit longer\"). Worse, at the end of the function, `if (modified) { r = capability_apply(&c); ... }` re-applies `c`, which was mutated in place and therefore *still has the temporary `CAP_SETPCAP` bit set*. The intended \"restore to final version without the temporary bit\" step ends up permanently granting the process `CAP_SETPCAP` in its effective/permitted sets even when `q` never requested it — an unintended capability retention. This function is used by systemd's privilege-dropping/enforcement paths, so this is a real over-privilege bug in security-sensitive code.","fix":"The `SET_BIT` calls must mutate `tmp` (the copy that gets applied immediately to gain `CAP_SETPCAP`), while `c` must stay untouched so the later \"final version\" `capability_apply(&c)` restores the correct state without the extra bit.\n\nBefore:\n```c\nCapabilityQuintet tmp = c;\n\nSET_BIT(c.effective, CAP_SETPCAP);\nSET_BIT(c.permitted, CAP_SETPCAP);\n\nmodified = true;\n\nr = capability_apply(&tmp);\n```\n\nAfter:\n```c\nCapabilityQuintet tmp = c;\n\nSET_BIT(tmp.effective, CAP_SETPCAP);\nSET_BIT(tmp.permitted, CAP_SETPCAP);\n\nmodified = true;\n\nr = capability_apply(&tmp);\n```","locations":[{"ref":"src/basic/capability-util.c:482-513","code":"  482 |                         if (q->bounding != CAP_MASK_UNSET &&\n  483 |                             (!BIT_SET(c.effective, CAP_SETPCAP) || !BIT_SET(c.permitted, CAP_SETPCAP))) {\n  484 |                                 CapabilityQuintet tmp = c;\n  485 | \n  486 |                                 SET_BIT(c.effective, CAP_SETPCAP);\n  487 |                                 SET_BIT(c.permitted, CAP_SETPCAP);\n  488 | \n  489 |                                 modified = true;\n  490 | \n  491 |                                 r = capability_apply(&tmp);\n  492 |                         } else\n  493 |                                 r = capability_apply(&c);\n  494 |                         if (r < 0)\n  495 |                                 return r;\n  496 |                 }\n  497 |         }\n  498 | \n  499 |         if (q->bounding != CAP_MASK_UNSET) {\n  500 |                 r = capability_bounding_set_drop(q->bounding, /* right_now= */ false);\n  501 |                 if (r < 0)\n  502 |                         return r;\n  503 |         }\n  504 | \n  505 |         /* If needed, let's now set the caps again, this time in the final version, which differs from what\n  506 |          * we have already set only in the CAP_SETPCAP bit, which we needed for dropping the bounding\n  507 |          * bits. This call only undoes bits and doesn't acquire any which means the bounding caps don't\n  508 |          * matter. */\n  509 |         if (modified) {\n  510 |                 r = capability_apply(&c);\n  511 |                 if (r < 0)\n  512 |                         return r;\n  513 |         }","lines":32,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/capability-util.c#L482-L513"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In `fd_set_sndbuf` and `fd_set_rcvbuf` the \"is the buffer already big enough\" check has a missing pair of\nparentheses. Because `&&` binds tighter than `?:` in C, `r >= 0 && l == sizeof(value) && increase ? (size_t) value >= n*2 : (size_t) value == n*2`\nactually parses as `(r >= 0 && l == sizeof(value) && increase) ? A : B`. So whenever `increase` is `false`\n(or the preceding `getsockopt()` failed, or returned a short `l`), the code unconditionally evaluates the\n`B` branch (`(size_t) value == n*2`) regardless of whether `getsockopt()` actually succeeded. This means the\nfunction can read the uninitialized local `value` and can spuriously decide the socket buffer is already the\nright size, skipping the `setsockopt(SO_SNDBUF/SO_RCVBUF)` call entirely, so the requested buffer size is\nsilently never applied.","fix":"Add explicit parentheses around the ternary so it is only evaluated once the `getsockopt()` result is known\ngood:\n\n```c\n// before\nif (r >= 0 && l == sizeof(value) && increase ? (size_t) value >= n*2 : (size_t) value == n*2)\n        return 0;\n\n// after\nif (r >= 0 && l == sizeof(value) && (increase ? (size_t) value >= n*2 : (size_t) value == n*2))\n        return 0;\n```\n\nApply the same fix to all four occurrences (two in `fd_set_sndbuf`, two in `fd_set_rcvbuf`).","locations":[{"ref":"src/basic/socket-util.c:706","code":"  706 |         if (r >= 0 && l == sizeof(value) && increase ? (size_t) value >= n*2 : (size_t) value == n*2)","lines":1,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/socket-util.c#L706"},{"ref":"src/basic/socket-util.c:718","code":"  718 |         if (r >= 0 && l == sizeof(value) && increase ? (size_t) value >= n*2 : (size_t) value == n*2)","lines":1,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/socket-util.c#L718"},{"ref":"src/basic/socket-util.c:737","code":"  737 |         if (r >= 0 && l == sizeof(value) && increase ? (size_t) value >= n*2 : (size_t) value == n*2)","lines":1,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/socket-util.c#L737"},{"ref":"src/basic/socket-util.c:749","code":"  749 |         if (r >= 0 && l == sizeof(value) && increase ? (size_t) value >= n*2 : (size_t) value == n*2)","lines":1,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/socket-util.c#L749"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In `open_file_for_upload()`, when a file (not stdin, not journal input) is uploaded and `arg_follow` is explicitly set to `false` (i.e. `--follow=false`/`--follow=0`), the whole `if (arg_follow != 0) { ... }` block is skipped. That block is the only place that either registers the `EPOLLIN` watch on the fd or, as a fallback, calls `start_upload()` directly for plain files (`/* Normal files should just be consumed without polling. */`). With `arg_follow == 0`, neither path runs: `u->input` is set to the open fd but `u->uploading` is never set and `start_upload()` is never invoked, so the file's contents are never read or uploaded. The main loop in `run()` then sees `u.input >= 0` on every iteration (so `open_file_for_upload()` is never retried) and `u.uploading == false` (so `perform_upload()` is never called), leaving `systemd-journal-upload` spinning in `sd_event_run()` forever without making progress or exiting.","fix":"Make the \"consume without polling\" fallback unconditional on `arg_follow == 0`, not just on `-EPERM` from `sd_event_add_io()`. For example:\n\n```c\nif (arg_follow != 0) {\n        r = sd_event_add_io(u->event, &u->input_event,\n                            fd, EPOLLIN, dispatch_fd_input, u);\n        if (r < 0) {\n                if (r != -EPERM || arg_follow > 0)\n                        return log_error_errno(r, \"Failed to register input event: %m\");\n\n                /* Normal files should just be consumed without polling. */\n                r = start_upload(u, fd_input_callback, u);\n        }\n} else\n        /* --follow=false: read the file once and upload it without waiting for more data. */\n        r = start_upload(u, fd_input_callback, u);\n\nreturn r;\n```","locations":[{"ref":"src/journal-remote/journal-upload.c:414-440","code":"  414 | static int open_file_for_upload(Uploader *u, const char *filename) {\n  415 |         int fd, r = 0;\n  416 | \n  417 |         if (streq(filename, \"-\"))\n  418 |                 fd = STDIN_FILENO;\n  419 |         else {\n  420 |                 fd = open(filename, O_RDONLY|O_CLOEXEC|O_NOCTTY);\n  421 |                 if (fd < 0)\n  422 |                         return log_error_errno(errno, \"Failed to open %s: %m\", filename);\n  423 |         }\n  424 | \n  425 |         u->input = fd;\n  426 | \n  427 |         if (arg_follow != 0) {\n  428 |                 r = sd_event_add_io(u->event, &u->input_event,\n  429 |                                     fd, EPOLLIN, dispatch_fd_input, u);\n  430 |                 if (r < 0) {\n  431 |                         if (r != -EPERM || arg_follow > 0)\n  432 |                                 return log_error_errno(r, \"Failed to register input event: %m\");\n  433 | \n  434 |                         /* Normal files should just be consumed without polling. */\n  435 |                         r = start_upload(u, fd_input_callback, u);\n  436 |                 }\n  437 |         }\n  438 | \n  439 |         return r;\n  440 | }","lines":27,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/journal-remote/journal-upload.c#L414-L440"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"The `discover_attempt` counter (used to bound `DHCPDISCOVER` retries against `client->max_discover_attempts`, configurable via `sd_dhcp_client_set_max_attempts()` / `MaxAttempts=`) is only reset to `0` in `client_set_state()` when transitioning into `DHCP_STATE_STOPPED` or `DHCP_STATE_BOUND` (see the switch at `client_set_state()`, lines 577-597, whose comment says the reset happens because `the next DHCPDISCOVER message will be sent in a new cycle`). However, `client_restart()` (called on `DHCPNAK` receipt, on `sd_dhcp_client_send_decline()`, and when `DHCP_STATE_REQUESTING`/`DHCP_STATE_REBOOTING` exhaust their retry budget in `client_timeout_resend()`'s `restart:` label) calls `client_start_delayed()`, which transitions the state machine directly from `DHCP_STATE_REQUESTING`/`DHCP_STATE_RENEWING`/`DHCP_STATE_REBINDING` to `DHCP_STATE_INIT` -- bypassing `DHCP_STATE_STOPPED` entirely. Because `DHCP_STATE_INIT` is not in the reset list, `discover_attempt` is never cleared before the new `DHCPDISCOVER` cycle begins. If `client->max_discover_attempts` was configured to a finite value (via `MaxAttempts=`) and a prior cycle already consumed most or all of that budget before obtaining an offer, the very next `client_timeout_resend()` invocation in `DHCP_STATE_SELECTING` immediately hits `client->discover_attempt >= client->max_discover_attempts` and fails with `-ETIMEDOUT`, terminating the client without ever sending a new `DHCPDISCOVER` -- even though this is supposed to be a fresh attempt cycle.","fix":"Reset `discover_attempt` whenever a new discovery cycle starts, i.e. also on transition into `DHCP_STATE_INIT` (and `DHCP_STATE_INIT_REBOOT`, which precedes it), not just `DHCP_STATE_STOPPED`/`DHCP_STATE_BOUND`:\n\n```c\nswitch (state) {\ncase DHCP_STATE_STOPPED:\ncase DHCP_STATE_BOUND:\ncase DHCP_STATE_INIT:\ncase DHCP_STATE_INIT_REBOOT:\n        /* In these cases, the next DHCPDISCOVER message will be sent in a new cycle.\n         * Hence, clear the counter for DHCPDISCOVER messages. */\n        client->discover_attempt = 0;\n        break;\n...\n```\n\nAlternatively, explicitly reset `client->discover_attempt = 0;` inside `client_start_delayed()` before calling `client_initialize_time_events()`, so it is cleared regardless of which state the client is transitioning from.","locations":[{"ref":"src/libsystemd-network/sd-dhcp-client.c:566-603","code":"  566 | static void client_set_state(sd_dhcp_client *client, DHCPState state) {\n  567 |         assert(client);\n  568 | \n  569 |         if (client->state == state)\n  570 |                 return;\n  571 | \n  572 |         log_dhcp_client(client, \"State changed: %s -> %s\",\n  573 |                         dhcp_state_to_string(client->state), dhcp_state_to_string(state));\n  574 | \n  575 |         client->state = state;\n  576 | \n  577 |         switch (state) {\n  578 |         case DHCP_STATE_STOPPED:\n  579 |         case DHCP_STATE_BOUND:\n  580 |                 /* In these cases, the next DHCPDISCOVER message will be sent in a new cycle.\n  581 |                  * Hence, clear the counter for DHCPDISCOVER messages. */\n  582 |                 client->discover_attempt = 0;\n  583 |                 break;\n  584 | \n  585 |         case DHCP_STATE_REBOOTING:\n  586 |         case DHCP_STATE_REQUESTING:\n  587 |         case DHCP_STATE_RENEWING:\n  588 |         case DHCP_STATE_REBINDING:\n  589 |                 /* In these cases, the next DHCPREQUEST message will be the first message in this new state.\n  590 |                  * Hence, clear the counter for DHCPREQUEST messages. */\n  591 |                 client->request_attempt = 0;\n  592 |                 break;\n  593 | \n  594 |         default:\n  595 |                 /* otherwise, do not reset the counters. */\n  596 |                 ;\n  597 |         }\n  598 | \n  599 |         // FIXME: If the state callback changes the state, we may not safely free/stop the client, and the\n  600 |         // state machine diagram becomes needlessly complicated. Introduce a guard to avoid that. */\n  601 |         if (client->state_callback)\n  602 |                 client->state_callback(client, state, client->state_userdata);\n  603 | }","lines":38,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/libsystemd-network/sd-dhcp-client.c#L566-L603"},{"ref":"src/libsystemd-network/sd-dhcp-client.c:827-876","code":"  827 | static int client_start_delayed(sd_dhcp_client *client) {\n  828 |         assert(client);\n  829 |         DHCP_CLIENT_DONT_DESTROY(client);\n  830 | \n  831 |         client_disable_event_sources(client);\n  832 |         client->lease = sd_dhcp_lease_unref(client->lease);\n  833 | \n  834 |         client->xid = random_u32();\n  835 |         client->start_time = now(CLOCK_BOOTTIME);\n  836 | \n  837 |         if (client->state != DHCP_STATE_INIT_REBOOT)\n  838 |                 client_set_state(client, DHCP_STATE_INIT);\n  839 | \n  840 |         return client_initialize_time_events(client);\n  841 | }\n  842 | \n  843 | static int client_start(sd_dhcp_client *client) {\n  844 |         assert(client);\n  845 | \n  846 |         client->start_delay = 0;\n  847 |         return client_start_delayed(client);\n  848 | }\n  849 | \n  850 | static int client_restart(sd_dhcp_client *client) {\n  851 |         assert(client);\n  852 |         DHCP_CLIENT_DONT_DESTROY(client);\n  853 | \n  854 |         /* This is called when we receive a DHCPNAK or could not receive any replies. */\n  855 | \n  856 |         /* First, if we have a bound lease, then notify it is expired. */\n  857 |         if (IN_SET(client->state, DHCP_STATE_BOUND, DHCP_STATE_RENEWING, DHCP_STATE_REBINDING)) {\n  858 |                 client_notify(client, SD_DHCP_CLIENT_EVENT_EXPIRED);\n  859 | \n  860 |                 if (client->state == DHCP_STATE_STOPPED)\n  861 |                         return 0; /* The notify callback stopped the client. */\n  862 |         }\n  863 | \n  864 |         /* On reboot, DHCPNAK or no reply suggests that the network is changed or the address is already\n  865 |          * used by another host. Let's restart the client immediately without any delay to speed up the\n  866 |          * reboot process. */\n  867 |         if (client->state == DHCP_STATE_REBOOTING)\n  868 |                 return client_start(client);\n  869 | \n  870 |         /* Otherwise, we should restart the client with a short delay. */\n  871 |         client->start_delay = CLAMP(client->start_delay * 2,\n  872 |                                     RESTART_AFTER_NAK_MIN_USEC, RESTART_AFTER_NAK_MAX_USEC);\n  873 | \n  874 |         log_dhcp_client(client, \"REBOOT in %s\", FORMAT_TIMESPAN(client->start_delay, USEC_PER_SEC));\n  875 |         return client_start_delayed(client);\n  876 | }","lines":50,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/libsystemd-network/sd-dhcp-client.c#L827-L876"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `pid_get_cmdline_nulstr()` the kernel-thread comm-fallback branch truncates the freshly built `\"[comm]\"` string by writing a NUL at `t[max_size]`, but `k` (the value later returned via `*ret_size`) is left at the pre-truncation `strlen(t)`. Because `k` is stale, callers that use it as an explicit length (rather than relying on the embedded NUL) see a length that no longer matches where the string was actually terminated.\n\nConcretely, in `pid_get_cmdline()`: the space-substitution loop `for (size_t i = 0; i < k - 1; i++) if (t[i] == '\\0') t[i] = ' ';` iterates past the truncation point using the stale `k` and turns the truncation NUL back into a space, un-truncating the string (the walk continues to the original, longer terminator). When `PROCESS_CMDLINE_QUOTE`/`PROCESS_CMDLINE_QUOTE_POSIX` is set instead, `strv_parse_nulstr_full(t, k, true)` is called with the stale `k`, which — because the buffer between the truncation NUL and the original terminator is untouched leftover data — produces a spurious extra entry in the returned argv vector for the truncated comm-fallback case.","fix":"Update `k` to the truncated length right after truncating, so `*ret_size` (and everything downstream that trusts it) reflects the actual content of `t`:\n\n```c\n// before\nk = strlen(t);\nr = k <= max_size;\nif (r == 0) /* truncation */\n        t[max_size] = '\\0';\n\n// after\nk = strlen(t);\nr = k <= max_size;\nif (r == 0) { /* truncation */\n        t[max_size] = '\\0';\n        k = max_size;\n}\n```","locations":[{"ref":"src/basic/process-util.c:205-214","code":"  205 |                 k = strlen(t);\n  206 |                 r = k <= max_size;\n  207 |                 if (r == 0) /* truncation */\n  208 |                         t[max_size] = '\\0';\n  209 |         }\n  210 | \n  211 |         if (ret)\n  212 |                 *ret = TAKE_PTR(t);\n  213 |         if (ret_size)\n  214 |                 *ret_size = k;","lines":10,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/process-util.c#L205-L214"},{"ref":"src/basic/process-util.c:262-268","code":"  262 |         } else {\n  263 |                 /* Arguments are separated by NULs. Let's replace those with spaces. */\n  264 |                 for (size_t i = 0; i < k - 1; i++)\n  265 |                         if (t[i] == '\\0')\n  266 |                                 t[i] = ' ';\n  267 | \n  268 |                 delete_trailing_chars(t, WHITESPACE);","lines":7,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/process-util.c#L262-L268"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `bus_unit_set_transient_property()` the `JobTimeoutUSec` branch is missing a `return r;`. It reads the value out of the message via `bus_set_transient_usec_fix_0()` and applies it to `u->job_timeout`, but then execution falls through every remaining `streq(name, ...)` check (none of which match `JobTimeoutUSec`) down to the final `return 0;` of the function. The intermediate `r` (1 on success) is discarded. The sibling `JobRunningTimeoutUSec` branch immediately below correctly ends with `return r;`. In `bus_unit_set_properties()`, a `0` return from the transient handler is then treated as \"property not handled\": it is passed on to `bus_unit_set_live_property()` (which also returns 0), so the whole SetProperties call aborts with a spurious `SD_BUS_ERROR_PROPERTY_READ_ONLY` (\"Cannot set property JobTimeoutUSec, or unknown property\"). No per-type `bus_set_property` handler (service/scope/mount) catches `JobTimeoutUSec`, and `JobTimeoutSec=` is renamed to `JobTimeoutUSec` in `bus-unit-util.c` and sent through exactly this path by `systemd-run`/D-Bus clients, so setting `JobTimeoutSec=` on a transient unit fails and the value is never committed.","fix":"Add the missing `return r;` at the end of the `JobTimeoutUSec` block so it mirrors the `JobRunningTimeoutUSec` block. Before:\n```c\nif (streq(name, \"JobTimeoutUSec\")) {\n        r = bus_set_transient_usec_fix_0(u, name, &u->job_timeout, message, flags, reterr_error);\n        if (r >= 0 && !UNIT_WRITE_FLAGS_NOOP(flags) && !u->job_running_timeout_set)\n                u->job_running_timeout = u->job_timeout;\n}\n```\nAfter:\n```c\nif (streq(name, \"JobTimeoutUSec\")) {\n        r = bus_set_transient_usec_fix_0(u, name, &u->job_timeout, message, flags, reterr_error);\n        if (r >= 0 && !UNIT_WRITE_FLAGS_NOOP(flags) && !u->job_running_timeout_set)\n                u->job_running_timeout = u->job_timeout;\n\n        return r;\n}\n```","locations":[{"ref":"src/core/dbus-unit.c:2371-2375","code":" 2371 |         if (streq(name, \"JobTimeoutUSec\")) {\n 2372 |                 r = bus_set_transient_usec_fix_0(u, name, &u->job_timeout, message, flags, reterr_error);\n 2373 |                 if (r >= 0 && !UNIT_WRITE_FLAGS_NOOP(flags) && !u->job_running_timeout_set)\n 2374 |                         u->job_running_timeout = u->job_timeout;\n 2375 |         }","lines":5,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/core/dbus-unit.c#L2371-L2375"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `unit_unlink_state_files()` the log-extra-fields state file is unlinked using the wrong path. `unit_export_log_extra_fields()` creates the file at `strjoina(\"/run/systemd/units/log-extra-fields:\", u->id)` (line 5954), and `journald-context.c:404` reads it from that exact path. But `unit_unlink_state_files()` tries to `unlink()` `strjoina(\"/run/systemd/units/extra-fields:\", u->id)` (missing the `log-` prefix). As a result the real file `/run/systemd/units/log-extra-fields:<id>` is never removed when the unit stops/is freed: it leaks in the runtime tmpfs, and (more importantly) journald keeps applying the stale `LogExtraFields=` to log records of any later unit that reuses the same unit name until the file is overwritten again. The `u->exported_log_extra_fields` flag is still cleared, so the leaked file also becomes orphaned from systemd's bookkeeping.","fix":"Use the same path string the exporter and journald use. Change:\n```\np = strjoina(\"/run/systemd/units/extra-fields:\", u->id);\n```\nto:\n```\np = strjoina(\"/run/systemd/units/log-extra-fields:\", u->id);\n```","locations":[{"ref":"src/core/unit.c:6115-6120","code":" 6115 |         if (u->exported_log_extra_fields) {\n 6116 |                 p = strjoina(\"/run/systemd/units/extra-fields:\", u->id);\n 6117 |                 (void) unlink(p);\n 6118 | \n 6119 |                 u->exported_log_extra_fields = false;\n 6120 |         }","lines":6,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/core/unit.c#L6115-L6120"},{"ref":"src/core/unit.c:5971","code":" 5971 |         const char *p = strjoina(\"/run/systemd/units/log-extra-fields:\", u->id);","lines":1,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/core/unit.c#L5971"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `measured_crypt_activate_by_volume_key()` the early `return 0` when `arg_tpm2_measure_pcr == UINT_MAX` also skips the subsequent `measure_keyslot()` call. Key-slot NvPCR measurement is controlled by the independent option `arg_tpm2_measure_keyslot_nvpcr` (see `measure_keyslot()`'s own guard `if (!arg_tpm2_measure_keyslot_nvpcr) return 0;`), not by `arg_tpm2_measure_pcr`. So whenever a user requests only key-slot measurement (e.g. crypttab option `tpm2-measure-keyslot-nvpcr=cryptsetup`) without also requesting volume-key PCR measurement (`tpm2-measure-pcr=`), the requested key-slot measurement is silently never performed on any code path that activates via the volume key. The sibling `measured_crypt_activate_by_passphrase()` handles this correctly: its `shortcut:` path still calls `measure_keyslot()` when `arg_tpm2_measure_pcr == UINT_MAX`. Because `use_token_plugins()` returns false whenever `arg_tpm2_measure_keyslot_nvpcr` is set, activations flow through these wrappers, and the volume-key path is reached for plain-mode/tcrypt/token `pass_volume_key` activations, and also for a normal LUKS2 passphrase unlock when `arg_fixate_volume_key` is set (then `measured_crypt_activate_by_passphrase()` retrieves the volume key and calls into `measured_crypt_activate_by_volume_key()`, hitting the early return).","fix":"Do not return early before `measure_keyslot()`. Guard only the volume-key measurement, then always attempt the key-slot measurement:\n```c\n        if (arg_tpm2_measure_pcr != UINT_MAX) {\n                if (volume_key_size > 0)\n                        (void) measure_volume_key(cd, name, volume_key, volume_key_size); /* OK if fails */\n                else\n                        log_debug(\"Not measuring volume key, none specified.\");\n        } else\n                log_debug(\"Not measuring volume key, deactivated.\");\n\n        (void) measure_keyslot(cd, name, mechanism, keyslot); /* ditto */\n        return r;\n```","locations":[{"ref":"src/cryptsetup/cryptsetup.c:1133-1144","code":" 1133 |         if (arg_tpm2_measure_pcr == UINT_MAX) {\n 1134 |                 log_debug(\"Not measuring volume key, deactivated.\");\n 1135 |                 return 0;\n 1136 |         }\n 1137 | \n 1138 |         if (volume_key_size > 0)\n 1139 |                 (void) measure_volume_key(cd, name, volume_key, volume_key_size); /* OK if fails */\n 1140 |         else\n 1141 |                 log_debug(\"Not measuring volume key, none specified.\");\n 1142 | \n 1143 |         (void) measure_keyslot(cd, name, mechanism, keyslot); /* ditto */\n 1144 |         return r;","lines":12,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/cryptsetup/cryptsetup.c#L1133-L1144"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `update_cursor_state()`, the `fail:` label unconditionally runs `(void) unlink(u->state_file);` before returning the error. This path is reached not only when `rename()` of the temp file fails, but also when `fopen_temporary()` fails (e.g. transient permission or disk-space problem on the parent directory) or when `fflush_and_check()` fails while writing the new cursor. In all of those cases `u->state_file` itself was never touched — it still holds the last known-good `LAST_CURSOR=` value — yet the code deletes it anyway. A transient I/O error therefore destroys a perfectly valid, previously-persisted cursor file, so the next run of `systemd-journal-upload` loses its resume position and re-uploads already-sent journal entries (or otherwise loses cursor continuity) even though nothing was actually wrong with the old state file.","fix":"Only remove the state file when the rename step itself is what failed (i.e. after the temp file was already fully written), not on earlier failures where the existing state file was never going to be replaced:\n\n```c\nr = fopen_temporary(u->state_file, &f, &temp_path);\nif (r < 0)\n        return log_error_errno(r, \"Cannot save state to %s: %m\", u->state_file);\n\nfprintf(f, \"# This is private data. Do not parse.\\nLAST_CURSOR=%s\\n\", u->last_cursor);\n\nr = fflush_and_check(f);\nif (r < 0)\n        return log_error_errno(r, \"Failed to save state %s: %m\", u->state_file);\n\nif (rename(temp_path, u->state_file) < 0) {\n        r = -errno;\n        (void) unlink(u->state_file); /* only here: rename left things in an inconsistent state */\n        return log_error_errno(r, \"Failed to save state %s: %m\", u->state_file);\n}\n\ntemp_path = mfree(temp_path);\nreturn 0;\n```\n\nThe `_cleanup_(unlink_and_freep)` on `temp_path` already takes care of removing the leftover temp file on any early-return path, so the extra `unlink(u->state_file)` is only appropriate once the old file has actually been superseded.","locations":[{"ref":"src/journal-remote/journal-upload.c:133-166","code":"  133 | static int update_cursor_state(Uploader *u) {\n  134 |         _cleanup_(unlink_and_freep) char *temp_path = NULL;\n  135 |         _cleanup_fclose_ FILE *f = NULL;\n  136 |         int r;\n  137 | \n  138 |         if (!u->state_file || !u->last_cursor)\n  139 |                 return 0;\n  140 | \n  141 |         r = fopen_temporary(u->state_file, &f, &temp_path);\n  142 |         if (r < 0)\n  143 |                 goto fail;\n  144 | \n  145 |         fprintf(f,\n  146 |                 \"# This is private data. Do not parse.\\n\"\n  147 |                 \"LAST_CURSOR=%s\\n\",\n  148 |                 u->last_cursor);\n  149 | \n  150 |         r = fflush_and_check(f);\n  151 |         if (r < 0)\n  152 |                 goto fail;\n  153 | \n  154 |         if (rename(temp_path, u->state_file) < 0) {\n  155 |                 r = -errno;\n  156 |                 goto fail;\n  157 |         }\n  158 | \n  159 |         temp_path = mfree(temp_path);\n  160 |         return 0;\n  161 | \n  162 | fail:\n  163 |         (void) unlink(u->state_file);\n  164 | \n  165 |         return log_error_errno(r, \"Failed to save state %s: %m\", u->state_file);\n  166 | }","lines":34,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/journal-remote/journal-upload.c#L133-L166"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `parse_env_file_internal()`'s state machine, the `line` counter (used to annotate `push()` diagnostics like `\"%s:%u: invalid syntax ...\"`) is only incremented on real end-of-line transitions. The `VALUE_ESCAPE` and `DOUBLE_QUOTE_VALUE_ESCAPE` states consume an escaped newline (`\\` followed by `\n`, a \"continuation line\") without ever incrementing `line`, even though a literal newline byte was read from `contents`. This is inconsistent with the `COMMENT_ESCAPE` state a few lines below, which does `line++` when it hits the same kind of trailing-escape newline (`compress.c` sibling pattern in this same file, see the `if (strchr(NEWLINE, c)) { state = PRE_KEY; line++; }` block). As a result, any env-file line number reported by `push()` after a backslash-continued (unquoted or double-quoted) value is off by one for every continuation used earlier in the file, producing misleading `%s:%u:` diagnostics for later syntax/UTF-8 errors.","fix":"In `VALUE_ESCAPE` and `DOUBLE_QUOTE_VALUE_ESCAPE`, increment `line` when the consumed character is a newline (i.e. in the branch that currently just eats the escaped newline), the same way `COMMENT_ESCAPE` already does, so line numbers stay accurate for later diagnostics.","locations":[{"ref":"src/basic/env-file.c:183-193","code":"  183 |                 case VALUE_ESCAPE:\n  184 |                         state = VALUE;\n  185 | \n  186 |                         if (!strchr(NEWLINE, c)) {\n  187 |                                 /* Escaped newlines we eat up entirely */\n  188 |                                 if (!GREEDY_REALLOC(value, n_value+2))\n  189 |                                         return -ENOMEM;\n  190 | \n  191 |                                 value[n_value++] = c;\n  192 |                         }\n  193 |                         break;","lines":11,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/env-file.c#L183-L193"},{"ref":"src/basic/env-file.c:221-239","code":"  221 |                 case DOUBLE_QUOTE_VALUE_ESCAPE:\n  222 |                         state = DOUBLE_QUOTE_VALUE;\n  223 | \n  224 |                         if (strchr(SHELL_NEED_ESCAPE, c)) {\n  225 |                                 /* If this is a char that needs escaping, just unescape it. */\n  226 |                                 if (!GREEDY_REALLOC(value, n_value+2))\n  227 |                                         return -ENOMEM;\n  228 |                                 value[n_value++] = c;\n  229 |                         } else if (c != '\\n') {\n  230 |                                 /* If other char than what needs escaping, keep the \"\\\" in place, like the\n  231 |                                  * real shell does. */\n  232 |                                 if (!GREEDY_REALLOC(value, n_value+3))\n  233 |                                         return -ENOMEM;\n  234 |                                 value[n_value++] = '\\\\';\n  235 |                                 value[n_value++] = c;\n  236 |                         }\n  237 | \n  238 |                         /* Escaped newlines (aka \"continuation lines\") are eaten up entirely */\n  239 |                         break;","lines":19,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/env-file.c#L221-L239"},{"ref":"src/basic/env-file.c:250-258","code":"  250 |                 case COMMENT_ESCAPE:\n  251 |                         log_debug(\"The line which doesn't begin with \\\";\\\" or \\\"#\\\", but follows a comment\" \\\n  252 |                                   \" line trailing with escape is now treated as a non comment line since v254.\");\n  253 |                         if (strchr(NEWLINE, c)) {\n  254 |                                 state = PRE_KEY;\n  255 |                                 line++;\n  256 |                         } else\n  257 |                                 state = COMMENT;\n  258 |                         break;","lines":9,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/env-file.c#L250-L258"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`resolve_xat_fdroot()` in `src/basic/fd-util.c` only assigns `*ret_buffer` in two of the three possible branches: when `*fd == XAT_FDROOT` and `isempty(*path)` (sets it to `NULL`), and when the path is relative (sets it to the newly allocated joined path). When `*fd == XAT_FDROOT` and `*path` is already a non-empty, absolute path, neither the `if (isempty(*path))` nor the `else if (!path_is_absolute(*path))` branch executes, so `*ret_buffer` is left completely untouched even though the function returns `1` (success). The function relies entirely on the caller having pre-initialized the pointer to `NULL` (both current call sites in `src/basic/stat-util.c` do `_cleanup_free_ char *p = NULL;` before calling), but nothing in the function's contract enforces or documents this, making it a latent trap for any future caller that doesn't zero-initialize its buffer pointer first - it would then free/use a garbage pointer via `_cleanup_free_`.","fix":"Add an explicit `else` branch so `*ret_buffer` is always set on every path through the function. For example:\n\n```c\nif (isempty(*path)) {\n        *path = \"/\";\n        *ret_buffer = NULL;\n} else if (!path_is_absolute(*path)) {\n        char *p = strjoin(\"/\", *path);\n        if (!p)\n                return -ENOMEM;\n\n        *path = *ret_buffer = p;\n} else\n        *ret_buffer = NULL;\n```","locations":[{"ref":"src/basic/fd-util.c:1114-1138","code":" 1114 | int resolve_xat_fdroot(int *fd, const char **path, char **ret_buffer) {\n 1115 |         assert(fd);\n 1116 |         assert(path);\n 1117 |         assert(ret_buffer);\n 1118 | \n 1119 |         if (*fd != XAT_FDROOT) {\n 1120 |                 *ret_buffer = NULL;\n 1121 |                 return 0;\n 1122 |         }\n 1123 | \n 1124 |         if (isempty(*path)) {\n 1125 |                 *path = \"/\";\n 1126 |                 *ret_buffer = NULL;\n 1127 |         } else if (!path_is_absolute(*path)) {\n 1128 |                 char *p = strjoin(\"/\", *path);\n 1129 |                 if (!p)\n 1130 |                         return -ENOMEM;\n 1131 | \n 1132 |                 *path = *ret_buffer = p;\n 1133 |         }\n 1134 | \n 1135 |         *fd = AT_FDCWD;\n 1136 | \n 1137 |         return 1;\n 1138 | }","lines":25,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/fd-util.c#L1114-L1138"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `cmdline_get_key()`, when the same key appears multiple times on the command line with different forms, e.g. `foo=bar1 foo` (a valued occurrence followed by a bare occurrence, `PROC_CMDLINE_VALUE_OPTIONAL` set), the loop lets a later `key=value` occurrence overwrite `v` via `free_and_strdup(&v, e+1)` (correct \"last occurrence wins\" behavior), but the bare-word branch `else if (*e == 0 && FLAGS_SET(flags, PROC_CMDLINE_VALUE_OPTIONAL)) found = true;` only sets `found`, it never resets `v`. So for `foo=bar1 foo`, the function returns `found=true` but `*ret_value` still holds the stale `\"bar1\"` from the earlier occurrence, instead of `NULL` as the later, argument-less occurrence should imply under \"last occurrence wins\" semantics (which the rest of the function otherwise implements).","fix":"In the optional-bare-word branch, clear any previously captured value so the later occurrence truly wins: `} else if (*e == 0 && FLAGS_SET(flags, PROC_CMDLINE_VALUE_OPTIONAL)) { v = mfree(v); found = true; }`.","locations":[{"ref":"src/basic/proc-cmdline.c:294-324","code":"  294 |         STRV_FOREACH(p, args) {\n  295 |                 const char *word;\n  296 | \n  297 |                 word = mangle_word(*p, flags);\n  298 |                 if (!word)\n  299 |                         continue;\n  300 | \n  301 |                 if (ret_value) {\n  302 |                         const char *e;\n  303 | \n  304 |                         e = proc_cmdline_key_startswith(word, key);\n  305 |                         if (!e)\n  306 |                                 continue;\n  307 | \n  308 |                         if (*e == '=') {\n  309 |                                 r = free_and_strdup(&v, e+1);\n  310 |                                 if (r < 0)\n  311 |                                         return r;\n  312 | \n  313 |                                 found = true;\n  314 | \n  315 |                         } else if (*e == 0 && FLAGS_SET(flags, PROC_CMDLINE_VALUE_OPTIONAL))\n  316 |                                 found = true;\n  317 | \n  318 |                 } else {\n  319 |                         if (proc_cmdline_key_streq(word, key)) {\n  320 |                                 found = true;\n  321 |                                 break; /* we found what we were looking for */\n  322 |                         }\n  323 |                 }\n  324 |         }","lines":31,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/proc-cmdline.c#L294-L324"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`procfs_tasks_set_limit()` reads `pid_max` once at the top of the function. If `limit > pid_max-1` it bumps `/proc/sys/kernel/pid_max` to `limit+1`, but never updates the local `pid_max` variable to reflect that. Later, if writing `/proc/sys/kernel/threads-max` fails, the recovery path checks `MIN(pid_max - 1, threads_max) != limit` to decide whether the desired state was already reached by someone else. Since `pid_max` is still the old (too-small) value whenever the bump branch executed, `pid_max - 1` is by construction `< limit`, so this comparison can never be equal and the recovery path always falls through to returning the original error, even in cases where the actual current system state (after the successful `pid_max` bump) matches what was requested.","fix":"Keep the local `pid_max` variable in sync with the value that was actually written to the kernel, e.g.:\n\n```c\nif (limit > pid_max-1) {\n        xsprintf(buffer, \"%\" PRIu64, limit+1);\n        r = write_string_file(\"/proc/sys/kernel/pid_max\", buffer, WRITE_STRING_FILE_DISABLE_BUFFER);\n        if (r < 0)\n                return r;\n        pid_max = limit+1;\n}\n```\n\nso the later `MIN(pid_max - 1, threads_max) != limit` recovery check uses the up-to-date value.","locations":[{"ref":"src/basic/procfs-util.c:59-84","code":"   59 |         r = procfs_get_pid_max(&pid_max);\n   60 |         if (r < 0)\n   61 |                 return r;\n   62 | \n   63 |         /* As pid_max is about the numeric pid_t range we'll bump it if necessary, but only ever increase it, never\n   64 |          * decrease it, as threads-max is the much more relevant sysctl. */\n   65 |         if (limit > pid_max-1) {\n   66 |                 xsprintf(buffer, \"%\" PRIu64, limit+1); /* Add one, since PID 0 is not a valid PID */\n   67 |                 r = write_string_file(\"/proc/sys/kernel/pid_max\", buffer, WRITE_STRING_FILE_DISABLE_BUFFER);\n   68 |                 if (r < 0)\n   69 |                         return r;\n   70 |         }\n   71 | \n   72 |         xsprintf(buffer, \"%\" PRIu64, limit);\n   73 |         r = write_string_file(\"/proc/sys/kernel/threads-max\", buffer, WRITE_STRING_FILE_DISABLE_BUFFER);\n   74 |         if (r < 0) {\n   75 |                 uint64_t threads_max;\n   76 | \n   77 |                 /* Hmm, we couldn't write this? If so, maybe it was already set properly? In that case let's not\n   78 |                  * generate an error */\n   79 | \n   80 |                 if (procfs_get_threads_max(&threads_max) < 0)\n   81 |                         return r; /* return original error */\n   82 | \n   83 |                 if (MIN(pid_max - 1, threads_max) != limit)\n   84 |                         return r; /* return original error */","lines":26,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/procfs-util.c#L59-L84"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `socket_address_verify()`'s strict `AF_UNIX` validation, the branch that handles a non-NUL-terminated\n`sun_path` (comment: \"the size needs to match the whole structure or the structure with one extra NUL byte\nsuffixed\") checks `a->size` against `sizeof(a->sockaddr.un.sun_path)` (just the 108-byte path array), not\nagainst `sizeof(struct sockaddr_un)` (the whole structure, i.e. `offsetof(sun_path)` + 108). Since\n`offsetof(struct sockaddr_un, sun_path)` is non-zero (2 bytes for `sun_family`), a legitimate, fully-populated,\nnon-NUL-terminated `AF_UNIX` filesystem socket address (`a->size == sizeof(struct sockaddr_un)` or `+1`, which\nis explicitly allowed by the earlier `a->size > sizeof(struct sockaddr_un) + !strict` bound just above) is\nincorrectly rejected with `-EINVAL` here, because `sizeof(struct sockaddr_un)` is 2 bytes larger than\n`sizeof(sun_path)` and thus never matches the `IN_SET(...)` check.","fix":"Compare against the size of the whole `sockaddr_un` structure, matching the comment's stated intent and the\nsibling embedded-NUL branch (which correctly adds `offsetof(struct sockaddr_un, sun_path)`):\n\n```c\nif (!IN_SET(a->size, sizeof(struct sockaddr_un), sizeof(struct sockaddr_un)+1))\n        return -EINVAL;\n```","locations":[{"ref":"src/basic/socket-util.c:111-118","code":"  111 |                         } else {\n  112 |                                 /* If there's no embedded NUL byte, then the size needs to match the whole\n  113 |                                  * structure or the structure with one extra NUL byte suffixed. (Yeah, Linux is awful,\n  114 |                                  * and considers both equivalent: getsockname() even extends sockaddr_un beyond its\n  115 |                                  * size if the path is non NUL terminated.) */\n  116 |                                 if (!IN_SET(a->size, sizeof(a->sockaddr.un.sun_path), sizeof(a->sockaddr.un.sun_path)+1))\n  117 |                                         return -EINVAL;\n  118 |                         }","lines":8,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/socket-util.c#L111-L118"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The docstring of `ellipsize_mem()` states the contract: `1. If the string passed in is fully ASCII and the current locale is not UTF-8, three dots are used (\"...\")` and `2. Otherwise, a unicode ellipsis is used (\"…\")`. The fast path (`ascii_ellipsize_mem()`) correctly implements this by consulting `is_locale_utf8()`. However, whenever the input contains ANSI escape sequences (`has_ansi_seq` true, detected via `string_has_ansi_sequence()`), the code always falls through to the general (slow) path even if the rest of the string is pure ASCII, and that path calls `write_ellipsis(e + len, /* unicode= */ true)` unconditionally at `src/basic/string-util.c:513`, forcing a UTF-8 ellipsis glyph regardless of `is_locale_utf8()`. So an ASCII string containing only ANSI color codes, ellipsized while running under a non-UTF-8 locale (e.g. `C`/`POSIX`, common in containers and scripts), gets a 3-byte UTF-8 ellipsis character injected instead of the documented `\"...\"`, which can render as mojibake on a non-UTF-8 terminal.","fix":"Make the forced `unicode` argument to `write_ellipsis()` at line `513` conditional on locale/content, e.g. `write_ellipsis(e + len, /* unicode= */ is_locale_utf8() || !ascii_is_valid_n(s, old_length))`, so ANSI-only-but-otherwise-ASCII strings in a non-UTF-8 locale still get the ASCII `\"...\"` ellipsis as documented.","locations":[{"ref":"src/basic/string-util.c:394-403","code":"  394 |         /* Note that 'old_length' refers to bytes in the string, while 'new_length' refers to character cells taken up\n  395 |          * on screen. This distinction doesn't matter for ASCII strings, but it does matter for non-ASCII UTF-8\n  396 |          * strings.\n  397 |          *\n  398 |          * Ellipsation is done in a locale-dependent way:\n  399 |          * 1. If the string passed in is fully ASCII and the current locale is not UTF-8, three dots are used (\"...\")\n  400 |          * 2. Otherwise, a unicode ellipsis is used (\"…\")\n  401 |          *\n  402 |          * In other words: you'll get a unicode ellipsis as soon as either the string contains non-ASCII characters or\n  403 |          * the current locale is UTF-8.","lines":10,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/string-util.c#L394-L403"},{"ref":"src/basic/string-util.c:415-419","code":"  415 |         bool has_ansi_seq = string_has_ansi_sequence(s, old_length);\n  416 | \n  417 |         /* If no multibyte characters or ANSI sequences, use ascii_ellipsize_mem for speed */\n  418 |         if (!has_ansi_seq && ascii_is_valid_n(s, old_length))\n  419 |                 return ascii_ellipsize_mem(s, old_length, new_length, percent);","lines":5,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/string-util.c#L415-L419"},{"ref":"src/basic/string-util.c:510-515","code":"  510 |         char *e = new(char, alloc_len);\n  511 |         if (!e)\n  512 |                 return NULL;\n  513 | \n  514 |         memcpy_safe(e, s, len);\n  515 |         write_ellipsis(e + len, /* unicode= */ true);","lines":6,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/string-util.c#L510-L515"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `format_timestamp_style()` the early buffer-size guard is mis-parenthesized. The intent is to compute a minimum required length that includes the weekday+date part (`3 + 1 + 10`) plus, for non-`TIMESTAMP_DATE` styles, the time/zone part. But C operator precedence binds `+` tighter than `==` and `==` tighter than `?:`, so the operand of the cast actually parses as `((3 + 1 + 10 + style) == TIMESTAMP_DATE) ? 0 : ((1 + 8 + (us ? 7 : 0) + 1 + (utc ? 3 : 1)) + 1)`. Since `14 + style` can never equal `TIMESTAMP_DATE`, the condition is always false and the check degenerates to only the else expression, dropping the `3 + 1 + 10` weekday/date contribution and ignoring the `TIMESTAMP_DATE` special-case entirely. The guard therefore under-estimates the needed length by 14 bytes. It does not cause an out-of-bounds write in practice because the subsequent `memcpy(buf, weekday, 4)` is still covered (the else expression is always >= 12) and the later `strftime`/`sprintf`/`strcpy` calls are individually length-checked, but the guard as written does not do what it claims and callers passing a too-small buffer get `NULL` from `strftime` truncation rather than from this fast path.","fix":"Add explicit parentheses so the ternary and its condition are grouped as intended, e.g.:\n```c\nif (l < (size_t) (3 +                    /* week day */\n                  1 + 10 +               /* space and date */\n                  (style == TIMESTAMP_DATE ? 0 :\n                   (1 + 8 +               /* space and time */\n                    (us ? 1 + 6 : 0) +    /* \".\" and microsecond part */\n                    1 + (utc ? 3 : 1))) + /* space and shortest possible zone */\n                  1))\n        return NULL;\n```\nWrap the whole `style == TIMESTAMP_DATE ? 0 : (...)` sub-expression in parentheses so it is added to `3 + 1 + 10 + ... + 1` rather than consuming them as the ternary condition.","locations":[{"ref":"src/basic/time-util.c:365-372","code":"  365 |         if (l < (size_t) (3 +                   /* week day */\n  366 |                           1 + 10 +              /* space and date */\n  367 |                           style == TIMESTAMP_DATE ? 0 :\n  368 |                           (1 + 8 +              /* space and time */\n  369 |                            (us ? 1 + 6 : 0) +   /* \".\" and microsecond part */\n  370 |                            1 + (utc ? 3 : 1)) + /* space and shortest possible zone */\n  371 |                           1))\n  372 |                 return NULL; /* Not enough space even for the shortest form. */","lines":8,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/time-util.c#L365-L372"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`sysfail_get_error_str()` returns the string `u\"firmware-updare-failure\"` for `SYSFAIL_FIRMWARE_UPDATE`. `updare` is a typo for `update`. This value is stored verbatim into the `LoaderSysFailReason` EFI variable (see `sysfail_process()` in src/boot/boot.c:1876-1878), so it is a machine-readable reason string that userspace/tools may match against; the typo makes the reported reason wrong.","fix":"Fix the spelling:\n```c\nreturn u\"firmware-updare-failure\";\n```\nto:\n```c\nreturn u\"firmware-update-failure\";\n```","locations":[{"ref":"src/boot/sysfail.c:35","code":"   35 |                 return u\"firmware-updare-failure\";","lines":1,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/boot/sysfail.c#L35"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"The `BPFProgram` line emitted by `cgroup_context_dump()` is missing the trailing newline present in every other `fprintf()` in this function. As a result the dumped `BPFProgram: <type>:<path>` entry runs directly into whatever is printed next (e.g. `SocketBindAllow:` or the next foreign program), producing malformed `systemctl show`/status dump output.","fix":"Add the missing `\\n`:\n```c\nLIST_FOREACH(programs, p, c->bpf_foreign_programs)\n        fprintf(f, \"%sBPFProgram: %s:%s\\n\",\n                prefix, bpf_cgroup_attach_type_to_string(p->attach_type), p->bpffs_path);\n```","locations":[{"ref":"src/core/cgroup.c:650-652","code":"  650 |         LIST_FOREACH(programs, p, c->bpf_foreign_programs)\n  651 |                 fprintf(f, \"%sBPFProgram: %s:%s\",\n  652 |                         prefix, bpf_cgroup_attach_type_to_string(p->attach_type), p->bpffs_path);","lines":3,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/core/cgroup.c#L650-L652"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `exec_context_dump()` the return value of `base64mem()` is `ssize_t` (negative on OOM/error, `0` for empty, `>0` on success), but the code guards the print with `if (len)`. A negative error value is non-zero, so on `base64mem()` failure the code proceeds to `fprintf(\"...%s...\", encoded)` with `encoded` still `NULL` (base64mem does not set the output pointer on failure), printing `(null)`. Note the sibling `root_hash` (hexmem) path correctly checks `if (encoded)`.","fix":"Guard on a positive length. Before:\n```\nlen = base64mem(c->root_hash_sig.iov_base, c->root_hash_sig.iov_len, &encoded);\nif (len)\n        fprintf(f, \"%sRootHashSignature: base64:%s\\n\", prefix, encoded);\n```\nAfter:\n```\nlen = base64mem(c->root_hash_sig.iov_base, c->root_hash_sig.iov_len, &encoded);\nif (len > 0)\n        fprintf(f, \"%sRootHashSignature: base64:%s\\n\", prefix, encoded);\n```","locations":[{"ref":"src/core/execute.c:1269-1275","code":" 1269 |         if (iovec_is_set(&c->root_hash_sig)) {\n 1270 |                 _cleanup_free_ char *encoded = NULL;\n 1271 |                 ssize_t len;\n 1272 |                 len = base64mem(c->root_hash_sig.iov_base, c->root_hash_sig.iov_len, &encoded);\n 1273 |                 if (len)\n 1274 |                         fprintf(f, \"%sRootHashSignature: base64:%s\\n\", prefix, encoded);\n 1275 |         }","lines":7,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/core/execute.c#L1269-L1275"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `process_deps()`, the masked-dropin branch logs the drop-in name using the `entry` variable, but at that point `entry` is still `NULL`. `entry` is declared `NULL` at the top of the loop body and only assigned later by `path_extract_filename(*p, &entry)` (line 62), which runs *after* the `null_or_empty_path()` check at line 43. So whenever a dependency dropin is masked, the debug message prints `(null)` instead of the actual dropin filename, giving misleading diagnostics (`%s dependency on (null) is masked by %s`).","fix":"Use `*p` (the full path, which is available) in the message instead of the not-yet-populated `entry`. Before:\n```c\nif (null_or_empty_path(*p) > 0) {\n        /* an error usually means an invalid symlink, which is not a mask */\n        log_unit_debug(u, \"%s dependency on %s is masked by %s, ignoring.\",\n                       unit_dependency_to_string(dependency), entry, *p);\n        continue;\n}\n```\nAfter:\n```c\nif (null_or_empty_path(*p) > 0) {\n        /* an error usually means an invalid symlink, which is not a mask */\n        log_unit_debug(u, \"%s dependency %s is masked, ignoring.\",\n                       unit_dependency_to_string(dependency), *p);\n        continue;\n}\n```","locations":[{"ref":"src/core/load-dropin.c:41-48","code":"   41 |                 _cleanup_free_ char *target = NULL, *target_file = NULL, *entry = NULL;\n   42 | \n   43 |                 if (null_or_empty_path(*p) > 0) {\n   44 |                         /* an error usually means an invalid symlink, which is not a mask */\n   45 |                         log_unit_debug(u, \"%s dependency on %s is masked by %s, ignoring.\",\n   46 |                                        unit_dependency_to_string(dependency), entry, *p);\n   47 |                         continue;\n   48 |                 }","lines":8,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/core/load-dropin.c#L41-L48"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `os_release_status()`, after `cunescape()` decodes `FANCY_NAME=` into the local `unescaped`, the code validates the wrong variable: it calls `utf8_is_valid(fancy_name)` on the still-escaped source string instead of on the decoded `unescaped` result. The commit that added this check (`fa41ce1142` \"hostnamed: after unescaping fancy name, validate it's valid UTF-8\") and the very log line it prints (`\"Unescaped FANCY_NAME= contains invalid UTF-8, ignoring.\"`) both make clear the intent is to validate the *unescaped* bytes. Because an escaped string like `\\xff\\xfe` is itself valid ASCII/UTF-8, `utf8_is_valid(fancy_name)` returns true and the invalid decoded bytes slip through into `free_and_replace(fancy_name, unescaped)` and are later written to `/dev/console` via `status_printf()`. The log message also contradicts the code, since it never actually inspects the unescaped form. Impact is limited to the cosmetic boot banner, but it is a real correctness bug (garbage/invalid-UTF-8 emitted to the console).","fix":"Validate the decoded result rather than the source string. Change:\n```c\n} else if (!utf8_is_valid(fancy_name)) {\n```\nto:\n```c\n} else if (!utf8_is_valid(unescaped)) {\n```","locations":[{"ref":"src/core/main.c:1521-1529","code":" 1521 |                         ssize_t l = cunescape(fancy_name, /* flags= */ 0, &unescaped);\n 1522 |                         if (l < 0) {\n 1523 |                                 log_debug_errno(l, \"Failed to unescape FANCY_NAME=, ignoring: %m\");\n 1524 |                                 fancy_name = mfree(fancy_name);\n 1525 |                         } else if (!utf8_is_valid(fancy_name)) {\n 1526 |                                 log_debug(\"Unescaped FANCY_NAME= contains invalid UTF-8, ignoring.\");\n 1527 |                                 fancy_name = mfree(fancy_name);\n 1528 |                         } else {\n 1529 |                                 free_and_replace(fancy_name, unescaped);","lines":9,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/core/main.c#L1521-L1529"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `apply_mounts()` the `deny_list` passed to `bind_remount_recursive_with_mountinfo()` is meant to list mount subtrees to *exclude* from a recursive remount. It is fully populated with every mount-entry path for the read-only (second) round at lines 2470-2472. The noexec (third) round is documented as using a \"simplified deny list\" (only `MOUNT_EXEC`/`MOUNT_NOEXEC` entries), but the loop at lines 2484-2486 only *re-writes* the EXEC/NOEXEC slots (to the same values) and never clears the other slots, so the array still contains ALL mount-entry paths. The simplification therefore never happens: every other mount entry stays in the deny list during the noexec pass. Concretely, for a `NoExecPaths=/foo` entry with a nested `BindReadOnlyPaths=/foo/bar` child, the recursive `MS_NOEXEC` flip of `/foo` skips `/foo/bar` (because it is deny-listed) even though `/foo/bar` has no noexec handling of its own, so the child submount is left executable, silently weakening the `NoExecPaths=`/`ExecPaths=` hardening for nested mounts. The comment (\"simplified deny list\") also contradicts the actual behavior.","fix":"Clear the array before rebuilding the simplified list for the noexec round, so only EXEC/NOEXEC paths remain deny-listed:\n\n```c\n/* Third round, flip the noexec bits with a simplified deny list. */\nfor (size_t j = 0; j < ml->n_mounts; j++)\n        deny_list[j] = IN_SET((ml->mounts+j)->mode, MOUNT_EXEC, MOUNT_NOEXEC)\n                        ? (char*) mount_entry_path(ml->mounts+j)\n                        : NULL;\n```\n\nNote `deny_list` is a NULL-terminated `char**` iterated with `STRV_FOREACH` in `bind_remount_recursive_with_mountinfo()`, so embedded NULLs would truncate it. If interior NULLs are not acceptable, instead compact the matching paths to the front and NUL-terminate after the last one. Either way the array must be rebuilt, not just partially overwritten.","locations":[{"ref":"src/core/namespace.c:2503-2507","code":" 2503 |         /* Third round, flip the noexec bits with a simplified deny list. */\n 2504 |         for (size_t j = 0; j < ml->n_mounts; j++)\n 2505 |                 if (IN_SET((ml->mounts+j)->mode, MOUNT_EXEC, MOUNT_NOEXEC))\n 2506 |                         deny_list[j] = (char*) mount_entry_path(ml->mounts+j);\n 2507 |         deny_list[ml->n_mounts] = NULL;","lines":5,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/core/namespace.c#L2503-L2507"},{"ref":"src/core/namespace.c:2486-2492","code":" 2486 |         /* Create a deny list we can pass to bind_mount_recursive() */\n 2487 |         deny_list = new(char*, ml->n_mounts+1);\n 2488 |         if (!deny_list)\n 2489 |                 return -ENOMEM;\n 2490 |         for (size_t j = 0; j < ml->n_mounts; j++)\n 2491 |                 deny_list[j] = (char*) mount_entry_path(ml->mounts+j);\n 2492 |         deny_list[ml->n_mounts] = NULL;","lines":7,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/core/namespace.c#L2486-L2492"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `log_callback()`, when `HAVE_AUDIT` is compiled in and an audit fd is available (`fd >= 0`) and `vasprintf()` succeeds (`r >= 0`), the code only forwards messages of type `SELINUX_AVC` and `SELINUX_ERROR` to `sym_audit_log_user_avc_message()`, then unconditionally does `return 0`. For other libselinux message types (`SELINUX_WARNING`, `SELINUX_INFO`), `buf` is formatted but neither audit branch runs and the function returns before reaching the normal `log_internalv()` fallback. As a result those warning/info diagnostics from libselinux are silently discarded whenever the audit path is active, instead of being logged via the usual channel.","fix":"Only `return 0` early when the message was actually emitted to audit (i.e. for `SELINUX_AVC`/`SELINUX_ERROR`); otherwise fall through to the `log_internalv()` path so `SELINUX_WARNING`/`SELINUX_INFO` still get logged. For example, replace the unconditional `return 0;` after the `else if` with logic that only returns when one of the two audit branches was taken, e.g.:\n```c\nif (r >= 0) {\n        if (type == SELINUX_AVC) {\n                sym_audit_log_user_avc_message(fd, AUDIT_USER_AVC, buf, NULL, NULL, NULL, getuid());\n                return 0;\n        } else if (type == SELINUX_ERROR) {\n                sym_audit_log_user_avc_message(fd, AUDIT_USER_SELINUX_ERR, buf, NULL, NULL, NULL, getuid());\n                return 0;\n        }\n        /* fall through for WARNING/INFO */\n}\n```","locations":[{"ref":"src/core/selinux-access.c:112-128","code":"  112 |         if (fd >= 0) {\n  113 |                 _cleanup_free_ char *buf = NULL;\n  114 |                 int r;\n  115 | \n  116 |                 va_start(ap, fmt);\n  117 |                 r = vasprintf(&buf, fmt, ap);\n  118 |                 va_end(ap);\n  119 | \n  120 |                 if (r >= 0) {\n  121 |                         if (type == SELINUX_AVC)\n  122 |                                 sym_audit_log_user_avc_message(fd, AUDIT_USER_AVC, buf, NULL, NULL, NULL, getuid());\n  123 |                         else if (type == SELINUX_ERROR)\n  124 |                                 sym_audit_log_user_avc_message(fd, AUDIT_USER_SELINUX_ERR, buf, NULL, NULL, NULL, getuid());\n  125 | \n  126 |                         return 0;\n  127 |                 }\n  128 |         }","lines":17,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/core/selinux-access.c#L112-L128"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `parse_proc_cmdline_item`, the `rootfstype=` handler stores `value` directly, unlike every sibling handler which normalizes empty strings via `empty_to_null(value)` (see `mount.usrfstype` at line 1318 in the same file, and `rootfstype` at `fstab-generator.c:1532`). An empty `rootfstype=` on the kernel command line therefore leaves `arg_root_fstype` as an empty string `\"\"` rather than `NULL`. That non-NULL empty string then flows into `add_root_mount()` -> `add_mount()`, where `else if (fstype)` is taken for the empty string and `dissect_fstype_ok(\"\")` is consulted, which does not accept the empty type, so root-mount unit generation fails with an error (`EIDRM`/refusal) instead of treating the filesystem type as unspecified. It also gets copied into `arg_usr_fstype` at line 952 (`if (arg_root_fstype && !arg_usr_fstype)`), propagating the empty string to the `/usr` mount too.","fix":"Normalize the empty value like the neighboring handlers do:\n```\n// before\nreturn free_and_strdup_warn(&arg_root_fstype, value);\n// after\nreturn free_and_strdup_warn(&arg_root_fstype, empty_to_null(value));\n```","locations":[{"ref":"src/gpt-auto-generator/gpt-auto-generator.c:1290","code":" 1290 |                 return free_and_strdup_warn(&arg_root_fstype, value);","lines":1,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/gpt-auto-generator/gpt-auto-generator.c#L1290"}]},
{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`home_unlock()` calls `home_ratelimit(h, error)` before the state `switch` (`src/home/homed-home.c:2195-2211`), unlike every other operation entry point (`home_fixate`, `home_activate`, `home_authenticate`, `home_update`, `home_resize`, `home_passwd`) which validates the home state first and only then ratelimits. Because `home_ratelimit()` mutates the record (`user_record_ratelimit()`) and performs a synchronous disk write via `home_save_record()` for any non-`HOME_UNFIXATED` state, an `Unlock` call against a home that is not locked (e.g. `HOME_ACTIVE`, `HOME_INACTIVE`) still burns an authentication token and writes the record to disk before returning `BUS_ERROR_HOME_NOT_LOCKED`, and can even mask the real error with `AUTHENTICATION_LIMIT_HIT`.","fix":"Move the `home_ratelimit()` call to after the state `switch` (immediately before `return home_unlock_internal(...)`), matching the ordering used by the other `home_*` operations, so only a genuinely `HOME_LOCKED` home is ratelimited and written to disk.","locations":[{"ref":"src/home/homed-home.c:2191-2215","code":" 2191 | int home_unlock(Home *h, UserRecord *secret, sd_bus_error *error) {\n 2192 |         int r;\n 2193 | \n 2194 |         assert(h);\n 2195 |         assert(secret);\n 2196 | \n 2197 |         r = home_ratelimit(h, error);\n 2198 |         if (r < 0)\n 2199 |                 return r;\n 2200 | \n 2201 |         switch (home_get_state(h)) {\n 2202 |         case HOME_UNFIXATED:\n 2203 |         case HOME_ABSENT:\n 2204 |         case HOME_INACTIVE:\n 2205 |         case HOME_ACTIVE:\n 2206 |         case HOME_LINGERING:\n 2207 |         case HOME_DIRTY:\n 2208 |                 return sd_bus_error_setf(error, BUS_ERROR_HOME_NOT_LOCKED, \"Home %s is not locked.\", h->user_name);\n 2209 |         case HOME_LOCKED:\n 2210 |                 break;\n 2211 |         default:\n 2212 |                 return sd_bus_error_setf(error, BUS_ERROR_HOME_BUSY, \"An operation on home %s is currently being executed.\", h->user_name);\n 2213 |         }\n 2214 | \n 2215 |         return home_unlock_internal(h, secret, HOME_UNLOCKING, error);","lines":25,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/home/homed-home.c#L2191-L2215"}]},
{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"The CIFS mount options string uses `file_mode=0%3o` / `dir_mode=0%3o`, which space-pads (not zero-pads) the octal mode to width 3. `user_record_access_mode(h)` is a user-controllable mode value; if it produces fewer than 3 octal digits (e.g. mode `0`, `07`, `070`), `%3o` emits leading spaces, yielding a malformed option like `file_mode=0  0`, which the CIFS mount rejects. The intent is zero-padding (`%03o`). Impact is limited (mount failure on unusual modes, not a crash), and the code is long-standing, but the format specifier is objectively wrong for its purpose.","fix":"Use zero-padding instead of space-padding.\nBefore:\n```c\nif (asprintf(&options, \"user=%s,uid=\" UID_FMT \",forceuid,gid=\" GID_FMT \",forcegid,file_mode=0%3o,dir_mode=0%3o\",\n```\nAfter:\n```c\nif (asprintf(&options, \"user=%s,uid=\" UID_FMT \",forceuid,gid=\" GID_FMT \",forcegid,file_mode=0%03o,dir_mode=0%03o\",\n```","locations":[{"ref":"src/home/homework-cifs.c:60-62","code":"   60 |         if (asprintf(&options, \"user=%s,uid=\" UID_FMT \",forceuid,gid=\" GID_FMT \",forcegid,file_mode=0%3o,dir_mode=0%3o\",\n   61 |                      user_record_cifs_user_name(h), h->uid, user_record_gid(h), user_record_access_mode(h),\n   62 |                      user_record_access_mode(h)) < 0)","lines":3,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/home/homework-cifs.c#L60-L62"}]},
{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `parse_id_descriptor` (`src/journal/journalctl.c:146-185`), when the input is long enough to be treated as an ID128 (`strlen(x) >= SD_ID128_STRING_MAX - 1`), the code calls `sd_id128_from_string(t, &id)` and only advances `x` past the ID when `r >= 0` (line 165-166). If `sd_id128_from_string` fails (`r < 0`), `x` is **not** advanced, and the return value `r` is never checked or propagated - the function instead falls through to `if (!IN_SET(*x, 0, '-', '+')) return -EINVAL;` using the *original*, un-advanced `x`. This means an invalid ID128 that happens to start with `-` or `+` skips the early-return and falls into `safe_atoi(x, &off)` being called on the entire original string (ID prefix included) rather than on the intended offset suffix. In practice `safe_atoi` still rejects such strings (they overflow `int` or contain non-digit characters), so the end result is usually still an error, but only by accident of `safe_atoi`'s range checking, not because the code correctly detected the ID128 parse failure. This is fragile: it silently swallows the real error from `sd_id128_from_string`, and any future change to `safe_atoi`'s bounds/behavior (or to `SD_ID128_STRING_MAX`) could let a malformed `--boot=`/`--invocation=` descriptor be silently accepted as a numeric offset with a bogus `SD_ID128_NULL` id.","fix":"Check the return value of `sd_id128_from_string` immediately and propagate the error instead of relying on the fallthrough logic:\n\n```c\nt = strndupa_safe(x, SD_ID128_STRING_MAX - 1);\nr = sd_id128_from_string(t, &id);\nif (r < 0)\n        return r;\nx += SD_ID128_STRING_MAX - 1;\n\nif (!IN_SET(*x, 0, '-', '+'))\n        return -EINVAL;\n```\n\nThis makes the control flow depend only on whether the ID128 actually parsed, rather than on incidental behavior of the later `safe_atoi` call.","locations":[{"ref":"src/journal/journalctl.c:170-190","code":"  170 |         if (strlen(x) >= SD_ID128_STRING_MAX - 1) {\n  171 |                 char *t;\n  172 | \n  173 |                 t = strndupa_safe(x, SD_ID128_STRING_MAX - 1);\n  174 |                 r = sd_id128_from_string(t, &id);\n  175 |                 if (r >= 0)\n  176 |                         x += SD_ID128_STRING_MAX - 1;\n  177 | \n  178 |                 if (!IN_SET(*x, 0, '-', '+'))\n  179 |                         return -EINVAL;\n  180 | \n  181 |                 if (*x != 0) {\n  182 |                         r = safe_atoi(x, &off);\n  183 |                         if (r < 0)\n  184 |                                 return r;\n  185 |                 }\n  186 |         } else {\n  187 |                 r = safe_atoi(x, &off);\n  188 |                 if (r < 0)\n  189 |                         return r;\n  190 |         }","lines":21,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/journal/journalctl.c#L170-L190"}]},
{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `sort_dump()`, the accumulator `same` (a run of consecutive tab-indented lines sharing the same field name) is only flushed into `unit` inside the `elif line.startswith('\\t')` branch when the field name *changes* (`unit.extend(sorted(same, ...))`). The last field group of every unit is therefore never flushed: at the end of a unit the next line is either a new `->` header or EOF, neither of which flushes `same`. So `units[unit[0]] = unit` is stored (lines 38-39 and 52-53) missing that unit's final field group. Additionally, `same` is initialized once (line 28) and never reset per unit, so when a `->` starts a new `unit` the stale `same` from the previous unit persists; if the new unit's first tab-line shares the previous group's field name, `same[0].startswith(header)` matches and the previous unit's lines get appended and later spilled into the *new* unit, contaminating cross-unit output.","fix":"Flush and reset `same` at each unit boundary and after the loop. In the `->` branch flush before saving/replacing the unit, and reset `same`:\n```python\nsame = []\nfor line in sourcefile:\n    line = line.rstrip()\n    header = line.split(':')[0]\n    if 'Timestamp' in header or 'Invocation ID' in header or 'PID' in header:\n        line = header + ': …'\n\n    if line.startswith('->'):\n        if unit:\n            unit.extend(sorted(same, key=str.lower))\n            units[unit[0]] = unit\n        same = []\n        unit = [line]\n    elif line.startswith('\\t'):\n        assert unit\n        if same and same[0].startswith(header):\n            same.append(line)\n        else:\n            unit.extend(sorted(same, key=str.lower))\n            same = [line]\n    else:\n        print(line, file=destfile)\n\nif unit:\n    unit.extend(sorted(same, key=str.lower))\n    units[unit[0]] = unit\n```","locations":[{"ref":"tools/analyze-dump-sort.py:28-56","code":"   28 |     same = []\n   29 | \n   30 |     for line in sourcefile:\n   31 |         line = line.rstrip()\n   32 | \n   33 |         header = line.split(':')[0]\n   34 |         if 'Timestamp' in header or 'Invocation ID' in header or 'PID' in header:\n   35 |             line = header + ': …'\n   36 | \n   37 |         if line.startswith('->'):\n   38 |             if unit:\n   39 |                 units[unit[0]] = unit\n   40 |             unit = [line]\n   41 |         elif line.startswith('\\t'):\n   42 |             assert unit\n   43 | \n   44 |             if same and same[0].startswith(header):\n   45 |                 same.append(line)\n   46 |             else:\n   47 |                 unit.extend(sorted(same, key=str.lower))\n   48 |                 same = [line]\n   49 |         else:\n   50 |             print(line, file=destfile)\n   51 | \n   52 |     if unit:\n   53 |         units[unit[0]] = unit\n   54 | \n   55 |     for unit in sorted(units.values()):\n   56 |         print('\\n'.join(unit), file=destfile)","lines":29,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/tools/analyze-dump-sort.py#L28-L56"}]},
