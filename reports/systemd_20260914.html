{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `exec_context_serialize()` the NUMA block already returns early via `if (!nodes) return log_oom_debug();` at line 2005, so the subsequent `if (nodes)` at line 2008 is always true and redundant.","fix":"Drop the redundant inner guard. Before:\n```\nif (!nodes)\n        return log_oom_debug();\n\nif (nodes) {\n        r = serialize_item(f, \"exec-context-numa-mask\", nodes);\n        if (r < 0)\n                return r;\n}\n```\nAfter:\n```\nif (!nodes)\n        return log_oom_debug();\n\nr = serialize_item(f, \"exec-context-numa-mask\", nodes);\nif (r < 0)\n        return r;\n```","locations":[{"ref":"src/core/execute-serialize.c:2012-2020","code":" 2012 |                 nodes = cpu_set_to_range_string(&c->numa_policy.nodes);\n 2013 |                 if (!nodes)\n 2014 |                         return log_oom_debug();\n 2015 | \n 2016 |                 if (nodes) {\n 2017 |                         r = serialize_item(f, \"exec-context-numa-mask\", nodes);\n 2018 |                         if (r < 0)\n 2019 |                                 return r;\n 2020 |                 }","lines":9,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/core/execute-serialize.c#L2012-L2020"}]},
{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `manager_varlink_done()` the managed-oomd connection is already closed and cleared by `sd_varlink_close_unref(TAKE_PTR(m->managed_oom_varlink))` (line 632), which sets `m->managed_oom_varlink` to `NULL`. The later statement `m->managed_oom_varlink = sd_varlink_close_unref(m->managed_oom_varlink)` (line 637) therefore always operates on `NULL` and is dead/redundant. It looks like a rebase leftover from when the explicit two-step close at the top was added, and is confusing since it appears to close a connection that was already released.","fix":"Remove the redundant reassignment at line 637.\n\nBefore:\n```c\n        sd_varlink_close_unref(TAKE_PTR(m->managed_oom_varlink));\n\n        m->pending_reload_message_vl = sd_varlink_unref(m->pending_reload_message_vl);\n\n        m->varlink_server = sd_varlink_server_unref(m->varlink_server);\n        m->managed_oom_varlink = sd_varlink_close_unref(m->managed_oom_varlink);\n\n        m->metrics_varlink_server = sd_varlink_server_unref(m->metrics_varlink_server);\n```\nAfter:\n```c\n        sd_varlink_close_unref(TAKE_PTR(m->managed_oom_varlink));\n\n        m->pending_reload_message_vl = sd_varlink_unref(m->pending_reload_message_vl);\n\n        m->varlink_server = sd_varlink_server_unref(m->varlink_server);\n\n        m->metrics_varlink_server = sd_varlink_server_unref(m->metrics_varlink_server);\n```","locations":[{"ref":"src/core/varlink.c:632-639","code":"  632 |         sd_varlink_close_unref(TAKE_PTR(m->managed_oom_varlink));\n  633 | \n  634 |         m->pending_reload_message_vl = sd_varlink_unref(m->pending_reload_message_vl);\n  635 | \n  636 |         m->varlink_server = sd_varlink_server_unref(m->varlink_server);\n  637 |         m->managed_oom_varlink = sd_varlink_close_unref(m->managed_oom_varlink);\n  638 | \n  639 |         m->metrics_varlink_server = sd_varlink_server_unref(m->metrics_varlink_server);","lines":8,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/core/varlink.c#L632-L639"}]},

{"id":"DEAD_7","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`manager_add_home_by_image()` contains a duplicated `assert(m);` statement back-to-back.","fix":"Remove the redundant second `assert(m);`.\nBefore:\n```c\n        assert(m);\n\n        assert(m);\n        assert(user_name);\n```\nAfter:\n```c\n        assert(m);\n        assert(user_name);\n```","locations":[{"ref":"src/home/homed-manager.c:718","code":"  718 |         assert(m);","lines":1,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/home/homed-manager.c#L718"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The comment describing the dm-clone table parameters mislabels the constant `1` in the constructed params string. The actual kernel dm-clone constructor syntax is `<metadata> <dest> <source> <region_size> [<#feature_args> <feature_arg>...]`, so the `1` emitted in `\"%s %s %s %\" PRIu64 \" 1 no_hydration\"` is the *number of feature args* (i.e. exactly one feature: `no_hydration`), NOT a `hydration threshold (regions to hydrate per batch)` as the comment claims. The string itself is valid; only the comment is wrong and would mislead a maintainer into thinking they could tune a batch size there.","fix":"Reword the comment so `1` is described as the feature-argument count. For example change `1 = hydration threshold (regions to hydrate per batch) no_hydration = don't start automatic background hydration` to `1 = number of feature args that follow; no_hydration = the single feature arg, disabling automatic background hydration`.","locations":[{"ref":"src/clonesetup/clonesetup-ioctl.c:190-201","code":"  190 |         /* dm-clone target params: <metadata_dev> <dest_dev> <source_dev> <region_size> <hydration_threshold> [options]\n  191 |          *   region_size = region size in sectors, configurable via clonetab (default 8 = 4KB regions with\n  192 |          *   512-byte sectors) 1 = hydration threshold (regions to hydrate per batch) no_hydration = don't\n  193 |          *   start automatic background hydration\n  194 |          *\n  195 |          * The DM table \"target_params\" string is passed directly to the kernel via ioctl(fd, DM_TABLE_LOAD,\n  196 |          * ...) in dm_clone_load_table as a raw byte buffer. The kernel's DM table parser\n  197 |          * (drivers/md/dm-table.c) simply splits the params string on whitespace, so the only constraint is\n  198 |          * that the paths in params - metadata_dev, dest_dev, source_dev, and region_size must not contain\n  199 |          * spaces, which standard /dev/ paths never do, so the below args do NOT require shell escaping */\n  200 |         if (asprintf(&target_params, \"%s %s %s %\" PRIu64 \" 1 no_hydration\",\n  201 |                                 metadata_dev, dest_dev, source_dev, region_size_sectors) < 0)","lines":12,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/clonesetup/clonesetup-ioctl.c#L190-L201"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"`dhcp6_option_parse_ia_pdprefix()` in `src/libsystemd-network/dhcp6-option.c` rejects out-of-range PD prefix lengths with a comment claiming symmetry with the sender side:\n```c\n/* RFC 8415 defines the prefix length as 1…128; reject the out-of-range values the sender-side\n * counterpart option_append_pd_prefix() also refuses. */\nif (a->iapdprefix.prefixlen == 0 || a->iapdprefix.prefixlen > 128)\n        return log_dhcp6_client_errno(...);\n```\nHowever `option_append_pd_prefix()` (same file, a few hundred lines above) only checks the lower bound:\n```c\nstatic int option_append_pd_prefix(uint8_t **buf, size_t *offset, const struct iapdprefix *prefix) {\n        ...\n        if (prefix->prefixlen == 0)\n                return -EINVAL;\n```\nIt never rejects `prefixlen > 128`, so a caller of `dhcp6_option_append_ia()` (e.g. via a corrupted/attacker-influenced `DHCP6IA` built from a prefix-delegation hint) can cause the client to *send* a PD prefix option with a `prefixlen` value up to 255, contradicting the comment's claim and RFC 8415's 1-128 range.","fix":"Either add the missing upper-bound check to `option_append_pd_prefix()` so the comment in `dhcp6_option_parse_ia_pdprefix()` is accurate:\n```c\nstatic int option_append_pd_prefix(uint8_t **buf, size_t *offset, const struct iapdprefix *prefix) {\n        ...\n        if (prefix->prefixlen == 0 || prefix->prefixlen > 128)\n                return -EINVAL;\n```\nor, if the upper bound is intentionally not enforced on the sender side, correct the comment in `dhcp6_option_parse_ia_pdprefix()` so it no longer claims a symmetry that does not exist.","locations":[{"ref":"src/libsystemd-network/dhcp6-option.c:312-319","code":"  312 | static int option_append_pd_prefix(uint8_t **buf, size_t *offset, const struct iapdprefix *prefix) {\n  313 |         assert(buf);\n  314 |         assert(*buf);\n  315 |         assert(offset);\n  316 |         assert(prefix);\n  317 | \n  318 |         if (prefix->prefixlen == 0)\n  319 |                 return -EINVAL;","lines":8,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/libsystemd-network/dhcp6-option.c#L312-L319"},{"ref":"src/libsystemd-network/dhcp6-option.c:675-680","code":"  675 |         /* RFC 8415 defines the prefix length as 1…128; reject the out-of-range values the sender-side\n  676 |          * counterpart option_append_pd_prefix() also refuses. */\n  677 |         if (a->iapdprefix.prefixlen == 0 || a->iapdprefix.prefixlen > 128)\n  678 |                 return log_dhcp6_client_errno(client, SYNTHETIC_ERRNO(EINVAL),\n  679 |                                               \"Received a PD prefix with invalid prefix length %u, ignoring.\",\n  680 |                                               a->iapdprefix.prefixlen);","lines":6,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/libsystemd-network/dhcp6-option.c#L675-L680"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The warning message in `manager_dispatch_stop_when_bound_queue()` contains a garbled duplicated word: `\"...bound to inactive unit %s it, but not stopping...\"`. The stray `it` after the `%s` (unit id) is a copy/edit artifact - the sibling queues (`manager_dispatch_stop_when_unneeded_queue`, `manager_dispatch_start_when_upheld_queue`) do not have it. Purely a user-facing log wording defect, no functional impact.","fix":"Remove the stray `it`:\n```c\nlog_unit_warning(u,\n                 \"Unit needs to be stopped because it is bound to inactive unit %s, but not stopping since we tried this too often recently.%s\",\n                 culprit->id,\n                 r == 0 ? \" Will retry later.\" : \"\");\n```","locations":[{"ref":"src/core/manager.c:1632-1635","code":" 1632 |                         log_unit_warning(u,\n 1633 |                                          \"Unit needs to be stopped because it is bound to inactive unit %s it, but not stopping since we tried this too often recently.%s\",\n 1634 |                                          culprit->id,\n 1635 |                                          r == 0 ? \" Will retry later.\" : \"\");","lines":4,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/core/manager.c#L1632-L1635"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The header comment misspells the kernel command line variable as `systemd.factor_reset=` (the actual option parsed elsewhere is `systemd.factory_reset=`) and the sentence is grammatically broken (\"pulls factory-reset-now.target into the initial transaction the kernel command line's ... variable ... say so\").","fix":"Fix the typo and grammar, e.g.:\n```c\n/* This generator pulls factory-reset-now.target into the initial transaction if the kernel command line's\n * systemd.factory_reset= variable, or the FactoryResetRequest EFI variable, say so. */\n```","locations":[{"ref":"src/factory-reset/factory-reset-generator.c:8-9","code":"    8 | /* This generator pulls factory-reset-now.target into the initial transaction the kernel command line's\n    9 |  * systemd.factor_reset= variable, or the FactoryResetRequest EFI variable say so. */","lines":2,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/factory-reset/factory-reset-generator.c#L8-L9"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"In `json_dispatch_oci_manifest_config` the SHA256 digest mismatch of the inline manifest config `data` is reported with the message `\"Manifest data size mismatch.\"`. This is a content/digest mismatch, not a size mismatch (the size check one line above already emits `\"Manifest config size mismatch.\"`). The wrong wording makes a real integrity-verification failure confusing to diagnose.","fix":"Change the message to reflect a digest mismatch. Before:\n```c\n                if (memcmp_nn(sha256_direct(config->data.iov_base, config->data.iov_len, h), SHA256_DIGEST_SIZE,\n                              config->digest.iov_base, config->digest.iov_len) != 0)\n                        return json_log(v, SD_JSON_LOG, SYNTHETIC_ERRNO(EBADMSG), \"Manifest data size mismatch.\");\n```\nAfter:\n```c\n                if (memcmp_nn(sha256_direct(config->data.iov_base, config->data.iov_len, h), SHA256_DIGEST_SIZE,\n                              config->digest.iov_base, config->digest.iov_len) != 0)\n                        return json_log(v, SD_JSON_LOG, SYNTHETIC_ERRNO(EBADMSG), \"Manifest config digest mismatch.\");\n```","locations":[{"ref":"src/import/pull-oci.c:744-746","code":"  744 |                 if (memcmp_nn(sha256_direct(config->data.iov_base, config->data.iov_len, h), SHA256_DIGEST_SIZE,\n  745 |                               config->digest.iov_base, config->digest.iov_len) != 0)\n  746 |                         return json_log(v, SD_JSON_LOG, SYNTHETIC_ERRNO(EBADMSG), \"Manifest data size mismatch.\");","lines":3,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/import/pull-oci.c#L744-L746"}]},
{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Typo in the error string in `oci_pull_save_nspawn_settings`: `\"Embedded NUL by in JSON config data, refusing.\"` - the word `by` should be `byte` (compare the correct wording `\"Embedded NUL byte in JSON data, refusing.\"` in `pull_job_payload_as_json_object`).","fix":"Before:\n```c\n                return log_error_errno(SYNTHETIC_ERRNO(EBADMSG), \"Embedded NUL by in JSON config data, refusing.\");\n```\nAfter:\n```c\n                return log_error_errno(SYNTHETIC_ERRNO(EBADMSG), \"Embedded NUL byte in JSON config data, refusing.\");\n```","locations":[{"ref":"src/import/pull-oci.c:958","code":"  958 |                 return log_error_errno(SYNTHETIC_ERRNO(EBADMSG), \"Embedded NUL by in JSON config data, refusing.\");","lines":1,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/import/pull-oci.c#L958"}]},
{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"very_easy","description":"In `config_select_default_entry()` the \"preferred\" selection block contains an extra, redundant lookup. Lines 1913-1917 do `config_find_entry(config, config->entry_preferred_config, true)` unconditionally, and then the immediately following `else` branch at line 1922-1923 performs the *identical* call `config_find_entry(config, config->entry_preferred_config, true)`. The symmetric \"default\" block below (lines 1931-1946) has only two lookups (efivar-with-saved, then config-with-saved) with no such extra call, confirming lines 1913-1917 are an unintended duplicate/leftover. It is functionally harmless (when `use_saved_entry_preferred` is false the extra call is identical to line 1923; when true, `entry_preferred_config` equals `@saved` which `efi_fnmatch()` won't match any real entry `id`), so it only adds a redundant scan over all entries, but it makes the preferred/default logic asymmetric and confusing.","fix":"Remove the redundant block so the preferred logic mirrors the default block. Delete:\n```c\n        i = config_find_entry(config, config->entry_preferred_config, /* check_assessment= */ true);\n        if (i != IDX_INVALID) {\n                config->idx_default = i;\n                return;\n        }\n\n```\nleaving the `if (config->use_saved_entry_preferred) ... else config_find_entry(config, config->entry_preferred_config, true)` block (1919-1927) as the sole config-preferred lookup, matching the structure of the default block at 1931-1946.","locations":[{"ref":"src/boot/boot.c:1913-1917","code":" 1913 |         i = config_find_entry(config, config->entry_preferred_config, /* check_assessment= */ true);\n 1914 |         if (i != IDX_INVALID) {\n 1915 |                 config->idx_default = i;\n 1916 |                 return;\n 1917 |         }","lines":5,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/boot/boot.c#L1913-L1917"}]},
{"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"negligible","difficulty":"hard","description":"`bus_exec_context_set_transient_property` is a single monolithic dispatcher of roughly 2,480 lines handling every transient `ExecContext` property inline. While this matches an established systemd idiom, it is an oversized function that mixes parsing, validation, mutation and serialization for dozens of unrelated settings, making it hard to review for the kinds of copy-paste/validation slips that are easy to introduce here. Noted for completeness; not an actionable defect.","fix":"Optionally split per-setting-group handlers (paths, credentials, seccomp, rlimits, directories, images) into separate helper functions dispatched from a table, as done elsewhere in the codebase. No behavioral change intended.","locations":[{"ref":"src/core/dbus-execute.c:1854-4330","code":" 1854 | int bus_exec_context_set_transient_property(\n 1855 |                 Unit *u,\n 1856 |                 ExecContext *c,\n 1857 |                 const char *name,\n 1858 |                 sd_bus_message *message,\n 1859 |                 UnitWriteFlags flags,\n 1860 |                 sd_bus_error *reterr_error) {\n 1861 | \n 1862 |         const char *suffix;\n 1863 |         int r;\n 1864 | \n 1865 |         assert(u);\n 1866 |         assert(c);\n 1867 |         assert(name);\n 1868 |         assert(message);\n 1869 | \n 1870 |         flags |= UNIT_PRIVATE;\n 1871 | \n 1872 |         if (streq(name, \"User\"))\n 1873 |                 return bus_set_transient_user_relaxed(u, name, &c->user, message, flags, reterr_error);\n 1874 | \n 1875 |         if (streq(name, \"Group\"))\n 1876 |                 return bus_set_transient_user_relaxed(u, name, &c->group, message, flags, reterr_error);\n 1877 | \n 1878 |         if (streq(name, \"SetLoginEnvironment\"))\n 1879 |                 return bus_set_transient_tristate(u, name, &c->set_login_environment, message, flags, reterr_e {"id":"OTHER_1","type":"other","type_label":"Other","severity":"medium","difficulty":"hard","description":"In `chaseat()`'s symlink-handling branch, the code first pins the current path component by file descriptor — `child = xopenat_full(fd, first, O_PATH|O_NOFOLLOW|O_CLOEXEC, ...)` — and verifies via `chase_statx(child, &stx_child)` that it is a symlink (`S_ISLNK(stx_child.stx_mode)`), running the `CHASE_SAFE` unsafe-transition check and the `CHASE_NO_AUTOFS` check against that specific, already-opened inode (`child`). But when it then needs to read the symlink's target, it calls `readlinkat_malloc(fd, first, &destination)` — i.e. it re-resolves the name `first` in the parent directory `fd` rather than reading the target of the pinned `child` fd. Between the `xopenat_full()`/`chase_statx()` calls and the `readlinkat_malloc()` call, an attacker with write access to the directory referenced by `fd` can replace the `first` entry (e.g. swap the symlink for a different one), so the string returned by `readlinkat_malloc()` may belong to a different inode than the one that was actually validated as `stx_child`. This contradicts the function's own documented invariant (\"we always keep an O_PATH fd to the component we are currently processing, thus keeping lookup races to a minimum\").","fix":"Read the symlink target from the already-pinned `child` descriptor instead of re-resolving `first` by name in `fd` — e.g. via `readlink(\"/proc/self/fd/<child>\", ...)` (or an equivalent fd-based helper), so the bytes returned are guaranteed to come from the exact inode that was `fstat`'d and checked with `CHASE_SAFE`/`CHASE_NO_AUTOFS`, closing the race window between validation and use.","locations":[{"ref":"src/basic/chase.c:613-635","code":"  613 |                 r = chase_statx(child, &stx_child);\n  614 |                 if (r < 0)\n  615 |                         return r;\n  616 | \n  617 |                 if (FLAGS_SET(flags, CHASE_SAFE)) {\n  618 |                         r = statx_unsafe_transition(&stx, &stx_child);\n  619 |                         if (r < 0)\n  620 |                                 return r;\n  621 |                         if (r > 0)\n  622 |                                 return log_unsafe_transition(fd, child, path, flags);\n  623 |                 }\n  624 | \n  625 |                 if (FLAGS_SET(flags, CHASE_NO_AUTOFS) &&\n  626 |                     fd_is_fs_type(child, AUTOFS_SUPER_MAGIC) > 0)\n  627 |                         return log_autofs_mount_point(child, path, flags);\n  628 | \n  629 |                 if (S_ISLNK(stx_child.stx_mode) && !(FLAGS_SET(flags, CHASE_NOFOLLOW) && isempty(todo))) {\n  630 |                         _cleanup_free_ char *destination = NULL;\n  631 | \n  632 |                         if (FLAGS_SET(flags, CHASE_PROHIBIT_SYMLINKS))\n  633 |                                 return log_prohibited_symlink(child, flags);\n  634 | \n  635 |                         r = readlinkat_malloc(fd, first, &destination);","lines":23,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/chase.c#L613-L635"}]},
{"id":"OTHER_2","type":"other","type_label":"Other","severity":"medium","difficulty":"hard","description":"`decompress_startswith_xz()`, `decompress_startswith_gzip()` and `decompress_startswith_bzip2()` in `compress.c` grow their output buffer in an unbounded loop (`greedy_realloc(buffer, allocated * 2, 1)`) with no caller-supplied size ceiling, unlike their sibling blob-decompression functions (`decompress_blob_xz()`, `decompress_blob_gzip()`, `decompress_blob_bzip2()`), which all accept a `dst_max` parameter and bail out with `-ENOBUFS` once the cap is reached. None of the `decompress_startswith_*()` helpers, nor the public `decompress_startswith()` / `decompress_startswith_journal()` wrappers declared in `compress.h`, take a `dst_max` argument at all.\n\nThis matters because `decompress_startswith_journal()` is called from `maybe_decompress_payload()` in `src/libsystemd/sd-journal/journal-file.c:1986` directly on attacker-influenced/corrupted compressed journal object payloads (the very next call at `journal-file.c:2006`, `decompress_blob_journal(..., DATA_SIZE_MAX)`, *does* pass a cap for the same class of data). A journal object whose compressed payload decompresses at a very high ratio (a classic \"compression bomb\") can therefore make the loop keep doubling the allocation far beyond any reasonable field-prefix check, exhausting memory before the decoder either finishes the stream or the requested `prefix_len + 1` bytes are produced.","fix":"Add a `size_t dst_max` parameter to `decompress_startswith_xz()`, `decompress_startswith_gzip()`, `decompress_startswith_bzip2()`, `decompress_startswith_journal()` and `decompress_startswith()` (mirroring `decompress_blob_journal()`/`decompress_blob()`), and enforce it in each growth loop the same way `decompress_blob_gzip()` already does:\n\n```c\nif (dst_max > 0 && (space - s.avail_out) >= dst_max)\n        break;\nif (dst_max > 0 && space == dst_max)\n        return -ENOBUFS;\n```\n\nThen thread a sane cap (e.g. `DATA_SIZE_MAX`, matching the neighboring `decompress_blob_journal()` call) through from `maybe_decompress_payload()`.","locations":[{"ref":"src/basic/compress.c:1181-1245","code":" 1181 | static int decompress_startswith_xz(\n 1182 |                 const void *src,\n 1183 |                 uint64_t src_size,\n 1184 |                 void **buffer,\n 1185 |                 const void *prefix,\n 1186 |                 size_t prefix_len,\n 1187 |                 uint8_t extra) {\n 1188 | \n 1189 |         /* Checks whether the decompressed blob starts with the mentioned prefix. The byte extra needs to\n 1190 |          * follow the prefix */\n 1191 | \n 1192 |         assert(src);\n 1193 |         assert(src_size > 0);\n 1194 |         assert(buffer);\n 1195 |         assert(prefix);\n 1196 | \n 1197 | #if HAVE_XZ\n 1198 |         int r;\n 1199 | \n 1200 |         r = dlopen_xz(LOG_DEBUG);\n 1201 |         if (r < 0)\n 1202 |                 return r;\n 1203 | \n 1204 |         _cleanup_(lzma_end_wrapper) lzma_stream s = LZMA_STREAM_INIT;\n 1205 |         lzma_ret ret = sym_lzma_stream_decoder(&s, UINT64_MAX, /* flags= */ 0);\n 1206 |         if (ret != LZMA_OK)\n 1207 |                 return -EBADMSG;\n 1208 | \n 1209 |         if (!(greedy_realloc(buffer, ALIGN_8(prefix_len + 1), 1)))\n 1210 |                 return -ENOMEM;\n 1211 | \n 1212 |         size_t allocated = MALLOC_SIZEOF_SAFE(*buffer);\n 1213 | \n 1214 |         s.next_in = src;\n 1215 |         s.avail_in = src_size;\n 1216 | \n 1217 |         s.next_out = *buffer;\n 1218 |         s.avail_out = allocated;\n 1219 | \n 1220 |         for (;;) {\n 1221 |                 ret = sym_lzma_code(&s, LZMA_FINISH);\n 1222 | \n 1223 |                 if (!IN_SET(ret, LZMA_OK, LZMA_STREAM_END))\n 1224 |                         return -EBADMSG;\n 1225 | \n 1226 |                 if (allocated - s.avail_out >= prefix_len + 1)\n 1227 |                         return memcmp(*buffer, prefix, prefix_len) == 0 &&\n 1228 |                                 ((const uint8_t*) *buffer)[prefix_len] == extra;\n 1229 | \n 1230 |                 if (ret == LZMA_STREAM_END)\n 1231 |                         return 0;\n 1232 | \n 1233 |                 s.avail_out += allocated;\n 1234 | \n 1235 |                 if (!(greedy_realloc(buffer, allocated * 2, 1)))\n 1236 |                         return -ENOMEM;\n 1237 | \n 1238 |                 allocated = MALLOC_SIZEOF_SAFE(*buffer);\n 1239 |                 s.next_out = *(uint8_t**)buffer + allocated - s.avail_out;\n 1240 |         }\n 1241 | \n 1242 | #else\n 1243 |         return -EPROTONOSUPPORT;\n 1244 | #endif\n 1245 | }","lines":65,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/compress.c#L1181-L1245"},{"ref":"src/basic/compress.h:81-91","code":"   81 | int decompress_startswith_journal(\n   82 |                 Compression compression,\n   83 |                 const void *src, uint64_t src_size,\n   84 |                 void **buffer,\n   85 |                 const void *prefix, size_t prefix_len,\n   86 |                 uint8_t extra);\n   87 | int decompress_startswith(Compression compression,\n   88 |                           const void *src, uint64_t src_size,\n   89 |                           void **buffer,\n   90 |                           const void *prefix, size_t prefix_len,\n   91 |                           uint8_t extra);","lines":11,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/compress.h#L81-L91"}]},
{"id":"OTHER_3","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"In `src/basic/architecture.h`, the `LIB_ARCH_TUPLE` definition for the `__hppa__` architecture uses the Unicode non-breaking hyphen character `U+2011` (`‑`) instead of a plain ASCII hyphen-minus (`-`) between the tuple components. The literal bytes are `hppa` + `0xE2 0x80 0x91` + `linux` + `0xE2 0x80 0x91` + `gnu`, i.e. `\"hppa\\u2011linux\\u2011gnu\"`, not the intended Debian multiarch tuple `\"hppa-linux-gnu\"`. `LIB_ARCH_TUPLE` is used in real production code paths, e.g. `src/libsystemd/sd-path/sd-path.c`, to build library search paths such as `/usr/lib/<LIB_ARCH_TUPLE>`. On an hppa build this constant would never match any real directory name (`/usr/lib/hppa-linux-gnu`), silently breaking multiarch library-path lookups for that architecture. The bug has existed unnoticed since the line was introduced in 2014 (commit `613e3a26c12`).","fix":"Replace the non-breaking hyphen characters with plain ASCII hyphens:\n\n```\n// before\n#  define LIB_ARCH_TUPLE \"hppa‑linux‑gnu\"\n\n// after\n#  define LIB_ARCH_TUPLE \"hppa-linux-gnu\"\n```","locations":[{"ref":"src/basic/architecture.h:104","code":"  104 | #  define LIB_ARCH_TUPLE \"hppa‑linux‑gnu\"","lines":1,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/architecture.h#L104"}]},
{"id":"OTHER_4","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"`chase_openat2()` caches whether `openat2()` is usable in `static bool can_openat2 = true;`, read via `if (!can_openat2) return -EOPNOTSUPP;` and written via `can_openat2 = false;` when `errno == ENOSYS`. Since `chaseat()`/`chase()` are called from multithreaded processes, several threads can race on this plain, non-atomic `bool`, which is a data race under the C11 memory model. Elsewhere in this same file's sibling module (`cap_last_cap()` in `capability-util.c`) the analogous one-shot cache is correctly declared `static atomic_int saved`, showing the codebase's own convention for this pattern is to use an atomic type.","fix":"Make the cache atomic, matching the pattern already used for `cap_last_cap()`'s cache.\n\nBefore:\n```c\nstatic bool can_openat2 = true;\n```\n\nAfter:\n```c\nstatic _Atomic bool can_openat2 = true;\n```","locations":[{"ref":"src/basic/chase.c:61-138","code":"   61 |         static bool can_openat2 = true;\n   62 |         int r;\n   63 | \n   64 |         assert(path);\n   65 |         assert(wildcard_fd_is_valid(dir_fd));\n   66 | \n   67 |         if (!can_openat2)\n   68 |                 return -EOPNOTSUPP;\n   69 | \n   70 |         /* openat2() can handle everything the regular shortcut handles, plus a real root boundary (via\n   71 |          * RESOLVE_IN_ROOT) and CHASE_PROHIBIT_SYMLINKS (via RESOLVE_NO_SYMLINKS). It cannot model the other\n   72 |          * CHASE_NO_SHORTCUT flags, cannot trigger automounts on O_PATH fds, and RESOLVE_IN_ROOT requires\n   73 |          * the dirfd to be the root. Bail out so the caller falls back to the regular chase loop. */\n   74 |         if ((chase_flags & (CHASE_NO_SHORTCUT_MASK & ~CHASE_PROHIBIT_SYMLINKS)) != 0)\n   75 |                 return -EOPNOTSUPP;\n   76 |         if (FLAGS_SET(chase_flags, CHASE_TRIGGER_AUTOFS))\n   77 |                 return -EOPNOTSUPP;\n   78 |         if (root_fd != XAT_FDROOT && root_fd != dir_fd)\n   79 |                 return -EOPNOTSUPP;\n   80 | \n   81 |         _cleanup_close_ int dir_fd_local = -EBADF;\n   82 |         if (dir_fd == XAT_FDROOT) {\n   83 |                 if (path_is_absolute(path))\n   84 |                         dir_fd = AT_FDCWD;\n   85 |                 else {\n   86 |                         dir_fd_local = open(\"/\", O_CLOEXEC|O_DIRECTORY|O_PATH);\n   87 |                         if (dir_fd_local < 0)\n   88 |                                 return -errno;\n   89 |                         dir_fd = dir_fd_local;\n   90 |                 }\n   91 |         }\n   92 | \n   93 |         struct open_how how = {\n   94 |                 .flags = O_PATH|O_CLOEXEC,\n   95 |         };\n   96 |         if (FLAGS_SET(chase_flags, CHASE_NOFOLLOW))\n   97 |                 how.flags |= O_NOFOLLOW;\n   98 |         if (FLAGS_SET(chase_flags, CHASE_MUST_BE_DIRECTORY))\n   99 |                 how.flags |= O_DIRECTORY;\n  100 |         if (root_fd != XAT_FDROOT)\n  101 |                 how.resolve |= RESOLVE_IN_ROOT;\n  102 |         if (FLAGS_SET(chase_flags, CHASE_PROHIBIT_SYMLINKS))\n  103 |                 how.resolve |= RESOLVE_NO_SYMLINKS;\n  104 | \n  105 |         _cleanup_close_ int fd = openat2(dir_fd, path, &how, sizeof(how));\n  106 |         if (fd < 0) {\n  107 |                 /* ENOSYS: kernel too old or seccomp filter (systemd's filter returns ENOSYS).\n  108 |                  * EPERM: Some seccomp profiles of container runtimes use EPERM rather than ENOSYS.\n  109 |                  * But EPERM might also be returned because we can't access some component of the path. So\n  110 |                  * we can't cache the result and skip using openat2() if it is blocked with EPERM. Instead\n  111 |                  * we fall back to userspace chase() if we get EPERM.\n  112 |                  * EAGAIN: with RESOLVE_IN_ROOT the kernel returns this when a \"..\" component\n  113 |                  * (typically from following a symlink like /etc/os-release → ../usr/lib/os-release)\n  114 |                  * is processed and the global mount_lock or rename_lock seqcount changed during\n  115 |                  * the walk. Any mount activity anywhere in the system bumps mount_lock, so this\n  116 |                  * fires reliably while we're still setting up a mount tree. Fall back to the\n  117 |                  * regular chase loop, which handles root boundaries without openat2(). Don't\n  118 |                  * cache this — the condition is per-call, not a kernel/sandbox capability. */\n  119 |                 if (errno == ENOSYS)\n  120 |                         can_openat2 = false;\n  121 |                 if (IN_SET(errno, ENOSYS, EPERM, EAGAIN))\n  122 |                         return -EOPNOTSUPP;\n  123 |                 return -errno;\n  124 |         }\n  125 | \n  126 |         if (FLAGS_SET(chase_flags, CHASE_MUST_BE_REGULAR)) {\n  127 |                 r = fd_verify_regular(fd);\n  128 |                 if (r < 0)\n  129 |                         return r;\n  130 |         }\n  131 |         if (FLAGS_SET(chase_flags, CHASE_MUST_BE_SOCKET)) {\n  132 |                 r = fd_verify_socket(fd);\n  133 |                 if (r < 0)\n  134 |                         return r;\n  135 |         }\n  136 | \n  137 |         return TAKE_FD(fd);\n  138 | }","lines":78,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/chase.c#L61-L138"}]},
{"id":"OTHER_5","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`pidfd_get_namespace()` and `pidfd_get_info()` each cache kernel ioctl-support with a function-local `static bool cached_supported = true;` that is read and written without any synchronization. This is inconsistent with the sibling cache `static thread_local int have_pidfs = -1;` declared at file scope a few lines above (used by `pidfd_check_pidfs()`), which deliberately avoids cross-thread sharing via `thread_local`. If `pidfd_get_namespace()`/`pidfd_get_info()` are called concurrently from multiple threads (both are ordinary, non-static-only helpers reachable from multi-threaded consumers such as `sd-bus`/`sd-event` worker threads), the two non-atomic writes to `cached_supported` constitute a data race under the C11 memory model, flagged by tools such as TSan. In practice both racing writes store the same freshly-observed boolean value so no memory corruption results, but it is undefined behavior and a real inconsistency versus the `thread_local` pattern used one function away in the same file.","fix":"Make both caches `static thread_local bool cached_supported = true;` (matching `have_pidfs`'s pattern), or promote them to a single `_Atomic bool` / `stdatomic.h` relaxed load/store if the cache is meant to be shared process-wide.","locations":[{"ref":"src/basic/pidfd-util.c:19","code":"   19 | static thread_local int have_pidfs = -1;","lines":1,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/pidfd-util.c#L19"},{"ref":"src/basic/pidfd-util.c:41","code":"   41 |         static bool cached_supported = true;","lines":1,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/pidfd-util.c#L41"},{"ref":"src/basic/pidfd-util.c:75","code":"   75 |         static bool cached_supported = true;","lines":1,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745 {"id":"OTHER_6","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"The validation error for the `--install-source=` option references a nonexistent option name `--install-from-host`. There is no `--install-from-host` option anywhere in `bootctl` (only `--install-source=`), so a user who sets e.g. `--install-source=host` without `--root=`/`--image=` gets a misleading diagnostic that points at a flag they never used and cannot find in `--help` or the man page.","fix":"Reference the actual option name. Before:\n```c\nif (arg_install_source != INSTALL_SOURCE_AUTO && !arg_root && !arg_image)\n        return log_error_errno(SYNTHETIC_ERRNO(EINVAL), \"--install-from-host is only supported with --root= or --image=.\");\n```\nAfter:\n```c\nif (arg_install_source != INSTALL_SOURCE_AUTO && !arg_root && !arg_image)\n        return log_error_errno(SYNTHETIC_ERRNO(EINVAL), \"--install-source= is only supported with --root= or --image=.\");\n```","locations":[{"ref":"src/bootctl/bootctl.c:723-724","code":"  723 |         if (arg_install_source != INSTALL_SOURCE_AUTO && !arg_root && !arg_image)\n  724 |                 return log_error_errno(SYNTHETIC_ERRNO(EINVAL), \"--install-from-host is only supported with --root= or --image=.\");","lines":2,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/bootctl/bootctl.c#L723-L724"}]},

(function(){
'use strict';

// Data
const FINDINGS     = JSON.parse(document.getElementById('D').textContent);
const PROJECT_INFO = JSON.parse(document.getElementById('PI').textContent);
const SEVS     = ['critical','high','medium','low','negligible'];
const STATUSES = ['open','fixed','wont-fix','false-positive'];
const ALL_TYPES = [...new Set(FINDINGS.map(f => f.type))].sort(cmpTypes);
// Build lookup map for O(1) access
const FINDING_BY_ID = new Map(FINDINGS.map(f => [f.id, f]));
// Only severities actually present in the report — the filter bar hides the rest.
const PRESENT_SEVS = SEVS.filter(s => FINDINGS.some(f => (f.severity || 'medium') === s));
// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};
const PRESENT_DIFFS = DIFFICULTY_ORDER.filter(d => FINDINGS.some(f => f.difficulty === d));
const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', searchScope: 'all', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),
};
const statuses = {};

// Persistence
function loadStatuses() {
  try { Object.assign(statuses, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}
}
function saveStatuses() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;

  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    if (S.searchScope !== 'all') p.set('qs', S.searchScope);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('qs'))  { S.searchScope = p.get('qs'); }
  document.getElementById('search-scope').classList.toggle('active', S.searchScope === 'locations');
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }
function isCustom(t)  { return String(t).toLowerCase() === 'custom'; }
function typeCls(t)   { return 'type-badge' + (isCustom(t) ? ' custom-type' : ''); }
// 'custom' findings are the user's own externally-sourced ones; pin them first
// everywhere types are listed so they never blend into the audit's own categories.
function cmpTypes(a, b) {
  if (isCustom(a) !== isCustom(b)) return isCustom(a) ? -1 : 1;
  return String(a).localeCompare(String(b));
}

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort(cmpTypes);

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build a [project] header block from embedded PROJECT_INFO, so the exported
// findings.toml is self-contained (doesn't depend on a sibling project-info.toml
// that a second, separately-triggered download could silently fail to save).
// '' when there is no project info at all.
function buildProjectToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = PROJECT_INFO || {};
  if (!Object.keys(pi).length) return '';
  const lines = ['[project]'];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n\n';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    // Pin the id so re-rendering this export - or filtering it down later - can't
    // renumber findings that were already referenced by id elsewhere.
    if (f.id && f.id !== '?') lns.push(pad('id') + '= ' + tomlStr(f.id));
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return buildProjectToml() + chunks.join('\n\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'folder') {
    if (!f.locations.length) return '(no location)';
    const path = f.locations[0].ref.replace(/:.*/,'');
    const idx = path.lastIndexOf('/');
    return idx === -1 ? '(root)' : path.slice(0, idx);
  }
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystacks per finding (cleared on full re-render).
// Two variants: everything (default), and file/folder paths only - for when a
// search term (e.g. a directory name like 'dlls/abc') also happens to appear
// inside description/fix prose and you only want path matches.
const _hay = new Map();
const _hayLoc = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}
function hayLocOf(f) {
  if (!_hayLoc.has(f.id)) {
    _hayLoc.set(f.id, f.locations.map(l => l.ref).join(' ').toLowerCase());
  }
  return _hayLoc.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (S.searchScope === 'locations') {
      if (!hayLocOf(f).includes(q)) return false;
    } else if (!hayOf(f).includes(q) && !st.includes(q)) {
      return false;
    }
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  if (S.groupBy === 'type') return [...keys].sort(cmpTypes);
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge ' + typeCls(f.type) + '" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge ' + typeCls(t) + '" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  _hayLoc.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    // Single download (was two) - a second auto-triggered download is commonly
    // blocked by the browser unless the user explicitly allows it, which silently
    // drops project-info.toml. Embedding [project] in findings.toml itself avoids
    // that failure mode entirely.
    downloadText(buildFindingsToml(), 'findings.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});
document.getElementById('search-scope').addEventListener('click', e => {
  S.searchScope = S.searchScope === 'locations' ? 'all' : 'locations';
  e.currentTarget.classList.toggle('active', S.searchScope === 'locations');
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
