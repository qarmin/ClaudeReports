<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`home_activate()` returns `0` for the `HOME_LINGERING` case (`src/home/homed-home.c:1571-1575`) without starting any worker. `0` is the \"async operation started\" signal, so `bus_home_method_activate()` (`src/home/homed-home-bus.c:211-223`) passes the `assert(r == 0)` check and then calls `home_set_current_message()`, installing an `OPERATION_IMMEDIATE` `current_operation` whose `result` stays `-1`. Because no worker was forked, no `home_*_finish()` handler ever runs to consume it, so `h->current_operation` remains set while the home sits in the synthesized `HOME_ACTIVE` state (`home_is_busy()` now permanently true). The next operation started on that home trips one of the many `assert(!h->current_operation)` checks: e.g. a subsequent `DeactivateHome` call runs `home_deactivate()` -> `home_deactivate_internal()` (returns `0` after starting work, does not clear `current_operation`), then hits `assert(!h->current_operation)` at `src/home/homed-home-bus.c:241`, aborting `systemd-homed`. `HOME_LINGERING` is a normal, owner-reachable state (refs dropped while deactivation retries), so the home owner can crash the daemon with an `Activate` followed by `Deactivate`.","fix":"Treat lingering activation as an immediately-completed operation instead of an async one. In `home_activate()` return a positive value for `HOME_LINGERING`:\n```c\ncase HOME_LINGERING:\n        h->retry_deactivate_event_source = sd_event_source_disable_unref(h->retry_deactivate_event_source);\n        return 1; /* done, nothing async started */\n```\nand make `bus_home_method_activate()` reply right away for the done case (mirroring `bus_home_method_lock()`):\n```c\nr = home_activate(h, if_referenced, secret, error);\nif (r < 0)\n        return r;\nif (r > 0) /* Already active, nothing to wait for */\n        return sd_bus_reply_method_return(message, NULL);\nassert(r == 0);\nassert(!h->current_operation);\n```\nThis avoids installing a `current_operation` that is never completed.","locations":[{"ref":"src/home/homed-home.c:1573-1577","code":" 1573 |         case HOME_LINGERING:\n 1574 |                 /* If we are lingering, i.e. active but are supposed to be deactivated, then cancel this\n 1575 |                  * timer if the user explicitly asks us to be active */\n 1576 |                 h->retry_deactivate_event_source = sd_event_source_disable_unref(h->retry_deactivate_event_source);\n 1577 |                 return 0;","lines":5,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/home/homed-home.c#L1573-L1577"},{"ref":"src/home/homed-home-bus.c:211-223","code":"  211 |         r = home_activate(h, if_referenced, secret, error);\n  212 |         if (r < 0)\n  213 |                 return r;\n  214 | \n  215 |         assert(r == 0);\n  216 |         assert(!h->current_operation);\n  217 | \n  218 |         /* The operation is now in process, keep track of this message so that we can later reply to it. */\n  219 |         r = home_set_current_message(h, message);\n  220 |         if (r < 0)\n  221 |                 return r;\n  222 | \n  223 |         return 1;","lines":13,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/home/homed-home-bus.c#L211-L223"},{"ref":"src/home/homed-home-bus.c:241","code":"  241 |         assert(!h->current_operation);","lines":1,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/home/homed-home-bus.c#L241"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`assess()` computes `uint64_t range = access_range(a, policy);` for every security assessor, where `access_range()` (`src/analyze/analyze-security.c:1685-1698`) returns whatever unsigned integer value is present under the assessor's `range` key in a user-supplied JSON security policy (loaded via `--security-policy=` or the auto-discovered `systemd-analyze-security.policy` file), with no validation. Immediately afterwards `assess()` does `assert(range > 0);` and, when `badness != UINT64_MAX`, `assert(badness <= range);` before dividing by `range` in `DIV_ROUND_UP(badness * weight, range)`. A policy file that sets `\"range\": 0` for any assessor (or sets `range` lower than the maximum badness the corresponding `assess_*` callback can actually produce, e.g. `UMask=` which can return badness up to 10) makes `systemd-analyze security` abort via a failed `assert()` (or, if asserts were ever compiled out, divide by zero) instead of reporting a graceful parse/validation error.","fix":"Validate `range` right after reading it from the policy in `access_range()` (or in `assess()` before using it): reject or clamp values that are `0`, and reject values smaller than the assessor's own static `a->range` (the maximum badness its `assess` callback can emit), returning a proper error from `verb_security`/`assess()` instead of relying on `assert()` to catch bad policy input.","locations":[{"ref":"src/analyze/analyze-security.c:1685-1698","code":" 1685 | static uint64_t access_range(const struct security_assessor *a, sd_json_variant *policy) {\n 1686 |         sd_json_variant *val;\n 1687 | \n 1688 |         assert(a);\n 1689 | \n 1690 |         val = security_assessor_find_in_policy(a, policy, \"range\");\n 1691 |         if (val) {\n 1692 |                 if (sd_json_variant_is_unsigned(val))\n 1693 |                         return sd_json_variant_unsigned(val);\n 1694 |                 log_debug(\"JSON field 'range' of policy for %s is not an unsigned integer, ignoring.\", a->id);\n 1695 |         }\n 1696 | \n 1697 |         return a->range;\n 1698 | }","lines":14,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/analyze/analyze-security.c#L1685-L1698"},{"ref":"src/analyze/analyze-security.c:1793-1821","code":" 1793 |                 uint64_t weight = access_weight(a, policy);\n 1794 |                 uint64_t range = access_range(a, policy);\n 1795 | \n 1796 |                 data = (uint8_t*) info + a->offset;\n 1797 | \n 1798 |                 if (a->default_dependencies_only && !info->default_dependencies) {\n 1799 |                         badness = UINT64_MAX;\n 1800 |                         d = strdup(\"Service runs in special boot phase, option is not appropriate\");\n 1801 |                         if (!d)\n 1802 |                                 return log_oom();\n 1803 |                 } else if (weight == 0) {\n 1804 |                         badness = UINT64_MAX;\n 1805 |                         d = strdup(\"Option excluded by policy, skipping\");\n 1806 |                         if (!d)\n 1807 |                                 return log_oom();\n 1808 |                 } else {\n 1809 |                         r = a->assess(a, info, data, &badness, &d);\n 1810 |                         if (r < 0)\n 1811 |                                 return r;\n 1812 |                 }\n 1813 | \n 1814 |                 assert(range > 0);\n 1815 | \n 1816 |                 if (badness != UINT64_MAX) {\n 1817 |                         assert(badness <= range);\n 1818 | \n 1819 |                         badness_sum += DIV_ROUND_UP(badness * weight, range);\n 1820 |                         weight_sum += weight;\n 1821 |                 }","lines":29,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/analyze/analyze-security.c#L1793-L1821"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"In `exec_invoke()`, the unprivileged user-namespace setup branch dereferences `runtime->shared->userns_storage_socket[0]` without first checking that `runtime->shared` is non-NULL. Every other access to `userns_storage_socket` guards on `runtime->shared` first (e.g. `context->user_namespace_path && runtime->shared && runtime->shared->userns_storage_socket[0] >= 0` at line 5513, and again at line 6112), which proves `runtime->shared` can legitimately be `NULL`. This branch is only reached for `RUNTIME_SCOPE_USER` units (via `exec_needs_cap_sys_admin()`, which returns true when `context->user_namespace_path` is set) that are unprivileged; if such a unit has `UserNamespacePath=` configured but no shared runtime, the condition itself crashes the pre-exec child with a `NULL` dereference instead of returning the intended `EXIT_USER`/`EPERM` error.","fix":"Add the missing `runtime->shared` guard so the access is consistent with the other call sites:\n```c\nif (context->user_namespace_path && runtime->shared && runtime->shared->userns_storage_socket[0] >= 0) {\n        *exit_status = EXIT_USER;\n        return log_error_errno(SYNTHETIC_ERRNO(EPERM), \"UserNamespacePath= is configured, but user namespace setup not permitted\");\n}\n```","locations":[{"ref":"src/core/exec-invoke.c:6056","code":" 6056 |                 if (context->user_namespace_path && runtime->shared->userns_storage_socket[0] >= 0) {","lines":1,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/core/exec-invoke.c#L6056"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In `action_detach()`, `loop` is only assigned when the target is a block device (`S_ISBLK`) or a regular file (`S_ISREG`) that has a matching backing loop device. If the user passes a path that stats as any other type (char device, FIFO, or socket, e.g. `systemd-dissect --detach /dev/null`), neither branch runs, `loop` stays `NULL`, and control falls through to `loop_device_set_autoclear(loop, true)` at line 1931, whose first statement is `assert(d)`. This aborts the process with a failed assertion. `parse_image_path_argument()` for `ACTION_DETACH` passes `ret_root=NULL`, so directories are rejected, but char/FIFO/socket paths are accepted as `arg_image` and reach here.","fix":"After the `S_ISBLK`/`S_ISREG` branches, reject other file types before using `loop`, e.g. add an `else return log_error_errno(SYNTHETIC_ERRNO(ENOTBLK), \"'%s' is neither a block device nor a regular file, cannot detach.\", path);` (or guard `if (!loop) return ...;` before the `loop_device_set_autoclear(loop, true)` call).","locations":[{"ref":"src/dissect/dissect.c:1847-1910","code":" 1847 |         if (S_ISBLK(st.st_mode)) {\n 1848 |                 r = loop_device_open_from_fd(fd, O_RDONLY, LOCK_EX, &loop);\n 1849 |                 if (r < 0)\n 1850 |                         return log_error_errno(r, \"Failed to open '%s' as loopback block device: %m\", path);\n 1851 | \n 1852 |         } else if (S_ISREG(st.st_mode)) {\n 1853 |                 _cleanup_(sd_device_enumerator_unrefp) sd_device_enumerator *e = NULL;\n 1854 | \n 1855 |                 /* If a regular file is specified, search for a loopback block device that is backed by it */\n 1856 | \n 1857 |                 r = sd_device_enumerator_new(&e);\n 1858 |                 if (r < 0)\n 1859 |                         return log_error_errno(r, \"Failed to allocate enumerator: %m\");\n 1860 | \n 1861 |                 r = sd_device_enumerator_add_match_subsystem(e, \"block\", true);\n 1862 |                 if (r < 0)\n 1863 |                         return log_error_errno(r, \"Failed to match block devices: %m\");\n 1864 | \n 1865 |                 r = sd_device_enumerator_add_match_sysname(e, \"loop*\");\n 1866 |                 if (r < 0)\n 1867 |                         return log_error_errno(r, \"Failed to match loopback block devices: %m\");\n 1868 | \n 1869 |                 (void) sd_device_enumerator_allow_uninitialized(e);\n 1870 | \n 1871 |                 FOREACH_DEVICE(e, d) {\n 1872 |                         _cleanup_(loop_device_unrefp) LoopDevice *entry_loop = NULL;\n 1873 | \n 1874 |                         r = device_is_devtype(d, \"disk\");\n 1875 |                         if (r < 0) {\n 1876 |                                 log_device_warning_errno(d, r, \"Failed to check if device is a whole disk, skipping: %m\");\n 1877 |                                 continue;\n 1878 |                         }\n 1879 |                         if (r == 0)\n 1880 |                                 continue; /* Filter out partition block devices */\n 1881 | \n 1882 |                         r = loop_device_open(d, O_RDONLY, LOCK_SH, &entry_loop);\n 1883 |                         if (r < 0) {\n 1884 |                                 log_device_warning_errno(d, r, \"Failed to open loopback block device, skipping: %m\");\n 1885 |                                 continue;\n 1886 |                         }\n 1887 | \n 1888 |                         if (entry_loop->backing_devno == st.st_dev && entry_loop->backing_inode == st.st_ino) {\n 1889 |                                 /* Found it! The kernel allows attaching a single file to multiple loopback\n 1890 |                                  * devices. Let's destruct them in reverse order, i.e. find the last matching\n 1891 |                                  * loopback device here, rather than the first. */\n 1892 | \n 1893 |                                 loop_device_unref(loop);\n 1894 |                                 loop = TAKE_PTR(entry_loop);\n 1895 |                         }\n 1896 |                 }\n 1897 | \n 1898 |                 if (!loop)\n 1899 |                         return log_error_errno(SYNTHETIC_ERRNO(ENXIO), \"No loopback block device backed by '%s' found.\", path);\n 1900 | \n 1901 |                 r = loop_device_flock(loop, LOCK_EX);\n 1902 |                 if (r < 0)\n 1903 |                         return log_error_errno(r, \"Failed to upgrade device lock: %m\");\n 1904 |         }\n 1905 | \n 1906 |         r = loop_device_set_autoclear(loop, true);\n 1907 |         if (r < 0)\n 1908 |                 log_warning_errno(r, \"Failed to enable autoclear logic on '%s', ignoring: %m\", loop->node);\n 1909 | \n 1910 |         loop_device_unrelinquish(loop);","lines":64,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/dissect/dissect.c#L1847-L1910"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"negligible","difficulty":"very_easy","description":"`status_entries()` prints `esp_path` directly with `%s` even though its own contract (`assert(esp_path || xbootldr_path)`) allows `esp_path` to be `NULL` (reachable when only an XBOOTLDR partition is present and no ESP). `printf(\"%s\", NULL)` is technically undefined behaviour; glibc happens to print `(null)`, but the rest of systemd consistently uses `strna()` for exactly this reason. The nearby `assert(esp_path)` at line 63 is only guarded by `config->loader_conf_status != 0`, which in practice requires an ESP, so it does not abort, but the raw `%s` is still a latent robustness gap.","fix":"Use `strna()` for the possibly-NULL pointer. Before:\n```c\nprintf(\"          ESP: %s\", esp_path);\n```\nAfter:\n```c\nprintf(\"          ESP: %s\", strna(esp_path));\n```","locations":[{"ref":"src/bootctl/bootctl-status.c:42","code":"   42 |         printf(\"          ESP: %s\", esp_path);","lines":1,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/bootctl/bootctl-status.c#L42"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"negligible","difficulty":"easy","description":"In `context_read_os_release()`, when `c->data[PROP_OS_PRETTY_NAME]` ends up `NULL` (only possible if the earlier `free_and_strdup(&c->data[PROP_OS_PRETTY_NAME], ...)` failed with `-ENOMEM`, which leaves the target pointer at its reset `NULL` value), the fallback branch `os_fancy_name = strdup(c->data[PROP_OS_PRETTY_NAME]);` calls `strdup(NULL)`, which is undefined behavior (glibc dereferences the argument and segfaults). The sibling branch `strjoin(\"\\x1B[\", os_ansi_color, \"m\", c->data[PROP_OS_PRETTY_NAME])` merely truncates at the NULL arg, so only the `strdup` path is a crash. Reachable only under memory pressure since `os_release_pretty_name()` never itself returns NULL (it falls back to \"Linux\").","fix":"Guard the fallback against a NULL pretty name, e.g. use `strdup(strempty(c->data[PROP_OS_PRETTY_NAME]))` (or bail on the earlier `free_and_strdup` OOM instead of only calling `log_oom()` and continuing). Before:\n```c\nif (isempty(os_ansi_color))\n        os_fancy_name = strdup(c->data[PROP_OS_PRETTY_NAME]);\nelse\n        os_fancy_name = strjoin(\"\\x1B[\", os_ansi_color, \"m\", c->data[PROP_OS_PRETTY_NAME]);\n```\nAfter:\n```c\nif (isempty(os_ansi_color))\n        os_fancy_name = strdup(strempty(c->data[PROP_OS_PRETTY_NAME]));\nelse\n        os_fancy_name = strjoin(\"\\x1B[\", os_ansi_color, \"m\", strempty(c->data[PROP_OS_PRETTY_NAME]));\n```","locations":[{"ref":"src/hostname/hostnamed.c:237-250","code":"  237 |         if (free_and_strdup(&c->data[PROP_OS_PRETTY_NAME], os_release_pretty_name(os_pretty_name, os_name)) < 0)\n  238 |                 log_oom();\n  239 | \n  240 |         unescape_fancy_name(&os_fancy_name);\n  241 | \n  242 |         if (isempty(os_fancy_name)) {\n  243 |                 free(os_fancy_name); /* free if empty string */\n  244 | \n  245 |                 if (isempty(os_ansi_color))\n  246 |                         os_fancy_name = strdup(c->data[PROP_OS_PRETTY_NAME]);\n  247 |                 else\n  248 |                         os_fancy_name = strjoin(\"\\x1B[\", os_ansi_color, \"m\", c->data[PROP_OS_PRETTY_NAME]);\n  249 |                 if (!os_fancy_name)\n  250 |                         log_oom();","lines":14,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/hostname/hostnamed.c#L237-L250"}]},
{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"very_easy","description":"In `bpf_restrict_fs_update()` the inner BPF map fd returned by `compat_bpf_map_create()` is stored in a plain `int inner_map_fd` and is never closed on any path (success at the final `return 0`, or the early error returns). Once the inner map is inserted into the outer hash-of-maps via `sym_bpf_map_update_elem(outer_map_fd, ...)`, the kernel holds its own reference, so the userspace fd is safe to close - but it is leaked instead. This function runs in the manager (PID 1) once per (re)start of every unit that sets `RestrictFileSystems=`, so the fd count in PID 1 grows unbounded across service restarts. Note the sibling helper `prepare_restrict_fs_bpf()` correctly declares its dummy `inner_map_fd` as `_cleanup_close_`, making the omission here clearly a bug.","fix":"Give the fd automatic cleanup (the `fd-util.h` header providing `_cleanup_close_` is already included):\n```c\n_cleanup_close_ int inner_map_fd = compat_bpf_map_create(\n                BPF_MAP_TYPE_HASH,\n                NULL,\n                sizeof(uint32_t),\n                sizeof(uint32_t),\n                128U, /* Should be enough for all filesystem types */\n                NULL);\n```\nThe kernel keeps the inner map alive via the reference held by the outer map, so closing the local fd on return is correct.","locations":[{"ref":"src/core/bpf-restrict-fs.c:97-143","code":"   97 |         int inner_map_fd = compat_bpf_map_create(\n   98 |                         BPF_MAP_TYPE_HASH,\n   99 |                         NULL,\n  100 |                         sizeof(uint32_t),\n  101 |                         sizeof(uint32_t),\n  102 |                         128U, /* Should be enough for all filesystem types */\n  103 |                         NULL);\n  104 |         if (inner_map_fd < 0)\n  105 |                 return log_error_errno(errno, \"bpf-restrict-fs: Failed to create inner BPF map: %m\");\n  106 | \n  107 |         if (sym_bpf_map_update_elem(outer_map_fd, &cgroup_id, &inner_map_fd, BPF_ANY) != 0)\n  108 |                 return log_error_errno(errno, \"bpf-restrict-fs: Error populating BPF map: %m\");\n  109 | \n  110 |         uint32_t allow = allow_list;\n  111 | \n  112 |         /* Use key 0 to store whether this is an allow list or a deny list */\n  113 |         if (sym_bpf_map_update_elem(inner_map_fd, &zero, &allow, BPF_ANY) != 0)\n  114 |                 return log_error_errno(errno, \"bpf-restrict-fs: Error initializing map: %m\");\n  115 | \n  116 |         SET_FOREACH(fs, filesystems) {\n  117 |                 r = fs_type_from_string(fs, &magic);\n  118 |                 if (r < 0) {\n  119 |                         log_warning(\"bpf-restrict-fs: Invalid filesystem name '%s', ignoring.\", fs);\n  120 |                         continue;\n  121 |                 }\n  122 | \n  123 |                 log_debug(\"bpf-restrict-fs: Restricting filesystem access to '%s'\", fs);\n  124 | \n  125 |                 for (int i = 0; i < FILESYSTEM_MAGIC_MAX; i++) {\n  126 |                         if (magic[i] == 0)\n  127 |                                 break;\n  128 | \n  129 |                         /* The map key is uint32_t but statfs_f_type_t may be 64-bit, pass a truncated copy\n  130 |                          * to avoid breaking on big endian arches. */\n  131 |                         uint32_t key = magic[i];\n  132 |                         if (sym_bpf_map_update_elem(inner_map_fd, &key, &dummy_value, BPF_ANY) != 0) {\n  133 |                                 r = log_error_errno(errno, \"bpf-restrict-fs: Failed to update BPF map: %m\");\n  134 | \n  135 |                                 if (sym_bpf_map_delete_elem(outer_map_fd, &cgroup_id) != 0)\n  136 |                                         log_debug_errno(errno, \"bpf-restrict-fs: Failed to delete cgroup entry from BPF map: %m\");\n  137 | \n  138 |                                 return r;\n  139 |                         }\n  140 |                 }\n  141 |         }\n  142 | \n  143 |         return 0;","lines":47,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/core/bpf-restrict-fs.c#L97-L143"}]},
{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"very_easy","description":"`efi_hibernate_location_free()` frees `device`, `kernel_version`, `id`, `image_id`, and `image_version`, but not `version_id`. The `version_id` field is populated by the dispatch table entry `osReleaseVersionId` via `json_dispatch_version`, which does `free_and_strdup(n, version)` and thus heap-allocates a string into `e->version_id`. That allocation is leaked whenever an `EFIHibernateLocation` is freed. The impact is bounded because the hibernate-resume tools and generator are short-lived one-shot processes, but it is a real leak (and would matter if this code were ever reused in a long-running context).","fix":"Add a `free(e->version_id);` call in `efi_hibernate_location_free()`. Before:\n```\n        free(e->kernel_version);\n        free(e->id);\n        free(e->image_id);\n        free(e->image_version);\n```\nAfter:\n```\n        free(e->kernel_version);\n        free(e->id);\n        free(e->image_id);\n        free(e->version_id);\n        free(e->image_version);\n```","locations":[{"ref":"src/hibernate-resume/hibernate-resume-config.c:34-46","code":"   34 | EFIHibernateLocation* efi_hibernate_location_free(EFIHibernateLocation *e) {\n   35 |         if (!e)\n   36 |                 return NULL;\n   37 | \n   38 |         free(e->device);\n   39 | \n   40 |         free(e->kernel_version);\n   41 |         free(e->id);\n   42 |         free(e->image_id);\n   43 |         free(e->image_version);\n   44 | \n   45 |         return mfree(e);\n   46 | }","lines":13,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/hibernate-resume/hibernate-resume-config.c#L34-L46"}]},
{"id":"MEM_3","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"very_easy","description":"`TarExport` opens `tree_fd` and `userns_fd` in `tar_export_start()` (via `import_make_foreign_userns()`, `fd_reopen()`, or `open()`), stores them in the struct, but `tar_export_unref()` never closes them. Only `e->tar_fd` is closed. After each export both descriptors are leaked until process exit. (Impact is limited because the only caller, `src/import/export.c`, is a one-shot CLI, but it is a genuine descriptor leak in the destructor.)","fix":"Close the two internally-opened fds in `tar_export_unref()`. Before:\n```\n        safe_close(e->tar_fd);\n\n        free(e->buffer);\n```\nAfter:\n```\n        safe_close(e->tar_fd);\n        safe_close(e->tree_fd);\n        safe_close(e->userns_fd);\n\n        free(e->buffer);\n```","locations":[{"ref":"src/import/export-tar.c:64-86","code":"   64 | TarExport *tar_export_unref(TarExport *e) {\n   65 |         if (!e)\n   66 |                 return NULL;\n   67 | \n   68 |         sd_event_source_unref(e->output_event_source);\n   69 | \n   70 |         pidref_done_sigkill_wait(&e->tar_pid);\n   71 | \n   72 |         if (e->temp_path) {\n   73 |                 (void) btrfs_subvol_remove(e->temp_path, BTRFS_REMOVE_QUOTA);\n   74 |                 free(e->temp_path);\n   75 |         }\n   76 | \n   77 |         e->compress = compressor_free(e->compress);\n   78 | \n   79 |         sd_event_unref(e->event);\n   80 | \n   81 |         safe_close(e->tar_fd);\n   82 | \n   83 |         free(e->buffer);\n   84 |         free(e->path);\n   85 |         return mfree(e);\n   86 | }","lines":23,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/import/export-tar.c#L64-L86"},{"ref":"src/import/export-tar.c:335-362","code":"  335 |         if (FLAGS_SET(e->flags, IMPORT_FOREIGN_UID)) {\n  336 |                 r = import_make_foreign_userns(&e->userns_fd);\n  337 |                 if (r < 0)\n  338 |                         return r;\n  339 | \n  340 |                 _cleanup_close_ int directory_fd = open(p, O_DIRECTORY|O_CLOEXEC|O_PATH);\n  341 |                 if (directory_fd < 0)\n  342 |                         return log_error_errno(r, \"Failed to open '%s': %m\", p);\n  343 | \n  344 |                 _cleanup_close_ int mapped_fd = -EBADF;\n  345 |                 r = mountfsd_mount_directory_fd(\n  346 |                                 /* vl= */ NULL,\n  347 |                                 directory_fd,\n  348 |                                 e->userns_fd,\n  349 |                                 DISSECT_IMAGE_FOREIGN_UID,\n  350 |                                 &mapped_fd);\n  351 |                 if (r < 0)\n  352 |                         return log_error_errno(r, \"Failed to mount directory via mountfsd: %m\");\n  353 | \n  354 |                 /* Drop O_PATH */\n  355 |                 e->tree_fd = fd_reopen(mapped_fd, O_DIRECTORY|O_CLOEXEC);\n  356 |                 if (e->tree_fd < 0)\n  357 |                         return log_error_errno(errno, \"Failed to re-open mapped '%s': %m\", p);\n  358 |         } else {\n  359 |                 e->tree_fd = open(p, O_DIRECTORY|O_CLOEXEC);\n  360 |                 if (e->tree_fd < 0)\n  361 |                         return log_error_errno(errno, \"Failed to open '%s': %m\", p);\n  362 |         }","lines":28,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/import/export-tar.c#L335-L362"}]},
{"id":"MEM_4","type":"memory_leak","type_label":"Memory Leak","severity":"negligible","difficulty":"very_easy","description":"`parse_pull_expression()` transfers ownership of the heap-allocated `image_root` into the `Transfer` struct via `.image_root = TAKE_PTR(image_root)` (field is `const char *`), but `transfer_destroy_many()` frees only `t->local`, `t->remote` and unrefs `t->json`, never freeing `t->image_root`. Each parsed transfer leaks its `image_root` string.","fix":"Free `image_root` in the destructor. Before:\n```\n        FOREACH_ARRAY(t, transfers, n) {\n                free(t->local);\n                free(t->remote);\n                sd_json_variant_unref(t->json);\n        }\n```\nAfter:\n```\n        FOREACH_ARRAY(t, transfers, n) {\n                free(t->local);\n                free(t->remote);\n                free((char*) t->image_root);\n                sd_json_variant_unref(t->json);\n        }\n```","locations":[{"ref":"src/import/import-generator.c:43-51","code":"   43 | static void transfer_destroy_many(Transfer *transfers, size_t n) {\n   44 |         FOREACH_ARRAY(t, transfers, n) {\n   45 |                 free(t->local);\n   46 |                 free(t->remote);\n   47 |                 sd_json_variant_unref(t->json);\n   48 |         }\n   49 | \n   50 |         free(transfers);\n   51 | }","lines":9,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/import/import-generator.c#L43-L51"},{"ref":"src/import/import-generator.c:223-231","code":"  223 |         arg_transfers[arg_n_transfers++] = (Transfer) {\n  224 |                 .class = class,\n  225 |                 .type = type,\n  226 |                 .local = TAKE_PTR(local),\n  227 |                 .remote = TAKE_PTR(remote),\n  228 |                 .image_root = TAKE_PTR(image_root),\n  229 |                 .json = TAKE_PTR(j),\n  230 |                 .blockdev = blockdev,\n  231 |         };","lines":9,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/import/import-generator.c#L223-L231"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"In `qcow2_convert()` the destination write offset `p` is computed purely from attacker-controlled header\nfields taken from the (possibly downloaded/untrusted) QCOW2 image, with no bound check against the\ndeclared virtual disk size or against 64-bit overflow: `p = ((i << HEADER_L2_BITS(&header)) + j) << HEADER_CLUSTER_BITS(&header);`\nwhere `i` ranges up to `HEADER_L1_SIZE(&header)` (capped at `32*1024*1024` by `verify_header()`) and `j`\nranges up to `HEADER_L2_SIZE(&header)` (`cluster_size/8`). With the maximum permitted `cluster_bits` of 21\n(2MB clusters, so `HEADER_L2_BITS` = 18), `i` alone can reach `2^25`, so `i << 18` already approaches `2^43`,\nand the final `<< HEADER_CLUSTER_BITS` (another `<<21`) can wrap a 64-bit `uint64_t` for large but\nstill-`verify_header()`-legal `l1_size`/`cluster_bits` combinations. Separately, even without wraparound,\nnothing checks that `p` stays below `HEADER_SIZE(&header)` (the size the output file was `ftruncate()`d to\nat `qcow2-util.c:256`), so a crafted image with an oversized `l1_size` relative to its declared `size` can\nmake `copy_cluster()`/`decompress_cluster()` `pwrite()` far beyond the intended file bounds. Because this\npath is reached when importing a `raw` image pulled from the network with `--convert-qcow2` (the default),\na malicious or compromised image host can trigger either wrapped/overlapping writes (silent output\ncorruption) or unbounded sparse-file growth (disk exhaustion / DoS) on the machine performing the import.","fix":"Add an explicit bound check before using `p` as a destination offset in `qcow2_convert()`'s inner loop,\ne.g.:\n\n```c\np = ((i << HEADER_L2_BITS(&header)) + j) << HEADER_CLUSTER_BITS(&header);\nif (p >= HEADER_SIZE(&header))\n        return -EBADMSG; /* cluster address outside of declared disk size */\n```\n\nAlso tighten `verify_header()` so that `HEADER_L1_SIZE(header) * HEADER_L2_SIZE(header) * HEADER_CLUSTER_SIZE(header)`\n(computed with overflow-checked arithmetic, e.g. via `mult_size_overflow()`/`__builtin_mul_overflow()`) does\nnot exceed `HEADER_SIZE(header)` (rounded up to a whole L1/L2 cluster grid), so `i`/`j`/`cluster_bits` can\nnever combine to overflow `uint64_t` or exceed the destination file's real size.","locations":[{"ref":"src/import/qcow2-util.c:182-216","code":"  182 | static int verify_header(const Header *header) {\n  183 |         assert(header);\n  184 | \n  185 |         if (HEADER_MAGIC(header) != QCOW2_MAGIC)\n  186 |                 return -EBADMSG;\n  187 | \n  188 |         if (!IN_SET(HEADER_VERSION(header), 2, 3))\n  189 |                 return -EOPNOTSUPP;\n  190 | \n  191 |         if (HEADER_CRYPT_METHOD(header) != 0)\n  192 |                 return -EOPNOTSUPP;\n  193 | \n  194 |         if (HEADER_CLUSTER_BITS(header) < 9) /* 512K */\n  195 |                 return -EBADMSG;\n  196 | \n  197 |         if (HEADER_CLUSTER_BITS(header) > 21) /* 2MB */\n  198 |                 return -EBADMSG;\n  199 | \n  200 |         if (HEADER_SIZE(header) % HEADER_CLUSTER_SIZE(header) != 0)\n  201 |                 return -EBADMSG;\n  202 | \n  203 |         if (HEADER_L1_SIZE(header) > 32*1024*1024) /* 32MB */\n  204 |                 return -EBADMSG;\n  205 | \n  206 |         if (HEADER_VERSION(header) == 3) {\n  207 | \n  208 |                 if (header->incompatible_features != 0)\n  209 |                         return -EOPNOTSUPP;\n  210 | \n  211 |                 if (HEADER_HEADER_LENGTH(header) < sizeof(Header))\n  212 |                         return -EBADMSG;\n  213 |         }\n  214 | \n  215 |         return 0;\n  216 | }","lines":35,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/import/qcow2-util.c#L182-L216"},{"ref":"src/import/qcow2-util.c:266-307","code":"  266 |         for (i = 0; i < HEADER_L1_SIZE(&header); i++) {\n  267 |                 uint64_t l2_begin, j;\n  268 | \n  269 |                 r = normalize_offset(&header, l1_table[i], &l2_begin, NULL, NULL);\n  270 |                 if (r < 0)\n  271 |                         return r;\n  272 |                 if (r == 0)\n  273 |                         continue;\n  274 | \n  275 |                 l = pread(qcow2_fd, l2_table, HEADER_CLUSTER_SIZE(&header), l2_begin);\n  276 |                 if (l < 0)\n  277 |                         return -errno;\n  278 |                 if ((uint64_t) l != HEADER_CLUSTER_SIZE(&header))\n  279 |                         return -EIO;\n  280 | \n  281 |                 for (j = 0; j < HEADER_L2_SIZE(&header); j++) {\n  282 |                         uint64_t data_begin, p, compressed_size;\n  283 |                         bool compressed;\n  284 | \n  285 |                         p = ((i << HEADER_L2_BITS(&header)) + j) << HEADER_CLUSTER_BITS(&header);\n  286 | \n  287 |                         r = normalize_offset(&header, l2_table[j], &data_begin, &compressed, &compressed_size);\n  288 |                         if (r < 0)\n  289 |                                 return r;\n  290 |                         if (r == 0)\n  291 |                                 continue;\n  292 | \n  293 |                         if (compressed)\n  294 |                                 r = decompress_cluster(\n  295 |                                                 qcow2_fd, data_begin,\n  296 |                                                 raw_fd, p,\n  297 |                                                 compressed_size, HEADER_CLUSTER_SIZE(&header),\n  298 |                                                 buffer1, buffer2);\n  299 |                         else\n  300 |                                 r = copy_cluster(\n  301 |                                                 qcow2_fd, data_begin,\n  302 |                                                 raw_fd, p,\n  303 |                                                 HEADER_CLUSTER_SIZE(&header), buffer1);\n  304 |                         if (r < 0)\n  305 |                                 return r;\n  306 |                 }\n  307 |         }","lines":42,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/import/qcow2-util.c#L266-L307"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"In `in_addr_prefix_nth()`, the `AF_INET` branch computes `t = nth << (32 - prefixlen);` where `nth` is a caller-supplied `uint64_t` but `t` is declared as `uint32_t`. The shift is evaluated in 64-bit arithmetic (since `nth` is `uint64_t`), but the assignment to `t` silently truncates the result to its low 32 bits *before* the overflow check `if (c > UINT32_MAX - t) return -ERANGE;` runs. For a caller-supplied `nth` whose shifted value exceeds `UINT32_MAX` (e.g. `prefixlen = 32` and `nth = 0x100000005`), `t` wraps around to a small value (here `5`), the overflow check passes even though the true requested offset is far outside the address space, and the function returns success with a bogus, silently wrapped address instead of `-ERANGE`. The equivalent `AF_INET6` branch does not have this problem because it processes `nth` incrementally, one byte at a time, and explicitly checks `nth != 0` at the end to catch any un-consumed high bits, so the two branches are inconsistent in how they handle an out-of-range `nth`.","fix":"Check for the shift-overflow before truncating into `t`, e.g. reject `nth` values whose bit length together with the shift amount exceeds 32 bits:\n\n```\nif (prefixlen > 32)\n        return -ERANGE;\n\nif (nth != 0 && (unsigned) __builtin_clzll(nth) < 32 - (32 - prefixlen))\n        return -ERANGE; /* nth alone doesn't fit before the shift */\n\nc = be32toh(u->in.s_addr);\nt = (uint32_t) (nth << (32 - prefixlen));\n```\n\nOr more simply, perform the shift/overflow check in 64-bit and only narrow to `uint32_t` after confirming the 64-bit sum fits in 32 bits, mirroring the byte-wise, carry-checked approach already used in the `AF_INET6` branch below.","locations":[{"ref":"src/basic/in-addr-util.c:297-316","code":"  297 |         if (family == AF_INET) {\n  298 |                 uint32_t c, n, t;\n  299 | \n  300 |                 if (prefixlen > 32)\n  301 |                         return -ERANGE;\n  302 | \n  303 |                 c = be32toh(u->in.s_addr);\n  304 | \n  305 |                 t = nth << (32 - prefixlen);\n  306 | \n  307 |                 /* Check for wrap */\n  308 |                 if (c > UINT32_MAX - t)\n  309 |                         return -ERANGE;\n  310 | \n  311 |                 n = c + t;\n  312 | \n  313 |                 n &= UINT32_C(0xFFFFFFFF) << (32 - prefixlen);\n  314 |                 u->in.s_addr = htobe32(n);\n  315 |                 return 0;\n  316 |         }","lines":20,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/in-addr-util.c#L297-L316"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`disk_get_url()` converts the URI device-path node string with `xstrn8_to_16(udp->Uri, dp->Length)`, passing the *entire* node length (`EFI_DEVICE_PATH.Length`) as the URI byte count. But `dp->Length` includes the 4-byte node header (`Type`+`SubType`+`Length`), while `udp->Uri` points just past that header. Per the UEFI spec the URI is not NUL-terminated and occupies exactly `Length - sizeof(EFI_DEVICE_PATH)` bytes. `xstrn8_to_16()` reads up to `n` bytes (stopping only at a NUL), so it reads 4 bytes past the end of the URI node, over-reading into the next node/adjacent memory and appending up to 4 garbage characters to the returned `StubDeviceURL`/`LoaderDeviceURL` EFI variable. Reachable on HTTP boot where the loaded-image device path contains a URI node.","fix":"Subtract the node header size from the length passed as the URI byte count: `return xstrn8_to_16(udp->Uri, dp->Length - sizeof(EFI_DEVICE_PATH));` (equivalently `dp->Length - offsetof(URI_DEVICE_PATH, Uri)`).","locations":[{"ref":"src/boot/url-discovery.c:25-26","code":"   25 |                 URI_DEVICE_PATH *udp = (URI_DEVICE_PATH*) dp;\n   26 |                 return xstrn8_to_16(udp->Uri, dp->Length);","lines":2,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/boot/url-discovery.c#L25-L26"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"very_easy","description":"`remove_from_order()` shifts the `BootOrder` array down by one after finding the matching `slot`, but the `memmove()` element count is `(n - i)` instead of `(n - i - 1)`. With `dest = order + i` and `src = order + i + 1`, copying `n - i` elements reads the source range `order[i+1 .. n]`, i.e. it dereferences `order[n]`, one element past the end of the `n`-element heap allocation returned by `efi_get_boot_order()`. This is a 2-byte out-of-bounds heap read (undefined behavior; can fault under a hardened allocator/ASan or at a page boundary). It is reached whenever `bootctl remove` (or removal of the fallback entry) deletes a slot that is not the last element of `BootOrder`. The subsequent `efi_set_boot_order(order, n - 1)` writes only `n-1` entries so the resulting order is otherwise correct; the defect is purely the OOB read. Note the analogous move in `insert_into_order()` at line 1325 correctly uses `(n - i - 1)`.","fix":"Copy one fewer element so the source stays in bounds. Change:\n```c\nif (i + 1 < n)\n        memmove(order + i, order + i+1, (n - i) * sizeof(uint16_t));\n```\nto:\n```c\nif (i + 1 < n)\n        memmove(order + i, order + i+1, (n - i - 1) * sizeof(uint16_t));\n```","locations":[{"ref":"src/bootctl/bootctl-install.c:1360-1366","code":" 1360 |         for (int i = 0; i < n; i++) {\n 1361 |                 if (order[i] != slot)\n 1362 |                         continue;\n 1363 | \n 1364 |                 if (i + 1 < n)\n 1365 |                         memmove(order + i, order + i+1, (n - i) * sizeof(uint16_t));\n 1366 |                 return efi_set_boot_order(order, n - 1);","lines":7,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/bootctl/bootctl-install.c#L1360-L1366"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"In `load_credential_glob()` the rename logic computes the tail of the matched filename with `fn + strlen(ic->glob) - !!endswith(ic->glob, \"*\")`. This assumes the glob has the shape `<literal-prefix>*`, so that `strlen(ic->glob)-1` equals the length of the literal prefix that `fn` (the basename returned by `path_extract_filename`) is guaranteed to start with. That invariant only holds when the glob ends in `*`. For any glob whose wildcard is NOT a trailing `*` (e.g. a leading/middle `*`, a `?`, or a `[...]` class), the matched `fn` can be strictly shorter than `strlen(ic->glob)`, so the pointer `fn + strlen(ic->glob)` points one or more bytes past the terminating NUL of the `fn` heap buffer. `strjoin` then calls `strlen` on that out-of-bounds pointer, causing a heap over-read (potential crash, or leaking adjacent heap bytes into the constructed credential name). Concretely, `ImportCredential=*.conf:prefix` matched against a file literally named `.conf`: `fn=\".conf\"` (len 5), `endswith(\"*.conf\",\"*\")` is false, `strlen(\"*.conf\")=6`, so `fn+6` is past the NUL of a 6-byte buffer. Likewise `ImportCredential=a*c:pfx` matching file `ac` (`*` matches empty): `fn=\"ac\"` (len 2), index 3, `fn+3` past the NUL. Both are reachable from unit configuration plus attacker/operator-controlled file names in a credential search dir.","fix":"Clamp the offset to the length of `fn` and derive the literal prefix length from the part of the glob before the first wildcard rather than assuming a trailing `*`. For example:\n```c\nif (ic->rename) {\n        _cleanup_free_ char *renamed = NULL;\n        size_t pfx = strcspn(ic->glob, \"*?[\");   /* literal prefix length */\n        pfx = MIN(pfx, strlen(fn));               /* never read past fn's NUL */\n\n        renamed = strjoin(ic->rename, fn + pfx);\n        if (!renamed)\n                return log_oom_debug();\n\n        free_and_replace(fn, renamed);\n}\n```\nThis keeps the existing `prefix*` behavior (`strcspn` stops at the `*`) while staying in-bounds for every other glob shape.","locations":[{"ref":"src/core/exec-credential.c:575-583","code":"  575 |                         if (ic->rename) {\n  576 |                                 _cleanup_free_ char *renamed = NULL;\n  577 | \n  578 |                                 renamed = strjoin(ic->rename, fn + strlen(ic->glob) - !!endswith(ic->glob, \"*\"));\n  579 |                                 if (!renamed)\n  580 |                                         return log_oom_debug();\n  581 | \n  582 |                                 free_and_replace(fn, renamed);\n  583 |                         }","lines":9,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/core/exec-credential.c#L575-L583"}]},
{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"In `dev_kmsg_record`, the stack array `struct iovec iovec[N_IOVEC_META_FIELDS + 7 + N_IOVEC_KERNEL_FIELDS + 2 + N_IOVEC_UDEV_FIELDS]` (`src/journal/journald-kmsg.c:99`) reserves a constant `+ 7` slots for the fixed metadata entries added outside the kernel-field and udev loops (`source_boot_time`, `source_monotonic_time`, `_TRANSPORT=kernel`, `syslog_priority`, `syslog_facility`, one identifier-ish entry, `message`). That budget of 7 only holds for the `LOG_FAC(priority) == LOG_KERN` branch, which adds exactly one more entry (`\"SYSLOG_IDENTIFIER=kernel\"`, line 280). The `else` branch (lines 281-308, non-kernel facility) can add **two** entries instead of one - `syslog_identifier` (line 301) *and* `syslog_pid` (line 306) - bringing the real worst-case straight-line count to 8, one more than the array reserves. If the kernel-field loop (`N_IOVEC_KERNEL_FIELDS` = 64) and the udev fields (`2 + N_IOVEC_UDEV_FIELDS` = 34) are simultaneously filled to their maxima while a non-kernel-facility `/dev/kmsg` record carries both a `SYSLOG_IDENTIFIER=` and `SYSLOG_PID=` payload, `iovec[n++]` writes one `struct iovec` past the end of the array before `manager_dispatch_message` even gets to append its own `N_IOVEC_META_FIELDS` entries - an out-of-bounds stack write.","fix":"Either bump the reserved constant from `7` to `8` in the array declaration:\n\n```c\nstruct iovec iovec[N_IOVEC_META_FIELDS + 8 + N_IOVEC_KERNEL_FIELDS + 2 + N_IOVEC_UDEV_FIELDS];\n```\n\nor restructure the `else` branch so at most one entry is ever appended (e.g. concatenate `SYSLOG_IDENTIFIER=` and `SYSLOG_PID=` into a single `iovec` slot), so both branches contribute the same fixed count that the `+ 7` budget assumes.","locations":[{"ref":"src/journal/journald-kmsg.c:99","code":"   99 |         struct iovec iovec[N_IOVEC_META_FIELDS + 7 + N_IOVEC_KERNEL_FIELDS + 2 + N_IOVEC_UDEV_FIELDS];","lines":1,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/journal/journald-kmsg.c#L99"}]},
{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"In `manager_determine_path_usage` (`src/journal/journald-manager.c:91-135`), the available disk space is computed as `*ret_free = ss.f_bsize * ss.f_bavail;` (line 114), with no cast to a 64-bit type before the multiplication. `f_bsize` and `f_bavail` (`struct statvfs`, populated via plain `fstatvfs()`, not `fstatvfs64()`) are `unsigned long`/`fsblkcnt_t`, i.e. native word-size integers: on any 32-bit build of systemd (still supported, e.g. i386/armhf/mipsel) this multiplication is carried out in 32-bit arithmetic and silently wraps for any filesystem whose available space (blocks * block size) exceeds 4 GiB, before the truncated result is widened and stored into the `uint64_t *ret_free` out-parameter. Tellingly, the very next block in the same function (line 131) computes journal-file disk usage with an explicit widening cast, `*ret_used += (uint64_t) st.st_blocks * 512UL;`, showing the author was aware of exactly this overflow class but did not apply the same fix to the `f_bsize * f_bavail` computation just above it. The corrupted `*ret_free` value flows into `cache_space_refresh()` -> `JournalStorageSpace.available/limit`, which in turn feeds `journal_ratelimit_test()`'s `burst_modulate()` (rate-limit burst sizing), `manager_do_vacuum()`'s vacuum/rotation thresholds, and the user-facing `DISK_AVAILABLE=`/`AVAILABLE=` fields in the `JOURNAL_USAGE` driver message - so a wrapped value can cause journald to make wrong vacuuming/rate-limiting decisions or report bogus disk-space diagnostics on affected filesystems.","fix":"Force the multiplication to be performed in 64-bit width, matching the pattern already used two lines below it for `st_blocks`:\n\n```c\n*ret_free = (uint64_t) ss.f_bsize * ss.f_bavail;\n```","locations":[{"ref":"src/journal/journald-manager.c:114","code":"  114 |         *ret_free = ss.f_bsize * ss.f_bavail;","lines":1,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/journal/journald-manager.c#L114"},{"ref":"src/journal/journald-manager.c:131","code":"  131 |                 *ret_used += (uint64_t) st.st_blocks * 512UL;","lines":1,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/journal/journald-manager.c#L131"}]},
{"id":"OVF_8","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"very_easy","description":"In `sd_dhcp_duid_set_llt()`, the local variable `time_from_2000y` is declared as `uint16_t`, but the DUID-LLT wire field `duid->duid.llt.time` is a 32-bit `be32_t` (per RFC 8415, the time field is `seconds since 2000-01-01 modulo 2^32`). The computation `(usec_sub_unsigned(usec, USEC_2000) / USEC_PER_SEC) & 0xffffffff` correctly keeps 32 bits of the seconds value, but the immediately following `(uint16_t)` cast truncates it down to only 16 bits before it is written out with `unaligned_write_be32(&duid->duid.llt.time, time_from_2000y)`. Because `time_from_2000y` is zero-extended back to 32 bits when passed to `unaligned_write_be32`, the upper 16 bits of the on-wire DUID-LLT time field are always zero, and the value wraps every `65536` seconds (about 18.2 hours) instead of every `2^32` seconds as the format requires. This weakens the uniqueness guarantee of `DUID-LLT` identifiers generated via `sd_dhcp_client_set_iaid_duid_llt()`.","fix":"Widen `time_from_2000y` to 32 bits and drop the truncating cast so the full modulo-2^32 seconds value is preserved end to end:\n\n```c\n-        uint16_t time_from_2000y;\n+        uint32_t time_from_2000y;\n...\n-        time_from_2000y = (uint16_t) ((usec_sub_unsigned(usec, USEC_2000) / USEC_PER_SEC) & 0xffffffff);\n+        time_from_2000y = (uint32_t) ((usec_sub_unsigned(usec, USEC_2000) / USEC_PER_SEC) & 0xffffffff);\n```\n\nWith this change `unaligned_write_be32(&duid->duid.llt.time, time_from_2000y)` writes the full 32-bit time value instead of a zero-extended 16-bit one.","locations":[{"ref":"src/libsystemd-network/sd-dhcp-duid.c:106-134","code":"  106 | int sd_dhcp_duid_set_llt(\n  107 |                 sd_dhcp_duid *duid,\n  108 |                 const void *hw_addr,\n  109 |                 size_t hw_addr_size,\n  110 |                 uint16_t arp_type,\n  111 |                 uint64_t usec) {\n  112 | \n  113 |         uint16_t time_from_2000y;\n  114 | \n  115 |         assert_return(duid, -EINVAL);\n  116 |         assert_return(hw_addr, -EINVAL);\n  117 | \n  118 |         if (arp_type == ARPHRD_ETHER)\n  119 |                 assert_return(hw_addr_size == ETH_ALEN, -EINVAL);\n  120 |         else if (arp_type == ARPHRD_INFINIBAND)\n  121 |                 assert_return(hw_addr_size == INFINIBAND_ALEN, -EINVAL);\n  122 |         else\n  123 |                 return -EOPNOTSUPP;\n  124 | \n  125 |         time_from_2000y = (uint16_t) ((usec_sub_unsigned(usec, USEC_2000) / USEC_PER_SEC) & 0xffffffff);\n  126 | \n  127 |         unaligned_write_be16(&duid->duid.type, SD_DUID_TYPE_LLT);\n  128 |         unaligned_write_be16(&duid->duid.llt.htype, arp_type);\n  129 |         unaligned_write_be32(&duid->duid.llt.time, time_from_2000y);\n  130 |         memcpy(duid->duid.llt.haddr, hw_addr, hw_addr_size);\n  131 | \n  132 |         duid->size = offsetof(struct duid, llt.haddr) + hw_addr_size;\n  133 |         return 0;\n  134 | }","lines":29,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/libsystemd-network/sd-dhcp-duid.c#L106-L134"}]},
{"id":"OVF_9","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"In `add_locales_from_archive()`, the bounds validation `h->namehash_offset + h->namehash_size > st.st_size` (and the three analogous checks for `string_*`, `locrectab_*` and `sumhash_*`) adds two `uint32_t` fields from the mmap'd `locarhead` header. Because both operands are `uint32_t`, the addition is performed and can wrap in 32-bit arithmetic *before* being promoted to `off_t` for the comparison against `st.st_size`. A corrupted or crafted `locale-archive` file with, for example, `namehash_offset = 0xFFFFFFF0` and `namehash_size = 0x20` wraps to `0x10`, which is smaller than `st.st_size`, so the bounds check passes even though `namehash_offset` itself points far outside the mapped region. The subsequent `e = (const struct namehashent*) ((const uint8_t*) p + h->namehash_offset);` then computes a pointer far past the `mmap()`'d area, and the following loop dereferences `e[i]` for `h->namehash_size` iterations, producing out-of-bounds reads of the mapped file.","fix":"Widen the arithmetic to a type that cannot wrap before the comparison, e.g. cast to `uint64_t` (or `off_t`) before adding:\n\n```\n// Before\nh->namehash_offset + h->namehash_size > st.st_size ||\n\n// After\n(uint64_t) h->namehash_offset + h->namehash_size > (uint64_t) st.st_size ||\n```\n\nApply the same cast to the `string_*`, `locrectab_*` and `sumhash_*` checks on the following lines so none of the four bounds checks can be bypassed via 32-bit wraparound.","locations":[{"ref":"src/basic/locale-util.c:135-145","code":"  135 |         if (h->magic != 0xde020109 ||\n  136 |             h->namehash_offset + h->namehash_size > st.st_size ||\n  137 |             h->string_offset + h->string_size > st.st_size ||\n  138 |             h->locrectab_offset + h->locrectab_size > st.st_size ||\n  139 |             h->sumhash_offset + h->sumhash_size > st.st_size) {\n  140 |                 r = -EBADMSG;\n  141 |                 goto finish;\n  142 |         }\n  143 | \n  144 |         e = (const struct namehashent*) ((const uint8_t*) p + h->namehash_offset);\n  145 |         for (size_t i = 0; i < h->namehash_size; i++) {","lines":11,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/locale-util.c#L135-L145"}]},
{"id":"OVF_10","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"The `DEFINE_STATX_BITS_TO_STRING` macro instantiates `statx_attributes_to_string()` for `uint64_t` values via\n`BIT_FOREACH(i, v)`, which (per `BIT_FOREACH`/`_BIT_NEXT_SET` in `bitfield.h`) can yield indices `0..63` for a\n64-bit `v`. Inside the macro body, `type f = 1 << i;` computes `1 << i` using the literal `1`, whose type is\nplain `int` (32-bit), before converting the result to `type` (`uint64_t`). For `i >= 32` this shifts an `int`\nby an amount greater than or equal to its width, which is undefined behavior in C, and even for `i` in\n`16..31` the result silently loses the high bits of a 64-bit attribute mask because the shift is computed in\n32-bit precision. Currently defined `STATX_ATTR_*` values stay below bit 32, so this is not triggered today,\nbut the macro is generic (also instantiated for `unsigned` via `statx_mask_to_string`) and will misbehave as\nsoon as a wider attribute bit is added upstream.","fix":"Cast the literal to the target type before shifting, e.g.:\n\n```c\n// before\ntype f = 1 << i;\n\n// after\ntype f = (type) 1 << i;\n```","locations":[{"ref":"src/basic/stat-util.c:370-393","code":"  370 | #define DEFINE_STATX_BITS_TO_STRING(prefix, type, func, format_str)             \\\n  371 |         static char* prefix##_to_string(type v) {                               \\\n  372 |                 if (v == 0)                                                     \\\n  373 |                         return strdup(\"\");                                      \\\n  374 |                                                                                 \\\n  375 |                 _cleanup_free_ char *s = NULL;                                  \\\n  376 |                                                                                 \\\n  377 |                 BIT_FOREACH(i, v) {                                             \\\n  378 |                         type f = 1 << i;                                        \\\n  379 |                                                                                 \\\n  380 |                         const char *n = func(f);                                \\\n  381 |                         if (!n)                                                 \\\n  382 |                                 continue;                                       \\\n  383 |                                                                                 \\\n  384 |                         if (!strextend_with_separator(&s, \"|\", n))              \\\n  385 |                                 return NULL;                                    \\\n  386 |                         v &= ~f;                                                \\\n  387 |                 }                                                               \\\n  388 |                                                                                 \\\n  389 |                 if (v != 0 && strextendf_with_separator(&s, \"|\", format_str, v) < 0) \\\n  390 |                         return NULL;                                            \\\n  391 |                                                                                 \\\n  392 |                 return TAKE_PTR(s);                                             \\\n  393 |         }","lines":24,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/stat-util.c#L370-L393"}]},
{"id":"OVF_11","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`struct strbuf_node.children_count` is declared as `uint8_t`, but a single trie node can legitimately\naccumulate one child per distinct next byte value, i.e. up to 256 distinct children (bytes `0x00`-`0xff`),\nsince `bubbleinsert()` in `strbuf_add_string_full()` is only ever called after a `typesafe_bsearch()` lookup\nconfirms the byte `c` is not already a child (so there is no cap below 256). When the 256th distinct child is\nadded to the same node, `node->children_count++` at the end of `bubbleinsert()` overflows `uint8_t` from\n`255` to `0`. Subsequent lookups then see `children_count == 0` and treat the node as childless, so all\n256 real children in the already-reallocated `children` array become permanently unreachable (a de-dup\ncorrectness bug and an effective memory leak, since `strbuf_node_cleanup()` also iterates only\n`children_count` entries and will not free the orphaned entries), and the next insert at that node\noverwrites `children[0]`, discarding the earlier data.","fix":"Widen `children_count` (and the counter arithmetic in `bubbleinsert()`) to a type that can hold 256, e.g.\n`uint16_t`:\n\n```c\nstruct strbuf_node {\n        size_t value_off;\n        size_t value_len;\n\n        struct strbuf_child_entry *children;\n        uint16_t children_count;\n};\n```\n\nand update `bubbleinsert()`'s `int left = 0, right = ASSERT_PTR(node)->children_count;` accordingly (already\nsafe as `int` promotion, only the storage needs widening).","locations":[{"ref":"src/basic/strbuf.h:18-24","code":"   18 | struct strbuf_node {\n   19 |         size_t value_off;\n   20 |         size_t value_len;\n   21 | \n   22 |         struct strbuf_child_entry *children;\n   23 |         uint8_t children_count;\n   24 | };","lines":7,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/strbuf.h#L18-L24"},{"ref":"src/basic/strbuf.c:81-104","code":"   81 | static void bubbleinsert(struct strbuf_node *node,\n   82 |                          uint8_t c,\n   83 |                          struct strbuf_node *node_child) {\n   84 | \n   85 |         struct strbuf_child_entry new = {\n   86 |                 .c = c,\n   87 |                 .child = node_child,\n   88 |         };\n   89 |         int left = 0, right = ASSERT_PTR(node)->children_count;\n   90 | \n   91 |         while (right > left) {\n   92 |                 int middle = (right + left) / 2 ;\n   93 |                 if (strbuf_children_cmp(&node->children[middle], &new) <= 0)\n   94 |                         left = middle + 1;\n   95 |                 else\n   96 |                         right = middle;\n   97 |         }\n   98 | \n   99 |         memmove(node->children + left + 1, node->children + left,\n  100 |                 sizeof(struct strbuf_child_entry) * (node->children_count - left));\n  101 |         node->children[left] = new;\n  102 | \n  103 |         node->children_count++;\n  104 | }","lines":24,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/strbuf.c#L81-L104"},{"ref":"src/basic/strbuf.c:157-176","code":"  157 |         /* new node */\n  158 |         _cleanup_free_ struct strbuf_node *node_child = NULL;\n  159 | \n  160 |         node_child = new(struct strbuf_node, 1);\n  161 |         if (!node_child)\n  162 |                 return -ENOMEM;\n  163 |         *node_child = (struct strbuf_node) {\n  164 |                 .value_off = off,\n  165 |                 .value_len = len,\n  166 |         };\n  167 | \n  168 |         /* extend array, add new entry, sort for bisection */\n  169 |         if (!GREEDY_REALLOC(node->children, node->children_count + 1))\n  170 |                 return -ENOMEM;\n  171 | \n  172 |         str->nodes_count++;\n  173 | \n  174 |         bubbleinsert(node, c, TAKE_PTR(node_child));\n  175 | \n  176 |         return off;","lines":20,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/basic/strbuf.c#L157-L176"}]},
{"id":"OVF_12","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"In `taint_strv()` the `stage` array holds exactly 11 slots (`const char *stage[11]`) and there are exactly 10 append sites (`unmerged-usr`, `unmerged-bin`, `var-run-bad`, `local-hwclock`, `support-ended`, `old-kernel`, `overflowuid-not-65534`, `overflowgid-not-65534`, `short-uid-range`, `short-gid-range`), so the maximum value of `n` after the loop is 10 (indices 0..9 used, index 10 is the NULL terminator). The post-loop guard `assert(n < ELEMENTSOF(stage) - 1)` evaluates to `assert(n < 10)`, which is FALSE when all 10 taint conditions hold simultaneously, aborting the process. The assert is off by one: the array is correctly sized (10 entries + 1 NULL), only the bound is wrong.","fix":"Relax the assertion so it permits the terminator slot at index `n`:\n```c\nassert(n < ELEMENTSOF(stage));  /* One extra for NULL terminator */\n```\ni.e. change `assert(n < ELEMENTSOF(stage) - 1);` to `assert(n < ELEMENTSOF(stage));`.","locations":[{"ref":"src/core/taint.c:80","code":"   80 |         assert(n < ELEMENTSOF(stage) - 1);  /* One extra for NULL terminator */","lines":1,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/core/taint.c#L80"},{"ref":"src/core/taint.c:36","code":"   36 |         const char *stage[11] = {};","lines":1,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/core/taint.c#L36"}]},
{"id":"OVF_13","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`entry_size_max_by_ucred()` in `src/journal/journald-native.c:341-385` is declared to return `size_t`, but its cache variable and all of its internal computations are `uint64_t entry_size_max`. When `$SYSTEMD_JOURNAL_FD_SIZE_MAX` is set and successfully parsed by `parse_size(p, 1024, &entry_size_max)` (line 355), the function does `return entry_size_max;` (line 359), implicitly truncating the parsed 64-bit byte count down to `size_t` before returning. On 32-bit builds of systemd (`size_t` is 32-bit there), an admin-supplied override larger than `UINT32_MAX` (e.g. `SYSTEMD_JOURNAL_FD_SIZE_MAX=5G`) silently wraps to a much smaller, effectively unrelated limit instead of being honored or rejected, which is confusing to operators trying to raise the accepted `native_file`/memfd entry size above the default caps (`ENTRY_SIZE_MAX`/`ENTRY_SIZE_UNPRIV_MAX`, both well under 4 GiB, so this only bites when someone deliberately configures an oversized override).","fix":"Keep the size 64-bit end-to-end, e.g. change the return type to `uint64_t` (and adjust the comparison in `manager_process_native_file()` accordingly), or explicitly clamp/reject values that don't fit in `size_t` before returning:\n\n```c\nif (entry_size_max > SIZE_MAX)\n        entry_size_max = SIZE_MAX;\nreturn entry_size_max;\n```","locations":[{"ref":"src/journal/journald-native.c:341-360","code":"  341 | static size_t entry_size_max_by_ucred(Manager *m, const struct ucred *ucred, const char *label) {\n  342 |         static uint64_t entry_size_max = UINT64_MAX;\n  343 |         static bool entry_size_max_checked = false;\n  344 |         int r;\n  345 | \n  346 |         if (entry_size_max != UINT64_MAX)\n  347 |                 return entry_size_max;\n  348 |         if (!entry_size_max_checked) {\n  349 |                 const char *p;\n  350 | \n  351 |                 entry_size_max_checked = true;\n  352 | \n  353 |                 p = secure_getenv(\"SYSTEMD_JOURNAL_FD_SIZE_MAX\");\n  354 |                 if (p) {\n  355 |                         r = parse_size(p, 1024, &entry_size_max);\n  356 |                         if (r < 0)\n  357 |                                 log_warning_errno(r, \"Failed to parse $SYSTEMD_JOURNAL_FD_SIZE_MAX, ignoring: %m\");\n  358 |                         else\n  359 |                                 return entry_size_max;\n  360 |                 }","lines":20,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/journal/journald-native.c#L341-L360"}]},
{"id":"OVF_14","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"easy","description":"In `load_addons_from_dir()` the overflow guard uses `sizeof(uint16_t)` (2 bytes) while the actual allocation is an array of pointers `sizeof(uint16_t *)` (8 bytes on 64-bit): the check `*n_items > (SIZE_MAX / sizeof(uint16_t)) - 16` permits `*n_items` up to ~SIZE_MAX/2, but the following `xrealloc(..., m * sizeof(uint16_t *))` can only safely hold ~SIZE_MAX/8 entries. The guard is thus too permissive by a factor of 4. Not practically reachable (a directory would need billions of `.addon.efi` entries), hence negligible, but the sentinel type is inconsistent with the allocation.","fix":"Use the pointer size in the overflow check to match the allocation, e.g. replace `SIZE_MAX / sizeof(uint16_t)` with `SIZE_MAX / sizeof(char16_t *)` (and correspondingly the `- 16` slack).","locations":[{"ref":"src/boot/stub.c:318-325","code":"  318 |                 if (*n_items + 2 > *n_allocated) {\n  319 |                         /* We allocate 16 entries at a time, as a matter of optimization */\n  320 |                         if (*n_items > (SIZE_MAX / sizeof(uint16_t)) - 16) /* Overflow check, just in case */\n  321 |                                 return log_oom();\n  322 | \n  323 |                         size_t m = *n_items + 16;\n  324 |                         *items = xrealloc(*items, *n_allocated * sizeof(uint16_t *), m * sizeof(uint16_t *));\n  325 |                         *n_allocated = m;","lines":8,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/boot/stub.c#L318-L325"}]},
{"id":"OVF_15","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"easy","description":"In `status_vprintf()`, `emax` (a `size_t`) is computed as `emax = c - sl - 1;` where `c` is an `int` terminal width (from `fd_columns()` or the externally-controlled `COLUMNS` env var, forced to `>= 1`) and `sl` is `strlen(status_indent)` (9) or 0. For narrow terminals where `c <= sl` (i.e. `c` in 1..9 with a status prefix), the subtraction wraps around to a huge `size_t`. The subsequent clamp `if (emax < 3) emax = 3;` fails to catch this, so `ellipsize(s, emax, 50)` is called with an enormous limit and performs no truncation. Effect is purely cosmetic (status line not ellipsized on an extremely narrow terminal) and cannot crash, since `ellipsize()` tolerates oversized limits.","fix":"Compute the width in a signed/guarded way before assigning to `size_t`, e.g. clamp first: `emax = c > (int)(sl + 4) ? (size_t)(c - sl - 1) : 3;` so the `emax < 3` floor is actually honored for narrow terminals.","locations":[{"ref":"src/core/show-status.c:85-87","code":"   85 |                 emax = c - sl - 1;\n   86 |                 if (emax < 3)\n   87 |                         emax = 3;","lines":3,"link":"https://github.com/systemd/systemd/blob/d04aa853bcf0833eb1c50ea721b745c6ca8f6d43/src/core/show-status.c#L85-L87"}]},
