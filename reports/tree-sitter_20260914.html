<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"critical","difficulty":"easy","description":"`callback__debug_message` reads `string_address` straight from `args_and_results[0].i32`, which is a value chosen entirely by the running WASM module (this callback backs the `tree_sitter_debug_message` import that any external scanner can call), and immediately does `printf(\"DEBUG: %s %u\\n\", &memory[string_address], value)` with no bounds check whatsoever. Unlike every other host-side reader in this file (`wasm_memory__read`, `wasm_memory__string_length`, `copy_string`, `copy`), this function never validates `string_address` against the WASM linear memory size before treating `&memory[string_address]` as a NUL-terminated C string. A malicious or buggy scanner can pass an out-of-range address, causing the host process to read (and print) memory past the end of the WASM heap allocation - anywhere from adjacent heap metadata to an unmapped page (crash) - directly defeating the sandbox boundary this file is supposed to enforce.","fix":"Bounds-check `string_address` before dereferencing it, exactly like `copy_string` does with `wasm_memory__string_length`:\n```c\nstatic wasm_trap_t *callback__debug_message(\n  void *env,\n  wasmtime_caller_t* caller,\n  wasmtime_val_raw_t *args_and_results,\n  size_t args_and_results_len\n) {\n  wasmtime_context_t *context = wasmtime_caller_context(caller);\n  TSWasmStore *store = env;\n  ts_assert(args_and_results_len == 2);\n  uint32_t string_address = args_and_results[0].i32;\n  uint32_t value = args_and_results[1].i32;\n  uint8_t *memory = wasmtime_memory_data(context, &store->memory);\n  size_t memory_size = wasmtime_memory_data_size(context, &store->memory);\n  WasmMemory wasm_memory = { .data = memory, .size = memory_size };\n  size_t len;\n  if (!wasm_memory__string_length(&wasm_memory, (int32_t)string_address, &len)) {\n    return wasmtime_trap_new(\"debug_message: string out of bounds\", 34);\n  }\n  printf(\"DEBUG: {"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"In `parse_file_at_path`, when printing the parse-time summary line, `parse_duration.as_nanos()` (a `u128`) is used directly as the divisor in `(source_code.len() as u128 * 1_000_000) / parse_duration.as_nanos()`. Integer division by zero always panics in Rust, and `parse_duration` can legitimately be `0` for very small/trivial inputs (or on platforms/timers with coarse resolution). This code path runs whenever `first_error.is_some()` (i.e. on essentially every file with a parse error) or when `--time` is passed, so a fast parse of a tiny malformed file crashes `tree-sitter parse` instead of printing a result. Notably, `Stats::fmt` in the same file (lines 42-49) already special-cases a zero duration to avoid exactly this problem, but this code path was not given the same treatment.","fix":"Guard against a zero duration the same way `Stats::fmt` does, e.g.:\n```rust\nlet bytes_per_ms = if parse_duration.as_nanos() == 0 {\n    0\n} else {\n    (source_code.len() as u128 * 1_000_000) / parse_duration.as_nanos()\n};\nwrite!(&mut stdout, \"{:width$}\\tParse: {parse_duration_ms:>7.2} ms\\t{bytes_per_ms:>6} bytes/ms\", name, width = max_path_length)?;\n```","locations":[{"ref":"crates/cli/src/parse.rs:665-673","code":"  665 |         if first_error.is_some() || opts.print_time {\n  666 |             let path = path.to_string_lossy();\n  667 |             write!(\n  668 |                 &mut stdout,\n  669 |                 \"{:width$}\\tParse: {parse_duration_ms:>7.2} ms\\t{:>6} bytes/ms\",\n  670 |                 name,\n  671 |                 (source_code.len() as u128 * 1_000_000) / parse_duration.as_nanos(),\n  672 |                 width = max_path_length\n  673 |             )?;","lines":9,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/crates/cli/src/parse.rs#L665-L673"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"When `tree-sitter init` runs on a directory that already has a `tree-sitter.json`, `Init::run` deserializes it into `TreeSitterJSON` and then does `json.grammars.swap_remove(0).name` without checking that `grammars` is non-empty. `TreeSitterJSON::grammars` has no `#[serde(default)]` or minimum-length validation, so a hand-edited or externally-generated `tree-sitter.json` containing `\"grammars\": []` deserializes successfully and then causes `swap_remove(0)` to panic with an index-out-of-bounds message instead of a clean error. The same unchecked-index pattern (`tree_sitter_config.grammars[0]`) is repeated throughout `generate_grammar_files` in `init.rs`, which is reachable from the same code path.","fix":"Validate `grammars` is non-empty right after parsing `tree-sitter.json` and return a proper `anyhow!` error (e.g. `\"tree-sitter.json must declare at least one grammar\"`) instead of letting the later indexing operations panic.","locations":[{"ref":"crates/cli/src/main.rs:924","code":"  924 |             (json.grammars.swap_remove(0).name, None)","lines":1,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/crates/cli/src/main.rs#L924"},{"ref":"crates/cli/src/init.rs:282-339","code":"  282 |     let camel_name = tree_sitter_config.grammars[0]\n  283 |         .camelcase\n  284 |         .take()\n  285 |         .unwrap_or_else(|| language_name.to_upper_camel_case());\n  286 |     let title_name = tree_sitter_config.grammars[0]\n  287 |         .title\n  288 |         .take()\n  289 |         .unwrap_or_else(|| language_name.to_upper_camel_case());\n  290 |     let class_name = tree_sitter_config.grammars[0]\n  291 |         .class_name\n  292 |         .take()\n  293 |         .unwrap_or_else(|| format!(\"TreeSitter{}\", language_name.to_upper_camel_case()));\n  294 | \n  295 |     let authors = tree_sitter_config. {"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`Config::add` calls `self.config.as_object_mut().unwrap()` on the JSON value that was loaded from the user's `config.json`. `Config::load` never validates that the top-level JSON value is an object -- it accepts whatever `serde_json::from_str` parses. If a user's config file is valid JSON but not an object (e.g. `[]`, `null`, or a bare string, which can happen from manual editing or a botched merge), every subsequent call to `Config::add` (used by `tree-sitter init-config` and any command that persists loader/highlight config) panics instead of reporting a clear configuration error.","fix":"Return a proper `ConfigError` instead of unwrapping, e.g. add a `ConfigError` variant for \"config root is not a JSON object\" and use `.ok_or_else(...)?` in place of `.unwrap()` in both places `as_object_mut()` is called in `add`.","locations":[{"ref":"crates/config/src/tree_sitter_config.rs:202-212","code":"  202 |     pub fn add<C>(&mut self, config: C) -> ConfigResult<()>\n  203 |     where\n  204 |         C: Serialize,\n  205 |     {\n  206 |         let mut config = serde_json::to_value(&config)?;\n  207 |         self.config\n  208 |             .as_object_mut()\n  209 |             .unwrap()\n  210 |             .append(config.as_object_mut().unwrap());\n  211 |         Ok(())\n  212 |     }","lines":11,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/crates/config/src/tree_sitter_config.rs#L202-L212"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"In `Loader::select_language`, the error-mapping closure for `language_configuration_for_file_name` does `path.file_name().unwrap().to_string_lossy().to_string()`. `Path::file_name()` returns `None` for paths that are empty, `.`, `..`, or end in `..` (e.g. a CLI invocation like `tree-sitter parse ..`) combined with an IO error from reading that path (e.g. attempting to read a directory as a file), which is exactly the scenario that reaches this closure. `unwrap()` on that `None` panics instead of returning a `LoaderResult` error.","fix":"Use a fallback instead of `unwrap()`:\n```rust\npath.file_name().map_or_else(|| path.to_string_lossy().to_string(), |n| n.to_string_lossy().to_string()),\n```","locations":[{"ref":"crates/loader/src/loader.rs:2012-2019","code":" 2012 |         } else if let Some((lang, _)) = if let Some(path) = path {\n 2013 |             self.language_configuration_for_file_name(path)\n 2014 |                 .map_err(|e| {\n 2015 |                     LoaderError::FileNameLoad(\n 2016 |                         path.file_name().unwrap().to_string_lossy().to_string(),\n 2017 |                         Box::new(e),\n 2018 |                     )\n 2019 |                 })?","lines":8,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/crates/loader/src/loader.rs#L2012-L2019"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"`WasmStore::load_language` calls `CString::new(name).unwrap()` on the caller-supplied `name: &str`. `CString::new` returns `Err` whenever the input contains an embedded NUL byte, and `.unwrap()` on that `Err` panics. Since `name` is a public API parameter (often derived from a filename, user-configured language id, or other externally influenced string), any caller passing a name containing a `\\0` byte crashes the whole process instead of getting a `WasmError` back, even though this function's signature already returns `Result<Language, WasmError>` for error reporting.","fix":"Propagate the error instead of unwrapping, e.g.:\n```rust\npub fn load_language(&mut self, name: &str, bytes: &[u8]) -> Result<Language, WasmError> {\n    let name = CString::new(name).map_err(|_| WasmError {\n        kind: WasmErrorKind::Other,\n        message: \"language name must not contain a NUL byte\".to_string(),\n    })?;\n    ...\n```","locations":[{"ref":"lib/binding_rust/wasm_language.rs:64-81","code":"   64 |     pub fn load_language(&mut self, name: &str, bytes: &[u8]) -> Result<Language, WasmError> {\n   65 |         let name = CString::new(name).unwrap();\n   66 |         unsafe {\n   67 |             let mut error = MaybeUninit::<ffi::TSWasmError>::uninit();\n   68 |             let language = ffi::ts_wasm_store_load_language(\n   69 |                 self.0,\n   70 |                 name.as_ptr(),\n   71 |                 bytes.as_ptr().cast::<c_char>(),\n   72 |                 bytes.len() as u32,\n   73 |                 error.as_mut_ptr(),\n   74 |             );\n   75 |             if language.is_null() {\n   76 |                 Err(WasmError::new(error.assume_init()))\n   77 |             } else {\n   78 |                 Ok(Language(language))\n   79 |             }\n   80 |         }\n   81 |     }","lines":18,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/lib/binding_rust/wasm_language.rs#L64-L81"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"medium","difficulty":"hard","description":"`stack_node_release` and `stack_node_add_link` in `lib/src/stack.c` both use native C recursion to walk the predecessor graph of `StackNode`s, and only the `links[0]` chain is flattened into an iterative `goto recur` loop; every other link (`links[1] .. links[link_count-1]`) is released or merged via a genuine recursive call (`stack_node_release(link.node, pool, subtree_pool)` at `lib/src/stack.c:105`, and `stack_node_add_link(existing_link->node, link.node->links[j], subtree_pool)` at `lib/src/stack.c:235`). For grammars/inputs that produce many GLR merges where the *non-primary* link forms a long chain (rather than the primary `links[0]` chain), this recursion depth tracks the depth of the parse stack and is effectively unbounded, since neither `MAX_LINK_COUNT` nor any other constant caps how many `StackNode`s can be chained together through secondary links. A sufficiently deep/ambiguous input (e.g. deeply nested expressions that create alternate merge paths) can therefore exhaust the native call stack and crash the process (stack overflow) when the stack node is eventually released or when nodes are merged, even though ordinary long single-path chains are safe because of the `goto recur` trampoline.","fix":"Extend the iterative work-list technique already used for the primary (`links[0]`) chain to the secondary links as well, e.g. push `link.node` for `i >= 1` onto an explicit heap-allocated/stack-allocated worklist (`StackNodeArray`) instead of recursing, and drain that worklist in the same function, so total stack depth stays `O(1)` regardless of how deep secondary merge chains become.","locations":[{"ref":"lib/src/stack.c:90-122","code":"   90 | static void stack_node_release(\n   91 |   StackNode *self,\n   92 |   StackNodeArray *pool,\n   93 |   SubtreePool *subtree_pool\n   94 | ) {\n   95 | recur:\n   96 |   ts_assert(self->ref_count != 0);\n   97 |   self->ref_count--;\n   98 |   if (self->ref_count > 0) return;\n   99 | \n  100 |   StackNode *first_predecessor = NULL;\n  101 |   if (self->link_count > 0) {\n  102 |     for (unsigned i = self->link_count - 1; i > 0; i--) {\n  103 |       StackLink link = self->links[i];\n  104 |       if (link.subtree.ptr) ts_subtree_release(subtree_pool, link.subtree);\n  105 |       stack_node_release(link.node, pool, subtree_pool);\n  106 |     }\n  107 |     StackLink link = self->links[0];\n  108 |     if (link.subtree.ptr) ts_subtree_release(subtree_pool, link.subtree);\n  109 |     first_predecessor = self->links[0].node;\n  110 |   }\n  111 | \n  112 |   if (pool->size < MAX_NODE_POOL_SIZE) {\n  113 |     array_push(pool, self);\n  114 |   } else {\n  115 |     ts_free(self);\n  116 |   }\n  117 | \n  118 |   if (first_predecessor) {\n  119 |     self = first_predecessor;\n  120 |     goto recur;\n  121 |   }\n  122 | }","lines":33,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/lib/src/stack.c#L90-L122"},{"ref":"lib/src/stack.c:200-264","code":"  200 | static void stack_node_add_link(\n  201 |   StackNode *self,\n  202 |   StackLink link,\n  203 |   SubtreePool *subtree_pool\n  204 | ) {\n  205 |   if (link.node == self) return;\n  206 | \n  207 |   for (int i = 0; i < self->link_count; i++) {\n  208 |     StackLink *existing_link = &self->links[i];\n  209 |     if (stack__subtree_is_equivalent(existing_link->subtree, link.subtree)) {\n  210 |       // In general, we preserve ambiguities until they are removed from the stack\n  211 |       // during a pop operation where multiple paths lead to the same node. But in\n  212 |       // the special case where two links directly connect the same pair of nodes,\n  213 |       // we can safely remove the ambiguity ahead of time without changing behavior.\n  214 |       if (existing_link->node == link.node) {\n  215 |         if (\n  216 |           ts_subtree_dynamic_precedence(link.subtree) >\n  217 |           ts_subtree_dynamic_precedence(existing_link->subtree)\n  218 |         ) {\n  219 |           ts_subtree_retain(link.subtree);\n  220 |           ts_subtree_release(subtree_pool, existing_link->subtree);\n  221 |           existing_link->subtree = link.subtree;\n  222 |           self->dynamic_precedence =\n  223 |             link.node->dynamic_precedence + ts_subtree_dynamic_precedence(link.subtree);\n  224 |         }\n  225 |         return;\n  226 |       }\n  227 | \n  228 |       // If the previous nodes are mergeable, merge them recursively.\n  229 |       if (\n  230 |         existing_link->node->state == link.node->state &&\n  231 |         existing_link->node->position.bytes == link.node->position.bytes &&\n  232 |         existing_link->node->error_cost == link.node->error_cost\n  233 |       ) {\n  234 |         for (int j = 0; j < link.node->link_count; j++) {\n  235 |           stack_node_add_link(existing_link->node, link.node->links[j], subtree_pool);\n  236 |         }\n  237 |         int32_t dynamic_precedence = link.node->dynamic_precedence;\n  238 |         if (link.subtree.ptr) {\n  239 |           dynamic_precedence += ts_subtree_dynamic_precedence(link.subtree);\n  240 |         }\n  241 |         if (dynamic_precedence > self->dynamic_precedence) {\n  242 |           self->dynamic_precedence = dynamic_precedence;\n  243 |         }\n  244 |         return;\n  245 |       }\n  246 |     }\n  247 |   }\n  248 | \n  249 |   if (self->link_count == MAX_LINK_COUNT) return;\n  250 | \n  251 |   stack_node_retain(link.node);\n  252 |   unsigned node_count = link.node->node_count;\n  253 |   int dynamic_precedence = link.node->dynamic_precedence;\n  254 |   self->links[self->link_count++] = link;\n  255 | \n  256 |   if (link.subtree.ptr) {\n  257 |     ts_subtree_retain(link.subtree);\n  258 |     node_count += stack__subtree_node_count(link.subtree);\n  259 |     dynamic_precedence += ts_subtree_dynamic_preced {"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`LogSession`'s `Drop` implementation calls `.unwrap()` on `self.dot_process.take().unwrap().wait_with_output().unwrap()` and on `fs::metadata(&self.path).unwrap()`. If the spawned `dot` process is killed/crashes abnormally (e.g. `graphviz` misbehaving, disk full, or the log file being removed concurrently), these unwraps panic during `drop`, which is risky: a panic while already unwinding from another panic aborts the process instead of failing gracefully, and even in the normal case it turns an environment/tooling failure (missing `dot`, I/O race) into an uncontrolled panic rather than the `error!(...)` logging path already used a few lines below for the non-success case.","fix":"Replace the `unwrap()` calls in `Drop for LogSession` with pattern matches that log via `error!` and return early on failure, mirroring the existing `else { error!(...) }` branch, instead of panicking.","locations":[{"ref":"crates/cli/src/util.rs:113-131","code":"  113 | impl Drop for LogSession {\n  114 |     fn drop(&mut self) {\n  115 |         use std::fs;\n  116 | \n  117 |         drop(self.dot_process_stdin.take().unwrap());\n  118 |         let output = self.dot_process.take().unwrap().wait_with_output().unwrap();\n  119 |         if output.status.success() {\n  120 |             if self.open_log && fs::metadata(&self.path).unwrap().len() > HTML_HEADER.len() as u64 {\n  121 |                 webbrowser::open(&self.path.to_string_lossy()).unwrap();\n  122 |             }\n  123 |         } else {\n  124 |             error!(\n  125 |                 \"Dot failed: {} {}\",\n  126 |                 String::from_utf8_lossy(&output.stdout),\n  127 |                 String::from_utf8_lossy(&output.stderr)\n  128 |             );\n  129 |         }\n  130 |     }\n  131 | }","lines":19,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/crates/cli/src/util.rs#L113-L131"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`TagsConfiguration::syntax_type_name(&self, id: u32)` indexes `self.syntax_type_names[id as usize]` with no bounds check. Any caller of this public API that passes an `id` outside `0..syntax_type_names.len()` (e.g. a stale or foreign `syntax_type_id`) triggers an index-out-of-bounds panic instead of a graceful error/`None`.","fix":"Return `Option<&str>` and check bounds first: `self.syntax_type_names.get(id as usize).map(|name| ...)`.","locations":[{"ref":"crates/tags/src/tags.rs:248-259","code":"  248 |     #[must_use]\n  249 |     pub fn syntax_type_name(&self, id: u32) -> &str {\n  250 |         unsafe {\n  251 |             let cstr = CStr::from_ptr(\n  252 |                 self.syntax_type_names[id as usize]\n  253 |                     .as_ptr()\n  254 |                     .cast::<c_char>(),\n  255 |             )\n  256 |             .to_bytes();\n  257 |             str::from_utf8(cstr).expect(\"syntax type name was not valid utf-8\")\n  258 |         }\n  259 |     }","lines":12,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/crates/tags/src/tags.rs#L248-L259"}]},
{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"Both `check_wasm_exports::check_wasm_exports` and `build_wasm::run_wasm_stdlib` parse a text file of quoted, comma-terminated symbol names (`lib/binding_web/lib/exports.txt` and `lib/src/wasm/stdlib-symbols.txt`) with the exact same fragile pattern: `.map(|s| s[1..s.len() - 2].to_string())` / `.map(|line| format!(\"-Wl,--export={}\", &line[1..line.len() - 2]))`. Neither guards against a line shorter than 2 bytes (e.g. a blank trailing line, or a stray comment/line without the expected `\"symbol\",` shape). `line.len() - 2` underflows `usize` for such a line, and the subsequent slice indexing panics regardless of build profile (Rust always bounds-checks string slicing). Both files currently happen to have no such short lines, but the check is one accidental blank line (or manual edit) away from making these dev-tool subcommands (`xtask check-wasm-exports`, `xtask build-wasm-stdlib`) crash instead of failing gracefully.","fix":"Replace the raw slicing with a resilient trim, e.g. `s.trim_matches(['\"', ',']).to_string()` (or skip/`filter` out lines that don't start with `\"` and are shorter than 2 characters before slicing), so a malformed or blank line is handled gracefully instead of panicking.","locations":[{"ref":"crates/xtask/src/check_wasm_exports.rs:62-67","code":"   62 |     let mut wasm_exports = std::fs::read_to_string(\"lib/binding_web/lib/exports.txt\")?\n   63 |         .lines()\n   64 |         .map(|s| s.replace(\"_wasm\", \"\").replace(\"byte\", \"index\"))\n   65 |         // remove leading and trailing quotes, trailing comma\n   66 |         .map(|s| s[1..s.len() - 2].to_string())\n   67 |         .collect::<HashSet<_>>();","lines":6,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/crates/xtask/src/check_wasm_exports.rs#L62-L67"}]},
{"id":"UAF_1","type":"use_after_free","type_label":"Use After Free","severity":"low","difficulty":"medium","description":"`ts_stack_copy_version` copies an entire `StackHead` by value (`StackHead version_head = *array_get(&self->heads, version);`) and then only fixes up the fields that use shared/refcounted ownership or exclusive ownership: it retains `head->last_external_token` and explicitly sets `head->summary = NULL` (since `summary` is exclusively owned and must not be shared between two heads). It does the same fix-up for `node` via `stack_node_retain(head->node)`. However it forgets the fourth field with special ownership, `lookahead_when_paused`: this `Subtree` is transferred (not refcounted) into a head by `ts_stack_pause` and transferred back out by `ts_stack_resume`, and `stack_head_delete` unconditionally calls `ts_subtree_release` on it whenever `lookahead_when_paused.ptr` is set. If `ts_stack_copy_version` is ever called on a version whose head is currently paused (`status == StackStatusPaused`, so `lookahead_when_paused.ptr != NULL`), both the original and the copied head end up pointing at the same `Subtree` with only one owning reference between them; when both heads are eventually deleted (e.g. via `ts_stack_remove_version`/`stack_head_delete`), the subtree is released twice, corrupting the subtree pool / causing a use-after-free on the second release. Today the single call site (`lib/src/parser.c:1515`, inside `ts_parser__handle_error`) only ever invokes this on versions that were just resumed via `ts_stack_resume` (which clears `lookahead_when_paused`) or on freshly-created reduction versions, so the bug is not currently triggered, but the function itself does not enforce or assert this invariant, making it a latent trap for any future caller (or refactor of `ts_parser__handle_error`).","fix":"Either retain `lookahead_when_paused` the same way `last_external_token` is retained, or explicitly null it out after the copy (mirroring what is already done for `summary`), and/or add `ts_assert(version_head.lookahead_when_paused.ptr == NULL)` (i.e. assert the source head is not paused) to make the precondition explicit:\n```c\nStackVersion ts_stack_copy_version(Stack *self, StackVersion version) {\n  ts_assert(version < self->heads.size);\n  StackHead version_head = *array_get(&self->heads, version);\n  array_push(&self->heads, version_head);\n  StackHead *head = array_back(&self->heads);\n  stack_node_retain(head->node);\n  if (head->last_external_token.ptr) ts_subtree_retain(head->last_external_token);\n  if (head->lookahead_when_paused.ptr) ts_subtree_retain(head->lookahead_when_paused);\n  head->summary = NULL;\n  return self->heads.size - 1;\n}\n```","locations":[{"ref":"lib/src/stack.c:697-706","code":"  697 | StackVersion ts_stack_copy_version(Stack *self, StackVersion version) {\n  698 |   ts_assert(version < self->heads.size);\n  699 |   StackHead version_head = *array_get(&self->heads, version);\n  700 |   array_push(&self->heads, version_head);\n  701 |   StackHead *head = array_back(&self->heads);\n  702 |   stack_node_retain(head->node);\n  703 |   if (head->last_external_token.ptr) ts_subtree_retain(head->last_external_token);\n  704 |   head->summary = NULL;\n  705 |   return self->heads.size - 1;\n  706 | }","lines":10,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/lib/src/stack.c#L697-L706"},{"ref":"lib/src/stack.c:266-284","code":"  266 | static void stack_head_delete(\n  267 |   StackHead *self,\n  268 |   StackNodeArray *pool,\n  269 |   SubtreePool *subtree_pool\n  270 | ) {\n  271 |   if (self->node) {\n  272 |     if (self->last_external_token.ptr) {\n  273 |       ts_subtree_release(subtree_pool, self->last_external_token);\n  274 |     }\n  275 |     if (self->lookahead_when_paused.ptr) {\n  276 |       ts_subtree_release(subtree_pool, self->lookahead_when_paused);\n  277 |     }\n  278 |     if (self->summary) {\n  279 |       array_delete(self->summary);\n  280 |       ts_free(self->summary);\n  281 |     }\n  282 |     stack_node_release(self->node, pool, subtree_pool);\n  283 |   }\n  284 | }","lines":19,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/lib/src/stack.c#L266-L284"}]},
{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"very_easy","description":"`Parser.getIncludedRanges` (`lib/binding_web/src/parser.ts`) and `Tree.getIncludedRanges` (`lib/binding_web/src/tree.ts`) both call `C._ts_parser_included_ranges_wasm`/`C._ts_tree_included_ranges_wasm`, which on the C side always allocate a buffer via `ts_calloc(self->included_range_count, sizeof(TSRange))` (see `ts_tree_included_ranges` in `lib/src/tree.c`) even when `included_range_count` is `0` - `calloc(0, size)` returns a valid, unique, must-be-freed pointer on the allocator used by the Wasm build. Both JS methods only call `C._free(buffer)` inside the `if (count > 0)` branch, so whenever a parser/tree has no included ranges set (the common default case - parsing the whole document), the allocated buffer is never freed and leaks on every single call to `getIncludedRanges()`.","fix":"Free the buffer unconditionally after use instead of only inside the `count > 0` branch, e.g.:\n```ts\ngetIncludedRanges(): Range[] {\n  C._ts_parser_included_ranges_wasm(this[0]);\n  const count = C.getValue(TRANSFER_BUFFER, 'i32');\n  const buffer = C.getValue(TRANSFER_BUFFER + SIZE_OF_INT, 'i32');\n  const result = new Array<Range>(count);\n\n  let address = buffer;\n  for (let i = 0; i < count; i++) {\n    result[i] = unmarshalRange(address);\n    address += SIZE_OF_RANGE;\n  }\n  C._free(buffer);\n\n  return result;\n}\n```","locations":[{"ref":"lib/binding_web/src/parser.ts:274-291","code":"  274 |   /** Get the ranges of text that the parser will include when parsing. */\n  275 |   getIncludedRanges(): Range[] {\n  276 |     C._ts_parser_included_ranges_wasm(this[0]);\n  277 |     const count = C.getValue(TRANSFER_BUFFER, 'i32');\n  278 |     const buffer = C.getValue(TRANSFER_BUFFER + SIZE_OF_INT, 'i32');\n  279 |     const result = new Array<Range>(count);\n  280 | \n  281 |     if (count > 0) {\n  282 |       let address = buffer;\n  283 |       for (let i = 0; i < count; i++) {\n  284 |         result[i] = unmarshalRange(address);\n  285 |         address += SIZE_OF_RANGE;\n  286 |       }\n  287 |       C._free(buffer);\n  288 |     }\n  289 | \n  290 |     return result;\n  291 |   }","lines":18,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/lib/binding_web/src/parser.ts#L274-L291"},{"ref":"lib/binding_web/src/tree.ts:136-152","code":"  136 |   /** Get the included ranges that were used to parse the syntax tree. */\n  137 |   getIncludedRanges(): Range[] {\n  138 |     C._ts_tree_included_ranges_wasm(this[0]);\n  139 |     const count = C.getValue(TRANSFER_BUFFER, 'i32');\n  140 |     const buffer = C.getValue(TRANSFER_BUFFER + SIZE_OF_INT, 'i32');\n  141 |     const result = new Array<Range>(count);\n  142 | \n  143 |     if (count > 0) {\n  144 |       let address = buffer;\n  145 |       for (let i = 0; i < count; i++) {\n  146 |         result[i] = unmarshalRange(address);\n  147 |         address += SIZE_OF_RANGE;\n  148 |       }\n  149 |       C._free(buffer);\n  150 |     }\n  151 |     return result;\n  152 |   }","lines":17,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/lib/binding_web/src/tree.ts#L136-L152"}]},
{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"`ts_wasm_store_new` allocates `const_i32_type` (a `wasm_globaltype_t *`, via `wasm_globaltype_new`) and, inside the `*self = (TSWasmStore) {...}` initializer, `self->stdlib_fn_indices` (via `ts_calloc`). Both are stored on `self` at lines 855-867. Every failure that happens afterwards (e.g. the 'unexpected import in Wasm stdlib' error, the stdlib instantiate/trap errors, the 'missing malloc reset function' error, the 'missing exported symbol' error, or the table-grow failure) jumps to the shared `error:` label, which only does `ts_free(self)` - it never calls `wasm_globaltype_delete(self->const_i32_type)` nor `ts_free(self->stdlib_fn_indices)`. Both allocations are therefore leaked on any of these initialization-failure paths (reachable whenever the bundled WASM stdlib fails to instantiate, or wasmtime memory/table/global allocation fails, e.g. under memory pressure).","fix":"Free the two allocations in the `error:` label before `ts_free(self)`, guarding on non-NULL, e.g.:\n```c\nerror:\n  if (self->const_i32_type) wasm_globaltype_delete(self->const_i32_type);\n  ts_free(self->stdlib_fn_indices);\n  ts_free(self);\n  ...\n```\n(Since `self` was `ts_calloc`'d, these fields are NULL until the struct-literal assignment runs, so the guarded frees are safe even for earlier failure paths.)","locations":[{"ref":"lib/src/wasm_store.c:884-905","code":"  884 |   wasm_globaltype_t *const_i32_type = wasm_globaltype_new(wasm_valtype_new_i32(), WASM_CONST);\n  885 |   wasm_globaltype_t *var_i32_type = wasm_globaltype_new(wasm_valtype_new_i32(), WASM_VAR);\n  886 | \n  887 |   wasmtime_val_t stack_pointer_value = WASM_I32_VAL(0);\n  888 |   wasmtime_global_t stack_pointer_global;\n  889 |   error = wasmtime_global_new(context, var_i32_type, &stack_pointer_value, &stack_pointer_global);\n  890 |   wasm_globaltype_delete(var_i32_type);\n  891 |   ts_assert(!error);\n  892 | \n  893 |   *self = (TSWasmStore) {\n  894 |     .engine = wasmtime_engine_clone(engine),\n  895 |     .store = store,\n  896 |     .memory = memory,\n  897 |     .function_table = function_table,\n  898 |     .language_instances = array_new(),\n  899 |     .stdlib_fn_indices = ts_calloc(stdlib_symbols_len, sizeof(wasmtime_func_t)),\n  900 |     .builtin_fn_indices = builtin_fn_indices,\n  901 |     .stack_pointer_global = stack_pointer_global,\n  902 |     .current_memory_offset = 0,\n  903 |     .current_function_table_offset = 0,\n  904 |     .const_i32_type = const_i32_type,\n  905 |   };","lines":22,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/lib/src/wasm_store.c#L884-L905"},{"ref":"lib/src/wasm_store.c:1061-1075","code":" 1061 | error:\n 1062 |   ts_free(self);\n 1063 |   if (stdlib_module) wasmtime_module_delete(stdlib_module);\n 1064 |   if (store) wasmtime_store_delete(store);\n 1065 |   if (import_types.size) wasm_importtype_vec_delete(&import_types);\n 1066 |   if (memory_type) wasm_memorytype_delete(memory_type);\n 1067 |   if (table_type) wasm_tabletype_delete(table_type);\n 1068 |   if (trap) wasm_trap_delete(trap);\n 1069 |   if (error) wasmtime_error_delete(error);\n 1070 |   if (message.size) wasm_byte_vec_delete(&message);\n 1071 |   if (export_types.size) wasm_exporttype_vec_delete(&export_types);\n 1072 |   if (imports) ts_free(imports);\n 1073 |   ts_free(lexer_funcs);\n 1074 |   return NULL;\n 1075 | }","lines":15,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/lib/src/wasm_store.c#L1061-L1075"}]},
{"id":"MEM_3","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"In `ts_wasm_store__instantiate`, two `wasmtime`-owned vectors are leaked on specific error paths because their cleanup call sits only on the success continuation, not in the shared `error:` label. (1) `import_types` is populated at line 1117 and only deleted at line 1153 (right after `wasmtime_instance_new`); if the import-processing loop hits `goto error` for an empty import name (line 1124) or an unresolved import (line 1142-1148), `import_types` is never freed - the `error:` label at lines 1252-1258 has no `wasm_importtype_vec_delete(&import_types)` call. (2) `export_types` is populated at line 1182 and only deleted at line 1212 (after the export-processing loop finishes normally); if a module initializer/relocation function traps while iterating exports (line 1194-1203), `goto error` is taken before line 1212, leaking `export_types` too. Both leaks are reachable from the public `ts_wasm_store_load_language`/`ts_wasm_store_add_language` entry points whenever a scanner module has a bad import or a failing initializer, i.e. from ordinary malformed or malicious external-scanner WASM input, and repeated failures (e.g. in a loop trying to load many bad modules) would leak proportionally.","fix":"Delete both vectors in the shared `error:` label (guarded, since they may not be populated yet on very early failures):\n```c\nerror:\n  if (language_function_name) ts_free(language_function_name);\n  if (message.size) wasm_byte_vec_delete(&message);\n  if (error) wasmtime_error_delete(error);\n  if (trap) wasm_trap_delete(trap);\n  if (imports) ts_free(imports);\n  wasm_importtype_vec_delete(&import_types);\n  wasm_exporttype_vec_delete(&export_types);\n  return false;\n```\n(`WASM_EMPTY_VEC`-initialized vectors are safe to delete even if never populated; alternatively track a bool/size check like the other cleanups in this file.)","locations":[{"ref":"lib/src/wasm_store.c:1168-1205","code":" 1168 |   wasm_importtype_vec_t import_types = WASM_EMPTY_VEC;\n 1169 |   wasmtime_module_imports(module, &import_types);\n 1170 |   imports = ts_calloc(import_types.size, sizeof(wasmtime_extern_t));\n 1171 | \n 1172 |   for (unsigned i = 0; i < import_types.size; i++) {\n 1173 |     const wasm_importtype_t *import_type = import_types.data[i];\n 1174 |     const wasm_name_t *import_name = wasm_importtype_name(import_type);\n 1175 |     if (import_name->size == 0) {\n 1176 |       format(error_message, \"empty import name\");\n 1177 |       goto error;\n 1178 |     }\n 1179 | \n 1180 |     if (ts_wasm_store__provide_builtin_import(self, import_name, &imports[i])) {\n 1181 |       continue;\n 1182 |     }\n 1183 | \n 1184 |     bool defined_in_stdlib = false;\n 1185 |     for (unsigned j = 0; j < array_len(STDLIB_SYMBOLS); j++) {\n 1186 |       if (name_eq(import_name, STDLIB_SYMBOLS[j])) {\n 1187 |         imports[i] = (wasmtime_extern_t) {.kind = WASMTIME_EXTERN_FUNC, .of.func = self->stdlib_fn_indices[j]};\n 1188 |         defined_in_stdlib = true;\n 1189 |         break;\n 1190 |       }\n 1191 |     }\n 1192 | \n 1193 |     if (!defined_in_stdlib) {\n 1194 |       format(\n 1195 |         error_message,\n 1196 |         \"invalid import '%.*s'\\n\",\n 1197 |         (int)import_name->size, import_name->data\n 1198 |       );\n 1199 |       goto error;\n 1200 |     }\n 1201 |   }\n 1202 | \n 1203 |   wasmtime_instance_t instance;\n 1204 |   error = wasmtime_instance_new(context, module, imports, import_types.size, &instance, &trap);\n 1205 |   wasm_importtype_vec_delete(&import_types);","lines":38,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/lib/src/wasm_store.c#L1168-L1205"},{"ref":"lib/src/wasm_store.c:1233-1264","code":" 1233 |   wasm_exporttype_vec_t export_types = WASM_EMPTY_VEC;\n 1234 |   wasmtime_module_exports(module, &export_types);\n 1235 |   for (unsigned i = 0; i < export_types.size; i++) {\n 1236 |     wasm_exporttype_t *export_type = export_types.data[i];\n 1237 |     const wasm_name_t *name = wasm_exporttype_name(export_type);\n 1238 | \n 1239 |     size_t name_len;\n 1240 |     char *export_name;\n 1241 |     wasmtime_extern_t export = {.kind = WASM_EXTERN_GLOBAL};\n 1242 |     bool exists = wasmtime_instance_export_nth(context, &instance, i, &export_name, &name_len, &export);\n 1243 |     ts_assert(exists);\n 1244 | \n 1245 |     // If the module exports an initialization or data-relocation function, call it.\n 1246 |     if (ts_wasm_store__call_module_initializer(self, name, &export, &trap)) {\n 1247 |       if (trap) {\n 1248 |         wasm_trap_message(trap, &message);\n 1249 |         format(\n 1250 |           error_message,\n 1251 |           \"trap when calling data relocation function: %.*s\\n\",\n 1252 |           (int)message.size, message.data\n 1253 |         );\n 1254 |         goto error;\n 1255 |       }\n 1256 |     }\n 1257 | \n 1258 |     // Find the main language function for the module.\n 1259 |     else if (name_eq(name, language_function_name)) {\n 1260 |       language_extern = export;\n 1261 |       found_language = true;\n 1262 |     }\n 1263 |   }\n 1264 |   wasm_exporttype_vec_delete(&export_types);","lines":32,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/lib/src/wasm_store.c#L1233-L1264"}]},
{"id":"MEM_4","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"In `Parser.parse` (`lib/binding_web/src/parser.ts`), when `options.includedRanges` is an explicit empty array (`[]`, which is truthy), `rangeCount` is set to `0` and `rangeAddress = C._calloc(rangeCount, SIZE_OF_RANGE)` still allocates a heap buffer (calloc with a 0 count still returns a valid pointer that must be freed). This `rangeAddress` is passed to `C._ts_parser_parse_wasm`, whose C implementation (`ts_parser_parse_wasm` in `lib/binding_web/lib/tree-sitter.c`) only calls `free(ranges)` inside the `if (range_count)` branch; when `range_count` is `0` it takes the `else` branch (`ts_parser_set_included_ranges(self, NULL, 0)`) and never frees the buffer that was allocated on the JS side. Every call to `parse(text, oldTree, { includedRanges: [] })` therefore leaks a small Wasm heap allocation.","fix":"Only allocate `rangeAddress` when there is at least one range to marshal, e.g.:\n```ts\nlet rangeCount = 0;\nlet rangeAddress = 0;\nif (options?.includedRanges && options.includedRanges.length > 0) {\n  rangeCount = options.includedRanges.length;\n  rangeAddress = C._calloc(rangeCount, SIZE_OF_RANGE);\n  ...\n}\n```","locations":[{"ref":"lib/binding_web/src/parser.ts:223-233","code":"  223 |     let rangeCount = 0;\n  224 |     let rangeAddress = 0;\n  225 |     if (options?.includedRanges) {\n  226 |       rangeCount = options.includedRanges.length;\n  227 |       rangeAddress = C._calloc(rangeCount, SIZE_OF_RANGE);\n  228 |       let address = rangeAddress;\n  229 |       for (let i = 0; i < rangeCount; i++) {\n  230 |         marshalRange(address, options.includedRanges[i]);\n  231 |         address += SIZE_OF_RANGE;\n  232 |       }\n  233 |     }","lines":11,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/lib/binding_web/src/parser.ts#L223-L233"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"critical","difficulty":"easy","description":"In `vsnprintf_impl`'s `%s` handler, `precision` is parsed directly from the format string with no upper bound (see `parse_format_spec`), and is then used as the length argument to `strncpy(temp_buf, str, precision)` followed by `temp_buf[precision] = '\\0';`, where `temp_buf` is a fixed 64-byte stack array (`char temp_buf[64];`). Any format string such as `\"%.100s\"` combined with a source string at least that long overflows `temp_buf` by writing past its 64-byte bound, corrupting adjacent stack memory inside the compiled external-scanner wasm module. This libc shim is linked into every user-supplied external scanner compiled to wasm, so any grammar author's scanner code that calls `snprintf`/`vsnprintf` with an over-long precision specifier triggers a real stack buffer overflow.","fix":"Clamp `precision` (and the resulting write index) to `sizeof(temp_buf) - 1` before calling `strncpy`/writing the terminator, e.g.:\n```c\nint copy_len = precision;\nif (copy_len > (int)sizeof(temp_buf) - 1) copy_len = sizeof(temp_buf) - 1;\nstrncpy(temp_buf, str, copy_len);\ntemp_buf[copy_len] = '\\0';\n```","locations":[{"ref":"lib/src/wasm-stdlib/stdio.c:169-186","code":"  169 |       char temp_buf[64];\n  170 |       const char *output_str = temp_buf;\n  171 | \n  172 |       switch (*p) {\n  173 |         case 's': {\n  174 |           const char *str = va_arg(args, const char*);\n  175 |           if (!str) str = \"(null)\";\n  176 | \n  177 |           int str_len = strlen(str);\n  178 |           if (precision >= 0 && str_len > precision) {\n  179 |             strncpy(temp_buf, str, precision);\n  180 |             temp_buf[precision] = '\\0';\n  181 |             output_str = temp_buf;\n  182 |           } else {\n  183 |             output_str = str;\n  184 |           }\n  185 |           break;\n  186 |         }","lines":18,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/lib/src/wasm-stdlib/stdio.c#L169-L186"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"critical","difficulty":"medium","description":"When constructing the native `TSLanguage` from a compiled WASM language module, several buffer sizes for `copy()`/`copy_strings()` are computed by multiplying or adding two independent `uint32_t` fields (`large_state_count`, `symbol_count`, `alias_count`) that are read verbatim out of untrusted WASM linear memory (the `LanguageInWasmMemory` struct, `wasm_language`), *before* the result is widened by `sizeof(...)`. Because both operands are `uint32_t`, the sub-expression `wasm_language.large_state_count * wasm_language.symbol_count` (and likewise `wasm_language.symbol_count + wasm_language.alias_count`) is evaluated in 32-bit unsigned arithmetic and silently wraps around on overflow, only afterwards being multiplied by the (64-bit) `sizeof(...)`. A malicious language module can pick `large_state_count`/`symbol_count`/`alias_count` such that the true product/sum is huge but wraps to a tiny value; `copy()`/`copy_strings()` will then allocate and fill an undersized host buffer for `parse_table`, `symbol_metadata`, `public_symbol_map`, or `symbol_names`, while the rest of the `TSLanguage` (using the real, non-wrapped `symbol_count`/`state_count` fields) will later index into that undersized buffer during ordinary parsing, causing a host heap out-of-bounds read.","fix":"Promote to `size_t`/`uint64_t` before multiplying/adding, and reject sizes that don't fit, e.g.:\n```c\nsize_t parse_table_size = (size_t)wasm_language.large_state_count * (size_t)wasm_language.symbol_count * sizeof(uint16_t);\n...\nsize_t symbol_total = (size_t)wasm_language.symbol_count + (size_t)wasm_language.alias_count;\n```\nand pass `parse_table_size`/`symbol_total * sizeof(...)` to `copy()`/`copy_strings()` instead of the raw 32-bit expressions.","locations":[{"ref":"lib/src/wasm_store.c:1457-1462","code":" 1457 |     .parse_table = copy(\n 1458 |       &wasm_memory,\n 1459 |       wasm_language.parse_table,\n 1460 |       wasm_language.large_state_count * wasm_language.symbol_count * sizeof(uint16_t),\n 1461 |       &valid_wasm_memory\n 1462 |     ),","lines":6,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/lib/src/wasm_store.c#L1457-L1462"},{"ref":"lib/src/wasm_store.c:1470-1476","code":" 1470 |     .symbol_names = copy_strings(\n 1471 |       &wasm_memory,\n 1472 |       wasm_language.symbol_names,\n 1473 |       wasm_language.symbol_count + wasm_language.alias_count,\n 1474 |       &symbol_name_buffer,\n 1475 |       &valid_wasm_memory\n 1476 |     ),","lines":7,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/lib/src/wasm_store.c#L1470-L1476"},{"ref":"lib/src/wasm_store.c:1477-1482","code":" 1477 |     .symbol_metadata = copy(\n 1478 |       &wasm_memory,\n 1479 |       wasm_language.symbol_metadata,\n 1480 |       (wasm_language.symbol_count + wasm_language.alias_count) * sizeof(TSSymbolMetadata),\n 1481 |       &valid_wasm_memory\n 1482 |     ),","lines":6,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/lib/src/wasm_store.c#L1477-L1482"},{"ref":"lib/src/wasm_store.c:1483-1488","code":" 1483 |     .public_symbol_map = copy(\n 1484 |       &wasm_memory,\n 1485 |       wasm_language.public_symbol_map,\n 1486 |       (wasm_language.symbol_count + wasm_language.alias_count) * sizeof(TSSymbol),\n 1487 |       &valid_wasm_memory\n 1488 |     ),","lines":6,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/lib/src/wasm_store.c#L1483-L1488"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"very_easy","description":"In `ts_tree_cursor_child_iterator_previous`, the \"no more children\" sentinel check truncates `self->child_index` (a `uint32_t`) down to 8 bits before comparing it to `-1`: `(int8_t)self->child_index == -1`. This is meant to detect the underflow that happens after stepping past child index `0` (where `self->child_index` wraps to `UINT32_MAX`), but the cast only inspects the low byte. Any legitimate, non-underflowed index that is congruent to `255` mod `256` (i.e. `255`, `511`, `767`, ...) also satisfies `(int8_t)x == -1`, since `(int8_t)255 == -1`. Any node with 256 or more children (a long statement list, a large array/object literal, etc.) will therefore have its backward sibling iteration stop prematurely at those indices, silently skipping the remaining earlier siblings. This is reachable directly from the public `ts_tree_cursor_goto_previous_sibling` API.","fix":"Compare the full 32-bit value instead of truncating to `int8_t`:\n```c\n// before\nif (!self->parent.ptr || (int8_t)self->child_index == -1) return false;\n\n// after\nif (!self->parent.ptr || self->child_index == UINT32_MAX) return false;\n```","locations":[{"ref":"lib/src/tree_cursor.c:127","code":"  127 |   if (!self->parent.ptr || (int8_t)self->child_index == -1) return false;","lines":1,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/lib/src/tree_cursor.c#L127"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"In `ts_wasm_store__instantiate`, `needed_memory_size` is computed as `ts_wasm_store__heap_address(self) + dylink_info->memory_size`, both `uint32_t`. `dylink_info->memory_size` comes straight from the attacker-controlled `dylink.0` custom section of the WASM module being loaded (via `wasm_dylink_info__parse`) and is never validated against any sane upper bound. If `memory_size` is close to `UINT32_MAX`, the addition wraps around to a small value, so the `needed_memory_size > current_memory_size` check below can spuriously evaluate false and skip growing the WASM linear memory - even though `self->current_memory_offset` is unconditionally advanced by the full (unwrapped) `dylink_info->memory_size` a few lines later (`self->current_memory_offset += dylink_info->memory_size;`). This desynchronizes the store's bookkeeping of 'where the next module's memory region starts' from the actual size of the underlying WASM linear memory, so a subsequently loaded/instantiated module can be placed at an address range that was never actually grown into, corrupting the sandboxed heap layout (one module's statics can overlap another's, or a module's linked address range can fall outside the real backing buffer).","fix":"Do the size arithmetic in a 64-bit type and reject implausible sizes before using them, e.g.:\n```c\nuint64_t needed_memory_size = (uint64_t)ts_wasm_store__heap_address(self) + dylink_info->memory_size;\nif (needed_memory_size > (uint64_t)MAX_MEMORY_SIZE * MEMORY_PAGE_SIZE) {\n  format(error_message, \"invalid memory size %u\", dylink_info->memory_size);\n  goto error;\n}\n```\nand use the checked 64-bit value for the subsequent `pages_to_grow` computation.","locations":[{"ref":"lib/src/wasm_store.c:1149-1162","code":" 1149 |   // Grow the memory to make room for the new data.\n 1150 |   uint32_t needed_memory_size = ts_wasm_store__heap_address(self) + dylink_info->memory_size;\n 1151 |   uint32_t current_memory_size = wasmtime_memory_data_size(context, &self->memory);\n 1152 |   if (needed_memory_size > current_memory_size) {\n 1153 |     uint32_t pages_to_grow = (\n 1154 |       needed_memory_size - current_memory_size + MEMORY_PAGE_SIZE - 1) /\n 1155 |       MEMORY_PAGE_SIZE;\n 1156 |     uint64_t prev_memory_size;\n 1157 |     error = wasmtime_memory_grow(context, &self->memory, pages_to_grow, &prev_memory_size);\n 1158 |     if (error) {\n 1159 |       format(error_message, \"invalid memory size %u\", dylink_info->memory_size);\n 1160 |       goto error;\n 1161 |     }\n 1162 |   }","lines":14,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/lib/src/wasm_store.c#L1149-L1162"},{"ref":"lib/src/wasm_store.c:1227-1228","code":" 1227 |   self->current_memory_offset += dylink_info->memory_size;\n 1228 |   self->current_function_table_offset += dylink_info->table_size;","lines":2,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/lib/src/wasm_store.c#L1227-L1228"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"`reserved_word_count` is computed as `(max_reserved_word_set_id + 1) * language->max_reserved_word_set_size`. Both `max_reserved_word_set_id` and `max_reserved_word_set_size` are `uint16_t`, which C promotes to plain `int` for the multiplication; their product can reach roughly `65536 * 65535 ≈ 4.29e9`, which exceeds `INT_MAX` (about 2.15e9). This is a signed integer overflow, which is undefined behavior in C (not merely a wraparound), triggered by attacker-controlled fields (`max_reserved_word_set_id` is derived from `lex_modes`/`reserved_word_set_id` values copied straight out of the WASM module, and `max_reserved_word_set_size` is read directly from the language struct in WASM memory). The resulting `reserved_word_count` then feeds directly into the size passed to `copy()` for `language->reserved_words`, so the UB can also manifest as an undersized allocation that is later indexed using the real (non-overflowed) `max_reserved_word_set_id`/`max_reserved_word_set_size`.","fix":"Compute the product in an unsigned 32-bit (or wider) type to avoid signed overflow, e.g.:\n```c\nuint32_t reserved_word_count =\n  ((uint32_t)max_reserved_word_set_id + 1) * (uint32_t)language->max_reserved_word_set_size;\n```\nand consider also checking this against a sane upper bound before calling `copy()`.","locations":[{"ref":"lib/src/wasm_store.c:1646-1654","code":" 1646 |     if (max_reserved_word_set_id > 0 && language->max_reserved_word_set_size > 0) {\n 1647 |       uint32_t reserved_word_count =\n 1648 |         (max_reserved_word_set_id + 1) * language->max_reserved_word_set_size;\n 1649 |       language->reserved_words = copy(\n 1650 |           &wasm_memory,\n 1651 |           wasm_language.reserved_words,\n 1652 |           reserved_word_count * sizeof(TSSymbol),\n 1653 |           &valid_wasm_memory\n 1654 |       );","lines":9,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/lib/src/wasm_store.c#L1646-L1654"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In `ts_query_matches_wasm`, the code explicitly special-cases a `match_limit` of `0` to mean \"unlimited\" by translating it to `UINT32_MAX` via `ts_query_cursor_set_match_limit(scratch_query_cursor, UINT32_MAX)`. A few lines later, however, `ts_query_cursor_set_match_limit(scratch_query_cursor, match_limit)` is called again with the original, untranslated `match_limit` value, silently overwriting the special-case result. Since `ts_query_cursor_set_match_limit` sets `capture_list_pool.max_capture_list_count = limit` directly (see `lib/src/query.c`), passing the raw `0` back in means the cursor ends up with `max_capture_list_count == 0`, so `ts_query_cursor_next_match` can never produce a match. Any web-binding caller who passes `matchLimit: 0` intending \"no limit\" instead silently gets zero query matches back, with no error indication.","fix":"Remove the redundant second call (or guard it the same way as the first), e.g.:\n```c\n  ts_query_cursor_set_containing_byte_range(\n    scratch_query_cursor,\n    start_containing_index,\n    end_containing_index\n  );\n  ts_query_cursor_set_max_start_depth(scratch_query_cursor, max_start_depth);\n```\n(i.e. delete the line `ts_query_cursor_set_match_limit(scratch_query_cursor, match_limit);` that immediately precedes `ts_query_cursor_set_max_start_depth`).","locations":[{"ref":"lib/binding_web/lib/tree-sitter.c:886-913","code":"  886 |   if (!scratch_query_cursor) {\n  887 |     scratch_query_cursor = ts_query_cursor_new();\n  888 |   }\n  889 |   if (match_limit == 0) {\n  890 |     ts_query_cursor_set_match_limit(scratch_query_cursor, UINT32_MAX);\n  891 |   } else {\n  892 |     ts_query_cursor_set_match_limit(scratch_query_cursor, match_limit);\n  893 |   }\n  894 | \n  895 |   TSNode node = unmarshal_node(tree);\n  896 |   TSPoint start_point = {start_row, code_unit_to_byte(start_column)};\n  897 |   TSPoint end_point = {end_row, code_unit_to_byte(end_column)};\n  898 |   TSPoint start_containing_point = {start_containing_row, code_unit_to_byte(start_containing_column)};\n  899 |   TSPoint end_containing_point = {end_containing_row, code_unit_to_byte(end_containing_column)};\n  900 |   ts_query_cursor_set_point_range(scratch_query_cursor, start_point, end_point);\n  901 |   ts_query_cursor_set_byte_range(scratch_query_cursor, start_index, end_index);\n  902 |   ts_query_cursor_set_containing_point_range(\n  903 |     scratch_query_cursor,\n  904 |     start_containing_point,\n  905 |     end_containing_point\n  906 |   );\n  907 |   ts_query_cursor_set_containing_byte_range(\n  908 |     scratch_query_cursor,\n  909 |     start_containing_index,\n  910 |     end_containing_index\n  911 |   );\n  912 |   ts_query_cursor_set_match_limit(scratch_query_cursor, match_limit);\n  913 |   ts_query_cursor_set_max_start_depth(scratch_query_cursor, max_start_depth);","lines":28,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/lib/binding_web/lib/tree-sitter.c#L886-L913"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`ts_tree_cursor_child_iterator_next` (used when walking forward) populates the produced `TreeCursorEntry.descendant_index` from `self->descendant_index` and then advances `self->descendant_index` by the visited child's contribution (`ts_subtree_visible_descendant_count` plus 1 if visible), so callers always get a correct running descendant index. `ts_tree_cursor_child_iterator_previous` (used when walking backward, i.e. by `ts_tree_cursor_goto_previous_sibling`) never does either of these things: its designated initializer for `result` at lines 129-134 omits the `.descendant_index` field entirely (so it is always zero-initialized), and `self->descendant_index` is never adjusted anywhere in the function. As a result, every `TreeCursorEntry` pushed onto the cursor stack via `goto_previous_sibling` carries a `descendant_index` of `0` instead of its real value. This corrupts `ts_tree_cursor_current_descendant_index` immediately after calling `goto_previous_sibling`, and also corrupts `ts_tree_cursor_iterate_children`/`ts_tree_cursor_goto_descendant`, since both read `last_entry->descendant_index` from the top-of-stack entry to seed further traversal. There is no test coverage for `descendant_index` in the test suite, which is presumably why this has gone unnoticed.","fix":"Mirror the forward iterator's bookkeeping in reverse: before recording `result`, subtract the about-to-be-visited (previous) child's own contribution from the running `self->descendant_index`, then store that value both in `result.descendant_index` and back into `self->descendant_index` so subsequent `_previous` calls continue to be correct, e.g.:\n```c\nconst Subtree *child = &ts_subtree_children(self->parent)[self->child_index];\nbool is_visible = ts_subtree_visible(*child);\nbool extra = ts_subtree_extra(*child);\nbool alias_visible = !extra && self->alias_sequence && self->alias_sequence[self->structural_child_index];\nuint32_t contribution = ts_subtree_visible_descendant_count(*child) + ((is_visible || alias_visible) ? 1 : 0);\nself->descendant_index -= contribution;\n*result = (TreeCursorEntry) {\n  .subtree = child,\n  .position = self->position,\n  .child_index = self->child_index,\n  .structural_child_index = self->structural_child_index,\n  .descendant_index = self->descendant_index,\n};\n```","locations":[{"ref":"lib/src/tree_cursor.c:120-156","code":"  120 | static inline bool ts_tree_cursor_child_iterator_previous(\n  121 |   CursorChildIterator *self,\n  122 |   TreeCursorEntry *result,\n  123 |   bool *visible\n  124 | ) {\n  125 |   // this is mostly a reverse `ts_tree_cursor_child_iterator_next` taking into\n  126 |   // account unsigned underflow\n  127 |   if (!self->parent.ptr || (int8_t)self->child_index == -1) return false;\n  128 |   const Subtree *child = &ts_subtree_children(self->parent)[self->child_index];\n  129 |   *result = (TreeCursorEntry) {\n  130 |     .subtree = child,\n  131 |     .position = self->position,\n  132 |     .child_index = self->child_index,\n  133 |     .structural_child_index = self->structural_child_index,\n  134 |   };\n  135 |   *visible = ts_subtree_visible(*child);\n  136 |   bool extra = ts_subtree_extra(*child);\n  137 | \n  138 |   self->position = length_backtrack(self->position, ts_subtree_padding(*child));\n  139 |   self->child_index--;\n  140 | \n  141 |   if (!extra && self->alias_sequence) {\n  142 |     *visible |= self->alias_sequence[self->structural_child_index];\n  143 |     if (self->structural_child_index > 0) {\n  144 |       self->structural_child_index--;\n  145 |     }\n  146 |   }\n  147 | \n  148 |   // unsigned can underflow so compare it to child_count\n  149 |   if (self->child_index < self->parent.ptr->child_count) {\n  150 |     Subtree previous_child = ts_subtree_children(self->parent)[self->child_index];\n  151 |     Length size = ts_subtree_size(previous_child);\n  152 |     self->position = length_backtrack(self->position, size);\n  153 |   }\n  154 | \n  155 |   return true;\n  156 | }","lines":37,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/lib/src/tree_cursor.c#L120-L156"},{"ref":"lib/src/tree_cursor.c:65-102","code":"   65 | static inline bool ts_tree_cursor_child_iterator_next(\n   66 |   CursorChildIterator *self,\n   67 |   TreeCursorEntry *result,\n   68 |   bool *visible\n   69 | ) {\n   70 |   if (!self->parent.ptr || self->child_index == self->parent.ptr->child_count) return false;\n   71 |   const Subtree *child = &ts_subtree_children(self->parent)[self->child_index];\n   72 |   *result = (TreeCursorEntry) {\n   73 |     .subtree = child,\n   74 |     .position = self->position,\n   75 |     .child_index = self->child_index,\n   76 |     .structural_child_index = self->structural_child_index,\n   77 |     .descendant_index = self->descendant_index,\n   78 |   };\n   79 |   *visible = ts_subtree_visible(*child);\n   80 |   bool extra = ts_subtree_extra(*child);\n   81 |   if (!extra) {\n   82 |     if (self->alias_sequence) {\n   83 |       *visible |= self->alias_sequence[self->structural_child_index];\n   84 |     }\n   85 |     self->structural_child_index++;\n   86 |   }\n   87 | \n   88 |   self->descendant_index += ts_subtree_visible_descendant_count(*child);\n   89 |   if (*visible) {\n   90 |     self->descendant_index += 1;\n   91 |   }\n   92 | \n   93 |   self->position = length_add(self->position, ts_subtree_size(*child));\n   94 |   self->child_index++;\n   95 | \n   96 |   if (self->child_index < self->parent.ptr->child_count) {\n   97 |     Subtree next_child = ts_subtree_children(self->parent)[self->child_index];\n   98 |     self->position = length_add(self->position, ts_subtree_padding(next_child));\n   99 |   }\n  100 | \n  101 |   return true;\n  102 | }","lines":38,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/lib/src/tree_cursor.c#L65-L102"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In `vsnprintf_impl`'s main loop, when the format string ends in a lone trailing `%` (e.g. `\"abc%\"`), `p` is advanced past the `%` to the string's NUL terminator (`p++` at the top of the `if (*p == '%')` branch), none of the `switch (*p)` cases match `'\\0'` so the `default:` branch runs, and then execution falls through to the unconditional `p++;` at the bottom of the `while (*p)` loop. This advances `p` one byte past the NUL terminator, and the outer `while (*p)` then reads memory beyond the format string's buffer -- an out-of-bounds read that continues scanning arbitrary adjacent memory as if it were more format-string bytes until it happens to hit a zero byte.","fix":"Break out of the loop (or return) when `*p == '\\0'` is reached right after consuming the `%`, before falling into the common `p++` at the bottom of the loop, e.g. check `if (*p == '\\0') break;` immediately after `p = parse_format_spec(...)` and before the `switch`.","locations":[{"ref":"lib/src/wasm-stdlib/stdio.c:155-250","code":"  155 |   while (*p) {\n  156 |     if (*p == '%') {\n  157 |       p++;\n  158 |       if (*p == '%') {\n  159 |         if (pos < buffsz - 1) buffer[pos++] = '%';\n  160 |         total_chars++;\n  161 |         p++;\n  162 |         continue;\n  163 |       }\n  164 | \n  165 |       int width, precision;\n  166 |       format_flags_t flags;\n  167 |       p = parse_format_spec(p, &width, &precision, &flags);\n  168 | \n  169 |       char temp_buf[64];\n  170 |       const char *output_str = temp_buf;\n  171 | \n  172 |       switch (*p) {\n  173 |         case 's': {\n  174 |           const char *str = va_arg(args, const char*);\n  175 |           if (!str) str = \"(null)\";\n  176 | \n  177 |           int str_len = strlen(str);\n  178 |           if (precision >= 0 && str_len > precision) {\n  179 |             strncpy(temp_buf, str, precision);\n  180 |             temp_buf[precision] = '\\0';\n  181 |             output_str = temp_buf;\n  182 |           } else {\n  183 |             output_str = str;\n  184 |           }\n  185 |           break;\n  186 |         }\n  187 |         case 'd':\n  188 |         case 'i': {\n  189 |           int value = va_arg(args, int);\n  190 |           int_to_str(value, temp_buf, 10, true, false);\n  191 |           break;\n  192 |         }\n  193 |         case 'u': {\n  194 |           unsigned int value = va_arg(args, unsigned int);\n  195 |           int_to_str(value, temp_buf, 10, false, false);\n  196 |           break;\n  197 |         }\n  198 |         case 'x': {\n  199 |           unsigned int value = va_arg(args, unsigned int);\n  200 |           int_to_str(value, temp_buf, 16, false, false);\n  201 |           break;\n  202 |         }\n  203 |         case 'X': {\n  204 |           unsigned int value = va_arg(args, unsigned int);\n  205 |           int_to_str(value, temp_buf, 16, false, true);\n  206 |           break;\n  207 |         }\n  208 |         case 'p': {\n  209 |           void *ptr = va_arg(args, void*);\n  210 |           ptr_to_str(ptr, temp_buf);\n  211 |           break;\n  212 |         }\n  213 |         case 'c': {\n  214 |           int c = va_arg(args, int);\n  215 |           temp_buf[0] = (char)c;\n  216 |           temp_buf[1] = '\\0';\n  217 |           break;\n  218 |         }\n  219 |         case 'z': {\n  220 |           if (*(p + 1) == 'u') {\n  221 |             size_t value = va_arg(args, size_t);\n  222 |             int_to_str(value, temp_buf, 10, false, false);\n  223 |             p++;\n  224 |           } else {\n  225 |             temp_buf[0] = 'z';\n  226 |             temp_buf[1] = '\\0';\n  227 |           }\n  228 |           break;\n  229 |         }\n  230 |         default:\n  231 |           temp_buf[0] = '%';\n  232 |           temp_buf[1] = *p;\n  233 |           temp_buf[2] = '\\0';\n  234 |           break;\n  235 |       }\n  236 | \n  237 |       int str_len = strlen(output_str);\n  238 |       int formatted_len = (width > str_len) ? width : str_len;\n  239 |       total_chars += formatted_len;\n  240 | \n  241 |       if (pos < buffsz - 1) {\n  242 |         write_formatted_to_buffer(buffer, buffsz, &pos, output_str, width, &flags);\n  243 |       }\n  244 | \n  245 |     } else {\n  246 |       if (pos < buffsz - 1) buffer[pos++] = *p;\n  247 |       total_chars++;\n  248 |     }\n  249 |     p++;\n  250 |   }","lines":96,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/lib/src/wasm-stdlib/stdio.c#L155-L250"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`update_gitignore` in `init.rs` reads `.gitignore`, mutates the local `contents` variable to append the Zig-related entries, logs `\"Adding zig entries to .gitignore\"`, and returns `Ok(())` — but it never calls `write_file` to persist the change. The bug is even flagged by a comment directly above the function (`// NOTE: this modifies contents but never calls write_file (pre-existing bug)`), yet it has never been fixed. This means `tree-sitter init --update` claims to update `.gitignore` but silently leaves the file unchanged.","fix":"Add a `write_file(path, contents)?;` call before returning, mirroring the sibling function `update_gitattributes` immediately below it:\n```rust\nfn update_gitignore(path: &Path) -> Result<()> {\n    let mut contents = fs::read_to_string(path)?;\n    if !contents.contains(\"Zig artifacts\") {\n        info!(\"Adding zig entries to .gitignore\");\n        contents.push('\\n');\n        contents.push_str(indoc! {\"\n        # Zig artifacts\n        .zig-cache/\n        zig-cache/\n        zig-out/\n        \"});\n        write_file(path, contents)?;\n    }\n    Ok(())\n}\n```","locations":[{"ref":"crates/cli/src/init.rs:879-893","code":"  879 | fn update_gitignore(path: &Path) -> Result<()> {\n  880 |     // NOTE: this modifies `contents` but never calls `write_file` (pre-existing bug)\n  881 |     let mut contents = fs::read_to_string(path)?;\n  882 |     if !contents.contains(\"Zig artifacts\") {\n  883 |         info!(\"Adding zig entries to .gitignore\");\n  884 |         contents.push('\\n');\n  885 |         contents.push_str(indoc! {\"\n  886 |         # Zig artifacts\n  887 |         .zig-cache/\n  888 |         zig-cache/\n  889 |         zig-out/\n  890 |         \"});\n  891 |     }\n  892 |     Ok(())\n  893 | }","lines":15,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/crates/cli/src/init.rs#L879-L893"}]},
