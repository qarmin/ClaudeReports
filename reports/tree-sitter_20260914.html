{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`get_input` in `input.rs` implements a `!path` negation feature (a path prefixed with `!` should remove a previously-added path from the result set), but it tests for the prefix with `path.starts_with(\"!\")` and strips it with `path.strip_prefix(\"!\").unwrap()`. `Path::starts_with`/`Path::strip_prefix` compare whole path *components*, not raw string prefixes, so for any realistic input like `!foo.js` (a single path component `\"!foo.js\"`) the check is always `false` — it only matches if `!` is its own path component (e.g. `!/foo.js`, which nobody would type). As a result, the exclusion feature is a complete no-op for real usage: the leading `!` is left in the path, `positive` stays `true`, and the literal (non-existent) file `!foo.js` is looked up instead of excluding `foo.js`. Verified empirically: `PathBuf::from(\"!foo.js\").starts_with(\"!\")` returns `false`.","fix":"Compare the string representation instead of the `Path` component representation, e.g.:\n```rust\nfor mut path in paths {\n    let mut positive = true;\n    if let Some(s) = path.to_str() && let Some(rest) = s.strip_prefix('!') {\n        positive = false;\n        path = PathBuf::from(rest);\n    }\n    ...\n}\n```","locations":[{"ref":"crates/cli/src/input.rs:80-98","code":"   80 |         for mut path in paths {\n   81 |             let mut positive = true;\n   82 |             if path.starts_with(\"!\") {\n   83 |                 positive = false;\n   84 |                 path = path.strip_prefix(\"!\").unwrap().to_path_buf();\n   85 |             }\n   86 | \n   87 |             if path.exists() {\n   88 |                 incorporate_path(path, positive);\n   89 |             } else {\n   90 |                 let Some(path_str) = path.to_str() else {\n   91 |                     bail!(\"Invalid path: {}\", path.display());\n   92 |                 };\n   93 |                 let paths = glob(path_str)\n   94 |                     .with_context(|| format!(\"Invalid glob pattern {}\", path.display()))?;\n   95 |                 for path in paths {\n   96 |                     incorporate_path(path?, positive);\n   97 |                 }\n   98 |             }","lines":19,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/crates/cli/src/input.rs#L80-L98"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`BitVec::resize` in `bitvec.rs` fails to set newly-added bits to `1` when the growth stays within the current last word. The function only fills bits when `new_words > old_words` (i.e. a brand-new word is allocated); when `new_len` grows past `num_bits` but the bit index still falls in the same 64-bit word (e.g. growing from 5 bits to 10 bits, both `div_ceil(64) == 1`), the `if new_words > old_words` branch at `bitvec.rs:199` is skipped entirely, so the bits between the old and new length are left at their previous value (`0`) instead of being set to `1` as `resize(new_len, true)` promises. This silently produces a `BitVec`/`TokenSet` whose contents do not match what the caller asked for. The bug is currently latent because the only call site in the crate (`rules.rs:401`, inside `TokenSet::insert`) always passes `val = false`, but `resize` is a `pub` method on a data structure that is otherwise treated as a general-purpose bitset, so any new caller (or future refactor) that resizes-and-fills with `true` will silently get wrong bits.","fix":"Handle the \"grow within the same word\" case explicitly instead of only handling the \"grow into new words\" case. For example:\n```rust\npub fn resize(&mut self, new_len: usize, val: bool) {\n    let old_len = self.num_bits as usize;\n    let new_words = new_len.div_ceil(64);\n    let old_words = self.words_in_use();\n    self.ensure_words(new_words);\n    let words = self.as_full_slice_mut();\n    if new_len > old_len {\n        if val {\n            // Set every bit in [old_len, new_len), which may all live in the\n            // same word as old_len (no new word allocated).\n            for i in old_len..new_len {\n                words[i / 64] |= 1u64 << (i % 64);\n            }\n        }\n        // When val == false the newly-covered bits are already zero, either\n        // because they were untouched or because the arena pre-zeroes memory.\n    } else if new_words < old_words {\n        words[new_words..old_words].fill(0);\n    }\n    self.num_bits = new_len as u32;\n}\n```\nThis keeps the invariant that bits `>= num_bits` are always zero while correctly filling bits that stay within the current last word.","locations":[{"ref":"crates/generate/src/bitvec.rs:193-213","code":"  193 |     pub fn resize(&mut self, new_len: usize, val: bool) {\n  194 |         let new_words = new_len.div_ceil(64);\n  195 |         let old_words = self.words_in_use();\n  196 |         self.ensure_words(new_words);\n  197 |         let fill = if val { !0u64 } else { 0u64 };\n  198 |         let words = self.as_full_slice_mut();\n  199 |         if new_words > old_words {\n  200 |             words[old_words..new_words].fill(fill);\n  201 |             // When setting bits to true, clear any bits in the last word that\n  202 |             // fall beyond new_len to preserve the invariant that bits >= num_bits\n  203 |             // are always zero.\n  204 |             if val && !new_len.is_multiple_of(64) {\n  205 |                 let mask = (1u64 << (new_len % 64)) - 1;\n  206 |                 words[new_words - 1] &= mask;\n  207 |             }\n  208 |         } else if new_words < old_words {\n  209 |             // Zero out truncated words so stale data is never visible.\n  210 |             words[new_words..old_words].fill(0);\n  211 |         }\n  212 |         self.num_bits = new_len as u32;\n  213 |     }","lines":21,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/crates/generate/src/bitvec.rs#L193-L213"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`resolve_module_path` in `quickjs.rs` implements `require()` resolution for the native QuickJS grammar runtime. For a bare (non-relative) `module_path`, it builds a `node_modules_target` as `Path::new(\"node_modules\").join(module_path)` - this is a path relative to the process's *current working directory*, not to `base_path` (the directory of the module that issued the `require()` call), and there is no walking up parent directories the way Node.js's module resolution algorithm does (checking `<dir>/node_modules`, then `<parent>/node_modules`, etc. up to the filesystem root). As a result, a grammar file that lives in a different directory than the process's CWD (e.g. `tree-sitter generate` invoked from a monorepo root, or a module nested a few directories below the grammar root doing `require('some-package')`) will fail to resolve dependencies that Node/Bun/Deno (the other supported `js_runtime` backends, which use real module resolution) would resolve correctly. This makes the `native` QuickJS runtime silently behave differently from the other supported runtimes for the same grammar sources.","fix":"When resolving a bare specifier, search for `node_modules` starting at `base_path` and walking up through each ancestor directory (matching Node's resolution algorithm) instead of only checking a single `node_modules` path relative to the process's current working directory, e.g.:\n```rust\nlet mut dir = Some(base_path.to_path_buf());\nwhile let Some(d) = dir {\n    let candidate = d.join(\"node_modules\").join(module_path);\n    // try candidate.with_extension(\"js\"), .with_extension(\"json\"), candidate itself\n    dir = d.parent().map(Path::to_path_buf);\n}\n```","locations":[{"ref":"crates/generate/src/quickjs.rs:171-204","code":"  171 | fn resolve_module_path(base_path: &Path, module_path: &str) -> rquickjs::Result<PathBuf> {\n  172 |     let candidates = if module_path.starts_with(\"./\") || module_path.starts_with(\"../\") {\n  173 |         let target = base_path.join(module_path);\n  174 |         vec![\n  175 |             target.with_extension(\"js\"),\n  176 |             target.with_extension(\"json\"),\n  177 |             target.clone(),\n  178 |         ]\n  179 |     } else {\n  180 |         let local_target = base_path.join(module_path);\n  181 |         let node_modules_target = Path::new(\"node_modules\").join(module_path);\n  182 | \n  183 |         vec![\n  184 |             local_target.with_extension(\"js\"),\n  185 |             local_target.with_extension(\"json\"),\n  186 |             local_target.clone(),\n  187 |             node_modules_target.with_extension(\"js\"),\n  188 |             node_modules_target.with_extension(\"json\"),\n  189 |             node_modules_target,\n  190 |         ]\n  191 |     };\n  192 | \n  193 |     for candidate in candidates {\n  194 |         if let Ok(resolved) = try_resolve_path(&candidate) {\n  195 |             return Ok(resolved);\n  196 |         }\n  197 |     }\n  198 | \n  199 |     Err(rquickjs::Error::new_from_js_message(\n  200 |         \"Error\",\n  201 |         \"ModuleNotFound\",\n  202 |         format!(\"Module not found: {module_path}\"),\n  203 |     ))\n  204 | }","lines":34,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/crates/generate/src/quickjs.rs#L171-L204"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`external_files` entries are stored already fully joined with `parser_path` (`let path = parser_path.join(path);` in `find_language_configurations_at_path`). Later, in `load_language_at_path_with_name`, they are joined a *second* time with `config.src_path`: `.map(|p| config.src_path.join(p))`. When `parser_path` is an absolute path, `Path::join` with an absolute `p` silently discards the `src_path` prefix (masking the bug); when `parser_path` is exactly `\".\"`, the extra `.` component is harmless (also masking the bug). But when `parser_path` is a genuine relative, non-dot path -- the normal case when `Loader::find_language_configurations_at_path`/`languages_at_path` is invoked directly on a relative directory argument, or when `Config::parser_directories` contains a relative entry -- the result is a bogus doubly-nested path like `vendor/tree-sitter-foo/src/vendor/tree-sitter-foo/some_header.h`. `needs_recompile` then calls `mtime()` on this nonexistent path, which returns an IO error that propagates via `?` and makes `load_language_at_path_with_name` fail outright for any grammar that declares `external-files` and is loaded via a relative, non-`.` path.","fix":"Do not re-join `config.src_path` onto entries that are already fully-qualified; use the stored external-file paths as-is:\n```rust\npaths_to_check.extend(config.external_files.unwrap_or_default().iter().cloned());\n```","locations":[{"ref":"crates/loader/src/loader.rs:1130-1145","code":" 1130 |         let parser_path = config.src_path.join(\"parser.c\");\n 1131 |         config.scanner_path = self.get_scanner_path(config.src_path);\n 1132 | \n 1133 |         let mut paths_to_check = vec![parser_path];\n 1134 | \n 1135 |         if let Some(scanner_path) = config.scanner_path.as_ref() {\n 1136 |             paths_to_check.push(scanner_path.clone());\n 1137 |         }\n 1138 | \n 1139 |         paths_to_check.extend(\n 1140 |             config\n 1141 |                 .external_files\n 1142 |                 .unwrap_or_default()\n 1143 |                 .iter()\n 1144 |                 .map(|p| config.src_path.join(p)),\n 1145 |         );","lines":16,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/crates/loader/src/loader.rs#L1130-L1145"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`find_language_configurations_at_path` builds each `external-files` entry as `let path = parser_path.join(path); if path.starts_with(parser_path) { Ok(path) } else { Err(LoaderError::ExternalFile(...)) }`, with the comment `// prevent p being above/outside of parser_path`. This check does not defend against traversal: `Path::starts_with` compares path *components* without resolving `..`, so `parser_path.join(\"../../../etc/passwd\")` still `starts_with(parser_path)` (verified: `\"/home/user/tree-sitter-foo/../../../etc/passwd\".starts_with(\"/home/user/tree-sitter-foo\")` returns `true`). A malicious or careless `tree-sitter.json` can therefore declare an `external-files` entry that escapes `parser_path` entirely, defeating the intended containment check; the resulting path is later `fs::metadata()`-ed (via `needs_recompile`) for arbitrary files outside the grammar directory.","fix":"Reject `..` components explicitly instead of relying on `starts_with` on the joined-but-unresolved path, e.g.:\n```rust\nif path.components().any(|c| matches!(c, std::path::Component::ParentDir)) {\n    return Err(LoaderError::ExternalFile(...));\n}\n```\nor canonicalize both `path` and `parser_path` before comparing with `starts_with`.","locations":[{"ref":"crates/loader/src/loader.rs:1829-1856","code":" 1829 |                         self.languages_by_id.push((\n 1830 |                             language_path,\n 1831 |                             OnceCell::new(),\n 1832 |                             grammar\n 1833 |                                 .external_files\n 1834 |                                 .clone()\n 1835 |                                 .into_vec()\n 1836 |                                 .map(|files| {\n 1837 |                                     files\n 1838 |                                         .into_iter()\n 1839 |                                         .map(|path| {\n 1840 |                                             let path = parser_path.join(path);\n 1841 |                                             // prevent p being above/outside of parser_path\n 1842 |                                             if path.starts_with(parser_path) {\n 1843 |                                                 Ok(path)\n 1844 |                                             } else {\n 1845 |                                                 Err(LoaderError::ExternalFile(\n 1846 |                                                     path.to_string_lossy().to_string(),\n 1847 |                                                     parser_path.to_string_lossy().to_string(),\n 1848 |                                                 ))\n 1849 |                                             }\n 1850 |                                         })\n 1851 |                                         .collect::<LoaderResult<Vec<_>>>()\n 1852 |                                 })\n 1853 |                                 .transpose()?,\n 1854 |                         ));\n 1855 |                         self.languages_by_id.len() - 1\n 1856 |                     };","lines":28,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/crates/loader/src/loader.rs#L1829-L1856"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `bump::run`, the sanity check that compares the latest git tag's version against the workspace `Cargo.toml` version uses `&&` instead of `||`: `if current_version.major != workspace_toml_version.major && current_version.minor != workspace_toml_version.minor`. This only warns and bails out when BOTH `major` and `minor` differ simultaneously. If only the `major` differs (e.g. tag `1.9.0` vs toml `2.9.0`) or only the `minor` differs (e.g. tag `1.2.0` vs toml `1.3.0`), the mismatch is silently missed and the release-bump tooling proceeds with `update_crates`, `update_makefile`, etc. using an already-inconsistent baseline, defeating the purpose of the guard.","fix":"Use `||` so any mismatch in either `major` or `minor` triggers the warning:\n```rust\nif current_version.major != workspace_toml_version.major\n    || current_version.minor != workspace_toml_version.minor\n{\n```","locations":[{"ref":"crates/xtask/src/bump.rs:54-65","code":"   54 |     if current_version.major != workspace_toml_version.major\n   55 |         && current_version.minor != workspace_toml_version.minor\n   56 |     {\n   57 |         eprintln!(\n   58 |             indoc! {\"\n   59 |             Seems like the workspace Cargo.toml ({}) version does not match up with the latest git tag ({}).\n   60 |             Please ensure you don't change that yourself, this subcommand will handle this for you.\n   61 |         \"},\n   62 |             workspace_toml_version, latest_tag\n   63 |         );\n   64 |         return Ok(());\n   65 |     }","lines":12,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/crates/xtask/src/bump.rs#L54-L65"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`Edit.editRange()` and `Edit.editPoint()`-adjacent range logic in `lib/binding_web/src/edit.ts` use `Number.MAX_SAFE_INTEGER` (2^53-1) as the sentinel for an \"unbounded\" range end/start, mirroring the native C `ts_range_edit()` in `lib/src/get_changed_ranges.c`, which uses `UINT32_MAX` (2^32-1, i.e. `4294967295`) for the same purpose. But `Range.startIndex`/`endIndex` are marshalled to and from the Wasm heap as 32-bit integers via `marshalRange`/`unmarshalRange` in `lib/binding_web/src/marshal.ts` (`C.setValue(address, range.endIndex, 'i32')`, `C.getValue(address, 'i32') >>> 0`). Two problems follow from this mismatch: (1) if an `Edit`-produced range with `endIndex === Number.MAX_SAFE_INTEGER` is ever marshalled into Wasm memory, the value silently truncates/wraps when coerced to a 32-bit int, corrupting the intended \"unbounded\" marker; (2) a range obtained via `unmarshalRange()` that actually carries the native sentinel `4294967295` will NOT satisfy `range.endIndex !== Number.MAX_SAFE_INTEGER`, so `editRange()`'s \"already unbounded, don't touch it\" guard never triggers for such ranges, and the sentinel gets incorrectly recomputed via ordinary arithmetic instead of being preserved.","fix":"Use the same 32-bit sentinel the native binding and marshalling code use, e.g. replace `Number.MAX_SAFE_INTEGER` with `0xFFFFFFFF` (and `{ row: 0xFFFFFFFF, column: 0xFFFFFFFF }` for the point) throughout `edit.ts` so the sentinel round-trips correctly through `marshalRange`/`unmarshalRange`.","locations":[{"ref":"lib/binding_web/src/edit.ts:87-100","code":"   87 |     if (range.endIndex >= this.oldEndIndex) {\n   88 |       if (range.endIndex !== Number.MAX_SAFE_INTEGER) {\n   89 |         newRange.endIndex = this.newEndIndex + (range.endIndex - this.oldEndIndex);\n   90 |         newRange.endPosition = {\n   91 |           row: this.newEndPosition.row + (range.endPosition.row - this.oldEndPosition.row),\n   92 |           column: range.endPosition.row === this.oldEndPosition.row\n   93 |             ? this.newEndPosition.column + (range.endPosition.column - this.oldEndPosition.column)\n   94 |             : range.endPosition.column,\n   95 |         };\n   96 |         if (newRange.endIndex < this.newEndIndex) {\n   97 |           newRange.endIndex = Number.MAX_SAFE_INTEGER;\n   98 |           newRange.endPosition = { row: Number.MAX_SAFE_INTEGER, column: Number.MAX_SAFE_INTEGER };\n   99 |         }\n  100 |       }","lines":14,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/lib/binding_web/src/edit.ts#L87-L100"},{"ref":"lib/binding_web/src/edit.ts:106-121","code":"  106 |     if (range.startIndex >= this.oldEndIndex) {\n  107 |       newRange.startIndex = this.newEndIndex + (range.startIndex - this.oldEndIndex);\n  108 |       newRange.startPosition = {\n  109 |         row: this.newEndPosition.row + (range.startPosition.row - this.oldEndPosition.row),\n  110 |         column: range.startPosition.row === this.oldEndPosition.row\n  111 |           ? this.newEndPosition.column + (range.startPosition.column - this.oldEndPosition.column)\n  112 |           : range.startPosition.column,\n  113 |       };\n  114 |       if (newRange.startIndex < this.newEndIndex) {\n  115 |         newRange.startIndex = Number.MAX_SAFE_INTEGER;\n  116 |         newRange.startPosition = { row: Number.MAX_SAFE_INTEGER, column: Number.MAX_SAFE_INTEGER };\n  117 |       }\n  118 |     } else if (range.startIndex > this.startIndex) {\n  119 |       newRange.startIndex = this.startIndex;\n  120 |       newRange.startPosition = { ...this.startPosition };\n  121 |     }","lines":16,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/lib/binding_web/src/edit.ts#L106-L121"},{"ref":"lib/binding_web/src/marshal.ts:132-151","code":"  132 | export function marshalRange(address: number, range: Range): void {\n  133 |   marshalPoint(address, range.startPosition); address += SIZE_OF_POINT;\n  134 |   marshalPoint(address, range.endPosition); address += SIZE_OF_POINT;\n  135 |   C.setValue(address, range.startIndex, 'i32'); address += SIZE_OF_INT;\n  136 |   C.setValue(address, range.endIndex, 'i32'); address += SIZE_OF_INT;\n  137 | }\n  138 | \n  139 | /**\n  140 |  * @internal\n  141 |  *\n  142 |  * Unmarshals a {@link Range} from the transfer buffer.\n  143 |  */\n  144 | export function unmarshalRange(address: number): Range {\n  145 |   const result = {} as Range;\n  146 |   result.startPosition = unmarshalPoint(address); address += SIZE_OF_POINT;\n  147 |   result.endPosition = unmarshalPoint(address); address += SIZE_OF_POINT;\n  148 |   result.startIndex = C.getValue(address, 'i32') >>> 0; address += SIZE_OF_INT;\n  149 |   result.endIndex = C.getValue(address, 'i32') >>> 0;\n  150 |   return result;\n  151 | }","lines":20,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/lib/binding_web/src/marshal.ts#L132-L151"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`Node.descendantsOfType()` builds the `symbols` array by first pushing the sentinel `65535` (for `\"ERROR\"`) and only afterward pushing the matched, ascending node-type ids. The resulting array is therefore not sorted ascending (e.g. `[65535, 3, 5, 7]`). This array is passed to the C helper `symbols_contain()` in `lib/binding_web/lib/tree-sitter.c`, which assumes an ascending-sorted array and exits its scan early via `if (set[i] > value) break;`. Because `65535` is always greater than any realistic node-type id, the very first comparison triggers the early break, so `symbols_contain` returns `false` for every symbol except an actual `ERROR` node -- effectively silently dropping all non-ERROR types whenever `\"ERROR\"` is combined with other type names in the `types` argument. This was introduced in commit 3b67861d (`fix(wasm): restore passing in ERROR to descendantsOfType`), and the accompanying test only exercises `descendantsOfType('ERROR')` alone, so the regression for combined lookups (e.g. `descendantsOfType(['ERROR', 'identifier'])`) is untested and silently wrong.","fix":"Sort the symbols array before copying it to the Wasm heap, e.g. in `lib/binding_web/src/node.ts`:\n```ts\n    for (let i = 0, n = typesBySymbol.length; i < n; i++) {\n      if (types.includes(typesBySymbol[i])) {\n        symbols.push(i);\n      }\n    }\n\n    symbols.sort((a, b) => a - b);\n```\nAlternatively, drop the sorted-array early-exit optimization in `symbols_contain()` in `tree-sitter.c` and always scan the full array.","locations":[{"ref":"lib/binding_web/src/node.ts:411-436","code":"  411 |   descendantsOfType(\n  412 |     types: string | string[],\n  413 |     startPosition: Point = ZERO_POINT,\n  414 |     endPosition: Point = ZERO_POINT\n  415 |   ): Node[] {\n  416 |     if (!Array.isArray(types)) types = [types];\n  417 | \n  418 |     // Convert the type strings to numeric type symbols\n  419 |     const symbols: number[] = [];\n  420 |     const typesBySymbol = this.tree.language.types;\n  421 |     for (const node_type of types) {\n  422 |       if (node_type == \"ERROR\") {\n  423 |         symbols.push(65535); // Internally, ts_builtin_sym_error is -1, which is UINT_16MAX\n  424 |       }\n  425 |     }\n  426 |     for (let i = 0, n = typesBySymbol.length; i < n; i++) {\n  427 |       if (types.includes(typesBySymbol[i])) {\n  428 |         symbols.push(i);\n  429 |       }\n  430 |     }\n  431 | \n  432 |     // Copy the array of symbols to the Wasm heap\n  433 |     const symbolsAddress = C._malloc(SIZE_OF_INT * symbols.length);\n  434 |     for (let i = 0, n = symbols.length; i < n; i++) {\n  435 |       C.setValue(symbolsAddress + i * SIZE_OF_INT, symbols[i], 'i32');\n  436 |     }","lines":26,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/lib/binding_web/src/node.ts#L411-L436"},{"ref":"lib/binding_web/lib/tree-sitter.c:735-745","code":"  735 | bool symbols_contain(const uint32_t *set, uint32_t length, uint32_t value) {\n  736 |   for (unsigned i = 0; i < length; i++) {\n  737 |     if (set[i] == value) {\n  738 |       return true;\n  739 |     }\n  740 |     if (set[i] > value) {\n  741 |       break;\n  742 |     }\n  743 |   }\n  744 |   return false;\n  745 | }","lines":11,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/lib/binding_web/lib/tree-sitter.c#L735-L745"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `TableEntrySyntheticProvider.get_child_at_index` (LLDB pretty printer for `TableEntry`), the header occupies exactly 2 logical child slots (`is_reusable` at index 0, `action_count` at index 1), and `num_children()` returns `2 + action_count` when `action_count > 0`, meaning the action elements occupy logical indices `2 .. action_count + 1`. However, the element `offset` is computed as `index - 3` instead of `index - 2`. As a result, the first request (logical index `2`) computes `offset = -1`, causing `address = start + (-1) * element_type_size` - reading memory *before* the `actions` array and displaying it as `action[-1]` - while the true last action (which should be at `offset = action_count - 1`) is never reached, since the index range only goes up to `action_count - 2` in the shifted scheme. Every `TableEntry` with at least one action is displayed with one bogus, out-of-bounds `action[-1]` entry and is missing its real last action.","fix":"Use the same header offset as the other array-like providers in this directory (`ts_array.py`, `ts_tree.py`), i.e. `offset = index - 2`:\n```python\nelse:\n    if self.action_count.GetValueAsUnsigned() == 0:\n        return self.actions\n    offset: int = index - 2\n    start: int = self.actions.GetValueAsUnsigned()\n```","locations":[{"ref":"lib/lldb_pretty_printers/table_entry.py:40-49","code":"   40 |         else:\n   41 |             if self.action_count.GetValueAsUnsigned() == 0:\n   42 |                 return self.actions\n   43 |             offset: int = index - 3\n   44 |             start: int = self.actions.GetValueAsUnsigned()\n   45 |             address: int = start + offset * self.element_type_size\n   46 |             element: SBValue = self.actions.CreateValueFromAddress(\n   47 |                 \"action[%s]\" % (offset), address, self.element_type\n   48 |             )\n   49 |             return element","lines":10,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/lib/lldb_pretty_printers/table_entry.py#L40-L49"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`color_enabled` in `paint.rs` is supposed to implement the `NO_COLOR` convention (https://no-color.org), which states color must be disabled whenever the variable is *present*, regardless of its value. The current check `std::env::var_os(\"NO_COLOR\").is_none_or(|v| v.is_empty())` only disables color when `NO_COLOR` is set to a *non-empty* value; running with `NO_COLOR=` (present but empty, a common way to set an env var in shell scripts/CI) leaves color enabled, silently violating the convention the code is trying to implement.","fix":"Treat mere presence of the variable as disabling color:\n```rust\npub fn color_enabled() -> bool {\n    static ENABLED: std::sync::OnceLock<bool> = std::sync::OnceLock::new();\n    *ENABLED.get_or_init(|| std::env::var_os(\"NO_COLOR\").is_none())\n}\n```","locations":[{"ref":"crates/cli/src/paint.rs:10-13","code":"   10 | pub fn color_enabled() -> bool {\n   11 |     static ENABLED: std::sync::OnceLock<bool> = std::sync::OnceLock::new();\n   12 |     *ENABLED.get_or_init(|| std::env::var_os(\"NO_COLOR\").is_none_or(|v| v.is_empty()))\n   13 | }","lines":4,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/crates/cli/src/paint.rs#L10-L13"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `TestSummary::fmt_parse_results`, `avg` is computed as `total_adj_parse_time / count as f64` and `std_dev` similarly divides by `count as f64`, with no check for `count == 0`. If a test run produces no parse-test results (e.g. a corpus directory containing only highlight/tag/query tests, or an empty corpus), this yields `0.0 / 0.0 = NaN`, which then silently propagates into the \"Warning: Slow parse rate\" comparisons (always false against `NaN`, so no crash, but the underlying statistics are garbage rather than being skipped).","fix":"Skip the outlier-statistics computation entirely when `count == 0`, e.g. wrap the `avg`/`std_dev` calculation and the later `stat_display` logic in `if count > 0 { ... }`, defaulting to no slow-parse warnings when there are zero parse results.","locations":[{"ref":"crates/cli/src/test.rs:437-464","code":"  437 |     fn fmt_parse_results(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {\n  438 |         let (count, total_adj_parse_time) = self\n  439 |             .parse_results\n  440 |             .iter()\n  441 |             .filter_map(|(_, result)| match result.info {\n  442 |                 TestInfo::Group { .. } => None,\n  443 |                 TestInfo::ParseTest { parse_rate, .. } => parse_rate,\n  444 |                 TestInfo::AssertionTest { .. } => unreachable!(),\n  445 |             })\n  446 |             .fold((0usize, 0.0f64), |(count, rate_accum), (_, adj_rate)| {\n  447 |                 (count + 1, rate_accum + adj_rate)\n  448 |             });\n  449 | \n  450 |         let avg = total_adj_parse_time / count as f64;\n  451 |         let std_dev = {\n  452 |             let variance = self\n  453 |                 .parse_results\n  454 |                 .iter()\n  455 |                 .filter_map(|(_, result)| match result.info {\n  456 |                     TestInfo::Group { .. } => None,\n  457 |                     TestInfo::ParseTest { parse_rate, .. } => parse_rate,\n  458 |                     TestInfo::AssertionTest { .. } => unreachable!(),\n  459 |                 })\n  460 |                 .map(|(_, rate_i)| (rate_i - avg).powi(2))\n  461 |                 .sum::<f64>()\n  462 |                 / count as f64;\n  463 |             variance.sqrt()\n  464 |         };","lines":28,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/crates/cli/src/test.rs#L437-L464"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`compute_conflict_status` in `token_conflicts.rs` de-duplicates the BFS worklist of NFA state sets using `hash_state_set`, which folds each `Vec<u32>` of NFA state ids down to a single `u64` via `FxHasher` (`token_conflicts.rs:328-334`) and only tracks that `u64` in `visited_state_sets`, instead of the actual state-id vector. As the comment on `hash_state_set` itself acknowledges, two distinct state sets that happen to hash to the same `u64` will be treated as \"already visited\" and the second one will be silently skipped, which can make `compute_conflict_status` miss a real lexical conflict between two tokens (`TokenConflictStatus` bits under-reported), so `does_conflict`/`does_overlap` could return `false` for a token pair that genuinely conflicts. The probability of an `FxHasher` collision for any given pair of distinct inputs is low but non-negligible compared to a cryptographic hash (`FxHash` is explicitly a fast, non-collision-resistant hash), and this runs once per token pair per grammar compile across every tree-sitter grammar ever generated, so it is a real (if rare) correctness hazard rather than a purely theoretical one.","fix":"Track the actual state-id vectors in the visited set (e.g. `FxHashSet<Vec<u32>>` or a `FxHashSet<Box<[u32]>>`) instead of collapsing them to a `u64` hash, or at minimum fall back to a full equality check on hash collision (e.g. store `(u64, Vec<u32>)` and compare the vector when the hash matches) so a collision can never cause a state set to be skipped.","locations":[{"ref":"crates/generate/src/build_tables/token_conflicts.rs:331-345","code":"  331 | /// Hash a sorted slice of NFA state IDs to a single `u64` for use as a\n  332 | /// visited-set key.\n  333 | ///\n  334 | /// NOTE: This trades exact equality for speed. Two distinct state sets that\n  335 | /// hash to the same `u64` will be treated as \"already visited,\" potentially\n  336 | /// causing the BFS to skip a state set. In practice the collision probability\n  337 | /// is negligible (1 in 2^64 per comparison), but this is technically a\n  338 | /// probabilistic optimization rather than an exact one.\n  339 | #[inline]\n  340 | fn hash_state_set(states: &[u32]) -> u64 {\n  341 |     use std::hash::{Hash, Hasher};\n  342 |     let mut h = rustc_hash::FxHasher::default();\n  343 |     states.hash(&mut h);\n  344 |     h.finish()\n  345 | }","lines":15,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/crates/generate/src/build_tables/token_conflicts.rs#L331-L345"},{"ref":"crates/generate/src/build_tables/token_conflicts.rs:492","code":"  492 |             if can_advance && visited_state_sets.insert(hash_state_set(&transition.states)) {","lines":1,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/crates/generate/src/build_tables/token_conflicts.rs#L492"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`colorForCaptureName` looks up `capture` with `query.captureNames.indexOf(capture)`. `CAPTURE_REGEX` (`/@\\s*([\\w\\._-]+)/g`) scans the raw query text line-by-line and can match `@`-prefixed text inside string literals or predicate arguments (e.g. `(#match? @foo \"^@bar\")`) that are not actual capture names. When `indexOf` returns `-1` for such a false match, `colors[id % colors.length]` evaluates to `colors[-1]` (JavaScript's `%` preserves the sign of the dividend), which is `undefined`, producing an invalid `color: undefined` CSS declaration instead of a real highlight color.","fix":"Guard against a missing capture before indexing, e.g.:\n```javascript\nfunction colorForCaptureName(capture) {\n  const id = query.captureNames.indexOf(capture);\n  if (id === -1) return undefined;\n  const isDark = ...\n  const colors = isDark ? DARK_COLORS : LIGHT_COLORS;\n  return colors[id % colors.length];\n}\n```","locations":[{"ref":"docs/src/assets/js/playground.js:591-599","code":"  591 |   function colorForCaptureName(capture) {\n  592 |     const id = query.captureNames.indexOf(capture);\n  593 |     const isDark = document.querySelector('html').classList.contains('ayu') ||\n  594 |       document.querySelector('html').classList.contains('coal') ||\n  595 |       document.querySelector('html').classList.contains('navy');\n  596 | \n  597 |     const colors = isDark ? DARK_COLORS : LIGHT_COLORS;\n  598 |     return colors[id % colors.length];\n  599 |   }","lines":9,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/docs/src/assets/js/playground.js#L591-L599"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"The `get_child_index` methods of `ArraySyntheticProvider` (`ts_array.py`), `TableEntrySyntheticProvider` (`table_entry.py`), and `TSTreeSyntheticProvider` (`ts_tree.py`) are supposed to be the inverse of `get_child_at_index`: the header fields occupy the first N logical indices (2 for `ArraySyntheticProvider`/`TableEntrySyntheticProvider`, 3 for `TSTreeSyntheticProvider`), and element `k` lives at logical index `N + k` (matching `offset = index - N` in `get_child_at_index`). But `get_child_index` returns the bare parsed element number (`int(index)`) instead of `int(index) + N`. So looking up a child by its displayed name, e.g. `\"[3]\"` or `\"included_ranges[3]\"`, returns the wrong logical index (off by the header size), which `get_child_at_index` then resolves to the wrong field (e.g. `size`/`root`/`is_reusable` instead of the requested element, or the wrong element).","fix":"Add the header offset when converting the parsed element number back to a logical index, mirroring `get_child_at_index`. For example in `ts_array.py`:\n```python\nindex = name.lstrip(\"[\").rstrip(\"]\")\nif index.isdigit():\n    return int(index) + 2\nelse:\n    return -1\n```\nand analogously `+ 2` in `table_entry.py` and `+ 3` in `ts_tree.py`.","locations":[{"ref":"lib/lldb_pretty_printers/ts_array.py:20-32","code":"   20 |     def get_child_index(self, name: str) -> int:\n   21 |         if name == \"size\":\n   22 |             return 0\n   23 |         elif name == \"capacity\":\n   24 |             return 1\n   25 |         else:\n   26 |             if self.size.GetValueAsUnsigned() == 0:\n   27 |                 return 2\n   28 |             index = name.lstrip(\"[\").rstrip(\"]\")\n   29 |             if index.isdigit():\n   30 |                 return int(index)\n   31 |             else:\n   32 |                 return -1","lines":13,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/lib/lldb_pretty_printers/ts_array.py#L20-L32"},{"ref":"lib/lldb_pretty_printers/table_entry.py:21-33","code":"   21 |     def get_child_index(self, name: str) -> int:\n   22 |         if name == \"is_reusable\":\n   23 |             return 0\n   24 |         elif name == \"action_count\":\n   25 |             return 1\n   26 |         else:\n   27 |             if self.action_count.GetValueAsUnsigned() == 0:\n   28 |                 return 2\n   29 |             index = name.lstrip(\"actions[\").rstrip(\"]\")\n   30 |             if index.isdigit():\n   31 |                 return int(index)\n   32 |             else:\n   33 |                 return -1","lines":13,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/lib/lldb_pretty_printers/table_entry.py#L21-L33"},{"ref":"lib/lldb_pretty_printers/ts_tree.py:53-67","code":"   53 |     def get_child_index(self, name: str) -> int:\n   54 |         if name == \"root\":\n   55 |             return 0\n   56 |         elif name == \"language\":\n   57 |             return 1\n   58 |         elif name == \"included_range_count\":\n   59 |             return 2\n   60 |         else:\n   61 |             if self.included_range_count.GetValueAsUnsigned() == 0:\n   62 |                 return 3\n   63 |             index = name.lstrip(\"included_ranges[\").rstrip(\"]\")\n   64 |             if index.isdigit():\n   65 |                 return int(index)\n   66 |             else:\n   67 |                 return -1","lines":15,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/lib/lldb_pretty_printers/ts_tree.py#L53-L67"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `HighlightConfiguration::new`, the pattern-index counting loop has a redundant nested condition: `if pattern_offset < highlights_query_offset { if pattern_offset < highlights_query_offset { highlights_pattern_index += 1; } ... }`. The inner `if` duplicates the exact condition of the enclosing `if`, so it is always true whenever reached and adds nothing but confusion -- a leftover copy-paste artifact (the inner check was presumably meant to test something else, analogous to the `locals_query_offset` check right below it).","fix":"Remove the redundant inner check:\n```rust\nfor i in 0..(query.pattern_count()) {\n    let pattern_offset = query.start_byte_for_pattern(i);\n    if pattern_offset < highlights_query_offset {\n        highlights_pattern_index += 1;\n        if pattern_offset < locals_query_offset {\n            locals_pattern_index += 1;\n        }\n    }\n}\n```","locations":[{"ref":"crates/highlight/src/highlight.rs:374-384","code":"  374 |         for i in 0..(query.pattern_count()) {\n  375 |             let pattern_offset = query.start_byte_for_pattern(i);\n  376 |             if pattern_offset < highlights_query_offset {\n  377 |                 if pattern_offset < highlights_query_offset {\n  378 |                     highlights_pattern_index += 1;\n  379 |                 }\n  380 |                 if pattern_offset < locals_query_offset {\n  381 |                     locals_pattern_index += 1;\n  382 |                 }\n  383 |             }\n  384 |         }","lines":11,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/crates/highlight/src/highlight.rs#L374-L384"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"very_easy","description":"The ESLint flat config object in `crates/cli/eslint/index.js` sets the `camelcase` rule twice: once at `'camelcase': ['error', { properties: 'never' }]` and again a few lines later as `'camelcase': 'off'`. Because both are keys of the same object literal, the second assignment silently overwrites the first, making the first one dead/misleading configuration.","fix":"Remove one of the two `camelcase` entries; keep whichever behavior (`'never'` properties check vs fully `'off'`) is actually intended.","locations":[{"ref":"crates/cli/eslint/index.js:40-48","code":"   40 |       'camelcase': ['error', { properties: 'never' }],\n   41 |       'comma-dangle': ['error', 'always-multiline'],\n   42 |       'comma-spacing': 'error',\n   43 |       'comma-style': 'error',\n   44 |       'computed-property-spacing': 'error',\n   45 |       'eol-last': 'error',\n   46 |       'func-call-spacing': 'error',\n   47 | \n   48 |       'camelcase': 'off',","lines":9,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/crates/cli/eslint/index.js#L40-L48"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"easy","description":"In the `Query` constructor, when `ts_query_new` fails (`address` is falsy), the code reads `errorId` from the transfer buffer and `switch`es on it, but the `switch` only has cases for `QueryErrorKind.Syntax/NodeName/FieldName/CaptureName/PatternStructure` (C values 1-5) and has no `default` case. The C API can also return `TSQueryErrorLanguage` (value 6, defined in `lib/src/query.c`'s `ts_query_new`, returned whenever the language is `NULL` or has an incompatible ABI version). When that happens, none of the `case` branches match, the `switch` silently falls through, and execution continues past the `if (!address)` block using `address = 0`. The constructor then calls `C._ts_query_string_count(address)`, `C._ts_query_capture_count(address)`, `C._ts_query_pattern_count(address)`, etc. with a null/zero pointer, which is passed straight into the Wasm module's native code as a `TSQuery*`. This is reachable from ordinary API misuse (constructing a `Query` for a `Language` whose ABI version is outside the compatible range), and results in either garbage data or a Wasm trap/crash instead of a clean `QueryError` being thrown.","fix":"Add a `default` (or an explicit `case QueryErrorKind`-equivalent for the C `TSQueryErrorLanguage` value) that throws a `QueryError`/generic `Error` instead of falling through, e.g.:\n```ts\nswitch (errorId) {\n  case QueryErrorKind.Syntax:\n    throw new QueryError(QueryErrorKind.Syntax, { suffix: `${errorIndex}: '${suffix}'...` }, errorIndex, 0);\n  case QueryErrorKind.NodeName:\n  case QueryErrorKind.FieldName:\n  case QueryErrorKind.CaptureName:\n    throw new QueryError(errorId, { word }, errorIndex, word.length);\n  case QueryErrorKind.PatternStructure:\n    throw new QueryError(errorId, { suffix: `${errorIndex}: '${suffix}'...` }, errorIndex, 0);\n  default:\n    throw new Error(`Failed to create query: incompatible or invalid language (error code ${errorId})`);\n}\n```","locations":[{"ref":"lib/binding_web/src/query.ts:576-596","code":"  576 |     if (!address) {\n  577 |       const errorId = C.getValue(TRANSFER_BUFFER + SIZE_OF_INT, 'i32') as QueryErrorKind;\n  578 |       const errorByte = C.getValue(TRANSFER_BUFFER, 'i32');\n  579 |       const errorIndex = C.UTF8ToString(sourceAddress, errorByte).length;\n  580 |       const suffix = source.slice(errorIndex, errorIndex + 100).split('\\n')[0];\n  581 |       const word = suffix.match(QUERY_WORD_REGEX)?.[0] ?? '';\n  582 |       C._free(sourceAddress);\n  583 | \n  584 |       switch (errorId) {\n  585 |         case QueryErrorKind.Syntax:\n  586 |           throw new QueryError(QueryErrorKind.Syntax, { suffix: `${errorIndex}: '${suffix}'...` }, errorIndex, 0);\n  587 |         case QueryErrorKind.NodeName:\n  588 |           throw new QueryError(errorId, { word }, errorIndex, word.length);\n  589 |         case QueryErrorKind.FieldName:\n  590 |           throw new QueryError(errorId, { word }, errorIndex, word.length);\n  591 |         case QueryErrorKind.CaptureName:\n  592 |           throw new QueryError(errorId, { word }, errorIndex, word.length);\n  593 |         case QueryErrorKind.PatternStructure:\n  594 |           throw new QueryError(errorId, { suffix: `${errorIndex}: '${suffix}'...` }, errorIndex, 0);\n  595 |       }\n  596 |     }","lines":21,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/lib/binding_web/src/query.ts#L576-L596"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"very_easy","description":"`load_language_wasm_file` calls `get_grammar_name(language_dir).with_context(...).unwrap()` even though the enclosing function returns `Result<(String, Vec<u8>)>`. `with_context` turns the `Result` into one with a nicer error message, but the immediate `.unwrap()` then discards that `Result` handling and panics instead of propagating the error. Any user running a command that hits this path (e.g. `tree-sitter build --wasm` or `tree-sitter playground`) against a directory with a missing or invalid `src/grammar.json` gets an ugly panic/backtrace instead of the intended friendly `anyhow` error message.","fix":"Replace `.unwrap()` with `?` so the context-wrapped error is returned normally:\n```rust\nlet grammar_name = get_grammar_name(language_dir)\n    .with_context(|| \"Failed to get Wasm filename\")?;\n```","locations":[{"ref":"crates/cli/src/wasm.rs:12-15","code":"   12 | pub fn load_language_wasm_file(language_dir: &Path) -> Result<(String, Vec<u8>)> {\n   13 |     let grammar_name = get_grammar_name(language_dir)\n   14 |         .with_context(|| \"Failed to get Wasm filename\")\n   15 |         .unwrap();","lines":4,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/crates/cli/src/wasm.rs#L12-L15"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"The `optional_resource!` macro used to embed/load `playground.js`, `web-tree-sitter.js`, and `web-tree-sitter.wasm` calls `fs::read(tree_sitter_dir.join($path)).unwrap()` whenever the `TREE_SITTER_BASE_DIR` environment variable is set. If that variable points at a directory that doesn't contain the expected files (a typo, stale checkout, or partial build), `tree-sitter playground` / `tree-sitter playground export` panics instead of surfacing a clear `anyhow` error like the rest of `export`/`serve` do via `.with_context(...)`.","fix":"Have the macro-generated functions return `Result<Cow<'static, [u8]>>` and use `.with_context(|| format!(\"Failed to read {}\", $path))?` instead of `.unwrap()`, propagating the error to `export`/`serve` callers.","locations":[{"ref":"crates/cli/src/playground.rs:15-35","code":"   15 | macro_rules! optional_resource {\n   16 |     ($name:tt, $path:tt) => {\n   17 |         #[cfg(TREE_SITTER_EMBED_WASM_BINDING)]\n   18 |         fn $name(tree_sitter_dir: Option<&Path>) -> Cow<'static, [u8]> {\n   19 |             if let Some(tree_sitter_dir) = tree_sitter_dir {\n   20 |                 Cow::Owned(fs::read(tree_sitter_dir.join($path)).unwrap())\n   21 |             } else {\n   22 |                 Cow::Borrowed(include_bytes!(concat!(\"../../../\", $path)))\n   23 |             }\n   24 |         }\n   25 | \n   26 |         #[cfg(not(TREE_SITTER_EMBED_WASM_BINDING))]\n   27 |         fn $name(tree_sitter_dir: Option<&Path>) -> Cow<'static, [u8]> {\n   28 |             if let Some(tree_sitter_dir) = tree_sitter_dir {\n   29 |                 Cow::Owned(fs::read(tree_sitter_dir.join($path)).unwrap())\n   30 |             } else {\n   31 |                 Cow::Borrowed(&[])\n   32 |             }\n   33 |         }\n   34 |     };\n   35 | }","lines":21,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/crates/cli/src/playground.rs#L15-L35"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`symbol_table_insert_name` (used for every capture name, predicate identifier, and predicate string literal parsed out of a query) calls `symbol_table_id_for_name`, which does a linear scan over `self->slices` (`for (unsigned i = 0; i < self->slices.size; i++)`) comparing each existing name with `strncmp`. Since every distinct name/value insertion during `ts_query_new` re-scans all previously-inserted names, building a query with `N` distinct capture/predicate names costs `O(N^2)` string comparisons. Real-world query files (e.g. editor highlight/injection queries with hundreds of captures and predicates) can make query compilation noticeably slower than necessary.","fix":"Maintain a hash map (name/length -> id) alongside `SymbolTable.slices` so `symbol_table_id_for_name` is O(1) amortized instead of O(n), or at minimum keep the lookup path but avoid re-scanning entries that were already deduplicated in the same parse pass.","locations":[{"ref":"lib/src/query.c:920-933","code":"  920 | static int symbol_table_id_for_name(\n  921 |   const SymbolTable *self,\n  922 |   const char *name,\n  923 |   uint32_t length\n  924 | ) {\n  925 |   for (unsigned i = 0; i < self->slices.size; i++) {\n  926 |     Slice slice = *array_get(&self->slices, i);\n  927 |     if (\n  928 |       slice.length == length &&\n  929 |       !strncmp(array_get(&self->characters, slice.offset), name, length)\n  930 |     ) return i;\n  931 |   }\n  932 |   return -1;\n  933 | }","lines":14,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/lib/src/query.c#L920-L933"},{"ref":"lib/src/query.c:945-961","code":"  945 | static uint16_t symbol_table_insert_name(\n  946 |   SymbolTable *self,\n  947 |   const char *name,\n  948 |   uint32_t length\n  949 | ) {\n  950 |   int id = symbol_table_id_for_name(self, name, length);\n  951 |   if (id >= 0) return (uint16_t)id;\n  952 |   Slice slice = {\n  953 |     .offset = self->characters.size,\n  954 |     .length = length,\n  955 |   };\n  956 |   array_grow_by(&self->characters, length + 1);\n  957 |   memcpy(array_get(&self->characters, slice.offset), name, length);\n  958 |   *array_get(&self->characters, self->characters.size - 1) = 0;\n  959 |   array_push(&self->slices, slice);\n  960 |   return self->slices.size - 1;\n  961 | }","lines":17,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/lib/src/query.c#L945-L961"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`Theme::load` in `highlight.rs` is a `pub` function that reads a theme JSON file from a path and parses it, but nothing in the CLI calls it — the CLI's only theming path goes through `ThemeConfig` deserialized from the `tree-sitter-config` `Config` system (see `Highlight::run` in `main.rs`, which uses `config.get::<ThemeConfig>()`), and there is no `--theme-path`-style flag anywhere in `main.rs`. Separately, the function's error handling is also questionable: `serde_json::from_str(&json).unwrap_or_default()` silently swallows any JSON parse error and falls back to `ThemeConfig::default()`, so if this function were wired up, a malformed theme file would silently produce default colors instead of surfacing a parse error.","fix":"Either remove `Theme::load` if it is genuinely unused, or wire it up to a CLI flag and propagate the parse error instead of swallowing it with `unwrap_or_default()`.","locations":[{"ref":"crates/cli/src/highlight.rs:69-72","code":"   69 |     pub fn load(path: &path::Path) -> io::Result<Self> {\n   70 |         let json = fs::read_to_string(path)?;\n   71 |         Ok(serde_json::from_str(&json).unwrap_or_default())\n   72 |     }","lines":4,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/crates/cli/src/highlight.rs#L69-L72"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`build_wasm::run_wasm` calls `fs::create_dir_all(\"target/scratch\").unwrap();` but nothing in `run_wasm` (or elsewhere in `build_wasm.rs`) ever reads from or writes to `target/scratch`; the directory this line creates is never used by the subsequent `emcc`/docker/podman invocation or any other logic in the function. It appears to be a leftover from a previous implementation.","fix":"Remove the unused line:\n```rust\nfs::create_dir_all(\"target/scratch\").unwrap();\n```\nif `target/scratch` truly isn't needed anywhere in `run_wasm`.","locations":[{"ref":"crates/xtask/src/build_wasm.rs:205","code":"  205 |     fs::create_dir_all(\"target/scratch\").unwrap();","lines":1,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/crates/xtask/src/build_wasm.rs#L205"}]},
{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"medium","difficulty":"medium","description":"`test_tags` in `test_tags.rs` and `test_highlights` in `test_highlight.rs` are near-identical ~70-line functions: both recursively walk a directory, skip hidden/empty subdirectories, resolve the language config for each file (erroring via `util::lang_not_found_for_path` in the same way), run a per-file assertion test, and push a `TestResult` with the same `TestInfo::AssertionTest` shape into a `TestResultHierarchy`. The only real differences are which config/context type is used and the name of the per-file test function invoked. This duplication means any behavioral fix (e.g. to directory traversal, filtering, or error reporting) must be made twice and can easily drift out of sync.","fix":"Extract the shared directory-walking/dispatch logic into a generic helper (e.g. parameterized over a closure `FnMut(&Path) -> Result<usize>` that runs the single-file test and returns the assertion count) that both `test_tags` and `test_highlights` call, leaving only the per-file config resolution as the differing part.","locations":[{"ref":"crates/cli/src/test_tags.rs:44-117","code":"   44 | pub fn test_tags(\n   45 |     loader: &Loader,\n   46 |     loader_config: &Config,\n   47 |     tags_context: &mut TagsContext,\n   48 |     directory: &Path,\n   49 |     test_summary: &mut TestSummary,\n   50 | ) -> Result<()> {\n   51 |     let mut failed = false;\n   52 | \n   53 |     for tag_test_file in fs::read_dir(directory)? {\n   54 |         let tag_test_file = tag_test_file?;\n   55 |         let test_file_path = tag_test_file.path();\n   56 |         let test_file_name = tag_test_file.file_name();\n   57 |         if test_file_path.is_dir() && test_file_path.read_dir()?.next().is_some() {\n   58 |             test_summary\n   59 |                 .tag_results\n   60 |                 .add_group(test_file_name.to_string_lossy().as_ref());\n   61 | {"id":"DUP_2","type":"duplicate_code","type_label":"Duplicate Code","severity":"medium","difficulty":"medium","description":"`Version::update_treesitter_json`, `Version::update_package_json`, and `Version::update_zig_zon` all implement essentially the same ~25-30 line algorithm: scan a file line by line, find a line containing a specific key (`\"version\":` or `.version =`), locate the value between two double quotes with three chained `.find('\"').unwrap()` calls, and splice in the new version string. The only differences are the search token and the whitespace-trimming rule for the `.zig.zon` variant. This triplication makes the version-bump logic harder to maintain and review (a fix or bug in the quote-finding logic has to be applied in three places), and each copy also carries the same latent panic risk if a line matches the key but has no subsequent quoted value.","fix":"Factor the shared \"find quoted value after a key on a line\" logic into one helper, e.g. `fn replace_quoted_version(content: &str, key_matcher: impl Fn(&str) -> bool, new_version: &str) -> String`, and have `update_treesitter_json`, `update_package_json`, and `update_zig_zon` call it with their respective key-matching predicates.","locations":[{"ref":"crates/cli/src/version.rs:156-184","code":"  156 |     fn update_treesitter_json(&self) -> Result<(), UpdateError> {\n  157 |         let json_path = self.current_dir.join(\"tree-sitter.json\");\n  158 |         Self::update_file_with(&json_path, |content| {\n  159 |             content\n  160 |                 .lines()\n  161 |                 .map(|line| {\n  162 |                     if line.contains(\"\\\"version\\\":\") {\n  163 |                         let prefix_index =\n  164 |                             line.find(\"\\\"version\\\":\").unwrap() + \"\\\"version\\\":\".len();\n  165 |                         let start_quote =\n  166 |                             line[prefix_index..].find('\"').unwrap() + prefix_index + 1;\n  167 | {"id":"OTHER_1","type":"other","type_label":"Other","severity":"medium","difficulty":"medium","description":"`get_tmp_source_file` in `input.rs` always writes stdin/test contents to the fixed path `std::env::temp_dir().join(\".tree-sitter-temp\")` via `File::create`, which follows symlinks and truncates the target. Because the filename is fixed and predictable and lives in a world-writable shared directory (`/tmp` on Unix), any other local user (or a concurrent invocation of the CLI itself) can pre-create a symlink at that path pointing at an arbitrary file the current user can write to, leading to unintended overwrites (classic CWE-377 insecure temporary file pattern). It also means two concurrent `tree-sitter parse`/`query`/`highlight`/`tags` invocations reading from stdin will race on the same temp file.","fix":"Use a per-process unique temp file (e.g. via the `tempfile` crate's `NamedTempFile`, which creates the file exclusively with a random name) instead of a fixed, predictable filename.","locations":[{"ref":"crates/cli/src/input.rs:181-187","code":"  181 | pub fn get_tmp_source_file(contents: &[u8]) -> Result<PathBuf> {\n  182 |     let parse_path = std::env::temp_dir().join(\".tree-sitter-temp\");\n  183 |     let mut parse_file = std::fs::File::create(&parse_path)?;\n  184 |     parse_file.write_all(contents)?;\n  185 | \n  186 |     Ok(parse_path)\n  187 | }","lines":7,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/crates/cli/src/input.rs#L181-L187"}]},
{"id":"OTHER_2","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"`read_git_sha` in `build.rs` embeds the raw output of `git rev-parse HEAD` into the `BUILD_SHA` compile-time env var via `String::from_utf8_lossy(&output.stdout).to_string()` without trimming. `git rev-parse HEAD` output ends with a trailing `\\n`, so `BUILD_SHA` ends up containing an embedded newline. In `main.rs`, `BUILD_SHA` is interpolated into the version string as `format!(\"{BUILD_VERSION} ({build_sha})\")`, which then prints something like `1.0.0 (abcdef1234...\\n)` — the closing parenthesis lands on its own line, corrupting the `--version` / help banner output.","fix":"Trim the command output before using it:\n```rust\nSome(String::from_utf8_lossy(&output.stdout).trim().to_string())\n```","locations":[{"ref":"crates/cli/build.rs:70-79","code":"   70 |     Command::new(\"git\")\n   71 |         .args([\"rev-parse\", \"HEAD\"])\n   72 |         .current_dir(crate_path)\n   73 |         .output()\n   74 |         .map_or(None, |output| {\n   75 |             if !output.status.success() {\n   76 |                 return None;\n   77 |             }\n   78 |             Some(String::from_utf8_lossy(&output.stdout).to_string())\n   79 |         })","lines":10,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/crates/cli/build.rs#L70-L79"},{"ref":"crates/cli/src/main.rs:2066-2069","code":" 2066 |     let version = BUILD_SHA.map_or_else(\n 2067 |         || BUILD_VERSION.to_string(),\n 2068 |         |build_sha| format!(\"{BUILD_VERSION} ({build_sha})\"),\n 2069 |     );","lines":4,"link":"https://github.com/tree-sitter/tree-sitter/blob/1b8407d1e718f2a26e2886c03cc55622d8d1d7bd/crates/cli/src/main.rs#L2066-L2069"}]},
