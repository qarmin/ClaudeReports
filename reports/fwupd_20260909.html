_mcu_device_ensure_force_table_addr(self, error)) {\n  347 | \t\t\t\tg_prefix_error_literal(error, \"get MCU forcetable address fail: \");\n  348 | \t\t\t\treturn FALSE;\n  349 | \t\t\t}\n  350 | \t\t\tself->force_table_support = TRUE;","lines":5,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/elantp/fu-elantp-hid-mcu-device.c#L346-L350"}]},
{"id":"CPY_6","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In `fu_genesys_usbhub_firmware_export` (`plugins/genesys/fu-genesys-usbhub-firmware.c`), the `running_project_code` variable is populated by calling `fu_struct_genesys_ts_static_get_mask_project_code(self->st_static_ts)` again (line 444) instead of `fu_struct_genesys_ts_static_get_running_project_code`. The `FuStructGenesysTsStatic` struct (`fu-genesys-usbhub.rs`) has distinct `mask_project_code` and `running_project_code` fields, and every other `running_project_*` value in this same function (`running_project_hardware`, `running_project_firmware`, `running_project_ic_type`) correctly calls its matching `get_running_project_*` getter. As written, the exported XML/diagnostic output duplicates `mask_project_code` under the `running_project_code` key, hiding the real running-project code value used for firmware diagnostics/debugging.","fix":"```c\ng_autofree gchar *running_project_code =\n    fu_struct_genesys_ts_static_get_running_project_code(self->st_static_ts);\n```\ninstead of calling `fu_struct_genesys_ts_static_get_mask_project_code` a second time.","locations":[{"ref":"plugins/genesys/fu-genesys-usbhub-firmware.c:443-444","code":"  443 | \t\tg_autofree gchar *running_project_code =\n  444 | \t\t    fu_struct_genesys_ts_static_get_mask_project_code(self->st_static_ts);","lines":2,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/genesys/fu-genesys-usbhub-firmware.c#L443-L444"},{"ref":"plugins/genesys/fu-genesys-usbhub-firmware.c:461","code":"  461 | \t\tfu_xmlb_builder_insert_kv(bn, \"running_project_code\", running_project_code);","lines":1,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/genesys/fu-genesys-usbhub-firmware.c#L461"}]},
{"id":"CPY_7","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In `fu_intel_cvs_device_check_status_cb()` (`plugins/intel-cvs/fu-intel-cvs-device.c`), the sysfs attribute `cvs_ctrl_data_fwupd` is read with a length of `FU_STRUCT_INTEL_CVS_PROBE_SIZE`, but the resulting bytes are then parsed as `FuStructIntelCvsStatus` via `fu_struct_intel_cvs_status_parse_bytes()`. Per `plugins/intel-cvs/fu-intel-cvs.rs`, `FuStructIntelCvsProbe` (28 bytes: 4x`u32le` + 2x`u16le` + `u32le` + `u32le`) and `FuStructIntelCvsStatus` (18 bytes: `u8` + 3x`u32le` + `u8` + `u32le`) are different, unrelated structs. This is almost certainly a copy-paste of `fu_intel_cvs_device_setup()`'s read call, which legitimately reads `cvs_ctrl_data_pre` sized as `FU_STRUCT_INTEL_CVS_PROBE_SIZE` and parses it as `FuStructIntelCvsProbe`.","fix":"Read `cvs_ctrl_data_fwupd` with the correct size for the struct actually being parsed:\n```c\nblob = fu_udev_device_read_sysfs_bytes(FU_UDEV_DEVICE(device),\n                                       \"cvs_ctrl_data_fwupd\",\n                                       FU_STRUCT_INTEL_CVS_STATUS_SIZE,\n                                       FU_INTEL_CVS_DEVICE_SYSFS_TIMEOUT,\n                                       error);\n```","locations":[{"ref":"plugins/intel-cvs/fu-intel-cvs-device.c:134-144","code":"  134 | \t/* read and parse the status */\n  135 | \tblob = fu_udev_device_read_sysfs_bytes(FU_UDEV_DEVICE(device),\n  136 | \t\t\t\t\t       \"cvs_ctrl_data_fwupd\",\n  137 | \t\t\t\t\t       FU_STRUCT_INTEL_CVS_PROBE_SIZE,\n  138 | \t\t\t\t\t       FU_INTEL_CVS_DEVICE_SYSFS_TIMEOUT,\n  139 | \t\t\t\t\t       error);\n  140 | \tif (blob == NULL)\n  141 | \t\treturn FALSE;\n  142 | \tst_status = fu_struct_intel_cvs_status_parse_bytes(blob, 0x0, error);\n  143 | \tif (st_status == NULL)\n  144 | \t\treturn FALSE;","lines":11,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/intel-cvs/fu-intel-cvs-device.c#L134-L144"}]},
{"id":"CPY_8","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"`fu_bios_setting_get_key()` in `fu-bios-settings.c` has a defensive NULL check `g_return_val_if_fail(&value_out != NULL, FALSE);` that takes the address of the local parameter `value_out` (`gchar **value_out`), which is a stack variable and can never be `NULL`. This makes the guard a permanent no-op; a caller that mistakenly passes `value_out == NULL` is not caught here and will instead crash later inside `g_file_get_contents()`/`g_strchomp(*value_out)`.","fix":"Check the pointer itself, not its address:\n```c\ng_return_val_if_fail(value_out != NULL, FALSE);\n```","locations":[{"ref":"libfwupdplugin/fu-bios-settings.c:61-80","code":"   61 | static gboolean\n   62 | fu_bios_setting_get_key(FwupdBiosSetting *attr, /* nocheck:name */\n   63 | \t\t\tconst gchar *key,\n   64 | \t\t\tgchar **value_out,\n   65 | \t\t\tGError **error)\n   66 | {\n   67 | \tg_autofree gchar *tmp = NULL;\n   68 | \n   69 | \tg_return_val_if_fail(FWUPD_IS_BIOS_SETTING(attr), FALSE);\n   70 | \tg_return_val_if_fail(&value_out != NULL, FALSE);\n   71 | \n   72 | \ttmp = g_build_filename(fwupd_bios_setting_get_path(attr), key, NULL);\n   73 | \tif (!g_file_get_contents(tmp, value_out, NULL, error)) {\n   74 | \t\tg_prefix_error(error, \"failed to load %s: \", key);\n   75 | \t\tfwupd_error_convert(error);\n   76 | \t\treturn FALSE;\n   77 | \t}\n   78 | \tg_strchomp(*value_out);\n   79 | \treturn TRUE;\n   80 | }","lines":20,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-bios-settings.c#L61-L80"}]},
{"id":"CPY_9","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `libfwupdplugin/fu-cfu.rs`, `FuStructCfuOfferRsp` declares the field `_reserved3` twice (once holding `[u8; 3]` before `status` and again holding `[u8; 3]` after it). This is almost certainly a copy-paste mistake where the final padding field should have been named `_reserved4`; the struct still totals the correct 16 bytes for the CFU offer response, but the duplicate identifier makes the wire layout harder to read/maintain and could confuse the `.rs` struct-generator tooling that keys accessors off field names.","fix":"Rename the second occurrence from `_reserved3: [u8; 3]` to `_reserved4: [u8; 3]` so every field name in `FuStructCfuOfferRsp` is unique.","locations":[{"ref":"libfwupdplugin/fu-cfu.rs:64-74","code":"   64 | #[derive(Parse)]\n   65 | #[repr(C, packed)]\n   66 | struct FuStructCfuOfferRsp {\n   67 |     _reserved1: [u8; 3],\n   68 |     token: u8,\n   69 |     _reserved2: [u8; 4],\n   70 |     rr_code: FuCfuRrCode,\n   71 |     _reserved3: [u8; 3],\n   72 |     status: FuCfuOfferStatus,\n   73 |     _reserved3: [u8; 3],\n   74 | }","lines":11,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-cfu.rs#L64-L74"}]},
{"id":"CPY_10","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"medium","description":"In `plugins/algoltek-usb/fu-algoltek-usb-device.c`, `fu_algoltek_usb_device_ers` sends `st->buf->len` (the full, fixed 11-byte `FuStructAlgoltekCmdAddressPkt` buffer) as the USB control-transfer length, whereas every sibling command builder that uses the same struct - `fu_algoltek_usb_device_rst`, `fu_algoltek_usb_device_wrr`, `fu_algoltek_usb_device_bot` (and `fu_algoltek_usb_device_en`) - instead sends `st->buf->data[0]` (the logical `len` field that was explicitly set to a smaller value such as 3, 4, 5 or 7) and even validates `st->buf->data[0] > st->buf->len` first. `fu_algoltek_usb_device_ers` neither performs that validation nor uses the declared length, so it always transmits the full padded struct instead of the intended truncated command, unlike its siblings.","fix":"Make `fu_algoltek_usb_device_ers` consistent with `fu_algoltek_usb_device_rst`/`_wrr`/`_bot`, e.g.:\n```c\nif (st->buf->data[0] > st->buf->len) {\n    g_set_error(error, FWUPD_ERROR, FWUPD_ERROR_INVALID_DATA,\n                \"ers length invalid, 0x%x > 0x%x\", st->buf->data[0], st->buf->len);\n    return FALSE;\n}\nif (!fu_algoltek_usb_device_ctrl_transfer(self, FU_USB_DIRECTION_HOST_TO_DEVICE,\n                                          FU_ALGOLTEK_CMD_ERS, value, 0,\n                                          st->buf, st->buf->data[0], error)) {\n```","locations":[{"ref":"plugins/algoltek-usb/fu-algoltek-usb-device.c:328-355","code":"  328 | static gboolean\n  329 | fu_algoltek_usb_device_ers(FuAlgoltekUsbDevice *self,\n  330 | \t\t\t   guint erase_type,\n  331 | \t\t\t   guint8 sector,\n  332 | \t\t\t   GError **error)\n  333 | {\n  334 | \tguint16 value;\n  335 | \tg_autoptr(FuStructAlgoltekCmdAddressPkt) st = fu_struct_algoltek_cmd_address_pkt_new();\n  336 | \n  337 | \tfu_struct_algoltek_cmd_address_pkt_set_len(st, 3);\n  338 | \tfu_struct_algoltek_cmd_address_pkt_set_cmd(st, FU_ALGOLTEK_CMD_ERS);\n  339 | \tfu_struct_algoltek_cmd_address_pkt_set_checksum(st,\n  340 | \t\t\t\t\t\t\t~fu_sum8(st->buf->data, st->buf->len) + 1);\n  341 | \n  342 | \tvalue = (erase_type << 8) | sector;\n  343 | \tif (!fu_algoltek_usb_device_ctrl_transfer(self,\n  344 | \t\t\t\t\t\t  FU_USB_DIRECTION_HOST_TO_DEVICE,\n  345 | \t\t\t\t\t\t  FU_ALGOLTEK_CMD_ERS,\n  346 | \t\t\t\t\t\t  value,\n  347 | \t\t\t\t\t\t  0,\n  348 | \t\t\t\t\t\t  st->buf,\n  349 | \t\t\t\t\t\t  st->buf->len,\n  350 | \t\t\t\t\t\t  error)) {\n  351 | \t\tg_prefix_error_literal(error, \"data clear failure: \");\n  352 | \t\treturn FALSE;\n  353 | \t}\n  354 | \treturn TRUE;\n  355 | }","lines":28,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/algoltek-usb/fu-algoltek-usb-device.c#L328-L355"}]},
{"id":"CPY_11","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"`fu_aver_hid_device_wait_for_untar_cb` (`plugins/aver-hid/fu-aver-hid-device.c:295-318`) is the only ISP status-polling callback in the file that omits the `fu_struct_aver_hid_res_isp_status_validate()` call. Every sibling function that reads a `FuStructAverHidResIspStatus` response (`fu_aver_hid_device_ensure_status`, `fu_aver_hid_device_wait_for_ready_cb`, `fu_aver_hid_device_isp_file_dnload`, `fu_aver_hid_device_isp_file_start`, `fu_aver_hid_device_isp_file_end`, `fu_aver_hid_device_wait_for_reboot_cb`) validates the response's fixed header fields before calling `fu_struct_aver_hid_res_isp_status_get_status()`. Skipping the check here means a malformed/unexpected HID response is not detected before its `status` field is used to drive the untar-wait retry loop.","fix":"Add the missing validation call before reading the status, consistent with the other callbacks:\n```c\nif (!fu_aver_hid_device_transfer(self, st_req->buf, st_res->buf, error))\n\treturn FALSE;\nif (!fu_struct_aver_hid_res_isp_status_validate(st_res->buf->data, st_res->buf->len, 0x0, error))\n\treturn FALSE;\n```","locations":[{"ref":"plugins/aver-hid/fu-aver-hid-device.c:295-318","code":"  295 | fu_aver_hid_device_wait_for_untar_cb(FuDevice *device, gpointer user_data, GError **error)\n  296 | {\n  297 | \tFuAverHidDevice *self = FU_AVER_HID_DEVICE(device);\n  298 | \tg_autoptr(FuStructAverHidReqIspFileEnd) st_req = fu_struct_aver_hid_req_isp_file_end_new();\n  299 | \tg_autoptr(FuStructAverHidResIspStatus) st_res = fu_struct_aver_hid_res_isp_status_new();\n  300 | \n  301 | \tfu_struct_aver_hid_req_isp_file_end_set_custom_isp_cmd(st_req,\n  302 | \t\t\t\t\t\t\t       FU_AVER_HID_CUSTOM_ISP_CMD_STATUS);\n  303 | \tif (!fu_aver_hid_device_transfer(self, st_req->buf, st_res->buf, error))\n  304 | \t\treturn FALSE;\n  305 | \n  306 | \tg_info(\"isp status: %s\",\n  307 | \t       fu_aver_hid_status_to_string(fu_struct_aver_hid_res_isp_status_get_status(st_res)));\n  308 | \tif (fu_struct_aver_hid_res_isp_status_get_status(st_res) != FU_AVER_HID_STATUS_WAITUSR) {\n  309 | \t\tg_set_error(error,\n  310 | \t\t\t    FWUPD_ERROR,\n  311 | \t\t\t    FWUPD_ERROR_BUSY,\n  312 | \t\t\t    \"device has status %s\",\n  313 | \t\t\t    fu_aver_hid_status_to_string(\n  314 | \t\t\t\tfu_struct_aver_hid_res_isp_status_get_status(st_res)));\n  315 | \t\treturn FALSE;\n  316 | \t}\n  317 | \treturn TRUE;\n  318 | }","lines":24,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/aver-hid/fu-aver-hid-device.c#L295-L318"}]},
{"id":"CPY_12","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"In `fu_genesys_gl32xx_device_ensure_cid()`, `cmd` is set to either `cmd_gl3224_cid` or `cmd_gl323x_cid` depending on `model`, but the call to `fu_block_device_sg_io_cmd_read()` always passes `sizeof(cmd_gl323x_cid)` as the command length instead of `sizeof(cmd)`/the size of whichever array was actually selected. This currently works only because both arrays happen to be 6 bytes long; if either array's size were to change independently in the future, the wrong command length would be sent for the other model, silently corrupting the SCSI/ATA command sent to the device.","fix":"Use the size of the array pointed to by `cmd` rather than hard-coding one variant's `sizeof`, e.g. track the length alongside the pointer: ```c\nconst guint8 *cmd = NULL;\ngsize cmdsz = 0;\nswitch (model) {\ncase 0x0749:\n    cmd = cmd_gl3224_cid;\n    cmdsz = sizeof(cmd_gl3224_cid);\n    break;\ncase 0x0764:\n    cmd = cmd_gl323x_cid;\n    cmdsz = sizeof(cmd_gl323x_cid);\n    break;\n...\n}\n...\nfu_block_device_sg_io_cmd_read(FU_BLOCK_DEVICE(self), cmd, cmdsz, data, sizeof(data), error)\n```","locations":[{"ref":"plugins/genesys-gl32xx/fu-genesys-gl32xx-device.c:357-389","code":"  357 | \tconst guint8 cmd_gl3224_cid[] = {0xE4, 0x01, 0xBF, 0x80, 0x04, 0x00};\n  358 | \t/* nocheck:magic */\n  359 | \tconst guint8 cmd_gl323x_cid[] = {0xE4, 0x01, 0x35, 0x00, 0x04, 0x00};\n  360 | \tconst guint8 *cmd = NULL;\n  361 | \tguint16 model = fu_device_get_pid(FU_DEVICE(self));\n  362 | \tguint8 data[4] = {0};\n  363 | \n  364 | \tif (self->compatible_model != 0)\n  365 | \t\tmodel = self->compatible_model;\n  366 | \n  367 | \tswitch (model) {\n  368 | \tcase 0x0749:\n  369 | \t\tcmd = cmd_gl3224_cid;\n  370 | \t\tbreak;\n  371 | \tcase 0x0764:\n  372 | \t\tcmd = cmd_gl323x_cid;\n  373 | \t\tbreak;\n  374 | \tdefault:\n  375 | \t\tg_set_error(error,\n  376 | \t\t\t    FWUPD_ERROR,\n  377 | \t\t\t    FWUPD_ERROR_NOT_FOUND,\n  378 | \t\t\t    \"unsupported model [0x%04X]\",\n  379 | \t\t\t    model);\n  380 | \t\treturn FALSE;\n  381 | \t}\n  382 | \n  383 | \tif (!fu_block_device_sg_io_cmd_read(FU_BLOCK_DEVICE(self),\n  384 | \t\t\t\t\t    cmd,\n  385 | \t\t\t\t\t    sizeof(cmd_gl323x_cid),\n  386 | \t\t\t\t\t    data,\n  387 | \t\t\t\t\t    sizeof(data),\n  388 | \t\t\t\t\t    error))\n  389 | \t\treturn FALSE;","lines":33,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/genesys-gl32xx/fu-genesys-gl32xx-device.c#L357-L389"}]},
{"id":"CPY_13","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `fu_goodix_moc_device_cmd_recv` (return type `GByteArray *`), the error path after a failed `fu_crc32_safe()` call does `return FALSE;` instead of `return NULL;`. `FALSE` is `0`, which happens to convert to a null pointer on all real platforms, but it is a type mismatch (returning a `gboolean` from a `GByteArray *`-returning function) and is inconsistent with every other error path in the same function, which correctly does `return NULL;`.","fix":"Change the erroneous return to match the function's return type:\n```c\nif (!fu_crc32_safe(FU_CRC_KIND_B32_STANDARD,\n\t\t\t   reply->data,\n\t\t\t   reply->len,\n\t\t\t   0x0,\n\t\t\t   crc_offset,\n\t\t\t   &crc_actual,\n\t\t\t   error))\n\treturn NULL; /* was: return FALSE; */\n```","locations":[{"ref":"plugins/goodix-moc/fu-goodix-moc-device.c:162","code":"  162 | \t\t\treturn FALSE;","lines":1,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/goodix-moc/fu-goodix-moc-device.c#L162"}]},
{"id":"CPY_14","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"medium","description":"In `fu_jabra_gnp_write_chunks()` the wraparound check `fu_memread_uint16(rx_data.rxbuf + 7, G_LITTLE_ENDIAN) == (chunk_number % 0xFFFF) - 1` computes `(chunk_number % 0xFFFF) - 1` instead of the presumably-intended `(chunk_number - 1) % 0xFFFF`. For `chunk_number == 0` this evaluates to `-1`, which (promoted to `int` and compared against an unsigned `guint16` value) can never match any acknowledgement the device sends, so the intended \"previous chunk, with wraparound\" comparison is dead for the wraparound case. It happens to behave like `chunk_number - 1` for all values below `0xFFFF`, masking the bug in practice, but the wraparound branch it was seemingly written for never actually works.","fix":"Use `((chunk_number + 0xFFFF) % 0xFFFF)` (equivalently, compute `(guint16)(chunk_number - 1)`) so the intended wraparound comparison actually matches:\n```c\nif (fu_memread_uint16(rx_data.rxbuf + 7, G_LITTLE_ENDIAN) == chunk_number ||\n    fu_memread_uint16(rx_data.rxbuf + 7, G_LITTLE_ENDIAN) == (guint16)(chunk_number - 1)) {\n```","locations":[{"ref":"plugins/jabra-gnp/fu-jabra-gnp-common.c:717-719","code":"  717 | \t\t\tif (fu_memread_uint16(rx_data.rxbuf + 7, G_LITTLE_ENDIAN) == chunk_number ||\n  718 | \t\t\t    fu_memread_uint16(rx_data.rxbuf + 7, G_LITTLE_ENDIAN) ==\n  719 | \t\t\t\t(chunk_number % 0xFFFF) - 1) {","lines":3,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/jabra-gnp/fu-jabra-gnp-common.c#L717-L719"}]},
{"id":"CPY_15","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"In `fu_engine_install_release`, the calls `fu_engine_add_release_metadata(self, release, error)` and `fu_engine_add_release_plugin_metadata(self, release, plugin, error)` are each invoked twice in a row (once under the `/* add metadata */` comment and again immediately after under the `/* add device to database */` comment), with no state change between the two calls. This duplicates work: `fu_engine_add_release_metadata` calls `fu_engine_get_report_metadata`, which re-reads `/proc/stat`, `os-release`, kernel cmdline, SELinux status, and other host files a second time for no benefit, and duplicate metadata dictionaries are merged into `release` twice.","fix":"Remove the second, redundant pair of calls so metadata is only added once:\n```c\n/* add metadata */\nif (!fu_engine_add_release_metadata(self, release, error))\n\treturn FALSE;\nif (!fu_engine_add_release_plugin_metadata(self, release, plugin, error))\n\treturn FALSE;\n\nif ((flags & FWUPD_INSTALL_FLAG_NO_HISTORY) == 0) {\n\tif (!fu_history_add_device(self->history, device, release, error))\n\t\treturn FALSE;\n}\n```","locations":[{"ref":"src/fu-engine.c:3010-3020","code":" 3010 | \t/* add metadata */\n 3011 | \tif (!fu_engine_add_release_metadata(self, release, error))\n 3012 | \t\treturn FALSE;\n 3013 | \tif (!fu_engine_add_release_plugin_metadata(self, release, plugin, error))\n 3014 | \t\treturn FALSE;\n 3015 | \n 3016 | \t/* add device to database */\n 3017 | \tif (!fu_engine_add_release_metadata(self, release, error))\n 3018 | \t\treturn FALSE;\n 3019 | \tif (!fu_engine_add_release_plugin_metadata(self, release, plugin, error))\n 3020 | \t\treturn FALSE;","lines":11,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/src/fu-engine.c#L3010-L3020"}]},
{"id":"CPY_16","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"Both `fu_history_modify_device` and `fu_history_modify_device_release` in `src/fu-history.c` prepare an `UPDATE history SET ...` statement whose SQL text does not contain a `?5` placeholder anywhere (the parameters used are `?1`-`?4`, `?6`, `?7`, and `?8`), yet both functions call `sqlite3_bind_text(stmt, 5, fu_device_get_version(device), -1, SQLITE_STATIC);`. Because SQLite silently allocates parameter slots up to the highest referenced index, this bind succeeds but the bound value (`fu_device_get_version(device)`) is never actually written anywhere - it is dead code, almost certainly a leftover from an earlier version of the query that included a `version_old = ?5` (or similar) column update which was later removed without also removing the corresponding bind call.","fix":"Remove the stray `sqlite3_bind_text(stmt, 5, fu_device_get_version(device), -1, SQLITE_STATIC);` calls in both functions, or, if updating `version_old` on modify was actually intended, add `\"version_old = ?5, \"` to both SQL statements so the bound value is used:\n```c\n\"UPDATE history SET \"\n\"update_state = ?1, \"\n\"update_error = ?2, \"\n\"version_old = ?5, \"\n\"checksum_device = ?6, \"\n...\n```","locations":[{"ref":"src/fu-history.c:724-735","code":"  724 | \trc = sqlite3_prepare_v2(self->db,\n  725 | \t\t\t\t\"UPDATE history SET \"\n  726 | \t\t\t\t\"update_state = ?1, \"\n  727 | \t\t\t\t\"update_error = ?2, \"\n  728 | \t\t\t\t\"checksum_device = ?6, \"\n  729 | \t\t\t\t\"device_modified = ?7, \"\n  730 | \t\t\t\t\"install_duration = ?8, \"\n  731 | \t\t\t\t\"flags = ?3 \"\n  732 | \t\t\t\t\"WHERE device_id = ?4;\",\n  733 | \t\t\t\t-1,\n  734 | \t\t\t\t&stmt,\n  735 | \t\t\t\tNULL);","lines":12,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/src/fu-history.c#L724-L735"},{"ref":"src/fu-history.c:749","code":"  749 | \tsqlite3_bind_text(stmt, 5, fu_device_get_version(device), -1, SQLITE_STATIC);","lines":1,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/src/fu-history.c#L749"},{"ref":"src/fu-history.c:808-819","code":"  808 | \trc = sqlite3_prepare_v2(self->db,\n  809 | \t\t\t\t\"UPDATE history SET \"\n  810 | \t\t\t\t\"update_state = ?1, \"\n  811 | \t\t\t\t\"update_error = ?2, \"\n  812 | \t\t\t\t\"checksum_device = ?6, \"\n  813 | \t\t\t\t\"device_modified = ?7, \"\n  814 | \t\t\t\t\"metadata = ?8, \"\n  815 | \t\t\t\t\"flags = ?3 \"\n  816 | \t\t\t\t\"WHERE device_id = ?4;\",\n  817 | \t\t\t\t-1,\n  818 | \t\t\t\t&stmt,\n  819 | \t\t\t\tNULL);","lines":12,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/src/fu-history.c#L808-L819"},{"ref":"src/fu-history.c:833","code":"  833 | \tsqlite3_bind_text(stmt, 5, fu_device_get_version(device), -1, SQLITE_STATIC);","lines":1,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/src/fu-history.c#L833"}]},
{"id":"CPY_17","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"very_easy","description":"In `libfwupdplugin/fu-device.h`, the macro `fu_device_has_flag` is `#define`d twice in a row with identical bodies. This is a leftover copy-paste duplicate; while harmless (identical redefinitions are accepted silently by the preprocessor), it is dead, confusing code.","fix":"Delete the duplicate line so `fu_device_has_flag` is defined only once:\n```c\n#define fu_device_has_flag(d, v)\t fwupd_device_has_flag(FWUPD_DEVICE(d), v)\n```","locations":[{"ref":"libfwupdplugin/fu-device.h:143-144","code":"  143 | #define fu_device_has_flag(d, v)\t fwupd_device_has_flag(FWUPD_DEVICE(d), v)\n  144 | #define fu_device_has_flag(d, v)\t fwupd_device_has_flag(FWUPD_DEVICE(d), v)","lines":2,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-device.h#L143-L144"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"medium","description":"`fu_cabinet_verify_payload()` and `fu_cabinet_verify_payload_target()` call `fu_jcat_context_verify_item(self->jcat_context, ...)` / `fu_jcat_context_verify_target(self->jcat_context, ...)` without ever checking `self->jcat_context != NULL`. `self->jcat_context` is explicitly documented as `(nullable)` by `fu_cabinet_set_jcat_context()`, and the sibling function `fu_cabinet_build_silo_metainfo()` correctly guards the analogous call with `else if (self->jcat_context != NULL)`. If `self->jcat_context` is `NULL`, `fu_jcat_context_verify_item()`/`fu_jcat_context_verify_target()` fail their internal `g_return_val_if_fail(FU_IS_JCAT_CONTEXT(self), NULL)` check and return `NULL` *without ever setting `*error`*. Back in `fu_cabinet_verify_payload()` this becomes `return FALSE;` with `error_payload` left completely unset (a no-op `g_prefix_error_literal()` on a NULL `GError` does nothing). The caller, `fu_cabinet_parse_release()`, then unconditionally does `g_info(\"failed to verify payload %s: %s\", basename, error_payload->message);` which dereferences the still-NULL `error_payload`, crashing the daemon while parsing an untrusted `.cab` file.","fix":"Guard the payload-verification path the same way `fu_cabinet_build_silo_metainfo()` does, and make the caller defensive against a verification helper that fails without populating `error`:\n```c\nstatic gboolean\nfu_cabinet_verify_payload(FuCabinet *self, ...)\n{\n\t...\n\tif (self->jcat_context == NULL) {\n\t\tg_set_error_literal(error, FWUPD_ERROR, FWUPD_ERROR_NOT_SUPPORTED,\n\t\t\t\t    \"no jcat context set\");\n\t\treturn FALSE;\n\t}\n\t...\n}\n```\nand in `fu_cabinet_parse_release()` do not assume `error_payload` was set:\n```c\nif (!fu_cabinet_verify_payload(self, basename, img_blob, jcat_flags, &error_payload)) {\n\tg_info(\"failed to verify payload %s: %s\", basename,\n\t       error_payload != NULL ? error_payload->message : \"unknown error\");\n}\n```","locations":[{"ref":"src/fu-cabinet.c:160-202","code":"  160 | static gboolean\n  161 | fu_cabinet_verify_payload(FuCabinet *self,\n  162 | \t\t\t  const gchar *basename,\n  163 | \t\t\t  FuFirmware *img_blob,\n  164 | \t\t\t  FuJcatVerifyFlags jcat_flags,\n  165 | \t\t\t  GError **error)\n  166 | {\n  167 | \tg_autoptr(GBytes) blob = NULL;\n  168 | \tg_autoptr(GPtrArray) results = NULL;\n  169 | \tg_autoptr(FwupdJcatItem) item = NULL;\n  170 | \n  171 | \t/* get item */\n  172 | \titem = fwupd_jcat_file_get_item_by_id(self->jcat_file, basename, error);\n  173 | \tif (item == NULL)\n  174 | \t\treturn FALSE;\n  175 | \n  176 | \t/* the jcat file signed the *checksum of the payload*, not the payload itself */\n  177 | \tif (fwupd_jcat_item_has_target(item)) {\n  178 | \t\treturn fu_cabinet_verify_payload_target(self,\n  179 | \t\t\t\t\t\t\tbasename,\n  180 | \t\t\t\t\t\t\timg_blob,\n  181 | \t\t\t\t\t\t\tjcat_flags,\n  182 | \t\t\t\t\t\t\terror);\n  183 | \t}\n  184 | \n  185 | \t/* verify the binary item */\n  186 | \tblob = fu_firmware_get_bytes(img_blob, error);\n  187 | \tif (blob == NULL)\n  188 | \t\treturn FALSE;\n  189 | \tresults = fu_jcat_context_verify_item(self->jcat_context,\n  190 | \t\t\t\t\t      blob,\n  191 | \t\t\t\t\t      item,\n  192 | \t\t\t\t\t      jcat_flags | FU_JCAT_VERIFY_FLAG_REQUIRE_CHECKSUM |\n  193 | \t\t\t\t\t\t  FU_JCAT_VERIFY_FLAG_REQUIRE_SIGNATURE,\n  194 | \t\t\t\t\t      error);\n  195 | \tif (results == NULL) {\n  196 | \t\tg_prefix_error_literal(error, \"failed to verify item: \");\n  197 | \t\treturn FALSE;\n  198 | \t}\n  199 | \n  200 | \t/* success */\n  201 | \treturn TRUE;\n  202 | }","lines":43,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/src/fu-cabinet.c#L160-L202"},{"ref":"src/fu-cabinet.c:107-158","code":"  107 | static gboolean\n  108 | fu_cabinet_verify_payload_target(FuCabinet *self,\n  109 | \t\t\t\t const gchar *basename,\n  110 | \t\t\t\t FuFirmware *img_blob,\n  111 | \t\t\t\t FuJcatVerifyFlags jcat_flags,\n  112 | \t\t\t\t GError **error)\n  113 | {\n  114 | \tg_autofree gchar *checksum_sha256 = NULL;\n  115 | \tg_autofree gchar *checksum_sha512 = NULL;\n  116 | \tg_autoptr(GPtrArray) results = NULL;\n  117 | \tg_autoptr(FuInputStream) stream = NULL;\n  118 | \tg_autoptr(FwupdJcatBlob) blob_target_sha256 = NULL;\n  119 | \tg_autoptr(FwupdJcatBlob) blob_target_sha512 = NULL;\n  120 | \tg_autoptr(FwupdJcatItem) item = NULL;\n  121 | \tg_autoptr(FwupdJcatItem) item_target = fwupd_jcat_item_new(basename);\n  122 | \n  123 | \t/* get item */\n  124 | \titem = fwupd_jcat_file_get_item_by_id(self->jcat_file, basename, error);\n  125 | \tif (item == NULL)\n  126 | \t\treturn FALSE;\n  127 | \n  128 | \t/* add SHA-256 */\n  129 | \tstream = fu_firmware_get_stream(img_blob, error);\n  130 | \tif (stream == NULL)\n  131 | \t\treturn FALSE;\n  132 | \tchecksum_sha256 = fu_input_stream_compute_checksum(stream, G_CHECKSUM_SHA256, error);\n  133 | \tif (checksum_sha256 == NULL)\n  134 | \t\treturn FALSE;\n  135 | \tblob_target_sha256 = fwupd_jcat_blob_new_utf8(FWUPD_JCAT_BLOB_KIND_SHA256, checksum_sha256);\n  136 | \tfwupd_jcat_item_add_blob(item_target, blob_target_sha256);\n  137 | \n  138 | \t/* add SHA-512 */\n  139 | \tchecksum_sha512 = fu_input_stream_compute_checksum(stream, G_CHECKSUM_SHA512, error);\n  140 | \tif (checksum_sha512 == NULL)\n  141 | \t\treturn FALSE;\n  142 | \tblob_target_sha512 = fwupd_jcat_blob_new_utf8(FWUPD_JCAT_BLOB_KIND_SHA512, checksum_sha512);\n  143 | \tfwupd_jcat_item_add_blob(item_target, blob_target_sha512);\n  144 | \n  145 | \tresults = fu_jcat_context_verify_target(self->jcat_context,\n  146 | \t\t\t\t\t\titem_target,\n  147 | \t\t\t\t\t\titem,\n  148 | \t\t\t\t\t\tjcat_flags | FU_JCAT_VERIFY_FLAG_REQUIRE_CHECKSUM |\n  149 | \t\t\t\t\t\t    FU_JCAT_VERIFY_FLAG_REQUIRE_SIGNATURE,\n  150 | \t\t\t\t\t\terror);\n  151 | \tif (results == NULL) {\n  152 | \t\tg_prefix_error_literal(error, \"failed to verify indirect item: \");\n  153 | \t\treturn FALSE;\n  154 | \t}\n  155 | \n  156 | \t/* success */\n  157 | \treturn TRUE;\n  158 | }","lines":52,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/src/fu-cabinet.c#L107-L158"},{"ref":"src/fu-cabinet.c:340-358","code":"  340 | \t/* is the payload signed? */\n  341 | \tif (fu_cabinet_trustlist_check_basename(self, basename, &release_flags_tl)) {\n  342 | \t\tg_info(\"cached verification result for %s\", basename);\n  343 | \t\trelease_flags |= (release_flags_tl & FWUPD_RELEASE_FLAG_TRUSTED_PAYLOAD);\n  344 | \t} else {\n  345 | \t\tif (!fu_cabinet_verify_payload(self,\n  346 | \t\t\t\t\t       basename,\n  347 | \t\t\t\t\t       img_blob,\n  348 | \t\t\t\t\t       jcat_flags,\n  349 | \t\t\t\t\t       &error_payload)) {\n  350 | \t\t\tg_info(\"failed to verify payload %s: %s\", basename, error_payload->message);\n  351 | \t\t} else {\n  352 | \t\t\tg_info(\"verified payload %s\", basename);\n  353 | \t\t\trelease_flags |= FWUPD_RELEASE_FLAG_TRUSTED_PAYLOAD;\n  354 | \t\t}\n  355 | \t\t/* save the trustlist, so that if there are multiple metainfos pointing to the\n  356 | \t\t * same payload we only hash and verify once */\n  357 | \t\tfu_cabinet_trustlist_add_basename(self, basename, release_flags);\n  358 | \t}","lines":19,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/src/fu-cabinet.c#L340-L358"},{"ref":"src/fu-cabinet.c:585-591","code":"  585 | \t\tif (results == NULL) {\n  586 | \t\t\tg_info(\"failed to verify %s: %s\", fn, error_local->message);\n  587 | \t\t} else {\n  588 | \t\t\tg_info(\"verified metadata %s: %u\", fn, results->len);\n  589 | \t\t\trelease_flags |= FWUPD_RELEASE_FLAG_TRUSTED_METADATA;\n  590 | \t\t}\n  591 | \t}","lines":7,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/src/fu-cabinet.c#L585-L591"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"easy","description":"In `main()` in `src/fu-main.c`, the single `GError *error` variable is reused across multiple calls without being checked or cleared. `g_file_monitor_file()` is called with `&error` and its return value (`argv0_monitor`) is used unconditionally afterwards (passed straight into `g_signal_connect(G_FILE_MONITOR(argv0_monitor), ...)`) without checking whether it is `NULL` or whether `error` was set. If `g_file_monitor_file()` fails (e.g. inotify unavailable/exhausted, common in containers/sandboxes), `error` is left non-NULL for the remainder of `main()`. Later, the same `error` pointer is passed to `fu_daemon_start(daemon, &error)`. `fu_daemon_start()` (in `src/fu-daemon.c`) begins with `g_return_val_if_fail(error == NULL || *error == NULL, FALSE);`, so it will immediately fail (after a `GLib-CRITICAL` warning) and return `FALSE` without ever starting the daemon - purely because of the earlier, unrelated, silently-ignored file-monitor failure. The user sees a confusing `\"Failed to start daemon: <file monitor error message>\"` and the whole fwupd service fails to start.","fix":"Check the result of `g_file_monitor_file()` and clear/report the error before continuing, and never reuse a `GError*` that may already be set. For example:\n```c\nargv0_monitor = g_file_monitor_file(argv0_file, G_FILE_MONITOR_NONE, NULL, &error);\nif (argv0_monitor == NULL) {\n\tg_warning(\"failed to monitor %s: %s\", argv[0], error->message);\n\tg_clear_error(&error);\n} else {\n\tg_signal_connect(G_FILE_MONITOR(argv0_monitor),\n\t\t\t \"changed\",\n\t\t\t G_CALLBACK(fu_main_argv_changed_cb),\n\t\t\t daemon);\n}\n```\nThis guarantees `error` is `NULL` again before it is passed to `fu_daemon_start(daemon, &error)`.","locations":[{"ref":"src/fu-main.c:160-189","code":"  160 | \targv0_monitor = g_file_monitor_file(argv0_file, G_FILE_MONITOR_NONE, NULL, &error);\n  161 | \tg_signal_connect(G_FILE_MONITOR(argv0_monitor),\n  162 | \t\t\t \"changed\",\n  163 | \t\t\t G_CALLBACK(fu_main_argv_changed_cb),\n  164 | \t\t\t daemon);\n  165 | \n  166 | #if GLIB_CHECK_VERSION(2, 64, 0)\n  167 | \t/* shut down on low memory event as we can just rescan hardware */\n  168 | \tmemory_monitor = g_memory_monitor_dup_default();\n  169 | \tif (memory_monitor != NULL) {\n  170 | \t\tg_signal_connect(G_MEMORY_MONITOR(memory_monitor),\n  171 | \t\t\t\t \"low-memory-warning\",\n  172 | \t\t\t\t G_CALLBACK(fu_main_memory_monitor_warning_cb),\n  173 | \t\t\t\t daemon);\n  174 | \t}\n  175 | #endif\n  176 | \n  177 | \t/* Only timeout and close the mainloop if we have specified it\n  178 | \t * on the command line */\n  179 | \tif (immediate_exit)\n  180 | \t\tg_idle_add(fu_main_timed_exit_cb, daemon);\n  181 | \telse if (timed_exit)\n  182 | \t\tg_timeout_add_seconds(5, fu_main_timed_exit_cb, daemon);\n  183 | \n  184 | \t/* wait */\n  185 | \tg_message(\"fwupd %s ready for requests (locale %s)\", VERSION, g_getenv(\"LANG\"));\n  186 | \tif (!fu_daemon_start(daemon, &error)) {\n  187 | \t\tg_printerr(\"Failed to start daemon: %s\\n\", error->message);\n  188 | \t\treturn EXIT_FAILURE;\n  189 | \t}","lines":30,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/src/fu-main.c#L160-L189"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"In both `contrib/ci/check-cpu.py` and `contrib/ci/check-rss.py`, `value` is initialized to `0` and only updated if a specific marker string is found in the tool's stderr (`\"Collected : \"` for callgrind, `\"in use at exit: \"` for memcheck). If the marker is absent - e.g. because the valgrind version changes its output format, the locale changes number formatting, or the tool crashes before printing summary stats - the loop silently leaves `value = 0` and the script prints `CPU usage was 0Mcycles` / `RSS usage was 0kB` and returns success (`0`), masking a real failure to measure anything instead of erroring out.","fix":"Track whether the marker was actually found and fail loudly if not, e.g.:\n```python\nfound = False\nfor line in rc.stderr.split(\"\\n\"):\n    if line.find(\"Collected : \") != -1:\n        value = int(line.split(\" \")[3])\n        found = True\nif not found:\n    print(\"could not parse valgrind output\")\n    return 1\n```","locations":[{"ref":"contrib/ci/check-cpu.py:35-43","code":"   35 |     value: int = 0\n   36 |     for line in rc.stderr.split(\"\\n\"):\n   37 |         if line.find(\"Collected : \") != -1:\n   38 |             value = int(line.split(\" \")[3])\n   39 |     if limit and value > limit * 1_000_000:\n   40 |         print(f\"CPU usage was {value//1_000_000}Mcycles (limit of {limit}Mcycles)\")\n   41 |         return 1\n   42 |     print(f\"CPU usage was {value//1_000_000}Mcycles\")\n   43 |     return 0","lines":9,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/contrib/ci/check-cpu.py#L35-L43"},{"ref":"contrib/ci/check-rss.py:35-43","code":"   35 |     value: int = 0\n   36 |     for line in rc.stderr.split(\"\\n\"):\n   37 |         if line.find(\"in use at exit: \") != -1:\n   38 |             value = int(line.split(\" \")[9].strip().replace(\",\", \"\"))\n   39 |     if limit and value > limit * 1024:\n   40 |         print(f\"RSS usage was {value//1024}kB (limit of {limit}kB)\")\n   41 |         return 1\n   42 |     print(f\"RSS usage was {value//1024}kB\")\n   43 |     return 0","lines":9,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/contrib/ci/check-rss.py#L35-L43"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`_fu_strtoull_simple()` is supposed to report a parse error when the input cannot be fully consumed as a number, via `if ((gsize)(endptr - str) != strlen(str) && *endptr != '\\n')`. For an empty string, `g_ascii_strtoull(\"\", &endptr, base)` returns `0` with `endptr == str`, so `(gsize)(endptr - str) == 0 == strlen(str)`, and the first half of the `&&` is `false` - the function returns `TRUE` with `*value = 0` instead of reporting `FWUPD_ERROR_INVALID_DATA`. Called from `fwupd_bios_setting_validate_value()` on the `FWUPD_BIOS_SETTING_KIND_INTEGER` path, this means writing an empty-string value to an integer BIOS setting silently passes bounds validation as though `0` were supplied (as long as `0` is within `[lower_bound, upper_bound]`), while the actual empty string is still forwarded unchanged to `klass->write_value()`.","fix":"Reject empty input explicitly before parsing:\n\n```c\nstatic gboolean\n_fu_strtoull_simple(const gchar *str, guint64 *value, GError **error)\n{\n\tgchar *endptr = NULL;\n\tguint base = 10;\n\n\tif (str[0] == '\\0') {\n\t\tg_set_error_literal(error, FWUPD_ERROR, FWUPD_ERROR_INVALID_DATA, \"empty value\");\n\t\treturn FALSE;\n\t}\n\t...\n```","locations":[{"ref":"libfwupd/fwupd-bios-setting.c:748-765","code":"  748 | static gboolean\n  749 | _fu_strtoull_simple(const gchar *str, guint64 *value, GError **error)\n  750 | {\n  751 | \tgchar *endptr = NULL;\n  752 | \tguint base = 10;\n  753 | \n  754 | \t/* convert */\n  755 | \tif (g_str_has_prefix(str, \"0x\")) {\n  756 | \t\tstr += 2;\n  757 | \t\tbase = 16;\n  758 | \t}\n  759 | \t*value = g_ascii_strtoull(str, &endptr, base); /* nocheck:blocked */\n  760 | \tif ((gsize)(endptr - str) != strlen(str) && *endptr != '\\n') {\n  761 | \t\tg_set_error(error, FWUPD_ERROR, FWUPD_ERROR_INVALID_DATA, \"cannot parse %s\", str);\n  762 | \t\treturn FALSE;\n  763 | \t}\n  764 | \treturn TRUE;\n  765 | }","lines":18,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupd/fwupd-bios-setting.c#L748-L765"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`fu_context_get_smbios_string()` and `fu_context_get_smbios_integer()` both take a `GError **error` parameter but, on the early-failure path where `FU_CONTEXT_FLAG_LOADED_HWINFO` is not set, they only call `g_critical()` and return `NULL` / `G_MAXUINT` without ever calling `g_set_error()` on `error`. This breaks the standard GLib contract that a function returning a failure indicator must set `error` (compare with the sibling function `fu_context_get_smbios_data()` a few lines below, which correctly does `g_set_error_literal(error, FWUPD_ERROR, FWUPD_ERROR_INTERNAL, \"no data\")` in the same situation). The bug is directly observable: `fu_device_get_smbios_string()` in `fu-device.c` calls `fu_context_get_smbios_string(priv->ctx, type, length, offset, &error_local)` and on failure does `fu_device_event_set_error(event, error_local)`, but `fu_device_event_set_error()` is documented `@error: (not nullable)` and does `g_return_if_fail(error != NULL)` - so when `error_local` stays `NULL`, this trips a GLib `CRITICAL` assertion at runtime and the caller's `error` output parameter is left unset even though the function reported failure by returning `NULL`.","fix":"Set the error in both functions before returning, matching `fu_context_get_smbios_data()`:\n\n```c\nif (!fu_context_has_flag(self, FU_CONTEXT_FLAG_LOADED_HWINFO)) {\n\tg_critical(\"cannot use SMBIOS before calling ->load_hwinfo()\");\n\tg_set_error_literal(error, FWUPD_ERROR, FWUPD_ERROR_INTERNAL, \"no data\");\n\treturn NULL; /* or G_MAXUINT for the integer variant */\n}\n```","locations":[{"ref":"libfwupdplugin/fu-context.c:536-550","code":"  536 | const gchar *\n  537 | fu_context_get_smbios_string(FuContext *self,\n  538 | \t\t\t     guint8 type,\n  539 | \t\t\t     guint8 length,\n  540 | \t\t\t     guint8 offset,\n  541 | \t\t\t     GError **error)\n  542 | {\n  543 | \tFuContextPrivate *priv = GET_PRIVATE(self);\n  544 | \tg_return_val_if_fail(FU_IS_CONTEXT(self), NULL);\n  545 | \tif (!fu_context_has_flag(self, FU_CONTEXT_FLAG_LOADED_HWINFO)) {\n  546 | \t\tg_critical(\"cannot use SMBIOS before calling ->load_hwinfo()\");\n  547 | \t\treturn NULL;\n  548 | \t}\n  549 | \treturn fu_smbios_get_string(priv->smbios, type, length, offset, error);\n  550 | }","lines":15,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-context.c#L536-L550"},{"ref":"libfwupdplugin/fu-context.c:598-612","code":"  598 | guint\n  599 | fu_context_get_smbios_integer(FuContext *self,\n  600 | \t\t\t      guint8 type,\n  601 | \t\t\t      guint8 length,\n  602 | \t\t\t      guint8 offset,\n  603 | \t\t\t      GError **error)\n  604 | {\n  605 | \tFuContextPrivate *priv = GET_PRIVATE(self);\n  606 | \tg_return_val_if_fail(FU_IS_CONTEXT(self), G_MAXUINT);\n  607 | \tif (!fu_context_has_flag(self, FU_CONTEXT_FLAG_LOADED_HWINFO)) {\n  608 | \t\tg_critical(\"cannot use SMBIOS before calling ->load_hwinfo()\");\n  609 | \t\treturn G_MAXUINT;\n  610 | \t}\n  611 | \treturn fu_smbios_get_integer(priv->smbios, type, length, offset, error);\n  612 | }","lines":15,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-context.c#L598-L612"},{"ref":"libfwupdplugin/fu-device.c:1148-1153","code":" 1148 | \t/* use context */\n 1149 | \tstr = fu_context_get_smbios_string(priv->ctx, type, length, offset, &error_local);\n 1150 | \tif (str == NULL) {\n 1151 | \t\tif (event != NULL)\n 1152 | \t\t\tfu_device_event_set_error(event, error_local);\n 1153 | \t\tg_propagate_error(error, g_steal_pointer(&error_local));","lines":6,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-device.c#L1148-L1153"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`fu_freebsd_efivars_delete_with_glob()` in `libfwupdplugin/fu-freebsd-efivars.c` initializes `gboolean rv = FALSE;` and only assigns it inside the `while` loop when a matching variable is found and `fu_freebsd_efivars_delete()` is called. If no variable matches `guid`/`name_glob`, the loop finishes without ever touching `rv`, and the function returns `FALSE` without ever calling `g_set_error*()`. Callers of a `gboolean`-returning, `GError`-taking function are entitled to assume `error` is populated whenever `FALSE` is returned; here it is silently left `NULL`.","fix":"After the loop, if no match was found, set an explicit error, e.g. `if (guidt == NULL) { g_set_error(error, FWUPD_ERROR, FWUPD_ERROR_NOT_FOUND, \"no variable matching %s found\", name_glob); return FALSE; }` (tracking whether any match was seen), so `FALSE` is never returned with `*error == NULL`.","locations":[{"ref":"libfwupdplugin/fu-freebsd-efivars.c:57-80","code":"   57 | static gboolean\n   58 | fu_freebsd_efivars_delete_with_glob(FuEfivars *efivars,\n   59 | \t\t\t\t    const gchar *guid,\n   60 | \t\t\t\t    const gchar *name_glob,\n   61 | \t\t\t\t    GError **error)\n   62 | {\n   63 | \tefi_guid_t *guidt = NULL;\n   64 | \tgchar *name = NULL;\n   65 | \tgboolean rv = FALSE;\n   66 | \tefi_guid_t guid_to_delete;\n   67 | \n   68 | \tefi_str_to_guid(guid, &guid_to_delete);\n   69 | \n   70 | \twhile (efi_get_next_variable_name(&guidt, &name) == 1) {\n   71 | \t\tif (memcmp(&guid_to_delete, guidt, sizeof(guid_to_delete)) != 0)\n   72 | \t\t\tcontinue;\n   73 | \t\tif (!g_pattern_match_simple(name, name_glob))\n   74 | \t\t\tcontinue;\n   75 | \t\trv = fu_freebsd_efivars_delete(efivars, guid, name, error);\n   76 | \t\tif (!rv)\n   77 | \t\t\tbreak;\n   78 | \t}\n   79 | \treturn rv;\n   80 | }","lines":24,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-freebsd-efivars.c#L57-L80"}]},
{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"very_easy","description":"`fu_bnr_dp_firmware_patch_boot_counter()` in plugins/bnr-dp/fu-bnr-dp-firmware.c calls `image = fu_firmware_get_bytes(FU_FIRMWARE(self), error);` and then immediately passes `g_bytes_get_data(image, NULL)` / `g_bytes_get_size(image)` to `fu_struct_bnr_dp_payload_header_parse()` without checking whether `image` is `NULL`. `fu_firmware_get_bytes()` can fail (and does return `NULL` with `error` set) if the firmware has no backing bytes/stream. Calling `g_bytes_get_data()`/`g_bytes_get_size()` on a `NULL` `GBytes` triggers `g_critical()` warnings at best and, if GLib assertions are disabled, an actual `NULL` dereference.","fix":"Check `image` for `NULL` before using it:\n```c\nimage = fu_firmware_get_bytes(FU_FIRMWARE(self), error);\nif (image == NULL)\n    return FALSE;\nst_header = fu_struct_bnr_dp_payload_header_parse(g_bytes_get_data(image, NULL),\n                              g_bytes_get_size(image),\n                              FU_BNR_DP_FIRMWARE_HEADER_OFFSET,\n                              error);\n```","locations":[{"ref":"plugins/bnr-dp/fu-bnr-dp-firmware.c:441-447","code":"  441 | \timage = fu_firmware_get_bytes(FU_FIRMWARE(self), error);\n  442 | \tst_header = fu_struct_bnr_dp_payload_header_parse(g_bytes_get_data(image, NULL),\n  443 | \t\t\t\t\t\t\t  g_bytes_get_size(image),\n  444 | \t\t\t\t\t\t\t  FU_BNR_DP_FIRMWARE_HEADER_OFFSET,\n  445 | \t\t\t\t\t\t\t  error);\n  446 | \tif (st_header == NULL)\n  447 | \t\treturn FALSE;","lines":7,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/bnr-dp/fu-bnr-dp-firmware.c#L441-L447"}]},
{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`fu_dell_dock_ec_modify_lock` in `plugins/dell-dock/fu-dell-dock-ec.c` uses `g_return_val_if_fail(target != 0, FALSE)`. `target` is `self->unlock_target`, which defaults to `0` and is only set from the `DellDockUnlockTarget` quirk key (see `fu_dell_dock_ec_set_quirk_kv`). If a quirk file is missing this key (e.g. a new/unsupported dock variant, or an operator's typo in a quirk `.conf`), `fu_dell_dock_ec_write_firmware` calls `fu_dell_dock_ec_modify_lock(self, self->unlock_target /* == 0 */, TRUE, error)`, which returns `FALSE` via `g_return_val_if_fail` *without ever setting `*error`*. The caller then propagates `FALSE` up through `fu_dell_dock_ec_write_firmware` with an unset `GError`, violating the fwupd/GLib convention that a `FALSE` return must always be accompanied by a populated `GError`, which can lead to a NULL dereference or a confusing \"unknown error\" in code further up that assumes `error->message` is valid.","fix":"Replace the precondition assertion with a real, error-setting check since `target == 0` can occur from runtime quirk data, not just programmer error:\n```c\nif (target == 0) {\n\tg_set_error_literal(error, FWUPD_ERROR, FWUPD_ERROR_NOT_SUPPORTED,\n\t\t\t    \"no unlock target configured for this device\");\n\treturn FALSE;\n}\n```","locations":[{"ref":"plugins/dell-dock/fu-dell-dock-ec.c:600-601","code":"  600 | \tg_return_val_if_fail(FU_IS_DELL_DOCK_EC(self), FALSE);\n  601 | \tg_return_val_if_fail(target != 0, FALSE);","lines":2,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/dell-dock/fu-dell-dock-ec.c#L600-L601"},{"ref":"plugins/dell-dock/fu-dell-dock-ec.c:811-812","code":"  811 | \tif (!fu_dell_dock_ec_modify_lock(self, self->unlock_target, TRUE, error))\n  812 | \t\treturn FALSE;","lines":2,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/dell-dock/fu-dell-dock-ec.c#L811-L812"}]},
{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"In `fu_igsc_device_command()` (`plugins/intel-gsc/fu-igsc-device.c:80-106`), the number of bytes actually read from the MEI/HECI device is captured in `resp_readsz` via `fu_mei_device_read()`, but this value is only used for the `fu_dump_raw` debug trace and is never validated against the expected response size (`resp_bufsz`). All of the HECI command helpers (`fu_igsc_device_get_version_raw`, `fu_igsc_device_get_aux_version`, `fu_igsc_device_get_subsystem_ids`, `fu_igsc_device_get_config`, `fu_igsc_device_update_start/data/end`) then parse `resp_buf` using the full, fixed `resp_bufsz` regardless of how many bytes the device actually returned. Because `resp_buf` is zero-initialized (`g_malloc0` or a zero-initialized stack array) before the read, a short/truncated HECI response is silently accepted and parsed as if every trailing field were legitimately `0`, instead of being reported as a transport error.","fix":"Check `resp_readsz` against the minimum expected response size in `fu_igsc_device_command()` (or have each caller check it) and return a `FWUPD_ERROR_INVALID_DATA` error when the device returns fewer bytes than the response struct requires, e.g. ```c\nif (!fu_mei_device_read(FU_MEI_DEVICE(self), resp_buf, resp_bufsz, &resp_readsz, FU_IGSC_DEVICE_MEI_READ_TIMEOUT, error))\n\treturn FALSE;\nif (resp_readsz < resp_bufsz) {\n\tg_set_error(error, FWUPD_ERROR, FWUPD_ERROR_INVALID_DATA,\n\t\t    \"HECI response truncated, got %\" G_GSIZE_FORMAT \" bytes, expected %\" G_GSIZE_FORMAT,\n\t\t    resp_readsz, resp_bufsz);\n\treturn FALSE;\n}\n```","locations":[{"ref":"plugins/intel-gsc/fu-igsc-device.c:80-106","code":"   80 | static gboolean\n   81 | fu_igsc_device_command(FuIgscDevice *self,\n   82 | \t\t       const guint8 *req_buf,\n   83 | \t\t       gsize req_bufsz,\n   84 | \t\t       guint8 *resp_buf,\n   85 | \t\t       gsize resp_bufsz,\n   86 | \t\t       GError **error)\n   87 | {\n   88 | \tgsize resp_readsz = 0;\n   89 | \n   90 | \tfu_dump_raw(G_LOG_DOMAIN, \"MEI-write\", req_buf, req_bufsz);\n   91 | \tif (!fu_mei_device_write(FU_MEI_DEVICE(self),\n   92 | \t\t\t\t req_buf,\n   93 | \t\t\t\t req_bufsz,\n   94 | \t\t\t\t FU_IGSC_DEVICE_MEI_WRITE_TIMEOUT,\n   95 | \t\t\t\t error))\n   96 | \t\treturn FALSE;\n   97 | \tif (!fu_mei_device_read(FU_MEI_DEVICE(self),\n   98 | \t\t\t\tresp_buf,\n   99 | \t\t\t\tresp_bufsz,\n  100 | \t\t\t\t&resp_readsz,\n  101 | \t\t\t\tFU_IGSC_DEVICE_MEI_READ_TIMEOUT,\n  102 | \t\t\t\terror))\n  103 | \t\treturn FALSE;\n  104 | \tfu_dump_raw(G_LOG_DOMAIN, \"MEI-read\", resp_buf, resp_readsz);\n  105 | \treturn TRUE;\n  106 | }","lines":27,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/intel-gsc/fu-igsc-device.c#L80-L106"}]},
{"id":"ERR_10","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"In `fu_jabra_gnp_child_device_rx_cb()` (`plugins/jabra-gnp/fu-jabra-gnp-child-device.c:120-130`), the code intends to treat an all-zero response buffer as a read failure: `if (fu_memcmp_safe(rx_data->rxbuf, sizeof(rx_data->rxbuf), 0, empty_buf, sizeof(rx_data->rxbuf), 0, sizeof(rx_data->rxbuf), error)) { g_prefix_error_literal(error, \"error reading from device: \"); return FALSE; }`. However `fu_memcmp_safe()` (see `libfwupdplugin/fu-mem.c`) returns `TRUE` (with `*error` left untouched/`NULL`) precisely when the two buffers *match*, and only sets `*error` when they *differ* (in which case it returns `FALSE`). So the branch that is supposed to report 'device returned all zeros' is entered exactly when no GError has been set, and `g_prefix_error_literal()` on a `NULL` `*error` is a no-op. The function then returns `FALSE` with `error` left unset, violating the GError contract. `fu_device_retry_full()` has a defensive fallback that replaces the missing error with a generic `\"exec failed but no error set!\"`, so this does not crash, but it destroys the intended diagnostic message and signals a logic inversion in the check.","fix":"Use `g_set_error_literal()` instead of `g_prefix_error_literal()` since there is no pre-existing error to prefix, e.g. ```c\nif (fu_memcmp_safe(rx_data->rxbuf, sizeof(rx_data->rxbuf), 0,\n\t\t    empty_buf, sizeof(rx_data->rxbuf), 0,\n\t\t    sizeof(rx_data->rxbuf), NULL)) {\n\tg_set_error_literal(error, FWUPD_ERROR, FWUPD_ERROR_READ,\n\t\t\t    \"error reading from device: got an empty response\");\n\treturn FALSE;\n}\n```","locations":[{"ref":"plugins/jabra-gnp/fu-jabra-gnp-child-device.c:117-127","code":"  117 | \tif (fu_memcmp_safe(rx_data->rxbuf,\n  118 | \t\t\t   sizeof(rx_data->rxbuf),\n  119 | \t\t\t   0,\n  120 | \t\t\t   empty_buf,\n  121 | \t\t\t   sizeof(rx_data->rxbuf),\n  122 | \t\t\t   0,\n  123 | \t\t\t   sizeof(rx_data->rxbuf),\n  124 | \t\t\t   error)) {\n  125 | \t\tg_prefix_error_literal(error, \"error reading from device: \");\n  126 | \t\treturn FALSE;\n  127 | \t}","lines":11,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/jabra-gnp/fu-jabra-gnp-child-device.c#L117-L127"}]},
{"id":"ERR_11","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"In `generate-build/fix_translations.py`, the `__main__` block wraps `os.listdir(dirname)` in `try/except NotADirectoryError`, but passing a path that simply does not exist raises `FileNotFoundError`, not `NotADirectoryError` (verified: `os.listdir('/nonexistent')` raises `FileNotFoundError`). The far more common user mistake - typoing or forgetting to create the directory - is therefore not caught, and the script crashes with a raw unhandled traceback instead of printing the intended `path required` message.","fix":"Catch both exception types, e.g.:\n```python\n# before\n    except NotADirectoryError:\n        print(\"path required\")\n        sys.exit(2)\n\n# after\n    except (NotADirectoryError, FileNotFoundError):\n        print(\"path required\")\n        sys.exit(2)\n```","locations":[{"ref":"generate-build/fix_translations.py:52-59","code":"   52 |     try:\n   53 |         dirname = sys.argv[1]\n   54 |         for fn in os.listdir(dirname):\n   55 |             if fn.endswith(\".po\"):\n   56 |                 _process_file(os.path.join(dirname, fn))\n   57 |     except NotADirectoryError:\n   58 |         print(\"path required\")\n   59 |         sys.exit(2)","lines":8,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/generate-build/fix_translations.py#L52-L59"}]},
{"id":"ERR_12","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In `fwupd_unix_input_stream_from_bytes()` (`libfwupd/fwupd-common.c`), the call to `write(fd, g_bytes_get_data(bytes, NULL), g_bytes_get_size(bytes))` only checks for `rc < 0`. POSIX `write()` may perform a short (partial) write for large buffers, in which case `rc` is a non-negative value smaller than the requested size; this is silently treated as full success, so the memfd/temp file used to back the `GUnixInputStream` can end up truncated for large firmware blobs. In addition, the resulting `g_set_error()` message (`\"failed to write %\" G_GSSIZE_FORMAT`, formatted with just `rc`) never includes `errno`/`fwupd_strerror(errno)`, unlike the sibling error paths in the same function (`lseek`, `fcntl`), making the error message far less useful for diagnosis.","fix":"Loop until all bytes are written (or handle `EINTR`/short writes), and include the OS error text, e.g.:\n```c\ngsize total = 0;\ngsize datasz = g_bytes_get_size(bytes);\nconst guint8 *data = g_bytes_get_data(bytes, NULL);\nwhile (total < datasz) {\n    rc = write(fd, data + total, datasz - total);\n    if (rc < 0) {\n        g_set_error(error, FWUPD_ERROR, FWUPD_ERROR_INVALID_FILE,\n                    \"failed to write: %s\", fwupd_strerror(errno));\n        return NULL;\n    }\n    total += (gsize)rc;\n}\n```","locations":[{"ref":"libfwupd/fwupd-common.c:485-493","code":"  485 | \trc = write(fd, g_bytes_get_data(bytes, NULL), g_bytes_get_size(bytes));\n  486 | \tif (rc < 0) {\n  487 | \t\tg_set_error(error,\n  488 | \t\t\t    FWUPD_ERROR,\n  489 | \t\t\t    FWUPD_ERROR_INVALID_FILE,\n  490 | \t\t\t    \"failed to write %\" G_GSSIZE_FORMAT,\n  491 | \t\t\t    rc);\n  492 | \t\treturn NULL;\n  493 | \t}","lines":9,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupd/fwupd-common.c#L485-L493"}]},
{"id":"ERR_13","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`fu_edid_build` explicitly validates that `serial_number` and `eisa_id` from the XML/build source are no longer than `FU_STRUCT_EDID_DESCRIPTOR_SIZE_DATA` (13 bytes) and returns a clear `FWUPD_ERROR_NOT_SUPPORTED` error otherwise, but the equivalent `product_name` property is not checked at all before being handed to `fu_edid_set_product_name`. An over-long `product_name` will therefore only fail later and less clearly, inside `fu_struct_edid_descriptor_set_data` during `fu_edid_write`, instead of at build time like its sibling fields.","fix":"Add the same length check used for `serial_number`/`eisa_id` for `product_name` in `fu_edid_build`, e.g.:\n```c\nvalue = xb_node_query_text(n, \"product_name\", NULL);\nif (value != NULL) {\n\tgsize valuesz = strlen(value);\n\tif (valuesz > FU_STRUCT_EDID_DESCRIPTOR_SIZE_DATA) {\n\t\tg_set_error(error, FWUPD_ERROR, FWUPD_ERROR_NOT_SUPPORTED,\n\t\t\t    \"product_name not supported, %u of %u bytes\",\n\t\t\t    (guint)valuesz, (guint)FU_STRUCT_EDID_DESCRIPTOR_SIZE_DATA);\n\t\treturn FALSE;\n\t}\n\tfu_edid_set_product_name(self, value);\n}\n```","locations":[{"ref":"libfwupdplugin/fu-edid.c:378-426","code":"  378 | static gboolean\n  379 | fu_edid_build(FuFirmware *firmware, XbNode *n, GError **error)\n  380 | {\n  381 | \tFuEdid *self = FU_EDID(firmware);\n  382 | \tconst gchar *value;\n  383 | \n  384 | \t/* simple properties */\n  385 | \tvalue = xb_node_query_text(n, \"pnp_id\", NULL);\n  386 | \tif (value != NULL) {\n  387 | \t\tgsize valuesz = strlen(value);\n  388 | \t\tif (valuesz != 3) {\n  389 | \t\t\tg_set_error(error,\n  390 | \t\t\t\t    FWUPD_ERROR,\n  391 | \t\t\t\t    FWUPD_ERROR_NOT_SUPPORTED,\n  392 | \t\t\t\t    \"pnp_id not supported, %u of %u bytes\",\n  393 | \t\t\t\t    (guint)valuesz,\n  394 | \t\t\t\t    (guint)3);\n  395 | \t\t\treturn FALSE;\n  396 | \t\t}\n  397 | \t\tfu_edid_set_pnp_id(self, value);\n  398 | \t}\n  399 | \tvalue = xb_node_query_text(n, \"serial_number\", NULL);\n  400 | \tif (value != NULL) {\n  401 | \t\tgsize valuesz = strlen(value);\n  402 | \t\tif (valuesz > FU_STRUCT_EDID_DESCRIPTOR_SIZE_DATA) {\n  403 | \t\t\tg_set_error(error,\n  404 | \t\t\t\t    FWUPD_ERROR,\n  405 | \t\t\t\t    FWUPD_ERROR_NOT_SUPPORTED,\n  406 | \t\t\t\t    \"serial_number not supported, %u of %u bytes\",\n  407 | \t\t\t\t    (guint)valuesz,\n  408 | \t\t\t\t    (guint)FU_STRUCT_EDID_DESCRIPTOR_SIZE_DATA);\n  409 | \t\t\treturn FALSE;\n  410 | \t\t}\n  411 | \t\tfu_edid_set_serial_number(self, value);\n  412 | \t}\n  413 | \tvalue = xb_node_query_text(n, \"eisa_id\", NULL);\n  414 | \tif (value != NULL) {\n  415 | \t\tgsize valuesz = strlen(value);\n  416 | \t\tif (valuesz > FU_STRUCT_EDID_DESCRIPTOR_SIZE_DATA) {\n  417 | \t\t\tg_set_error(error,\n  418 | \t\t\t\t    FWUPD_ERROR,\n  419 | \t\t\t\t    FWUPD_ERROR_NOT_SUPPORTED,\n  420 | \t\t\t\t    \"eisa_id not supported, %u of %u bytes\",\n  421 | \t\t\t\t    (guint)valuesz,\n  422 | \t\t\t\t    (guint)FU_STRUCT_EDID_DESCRIPTOR_SIZE_DATA);\n  423 | \t\t\treturn FALSE;\n  424 | \t\t}\n  425 | \t\tfu_edid_set_eisa_id(self, value);\n  426 | \t}","lines":49,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-edid.c#L378-L426"}]},
{"id":"ERR_14","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `fu_algoltek_usbcr_firmware_parse` (`plugins/algoltek-usbcr/fu-algoltek-usbcr-firmware.c`), `fw_len` (`fu_struct_ag_usbcr_firmware_hdr_get_fw_len`) is fully attacker-controlled (`u16be`, read straight from the firmware image) and is used as `fu_firmware_get_size(firmware) - FU_STRUCT_AG_USBCR_FIRMWARE_INFO_SIZE` before being passed to `fu_size_checked_inc`. If `fw_len` is smaller than `FU_STRUCT_AG_USBCR_FIRMWARE_INFO_SIZE` (51 bytes), the unsigned subtraction underflows to a huge `gsize` value first, and the bug is only caught indirectly because the subsequent `fu_size_checked_inc` addition then overflows and errors out. This works today, but it relies on an implicit interaction between two unrelated helper functions rather than validating the untrusted `fw_len` value directly, and produces a confusing 'integer overflow' error instead of a clear 'firmware too small' error.","fix":"Explicitly validate `fw_len` against `FU_STRUCT_AG_USBCR_FIRMWARE_INFO_SIZE` before doing the subtraction, e.g.:\n```c\nif (fu_struct_ag_usbcr_firmware_hdr_get_fw_len(st_hdr) < FU_STRUCT_AG_USBCR_FIRMWARE_INFO_SIZE) {\n    g_set_error_literal(error, FWUPD_ERROR, FWUPD_ERROR_INVALID_FILE,\n                         \"fw_len smaller than firmware info struct\");\n    return FALSE;\n}\n```\nbefore computing `fu_firmware_get_size(firmware) - FU_STRUCT_AG_USBCR_FIRMWARE_INFO_SIZE`.","locations":[{"ref":"plugins/algoltek-usbcr/fu-algoltek-usbcr-firmware.c:49-59","code":"   49 | \tfu_firmware_set_size(firmware, fu_struct_ag_usbcr_firmware_hdr_get_fw_len(st_hdr));\n   50 | \tself->emmc_ver = fu_struct_ag_usbcr_firmware_hdr_get_emmc_ver(st_hdr);\n   51 | \n   52 | \t/* calculate the offset of the app_ver */\n   53 | \tif (!fu_size_checked_inc(&offset, fu_firmware_get_offset(firmware), error))\n   54 | \t\treturn FALSE;\n   55 | \tif (!fu_size_checked_inc(&offset,\n   56 | \t\t\t\t fu_firmware_get_size(firmware) -\n   57 | \t\t\t\t     FU_STRUCT_AG_USBCR_FIRMWARE_INFO_SIZE,\n   58 | \t\t\t\t error))\n   59 | \t\treturn FALSE;","lines":11,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/algoltek-usbcr/fu-algoltek-usbcr-firmware.c#L49-L59"}]},
{"id":"ERR_15","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`fu_genesys_hubhid_device_command_read()` and `fu_genesys_hubhid_device_command_write()` both start with `g_return_val_if_fail(datasz == setup->length, FALSE);`. If this invariant is ever violated (e.g. a future caller passes mismatched lengths), the function returns `FALSE` without setting `*error`, violating the fwupd convention that any `gboolean`-returning function with a `GError **error` parameter must set `error` on failure. Callers that assume `error` is always populated after a `FALSE` return (e.g. to build a prefixed error message or log `error->message`) could dereference a `NULL`/uninitialized `GError`.","fix":"Replace the bare `g_return_val_if_fail` with an explicit check that sets `error`, e.g.: ```c\nif (datasz != setup->length) {\n    g_set_error_literal(error, FWUPD_ERROR, FWUPD_ERROR_INTERNAL,\n                         \"datasz does not match setup->length\");\n    return FALSE;\n}\n```","locations":[{"ref":"plugins/genesys/fu-genesys-hubhid-device.c:60","code":"   60 | \tg_return_val_if_fail(datasz == setup->length, FALSE);","lines":1,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/genesys/fu-genesys-hubhid-device.c#L60"},{"ref":"plugins/genesys/fu-genesys-hubhid-device.c:160","code":"  160 | \tg_return_val_if_fail(datasz == setup->length, FALSE);","lines":1,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/genesys/fu-genesys-hubhid-device.c#L160"}]},
{"id":"ERR_16","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`fu_engine_backends_coldplug_backend_add_devices` returns a `gboolean` and takes a `GError **error` out-parameter, but its caller `fu_engine_backends_coldplug_backend` invokes it without checking the return value or inspecting `error`. The callee currently always returns `TRUE` and never populates `error`, so this is latent rather than an active bug today, but the signature promises error propagation that is silently discarded, so if a future change makes the function fail (e.g. propagating an error from a helper), the failure would be swallowed and `fu_progress_step_done` would still be called as if coldplugging succeeded.","fix":"Check the return value like the other steps in this function:\n```c\nif (!fu_engine_backends_coldplug_backend_add_devices(self,\n\t\t\t\t\t\t     backend,\n\t\t\t\t\t\t     fu_progress_get_child(progress),\n\t\t\t\t\t\t     error))\n\treturn FALSE;\nfu_progress_step_done(progress);\n```","locations":[{"ref":"src/fu-engine.c:8800-8804","code":" 8800 | \tfu_engine_backends_coldplug_backend_add_devices(self,\n 8801 | \t\t\t\t\t\t\tbackend,\n 8802 | \t\t\t\t\t\t\tfu_progress_get_child(progress),\n 8803 | \t\t\t\t\t\t\terror);\n 8804 | \tfu_progress_step_done(progress);","lines":5,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/src/fu-engine.c#L8800-L8804"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"easy","description":"`fu_asus_hid_device_probe` (`plugins/asus-hid/fu-asus-hid-device.c:107-118`) overrides `FuDeviceClass->probe` but never chains up to `FU_DEVICE_CLASS(fu_asus_hid_device_parent_class)->probe(device, error)`. The parent `FuHidrawDevice`/`fu_hidraw_device_probe()` is responsible for parsing the HID VID/PID (`HID_ID`), setting the physical/logical IDs and building the `HIDRAW\\VEN_xxxx&DEV_xxxx` instance ID that `plugins/asus-hid/asus-hid.quirk` matches on (e.g. `AsusHidNumMcu`, `FirmwareSizeMax`, `Flags`). Every other `FuHidrawDevice` subclass in the tree (`plugins/raydium-tp/fu-raydium-tp-hid-device.c`, `plugins/qc-s5gen2/fu-qc-s5gen2-hid-device.c`, `plugins/telink-dfu/fu-telink-dfu-hid-device.c`) explicitly chains up in its `probe()`. Skipping the chain-up here means the device never gets its VID/PID/instance IDs populated by the generic code path, which can prevent the quirks (including `AsusHidNumMcu`, which `fu_asus_hid_device_probe` itself depends on being already set to create the right number of children) from ever matching.","fix":"Chain up to the parent probe before doing plugin-specific work, mirroring the sibling `FuHidrawDevice` plugins:\n```c\nstatic gboolean\nfu_asus_hid_device_probe(FuDevice *device, GError **error)\n{\n\tFuAsusHidDevice *self = FU_ASUS_HID_DEVICE(device);\n\n\tif (!FU_DEVICE_CLASS(fu_asus_hid_device_parent_class)->probe(device, error))\n\t\treturn FALSE;\n\n\tfor (guint i = 0; i < self->num_mcu; i++) {\n\t\tg_autoptr(FuDevice) dev_tmp = fu_asus_hid_child_device_new(device, i);\n\t\tfu_device_add_child(device, dev_tmp);\n\t}\n\treturn TRUE;\n}\n```","locations":[{"ref":"plugins/asus-hid/fu-asus-hid-device.c:107-118","code":"  107 | static gboolean\n  108 | fu_asus_hid_device_probe(FuDevice *device, GError **error)\n  109 | {\n  110 | \tFuAsusHidDevice *self = FU_ASUS_HID_DEVICE(device);\n  111 | \n  112 | \tfor (guint i = 0; i < self->num_mcu; i++) {\n  113 | \t\tg_autoptr(FuDevice) dev_tmp = fu_asus_hid_child_device_new(device, i);\n  114 | \t\tfu_device_add_child(device, dev_tmp);\n  115 | \t}\n  116 | \n  117 | \treturn TRUE;\n  118 | }","lines":12,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/asus-hid/fu-asus-hid-device.c#L107-L118"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"`fu_context_build_uefi_basename_for_arch()` returns `NULL` for any CPU architecture not covered by its `#ifdef` ladder (e.g. `s390x`, `ppc64le`, `mips`, `sparc64`). Its only caller, `fu_context_get_esp_files_for_entry()`, unconditionally assigns the result to `shim_name` and later passes it as the `suffix` argument to `g_str_has_suffix(filename, shim_name)` (used both for the second-stage-bootloader check and the revocations check). `g_str_has_suffix()` does `g_return_val_if_fail(suffix != NULL, FALSE)`, so on any unsupported architecture every call to `fu_context_get_esp_files()` emits a GLib `CRITICAL` log message instead of gracefully skipping the second-stage/revocation lookups.","fix":"Guard the two `g_str_has_suffix()` call sites with a `shim_name != NULL` check, or make `fu_context_build_uefi_basename_for_arch()` never return `NULL` by adding a generic fallback suffix for unlisted architectures:\n\n```c\nif (flags & FU_CONTEXT_ESP_FILE_FLAG_INCLUDE_SECOND_STAGE && shim_name != NULL &&\n    g_str_has_suffix(filename, shim_name)) {\n\t...\n}\n```","locations":[{"ref":"libfwupdplugin/fu-context.c:2402-2424","code":" 2402 | static gchar *\n 2403 | fu_context_build_uefi_basename_for_arch(const gchar *app_name)\n 2404 | {\n 2405 | #ifdef __x86_64__\n 2406 | \treturn g_strdup_printf(\"%sx64.efi\", app_name);\n 2407 | #endif\n 2408 | #ifdef __aarch64__\n 2409 | \treturn g_strdup_printf(\"%saa64.efi\", app_name);\n 2410 | #endif\n 2411 | #ifdef __loongarch_lp64\n 2412 | \treturn g_strdup_printf(\"%sloongarch64.efi\", app_name);\n 2413 | #endif\n 2414 | #if (defined(__riscv) && __riscv_xlen == 64)\n 2415 | \treturn g_strdup_printf(\"%sriscv64.efi\", app_name);\n 2416 | #endif\n 2417 | #if defined(__i386__) || defined(__i686__)\n 2418 | \treturn g_strdup_printf(\"%sia32.efi\", app_name);\n 2419 | #endif\n 2420 | #ifdef __arm__\n 2421 | \treturn g_strdup_printf(\"%sarm.efi\", app_name);\n 2422 | #endif\n 2423 | \treturn NULL;\n 2424 | }","lines":23,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-context.c#L2402-L2424"},{"ref":"libfwupdplugin/fu-context.c:2511-2512","code":" 2511 | \tif (flags & FU_CONTEXT_ESP_FILE_FLAG_INCLUDE_SECOND_STAGE &&\n 2512 | \t    g_str_has_suffix(filename, shim_name)) {","lines":2,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-context.c#L2511-L2512"},{"ref":"libfwupdplugin/fu-context.c:2547-2548","code":" 2547 | \t    g_str_has_suffix(filename, shim_name)) {\n 2548 | \t\tg_autoptr(GString) filename2 = g_string_new(filename);","lines":2,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-context.c#L2547-L2548"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"In `fu_engine_clear_results`, `plugin = fu_plugin_list_find_by_name(self->plugin_list, fu_device_get_plugin(device), error);` is allowed to fail (checked only with `if (plugin != NULL)`), which is intentional (\"call into the plugin if it still exists\"). However, when the plugin is not found, `fu_plugin_list_find_by_name` has already populated `*error` with a `FWUPD_ERROR_NOT_FOUND`-style `GError`. Execution then falls through and the *same* `error` pointer is passed again to `fu_history_modify_device(self->history, device, error)` at the end of the function. Passing a `GError**` whose `*error` is already non-NULL into another function that expects `*error == NULL` violates the GLib error contract and will trigger a `GLib-CRITICAL` `g_return_val_if_fail` warning (and potentially leak the original `GError`) even though the function may otherwise succeed and report `TRUE`.","fix":"Use a local error for the optional plugin lookup so the outer `error` stays `NULL` unless something actually fails:\n```c\ng_autoptr(GError) error_plugin = NULL;\nplugin = fu_plugin_list_find_by_name(self->plugin_list, fu_device_get_plugin(device), &error_plugin);\nif (plugin != NULL) {\n\tif (!fu_plugin_runner_clear_results(plugin, device, error))\n\t\treturn FALSE;\n} else {\n\tg_debug(\"ignoring: %s\", error_plugin->message);\n}\n```","locations":[{"ref":"src/fu-engine.c:6536-6550","code":" 6536 | \t/* call into the plugin if it still exists */\n 6537 | \tplugin =\n 6538 | \t    fu_plugin_list_find_by_name(self->plugin_list, fu_device_get_plugin(device), error);\n 6539 | \tif (plugin != NULL) {\n 6540 | \t\tif (!fu_plugin_runner_clear_results(plugin, device, error))\n 6541 | \t\t\treturn FALSE;\n 6542 | \t}\n 6543 | \n 6544 | \t/* if the update never got run, unstage it */\n 6545 | \tif (fu_device_get_update_state(device) == FWUPD_UPDATE_STATE_PENDING)\n 6546 | \t\tfu_device_set_update_state(device, FWUPD_UPDATE_STATE_UNKNOWN);\n 6547 | \n 6548 | \t/* override */\n 6549 | \tfu_device_add_flag(device, FWUPD_DEVICE_FLAG_NOTIFIED);\n 6550 | \treturn fu_history_modify_device(self->history, device, error);","lines":15,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/src/fu-engine.c#L6536-L6550"}]},
{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"`fu_device_event_check_error()` reads the stored error code as `gint64 code = fu_device_event_get_i64(self, \"Error\", NULL)` and then passes it directly as the `gint code` parameter of `g_set_error_literal(error, FWUPD_ERROR, code, message)`, which implicitly narrows the 64-bit value to 32 bits. In practice `FwupdError` codes are always small, but the mismatch between the 64-bit storage type used throughout `fu-device-event.c` (`fu_device_event_set_i64()`/`fu_device_event_get_i64()`) and the 32-bit `GQuark`/error-code API is a latent correctness issue: if a corrupted or crafted emulation JSON file stores an `Error` value outside the `gint` range, the truncation silently changes the resulting error code instead of failing loudly.","fix":"Cast explicitly and document the truncation, e.g. `g_set_error_literal(error, FWUPD_ERROR, (gint)code, message);`, or add a range check such as `if (code < G_MININT || code > G_MAXINT) { g_set_error(...); return FALSE; }` before calling `g_set_error_literal()`.","locations":[{"ref":"libfwupdplugin/fu-device-event.c:279-301","code":"  279 | fu_device_event_check_error(FuDeviceEvent *self, GError **error)\n  280 | {\n  281 | \tgint64 code;\n  282 | \tconst gchar *message;\n  283 | \n  284 | \tg_return_val_if_fail(FU_IS_DEVICE_EVENT(self), FALSE);\n  285 | \n  286 | \t/* nothing to do */\n  287 | \tif (error == NULL)\n  288 | \t\treturn TRUE;\n  289 | \n  290 | \t/* anything set */\n  291 | \tcode = fu_device_event_get_i64(self, \"Error\", NULL);\n  292 | \tif (code == G_MAXINT64)\n  293 | \t\treturn TRUE;\n  294 | \tmessage = fu_device_event_get_str(self, \"ErrorMsg\", NULL);\n  295 | \tif (message == NULL)\n  296 | \t\tmessage = fwupd_error_to_string(code);\n  297 | \n  298 | \t/* success, in a way */\n  299 | \tg_set_error_literal(error, FWUPD_ERROR, code, message);\n  300 | \treturn FALSE;\n  301 | }","lines":23,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-device-event.c#L279-L301"}]},
{"id":"API_5","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"`fu_fdt_image_set_attr_format()` in `libfwupdplugin/fu-fdt-image.c` stores the format string with the raw libc `strdup(format)` instead of `g_strdup(format)`, while the containing `hash_attrs_format` table was created with `g_hash_table_new_full(g_str_hash, g_str_equal, g_free, g_free)`, meaning the value is later released with `g_free()`. Mixing `strdup()`-allocated memory with `g_free()` relies on GLib's default allocator being a thin wrapper over the system `malloc`/`free`, which is not guaranteed by the GLib API and is inconsistent with the rest of the file (`g_strdup(key)` is used for the key in the same call).","fix":"Use `g_strdup(format)` instead of `strdup(format)`:\n```c\ng_hash_table_insert(priv->hash_attrs_format, g_strdup(key), g_strdup(format));\n```","locations":[{"ref":"libfwupdplugin/fu-fdt-image.c:417-424","code":"  417 | static void\n  418 | fu_fdt_image_set_attr_format(FuFdtImage *self, const gchar *key, const gchar *format)\n  419 | {\n  420 | \tFuFdtImagePrivate *priv = GET_PRIVATE(self);\n  421 | \tg_return_if_fail(FU_IS_FDT_IMAGE(self));\n  422 | \tg_return_if_fail(format != NULL);\n  423 | \tg_hash_table_insert(priv->hash_attrs_format, g_strdup(key), strdup(format));\n  424 | }","lines":8,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-fdt-image.c#L417-L424"}]},
