<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"very_easy","description":"`fu_device_progress_new()` allocates `self` with `g_object_new(FU_TYPE_DEVICE_PROGRESS, NULL)` *before* validating its arguments with `g_return_val_if_fail(FU_IS_DEVICE(device), NULL)` and `g_return_val_if_fail(FU_IS_PROGRESS(progress), NULL)`. If either check fails, the macro returns `NULL` immediately, and the `g_autoptr(FuDeviceProgress) self` local is unreffed on the way out, which invokes `fu_device_progress_finalize()`. At that point `self->device` and `self->progress` are still `NULL` (never assigned), so `fu_device_progress_finalize()` unconditionally calls `g_signal_handler_disconnect(self->progress, self->percentage_changed_id)`, `fu_device_set_status(self->device, ...)`, `fu_device_set_percentage(self->device, ...)`, and `g_object_unref(self->device)` / `g_object_unref(self->progress)` on `NULL`. Each of these triggers a `g_critical()` from the callee's own `g_return_if_fail`/type checks. This project's default test setup in `meson.build` sets `G_DEBUG=fatal-criticals`, which turns every one of these criticals into a fatal `abort()`, so calling `fu_device_progress_new()` with an invalid `device` or `progress` argument crashes the process instead of cleanly returning `NULL`.","fix":"Validate the arguments before constructing the object, so the finalizer is never invoked on a half-initialized instance:\n\n```c\nFuDeviceProgress *\nfu_device_progress_new(FuDevice *device, FuProgress *progress)\n{\n\tg_autoptr(FuDeviceProgress) self = NULL;\n\n\tg_return_val_if_fail(FU_IS_DEVICE(device), NULL);\n\tg_return_val_if_fail(FU_IS_PROGRESS(progress), NULL);\n\n\tself = g_object_new(FU_TYPE_DEVICE_PROGRESS, NULL);\n\tself->percentage_changed_id = g_signal_connect(...);\n\t...\n}\n```\n\nAlternatively, make `fu_device_progress_finalize()` defensive by guarding each call, e.g. `if (self->progress != NULL) { g_signal_handler_disconnect(...); }` and `g_clear_object(&self->device)` / `g_clear_object(&self->progress)`, but reordering the validation is the more correct fix since it avoids doing any partial setup/teardown work at all.","locations":[{"ref":"libfwupdplugin/fu-device-progress.c:81-104","code":"   81 | FuDeviceProgress *\n   82 | fu_device_progress_new(FuDevice *device, FuProgress *progress)\n   83 | {\n   84 | \tg_autoptr(FuDeviceProgress) self = g_object_new(FU_TYPE_DEVICE_PROGRESS, NULL);\n   85 | \n   86 | \tg_return_val_if_fail(FU_IS_DEVICE(device), NULL);\n   87 | \tg_return_val_if_fail(FU_IS_PROGRESS(progress), NULL);\n   88 | \n   89 | \t/* connect up to device */\n   90 | \tself->percentage_changed_id =\n   91 | \t    g_signal_connect(FU_PROGRESS(progress),\n   92 | \t\t\t     \"percentage-changed\",\n   93 | \t\t\t     G_CALLBACK(fu_device_progress_percentage_changed_cb),\n   94 | \t\t\t     self);\n   95 | \tself->status_changed_id = g_signal_connect(FU_PROGRESS(progress),\n   96 | \t\t\t\t\t\t   \"status-changed\",\n   97 | \t\t\t\t\t\t   G_CALLBACK(fu_device_progress_status_changed_cb),\n   98 | \t\t\t\t\t\t   self);\n   99 | \tself->device = g_object_ref(device);\n  100 | \tself->progress = g_object_ref(progress);\n  101 | \n  102 | \t/* success */\n  103 | \treturn g_steal_pointer(&self);\n  104 | }","lines":24,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-device-progress.c#L81-L104"},{"ref":"libfwupdplugin/fu-device-progress.c:41-52","code":"   41 | static void\n   42 | fu_device_progress_finalize(GObject *obj)\n   43 | {\n   44 | \tFuDeviceProgress *self = FU_DEVICE_PROGRESS(obj);\n   45 | \tg_signal_handler_disconnect(self->progress, self->percentage_changed_id);\n   46 | \tg_signal_handler_disconnect(self->progress, self->status_changed_id);\n   47 | \tfu_device_set_status(self->device, FWUPD_STATUS_IDLE);\n   48 | \tfu_device_set_percentage(self->device, 0);\n   49 | \tg_object_unref(self->device);\n   50 | \tg_object_unref(self->progress);\n   51 | \tG_OBJECT_CLASS(fu_device_progress_parent_class)->finalize(obj);\n   52 | }","lines":12,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-device-progress.c#L41-L52"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"In `fu_huddly_usb_hlink_msg_parse()`, `payload_size` is a `guint32` read directly from the untrusted device-supplied `FuStructHLinkHeader` (`payload_size: u32le`, fully attacker/device controlled, up to ~4 GiB). It is used immediately to allocate a buffer - `msg->payload = g_byte_array_sized_new(payload_size); fu_byte_array_set_size(msg->payload, payload_size, 0x0);` - *before* any check that `payload_size` bytes actually exist in the source buffer `buf`/`bufsz`. Only afterwards does the code call `fu_memcpy_safe()`, which would correctly reject an out-of-range copy - but by then the (potentially multi-gigabyte) allocation and zero-fill has already happened. A malicious or malfunctioning Huddly USB device can send a small H-Link header claiming an enormous `payload_size`, forcing fwupd to attempt a huge allocation. GLib's default allocators (`g_malloc`/`g_byte_array_sized_new`) abort the process on allocation failure, so this is a remotely triggerable crash/DoS vector from untrusted USB device input, or at minimum a memory-exhaustion issue.","fix":"Validate `payload_size` against the remaining bytes in the source buffer before allocating:\n```c\npayload_size = fu_struct_h_link_header_get_payload_size(msg->header);\nif (payload_size > bufsz - offset) {\n\tg_set_error(error, FWUPD_ERROR, FWUPD_ERROR_INVALID_DATA,\n\t\t    \"HLink payload size 0x%x exceeds received data\", payload_size);\n\treturn NULL;\n}\nmsg->payload = g_byte_array_sized_new(payload_size);\n...\n```","locations":[{"ref":"plugins/huddly-usb/fu-huddly-usb-common.c:106-118","code":"  106 | \tpayload_size = fu_struct_h_link_header_get_payload_size(msg->header);\n  107 | \tmsg->payload = g_byte_array_sized_new(payload_size);\n  108 | \tfu_byte_array_set_size(msg->payload, payload_size, 0x0);\n  109 | \tif (!fu_memcpy_safe(msg->payload->data,\n  110 | \t\t\t    msg->payload->len,\n  111 | \t\t\t    0, /* dst */\n  112 | \t\t\t    buf,\n  113 | \t\t\t    bufsz,\n  114 | \t\t\t    offset, /* src */\n  115 | \t\t\t    payload_size,\n  116 | \t\t\t    error)) {\n  117 | \t\treturn NULL;\n  118 | \t}","lines":13,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/huddly-usb/fu-huddly-usb-common.c#L106-L118"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In `contrib/cfu-inf-to-quirk.py`, `_convert_inf_to_quirk()` does `instance_id = line.split(\",\")[1].strip().upper()` when a line matches `HID\\VID_`, and `data[quirk_key] = line.split(\",\")[4].strip()` when a line matches one of the `dict_convert` keys. Neither access is guarded: if a matching line does not contain enough comma-separated fields (e.g. a malformed or unexpected `.inf` line), `line.split(\",\")[1]` or `line.split(\",\")[4]` raises an unhandled `IndexError` and crashes the script, unlike the `FwUpdateFriendlyName` handling a few lines above which already wraps the equivalent `line.split(\"=\")[1]` access in `try/except IndexError`.","fix":"Guard both accesses the same way the `FwUpdateFriendlyName` branch already does, e.g.:\n```python\nif line.find(\"HID\\\\VID_\") != -1:\n    parts = line.split(\",\")\n    if len(parts) > 1:\n        instance_id = parts[1].strip().upper()\n        instance_id = instance_id.replace(\"HID\\\\\", \"USB\\\\\")\n        instance_id = \"&\".join(instance_id.split(\"&\")[:2])\nfor inf_key, quirk_key in dict_convert.items():\n    if line.find(inf_key) != -1:\n        parts = line.split(\",\")\n        if len(parts) > 4:\n            data[quirk_key] = parts[4].strip()\n```","locations":[{"ref":"contrib/cfu-inf-to-quirk.py:38-44","code":"   38 |         if line.find(\"HID\\\\VID_\") != -1:\n   39 |             instance_id = line.split(\",\")[1].strip().upper()\n   40 |             instance_id = instance_id.replace(\"HID\\\\\", \"USB\\\\\")\n   41 |             instance_id = \"&\".join(instance_id.split(\"&\")[:2])\n   42 |         for inf_key, quirk_key in dict_convert.items():\n   43 |             if line.find(inf_key) != -1:\n   44 |                 data[quirk_key] = line.split(\",\")[4].strip()","lines":7,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/contrib/cfu-inf-to-quirk.py#L38-L44"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"In `docs/generate-oval.py`, the warning message `\"skipping {} as no {}\".format(fn)` has two `{}` placeholders but only one argument (`fn`) is passed to `.format()`; `tag` is passed as a second, unrelated argument to `print()` instead. Calling `.format()` with fewer arguments than placeholders raises `IndexError: Replacement index 1 out of range for positional args tuple`, so the script crashes instead of printing the intended diagnostic whenever a required tag is missing from an input JSON file.","fix":"Pass both values to `format()`: ```python\nprint(\"skipping {} as no {}\".format(fn, tag))\n```","locations":[{"ref":"docs/generate-oval.py:38","code":"   38 |                 print(\"skipping {} as no {}\".format(fn), tag)","lines":1,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/docs/generate-oval.py#L38"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"`fu_byte_array_set_size()` dereferences `array->len` to initialize `oldlength` *before* the `g_return_if_fail(array != NULL)` guard runs, so if `array` is `NULL` the function crashes with a NULL pointer dereference instead of being safely caught by the defensive check, defeating the whole purpose of the guard.","fix":"Move the `array != NULL` check before dereferencing `array`:\n```c\nvoid\nfu_byte_array_set_size(GByteArray *array, gsize length, guint8 data)\n{\n\tguint oldlength;\n\tg_return_if_fail(array != NULL);\n\tg_return_if_fail(length < G_MAXUINT);\n\toldlength = array->len;\n\tg_byte_array_set_size(array, length);\n\tif (length > oldlength)\n\t\tmemset(array->data + oldlength, data, length - oldlength);\n}\n```","locations":[{"ref":"libfwupdplugin/fu-byte-array.c:228-237","code":"  228 | void\n  229 | fu_byte_array_set_size(GByteArray *array, gsize length, guint8 data)\n  230 | {\n  231 | \tguint oldlength = array->len;\n  232 | \tg_return_if_fail(array != NULL);\n  233 | \tg_return_if_fail(length < G_MAXUINT);\n  234 | \tg_byte_array_set_size(array, length);\n  235 | \tif (length > oldlength)\n  236 | \t\tmemset(array->data + oldlength, data, length - oldlength);\n  237 | }","lines":10,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-byte-array.c#L228-L237"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In `fu_device_get_backend_parent_with_subsystem()`, the legacy-compatibility fallback branch (used when the emulation was recorded by an older fwupd and `fu_device_load_event()` returns `NULL`) calls `parent = fu_backend_get_device_parent(priv->backend, self, subsystem, error);` and then, without checking whether `parent` is `NULL`, does `if (parent != self) fu_device_set_target(parent, self);`. If `fu_backend_get_device_parent()` fails and returns `NULL` (with `error` set), `parent != self` is true (since `NULL != self`), so `fu_device_set_target(NULL, self)` is invoked. `fu_device_set_target()` asserts `g_return_if_fail(FU_IS_DEVICE(self))` on its first argument, which is `NULL` here, producing an assertion/critical failure at runtime (fatal if `G_DEBUG=fatal-warnings` is set, as is common in CI/test builds), instead of simply propagating the `NULL`/error result to the caller.","fix":"Guard the `fu_device_set_target()` call with a `NULL` check before comparing/using `parent`:\n```c\nparent = fu_backend_get_device_parent(priv->backend, self, subsystem, error);\nif (parent == NULL)\n\treturn NULL;\nif (parent != self)\n\tfu_device_set_target(parent, self);\nreturn g_steal_pointer(&parent);\n```","locations":[{"ref":"libfwupdplugin/fu-device.c:4349-4361","code":" 4349 | \t\t} else {\n 4350 | \t\t\tevent = fu_device_load_event(FU_DEVICE(self), event_id, NULL);\n 4351 | \t\t\tif (event == NULL) {\n 4352 | \t\t\t\tg_debug(\"falling back for emulation recorded by fwupd %s\",\n 4353 | \t\t\t\t\tpriv->fwupd_version);\n 4354 | \t\t\t\tparent = fu_backend_get_device_parent(priv->backend,\n 4355 | \t\t\t\t\t\t\t\t      self,\n 4356 | \t\t\t\t\t\t\t\t      subsystem,\n 4357 | \t\t\t\t\t\t\t\t      error);\n 4358 | \t\t\t\tif (parent != self)\n 4359 | \t\t\t\t\tfu_device_set_target(parent, self);\n 4360 | \t\t\t\treturn g_steal_pointer(&parent);\n 4361 | \t\t\t}","lines":13,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-device.c#L4349-L4361"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"`fu_console_box()` handles the `title` and `body` parameters inconsistently. `fu_console_strsplit_words()` returns `NULL` whenever its input string is `NULL` *or* empty (`text[0] == '\\0'`). The `body` code path checks for this (`if (lines == NULL) { ...; continue; }`), but the `title` code path does not:\n```c\nif (title != NULL) {\n\tg_autoptr(GPtrArray) lines = fu_console_strsplit_words(title, width - 4);\n\tfor (guint j = 0; j < lines->len; j++) {   /* lines can be NULL here */\n```\nCalling `fu_console_box(console, \"\", body, width)` (a non-NULL but empty title) dereferences `lines->len` on a NULL `GPtrArray *`, crashing the process.","fix":"Guard the title branch the same way the body branch already is:\n```c\nif (title != NULL) {\n\tg_autoptr(GPtrArray) lines = fu_console_strsplit_words(title, width - 4);\n\tif (lines != NULL) {\n\t\tfor (guint j = 0; j < lines->len; j++) {\n\t\t\tconst gchar *line = g_ptr_array_index(lines, j);\n\t\t\tfu_console_box_line(\"║ \", line, \" ║\", \" \", width);\n\t\t}\n\t}\n}\n```","locations":[{"ref":"src/fu-console.c:280-316","code":"  280 | static GPtrArray *\n  281 | fu_console_strsplit_words(const gchar *text, guint line_len)\n  282 | {\n  283 | \tg_auto(GStrv) tokens = NULL;\n  284 | \tg_autoptr(GPtrArray) lines = g_ptr_array_new_with_free_func(g_free);\n  285 | \tg_autoptr(GString) curline = g_string_new(NULL);\n  286 | \n  287 | \t/* sanity check */\n  288 | \tif (text == NULL || text[0] == '\\0')\n  289 | \t\treturn NULL;\n  290 | \tif (line_len == 0)\n  291 | \t\treturn NULL;\n  292 | \n  293 | \t/* tokenize the string */\n  294 | \ttokens = g_strsplit(text, \" \", -1);\n  295 | \tfor (guint i = 0; tokens[i] != NULL; i++) {\n  296 | \t\t/* current line plus new token is okay */\n  297 | \t\tif (curline->len + fu_strwidth(tokens[i]) < line_len) {\n  298 | \t\t\tg_string_append_printf(curline, \"%s \", tokens[i]);\n  299 | \t\t\tcontinue;\n  300 | \t\t}\n  301 | \n  302 | \t\t/* too long, so remove space, add newline and dump */\n  303 | \t\tif (curline->len > 0)\n  304 | \t\t\tg_string_truncate(curline, curline->len - 1);\n  305 | \t\tg_ptr_array_add(lines, g_strdup(curline->str));\n  306 | \t\tg_string_truncate(curline, 0);\n  307 | \t\tg_string_append_printf(curline, \"%s \", tokens[i]);\n  308 | \t}\n  309 | \n  310 | \t/* any incomplete line? */\n  311 | \tif (curline->len > 0) {\n  312 | \t\tg_string_truncate(curline, curline->len - 1);\n  313 | \t\tg_ptr_array_add(lines, g_strdup(curline->str));\n  314 | \t}\n  315 | \treturn g_steal_pointer(&lines);\n  316 | }","lines":37,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/src/fu-console.c#L280-L316"},{"ref":"src/fu-console.c:362-369","code":"  362 | \t/* optional title */\n  363 | \tif (title != NULL) {\n  364 | \t\tg_autoptr(GPtrArray) lines = fu_console_strsplit_words(title, width - 4);\n  365 | \t\tfor (guint j = 0; j < lines->len; j++) {\n  366 | \t\t\tconst gchar *line = g_ptr_array_index(lines, j);\n  367 | \t\t\tfu_console_box_line(\"║ \", line, \" ║\", \" \", width);\n  368 | \t\t}\n  369 | \t}","lines":8,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/src/fu-console.c#L362-L369"},{"ref":"src/fu-console.c:375-394","code":"  375 | \t/* optional body */\n  376 | \tif (body != NULL) {\n  377 | \t\tgboolean has_nonempty = FALSE;\n  378 | \t\tg_auto(GStrv) split = g_strsplit(body, \"\\n\", -1);\n  379 | \t\tfor (guint i = 0; split[i] != NULL; i++) {\n  380 | \t\t\tg_autoptr(GPtrArray) lines = fu_console_strsplit_words(split[i], width - 4);\n  381 | \t\t\tif (lines == NULL) {\n  382 | \t\t\t\tif (has_nonempty) {\n  383 | \t\t\t\t\tfu_console_box_line(\"║ \", NULL, \" ║\", \" \", width);\n  384 | \t\t\t\t\thas_nonempty = FALSE;\n  385 | \t\t\t\t}\n  386 | \t\t\t\tcontinue;\n  387 | \t\t\t}\n  388 | \t\t\tfor (guint j = 0; j < lines->len; j++) {\n  389 | \t\t\t\tconst gchar *line = g_ptr_array_index(lines, j);\n  390 | \t\t\t\tfu_console_box_line(\"║ \", line, \" ║\", \" \", width);\n  391 | \t\t\t}\n  392 | \t\t\thas_nonempty = TRUE;\n  393 | \t\t}\n  394 | \t}","lines":20,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/src/fu-console.c#L375-L394"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In `contrib/ci/check-dep-versions.py`, `parse_version()` does `tuple(map(int, ver.split(\".\")))` on both the `meson --version` output and on version strings extracted from `meson.build`/`dependencies.xml`. If any version component is non-numeric (e.g. a `1.9.0rc1` or `1.9.0.dev1` style meson version, or a stray non-numeric minimum-version string), `int()` raises an unhandled `ValueError` and the whole CI check crashes instead of reporting a clean error.","fix":"Wrap the parse in a try/except and fail with a clear message, e.g.:\n```python\ndef parse_version(ver):\n    try:\n        return tuple(map(int, ver.split(\".\")))\n    except ValueError as e:\n        sys.exit(f\"cannot parse version '{ver}': {e}\")\n```","locations":[{"ref":"contrib/ci/check-dep-versions.py:19","code":"   19 | # Maps the dependency id in dependencies.xml to the meson dependency() name.","lines":1,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/contrib/ci/check-dep-versions.py#L19"},{"ref":"contrib/ci/check-dep-versions.py:23-28","code":"   23 | MESON_ID_MAP: Dict[str, str] = {\n   24 |     \"libglib2.0-dev\": \"gio-2.0\",\n   25 |     \"gnutls-dev\": \"gnutls\",\n   26 |     \"libxmlb-dev\": \"xmlb\",\n   27 |     \"libjcat-dev\": \"jcat\",\n   28 |     \"libcurl4-gnutls-dev\": \"libcurl\",","lines":6,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/contrib/ci/check-dep-versions.py#L23-L28"}]},
{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In `contrib/ci/check-headers.py`, `lib_headers1.remove(\"libfwupd/fwupd.h\")` and `lib_headers2.remove(\"libfwupdplugin/fwupdplugin.h\")` will raise an unhandled `ValueError` (`list.remove(x): x not in list`) if either glob does not happen to include that exact path - for example when the script is invoked from a different working directory, against a partial checkout, or after the top-level header is ever renamed. There is no existence check or try/except around either call.","fix":"Check membership before removing, or wrap in a try/except with a clear error, e.g.:\n```python\nfor hdr in (\"libfwupd/fwupd.h\",):\n    if hdr not in lib_headers1:\n        sys.exit(f\"expected top-level header {hdr} not found\")\nlib_headers1.remove(\"libfwupd/fwupd.h\")\n```","locations":[{"ref":"contrib/ci/check-headers.py:34-38","code":"   34 |     lib_headers1 = glob.glob(\"libfwupd/*.h\")\n   35 |     lib_headers1.remove(\"libfwupd/fwupd.h\")\n   36 | \n   37 |     lib_headers2 = glob.glob(\"libfwupdplugin/*.h\")\n   38 |     lib_headers2.remove(\"libfwupdplugin/fwupdplugin.h\")","lines":5,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/contrib/ci/check-headers.py#L34-L38"}]},
{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`fwupd_checksum_format_for_display()` in `libfwupd/fwupd-common.c` is documented as accepting a `(nullable)` `checksum` argument, but it passes `checksum` straight into `g_strdup_printf(\"%s(%s)\", ..., checksum)` with no NULL guard. If `checksum` is `NULL`, `fwupd_checksum_guess_kind()` will emit a `g_return_val_if_fail` warning and fall back to `G_CHECKSUM_SHA1`, and then `%s` is formatted with a `NULL` pointer, which is undefined behavior in the C standard (works by accident as `(null)` on glibc, but is not guaranteed across platforms/libc's).","fix":"Add an explicit NULL check consistent with the documented `(nullable)` contract:\n```c\ngchar *\nfwupd_checksum_format_for_display(const gchar *checksum)\n{\n    GChecksumType kind;\n    if (checksum == NULL)\n        return NULL;\n    kind = fwupd_checksum_guess_kind(checksum);\n    return g_strdup_printf(\"%s(%s)\", fwupd_checksum_type_to_string_display(kind), checksum);\n}\n```","locations":[{"ref":"libfwupd/fwupd-common.c:90-95","code":"   90 | gchar *\n   91 | fwupd_checksum_format_for_display(const gchar *checksum)\n   92 | {\n   93 | \tGChecksumType kind = fwupd_checksum_guess_kind(checksum);\n   94 | \treturn g_strdup_printf(\"%s(%s)\", fwupd_checksum_type_to_string_display(kind), checksum);\n   95 | }","lines":6,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupd/fwupd-common.c#L90-L95"}]},
{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`fu_device_to_string_impl()` recurses into `priv->proxy` at the end of the function (`fu_device_to_string_impl(priv->proxy, idt + 1, str);`) with no cycle detection. `fu_device_set_proxy()` only guards against a device being its own direct proxy (`g_return_if_fail(self != proxy)`), but nothing prevents an indirect cycle where device A's proxy is device B and device B's proxy is device A. If such a cycle is ever constructed (e.g. by a buggy plugin), calling `fu_device_to_string()` on either device recurses infinitely between the two `fu_device_to_string_impl()` calls until the stack overflows.","fix":"Track visited devices (e.g. pass a `GPtrArray`/depth counter through `fu_device_to_string_impl()`, or detect cycles in `fu_device_set_proxy()` by walking the existing proxy chain before assigning) and bail out instead of recursing indefinitely.","locations":[{"ref":"libfwupdplugin/fu-device.c:5459-5462","code":" 5459 | \tif (priv->proxy != NULL) {\n 5460 | \t\tfwupd_codec_string_append(str, idt, \"Proxy\", \"\");\n 5461 | \t\tfu_device_to_string_impl(priv->proxy, idt + 1, str);\n 5462 | \t}","lines":4,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-device.c#L5459-L5462"}]},
{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In `fu_dell_plugin_supported()` (`plugins/dell/fu-dell-plugin.c`), `de_tables`/`da_tables` returned by `fu_context_get_smbios_data()` are indexed with `g_ptr_array_index(de_tables, 0)` / `g_ptr_array_index(da_tables, 0)` without first checking `->len > 0`. If the SMBIOS table lookup ever returns a non-NULL but empty `GPtrArray` for the `0xDE`/`0xDA` structure types (e.g. malformed/incomplete SMBIOS data on a given system), this reads past the end of the backing array.","fix":"Check the array length before indexing:\n```c\nif (de_tables->len == 0) {\n    g_set_error_literal(error, FWUPD_ERROR, FWUPD_ERROR_INVALID_DATA, \"no DE SMBIOS table\");\n    return FALSE;\n}\nde_blob = g_ptr_array_index(de_tables, 0);\n```\n(and similarly for `da_tables`).","locations":[{"ref":"plugins/dell/fu-dell-plugin.c:83","code":"   83 | \tde_blob = g_ptr_array_index(de_tables, 0);","lines":1,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/dell/fu-dell-plugin.c#L83"},{"ref":"plugins/dell/fu-dell-plugin.c:103","code":"  103 | \tda_blob = g_ptr_array_index(da_tables, 0);","lines":1,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/dell/fu-dell-plugin.c#L103"}]},
{"id":"PANIC_14","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In `fu_fastboot_device_read()`, `tmp` is produced via `fu_memstrsafe(buf, sizeof(buf), 4, sizeof(buf) - 4, NULL)`, which returns `NULL` when the bytes are not valid ASCII (entirely plausible for a buggy/malicious fastboot device to send). When the response starts with `FAIL`, the code calls `g_set_error(error, FWUPD_ERROR, FWUPD_ERROR_READ, \"failed to read response: %s\", tmp)` with a potentially `NULL` `tmp`, passing `NULL` to a `%s` format specifier - undefined behaviour on some libc implementations.","fix":"Guard the format string, e.g. use `tmp != NULL ? tmp : \"(unknown)\"` when building the error message: ```c\ng_set_error(error, FWUPD_ERROR, FWUPD_ERROR_READ, \"failed to read response: %s\", tmp != NULL ? tmp : \"(unknown)\");\n```","locations":[{"ref":"plugins/fastboot/fu-fastboot-device.c:162-187","code":"  162 | \t\ttmp = fu_memstrsafe(buf, sizeof(buf), 4, sizeof(buf) - 4, NULL);\n  163 | \t\tif (memcmp(buf, \"INFO\", 4) == 0) {\n  164 | \t\t\tif (g_strcmp0(tmp, \"erasing flash\") == 0)\n  165 | \t\t\t\tfu_progress_set_status(progress, FWUPD_STATUS_DEVICE_ERASE);\n  166 | \t\t\telse if (g_strcmp0(tmp, \"writing flash\") == 0)\n  167 | \t\t\t\tfu_progress_set_status(progress, FWUPD_STATUS_DEVICE_WRITE);\n  168 | \t\t\telse\n  169 | \t\t\t\tg_debug(\"INFO returned unknown: %s\", tmp);\n  170 | \t\t\tcontinue;\n  171 | \t\t}\n  172 | \n  173 | \t\t/* success */\n  174 | \t\tif (memcmp(buf, \"OKAY\", 4) == 0 || memcmp(buf, \"DATA\", 4) == 0) {\n  175 | \t\t\tif (str != NULL)\n  176 | \t\t\t\t*str = g_steal_pointer(&tmp);\n  177 | \t\t\treturn TRUE;\n  178 | \t\t}\n  179 | \n  180 | \t\t/* failure */\n  181 | \t\tif (memcmp(buf, \"FAIL\", 4) == 0) {\n  182 | \t\t\tg_set_error(error,\n  183 | \t\t\t\t    FWUPD_ERROR,\n  184 | \t\t\t\t    FWUPD_ERROR_READ,\n  185 | \t\t\t\t    \"failed to read response: %s\",\n  186 | \t\t\t\t    tmp);\n  187 | \t\t\treturn FALSE;","lines":26,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/fastboot/fu-fastboot-device.c#L162-L187"}]},
{"id":"PANIC_15","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`fu_jcat_libcrypto_pkcs7_create_client_certificate()` calls `ASN1_BIT_STRING_new()`, `ASN1_OCTET_STRING_new()`, `BASIC_CONSTRAINTS_new()`, `BN_new()`, `BIO_new(BIO_s_mem())` and `X509_new()` via `g_autoptr` initializers, but none of the returned pointers are checked for `NULL` before being dereferenced/used (e.g. `bcons->ca = FALSE;` at line 308 dereferences `bcons` from `BASIC_CONSTRAINTS_new()` unconditionally, and `X509_set_pubkey(crt, privkey)` is called with `crt` from `X509_new()` without a `NULL` check). If any of these OpenSSL allocation functions return `NULL` (e.g. under memory pressure), the code will dereference a `NULL` pointer and crash, unlike the rest of the file which consistently checks other OpenSSL call return values and reports a `GError`.","fix":"Check each allocation before use, matching the error-handling style already used elsewhere in the function, e.g.:\n\n```c\nif (usage == NULL || skid == NULL || bcons == NULL || sha1bn == NULL || crt_bio == NULL || crt == NULL) {\n\tg_set_error_literal(error,\n\t\t\t    FWUPD_ERROR,\n\t\t\t    FWUPD_ERROR_INVALID_DATA,\n\t\t\t    \"failed to allocate certificate building blocks\");\n\treturn NULL;\n}\n```\nright after the declarations, before any of the objects are dereferenced.","locations":[{"ref":"src/fu-jcat-libcrypto-common.c:246-254","code":"  246 | \tg_autoptr(ASN1_BIT_STRING) usage = ASN1_BIT_STRING_new();\n  247 | \tg_autoptr(ASN1_OCTET_STRING) skid = ASN1_OCTET_STRING_new();\n  248 | \tg_autoptr(BASIC_CONSTRAINTS) bcons = BASIC_CONSTRAINTS_new();\n  249 | \tg_autoptr(BIGNUM) sha1bn = BN_new();\n  250 | \tg_autoptr(BIO) crt_bio = BIO_new(BIO_s_mem());\n  251 | \tg_autoptr(X509) crt = X509_new();\n  252 | \n  253 | \t/* set public key */\n  254 | \tif (!X509_set_pubkey(crt, privkey)) {","lines":9,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/src/fu-jcat-libcrypto-common.c#L246-L254"},{"ref":"src/fu-jcat-libcrypto-common.c:309-310","code":"  309 | \tbcons->ca = FALSE;\n  310 | \tif (X509_add1_ext_i2d(crt, NID_basic_constraints, bcons, 1, X509V3_ADD_DEFAULT) < 1) {","lines":2,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/src/fu-jcat-libcrypto-common.c#L309-L310"}]},
{"id":"PANIC_16","type":"panic","type_label":"Panic","severity":"negligible","difficulty":"very_easy","description":"In `fu_jcat_libcrypto_x509_get_issuer_name()`, `g_autoptr(BIO) issuer_bio = BIO_new(BIO_s_mem());` is not checked for `NULL` before being passed to `X509_NAME_print_ex(issuer_bio, issuer_name, 0, XN_FLAG_RFC2253)`. `fu_jcat_libcrypto_get_errors()` in the same file explicitly checks `if (string_bio == NULL) return g_strdup(\"unspecified error\");` for the identical `BIO_new(BIO_s_mem())` call, showing the pattern is known but was not applied here, so an allocation failure here would dereference a `NULL` BIO instead of returning a `GError`.","fix":"Add the same guard used in `fu_jcat_libcrypto_get_errors()`:\n\n```c\n// before\n\tg_autoptr(BIO) issuer_bio = BIO_new(BIO_s_mem());\n\tX509_NAME *issuer_name = X509_get_issuer_name(crt);\n\n// after\n\tg_autoptr(BIO) issuer_bio = BIO_new(BIO_s_mem());\n\tX509_NAME *issuer_name = X509_get_issuer_name(crt);\n\tif (issuer_bio == NULL) {\n\t\tg_set_error_literal(error, FWUPD_ERROR, FWUPD_ERROR_INVALID_DATA,\n\t\t\t\t    \"failed to allocate BIO for issuer name\");\n\t\treturn NULL;\n\t}\n```","locations":[{"ref":"src/fu-jcat-libcrypto-common.c:393-398","code":"  393 | \tg_autoptr(BIO) issuer_bio = BIO_new(BIO_s_mem());\n  394 | \tX509_NAME *issuer_name = X509_get_issuer_name(crt);\n  395 | \tgchar *issuer_string = NULL;\n  396 | \tgsize issuer_string_length;\n  397 | \n  398 | \tif (X509_NAME_print_ex(issuer_bio, issuer_name, 0, XN_FLAG_RFC2253) == -1) {","lines":6,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/src/fu-jcat-libcrypto-common.c#L393-L398"}]},
{"id":"UAF_1","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"very_easy","description":"`fwupd_client_helper_free()` calls `g_main_context_unref(helper->context)` *before* `g_main_context_pop_thread_default(helper->context)`. `helper->context` is obtained via `fwupd_client_get_main_context(self)` which is documented `(transfer full)`, and `helper->loop` (created by `g_main_loop_new(helper->context, FALSE)`) also holds its own internal reference to the same context. When the client has no explicit main context set (the common default case, e.g. any `FwupdClient` created with `fwupd_client_new()` and never passed to `fwupd_client_set_main_context()`), `fwupd_client_get_main_context()` returns a brand-new `GMainContext` with a refcount of 1, which becomes 2 once `g_main_loop_new()` takes its own ref. `g_main_loop_unref(helper->loop)` at line 48 drops it to 1, and the explicit `g_main_context_unref(helper->context)` at line 49 drops it to 0, freeing the `GMainContext`. The following `g_main_context_pop_thread_default(helper->context)` at line 50 then dereferences the already-freed context to release its thread-default \"owner\" tracking - a use-after-free. This helper is used by essentially every synchronous `Fwupd*Client` call (`fwupd_client_connect`, `fwupd_client_get_devices`, `fwupd_client_install`, etc.), so this triggers on ordinary use of the synchronous API whenever no custom main context has been configured.","fix":"Swap the order so the context is popped as thread-default before it is unreferenced:\n\n```c\n// before\ng_main_loop_unref(helper->loop);\ng_main_context_unref(helper->context);\ng_main_context_pop_thread_default(helper->context);\ng_free(helper);\n\n// after\ng_main_loop_unref(helper->loop);\ng_main_context_pop_thread_default(helper->context);\ng_main_context_unref(helper->context);\ng_free(helper);\n```","locations":[{"ref":"libfwupd/fwupd-client-sync.c:32-52","code":"   32 | static void\n   33 | fwupd_client_helper_free(FwupdClientHelper *helper)\n   34 | {\n   35 | \tif (helper->val != NULL)\n   36 | \t\tg_variant_unref(helper->val);\n   37 | \tif (helper->error != NULL)\n   38 | \t\tg_error_free(helper->error);\n   39 | \tif (helper->array != NULL)\n   40 | \t\tg_ptr_array_unref(helper->array);\n   41 | \tif (helper->hash != NULL)\n   42 | \t\tg_hash_table_unref(helper->hash);\n   43 | \tif (helper->bytes != NULL)\n   44 | \t\tg_bytes_unref(helper->bytes);\n   45 | \tif (helper->device != NULL)\n   46 | \t\tg_object_unref(helper->device);\n   47 | \tg_free(helper->str);\n   48 | \tg_main_loop_unref(helper->loop);\n   49 | \tg_main_context_unref(helper->context);\n   50 | \tg_main_context_pop_thread_default(helper->context);\n   51 | \tg_free(helper);\n   52 | }","lines":21,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupd/fwupd-client-sync.c#L32-L52"}]},
{"id":"UAF_2","type":"use_after_free","type_label":"Use After Free","severity":"medium","difficulty":"hard","description":"`priv->proxy` is read without holding `priv->proxy_mutex` in the large majority of `*_async` functions (e.g. `fwupd_client_get_devices_async` at `libfwupd/fwupd-client.c:1998-2005`, `fwupd_client_activate_async`, `fwupd_client_modify_device_async`, and dozens more), whereas the only two places that mutate `priv->proxy` - `fwupd_client_connect_get_proxy_cb` (`libfwupd/fwupd-client.c:1064-1070`) and `fwupd_client_disconnect` (`libfwupd/fwupd-client.c:1290-1304`) - both correctly take `priv->proxy_mutex` before touching it. Several docblocks in this file explicitly advertise thread-safety (e.g. `fwupd_client_install_bytes_async`, `fwupd_client_download_bytes_async`: \"This method is thread-safe\"). If one thread calls `fwupd_client_disconnect()` (which clears and unrefs `priv->proxy` under the lock) concurrently with another thread calling any of the unlocked `*_async` getters, the second thread can read a `priv->proxy` pointer that is concurrently freed, or use a proxy object whose refcount is being dropped to zero by the other thread - a genuine data race that can lead to a use-after-free of the `GDBusProxy`.","fix":"Take `priv->proxy_mutex` (or use an atomic/RCU-style pointer swap plus `g_object_ref` under the lock before releasing it) whenever reading `priv->proxy` in the `*_async` entry points, mirroring the locking already done in `fwupd_client_connect_get_proxy_cb` and `fwupd_client_disconnect`, e.g.:\n```c\ng_autoptr(GDBusProxy) proxy = NULL;\n{\n        g_autoptr(GMutexLocker) locker = g_mutex_locker_new(&priv->proxy_mutex);\n        if (priv->proxy != NULL)\n                proxy = g_object_ref(priv->proxy);\n}\nif (proxy == NULL) {\n        g_task_return_new_error_literal(task, FWUPD_ERROR, FWUPD_ERROR_NOT_SUPPORTED, \"no proxy\");\n        return;\n}\ng_dbus_proxy_call(proxy, ...);\n```","locations":[{"ref":"libfwupd/fwupd-client.c:1405-1423","code":" 1405 | \tFwupdClientPrivate *priv = GET_PRIVATE(self);\n 1406 | \tg_autoptr(GMutexLocker) locker = g_mutex_locker_new(&priv->proxy_mutex);\n 1407 | \n 1408 | \tg_return_val_if_fail(FWUPD_IS_CLIENT(self), FALSE);\n 1409 | \tg_return_val_if_fail(error == NULL || *error == NULL, FALSE);\n 1410 | \n 1411 | \tg_return_val_if_fail(locker != NULL, FALSE);\n 1412 | \n 1413 | \t/* sanity check */\n 1414 | \tif (priv->proxy == NULL) {\n 1415 | \t\tg_set_error_literal(error, FWUPD_ERROR, FWUPD_ERROR_INTERNAL, \"not connected\");\n 1416 | \t\treturn FALSE;\n 1417 | \t}\n 1418 | \tg_signal_handlers_disconnect_by_data(priv->proxy, self);\n 1419 | \tg_clear_object(&priv->proxy);\n 1420 | \n 1421 | \t/* success */\n 1422 | \treturn TRUE;\n 1423 | }","lines":19,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupd/fwupd-client.c#L1405-L1423"},{"ref":"libfwupd/fwupd-client.c:2113-2128","code":" 2113 | \t/* sanity check before using proxy */\n 2114 | \tif (priv->proxy == NULL) {\n 2115 | \t\tg_task_return_new_error_literal(task,\n 2116 | \t\t\t\t\t\tFWUPD_ERROR,\n 2117 | \t\t\t\t\t\tFWUPD_ERROR_NOT_SUPPORTED,\n 2118 | \t\t\t\t\t\t\"no proxy\");\n 2119 | \t\treturn;\n 2120 | \t}\n 2121 | \tg_dbus_proxy_call(priv->proxy,\n 2122 | \t\t\t  \"GetDevices\",\n 2123 | \t\t\t  NULL,\n 2124 | \t\t\t  G_DBUS_CALL_FLAGS_NONE,\n 2125 | \t\t\t  FWUPD_CLIENT_DBUS_PROXY_TIMEOUT,\n 2126 | \t\t\t  cancellable,\n 2127 | \t\t\t  fwupd_client_get_devices_cb,\n 2128 | \t\t\t  g_steal_pointer(&task));","lines":16,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupd/fwupd-client.c#L2113-L2128"},{"ref":"libfwupd/fwupd-client.c:3160-3175","code":" 3160 | \t/* sanity check before using proxy */\n 3161 | \tif (priv->proxy == NULL) {\n 3162 | \t\tg_task_return_new_error_literal(task,\n 3163 | \t\t\t\t\t\tFWUPD_ERROR,\n 3164 | \t\t\t\t\t\tFWUPD_ERROR_NOT_SUPPORTED,\n 3165 | \t\t\t\t\t\t\"no proxy\");\n 3166 | \t\treturn;\n 3167 | \t}\n 3168 | \tg_dbus_proxy_call(priv->proxy,\n 3169 | \t\t\t  \"Activate\",\n 3170 | \t\t\t  g_variant_new(\"(s)\", device_id),\n 3171 | \t\t\t  G_DBUS_CALL_FLAGS_NONE,\n 3172 | \t\t\t  FWUPD_CLIENT_DBUS_PROXY_TIMEOUT,\n 3173 | \t\t\t  cancellable,\n 3174 | \t\t\t  fwupd_client_activate_cb,\n 3175 | \t\t\t  g_steal_pointer(&task));","lines":16,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupd/fwupd-client.c#L3160-L3175"}]},
{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"In `fu_common_get_block_devices()` (FreeBSD implementation), each iteration of `while (g_variant_iter_next(obj_iter, \"{&o@a{sa{sv}}}\", &obj, &ifaces))` obtains a new, owned reference to `ifaces` (the `@` format specifier transfers a new `GVariant` reference). When the object path does not start with `UDISKS_BLOCK_DEVICE_PATH`, the code does `continue;` at line 78, which skips the `g_variant_unref(ifaces);` at line 105 that only runs at the end of the loop body. Since `UDisks2`'s `GetManagedObjects` returns many non-block-device objects (drives, jobs, the manager itself, etc.), most loop iterations take this path and leak a `GVariant` reference every time `fu_common_get_block_devices()` is called.","fix":"Unref `ifaces` before the early `continue`, e.g.:\n\n```c\nif (strncmp(obj, UDISKS_BLOCK_DEVICE_PATH, device_path_len) != 0) {\n    g_variant_unref(ifaces);\n    continue;\n}\n```\n\nor restructure to use `g_autoptr(GVariant) ifaces = NULL;` inside the loop body so it is freed automatically on every path.","locations":[{"ref":"libfwupdplugin/fu-common-freebsd.c:71-106","code":"   71 | \tg_variant_get(output, \"(a{oa{sa{sv}}})\", &obj_iter);\n   72 | \twhile (g_variant_iter_next(obj_iter, \"{&o@a{sa{sv}}}\", &obj, &ifaces)) {\n   73 | \t\tconst gchar *iface;\n   74 | \t\tGVariant *props;\n   75 | \t\tGVariantIter iface_iter;\n   76 | \n   77 | \t\tif (strncmp(obj, UDISKS_BLOCK_DEVICE_PATH, device_path_len) != 0)\n   78 | \t\t\tcontinue;\n   79 | \n   80 | \t\tg_variant_iter_init(&iface_iter, ifaces);\n   81 | \t\twhile (g_variant_iter_next(&iface_iter, \"{&s@a{sv}}\", &iface, &props)) {\n   82 | \t\t\tg_autoptr(GDBusProxy) proxy_blk = NULL;\n   83 | \n   84 | \t\t\tg_variant_unref(props);\n   85 | \n   86 | \t\t\tif (g_strcmp0(iface, UDISKS_DBUS_INTERFACE_BLOCK) != 0)\n   87 | \t\t\t\tcontinue;\n   88 | \n   89 | \t\t\tproxy_blk = g_dbus_proxy_new_sync(connection,\n   90 | \t\t\t\t\t\t\t  G_DBUS_PROXY_FLAGS_NONE,\n   91 | \t\t\t\t\t\t\t  NULL,\n   92 | \t\t\t\t\t\t\t  UDISKS_DBUS_SERVICE,\n   93 | \t\t\t\t\t\t\t  obj,\n   94 | \t\t\t\t\t\t\t  UDISKS_DBUS_INTERFACE_BLOCK,\n   95 | \t\t\t\t\t\t\t  NULL,\n   96 | \t\t\t\t\t\t\t  error);\n   97 | \t\t\tif (proxy_blk == NULL) {\n   98 | \t\t\t\tg_prefix_error(error,\n   99 | \t\t\t\t\t       \"failed to initialize d-bus proxy for %s: \",\n  100 | \t\t\t\t\t       obj);\n  101 | \t\t\t\treturn NULL;\n  102 | \t\t\t}\n  103 | \t\t\tg_ptr_array_add(devices, g_steal_pointer(&proxy_blk));\n  104 | \t\t}\n  105 | \t\tg_variant_unref(ifaces);\n  106 | \t}","lines":36,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-common-freebsd.c#L71-L106"}]},
{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"very_easy","description":"In `fu_aver_safeisp_device_write_firmware`, the `g_autoptr(FuChunkArray) chunks` variable declared at `plugins/aver-hid/fu-aver-safeisp-device.c:271` is assigned twice: once for the CX3 firmware (`plugins/aver-hid/fu-aver-safeisp-device.c:338`) and again for the M12 firmware (`plugins/aver-hid/fu-aver-safeisp-device.c:365`). The second assignment overwrites the pointer without releasing the first `FuChunkArray`, so the CX3 chunk array (and the `GBytes` it wraps) is leaked on every firmware update. `g_autoptr` only frees the final value held at scope exit, not intermediate values that are overwritten.","fix":"Use a separate local variable for each chunk array (e.g. `g_autoptr(FuChunkArray) chunks_cx3` and `g_autoptr(FuChunkArray) chunks_m12`), or explicitly clear the first one before reassigning:\n```c\ng_autoptr(FuChunkArray) chunks_cx3 = fu_chunk_array_new_from_bytes(cx3_fw, FU_CHUNK_ADDR_OFFSET_NONE, FU_CHUNK_PAGESZ_NONE, 512);\n...\ng_autoptr(FuChunkArray) chunks_m12 = fu_chunk_array_new_from_bytes(m12_fw, FU_CHUNK_ADDR_OFFSET_NONE, FU_CHUNK_PAGESZ_NONE, 512);\n```\nso the CX3 `FuChunkArray` is not silently dropped without being freed.","locations":[{"ref":"plugins/aver-hid/fu-aver-safeisp-device.c:271","code":"  271 | \tg_autoptr(FuChunkArray) chunks = NULL;","lines":1,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/aver-hid/fu-aver-safeisp-device.c#L271"},{"ref":"plugins/aver-hid/fu-aver-safeisp-device.c:338","code":"  338 | \tchunks = fu_chunk_array_new_from_bytes(cx3_fw,","lines":1,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/aver-hid/fu-aver-safeisp-device.c#L338"},{"ref":"plugins/aver-hid/fu-aver-safeisp-device.c:368","code":"  368 | \tchunks = fu_chunk_array_new_from_bytes(m12_fw,","lines":1,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/aver-hid/fu-aver-safeisp-device.c#L368"}]},
{"id":"MEM_3","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"`fu_devlink_device_finalize()` (`plugins/devlink/fu-devlink-device.c`) frees `self->bus_name`, `self->dev_name` and `self->fixed_versions`, but never releases `self->nlg` (the `FuDevlinkGenSocket` opened in `fu_devlink_device_open()`) or `self->search_path_locker` (the `FuKernelSearchPathLocker` created in `fu_devlink_device_prepare()`). `fu_devlink_device_close()` closes `self->nlg` but does not clear the pointer, and `fu_devlink_device_cleanup()` clears `self->search_path_locker` via `g_clear_object()`. If the object is destroyed without `close()`/`cleanup()` having run first (e.g. an error path elsewhere in the device manager that skips the normal open/prepare/cleanup/close sequence, or the device being unreffed right after a failed `open()`/`prepare()`), the socket resource and/or path locker are leaked because `finalize()` has no fallback cleanup for them.","fix":"Add defensive cleanup in `fu_devlink_device_finalize()` as a safety net, and NULL out `self->nlg` after closing it:\n```c\nstatic void\nfu_devlink_device_finalize(GObject *object)\n{\n    FuDevlinkDevice *self = FU_DEVLINK_DEVICE(object);\n    g_free(self->bus_name);\n    g_free(self->dev_name);\n    if (self->fixed_versions != NULL)\n        g_ptr_array_unref(self->fixed_versions);\n    if (self->nlg != NULL)\n        fu_devlink_netlink_gen_socket_close(self->nlg);\n    g_clear_object(&self->search_path_locker);\n    G_OBJECT_CLASS(fu_devlink_device_parent_class)->finalize(object);\n}\n```","locations":[{"ref":"plugins/devlink/fu-devlink-device.c:980-991","code":"  980 | static void\n  981 | fu_devlink_device_finalize(GObject *object)\n  982 | {\n  983 | \tFuDevlinkDevice *self = FU_DEVLINK_DEVICE(object);\n  984 | \n  985 | \tg_free(self->bus_name);\n  986 | \tg_free(self->dev_name);\n  987 | \tif (self->fixed_versions != NULL)\n  988 | \t\tg_ptr_array_unref(self->fixed_versions);\n  989 | \n  990 | \tG_OBJECT_CLASS(fu_devlink_device_parent_class)->finalize(object);\n  991 | }","lines":12,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/devlink/fu-devlink-device.c#L980-L991"},{"ref":"plugins/devlink/fu-devlink-device.c:782-790","code":"  782 | fu_devlink_device_close(FuDevice *device, GError **error)\n  783 | {\n  784 | \tFuDevlinkDevice *self = FU_DEVLINK_DEVICE(device);\n  785 | \n  786 | \t/* close devlink netlink socket */\n  787 | \tfu_devlink_netlink_gen_socket_close(self->nlg);\n  788 | \n  789 | \treturn TRUE;\n  790 | }","lines":9,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/devlink/fu-devlink-device.c#L782-L790"},{"ref":"plugins/devlink/fu-devlink-device.c:842-853","code":"  842 | fu_devlink_device_cleanup(FuDevice *device,\n  843 | \t\t\t  FuProgress *progress,\n  844 | \t\t\t  FwupdInstallFlags flags,\n  845 | \t\t\t  GError **error)\n  846 | {\n  847 | \tFuDevlinkDevice *self = FU_DEVLINK_DEVICE(device);\n  848 | \n  849 | \t/* restore the firmware search path */\n  850 | \tg_clear_object(&self->search_path_locker);\n  851 | \n  852 | \treturn TRUE;\n  853 | }","lines":12,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/devlink/fu-devlink-device.c#L842-L853"}]},
{"id":"MEM_4","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"`fu_fit_firmware_get_image_root()` in `libfwupdplugin/fu-fit-firmware.c` creates `img = fu_fdt_image_new();` (owning ref) and, if `fu_firmware_add_image(FU_FIRMWARE(self), img, NULL)` fails, returns `NULL` without unreffing `img`. Since `fu_firmware_add_image()` does not take ownership on failure, the newly created `FuFdtImage` is leaked whenever adding the root image fails (e.g. the parent has hit its `images_max` limit).","fix":"Unref `img` on the failure path, e.g. wrap it in `g_autoptr(FuFirmware) img = fu_fdt_image_new();` and `return NULL;` on failure, or explicitly call `g_object_unref(img);` before returning `NULL`.","locations":[{"ref":"libfwupdplugin/fu-fit-firmware.c:32-45","code":"   32 | static FuFdtImage *\n   33 | fu_fit_firmware_get_image_root(FuFitFirmware *self)\n   34 | {\n   35 | \tFuFirmware *img = fu_firmware_get_image_by_id(FU_FIRMWARE(self), NULL, NULL);\n   36 | \tif (img != NULL)\n   37 | \t\treturn FU_FDT_IMAGE(img);\n   38 | \timg = fu_fdt_image_new();\n   39 | \tfu_fdt_image_set_attr_uint32(FU_FDT_IMAGE(img), FU_FIT_FIRMWARE_ATTR_TIMESTAMP, 0x0);\n   40 | \tfu_fdt_image_set_attr_str(FU_FDT_IMAGE(img), \"description\", \"Firmware image\");\n   41 | \tfu_fdt_image_set_attr_str(FU_FDT_IMAGE(img), \"creator\", \"fwupd\");\n   42 | \tif (!fu_firmware_add_image(FU_FIRMWARE(self), img, NULL))\n   43 | \t\treturn NULL;\n   44 | \treturn FU_FDT_IMAGE(img);\n   45 | }","lines":14,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-fit-firmware.c#L32-L45"}]},
{"id":"MEM_5","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"`fu_genesys_usbhub_firmware_build` (`plugins/genesys/fu-genesys-usbhub-firmware.c:470-529`) unconditionally assigns `self->st_static_ts = fu_struct_genesys_ts_static_new();` without first checking (and freeing) any previously-set `self->st_static_ts`. If `build()` is ever invoked more than once on the same `FuGenesysUsbhubFirmware` instance (e.g. the object is reused across builds, or `build()` is called after a prior `parse()` already populated `st_static_ts`), the previous `FuStructGenesysTsStatic` allocation is leaked because it is only freed once, in `fu_genesys_usbhub_firmware_finalize`.","fix":"Free any existing struct before allocating a new one:\n```c\nif (self->st_static_ts != NULL)\n\tfu_struct_genesys_ts_static_unref(self->st_static_ts);\nself->st_static_ts = fu_struct_genesys_ts_static_new();\n```","locations":[{"ref":"plugins/genesys/fu-genesys-usbhub-firmware.c:470-477","code":"  470 | static gboolean\n  471 | fu_genesys_usbhub_firmware_build(FuFirmware *firmware, XbNode *n, GError **error)\n  472 | {\n  473 | \tFuGenesysUsbhubFirmware *self = FU_GENESYS_USBHUB_FIRMWARE(firmware);\n  474 | \tconst gchar *tmp;\n  475 | \n  476 | \t/* optional properties */\n  477 | \tself->st_static_ts = fu_struct_genesys_ts_static_new();","lines":8,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/genesys/fu-genesys-usbhub-firmware.c#L470-L477"}]},
{"id":"MEM_6","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"In `fu_igsc_device_setup()` (`plugins/intel-gsc/fu-igsc-device.c:298-377`), `self->project = fu_struct_igsc_fw_version_get_project(st_fwversion);` (line 328) assigns a newly heap-allocated string (the same generated getter used elsewhere, e.g. `fu-igsc-code-firmware.c:98`, is always stored into a `g_autofree gchar *`, confirming transfer-full semantics) directly to `self->project` without freeing any previous value. `self->project` is only freed once, in `fu_igsc_device_finalize()` (`plugins/intel-gsc/fu-igsc-device.c:888`). If `setup()` is ever re-invoked on the same `FuIgscDevice` instance (e.g. a forced re-probe/re-setup after a firmware write or a `fu_device_reprobe()`), the previously-allocated `project` string is leaked.","fix":"Free the old value before overwriting it, e.g. ```c\ng_free(self->project);\nself->project = fu_struct_igsc_fw_version_get_project(st_fwversion);\n```","locations":[{"ref":"plugins/intel-gsc/fu-igsc-device.c:328","code":"  328 | \tself->project = fu_struct_igsc_fw_version_get_project(st_fwversion);","lines":1,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/intel-gsc/fu-igsc-device.c#L328"}]},
{"id":"MEM_7","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"`fu_console_set_main_context()` unconditionally does `self->main_ctx = g_main_context_ref(main_ctx);` without first releasing any previously-held `self->main_ctx`. If it is ever called a second time on the same `FuConsole` (the API gives no indication this is disallowed, and `self->main_ctx` is not asserted to be `NULL`), the previous `GMainContext` reference is leaked.","fix":"```c\nvoid\nfu_console_set_main_context(FuConsole *self, GMainContext *main_ctx)\n{\n\tg_clear_pointer(&self->main_ctx, g_main_context_unref);\n\tself->main_ctx = g_main_context_ref(main_ctx);\n}\n```","locations":[{"ref":"src/fu-console.c:694-698","code":"  694 | void\n  695 | fu_console_set_main_context(FuConsole *self, GMainContext *main_ctx)\n  696 | {\n  697 | \tself->main_ctx = g_main_context_ref(main_ctx);\n  698 | }","lines":5,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/src/fu-console.c#L694-L698"}]},
{"id":"MEM_8","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"In `fu_jcat_gnutls_pkcs7_engine_pubkey_sign()`, after `gnutls_pkcs7_export2()` succeeds, the code checks `d.size == 0` and returns `NULL` on that path (lines 409-416) *before* `d_payload = d.data;` is executed. Since `d.data` was allocated by GnuTLS inside `gnutls_pkcs7_export2()`, and the `g_autoptr(gnutls_data_t) d_payload` guard that is meant to free it via `gnutls_free` is only assigned afterwards (`d_payload = d.data;` at line 418), the empty-output error path leaks the buffer returned in `d.data`.","fix":"Assign `d_payload` before checking the size so the `g_autoptr` cleanup always owns the buffer:\n\n```c\nrc = gnutls_pkcs7_export2(pkcs7, GNUTLS_X509_FMT_PEM, &d);\nif (!fu_jcat_gnutls_rc_to_error(rc, error)) {\n\tg_prefix_error_literal(error, \"failed to pkcs7_export: \");\n\treturn NULL;\n}\nd_payload = d.data;\nif (d.size == 0) {\n\tg_set_error_literal(error,\n\t\t\t    FWUPD_ERROR,\n\t\t\t    FWUPD_ERROR_INVALID_DATA,\n\t\t\t    \"pkcs7 export produced empty output\");\n\treturn NULL;\n}\nstr = g_strndup((const gchar *)d_payload, d.size);\n```","locations":[{"ref":"src/fu-jcat-gnutls-pkcs7-engine.c:404-418","code":"  404 | \trc = gnutls_pkcs7_export2(pkcs7, GNUTLS_X509_FMT_PEM, &d);\n  405 | \tif (!fu_jcat_gnutls_rc_to_error(rc, error)) {\n  406 | \t\tg_prefix_error_literal(error, \"failed to pkcs7_export: \");\n  407 | \t\treturn NULL;\n  408 | \t}\n  409 | \tif (d.size == 0) {\n  410 | \t\tg_set_error_literal(error,\n  411 | \t\t\t\t    FWUPD_ERROR,\n  412 | \t\t\t\t    FWUPD_ERROR_INVALID_DATA,\n  413 | \t\t\t\t    \"pkcs7 export produced empty output\");\n  414 | \t\treturn NULL;\n  415 | \t}\n  416 | \td_payload = d.data;\n  417 | \tstr = g_strndup((const gchar *)d_payload, d.size);\n  418 | \treturn fwupd_jcat_blob_new_utf8(FWUPD_JCAT_BLOB_KIND_PKCS7, str);","lines":15,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db2934007 {"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"`fu_efi_section_write()` in `fu-efi-section.c` writes the section `size` field with `fu_struct_efi_section_set_size(st, st->buf->len + g_bytes_get_size(blob))`. The `size` field of `FuStructEfiSection` is a `u24le` (see `libfwupdplugin/fu-efi.rs`, `struct FuStructEfiSection { size: u24le, ... }`), so the generated setter calls `fu_memwrite_uint24()`, which silently truncates any value to its low 3 bytes (`libfwupdplugin/fu-mem.c`, `fu_memwrite_uint24()` just `memcpy`s 3 bytes of the 32-bit value, with no bounds check). `fu_efi_section_class_init()` sets `fu_firmware_set_size_max(firmware_class, 1 * FU_GB)` (non-fuzzer build), and the *parser* (`fu_efi_section_parse()`) explicitly supports sections larger than `0xFFFFFF` via the extended `FuStructEfiSection2` format (`size == 0xFFFFFF` sentinel plus a 32-bit `extended_size`). However `fu_efi_section_write()` never checks the combined size against `0xFFFFFF` and never emits the `FuStructEfiSection2` extended-size layout - it always writes the plain 3-byte `size` field. Any section whose payload plus header exceeds `0xFFFFFF` bytes (~16 MiB) will therefore be written with a silently wrapped/truncated `size` value, producing a corrupted EFI firmware volume that will misparse (or parse with the wrong length, misaligning every following sibling section) when read back.","fix":"In `fu_efi_section_write()`, compute the total size first and check it against `0xFFFFFF`; if it is larger, build a `FuStructEfiSection2` (setting `size` to `0xFFFFFF` and `extended_size` to the real length) instead of the plain `FuStructEfiSection`, mirroring what `fu_efi_section_parse()` already does for reading, e.g.:\n```c\ngsize total_size = st->buf->len + g_bytes_get_size(blob);\nif (total_size > 0xFFFFFF) {\n    /* switch to FuStructEfiSection2 with size=0xFFFFFF and extended_size=total_size */\n} else {\n    fu_struct_efi_section_set_size(st, total_size);\n}\n```","locations":[{"ref":"libfwupdplugin/fu-efi-section.c:426-460","code":"  426 | static GByteArray *\n  427 | fu_efi_section_write(FuFirmware *firmware, GError **error)\n  428 | {\n  429 | \tFuEfiSection *self = FU_EFI_SECTION(firmware);\n  430 | \tFuEfiSectionPrivate *priv = GET_PRIVATE(self);\n  431 | \tg_autoptr(FuStructEfiSection) st = fu_struct_efi_section_new();\n  432 | \tg_autoptr(GBytes) blob = NULL;\n  433 | \n  434 | \t/* simple blob for now */\n  435 | \tblob = fu_firmware_get_bytes_with_patches(firmware, error);\n  436 | \tif (blob == NULL)\n  437 | \t\treturn NULL;\n  438 | \n  439 | \t/* header */\n  440 | \tif (priv->type == FU_EFI_SECTION_TYPE_GUID_DEFINED) {\n  441 | \t\tfwupd_guid_t guid = {0x0};\n  442 | \t\tg_autoptr(FuStructEfiSectionGuidDefined) st_def =\n  443 | \t\t    fu_struct_efi_section_guid_defined_new();\n  444 | \t\tif (!fwupd_guid_from_string(fu_firmware_get_id(firmware),\n  445 | \t\t\t\t\t    &guid,\n  446 | \t\t\t\t\t    FWUPD_GUID_FLAG_MIXED_ENDIAN,\n  447 | \t\t\t\t\t    error))\n  448 | \t\t\treturn NULL;\n  449 | \t\tfu_struct_efi_section_guid_defined_set_name(st_def, &guid);\n  450 | \t\tfu_struct_efi_section_guid_defined_set_offset(st_def,\n  451 | \t\t\t\t\t\t\t      st->buf->len + st_def->buf->len);\n  452 | \t\tfu_byte_array_append_array(st->buf, st_def->buf);\n  453 | \t}\n  454 | \tfu_struct_efi_section_set_type(st, priv->type);\n  455 | \tfu_struct_efi_section_set_size(st, st->buf->len + g_bytes_get_size(blob));\n  456 | \n  457 | \t/* blob */\n  458 | \tfu_byte_array_append_bytes(st->buf, blob);\n  459 | \treturn g_steal_pointer(&st->buf);\n  460 | }","lines":35,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-efi-section.c#L426-L460"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"Throughout `plugins/devlink/fu-devlink-netlink.c` and `plugins/devlink/fu-devlink-plugin.c`, netlink attribute callbacks (`fu_devlink_netlink_attr_cb`, `fu_devlink_netlink_genl_ctrl_attr_cb`, `fu_devlink_netlink_genl_mcast_group_attr_cb`, `fu_devlink_netlink_nlmsgerr_attr_cb`) only call `mnl_attr_type_valid()`, which merely bounds-checks the attribute *type* index. None of the call sites that subsequently read string attributes with `mnl_attr_get_str()` (e.g. `DEVLINK_ATTR_BUS_NAME`, `DEVLINK_ATTR_DEV_NAME`, `DEVLINK_ATTR_INFO_SERIAL_NUMBER`, `DEVLINK_ATTR_FLASH_UPDATE_FILE_NAME`, `DEVLINK_ATTR_FLASH_UPDATE_COMPONENT`, `CTRL_ATTR_MCAST_GRP_NAME`, `NLMSGERR_ATTR_MSG`) call `mnl_attr_validate(attr, MNL_TYPE_NUL_STRING)` first. `mnl_attr_get_str()` simply casts the attribute payload to `const char *` without checking NUL-termination. For a malformed or crafted message (reachable via the `is_emulated`/recorded-event replay path, where `ResponseData` bytes are attacker/tester supplied and copied straight into `nlg->buf`), a non-NUL-terminated string attribute placed near the end of the fixed-size `nlg->buf` allocation can cause subsequent `%s`-style formatting (`g_strdup_printf`, `fu_strsafe`) to read past the end of the buffer.","fix":"Validate string attributes before use, e.g. in the attribute callbacks call `if (mnl_attr_validate(attr, MNL_TYPE_NUL_STRING) < 0) return MNL_CB_OK;` before storing the attribute in `tb[type]`, so unterminated/malformed string attributes are rejected instead of trusted blindly.","locations":[{"ref":"plugins/devlink/fu-devlink-netlink.c:642-656","code":"  642 | /* simple attribute parser callback for devlink attributes */\n  643 | gint\n  644 | fu_devlink_netlink_attr_cb(const struct nlattr *attr, gpointer data)\n  645 | {\n  646 | \tconst struct nlattr **tb = data;\n  647 | \tgint type = mnl_attr_get_type(attr);\n  648 | \tgint rc;\n  649 | \n  650 | \trc = mnl_attr_type_valid(attr, DEVLINK_ATTR_MAX);\n  651 | \tif (rc < 0)\n  652 | \t\treturn MNL_CB_OK;\n  653 | \n  654 | \ttb[type] = attr;\n  655 | \treturn MNL_CB_OK;\n  656 | }","lines":15,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/devlink/fu-devlink-netlink.c#L642-L656"},{"ref":"plugins/devlink/fu-devlink-plugin.c:24-40","code":"   24 | fu_devlink_plugin_get_serial_number_cb(const struct nlmsghdr *nlh, gpointer data)\n   25 | {\n   26 | \tstruct genlmsghdr *genl = mnl_nlmsg_get_payload(nlh);\n   27 | \tstruct nlattr *tb[DEVLINK_ATTR_MAX + 1] = {};\n   28 | \tgchar **serial_number = data;\n   29 | \n   30 | \tif (genl->cmd != DEVLINK_CMD_INFO_GET)\n   31 | \t\treturn MNL_CB_OK;\n   32 | \n   33 | \tmnl_attr_parse(nlh, sizeof(*genl), fu_devlink_netlink_attr_cb, tb);\n   34 | \n   35 | \tif (tb[DEVLINK_ATTR_INFO_SERIAL_NUMBER] != NULL)\n   36 | \t\t*serial_number =\n   37 | \t\t    fu_strsafe(mnl_attr_get_str(tb[DEVLINK_ATTR_INFO_SERIAL_NUMBER]), G_MAXSIZE);\n   38 | \n   39 | \treturn MNL_CB_OK;\n   40 | }","lines":17,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/devlink/fu-devlink-plugin.c#L24-L40"},{"ref":"plugins/devlink/fu-devlink-plugin.c:74-135","code":"   74 | static void\n   75 | fu_devlink_plugin_device_added_from_netlink(FuDevlinkPlugin *self, const struct nlmsghdr *nlh)\n   76 | {\n   77 | \tstruct nlattr *tb[DEVLINK_ATTR_MAX + 1] = {};\n   78 | \tconst gchar *bus_name = NULL;\n   79 | \tconst gchar *dev_name = NULL;\n   80 | \tg_autoptr(FuDevice) devlink_device = NULL;\n   81 | \tg_autoptr(GError) error_local = NULL;\n   82 | \tg_autofree gchar *serial_number = NULL;\n   83 | \tg_autofree gchar *cache_id = NULL;\n   84 | \n   85 | \t/* parse netlink attributes using libmnl */\n   86 | \tmnl_attr_parse(nlh, sizeof(struct genlmsghdr), fu_devlink_netlink_attr_cb, tb);\n   87 | \n   88 | \t/* extract bus and device names */\n   89 | \tif (tb[DEVLINK_ATTR_BUS_NAME] != NULL)\n   90 | \t\tbus_name = mnl_attr_get_str(tb[DEVLINK_ATTR_BUS_NAME]);\n   91 | \tif (tb[DEVLINK_ATTR_DEV_NAME] != NULL)\n   92 | \t\tdev_name = mnl_attr_get_str(tb[DEVLINK_ATTR_DEV_NAME]);\n   93 | \n   94 | \tif (bus_name == NULL || dev_name == NULL) {\n   95 | \t\tg_debug(\"devlink device notification missing bus_name or dev_name\");\n   96 | \t\treturn;\n   97 | \t}\n   98 | \n   99 | \tg_debug(\"devlink device added: %s/%s\", bus_name, dev_name);\n  100 | \n  101 | \tif (!fu_devlink_plugin_get_serial_number(bus_name,\n  102 | \t\t\t\t\t\t dev_name,\n  103 | \t\t\t\t\t\t &serial_number,\n  104 | \t\t\t\t\t\t &error_local)) {\n  105 | \t\tg_warning(\"failed to get serial number for devlink device %s/%s: %s\",\n  106 | \t\t\t  bus_name,\n  107 | \t\t\t  dev_name,\n  108 | \t\t\t  error_local->message);\n  109 | \t\treturn;\n  110 | \t}\n  111 | \n  112 | \t/* use backend to create device with proper hierarchy */\n  113 | \tdevlink_device = fu_devlink_backend_device_added(self->backend,\n  114 | \t\t\t\t\t\t\t bus_name,\n  115 | \t\t\t\t\t\t\t dev_name,\n  116 | \t\t\t\t\t\t\t serial_number,\n  117 | \t\t\t\t\t\t\t &error_local);\n  118 | \tif (devlink_device == NULL) {\n  119 | \t\tif (g_error_matches(error_local, FWUPD_ERROR, FWUPD_ERROR_NOT_SUPPORTED) ||\n  120 | \t\t    g_error_matches(error_local, FWUPD_ERROR, FWUPD_ERROR_NOTHING_TO_DO)) {\n  121 | \t\t\tg_debug(\"failed to add devlink device %s/%s: %s\",\n  122 | \t\t\t\tbus_name,\n  123 | \t\t\t\tdev_name,\n  124 | \t\t\t\terror_local->message);\n  125 | \t\t} else {\n  126 | \t\t\tg_warning(\"failed to add devlink device %s/%s: %s\",\n  127 | \t\t\t\t  bus_name,\n  128 | \t\t\t\t  dev_name,\n  129 | \t\t\t\t  error_local->message);\n  130 | \t\t}\n  131 | \t\treturn;\n  132 | \t}\n  133 | \tcache_id = g_strdup_printf(\"%s/%s\", bus_name, dev_name);\n  134 | \tfu_plugin_cache_add(FU_PLUGIN(self), cache_id, devlink_device);\n  135 | }","lines":62,"link"
