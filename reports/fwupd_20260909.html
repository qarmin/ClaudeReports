{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `plugins/elan-ts/fu-elan-ts.rs`, the `FuElanTsMemAddr` enum documents `UpdateCounter = 0x8060` (32 bytes after `Page1 = 0x8040`), but `FuStructElanTsInfoPage` (the struct describing the info page starting at `Page1`, per its own comment `// info page data, starting at 0x8040`) reserves `_reserved1: [u8; 0x40]` (64 bytes) before the `update_counter` field. That places `update_counter` at absolute offset `0x8040 + 0x40 = 0x8080`, which is exactly the address documented for a completely different register, `InfoRomFwid = 0x8080`, not `UpdateCounter`. Any C code that parses `FuStructElanTsInfoPage` and expects `update_counter`/`update_year`/`update_month`/`update_day`/`update_hour`/`update_minute` to correspond to the `UpdateCounter`/`LastUpdateYear`/`LastUpdateMonthDay`/`LastUpdateTime` register addresses will read the wrong bytes (actually reading into the `InfoRomFwid` region and beyond), producing an incorrect last-update date/counter or corrupting whatever depends on `InfoRomFwid`.","fix":"Align the reserved region with the documented register map: change `_reserved1: [u8; 0x40]` to `_reserved1: [u8; 0x20]` so that `update_counter` lands at `0x8040 + 0x20 = 0x8060`, matching `FuElanTsMemAddr::UpdateCounter`. Then re-check the remaining field widths/offsets (`update_year`/`update_month`/`update_day`/`update_hour`/`update_minute`) against `LastUpdateYear`/`LastUpdateMonthDay`/`LastUpdateTime` (which are 1 byte apart in the enum, while the struct currently models `update_year` as a 2-byte `u16le`) to make sure the whole struct layout is consistent with the documented single-byte register addresses.","locations":[{"ref":"plugins/elan-ts/fu-elan-ts.rs:22-45","code":"   22 | enum FuElanTsMemAddr {\n   23 |     InfoPageWrite       = 0x0040,\n   24 |     InfoRom             = 0x8000,\n   25 |     RemarkId            = 0x801F,\n   26 |     Page1               = 0x8040,\n   27 |     UpdateCounter       = 0x8060,\n   28 |     LastUpdateYear      = 0x8061,\n   29 |     LastUpdateMonthDay  = 0x8062,\n   30 |     LastUpdateTime      = 0x8063,\n   31 |     InfoRomFwid         = 0x8080,\n   32 | }\n   33 | \n   34 | // info page data, starting at 0x8040\n   35 | #[derive(Parse, Setters)]\n   36 | struct FuStructElanTsInfoPage {\n   37 |     _reserved1: [u8; 0x40],\n   38 |     update_counter: u16le,\n   39 |     update_year: u16le, // BCD\n   40 |     update_month: u8,   // BCD\n   41 |     update_day: u8,     // BCD\n   42 |     update_hour: u8,    // BCD\n   43 |     update_minute: u8,  // BCD\n   44 |     _reserved2: [u8; 56],\n   45 | }","lines":24,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/elan-ts/fu-elan-ts.rs#L22-L45"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `plugins/emmc/fu-emmc-device.c`, `fu_emmc_device_check_firmware` validates that `fu_firmware_get_size(firmware) % self->sect_size == 0` (the hardware-reported eMMC sector size), but `fu_emmc_device_write_firmware` actually chunks and writes the firmware using `sector_size = self->write_block_size ?: self->sect_size` (`self->write_block_size` comes from the `EmmcBlockSize` quirk, `fu_elantp`-style override). If a quirk sets `EmmcBlockSize` to a value larger than `self->sect_size` (and firmware size is only guaranteed aligned to `self->sect_size`, not to `sector_size`), the last `FuChunk` produced by `fu_chunk_array_new_from_stream(stream, ..., sector_size, error)` can be smaller than `sector_size`. The write loop nonetheless always programs `multi_cmd->cmds[2].blocks = sector_size / 512` 512-byte blocks (fixed once, outside the per-chunk loop) and calls `mmc_ioc_cmd_set_data(multi_cmd->cmds[2], fu_chunk_get_data(chk))`, so the kernel `MMC_IOC_MULTI_CMD` ioctl will read `sector_size` bytes starting at the last chunk's (undersized) data buffer -- an out-of-bounds heap read whose contents get written to the eMMC device.","fix":"Either validate `fu_firmware_get_size(firmware) % sector_size == 0` using the actual write `sector_size` (computed the same way as in `fu_emmc_device_write_firmware`) inside `fu_emmc_device_check_firmware`, or clamp `multi_cmd->cmds[2].blocks` per-iteration to `fu_chunk_get_data_sz(chk) / 512` instead of the fixed `sector_size / 512`.","locations":[{"ref":"plugins/emmc/fu-emmc-device.c:350","code":"  350 | \tif ((fu_firmware_get_size(firmware) % self->sect_size) > 0) {","lines":1,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/emmc/fu-emmc-device.c#L350"},{"ref":"plugins/emmc/fu-emmc-device.c:397","code":"  397 | \tsector_size = self->write_block_size ?: self->sect_size;","lines":1,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/emmc/fu-emmc-device.c#L397"},{"ref":"plugins/emmc/fu-emmc-device.c:433-436","code":"  433 | \tmulti_cmd->cmds[2].opcode = MMC_WRITE_MULTIPLE_BLOCK;\n  434 | \tmulti_cmd->cmds[2].blksz = 512;\n  435 | \tmulti_cmd->cmds[2].blocks = sector_size / 512;\n  436 | \tmulti_cmd->cmds[2].arg = arg;","lines":4,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/emmc/fu-emmc-device.c#L433-L436"},{"ref":"plugins/emmc/fu-emmc-device.c:465","code":"  465 | \t\t\tmmc_ioc_cmd_set_data(multi_cmd->cmds[2], fu_chunk_get_data(chk));","lines":1,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/emmc/fu-emmc-device.c#L465"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `fu_ep963x_device_write_firmware`, the outer loop iterates `i` from `0` to `fu_chunk_array_length(blocks) - 1` (up to 248 for the fixed `FU_EP963_FIRMWARE_SIZE` of `0x1f000` bytes split into 512-byte blocks), but the progress update at the end of each outer iteration uses the wrong array for the total: `fu_progress_set_percentage_full(fu_progress_get_child(progress), (gsize)i + 1, (gsize)fu_chunk_array_length(chunks));`. `chunks` is the inner, per-block 4-byte sub-chunk array (re-created every outer iteration, length `FU_EP963_TRANSFER_BLOCK_SIZE / FU_EP963_TRANSFER_CHUNK_SIZE` = 128), not the outer `blocks` array. Once `i + 1` exceeds 128 (which happens on every real firmware update, since there are 248 blocks total), `progress_done > progress_total` is passed to `fu_progress_set_percentage_full`, violating its `g_return_if_fail(progress_done <= progress_total)` precondition in `libfwupdplugin/fu-progress.c`. This produces a `g_critical` on every affected iteration (and would abort the process under `G_DEBUG=fatal-criticals`, as used by fwupd's own test/CI configurations) and leaves the progress percentage stuck/incorrect for the rest of the update.","fix":"Use the outer block array's length as the total, not the inner per-block chunk array:\n```c\nfu_progress_set_percentage_full(fu_progress_get_child(progress),\n                                (gsize)i + 1,\n                                (gsize)fu_chunk_array_length(blocks));\n```","locations":[{"ref":"plugins/ep963x/fu-ep963x-device.c:355-358","code":"  355 | \t\t/* update progress */\n  356 | \t\tfu_progress_set_percentage_full(fu_progress_get_child(progress),\n  357 | \t\t\t\t\t\t(gsize)i + 1,\n  358 | \t\t\t\t\t\t(gsize)fu_chunk_array_length(chunks));","lines":4,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/ep963x/fu-ep963x-device.c#L355-L358"}]},
{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `fu_fastboot_device_write_motorola_part()` (op == \"erase\" branch), `partition` is read from the manifest XML with `xb_node_get_attr(part, \"partition\")` and immediately used to build `cmd` via `g_strdup_printf(\"erase:%s\", partition)` *before* the subsequent `if (partition == NULL)` check runs. If a malicious or malformed `flashfile.xml` inside the firmware archive omits the `partition` attribute on an `erase` part, `g_strdup_printf` is called with a `NULL` `%s` argument. This is undefined behaviour in C (glibc happens to print `(null)`, but other libc implementations such as musl can crash), so this is a real, if libc-dependent, crash path driven entirely by attacker-controlled firmware content.","fix":"Move the `NULL` check before building the command string, e.g.:\n```c\nconst gchar *partition = xb_node_get_attr(part, \"partition\");\nif (partition == NULL) {\n    g_autofree gchar *tmp = xb_node_export(part, XB_NODE_EXPORT_FLAG_NONE, NULL);\n    g_set_error(error, FWUPD_ERROR, FWUPD_ERROR_INVALID_DATA,\n                \"required partition for part: %s\", tmp);\n    return FALSE;\n}\ng_autofree gchar *cmd = g_strdup_printf(\"erase:%s\", partition);\n```","locations":[{"ref":"plugins/fastboot/fu-fastboot-device.c:451-465","code":"  451 | \tif (g_strcmp0(op, \"erase\") == 0) {\n  452 | \t\tconst gchar *partition = xb_node_get_attr(part, \"partition\");\n  453 | \t\tg_autofree gchar *cmd = g_strdup_printf(\"erase:%s\", partition);\n  454 | \n  455 | \t\t/* check required args */\n  456 | \t\tif (partition == NULL) {\n  457 | \t\t\tg_autofree gchar *tmp = NULL;\n  458 | \t\t\ttmp = xb_node_export(part, XB_NODE_EXPORT_FLAG_NONE, NULL);\n  459 | \t\t\tg_set_error(error,\n  460 | \t\t\t\t    FWUPD_ERROR,\n  461 | \t\t\t\t    FWUPD_ERROR_INVALID_DATA,\n  462 | \t\t\t\t    \"required partition for part: %s\",\n  463 | \t\t\t\t    tmp);\n  464 | \t\t\treturn FALSE;\n  465 | \t\t}","lines":15,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/fastboot/fu-fastboot-device.c#L451-L465"}]},
{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `fu_focal_fp_hid_device_reload()` the firmware ID verification uses `&&` instead of `||`: `if (idbuf[1] != 0x58 && idbuf[0] != 0x22)`. This means the error is only raised when *both* bytes mismatch the expected constants; if only one byte is wrong (e.g. `idbuf[1] == 0x58` but `idbuf[0] != 0x22`), the check silently passes even though the firmware ID does not match the expected `0x58:0x22` pair. The equivalent code in the sibling `focal-touch` plugin (`fu_focal_touch_hid_device_reload`) correctly does a single combined equality check, confirming this is a logic bug rather than intentional.","fix":"Use `||` so a mismatch in either byte is treated as invalid: ```c\nif (idbuf[1] != 0x58 || idbuf[0] != 0x22) {\n    g_set_error(...);\n    return FALSE;\n}\n```","locations":[{"ref":"plugins/focal-fp/fu-focal-fp-hid-device.c:546-571","code":"  546 | static gboolean\n  547 | fu_focal_fp_hid_device_reload(FuDevice *device, GError **error)\n  548 | {\n  549 | \tFuFocalFpHidDevice *self = FU_FOCAL_FP_HID_DEVICE(device);\n  550 | \tguint8 idbuf[2] = {0x0};\n  551 | \n  552 | \tfu_device_sleep(device, 500);\n  553 | \tif (!fu_focal_fp_hid_device_read_reg(self, 0x9F, &idbuf[0], error))\n  554 | \t\treturn FALSE;\n  555 | \tif (!fu_focal_fp_hid_device_read_reg(self, 0xA3, &idbuf[1], error))\n  556 | \t\treturn FALSE;\n  557 | \tg_debug(\"id1=%x, id2=%x\", idbuf[1], idbuf[0]);\n  558 | \tif (idbuf[1] != 0x58 && idbuf[0] != 0x22) {\n  559 | \t\tg_set_error(error,\n  560 | \t\t\t    FWUPD_ERROR,\n  561 | \t\t\t    FWUPD_ERROR_INVALID_DATA,\n  562 | \t\t\t    \"firmware id invalid, got 0x%02x:0x%02x, expected 0x%02x:0x%02x\",\n  563 | \t\t\t    idbuf[1],\n  564 | \t\t\t    idbuf[0],\n  565 | \t\t\t    (guint)0x58,\n  566 | \t\t\t    (guint)0x22);\n  567 | \t\treturn FALSE;\n  568 | \t}\n  569 | \n  570 | \treturn fu_focal_fp_hid_device_setup(device, error);\n  571 | }","lines":26,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/focal-fp/fu-focal-fp-hid-device.c#L546-L571"}]},
{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`fu_genesys_scaler_firmware_build` (`plugins/genesys/fu-genesys-scaler-firmware.c`) writes the `N` and `E` XML properties directly into `self->public_key.N` / `self->public_key.E` starting at destination offset `0x0` (lines 106-115 and 119-128). However `fu_genesys_scaler_firmware_parse` requires `memcmp(self->public_key.N, \"N = \", 4) == 0` and `memcmp(self->public_key.E, \"E = \", 4) == 0` (lines 53-54), and `fu_genesys_scaler_firmware_export` strips that 4-byte tag before exposing the value as `N`/`E` (`memcpy(N, self->public_key.N + 4, ...)`, lines 90 and 93). Because `build()` writes the raw XML text starting at offset 0 instead of offset 4, a firmware rebuilt from exported XML loses the `\"N = \"`/`\"E = \"` tag prefix and the trailing `0x0D0A` terminator, so re-parsing the rebuilt firmware with `fu_genesys_scaler_firmware_parse` (or the device's `memcmp` check in `fu_genesys_scaler_device_probe`) will fail with `invalid public-key`.","fix":"Write the tag prefix (and end marker) back in, offsetting the text by 4 bytes, e.g.:\n```c\nif (!fu_memcpy_safe((guint8 *)&self->public_key.N, sizeof(self->public_key.N),\n\t\t    0x0, (const guint8 *)\"N = \", 4, 0x0, 4, error))\n\treturn FALSE;\nif (!fu_memcpy_safe((guint8 *)&self->public_key.N, sizeof(self->public_key.N),\n\t\t    0x4, (const guint8 *)tmp, strlen(tmp), 0x0, strlen(tmp), error))\n\treturn FALSE;\n```\nand similarly for `E`, including writing the `0x0D0A` end marker at the correct trailing offset.","locations":[{"ref":"plugins/genesys/fu-genesys-scaler-firmware.c:97-132","code":"   97 | static gboolean\n   98 | fu_genesys_scaler_firmware_build(FuFirmware *firmware, XbNode *n, GError **error)\n   99 | {\n  100 | \tFuGenesysScalerFirmware *self = FU_GENESYS_SCALER_FIRMWARE(firmware);\n  101 | \tconst gchar *tmp;\n  102 | \n  103 | \t/* optional properties */\n  104 | \ttmp = xb_node_query_text(n, \"N\", NULL);\n  105 | \tif (tmp != NULL) {\n  106 | \t\tif (!fu_memcpy_safe((guint8 *)&self->public_key.N,\n  107 | \t\t\t\t    sizeof(self->public_key.N),\n  108 | \t\t\t\t    0x0, /* dst */\n  109 | \t\t\t\t    (const guint8 *)tmp,\n  110 | \t\t\t\t    strlen(tmp),\n  111 | \t\t\t\t    0x0, /* src */\n  112 | \t\t\t\t    strlen(tmp),\n  113 | \t\t\t\t    error))\n  114 | \t\t\treturn FALSE;\n  115 | \t}\n  116 | \n  117 | \ttmp = xb_node_query_text(n, \"E\", NULL);\n  118 | \tif (tmp != NULL) {\n  119 | \t\tif (!fu_memcpy_safe((guint8 *)&self->public_key.E,\n  120 | \t\t\t\t    sizeof(self->public_key.E),\n  121 | \t\t\t\t    0x0, /* dst */\n  122 | \t\t\t\t    (const guint8 *)tmp,\n  123 | \t\t\t\t    strlen(tmp),\n  124 | \t\t\t\t    0x0, /* src */\n  125 | \t\t\t\t    strlen(tmp),\n  126 | \t\t\t\t    error))\n  127 | \t\t\treturn FALSE;\n  128 | \t}\n  129 | \n  130 | \t/* success */\n  131 | \treturn TRUE;\n  132 | }","lines":36,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/genesys/fu-genesys-scaler-firmware.c#L97-L132"}]},
{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"hard","description":"In `fu_gpio_device_assign_full`, the compound literal for `struct gpio_v2_line_request req` mixes a designated initializer (`.num_lines = 1`) with a following *non-designated* initializer `req.offsets[0] = line,`. Per C's initializer rules, once a designated initializer is used, a subsequent non-designated initializer applies to the *next member in declaration order* after the one just designated - which for `struct gpio_v2_line_request` (see `linux/gpio.h`: `offsets`, `consumer`, `config`, `num_lines`, `event_buffer_size`, `padding`, `fd`) is `event_buffer_size`, not `offsets`. The expression `req.offsets[0] = line` is legal C (an assignment expression used as an initializer), so it compiles silently with no warning: it does set `req.offsets[0]` as a side effect, but its *value* (the assigned `line`) is what actually gets stored into `event_buffer_size`, leaving that field with an unintended non-zero value derived from the GPIO line number instead of `0`. This was reproduced and confirmed with a minimal standalone test using the real kernel struct layout (`gcc -Wall -Wextra` gives no diagnostic, and `event_buffer_size` ends up equal to `line`).","fix":"Use a proper designator for the array element instead of relying on positional-after-designator semantics:\n```c\nstruct gpio_v2_line_request req = {\n    .num_lines = 1,\n    .offsets[0] = line,\n    .config.flags = GPIO_V2_LINE_FLAG_OUTPUT,\n    .config.num_attrs = 1,\n    .config.attrs[0].attr.values = value ? 0x1 : 0x0,\n    .config.attrs[0].mask = 0x1,\n};\n```\nAdding the leading `.` makes `offsets[0]` a real designator, leaving `event_buffer_size` correctly zero-initialized.","locations":[{"ref":"plugins/gpio/fu-gpio-device.c:106-116","code":"  106 | fu_gpio_device_assign_full(FuGpioDevice *self, guint64 line, gboolean value, GError **error)\n  107 | {\n  108 | \tconst gchar consumer[] = \"fwupd\";\n  109 | \tstruct gpio_v2_line_request req = {\n  110 | \t    .num_lines = 1,\n  111 | \t    req.offsets[0] = line,\n  112 | \t    .config.flags = GPIO_V2_LINE_FLAG_OUTPUT,\n  113 | \t    .config.num_attrs = 1,\n  114 | \t    .config.attrs[0].attr.values = value ? 0x1 : 0x0,\n  115 | \t    .config.attrs[0].mask = 0x1,\n  116 | \t};","lines":11,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/gpio/fu-gpio-device.c#L106-L116"}]},
{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`fu_client_list_register()` and `fu_client_list_get_by_sender()` key clients purely by `sender` using `g_strcmp0(sender, fu_client_get_sender(item->client)) == 0`. `g_strcmp0(NULL, NULL)` returns `0` (equal). `FuEngineRequest` (and therefore `fu_engine_request_get_sender()`) legitimately returns `NULL` for requests made over the peer-to-peer `FWUPD_DBUS_SOCKET` (see `fu_dbus_daemon_create_request()`, which special-cases `sender == NULL`). `fu_dbus_daemon_method_set_feature_flags()` / `fu_dbus_daemon_method_set_hints()` both call `fu_client_list_register(self->client_list, fu_engine_request_get_sender(request))` unconditionally. As a result, the *first* socket peer that calls `SetHints`/`SetFeatureFlags` creates a `FuClientListItem` with `sender == NULL`, and *every subsequent, unrelated* socket peer that calls the same methods is matched against and reuses that same `FuClient` object (via `fu_client_list_get_by_sender(self, NULL)` returning the first hit), silently merging distinct client identities and letting one peer's hints/feature flags be overwritten by, or attributed to, a completely different peer. Because `sender == NULL` also skips the `g_bus_watch_name_on_connection()` call (`self->connection != NULL && sender != NULL`), this bogus shared entry is also never cleaned up on disconnect.","fix":"Treat `sender == NULL` as \"no persistent identity\" rather than a shared identity -- e.g. refuse to register/look up an entry when `sender` is `NULL`, or key such connections by a unique per-connection token (e.g. the `GDBusConnection` peer object) instead of the D-Bus unique name:\n```c\nFuClient *\nfu_client_list_register(FuClientList *self, const gchar *sender)\n{\n\t...\n\tif (sender == NULL)\n\t\treturn g_object_ref(fu_client_new(NULL)); /* never cached/shared */\n\t...\n}\n```","locations":[{"ref":"src/fu-client-list.c:60-92","code":"   60 | FuClient *\n   61 | fu_client_list_register(FuClientList *self, const gchar *sender)\n   62 | {\n   63 | \tFuClient *client;\n   64 | \tFuClientListItem *item;\n   65 | \n   66 | \tg_return_val_if_fail(FU_IS_CLIENT_LIST(self), NULL);\n   67 | \n   68 | \t/* already exists */\n   69 | \tclient = fu_client_list_get_by_sender(self, sender);\n   70 | \tif (client != NULL)\n   71 | \t\treturn client;\n   72 | \n   73 | \t/* create and watch */\n   74 | \titem = g_new0(FuClientListItem, 1);\n   75 | \titem->self = self;\n   76 | \titem->client = fu_client_new(sender);\n   77 | \tif (self->connection != NULL && sender != NULL) {\n   78 | \t\titem->watcher_id =\n   79 | \t\t    g_bus_watch_name_on_connection(self->connection,\n   80 | \t\t\t\t\t\t   sender,\n   81 | \t\t\t\t\t\t   G_BUS_NAME_WATCHER_FLAGS_NONE,\n   82 | \t\t\t\t\t\t   NULL,\n   83 | \t\t\t\t\t\t   fu_client_list_sender_name_vanished_cb,\n   84 | \t\t\t\t\t\t   item,\n   85 | \t\t\t\t\t\t   NULL);\n   86 | \t}\n   87 | \tg_ptr_array_add(self->array, item);\n   88 | \n   89 | \t/* success */\n   90 | \tfu_client_list_emit_added(self, item->client);\n   91 | \treturn g_object_ref(item->client);\n   92 | }","lines":33,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/src/fu-client-list.c#L60-L92"},{"ref":"src/fu-client-list.c:106-116","code":"  106 | FuClient *\n  107 | fu_client_list_get_by_sender(FuClientList *self, const gchar *sender)\n  108 | {\n  109 | \tg_return_val_if_fail(FU_IS_CLIENT_LIST(self), NULL);\n  110 | \tfor (guint i = 0; i < self->array->len; i++) {\n  111 | \t\tFuClientListItem *item = g_ptr_array_index(self->array, i);\n  112 | \t\tif (g_strcmp0(sender, fu_client_get_sender(item->client)) == 0)\n  113 | \t\t\treturn g_object_ref(item->client);\n  114 | \t}\n  115 | \treturn NULL;\n  116 | }","lines":11,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/src/fu-client-list.c#L106-L116"}]},
{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`fu_engine_get_upgrades` skips releases flagged `FWUPD_RELEASE_FLAG_BLOCKED_APPROVAL` (i.e. releases from a remote with `FWUPD_REMOTE_FLAG_APPROVAL_REQUIRED` that have not been approved), but its near-duplicate sibling `fu_engine_get_downgrades` has no equivalent check. Since the two functions are otherwise structurally identical (same branch/version filters), this looks like the `BLOCKED_APPROVAL` filter was added to one copy and never carried over to the other, meaning a client can downgrade a device to an unapproved release from an approval-required remote even though the same release would be rejected as an upgrade.","fix":"Add the same approval check used in `fu_engine_get_upgrades` to the downgrade filtering loop:\n```c\nif (fwupd_release_has_flag(rel_tmp, FWUPD_RELEASE_FLAG_BLOCKED_APPROVAL)) {\n\tg_string_append_printf(error_str, \"%s=not-approved, \", fwupd_release_get_version(rel_tmp));\n\tcontinue;\n}\n```","locations":[{"ref":"src/fu-engine.c:6244-6292","code":" 6244 | \treleases = g_ptr_array_new_with_free_func((GDestroyNotify)g_object_unref);\n 6245 | \tfor (guint i = 0; i < releases_tmp->len; i++) {\n 6246 | \t\tFwupdRelease *rel_tmp = g_ptr_array_index(releases_tmp, i);\n 6247 | \n 6248 | \t\t/* same as installed */\n 6249 | \t\tif (!fwupd_release_has_flag(rel_tmp, FWUPD_RELEASE_FLAG_IS_UPGRADE) &&\n 6250 | \t\t    !fwupd_release_has_flag(rel_tmp, FWUPD_RELEASE_FLAG_IS_DOWNGRADE)) {\n 6251 | \t\t\tg_string_append_printf(error_str,\n 6252 | \t\t\t\t\t       \"%s=same, \",\n 6253 | \t\t\t\t\t       fwupd_release_get_version(rel_tmp));\n 6254 | \t\t\tg_debug(\"ignoring %s as the same as %s\",\n 6255 | \t\t\t\tfwupd_release_get_version(rel_tmp),\n 6256 | \t\t\t\tfu_device_get_version(device));\n 6257 | \t\t\tcontinue;\n 6258 | \t\t}\n 6259 | \n 6260 | \t\t/* newer than current */\n 6261 | \t\tif (fwupd_release_has_flag(rel_tmp, FWUPD_RELEASE_FLAG_IS_UPGRADE)) {\n 6262 | \t\t\tg_string_append_printf(error_str,\n 6263 | \t\t\t\t\t       \"%s=newer, \",\n 6264 | \t\t\t\t\t       fwupd_release_get_version(rel_tmp));\n 6265 | \t\t\tg_debug(\"ignoring %s as newer than %s\",\n 6266 | \t\t\t\tfwupd_release_get_version(rel_tmp),\n 6267 | \t\t\t\tfu_device_get_version(device));\n 6268 | \t\t\tcontinue;\n 6269 | \t\t}\n 6270 | \n 6271 | \t\t/* don't show releases we are not allowed to downgrade to */\n 6272 | \t\tif (fwupd_release_has_flag(rel_tmp, FWUPD_RELEASE_FLAG_BLOCKED_VERSION)) {\n 6273 | \t\t\tg_string_append_printf(error_str,\n 6274 | \t\t\t\t\t       \"%s=lowest, \",\n 6275 | \t\t\t\t\t       fwupd_release_get_version(rel_tmp));\n 6276 | \t\t\tg_debug(\"ignoring %s as older than lowest %s\",\n 6277 | \t\t\t\tfwupd_release_get_version(rel_tmp),\n 6278 | \t\t\t\tfu_device_get_version_lowest(device));\n 6279 | \t\t\tcontinue;\n 6280 | \t\t}\n 6281 | \n 6282 | \t\t/* different branch */\n 6283 | \t\tif (fwupd_release_has_flag(rel_tmp, FWUPD_RELEASE_FLAG_IS_ALTERNATE_BRANCH)) {\n 6284 | \t\t\tg_info(\"ignoring release %s as branch %s, and device is %s\",\n 6285 | \t\t\t       fwupd_release_get_version(rel_tmp),\n 6286 | \t\t\t       fwupd_release_get_branch(rel_tmp),\n 6287 | \t\t\t       fu_device_get_branch(device));\n 6288 | \t\t\tcontinue;\n 6289 | \t\t}\n 6290 | \n 6291 | \t\tg_ptr_array_add(releases, g_object_ref(rel_tmp));\n 6292 | \t}","lines":49,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/src/fu-engine.c#L6244-L6292"}]},
{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`fwupd_bios_setting_add_string()` looks up `raw = g_hash_table_lookup(priv->possible_values_to_raw, tmp)` and then unconditionally formats it with `g_strdup_printf(\"%s→%s\", tmp, raw)`. If `fwupd_bios_setting_add_possible_value()` (the non-`_full` variant) is called for a value after `fwupd_bios_setting_add_possible_value_full()` has already been used at least once (so `possible_values_to_raw` is non-`NULL`), that value has no entry in `possible_values_to_raw` and the lookup returns `NULL`, so `raw` is `NULL` when passed to the `%s` conversion. This only avoids crashing because GLib's `printf`-family implementation happens to special-case `NULL` for `%s`, which is non-standard behavior other C library implementations are not required to honor.","fix":"Guard against a missing mapping before formatting, e.g. `const gchar *raw = g_hash_table_lookup(priv->possible_values_to_raw, tmp); g_autofree gchar *kv = raw != NULL ? g_strdup_printf(\"%s→%s\", tmp, raw) : g_strdup(tmp);`","locations":[{"ref":"libfwupd/fwupd-bios-setting.c:1328-1340","code":" 1328 | \tif (priv->kind == FWUPD_BIOS_SETTING_KIND_ENUMERATION) {\n 1329 | \t\tif (priv->possible_values_to_raw != NULL) {\n 1330 | \t\t\tfor (guint i = 0; i < priv->possible_values->len; i++) {\n 1331 | \t\t\t\tconst gchar *tmp = g_ptr_array_index(priv->possible_values, i);\n 1332 | \t\t\t\tconst gchar *raw =\n 1333 | \t\t\t\t    g_hash_table_lookup(priv->possible_values_to_raw, tmp);\n 1334 | \t\t\t\tg_autofree gchar *kv = g_strdup_printf(\"%s→%s\", tmp, raw);\n 1335 | \t\t\t\tfwupd_codec_string_append(\n 1336 | \t\t\t\t    str,\n 1337 | \t\t\t\t    idt,\n 1338 | \t\t\t\t    FWUPD_RESULT_KEY_BIOS_SETTING_POSSIBLE_VALUES,\n 1339 | \t\t\t\t    kv);\n 1340 | \t\t\t}","lines":13,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupd/fwupd-bios-setting.c#L1328-L1340"}]},
{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `fwupd_client_upload_report_cb`, the response's `uri` JSON field is only read when `server_msg` is non-`NULL`:\n```c\nif (server_msg != NULL) {\n        g_info(\"server message: %s\", server_msg);\n        uri = g_strdup(fwupd_json_object_get_string(json_obj, \"uri\", NULL));\n}\nif (uri == NULL)\n        uri = g_strdup(\"\");\n```\nIf a server responds with a `uri` but no `msg`, the URI is silently dropped and an empty string is returned to the caller of `fwupd_client_upload_report_finish` instead of the real location of the uploaded report.","fix":"Fetch `uri` unconditionally, independent of whether `server_msg` is present:\n```c\nif (server_msg != NULL)\n        g_info(\"server message: %s\", server_msg);\nuri = g_strdup(fwupd_json_object_get_string(json_obj, \"uri\", NULL));\nif (uri == NULL)\n        uri = g_strdup(\"\");\n```","locations":[{"ref":"libfwupd/fwupd-client.c:6938-6946","code":" 6938 | \t/* server wanted us to see the message */\n 6939 | \tif (server_msg != NULL) {\n 6940 | \t\tg_info(\"server message: %s\", server_msg);\n 6941 | \t\turi = g_strdup(fwupd_json_object_get_string(json_obj, \"uri\", NULL));\n 6942 | \t}\n 6943 | \n 6944 | \t/* fallback */\n 6945 | \tif (uri == NULL)\n 6946 | \t\turi = g_strdup(\"\");","lines":9,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupd/fwupd-client.c#L6938-L6946"}]},
{"id":"LOGIC_34","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `fu_acpi_table_parse()`'s checksum-failure error message, `(guint)checksum - checksum_actual` is computed using `checksum` and `checksum_actual` as `guint8`; when `checksum < checksum_actual` the subtraction wraps around in unsigned arithmetic (after the `(guint)` cast forces 32-bit width), producing a huge value like `0xffffff3d` instead of the intended single byte `0x3d` (the correct `expected` checksum byte value, `(checksum - checksum_actual) mod 256`). The printed diagnostic is therefore garbage/misleading whenever the two values order that way.","fix":"Mask the result down to a byte before formatting: `(guint)((checksum - checksum_actual) & 0xff)`, or compute it in a `guint8` temporary so the wraparound happens at 8 bits as intended.","locations":[{"ref":"libfwupdplugin/fu-acpi-table.c:187-196","code":"  187 | \t\tif (checksum_actual != 0x0) {\n  188 | \t\t\tguint8 checksum = fu_struct_acpi_table_get_checksum(st);\n  189 | \t\t\tg_set_error(error,\n  190 | \t\t\t\t    FWUPD_ERROR,\n  191 | \t\t\t\t    FWUPD_ERROR_INTERNAL,\n  192 | \t\t\t\t    \"CRC failed, expected 0x%02x, got 0x%02x\",\n  193 | \t\t\t\t    (guint)checksum - checksum_actual,\n  194 | \t\t\t\t    checksum);\n  195 | \t\t\treturn FALSE;\n  196 | \t\t}","lines":10,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-acpi-table.c#L187-L196"}]},
{"id":"LOGIC_35","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `fu_device_retry_full()`, the loop that looks for a matching `FuDeviceRetryRecovery` entry (`for (guint j = 0; j < priv->retry_recs->len; j++) ...`) never `break`s once a match is found via `g_error_matches()`. If more than one recovery record happens to match the same `domain`/`code` (e.g. two different subsystems both registering a recovery for a generic error code), `rec->recovery_func()` (a device reset/recovery action) will be invoked multiple times for the same failed retry attempt, which is unintended and could trigger redundant hardware resets.","fix":"Add a `break` after successfully handling the matching recovery record:\n```c\nif (g_error_matches(error_local, rec->domain, rec->code)) {\n\tif (rec->recovery_func != NULL) {\n\t\tif (!rec->recovery_func(self, user_data, error))\n\t\t\treturn FALSE;\n\t} else {\n\t\t...\n\t\treturn FALSE;\n\t}\n\tbreak;\n}\n```","locations":[{"ref":"libfwupdplugin/fu-device.c:686-701","code":"  686 | \t\t/* find the condition that matches */\n  687 | \t\tfor (guint j = 0; j < priv->retry_recs->len; j++) {\n  688 | \t\t\tFuDeviceRetryRecovery *rec = g_ptr_array_index(priv->retry_recs, j);\n  689 | \t\t\tif (g_error_matches(error_local, rec->domain, rec->code)) {\n  690 | \t\t\t\tif (rec->recovery_func != NULL) {\n  691 | \t\t\t\t\tif (!rec->recovery_func(self, user_data, error))\n  692 | \t\t\t\t\t\treturn FALSE;\n  693 | \t\t\t\t} else {\n  694 | \t\t\t\t\tg_propagate_prefixed_error(\n  695 | \t\t\t\t\t    error,\n  696 | \t\t\t\t\t    g_steal_pointer(&error_local),\n  697 | \t\t\t\t\t    \"device recovery not possible: \");\n  698 | \t\t\t\t\treturn FALSE;\n  699 | \t\t\t\t}\n  700 | \t\t\t}\n  701 | \t\t}","lines":16,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-device.c#L686-L701"}]},
{"id":"LOGIC_36","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `fu_edid_write`, `self->serial_number` is written twice when it parses as a numeric string: once into the `serial_number` header field via `fu_struct_edid_set_serial_number` (guarded by `fu_strtoull(...)` succeeding), and unconditionally again as a `FU_EDID_DESCRIPTOR_TAG_DISPLAY_PRODUCT_SERIAL_NUMBER` descriptor a few lines later because the second `if (self->serial_number != NULL)` check does not exclude the case already handled by the header. This contradicts the `fu_edid_set_serial_number()` docstring, which states the value is stored `either` as an integer `or` as a string descriptor, and wastes one of only four available 18-byte descriptor slots plus produces duplicate/redundant EDID data on write.","fix":"Only add the descriptor when the value was *not* already stored as a raw integer, e.g. track the `fu_strtoull()` result and skip the descriptor block when it succeeded:\n```c\ngboolean serial_is_integer = fu_strtoull(self->serial_number, &serial_number, 0, G_MAXUINT32,\n                                          FU_INTEGER_BASE_AUTO, NULL);\nif (serial_is_integer)\n\tfu_struct_edid_set_serial_number(st, serial_number);\n...\nif (self->serial_number != NULL && !serial_is_integer) {\n\t/* write descriptor */\n}\n```","locations":[{"ref":"libfwupdplugin/fu-edid.c:315-322","code":"  315 | \t/* if this is a integer, store it in the header rather than in a descriptor */\n  316 | \tif (fu_strtoull(self->serial_number,\n  317 | \t\t\t&serial_number,\n  318 | \t\t\t0,\n  319 | \t\t\tG_MAXUINT32,\n  320 | \t\t\tFU_INTEGER_BASE_AUTO,\n  321 | \t\t\tNULL))\n  322 | \t\tfu_struct_edid_set_serial_number(st, serial_number);","lines":8,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-edid.c#L315-L322"},{"ref":"libfwupdplugin/fu-edid.c:341-357","code":"  341 | \tif (self->serial_number != NULL) {\n  342 | \t\tg_autoptr(FuStructEdidDescriptor) st_desc = fu_struct_edid_descriptor_new();\n  343 | \t\tfu_struct_edid_descriptor_set_tag(\n  344 | \t\t    st_desc,\n  345 | \t\t    FU_EDID_DESCRIPTOR_TAG_DISPLAY_PRODUCT_SERIAL_NUMBER);\n  346 | \t\tif (!fu_struct_edid_descriptor_set_data(st_desc,\n  347 | \t\t\t\t\t\t\t(const guint8 *)self->serial_number,\n  348 | \t\t\t\t\t\t\tstrlen(self->serial_number),\n  349 | \t\t\t\t\t\t\terror)) {\n  350 | \t\t\tg_prefix_error_literal(error, \"cannot write serial number: \");\n  351 | \t\t\treturn NULL;\n  352 | \t\t}\n  353 | \t\tmemcpy(st->buf->data + offset_desc,\n  354 | \t\t       st_desc->buf->data,\n  355 | \t\t       st_desc->buf->len); /* nocheck:blocked */\n  356 | \t\toffset_desc += st_desc->buf->len;\n  357 | \t}","lines":17,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-edid.c#L341-L357"}]},
{"id":"LOGIC_37","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`fu_amd_kria_plugin_device_registered()` (`plugins/amd-kria/fu-amd-kria-plugin.c:79-116`) decides which of `self->version_a`/`self->version_b` to push onto the parent device based on `self->active`, which is only set once the `Persistent Register` child device has been processed (`plugins/amd-kria/fu-amd-kria-plugin.c:70-74`). Because `device_registered` is invoked once per child device as udev enumerates them in whatever order they appear, if `Image A`/`Image B` are registered before `Persistent Register`, `self->active` is still `NULL` at that point and the `g_strcmp0(self->active, \"A\")`/`\"B\"` checks at lines 108-111 silently fail to set the parent version for that call; the parent version only ends up correct if a later callback happens to run after `self->active` is populated, since nothing re-evaluates the mapping once `self->active` becomes available.","fix":"Do not depend on registration order: track `version_a`/`version_b`/`active` and defer setting the parent version until all three child devices are known (e.g. in a `FuPlugin->device_added` completion step, or by re-checking/re-applying the parent version whenever any of the three pieces of state changes), instead of only updating it inline in the same callback invocation that just set `self->active` or `self->version_a`/`self->version_b`.","locations":[{"ref":"plugins/amd-kria/fu-amd-kria-plugin.c:79-116","code":"   79 | static void\n   80 | fu_amd_kria_plugin_device_registered(FuPlugin *plugin, FuDevice *dev)\n   81 | {\n   82 | \tFuAmdKriaPlugin *self;\n   83 | \tFuDevice *parent;\n   84 | \tconst gchar *name;\n   85 | \tg_autoptr(GError) error_local = NULL;\n   86 | \n   87 | \tif (g_strcmp0(fu_device_get_plugin(dev), \"mtd\") != 0)\n   88 | \t\treturn;\n   89 | \n   90 | \tself = FU_AMD_KRIA_PLUGIN(plugin);\n   91 | \tname = fu_device_get_name(dev);\n   92 | \tif (g_strcmp0(name, \"Image A\") == 0) {\n   93 | \t\tif (!fu_amd_kria_plugin_process_image(plugin, dev, &error_local))\n   94 | \t\t\tg_warning(\"%s\", error_local->message);\n   95 | \t\tself->version_a = g_strdup(fu_device_get_version(dev));\n   96 | \t} else if (g_strcmp0(name, \"Image B\") == 0) {\n   97 | \t\tif (!fu_amd_kria_plugin_process_image(plugin, dev, &error_local))\n   98 | \t\t\tg_warning(\"%s\", error_local->message);\n   99 | \t\tself->version_b = g_strdup(fu_device_get_version(dev));\n  100 | \t} else if (g_strcmp0(name, \"Persistent Register\") == 0) {\n  101 | \t\tif (!fu_amd_kria_plugin_process_persistent(plugin, dev, &error_local))\n  102 | \t\t\tg_warning(\"%s\", error_local->message);\n  103 | \t}\n  104 | \n  105 | \t/* mark the active partition version on the created KRIA device */\n  106 | \tparent = fu_device_get_parent(dev, NULL);\n  107 | \tif (parent != NULL && fu_device_get_version(dev) != NULL) {\n  108 | \t\tif (g_strcmp0(self->active, \"A\") == 0 && self->version_a != NULL)\n  109 | \t\t\tfu_device_set_version(parent, self->version_a);\n  110 | \t\telse if (g_strcmp0(self->active, \"B\") == 0 && self->version_b != NULL)\n  111 | \t\t\tfu_device_set_version(parent, self->version_b);\n  112 | \t\tfu_device_add_flag(parent, FWUPD_DEVICE_FLAG_UPDATABLE);\n  113 | \t}\n  114 | \n  115 | \tfu_device_remove_flag(dev, FWUPD_DEVICE_FLAG_UPDATABLE);\n  116 | }","lines":38,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/amd-kria/fu-amd-kria-plugin.c#L79-L116"}]},
{"id":"LOGIC_38","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `fu_bcm57xx_stage1_image_parse` (plugins/bcm57xx/fu-bcm57xx-stage1-image.c), the guard `if (veraddr < BCM_PHYS_ADDR_DEFAULT + sizeof(bufver))` rejects any `veraddr` in the range `[BCM_PHYS_ADDR_DEFAULT, BCM_PHYS_ADDR_DEFAULT + 16)`, even though those addresses are perfectly valid (the underflow this check is meant to guard against only happens when `veraddr < BCM_PHYS_ADDR_DEFAULT`). The error message printed, `\"version address 0x%x less than physical 0x%x\"`, is also misleading in this case since `veraddr` is not actually less than `BCM_PHYS_ADDR_DEFAULT` when the check fires this way, it is just less than `BCM_PHYS_ADDR_DEFAULT + 16`. This causes legitimate stage1 version strings located in the first 16 bytes past the physical base address to be rejected with a confusing error.","fix":"Only guard against the actual underflow case, letting `fu_input_stream_read_safe()` validate that enough bytes remain for `bufver`:\n```c\nif (veraddr < BCM_PHYS_ADDR_DEFAULT) {\n    g_set_error(error,\n                FWUPD_ERROR,\n                FWUPD_ERROR_NOT_SUPPORTED,\n                \"version address 0x%x less than physical 0x%x\",\n                veraddr,\n                (guint)BCM_PHYS_ADDR_DEFAULT);\n    return FALSE;\n}\n```","locations":[{"ref":"plugins/bcm57xx/fu-bcm57xx-stage1-image.c:56-64","code":"   56 | \t\t\tif (veraddr < BCM_PHYS_ADDR_DEFAULT + sizeof(bufver)) {\n   57 | \t\t\t\tg_set_error(error,\n   58 | \t\t\t\t\t    FWUPD_ERROR,\n   59 | \t\t\t\t\t    FWUPD_ERROR_NOT_SUPPORTED,\n   60 | \t\t\t\t\t    \"version address 0x%x less than physical 0x%x\",\n   61 | \t\t\t\t\t    veraddr,\n   62 | \t\t\t\t\t    (guint)BCM_PHYS_ADDR_DEFAULT);\n   63 | \t\t\t\treturn FALSE;\n   64 | \t\t\t}","lines":9,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/bcm57xx/fu-bcm57xx-stage1-image.c#L56-L64"}]},
{"id":"LOGIC_39","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `fu_ccgx_dmc_firmware_parse_md_block()` (plugins/ccgx-dmc/fu-ccgx-dmc-firmware.c), the `switch (bufsz)` statement only sets `md_offset` for the expected sizes `0x80` and `0x100`; any other last-record size silently falls through the `default: break;` case, leaving `md_offset` at its initial value of `0`. Parsing then proceeds to read the metadata header from offset `0` instead of rejecting the unexpected record size outright, relying only on the subsequent metadata-signature check to eventually catch the problem. This produces a confusing error path (\"invalid metadata\" rather than a clear \"unexpected record size\" message) for otherwise-malformed firmware.","fix":"Treat unexpected `bufsz` values as an explicit error instead of silently defaulting `md_offset` to `0`:\n```c\nswitch (bufsz) {\ncase 0x80:\n    md_offset = 0x40;\n    break;\ncase 0x100:\n    md_offset = 0xC0;\n    break;\ndefault:\n    g_set_error(error, FWUPD_ERROR, FWUPD_ERROR_NOT_SUPPORTED,\n                \"unexpected metadata record size 0x%x\", (guint)bufsz);\n    return FALSE;\n}\n```","locations":[{"ref":"plugins/ccgx-dmc/fu-ccgx-dmc-firmware.c:194-203","code":"  194 | \t\tst_img = fu_struct_ccgx_dmc_fwct_image_info_parse_stream(stream, img_off, error);\n  195 | \t\tif (st_img == NULL)\n  196 | \t\t\treturn FALSE;\n  197 | \t\timg_rcd->row_size = fu_struct_ccgx_dmc_fwct_image_info_get_row_size(st_img);\n  198 | \t\tif (img_rcd->row_size == 0) {\n  199 | \t\t\tg_set_error(error,\n  200 | \t\t\t\t    FWUPD_ERROR,\n  201 | \t\t\t\t    FWUPD_ERROR_NOT_SUPPORTED,\n  202 | \t\t\t\t    \"invalid row size 0x%x\",\n  203 | \t\t\t\t    img_rcd->row_size);","lines":10,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/ccgx-dmc/fu-ccgx-dmc-firmware.c#L194-L203"}]},
{"id":"LOGIC_40","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`fu_ccgx_hpi_device_ensure_silicon_id` (`plugins/ccgx/fu-ccgx-hpi-device.c:1397-1443`) reads `self->silicon_id` from the device and, if non-zero, calls `fu_device_add_instance_u16(FU_DEVICE(self), \"SID\", self->silicon_id)`, but if `self->silicon_id == 0x0` no `SID` instance is added while `fu_device_build_instance_id_full` right after is still called unconditionally with `\"SID\"`, silently producing an instance ID lacking the `SID` component. This edge case (a device reporting silicon ID `0`) is not treated as an error, so devices with `silicon_id == 0` will fail later quirk/GUID matching without a clear diagnostic.","fix":"Treat `self->silicon_id == 0x0` as an explicit setup failure (as is already done for the `flash_row_size`/`flash_size` sanity check just below), e.g. ```c\nif (self->silicon_id == 0x0) {\n\tg_set_error_literal(error, FWUPD_ERROR, FWUPD_ERROR_NOT_SUPPORTED, \"invalid silicon id\");\n\treturn FALSE;\n}\n```","locations":[{"ref":"plugins/ccgx/fu-ccgx-hpi-device.c:1406-1414","code":" 1406 | \t/* add quirks */\n 1407 | \tif (self->silicon_id != 0x0)\n 1408 | \t\tfu_device_add_instance_u16(FU_DEVICE(self), \"SID\", self->silicon_id);\n 1409 | \tfu_device_build_instance_id_full(FU_DEVICE(self),\n 1410 | \t\t\t\t\t FU_DEVICE_INSTANCE_FLAG_QUIRKS,\n 1411 | \t\t\t\t\t NULL,\n 1412 | \t\t\t\t\t \"CCGX\",\n 1413 | \t\t\t\t\t \"SID\",\n 1414 | \t\t\t\t\t NULL);","lines":9,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/ccgx/fu-ccgx-hpi-device.c#L1406-L1414"}]},
{"id":"LOGIC_41","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`fu_cros_ec_firmware_ensure_version` (`plugins/cros-ec/fu-cros-ec-firmware.c:138-156`) parses each section's version into a local `g_autoptr(FuCrosEcVersion) version`/`version_rw` but only ever stores the RW triplet onto the parent firmware (`fu_firmware_set_version(FU_FIRMWARE(self), version_rw->triplet)`); the per-section `FuCrosEcFirmwareSection.version` field (declared in `plugins/cros-ec/fu-cros-ec-firmware.h:23`) is never assigned, so it stays zero-filled from `g_new0` in `fu_cros_ec_firmware_init`. `fu_cros_ec_usb_device_write_firmware` (`plugins/cros-ec/fu-cros-ec-usb-device.c:888-893`) later reads `section->version.triplet` to update the device version after a successful write; this is always `NULL`, as acknowledged by the adjacent `/* TODO: fix me, section->version.triplet has no data... */` comment, so the post-write version update silently does nothing useful.","fix":"Populate `section->version` in `fu_cros_ec_firmware_ensure_version`, e.g. `section->version = *g_steal_pointer(&version);` (adjusting ownership/free semantics of `FuCrosEcVersion`), so `fu_cros_ec_usb_device_write_firmware` reports the real version instead of `NULL`.","locations":[{"ref":"plugins/cros-ec/fu-cros-ec-firmware.c:130-148","code":"  130 | \t\tversion = fu_cros_ec_version_parse(section->raw_version, error);\n  131 | \t\tif (version == NULL) {\n  132 | \t\t\tg_prefix_error(error,\n  133 | \t\t\t\t       \"failed parsing firmware's version: %32s: \",\n  134 | \t\t\t\t       section->raw_version);\n  135 | \t\t\treturn FALSE;\n  136 | \t\t}\n  137 | \n  138 | \t\tif (rw) {\n  139 | \t\t\tg_autoptr(FuCrosEcVersion) version_rw = NULL;\n  140 | \t\t\tversion_rw = fu_cros_ec_version_parse(section->raw_version, error);\n  141 | \t\t\tif (version_rw == NULL) {\n  142 | \t\t\t\tg_prefix_error(error,\n  143 | \t\t\t\t\t       \"failed parsing firmware's version: %32s: \",\n  144 | \t\t\t\t\t       section->raw_version);\n  145 | \t\t\t\treturn FALSE;\n  146 | \t\t\t}\n  147 | \t\t\tfu_firmware_set_version(FU_FIRMWARE(self), version_rw->triplet);\n  148 | \t\t}","lines":19,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/cros-ec/fu-cros-ec-firmware.c#L130-L148"},{"ref":"plugins/cros-ec/fu-cros-ec-usb-device.c:885-890","code":"  885 | \t\t/* TODO: fix me, section->version.triplet has no data... */\n  886 | \t\tif (priv->in_bootloader) {\n  887 | \t\t\tfu_device_set_version(device, section->version.triplet);\n  888 | \t\t} else {\n  889 | \t\t\tfu_device_set_version_bootloader(device, section->version.triplet);\n  890 | \t\t}","lines":6,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/cros-ec/fu-cros-ec-usb-device.c#L885-L890"}]},
{"id":"LOGIC_42","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`FuDevlinkGenSocket.pipe_fds` (`plugins/devlink/fu-devlink-netlink.h:25`) is zero-initialized via `g_new0()` and `fu_devlink_netlink_gen_socket_close()` decides whether to close each end with `if (nlg->pipe_fds[0] != 0)` / `if (nlg->pipe_fds[1] != 0)`. Since `0` is also a legitimate file descriptor value (stdin), this check cannot distinguish an unopened pipe slot from a pipe end that legitimately got assigned fd `0` (possible if stdin was already closed by the time `g_unix_open_pipe()` runs, e.g. in some daemon/sandboxed startup orderings). In that case the fd would never be closed, leaking it, or worse, a later reuse of fd 0 elsewhere could be mistakenly closed by this code the next time `gen_socket_close` runs on a fresh, zero-initialized struct.","fix":"Initialize `pipe_fds[0]` and `pipe_fds[1]` to `-1` after allocation (or right after declaring the struct) and check `>= 0` instead of `!= 0` before closing, e.g. ```c nlg->pipe_fds[0] = -1; nlg->pipe_fds[1] = -1; ... if (nlg->pipe_fds[0] >= 0) g_close(nlg->pipe_fds[0], NULL);```","locations":[{"ref":"plugins/devlink/fu-devlink-netlink.h:25","code":"   25 | \tgint pipe_fds[2]; /* dummy pipe for emulation (read=0, write=1) */","lines":1,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/devlink/fu-devlink-netlink.h#L25"},{"ref":"plugins/devlink/fu-devlink-netlink.c:570-573","code":"  570 | \tif (nlg->pipe_fds[0] != 0)\n  571 | \t\tg_close(nlg->pipe_fds[0], NULL);\n  572 | \tif (nlg->pipe_fds[1] != 0)\n  573 | \t\tg_close(nlg->pipe_fds[1], NULL);","lines":4,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/devlink/fu-devlink-netlink.c#L570-L573"}]},
{"id":"LOGIC_43","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`fu_genesys_usbhub_firmware_write` (`plugins/genesys/fu-genesys-usbhub-firmware.c:369-424`) always uses a hardcoded `guint16 code_size = 0x6000;` regardless of `self->chip.model`, whereas `fu_genesys_usbhub_firmware_parse` computes model-specific sizes (fixed `0x5000` for `ISP_MODEL_HUB_GL3521`, `0x6000` for `ISP_MODEL_HUB_GL3523` at old revisions, or a dynamically-calculated size via `fu_genesys_usbhub_firmware_calculate_size` for `GL3523PLUS`/`GL3590`/`GL3525`). A firmware built via the XML `build()`/`write()` path (e.g. `fwupdtool build-firmware`) for a non-GL3523 chip will therefore produce an image of the wrong size, with the checksum written at the wrong trailing offset relative to what a real device of that model expects.","fix":"Base `code_size` on `self->chip.model` (mirroring the switch in `fu_genesys_usbhub_firmware_parse`) instead of unconditionally using `0x6000`.","locations":[{"ref":"plugins/genesys/fu-genesys-usbhub-firmware.c:368-424","code":"  368 | static GByteArray *\n  369 | fu_genesys_usbhub_firmware_write(FuFirmware *firmware, GError **error)\n  370 | {\n  371 | \tFuGenesysUsbhubFirmware *self = FU_GENESYS_USBHUB_FIRMWARE(firmware);\n  372 | \tg_autoptr(GByteArray) buf = g_byte_array_new();\n  373 | \tguint16 code_size = 0x6000;\n  374 | \tguint16 checksum;\n  375 | \n  376 | \t/* fixed size */\n  377 | \tfu_byte_array_set_size(buf, code_size, 0x00);\n  378 | \n  379 | \t/* signature */\n  380 | \tif (!fu_memcpy_safe(buf->data,\n  381 | \t\t\t    buf->len,\n  382 | \t\t\t    FU_STRUCT_GENESYS_FIRMWARE_HDR_OFFSET_MAGIC, /* dst */\n  383 | \t\t\t    (const guint8 *)FU_STRUCT_GENESYS_FIRMWARE_HDR_DEFAULT_MAGIC,\n  384 | \t\t\t    FU_STRUCT_GENESYS_FIRMWARE_HDR_SIZE_MAGIC,\n  385 | \t\t\t    0x0, /* src */\n  386 | \t\t\t    FU_STRUCT_GENESYS_FIRMWARE_HDR_SIZE_MAGIC,\n  387 | \t\t\t    error))\n  388 | \t\treturn NULL;\n  389 | \n  390 | \t/* static tool string */\n  391 | \tif (self->st_static_ts != NULL) {\n  392 | \t\tif (!fu_memcpy_safe(buf->data,\n  393 | \t\t\t\t    buf->len,\n  394 | \t\t\t\t    GENESYS_USBHUB_STATIC_TOOL_STRING_OFFSET_GL3523, /* dst */\n  395 | \t\t\t\t    self->st_static_ts->buf->data,\n  396 | \t\t\t\t    self->st_static_ts->buf->len,\n  397 | \t\t\t\t    0x0, /* src */\n  398 | \t\t\t\t    self->st_static_ts->buf->len,\n  399 | \t\t\t\t    error))\n  400 | \t\t\treturn NULL;\n  401 | \t}\n  402 | \n  403 | \t/* version */\n  404 | \tif (!fu_memwrite_uint16_safe(buf->data,\n  405 | \t\t\t\t     buf->len,\n  406 | \t\t\t\t     GENESYS_USBHUB_VERSION_OFFSET,\n  407 | \t\t\t\t     0x1234, /* TODO: parse from firmware version string */\n  408 | \t\t\t\t     G_BIG_ENDIAN,\n  409 | \t\t\t\t     error))\n  410 | \t\treturn NULL;\n  411 | \n  412 | \t/* checksum */\n  413 | \tchecksum = fu_sum16(buf->data, code_size - sizeof(checksum));\n  414 | \tif (!fu_memwrite_uint16_safe(buf->data,\n  415 | \t\t\t\t     buf->len,\n  416 | \t\t\t\t     code_size - sizeof(guint16),\n  417 | \t\t\t\t     checksum,\n  418 | \t\t\t\t     G_BIG_ENDIAN,\n  419 | \t\t\t\t     error))\n  420 | \t\treturn NULL;\n  421 | \n  422 | \t/* success */\n  423 | \treturn g_steal_pointer(&buf);\n  424 | }","lines":57,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/genesys/fu-genesys-usbhub-firmware.c#L368-L424"}]},
{"id":"LOGIC_44","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`FuGpioDevice::fd` (declared as `gint fd; /* valid when the GPIO bit is assigned */` in the struct) is never initialized in `fu_gpio_device_init()`. Because GObject instance memory is zero-filled on construction, `self->fd` defaults to `0`, not `-1`. `fu_gpio_device_unassign()` treats `self->fd < 0` as \"nothing to close\" and otherwise calls `g_close(self->fd, error)` - so on a device instance where `fd` was never assigned (still `0`), `unassign()` would attempt to close file descriptor `0` (stdin) instead of skipping, which is inconsistent with `fu_gpio_device_assign()`/`fu_gpio_device_finalize()`, which both correctly treat `fd > 0` as \"in use\".","fix":"Initialize the sentinel value explicitly:\n```c\nstatic void\nfu_gpio_device_init(FuGpioDevice *self)\n{\n\tself->fd = -1;\n\tfu_udev_device_add_open_flag(FU_UDEV_DEVICE(self), FU_IO_CHANNEL_OPEN_FLAG_READ);\n}\n```\nand keep all `fd` checks consistent (e.g. always use `self->fd >= 0` for \"is open\").","locations":[{"ref":"plugins/gpio/fu-gpio-device.c:14-18","code":"   14 | struct _FuGpioDevice {\n   15 | \tFuUdevDevice parent_instance;\n   16 | \tguint num_lines;\n   17 | \tgint fd; /* valid when the GPIO bit is assigned */\n   18 | };","lines":5,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/gpio/fu-gpio-device.c#L14-L18"},{"ref":"plugins/gpio/fu-gpio-device.c:94-103","code":"   94 | fu_gpio_device_unassign(FuGpioDevice *self, GError **error)\n   95 | {\n   96 | \tif (self->fd < 0)\n   97 | \t\treturn TRUE;\n   98 | \tg_info(\"unsetting %s\", fu_device_get_logical_id(FU_DEVICE(self)));\n   99 | \tif (!g_close(self->fd, error))\n  100 | \t\treturn FALSE;\n  101 | \tself->fd = -1;\n  102 | \treturn TRUE;\n  103 | }","lines":10,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/gpio/fu-gpio-device.c#L94-L103"},{"ref":"plugins/gpio/fu-gpio-device.c:213-217","code":"  213 | static void\n  214 | fu_gpio_device_init(FuGpioDevice *self)\n  215 | {\n  216 | \tfu_udev_device_add_open_flag(FU_UDEV_DEVICE(self), FU_IO_CHANNEL_OPEN_FLAG_READ);\n  217 | }","lines":5,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/gpio/fu-gpio-device.c#L213-L217"}]},
{"id":"LOGIC_45","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`fu_gpio_device_assign()` treats `self->fd > 0` as \"already assigned\" when deciding whether to reject a second `assign()` call, and `fu_gpio_device_unassign()`/`fu_gpio_device_finalize()` also use `> 0` / `< 0` checks. All of these implicitly assume file descriptor `0` can never be a legitimately-assigned GPIO fd, which is usually true in practice but is not guaranteed (e.g. if stdin were closed before the ioctl request). Combined with the missing `-1` initialization noted separately, the sentinel handling for `fd` is fragile and inconsistent across `assign`, `unassign`, and `finalize`.","fix":"Pick one consistent sentinel convention everywhere, e.g. always test `self->fd >= 0` for \"open/in use\" and `self->fd < 0` for \"unassigned\", after ensuring `fd` is initialized to `-1`.","locations":[{"ref":"plugins/gpio/fu-gpio-device.c:96","code":"   96 | \tif (self->fd < 0)","lines":1,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/gpio/fu-gpio-device.c#L96"},{"ref":"plugins/gpio/fu-gpio-device.c:158","code":"  158 | \tif (self->fd > 0) {","lines":1,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/gpio/fu-gpio-device.c#L158"},{"ref":"plugins/gpio/fu-gpio-device.c:223","code":"  223 | \tif (self->fd > 0)","lines":1,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/gpio/fu-gpio-device.c#L223"}]},
{"id":"LOGIC_46","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`FuIgscAuxFirmware` and `FuIgscOpromFirmware` (`plugins/intel-gsc/fu-igsc-aux-firmware.c:143-154` and `plugins/intel-gsc/fu-igsc-oprom-firmware.c:144-149`) both accumulate manifest-extension device IDs into `self->device_infos` (a `GPtrArray`) inside their `->parse()` vfunc without clearing any pre-existing contents first. `self->device_infos` is only ever allocated once in `_init()`. If `fu_firmware_parse_stream()`/`fu_firmware_parse_bytes()` is ever called more than once on the same firmware object (for example the object being reused for a second `parse()` call, which `FuFirmware` does not explicitly forbid), the array would silently accumulate duplicate device-info entries rather than reflecting only the most recently parsed image, resulting in stale allow-list entries influencing `fu_igsc_aux_firmware_match_device()` / `fu_igsc_oprom_firmware_match_device()`.","fix":"Clear the array at the start of `->parse()` before repopulating it, e.g. ```c\ng_ptr_array_set_size(self->device_infos, 0);\n```so re-parsing the same firmware object cannot leave behind entries from a previous parse.","locations":[{"ref":"plugins/intel-gsc/fu-igsc-aux-firmware.c:105-164","code":"  105 | static gboolean\n  106 | fu_igsc_aux_firmware_parse(FuFirmware *firmware,\n  107 | \t\t\t   FuInputStream *stream,\n  108 | \t\t\t   FuFirmwareParseFlags flags,\n  109 | \t\t\t   GError **error)\n  110 | {\n  111 | \tFuIgscAuxFirmware *self = FU_IGSC_AUX_FIRMWARE(firmware);\n  112 | \tgboolean has_manifest_ext = FALSE;\n  113 | \tg_autoptr(FuFirmware) fw_cpd = fu_ifwi_cpd_firmware_new();\n  114 | \tg_autoptr(FuFirmware) fw_manifest = NULL;\n  115 | \tg_autoptr(FuInputStream) stream_dataimg = NULL;\n  116 | \tg_autoptr(GPtrArray) imgs = NULL;\n  117 | \n  118 | \t/* FuIfwiFptFirmware->parse */\n  119 | \tif (!FU_FIRMWARE_CLASS(fu_igsc_aux_firmware_parent_class)\n  120 | \t\t ->parse(f (FuFirmware *firmware,\n   81 | \t\t\t     FuInputStream *stream,\n   82 | \t\t\t     FuFirmwareParseFlags flags,\n   83 | \t\t\t     GError **error)\n   84 | {\n   85 | \tFuIgscOpromFirmware *self = FU_IGSC_OPROM_FIRMWARE(firmware);\n   86 | \tg_autoptr(FuFirmware) fw_cpd = NULL;\n   87 | \tg_autoptr(FuFirmware) man_img = NULL;\n   88 | \tg_autoptr(GPtrArray) man_ext_imgs = NULL;\n   89 | \n   90 | \t/* FuOpromFirmware->parse */\n   91 | \tif (!FU_FIRMWARE_CLASS(fu_igsc_oprom_firmware_parent_class)\n   92 | \t\t ->parse(firmware, stream, flags, error))\n   93 | \t\treturn FALSE;\n   94 | \n   95 | \t/* check sanity */\n   96 | \tif (fu_oprom_firmware_get_subsystem(FU_OPROM_FIRMWARE(firmware)) !=\n   97 | \t    FU_OPROM_SUBSYSTEM_EFI_BOOT_SRV_DRV) {\n   98 | \t\tg_set_error(error,\n   99 | \t\t\t    FWUPD_ERROR,\n  100 | \t\t\t    FWUPD_ERROR_INVALID_DATA,\n  101 | \t\t\t    \"invalid subsystem, got 0x%x, expected 0x%x\",\n  102 | \t\t\t    fu_oprom_firmware_get_subsystem(FU_OPROM_FIRMWARE(firmware)),\n  103 | \t\t\t    (guint)FU_OPROM_SUBSYSTEM_EFI_BOOT_SRV_DRV);\n  104 | \t\treturn FALSE;\n  105 | \t}\n  106 | \tif (fu_oprom_firmware_get_machine_type(FU_OPROM_FIRMWARE(firmware)) !=\n  107 | \t    FU_OPROM_MACHINE_TYPE_X64) {\n  108 | \t\tg_set_error(error,\n  109 | \t\t\t    FWUPD_ERROR,\n  110 | \t\t\t    FWUPD_ERROR_INVALID_DATA,\n  111 | \t\t\t    \"invalid machine type, got 0x%x, expected 0x%x\",\n  112 | \t\t\t    fu_oprom_firmware_get_machine_type(FU_OPROM_FIRMWARE(firmware)),\n  113 | \t\t\t    (guint)FU_OPROM_MACHINE_TYPE_X64);\n  114 | \t\treturn FALSE;\n  115 | \t}\n  116 | \tif (fu_oprom_firmware_get_compression_type(FU_OPROM_FIRMWARE(firmware)) !=\n  117 | \t    FU_OPROM_COMPRESSION_TYPE_NONE) {\n  118 | \t\tg_set_error(error,\n  119 | \t\t\t    FWUPD_ERROR,\n  120 | \t\t\t    FWUPD_ERROR_INVALID_DATA,\n  121 | \t\t\t    \"invalid compression type, got 0x%x, expected 0x%x (uncompressed)\",\n  122 | \t\t\t    fu_oprom_firmware_get_compression_type(FU_OP {"id":"LOGIC_47","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`_fu_usb_device_get_interface_for_class()` in `plugins/jabra-gnp/fu-jabra-gnp-device.c` uses `0xFF` as its \"not found\" sentinel return value, and `fu_jabra_gnp_device_probe()` checks `self->iface_hid == 0xFF` to detect failure. However `bInterfaceNumber` is an 8-bit USB field and `0xFF` is a technically legal interface number, so a device that legitimately exposes HID on interface `0xFF` would be indistinguishable from \"HID interface not found\", causing `fu_jabra_gnp_device_probe()` to incorrectly fail with `\"cannot find HID interface\"`.","fix":"Use a signed return type (e.g. `gint`) with `-1` as the sentinel, or an explicit `gboolean found` out-parameter, instead of overloading a valid `guint8` interface number as the error sentinel:\n```c\nstatic gboolean\n_fu_usb_device_get_interface_for_class(FuUsbDevice *usb_device, guint8 intf_class, guint8 *iface_out, GError **error)\n```","locations":[{"ref":"plugins/jabra-gnp/fu-jabra-gnp-device.c:53-66","code":"   53 | static guint8\n   54 | _fu_usb_device_get_interface_for_class(FuUsbDevice *usb_device, guint8 intf_class, GError **error)\n   55 | {\n   56 | \tg_autoptr(GPtrArray) intfs = NULL;\n   57 | \tintfs = fu_usb_device_get_interfaces(usb_device, error);\n   58 | \tif (intfs == NULL)\n   59 | \t\treturn 0xFF;\n   60 | \tfor (guint i = 0; i < intfs->len; i++) {\n   61 | \t\tFuUsbInterface *intf = g_ptr_array_index(intfs, i);\n   62 | \t\tif (fu_usb_interface_get_class(intf) == intf_class)\n   63 | \t\t\treturn fu_usb_interface_get_number(intf);\n   64 | \t}\n   65 | \treturn 0xFF;\n   66 | }","lines":14,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/jabra-gnp/fu-jabra-gnp-device.c#L53-L66"},{"ref":"plugins/jabra-gnp/fu-jabra-gnp-device.c:100-105","code":"  100 | \tself->iface_hid =\n  101 | \t    _fu_usb_device_get_interface_for_class(FU_USB_DEVICE(self), FU_USB_CLASS_HID, error);\n  102 | \tif (self->iface_hid == 0xFF) {\n  103 | \t\tg_prefix_error_literal(error, \"cannot find HID interface: \");\n  104 | \t\treturn FALSE;\n  105 | \t}","lines":6,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/jabra-gnp/fu-jabra-gnp-device.c#L100-L105"}]},
{"id":"LOGIC_48","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `fu_engine_report_from_spec()`, when a report-spec value starts with `$` it is looked up via `g_get_os_info(kv[1] + 1)`. If that OS-info key does not exist, `g_get_os_info()` returns `NULL`, and the code then falls through to `if (value == NULL) value = g_strdup(kv[1]);`, which sets `value` to the *literal, unresolved* placeholder string (e.g. `\"$BUILD_ID\"`, dollar sign included) instead of reporting an error or leaving the field unset. The resulting `FwupdReport` field (e.g. `DistroVersion`) then silently contains a bogus `$KEY` string rather than either the real OS value or a clear failure.","fix":"Distinguish \"not a $-lookup\" from \"$-lookup failed\":\n\n```c\nif (g_str_has_prefix(kv[1], \"$\")) {\n\tvalue = g_get_os_info(kv[1] + 1);\n\tif (value == NULL) {\n\t\tg_set_error(error, FWUPD_ERROR, FWUPD_ERROR_INVALID_DATA,\n\t\t\t    \"failed to resolve os-release key '%s'\", kv[1] + 1);\n\t\treturn NULL;\n\t}\n} else {\n\tvalue = g_strdup(kv[1]);\n}\n```","locations":[{"ref":"src/fu-engine-helper.c:596-600","code":"  596 | \t\t}\n  597 | \t\tif (g_str_has_prefix(kv[1], \"$\"))\n  598 | \t\t\tvalue = g_get_os_info(kv[1] + 1);\n  599 | \t\tif (value == NULL)\n  600 | \t\t\tvalue = g_strdup(kv[1]);","lines":5,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/src/fu-engine-helper.c#L596-L600"}]},
{"id":"LOGIC_49","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"very_easy","description":"In `fu_device_to_string_impl()`, the events dump loop prints events for `i` in `0..10` inclusive (11 events) before triggering the truncation message on `i == 11`. The truncation message computes the remaining count as `priv->events->len - 10`, but since 11 events (indices 0 through 10) were already printed, the correct remaining count is `priv->events->len - 11`. The debug output therefore always overstates the number of remaining events by one.","fix":"Use the correct offset matching the number of events actually printed:\n```c\ng_autofree gchar *msg =\n    g_strdup_printf(\"…and %u more events\", priv->events->len - 11);\n```","locations":[{"ref":"libfwupdplugin/fu-device.c:5448-5456","code":" 5448 | \t\tfor (guint i = 0; i < priv->events->len; i++) {\n 5449 | \t\t\tFuDeviceEvent *event = g_ptr_array_index(priv->events, i);\n 5450 | \t\t\tif (i > 10) {\n 5451 | \t\t\t\tg_autofree gchar *msg =\n 5452 | \t\t\t\t    g_strdup_printf(\"…and %u more events\", priv->events->len - 10);\n 5453 | \t\t\t\tfwupd_codec_string_append(str, idt + 1, \"\", msg);\n 5454 | \t\t\t\tbreak;\n 5455 | \t\t\t}\n 5456 | \t\t\tfwupd_codec_add_string(FWUPD_CODEC(event), idt + 1, str);","lines":9,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-device.c#L5448-L5456"}]},
{"id":"LOGIC_50","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"medium","description":"In `fu_edid_parse`, the three 5-bit PNP ID characters are decoded as `'A' + (bits) - 1` without validating that `bits` is in the valid EDID range of 1-26. If a manufacturer-name field in attacker/firmware-controlled EDID data encodes a 0 value (reserved per the EDID spec), the arithmetic produces `'A' - 1` (`'@'`), a non-alphabetic character silently stored as part of `pnp_id`, which is then used to build instance IDs and vendor IDs (`fu_device_build_instance_id_full`, `fu_device_build_vendor_id`) in `fu_drm_device_probe`.","fix":"Validate each decoded 5-bit value is in the `1-26` range before adding it to `pnp_id`, and fall back to a safe placeholder or reject the EDID with `FWUPD_ERROR_INVALID_DATA` otherwise.","locations":[{"ref":"libfwupdplugin/fu-edid.c:268-279","code":"  268 | \t/* decode the PNP ID from three 5 bit words packed into 2 bytes\n  269 | \t * /--00--\\/--01--\\\n  270 | \t * 7654321076543210\n  271 | \t * |\\---/\\---/\\---/\n  272 | \t * R  C1   C2   C3 */\n  273 | \tmanu_id = fu_struct_edid_get_manufacturer_name(st, NULL);\n  274 | \tpnp_id = g_strdup_printf(\n  275 | \t    \"%c%c%c\",\n  276 | \t    'A' + ((manu_id[0] & 0b01111100) >> 2) - 1,\n  277 | \t    'A' + (((manu_id[0] & 0b00000011) << 3) + ((manu_id[1] & 0b11100000) >> 5)) - 1,\n  278 | \t    'A' + (manu_id[1] & 0b00011111) - 1);\n  279 | \tfu_edid_set_pnp_id(self, pnp_id);","lines":12,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-edid.c#L268-L279"}]},
{"id":"LOGIC_51","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"In `fu_history_get_security_attrs` (`src/fu-history.c`), deduplication of consecutive rows uses `guint old_hash = 0;` as a sentinel meaning \"no previous hash seen yet\", then compares `hash == old_hash` where `hash = g_str_hash(json);`. If the very first row's JSON happens to hash to `0` (or any subsequent legitimate JSON row hashes to the same value as a coincidental hash collision with the sentinel on the first iteration), it would not be incorrectly skipped since `old_hash` starts at 0 and is only compared from the second iteration onward in effect - this is a low-impact edge case worth a comment, but relies on `g_str_hash()` never producing 0 for the first row to behave exactly as intended for that first comparison.","fix":"Use an explicit `gboolean have_old_hash` flag instead of relying on `0` as a sentinel value:\n```c\ngboolean have_old_hash = FALSE;\nguint old_hash = 0;\n...\nif (have_old_hash && hash == old_hash) {\n\tcontinue;\n}\nold_hash = hash;\nhave_old_hash = TRUE;\n```","locations":[{"ref":"src/fu-history.c:1358","code":" 1358 | \tguint old_hash = 0;","lines":1,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/src/fu-history.c#L1358"},{"ref":"src/fu-history.c:1404-1409","code":" 1404 | \t\thash = g_str_hash(json);\n 1405 | \t\tif (hash == old_hash) {\n 1406 | \t\t\tg_debug(\"skipping %s as unchanged\", timestamp);\n 1407 | \t\t\tcontinue;\n 1408 | \t\t}\n 1409 | \t\told_hash = hash;","lines":6,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/src/fu-history.c#L1404-L1409"}]},
{"id":"LOGIC_52","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"In `fu_jcat_gnutls_pkcs7_engine_verify()`, the newest-authority tracking `if (info->signing_time > timestamp_newest || timestamp_newest == 0)` treats an unset/zero `signing_time` the same as `timestamp_newest` never having been assigned. When a PKCS7 blob has multiple signer infos and none of them carry a signing time (all `info->signing_time == 0`, which is legitimate when `FU_JCAT_SIGN_FLAG_ADD_TIMESTAMP` was not used), the condition is true on every iteration, so `authority_newest` ends up holding the issuer DN of the *last* iterated signer rather than a well-defined \"newest\" one. This only affects which authority name is reported in the resulting `FuJcatResult`, not whether verification succeeds, but the reported authority for untimestamped multi-signer blobs is effectively arbitrary.","fix":"Track whether a signing time has actually been observed with a separate boolean (e.g. `gboolean has_timestamp`) instead of overloading `timestamp_newest == 0`, so an untimestamped signer does not repeatedly overwrite `authority_newest` on every loop iteration.","locations":[{"ref":"src/fu-jcat-gnutls-pkcs7-engine.c:268-274","code":"  268 | \t\t/* save details about the key for the result */\n  269 | \t\tif (info->signing_time > timestamp_newest || timestamp_newest == 0) {\n  270 | \t\t\ttimestamp_newest = info->signing_time;\n  271 | \t\t\tdn = fu_jcat_gnutls_pkcs7_datum_to_dn_str(&info->issuer_dn);\n  272 | \t\t\tif (dn != NULL)\n  273 | \t\t\t\tg_string_assign(authority_newest, dn);\n  274 | \t\t}","lines":7,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/src/fu-jcat-gnutls-pkcs7-engine.c#L268-L274"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"The Intel CVS quad-format version string is built with different `printf` conversions in the device and the firmware code paths. `fu_intel_cvs_device_setup()` uses hex: `g_strdup_printf(\"%x.%x.%x.%x\", ...)` (`plugins/intel-cvs/fu-intel-cvs-device.c`), while `fu_intel_cvs_firmware_parse()` uses decimal: `g_strdup_printf(\"%u.%u.%u.%u\", ...)` (`plugins/intel-cvs/fu-intel-cvs-firmware.c`), even though both set `FWUPD_VERSION_FORMAT_QUAD` (`fu_device_set_version_format`/`fu_firmware_set_version_format`). Any component with a `major`/`minor`/`hotfix`/`build` value of 10 or higher (`a`-`f` in hex) will render differently between the on-device version and the candidate firmware's version (e.g. device `\"a.1.2.3\"` vs firmware `\"10.1.2.3\"`), breaking version comparison/downgrade checks used by `fu_intel_cvs_device_check_firmware()` and the update engine.","fix":"Use the same conversion in both places, e.g. change the device side to decimal to match the firmware side:\n```c\nversion = g_strdup_printf(\"%u.%u.%u.%u\",\n                          fu_struct_intel_cvs_probe_get_major(st_probe),\n                          fu_struct_intel_cvs_probe_get_minor(st_probe),\n                          fu_struct_intel_cvs_probe_get_hotfix(st_probe),\n                          fu_struct_intel_cvs_probe_get_build(st_probe));\n```","locations":[{"ref":"plugins/intel-cvs/fu-intel-cvs-device.c:57-61","code":"   57 | \tversion = g_strdup_printf(\"%x.%x.%x.%x\",\n   58 | \t\t\t\t  fu_struct_intel_cvs_probe_get_major(st_probe),\n   59 | \t\t\t\t  fu_struct_intel_cvs_probe_get_minor(st_probe),\n   60 | \t\t\t\t  fu_struct_intel_cvs_probe_get_hotfix(st_probe),\n   61 | \t\t\t\t  fu_struct_intel_cvs_probe_get_build(st_probe));","lines":5,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/intel-cvs/fu-intel-cvs-device.c#L57-L61"},{"ref":"plugins/intel-cvs/fu-intel-cvs-firmware.c:75-79","code":"   75 | \tversion = g_strdup_printf(\"%u.%u.%u.%u\",\n   76 | \t\t\t\t  fu_struct_intel_cvs_fw_get_major(st_fw),\n   77 | \t\t\t\t  fu_struct_intel_cvs_fw_get_minor(st_fw),\n   78 | \t\t\t\t  fu_struct_intel_cvs_fw_get_hotfix(st_fw),\n   79 | \t\t\t\t  fu_struct_intel_cvs_fw_get_build(st_fw));","lines":5,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/intel-cvs/fu-intel-cvs-firmware.c#L75-L79"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"In `fwupd_device_add_string` the `FWUPD_RESULT_KEY_FLASHES_LEFT` value is only appended to the human-readable/CLI string output when `priv->flashes_left < 2`, whereas every other codec representation (`fwupd_device_add_variant` and `fwupd_device_add_json`) shows it whenever `priv->flashes_left > 0`. This means any device reporting 2 or more flashes remaining silently has its `FlashesLeft` value hidden from `fwupd_codec_to_string()`/CLI text output, even though it is present over D-Bus and JSON.","fix":"Change the condition to match the other codec paths:\n```c\nif (priv->flashes_left > 0) {\n\tfwupd_codec_string_append_int(str,\n\t\t\t\t      idt,\n\t\t\t\t      FWUPD_RESULT_KEY_FLASHES_LEFT,\n\t\t\t\t      priv->flashes_left);\n}\n```","locations":[{"ref":"libfwupd/fwupd-device.c:3684-3689","code":" 3684 | \tif (priv->flashes_left < 2) {\n 3685 | \t\tfwupd_codec_string_append_int(str,\n 3686 | \t\t\t\t\t      idt,\n 3687 | \t\t\t\t\t      FWUPD_RESULT_KEY_FLASHES_LEFT,\n 3688 | \t\t\t\t\t      priv->flashes_left);\n 3689 | \t}","lines":6,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupd/fwupd-device.c#L3684-L3689"}]},
{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"`fu_firmware_strparse_uint24_safe()` in `libfwupdplugin/fu-firmware-common.c` is documented to\nreturn a value \"from 0 to 0xffffff\" into a `guint32 *value` out-parameter, and correctly parses\nwith `fu_strtoull(buffer, &valuetmp, 0, G_MAXUINT32, ...)`. However the final assignment is\n`*value = (guint16)valuetmp;` instead of `(guint32)valuetmp` - a copy-paste leftover from\n`fu_firmware_strparse_uint16_safe()` just above it. Any 24-bit value greater than `0xFFFF` gets\nsilently truncated to its low 16 bits before being written to the caller's `guint32`. This function\nis used by `fu_srec_firmware.c` to parse 24-bit S-Record addresses, so addresses above `0xFFFF`\n(e.g. `0xABCDEF`) are silently corrupted to `0xCDEF`, causing firmware data to be interpreted or\nwritten at the wrong memory address.","fix":"Change the truncating cast to match the documented 32-bit range:\n```c\n// before\nif (value != NULL)\n        *value = (guint16)valuetmp;\n\n// after\nif (value != NULL)\n        *value = (guint32)valuetmp;\n```","locations":[{"ref":"libfwupdplugin/fu-firmware-common.c:159-185","code":"  159 | gboolean\n  160 | fu_firmware_strparse_uint24_safe(const gchar *data,\n  161 | \t\t\t\t gsize datasz,\n  162 | \t\t\t\t gsize offset,\n  163 | \t\t\t\t guint32 *value,\n  164 | \t\t\t\t GError **error)\n  165 | {\n  166 | \tgchar buffer[7] = {'\\0'};\n  167 | \tguint64 valuetmp = 0;\n  168 | \tif (!fu_memcpy_safe((guint8 *)buffer,\n  169 | \t\t\t    sizeof(buffer),\n  170 | \t\t\t    0x0, /* dst */\n  171 | \t\t\t    (const guint8 *)data,\n  172 | \t\t\t    datasz,\n  173 | \t\t\t    offset, /* src */\n  174 | \t\t\t    sizeof(buffer) - 1,\n  175 | \t\t\t    error))\n  176 | \t\treturn FALSE;\n  177 | \tif (!fu_strtoull(buffer, &valuetmp, 0, G_MAXUINT32, FU_INTEGER_BASE_16, error)) {\n  178 | \t\tg_autofree gchar *str = fu_strsafe(buffer, sizeof(buffer));\n  179 | \t\tg_prefix_error(error, \"cannot parse %s as hex: \", str);\n  180 | \t\treturn FALSE;\n  181 | \t}\n  182 | \tif (value != NULL)\n  183 | \t\t*value = (guint16)valuetmp;\n  184 | \treturn TRUE;\n  185 | }","lines":27,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-firmware-common.c#L159-L185"}]},
{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"`fu_heci_device_read_file_ex()` in `libfwupdplugin/fu-heci-device.c` sizes the response buffer with the *request* struct size instead of the *response* struct size: `fu_byte_array_set_size(buf_res, FU_MKHI_READ_FILE_EX_REQUEST_SIZE + datasz_req, 0x0);`. Per `libfwupdplugin/fu-heci.rs`, `FuMkhiReadFileExRequest` (17 bytes) and `FuMkhiReadFileExResponse` (8 bytes) have different sizes, so the buffer passed to `fu_mei_device_read()` is 9 bytes larger than the actual expected response (`RESPONSE_SIZE + datasz_req`). The sibling function `fu_heci_device_read_file()` correctly uses `FU_MKHI_READ_FILE_RESPONSE_SIZE` for the same pattern, confirming this is a copy-paste slip.","fix":"Use the response struct size instead of the request struct size:\n```c\nfu_byte_array_set_size(buf_res, FU_MKHI_READ_FILE_EX_RESPONSE_SIZE + datasz_req, 0x0);\n```","locations":[{"ref":"libfwupdplugin/fu-heci-device.c:152","code":"  152 | \tfu_byte_array_set_size(buf_res, FU_MKHI_READ_FILE_EX_REQUEST_SIZE + datasz_req, 0x0);","lines":1,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-heci-device.c#L152"}]},
{"id":"CPY_5","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"In `fu_elantp_hid_device_setup` (the TP/HID variant), after `fu_elantp_hid_device_ensure_forcetable_address` succeeds, `self->force_table_support` is only set to `TRUE` when the resolved address is non-zero: `self->force_table_support = self->force_table_addr > 0 ? TRUE : FALSE;`. The MCU variant, `fu_elantp_hid_mcu_device_setup`, does the analogous thing after `fu_elantp_hid_mcu_device_ensure_force_table_addr` succeeds but unconditionally sets `self->force_table_support = TRUE;` regardless of whether `force_table_addr` ended up `0`. Since `fu_elantp_hid_mcu_device_ensure_force_table_addr` can legitimately return `TRUE` with `force_table_addr == 0` (the `iap_ver == 0x3` branch sets it to `0` for non-matching `module_id`), the MCU device can end up believing force-table support is enabled when the address is actually `0`, unlike the TP device which correctly reports `FALSE` in the same situation. This is a copy-paste divergence between the two device variants that changes device capability detection for the MCU child device.","fix":"Make the MCU variant match the TP variant's conditional assignment:\n```c\nself->force_table_support = self->force_table_addr > 0 ? TRUE : FALSE;\n```\ninstead of unconditionally `self->force_table_support = TRUE;`.","locations":[{"ref":"plugins/elantp/fu-elantp-hid-device.c:447-451","code":"  447 | \t\t\tif (!fu_elantp_hid_device_ensure_forcetable_address(self, error)) {\n  448 | \t\t\t\tg_prefix_error_literal(error, \"get forcetable address fail: \");\n  449 | \t\t\t\treturn FALSE;\n  450 | \t\t\t}\n  451 | \t\t\tself->force_table_support = self->force_table_addr > 0 ? TRUE : FALSE;","lines":5,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/elantp/fu-elantp-hid-device.c#L447-L451"},{"ref":"plugins/elantp/fu-elantp-hid-mcu-device.c:346-350","code":"  346 | \t\t\tif (!fu_elantp_hid
