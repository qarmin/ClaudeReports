{"id":"ARCH_7","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"In `fu_genesys_usbhub_firmware_parse` (`plugins/genesys/fu-genesys-usbhub-firmware.c`), both the `static_ts_offset` switch (lines 261-290) and the `code_size` switch (lines 297-319) on `self->chip.model` end with a silent `default: break;`, leaving `static_ts_offset`/`code_size` at their initial value of `0`. Currently `fu_genesys_usbhub_firmware_get_chip` only ever sets `self->chip.model` to one of the five handled enum values (or returns an error), so the `default` branch is unreachable today. But if a new `FuGenesysModel` value is ever added to `fu-genesys-common.h` and wired into `get_chip()` without also updating both of these switches, the firmware would be silently parsed from offset 0 / with size 0 instead of raising an error, producing wrong data rather than a clear failure - a copy/paste hazard in the making since the model list has to be kept in sync in three separate places (`get_chip`, `static_ts_offset` switch, `code_size` switch).","fix":"Add an explicit `default:` case to both switches that calls `g_set_error_literal(error, FWUPD_ERROR, FWUPD_ERROR_NOT_SUPPORTED, \"unsupported chip model\")` and returns `FALSE`, so future model additions fail loudly instead of silently parsing at offset/size `0`.","locations":[{"ref":"plugins/genesys/fu-genesys-usbhub-firmware.c:261-290","code":"  261 | \tswitch (self->chip.model) {\n  262 | \tcase ISP_MODEL_HUB_GL3521:\n  263 | \t\tstatic_ts_offset = GENESYS_USBHUB_STATIC_TOOL_STRING_OFFSET_GL3521;\n  264 | \t\tbreak;\n  265 | \tcase ISP_MODEL_HUB_GL3523:\n  266 | \t\tstatic_ts_offset = GENESYS_USBHUB_STATIC_TOOL_STRING_OFFSET_GL3523;\n  267 | \t\tbreak;\n  268 | \tcase ISP_MODEL_HUB_GL3523PLUS:\n  269 | \t\tstatic_ts_offset = GENESYS_USBHUB_STATIC_TOOL_STRING_OFFSET_GL3523PLUS;\n  270 | \t\tbreak;\n  271 | \tcase ISP_MODEL_HUB_GL3590:\n  272 | \t\tstatic_ts_offset = GENESYS_USBHUB_STATIC_TOOL_STRING_OFFSET_GL3590;\n  273 | \t\tbreak;\n  274 | \tcase ISP_MODEL_HUB_GL3525: {\n  275 | \t\tguint8 configuration = 0;\n  276 | \t\tif (!fu_input_stream_read_u8(stream,\n  277 | \t\t\t\t\t     GENESYS_USBHUB_FW_CONFIGURATION_OFFSET,\n  278 | \t\t\t\t\t     &configuration,\n  279 | \t\t\t\t\t     error))\n  280 | \t\t\treturn FALSE;\n  281 | \t\tif (configuration == GENESYS_USBHUB_FW_CONFIGURATION_NEW_FORMAT ||\n  282 | \t\t    configuration == GENESYS_USBHUB_FW_CONFIGURATION_NEW_FORMAT_V2)\n  283 | \t\t\tstatic_ts_offset = GENESYS_USBHUB_STATIC_TOOL_STRING_OFFSET_GL3525_V2;\n  284 | \t\telse\n  285 | \t\t\tstatic_ts_offset = GENESYS_USBHUB_STATIC_TOOL_STRING_OFFSET_GL3525;\n  286 | \t\tbreak;\n  287 | \t}\n  288 | \tdefault:\n  289 | \t\tbreak;\n  290 | \t}","lines":30,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/genesys/fu-genesys-usbhub-firmware.c#L261-L290"},{"ref":"plugins/genesys/fu-genesys-usbhub-firmware.c:297-319","code":"  297 | \tswitch (self->chip.model) {\n  298 | \tcase ISP_MODEL_HUB_GL3521:\n  299 | \t\tcode_size = 0x5000;\n  300 | \t\tbreak;\n  301 | \tcase ISP_MODEL_HUB_GL3523: {\n  302 | \t\tif (self->chip.revision == 50) {\n  303 | \t\t\tif (!fu_genesys_usbhub_firmware_calculate_size(stream, &code_size, error))\n  304 | \t\t\t\treturn FALSE;\n  305 | \t\t} else {\n  306 | \t\t\tcode_size = 0x6000;\n  307 | \t\t}\n  308 | \t\tbreak;\n  309 | \t}\n  310 | \tcase ISP_MODEL_HUB_GL3523PLUS:\n  311 | \tcase ISP_MODEL_HUB_GL3590:\n  312 | \tcase ISP_MODEL_HUB_GL3525: {\n  313 | \t\tif (!fu_genesys_usbhub_firmware_calculate_size(stream, &code_size, error))\n  314 | \t\t\treturn FALSE;\n  315 | \t\tbreak;\n  316 | \t}\n  317 | \tdefault:\n  318 | \t\tbreak;\n  319 | \t}","lines":23,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/genesys/fu-genesys-usbhub-firmware.c#L297-L319"}]},
{"id":"ARCH_8","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"`main()` in `src/fu-main.c` directly mixes several unrelated daemon-lifecycle responsibilities inline: command-line parsing, D-Bus socket-address derivation (including a TOCTOU `g_file_test()`/`g_unlink()` pair for stale unix-socket cleanup), `SIGTERM` handling setup, binary-replacement monitoring via `GFileMonitor`, and low-memory monitoring via `GMemoryMonitor`, all interleaved with `#ifdef` blocks for `HAVE_GIO_UNIX`/`HAVE_SYSTEMD`/GLib version checks. None of this is factored into helper functions, making the entrypoint harder to test or reason about in isolation and increasing the chance of the kind of error-handling slip described in the other `fu-main.c` finding.","fix":"Extract the socket-address resolution, signal/monitor setup, and shutdown-source wiring into small dedicated static helper functions (e.g. `fu_main_setup_socket_address()`, `fu_main_setup_signal_handlers(FuDaemon *daemon)`, `fu_main_setup_monitors(FuDaemon *daemon)`) each returning a `gboolean`/`GError**` result, so `main()` reads as a short, linear sequence of steps and each helper's error handling can be reviewed and tested independently.","locations":[{"ref":"src/fu-main.c:77-201","code":"   77 | int\n   78 | main(int argc, char *argv[])\n   79 | {\n   80 | \tgboolean immediate_exit = FALSE;\n   81 | \tgboolean timed_exit = FALSE;\n   82 | \tconst gchar *socket_filename = g_getenv(\"FWUPD_DBUS_SOCKET\");\n   83 | \tconst GOptionEntry options[] = {\n   84 | \t    {\"timed-exit\",\n   85 | \t     '\\0',\n   86 | \t     0,\n   87 | \t     G_OPTION_ARG_NONE,\n   88 | \t     &timed_exit,\n   89 | \t     /* TRANSLATORS: exit after we've started up, used for user profiling */\n   90 | \t     N_(\"Exit after a small delay\"),\n   91 | \t     NULL},\n   92 | \t    {\"immediate-exit\",\n   93 | \t     '\\0',\n   94 | \t     0,\n   95 | \t     G_OPTION_ARG_NONE,\n   96 | \t     &imme {"id":"OTHER_1","type":"other","type_label":"Other","severity":"medium","difficulty":"medium","description":"`fu_jabra_gnp_write_chunks()` in `plugins/jabra-gnp/fu-jabra-gnp-common.c` retries a chunk indefinitely when the device's acknowledgement does not match the expected chunk number: on mismatch it does `chunk_number--;` and `failed_chunk = TRUE;`, then the enclosing `for` loop's `chunk_number++` brings it back to the same value next iteration - with no cap on the number of times this can happen. Every other protocol step in this plugin uses `fu_device_retry_full()` with `FU_JABRA_GNP_MAX_RETRIES`, but this one has no retry limit at all, so a misbehaving or malicious HID peripheral that keeps returning an unexpected chunk-number acknowledgement can hang the firmware-update flow forever.","fix":"Add an explicit retry counter (mirroring `FU_JABRA_GNP_MAX_RETRIES`) around the mismatch-retry path and fail with a `GError` once exceeded, e.g.:\n```c\nguint retries = 0;\n...\n} else {\n\tif (++retries > FU_JABRA_GNP_MAX_RETRIES) {\n\t\tg_set_error_literal(error, FWUPD_ERROR, FWUPD_ERROR_WRITE,\n\t\t\t\t     \"too many retries writing chunk\");\n\t\treturn FALSE;\n\t}\n\tchunk_number--;\n\tfailed_chunk = TRUE;\n}\n```","locations":[{"ref":"plugins/jabra-gnp/fu-jabra-gnp-common.c:684-728","code":"  684 | \tfor (gint chunk_number = 0; (guint)chunk_number < fu_chunk_array_length(chunks);\n  685 | \t     chunk_number++) {\n  686 | \t\tg_autoptr(FuChunk) chk = NULL;\n  687 | \n  688 | \t\t/* prepare chunk */\n  689 | \t\tchk = fu_chunk_array_index(chunks, chunk_number, error);\n  690 | \t\tif (chk == NULL)\n  691 | \t\t\treturn FALSE;\n  692 | \t\tif (!fu_jabra_gnp_write_chunk(device,\n  693 | \t\t\t\t\t      address,\n  694 | \t\t\t\t\t      chunk_number,\n  695 | \t\t\t\t\t      fu_chunk_get_data(chk),\n  696 | \t\t\t\t\t      fu_chunk_get_data_sz(chk),\n  697 | \t\t\t\t\t      error))\n  698 | \t\t\treturn FALSE;\n  699 | \t\tif (((chunk_number % FU_JABRA_GNP_PRELOAD_COUNT) == 0) ||\n  700 | \t\t    (guint)chunk_number == fu_chunk_array_length(chunks) - 1) {\n  701 | \t\t\tif (!fu_device_retry_full(device,\n  702 | \t\t\t\t\t\t  address == FU_JABRA_GNP_ADDRESS_OTA_CHILD\n  703 | \t\t\t\t\t\t      ? fu_jabra_gnp_child_device_rx_cb\n  704 | \t\t\t\t\t\t      : fu_jabra_gnp_device_rx_cb,\n  705 | \t\t\t\t\t\t  FU_JABRA_GNP_MAX_RETRIES,\n  706 | \t\t\t\t\t\t  FU_JABRA_GNP_RETRY_DELAY,\n  707 | \t\t\t\t\t\t  &rx_data,\n  708 | \t\t\t\t\t\t  error))\n  709 | \t\t\t\treturn FALSE;\n  710 | \t\t\tif (rx_data.rxbuf[5] != match_buf[5] || rx_data.rxbuf[6] != match_buf[6]) {\n  711 | \t\t\t\tg_set_error_literal(error,\n  712 | \t\t\t\t\t\t    FWUPD_ERROR,\n  713 | \t\t\t\t\t\t    FWUPD_ERROR_INTERNAL,\n  714 | \t\t\t\t\t\t    \"internal error, buf did not match\");\n  715 | \t\t\t\treturn FALSE;\n  716 | \t\t\t}\n  717 | \t\t\tif (fu_memread_uint16(rx_data.rxbuf + 7, G_LITTLE_ENDIAN) == chunk_number ||\n  718 | \t\t\t    fu_memread_uint16(rx_data.rxbuf + 7, G_LITTLE_ENDIAN) ==\n  719 | \t\t\t\t(chunk_number % 0xFFFF) - 1) {\n  720 | \t\t\t\tfailed_chunk = FALSE;\n  721 | \t\t\t} else {\n  722 | \t\t\t\tchunk_number--;\n  723 | \t\t\t\tfailed_chunk = TRUE;\n  724 | \t\t\t}\n  725 | \t\t}\n  726 | \t\tif (!failed_chunk)\n  727 | \t\t\tfu_progress_step_done(progress);\n  728 | \t}","lines":45,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/jabra-gnp/fu-jabra-gnp-common.c#L684-L728"}]},
{"id":"OTHER_2","type":"other","type_label":"Other","severity":"medium","difficulty":"medium","description":"`fu_dbus_daemon_method_call()` unconditionally logs the full, unredacted D-Bus method call parameters at debug level: `parameters_str = g_variant_print_string(parameters, NULL, TRUE); g_debug(\"called %s%s\", method_name, parameters_str->str);`. This includes calls such as `ModifyRemote(remote_id, \"Password\", value)` and `SetBiosSettings`, whose `value` parameter can be a plaintext remote password or a sensitive BIOS setting. The daemon's log sink (`fu_debug_handler_cb()` in `fu-debug.c`) does call `fu_strpassmask()` on every message believing it \"make[s] sure passwords never appear in logs\", but `fu_strpassmask()` (in `libfwupdplugin/fu-string.c`) only detects and masks credentials embedded in an HTTP/HTTPS URL of the form `scheme://user:pass@host` - it does not recognize the `('remote-id', 'Password', 'secret')`-shaped tuple that `g_variant_print_string()` produces for `ModifyRemote`, so the plaintext password is written to the debug/journal log verbatim whenever verbose logging is enabled.","fix":"Avoid dumping raw parameters for methods known to carry secrets, e.g. skip or redact by method name before logging:\n\n```c\nif (g_strcmp0(method_name, \"ModifyRemote\") == 0 || g_strcmp0(method_name, \"SetBiosSettings\") == 0) {\n\tg_debug(\"called %s(...)\", method_name);\n} else {\n\tparameters_str = g_variant_print_string(parameters, NULL, TRUE);\n\tg_debug(\"called %s%s\", method_name, parameters_str->str);\n}\n```\n\nAlternatively extend `fu_strpassmask()` to also mask the value following a `Password`/`password` key in a printed `GVariant` tuple.","locations":[{"ref":"src/fu-dbus-daemon.c:2567-2571","code":" 2567 | \tfu_engine_idle_reset(engine);\n 2568 | \n 2569 | \t/* be helpful */\n 2570 | \tparameters_str = g_variant_print_string(parameters, NULL, TRUE);\n 2571 | \tg_debug(\"called %s%s\", method_name, parameters_str->str);","lines":5,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/src/fu-dbus-daemon.c#L2567-L2571"}]},
{"id":"OTHER_3","type":"other","type_label":"Other","severity":"medium","difficulty":"easy","description":"`fu_device_list_get_wait_for_replug()` iterates `self->devices` without taking `self->devices_mutex` at all, unlike every other accessor in `fu-device-list.c` (`fu_device_list_get_all()`, `fu_device_list_get_active()`, `fu_device_list_find_by_device()`, `fu_device_list_find_by_guid()`, `fu_device_list_find_by_connection()`, `fu_device_list_filter_by_id()`, `fu_device_list_get_by_guids_removed()`, etc.), which all wrap their loop over `self->devices` in `g_rw_lock_reader_lock()`/`g_rw_lock_reader_unlock()` (or a `GRWLockReaderLocker`). Since `fu_device_list_add()`/`fu_device_list_remove()` mutate `self->devices` under the writer lock from what may be a different thread (e.g. a udev/backend enumeration thread) than the one calling `fu_device_list_wait_for_replug()`, this unlocked iteration can race with a concurrent `g_ptr_array_add()`/`g_ptr_array_remove()`, resulting in a `GPtrArray` in an inconsistent state (torn read of `len`/`pdata`, use of a freed `FuDeviceItem`).","fix":"Wrap the loop in the same reader-lock pattern used elsewhere in the file:\n\n```c\nstatic GPtrArray *\nfu_device_list_get_wait_for_replug(FuDeviceList *self)\n{\n\tGPtrArray *devices = g_ptr_array_new_with_free_func((GDestroyNotify)g_object_unref);\n\tg_rw_lock_reader_lock(&self->devices_mutex);\n\tfor (guint i = 0; i < self->devices->len; i++) {\n\t\tFuDeviceItem *item_tmp = g_ptr_array_index(self->devices, i);\n\t\tif (fu_device_has_flag(item_tmp->device, FWUPD_DEVICE_FLAG_WAIT_FOR_REPLUG) &&\n\t\t    !fu_device_has_flag(item_tmp->device, FWUPD_DEVICE_FLAG_EMULATED))\n\t\t\tg_ptr_array_add(devices, g_object_ref(item_tmp->device));\n\t}\n\tg_rw_lock_reader_unlock(&self->devices_mutex);\n\treturn devices;\n}\n```","locations":[{"ref":"src/fu-device-list.c:978-989","code":"  978 | static GPtrArray *\n  979 | fu_device_list_get_wait_for_replug(FuDeviceList *self)\n  980 | {\n  981 | \tGPtrArray *devices = g_ptr_array_new_with_free_func((GDestroyNotify)g_object_unref);\n  982 | \tfor (guint i = 0; i < self->devices->len; i++) {\n  983 | \t\tFuDeviceItem *item_tmp = g_ptr_array_index(self->devices, i);\n  984 | \t\tif (fu_device_has_flag(item_tmp->device, FWUPD_DEVICE_FLAG_WAIT_FOR_REPLUG) &&\n  985 | \t\t    !fu_device_has_flag(item_tmp->device, FWUPD_DEVICE_FLAG_EMULATED))\n  986 | \t\t\tg_ptr_array_add(devices, g_object_ref(item_tmp->device));\n  987 | \t}\n  988 | \treturn devices;\n  989 | }","lines":12,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/src/fu-device-list.c#L978-L989"}]},
{"id":"OTHER_4","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"In `contrib/populate-bios-setting-translations.py` (referenced via its committed copy at `contrib/ci/populate-bios-setting-translations.py`), `output = open(os.path.join(path, \"strings.txt\"), \"w\")` is opened without a `with` block and only closed at the very end of `populate_translations()` via `output.close()`. If `f.read()` on any `display_name` file raises (e.g. a `UnicodeDecodeError` from a non-UTF-8 file), the exception propagates and `output.close()` is never called, leaking the file handle and potentially leaving `strings.txt` without buffered data flushed.","fix":"Use a context manager for the output file so it is always closed/flushed:\n```python\ndef populate_translations(path):\n    with open(os.path.join(path, \"strings.txt\"), \"w\") as output:\n        for root, _, files in os.walk(path):\n            ...\n```","locations":[{"ref":"contrib/ci/populate-bios-setting-translations.py:17-30","code":"   17 | def populate_translations(path):\n   18 |     output = open(os.path.join(path, \"strings.txt\"), \"w\")\n   19 |     for root, _, files in os.walk(path):\n   20 |         for file in files:\n   21 |             val: str = \"\"\n   22 |             if not file.endswith(\"display_name\"):\n   23 |                 continue\n   24 |             with open(os.path.join(root, file)) as f:\n   25 |                 val = f.read().replace('\"', \"\").strip()\n   26 |             if not val:\n   27 |                 continue\n   28 |             output.write(\"#TRANSLATORS: Description of BIOS setting\\n\")\n   29 |             output.write(f\"{val}\\n\\n\")\n   30 |     output.close()","lines":14,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/contrib/ci/populate-bios-setting-translations.py#L17-L30"}]},
{"id":"OTHER_5","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`fu_cbor_parse()` documents `max_depth` as \"maximum depth, or 0 for no limit\", and `fu_cbor_parse_map()` / `fu_cbor_parse_array()` only enforce the depth cap when `helper->max_depth > 0`. Both functions recurse into `fu_cbor_parse_item()` for every nested container, so a caller that passes `max_depth = 0` (which the public API explicitly allows and the in-tree unit tests in `fu-cbor-test.c` do) removes all recursion-depth protection. A crafted CBOR blob with deeply nested arrays/maps (e.g. tens of thousands of levels) would then recurse until the stack is exhausted, crashing the process. The only current production caller (`fu_coswid_firmware_parse()`) happens to pass a nonzero `FU_COSWID_CBOR_MAX_DEPTH`, so this is not exploitable today, but `fu_cbor_parse()` is an exported, general-purpose parser for untrusted attacker-controlled CBOR data and the `0 = no limit` option is a foot-gun for any future caller.","fix":"Enforce a hard internal maximum recursion depth (e.g. 64 or 128) in `fu_cbor_parse_item()`/`fu_cbor_parse_map()`/`fu_cbor_parse_array()` regardless of the caller-supplied `max_depth`, so `max_depth = 0` still gets a sane upper bound instead of disabling the check entirely.","locations":[{"ref":"libfwupdplugin/fu-cbor-common.c:27-105","code":"   27 | static FuCborItem *\n   28 | fu_cbor_parse_map(FuCborParseHelper *helper, guint64 len, guint current_depth, GError **error)\n   29 | {\n   30 | \tg_autoptr(FuCborItem) item = fu_cbor_item_new_map();\n   31 | \n   32 | \t/* sanity check */\n   33 | \tif (helper->max_depth > 0 && current_depth > helper->max_depth) {\n   34 | \t\tg_set_error(error,\n   35 | \t\t\t    FWUPD_ERROR,\n   36 | \t\t\t    FWUPD_ERROR_INVALID_DATA,\n   37 | \t\t\t    \"reached max depth of %u\",\n   38 | \t\t\t    current_depth);\n   39 | \t\treturn NULL;\n   40 | \t}\n   41 | \tif (helper->max_items > 0 && len > helper->max_items) {\n   42 | \t\tg_set_error(error,\n   43 | \t\t\t    FWUPD_ERROR,\n   44 | \t\t\t    FWUPD_ERROR_INVALID_DATA,\n   45 | \t\t\t    \"too many items (%u of maximum %u)\",\n   46 | \t\t\t    (guint)len,\n   47 | \t\t\t    helper->max_items);\n   48 | \t\treturn NULL;\n   49 | \t}\n   50 | \n   51 | \tg_debug(\"map has %u items\", (guint)len);\n   52 | \tfor (guint64 i = 0; i < len; i++) {\n   53 | \t\tg_autoptr(FuCborItem) item_key = NULL;\n   54 | \t\tg_autoptr(FuCborItem) item_val = NULL;\n   55 | \t\titem_key = fu_cbor_parse_item(helper, current_depth, error);\n   56 | \t\tif (item_key == NULL)\n   57 | \t\t\treturn NULL;\n   58 | \t\titem_val = fu_cbor_parse_item(helper, current_depth, error);\n   59 | \t\tif (item_val == NULL)\n   60 | \t\t\treturn NULL;\n   61 | \t\tif (!fu_cbor_item_map_append(item, item_key, item_val, error))\n   62 | \t\t\treturn NULL;\n   63 | \t}\n   64 | \n   65 | \t/* success */\n   66 | \treturn g_steal_pointer(&item);\n   67 | }\n   68 | \n   69 | static FuCborItem *\n   70 | fu_cbor_parse_array(FuCborParseHelper *helper, guint64 len, guint current_depth, GError **error)\n   71 | {\n   72 | \tg_autoptr(FuCborItem) item = fu_cbor_item_new_array();\n   73 | \n   74 | \t/* sanity check */\n   75 | \tif (helper->max_depth > 0 && current_depth > helper->max_depth) {\n   76 | \t\tg_set_error(error,\n   77 | \t\t\t    FWUPD_ERROR,\n   78 | \t\t\t    FWUPD_ERROR_INVALID_DATA,\n   79 | \t\t\t    \"reached max depth of %u\",\n   80 | \t\t\t    current_depth);\n   81 | \t\treturn NULL;\n   82 | \t}\n   83 | \tif (helper->max_items > 0 && len > helper->max_items) {\n   84 | \t\tg_set_error(error,\n   85 | \t\t\t    FWUPD_ERROR,\n   86 | \t\t\t    FWUPD_ERROR_INVALID_DATA,\n   87 | \t\t\t    \"too many items (%u of maximum %u)\",\n   88 | \t\t\t    (guint)len,\n   89 | \t\t\t    helper->max_items);\n   90 | \t\treturn NULL;\n   91 | \t}\n   92 | \n   93 | \tg_debug(\"array has %u items\", (guint)len);\n   94 | \tfor (guint64 i = 0; i < len; i++) {\n   95 | \t\tg_autoptr(FuCborItem) item_tmp = NULL;\n   96 | \t\titem_tmp = fu_cbor_parse_item(helper, current_depth, error);\n   97 | \t\tif (item_tmp == NULL)\n   98 | \t\t\treturn NULL;\n   99 | \t\tif (!fu_cbor_item_array_append(item, item_tmp, error))\n  100 | \t\t\treturn NULL;\n  101 | \t}\n  102 | \n  103 | \t/* success */\n  104 | \treturn g_steal_pointer(&item);\n  105 | }","lines":79,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-cbor-common.c#L27-L105"},{"ref":"libfwupdplugin/fu-cbor-common.c:292-332","code":"  292 | FuCborItem *\n  293 | fu_cbor_parse(FuInputStream *stream,\n  294 | \t      gsize *offset,\n  295 | \t      guint max_depth,\n  296 | \t      guint max_items,\n  297 | \t      guint max_length,\n  298 | \t      GError **error)\n  299 | {\n  300 | \tg_autoptr(FuCborItem) item = NULL;\n  301 | \tFuCborParseHelper helper = {\n  302 | \t    .stream = stream,\n  303 | \t    .max_depth = max_depth,\n  304 | \t    .max_items = max_items,\n  305 | \t    .max_length = max_length,\n  306 | \t};\n  307 | \n  308 | \tg_return_val_if_fail(FU_IS_INPUT_STREAM(stream), NULL);\n  309 | \tg_return_val_if_fail(error == NULL || *error == NULL, NULL);\n  310 | \n  311 | \tif (offset != NULL)\n  312 | \t\thelper.offset = *offset;\n  313 | \titem = fu_cbor_parse_item(&helper, 0, error);\n  314 | \tif (item == NULL) {\n  315 | \t\tg_prefix_error(error, \"CBOR parsing failed @0x%x: \", (guint)helper.offset);\n  316 | \t\treturn NULL;\n  317 | \t}\n  318 | \tif (fu_cbor_item_get_kind(item) != FU_CBOR_ITEM_KIND_MAP &&\n  319 | \t    fu_cbor_item_get_kind(item) != FU_CBOR_ITEM_KIND_ARRAY) {\n  320 | \t\tg_set_error(error,\n  321 | \t\t\t    FWUPD_ERROR,\n  322 | \t\t\t    FWUPD_ERROR_INVALID_DATA,\n  323 | \t\t\t    \"CBOR data must start with array or map, got %s\",\n  324 | \t\t\t    fu_cbor_item_kind_to_string(fu_cbor_item_get_kind(item)));\n  325 | \t\treturn NULL;\n  326 | \t}\n  327 | \n  328 | \t/* success */\n  329 | \tif (offset != NULL)\n  330 | \t\t*offset = helper.offset;\n  331 | \treturn g_steal_pointer(&item);\n  332 | }","lines":41,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-cbor-common.c#L292-L332"}]},
{"id":"OTHER_6","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"`fu_debug_handler_cb()` in `fu-debug.c` only runs log messages through `fu_strpassmask()` (password masking) before printing; it never strips ASCII control/escape characters (e.g. `ESC` `0x1B`) from `message`. When printing to a real console (`self->console` is `TRUE`, i.e. `isatty(stderr)`), the sanitized-for-non-ASCII path is skipped entirely (that `g_str_to_ascii()` call only runs in the `!self->console` \"to file\" branch, and `g_str_to_ascii()` transliterates non-ASCII characters, it does not remove ASCII control bytes such as `ESC` anyway). Any component that logs attacker-influenced text through `g_debug`/`g_info`/`g_warning` (for instance a crafted USB/firmware device string, or a filename from an untrusted archive) can therefore inject terminal escape sequences into an administrator's terminal when `fwupd`/`fwupd --verbose` is run interactively in the foreground.","fix":"Strip or escape non-printable control characters from `message_safe` before printing in every branch, e.g. via a small helper that replaces bytes `< 0x20` (except `\\n`/`\\t`) with a visible placeholder, applied uniformly regardless of `self->console`/`NO_COLOR`:\n\n```c\nmessage_safe = fu_strpassmask(message);\n/* also strip terminal control sequences before this is ever written to stderr */\nfu_string_replace_control_chars(message_safe);\n```","locations":[{"ref":"src/fu-debug.c:121-206","code":"  121 | static void\n  122 | fu_debug_handler_cb(const gchar *log_domain,\n  123 | \t\t    GLogLevelFlags log_level,\n  124 | \t\t    const gchar *message,\n  125 | \t\t    gpointer user_data)\n  126 | {\n  127 | \tFuDebug *self = (FuDebug *)user_data;\n  128 | \tg_autofree gchar *timestamp = NULL;\n  129 | \tg_autofree gchar *message_safe = NULL;\n  130 | \tg_autoptr(GString) domain = NULL;\n  131 | \n  132 | \t/* should ignore */\n  133 | \tif (!fu_debug_filter_cb(self, log_domain, log_level (function(){

// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.

const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;

function loadHash() {

  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));

  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build a [project] header block from embedded PROJECT_INFO, so the exported
// findings.toml is self-contained (doesn't depend on a sibling project-info.toml
// that a second, separately-triggered download could silently fail to save).
// '' when there is no project info at all.
function buildProjectToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = PROJECT_INFO || {};
  if (!Object.keys(pi).length) return '';
  const lines = ['[project]'];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n\n';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return buildProjectToml() + chunks.join('\n\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystacks per finding (cleared on full re-render).
// Two variants: everything (default), and file/folder paths only - for when a
// search term (e.g. a directory name like 'dlls/abc') also happens to appear
// inside description/fix prose and you only want path matches.
const _hay = new Map();
const _hayLoc = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}
function hayLocOf(f) {
  if (!_hayLoc.has(f.id)) {
    _hayLoc.set(f.id, f.locations.map(l => l.ref).join(' ').toLowerCase());
  }
  return _hayLoc.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (S.searchScope === 'locations') {
      if (!hayLocOf(f).includes(q)) return false;
    } else if (!hayOf(f).includes(q) && !st.includes(q)) {
      return false;
    }
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  _hayLoc.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    // Single download (was two) - a second auto-triggered download is commonly
    // blocked by the browser unless the user explicitly allows it, which silently
    // drops project-info.toml. Embedding [project] in findings.toml itself avoids
    // that failure mode entirely.
    downloadText(buildFindingsToml(), 'findings.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});
document.getElementById('search-scope').addEventListener('click', e => {
  S.searchScope = S.searchScope === 'locations' ? 'all' : 'locations';
  e.currentTarget.classList.toggle('active', S.searchScope === 'locations');
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
