{"id":"API_6","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`fu_bnr_dp_firmware_write()` in plugins/bnr-dp/fu-bnr-dp-firmware.c builds the XML header via `xb_builder_node_insert(NULL, \"Firmware\", ..., \"Date\", self->creation_date, \"Rem\", self->comment, NULL)`. Both `self->creation_date` and `self->comment` are explicitly documented as nullable in the `FuBnrDpFirmware` struct comment and are only set when the corresponding `Date`/`Rem` attributes are present in the parsed XML header (`fu_bnr_dp_firmware_header_parse()` passes `NULL` for the error argument on these two optional attributes, leaving the fields `NULL` if absent). If such firmware is later re-serialized with `fu_bnr_dp_firmware_write()` (e.g. via a round-trip / conversion path), `NULL` is passed as an attribute value into the variadic `xb_builder_node_insert()`, which is not the same as omitting the attribute (a `NULL` terminator) and can produce a corrupted/incorrect `Date`/`Rem` attribute in the generated XML.","fix":"Only pass the `Date`/`Rem` key-value pairs when non-`NULL`, e.g. build the node without them first and call `xb_builder_node_set_attr(bn, \"Date\", self->creation_date)` conditionally, mirroring how `self->creation_date`/`self->comment` are treated as optional elsewhere in the file.","locations":[{"ref":"plugins/bnr-dp/fu-bnr-dp-firmware.c:391-395","code":"  391 | \t\t\t\t    \"Date\",\n  392 | \t\t\t\t    self->creation_date,\n  393 | \t\t\t\t    \"Rem\",\n  394 | \t\t\t\t    self->comment,\n  395 | \t\t\t\t    NULL);","lines":5,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/bnr-dp/fu-bnr-dp-firmware.c#L391-L395"},{"ref":"plugins/bnr-dp/fu-bnr-dp-firmware.c:169-170","code":"  169 | \tself->creation_date = fu_bnr_dp_firmware_attribute_parse_string(root, \"Date\", NULL);\n  170 | \tself->comment = fu_bnr_dp_firmware_attribute_parse_string(root, \"Rem\", NULL);","lines":2,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/bnr-dp/fu-bnr-dp-firmware.c#L169-L170"}]},
{"id":"API_7","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"In `fu_devlink_device_flash()` (`plugins/devlink/fu-devlink-device.c`), `g_thread_new(\"devlink-flash-send\", ...)` is used and its result is checked for `NULL` to detect a thread-creation failure. Per the GLib documentation, `g_thread_new()` never returns `NULL` on failure - internally it aborts the process via `g_error()` if the thread cannot be created. The `flash_send_thread == NULL` branch is therefore unreachable dead code, and a genuine thread-creation failure will abort the whole `fwupd` daemon instead of being reported as a recoverable `GError`.","fix":"Use `g_thread_try_new()` instead, which returns `NULL` and sets a `GError` on failure instead of aborting:\n```c\nflash_send_thread = g_thread_try_new(\"devlink-flash-send\",\n                                     fu_devlink_device_flash_send_thread,\n                                     &flash_send_ctx,\n                                     error);\nif (flash_send_thread == NULL) {\n    g_source_remove(watch_id);\n    return FALSE;\n}\n```","locations":[{"ref":"plugins/devlink/fu-devlink-device.c:404-414","code":"  404 | \tflash_send_thread = g_thread_new(\"devlink-flash-send\",\n  405 | \t\t\t\t\t fu_devlink_device_flash_send_thread,\n  406 | \t\t\t\t\t &flash_send_ctx);\n  407 | \tif (flash_send_thread == NULL) {\n  408 | \t\tg_set_error_literal(error,\n  409 | \t\t\t\t    FWUPD_ERROR,\n  410 | \t\t\t\t    FWUPD_ERROR_INTERNAL,\n  411 | \t\t\t\t    \"failed to create flash send thread\");\n  412 | \t\tg_source_remove(watch_id);\n  413 | \t\treturn FALSE;\n  414 | \t}","lines":11,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/devlink/fu-devlink-device.c#L404-L414"}]},
{"id":"API_8","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`fu_jcat_libcrypto_pkcs7_load_crt_from_blob_pem()` and `fu_jcat_libcrypto_pkcs7_load_crt_from_blob_der()` both call `ERR_set_mark()` before parsing so a benign SHA1 warning can later be discarded with `ERR_pop_to_mark()`. However, on the error paths (`BIO_new_mem_buf()` returning `NULL`, or `PEM_read_bio_X509()`/`d2i_X509()` failing) the functions call `fu_jcat_libcrypto_get_errors()` and `return NULL` directly without ever calling `ERR_pop_to_mark()`. The mark pushed by `ERR_set_mark()` is left on the OpenSSL thread-local error queue and is never explicitly removed on these failure paths, unlike the success path which does pop it.","fix":"Call `ERR_pop_to_mark()` on the error paths too (or restructure with a single exit point that always pops the mark before returning), e.g. add `ERR_pop_to_mark();` immediately before each `return NULL;` that follows `ERR_set_mark()` in both functions.","locations":[{"ref":"src/fu-jcat-libcrypto-common.c:61-88","code":"   61 | \tERR_set_mark();\n   62 | \n   63 | \tbio_blob = BIO_new_mem_buf(g_bytes_get_data(blob, NULL), (int)blob_size);\n   64 | \tif (bio_blob == NULL) {\n   65 | \t\tg_autofree gchar *error_str = fu_jcat_libcrypto_get_errors();\n   66 | \t\tg_set_error(error,\n   67 | \t\t\t    FWUPD_ERROR,\n   68 | \t\t\t    FWUPD_ERROR_INVALID_DATA,\n   69 | \t\t\t    \"failed to create buffer for cert PEM data: %s\",\n   70 | \t\t\t    error_str);\n   71 | \t\treturn NULL;\n   72 | \t}\n   73 | \n   74 | \t/* decode the certificate */\n   75 | \tif (!PEM_read_bio_X509(bio_blob, &crt, NULL, NULL)) {\n   76 | \t\tg_autofree gchar *error_str = fu_jcat_libcrypto_get_errors();\n   77 | \t\tg_set_error(error,\n   78 | \t\t\t    FWUPD_ERROR,\n   79 | \t\t\t    FWUPD_ERROR_INVALID_DATA,\n   80 | \t\t\t    \"failed to parse certificate from PEM buffer: %s\",\n   81 | \t\t\t    error_str);\n   82 | \t\treturn NULL;\n   83 | \t}\n   84 | \n   85 | \tERR_pop_to_mark();\n   86 | \n   87 | \treturn g_steal_pointer(&crt);\n   88 | }","lines":28,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/src/fu-jcat-libcrypto-common.c#L61-L88"},{"ref":"src/fu-jcat-libcrypto-common.c:107-123","code":"  107 | \tERR_set_mark();\n  108 | \n  109 | \t/* decode the certificate */\n  110 | \tif (!d2i_X509(&crt, &blob_data, (long)blob_size)) {\n  111 | \t\tg_autofree gchar *error_str = fu_jcat_libcrypto_get_errors();\n  112 | \t\tg_set_error(error,\n  113 | \t\t\t    FWUPD_ERROR,\n  114 | \t\t\t    FWUPD_ERROR_INVALID_DATA,\n  115 | \t\t\t    \"failed to parse certificate from DER buffer: %s\",\n  116 | \t\t\t    error_str);\n  117 | \t\treturn NULL;\n  118 | \t}\n  119 | \n  120 | \tERR_pop_to_mark();\n  121 | \n  122 | \treturn g_steal_pointer(&crt);\n  123 | }","lines":17,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/src/fu-jcat-libcrypto-common.c#L107-L123"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`fu_csv_firmware_parse_token_cb()` (used to parse the `#`-prefixed header row of an untrusted CSV firmware) calls `fu_csv_firmware_add_column_id()` for every comma-separated token with no upper bound on the number of columns. By contrast, `fu_csv_entry_parse_token_cb()` in `fu-csv-entry.c` explicitly caps per-row columns at `FU_CSV_ENTRY_COLUMNS_MAX` (1000). Since `fu_csv_firmware_class_init()` only bounds the *overall* file size to `16 * FU_MB` (`fu_firmware_set_size_max`), a malicious `.csv` firmware whose header line is 16MB of consecutive commas would insert on the order of 8 million entries into `priv->column_ids`, each a separate heap allocation (`g_strdup`) plus `GPtrArray` bookkeeping -- a large memory-amplification/DoS vector when parsing untrusted firmware metadata, unlike the already-capped per-row entry values.","fix":"Apply the same column-count cap used in `fu-csv-entry.c` to the header parser:\n```c\nstatic gboolean\nfu_csv_firmware_parse_token_cb(GString *token, guint token_idx, gpointer user_data, GError **error)\n{\n\tFuCsvFirmware *self = FU_CSV_FIRMWARE(user_data);\n\tif (token_idx > FU_CSV_ENTRY_COLUMNS_MAX) {\n\t\tg_set_error_literal(error, FWUPD_ERROR, FWUPD_ERROR_INVALID_DATA,\n\t\t\t\t    \"too many columns in header\");\n\t\treturn FALSE;\n\t}\n\tfu_csv_firmware_add_column_id(self, token->str);\n\treturn TRUE;\n}\n```","locations":[{"ref":"libfwupdplugin/fu-csv-firmware.c:139-145","code":"  139 | static gboolean\n  140 | fu_csv_firmware_parse_token_cb(GString *token, guint token_idx, gpointer user_data, GError **error)\n  141 | {\n  142 | \tFuCsvFirmware *self = FU_CSV_FIRMWARE(user_data);\n  143 | \tfu_csv_firmware_add_column_id(self, token->str);\n  144 | \treturn TRUE;\n  145 | }","lines":7,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-csv-firmware.c#L139-L145"},{"ref":"libfwupdplugin/fu-csv-firmware.c:48-55","code":"   48 | void\n   49 | fu_csv_firmware_add_column_id(FuCsvFirmware *self, const gchar *column_id)\n   50 | {\n   51 | \tFuCsvFirmwarePrivate *priv = GET_PRIVATE(self);\n   52 | \tg_return_if_fail(FU_IS_CSV_FIRMWARE(self));\n   53 | \tg_return_if_fail(column_id != NULL);\n   54 | \tg_ptr_array_add(priv->column_ids, g_strdup(column_id));\n   55 | }","lines":8,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-csv-firmware.c#L48-L55"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"Firmware checksum verification in the goodix-tp parsers reads the buffer one element (byte or 16-bit word) at a time through bounds-checked accessor calls inside a loop, instead of validating bounds once and then summing directly over a local pointer/buffer. For example `fu_goodixtp_brlb_firmware_parse_config()` calls `fu_input_stream_read_u8()` once per byte from `offset+6` to `streamsz`, `fu_goodixtp_brlb_firmware_parse()` calls `fu_input_stream_read_u16()` once per 2 bytes up to `firmware_size` (firmware images can be up to `4 * FU_MB` per `fu_firmware_set_size_max()`), and `fu_goodixtp_gtx8_firmware_parse()` does the same with `fu_memread_uint8_safe()` per byte over `firmware_size` bytes. Each call carries stream/bounds-check overhead, so checksumming a multi-megabyte firmware image this way is far slower than reading the region once into memory (e.g. via `fu_input_stream_read_bytes()` / `g_bytes_get_data()`, already done elsewhere in the same files) and computing the checksum in a tight local loop.","fix":"Read the relevant region into a local buffer once (e.g. with `fu_input_stream_read_bytes()` as already done for the whole file in `fu_goodixtp_gtx8_firmware_parse()`), then iterate over the local `guint8 *`/`GBytes` data directly to compute the checksum, avoiding a bounds-checked function call per byte/word.","locations":[{"ref":"plugins/goodix-tp/fu-goodixtp-brlb-firmware.c:47-52","code":"   47 | \tfor (guint i = offset + 6; i < streamsz; i++) {\n   48 | \t\tguint8 tmp_val = 0;\n   49 | \t\tif (!fu_input_stream_read_u8(stream, i, &tmp_val, error))\n   50 | \t\t\treturn FALSE;\n   51 | \t\tcfg_checksum += tmp_val;\n   52 | \t}","lines":6,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/goodix-tp/fu-goodixtp-brlb-firmware.c#L47-L52"},{"ref":"plugins/goodix-tp/fu-goodixtp-brlb-firmware.c:136-141","code":"  136 | \tfor (guint i = 8; i < firmware_size; i += 2) {\n  137 | \t\tguint16 tmp_val = 0;\n  138 | \t\tif (!fu_input_stream_read_u16(stream, i, &tmp_val, G_LITTLE_ENDIAN, error))\n  139 | \t\t\treturn FALSE;\n  140 | \t\tchecksum += tmp_val;\n  141 | \t}","lines":6,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/goodix-tp/fu-goodixtp-brlb-firmware.c#L136-L141"},{"ref":"plugins/goodix-tp/fu-goodixtp-gtx8-firmware.c:69-74","code":"   69 | \tfor (guint i = 6; i < (guint)firmware_size + 6; i++) {\n   70 | \t\tguint8 tmp_val = 0;\n   71 | \t\tif (!fu_memread_uint8_safe(buf, bufsz, i, &tmp_val, error))\n   72 | \t\t\treturn FALSE;\n   73 | \t\tchecksum += tmp_val;\n   74 | \t}","lines":6,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/goodix-tp/fu-goodixtp-gtx8-firmware.c#L69-L74"},{"ref":"plugins/goodix-tp/fu-goodixtp-gtx8-firmware.c:106-111","code":"  106 | \t\tfor (guint i = firmware_size + 12; i < (guint)bufsz; i++) {\n  107 | \t\t\tguint8 tmp_val;\n  108 | \t\t\tif (!fu_memread_uint8_safe(buf, bufsz, i, &tmp_val, error))\n  109 | \t\t\t\treturn FALSE;\n  110 | \t\t\tchecksum += tmp_val;\n  111 | \t\t}","lines":6,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/goodix-tp/fu-goodixtp-gtx8-firmware.c#L106-L111"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In `fu_jcat_gnutls_pkcs7_engine_verify()`, when `crt == NULL` (the normal firmware-verification path via `fu_jcat_gnutls_pkcs7_engine_pubkey_verify()`), the `for (gint i = 0; i < count; i++)` loop calls `fu_jcat_gnutls_pkcs7_engine_build_trust_list()` (or `..._build_trust_list_only_pq()`) and `fu_jcat_gnutls_ensure_trust_list_valid()` again on every single loop iteration, i.e. once per PKCS7 signer info. This rebuilds an identical `gnutls_x509_trust_list_t` from the same `self->pubkeys_crts` array `count` times even though the trust list does not change between iterations, wasting CPU and repeated GnuTLS allocations for signatures with more than one signer.","fix":"Hoist the trust-list construction (the `if (crt != NULL) ... else { tl = build_trust_list...; ensure_trust_list_valid...; }` block) out of the `for` loop and build it once before iterating over the `count` signatures, reusing the same `tl` for every `gnutls_pkcs7_verify()` call.","locations":[{"ref":"src/fu-jcat-gnutls-pkcs7-engine.c:203-255","code":"  203 | \tfor (gint i = 0; i < count; i++) {\n  204 | \t\tgnutls_pkcs7_signature_info_st info_tmp = {0x0};\n  205 | \t\tg_autoptr(gnutls_pkcs7_signature_info_st) info = &info_tmp;\n  206 | \t\tgnutls_certificate_verify_flags verify_flags = 0;\n  207 | \t\tg_autofree gchar *dn = NULL;\n  208 | \n  209 | \t\t/* use with care */\n  210 | \t\tif (flags & FU_JCAT_VERIFY_FLAG_DISABLE_TIME_CHECKS) {\n  211 | \t\t\tg_debug(\"WARNING: disabling time checks\");\n  212 | \t\t\tverify_flags |= GNUTLS_VERIFY_DISABLE_TIME_CHECKS;\n  213 | \t\t\tverify_flags |= GNUTLS_VERIFY_DISABLE_TRUSTED_TIME_CHECKS;\n  214 | \t\t}\n  215 | \n  216 | \t\t/* always get issuer */\n  217 | \t\trc = gnutls_pkcs7_get_signature_info(pkcs7, i, &info_tmp);\n  218 | \t\tif (!fu_jcat_gnutls_rc_to_error(rc, error)) {\n  219 | \t\t\tg_prefix_error_literal(error, \"failed to get signature info: \");\n  220 | \t\t\treturn NULL;\n  221 | \t\t}\n  222 | \n  223 | \t\t/* verify the data against the detached signature */\n  224 | \t\tif (crt != NULL) {\n  225 | \t\t\trc = gnutls_pkcs7_verify_direct(pkcs7, crt, i, &datum, verify_flags);\n  226 | \t\t} else {\n  227 | \t\t\tg_auto(gnutls_x509_trust_list_t) tl = NULL;\n  228 | \t\t\tif (flags & FU_JCAT_VERIFY_FLAG_ONLY_PQ) {\n  229 | #ifdef HAVE_GNUTLS_PQC\n  230 | \t\t\t\ttl = fu_jcat_gnutls_pkcs7_engine_build_trust_list_only_pq(self,\n  231 | \t\t\t\t\t\t\t\t\t\t\t  error);\n  232 | \t\t\t\tif (tl == NULL)\n  233 | \t\t\t\t\treturn NULL;\n  234 | #else\n  235 | \t\t\t\tg_set_error_literal(error,\n  236 | \t\t\t\t\t\t    FWUPD_ERROR,\n  237 | \t\t\t\t\t\t    FWUPD_ERROR_NOT_SUPPORTED,\n  238 | \t\t\t\t\t\t    \"GnuTLS too old for PQC support\");\n  239 | \t\t\t\treturn NULL;\n  240 | #endif\n  241 | \t\t\t} else {\n  242 | \t\t\t\ttl = fu_jcat_gnutls_pkcs7_engine_build_trust_list(self, error);\n  243 | \t\t\t\tif (tl == NULL)\n  244 | \t\t\t\t\treturn NULL;\n  245 | \t\t\t}\n  246 | \t\t\tif (!fu_jcat_gnutls_ensure_trust_list_valid(tl, error))\n  247 | \t\t\t\treturn NULL;\n  248 | \t\t\trc = gnutls_pkcs7_verify(pkcs7,\n  249 | \t\t\t\t\t\t tl,\n  250 | \t\t\t\t\t\t NULL,\t /* vdata */\n  251 | \t\t\t\t\t\t 0,\t /* vdata_size */\n  252 | \t\t\t\t\t\t i,\t /* index */\n  253 | \t\t\t\t\t\t &datum, /* data */\n  254 | \t\t\t\t\t\t verify_flags);\n  255 | \t\t}","lines":53,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/src/fu-jcat-gnutls-pkcs7-engine.c#L203-L255"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`fu_efi_device_path_list_parse` calls `fu_struct_efi_device_path_parse_stream(stream, offset, error)` to peek at the `type`/`subtype` header and decide which `FuEfiDevicePath` subclass to instantiate, then immediately calls `fu_firmware_parse_stream()` on the new object, which internally calls `fu_struct_efi_device_path_parse_stream` again on the same bytes (see `fu_efi_device_path_parse` in `fu-efi-device-path.c`). Every `DEVICE_PATH` entry's fixed header is therefore parsed twice per list, which is wasted work when parsing untrusted/large EFI variable data.","fix":"Consider passing the already-parsed `FuStructEfiDevicePath` (`st_dp`) into the subclass's parse routine, or refactor `fu_efi_device_path_parse` to accept a pre-parsed header, avoiding the duplicate `fu_struct_efi_device_path_parse_stream` call for every entry.","locations":[{"ref":"libfwupdplugin/fu-efi-device-path-list.c:80-116","code":"   80 | \twhile (offset < streamsz) {\n   81 | \t\tg_autoptr(FuEfiDevicePath) efi_dp = NULL;\n   82 | \t\tg_autoptr(FuStructEfiDevicePath) st_dp = NULL;\n   83 | \n   84 | \t\t/* parse the header so we can work out what GType to create */\n   85 | \t\tst_dp = fu_struct_efi_device_path_parse_stream(stream, offset, error);\n   86 | \t\tif (st_dp == NULL)\n   87 | \t\t\treturn FALSE;\n   88 | \t\tif (fu_struct_efi_device_path_get_type(st_dp) == FU_EFI_DEVICE_PATH_TYPE_END)\n   89 | \t\t\tbreak;\n   90 | \t\tif (fu_struct_efi_device_path_get_type(st_dp) == FU_EFI_DEVICE_PATH_TYPE_MEDIA &&\n   91 | \t\t    fu_struct_efi_device_path_get_subtype(st_dp) ==\n   92 | \t\t\tFU_EFI_HARD_DRIVE_DEVICE_PATH_SUBTYPE_FILE_PATH) {\n   93 | \t\t\tefi_dp = FU_EFI_DEVICE_PATH(fu_efi_file_path_device_path_new());\n   94 | \t\t} else if (fu_struct_efi_device_path_get_type(st_dp) ==\n   95 | \t\t\t       FU_EFI_DEVICE_PATH_TYPE_MEDIA &&\n   96 | \t\t\t   fu_struct_efi_device_path_get_subtype(st_dp) ==\n   97 | \t\t\t       FU_EFI_HARD_DRIVE_DEVICE_PATH_SUBTYPE_HARD_DRIVE) {\n   98 | \t\t\tefi_dp = FU_EFI_DEVICE_PATH(fu_efi_hard_drive_device_path_new());\n   99 | \t\t} else {\n  100 | \t\t\tefi_dp = fu_efi_device_path_new();\n  101 | \t\t}\n  102 | \t\tfu_firmware_set_offset(FU_FIRMWARE(efi_dp), offset);\n  103 | \t\tif (!fu_firmware_parse_stream(FU_FIRMWARE(efi_dp), stream, offset, flags, error))\n  104 | \t\t\treturn FALSE;\n  105 | \t\tif (fu_firmware_get_size(FU_FIRMWARE(efi_dp)) == 0) {\n  106 | \t\t\tg_set_error_literal(error,\n  107 | \t\t\t\t\t    FWUPD_ERROR,\n  108 | \t\t\t\t\t    FWUPD_ERROR_INVALID_DATA,\n  109 | \t\t\t\t\t    \"DP section had zero size\");\n  110 | \t\t\treturn FALSE;\n  111 | \t\t}\n  112 | \t\tif (!fu_firmware_add_image(firmware, FU_FIRMWARE(efi_dp), error))\n  113 | \t\t\treturn FALSE;\n  114 | \t\tif (!fu_size_checked_inc(&offset, fu_firmware_get_size(FU_FIRMWARE(efi_dp)), error))\n  115 | \t\t\treturn FALSE;\n  116 | \t}","lines":37,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-efi-device-path-list.c#L80-L116"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"In `contrib/ci/check-cli-actions.py`, `subprocess.run` is called without `check=True`, so it can never raise `subprocess.CalledProcessError`; the surrounding `except (FileNotFoundError, subprocess.CalledProcessError): sys.exit(0)` therefore has an unreachable branch for `CalledProcessError`. If `fwupdmgr get-actions --force` actually fails, the script proceeds to use `pr.stdout` (which may be empty or partial) as if it succeeded, rather than being treated as \"assume everything is okay\" the way a real failure-to-run case is.","fix":"Add `check=True` so the existing except clause is actually exercised on failure:\n```python\n# before\n        pr = subprocess.run(\n            [\"venv/build/src/fwupdmgr\", \"get-actions\", \"--force\"],\n            cwd=\".\",\n            stdout=subprocess.PIPE,\n            encoding=\"utf-8\",\n        )\n\n# after\n        pr = subprocess.run(\n            [\"venv/build/src/fwupdmgr\", \"get-actions\", \"--force\"],\n            cwd=\".\",\n            stdout=subprocess.PIPE,\n            encoding=\"utf-8\",\n            check=True,\n        )\n```","locations":[{"ref":"contrib/ci/check-cli-actions.py:25-34","code":"   25 |     try:\n   26 |         pr = subprocess.run(\n   27 |             [\"venv/build/src/fwupdmgr\", \"get-actions\", \"--force\"],\n   28 |             cwd=\".\",\n   29 |             # stderr=subprocess.PIPE,\n   30 |             stdout=subprocess.PIPE,\n   31 |             encoding=\"utf-8\",\n   32 |         )\n   33 |     except (FileNotFoundError, subprocess.CalledProcessError):\n   34 |         sys.exit(0)","lines":10,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/contrib/ci/check-cli-actions.py#L25-L34"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"In the `key_values[]` migration table inside `fu_config_migrate_keyfile()`, the entry `{\"fwupd\", \"IgnorePower\", NULL}` is listed twice (once directly after `IdleTimeout` and again a few lines later). The second occurrence is a byte-for-byte duplicate of the first, so it is processed twice for no effect - almost certainly a copy-paste artifact left over from editing the migration list.","fix":"Delete the duplicate line:\n\n```c\n{\"fwupd\", \"IgnorePower\", NULL},\n...\n{\"fwupd\", \"RequireImmutableEnumeration\", NULL},\n```\n\ni.e. remove the second `{\"fwupd\", \"IgnorePower\", NULL},` entry at line 192.","locations":[{"ref":"libfwupdplugin/fu-config.c:185-192","code":"  185 | \t\t\t  {\"fwupd\", \"IgnorePower\", NULL},\n  186 | \t\t\t  {\"fwupd\", \"ShowDevicePrivate\", NULL},\n  187 | \t\t\t  {\"fwupd\", \"TrustedUids\", NULL},\n  188 | \t\t\t  {\"fwupd\", \"UpdateMotd\", NULL},\n  189 | \t\t\t  {\"fwupd\", \"UriSchemes\", NULL},\n  190 | \t\t\t  {\"fwupd\", \"VerboseDomains\", NULL},\n  191 | \t\t\t  {\"fwupd\", \"OnlyTrusted\", NULL},\n  192 | \t\t\t  {\"fwupd\", \"IgnorePower\", NULL},","lines":8,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-config.c#L185-L192"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In `fu_device_event_add_json()`, the branch `else if (blob->gtype == G_TYPE_BYTES || blob->gtype == G_TYPE_STRING)` is partly unreachable: no code in `fu-device-event.c` ever creates a `FuDeviceEventBlob` with `gtype == G_TYPE_BYTES`. `fu_device_event_set_bytes()` and `fu_device_event_set_byte_array()` both base64-encode their input and store it with `G_TYPE_STRING` (see `fu_device_event_blob_new(G_TYPE_STRING, key, fu_base64_encode(...), g_free)`), and the JSON deserializer (`fu_device_event_from_json()`) only ever constructs blobs with `G_TYPE_STRING` or `G_TYPE_INT`. The `G_TYPE_BYTES` check is therefore dead and misleading, suggesting a blob-type variant that does not actually exist in this file.","fix":"Remove the `blob->gtype == G_TYPE_BYTES` alternative from the condition (leaving just `blob->gtype == G_TYPE_STRING`), or add an explicit comment stating that blob storage always encodes binary data as base64 `G_TYPE_STRING` so no `G_TYPE_BYTES` case can occur.","locations":[{"ref":"libfwupdplugin/fu-device-event.c:499-511","code":"  499 | \tfor (guint i = 0; i < self->values->len; i++) {\n  500 | \t\tFuDeviceEventBlob *blob = g_ptr_array_index(self->values, i);\n  501 | \t\tif (blob->gtype == G_TYPE_INT) {\n  502 | \t\t\tfwupd_json_object_add_integer(json_obj, blob->key, *((gint64 *)blob->data));\n  503 | \t\t} else if (blob->gtype == G_TYPE_BYTES || blob->gtype == G_TYPE_STRING) {\n  504 | \t\t\tfwupd_json_object_add_string(json_obj,\n  505 | \t\t\t\t\t\t     blob->key,\n  506 | \t\t\t\t\t\t     (const gchar *)blob->data);\n  507 | \t\t} else {\n  508 | \t\t\tg_warning(\"invalid GType %s, ignoring\", g_type_name(blob->gtype));\n  509 | \t\t}\n  510 | \t}\n  511 | }","lines":13,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-device-event.c#L499-L511"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"In `fu_efi_variable_authentication2_parse()` the local `gboolean offset_tmp = 0;` is declared with the wrong type (should be a size/offset type, not `gboolean`) and is never assigned anywhere in the function; it is only ever read once, as `offset + st_wincert->buf->len + offset_tmp`, where it always contributes `0`. This is vestigial/leftover code from a refactor and serves no purpose, and its `gboolean` type is misleading for what looks like it was meant to be an offset accumulator.","fix":"Remove the unused `offset_tmp` variable entirely and simplify the expression:\n```c\n/* before */\ngboolean offset_tmp = 0;\n...\nbuf = fu_input_stream_read_byte_array(\n    stream,\n    offset + st_wincert->buf->len + offset_tmp,\n    ...);\n\n/* after */\nbuf = fu_input_stream_read_byte_array(\n    stream,\n    offset + st_wincert->buf->len,\n    ...);\n```","locations":[{"ref":"libfwupdplugin/fu-efi-variable-authentication2.c:185","code":"  185 | \tgboolean offset_tmp = 0;","lines":1,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-efi-variable-authentication2.c#L185"},{"ref":"libfwupdplugin/fu-efi-variable-authentication2.c:197","code":"  197 | \t\t    offset + st_wincert->buf->len + offset_tmp,","lines":1,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-efi-variable-authentication2.c#L197"}]},
{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"`fu_ccgx_hpi_device_app_read_intr_reg` (`plugins/ccgx/fu-ccgx-hpi-device.c:661-699`) iterates `i` over the possible sections but, on line 685, calls `fu_ccgx_hpi_device_read_event_reg(self, section, &event_array[i], error)` using the outer filter argument `section` instead of the loop index `i`. When called with `section == FU_CCGX_HPI_REG_SECTION_ALL` (as done at line 775 in `fu_ccgx_hpi_device_clear_all_events` when `io_timeout == 0`), every iteration reads using section `ALL` instead of the per-index section, so the `i == FU_CCGX_HPI_REG_SECTION_DEV` case is read via the wrong (non-DEV) register-address branch inside `fu_ccgx_hpi_device_read_event_reg`. This path is currently unreachable in practice because every caller in this file passes a non-zero `io_timeout`, but it is a latent bug if that code path is ever exercised.","fix":"Pass the loop index, not the filter argument: `fu_ccgx_hpi_device_read_event_reg(self, i, &event_array[i], error)`.","locations":[{"ref":"plugins/ccgx/fu-ccgx-hpi-device.c:674-679","code":"  674 | \t\t\t\tif (!fu_ccgx_hpi_device_read_event_reg(self,\n  675 | \t\t\t\t\t\t\t\t       section,\n  676 | \t\t\t\t\t\t\t\t       &event_array[i],\n  677 | \t\t\t\t\t\t\t\t       error)) {\n  678 | \t\t\t\t\tg_prefix_error_literal(error, \"read event error: \");\n  679 | \t\t\t\t\treturn FALSE;","lines":6,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/ccgx/fu-ccgx-hpi-device.c#L674-L679"},{"ref":"plugins/ccgx/fu-ccgx-hpi-device.c:762-769","code":"  762 | \tFuCcgxHpiEvent event_array[FU_CCGX_HPI_REG_SECTION_ALL + 1] = {0x0};\n  763 | \tif (io_timeout == 0) {\n  764 | \t\treturn fu_ccgx_hpi_device_app_read_intr_reg(self,\n  765 | \t\t\t\t\t\t\t    FU_CCGX_HPI_REG_SECTION_ALL,\n  766 | \t\t\t\t\t\t\t    event_array,\n  767 | \t\t\t\t\t\t\t    NULL,\n  768 | \t\t\t\t\t\t\t    error);\n  769 | \t}","lines":8,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/ccgx/fu-ccgx-hpi-device.c#L762-L769"}]},
{"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"In `fu_dell_dock_ec_write_firmware` (`plugins/dell-dock/fu-dell-dock-ec.c`), the expression `guint32 address = 0 | 0xff << 24;` includes a no-op `0 |` that adds nothing and only obscures the intent (setting the top byte to `0xff`).","fix":"Simplify to:\n```c\nguint32 address = 0xff << 24;\n```\nor better, use an explicit named constant to document the meaning of `0xff000000`.","locations":[{"ref":"plugins/dell-dock/fu-dell-dock-ec.c:772","code":"  772 | \tguint32 address = 0 | 0xff << 24;","lines":1,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/dell-dock/fu-dell-dock-ec.c#L772"}]},
{"id":"DEAD_7","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`fu_devlink_backend_create_pci_parent()` and `fu_devlink_backend_create_netdevsim_parent()` in `plugins/devlink/fu-devlink-backend.c` both accept a `bus_name` parameter that is never used in the function body (only `dev_name` is used to build the sysfs path / physical id). The comment on the PCI helper (`/* construct PCI sysfs path from bus_name (e.g., \"pci/0000:01:00.0\") */`) is also misleading since the path is actually built from `dev_name`, not `bus_name`.","fix":"Either drop the unused `bus_name` parameter from both static helpers, or use it consistently (e.g. to validate/log the bus alongside `dev_name`), and correct the comment to reference `dev_name`.","locations":[{"ref":"plugins/devlink/fu-devlink-backend.c:18-23","code":"   18 | static FuDevice *\n   19 | fu_devlink_backend_create_pci_parent(FuDevlinkBackend *self,\n   20 | \t\t\t\t     const gchar *bus_name,\n   21 | \t\t\t\t     const gchar *dev_name,\n   22 | \t\t\t\t     GError **error)\n   23 | {","lines":6,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/devlink/fu-devlink-backend.c#L18-L23"},{"ref":"plugins/devlink/fu-devlink-backend.c:153-158","code":"  153 | static FuDevice *\n  154 | fu_devlink_backend_create_netdevsim_parent(FuDevlinkBackend *self,\n  155 | \t\t\t\t\t   const gchar *bus_name,\n  156 | \t\t\t\t\t   const gchar *dev_name,\n  157 | \t\t\t\t\t   GError **error)\n  158 | {","lines":6,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/devlink/fu-devlink-backend.c#L153-L158"}]},
{"id":"DEAD_8","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"In `fu_ebitdo_firmware_parse()` (`plugins/ebitdo/fu-ebitdo-firmware.c`), `streamsz` is declared and populated via `fu_input_stream_size(stream, &streamsz, error)` but is never read afterwards; the declared-length sanity check the variable name implies (comparing the header's `destination_len` against the real stream size) is never performed in this function. The actual bounds enforcement happens implicitly inside `fu_partial_input_stream_new()`, but the unused local variable is misleading dead code that suggests a validation step was dropped.","fix":"Either remove the unused `streamsz`/`fu_input_stream_size()` call, or use it for an explicit, clearer error message, e.g. ```c if (st->buf->len + fu_struct_ebitdo_hdr_get_destination_len(st) > streamsz) { g_set_error(error, FWUPD_ERROR, FWUPD_ERROR_INVALID_DATA, \"declared payload larger than file\"); return FALSE; }```","locations":[{"ref":"plugins/ebitdo/fu-ebitdo-firmware.c:25","code":"   25 | \tgsize streamsz = 0;","lines":1,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/ebitdo/fu-ebitdo-firmware.c#L25"},{"ref":"plugins/ebitdo/fu-ebitdo-firmware.c:36-37","code":"   36 | \tif (!fu_input_stream_size(stream, &streamsz, error))\n   37 | \t\treturn FALSE;","lines":2,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/ebitdo/fu-ebitdo-firmware.c#L36-L37"}]},
{"id":"DEAD_9","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"In `fu-dbus-daemon.c`, the `FuMainAuthHelper` struct has a `gint32 handle` field (declared at `fu-dbus-daemon.c:279`) that is set in `fu_dbus_daemon_method_emulation_load()` and `fu_dbus_daemon_method_emulation_save()` (`helper->handle = fd_handle;`) but is never read anywhere else in the file. Both `fu_dbus_daemon_authorize_emulation_load_cb()` and `fu_dbus_daemon_authorize_emulation_save_cb()` instead re-derive the file descriptor directly from `helper->invocation`'s `GUnixFDList` via `fu_dbus_daemon_invocation_get_input_stream()` / `fu_dbus_daemon_invocation_get_output_stream()`, which always uses fd-list index `0`. This works only because the code separately enforces \"exactly one fd\" in those helpers, so the unused `handle` field is silently redundant and stores a value the daemon parsed from the client but never actually uses to select the descriptor.","fix":"Either remove the dead field and its two assignments, or actually use it. Minimal removal:\n\n```c\n// before\n\tgint32 handle;\n\n// after\n\t/* field removed - never read; fd is always taken from index 0 of the invocation's fd list */\n```\n\nand drop the two `helper->handle = fd_handle;` lines (and the now-unused local `fd_handle` variables) in `fu_dbus_daemon_method_emulation_load()` / `fu_dbus_daemon_method_emulation_save()`.","locations":[{"ref":"src/fu-dbus-daemon.c:277","code":"  277 | \tgint32 handle;","lines":1,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/src/fu-dbus-daemon.c#L277"},{"ref":"src/fu-dbus-daemon.c:1546-1556","code":" 1546 | \tgint32 fd_handle = 0;\n 1547 | \tg_autoptr(FuMainAuthHelper) helper = NULL;\n 1548 | \n 1549 | \tg_variant_get(parameters, \"(h)\", &fd_handle);\n 1550 | \n 1551 | \tfu_daemon_set_status(FU_DAEMON(self), FWUPD_STATUS_WAITING_FOR_AUTH);\n 1552 | \thelper = g_new0(FuMainAuthHelper, 1);\n 1553 | \thelper->self = self;\n 1554 | \thelper->request = g_object_ref(request);\n 1555 | \thelper->invocation = g_object_ref(invocation);\n 1556 | \thelper->handle = fd_handle;","lines":11,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/src/fu-dbus-daemon.c#L1546-L1556"},{"ref":"src/fu-dbus-daemon.c:1546-1556","code":" 1546 | \tgint32 fd_handle = 0;\n 1547 | \tg_autoptr(FuMainAuthHelper) helper = NULL;\n 1548 | \n 1549 | \tg_variant_get(parameters, \"(h)\", &fd_handle);\n 1550 | \n 1551 | \tfu_daemon_set_status(FU_DAEMON(self), FWUPD_STATUS_WAITING_FOR_AUTH);\n 1552 | \thelper = g_new0(FuMainAuthHelper, 1);\n 1553 | \thelper->self = self;\n 1554 | \thelper->request = g_object_ref(request);\n 1555 | \thelper->invocation = g_object_ref(invocation);\n 1556 | \thelper->handle = fd_handle;","lines":11,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/src/fu-dbus-daemon.c#L1546-L1556"}]},
{"id":"DEAD_10","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `generate-build/generate-dbus-interface.py`, `tree.text = \"\"` is executed on the `xml.etree.ElementTree.ElementTree` object returned by `ET.parse()`. `ElementTree` objects have no `text` attribute that affects serialization (only `Element` objects do), so this line just creates an unused attribute on the object and has no effect on the output.","fix":"Remove the dead `tree.text = \"\"` statement, or if the intent was to clear the root element's text, use `tree.getroot().text = \"\"` instead.","locations":[{"ref":"generate-build/generate-dbus-interface.py:27","code":"   27 |     tree.text = \"\"","lines":1,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/generate-build/generate-dbus-interface.py#L27"}]},
{"id":"DEAD_11","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `fu_bios_settings_set_type()`, the local `gboolean kernel_bug = FALSE;` is only ever read once, in `if (g_strcmp0(data, \"enumeration\") == 0 || kernel_bug)`, and is never assigned anywhere else in the function. The `|| kernel_bug` disjunct is therefore always `FALSE` and dead, leftover from some removed workaround.","fix":"Remove the unused `kernel_bug` variable and the `|| kernel_bug` clause, leaving `if (g_strcmp0(data, \"enumeration\") == 0)`.","locations":[{"ref":"libfwupdplugin/fu-bios-settings.c:210-238","code":"  210 | static gboolean\n  211 | fu_bios_settings_set_type(FuBiosSettings *self, FwupdBiosSetting *attr, GError **error)\n  212 | {\n  213 | \tgboolean kernel_bug = FALSE;\n  214 | \tg_autofree gchar *data = NULL;\n  215 | \tg_autoptr(GError) error_key = NULL;\n  216 | \tg_autoptr(GError) error_local = NULL;\n  217 | \n  218 | \tg_return_val_if_fail(FU_IS_BIOS_SETTINGS(self), FALSE);\n  219 | \tg_return_val_if_fail(FWUPD_IS_BIOS_SETTING(attr), FALSE);\n  220 | \n  221 | \tif (!fu_bios_setting_get_key(attr, \"type\", &data, &error_key)) {\n  222 | \t\tg_debug(\"%s\", error_key->message);\n  223 | \t\tg_propagate_error(error, g_steal_pointer(&error_key));\n  224 | \t\treturn FALSE;\n  225 | \t}\n  226 | \n  227 | \tif (g_strcmp0(data, \"enumeration\") == 0 || kernel_bug) {\n  228 | \t\tif (!fu_bios_setting_set_enumeration_attrs(attr, &error_local))\n  229 | \t\t\tg_debug(\"failed to add enumeration attrs: %s\", error_local->message);\n  230 | \t} else if (g_strcmp0(data, \"integer\") == 0) {\n  231 | \t\tif (!fu_bios_setting_set_integer_attrs(attr, &error_local))\n  232 | \t\t\tg_debug(\"failed to add integer attrs: %s\", error_local->message);\n  233 | \t} else if (g_strcmp0(data, \"string\") == 0) {\n  234 | \t\tif (!fu_bios_setting_set_string_attrs(attr, &error_local))\n  235 | \t\t\tg_debug(\"failed to add string attrs: %s\", error_local->message);\n  236 | \t}\n  237 | \treturn TRUE;\n  238 | }","lines":29,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-bios-settings.c#L210-L238"}]},
{"id":"DEAD_12","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `fu_device_emit_request()`, the request kind is validated with `if (fwupd_request_get_kind(request) >= FWUPD_REQUEST_KIND_LAST) { ...; return FALSE; }` earlier in the function. Later in the same function, `if (fwupd_request_get_kind(request) < FWUPD_REQUEST_KIND_LAST)` is checked again before incrementing `priv->request_cnts[kind]`; by that point the condition is always true (the function would already have returned `FALSE` otherwise), making the second check dead/redundant.","fix":"Remove the redundant second bounds check since `kind < FWUPD_REQUEST_KIND_LAST` is guaranteed once the earlier `>=` check has passed:\n```c\nFwupdRequestKind kind = fwupd_request_get_kind(request);\nif (priv->request_cnts[kind] == G_MAXUINT) {\n\t...\n}\npriv->request_cnts[kind]++;\n```","locations":[{"ref":"libfwupdplugin/fu-device.c:7538-7544","code":" 7538 | \tif (fwupd_request_get_kind(request) >= FWUPD_REQUEST_KIND_LAST) {\n 7539 | \t\tg_set_error_literal(error,\n 7540 | \t\t\t\t    FWUPD_ERROR,\n 7541 | \t\t\t\t    FWUPD_ERROR_NOT_SUPPORTED,\n 7542 | \t\t\t\t    \"invalid request kind\");\n 7543 | \t\treturn FALSE;\n 7544 | \t}","lines":7,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-device.c#L7538-L7544"},{"ref":"libfwupdplugin/fu-device.c:7582-7593","code":" 7582 | \tif (fwupd_request_get_kind(request) < FWUPD_REQUEST_KIND_LAST) {\n 7583 | \t\tFwupdRequestKind kind = fwupd_request_get_kind(request);\n 7584 | \t\tif (priv->request_cnts[kind] == G_MAXUINT) {\n 7585 | \t\t\tg_set_error(error,\n 7586 | \t\t\t\t    FWUPD_ERROR,\n 7587 | \t\t\t\t    FWUPD_ERROR_NOT_SUPPORTED,\n 7588 | \t\t\t\t    \"request counter overflow for kind %u\",\n 7589 | \t\t\t\t    kind);\n 7590 | \t\t\treturn FALSE;\n 7591 | \t\t}\n 7592 | \t\tpriv->request_cnts[kind]++;\n 7593 | \t}","lines":12,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-device.c#L7582-L7593"}]},
{"id":"DEAD_13","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"In `fu_drm_device_probe`, `physical_id` is assigned from `g_path_get_basename(sysfs_path)`, which per GLib documentation always returns a newly allocated, non-`NULL` string. The subsequent `if (physical_id != NULL)` guard is therefore always true and the branch is effectively dead conditional logic.","fix":"Remove the always-true `if (physical_id != NULL)` check (or replace it with a check on `sysfs_path` if the intent was to guard against a `NULL` sysfs path instead).","locations":[{"ref":"libfwupdplugin/fu-drm-device.c:239","code":"  239 | \tg_autofree gchar *physical_id = g_path_get_basename(sysfs_path);","lines":1,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-drm-device.c#L239"},{"ref":"libfwupdplugin/fu-drm-device.c:270-277","code":"  270 | \tif (physical_id != NULL) {\n  271 | \t\tg_auto(GStrv) parts = g_strsplit(physical_id, \"-\", -1);\n  272 | \t\tfor (guint i = 0; parts[i] != NULL; i++) {\n  273 | \t\t\tif (g_strcmp0(parts[i], \"eDP\") == 0)\n  274 | \t\t\t\tfu_device_add_flag(device, FWUPD_DEVICE_FLAG_INTERNAL);\n  275 | \t\t}\n  276 | \t\tfu_device_set_physical_id(device, physical_id);\n  277 | \t}","lines":8,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-drm-device.c#L270-L277"}]},
{"id":"DEAD_14","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"The `TYPE_CODE` macro defined at `plugins/amd-kria/fu-amd-kria-som-eeprom.c:27` (`#define TYPE_CODE(data) data >> 6`) is never used anywhere in `fu_amd_kria_som_eeprom_parse()`; only the sibling `LENGTH` macro is used. Because `TYPE_CODE` never checks the IPMI type/length field's encoding, the manufacturer/product/serial strings are always treated as raw ASCII bytes even though the IPMI FRU spec allows binary, BCD+, 6-bit ASCII, or language-code-dependent encodings, so non-ASCII-encoded fields would be decoded incorrectly (though not unsafely, since `fu_memstrsafe` bounds-checks the read).","fix":"Either remove the unused `TYPE_CODE` macro, or actually use it to branch on the encoding (e.g. reject/convert non-ASCII-encoded fields) before treating the bytes as a plain C string:\n```c\nif (TYPE_CODE(buf[str_offset]) != FU_AMD_KRIA_TYPE_CODE_ACSII6 && ...) {\n\t/* handle or reject other encodings */\n}\n```","locations":[{"ref":"plugins/amd-kria/fu-amd-kria-som-eeprom.c:27","code":"   27 | #define TYPE_CODE(data) data >> 6","lines":1,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/amd-kria/fu-amd-kria-som-eeprom.c#L27"}]},
{"id":"DEAD_15","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `fu_bnr_dp_firmware_parse()` (plugins/bnr-dp/fu-bnr-dp-firmware.c), `guint8 byte = 0;` is read via `fu_input_stream_read_u8(stream, 0, &byte, error)` purely to verify that the stream has at least one byte, but the value of `byte` is never used afterwards. This is confusing dead code; the same bounds check happens implicitly a few lines later via `fu_input_stream_find()`.","fix":"Remove the unused `byte` read, e.g.:\n```c\n/* before */\nguint8 byte = 0;\nif (!fu_input_stream_read_u8(stream, 0, &byte, error))\n    return FALSE;\n\n/* after: just remove it, fu_input_stream_find() below already fails on an empty stream */\n```","locations":[{"ref":"plugins/bnr-dp/fu-bnr-dp-firmware.c:276","code":"  276 | \tguint8 byte = 0;","lines":1,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/bnr-dp/fu-bnr-dp-firmware.c#L276"},{"ref":"plugins/bnr-dp/fu-bnr-dp-firmware.c:284-285","code":"  284 | \tif (!fu_input_stream_read_u8(stream, 0, &byte, error))\n  285 | \t\treturn FALSE;","lines":2,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/bnr-dp/fu-bnr-dp-firmware.c#L284-L285"}]},
{"id":"DEAD_16","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"In `fu_ccgx_hpi_device_init` (`plugins/ccgx/fu-ccgx-hpi-device.c:1645-1680`), `self->inf_num` is unconditionally set to `0x0` a few lines earlier and is never modified anywhere else in the codebase (no quirk key or setter exists for it), so `if (self->inf_num > 0) self->scb_index = 1;` at line 1677 is always false and `scb_index` can never be set to `1` through this path.","fix":"Either remove the dead check, or (if a second SCB/interface really needs to be supported) add a quirk key or constructor parameter that can actually set `inf_num` to a non-zero value before this check runs.","locations":[{"ref":"plugins/ccgx/fu-ccgx-hpi-device.c:1636","code":" 1636 | \tself->inf_num = 0x0;","lines":1,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/ccgx/fu-ccgx-hpi-device.c#L1636"},{"ref":"plugins/ccgx/fu-ccgx-hpi-device.c:1666-1667","code":" 1666 | \tif (self->inf_num > 0)\n 1667 | \t\tself->scb_index = 1;","lines":2,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/ccgx/fu-ccgx-hpi-device.c#L1666-L1667"}]},
{"id":"DEAD_17","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`FuFrameworkQmkDevice` declares a `guint8 iface_reset;` member that is never read or written anywhere in `fu-framework-qmk-device.c` (or any other file in the plugin). It is dead state that adds confusion about whether the device tracks an interface-reset value.","fix":"Remove the unused `iface_reset` field from `struct _FuFrameworkQmkDevice`, or if it was intended to be used (e.g. to store a quirk-provided reset interface number), wire it up in `fu_framework_qmk_device_set_quirk_kv()`/`detach()`.","locations":[{"ref":"plugins/framework-qmk/fu-framework-qmk-device.c:14","code":"   14 | \tguint8 iface_reset;","lines":1,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/framework-qmk/fu-framework-qmk-device.c#L14"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"medium","difficulty":"very_easy","description":"The gtk-doc comment for `fwupd_client_get_plugins_finish` declares `Returns: (element-type FwupdDevice) (transfer container): results`, but the function actually returns an array built by `fwupd_codec_array_from_variant(val, FWUPD_TYPE_PLUGIN, &error)` in `fwupd_client_get_plugins_cb` (`libfwupd/fwupd-client.c:2051`), i.e. a `GPtrArray` of `FwupdPlugin`, not `FwupdDevice`. Because this is a GObject-Introspection `element-type` annotation, language bindings (Python/GJS/Vala) generated from the `.gir` will expose this method as returning an array of the wrong type, which can cause type errors or crashes in binding consumers.","fix":"Change the annotation from\n```c\n * Returns: (element-type FwupdDevice) (transfer container): results\n```\nto\n```c\n * Returns: (element-type FwupdPlugin) (transfer container): results\n```","locations":[{"ref":"libfwupd/fwupd-client.c:2224-2237","code":" 2224 | /**\n 2225 |  * fwupd_client_get_plugins_finish:\n 2226 |  * @self: a #FwupdClient\n 2227 |  * @res: (not nullable): the asynchronous result\n 2228 |  * @error: (nullable): optional return location for an error\n 2229 |  *\n 2230 |  * Gets the result of [method@FwupdClient.get_plugins_async].\n 2231 |  *\n 2232 |  * Returns: (element-type FwupdDevice) (transfer container): results\n 2233 |  *\n 2234 |  * Since: 1.5.0\n 2235 |  **/\n 2236 | GPtrArray *\n 2237 | fwupd_client_get_plugins_finish(FwupdClient *self, GAsyncResult *res, GError **error)","lines":14,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupd/fwupd-client.c#L2224-L2237"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"medium","difficulty":"very_easy","description":"The gtk-doc comment for `fwupd_client_get_devices_by_guid_finish` declares `Returns: (element-type FwupdRelease) (transfer container): results`, but the function returns the `devices` array assembled in `fwupd_client_get_devices_by_guid_cb` (`libfwupd/fwupd-client.c:2332-2368`), which is filtered from `fwupd_client_get_devices_finish` and therefore contains `FwupdDevice` objects, not `FwupdRelease`. As with the sibling issue in `fwupd_client_get_plugins_finish`, this is a GObject-Introspection annotation bug that will produce the wrong element type for language bindings.","fix":"Change the annotation from\n```c\n * Returns: (element-type FwupdRelease) (transfer container): results\n```\nto\n```c\n * Returns: (element-type FwupdDevice) (transfer container): results\n```","locations":[{"ref":"libfwupd/fwupd-client.c:2524-2537","code":" 2524 | /**\n 2525 |  * fwupd_client_get_devices_by_guid_finish:\n 2526 |  * @self: a #FwupdClient\n 2527 |  * @res: (not nullable): the asynchronous result\n 2528 |  * @error: (nullable): optional return location for an error\n 2529 |  *\n 2530 |  * Gets the result of [method@FwupdClient.get_devices_by_guid_async].\n 2531 |  *\n 2532 |  * Returns: (element-type FwupdRelease) (transfer container): results\n 2533 |  *\n 2534 |  * Since: 1.5.0\n 2535 |  **/\n 2536 | GPtrArray *\n 2537 | fwupd_client_get_devices_by_guid_finish(FwupdClient *self, GAsyncResult *res, GError **error)","lines":14,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupd/fwupd-client.c#L2524-L2537"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"Both `fu_device_locker_new()` and `fu_device_locker_new_full()` are documented with \"NOTE: If the @open_func failed then the @close_func will not be called.\" but the implementation of `fu_device_locker_new_full()` does the opposite: on `open_func` failure it always calls `self->close_func(device, &error_local)` (git history shows this call has existed since the earliest version of the file). The comment has been stale/wrong for the whole history of the function and misleads callers writing `close_func` implementations about whether they can assume `open_func` fully succeeded before `close_func` runs.","fix":"Update the docstring to match the real (and apparently intended) behaviour, e.g.:\n```\n * NOTE: If the @open_func fails, @close_func is still called (best-effort) to let the callback\n * clean up any partial state acquired before the failure; any error from @close_func is ignored.\n```","locations":[{"ref":"libfwupdplugin/fu-device-locker.c:97-116","code":"   97 | /**\n   98 |  * fu_device_locker_new:\n   99 |  * @device: a #FuDevice\n  100 |  * @error: (nullable): optional return location for an error\n  101 |  *\n  102 |  * Opens the device for use. When the #FuDeviceLocker is deallocated the device\n  103 |  * will be closed and any error will just be directed to the console.\n  104 |  * This object is typically called using g_autoptr() but the device can also be\n  105 |  * manually closed using g_clear_object().\n  106 |  *\n  107 |  * The functions used for opening and closing the device are set automatically.\n  108 |  *\n  109 |  * NOTE: If the @open_func failed then the @close_func will not be called.\n  110 |  *\n  111 |  * Think of this object as the device ownership.\n  112 |  *\n  113 |  * Returns: a device locker, or %NULL if the @open_func failed.\n  114 |  *\n  115 |  * Since: 1.0.0\n  116 |  **/","lines":20,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-device-locker.c#L97-L116"},{"ref":"libfwupdplugin/fu-device-locker.c:127-178","code":"  127 | /**\n  128 |  * fu_device_locker_new_full:\n  129 |  * @device: a #FuDevice\n  130 |  * @open_func: (scope async): a function to open the device\n  131 |  * @close_func: (scope async): a function to close the device\n  132 |  * @error: (nullable): optional return location for an error\n  133 |  *\n  134 |  * Opens the device for use. When the #FuDeviceLocker is deallocated the device\n  135 |  * will be closed and any error will just be directed to the console.\n  136 |  * This object is typically called using g_autoptr() but the device can also be\n  137 |  * manually closed using g_clear_object().\n  138 |  *\n  139 |  * NOTE: If the @open_func failed then the @close_func will not be called.\n  140 |  *\n  141 |  * Think of this object as the device ownership.\n  142 |  *\n  143 |  * Returns: a device locker, or %NULL if the @open_func failed.\n  144 |  *\n  145 |  * Since: 1.0.0\n  146 |  **/\n  147 | FuDeviceLocker *\n  148 | fu_device_locker_new_full(FuDevice *device,\n  149 | \t\t\t  FuDeviceLockerFunc open_func,\n  150 | \t\t\t  FuDeviceLockerFunc close_func,\n  151 | \t\t\t  GError **error)\n  152 | {\n  153 | \tg_autoptr(FuDeviceLocker) self = NULL;\n  154 | \n  155 | \tg_return_val_if_fail(FU_IS_DEVICE(device), NULL);\n  156 | \tg_return_val_if_fail(open_func != NULL, NULL);\n  157 | \tg_return_val_if_fail(close_func != NULL, NULL);\n  158 | \tg_return_val_if_fail(error == NULL || *error == NULL, NULL);\n  159 | \n  160 | \t/* create object */\n  161 | \tself = g_object_new(FU_TYPE_DEVICE_LOCKER, NULL);\n  162 | \tself->device = g_object_ref(device);\n  163 | \tself->open_func = open_func;\n  164 | \tself->close_func = close_func;\n  165 | \n  166 | \t/* open device */\n  167 | \tif (!self->open_func(device, error)) {\n  168 | \t\tg_autoptr(GError) error_local = NULL;\n  169 | \t\tif (!self->close_func(device, &error_local)) {\n  170 | \t\t\tg_debug(\"ignoring close error on aborted open: %s\", error_local->message);\n  171 | \t\t}\n  172 | \t\treturn NULL;\n  173 | \t}\n  174 | \n  175 | \t/* success */\n  176 | \tself->device_open = TRUE;\n  177 | \treturn g_steal_pointer(&self);\n  178 | }","lines":52,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-device-locker.c#L127-L178"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"`FuStructElanTsI2cAddrCmd` and `FuStructElanTsI2cAddrRsp` in `plugins/elan-ts/fu-elan-ts.rs` still carry leftover template/placeholder comments -- `// Note: Replace with the actual constant name or literal in your .rs` -- even though the literal values (`0x10` and `0x20`) are already filled in. The comments read as an unresolved TODO left over from generating this file, which is misleading for future maintainers who might think the values are still placeholders needing replacement.","fix":"Remove the stale placeholder comments, or replace them with real documentation, e.g.:\n```rust\nstruct FuStructElanTsI2cAddrCmd {\n    addr_7bit: u8 == 0x10, // ELAN_TS_I2C_ADDR_7BIT\n}\n\nstruct FuStructElanTsI2cAddrRsp {\n    addr_8bit: u8 == 0x20, // ELAN_TS_I2C_ADDR\n}\n```","locations":[{"ref":"plugins/elan-ts/fu-elan-ts.rs:183-199","code":"  183 | // I2C Address Handshake Command Structure (1 Byte)\n  184 | #[derive(New, Default)]\n  185 | #[repr(C, packed)]\n  186 | struct FuStructElanTsI2cAddrCmd {\n  187 |     // Automatically initialized to ELAN_TS_I2C_ADDR_7BIT\n  188 |     // Note: Replace with the actual constant name or literal in your .rs\n  189 |     addr_7bit: u8 == 0x10,\n  190 | }\n  191 | \n  192 | // I2C Address Handshake Response Structure (1 Byte)\n  193 | #[derive(ParseBytes, Default)]\n  194 | #[repr(C, packed)]\n  195 | struct FuStructElanTsI2cAddrRsp {\n  196 |     // Automatically validated against ELAN_TS_I2C_ADDR\n  197 |     // Note: Replace with the actual constant name or literal in your .rs\n  198 |     addr_8bit: u8 == 0x20,\n  199 | }","lines":17,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/elan-ts/fu-elan-ts.rs#L183-L199"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The comment above `fu_amd_gpu_atom_firmware_parse_config_filename` in `plugins/amd-gpu/fu-amd-gpu-atom-firmware.c` states `/* this function is called twice, but value only stored once */`, but the function is only ever invoked once, from `fu_amd_gpu_atom_firmware_parse` (line 307). The comment no longer matches the code and misleads future readers into thinking there is a second call site to look for.","fix":"Remove or correct the stale comment, e.g. replace:\n```c\n\t/* this function is called twice, but value only stored once */\n\tif (self->config_filename == NULL)\n\t\tself->config_filename = fu_strstrip(config_filename);\n```\nwith:\n```c\n\tif (self->config_filename == NULL)\n\t\tself->config_filename = fu_strstrip(config_filename);\n```\n(or update the comment if a second call site is genuinely intended to be added later).","locations":[{"ref":"plugins/amd-gpu/fu-amd-gpu-atom-firmware.c:267","code":"  267 | \t/* this function is called twice, but value only stored once */","lines":1,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/amd-gpu/fu-amd-gpu-atom-firmware.c#L267"},{"ref":"plugins/amd-gpu/fu-amd-gpu-atom-firmware.c:307","code":"  307 | \tif (!fu_amd_gpu_atom_firmware_parse_config_filename(self, blob, st_rom, error))","lines":1,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/amd-gpu/fu-amd-gpu-atom-firmware.c#L307"}]},

LAG_IS_BOOTLOADER)) {","lines":18,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/src/fu-engine.c#L2964-L2981"}]},

{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"medium","difficulty":"medium","description":"`contrib/ci/check-meson-install-tags.py` implements the `check` workflow twice: once inside `main()` (parses `-C`/`--working-directory`, runs `meson introspect --install-plan`, calls `check(install_plan)`), and again, near-identically, in the trailing `if __name__ == \"__main__\":` block used under `PRE_COMMIT` (hardcoded `cwd=\"venv/build\"`, re-fetches the install plan, calls `check(install_plan)` again). The two copies can drift independently (e.g. the `PRE_COMMIT` path has no equivalent of the `old_meson_missing_vapi_deps_tag()` special-casing being kept in sync, and any future change to `check()`'s call signature or pre-conditions has to be applied in two places).","fix":"Factor the shared `meson introspect --install-plan` + `check()` sequence into one helper (e.g. `run_check(cwd)`), and call it from both `main()` and the `PRE_COMMIT` branch instead of duplicating the `subprocess.check_output`/`json.loads`/`check()` sequence.","locations":[{"ref":"contrib/ci/check-meson-install-tags.py:96-133","code":"   96 | def main() -> int:\n   97 |     parser = argparse.ArgumentParser(description=\"Meson install tag helper\")\n   98 |     parser.add_argument(\n   99 |         \"-C\", dest=\"working_directory\", default=\".\", help=\"Meson build directory\"\n  100 |     )\n  101 |     parser.add_argument(\n  102 |         \"command\",\n  103 |         choices=[\n  104 |             \"check\",\n  105 |             \"list\",\n  106 |             \"list-files\",\n  107 |             \"list-tags\",\n  108 |         ],\n  109 |     )\n  110 |     parser.add_argument(\"-t\", \"--tag\", help=\"Optional tag for list-files command\")\n  111 | \n  112 |     args = parser.parse_args()\n  113 | \n  114 |     install_plan = json.loads(\n  115 |         subprocess.check_output(\n  116 |             [\"meson\", \"introspect\", \"--install-plan\"],\n  117 |             cwd=args.working_directory,\n  118 |             text=True,\n  119 |         )\n  120 |     )\n  121 | \n  122 |     exit_code = 0\n  123 |     match args.command:\n  124 |         case \"check\":\n  125 |             exit_code = check(install_plan)\n  126 |         case \"list\":\n  127 |             print_all(install_plan)\n  128 |         case \"list-files\":\n  129 |             print_files(install_plan, args.tag)\n  130 |         case \"list-tags\":\n  131 |             print_tags(install_plan)\n  132 | \n  133 |     return exit_code","lines":38,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/contrib/ci/check-meson-install-tags.py#L96-L133"},{"ref":"contrib/ci/check-meson-install-tags.py:137-161","code":"  137 |     logging.basicConfig(\n  138 |         level=logging.INFO, format=\"%(levelname)s: %(message)s\", stream=sys.stderr\n  139 |     )\n  140 | \n  141 |     if \"PRE_COMMIT\" not in os.environ:\n  142 |         sys.exit(main())\n  143 | \n  144 |     if not os.path.exists(\"venv/build\"):\n  145 |         logging.info(\"no configured build directory, skipping check-meson-install-tag\")\n  146 |         sys.exit(0)\n  147 | \n  148 |     install_plan = json.loads(\n  149 |         subprocess.check_output(\n  150 |             [\"meson\", \"introspect\", \"--install-plan\"],\n  151 |             cwd=\"venv/build\",\n  152 |             text=True,\n  153 |         )\n  154 |     )\n  155 | \n  156 |     if len(collect_files(install_plan, None)) > 10:\n  157 |         logging.info(\"build dir is likely outdated, skipping check-meson-install-tag\")\n  158 |         sys.exit(0)\n  159 | \n  160 |     check(install_plan)\n  161 |     sys.exit(0)","lines":25,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/contrib/ci/check-meson-install-tags.py#L137-L161"}]},

{"id":"DUP_3","type":"duplicate_code","type_label":"Duplicate Code","severity":"negligible","difficulty":"medium","description":"`fu_device_set_version()`, `fu_device_set_version_lowest()`, and `fu_device_set_version_highest()` (`libfwupdplugin/fu-device.c:3502-3635`) contain almost identical bodies: sanitize via `FU_DEVICE_PRIVATE_FLAG_ENSURE_SEMVER`, verify format with `fu_version_verify_format()`, log a warning/critical, then set the value if changed. The three copies differ only in which getter/setter pair (`_version`, `_version_lowest`, `_version_highest`) they call, which makes it easy for the three to drift out of sync when one is fixed or extended but the others are not (this is already the case for `fu_device_set_version_bootloader()`, which is subtly different and does not re-check `fu_version_verify_format()`).","fix":"Factor the shared sanitize/verify/log logic into a single static helper, e.g. `static gchar *fu_device_sanitize_version(FuDevice *self, const gchar *version)`, returning the sanitized string, and have all three setters call it before doing their own `fwupd_device_set_version*()` call.","locations":[{"ref":"libfwupdplugin/fu-device.c:3535-3572","code":" 3535 | void\n 3536 | fu_device_set_version(FuDevice *self, const gchar *version)\n 3537 | {\n 3538 | \tg_autofree gchar *version_safe = NULL;\n 3539 | \tg_autoptr(GError) error = NULL;\n 3540 | \n 3541 | \tg_return_if_fail(FU_IS_DEVICE(self));\n 3542 | \n 3543 | \t/* sanitize if required */\n 3544 | \tif (fu_device_has_private_flag(self, FU_DEVICE_PRIVATE_FLAG_ENSURE_SEMVER)) {\n 3545 | \t\tversion_safe =\n 3546 | \t\t    fu_version_ensure_semver(version, fu_device_get_version_format(self));\n 3547 | \t\tif (g_strcmp0(version, version_safe) != 0)\n 3548 | \t\t\tg_debug(\"converted '%s' to '%s'\", version, version_safe);\n 3549 | \t} else {\n 3550 | \t\tversion_safe = g_strdup(version);\n 3551 | \t}\n 3552 | \n 3553 | \t/* print a console warning for an invalid version, if semver */\n 3554 | \tif (version_safe != NULL &&\n 3555 | \t    !fu_version_verify_format(version_safe, fu_device_get_version_format(self), &error))\n 3556 | #ifdef SUPPORTED_BUILD\n 3557 | \t\tg_warning(\"%s\", error->message);\n 3558 | #else\n 3559 | \t\tg_critical(\"%s\", error->message);\n 3560 | #endif\n 3561 | \n 3562 | \t/* if different */\n 3563 | \tif (g_strcmp0(fu_device_get_version(self), version_safe) != 0) {\n 3564 | \t\tif (fu_device_get_version(self) != NULL) {\n 3565 | \t\t\tg_debug(\"changing version for %s: %s->%s\",\n 3566 | \t\t\t\tfu_device_get_id(self),\n 3567 | \t\t\t\tfu_device_get_version(self),\n 3568 | \t\t\t\tversion_safe);\n 3569 | \t\t}\n 3570 | \t\tfwupd_device_set_version(FWUPD_DEVICE(self), version_safe);\n 3571 | \t}\n 3572 | }","lines":38,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-device.c#L3535-L3572"},{"ref":"libfwupdplugin/fu-device.c:3583-3620","code":" 3583 | void\n 3584 | fu_device_set_version_lowest(FuDevice *self, const gchar *version)\n 3585 | {\n 3586 | \tg_autofree gchar *version_safe = NULL;\n 3587 | \tg_autoptr(GError) error = NULL;\n 3588 | \n 3589 | \tg_return_if_fail(FU_IS_DEVICE(self));\n 3590 | \n 3591 | \t/* sanitize if required */\n 3592 | \tif (fu_device_has_private_flag(self, FU_DEVICE_PRIVATE_FLAG_ENSURE_SEMVER)) {\n 3593 | \t\tversion_safe =\n 3594 | \t\t    fu_version_ensure_semver(version, fu_device_get_version_format(self));\n 3595 | \t\tif (g_strcmp0(version, version_safe) != 0)\n 3596 | \t\t\tg_debug(\"converted '%s' to '%s'\", version, version_safe);\n 3597 | \t} else {\n 3598 | \t\tversion_safe = g_strdup(version);\n 3599 | \t}\n 3600 | \n 3601 | \t/* print a console warning for an invalid version, if semver */\n 3602 | \tif (version_safe != NULL &&\n 3603 | \t    !fu_version_verify_format(version_safe, fu_device_get_version_format(self), &error))\n 3604 | #ifdef SUPPORTED_BUILD\n 3605 | \t\tg_warning(\"%s\", error->message);\n 3606 | #else\n 3607 | \t\tg_critic {"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"medium","difficulty":"medium","description":"`fu_acpi_facp_new` in `plugins/acpi-facp/fu-acpi-facp.c` parses the raw ACPI `FACP` table bytes directly (offsets `0x2D` and `0x70`) without ever checking that the loaded blob actually is a `FACP` table (signature bytes at offset 0-3). This is unlike its structural siblings `plugins/acpi-dmar/fu-acpi-dmar.c` (`fu_acpi_dmar_parse`) and `plugins/acpi-ivrs/fu-acpi-ivrs.c` (`fu_acpi_ivrs_parse`), which both derive from `FuAcpiTable` and explicitly verify `fu_firmware_get_id(FU_FIRMWARE(self))` equals `\"DMAR\"`/`\"IVRS\"` after parsing. `FuAcpiFacp` instead derives directly from `GObject` and skips the shared `FuAcpiTable` parsing/validation path entirely, so a truncated, corrupted, or wrong ACPI table placed at the expected `FACP` path would still be silently accepted and have `pm_profile`/`get_s2i` derived from unrelated bytes.","fix":"Make `FuAcpiFacp` derive from `FuAcpiTable` like `FuAcpiDmar`/`FuAcpiIvrs` do, or at minimum validate the 4-byte signature (`\"FACP\"`) and table checksum before trusting the parsed `pm_profile`/`s2i` fields in `fu_acpi_facp_new`.","locations":[{"ref":"plugins/acpi-facp/fu-acpi-facp.c:23-44","code":"   23 | FuAcpiFacp *\n   24 | fu_acpi_facp_new(GBytes *blob, GError **error)\n   25 | {\n   26 | \tFuAcpiFacp *self = g_object_new(FU_TYPE_ACPI_FACP, NULL);\n   27 | \tguint8 pm_profile = 0;\n   28 | \tgsize bufsz = 0;\n   29 | \tguint32 flags = 0;\n   30 | \tconst guint8 *buf = g_bytes_get_data(blob, &bufsz);\n   31 | \n   32 | \t/* parse PM profile (offset 0x2D) */\n   33 | \tif (!fu_memread_uint8_safe(buf, bufsz, 0x2D, &pm_profile, error))\n   34 | \t\treturn NULL;\n   35 | \tself->pm_profile = (FuAcpiFadtPmProfile)pm_profile;\n   36 | \tg_debug(\"pm_profile: 0x%02x\", pm_profile);\n   37 | \n   38 | \t/* parse table */\n   39 | \tif (!fu_memread_uint32_safe(buf, bufsz, 0x70, &flags, G_LITTLE_ENDIAN, error))\n   40 | \t\treturn NULL;\n   41 | \tg_debug(\"flags: 0x%04x\", flags);\n   42 | \tself->get_s2i = (flags & LOW_POWER_S0_IDLE_CAPABLE) > 0;\n   43 | \treturn self;\n   44 | }","lines":22,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/acpi-facp/fu-acpi-facp.c#L23-L44"},{"ref":"plugins/acpi-dmar/fu-acpi-dmar.c:38-46","code":"   38 | \t/* check signature and read flags */\n   39 | \tif (g_strcmp0(fu_firmware_get_id(FU_FIRMWARE(self)), \"DMAR\") != 0) {\n   40 | \t\tg_set_error(error,\n   41 | \t\t\t    FWUPD_ERROR,\n   42 | \t\t\t    FWUPD_ERROR_NOT_SUPPORTED,\n   43 | \t\t\t    \"Not a DMAR table, got %s\",\n   44 | \t\t\t    fu_firmware_get_id(FU_FIRMWARE(self)));\n   45 | \t\treturn FALSE;\n   46 | \t}","lines":9,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/acpi-dmar/fu-acpi-dmar.c#L38-L46"},{"ref":"plugins/acpi-ivrs/fu-acpi-ivrs.c:40-48","code":"   40 | \t/* check signature and read flags */\n   41 | \tif (g_strcmp0(fu_firmware_get_id(FU_FIRMWARE(self)), \"IVRS\") != 0) {\n   42 | \t\tg_set_error(error,\n   43 | \t\t\t    FWUPD_ERROR,\n   44 | \t\t\t    FWUPD_ERROR_NOT_SUPPORTED,\n   45 | \t\t\t    \"Not a IVRS table, got %s\",\n   46 | \t\t\t    fu_firmware_get_id(FU_FIRMWARE(self)));\n   47 | \t\treturn FALSE;\n   48 | \t}","lines":9,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/acpi-ivrs/fu-acpi-ivrs.c#L40-L48"}]},
{"id":"ARCH_2","type":"architecture","type_label":"Architecture","severity":"medium","difficulty":"hard","description":"`fu_engine_requirements_check_firmware` in `src/fu-engine-requirements.c` is a single ~260-line function (lines 330-588) that handles many unrelated requirement sub-kinds (`depth` traversal, plain firmware-version compare, `bootloader` compare, `vendor-id`, `not-child`, and \"other device by GUID\" lookups with four different `depth` semantics: `G_MAXINT64`/no-depth, `-1` child, `0` sibling, and positive/other parent-depth), all dispatched via chained `g_strcmp0()` checks on `xb_node_get_text(req)`/`xb_node_get_attr(req, \"depth\")`. This mixes several distinct responsibilities (parent-chain traversal, several categories of version comparison, and GUID-based device discovery across children/siblings/ancestors) in one function, making it hard to test or extend in isolation, and increasing the risk that a future edit to one requirement kind accidentally affects another via a shared `device_actual`/`depth` variable.","fix":"Split `fu_engine_requirements_check_firmware` into smaller focused helpers per requirement sub-kind, e.g. `fu_engine_requirements_check_firmware_depth()`, `fu_engine_requirements_check_firmware_bootloader()`, `fu_engine_requirements_check_firmware_other_device()` (itself further split by depth semantics), keeping only the top-level dispatch (based on `xb_node_get_text()`/`depth`) in the main function.","locations":[{"ref":"src/fu-engine-requirements.c:330-588","code":"  330 | fu_engine_requirements_check_firmware(FuEngine *self,\n  331 | \t\t\t\t      XbNode *req,\n  332 | \t\t\t\t      FuEngineRequirementsHelper *helper,\n  333 | \t\t\t\t      GError **error)\n  334 | {\n  335 | \tFuDevice *device = fu_release_get_device(helper->release);\n  336 | \tconst gchar *version;\n  337 | \tconst gchar *depth_str;\n  338 | \tgint64 depth = G_MAXINT64;\n  339 | \tg_autoptr(FuDevice) device_actual = g_object_ref(device);\n  340 | \tg_autoptr {"id":"ARCH_3","type":"architecture","type_label":"Architecture","severity":"medium","difficulty":"hard","description":"`fu_engine_install_release` combines many distinct concerns in one function body: stream/feature-flag setup, container checksum computation, device state/problem checks, detach caption/image assignment, backup-remote persistence, history database writes, invoking `fu_engine_install_blob`, error-state mapping back onto `device_orig`, re-fetching the device after install, reboot-required file creation, and acquiesce waiting. This is the central update-installation entry point but reads as a long procedural script rather than composed steps, making it easy to introduce ordering bugs (as seen in the duplicated metadata calls found separately) when it is modified.","fix":"Extract cohesive sub-steps into named helpers (e.g. `fu_engine_install_release_prepare_device`, `fu_engine_install_release_persist_backup`, `fu_engine_install_release_finish_state`) so `fu_engine_install_release` reads as an orchestration of clearly named phases, each independently testable.","locations":[{"ref":"src/fu-engine.c:2910-3079","code":" 2910 | gboolean\n 2911 | fu_engine_install_release(FuEngine *self,\n 2912 | \t\t\t  FuRelease *release,\n 2913 | \t\t\t  FuProgress *progress,\n 2914 | \t\t\t  FwupdInstallFlags flags,\n 2915 | \t\t\t  GError **error)\n 2916 | {\n 2917 | \tFuDevice *device_orig = fu_release_get_device(release);\n 2918 | \tFuEngineRequest *request = fu_release_get_request(release);\n 2919 | \tFuPlugin *plugin;\n 2920 | \tFwupdFeatureFlags feature_flags = FWUPD_FEATURE_FLAG_NONE;\n 2921 | \tFuInputStream *stream = fu_release_get_stream(release);\n 2922 | \tconst gchar *tmp;\n 2923 | \tg_autoptr(FuDevice) device = NULL;\n 2924 | \tg_autoptr(FuDevice) device_tmp = NULL;\n 2925 | \tg_autoptr(GError) error_local = NULL;\n 2926 | \n 2927 | \tg_return_val_if_fail(FU_IS_ENGINE(self), FALSE);\n 2928 | \tg_return_val_if_fail(FU_IS_RELEASE(release), FALSE);\n 2929 | \tg {"id":"ARCH_4","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"`contrib/check-ifd-firmware.py` invokes `fwupdtool firmware-parse --json` but then parses the output with ad-hoc string splitting (`line.split('\"')`, checking `line.find(\"gtype=\")`) rather than using the `json` module it already imports. `sections[1]` is accessed unconditionally after only checking that the substring `\"gtype=\"` is present anywhere on the line, so a line that happens to contain that substring without at least one embedded `\"` character (or with different quoting/escaping) will raise an `IndexError`. Parsing JSON output as text is inherently fragile to formatting or escaping changes in `fwupdtool`'s output.","fix":"Parse the actual JSON structure instead of scanning raw text lines, e.g. `json.loads(p.stdout)` and walk the resulting dict/list to collect `gtype` values, which removes the dependency on exact text formatting and the unguarded `sections[1]` indexing.","locations":[{"ref":"contrib/check-ifd-firmware.py:36-43","code":"   36 |         for line in p.stdout.decode().split(\"\\n\"):\n   37 |             new_map[\"Lines\"] += 1\n   38 |             if line.find(\"gtype=\") == -1:\n   39 |                 continue\n   40 |             sections = line.split('\"')\n   41 |             if not sections[1].startswith(\"Fu\"):\n   42 |                 continue\n   43 |             new_map[sections[1]] += 1","lines":8,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/contrib/check-ifd-firmware.py#L36-L43"}]},
{"id":"ARCH_5","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"hard","description":"`fu_device_set_quirk_kv()` is a single ~270 line function (`libfwupdplugin/fu-device.c:2328-2602`) implemented as a long chain of `if (g_strcmp0(key, FU_QUIRKS_*) == 0) { ...; return TRUE; }` blocks, one per quirk key (over 30 distinct keys handled inline). This makes the function hard to navigate, hard to unit test key-by-key, and encourages further linear growth every time a new quirk key is added, rather than dispatching through a lookup table or per-key handler functions.","fix":"Refactor into a static table mapping quirk key strings to small handler functions/callbacks (e.g. `{ FU_QUIRKS_VERSION, fu_device_quirk_kv_set_version }`), and dispatch via a lookup instead of a long `if`/`g_strcmp0` chain. This keeps each handler small and testable and avoids linear scans through unrelated branches for every quirk lookup.","locations":[{"ref":"libfwupdplugin/fu-device.c:2359-2633","code":" 2359 | gboolean\n 2360 | fu_device_set_quirk_kv(FuDevice *self,\n 2361 | \t\t       const gchar *key,\n 2362 | \t\t       const gchar *value,\n 2363 | \t\t       FuContextQuirkSource source,\n 2364 | \t\t       GError **error)\n 2365 | {\n 2366 | \tFuDevicePrivate *priv = GET_PRIVATE(self);\n 2367 | \tFuDeviceClass *device_class = FU_DEVICE_GET_CLASS(self);\n 2368 | \tguint64 tmp;\n 2369 | \n 2370 | \tg_return_val_if_fail(FU_IS_DEVICE(self), FALSE);\n 2371 | \tg_return_val_if_fail(key != NULL, FALSE);\n 2372 | \tg_return_val_if_fail(value != NULL, FALSE);\n 2373 | \tg_return_val_if_fail(error == NULL || *error == NULL, FALSE);\n 2374 | \n 2375 | \tif (g_strcmp0(key, FU_QUIRKS_PLUGIN) == 0) {\n 2376 | \t\tg_auto(GStrv) sections = g_strsplit(value, \",\", -1);\n 2377 | \t\tfor (guint i = 0; sections[i] != NULL; i++) {\n 2378 | \t\t\tconst gchar *plugin = sections[i];\n 2379 | \t\t\tif (g_str_has_prefix(plugin, \"~\")) {\n 2380 | \t\t\t\tfu_device_remove_possible_plugin(s {"id":"ARCH_6","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"hard","description":"`fu_device_incorporate()` is a single ~235 line function (`libfwupdplugin/fu-device.c:6846-7080`) that handles over 30 different `FU_DEVICE_INCORPORATE_FLAG_*` bits inline, each with its own copy-if-unset logic for a different field (physical ID, vendor, icons, metadata, parent IDs, instance IDs, proxy, etc). The function mixes many unrelated responsibilities in one place, making it difficult to review, extend safely, or reason about which fields interact (e.g. the `FU_DEVICE_INCORPORATE_FLAG_EVENTS` branch has a subtle `donor != priv->proxy` check that is easy to miss among the surrounding unrelated blocks).","fix":"Split each `if (flag & FU_DEVICE_INCORPORATE_FLAG_*)` block out into its own small static helper function (e.g. `fu_device_incorporate_vendor()`, `fu_device_incorporate_icons()`, ...) and have `fu_device_incorporate()` just dispatch to them based on the flag bits, similar to how `fu_device_incorporate_instance_ids()` is already factored out.","locations":[{"ref":"libfwupdplugin/fu-device.c:6845-7079","code":" 6845 | fu_device_incorporate(FuDevice *self, FuDevice *donor, FuDeviceIncorporateFlags flag)\n 6846 | {\n 6847 | \tFuDevicePrivate *priv = GET_PRIVATE(self);\n 6848 | \tFuDevicePrivate *priv_donor = GET_PRIVATE(donor);\n 6849 | \n 6850 | \tg_return_if_fail(FU_IS_DEVICE(self));\n 6851 | \tg_return_if_fail(FU_IS_DEVICE(donor));\n 6852 | \n 6853 | \t/* do these unconditionally */\n 6854 | \tif (priv->ctx == NULL && priv_donor->ctx != NULL)\n 6855 | \t\tfu_device_set_context(self, priv_donor->ctx);\n 6856 | \tif (priv->backend == NULL && priv_donor->backend != NULL)\n 6857 | \t\tfu_device_set_backend(self, priv_donor->backend);\n 6858 | \n 6859 | \t/* bitflags */\n 6860 | \tif (flag & FU_DEVICE_INCORPORATE_FLAG_BASECLASS) {\n 6861 | \t\tfwupd_device_incorporate(FWUPD_DEVICE(self), FWUPD_DEVICE(donor));\n 6862 | \t\tif (fu_device_get_id(s
