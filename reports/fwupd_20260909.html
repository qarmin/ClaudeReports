{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `fu_device_add_child_by_kv()`, when the quirk value has no `|` separator (`g_strv_length(split) == 1`), the code calls `fu_device_add_child_by_type_guid(self, G_OBJECT_TYPE(self), split[1], error)`. Since `split` only has one element in this branch, `split[0]` holds the GUID string and `split[1]` is the `NULL` terminator of the `GStrv`. Passing `NULL` as the `guid` argument means `fu_device_add_instance_id(child, guid)` inside `fu_device_add_child_by_type_guid()` immediately fails its `g_return_if_fail(instance_id != NULL)` check (a `g_critical()` warning) and the child device also gets `logical-id` set to `NULL` instead of the intended GUID. This breaks the documented `FU_QUIRKS_CHILDREN` quirk syntax for the common case of a single GUID with no explicit `GType` prefix (e.g. `Children = SOME-GUID-HERE`).","fix":"Use `split[0]` (the only element) instead of `split[1]` when there is no `|` separator:\n```c\nif (g_strv_length(split) == 1) {\n\treturn fu_device_add_child_by_type_guid(self, G_OBJECT_TYPE(self), split[0], error);\n}\n```","locations":[{"ref":"libfwupdplugin/fu-device.c:2287-2295","code":" 2287 | static gboolean\n 2288 | fu_device_add_child_by_kv(FuDevice *self, const gchar *str, GError **error)\n 2289 | {\n 2290 | \tg_auto(GStrv) split = g_strsplit(str, \"|\", -1);\n 2291 | \n 2292 | \t/* type same as parent */\n 2293 | \tif (g_strv_length(split) == 1) {\n 2294 | \t\treturn fu_device_add_child_by_type_guid(self, G_OBJECT_TYPE(self), split[1], error);\n 2295 | \t}","lines":9,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-device.c#L2287-L2295"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`fu_efi_variable_authentication2_write()` does not round-trip the original `EFI_VARIABLE_AUTHENTICATION_2` payload. It creates a brand-new `FuStructEfiVariableAuthentication2` via `fu_struct_efi_variable_authentication2_new()` (which fills in a default all-zero `FuStructEfiTime` and a default `FuStructEfiWinCertificate` with `length = $struct_size`, i.e. no PKCS#7 payload), and appends only the child `EFI_SIGNATURE_LIST` written by the parent class. The PKCS#7 signed data / certificates that were parsed out in `fu_efi_variable_authentication2_parse()` (stored in `self->signers`, extracted via `fu_efi_variable_authentication2_parse_pkcs7_certs()`) are never written back anywhere. This means parsing a real `KEKUpdate.bin`/`DBXUpdate.bin` file and writing it back out produces a file with a bogus, zeroed timestamp and an empty/invalid `WIN_CERTIFICATE` (the cryptographic signature is silently dropped), which is a significant, silent round-trip data-loss bug for any code path that reads then rewrites this firmware type.","fix":"Either explicitly document that `fu_efi_variable_authentication2_write()` only supports building fresh (unsigned) authentication payloads and is not meant for round-tripping signed data, or store the original raw `FuStructEfiTime` and `FuStructEfiWinCertificate` bytes (including the PKCS#7 blob) parsed in `fu_efi_variable_authentication2_parse()` and reuse them in `fu_efi_variable_authentication2_write()` when no new signature has been supplied, e.g. cache the original header/cert `GByteArray` in the object and `fu_byte_array_append_array()` it instead of always calling `fu_struct_efi_variable_authentication2_new()`.","locations":[{"ref":"libfwupdplugin/fu-efi-variable-authentication2.c:220-236","code":"  220 | static GByteArray *\n  221 | fu_efi_variable_authentication2_write(FuFirmware *firmware, GError **error)\n  222 | {\n  223 | \tg_autoptr(FuStructEfiVariableAuthentication2) st =\n  224 | \t    fu_struct_efi_variable_authentication2_new();\n  225 | \tg_autoptr(GByteArray) buf = NULL;\n  226 | \n  227 | \t/* append EFI_SIGNATURE_LIST */\n  228 | \tbuf =\n  229 | \t    FU_FIRMWARE_CLASS(fu_efi_variable_authentication2_parent_class)->write(firmware, error);\n  230 | \tif (buf == NULL)\n  231 | \t\treturn NULL;\n  232 | \tfu_byte_array_append_array(st->buf, buf);\n  233 | \n  234 | \t/* success */\n  235 | \treturn g_steal_pointer(&st->buf);\n  236 | }","lines":17,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-efi-variable-authentication2.c#L220-L236"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`fu_efi_vss_auth_variable_parse()` advances `offset` by the *declared* `name_size` and `data_size` fields (via `fu_size_checked_inc(&offset, fu_struct_efi_vss_auth_variable_header_get_name_size(st), error)` and the equivalent for `data_size`) rather than by the number of bytes actually returned by `fu_input_stream_read_byte_array()`/`fu_input_stream_read_bytes()`. Both of those read helpers are explicitly documented as possibly returning fewer bytes than requested (\"NOTE: The returned buffer may be smaller than @count!\") when the underlying stream is shorter than expected, and they do not error in that case. If a crafted or truncated VSS store declares a `name_size`/`data_size` larger than what is actually available in the stream, this function will silently accept the short read, then still compute `fu_firmware_set_size(firmware, offset)` using the nominal (not actual) sizes. The reported parsed size of the variable can therefore be larger than the number of bytes actually consumed from the stream, desynchronizing the offset used by the caller (`fu_efi_vss2_variable_store_parse()`) to advance to the next variable.","fix":"After each `fu_input_stream_read_byte_array()`/`fu_input_stream_read_bytes()` call, verify that the returned buffer length matches the requested `name_size`/`data_size` exactly and raise a `FWUPD_ERROR_INVALID_DATA` error otherwise, e.g.:\n```c\nif (g_bytes_get_size(data) != fu_struct_efi_vss_auth_variable_header_get_data_size(st)) {\n    g_set_error_literal(error, FWUPD_ERROR, FWUPD_ERROR_INVALID_DATA, \"truncated VSS variable data\");\n    return FALSE;\n}\n```\nso a truncated/malformed store is rejected instead of silently producing an inconsistent parsed size.","locations":[{"ref":"libfwupdplugin/fu-efi-vss-auth-variable.c:144-201","code":"  144 | \tbuf_name = fu_input_stream_read_byte_array(\n  145 | \t    stream,\n  146 | \t    offset,\n  147 | \t    fu_struct_efi_vss_auth_variable_header_get_name_size(st),\n  148 | \t    NULL,\n  149 | \t    error);\n  150 | \tif (buf_name == NULL)\n  151 | \t\treturn FALSE;\n  152 | \tname = fu_utf16_to_utf8_byte_array(buf_name, G_LITTLE_ENDIAN, error);\n  153 | \tif (name == NULL)\n  154 | \t\treturn FALSE;\n  155 | \tfu_firmware_set_id(firmware, name);\n  156 | \tg_debug(\"added %s: %s\", self->vendor_guid, name);\n  157 | \n  158 | \t/* read data */\n  159 | \tif (!fu_size_checked_inc(&offset,\n  160 | \t\t\t\t fu_struct_efi_vss_auth_variable_header_get_name_size(st),\n  161 | \t\t\t\t error))\n  162 | \t\treturn FALSE;\n  163 | \n  164 | \t/* if this is a well known key then parse it as a child type */\n  165 | \timg_gtype = fu_efi_vss_auth_variable_lookup_image_gtype(self);\n  166 | \tif (img_gtype != G_TYPE_INVALID) {\n  167 | \t\tg_autoptr(FuFirmware) img = g_object_new(img_gtype, NULL);\n  168 | \t\tg_autoptr(FuInputStream) partial_stream = NULL;\n  169 | \t\tpartial_stream = fu_partial_input_stream_new(\n  170 | \t\t    stream,\n  171 | \t\t    offset,\n  172 | \t\t    fu_struct_efi_vss_auth_variable_header_get_data_size(st),\n  173 | \t\t    error);\n  174 | \t\tif (partial_stream == NULL)\n  175 | \t\t\treturn FALSE;\n  176 | \t\tif (!fu_firmware_parse_stream(img, partial_stream, 0x0, flags, error))\n  177 | \t\t\treturn FALSE;\n  178 | \t\tif (!fu_firmware_add_image(firmware, img, error))\n  179 | \t\t\treturn FALSE;\n  180 | \t} else {\n  181 | \t\tg_autoptr(GBytes) data = NULL;\n  182 | \t\tdata = fu_input_stream_read_bytes(\n  183 | \t\t    stream,\n  184 | \t\t    offset,\n  185 | \t\t    fu_struct_efi_vss_auth_variable_header_get_data_size(st),\n  186 | \t\t    NULL,\n  187 | \t\t    error);\n  188 | \t\tif (data == NULL)\n  189 | \t\t\treturn FALSE;\n  190 | \t\tfu_firmware_set_bytes(firmware, data);\n  191 | \t}\n  192 | \n  193 | \t/* next header */\n  194 | \tif (!fu_size_checked_inc(&offset,\n  195 | \t\t\t\t fu_struct_efi_vss_auth_variable_header_get_data_size(st),\n  196 | \t\t\t\t error))\n  197 | \t\treturn FALSE;\n  198 | \n  199 | \t/* success */\n  200 | \tfu_firmware_set_size(firmware, offset);\n  201 | \treturn TRUE;","lines":58,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-efi-vss-auth-variable.c#L144-L201"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`fu_freebsd_efivars_delete_with_glob()` calls `fu_freebsd_efivars_delete()` (which deletes the variable) from inside the same `while (efi_get_next_variable_name(&guidt, &name) == 1)` loop that is enumerating the variable store. Mutating the UEFI variable list while iterating it with `GetNextVariableName`-style APIs is undefined behavior per the UEFI spec (entries can be skipped, the enumeration can restart, or it can misbehave), so subsequent matching variables may not be deleted even though the loop appears to visit every entry.","fix":"Collect all matching `(guid, name)` pairs into a `GPtrArray` first while enumerating, then iterate that array afterwards calling `fu_freebsd_efivars_delete()` on each, so deletion never happens during enumeration.","locations":[{"ref":"libfwupdplugin/fu-freebsd-efivars.c:57-80","code":"   57 | static gboolean\n   58 | fu_freebsd_efivars_delete_with_glob(FuEfivars *efivars,\n   59 | \t\t\t\t    const gchar *guid,\n   60 | \t\t\t\t    const gchar *name_glob,\n   61 | \t\t\t\t    GError **error)\n   62 | {\n   63 | \tefi_guid_t *guidt = NULL;\n   64 | \tgchar *name = NULL;\n   65 | \tgboolean rv = FALSE;\n   66 | \tefi_guid_t guid_to_delete;\n   67 | \n   68 | \tefi_str_to_guid(guid, &guid_to_delete);\n   69 | \n   70 | \twhile (efi_get_next_variable_name(&guidt, &name) == 1) {\n   71 | \t\tif (memcmp(&guid_to_delete, guidt, sizeof(guid_to_delete)) != 0)\n   72 | \t\t\tcontinue;\n   73 | \t\tif (!g_pattern_match_simple(name, name_glob))\n   74 | \t\t\tcontinue;\n   75 | \t\trv = fu_freebsd_efivars_delete(efivars, guid, name, error);\n   76 | \t\tif (!rv)\n   77 | \t\t\tbreak;\n   78 | \t}\n   79 | \treturn rv;\n   80 | }","lines":24,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-freebsd-efivars.c#L57-L80"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `fu_hid_report_item_parse()` (`libfwupdplugin/fu-hid-report-item.c`), the HID \"long item\" branch (`tag == FU_HID_ITEM_TAG_LONG && data_size == 2`) reads the real payload length byte at offset 1 into `data_size`, but per the HID 1.11 spec a long item header is 3 bytes (`0xFE`, `bDataSize`, `bLongItemTag`) before the `bDataSize` payload bytes. The code never reads/accounts for the `bLongItemTag` byte, and `fu_firmware_set_size(firmware, 1 + data_size)` only adds the 1-byte prefix, undercounting the true item length by 2 bytes. Since `fu_hid_descriptor_parse()` advances its cursor with `fu_size_checked_inc(&offset, fu_firmware_get_size(FU_FIRMWARE(item)), error)`, every long item causes the following item to be parsed 2 bytes too early, misinterpreting the `bLongItemTag` byte and the first payload byte as a new report item tag.","fix":"Read and skip the `bLongItemTag` byte, and account for both header bytes in the size, e.g. `fu_firmware_set_size(firmware, 3 + data_size)` for the long-item branch (and read/store the extra tag byte before computing the size).","locations":[{"ref":"libfwupdplugin/fu-hid-report-item.c:74-86","code":"   74 | \tif (tag == FU_HID_ITEM_TAG_LONG && data_size == 2) {\n   75 | \t\tgsize streamsz = 0;\n   76 | \t\tif (!fu_input_stream_size(stream, &streamsz, error))\n   77 | \t\t\treturn FALSE;\n   78 | \t\tif (streamsz < 1) {\n   79 | \t\t\tg_set_error_literal(error,\n   80 | \t\t\t\t\t    FWUPD_ERROR,\n   81 | \t\t\t\t\t    FWUPD_ERROR_INVALID_DATA,\n   82 | \t\t\t\t\t    \"not enough data to read long tag\");\n   83 | \t\t\treturn FALSE;\n   84 | \t\t}\n   85 | \t\tif (!fu_input_stream_read_u8(stream, 1, &data_size, error))\n   86 | \t\t\treturn FALSE;","lines":13,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-hid-report-item.c#L74-L86"},{"ref":"libfwupdplugin/fu-hid-report-item.c:117","code":"  117 | \tfu_firmware_set_size(firmware, 1 + data_size);","lines":1,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-hid-report-item.c#L117"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `plugins/android-boot/fu-android-boot-device.c`, the quirk key `AndroidBootPartitionMaxSize` (handled at `plugins/android-boot/fu-android-boot-device.c:337-344`) sets `self->max_size` directly but never calls `fu_device_set_firmware_size_max()` again. The actual enforced maximum firmware size was already pushed to the device via `fu_device_set_firmware_size_max(device, self->max_size)` in `fu_android_boot_device_probe()` (`plugins/android-boot/fu-android-boot-device.c:82`), which runs *before* quirks are matched (quirks match on GUIDs/instance IDs added later, in `fu_android_boot_device_setup()`). As a result, setting `AndroidBootPartitionMaxSize` in a quirk file has no effect on the value actually used to validate firmware size, even though the README documents it as controlling `Maximum size the firmware may use of a partition`.","fix":"Propagate the quirk value to the device immediately, e.g. call `fu_device_set_firmware_size_max(device, self->max_size)` from within `fu_android_boot_device_set_quirk_kv()` when handling `AndroidBootPartitionMaxSize`:\n```c\nif (g_strcmp0(key, \"AndroidBootPartitionMaxSize\") == 0) {\n\tguint64 size = 0;\n\tif (!fu_strtoull(value, &size, 0, G_MAXUINT32, FU_INTEGER_BASE_AUTO, error))\n\t\treturn FALSE;\n\tself->max_size = size;\n\tfu_device_set_firmware_size_max(device, self->max_size);\n\treturn TRUE;\n}\n```","locations":[{"ref":"plugins/android-boot/fu-android-boot-device.c:75-82","code":"   75 | \tif (!fu_size_checked_inc_product(&self->max_size, sectors, ANDROID_BOOT_SECTOR_SIZE, error))\n   76 | \t\treturn FALSE;\n   77 | \n   78 | \t/* extract serial number and set it */\n   79 | \tfu_device_set_serial(device, g_hash_table_lookup(cmdline, \"androidboot.serialno\"));\n   80 | \n   81 | \t/* set the firmware maximum size based on partition size or from quirk */\n   82 | \tfu_device_set_firmware_size_max(device, self->max_size);","lines":8,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/android-boot/fu-android-boot-device.c#L75-L82"},{"ref":"plugins/android-boot/fu-android-boot-device.c:340-347","code":"  340 | \tif (g_strcmp0(key, \"AndroidBootPartitionMaxSize\") == 0) {\n  341 | \t\tguint64 size = 0;\n  342 | \n  343 | \t\tif (!fu_strtoull(value, &size, 0, G_MAXUINT32, FU_INTEGER_BASE_AUTO, error))\n  344 | \t\t\treturn FALSE;\n  345 | \t\tself->max_size = size;\n  346 | \t\treturn TRUE;\n  347 | \t}","lines":8,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/android-boot/fu-android-boot-device.c#L340-L347"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `fu_ccgx_dmc_firmware_parse_image()` (plugins/ccgx-dmc/fu-ccgx-dmc-firmware.c), an image whose `num_img_segments` field is `0` (explicitly documented two lines above as a valid, optional case: `/* segments are optional */`) is never appended to `self->image_records`, while `img_off` is still advanced for every image regardless of segment count. This means `self->image_records` only contains the subset of FWCT images that happen to have segments, so its array index no longer matches the image's actual position/index in the on-wire FWCT. Later, in `fu_ccgx_dmc_device_write_firmware()` (plugins/ccgx-dmc/fu-ccgx-dmc-device.c), `img_index = rqt_data[0]` (the image index reported by the device over the interrupt endpoint) is used directly as `g_ptr_array_index(image_records, img_index)`. If any earlier image in the FWCT had zero segments, this indexes the wrong `FuCcgxDmcFirmwareRecord`, silently writing the wrong image's rows to the device.","fix":"Always append an image record (even a zero-segment placeholder) to `self->image_records` so its index matches the FWCT image index, e.g. move `g_ptr_array_add(self->image_records, g_steal_pointer(&img_rcd));` outside the `if (img_rcd->num_img_segments > 0)` block, or track image index explicitly (e.g. store `img_rcd->index = i;`) and look records up by that field instead of array position.","locations":[{"ref":"plugins/ccgx-dmc/fu-ccgx-dmc-firmware.c:211-239","code":"  211 | \t\tif (img_rcd->num_img_segments > 0) {\n  212 | \t\t\tgsize img_digestsz = 0;\n  213 | \t\t\tconst guint8 *img_digest;\n  214 | \n  215 | \t\t\timg_digest =\n  216 | \t\t\t    fu_struct_ccgx_dmc_fwct_image_info_get_img_digest(st_img,\n  217 | \t\t\t\t\t\t\t\t\t      &img_digestsz);\n  218 | \t\t\tif (!fu_memcpy_safe((guint8 *)&img_rcd->img_digest,\n  219 | \t\t\t\t\t    sizeof(img_rcd->img_digest),\n  220 | \t\t\t\t\t    0x0, /* dst */\n  221 | \t\t\t\t\t    img_digest,\n  222 | \t\t\t\t\t    img_digestsz,\n  223 | \t\t\t\t\t    0, /* src */\n  224 | \t\t\t\t\t    img_digestsz,\n  225 | \t\t\t\t\t    error))\n  226 | \t\t\t\treturn FALSE;\n  227 | \n  228 | \t\t\t/* parse segment */\n  229 | \t\t\tif (!fu_ccgx_dmc_firmware_parse_segment(self,\n  230 | \t\t\t\t\t\t\t\tstream,\n  231 | \t\t\t\t\t\t\t\timg_rcd,\n  232 | \t\t\t\t\t\t\t\t&seg_off,\n  233 | \t\t\t\t\t\t\t\tflags,\n  234 | \t\t\t\t\t\t\t\terror))\n  235 | \t\t\t\treturn FALSE;\n  236 | \n  237 | \t\t\t/* add image record to image record array */\n  238 | \t\t\tg_ptr_array_add(self->image_records, g_steal_pointer(&img_rcd));\n  239 | \t\t}","lines":29,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/ccgx-dmc/fu-ccgx-dmc-firmware.c#L211-L239"},{"ref":"plugins/ccgx-dmc/fu-ccgx-dmc-device.c:583-597","code":"  583 | \t\timg_index = rqt_data[0];\n  584 | \t\tif (img_index >= image_records->len) {\n  585 | \t\t\tg_set_error(error,\n  586 | \t\t\t\t    FWUPD_ERROR,\n  587 | \t\t\t\t    FWUPD_ERROR_NOT_SUPPORTED,\n  588 | \t\t\t\t    \"invalid image index %d, expected less than %u\",\n  589 | \t\t\t\t    img_index,\n  590 | \t\t\t\t    image_records->len);\n  591 | \t\t\treturn FALSE;\n  592 | \t\t}\n  593 | \n  594 | \t\t/* write image */\n  595 | \t\tg_debug(\"writing image index %u/%u\", img_index, image_records->len - 1);\n  596 | \t\timg_rcd = g_ptr_array_index(image_records, img_index);\n  597 | \t\tif (!fu_ccgx_dmc_device_write_firmware_image(self,","lines":15,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/ccgx-dmc/fu-ccgx-dmc-device.c#L583-L597"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`fu_ccgx_hpi_device_clear_all_events` (`plugins/ccgx/fu-ccgx-hpi-device.c:781`) loops `for (guint8 i = 0; i < self->num_ports; i++)` and passes `i` directly as a `FuCcgxHpiRegSection` to `fu_ccgx_hpi_device_wait_for_event`. Per `FuCcgxHpiRegSection` in `plugins/ccgx/fu-ccgx.rs` (`Dev = 0, Port0 = 1, Port1 = 2, All = 3`), a single-port device (`num_ports == 1`) only clears section `Dev` (`i == 0`) and never clears `Port0`; a two-port device (`num_ports == 2`) clears `Dev` and `Port0` but never `Port1`. Real PD-port events are therefore left un-acknowledged, unlike `fu_ccgx_hpi_device_clear_intr` (line 558) and `fu_ccgx_hpi_device_app_read_intr_reg` (line 680) which both use an inclusive `i <= self->num_ports` bound.","fix":"Make the loop bound consistent with the enum and the other two iteration sites, e.g. `for (guint8 i = 0; i <= self->num_ports; i++)`, so every relevant `FuCcgxHpiRegSection` (including the last port) actually gets cleared.","locations":[{"ref":"plugins/ccgx/fu-ccgx-hpi-device.c:760-786","code":"  760 | fu_ccgx_hpi_device_clear_all_events(FuCcgxHpiDevice *self, guint32 io_timeout, GError **error)\n  761 | {\n  762 | \tFuCcgxHpiEvent event_array[FU_CCGX_HPI_REG_SECTION_ALL + 1] = {0x0};\n  763 | \tif (io_timeout == 0) {\n  764 | \t\treturn fu_ccgx_hpi_device_app_read_intr_reg(self,\n  765 | \t\t\t\t\t\t\t    FU_CCGX_HPI_REG_SECTION_ALL,\n  766 | \t\t\t\t\t\t\t    event_array,\n  767 | \t\t\t\t\t\t\t    NULL,\n  768 | \t\t\t\t\t\t\t    error);\n  769 | \t}\n  770 | \tfor (guint8 i = 0; i < self->num_ports; i++) {\n  771 | \t\tg_autoptr(GError) error_local = NULL;\n  772 | \t\tif (!fu_ccgx_hpi_device_wait_for_event(self,\n  773 | \t\t\t\t\t\t       i,\n  774 | \t\t\t\t\t\t       event_array,\n  775 | \t\t\t\t\t\t       io_timeout,\n  776 | \t\t\t\t\t\t       &error_local)) {\n  777 | \t\t\tif (!g_error_matches(error_local, FWUPD_ERROR, FWUPD_ERROR_TIMED_OUT)) {\n  778 | \t\t\t\tg_propagate_prefixed_error(error,\n  779 | \t\t\t\t\t\t\t   g_steal_pointer(&error_local),\n  780 | \t\t\t\t\t\t\t   \"failed to clear events: \");\n  781 | \t\t\t\treturn FALSE;\n  782 | \t\t\t}\n  783 | \t\t}\n  784 | \t}\n  785 | \treturn TRUE;\n  786 | }","lines":27,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/ccgx/fu-ccgx-hpi-device.c#L760-L786"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `fu_dell_dock_ec_get_dock_info` (`plugins/dell-dock/fu-dell-dock-ec.c`), the local variable `oldest_base_pd` is computed while scanning PD devices, but it mixes byte orders: it is *compared* against `device_entry[i].version.version_32` (host/native order) but *assigned* via `GUINT32_TO_BE(device_entry[i].version.version_32)` (big-endian). This means on the second and later matching PD entries, the comparison `device_entry[i].version.version_32 < oldest_base_pd` compares a native-order value against a big-endian-converted value, giving meaningless results on non-big-endian hosts. Worse, `oldest_base_pd` is never stored anywhere (not written to `self`, not returned, not used after the loop) - the entire computation is dead code that silently does nothing useful.","fix":"Either remove the dead `oldest_base_pd` tracking entirely if it is unused, or fix the byte-order bug and actually use the result, e.g.:\n```c\nif (map->device_type == FU_DELL_DOCK_DEVICETYPE_PD && map->location == LOCATION_BASE &&\n    map->sub_type == 0) {\n\tguint32 ver = device_entry[i].version.version_32;\n\tif (oldest_base_pd == 0 || ver < oldest_base_pd)\n\t\toldest_base_pd = ver;\n\t...\n}\n```\nand then store `oldest_base_pd` on `self` (or use it) instead of discarding it.","locations":[{"ref":"plugins/dell-dock/fu-dell-dock-ec.c:304","code":"  304 | \tguint32 oldest_base_pd = 0;","lines":1,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/dell-dock/fu-dell-dock-ec.c#L304"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `fu_dell_plugin_device_registered()` (`plugins/dell/fu-dell-plugin.c`), the thunderbolt branch guards against `fu_dell_plugin_get_system_id()` returning `0` (a parse failure/no SKU) with `if (system_id == 0) return;` before building any GUID/instance ID. The TPM branch right below does not have this same guard: `system_id` is used unconditionally to build `tpm_guid_raw = g_strdup_printf(\"%04x-2.0\", system_id)` and `fu_device_add_instance_id()`. If `fu_dell_plugin_get_system_id()` fails to parse the SKU (already logged via `g_warning` inside that helper), the TPM device is still marked `FWUPD_DEVICE_FLAG_UPDATABLE`/`FWUPD_DEVICE_FLAG_NEEDS_REBOOT` and given a bogus `0000-2.0` instance ID.","fix":"Mirror the thunderbolt branch's guard in the TPM branch:\n```c\nif (g_strcmp0(fu_device_get_plugin(device), \"tpm\") == 0) {\n    guint16 system_id = fu_dell_plugin_get_system_id(plugin);\n    if (system_id == 0)\n        return;\n    ...\n}\n```","locations":[{"ref":"plugins/dell/fu-dell-plugin.c:152-165","code":"  152 | \t/* tpm plugin */\n  153 | \tif (g_strcmp0(fu_device_get_plugin(device), \"tpm\") == 0) {\n  154 | \t\tguint16 system_id = fu_dell_plugin_get_system_id(plugin);\n  155 | \t\tg_autofree gchar *tpm_guid_raw = NULL;\n  156 | \n  157 | \t\tfu_device_add_flag(device, FWUPD_DEVICE_FLAG_UPDATABLE);\n  158 | \t\tfu_device_add_flag(device, FWUPD_DEVICE_FLAG_NEEDS_REBOOT);\n  159 | \t\tfu_device_set_metadata(device,\n  160 | \t\t\t\t       FU_DEVICE_METADATA_UEFI_DEVICE_KIND,\n  161 | \t\t\t\t       \"dell-tpm-firmware\");\n  162 | \t\ttpm_guid_raw = g_strdup_printf(\"%04x-2.0\", system_id);\n  163 | \t\tfu_device_add_instance_id(device, tpm_guid_raw);\n  164 | \t\tfu_device_set_version_format(device, FWUPD_VERSION_FORMAT_QUAD);\n  165 | \t}","lines":14,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/dell/fu-dell-plugin.c#L152-L165"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"There is a size mismatch between the \"option\" firmware partition as defined for file parsing and\nas actually read back from the device in `plugins/elan-kbd`. `FU_ELAN_KBD_DEVICE_SIZE_OPTION` is\n`0x100` (256 bytes) in `fu-elan-kbd-common.h`, and `fu_elan_kbd_firmware_parse()` in\n`fu-elan-kbd-firmware.c` extracts a 256-byte `option` image from a full ROM binary using that\nconstant. However `fu_elan_kbd_device_cmd_read_option()` in `fu-elan-kbd-device.c` only reads\n`FU_STRUCT_ELAN_KBD_READ_OPTION_REQ_DEFAULT_LEN` bytes from the device, which is fixed at 128 by\nthe `addr: u16le == 128, len: u16le == 128` constants of `FuStructElanKbdReadOptionReq` in\n`fu-elan-kbd.rs`. As a result, `fu_elan_kbd_device_read_firmware()` (used for dumping/backing up\nthe device) builds an \"option\" image that is only half the size (128 bytes) of what\n`fu_elan_kbd_firmware_parse()` expects from an on-disk ROM image (256 bytes). A firmware object\nbuilt from a device dump therefore silently drops the first 128 bytes of the option region and,\nif written back out via `fu_elan_kbd_firmware_write()` (which just appends `blob_option` with no\nsize validation), produces an incomplete/malformed ROM file.","fix":"Make the on-device option read consistent with the on-disk partition size: either read the option\narea in two 128-byte requests (covering the full `0x100` region) and concatenate them in\n`fu_elan_kbd_device_cmd_read_option()`, or, if the hardware genuinely only exposes 128 bytes via\nthis command, shrink `FU_ELAN_KBD_DEVICE_SIZE_OPTION` to `0x80` so the firmware-file layout and the\ndevice dump agree, and add a size check in `fu_elan_kbd_firmware_write()` so a short `blob_option`\nis rejected instead of silently written.","locations":[{"ref":"plugins/elan-kbd/fu-elan-kbd-common.h:17","code":"   17 | #define FU_ELAN_KBD_DEVICE_SIZE_OPTION 0x100","lines":1,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/elan-kbd/fu-elan-kbd-common.h#L17"},{"ref":"plugins/elan-kbd/fu-elan-kbd-device.c:362-390","code":"  362 | static GBytes *\n  363 | fu_elan_kbd_device_cmd_read_option(FuElanKbdDevice *self, FuProgress *progress, GError **error)\n  364 | {\n  365 | \tconst gsize len = FU_STRUCT_ELAN_KBD_READ_OPTION_REQ_DEFAULT_LEN;\n  366 | \tg_autoptr(FuStructElanKbdReadOptionReq) st_req = fu_struct_elan_kbd_read_option_req_new();\n  367 | \tg_autoptr(GByteArray) buf = NULL;\n  368 | \tg_autofree guint8 *data = g_malloc0(len);\n  369 | \n  370 | \t/* progress */\n  371 | \tfu_progress_set_id(progress, G_STRLOC);\n  372 | \tfu_progress_set_steps(progress, len / FU_ELAN_KBD_DEVICE_EP_DATA_SIZE);\n  373 | \n  374 | \t/* set up read */\n  375 | \tbuf = fu_elan_kbd_device_cmd(self, st_req->buf, error);\n  376 | \tif (buf == NULL)\n  377 | \t\treturn NULL;\n  378 | \tif (!fu_elan_kbd_device_status_check(self, buf, error))\n  379 | \t\treturn NULL;\n  380 | \tfor (gsize offset = 0; offset < len; offset += FU_ELAN_KBD_DEVICE_EP_DATA_SIZE) {\n  381 | \t\tif (!fu_elan_kbd_device_read_data(self, data, len, offset, error)) {\n  382 | \t\t\tg_prefix_error(error, \"failed at 0x%x: \", (guint)offset);\n  383 | \t\t\treturn NULL;\n  384 | \t\t}\n  385 | \t\tfu_progress_step_done(progress);\n  386 | \t}\n  387 | \tif (!fu_elan_kbd_device_cmd_read_option_finished(self, fu_sum16(data, len), error))\n  388 | \t\treturn NULL;\n  389 | \treturn g_bytes_new_take(g_steal_pointer(&data), len);\n  390 | }","lines":29,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/elan-kbd/fu-elan-kbd-device.c#L362-L390"},{"ref":"plugins/elan-kbd/fu-elan-kbd.rs:207-215","code":"  207 | #[derive(New, Default)]\n  208 | #[repr(C, packed)]\n  209 | struct FuStructElanKbdReadOptionReq {\n  210 |     tag: u8 == 0xC1,\n  211 |     cmd: FuElanKbdCmd == ReadOption,\n  212 |     addr: u16le == 128,\n
