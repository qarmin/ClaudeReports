{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"In `fu_egis_moc_device_write_packets` (`plugins/egis-moc/fu-egis-moc-device.c`), the size of the\nfinal firmware chunk is used unchecked in a subtraction: `fu_chunk_get_data_sz(chk) - FU_EGIS_MOC_HMAC_SHA256_SIZE` (32). `fu_chunk_get_data_sz()` returns a `gsize` (unsigned), so if the\nlast chunk produced by `fu_chunk_array_new_from_bytes()` is smaller than 32 bytes the subtraction\nunderflows to a huge value near `G_MAXSIZE`. That value is passed straight into\n`g_byte_array_append(req, fu_chunk_get_data(chk), <huge value>)` with no bounds check (unlike\n`fu_egis_moc_device_write_checksum()`, which performs the equivalent subtraction but passes it\nthrough the bounds-checked `fu_memcpy_safe()`). The firmware is chunked with\n`FU_EGIS_MOC_FLASH_TRANSFER_BLOCK_SIZE` (4096) and the device only enforces\n`fu_device_set_firmware_size_min(self, 0x20000)` / `_max(self, 0x50000)`, so a firmware blob whose\nsize is not a multiple of 4096 (e.g. `0x20001` bytes, giving a 1-byte final chunk) reaches this\ncode path and triggers a massive out-of-bounds read / crash while writing a malicious or corrupted\nfirmware file.","fix":"Validate the final chunk size before subtracting, e.g.:\n```c\ngsize chunk_sz = fu_chunk_get_data_sz(chk);\nif (i == fu_chunk_array_length(chunks) - 1) {\n        if (chunk_sz < FU_EGIS_MOC_HMAC_SHA256_SIZE) {\n                g_set_error_literal(error,\n                                    FWUPD_ERROR,\n                                    FWUPD_ERROR_INVALID_DATA,\n                                    \"final chunk too small to hold HMAC suffix\");\n                return FALSE;\n        }\n        g_byte_array_append(req,\n                            fu_chunk_get_data(chk),\n                            chunk_sz - FU_EGIS_MOC_HMAC_SHA256_SIZE);\n} else {\n        g_byte_array_append(req, fu_chunk_get_data(chk), chunk_sz);\n}\n```\nAlternatively route the subtraction through `fu_memcpy_safe()`/`fu_memchk_read()` like\n`fu_egis_moc_device_write_checksum()` already does, so the underflow is caught instead of silently\nwrapping around.","locations":[{"ref":"plugins/egis-moc/fu-egis-moc-device.c:336-380","code":"  336 | static gboolean\n  337 | fu_egis_moc_device_write_packets(FuEgisMocDevice *self,\n  338 | \t\t\t\t FuChunkArray *chunks,\n  339 | \t\t\t\t FuProgress *progress,\n  340 | \t\t\t\t GError **error)\n  341 | {\n  342 | \tfu_progress_set_id(progress, G_STRLOC);\n  343 | \tfu_progress_set_steps(progress, fu_chunk_array_length(chunks));\n  344 | \tfor (guint i = 0; i < fu_chunk_array_length(chunks); i++) {\n  345 | \t\tg_autoptr(FuChunk) chk = NULL;\n  346 | \t\tg_autoptr(GByteArray) req = g_byte_array_new();\n  347 | \t\tguint32 offset;\n  348 | \n  349 | \t\t/* prepare chunk */\n  350 | \t\tchk = fu_chunk_array_index(chunks, i, error);\n  351 | \t\tif (chk == NULL)\n  352 | \t\t\treturn FALSE;\n  353 | \t\tif (i == fu_chunk_array_length(chunks) - 1) {\n  354 | \t\t\tg_byte_array_append(req,\n  355 | \t\t\t\t\t    fu_chunk_get_data(chk),\n  356 | \t\t\t\t\t    fu_chunk_get_data_sz(chk) -\n  357 | \t\t\t\t\t\tFU_EGIS_MOC_HMAC_SHA256_SIZE);\n  358 | \t\t} else {\n  359 | \t\t\tg_byte_array_append(req, fu_chunk_get_data(chk), fu_chunk_get_data_sz(chk));\n  360 | \t\t}\n  361 | \t\toffset = fu_chunk_get_address(chk);\n  362 | \t\tif (!fu_egis_moc_device_ctrl_cmd(self,\n  363 | \t\t\t\t\t\t FU_EGIS_MOC_CMD_OTA_WRITE,\n  364 | \t\t\t\t\t\t (guint16)(offset & 0xFFFF),\n  365 | \t\t\t\t\t\t (guint16)((offset >> 16) & 0xFFFF),\n  366 | \t\t\t\t\t\t req->data,\n  367 | \t\t\t\t\t\t req->len,\n  368 | \t\t\t\t\t\t FALSE,\n  369 | \t\t\t\t\t\t error)) {\n  370 | \t\t\tg_prefix_error_literal(error, \"failed to write: \");\n  371 | \t\t\treturn FALSE;\n  372 | \t\t}\n  373 | \n  374 | \t\t/* update progress */\n  375 | \t\tfu_progress_step_done(progress);\n  376 | \t}\n  377 | \n  378 | \t/* success */\n  379 | \treturn TRUE;\n  380 | }","lines":45,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/egis-moc/fu-egis-moc-device.c#L336-L380"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"In `fu_jabra_file_device_write_next_block()` (`plugins/jabra-file/fu-jabra-file-device.c:447-462`), the wire chunk index is built with `guint8 data[2] = {FU_JABRA_FILE_NEXT_BLOCK << 6 | (bufsz + 1), chunk_number};` where `chunk_number` is a `guint32`. Assigning it into a `guint8` array element silently truncates it modulo 256. With `chunk_size = 55` (see `fu_jabra_file_device_write_firmware`), any firmware image larger than `255 * 55 = 14025` bytes will produce a wrapped, duplicate on-wire chunk index once `chunk_number` exceeds 255, while the accompanying `cmd_length` 'every 101st packet' ACK logic and the caller's loop counter (`fu_jabra_file_device_write_blocks`) both keep using the full, untruncated `chunk_number`. This mismatch between the byte actually sent to the device and the host's own bookkeeping can corrupt the block sequence perceived by the device for any firmware image bigger than ~14 KB.","fix":"Either explicitly reduce the chunk counter to the range the protocol expects (documenting that this is intentional 8-bit wraparound the device also implements), or widen the wire format if the device actually expects a wider counter. At minimum, avoid the silent narrowing conversion, e.g. ```c\nguint8 data[2] = {\n    (guint8)(FU_JABRA_FILE_NEXT_BLOCK << 6 | (bufsz + 1)),\n    (guint8)(chunk_number % 0x100),\n};\n```so the truncation is explicit and reviewers/future maintainers are not misled into thinking the full 32-bit counter is transmitted.","locations":[{"ref":"plugins/jabra-file/fu-jabra-file-device.c:450","code":"  450 | \tguint8 data[2] = {FU_JABRA_FILE_NEXT_BLOCK << 6 | (bufsz + 1), chunk_number};","lines":1,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/jabra-file/fu-jabra-file-device.c#L450"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`fwupd_bios_setting_from_json()` reads `FWUPD_RESULT_KEY_BIOS_SETTING_TYPE`, `FWUPD_RESULT_KEY_BIOS_SETTING_LOWER_BOUND`, `FWUPD_RESULT_KEY_BIOS_SETTING_UPPER_BOUND` and `FWUPD_RESULT_KEY_BIOS_SETTING_SCALAR_INCREMENT` from untrusted JSON (e.g. an imported report or emulation file) into a signed `gint64 tmpi` via `fwupd_json_object_get_integer_with_default()`, then passes `tmpi` straight into `fwupd_bios_setting_set_kind()` (a `FwupdBiosSettingKind` enum) and `fwupd_bios_setting_set_lower_bound()` / `set_upper_bound()` / `set_scalar_increment()` (all `guint64`). No check rejects a negative `tmpi`. A JSON document with `\"LowerBound\": -1` silently wraps to `priv->lower_bound == G_MAXUINT64`, making `fwupd_bios_setting_validate_value()`'s subsequent `tmp < priv->lower_bound` bound check always fail (or behave nonsensically), and a negative `\"BiosSettingType\"` produces an out-of-range enum value stored in `priv->kind`.","fix":"Validate that the parsed integers are non-negative (and, for the type field, within the known `FwupdBiosSettingKind` range) before storing them, e.g.:\n\n```c\nif (tmpi < 0) {\n\tg_set_error_literal(error, FWUPD_ERROR, FWUPD_ERROR_INVALID_DATA, \"negative bound in JSON\");\n\treturn FALSE;\n}\nfwupd_bios_setting_set_lower_bound(self, (guint64)tmpi);\n```\napplied to each of the four `tmpi`-derived setter calls.","locations":[{"ref":"libfwupd/fwupd-bios-setting.c:1159-1223","code":" 1159 | \tif (!fwupd_json_object_get_integer_with_default(json_obj,\n 1160 | \t\t\t\t\t\t\tFWUPD_RESULT_KEY_BIOS_SETTING_TYPE,\n 1161 | \t\t\t\t\t\t\t&tmpi,\n 1162 | \t\t\t\t\t\t\t0,\n 1163 | \t\t\t\t\t\t\terror))\n 1164 | \t\treturn FALSE;\n 1165 | \tfwupd_bios_setting_set_kind(self, tmpi);\n 1166 | \tfwupd_bios_setting_set_id(\n 1167 | \t    self,\n 1168 | \t    fwupd_json_object_get_string(json_obj, FWUPD_RESULT_KEY_BIOS_SETTING_ID, NU son_obj,\n 1210 | \t\t\t\t\t\t\tFWUPD_RESULT_KEY_BIOS_SETTING_UPPER_BOUND,\n 1211 | \t\t\t\t\t\t\t&tmpi,\n 1212 | \t\t\t\t\t\t\t0,\n 1213 | \t\t\t\t\t\t\terror))\n 1214 | \t\treturn FALSE;\n 1215 | \tfwupd_bios_setting_set_upper_bound(self, tmpi);\n 1216 | \tif (!fwupd_json_object_get_integer_with_default(\n 1217 | \t\tjson_obj,\n 1218 | \t\tFWUPD_RESULT_KEY_BIOS_SETTING_SCALAR_INCREMENT,\n 1219 | \t\t&tmpi,\n 1220 | \t\t0,\n 1221 | \t\terror))\n 1222 | \t\treturn FALSE;\n 1223 | \tfwupd_bios_setting_set_scalar_increment(self, tmpi);","lines":65,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupd/fwupd-bios-setting.c#L1159-L1223"}]},
{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"In `fu_efi_device_path_parse`, the `efiboot` workaround recomputes `dp_length = streamsz - 0x4` whenever `streamsz > 4 && dp_length > streamsz`. When the whole input stream (`streamsz`) is only 5, 6 or 7 bytes, the fixed-up `dp_length` becomes 1, 2 or 3 - smaller than `st->buf->len` (the mandatory `FU_STRUCT_EFI_DEVICE_PATH_SIZE` header, checked earlier to be at least 4 bytes). `fu_firmware_set_size(firmware, dp_length)` then records a firmware size smaller than the bytes already consumed from the stream for the header. The caller `fu_efi_device_path_list_parse` (in `fu-efi-device-path-list.c`) uses `fu_firmware_get_size()` to advance its parse offset via `fu_size_checked_inc`, so a corrupted/crafted `DEVICE_PATH` list with a stream length of 5-7 bytes causes the offset to advance by less than one header's worth of bytes, re-parsing overlapping header bytes as new entries.","fix":"After computing the workaround value, clamp it to be at least the header size, e.g.:\n```c\nif (streamsz > 4 && dp_length > streamsz) {\n\tdp_length = streamsz - 0x4;\n\tif (dp_length < st->buf->len)\n\t\tdp_length = st->buf->len;\n\t...\n}\n```\nor bail out with `FWUPD_ERROR_INVALID_DATA` when the corrected length is still smaller than `st->buf->len`.","locations":[{"ref":"libfwupdplugin/fu-efi-device-path.c:117-138","code":"  117 | \t/* work around a efiboot bug */\n  118 | \tif (!fu_input_stream_size(stream, &streamsz, error))\n  119 | \t\treturn FALSE;\n  120 | \tdp_length = fu_struct_efi_device_path_get_length(st);\n  121 | \tif (streamsz > 4 && dp_length > streamsz) {\n  122 | \t\tdp_length = streamsz - 0x4;\n  123 | \t\tg_debug(\"fixing up DP length from 0x%x to 0x%x, because of a bug in efiboot\",\n  124 | \t\t\tfu_struct_efi_device_path_get_length(st),\n  125 | \t\t\t(guint)dp_length);\n  126 | \t}\n  127 | \tif (dp_length > st->buf->len) {\n  128 | \t\tg_autoptr(GBytes) payload = NULL;\n  129 | \t\tpayload = fu_input_stream_read_bytes(stream,\n  130 | \t\t\t\t\t\t     st->buf->len,\n  131 | \t\t\t\t\t\t     dp_length - st->buf->len,\n  132 | \t\t\t\t\t\t     NULL,\n  133 | \t\t\t\t\t\t     error);\n  134 | \t\tif (payload == NULL)\n  135 | \t\t\treturn FALSE;\n  136 | \t\tfu_firmware_set_bytes(firmware, payload);\n  137 | \t}\n  138 | \tfu_firmware_set_size(firmware, dp_length);","lines":22,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-efi-device-path.c#L117-L138"}]},
{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"In `fu_ccgx_hpi_device_get_metadata_offset` (`plugins/ccgx/fu-ccgx-hpi-device.c`), `addr_max` is computed as `self->flash_size / self->flash_row_size`, and for `FU_CCGX_FW_MODE_FW2` the code does `*addr = addr_max - 2`. The only prior validation, in `fu_ccgx_hpi_device_ensure_silicon_id`, requires `flash_row_size != 0`, `flash_size != 0` and `flash_size % flash_row_size == 0`, but does not require `addr_max >= 2`. If a quirk sets `CcgxFlashSize` equal to exactly one row (`addr_max == 1`), `addr_max - 2` underflows the `guint32`, producing a huge flash row address that is then used (truncated to `guint16`) by `fu_ccgx_hpi_device_read_flash`/`fu_ccgx_hpi_device_write_flash` when loading/saving the CCGX metadata header, reading/writing the wrong flash row.","fix":"In `fu_ccgx_hpi_device_get_metadata_offset`, validate that `addr_max` is large enough for the requested `fw_mode` before subtracting, e.g. ```c\nif ((fw_mode == FU_CCGX_FW_MODE_FW1 && addr_max < 1) ||\n    (fw_mode == FU_CCGX_FW_MODE_FW2 && addr_max < 2)) {\n\tg_set_error_literal(error, FWUPD_ERROR, FWUPD_ERROR_NOT_SUPPORTED,\n\t\t\t     \"flash too small for metadata\");\n\treturn FALSE;\n}\n```","locations":[{"ref":"plugins/ccgx/fu-ccgx-hpi-device.c:1219-1227","code":" 1219 | \taddr_max = self->flash_size / self->flash_row_size;\n 1220 | \n 1221 | \t/* get the row offset in the flash */\n 1222 | \tswitch (fw_mode) {\n 1223 | \tcase FU_CCGX_FW_MODE_FW1:\n 1224 | \t\t*addr = addr_max - 1;\n 1225 | \t\tbreak;\n 1226 | \tcase FU_CCGX_FW_MODE_FW2:\n 1227 | \t\t*addr = addr_max - 2;","lines":9,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/ccgx/fu-ccgx-hpi-device.c#L1219-L1227"},{"ref":"plugins/ccgx/fu-ccgx-hpi-device.c:1419-1428","code":" 1419 | \tif (self->flash_row_size == 0x0 || self->flash_size == 0x0 ||\n 1420 | \t    self->flash_size % self->flash_row_size != 0) {\n 1421 | \t\tg_set_error(error,\n 1422 | \t\t\t    FWUPD_ERROR,\n 1423 | \t\t\t    FWUPD_ERROR_NOT_SUPPORTED,\n 1424 | \t\t\t    \"invalid row size for: 0x%x/0x%x\",\n 1425 | \t\t\t    self->flash_row_size,\n 1426 | \t\t\t    self->flash_size);\n 1427 | \t\treturn FALSE;\n 1428 | \t}","lines":10,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/ccgx/fu-ccgx-hpi-device.c#L1419-L1428"}]},
{"id":"OVF_8","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"`fu_devlink_netlink_error_cb_extack()` in `plugins/devlink/fu-devlink-netlink.c` computes `hlen += mnl_nlmsg_get_payload_len(&err->msg);` where `err->msg` is a nested `nlmsghdr` embedded in the netlink error payload. Its `nlmsg_len` field is fully attacker-controlled data when replaying recorded/emulated netlink responses (`nlg->is_emulated`), and is not validated against the actual received message length before use. If `err->msg.nlmsg_len` is smaller than `NLMSG_HDRLEN`, `mnl_nlmsg_get_payload_len()` underflows (unsigned arithmetic) to a huge value, which is then passed as the `offset` argument to `mnl_attr_parse(nlh, hlen, ...)`. This can cause `mnl_attr_parse()` to compute a bogus remaining-length and walk attributes far beyond the actual message contents.","fix":"Validate that `hlen` does not exceed `mnl_nlmsg_get_payload_len(nlh)` (the *outer* message length) before calling `mnl_attr_parse()`, e.g. ```c guint inner_len = mnl_nlmsg_get_payload_len(&err->msg); if (inner_len > mnl_nlmsg_get_payload_len(nlh)) return FALSE; hlen += inner_len;```","locations":[{"ref":"plugins/devlink/fu-devlink-netlink.c:60-70","code":"   60 | fu_devlink_netlink_error_cb_extack(const struct nlmsghdr *nlh, GError **error)\n   61 | {\n   62 | \tconst struct nlmsgerr *err = mnl_nlmsg_get_payload(nlh);\n   63 | \tstruct nlattr *tb[NLMSGERR_ATTR_MAX + 1] = {};\n   64 | \tguint hlen = sizeof(struct nlmsgerr);\n   65 | \n   66 | \tif ((nlh->nlmsg_flags & NLM_F_ACK_TLVS) == 0)\n   67 | \t\treturn FALSE;\n   68 | \tif ((nlh->nlmsg_flags & NLM_F_CAPPED) == 0)\n   69 | \t\thlen += mnl_nlmsg_get_payload_len(&err->msg);\n   70 | \tif (mnl_attr_parse(nlh, hlen, fu_devlink_netlink_nlmsgerr_attr_cb, tb) != MNL_CB_OK)","lines":11,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/devlink/fu-devlink-netlink.c#L60-L70"}]},
{"id":"OVF_9","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"`fu_csv_entry_parse_token_cb()` checks `if (token_idx > FU_CSV_ENTRY_COLUMNS_MAX)` before rejecting a row as having \"too many columns, limit is %u\" (`FU_CSV_ENTRY_COLUMNS_MAX` = 1000). Because the comparison is `>` and not `>=`, a row with `token_idx` values `0..1000` inclusive (1001 columns) is accepted, one more than the documented/intended limit of 1000.","fix":"```c\n-\tif (token_idx > FU_CSV_ENTRY_COLUMNS_MAX) {\n+\tif (token_idx >= FU_CSV_ENTRY_COLUMNS_MAX) {\n```","locations":[{"ref":"libfwupdplugin/fu-csv-entry.c:161-181","code":"  161 | static gboolean\n  162 | fu_csv_entry_parse_token_cb(GString *token, guint token_idx, gpointer user_data, GError **error)\n  163 | {\n  164 | \tFuCsvEntry *self = FU_CSV_ENTRY(user_data);\n  165 | \tFuCsvEntryPrivate *priv = GET_PRIVATE(self);\n  166 | \tFuCsvFirmware *parent = FU_CSV_FIRMWARE(fu_firmware_get_parent(FU_FIRMWARE(self)));\n  167 | \tconst gchar *column_id;\n  168 | \n  169 | \t/* sanity check */\n  170 | \tif (parent == NULL) {\n  171 | \t\tg_set_error_literal(error, FWUPD_ERROR, FWUPD_ERROR_INVALID_DATA, \"no parent\");\n  172 | \t\treturn FALSE;\n  173 | \t}\n  174 | \tif (token_idx > FU_CSV_ENTRY_COLUMNS_MAX) {\n  175 | \t\tg_set_error(error,\n  176 | \t\t\t    FWUPD_ERROR,\n  177 | \t\t\t    FWUPD_ERROR_INVALID_DATA,\n  178 | \t\t\t    \"too many columns, limit is %u\",\n  179 | \t\t\t    FU_CSV_ENTRY_COLUMNS_MAX);\n  180 | \t\treturn FALSE;\n  181 | \t}","lines":21,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-csv-entry.c#L161-L181"}]},
{"id":"OVF_10","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"In `fu_efi_lz77_decompressor_parse()`, the sanity check `if (streamsz < src_bufsz + st->buf->len)` (\"source buffer is truncated\") is vulnerable to integer overflow/wraparound on platforms where `gsize` is 32-bit (embedded/32-bit builds of fwupd). `src_bufsz` is an attacker-controlled `guint32` read directly from `fu_struct_efi_lz77_decompressor_header_get_src_size(st)` with no upper-bound validation. If `src_bufsz` is close to `G_MAXUINT32` (e.g. `0xFFFFFFF8`), `src_bufsz + st->buf->len` wraps around to a small value on a 32-bit `gsize`, so the truncation check silently passes even though the declared source size is nonsensical. This does not lead to an out-of-bounds memory access (the actual byte reads in `fu_efi_lz77_decompressor_read_source_bits()` are bounded by the real underlying stream and simply zero-pad at EOF), but it defeats the intended input-validation check for malformed/hostile LZ77 headers on 32-bit targets.","fix":"Use the existing overflow-safe helper instead of raw addition, e.g.:\n```c\ngsize src_end = st->buf->len;\nif (!fu_size_checked_add(&src_end, src_bufsz, error))\n    return FALSE;\nif (streamsz < src_end) { ... }\n```\n(or perform the addition in an explicit 64-bit type before comparing) so the check cannot wrap on 32-bit `gsize` builds.","locations":[{"ref":"libfwupdplugin/fu-efi-lz77-decompressor.c:637-644","code":"  637 | \tsrc_bufsz = fu_struct_efi_lz77_decompressor_header_get_src_size(st);\n  638 | \tif (streamsz < src_bufsz + st->buf->len) {\n  639 | \t\tg_set_error_literal(error,\n  640 | \t\t\t\t    FWUPD_ERROR,\n  641 | \t\t\t\t    FWUPD_ERROR_INVALID_DATA,\n  642 | \t\t\t\t    \"source buffer is truncated\");\n  643 | \t\treturn FALSE;\n  644 | \t}","lines":8,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-efi-lz77-decompressor.c#L637-L644"}]},
{"id":"OVF_11","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"In `fu_amd_gpu_atom_firmware_parse_vbios_pn` (`plugins/amd-gpu/fu-amd-gpu-atom-firmware.c`), `idx` is declared as `guint16` and is incremented each loop iteration with `idx += strlen(str) + 1;`. Since `str` comes from attacker-controlled firmware bytes and can be up to `STRLEN_NORMAL - 1` (31) bytes long per one of up to 255 iterations (`num_str` is a `guint8`), repeated accumulation can wrap the 16-bit `idx` around zero. The wrap does not cause an out-of-bounds read (the next `fu_memstrsafe` call re-validates against `bufsz`), but it silently corrupts which offset is read for subsequent strings and for the later `model_name`/`config_filename` parsing, producing incorrect (but not memory-unsafe) results for crafted images.","fix":"Use a wider integer type (e.g. `guint32` or `gsize`) for `idx` while iterating the atombios strings, and use `fu_size_checked_inc`/an explicit bounds check before the next `fu_memstrsafe` call so a wrap is turned into a hard parse error instead of silently corrupting the offset:\n```c\ngsize idx = fu_struct_atom_image_get_str_loc(st_image);\n...\nidx += strlen(str) + 1; /* now cannot silently wrap at 16 bits */\n```","locations":[{"ref":"plugins/amd-gpu/fu-amd-gpu-atom-firmware.c:196-226","code":"  196 | \tfor (i = 0; i < num_str; i++) {\n  197 | \t\tg_autofree char *str = NULL;\n  198 | \n  199 | \t\tstr = fu_memstrsafe(buf, bufsz, idx, STRLEN_NORMAL - 1, error);\n  200 | \t\tif (str == NULL)\n  201 | \t\t\treturn FALSE;\n  202 | \n  203 | \t\tidx += strlen(str) + 1;\n  204 | \n  205 | \t\tswitch (i) {\n  206 | \t\tcase FU_ATOM_STRING_INDEX_PART_NUMBER:\n  207 | \t\t\tself->part_number = g_steal_pointer(&str);\n  208 | \t\t\tbreak;\n  209 | \t\tcase FU_ATOM_STRING_INDEX_ASIC:\n  210 | \t\t\tself->asic = g_steal_pointer(&str);\n  211 | \t\t\tbreak;\n  212 | \t\tcase FU_ATOM_STRING_INDEX_PCI_TYPE:\n  213 | \t\t\tself->pci_type = g_steal_pointer(&str);\n  214 | \t\t\tbreak;\n  215 | \t\tcase FU_ATOM_STRING_INDEX_MEMORY_TYPE:\n  216 | \t\t\tself->memory_type = g_steal_pointer(&str);\n  217 | \t\t\tbreak;\n  218 | \t\tdefault:\n  219 | \t\t\tg_set_error(error,\n  220 | \t\t\t\t    FWUPD_ERROR,\n  221 | \t\t\t\t    FWUPD_ERROR_INVALID_DATA,\n  222 | \t\t\t\t    \"unknown string index: %d\",\n  223 | \t\t\t\t    i);\n  224 | \t\t\treturn FALSE;\n  225 | \t\t}\n  226 | \t}","lines":31,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/amd-gpu/fu-amd-gpu-atom-firmware.c#L196-L226"}]},
{"id":"OVF_12","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"In `fu_elanfp_device_iap_send_command`, when `FU_ELAN_FP_DEVICE_FLAG_USB_BULK_TRANSFER` is set, `buftmp[1] = rspsz;` and `buftmp[2] = bufsz + 1;` assign the `gsize` parameters `rspsz`/`bufsz` into single `guint8` array slots, silently truncating any value above `255`. Current call sites keep `bufsz`/`rspsz` well under `255` (CFU payload chunks of 60 bytes, offer buffers, response buffers of 17 bytes), so this is not currently reachable, but the protocol header field intends to carry an actual length/size byte and any future caller (or firmware/CFU offer size derived from an untrusted `.cab` payload) that pushes `bufsz`/`rspsz` above `255` would silently corrupt the on-wire command instead of failing loudly.","fix":"Validate `bufsz < 0xFF` and `rspsz < 0xFF` (returning a `FWUPD_ERROR_INVALID_DATA` error otherwise) before writing them into the single-byte `buftmp[1]`/`buftmp[2]` fields, e.g.:\n```c\nif (bufsz + 1 > G_MAXUINT8 || rspsz > G_MAXUINT8) {\n    g_set_error_literal(error, FWUPD_ERROR, FWUPD_ERROR_INVALID_DATA,\n                         \"command size too large for single-byte length field\");\n    return FALSE;\n}\n```","locations":[{"ref":"plugins/elanfp/fu-elanfp-device.c:59-64","code":"   59 | \t\t\tbuftmp[0] = TAG_SEND_COMMAND;\n   60 | \t\t\tbuftmp[1] = rspsz;\n   61 | \t\t\tbuftmp[2] = bufsz + 1;\n   62 | \t\t\tbuftmp[3] = request;\n   63 | \t\t\tstart_index = 0x04;\n   64 | \t\t\tsendsz = bufsz + 1 + 3;","lines":6,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/elanfp/fu-elanfp-device.c#L59-L64"}]},
{"id":"OVF_13","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"In `fu_elantp_hid_device_write_firmware`, `total_pages` is computed as `((self->force_table_addr - iap_addr - 1) / self->fw_page_size) + 1`, where `self->force_table_addr` (`guint32`) and `iap_addr` (`guint16`) are both attacker-influenced by the firmware file via `fu_elantp_firmware_get_iap_addr`/`fu_elantp_firmware_get_forcetable_addr`. If `self->force_table_addr <= iap_addr` (not otherwise excluded on this code path, since the branch is only guarded by `self->force_table_addr >= fu_elantp_firmware_get_forcetable_addr(...)`, a check against the firmware's own force-table address, not against `iap_addr`), the subtraction underflows to a huge `guint32`, and `total_pages` becomes a huge value. This happens to be caught by the very next `if (total_pages > chunks->len)` check, which turns it into a normal `FWUPD_ERROR_WRITE` error rather than a crash, but the code relies on that secondary check rather than validating the precondition directly, making the arithmetic fragile to reorder/refactor.","fix":"Add an explicit check before the subtraction, e.g.:\n```c\nif (self->force_table_addr <= iap_addr) {\n    g_set_error_literal(error, FWUPD_ERROR, FWUPD_ERROR_INVALID_DATA,\n                         \"forcetable address must be greater than IAP address\");\n    return FALSE;\n}\ntotal_pages = ((self->force_table_addr - iap_addr - 1) / self->fw_page_size) + 1;\n```","locations":[{"ref":"plugins/elantp/fu-elantp-hid-device.c:689-724","code":"  689 | \tif (self->force_table_support &&\n  690 | \t    self->force_table_addr >=\n  691 | \t\tfu_elantp_firmware_get_forcetable_addr(FU_ELANTP_FIRMWARE(firmware))) {\n  692 | \t\tbuf2 = g_malloc0(bufsz);\n  693 | \t\tif (!fu_memcpy_safe(buf2,\n  694 | \t\t\t\t    bufsz,\n  695 | \t\t\t\t    0x0, /* dst */\n  696 | \t\t\t\t    buf,\n  697 | \t\t\t\t    bufsz,\n  698 | \t\t\t\t    0x0, /* src */\n  699 | \t\t\t\t    bufsz,\n  700 | \t\t\t\t    error))\n  701 | \t\t\treturn FALSE;\n  702 | \n  703 | \t\tif (!fu_elantp_hid_device_filling_forcetable_firmware(\n  704 | \t\t\tself,\n  705 | \t\t\tbuf2,\n  706 | \t\t\tbufsz,\n  707 | \t\t\tfu_elantp_firmware_get_forcetable_addr(FU_ELANTP_FIRMWARE(firmware)),\n  708 | \t\t\terror)) {\n  709 | \t\t\tg_set_error_literal(error,\n  710 | \t\t\t\t\t    FWUPD_ERROR,\n  711 | \t\t\t\t\t    FWUPD_ERROR_WRITE,\n  712 | \t\t\t\t\t    \"filling forcetable failed\");\n  713 | \t\t\treturn FALSE;\n  714 | \t\t}\n  715 | \t\tchunks = fu_chunk_array_new(buf2 + iap_addr,\n  716 | \t\t\t\t\t    bufsz - iap_addr,\n  717 | \t\t\t\t\t    0x0,\n  718 | \t\t\t\t\t    0x0,\n  719 | \t\t\t\t\t    self->fw_page_size,\n  720 | \t\t\t\t\t    error);\n  721 | \t\tif (chunks == NULL)\n  722 | \t\t\treturn FALSE;\n  723 | \t\ttotal_pages = ((self->force_table_addr - iap_addr - 1) / self->fw_page_size) + 1;\n  724 | \t\tif (total_pages > chunks->len) {","lines":36,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/elantp/fu-elantp-hid-device.c#L689-L724"}]},
{"id":"OVF_14","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"In `fu_engine_requirements_check_phased_update` (`src/fu-engine-requirements.c`), when no `host_machine_id`/`archive_filename` is available, `seed = (gint32)fwupd_remote_get_mtime(remote);` truncates and reinterprets a `guint64` UNIX timestamp as a signed 32-bit value. Once `mtime` exceeds `G_MAXINT32` (~year 2038), the cast produces a negative `gint32`. The subsequent `seed % phased_update` (with `phased_update` a `guint64`) then converts `seed` to a huge unsigned value via the usual arithmetic conversions, changing the distribution of `seed % phased_update` compared to the intended small-positive-seed behavior, silently breaking the uniformity of the phased-rollout gating for `<phased_update>` requirements on that fallback path.","fix":"Use an unsigned type consistently, e.g.:\n```c\nguint32 seed;\n...\nif (host_machine_id == NULL || archive_filename == NULL) {\n\tseed = (guint32)fwupd_remote_get_mtime(remote);\n} else {\n\t...\n}\n```\nand ensure `seed % phased_update` is computed with both operands unsigned and of matching intent.","locations":[{"ref":"src/fu-engine-requirements.c:787-800","code":"  787 | \thost_machine_id = fu_engine_get_host_machine_id(self);\n  788 | \tif (host_machine_id == NULL || archive_filename == NULL) {\n  789 | \t\tseed = (gint32)fwupd_remote_get_mtime(remote);\n  790 | \t} else {\n  791 | \t\tguint32 seed_buf[4] = {0};\n  792 | \t\tguint seed_bufsz = 0;\n  793 | \t\tg_autoptr(GRand) rand = NULL;\n  794 | \n  795 | \t\tseed_buf[seed_bufsz++] = g_str_hash(host_machine_id);\n  796 | \t\tseed_buf[seed_bufsz++] = g_str_hash(archive_filename);\n  797 | \t\tseed_buf[seed_bufsz++] = (guint32)fwupd_remote_get_mtime(remote);\n  798 | \t\trand = g_rand_new_with_seed_array(seed_buf, seed_bufsz);\n  799 | \t\tseed = g_rand_int_range(rand, 0, G_MAXINT);\n  800 | \t}","lines":14,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/src/fu-engine-requirements.c#L787-L800"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In `contrib/ci/check-license.py`, the file list is built with `glob.glob(\"libfwupd/*.[c|h|py|rs]\")` for `libfwupd/` but the other three globs are missing the `*` wildcard: `glob.glob(\"libfwupdplugin/.[c|h|py|rs]\")`, `glob.glob(\"plugins/*/.[c|h|py|rs]\")`, and `glob.glob(\"src/.[c|h|py|rs]\")`. Each of these patterns only matches a literal dot followed by one of the listed characters (i.e. hidden dotfiles like `.c`), so they never match any real source file. Verified empirically: `glob.glob('libfwupdplugin/.[c|h|py|rs]')` returns `[]` on this repo, while `glob.glob('libfwupdplugin/*.[c|h|py|rs]')` returns hundreds of files. As a result this CI license/copyright checker silently never inspects any file under `libfwupdplugin/`, `plugins/*/`, or `src/` - it only ever checks `libfwupd/`, defeating the purpose of the check for the majority of the codebase.","fix":"Add the missing `*` wildcard to match the working `libfwupd/*.[c|h|py|rs]` pattern, e.g.:\n```python\nfor fn in (\n    glob.glob(\"libfwupd/*.[c|h|py|rs]\")\n    + glob.glob(\"libfwupdplugin/*.[c|h|py|rs]\")\n    + glob.glob(\"plugins/*/*.[c|h|py|rs]\")\n    + glob.glob(\"src/*.[c|h|py|rs]\")\n):\n```\nAlso note the bracket expression `[c|h|py|rs]` only matches a *single* character, so `.py` and `.rs` files are never matched either way; consider switching to separate globs or `fnmatch`/regex based matching for multi-character extensions.","locations":[{"ref":"contrib/ci/check-license.py:19-24","code":"   19 |     for fn in (\n   20 |         glob.glob(\"libfwupd/*.[c|h|py|rs]\")\n   21 |         + glob.glob(\"libfwupdplugin/.[c|h|py|rs]\")\n   22 |         + glob.glob(\"plugins/*/.[c|h|py|rs]\")\n   23 |         + glob.glob(\"src/.[c|h|py|rs]\")\n   24 |     ):","lines":6,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/contrib/ci/check-license.py#L19-L24"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`fu_chunk_array_new_from_bytes()`, `fu_chunk_array_new_virtual()` and `fu_chunk_array_new_from_stream()` in `fu-chunk-array.c` only validate `page_sz == 0 || page_sz >= packet_sz` and never reject `packet_sz == 0`. If `packet_sz` is `0`, `fu_chunk_array_calculate_chunk_for_offset()` computes `chunksz_tmp = MIN(self->packet_sz, self->total_size - offset)` which is always `0`, so `fu_chunk_array_ensure_offsets()` (called from all three constructors) enters `while (offset < self->total_size) { ...; offset += chunksz; }` with `chunksz` always `0`. Since `offset` never advances, this is an infinite loop that hangs the calling thread of the `fwupd` daemon whenever `total_size > 0`. The older sibling API `fu_chunk_array_new()` in `fu-chunk.c` explicitly guards against exactly this with `g_return_val_if_fail(packet_sz > 0, NULL);`, showing the check was simply forgotten when the newer `FuChunkArray`-based API was added. `packet_sz` is frequently derived from device/quirk-controlled values (e.g. `fu_cfi_device_get_page_size()`, which defaults from a quirk key parsed with a `0` lower bound in `fu_cfi_device_set_quirk_kv()`), so a misconfigured or crafted quirk/firmware value of `0` can trigger the hang.","fix":"Add the same guard that `fu_chunk_array_new()` already has to all three `FuChunkArray` constructors, e.g. in `fu_chunk_array_new_from_bytes()`:\n\n```c\ng_return_val_if_fail(blob != NULL, NULL);\ng_return_val_if_fail(packet_sz > 0, NULL);\ng_return_val_if_fail(page_sz == 0 || page_sz >= packet_sz, NULL);\n```\n\nand equivalently in `fu_chunk_array_new_virtual()` and `fu_chunk_array_new_from_stream()`. As defense in depth, `fu_chunk_array_ensure_offsets()` could also `g_return_if_fail`/`g_critical` and stop instead of looping when `chunksz` is computed as `0` for a non-empty buffer.","locations":[{"ref":"libfwupdplugin/fu-chunk-array.c:151-167","code":"  151 | static void\n  152 | fu_chunk_array_ensure_offsets(FuChunkArray *self)\n  153 | {\n  154 | \tgsize offset = 0;\n  155 | \twhile (offset < self->total_size) {\n  156 | \t\tgsize chunksz = 0;\n  157 | \t\tfu_chunk_array_calculate_chunk_for_offset(self, offset, NULL, NULL, &chunksz);\n  158 | \t\tg_array_append_val(self->offsets, offset);\n  159 | \t\tif (chunksz > G_MAXSIZE - offset) {\n  160 | \t\t\tg_critical(\"offset overflow at offset %zu with chunk size %zu\",\n  161 | \t\t\t\t   offset,\n  162 | \t\t\t\t   chunksz);\n  163 | \t\t\treturn;\n  164 | \t\t}\n  165 | \t\toffset += chunksz;\n  166 | \t}\n  167 | }","lines":17,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-chunk-array.c#L151-L167"},{"ref":"libfwupdplugin/fu-chunk-array.c:231-246","code":"  231 | FuChunkArray *\n  232 | fu_chunk_array_new_virtual(gsize bufsz, gsize addr_offset, gsize page_sz, gsize packet_sz)\n  233 | {\n  234 | \tg_autoptr(FuChunkArray) self = g_object_new(FU_TYPE_CHUNK_ARRAY, NULL);\n  235 | \n  236 | \tg_return_val_if_fail(page_sz == 0 || page_sz >= packet_sz, NULL);\n  237 | \n  238 | \tself->addr_offset = addr_offset;\n  239 | \tself->page_sz = page_sz;\n  240 | \tself->packet_sz = packet_sz;\n  241 | \tself->total_size = bufsz;\n  242 | \n  243 | \t/* success */\n  244 | \tfu_chunk_array_ensure_offsets(self);\n  245 | \treturn g_steal_pointer(&self);\n  246 | }","lines":16,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-chunk-array.c#L231-L246"},{"ref":"libfwupdplugin/fu-chunk.c:420-434","code":"  420 | GPtrArray *\n  421 | fu_chunk_array_new(const guint8 *data,\n  422 | \t\t   gsize data_sz,\n  423 | \t\t   gsize addr_offset,\n  424 | \t\t   gsize page_sz,\n  425 | \t\t   gsize packet_sz,\n  426 | \t\t   GError **error)\n  427 | {\n  428 | \tgsize offset = 0;\n  429 | \tg_autoptr(GPtrArray) chunks =\n  430 | \t    g_ptr_array_new_with_free_func((GDestroyNotify)g_object_unref);\n  431 | \n  432 | \tg_return_val_if_fail(page_sz == 0 || page_sz >= packet_sz, NULL);\n  433 | \tg_return_val_if_fail(packet_sz > 0, NULL);\n  434 | \tg_return_val_if_fail(error == NULL || *error == NULL, NULL);","lines":15,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-chunk.c#L420-L434"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In `fu_context_detect_hypervisor_privileged()` the check that decides whether to read the Xen `privileged` sysfs attribute is inverted: it only calls `g_file_get_contents(xen_privileged_fn, ...)` when `g_file_test(xen_privileged_fn, G_FILE_TEST_EXISTS)` returns `FALSE`, i.e. only when the file does *not* exist. `g_file_get_contents()` on a nonexistent path always fails, so the body of the `if` block is effectively dead code and `FU_CONTEXT_FLAG_IS_HYPERVISOR_PRIVILEGED` can never be set correctly, even on a genuinely privileged Xen dom0 where the file exists and contains `1`.","fix":"Remove the `!` negation so the contents are read when the file exists:\n\n```c\nif (g_file_test(xen_privileged_fn, G_FILE_TEST_EXISTS)) {\n\tg_autofree gchar *contents = NULL;\n\tif (g_file_get_contents(xen_privileged_fn, &contents, NULL, NULL)) {\n\t\tif (g_strcmp0(contents, \"1\") == 0) {\n\t\t\tfu_context_add_flag(self, FU_CONTEXT_FLAG_IS_HYPERVISOR_PRIVILEGED);\n\t\t\treturn;\n\t\t}\n\t}\n}\n```","locations":[{"ref":"libfwupdplugin/fu-context.c:1452-1476","code":" 1452 | static void\n 1453 | fu_context_detect_hypervisor_privileged(FuContext *self)\n 1454 | {\n 1455 | \tg_autofree gchar *xen_privileged_fn = NULL;\n 1456 | \n 1457 | \t/* privileged xen can access most hardware */\n 1458 | \txen_privileged_fn = fu_context_build_filename(self,\n 1459 | \t\t\t\t\t\t      NULL,\n 1460 | \t\t\t\t\t\t      FU_PATH_KIND_SYSFSDIR_FW_ATTRIB,\n 1461 | \t\t\t\t\t\t      \"hypervisor\",\n 1462 | \t\t\t\t\t\t      \"start_flags\",\n 1463 | \t\t\t\t\t\t      \"privileged\",\n 1464 | \t\t\t\t\t\t      NULL);\n 1465 | \tif (xen_privileged_fn == NULL)\n 1466 | \t\treturn;\n 1467 | \tif (!g_file_test(xen_privileged_fn, G_FILE_TEST_EXISTS)) {\n 1468 | \t\tg_autofree gchar *contents = NULL;\n 1469 | \t\tif (g_file_get_contents(xen_privileged_fn, &contents, NULL, NULL)) {\n 1470 | \t\t\tif (g_strcmp0(contents, \"1\") == 0) {\n 1471 | \t\t\t\tfu_context_add_flag(self, FU_CONTEXT_FLAG_IS_HYPERVISOR_PRIVILEGED);\n 1472 | \t\t\t\treturn;\n 1473 | \t\t\t}\n 1474 | \t\t}\n 1475 | \t}\n 1476 | }","lines":25,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-context.c#L1452-L1476"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In `fu_freebsd_efivars_get_data` (`libfwupdplugin/fu-freebsd-efivars.c`), the return value of `efi_get_variable()` is checked with `!= 0` to mean success: `return (efi_get_variable(guidt, name, data, data_sz, attr) != 0);`. Every other call in this same file (`efi_del_variable`, `efi_get_variable_size`) treats `0` as success and non-zero/negative as failure, matching the documented `libefivar` convention that `efi_get_variable()` returns `0` on success and `-1` on error. As written, `fu_freebsd_efivars_get_data` reports failure when the underlying call actually succeeded, and reports success (with `data`/`data_sz` left unset) when the call actually failed. This function backs both the `get_data` vfunc and, via `fu_freebsd_efivars_exists()`, the variable-existence check, so UEFI variable reads are effectively inverted on the FreeBSD backend.","fix":"Invert the check to match the rest of the file, e.g. `return (efi_get_variable(guidt, name, data, data_sz, attr) == 0);`.","locations":[{"ref":"libfwupdplugin/fu-freebsd-efivars.c:82-94","code":"   82 | static gboolean\n   83 | fu_freebsd_efivars_get_data(FuEfivars *efivars,\n   84 | \t\t\t    const gchar *guid,\n   85 | \t\t\t    const gchar *name,\n   86 | \t\t\t    guint8 **data,\n   87 | \t\t\t    gsize *data_sz,\n   88 | \t\t\t    FuEfiVariableAttrs *attr,\n   89 | \t\t\t    GError **error)\n   90 | {\n   91 | \tefi_guid_t guidt;\n   92 | \tefi_str_to_guid(guid, &guidt);\n   93 | \treturn (efi_get_variable(guidt, name, data, data_sz, attr) != 0);\n   94 | }","lines":13,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-freebsd-efivars.c#L82-L94"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`fu_genesys_usbhub_device_get_fw_bank_version` in `plugins/genesys/fu-genesys-usbhub-device.c` stores a backup copy of bank-1 firmware for GL3523 hubs with: `if (self->spec.chip.model == ISP_MODEL_HUB_GL3523 && bank_num == FW_BANK_1) self->hub_fw_bank1_data = g_steal_pointer(&blob);` (lines 937-938). This check is missing a `fw_type == FU_GENESYS_FW_TYPE_HUB` condition even though `fw_type` is a parameter of the function and the field is documented as `/* restore hub bank1 fw for backup */` (line 125). `fu_genesys_usbhub_device_prepare` calls this function for every firmware type present on the device (`FU_GENESYS_FW_TYPE_HUB`, then `FU_GENESYS_FW_TYPE_DEV_BRIDGE`, then `FU_GENESYS_FW_TYPE_PD`), each time for `FW_BANK_1`. Because the condition does not check `fw_type`, each subsequent call overwrites `self->hub_fw_bank1_data` with that other firmware type's bank-1 data, so by the time the loop finishes, `hub_fw_bank1_data` holds e.g. the PD firmware image instead of the hub firmware image. Later, if `self->backup_hub_fw_bank1` is set, `fu_genesys_usbhub_device_backup_hub_fw_bank1_to_bank2` writes this wrong firmware blob into the hub's bank-2 flash region, corrupting the device's backup firmware bank and potentially bricking the dual-bank fail-over mechanism.","fix":"Restrict the backup capture to the actual hub firmware type:\n```c\nif (self->spec.chip.model == ISP_MODEL_HUB_GL3523 && fw_type == FU_GENESYS_FW_TYPE_HUB &&\n    bank_num == FW_BANK_1)\n\tself->hub_fw_bank1_data = g_steal_pointer(&blob);\n```","locations":[{"ref":"plugins/genesys/fu-genesys-usbhub-device.c:851-931","code":"  851 | /* read the version from the firmware stored in the device */\n  852 | static gboolean\n  853 | fu_genesys_usbhub_device_get_fw_bank_version(FuGenesysUsbhubDevice *self,\n  854 | \t\t\t\t\t     FuGenesysFwType fw_type,\n  855 | \t\t\t\t\t     int bank_num,\n  856 | \t\t\t\t\t     FuProgress *progress,\n  857 | \t\t\t\t\t     GError **error)\n  858 | {\n  859 | \tgsize bufsz = 0;\n  860 | \tg_autoptr(GError) error_local = NULL;\n  861 | \tg_autoptr(GBytes) blob = NULL;\n  862 | \tg_autoptr(FuInputStream) stream = NULL;\n  863 | \tg_autofree guint8 *buf = NULL;\n  864 | \n  865 | \tg_return_val_if_fail(fw_type < FU_GENESYS_FW_TYPE_INSIDE_HUB_COUNT, FALSE);\n  866 | \tg_return_val_if_fail(bank_num < FW_BANK_COUNT, FALSE);\n  867 | \n  868 | \t/* check firmware type available */\n  869 | \tif (self->spec.fw_bank_capacity[fw_type] == 0) {\n  870 | \t\tg_set_error(error,\n  871 | \t\t\t    FWUPD_ERROR,\n  872 | \t\t\t    FWUPD_ERROR_NOT_SUPPORTED,\n  873 | \t\t\t    \"unsupported firmware type %s\",\n  874 | \t\t\t    fu_genesys_fw_type_to_string(fw_type));\n  875 | \t\treturn FALSE;\n  876 | \t}\n  877 | \n  878 | \t/* get bank firmware code size */\n  879 | \tif (!fu_genesys_usbhub_device_get_fw_bank_code_size(self,\n  880 | \t\t\t\t\t\t\t    fw_type,\n  881 | \t\t\t\t\t\t\t    bank_num,\n  882 | \t\t\t\t\t\t\t    &error_local)) {\n  883 | \t\tg_debug(\"ignoring firmware %s bank%d: %s\",\n  884 | \t\t\tfu_genesys_fw_type_to_string(fw_type),\n  885 | \t\t\tbank_num + 1,\n  886 | \t\t\terror_local->message);\n  887 | \t\tself->fw_bank_vers[bank_num][fw_type] = 0;\n  888 | \t\treturn TRUE;\n  889 | \t}\n  890 | \n  891 | \t/* get bank firmware from device */\n  892 | \tbufsz = self->fw_bank_code_sizes[bank_num][fw_type];\n  893 | \tbuf = g_malloc0(bufsz);\n  894 | \tif (!fu_genesys_usbhub_device_read_flash(self,\n  895 | \t\t\t\t\t\t self->spec.fw_bank_addr[bank_num][fw_type],\n  896 | \t\t\t\t\t\t buf,\n  897 | \t\t\t\t\t\t bufsz,\n  898 | \t\t\t\t\t\t progress,\n  899 | \t\t\t\t\t\t error))\n  900 | \t\treturn FALSE;\n  901 | \n  902 | \t/* verify bank firmware integrity */\n  903 | \tblob = g_bytes_new_take(g_steal_pointer(&buf), bufsz);\n  904 | \tstream = fu_memory_input_stream_new_from_bytes(blob);\n  905 | \tif (!fu_genesys_usbhub_firmware_verify_checksum(stream, &error_local)) {\n  906 | \t\tg_debug(\"ignoring firmware %s bank%d: %s\",\n  907 | \t\t\tfu_genesys_fw_type_to_string(fw_type),\n  908 | \t\t\tbank_num + 1,\n  909 | \t\t\terror_local->message);\n  910 | \t\tself->fw_bank_vers[bank_num][fw_type] = 0;\n  911 | \t\treturn TRUE;\n  912 | \t}\n  913 | \n  914 | \t/* get firmware version from bank firmware */\n  915 | \tif (!fu_memread_uint16_safe(g_bytes_get_data(blob, NULL),\n  916 | \t\t\t\t    g_bytes_get_size(blob),\n  917 | \t\t\t\t    GENESYS_USBHUB_VERSION_OFFSET,\n  918 | \t\t\t\t    &self->fw_bank_vers[bank_num][fw_type],\n  919 | \t\t\t\t    G_LITTLE_ENDIAN,\n  920 | \t\t\t\t    error)) {\n  921 | \t\tg_prefix_error_literal(error, \"failed to get version: \");\n  922 | \t\treturn FALSE;\n  923 | \t}\n  924 | \n  925 | \t/* keep hub bank 1 fw that may needs backup to bank2 later */\n  926 | \tif (self->spec.chip.model == ISP_MODEL_HUB_GL3523 && bank_num == FW_BANK_1)\n  927 | \t\tself->hub_fw_bank1_data = g_steal_pointer(&blob);\n  928 | \n  929 | \t/* success */\n  930 | \treturn TRUE;\n  931 | }","lines":81,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/genesys/fu-genesys-usbhub-device.c#L851-L931"},{"ref":"plugins/genesys/fu-genesys-usbhub-device.c:926-927","code":"  926 | \tif (self->spec.chip.model == ISP_MODEL_HUB_GL3523 && bank_num == FW_BANK_1)\n  927 | \t\tself->hub_fw_bank1_data = g_steal_pointer(&blob);","lines":2,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/plugins/genesys/fu-genesys-usbhub-device.c#L926-L927"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `docs/generate-oval.py`, the loop that validates required JSON keys (`id`, `name`, `failure-results`) uses `continue` inside the inner `for tag in [...]` loop when a key is missing. `continue` only advances to the next `tag`, it does not skip the `items.append(item)` call, which sits after the inner loop but still inside the outer `for fn in sorted(args.json_attrs)` loop. As a result every parsed JSON file is appended to `items` even when it is missing a required field, and the intended \"skip malformed input\" behavior never happens. Downstream code (e.g. `item['id']`, `item[\"name\"]`, `item[\"failure-results\"].items()`) then unconditionally indexes these keys and will raise a `KeyError` for any input missing them.","fix":"Track validity with a flag (or use a `for/else` construct) so the item is only appended when all required tags are present, e.g.:\n```python\nvalid = True\nfor tag in [\"id\", \"name\", \"failure-results\"]:\n    if tag not in item:\n        print(f\"skipping {fn} as no {tag}\")\n        valid = False\nif valid:\n    items.append(item)\n```","locations":[{"ref":"docs/generate-oval.py:36-40","code":"   36 |         for tag in [\"id\", \"name\", \"failure-results\"]:\n   37 |             if tag not in item:\n   38 |                 print(\"skipping {} as no {}\".format(fn), tag)\n   39 |                 continue\n   40 |         items.append(item)","lines":5,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/docs/generate-oval.py#L36-L40"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `fwupd_client_download_bytes_thread_cb`, the loop over `helper->urls` tries each URL and, on a plain download failure, logs `\"failed to download %s: %s, trying next URI...\"` and continues to the next URL unless it was the last one. However, if `fwupd_client_curl_helper_set_proxy(self, helper, url, &error)` fails for URL `i` (e.g. a proxy-resolver error for that specific host), the function immediately calls `g_task_return_error(task, g_steal_pointer(&error))` and returns, aborting the whole multi-URL download attempt instead of falling back to the remaining URLs (which may include P2P/localhost mirrors that don't need the failing proxy). This is inconsistent with the fallback behavior used for actual download errors a few lines below.","fix":"Treat a proxy-resolution failure the same way as a download failure: keep the error, skip to the next URL unless it is the last one, e.g.:\n```c\nif (!fwupd_client_curl_helper_set_proxy(self, helper, url, &error)) {\n        if (i == helper->urls->len - 1) {\n                g_task_return_error(task, g_steal_pointer(&error));\n                return;\n        }\n        g_debug(\"failed to set proxy for %s: %s, trying next URI...\", url, error->message);\n        continue;\n}\n```","locations":[{"ref":"libfwupd/fwupd-client.c:6521-6563","code":" 6521 | static void\n 6522 | fwupd_client_download_bytes_thread_cb(GTask *task,\n 6523 | \t\t\t\t      gpointer source_object,\n 6524 | \t\t\t\t      gpointer task_data,\n 6525 | \t\t\t\t      GCancellable *cancellable)\n 6526 | {\n 6527 | \tFwupdClient *self = FWUPD_CLIENT(source_object);\n 6528 | \tFwupdCurlHelper *helper = g_task_get_task_data(task);\n 6529 | \tg_autoptr(GBytes) blob = NULL;\n 6530 | \n 6531 | \tfor (guint i = 0; i < helper->urls->len; i++) {\n 6532 | \t\tconst gchar *url = g_ptr_array_index(helper->urls, i);\n 6533 | \t\tg_autoptr(GError) error = NULL;\n 6534 | \t\tg_info(\"downloading %s\", url);\n 6535 | \t\tif (!fwupd_client_curl_helper_set_proxy(self, helper, url, &error)) {\n 6536 | \t\t\tg_task_return_error(task, g_steal_pointer(&error));\n 6537 | \t\t\treturn;\n 6538 | \t\t}\n 6539 | \t\tif (fwupd_client_is_url_http(url)) {\n 6540 | \t\t\tblob = fwupd_client_download_http_retry(self, helper->curl, url, &error);\n 6541 | \t\t\tif (blob != NULL)\n 6542 | \t\t\t\tbreak;\n 6543 | \t\t} else if (fwupd_client_is_url_ipfs(url)) {\n 6544 | \t\t\tblob = fwupd_client_download_ipfs(self, url, cancellable, &error);\n 6545 | \t\t\tif (blob != NULL)\n 6546 | \t\t\t\tbreak;\n 6547 | \t\t} else {\n 6548 | \t\t\tg_set_error(&error,\n 6549 | \t\t\t\t    FWUPD_ERROR,\n 6550 | \t\t\t\t    FWUPD_ERROR_INVALID_FILE,\n 6551 | \t\t\t\t    \"not sure how to handle: %s\",\n 6552 | \t\t\t\t    url);\n 6553 | \t\t\t/* nocheck:error-false-return */\n 6554 | \t\t}\n 6555 | \t\tif (i == helper->urls->len - 1) {\n 6556 | \t\t\tg_task_return_error(task, g_steal_pointer(&error));\n 6557 | \t\t\treturn;\n 6558 | \t\t}\n 6559 | \t\tfwupd_client_set_percentage(self, 0.0);\n 6560 | \t\tg_info(\"failed to download %s: %s, trying next URI…\", url, error->message);\n 6561 | \t}\n 6562 | \tg_task_return_pointer(task, g_steal_pointer(&blob), (GDestroyNotify)g_bytes_unref);\n 6563 | }","lines":43,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupd/fwupd-client.c#L6521-L6563"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`fu_acpi_table_parse()` validates that `length <= streamsz` (allowing the input `stream` to be *larger* than the ACPI table, e.g. when several tables or trailing data are concatenated in the same blob), but then calls `fu_input_stream_compute_sum8(stream, &checksum_actual, error)` which sums **the entire stream**, not just the `length` bytes that belong to this table. Any bytes in `stream` beyond the table's declared `length` are incorrectly folded into the checksum, causing valid ACPI tables embedded in a larger stream to spuriously fail checksum validation (or, in principle, a corrupted table to pass if the trailing bytes happen to cancel the error). The same file's sibling parser convention (see `fu-efi-file.c`, which builds a `partial_stream` limited to the relevant length before calling `fu_input_stream_compute_sum8()`) shows this is the established, correct pattern that was not followed here.","fix":"Create a length-bounded partial stream before computing the checksum, e.g.:\n```c\ng_autoptr(FuInputStream) table_stream =\n    fu_partial_input_stream_new(stream, 0x0, length, error);\nif (table_stream == NULL)\n\treturn FALSE;\n...\nif (!fu_input_stream_compute_sum8(table_stream, &checksum_actual, error))\n\treturn FALSE;\n```","locations":[{"ref":"libfwupdplugin/fu-acpi-table.c:167-197","code":"  167 | \t/* length */\n  168 | \tlength = fu_struct_acpi_table_get_length(st);\n  169 | \tif (!fu_input_stream_size(stream, &streamsz, error))\n  170 | \t\treturn FALSE;\n  171 | \tif (length > streamsz || length < st->buf->len) {\n  172 | \t\tg_set_error(error,\n  173 | \t\t\t    FWUPD_ERROR,\n  174 | \t\t\t    FWUPD_ERROR_INVALID_DATA,\n  175 | \t\t\t    \"table length not valid: got 0x%x but expected 0x%x\",\n  176 | \t\t\t    (guint)streamsz,\n  177 | \t\t\t    (guint)length);\n  178 | \t\treturn FALSE;\n  179 | \t}\n  180 | \tfu_firmware_set_size(firmware, length);\n  181 | \n  182 | \t/* checksum */\n  183 | \tif ((flags & FU_FIRMWARE_PARSE_FLAG_IGNORE_CHECKSUM) == 0) {\n  184 | \t\tguint8 checksum_actual = 0;\n  185 | \t\tif (!fu_input_stream_compute_sum8(stream, &checksum_actual, error))\n  186 | \t\t\treturn FALSE;\n  187 | \t\tif (checksum_actual != 0x0) {\n  188 | \t\t\tguint8 checksum = fu_struct_acpi_table_get_checksum(st);\n  189 | \t\t\tg_set_error(error,\n  190 | \t\t\t\t    FWUPD_ERROR,\n  191 | \t\t\t\t    FWUPD_ERROR_INTERNAL,\n  192 | \t\t\t\t    \"CRC failed, expected 0x%02x, got 0x%02x\",\n  193 | \t\t\t\t    (guint)checksum - checksum_actual,\n  194 | \t\t\t\t    checksum);\n  195 | \t\t\treturn FALSE;\n  196 | \t\t}\n  197 | \t}","lines":31,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-acpi-table.c#L167-L197"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`fu_backend_set_enabled()` in `fu-backend.c` completely ignores the `enabled` argument passed by the caller and unconditionally sets `priv->enabled = FALSE`. Any caller that tries to re-enable a backend with `fu_backend_set_enabled(self, TRUE)` will silently leave (or force) it disabled, which is a functional regression from the clear intent of the setter (and from `fu_backend_get_enabled()`, which correctly returns `priv->enabled`).","fix":"Assign the passed-in argument instead of hardcoding `FALSE`:\n```c\nvoid\nfu_backend_set_enabled(FuBackend *self, gboolean enabled)\n{\n\tFuBackendPrivate *priv = GET_PRIVATE(self);\n\tg_return_if_fail(FU_IS_BACKEND(self));\n\tpriv->enabled = enabled;\n}\n```","locations":[{"ref":"libfwupdplugin/fu-backend.c:623-629","code":"  623 | void\n  624 | fu_backend_set_enabled(FuBackend *self, gboolean enabled)\n  625 | {\n  626 | \tFuBackendPrivate *priv = GET_PRIVATE(self);\n  627 | \tg_return_if_fail(FU_IS_BACKEND(self));\n  628 | \tpriv->enabled = FALSE;\n  629 | }","lines":7,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-backend.c#L623-L629"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`fu_bios_setting_set_enumeration_attrs()` iterates over both possible delimiters (`,` and `;`) and, for every delimiter that appears in `str`, splits the whole string on it and adds every resulting piece as a possible value via `fwupd_bios_setting_add_possible_value()`. If `str` happens to contain both delimiters (e.g. `\"Enabled,Disabled;Auto\"`), the loop runs for both `,` and `;` without ever stopping after the first match, so the attribute ends up with duplicated and partially-unsplit possible values (e.g. `\"Enabled\"`, `\"Disabled;Auto\"`, `\"Enabled,Disabled\"`, `\"Auto\"`) instead of a clean split on the single delimiter actually used by the sysfs driver.","fix":"Stop after the first delimiter that matches:\n```c\nfor (guint j = 0; delimiters[j] != NULL; j++) {\n\tg_auto(GStrv) vals = NULL;\n\tif (g_strrstr(str, delimiters[j]) == NULL)\n\t\tcontinue;\n\tvals = fu_strsplit(str, strlen(str), delimiters[j], -1);\n\tif (vals[0] != NULL)\n\t\tfwupd_bios_setting_set_kind(attr, FWUPD_BIOS_SETTING_KIND_ENUMERATION);\n\tfor (guint i = 0; vals[i] != NULL && vals[i][0] != '\\0'; i++)\n\t\tfwupd_bios_setting_add_possible_value(attr, vals[i]);\n\tbreak;\n}\n```","locations":[{"ref":"libfwupdplugin/fu-bios-settings.c:125-144","code":"  125 | static gboolean\n  126 | fu_bios_setting_set_enumeration_attrs(FwupdBiosSetting *attr, GError **error) /* nocheck:name */\n  127 | {\n  128 | \tconst gchar *delimiters[] = {\",\", \";\", NULL};\n  129 | \tg_autofree gchar *str = NULL;\n  130 | \n  131 | \tif (!fu_bios_setting_get_key(attr, \"possible_values\", &str, error))\n  132 | \t\treturn FALSE;\n  133 | \tfor (guint j = 0; delimiters[j] != NULL; j++) {\n  134 | \t\tg_auto(GStrv) vals = NULL;\n  135 | \t\tif (g_strrstr(str, delimiters[j]) == NULL)\n  136 | \t\t\tcontinue;\n  137 | \t\tvals = fu_strsplit(str, strlen(str), delimiters[j], -1);\n  138 | \t\tif (vals[0] != NULL)\n  139 | \t\t\tfwupd_bios_setting_set_kind(attr, FWUPD_BIOS_SETTING_KIND_ENUMERATION);\n  140 | \t\tfor (guint i = 0; vals[i] != NULL && vals[i][0] != '\\0'; i++)\n  141 | \t\t\tfwupd_bios_setting_add_possible_value(attr, vals[i]);\n  142 | \t}\n  143 | \treturn TRUE;\n  144 | }","lines":20,"link":"https://github.com/fwupd/fwupd/blob/42722802b1042cb62db29340078dd6fd7872b42c/libfwupdplugin/fu-bios-settings.c#L125-L144"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"hard","description":"`fu_crc_find()` iterates over every row of `crc_map[]`, including `crc_map[0]` which is the `FU_CRC_KIND_UNKNOWN` sentinel entry (`{FU_CRC_KIND_UNKNOWN, 32, 0x00000000, 0x00000000, TRUE, 0xFFFFFFFF}`, i.e. `poly=0`). Because `poly` is `0`, `fu_crc32_step()`'s shift register never mixes in any polynomial feedback, so for an all-zero input buffer the CRC register never leaves `0`; after `fu_crc32_done()` applies `reflect()` (no-op on `0`) and XORs with `xorout=0xFFFFFFFF`, the result is always exactly `0xFFFFFFFF`. This means `fu_crc_find()` called on any all-zero (or otherwise `poly=0`-friendly) buffer will report a spurious match against the meaningless `FU_CRC_KIND_UNKNOWN` \"CRC\", either causing a legitimate single match to instead be reported as ambiguous (`match_cnt > 1` -> `FWUPD_ERROR_NOT_FOUND`, \"multiple CRC kinds matched\"), or, if no other kind matches, returning success with `*kind = FU_CRC_KIND_UNKNOWN` -- the very value the API uses to mean \"no known CRC kind\", violating the function's own contract.","fix":"Skip the `FU_CRC_KIND_UNKNOWN` placeholder row when searching for a match:\n```c\nfor (guint i = 0; i < G_N_ELEMENTS(crc_map); i++) {\n\tif (crc_map[i].kind == FU_CRC_KIND_UNKNOWN)\n\t\tcontinue;\n\t...\n}\n```","locations":[{"ref":"libfwupdplugin/fu-crc.c:17-62","code":"   17 | static const struct {\n   18 | \tFuCrcKind kind;\n   19 | \tguint bitwidth;\n   20 | \tguint32 poly;\n   21 | \tguint32 init;\n   22 | \tgboolean reflected;\n   23 | \tguint32 xorout;\n   24 | } crc_map[] = {\n   25 |     {FU_CRC_KIND_UNKNOWN, 32, 0x00000000, 0x00000000, TRUE, 0xFFFFFFFF},\n   26 |     {FU_CRC_KIND_B32_STANDARD, 32, 0x04C11DB7, 0xFFFFFFFF, TRUE, 0xFFFFFFFF},\n   27 |     {FU_CRC_KIND_B32_BZIP2, 32, 0x04C11DB7, 0xFFFFFFFF, FALSE, 0xFFFFFFFF},\n   28 |     {FU_CRC_KIND_B32_JAMCRC, 32, 0x04C11DB7, 0xFFFFFFFF, TRUE, 0x00000000},\n   29 |
