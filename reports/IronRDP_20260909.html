{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"very_easy","description":"In `ClientCoreOptionalData::decode`, two trailing optional fields are read with the non-fallible `src.read_u32()` instead of the `try_read_u32()`/`try_or_return!` pattern used everywhere else in the same function. `read_u32()` performs `self.inner[self.pos..self.pos + 4]` slicing (via `read_array`), which panics on out-of-bounds. Because the enclosing block is scoped to an attacker-controlled slice length (the GCC UserDataHeader `blockLen`), a malicious client can send a Client Core Data block that ends immediately after `desktopPhysicalWidth` (0..3 bytes remaining) or after `desktopScaleFactor`, making the subsequent `read_u32()` index past the end and panic. This is a network-reachable server-side DoS. The preceding fields (`desktop_physical_width` at line 463, `desktop_scale_factor` at line 468) correctly use `try_read_u32`, so reaching these lines with insufficient bytes is trivial.","fix":"Use the fallible reads consistent with the rest of the function so truncated input returns the partially-parsed struct rather than panicking.\n\nBefore (line 464-465):\n```rust\n        // physical height must be present, if the physical width is present\n        optional_data.desktop_physical_height = Some(src.read_u32());\n```\nAfter:\n```rust\n        // physical height must be present, if the physical width is present\n        optional_data.desktop_physical_height = Some(try_or_return!(src.try_read_u32(), optional_data));\n```\n\nBefore (line 469-470):\n```rust\n        // device scale factor must be present, if the desktop scale factor is present\n        optional_data.device_scale_factor = Some(src.read_u32());\n```\nAfter:\n```rust\n        // device scale factor must be present, if the desktop scale factor is present\n        optional_data.device_scale_factor = Some(try_or_return!(src.try_read_u32(), optional_data));\n```","locations":[{"ref":"crates/ironrdp-pdu/src/gcc/core_data/client.rs:453","code":"  453 |         optional_data.desktop_physical_height = Some(src.read_u32());","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-pdu/src/gcc/core_data/client.rs#L453"},{"ref":"crates/ironrdp-pdu/src/gcc/core_data/client.rs:458","code":"  458 |         optional_data.device_scale_factor = Some(src.read_u32());","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-pdu/src/gcc/core_data/client.rs#L458"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"RemoteFX tile decoding indexes the quant table with per-tile quant indices taken directly from the wire, without validating them against the number of announced quants. `map_tiles_data` does `quants[usize::from(t.y_quant_index)]` (and cb/cr) where `quants` has length `number_of_quants` (a u8, possibly 0) and each `t.*_quant_index` is an unvalidated u8 from `Tile::decode`. A malicious/ malformed RFX server can send a tile whose quant index is >= the quant count, causing an out-of-bounds slice index and a client-side panic (DoS). This is reached from `Processor::process` -> `process_surface_commands` (CODEC_ID_REMOTEFX) -> `rfx::DecodingContext::decode` -> `process_frame` -> `map_tiles_data`.","fix":"Validate each tile's quant indices before indexing. For example, in `map_tiles_data` return a `SessionResult` and check bounds:\n```rust\nfn map_tiles_data<'a>(tiles: &[Tile<'a>], quants: &[Quant]) -> SessionResult<Vec<TileData<'a>>> {\n    let get = |idx: u8| -> SessionResult<Quant> {\n        quants.get(usize::from(idx))\n            .cloned()\n            .ok_or_else(|| reason_err!(\"rfx\", \"tile quant index {} out of range (have {})\", idx, quants.len()))\n    };\n    tiles.iter().map(|t| Ok(TileData {\n        quants: [get(t.y_quant_index)?, get(t.cb_quant_index)?, get(t.cr_quant_index)?],\n        data: [t.y_data, t.cb_data, t.cr_data],\n    })).collect()\n}\n```\nand propagate the error from `process_frame` (the `.zip(map_tiles_data(...))` call). Alternatively validate all tile indices right after `TileSetPdu::decode`.","locations":[{"ref":"crates/ironrdp-session/src/rfx.rs:269-281","code":"  269 | fn map_tiles_data<'a>(tiles: &[Tile<'a>], quants: &[Quant]) -> Vec<TileData<'a>> {\n  270 |     tiles\n  271 |         .iter()\n  272 |         .map(|t| TileData {\n  273 |             quants: [\n  274 |                 quants[usize::from(t.y_quant_index)].clone(),\n  275 |                 quants[usize::from(t.cb_quant_index)].clone(),\n  276 |                 quants[usize::from(t.cr_quant_index)].clone(),\n  277 |             ],\n  278 |             data: [t.y_data, t.cb_data, t.cr_data],\n  279 |         })\n  280 |         .collect()\n  281 | }","lines":13,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-session/src/rfx.rs#L269-L281"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"`std::io::Read for ReadCursor::read` copies with `buf.copy_from_slice(to_copy)` where `to_copy` has length `n_to_copy = min(buf.len(), self.len())`. When the cursor has fewer remaining bytes than the destination buffer (`self.len() < buf.len()`), `to_copy.len() < buf.len()`, and `copy_from_slice` panics on the length mismatch instead of performing a valid short read. This violates the `io::Read` contract and panics on ordinary input (e.g. any `read_to_end`/`BufReader`/generic reader that offers a larger buffer than the bytes remaining).","fix":"Copy into only the filled prefix of the destination. Before:\n```rust\nfn read(&mut self, buf: &mut [u8]) -> std::io::Result<usize> {\n    let n_to_copy = core::cmp::min(buf.len(), self.len());\n    let to_copy = self.read_slice(n_to_copy);\n    buf.copy_from_slice(to_copy);\n    Ok(n_to_copy)\n}\n```\nAfter:\n```rust\nfn read(&mut self, buf: &mut [u8]) -> std::io::Result<usize> {\n    let n_to_copy = core::cmp::min(buf.len(), self.len());\n    let to_copy = self.read_slice(n_to_copy);\n    buf[..n_to_copy].copy_from_slice(to_copy);\n    Ok(n_to_copy)\n}\n```","locations":[{"ref":"crates/ironrdp-core/src/cursor.rs:506-511","code":"  506 |     fn read(&mut self, buf: &mut [u8]) -> std::io::Result<usize> {\n  507 |         let n_to_copy = core::cmp::min(buf.len(), self.len());\n  508 |         let to_copy = self.read_slice(n_to_copy);\n  509 |         buf.copy_from_slice(to_copy);\n  510 |         Ok(n_to_copy)\n  511 |     }","lines":6,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-core/src/cursor.rs#L506-L511"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"In the gateway read path, `header_length` comes from the wire (`PktHdr.length`, a u32) and `hdr.size()` is the fixed 8-byte header. Both `assert!(cur.len() >= header_length - hdr.size())` (worker loop) and `if cur.len() != header_length - hdr.size()` (read_packet) subtract without checking `header_length >= hdr.size()`. A malicious/broken gateway sending `length < 8` triggers an integer-underflow panic; the `assert!` additionally panics (DoS) on any well-formed-but-short frame rather than returning an error.","fix":"Compute the body length with `checked_sub` and turn failures into `GwErrorKind::Decode`/`PacketEof` errors instead of asserting/subtracting, e.g. `let body_len = header_length.checked_sub(hdr.size()).ok_or_else(|| Error::new(\"PktHdr too small\", GwErrorKind::Decode))?;` then compare `cur.len()` to `body_len`; replace the `assert!` with the same error return.","locations":[{"ref":"crates/ironrdp-mstsgu/src/lib.rs:505-506","code":"  505 |                         let header_length = usize::try_from(hdr.length).map_err(|_| Error::new(\"PktHdr too big\", GwErrorKind::Decode))?;\n  506 |                         assert!(cur.len() >= header_length - hdr.size());","lines":2,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-mstsgu/src/lib.rs#L505-L506"},{"ref":"crates/ironrdp-mstsgu/src/lib.rs:646-650","code":"  646 |         let header_length =\n  647 |             usize::try_from(hdr.length).map_err(|_| Error::new(\"PktHdr too big\", GwErrorKind::Decode))?;\n  648 |         if cur.len() != header_length - hdr.size() {\n  649 |             return Err(Error::new(\"read_packet\", GwErrorKind::PacketEof));\n  650 |         }","lines":5,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-mstsgu/src/lib.rs#L646-L650"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"query_volume_information converts filesystem statistics from statvfs (u64 counts) into u32 with `u32::try_from(...).unwrap()`. volume_serial_number is derived from `statvfs.blocks_available()`, which routinely exceeds u32::MAX on large volumes (e.g. a ~20 TB filesystem with 4 KiB blocks has >5 billion available blocks). When a redirected drive backed by such a filesystem receives a FileFsVolumeInformation query from the server, the `.unwrap()` panics and crashes the client. The trigger (the volume-information query) is server-controlled; the overflow condition is a normal large local drive.","fix":"Avoid `.unwrap()` on these conversions. Use a saturating/truncating cast for the serial number (e.g. `statvfs.blocks_available() as u32` after masking, or `u32::try_from(x).unwrap_or(u32::MAX)`), and for the alloc-unit counts return an UNSUCCESSFUL response instead of panicking when the value does not fit.","locations":[{"ref":"crates/ironrdp-rdpdr-native/src/nix/backend.rs:343","code":"  343 |                                         volume_serial_number: u32::try_from(statvfs.blocks_available()).unwrap(),","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-rdpdr-native/src/nix/backend.rs#L343"},{"ref":"crates/ironrdp-rdpdr-native/src/nix/backend.rs:294-297","code":"  294 |                         total_alloc_units: i64::try_from(statvfs.blocks()).unwrap(),\n  295 |                         caller_available_alloc_units: i64::try_from(statvfs.blocks_available()).unwrap(),\n  296 |                         actual_available_alloc_units: i64::try_from(statvfs.blocks_available()).unwrap(),\n  297 |                         sectors_per_alloc_unit: u32::try_from(statvfs.fragment_size()).unwrap(),","lines":4,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-rdpdr-native/src/nix/backend.rs#L294-L297"},{"ref":"crates/ironrdp-rdpdr-native/src/nix/backend.rs:359-361","code":"  359 |                                         total_alloc_units: i64::try_from(statvfs.blocks()).unwrap(),\n  360 |                                         available_alloc_units: i64::try_from(statvfs.blocks_free()).unwrap(),\n  361 |                                         sectors_per_alloc_unit: u32::try_from(statvfs.fragment_size()).unwrap(),","lines":3,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-rdpdr-native/src/nix/backend.rs#L359-L361"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In `find_match_length`, the quick-reject heuristic indexes `buf[chunk_offset + max_match_length + 1]` guarded only by `match_offset + max_match_length + 1 < buf_end`. When the caller (`find_all_matches`) enters via the `chunk_offset > src_size + history_offset` sub-condition (a stale chunk-table entry pointing past the current block), `chunk_offset` can be larger than `match_offset` and as high as ~2,000,000 (a leftover offset from before the 2 MB history wrapped in `compress_l1`). `chunk_offset` is only rejected when strictly greater than `history_buffer_size` (line 789, uses `>`), so `chunk_offset == history_buffer_size - k` is allowed, and `chunk_offset + max_match_length + 1` can equal or exceed `buf.len()` (2,000,000), causing an out-of-bounds slice index panic. The 8-byte fast-path loop (`fc + 8 < buf.len()`) is safe, but the single-byte quick-reject read is not bounded on the chunk side. Only reachable in the XCRUSH compression (outbound) path after the 2 MB history fills and wraps, so it is not attacker-controlled, and XCRUSH (RDP6.1) is not the default bulk codec.","fix":"Bound the chunk side of the quick-reject before indexing, e.g. require both sides in-range:\n```rust\nif match_offset + max_match_length + 1 < buf_end\n    && chunk_offset + max_match_length + 1 < buf.len()\n    && buf[match_offset + max_match_length + 1] != buf[chunk_offset + max_match_length + 1]\n{\n    return Ok(None);\n}\n```\nAlternatively reject `chunk_offset >= history_buffer_size` (use `>=` at line 789) and ensure `chunk_offset` cannot exceed `buf_end` when passed in.","locations":[{"ref":"crates/ironrdp-bulk/src/xcrush/mod.rs:806-811","code":"  806 |         // Quick-reject heuristic: if byte at max_match_length+1 doesn't match, skip\n  807 |         if match_offset + max_match_length + 1 < buf_end\n  808 |             && buf[match_offset + max_match_length + 1] != buf[chunk_offset + max_match_length + 1]\n  809 |         {\n  810 |             return Ok(None);\n  811 |         }","lines":6,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-bulk/src/xcrush/mod.rs#L806-L811"},{"ref":"crates/ironrdp-bulk/src/xcrush/mod.rs:930-940","code":"  930 |                         if chunk_offset < history_offset\n  931 |                             || chunk_offset < offset as usize\n  932 |                             || chunk_offset > src_size + history_offset\n  933 |                         {\n  934 |                             let result = self.find_match_length(\n  935 |                                 offset as usize,\n  936 |                                 chunk_offset,\n  937 |                                 history_offset,\n  938 |                                 src_size,\n  939 |                                 max_match_length,\n  940 |                             )?;","lines":11,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-bulk/src/xcrush/mod.rs#L930-L940"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`handle_input_events` calls `receiver.recv().unwrap()` and `input_pdu.to_buffer(&mut data).unwrap()`. When the GUI event sender is dropped (window closed / event loop exits) `recv()` returns `Err` and the task panics instead of terminating cleanly; a serialization failure in `to_buffer` likewise aborts. This is in `ironrdp-client-glutin`, which is excluded from the workspace and does not compile, so impact is dev-only.","fix":"Break out of the loop on `recv()` error (`let Ok(event) = receiver.recv() else { break; }`) and propagate/log the `to_buffer` error instead of `unwrap()`.","locations":[{"ref":"crates/ironrdp-client-glutin/src/gui/input.rs:18","code":"   18 |         let event = receiver.recv().unwrap();","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-client-glutin/src/gui/input.rs#L18"},{"ref":"crates/ironrdp-client-glutin/src/gui/input.rs:25","code":"   25 |         input_pdu.to_buffer(&mut data).unwrap();","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-client-glutin/src/gui/input.rs#L25"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`ClipboardPalette::encode` writes `entries.len()*4` bytes via `write_u8` without a bounds guard, unlike every other `Encode` impl in the crate (e.g. `PackedMetafile::encode` uses `ensure_size!`). `WriteCursor::write_u8`/`write_array` index the backing slice directly and panic on overflow. Internal callers presize the buffer via `size()`, so it is safe today, but the public `Encode` impl will panic (rather than return an `EncodeError`) if a caller encodes into an undersized buffer, breaking the defensive convention used elsewhere.","fix":"Add `ensure_size!(in: dst, size: self.size());` at the start of `ClipboardPalette::encode`, matching the pattern used by `PackedMetafile::encode` and the other PDU encoders.\n\nBefore:\n```rust\nfn encode(&self, dst: &mut WriteCursor<'_>) -> EncodeResult<()> {\n    for entry in &self.entries {\n```\nAfter:\n```rust\nfn encode(&self, dst: &mut WriteCursor<'_>) -> EncodeResult<()> {\n    ensure_size!(in: dst, size: self.size());\n    for entry in &self.entries {\n```\n(and import `ensure_size` from `ironrdp_core`).","locations":[{"ref":"crates/ironrdp-cliprdr/src/pdu/format_data/palette.rs:31-41","code":"   31 | impl Encode for ClipboardPalette {\n   32 |     fn encode(&self, dst: &mut WriteCursor<'_>) -> EncodeResult<()> {\n   33 |         for entry in &self.entries {\n   34 |             dst.write_u8(entry.red);\n   35 |             dst.write_u8(entry.green);\n   36 |             dst.write_u8(entry.blue);\n   37 |             dst.write_u8(entry.extra);\n   38 |         }\n   39 | \n   40 |         Ok(())\n   41 |     }","lines":11,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-cliprdr/src/pdu/format_data/palette.rs#L31-L41"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`QuantQuality::encode` packs `quantization_parameter` via `data.set_bits(0..6, self.quantization_parameter)`. `bit_field::set_bits` panics if the value has any 1-bits outside the 6-bit range, i.e. when `quantization_parameter >= 64`. The field is a public `u8` (documented range 0-51 but not enforced), reachable e.g. via `Avc420Region::new(..)` -> `encode_avc420_bitmap_stream` on the server-side encode path, which will panic instead of returning an `EncodeResult` error. This is encode/server-side (not the hostile decode path), hence low severity, but it is a reachable panic with out-of-range but type-valid input.","fix":"Validate and return an error instead of panicking, e.g. before `set_bits`:\n```rust\nif self.quantization_parameter > 0x3F {\n    return Err(invalid_field_err!(\"quantization_parameter\", \"must fit in 6 bits\"));\n}\n```\nor mask the value (`self.quantization_parameter & 0x3F`) if silently clamping is acceptable.","locations":[{"ref":"crates/ironrdp-egfx/src/pdu/avc.rs:44-46","code":"   44 |         let mut data = 0u8;\n   45 |         data.set_bits(0..6, self.quantization_parameter);\n   46 |         data.set_bit(7, self.progressive);","lines":3,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-egfx/src/pdu/avc.rs#L44-L46"}]},
{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"Timestamp::encode packs each field with bit_field::set_bits into a fixed bit width (milliseconds/hours: 10 bits, seconds/minutes: 6 bits). set_bits panics when a value exceeds the requested width. The Timestamp struct fields are public u16/u8 whose full ranges (e.g. milliseconds up to 65535, seconds up to 255) far exceed those widths, so encoding a manually constructed Timestamp panics. Not reachable through decode (Timestamp::decode masks each field) nor through server make_timestamp (bounded by %), so it is a latent API-misuse panic rather than a network-reachable one.","fix":"Mask each field to its wire width before calling `set_bits` (mirroring the manual `Arbitrary` impl), e.g. `timestamp.set_bits(..10, u32::from(self.milliseconds) & 0x03FF);` and similarly for the others, or return an `EncodeResult` error when a field is out of range instead of panicking.","locations":[{"ref":"crates/ironrdp-egfx/src/pdu/cmd.rs:991-994","code":"  991 |         timestamp.set_bits(..10, u32::from(self.milliseconds));\n  992 |         timestamp.set_bits(10..16, u32::from(self.seconds));\n  993 |         timestamp.set_bits(16..22, u32::from(self.minutes));\n  994 |         timestamp.set_bits(22.., u32::from(self.hours));","lines":4,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-egfx/src/pdu/cmd.rs#L991-L994"}]},
{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"DrawingTextures::bind slices the decoded YUV buffer as data[0..luma], data[luma..luma+chroma], data[luma+chroma..] where luma = stride_0 * height and chroma = stride_1 * height/2. If the decoded H.264 buffer is smaller than luma+chroma (e.g. a decoder returning fewer bytes than the surface strides imply), these slice operations panic with out-of-bounds. Excluded, non-compiling crate, so low severity.","fix":"Validate `data.len() >= luma + chroma` and return an error (or clamp) before slicing, rather than relying on the decoder output matching the expected stride layout.","locations":[{"ref":"crates/ironrdp-glutin-renderer/src/draw.rs:98-107","code":"   98 |     pub unsafe fn bind(&self, gl: &Context, data: &[u8], stride_0: usize, stride_1: usize) {\n   99 |         let luma = stride_0 * self.height as usize;\n  100 |         let chroma = stride_1 * (self.height as usize / 2);\n  101 |         let y_pixels = &data[0..luma];\n  102 |         let u_pixels = &data[luma..luma + chroma];\n  103 |         let v_pixels = &data[luma + chroma..];\n  104 | \n  105 |         self.y.bind_texture(gl, y_pixels, stride_0 as i32);\n  106 |         self.u.bind_texture(gl, u_pixels, stride_1 as i32);\n  107 |         self.v.bind_texture(gl, v_pixels, stride_1 as i32);","lines":10,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-glutin-renderer/src/draw.rs#L98-L107"}]},
{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In draw_cached, when no explicit location is set the fallback rectangle uses `right: self.width - 1` and `bottom: self.height - 1`. width/height originate from a server-controlled CreateSurfacePdu (u16). A width or height of 0 causes an unsigned underflow (panic in debug, wrap to 65535 in release). This crate is excluded from the workspace and does not compile, so severity is low.","fix":"Use `self.width.saturating_sub(1)` and `self.height.saturating_sub(1)`, or reject/guard zero-sized surfaces at creation time.","locations":[{"ref":"crates/ironrdp-glutin-renderer/src/surface.rs:256-259","code":"  256 |                     right: self.width - 1,\n  257 |                     bottom: self.height - 1,\n  258 |                 }\n  259 |             };","lines":4,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-glutin-renderer/src/surface.rs#L256-L259"}]},
{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`Rc4::process` sizes the output with `Vec::with_capacity(message.len())` and then loops `while output.capacity() > output.len()`, indexing `message[output.len()]` each iteration. `Vec::with_capacity` only guarantees capacity is at least the requested amount and is explicitly documented as allowed to allocate more. If the allocator ever returns excess capacity, the loop runs past `message.len()` and `message[idx_msg]` panics with an out-of-bounds index. The code relies on unspecified allocator behavior for correctness. (Separately, `Rc4::new` computes `key[i % key.len()]`, which panics with a divide-by-zero on an empty key.)","fix":"Iterate over the actual message length rather than the vector capacity, e.g. iterate `for &b in message { ... output.push(k ^ b) }`, so the loop bound is `message.len()` and never depends on `Vec::capacity()`. Guard `Rc4::new` against an empty key.","locations":[{"ref":"crates/ironrdp-pdu/src/crypto/rc4.rs:28-37","code":"   28 |         let mut output = Vec::with_capacity(message.len());\n   29 |         while output.capacity() > output.len() {\n   30 |             self.i = (self.i + 1) % 256;\n   31 |             self.j = (self.j + usize::from(self.state[self.i])) % 256;\n   32 |             self.state.swap(self.i, self.j);\n   33 |             let idx_k = (usize::from(self.state[self.i]) + usize::from(self.state[self.j])) % 256;\n   34 |             let k = self.state[idx_k];\n   35 |             let idx_msg = output.len();\n   36 |             output.push(k ^ message[idx_msg]);\n   37 |         }","lines":10,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-pdu/src/crypto/rc4.rs#L28-L37"},{"ref":"crates/ironrdp-pdu/src/crypto/rc4.rs:19","code":"   19 |             j = (j + usize::from(state[i]) + usize::from(key[i % key.len()])) % 256;","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-pdu/src/crypto/rc4.rs#L19"}]},
{"id":"PANIC_14","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`WriteBuf::read_into_buf` does `buf.copy_from_slice(&self.0[..buf.len()])`. `WriteBuf`'s `Index<RangeTo>` slices into `filled()` (crates/ironrdp-core/src/write_buf.rs:227-233), so if the caller-provided `buf` is longer than the currently filled bytes, the `self.0[..buf.len()]` index panics at the FFI boundary. Current C# callers size the buffer to `written.GetSize()` so it happens to match, but the API has no guard against a larger buffer.","fix":"Validate the length and copy only what is available, e.g. `let filled = self.0.filled(); if buf.len() > filled.len() { return Err(\"buffer larger than filled data\".into()); } buf.copy_from_slice(&filled[..buf.len()]);`","locations":[{"ref":"ffi/src/pdu.rs:21-24","code":"   21 |         pub fn read_into_buf(&mut self, buf: &mut [u8]) -> Result<(), Box<IronRdpError>> {\n   22 |             buf.copy_from_slice(&self.0[..buf.len()]);\n   23 |             Ok(())\n   24 |         }","lines":4,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/ffi/src/pdu.rs#L21-L24"}]},
{"id":"PANIC_15","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`VecU8::fill`, `BytesSlice::fill` and `U32Slice::fill` guard only against a buffer that is too small (`if buffer.len() < self.0.len() { return Err }`) but then call `buffer.copy_from_slice(&self.0)`, which requires the destination and source to have equal length. If a caller passes a buffer strictly larger than the data (which the guard explicitly permits), `copy_from_slice` panics across the FFI boundary. The guard's message (\"buffer is too small\") shows larger buffers were intended to be acceptable.","fix":"Copy only the prefix: e.g. `buffer[..self.0.len()].copy_from_slice(&self.0);` (and the equivalent for `BytesSlice`/`U32Slice`), so an oversized buffer is filled without panicking.","locations":[{"ref":"ffi/src/utils/mod.rs:18-24","code":"   18 |         pub fn fill(&self, buffer: &mut [u8]) -> Result<(), Box<IronRdpError>> {\n   19 |             if buffer.len() < self.0.len() {\n   20 |                 return Err(\"buffer is too small\".into());\n   21 |             }\n   22 |             buffer.copy_from_slice(&self.0);\n   23 |             Ok(())\n   24 |         }","lines":7,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/ffi/src/utils/mod.rs#L18-L24"},{"ref":"ffi/src/utils/mod.rs:39-45","code":"   39 |         pub fn fill(&'a self, buffer: &'a mut [u8]) -> Result<(), Box<IronRdpError>> {\n   40 |             if buffer.len() < self.0.len() {\n   41 |                 return Err(\"buffer is too small\".into());\n   42 |             }\n   43 |             buffer.copy_from_slice(self.0);\n   44 |             Ok(())\n   45 |         }","lines":7,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/ffi/src/utils/mod.rs#L39-L45"},{"ref":"ffi/src/utils/mod.rs:56-62","code":"   56 |         pub fn fill(&'a self, buffer: &'a mut [u32]) -> Result<(), Box<IronRdpError>> {\n   57 |             if buffer.len() < self.0.len() {\n   58 |                 return Err(\"buffer is too small\".into());\n   59 |             }\n   60 |             buffer.copy_from_slice(self.0);\n   61 |             Ok(())\n   62 |         }","lines":7,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/ffi/src/utils/mod.rs#L56-L62"}]},
{"id":"PANIC_16","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`scanCode` indexes `KeyCodeToScanCode[engine]` where `engine` is derived from the UA parser and cast to `EngineName`. If the browser engine is not gecko/blink/webkit (or `parsedUA.engine.name` is undefined), `map` is `undefined` and `map[code]` throws a TypeError. `scanCode` is called on every keydown/keyup in `sendKeyboard`, so keyboard input throws uncaught on any unrecognized engine. All major browsers are covered, hence low severity.","fix":"Guard the lookup: fall back to a default engine map (e.g. `blink`) when `engine` is not a known key, or return `NaN` when `map` is undefined so the existing `Number.isNaN` guards in `sendKeyboard` handle it: `const map = KeyCodeToScanCode[engine] ?? KeyCodeToScanCode.blink;`.","locations":[{"ref":"web-client/iron-remote-desktop/src/lib/scancodes.ts:214-217","code":"  214 | export const scanCode = function (code: string): number {\n  215 |     const map = KeyCodeToScanCode[engine];\n  216 |     return parseInt(map[code], 16);\n  217 | };","lines":4,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/web-client/iron-remote-desktop/src/lib/scancodes.ts#L214-L217"},{"ref":"web-client/iron-remote-desktop/src/lib/scancodes.ts:13","code":"   13 | const engine = parsedUA.engine.name?.toLowerCase() as EngineName;","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/web-client/iron-remote-desktop/src/lib/scancodes.ts#L13"}]},
{"id":"PANIC_17","type":"panic","type_label":"Panic","severity":"negligible","difficulty":"very_easy","description":"`ScardAccessStartedEventCall::decode` calls `read_padding!(src, 4)` with no preceding `ensure_size!`/`ensure_fixed_part_size!`, unlike every other decoder in these modules. `read_padding` -> `ReadCursor::advance` only does `self.pos += len` with no bounds check, so on a truncated SCARD_IOCTL_ACCESSSTARTEDEVENT payload (0-3 bytes) the cursor position is pushed past the end of the buffer. No read follows inside this function, so it does not panic here, but the returned cursor is left with `pos > inner.len()`; if the caller subsequently calls `ReadCursor::len()` (which computes `self.inner.len() - self.pos`) it underflows -> subtract-overflow panic in debug builds / wildly wrong length in release. This is server-controlled input.","fix":"Guard the padding read like the other decoders, e.g.:\n```rust\npub fn decode(src: &mut ReadCursor<'_>) -> DecodeResult<Self> {\n    ensure_size!(in: src, size: 4);\n    ironrdp_pdu::read_padding!(src, 4);\n    Ok(Self)\n}\n```","locations":[{"ref":"crates/ironrdp-rdpdr/src/pdu/esc/mod.rs:555-559","code":"  555 | impl ScardAccessStartedEventCall {\n  556 |     pub fn decode(src: &mut ReadCursor<'_>) -> DecodeResult<Self> {\n  557 |         ironrdp_pdu::read_padding!(src, 4); // Unused (4 bytes)\n  558 |         Ok(Self)\n  559 |     }","lines":5,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-rdpdr/src/pdu/esc/mod.rs#L555-L559"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"In `FastPathInputHeader::decode`, `data_length` is computed as `usize::from(length) - sizeof_length - 1 - num_events_length`, where `length` comes directly from the PER-encoded wire field (`per::read_length`). There is no check that `length >= sizeof_length + 1 + num_events_length`. A crafted fast-path input header with a small `length` (e.g. 0 or 1) underflows this subtraction. The crate sets `#![allow(clippy::arithmetic_side_effects)]`, so in debug builds this panics ('attempt to subtract with overflow'), and in release builds it wraps to a huge `usize` stored in the public `data_length` field. This is reachable server-side from untrusted fast-path input.","fix":"Validate before subtracting and return a decode error on inconsistency, e.g.:\n```rust\nlet overhead = sizeof_length + 1 + num_events_length;\nlet data_length = usize::from(length)\n    .checked_sub(overhead)\n    .ok_or_else(|| invalid_field_err!(\"len\", \"fast-path length smaller than header overhead\"))?;\n```","locations":[{"ref":"crates/ironrdp-pdu/src/input/fast_path.rs:80","code":"   80 |         let data_length = usize::from(length) - sizeof_length - 1 - num_events_length;","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-pdu/src/input/fast_path.rs#L80"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"map_surface_to_scaled_output stores server-provided u32 output origins and target dimensions into an InclusiveRectangle whose fields are u16 via `as u16`, silently truncating values above 65535 (e.g. output_origin_x = 0x1_0000 becomes 0). Excluded, non-compiling crate, so low severity.","fix":"Use `u16::try_from(...)` and propagate an error (or saturate) instead of a lossy `as u16` cast.","locations":[{"ref":"crates/ironrdp-glutin-renderer/src/surface.rs:321-326","code":"  321 |         surface.set_location(InclusiveRectangle {\n  322 |             left: pdu.output_origin_x as u16,\n  323 |             top: pdu.output_origin_y as u16,\n  324 |             right: pdu.target_width as u16,\n  325 |             bottom: pdu.target_height as u16,\n  326 |         });","lines":6,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-glutin-renderer/src/surface.rs#L321-L326"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"Wire-derived byte-count additions are performed with unchecked `+` on `usize` values that originate from a `u32` length field, before the `ensure_size!` guard. On 64-bit targets this is harmless (the sum is a valid large number and `ensure_size!` rejects it), but on 32-bit targets (e.g. the wasm32 web-client build, where `usize` is 32-bit) a length near `u32::MAX` wraps to a tiny value, `ensure_size!` then succeeds, and the subsequent `read_slice(data_length)` / `read_slice(length_xor_mask)` indexes out of bounds and panics on attacker-controlled input. Note that `CompositePayload::decode` in the same crate uses `checked_add` for exactly this reason.","fix":"Use `checked_add` and map the `None` case to an `invalid_field_err!`, mirroring `CompositePayload::decode`. E.g. in `ExtendedBitmapDataPdu::decode`:\n```rust\nlet expected_remaining_size = if flags.contains(BitmapDataFlags::COMPRESSED_BITMAP_HEADER_PRESENT) {\n    data_length\n        .checked_add(BitmapDataHeader::ENCODED_SIZE)\n        .ok_or_else(|| invalid_field_err!(\"bitmap data length\", \"length overflow\"))?\n} else {\n    data_length\n};\n```\nand likewise `length_and_mask.checked_add(length_xor_mask)` in `LargePointerAttribute::decode`.","locations":[{"ref":"crates/ironrdp-pdu/src/basic_output/surface_commands/mod.rs:248","code":"  248 |             data_length + BitmapDataHeader::ENCODED_SIZE","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-pdu/src/basic_output/surface_commands/mod.rs#L248"},{"ref":"crates/ironrdp-pdu/src/basic_output/pointer/mod.rs:311","code":"  311 |         let expected_masks_size = length_and_mask + length_xor_mask;","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-pdu/src/basic_output/pointer/mod.rs#L311"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`InclusiveRectangle::width`/`height` compute `self.right - self.left + 1` and `self.bottom - self.top + 1` on `u16` fields. The `Decode` impl reads all four coordinates directly from the wire with no check that `left <= right` / `top <= bottom`, so a decoded rectangle with `right < left` (or `bottom < top`) makes these getters underflow: a debug-build panic, or a wrapped near-`u16::MAX` width in release. The doc comment asserts the INVARIANT `0 < output`, but nothing enforces it at decode time.","fix":"Use `saturating_sub` (`self.right.saturating_sub(self.left) + 1`), or enforce `left <= right && top <= bottom` in `InclusiveRectangle::decode` so the documented invariant actually holds for decoded values.","locations":[{"ref":"crates/ironrdp-pdu/src/geometry.rs:155-157","code":"  155 |     fn width(&self) -> u16 {\n  156 |         self.right - self.left + 1\n  157 |     }","lines":3,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-pdu/src/geometry.rs#L155-L157"},{"ref":"crates/ironrdp-pdu/src/geometry.rs:160-162","code":"  160 |     fn height(&self) -> u16 {\n  161 |         self.bottom - self.top + 1\n  162 |     }","lines":3,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-pdu/src/geometry.rs#L160-L162"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`row_len = bitmap.width.get() * bytes_per_pixel` is computed in `u16`. With a 4-byte pixel format any width > 16383 overflows `u16`. Because the crate sets `#![allow(clippy::arithmetic_side_effects)]`, in release builds this wraps silently, making `chunk_height = u16::MAX / row_len` and the subsequent `data.chunks(...)` / `uncompressed_size` calculations wrong (mis-chunked/mis-sized bitmap data); in debug builds it panics. Realistic RDP desktop widths stay under this, so impact is limited, but the wide-desktop case is unhandled.","fix":"Compute `row_len` (and the derived `chunk_height`/`uncompressed_size`) in `usize` and only cast down with `cast_length!`/`cast_int!` where a `u16` field is actually required, so an out-of-range width yields an error instead of wrapping.","locations":[{"ref":"crates/ironrdp-server/src/encoder/bitmap.rs:38-52","code":"   38 |         let bytes_per_pixel = u16::from(bitmap.format.bytes_per_pixel());\n   39 |         let row_len = bitmap.width.get() * bytes_per_pixel;\n   40 |         let chunk_height = u16::MAX / row_len;\n   41 | \n   42 |         let mut cursor = WriteCursor::new(output);\n   43 |         let stride = bitmap.stride.get();\n   44 |         let chunks = bitmap.data.chunks(stride * usize::from(chunk_height));\n   45 | \n   46 |         let total = cast_int!(\"chunks length lower bound\", chunks.size_hint().0).map_err(BitmapEncodeError::Encode)?;\n   47 |         BitmapUpdateData::encode_header(total, &mut cursor).map_err(BitmapEncodeError::Encode)?;\n   48 | \n   49 |         for (i, chunk) in chunks.enumerate() {\n   50 |             let height = cast_int!(\"bitmap height\", chunk.len() / stride).map_err(BitmapEncodeError::Encode)?;\n   51 |             let i: u16 = cast_int!(\"chunk idx\", i).map_err(BitmapEncodeError::Encode)?;\n   52 |             let top = bitmap.y + i * chunk_height;","lines":15,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-server/src/encoder/bitmap.rs#L38-L52"},{"ref":"crates/ironrdp-server/src/encoder/bitmap.rs:81","code":"   81 |                 }),","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-server/src/encoder/bitmap.rs#L81"}]},
{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"very_easy","description":"`BitStreamWriter::write_bits` panics with `attempt to shift left with overflow` if called with `nbits == 32` while the accumulator `offset` is 0 (or with `nbits == 0` and `offset == 0`). In the boundary-crossing branch, `let mask = (1u32 << (nbits - self.offset)) - 1;` evaluates to `1u32 << 32` when the new `self.offset` is 0 and `nbits` is 32. The `#[expect]` reason comment explicitly claims `nbits (u32 ≤ 32) always fits`, implying 32-bit writes are supported, but they are not. No current caller passes 32 (MPPC compression writes at most 30 bits), so this is latent only.","fix":"Either document/enforce the real limit (`nbits < 32`) with a `debug_assert!(nbits < 32)` mirroring the reader's `shift`, or make the shift safe. Before:\n```rust\nlet mask = (1u32 << (nbits - self.offset)) - 1;\n```\nAfter (guard the full-width case):\n```rust\nlet width = nbits - self.offset;\nlet mask = if width >= 32 { u32::MAX } else { (1u32 << width) - 1 };\n```","locations":[{"ref":"crates/ironrdp-bulk/src/bitstream.rs:197","code":"  197 |             let mask = (1u32 << (nbits - self.offset)) - 1;","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-bulk/src/bitstream.rs#L197"},{"ref":"crates/ironrdp-bulk/src/bitstream.rs:182","code":"  182 |     #[expect(clippy::as_conversions, reason = \"nbits (u32 ≤ 32) always fits in usize\")]","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-bulk/src/bitstream.rs#L182"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In `decode_upgrade_pass`, the raw-magnitude bit reader is re-created inside the per-band loop (`let mut raw_reader = RawBitReader::new(raw_data);`), so it restarts at bit 0 for every band. The symmetric encoder `encode_upgrade_pass` uses a SINGLE continuous `RawBitWriter` across all bands (created once at line 379), producing one contiguous raw bitstream. On decode, band 0 reads its raw bits correctly, but every subsequent band with a non-zero-DAS coefficient re-reads band 0's bits instead of continuing the stream. Any progressive TILE_UPGRADE that refines two or more bands (the normal case) reconstructs corrupted coefficient magnitudes for all bands after the first. Not caught by tests: `upgrade_pass_zero_das_becomes_nonzero` only refines a single band (HL1), and there is no multi-band encode/decode round-trip test.","fix":"Hoist the reader out of the band loop so it persists across bands, matching the encoder's single continuous stream. Before:\n```rust\nfor (band_idx, band) in bands.iter().enumerate() {\n    ...\n    let mut srl_idx = 0;\n    let mut raw_reader = RawBitReader::new(raw_data);\n    for i in 0..band.count() { ... }\n}\n```\nAfter:\n```rust\nlet mut raw_reader = RawBitReader::new(raw_data);\nfor (band_idx, band) in bands.iter().enumerate() {\n    ...\n    let mut srl_idx = 0;\n    for i in 0..band.count() { ... }\n}\n```\n(the `num_bits == 0` early `continue` must not skip advancing the reader, but since no raw bits are written for those bands on the encode side, skipping is correct).","locations":[{"ref":"crates/ironrdp-graphics/src/progressive.rs:218","code":"  218 |     let mut raw_reader = RawBitReader::new(raw_data);","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-graphics/src/progressive.rs#L218"},{"ref":"crates/ironrdp-graphics/src/progressive.rs:470","code":"  470 |     let mut raw_writer = RawBitWriter::new();","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-graphics/src/progressive.rs#L470"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `CompleteData::process_data_first_pdu`, when a previous fragmented message is still buffered (`self.total_size != 0`) and a new *complete* DataFirst arrives (`total_data_size == data.len()`), the function clears `self.data` but never resets `self.total_size`, then returns the complete data via the early `Ok(Some(..))` branch. `self.total_size` retains the stale non-zero value. A message of exactly `MAX_DATA_SIZE` (1590) bytes is emitted by `encode_dvc_messages` as a single complete DataFirst, so this path is realistic. After it, `process_data_pdu` sees `self.total_size != 0` with an empty `self.data`, so the next standalone Data PDU is misinterpreted as a fragment continuation: it is appended and swallowed (returns `None`) or mis-reassembled, corrupting/losing subsequent DVC traffic on that channel. The reset only happens in the `else` (incomplete) branch and in `process_data_pdu`'s Equal branch, not here.","fix":"Reset `total_size` on the complete-return path. Change:\n```rust\nif total_data_size == data_first.data().len() {\n    Ok(Some(data_first.into_data()))\n} else {\n```\nto:\n```rust\nif total_data_size == data_first.data().len() {\n    self.total_size = 0;\n    Ok(Some(data_first.into_data()))\n} else {\n```\nAlternatively, clear both `self.total_size = 0;` and `self.data.clear();` in the incomplete-skip block so state is fully reset before the check.","locations":[{"ref":"crates/ironrdp-dvc/src/complete_data.rs:30-47","code":"   30 |     fn process_data_first_pdu(&mut self, data_first: DataFirstPdu) -> DecodeResult<Option<Vec<u8>>> {\n   31 |         let total_data_size: DecodeResult<_> = cast_length!(\"DataFirstPdu::length\", data_first.length());\n   32 |         let total_data_size = total_data_size?;\n   33 |         if self.total_size != 0 || !self.data.is_empty() {\n   34 |             error!(\"Incomplete DVC message, it will be skipped\");\n   35 | \n   36 |             self.data.clear();\n   37 |         }\n   38 | \n   39 |         if total_data_size == data_first.data().len() {\n   40 |             Ok(Some(data_first.into_data()))\n   41 |         } else {\n   42 |             self.total_size = total_data_size;\n   43 |             self.data = data_first.into_data();\n   44 | \n   45 |             Ok(None)\n   46 |         }\n   47 |     }","lines":18,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-dvc/src/complete_data.rs#L30-L47"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In the `extension_match!` macro, the diagnostic arms for `String`, `f64`, and `bool` reference `stringify!($ident)`, but `$ident` is not a metavariable bound in those arms (the bound name is `$value`). An unbound metavariable in a macro transcriber is not a compile error; it is emitted literally, so the warning always prints the literal text `$ident` instead of the extension name. I confirmed this empirically: a minimal reproduction of the same macro shape prints `bad extension name = [$ident]`. Every time the web client receives an unexpected value type for one of these extensions (e.g. `pcb`, `kdc_proxy_url`, `display_control`, `enable_credssp`, `outbound_message_size_limit` in crates/ironrdp-web/src/session.rs), the log line is useless. Separately, these arms call `warn!` unqualified while the top-level arm uses `::tracing::warn!`, so the macro only compiles at call sites that happen to import `warn`.","fix":"Replace the unbound `$ident` with the bound `$value` (and qualify the macro for portability). For each arm, change:\n```rust\nwarn!(\"Unexpected value for extension {}\", stringify!($ident));\n```\nto:\n```rust\n::tracing::warn!(\"Unexpected value for extension {}\", stringify!($value));\n```","locations":[{"ref":"crates/iron-remote-desktop/src/extension.rs:10","code":"   10 |             warn!(\"Unexpected value for extension {}\", stringify!($ident));","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/iron-remote-desktop/src/extension.rs#L10"},{"ref":"crates/iron-remote-desktop/src/extension.rs:16","code":"   16 |         } else {","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/iron-remote-desktop/src/extension.rs#L16"},{"ref":"crates/iron-remote-desktop/src/extension.rs:23","code":"   23 |         } else {","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/iron-remote-desktop/src/extension.rs#L23"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`saveImage(DecodedImage decodedImage, string v)` ignores its `v` (output path) parameter entirely and always writes to the hardcoded path `\"./output.bmp\"`, even though it is called as `saveImage(decodedImage, \"output.png\")`. The requested filename/format is silently discarded, so the caller's intent (a PNG named output.png) is never honored. This is a dev-only example, so impact is minimal.","fix":"Use the passed-in path instead of the literal. For example change line 107 from `image.Save(\"./output.bmp\");` to `image.Save(v);` (and pass a `.bmp` name at the call site, or select the encoder from the extension). The unused parameter `v` should either be used or the method renamed to reflect it always emits a bitmap.","locations":[{"ref":"ffi/dotnet/Devolutions.IronRdp.ConnectExample/Program.cs:69","code":"   69 |                 saveImage(decodedImage, \"output.png\");","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/ffi/dotnet/Devolutions.IronRdp.ConnectExample/Program.cs#L69"},{"ref":"ffi/dotnet/Devolutions.IronRdp.ConnectExample/Program.cs:78","code":"   78 |         private static void saveImage(DecodedImage decodedImage, string v)","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/ffi/dotnet/Devolutions.IronRdp.ConnectExample/Program.cs#L78"},{"ref":"ffi/dotnet/Devolutions.IronRdp.ConnectExample/Program.cs:107","code":"  107 |             image.Save(\"./output.bmp\");","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/ffi/dotnet/Devolutions.IronRdp.ConnectExample/Program.cs#L107"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`closeSession` only reassigns the current session when `sessionCounter` happens to reach exactly 1 after decrement. When more than two sessions exist and the currently-active one is closed, `currentSession`/`_currentSession` keep pointing at the removed (dangling) session instead of a surviving one. `addSession`/`closeSession` also use a monotonic-ish counter that does not track the real remaining count consistently. Demo client only, so low severity.","fix":"Track the active session explicitly: when closing, if the removed id equals the current session's id, reassign to `sessions[0]` (or clear when empty) rather than gating on `sessionCounter == 1`; base counts on `sessions.length` instead of a separate counter.","locations":[{"ref":"web-client/iron-svelte-client/src/services/session.service.ts:48-54","code":"   48 | export function closeSession(id: Guid) {\n   49 |     sessionCounter--;\n   50 |     sessions = sessions.filter((session) => !session.id.equals(id));\n   51 |     if (sessionCounter == 1) {\n   52 |         setCurrentSession(sessions[0]);\n   53 |     }\n   54 | }","lines":7,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/web-client/iron-svelte-client/src/services/session.service.ts#L48-L54"},{"ref":"web-client/iron-svelte-client/src/services/session.service.ts:39-46","code":"   39 | export function addSession(name: string) {\n   40 |     sessionCounter++;\n   41 |     const newSession = new Session(name);\n   42 |     sessions.push(newSession);\n   43 |     if (sessionCounter == 1) {\n   44 |         setCurrentSession(newSession);\n   45 |     }\n   46 | }","lines":8,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/web-client/iron-svelte-client/src/services/session.service.ts#L39-L46"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"The Vite `mode` config value is a quoted string literal `'process.env.MODE'`, not the environment variable `process.env.MODE`. The literal is always truthy, so the `|| 'development'` fallback is dead and `mode` is set to the nonsense string `\"process.env.MODE\"`. This corrupts Vite's mode resolution (which drives `.env` file selection and `import.meta.env.MODE`).","fix":"Remove the quotes so the env var is actually read.\n\nBefore:\n```ts\nmode: 'process.env.MODE' || 'development',\n```\nAfter:\n```ts\nmode: process.env.MODE || 'development',\n```","locations":[{"ref":"web-client/iron-svelte-client/vite.config.ts:7","code":"    7 |     mode: 'process.env.MODE' || 'development',","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/web-client/iron-svelte-client/vite.config.ts#L7"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In build_dynamic_lib, the native lib output directory is created with a relative path resolved against the OS process CWD, but the file is copied to a destination resolved against the shell's CWD (project root via root_dir.join(...)). xshell's Shell::change_dir / current_dir do not change the OS process CWD, and create_dir_all/fs::copy are std calls that use the process CWD. When `cargo xtask ffi build-dll` is run from any subdirectory of the repo, create_dir_all creates `dependencies/runtimes/.../native/` under the subdirectory while fs::copy targets `<root>/dependencies/runtimes/.../native/<lib>`, whose parent was never created, so the copy fails with 'No such file or directory'.","fix":"Create the directory using the same root-anchored path used for the copy destination. Before:\n```rust\nlet dotnet_native_lib_dir_path: PathBuf = DOTNET_NATIVE_LIB_PATH.parse()?;\nlet dotnet_native_lib_path = root_dir.join(&dotnet_native_lib_dir_path).join(DOTNET_NATIVE_LIB_NAME);\n\ncreate_dir_all(&dotnet_native_lib_dir_path)\n    .with_context(|| format!(\"failed to create directory {}\", dotnet_native_lib_dir_path.display()))?;\n```\nAfter:\n```rust\nlet dotnet_native_lib_dir_path: PathBuf = root_dir.join(DOTNET_NATIVE_LIB_PATH);\nlet dotnet_native_lib_path = dotnet_native_lib_dir_path.join(DOTNET_NATIVE_LIB_NAME);\n\ncreate_dir_all(&dotnet_native_lib_dir_path)\n    .with_context(|| format!(\"failed to create directory {}\", dotnet_native_lib_dir_path.display()))?;\n```","locations":[{"ref":"xtask/src/ffi.rs:56-68","code":"   56 |     let dotnet_native_lib_dir_path: PathBuf = DOTNET_NATIVE_LIB_PATH.parse()?;\n   57 |     let dotnet_native_lib_path = root_dir.join(&dotnet_native_lib_dir_path).join(DOTNET_NATIVE_LIB_NAME);\n   58 | \n   59 |     create_dir_all(&dotnet_native_lib_dir_path)\n   60 |         .with_context(|| format!(\"failed to create directory {}\", dotnet_native_lib_dir_path.display()))?;\n   61 | \n   62 |     fs::copy(&output_lib_path, &dotnet_native_lib_path).with_context(|| {\n   63 |         format!(\n   64 |             \"failed to copy {} to {}\",\n   65 |             output_lib_path.display(),\n   66 |             dotnet_native_lib_path.display()\n   67 |         )\n   68 |     })?;","lines":13,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/xtask/src/ffi.rs#L56-L68"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In the `From<PerformanceFlagsType> for PerformanceFlags` conversion, the `EnableFontSmoothing` variant is mapped to `PerformanceFlags::ENABLE_DESKTOP_COMPOSITION` instead of `PerformanceFlags::ENABLE_FONT_SMOOTHING`. This is a copy-paste error from the line directly above it (`EnableDesktopComposition => ENABLE_DESKTOP_COMPOSITION`). A C# caller who requests font smoothing via `PerformanceFlags.AddFlag(EnableFontSmoothing)` will silently get desktop composition enabled instead, and font smoothing is never sent to the server. Both flags exist (verified in crates/ironrdp-pdu/src/rdp/client_info.rs:673-674).","fix":"Change the mapping to the correct flag:\n```rust\n// before\nPerformanceFlagsType::EnableFontSmoothing => PerformanceFlags::ENABLE_DESKTOP_COMPOSITION,\n// after\nPerformanceFlagsType::EnableFontSmoothing => PerformanceFlags::ENABLE_FONT_SMOOTHING,\n```","locations":[{"ref":"ffi/src/connector/config.rs:311","code":"  311 |             PerformanceFlagsType::EnableFontSmoothing => PerformanceFlags::ENABLE_DESKTOP_COMPOSITION,","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/ffi/src/connector/config.rs#L311"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"The DVC pipe proxy worker invokes the write callback with a hard-coded channel id `0` instead of the real `ctx.channel_id`. The callback signature is `Fn(u32, Vec<SvcMessage>)` and the `u32` is meant to be the DVC channel id (the analogous COM-plugin path in `com.rs:165` correctly passes `self.channel_id`). Consumers that read this id (e.g. the FFI `DvcPipeProxyMessage::get_channel_id`, which exposes `self.0.0`) always observe 0, so any per-channel routing/identification done off this value is wrong for every channel except id 0. The encoded `SvcMessage`s themselves carry the correct id, so wire routing still works, limiting impact.","fix":"Pass the real channel id:\n```rust\nif let Err(error) = (ctx.on_write_dvc)(0, messages) {\n```\nshould be:\n```rust\nif let Err(error) = (ctx.on_write_dvc)(ctx.channel_id, messages) {\n```","locations":[{"ref":"crates/ironrdp-dvc-pipe-proxy/src/worker.rs:169","code":"  169 |                 if let Err(error) = (ctx.on_write_dvc)(0, messages) {","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-dvc-pipe-proxy/src/worker.rs#L169"}]},
{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"The `Quant` PDU's `NAME` constant is set to `\"RfxFrameEnd\"`, copy-pasted from `FrameEndPdu`. `Quant::name()` returns this value, so any encode error context for a quantization block is mislabeled as a frame-end block, producing misleading diagnostics.","fix":"Rename the constant to reflect the type. Before:\n```rust\nimpl Quant {\n    const NAME: &'static str = \"RfxFrameEnd\";\n```\nAfter:\n```rust\nimpl Quant {\n    const NAME: &'static str = \"RfxQuant\";\n```","locations":[{"ref":"crates/ironrdp-pdu/src/codecs/rfx/data_messages.rs:511","code":"  511 |     const NAME: &'static str = \"RfxFrameEnd\";","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-pdu/src/codecs/rfx/data_messages.rs#L511"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"In `Connection.ResolveGenerator`, the CredSSP network-request response is read with a single `await stream.ReadAsync(readBuf, 0, readBuf.Length)` into a fixed 8096-byte buffer, and whatever that one call returns is passed straight to `generator.Resume`. A single TCP `ReadAsync` is not guaranteed to return a complete application message: a KDC/Kerberos response larger than 8096 bytes, or one split across packets, will be truncated or partial, causing CredSSP decoding to fail intermittently. The code assumes one read == one full message.","fix":"Frame the read properly: read the length prefix used by the KDC-proxy/TSRequest transport, then loop `ReadAsync` until the full message (that many bytes) has been accumulated before calling `generator.Resume`, instead of relying on a single 8096-byte read.","locations":[{"ref":"ffi/dotnet/Devolutions.IronRdp/src/Connection.cs:83-88","code":"   83 |                     stream.Write(Utils.VecU8ToByte(data));\n   84 |                     var readBuf = new byte[8096];\n   85 |                     var readlen = await stream.ReadAsync(readBuf, 0, readBuf.Length);\n   86 |                     var actuallyRead = new byte[readlen];\n   87 |                     Array.Copy(readBuf, actuallyRead, readlen);\n   88 |                     state = generator.Resume(actuallyRead);","lines":6,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/ffi/dotnet/Devolutions.IronRdp/src/Connection.cs#L83-L88"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"In `FinalizationSequence::step`, the `WaitSynchronize` and `WaitControlCooperate` states call `decode_share_control(input)` and bind the `ConnectorResult` to a variable that is only debug-printed; the `?` operator is dropped, so a decode error on the client-supplied Synchronize/Control-Cooperate PDU is silently swallowed and the state machine advances anyway. The sibling `WaitRequestControl` state (line 100) calls the identical helper with `?`, propagating the error. The asymmetry strongly indicates a dropped `?` rather than intentional leniency, and it means the server treats malformed finalization PDUs as valid and moves on.","fix":"Propagate the decode error like the `WaitRequestControl` arm does. Change:\n```rust\nlet synchronize = decode_share_control(input);\n```\nto:\n```rust\nlet synchronize = decode_share_control(input)?;\n```\nand likewise `let cooperate = decode_share_control(input)?;`.","locations":[{"ref":"crates/ironrdp-acceptor/src/finalization.rs:91","code":"   91 |                 let synchronize = decode_share_control(input);","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-acceptor/src/finalization.rs#L91"},{"ref":"crates/ironrdp-acceptor/src/finalization.rs:99","code":"   99 |                 let cooperate = decode_share_control(input);","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-acceptor/src/finalization.rs#L99"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `ConfigBuilder::with_property_set`, `desktop_scale_factor`, `desktop_width`, and `desktop_height` are read with `.ok().flatten()`, silently discarding an `InvalidDesktopSize` error, whereas `full_address`, `alternate_full_address`, `server_port`, and `gateway_usage_method` in the same function propagate their parse errors via `.context(...)?`. An out-of-range desktop dimension in a `.rdp` file is silently ignored (falls back to defaults) rather than reported, which is inconsistent with the surrounding validation and can mask a malformed config.","fix":"Either propagate these errors consistently (`ps.desktop_width().context(\"invalid 'desktopwidth'\")?`) or document explicitly that invalid desktop dimensions are intentionally best-effort and ignored.","locations":[{"ref":"crates/ironrdp-client/src/config.rs:2078-2086","code":" 2078 |         if let Some(scale) = ps.desktop_scale_factor().ok().flatten() {\n 2079 |             self.desktop_scale_factor = Some(scale);\n 2080 |         }\n 2081 |         if let Some(width) = ps.desktop_width().ok().flatten() {\n 2082 |             self.desktop_width = Some(width);\n 2083 |         }\n 2084 |         if let Some(height) = ps.desktop_height().ok().flatten() {\n 2085 |             self.desktop_height = Some(height);\n 2086 |         }","lines":9,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-client/src/config.rs#L2078-L2086"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"In the excluded (non-compiling) replay client, `handle_file` opens the data file with `File::open(args.data_file).unwrap()`, panicking on any I/O error (missing file, permissions) instead of propagating the `Result<(), Error>` it already returns. `info!`/`error!` macros are also used without a `use tracing::{info, error}` import. This crate is excluded from the workspace and does not compile, so priority is low.","fix":"Replace `.unwrap()` with `?` (the function returns `Result`), and add `use tracing::{error, info};`.","locations":[{"ref":"crates/ironrdp-replay-client/src/main.rs:93","code":"   93 |     let file = File::open(args.data_file).unwrap();","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-replay-client/src/main.rs#L93"},{"ref":"crates/ironrdp-replay-client/src/main.rs:65-112","code":"   65 |         info!(\"Result: {:?}\", result);\n   66 |     });\n   67 | \n   68 |     event_loop.run(move |main_event, _, control_flow| {\n   69 |         *control_flow = ControlFlow::Wait;\n   70 | \n   71 |         match &main_event {\n   72 |             Event::LoopDestroyed => {}\n   73 |             Event::RedrawRequested(_) => {\n   74 |                 let res = renderer.repaint();\n   75 |                 if res.is_err() {\n   76 |                     error!(\"Repaint send error: {:?}\", res);\n   77 |                 }\n   78 |             }\n   79 |             Event::WindowEvent { ref event, .. } => match event {\n   80 |                 WindowEvent::CloseRequested => *control_flow = ControlFlow::Exit,\n   81 |                 WindowEvent::Resized(size) => {\n   82 |                     info!(\"Window resized {:?}\", size);\n   83 |                 }\n   84 |                 _ => {}\n   85 |             },\n   86 |             _ => (),\n   87 |         }\n   88 |     });\n   89 | }\n   90 | \n   91 | // Parse the graphics file and send it to renderer 1 event at a time\n   92 | fn handle_file(sender: std::sync::mpsc::SyncSender<ServerPdu>, args: Args) -> Result<(), Error> {\n   93 |     let file = File::open(args.data_file).unwrap();\n   94 |     let delay = 1000 / args.frame_rate as u64;\n   95 | \n   96 |     loop {\n   97 |         let packet = ServerPdu::from_buffer(&file);\n   98 |         if let Ok(packet) = packet {\n   99 |             let wait = matches!(packet, ServerPdu::WireToSurface1(..));\n  100 |             sender.send(packet)?;\n  101 |             if wait {\n  102 |                 thread::sleep(Duration::from_millis(delay));\n  103 |             }\n  104 |         } else {\n  105 |             let ignorable = if let Err(GraphicsPipelineError::IOError(e)) = packet.as_ref() {\n  106 |                 e.kind() == ErrorKind::UnexpectedEof\n  107 |             } else {\n  108 |                 false\n  109 |             };\n  110 | \n  111 |             if !ignorable {\n  112 |                 error!(\"Error: {:?}\", packet);","lines":48,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-replay-client/src/main.rs#L65-L112"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"negligible","difficulty":"easy","description":"In the three completion helpers, the pending-IO map entry is removed only after the fallible completion builder succeeds. If `build_io_control_completion` / `build_transfer_in_completion` / `build_transfer_out_completion` returns `Err` (e.g. the backend-supplied output buffer/size exceeds the request's `max_output_buf_size`), the `?` returns early and `entry.remove()` is never reached, so the request stays registered in `pending_io` even though its completion was consumed. Impact is minimal in practice because the error propagates up `process()` and normally tears down the channel, and the oversized-buffer condition requires a misbehaving local backend rather than hostile wire data.","fix":"Remove the entry before building the (fallible) completion, or restructure so removal happens regardless of build outcome. For example in `complete_io_control`:\n```rust\nlet (completion_iface, entry) = self.pending_completion(request_id, expected_kind)?;\nlet pending = *entry.get();\nentry.remove();\nlet completion = build_io_control_completion(pending, completion_iface, request_id, response)?;\nOk(completion)\n```\nApply the same reordering to `transfer_in_completion` and `transfer_out_completion`.","locations":[{"ref":"crates/ironrdp-rdpeusb/src/client.rs:340-345","code":"  340 |         let (completion_iface, entry) = self.pending_completion(request_id, expected_kind)?;\n  341 |         let pending = *entry.get();\n  342 |         let completion = build_io_control_completion(pending, completion_iface, request_id, response)?;\n  343 |         entry.remove();\n  344 | \n  345 |         Ok(completion)","lines":6,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-rdpeusb/src/client.rs#L340-L345"},{"ref":"crates/ironrdp-rdpeusb/src/client.rs:373-385","code":"  373 |         let (completion_iface, entry) = self.pending_completion(request_id, PendingKind::TransferIn)?;\n  374 |         let pending = *entry.get();\n  375 | \n  376 |         #[expect(\n  377 |             clippy::missing_panics_doc,\n  378 |             reason = \"panic is unreachable unless the pending transfer-key invariant is broken\"\n  379 |         )]\n  380 |         let req_id = RequestIdTransferInOut::try_from(request_id)\n  381 |             .expect(\"pending TransferIn request id must be a TS_URB request id\");\n  382 |         let completion = build_transfer_in_completion(pending, completion_iface, req_id, response)?;\n  383 |         entry.remove();\n  384 | \n  385 |         Ok(completion)","lines":13,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-rdpeusb/src/client.rs#L373-L385"},{"ref":"crates/ironrdp-rdpeusb/src/client.rs:393-405","code":"  393 |         let (completion_iface, entry) = self.pending_completion(request_id, PendingKind::TransferOut)?;\n  394 |         let pending = *entry.get();\n  395 | \n  396 |         #[expect(\n  397 |             clippy::missing_panics_doc,\n  398 |             reason = \"panic is unreachable unless the pending transfer-key invariant is broken\"\n  399 |         )]\n  400 |         let req_id = RequestIdTransferInOut::try_from(request_id)\n  401 |             .expect(\"pending TransferOut request id must be a TS_URB request id\");\n  402 |         let completion = build_transfer_out_completion(pending, completion_iface, req_id, response)?;\n  403 |         entry.remove();\n  404 | \n  405 |         Ok(completion)","lines":13,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-rdpeusb/src/client.rs#L393-L405"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"very_easy","description":"In `ReqwestNetworkClient::send_tcp`, the KDC request is written with `stream.write(data)`, which performs a single write and may only send part of `data` (it returns the number of bytes written, which is ignored). A short write silently truncates the Kerberos/KDC request on the wire, causing authentication failures. The response side correctly uses `read_u32` + `read_exact`, so this is an asymmetry. Use `write_all`.","fix":"Replace the partial write with a full write. Before:\n```rust\n        stream\n            .write(data)\n            .await\n```\nAfter:\n```rust\n        stream\n            .write_all(data)\n            .await\n```\n(`write_all` returns `()` instead of a byte count, which is what the surrounding `map_err` chain already discards.)","locations":[{"ref":"crates/ironrdp-tokio/src/reqwest.rs:48-52","code":"   48 |         stream\n   49 |             .write(data)\n   50 |             .await\n   51 |             .map_err(|e| Error::new(ErrorKind::NoAuthenticatingAuthority, format!(\"{e:?}\")))\n   52 |             .map_err(|e| custom_err!(\"failed to send KDC request over TCP\", e))?;","lines":5,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-tokio/src/reqwest.rs#L48-L52"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`Framed<TS>.Write` acquires a `System.Threading.Mutex` with `_writeLock.WaitOne()`, `await`s `_stream.WriteAsync(memory)`, then calls `_writeLock.ReleaseMutex()` in the finally block. A `Mutex` has thread affinity: it must be released by the same thread that acquired it. Because the code has no `SynchronizationContext` (library/console), the continuation after the `await` typically resumes on a different thread-pool thread, so `ReleaseMutex()` throws `ApplicationException` (\"Object synchronization method was called from an unsynchronized block of code\"), breaking every write on the connection.","fix":"Use an async-friendly, thread-agnostic primitive. Replace `Mutex _writeLock = new()` with `SemaphoreSlim _writeLock = new(1, 1)` and use `await _writeLock.WaitAsync(); try { ... } finally { _writeLock.Release(); }`.","locations":[{"ref":"ffi/dotnet/Devolutions.IronRdp/src/Framed.cs:89-101","code":"   89 |     public async Task Write(byte[] data)\n   90 |     {\n   91 |         _writeLock.WaitOne();\n   92 |         try\n   93 |         {\n   94 |             ReadOnlyMemory<byte> memory = data;\n   95 |             await _stream.WriteAsync(memory);\n   96 |         }\n   97 |         finally\n   98 |         {\n   99 |             _writeLock.ReleaseMutex();\n  100 |         }\n  101 |     }","lines":13,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/ffi/dotnet/Devolutions.IronRdp/src/Framed.cs#L89-L101"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"In `NCrushContext::compress`, `hash_table_add` (which writes `self.match_table[offset]` for `offset` up to `history_offset + src_size - 8`) is called BEFORE the `hist_end > HISTORY_BUFFER_SIZE` overflow guard. If `history_offset + src_size - 8 > 65535`, the write to `match_table[offset]` indexes out of bounds and panics. This is unreachable through the public `BulkCompressor` API (input is capped to 16383 bytes and the window-slide logic keeps `history_offset ≤ ~65528`), but the bounds check is logically placed after the operation it should protect, leaving a latent OOB if this pub(crate) fn is ever driven with larger input.","fix":"Move the `hist_end`/overflow validation above the `hash_table_add` call so the buffer-size invariant is established before any table is populated, and/or add an explicit bound in `hash_table_add` clamping `end_offset` to `MATCH_TABLE_SIZE`.","locations":[{"ref":"crates/ironrdp-bulk/src/ncrush/mod.rs:1233","code":" 1233 |         self.hash_table_add(src_data, src_size, history_offset);","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-bulk/src/ncrush/mod.rs#L1233"},{"ref":"crates/ironrdp-bulk/src/ncrush/mod.rs:1236-1239","code":" 1236 |         let hist_end = history_offset + src_size;\n 1237 |         if hist_end > HISTORY_BUFFER_SIZE {\n 1238 |             return Err(BulkError::HistoryBufferOverflow);\n 1239 |         }","lines":4,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-bulk/src/ncrush/mod.rs#L1236-L1239"},{"ref":"crates/ironrdp-bulk/src/ncrush/mod.rs:705-720","code":"  705 |     pub(crate) fn hash_table_add(&mut self, src_data: &[u8], src_size: usize, history_offset: usize) {\n  706 |         if src_size < 8 {\n  707 |             return;\n  708 |         }\n  709 |         let end_offset = history_offset + src_size - 8;\n  710 |         let mut offset = history_offset;\n  711 |         let mut src_idx = 0usize;\n  712 | \n  713 |         while offset < end_offset {\n  714 |             let hash = usize::from(u16::from_le_bytes([src_data[src_idx], src_data[src_idx + 1]]));\n  715 |             let old_entry = self.hash_table[hash];\n  716 |             self.hash_table[hash] = offset as u16;\n  717 |             self.match_table[offset] = old_entry;\n  718 |             src_idx += 1;\n  719 |             offset += 1;\n  720 |         }","lines":16,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-bulk/src/ncrush/mod.rs#L705-L720"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"CacheImportOfferPdu, SurfaceToSurfacePdu and CacheToSurfacePdu decode a u16 count then `iter::repeat_with(...).take(count).collect()` without a preceding `ensure_size!` guard, unlike SolidFillPdu, CacheImportReplyPdu and CapabilitiesAdvertisePdu which do guard. Because Take over repeat_with reports an exact size_hint of `count`, the collect pre-reserves `count` elements (up to 65535) even when the packet has no remaining bytes. Per-element decode still enforces bounds so there is no OOB read or unbounded allocation, but a 2-byte count on a tiny packet forces up to ~1 MB reservation (CacheImportOffer, 16-byte CacheEntryMetadata), an inconsistent allocation-amplification.","fix":"Add an `ensure_size!(in: src, size: usize::from(count) * <element fixed size>)` before the collect (matching SolidFillPdu/CacheImportReplyPdu), so a bogus count on a short buffer fails fast before reserving.","locations":[{"ref":"crates/ironrdp-egfx/src/pdu/cmd.rs:1344-1346","code":" 1344 |         let cache_entries = iter::repeat_with(|| CacheEntryMetadata::decode(src))\n 1345 |             .take(usize::from(entries_count))\n 1346 |             .collect::<Result<Vec<_>, _>>()?;","lines":3,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-egfx/src/pdu/cmd.rs#L1344-L1346"},{"ref":"crates/ironrdp-egfx/src/pdu/cmd.rs:633-635","code":"  633 |         let destination_points = iter::repeat_with(|| Point::decode(src))\n  634 |             .take(usize::from(destination_points_count))\n  635 |             .collect::<Result<_, _>>()?;","lines":3,"link":"https://github.com/Devolutions/IronRDP/blob/f6391452da15cd7cf9896f095b0df2909593ccc0/crates/ironrdp-egfx/src/pdu/cmd.rs#L633-L635"},{"ref":"crates/ironrdp-egfx/src/pdu/cmd.rs:753-755","code":"  753 |         let destination_points = iter::repeat_with(|| Point::decode(src))\n  754 |
