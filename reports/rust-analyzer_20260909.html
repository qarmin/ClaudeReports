<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"SearchMode::Prefix slices the candidate string at a byte offset taken from the query length (`&candidate[..query.len()]`) after only checking `query.len() <= candidate.len()`. `query.len()` is a byte count; if it lands in the middle of a multi-byte UTF-8 char in `candidate`, this string slice panics. `candidate` is an interned item/symbol name (which can be non-ASCII) and `query` is arbitrary user input. This `check` is shared with symbol search / auto-import flows in ide-db, so it is reachable. Example: query=\"ab\" (2 bytes), candidate=\"aedef\" with a 2-byte char at index 1 splits the char and panics.","fix":"Use a UTF-8-safe boundary check, e.g. `match candidate.get(..query.len()) { Some(prefix) if case_sensitive => prefix == query, Some(prefix) => prefix.eq_ignore_ascii_case(query), None => false }`, or compare via `candidate.as_bytes().starts_with(query.as_bytes())`.","locations":[{"ref":"crates/hir-def/src/import_map.rs:357-366","code":"  357 |             SearchMode::Prefix => {\n  358 |                 query.len() <= candidate.len() && {\n  359 |                     let prefix = &candidate[..query.len()];\n  360 |                     if case_sensitive {\n  361 |                         prefix == query\n  362 |                     } else {\n  363 |                         prefix.eq_ignore_ascii_case(query)\n  364 |                     }\n  365 |                 }\n  366 |             }","lines":10,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-def/src/import_map.rs#L357-L366"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`ProcMacroServerProcess::with_locked_io` does `self.state.lock().unwrap()`. The work performed under the lock (legacy/bidirectional conversation, postcard/JSON decode, FlatTree reconstruction) can panic on malformed data from the server subprocess. A panic while holding the lock poisons the Mutex, after which `.lock().unwrap()` panics on every subsequent request to that worker - turning a one-off recoverable IO/decode failure into a permanent hard panic for all later traffic to that worker.","fix":"Recover from poisoning: `self.state.lock().unwrap_or_else(|e| e.into_inner())`, or wrap the in-lock work in `catch_unwind` and convert a caught panic into a `ServerError`. (The crate already uses `unwrap_or_else(PoisonError::into_inner)` elsewhere - apply the same here.)","locations":[{"ref":"crates/proc-macro-api/src/process.rs:348","code":"  348 |         let state = &mut *self.state.lock().unwrap();","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/proc-macro-api/src/process.rs#L348"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`literal_from_lexer` computes the literal body slice as `&lit[start_offset..lit.len() - end_offset]` with no bounds guard. For unterminated raw-string literals the offsets exceed the actual string length: e.g. input `r\"` lexes as RawStr{n_hashes:None}, giving start_offset=2, end_offset=1, lit.len()=2, producing `&lit[2..1]` which panics (\"slice index starts at 2 but ends at 1\"). This is reachable from the proc-macro bridge call `Server::literal_from_str` (-> server_impl::literal_from_str -> literal_from_lexer) with attacker/macro-controlled strings, so a malicious or buggy proc-macro can panic the expander thread. The same path also underflows `lit.len() - end_offset` for short unterminated byte/c-raw strings.","fix":"Validate that the literal is actually terminated / long enough before slicing: use `lit.len().checked_sub(end_offset)` and check `start_offset <= end`, returning `Err(())` from `literal_from_str` (and a graceful fallback in `from_str`) instead of indexing. Better: only enter this code path when rustc_lexer reports the literal as terminated.","locations":[{"ref":"crates/proc-macro-srv/src/token_stream.rs:715-716","code":"  715 |     let (lit, suffix) = s.split_at(suffix_start as usize);\n  716 |     let lit = &lit[start_offset..lit.len() - end_offset];","lines":2,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/proc-macro-srv/src/token_stream.rs#L715-L716"},{"ref":"crates/proc-macro-srv/src/server_impl.rs:37-38","code":"   37 |     let TokenKind::Literal { kind, suffix_start } = lit.kind else { return Err(()) };\n   38 |     Ok(crate::token_stream::literal_from_lexer(s, span, kind, suffix_start))","lines":2,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/proc-macro-srv/src/server_impl.rs#L37-L38"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`shuffle` computes `slice.len() - 1` on a usize before any emptiness check. Called with an empty slice this underflows: it panics in debug builds and wraps to usize::MAX in release builds, producing an effectively infinite loop performing out-of-bounds `slice.swap` calls. It is a public generic API with no documented non-empty precondition.","fix":"Guard the empty case before subtracting, e.g. `let Some(mut remaining) = slice.len().checked_sub(1) else { return; };` (or an early `if slice.is_empty() { return; }`).","locations":[{"ref":"crates/stdx/src/rand.rs:6-13","code":"    6 | pub fn shuffle<T>(slice: &mut [T], mut rand_index: impl FnMut(usize) -> usize) {\n    7 |     let mut remaining = slice.len() - 1;\n    8 |     while remaining > 0 {\n    9 |         let index = rand_index(remaining);\n   10 |         slice.swap(remaining, index);\n   11 |         remaining -= 1;\n   12 |     }\n   13 | }","lines":8,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/stdx/src/rand.rs#L6-L13"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"deduce_future_output_from_obligations panics with 'invalid async fn coroutine return type' for any ret_ty whose kind is not Infer/Alias/Error. It is reached from supplied_sig_of_closure for async fn bodies. In an IDE working on incomplete/incorrect code the return type can resolve to an unexpected kind. The adjacent TyKind::Error arm already returns the error type gracefully, so this hard panic is inconsistent with the surrounding recovery style.","fix":"Replace the `_ => panic!(...)` arm with `return Some(self.types.types.error)` to match the Error arm, or use stdx::never! plus an error fallback.","locations":[{"ref":"crates/hir-ty/src/infer/closure.rs:1069-1072","code":" 1069 |             TyKind::Error(_) => return Some(ret_ty),\n 1070 |             _ => {\n 1071 |                 panic!(\"invalid async fn coroutine return type: {ret_ty:?}\")\n 1072 |             }","lines":4,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-ty/src/infer/closure.rs#L1069-L1072"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"upmap_once -> map_range_up_once can return an empty SmallVec (e.g. when the macro arg node is absent, or no ranges intersect/match the span; see crates/hir-expand/src/lib.rs:911-923). Indexing tokens[0] then panics with index-out-of-bounds. This is on the derive-attribute expansion path of expand_macro, reachable when expanding a derive whose token does not upmap to any range.","fix":"Replace tokens[0] with tokens.first()?, e.g. `let first = *tokens.first()?; let token = sema.parse_or_expand(file_id).covering_element(first).into_token()?;`","locations":[{"ref":"crates/ide/src/expand_macro.rs:54-56","code":"   54 |         let InFile { file_id, value: tokens } =\n   55 |             hir::InMacroFile::new(macro_file, descended).upmap_once(db);\n   56 |         let token = sema.parse_or_expand(file_id).covering_element(tokens[0]).into_token()?;","lines":3,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide/src/expand_macro.rs#L54-L56"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`span_for_token_id` does `table.get_index(id.0 as usize).unwrap_or_else(|| &table[0])`. The fallback `&table[0]` itself panics if `table` is empty, which is reachable when the server (in rust-analyzer-span mode) returns token ids referencing spans but sends an empty `span_data_table`. Untrusted cross-process input causes a panic instead of a graceful default.","fix":"Return a dummy/call-site `Span` when the table is empty instead of indexing `table[0]`, or surface a `ServerError`.","locations":[{"ref":"crates/proc-macro-api/src/legacy_protocol/msg/flat.rs:472","code":"  472 |         *table.get_index(id.0 as usize).unwrap_or_else(|| &table[0])","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/proc-macro-api/src/legacy_protocol/msg/flat.rs#L472"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`Reader::read_subtree` ends with `let (delimiter, mut res) = res[0].take().unwrap();` where `res` has length `self.subtree.len()`. A buggy or malicious proc-macro server returning a `FlatTree` with an empty `subtree` vec makes `res` empty and `res[0]` an out-of-bounds panic. More generally the decoder indexes attacker-controlled ranges `self.token_tree[repr.tt[0]..repr.tt[1]]` and child slots `res[idx].take().unwrap()`, any of which can panic on crafted input crossing the process boundary.","fix":"Validate that `subtree` is non-empty and that all `tt` ranges and child indices are in bounds before indexing, returning a `ServerError` on violation instead of panicking.","locations":[{"ref":"crates/proc-macro-api/src/legacy_protocol/msg/flat.rs:850","code":"  850 |         let (delimiter, mut res) = res[0].take().unwrap();","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/proc-macro-api/src/legacy_protocol/msg/flat.rs#L850"},{"ref":"crates/proc-macro-api/src/legacy_protocol/msg/flat.rs:756","code":"  756 |             let token_trees = &self.token_tree[repr.tt[0] as usize..repr.tt[1] as usize];","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/proc-macro-api/src/legacy_protocol/msg/flat.rs#L756"},{"ref":"crates/proc-macro-api/src/legacy_protocol/msg/flat.rs:770","code":"  770 |                         let (delimiter, subtree) = res[idx].take().unwrap();","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/proc-macro-api/src/legacy_protocol/msg/flat.rs#L770"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"Both proc-macro-srv-cli expand handlers index the deserialized `span_data_table` directly with client-supplied global indices `def_site`/`call_site`/`mixed_site` (u32 values from IPC). An out-of-bounds index panics the server with index-out-of-bounds on malformed input rather than returning a protocol/panic error response.","fix":"Use checked `.get(idx)` lookups and convert a missing entry into a `PanicMessage`/error response instead of indexing directly.","locations":[{"ref":"crates/proc-macro-srv-cli/src/main_loop.rs:420-422","code":"  420 |     let def_site = span_data_table[def_site];\n  421 |     let call_site = span_data_table[call_site];\n  422 |     let mixed_site = span_data_table[mixed_site];","lines":3,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/proc-macro-srv-cli/src/main_loop.rs#L420-L422"},{"ref":"crates/proc-macro-srv-cli/src/main_loop.rs:557-559","code":"  557 |                         let def_site = span_data_table[def_site];\n  558 |                         let call_site = span_data_table[call_site];\n  559 |                         let mixed_site = span_data_table[mixed_site];","lines":3,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/proc-macro-srv-cli/src/main_loop.rs#L557-L559"}]},
{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"DiscoverCommand::spawn indexes `self.command[0]` and `self.command[1..]`. The command vector comes directly from user config `workspace.discoverConfig.command` (Vec<String>) and is never validated for non-emptiness before reaching here (main_loop spawns it). A user configuring `discoverConfig` with `command: []` triggers an index-out-of-bounds panic on the main loop when discovery runs.","fix":"Guard at the top of spawn: `let Some((command, args)) = self.command.split_first() else { anyhow::bail!(\"discover command is empty\"); };`. The call site already handles Err by showing a message.","locations":[{"ref":"crates/rust-analyzer/src/discover.rs:51-52","code":"   51 |         let command = &self.command[0];\n   52 |         let args = &self.command[1..];","lines":2,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/rust-analyzer/src/discover.rs#L51-L52"}]},
{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"Several tree-sink assertions can hard-panic on a parser/buffer desync (e.g. due to invisible-delimiter or fixup mismatches): `float_split` uses `unreachable!(\"{tt:?}\")` and `assert!`s, and `token()` ends with `combined_span.expect(\"expected at least one token\")`, which panics if a parser `Token` step consumes zero buffer tokens at end-of-buffer. These crash the parser thread rather than degrading gracefully.","fix":"At minimum convert the `combined_span.expect(...)` at lib.rs:989 into a guarded path that skips the token-map push / emits an error when a token step consumes zero buffer tokens, so an empty token step at EOF does not panic.","locations":[{"ref":"crates/syntax-bridge/src/lib.rs:1011","code":" 1011 |         self.token_map.push(self.text_pos, combined_span.expect(\"expected at least one token\"));","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/syntax-bridge/src/lib.rs#L1011"},{"ref":"crates/syntax-bridge/src/lib.rs:883","code":"  883 |             tt => unreachable!(\"{tt:?}\"),","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/syntax-bridge/src/lib.rs#L883"},{"ref":"crates/syntax-bridge/src/lib.rs:888","code":"  888 |                 assert!(!left.is_empty());","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/syntax-bridge/src/lib.rs#L888"}]},
{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"When `to_parser_input` encounters a lone `'` punct leaf it bumps and then requires the next token tree to be an `Ident`, otherwise `panic!(\"Next token must be ident\")`. `to_parser_input` runs on arbitrary `tt::TokenTreesView` that can originate from proc-macro output or syntax fixup; a malformed/adversarial token stream containing a `'` at end-of-buffer or followed by a non-ident (subtree/literal) hits this panic and takes down the parser thread.","fix":"Replace the `panic!` with a graceful fallback: emit `LIFETIME_IDENT`/`ERROR` for the lone `'` and continue, letting the parser report the malformed input.","locations":[{"ref":"crates/syntax-bridge/src/to_parser_input.rs:26-34","code":"   26 |             current.bump();\n   27 |             match current.token_tree() {\n   28 |                 Some(tt::TokenTree::Leaf(tt::Leaf::Ident(ident))) => {\n   29 |                     res.push(LIFETIME_IDENT, ctx_edition(ident.span.ctx));\n   30 |                     current.bump();\n   31 |                     continue;\n   32 |                 }\n   33 |                 _ => panic!(\"Next token must be ident\"),\n   34 |             }","lines":9,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/syntax-bridge/src/to_parser_input.rs#L26-L34"}]},
{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`update_recursive` hard-panics with \"`Tr as _` imports with unrelated visibilities ...\" on `old_vis.max(...).unwrap_or_else(...)`. This depends on user input (two `use Tr as _` imports with unrelated visibilities) and aborts name resolution rather than degrading gracefully. The project convention prefers stdx::never! for recoverable invariants.","fix":"Replace the panic! with stdx::never! plus a fallback (e.g. keep old_vis) so pathological user input does not crash name resolution.","locations":[{"ref":"crates/hir-def/src/nameres/collector.rs:1149-1151","code":" 1149 |                             let max_vis = old_vis.max(self.db, vis, &self.def_map).unwrap_or_else(|| {\n 1150 |                                 panic!(\"`Tr as _` imports with unrelated visibilities {old_vis:?} and {vis:?} (trait {tr:?})\");\n 1151 |                             });","lines":3,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-def/src/nameres/collector.rs#L1149-L1151"}]},
{"id":"PANIC_14","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`AttrMacroAttrIds::from_many(&[])` constructs `ManyDerives(ThinVec::new())`; a later `invoc_attr()` then hits `.last().expect(\"should always have at least one `AttrId`\")` and panics. `from_many` does not reject an empty slice, so the invariant is enforced only by the eventual panic, not at construction.","fix":"Add `debug_assert!(!ids.is_empty())` / `stdx::never!` at the top of `from_many`, or change its signature to a non-empty representation.","locations":[{"ref":"crates/hir-expand/src/lib.rs:346-353","code":"  346 |     #[inline]\n  347 |     pub fn from_many(ids: &[AttrId]) -> Self {\n  348 |         if let &[id] = ids {\n  349 |             Self(AttrMacroAttrIdsRepr::One(id))\n  350 |         } else {\n  351 |             Self(AttrMacroAttrIdsRepr::ManyDerives(ids.iter().copied().collect()))\n  352 |         }\n  353 |     }","lines":8,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-expand/src/lib.rs#L346-L353"},{"ref":"crates/hir-expand/src/lib.rs:374-383","code":"  374 | impl AttrMacroAttrIds {\n  375 |     #[inline]\n  376 |     pub fn invoc_attr(&self) -> AttrId {\n  377 |         match &self.0 {\n  378 |             AttrMacroAttrIdsRepr::One(it) => *it,\n  379 |             AttrMacroAttrIdsRepr::ManyDerives(it) => {\n  380 |                 *it.last().expect(\"should always have at least one `AttrId`\")\n  381 |             }\n  382 |         }\n  383 |     }","lines":10,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-expand/src/lib.rs#L374-L383"}]},
{"id":"PANIC_15","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`MacroCallKind::original_call_range` uses `node.path().unwrap()` and `node.excl_token().unwrap()` on the fn-like macro call. Fixup/error-recovery and partially-typed code can produce a `MACRO_CALL` node missing the `!` token or path, and this helper computes diagnostic ranges - exactly a path reached during error reporting - so the unwraps can turn a recoverable diagnostics path into a hard panic.","fix":"Fall back to `node.syntax().text_range()` when path or excl token is absent, mirroring the `map_or_else` fallback already used in `macro_arg`.","locations":[{"ref":"crates/hir-expand/src/lib.rs:1230-1237","code":" 1230 |             MacroCallKind::FnLike { ast_id, .. } => {\n 1231 |                 let node = ast_id.to_node(db);\n 1232 |                 node.path()\n 1233 |                     .unwrap()\n 1234 |                     .syntax()\n 1235 |                     .text_range()\n 1236 |                     .cover(node.excl_token().unwrap().text_range())\n 1237 |             }","lines":8,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-expand/src/lib.rs#L1230-L1237"}]},
{"id":"PANIC_16","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"deduce_future_output_from_projection panics if a Future-trait projection's associated item is not Output. Normally unreachable (Future has only Output), but with a broken/minimal core where the Future trait is found but the FutureOutput lang item is absent, output_assoc_item.map(Into::into) != Some(FutureOutput) becomes true and the hard panic fires.","fix":"Use stdx::never! and return None instead of panic!, and/or short-circuit None when self.lang_items.FutureOutput is None.","locations":[{"ref":"crates/hir-ty/src/infer/closure.rs:1107-1114","code":" 1107 |         let output_assoc_item = self.lang_items.FutureOutput;\n 1108 |         if output_assoc_item.map(Into::into) != Some(predicate.def_id().0) {\n 1109 |             panic!(\n 1110 |                 \"projecting associated item `{:?}` from future, which is not Output `{:?}`\",\n 1111 |                 predicate.projection_term.kind(self.interner()),\n 1112 |                 output_assoc_item,\n 1113 |             );\n 1114 |         }","lines":8,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-ty/src/infer/closure.rs#L1107-L1114"}]},
{"id":"PANIC_17","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In analyze_closure, the async-fn/closure coroutine desugaring is matched against a very specific HIR shape with bare panic!() calls. If the desugared body does not match the expected Block { Let { Bind, Path } ... } structure (due to a prior lowering error or a future desugaring change), inference aborts with an uninformative panic instead of degrading.","fix":"Convert these structural assertions to stdx::never! plus an early return/continue so malformed input degrades gracefully.","locations":[{"ref":"crates/hir-ty/src/infer/closure/analysis.rs:319-343","code":"  319 |             let Expr::Block { statements, .. } = &self.store[body] else {\n  320 |                 panic!();\n  321 |             };\n  322 |             for stmt in statements {\n  323 |                 let Statement::Let { pat, initializer: Some(init), .. } = *stmt else {\n  324 |                     panic!();\n  325 |                 };\n  326 |                 let Pat::Bind { .. } = self.store[pat] else {\n  327 |                     // Complex pattern, skip the non-upvar local.\n  328 |                     continue;\n  329 |                 };\n  330 |                 let Expr::Path(path) = &self.store[init] else {\n  331 |                     panic!();\n  332 |                 };\n  333 |                 let update_guard =\n  334 |                     self.resolver.update_to_inner_scope(self.db, self.store_owner, init);\n  335 |                 let Some(ValueNs::LocalBinding(local_id)) =\n  336 |                     self.resolver.resolve_path_in_value_ns_fully(\n  337 |                         self.db,\n  338 |                         path,\n  339 |                         self.store.expr_path_hygiene(init),\n  340 |                     )\n  341 |                 else {\n  342 |                     panic!();\n  343 |                 };","lines":25,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-ty/src/infer/closure/analysis.rs#L319-L343"}]},
{"id":"PANIC_18","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"Two sites in expr.rs call self.coerce(...).expect(\"never-to-any coercion should always succeed\"). These are reached only when ty.is_never() with no pre-existing adjustments, so coerce takes the NeverToAny path which succeeds when coerce_never is true. The invariant is currently sound but it is a hard panic in the production type-checking path that would fire if any future change routes a never coercion through the unify path.","fix":"Fall back to self.err_ty() instead of panicking, matching the defensive style used elsewhere in this file.","locations":[{"ref":"crates/hir-ty/src/infer/expr.rs:85-87","code":"   85 |             if let Some(target) = expected.only_has_type(&mut self.table) {\n   86 |                 self.coerce(expr, ty, target, AllowTwoPhase::No, ExprIsRead::Yes)\n   87 |                     .expect(\"never-to-any coercion should always succeed\")","lines":3,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-ty/src/infer/expr.rs#L85-L87"},{"ref":"crates/hir-ty/src/infer/expr.rs:303-305","code":"  303 |             if let Some(target) = expected.only_has_type(&mut self.table) {\n  304 |                 self.coerce(expr, ty, target, AllowTwoPhase::No, ExprIsRead::Yes)\n  305 |                     .expect(\"never-to-any coercion should always succeed\")","lines":3,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-ty/src/infer/expr.rs#L303-L305"}]},
{"id":"PANIC_19","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"layout_of_ty_query for TyKind::Pat panics in several arms when the underlying layout is not the expected scalar/scalar-pair shape and unconditionally panics for nested/!null patterns inside an Or-pattern. layout_of_ty is a salsa query exercised by IDE features; a malformed pattern type reaching layout computation crashes instead of returning a LayoutError like the other error paths in the same function.","fix":"Return Err(LayoutError::NotImplemented) / Err(LayoutError::HasErrorType) from these arms instead of panicking.","locations":[{"ref":"crates/hir-ty/src/layout.rs:392","code":"  392 |                         panic!(\"pattern type with range but not scalar layout: {ty:?}, {layout:?}\")","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-ty/src/layout.rs#L392"},{"ref":"crates/hir-ty/src/layout.rs:408-410","code":"  408 |                         panic!(\n  409 |                             \"pattern type with `!null` pattern but not scalar/pair layout: {ty:?}, {layout:?}\"\n  410 |                         )","lines":3,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-ty/src/layout.rs#L408-L410"},{"ref":"crates/hir-ty/src/layout.rs:471-477","code":"  471 |                             panic!(\n  472 |                                 \"pattern type with range but not scalar layout: {ty:?}, {layout:?}\"\n  473 |                             )\n  474 |                         }\n  475 |                     }\n  476 |                     PatternKind::NotNull => panic!(\"or patterns can't contain `!null` patterns\"),\n  477 |                     PatternKind::Or(..) => panic!(\"patterns cannot have nested or patterns\"),","lines":7,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-ty/src/layout.rs#L471-L477"}]},
{"id":"PANIC_20","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"PlaceTy::field_ty and projection_ty_core panic on shape mismatches ('can't downcast non-adt', 'field out of range', 'cannot subslice non-array type', 'deref projection of non-dereferenceable ty', 'cannot use non field projection on downcasted place'). They run during const eval (projected_ty) and borrowck over MIR derived from possibly-erroneous user code. Most paths are guarded by is_ty_error() early returns, but a layout/type inconsistency would abort instead of producing a recoverable MirEvalError, contrary to the Result-threading style used everywhere else.","fix":"Return an error type instead of panicking where feasible (the eval side already wraps in MirEvalError::InternalError), or at minimum prefer never! + error for the recoverable cases.","locations":[{"ref":"crates/hir-ty/src/mir.rs:1249","code":" 1249 |                 _ => panic!(\"can't downcast non-adt non-coroutine type: {self_ty:?}\"),","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-ty/src/mir.rs#L1249"},{"ref":"crates/hir-ty/src/mir.rs:1267-1268","code":" 1267 |                     .unwrap_or_else(|| panic!(\"field {f:?} out of range: {self_ty:?}\")),\n 1268 |                 _ => panic!(\"can't project out of {self_ty:?}\"),","lines":2,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-ty/src/mir.rs#L1267-L1268"},{"ref":"crates/hir-ty/src/mir.rs:1316-1339","code":" 1316 |             panic!(\"cannot use non field projection on downcasted place\")\n 1317 |         }\n 1318 |         match *elem {\n 1319 |             ProjectionElem::Deref => {\n 1320 |                 let ty = structurally_normalize(self.ty).builtin_deref(true).unwrap_or_else(|| {\n 1321 |                     panic!(\"deref projection of non-dereferenceable ty {:?}\", self)\n 1322 |                 });\n 1323 |                 PlaceTy::from_ty(ty)\n 1324 |             }\n 1325 |             ProjectionElem::Index(_) | ProjectionElem::ConstantIndex { .. } => {\n 1326 |                 PlaceTy::from_ty(structurally_normalize(self.ty).builtin_index().unwrap())\n 1327 |             }\n 1328 |             ProjectionElem::Subslice { from, to /*, from_end*/ } => {\n 1329 |                 PlaceTy::from_ty(match structurally_normalize(self.ty).kind() {\n 1330 |                     TyKind::Slice(..) => self.ty,\n 1331 |                     TyKind::Array(inner, _) /*if !from_end*/ => Ty::new_array_opt(tcx, inner, to.checked_sub(from).map(|x| x.into())),\n 1332 |                     // TyKind::Array(inner, size) if from_end => {\n 1333 |                     //     let size = size\n 1334 |                     //         .try_to_target_usize(tcx)\n 1335 |                     //         .expect(\"expected subslice projection on fixed-size array\");\n 1336 |                     //     let len = size - from - to;\n 1337 |                     //     Ty::new_array(tcx, *inner, len)\n 1338 |                     // }\n 1339 |                     _ => panic!(\"cannot subslice non-array type: `{:?}`\", self),","lines":24,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-ty/src/mir.rs#L1316-L1339"}]},
{"id":"PANIC_21","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"When stripping the `Future`/`Coroutine` wrapper from an async/gen fn return type, the code blindly indexes `bounds[0]`, `.segments().iter().last().unwrap()`, `.args_and_bindings.unwrap()`, `.bindings[0]`, and `.type_ref.as_ref().unwrap()`. This relies on the exact shape of the synthesized `impl Future<Output = ...>` return type; a malformed/partially-resolved signature (empty bounds, no segments, no bindings) would panic instead of degrading. This is hover/display code where a panic is especially bad.","fix":"Replace the unwrap/index chain with fallible accessors (`bounds.first()`, `.last()`, `?` on the Options) and fall back to printing the raw return type when the expected shape is absent.","locations":[{"ref":"crates/hir/src/display.rs:244-268","code":"  244 |     let ret_type = if !data.is_async() && !data.is_gen() {\n  245 |         data.ret_type\n  246 |     } else if let Some(ret_type) = data.ret_type {\n  247 |         match &data.store[ret_type] {\n  248 |             TypeRef::ImplTrait(bounds) => match &bounds[0] {\n  249 |                 &TypeBound::Path(path, _) => Some(\n  250 |                     *data.store[path]\n  251 |                         .segments()\n  252 |                         .iter()\n  253 |                         .last()\n  254 |                         .unwrap()\n  255 |                         .args_and_bindings\n  256 |                         .unwrap()\n  257 |                         .bindings[0]\n  258 |                         .type_ref\n  259 |                         .as_ref()\n  260 |                         .unwrap(),\n  261 |                 ),\n  262 |                 _ => None,\n  263 |             },\n  264 |             _ => None,\n  265 |         }\n  266 |     } else {\n  267 |         None\n  268 |     };","lines":25,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir/src/display.rs#L244-L268"}]},
{"id":"PANIC_22","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`SelfParam::hir_fmt` does `data.params.first().unwrap()` for the non-builtin-derive case. Sound only because a `SelfParam` is normally constructed only when the function has a self parameter; if a `SelfParam` were ever produced for a zero-param signature, this unwraps `None` and panics during hover rendering. The invariant is undocumented.","fix":"Document the invariant, or handle `data.params.first()` returning `None` with a fallback (e.g. write `\"self\"`) instead of unwrapping.","locations":[{"ref":"crates/hir/src/display.rs:323","code":"  323 |         let param = *data.params.first().unwrap();","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir/src/display.rs#L323"}]},
{"id":"PANIC_23","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"build_source_change / enum is/projection assists call `impl_def.assoc_item_list().unwrap()` on an impl block returned by find_struct_impl. An impl node that resolved via to_def but lacks an associated-item list (malformed/in-progress `impl X` without braces) would panic rather than bail. Hard to hit in practice but an unchecked unwrap on syntax-derived data.","fix":"Use `if let Some(list) = impl_def.assoc_item_list()` (or `?` where the closure permits) and skip/return early instead of unwrap().","locations":[{"ref":"crates/ide-assists/src/handlers/generate_getter_or_setter.rs:443","code":"  443 |         impl_def.assoc_item_list().unwrap().add_items(&editor, items.clone());","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide-assists/src/handlers/generate_getter_or_setter.rs#L443"},{"ref":"crates/ide-assists/src/handlers/generate_enum_is_method.rs:80","code":"   80 |                 impl_def.assoc_item_list().unwrap().add_items(&editor, fn_items);","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide-assists/src/handlers/generate_enum_is_method.rs#L80"},{"ref":"crates/ide-assists/src/handlers/generate_enum_projection_method.rs:159","code":"  159 |                 impl_def.assoc_item_list().unwrap().add_items(&editor, fn_items);","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide-assists/src/handlers/generate_enum_projection_method.rs#L159"}]},
{"id":"PANIC_24","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"add_group_separators computes `i % group_size` with no guard; a group_size of 0 would panic with divide-by-zero. Currently unreachable (the only production caller passes 3 or 4 from group_size(radix)), but the function is pub(crate) with no assertion documenting the precondition.","fix":"Add `debug_assert!(group_size > 0)` at the top, or guard the modulo behind `group_size != 0`.","locations":[{"ref":"crates/ide-assists/src/utils.rs:1018-1028","code":" 1018 | pub(crate) fn add_group_separators(s: &str, group_size: usize) -> String {\n 1019 |     let mut chars = Vec::new();\n 1020 |     for (i, ch) in s.chars().filter(|&ch| ch != '_').rev().enumerate() {\n 1021 |         if i > 0 && i % group_size == 0 && ch != '-' {\n 1022 |             chars.push('_');\n 1023 |         }\n 1024 |         chars.push(ch);\n 1025 |     }\n 1026 | \n 1027 |     chars.into_iter().rev().collect()\n 1028 | }","lines":11,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide-assists/src/utils.rs#L1018-L1028"}]},
{"id":"PANIC_25","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In rename_field_constructors, edit.union(TextEdit::replace(field_range, ...)).unwrap() panics if union returns Err, which it does when the new edit is not disjoint from existing edits (TextEdit::union returns Err on non-disjoint). The code tries to make ranges disjoint via cancel_edits_touching, but that runs on each per-local edit while union adds the field replacement into the merged all_locals_source_change edit; any residual overlap panics in production rather than aborting the rename.","fix":"Handle the Err case, e.g. `if edit.union(...).is_err() { return None; }`, so a conflicting overlap aborts this branch (the function already uses ?/.ok()? to bail) instead of panicking.","locations":[{"ref":"crates/ide-db/src/rename.rs:505-508","code":"  505 |         for &(field_range, _) in &renamed_fields {\n  506 |             edit.union(TextEdit::replace(field_range, new_name.display(db, edition).to_string()))\n  507 |                 .unwrap();\n  508 |         }","lines":4,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide-db/src/rename.rs#L505-L508"}]},
{"id":"PANIC_26","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In source_edit_from_def, after matching Either::Left(pat) (an ast::IdentPat), the code calls pat.name().unwrap(). IdentPat::name() is an optional accessor; for a syntactically malformed/incomplete pattern reachable via local.sources() on partially-typed code this can be None and panic. pat_field.field_name().unwrap() at line 768 has the same shape. The surrounding code is otherwise defensive with ?/Option.","fix":"Use `let Some(name) = pat.name() else { continue; };` and similarly guard field_name(), to skip malformed patterns instead of panicking.","locations":[{"ref":"crates/ide-db/src/rename.rs:732","code":"  732 |                 let name_range = pat.name().unwrap().syntax().text_range();","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide-db/src/rename.rs#L732"},{"ref":"crates/ide-db/src/rename.rs:768","code":"  768 |                             format!(\"{}: \", pat_field.field_name().unwrap()),","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide-db/src/rename.rs#L768"}]},
{"id":"PANIC_27","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"split_numeric_suffix calls .expect(\"Name cannot be empty or all-numeric\") on rfind(|c| !c.is_numeric()). This is reachable from the public API (NameGenerator::suggest_name, new_with_names, insert) with any &str. Current in-tree callers feed validated identifiers so it does not panic today, but the API is pub and undocumented about this precondition, making it a latent panic for external/future callers passing e.g. \"\" or \"123\". Note also is_numeric() (Unicode) vs parse::<usize>() (ASCII) mismatch is benign.","fix":"Handle the all-numeric/empty case gracefully: `match name.rfind(|c: char| !c.is_numeric()) { None => (name, None), Some(pos) => ... }`, treating the whole string as prefix, or document the precondition on the public methods.","locations":[{"ref":"crates/ide-db/src/syntax_helpers/suggest_name.rs:289-298","code":"  289 |     fn split_numeric_suffix(name: &str) -> (&str, Option<usize>) {\n  290 |         let pos =\n  291 |             name.rfind(|c: char| !c.is_numeric()).expect(\"Name cannot be empty or all-numeric\");\n  292 |         // `rfind` returns the byte offset of the matched character, which may be\n  293 |         // multi-byte (e.g. CJK identifiers). Use `ceil_char_boundary` to advance\n  294 |         // past the full character to the next valid split point.\n  295 |         let split = name.ceil_char_boundary(pos + 1);\n  296 |         let (prefix, suffix) = name.split_at(split);\n  297 |         (prefix, suffix.parse().ok())\n  298 |     }","lines":10,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide-db/src/syntax_helpers/suggest_name.rs#L289-L298"}]},
{"id":"PANIC_28","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"from_param does arg_list.args().find_position(|it| it == expr).unwrap(), assuming expr is always found among the arg list's args. It holds today because expr's parent is the ArgList, but equality is by syntax-node identity, coupling the unwrap to the exact node passed in; any future caller passing a nested/adjusted node would panic.","fix":"Use ? instead of unwrap: `let (idx, _) = arg_list.args().find_position(|it| it == expr)?;`.","locations":[{"ref":"crates/ide-db/src/syntax_helpers/suggest_name.rs:379-393","code":"  379 |     let arg_list = expr.syntax().parent().and_then(ast::ArgList::cast)?;\n  380 |     let args_parent = arg_list.syntax().parent()?;\n  381 |     let func = match_ast! {\n  382 |         match args_parent {\n  383 |             ast::CallExpr(call) => {\n  384 |                 let func = call.expr()?;\n  385 |                 let func_ty = sema.type_of_expr(&func)?.adjusted();\n  386 |                 func_ty.as_callable(sema.db)?\n  387 |             },\n  388 |             ast::MethodCallExpr(method) => sema.resolve_method_call_as_callable(&method)?,\n  389 |             _ => return None,\n  390 |         }\n  391 |     };\n  392 | \n  393 |     let (idx, _) = arg_list.args().find_position(|it| it == expr).unwrap();","lines":15,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide-db/src/syntax_helpers/suggest_name.rs#L379-L393"}]},
{"id":"PANIC_29","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"The file_structure Leave arms pop the stack with .unwrap() (lines 62-63, 73-74), assuming that whenever structure_node/structure_token returns Some on Leave a matching push happened on Enter. This holds only because the functions are deterministic given the same node + config. It is currently safe but fragile: any future change making structure_node depend on mutable/external state would cause an unwrap panic.","fix":"Track on Enter whether a push happened (see file_structure performance finding); then the Leave pop is correct by construction.","locations":[{"ref":"crates/ide/src/file_structure.rs:62-63","code":"   62 |                     stack.pop().unwrap();\n   63 |                 }","lines":2,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide/src/file_structure.rs#L62-L63"},{"ref":"crates/ide/src/file_structure.rs:73-74","code":"   73 |                 if structure_token(token).is_some() {\n   74 |                     stack.pop().unwrap();","lines":2,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide/src/file_structure.rs#L73-L74"}]},
{"id":"PANIC_30","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In `ProjectJson::new`, when a crate has no `source` field, the include dir is computed as `root_module.parent().unwrap()`. `root_module` comes directly from a (potentially hand-written or build-system-generated) rust-project.json and is absolutized against the base. If the JSON specifies a filesystem root (e.g. `/` or `C:\\`) as `root_module`, `parent()` returns `None` and this unwrap panics, taking down project loading.","fix":"Use a fallback instead of unwrap, e.g. `root_module.parent().map(|p| p.to_path_buf()).into_iter().collect()` so a pathological root module yields an empty include list rather than panicking.","locations":[{"ref":"crates/project-model/src/project_json.rs:130","code":"  130 |                         None => (vec![root_module.parent().unwrap().to_path_buf()], Vec::new()),","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/project-model/src/project_json.rs#L130"}]},
{"id":"PANIC_31","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"handle_on_type_formatting does `edit.source_file_edits.into_iter().next().unwrap()`, assuming on_char_typed always returns at least one source-file edit when it returns Some. If ide ever returns a SourceChange with empty source_file_edits (e.g. only file-system edits), this panics. Relies on an ide-side invariant, so lower severity, but it is an unguarded unwrap in a request handler.","fix":"Use `let Some((_, (text_edit, snippet_edit))) = edit.source_file_edits.into_iter().next() else { return Ok(None); };`.","locations":[{"ref":"crates/rust-analyzer/src/handlers/request.rs:496","code":"  496 |     let (_, (text_edit, snippet_edit)) = edit.source_file_edits.into_iter().next().unwrap();","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/rust-analyzer/src/handlers/request.rs#L496"}]},
{"id":"PANIC_32","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"signature_help slices the signature string by byte offsets from parameter_ranges() (`signature[..start]`, `signature[start..end]`). If any parameter range boundary is not on a UTF-8 char boundary of `signature`, the string indexing panics rather than degrading gracefully. Normally safe because ranges are computed against the same signature, but it is unchecked indexing on data assembled in the ide layer.","fix":"Use checked slicing (signature.get(..start)) with a graceful fallback, or assert valid char boundaries with a recoverable never!.","locations":[{"ref":"crates/rust-analyzer/src/lsp/to_proto.rs:521-529","code":"  521 |                     let start = call_info.signature[..it.start().into()]\n  522 |                         .chars()\n  523 |                         .map(|c| c.len_utf16())\n  524 |                         .sum::<usize>() as u32;\n  525 |                     let end = start\n  526 |                         + call_info.signature[it.start().into()..it.end().into()]\n  527 |                             .chars()\n  528 |                             .map(|c| c.len_utf16())\n  529 |                             .sum::<usize>() as u32;","lines":9,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/rust-analyzer/src/lsp/to_proto.rs#L521-L529"}]},
{"id":"PANIC_33","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`report_intersecting_changes` builds an error string by byte-slicing the root's text (`&parent_str[..]`, `&parent_str[pre_range]`, `&parent_str[post_range]`) using TextRange byte offsets. If an intersecting-change boundary falls inside a multi-byte UTF-8 character, the slice panics on a non-char-boundary index, masking the original (already-erroneous) `intersecting changes` diagnostic with a confusing slice panic. Only reachable on the already-buggy intersecting-changes path, so impact is degraded diagnostics during a bug.","fix":"Use char-boundary-safe slicing (e.g. `str::get` with a fallback) when constructing the highlighted error context.","locations":[{"ref":"crates/syntax/src/syntax_editor/edit_algo.rs:726-758","code":"  726 |         let i_range = l_range.intersect(r_range).unwrap();\n  727 |         let i_str = format!(\"\\x1b[46m{}\", &parent_str[i_range]);\n  728 | \n  729 |         let pre_range: Range<usize> = l_range.start().into()..i_range.start().into();\n  730 |         let pre_str = format!(\"\\x1b[44m{}\", &parent_str[pre_range]);\n  731 | \n  732 |         let (highlight_range, highlight_str) = if l_range == r_range {\n  733 |             format_to!(error_msg, \"\\x1b[46mleft change:\\x1b[0m  {l:?} {l}\\n\");\n  734 |             format_to!(error_msg, \"\\x1b[46mequals\\x1b[0m\\n\");\n  735 |             format_to!(error_msg, \"\\x1b[46mright change:\\x1b[0m {r:?} {r}\\n\");\n  736 |             let i_highlighted = format!(\"{i_str}\\x1b[0m\\x1b[K\");\n  737 |             let total_range: Range<usize> = i_range.into();\n  738 |             (total_range, i_highlighted)\n  739 |         } else {\n  740 |             format_to!(error_msg, \"\\x1b[44mleft change:\\x1b[0m  {l:?} {l}\\n\");\n  741 |             let range_end = if l_range.contains_range(r_range) {\n  742 |                 format_to!(error_msg, \"\\x1b[46mcovers\\x1b[0m\\n\");\n  743 |                 format_to!(error_msg, \"\\x1b[46mright change:\\x1b[0m {r:?} {r}\\n\");\n  744 |                 l_range.end()\n  745 |             } else {\n  746 |                 format_to!(error_msg, \"\\x1b[46mintersects\\x1b[0m\\n\");\n  747 |                 format_to!(error_msg, \"\\x1b[42mright change:\\x1b[0m {r:?} {r}\\n\");\n  748 |                 r_range.end()\n  749 |             };\n  750 | \n  751 |             let post_range: Range<usize> = i_range.end().into()..range_end.into();\n  752 | \n  753 |             let post_str = format!(\"\\x1b[42m{}\", &parent_str[post_range]);\n  754 |             let result = format!(\"{pre_str}{i_str}{post_str}\\x1b[0m\\x1b[K\");\n  755 |             let total_range: Range<usize> = l_range.start().into()..range_end.into();\n  756 |             (total_range, result)\n  757 |         };\n  758 |         highlighted_str.replace_range(highlight_range, &highlight_str);","lines":33,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/syntax/src/syntax_editor/edit_algo.rs#L726-L758"}]},
{"id":"PANIC_34","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`Converter::process` calls `self.iter.peek().unwrap()` immediately after the document header and blank-line skipping. For a changelog file that contains only a title and blank lines, the iterator is exhausted at this point and `peek()` returns None, so `.unwrap()` panics instead of producing a clean error. Reachable from `cargo xtask publish-release-notes` on a degenerate changelog.","fix":"Guard the loop with an `if self.iter.peek().is_none() { break; }` before the unwrap, or handle None explicitly.","locations":[{"ref":"xtask/src/publish/notes.rs:27-28","code":"   27 |         loop {\n   28 |             let line = self.iter.peek().unwrap().as_deref().map_err(|e| anyhow!(\"{e}\"))?;","lines":2,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/xtask/src/publish/notes.rs#L27-L28"}]},
{"id":"PANIC_35","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`Macro::process` for the `commit` macro slices `&hash[0..7]` without verifying length or char boundary. A commit hash shorter than 7 chars (or a byte index not on a char boundary) panics. The release-notes converter operates on author-controlled AsciiDoc, so this is a reachable panic in the publish-release-notes path.","fix":"Use `hash.get(0..7)` with a fallback, or validate the hash length before slicing.","locations":[{"ref":"xtask/src/publish/notes.rs:555-559","code":"  555 |             \"commit\" => {\n  556 |                 let hash = &self.target;\n  557 |                 let short = &hash[0..7];\n  558 |                 let url = format!(\"https://github.com/rust-lang/rust-analyzer/commit/{hash}\");\n  559 |                 format!(\"[`{short}`]({url})\")","lines":5,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/xtask/src/publish/notes.rs#L555-L559"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"In the saturating_add/saturating_sub intrinsic, `bits = destination.size * 8`. For u128/i128 the destination size is 16, so bits == 128 and `(1 << bits) - 1` shifts a literal by 128 bits, which panics ('attempt to shift left with overflow') in debug builds and is undefined-shaped in release. core::intrinsics::saturating_add/saturating_sub are reachable from const evaluation of u128/i128 saturating arithmetic, so this is a reachable panic. (is_signed is also a hardcoded-false FIXME, but the shift overflow is the concrete bug.)","fix":"Avoid overflowing the shift, e.g. special-case bits == 128 to use u128::MAX, or compute `mx = u128::MAX >> (128 - bits)`. Also handle the signed case instead of hardcoding is_signed = false.","locations":[{"ref":"crates/hir-ty/src/mir/eval/shim.rs:850-857","code":"  850 |                 let bits = destination.size * 8;\n  851 |                 // FIXME: signed\n  852 |                 let is_signed = false;\n  853 |                 let mx: u128 = if is_signed { (1 << (bits - 1)) - 1 } else { (1 << bits) - 1 };\n  854 |                 // FIXME: signed\n  855 |                 let mn: u128 = 0;\n  856 |                 let ans = cmp::min(mx, cmp::max(mn, ans));\n  857 |                 destination.write_from_bytes(self, &ans.to_le_bytes()[0..destination.size])","lines":8,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-ty/src/mir/eval/shim.rs#L850-L857"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"In `expand_subtree`, the `${index}`/`${len}` (and `${index(N)}`/`${len(N)}`) ops compute the nesting slot as `ctx.nesting.len() - 1 - depth`, an unguarded `usize` subtraction. When such a metavar expression is used where `depth >= ctx.nesting.len()` - most simply `${index()}` used outside any repetition, where `ctx.nesting` is empty - this evaluates `0 - 1 - 0` and underflows. With the repo's dev profile (overflow checks on) it panics; in release it wraps to a huge index, `ctx.nesting.get(huge)` returns `None`, and the op silently expands to `0`, masking the user error (rustc instead emits a diagnostic). `validate()` only inspects `Op::Repeat`/`Op::Subtree`, and parsing accepts `${index(..)}` anywhere, so this is reachable from a normal `macro_rules!` definition.","fix":"Use a checked computation, e.g. `ctx.nesting.len().checked_sub(1 + depth).and_then(|i| ctx.nesting.get(i))`, and emit an `ExpandError` (matching `CountError::OutOfBounds`/`Misplaced`) when the depth is out of range rather than underflowing or silently producing `0`.","locations":[{"ref":"crates/mbe/src/expander/transcriber.rs:221-223","code":"  221 |             Op::Index { depth } => {\n  222 |                 let index =\n  223 |                     ctx.nesting.get(ctx.nesting.len() - 1 - depth).map_or(0, |nest| nest.idx);","lines":3,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/mbe/src/expander/transcriber.rs#L221-L223"},{"ref":"crates/mbe/src/expander/transcriber.rs:231-232","code":"  231 |             Op::Len { depth } => {\n  232 |                 let length = ctx.nesting.get(ctx.nesting.len() - 1 - depth).map_or(0, |_nest| {","lines":2,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/mbe/src/expander/transcriber.rs#L231-L232"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"Unchecked `TextSize` subtraction can underflow and panic. In the three macro-expansion loops, `new_offset = fake_mapped_token.text_range().start() - TextSize::new(accumulated_offset as u32)`, where `accumulated_offset` accumulates `COMPLETION_MARKER.len()` (17) per prior marker-containing token. `fake_mapped_tokens` is iterated in its own order (not guaranteed sorted by position), so a later token whose start() is smaller than the running accumulated_offset makes the subtraction underflow (panic in debug, wrap in release, corrupting the following bounds check). Reachable with macros producing multiple completion-marker tokens; the doc comment even admits the offset bookkeeping may be inaccurate.","fix":"Use `start().checked_sub(TextSize::new(accumulated_offset as u32))` and return `None` from the `filter_map` on underflow, in all three duplicated loops.","locations":[{"ref":"crates/ide-completion/src/context/analysis.rs:228-229","code":"  228 |                         let new_offset = fake_mapped_token.text_range().start()\n  229 |                             - TextSize::new(accumulated_offset as u32);","lines":2,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide-completion/src/context/analysis.rs#L228-L229"},{"ref":"crates/ide-completion/src/context/analysis.rs:349-350","code":"  349 |                                 let new_offset = fake_mapped_token.text_range().start()\n  350 |                                     - TextSize::new(accumulated_offset as u32);","lines":2,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide-completion/src/context/analysis.rs#L349-L350"},{"ref":"crates/ide-completion/src/context/analysis.rs:414-415","code":"  414 |                     let new_offset = fake_mapped_token.text_range().start()\n  415 |                         - TextSize::new(accumulated_offset as u32);","lines":2,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide-completion/src/context/analysis.rs#L414-L415"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"handle_on_type_formatting subtracts `TextSize::of('.')` (1) from the client-supplied offset with no zero check. TextSize's Sub is a plain u32 subtraction. from_proto::offset legitimately returns 0 when the client sends position (line 0, col 0). An onTypeFormatting request with such a position and a registered trigger char reaches this line: debug builds panic on the u32 underflow; release wraps to u32::MAX and the next line slices `text[u32::MAX..]` out of bounds, also panicking. Client-reachable panic in a request handler.","fix":"Guard the subtraction: `let Some(off) = position.offset.checked_sub(TextSize::of(char_typed)) else { return Ok(None); }; position.offset = off;`.","locations":[{"ref":"crates/rust-analyzer/src/handlers/request.rs:482-485","code":"  482 |     position.offset -= TextSize::of('.');\n  483 | \n  484 |     let text = snap.analysis.file_text(position.file_id)?;\n  485 |     if stdx::never!(!text[usize::from(position.offset)..].starts_with(char_typed)) {","lines":4,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/rust-analyzer/src/handlers/request.rs#L482-L485"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`hir_generic_arg_to_ast` computes `.nth(arg_idx as usize - has_self_arg as usize)`. If `arg_idx == 0` while `has_self_arg == true`, this is `0usize - 1usize`, which panics in debug builds and wraps to usize::MAX in release (then `.nth` returns None). The function is `pub` and called from hir diagnostics. The self generic arg is normally implicit so this is likely unreachable, but the subtraction is unguarded.","fix":"Use `(arg_idx as usize).saturating_sub(has_self_arg as usize)`, or assert the invariant that arg_idx > 0 when has_self_arg.","locations":[{"ref":"crates/hir-def/src/expr_store/lower.rs:3787-3799","code":" 3787 | pub fn hir_generic_arg_to_ast(\n 3788 |     args: &ast::GenericArgList,\n 3789 |     arg_idx: u32,\n 3790 |     has_self_arg: bool,\n 3791 | ) -> Option<ast::GenericArg> {\n 3792 |     args.generic_args()\n 3793 |         .filter(|arg| match arg {\n 3794 |             ast::GenericArg::AssocTypeArg(_) => false,\n 3795 |             ast::GenericArg::LifetimeArg(arg) => arg.lifetime().is_some(),\n 3796 |             ast::GenericArg::ConstArg(_) | ast::GenericArg::TypeArg(_) => true,\n 3797 |         })\n 3798 |         .nth(arg_idx as usize - has_self_arg as usize)\n 3799 | }","lines":13,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-def/src/expr_store/lower.rs#L3787-L3799"}]},
{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`PathKind::Super(u8)` counts the number of leading `super` segments in a `u8`. The counters that build it (`handle_super` in `from_tokens`, `deg` in `convert_path` and `convert_path_tt`) increment with `+=` without saturating. A path with 256+ chained `super` segments overflows the `u8`: panic in debug builds, silent wraparound (256 -> 0, turning `super::...` into `self`) in release. Reachable from user/macro source.","fix":"Use saturating arithmetic for the super counters (`saturating_add(1)`), or store the count in a wider type. Saturating at u8::MAX is harmless.","locations":[{"ref":"crates/hir-expand/src/mod_path.rs:32","code":"   32 |     Super(u8),","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-expand/src/mod_path.rs#L32"},{"ref":"crates/hir-expand/src/mod_path.rs:112-118","code":"  112 |         fn handle_super(segments: &mut Peekable<impl Iterator<Item = SyntaxToken>>) -> u8 {\n  113 |             let mut result = 0;\n  114 |             while segments.next_if(|it| it.kind() == T![super]).is_some() {\n  115 |                 result += 1;\n  116 |             }\n  117 |             result\n  118 |         }","lines":7,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-expand/src/mod_path.rs#L112-L118"},{"ref":"crates/hir-expand/src/mod_path.rs:272","code":"  272 |                 ast::PathSegmentKind::SuperKw => deg += 1,","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-expand/src/mod_path.rs#L272"},{"ref":"crates/hir-expand/src/mod_path.rs:363-372","code":"  363 |             let mut deg = 1;\n  364 |             while let Some(tt::Leaf::Ident(tt::Ident { sym: text, span, is_raw: _ })) =\n  365 |                 leaves.next()\n  366 |             {\n  367 |                 if text != sym::super_ {\n  368 |                     segments.push(Name::new_symbol(text.clone(), span.ctx));\n  369 |                     break;\n  370 |                 }\n  371 |                 deg += 1;\n  372 |             }","lines":10,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-expand/src/mod_path.rs#L363-L372"}]},
{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"In const_eval_discriminant_variant, an implicit (Missing) discriminant is computed as `1 + db.const_eval_discriminant(prev_variant)?`. If the previous discriminant is i128::MAX this overflows and panics in debug builds (wraps in release). rust-analyzer ingests arbitrary/erroneous code, so a malformed enum can reach this. Line 448 also casts allocation_as_usize(c) as i128, silently reinterpreting u128 values above i128::MAX as negative.","fix":"Use checked_add(1) and return a ConstEvalError (or saturate) on overflow rather than relying on default arithmetic.","locations":[{"ref":"crates/hir-ty/src/consteval.rs:434-441","code":"  434 |         let prev_idx = loc.index(db).checked_sub(1);\n  435 |         let value = match prev_idx {\n  436 |             Some(prev_idx) => {\n  437 |                 1 + db.const_eval_discriminant(loc.parent.enum_variants(db).variants[prev_idx].0)?\n  438 |             }\n  439 |             _ => 0,\n  440 |         };\n  441 |         return Ok(value);","lines":8,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-ty/src/consteval.rs#L434-L441"},{"ref":"crates/hir-ty/src/consteval.rs:457","code":"  457 |     let c = if is_signed { allocation_as_isize(c) } else { allocation_as_usize(c) as i128 };","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-ty/src/consteval.rs#L457"}]},
{"id":"OVF_8","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"In check_generic_args_len, expected_min = named_type_and_const_params_count - defaults_count. named_type_and_const_params_count filters to TypeParamList type params plus consts (excluding ArgumentImplTrait), but defaults_count counts defaults across all type-or-const params without that filter. The subtraction underflows (panic in debug, wrap to huge usize in release, making the comparison always false) if any excluded ArgumentImplTrait param had a counted default. Not currently reachable (impl Trait args can't have defaults) but the two counts use inconsistent filters and are coupled only by an external invariant.","fix":"Compute defaults_count over the same filtered set, or use named_type_and_const_params_count.saturating_sub(defaults_count).","locations":[{"ref":"crates/hir-ty/src/lower/path.rs:1127-1140","code":" 1127 |     let defaults_count =\n 1128 |         def_generics.iter_self_type_or_consts().filter(|(_, param)| param.has_default()).count();\n 1129 |     let named_type_and_const_params_count = def_generics\n 1130 |         .iter_self_type_or_consts()\n 1131 |         .filter(|(_, param)| match param {\n 1132 |             TypeOrConstParamData::TypeParamData(param) => {\n 1133 |                 param.provenance == TypeParamProvenance::TypeParamList\n 1134 |             }\n 1135 |             TypeOrConstParamData::ConstParamData(_) => true,\n 1136 |         })\n 1137 |         .count();\n 1138 |     let expected_max = named_type_and_const_params_count;\n 1139 |     let expected_min =\n 1140 |         if infer_args { 0 } else { named_type_and_const_params_count - defaults_count };","lines":14,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-ty/src/lower/path.rs#L1127-L1140"}]},
{"id":"OVF_9","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"Rvalue::Repeat computes `let size = len * val.len();`, multiplying a user-controlled const array length by the element byte size with no checked arithmetic. For `[x; N]` with large N this usize multiplication overflows and panics in debug builds before any memory-limit check, and the subsequent `.cycle().take(size)` would attempt to build an enormous Vec.","fix":"Use len.checked_mul(val.len()) and return a MirEvalError on overflow; bound size by the memory limit before collecting.","locations":[{"ref":"crates/hir-ty/src/mir/eval.rs:1479-1480","code":" 1479 |                 let size = len * val.len();\n 1480 |                 Owned(val.iter().copied().cycle().take(size).collect())","lines":2,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-ty/src/mir/eval.rs#L1479-L1480"}]},
{"id":"OVF_10","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"In render_memory_layout niche formatting, when niches == u128::MAX, is_pwr2minus1(niches) returns true (via its val == u128::MAX branch), and the code then calls pwr2_to_exponent(niches + 1), which overflows u128 and panics in debug builds. Essentially unreachable in practice (a type would need exactly u128::MAX niches), but a genuine latent panic with no guard on the +1 path.","fix":"Guard the niches + 1 call, e.g. `else if niches != u128::MAX && is_pwr2minus1(niches)`, or special-case u128::MAX.","locations":[{"ref":"crates/ide/src/hover/render.rs:1235-1236","code":" 1235 |             } else if is_pwr2minus1(niches) {\n 1236 |                 format_to!(label, \"niches = 2{} - 1, \", pwr2_to_exponent(niches + 1));","lines":2,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide/src/hover/render.rs#L1235-L1236"}]},
{"id":"OVF_11","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`Bytes`'s `Display` impl uses `value.abs()` on an `isize`. `isize::MIN.abs()` overflows (panics in debug, wraps in release). Reachable only with pathological memory-delta values, but `Bytes` wraps allocator-reported sizes and subtraction of two MemoryUsage snapshots, so a large negative value is conceivable.","fix":"Use `value.unsigned_abs()` or `value.saturating_abs()` instead of `value.abs()` for the threshold comparisons.","locations":[{"ref":"crates/profile/src/memory_usage.rs:101-116","code":"  101 | impl fmt::Display for Bytes {\n  102 |     fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {\n  103 |         let bytes = self.0;\n  104 |         let mut value = bytes;\n  105 |         let mut suffix = \"b\";\n  106 |         if value.abs() > 4096 {\n  107 |             value /= 1024;\n  108 |             suffix = \"kb\";\n  109 |             if value.abs() > 4096 {\n  110 |                 value /= 1024;\n  111 |                 suffix = \"mb\";\n  112 |             }\n  113 |         }\n  114 |         f.pad(&format!(\"{value}{suffix}\"))\n  115 |     }\n  116 | }","lines":16,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/profile/src/memory_usage.rs#L101-L116"}]},
