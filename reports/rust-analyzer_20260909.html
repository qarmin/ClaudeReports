{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"The unsafe-block highlight branch in highlight_related (T![unsafe]) has no config gate, unlike every other branch (exit_points, branch_exit_points, yield_points, break_points, closure_captures, references), each of which is guarded by a config.* flag. There is no unsafe field in HighlightRelatedConfig, so users cannot disable unsafe highlighting. Likely an oversight when the feature was added.","fix":"Add an unsafe_points: bool field to HighlightRelatedConfig, gate the T![unsafe] arm on it, and wire up a corresponding setting in rust-analyzer/src/config.rs. If intentionally always-on, document why.","locations":[{"ref":"crates/ide/src/highlight_related.rs:95-97","code":"   95 |         T![unsafe] if token.parent().and_then(ast::BlockExpr::cast).is_some() => {\n   96 |             highlight_unsafe_points(sema, token).remove(&file_id)\n   97 |         }","lines":3,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide/src/highlight_related.rs#L95-L97"},{"ref":"crates/ide/src/highlight_related.rs:34-42","code":"   34 | #[derive(Default, Clone)]\n   35 | pub struct HighlightRelatedConfig {\n   36 |     pub references: bool,\n   37 |     pub exit_points: bool,\n   38 |     pub break_points: bool,\n   39 |     pub closure_captures: bool,\n   40 |     pub yield_points: bool,\n   41 |     pub branch_exit_points: bool,\n   42 | }","lines":9,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide/src/highlight_related.rs#L34-L42"}]},
{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"snippet_from_node: when the text exceeds limit and contains no space within the kept prefix [..boundary], cut falls back to 0, so text.truncate(0) discards everything and the closing-brace label hint shows only the ellipsis with no content. For a long single-token label (a long identifier or path with no spaces) all useful information is lost instead of showing a truncated prefix.","fix":"When no space is found, fall back to cutting at boundary (the char boundary) rather than 0, e.g. .unwrap_or(boundary).","locations":[{"ref":"crates/ide/src/inlay_hints/closing_brace.rs:283-290","code":"  283 |     let cut = text[..boundary]\n  284 |         .char_indices()\n  285 |         .rev()\n  286 |         .find(|&(_, ch)| ch == ' ')\n  287 |         .map(|(idx, _)| idx)\n  288 |         .unwrap_or(0);\n  289 |     text.truncate(cut);\n  290 |     text.push_str(ELLIPSIS);","lines":8,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide/src/inlay_hints/closing_brace.rs#L283-L290"}]},
{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"find_related_tests_in_module computes fn_pos with the file_id of the parent module's file, then calls find_related_tests(sema, syntax, fn_pos, ...) reusing the original syntax node (the tree of the file the feature was invoked on). Inside, references::find_defs(sema, syntax, position.offset) looks up position.offset within that original syntax tree. When the indirect test function lives in a different file, the offset is applied to the wrong tree, so def resolution can silently find nothing or the wrong token. An existing FIXME already flags this path. Effect: Peek Related Tests returns incomplete results (no crash).","fix":"Obtain the syntax tree for fn_pos.file_id and pass that to the recursive call, or switch to ide_db::search as the FIXME suggests.","locations":[{"ref":"crates/ide/src/runnables.rs:266","code":"  266 |                     find_related_tests_in_module(sema, syntax, &fn_def, &module, tests);","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide/src/runnables.rs#L266"},{"ref":"crates/ide/src/runnables.rs:288-292","code":"  288 |     let fn_pos = FilePosition {\n  289 |         file_id: file_id.file_id(sema.db),\n  290 |         offset: fn_name.syntax().text_range().start(),\n  291 |     };\n  292 |     find_related_tests(sema, syntax, fn_pos, Some(mod_scope), tests)","lines":5,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide/src/runnables.rs#L288-L292"}]},
{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"The guard `WEAK_DYN_PATH_FIRST.contains(la) && (la != T![:] || la != T![<])` contains a tautological clause: a single token kind can never be both `:` and `<`, so `(la != T![:] || la != T![<])` is always true and has no effect. It is doubly dead because `WEAK_DYN_PATH_FIRST` does not even contain `:` or `<`. The author likely intended `&&` (`la != T![:] && la != T![<]`), but even that would be a no-op given the token set. This is for 2015-edition weak `dyn` detection; it produces no visible misparse today but is misleading.","fix":"Delete the redundant `&& (la != T![:] || la != T![<])` clause.","locations":[{"ref":"crates/parser/src/grammar/types.rs:86-90","code":"   86 |     p.at_contextual_kw(T![dyn]) && {\n   87 |         let la = p.nth(1);\n   88 |         WEAK_DYN_PATH_FIRST.contains(la) && (la != T![:] || la != T![<])\n   89 |     }\n   90 | }","lines":5,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/parser/src/grammar/types.rs#L86-L90"}]},
{"id":"LOGIC_34","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `run_new`'s top-level message dispatch, only `BidirectionalMessage::Request` is handled; `SubRequest`, `SubResponse`, and `Response` fall into `_ => continue`, silently discarding the message and looping. A protocol desync that delivers a stray sub-message at the top level is silently ignored instead of being reported as a protocol error (compare `roundtrip`, which surfaces a `Protocol` error for unexpected variants), which can mask bugs and cause hangs.","fix":"Log or return a protocol error for unexpected top-level message variants instead of silently continuing.","locations":[{"ref":"crates/proc-macro-srv-cli/src/main_loop.rs:102","code":"  102 |             _ => continue,","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/proc-macro-srv-cli/src/main_loop.rs#L102"}]},
{"id":"LOGIC_35","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`CargoConfigFileReader::new` builds `line_ends` assuming every line is terminated by a single byte (`l.len() + 1`). `str::lines()` strips both `\\n` and `\\r\\n`, so for a config dump with CRLF line endings every offset after the first CRLF line is off by one. `get_origin_root` then slices `&self.toml_str[span.end..line_end]` with these wrong offsets, producing a wrong/garbled origin path comment (and in the worst case slicing in the middle of a multibyte char, which would panic). Cargo currently emits `\\n` so this is latent, but it is fragile and platform-dependent.","fix":"Compute line ends from actual byte positions of newline characters (e.g. iterate `toml_str.match_indices('\\n')` and record `idx + 1`), rather than reconstructing offsets from `lines()` lengths.","locations":[{"ref":"crates/project-model/src/cargo_config_file.rs:67-74","code":"   67 |         let mut last_line_end = 0;\n   68 |         let line_ends = toml_str\n   69 |             .lines()\n   70 |             .map(|l| {\n   71 |                 last_line_end += l.len() + 1;\n   72 |                 last_line_end\n   73 |             })\n   74 |             .collect();","lines":8,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/project-model/src/cargo_config_file.rs#L67-L74"},{"ref":"crates/project-model/src/cargo_config_file.rs:96-137","code":"   96 |     pub(crate) fn get_origin_root(&self, spanned: &Spanned<DeValue<'a>>) -> Option<&AbsPath> {\n   97 |         let span = spanned.span();\n   98 | \n   99 |         for &line_end in &self.line_ends {\n  100 |             if line_end < span.end {\n  101 |                 continue;\n  102 |             }\n  103 | \n  104 |             let after_span = &self.toml_str[span.end..line_end];\n  105 | \n  106 |             // table.key = \"value\" # /parent/.cargo/config.toml\n  107 |             //                   |                            |\n  108 |             //                   span.end                     line_end\n  109 |             let origin_path = after_span\n  110 |                 .strip_prefix([',']) // strip trailing comma\n  111 |                 .unwrap_or(after_span)\n  112 |                 .trim_start()\n  113 |                 .strip_prefix(['#'])\n  114 |                 .and_then(|path| {\n  115 |                     let path = path.trim();\n  116 |                     if path.starts_with(\"environment variable\")\n  117 |                         || path.starts_with(\"--config cli option\")\n  118 |                     {\n  119 |                         None\n  120 |                     } else {\n  121 |                         Some(path)\n  122 |                     }\n  123 |                 });\n  124 | \n  125 |             return origin_path.and_then(|path| {\n  126 |                 <&Utf8Path>::from(path)\n  127 |                     .try_into()\n  128 |                     .ok()\n  129 |                     // Two levels up to the config file.\n  130 |                     // See https://doc.rust-lang.org/cargo/reference/config.html#config-relative-paths\n  131 |                     .and_then(AbsPath::parent)\n  132 |                     .and_then(AbsPath::parent)\n  133 |             });\n  134 |         }\n  135 | \n  136 |         None\n  137 |     }","lines":42,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/project-model/src/cargo_config_file.rs#L96-L137"}]},
{"id":"LOGIC_36","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"ProgressReport::tick formats percent as `{percent:3>}` which is a valid but wrong spec: it means fill character `3`, alignment right, width 0 - i.e. no padding (prints `7%` not `  7%`). The intent was right-align to width 3, `{percent:>3}`. Cosmetic CLI progress-bar misalignment.","fix":"Change the format placeholder to `{percent:>3}%`.","locations":[{"ref":"crates/rust-analyzer/src/cli/progress_report.rs:58-64","code":"   58 |         let percent = (self.curr * 100.0) as u32;\n   59 |         let text = format!(\n   60 |             \"{}/{} {percent:3>}% {}\",\n   61 |             self.pos,\n   62 |             self.len,\n   63 |             self.msg.as_ref().map_or_else(String::new, |it| it())\n   64 |         );","lines":7,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/rust-analyzer/src/cli/progress_report.rs#L58-L64"}]},
{"id":"LOGIC_37","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"folding_range collapsed_text computes `line_start = range_start - TextSize::from(range.start.character)`. range_start is a byte offset (TextSize) but range.start.character comes from range(line_index, ...) and is in the negotiated position encoding (UTF-16/UTF-32 for wide clients). Subtracting an encoded character count from a byte offset yields a wrong line_start when the text preceding the fold start on the same line contains multi-byte characters, corrupting the collapsed-text prefix. Correct only for UTF-8 or all-ASCII leading text.","fix":"Derive line_start from the line index (map (line, 0) to a byte offset) rather than arithmetic on the encoded character count.","locations":[{"ref":"crates/rust-analyzer/src/lsp/to_proto.rs:970-973","code":"  970 |         let collapsed_text = collapsed_text.map(|collapsed_text| {\n  971 |             let range_start = text_range.start();\n  972 |             let line_start = range_start - TextSize::from(range.start.character);\n  973 |             let text_before_range = &text[TextRange::new(line_start, range_start)];","lines":4,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/rust-analyzer/src/lsp/to_proto.rs#L970-L973"}]},
{"id":"LOGIC_38","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"TargetSpec build of `feats` concatenates three sources (cfg-derived required_features, selected features, target_required_features) then calls `feats.dedup()`. Vec::dedup only removes consecutive duplicates, but the list is never sorted, so non-adjacent duplicates survive (e.g. [\"a\"] + [\"b\", \"a\"] -> [\"a\",\"b\",\"a\"] unchanged), passing duplicate `--features` to cargo. Cargo tolerates it, so impact is only redundant args, but the dedup does not achieve its intent.","fix":"Use an order-preserving set-based dedup, or sort before dedup if argument order is irrelevant.","locations":[{"ref":"crates/rust-analyzer/src/target_spec.rs:185-199","code":"  185 |                 let mut feats = Vec::new();\n  186 |                 if let Some(cfg) = cfg.as_ref() {\n  187 |                     required_features(cfg, &mut feats);\n  188 |                 }\n  189 | \n  190 |                 feats.extend(\n  191 |                     features.iter().filter(|&feat| allowed_features.contains(feat)).cloned(),\n  192 |                 );\n  193 |                 feats.extend(target_required_features);\n  194 | \n  195 |                 feats.dedup();\n  196 |                 for feature in feats {\n  197 |                     cargo_args.push(\"--features\".to_owned());\n  198 |                     cargo_args.push(feature);\n  199 |                 }","lines":15,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/rust-analyzer/src/target_spec.rs#L185-L199"}]},
{"id":"LOGIC_39","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The Fisher-Yates loop passes `rand_index(remaining)` instead of `rand_index(remaining + 1)`. For an unbiased shuffle, the swap index for position `remaining` must be drawn from the inclusive range `0..=remaining`. With the natural `rand_index(n) -> 0..n` contract, the element at `remaining` can never stay in place, biasing the distribution. The `rand_index` contract is also undocumented, so the off-by-one is silent.","fix":"Pass `rand_index(remaining + 1)` so the index range is `0..=remaining`, and document that `rand_index(n)` returns a value in `0..n`.","locations":[{"ref":"crates/stdx/src/rand.rs:6-13","code":"    6 | pub fn shuffle<T>(slice: &mut [T], mut rand_index: impl FnMut(usize) -> usize) {\n    7 |     let mut remaining = slice.len() - 1;\n    8 |     while remaining > 0 {\n    9 |         let index = rand_index(remaining);\n   10 |         slice.swap(remaining, index);\n   11 |         remaining -= 1;\n   12 |     }\n   13 | }","lines":8,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/stdx/src/rand.rs#L6-L13"}]},
{"id":"LOGIC_40","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `match_arm_list` the comma decision re-checks `arm.comma_token().is_none()` even though `needs_comma` is already computed as `... && arm.comma_token().is_none()` on the lines just above. So `needs_comma && arm.comma_token().is_none()` is exactly equivalent to `needs_comma`; the extra conjunct is dead and misleadingly implies the two conditions can diverge.","fix":"Replace `if needs_comma && arm.comma_token().is_none()` with `if needs_comma`.","locations":[{"ref":"crates/syntax/src/ast/make.rs:928-932","code":"  928 | pub fn match_arm_list(arms: impl IntoIterator<Item = ast::MatchArm>) -> ast::MatchArmList {\n  929 |     let arms_str = arms.into_iter().fold(String::new(), |mut acc, arm| {\n  930 |         let needs_comma =\n  931 |             arm.comma_token().is_none() && arm.expr().is_none_or(|it| !it.is_block_like());\n  932 |         let comma = if needs_comma && arm.comma_token().is_none() { \",\" } else { \"\" };","lines":5,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/syntax/src/ast/make.rs#L928-L932"}]},
{"id":"LOGIC_41","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`contains_exterior_struct_lit_inner` claims (comment at line 448) to handle `&X { y: 1 }`, but there is no `RefExpr` match arm. In rust-analyzer's AST, `&expr` parses to `RefExpr`, not `PrefixExpr` (PrefixExpr covers only `!`, `-`, `*`). So a reference to a struct literal falls through to `_ => None`, and `contains_exterior_struct_lit` returns false for `&X { y: 1 }`. This feeds `needs_parens_in_expr`, so an assist that substitutes `&X { y: 1 }` into a position where a following `{` would be misparsed (e.g. `if <here> { .. }`) can omit the required parentheses, producing mis-parsing or wrong code.","fix":"Add a `RefExpr(e) => contains_exterior_struct_lit_inner(&e.expr()?),` arm mirroring the PrefixExpr arm. (rustc's equivalent handles the AddrOf/ref case.)","locations":[{"ref":"crates/syntax/src/ast/prec.rs:456-464","code":"  456 |                 // `&X { y: 1 }`, `X { y: 1 }.y`, `X { y: 1 }.bar(...)`, etc\n  457 |                 IndexExpr(e) => contains_exterior_struct_lit_inner(&e.base()?),\n  458 |                 AwaitExpr(e) => contains_exterior_struct_lit_inner(&e.expr()?),\n  459 |                 PrefixExpr(e) => contains_exterior_struct_lit_inner(&e.expr()?),\n  460 |                 CastExpr(e) => contains_exterior_struct_lit_inner(&e.expr()?),\n  461 |                 FieldExpr(e) => contains_exterior_struct_lit_inner(&e.expr()?),\n  462 |                 MethodCallExpr(e) => contains_exterior_struct_lit_inner(&e.receiver()?),\n  463 | \n  464 |                 _ => None,","lines":9,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/syntax/src/ast/prec.rs#L456-L464"}]},
{"id":"LOGIC_42","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"medium","description":"Import-map FST keys are inserted using `name.to_ascii_lowercase()`, but the search automaton is built from `Query::lowercased` using full Unicode `to_lowercase()`. For names/queries with non-ASCII uppercase letters the two normalizations disagree, so the FST prefilter can miss otherwise-matching entries. The final SearchMode::check re-filters, so this only causes missed results, not wrong ones.","fix":"Use the same lowercasing on both sides (to_ascii_lowercase for the query too, matching the FST), or document the ASCII-only assumption.","locations":[{"ref":"crates/hir-def/src/import_map.rs:114","code":"  114 |             builder.insert(name.to_ascii_lowercase(), ((start as u64) << 32) | end as u64).unwrap()","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-def/src/import_map.rs#L114"},{"ref":"crates/hir-def/src/import_map.rs:410","code":"  410 |         let lowercased = query.to_lowercase();","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-def/src/import_map.rs#L410"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"easy","description":"In Evaluator::copy_from_interval, the (Heap(dst), Heap(src)) arm validates bounds against self.stack.len() but then copies within self.heap. If the heap is smaller than the stack the check wrongly passes and self.heap.copy_within(src..src + r.size, dst) panics with an out-of-bounds index instead of returning the intended UndefinedBehavior error; if the heap is larger than the stack a legitimate copy is wrongly rejected. Heap-to-heap copies happen for any assignment between two heap-allocated values, so this is reachable in normal const-eval flow. The other three arms correctly check the buffer they index.","fix":"Replace both `self.stack.len()` checks with `self.heap.len()` in the (Heap, Heap) arm.","locations":[{"ref":"crates/hir-ty/src/mir/eval.rs:2252-2257","code":" 2252 |             (Heap(dst), Heap(src)) => {\n 2253 |                 if self.stack.len() < src + r.size || self.stack.len() < dst + r.size {\n 2254 |                     return Err(oob());\n 2255 |                 }\n 2256 |                 self.heap.copy_within(src..src + r.size, dst)\n 2257 |             }","lines":6,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-ty/src/mir/eval.rs#L2252-L2257"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"TraitImpls::for_crate and TraitImpls::for_block label their tracing/profiling spans 'inherent_impls_in_crate_query' and 'inherent_impls_in_block_query'. Those names belong to InherentImpls (used correctly at lines 565 and 574). Any profiling/tracing of trait-impl collection is mis-attributed to inherent-impl queries, and the InherentImpls/TraitImpls crate queries become indistinguishable in traces.","fix":"Rename the spans to 'trait_impls_in_crate_query' (line 674) and 'trait_impls_in_block_query' (line 683).","locations":[{"ref":"crates/hir-ty/src/method_resolution.rs:698","code":"  698 |         let _p = tracing::info_span!(\"inherent_impls_in_crate_query\", ?krate).entered();","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-ty/src/method_resolution.rs#L698"},{"ref":"crates/hir-ty/src/method_resolution.rs:710","code":"  710 |         let _p = tracing::info_span!(\"inherent_impls_in_block_query\").entered();","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-ty/src/method_resolution.rs#L710"}]},
{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"In `Function::eval`, the `stderr` text is populated from `output.stdout()` instead of `output.stderr()`. The `stdout` variable above (line 2672) already reads `output.stdout()`, so stderr output produced during MIR evaluation is never shown; instead the stdout content is duplicated under a `--------- stderr ---------` header. A distinct `stderr()` accessor exists on the output type, confirming the intent.","fix":"Change `let stderr = output.stdout().into_owned();` to `let stderr = output.stderr().into_owned();`","locations":[{"ref":"crates/hir/src/lib.rs:1859","code":" 1859 |         let stderr = output.stdout().into_owned();","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir/src/lib.rs#L1859"}]},
{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"In extract_token_range_of (used when extracting a variable from inside a macro TOKEN_TREE), the trailing boundary token is computed via `left_biased()` at the selection end and then skipped with `Direction::Next`. Skipping forward from the trailing boundary moves past the end of the selection, away from it; it should skip backward (`Direction::Prev`) to land on the last non-trivia token inside the selection. The leading boundary correctly skips Next. This is a copy-paste of the `first` line: when the left-biased end token is trivia, `last` can become a token outside the selected range, breaking the subsequent ordering check / covering-range computation.","fix":"Change line 317 to `let last = skip_trivia_token(last, Direction::Prev)?;`.","locations":[{"ref":"crates/ide-assists/src/handlers/extract_variable.rs:335-336","code":"  335 |     let first = skip_trivia_token(first, Direction::Next)?;\n  336 |     let last = skip_trivia_token(last, Direction::Next)?;","lines":2,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide-assists/src/handlers/extract_variable.rs#L335-L336"}]},
{"id":"CPY_5","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"Typo `i28` instead of `i128` in the `REPR_COMPLETIONS` table. This string is used as both the completion label and (via `lookup.unwrap_or(label)`) the lookup key, so rust-analyzer offers an invalid `repr(i28)` completion. The collision-suppression logic is also broken: this row's `collides` list omits `i128` (it lists up to i64 then jumps to isize), and every other row lists `i128` (never `i28`) as a collider, so an already-present `repr(i128)` will not suppress this bogus entry and vice-versa.","fix":"Change `attr(\"i28\", ...)` to `attr(\"i128\", &[\"transparent\", \"u8\", \"u16\", \"u32\", \"u64\", \"u128\", \"usize\", \"i8\", \"i16\", \"i32\", \"i64\", \"isize\"])`.","locations":[{"ref":"crates/ide-completion/src/completions/attribute/repr.rs:71","code":"   71 |     attr(\"i28\",    &[\"transparent\", \"u8\", \"u16\", \"u32\", \"u64\", \"u128\", \"usize\", \"i8\", \"i16\", \"i32\", \"i64\", \"isize\"]),","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide-completion/src/completions/attribute/repr.rs#L71"}]},
{"id":"CPY_6","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"In both injection highlighting code paths the nested HighlightConfig sets `specialize_operator: config.operator` instead of `specialize_operator: config.specialize_operator`. The user's specialize_operator setting is never propagated into ra_fixture blocks or doctest code blocks; instead the unrelated `operator` flag is reused. With operator:true but specialize_operator:false (a valid combination) injected code wrongly specializes operators, and the real specialize_operator value is silently dropped. The sibling line `specialize_punctuation: config.specialize_punctuation` is set correctly right next to it, making the mistake clear. config.specialize_operator is read correctly in syntax_highlighting.rs but never in inject.rs.","fix":"Change both occurrences of `specialize_operator: config.operator,` to `specialize_operator: config.specialize_operator,`.","locations":[{"ref":"crates/ide/src/syntax_highlighting/inject.rs:55","code":"   55 |                     specialize_operator: config.operator,","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide/src/syntax_highlighting/inject.rs#L55"},{"ref":"crates/ide/src/syntax_highlighting/inject.rs:197","code":"  197 |                 specialize_operator: config.operator,","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide/src/syntax_highlighting/inject.rs#L197"}]},
{"id":"CPY_7","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"Copy-paste bug in `resolve_index_expr`. The tuple binds `_index_mut_trait` to the *function* lang item `IndexMut_index_mut` instead of the `IndexMut` *trait* lang item, and evaluates `lang_items.IndexMut_index_mut?` twice. Compare the correct analogous code in `resolve_prefix_expr` (lines 861-862), which binds `(lang_items.DerefMut?, lang_items.DerefMut_deref_mut?)`. Currently benign because `_index_mut_trait` is unused, but it is misleading and means availability of the `IndexMut` trait itself is never checked.","fix":"Bind the trait: `let (_index_mut_trait, index_mut_fn) = (lang_items.IndexMut?, lang_items.IndexMut_index_mut?);` matching `resolve_prefix_expr`.","locations":[{"ref":"crates/hir/src/source_analyzer.rs:905-907","code":"  905 |                 let (_index_mut_trait, index_mut_fn) =\n  906 |                     (lang_items.IndexMut_index_mut?, lang_items.IndexMut_index_mut?);\n  907 |                 if func == index_mut_fn { Some(index_mut_fn) } else { None }","lines":3,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir/src/source_analyzer.rs#L905-L907"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"In structurally_normalize_ty, the comment at lines 418-420 states evaluate/fulfill mismatches 'are not a reason for an ICE' and the normalization-failure branch correctly returns None. But immediately after, if try_evaluate_obligations() returns non-empty errors after a successful structural normalization the code calls unreachable!() (an ICE). That is exactly the evaluate/fulfill-mismatch class the comment says should not ICE. During the next-solver migration solver bugs can leave residual errors here, crashing rust-analyzer instead of degrading.","fix":"Replace unreachable!() with `return None;` (consistent with the adjacent error path and the comment), optionally behind stdx::never!.","locations":[{"ref":"crates/hir-ty/src/autoderef.rs:423-426","code":"  423 |     let errors = ocx.try_evaluate_obligations();\n  424 |     if !errors.is_empty() {\n  425 |         unreachable!();\n  426 |     }","lines":4,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-ty/src/autoderef.rs#L423-L426"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"The metrics result file is opened with `write(true).create(true)` but without `truncate(true)`. If a previous run produced a larger JSON file, the shorter new content only overwrites the leading bytes and leaves stale trailing bytes, yielding a corrupt/invalid JSON file.","fix":"Add `.truncate(true)` to the OpenOptions (or use fs::write / File::create).","locations":[{"ref":"xtask/src/metrics.rs:69-71","code":"   69 |         let mut file =\n   70 |             fs::File::options().write(true).create(true).open(format!(\"target/{name}.json\"))?;\n   71 |         writeln!(file, \"{}\", metrics.json())?;","lines":3,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/xtask/src/metrics.rs#L69-L71"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"Format argument indices are truncated to 16 bits before encoding (e.g. `position as u16`, `... as u16`). The guard meant to catch overflow is a no-op: `if argmap.len() > u16::MAX as usize { /* FIXME: Emit an error. */ }`. With more than 65535 distinct (arg, trait) combinations the generated format bytecode silently encodes wrong indices and no diagnostic is produced. Practically unreachable, but the error branch is dead.","fix":"Emit a diagnostic in that branch (as the FIXME intends) or remove the dead `if`/comment, and document the 16-bit limit.","locations":[{"ref":"crates/hir-def/src/expr_store/lower/format_args.rs:280-284","code":"  280 |         // Ensure all argument indexes actually fit in 16 bits, as we truncated them to 16 bits before.\n  281 |         if argmap.len() > u16::MAX as usize {\n  282 |             // FIXME: Emit an error.\n  283 |             // ctx.dcx().span_err(macsp, \"too many format arguments\");\n  284 |         }","lines":5,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-def/src/expr_store/lower/format_args.rs#L280-L284"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"Several eager-expansion paths drop diagnostics by last-write-wins rather than crashing: `error` is overwritten in `eager_macro_recur` (eager.rs:160-161, 279-281), parse errors of inner lazy expansions are discarded (eager.rs:267-268), and `macro_expand` for `BuiltInEager` forwards only one of two possible errors (db.rs:601-603). These lead to silently dropped diagnostics.","fix":"Accumulate multiple errors (e.g. a combined error or `Vec<ExpandError>`) through `eager_macro_recur`/`macro_expand` instead of last-write-wins.","locations":[{"ref":"crates/hir-expand/src/eager.rs:166-167","code":"  166 |     // FIXME: We only report a single error inside of eager expansions\n  167 |     let mut error = None;","lines":2,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-expand/src/eager.rs#L166-L167"},{"ref":"crates/hir-expand/src/eager.rs:275-276","code":"  275 |                     // FIXME: We discard parse errors here\n  276 |                     parse.as_ref().map(|it| it.syntax_node()),","lines":2,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-expand/src/eager.rs#L275-L276"},{"ref":"crates/hir-expand/src/lib.rs:704-706","code":"  704 |                             // FIXME: We should report both errors!\n  705 |                             res.err = error.clone().or(res.err);\n  706 |                         }","lines":3,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-expand/src/lib.rs#L704-L706"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"Two `stdx::never!(false, \"...\")` diagnostics never fire. The `never!($cond, $fmt)` form expands to `!always!(!$cond, $fmt)`; with `$cond = false` it becomes `!always!(true, ...)`, which is always satisfied, so it never panics in debug nor logs via tracing. Both call sites intend to flag a should-never-happen branch (a Local that is not self but whose source is a SelfParam; a variable usage with no path parent), but the diagnostic is silently disabled. The correct idiom is the literal-only form `never!(\"message\")`, which fires unconditionally.","fix":"Drop the leading `false,` and use the literal form, e.g. `stdx::never!(\"Local::is_self returned false, but source is SelfParam\");` and `stdx::never!(\"cannot find path parent of variable usage: {:?}\", reference.name);`.","locations":[{"ref":"crates/ide-assists/src/handlers/extract_function.rs:1083","code":" 1083 |                     stdx::never!(false, \"Local::is_self returned false, but source is SelfParam\");","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide-assists/src/handlers/extract_function.rs#L1083"},{"ref":"crates/ide-assists/src/handlers/extract_function.rs:1244","code":" 1244 |         stdx::never!(false, \"cannot find path parent of variable usage: {:?}\", reference.name);","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide-assists/src/handlers/extract_function.rs#L1244"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In `add_function_impl_`, `add_const_impl`, and `add_type_alias_impl` the `CompletionItem` is fully constructed (label, lookup, docs, relevance) but `add_to(acc, ...)` is only called inside an `if let Some(source) ... && let Some(transformed) ...` block. If `ctx.sema.source(...)` or the transform returns `None`, the item is silently discarded with no fallback, so a known-missing trait member can produce zero completions when source/transform resolution fails.","fix":"Add a best-effort label-only fallback edit when the transform fails, or document why dropping is intentional.","locations":[{"ref":"crates/ide-completion/src/completions/item_list/trait_impl.rs:233-255","code":"  233 |     let mut item = CompletionItem::new(completion_kind, replacement_range, label, ctx.edition);\n  234 |     item.lookup_by(format!(\"{}fn {}\", async_, fn_name.display(ctx.db, ctx.edition)))\n  235 |         .set_documentation(func.docs(ctx.db))\n  236 |         .set_relevance(CompletionRelevance { exact_name_match: true, ..Default::default() });\n  237 | \n  238 |     if let Some(source) = ctx.sema.source(func)\n  239 |         && let Some(transformed_fn) =\n  240 |             get_transformed_fn(ctx, source.value, impl_def, async_sugaring)\n  241 |     {\n  242 |         let function_decl = function_declaration(ctx, &transformed_fn, source.file_id.macro_file());\n  243 |         let ws = if function_decl.contains('\\n') { \"\\n\" } else { \" \" };\n  244 |         match ctx.config.snippet_cap {\n  245 |             Some(cap) => {\n  246 |                 let snippet = format!(\"{function_decl}{ws}{{\\n    $0\\n}}\");\n  247 |                 item.snippet_edit(cap, TextEdit::replace(replacement_range, snippet));\n  248 |             }\n  249 |             None => {\n  250 |                 let header = format!(\"{function_decl}{ws}{{\");\n  251 |                 item.text_edit(TextEdit::replace(replacement_range, header));\n  252 |             }\n  253 |         };\n  254 |         item.add_to(acc, ctx.db);\n  255 |     }","lines":23,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide-completion/src/completions/item_list/trait_impl.rs#L233-L255"},{"ref":"crates/ide-completion/src/completions/item_list/trait_impl.rs:487-503","code":"  487 |             let mut item =\n  488 |                 CompletionItem::new(SymbolKind::Const, replacement_range, label, ctx.edition);\n  489 |             item.lookup_by(format_smolstr!(\"const {const_name}\"))\n  490 |                 .set_documentation(const_.docs(ctx.db))\n  491 |                 .set_relevance(CompletionRelevance {\n  492 |                     exact_name_match: true,\n  493 |                     ..Default::default()\n  494 |                 });\n  495 |             match ctx.config.snippet_cap {\n  496 |                 Some(cap) => item.snippet_edit(\n  497 |                     cap,\n  498 |                     TextEdit::replace(replacement_range, format!(\"{replacement}$0;\")),\n  499 |                 ),\n  500 |                 None => item.text_edit(TextEdit::replace(replacement_range, replacement)),\n  501 |             };\n  502 |             item.add_to(acc, ctx.db);\n  503 |         }","lines":17,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide-completion/src/completions/item_list/trait_impl.rs#L487-L503"}]},
{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"The `change_case` quick-fix swallows rename errors: `res.source_change = Some(source_change.ok().unwrap_or_default());`. When `def.rename(...)` fails (e.g. a name collision the rename machinery rejects), rust-analyzer still advertises a resolved `Rename to X` quick-fix whose source change is an empty `SourceChange`. The user clicks the fix and nothing happens - a misleading no-op resolved assist.","fix":"On `Err`, omit the fix instead of emitting an empty edit (only push the assist when `source_change` is `Ok`), so the action doesn't appear when it cannot be applied.","locations":[{"ref":"crates/ide-diagnostics/src/handlers/incorrect_case.rs:49-57","code":"   49 |     if ctx.resolve.should_resolve(&res.id) {\n   50 |         let source_change = def.rename(\n   51 |             &ctx.sema,\n   52 |             &d.suggested_text,\n   53 |             RenameDefinition::Yes,\n   54 |             &ctx.config.rename_config(),\n   55 |         );\n   56 |         res.source_change = Some(source_change.ok().unwrap_or_default());\n   57 |     }","lines":9,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide-diagnostics/src/handlers/incorrect_case.rs#L49-L57"}]},
{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In rewrite_links the markdown offset is converted with range.start.try_into().unwrap() / range.end.try_into().unwrap(), which panics if an offset exceeds u32::MAX. The structurally identical conversion in extract_definitions_from_docs (doc_links.rs:200) correctly uses .ok()?. The inconsistency is a latent panic and should match the graceful variant.","fix":"Replace the two .try_into().unwrap() with .try_into().ok()? handling (skip the link if conversion fails).","locations":[{"ref":"crates/ide/src/doc_links.rs:73-74","code":"   73 |             let text_range =\n   74 |                 TextRange::new(range.start.try_into().unwrap(), range.end.try_into().unwrap());","lines":2,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide/src/doc_links.rs#L73-L74"}]},
{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`json::read` ignores the byte count returned by `read_line` and detects end-of-stream solely via `buf.pop()` + `buf.is_empty()`. This conflates true EOF, a blank line, and the post-pop empty buffer into the same `Ok(None)` (\"stream end\"). A genuine blank line emitted mid-stream by a misbehaving macro is treated as connection end rather than skipped like the non-`{` debug-output case handled just below.","fix":"Inspect the read_line result (`if inp.read_line(buf)? == 0 { return Ok(None); }`) to detect EOF explicitly, and treat a blank-but-not-EOF line the same as the non-`{` branch (continue).","locations":[{"ref":"crates/proc-macro-api/src/transport/json.rs:13-17","code":"   13 |         inp.read_line(buf)?;\n   14 |         buf.pop(); // Remove trailing '\\n'\n   15 | \n   16 |         if buf.is_empty() {\n   17 |             return Ok(None);","lines":5,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/proc-macro-api/src/transport/json.rs#L13-L17"}]},
{"id":"ERR_10","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"CommandHandle::cancel kills/waits the child but never joins the reader thread, and cancel_check_process drops the receiver immediately after cancel() returns. The detached reader thread may still be draining buffered pipe data and call `sender.send(...).unwrap()` on a now-disconnected channel, panicking. The panic is confined to a worker thread (won't crash the server) but produces spurious panic logs. Window is small because kill closes the pipes, but the race is real.","fix":"Join the reader thread inside cancel() before returning, or tolerate a disconnected receiver in the reader (ignore SendError and stop) instead of unwrap().","locations":[{"ref":"crates/rust-analyzer/src/command.rs:76","code":"   76 |                 self.sender.send(t).unwrap();","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/rust-analyzer/src/command.rs#L76"},{"ref":"crates/rust-analyzer/src/command.rs:106","code":"  106 |                     self.sender.send(t).unwrap();","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/rust-analyzer/src/command.rs#L106"},{"ref":"crates/rust-analyzer/src/flycheck.rs:846-847","code":"  846 |             command_handle.cancel();\n  847 |             self.command_receiver.take();","lines":2,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/rust-analyzer/src/flycheck.rs#L846-L847"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"Inconsistent unsafe-impl filtering in term search. `assoc_const` and `impl_static_method` skip unsafe impls via `!imp.is_unsafe(db)`, but `impl_method` iterates `Impl::all_for_type` without filtering unsafe impls (it still filters unsafe-to-call functions via `is_unsafe_to_call`, limiting impact). The inconsistency with the sibling tactics is suspicious and likely unintentional.","fix":"If unsafe impls should be skipped consistently, add `.filter(|(_, imp)| !imp.is_unsafe(db))` after `Impl::all_for_type` in `impl_method`.","locations":[{"ref":"crates/hir/src/term_search/tactics.rs:414-422","code":"  414 |     lookup\n  415 |         .new_types(NewTypesKey::ImplMethod)\n  416 |         .into_iter()\n  417 |         .filter(|ty| !ty.type_arguments().any(|it| it.contains_unknown()))\n  418 |         .filter(|_| should_continue())\n  419 |         .flat_map(|ty| {\n  420 |             Impl::all_for_type(db, ty.clone()).into_iter().map(move |imp| (ty.clone(), imp))\n  421 |         })\n  422 |         .flat_map(|(ty, imp)| imp.items(db).into_iter().map(move |item| (imp, ty.clone(), item)))","lines":9,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir/src/term_search/tactics.rs#L414-L422"},{"ref":"crates/hir/src/term_search/tactics.rs:616","code":"  616 |         .filter(|(_, imp)| !imp.is_unsafe(db))","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir/src/term_search/tactics.rs#L616"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"closing_brace::hints has signature -> Option<()> and uses ? throughout to early-return on missing data, implying Some(()) denotes success; but the success path (after acc.push) falls through to None at line 189. The caller currently ignores the return value, but this is inconsistent with every other hints function in these modules (which return Some(()) on success); a future caller relying on the return would misread success as failure.","fix":"Return Some(()) after pushing the hint.","locations":[{"ref":"crates/ide/src/inlay_hints/closing_brace.rs:187","code":"  187 |     None","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide/src/inlay_hints/closing_brace.rs#L187"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`parse_repeat` accumulates separator puncts into an `ArrayVec<tt::Punct, MAX_GLUED_PUNCT_LEN>` guarded by the magic literal `puncts.len() < 3`. `MAX_GLUED_PUNCT_LEN` is currently 3 so this is correct today, but if the constant changes the guard becomes wrong and an over-capacity `push` would panic.","fix":"Replace the literal `3` with `MAX_GLUED_PUNCT_LEN`.","locations":[{"ref":"crates/mbe/src/parser.rs:377","code":"  377 |                         Separator::Puncts(puncts) if puncts.len() < 3 => {","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/mbe/src/parser.rs#L377"}]},
{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`delete_all` and `replace_all` only `debug_assert!` that `range.start()` belongs to the editor's tree; they never validate `range.end()`. A range whose end lives in a different tree (an easy caller mistake) passes validation and is stored, then panics later inside `apply_edits`/splice with a less actionable message. The single-element forms (`delete`/`replace`) validate their one element, so multi-element ranges are strictly less checked.","fix":"Add a matching `debug_assert!` for `range.end()` (and ideally assert start/end share a parent) in both methods.","locations":[{"ref":"crates/syntax/src/syntax_editor.rs:150-158","code":"  150 |     pub fn delete_all(&self, range: RangeInclusive<SyntaxElement>) {\n  151 |         if range.start() == range.end() {\n  152 |             self.delete(range.start());\n  153 |             return;\n  154 |         }\n  155 | \n  156 |         debug_assert!(is_ancestor_or_self_of_element(range.start(), &self.root));\n  157 |         self.changes.borrow_mut().push(Change::ReplaceAll(range, Vec::new()))\n  158 |     }","lines":9,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/syntax/src/syntax_editor.rs#L150-L158"},{"ref":"crates/syntax/src/syntax_editor.rs:192-200","code":"  192 |     pub fn replace_all(&self, range: RangeInclusive<SyntaxElement>, new: Vec<SyntaxElement>) {\n  193 |         if range.start() == range.end() {\n  194 |             self.replace_with_many(range.start(), new);\n  195 |             return;\n  196 |         }\n  197 | \n  198 |         debug_assert!(is_ancestor_or_self_of_element(range.start(), &self.root));\n  199 |         self.changes.borrow_mut().push(Change::ReplaceAll(range, new))\n  200 |     }","lines":9,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/syntax/src/syntax_editor.rs#L192-L200"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"Each push onto the per-item `SmallVec<[ImportInfo; 1]>` is preceded by `infos.reserve_exact(1)`. When an item accumulates multiple ImportInfos (re-exports, and any case beyond the single inline slot), `reserve_exact(1)` forces capacity to grow by exactly one element per push, defeating amortized doubling and giving O(n^2) reallocations/copies. This runs in `import_map_query` (build-time hot).","fix":"Remove the `reserve_exact(1)` calls and just push (SmallVec already amortizes growth), or reserve the real total count up front when known.","locations":[{"ref":"crates/hir-def/src/import_map.rs:225-226","code":"  225 |                     infos.reserve_exact(1);\n  226 |                     infos.push(import_info);","lines":2,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-def/src/import_map.rs#L225-L226"},{"ref":"crates/hir-def/src/import_map.rs:261-262","code":"  261 |             infos.reserve_exact(1);\n  262 |             infos.push(variant_info);","lines":2,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-def/src/import_map.rs#L261-L262"},{"ref":"crates/hir-def/src/import_map.rs:306-307","code":"  306 |             infos.reserve_exact(1);\n  307 |             infos.push(assoc_item_info);","lines":2,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-def/src/import_map.rs#L306-L307"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"Two identical FIXME-flagged spots note that pushing one BlockScope per block in resolver construction is O(n^2), because each resolution already walks all parent modules. Block-heavy bodies pay quadratic cost during name resolution. Acknowledged but duplicated in update_to_inner_scope_ and resolver_for_scope_.","fix":"Store only the innermost block module scope (parents reachable via DefMap::parent() during resolution) instead of pushing a scope per block.","locations":[{"ref":"crates/hir-def/src/resolver.rs:931-934","code":"  931 |                 // FIXME: This adds as many module scopes as there are blocks, but resolving in each\n  932 |                 // already traverses all parents, so this is O(n²). I think we could only store the\n  933 |                 // innermost module scope instead?\n  934 |             }","lines":4,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-def/src/resolver.rs#L931-L934"},{"ref":"crates/hir-def/src/resolver.rs:1138-1141","code":" 1138 |             // FIXME: This adds as many module scopes as there are blocks, but resolving in each\n 1139 |             // already traverses all parents, so this is O(n²). I think we could only store the\n 1140 |             // innermost module scope instead?\n 1141 |         }","lines":4,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-def/src/resolver.rs#L1138-L1141"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`ExpansionInfo::map_range_down`/`map_range_down_exact` and `map_range_up_once` linearly scan the entire span-map backing vector (as the in-code FIXME at 838-840 notes), which can be quadratic for callers that map many tokens (e.g. semantic highlighting). Documented but unaddressed.","fix":"As the FIXME suggests, add a reverse index (span -> ranges) to `ExpansionInfo` so repeated down-mapping is not O(n) per lookup; or batch lookups.","locations":[{"ref":"crates/hir-expand/src/lib.rs:1312-1349","code":" 1312 |     /// Maps the passed in file range down into a macro expansion if it is the input to a macro call.\n 1313 |     ///\n 1314 |     /// Note this does a linear search through the entire backing vector of the spanmap.\n 1315 |     // FIXME: Consider adding a reverse map to ExpansionInfo to get rid of the linear search which\n 1316 |     // potentially results in quadratic look ups (notably this might improve semantic highlighting perf)\n 1317 |     pub fn map_range_down_exact(\n 1318 |         &self,\n 1319 |         span: Span,\n 1320 |     ) -> Option<InMacroFile<impl Iterator<Item = (SyntaxToken, SyntaxContext)> + '_>> {\n 1321 |         if span.anchor.ast_id == NO_DOWNMAP_ERASED_FILE_AST_ID_MARKER {\n 1322 |             return None;\n 1323 |         }\n 1324 | \n 1325 |         let tokens = self.exp_map.ranges_with_span_exact(span).flat_map(move |(range, ctx)| {\n 1326 |             self.expanded.value.covering_element(range).into_token().zip(Some(ctx))\n 1327 |         });\n 1328 | \n 1329 |         Some(InMacroFile::new(self.expanded.file_id, tokens))\n 1330 |     }\n 1331 | \n 1332 |     /// Maps the passed in file range down into a macro expansion if it is the input to a macro call.\n 1333 |     /// Unlike [`ExpansionInfo::map_range_down_exact`], this will consider spans that contain the given span.\n 1334 |     ///\n 1335 |     /// Note this does a linear search through the entire backing vector of the spanmap.\n 1336 |     pub fn map_range_down(\n 1337 |         &self,\n 1338 |         span: Span,\n 1339 |     ) -> Option<InMacroFile<impl Iterator<Item = (SyntaxToken, SyntaxContext)> + '_>> {\n 1340 |         if span.anchor.ast_id == NO_DOWNMAP_ERASED_FILE_AST_ID_MARKER {\n 1341 |             return None;\n 1342 |         }\n 1343 | \n 1344 |         let tokens = self.exp_map.ranges_with_span(span).flat_map(move |(range, ctx)| {\n 1345 |             self.expanded.value.covering_element(range).into_token().zip(Some(ctx))\n 1346 |         });\n 1347 | \n 1348 |         Some(InMacroFile::new(self.expanded.file_id, tokens))\n 1349 |     }","lines":38,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-expand/src/lib.rs#L1312-L1349"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"item_non_self_bounds collects all item bounds and all self bounds into two FxHashSets on every call just to compute a set difference. item_bounds and item_self_bounds each independently elaborate bounds, duplicating the elaboration work, and two hash sets are materialized. This is reachable from trait solving as an Interner method.","fix":"Compute the self-bounds set once, then filter the elaborated full bounds against it in a single pass, avoiding the second FxHashSet and the fragile len()-equality shortcut.","locations":[{"ref":"crates/hir-ty/src/next_solver/interner.rs:1340-1355","code":" 1340 |     fn item_non_self_bounds(\n 1341 |         self,\n 1342 |         def_id: Self::DefId,\n 1343 |     ) -> EarlyBinder<Self, impl IntoIterator<Item = Self::Clause>> {\n 1344 |         let all_bounds: FxHashSet<_> = self.item_bounds(def_id).skip_binder().into_iter().collect();\n 1345 |         let own_bounds: FxHashSet<_> =\n 1346 |             self.item_self_bounds(def_id).skip_binder().into_iter().collect();\n 1347 |         if all_bounds.len() == own_bounds.len() {\n 1348 |             EarlyBinder::bind(Clauses::empty(self))\n 1349 |         } else {\n 1350 |             EarlyBinder::bind(Clauses::new_from_iter(\n 1351 |                 self,\n 1352 |                 all_bounds.difference(&own_bounds).cloned(),\n 1353 |             ))\n 1354 |         }\n 1355 |     }","lines":16,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-ty/src/next_solver/interner.rs#L1340-L1355"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"In `write_variants`, for each variant the full field list is materialized via `variant.fields(f.db)` (which allocates a `Vec<Field>`) only to test `.is_empty()` - up to twice per variant. Display-only, so impact is minor, but it allocates a whole Vec just to check emptiness.","fix":"Use a cheaper emptiness check (field count from signature data or a dedicated `has_fields`/`fields_len` helper) instead of building a `Vec<Field>`.","locations":[{"ref":"crates/hir/src/display.rs:505","code":"  505 |                         if variant.fields(f.db).is_empty() { \"()\" } else { \"( /* … */ )\" };","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir/src/display.rs#L505"},{"ref":"crates/hir/src/display.rs:510","code":"  510 |                         if variant.fields(f.db).is_empty() { \" {}\" } else { \" { /* … */ }\" };","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir/src/display.rs#L510"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"generate_delegate_methods calls find_struct_impl once per candidate delegated method inside the `for (index, (name, method))` loop. Each call walks all module.descendants(), casts every ast::Impl, and runs sema.to_def on each impl. The impl lookup is name-independent, so this repeats the full impl scan and re-resolution N times for a field type exposing N delegable methods.","fix":"Find the matching inherent impl block once before the loop; per method only run `has_any_fn(impl_blk, &[name])` to decide whether to skip.","locations":[{"ref":"crates/ide-assists/src/handlers/generate_delegate_methods.rs:98-104","code":"   98 |     for (index, (name, method)) in methods.into_iter().enumerate() {\n   99 |         let adt = ast::Adt::Struct(strukt.clone());\n  100 |         let name = name.display(ctx.db(), current_edition).to_string();\n  101 |         // if `find_struct_impl` returns None, that means that a function named `name` already exists.\n  102 |         let Some(impl_def) = find_struct_impl(ctx, &adt, std::slice::from_ref(&name)) else {\n  103 |             continue;\n  104 |         };","lines":7,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide-assists/src/handlers/generate_delegate_methods.rs#L98-L104"},{"ref":"crates/ide-assists/src/utils.rs:483-516","code":"  483 | pub(crate) fn find_struct_impl(\n  484 |     ctx: &AssistContext<'_, '_>,\n  485 |     adt: &ast::Adt,\n  486 |     names: &[String],\n  487 | ) -> Option<Option<ast::Impl>> {\n  488 |     let db = ctx.db();\n  489 |     let module = adt.syntax().parent()?;\n  490 | \n  491 |     let struct_def = ctx.sema.to_def(adt)?;\n  492 | \n  493 |     let block = module.descendants().filter_map(ast::Impl::cast).find_map(|impl_blk| {\n  494 |         let blk = ctx.sema.to_def(&impl_blk)?;\n  495 | \n  496 |         // FIXME: handle e.g. {"id":"PERF_9","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"In file_structure, on every WalkEvent::Leave for both nodes and tokens the code calls structure_node/structure_token again purely to test .is_some() so it knows whether to pop the stack. This re-runs all the match_ast! work, collapse_ws string building, and attribute scanning a second time for every matched element, doubling structure-computation cost. file_structure runs over the whole file (outline / breadcrumbs).","fix":"Compute the structure once on Enter and remember (e.g. push a marker / range) whether a push happened; make the Leave pop unconditional/correct by construction, removing both the recompute and the fragile pop().unwrap().","locations":[{"ref":"crates/ide/src/file_structure.rs:51-78","code":"   51 |     for event in file.syntax().preorder_with_tokens() {\n   52 |         match event {\n   53 |             WalkEvent::Enter(NodeOrToken::Node(node)) => {\n   54 |                 if let Some(mut symbol) = structure_node(&node, config) {\n   55 |                     symbol.parent = stack.last().copied();\n   56 |                     stack.push(res.len());\n   57 |                     res.push(symbol);\n   58 |                 }\n   59 |             }\n   60 |             WalkEvent::Leave(NodeOrToken::Node(node)) => {\n   61 |                 if structure_node(&node, config).is_some() {\n   62 |                     stack.pop().unwrap();\n   63 |                 }\n   64 |             }\n   65 |             WalkEvent::Enter(NodeOrToken::Token(token)) => {\n   66 |                 if let Some(mut symbol) = structure_token(token) {\n   67 |                     symbol.parent = stack.last().copied();\n   68 |                     stack.push(res.len());\n   69 |                     res.push(symbol);\n   70 |                 }\n   71 |             }\n   72 |             WalkEvent::Leave(NodeOrToken::Token(token)) => {\n   73 |                 if structure_token(token).is_some() {\n   74 |                     stack.pop().unwrap();\n   75 |                 }\n   76 |             }\n   77 |         }\n   78 |     }","lines":28,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide/src/file_structure.rs#L51-L78"}]},
{"id":"PERF_10","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"In view_memory_layout read_layout, each field's Type::layout(db) is computed up to three times: in the first loop, again in the error branch (.unwrap_err()), and a third time in the second loop. layout_of_ty is a memoized salsa query but each call still re-runs param_env, .store() conversions and target_data_layout(...).unwrap(). The error-branch recompute is the clearest waste since the Err is already in hand; the second loop re-queries layout for every Ok field.","fix":"Compute each field's layout once into a Vec<Result<Layout, LayoutError>>, reuse the Err in the error branch, and thread the computed layout into the recursive read_layout call instead of recomputing.","locations":[{"ref":"crates/ide/src/view_memory_layout.rs:140-175","code":"  140 |         for (field, child_ty) in fields.iter() {\n  141 |             if let Ok(child_layout) = child_ty.layout(db) {\n  142 |                 nodes.push(MemoryLayoutNode {\n  143 |                     item_name: field.name(db),\n  144 |                     typename: { child_ty.display(db, display_target).to_string() },\n  145 |                     size: child_layout.size(),\n  146 |                     alignment: child_layout.align(),\n  147 |                     offset: match *field {\n  148 |                         FieldOrTupleIdx::Field(f) => layout.field_offset(f).unwrap_or(0),\n  149 |                         FieldOrTupleIdx::TupleIdx(f) => layout.tuple_field_offset(f).unwrap_or(0),\n  150 |                     },\n  151 |                     parent_idx: parent_idx as i64,\n  152 |                     children_start: -1,\n  153 |                     children_len: 0,\n  154 |                 });\n  155 |             } else {\n  156 |                 nodes.push(MemoryLayoutNode {\n  157 |                     item_name: field.name(db)\n  158 |                         + format!(\"(no layout data: {:?})\", child_ty.layout(db).unwrap_err())\n  159 |                             .as_ref(),\n  160 |                     typename: child_ty.display(db, display_target).to_string(),\n  161 |                     size: 0,\n  162 |                     offset: 0,\n  163 |                     alignment: 0,\n  164 |                     parent_idx: parent_idx as i64,\n  165 |                     children_start: -1,\n  166 |                     children_len: 0,\n  167 |                 });\n  168 |             }\n  169 |         }\n  170 | \n  171 |         for (i, (_, child_ty)) in fields.iter().enumerate() {\n  172 |             if let Ok(child_layout) = child_ty.layout(db) {\n  173 |                 read_layout(nodes, db, child_ty, &child_layout, children_start + i, display_target);\n  174 |             }\n  175 |         }","lines":36,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide/src/view_memory_layout.rs#L140-L175"}]},
{"id":"PERF_11","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`FetchMetadata::new` always performs a synchronous `--no-deps` `cargo metadata` invocation inside the constructor, even when `no_deps` is false and the subsequent `exec` will run a full `cargo metadata` again. This means the common workspace-load path spawns cargo twice per workspace, doubling cargo process spawns during loading. The pre-fetch exists as an offline fallback, but it is run unconditionally and eagerly even when the full fetch will succeed.","fix":"Only run the `--no-deps` pre-fetch lazily on failure of the full fetch (or gate it behind a flag), instead of always executing it in `new`.","locations":[{"ref":"crates/project-model/src/cargo_workspace.rs:730-746","code":"  730 |         // Pre-fetch basic metadata using `--no-deps`, which:\n  731 |         // - avoids fetching registries like crates.io,\n  732 |         // - skips dependency resolution and does not modify lockfiles,\n  733 |         // - and thus doesn't require progress reporting or copying lockfiles.\n  734 |         //\n  735 |         // Useful as a fast fallback to extract info like `target-dir`.\n  736 |         let cargo_command;\n  737 |         let no_deps_result = if no_deps {\n  738 |             command.no_deps();\n  739 |             cargo_command = command.cargo_command();\n  740 |             command.exec()\n  741 |         } else {\n  742 |             let mut no_deps_command = command.clone();\n  743 |             no_deps_command.no_deps();\n  744 |             cargo_command = no_deps_command.cargo_command();\n  745 |             no_deps_command.exec()\n  746 |         }","lines":17,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/project-model/src/cargo_workspace.rs#L730-L746"}]},
{"id":"PERF_12","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"patch_old_style::merge always evaluates `v.clone()` to build the or_insert default even when the key already exists and the clone is immediately discarded: `merge(dst.entry(k).or_insert(v.clone()), v)`. For an existing key this performs a full deep serde_json::Value clone for nothing. Only runs during config application, so impact is minor.","fix":"Use the Entry API explicitly: on Occupied, merge into get_mut() with the original v; on Vacant, insert v - avoiding the eager clone.","locations":[{"ref":"crates/rust-analyzer/src/config/patch_old_style.rs:141-150","code":"  141 | fn merge(dst: &mut Value, src: Value) {\n  142 |     match (dst, src) {\n  143 |         (Value::Object(dst), Value::Object(src)) => {\n  144 |             for (k, v) in src {\n  145 |                 merge(dst.entry(k).or_insert(v.clone()), v)\n  146 |             }\n  147 |         }\n  148 |         (dst, src) => *dst = src,\n  149 |     }\n  150 | }","lines":10,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/rust-analyzer/src/config/patch_old_style.rs#L141-L150"}]},
{"id":"PERF_13","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"completion_items computes `config.completion(None, MiniCore::default())` once for the limit and then completion_item recomputes the same config (including MiniCore::default()) inside the per-item loop, so the completion config is reconstructed for every completion item even though the fields read (enable_imports_on_the_fly, limit) do not vary per item.","fix":"Compute the completion config once in completion_items and pass the needed values into completion_item.","locations":[{"ref":"crates/rust-analyzer/src/lsp/to_proto.rs:282","code":"  282 |     if let Some(limit) = config.completion(None, MiniCore::default()).limit {","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/rust-analyzer/src/lsp/to_proto.rs#L282"},{"ref":"crates/rust-analyzer/src/lsp/to_proto.rs:424","code":"  424 |     let imports = if config.completion(None, MiniCore::default()).enable_imports_on_the_fly","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/rust-analyzer/src/lsp/to_proto.rs#L424"}]},
{"id":"PERF_14","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"MemDocs::get_mut calls `Arc::make_mut(&mut self.mem_docs)` before checking whether the key exists. Because GlobalState::snapshot clones mem_docs, the inner Arc frequently has refcount > 1, so make_mut deep-clones the entire document map - and it does so unconditionally even when the path is absent and no mutation occurs.","fix":"Check presence first (`if !self.mem_docs.contains_key(path) { return None; }`) and only then call Arc::make_mut.","locations":[{"ref":"crates/rust-analyzer/src/mem_docs.rs:44-48","code":"   44 |     pub(crate) fn get_mut(&mut self, path: &VfsPath) -> Option<&mut DocumentData> {\n   45 |         // NB: don't set `self.added_or_removed` here, as that purposefully only\n   46 |         // tracks changes to the key set.\n   47 |         Arc::make_mut(&mut self.mem_docs).get_mut(path).map(Arc::make_mut)\n   48 |     }","lines":5,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/rust-analyzer/src/mem_docs.rs#L44-L48"}]},

{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"In `free_function`, `non_default_type_params_len` causes an early `return None` whenever it is `> 0` (line 339), so `permutations(non_default_type_params_len)` is always `permutations(0)`. As a result the `lookup.iter_types().collect::<Vec<_>>()` materialization (343-347) is unused, and the `None =>` arm (358-362, with `g.next().expect(\"Missing type param\")`) is unreachable. Functions with non-default generics are always rejected, so the generic-permutation machinery never does real work and adds a needless allocation per function.","fix":"Remove the unused permutation machinery, or lift the `> 0` early-return so the logic actually runs if generic support is intended.","locations":[{"ref":"crates/hir/src/term_search/tactics.rs:301-330","code":"  301 |                 let non_default_type_params_len =\n  302 |                     type_params.iter().filter(|it| it.default(db).is_none()).count();\n  303 | \n  304 |                 // Ignore bigger number of generics for now as they kill the performance\n  305 |                 if non_default_type_params_len > 0 {\n  306 |                     return None;\n  307 |                 }\n  308 | \n  309 |                 let generic_params = lookup\n  310 |                     .iter_types()\n  311 |                     .collect::<Vec<_>>() // Force take ownership\n  312 |                     .into_iter()\n  313 |                     .permutations(non_default_type_params_len);\n  314 | \n  315 |                 let exprs: Vec<_> = generic_params\n  316 |                     .filter(|_| should_continue())\n  317 |                     .filter_map(|generics| {\n  318 |                         // Insert default type params\n  319 |                         let mut g = generics.into_iter();\n  320 |                         let generics: Vec<_> = type_params\n  321 |                             .iter()\n  322 | {"id":"DEAD_9","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In `inactive_code`, the `if inactive_reasons.is_empty() { format_to!(message); }` branch calls `format_to!` with no arguments, which is a no-op. The branch exists only to test emptiness and does nothing in the empty case; in the non-empty case it re-formats `inactive` (a second `Display`/`to_string` call) instead of reusing the already-computed `inactive_reasons` string.","fix":"Simplify to `if !inactive_reasons.is_empty() { format_to!(message, \": {inactive_reasons}\"); }`, dropping the empty no-op branch and reusing the computed string.","locations":[{"ref":"crates/ide-diagnostics/src/handlers/inactive_code.rs:21-29","code":"   21 |     if let Some(inactive) = inactive {\n   22 |         let inactive_reasons = inactive.to_string();\n   23 | \n   24 |         if inactive_reasons.is_empty() {\n   25 |             format_to!(message);\n   26 |         } else {\n   27 |             format_to!(message, \": {}\", inactive);\n   28 |         }\n   29 |     }","lines":9,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide-diagnostics/src/handlers/inactive_code.rs#L21-L29"}]},

{"id":"DEAD_11","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In highlight_references the outer match def has an explicit Definition::Local(local) arm that handles every local, so the catch-all `def => {...}` arm can never receive a Definition::Local. Yet inside it the category is computed with `matches!(def, Definition::Local(l) if l.is_mut(sema.db))`, which is always false. Dead, misleading logic that pretends to color mutable-local defs as WRITE in a path that never sees locals.","fix":"Replace the matches! expression with `let category = ReferenceCategory::empty();` (locals are already handled above) and drop the impossible Local arm / unused binding.","locations":[{"ref":"crates/ide/src/highlight_related.rs:288-294","code":"  288 |                     let hl_range = nav.focus_range.map(|range| {\n  289 |                         let category = if matches!(def, Definition::Local(l) if l.is_mut(sema.db)) {\n  290 |                             ReferenceCategory::WRITE\n  291 |                         } else {\n  292 |                             ReferenceCategory::empty()\n  293 |                         };\n  294 |                         HighlightedRange { range, category }","lines":7,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide/src/highlight_related.rs#L288-L294"}]},

{"id":"DEAD_15","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"In test_explorer discover_tests_in_module, discover_tests_in_module is always called recursively for every child module, but when only_in_this_file is true and the child module is not inline, the returned module_children are discarded (the guard prevents r.extend). The recursion still walks the entire out-of-file submodule subtree just to test emptiness, doing unnecessary work in the discover-tests-in-file path.","fix":"When only_in_this_file && !c.is_inline(db), skip/short-circuit the recursive descent (e.g. a cheaper has-any-test probe) instead of recursing past the file boundary.","locations":[{"ref":"crates/ide/src/test_explorer.rs:73-88","code":"   73 |         let module_children = discover_tests_in_module(db, c, module_id.clone(), only_in_this_file);\n   74 |         if !module_children.is_empty() {\n   75 |             let nav = NavigationTarget::from_module_to_decl(sema.db, c).call_site;\n   76 |             r.push(TestItem {\n   77 |                 id: module_id,\n   78 |                 kind: TestItemKind::Module,\n   79 |                 label: module_name,\n   80 |                 parent: Some(prefix_id.clone()),\n   81 |                 file: Some(nav.file_id),\n   82 |                 text_range: Some(nav.focus_or_full_range()),\n   83 |                 runnable: None,\n   84 |             });\n   85 |             if !only_in_this_file || c.is_inline(db) {\n   86 |                 r.extend(module_children);\n   87 |             }\n   88 |         }","lines":16,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide/src/test_explorer.rs#L73-L88"}]},
{"id":"DEAD_16","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`EnvChange::rollback(self)` consumes `self` and has an empty body; the actual environment/working-dir restoration happens in the `Drop` impl. The explicit `prev_env.rollback()` call in `expand` is therefore just an obscure way to drop the guard, which can mislead a reader into thinking rollback is conditional/manual.","fix":"Remove `rollback` and rely on the `Drop` impl with a `drop(prev_env)` (or an explicit scope), or document that `rollback` exists only to make the drop point explicit.","locations":[{"ref":"crates/proc-macro-srv/src/lib.rs:345","code":"  345 |     fn rollback(self) {}","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/proc-macro-srv/src/lib.rs#L345"},{"ref":"crates/proc-macro-srv/src/lib.rs:187","code":"  187 |         prev_env.rollback();","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/proc-macro-srv/src/lib.rs#L187"}]},

{"id":"DEAD_19","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"Both `shuffle` and `seed` in stdx::rand are public but unused anywhere in the workspace (the only in-repo shuffle is a separate local copy in analysis_stats.rs). The module thus ships a buggy, untested public API surface.","fix":"Either remove the module or add tests; if kept, fix the underflow and bias bugs above before relying on it.","locations":[{"ref":"crates/stdx/src/rand.rs:6-19","code":"    6 | pub fn shuffle<T>(slice: &mut [T], mut rand_index: impl FnMut(usize) -> usize) {\n    7 |     let mut remaining = slice.len() - 1;\n    8 |     while remaining > 0 {\n    9 |         let index = rand_index(remaining);\n   10 |         slice.swap(remaining, index);\n   11 |         remaining -= 1;\n   12 |     }\n   13 | }\n   14 | \n   15 | pub fn seed() -> u64 {\n   16 |     use std::hash::{BuildHasher, Hasher};\n   17 |     #[allow(clippy::disallowed_types)]\n   18 |     std::collections::hash_map::RandomState::new().build_hasher().finish()\n   19 | }","lines":14,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/stdx/src/rand.rs#L6-L19"}]},
