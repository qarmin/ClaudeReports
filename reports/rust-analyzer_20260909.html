{"id":"OVF_12","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"position() in flycheck_to_proto does `let line_index = line_number - span.line_start;` with plain usize subtraction. The span values are deserialized from external rustc/cargo/custom-command JSON; a malformed span with line_end < line_start (or line_number < line_start) would panic the diagnostics-mapping path. The rest of the function is otherwise carefully defensive (saturating_sub, .get(), None fallbacks), making this the lone unguarded arithmetic.","fix":"Use `line_number.saturating_sub(span.line_start)` for consistency with the surrounding defensive style.","locations":[{"ref":"crates/rust-analyzer/src/diagnostics/flycheck_to_proto.rs:90","code":"   90 |     let line_index = line_number - span.line_start;","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/rust-analyzer/src/diagnostics/flycheck_to_proto.rs#L90"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`Type::contains_reference` no longer inspects ADT field types. A correct field-collecting closure `_variant_id_to_fields` (lines 5581-5599) is defined but underscore-prefixed (dead), and the very next line shadows it with a stub `let variant_id_to_fields = |_: VariantId| vec![];` that always returns an empty Vec. For non-PhantomData ADTs the function then only visits the ADT's own generic arguments, so a reference hidden in a struct/enum/union field that is not exposed via a generic param (e.g. `struct S { r: &i32 }`) is never detected. The comment at line 5577 (\"we check variants/fields as well as generic parameters\") is now false. Git history shows the pre-migration code did iterate fields, so this is an accidental leftover stub from the next-solver migration.","fix":"Delete the stub at line 5600 and rename `_variant_id_to_fields` to `variant_id_to_fields` so the real field-collecting closure is used, restoring recursion into ADT field types.","locations":[{"ref":"crates/hir/src/lib.rs:4713-4752","code":" 4713 |                         let _variant_id_to_fields = |id: VariantId| {\n 4714 |                             let variant_data = &id.fields(self.interner.db());\n 4715 |                             if variant_data.fields().is_empty() {\n 4716 |                                 vec![]\n 4717 |                             } else {\n 4718 |                                 let field_types = self.interner.db().field_types(id);\n 4719 |                                 variant_data\n 4720 |                                     .fields()\n 4721 |                                     .iter()\n 4722 |                                     .map(|(idx, _)| {\n 4723 |                                         field_types[idx]\n 4724 |                                             .ty()\n 4725 |                                             .instantiate(self.interner, args)\n 4726 |                                             .skip_norm_wip()\n 4727 |                                     })\n 4728 |                                     .filter(|it| !it.references_non_lt_error())\n 4729 |                                     .collect()\n 4730 |                             }\n 4731 |                         };\n 4732 |                         let variant_id_to_fields = |_: VariantId| vec![];\n 4733 | \n 4734 |                         let variants: Vec<Vec<Ty<'db>>> = match adt_def.def_id() {\n 4735 |                             AdtId::StructId(id) => {\n 4736 |                                 vec![variant_id_to_fields(id.into())]\n 4737 |                             }\n 4738 |                             AdtId::EnumId(id) => id\n 4739 |                                 .enum_variants(self.interner.db())\n 4740 |                                 .variants\n 4741 |                                 .values()\n 4742 |                                 .map(|&(variant_id, _)| variant_id_to_fields(variant_id.into()))\n 4743 |                                 .collect(),\n 4744 |                             AdtId::UnionId(id) => {\n 4745 |                                 vec![variant_id_to_fields(id.into())]\n 4746 |                             }\n 4747 |                         };\n 4748 | \n 4749 |                         variants\n 4750 |                             .into_iter()\n 4751 |                             .flat_map(|variant| variant.into_iter())\n 4752 |                             .try_for_each(|ty| ty.visit_with(self))?;","lines":40,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir/src/lib.rs#L4713-L4752"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In syntax_node_to_json (in-string syntax tree view), inner_end is computed from text_range().start() instead of .end(). This was a regression: it was .end() originally and changed to .start() in commit 027363fef1 (a CRLF line-ending fix). Result: inner_end == inner_start, so true_end always equals true_start and every in-string node/token gets a zero-width range. It also corrupts the marker-adjustment loop (the `*pos >= inner_end` break and the start/end comparisons all use the node start). Snapshot tests bake in the broken output so they do not catch it.","fix":"Change line 43 to `let inner_end: u32 = it.text_range().end().into();` and regenerate snapshots with UPDATE_EXPECT=1.","locations":[{"ref":"crates/ide/src/view_syntax_tree.rs:43","code":"   43 |                         let inner_end: u32 = it.text_range().start().into();","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide/src/view_syntax_tree.rs#L43"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`ProcMacroServerPool::exited()` is meant to report whether the pool is in a failed state (used to raise a health warning). The loop `for worker in &*self.workers { worker.exited()?; }` applies `?` to an `Option<&ServerError>`: it short-circuits and returns `None` (\"healthy\") as soon as it finds the first worker that has NOT exited, and only reaches `self.workers[0].exited()` when every single worker has exited. So a partial pool failure (some workers crashed) is never reported, and each worker's actual error is discarded in favor of `workers[0]`'s. This is almost certainly an inverted/misused `?` (intended to find the first worker that HAS exited).","fix":"Replace the body with `self.workers.iter().find_map(|w| w.exited())` to report the first exited worker, matching the caller's \"any worker exited\" health-warning intent.","locations":[{"ref":"crates/proc-macro-api/src/pool.rs:22-27","code":"   22 |     pub(crate) fn exited(&self) -> Option<&ServerError> {\n   23 |         for worker in &*self.workers {\n   24 |             worker.exited()?;\n   25 |         }\n   26 |         self.workers[0].exited()\n   27 |     }","lines":6,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/proc-macro-api/src/pool.rs#L22-L27"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`ProcMacroServerProcess::expand` increments `self.active` with `fetch_add` and decrements with `fetch_sub` after the protocol round-trip. The serialization/deserialization between those two calls can panic (FlatTree `panic!(\"bad kind\")`, `unwrap()`s, OOB indexing in flat.rs). On a panic, `fetch_sub` is skipped, permanently inflating `active` for that otherwise-healthy worker. Since `pick_process` selects the worker with the lowest `active` count and fast-paths `active == 0`, the affected worker becomes increasingly avoided forever, degrading the pool. Salsa's higher-level `catch_unwind` swallows the panic, so the worker is never torn down/reset.","fix":"Use an RAII guard that decrements `active` in its `Drop`, so the counter is restored on both the normal and unwinding paths.","locations":[{"ref":"crates/proc-macro-api/src/process.rs:286-314","code":"  286 |         self.active.fetch_add(1, Ordering::AcqRel);\n  287 |         let result = match self.protocol {\n  288 |             Protocol::LegacyJson { .. } => legacy_protocol::expand(\n  289 |                 proc_macro,\n  290 |                 self,\n  291 |                 subtree,\n  292 |                 attr,\n  293 |                 env,\n  294 |                 def_site,\n  295 |                 call_site,\n  296 |                 mixed_site,\n  297 |                 current_dir,\n  298 |             ),\n  299 |             Protocol::BidirectionalPostcardPrototype { .. } => bidirectional_protocol::expand(\n  300 |                 proc_macro,\n  301 |                 self,\n  302 |                 subtree,\n  303 |                 attr,\n  304 |                 env,\n  305 |                 def_site,\n  306 |                 call_site,\n  307 |                 mixed_site,\n  308 |                 current_dir,\n  309 |                 callback.expect(\"callback required for bidirectional protocol\"),\n  310 |             ),\n  311 |         };\n  312 | \n  313 |         self.active.fetch_sub(1, Ordering::AcqRel);\n  314 |         result","lines":29,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/proc-macro-api/src/process.rs#L286-L314"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Slice-pattern suffix elements are matched in swapped positions for suffixes of length >= 2. The lowering projects suffix element i with `ConstantIndex { offset: i, from_end: true }`. The interpreter resolves from_end offsets as `len - offset - 1` (eval.rs:801). So for `[.., a, b]` (suffix [a, b]): a (i=0) reads slot len-1 and b (i=1) reads slot len-2, i.e. the bindings are swapped. rustc's convention is offset = suffix.len() - i, resolved as len - offset, mapping suffix element i to absolute index len - suffix.len() + i. Length-1 suffixes happen to be correct, which likely hid the bug.","fix":"Store `offset: (suffix.len() - i) as u64` for suffix elements and resolve from_end as `len - offset` (matching rustc), so suffix element i maps to absolute index len - suffix.len() + i.","locations":[{"ref":"crates/hir-ty/src/mir/lower/pattern_matching.rs:352-356","code":"  352 |                 for (i, &pat) in suffix.iter().enumerate() {\n  353 |                     let next_place = cond_place.project(ProjectionElem::ConstantIndex {\n  354 |                         offset: i as u64,\n  355 |                         from_end: true,\n  356 |                     });","lines":5,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-ty/src/mir/lower/pattern_matching.rs#L352-L356"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"add_explicit_enum_discriminant formats negative discriminants incorrectly for non-decimal radixes. `variant_def.eval()` returns an i128; for Binary/Octal/Hexadecimal radix the value is formatted with `format!(\"{discriminant:b}\")`/`{:o}`/`{:x}`, which for negative values emits the full 128-bit two's-complement pattern (e.g. `0xffffffff...80`) rather than `-0x...`. A negative inferred discriminant following a hex/octal/binary literal (e.g. `#[repr(i8)] enum E { A = 0x7f, B }` where B wraps to -128) produces garbage that does not compile. Only the Decimal arm (using `to_string()`) handles the sign correctly.","fix":"For the non-decimal arms, format the magnitude of the absolute value and re-prepend a `-` sign when discriminant < 0, e.g. split into `(sign, mag) = if discriminant < 0 { (\"-\", discriminant.unsigned_abs()) } else { (\"\", discriminant as u128) }` and build `format!(\" = {sign}{prefix}{pretty_num}\")`. The Decimal arm already includes the sign via to_string().","locations":[{"ref":"crates/ide-assists/src/handlers/add_explicit_enum_discriminant.rs:91-98","code":"   91 |     let (group_size, prefix, text) = match radix {\n   92 |         Radix::Binary => (4, \"0b\", format!(\"{discriminant:b}\")),\n   93 |         Radix::Octal => (3, \"0o\", format!(\"{discriminant:o}\")),\n   94 |         Radix::Decimal => (6, \"\", discriminant.to_string()),\n   95 |         Radix::Hexadecimal => (4, \"0x\", format!(\"{discriminant:x}\")),\n   96 |     };\n   97 |     let pretty_num = add_group_separators(&text, group_size);\n   98 |     builder.insert(variant_range.end(), format!(\" = {prefix}{pretty_num}\"));","lines":8,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide-assists/src/handlers/add_explicit_enum_discriminant.rs#L91-L98"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"generate_enum_is_method always emits a hardcoded `#[must_use]` attribute on the generated `is_*` method, ignoring the `ctx.config.assist_emit_must_use` setting (default false). Its sibling assists in generate_enum_projection_method.rs (`as_`/`try_into_`) correctly gate the attribute behind the config. This is both an inconsistency between assists and a violation of the user-facing `rust-analyzer.assist.emitMustUse` config.","fix":"Thread `must_use` through `build_fn_item` like generate_enum_projection_method.rs does: compute `let must_use = if ctx.config.assist_emit_must_use { \"#[must_use]\\n\" } else { \"\" };` and substitute it into the fn_text format string instead of the hardcoded `#[must_use]\\n` line. Update the snapshot tests accordingly.","locations":[{"ref":"crates/ide-assists/src/handlers/generate_enum_is_method.rs:113","code":"  113 | #[must_use]","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide-assists/src/handlers/generate_enum_is_method.rs#L113"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `get_default_constructor`, the `Option` short-circuit `core_option_Option()?` runs before the unrelated `Default` branch. If the crate's core/minicore cannot resolve `Option` (e.g. a `#![no_core]` crate or a workspace where `Option` is unavailable), the `?` makes the whole function return `None`, so even field types that genuinely implement `Default` get no `<Ty>::default()` fill. The Option `?` was only meant to short-circuit the Option comparison, not the entire function.","fix":"Make the Option comparison non-fatal: `} else if famous_defs.core_option_Option().is_some_and(|opt| ty.as_adt() == opt.ty(ctx.sema.db).as_adt()) {` so execution falls through to the existing Default branch (which uses its own `core_default_Default()?`).","locations":[{"ref":"crates/ide-diagnostics/src/handlers/missing_fields.rs:264-269","code":"  264 |     } else if ty.as_adt() == famous_defs.core_option_Option()?.ty(ctx.sema.db).as_adt() {\n  265 |         Some(make::ext::option_none())\n  266 |     } else if !ty.is_array()\n  267 |         && ty.impls_trait(ctx.sema.db, famous_defs.core_default_Default()?, &[])\n  268 |     {\n  269 |         Some(make::ext::expr_ty_default(&make_ty(ty, ctx.sema.db, module, ctx.edition)))","lines":6,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide-diagnostics/src/handlers/missing_fields.rs#L264-L269"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`unresolved_field` emits `DiagnosticCode::RustcHardError(\"E0559\")`, but E0559 is rustc's code for an unknown field on an enum variant (correctly used in no_such_field.rs:22). The correct code for `no field X on type Y` (field access on a struct/primitive) is E0609. This mislabels the diagnostic and makes code-based filtering / `#[allow]` reference the wrong error code.","fix":"Change `RustcHardError(\"E0559\")` to `RustcHardError(\"E0609\")`.","locations":[{"ref":"crates/ide-diagnostics/src/handlers/unresolved_field.rs:33-34","code":"   33 |     Diagnostic::new(\n   34 |         DiagnosticCode::RustcHardError(\"E0559\"),","lines":2,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide-diagnostics/src/handlers/unresolved_field.rs#L33-L34"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"The has_newline guard in on_eq_typed is intended to bail out of `;` insertion when there is a newline right after the typed `=`. It is doubly broken: (1) the iterator starts at `offset`, which points at the `=` itself, so text.char_at(offset) is Some('=') and find(|&c| !c.is_whitespace() || c == '\\n') returns Some('=') on the very first element - it never scans past the `=`; (2) the result is compared to Some('n') (ASCII letter n) instead of Some('\\n'). Net effect: has_newline is always false and the guard is dead. The intended behavior is currently only achieved incidentally by downstream per-path newline checks (let_stmt, assign_expr use slice(...).contains_char('\\n')). Fragile and does not do what its comment claims.","fix":"Start scanning after the `=` and compare to the newline char: start at `offset + TextSize::of('=')` and compare `== Some('\\n')`.","locations":[{"ref":"crates/ide/src/typing.rs:221-228","code":"  221 |     let has_newline = iter::successors(Some(offset), |&offset| Some(offset + TextSize::new(1)))\n  222 |         .filter_map(|offset| text.char_at(offset))\n  223 |         .find(|&c| !c.is_whitespace() || c == '\\n')\n  224 |         == Some('n');\n  225 |     // don't attempt to add `;` if there is a newline after the `=`, the intent is likely to write\n  226 |     // out the expression afterwards!\n  227 |     if has_newline {\n  228 |         return None;","lines":8,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide/src/typing.rs#L221-L228"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"The generated JSON schema for `assist.expressionFillDefault` lists only `[\"todo\", \"default\"]` with two enumDescriptions, but ExprFillDefaultDef has three variants (Todo, Default, Underscore) and the code fully handles Underscore. The schema is published to the VS Code extension and used for client-side validation, so setting `assist.expressionFillDefault: \"underscore\"` produces an editor validation error even though rust-analyzer accepts and honors it.","fix":"Add `\"underscore\"` to the enum and a third enumDescriptions entry (e.g. \"Fill missing expressions with `_`\").","locations":[{"ref":"crates/rust-analyzer/src/config.rs:3822-3829","code":" 3822 |         \"ExprFillDefaultDef\" => set! {\n 3823 |             \"type\": \"string\",\n 3824 |             \"enum\": [\"todo\", \"default\"],\n 3825 |             \"enumDescriptions\": [\n 3826 |                 \"Fill missing expressions with the `todo` macro\",\n 3827 |                 \"Fill missing expressions with reasonable defaults, `new` or `default` constructors.\"\n 3828 |             ],\n 3829 |         },","lines":8,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/rust-analyzer/src/config.rs#L3822-L3829"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Escape-error diagnostics for byte-string and C-string literals are positioned one byte too early. `validate_literal` calls `unquote(text, 2, '\"')` for `ByteString`/`CString` (prefix `b\"` / `c\"` is 2 bytes), but then reports the error with `push_err(1, range.start, err)`, i.e. a `prefix_len` of 1. `push_err` computes the absolute offset as `token.text_range().start() + (off + prefix_len)`, where `off` is relative to the content *after* the 2-byte prefix. Using `prefix_len = 1` therefore underestimates the offset by one, so the squiggle/diagnostic points one column to the left of the offending escape. The plain `String` case correctly uses 1 (single `\"`), and `Byte` correctly uses 2, confirming the intended convention.","fix":"Pass prefix_len = 2 in the ByteString and CString branches: `push_err(2, range.start, err)` (lines 161 and 172).","locations":[{"ref":"crates/syntax/src/validation.rs:155-175","code":"  155 |         ast::LiteralKind::ByteString(s) => {\n  156 |             if !s.is_raw()\n  157 |                 && let Some(without_quotes) = unquote(text, 2, '\"')\n  158 |             {\n  159 |                 unescape_byte_str(without_quotes, |range, char| {\n  160 |                     if let Err(err) = char {\n  161 |                         push_err(1, range.start, err);\n  162 |                     }\n  163 |                 });\n  164 |             }\n  165 |         }\n  166 |         ast::LiteralKind::CString(s) => {\n  167 |             if !s.is_raw()\n  168 |                 && let Some(without_quotes) = unquote(text, 2, '\"')\n  169 |             {\n  170 |                 unescape_c_str(without_quotes, |range, char| {\n  171 |                     if let Err(err) = char {\n  172 |                         push_err(1, range.start, err);\n  173 |                     }\n  174 |                 });\n  175 |             }","lines":21,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/syntax/src/validation.rs#L155-L175"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"PGO profile-gathering run path is hardcoded to the `release` profile while the build can use `dev-rel`. In `install_server` the gather build uses `--profile={profile}` (profile = \"dev-rel\" when --dev-rel is set), so the instrumented binary is produced under target/{target}/dev-rel/, but `gather_pgo_profile` always runs `target/{target}/release/rust-analyzer analysis-stats ...`. With `cargo xtask install --pgo <crate> --dev-rel` the instrumented binary is not found and training fails.","fix":"Thread the chosen profile into gather_pgo_profile and build the run path from it (target/{target}/{profile}/rust-analyzer), or reject the --pgo + --dev-rel combination.","locations":[{"ref":"xtask/src/pgo.rs:46-52","code":"   46 |     eprintln!(\"Training RA on {label}...\");\n   47 |     cmd!(\n   48 |         sh,\n   49 |         \"target/{target}/release/rust-analyzer analysis-stats -q --run-all-ide-things {train_path}\"\n   50 |     )\n   51 |     .run()\n   52 |     .context(\"cannot generate PGO profiles\")?;","lines":7,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/xtask/src/pgo.rs#L46-L52"},{"ref":"xtask/src/install.rs:149-170","code":"  149 | fn install_server(sh: &Shell, opts: ServerOpt) -> anyhow::Result<()> {\n  150 |     let features = &opts.to_features();\n  151 |     let profile = if opts.dev_rel { \"dev-rel\" } else { \"release\" };\n  152 | \n  153 |     let mut install_cmd = cmd!(\n  154 |         sh,\n  155 |         \"cargo install --path crates/rust-analyzer --profile={profile} --locked --force {features...}\"\n  156 |     );\n  157 | \n  158 |     if let Some(train_crate) = opts.pgo {\n  159 |         let target = detect_target(sh);\n  160 |         let build_cmd = cmd!(\n  161 |             sh,\n  162 |             \"cargo build --manifest-path ./crates/rust-analyzer/Cargo.toml --bin rust-analyzer --target {target} --profile={profile} --locked {features...}\"\n  163 |         );\n  164 | \n  165 |         let profile = crate::pgo::gather_pgo_profile(sh, build_cmd, &target, train_crate)?;\n  166 |         install_cmd = crate::pgo::apply_pgo_to_cmd(install_cmd, &profile);\n  167 |     }\n  168 | \n  169 |     install_cmd.run()?;\n  170 |     Ok(())","lines":22,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/xtask/src/install.rs#L149-L170"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The HIR pretty-printer for tuple patterns drops a trailing rest `..`. `ellipsis` stores the index of `..` within the original field list (including the rest), while `args` excludes the rest. For `(a, b, ..)`, args.len()==2 and ellipsis==Some(2); the loop only iterates i in 0..args.len() (0,1) and checks `*ellipsis == Some(i)`, so i never reaches 2 and `..` is never emitted, producing `(a, b)`. Same defect in Pat::TupleStruct. Debug/HIR-output only, not name resolution or inference.","fix":"After the args loop, emit a trailing rest when `*ellipsis == Some(args.len() as u32)`, e.g. print `, ..` (or `..` when args is empty) before the closing paren.","locations":[{"ref":"crates/hir-def/src/expr_store/pretty.rs:905-916","code":"  905 |             Pat::Tuple { args, ellipsis } => {\n  906 |                 w!(self, \"(\");\n  907 |                 for (i, pat) in args.iter().enumerate() {\n  908 |                     if i != 0 {\n  909 |                         w!(self, \", \");\n  910 |                     }\n  911 |                     if *ellipsis == Some(i as u32) {\n  912 |                         w!(self, \".., \");\n  913 |                     }\n  914 |                     self.print_pat(*pat);\n  915 |                 }\n  916 |                 w!(self, \")\");","lines":12,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-def/src/expr_store/pretty.rs#L905-L916"},{"ref":"crates/hir-def/src/expr_store/pretty.rs:1006-1018","code":" 1006 |             Pat::TupleStruct { path, args, ellipsis } => {\n 1007 |                 self.print_path(path);\n 1008 |                 w!(self, \"(\");\n 1009 |                 for (i, arg) in args.iter().enumerate() {\n 1010 |                     if i != 0 {\n 1011 |                         w!(self, \", \");\n 1012 |                     }\n 1013 |                     if *ellipsis == Some(i as u32) {\n 1014 |                         w!(self, \", ..\");\n 1015 |                     }\n 1016 |                     self.print_pat(*arg);\n 1017 |                 }\n 1018 |                 w!(self, \")\");","lines":13,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-def/src/expr_store/pretty.rs#L1006-L1018"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`compile_error_expand` matches both `Str` and `StrRaw(_)` literals and then unconditionally calls `unescape_str(lit.text())`. For raw string literals the content must be used verbatim, but `unescape_str` interprets backslash escapes, so `compile_error!(r\"a\\nb\")` yields a mangled diagnostic message. `parse_string` in the same file deliberately does NOT unescape `StrRaw` (lines 802-806), so the two are inconsistent.","fix":"Mirror `parse_string`: only unescape for `LitKind::Str`, and use `lit.text()` directly for `LitKind::StrRaw(_)`.","locations":[{"ref":"crates/hir-expand/src/builtin/fn_macro.rs:531-535","code":"  531 |                 tt::TtElement::Leaf(tt::Leaf::Literal(\n  532 |                     lit @ tt::Literal { kind: tt::LitKind::Str | tt::LitKind::StrRaw(_), .. },\n  533 |                 )),\n  534 |             ],\n  535 |         ) => ExpandError::other(span, Box::from(unescape_str(lit.text()))),","lines":5,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-expand/src/builtin/fn_macro.rs#L531-L535"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"The `ToTokenTree` impl for `i32` interns the integer literal via `sym::Integer::get(self as _)`, casting the `i32` to `usize`. For a negative value this wraps to a huge unsigned number, so quoting `-5i32` produces the literal text for `18446744073709551611` rather than `-5`. `Integer::get` does not panic (it falls back to `create`), but the emitted token is wrong. No current caller quotes a negative `i32`, so it is latent.","fix":"Handle the sign explicitly, e.g. emit a `-` punct followed by `Integer::get(self.unsigned_abs() as usize)`, or build the literal text from `self.to_string()`.","locations":[{"ref":"crates/hir-expand/src/builtin/quote.rs:204","code":"  204 |     span: i32 => self { crate::tt::Literal{text_and_suffix: sym::Integer::get(self as _), span, kind: tt::LitKind::Integer, suffix_len: 0 } };","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-expand/src/builtin/quote.rs#L204"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"lower_pattern_type only handles Pat::Range { start: Some, end: Some, .. }. A half-open range pattern type (start Some/end None or vice versa) falls into the `_ => { never!(\"pattern type can only be Range, NotNull or Or\"); None }` arm and is reported via never! as if it were an impossible kind, even though a half-open Range is a legitimate variant shape. This fires a spurious never! (test/log noise) and silently drops the pattern.","fix":"Handle Range with any combination of start/end (open ends are valid for pattern types), or return None without the never! if intentionally unsupported.","locations":[{"ref":"crates/hir-ty/src/lower.rs:729-750","code":"  729 |     fn lower_pattern_type(&mut self, pat: PatId, ty: Ty<'db>) -> Option<Pattern<'db>> {\n  730 |         let pat_kind = match self.store[pat] {\n  731 |             hir_def::hir::Pat::Range { start: Some(start), end: Some(end), range_type: _ } => {\n  732 |                 rustc_type_ir::PatternKind::Range {\n  733 |                     start: self.lower_expr_as_const(start, ty),\n  734 |                     end: self.lower_expr_as_const(end, ty),\n  735 |                 }\n  736 |             }\n  737 |             hir_def::hir::Pat::NotNull => rustc_type_ir::PatternKind::NotNull,\n  738 |             hir_def::hir::Pat::Or(ref pats) => rustc_type_ir::PatternKind::Or(\n  739 |                 PatList::new_from_iter(\n  740 |                     self.interner,\n  741 |                     pats.iter().map(|&pat| self.lower_pattern_type(pat, ty).ok_or(())),\n  742 |                 )\n  743 |                 .ok()?,\n  744 |             ),\n  745 |             hir_def::hir::Pat::Missing => return None,\n  746 |             _ => {\n  747 |                 never!(\"pattern type can only be Range, NotNull or Or\");\n  748 |                 return None;\n  749 |             }\n  750 |         };","lines":22,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-ty/src/lower.rs#L729-L750"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"transmute/transmute_unchecked do `destination.write_from_interval(self, arg.interval)`, which writes arg.interval.size bytes (the source size) rather than destination.size. If the source and destination interval sizes differ (mismatched layouts, ZST padding, transmute_unchecked between differently sized types) this writes the wrong number of bytes and can overrun the destination.","fix":"Validate that source and destination sizes match, or copy exactly min(src, dst) bytes rather than blindly using the source interval size.","locations":[{"ref":"crates/hir-ty/src/mir/eval/shim.rs:1109-1116","code":" 1109 |             \"transmute\" | \"transmute_unchecked\" => {\n 1110 |                 let [arg] = args else {\n 1111 |                     return Err(MirEvalError::InternalError(\n 1112 |                         \"transmute arg is not provided\".into(),\n 1113 |                     ));\n 1114 |                 };\n 1115 |                 destination.write_from_interval(self, arg.interval)\n 1116 |             }","lines":8,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir-ty/src/mir/eval/shim.rs#L1109-L1116"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `descend_node_at_offset`, the `kmerge_by` comparator does not match the approach it claims to copy. The cited `algo::ancestors_at_offset` (and sibling helpers) compare two *individual nodes* by `text_range().len()`. Here the outer iterator yields *inner iterators* (ancestor chains), and the comparator maps each whole inner iterator to a sequence of lengths and uses `Iterator::lt`, i.e. a lexicographic comparison of the entire ancestor-length sequences rather than the first/smallest node. The comment claiming parity with `ancestors_at_offset` is misleading and the ordering can differ when chains share a prefix.","fix":"Compare only the first node of each inner ancestor iterator (e.g. `iter.clone().next()`), mirroring `algo::ancestors_at_offset`; at minimum fix the comment.","locations":[{"ref":"crates/hir/src/semantics.rs:1532-1549","code":" 1532 |     fn descend_node_at_offset(\n 1533 |         &self,\n 1534 |         node: &SyntaxNode,\n 1535 |         offset: TextSize,\n 1536 |     ) -> impl Iterator<Item = impl Iterator<Item = SyntaxNode> + '_> + '_ {\n 1537 |         node.token_at_offset(offset)\n 1538 |             .map(move |token| self.descend_into_macros_exact(token))\n 1539 |             .map(|descendants| {\n 1540 |                 descendants.into_iter().map(move |it| self.token_ancestors_with_macros(it))\n 1541 |             })\n 1542 |             // re-order the tokens from token_at_offset by returning the ancestors with the smaller first nodes first\n 1543 |             // See algo::ancestors_at_offset, which uses the same approach\n 1544 |             .kmerge_by(|left, right| {\n 1545 |                 left.clone()\n 1546 |                     .map(|node| node.text_range().len())\n 1547 |                     .lt(right.clone().map(|node| node.text_range().len()))\n 1548 |             })\n 1549 |     }","lines":18,"link":"https://gith {"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"Off-by-one / inconsistency between storage threshold and read-time collapse in the term-search alternatives cache. `extend_with_threshold` checks `tts.len() > threshold` BEFORE inserting, so a `Few` set can store up to `threshold + 1` elements before collapsing to `Many`, but `find`/`find_autoref` collapse to `Many` when `res.len() > self.many_threshold`. With the default `many_alternatives_threshold = 1`, a type can be stored as `Few` with 2 elements yet `find` reports it as `Many`. The stored and queried representations disagree, and the `new` doc (\"more than that is many\") does not match the pre-insert `> threshold` check.","fix":"Make the bound consistent: change the storage check to `if tts.len() >= threshold`, or align `find`'s collapse condition with the storage rule, then fix the docs.","locations":[{"ref":"crates/hir/src/term_search.rs:60-74","code":"   60 |     fn extend_with_threshold(&mut self, threshold: usize, exprs: impl Iterator<Item = Expr<'db>>) {\n   61 |         match self {\n   62 |             AlternativeExprs::Few(tts) => {\n   63 |                 for it in exprs {\n   64 |                     if tts.len() > threshold {\n   65 |                         *self = AlternativeExprs::Many;\n   66 |                         break;\n   67 |                     }\n   68 | \n   69 |                     tts.insert(it);\n   70 |                 }\n   71 |             }\n   72 |             AlternativeExprs::Many => (),\n   73 |         }\n   74 |     }","lines":15,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/hir/src/term_search.rs#L60-L74"},{"ref":"crates/hir/src/term_search.rs:124-129","code":"  124 |         // Collapse suggestions if there are many\n  125 |         if let Some(res) = &res\n  126 |             && res.len() > self.many_threshold\n  127 |         {\n  128 | {"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"relevance_score discards the computed type-match bonus when module lookup fails. After computing a large `score` for an exact (100000) or unifiable (10000) type match, the `match item_module.zip(current_module)` None arm does `return -(2 * import.import_path.len() as i32)`, throwing away `score`. An import that is a perfect type match but whose module/current module cannot be resolved is then ranked purely by path length, inconsistent with the Some arm which preserves score.","fix":"In the None arm, fold the path-length penalty into the existing score rather than discarding it, e.g. `None => score - 2 * import.import_path.len() as i32,`.","locations":[{"ref":"crates/ide-assists/src/handlers/auto_import.rs:302-313","code":"  302 |     match item_module.zip(current_module) {\n  303 |         // get the distance between the imported path and the current module\n  304 |         // (prefer items that are more local)\n  305 |         Some((item_module, current_module)) => {\n  306 |             score -= module_distance_heuristic(db, current_module, &item_module) as i32;\n  307 |         }\n  308 | \n  309 |         // could not find relevant modules, so just use the length of the path as an estimate\n  310 |         None => return -(2 * import.import_path.len() as i32),\n  311 |     }\n  312 | \n  313 |     score","lines":12,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide-assists/src/handlers/auto_import.rs#L302-L313"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In convert_to_guarded_return, the check `then_block.syntax().first_child_or_token().map(|t| t.kind() == T!['{'])?;` intends to bail out when the then-block does not start with `{`, but `?` on `Option<bool>` only short-circuits on `None` (no children at all). When the first token is not `{` it yields `Some(false)` and passes through. The immediately following sibling check on the closing brace correctly uses `.filter(|t| t.kind() == T!['}'])?`, confirming the intent. The opening-brace check is dead/misleading.","fix":"Replace `.map(|t| t.kind() == T!['{'])?;` with `.filter(|t| t.kind() == T!['{'])?;` so it actually rejects blocks not starting with `{`, matching the sibling check on line 113.","locations":[{"ref":"crates/ide-assists/src/handlers/convert_to_guarded_return.rs:111","code":"  111 |     then_block.syntax().first_child_or_token().map(|t| t.kind() == T!['{'])?;","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide-assists/src/handlers/convert_to_guarded_return.rs#L111"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"where_clause_sized scans all where-predicates for a `Sized` bound but never checks the bounded type is `Self`. A trait like `trait Foo<T> where T: Sized` causes `has_sized` to become true, so the generated blanket impl omits the `?Sized` relaxation for the implementing type, needlessly narrowing the impl. The supertrait-bound path (find_bound over the trait's own type_bound_list) is correctly Self-scoped, but the where-clause path is not.","fix":"Filter predicates to those whose bounded type is `Self` (a path type with a single `Self` segment) before checking for the Sized bound, mirroring the `is_self` check used elsewhere in the file.","locations":[{"ref":"crates/ide-assists/src/handlers/generate_blanket_trait_impl.rs:215-220","code":"  215 | fn where_clause_sized(where_clause: Option<ast::WhereClause>) -> Option<bool> {\n  216 |     where_clause?.predicates().find_map(|pred| {\n  217 |         find_bound(\"Sized\", pred.type_bound_list())\n  218 |             .map(|bound| bound.question_mark_token().is_none())\n  219 |     })\n  220 | }","lines":6,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide-assists/src/handlers/generate_blanket_trait_impl.rs#L215-L220"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"merge_match_arms::are_same_types performs an asymmetric binding/type comparison. It iterates only over the subsequent arm's bindings (`arm_types`) and checks each exists with a matching type in the current arm (`current_arm_types`); it never checks bindings present in the current arm but absent from the subsequent arm. A current arm that binds a variable merged with a subsequent arm that binds nothing passes the type check vacuously. Latent (usually masked by the shared body failing to compile), but an incorrect-merge offer is possible with a reversed arm order.","fix":"Compare the two binding maps symmetrically (same key sets and matching types in both directions), or require `arm_types.len() == current_arm_types.len()` in addition to the existing per-key check.","locations":[{"ref":"crates/ide-assists/src/handlers/merge_match_arms.rs:107-122","code":"  107 | fn are_same_types(\n  108 |     current_arm_types: &FxHashMap<String, Option<Type<'_>>>,\n  109 |     arm: &ast::MatchArm,\n  110 |     ctx: &AssistContext<'_, '_>,\n  111 | ) -> bool {\n  112 |     let arm_types = get_arm_types(ctx, arm);\n  113 |     for (other_arm_type_name, other_arm_type) in arm_types {\n  114 |         match (current_arm_types.get(&other_arm_type_name), other_arm_type) {\n  115 |             (Some(Some(current_arm_type)), Some(other_arm_type))\n  116 |                 if other_arm_type == *current_arm_type => {}\n  117 |             _ => return false,\n  118 |         }\n  119 |     }\n  120 | \n  121 |     true\n  122 | }","lines":16,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide-assists/src/handlers/merge_match_arms.rs#L107-L122"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"into_closure (replace eager method with lazy, e.g. `and` -> `and_then`) takes a shortcut for zero-argument call arguments: `if let CallExpr(call) ... if args.count() == 0 { Some(call.expr()) }`, returning the bare callee and ignoring the `add_param` flag. For `and` -> `and_then`, `add_param` is true because `and_then` passes an argument to its callback. So `foo.and(make_default())` where `make_default: fn() -> Option<T>` becomes `foo.and_then(make_default)`, but and_then invokes the callback with one argument while make_default takes zero -> the result does not type-check. The shortcut is only sound when the new closure takes no parameter.","fix":"Only take the zero-arg-call shortcut when `!add_param`; otherwise fall through to building `make.expr_closure(pats, param.clone())`.","locations":[{"ref":"crates/ide-assists/src/handlers/replace_method_eager_lazy.rs:106-118","code":"  106 | fn into_closure(param: &Expr, add_param: bool, make: &SyntaxFactory) -> Expr {\n  107 |     (|| {\n  108 |         if let ast::Expr::CallExpr(call) = param {\n  109 |             if call.arg_list()?.args().count() == 0 { Some(call.expr()?) } else { None }\n  110 |         } else {\n  111 |             None\n  112 |         }\n  113 |     })()\n  114 |     .unwrap_or_else(|| {\n  115 |         let pats = add_param.then(|| make.untyped_param(make.wildcard_pat().into()));\n  116 |         make.expr_closure(pats, param.clone()).into()\n  117 |     })\n  118 | }","lines":13,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide-assists/src/handlers/replace_method_eager_lazy.rs#L106-L118"}]},
{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"Inherent-method dedup in `complete_methods`/`on_inherent_method` emits methods eagerly and cannot retract them. On a vacant entry the first same-named inherent method is always completed and stored; when a later same-named method arrives and the stored one is not visible (`No`/`Editable`), the later one is also completed - but the first was already emitted, so both can be shown. Methods are visited shadowing-closest-first so this is usually benign, but the not-visible branch can produce duplicate completions, contrary to the intent of showing only the most-derived method.","fix":"Buffer inherent methods by name and emit only the chosen one after iteration, or rely solely on first-seen and drop the visibility re-check.","locations":[{"ref":"crates/ide-completion/src/completions/dot.rs:256-273","code":"  256 |         fn on_inherent_method(&mut self, func: hir::Function) -> ControlFlow<()> {\n  257 |             if func.self_param(self.ctx.db).is_some() && self.seen_methods.insert(func) {\n  258 |                 let same_name = self.seen_inherent_methods.entry(func.name(self.ctx.db));\n  259 |                 let do_complete = match &same_name {\n  260 |                     hash_map::Entry::Vacant(_) => true,\n  261 |                     hash_map::Entry::Occupied(same_func) => {\n  262 |                         match self.ctx.is_visible(same_func.get()) {\n  263 |                             crate::context::Visible::Yes => false,\n  264 |                             crate::context::Visible::Editable => true,\n  265 |                             crate::context::Visible::No => true,\n  266 |                         }\n  267 |                     }\n  268 |                 };\n  269 |                 if do_complete {\n  270 |                     same_name.insert_entry(func);\n  271 |                     (self.f)(func);\n  272 |                 }\n  273 |             }","lines":18,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide-completion/src/completions/dot.rs#L256-L273"}]},
{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"Missing-variant detection for the 'fill match arms' completion uses a fragile substring match: `pat.syntax().to_string().contains(variant_name.as_str())`. A variant named `Foo` is treated as already present if any arm's pattern text merely contains `Foo` as a substring (e.g. an arm matching `FooBar`, a path `other::Foo`, or a binding named `foo`). This can silently drop genuinely-missing variants from the completion.","fix":"Resolve each arm pattern to its `EnumVariant` via `sema` and compare by variant identity rather than text substring.","locations":[{"ref":"crates/ide-completion/src/context/analysis.rs:1835-1842","code":" 1835 |                                         let variant_already_present = match_arm_list.arms().any(|arm| {\n 1836 |                                             arm.pat().and_then(|pat| {\n 1837 |                                                 let pat_already_present = pat.syntax().to_string().contains(variant_name.as_str());\n 1838 |                                                 pat_already_present.then_some(pat_already_present)\n 1839 |                                             }).is_some()\n 1840 |                                         });\n 1841 | \n 1842 |                                         (!variant_already_present).then_some(*variant)","lines":8,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide-completion/src/context/analysis.rs#L1835-L1842"}]},
{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `State::type_of` for `json_is_not_rust`, a JSON number is typed as `i64` when `is_i64()` is true, otherwise `f64`. JSON integers that exceed `i64::MAX` but fit in `u64` (e.g. `18446744073709551615`) have `is_i64() == false` and are mapped to `f64`, silently losing integer precision in the generated struct types. A `u64` arm is missing.","fix":"Add a `u64` arm: `if it.is_i64() { \"i64\" } else if it.is_u64() { \"u64\" } else { \"f64\" }`.","locations":[{"ref":"crates/ide-diagnostics/src/handlers/json_is_not_rust.rs:86","code":"   86 |             serde_json::Value::Number(it) => make::ty(if it.is_i64() { \"i64\" } else { \"f64\" }),","lines":1,"link":"https://github.com/rust-lang/rust-analyzer/blob/f3120321073d8046795c6824976be8b0ae92c999/crates/ide-diagnostics/src/handlers/json_is_not_rust.rs#L86"}]},
{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`add_variant_to_union` builds `make::name(field_name)` directly with no numeric-field-name guard, whereas the two struct fix paths (`add_field_to_struct_fix` RecordFieldList branch and the unit-struct branch) both guard against a leading-numeric `field_name` before constructing a `make::name`. The `field_fix` entry only filters keywords, not numeric names, so the union path is inconsistent and could attempt to build an invalid numeric field name.","fix":"Add the same leading-numeric guard (matching `field_name.chars().next()` for a digit and returning `None`) in `add_variant_to_union` before calling `make::name(field_name)`, mirroring the struct paths.","locations":[{"ref":"crates/ide-diagnostics/src/handlers/unresolved_field.rs:104-130","code":"  104 | fn add_variant_to_union(\n  105 |     ctx: &DiagnosticsContext<'_, '_>,\n  106 |     adt_union: Union,\n  107 |     field_name: &str,\n  108 |     suggested_type: Type,\n  109 |     error_range: FileRange,\n  110 | ) -> Option<Assist> {\n  111 |     let adt_source = adt_union.source(ctx.sema.db)?;\n  112 |     let adt_syntax = adt_source.syntax();\n  113 |     let field_list = adt_source.value.record_field_list()?;\n  114 |     let range = adt_syntax.original_file_range_rooted(ctx.sema.db);\n  115 |     let field_name = make::name(field_name);\n  116 | \n  117 |     let (offset, record_field) =\n  118 |         record_field_layout(None, field_name, suggested_type, field_list, adt_syntax.value)?;\n  119 | \n  120 |     let mut src_change_builder = SourceChangeBuilder::new(range.file_id.file_id(ctx.sema.db));\n  121 |     src_change_builder.insert(offset, record_field);\n  122 |     Some(Assist {\n  123 |         id: AssistId::quick_fix(\"add-variant-to-union\"),\n  124 |         label: Label::new(\"Add field to union\".to_owned()),\n  125 |         group: None,\n  126 |         target: error_range.ran
