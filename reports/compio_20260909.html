<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"JoinHandle::poll calls expect(\"Cannot poll after completion\") on self.task. The task field is set to None once the future resolves (line 137). If the caller polls the JoinHandle again after it returned Poll::Ready, or if two references to the same JoinHandle are polled concurrently through unsafe code, this panics instead of returning an error or a no-op.","fix":"Return Poll::Pending or a JoinError::Cancelled immediately when self.task is None instead of panicking. Replace the expect with: if self.task.is_none() { return Poll::Ready(Err(JoinError::Cancelled)); }.","locations":[{"ref":"compio-executor/src/join_handle.rs:132","code":"  132 |         let task = self.task.as_ref().expect(\"Cannot poll after completion\");","lines":1,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-executor/src/join_handle.rs#L132"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"TaskQueue::take calls expect(\"Task has already been taken\") on the inner Option. This happens in Executor::tick when a task is taken for running. If a task is somehow taken twice (e.g. due to a bug in the hot-iteration logic), this panics instead of propagating a graceful error. In particular the Iter returned by iter_hot() can yield the same id if make_hot is called re-entrantly, because the iterator holds a snapshot of curr but queue state mutates under it.","fix":"Return None (or an error) instead of panicking. Change the inner Option access to: inner.map.get_mut(key).and_then(|item| item.task.take()).","locations":[{"ref":"compio-executor/src/queue.rs:119","code":"  119 |                     .map(|item| item.task.take().expect(\"Task has already been taken\"))","lines":1,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-executor/src/queue.rs#L119"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"WakerArrayRef::wake is marked `unsafe fn` but its body calls `unreachable!()` unconditionally. The RawWakerVTable requires the `wake` function to consume the pointer (decrement refcount), yet here it just panics if ever called. Although the comment says it will only be accessed by reference, the vtable slot is callable from safe code via Waker::wake(), so a user holding a cloned Waker (which allocates a WakerArray) and then calling wake() on the original ref-waker would hit this unreachable - or more subtly, any executor that calls wake() on the ref-waker before cloning would panic.","fix":"Implement wake() the same as wake_by_ref(): cast the pointer back to Self, call wake_impl(), then drop (or do nothing since WakerArrayRef owns no heap). Add a comment clarifying that the vtable is only used while the &Self is alive.","locations":[{"ref":"compio-io/src/compat/waker_array.rs:51-53","code":"   51 |     unsafe fn wake(_: *const ()) {\n   52 |         unreachable!(\"WakerArrayRef will only be accessed with reference\")\n   53 |     }","lines":3,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-io/src/compat/waker_array.rs#L51-L53"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"submit_zerocopy calls .expect() on the first item yielded by SubmitMulti, which panics if the stream is unexpectedly terminated before producing an item. The Zerocopy::poll impl also calls .expect(\"Cannot retrieve buffer\") via stream.try_take() after successfully observing the next item, but the buffer could still fail to be retrieved if the op was already consumed.","fix":"Propagate errors from SubmitMulti instead of panicking. Return BufResult(Err(...), op) or an io::Error instead of unwrapping.","locations":[{"ref":"compio-net/src/socket/mod.rs:766-769","code":"  766 |         .next()\n  767 |         .await\n  768 |         .expect(\"SubmitMulti should yield at least one item\")\n  769 |         .0;","lines":4,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-net/src/socket/mod.rs#L766-L769"},{"ref":"compio-net/src/socket/mod.rs:706-717","code":"  706 |         let stream = this.stream.as_mut().expect(\"stream should be Some\");\n  707 | \n  708 |         let _ = futures_util::ready!(stream.poll_next_unpin(cx));\n  709 | \n  710 |         let stream = this.stream.take().expect(\"stream should be Some\");\n  711 | \n  712 |         Poll::Ready(\n  713 |             stream\n  714 |                 .try_take()\n  715 |                 .map_err(|_| ())\n  716 |                 .expect(\"Cannot retrieve buffer\")\n  717 |                 .into_inner(),","lines":12,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-net/src/socket/mod.rs#L706-L717"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"StartedHandshakeFuture::poll calls self.0.take().expect(\"future polled after completion\"). This is a deliberate sentinel, but the same pattern is repeated in MidHandshake::poll. Because both futures are used directly by user-facing async fns (handshake) that could theoretically be polled after returning Ready (e.g. via a buggy executor or FusedFuture misuse), the panic message gives no context about which stream or which step failed, making debugging hard. More critically, the pattern appears in both native.rs and py_ossl.rs with identical code, so a defect in either is invisible to the other.","fix":"Consider returning Poll::Pending or a descriptive error when polled after completion instead of panicking, or at minimum add the domain/peer address to the panic message.","locations":[{"ref":"compio-tls/src/compat/native.rs:157","code":"  157 |         let inner = self.0.take().expect(\"future polled after completion\");","lines":1,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-tls/src/compat/native.rs#L157"},{"ref":"compio-tls/src/compat/native.rs:221","code":"  221 |         let mut s = mut_self.0.take().expect(\"future polled after completion\");","lines":1,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-tls/src/compat/native.rs#L221"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`VectoredBufIter::as_init` in `compio-buf/src/io_vec_buf.rs` panics with an index-out-of-bounds if `self.filled` exceeds the length of the current initialized slice. `set_len` sets `self.filled` to the caller-provided `len` without validating that it does not exceed `iter_slice().nth(index).len()`. If the driver writes more initialized bytes than the caller expects (or if `set_len` is called incorrectly), the subsequent `&curr[self.filled..]` at line 340 will panic at runtime.","fix":"Add a `debug_assert!(self.filled <= curr.len())` in `as_init` before the slice indexing, or ensure `set_len` clamps `filled` to `buf_capacity` of the current sub-buffer.","locations":[{"ref":"compio-buf/src/io_vec_buf.rs:332-341","code":"  332 | impl<T: IoVectoredBuf> IoBuf for VectoredBufIter<T> {\n  333 |     fn as_init(&self) -> &[u8] {\n  334 |         let curr = self\n  335 |             .buf\n  336 |             .iter_slice()\n  337 |             .nth(self.index)\n  338 |             .expect(\"`index` should not exceed `len`\");\n  339 | \n  340 |         &curr[self.filled..]\n  341 |     }","lines":10,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-buf/src/io_vec_buf.rs#L332-L341"},{"ref":"compio-buf/src/io_vec_buf.rs:344-350","code":"  344 | impl<T: IoVectoredBuf + SetLen> SetLen for VectoredBufIter<T> {\n  345 |     unsafe fn set_len(&mut self, len: usize) {\n  346 |         self.filled = len;\n  347 | \n  348 |         unsafe { self.buf.set_len(self.total_filled + self.filled) };\n  349 |     }\n  350 | }","lines":7,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-buf/src/io_vec_buf.rs#L344-L350"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"BufferPoolRoot::new calls num_of_bufs.next_power_of_two() where num_of_bufs is u16. For any value greater than 32768, next_power_of_two would need to return 65536, which overflows u16. In debug builds Rust panics with 'attempt to add with overflow'. In release builds the overflow wraps (producing 0 or an incorrect value), causing NonZeroU16::new(0).expect(...) in iour::BufControl::new to panic with 'Empty buffers'. The public API ProactorBuilder::buffer_pool_size accepts NonZero<u16> with no documented upper bound, so any value from 32769 to 65535 triggers this.","fix":"Add validation in ProactorBuilder::buffer_pool_size or in BufferPoolRoot::new to reject or cap values above 32768 (or document the maximum). Alternatively, compute next_power_of_two on usize/u32 and then check that the result fits in u16 before truncating.","locations":[{"ref":"compio-driver/src/buffer_pool.rs:142","code":"  142 |         let bufs = (0..num_of_bufs.next_power_of_two())","lines":1,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-driver/src/buffer_pool.rs#L142"},{"ref":"compio-driver/src/sys/buffer_pool/iour.rs:51","code":"   51 |         let len = NonZeroU16::new(bufs.len() as u16).expect(\"Empty buffers\");","lines":1,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-driver/src/sys/buffer_pool/iour.rs#L51"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"Asyncify::into_inner (and AsyncifyFd/AsyncifyFd2) panics with 'the data should not be None' if called before the associated blocking function has been executed. The operate/call_blocking method sets self.data = Some(...), but if the operation is abandoned or into_inner is invoked prematurely, the expect() call at line 35 panics. While this follows the async op contract, the panic message is not descriptive enough to diagnose the failure. More importantly, if a cancelled Asyncify op is collected and into_inner is called on it, it panics at runtime with no safe escape hatch.","fix":"Return an Option<D> from into_inner and let callers decide how to handle the None case, or document clearly that this panics and make it unreachable in production paths.","locations":[{"ref":"compio-driver/src/sys/op/asyncify/mod.rs:34-37","code":"   34 |     fn into_inner(mut self) -> Self::Inner {\n   35 |         self.data.take().expect(\"the data should not be None\")\n   36 |     }\n   37 | }","lines":4,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-driver/src/sys/op/asyncify/mod.rs#L34-L37"},{"ref":"compio-driver/src/sys/op/asyncify/mod.rs:60-63","code":"   60 |     fn into_inner(mut self) -> Self::Inner {\n   61 |         self.data.take().expect(\"the data should not be None\")\n   62 |     }\n   63 | }","lines":4,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-driver/src/sys/op/asyncify/mod.rs#L60-L63"},{"ref":"compio-driver/src/sys/op/asyncify/mod.rs:88-91","code":"   88 |     fn into_inner(mut self) -> Self::Inner {\n   89 |         self.data.take().expect(\"the data should not be None\")\n   90 |     }\n   91 | }","lines":4,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-driver/src/sys/op/asyncify/mod.rs#L88-L91"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"Executor::tick calls expect(\"Task was not reset back\") when taking a task. If the task entry somehow vanishes between iter_hot producing its id and tick calling take() (e.g. if cancel() removes the entry and clear() drains the queue concurrently), the expect panics. Although Executor is nominally single-threaded, a future's destructor could theoretically call executor methods through a thread-local reference.","fix":"Replace the expect with a continue: if take returns None, skip the task rather than panicking, and log a debug warning.","locations":[{"ref":"compio-executor/src/lib.rs:217","code":"  217 |             let task = queue.take(id).expect(\"Task was not reset back\");","lines":1,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-executor/src/lib.rs#L217"}]},
{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"TaskQueue::reset calls expect(\"Invalid key\") and debug_assert!(place.task.is_none()) on the retrieved slot. If the caller passes an invalid or already-removed key, this panics in release builds. This is an internal invariant, so the panic itself is acceptable, but the debug_assert for task.is_none() is a data-race hazard: if reset and take are called from the same single-threaded tick with the same key (possible if a future re-schedules itself synchronously), the assert fires.","fix":"The expect is acceptable for an internal API, but document clearly that this may only be called after take(). Add the invariant comment.","locations":[{"ref":"compio-executor/src/queue.rs:127-129","code":"  127 |                 let place = inner.map.get_mut(key).expect(\"Invalid key\");\n  128 |                 debug_assert!(place.task.is_none(), \"Task was not taken\");\n  129 |                 place.task = Some(task);","lines":3,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-executor/src/queue.rs#L127-L129"}]},
{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"spawn_blocking_with (and spawn_blocking_with2) calls expect(\"result should be present\") on the AsyncifyFd result buffer. If the provided closure panics, the BufResult contains None in the buffer field and Ok(0) in the status, causing the expect to fire. The closure is wrapped in no panic guard.","fix":"Use ok_or_else to return an io::Error instead of panicking, or catch panics in the closure using std::panic::catch_unwind before calling the closure.","locations":[{"ref":"compio-fs/src/lib.rs:104","code":"  104 |     Ok(meta.into_inner().expect(\"result should be present\"))","lines":1,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-fs/src/lib.rs#L104"},{"ref":"compio-fs/src/lib.rs:104","code":"  104 |     Ok(meta.into_inner().expect(\"result should be present\"))","lines":1,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-fs/src/lib.rs#L104"}]},
{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"In compio-fs/src/metadata/windows.rs, From<std::fs::Metadata> for Metadata calls .expect() three times on modified(), accessed(), and created(). The comment claims these should never fail on Windows. The created() call in particular can return an error for files on filesystems that do not track creation time (e.g. FAT32 mounted inside WSL), causing an unexpected panic during metadata conversion.","fix":"Replace the three expects with unwrap_or(SystemTime::UNIX_EPOCH) or propagate the error. The From impl should become TryFrom, or the infallible assumption should be documented more precisely.","locations":[{"ref":"compio-fs/src/metadata/windows.rs:179-186","code":"  179 |                 .modified()\n  180 |                 .expect(\"std::fs::Metadata::modified() should never fail on Windows\"),\n  181 |             accessed: value\n  182 |                 .accessed()\n  183 |                 .expect(\"std::fs::Metadata::accessed() should never fail on Windows\"),\n  184 |             created: value\n  185 |                 .created()\n  186 |                 .expect(\"std::fs::Metadata::created() should never fail on Windows\"),","lines":8,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-fs/src/metadata/windows.rs#L179-L186"}]},
{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"AncillaryBuilder::push calls `expect(\"sufficient space\")` on the result of `current_mut` after already checking `is_space_enough`. However, `current_mut` returns None when `self.inner.offset` is None, which can happen if CMsgIter::new sets offset to None when the buffer has space but the CMSG_FIRSTHDR returned null. The expect would then panic spuriously.","fix":"Return `Err(CodecError::BufferTooSmall)` instead of calling `expect`, or document clearly why `current_mut` can never return None after `is_space_enough` returns true.","locations":[{"ref":"compio-io/src/ancillary/mod.rs:149-150","code":"  149 |         let mut cmsg = unsafe { self.inner.current_mut(self.buffer.buf_mut_ptr().cast()) }\n  150 |             .expect(\"sufficient space\");","lines":2,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-io/src/ancillary/mod.rs#L149-L150"}]},
{"id":"PANIC_14","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"Buffer::reserve panics on OOM. The panic message 'Buffer reserve failed: ...' is printed, but callers (BufReader::fill_buf, framed read.rs) do not expect panics from reserve - they would prefer an IoResult error for the OOM case. The function internally calls try_reserve and only propagates ReserveError::NotSupported silently.","fix":"Change reserve to return IoResult<()> and map the error to io::ErrorKind::OutOfMemory so callers can handle it gracefully, or document clearly that callers must ensure capacity in advance.","locations":[{"ref":"compio-io/src/buffer.rs:163-166","code":"  163 |     pub fn reserve(&mut self, additional: usize) {\n  164 |         if let Err(ReserveError::ReserveFailed(e)) = self.try_reserve(additional) {\n  165 |             panic!(\"Buffer reserve failed: {}\", e)\n  166 |         }","lines":4,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-io/src/buffer.rs#L163-L166"}]},
{"id":"PANIC_15","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"LengthDelimited::enclose calls `buf.reserve(...).expect(\"Reserve failed\")` and `buf.extend_from_slice(self.bytes).expect(\"Failed to append delimiter\")` in AnyDelimited::enclose. These panics on OOM are unrecoverable and happen inside Sink::start_send where an error return would be more appropriate.","fix":"Change the Framer::enclose signature to return io::Result<()> so OOM can be propagated as an error instead of a panic.","locations":[{"ref":"compio-io/src/framed/frame.rs:131","code":"  131 |         buf.reserve(self.length_field_len).expect(\"Reserve failed\");","lines":1,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-io/src/framed/frame.rs#L131"},{"ref":"compio-io/src/framed/frame.rs:237-239","code":"  237 |         buf.extend_from_slice(self.bytes)\n  238 |             .expect(\"Failed to append delimiter\");\n  239 |     }","lines":3,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-io/src/framed/frame.rs#L237-L239"}]},
{"id":"PANIC_16","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"TcpListener::accept, TcpListener::accept_with, TcpStream::peer_addr, TcpStream::local_addr, and TcpSocket::local_addr all call .expect(\"should be SocketAddr\") on addr.as_socket(). If the OS somehow returns a non-IP socket address for a TCP socket this will panic instead of returning an error.","fix":"Use ok_or_else to return an io::Error(InvalidData) instead of panicking.","locations":[{"ref":"compio-net/src/tcp.rs:122-123","code":"  122 |         Ok((stream, addr.as_socket().expect(\"should be SocketAddr\")))\n  123 |     }","lines":2,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-net/src/tcp.rs#L122-L123"},{"ref":"compio-net/src/tcp.rs:131","code":"  131 |         Ok((stream, addr.as_socket().expect(\"should be SocketAddr\")))","lines":1,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-net/src/tcp.rs#L131"},{"ref":"compio-net/src/tcp.rs:305","code":"  305 |             .map(|addr| addr.as_socket().expect(\"should be SocketAddr\"))","lines":1,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-net/src/tcp.rs#L305"},{"ref":"compio-net/src/tcp.rs:312","code":"  312 |             .map(|addr| addr.as_socket().expect(\"should be SocketAddr\"))","lines":1,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-net/src/tcp.rs#L312"},{"ref":"compio-net/src/tcp.rs:165-167","code":"  165 |         self.inner\n  166 |             .local_addr()\n  167 |             .map(|addr| addr.as_socket().expect(\"should be SocketAddr\"))","lines":3,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-net/src/tcp.rs#L165-L167"},{"ref":"compio-net/src/tcp.rs:1052-1057","code":" 1052 |         Ok(self\n 1053 |             .inner\n 1054 |             .local_addr()?\n 1055 |             .as_socket()\n 1056 |             .expect(\"should be SocketAddr\"))\n 1057 |     }","lines":6,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-net/src/tcp.rs#L1052-L1057"}]},
{"id":"PANIC_17","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"UdpSocket::recv_from, recv_from_vectored, recv_msg, recv_msg_vectored, recv_from_managed and recv_msg_managed all call .expect(\"should have addr\") and .expect(\"should be SocketAddr\") on the peer address. If the kernel omits the address (unusual but possible on some platforms with certain flags) this panics.","fix":"Return io::Error(AddrNotAvailable) when the address is absent instead of panicking.","locations":[{"ref":"compio-net/src/udp.rs:253-257","code":"  253 |                 let addr = addr\n  254 |                     .expect(\"should have addr\")\n  255 |                     .as_socket()\n  256 |                     .expect(\"should be SocketAddr\");\n  257 |                 (n, addr)","lines":5,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-net/src/udp.rs#L253-L257"},{"ref":"compio-net/src/udp.rs:269-275","code":"  269 |             .await\n  270 |             .map_res(|(n, addr)| {\n  271 |                 let addr = addr\n  272 |                     .expect(\"should have addr\")\n  273 |                     .as_socket()\n  274 |                     .expect(\"should be SocketAddr\");\n  275 |                 (n, addr)","lines":7,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-net/src/udp.rs#L269-L275"},{"ref":"compio-net/src/udp.rs:293-298","code":"  293 |             Some((buffer, addr)) => {\n  294 |                 let addr = addr\n  295 |                     .expect(\"should have addr\")\n  296 |                     .as_socket()\n  297 |                     .expect(\"should be SocketAddr\");\n  298 |                 Some((buffer, addr))","lines":6,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-net/src/udp.rs#L293-L298"},{"ref":"compio-net/src/udp.rs:322-327","code":"  322 |             .map_res(|(n, m, addr, flags)| {\n  323 |                 let addr = addr\n  324 |                     .expect(\"should have addr\")\n  325 |                     .as_socket()\n  326 |                     .expect(\"should be SocketAddr\");\n  327 |                 (n, m, addr, flags)","lines":6,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-net/src/udp.rs#L322-L327"},{"ref":"compio-net/src/udp.rs:341-347","code":"  341 |             .await\n  342 |             .map_res(|(n, m, addr, flags)| {\n  343 |                 let addr = addr\n  344 |                     .expect(\"should have addr\")\n  345 |                     .as_socket()\n  346 |                     .expect(\"should be SocketAddr\");\n  347 |                 (n, m, addr, flags)","lines":7,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-net/src/udp.rs#L341-L347"},{"ref":"compio-net/src/udp.rs:367-371","code":"  367 |             Some((buffer, control, addr, flags)) => {\n  368 |                 let addr = addr\n  369 |                     .expect(\"should have addr\")\n  370 |                     .as_socket()\n  371 |                     .expect(\"should be SocketAddr\");","lines":5,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-net/src/udp.rs#L367-L371"}]},
{"id":"PANIC_18","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"ClientBuilder::new_with_native_certs calls .expect(\"certs and errors should not be both empty\") after checking that certs is empty, but does not verify that errors is non-empty before unwrapping it via .pop(). If both slices are somehow empty the pop returns None and the expect panics.","fix":"Replace with a fallback error string: errors.pop().unwrap_or_else(|| io::Error::other(\"no native certs and no error\")).","locations":[{"ref":"compio-quic/src/builder.rs:33-36","code":"   33 |                     .errors\n   34 |                     .pop()\n   35 |                     .expect(\"certs and errors should not be both empty\"),\n   36 |             ));","lines":4,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-quic/src/builder.rs#L33-L36"}]},
{"id":"PANIC_19","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"ClientBuilder::build and ServerBuilder::build both call .expect(\"should support TLS13_AES_128_GCM_SHA256\") on QuicClientConfig::try_from and QuicServerConfig::try_from. This can fail if a custom CryptoProvider without that cipher suite is installed, causing a panic in user code paths.","fix":"Return Result<ClientConfig/ServerConfig> from build() and propagate the error.","locations":[{"ref":"compio-quic/src/builder.rs:151","code":"  151 |             QuicClientConfig::try_from(self.0).expect(\"should support TLS13_AES_128_GCM_SHA256\"),","lines":1,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-quic/src/builder.rs#L151"},{"ref":"compio-quic/src/builder.rs:217","code":"  217 |             QuicServerConfig::try_from(self.0).expect(\"should support TLS13_AES_128_GCM_SHA256\"),","lines":1,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-quic/src/builder.rs#L217"}]},
{"id":"PANIC_20","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"Interval::tick (in the non-first-tick branch) computes `now - self.start`. If `now < self.start` this Duration subtraction panics with 'subtraction of Instants panics if the result is before the Unix epoch'. This can occur when the system clock is adjusted backward (e.g. NTP step), or if the Interval was created with a `start` in the future (via interval_at) and tick() is called before `start` has elapsed. On the second and subsequent ticks, `start` remains the original value; a backward clock jump between the first and second tick would trigger this.","fix":"Use `now.saturating_duration_since(self.start)` or `now.checked_duration_since(self.start).unwrap_or_default()` instead of `now - self.start` to avoid panicking on backward clock adjustments.","locations":[{"ref":"compio-runtime/src/time/future.rs:154-161","code":"  154 |             let now = Instant::now();\n  155 |             let next = now + self.period\n  156 |                 - Duration::from_nanos(\n  157 |                     ((now - self.start).as_nanos() % self.period.as_nanos()) as _,\n  158 |                 );\n  159 |             sleep_until(next).await;\n  160 |             next\n  161 |         }","lines":8,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-runtime/src/time/future.rs#L154-L161"}]},
{"id":"PANIC_21","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"In common.rs, AllowStd::with_context asserts !self.context.is_null() with a hard panic. The context pointer is cleared to null by clear_context() and set by set_context(). If the TLS layer calls Read/Write on AllowStd outside of the with_context wrapper in native.rs/py_ossl.rs (e.g. during Drop or from a background thread inside native-tls), this assert will fire as an abort-level panic rather than a recoverable error.","fix":"Return io::Error::new(io::ErrorKind::Other, \"context not set\") instead of asserting, or document clearly that Read/Write must only be called from within the TLS crate's with_context guard.","locations":[{"ref":"compio-tls/src/compat/common.rs:141","code":"  141 |         unsafe {","lines":1,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-tls/src/compat/common.rs#L141"}]},
{"id":"PANIC_22","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"In compio-ws/examples/autobahn-client.rs, get_case_count() calls .parse::<u32>().expect(\"Can't parse case count\") on the server's text response. If the autobahn test server sends a malformed or unexpected response (e.g. a non-numeric string), the process panics rather than returning an error. This is example code, but the pattern may be copied by users.","fix":"Use .parse::<u32>().map_err(|e| tungstenite::Error::Io(io::Error::other(e)))? to propagate the error.","locations":[{"ref":"compio-ws/examples/autobahn-client.rs:17-18","code":"   17 |         .parse::<u32>()\n   18 |         .expect(\"Can't parse case count\"))","lines":2,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-ws/examples/autobahn-client.rs#L17-L18"}]},
{"id":"PANIC_23","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`RuntimeCompat::execute` in `compio-compat/src/lib.rs` panics with `panic!(\"failed to wait for driver\")` on any unexpected I/O error from the adapter's wait method. The caller has no way to handle this error because the function signature returns `F::Output`, not `io::Result<F::Output>`. Any unexpected OS error in the event loop (e.g., `ENOMEM` from `epoll_wait`) causes a hard panic instead of a recoverable error.","fix":"Change `execute` to return `io::Result<F::Output>` so callers can handle driver errors gracefully. Alternatively, expose the error via the future's waker mechanism.","locations":[{"ref":"compio-compat/src/lib.rs:85","code":"   85 |                 Err(e) => panic!(\"failed to wait for driver: {e:?}\"),","lines":1,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-compat/src/lib.rs#L85"}]},
{"id":"PANIC_24","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"compio-macros/src/lib.rs: retrieve_runtime_mod() and retrieve_driver_mod() call panic!() when neither compio-runtime nor compio are present in Cargo.toml. This produces a confusing panic at proc-macro expansion time instead of a proper compile-time error with a span.","fix":"Use proc_macro::Span and emit a compile_error!() or return a syn::Error so the diagnostic points to the call site.","locations":[{"ref":"compio-macros/src/lib.rs:75-77","code":"   75 |             }\n   76 |             Err(_) => panic!(\"Cannot find compio or compio_runtime.\"),\n   77 |         },","lines":3,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-macros/src/lib.rs#L75-L77"},{"ref":"compio-macros/src/lib.rs:68","code":"   68 |             quote!(::#ident)","lines":1,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-macros/src/lib.rs#L68"}]},
{"id":"PANIC_25","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"compio_process::linux::child_wait calls .expect(\"cannot retrieve the child back\") on fd.take().await. If strong references still exist (e.g. due to a bug) the take returns None and this panics.","fix":"Return an io::Error instead of panicking.","locations":[{"ref":"compio-process/src/linux.rs:40","code":"   40 |         let mut fd = fd.take().await.expect(\"cannot retrieve the child back\");","lines":1,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-process/src/linux.rs#L40"}]},
{"id":"PANIC_26","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"ConnectionState::handshake_data calls .unwrap() on the downcast of the crypto handshake data to HandshakeData. A mismatch in the crypto provider would cause a panic.","fix":"Use downcast().ok() and return None or propagate an error.","locations":[{"ref":"compio-quic/src/connection.rs:100-101","code":"  100 |             .handshake_data()\n  101 |             .map(|data| data.downcast::<HandshakeData>().unwrap())","lines":2,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-quic/src/connection.rs#L100-L101"}]},
{"id":"PANIC_27","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"Connection::peer_identity calls .unwrap() on the downcast of the peer identity. A non-rustls crypto session would cause a panic.","fix":"Use downcast().ok() and return None on failure instead of panicking.","locations":[{"ref":"compio-quic/src/connection.rs:346-352","code":"  346 |         ) -> Option<Box<Vec<rustls::pki_types::CertificateDer<'static>>>> {\n  347 |             self.0\n  348 |                 .state()\n  349 |                 .conn\n  350 |                 .crypto_session()\n  351 |                 .peer_identity()\n  352 |                 .map(|v| v.downcast().unwrap())","lines":7,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-quic/src/connection.rs#L346-L352"}]},
{"id":"PANIC_28","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"Connection::handshake_data (the non-async version on Connection) calls .unwrap() on handshake_data(), which returns Option. If it is called before the handshake has completed the unwrap panics. The method signature does not communicate this precondition.","fix":"Return Option<Box<HandshakeData>> or an appropriate error rather than unwrapping.","locations":[{"ref":"compio-quic/src/connection.rs:545-546","code":"  545 |     pub fn handshake_data(&mut self) -> Result<Box<HandshakeData>, ConnectionError> {\n  546 |         Ok(self.0.try_state()?.handshake_data().unwrap())","lines":2,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-quic/src/connection.rs#L545-L546"}]},
{"id":"PANIC_29","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"h3 RecvStream::stop_sending calls `error_code.try_into().expect(\"invalid error_code\")` converting a raw u64 from the h3 crate into a VarInt. VarInt has a maximum value of 2^62 − 1; any error_code >= 2^62 will panic. While the h3 spec limits error codes, this is an external value that arrives over the wire and should be handled gracefully rather than panicking.","fix":"Replace `.expect(\"invalid error_code\")` with `.unwrap_or(VarInt::MAX)` (mirroring the pattern on send_stream.rs line 520) or return an error to the caller.","locations":[{"ref":"compio-quic/src/recv_stream.rs:679","code":"  679 |             self.stop(error_code.try_into().expect(\"invalid error_code\"))","lines":1,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-quic/src/recv_stream.rs#L679"}]},
{"id":"PANIC_30","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"h3 SendStream::send_id and RecvStream::recv_id call `u64::from(stream_id).try_into().unwrap()` to convert a quinn-proto StreamId to an h3 StreamId. Although both are u64-backed, the h3 StreamId has additional validity constraints (must be a QUIC stream ID). If quinn ever returns a StreamId value that does not satisfy h3's invariants (which should not happen in practice but is not statically guaranteed), the unwrap will panic.","fix":"Propagate the TryFrom error via the trait method's error path instead of unwrapping, or add a comment explaining the invariant that makes this infallible.","locations":[{"ref":"compio-quic/src/send_stream.rs:525","code":"  525 |             u64::from(self.inner.stream).try_into().unwrap()","lines":1,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-quic/src/send_stream.rs#L525"},{"ref":"compio-quic/src/recv_stream.rs:684","code":"  684 |             u64::from(self.stream).try_into().unwrap()","lines":1,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-quic/src/recv_stream.rs#L684"}]},
{"id":"PANIC_31","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"Socket::send calls construct_control_message with `.expect(\"CMSG_LEN should be large enough\")`. If the ancillary buffer (128 bytes) ever proves too small for a combination of options (e.g., on a platform that adds padding), the send path panics instead of returning an io::Error. The constant CMSG_LEN = 128 is ample for current uses, but the failure mode is a panic rather than a graceful error.","fix":"Return the CodecError as an io::Error from send instead of using expect, or convert the function to return a Result and propagate the error to the caller.","locations":[{"ref":"compio-quic/src/socket.rs:489-491","code":"  489 |         let mut control = self\n  490 |             .construct_control_message(transmit)\n  491 |             .expect(\"CMSG_LEN should be large enough\");","lines":3,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-quic/src/socket.rs#L489-L491"}]},
{"id":"PANIC_32","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In compio-ws/examples/autobahn-server.rs, accept_async_with_config is called with .expect(\"Failed to accept\"). This panics the spawned task on WebSocket handshake failure (e.g. if a client sends garbage), which silently kills the task and the error is never reported to the server loop.","fix":"Return the error from handle_connection and let accept_connection log it, similar to how other errors are handled in that function.","locations":[{"ref":"compio-ws/examples/autobahn-server.rs:26-28","code":"   26 |     let mut ws_stream = accept_async_with_config(stream, Some(config))\n   27 |         .await\n   28 |         .expect(\"Failed to accept\");","lines":3,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-ws/examples/autobahn-server.rs#L26-L28"}]},
{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"medium","description":"In iocp/cp/mod.rs CompletionPort::poll (the multi-port variant used by the non-global IOCP mode), when reposting an entry to the correct driver port fails, the error is logged but the entry's lpOverlapped is abandoned. That pointer represents an ErasedKey that was previously leaked via into_raw when the op was submitted to the kernel. Since from_optr is never called on it, the ThinCell allocation is permanently leaked, and the corresponding async future will hang forever waiting for a completion that will never arrive.","fix":"On repost failure, reconstruct the ErasedKey from the overlapped pointer via ErasedKey::from_optr, set an error result on it (e.g. ECANCELED), and notify the key so the future can observe the failure.","locations":[{"ref":"compio-driver/src/sys/driver/iocp/cp/mod.rs:161-180","code":"  161 |                 // Repost the entry to correct port.\n  162 |                 if let Err(e) = syscall!(\n  163 |                     BOOL,\n  164 |                     PostQueuedCompletionStatus(\n  165 |                         overlapped.driver as _,\n  166 |                         entry.dwNumberOfBytesTransferred,\n  167 |                         entry.lpCompletionKey,\n  168 |                         entry.lpOverlapped,\n  169 |                     )\n  170 |                 ) {\n  171 |                     error!(\n  172 |                         \"fail to repost entry ({}, {}, {:p}) to driver {:p}: {:?}\",\n  173 |                         entry.dwNumberOfBytesTransferred,\n  174 |                         entry.lpCompletionKey,\n  175 |                         entry.lpOverlapped,\n  176 |                         overlapped.driver,\n  177 |                         e\n  178 |                     );\n  179 |                 }\n  180 |                 return None;","lines":20,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-driver/src/sys/driver/iocp/cp/mod.rs#L161-L180"}]},
{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"medium","description":"In the IOCP wait/packet.rs Wait::new, key.into_optr() is evaluated as an inline argument to NtAssociateWaitCompletionPacket. This leaks the ErasedKey (via ThinCell::leak) before the API call even executes. If NtAssociateWaitCompletionPacket then fails and check_status propagates an error via ?, the key has already been permanently leaked - it will never be reconstructed via from_optr and the ThinCell allocation is never freed. The caller in iocp/mod.rs uses ? on Wait::new, so on failure it returns an error and the key is lost.","fix":"Compute key.into_optr() into a local variable before calling NtAssociateWaitCompletionPacket. If the API call fails, reconstruct the ErasedKey via ErasedKey::from_optr (or an equivalent from_raw path) before returning the error.","locations":[{"ref":"compio-driver/src/sys/driver/iocp/wait/packet.rs:63-74","code":"   63 |         check_status(unsafe {\n   64 |             NtAssociateWaitCompletionPacket(\n   65 |                 handle.as_raw_handle() as _,\n   66 |                 notify.port.as_raw_handle() as _,\n   67 |                 event,\n   68 |                 null_mut(),\n   69 |                 key.into_optr().cast(),\n   70 |                 STATUS_SUCCESS,\n   71 |                 0,\n   72 |                 null_mut(),\n   73 |             )\n   74 |         })?;","lines":12,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-driver/src/sys/driver/iocp/wait/packet.rs#L63-L74"},{"ref":"compio-driver/src/sys/driver/iocp/mod.rs:119-120","code":"  119 |                     .insert(key.as_raw(), wait::Wait::new(self.notify.clone(), e, key)?);\n  120 |                 Poll::Pending","lines":2,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-driver/src/sys/driver/iocp/mod.rs#L119-L120"}]},
{"id":"MEM_3","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"medium","description":"In the IOCP wait/thread_pool.rs Wait::new, key.into_optr() is called when constructing WinThreadpoolWaitContext inside Box::new. If CreateThreadpoolWait fails, the Box is dropped, which frees only the Box allocation. The raw optr pointer inside the struct is just a *mut Overlapped pointing into a leaked ThinCell allocation - the ThinCell is never freed. The ErasedKey passed to Wait::new is thus permanently leaked on any CreateThreadpoolWait failure.","fix":"Store the result of key.into_optr() in a local variable, and on CreateThreadpoolWait failure reconstruct the ErasedKey via ErasedKey::from_optr before returning the error so the ThinCell is properly freed.","locations":[{"ref":"compio-driver/src/sys/driver/iocp/wait/thread_pool.rs:31-43","code":"   31 |         let mut context = Box::new(WinThreadpoolWaitContext {\n   32 |             notify,\n   33 |             optr: key.into_optr(),\n   34 |         });\n   35 |         let wait = syscall!(\n   36 |             BOOL,\n   37 |             CreateThreadpoolWait(\n   38 |                 Some(Self::wait_callback),\n   39 |                 (&mut *context) as *mut WinThreadpoolWaitContext as _,\n   40 |                 null()\n   41 |             )\n   42 |         )?;\n   43 |         unsafe {","lines":13,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-driver/src/sys/driver/iocp/wait/thread_pool.rs#L31-L43"}]},
{"id":"MEM_4","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"`BufferPoolRoot::release` in `compio-driver/src/buffer_pool.rs` documents that if it is not called before drop, all buffer allocations are leaked with no way to recover them (except for those held in live `BufferRef`s). There is no `Drop` implementation that releases the allocations when `BufferPoolRoot` is dropped. If a function returns early with an error before calling `release`, or if the caller simply forgets to call it, the memory is permanently leaked.","fix":"Implement `Drop` for `BufferPoolRoot` that attempts to deallocate any remaining buffers in `inner.bufs`, similar to what `release` does, but without the `ctrl.release` driver call. Alternatively, document more prominently that `release` must be called and consider using a RAII guard pattern.","locations":[{"ref":"compio-driver/src/buffer_pool.rs:161-199","code":"  161 |     /// Release the buffer pool and deallocate all buffers.\n  162 |     ///\n  163 |     /// If the buffer pool root is dropped without calling this function,\n  164 |     /// everything will be leaked and there will be no chance to recover them\n  165 |     /// back, except those have been taken by [`BufferRef`], which will be\n  166 |     /// released when they're dropped.\n  167 |     ///\n  168 |     /// If the control block failed to release, this function will return an io\n  169 |     /// Error without deallocating buffers, and it's possible to retry.\n  170 |     ///\n  171 |     /// # Safety\n  172 |     ///\n  173 |     /// [`BufferPoolRoot`] must not be used after `release` is called and\n  174 |     /// returned successfully. Only thing that's safe to do afterwards is to\n  175 |     /// drop it.\n  176 |     pub(crate) unsafe fn release(&mut self, driver: &mut crate::Driver) -> io::Result<()> {\n  177 |         unsafe {\n  178 |             self.shared.with(|inner| {\n  179 |                 inner.ctrl.release(driver)?;\n  180 |                 for buf in mem::take(&mut inner.bufs).into_iter().flatten() {\n  181 |                     // Control is successfully released, now deallocate buffers\n  182 |                     (inner.alloc.deallocate)(buf, inner.size)\n  183 |                 }\n  184 |                 io::Result::Ok(())\n  185 |             })\n  186 |         }?;\n  187 | \n  188 |         Ok(())\n  189 |     }\n  190 | \n  191 |     pub(crate) fn get_pool(&self) -> BufferPool {\n  192 |         BufferPool {\n  193 |             shared: Rc::downgrade(&self.shared),\n  194 |         }\n  195 |     }\n  196 | \n  197 |     pub(crate) fn is_unique(&self) -> bool {\n  198 |         Rc::strong_count(&self.shared) == 1\n  199 |     }","lines":39,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-driver/src/buffer_pool.rs#L161-L199"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"very_easy","description":"In `compio-compat/src/sys/windows.rs`, the wait timeout is cast from `u128` to `u32` without overflow protection. `Duration::as_millis()` returns `u128`. Casting it to `u32` (line 34) silently truncates any timeout longer than ~49.7 days, turning a large timeout into a small one. For example, a 50-day timeout becomes roughly 1 hour.","fix":"Use `timeout.as_millis().try_into().unwrap_or(u32::MAX)` (or clamp to `u32::MAX`) to correctly saturate at `INFINITE` (which is `0xFFFFFFFF` = `u32::MAX`). Alternatively, compare with `INFINITE as u128` and use `INFINITE` when the duration exceeds it.","locations":[{"ref":"compio-compat/src/sys/windows.rs:33-36","code":"   33 |         let timeout = match timeout {\n   34 |             Some(timeout) => timeout.as_millis() as u32,\n   35 |             None => INFINITE,\n   36 |         };","lines":4,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-compat/src/sys/windows.rs#L33-L36"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"State::inc() aborts the process if the reference count reaches RC_MAX (usize::MAX >> 7). The check fires after the fetch_add, meaning that if RC_MAX tasks hold a reference, the count briefly wraps to RC_MAX+1 before abort is called. On platforms where fetch_add wraps on overflow (all current Rust targets with two's-complement), this is technically an integer overflow UB in a release build without overflow checks. In practice, the task count can never reach 2^57, but the abort check should happen before the overflow.","fix":"Check against RC_MAX - 1 before the fetch_add, or use compare_exchange to only increment when below the limit.","locations":[{"ref":"compio-executor/src/task/state.rs:174-179","code":"  174 |     pub(crate) fn inc(&self) -> Snapshot {\n  175 |         let state = Snapshot(self.0.fetch_add(RC_UNIT, Strong::RELEASE));\n  176 |         trace!(?state, \"inc\");\n  177 |         if state.count() == RC_MAX {\n  178 |             abort()\n  179 |         }","lines":6,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-executor/src/task/state.rs#L174-L179"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"read_to_end in RecvStream casts `(end - start) as usize` where both values are u64 stream offsets. On 32-bit platforms, usize is 32 bits, so any stream larger than 4 GiB silently truncates the length, causing the buffer to be under-allocated and then an incorrect (or out-of-bounds) slice operation. QUIC permits streams up to 2^62 bytes.","fix":"Add an explicit check: `let len: usize = (end - start).try_into().map_err(|_| io::Error::new(io::ErrorKind::OutOfMemory, \"stream too large for platform\"))?;` before the cast. Apply the same guard to the `offset` cast on line 378.","locations":[{"ref":"compio-quic/src/recv_stream.rs:372","code":"  372 |         let len = (end - start) as usize;","lines":1,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-quic/src/recv_stream.rs#L372"},{"ref":"compio-quic/src/recv_stream.rs:383","code":"  383 |             let offset = (offset - start) as usize;","lines":1,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-quic/src/recv_stream.rs#L383"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"`reserve_exact` for `Vec<u8>` (and `bytes::BytesMut`, `smallvec::SmallVec`) incorrectly returns `ReserveExactError::ExactSizeMismatch` whenever the allocator rounds up the allocation beyond the requested size. After calling `Vec::try_reserve_exact(len)`, the resulting spare capacity (`capacity() - len()`) is checked with `!= len`, but allocators are free to return more capacity than requested (e.g., rounding to a size class). Any allocation that rounds up will cause a spurious error even though sufficient capacity exists. The correct check should be `< len`.","fix":"Change the post-reservation check from `!= len` to `< len`. The goal of `reserve_exact` is to ensure at least `len` additional bytes are available, not that exactly `len` were reserved at the OS level. Example fix at line 611: `if self.capacity() - self.len() < len { return Err(...) }`.","locations":[{"ref":"compio-buf/src/io_buf.rs:603-619","code":"  603 |     fn reserve_exact(&mut self, len: usize) -> Result<(), ReserveExactError> {\n  604 |         if self.capacity() - self.len() >= len {\n  605 |             return Ok(());\n  606 |         }\n  607 | \n  608 |         if let Err(e) = Vec::try_reserve_exact(self, len) {\n  609 |             return Err(ReserveExactError::ReserveFailed(Box::new(e)));\n  610 |         }\n  611 | \n  612 |         if self.capacity() - self.len() != len {\n  613 |             return Err(ReserveExactError::ExactSizeMismatch {\n  614 |                 reserved: self.capacity() - self.len(),\n  615 |                 expected: len,\n  616 |             });\n  617 |         }\n  618 |         Ok(())\n  619 |     }","lines":17,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-buf/src/io_buf.rs#L603-L619"},{"ref":"compio-buf/src/io_buf.rs:656-671","code":"  656 |     fn reserve_exact(&mut self, len: usize) -> Result<(), ReserveExactError> {\n  657 |         if self.capacity() - self.len() >= len {\n  658 |             return Ok(());\n  659 |         }\n  660 | \n  661 |         bytes::BytesMut::reserve(self, len);\n  662 | \n  663 |         if self.capacity() - self.len() != len {\n  664 |             Err(ReserveExactError::ExactSizeMismatch {\n  665 |                 reserved: self.capacity() - self.len(),\n  666 |                 expected: len,\n  667 |             })\n  668 |         } else {\n  669 |             Ok(())\n  670 |         }\n  671 |     }","lines":16,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-buf/src/io_buf.rs#L656-L671"},{"ref":"compio-buf/src/io_buf.rs:720-739","code":"  720 |     fn reserve_exact(&mut self, len: usize) -> Result<(), ReserveExactError> {\n  721 |         if self.capacity() - self.len() >= len {\n  722 |             return Ok(());\n  723 |         }\n  724 | \n  725 |         if let Err(e) = smallvec::SmallVec::try_reserve_exact(self, len) {\n  726 |             return Err(ReserveExactError::ReserveFailed(Box::new(\n  727 |                 smallvec_err::SmallVecErr(e),\n  728 |             )));\n  729 |         }\n  730 | \n  731 |         if self.capacity() - self.len() != len {\n  732 |             return Err(ReserveExactError::ExactSizeMismatch {\n  733 |                 reserved: self.capacity() - self.len(),\n  734 |                 expected: len,\n  735 |             });\n  736 |         }\n  737 |         Ok(())\n  738 |     }\n  739 | }","lines":20,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-buf/src/io_buf.rs#L720-L739"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"AwakeFlag::set() uses store(AWAKE) which unconditionally overwrites the NOTIFIED flag. If a waker fires between the last set_awake() call (after poll_entries completes) and the next reset() call (at the start of the following poll()), the waker sees AWAKE set, skips its syscall (eventfd write / PostQueuedCompletionStatus), and the NOTIFIED state is never recorded. When reset() then clears the flag and returns false, the driver considers itself not notified and blocks indefinitely waiting for I/O events that may never arrive. The original implementation in commit 1063a02d used fetch_or(AWAKE) which preserved NOTIFIED; the regression was introduced in commit 37da6da0 (a refactor that changed it to store(AWAKE) and added a comment calling it 'intentional'). This can cause the async runtime to hang under concurrent wakeup patterns.","fix":"Change `self.0.store(AWAKE, Ordering::Release)` back to `self.0.fetch_or(AWAKE, Ordering::AcqRel)` so that any NOTIFIED bit written concurrently by a waker is not silently erased.","locations":[{"ref":"compio-driver/src/sys/driver/mod.rs:62-64","code":"   62 |     pub fn set(&self) {\n   63 |         self.0.store(AWAKE, Ordering::Release);\n   64 |     }","lines":3,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-driver/src/sys/driver/mod.rs#L62-L64"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"Task::cancel calls self.schedule() before setting the cancelled flag. This causes the task to be moved to the hot queue, where it will run one more time before discovering it is cancelled (inside Task::run via header.state.unschedule()). The intent appears to be to wake the task so the executor can clean it up, but if the cancel arrives after the task has already finished (has_result), the result is dropped correctly. However, if cancel is called on a task that is in the cold queue and the executor is shutting down, the task will be promoted to hot and then run (but cancelled), consuming one max_interval slot unnecessarily.","fix":"This is likely intentional (wake-up for cleanup) but should be documented. The comment should clarify why schedule() must precede set_cancelled().","locations":[{"ref":"compio-executor/src/task/mod.rs:244-245","code":"  244 |         self.schedule();\n  245 |         let state = header.state.set_cancelled();","lines":2,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-executor/src/task/mod.rs#L244-L245"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"CMsgRef::decode_data creates a slice from CMSG_DATA pointer with length equal to cmsg_len, but cmsg_len includes the cmsghdr header size (it is CMSG_LEN(data_size), not just data_size). On Linux, cmsghdr.cmsg_len = CMSG_LEN(data_size) = sizeof(cmsghdr) + data_size. Decoding with this oversized length passes a buffer that is header_size bytes too large to T::decode, which then reads extra bytes that are part of the header region of the next control message. The T::SIZE check inside decode will only catch if the inflated length is smaller than T::SIZE, not if it is larger.","fix":"Use CMSG_LEN(0) or equivalent to compute the data offset and limit the slice to `self.len() - CMSG_LEN(0)` bytes, i.e. the actual data payload length: `let data_len = self.len() - CMSG_SPACE(0); let buffer = slice::from_raw_parts(data_ptr, data_len);`","locations":[{"ref":"compio-io/src/ancillary/sys.rs:105-108","code":"  105 |     pub(crate) fn decode_data<T: AncillaryData>(&self) -> Result<T, CodecError> {\n  106 |         let data_ptr = unsafe { CMSG_DATA(self.0) } as *const u8;\n  107 |         let buffer = unsafe { slice::from_raw_parts(data_ptr, self.len()) };\n  108 |         T::decode(buffer)","lines":4,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-io/src/ancillary/sys.rs#L105-L108"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"EndpointState::handle_event calls self.connections.get(&ch).unwrap() after the connection has potentially been removed by is_drained() check (connections.remove(&ch)). If the event is not is_drained but the connection was never inserted, or if handle_event races with removal, this panics. The unwrap on line 106 happens unconditionally after the possible remove on line 100.","fix":"Use if let Some(conn) = self.connections.get(&ch) { ... } instead of .unwrap().","locations":[{"ref":"compio-quic/src/endpoint.rs:98-108","code":"   98 |     fn handle_event(&mut self, ch: ConnectionHandle, event: EndpointEvent) {\n   99 |         if event.is_drained() {\n  100 |             self.connections.remove(&ch);\n  101 |         }\n  102 |         if let Some(event) = self.endpoint.handle_event(ch, event) {\n  103 |             let _ = self\n  104 |                 .connections\n  105 |                 .get(&ch)\n  106 |                 .unwrap()\n  107 |                 .send(ConnectionEvent::Proto(event));\n  108 |         }","lines":11,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-quic/src/endpoint.rs#L98-L108"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In native.rs, after MidHandshake resolves successfully, finish_handshake() is called to flip the handshaken flag, and then stream.flush() is called. However, TlsStream::poll_flush delegates to native_tls::TlsStream::flush which re-enters with_context, which calls AllowStd::flush, which calls OpensslInner::poll_flush. But poll_flush on OpensslInner returns Poll::Ready(Ok(())) immediately when !handshaken. The finish_handshake call sets handshaken=true *before* the flush, so the flush is actually a real flush - but only after a successful handshake. The ordering is: finish_handshake -> flush -> the flushed data goes through the real poll_flush path. This means if finish_handshake were called after flush, the flush would be a no-op and any buffered TLS handshake data would be silently dropped. The current ordering is correct by coincidence; a refactor could easily introduce a bug here.","fix":"Add a comment explaining that finish_handshake must be called before flush, and consider making the ordering explicit with a type-state pattern.","locations":[{"ref":"compio-tls/src/compat/native.rs:134-139","code":"  134 |             let mut stream = MidHandshake(Some(s)).await.map_err(io::Error::other)?;\n  135 |             stream.get_mut().get_mut().finish_handshake();\n  136 |             stream.flush().await?;\n  137 |             Ok(stream)\n  138 |         }\n  139 |     }","lines":6,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-tls/src/compat/native.rs#L134-L139"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`default_set_len` in `compio-buf/src/io_buf.rs` only sets lengths for buffers that receive bytes (up to the cumulative `len`), but does not reset the lengths of subsequent buffers to 0. If a vectored buffer previously had more total filled bytes and `set_len` is called with a smaller value (which the safety contract of `SetLen` allows), buffers beyond the new boundary retain their old initialized lengths. This can lead to stale data being considered initialized.","fix":"After the while loop, iterate over remaining buffers and call `curr.set_len(0)` on each. This ensures buffers beyond the new total length are reset.","locations":[{"ref":"compio-buf/src/io_buf.rs:950-961","code":"  950 | unsafe fn default_set_len<'a, B: IoBufMut>(\n  951 |     iter: impl IntoIterator<Item = &'a mut B>,\n  952 |     mut len: usize,\n  953 | ) {\n  954 |     let mut iter = iter.into_iter();\n  955 |     while len > 0 {\n  956 |         let Some(curr) = iter.next() else { return };\n  957 |         let sub = (*curr).buf_capacity().min(len);\n  958 |         unsafe { curr.set_len(sub) };\n  959 |         len -= sub;\n  960 |     }\n  961 | }","lines":12,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-buf/src/io_buf.rs#L950-L961"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`AsyncifyPool::dispatch` in `compio-driver/src/asyncify.rs` has a TOCTOU race condition between checking the thread counter and spawning a new thread. Multiple concurrent callers can all observe `counter < thread_limit` before any spawned thread increments the counter (the increment only happens when the thread starts running, not when `thread::spawn` is called). This can cause more threads than `thread_limit` to be created simultaneously when `dispatch` is called concurrently from multiple threads.","fix":"Increment the counter atomically before spawning the thread (e.g., with `compare_exchange` or a pre-increment), and decrement if the spawn fails. This closes the window between the load and the increment.","locations":[{"ref":"compio-driver/src/asyncify.rs:119-131","code":"  119 |                     } else if self.counter.load(Ordering::Acquire) >= self.thread_limit {\n  120 |                         // SAFETY: we can ensure the type\n  121 |                         Err(DispatchError(*unsafe {\n  122 |                             Box::from_raw(Box::into_raw(f).cast())\n  123 |                         }))\n  124 |                     } else {\n  125 |                         std::thread::spawn(worker(\n  126 |                             self.receiver.clone(),\n  127 |                             self.counter.clone(),\n  128 |                             self.recv_timeout,\n  129 |                         ));\n  130 |                         self.sender.send(f).expect(\"the channel should not be full\");\n  131 |                         Ok(())","lines":13,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-driver/src/asyncify.rs#L119-L131"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In the fuse_op macro (macros.rs) the poll() and iour() transition methods move out of *self via std::ptr::read, leaving the memory behind self in a logically uninitialized state, and then call poll::$name::new or iour::$name::new to initialize the new variant before writing it back via std::ptr::write. If the new() call panics, the write never happens; the memory behind self still carries the old Uninit bit-pattern (with the same argument values that were just moved out), and the destructor of the enclosing type will attempt to drop those arguments a second time, causing a double-drop and undefined behavior.","fix":"Wrap the new() call in a ManuallyDrop or use a scopeguard/catch_unwind boundary so that if new() panics, the original memory is left in a defined (e.g. zeroed/null) state that can be safely dropped, or ensure new() is documented as panic-free and the unsafe invariant is explicitly maintained.","locations":[{"ref":"compio-driver/src/macros.rs:179-185","code":"  179 |                             Self::Uninit(..) => {\n  180 |                                 unsafe {\n  181 |                                     let Self::Uninit($($arg),*) = std::ptr::read(self) else {\n  182 |                                         ::std::hint::unreachable_unchecked()\n  183 |                                     };\n  184 |                                     std::ptr::write(self, Self::Poll(poll::$name::new($($arg),*)));\n  185 |                                 }","lines":7,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-driver/src/macros.rs#L179-L185"},{"ref":"compio-driver/src/macros.rs:195-201","code":"  195 |                             Self::Uninit(..) => {\n  196 |                                 unsafe {\n  197 |                                     let Self::Uninit($($arg),*) = std::ptr::read(self) else {\n  198 |                                         ::std::hint::unreachable_unchecked()\n  199 |                                     };\n  200 |                                     std::ptr::write(self, Self::IoUring(iour::$name::new($($arg),*)));\n  201 |                                 }","lines":7,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-driver/src/macros.rs#L195-L201"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In iocp/cp/mod.rs the timeout for GetQueuedCompletionStatusEx is computed as timeout.as_millis() as u32. as_millis() returns u128; for Duration values exceeding approximately 49.7 days (u32::MAX milliseconds = 4294967295 ms) the cast silently truncates, causing a much shorter actual timeout than requested. While such long timeouts are uncommon, the truncation is silent and produces incorrect behavior.","fix":"Clamp the milliseconds value before casting: `timeout.as_millis().min(u32::MAX as u128) as u32`, or add a comment noting the documented maximum.","locations":[{"ref":"compio-driver/src/sys/driver/iocp/cp/mod.rs:119-121","code":"  119 |         let timeout = match timeout {\n  120 |             Some(timeout) => timeout.as_millis() as u32,\n  121 |             None => INFINITE,","lines":3,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-driver/src/sys/driver/iocp/cp/mod.rs#L119-L121"}]},
