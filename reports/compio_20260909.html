{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In iocp/cp/mod.rs the NTSTATUS-to-Win32-error translation maps ERROR_MORE_DATA to Ok(0). ERROR_MORE_DATA (234) is not a failure - it indicates that the operation completed but the buffer was too small and there is additional data. Returning Ok(0) instead of Ok(InternalHigh) (the actual bytes-transferred count) silently discards the real transfer count and may cause callers to think no data was transferred, leading to data loss or infinite retry loops.","fix":"Map ERROR_MORE_DATA to Ok(overlapped.base.InternalHigh) instead of Ok(0), preserving the actual bytes transferred. Alternatively, surface it as an error with a distinct error kind so callers can decide how to handle truncated reads.","locations":[{"ref":"compio-driver/src/sys/driver/iocp/cp/mod.rs:186-201","code":"  186 |             let res = if status >= 0 {\n  187 |                 Ok(overlapped.base.InternalHigh)\n  188 |             } else {\n  189 |                 let error = unsafe { RtlNtStatusToDosError(status) };\n  190 |                 match error {\n  191 |                     ERROR_IO_INCOMPLETE\n  192 |                     | ERROR_NETNAME_DELETED\n  193 |                     | ERROR_HANDLE_EOF\n  194 |                     | ERROR_BROKEN_PIPE\n  195 |                     | ERROR_PIPE_CONNECTED\n  196 |                     | ERROR_PIPE_NOT_CONNECTED\n  197 |                     | ERROR_NO_DATA\n  198 |                     | ERROR_MORE_DATA => Ok(0),\n  199 |                     _ => Err(io::Error::from_raw_os_error(error as _)),\n  200 |                 }\n  201 |             };","lines":16,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-driver/src/sys/driver/iocp/cp/mod.rs#L186-L201"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"PathStat::create_entry sets AT_EMPTY_PATH unconditionally, even when a non-empty path is provided. AT_EMPTY_PATH is only meaningful when pathname is an empty string (in which case the dirfd itself is the target). Setting it with a real path is semantically wrong, though Linux ignores it for non-empty paths. The follow_symlink=true branch always includes AT_EMPTY_PATH alongside the real path, which contradicts the intended semantics - AT_EMPTY_PATH and path-based lookups are mutually exclusive.","fix":"Start with flags = 0 (not AT_EMPTY_PATH) for PathStat since it always receives a real path. AT_EMPTY_PATH should only appear in FileStat, where it is correct.","locations":[{"ref":"compio-driver/src/sys/op/fs/iour.rs:128-141","code":"  128 |     fn create_entry(&mut self, _control: &mut Self::Control) -> OpEntry {\n  129 |         let mut flags = libc::AT_EMPTY_PATH;\n  130 |         if !self.follow_symlink {\n  131 |             flags |= libc::AT_SYMLINK_NOFOLLOW;\n  132 |         }\n  133 |         opcode::Statx::new(\n  134 |             Fd(self.dirfd.as_fd().as_raw_fd()),\n  135 |             self.path.as_ptr(),\n  136 |             &raw mut self.stat as _,\n  137 |         )\n  138 |         .flags(flags)\n  139 |         .mask(STATX_MASK.bits())\n  140 |         .build()\n  141 |         .into()","lines":14,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-driver/src/sys/op/fs/iour.rs#L128-L141"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Splice::call() creates local copies of offset_in/offset_out as u64 (lines 95-102) and passes mutable references to those locals to rustix::pipe::splice. The splice syscall updates the pointed-to offset values to indicate how many bytes were consumed, allowing callers to advance the offset. Because the locals are discarded after the call, the updated offsets are silently thrown away. For a one-shot Splice op this is acceptable; however, if the op is retried (e.g., EAGAIN path on poll) with the same starting offset, data can be re-read or written starting from the original position rather than continuing where splice left off, leading to data duplication or corruption.","fix":"Store the updated offsets back into self.offset_in and self.offset_out after each call: 'self.offset_in = off_in as i64; self.offset_out = off_out as i64;' so retries continue from the correct position.","locations":[{"ref":"compio-driver/src/sys/op/fs/mod.rs:90-107","code":"   90 |     pub(crate) fn call(&self, _: &mut ()) -> io::Result<usize>\n   91 |     where\n   92 |         S1: AsFd,\n   93 |         S2: AsFd,\n   94 |     {\n   95 |         let off_in = self.offset_in;\n   96 |         let off_out = self.offset_out;\n   97 | \n   98 |         rustix::pipe::splice(\n   99 |             &self.fd_in,\n  100 |             (off_in >= 0).then_some(&mut (off_in as u64)),\n  101 |             &self.fd_out,\n  102 |             (off_out >= 0).then_some(&mut (off_out as u64)),\n  103 |             self.len,\n  104 |             self.flags,\n  105 |         )\n  106 |         .map_err(Into::into)\n  107 |     }","lines":18,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-driver/src/sys/op/fs/mod.rs#L90-L107"},{"ref":"compio-driver/src/sys/op/fs/poll.rs:230-232","code":"  230 |     fn operate(&mut self, control: &mut Self::Control) -> Poll<io::Result<usize>> {\n  231 |         poll_io(|| self.call(control))\n  232 |     }","lines":3,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-driver/src/sys/op/fs/poll.rs#L230-L232"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"RecvFromManaged::init in the io_uring path sets ctrl.iovec.iov_len = self.buffer_len but never sets ctrl.iovec.iov_base. The RecvMsg io_uring opcode uses BUFFER_SELECT (Flags::BUFFER_SELECT), which means the kernel picks the buffer from the buffer ring and ignores iov_base. However, buffer_len is used via RecvFromManagedControl::iovec.iov_len in the msghdr. In the io_uring fixed-buffer recvmsg path the iov_base must point to a valid address or be null - a zeroed iov_base (null pointer) together with iov_len != 0 may confuse some kernel versions that validate the iovec before the BUFFER_SELECT path replaces it.","fix":"Either explicitly set ctrl.iovec.iov_base = ptr::null_mut() (documenting that BUFFER_SELECT overrides it) or set iov_len = 0 when BUFFER_SELECT is in use, to avoid triggering any iovec validation in the kernel.","locations":[{"ref":"compio-driver/src/sys/op/managed/iour.rs:274-279","code":"  274 |     unsafe fn init(&mut self, ctrl: &mut Self::Control) {\n  275 |         ctrl.iovec.iov_len = self.buffer_len;\n  276 |         ctrl.msg.msg_name = &raw mut self.addr as _;\n  277 |         ctrl.msg.msg_namelen = self.addr.size_of() as _;\n  278 |         ctrl.msg.msg_iov = &raw mut ctrl.iovec;\n  279 |         ctrl.msg.msg_iovlen = 1;","lines":6,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-driver/src/sys/op/managed/iour.rs#L274-L279"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In TaskQueue::clear, the hot and cold list heads/tails are set to None before draining the SlotMap. The drain iterator still calls task.drop() and task.wait_for_scheduling() on each item. Because the linked-list pointers inside the items still point to each other, the dropped Task values (which decrement ref count) might still have stale prev/next pointers inside the now-drained SlotMap. This is benign because the SlotMap is drained (entries are gone), but the pointer-clearing happens before the drain, meaning any subsequent access to inner.hot/cold during the drain (e.g. through a waker that still holds a Task) would see an inconsistent state.","fix":"Clear the linked-list heads/tails after the drain, not before, or add a comment explaining why pre-clearing is safe.","locations":[{"ref":"compio-executor/src/queue.rs:86-106","code":"   86 |             self.with_inner(|inner| {\n   87 |                 if inner.map.is_empty() {\n   88 |                     trace!(\"Map empty, return\");\n   89 |                     return;\n   90 |                 }\n   91 | \n   92 |                 inner.hot.head = None;\n   93 |                 inner.hot.tail = None;\n   94 |                 inner.cold.head = None;\n   95 |                 inner.cold.tail = None;\n   96 | \n   97 |                 for task in inner.map.drain().filter_map(|(_, i)| i.task) {\n   98 |                     trace!(?task, \"Dropping task\");\n   99 | \n  100 |                     task.drop();\n  101 |                     task.wait_for_scheduling();\n  102 |                 }\n  103 | \n  104 |                 debug_assert!(inner.map.is_empty());\n  105 |             })\n  106 |         }","lines":21,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-executor/src/queue.rs#L86-L106"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"SyncReadBuf::fill_read_buf computes `available_space = capacity - current_len` and then conditionally reserves more space when `available_space < target_space`. However if `current_len >= max_buffer_size` is checked first and returns an error, this is correct. But the subsequent `reserve_exact` call silently ignores its error result (`let _ = inner.reserve_exact(...)`), meaning that if reservation fails, the read proceeds with whatever space was already available, potentially reading 0 bytes forever and setting eof=true incorrectly.","fix":"Propagate the error from reserve_exact, or at least log it. Also, reading on a zero-capacity slice after failed reserve should be handled explicitly.","locations":[{"ref":"compio-io/src/compat/sync_stream.rs:147-149","code":"  147 |                     let new_capacity = current_len + target_space;\n  148 |                     let _ = inner.reserve_exact(new_capacity - capacity);\n  149 |                 }","lines":3,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-io/src/compat/sync_stream.rs#L147-L149"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In framed/read.rs, when the framed stream reaches EOF (read returns 0) for the first time, it sets eof=true but then loops back without returning Poll::Pending. This causes it to immediately try to decode whatever partial data remains in the buffer. If the framer returns None (incomplete frame), it tries to read again, gets 0 again, and only then returns Poll::Ready(None). This means one extra read syscall happens after EOF, wasting a syscall.","fix":"After the second 0-byte read, also try to decode any leftover partial data before returning None. Alternatively, on first EOF attempt a decode; if None, return Poll::Ready(None) directly.","locations":[{"ref":"compio-io/src/framed/read.rs:113-122","code":"  113 |                     if res? == 0 {\n  114 |                         // It's the second time EOF is reached, return None\n  115 |                         if this.read_state.eof {\n  116 |                             return Poll::Ready(None);\n  117 |                         }\n  118 | \n  119 |                         this.read_state.eof = true;\n  120 |                     }\n  121 |                 }\n  122 |             };","lines":10,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-io/src/framed/read.rs#L113-L122"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In compio-net/src/resolve/unix.rs, resolve_sock_addrs calls `.expect(\"shouldn't be cancelled\")` on the JoinHandle result. If the runtime decides to cancel the blocking task (which is valid behaviour), this panics the caller instead of returning an error. The comment documents the intent, but the real issue is that spawn_blocking cancellation can happen.","fix":"Return an appropriate io::Error (e.g. ErrorKind::Interrupted or a custom error) instead of panicking when the task is cancelled.","locations":[{"ref":"compio-net/src/resolve/unix.rs:17-19","code":"   17 |         .await\n   18 |         .resume_unwind()\n   19 |         .expect(\"shouldn't be cancelled\")","lines":3,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-net/src/resolve/unix.rs#L17-L19"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Connection::closed takes the worker out of state via take(), but if closed() is called a second time the worker is None and the method returns immediately with whatever error is in try_state(). This means a second concurrent caller could get a stale error even if the connection is not yet fully shut down. In addition, if called before the connection is closed at all, the worker is taken and detached, breaking the run loop's cleanup.","fix":"Avoid taking the worker in closed(); instead, join a shared channel or event that is signalled when the run loop exits.","locations":[{"ref":"compio-quic/src/connection.rs:657-664","code":"  657 |     pub async fn closed(&self) -> ConnectionError {\n  658 |         let worker = self.0.state().worker.take();\n  659 |         if let Some(worker) = worker {\n  660 |             let _ = worker.await;\n  661 |         }\n  662 | \n  663 |         self.0.try_state().unwrap_err()\n  664 |     }","lines":8,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-quic/src/connection.rs#L657-L664"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"EndpointState::handle_data calls self.connections.get(&ch).unwrap() at line 89 for DatagramEvent::ConnectionEvent without checking that the connection handle exists in the map. An unknown handle from the quinn-proto layer would cause a panic.","fix":"Guard with if let Some(conn) = self.connections.get(&ch) and log/ignore if missing.","locations":[{"ref":"compio-quic/src/endpoint.rs:85-91","code":"   85 |                 Some(DatagramEvent::ConnectionEvent(ch, event)) => {\n   86 |                     let _ = self\n   87 |                         .connections\n   88 |                         .get(&ch)\n   89 |                         .unwrap()\n   90 |                         .send(ConnectionEvent::Proto(event));\n   91 |                 }","lines":7,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-quic/src/endpoint.rs#L85-L91"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"EndpointInner::run reuses the recv_buf across iterations by passing it back into self.socket.recv(recv_buf). On the error path (e.g. ConnectionReset, ERROR_PORT_UNREACHABLE) the buffer is not reset and is reused directly. If a partial write occurred before the error, the next receive will operate on a buffer that still contains stale data, potentially confusing meta.len bounds.","fix":"Call recv_buf.clear() (or truncate to 0) before re-submitting the buffer after a non-fatal error.","locations":[{"ref":"compio-quic/src/endpoint.rs:318-329","code":"  318 |             let mut state = select! {\n  319 |                 BufResult(res, recv_buf) = recv_fut => {\n  320 |                     let mut state = self.state.lock();\n  321 |                     match res {\n  322 |                         Ok(meta) => state.handle_data(meta, &recv_buf, respond_fn),\n  323 |                         Err(e) if e.kind() == io::ErrorKind::ConnectionReset => {}\n  324 |                         #[cfg(windows)]\n  325 |                         Err(e) if e.raw_os_error() == Some(windows_sys::Win32::Foundation::ERROR_PORT_UNREACHABLE as _) => {}\n  326 |                         Err(e) => break Err(e),\n  327 |                     }\n  328 |                     recv_fut.set(self.socket.recv(recv_buf).fuse());\n  329 |                     state","lines":12,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-quic/src/endpoint.rs#L318-L329"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In py_ossl.rs poll_read, when ssl_read returns ErrorCode::WANT_READ with no io_error, the loop continues immediately without registering a waker or returning Pending. This is inside with_context which converts WouldBlock to Poll::Pending, but the inner loop spins until ssl_read either succeeds or hits WouldBlock from the underlying async stream. If the SSL layer internally needs to loop (e.g. on re-key), this is intentional - but if WANT_READ is returned for a reason other than the underlying stream blocking (e.g. a protocol-level need), the loop will spin indefinitely consuming CPU. The same pattern is repeated in poll_write.","fix":"Add a bound on loop iterations or document why unbounded spinning is safe here. Consider whether ErrorCode::WANT_READ from ssl_read without an io_error can ever fail to produce a WouldBlock from the underlying stream.","locations":[{"ref":"compio-tls/src/compat/py_ossl.rs:91-104","code":"   91 |         self.with_context(ctx, |s| {\n   92 |             loop {\n   93 |                 match s.ssl_read(buf) {\n   94 |                     Ok(res) => return Ok(res),\n   95 |                     Err(e) => match e.code() {\n   96 |                         ErrorCode::ZERO_RETURN => return Ok(0),\n   97 |                         ErrorCode::SYSCALL if e.io_error().is_none() => return Ok(0),\n   98 |                         ErrorCode::WANT_READ if e.io_error().is_none() => {}\n   99 |                         _ => return Err(e.into_io_error().unwrap_or_else(io::Error::other)),\n  100 |                     },\n  101 |                 }\n  102 |             }\n  103 |         })\n  104 |     }","lines":14,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-tls/src/compat/py_ossl.rs#L91-L104"},{"ref":"compio-tls/src/compat/py_ossl.rs:116-125","code":"  116 |         self.with_context(ctx, |s| {\n  117 |             loop {\n  118 |                 match s.ssl_write(buf) {\n  119 |                     Ok(res) => return Ok(res),\n  120 |                     Err(e) if e.code() == ErrorCode::WANT_READ && e.io_error().is_none() => {}\n  121 |                     Err(e) => return Err(e.into_io_error().unwrap_or_else(io::Error::other)),\n  122 |                 }\n  123 |             }\n  124 |         })\n  125 |     }","lines":10,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-tls/src/compat/py_ossl.rs#L116-L125"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In compio-ws/src/lib.rs, WebSocketStream::poll_next flushes the inner sink (both inner.poll_flush and the underlying MaybeTlsStream poll_flush) before returning each received item. This flush-before-yield behaviour is designed to drain any pending pong/control-frame replies before delivering the message to the caller, but it means every single received message incurs a flush round-trip on the write path. For high-throughput read-only workloads this is an unnecessary performance cost.","fix":"Only flush before yielding if the WebSocket layer actually buffered a response (e.g. a pong for a ping, or a close ack). Tungstenite already tracks whether a reply was queued; expose that or move the flush to a more targeted location.","locations":[{"ref":"compio-ws/src/lib.rs:309-325","code":"  309 |     fn poll_next(self: Pin<&mut Self>, cx: &mut Context<'_>) -> Poll<Option<Self::Item>> {\n  310 |         let mut this = self.project();\n  311 |         loop {\n  312 |             if this.next_item.is_some() {\n  313 |                 ready!(this.inner.as_mut().poll_flush(cx))?;\n  314 |                 ready!(futures_util::AsyncWrite::poll_flush(\n  315 |                     Pin::new(this.inner.get_mut().get_mut()),\n  316 |                     cx\n  317 |                 ))?;\n  318 |                 break Poll::Ready(this.next_item.take().expect(\"next_item should be Some\"));\n  319 |             } else {\n  320 |                 let item = ready!(this.inner.as_mut().poll_next(cx));\n  321 |                 *this.next_item = Some(item);\n  322 |             }\n  323 |         }\n  324 |     }\n  325 | }","lines":17,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-ws/src/lib.rs#L309-L325"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In compio-ws/src/tls.rs wrap_stream, when both native-tls and rustls features are enabled, native-tls is tried first. If native_tls::new_connector() fails, the code falls through to rustls. This silent fallback means the user may think they are using native-tls but actually get rustls if the system's native-tls is misconfigured. The warning log at level warn is the only indication. There is no way for the caller to detect which backend was actually used.","fix":"Either remove the silent fallback and let the native-tls error propagate, or expose which backend was chosen in the return type.","locations":[{"ref":"compio-ws/src/tls.rs:134-152","code":"  134 |                     {\n  135 |                         match encryption::native_tls::new_connector() {\n  136 |                             Ok(c) => c,\n  137 |                             Err(e) => {\n  138 |                                 compio_log::warn!(\n  139 |                                     \"Falling back to rustls TLS connector due to native-tls \\\n  140 |                                      error: {e:?}\",\n  141 |                                 );\n  142 |                                 #[cfg(feature = \"rustls\")]\n  143 |                                 {\n  144 |                                     encryption::rustls::new_connector()?\n  145 |                                 }\n  146 |                                 #[cfg(not(feature = \"rustls\"))]\n  147 |                                 {\n  148 |                                     return Err(e);\n  149 |                                 }\n  150 |                             }\n  151 |                         }\n  152 |                     }","lines":19,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-ws/src/tls.rs#L134-L152"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`SetLen for arrayvec::ArrayVec<u8, N>` and `SetLen for smallvec::SmallVec<[u8; N]>` use `(**self).buf_len()` to check the current length before calling `self.set_len(len)`. The double deref `**self` is unusual and likely unintentional compared to the pattern used elsewhere (e.g., `(*self).buf_len()` in other impls). While it compiles because both deref to the same thing, it is inconsistent and confusing.","fix":"Replace `(**self).buf_len()` with `self.len()` or `(*self).buf_len()` for consistency with the rest of the codebase.","locations":[{"ref":"compio-buf/src/io_buf.rs:881-886","code":"  881 | impl<const N: usize> SetLen for arrayvec::ArrayVec<u8, N> {\n  882 |     unsafe fn set_len(&mut self, len: usize) {\n  883 |         if (**self).buf_len() < len {\n  884 |             unsafe { self.set_len(len) };\n  885 |         }\n  886 |     }","lines":6,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-buf/src/io_buf.rs#L881-L886"},{"ref":"compio-buf/src/io_buf.rs:882-887","code":"  882 |     unsafe fn set_len(&mut self, len: usize) {\n  883 |         if (**self).buf_len() < len {\n  884 |             unsafe { self.set_len(len) };\n  885 |         }\n  886 |     }\n  887 | }","lines":6,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-buf/src/io_buf.rs#L882-L887"}]},
{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`SharedFd::drop` in `compio-driver/src/fd.rs` wakes the waker only when `strong_count == 2`. However, if many `SharedFd` clones are dropped simultaneously (e.g., from multiple threads), the count may skip directly from 3 to 1, bypassing the `== 2` check. In that case, the waker registered in `take` would never be notified, causing the future returned by `take` to hang.","fix":"Change the condition to `strong_count <= 2` to also cover the case where multiple clones are dropped and the count goes below 2. The comment already says \"It's OK to wake multiple times,\" so waking when `count <= 2` instead of `== 2` avoids the missed-wakeup.","locations":[{"ref":"compio-driver/src/fd.rs:107-114","code":"  107 | impl<T> Drop for SharedFd<T> {\n  108 |     fn drop(&mut self) {\n  109 |         // It's OK to wake multiple times.\n  110 |         if Shared::strong_count(&self.0) == 2 && self.0.waits.load(Ordering::Acquire) {\n  111 |             self.0.waker.wake()\n  112 |         }\n  113 |     }\n  114 | }","lines":8,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-driver/src/fd.rs#L107-L114"}]},
{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In iocp/mod.rs Driver::poll(), when there are entries in completed_rx (blocking ops finished), the IOCP port is not polled for new completions in that same call. Any wait-based completions (OpType::Event) that the OS has posted to the IOCP port during that time are deferred until the next poll() call. While not a correctness bug by itself, this creates unnecessary latency for event-based operations when blocking operations are also in flight.","fix":"After draining completed_rx, still poll the IOCP port with a zero timeout to collect any immediately available entries, rather than skipping the IOCP poll entirely when completed_rx is non-empty.","locations":[{"ref":"compio-driver/src/sys/driver/iocp/mod.rs:185-210","code":"  185 |     pub fn poll(&mut self, timeout: Option<Duration>) -> io::Result<()> {\n  186 |         instrument!(compio_log::Level::TRACE, \"poll\", ?timeout);\n  187 | \n  188 |         let notify = &self.notify.overlapped as *const Overlapped;\n  189 | \n  190 |         let mut has_entry = false;\n  191 |         while let Ok(entry) = self.completed_rx.try_recv() {\n  192 |             entry.notify();\n  193 |             has_entry = true;\n  194 |         }\n  195 |         if self.notify.reset() {\n  196 |             has_entry = true;\n  197 |         }\n  198 | \n  199 |         if !has_entry {\n  200 |             for e in self.notify.port.poll(timeout)? {\n  201 |                 if let Some(e) = Self::create_entry(notify, &mut self.waits, e) {\n  202 |                     self.notify.set_awake();\n  203 |                     e.notify()\n  204 |                 }\n  205 |             }\n  206 |         }\n  207 |         self.notify.set_awake();\n  208 | \n  209 |         Ok(())\n  210 |     }","lines":26,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-driver/src/sys/driver/iocp/mod.rs#L185-L210"}]},
{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"RecvFromMulti (fallback path in managed/fallback.rs) creates RecvFromManaged with len=0, relying on set_result to populate self.len with the actual received byte count. However, TakeBuffer::take_buffer calls 'buffer.advance_to(self.len)'. If set_result is never called (e.g., on cancellation), self.len remains 0, and advance_to(0) leaves the buffer with zero initialized bytes, silently producing an empty buffer instead of signalling an error. The caller may interpret this as a zero-length receive rather than a cancelled operation.","fix":"Track whether set_result was called (e.g., with an Option<usize>) and return None from take_buffer if len was never set, which propagates the cancellation correctly.","locations":[{"ref":"compio-driver/src/sys/op/managed/fallback.rs:195-212","code":"  195 | impl<S: AsFd> RecvFromMulti<S> {\n  196 |     /// Create [`RecvFromMulti`].\n  197 |     pub fn new(fd: S, pool: &BufferPool, flags: RecvFlags) -> io::Result<Self> {\n  198 |         Ok(Self {\n  199 |             op: RecvFromManaged::new(fd, pool, 0, flags)?,\n  200 |             len: 0,\n  201 |         })\n  202 |     }\n  203 | }\n  204 | \n  205 | impl<S: AsFd> TakeBuffer for RecvFromMulti<S> {\n  206 |     type Buffer = RecvFromMultiResult;\n  207 | \n  208 |     fn take_buffer(self) -> Option<Self::Buffer> {\n  209 |         let (mut buffer, addr) = self.op.take_buffer()?;\n  210 |         unsafe { buffer.advance_to(self.len) };\n  211 |         Some(RecvFromMultiResult { buffer, addr })\n  212 |     }","lines":18,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-driver/src/sys/op/managed/fallback.rs#L195-L212"}]},
{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"RecvMsgMultiResultImpl::ancillary() reads header.controllen from the buffer (written by the kernel) and uses it as the slice length, with the offset computed from the fixed NLEN constant. The assert in new() validates total_len = header + NLEN + clen + payloadlen. If the kernel writes controllen > clen (which should not happen since we pass clen as the limit, but could happen with MSG_CTRUNC on some paths), ancillary() would produce a slice that extends into the payload area, returning wrong data. No defensive check exists.","fix":"Clamp the ancillary slice to self.clen: change 'header.controllen as usize' to 'header.controllen.min(self.clen as u32) as usize', and add a debug_assert to catch mismatches early.","locations":[{"ref":"compio-driver/src/sys/op/managed/iour.rs:700-704","code":"  700 |     fn ancillary(&self) -> &[u8] {\n  701 |         let header = self.header();\n  702 |         let offset = size_of::<io_uring_recvmsg_out>() + NLEN;\n  703 |         &self.buffer.as_init()[offset..offset + header.controllen as usize]\n  704 |     }","lines":5,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-driver/src/sys/op/managed/iour.rs#L700-L704"}]},
{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"RecvMsgMultiFallback::set_result (lines 898-903) sets self.len from the result BEFORE calling self.op.set_result. This ordering means that if self.op.set_result internally inspects or uses self.len (it doesn't currently), it would see the new len. More critically, the result passed to self.op.set_result is the raw byte count for the entire receive, but self.op (RecvMsgManaged) interprets this differently from the actual data payload. Currently harmless but the order differs from the iour.rs RecvMsgMultiImpl path which sets len in set_result after calling inner.set_result, creating subtle inconsistency.","fix":"Unify the ordering: call self.op.set_result first (to register the buffer), then update self.len. Add a comment explaining why the order matters.","locations":[{"ref":"compio-driver/src/sys/op/managed/iour.rs:893-904","code":"  893 |     unsafe fn set_result(\n  894 |         &mut self,\n  895 |         control: &mut Self::Control,\n  896 |         result: &io::Result<usize>,\n  897 |         extra: &crate::Extra,\n  898 |     ) {\n  899 |         if let Ok(len) = result {\n  900 |             self.len = *len;\n  901 |         }\n  902 |         unsafe { self.op.set_result(control, result, extra) };\n  903 |     }\n  904 | }","lines":12,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-driver/src/sys/op/managed/iour.rs#L893-L904"}]},
{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In JoinHandle::cancel, the method takes ownership of self, calls self.task.as_ref()?.cancel(false), and then awaits self. The cancel(false) flag means the result will NOT be dropped in cancel(). The subsequent await via the Future impl will take the result and return it as Ok(T). This is correct but the drop_result=false path in Task::cancel is subtle: if the future completes between cancel() and the await, the result is indeed returned. However, if the executor is dropped between cancel() and the await resolving, the task will be cleared (with drop_result=true via clear()), so the result is lost - the await will correctly return Err(JoinError::Cancelled).","fix":"No code change needed, but document that cancel() only guarantees best-effort result retrieval.","locations":[{"ref":"compio-executor/src/join_handle.rs:47-50","code":"   47 |     pub async fn cancel(self) -> Option<T> {\n   48 |         self.task.as_ref()?.cancel(false);\n   49 |         self.await.ok()\n   50 |     }","lines":4,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-executor/src/join_handle.rs#L47-L50"}]},
{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In Metadata (unix) the modified() and accessed() methods add both Duration::from_secs and Duration::from_nanos to UNIX_EPOCH. On platforms where st_mtime_nsec can exceed 999,999,999 (which is disallowed by POSIX but can occur with some kernels or NFS mounts returning raw nsec counts > 1e9), this produces a SystemTime that is up to ~18 seconds ahead of the actual mtime, because the nanosecond component is not clamped.","fix":"Clamp the nanosecond component to 999_999_999 or use Duration::new(secs, nsecs.min(999_999_999) as u32) to match what std does.","locations":[{"ref":"compio-fs/src/metadata/unix.rs:105-108","code":"  105 |         Ok(SystemTime::UNIX_EPOCH\n  106 |             + Duration::from_secs(self.0.stat.st_mtime as _)\n  107 |             + Duration::from_nanos(self.0.stat.st_mtime_nsec as _))\n  108 |     }","lines":4,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-fs/src/metadata/unix.rs#L105-L108"},{"ref":"compio-fs/src/metadata/unix.rs:111-114","code":"  111 |         Ok(SystemTime::UNIX_EPOCH\n  112 |             + Duration::from_secs(self.0.stat.st_atime as _)\n  113 |             + Duration::from_nanos(self.0.stat.st_atime_nsec as _))\n  114 |     }","lines":4,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-fs/src/metadata/unix.rs#L111-L114"}]},
{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"FileType::is_file() on Windows returns !self.is_dir && !self.is_symlink. This means any non-directory, non-symlink entry (including device files, sockets, named pipes) is reported as a regular file, which is incorrect. The std::fs::FileType::is_file() on Windows only returns true for regular files.","fix":"Add an explicit is_file field populated from std::fs::FileType::is_file(), analogous to how is_dir and is_symlink are stored. Update the From<std::fs::FileType> conversion accordingly.","locations":[{"ref":"compio-fs/src/metadata/windows.rs:275-277","code":"  275 |     pub fn is_file(&self) -> bool {\n  276 |         !self.is_dir && !self.is_symlink\n  277 |     }","lines":3,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-fs/src/metadata/windows.rs#L275-L277"}]},
{"id":"LOGIC_34","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"AsyncIterator for AncillaryIter calls self.inner.current() and then self.inner.next() every iteration, but does not advance past the last element before returning None. If current() returns None, next() is still called unnecessarily. More importantly, the iterator is not fused: calling next() after it returns None calls current() again, which may return None again or (if the buffer pointer is reused externally) return garbage.","fix":"Check if the result of current() is None and early-return without calling next(). Implement FusedIterator or add an `exhausted` flag.","locations":[{"ref":"compio-io/src/ancillary/mod.rs:102-111","code":"  102 | impl<'a> Iterator for AncillaryIter<'a> {\n  103 |     type Item = AncillaryRef<'a>;\n  104 | \n  105 |     fn next(&mut self) -> Option<Self::Item> {\n  106 |         unsafe {\n  107 |             let cmsg = self.inner.current(self.buffer.as_ptr());\n  108 |             self.inner.next(self.buffer.as_ptr());\n  109 |             cmsg.map(AncillaryRef)\n  110 |         }\n  111 |     }","lines":10,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-io/src/ancillary/mod.rs#L102-L111"}]},
{"id":"LOGIC_35","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"implicit_close checks Shared::strong_count == 2 to decide when to implicitly close the connection. This is racy: between the count check and the close() call another clone may be dropped, causing a double-close attempt, or another clone may be created, preventing close when it should occur.","fix":"This pattern is inherently racy with reference-counted shared state. Prefer an explicit closed flag inside the mutex, or use Arc::try_unwrap.","locations":[{"ref":"compio-quic/src/connection.rs:128-132","code":"  128 | fn implicit_close(this: &Shared<ConnectionInner>) {\n  129 |     if Shared::strong_count(this) == 2 {\n  130 |         this.state().close(0u32.into(), Bytes::new())\n  131 |     }\n  132 | }","lines":5,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-quic/src/connection.rs#L128-L132"}]},
{"id":"LOGIC_36","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"EndpointRef::Drop checks Shared::strong_count == 2 with the same inherent TOCTOU race as implicit_close. It also unconditionally sets exit_on_idle = true even when the other reference is the worker's own clone, which is usually the intent, but the count check does not distinguish user clones from the worker clone.","fix":"Document the invariant clearly or guard with an explicit shutdown flag inside the state mutex.","locations":[{"ref":"compio-quic/src/endpoint.rs:401-410","code":"  401 | impl Drop for EndpointRef {\n  402 |     fn drop(&mut self) {\n  403 |         if Shared::strong_count(&self.0) == 2 {\n  404 |             // There are actually two cases:\n  405 |             // 1. User is trying to shutdown the socket.\n  406 |             self.0.done.wake();\n  407 |             // 2. User dropped the endpoint but the worker is still running.\n  408 |             self.0.state.lock().exit_on_idle = true;\n  409 |         }\n  410 |     }","lines":10,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-quic/src/endpoint.rs#L401-L410"}]},
{"id":"LOGIC_37","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"CancelToken::cancel calls notify_all before setting is_cancelled to true. If a WaitFuture is polled concurrently (on another cooperating task in the same thread, via yield points), the poll loop in WaitFuture::poll checks is_cancelled first; it is still false after the notify fires, causing it to call ready!(self.listen.poll_unpin(cx)) on an already-consumed EventListener. This does not cause unsafety but may produce a spurious Poll::Pending or a lost wake. The single-threaded nature of compio limits this to tasks resumed within the same event loop iteration, but reordering the two operations (set is_cancelled first, then notify_all) is the correct pattern.","fix":"Swap the two lines: set `self.0.is_cancelled.replace(true)` before calling `self.0.notify.notify_all()`, so any woken task sees is_cancelled == true immediately.","locations":[{"ref":"compio-runtime/src/cancel.rs:83-84","code":"   83 |         self.0.notify.notify_all();\n   84 |         if self.0.is_cancelled.replace(true) {","lines":2,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-runtime/src/cancel.rs#L83-L84"}]},
{"id":"LOGIC_38","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"WithCancelFailFast does not register the CancelToken's cancel listener with the inner future. When the EventListener fires (cancel triggered), it returns Poll::Ready(Err(Cancelled)) without registering a waker for the inner future. If the future was previously polled and returned Poll::Pending with a waker stored in some I/O registration, that waker is never retracted. After cancellation, the inner future may still generate spurious wakes driving the surrounding task. This is not incorrect (the future already returned Ready), but the waker leak can cause unnecessary task wake-ups.","fix":"This is a minor concern and low priority; document that after the future returns Err(Cancelled), any pending I/O ops registered by the inner future may still wake the task once before the op is cancelled.","locations":[{"ref":"compio-runtime/src/future/combinator/cancel.rs:112-127","code":"  112 | impl<F: ?Sized> Future for WithCancelFailFast<F>\n  113 | where\n  114 |     F: Future,\n  115 | {\n  116 |     type Output = Result<F::Output, Cancelled>;\n  117 | \n  118 |     fn poll(self: Pin<&mut Self>, cx: &mut Context<'_>) -> Poll<Self::Output> {\n  119 |         let mut this = self.project();\n  120 | \n  121 |         if this.listen.poll_unpin(cx).is_ready() {\n  122 |             return Poll::Ready(Err(Cancelled));\n  123 |         }\n  124 | \n  125 |         this.future.poll_unpin(cx).map(Ok)\n  126 |     }\n  127 | }","lines":16,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-runtime/src/future/combinator/cancel.rs#L112-L127"}]},
{"id":"LOGIC_39","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In compio-tls/src/maybe.rs, MaybeTlsStream::negotiated_alpn returns None for plain streams. This is correct, but the doc comment on line 54 says 'Returns the negotiated ALPN protocol' without clarifying that None is returned for non-TLS streams. Callers may interpret None as 'no ALPN was negotiated' (which can also be true for TLS streams) rather than 'this is a plain stream'.","fix":"Update the doc comment: 'Returns the negotiated ALPN protocol, or None if this is a plain (non-TLS) stream or if no ALPN protocol was negotiated.'","locations":[{"ref":"compio-tls/src/maybe.rs:44-50","code":"   44 |     /// Returns the negotiated ALPN protocol.\n   45 |     pub fn negotiated_alpn(&self) -> Option<Cow<'_, [u8]>> {\n   46 |         match &self.0 {\n   47 |             MaybeTlsStreamInner::Plain(_) => None,\n   48 |             MaybeTlsStreamInner::Tls(s) => s.negotiated_alpn(),\n   49 |         }\n   50 |     }","lines":7,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-tls/src/maybe.rs#L44-L50"}]},
{"id":"LOGIC_40","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The same missing close-ack flush issue exists in compio-ws/examples/echo_server.rs: on receiving Message::Close the server breaks without flushing the buffered close acknowledgment.","fix":"After the break, call websocket.close(None).await.ok() to flush the close acknowledgment before the connection is dropped.","locations":[{"ref":"compio-ws/examples/echo_server.rs:49-51","code":"   49 |             Message::Close(frame) => {\n   50 |                 println!(\"Received close frame: {frame:?}\");\n   51 |                 break;","lines":3,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-ws/examples/echo_server.rs#L49-L51"}]},
{"id":"LOGIC_41","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In compio-ws/examples/echo_server_tls.rs, when the client sends a Message::Close frame, the server breaks out of the loop without sending a close acknowledgment frame. The WebSocket protocol (RFC 6455 section 5.5.1) requires the server to respond with its own Close frame. The tungstenite library buffers the close-ack automatically but it needs to be flushed. Because the loop breaks immediately without a final websocket.flush(), the close-ack may not be sent.","fix":"After the break, call websocket.close(None).await? or at minimum websocket.flush().await? to ensure the close handshake is completed before dropping the connection.","locations":[{"ref":"compio-ws/examples/echo_server_tls.rs:134-137","code":"  134 |             }\n  135 |             Message::Close(frame) => {\n  136 |                 println!(\"Received close frame: {frame:?}\");\n  137 |                 break;","lines":4,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-ws/examples/echo_server_tls.rs#L134-L137"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"In framed/write.rs, State::poll_flush handles State::Writing and State::Flushing together, but after Writing completes (with a BufResult), the write error is returned via `Poll::Ready(res)` where `res` comes from `BufResult(res, buf)`. However for State::Closing, it calls `poll_sink` which calls `ready!(fut.poll_unpin(cx))` and unpacks (io, res, buf) - but then sets state to Idle without clearing the `closed` flag (which lives in AsyncWriteStream, not in State). This means after a failed close, calling poll_close again restarts the close from Idle state again, losing the information that a close was in progress.","fix":"Track closing state explicitly so that a partially-completed close is retried correctly, not restarted.","locations":[{"ref":"compio-io/src/framed/write.rs:74-92","code":"   74 |     fn poll_sink(&mut self, cx: &mut std::task::Context<'_>) -> Poll<io::Result<()>> {\n   75 |         let (io, res, buf) = match self {\n   76 |             State::Configuring(io, buf) => {\n   77 |                 initialize!(self, io, buf);\n   78 |                 return Poll::Ready(Ok(()));\n   79 |             }\n   80 |             State::Idle(_) => {\n   81 |                 return Poll::Ready(Ok(()));\n   82 |             }\n   83 |             State::Writing(fut) => {\n   84 |                 let (io, BufResult(res, buf)) = ready!(fut.poll_unpin(cx));\n   85 |                 (io, res, buf)\n   86 |             }\n   87 |             State::Closing(fut) | State::Flushing(fut) => ready!(fut.poll_unpin(cx)),\n   88 |         };\n   89 |         *self = State::Idle(Some((io, buf)));\n   90 |         Poll::Ready(res)\n   91 |     }\n   92 | }","lines":19,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-io/src/framed/write.rs#L74-L92"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"copy_with_size in util/copy.rs calls writer.shutdown() after flush(). Calling shutdown on all writers (including Vec<u8>, Null, etc.) is unexpected and wasteful. For in-memory writers shutdown is a no-op, but for network streams this closes the connection after every copy, which may not be the caller's intent. The copy() function should not decide lifecycle management for the writer.","fix":"Remove the shutdown() call from copy_with_size, or add a separate copy_and_shutdown() helper and leave copy() to only flush.","locations":[{"ref":"compio-io/src/util/copy.rs:63-64","code":"   63 |     writer.flush().await?;\n   64 |     writer.shutdown().await?;","lines":2,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-io/src/util/copy.rs#L63-L64"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"UdpSocket::connect calls super::each_addr which iterates candidate addresses, but the inner closure calls self.inner.connect(&SockAddr::from(addr)) (a synchronous method that returns io::Result<()>) wrapped in an async block without awaiting anything. The return type mismatch may silently succeed on the first address even if it fails, depending on how each_addr handles the result.","fix":"Return the result directly from the closure; no await is needed for a synchronous call, but verify each_addr handles synchronous Results correctly.","locations":[{"ref":"compio-net/src/udp.rs:122-127","code":"  122 |     pub async fn connect(&self, addr: impl ToSocketAddrsAsync) -> io::Result<()> {\n  123 |         super::each_addr(addr, |addr| async move {\n  124 |             self.inner.connect(&SockAddr::from(addr))\n  125 |         })\n  126 |         .await\n  127 |     }","lines":6,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-net/src/udp.rs#L122-L127"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"compio_quic::h3_impl::OpenStreams::close (and the Connection impl of close) converts h3's Code u64 to VarInt via try_into().expect(\"invalid code\"). The h3 error codes are defined as u64 values; the conversion to VarInt can fail if the code exceeds VarInt::MAX (2^62 - 1), causing a panic in the h3 close path.","fix":"Use VarInt::from_u64(code.value()).unwrap_or(VarInt::MAX) or saturate to avoid panicking on out-of-range codes.","locations":[{"ref":"compio-quic/src/connection.rs:1244","code":" 1244 |             self.0","lines":1,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-quic/src/connection.rs#L1244"},{"ref":"compio-quic/src/connection.rs:1273","code":" 1273 |             Connection::close(self, code.value().try_into().expect(\"invalid code\"), reason)","lines":1,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-quic/src/connection.rs#L1273"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"BytesCodec::decode allocates a new Vec<u8> and copies the entire frame payload into it just to wrap it in Bytes::from(inner). If the underlying buffer is already a Vec<u8> or Bytes, this is an unnecessary allocation. The framed read path then discards the original buffer slice.","fix":"Use `Bytes::copy_from_slice(buf.as_ref())` or, when the buffer type supports it, use `Bytes::from_owner` to avoid the extra allocation.","locations":[{"ref":"compio-io/src/framed/codec/bytes.rs:61-64","code":"   61 |     fn decode(&mut self, buf: &Slice<B>) -> Result<Bytes, Self::Error> {\n   62 |         let inner = buf.as_ref().to_vec();\n   63 |         Ok(Bytes::from(inner))\n   64 |     }","lines":4,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-io/src/framed/codec/bytes.rs#L61-L64"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"ReadAt and Read IOCP implementations cast the buffer length to u32 via an unchecked 'as _' cast (lines 26 and 77), while the WriteAt and Write implementations correctly use try_into().unwrap_or(u32::MAX) (lines 53 and 100). ReadFile's third parameter nNumberOfBytesToRead is u32; the 'as _' cast silently truncates for buffers larger than 4 GB, leading to a partial read that the caller would see as success with fewer bytes read than requested.","fix":"Replace 'slice.len() as _' with 'slice.len().try_into().unwrap_or(u32::MAX)' for consistency with WriteAt/Write and to avoid silent truncation.","locations":[{"ref":"compio-driver/src/sys/op/general/iocp.rs:14-36","code":"   14 |     unsafe fn operate(&mut self, _: &mut (), optr: *mut OVERLAPPED) -> Poll<io::Result<usize>> {\n   15 |         if let Some(overlapped) = unsafe { optr.as_mut() } {\n   16 |             overlapped.Anonymous.Anonymous.Offset = (self.offset & 0xFFFFFFFF) as _;\n   17 |             overlapped.Anonymous.Anonymous.OffsetHigh = (self.offset >> 32) as _;\n   18 |         }\n   19 |         let slice = self.buffer.sys_slice_mut();\n   20 |         let fd = self.fd.as_fd().as_raw_fd();\n   21 |         let mut transferred = 0;\n   22 |         let res = unsafe {\n   23 |             ReadFile(\n   24 |                 fd,\n   25 |                 slice.ptr() as _,\n   26 |                 slice.len() as _,\n   27 |                 &mut transferred,\n   28 |                 optr,\n   29 |             )\n   30 |         };\n   31 |         win32_result(res, transferred)\n   32 |     }\n   33 | \n   34 |     fn cancel(&mut self, _: &mut (), optr: *mut OVERLAPPED) -> io::Result<()> {\n   35 |         cancel(self.fd.as_fd().as_raw_fd(), optr)\n   36 |     }","lines":23,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-driver/src/sys/op/general/iocp.rs#L14-L36"},{"ref":"compio-driver/src/sys/op/general/iocp.rs:66-88","code":"   66 | unsafe impl<T: IoBufMut, S: AsFd> OpCode for Read<T, S> {\n   67 |     type Control = ();\n   68 | \n   69 |     unsafe fn operate(&mut self, _: &mut (), optr: *mut OVERLAPPED) -> Poll<io::Result<usize>> {\n   70 |         let fd = self.fd.as_fd().as_raw_fd();\n   71 |         let mut transferred = 0;\n   72 |         let slice = self.buffer.sys_slice_mut();\n   73 |         let res = unsafe {\n   74 |             ReadFile(\n   75 |                 fd,\n   76 |                 slice.ptr() as _,\n   77 |                 slice.len() as _,\n   78 |                 &mut transferred,\n   79 |                 optr,\n   80 |             )\n   81 |         };\n   82 |         win32_result(res, transferred)\n   83 |     }\n   84 | \n   85 |     fn cancel(&mut self, _: &mut (), optr: *mut OVERLAPPED) -> io::Result<()> {\n   86 |         cancel(self.fd.as_fd().as_raw_fd(), optr)\n   87 |     }\n   88 | }","lines":23,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-driver/src/sys/op/general/iocp.rs#L66-L88"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"DeviceIoControl's input and output buffer sizes are cast with 'input.len() as _' and 'output.len() as _' (lines 188 and 190). The Win32 DeviceIoControl function takes u32 for buffer sizes. The unchecked 'as _' cast from usize silently truncates for buffers > 4 GB, which for IOCTL buffers is unlikely but inconsistent with the defensive pattern used elsewhere.","fix":"Use try_into().unwrap_or(u32::MAX) for both buffer size arguments, consistent with WriteAt/Write.","locations":[{"ref":"compio-driver/src/sys/op/general/iocp.rs:183-194","code":"  183 |         let res = unsafe {\n  184 |             DeviceIoControl(\n  185 |                 fd,\n  186 |                 self.ioctl_code,\n  187 |                 input.ptr() as _,\n  188 |                 input.len() as _,\n  189 |                 output.ptr() as _,\n  190 |                 output.len() as _,\n  191 |                 &mut transferred,\n  192 |                 optr,\n  193 |             )\n  194 |         };","lines":12,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-driver/src/sys/op/general/iocp.rs#L183-L194"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"framed/read.rs calls `buf.reserve(16)` unconditionally on every loop iteration when the buffer does not contain a complete frame. If the inner buffer already has plenty of free space, this is a no-op, but it still calls through to IoBufMut::reserve on every failed extraction attempt.","fix":"Only reserve when the buffer is nearly full: `if buf.inner().buf_capacity() - buf.inner().buf_len() < 16 { buf.reserve(16); }`","locations":[{"ref":"compio-io/src/framed/read.rs:101","code":"  101 |                     buf.reserve(16);","lines":1,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-io/src/framed/read.rs#L101"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"ConnectionInner::run allocates a new send_buf Vec with capacity equal to current_mtu() once on startup (line 199), but the MTU can change during the connection. After each transmit the buffer is cleared and reused, which is correct, but if the MTU grows the buffer will never be reallocated to the new size, limiting GSO batching.","fix":"Re-derive the required capacity from conn.current_mtu() each time send_buf is refilled, or grow the vec with reserve() when it is smaller than needed.","locations":[{"ref":"compio-quic/src/connection.rs:199","code":"  199 |         let mut send_buf = Some(Vec::with_capacity(self.state().conn.current_mtu() as usize));","lines":1,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-quic/src/connection.rs#L199"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"EndpointState::handle_data creates a new resp_buf Vec::new() on every packet chunk inside the loop. For the common None or ConnectionEvent paths no allocation is needed, yet it is unconditionally allocated.","fix":"Move resp_buf outside the loop and call clear() at the top of each iteration, or use Vec::with_capacity(0) and let the allocator avoid the initial allocation.","locations":[{"ref":"compio-quic/src/endpoint.rs:69","code":"   69 |             match self.endpoint.handle(","lines":1,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-quic/src/endpoint.rs#L69"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In compio-ws/examples/ws_split.rs, inside run_client the data and ping_data vectors are cloned in a loop N=16384 times (lines 40-41). The clone is necessary for ownership since Message takes ownership, but data.clone() on a 256-byte Vec per iteration and ping_data.clone() on a 1-byte Vec per iteration are unnecessary allocations. ping_data could be a Bytes or a constant-length array to avoid repeated allocation.","fix":"Use Bytes::from_static or pre-allocate once and use unsafe send tricks, or restructure so the data is only allocated once. For this example, the impact is minor, but the pattern illustrates an anti-pattern.","locations":[{"ref":"compio-ws/examples/ws_split.rs:37-44","code":"   37 |     let data = vec![0; MSG_LEN];\n   38 |     let ping_data = vec![42];\n   39 |     for _ in 0..N {\n   40 |         ws.send(Message::Ping(ping_data.clone().into()))\n   41 |             .await\n   42 |             .unwrap();\n   43 |         ws.send(Message::Binary(data.clone().into())).await.unwrap();\n   44 |     }","lines":8,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-ws/examples/ws_split.rs#L37-L44"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"The Stderr doc comment in compio-fs/src/stdio/unix.rs (line 138) says \"A handle to the standard output stream\" but it describes stderr. The same copy-paste error appears in the Windows version.","fix":"Change the doc comment for Stderr to say \"standard error stream\" instead of \"standard output stream\".","locations":[{"ref":"compio-fs/src/stdio/unix.rs:138-140","code":"  138 | /// A handle to the standard output stream of a process.\n  139 | ///\n  140 | /// See [`stderr`].","lines":3,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-fs/src/stdio/unix.rs#L138-L140"},{"ref":"compio-fs/src/stdio/windows.rs:263-265","code":"  263 | ///\n  264 | /// See [`stderr`].\n  265 | #[derive(Debug, Clone)]","lines":3,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-fs/src/stdio/windows.rs#L263-L265"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"compio-io/src/buffer.rs: The method compact_to is marked `#[allow(dead_code)]` explicitly, indicating it is not called from within the crate's non-compat paths. It is only used when feature = 'compat' is enabled. The allow attribute hides the warning rather than gating the function.","fix":"Add `#[cfg(feature = \"compat\")]` to the method instead of `#[allow(dead_code)]` so it only compiles when needed.","locations":[{"ref":"compio-io/src/buffer.rs:41-42","code":"   41 |     #[allow(dead_code)]\n   42 |     pub fn compact_to(&mut self, capacity: usize, max_capacity: usize) {","lines":2,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-io/src/buffer.rs#L41-L42"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"SocketState in stub.rs (used on all non-linux platforms) has four methods (set_recv, set_recv_op, set_accept, set_accept_op) with bodies that are completely empty no-ops, and the entire struct is annotated with #[allow(dead_code)]. The Clone impl on SocketState is also synthesized but never used on non-linux targets.","fix":"This is intentional platform shimming, but consider adding a brief comment explaining why these are no-ops and removing the #[allow(dead_code)] by either using the methods or marking them with cfg.","locations":[{"ref":"compio-net/src/socket/stub.rs:1-19","code":"    1 | use compio_driver::{Extra, PollFirst};\n    2 | \n    3 | #[derive(Debug, Default, Clone)]\n    4 | pub(super) struct SocketState;\n    5 | \n    6 | #[allow(dead_code)]\n    7 | impl SocketState {\n    8 |     pub(super) fn new() -> Self {\n    9 |         SocketState\n   10 |     }\n   11 | \n   12 |     pub(super) fn set_recv(&self, _: &Extra) {}\n   13 | \n   14 |     pub(super) fn set_recv_op(&self, _: &mut impl PollFirst) {}\n   15 | \n   16 |     pub(super) fn set_accept(&self, _: &Extra) {}\n   17 | \n   18 |     pub(super) fn set_accept_op(&self, _: &mut impl PollFirst) {}\n   19 | }","lines":19,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-net/src/socket/stub.rs#L1-L19"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"The doc comment for Executor::clear says \"all tasks will be leakded\" (typo: should be \"leaked\"). Minor but shows up in generated docs.","fix":"Fix the typo: change \"leakded\" to \"leaked\".","locations":[{"ref":"compio-executor/src/lib.rs:245","code":"  245 |     /// be leakded.","lines":1,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-executor/src/lib.rs#L245"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"The doc comment for Dir in compio-fs/src/dirfd/mod.rs says \"the operatiosn are forwarded\" (typo: should be \"operations\") and \"They don't limit the path to be under self\" for Unix. The Unix implementation actually does NOT sandbox the path - this is correct, but the phrasing \"will treat self as the root of the filesystem\" for Windows is also potentially misleading since cap-primitives treats it as a root for capability checking, not an actual chroot.","fix":"Fix the typo \"operatiosn\" -> \"operations\" and clarify the Windows sandbox semantics.","locations":[{"ref":"compio-fs/src/dirfd/mod.rs:18-24","code":"   18 | /// ## Platform specific\n   19 | /// * Windows: the operations are forwarded to `cap-primitives`. They will treat\n   20 | ///   self as the root of the filesystem.\n   21 | /// * Unix: the operatiosn are forwarded to syscalls directly. They don't limit\n   22 | ///   the path to be under self. If the path is absolute, the directory\n   23 | ///   represented by self will be ignored.\n   24 | #[derive(Debug, Clone)]","lines":7,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-fs/src/dirfd/mod.rs#L18-L24"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"framed/mod.rs doc comment says `See also: [ReaderStream] and [ReaderStream]` - the second link is a duplicate of the first. It should read `ReaderStream` and `StreamReader`.","fix":"Change the second `[ReaderStream]` to `[StreamReader]` in both the link text and the `[StreamReader]:` link target.","locations":[{"ref":"compio-io/src/framed/mod.rs:152-153","code":"  152 | /// See also: [`ReaderStream`] and [`ReaderStream`].\n  153 | ///","lines":2,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-io/src/framed/mod.rs#L152-L153"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"iocp.rs AsyncifyFd::operate has the comment '// SAFETY: self won't be moved' but the safety of the unsafe block is not about self not being moved - it is about the closure not being called again (the take() ensures this). The comment is inaccurate and misleading. The same inaccurate comment appears in AsyncifyFd2::operate.","fix":"Remove or replace the comment with an accurate one, e.g. '// f.take() guarantees the closure is called at most once.'","locations":[{"ref":"compio-driver/src/sys/op/asyncify/iocp.rs:40-41","code":"   40 |         // SAFETY: self won't be moved\n   41 |         let f = self","lines":2,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-driver/src/sys/op/asyncify/iocp.rs#L40-L41"},{"ref":"compio-driver/src/sys/op/asyncify/iocp.rs:64-65","code":"   64 |     unsafe fn operate(&mut self, _: &mut (), _: *mut OVERLAPPED) -> Poll<io::Result<usize>> {\n   65 |         // SAFETY: self won't be moved","lines":2,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-driver/src/sys/op/asyncify/iocp.rs#L64-L65"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"unix.rs doc comment at line 176 says \"A Unix stream between two local sockets on Windows & WSL\" which is inaccurate; UnixStream is used on all supported platforms (Linux, macOS, Windows, etc.), not only Windows and WSL.","fix":"Change the description to \"A Unix domain stream socket\" or similar platform-neutral wording.","locations":[{"ref":"compio-net/src/unix.rs:176","code":"  176 | /// A Unix stream between two local sockets on Windows & WSL.","lines":1,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-net/src/unix.rs#L176"}]},
{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"The doc comment on SendStream::poll_close (in the futures_util::AsyncWrite impl for CompatSendStream) is missing. poll_close calls self.finish() which returns a Result; the error path maps ClosedStream to an io::Error via the From impl, which maps ClosedStream to NotConnected. This is correct, but no documentation explains this behavior or the difference from finish().","fix":"Add a short doc comment to poll_close explaining it delegates to finish() and that ClosedStream is mapped to io::ErrorKind::NotConnected.","locations":[{"ref":"compio-quic/src/send_stream.rs:435-439","code":"  435 |         fn poll_close(self: Pin<&mut Self>, _cx: &mut Context<'_>) -> Poll<io::Result<()>> {\n  436 |             self.get_mut().finish()?;\n  437 |             Poll::Ready(Ok(()))\n  438 |         }\n  439 |     }","lines":5,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-quic/src/send_stream.rs#L435-L439"}]},
{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"very_easy","description":"FileStat::create_entry in iour.rs contains a double as_fd() call: 'self.fd.as_fd().as_fd().as_raw_fd()'. This is a copy-paste artifact. All other AsFd usages in the same file call as_fd() once. The redundant call is harmless (BorrowedFd::as_fd() returns itself) but signals a subtle error in code review.","fix":"Remove the extra .as_fd() call: 'Fd(self.fd.as_fd().as_raw_fd())'.","locations":[{"ref":"compio-driver/src/sys/op/fs/iour.rs:80","code":"   80 |             Fd(self.fd.as_fd().as_fd().as_raw_fd()),","lines":1,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-driver/src/sys/op/fs/iour.rs#L80"}]},
{"id":"DUP_2","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"The Windows stdio implementations (Stdin, Stdout, Stderr) in compio-fs/src/stdio/windows.rs each have a nearly identical new() pattern: get the handle, initialize a OnceLock<bool> for isatty, try Runtime::with_current to attach, and create a SharedFd. This pattern is repeated three times (Stdin::new, Stdout::new, Stderr::new) with ~15 lines each.","fix":"Extract a private make_stdio_handle(handle, once_lock) function that performs the isatty check and returns (SharedFd<StaticFd>, bool).","locations":[{"ref":"compio-fs/src/stdio/windows.rs:138-148","code":"  138 |     pub(crate) fn new() -> Self {\n  139 |         let stdin = io::stdin();\n  140 |         let isatty = *STDIN_ISATTY.get_or_init(|| {\n  141 |             stdin.is_terminal()\n  142 |                 || Runtime::with_current(|r| r.attach(stdin.as_raw_handle() as _)).is_err()\n  143 |         });\n  144 |         Self {\n  145 |             fd: SharedFd::new(StaticFd(stdin.as_raw_handle())),\n  146 |             isatty,\n  147 |         }\n  148 |     }","lines":11,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-fs/src/stdio/windows.rs#L138-L148"},{"ref":"compio-fs/src/stdio/windows.rs:221-231","code":"  221 |     pub(crate) fn new() -> Self {\n  222 |         let stdout = io::stdout();\n  223 |         let isatty = *STDOUT_ISATTY.get_or_init(|| {\n  224 |             stdout.is_terminal()\n  225 |                 || Runtime::with_current(|r| r.attach(stdout.as_raw_handle() as _)).is_err()\n  226 |         });\n  227 |         Self {\n  228 |             fd: SharedFd::new(StaticFd(stdout.as_raw_handle())),\n  229 |             isatty,\n  230 |         }\n  231 |     }","lines":11,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-fs/src/stdio/windows.rs#L221-L231"},{"ref":"compio-fs/src/stdio/windows.rs:272-282","code":"  272 |     pub(crate) fn new() -> Self {\n  273 |         let stderr = io::stderr();\n  274 |         let isatty = *STDERR_ISATTY.get_or_init(|| {\n  275 |             stderr.is_terminal()\n  276 |                 || Runtime::with_current(|r| r.attach(stderr.as_raw_handle() as _)).is_err()\n  277 |         });\n  278 |         Self {\n  279 |             fd: SharedFd::new(StaticFd(stderr.as_raw_handle())),\n  280 |             isatty,\n  281 |         }\n  282 |     }","lines":11,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-fs/src/stdio/windows.rs#L272-L282"}]},
{"id":"DUP_3","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"The create_dir_all (and create_dir_all_at) recursive logic in compio-fs/src/utils/mod.rs is duplicated between the two functions with nearly identical structure (31 lines each). The only difference is that create_dir_all uses metadata() (global path) while create_dir_all_at uses metadata_at() (relative to dir). The deduplication opportunity is clear.","fix":"Extract a common generic helper that accepts a closure for the create and metadata operations, and call it from both create_dir_all and create_dir_all_at.","locations":[{"ref":"compio-fs/src/utils/mod.rs:124-146","code":"  124 |     async fn create_dir_all(&self, path: &Path) -> io::Result<()> {\n  125 |         if path == Path::new(\"\") {\n  126 |             return Ok(());\n  127 |         }\n  128 | \n  129 |         match self.inner.create(path).await {\n  130 |             Ok(()) => return Ok(()),\n  131 |             Err(ref e) if e.kind() == io::ErrorKind::NotFound => {}\n  132 |             Err(_) if metadata(path).await.map(|m| m.is_dir()).unwrap_or_default() => return Ok(()),\n  133 |             Err(e) => return Err(e),\n  134 |         }\n  135 |         match path.parent() {\n  136 |             Some(p) => Box::pin(self.create_dir_all(p)).await?,\n  137 |             None => {\n  138 |                 return Err(io::Error::other(\"failed to create whole tree\"));\n  139 |             }\n  140 |         }\n  141 |         match self.inner.create(path).await {\n  142 |             Ok(()) => Ok(()),\n  143 |             Err(_) if metadata(path).await.map(|m| m.is_dir()).unwrap_or_default() => Ok(()),\n  144 |             Err(e) => Err(e),\n  145 |         }\n  146 |     }","lines":23,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-fs/src/utils/mod.rs#L124-L146"},{"ref":"compio-fs/src/utils/mod.rs:160-197","code":"  160 |     async fn create_dir_all_at(&self, dir: &File, path: &Path) -> io::Result<()> {\n  161 |         use crate::metadata_at;\n  162 | \n  163 |         if path == Path::new(\"\") {\n  164 |             return Ok(());\n  165 |         }\n  166 |         match self.inner.create_at(dir, path).await {\n  167 |             Ok(()) => return Ok(()),\n  168 |             Err(ref e) if e.kind() == io::ErrorKind::NotFound => {}\n  169 |             Err(_)\n  170 |                 if metadata_at(dir, path)\n  171 |                     .await\n  172 |                     .map(|m| m.is_dir())\n  173 |                     .unwrap_or_default() =>\n  174 |             {\n  175 |                 return Ok(());\n  176 |             }\n  177 |             Err(e) => return Err(e),\n  178 |         }\n  179 |         match path.parent() {\n  180 |             Some(p) => Box::pin(self.create_dir_all_at(dir, p)).await?,\n  181 |             None => {\n  182 |                 return Err(io::Error::other(\"failed to create whole tree\"));\n  183 |             }\n  184 |         }\n  185 |         match self.inner.create_at(dir, path).await {\n  186 |             Ok(()) => Ok(()),\n  187 |             Err(_)\n  188 |                 if metadata_at(dir, path)\n  189 |                     .await\n  190 |                     .map(|m| m.is_dir())\n  191 |                     .unwrap_or_default() =>\n  192 |             {\n  193 |                 Ok(())\n  194 |             }\n  195 |             Err(e) => Err(e),\n  196 |         }\n  197 |     }","lines":38,"link":"https://github.com/compio-rs/compio/blob/63d3553cf2133cb3d0de840510f88b1def6edd24/compio-fs/src/utils/mod.rs#L160-L197"}]},
