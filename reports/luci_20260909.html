<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"critical","difficulty":"easy","description":"ddns.uc get_services_log reads `${logdir}/${request.args.service_name}.log`. It checks logdir for traversal (`..`) but never sanitizes service_name. An authenticated caller can pass service_name like '../../etc/shadow' to read arbitrary files matching `*.log` after concatenation, or `../passwd` if a `.log` postfix file exists; on systems where /var/log/* is rotated, the suffix `.log` is a common pattern.","fix":"Validate service_name against a strict allowlist (e.g. `match(name, /^[A-Za-z0-9_.-]+$/)`) and reject anything containing '/' or '..'.","locations":[{"ref":"applications/luci-app-ddns/root/usr/share/rpcd/ucode/ddns.uc:82-103","code":"   82 | \tget_services_log: {\n   83 | \t\targs: { service_name: 'service_name' },\n   84 | \t\tcall: function(request) {\n   85 | \t\t\tlet result = 'File not found or empty';\n   86 | \t\t\t\n   87 | \t\t\t// Get the log directory. Fall back to '/var/log/ddns' if not found\n   88 | \t\t\tlet logdir = uci.get('ddns', 'global', 'ddns_logdir') || ddns_log_path;\n   89 | \n   90 | \t\t\t// Fall back to default logdir with insecure path\n   91 | \t\t\tif (match(logdir, /\\.\\.\\//)) {\n   92 | \t\t\t\tlogdir = ddns_log_path;\n   93 | \t\t\t}\n   94 | \n   95 | \t\t\t// Check if service_name is provided and log file exists\n   96 | \t\t\tif (request.args && request.args.service_name && stat(`${logdir}/${request.args.service_name}.log`)?.type == 'file' ) {\n   97 | \t\t\t\tresult = readfile(`${logdir}/${request.args.service_name}.log`);\n   98 | \t\t\t}\n   99 | \n  100 | \t\t\tuci.unload();\n  101 | \t\t\treturn { result: result };\n  102 | \t\t}\n  103 | \t},","lines":22,"link":"https://github.com/openwrt/luci/blob/a8c110bed82375b69eb3881b2e54e617520e8c7d/applications/luci-app-ddns/root/usr/share/rpcd/ucode/ddns.uc#L82-L103"}]},

{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`dns_cache` and `hostapdClientData` are declared as `[]` (arrays) but used as objects keyed by hostname/MAC. Setting `dns_cache['1.2.3.4'] = 'name'` works incidentally on arrays but iteration, `length`, and JSON serialization will not behave correctly, and code later does `if (Hosts.length > 0)` on an *object* `Hosts` which always evaluates falsy.","fix":"Declare `const dns_cache = {};` and `const hostapdClientData = {};`. Replace `Hosts.length > 0` with `Object.keys(Hosts).length > 0`.","locations":[{"ref":"applications/luci-app-usteer/htdocs/luci-static/resources/view/usteer/usteer.js:15-16","code":"   15 | const dns_cache = [];\n   16 | const hostapdClientData = [];","lines":2,"link":"https://github.com/openwrt/luci/blob/a8c110bed82375b69eb3881b2e54e617520e8c7d/applications/luci-app-usteer/htdocs/luci-static/resources/view/usteer/usteer.js#L15-L16"},{"ref":"applications/luci-app-usteer/htdocs/luci-static/resources/view/usteer/usteer.js:252-259","code":"  252 | \t\t\t\t\t\tif (Hosts.length >0)\n  253 | \t\t\t\t\t\t\tdns_cache[address]=Hosts[\n  254 | \t\t\t\t\t\t\t\tObject.keys(Hosts).find(mac =>   \n  255 | \t\t\t\t\t\t\t\t\t((typeof Hosts[mac]['name'] !== 'undefined') && \n  256 | \t\t\t\t\t\t\t\t\t\t((Object.keys(Hosts[mac]['ip6addrs']).find(IPaddr2 => (address === Hosts[mac]['ip6addrs'][IPaddr2]))) ||\n  257 | \t\t\t\t\t\t\t\t\t\t(Object.keys(Hosts[mac]['ipaddrs']).find(IPaddr2 => (address === Hosts[mac]['ipaddrs'][IPaddr2])))))\n  258 | \t\t\t\t\t\t\t\t\t\t)\n  259 | \t\t\t\t\t\t\t\t]['name'];","lines":8,"link":"https://github.com/openwrt/luci/blob/a8c110bed82375b69eb3881b2e54e617520e8c7d/applications/luci-app-usteer/htdocs/luci-static/resources/view/usteer/usteer.js#L252-L259"}]},

on+=\"\\nLUCI_LANG.$LANG=New language\"\n   59 | \t\t\t# Sort the section and remove duplicates\n   60 | \t\t\tupdated_content=$(echo -e \"$section\" | sort -u | sed -E \"/$start_marker/,/$end_marker/{ /$start_marker/{p; r /dev/stdin\n   61 | \t\t\t}; /$end_marker/p; d\n   62 | \t\t\t}\" $(dirname \"$0\")/../luci.mk)\n   63 | \n   64 | \t\t\t# Write the updated content back to the .mk file\n   65 | \t\t\techo \"$updated_content\" > $(dirname \"$0\")/../luci.mk\n   66 | \n   67 | \t\t\techo \"Be sure to update the new language name in $(dirname \"$0\")/../luci.mk\"\n   68 | \n   69 | \t\tfi\n   70 | \tdone\n   71 | fi","lines":47,"link":"https://github.com/openwrt/luci/blob/a8c110bed82375b69eb3881b2e54e617520e8c7d/build/i18n-add-language.sh#L25-L71"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"build/i18n-init.sh's git probe is effectively only \"git binary exists\" — the `git status` output is swallowed by the redirection, so SCM will be set to \"git\" even when run outside any git working tree, leading the later `git add` to fail.","fix":"Replace with: `git -C . rev-parse --is-inside-work-tree >/dev/null 2>&1 && SCM=git`.","locations":[{"ref":"build/i18n-init.sh:10-17","code":"   10 | [ -d .svn ] && SCM=\"svn\"\n   11 | git=$( command -v git 2>/dev/null )\n   12 | [ \"$git\" ] && \"$git\" status >/dev/null && SCM=\"git\"\n   13 | \n   14 | [ -z \"$SCM\" ] && {\n   15 | \techo \"Unsupported SCM tool\" >&2\n   16 | \texit 1\n   17 | }","lines":8,"link":"https://github.com/openwrt/luci/blob/a8c110bed82375b69eb3881b2e54e617520e8c7d/build/i18n-init.sh#L10-L17"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"i18n-update.pl uses the classic Perl precedence bug: `open P, \"< $file\" || die \"...\"`. Because `||` binds tighter than the comma here, the die only fires when the literal mode string is false, which never happens. As a result a failing open is silently ignored and subsequent `readline P` runs on an unopened handle.","fix":"Use parentheses or `or` (lower precedence): `open(P, \"< $file\") or die \"open(): $!\"`.","locations":[{"ref":"build/i18n-update.pl:13-15","code":"   13 | \topen P, \"< $file\" || die \"open(): $!\";\n   14 | \tmy $data = readline P;\n   15 | \tclose P;","lines":3,"link":"https://github.com/openwrt/luci/blob/a8c110bed82375b69eb3881b2e54e617520e8c7d/build/i18n-update.pl#L13-L15"},{"ref":"build/i18n-update.pl:34-36","code":"   34 | \topen P, \"< $file\" || die \"open(): $!\";\n   35 | \tmy $data = readline P;\n   36 | \tclose P;","lines":3,"link":"https://github.com/openwrt/luci/blob/a8c110bed82375b69eb3881b2e54e617520e8c7d/build/i18n-update.pl#L34-L36"},{"ref":"build/i18n-update.pl:46-49","code":"   46 | \topen P, \"> $file\" || die \"open(): $!\";\n   47 | \tprint P $data;\n   48 | \tclose P;\n   49 | }","lines":4,"link":"https://github.com/openwrt/luci/blob/a8c110bed82375b69eb3881b2e54e617520e8c7d/build/i18n-update.pl#L46-L49"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In Lua's luci.json encoder, parse_iter treats a Lua table as an OBJECT only when `#obj == 0 and next(obj)` is true. This means *non-empty* sequences (arrays with #obj > 0) always fall into the array branch even if the table has additional string keys, and any data set as a mixed (associative+positional) table is silently truncated to an array.","fix":"Detect object semantics with a proper test (e.g. iterate once and check if any non-integer key exists, or expose explicit array/object markers).","locations":[{"ref":"libs/luci-lib-json/luasrc/json.lua:142-182","code":"  142 | function Encoder.parse_iter(self, obj)\n  143 | \tif obj == null then\n  144 | \t\treturn self:put(\"null\")\n  145 | \tend\n  146 | \n  147 | \tif type(obj) == \"table\" and (#obj == 0 and next(obj)) then\n  148 | \t\tself:put(\"{\")\n  149 | \t\tlocal first = true\n  150 | \n  151 | \t\tfor key, entry in pairs(obj) do\n  152 | \t\t\tif key ~= null then\n  153 | \t\t\t\tfirst = first or self:put(\",\")\n  154 | \t\t\t\tfirst = first and false\n  155 | \t\t\t\tself:parse_string(tostring(key))\n  156 | \t\t\t\tself:put(\":\")\n  157 | \t\t\t\tself:dispatch(entry)\n  158 | \t\t\tend\n  159 | \t\tend\n  160 | \n  161 | \t\tself:put(\"}\")\n  162 | \telse\n  163 | \t\tself:put(\"[\")\n  164 | \t\tlocal first = true\n  165 | \n  166 | \t\tif type(obj) == \"table\" then\n  167 | \t\t\tfor i=1, #obj do\n  168 | \t\t\t\tfirst = first or self:put(\",\")\n  169 | \t\t\t\tfirst = first and nil\n  170 | \t\t\t\tself:dispatch(obj[i])\n  171 | \t\t\tend\n  172 | \t\telse\n  173 | \t\t\tfor entry in obj do\n  174 | \t\t\t\tfirst = first or self:put(\",\")\n  175 | \t\t\t\tfirst = first and nil\n  176 | \t\t\t\tself:dispatch(entry)\n  177 | \t\t\tend\n  178 | \t\tend\n  179 | \n  180 | \t\tself:put(\"]\")\n  181 | \tend\n  182 | end","lines":41,"link":"https://github.com/openwrt/luci/blob/a8c110bed82375b69eb3881b2e54e617520e8c7d/libs/luci-lib-json/luasrc/json.lua#L142-L182"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"nixio.fs.stat(dest, type) passes the Lua built-in function `type` (not the string \"type\") as the second argument to stat. The function reference is never equal to the string \"dir\", so the directory-exists check almost always evaluates false and mkdir is called on already-existing directories.","fix":"Use the string literal: `if nixio.fs.stat(dest, \"type\") ~= \"dir\" then`.","locations":[{"ref":"libs/luci-lib-nixio/root/usr/lib/lua/nixio/fs.lua:74-79","code":"   74 | \tif stat.type == \"dir\" then\n   75 | \t\tif nixio.fs.stat(dest, type) ~= \"dir\" then\n   76 | \t\t\tres, code, msg = nixio.fs.mkdir(dest)\n   77 | \t\telse\n   78 | \t\t\tstat = true\n   79 | \t\tend","lines":6,"link":"https://github.com/openwrt/luci/blob/a8c110bed82375b69eb3881b2e54e617520e8c7d/libs/luci-lib-nixio/root/usr/lib/lua/nixio/fs.lua#L74-L79"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"`Map.checkDepends()` is a depth-limited recursive dependency resolver, but the recursion limit increments using the wrong default when `n` is undefined. `(n ?? 10) + 1` evaluates to `11` on the first nested call (because the OR default is 10, not 0), and the next iteration's guard `(11 ?? 0) < 10` is false, so recursion stops after a single re-evaluation pass. The intent is to allow up to 10 dependency re-evaluation rounds; only one happens.","fix":"Use `(n ?? 0) + 1` in the recursive call so the counter starts at 1 and grows monotonically until reaching the limit.","locations":[{"ref":"modules/luci-base/htdocs/luci-static/resources/form.js:755-766","code":"  755 | \tcheckDepends(ev, n) {\n  756 | \t\tlet changed = false;\n  757 | \n  758 | \t\tfor (let i = 0, s = this.children[0]; (s = this.children[i]) != null; i++)\n  759 | \t\t\tif (s.checkDepends(ev, n))\n  760 | \t\t\t\tchanged = true;\n  761 | \n  762 | \t\tif (changed && (n ?? 0) < 10)\n  763 | \t\t\tthis.checkDepends(ev, (n ?? 10) + 1);\n  764 | \n  765 | \t\tui.tabs.updateTabs(ev, this.root);\n  766 | \t},","lines":12,"link":"https://github.com/openwrt/luci/blob/a8c110bed82375b69eb3881b2e54e617520e8c7d/modules/luci-base/htdocs/luci-static/resources/form.js#L755-L766"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`isFileInSafeList` is supposed to whitelist a fixed set of repo key filenames. Two of the in-loop checks compare a lowercased + regex-stripped string to the *original* file name. Any filename with a single uppercase character (e.g. `MyKey.pub`) lowercases differently from the original and is therefore reported as a safe (protected) file, blocking deletion of user-created files.","fix":"Compare against the lowercased input on both sides.","locations":[{"ref":"modules/luci-mod-system/htdocs/luci-static/resources/view/system/repokeys.js:22-32","code":"   22 | function isFileInSafeList(file){\n   23 | \tfor (let name of safeList) {\n   24 | \t\tif (file === name)\n   25 | \t\t\treturn true;\n   26 | \t\tif (file.toLocaleLowerCase().replace(/^openwrt-[0-9]+\\.[0-9]+/i, '') !== file)\n   27 | \t\t\treturn true;\n   28 | \t\tif (file.toLocaleLowerCase().replace(/^openwrt-snapshots/i, '') !== file)\n   29 | \t\t\treturn true;\n   30 | \t}\n   31 | \treturn false;\n   32 | }","lines":11,"link":"https://github.com/openwrt/luci/blob/a8c110bed82375b69eb3881b2e54e617520e8c7d/modules/luci-mod-system/htdocs/luci-static/resources/view/system/repokeys.js#L22-L32"}]},

{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"acme.js _parseKeyValueListToMap parses entries with `paramKeyVal.slice(pos + 2, paramKeyVal.length - 1)`. This assumes the value is *always* surrounded by quotes. For unquoted entries it silently drops the first and last characters.","fix":"Strip a single optional pair of surrounding quotes via regex.","locations":[{"ref":"applications/luci-app-acme/htdocs/luci-static/resources/view/acme/acme.js:500-515","code":"  500 | function _parseKeyValueListToMap(paramsKeyVals) {\n  501 | \tlet map = new Map();\n  502 | \tif (!paramsKeyVals) {\n  503 | \t\treturn map;\n  504 | \t}\n  505 | \tfor (let paramKeyVal of paramsKeyVals) {\n  506 | \t\tlet pos = paramKeyVal.indexOf(\"=\");\n  507 | \t\tif (pos < 0) {\n  508 | \t\t\tcontinue;\n  509 | \t\t}\n  510 | \t\tlet name = paramKeyVal.slice(0, pos);\n  511 | \t\tlet unquotedVal = paramKeyVal.slice(pos + 2, paramKeyVal.length - 1);\n  512 | \t\tmap.set(name, unquotedVal);\n  513 | \t}\n  514 | \treturn map;\n  515 | }","lines":16,"link":"https://github.com/openwrt/luci/blob/a8c110bed82375b69eb3881b2e54e617520e8c7d/applications/luci-app-acme/htdocs/luci-static/resources/view/acme/acme.js#L500-L515"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"luci-app-coovachilli registers a Flag option titled 'Enabled' but bound to UCI key 'disabled', then inverts the enabled/disabled mapping. This is confusing; additionally there is no setter to handle config absence and no default, so a freshly added section starts in the wrong logical state.","fix":"Either bind to 'enabled' (positive semantics) or set a default and document the inversion clearly.","locations":[{"ref":"applications/luci-app-coovachilli/htdocs/luci-static/resources/view/coovachilli/coovachilli.js:75-77","code":"   75 | \t\tso = ss.option(form.Flag, 'disabled', _('Enabled') );\n   76 | \t\tso.enabled = '0';\n   77 | \t\tso.disabled = '1';","lines":3,"link":"https://github.com/openwrt/luci/blob/a8c110bed82375b69eb3881b2e54e617520e8c7d/applications/luci-app-coovachilli/htdocs/luci-static/resources/view/coovachilli/coovachilli.js#L75-L77"}]},

{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"https-dns-proxy rpcd builds the init-script command line as a string then runs `eval \"$cmd\"`. There is no need for eval here — the case construct already restricted action to a known set.","fix":"Execute the command directly: `\"/etc/init.d/${packageName}\" \"${action}\" >/dev/null 2>&1`.","locations":[{"ref":"applications/luci-app-https-dns-proxy/root/usr/libexec/rpcd/luci.https-dns-proxy:121-134","code":"  121 | set_init_action() {\n  122 | \tlocal action=\"$2\" cmd\n  123 | \t[ \"$(basename \"$1\")\" = \"$packageName\" ] || { print_json_bool 'result' '0'; return 1; }\n  124 | \t\tcase $action in\n  125 | \t\tenable|disable|start|stop|restart)\n  126 | \t\t\tcmd=\"/etc/init.d/${packageName} ${action}\"\n  127 | \t\t;;\n  128 | \tesac\n  129 | \tif [ -n \"$cmd\" ] && eval \"$cmd\" >/dev/null 2>&1; then\n  130 | \t\tprint_json_bool 'result' '1'\n  131 | \telse\n  132 | \t\tprint_json_bool 'result' '0'\n  133 | \tfi\n  134 | }","lines":14,"link":"https://github.com/openwrt/luci/blob/a8c110bed82375b69eb3881b2e54e617520e8c7d/applications/luci-app-https-dns-proxy/root/usr/libexec/rpcd/luci.https-dns-proxy#L121-L134"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"Division by zero when computing IPv6 statistics: if no host has traffic in any family, `ds_total + v4_total + v6_total === 0` produces `100 / 0 * 0 = NaN`. The KPI then displays `NaN%`.","fix":"Guard the division: `(rx_total) ? (100 / total * v6_total) : 0`.","locations":[{"ref":"applications/luci-app-nlbwmon/htdocs/luci-static/resources/view/nlbw/display.js:602-603","code":"  602 | \t\tthis.kpi('ipv6-hosts', '%.2f%%'.format(100 / (ds_total + v4_total + v6_total) * (ds_total + v6_total)));\n  603 | \t\tthis.kpi('ipv6-share', '%.2f%%'.format(100 / (rx4_total + rx6_total + tx4_total + tx6_total) * (rx6_total + tx6_total)));","lines":2,"link":"https://github.com/openwrt/luci/blob/a8c110bed82375b69eb3881b2e54e617520e8c7d/applications/luci-app-nlbwmon/htdocs/luci-static/resources/view/nlbw/display.js#L602-L603"}]},

{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"Regex only accepts IPv4 dotted-quad addresses for upstream proxies. The placeholder and help text imply hostnames are valid, but any hostname-based upstream silently fails the write.","fix":"Accept hostnames or add a clear validate() that surfaces the error.","locations":[{"ref":"applications/luci-app-tinyproxy/htdocs/luci-static/resources/view/tinyproxy/tinyproxy.js:312-319","code":"  312 | \t\tv.write = function(section_id, value) {\n  313 | \t\t\tif (value.match(/^\\d+\\.\\d+\\.\\d+\\.\\d+:\\d+/) || \n  314 | \t\t\t\tvalue.match(/^socks5 \\d+\\.\\d+\\.\\d+\\.\\d+:\\d+/)) {\n  315 | \t\t\t\treturn form.Value.prototype.write.apply(this, [section_id, value]);;\n  316 | \t\t\t} else {\n  317 | \t\t\t\treturn\n  318 | \t\t\t}\n  319 | \t\t};","lines":8,"link":"https://github.com/openwrt/luci/blob/a8c110bed82375b69eb3881b2e54e617520e8c7d/applications/luci-app-tinyproxy/htdocs/luci-static/resources/view/tinyproxy/tinyproxy.js#L312-L319"}]},
{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"i18n-init.sh uses `pushd \"$path\" 2&>/dev/null` and `popd 2&>/dev/null`. The redirection `2&>` is not valid POSIX or Bash syntax — it is interpreted as `2`, `&`, `>` (background a command and redirect).","fix":"Replace with `pushd \"$path\" >/dev/null 2>&1` and `popd >/dev/null 2>&1`.","locations":[{"ref":"build/i18n-init.sh:29-31","code":"   29 | \tpushd \"$path\" 2&>/dev/null || exit\n   30 | \t\"$prefix\"build/i18n-add-language.sh\n   31 | }","lines":3,"link":"https://github.com/openwrt/luci/blob/a8c110bed82375b69eb3881b2e54e617520e8c7d/build/i18n-init.sh#L29-L31"},{"ref":"build/i18n-init.sh:42","code":"   42 | popd 2&>/dev/null|| exit","lines":1,"link":"https://github.com/openwrt/luci/blob/a8c110bed82375b69eb3881b2e54e617520e8c7d/build/i18n-init.sh#L42"}]},

{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"luci.debug.trap_memtrace creates `tracefile` via io.open which may return nil. The returned disable function unconditionally calls `tracefile:close()`.","fix":"Guard with `if tracefile then tracefile:close() end`.","locations":[{"ref":"libs/luci-lib-base/luasrc/debug.lua:9-36","code":"    9 | function trap_memtrace(flags, dest)\n   10 | \tflags = flags or \"clr\"\n   11 | \tlocal tracefile = io.open(dest or \"/tmp/memtrace\", \"w\")\n   12 | \tlocal peak = 0\n   13 | \n   14 | \tlocal function trap(what, line)\n   15 | \t\tlocal info = debug.getinfo(2, \"Sn\")\n   16 | \t\tlocal size = floor(collectgarbage(\"count\"))\n   17 | \t\tif size > peak then\n   18 | \t\t\tpeak = size\n   19 | \t\tend\n   20 | \t\tif tracefile then\n   21 | \t\t\ttracefile:write(\n   22 | \t\t\t\t\"[\", what, \"] \", info.source, \":\", (line or \"?\"), \"\\t\",\n   23 | \t\t\t\t(info.namewhat or \"\"), \"\\t\",\n   24 | \t\t\t\t(info.name or \"\"), \"\\t\",\n   25 | \t\t\t\tsize, \" (\", peak, \")\\n\"\n   26 | \t\t\t)\n   27 | \t\tend\n   28 | \tend\n   29 | \n   30 | \tdebug.sethook(trap, flags)\n   31 | \n   32 | \treturn function()\n   33 | \t\tdebug.sethook()\n   34 | \t\ttracefile:close()\n   35 | \tend\n   36 | end","lines":28,"link":"https://github.com/openwrt/luci/blob/a8c110bed82375b69eb3881b2e54e617520e8c7d/libs/luci-lib-base/luasrc/debug.lua#L9-L36"}]},
{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"luci.util.split's documented behaviour says `max` is the number of bytes to process, but the implementation actually treats `max` as the number of separator hits. The `max = max or #str` default seeds an absurdly large count, and `max == 0` is special-cased to return the original string unsplit.","fix":"Align the implementation with the doc-comment (or vice-versa). Also fix `max == 0` to return `{}` or `{str}` consistently.","locations":[{"ref":"libs/luci-lib-base/luasrc/util.lua:198-234","code":"  198 | -- containing the resulting substrings. The optional max parameter specifies\n  199 | -- the number of bytes to process, regardless of the actual length of the given\n  200 | -- string. The optional last parameter, regex, specifies whether the separator\n  201 | -- sequence is interpreted as regular expression.\n  202 | --\t\t\t\t\tpattern as regular expression (optional, default is false)\n  203 | function split(str, pat, max, regex)\n  204 | \tpat = pat or \"\\n\"\n  205 | \tmax = max or #str\n  206 | \n  207 | \tlocal t = {}\n  208 | \tlocal c = 1\n  209 | \n  210 | \tif #str == 0 then\n  211 | \t\treturn {\"\"}\n  212 | \tend\n  213 | \n  214 | \tif #pat == 0 then\n  215 | \t\treturn nil\n  216 | \tend\n  217 | \n  218 | \tif max == 0 then\n  219 | \t\treturn str\n  220 | \tend\n  221 | \n  222 | \trepeat\n  223 | \t\tlocal s, e = str:find(pat, c, not regex)\n  224 | \t\tmax = max - 1\n  225 | \t\tif s and max < 0 then\n  226 | \t\t\tt[#t+1] = str:sub(c)\n  227 | \t\telse\n  228 | \t\t\tt[#t+1] = str:sub(c, s and s - 1)\n  229 | \t\tend\n  230 | \t\tc = e and e + 1 or #str + 1\n  231 | \tuntil not s or max < 0\n  232 | \n  233 | \treturn t\n  234 | end","lines":37,"link":"https://github.com/openwrt/luci/blob/a8c110bed82375b69eb3881b2e54e617520e8c7d/libs/luci-lib-base/luasrc/util.lua#L198-L234"}]},
{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"httpclient.lua returns from request_raw with `linesrc(true)..sock:readall()` concatenated. `sock:readall()` can return nil on a peer-closed connection, and `..` on nil raises an error.","fix":"Guard with locals: `local trailing = linesrc(true) or \"\"; local rest = sock:readall() or \"\"; return ...`.","locations":[{"ref":"libs/luci-lib-httpclient/luasrc/httpclient.lua:387-388","code":"  387 | \treturn response.code, response, linesrc(true)..sock:readall(), sock\n  388 | end","lines":2,"link":"https://github.com/openwrt/luci/blob/a8c110bed82375b69eb3881b2e54e617520e8c7d/libs/luci-lib-httpclient/luasrc/httpclient.lua#L387-L388"}]},
{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`handleModalSave` reads `getPreviousModalMap()` and `findClassInstance` into `mapNode` and `prevMap` but never uses them. Either side-effects from these calls are intended, or this is leftover dead code from an aborted refactor.","fix":"Remove the unused `mapNode`/`prevMap` lookups if they are dead code.","locations":[{"ref":"modules/luci-base/htdocs/luci-static/resources/form.js:4012-4017","code":" 4012 | \thandleModalSave(...args) /* ... */{\n 4013 | \t\tconst mapNode = this.getPreviousModalMap();\n 4014 | \t\tconst prevMap = mapNode ? dom.findClassInstance(mapNode) : this.map;\n 4015 | \n 4016 | \t\treturn this.super('handleModalSave', args);\n 4017 | \t},","lines":6,"link":"https://github.com/openwrt/luci/blob/a8c110bed82375b69eb3881b2e54e617520e8c7d/modules/luci-base/htdocs/luci-static/resources/form.js#L4012-L4017"}]},
{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`CBIFlagValue.parse` returns `undefined` when `isActive(section_id)` is false AND `retain` is true. Callers `Promise.all(tasks)` then receive `undefined`, breaking callers relying on the documented `Promise<void>` contract.","fix":"Add an explicit `return Promise.resolve();` after the `else if (!this.retain)` block.","locations":[{"ref":"modules/luci-base/htdocs/luci-static/resources/form.js:5140-5161","code":" 5140 | \t/** @override */\n 5141 | \tparse(section_id) {\n 5142 | \t\tif (this.isActive(section_id)) {\n 5143 | \t\t\tconst fval = this.formvalue(section_id);\n 5144 | \n 5145 | \t\t\tif (!this.isValid(section_id)) {\n 5146 | \t\t\t\tconst title = this.stripTags(this.title).trim();\n 5147 | \t\t\t\tconst error = this.getValidationError(section_id);\n 5148 | \n 5149 | \t\t\t\treturn Promise.reject(new TypeError(\n 5150 | \t\t\t\t\t`${_('Option \"%s\" contains an invalid input value.').format(title || this.option)} ${error}`));\n 5151 | \t\t\t}\n 5152 | \n 5153 | \t\t\tif (fval == this.default && (this.optional || this.rmempty))\n 5154 | \t\t\t\treturn Promise.resolve(this.remove(section_id));\n 5155 | \t\t\telse\n 5156 | \t\t\t\treturn Promise.resolve(this.write(section_id, fval));\n 5157 | \t\t}\n 5158 | \t\telse if (!this.retain) {\n 5159 | \t\t\treturn Promise.resolve(this.remove(section_id));\n 5160 | \t\t}\n 5161 | \t},","lines":22,"link":"https://github.com/openwrt/luci/blob/a8c110bed82375b69eb3881b2e54e617520e8c7d/modules/luci-base/htdocs/luci-static/resources/form.js#L5140-L5161"}]},
{"id":"LOGIC_34","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`flushRequestQueue` dispatches the batched POST to the module-level `rpcBaseURL` but the queue eligibility check reads the URL from `classes.rpc.getBaseURL()`. These are different values until `probeRPCBaseURL` resolves. If the queue manages to drain before probing finishes, the batched request goes to `null`.","fix":"Use the same source of truth in both the check and the dispatch.","locations":[{"ref":"modules/luci-base/htdocs/luci-static/resources/luci.js:532-592","code":"  532 | \tfunction isQueueableRequest(opt) {\n  533 | \t\tif (!classes.rpc)\n  534 | \t\t\treturn false;\n  535 | \n  536 | \t\tif (opt.method != 'POST' || typeof(opt.content) != 'object')\n  537 | \t\t\treturn false;\n  538 | \n  539 | \t\tif (opt.nobatch === true)\n  540 | \t\t\treturn false;\n  541 | \n  542 | \t\tconst rpcBaseURL = Request.expandURL(classes.rpc.getBaseURL());\n  543 | \n  544 | \t\treturn (rpcBaseURL != null && opt.url.indexOf(rpcBaseURL) == 0);\n  545 | \t}\n  546 | \n  547 | \t/**\n  548 | \t * Send all queued RPC requests in a single batched call and dispatch\n  549 | \t * individual callbacks for each original request.\n  550 | \t *\n  551 | \t * Behaviour:\n  552 | \t *  - aggregates queued requests' `content` into a single array payload\n  553 | \t *  - sends the batch to `rpcBaseURL` with `nobatch: true`\n  554 | \t *  - on success: clones and forwards per-request replies to the\n  555 | \t *    originally provided resolve callbacks, or rejects when no\n  556 | \t *    related reply is available\n  557 | \t *  - on failure: invokes each queued request's reject callback\n  558 | \t *\n  559 | \t * @private\n  560 | \t * @returns {void}\n  561 | \t */\n  562 | \tfunction flushRequestQueue() {\n  563 | \t\tif (!requestQueue.length)\n  564 | \t\t\treturn;\n  565 | \n  566 | \t\tconst reqopt = Object.assign({}, requestQueue[0][0], { content: [], nobatch: y of the other characters mentioned above.\n 2871 | \t\t *\n 2872 | \t\t * @returns {string}\n 2873 | \t\t * Returns the resulting URL path.\n 2874 | \t\t */\n 2875 | \t\turl() {\n 2876 | \t\t\treturn this.path(env.scriptname, arguments);\n 2877 | \t\t},\n 2878 | \n 2879 | \t\t/**\n 2880 | \t\t * Construct a URL path relative to the global static resource path\n 2881 | \t\t * of the LuCI ui (usually `/luci-static/resources`).\n 2882 | \t\t *\n 2883 | \t\t * The resulting URL is guaranteed to contain only the characters\n 2884 | \t\t * `a-z`, `A-Z`, `0-9`, `_`, `.`, `%`, `,`, `;`, and `-` as well\n 2885 | \t\t * as `/` for the path separator. Suffixing '?x=y&foo=bar' URI\n 2886 | \t\t * parameters also limited to the aforementioned characters is\n 2887 | \t\t * permissible.\n 2888 | \t\t *\n 2889 | \t\t * @instance\n 2890 | \t\t * @memberof LuCI\n 2891 | \t\t *\n 2892 | \t\t * @param {...string} [parts]\n 2893 | \t\t * An array of parts to join into a URL path. Parts may contain\n 2894 | \t\t * slashes and any of the other characters mentioned above.\n 2895 | \t\t *\n 2896 | \t\t * @returns {string}\n 2897 | \t\t * Returns the resulting URL path.\n 2898 | \t\t */\n 2899 | \t\tresource() {\n 2900 | \t\t\treturn this.path(env.resource, arguments);\n 2901 | \t\t},\n 2902 | \n 2903 | \t\t/**\n 2904 | \t\t * Construct a URL path relative to the media resource path of the\n 2905 | \t\t * LuCI ui (usually `/luci-static/$theme_name`).\n 2906 | \t\t *\n 2907 | \t\t * The resulting URL is guaranteed to contain only the characters\n 2908 | \t\t * `a-z`, `A-Z`, `0-9`, `_`, `.`, `%`, `,`, `;`, and `-` as well\n 2909 | \t\t * as `/` for the path separator. Suffixing '?x=y&foo=bar' URI\n 2910 | \t\t * parameters also limited to the aforementioned characters is\n 2911 | \t\t * permissible.\n 2912 | \t\t *\n 2913 | \t\t * @instance\n 2914 | \t\t * @memberof LuCI\n 2915 | \t\t *\n 2916 | \t\t * @param {...string} [parts]\n 2917 | \t\t * An array of parts to join into a URL path. Parts {"id":"LOGIC_37","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`rpc.handleCallReply` walks the `req.expect` map but the loop body unconditionally `break;`s at the end, so only the first key is examined. A multi-key expect silently passes after the first key.","fix":"Either throw when `Object.keys(req.expect).length > 1` to catch caller mistakes early, or refactor to take the single key directly.","locations":[{"ref":"modules/luci-base/htdocs/luci-static/resources/rpc.js:100-110","code":"  100 | \t\tif (req.expect) {\n  101 | \t\t\tfor (const key in req.expect) {\n  102 | \t\t\t\tif (ret != null && key != '')\n  103 | \t\t\t\t\tret = ret[key];\n  104 | \n  105 | \t\t\t\tif (ret == null || type.call(ret) != type.call(req.expect[key]))\n  106 | \t\t\t\t\tret = req.expect[key];\n  107 | \n  108 | \t\t\t\tbreak;\n  109 | \t\t\t}\n  110 | \t\t}","lines":11,"link":"https://github.com/openwrt/luci/blob/a8c110bed82375b69eb3881b2e54e617520e8c7d/modules/luci-base/htdocs/luci-static/resources/rpc.js#L100-L110"}]},

ey] = luci.ip.new(val):string()\n  320 | \t\t\t\t\tend\n  321 | \t\t\t\telseif key == \"sport\" or key == \"dport\" then\n  322 | \t\t\t\t\tif entry[key] == nil then\n  323 | \t\t\t\t\t\tentry[key] = val\n  324 | \t\t\t\t\tend\n  325 | \t\t\t\telseif val then\n  326 | \t\t\t\t\tentry[key] = val\n  327 | \t\t\t\tend\n  328 | \t\t\tend\n  329 | \n  330 | \t\t\tif callback then\n  331 | \t\t\t\tcallback(entry)\n  332 | \t\t\telse\n  333 | \t\t\t\tconnt[#connt+1] = entry\n  334 | \t\t\tend\n  335 | \t\tend\n  336 | \tend\n  337 | \n  338 | \treturn callback and true or connt\n  339 | end","lines":59,"link":"https://github.com/openwrt/luci/blob/a8c110bed82375b69eb3881b2e54e617520e8c7d/modules/luci-lua-runtime/luasrc/sys.lua#L281-L339"}]},

{"id":"LOGIC_40","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`isValidMAC(mac)` (and `validateTags` patterns elsewhere) checks `value == tag` but `value` may be an array. The comparison `value == tag` against an array always returns false. A reserved tag like `known` in a list bypasses the check.","fix":"Iterate values: `L.toArray(value).some(v => v == tag)`.","locations":[{"ref":"modules/luci-mod-network/htdocs/luci-static/resources/view/network/dhcp.js:216-220","code":"  216 | function validateTags(section_id, value) {\n  217 | \tif (Object.keys(reservedTags).some(tag => { return value == tag; }))\n  218 | \t\treturn _('Reserved tag');\n  219 | \treturn true;\n  220 | };","lines":5,"link":"https://github.com/openwrt/luci/blob/a8c110bed82375b69eb3881b2e54e617520e8c7d/modules/luci-mod-network/htdocs/luci-static/resources/view/network/dhcp.js#L216-L220"}]},

{"id":"LOGIC_44","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"OpenVPN's `script_security` ListValue uses translated description strings as `values`. The `values` array is used for the stored option value but the strings are localized, so saving will store the localized string rather than the integer OpenVPN expects.","fix":"Use raw value/label pairs via `o.value(0, _('0: Deny')); o.value(1, _('1: OS utils')); ...`.","locations":[{"ref":"protocols/luci-proto-openvpn/htdocs/luci-static/resources/protocol/openvpn.js:340-352","code":"  340 | \t{\n  341 | \t\ttab: 'scripts',\n  342 | \t\ttype: form.ListValue,\n  343 | \t\tname: 'script_security',\n  344 | \t\tvalues: [\n  345 | \t\t\t_('0: Deny'),\n  346 | \t\t\t_('1: OS utils'),\n  347 | \t\t\t_('2: User scripts'),\n  348 | \t\t\t_('3: Allow passwords in env')\n  349 | \t\t],\n  350 | \t\tlabel: _('Policy level over usage of external programs and scripts'),\n  351 | \t\tdefault: 1\n  352 | \t},","lines":13,"link":"https://github.com/openwrt/luci/blob/a8c110bed82375b69eb3881b2e54e617520e8c7d/protocols/luci-proto-openvpn/htdocs/luci-static/resources/protocol/openvpn.js#L340-L352"}]},

{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"ltn12.filter.chain uses `table.getn(arg)` and indexes the legacy `arg` table. Both `table.getn` and the auto-`arg` global were removed in Lua 5.2+.","fix":"Use `select('#', ...)` and pack varargs into a local table at function entry.","locations":[{"ref":"libs/luci-lib-base/luasrc/ltn12.lua:70-97","code":"   70 | function filter.chain(...)\n   71 |     local n = table.getn(arg)\n   72 |     local top, index = 1, 1\n   73 |     local retry = \"\"\n   74 |     return function(chunk)\n   75 |         retry = chunk and retry\n   76 |         while true do\n   77 |             if index == top then\n   78 |                 chunk = arg[index](chunk)\n   79 |                 if chunk == \"\" or top == n then return chunk\n   80 |                 elseif chunk then index = index + 1\n   81 |                 else\n   82 |                     top = top+1\n   83 |                     index = top\n   84 |                 end\n   85 |             else\n   86 |                 chunk = arg[index](chunk or \"\")\n   87 |                 if chunk == \"\" then\n   88 |                     index = index - 1\n   89 |                     chunk = retry\n   90 |                 elseif chunk then\n   91 |                     if index == n then return chunk\n   92 |                     else index = index + 1 end\n   93 |                 else base.error(\"filter returned inappropriate nil\") end\n   94 |             end\n   95 |         end\n   96 |     end\n   97 | end","lines":28,"link":"https://github.com/openwrt/luci/blob/a8c110bed82375b69eb3881b2e54e617520e8c7d/libs/luci-lib-base/luasrc/ltn12.lua#L70-L97"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"luci.model.ipkg.compare_versions uses table.getn (Lua 5.1 only) and compares version components with string compare (`s1 < s2`). String comparison gives wrong ordering for numeric versions: \"10\" < \"9\" lexicographically. So \"1.10\" is considered older than \"1.9\".","fix":"Replace `table.getn(t)` with `#t`, and when both components parse to numbers use numeric comparison.","locations":[{"ref":"libs/luci-lib-ipkg/luasrc/model/ipkg.lua:223-247","code":"  223 | \tlocal av1 = util.split(ver1, \"[%.%-]\", nil, true)\n  224 | \tlocal av2 = util.split(ver2, \"[%.%-]\", nil, true)\n  225 | \n  226 | \tlocal max = table.getn(av1)\n  227 | \tif (table.getn(av1) < table.getn(av2)) then\n  228 | \t\tmax = table.getn(av2)\n  229 | \tend\n  230 | \n  231 | \tfor i = 1, max, 1  do\n  232 | \t\tlocal s1 = av1[i] or \"\"\n  233 | \t\tlocal s2 = av2[i] or \"\"\n  234 | \n  235 | \t\t-- first \"not equal\" found return true\n  236 | \t\tif comp == \"~=\" and (s1 ~= s2) then return true end\n  237 | \t\t-- first \"lower\" found return true\n  238 | \t\tif (comp == \"<\" or comp == \"<=\") and (s1 < s2) then return true end\n  239 | \t\t-- first \"greater\" found return true\n  240 | \t\tif (comp == \">\" or comp == \">=\") and (s1 > s2) then return true end\n  241 | \t\t-- not equal then return false\n  242 | \t\tif (s1 ~= s2) then return false end\n  243 | \tend\n  244 | \n  245 | \t-- all equal and not compare greater or lower then true\n  246 | \treturn not (comp == \"<\" or comp == \">\")\n  247 | end","lines":25,"link":"https://github.com/openwrt/luci/blob/a8c110bed82375b69eb3881b2e54e617520e8c7d/libs/luci-lib-ipkg/luasrc/model/ipkg.lua#L223-L247"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"iptparser._parse_rules inserts nil into a Lua table to pad missing target column: `table.insert(rule_parts, 4, nil)`. Inserting nil is a no-op (and `table.insert` is documented to error for nil in some Lua versions).","fix":"Shift indices by hand: insert a sentinel like `\"\"` or restructure the parsing to detect missing target without table.insert(nil).","locations":[{"ref":"libs/luci-lib-iptparser/luasrc/sys/iptparser.lua:312-340","code":"  312 | \t\t\t\t\t-- cope with rules that have no target assigned\n  313 | \t\t\t\t\tif rule:match(\"^%d+%s+%d+%s+%d+%s%s\") then\n  314 | \t\t\t\t\t\ttable.insert(rule_parts, 4, nil)\n  315 | \t\t\t\t\tend\n  316 | \n  317 | \t\t\t\t\t-- ip6tables opt column is usually zero-width\n  318 | \t\t\t\t\tif self._family == 6 then\n  319 | \t\t\t\t\t\ttable.insert(rule_parts, 6, \"--\")\n  320 | \t\t\t\t\tend\n  321 | \n  322 | \t\t\t\t\trule_details[\"table\"]       = tbl\n  323 | \t\t\t\t\trule_details[\"chain\"]       = self._chain\n  324 | \t\t\t\t\trule_details[\"index\"]       = tonumber(rule_parts[1])\n  325 | \t\t\t\t\trule_details[\"packets\"]     = tonumber(rule_parts[2])\n  326 | \t\t\t\t\trule_details[\"bytes\"]       = tonumber(rule_parts[3])\n  327 | \t\t\t\t\trule_details[\"target\"]      = rule_parts[4]\n  328 | \t\t\t\t\trule_details[\"protocol\"]    = rule_parts[5]\n  329 | \t\t\t\t\trule_details[\"flags\"]       = rule_parts[6]\n  330 | \t\t\t\t\trule_details[\"inputif\"]     = rule_parts[7]\n  331 | \t\t\t\t\trule_details[\"outputif\"]    = rule_parts[8]\n  332 | \t\t\t\t\trule_details[\"source\"]      = rule_parts[9]\n  333 | \t\t\t\t\trule_details[\"destination\"] = rule_parts[10]\n  334 | \t\t\t\t\trule_details[\"options\"]     = { }\n  335 | \n  336 | \t\t\t\t\tfor i = 11, #rule_parts  do\n  337 | \t\t\t\t\t\tif #rule_parts[i] > 0 then\n  338 | \t\t\t\t\t\t\trule_details[\"options\"][i-10] = rule_parts[i]\n  339 | \t\t\t\t\t\tend\n  340 | \t\t\t\t\tend","lines":29,"link":"https://github.com/openwrt/luci/blob/a8c110bed82375b69eb3881b2e54e617520e8c7d/libs/luci-lib-iptparser/luasrc/sys/iptparser.lua#L312-L340"}]},
{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`groups` is created as a `Set` but items are stored via string-keyed properties (`groups[class_type] = class_type_i18n`). This conflates Set membership and object properties on the same value. Similarly `plugins` is treated as both an indexed array and a string-keyed map.","fix":"Use plain objects (or a `Map`) for the lookup, and keep the `Set` purely for membership.","locations":[{"ref":"modules/luci-mod-system/htdocs/luci-static/resources/view/system/plugins.js:31-53","code":"   31 | \t\tlet m, s, o, p_enabled;\n   32 | \t\tconst groups = new Set();\n   33 | \n   34 | \t\t// Set global uci config if absent\n   35 | \t\tif (!uci.get(luci_plugins, 'global')) {\n   36 | \t\t\tuci.add(luci_plugins, 'global', 'global');\n   37 | \t\t}\n   38 | \n   39 | \t\tfor (let plugin of plugins) {\n   40 | \t\t\tconst name = plugin.id;\n   41 | \t\t\tconst class_type = `${plugin.class}_${plugin.type}`;\n   42 | \t\t\tconst class_type_i18n = `${plugin.class_i18n} ${plugin.type_i18n}`\n   43 | \t\t\tgroups.add(class_type);\n   44 | \t\t\tgroups[class_type] = class_type_i18n;\n   45 | \t\t\tplugins[plugin.id] = plugin;\n   46 | \n   47 | \t\t\t// Set basic uci config for each plugin if absent\n   48 | \t\t\tif (!uci.get(luci_plugins, plugin.id)) {\n   49 | \t\t\t\t// add the plugin via its uuid under its class+type for filtering\n   50 | \t\t\t\tuci.add(luci_plugins, class_type, plugin.id);\n   51 | \t\t\t\tuci.set(luci_plugins, plugin.id, 'name', plugin.name);\n   52 | \t\t\t}\n   53 | \t\t}","lines":23,"link":"https://github.com/openwrt/luci/blob/a8c110bed82375b69eb3881b2e54e617520e8c7d/modules/luci-mod-system/htdocs/luci-static/resources/view/system/plugins.js#L31-L53"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"very_easy","description":"`addValidator` wraps the entire validator creation in a try/catch and swallows every exception with `catch (e) { }`, returning `undefined` to the caller. Validation set-up errors (datatype syntax errors, missing field, etc.) silently disappear, producing input widgets that look validated but never run any check.","fix":"At minimum log the exception via `console.error(e)` so failed validator setup is observable; ideally re-throw for development or surface it as a tooltip.","locations":[{"ref":"modules/luci-base/htdocs/luci-static/resources/ui.js:5623-5642","code":" 5623 | \taddValidator(field, type, optional, vfunc, ...events) {\n 5624 | \t\tif (type == null)\n 5625 | \t\t\treturn;\n 5626 | \n 5627 | \t\tif (events.length == 0)\n 5628 | \t\t\tevents.push('blur', 'keyup');\n 5629 | \n 5630 | \t\ttry {\n 5631 | \t\t\tconst cbiValidator = validation.create(field, type, optional, vfunc);\n 5632 | \t\t\tconst validatorFn = cbiValidator.validate.bind(cbiValidator);\n 5633 | \n 5634 | \t\t\tfor (let i = 0; i < events.length; i++)\n 5635 | \t\t\t\tfield.addEventListener(events[i], validatorFn);\n 5636 | \n 5637 | \t\t\tvalidatorFn();\n 5638 | \n 5639 | \t\t\treturn validatorFn;\n 5640 | \t\t}\n 5641 | \t\tcatch (e) { }\n 5642 | \t},","lines":20,"link":"https://github.com/openwrt/luci/blob/a8c110bed82375b69eb3881b2e54e617520e8c7d/modules/luci-base/htdocs/luci-static/resources/ui.js#L5623-L5642"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"very_easy","description":"check-controllers.sh emits literal `\\n\\t` sequences via `echo` without `-e`, so the embedded escapes are printed verbatim instead of being rendered as newlines/tabs.","fix":"Use `echo -e` or `printf`.","locations":[{"ref":"build/check-controllers.sh:16-18","code":"   16 | \t\tif ! grep -sqE '\\bmodule[[:space:]]*\\(?[[:space:]]*(\"|\\047|\\[=*\\[)'\"$package\" \"$controller\"; then\n   17 | \t\t\techo \"'$controller' does not contain the expected\\n\\t'module(\\\"$package\\\", ...)' line.\\n\"\n   18 | \t\tfi","lines":3,"link":"https://github.com/openwrt/luci/blob/a8c110bed82375b69eb3881b2e54e617520e8c7d/build/check-controllers.sh#L16-L18"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"wireguard public_key load() function returns four arguments to .then() (`return _('Error getting PublicKey'); }, this)`). The trailing `this` is ignored and the error branch returns a translated user-facing error string as the resolved public key value.","fix":"Throw/return Promise.reject in the failure handler, or stash the error in form state.","locations":[{"ref":"protocols/luci-proto-wireguard/htdocs/luci-static/resources/protocol/wireguard.js:137-147","code":"  137 | \t\to.load = function(section_id) {\n  138 | \t\t\tvar privKey = s.formvalue(section_id, 'private_key') || uci.get('network', section_id, 'private_key');\n  139 | \n  140 | \t\t\treturn getPublicAndPrivateKeyFromPrivate(privKey).then(\n  141 | \t\t\t\tfunction(keypair) {\n  142 | \t\t\t\t\treturn keypair.pub || '';\n  143 | \t\t\t\t},\n  144 | \t\t\t\tfunction(error) {\n  145 | \t\t\t\t\treturn _('Error getting PublicKey');\n  146 | \t\t\t}, this)\n  147 | \t\t};","lines":11,"link":"https://github.com/openwrt/luci/blob/a8c110bed82375b69eb3881b2e54e617520e8c7d/protocols/luci-proto-wireguard/htdocs/luci-static/resources/protocol/wireguard.js#L137-L147"}]},
{"id":"OTHER_1","type":"other","type_label":"Other","severity":"high","difficulty":"very_easy","description":"shellstartsqescape writes to `res` without declaring it local, polluting the global scope. The companion `shellsqescape` has the same `local` missing for `_`.","fix":"Declare local: `local res = string.gsub(value, \"^%-\", \"\\\\-\")` and avoid using `_` as a target without `local _`.","locations":[{"ref":"libs/luci-lib-base/luasrc/util.lua:181-196","code":"  181 | function shellsqescape(value)\n  182 |    local res\n  183 |    res, _ = string.gsub(value, \"'\", \"'\\\\''\")\n  184 |    return res\n  185 | end\n  186 | \n  187 | -- bash, ash and other similar shells interpret a dash (-) at the start\n  188 | -- of a command-line parameters as an option indicator regardless of\n  189 | -- whether it is inside a single-quoted string.  It must be backlash\n  190 | -- escaped to resolve this.  This requires in some funky special-case\n  191 | -- handling.  It may actually be a property of the getopt function\n  192 | -- rather than the shell proper.\n  193 | function shellstartsqescape(value)\n  194 |    res, _ = string.gsub(value, \"^%-\", \"\\\\-\")\n  195 |    return shellsqescape(res)\n  196 | end","lines":16,"link":"https://github.com/openwrt/luci/blob/a8c110bed82375b69eb3881b2e54e617520e8c7d/libs/luci-lib-base/luasrc/util.lua#L181-L196"}]},
{"id":"OTHER_2","type":"other","type_label":"Other","severity":"high","difficulty":"very_easy","description":"`nfct = fd:lines()` is assigned without `local`, creating a global variable that leaks across all calls and modules. Because the iterator wraps `fd`, the previous file handle is also leaked on subsequent invocations.","fix":"Use `local nfct = fd:lines()`.","locations":[{"ref":"modules/luci-lua-runtime/luasrc/sys.lua:281-339","code":"  281 | function net.conntrack(callback)\n  282 | \tlocal ok, fd = pcall(io.open, \"/proc/net/nf_conntrack\")\n  283 | \tif not ok or not fd then\n  284 | \t\tok, fd = pcall(io.popen, \"/usr/sbin/conntrack -L -o extended\", \"r\")\n  285 | \tend\n  286 | \tif not ok or not fd then\n  287 | \t\treturn nil\n  288 | \tend\n  289 | \tnfct = fd:lines()\n  290 | \n  291 | \tlocal line, connt = nil, (not callback) and { }\n  292 | \tfor line in nfct do\n  293 | \t\tlocal fam, l3, l4, rest =\n  294 | \t\t\tline:match(\"^(ipv[46]) +(%d+) +%S+ +(%d+) +(.+)$\")\n  295 | \n  296 | \t\tlocal timeout, tuples = rest:match(\"^(%d+) +(.+)$\")\n  297 | \n  298 | \t\tif not tuples then\n  299 | \t\t\ttuples = rest\n  300 | \t\tend\n  301 | \n  302 | \t\tif fam and l3 and l4 and not tuples:match(\"^TIME_WAIT \") then\n  303 | \t\t\tl4 = nixio.getprotobynumber(l4)\n  304 | \n  305 | \t\t\tlocal entry = {\n  306 | \t\t\t\tbytes = 0,\n  307 | \t\t\t\tpackets = 0,\n  308 | \t\t\t\tlayer3 = fam,\n  309 | \t\t\t\tlayer4 = l4 and l4.name or \"unknown\",\n  310 | \t\t\t\ttimeout = tonumber(timeout, 10)\n  311 | \t\t\t}\n  312 | \n  313 | \t\t\tlocal key, val\n  314 | \t\t\tfor key, val in tuples:gmatch(\"(%w+)=(%S+)\") do\n  315 | \t\t\t\tif key == \"bytes\" or key == \"packets\" then\n  316 | \t\t\t\t\tentry[key] = entry[key] + tonumber(val, 10)\n  317 | \t\t\t\telseif key == \"src\" or key == \"dst\" then\n  318 | \t\t\t\t\tif entry[key] == nil then\n  319 | \t\t\t\t\t\tentry[key] = luci.ip.new(val):string()\n  320 | \t\t\t\t\tend\n  321 | \t\t\t\telseif key == \"sport\" or key == \"dport\" then\n  322 | \t\t\t\t\tif entry[key] == nil then\n  323 | \t\t\t\t\t\tentry[key] = val\n  324 | \t\t\t\t\tend\n  325 | \t\t\t\telseif val then\n  326 | \t\t\t\t\tentry[key] = val\n  327 | \t\t\t\tend\n  328 | \t\t\tend\n  329 | \n  330 | \t\t\tif callback then\n  331 | \t\t\t\tcallback(entry)\n  332 | \t\t\telse\n  333 | \t\t\t\tconnt[#connt+1] = entry\n  334 | \t\t\tend\n  335 | \t\tend\n  336 | \tend\n  337 | \n  338 | \treturn callback and true or connt\n  339 | end","lines":59,"link":"https://github.com/openwrt/luci/blob/a8c110bed82375b69eb3881b2e54e617520e8c7d/modules/luci-lua-runtime/luasrc/sys.lua#L281-L339"}]},
{"id":"OTHER_3","type":"other","type_label":"Other","severity":"medium","difficulty":"medium","description":"User-supplied input from a free-form `<input>` is passed directly as the final positional argument to `ping`/`ping6`/`traceroute`/`traceroute6`/`nslookup`/`arp-scan`. While `fs.exec_direct` does not invoke a shell, an attacker can still inject command-line options (e.g. entering `-f` for ping flood, or `--help`/`-h` writing to stdout).","fix":"Reject inputs starting with `-`, validate against a host/IP regex, or insert `--` to terminate option parsing.","locations":[{"ref":"modules/luci-mod-network/htdocs/luci-static/resources/view/network/diagnostics.js:29-55","code":"   29 | \thandlePing(ev, cmd) {\n   30 | \t\tconst exec = cmd || 'ping';\n   31 | \t\tconst addr = ev.currentTarget.parentNode.previousSibling.value;\n   32 | \t\tconst args = (exec == 'ping') ? [ '-4', '-c', '5', '-W', '1', addr ] : [ '-6', '-c', '5', addr ];\n   33 | \n   34 | \t\treturn this.handleCommand(exec, args);\n   35 | \t},\n   36 | \n   37 | \thandleTraceroute(ev, cmd) {\n   38 | \t\tconst exec = cmd || 'traceroute';\n   39 | \t\tconst addr = ev.currentTarget.parentNode.previousSibling.value;\n   40 | \t\tconst args = (exec == 'traceroute') ? [ '-4', '-q', '1', '-w', '1', '-n', '-m', String(L.env.rpctimeout || 20), addr ] : [ '-q', '1', '-w', '2', '-n', addr ];\n   41 | \n   42 | \t\treturn this.handleCommand(exec, args);\n   43 | \t},\n   44 | \n   45 | \thandleNslookup(ev, cmd) {\n   46 | \t\tconst addr = ev.currentTarget.parentNode.previousSibling.value;\n   47 | \n   48 | \t\treturn this.handleCommand('nslookup', [ addr ]);\n   49 | \t},\n   50 | \n   51 | \thandleArpScan(ev, cmd) {\n   52 | \t\tconst addr = ev.currentTarget.parentNode.previousSibling.value;\n   53 | \n   54 | \t\treturn this.handleCommand('arp-scan', [ '-l', '-I', addr ]);\n   55 | \t},","lines":27,"link":"https://github.com/openwrt/luci/blob/a8c110bed82375b69eb3881b2e54e617520e8c7d/modules/luci-mod-network/htdocs/luci-static/resources/view/network/diagnostics.js#L29-L55"}]},

<div class="filterbar" id="filterbar"></div>

  <div id="progress-bar"><div id="progress-fill"></div></div>
  <span id="progress-text"></span>

  <button class="action-btn" data-action="expand-all">⊞ Expand all</button>

  <button class="action-btn" data-action="download-md-short">&#11015; MD Short</button>
  <button class="action-btn" data-action="download-toml">&#11015; TOML</button>
</div>
