{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"The Windows `CrosstermBackend::supports_true_color` is hardcoded to `false`, unconditionally disabling 24-bit color on the crossterm (Windows) backend. The `termina` backend by contrast reports `self.capabilities.true_color` from actual detection. On modern Windows terminals (e.g. Windows Terminal) this needlessly degrades color output to 256/16-color quantization.","fix":"Detect truecolor support (e.g. via `COLORTERM=truecolor`/`24bit` or a stored capability) and return it, instead of always returning `false`.","locations":[{"ref":"helix-tui/src/backend/crossterm.rs:334-336","code":"  334 |     fn supports_true_color(&self) -> bool {\n  335 |         false\n  336 |     }","lines":3,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-tui/src/backend/crossterm.rs#L334-L336"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`Info::new` computes the box `width` inconsistently and ignores the title. For an empty body it uses `title.len() as u16` (byte length, not display width, so wide/multibyte titles are mis-measured), whereas the non-empty branch uses `l.width()` (display width) computed only from the body lines and never considers the title width. A title wider than every body line yields a box too narrow for its own title.","fix":"Measure the title with `title.width()` in the empty branch, and in the non-empty branch take the max of the body width and `title.width()`, e.g. `width: text.lines().map(|l| l.width()).chain(iter::once(title.width())).max().unwrap() as u16`.","locations":[{"ref":"helix-view/src/info.rs:26-33","code":"   26 |         if body.is_empty() {\n   27 |             return Self {\n   28 |                 height: 1,\n   29 |                 width: title.len() as u16,\n   30 |                 text: \"\".to_string(),\n   31 |                 title,\n   32 |             };\n   33 |         }","lines":8,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-view/src/info.rs#L26-L33"},{"ref":"helix-view/src/info.rs:52-57","code":"   52 |         Self {\n   53 |             title,\n   54 |             width: text.lines().map(|l| l.width()).max().unwrap() as u16,\n   55 |             height: body.len() as u16,\n   56 |             text,\n   57 |         }","lines":6,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-view/src/info.rs#L52-L57"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `typable_commands` the command `name`/`aliases` are escaped with `.replace('|', \"\\\\|\")` via the `cmdify` closure (line 40), but the `doc` column is only newline-escaped (`cmd.doc.replace('\\n', \"<br>\")`, line 49) and never has its `|` escaped. Likewise `static_commands` writes `cmd.doc().to_owned()` (line 111) unescaped. A command whose documentation string contains a literal `|` would be rendered by mdBook as an extra Markdown table column, corrupting the generated `typable-cmd.md`/`static-cmd.md` tables. The explicit escaping comment on the name column shows the pipe hazard was known but not applied to the doc column.","fix":"Escape `|` in the doc column the same way as names, e.g. `let doc = cmd.doc.replace('|', \"\\\\|\").replace('\\n', \"<br>\");` in `typable_commands`, and `cmd.doc().replace('|', \"\\\\|\")` in `static_commands`.","locations":[{"ref":"xtask/src/docgen.rs:49-51","code":"   49 |         let doc = cmd.doc.replace('\\n', \"<br>\");\n   50 | \n   51 |         md.push_str(&md_table_row(&[names.to_owned(), doc.to_owned()]));","lines":3,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/xtask/src/docgen.rs#L49-L51"},{"ref":"xtask/src/docgen.rs:111","code":"  111 |             cmd.doc().to_owned(),","lines":1,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/xtask/src/docgen.rs#L111"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"`find_line_comment` measures the comment token length inconsistently: line 49 uses `token.chars().count()` (`token_len`) for the margin check, but line 59 slices with `pos + token.len()` (byte length) against a char-indexed `RopeSlice`. For any comment token containing multi-byte characters these disagree, so the `fragment != token` comparison would slice too many chars and the block would be misdetected as uncommented. In practice all configured comment tokens are ASCII so `len() == chars().count()` and there is no current impact, but the mixing of byte and char units is a latent bug. The same byte-as-char-offset assumption is repeated in `toggle_line_comments` at line 112.","fix":"Use a char-based length consistently, e.g. reuse `token_len` (already `token.chars().count()`) when slicing: `line_slice.slice(pos..std::cmp::min(pos + token_len, len))`, and likewise base the removal length in `toggle_line_comments` on `token.chars().count()` rather than `token.len()`.","locations":[{"ref":"helix-core/src/comment.rs:49-59","code":"   49 |     let token_len = token.chars().count();\n   50 | \n   51 |     for line in lines {\n   52 |         let line_slice = text.line(line);\n   53 |         if let Some(pos) = line_slice.first_non_whitespace_char() {\n   54 |             let len = line_slice.len_chars();\n   55 | \n   56 |             min = std::cmp::min(min, pos);\n   57 | \n   58 |             // line can be shorter than pos + token len\n   59 |             let fragment = Cow::from(line_slice.slice(pos..std::cmp::min(pos + token.len(), len)));","lines":11,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-core/src/comment.rs#L49-L59"},{"ref":"helix-core/src/comment.rs:112","code":"  112 |             changes.push((pos, pos + token.len() + margin, None));","lines":1,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-core/src/comment.rs#L112"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `helix-tui/src/backend/mod.rs` the Windows `crossterm` backend module and its `CrosstermBackend` re-export are gated behind `feature = \"termina\"` instead of `feature = \"crossterm\"`. This is a copy-paste of the `termina` gating just above it. The Cargo manifest declares both features (`default = [\"termina\", \"crossterm\"]`) and the `crossterm` crate dependency is enabled by the `crossterm` feature, so the module compiles only when `termina` is on. `helix-term` unconditionally uses `CrosstermBackend` on Windows (`application.rs`). Building Windows with `--no-default-features --features crossterm` exports no backend, and `--features termina` (without `crossterm`) tries to compile the module while the `crossterm` crate is absent, causing a build error. Defaults mask the bug.","fix":"Gate the module and export on the correct feature:\n```rust\n#[cfg(all(feature = \"crossterm\", windows))]\nmod crossterm;\n#[cfg(all(feature = \"crossterm\", windows))]\npub use self::crossterm::CrosstermBackend;\n```","locations":[{"ref":"helix-tui/src/backend/mod.rs:17-20","code":"   17 | #[cfg(all(feature = \"termina\", windows))]\n   18 | mod crossterm;\n   19 | #[cfg(all(feature = \"termina\", windows))]\n   20 | pub use self::crossterm::CrosstermBackend;","lines":4,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-tui/src/backend/mod.rs#L17-L20"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`recv_server_message` reads the `Content-Length` header from the adapter and then does `content.resize(content_length, 0)` (lines 121-122) with no upper bound. A buggy or hostile debug adapter can send an absurd `Content-Length` (parsed as `usize`), causing a huge allocation and likely an out-of-memory abort of the whole process before any body bytes are validated.","fix":"Validate `content_length` against a sane maximum before resizing, returning `Error::StreamClosed`/a parse error when it is exceeded, e.g. `if content_length > MAX_MESSAGE_LEN { return Err(...); }` prior to `content.resize(content_length, 0)`.","locations":[{"ref":"helix-dap/src/transport.rs:121-123","code":"  121 |         let content_length = content_length.context(\"missing content length\")?;\n  122 |         content.resize(content_length, 0);\n  123 |         reader.read_exact(content).await?;","lines":3,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-dap/src/transport.rs#L121-L123"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`recv_server_message` parses `Content-Length` into a `usize` and calls `content.resize(content_length, 0)` with no upper bound before reading. A misbehaving or malformed language server that sends a huge `Content-Length` (e.g. `Content-Length: 999999999999`) makes helix attempt a multi-gigabyte/terabyte allocation, aborting or OOM-killing the editor before `read_exact` ever fails. The length should be sanity-checked against a maximum.","fix":"Reject or cap implausible lengths, e.g. after parsing `content_length`, `if content_length > MAX_MESSAGE_LEN { return Err(...); }` before `content.resize(content_length, 0)`, or use a fallible allocation strategy.","locations":[{"ref":"helix-lsp/src/transport.rs:128-144","code":"  128 |                 Some((\"Content-Length\", value)) => {\n  129 |                     content_length = Some(value.parse().context(\"invalid content length\")?);\n  130 |                 }\n  131 |                 Some((_, _)) => {}\n  132 |                 None => {\n  133 |                     // Workaround: Some non-conformant language servers will output logging and other garbage\n  134 |                     // into the same stream as JSON-RPC messages. This can also happen from shell scripts that spawn\n  135 |                     // the server. Skip such lines and log a warning.\n  136 | \n  137 |                     // warn!(\"Failed to parse header: {:?}\", header);\n  138 |                 }\n  139 |             }\n  140 |         }\n  141 | \n  142 |         let content_length = content_length.context(\"missing content length\")?;\n  143 |         content.resize(content_length, 0);\n  144 |         reader.read_exact(content).await?;","lines":17,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-lsp/src/transport.rs#L128-L144"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`handle_response` calls `requests.join_next().await?.unwrap()`. The `.unwrap()` discards a `JoinError`: if any spawned completion task panics or is aborted (e.g. the multi-cursor underflow panic in `word.rs`/`path.rs`), this re-panics inside the completion request task rather than logging and skipping. While tokio isolates the task panic (it does not crash the whole editor), it silently kills the entire completion pipeline for that request and drops all remaining responses.","fix":"Match on the `Result` instead of unwrapping, e.g. `match requests.join_next().await? { Ok(response) => ..., Err(err) => { log::error!(\"completion task failed: {err}\"); continue; } }` so a failed task is logged and the loop continues with the remaining responses.","locations":[{"ref":"helix-term/src/handlers/completion.rs:39-45","code":"   39 |     loop {\n   40 |         let response = requests.join_next().await?.unwrap();\n   41 |         if !is_incomplete && !response.context.is_incomplete && response.items.is_empty() {\n   42 |             continue;\n   43 |         }\n   44 |         return Some(response);\n   45 |     }","lines":7,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-term/src/handlers/completion.rs#L39-L45"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In `Picker::get_preview`, the binary-detection closure reads into the shared `self.read_buffer` and only clears it on the success path: `let n = file.take(1024).read_to_end(&mut self.read_buffer)?; ...; self.read_buffer.clear();`. If `read_to_end` errors, `?` propagates before the `clear()`, leaving partial bytes in `read_buffer`. The next preview call appends to that stale content and then inspects `&self.read_buffer[..n]`, where `n` is only the count read in the new call, so `is_binary` is computed over the stale leading bytes rather than the freshly read data, yielding a wrong binary/text classification. Rare (requires a mid-read IO error) but a real correctness bug.","fix":"Clear the buffer unconditionally, e.g. read into a scratch slice or wrap the read so `self.read_buffer.clear()` runs even on error (clear at the start of the closure, or clear in the `unwrap_or` fallback as well).","locations":[{"ref":"helix-term/src/ui/picker.rs:634-640","code":"  634 |                             let is_binary = std::fs::File::open(&path).and_then(|file| {\n  635 |                                 // Read up to 1kb to detect the content type\n  636 |                                 let n = file.take(1024).read_to_end(&mut self.read_buffer)?;\n  637 |                                 let is_binary = crate::is_binary(&self.read_buffer[..n]);\n  638 |                                 self.read_buffer.clear();\n  639 |                                 Ok(is_binary)\n  640 |                             })?;","lines":7,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-term/src/ui/picker.rs#L634-L640"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"easy","description":"In the Windows `ThreadToken::new`, `token` is declared as a null pointer `let token: *mut HANDLE = std::ptr::null_mut();` and then passed directly as the out-parameter to `OpenThreadToken(..., token)`. `OpenThreadToken`'s last argument is a `*mut HANDLE` output pointer, so on success it writes the opened token handle to address `0` (an access violation), and even if it did not, `Ok(Self(*token))` dereferences the null pointer. The correct pattern stores a `HANDLE` on the stack and passes `&mut token`. This path is reached on Windows from `eaccess` when checking access to a *directory* (e.g. via `readonly()` / `copy_metadata` permission checks), so a common access check crashes the editor.","fix":"Store the handle by value and pass a mutable reference:\n```rust\nlet mut token: HANDLE = std::ptr::null_mut();\nlet err =\n    OpenThreadToken(GetCurrentThread(), TOKEN_DUPLICATE | TOKEN_QUERY, 0, &mut token);\nRevertToSelf();\nif err == 0 {\n    return Err(io::Error::last_os_error());\n}\nOk(Self(token))\n```","locations":[{"ref":"helix-stdx/src/faccess.rs:247-257","code":"  247 |                 let token: *mut HANDLE = std::ptr::null_mut();\n  248 |                 let err =\n  249 |                     OpenThreadToken(GetCurrentThread(), TOKEN_DUPLICATE | TOKEN_QUERY, 0, token);\n  250 | \n  251 |                 RevertToSelf();\n  252 | \n  253 |                 if err == 0 {\n  254 |                     return Err(io::Error::last_os_error());\n  255 |                 }\n  256 | \n  257 |                 Ok(Self(*token))","lines":11,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-stdx/src/faccess.rs#L247-L257"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`workspace_folders` is declared `pub async fn` yet performs no `.await`; it merely locks a `parking_lot::Mutex` and returns the `MutexGuard`. Marking it `async` invites callers to hold the returned guard across `.await` points, and because `parking_lot` mutexes are not async-aware this can block the tokio worker or deadlock. The `async` qualifier serves no purpose here.","fix":"Drop the `async` keyword and make it a plain `pub fn workspace_folders(&self) -> parking_lot::MutexGuard<'_, Vec<lsp::WorkspaceFolder>>`, or return an owned clone of the folder list to avoid holding the lock across awaits.","locations":[{"ref":"helix-lsp/src/client.rs:433-437","code":"  433 |     pub async fn workspace_folders(\n  434 |         &self,\n  435 |     ) -> parking_lot::MutexGuard<'_, Vec<lsp::WorkspaceFolder>> {\n  436 |         self.workspace_folders.lock()\n  437 |     }","lines":5,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-lsp/src/client.rs#L433-L437"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`dap_variables` performs synchronous `block_on` requests on the UI thread inside a loop: one `block_on(debugger.scopes(..))` plus a `block_on(debugger.variables(..))` per scope. This blocks the entire editor until every scope and all its variables have been fetched from the debug adapter, so a debugger that is slow or has many scopes freezes the UI. Other DAP data flows use the async `dap_callback` mechanism; this command does not.","fix":"Move the scope/variable fetching off the UI thread using the existing `dap_callback` pattern (gather scopes then variables asynchronously and build the popup in the editor/compositor callback) instead of sequential `block_on` calls at `helix-term/src/commands/dap.rs:550` and `:569`.","locations":[{"ref":"helix-term/src/commands/dap.rs:550-591","code":"  550 |     let scopes = match block_on(debugger.scopes(frame_id)) {\n  551 |         Ok(s) => s,\n  552 |         Err(e) => {\n  553 |             cx.editor.set_error(format!(\"Failed to get scopes: {}\", e));\n  554 |             return;\n  555 |         }\n  556 |     };\n  557 | \n  558 |     // TODO: allow expanding variables into sub-fields\n  559 |     let mut variables = Vec::new();\n  560 | \n  561 |     let theme = &cx.editor.theme;\n  562 |     let scope_style = theme.get(\"ui.linenr.selected\");\n  563 |     let type_style = theme.get(\"ui.text\");\n  564 |     let text_style = theme.get(\"ui.text.focus\");\n  565 | \n  566 |     for scope in scopes.iter() {\n  567 |         // use helix_view::graphics::Style;\n  568 |         use tui::text::Span;\n  569 |         let response = block_on(debugger.variables(scope.variables_reference));\n  570 | \n  571 |         variables.push(Spans::from(Span::styled(\n  572 |             format!(\"▸ {}\", scope.name),\n  573 |             scope_style,\n  574 |         )));\n  575 | \n  576 |         if let Ok(vars) = response {\n  577 |             variables.reserve(vars.len());\n  578 |             for var in vars {\n  579 |                 let mut spans = Vec::with_capacity(5);\n  580 | \n  581 |                 spans.push(Span::styled(var.name.to_owned(), text_style));\n  582 |                 if let Some(ty) = var.ty {\n  583 |                     spans.push(Span::raw(\": \"));\n  584 |                     spans.push(Span::styled(ty.to_owned(), type_style));\n  585 |                 }\n  586 |                 spans.push(Span::raw(\" = \"));\n  587 |                 spans.push(Span::styled(var.value.to_owned(), text_style));\n  588 |                 variables.push(Spans::from(spans));\n  589 |             }\n  590 |         }\n  591 |     }","lines":42,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-term/src/commands/dap.rs#L550-L591"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`Encoder::encode_from_utf8`'s UTF-16 path (`write_to_buf`) allocates a fresh heap `Vec<u8>` for every single character of the rope via `.collect::<Vec<u8>>()`. When saving a document in a UTF-16 encoding, `to_writer` calls this for every chunk, so each grapheme incurs a heap allocation and free. A `char` encodes to at most 4 bytes, so this can be written into a small stack buffer instead of allocating.","fix":"Encode into a fixed stack array and write bytes directly instead of collecting into a `Vec`, e.g. build the up-to-4-byte little/big-endian sequence in a `[u8; 4]` and copy `character_size` bytes into `dst`, avoiding the per-char `Vec` allocation in `char.encode_utf16(...).iter_mut().flat_map(...).collect::<Vec<u8>>()`.","locations":[{"ref":"helix-view/src/document.rs:399-427","code":"  399 |         let mut write_to_buf = |convert: fn(u16) -> [u8; 2]| {\n  400 |             let to_write = src.char_indices().map(|(indice, char)| {\n  401 |                 let mut encoded: [u16; 2] = [0, 0];\n  402 |                 (\n  403 |                     indice,\n  404 |                     char.encode_utf16(&mut encoded)\n  405 |                         .iter_mut()\n  406 |                         .flat_map(|char| convert(*char))\n  407 |                         .collect::<Vec<u8>>(),\n  408 |                 )\n  409 |             });\n  410 | \n  411 |             let mut total_written = 0usize;\n  412 | \n  413 |             for (indice, utf16_bytes) in to_write {\n  414 |                 let character_size = utf16_bytes.len();\n  415 | \n  416 |                 if dst.len() <= (total_written + character_size) {\n  417 |                     return (encoding::CoderResult::OutputFull, indice, total_written);\n  418 |                 }\n  419 | \n  420 |                 for character in utf16_bytes {\n  421 |                     dst[total_written] = character;\n  422 |                     total_written += 1;\n  423 |                 }\n  424 |             }\n  425 | \n  426 |             (encoding::CoderResult::InputEmpty, src.len(), total_written)\n  427 |         };","lines":29,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-view/src/document.rs#L399-L427"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`diagnostics.sort_by_key(|(d, provider)| (d.severity, d.range.start, provider.clone()))` clones the `DiagnosticProvider` inside the key closure. `slice::sort_by_key` invokes the key function O(n log n) times (it does not cache keys), so the provider is cloned many times per sort rather than once per element. `DiagnosticProvider` is cheap to clone (a `LanguageServerId` plus `Option<Arc<str>>`), so impact is small, but the clone is avoidable in a per-notification path that can carry many diagnostics.","fix":"Compare by reference instead of cloning, e.g. `diagnostics.sort_by(|(d1, p1), (d2, p2)| (d1.severity, d1.range.start, p1).cmp(&(d2.severity, d2.range.start, p2)))`, or use `sort_by_cached_key` if a key must be materialized.","locations":[{"ref":"helix-view/src/handlers/lsp.rs:348","code":"  348 |         diagnostics.sort_by_key(|(d, provider)| (d.severity, d.range.start, provider.clone()));","lines":1,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-view/src/handlers/lsp.rs#L348"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"`Format::max_len` (field at line 80, computed at line 104) is only ever read inside the hand-written `impl PartialEq for Format` (line 124). That `PartialEq`/`Eq` impl is itself never used anywhere (`Format` is only stored in the static `FORMATS` `Vec` and never compared - confirmed by grep). So both the `max_len` field and the `PartialEq`/`Eq` impls are dead code. As a side note the computation is also subtly wrong (it never adds the literal text after the last `%` specifier), which further shows it is unused.","fix":"Remove the `max_len` field from `Format`, the `max_len` accumulation in `Format::new`, and the unused `impl PartialEq for Format` / `impl Eq for Format` blocks. `DateField::max_len` can stay only if it is otherwise used; it currently only feeds the dead `Format::max_len`, so it can be dropped too.","locations":[{"ref":"helix-core/src/increment/date_time.rs:80","code":"   80 |     max_len: usize,","lines":1,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-core/src/increment/date_time.rs#L80"},{"ref":"helix-core/src/increment/date_time.rs:104","code":"  104 |             max_len += field.max_len + remaining[..i].len();","lines":1,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-core/src/increment/date_time.rs#L104"},{"ref":"helix-core/src/increment/date_time.rs:122-128","code":"  122 | impl PartialEq for Format {\n  123 |     fn eq(&self, other: &Self) -> bool {\n  124 |         self.fmt == other.fmt && self.fields == other.fields && self.max_len == other.max_len\n  125 |     }\n  126 | }\n  127 | \n  128 | impl Eq for Format {}","lines":7,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-core/src/increment/date_time.rs#L122-L128"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `move_vertically`, `let line_idx = slice.char_to_line(pos);` at line 126 is an exact recomputation of the identical binding already made at line 117; `pos` is not modified in between, so line 126 is redundant and shadows the earlier value with the same result.","fix":"Remove the duplicate line 126 (`let line_idx = slice.char_to_line(pos);`); the binding from line 117 is still valid and unchanged.","locations":[{"ref":"helix-core/src/movement.rs:117-126","code":"  117 |     let line_idx = slice.char_to_line(pos);\n  118 |     let line_start = slice.line_to_char(line_idx);\n  119 | \n  120 |     // Compute the current position's 2d coordinates.\n  121 |     let visual_pos = visual_offset_from_block(slice, line_start, pos, text_fmt, annotations).0;\n  122 |     let (mut new_row, new_col) = range\n  123 |         .old_visual_position\n  124 |         .map_or((visual_pos.row as u32, visual_pos.col as u32), |pos| pos);\n  125 |     new_row = new_row.max(visual_pos.row as u32);\n  126 |     let line_idx = slice.char_to_line(pos);","lines":10,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-core/src/movement.rs#L117-L126"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `ActiveSnippet::insert_subsnippet` the local `cnt` is initialized to `0` and incremented (`cnt += 1;`) inside the mapping closure but its value is never read afterwards. It is leftover dead code that serves no purpose.","fix":"Remove the unused counter:\n```rust\n// delete line 208\nlet mut cnt = 0;\n// delete line 211 inside the closure\ncnt += 1;\n```","locations":[{"ref":"helix-core/src/snippets/active.rs:208","code":"  208 |         let mut cnt = 0;","lines":1,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-core/src/snippets/active.rs#L208"},{"ref":"helix-core/src/snippets/active.rs:211","code":"  211 |             cnt += 1;","lines":1,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-core/src/snippets/active.rs#L211"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment on `increment` claims `If a DateTime is selected the second will be incremented.`, but the `(true, true)` branch actually adds `Duration::try_minutes(amount)` (line 30), incrementing the **minute**, not the second. The test at line 273 (`\"2021-11-24 07:12:23\", 1 -> \"2021-11-24 07:13:23\"`) confirms minutes are incremented. The comment is stale/misleading.","fix":"Change the comment to match the code:\n\n```\n/// If a DateTime is selected the minute will be incremented.\n```","locations":[{"ref":"helix-core/src/increment/date_time.rs:9","code":"    9 | /// If a DateTime is selected the second will be incremented.","lines":1,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-core/src/increment/date_time.rs#L9"},{"ref":"helix-core/src/increment/date_time.rs:30","code":"   30 |                         .checked_add_signed(Duration::try_minutes(amount)?)?","lines":1,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-core/src/increment/date_time.rs#L30"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The large doc comment at `indent.rs:888-924` (\"Use the syntax tree to determine the indentation for a given position ... The result Indentation is simply the sum of the Indentation for all lines\") describes `treesitter_indent_for_pos`, but it is now physically attached to the private helper `opaque_hit` (the intervening `#[allow(clippy::too_many_arguments)]` at line 925 and the second doc block at 926-930 still all attach to `opaque_hit`). As a result `treesitter_indent_for_pos` (line 978) has lost its documentation, and `opaque_hit` (a 4-argument function) carries a pointless `#[allow(clippy::too_many_arguments)]`. The relocated text is also outdated: it describes the old per-line `all`/`tail` summation algorithm, whereas the current implementation computes indentation via `containment_accounting` (scope containment). This is a refactor artifact.","fix":"Delete the orphaned `#[allow(clippy::too_many_arguments)]` at line 925 (`opaque_hit` has only 4 params), and move the doc block at lines 888-924 back onto `treesitter_indent_for_pos` at line 978, rewriting it to describe the `containment_accounting` scope-containment algorithm rather than the obsolete `all`/`tail` summation.","locations":[{"ref":"helix-core/src/indent.rs:888-935","code":"  888 | /// Use the syntax tree to determine the indentation for a given position.\n  889 | /// This can be used in 2 ways:\n  890 | ///\n  891 | /// - To get the correct indentation for an existing line (new_line=false), not necessarily equal to the current indentation.\n  892 | ///   - In this case, pos should be inside the first tree-sitter node on that line.\n  893 | ///     In most cases, this can just be the first non-whitespace on that line.\n  894 | ///   - To get the indentation for a new line (new_line=true). This behaves like the first usecase if the part of the current line\n  895 | ///     after pos were moved to a new line.\n  896 | ///\n  897 | /// The indentation is determined by traversing all the tree-sitter nodes containing the position.\n  898 | /// Each of these nodes produces some [Indentation] for:\n  899 | ///\n  900 | /// - The line of the (beginning of the) node. This is defined by the scope `all` if this is the first node on its line.\n  901 | /// - The line after the node. This is defined by:\n  902 | ///   - The scope `tail`.\n  903 | ///   - The scope `all` if this node is not the first node on its line.\n  904 | ///\n  905 | /// Intuitively, `all` applies to everything contained in this node while `tail` applies to everything except for the first line of the node.\n  906 | /// The indents from different nodes for the same line are then combined.\n  907 | /// The result [Indentation] is simply the sum of the [Indentation] for all lines.\n  908 | ///\n  909 | /// Specifying which line exactly an [Indentation] applies to is important because indents on the same line combine differently than indents on different lines:\n  910 | /// ```ignore\n  911 | /// some_function(|| {\n  912 | ///     // Both the function parameters as well as the contained block should be indented.\n  913 | ///     // Because they are on the same line, this only yields one indent level\n  914 | /// });\n  915 | /// ```\n  916 | ///\n  917 | /// ```ignore\n  918 | /// some_function(\n  919 | ///     param1,\n  920 | ///     || {\n  921 | ///         // Here we get 2 indent levels because the 'parameters' and the 'block' node begin on different lines\n  922 | ///     },\n  923 | /// );\n  924 | /// ```\n  925 | #[allow(clippy::too_many_arguments)]\n  926 | /// Whether `byte_pos` falls in the interior of an `@opaque` node spanning\n  927 | /// `[start, end)` that began on an *earlier* line — i.e. a string / heredoc /\n  928 | /// block-comment body whose leading whitespace is literal content. Shared by the\n  929 | /// hot path (which collects `@opaque` ranges in the containment pass) and the\n  930 | /// standalone [`is_opaque_interior`].\n  931 | fn opaque_hit(start: u32, end: u32, byte_pos: u32, text: RopeSlice) -> bool {\n  932 |     start <= byte_pos\n  933 |         && byte_pos < end\n  934 |         && text.byte_to_line(start as usize) < text.byte_to_line(byte_pos as usize)\n  935 | }","lines":48,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-core/src/indent.rs#L888-L935"},{"ref":"helix-core/src/indent.rs:977-988","code":"  977 | #[allow(clippy::too_many_arguments)]\n  978 | pub fn treesitter_indent_for_pos<'a>(\n  979 |     query: &IndentQuery,\n  980 |     syntax: &'a Syntax,\n  981 |     loader: &syntax::Loader,\n  982 |     tab_width: usize,\n  983 |     indent_width: usize,\n  984 |     text: RopeSlice<'a>,\n  985 |     line: usize,\n  986 |     pos: usize,\n  987 |     new_line: bool,\n  988 | ) -> Option<Indentation<'a>> {","lines":12,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-core/src/indent.rs#L977-L988"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The doc comment for `ceil_grapheme_boundary` opens with \"Finds the closest byte index not exceeding `byte_idx`\", which describes floor behavior and is copy-pasted from `floor_grapheme_boundary`. The rest of the same comment and the example (`ceil_grapheme_boundary(1) == 2`) correctly describe rounding up to the \"greater / later / right-hand-side boundary\". The first sentence is misleading.","fix":"Change the first sentence to \"Finds the closest byte index not below `byte_idx` which lies on a grapheme cluster boundary.\" (matching the `ceil_char_boundary` wording).","locations":[{"ref":"helix-stdx/src/rope.rs:98-104","code":"   98 |     /// Finds the closest byte index not exceeding `byte_idx` which lies on a grapheme cluster\n   99 |     /// boundary.\n  100 |     ///\n  101 |     /// If `byte_idx` already lies on a grapheme cluster boundary then it is returned as-is. When\n  102 |     /// `byte_idx` lies between two grapheme cluster boundaries, this function returns the byte\n  103 |     /// index of the greater / later / right-hand-side boundary.\n  104 |     ///","lines":7,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-stdx/src/rope.rs#L98-L104"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"`handle_lsp_diagnostics` has a dangling, misplaced comment `// Sort diagnostics first by severity and then by line numbers.` as the last line of the `Entry::Occupied` arm, immediately after the `current_diagnostics` tail expression. No sorting happens there; the real sort (with the same comment) is a few lines below at the `diagnostics.sort_by_key(...)` call. The stray copy is misleading.","fix":"Delete the stray comment. Before:\n```rust\n                current_diagnostics\n                // Sort diagnostics first by severity and then by line numbers.\n            }\n```\nAfter:\n```rust\n                current_diagnostics\n            }\n```","locations":[{"ref":"helix-view/src/handlers/lsp.rs:340-341","code":"  340 |                 current_diagnostics\n  341 |                 // Sort diagnostics first by severity and then by line numbers.","lines":2,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-view/src/handlers/lsp.rs#L340-L341"}]},
{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"negligible","difficulty":"easy","description":"The `file_picker_*` and `file_explorer_*` directory-resolution helpers are near-identical copies. `file_picker_in_current_buffer_directory` and `file_explorer_in_current_buffer_directory` share the exact same `doc_dir`/`cwd` fallback block with only the final `ui::file_picker` vs `ui::file_explorer` call differing; likewise `file_picker_in_current_directory` vs `file_explorer_in_current_directory`. The error message strings differ only by the words `picker`/`explorer`.","fix":"Extract a shared helper that resolves the target directory (buffer parent or cwd, with the error/status handling) and returns `Option<PathBuf>`, then have each command call it and push either `ui::file_picker` or `ui::file_explorer`.","locations":[{"ref":"helix-term/src/commands.rs:3180-3267","code":" 3180 | fn file_picker_in_current_buffer_directory(cx: &mut Context) {\n 3181 |     let doc_dir = doc!(cx.editor)\n 3182 |         .path()\n 3183 |         .and_then(|path| path.parent().map(|path| path.to_path_buf()));\n 3184 | \n 3185 |     let path = match doc_dir {\n 3186 |         Some(path) => path,\n 3187 |         None => {\n 3188 |             let cwd = helix_stdx::env::current_working_dir();\n 3189 |             if !cwd.exists() {\n 3190 |                 cx.editor.set_error(\n 3191 |                     \"Current buffer has no parent and current working directory does not exist\",\n 3192 |                 );\n 3193 |                 return;\n 3194 |             }\n 3195 |             cx.editor.set_error(\n 3196 |                 \"Current buffer has no parent, opening file picker in current working directory\",\n 3197 |             );\n 3198 |             cwd\n 3199 |         }\n 3200 |     };\n 3201 | \n 3202 |     let picker = ui::file_picker(cx.editor, path);\n 3203 |     cx.push_layer(Box::new(overlaid(picker)));\n 3204 | }\n 3205 | \n 3206 | fn file_picker_ {"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"hard","description":"`handle_language_server_message` is a single ~400-line function containing two large nested `match` arms (`Call::Notification` and `Call::MethodCall`), each with deeply nested logic (progress handling, capability registration, show-document, etc.). It mixes protocol dispatch, UI updates (spinners, status), progress bookkeeping and editor mutation in one place, making it hard to test and reason about. Splitting each notification/method-call handler into its own function would reduce coupling.","fix":"Extract per-message handlers (e.g. `handle_progress`, `handle_register_capability`, `handle_show_message_request`) returning the reply/`()` and dispatch to them from a thin `match`.","locations":[{"ref":"helix-term/src/application.rs:777-1189","code":"  777 |     pub async fn handle_language_server_message(\n  778 |         &mut self,\n  779 |         call: helix_lsp::Call,\n  780 |         server_id: LanguageServerId,\n  781 |     ) {\n  782 |         use helix_lsp::{Call, MethodCall, Notification};\n  783 | \n  784 |         macro_rules! language_server {\n  785 |             () => {\n  786 |                 match self.editor.language_server_by_id(server_id) {\n  787 |                     Some(language_server) => language_server,\n  788 |                     None => {\n  789 |                         warn!(\"can't find language server with id `{}`\", server_id);\n  790 |                         return;\n  791 |                     }\n  792 |                 }\n  793 |             };\n  794 |         }\n  795 | \n  796 |         match call {\n  797 |             Call::Notification(helix_lsp::jsonrpc::Notification { method, params, .. }) => {\n  798 |                 let notification = match Notification::parse(&method, params) {\n  799 |                     Ok(notification) => notification,\n  800 |                     Err(helix_lsp::Error::Unhandled) => {"id":"ARCH_3","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"hard","description":"`typed.rs` is a single ~4600-line module that mixes three distinct responsibilities: the implementation of every typable command (`write_impl`, `reload_all`, `get_character_info`, `toggle_option`, shell/DAP/tree-sitter commands, etc.), the giant static `TYPABLE_COMMAND_LIST` registry, and the command-line parsing/completion machinery (`execute_command`, `complete_command_args`, `quote_completion`, `complete_expand`, ...). This makes the file hard to navigate and review and couples unrelated concerns; splitting per-command-group modules (files/buffers, lsp, shell, config, debug) plus a separate command-line/completion module would materially reduce coupling.","fix":"Split `typed.rs` into submodules under `commands/typed/` (e.g. `files.rs`, `lsp.rs`, `shell.rs`, `config.rs`, `debug.rs`) for the command bodies, keep `TYPABLE_COMMAND_LIST` in its own module, and move `complete_command_args`/`quote_completion`/`complete_expand` and friends into a dedicated command-line completion module.","locations":[{"ref":"helix-term/src/commands/typed.rs:1-4608","code":"    1 | use std::fmt::Write;\n    2 | use std::io::BufReader;\n    3 | use std::ops::{self, Deref};\n    4 | \n    5 | use crate::job::Job;\n    6 | \n    7 | use super::*;\n    8 | \n    9 | use helix_core::command_line::{Args, Flag, Signature, Token, TokenKind};\n   10 | use helix_core::fuzzy::fuzzy_match;\n   11 | use helix_core::indent::MAX_INDENT;\n   12 | use helix_core::line_ending;\n   13 | use helix_stdx::path::home_dir;\n   14 | use helix_view::document::{read_to_string, DEFAULT_LANGUAGE_NAME};\n   15 | use helix_view::editor::{CloseError, ConfigEvent};\n   16 | use helix_view::expansion;\n   17 | use serde_json::Value;\n   18 | use ui::completers::{self, Completer};\n   19 | \n   20 | #[derive(Clone)]\n   21 | pub struct TypableCommand {\n   22 |     pub name: &'static str,\n   23 |     pub a {"id":"ARCH_4","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"hard","description":"`picker.rs` is a monstrous 1200-line file and `render_picker` is a single ~200-line method mixing frame drawing, running-count formatting, per-column nucleo match-index highlighting (grapheme walking + span rebuilding), width recalculation, and table/header construction. This concentration of responsibilities makes the highlight/column logic (already annotated with caveats about grapheme-vs-char indexing at lines 789-813) hard to test and maintain.","fix":"Extract the per-cell match highlighting into a helper (e.g. `fn highlight_cell(...) -> (Cell, usize)`), and split preview caching/rendering from the picker frame rendering, so each concern is independently testable.","locations":[{"ref":"helix-term/src/ui/picker.rs:683-880","code":"  683 |     fn render_picker(&mut self, area: Rect, surface: &mut Surface, cx: &mut Context) {\n  684 |         let status = self.matcher.tick(10);\n  685 |         let snapshot = self.matcher.snapshot();\n  686 |         if status.changed {\n  687 |             self.cursor = self\n  688 |                 .cursor\n  689 |                 .min(snapshot.matched_item_count().saturating_sub(1))\n  690 |         }\n  691 | \n  692 |         let text_style = cx.editor.theme.get(\"ui.text\");\n  693 |         let selected = cx.editor.theme.get(\"ui.text.focus\");\n  694 |         let highlight_style = cx.editor.theme.get(\"special\").add_modifier(Modifier::BOLD);\n  695 | \n  696 |         // -- Render the frame:\n  697 |         // clear area\n  698 |         let background = cx.editor.theme.get(\"ui.background\");\n  699 |         surface.clear_with(area, background);\n  700 | \n  701 |         const BLOCK: Block<'_> = Block::bordered();\n  702 | \n  703 |         // calculate the inner area inside the box\n  704 |         let inner = BLOCK.inner(area);\n  705 | \n  706 |         BLOCK.render(area, surface);\n  707 | \n  708 | {"id":"ARCH_5","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"hard","description":"`helix-view/src/document.rs` (~2771 lines) and `helix-view/src/editor.rs` (~2700 lines) are monolithic modules mixing many unrelated responsibilities (encoding/decoding, file IO, save/backup logic, LSP wiring, diagnostics, inlay hints, config structs, event loop, jumplist, cursor cache). In particular `Document::save_impl` is a single ~200-line async function handling parent-dir creation, external-modification detection, symlink/hardlink resolution, atomic backup creation/restoration, fsync error suppression, and LSP notification. This makes the code hard to review and test and concentrates subtle bugs (like the scratch-buffer leak above) in one place.","fix":"Split into focused submodules (e.g. `document/encoding.rs`, `document/save.rs`, `editor/config.rs`) and extract `save_impl`'s backup/restore and modification-check steps into named helper functions returning small result types.","locations":[{"ref":"helix-view/src/document.rs:998-1204","code":"  998 |     fn save_impl(\n  999 |         &mut self,\n 1000 |         path: Option<PathBuf>,\n 1001 |         force: bool,\n 1002 |     ) -> Result<\n 1003 |         impl Future<Output = Result<DocumentSavedEvent, anyhow::Error>> + 'static + Send,\n 1004 |         anyhow::Error,\n 1005 |     > {\n 1006 |         log::debug!(\n 1007 |             \"submitting save of doc '{:?}'\",\n 1008 |             self.path().map(|path| path.to_string_lossy())\n 1009 |         );\n 1010 | \n 1011 |         // we clone and move text + path into the future so that we asynchronously save the current\n 1012 |         // state without blocking any further edits.\n 1013 |         let text = self.text().clone();\n 1014 | \n 1015 |         let path = match path {\n 1016 |             Some(path) => helix_stdx::path::canonicalize(path),\n 1017 |             None => {\n 1018 |                 if self.path.is_none() {\n 1019 |                  .map_err(|e| log::error!(\"Failed to restore backup on write failure: {e}\"));\n 1169 |                 } else {\n 1170 |                     // copy metadata and delete backup\n 1171 |                     let _ = tokio::task::spawn_blocking(move || {\n 1172 |                         let _ = copy_metadata(&backup, &write_path)\n 1173 |                             .map_err(|e| log::error!(\"Failed to copy metadata on write: {e}\"));\n 1174 |                         let _ = std::fs::remove_file(backup)\n 1175 |                             .map_err(|e| log::error!(\"Failed to remove backup file on write: {e}\"));\n 1176 |                     })\n 1177 |                     .await;\n 1178 |                 }\n 1179 |             }\n 1180 | \n 1181 |             write_result?;\n 1182 | \n 1183 |             let event = DocumentSavedEvent {\n 1184 |                 revision: current_rev,\n 1185 |                 save_time,\n 1186 |                 doc_id,\n 1187 |                 path,\n 1188 |                 text: text.clone(),\n 1189 |             };\n 1190 | \n 1191 |             for language_server in language_servers {\n 1192 |                 if !language_server.is_initialized() {\n 1193 |                     continue;\n 1194 |                 }\n 1195 |                 if let Some(id) = identifier.clone() {\n 1196 |                     language_server.text_document_did_save(id, &text);\n 1197 |                 }\n 1198 |             }\n 1199 | \n 1200 |             Ok(event)\n 1201 |         };\n 1202 | \n 1203 |         Ok(future)\n 1204 |     }","lines":207,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-view/src/document.rs#L998-L1204"},{"ref":"helix-view/src/editor.rs:1273-1346","code":" 1273 | pub struct Editor {\n 1274 |     /// Current editing mode.\n 1275 |     pub mode: Mode,\n 1276 |     pub tree: Tree,\n 1277 |     pub next_document_id: DocumentId,\n 1278 |     pub documents: BTreeMap<Do <script>
(function(){
'use strict';

// Data
const FINDINGS     = JSON.parse(document.getElementById('D').textContent);
const PROJECT_INFO = JSON.parse(document.getElementById('PI').textContent);
const SEVS     = ['critical','high','medium','low','negligible'];
const STATUSES = ['open','fixed','wont-fix','false-positive'];
const ALL_TYPES = [...new Set(FINDINGS.map(f => f.type))].sort();
// Build lookup map for O(1) access
const FINDING_BY_ID = new Map(FINDINGS.map(f => [f.id, f]));
// Only severities actually present in the report — the filter bar hides the rest.
const PRESENT_SEVS = SEVS.filter(s => FINDINGS.some(f => (f.severity || 'medium') === s));
// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};
const PRESENT_DIFFS = DIFFICULTY_ORDER.filter(d => FINDINGS.some(f => f.difficulty === d));
const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', searchScope: 'all', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),
};
const statuses = {};

// Persistence
function loadStatuses() {
  try { Object.assign(statuses, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}
}
function saveStatuses() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    if (S.searchScope !== 'all') p.set('qs', S.searchScope);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('qs'))  { S.searchScope = p.get('qs'); }
  document.getElementById('search-scope').classList.toggle('active', S.searchScope === 'locations');
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build a [project] header block from embedded PROJECT_INFO, so the exported
// findings.toml is self-contained (doesn't depend on a sibling project-info.toml
// that a second, separately-triggered download could silently fail to save).
// '' when there is no project info at all.
function buildProjectToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = PROJECT_INFO || {};
  if (!Object.keys(pi).length) return '';
  const lines = ['[project]'];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n\n';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return buildProjectToml() + chunks.join('\n\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystacks per finding (cleared on full re-render).
// Two variants: everything (default), and file/folder paths only - for when a
// search term (e.g. a directory name like 'dlls/abc') also happens to appear
// inside description/fix prose and you only want path matches.
const _hay = new Map();
const _hayLoc = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}
function hayLocOf(f) {
  if (!_hayLoc.has(f.id)) {
    _hayLoc.set(f.id, f.locations.map(l => l.ref).join(' ').toLowerCase());
  }
  return _hayLoc.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (S.searchScope === 'locations') {
      if (!hayLocOf(f).includes(q)) return false;
    } else if (!hayOf(f).includes(q) && !st.includes(q)) {
      return false;
    }
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  _hayLoc.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    // Single download (was two) - a second auto-triggered download is commonly
    // blocked by the browser unless the user explicitly allows it, which silently
    // drops project-info.toml. Embedding [project] in findings.toml itself avoids
    // that failure mode entirely.
    downloadText(buildFindingsToml(), 'findings.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});
document.getElementById('search-scope').addEventListener('click', e => {
  S.searchScope = S.searchScope === 'locations' ? 'all' : 'locations';
  e.currentTarget.classList.toggle('active', S.searchScope === 'locations');
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
