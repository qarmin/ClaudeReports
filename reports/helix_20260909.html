<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"In `injection_base_level`, the `else` branch (cursor line not in the injection layer, i.e. \"typing the first content line from the host boundary\") computes `let mut f = bl + 1;` and only advances `f` while `f + 1 < total`. When `byte_pos` is on the last line of the document (`bl == total - 1`) and that line is not in the layer, the loop body never runs and `f` stays `total`, so the final `indent_level_for_line(text.line(first), ...)` calls `text.line(total)` with `total == text.len_lines()`, which panics with an out-of-bounds line index. This is reachable when a different-language injection sits at end-of-file (e.g. an HTML file ending in `<script>` with no following content) and an indent/new-line indentation is computed there.","fix":"Guard against `first` reaching `text.len_lines()`, e.g. clamp with `let first = f.min(total.saturating_sub(1));` before `indent_level_for_line(text.line(first), ...)`, or bail out returning `0` when no in-layer content line is found.","locations":[{"ref":"helix-core/src/indent.rs:1223-1233","code":" 1223 |     } else {\n 1224 |         // Typing the first content line from the host boundary (e.g. just after\n 1225 |         // `<script>`): the injection begins on a following line.\n 1226 |         let total = text.len_lines();\n 1227 |         let mut f = bl + 1;\n 1228 |         while f + 1 < total && !in_layer(f) {\n 1229 |             f += 1;\n 1230 |         }\n 1231 |         f\n 1232 |     };\n 1233 |     indent_level_for_line(text.line(first), tab_width, indent_width)","lines":11,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-core/src/indent.rs#L1223-L1233"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`rainbow_highlights` computes `Highlight::new((scope_stack.len() % rainbow_length) as u32)` without ensuring `rainbow_length != 0`. The value comes from `Theme::rainbow_length()`, which is `0` whenever the theme defines an empty `rainbow = []` array (in `helix-view/src/theme.rs`, `parse_style_array` returns `Ok(vec![])`, so the `default_rainbow()` fallback is not used and the counter stays `0`). With such a theme and rainbow brackets enabled, `EditorView::doc_rainbow_highlights` calls this unconditionally on every render, and `% 0` panics (`attempt to calculate the remainder with a divisor of zero`), crashing the editor on each frame.","fix":"Guard against a zero divisor, e.g. bail out early when `rainbow_length == 0`:\n```rust\nif rainbow_length == 0 {\n    return OverlayHighlights::Heterogenous { highlights: Vec::new() };\n}\n```\nor clamp with `let rainbow_length = rainbow_length.max(1);` before the loop.","locations":[{"ref":"helix-core/src/syntax.rs:681","code":"  681 |                     highlight: Highlight::new((scope_stack.len() % rainbow_length) as u32),","lines":1,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-core/src/syntax.rs#L681"},{"ref":"helix-core/src/syntax.rs:630-701","code":"  630 |     pub fn rainbow_highlights(\n  631 |         &self,\n  632 |         source: RopeSlice,\n  633 |         rainbow_length: usize,\n  634 |         loader: &Loader,\n  635 |         range: impl RangeBounds<u32>,\n  636 |     ) -> OverlayHighlights {\n  637 |         struct RainbowScope<'tree> {\n  638 |             end: u32,\n  639 |             node: Option<Node<'tree>>,\n  640 |             highlight: Highlight,\n  641 |         }\n  642 | \n  643 |         let mut scope_stack = Vec::<RainbowScope>::new();\n  644 |         let mut highlights = Vec::new();\n  645 |         let mut query_iter = self.query_iter::<_, (), _>(\n  646 |             source,\n  647 |             |lang| loader.rainbow_query(lang).map(|q| &q.query),\n  648 |             range,\n  649 |         );\n  650 | \n  651 |         while let Some(event) = query_iter.next() {\n  652 |             let QueryIterEvent::Match(mat) = event else {\n  653 |                 continue;\n  654 |             };\n  655 | \n  656 |             let rainbow_query = loader\n  657 |                 .rainbow_query(query_iter.current_language())\n  658 |                 .expect(\"language must have a rainbow query to emit matches\");\n  659 | \n  660 |             let byte_range = mat.node.byte_range();\n  661 |             // Pop any scopes that end before this capture begins.\n  662 |             while scope_stack\n  663 |                 .last()\n  664 |                 .is_some_and(|scope| byte_range.start >= scope.end)\n  665 |             {\n  666 |                 scope_stack.pop();\n  667 |             }\n  668 | \n  669 |             let capture = Some(mat.capture);\n  670 |             if capture == rainbow_query.scope_capture {\n  671 |                 scope_stack.push(RainbowScope {\n  672 |                     end: byte_range.end,\n  673 |                     node: if rainbow_query\n  674 |                         .include_children_patterns\n  675 |                         .contains(&mat.pattern)\n  676 |                     {\n  677 |                         None\n  678 |                     } else {\n  679 |                         Some(mat.node.clone())\n  680 |                     },\n  681 |                     highlight: Highlight::new((scope_stack.len() % rainbow_length) as u32),\n  682 |                 });\n  683 |             } else if capture == rainbow_query.bracket_capture {\n  684 |                 if let Some(scope) = scope_stack.last() {\n  685 |                     if !scope\n  686 |                         .node\n  687 |                         .as_ref()\n  688 |                         .is_some_and(|node| mat.node.parent().as_ref() != Some(node))\n  689 |                     {\n  690 |                         let start = source\n  691 |                             .byte_to_char(source.floor_char_boundary(byte_range.start as usize));\n  692 |                         let end =\n  693 |                             source.byte_to_char(source.ceil_char_boundary(byte_range.end as usize));\n  694 |                         highlights.push((scope.highlight, start..end));\n  695 |                     }\n  696 |                 }\n  697 |             }\n  698 |         }\n  699 | \n  700 |         OverlayHighlights::Heterogenous { highlights }\n  701 |     }","lines":72,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-core/src/syntax.rs#L630-L701"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"A misbehaving/buggy debug adapter can crash the client's message-pump task. In `transport.rs::process_server_message`, a `Payload::Response` whose `request_seq` is not present in `pending_requests` (e.g. a duplicate response for a `seq` already consumed, or an unsolicited response) is forwarded verbatim to the client: `client_tx.send(Payload::Response(res))` (line 223). That message is then received in `client.rs::recv`, whose match arm `Payload::Response(_) => unreachable!()` (line 217) panics. Because the panic occurs inside the `tokio::spawn(Self::recv(...))` task, it silently kills the client's event/response loop, leaving the debugger permanently unresponsive.","fix":"Do not forward unmatched responses as `Payload::Response` into the client channel, or handle `Payload::Response` gracefully in `client.rs::recv` instead of `unreachable!()`. E.g. in `client.rs` replace `Payload::Response(_) => unreachable!()` with a `log::error!` that drops the stray response, or in `transport.rs` drop the response after the existing `warn!(\"Response to nonexistent request #{}\", ...)` rather than sending it downstream.","locations":[{"ref":"helix-dap/src/transport.rs:221-224","code":"  221 |                     None => {\n  222 |                         warn!(\"Response to nonexistent request #{}\", res.request_seq);\n  223 |                         client_tx.send(Payload::Response(res)).expect(\"Failed to send\");\n  224 |                     }","lines":4,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-dap/src/transport.rs#L221-L224"},{"ref":"helix-dap/src/client.rs:210-224","code":"  210 |         while let Some(msg) = server_rx.recv().await {\n  211 |             match msg {\n  212 |                 Payload::Event(ev) => {\n  213 |                     client_tx\n  214 |                         .send((id, Payload::Event(ev)))\n  215 |                         .expect(\"Failed to send\");\n  216 |                 }\n  217 |                 Payload::Response(_) => unreachable!(),\n  218 |                 Payload::Request(req) => {\n  219 |                     client_tx\n  220 |                         .send((id, Payload::Request(req)))\n  221 |                         .expect(\"Failed to send\");\n  222 |                 }\n  223 |             }\n  224 |         }","lines":15,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-dap/src/client.rs#L210-L224"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`dap_switch_stack_frame` indexes the `stack_frames` map directly with `debugger.stack_frames[&thread_id]`. This uses the `Index` impl for `HashMap`, which panics if `thread_id` is present as the active thread but has no entry in `stack_frames` (e.g. the thread is stopped/active but stack frames have not been fetched or were cleared). The sibling command `dap_variables` handles exactly this case gracefully via `debugger.stack_frames.get(&thread_id)` at `helix-term/src/commands/dap.rs:531-538`, so this is an inconsistent, reachable panic triggered by a user keybind.","fix":"Replace the panicking index with a checked lookup, mirroring `dap_variables`:\n```rust\nlet frames = match debugger.stack_frames.get(&thread_id) {\n    Some(frames) => frames.iter().cloned().enumerate().collect::<Vec<_>>(),\n    None => {\n        cx.editor.set_error(\"No stack frames available for the active thread\");\n        return;\n    }\n};\n```","locations":[{"ref":"helix-term/src/commands/dap.rs:752-756","code":"  752 |     let frames = debugger.stack_frames[&thread_id]\n  753 |         .iter()\n  754 |         .cloned()\n  755 |         .enumerate()\n  756 |         .collect::<Vec<_>>();","lines":5,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-term/src/commands/dap.rs#L752-L756"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`tcp_process` calls `let port = Self::get_port().await.unwrap();` (line 171). `get_port` returns `Option<u16>` and yields `None` whenever binding `127.0.0.1:0` or reading `local_addr()` fails (e.g. restricted/sandboxed network environments). The `unwrap()` turns that recoverable I/O failure into a panic instead of returning the `Result::Err` the function already supports.","fix":"Propagate the error instead of panicking, e.g. `let port = Self::get_port().await.ok_or_else(|| Error::Other(anyhow!(\"could not find a free port for the debug adapter\")))?;` (and have `get_port` return a `Result` or map the `None`).","locations":[{"ref":"helix-dap/src/client.rs:171","code":"  171 |         let port = Self::get_port().await.unwrap();","lines":1,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-dap/src/client.rs#L171"},{"ref":"helix-dap/src/client.rs:147-159","code":"  147 |     async fn get_port() -> Option<u16> {\n  148 |         Some(\n  149 |             tokio::net::TcpListener::bind(SocketAddr::new(\n  150 |                 IpAddr::V4(Ipv4Addr::new(127, 0, 0, 1)),\n  151 |                 0,\n  152 |             ))\n  153 |             .await\n  154 |             .ok()?\n  155 |             .local_addr()\n  156 |             .ok()?\n  157 |             .port(),\n  158 |         )\n  159 |     }","lines":13,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-dap/src/client.rs#L147-L159"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`symbol_picker` calls `doc.uri().expect(\"docs with active language servers must be backed by paths\")`. This relies on the invariant that any document with an attached language server has a path. Scratch buffers (no path) can have a language assigned, and the expectation is an assumption about server-attachment policy rather than a guarantee enforced at this call site, so a document with a symbol-capable server but no URI would panic the command.","fix":"Return early with a status/error instead of `expect`, e.g. `let Some(doc_uri) = doc.uri() else { cx.editor.set_error(\"Document has no path\"); return; };` before building the futures.","locations":[{"ref":"helix-term/src/commands/lsp.rs:357-359","code":"  357 |             let doc_uri = doc\n  358 |                 .uri()\n  359 |                 .expect(\"docs with active language servers must be backed by paths\");","lines":3,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-term/src/commands/lsp.rs#L357-L359"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"In `syntax_workspace_symbol_picker`'s selection callback, a `UriOrDocumentId::Uri` is unwrapped to a path with `uri.as_path().expect(\"\")`. If the URI has no filesystem path (`as_path()` returns `None`), this panics with an empty, uninformative message. While tags produced from the filesystem walk always come from `Uri::from(path::normalize(path))`, tags from open documents (`doc.uri()`, `helix-term/src/commands/syntax.rs:319-322`) are not guaranteed to be path-backed, so a non-file URI reaching this branch panics.","fix":"Handle the `None` case instead of `expect`:\n```rust\nUriOrDocumentId::Uri(uri) => {\n    let Some(path) = uri.as_path() else {\n        cx.editor.set_error(format!(\"Cannot open non-file URI: {uri:?}\"));\n        return;\n    };\n    match cx.editor.open(path, action) { /* ... */ }\n}\n```","locations":[{"ref":"helix-term/src/commands/syntax.rs:434-442","code":"  434 |                 UriOrDocumentId::Uri(uri) => match cx.editor.open(uri.as_path().expect(\"\"), action) {\n  435 |                     Ok(id) => id,\n  436 |                     Err(e) => {\n  437 |                         cx.editor\n  438 |                             .set_error(format!(\"Failed to open file '{uri:?}': {e}\"));\n  439 |                         return;\n  440 |                     }\n  441 |                 }\n  442 |             };","lines":9,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-term/src/commands/syntax.rs#L434-L442"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`debug_eval` indexes `debugger.stack_frames[&thread_id][frame]`. The `HashMap` index panics if `thread_id` is not present in `stack_frames`, and the `Vec` index panics if `frame` is out of range. `active_frame`/`thread_id` can be stale relative to `stack_frames` (e.g. after a thread exits or frames are cleared), so `:debug-eval` can panic and crash the editor for an inconsistent debug-adapter state.","fix":"Look the values up fallibly, e.g. `let frame_id = debugger.stack_frames.get(&thread_id).and_then(|frames| frames.get(frame)).map(|f| f.id).context(\"Cannot find current stack frame\")?;` instead of using panicking index operators.","locations":[{"ref":"helix-term/src/commands/typed.rs:2130-2141","code":" 2130 |     if let Some(debugger) = cx.editor.debug_adapters.get_active_client() {\n 2131 |         let (frame, thread_id) = match (debugger.active_frame, debugger.thread_id) {\n 2132 |             (Some(frame), Some(thread_id)) => (frame, thread_id),\n 2133 |             _ => {\n 2134 |                 bail!(\"Cannot find current stack frame to access variables\")\n 2135 |             }\n 2136 |         };\n 2137 | \n 2138 |         // TODO: support no frame_id\n 2139 | \n 2140 |         let frame_id = debugger.stack_frames[&thread_id][frame].id;\n 2141 |         let response = helix_lsp::block_on(debugger.eval(args.join(\" \"), Some(frame_id)))?;","lines":12,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-term/src/commands/typed.rs#L2130-L2141"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`toggle_option` indexes `&values[0]` after building `values` from user input. For a `Value::String` config key, `values` is produced by `command_line::Tokenizer::new(&args[1], true)`, and for `Value::Number`/`Array`/`Object` keys by `serde_json::Deserializer::from_str(&args[1])`. When the second positional argument is empty (reachable via e.g. `:toggle statusline.separator ''` or a trailing empty raw arg), tokenizing/parsing yields an empty `values` vector, so `values[0]` / `&values[0]` panics and crashes the editor instead of returning a command error.","fix":"After collecting `values`, `ensure!(!values.is_empty(), \"no values provided to toggle\")` (or use `values.first()` with a `?`/`context`) before indexing, so empty input becomes a recoverable command error rather than a panic.","locations":[{"ref":"helix-term/src/commands/typed.rs:2347-2354","code":" 2347 |             Value::String(\n 2348 |                 values\n 2349 |                     .iter()\n 2350 |                     .skip_while(|e| *e != value)\n 2351 |                     .nth(1)\n 2352 |                     .map(AsRef::as_ref)\n 2353 |                     .unwrap_or_else(|| &values[0])\n 2354 |                     .to_string(),","lines":8,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-term/src/commands/typed.rs#L2347-L2354"},{"ref":"helix-term/src/commands/typed.rs:2383-2388","code":" 2383 |             values\n 2384 |                 .iter()\n 2385 |                 .skip_while(|e| *e != value)\n 2386 |                 .nth(1)\n 2387 |                 .unwrap_or(&values[0])\n 2388 |                 .clone()","lines":6,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-term/src/commands/typed.rs#L2383-L2388"}]},
{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`language()` builds spelling suggestions with `l.language_id.starts_with(lang_str.chars().next().unwrap())`. When the health command is invoked with an empty language argument (e.g. `hx --health \"\"`), `lang_str` is empty, `chars().next()` is `None`, and `.unwrap()` panics, aborting the CLI health check.","fix":"Guard the first char: `if let Some(first) = lang_str.chars().next() { ... l.language_id.starts_with(first) ... }`, skipping suggestions when the input is empty.","locations":[{"ref":"helix-term/src/health.rs:317","code":"  317 |                 .filter(|l| l.language_id.starts_with(lang_str.chars().next().unwrap()))","lines":1,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-term/src/health.rs#L317"}]},
{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`Menu::move_up`, `move_down`, `move_half_page_up`, and `move_half_page_down` all end with `... % len` where `len = self.matches.len()`. When `matches` is empty this is a remainder-by-zero and panics (e.g. `move_up` computes `self.cursor.map_or(max_index, |i| (i + max_index) % len) % len` = `0 % 0`). Currently masked: the completion handler calls `clear_completion` whenever the menu becomes empty (`handlers/completion.rs`), and `Select` asserts a non-empty option list, so navigation never reaches an empty menu today. Still a latent crash on these public methods with no defensive guard.","fix":"Guard against an empty match set, e.g. add `if self.matches.is_empty() { return; }` at the top of each `move_*` method (or a single early-return in `handle_event` before dispatching navigation keys).","locations":[{"ref":"helix-term/src/ui/menu.rs:99-130","code":"   99 |     pub fn move_up(&mut self) {\n  100 |         let len = self.matches.len();\n  101 |         let max_index = len.saturating_sub(1);\n  102 |         let pos = self.cursor.map_or(max_index, |i| (i + max_index) % len) % len;\n  103 |         self.cursor = Some(pos);\n  104 |         self.adjust_scroll();\n  105 |     }\n  106 | \n  107 |     pub fn move_half_page_up(&mut self) {\n  108 |         let len = self.matches.len();\n  109 |         let max_index = len.saturating_sub((self.size.1 as usize / 2).max(1));\n  110 |         let pos = self.cursor.map_or(max_index, |i| (i + max_index) % len) % len;\n  111 |         self.cursor = Some(pos);\n  112 |         self.adjust_scroll();\n  113 |     }\n  114 | \n  115 |     pub fn move_down(&mut self) {\n  116 |         let len = self.matches.len();\n  117 |         let pos = self.cursor.map_or(0, |i| i + 1) % len;\n  118 |         self.cursor = Some(pos);\n  119 |         self.adjust_scroll();\n  120 |     }\n  121 | \n  122 |     pub fn move_half_page_down(&mut self) {\n  123 |         let len = self.matches.len();\n  124 |         let pos = self\n  125 |             .cursor\n  126 |             .map_or(0, |i| i + (self.size.1 as usize / 2).max(1))\n  127 |             % len;\n  128 |         self.cursor = Some(pos);\n  129 |         self.adjust_scroll();\n  130 |     }","lines":32,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-term/src/ui/menu.rs#L99-L130"}]},
{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In `handle_debugger_message`, `Payload::Response(_) => unreachable!()` will panic (crashing the editor) if the debug adapter ever routes a `Response` payload to this handler. This relies on an upstream invariant (responses being matched to pending request futures in the transport). A protocol-violating or out-of-sequence response from an external DAP server would turn into a hard crash rather than being logged and dropped like other unexpected inputs in this function.","fix":"Replace the `unreachable!()` with defensive handling, e.g. `Payload::Response(_) => log::warn!(\"Discarding unexpected DAP response payload\")` (then fall through to `return true`/`false` as appropriate), matching how unknown events are already handled.","locations":[{"ref":"helix-view/src/handlers/dap.rs:483","code":"  483 |             Payload::Response(_) => unreachable!(),","lines":1,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-view/src/handlers/dap.rs#L483"}]},
{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`Tree::next` and `Tree::prev` fall back to `self.traverse().next().unwrap()` / `self.traverse().next_back().unwrap()` (lines 563, 582). `Traverse` yields nothing when the tree contains no views (root container empty), so calling `next()`/`prev()` on an empty tree panics. In normal operation the editor keeps at least one view (a scratch buffer) so this is not currently hit, but these are `pub` methods with no documented precondition, making the panic a latent hazard for callers.","fix":"Return `self.focus` (or make the methods return `Option<ViewId>`) when the traversal is empty instead of `.unwrap()`, e.g. `self.traverse().next().map_or(self.focus, |(key, _)| key)`.","locations":[{"ref":"helix-view/src/tree.rs:559-565","code":"  559 |         if let Some((id, _)) = views.next() {\n  560 |             id\n  561 |         } else {\n  562 |             // extremely crude, take the last item\n  563 |             let (key, _) = self.traverse().next_back().unwrap();\n  564 |             key\n  565 |         }","lines":7,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-view/src/tree.rs#L559-L565"},{"ref":"helix-view/src/tree.rs:578-584","code":"  578 |         if let Some((id, _)) = views.next() {\n  579 |             id\n  580 |         } else {\n  581 |             // extremely crude, take the first item again\n  582 |             let (key, _) = self.traverse().next().unwrap();\n  583 |             key\n  584 |         }","lines":7,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-view/src/tree.rs#L578-L584"}]},
{"id":"PANIC_14","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`find_files` calls `std::fs::read_dir(dir).unwrap()` (line 24) and `ts_lang_support` calls `f.strip_prefix(&queries_dir).unwrap()` and `tail.components().next().unwrap()` (lines 15-16). These panic (with an opaque backtrace rather than a clear diagnostic) if the runtime queries directory is missing/unreadable or if a matched path lies outside `queries_dir`. This is dev-only `xtask` tooling so impact is limited to `cargo xtask docgen` aborting, but the failure mode is a raw panic instead of an actionable error.","fix":"Propagate a `DynError`/`Result` (the caller `lang_features` already returns `Result`) or at least `.expect(\"runtime/queries not found\")` with a message pointing at the expected path, instead of bare `.unwrap()`.","locations":[{"ref":"xtask/src/helpers.rs:23-24","code":"   23 | pub fn find_files(dir: &Path, filename: &str) -> Vec<PathBuf> {\n   24 |     std::fs::read_dir(dir)","lines":2,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/xtask/src/helpers.rs#L23-L24"},{"ref":"xtask/src/helpers.rs:15-16","code":"   15 |             let tail = f.strip_prefix(&queries_dir).unwrap(); // python/highlights.scm\n   16 |             let lang = tail.components().next().unwrap(); // python","lines":2,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/xtask/src/helpers.rs#L15-L16"}]},
{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"In `Registry::start_client`, the client's receiver stream is pushed into `self.incoming` (`self.incoming.push(UnboundedReceiverStream::new(receiver))`, line 51) *before* `block_on(client.initialize(...))` (line 54). If `initialize` (or the following `?`) fails, the closure returns `Err`, so `try_insert_with_key` does not insert the `Client` into `self.inner` - but the receiver stream has already been registered in the `SelectAll` and is never removed. This leaves a dangling stream (tied to a `DebugAdapterId` that no client is registered under) accumulating in `incoming` for every failed startup.","fix":"Only push the receiver into `self.incoming` after the client has been fully initialized and is guaranteed to be inserted, or remove/avoid registering the stream on the error path (e.g. build and initialize the client first, then push the receiver just before `Ok(client)`).","locations":[{"ref":"helix-dap/src/registry.rs:38-59","code":"   38 |         self.inner.try_insert_with_key(|id| {\n   39 |             let result = match socket {\n   40 |                 Some(socket) => block_on(Client::tcp(socket, id)),\n   41 |                 None => block_on(Client::process(\n   42 |                     &config.transport,\n   43 |                     &config.command,\n   44 |                     config.args.iter().map(|arg| arg.as_str()).collect(),\n   45 |                     config.port_arg.as_deref(),\n   46 |                     id,\n   47 |                 )),\n   48 |             };\n   49 | \n   50 |             let (mut client, receiver) = result?;\n   51 |             self.incoming.push(UnboundedReceiverStream::new(receiver));\n   52 | \n   53 |             client.config = Some(config.clone());\n   54 |             block_on(client.initialize(config.name.clone()))?;\n   55 |             client.quirks = config.quirks.clone();\n   56 | \n   57 |             Ok(client)\n   58 |         })\n   59 |     }","lines":22,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-dap/src/registry.rs#L38-L59"}]},
{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"very_easy","description":"In `Editor::switch` with `Action::Replace`, when an empty scratch buffer is dropped the document is removed from `self.documents` and from the views, but its entry in `self.saves` (the save-channel sender) and the corresponding stream in `self.save_queue` are never removed. Because the sender is never dropped, the channel stays open and its flattened stream in the `SelectAll` remains pending forever. `Editor::close_document` correctly does `self.saves.remove(&doc_id)`; this path forgets to. Repeatedly creating scratch buffers and switching away leaks a sender + a permanently-pending stream per removed buffer over a session.","fix":"After `self.documents.remove(&id);` also drop the save channel so the stream completes:\n```rust\nlet id = doc.id;\nself.documents.remove(&id);\nself.saves.remove(&id);\n```\nMirroring `close_document`.","locations":[{"ref":"helix-view/src/editor.rs:1972-1981","code":" 1972 |                 if remove_empty_scratch {\n 1973 |                     // Copy `doc.id` into a variable before calling `self.documents.remove`, which requires a mutable\n 1974 |                     // borrow, invalidating direct access to `doc.id`.\n 1975 |                     let id = doc.id;\n 1976 |                     self.documents.remove(&id);\n 1977 | \n 1978 |                     // Remove the scratch buffer from any jumplists\n 1979 |                     for (view, _) in self.tree.views_mut() {\n 1980 |                         view.remove_document(&id);\n 1981 |                     }","lines":10,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-view/src/editor.rs#L1972-L1981"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"very_easy","description":"In `find_nth_closest_pairs_ts` the expression `range.to() - 1` can underflow. When the tree-sitter path is taken (a language grammar is active) and the selection range is a cursor at the very start of the document, `range.to()` is `0`, so `range.to() - 1` panics in debug builds (`attempt to subtract with overflow`). In release builds it wraps to `usize::MAX`, making the condition `closing < range.to() - 1` almost always true so the loop takes the \"partially inside\" branch without ever decrementing `skip`, which can spin the loop. The equivalent plain-text implementation already guards this with `saturating_sub` (see `surround.rs:99` and `surround.rs:134`), so the TS branch is inconsistent. Reachable via a surround command (e.g. auto-detect `find_nth_closest_pairs_pos`) with the cursor at position `0` while syntax is loaded.","fix":"Mirror the plain implementation and use a saturating subtraction:\n```rust\n// before\nif range.from() < opening || closing < range.to() - 1 {\n// after\nif range.from() < opening || closing < range.to().saturating_sub(1) {\n```","locations":[{"ref":"helix-core/src/surround.rs:74","code":"   74 |         if range.from() < opening || closing < range.to() - 1 {","lines":1,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-core/src/surround.rs#L74"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"In both the word and path completion builders the replacement transaction is built for every selection range via `Transaction::change_by_selection`, computing the delete range as `(cursor - edit_diff, cursor, ...)`. `edit_diff` is derived from the primary cursor's word/typed-file-name length, but it is subtracted from EACH range's `cursor`. With multiple cursors, a secondary cursor can have fewer than `edit_diff` characters before it (e.g. the primary word spans pre-existing text like `foo`+typed `bar` => `edit_diff = 6`, while a secondary cursor near the buffer start only has 4 chars before it). `cursor - edit_diff` then underflows: in debug this panics, and in release it wraps to a huge `usize` producing an invalid `from > to` change that panics inside `Transaction`/rope. These closures run in `spawn_blocking`, so the panic surfaces as a `JoinError` unwrapped in `handle_response` (see the related finding). The fix is to guard against `cursor < edit_diff`.","fix":"Compute the start with a saturating subtraction (or skip ranges where `cursor < edit_diff`). E.g. in `word.rs` change `let cursor = range.cursor(text); (cursor - edit_diff, cursor, Some((&word).into()))` to use `cursor.saturating_sub(edit_diff)`, and likewise in `path.rs` replace `(cursor - edit_diff, cursor, ...)` with `(cursor.saturating_sub(edit_diff), cursor, ...)`.","locations":[{"ref":"helix-term/src/handlers/completion/word.rs:80-83","code":"   80 |                 let transaction = Transaction::change_by_selection(&rope, &selection, |range| {\n   81 |                     let cursor = range.cursor(text);\n   82 |                     (cursor - edit_diff, cursor, Some((&word).into()))\n   83 |                 });","lines":4,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-term/src/handlers/completion/word.rs#L80-L83"},{"ref":"helix-term/src/handlers/completion/path.rs:107-110","code":"  107 |                 let transaction = Transaction::change_by_selection(&text, &selection, |range| {\n  108 |                     let cursor = range.cursor(text.slice(..));\n  109 |                     (cursor - edit_diff, cursor, Some((&file_name).into()))\n  110 |                 });","lines":4,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-term/src/handlers/completion/path.rs#L107-L110"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"In `Tree::recalculate`, the `Layout::Vertical` branch computes the last child's width as `area.width = container.area.x + container.area.width - area.x` (line 432). `area.x` for each child advances by `width + inner_gap` where `width = used_area / len_u16` and `used_area = area.width.saturating_sub(total_gap)`. When the container is narrower than the number of children (a very narrow terminal with many vertical splits), `width` rounds down to `0`, so `child_x` advances by only `inner_gap` (`1`) per child, leaving the last child's `area.x` at `start + (len - 1)`. If `len - 1 > container.area.width`, then `container.area.x + container.area.width - area.x` underflows: it panics in debug builds and wraps to a huge `u16` (~`65530`) in release builds, producing a bogus render width. This is reachable by repeatedly issuing vertical splits (e.g. `C-w v`) in a sufficiently narrow window. The `Layout::Horizontal` branch is safe because it uses no inter-child gap, so `(len-1)*height <= area.height` always holds.","fix":"Clamp the last child's dimension with a saturating subtraction so an over-subscribed container cannot underflow. Replace line 432 with `area.width = (container.area.x + container.area.width).saturating_sub(area.x);` (and defensively apply the same `saturating_sub` to the `Layout::Horizontal` `area.height` correction on line 402). Ideally also fix the gap accounting on line 413 (`len_u16.saturating_sub(2)` under-counts the `len - 1` gaps actually applied by the loop, which is what lets the cumulative `child_x` outrun the container width).","locations":[{"ref":"helix-view/src/tree.rs:408-436","code":"  408 |                         Layout::Vertical => {\n  409 |                             let len = container.children.len();\n  410 |                             let len_u16 = len as u16;\n  411 | \n  412 |                             let inner_gap = 1u16;\n  413 |                             let total_gap = inner_gap * len_u16.saturating_sub(2);\n  414 | \n  415 |                             let used_area = area.width.saturating_sub(total_gap);\n  416 |                             let width = used_area / len_u16;\n  417 | \n  418 |                             let mut child_x = area.x;\n  419 | \n  420 |                             for (i, child) in container.children.iter().enumerate() {\n  421 |                                 let mut area = Rect::new(\n  422 |                                     child_x,\n  423 |                                     container.area.y,\n  424 |                                     width,\n  425 |                                     container.area.height,\n  426 |                                 );\n  427 |                                 child_x += width + inner_gap;\n  428 | \n  429 |                                 // last child takes the remaining width because we can get uneven\n  430 |                                 // space from rounding\n  431 |                                 if i == len - 1 {\n  432 |                                     area.width = container.area.x + container.area.width - area.x;\n  433 |                                 }\n  434 | \n  435 |                                 self.stack.push((*child, area));\n  436 |                             }","lines":29,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-view/src/tree.rs#L408-L436"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`deserialize_jsonrpc_id_num` accepts a float that `is_sign_positive()` and has `fract() == 0.0`, then does `val as u64`. Rust's float-to-int cast saturates, so an out-of-range float id such as `1e30` is silently clamped to `u64::MAX` rather than rejected. This contradicts the accompanying error message which claims the value must be \"in valid u64 range\", and a clamped id could collide with or fail to match a pending request id.","fix":"Validate the range before casting, e.g. only accept the float when `val >= 0.0 && val <= u64::MAX as f64 && val.fract() == 0.0`, and otherwise return the `de::Error::custom` error rather than relying on the saturating `val as u64` cast.","locations":[{"ref":"helix-lsp/src/jsonrpc.rs:120-135","code":"  120 |     // Accept floats as long as they represent positive whole numbers.\n  121 |     // The JSONRPC spec says \"Numbers SHOULD NOT contain fractional parts\" so we should try to\n  122 |     // accept them if possible. The JavaScript type system lumps integers and floats together so\n  123 |     // some languages may serialize integer IDs as floats with a zeroed fractional part.\n  124 |     // See <https://github.com/helix-editor/helix/issues/12367>.\n  125 |     if let Some(val) = num\n  126 |         .as_f64()\n  127 |         .filter(|f| f.is_sign_positive() && f.fract() == 0.0)\n  128 |     {\n  129 |         return Ok(val as u64);\n  130 |     }\n  131 | \n  132 |     Err(de::Error::custom(\n  133 |         \"number must be integer or float representing a whole number in valid u64 range\",\n  134 |     ))\n  135 | }","lines":16,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-lsp/src/jsonrpc.rs#L120-L135"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"The `fit` closure evaluates `s.get(..column_width - 2)` where `column_width = terminal_cols as usize / headings.len()`. On a very narrow terminal `column_width` can be `0` or `1`, so `column_width - 2` underflows: it panics in debug builds, and in release wraps to a near-`usize::MAX` value so `s.get(..)` returns `None` and truncation is silently skipped. Separately, `column_width - 2` is a byte index, so when it lands inside a multi-byte grapheme (unicode `language_id`s, or the `✓`/`✘` glyphs) `s.get(..)` returns `None` and the string is emitted untruncated, breaking the intended fixed-width column alignment.","fix":"Use a saturating subtraction and a char-boundary-safe cut, e.g. compute `let cut = column_width.saturating_sub(2);` and truncate on a boundary such as `s.get(..cut)` after clamping `cut` to `s.floor_char_boundary(cut)` (or iterate `s.char_indices().nth(cut)`), and ensure `column_width >= 2`.","locations":[{"ref":"helix-term/src/health.rs:194-205","code":"  194 |     let column_width = terminal_cols as usize / headings.len();\n  195 |     let is_terminal = std::io::stdout().is_terminal();\n  196 | \n  197 |     let fit = |s: &str| -> Stylized<'static> {\n  198 |         format!(\n  199 |             \"{:column_width$}\",\n  200 |             s.get(..column_width - 2)\n  201 |                 .map(|s| format!(\"{}…\", s))\n  202 |                 .unwrap_or_else(|| s.to_string())\n  203 |         )\n  204 |         .stylized()\n  205 |     };","lines":12,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-term/src/health.rs#L194-L205"}]},
{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"`dap_pos_to_pos` computes `doc.try_line_to_char(line - 1)` where `line: usize` comes directly from a DAP adapter (`frame.line`, `frame.end_line`). DAP lines are nominally 1-indexed, but a buggy or malicious adapter can send `0`, making `line - 1` underflow. In debug builds this panics (`attempt to subtract with overflow`); in release it wraps to `usize::MAX`, and `try_line_to_char(usize::MAX)` happens to return `Err`, so `.ok()?` masks it. The debug panic is reachable from `jump_to_stack_frame` (called on every DAP `Stopped`/thread-select).","fix":"Use a checked subtraction so a `0` line yields `None` instead of underflowing: replace `let line = doc.try_line_to_char(line - 1).ok()?;` with `let line = doc.try_line_to_char(line.checked_sub(1)?).ok()?;`.","locations":[{"ref":"helix-view/src/handlers/dap.rs:27-33","code":"   27 | pub fn dap_pos_to_pos(doc: &helix_core::Rope, line: usize, column: usize) -> Option<usize> {\n   28 |     // 1-indexing to 0 indexing\n   29 |     let line = doc.try_line_to_char(line - 1).ok()?;\n   30 |     let pos = line + column.saturating_sub(1);\n   31 |     // TODO: this is probably utf-16 offsets\n   32 |     Some(pos)\n   33 | }","lines":7,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-view/src/handlers/dap.rs#L27-L33"}]},
{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"easy","description":"`softwrapped_dimensions` returns the column via `last_pos.col as u16`, silently truncating a `usize` column to 16 bits. For an extremely wide (non-soft-wrapped) line whose visual column exceeds 65535, the returned width wraps around and reports a wildly wrong dimension. This is rare in practice but is a genuine unchecked truncation of a value derived from document content.","fix":"Saturate instead of truncating, e.g. `(1, u16::try_from(last_pos.col).unwrap_or(u16::MAX))`, so oversized columns clamp to `u16::MAX` rather than wrapping.","locations":[{"ref":"helix-core/src/position.rs:172-180","code":"  172 | pub fn softwrapped_dimensions(text: RopeSlice, text_fmt: &TextFormat) -> (usize, u16) {\n  173 |     let last_pos =\n  174 |         visual_offset_from_block(text, 0, usize::MAX, text_fmt, &TextAnnotations::default()).0;\n  175 |     if last_pos.row == 0 {\n  176 |         (1, last_pos.col as u16)\n  177 |     } else {\n  178 |         (last_pos.row + 1, text_fmt.viewport_width)\n  179 |     }\n  180 | }","lines":9,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-core/src/position.rs#L172-L180"}]},
{"id":"OVF_8","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"easy","description":"`fmt_pascal_case_const` writes the PascalCase form of an enum-variant name into a fixed `PascalCaseBuf = [u8; 32]` with no bounds guard (`buf[buf_i] = first; buf_i += 1;`). The comment claims the buffer is \"Large enough to contain any enumeration name defined in this crate\"; the current longest (`TRIGGER_FOR_INCOMPLETE_COMPLETIONS` -> `TriggerForIncompleteCompletions`, 31 bytes) fits, so there is no present defect. This is a fragile invariant: adding any variant whose PascalCase name exceeds 32 bytes will make the crate fail to build (const-eval out-of-bounds indexing is a compile error, not a runtime panic), so the impact is limited to a build-time failure rather than a runtime hazard.","fix":"Either bump the buffer size and keep the comment in sync, or add a `const` assertion documenting the 32-byte cap so a future over-long variant name produces a clear diagnostic instead of an opaque const-eval indexing error.","locations":[{"ref":"helix-lsp-types/src/lib.rs:28-54","code":"   28 | // Large enough to contain any enumeration name defined in this crate\n   29 | type PascalCaseBuf = [u8; 32];\n   30 | const fn fmt_pascal_case_const(name: &str) -> (PascalCaseBuf, usize) {\n   31 |     let mut buf = [0; 32];\n   32 |     let mut buf_i = 0;\n   33 |     let mut name_i = 0;\n   34 |     let name = name.as_bytes();\n   35 |     while name_i < name.len() {\n   36 |         let first = name[name_i];\n   37 |         name_i += 1;\n   38 | \n   39 |         buf[buf_i] = first;\n   40 |         buf_i += 1;\n   41 | \n   42 |         while name_i < name.len() {\n   43 |             let rest = name[name_i];\n   44 |             name_i += 1;\n   45 |             if rest == b'_' {\n   46 |                 break;\n   47 |             }\n   48 | \n   49 |             buf[buf_i] = rest.to_ascii_lowercase();\n   50 |             buf_i += 1;\n   51 |         }\n   52 |     }\n   53 |     (buf, buf_i)\n   54 | }","lines":27,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-lsp-types/src/lib.rs#L28-L54"},{"ref":"helix-lsp-types/src/lib.rs:93-97","code":"   93 |                         _ if {\n   94 |                             const X: (crate::PascalCaseBuf, usize) = crate::fmt_pascal_case_const(stringify!($name));\n   95 |                             let (buf, len) = X;\n   96 |                             &buf[..len] == value.as_bytes()\n   97 |                         } => Ok(Self::$name),","lines":5,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-lsp-types/src/lib.rs#L93-L97"}]},
{"id":"OVF_9","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"very_easy","description":"`Editor::new` does `area.height -= 1;` (a `u16` subtraction, the code itself flags it `// HAXX`) with no guard. If the terminal reports a height of `0` at editor construction, this underflows: a panic in debug builds and a wrap to `65535` (producing a nonsensical layout) in release. Terminal dimensions are external input.","fix":"Use a saturating subtraction: `area.height = area.height.saturating_sub(1);` instead of `area.height -= 1;`.","locations":[{"ref":"helix-view/src/editor.rs:1425-1426","code":" 1425 |         // HAXX: offset the render area height by 1 to account for prompt/commandline\n 1426 |         area.height -= 1;","lines":2,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-view/src/editor.rs#L1425-L1426"}]},
{"id":"OVF_10","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"easy","description":"`Rect::union` and `Rect::intersection` (and `Rect::inner`) use non-saturating `+` on `u16` coordinates (`self.x + self.width`, `other.x + other.width`, `self.x + margin.horizontal`, etc.), which can panic in debug builds on overflow. This is inconsistent with `right()`/`bottom()`, which deliberately use `saturating_add` for exactly this reason. In practice terminal `Rect`s stay far below `u16::MAX`, so this is only a latent inconsistency, but it defeats the intent of the saturating accessors.","fix":"Use `self.right()`/`self.bottom()` (which already saturate) when computing `x2`/`y2` in `union`/`intersection`, and `saturating_add` in `inner`, matching the accessor pattern.","locations":[{"ref":"helix-view/src/graphics.rs:237-246","code":"  237 |         let x1 = min(self.x, other.x);\n  238 |         let y1 = min(self.y, other.y);\n  239 |         let x2 = max(self.x + self.width, other.x + other.width);\n  240 |         let y2 = max(self.y + self.height, other.y + other.height);\n  241 |         Rect {\n  242 |             x: x1,\n  243 |             y: y1,\n  244 |             width: x2 - x1,\n  245 |             height: y2 - y1,\n  246 |         }","lines":10,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-view/src/graphics.rs#L237-L246"},{"ref":"helix-view/src/graphics.rs:261-270","code":"  261 |         let x1 = max(self.x, other.x);\n  262 |         let y1 = max(self.y, other.y);\n  263 |         let x2 = min(self.x + self.width, other.x + other.width);\n  264 |         let y2 = min(self.y + self.height, other.y + other.height);\n  265 |         Rect {\n  266 |             x: x1,\n  267 |             y: y1,\n  268 |             width: x2.saturating_sub(x1),\n  269 |             height: y2.saturating_sub(y1),\n  270 |         }","lines":10,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-view/src/graphics.rs#L261-L270"},{"ref":"helix-view/src/graphics.rs:212-223","code":"  212 |     pub fn inner(self, margin: Margin) -> Rect {\n  213 |         if self.width < margin.width() || self.height < margin.height() {\n  214 |             Rect::default()\n  215 |         } else {\n  216 |             Rect {\n  217 |                 x: self.x + margin.horizontal,\n  218 |                 y: self.y + margin.vertical,\n  219 |                 width: self.width - margin.width(),\n  220 |                 height: self.height - margin.height(),\n  221 |             }\n  222 |         }\n  223 |     }","lines":12,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-view/src/graphics.rs#L212-L223"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `textobject_treesitter` the end-of-buffer bound check is off by one. `node.end_byte()` is an exclusive end, so a tree-sitter node that spans to the very end of the document (e.g. a function/class ending at the last byte of a file with no trailing newline) has `end_byte == slice.len_bytes()`. The guard `if start_byte >= len || end_byte >= len { return None; }` (line 283) then rejects this perfectly valid node, so `get_range()` returns `None` and the textobject selection silently falls back to the original range. `slice.byte_to_char(len)` is valid and does not panic, so the `>=` is needlessly strict for `end_byte`.","fix":"Change the end check from `>=` to `>`:\n```rust\nif start_byte >= len || end_byte > len {\n    return None;\n}\n```","locations":[{"ref":"helix-core/src/textobject.rs:280-285","code":"  280 |         let len = slice.len_bytes();\n  281 |         let start_byte = node.start_byte();\n  282 |         let end_byte = node.end_byte();\n  283 |         if start_byte >= len || end_byte >= len {\n  284 |             return None;\n  285 |         }","lines":6,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-core/src/textobject.rs#L280-L285"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `FileOperationFilter::new`, the case-sensitivity flag is inverted. `ignore_case` is the LSP `FileOperationPatternOptions.ignoreCase` value: `true` means the glob should match ignoring case, so it should map directly to `GlobBuilder::case_insensitive(true)`. Instead the code negates it: `glob_builder.case_insensitive(!ignore_case)`. As a result, when a server sets `ignoreCase: true` the glob is built case-sensitive, and (worse) the default case where `ignore_case` is absent (`unwrap_or(false)`) builds a case-*insensitive* glob. This means file-operation filters (`willCreateFiles`, `didRenameFiles`, etc.) match the wrong set of paths, so operations can be sent to servers that did not register for them or withheld from servers that did.","fix":"Remove the negation so the flag passes through directly:\n\nBefore:\n```rust\nglob_builder.case_insensitive(!ignore_case);\n```\nAfter:\n```rust\nglob_builder.case_insensitive(ignore_case);\n```","locations":[{"ref":"helix-lsp/src/file_operations.rs:29-36","code":"   29 |             let ignore_case = filter\n   30 |                 .pattern\n   31 |                 .options\n   32 |                 .as_ref()\n   33 |                 .and_then(|opts| opts.ignore_case)\n   34 |                 .unwrap_or(false);\n   35 |             let mut glob_builder = GlobBuilder::new(&filter.pattern.glob);\n   36 |             glob_builder.case_insensitive(!ignore_case);","lines":8,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-lsp/src/file_operations.rs#L29-L36"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `resolve_and_apply_code_actions_of_kind` (the `code-actions-on-save` path), a matching code action is resolved whenever `ca.edit.is_none() || ca.command.is_none()`. Because a normal pure-edit action has `edit = Some` and `command = None`, this condition is `true`, so it is resolved even though it already carries a complete edit. `resolve_code_action` returns `Some` for any server advertising `resolve_provider: true` (see `helix-lsp/src/client.rs:1204-1213`), so the resolve is issued unconditionally. Worse, the `ResolveStep::Resolve` branch then uses only the resolved edit: `edits.extend(resolved.edit)`. If the server's `codeAction/resolve` response omits `edit` (as it may, per LSP), the original `edit` is silently discarded and the on-save action does nothing. Note the correct reference implementation in `helix-view/src/action.rs:72-80` uses the same `||` guard but falls back to the original action with `resolved.as_ref().unwrap_or(code_action)`; the on-save code here has no such fallback. Effect: for language servers with `resolve_provider: true`, every configured on-save edit action does a redundant round-trip and can lose its edit.","fix":"Either gate resolution on `ca.edit.is_none()` only, or preserve the original edit when the resolve yields none. Minimal correctness fix in the `ResolveStep::Resolve` arm: fall back to the pre-resolve edit, e.g. capture the original `ca.edit.clone()` alongside the future and use `edits.extend(resolved.edit.or(original_edit))`. Cleaner: change the guard at `helix-term/src/commands/lsp.rs:838` from `if ca.edit.is_none() || ca.command.is_none()` to `if ca.edit.is_none()` so an action that already has an edit is emitted as `ResolveStep::Ready(edit)`.","locations":[{"ref":"helix-term/src/commands/lsp.rs:836-847","code":"  836 |             .filter_map(|ca| {\n  837 |                 // Resolve only when the server left out the edit or command.\n  838 |                 if ca.edit.is_none() || ca.command.is_none() {\n  839 |                     if let Some(future) = ls.resolve_code_action(ca) {\n  840 |                         return Some(ResolveStep::Resolve(Box::pin(future)));\n  841 |                     }\n  842 |                 }\n  843 |                 ca.edit.clone().map(ResolveStep::Ready)\n  844 |             })\n  845 |             .collect();\n  846 |         Some((ls.offset_encoding(), steps))\n  847 |     })();","lines":12,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-term/src/commands/lsp.rs#L836-L847"},{"ref":"helix-term/src/commands/lsp.rs:852-862","code":"  852 |     let future = async move {\n  853 |         let mut edits = Vec::new();\n  854 |         for step in steps {\n  855 |             match step {\n  856 |                 ResolveStep::Ready(edit) => edits.push(edit),\n  857 |                 ResolveStep::Resolve(future) => match future.await {\n  858 |                     Ok(resolved) => edits.extend(resolved.edit),\n  859 |                     Err(err) => log::error!(\"code-actions-on-save: resolve failed: {err:?}\"),\n  860 |                 },\n  861 |             }\n  862 |         }","lines":11,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-term/src/commands/lsp.rs#L852-L862"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `workspace_trust.rs`, `write_entry` records the workspace path with `writeln!(contents, \"path = {}\", workspace.display())`, and `workspace.display()` substitutes `U+FFFD` for any non-UTF-8 bytes (legal path bytes on Unix). The `read_entry` sanity check then does `if Path::new(&stored) != workspace { ... return None; }`, reconstructing a `Path` from the lossy string and comparing it to the original `workspace`. For a workspace whose path contains non-UTF-8 bytes the two never compare equal, so the check always fails: an error is logged and `read_entry` returns `None`. `load_status` consequently reports `TrustStatus::Untrusted`, meaning an explicit `:workspace-trust` grant never persists across reads for such a workspace and the user is re-prompted every session (with a spurious error logged each time).","fix":"Compare against the same lossy encoding that was written, rather than reconstructing a `Path`. Replace `if Path::new(&stored) != workspace {` with a comparison to `workspace.to_string_lossy()` (e.g. `if stored.as_str() != workspace.to_string_lossy() {`), so the round-trip is consistent for both UTF-8 and non-UTF-8 paths.","locations":[{"ref":"helix-loader/src/workspace_trust.rs:467-476","code":"  467 |     // Sanity check that we didn't hit a path collision: the path inside the file should match the\n  468 |     // workspace we looked up.\n  469 |     if let Some(stored) = stored_path {\n  470 |         if Path::new(&stored) != workspace {\n  471 |             log::error!(\n  472 |                 \"workspace trust file {path:?} contains path {stored:?}, expected {workspace:?}\"\n  473 |             );\n  474 |             return None;\n  475 |         }\n  476 |     }","lines":10,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-loader/src/workspace_trust.rs#L467-L476"},{"ref":"helix-loader/src/workspace_trust.rs:490","code":"  490 |     let _ = writeln!(contents, \"path = {}\", workspace.display());","lines":1,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-loader/src/workspace_trust.rs#L490"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`DefinitionResultType::Array` wraps a single `LocationOrRangeId` instead of a `Vec<LocationOrRangeId>`. Because the enum is `#[serde(untagged)]` and both variants wrap the identical type, `Array` is indistinguishable from `Scalar` and can never represent an actual array, so it is effectively dead and cannot round-trip an array-valued LSIF definition result.","fix":"Change the `Array` variant to hold a collection: `Array(Vec<LocationOrRangeId>)` so the untagged enum can actually distinguish and deserialize array results.","locations":[{"ref":"helix-lsp-types/src/lsif.rs:241-246","code":"  241 | #[derive(Debug, PartialEq, Serialize, Deserialize)]\n  242 | #[serde(untagged)]\n  243 | pub enum DefinitionResultType {\n  244 |     Scalar(LocationOrRangeId),\n  245 |     Array(LocationOrRangeId),\n  246 | }","lines":6,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-lsp-types/src/lsif.rs#L241-L246"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`TypeHierarchyItem.tags` is typed as `Option<SymbolTag>` but the LSP spec defines it as an array (`SymbolTag[]`). If a server sends `tags` as a JSON array (the spec-compliant form), deserialization of the whole `TypeHierarchyItem` fails. The impact is currently latent since helix does not exercise type-hierarchy requests, but the type is wrong versus the protocol.","fix":"Match the spec by using a vector: `pub tags: Option<Vec<SymbolTag>>,`.","locations":[{"ref":"helix-lsp-types/src/type_hierarchy.rs:64-66","code":"   64 |     /// Tags for this item.\n   65 |     #[serde(skip_serializing_if = \"Option::is_none\")]\n   66 |     pub tags: Option<SymbolTag>,","lines":3,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-lsp-types/src/type_hierarchy.rs#L64-L66"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`select_line_impl` declares `let mut count = cx.count();` and then mutates it inside the `transform` closure (`count = count.saturating_sub(1)`) which is an `FnMut` invoked once per range. The decrement is therefore shared across all selection ranges rather than being per-range. With multiple selections where several ranges are not already at line bounds, `count` is decremented repeatedly, so later ranges are extended by a smaller amount than earlier ones. Compare with `extend_line_impl`, which never mutates `count` and instead branches on the already-at-bounds condition per range.","fix":"Compute the effective per-range count locally without mutating the captured variable, e.g. inside the closure use `let count = if range.from() != start || range.to() != end { cx_count.saturating_sub(1) } else { cx_count };` where `cx_count` is the immutable original count, instead of reassigning the shared `count`.","locations":[{"ref":"helix-term/src/commands.rs:2857-2903","code":" 2857 | fn select_line_impl(cx: &mut Context, extend: Extend) {\n 2858 |     let mut count = cx.count();\n 2859 |     let (view, doc) = current!(cx.editor);\n 2860 |     let text = doc.text();\n 2861 |     let saturating_add = |a: usize, b: usize| (a + b).min(text.len_lines());\n 2862 |     let selection = doc.selection(view.id).clone().transform(|range| {\n 2863 |         let (start_line, end_line) = range.line_range(text.slice(..));\n 2864 |         let start = text.line_to_char(start_line);\n 2865 |         let end = text.line_to_char(saturating_add(end_line, 1));\n 2866 |         let direction = range.direction();\n 2867 | \n 2868 |         // Extending to line bounds is counted as one step\n 2869 |         if range.from() != start || range.to() != end {\n 2870 |             count = count.saturating_sub(1)\n 2871 |         }\n 2872 |         let (anchor_line, head_line) = match (&extend, direction) {\n 2873 |             (Extend::Above, Direction::Forward) => (start_line, end_line.saturating_sub(count)),\n 2874 |             (Extend::Above, Direction::Backward) => (end_line, start_line.saturating_sub(count)),\n 2875 |             (Extend::Below, Direction::Forward) => (start_line, saturating_add(end_line, count)),\n 2876 |             (Extend::Below, Direction::Backward) => (end_line, saturating_add(start_line, count)),\n 2877 |         };\n 2878 |         let (anchor, head) = match anchor_line.cmp(&head_line) {\n 2879 |             Ordering::Less => (\n 2880 |                 text.line_to_char(anchor_line),\n 2881 |                 text.line_to_char(saturating_add(head_line, 1)),\n 2882 |             ),\n 2883 |             Ordering::Equal => match extend {\n 2884 |                 Extend::Above => (\n 2885 |                     text.line_to_char(saturating_add(anchor_line, 1)),\n 2886 |                     text.line_to_char(head_line),\n 2887 |                 ),\n 2888 |                 Extend::Below => (\n 2889 |                     text.line_to_char(head_line),\n 2890 |                     text.line_to_char(saturating_add(anchor_line, 1)),\n 2891 |                 ),\n 2892 |             },\n 2893 | \n 2894 |             Ordering::Greater => (\n 2895 |                 text.line_to_char(saturating_add(anchor_line, 1)),\n 2896 |                 text.line_to_char(head_line),\n 2897 |             ),\n 2898 |         };\n 2899 |         Range::new(anchor, head)\n 2900 |     });\n 2901 | \n 2902 |     doc.set_selection(view.id, selection);\n 2903 | }","lines":47,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-term/src/commands.rs#L2857-L2903"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `rotate_selections`, the `Direction::Backward` arm computes the new primary index as `(index + (len.saturating_sub(count) % len)) % len`. `saturating_sub` clamps to `0` when `count > len`, so rotating backward by a count larger than the number of selections wrongly yields no movement (index unchanged) instead of wrapping. Example: with `len == 3`, `index == 0`, `count == 4`, `len.saturating_sub(4) == 0`, giving `0` (no move), while the correct wrapped result is `2`. The `Direction::Forward` arm `(index + count) % len` handles arbitrary counts correctly, so the two directions are inconsistent.","fix":"Compute the backward index with a proper modular subtraction instead of `saturating_sub`, e.g. `Direction::Backward => (index + len - count % len) % len,`. This handles `count % len == 0` (identity) and `count > len` correctly.","locations":[{"ref":"helix-term/src/commands.rs:5649-5659","code":" 5649 | fn rotate_selections(cx: &mut Context, direction: Direction) {\n 5650 |     let count = cx.count();\n 5651 |     let (view, doc) = current!(cx.editor);\n 5652 |     let mut selection = doc.selection(view.id).clone();\n 5653 |     let index = selection.primary_index();\n 5654 |     let len = selection.len();\n 5655 |     selection.set_primary_index(match direction {\n 5656 |         Direction::Forward => (index + count) % len,\n 5657 |         Direction::Backward => (index + (len.saturating_sub(count) % len)) % len,\n 5658 |     });\n 5659 |     doc.set_selection(view.id, selection);","lines":11,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-term/src/commands.rs#L5649-L5659"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `render_bufferline`, `used_width` is computed as `viewport.x.saturating_sub(x)` but the intent (per the name \"width used so far\") is `x.saturating_sub(viewport.x)`. Since `x` starts at `viewport.x` and only grows, `viewport.x.saturating_sub(x)` is *always* `0`, so `rem_width` is always the full `surface.area.width` rather than the space remaining to the right of `x`. The per-tab truncation width passed to `set_stringn` is therefore never reduced as tabs are added. It is currently masked only because the bufferline viewport shares the surface origin (`viewport.x == 0`), so `set_stringn` clips at the surface right edge and produces the same visible output; the computation is nonetheless inverted and would misrender if the bufferline area were ever horizontally offset.","fix":"Swap the operands: `let used_width = x.saturating_sub(viewport.x);`","locations":[{"ref":"helix-term/src/ui/editor.rs:702-703","code":"  702 |             let used_width = viewport.x.saturating_sub(x);\n  703 |             let rem_width = surface.area.width.saturating_sub(used_width);","lines":2,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-term/src/ui/editor.rs#L702-L703"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `draw_multi_diagnostics`, `let old_severity = severity;` is captured *after* `severity = severity.max(diag.severity());`, so `old_severity` always equals the freshly escalated `severity`. Two consequences: (1) the horizontal connector segment `for col in (anchor + 1)..last_anchor { self.draw_decoration(HOR_BAR, old_severity, col) }` is drawn with the already-escalated severity instead of the severity of the region to the right (which is what `old_severity` was clearly meant to hold), giving the wrong color when the current diagnostic has higher severity than the accumulated one; (2) the guard `severity == old_severity` in the `if anchor == last_anchor && severity == old_severity` condition is always `true` and therefore dead. Cosmetic but a genuine rendering defect in inline diagnostics.","fix":"Capture the previous severity before applying `max`:\n```rust\nlet old_severity = severity;\nseverity = severity.max(diag.severity());\nif anchor == last_anchor && severity == old_severity {\n    continue;\n}\n```\nThis both fixes the connector color and makes the equality check meaningful.","locations":[{"ref":"helix-term/src/ui/text_decorations/diagnostics.rs:193-201","code":"  193 |             severity = severity.max(diag.severity());\n  194 |             let old_severity = severity;\n  195 |             if anchor == last_anchor && severity == old_severity {\n  196 |                 continue;\n  197 |             }\n  198 |             for col in (anchor + 1)..last_anchor {\n  199 |                 self.draw_decoration(HOR_BAR, old_severity, col)\n  200 |             }\n  201 |             self.draw_decoration(sym, severity, anchor);","lines":9,"link":"https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/helix-term/src/ui/text_decorations/diagnostics.rs#L193-L201"}]},
