<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`Rc2::new_with_eff_key_len` is a safe public constructor that performs no validation of `key` at all,\neven though `Rc2::expand_key` assumes `1 <= key.len() <= 128`. Two verified panics:\n`Rc2::new_with_eff_key_len(&[], 64)` panics with `attempt to subtract with overflow` at\n`let pos: u32 = (u32::from(key_buffer[i - 1]) + ...)` (the loop starts at `i == key_len == 0`, so `i - 1`\nunderflows; in release builds the wrapped index then panics on the bounds check), and\n`Rc2::new_with_eff_key_len(&[0u8; 200], 64)` panics with\n`range end index 200 out of range for slice of length 128` at\n`key_buffer[..key_len].copy_from_slice(...)`. `Rc2::new_from_slice` does perform these checks and returns\n`InvalidLength`, so the fallible path is correct and only the infallible public constructor is unguarded.\nThe method has no `# Panics` documentation and does not document the accepted key range.","fix":"Validate in `new_with_eff_key_len` before calling `expand_key`, e.g. add a checked constructor\n`pub fn new_with_eff_key_len_checked(key: &[u8], eff_key_len: usize) -> Result<Self, InvalidLength>` that\nrejects `key.is_empty() || key.len() > 128` (reusing the logic already present in `new_from_slice`) and have\n`new_with_eff_key_len` either delegate to it and `expect` with a clear message or document the panic\nconditions with a `# Panics` section. While there, drop the redundant reslice: `key_buffer[..key_len]\n.copy_from_slice(&key[..key_len])` can be `key_buffer[..key_len].copy_from_slice(key)`.","locations":[{"ref":"rc2/src/lib.rs:44-60","code":"   44 | impl Rc2 {\n   45 |     /// Create a cipher with the specified effective key length\n   46 |     pub fn new_with_eff_key_len(key: &[u8], eff_key_len: usize) -> Self {\n   47 |         Self {\n   48 |             keys: Rc2::expand_key(key, eff_key_len),\n   49 |         }\n   50 |     }\n   51 | \n   52 |     fn expand_key(key: &[u8], t1: usize) -> [u16; 64] {\n   53 |         let key_len = key.len();\n   54 | \n   55 |         let t8: usize = (t1 + 7) >> 3;\n   56 | \n   57 |         let tm: usize = (255 % ((2u32).pow((8 + t1 - 8 * t8) as u32))) as usize;\n   58 | \n   59 |         let mut key_buffer: [u8; 128] = [0; 128];\n   60 |         key_buffer[..key_len].copy_from_slice(&key[..key_len]);","lines":17,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc2/src/lib.rs#L44-L60"},{"ref":"rc2/src/lib.rs:62-66","code":"   62 |         for i in key_len..128 {\n   63 |             let pos: u32 =\n   64 |                 (u32::from(key_buffer[i - 1]) + u32::from(key_buffer[i - key_len])) & 0xff;\n   65 |             key_buffer[i] = PI_TABLE[pos as usize];\n   66 |         }","lines":5,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc2/src/lib.rs#L62-L66"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`Rc2::new_with_eff_key_len` also performs no validation of `eff_key_len` (`t1` in `expand_key`), which\nRFC 2268 restricts to `1..=1024` bits. Three verified panics:\n`Rc2::new_with_eff_key_len(&[0u8; 8], 0)` gives `t8 == 0` and then panics with\n`index out of bounds: the len is 128 but the index is 128` at `key_buffer[128 - t8]`;\n`Rc2::new_with_eff_key_len(&[0u8; 8], 2000)` gives `t8 == 250` and panics with\n`attempt to subtract with overflow` on `128 - t8` (in release the wrapped value panics on the bounds check);\n`Rc2::new_with_eff_key_len(&[0u8; 8], usize::MAX)` panics with `attempt to add with overflow` on `t1 + 7`.\nThis matters because the RC2 effective-key-bits parameter is typically attacker-controlled data: it is\ncarried in the `RC2CBCParameter` ASN.1 structure of PKCS#12 / PKCS#5 blobs, so a parser that forwards the\nparsed version number here turns a malformed file into a remote panic.","fix":"Reject out-of-range values before use: check `(1..=1024).contains(&eff_key_len)` in the constructor and\nreturn `InvalidLength` (or a dedicated error) from a fallible variant. Also simplify the mask computation,\nwhich currently round-trips through `u32::pow` and two casts, to something that cannot overflow:\n```rust\nlet t8 = eff_key_len.div_ceil(8);\nlet bits = 8 - (8 * t8 - eff_key_len); // 1..=8 once eff_key_len >= 1\nlet tm: u8 = 0xffu8 >> (8 - bits);\n```","locations":[{"ref":"rc2/src/lib.rs:46-57","code":"   46 |     pub fn new_with_eff_key_len(key: &[u8], eff_key_len: usize) -> Self {\n   47 |         Self {\n   48 |             keys: Rc2::expand_key(key, eff_key_len),\n   49 |         }\n   50 |     }\n   51 | \n   52 |     fn expand_key(key: &[u8], t1: usize) -> [u16; 64] {\n   53 |         let key_len = key.len();\n   54 | \n   55 |         let t8: usize = (t1 + 7) >> 3;\n   56 | \n   57 |         let tm: usize = (255 % ((2u32).pow((8 + t1 - 8 * t8) as u32))) as usize;","lines":12,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc2/src/lib.rs#L46-L57"},{"ref":"rc2/src/lib.rs:68-73","code":"   68 |         key_buffer[128 - t8] = PI_TABLE[(key_buffer[128 - t8] & tm as u8) as usize];\n   69 | \n   70 |         for i in (0..128 - t8).rev() {\n   71 |             let pos: usize = (key_buffer[i + 1] ^ key_buffer[i + t8]) as usize;\n   72 |             key_buffer[i] = PI_TABLE[pos];\n   73 |         }","lines":6,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc2/src/lib.rs#L68-L73"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`RC6<W, R, B>` places no lower bound on the key-size parameter `B`, so a spec-legal\nzero-length key (`b = 0` is explicitly allowed by the RC5/RC6 key-schedule definition)\ntype-checks and then panics during key expansion. With `B = U0`,\n`KeyAsWordsSize<W, B> = (0 + W::Bytes - 1) / W::Bytes == 0`, so `key_as_words` is a\nzero-length `Array`, while `key_table.len() == 2R + 4 >= 4` keeps the `mix_in` loop\nrunning `3 * max(0, 2R+4)` iterations. The first iteration indexes\n`key_as_words[key_as_words_index]` with index `0` into a zero-length array and panics;\nif that index were guarded, line 117's `% key_as_words.len()` would then divide by zero.\nVerified: `<RC6<u32, U20, U0> as KeyInit>::new(&Array::default())` panics with\n`index out of bounds: the len is 0 but the index is 0` at `rc6/src/core/backend.rs:109`.\nThe `// Key range` bound block only asserts `B < 256`, never `B > 0`. `rc5` has the same\nshape of bounds and the same defect.","fix":"Add a non-zero lower bound on `B` to every `where` clause that already carries the\n`// Key range` block (in `rc6/src/core/backend.rs` and `rc6/src/block_cipher.rs`), e.g.\n\n```rust\n// Key range\nB: ArraySize,\nB: IsLess<U256>,\nLe<B, U256>: NonZero,\nB: NonZero,            // <-- new: rejects `B = U0` at compile time\n```\n\nAlternatively make `mix_in` defensive by returning early when\n`key_as_words.is_empty()`, but the compile-time bound is preferable since a zero-length\nkey is not a usable cipher configuration. Add a `compile_fail` doc-test or trybuild case\ncovering `RC6<u32, U20, U0>`.","locations":[{"ref":"rc6/src/core/backend.rs:45-53","code":"   45 |     // Key range\n   46 |     B: ArraySize,\n   47 |     B: IsLess<U256>,\n   48 |     Le<B, U256>: NonZero,\n   49 |     // KeyAsWordsSize\n   50 |     B: Add<W::Bytes>,\n   51 |     Sum<B, W::Bytes>: Sub<U1>,\n   52 |     Diff<Sum<B, W::Bytes>, U1>: Div<W::Bytes>,\n   53 |     KeyAsWordsSize<W, B>: ArraySize,","lines":9,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc6/src/core/backend.rs#L45-L53"},{"ref":"rc6/src/core/backend.rs:101-118","code":"  101 |         for _ in 0..3 * max(key_as_words.len(), key_table.len()) {\n  102 |             key_table[expanded_key_index] = key_table[expanded_key_index]\n  103 |                 .wrapping_add(a)\n  104 |                 .wrapping_add(b)\n  105 |                 .rotate_left(W::THREE);\n  106 | \n  107 |             a = key_table[expanded_key_index];\n  108 | \n  109 |             key_as_words[key_as_words_index] = key_as_words[key_as_words_index]\n  110 |                 .wrapping_add(a)\n  111 |                 .wrapping_add(b)\n  112 |                 .rotate_left(a.wrapping_add(b));\n  113 | \n  114 |             b = key_as_words[key_as_words_index];\n  115 | \n  116 |             expanded_key_index = (expanded_key_index + 1) % key_table.len();\n  117 |             key_as_words_index = (key_as_words_index + 1) % key_as_words.len();\n  118 |         }","lines":18,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc6/src/core/backend.rs#L101-L118"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`next_u32_wrap` indexes `buf[*offset]` after resetting `*offset` to `0` when the offset reaches\n`buf.len()`. If `buf` is empty the reset is a no-op and `buf[0]` panics with\n`index out of bounds: the len is 0 but the index is 0`. Two public, `bcrypt`-feature-gated methods\nreach this with attacker/caller-controlled slices and perform **no** length validation:\n`Blowfish::<BE>::bc_expand_key(key)` (empty `key`) and\n`Blowfish::<BE>::salted_expand_key(salt, key)` (empty `salt` **or** empty `key`).\nUnlike `KeyInit::new_from_slice`, which rejects `key.len() < 4` with `InvalidLength`, these entry\npoints hand the slice straight to `expand_key`/`next_u32_wrap`. Verified by adding a temporary test:\nboth `bc_expand_key(&[])` and `salted_expand_key(&[], b\"abcdefgh\")` panic at `blowfish/src/lib.rs:56`.\nNeither method documents that it can panic, so a caller passing an empty password or an empty salt\ngets a hard abort instead of an error.","fix":"Make the empty-buffer case unreachable and document the contract. Either return an error from the\npublic helpers, or make `next_u32_wrap` total:\n```rust\nfn next_u32_wrap(buf: &[u8], offset: &mut usize) -> u32 {\n    if buf.is_empty() {\n        return 0;\n    }\n    // ... existing loop\n}\n```\nand additionally add `/// # Panics` / `debug_assert!(!key.is_empty())` documentation to\n`salted_expand_key` and `bc_expand_key`, or change their signatures to\n`-> Result<(), InvalidLength>` and reject empty `key`/`salt` up front.","locations":[{"ref":"blowfish/src/lib.rs:50-60","code":"   50 | fn next_u32_wrap(buf: &[u8], offset: &mut usize) -> u32 {\n   51 |     let mut v = 0;\n   52 |     for _ in 0..4 {\n   53 |         if *offset >= buf.len() {\n   54 |             *offset = 0;\n   55 |         }\n   56 |         v = (v << 8) | buf[*offset] as u32;\n   57 |         *offset += 1;\n   58 |     }\n   59 |     v\n   60 | }","lines":11,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/blowfish/src/lib.rs#L50-L60"},{"ref":"blowfish/src/lib.rs:227-231","code":"  227 |     pub fn salted_expand_key(&mut self, salt: &[u8], key: &[u8]) {\n  228 |         let mut key_pos = 0;\n  229 |         for i in 0..18 {\n  230 |             self.p[i] ^= next_u32_wrap(key, &mut key_pos);\n  231 |         }","lines":5,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/blowfish/src/lib.rs#L227-L231"},{"ref":"blowfish/src/lib.rs:272-274","code":"  272 |     pub fn bc_expand_key(&mut self, key: &[u8]) {\n  273 |         self.expand_key(key)\n  274 |     }","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/blowfish/src/lib.rs#L272-L274"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`RC5` accepts a zero-length key type parameter and then panics. The `where` clauses only bound the key size\nfrom above (`B: IsLess<U256>, Le<B, U256>: NonZero` means `B < 256`), so `RC5<u32, U12, U0>` compiles;\n`KeyAsWordsSize<W, B> = ceil(B / W::Bytes)` is then `0`, and `mix_in` immediately does\n`key_as_words[key_as_words_index]` on a zero-length `Array`. Verified:\n`<RC5<u32, U12, U0> as KeyInit>::new_from_slice(&[])` panics with\n`index out of bounds: the len is 0 but the index is 0` at `rc5/src/lib.rs:138`. Had the indexing not\npanicked first, `expanded_key_index = (i + 1) % key_as_words.len()` would be a divide-by-zero. A zero-byte\nkey is legal in RC5 (`b` ranges over `0..=255`), and RFC 2040 / Rivest's reference code define\n`c = max(1, ceil(8b/w))` precisely to cover this case, so the bug is a missing `max(1, ...)`.","fix":"Either forbid `B = U0` with an extra bound (e.g. `B: NonZero`, giving a compile error instead of a runtime\npanic), or follow the specification and clamp the word count to at least one, e.g. define\n`KeyAsWordsSize<W, B> = Quot<Diff<Sum<Maximum<B, U1>, W::Bytes>, U1>, W::Bytes>` in\n`rc5/src/primitives.rs` and add the corresponding `Max` bounds. Add a regression test for\n`RC5<u32, U12, U0>`.","locations":[{"ref":"rc5/src/lib.rs:81-89","code":"   81 |     // Key range\n   82 |     B: ArraySize,\n   83 |     B: IsLess<U256>,\n   84 |     Le<B, U256>: NonZero,\n   85 |     // KeyAsWordsSize\n   86 |     B: Add<W::Bytes>,\n   87 |     Sum<B, W::Bytes>: Sub<U1>,\n   88 |     Diff<Sum<B, W::Bytes>, U1>: Div<W::Bytes>,\n   89 |     KeyAsWordsSize<W, B>: ArraySize,","lines":9,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc5/src/lib.rs#L81-L89"},{"ref":"rc5/src/lib.rs:127-147","code":"  127 |         let (mut expanded_key_index, mut key_as_words_index) = (0, 0);\n  128 |         let (mut a, mut b) = (W::ZERO, W::ZERO);\n  129 | \n  130 |         for _ in 0..3 * max(key_as_words.len(), key_table.len()) {\n  131 |             key_table[expanded_key_index] = key_table[expanded_key_index]\n  132 |                 .wrapping_add(a)\n  133 |                 .wrapping_add(b)\n  134 |                 .rotate_left(W::THREE);\n  135 | \n  136 |             a = key_table[expanded_key_index];\n  137 | \n  138 |             key_as_words[key_as_words_index] = key_as_words[key_as_words_index]\n  139 |                 .wrapping_add(a)\n  140 |                 .wrapping_add(b)\n  141 |                 .rotate_left(a.wrapping_add(b));\n  142 | \n  143 |             b = key_as_words[key_as_words_index];\n  144 | \n  145 |             expanded_key_index = (expanded_key_index + 1) % key_table.len();\n  146 |             key_as_words_index = (key_as_words_index + 1) % key_as_words.len();\n  147 |         }","lines":21,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc5/src/lib.rs#L127-L147"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`rotate_left_high` and `rotate_left_low` panic for several `shift` values because the shift-amount\narithmetic is done in `u8` and is never reduced modulo 128:\n\n- `shift == 0` or `shift == 64`: after the `if shift >= 64` adjustment `shift` is `0`, so\n  `val.1 >> (64 - shift)` becomes `val.1 >> 64` - \"attempt to shift right with overflow\" in debug\n  builds and an unspecified result in release builds.\n- `shift >= 128`: `shift -= 64` leaves `shift >= 64`, so `64 - shift` underflows the `u8`\n  subtraction (panic in debug) and `val.0 << shift` also overshoots the word width.\n\nOnly `shift` values `15, 30, 45, 60, 77, 94, 111` are passed today, so this is unreachable, but the\nhelpers are private, undocumented about their valid domain, and are exactly the kind of code that\ngets reused when a new Camellia variant or a key-schedule refactor lands.","fix":"Fold the shift reduction and the 128-bit rotate into one panic-free helper (this also fixes the\n`shift >= 64` half-swap reported separately):\n\n```rust\n#[inline]\nfn rotate_left(val: (u64, u64), shift: u32) -> (u64, u64) {\n    let x = ((u128::from(val.0) << 64) | u128::from(val.1)).rotate_left(shift);\n    ((x >> 64) as u64, x as u64)\n}\n```\n\n`u128::rotate_left` already reduces the amount modulo 128, so `0`, `64` and `>= 128` are all\nhandled. If the two-function shape must be kept, at minimum use `let shift = u32::from(shift) % 128;`\nand handle `shift == 0` explicitly instead of relying on `64 - shift`.","locations":[{"ref":"camellia/src/utils.rs:70-76","code":"   70 | fn rotate_left_high(val: (u64, u64), mut shift: u8) -> u64 {\n   71 |     if shift >= 64 {\n   72 |         shift -= 64;\n   73 |     }\n   74 | \n   75 |     (val.0 << shift) | (val.1 >> (64 - shift))\n   76 | }","lines":7,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/camellia/src/utils.rs#L70-L76"},{"ref":"camellia/src/utils.rs:79-85","code":"   79 | fn rotate_left_low(val: (u64, u64), mut shift: u8) -> u64 {\n   80 |     if shift >= 64 {\n   81 |         shift -= 64;\n   82 |     }\n   83 | \n   84 |     (val.0 >> (64 - shift)) | (val.1 << shift)\n   85 | }","lines":7,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/camellia/src/utils.rs#L79-L85"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`Cast5::key_schedule` accepts `key: &[u8]` but hard-codes `key[0..4]`, `key[4..8]`, `key[8..12]` and\n`key[12..16]`, so it panics for any slice shorter than 16 bytes - and CAST5 is precisely the cipher\nwhose public API accepts 5..=16 byte keys. The invariant is upheld only by the two call sites in\n`new_from_slice` (which pass either a 16-byte `padded_key` or a `key` already known to be exactly 16\nbytes), and nothing in the signature or a doc comment records it. Given the variable-length key\nhandling this method sits behind, the length contract should be in the type, which also removes the\nfour `try_into().unwrap()` calls.","fix":"Change the signature to a fixed-size array reference:\n\n```rust\nfn key_schedule(&mut self, key: &[u8; 16]) {\n    let mut x = [\n        u32::from_be_bytes([key[0], key[1], key[2], key[3]]),\n        u32::from_be_bytes([key[4], key[5], key[6], key[7]]),\n        u32::from_be_bytes([key[8], key[9], key[10], key[11]]),\n        u32::from_be_bytes([key[12], key[13], key[14], key[15]]),\n    ];\n```\n\nand in `new_from_slice` always build the padded array (the branch is no longer needed since a\n16-byte key pads to itself):\n\n```rust\nlet mut padded_key = [0u8; 16];\npadded_key[..key.len()].copy_from_slice(key);\ncast5.key_schedule(&padded_key);\n```","locations":[{"ref":"cast5/src/lib.rs:83-89","code":"   83 |     fn key_schedule(&mut self, key: &[u8]) {\n   84 |         let mut x = [\n   85 |             u32::from_be_bytes(key[0..4].try_into().unwrap()),\n   86 |             u32::from_be_bytes(key[4..8].try_into().unwrap()),\n   87 |             u32::from_be_bytes(key[8..12].try_into().unwrap()),\n   88 |             u32::from_be_bytes(key[12..16].try_into().unwrap()),\n   89 |         ];","lines":7,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/cast5/src/lib.rs#L83-L89"},{"ref":"cast5/src/lib.rs:149-156","code":"  149 |         if key.len() < 16 {\n  150 |             // Pad keys that are less than 128 bits long.\n  151 |             let mut padded_key = [0u8; 16];\n  152 |             padded_key[..key.len()].copy_from_slice(key);\n  153 |             cast5.key_schedule(&padded_key[..]);\n  154 |         } else {\n  155 |             cast5.key_schedule(key);\n  156 |         }","lines":8,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/cast5/src/lib.rs#L149-L156"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`cast6::to_u32s` and `cast6::to_u8s` enforce their core length invariant with runtime `assert_eq!`\nrather than with types, turning a compile-time property into a panic. `to_u32s::<N>(src: &[u8])`\nrequires `src.len() == 4 * N` and `N` is inferred purely from the assignment context, so a future\nedit that changes the block size or writes an explicit turbofish (`to_u32s::<8>(block.get_in())`)\ncompiles cleanly and panics at runtime instead of failing to build. `to_u8s`'s assertion is\nadditionally written in a confusing reversed form, `assert_eq!(4 * src.len(), N)`, comparing a\ncomputed length against a const generic. Both are used on the per-block hot path in\n`encrypt_block`/`decrypt_block`.","fix":"Make the lengths type-level so the asserts disappear:\n\n```rust\n#[inline]\nfn to_u32s<const N: usize>(src: &[u8; N]) -> [u32; N / 4] { /* needs generic_const_exprs */ }\n```\n\nIf that is not available on the MSRV, drop the generics and write the two concrete conversions the\ncrate actually needs, which is also faster and unconditionally panic-free:\n\n```rust\n#[inline]\nfn to_u32s(src: &[u8; 16]) -> [u32; 4] {\n    [\n        u32::from_be_bytes([src[0], src[1], src[2], src[3]]),\n        u32::from_be_bytes([src[4], src[5], src[6], src[7]]),\n        u32::from_be_bytes([src[8], src[9], src[10], src[11]]),\n        u32::from_be_bytes([src[12], src[13], src[14], src[15]]),\n    ]\n}\n\n#[inline]\nfn to_u8s(src: &[u32; 4]) -> [u8; 16] {\n    let mut res = [0u8; 16];\n    for (dst, s) in res.chunks_exact_mut(4).zip(src) {\n        dst.copy_from_slice(&s.to_be_bytes());\n    }\n    res\n}\n```","locations":[{"ref":"cast6/src/lib.rs:310-326","code":"  310 | fn to_u32s<const N: usize>(src: &[u8]) -> [u32; N] {\n  311 |     assert_eq!(src.len(), 4 * N);\n  312 |     let mut res = [0u32; N];\n  313 |     for (chunk, dst) in src.chunks_exact(4).zip(res.iter_mut()) {\n  314 |         *dst = u32::from_be_bytes(chunk.try_into().unwrap());\n  315 |     }\n  316 |     res\n  317 | }\n  318 | \n  319 | fn to_u8s<const N: usize>(src: &[u32]) -> [u8; N] {\n  320 |     assert_eq!(4 * src.len(), N);\n  321 |     let mut res = [0u8; N];\n  322 |     for (dst_chunk, src) in res.chunks_exact_mut(4).zip(src.iter()) {\n  323 |         dst_chunk.copy_from_slice(&src.to_be_bytes());\n  324 |     }\n  325 |     res\n  326 | }","lines":17,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/cast6/src/lib.rs#L310-L326"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`expand_key` derives its loop bounds from the runtime value `key.len()` (`for i in (length_key / 2)..LENGTH_SUB_KEYS`) but then indexes with the fixed offsets `i - 15`, `i - 14`, `i - 7` and `i - 6`. Those offsets are only safe because `KeySize = U16` makes the loop start at `i == 8`; with any shorter key the first iteration that takes the `(i + 2) % 8 < 2` branch would evaluate `i - 14` with `i < 14` and panic with an integer-underflow / index-out-of-bounds. The function reads as if it supported variable key lengths (that is the only reason to look at `key.len()` at all) while it silently does not.","fix":"Drop the runtime length entirely and make the fixed-key-size assumption explicit:\n```rust\nconst KEY_WORDS: usize = 8; // 128-bit key = 8 u16 words\nfor i in 0..KEY_WORDS {\n    self.enc_keys[i] = u16::from_be_bytes([key[2 * i], key[2 * i + 1]]);\n}\nfor i in KEY_WORDS..LENGTH_SUB_KEYS {\n    ...\n}\n```","locations":[{"ref":"idea/src/lib.rs:50-72","code":"   50 |     fn expand_key(&mut self, key: &Key<Self>) {\n   51 |         let length_key = key.len();\n   52 |         for i in 0..(length_key / 2) {\n   53 |             self.enc_keys[i] = (u16::from(key[2 * i]) << 8) + u16::from(key[2 * i + 1]);\n   54 |         }\n   55 | \n   56 |         let mut a: u16;\n   57 |         let mut b: u16;\n   58 |         for i in (length_key / 2)..LENGTH_SUB_KEYS {\n   59 |             if (i + 1) % 8 == 0 {\n   60 |                 a = self.enc_keys[i - 15];\n   61 |             } else {\n   62 |                 a = self.enc_keys[i - 7];\n   63 |             }\n   64 | \n   65 |             if (i + 2) % 8 < 2 {\n   66 |                 b = self.enc_keys[i - 14];\n   67 |             } else {\n   68 |                 b = self.enc_keys[i - 6];\n   69 |             }\n   70 | \n   71 |             self.enc_keys[i] = (a << 9) + (b >> 7);\n   72 |         }","lines":23,"link":" {"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`define_speck_impl!` takes `$block_size`, `$key_size`, `$n`, `$m`, `$mask` and `$word_type` as independent\nparameters even though they are tightly coupled: the code requires `$key_size == $m * ($n / 8)`,\n`$block_size == 2 * ($n / 8)`, `$mask == (1 << $n) - 1` and `size_of::<$word_type>() * 8 >= $n`. Nothing\nenforces these. A single mistyped parameter in one of the ten instantiations produces a crate that still\ncompiles but panics at runtime: `from_be_bytes` would hit `copy_from_slice: source slice length ... does not\nmatch destination`, `to_be_bytes` would panic in `try_into().unwrap()`, or `KeyInit::new` would panic on the\nout-of-range slice `&key[($m - 1) * ($n / 8)..($m) * ($n / 8)]`. All ten current instantiations are\nconsistent, so this is a latent hazard rather than a live bug, but it is exactly the kind of parameter table\nwhere a copy-paste slip is easy and the failure mode should be a compile error.","fix":"Add const assertions inside the macro body so a bad parameter set fails to compile:\n```rust\nconst _: () = {\n    use cipher::common::typenum::Unsigned;\n    assert!(<$key_size as Unsigned>::USIZE == $m * ($n / 8));\n    assert!(<$block_size as Unsigned>::USIZE == 2 * ($n / 8));\n    assert!(size_of::<$word_type>() * 8 >= $n);\n    assert!($mask == (!0 as $word_type) >> (size_of::<$word_type>() * 8 - $n));\n};\n```\nBetter still, derive `$block_size`/`$key_size`/`$mask` from `$n` and `$m` instead of passing them in.","locations":[{"ref":"speck-cipher/src/lib.rs:47-62","code":"   47 |         impl $name {\n   48 |             #[inline]\n   49 |             fn from_be_bytes(bytes: &[u8]) -> $word_type {\n   50 |                 let mut tmp = [0u8; size_of::<$word_type>()];\n   51 |                 let offset = size_of::<$word_type>() - $n / 8;\n   52 |                 tmp[offset..].copy_from_slice(bytes);\n   53 |                 <$word_type>::from_be_bytes(tmp)\n   54 |             }\n   55 | \n   56 |             #[inline]\n   57 |             #[allow(clippy::wrong_self_convention)]\n   58 |             fn to_be_bytes(word: $word_type) -> [u8; $n / 8] {\n   59 |                 let tmp = word.to_be_bytes();\n   60 |                 let offset = size_of::<$word_type>() - $n / 8;\n   61 |                 tmp[offset..].try_into().unwrap()\n   62 |             }","lines":16,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/speck-cipher/src/lib.rs#L47-L62"},{"ref":"speck-cipher/src/lib.rs:109-129","code":"  109 |         impl KeyInit for $name {\n  110 |             fn new(key: &Key<Self>) -> Self {\n  111 |                 let mut k = [0; $rounds];\n  112 |                 let mut l = [0; $m - 1 + $rounds - 1];\n  113 |                 k[0] = $name::from_be_bytes(&key[($m - 1) * ($n / 8)..($m) * ($n / 8)]);\n  114 | \n  115 |                 for i in 0..$m - 1 {\n  116 |                     l[i] = $name::from_be_bytes(\n  117 |                         &key[($m - 2 - i) * ($n / 8)..($m - 1 - i) * ($n / 8)],\n  118 |                     );\n  119 |                 }\n  120 | \n  121 |                 for i in 0..($rounds - 1) {\n  122 |                     let res = $name::round_function(i.try_into().unwrap(), l[i], k[i]);\n  123 |                     l[i + $m - 1] = res.0;\n  124 |                     k[i + 1] = res.1;\n  125 |                 }\n  126 | \n  127 |                 Self { k }\n  128 |             }\n  129 |         }","lines":21,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/speck-cipher/src/lib.rs#L109-L129"},{"ref":"speck-cipher/src/lib.rs:219-231","code":"  219 | define_speck_impl!(\n  220 |     Speck32_64,\n  221 |     U4,\n  222 |     U8,\n  223 |     u16,\n  224 |     16,\n  225 |     4,\n  226 |     7,\n  227 |     2,\n  228 |     0xFFFF,\n  229 |     22,\n  230 |     \"Speck32/64\"\n  231 {"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"Several `twofish` helpers take unbounded slices and rely entirely on the caller for their length invariants,\nso a mistake outside them turns into a runtime panic instead of a compile error. `rs_mult(m: &[u8], out: &mut\n[u8])` indexes `m[0..8]` and `out[0..4]`; `h(x, m, k, offset)` indexes up to `m[4 * (6 + offset) + 3]` (i.e.\n`m[31]`) and takes an untyped `k: usize` that must be 2, 3 or 4; `key_schedule` reaches `unreachable!()` for\nany `key.len() / 8` outside `2..=4`; and `mds_column_mult` reaches `unreachable!()` for `column >= 4`. The only\nthing keeping all of this sound is the `n != 16 && n != 24 && n != 32` check in `new_from_slice`, three call\nframes away.","fix":"Make the invariants types: `fn rs_mult(m: &[u8; 8]) -> [u8; 4]`, `fn mds_column_mult(x: u8, column: usize)`\nreplaced by indexing a `const MDS_COL: [[u8; 4]; 4]` table, and replace `k: usize` in `h`/`key_schedule` with\nan enum such as\n```rust\nenum KeyWords { Two, Three, Four }\n```\nso the `unreachable!()` arms disappear and the length validation happens once, at the type boundary.","locations":[{"ref":"twofish/src/lib.rs:97-104","code":"   97 | fn rs_mult(m: &[u8], out: &mut [u8]) {\n   98 |     for i in 0..4 {\n   99 |         out[i] = 0;\n  100 |         for j in 0..8 {\n  101 |             out[i] ^= gf_mult(m[j], RS[i][j], RS_POLY);\n  102 |         }\n  103 |     }\n  104 | }","lines":8,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/twofish/src/lib.rs#L97-L104"},{"ref":"twofish/src/lib.rs:107-132","code":"  107 | fn h(x: u32, m: &[u8], k: usize, offset: usize) -> u32 {\n  108 |     let mut y = x.to_le_bytes();\n  109 | \n  110 |     if k == 4 {\n  111 |         y[0] = sbox(1, y[0]) ^ m[4 * (6 + offset)];\n  112 |         y[1] = sbox(0, y[1]) ^ m[4 * (6 + offset) + 1];\n  113 |         y[2] = sbox(0, y[2]) ^ m[4 * (6 + offset) + 2];\n  114 |         y[3] = sbox(1, y[3]) ^ m[4 * (6 + offset) + 3];\n  115 |     }\n  116 | \n  117 |     if k >= 3 {\n  118 |         y[0] = sbox(1, y[0]) ^ m[4 * (4 + offset)];\n  119 |         y[1] = sbox(1, y[1]) ^ m[4 * (4 + offset) + 1];\n  120 |         y[2] = sbox(0, y[2]) ^ m[4 * (4 + offset) + 2];\n  121 |         y[3] = sbox(0, y[3]) ^ m[4 * (4 + offset) + 3];\n  122 |     }\n  123 | \n  124 |     let a = 4 * (2 + offset);\n  125 |     let b = 4 * offset;\n  126 |     y[0] = sbox(1, sbox(0, sbox(0, y[0]) ^ m[a]) ^ m[b]);\n  127 |     y[1] = sbox(0, sbox(0, sbox(1, y[1]) ^ m[a + 1]) ^ m[b + 1]);\n  128 |     y[2] = sbox(1, sbox(1, sbox(0, y[2]) ^ m[a + 2]) ^ m[b + 2]);\n  129 |     y[3] = sbox(0, sbox(1, sbox(1, y[3]) ^ m[a + 3]) ^ m[b + 3]);\n  130 | \n  131 |     mds_mult(y)\n  132 | }","lines":26,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/twofish/src/lib.rs#L107-L132"},{"ref":"twofish/src/lib.rs:150-173","code":"  150 |     fn key_schedule(&mut self, key: &[u8]) {\n  151 |         let k = key.len() / 8;\n  152 | \n  153 |         let rho: u32 = 0x1010101;\n  154 | \n  155 |         for x in 0..20 {\n  156 |             let a = h(rho * (2 * x), key, k, 0);\n  157 |             let b = h(rho * (2 * x + 1), key, k, 1).rotate_left(8);\n  158 |             let v = a.wrapping_add(b);\n  159 |             self.k[(2 * x) as usize] = v;\n  160 |             self.k[(2 * x + 1) as usize] = (v.wrapping_add(b)).rotate_left(9);\n  161 |         }\n  162 |         self.start = match k {\n  163 |             4 => 0,\n  164 |             3 => 1,\n  165 |             2 => 2,\n  166 |             _ => unreachable!(),\n  167 |         };\n  168 | \n  169 |         // Compute S_i.\n  170 |         for i in 0..k {\n  171 |             rs_mult(&key[i * 8..i * 8 + 8], &mut self.s[i * 4..(i + 1) * 4]);\n  172 |         }\n  173 |     }","lines":24,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aee {"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"negligible","difficulty":"easy","description":"`crypt` extracts the four 16-bit words with `b[0..2].try_into().unwrap()` and three more `unwrap()` calls. The slices always have length 2 because `BlockSize = U8`, so the panic is unreachable, but it leaves four panicking paths (and their formatting machinery) in a `#![no_std]`, `#![deny(unsafe_code)]` cryptographic primitive where the block is a fixed-size array and the code can be written without any fallible conversion.","fix":"Destructure the fixed-size array instead:\n```rust\nlet [b0, b1, b2, b3, b4, b5, b6, b7] = block.get_in().0;\nlet mut x1 = u16::from_be_bytes([b0, b1]);\nlet mut x2 = u16::from_be_bytes([b2, b3]);\nlet mut x3 = u16::from_be_bytes([b4, b5]);\nlet mut x4 = u16::from_be_bytes([b6, b7]);\n```","locations":[{"ref":"idea/src/lib.rs:99-103","code":"   99 |         let b = block.get_in();\n  100 |         let mut x1 = u16::from_be_bytes(b[0..2].try_into().unwrap());\n  101 |         let mut x2 = u16::from_be_bytes(b[2..4].try_into().unwrap());\n  102 |         let mut x3 = u16::from_be_bytes(b[4..6].try_into().unwrap());\n  103 |         let mut x4 = u16::from_be_bytes(b[6..8].try_into().unwrap());","lines":5,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/idea/src/lib.rs#L99-L103"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"easy","description":"`rotate` computes `val >> (28 - shift)` with `shift: u8`. The subtraction underflows for any `shift > 28`, panicking in debug builds and producing a masked, silently wrong rotation in release builds. The precondition (`shift <= 28`, and implicitly that `val` already fits in 28 bits) is not documented and not checked; the function only happens to be safe because every caller passes a value from `SHIFTS`, which contains only `1` and `2`.","fix":"Document and assert the precondition:\n\n```rust\n/// Performs a left rotate on a 28 bit number.\n///\n/// `shift` must be in `0..=28` and `val` must fit in 28 bits.\nfn rotate(mut val: u64, shift: u8) -> u64 {\n    debug_assert!(shift <= 28, \"shift must be at most 28\");\n    debug_assert_eq!(val >> 28, 0, \"val must fit in 28 bits\");\n    let top_bits = val >> (28 - shift);\n    val <<= shift;\n    (val | top_bits) & 0x0FFFFFFF\n}\n```","locations":[{"ref":"des/src/utils.rs:120-126","code":"  120 | /// Performs a left rotate on a 28 bit number\n  121 | fn rotate(mut val: u64, shift: u8) -> u64 {\n  122 |     let top_bits = val >> (28 - shift);\n  123 |     val <<= shift;\n  124 | \n  125 |     (val | top_bits) & 0x0FFFFFFF\n  126 | }","lines":7,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/des/src/utils.rs#L120-L126"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`weak_key_test` compares the raw 8-byte subkeys against `WEAK_KEYS` bit-for-bit, but DES discards the\nlow (parity) bit of every key byte in `PC-1`. Two keys that differ only in their parity bits therefore\nproduce *identical* subkey schedules and are equally weak, yet only the odd-parity spellings stored in\n`WEAK_KEYS` are detected. Verified empirically against this very crate:\n\n```\nweak_key_test(hex!(\"0000000000000000\")) -> Ok(())    // but Des::encrypt is an involution for it\nweak_key_test(hex!(\"ffffffffffffffff\")) -> Ok(())    // ditto\nweak_key_test(hex!(\"e1e1e1e1f0f0f0f0\")) -> Ok(())    // semi-weak, parity-flipped `e0e0e0e0f1f1f1f1`\nweak_key_test(hex!(\"0101010101010101\")) -> Err(WeakKeyError)\n```\n\nThe all-zero key - by far the most likely weak key to appear in practice (uninitialised or default key\nmaterial) - passes the check while being fully weak. The same omission affects the multi-subkey\nequality tests at lines 27-35: a `TdesEde2` key whose two halves differ only in parity bits collapses\nto plain single DES (confirmed: `TdesEde2::new(hex!(\"0123456789abcdef 00224466 88aacdee\"))` produces\nexactly `Des::new(hex!(\"0123456789abcdef\"))` output) yet `weak_key_test` returns `Ok(())`. Callers using\nthis function as a guard get a false sense of security. (The 64-entry table itself is correct - I\nverified all 64 entries are distinct, all have odd parity, and their subkey-repetition histogram is\nexactly 4 weak / 12 semi-weak / 48 possibly-weak keys.)","fix":"Mask off the parity bit of every key byte before every comparison. The mask is byte-symmetric so it is\nendianness-independent, and it cannot introduce false positives because the 64 table entries are\nalready distinct in their 56 effective bits.\n\n```rust\n/// DES drops the low bit of each key byte in PC-1, so keys that differ only in\n/// parity bits share a subkey schedule and are equally weak.\nconst PARITY_MASK: u64 = 0xFEFE_FEFE_FEFE_FEFE;\n\nfor subkey in key.chunks_exact(8) {\n    let subkey = u64::from_ne_bytes(subkey.try_into().expect(\"`subkey` length is equal to 8\"));\n    for &weak_key in WEAK_KEYS {\n        is_weak |= u8::from((subkey & PARITY_MASK) == (weak_key & PARITY_MASK));\n    }\n}\n```\n\nApply the same masking to the `k1 == k2` / `k1 == k3` / `k2 == k3` and `key[..8] == key[8..]`\ncomparisons, e.g. by mapping each 8-byte chunk through `from_ne_bytes(..) & PARITY_MASK` first and\ncomparing the resulting `u64`s.","locations":[{"ref":"des/src/weak_key.rs:16-38","code":"   16 |     let mut is_weak = 0u8;\n   17 | \n   18 |     for subkey in key.chunks_exact(8) {\n   19 |         let key = u64::from_ne_bytes(subkey.try_into().expect(\"`subkey` length is equal to 8\"));\n   20 |         for &weak_key in WEAK_KEYS {\n   21 |             is_weak |= u8::from(key == weak_key);\n   22 |         }\n   23 |     }\n   24 | \n   25 |     match key.len() {\n   26 |         16 => {\n   27 |             is_weak |= u8::from(key[..8] == key[8..]);\n   28 |         }\n   29 |         24 => {\n   30 |             let k1 = &key[..8];\n   31 |             let k2 = &key[8..16];\n   32 |             let k3 = &key[16..];\n   33 |             is_weak |= u8::from(k1 == k2);\n   34 |             is_weak |= u8::from(k1 == k3);\n   35 |             is_weak |= u8::from(k2 == k3);\n   36 |         }\n   37 |         _ => {}\n   38 |     }","lines":23,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/des/src/weak_key.rs#L16-L38"},{"ref":"des/src/weak_key.rs:65-67","code":"   65 | pub(crate) static WEAK_KEYS: &[u64; 64] = &as_ne_u64![\n   66 |     [0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01],\n   67 |     [0xFE, 0xFE, 0xFE, 0xFE, 0xFE, 0xFE, 0xFE, 0xFE],","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/des/src/weak_key.rs#L65-L67"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`rotate_left_high` and `rotate_left_low` in `camellia/src/utils.rs` do **not** return what their doc\ncomments claim once `shift >= 64`. For `shift < 64` they are correct, but for `shift >= 64` they\nmerely do `shift -= 64` and then reuse the *same* formulas, which is wrong: rotating the 128-bit\nvalue `(H, L)` left by `64 + s` is equivalent to rotating `(L, H)` left by `s`, so the two halves\nswap roles. Verified numerically: for `shift` in `{77, 94, 111}` (the only `>= 64` shifts actually\nused), `rotate_left_high(v, shift)` returns the **low** half of `v <<< shift` and\n`rotate_left_low(v, shift)` returns the **high** half.\n\nThe generated subkeys are nevertheless correct today only because every call site with a shift\n`>= 64` was written inverted to compensate: `gen_subkeys26` assigns `k[16] = rotate_left_low(kl, 77)`\nwhere RFC 3713 defines `ke3 = (KL <<< 77) >> 64` (the high half), and the same inversion is applied\nto `k[16]..k[25]` and to `k[22]..k[33]` in `get_subkeys34`. I confirmed both tables match RFC 3713\nexactly, so this is not a ciphertext bug - it is a latent landmine: the helpers violate their\ndocumented contract, the call sites silently contradict the spec they transcribe, and any newly\nadded call site with a shift `>= 64` (or any \"cleanup\" that un-inverts the existing ones) will\nsilently produce wrong subkeys with no test catching a partial fix.","fix":"Replace the two hand-rolled helpers with one correct 128-bit rotate and then un-invert the call\nsites so they read exactly like RFC 3713:\n\n```rust\n/// Rotates the 128-bit value `(high, low)` left by `shift` bits.\n#[inline]\nfn rotate_left(val: (u64, u64), shift: u32) -> (u64, u64) {\n    let x = ((u128::from(val.0) << 64) | u128::from(val.1)).rotate_left(shift);\n    ((x >> 64) as u64, x as u64)\n}\n```\n\nThen, in `gen_subkeys26`, `k[16]` becomes `rotate_left(kl, 77).0` (high) and `k[17]` becomes\n`rotate_left(kl, 77).1` (low), and likewise for every remaining `77`/`94`/`111` entry in both\n`gen_subkeys26` (`k[16]..k[25]`) and `get_subkeys34` (`k[22]..k[33]`); the `15`/`30`/`45`/`60`\nentries keep their current high/low ordering. The existing RFC 3713 test vectors will catch any\nmistake in the transcription.","locations":[{"ref":"camellia/src/utils.rs:69-85","code":"   69 | /// Performs rotate left and taking the higher-half of it.\n   70 | fn rotate_left_high(val: (u64, u64), mut shift: u8) -> u64 {\n   71 |     if shift >= 64 {\n   72 |         shift -= 64;\n   73 |     }\n   74 | \n   75 |     (val.0 << shift) | (val.1 >> (64 - shift))\n   76 | }\n   77 | \n   78 | /// Performs rotate left and taking the lower-half of it.\n   79 | fn rotate_left_low(val: (u64, u64), mut shift: u8) -> u64 {\n   80 |     if shift >= 64 {\n   81 |         shift -= 64;\n   82 |     }\n   83 | \n   84 |     (val.0 >> (64 - shift)) | (val.1 << shift)\n   85 | }","lines":17,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/camellia/src/utils.rs#L69-L85"},{"ref":"camellia/src/utils.rs:110-121","code":"  110 |     k[16] = rotate_left_low(kl, 77);\n  111 |     k[17] = rotate_left_high(kl, 77);\n  112 | \n  113 |     k[18] = rotate_left_low(kl, 94);\n  114 |     k[19] = rotate_left_high(kl, 94);\n  115 |     k[20] = rotate_left_low(ka, 94);\n  116 |     k[21] = rotate_left_high(ka, 94);\n  117 |     k[22] = rotate_left_low(kl, 111);\n  118 |     k[23] = rotate_left_high(kl, 111);\n  119 | \n  120 |     k[24] = rotate_left_low(ka, 111);\n  121 |     k[25] = rotate_left_high(ka, 111);","lines":12,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/camellia/src/utils.rs#L110-L121"},{"ref":"camellia/src/utils.rs:161-175","code":"  161 |     k[22] = rotate_left_low(kl, 77);\n  162 |     k[23] = rotate_left_high(kl, 77);\n  163 | \n  164 |     k[24] = rotate_left_low(ka, 77);\n  165 |     k[25] = rotate_left_high(ka, 77);\n  166 | \n  167 |     k[26] = rotate_left_low(kr, 94);\n  168 |     k[27] = rotate_left_high(kr, 94);\n  169 |     k[28] = rotate_left_low(ka, 94);\n  170 |     k[29] = rotate_left_high(ka, 94);\n  171 |     k[30] = rotate_left_low(kl, 111);\n  172 |     k[31] = rotate_left_high(kl, 111);\n  173 | \n  174 |     k[32] = rotate_left_low(kb, 111);\n  175 |     k[33] = rotate_left_high(kb, 111);","lines":15,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/camellia/src/utils.rs#L161-L175"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`rc6` declares `zeroize = []` - a feature that enables nothing - and the string `feature` does not appear anywhere under `rc6/src`, so `--features zeroize` is a complete no-op. `RC6` has no `Drop` and no `ZeroizeOnDrop` impl, so its expanded `key_table` (the full round-key schedule) is left in memory when the cipher is dropped. Every other cipher in the workspace zeroizes its round keys (`aes`, `aria`, `belt-block`, `blowfish`, `camellia`, `cast5`, `cast6`, `des`, `gift-cipher`, `idea`, `kuznyechik`, `magma`, `rc2`, `rc5`, `serpent`, `sm4`, `speck-cipher`, `threefish`, `twofish`, `xtea`), and the closely related `rc5` crate does exactly this for its own `key_table`. Compounding the problem, `rc6/Cargo.toml` enables `cipher`'s `zeroize` feature *unconditionally* (`cipher = { version = \"0.5\", features = [\"zeroize\"] }`) because `Word: DefaultIsZeroes` is an unconditional bound, so users pay for the `zeroize` dependency without getting any zeroization.","fix":"Mirror `rc5`: gate the `DefaultIsZeroes` bound behind a sealed trait selected by `#[cfg(feature = \"zeroize\")]` (see `rc5/src/primitives.rs`), change the manifest to `cipher = \"0.5\"` plus `zeroize = [\"cipher/zeroize\"]`, and add\n```rust\nimpl<W, R, B> Drop for RC6<W, R, B> /* same where-clauses as the struct */ {\n    fn drop(&mut self) {\n        #[cfg(feature = \"zeroize\")]\n        self.key_table.zeroize()\n    }\n}\n\n#[cfg(feature = \"zeroize\")]\nimpl<W, R, B> ZeroizeOnDrop for RC6<W, R, B> /* same where-clauses */ {}\n```","locations":[{"ref":"rc6/Cargo.toml:14-21","code":"   14 | [dependencies]\n   15 | cipher = { version = \"0.5\", features = [\"zeroize\"] }\n   16 | \n   17 | [dev-dependencies]\n   18 | cipher = { version = \"0.5\", features = [\"dev\"] }\n   19 | \n   20 | [features]\n   21 | zeroize = []","lines":8,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc6/Cargo.toml#L14-L21"},{"ref":"rc6/src/core/backend.rs:17-29","code":"   17 | pub struct RC6<W, R, B>\n   18 | where\n   19 |     W: Word,\n   20 |     R: Unsigned,\n   21 |     R: IsLess<U256>,\n   22 |     // ExpandedKeyTableSize\n   23 |     R: Add<U2>,\n   24 |     Sum<R, U2>: Mul<U2>,\n   25 |     ExpandedKeyTableSize<R>: ArraySize,\n   26 | {\n   27 |     key_table: ExpandedKeyTable<W, R>,\n   28 |     _key_size: PhantomData<B>,\n   29 | }","lines":13,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc6/src/core/backend.rs#L17-L29"},{"ref":"rc6/src/core/primitives.rs:1-5","code":"    1 | use cipher::{\n    2 |     array::{Array, ArraySize},\n    3 |     typenum::{Diff, Prod, Quot, Sum, U1, U2, U4, U8},\n    4 |     zeroize::DefaultIsZeroes,\n    5 | };","lines":5,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc6/src/core/primitives.rs#L1-L5"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`cipher_round_par_generic` and `equiv_inv_cipher_round_par_generic` iterate the 8-block input with\n`blocks.chunks_exact_mut(blocks_per_batch)` where `blocks_per_batch = <W as Word>::Blocks::USIZE`.\n`chunks_exact_mut` silently discards a trailing partial chunk, so if a `Word` implementation whose\n`Blocks` does not divide 8 is ever added (the `Word` trait is explicitly designed to be extended to\nwider SIMD words - `Blocks = U6` or `U16` are plausible), these functions would return some blocks\ncompletely untransformed with no panic and no error. The bug would only surface as wrong hazmat\noutput, not as a crash.","fix":"Assert the assumption where it is made, e.g. at the top of both functions:\n```rust\nconst { assert!(8 % <<W as Word>::Blocks>::USIZE == 0, \"batch size must divide Block8\") }\n```\n(or handle the remainder explicitly with `chunks_mut` plus zero-padding of the partial batch).","locations":[{"ref":"aes/src/backends/fixslice/hazmat.rs:29-34","code":"   29 | fn cipher_round_par_generic<W: Word>(blocks: &mut Block8, round_keys: &Block8) {\n   30 |     let blocks_per_batch = <<W as Word>::Blocks>::USIZE;\n   31 |     for (chunk, keys) in blocks\n   32 |         .chunks_exact_mut(blocks_per_batch)\n   33 |         .zip(round_keys.chunks_exact(blocks_per_batch))\n   34 |     {","lines":6,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends/fixslice/hazmat.rs#L29-L34"},{"ref":"aes/src/backends/fixslice/hazmat.rs:65-70","code":"   65 | fn equiv_inv_cipher_round_par_generic<W: Word>(blocks: &mut Block8, round_keys: &Block8) {\n   66 |     let blocks_per_batch = <<W as Word>::Blocks>::USIZE;\n   67 |     for (chunk, keys) in blocks\n   68 |         .chunks_exact_mut(blocks_per_batch)\n   69 |         .zip(round_keys.chunks_exact(blocks_per_batch))\n   70 |     {","lines":6,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends/fixslice/hazmat.rs#L65-L70"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"The IDEA implementation defines `ROUNDS = 8` and `LENGTH_SUB_KEYS = ROUNDS * 6 + 4` in `consts.rs`, but then hardcodes the derived values in three places: `invert_sub_keys` uses the literal `8` in `if i > 0 && i < 8` (should be `i < ROUNDS`), `crypt` indexes the output-transform keys as `sub_keys[48]`..`sub_keys[51]` (should be `ROUNDS * 6`..`ROUNDS * 6 + 3`), and `KeyInit::new` allocates `[0u16; 52]` instead of `[0u16; LENGTH_SUB_KEYS]`. The constants therefore only look configurable: changing `ROUNDS` would silently produce a wrong cipher (the `i < 8` swap condition and the `48..51` indices would no longer match) rather than a compile error.","fix":"Express all three in terms of the constants, e.g. `if i > 0 && i < ROUNDS`, `let last = ROUNDS * 6;` followed by `sub_keys[last]`, `sub_keys[last + 1]`, `sub_keys[last + 2]`, `sub_keys[last + 3]`, and `enc_keys: [0u16; LENGTH_SUB_KEYS]` / `dec_keys: [0u16; LENGTH_SUB_KEYS]`. If IDEA's round count is not meant to be configurable, delete `ROUNDS`-derived indirection instead and add `const _: () = assert!(ROUNDS == 8);` so the assumption is checked at compile time.","locations":[{"ref":"idea/src/lib.rs:78-85","code":"   78 |             let j = i * 6;\n   79 |             let l = k - j;\n   80 | \n   81 |             let (m, n) = if i > 0 && i < 8 { (2, 1) } else { (1, 2) };\n   82 | \n   83 |             self.dec_keys[j] = self.mul_inv(self.enc_keys[l]);\n   84 |             self.dec_keys[j + 1] = self.add_inv(self.enc_keys[l + m]);\n   85 |             self.dec_keys[j + 2] = self.add_inv(self.enc_keys[l + n]);","lines":8,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/idea/src/lib.rs#L78-L85"},{"ref":"idea/src/lib.rs:123-126","code":"  123 |         let y1 = self.mul(x1, sub_keys[48]);\n  124 |         let y2 = self.add(x3, sub_keys[49]);\n  125 |         let y3 = self.add(x2, sub_keys[50]);\n  126 |         let y4 = self.mul(x4, sub_keys[51]);","lines":4,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/idea/src/lib.rs#L123-L126"},{"ref":"idea/src/lib.rs:193-196","code":"  193 |         let mut cipher = Self {\n  194 |             enc_keys: [0u16; 52],\n  195 |             dec_keys: [0u16; 52],\n  196 |         };","lines":4,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/idea/src/lib.rs#L193-L196"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"The backend selection in `lib.rs` gates the NEON backend only on `target_arch = \"aarch64\"` and `target_feature = \"neon\"`, with no `target_endian = \"little\"` requirement. `target_arch` is also `\"aarch64\"` for the big-endian `aarch64_be-*` targets, so those builds get the NEON backend, whose index computation assumes a little-endian byte/element mapping: `vcreate_u8(0x0706050403020100)` relies on the `u64` being laid out with `0x00` first, and `vreinterpretq_u16_u8(vzip1q_u8(block, ind))` + `vshlq_n_u16(.., 4)` relies on the low byte of each `u16` lane being the message byte and the high byte being the position index. On a big-endian target the two bytes swap roles and the computed table offset becomes `4096 * block[i] + 16 * i (mod 65536)` instead of `4096 * i + 16 * block[i]`, i.e. wrong (still in bounds and still 16-byte aligned, so it fails silently rather than trapping). Note that the scalar `big_soft::transform` does handle big-endian explicitly (`#[cfg(target_endian = \"big\")] let res = res.swap_bytes();`), so the omission here looks like an oversight rather than a decision; at a minimum the NEON path is unverified on BE because CI cannot run those tier-3 targets.","fix":"Add an endianness guard to the SIMD branches so big-endian aarch64 falls back to the endian-correct `big_soft` backend:\n```rust\n} else if #[cfg(all(\n    target_arch = \"aarch64\",\n    target_endian = \"little\",\n    target_feature = \"neon\",\n    not(any(kuznyechik_backend = \"soft\", kuznyechik_backend = \"compact_soft\")),\n))] {\n```","locations":[{"ref":"kuznyechik/src/lib.rs:58-65","code":"   58 |     } else if #[cfg(all(\n   59 |         target_arch = \"aarch64\",\n   60 |         target_feature = \"neon\",\n   61 |         not(any(kuznyechik_backend = \"soft\", kuznyechik_backend = \"compact_soft\")),\n   62 |     ))] {\n   63 |         mod fused_tables;\n   64 |         mod neon;\n   65 |         use neon as imp;","lines":8,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/lib.rs#L58-L65"},{"ref":"kuznyechik/src/neon/backends.rs:101-107","code":"  101 |     let ind = vcombine_u8(\n  102 |         vcreate_u8(0x0706050403020100),\n  103 |         vcreate_u8(0x0f0e0d0c0b0a0908),\n  104 |     );\n  105 |     let test = vzip1q_u8(block, ind);\n  106 | \n  107 |     let lind = vshlq_n_u16(vreinterpretq_u16_u8(test), 4);","lines":7,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/neon/backends.rs#L101-L107"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`ROUNDS` is only ever read by `decrypt_block`, which seeds `sum` with `DELTA.wrapping_mul(ROUNDS as u32)`. `encrypt_block` does not reference `ROUNDS` at all - it hardcodes its iteration count as four literal `for _ in 0..8` loops. The two halves of the cipher are therefore parameterised by two independent sources of truth: editing `ROUNDS` in `consts.rs` silently changes only the decryption schedule and breaks the encrypt/decrypt round-trip, with no compile error. `ROUNDS` is also undocumented and ambiguously named: `32` is the number of XTEA *cycles* (double-rounds), i.e. 64 Feistel rounds, so a reader may reasonably think it is wrong by a factor of 2.","fix":"Document the constant and derive the encryption loop bound from it, e.g. change `consts.rs` to\n```rust\n/// Round constant, `floor(2^32 / phi)`.\npub const DELTA: u32 = 0x9e3779b9;\n/// Number of XTEA cycles (double rounds); the cipher performs `2 * ROUNDS` Feistel rounds.\npub const ROUNDS: usize = 32;\n```\nand drive the encrypt loop with `for _ in 0..ROUNDS / 8 { for _ in 0..8 { ... } }` (see the duplicate-code finding), optionally adding `const { assert!(ROUNDS % 8 == 0) }` so a bad value fails to compile.","locations":[{"ref":"xtea/src/consts.rs:1-2","code":"    1 | pub const DELTA: u32 = 0x9e3779b9;\n    2 | pub const ROUNDS: usize = 32;","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/xtea/src/consts.rs#L1-L2"},{"ref":"xtea/src/lib.rs:87-101","code":"   87 |         let mut sum = 0u32;\n   88 | \n   89 |         // Use 4 loops as otherwise unrolling will not be performed by default\n   90 |         for _ in 0..8 {\n   91 |             v0 = v0.wrapping_add(\n   92 |                 (((v1 << 4) ^ (v1 >> 5)).wrapping_add(v1))\n   93 |                     ^ sum.wrapping_add(self.k[(sum & 3) as usize]),\n   94 |             );\n   95 |             sum = sum.wrapping_add(DELTA);\n   96 |             v1 = v1.wrapping_add(\n   97 |                 (((v0 << 4) ^ (v0 >> 5)).wrapping_add(v0))\n   98 |                     ^ sum.wrapping_add(self.k[((sum >> 11) & 3) as usize]),\n   99 |             );\n  100 |         }\n  101 |         for _ in 0..8 {","lines":15,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/xtea/src/lib.rs#L87-L101"},{"ref":"xtea/src/lib.rs:154-157","code":"  154 |         let mut sum = DELTA.wrapping_mul(ROUNDS as u32);\n  155 | \n  156 |         // Same as encrypt, just in reverse\n  157 |         for _ in 0..8 {","lines":4,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/xtea/src/lib.rs#L154-L157"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"medium","description":"`AlgorithmName::write_alg_name` and `fmt::Debug::fmt` for `RC5` both print the round count twice and never\nprint the key size: the third `{}` is fed `<R as Unsigned>::to_u8()` again instead of `B`. They also print\nthe Rust type name of the word instead of the word size in bits, so the RC5-w/r/b parameter triple comes out\nwrong. Verified: `RC5<u32, U12, U16>` formats as `RC5 - u32/12/12`, whereas the conventional name is\n`RC5-32/12/16`. `AlgorithmName` is used to build names for higher-level constructions, so the wrong string\npropagates into other crates' output.","fix":"Add a `B: Unsigned` bound to both impls (`ArraySize: Unsigned`, so `B: ArraySize` also works) and print the\nreal triple:\n```rust\nwrite!(\n    f,\n    \"RC5-{}/{}/{}\",\n    8 * <W::Bytes as Unsigned>::USIZE,\n    <R as Unsigned>::USIZE,\n    <B as Unsigned>::USIZE,\n)\n```\nwith ` {{ ... }}` appended in the `Debug` impl. Add a test asserting the formatted name.","locations":[{"ref":"rc5/src/lib.rs:426-434","code":"  426 |     fn write_alg_name(f: &mut fmt::Formatter<'_>) -> fmt::Result {\n  427 |         write!(\n  428 |             f,\n  429 |             \"RC5 - {}/{}/{}\",\n  430 |             core::any::type_name::<W>(),\n  431 |             <R as Unsigned>::to_u8(),\n  432 |             <R as Unsigned>::to_u8(),\n  433 |         )\n  434 |     }","lines":9,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc5/src/lib.rs#L426-L434"},{"ref":"rc5/src/lib.rs:452-460","code":"  452 |     fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {\n  453 |         write!(\n  454 |             f,\n  455 |             \"RC5 - {}/{}/{} {{ ... }}\",\n  456 |             core::any::type_name::<W>(),\n  457 |             <R as Unsigned>::to_u8(),\n  458 |             <R as Unsigned>::to_u8(),\n  459 |         )\n  460 |     }","lines":9,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc5/src/lib.rs#L452-L460"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"`AlgorithmName::write_alg_name` for `RC6` formats the round count `R` twice and never\nprints the key size `B`, so the reported algorithm name is wrong for every\nparameterisation where `R != B`. Verified at runtime: `RC6<u32, U20, U16>` reports\n`RC6 - u32/20/20` instead of `RC6 - u32/20/16`, and `RC6<u8, U12, U4>` reports\n`RC6 - u8/12/12` instead of `RC6 - u8/12/4`. This name is what `cipher`'s wrappers\n(e.g. `Debug`/`AlgorithmName` plumbing in higher-level modes) surface to users, so it\nsilently misidentifies the cipher. The identical copy-paste bug exists twice in\n`rc5/src/lib.rs` (`write_alg_name` and `fmt::Debug`).","fix":"Print `B` for the third field and add the missing bound. Before:\n\n```rust\nwrite!(\n    f,\n    \"RC6 - {}/{}/{}\",\n    core::any::type_name::<W>(),\n    <R as Unsigned>::to_u8(),\n    <R as Unsigned>::to_u8(),\n)\n```\n\nAfter (also add `B: Unsigned,` to this `impl`'s `where` clause; `to_usize` avoids\ntruncating, since this `impl` does not constrain `B < 256`):\n\n```rust\nwrite!(\n    f,\n    \"RC6 - {}/{}/{}\",\n    core::any::type_name::<W>(),\n    <R as Unsigned>::to_usize(),\n    <B as Unsigned>::to_usize(),\n)\n```\n\nApply the same correction to both spots in `rc5/src/lib.rs`.","locations":[{"ref":"rc6/src/block_cipher.rs:323-331","code":"  323 |     fn write_alg_name(f: &mut core::fmt::Formatter<'_>) -> core::fmt::Result {\n  324 |         write!(\n  325 |             f,\n  326 |             \"RC6 - {}/{}/{}\",\n  327 |             core::any::type_name::<W>(),\n  328 |             <R as Unsigned>::to_u8(),\n  329 |             <R as Unsigned>::to_u8(),\n  330 |         )\n  331 |     }","lines":9,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc6/src/block_cipher.rs#L323-L331"}]},
{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"The `fmt::Debug` implementation for `TdesEde3` prints `\"TdesEee3 { ... }\"` - the name of a *different* cipher in the same file. Any log line, `assert` failure or `{:?}` dump involving a `TdesEde3` value mislabels it as the (much weaker, non-standard) E-E-E variant. Note that `AlgorithmName::write_alg_name` on the very next lines correctly writes `\"TdesEde3\"`, so the two name sources disagree.","fix":"Change the string literal in `impl fmt::Debug for TdesEde3`:\n\nbefore\n```rust\n        f.write_str(\"TdesEee3 { ... }\")\n```\nafter\n```rust\n        f.write_str(\"TdesEde3 { ... }\")\n```","locations":[{"ref":"des/src/tdes.rs:84-88","code":"   84 | impl fmt::Debug for TdesEde3 {\n   85 |     fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {\n   86 |         f.write_str(\"TdesEee3 { ... }\")\n   87 |     }\n   88 | }","lines":5,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/des/src/tdes.rs#L84-L88"},{"ref":"des/src/tdes.rs:90-94","code":"   90 | impl AlgorithmName for TdesEde3 {\n   91 |     fn write_alg_name(f: &mut fmt::Formatter<'_>) -> fmt::Result {\n   92 |         f.write_str(\"TdesEde3\")\n   93 |     }\n   94 | }","lines":5,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/des/src/tdes.rs#L90-L94"}]},
{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"easy","description":"The `get!` and `next_const!` macros in the NEON backend carry the comments \"correct alignment of `p` is guaranteed since offset values are shifted by 4 bits left and the table is aligned to 16 bytes\" plus `debug_assert_eq!(p as usize % 16, 0)`, copied verbatim from the SSE2 backend. There the assertion is load-bearing because `_mm_load_si128` requires 16-byte alignment; the NEON code uses `vld1q_u8`, which has no alignment requirement at all. The comment therefore documents a constraint that does not exist on this backend and the `debug_assert` is dead weight in test builds, which is exactly the kind of artefact that makes a reader trust a copied block more than they should.","fix":"Drop the two `debug_assert_eq!` lines and reword the comments to state the real invariant, e.g. \"`idx` is a multiple of 16 and at most `16 * 4095`, so the 16-byte load stays inside the table; `vld1q_u8` needs no alignment\".","locations":[{"ref":"kuznyechik/src/neon/backends.rs:84-93","code":"   84 |     macro_rules! get {\n   85 |         ($table:expr, $ind:expr, $i:expr) => {{\n   86 |             let idx = vgetq_lane_u16($ind, $i) as usize;\n   87 |             let p = $table.0.as_ptr().add(idx);\n   88 |             // correct alignment of `p` is guaranteed since offset values\n   89 |             // are shifted by 4 bits left and the table is aligned to 16 bytes\n   90 |             debug_assert_eq!(p as usize % 16, 0);\n   91 |             vld1q_u8(p)\n   92 |         }};\n   93 |     }","lines":10,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/neon/backends.rs#L84-L93"},{"ref":"kuznyechik/src/neon/backends.rs:134-143","code":"  134 |     macro_rules! next_const {\n  135 |         ($i:expr) => {{\n  136 |             let p = KEYGEN.as_ptr() as *const uint8x16_t;\n  137 |             // correct alignment of `p` is guaranteed since the table\n  138 |             // is aligned to 16 bytes\n  139 |             let p = p.add($i);\n  140 |             debug_assert_eq!(p as usize % 16, 0);\n  141 |             $i += 1;\n  142 |             vld1q_u8(p as *const u8)\n  143 |         }};","lines":10,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/neon/backends.rs#L134-L143"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`InvalidLengthError`, the error type returned by the public `belt_wblock_enc` / `belt_wblock_dec`\nfunctions, only derives `Debug`, `Copy` and `Clone`. It implements neither `core::fmt::Display` nor\n`core::error::Error`, so callers cannot propagate it with `?` into `Box<dyn Error>`, `anyhow`, or\nany `Display`-based error chain; they are forced to map it manually. `cipher::InvalidLength`, the\nanalogous type used by `blowfish`, implements both.","fix":"Add the standard impls:\n```rust\nimpl core::fmt::Display for InvalidLengthError {\n    fn fmt(&self, f: &mut core::fmt::Formatter<'_>) -> core::fmt::Result {\n        f.write_str(\"belt-wblock input must be at least 32 bytes long\")\n    }\n}\n\nimpl core::error::Error for InvalidLengthError {}\n```\n(`core::error::Error` is available on the crate's declared MSRV of 1.85.)","locations":[{"ref":"belt-block/src/lib.rs:163-165","code":"  163 | /// Error used when data smaller than 32 bytes is passed to the `belt-wblock` functions.\n  164 | #[derive(Debug, Copy, Clone)]\n  165 | pub struct InvalidLengthError;","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/belt-block/src/lib.rs#L163-L165"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"`Sbox` is a public, user-implementable trait, but the documented contract omits the crucial constraint that\nevery `SBOX` entry must be a 4-bit value (`0..=15`); `gen_exp_sbox` combines two entries with\n`sbox[2 * i][j] + (sbox[2 * i + 1][k] << 4)`, which is only a nibble concatenation under that assumption.\nVerified: implementing `Sbox` with any entry above 15 fails to compile with\n`error[E0080]: attempt to compute `200_u8 + 128_u8`, which would overflow`, pointing at\n`magma/src/sboxes.rs:38`/`:14` - i.e. the error blames magma's internals, not the user's table, and gives no\nhint about the real rule. Entries in `16..=31` do not even error, they silently corrupt the neighbouring\nnibble.","fix":"Document the requirement on the trait (`/// Each entry must be in the range 0..=15.`) and make the\ncombination non-overflowing plus self-checking:\n```rust\nlet v: u8 = (sbox[2 * i][j] & 0x0f) | ((sbox[2 * i + 1][k] & 0x0f) << 4);\n```\ntogether with an explicit `assert!(sbox[2 * i][j] < 16, \"S-box entries must be 4-bit values\")` in the\n`const fn`, so a bad table fails with a readable message.","locations":[{"ref":"magma/src/sboxes.rs:6-24","code":"    6 | const fn gen_exp_sbox(sbox: &SmallSbox) -> ExpSbox {\n    7 |     let mut out = [[0u8; 256]; 4];\n    8 |     let mut i = 0;\n    9 |     while i < 4 {\n   10 |         let mut j = 0;\n   11 |         while j < 16 {\n   12 |             let mut k = 0;\n   13 |             while k < 16 {\n   14 |                 let v: u8 = sbox[2 * i][j] + (sbox[2 * i + 1][k] << 4);\n   15 |                 let c: usize = j + (k << 4);\n   16 |                 out[i][c] = v;\n   17 |                 k += 1;\n   18 |             }\n   19 |             j += 1;\n   20 |         }\n   21 |         i += 1;\n   22 |     }\n   23 |     out\n   24 | }","lines":19,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/magma/src/sboxes.rs#L6-L24"},{"ref":"magma/src/sboxes.rs:26-32","code":"   26 | /// Trait for GOST 28147-89 cipher S-boxes\n   27 | pub trait Sbox {\n   28 |     /// S-Box name\n   29 |     const NAME: &'static str;\n   30 |     /// Unexpanded S-box\n   31 |     const SBOX: SmallSbox;\n   32 | }","lines":7,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/magma/src/sboxes.rs#L26-L32"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`RC6`'s generic parameters are gated on a trait that no downstream crate can name.\n`rc6/src/lib.rs` declares `mod core;` privately and re-exports only `RC6` and the four\nconcrete aliases, so `Word` (declared `pub trait Word` in `rc6/src/core/primitives.rs`)\nis unreachable - verified: `fn f<W: rc6::Word>() {}` fails with\n`error[E0405]: cannot find trait \\`Word\\` in crate \\`rc6\\``. The same holds for `rc5`\n(`error[E0603]: trait \\`Word\\` is private`). Consequences: callers cannot write any code\ngeneric over the word type or the cipher parameters, the trait and the\n`BlockSize`/`ExpandedKeyTableSize`/`KeyAsWordsSize` aliases that appear in every public\nbound are invisible in rustdoc, and users are limited to the four hard-coded aliases even\nthough the type is generic. Additionally, `rc6`'s `Word` is *not* sealed (unlike `rc5`,\nwhich has `private::Sealed`), so if it is ever exported as-is a downstream impl with a\n`Bytes` that disagrees with the real byte width would break the invariant that\n`words_from_block`'s `// Block size is 4 * word::BYTES so the unwrap is safe` comment\ndepends on, turning those `unwrap()`s into panics.","fix":"Either commit to the generic API and export it, or make the leak impossible:\n\n- Export it: add `pub use crate::core::{BlockSize, ExpandedKeyTableSize, KeyAsWordsSize, Word};`\n  to `rc6/src/lib.rs` (and the analogous `pub use primitives::Word;` in `rc5/src/lib.rs`)\n  **and** seal `Word` first by copying `rc5`'s `mod private { pub trait Sealed {} }`\n  pattern into `rc6/src/core/primitives.rs` so the `Bytes` invariant cannot be violated\n  downstream.\n- Or keep it internal: change `pub trait Word` to `pub(crate) trait Word` and the aliases\n  to `pub(crate)`, enable `#![warn(unreachable_pub)]` in `rc6/src/lib.rs` so the mismatch\n  is caught, and document that only the four aliases are supported.","location
