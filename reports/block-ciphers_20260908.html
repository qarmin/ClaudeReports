"  130 | #[inline]\n  131 | pub(crate) fn unpacking(state: &[u32], output: &mut [u8; 16]) {\n  132 |     let (mut s0, mut s1, mut s2, mut s3) = (state[0], state[1], state[2], state[3]);","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/gift-cipher/src/primitives.rs#L130-L132"},{"ref":"gift-cipher/src/primitives.rs:166-167","code":"  166 | #[inline]\n  167 | pub(crate) fn quintuple_round(state: &mut [u32; 4], rkey: &[u32], rconst: &[u32]) {","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/gift-cipher/src/primitives.rs#L166-L167"},{"ref":"gift-cipher/src/primitives.rs:216-217","code":"  216 | #[inline]\n  217 | pub(crate) fn inv_quintuple_round(state: &mut [u32; 4], rkey: &[u32], rconst: &[u32]) {","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/gift-cipher/src/primitives.rs#L216-L217"},{"ref":"gift-cipher/src/primitives.rs:1-4","code":"    1 | #[inline]\n    2 | pub(crate) fn u32big(x: &[u8]) -> u32 {\n    3 |     ((x[0] as u32) << 24) | ((x[1] as u32) << 16) | ((x[2] as u32) << 8) | (x[3] as u32)\n    4 | }","lines":4,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/gift-cipher/src/primitives.rs#L1-L4"}]},
{"id":"PERF_17","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`l_step` takes and returns `[u8; 16]` by value and carries no `#[inline]` attribute, while its helpers\n`get_idx`/`get_m` are `#[inline(always)]`. It is the innermost hot function of the `compact_soft` backend,\nwhich calls it 16 times per `lsx`/`lsx_inv` (i.e. 160 times per block, `kuznyechik/src/compact_soft/backends.rs`\n`block.0 = l_step(block.0, i)`), so every call is a 16-byte copy in and a 16-byte copy out unless the\noptimizer happens to inline across codegen units.","fix":"Add `#[inline(always)]` to `l_step`, and preferably change it to operate in place -\n`pub(crate) const fn l_step(msg: &mut [u8; 16], i: usize)` - which is allowed in `const fn` since Rust 1.83\n(the crate's `rust-version` is 1.85) and removes the copies at every call site.","locations":[{"ref":"kuznyechik/src/utils.rs:13-32","code":"   13 | pub(crate) const fn l_step(mut msg: [u8; 16], i: usize) -> [u8; 16] {\n   14 |     let mut x = msg[get_idx(15, i)];\n   15 |     x ^= GFT_148[get_m(msg, 14, i)];\n   16 |     x ^= GFT_32[get_m(msg, 13, i)];\n   17 |     x ^= GFT_133[get_m(msg, 12, i)];\n   18 |     x ^= GFT_16[get_m(msg, 11, i)];\n   19 |     x ^= GFT_194[get_m(msg, 10, i)];\n   20 |     x ^= GFT_192[get_m(msg, 9, i)];\n   21 |     x ^= msg[get_idx(8, i)];\n   22 |     x ^= GFT_251[get_m(msg, 7, i)];\n   23 |     x ^= msg[get_idx(6, i)];\n   24 |     x ^= GFT_192[get_m(msg, 5, i)];\n   25 |     x ^= GFT_194[get_m(msg, 4, i)];\n   26 |     x ^= GFT_16[get_m(msg, 3, i)];\n   27 |     x ^= GFT_133[get_m(msg, 2, i)];\n   28 |     x ^= GFT_32[get_m(msg, 1, i)];\n   29 |     x ^= GFT_148[get_m(msg, 0, i)];\n   30 |     msg[get_idx(15, i)] = x;\n   31 |     msg\n   32 | }","lines":20,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/utils.rs#L13-L32"}]},
{"id":"PERF_18","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`SboxExt::apply_sbox` and `SboxExt::g` carry no `#[inline]` attribute even though `g` is invoked 32 times\nper 8-byte block (once per Feistel round) and `apply_sbox` contains a 4-iteration mask/shift loop. Every\nother function on the hot path in this crate is annotated (`encrypt_block`, `decrypt_block`, `to_u32`), so\nthese two are the odd ones out; without the hint the round function may stay an out-of-line call in each\nmonomorphisation.","fix":"Annotate both default methods:\n```rust\n    #[inline(always)]\n    fn apply_sbox(a: u32) -> u32 {\n    ...\n    #[inline(always)]\n    fn g(a: u32, k: u32) -> u32 {\n```\nWhile there, `v += (Self::EXP_SBOX[i][k] as u32) << shift` is better written `v |= ...` since the bytes are\ndisjoint by construction.","locations":[{"ref":"magma/src/sboxes.rs:40-54","code":"   40 |     /// Apply S-box and return result\n   41 |     fn apply_sbox(a: u32) -> u32 {\n   42 |         let mut v = 0;\n   43 |         for i in 0..4 {\n   44 |             let shift = 8 * i;\n   45 |             let k = ((a & (0xffu32 << shift)) >> shift) as usize;\n   46 |             v += (Self::EXP_SBOX[i][k] as u32) << shift;\n   47 |         }\n   48 |         v\n   49 |     }\n   50 | \n   51 |     /// Function `g` based on the S-box\n   52 |     fn g(a: u32, k: u32) -> u32 {\n   53 |         Self::apply_sbox(a.wrapping_add(k)).rotate_left(11)\n   54 |     }","lines":15,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/magma/src/sboxes.rs#L40-L54"}]},
{"id":"PERF_19","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`RC5::encrypt_with_backend` and `RC5::decrypt_with_backend` are not annotated `#[inline]`, unlike the\nequivalent methods in the sibling crates (`rc2/src/lib.rs:184` and `magma/src/lib.rs:118` both use\n`#[inline]`). These are the per-call entry points into the cipher, and the closure-based backend dispatch\nonly collapses into a tight loop if they are inlined into the caller's crate.","fix":"Add the attribute to both:\n```rust\n    #[inline]\n    fn encrypt_with_backend(&self, f: impl BlockCipherEncClosure<BlockSize = Self::BlockSize>) {\n```","locations":[{"ref":"rc5/src/lib.rs:294-297","code":"  294 | {\n  295 |     fn encrypt_with_backend(&self, f: impl BlockCipherEncClosure<BlockSize = Self::BlockSize>) {\n  296 |         f.call(self)\n  297 |     }","lines":4,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc5/src/lib.rs#L294-L297"},{"ref":"rc5/src/lib.rs:364-367","code":"  364 | {\n  365 |     fn decrypt_with_backend(&self, f: impl BlockCipherDecClosure<BlockSize = Self::BlockSize>) {\n  366 |         f.call(self)\n  367 |     }","lines":4,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc5/src/lib.rs#L364-L367"}]},
{"id":"PERF_20","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`log_w` (the RC6 `lg w` rotation amount) is recomputed on every single block, in both\n`encrypt` and `decrypt`, from\n`W::from((usize::BITS - 1 - (W::Bytes::USIZE * 8).leading_zeros()) as u8)` - a value that\nis fully determined by the `Word` type and belongs in key expansion or, better, in the\ntrait as an associated const. The same applies to the `W::from(2)` and `W::from(1)`\nconversions inside the per-round hot loop, even though the `Word` trait already carries\n`ZERO`/`THREE`/`EIGHT` constants for exactly this purpose. The expression is also\nplatform-coupled and fragile: it mixes `usize::BITS` with `leading_zeros()` on a `usize`\nvalue, and would underflow (`0 - 1` on the subtraction) for any hypothetical\n`Bytes = U0`.","fix":"Add associated constants to `Word` in `rc6/src/core/primitives.rs`:\n\n```rust\nconst ONE: Self;\nconst TWO: Self;\nconst LG_W: Self;   // 3 for u8, 4 for u16, 5 for u32, 6 for u64\n```\n\nthen delete both `let log_w = ...` lines and use `W::LG_W`, `W::TWO`, `W::ONE` in the\nround functions.","locations":[{"ref":"rc6/src/core/backend.rs:139-155","code":"  139 |     pub fn encrypt(&self, mut block: InOut<'_, '_, Block<W>>) {\n  140 |         let (mut a, mut b, mut c, mut d) = Self::words_from_block(block.get_in());\n  141 |         let key = &self.key_table;\n  142 |         let log_w = W::from((usize::BITS - 1 - (W::Bytes::USIZE * 8).leading_zeros()) as u8);\n  143 | \n  144 |         b = b.wrapping_add(key[0]);\n  145 |         d = d.wrapping_add(key[1]);\n  146 | \n  147 |         for i in 1..=R::USIZE {\n  148 |             let t = b\n  149 |                 .wrapping_mul(b.wrapping_mul(W::from(2)).wrapping_add(W::from(1)))\n  150 |                 .rotate_left(log_w);\n  151 |             let u = d\n  152 |                 .wrapping_mul(d.wrapping_mul(W::from(2)).wrapping_add(W::from(1)))\n  153 |                 .rotate_left(log_w);\n  154 |             a = a.bitxor(t).rotate_left(u).wrapping_add(key[2 * i]);\n  155 |             c = c.bitxor(u).rotate_left(t).wrapping_add(key[2 * i + 1]);","lines":17,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc6/src/core/backend.rs#L139-L155"},{"ref":"rc6/src/core/backend.rs:169-188","code":"  169 |     pub fn decrypt(&self, mut block: InOut<'_, '_, Block<W>>) {\n  170 |         let (mut a, mut b, mut c, mut d) = Self::words_from_block(block.get_in());\n  171 |         let key = &self.key_table;\n  172 |         let log_w = W::from((usize::BITS - 1 - (W::Bytes::USIZE * 8).leading_zeros()) as u8);\n  173 | \n  174 |         c = c.wrapping_sub(key[2 * R::USIZE + 3]);\n  175 |         a = a.wrapping_sub(key[2 * R::USIZE + 2]);\n  176 | \n  177 |         for i in (1..=R::USIZE).rev() {\n  178 |             let tmp = d;\n  179 |             d = c;\n  180 |             c = b;\n  181 |             b = a;\n  182 |             a = tmp;\n  183 |             let u = d\n  184 |                 .wrapping_mul(d.wrapping_mul(W::from(2)).wrapping_add(W::from(1)))\n  185 |                 .rotate_left(log_w);\n  186 |             let t = b\n  187 |                 .wrapping_mul(b.wrapping_mul(W::from(2)).wrapping_add(W::from(1)))\n  188 |                 .rotate_left(log_w);","lines":20,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc6/src/core/backend.rs#L169-L188"}]},
{"id":"PERF_21","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`Serpent::new_from_slice` writes the bitsliced subkeys into a temporary flat `k: [u32; 132]` and then copies\nit word-for-word into `round_keys` in a second pass. The intermediate array is pure overhead: 528 bytes of\nextra stack, a redundant 132-word copy, and one more un-zeroized copy of the round keys left on the stack.\nThe `for l in 0..4 { k[4 * i + l] = output[l]; }` inner loop can also just be an assignment.","fix":"Write the S-box output straight into `round_keys` and drop `k` entirely:\n```rust\nlet mut round_keys: RoundKeys = [[0; 4]; ROUNDS + 1];\nlet words = &words[8..];\nfor i in 0..ROUNDS + 1 {\n    let sbox_index = (ROUNDS + 3 - i) % ROUNDS;\n    let w: [u32; 4] = words[4 * i..][..4].try_into().unwrap();\n    round_keys[i] = bitslice::apply_s(sbox_index, w);\n}\n```","locations":[{"ref":"serpent/src/lib.rs:104-120","code":"  104 |         let r = ROUNDS + 1;\n  105 |         let words = &words[8..];\n  106 |         let mut k = [0u32; 132];\n  107 |         for i in 0..r {\n  108 |             let sbox_index = (ROUNDS + 3 - i) % ROUNDS;\n  109 |             let [a, b, c, d]: [u32; 4] = words[4 * i..][..4].try_into().unwrap();\n  110 |             // calculate keys in bitslicing mode\n  111 |             let output = bitslice::apply_s(sbox_index, [a, b, c, d]);\n  112 |             for l in 0..4 {\n  113 |                 k[4 * i + l] = output[l];\n  114 |             }\n  115 |         }\n  116 | \n  117 |         let mut round_keys: RoundKeys = [[0; 4]; ROUNDS + 1];\n  118 |         for (src, dst) in k.chunks_exact(4).zip(round_keys.iter_mut()) {\n  119 |             dst.copy_from_slice(src);\n  120 |         }","lines":17,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/serpent/src/lib.rs#L104-L120"}]},
{"id":"PERF_22","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`mix` and `inv_mix` are three-instruction hot helpers invoked `$n_w / 2 * $rounds` times per block (144 times\nfor `Threefish256`, 288 for `Threefish512`, 640 for `Threefish1024`) but carry no `#[inline]` attribute, while\ntheir callers `encrypt_block_u64`/`decrypt_block_u64` are `#[inline(always)]`. Because they are private\nnon-generic functions without `#[inline]`, their MIR is not available for cross-crate inlining, so when the\n`#[inline(always)]` callers are instantiated in a downstream crate every mix becomes a real function call. The\nsame happens inside the crate when `codegen-units > 1`.","fix":"Add `#[inline(always)]` to both helpers:\n```rust\n#[inline(always)]\nfn mix(r: u8, x: (u64, u64)) -> (u64, u64) { ... }\n\n#[inline(always)]\nfn inv_mix(r: u8, y: (u64, u64)) -> (u64, u64) { ... }\n```","locations":[{"ref":"threefish/src/lib.rs:42-52","code":"   42 | fn mix(r: u8, x: (u64, u64)) -> (u64, u64) {\n   43 |     let y0 = x.0.wrapping_add(x.1);\n   44 |     let y1 = x.1.rotate_left(r as u32) ^ y0;\n   45 |     (y0, y1)\n   46 | }\n   47 | \n   48 | fn inv_mix(r: u8, y: (u64, u64)) -> (u64, u64) {\n   49 |     let x1 = (y.0 ^ y.1).rotate_right(r as u32);\n   50 |     let x0 = y.0.wrapping_sub(x1);\n   51 |     (x0, x1)\n   52 | }","lines":11,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/threefish/src/lib.rs#L42-L52"}]},
{"id":"PERF_23","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`new_with_tweak`, `new_with_tweak_u64`, `encrypt_block_u64` and `decrypt_block_u64` are all marked\n`#[inline(always)]` even though they are large public functions: `encrypt_block_u64` for `Threefish1024` is an\n80-iteration outer loop over an 8-iteration inner loop plus a 21x16-word subkey table access, and\n`new_with_tweak_u64` is a full key schedule. Forcing these into every call site produces significant code\nbloat (and instruction-cache pressure) for no benefit, since the compiler cannot unroll the round loop anyway.","fix":"Downgrade `#[inline(always)]` to `#[inline]` on `new_with_tweak_u64`, `encrypt_block_u64` and\n`decrypt_block_u64` (keeping `#[inline(always)]` only on the trivial byte-oriented `new_with_tweak` wrapper),\nand instead add `#[inline(always)]` to the genuinely tiny `mix`/`inv_mix` helpers.","locations":[{"ref":"threefish/src/lib.rs:83-84","code":"   83 |             #[inline(always)]\n   84 |             pub fn new_with_tweak_u64(key: &[u64; $n_w], tweak: &[u64; 2]) -> $name {","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/threefish/src/lib.rs#L83-L84"},{"ref":"threefish/src/lib.rs:108-109","code":"  108 |             #[inline(always)]\n  109 |             pub fn encrypt_block_u64(&self, block: &mut [u64; $n_w]) {","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/threefish/src/lib.rs#L108-L109"},{"ref":"threefish/src/lib.rs:135-136","code":"  135 |             #[inline(always)]\n  136 |             pub fn decrypt_block_u64(&self, block: &mut [u64; $n_w]) {","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/threefish/src/lib.rs#L135-L136"}]},
{"id":"PERF_24","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"Both parallel hazmat helpers write each result block twice: first `chunk[i] = res[i]` copies 16\nbytes, then `xor_in_place(&mut chunk[i], &keys[i])` reads and rewrites the same 16 bytes byte by\nbyte. Two passes over every output block where one suffices.","fix":"Fuse the copy and the XOR:\n```rust\nfor i in 0..blocks_per_batch {\n    for (dst, (r, k)) in chunk[i].iter_mut().zip(res[i].iter().zip(keys[i].iter())) {\n        *dst = r ^ k;\n    }\n}\n```","locations":[{"ref":"aes/src/backends/fixslice/hazmat.rs:47-50","code":"   47 |         for i in 0..blocks_per_batch {\n   48 |             chunk[i] = res[i];\n   49 |             xor_in_place(&mut chunk[i], &keys[i]);\n   50 |         }","lines":4,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends/fixslice/hazmat.rs#L47-L50"},{"ref":"aes/src/backends/fixslice/hazmat.rs:83-86","code":"   83 |         for i in 0..blocks_per_batch {\n   84 |             chunk[i] = res[i];\n   85 |             xor_in_place(&mut chunk[i], &keys[i]);\n   86 |         }","lines":4,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends/fixslice/hazmat.rs#L83-L86"}]},
{"id":"PERF_25","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`fused_tables.rs` unconditionally instantiates two 64 KiB statics (`ENC_TABLE` and `DEC_TABLE`), so every build that does not use `kuznyechik_backend=\"compact_soft\"` carries 128 KiB of `.rodata` and pays for ~2 million const-eval steps at compile time, even for a `no_std` target that only ever encrypts (`KuznyechikEnc`). `DEC_TABLE` is only needed by `inv_enc_keys` and the decryption path, but because the `From<KuznyechikEnc> for KuznyechikDec` conversions are always compiled, dropping it depends entirely on linker section GC. For the embedded users a `no_std` cipher crate targets, 128 KiB can exceed total flash.","fix":"Document the cost in the crate-level backend documentation, and consider gating the decryption table so encryption-only firmware can avoid it, e.g. an additive feature/cfg such as `#[cfg(not(kuznyechik_no_decrypt))] pub(crate) static DEC_TABLE: Table = Align16(fused_dec_table());` with the decryption types and `inv_enc_keys` behind the same cfg.","locations":[{"ref":"kuznyechik/src/fused_tables.rs:7-9","code":"    7 | pub(crate) type Table = Align16<[u8; 16 * 4096]>;\n    8 | pub(crate) static ENC_TABLE: Table = Align16(fused_enc_table());\n    9 | pub(crate) static DEC_TABLE: Table = Align16(fused_dec_table());","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/fused_tables.rs#L7-L9"}]},
