{"id":"OTHER_55","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"`precompute_rkeys` is declared `pub` inside the private module `mod key_schedule;`. It is not actually reachable from outside the crate, so the visibility is misleading, inconsistent with every helper in `gift-cipher/src/primitives.rs` (all `pub(crate)`), and it also means the `missing_docs` lint enabled at the crate root does not cover it even though it reads like public API.","fix":"before\n```rust\npub fn precompute_rkeys(key: &[u8; 16]) -> [u32; 80] {\n```\nafter\n```rust\npub(crate) fn precompute_rkeys(key: &[u8; 16]) -> [u32; 80] {\n```","locations":[{"ref":"gift-cipher/src/key_schedule.rs:102-104","code":"  102 | pub fn precompute_rkeys(key: &[u8; 16]) -> [u32; 80] {\n  103 |     let mut rkey = [0u32; 80];\n  104 |     rkey[0] = u32big(&(key[12..16]));","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/gift-cipher/src/key_schedule.rs#L102-L104"}]},
{"id":"OTHER_56","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"Inside the round function the intermediate value is bound to `_t` (`let _t = self.add(y2 ^ y4, t0);`) and then used on the next line. A leading underscore conventionally marks a binding that is deliberately unused, so this is actively misleading and defeats the `unused_variables` lint's purpose for a reader scanning the round.","fix":"Before:\n```rust\nlet _t = self.add(y2 ^ y4, t0);\nlet t1 = self.mul(_t, sub_keys[j + 5]);\n```\nAfter:\n```rust\nlet t = self.add(y2 ^ y4, t0);\nlet t1 = self.mul(t, sub_keys[j + 5]);\n```","locations":[{"ref":"idea/src/lib.rs:112-115","code":"  112 |             let t0 = self.mul(y1 ^ y3, sub_keys[j + 4]);\n  113 |             let _t = self.add(y2 ^ y4, t0);\n  114 |             let t1 = self.mul(_t, sub_keys[j + 5]);\n  115 |             let t2 = self.add(t0, t1);","lines":4,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/idea/src/lib.rs#L112-L115"}]},
{"id":"OTHER_57","type":"other","type_label":"Other","severity":"negligible","difficulty":"easy","description":"`idea/src/tests.rs` asserts against 52 encryption and 52 decryption sub-keys given as bare hex literals with no comment saying where they come from. Unlike `idea/tests/mod.rs`, which cites the NESSIE test-vector URL, this test is unverifiable: if it ever fails, a maintainer cannot tell whether the implementation or the expected data is wrong, and the values could equally well have been generated by the implementation under test.","fix":"Add a doc comment naming the source of the vectors, e.g.\n```rust\n//! Key-schedule test vectors from <source of the expanded IDEA sub-keys>, key\n//! 0001 0002 0003 0004 0005 0006 0007 0008.\n```\nIf no published source exists, say so explicitly and note that they were cross-checked against a reference implementation.","locations":[{"ref":"idea/src/tests.rs:1-10","code":"    1 | use super::*;\n    2 | \n    3 | #[test]\n    4 | #[rustfmt::skip]\n    5 | fn test_sub_key_generation() {\n    6 |     let key: [u8; 16] = [\n    7 |         0x00, 0x01, 0x00, 0x02, 0x00, 0x03, 0x00, 0x04,\n    8 |         0x00, 0x05, 0x00, 0x06, 0x00, 0x07, 0x00, 0x08,\n    9 |     ];\n   10 |     let enc_keys: [u16; 52] = [","lines":10,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/idea/src/tests.rs#L1-L10"}]},
{"id":"OTHER_58","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"`compact_soft::lsx_inv` applies the inverse S-box with a reversed index expression (`for i in 0..16 { block[15 - i] = P_INV[block[15 - i] as usize]; }`). The inverse S-box is applied independently to each byte, so the order is irrelevant; writing it backwards mirrors the genuinely order-sensitive `l_step` loop above it and therefore suggests to the reader that the reversal is required for correctness.","fix":"Before:\n```rust\n// s_inv\nfor i in 0..16 {\n    block[15 - i] = P_INV[block[15 - i] as usize];\n}\n```\nAfter:\n```rust\n// s_inv (order is irrelevant, bytes are independent)\nfor b in block.iter_mut() {\n    *b = P_INV[*b as usize];\n}\n```","locations":[{"ref":"kuznyechik/src/compact_soft/backends.rs:33-43","code":"   33 | fn lsx_inv(block: &mut Block, key: &Block) {\n   34 |     x(block, key);\n   35 |     // l_inv\n   36 |     for i in 0..16 {\n   37 |         block.0 = l_step(block.0, 15 - i);\n   38 |     }\n   39 |     // s_inv\n   40 |     for i in 0..16 {\n   41 |         block[15 - i] = P_INV[block[15 - i] as usize];\n   42 |     }\n   43 | }","lines":11,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/compact_soft/backends.rs#L33-L43"}]},
{"id":"OTHER_59","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"`kuznyechik/src/lib.rs` imports `zeroize_flat_type` at the top (`use cipher::zeroize::{ ZeroizeOnDrop, zeroize_flat_type};`) but then calls it through the fully qualified path `cipher::zeroize::zeroize_flat_type(self)` in `Drop for Kuznyechik` and `Drop for KuznyechikEnc`, while `Drop for KuznyechikDec` uses the imported name. Three near-identical `Drop` impls written three different ways is a small but real hint that they were edited at different times, and it is the kind of drift that hides a genuinely missing `Drop` impl during review.","fix":"Use the imported name in all three impls: replace `cipher::zeroize::zeroize_flat_type(self)` with `zeroize_flat_type(self)` on lines 140 and 185.","locations":[{"ref":"kuznyechik/src/lib.rs:42-43","code":"   42 | #[cfg(feature = \"zeroize\")]\n   43 | use cipher::zeroize::{ZeroizeOnDrop, zeroize_flat_type};","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/lib.rs#L42-L43"},{"ref":"kuznyechik/src/lib.rs:139-141","code":"  139 |         unsafe {\n  140 |             cipher::zeroize::zeroize_flat_type(self)\n  141 |         }","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/lib.rs#L139-L141"},{"ref":"kuznyechik/src/lib.rs:183-186","code":"  183 |         #[cfg(feature = \"zeroize\")]\n  184 |         unsafe {\n  185 |             cipher::zeroize::zeroize_flat_type(self)\n  186 |         }","lines":4,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/lib.rs#L183-L186"},{"ref":"kuznyechik/src/lib.rs:246-248","code":"  246 |         unsafe {\n  247 |             zeroize_flat_type(self)\n  248 |         }","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/lib.rs#L246-L248"}]},
{"id":"OTHER_60","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"Small readability defects in the NEON backend that its SSE2 twin does not have: the merged S-box result is bound and immediately returned (`let result = vorrq_u8(..); result`, i.e. `clippy::let_and_return`), the interleaved index vector is named `test` - a placeholder name for the central value of the `transform` routine, where SSE2 simply inlines the expression - and the comment `//Split the sbox table into four parts` is missing the space after `//` that the rest of the codebase uses.","fix":"Return the expression directly (`vorrq_u8(vorrq_u8(result1, result2), vorrq_u8(result3, result4))`), rename `test` to something meaningful such as `lo_idx` (and inline it into the `vshlq_n_u16` call as SSE2 does), and write `// Split the sbox table into four parts`.","locations":[{"ref":"kuznyechik/src/neon/backends.rs:76-79","code":"   76 |     // Merging results\n   77 |     let result = vorrq_u8(vorrq_u8(result1, result2), vorrq_u8(result3, result4));\n   78 | \n   79 |     result","lines":4,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/neon/backends.rs#L76-L79"},{"ref":"kuznyechik/src/neon/backends.rs:39-40","code":"   39 |     //Split the sbox table into four parts\n   40 |     let sbox_part1 = uint8x16x4_t(","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/neon/backends.rs#L39-L40"},{"ref":"kuznyechik/src/neon/backends.rs:105-107","code":"  105 |     let test = vzip1q_u8(block, ind);\n  106 | \n  107 |     let lind = vshlq_n_u16(vreinterpretq_u16_u8(test), 4);","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/neon/backends.rs#L105-L107"}]},
{"id":"OTHER_61","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"`neon::expand_enc_keys` and `neon::inv_enc_keys` are declared `pub`, while the corresponding functions in the SSE2 backend are `pub(super)` and everything else in the NEON module (`EncBackend`, `DecBackend`) is `pub(crate)`. The functions are not actually reachable from outside the crate because `mod neon` is private, so this is over-broad visibility rather than a leak, but it is inconsistent and would be flagged by the `unreachable_pub` lint.","fix":"Before:\n```rust\npub fn expand_enc_keys(key: &Key) -> RoundKeys {\n...\npub fn inv_enc_keys(enc_keys: &RoundKeys) -> RoundKeys {\n```\nAfter:\n```rust\npub(super) fn expand_enc_keys(key: &Key) -> RoundKeys {\n...\npub(super) fn inv_enc_keys(enc_keys: &RoundKeys) -> RoundKeys {\n```","locations":[{"ref":"kuznyechik/src/neon/backends.rs:133-135","code":"  133 | pub fn expand_enc_keys(key: &Key) -> RoundKeys {\n  134 |     macro_rules! next_const {\n  135 |         ($i:expr) => {{","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/neon/backends.rs#L133-L135"},{"ref":"kuznyechik/src/neon/backends.rs:175-177","code":"  175 | pub fn inv_enc_keys(enc_keys: &RoundKeys) -> RoundKeys {\n  176 |     unsafe {\n  177 |         let mut dec_keys = [vdupq_n_u8(0); 10];","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/neon/backends.rs#L175-L177"}]},
{"id":"OTHER_62","type":"other","type_label":"Other","severity":"negligible","difficulty":"medium","description":"`Align16<T>` derives `Copy`, and it is instantiated as `Table = Align16<[u8; 16 * 4096]>` for the 64 KiB\nfused tables. `Copy` is only needed for the 16-byte `KEYGEN` case (the `[Align16([0u8; 16]); 32]` array\nrepeat), so the derive silently makes an accidental `let t = *table;` a 64 KiB stack copy in the hot path\ninstead of a compile error.","fix":"Either use a dedicated small `#[repr(align(16))] struct Align16Block([u8; 16])` for `KEYGEN` and drop\n`Copy`/`Clone` from the generic `Align16<T>` used for the tables, or build `KEYGEN` without the array-repeat\nexpression (e.g. `let mut res = [Align16([0u8; 16]); 32]` replaced by a `while` loop over\n`core::mem::zeroed`-free explicit initialisation) so the derive is not required.","locations":[{"ref":"kuznyechik/src/utils.rs:34-39","code":"   34 | #[repr(align(16))]\n   35 | #[derive(Clone, Copy)]\n   36 | pub(crate) struct Align16<T>(pub T);\n   37 | \n   38 | /// Constants used to generate round keys\n   39 | pub(crate) static KEYGEN: [Align16<[u8; 16]>; 32] = {","lines":6,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/utils.rs#L34-L39"},{"ref":"kuznyechik/src/fused_tables.rs:7-9","code":"    7 | pub(crate) type Table = Align16<[u8; 16 * 4096]>;\n    8 | pub(crate) static ENC_TABLE: Table = Align16(fused_enc_table());\n    9 | pub(crate) static DEC_TABLE: Table = Align16(fused_dec_table());","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/fused_tables.rs#L7-L9"}]},
{"id":"OTHER_63","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"`to_u32` takes an arbitrary `&[u8]` and relies on `try_into().unwrap()`, so the 4-byte length requirement is\nenforced at runtime rather than by the type system. All three call sites are currently correct\n(`&b[0..4]`, `&b[4..8]`, `chunks_exact(4)`), but the signature invites a future caller to introduce a panic\nin a `#![deny(unsafe_code)]`, panic-free-by-design cipher core.","fix":"Take a fixed-size array so the check disappears:\n```rust\n#[inline(always)]\nfn to_u32(chunk: &[u8; 4]) -> u32 {\n    u32::from_be_bytes(*chunk)\n}\n```\nand call it as `to_u32(b[0..4].try_into().unwrap())` at the two block sites, or index with\n`b.as_chunks::<4>()`-style helpers.","locations":[{"ref":"magma/src/lib.rs:208-211","code":"  208 | #[inline(always)]\n  209 | fn to_u32(chunk: &[u8]) -> u32 {\n  210 |     u32::from_be_bytes(chunk.try_into().unwrap())\n  211 | }","lines":4,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/magma/src/lib.rs#L208-L211"},{"ref":"magma/src/lib.rs:101-102","code":"  101 |         let b = block.get_in();\n  102 |         let mut v = (to_u32(&b[0..4]), to_u32(&b[4..8]));","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/magma/src/lib.rs#L101-L102"}]},
{"id":"OTHER_64","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"`PI_TABLE` is a 256-byte magic table with no comment stating what it is or where it comes from, unlike the\ncomparable tables in this workspace (e.g. `kuznyechik/src/consts.rs` documents `P` with a section\nreference). Reviewers cannot check the transcription without guessing the source. (The table itself is\nfine: it has exactly 256 entries and is a permutation of `0..=255`.)","fix":"Add a provenance doc comment:\n```rust\n/// `PITABLE` from RFC 2268, section 2 (a fixed permutation of 0..=255 derived from the digits of pi).\npub static PI_TABLE: [u8; 256] = [\n```","locations":[{"ref":"rc2/src/consts.rs:1-2","code":"    1 | pub static PI_TABLE: [u8; 256] = [\n    2 |     217, 120, 249, 196, 25, 221, 181, 237, 40, 233, 253, 121, 74, 160, 216, 157, 198, 126, 55, 131,","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc2/src/consts.rs#L1-L2"}]},
{"id":"OTHER_65","type":"other","type_label":"Other","severity":"negligible","difficulty":"easy","description":"`rc6/src/core/primitives.rs` implements `Word` for `u8`, `u16`, `u32` and `u64` but not\n`u128`, while the otherwise-identical `rc5/src/primitives.rs` does implement `u128`. RC6\nis defined for any word size, so `RC6<u128, ...>` simply fails to compile with no\nexplanation, an unexplained asymmetry between two sibling crates that share the same\n`Word` abstraction.","fix":"Either add the `impl Word for u128` block (copy `rc5/src/primitives.rs:240-285`, add\n`wrapping_mul`, keep `P = 0xb7e151628aed2a6abf7158809cf4f3c7`,\n`Q = 0x9e3779b97f4a7c15f39cc0605cedc835`), or document on the `Word` trait why RC6 stops\nat 64-bit words (e.g. 512-bit blocks are out of scope). Sharing one `Word` impl set\nbetween `rc5` and `rc6` (see the duplication finding) removes the asymmetry for free.","locations":[{"ref":"rc6/src/core/primitives.rs:195-246","code":"  195 | impl Word for u64 {\n  196 |     type Bytes = U8;\n  197 | \n  198 |     const ZERO: Self = 0;\n  199 |     const THREE: Self = 3;\n  200 |     const EIGHT: Self = 8;\n  201 | \n  202 |     const P: Self = 0xb7e151628aed2a6b;\n  203 |     const Q: Self = 0x9e3779b97f4a7c15;\n  204 | \n  205 |     #[inline(always)]\n  206 |     fn wrapping_add(self, rhs: Self) -> Self {\n  207 |         u64::wrapping_add(self, rhs)\n  208 |     }\n  209 | \n  210 |     #[inline(always)]\n  211 |     fn wrapping_sub(self, rhs: Self) -> Self {\n  212 |         u64::wrapping_sub(self, rhs)\n  213 |     }\n  214 | \n  215 |     #[inline(always)]\n  216 |     fn wrapping_mul(self, rhs: Self) -> Self {\n  217 |         u64::wrapping_mul(self, rhs)\n  218 |     }\n  219 | \n  220 |     #[inline(always)]\n  221 |     fn rotate_left(self, n: Self) -> Self {\n  222 |         let size = Self::BITS;\n  223 |         u64::rotate_left(self, (n % size as u64) as u32)\n  224 |     }\n  225 | \n  226 |     #[inline(always)]\n  227 |     fn rotate_right(self, n: Self) -> Self {\n  228 |         let size = Self::BITS;\n  229 |         u64::rotate_right(self, (n % size as u64) as u32)\n  230 |     }\n  231 | \n  232 |     #[inline(always)]\n  233 |     fn from_le_bytes(bytes: &Array<u8, Self::Bytes>) -> Self {\n  234 |         u64::from_le_bytes(bytes.as_slice().try_into().unwrap())\n  235 |     }\n  236 | \n  237 |     #[inline(always)]\n  238 |     fn to_le_bytes(self) -> Array<u8, Self::Bytes> {\n  239 |         u64::to_le_bytes(self).into()\n  240 |     }\n  241 | \n  242 |     #[inline(always)]\n  243 |     fn bitxor(self, other: Self) -> Self {\n  244 |         <u64 as BitXor>::bitxor(self, other)\n  245 |     }\n  246 | }","lines":52,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc6/src/core/primitives.rs#L195-L246"},{"ref":"rc5/src/primitives.rs:240-285","code":"  240 | impl Word for u128 {\n  241 |     type Bytes = U16;\n  242 | \n  243 |     const ZERO: Self = 0;\n  244 |     const THREE: Self = 3;\n  245 |     const EIGHT: Self = 8;\n  246 | \n  247 |     const P: Self = 0xb7e151628aed2a6abf7158809cf4f3c7;\n  248 |     const Q: Self = 0x9e3779b97f4a7c15f39cc0605cedc835;\n  249 | \n  250 |     #[inline(always)]\n  251 |     fn wrapping_add(self, rhs: Self) -> Self {\n  252 |         u128::wrapping_add(self, rhs)\n  253 |     }\n  254 |     #[inline(always)]\n  255 |     fn wrapping_sub(self, rhs: Self) -> Self {\n  256 |         u128::wrapping_sub(self, rhs)\n  257 |     }\n  258 | \n  259 |     #[inline(always)]\n  260 |     fn rotate_left(self, n: Self) -> Self {\n  261 |         let size = Self::BITS;\n  262 |         u128::rotate_left(self, (n % size as u128) as u32)\n  263 |     }\n  264 | \n  265 |     #[inline(always)]\n  266 |     fn rotate_right(self, n: Self) -> Self {\n  267 |         let size = Self::BITS;\n  268 |         u128::rotate_right(self, (n % size as u128) as u32)\n  269 |     }\n  270 | \n  271 |     #[inline(always)]\n  272 | // Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build a [project] header block from embedded PROJECT_INFO, so the exported
// findings.toml is self-contained (doesn't depend on a sibling project-info.toml
// that a second, separately-triggered download could silently fail to save).
// '' when there is no project info at all.
function buildProjectToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = PROJECT_INFO || {};
  if (!Object.keys(pi).length) return '';
  const lines = ['[project]'];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n\n';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return buildProjectToml() + chunks.join('\n\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';

}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';

// Pre-compute search haystacks per finding (cleared on full re-render).
// Two variants: everything (default), and file/folder paths only - for when a

// inside description/fix prose and you only want path matches.
const _hay = new Map();
const _hayLoc = new Map();
function hayOf(f) {

    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}
function hayLocOf(f) {
  if (!_hayLoc.has(f.id)) {
    _hayLoc.set(f.id, f.locations.map(l => l.ref).join(' ').toLowerCase());
  }
  return _hayLoc.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (S.searchScope === 'locations') {
      if (!hayLocOf(f).includes(q)) return false;
    } else if (!hayOf(f).includes(q) && !st.includes(q)) {
      return false;
    }
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  _hayLoc.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    // Single download (was two) - a second auto-triggered download is commonly
    // blocked by the browser unless the user explicitly allows it, which silently
    // drops project-info.toml. Embedding [project] in findings.toml itself avoids
    // that failure mode entirely.
    downloadText(buildFindingsToml(), 'findings.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});
document.getElementById('search-scope').addEventListener('click', e => {
  S.searchScope = S.searchScope === 'locations' ? 'all' : 'locations';
  e.currentTarget.classList.toggle('active', S.searchScope === 'locations');
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
