{"id":"ARCH_4","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"`soft.rs` declares the whole portable implementation as its own submodule with a `#[path]` override\n(`#[path = \"fixslice/mod.rs\"] pub(crate) mod fixslice;`), even though `fixslice/` is a sibling directory of\n`soft.rs` under `backends/`. The result is that the module path (`crate::backends::soft::fixslice::...`) does not\nmatch the on-disk layout (`aes/src/backends/fixslice/...`), which shows up in real code: `crate::hazmat` has to\nreach the portable hazmat implementation as `crate::backends::soft::hazmat` (re-exported at `soft.rs:11-12`) even\nthough that code has nothing to do with the `soft` block-cipher backend, and symbol names in a release build read\n`aes::backends::soft::fixslice::sbox::sub_bytes`. `soft.rs` is otherwise a thin ~100-line adapter, so nesting a\n1500-line implementation tree inside it also inverts the dependency direction.","fix":"Declare `pub(crate) mod fixslice;` in `aes/src/backends.rs` (dropping the `#[path]` attribute in `soft.rs`), have `soft.rs` do `use super::fixslice;`, and let `crate::hazmat` refer to `crate::backends::fixslice::hazmat` directly instead of routing through `soft`.","locations":[{"ref":"aes/src/backends/soft.rs:8-14","code":"    8 | #[path = \"fixslice/mod.rs\"]\n    9 | pub(crate) mod fixslice;\n   10 | \n   11 | #[cfg(feature = \"hazmat\")]\n   12 | pub(crate) use fixslice::hazmat;\n   13 | \n   14 | use fixslice::{BatchBlocks, NativeBatchSize, NativeWord};","lines":7,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends/soft.rs#L8-L14"},{"ref":"aes/src/backends.rs:1","code":"    1 | pub(crate) mod soft;","lines":1,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends.rs#L1"}]},
{"id":"ARCH_5","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"Raw single-block *encryption* is available without the optional `cipher` feature\n(`pub fn belt_block_raw`, ungated), but raw single-block *decryption* exists only as the body of\n`BlockCipherDecBackend for BeltBlock` inside the `#[cfg(feature = \"cipher\")]` module\n`cipher_impl`. A `default-features = false` user therefore has an encryption primitive and the\nwide-block helpers, but no way to decrypt a single block, and no `belt_block_raw`-style entry point\nto build higher-level constructions with. The asymmetry is also why the round function had to be\nduplicated in the first place.","fix":"Add a `pub fn belt_block_raw_dec(x: [u32; 4], key: &[u32; 8]) -> [u32; 4]` next to\n`belt_block_raw` in `lib.rs` (ungated), and reduce `BeltBlock::decrypt_block` to a thin wrapper\naround it, mirroring how `encrypt_block` wraps `belt_block_raw`.","locations":[{"ref":"belt-block/src/lib.rs:62-65","code":"   62 | /// Raw BelT block encryption function used for implementation of\n   63 | /// higher-level algorithms.\n   64 | #[inline(always)]\n   65 | pub fn belt_block_raw(x: [u32; 4], key: &[u32; 8]) -> [u32; 4] {","lines":4,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/belt-block/src/lib.rs#L62-L65"},{"ref":"belt-block/src/cipher_impl.rs:65-108","code":"   65 | impl BlockCipherDecBackend for BeltBlock {\n   66 |     #[inline]\n   67 |     fn decrypt_block(&self, mut block: InOut<'_, '_, Block<Self>>) {\n   68 |         let key = &self.key;\n   69 |         let block_in: [u32; 4] = to_u32(block.get_in());\n   70 |         // Steps 1 and 4\n   71 |         let mut a = Wrapping(block_in[0]);\n   72 |         let mut b = Wrapping(block_in[1]);\n   73 |         let mut c = Wrapping(block_in[2]);\n   74 |         let mut d = Wrapping(block_in[3]);\n   75 | \n   76 |         // Step 5\n   77 |         for i in (1..9).rev() {\n   78 |             // 5.1) b ← b ⊕ G₅(a ⊞ 𝑘[7i])\n   79 |             b ^= g5(a + key_idx(key, i, 0));\n   80 |             // 5.2) c ← c ⊕ G₂₁(d ⊞ 𝑘[7i-1])\n   81 |             c ^= g21(d + key_idx(key, i, 1));\n   82 |             // 5.3) a ← a ⊟ G₁₃(b ⊞ 𝑘[7i-2])\n   83 |             a -= g13(b + key_idx(key, i, 2));\n   84 |             // 5.4) e ← G₂₁(b ⊞ c ⊞ 𝑘[7i-3]) ⊕ ⟨i⟩₃₂\n   85 |             let e = g21(b + c + key_idx(key, i, 3)) ^ Wrapping(i as u32);\n   86 |             // 5.5) b ← b ⊞ e\n   87 |             b += e;\n   88 |             // 5.6) c ← c ⊟ e\n   89 |             c -= e;\n   90 |             // 5.7) d ← d ⊞ G₁₃(c ⊞ 𝑘[7i-4])\n   91 |             d += g13(c + key_idx(key, i, 4));\n   92 |             // 5.8) b ← b ⊕ G₂₁(a ⊞ 𝑘[7i-5])\n   93 |             b ^= g21(a + key_idx(key, i, 5));\n   94 |             // 5.9) c ← c ⊕ G₅(d ⊞ 𝑘[7i-6])\n   95 |             c ^= g5(d + key_idx(key, i, 6));\n   96 |             // 5.10) a ↔ b\n   97 |             swap(&mut a, &mut b);\n   98 |             // 5.11) c ↔ d\n   99 |             swap(&mut c, &mut d);\n  100 |             // 5.12) a ↔ d\n  101 |             swap(&mut a, &mut d);\n  102 |         }\n  103 | \n  104 |         let block_out = block.get_out();\n  105 |         // 6) 𝑋 ← c ‖ a ‖ d ‖ b\n  106 |         let x = [c.0, a.0, d.0, b.0];\n  107 |         *block_out = from_u32(&x).into();\n  108 |     }","lines":44,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/belt-block/src/cipher_impl.rs#L65-L108"}]},
{"id":"ARCH_6","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"easy","description":"`Twofish::new_from_slice` builds a fully zero-initialised `Twofish { s: [0; 16], k: [0; 40], start: 0 }` and\nthen mutates it in place via `&mut self` in `key_schedule`. That transient state is a *valid-looking* but\nwrong cipher (`start: 0` means \"256-bit key\", with an all-zero S-box key), and `key_schedule` additionally\nsets `self.start` only *after* the 20-iteration subkey loop has already run, which makes it non-obvious that\n`h` does not depend on `start`. A constructor that returns the schedule instead of patching a placeholder\nremoves the possibility of ever observing or shipping the half-initialised value.","fix":"Turn `key_schedule` into a free/associated function that computes and returns the finished state:\n```rust\nfn key_schedule(key: &[u8]) -> (usize, [u8; 16], [u32; 40]) { /* compute start first, then s, then k */ }\n```\nand have `new_from_slice` do `let (start, s, k) = Self::key_schedule(key); Ok(Self { s, k, start })`.","locations":[{"ref":"twofish/src/lib.rs:150-173","code":"  150 |     fn key_schedule(&mut self, key: &[u8]) {\n  151 |         let k = key.len() / 8;\n  152 | \n  153 |         let rho: u32 = 0x1010101;\n  154 | \n  155 |         for x in 0..20 {\n  156 |             let a = h(rho * (2 * x), key, k, 0);\n  157 |             let b = h(rho * (2 * x + 1), key, k, 1).rotate_left(8);\n  158 |             let v = a.wrapping_add(b);\n  159 |             self.k[(2 * x) as usize] = v;\n  160 |             self.k[(2 * x + 1) as usize] = (v.wrapping_add(b)).rotate_left(9);\n  161 |         }\n  162 |         self.start = match k {\n  163 |             4 => 0,\n  164 |             3 => 1,\n  165 |             2 => 2,\n  166 |             _ => unreachable!(),\n  167 |         };\n  168 | \n  169 |         // Compute S_i.\n  170 |         for i in 0..k {\n  171 |             rs_mult(&key[i * 8..i * 8 + 8], &mut self.s[i * 4..(i + 1) * 4]);\n  172 |         }\n  173 |     }","lines":24,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/twofish/src/lib.rs#L150-L173"},{"ref":"twofish/src/lib.rs:186-199","code":"  186 |     #[inline]\n  187 |     fn new_from_slice(key: &[u8]) -> Result<Self, InvalidLength> {\n  188 |         let n = key.len();\n  189 |         if n != 16 && n != 24 && n != 32 {\n  190 |             return Err(InvalidLength);\n  191 |         }\n  192 |         let mut twofish = Self {\n  193 |             s: [0u8; 16],\n  194 |             k: [0u32; 40],\n  195 |             start: 0,\n  196 |         };\n  197 |         twofish.key_schedule(key);\n  198 |         Ok(twofish)\n  199 |     }","lines":14,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/twofish/src/lib.rs#L186-L199"}]},
{"id":"OTHER_1","type":"other","type_label":"Other","severity":"medium","difficulty":"easy","description":"This DES implementation is table-driven: `apply_sboxes` indexes `SBOXES[i][val]` with `val` derived from `round_key ^ expanded_data`, i.e. the memory access pattern is key-dependent. That makes the crate vulnerable to cache-timing key recovery on any platform with a shared cache, which is a well-known and practical attack class against table-based DES. The crate-level documentation says only \"Hazmat, USE AT YOUR OWN RISK\" and never mentions side channels, unlike sibling RustCrypto crates such as `aes` which document their constant-time properties explicitly. A user reading the current docs has no way to know that this implementation must not process secret keys on shared hardware.","fix":"Add a `# Security Notes` section to the crate docs in `des/src/lib.rs` stating that the implementation is\ntable-based and therefore **not** constant-time, e.g.\n\n```rust\n//! # Security Notes\n//!\n//! This crate uses lookup tables for the DES S-boxes, so its memory access\n//! pattern depends on the round keys. It is therefore **not** hardened against\n//! cache-timing side channels and must not be used to process secret keys on\n//! hardware shared with untrusted code.\n```","locations":[{"ref":"des/src/lib.rs:1-13","code":"    1 | //! Pure Rust implementation of the [Data Encryption Standard][DES] (DES),\n    2 | //! including [Triple DES] (TDES, 3DES) block ciphers.\n    3 | //!\n    4 | //! # ⚠️ Security Warning: Hazmat!\n    5 | //!\n    6 | //! This crate implements only the low-level block cipher function, and is intended\n    7 | //! for use for implementing higher-level constructions *only*. It is NOT\n    8 | //! intended for direct use in applications.\n    9 | //!\n   10 | //! USE AT YOUR OWN RISK!\n   11 | //!\n   12 | //! [DES]: https://en.wikipedia.org/wiki/Data_Encryption_Standard\n   13 | //! [Triple DES]: https://en.wikipedia.org/wiki/Triple_DES","lines":13,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/des/src/lib.rs#L1-L13"},{"ref":"des/src/utils.rs:143-152","code":"  143 | fn apply_sboxes(input: u64) -> u64 {\n  144 |     let mut output: u64 = 0;\n  145 | \n  146 |     for (i, sbox) in SBOXES.iter().enumerate() {\n  147 |         let val = (input >> (58 - (i * 6))) & 0x3F;\n  148 |         output |= u64::from(sbox[val as usize]) << (60 - (i * 4));\n  149 |     }\n  150 | \n  151 |     output\n  152 | }","lines":10,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/des/src/utils.rs#L143-L152"}]},
{"id":"OTHER_2","type":"other","type_label":"Other","severity":"medium","difficulty":"medium","description":"`TdesEee3` and `TdesEee2` are exported from `des/src/lib.rs` but have **no** test vectors anywhere in the crate: `des/tests/mod.rs` only instantiates `block_cipher_test!` for `des::Des`, `des::TdesEde3` and `des::TdesEde2`, and `des/tests/data/` contains only `des.blb`, `tdes.blb` and `tdes2.blb`. Two of the six public cipher types in a production cryptographic crate are therefore verified against nothing. I confirmed by hand that both round-trip and that their E/D orderings read correctly, but a swapped `d1`/`d2` or an `encrypt`→`decrypt` typo in either variant would compile, round-trip successfully, and ship undetected - which is precisely the failure mode this file's four-way copy-paste structure invites.","fix":"Add `.blb` fixtures for `TdesEee3` and `TdesEee2` (they can be generated from the already-trusted `Des` implementation, or taken from an independent 3DES implementation) and register them with `cipher::block_cipher_test!(tdes_eee3, des::TdesEee3);` / `cipher::block_cipher_test!(tdes_eee2, des::TdesEee2);` in `des/tests/mod.rs`. At minimum add a cheap equivalence test asserting `TdesEee3` with key `k||k||k` equals three chained `Des` encryptions and that `TdesEee2` equals `E_k1(E_k2(E_k1(p)))`.","locations":[{"ref":"des/src/tdes.rs:139-166","code":"  139 | impl BlockCipherEncBackend for TdesEee3 {\n  140 |     #[inline]\n  141 |     fn encrypt_block(&self, mut block: InOut<'_, '_, Block<Self>>) {\n  142 |         let mut data = u64::from_be_bytes(block.clone_in().into());\n  143 |         data = self.d1.encrypt(data);\n  144 |         data = self.d2.encrypt(data);\n  145 |         data = self.d3.encrypt(data);\n  146 |         block.get_out().copy_from_slice(&data.to_be_bytes());\n  147 |     }\n  148 | }\n  149 | \n  150 | impl BlockCipherDecrypt for TdesEee3 {\n  151 |     #[inline]\n  152 |     fn decrypt_with_backend(&self, f: impl BlockCipherDecClosure<BlockSize = Self::BlockSize>) {\n  153 |         f.call(self)\n  154 |     }\n  155 | }\n  156 | \n  157 | impl BlockCipherDecBackend for TdesEee3 {\n  158 |     #[inline]\n  159 |     fn decrypt_block(&self, mut block: InOut<'_, '_, Block<Self>>) {\n  160 |         let mut data = u64::from_be_bytes(block.clone_in().into());\n  161 |         data = self.d3.decrypt(data);\n  162 |         data = self.d2.decrypt(data);\n  163 |         data = self.d1.decrypt(data);\n  164 |         block.get_out().copy_from_slice(&data.to_be_bytes());\n  165 |     }\n  166 | }","lines":28,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/des/src/tdes.rs#L139-L166"},{"ref":"des/src/tdes.rs:301-328","code":"  301 | impl BlockCipherEncBackend for TdesEee2 {\n  302 |     #[inline]\n  303 |     fn encrypt_block(&self, mut block: InOut<'_, '_, Block<Self>>) {\n  304 |         let mut data = u64::from_be_bytes(block.clone_in().into());\n  305 |         data = self.d1.encrypt(data);\n  306 |         data = self.d2.encrypt(data);\n  307 |         data = self.d1.encrypt(data);\n  308 |         block.get_out().copy_from_slice(&data.to_be_bytes());\n  309 |     }\n  310 | }\n  311 | \n  312 | impl BlockCipherDecrypt for TdesEee2 {\n  313 |     #[inline]\n  314 |     fn decrypt_with_backend(&self, f: impl BlockCipherDecClosure<BlockSize = Self::BlockSize>) {\n  315 |         f.call(self)\n  316 |     }\n  317 | }\n  318 | \n  319 | impl BlockCipherDecBackend for TdesEee2 {\n  320 |     #[inline]\n  321 |     fn decrypt_block(&self, mut block: InOut<'_, '_, Block<Self>>) {\n  322 |         let mut data = u64::from_be_bytes(block.clone_in().into());\n  323 |         data = self.d1.decrypt(data);\n  324 |         data = self.d2.decrypt(data);\n  325 |         data = self.d1.decrypt(data);\n  326 |         block.get_out().copy_from_slice(&data.to_be_bytes());\n  327 |     }\n  328 | }","lines":28,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/des/src/tdes.rs#L301-L328"},{"ref":"des/tests/mod.rs:4-6","code":"    4 | cipher::block_cipher_test!(des, des::Des);\n    5 | cipher::block_cipher_test!(tdes, des::TdesEde3);\n    6 | cipher::block_cipher_test!(tdes2, des::TdesEde2);","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/des/tests/mod.rs#L4-L6"}]},
{"id":"OTHER_3","type":"other","type_label":"Other","severity":"medium","difficulty":"easy","description":"`rc6` never erases its expanded key material, and its advertised `zeroize` feature is a\nno-op. `rc6/Cargo.toml` declares `zeroize = []` - a feature with no effect, since it\nneither enables `cipher/zeroize` nor is ever tested with `cfg(feature = \"zeroize\")` in\nthe source - while `cipher` is pulled in with `features = [\"zeroize\"]`\nunconditionally. `rc6/src/core/primitives.rs` requires `Word: DefaultIsZeroes`, but that\nbound is never used: `RC6` has no `Drop` impl and no `ZeroizeOnDrop` impl, so the\n`key_table` (the full expanded round-key schedule) is left in memory when the cipher is\ndropped. Both `rc5` and `serpent` do implement `Drop` + `ZeroizeOnDrop`, so `rc6` is the\nodd one out for a crate in the same workspace with the same threat model.","fix":"Mirror `rc5`. In `rc6/Cargo.toml` make the feature real and the dependency conditional:\n\n```toml\n[dependencies]\ncipher = \"0.5\"\n\n[features]\nzeroize = [\"cipher/zeroize\"]\n```\n\nGate the `DefaultIsZeroes` supertrait on that feature (or move it behind a sealed trait\nas `rc5` does), and add to `rc6/src/core/backend.rs`:\n\n```rust\nimpl<W, R, B> Drop for RC6<W, R, B> where /* struct bounds */ {\n    fn drop(&mut self) {\n        #[cfg(feature = \"zeroize\")]\n        self.key_table.zeroize()\n    }\n}\n\n#[cfg(feature = \"zeroize\")]\nimpl<W, R, B> ZeroizeOnDrop for RC6<W, R, B> where /* struct bounds */ {}\n```","locations":[{"ref":"rc6/src/lib.rs:1-7","code":"    1 | #![no_std]\n    2 | \n    3 | mod block_cipher;\n    4 | mod core;\n    5 | \n    6 | pub use crate::core::RC6;\n    7 | pub use block_cipher::*;","lines":7,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc6/src/lib.rs#L1-L7"},{"ref":"rc6/src/core/backend.rs:17-29","code":"   17 | pub struct RC6<W, R, B>\n   18 | where\n   19 |     W: Word,\n   20 |     R: Unsigned,\n   21 |     R: IsLess<U256>,\n   22 |     // ExpandedKeyTableSize\n   23 |     R: Add<U2>,\n   24 |     Sum<R, U2>: Mul<U2>,\n   25 |     ExpandedKeyTableSize<R>: ArraySize,\n   26 | {\n   27 |     key_table: ExpandedKeyTable<W, R>,\n   28 |     _key_size: PhantomData<B>,\n   29 | }","lines":13,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc6/src/core/backend.rs#L17-L29"},{"ref":"rc6/src/core/primitives.rs:1-6","code":"    1 | use cipher::{\n    2 |     array::{Array, ArraySize},\n    3 |     typenum::{Diff, Prod, Quot, Sum, U1, U2, U4, U8},\n    4 |     zeroize::DefaultIsZeroes,\n    5 | };\n    6 | use core::ops::{Add, BitXor};","lines":6,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc6/src/core/primitives.rs#L1-L6"},{"ref":"rc6/Cargo.toml:14-21","code":"   14 | [dependencies]\n   15 | cipher = { version = \"0.5\", features = [\"zeroize\"] }\n   16 | \n   17 | [dev-dependencies]\n   18 | cipher = { version = \"0.5\", features = [\"dev\"] }\n   19 | \n   20 | [features]\n   21 | zeroize = []","lines":8,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc6/Cargo.toml#L14-L21"}]},
{"id":"OTHER_4","type":"other","type_label":"Other","severity":"medium","difficulty":"medium","description":"All five ciphers implement `ZeroizeOnDrop` and zeroize their stored round keys, but every key-expansion\nroutine leaves a full copy of the derived (and in some cases the raw) key material in un-zeroized stack\nlocals. `Serpent::new_from_slice` leaves `key: [u8; 32]` (the padded raw key), `words: [u32; 140]` (560 bytes\ncontaining the raw key words *and* the entire pre-S-box schedule) and `k: [u32; 132]` (528 bytes, the final\nround keys) behind - roughly 1.2 KiB. `Sm4::new` leaves `mk` and `k`, the Speck `KeyInit::new` leaves\n`l` (the full `l` sequence of the key schedule), `Threefish::new_with_tweak_u64` leaves `k` (raw key words\nplus the parity word) and `Threefish::new` leaves `tmp_key` (the raw key bytes). Implementing `ZeroizeOnDrop`\nadvertises that no key material outlives the object, so these leftovers contradict the crate's own guarantee.","fix":"Under `#[cfg(feature = \"zeroize\")]`, zeroize each intermediate before returning, e.g. in\n`Serpent::new_from_slice`:\n```rust\nlet out = Serpent { round_keys };\n#[cfg(feature = \"zeroize\")]\n{\n    key.zeroize();\n    words_owned.zeroize();\n    k.zeroize();\n}\nOk(out)\n```\nAlternatively wrap the temporaries in `zeroize::Zeroizing<_>` so the cleanup cannot be forgotten\n(`let mut words = Zeroizing::new([0u32; 140]);`), and do the same for `mk`/`k` in `Sm4::new`, `l` in the\nSpeck `KeyInit::new`, and `k`/`tmp_key` in the Threefish constructors.","locations":[{"ref":"serpent/src/lib.rs:85-120","code":"   85 |         let key = expand_key(key, key.len() * 8);\n   86 | \n   87 |         let mut words = [0u32; 140];\n   88 | \n   89 |         for (src, dst) in key.chunks_exact(4).zip(words[..8].iter_mut()) {\n   90 |             *dst = u32::from_le_bytes(src.try_into().unwrap());\n   91 |         }\n   92 | \n   93 |         for i in 0..132 {\n   94 |             let slot = i + 8;\n   95 |             words[slot] = (words[slot - 8]\n   96 |                 ^ words[slot - 5]\n   97 |                 ^ words[slot - 3]\n   98 |                 ^ words[slot - 1]\n   99 |                 ^ PHI\n  100 |                 ^ i as u32)\n  101 |                 .rotate_left(11);\n  102 |         }\n  103 | \n  104 |         let r = ROUNDS + 1;\n  105 |         let words = &words[8..];\n  106 |         let mut k = [0u32; 132];\n  107 |         for i in 0..r {\n  108 |             let sbox_index = (ROUNDS + 3 - i) % ROUNDS;\n  109 |             let [a, b, c, d]: [u32; 4] = words[4 * i..][..4].try_into().unwrap();\n  110 |             // calculate keys in bitslicing mode\n  111 |             let output = bitslice::apply_s(sbox_index, [a, b, c, d]);\n  112 |             for l in 0..4 {\n  113 |                 k[4 * i + l] = output[l];\n  114 |             }\n  115 |         }\n  116 | \n  117 |         let mut round_keys: RoundKeys = [[0; 4]; ROUNDS + 1];\n  118 |         for (src, dst) in k.chunks_exact(4).zip(round_keys.iter_mut()) {\n  119 |             dst.copy_from_slice(src);\n  120 |         }","lines":36,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/serpent/src/lib.rs#L85-L120"},{"ref":"sm4/src/lib.rs:81-100","code":"   81 |         let mk = [\n   82 |             u32::from_be_bytes(key[0..4].try_into().unwrap()),\n   83 |             u32::from_be_bytes(key[4..8].try_into().unwrap()),\n   84 |             u32::from_be_bytes(key[8..12].try_into().unwrap()),\n   85 |             u32::from_be_bytes(key[12..16].try_into().unwrap()),\n   86 |         ];\n   87 |         let mut rk = [0u32; 32];\n   88 |         let mut k = [mk[0] ^ FK[0], mk[1] ^ FK[1], mk[2] ^ FK[2], mk[3] ^ FK[3]];\n   89 | \n   90 |         for i in 0..8 {\n   91 |             k[0] ^= t_prime(k[1] ^ k[2] ^ k[3] ^ CK[i * 4]);\n   92 |             k[1] ^= t_prime(k[2] ^ k[3] ^ k[0] ^ CK[i * 4 + 1]);\n   93 |             k[2] ^= t_prime(k[3] ^ k[0] ^ k[1] ^ CK[i * 4 + 2]);\n   94 |             k[3] ^= t_prime(k[0] ^ k[1] ^ k[2] ^ CK[i * 4 + 3]);\n   95 | \n   96 |             rk[i * 4] = k[0];\n   97 |             rk[i * 4 + 1] = k[1];\n   98 |             rk[i * 4 + 2] = k[2];\n   99 |             rk[i * 4 + 3] = k[3];\n  100 |         }","lines":20,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/sm4/src/lib.rs#L81-L100"},{"ref":"speck-cipher/src/lib.rs:110-128","code":"  110 |             fn new(key: &Key<Self>) -> Self {\n  111 |                 let mut k = [0; $rounds];\n  112 |                 let mut l = [0; $m - 1 + $rounds - 1];\n  113 |                 k[0] = $name::from_be_bytes(&key[($m - 1) * ($n / 8)..($m) * ($n / 8)]);\n  114 | \n  115 |                 for i in 0..$m - 1 {\n  116 |                     l[i] = $name::from_be_bytes(\n  117 |                         &key[($m - 2 - i) * ($n / 8)..($m - 1 - i) * ($n / 8)],\n  118 |                     );\n  119 |                 }\n  120 | \n  121 |                 for i in 0..($rounds - 1) {\n  122 |                     let res = $name::round_function(i.try_into().unwrap(), l[i], k[i]);\n  123 |                     l[i + $m - 1] = res.0;\n  124 |                     k[i + 1] = res.1;\n  125 |                 }\n  126 | \n  127 |                 Self { k }\n  128 |             }","lines":19,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/speck-cipher/src/lib.rs#L110-L128"},{"ref":"threefish/src/lib.rs:84-88","code":"   84 |             pub fn new_with_tweak_u64(key: &[u64; $n_w], tweak: &[u64; 2]) -> $name {\n   85 |                 let mut k = [0u64; $n_w + 1];\n   86 |                 k[..$n_w].copy_from_slice(key);\n   87 |                 k[$n_w] = key.iter().fold(C240, core::ops::BitXor::bitxor);\n   88 |                 let t = [tweak[0], tweak[1], tweak[0] ^ tweak[1]];","lines":5,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312ae {"id":"OTHER_5","type":"other","type_label":"Other","severity":"medium","difficulty":"very_easy","description":"`gf_mult` in `twofish` is a bit-serial `GF(2^8)` multiplier whose loop trip count and branch pattern depend on\nits *secret* first operand: `while a > 0` runs `bit_length(a)` times and `if a & 1 == 1` branches once per bit\nof `a`. It is called with secret data in two places: `mds_column_mult` passes the secret post-S-box state byte\n`x` as `a` (executed ~256 times per block on the hot path), and `rs_mult` passes raw key bytes `m[j]` as `a`\nduring key setup. This leaks the Hamming weight and bit length of secret bytes through timing and branch\nprediction, which is a strictly worse leak than the table lookups the crate already accepts by design, and it\nis free to remove because the operand that varies is on the loop-control side.","fix":"Make the loop a fixed 8 iterations with a branch-free conditional XOR:\n```rust\nfn gf_mult(a: u8, mut b: u8, p: u8) -> u8 {\n    let mut result = 0u8;\n    for i in 0..8 {\n        let bit = 0u8.wrapping_sub((a >> i) & 1); // 0x00 or 0xff\n        result ^= b & bit;\n        let carry = 0u8.wrapping_sub(b >> 7);\n        b = (b << 1) ^ (p & carry);\n    }\n    result\n}\n```\nNote that after this change `a` no longer needs to be `mut`.","locations":[{"ref":"twofish/src/lib.rs:47-61","code":"   47 | fn gf_mult(mut a: u8, mut b: u8, p: u8) -> u8 {\n   48 |     let mut result = 0;\n   49 |     while a > 0 {\n   50 |         if a & 1 == 1 {\n   51 |             result ^= b;\n   52 |         }\n   53 |         a >>= 1;\n   54 |         if b & 0x80 == 0x80 {\n   55 |             b = (b << 1) ^ p;\n   56 |         } else {\n   57 |             b <<= 1;\n   58 |         }\n   59 |     }\n   60 |     result\n   61 | }","lines":15,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/twofish/src/lib.rs#L47-L61"},{"ref":"twofish/src/lib.rs:75-77","code":"   75 | fn mds_column_mult(x: u8, column: usize) -> u32 {\n   76 |     let x5b = gf_mult(x, 0x5b, MDS_POLY);\n   77 |     let xef = gf_mult(x, 0xef, MDS_POLY);","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/twofish/src/lib.rs#L75-L77"},{"ref":"twofish/src/lib.rs:97-104","code":"   97 | fn rs_mult(m: &[u8], out: &mut [u8]) {\n   98 |     for i in 0..4 {\n   99 |         out[i] = 0;\n  100 |         for j in 0..8 {\n  101 |             out[i] ^= gf_mult(m[j], RS[i][j], RS_POLY);\n  102 |         }\n  103 |     }\n  104 | }","lines":8,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/twofish/src/lib.rs#L97-L104"}]},
{"id":"OTHER_6","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"The AES-128 key schedule handles the last two round constants with the unexplained magic offsets\n`rcon - 8`, `rcon - 7`, `rcon - 5`, `rcon - 4`. These work because `add_round_constant_bit` sets one\n*bit* of the round constant and the last two AES round constants are not single bits: for\n`rcon == 8` the four calls set bits `0,1,3,4` = `0x1b`, and for `rcon == 9` they set bits\n`1,2,4,5` = `0x36`. Nothing in the file says so, so the code reads like an off-by-one bug and any\nchange to the `for rcon in 0..10` bound would silently break it.","fix":"Add a comment above the `else` branch:\n```rust\n} else {\n    // Rcon 9 and 10 are 0x1b and 0x36, which are not single bits: set bits\n    // {0,1,3,4} = 0x1b for rcon == 8 and {1,2,4,5} = 0x36 for rcon == 9.\n    add_round_constant_bit(&mut rkeys[rk_off..(rk_off + 8)], rcon - 8);\n```","locations":[{"ref":"aes/src/backends/fixslice/aes128.rs:20-27","code":"   20 |         if rcon < 8 {\n   21 |             add_round_constant_bit(&mut rkeys[rk_off..(rk_off + 8)], rcon);\n   22 |         } else {\n   23 |             add_round_constant_bit(&mut rkeys[rk_off..(rk_off + 8)], rcon - 8);\n   24 |             add_round_constant_bit(&mut rkeys[rk_off..(rk_off + 8)], rcon - 7);\n   25 |             add_round_constant_bit(&mut rkeys[rk_off..(rk_off + 8)], rcon - 5);\n   26 |             add_round_constant_bit(&mut rkeys[rk_off..(rk_off + 8)], rcon - 4);\n   27 |         }","lines":8,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends/fixslice/aes128.rs#L20-L27"}]},
{"id":"OTHER_7","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"All three ARIA `KeyInit` impls convert the key with `key[0..16].try_into().unwrap()` (and\n`key[16..24]` / `key[16..32]`). The conversion is statically infallible because `key` is a\n`&Array<u8, U16/U24/U32>`, so the `unwrap()` only adds a panicking branch and a slice bounds check\nthat the optimiser is merely *expected* to remove; it also obscures the fact that no error is\npossible. `aria128.rs` additionally writes `u128::default()` where the intent is the literal `0`.","fix":"For `aria128.rs`, before:\n```rust\nlet kl = u128::from_be_bytes(key[0..16].try_into().unwrap());\nlet kr = u128::default();\n```\nafter:\n```rust\nlet kl = u128::from_be_bytes(key.0);\nlet kr = 0;\n```\nFor `aria192.rs`/`aria256.rs` use the panic-free const-generic split provided by\n`cipher::array::Array`, e.g.\n```rust\nlet (kl, kr) = key.split_ref::<U16>();\nlet kl = u128::from_be_bytes(kl.0);\n```","locations":[{"ref":"aria/src/aria128.rs:15-16","code":"   15 |         let kl = u128::from_be_bytes(key[0..16].try_into().unwrap());\n   16 |         let kr = u128::default();","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aria/src/aria128.rs#L15-L16"},{"ref":"aria/src/aria192.rs:15-17","code":"   15 |         let kl = u128::from_be_bytes(key[0..16].try_into().unwrap());\n   16 |         let kr = u64::from_be_bytes(key[16..24].try_into().unwrap());\n   17 |         let kr = (kr as u128) << 64;","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aria/src/aria192.rs#L15-L17"},{"ref":"aria/src/aria256.rs:15-16","code":"   15 |         let kl = u128::from_be_bytes(key[0..16].try_into().unwrap());\n   16 |         let kr = u128::from_be_bytes(key[16..32].try_into().unwrap());","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aria/src/aria256.rs#L15-L16"}]},
{"id":"OTHER_8","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"The ARIA implementation is built entirely on data-dependent table lookups: `SB1`..`SB4` (4 x 256\nbytes = 1 KiB, spanning 16 cache lines) are indexed by secret plaintext/key material 16 times per\n`fo`/`fe`/`sl2` call, i.e. hundreds of secret-index loads per block, in both `encrypt_block` and\n`KeyInit::new`. This makes the crate vulnerable to cache-timing attacks on shared hardware, in\nsharp contrast to the sibling `aes` crate whose docs prominently state that the software backend is\n\"constant-time ... with no use of any lookup tables or data-dependent branches\". Neither\n`aria/src/lib.rs` nor `aria/README.md` warns about this, so a user comparing the two RustCrypto\nblock ciphers will reasonably but wrongly assume ARIA offers the same guarantee.","fix":"At minimum, document the limitation: add a `# ⚠️ Security Warning: not constant-time` section to the\n`aria` crate docs stating that the implementation uses S-box lookup tables and is therefore not\nhardened against cache-timing side channels, and cross-reference the `aes` crate's fixslicing\nbackend as the contrasting design. Longer term, consider a bitsliced or GFNI/`vgf2p8affineqb`-based\nS-box for the same reason `aes` moved to fixslicing.","locations":[{"ref":"aria/src/consts.rs:1-56","code":"    1 | pub const SB1: [u8; 256] = [\n    2 |     0x63, 0x7c, 0x77, 0x7b, 0xf2, 0x6b, 0x6f, 0xc5, 0x30, 0x01, 0x67, 0x2b, 0xfe, 0xd7, 0xab, 0x76,\n    3 |     0xca, 0x82, 0xc9, 0x7d, 0xfa, 0x59, 0x47, 0xf0, 0xad, 0xd4, 0xa2, 0xaf, 0x9c, 0xa4, 0x72, 0xc0,\n    4 |     0xb7, 0xfd, 0x93, 0x26, 0x36, 0x3f, 0xf7, 0xcc, 0x34, 0xa5, 0xe5, 0xf1, 0x71, 0xd8, 0x31, 0x15,\n    5 |     0x04, 0xc7, 0x23, 0xc3, 0x18, 0x96, 0x05, 0x9a, 0x07, 0x12, 0x80, 0xe2, 0xeb, 0x27, 0xb2, 0x75,\n    6 |     0x09, 0x83, 0x2c, 0x1a, 0x1b, 0x6e, 0x5a, 0xa0, 0x52, 0x3b, 0xd6, 0xb3, 0x29, 0xe3, 0x2f, 0x84,\n    7 |     0x53, 0xd1, 0x00, 0xed, 0x {"id":"OTHER_9","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`aria/src/consts.rs` contains four 256-entry S-box tables and a 16-entry `DIFFUSE_CONSTS` table with\nno documentation at all: no reference to RFC 5794, no statement of which table is which (`SB3` is\nthe inverse of `SB1`, `SB4` the inverse of `SB2`), and above all no explanation of the non-obvious\nbit-packing used by `DIFFUSE_CONSTS`, where each `u128` holds sixteen `0x00`/`0x01` bytes acting as\na column of the ARIA diffusion matrix so that `utils::diffuse` can implement a 16-way XOR as a\nsingle `u128` multiply-and-XOR. A reader cannot verify any of these constants without reverse\nengineering the trick. (I verified all five tables against the spec: `SB1` is the AES S-box, `SB3`\nits inverse, `SB4` the inverse of `SB2`, and every bit of `DIFFUSE_CONSTS` matches the 16 RFC 5794\ndiffusion equations - the values are correct, only undocumented.)","fix":"Add doc comments, e.g.\n```rust\n//! ARIA constants as specified in RFC 5794.\n\n/// ARIA S-box S1 (identical to the AES S-box). RFC 5794 §2.4.2.\npub const SB1: [u8; 256] = [...];\n/// ARIA S-box S2. RFC 5794 §2.4.2.\npub const SB2: [u8; 256] = [...];\n/// Inverse of `SB1`.\npub const SB3: [u8; 256] = [...];\n/// Inverse of `SB2`.\npub const SB4: [u8; 256] = [...];\n\n/// Key-schedule constants `C1`..`C3` (RFC 5794 §2.4.4): the first 384 bits of the\n/// fractional part of `1/PI`.\npub const C1: u128 = ...;\n\n/// Column masks for the ARIA diffusion layer `A` (RFC 5794 §2.4.3).\n///\n/// `DIFFUSE_CONSTS[i]` has byte `j` (counting from the most significant) set to `1` iff input\n/// byte `x[i]` contributes to output byte `y[j]`. This lets `utils::diffuse` evaluate all 16\n/// output equations with one `u128` multiply and XOR per input byte: because every byte of the\n/// mask is `0` or `1`, `mask * x[i]` never carries between byte lanes.\npub const DIFFUSE_CONSTS: [u128; 16] = [...];\n```\nAlso switch `pub` to `pub(crate)` for consistency with `aria/src/utils.rs`.","locations":[{"ref":"aria/src/consts.rs:1-2","code":"    1 | pub const SB1: [u8; 256] = [\n    2 |     0x63, 0x7c, 0x77, 0x7b, 0xf2, 0x6b, 0x6f, 0xc5, 0x30, 0x01, 0x67, 0x2b, 0xfe, 0xd7, 0xab, 0x76,","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aria/src/consts.rs#L1-L2"},{"ref":"aria/src/consts.rs:77-98","code":"   77 | pub const C1: u128 = 0x517cc1b727220a94fe13abe8fa9a6ee0;\n   78 | pub const C2: u128 = 0x6db14acc9e21c820ff28b1d5ef5de2b0;\n   79 | pub const C3: u128 = 0xdb92371d2126e9700324977504e8c90e;\n   80 | \n   81 | pub const DIFFUSE_CONSTS: [u128; 16] = [\n   82 |     0x0000_0001_0100_0100_0101_0000_0001_0100,\n   83 |     0x0000_0100_0001_0001_0101_0000_0100_0001,\n   84 |     0x0001_0000_0100_0100_0000_0101_0100_0001,\n   85 |     0x0100_0000_0001_0001_0000_0101_0001_0100,\n   86 |     0x0100_0100_0001_0000_0100_0001_0000_0101,\n   87 |     0x0001_0001_0100_0000_0001_0100_0000_0101,\n   88 |     0x0100_0100_0000_0001_0001_0100_0101_0000,\n   89 |     0x0001_0001_0000_0100_0100_0001_0101_0000,\n   90 |     0x0101_0000_0100_0001_0000_0100_0001_0001,\n   91 |     0x0101_0000_0001_0100_0000_0001_0100_0100,\n   92 |     0x0000_0101_0001_0100_0100_0000_0001_0001,\n   93 |     0x0000_0101_0100_0001_0001_0000_0100_0100,\n   94 |     0x0001_0100_0000_0101_0001_0001_0100_0000,\n   95 |     0x0100_0001_0000_0101_0100_0100_0001_0000,\n   96 |     0x0100_0001_0101_0000_0001_0001_0000_0100,\n   97 |     0x0001_0100_0101_0000_0100_0100_0000_0001,\n   98 | ];","lines":22,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aria/src/consts.rs#L77-L98"}]},
{"id":"OTHER_10","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`diffuse` multiplies a `u128` constant by a byte (`a * b as u128`) to spread that byte across the\npositions marked in the constant. The code is only overflow-free because every byte of every\n`DIFFUSE_CONSTS` entry is `0x00` or `0x01` (so `b <= 0xFF` can never carry out of its byte lane,\neven for entry 8 whose most significant byte is set). Nothing states this invariant, and a plain\n`*` on a `u128` will panic in debug builds / wrap silently in release builds the moment somebody\nedits a constant to hold a value greater than 1. The same unstated invariant governs\n`camellia/src/utils.rs::f`.","fix":"Document the invariant where it is relied upon, e.g. above `diffuse`:\n`// SAFETY-of-arithmetic: every byte of DIFFUSE_CONSTS is 0 or 1, so multiplying by a single byte\n// spreads it into the marked lanes without carrying between lanes and cannot overflow u128.`\nand consider a `const` assertion over `DIFFUSE_CONSTS` (all bytes `<= 1`) so a future edit fails to\ncompile instead of silently overflowing.","locations":[{"ref":"aria/src/utils.rs:3-10","code":"    3 | #[inline(always)]\n    4 | fn diffuse(x: [u8; 16]) -> u128 {\n    5 |     DIFFUSE_CONSTS\n    6 |         .iter()\n    7 |         .zip(x)\n    8 |         .map(|(a, b)| a * b as u128)\n    9 |         .fold(0, |a, v| a ^ v)\n   10 | }","lines":8,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aria/src/utils.rs#L3-L10"}]},
{"id":"OTHER_11","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"`belt-block` deliberately makes `cipher` an optional dependency (`default = [\"cipher\"]`) so that the raw `belt_block_raw` API can be used without it, but declares `zeroize = [\"cipher/zeroize\"]`. Because the feature path lacks the `?`, enabling `zeroize` implicitly turns the optional dependency back on: `cargo tree --no-default-features --features zeroize` in `belt-block/` pulls in `cipher v0.5.2` and its whole dependency tree, defeating the purpose of the optional dependency. The zeroizing code lives entirely in `cipher_impl.rs`, which is `#[cfg(feature = \"cipher\")]`, so there is nothing to zeroize when `cipher` is off.","fix":"Before:\n```toml\nzeroize = [\"cipher/zeroize\"]\n```\nAfter:\n```toml\nzeroize = [\"cipher?/zeroize\"]\n```","locations":[{"ref":"belt-block/Cargo.toml:20-22","code":"   20 | [features]\n   21 | default = [\"cipher\"]\n   22 | zeroize = [\"cipher/zeroize\"]","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/belt-block/Cargo.toml#L20-L22"},{"ref":"belt-block/src/cipher_impl.rs:10-11","code":"   10 | #[cfg(feature = \"zeroize\")]\n   11 | use cipher::zeroize::{Zeroize, ZeroizeOnDrop};","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/belt-block/src/cipher_impl.rs#L10-L11"}]},
{"id":"OTHER_12","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"The wide-block counter is mixed into the block with `xor_set(tail, &i.to_le_bytes())` where `i` is a\n`usize`, so the number of bytes actually XORed depends on the target pointer width: 8 bytes on a\n64-bit target, 4 bytes on a 32-bit target. The two agree today only because the high bytes of `i`\nare zero for `i < 2^32`, which is guaranteed on 32-bit targets but not on 64-bit ones. Encoding a\nprotocol field with a platform-dependent width in a cipher is a portability hazard that a reader\ncannot dismiss without doing this analysis.","fix":"Use a fixed-width integer for the counter so the encoding is pointer-width independent, e.g. bind\n`let ctr = u128::try_from(i).expect(\"counter fits in u128\");` (or keep the loop counter as `u64`)\nand XOR `&ctr.to_le_bytes()`, which also matches the standard's `<i>_128` little-endian encoding of\nthe block-sized counter.","locations":[{"ref":"belt-block/src/lib.rs:126-129","code":"  126 |         let s = belt_block_raw(to_u32(&s), key);\n  127 |         xor_set(tail1, &from_u32::<16>(&s));\n  128 |         xor_set(tail1, &i.to_le_bytes());\n  129 |     }","lines":4,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/belt-block/src/lib.rs#L126-L129"},{"ref":"belt-block/src/lib.rs:150-152","code":"  150 |         let s_enc = belt_block_raw(to_u32(&s), key);\n  151 |         xor_set(&mut data[tail_pos..], &from_u32::<16>(&s_enc));\n  152 |         xor_set(&mut data[tail_pos..], &i.to_le_bytes());","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/belt-block/src/lib.rs#L150-L152"}]},
{"id":"OTHER_13","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"`BlowfishLE` changes only the block I/O byte order (`T::read_u32_into` / `T::write_u32_into`); the\nkey schedule is unaffected by `T` because `next_u32_wrap` always assembles key words big-endian\n(`v = (v << 8) | buf[*offset]`). Whether that mixed convention matches any other implementation is\nunverifiable from this crate: per `blowfish/tests/mod.rs` the `BlowfishLE` vectors\n\"were randomly generated using implementation in this crate\", i.e. they are self-referential and\nwould happily lock in a wrong key-schedule endianness. Neither the type alias nor the crate docs\nsay what `BlowfishLE` is supposed to be compatible with.","fix":"Document on `BlowfishLE` that the endianness parameter affects only block serialization and that\nthe key schedule always consumes key bytes big-endian, and name the third-party implementation the\nvariant is compatible with. If such an implementation exists, add its published vectors to\n`blowfish/tests`; if none does, consider deprecating `BlowfishLE`.","locations":[{"ref":"blowfish/src/lib.rs:39-48","code":"   39 | /// Blowfish variant which uses Little Endian byte order read/writes.s.\n   40 | pub type BlowfishLE = Blowfish<LE>;\n   41 | \n   42 | /// Blowfish block cipher instance.\n   43 | #[derive(Clone)]\n   44 | pub struct Blowfish<T: ByteOrder = BE> {\n   45 |     s: [[u32; 256]; 4],\n   46 |     p: [u32; 18],\n   47 |     _pd: PhantomData<T>,\n   48 | }","lines":10,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/blowfish/src/lib.rs#L39-L48"},{"ref":"blowfish/src/lib.rs:50-60","code":"   50 | fn next_u32_wrap(buf: &[u8], offset: &mut usize) -> u32 {\n   51 |     let mut v = 0;\n   52 |     for _ in 0..4 {\n   53 |         if *offset >= buf.len() {\n   54 |             *offset = 0;\n   55 |         }\n   56 |         v = (v << 8) | buf[*offset] as u32;\n   57 |         *offset += 1;\n   58 |     }\n   59 |     v\n   60 | }","lines":11,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/blowfish/src/lib.rs#L50-L60"}]},
{"id":"OTHER_14","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`SBOX2`, `SBOX3` and `SBOX4` are not independent tables: per RFC 3713 they are derived from\n`SBOX1` by `SBOX2[x] = SBOX1[x] <<< 1`, `SBOX3[x] = SBOX1[x] <<< 7` and\n`SBOX4[x] = SBOX1[x <<< 1]`. I verified that all three relations hold for the transcribed tables,\nbut nothing in the crate records or checks them, so a single-nibble typo introduced during a future\nedit of one of the 768 derived entries would only be caught if it happened to affect one of the\nthree RFC test vectors. `belt-block/src/consts.rs` already demonstrates the right pattern with its\n`test_extended_blocks` test, which reconstructs `H5`/`H13`/`H21`/`H29` from `H`.","fix":"Document the derivations in the doc comment and add a unit test to `camellia/src/consts.rs`:\n```rust\n#[cfg(test)]\nmod tests {\n    use super::SBOXES;\n\n    #[test]\n    fn sboxes_are_derived_from_sbox1() {\n        for x in 0..256usize {\n            assert_eq!(SBOXES[1][x], SBOXES[0][x].rotate_left(1));\n            assert_eq!(SBOXES[2][x], SBOXES[0][x].rotate_left(7));\n            assert_eq!(SBOXES[3][x], SBOXES[0][(x as u8).rotate_left(1) as usize]);\n        }\n    }\n}\n```","locations":[{"ref":"camellia/src/consts.rs:17-20","code":"   17 | /// Sboxes of Camellia defined in RFC 3713.\n   18 | pub const SBOXES: [[u8; 256]; 4] = [\n   19 |     // SBOX1\n   20 |     [","lines":4,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/camellia/src/consts.rs#L17-L20"}]},
{"id":"OTHER_15","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"The Camellia F-function is imported at module scope as `f` (`use utils::{f, fl, flinv};`) and is\nthen shadowed by the closure parameter also named `f` in `encrypt_with_backend` and\n`decrypt_with_backend`. Inside those bodies `f.call(self)` refers to the closure, not the\nF-function, and `f(..)` would no longer compile - a name collision on the single most\nsecurity-critical helper in the crate, which makes the code needlessly hard to review.","fix":"Rename one of the two. Either import the helper under a clearer name\n(`use utils::{f as feistel_f, fl, flinv};`) or rename the trait parameter, e.g.\n`fn encrypt_with_backend(&self, closure: impl BlockCipherEncClosure<BlockSize = Self::BlockSize>) { closure.call(self) }`.","locations":[{"ref":"camellia/src/lib.rs:66-68","code":"   66 | mod utils;\n   67 | \n   68 | use utils::{f, fl, flinv};","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/camellia/src/lib.rs#L66-L68"},{"ref":"camellia/src/lib.rs:101-106","code":"  101 | impl<KeySize: ArraySize, const RK: usize> BlockCipherEncrypt for Camellia<KeySize, RK> {\n  102 |     #[inline]\n  103 |     fn encrypt_with_backend(&self, f: impl BlockCipherEncClosure<BlockSize = Self::BlockSize>) {\n  104 |         f.call(self)\n  105 |     }\n  106 | }","lines":6,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/camellia/src/lib.rs#L101-L106"},{"ref":"camellia/src/lib.rs:138-143","code":"  138 | impl<KeySize: ArraySize, const RK: usize> BlockCipherDecrypt for Camellia<KeySize, RK> {\n  139 |     #[inline]\n  140 |     fn decrypt_with_backend(&self, f: impl BlockCipherDecClosure<BlockSize = Self::BlockSize>) {\n  141 |         f.call(self)\n  142 |     }\n  143 | }","lines":6,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/camellia/src/lib.rs#L138-L143"}]},
{"id":"OTHER_16","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"The decryption loop indexes subkeys with a parity trick that is both undocumented and fragile:\n`(2..RK - 2).rev().step_by(2)` yields *odd* `i` (starting at `RK - 3`) whereas the encryption loop\nyields *even* `i`, which is why the `FL`/`FL^-1` layer test has to be spelled `(i - 1) % 8 == 0`\nhere and `i % 8 == 0` there, and why `fl`/`flinv` appear to be applied with swapped subkeys\n(`fl(d1, k[i])`, `flinv(d2, k[i - 1])`). All of this silently depends on `RK` being even - with an\nodd `RK` the iterator would produce even indices and the `FL` layers would land in the wrong rounds\n- yet the type's doc comment only lists the intended `(KeySize, RK)` pairs without stating the\nparity requirement.","fix":"Add a short comment above the decryption loop explaining that `i` is odd here (so the FL-layer test\nis shifted by one and `fl`/`flinv` swap roles because the two halves are exchanged relative to\nencryption), and note in the `Camellia` doc comment that `RK` must be even. Optionally add\n`const { assert!(RK % 2 == 0) }` (or an equivalent const-eval guard) so an invalid `RK` fails at\ncompile time.","locations":[{"ref":"camellia/src/lib.rs:155-164","code":"  155 |         for i in (2..RK - 2).rev().step_by(2) {\n  156 |             if (i - 1) % 8 == 0 {\n  157 |                 d1 = fl(d1, self.k[i]);\n  158 |                 d2 = flinv(d2, self.k[i - 1]);\n  159 | \n  160 |                 continue;\n  161 |             }\n  162 |             d2 ^= f(d1, self.k[i]);\n  163 |             d1 ^= f(d2, self.k[i - 1]);\n  164 |         }","lines":10,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/camellia/src/lib.rs#L155-L164"},{"ref":"camellia/src/lib.rs:70-80","code":"   70 | /// Generic implementation of the Camellia block cipher.\n   71 | ///\n   72 | /// This type can be initialized only with 3 combinations of `KeySize` and `RK`:\n   73 | /// - Camellia-128: U16, 26\n   74 | /// - Camellia-192: U24, 34\n   75 | /// - Camellia-256: U32, 34\n   76 | #[derive(Clone)]\n   77 | pub struct Camellia<KeySize: ArraySize, const RK: usize> {\n   78 |     k: [u64; RK],\n   79 |     _pd: PhantomData<KeySize>,\n   80 | }","lines":11,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/camellia/src/lib.rs#L70-L80"}]},
{"id":"OTHER_17","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"The four key-schedule functions in `camellia/src/utils.rs` are inconsistently named and completely\nundocumented, which makes reviewing them against RFC 3713 harder than it needs to be in a crate whose\ncorrectness rests entirely on that transcription:\n\n- `gen_subkeys26` vs `get_subkeys34` - the same operation spelled with two different verbs, and\n  `get_` wrongly suggests a cheap accessor rather than the full subkey derivation.\n- `set_ka` / `set_kb` do not set anything; they compute and return `KA` / `KB`.\n- None of the four has a doc comment or an RFC 3713 section reference, unlike `f`/`fl`/`flinv` right\n  above them. The `26` and `34` in the names are unexplained (they are the subkey-array lengths for\n  Camellia-128 and Camellia-192/256).\n- Minor style drift: `gen_subkeys26` uses `[0; 26]` while `get_subkeys34` uses `[u64::default(); 34]`\n  for the same thing.","fix":"Rename to a consistent set (`gen_ka`, `gen_kb`, `gen_subkeys26`, `gen_subkeys34`) and add doc\ncomments citing the spec, e.g.:\n\n```rust\n/// Derives `KA` from `(KL, KR)` per RFC 3713 section 2.2.\npub(crate) fn gen_ka(kl: (u64, u64), kr: (u64, u64)) -> (u64, u64) {\n\n/// Expands `KL`/`KA` into the 26 subkeys `kw1..kw4`, `k1..k18`, `ke1..ke4` used by Camellia-128\n/// (RFC 3713 section 2.2).\npub(crate) fn gen_subkeys26(kl: (u64, u64), ka: (u64, u64)) -> [u64; 26] {\n```\n\nand change `[u64::default(); 34]` to `[0u64; 34]` to match `gen_subkeys26`. Update the three call\nsites in `camellia/src/camellia128.rs`, `camellia192.rs` and `camellia256.rs`.","locations":[{"ref":"camellia/src/utils.rs:47-67","code":"   47 | pub(crate) fn set_ka(kl: (u64, u64), kr: (u64, u64)) -> (u64, u64) {\n   48 |     let mut d1 = kl.0 ^ kr.0;\n   49 |     let mut d2 = kl.1 ^ kr.1;\n   50 |     d2 ^= f(d1, SIGMAS[0]);\n   51 |     d1 ^= f(d2, SIGMAS[1]);\n   52 |     d1 ^= kl.0;\n   53 |     d2 ^= kl.1;\n   54 |     d2 ^= f(d1, SIGMAS[2]);\n   55 |     d1 ^= f(d2, SIGMAS[3]);\n   56 | \n   57 |     (d1, d2)\n   58 | }\n   59 | \n   60 | pub(crate) fn set_kb(ka: (u64, u64), kr: (u64, u64)) -> (u64, u64) {\n   61 |     let mut d1 = ka.0 ^ kr.0;\n   62 |     let mut d2 = ka.1 ^ kr.1;\n   63 |     d2 ^= f(d1, SIGMAS[4]);\n   64 |     d1 ^= f(d2, SIGMAS[5]);\n   65 | \n   66 |     (d1, d2)\n   67 | }","lines":21,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/camellia/src/utils.rs#L47-L67"},{"ref":"camellia/src/utils.rs:87-88","code":"   87 | pub(crate) fn gen_subkeys26(kl: (u64, u64), ka: (u64, u64)) -> [u64; 26] {\n   88 |     let mut k = [0; 26];","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/camellia/src/utils.rs#L87-L88"},{"ref":"camellia/src/utils.rs:126-132","code":"  126 | pub(crate) fn get_subkeys34(\n  127 |     kl: (u64, u64),\n  128 |     kr: (u64, u64),\n  129 |     ka: (u64, u64),\n  130 |     kb: (u64, u64),\n  131 | ) -> [u64; 34] {\n  132 |     let mut k = [u64::default(); 34];","lines":7,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/camellia/src/utils.rs#L126-L132"}]},
{"id":"OTHER_18","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"Both CAST crates advertise `ZeroizeOnDrop` and zeroize their `masking`/`rotate` state on drop, but\nevery intermediate that holds raw or derived key material is left on the stack un-wiped, which\ndefeats much of the point of the feature:\n\n- `cast5/src/lib.rs` `new_from_slice`: `padded_key` is a full copy of the caller's key.\n- `cast5/src/lib.rs` `key_schedule`: `x`, `z` and `k` hold the key and all 32 derived subkey words.\n- `cast6/src/lib.rs` `new_from_slice`: `padded_key` is a full copy of the caller's key (and, unlike\n  CAST5, is built even for the common 32-byte case where the copy is pure overhead).\n- `cast6/src/lib.rs` `key_schedule`: `kappa` holds the key and all of its `W`-transform states.\n\nA caller who enables `zeroize` reasonably expects the key not to survive `Cast5::new`/`Cast6::new`.","fix":"Zeroize the intermediates before they go out of scope, gated on the feature. For example in\n`cast5::Cast5::key_schedule`:\n\n```rust\nkey_schedule(&mut x, &mut z, &mut k);\nfor (i, ki) in k.iter().enumerate() {\n    self.rotate[i] = (ki & 0x1f) as u8;\n}\n#[cfg(feature = \"zeroize\")]\n{\n    x.zeroize();\n    z.zeroize();\n    k.zeroize();\n}\n```\n\nand likewise `padded_key.zeroize()` at the end of both `new_from_slice` implementations and\n`kappa.zeroize()` at the end of `Cast6::key_schedule`. Prefer `cipher::zeroize::Zeroizing` wrappers\nso the wipe cannot be skipped by an early return.","locations":[{"ref":"cast5/src/lib.rs:83-102","code":"   83 |     fn key_schedule(&mut self, key: &[u8]) {\n   84 |         let mut x = [\n   85 |             u32::from_be_bytes(key[0..4].try_into().unwrap()),\n   86 |             u32::from_be_bytes(key[4..8].try_into().unwrap()),\n   87 |             u32::from_be_bytes(key[8..12].try_into().unwrap()),\n   88 |             u32::from_be_bytes(key[12..16].try_into().unwrap()),\n   89 |         ];\n   90 | \n   91 |         let mut z = [0u32; 4];\n   92 |         let mut k = [0u32; 16];\n   93 | \n   94 |         key_schedule(&mut x, &mut z, &mut k);\n   95 |         self.masking[..].clone_from_slice(&k[..]);\n   96 | \n   97 |         key_schedule(&mut x, &mut z, &mut k);\n   98 | \n   99 |         for (i, ki) in k.iter().enumerate() {\n  100 |             self.rotate[i] = (ki & 0x1f) as u8;\n  101 |         }\n  102 |     }","lines":20,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/cast5/src/lib.rs#L83-L102"},{"ref":"cast5/src/lib.rs:149-156","code":"  149 |         if key.len() < 16 {\n  150 |             // Pad keys that are less than 128 bits long.\n  151 |             let mut padded_key = [0u8; 16];\n  152 |             padded_key[..key.len()].copy_from_slice(key);\n  153 |             cast5.key_schedule(&padded_key[..]);\n  154 |         } else {\n  155 |             cast5.key_schedule(key);\n  156 |         }","lines":8,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/cast5/src/lib.rs#L149-L156"},{"ref":"cast6/src/lib.rs:68-69","code":"   68 |     fn key_schedule(&mut self, key: &[u8; 32]) {\n   69 |         let mut kappa = to_u32s(key);","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/cast6/src/lib.rs#L68-L69"},{"ref":"cast6/src/lib.rs:195-198","code":"  195 |         // Pad keys that are less than 256 bits long.\n  196 |         let mut padded_key = [0u8; 32];\n  197 |         padded_key[..key.len()].copy_from_slice(key);\n  198 |         cast6.key_schedule(&padded_key);","lines":4,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/cast6/src/lib.rs#L195-L198"}]},
{"id":"OTHER_19","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`weak_key_test` is carefully written to be branchless over secret data - it accumulates `is_weak |= u8::from(..)` across all 64 table entries instead of returning early - but the multi-key checks then use slice equality (`key[..8] == key[8..]`, `k1 == k2`, `k1 == k3`, `k2 == k3`). `<[u8] as PartialEq>::eq` lowers to `memcmp`, which short-circuits on the first differing byte, so the running time leaks the length of the common prefix of the secret 3DES sub-keys. The mixed style is inconsistent with the surrounding code's evident intent.","fix":"Compare the sub-keys as already-loaded `u64` values instead of as slices, which is branchless:\n\n```rust\nlet mut subkeys = key.chunks_exact(8).map(|c| u64::from_ne_bytes(c.try_into().unwrap()));\n// ...\nmatch key.len() {\n    16 => is_weak |= u8::from(k[0] == k[1]),\n    24 => {\n        is_weak |= u8::from(k[0] == k[1]);\n        is_weak |= u8::from(k[0] == k[2]);\n        is_weak |= u8::from(k[1] == k[2]);\n    }\n    _ => {}\n}\n```\n\nor use `subtle::ConstantTimeEq` for the slice comparisons.","locations":[{"ref":"des/src/weak_key.rs:16-38","code":"   16 |     let mut is_weak = 0u8;\n   17 | \n   18 |     for subkey in key.chunks_exact(8) {\n   19 |         let key = u64::from_ne_bytes(subkey.try_into().expect(\"`subkey` length is equal to 8\"));\n   20 |         for &weak_key in WEAK_KEYS {\n   21 |             is_weak |= u8::from(key == weak_key);\n   22 |         }\n   23 |     }\n   24 | \n   25 |     match key.len() {\n   26 |         16 => {\n   27 |             is_weak |= u8::from(key[..8] == key[8..]);\n   28 |         }\n   29 |         24 => {\n   30 |             let k1 = &key[..8];\n   31 |             let k2 = &key[8..16];\n   32 |             let k3 = &key[16..];\n   33 |             is_weak |= u8::from(k1 == k2);\n   34 |             is_weak |= u8::from(k1 == k3);\n   35 |             is_weak |= u8::from(k2 == k3);\n   36 |         }\n   37 |         _ => {}\n   38 |     }","lines":23,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/des/src/weak_key.rs#L16-L38"}]},
{"id":"OTHER_20","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`WEAK_KEYS` is declared as `pub(crate) static WEAK_KEYS: &[u64; 64]`, i.e. a static *reference* to another anonymous static, adding a pointer indirection for no benefit, and it is only ever read inside `weak_key.rs` so `pub(crate)` is broader than needed. More importantly, the entries are built with `u64::from_ne_bytes`, so their numeric values differ between little- and big-endian targets. That happens to work today only because `weak_key_test` also loads the candidate with `from_ne_bytes`, but `Des::new` loads keys with `from_be_bytes` - so any future code that compares `Des`'s subkeys or a big-endian-loaded key against `WEAK_KEYS` will be silently wrong on little-endian machines, with no comment warning about the coupling.","fix":"Make the table a plain private array and use big-endian loading on both sides so the constants match the\nbyte order used everywhere else in the crate:\n\n```rust\nmacro_rules! as_be_u64 {\n    [$($key:expr,)*] => { [$(u64::from_be_bytes($key),)*] };\n}\n\nstatic WEAK_KEYS: [u64; 64] = as_be_u64![ .. ];\n```\n\nand correspondingly `let key = u64::from_be_bytes(subkey.try_into().expect(..));` in `weak_key_test`.\nIf `from_ne_bytes` is kept deliberately, add a one-line comment stating that both sides must use the same\nloader and that the values are not portable constants.","locations":[{"ref":"des/src/weak_key.rs:59-66","code":"   59 | macro_rules! as_ne_u64 {\n   60 |     [$($key:expr,)*] => {\n   61 |         [$(u64::from_ne_bytes($key),)*]\n   62 |     };\n   63 | }\n   64 | \n   65 | pub(crate) static WEAK_KEYS: &[u64; 64] = &as_ne_u64![\n   66 |     [0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01],","lines":8,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/des/src/weak_key.rs#L59-L66"},{"ref":"des/src/weak_key.rs:18-23","code":"   18 |     for subkey in key.chunks_exact(8) {\n   19 |         let key = u64::from_ne_bytes(subkey.try_into().expect(\"`subkey` length is equal to 8\"));\n   20 |         for &weak_key in WEAK_KEYS {\n   21 |             is_weak |= u8::from(key == weak_key);\n   22 |         }\n   23 |     }","lines":6,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/des/src/weak_key.rs#L18-L23"}]},
{"id":"OTHER_21","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"`Gift128::decrypt_block` drives the 8 inverse quintuple rounds with a hand-rolled `while i > 0 { ..; i -= 5 }` loop *plus* a duplicated copy of the loop body after the loop, because `i == 0` is the last round index and would be skipped by the condition. The construct is correct today (indices 35, 30, 25, 20, 15, 10, 5 then 0) but it is fragile: the round count `35` and the stride `5` are hard-coded in three places, the trailing call is easy to lose in a refactor, and it silently relies on 35 being divisible by 5 to avoid `i -= 5` underflowing. It is also gratuitously asymmetric with `encrypt_block`, which uses a plain `for i in (0..40).step_by(5)`.","fix":"Use the exact reverse of the encryption iterator, which yields the same 8 indices with no duplicated body\nand no manual decrement:\n\nbefore\n```rust\n        let mut i: usize = 35;\n        while i > 0 {\n            inv_quintuple_round(&mut state, &self.k[i * 2..], &GIFT_RC[i..]);\n            i -= 5;\n        }\n        inv_quintuple_round(&mut state, &self.k[i * 2..], &GIFT_RC[i..]);\n```\nafter\n```rust\n        for i in (0..40).step_by(5).rev() {\n            inv_quintuple_round(&mut state, &self.k[i * 2..], &GIFT_RC[i..]);\n        }\n```","locations":[{"ref":"gift-cipher/src/lib.rs:117-131","code":"  117 | impl BlockCipherDecBackend for Gift128 {\n  118 |     #[inline]\n  119 |     fn decrypt_block(&self, mut block: InOut<'_, '_, Block<Self>>) {\n  120 |         let b = block.get_in();\n  121 |         let mut state = [0u32; 4];\n  122 |         packing(&mut state, b.into());\n  123 |         let mut i: usize = 35;\n  124 |         while i > 0 {\n  125 |             inv_quintuple_round(&mut state, &self.k[i * 2..], &GIFT_RC[i..]);\n  126 |             i -= 5;\n  127 |         }\n  128 |         inv_quintuple_round(&mut state, &self.k[i * 2..], &GIFT_RC[i..]);\n  129 |         unpacking(&state, block.get_out().into());\n  130 |     }\n  131 | }","lines":15,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/gift-cipher/src/lib.rs#L117-L131"},{"ref":"gift-cipher/src/lib.rs:97-108","code":"   97 | impl BlockCipherEncBackend for Gift128 {\n   98 |     #[inline]\n   99 |     fn encrypt_block(&self, mut block: InOut<'_, '_, Block<Self>>) {\n  100 |         let b = block.get_in();\n  101 |         let mut state = [0u32; 4];\n  102 |         packing(&mut state, b.into());\n  103 |         for i in (0..40).step_by(5) {\n  104 |             quintuple_round(&mut state, &self.k[i * 2..], &GIFT_RC[i..]);\n  105 |         }\n  106 |         unpacking(&state, block.get_out().into());\n  107 |     }\n  108 | }","lines":12,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/gift-cipher/src/lib.rs#L97-L108"}]},
{"id":"OTHER_22","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"The whole GIFT bit-manipulation layer is a literal transliteration of C macros and passes the 4-byte\n`Copy` type `u32` by *reference* everywhere: `ror(x: &u32, y: &u32)`, `byte_ror_2(x: &u32)`,\n`nibble_ror_1(x: &u32)`, `key_update(x: &u32)`, and so on - about 20 functions. Call sites are forced into\n`ror(&s3, &16)`, taking a reference to an integer literal. The style is also inconsistent within the same\nfile: `half_ror_4(&x: &u32)`, `half_ror_12(&x: &u32)` and `nibble_ror_3(&x: &u32)` destructure in the\npattern while their immediate neighbours `byte_ror_2(x: &u32)`, `half_ror_8(x: &u32)` and\n`nibble_ror_2(x: &u32)` rely on auto-deref through the operator impls on `&u32`. Three different\nconventions for the same one-line shape makes the file harder to review than the constants inside it\nalready are.","fix":"Take `u32` by value and return `u32`, which is both idiomatic and shorter at every call site:\n\nbefore\n```rust\npub(crate) fn byte_ror_2(x: &u32) -> u32 {\n    (((x) >> 2) & 0x3f3f3f3f) | (((x) & 0x03030303) << 6)\n}\n```\nafter\n```rust\npub(crate) fn byte_ror_2(x: u32) -> u32 {\n    ((x >> 2) & 0x3f3f3f3f) | ((x & 0x03030303) << 6)\n}\n```\n\nDrop `ror` entirely in favour of the inherent `u32::rotate_right`, so `ror(&s3, &16)` becomes\n`s3.rotate_right(16)`. Apply the same treatment to the `rearrange_rkey_*` / `key_*_update_*` helpers in\n`key_schedule.rs`.","locations":[{"ref":"gift-cipher/src/primitives.rs:6-54","code":"    6 | #[inline]\n    7 | pub(crate) fn ror(x: &u32, y: &u32) -> u32 {\n    8 |     (*x).rotate_right(*y)\n    9 | }\n   10 | \n   11 | #[inline]\n   12 | pub(crate) fn byte_ror_2(x: &u32) -> u32 {\n   13 |     (((x) >> 2) & 0x3f3f3f3f) | (((x) & 0x03030303) << 6)\n   14 | }\n   15 | \n   16 | #[inline]\n   17 | pub(crate) fn byte_ror_4(x: &u32) -> u32 {\n   18 |     (((x) >> 4) & 0x0f0f0f0f) | (((x) & 0x0f0f0f0f) << 4)\n   19 | }
