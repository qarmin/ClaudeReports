{"id":"CMT_21","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The crate-level documentation for the `kuznyechik_backend` flag is stale and incomplete in ways that matter for a hazmat crate: it tells users to set the flag by \"modifying `.cargo/config`\" (the file has been called `.cargo/config.toml` since Cargo 1.39 and plain `.cargo/config` is deprecated), it never mentions that the default backend on x86/x86_64/aarch64 is a SIMD one selected by `target_feature` (so the listed values are the only thing documented, while the actual default is invisible), and it describes the difference between the backends purely as \"performance\" although the real difference is a 128 KiB secret-indexed lookup table (`ENC_TABLE` + `DEC_TABLE`) versus ~2 KiB of tables. Nothing warns that all backends - including `compact_soft`, which still does secret-dependent lookups into `P`, `P_INV` and the seven `GFT_*` tables - are cache-timing sensitive. The `zeroize` feature is also undocumented.","fix":"Update the paragraph to say `.cargo/config.toml`, state that SIMD backends are used by default when the target supports them, and add an explicit caveat, e.g.: \"All backends use secret-dependent table lookups and are therefore not constant-time; the default fused-table backends index 64 KiB tables (`ENC_TABLE`/`DEC_TABLE`), while `compact_soft` reduces the footprint to roughly 2 KiB without becoming constant-time.\" Also document the `zeroize` feature.","locations":[{"ref":"kuznyechik/src/lib.rs:11-24","code":"   11 | //! # Configuration Flags\n   12 | //!\n   13 | //! You can modify crate using the `kuznyechik_backend` configuration flag.\n   14 | //! It accepts the following values\n   15 | //!\n   16 | //! - `soft`: use software backend with big fused tables.\n   17 | //! - `compact_soft`: use software backend with small tables and slower performance.\n   18 | //!\n   19 | //! The flag can be enabled using `RUSTFLAGS` environment variable\n   20 | //! (e.g. `RUSTFLAGS='--cfg kuznyechik_backend=\"soft\"'`) or by modifying\n   21 | //! `.cargo/config`.\n   22 | //!\n   23 | //! [Kuznyechik]: https://en.wikipedia.org/wiki/Kuznyechik\n   24 | //! [GOST R 34.12-2015]: https://tc26.ru/standard/gost/GOST_R_3412-2015.pdf","lines":14,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/lib.rs#L11-L24"}]},
{"id":"CMT_22","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The initialization comments in `key_into_words` and `initialize_expanded_key_table` are swapped, and each is\nwrong where it stands. `key_into_words` says `// can be uninitialized` but the array *must* be zeroed: the\nfirst loop iteration reads `key_as_words[i / W::Bytes::USIZE]` before ever writing it, so a truly\nuninitialized buffer would produce garbage round keys. `initialize_expanded_key_table` says\n`// must be zero initialized` but every element is overwritten (`[0]` explicitly, `1..len` by the loop), so\nthe `Array::from_fn(|_| W::ZERO)` fill is pure redundant work. A future \"optimization\" that trusts these\ncomments would silently break key expansion.","fix":"Swap them:\n```rust\nfn key_into_words(key: &Key<B>) -> KeyAsWords<W, B> {\n    // must be zero initialized: the loop below reads each word before writing it\n    let mut key_as_words: Array<W, KeyAsWordsSize<W, B>> = Array::default();\n```\nand\n```rust\nfn initialize_expanded_key_table() -> ExpandedKeyTable<W, R> {\n    // every element is overwritten below, so the initial value is irrelevant\n    let mut expanded_key_table: Array<W, ExpandedKeyTableSize<R>> = Array::default();\n```","locations":[{"ref":"rc5/src/lib.rs:98-100","code":"   98 |     fn key_into_words(key: &Key<B>) -> KeyAsWords<W, B> {\n   99 |         // can be uninitialized\n  100 |         let mut key_as_words: Array<W, KeyAsWordsSize<W, B>> = Array::default();","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc5/src/lib.rs#L98-L100"},{"ref":"rc5/src/lib.rs:111-113","code":"  111 |     fn initialize_expanded_key_table() -> ExpandedKeyTable<W, R> {\n  112 |         // must be zero initialized\n  113 |         let mut expanded_key_table: Array<W, ExpandedKeyTableSize<R>> = Array::from_fn(|_| W::ZERO);","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc5/src/lib.rs#L111-L113"}]},
{"id":"CMT_23","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"`rc6/README.md` still advertises an MSRV of Rust **1.56**, both in prose and in the `rustc-image` badge, while `rc6/Cargo.toml` sets `rust-version = \"1.85\"`, `.github/workflows/rc6.yml` tests only `1.85.0 # MSRV` and stable, and the root `README.md` table shows the `MSRV 1.85` badge for `rc6`. `rc6` is the only crate whose README carries a stale hand-written MSRV section; all 20 others use the `rustc-1.85+` badge with no prose claim.","fix":"Change the prose to `Rust **1.85** or higher.` and the badge to `[rustc-image]: https://img.shields.io/badge/rustc-1.85+-blue.svg`, or delete the `## Minimum Supported Rust Version` section entirely so `rc6/README.md` matches the other crate READMEs and derives the MSRV from `Cargo.toml` alone.","locations":[{"ref":"rc6/README.md:27-32","code":"   27 | ## Minimum Supported Rust Version\n   28 | \n   29 | Rust **1.56** or higher.\n   30 | \n   31 | Minimum supported Rust version can be changed in the future, but it will be\n   32 | done with a minor version bump.","lines":6,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc6/README.md#L27-L32"}]},
{"id":"CMT_24","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The module doc in `rc6/src/core/mod.rs` puts the link-reference definition\n`[RC6 paper]: https://...` on the line immediately after the paragraph that uses it. Per\nCommonMark a link reference definition cannot interrupt a paragraph, so it is rendered as\nliteral text and `[RC6 paper]` stays an unresolved link - clippy flags the bare URL at\nthis exact spot. `rc5/src/lib.rs` and `serpent/src/lib.rs` get this right by leaving a\nblank doc line first.","fix":"Before:\n\n```rust\n//! Implementation according to the [RC6 paper]\n//! [RC6 paper]: https://www.grc.com/r&d/rc6.pdf\n```\n\nAfter:\n\n```rust\n//! Implementation according to the [RC6 paper].\n//!\n//! [RC6 paper]: https://www.grc.com/r&d/rc6.pdf\n```","locations":[{"ref":"rc6/src/core/mod.rs:1-2","code":"    1 | //! Implementation according to the [RC6 paper]\n    2 | //! [RC6 paper]: https://www.grc.com/r&d/rc6.pdf","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc6/src/core/mod.rs#L1-L2"}]},
{"id":"CMT_25","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The `speck-cipher` crate-level documentation is missing the \"Security Warning: Hazmat!\" block that every\nother cipher crate in this workspace carries in `src/lib.rs` (`serpent`, `sm4`, `threefish`, `twofish`,\n`aes`, `blowfish`, ... all have it) and that `speck-cipher/README.md` itself contains. Because the README\nwarning is not part of the rustdoc, users reading the docs on docs.rs get no hazmat warning at all - which is\nparticularly unfortunate for Speck, a cipher whose standardisation was rejected by ISO.","fix":"Before:\n```rust\n//! Pure Rust implementation of the [Speck] block cipher.\n//!\n//! [Speck]: https://en.wikipedia.org/wiki/Speck_(cipher)\n```\nAfter:\n```rust\n//! Pure Rust implementation of the [Speck] block cipher.\n//!\n//! # ⚠️ Security Warning: Hazmat!\n//!\n//! This crate implements only the low-level block cipher function, and is intended\n//! for use for implementing higher-level constructions *only*. It is NOT\n//! intended for direct use in applications.\n//!\n//! USE AT YOUR OWN RISK!\n//!\n//! [Speck]: https://en.wikipedia.org/wiki/Speck_(cipher)\n```","locations":[{"ref":"speck-cipher/src/lib.rs:1-3","code":"    1 | //! Pure Rust implementation of the [Speck] block cipher.\n    2 | //!\n    3 | //! [Speck]: https://en.wikipedia.org/wiki/Speck_(cipher)","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/speck-cipher/src/lib.rs#L1-L3"}]},
{"id":"CMT_26","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The public doc comment on the `Xtea` struct reads `/// XTEA block self.`, which is meaningless - it looks like the result of a botched search-and-replace of `cipher` with `self`. This is the very first piece of documentation a user sees for the crate's only public type on `docs.rs`.","fix":"Before:\n```rust\n/// XTEA block self.\npub struct Xtea {\n```\nAfter:\n```rust\n/// XTEA block cipher.\npub struct Xtea {\n```","locations":[{"ref":"xtea/src/lib.rs:38-41","code":"   38 | /// XTEA block self.\n   39 | pub struct Xtea {\n   40 |     k: [u32; 4],\n   41 | }","lines":4,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/xtea/src/lib.rs#L38-L41"}]},
{"id":"CMT_27","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The doc comment on `define_mix_columns!` contains a bare URL\n(`similar to https://github.com/Ko-/aes-armcortexm.`), unlike every other reference in the fixslice\nbackend (`sbox.rs`, `mod.rs`) which wraps links in angle brackets. Besides the inconsistency, the\ntrailing `.` is glued to the URL, so it becomes part of the link in any renderer.","fix":"Before: `/// Based on Käsper-Schwabe, similar to https://github.com/Ko-/aes-armcortexm.` After: `/// Based on Käsper-Schwabe, similar to <https://github.com/Ko-/aes-armcortexm>.`","locations":[{"ref":"aes/src/backends/fixslice/mix_columns.rs:3-6","code":"    3 | /// Computation of the MixColumns transformation in the fixsliced representation,\n    4 | /// with different rotations used according to the round number mod 4.\n    5 | ///\n    6 | /// Based on Käsper-Schwabe, similar to https://github.com/Ko-/aes-armcortexm.","lines":4,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends/fixslice/mix_columns.rs#L3-L6"}]},
{"id":"CMT_28","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The doc comment on `broadcast` refers to a type `Batch<W>` that does not exist anywhere in the crate. The return type is `BatchBlocks<W>` (defined in `aes/src/backends/fixslice/mod.rs` as `Array<crate::Block, <W as Word>::Blocks>`).","fix":"Change `` /// Replicate a single 16-byte input block across all slots of a `Batch<W>`. `` to `` /// Replicate a single 16-byte input block across all slots of a `BatchBlocks<W>`. ``","locations":[{"ref":"aes/src/backends/fixslice/utils.rs:3-6","code":"    3 | /// Replicate a single 16-byte input block across all slots of a `Batch<W>`.\n    4 | ///\n    5 | /// Used by the key schedules, which conceptually call `bitslice(...)` on the\n    6 | /// same input block several times to fill the bitsliced state.","lines":4,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends/fixslice/utils.rs#L3-L6"}]},
{"id":"CMT_29","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"`Word::ROW_BITS` is defined as `(size_of::<Self>() * 2) as u32`, which is unexplained magic: the value wanted is \"bits per word divided by the 4 state rows\", i.e. `size_of * 8 / 4`, which happens to equal `size_of * 2`. In a constant-time crypto primitive where every mask and rotation distance derives from this constant (`HALF_ROW`, `QUARTER_ROW`, `ror_distance`), the arithmetic should state its reasoning rather than leave a reader to rediscover the coincidence.","fix":"Spell the derivation out:\n```rust\n    /// Width in bits of one row of the bitsliced state (8 for `u32`, 16 for `u64`).\n    ///\n    /// The state has 4 rows, so a row is a quarter of the word.\n    const ROW_BITS: u32 = (size_of::<Self>() as u32 * 8) / 4;\n```","locations":[{"ref":"aes/src/backends/fixslice/word.rs:28-34","code":"   28 |     /// Width in bits of one row of the bitsliced state (8 for `u32`, 16 for `u64`).\n   29 |     const ROW_BITS: u32 = (size_of::<Self>() * 2) as u32;\n   30 | \n   31 |     /// Half of `ROW_BITS`.\n   32 |     const HALF_ROW: u32 = Self::ROW_BITS / 2;\n   33 |     /// Quarter of `ROW_BITS`.\n   34 |     const QUARTER_ROW: u32 = Self::ROW_BITS / 4;","lines":7,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends/fixslice/word.rs#L28-L34"}]},
{"id":"CMT_30","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The heading `## ARMv8 intrinsics (Rust 1.61+)` is stale: `aes/Cargo.toml` declares\n`rust-version = \"1.85\"`, so the 1.61 qualifier is meaningless and only suggests the docs have not\nbeen revisited in several years.","fix":"Before:\n```rust\n//! ## ARMv8 intrinsics (Rust 1.61+)\n```\nAfter:\n```rust\n//! ## ARMv8 intrinsics\n```","locations":[{"ref":"aes/src/lib.rs:29-32","code":"   29 | //! ## ARMv8 intrinsics (Rust 1.61+)\n   30 | //! On `aarch64` targets including `aarch64-apple-darwin` (Apple M1) and Linux\n   31 | //! targets such as `aarch64-unknown-linux-gnu` and `aarch64-unknown-linux-musl`,\n   32 | //! support for using AES intrinsics provided by the ARMv8 Cryptography Extensions.","lines":4,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/lib.rs#L29-L32"}]},
{"id":"CMT_31","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The comments in `BeltBlock::encrypt_block` are misplaced relative to the code they annotate.\n`// Steps 1 and 4` sits on a plain `to_u32` byte-to-word conversion, and\n`// 6) Y ← b ‖ d ‖ a ‖ c` sits on `*block_out = from_u32(&y).into();` even though the\n`b ‖ d ‖ a ‖ c` permutation is performed inside `belt_block_raw` (`belt-block/src/lib.rs:100`,\nwhich already carries its own `// Step 6` comment). A reader following the standard's step numbers\nis sent to the wrong lines.","fix":"Drop the duplicated step annotations from `encrypt_block` and keep them only in `belt_block_raw`,\nor reword them to describe what the lines actually do, e.g.\n`// Step 1: parse X as four little-endian words` and\n`// Serialize the words already permuted by belt_block_raw (step 6)`.","locations":[{"ref":"belt-block/src/cipher_impl.rs:46-55","code":"   46 |     fn encrypt_block(&self, mut block: InOut<'_, '_, Block<Self>>) {\n   47 |         // Encryption as described in section 6.1.3\n   48 |         // Steps 1 and 4\n   49 |         let x = to_u32(block.get_in());\n   50 |         let y = belt_block_raw(x, &self.key);\n   51 | \n   52 |         let block_out = block.get_out();\n   53 |         // 6) Y ← b ‖ d ‖ a ‖ c\n   54 |         *block_out = from_u32(&y).into();\n   55 |     }","lines":10,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/belt-block/src/cipher_impl.rs#L46-L55"},{"ref":"belt-block/src/lib.rs:99-101","code":"   99 |     // Step 6\n  100 |     [b.0, d.0, a.0, c.0]\n  101 | }","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/belt-block/src/lib.rs#L99-L101"}]},
{"id":"CMT_32","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Typo in the step 5.8 comment of `belt_block_raw`: `𝑘[(7i-1]` has an unbalanced opening parenthesis\nand a missing closing bracket. Every neighbouring comment uses the form `k[7i-N]`.","fix":"Before:\n```rust\n            // 5.8) b ← b ⊕ G₂₁(a ⊞ 𝑘[(7i-1])\n```\nAfter:\n```rust\n            // 5.8) b ← b ⊕ G₂₁(a ⊞ 𝑘[7i-1])\n```","locations":[{"ref":"belt-block/src/lib.rs:87-88","code":"   87 |         // 5.8) b ← b ⊕ G₂₁(a ⊞ 𝑘[(7i-1])\n   88 |         b ^= g21(a + key_idx(key, i, 1));","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/belt-block/src/lib.rs#L87-L88"}]},
{"id":"CMT_33","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"`blowfish/src/consts.rs` has no documentation at all for `P` and `S`. I verified that all 1042\nwords are exactly the first 8336 hex digits of the fractional part of pi (as the Blowfish\nspecification requires), but nothing in the file records their provenance, so the constants cannot\nbe re-derived or re-checked by a reader. Sibling crates document theirs (`camellia/src/consts.rs`\ncites RFC 3713, `belt-block/src/consts.rs` cites STB 34.101.31).","fix":"Add doc comments recording the derivation, e.g.\n```rust\n/// Initial P-array: hex digits 1..=144 of the fractional part of pi.\npub const P: [u32; 18] = [ ... ];\n\n/// Initial S-boxes: hex digits 145..=8336 of the fractional part of pi.\npub const S: [[u32; 256]; 4] = [ ... ];\n```","locations":[{"ref":"blowfish/src/consts.rs:1-9","code":"    1 | #![allow(clippy::unreadable_literal)]\n    2 | \n    3 | pub const P: [u32; 18] = [\n    4 |     0x243f6a88, 0x85a308d3, 0x13198a2e, 0x03707344, 0xa4093822, 0x299f31d0, 0x082efa98, 0xec4e6c89,\n    5 |     0x452821e6, 0x38d01377, 0xbe5466cf, 0x34e90c6c, 0xc0ac29b7, 0xc97c50dd, 0x3f84d5b5, 0xb5470917,\n    6 |     0x9216d5d9, 0x8979fb1b,\n    7 | ];\n    8 | \n    9 | pub const S: [[u32; 256]; 4] = [","lines":9,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/blowfish/src/consts.rs#L1-L9"}]},
{"id":"CMT_34","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Doc comment typo on the `BlowfishLE` type alias: `Little Endian byte order read/writes.s.` - the\ntrailing `.s.` is leftover garbage.","fix":"Before:\n```rust\n/// Blowfish variant which uses Little Endian byte order read/writes.s.\n```\nAfter:\n```rust\n/// Blowfish variant which uses little-endian byte order for block reads/writes.\n```","locations":[{"ref":"blowfish/src/lib.rs:39-40","code":"   39 | /// Blowfish variant which uses Little Endian byte order read/writes.s.\n   40 | pub type BlowfishLE = Blowfish<LE>;","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/blowfish/src/lib.rs#L39-L40"}]},
{"id":"CMT_35","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"The `bcrypt`-gated public API of `Blowfish<BE>` is documented with content-free one-word doc\ncomments: `/// Salted expand key`, `/// Init state`, `/// Encrypt`, `/// Expand key`. They satisfy\n`#![warn(missing_docs)]` without telling a caller anything: not the `(salt, key)` argument order\n(two `&[u8]` parameters that are trivial to swap), not that these are raw bcrypt internals that\nbypass the length validation done by `new_from_slice`, not that they panic on empty input, and not\nthat `bc_encrypt` operates on a raw `[u32; 2]` in big-endian word order.","fix":"Write real docs for `salted_expand_key`, `bc_init_state`, `bc_encrypt` and `bc_expand_key`:\ndescribe the parameter order and units, state that they implement the bcrypt `EksBlowfishSetup`\nprimitive and are not a general-purpose API, and add a `# Panics` section for the empty-slice\nbehaviour of `next_u32_wrap`.","locations":[{"ref":"blowfish/src/lib.rs:223-227","code":"  223 | /// Bcrypt extension of blowfish\n  224 | #[cfg(feature = \"bcrypt\")]\n  225 | impl Blowfish<BE> {\n  226 |     /// Salted expand key\n  227 |     pub fn salted_expand_key(&mut self, salt: &[u8], key: &[u8]) {","lines":5,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/blowfish/src/lib.rs#L223-L227"},{"ref":"blowfish/src/lib.rs:261-275","code":"  261 |     /// Init state\n  262 |     pub fn bc_init_state() -> Blowfish<BE> {\n  263 |         Blowfish::init_state()\n  264 |     }\n  265 | \n  266 |     /// Encrypt\n  267 |     pub fn bc_encrypt(&self, lr: [u32; 2]) -> [u32; 2] {\n  268 |         self.encrypt(lr)\n  269 |     }\n  270 | \n  271 |     /// Expand key\n  272 |     pub fn bc_expand_key(&mut self, key: &[u8]) {\n  273 |         self.expand_key(key)\n  274 |     }\n  275 | }","lines":15,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/blowfish/src/lib.rs#L261-L275"}]},
{"id":"CMT_36","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"None of the three constant-table files in this slice cites the specification it was transcribed from,\nwhich is the one comment that matters most for tables nobody can eyeball. `cast5/src/consts.rs` and\n`cast6/src/consts.rs` open with nothing but `#![allow(clippy::unreadable_literal)]` - no mention of\nRFC 2144 Appendix A / RFC 2612, and no note that `S1..S4` drive the round function while `S5..S8`\ndrive only the CAST5 key schedule. `des/src/consts.rs` has no reference to FIPS 46-3 and its `SHIFTS`\ntable (the per-round PC-1 rotation schedule) has no comment at all. Every table itself is correct - I\nverified all four CAST tables are 256 entries with no duplicated values or rows, `TM`/`TR` match the\nRFC 2612 recurrences exactly, and `SHIFTS` matches the DES key schedule - but a future reviewer has\nnothing to check them against.","fix":"Add a one-line provenance comment to each table, e.g.:\n\n```rust\n// cast5/src/consts.rs\n//! CAST5 S-boxes, transcribed from RFC 2144 Appendix A.\n//! `S1..S4` are used by the round function; `S5..S8` only by the key schedule.\n\n// des/src/consts.rs\n/// Per-round left-rotation amounts for the DES key schedule (FIPS 46-3, PC-1 stage).\npub const SHIFTS: [u8; 16] = [1, 1, 2, 2, 2, 2, 2, 2, 1, 2, 2, 2, 2, 2, 2, 1];\n```","locations":[{"ref":"cast5/src/consts.rs:1-3","code":"    1 | #![allow(clippy::unreadable_literal)]\n    2 | \n    3 | pub const S1: [u32; 256] = [","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/cast5/src/consts.rs#L1-L3"},{"ref":"cast6/src/consts.rs:1-3","code":"    1 | #![allow(clippy::unreadable_literal)]\n    2 | \n    3 | pub const S1: [u32; 256] = [","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/cast6/src/consts.rs#L1-L3"},{"ref":"des/src/consts.rs:1","code":"    1 | pub const SHIFTS: [u8; 16] = [1, 1, 2, 2, 2, 2, 2, 2, 1, 2, 2, 2, 2, 2, 2, 1];","lines":1,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/des/src/consts.rs#L1"}]},
{"id":"CMT_37","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Both CAST key-schedule doc comments put a bare URL on its own `///` line. `rustdoc::bare_urls` (warn\nby default) flags this pattern and `clippy::doc_markdown` reports it for\n`cast6/src/lib.rs:67`; rustdoc will not render it as a link. The second line is also not attached to\nthe first as a proper Markdown reference.","fix":"Before:\n\n```rust\n/// Implements the key schedule according to RFC 2612 2.4.\n/// https://tools.ietf.org/html/rfc2612#section-2.4\n```\n\nAfter:\n\n```rust\n/// Implements the key schedule according to [RFC 2612 section 2.4].\n///\n/// [RFC 2612 section 2.4]: https://tools.ietf.org/html/rfc2612#section-2.4\n```\n\nSame for `cast5/src/lib.rs` with `rfc2144#section-2.4`.","locations":[{"ref":"cast5/src/lib.rs:81-82","code":"   81 |     /// Implements the key schedule according to RFC 2144 2.4.\n   82 |     /// https://tools.ietf.org/html/rfc2144#section-2.4","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/cast5/src/lib.rs#L81-L82"},{"ref":"cast6/src/lib.rs:66-67","code":"   66 |     /// Implements the key schedule according to RFC 2612 2.4.\n   67 |     /// https://tools.ietf.org/html/rfc2612#section-2.4","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/cast6/src/lib.rs#L66-L67"}]},
{"id":"CMT_38","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"The comment in `fused_enc_table` claims \"Unfortunately, we can not use the `l_step` function directly because of const eval limitations.\" That reason is wrong: `l_step` *is* a `const fn` and is already evaluated at compile time by `utils::KEYGEN`. The actual obstacle is the chosen representation - the table is a flat `[u8; 16 * 4096]`, and const eval cannot slice it into a `[u8; 16]` (no `try_into`/`copy_from_slice` in const context). A reader who believes the comment will conclude that a whole class of refactors is impossible when only a type change is needed.","fix":"Reword to name the real constraint, e.g. \"the table is stored flat, and const eval cannot copy a 16-byte window out of it (`try_into`/`copy_from_slice` are not const), so the rotation is open-coded here; see `l_step` for the reference implementation\" - or change `Table` to `Align16<[[u8; 16]; 4096]>` (identical memory layout) and call `l_step` directly.","locations":[{"ref":"kuznyechik/src/fused_tables.rs:40-43","code":"   40 |                 // Strictly speaking, we don't need to move these bytes around because\n   41 |                 // we do 16 iterations. See the `l_step` function for the reference.\n   42 |                 // Unfortunately, we can not use the `l_step` function directly because\n   43 |                 // of const eval limitations.","lines":4,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/fused_tables.rs#L40-L43"},{"ref":"kuznyechik/src/fused_tables.rs:92-93","code":"   92 |                 // See comment in the `fused_enc_table` function.\n   93 |                 let mut k = 0;","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/fused_tables.rs#L92-L93"}]},
{"id":"CMT_39","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Both section comments in `threefish/src/consts.rs` say the tables vary with the *key length*\n(\"Rotation constants for the different key lengths\", \"Permutation tables for the different key lengths\").\nThe word permutation `P256`/`P512`/`P1024` is determined by the number of state words, i.e. the *block* size,\nand the rotation tables are additionally indexed by `round mod 8` (`$rot[d % 8][j]`), which the comment does\nnot mention at all. Threefish happens to use key size == block size, so the statement is not wrong by\naccident, but it points a reader at the wrong invariant.","fix":"Before:\n```rust\n// Rotation constants for the different key lengths\n...\n// Permutation tables for the different key lengths\n```\nAfter:\n```rust\n// Rotation constants per block size, indexed as `[round % 8][word pair]`\n...\n// Word permutations per block size, stored as the inverse permutation: `new[P[j]] = f[j]`\n```","locations":[{"ref":"threefish/src/consts.rs:6-7","code":"    6 | // Rotation constants for the different key lengths\n    7 | pub const R256: [[u8; 2]; 8] = [","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/threefish/src/consts.rs#L6-L7"},{"ref":"threefish/src/consts.rs:40-43","code":"   40 | // Permutation tables for the different key lengths\n   41 | pub const P256: [u8; 4] = [0, 3, 2, 1];\n   42 | pub const P512: [u8; 8] = [6, 1, 0, 7, 2, 5, 4, 3];\n   43 | pub const P1024: [u8; 16] = [0, 15, 2, 11, 6, 13, 4, 9, 14, 1, 8, 5, 10, 3, 12, 7];","lines":4,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/threefish/src/consts.rs#L40-L43"}]},
{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"medium","difficulty":"hard","description":"`aes128.rs`, `aes192.rs` and `aes256.rs` each contain an `encrypt` and a `decrypt` function that are\nnear-identical: same `bitslice` / `add_round_key` prologue, same\n`sub_bytes` + `mix_columns_{1,2,3,0}` + `add_round_key` loop body with the same `#[cfg]`-gated\ncompact/full variants, same epilogue. They differ only in the round-key array length, the `rk_off`\nvalue tested by the `break`, and which phase of the 4-round mix-columns cycle the loop happens to\nexit on (AES-192 exits after `mix_columns_3` so it needs no final `shift_rows_2`, AES-128/AES-256\nexit after `mix_columns_1` so they do). That is roughly 6 x 45 = 270 lines of copy-paste in the\nsecurity-critical core, and the differences are subtle enough that an inconsistent edit to one file\nwould be very hard to spot in review - the classic failure mode for this crate's three-variant\nlayout.","fix":"Factor the round loop into one shared generic implementation parameterised by the number of rounds,\ne.g. `fn encrypt_rounds<W: Word, const ROUNDS: usize>(rkeys: &[W], blocks: &BatchBlocks<W>)`\nin a new `fixslice/rounds.rs`, and reduce `aes128::encrypt` / `aes192::encrypt` /\n`aes256::encrypt` to thin wrappers that pass `10`, `12` and `14`. The final `shift_rows_2` fixup\nthen becomes `if ROUNDS % 4 != 0 { shift_rows_2(&mut state) }`, which also documents the invariant\nthat is currently implicit in the three hand-written variants.","locations":[{"ref":"aes/src/backends/fixslice/aes128.rs:67-108","code":"   67 |     let mut rk_off = 8;\n   68 |     loop {\n   69 |         sub_bytes(&mut state);\n   70 |         mix_columns_1(&mut state);\n   71 |         add_round_key(&mut state, &rkeys[rk_off..(rk_off + 8)]);\n   72 |         rk_off += 8;\n   73 | \n   74 |         #[cfg(aes_backend_soft = \"compact\")]\n   75 |         {\n   76 |             shift_rows_2(&mut state);\n   77 |         }\n   78 | \n   79 |         if rk_off == 80 {\n   80 |             break;\n   81 |         }\n   82 | \n   83 |         #[cfg(not(aes_backend_soft = \"compact\"))]\n   84 |         {\n   85 |             sub_bytes(&mut state);\n   86 |             mix_columns_2(&mut state);\n   87 |             add_round_key(&mut state, &rkeys[rk_off..(rk_off + 8)]);\n   88 |             rk_off += 8;\n   89 | \n   90 |             sub_bytes(&mut state);\n   91 |             mix_columns_3(&mut state);\n   92 |             add_round_key(&mut state, &rkeys[rk_off..(rk_off + 8)]);\n   93 |             rk_off += 8;\n   94 |         }\n   95 | \n   96 |         sub_bytes(&mut state);\n   97 |         mix_columns_0(&mut state);\n   98 |         add_round_key(&mut state, &rkeys[rk_off..(rk_off + 8)]);\n   99 |         rk_off += 8;\n  100 |     }\n  101 | \n  102 |     #[cfg(not(aes_backend_soft = \"compact\"))]\n  103 |     {\n  104 |         shift_rows_2(&mut state);\n  105 |     }\n  106 | \n  107 |     sub_bytes(&mut state);\n  108 |     add_round_key(&mut state, &rkeys[80..]);","lines":42,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends/fixslice/aes128.rs#L67-L108"},{"ref":"aes/src/backends/fixslice/aes192.rs:115-150","code":"  115 |     let mut rk_off = 8;\n  116 |     loop {\n  117 |         sub_bytes(&mut state);\n  118 |         mix_columns_1(&mut state);\n  119 |         add_round_key(&mut state, &rkeys[rk_off..(rk_off + 8)]);\n  120 |         rk_off += 8;\n  121 | \n  122 |         #[cfg(aes_backend_soft = \"compact\")]\n  123 |         {\n  124 |             shift_rows_2(&mut state);\n  125 |         }\n  126 |         #[cfg(not(aes_backend_soft = \"compact\"))]\n  127 |         {\n  128 |             sub_bytes(&mut state);\n  129 |             mix_columns_2(&mut state);\n  130 |             add_round_key(&mut state, &rkeys[rk_off..(rk_off + 8)]);\n  131 |             rk_off += 8;\n  132 | \n  133 |             sub_b {"id":"DUP_2","type":"duplicate_code","type_label":"Duplicate Code","severity":"medium","difficulty":"medium","description":"`aria/src/aria128.rs`, `aria/src/aria192.rs` and `aria/src/aria256.rs` are three near-identical\nfiles (69/74/77 lines). The `ek` literal array (13/15/17 entries) and the `dk` literal array are\nwritten out longhand in each, repeating the same four rotation patterns\n(`rotate_right(19)`, `rotate_right(31)`, `rotate_left(61)`, `rotate_left(31)`), and the `dk` arrays\nare three hand-unrolled copies of the identical rule `dk[0] = ek[n]`, `dk[i] = a(ek[n - i])`,\n`dk[n] = ek[0]`. The `Debug` and `AlgorithmName` impls are duplicated a third time as well. Since\nthe only real differences between the three variants are the key split (`KL`/`KR`) and the\n`CK1, CK2, CK3` permutation, ~45 of the ~50 meaningful lines in each file are copies. Hand-unrolled\nconstant tables replicated three times are exactly where an off-by-one in a key-schedule index\nsurvives review.","fix":"Add one generic helper in `aria/src/utils.rs` (or a new `aria/src/expand.rs`) and reduce the three\nfiles to a few lines each:\n```rust\npub(crate) fn expand<const RK: usize>(kl: u128, kr: u128, ck: [u128; 3]) -> ([u128; RK], [u128; RK]) {\n    let w = {\n        let w0 = kl;\n        let w1 = fo(w0 ^ ck[0]) ^ kr;\n        let w2 = fe(w1 ^ ck[1]) ^ w0;\n        let w3 = fo(w2 ^ ck[2]) ^ w1;\n        [w0, w1, w2, w3]\n    };\n    // rotations for ek[4*j + i], j = 0..4\n    const ROT: [u32; 4] = [19, 31, 67, 97]; // right-rotations; 67 == rotate_left(61), 97 == rotate_left(31)\n    let ek = core::array::from_fn::<u128, RK, _>(|i| {\n        let (j, k) = (i / 4, i % 4);\n        w[k] ^ w[(k + 1) % 4].rotate_right(ROT[j % 4])\n    });\n    let dk = core::array::from_fn::<u128, RK, _>(|i| match i {\n        0 => ek[RK - 1],\n        i if i == RK - 1 => ek[0],\n        i => a(ek[RK - 1 - i]),\n    });\n    (ek, dk)\n}\n```\nand share `Debug`/`AlgorithmName` via a small macro. Keep the existing RFC 5794 test vectors as the\nregression guard for the refactor.","locations":[{"ref":"aria/src/aria128.rs:13-69","code":"   13 | impl KeyInit for Aria128 {\n   14 |     fn new(key: &Key<Self>) -> Self {\n   15 |         let kl = u128::from_be_bytes(key[0..16].try_into().unwrap());\n   16 |         let kr = u128::default();\n   17 | \n   18 |         let w0 = kl;\n   19 |         let w1 = fo(w0 ^ C1) ^ kr;\n   20 |         let w2 = fe(w1 ^ C2) ^ w0;\n   21 |         let w3 = fo(w2 ^ C3) ^ w1;\n   22 | \n   23 |         let ek = [\n   24 |             w0 ^ w1.rotate_right(19),\n   25 |             w1 ^ w2.rotate_right(19),\n   26 |             w2 ^ w3.rotate_right(19),\n   27 |             w3 ^ w0.rotate_right(19),\n   28 |             w0 ^ w1.rotate_right(31),\n   29 |             w1 ^ w2.rotate_right(31),\n   30 |             w2 ^ w3.rotate_right(31),\n   31 |             w3 ^ w0.rotate_right(31),\n   32 |             w0 ^ w1.rotate_left(61),\n   33 |             w1 ^ w2.rotate_left(61),\n   34 |             w2 ^ w3.rotate_left(61),\n   35 |             w3 ^ w0.rotate_left(61),\n   36 |             w0 ^ w1.rotate_left(31),\n   37 |         ];\n   38 | \n   39 |         let dk = [\n   40 |             ek[12],\n   41 |             a(ek[11]),\n   42 |             a(ek[10]),\n   43 |             a(ek[9]),\n   44 |             a(ek[8]),\n   45 |             a(ek[7]),\n   46 |             a(ek[6]),\n   47 |             a(ek[5]),\n   48 |             a(ek[4]),\n   49 |             a(ek[3]),\n   50 |             a(ek[2]),\n   51 |             a(ek[1]),\n   52 |             ek[0],\n   53 |         ];\n   54 | \n   55 |         Self { ek, dk }\n   56 |     }\n   57 | }\n   58 | \n   59 | impl fmt::Debug for Aria128 {\n   60 |     fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {\n   61 |         f.write_str(\"Aria128 { ... }\")\n   62 |     }\n   63 | }\n   64 | \n   65 | impl AlgorithmName for Aria128 {\n   66 |     fn write_alg_name(f: &mut fmt::Formatter<'_>) -> fmt::Result {\n   67 |         f.write_str(\"Aria128\")\n   68 |     }\n   69 | }","lines":57,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aria/src/aria128.rs#L13-L69"},{"ref":"aria/src/aria192.rs:13-74","code":"   13 | impl KeyInit for Aria192 {\n   14 |     fn new(key: &Key<Self>) -> Self {\n   15 |         let kl = u128::from_be_bytes(key[0..16].try_into().unwrap());\n   16 |         let kr = u64::from_be_bytes(key[16..24].try_into().unwrap());\n   17 |         let kr = (kr as u128) << 64;\n   18 | \n   19 |         let w0 = kl;\n   20 |         let w1 = fo(w0 ^ C2) ^ kr;\n   21 |         let w2 = fe(w1 ^ C3) ^ w0;\n   22 |         let w3 = fo(w2 ^ C1) ^ w1;\n   23 | \n   24 |         let ek = [\n   25 |             w0 ^ w1.rotate_right(19),\n   26 |             w1 ^ w2.rotate_right(19),\n   27 |             w2 ^ w3.rotate_right(19),\n   28 |             w3 ^ w0.rotate_right(19),\n   29 |             w0 ^ w1.rotate_right(31),\n   30 |             w1 ^ w2.rotate_right(31),\n   31 |             w2 ^ w3.rotate_right(31),\n   32 |             w3 ^ w0.rotate_right(31),\n   33 |             w0 ^ w1.rotate_left(61),\n   34 |             w1 ^ w2.rotate_left(61),\n   35 |             w2 ^ w3.rotate_left(61),\n   36 |             w3 ^ w0.rotate_left(61),\n   37 |             w0 ^ w1.rotate_left(31),\n   38 |             w1 ^ w2.rotate_left(31),\n   39 |             w2 ^ w3.rotate_left(31),\n   40 |         ];\n   41 | \n   42 |         let dk = [\n   43 |             ek[14],\n   44 |             a(ek[13]),\n   45 |             a(ek[12]),\n   46 |             a(ek[11]),\n   47 |             a(ek[10]),\n   48 |             a(ek[9]),\n   49 |             a(ek[8]),\n   50 |             a(ek[7]),\n   51 |             a(ek[6]),\n   52 |             a(ek[5]),\n   53 |             a(ek[4]),\n   54 |             a(ek[3]),\n   55 |             a(ek[2]),\n   56 |             a(ek[1]),\n   57 |             ek[0],\n   58 | {"id":"DUP_3","type":"duplicate_code","type_label":"Duplicate Code","severity":"medium","difficulty":"medium","description":"`cast5/src/schedule.rs` contains two pairs of byte-for-byte identical blocks, roughly 48 duplicated\nlines in a 190-line file:\n\n- The `z[0..=3]` derivation at lines 11-34 is character-for-character identical to lines 101-124.\n- The `x[0..=3]` derivation at lines 56-79 is character-for-character identical to lines 146-169.\n\nOn top of that the `k[..]` groups reuse only two index patterns: `k[0..=3]` (over `z`) and\n`k[12..=15]` (over `x`) share one pattern, and `k[4..=7]` (over `x`) and `k[8..=11]` (over `z`) share\nthe other. This is the highest-risk kind of duplication in a cryptographic key schedule: a\ntranscription fix or S-box-index correction applied to one copy and not its twin silently corrupts\nhalf the subkeys, and because CAST5 test vectors exercise all 32 generated words it would fail in a\nway that gives no hint which copy is wrong.","fix":"Extract the two repeated halves into named helpers and call each twice, so the RFC 2144 formulas\nexist exactly once:\n\n```rust\n/// RFC 2144 2.4: `z0z1z2z3 z4z5z6z7 z8z9zAzB zCzDzEzF` from the current `x`.\n#[inline]\nfn x_to_z(x: &[u32; 4], z: &mut [u32; 4]) {\n    z[0] = x[0] ^ S5[get_i!(x, 13)] ^ S6[get_i!(x, 15)] ^ S7[get_i!(x, 12)]\n                ^ S8[get_i!(x, 14)] ^ S7[get_i!(x, 8)];\n    // ... z[1], z[2], z[3] exactly as today\n}\n\n/// RFC 2144 2.4: `x0x1x2x3 x4x5x6x7 x8x9xAxB xCxDxExF` from the current `z`.\n#[inline]\nfn z_to_x(z: &[u32; 4], x: &mut [u32; 4]) { /* ... */ }\n```\n\nthen `key_schedule` becomes `x_to_z(...); k[0..4] = ...; z_to_x(...); k[4..8] = ...; x_to_z(...);\nk[8..12] = ...; z_to_x(...); k[12..16] = ...;`. The two `k` patterns can likewise be factored into\ntwo small helpers parameterised by the source array.","locations":[{"ref":"cast5/src/schedule.rs:11-34","code":"   11 |     z[0] = x[0]\n   12 |         ^ S5[get_i!(x, 13)]\n   13 |         ^ S6[get_i!( {"id":"DUP_7","type":"duplicate_code","type_label":"Duplicate Code","severity":"medium","difficulty":"medium","description":"`rc5/src/primitives.rs` and `rc6/src/core/primitives.rs` are near-identical copies of the\nsame word abstraction: the same `Block`/`Key`/`ExpandedKeyTable`/`KeyAsWords` type-alias\nfamily, the same `Word` trait surface, and the same `impl Word for u8/u16/u32/u64` blocks\nwith the same magic `P`/`Q` constants (`0xb7e1...`/`0x9e37...`). `diff` reports only 103\ndiffering lines across 285 + 246 lines, i.e. roughly 200 lines are byte-identical. The\nonly real differences are `BlockSize` (`* U2` vs `* U4`), `ExpandedKeyTableSize`\n(`(R+1)*2` vs `(R+2)*2`), the extra `wrapping_mul` RC6 needs, RC6's missing `u128` impl,\nand RC5's `private::Sealed`. Duplicating the cipher's magic constants and the\nrotation-masking logic in two crates means any future fix (for example the rotation\ninconsistency reported separately) has to be made twice and can silently diverge.","fix":"Extract the shared abstraction into one internal crate (e.g. `rc-word` or an\n`rc5-6-common` crate in the workspace) exporting a single sealed `Word` trait with\n`Bytes`, `ZERO`/`THREE`/`EIGHT`, `P`/`Q`, the wrapping ops, the rotations and the\n`from_le_bytes`/`to_le_bytes` helpers, plus a `LG_W` associated const. Keep only the\ncipher-specific aliases (`BlockSize`, `ExpandedKeyTableSize`) in each crate and have both\n`rc5` and `rc6` depend on the shared crate.","locations":[{"ref":"rc5/src/primitives.rs:1-56","code":"    1 | use core::ops::{Add, BitXor, Mul};\n    2 | \n    3 | use cipher::{\n    4 |     array::{Array, ArraySize},\n    5 |     typenum::{Diff, Prod, Quot, Sum, U1, U2, U4, U8, U16},\n    6 | };\n    7 | \n    8 | pub type BlockSize<W> = Prod<<W as Word>::Bytes, U2>;\n    9 | pub type Block<W> = Array<u8, BlockSize<W>>;\n   10 | \n   11 | pub type Key<B> = Array<u8, B>;\n   12 | \n   13 | pub type ExpandedKeyTable<W, R> = Array<W, ExpandedKeyTableSize<R>>;\n   14 | pub {"id":"DUP_13","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"`expand.rs` writes the AES key-schedule \"cumulative XOR of left-shifted words\" chain\n```rust\nt4 = _mm_slli_si128(t1, 0x4);\nt1 = _mm_xor_si128(t1, t4);\nt4 = _mm_slli_si128(t4, 0x4);\nt1 = _mm_xor_si128(t1, t4);\nt4 = _mm_slli_si128(t4, 0x4);\nt1 = _mm_xor_si128(t1, t4);\n```\nout by hand five times (once in `aes128_expand_key`, once in `aes192_expand_key`, twice in `aes256_expand_key`'s\n`expand_round`, once in `expand_round_last`). On top of that, `aes256_expand_key::expand_round_last` is a\ncopy of the first 13 lines of `aes256_expand_key::expand_round`, existing only because `expand_round` writes\n`keys[pos + 1]` which would be out of bounds for `pos == 14`. The three key sizes also use three different helper\nconventions - `aes128` and `aes256` mutate `&mut RoundKeys<..>` by index, `aes192` returns `(__m128i, __m128i)` -\nwhich makes them much harder to compare against each other than they need to be.","fix":"Extract the chain into one file-level helper and reuse it everywhere:\n```rust\n#[inline(always)]\n#[target_feature(enable = \"sse2\")]\nunsafe fn xor_shift_chain(mut t: __m128i) -> __m128i {\n    let mut s = _mm_slli_si128(t, 0x4);\n    t = _mm_xor_si128(t, s);\n    s = _mm_slli_si128(s, 0x4);\n    t = _mm_xor_si128(t, s);\n    s = _mm_slli_si128(s, 0x4);\n    _mm_xor_si128(t, s)\n}\n```\nThen make `aes256_expand_key`'s `expand_round` value-returning like the `aes192` one (`-> (__m128i, __m128i)`) and\nlet the caller decide whether to store the second word; that deletes `expand_round_last` entirely and unifies the\nthree helper conventions.","locations":[{"ref":"aes/src/backends/x86_aes/expand.rs:19-25","code":"   19 |         t3 = _mm_slli_si128(t1, 0x4);\n   20 |         t1 = _mm_xor_si128(t1, t3);\n   21 |         t3 = _mm_slli_si128(t3, 0x4);\n   22 |         t1 = _mm_xor_si128(t1, t3);\n   23 |         t3 = _mm_slli_si128(t3, {"id":"DUP_16","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"`expand_key` and `salted_expand_key` duplicate the whole Blowfish key schedule: the identical\n18-iteration `self.p[i] ^= next_u32_wrap(key, &mut key_pos)` loop, the identical `P`-array\nregeneration loop, and structurally identical `S`-box regeneration loops (`0..128` writing 2 words\nvs `0..64` writing 4 words). That is ~20 duplicated lines plus ~18 near-duplicated ones across the\nplain and `bcrypt` paths, so a change to one schedule can silently diverge from the other - and the\n`bcrypt` path is only compiled under a non-default feature, so CI on default features will not\ncatch the divergence.","fix":"Implement a single private `fn expand_key_inner(&mut self, salt: Option<&[u8]>, key: &[u8])` that\nXORs the (optional) salt into `lr` before each `self.encrypt(lr)` call - with `salt = None` it\ndegenerates exactly into the current `expand_key` - and make both `expand_key` and\n`salted_expand_key` thin wrappers over it.","locations":[{"ref":"blowfish/src/lib.rs:71-89","code":"   71 |     fn expand_key(&mut self, key: &[u8]) {\n   72 |         let mut key_pos = 0;\n   73 |         for i in 0..18 {\n   74 |             self.p[i] ^= next_u32_wrap(key, &mut key_pos);\n   75 |         }\n   76 |         let mut lr = [0u32; 2];\n   77 |         for i in 0..9 {\n   78 |             lr = self.encrypt(lr);\n   79 |             self.p[2 * i] = lr[0];\n   80 |             self.p[2 * i + 1] = lr[1];\n   81 |         }\n   82 |         for i in 0..4 {\n   83 |             for j in 0..128 {\n   84 |                 lr = self.encrypt(lr);\n   85 |                 self.s[i][2 * j] = lr[0];\n   86 |                 self.s[i][2 * j + 1] = lr[1];\n   87 |             }\n   88 |         }\n   89 |     }","lines":19,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/blowfish/src/lib.rs#L71-L89"},{"ref":"blowfish/src/l {"id":"DUP_19","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"hard","description":"`cast5` and `cast6` carry independent verbatim copies of the shared CAST S-box and round-function\nmachinery, about 170 duplicated lines total:\n\n- `cast5/src/consts.rs:3-142` (`S1`, `S2`, `S3`, `S4`) is byte-for-byte identical to\n  `cast6/src/consts.rs:3-141`. I diffed all 1024 values programmatically: zero differences.\n- The `f1!`, `f2!` and `f3!` macros in `cast5/src/lib.rs:105-131` are character-for-character\n  identical to `cast6/src/lib.rs:93-119`.\n\nRFC 2612 explicitly reuses the CAST-128 S-boxes and round functions, so this is genuinely one\nartifact stored twice. Any correction (a transcribed constant, a `wrapping_*` fix, a bounds-check or\nconstant-time tweak) has to be applied in two crates, and there is no test that the two copies agree.","fix":"Introduce a small internal crate (e.g. `cast-common`) exporting `S1..S4` and the three round\nfunctions as `#[inline(always)]` functions rather than macros, and have both `cast5` and `cast6`\ndepend on it:\n\n```rust\n// cast-common/src/lib.rs\n#[inline(always)]\npub fn f1(d: u32, m: u32, r: u8) -> u32 {\n    let i = m.wrapping_add(d).rotate_left(u32::from(r));\n    (S1[(i >> 24) as usize] ^ S2[((i >> 16) & 0xff) as usize])\n        .wrapping_sub(S3[((i >> 8) & 0xff) as usize])\n        .wrapping_add(S4[(i & 0xff) as usize])\n}\n```\n\n`cast5` keeps its own `S5..S8` (only the key schedule needs them). If a new crate is unacceptable for\nrelease-cadence reasons, at minimum add a test in one crate that asserts its tables equal the other's\nso the copies cannot silently diverge.","locations":[{"ref":"cast5/src/consts.rs:3-141","code":"    3 | pub const S1: [u32; 256] = [\n    4 |     0x30fb40d4, 0x9fa0ff0b, 0x6beccd2f, 0x3f258c7a, 0x1e213f2f, 0x9c004dd3, 0x6003e540, 0xcf9fc949,\n    5 |     0xbfd4af27, 0x88bbbdb5, 0xe2034090, 0x98d09675, 0x6e63a0e0, 0x15c361d2, 0xc2e7661d, 0x22d4ff8e,\n    6 {"id":"DUP_20","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"hard","description":"The key schedule is implemented four times. `big_soft::expand_enc_keys`, `sse2::expand_enc_keys` and `neon::expand_enc_keys` are line-for-line the same 30-line algorithm (same `for i in 1..5` / `for _ in 0..4` structure, same `cidx` counter, same `enc_keys[2 * i]` assignments) with only the vector type and the XOR/transform primitives substituted, and `inv_enc_keys` is likewise triplicated verbatim (9 lines each, including the non-obvious `sub_bytes(.., &P)` pre-step). `compact_soft::f` / `compact_soft::expand` is a fourth transcription. A bug fixed in one copy - or a change to the round count, the constant indices `8 * n + 2 * i`, or the `9 - i` reversal - has to be replicated in three other files, and only the aggregate GOST test vector would catch a mistake.","fix":"Factor the schedule into one generic routine parameterised over a tiny backend trait, e.g.\n```rust\ntrait Ops: Copy {\n    fn load(bytes: &[u8; 16]) -> Self;\n    fn xor(self, rhs: Self) -> Self;\n    fn transform_enc(self) -> Self;\n    fn transform_dec(self) -> Self;\n    fn sub_bytes(self, sbox: &[u8; 256]) -> Self;\n}\n\nfn expand_enc_keys<T: Ops>(key: &Key) -> [T; 10] { /* single copy of the schedule */ }\nfn inv_enc_keys<T: Ops>(enc: &[T; 10]) -> [T; 10] { /* single copy */ }\n```\nEach backend then only provides the ~5 primitive methods, which is where the platform differences actually are.","locations":[{"ref":"kuznyechik/src/big_soft/backends.rs:42-88","code":"   42 | pub(super) fn expand_enc_keys(key: &Key) -> RoundKeys {\n   43 |     #[inline(always)]\n   44 |     fn next_const(i: usize) -> u128 {\n   45 |         u128::from_le_bytes(KEYGEN[i].0)\n   46 |     }\n   47 | \n   48 |     let mut enc_keys = [0; 10];\n   49 | \n   50 |     let mut k1 = u128::from_le_bytes(key[..16].try_into().unwrap());\n   51 |     let mut k2 = u128::from_le_bytes(key[16..].try_into().unwrap());\n   52 | \n   53 |     enc_keys[0] = k1;\n   54 |     enc_keys[1] = k2;\n   55 | \n   56 |     let mut cidx = 0;\n   57 |     for i in 1..5 {\n   58 |         for _ in 0..4 {\n   59 |             let mut t = k1 ^ next_const(cidx);\n   60 |             cidx += 1;\n   61 |             t = transform(t, &ENC_TABLE);\n   62 |             k2 ^= t;\n   63 | \n   64 |             let mut t = k2 ^ next_const(cidx);\n   65 |             cidx += 1;\n   66 |             t = transform(t, &ENC_TABLE);\n   67 |             k1 ^= t;\n   68 |         }\n   69 | \n   70 |         enc_keys[2 * i] = k1;\n   71 |         enc_keys[2 * i + 1] = k2;\n   72 |     }\n   73 | \n   74 |     enc_keys\n   75 | }\n   76 | \n   77 | pub(super) fn inv_enc_keys(enc_keys: &RoundKeys) -> RoundKeys {\n   78 |     let mut dec_keys = [0; 10];\n   79 | \n   80 |     dec_keys[0] = enc_keys[9];\n   81 |     for i in 1..9 {\n   82 |         let k = sub_bytes(enc_keys[i], &P);\n   83 |         dec_keys[9 - i] = transform(k, &DEC_TABLE);\n   84 |     }\n   85 |     dec_keys[9] = enc_keys[0];\n   86 | \n   87 |     dec_keys\n   88 | }","lines":47,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/big_soft/backends.rs#L42-L88"},{"ref":"kuznyechik/src/neon/backends.rs:133-188","code":"  133 | pub fn expand_enc_keys(key: &Key) -> RoundKeys {\n  134 |     macro_rules! next_const {\n  135 |         ($i:expr) => {{\n  136 |             let p = KEYGEN.as_ptr() as *const uint8x16_t;\n  137 |             // correct alignment of `p` is guaranteed since the table\n  138 |             // is aligned to 16 bytes\n  139 |             let p = p.add($i);\n  140 |             debug_assert_eq!(p as usize % 16, 0);\n  141 |             $i += 1;\n  142 |             vld1q_u8(p as *const u8)\n  143 |         }};\n  144 |     }\n  145 | \n  146 |     unsafe {\n  147 |         let mut enc_keys = [vdupq_n_u8(0); 10];\n  148 | \n  149 |         let pk: *const uint8x16_t = {"id":"DUP_30","type":"duplicate_code","type_label":"Duplicate Code","severity":"negligible","difficulty":"easy","description":"`consts.rs` contains two tests that verify the same property. `P_INV` is *constructed* by `t[P[i] as usize] = i as u8`, so `test_p_inv`'s assertion `P_INV[P[i] as usize] == i as u8` can only fail if `P` is not injective - which is exactly what `test_p_bijectivity` checks. Neither test validates the 256 entries of `P` against the published GOST R 34.12-2015 table, i.e. the one failure mode (a transcription typo that keeps `P` a permutation) that a dedicated S-box test could catch cheaply is not covered by either of them.","fix":"Drop `test_p_inv` (it is implied by `test_p_bijectivity`) and replace it with a check of a few independently sourced values from the standard, e.g.\n```rust\n#[test]\nfn test_p_reference_values() {\n    // GOST R 34.12-2015, section 4.1.1\n    assert_eq!(P[0], 0xFC);\n    assert_eq!(P[0xFF], 0xB6);\n    assert_eq!(P_INV[0xFC], 0x00);\n}\n```","locations":[{"ref":"kuznyechik/src/consts.rs:36-51","code":"   36 |     #[test]\n   37 |     fn test_p_inv() {\n   38 |         for i in 0..256 {\n   39 |             assert_eq!(P_INV[P[i] as usize], i as u8);\n   40 |         }\n   41 |     }\n   42 | \n   43 |     #[test]\n   44 |     fn test_p_bijectivity() {\n   45 |         let mut flags = [true; 256];\n   46 |         for i in 0..256 {\n   47 |             let old_flag = core::mem::take(&mut flags[P[i] as usize]);\n   48 |             assert!(old_flag);\n   49 |         }\n   50 |         assert_eq!(flags, [false; 256]);\n   51 |     }","lines":16,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/consts.rs#L36-L51"}]},
{"id":"DUP_31","type":"duplicate_code","type_label":"Duplicate Code","severity":"negligible","difficulty":"very_easy","description":"`Default` is listed twice in the supertrait list of RC5's `Word` trait. Harmless, but it\nis exactly the kind of copy-paste residue that hides a *missing* bound next to it.","fix":"Before:\n\n```rust\n    Self: Default + Copy + From<u8> + Add<Output = Self> + Default + private::Sealed,\n```\n\nAfter:\n\n```rust\n    Self: Default + Copy + From<u8> + Add<Output = Self> + private::Sealed,\n```","locations":[{"ref":"rc5/src/primitives.rs:19-23","code":"   19 | pub trait Word\n   20 | where\n   21 |     Self: Default + Copy + From<u8> + Add<Output = Self> + Default + private::Sealed,\n   22 |     BlockSize<Self>: ArraySize,\n   23 | {","lines":5,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc5/src/primitives.rs#L19-L23"}]},
{"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"medium","difficulty":"easy","description":"Every TDES `KeyInit::new` reaches into `Des`'s `pub(crate)` field and rebuilds the sub-cipher by hand (`Des { keys: gen_keys(k1) }`), duplicating the body of `Des`'s own `KeyInit::new` (`gen_keys(u64::from_be_bytes(key.0))`) four times. `Des::new` is thereby bypassed for every 3DES instantiation, so any logic added to it - key masking, a weak-key rejection, a debug assertion, telemetry - would silently not apply to `TdesEde3`/`TdesEee3`/`TdesEde2`/`TdesEee2`. It also forces `Des::keys` to stay `pub(crate)`, widening the surface over the most sensitive state in the crate.","fix":"Construct the sub-ciphers through the public constructor and make `Des::keys` private:\n\n```rust\nimpl KeyInit for TdesEde3 {\n    #[inline]\n    fn new(key: &Key<Self>) -> Self {\n        let (k1, rest) = key.split_ref::<U8>();\n        let (k2, k3) = rest.split_ref::<U8>();\n        Self { d1: Des::new(k1), d2: Des::new(k2), d3: Des::new(k3) }\n    }\n}\n```\n\n(or, minimally, `Des::new(key[..8].try_into().unwrap())`), then change `pub(crate) keys` to `keys` in\n`des/src/des.rs` and drop the `gen_keys` import from `tdes.rs`.","locations":[{"ref":"des/src/tdes.rs:27-38","code":"   27 | impl KeyInit for TdesEde3 {\n   28 |     #[inline]\n   29 |     fn new(key: &Key<Self>) -> Self {\n   30 |         let k1 = u64::from_be_bytes(key[0..8].try_into().unwrap());\n   31 |         let k2 = u64::from_be_bytes(key[8..16].try_into().unwrap());\n   32 |         let k3 = u64::from_be_bytes(key[16..24].try_into().unwrap());\n   33 |         let d1 = Des { keys: gen_keys(k1) };\n   34 |         let d2 = Des { keys: gen_keys(k2) };\n   35 |         let d3 = Des { keys: gen_keys(k3) };\n   36 |         Self { d1, d2, d3 }\n   37 |     }\n   38 | }","lines":12,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/des/src/tdes.rs#L27-L38"},{"ref":"des/src/tdes.rs:111-122","code":"  111 | impl KeyInit for TdesEee3 {\n  112 |     #[inline]\n  113 |     fn new(key: &Key<Self>) -> Self {\n  114 |         let k1 = u64::from_be_bytes(key[0..8].try_into().unwrap());\n  115 |         let k2 = u64::from_be_bytes(key[8..16].try_into().unwrap());\n  116 |         let k3 = u64::from_be_bytes(key[16..24].try_into().unwrap());\n  117 |         let d1 = Des { keys: gen_keys(k1) };\n  118 |         let d2 = Des { keys: gen_keys(k2) };\n  119 |         let d3 = Des { keys: gen_keys(k3) };\n  120 |         Self { d1, d2, d3 }\n  121 |     }\n  122 | }","lines":12,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/des/src/tdes.rs#L111-L122"},{"ref":"des/src/tdes.rs:194-203","code":"  194 | impl KeyInit for TdesEde2 {\n  195 |     #[inline]\n  196 |     fn new(key: &Key<Self>) -> Self {\n  197 |         let k1 = u64::from_be_bytes(key[0..8].try_into().unwrap());\n  198 |         let k2 = u64::from_be_bytes(key[8..16].try_into().unwrap());\n  199 |         let d1 = Des { keys: gen_keys(k1) };\n  200 |         let d2 = Des { keys: gen_keys(k2) };\n  201 |         Self { d1, d2 }\n  202 |     }\n  203 | }","lines":10,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/des/src/tdes.rs#L194-L203"},{"ref":"des/src/tdes.rs:275-283","code":"  275 | impl KeyInit for TdesEee2 {\n  276 |     #[inline]\n  277 |     fn new(key: &Key<Self>) -> Self {\n  278 |         let k1 = u64::from_be_bytes(key[0..8].try_into().unwrap());\n  279 |         let k2 = u64::from_be_bytes(key[8..16].try_into().unwrap());\n  280 |         let d1 = Des { keys: gen_keys(k1) };\n  281 |         let d2 = Des { keys: gen_keys(k2) };\n  282 |         Self { d1, d2 }\n  283 |     }","lines":9,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/des/src/tdes.rs#L275-L283"},{"ref":"des/src/des.rs:20-22","code":"   20 | pub struct Des {"id":"ARCH_2","type":"architecture","type_label":"Architecture","severity":"medium","difficulty":"hard","description":"The backend layering is inverted: `lib.rs` defines the public types `Kuznyechik`, `KuznyechikEnc` and `KuznyechikDec` but *none* of their cipher trait impls, while each of the four private backend modules (`big_soft`, `compact_soft`, `sse2`, `neon`) declares its own `EncKeys` / `DecKeys` / `EncDecKeys` structs, its own `From` conversions, and its own copies of `impl BlockCipherEncrypt for crate::Kuznyechik`, `impl BlockCipherDecrypt for crate::Kuznyechik`, `impl BlockCipherEncrypt for crate::KuznyechikEnc` and `impl BlockCipherDecrypt for crate::KuznyechikDec`. Consequences: (1) the same ~25 lines of trait boilerplate exist in four files and must be kept in sync - `neon`/`sse2` already drifted from `big_soft`/`compact_soft` (`f.call(&..)` vs `f.call(&mut ..)`); (2) the `DecKeys` type means different things per backend (inverted round keys in `big_soft`/`sse2`/`neon`, a plain copy of the *encryption* keys in `compact_soft`), so `lib.rs` cannot be read without opening every backend; (3) nothing in `lib.rs` tells a reader where the trait impls come from, and adding a fifth backend requires copying the boilerplate again; (4) `mod fused_tables;` is repeated in three of the four `cfg_if` branches.","fix":"Keep the four `BlockCipher*` impls in `lib.rs` and let each backend expose only data plus backend constructors, e.g. a small private trait implemented once per backend:\n```rust\n// in each backend\nimpl EncDecKeys {\n    pub(crate) fn enc_backend(&self) -> EncBackend<'_> { EncBackend(&self.enc) }\n    pub(crate) fn dec_backend(&self) -> DecBackend<'_> { DecBackend(&self.dec) }\n}\n\n// once, in lib.rs\nimpl BlockCipherEncrypt for Kuznyechik {\n    #[inline]\n    fn encrypt_with_backend(&self, f: impl BlockCipherEncClosure<BlockSize = BlockSize>) {\n        f.call(&self.keys.enc_backend());\n    }\n}\n```\nAlso hoist `mod fused_tables;` out of the `cfg_if` into a single `#[cfg(not(kuznyechik_backend = \"compact_soft\"))] mod fused_tables;`.","locations":[{"ref":"kuznyechik/src/lib.rs:49-76","code":"   49 | cfg_if::cfg_if!(\n   50 |     if #[cfg(all(\n   51 |         any(target_arch = \"x86_64\", target_arch = \"x86\"),\n   52 |         target_feature = \"sse2\",\n   53 |         not(any(kuznyechik_backend = \"soft\", kuznyechik_backend = \"compact_soft\")),\n   54 |     ))] {\n   55 |         mod fused_tables;\n   56 |         mod sse2;\n   57 |         use sse2 as imp;\n   58 |     } else if #[cfg(all(\n   59 |         target_arch = \"aarch64\",\n   60 |         target_feature = \"neon\",\n   61 |         not(any(kuznyechik_backend = \"soft\", kuznyechik_backend = \"compact_soft\")),\n   62 |     ))] {\n   63 |         mod fused_tables;\n   64 |         mod neon;\n   65 |         use neon as imp;\n   66 |     } else if #[cfg(kuznyechik_backend = \"compact_soft\")] {\n   67 |         mod compact_soft;\n   68 |         use compact_soft as imp;\n   69 |     } else {\n   70 |         mod fused_tables;\n   71 |         mod big_soft;\n   72 |         use big_soft as imp;\n   73 |     }\n   74 | );\n   75 | \n   76 | use imp::{DecKeys, EncDecKeys, EncKeys};","lines":28,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/lib.rs#L49-L76"},{"ref":"kuznyechik/src/neon/mod.rs:10-63","code":"   10 | #[derive(Clone)]\n   11 | pub(crate) struct EncDecKeys {\n   12 |     enc: RoundKeys,\n   13 |     dec: RoundKeys,\n   14 | }\n   15 | #[derive(Clone)]\n   16 | pub(crate) struct EncKeys(RoundKeys);\n   17 | #[derive(Clone)]\n   18 | pub(crate) struct DecKeys(RoundKeys);\n   19 | \n   20 | impl EncKeys {\n   21 |     pub fn new(key: &Key) -> Self {\n   22 |         Self(expand_enc_keys(key))\n   23 |     }\n   24 | }\n   25 | \n   26 | impl From<EncKeys> for EncDecKeys {\n   27 |     fn from(enc: EncKeys) -> Self {\n   28 |         Self {\n   29 |             dec: inv_enc_keys(&enc.0),\n   30 |             enc: enc.0,\n   31 |         }\n   32 |     }\n   33 | }\n   34 | \n   35 | impl From<EncKeys> for DecKeys {\n   36 |     fn from(enc: EncKeys) -> Self {\n   37 |         Self(inv_enc_keys(&enc.0))\n   38 |     }\n   39 | }\n   40 | \n   41 | impl BlockCipherEncrypt for crate::Kuznyechik {\n   42 |     fn encrypt_with_backend(&self, f: impl BlockCipherEncClosure<BlockSize = BlockSize>) {\n   43 |         f.call(&EncBackend(&self.keys.enc));\n   44 |     }\n   45 | }\n   46 | \n   47 | impl BlockCipherDecrypt for crate::Kuznyechik {\n   48 |     fn decrypt_with_backend(&self, f: impl BlockCipherDecClosure<BlockSize = BlockSize>) {\n   49 |         f.call(&DecBackend(&self.keys.dec));\n   50 |     }\n   51 | }\n   52 | \n   53 | impl BlockCipherEncrypt for crate::KuznyechikEnc {\n   54 |     fn encrypt_with_backend(&self, f: impl BlockCipherEncClosure<BlockSize = BlockSize>) {\n   55 |         f.call(&EncBackend(&self.keys.0));\n   56 |     }\n   57 | }\n   58 | \n   59 | impl BlockCipherDecrypt for crate::KuznyechikDec {\n   60 |     fn decrypt_with_backend(&self, f: impl BlockCipherDecClosure<BlockSize = BlockSize>) {\n   61 |         f.call(&DecBackend(&self.keys.0));\n   62 |     }\n   63 | }","lines":54,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/neon/mod.rs#L10-L63"}]},
{"id":"ARCH_3","type":"architecture","type_label":"Architecture","severity":"medium","difficulty":"medium","description":"`rc6/src/block_cipher.rs` is 338 lines of which roughly 250 are the *same* 20-line\n`where` clause copy-pasted ten times (`KeyInit`, `KeySizeUser`, `BlockSizeUser`,\n`BlockCipherEncrypt`, the `RC6EncryptBackend` struct plus its three impls, and the same\nagain for the decrypt side, plus `AlgorithmName`). On top of that,\n`RC6EncryptBackend`/`RC6DecryptBackend` are structurally identical - same single\n`enc_dec: &'a RC6<W, R, B>` field, same `BlockSizeUser`, same\n`ParBlocksSizeUser = U1` - so lines 111-193 and 224-306 differ only in the type name and\nin `encrypt_block` vs `decrypt_block`. `rc5` avoids the wrapper structs entirely by\nimplementing `BlockCipherEncBackend`/`BlockCipherDecBackend` directly on `RC5`, showing\nthe wrappers buy nothing. The field name `enc_dec` is meaningless in a type that only\nencrypts, and `let backend = self.enc_dec;` names the *cipher* `backend`, inverting the\ncrate's own terminology. Part of the bound repetition is also self-inflicted: `rc6`'s\n`Word` declares `type Bytes: ArraySize` only, so `W::Bytes: Mul<U4>` must be restated in\nevery clause, whereas `rc5` folds it into the trait (`type Bytes: ArraySize + Mul<U2>`).","fix":"1. Move the block-size bound into the trait: `type Bytes: ArraySize + Mul<U4>;` in\n   `rc6/src/core/primitives.rs`, then delete the `W::Bytes: Mul<U4>,` line from all\n   `where` clauses.\n2. Collapse the repeated bound block into a single sealed helper trait with a blanket\n   impl, e.g.\n\n```rust\npub trait Rc6Params: Sealed {}          // in core/primitives.rs\nimpl<W, R, B> Rc6Params for (W, R, B) where /* the 20-line clause, once */ {}\n```\n\n   or a `macro_rules!` that emits the clause, so each impl reads\n   `where (W, R, B): Rc6Params`.\n3. Implement `BlockCipherEncBackend`/`BlockCipherDecBackend` directly on `RC6` as `rc5`\n   does and delete `RC6EncryptBackend`/`RC6DecryptBackend`; if the wrappers are kept,\n   rename the field to `cipher` and the local to `cipher`.\n4. Move `RC6_8_12_4`..`RC6_64_24_24` out of `block_cipher.rs` (trait impls) into\n   `lib.rs` where the public API lives.","locations":[{"ref":"rc6/src/block_cipher.rs:111-193","code":"  111 | struct RC6EncryptBackend<'a, W, R, B>\n  112 | where\n  113 |     W: Word,\n  114 |     // Block size\n  115 |     W::Bytes: Mul<U4>,\n  116 |     BlockSize<W>: ArraySize,\n  117 |     // Rounds range\n  118 |     R: Unsigned,\n  119 |     R: IsLess<U256>,\n  120 |     Le<R, U256>: NonZero,\n  121 |     // ExpandedKeyTableSize\n  122 |     R: Add<U2>,\n  123 |     Sum<R, U2>: Mul<U2>,\n  124 |     ExpandedKeyTableSize<R>: ArraySize,\n  125 | {\n  126 |     enc_dec: &'a RC6<W, R, B>,\n  127 | }\n  128 | impl<W, R, B> BlockSizeUser for RC6EncryptBackend<'_, W, R, B>\n  129 | where\n  130 |     W: Word,\n  131 |     // Block size\n  132 |     W::Bytes: Mul<U4>,\n  133 |     BlockSize<W>: ArraySize,\n  134 |     // Rounds range\n  135 |     R: Unsigned,\n  136 |     R: IsLess<U256>,\n  137 |     Le<R, U256>: NonZero,\n  138 |     // ExpandedKeyTableSize\n  139 |     R: Add<U2>,\n  140 |     Sum<R, U2>: Mul<U2>,\n  141 |     ExpandedKeyTableSize<R>: ArraySize,\n  142 | {\n  143 |     type BlockSize = BlockSize<W>;\n  144 | }\n  145 | \n  146 | impl<W, R, B> ParBlocksSizeUser for RC6EncryptBackend<'_, W, R, B>\n  147 | where\n  148 |     W: Word,\n  149 |     // Block size\n  150 |     W::Bytes: Mul<U4>,\n  151 |     BlockSize<W>: ArraySize,\n  152 |     // Rounds range\n  153 |     R: Unsigned,\n  154 |     R: IsLess<U256>,\n  155 |     Le<R, U256>: NonZero,\n  156 |     // ExpandedKeyTableSize\n  157 |     R: Add<U2>,\n  158 |     Sum<R, U2>: Mul<U2>,\n  159 |     ExpandedKeyTableSize<R>: ArraySize,\n  160 | {\n  161 |     type ParBlocksSize = U1;\n  162 | }\n  163 | \n  164 | impl<W, R, B> BlockCipherEncBackend for RC6EncryptBackend<'_, W, R, B>\n  165 | where\n  166 |     W: Word,\n  1
