s":[{"ref":"rc6/src/lib.rs:1-7","code":"    1 | #![no_std]\n    2 | \n    3 | mod block_cipher;\n    4 | mod core;\n    5 | \n    6 | pub use crate::core::RC6;\n    7 | pub use block_cipher::*;","lines":7,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc6/src/lib.rs#L1-L7"},{"ref":"rc6/src/core/primitives.rs:19-20","code":"   19 | pub trait Word: Default + Copy + From<u8> + Add<Output = Self> + DefaultIsZeroes {\n   20 |     type Bytes: ArraySize;","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc6/src/core/primitives.rs#L19-L20"},{"ref":"rc6/src/core/backend.rs:199-201","code":"  199 |     fn words_from_block(block: &Block<W>) -> (W, W, W, W) {\n  200 |         // Block size is 4 * word::BYTES so the unwrap is safe\n  201 |         let a = W::from_le_bytes(block[..W::Bytes::USIZE].try_into().unwrap());","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc6/src/core/backend.rs#L199-L201"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`impl KeyInit for Threefish*` silently constructs the cipher with an all-zero tweak\n(`Self::new_with_tweak(&tmp_key, &Default::default())`), and nothing in the public documentation says so. Any\nuser who reaches `Threefish*` through the generic `cipher` traits (`KeyInit::new`, `new_from_slice`, block\nmodes, `cipher::dev` harnesses) therefore gets the untweaked cipher without any indication that the defining\nfeature of Threefish has been disabled. The `cipher` 0.5 dependency already ships a full tweakable\nblock-cipher trait family (`cipher::TweakSizeUser`, `cipher::TweakBlockCipherEncrypt`,\n`cipher::TweakBlockCipherDecrypt`) plus a `cipher::tweak::ZeroTweak` adapter that exists precisely to make the\nzero-tweak case explicit, and none of it is implemented here.","fix":"At minimum, document the behaviour on the `KeyInit` impl, e.g.\n`/// Creates an instance with an all-zero tweak. Use `new_with_tweak` to supply a tweak.`\nBetter, expose the tweak through the generic API: implement `TweakSizeUser` with `type TweakSize = U16` plus\n`TweakBlockCipherEncrypt`/`TweakBlockCipherDecrypt` (re-deriving the subkey schedule per tweak), and either\ndrop the plain `KeyInit` impl or wire it up via `cipher::tweak::ZeroTweak` so the zero tweak is explicit in\nthe type.","locations":[{"ref":"threefish/src/lib.rs:167-174","code":"  167 |         #[cfg(feature = \"cipher\")]\n  168 |         impl KeyInit for $name {\n  169 |             fn new(key: &Key<Self>) -> Self {\n  170 |                 let mut tmp_key = [0u8; $n_w*8];\n  171 |                 tmp_key.copy_from_slice(key);\n  172 |                 Self::new_with_tweak(&tmp_key, &Default::default())\n  173 |             }\n  174 |         }","lines":8,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/threefish/src/lib.rs#L167-L174"},{"ref":"threefish/src/lib.rs:66-79","code":"   66 |         impl $name {\n   67 |             /// Create new block cipher instance with the given key and tweak.\n   68 |             #[inline(always)]\n   69 |             pub fn new_with_tweak(key: &[u8; $n_w*8], tweak: &[u8; 16]) -> $name {\n   70 |                 let mut k = [0u64; $n_w];\n   71 |                 for (kv, chunk) in k[..$n_w].iter_mut().zip(key.chunks_exact(8)) {\n   72 |                     *kv = u64::from_le_bytes(chunk.try_into().unwrap());\n   73 |                 }\n   74 |                 let tweak = [\n   75 |                     u64::from_le_bytes(tweak[..8].try_into().unwrap()),\n   76 |                     u64::from_le_bytes(tweak[8..].try_into().unwrap()),\n   77 |                 ];\n   78 |                 Self::new_with_tweak_u64(&k, &tweak)\n   79 |             }","lines":14,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/threefish/src/lib.rs#L66-L79"}]},
{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"The fixsliced state has a statically known size - `mod.rs` even defines `type State<W> = [W; 8]` - yet almost every\nroutine takes an unsized `&[W]` / `&mut [W]` and \"checks\" the length with a `debug_assert_eq!(..., 8)` that is\ncompiled out in release. This has three concrete consequences:\n1. `add_round_key` iterates with `state.iter_mut().zip(rkey)`, so a short `rkey` slice in a release build silently\n   XORs only a prefix and produces a wrong ciphertext instead of failing.\n2. `sub_bytes` / `inv_sub_bytes` / `shift_rows_*` / `add_round_constant_bit` index `state[0]..state[7]` on a slice\n   of unknown length, so every one of them carries a bounds-check/panic path that the type system could remove.\n3. `Word::bitslice` / `Word::inv_bitslice` have the same unchecked `output.len() == 8` / `input.len() == 8`\n   contract, and it is documented nowhere in the trait declaration.\nSince `sub_bytes::<u64>` is emitted out of line (verified in a release build), the runtime length really is passed\nand the checks really are executed.","fix":"Change the shared signatures to fixed-size arrays and drop the `debug_assert`s, e.g.\n```rust\npub(super) fn sub_bytes<W: Word>(state: &mut State<W>) { ... }\npub(super) fn add_round_key<W: Word>(state: &mut State<W>, rkey: &State<W>) { ... }\nfn bitslice(output: &mut State<Self>, input: &Array<Block, Self::Blocks>);\nfn inv_bitslice(input: &State<Self>) -> Array<Block, Self::Blocks>;\n```\nCall sites that currently pass sub-slices of `rkeys` can use\n`(&mut rkeys[rk_off..rk_off + 8]).try_into().unwrap()` or, better, `rkeys.as_chunks_mut::<8>()` / an explicit\n`&mut rkeys[rk_off..][..8].try_into().unwrap()` so the length assertion happens once instead of on every helper\ncall.","locations":[{"ref":"aes/src/backends/fixslice/sbox.rs:10-11","code":"   10 | pub(super) fn sub_bytes<W: Word>(state: &mut [W]) {\n   11 |     debug_assert_eq!(state.len(), 8);","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends/fixslice/sbox.rs#L10-L11"},{"ref":"aes/src/backends/fixslice/sbox.rs:183-184","code":"  183 | pub(super) fn inv_sub_bytes<W: Word>(state: &mut [W]) {\n  184 |     debug_assert_eq!(state.len(), 8);","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends/fixslice/sbox.rs#L183-L184"},{"ref":"aes/src/backends/fixslice/utils.rs:108-119","code":"  108 | #[inline]\n  109 | pub(super) fn add_round_key<W: Word>(state: &mut State<W>, rkey: &[W]) {\n  110 |     debug_assert_eq!(rkey.len(), 8);\n  111 |     for (a, b) in state.iter_mut().zip(rkey) {\n  112 |         *a ^= *b;\n  113 |     }\n  114 | }\n  115 | \n  116 | #[inline(always)]\n  117 | pub(super) fn add_round_constant_bit<W: Word>(state: &mut [W], bit: usize) {\n  118 |     state[bit] ^= W::pack_rows(0x00, 0xc0, 0x00, 0x00);\n  119 | }","lines":12,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends/fixslice/utils.rs#L108-L119"},{"ref":"aes/src/backends/fixslice/word.rs:54-58","code":"   54 |     /// Pack `Self::Blocks` input blocks into a bitsliced 8-row state slice.\n   55 |     fn bitslice(output: &mut [Self], input: &Array<Block, Self::Blocks>);\n   56 | \n   57 |     /// Unpack a bitsliced 8-row state slice into `Self::Blocks` output blocks.\n   58 |     fn inv_bitslice(input: &[Self]) -> Array<Block, Self::Blocks>;","lines":5,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends/fixslice/word.rs#L54-L58"}]},
{"id":"API_5","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"`BeltBlock` implements `AlgorithmName` but not `core::fmt::Debug`, while every other cipher in\nthis slice (`Aria128/192/256`, `Blowfish<BE>`, `Blowfish<LE>`, `Camellia128/192/256`) provides a\nredacted `Debug` impl next to its `AlgorithmName` impl. As a result `BeltBlock` cannot be embedded\nin any user struct that uses `#[derive(Debug)]`, and generic code with a `Debug` bound cannot be\ninstantiated with it.","fix":"Add the same redacted impl the sibling crates use:\n```rust\nimpl fmt::Debug for BeltBlock {\n    fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {\n        f.write_str(\"BeltBlock { ... }\")\n    }\n}\n```","locations":[{"ref":"belt-block/src/cipher_impl.rs:13-17","code":"   13 | /// BelT block cipher.\n   14 | #[derive(Clone)]\n   15 | pub struct BeltBlock {\n   16 |     key: [u32; 8],\n   17 | }","lines":5,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/belt-block/src/cipher_impl.rs#L13-L17"},{"ref":"belt-block/src/cipher_impl.rs:111-115","code":"  111 | impl AlgorithmName for BeltBlock {\n  112 |     fn write_alg_name(f: &mut fmt::Formatter<'_>) -> fmt::Result {\n  113 |         f.write_str(\"BeltBlock\")\n  114 |     }\n  115 | }","lines":5,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/belt-block/src/cipher_impl.rs#L111-L115"}]},
{"id":"API_6","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`Blowfish` declares `type KeySize = U56` but overrides `new_from_slice` to accept any length in\n`4..=56`, which deviates from the `KeyInit` contract that the default `new_from_slice` enforces\n(`key.len() == Self::key_size()` or `InvalidLength`). Consequences: `KeySizeUser::key_size()`\nreports `56` for a cipher that in practice takes variable-length keys, so generic code driven by\n`key_size()` can only ever build 56-byte-key instances; `KeyInit::new` reaches the variable-length\npath and `unwrap()`s a `Result` that is infallible only because `Key<Self>` happens to be 56 bytes;\nand none of this - neither the 4-byte minimum, nor the 56-byte maximum, nor the fact that\n`new_from_slice` is the variable-length entry point - is documented on the type or in the crate\ndocs.","fix":"Document the deviation on the `Blowfish` type: state that Blowfish accepts 4..=56 byte keys, that\n`KeySize`/`key_size()` reports only the maximum, and that `new_from_slice` must be used for shorter\nkeys. Replace `Self::new_from_slice(&key[..]).unwrap()` with\n`.expect(\"Key<Self> always has a valid Blowfish key length\")` so the invariant is stated at the\ncall site.","locations":[{"ref":"blowfish/src/lib.rs:42-48","code":"   42 | /// Blowfish block cipher instance.\n   43 | #[derive(Clone)]\n   44 | pub struct Blowfish<T: ByteOrder = BE> {\n   45 |     s: [[u32; 256]; 4],\n   46 |     p: [u32; 18],\n   47 |     _pd: PhantomData<T>,\n   48 | }","lines":7,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/blowfish/src/lib.rs#L42-L48"},{"ref":"blowfish/src/lib.rs:125-142","code":"  125 | impl<T: ByteOrder> KeySizeUser for Blowfish<T> {\n  126 |     type KeySize = U56;\n  127 | }\n  128 | \n  129 | impl<T: ByteOrder> KeyInit for Blowfish<T> {\n  130 |     fn new(key: &Key<Self>) -> Self {\n  131 |         Self::new_from_slice(&key[..]).unwrap()\n  132 |     }\n  133 | \n  134 |     fn new_from_slice(key: &[u8]) -> Result<Self, InvalidLength> {\n  135 |         if key.len() < 4 || key.len() > 56 {\n  136 |             return Err(InvalidLength);\n  137 |         }\n  138 |         let mut blowfish = Blowfish::init_state();\n  139 |         blowfish.expand_key(key);\n  140 |         Ok(blowfish)\n  141 |     }\n  142 | }","lines":18,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/blowfish/src/lib.rs#L125-L142"}]},
{"id":"API_7","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`key_schedule` takes `x: &mut [u32], z: &mut [u32], k: &mut [u32]` - unbounded slices - even though\nit unconditionally requires exactly 4, 4 and 16 elements and performs roughly 200 indexing\noperations against them (`get_i!(x, 15)` expands to `x[3]`, `k[15]`, ...). Passing a shorter slice\ncompiles fine and panics at runtime, and the function is `pub` in a private module so nothing\ndocuments the requirement. Encoding the lengths in the types removes an entire class of latent panic\nand lets the compiler discharge every bounds check even when the function is not inlined into\n`Cast5::key_schedule`.","fix":"Before:\n\n```rust\npub fn key_schedule(x: &mut [u32], z: &mut [u32], k: &mut [u32]) {\n```\n\nAfter:\n\n```rust\npub(crate) fn key_schedule(x: &mut [u32; 4], z: &mut [u32; 4], k: &mut [u32; 16]) {\n```\n\nThe existing call sites in `cast5/src/lib.rs` already pass `&mut x`, `&mut z`, `&mut k` where those\nare `[u32; 4]`, `[u32; 4]` and `[u32; 16]`, so they compile unchanged.","locations":[{"ref":"cast5/src/schedule.rs:9-16","code":"    9 | #[inline]\n   10 | pub fn key_schedule(x: &mut [u32], z: &mut [u32], k: &mut [u32]) {\n   11 |     z[0] = x[0]\n   12 |         ^ S5[get_i!(x, 13)]\n   13 |         ^ S6[get_i!(x, 15)]\n   14 |         ^ S7[get_i!(x, 12)]\n   15 |         ^ S8[get_i!(x, 14)]\n   16 |         ^ S7[get_i!(x, 8)];","lines":8,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/cast5/src/schedule.rs#L9-L16"},{"ref":"cast5/src/lib.rs:91-101","code":"   91 |         let mut z = [0u32; 4];\n   92 |         let mut k = [0u32; 16];\n   93 | \n   94 |         key_schedule(&mut x, &mut z, &mut k);\n   95 |         self.masking[..].clone_from_slice(&k[..]);\n   96 | \n   97 |         key_schedule(&mut x, &mut z, &mut k);\n   98 | \n   99 |         for (i, ki) in k.iter().enumerate() {\n  100 |             self.rotate[i] = (ki & 0x1f) as u8;\n  101 |         }","lines":11,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/cast5/src/lib.rs#L91-L101"}]},
{"id":"API_8","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`cast6::forward_octave` takes `m: &[u32], r: &[u8]` - unbounded slices - while its siblings\n`forward_quad` and `reverse_quad` correctly take `&[u32; 4]` and `&[u8; 4]`. It then indexes\n`m[0]..m[7]` and `r[0]..r[7]` unconditionally, so a short slice compiles and panics at runtime, and\nall sixteen accesses carry bounds checks the compiler cannot discharge from the signature. The call\nsites work around the missing type by double-slicing (`&TM[m_idx..][..8]`), which is both awkward and\nitself a panicking expression.","fix":"Give `forward_octave` the same fixed-size signature as its siblings and use `split_at`-style chunking\nat the call site:\n\n```rust\n#[inline]\nfn forward_octave(kappa: &mut [u32; 8], m: &[u32; 8], r: &[u8; 8]) {\n```\n\nand in `key_schedule`:\n\n```rust\nlet m: &[[u32; 8]; 24] = TM.as_chunks().0.try_into().unwrap(); // or const-split TM once\nlet r: &[[u8; 8]; 4] = TR.as_chunks().0.try_into().unwrap();\nforward_octave(&mut kappa, &m[2 * i], &r[(2 * i) % 4]);\nforward_octave(&mut kappa, &m[2 * i + 1], &r[(2 * i + 1) % 4]);\n```\n\nIf `as_chunks` is not available on the MSRV, restructure `TM`/`TR` in `cast6/src/consts.rs` as\n`pub const TM: [[u32; 8]; 24]` and `pub const TR: [[u8; 8]; 4]`, which removes the arithmetic\nentirely.","locations":[{"ref":"cast6/src/lib.rs:152-153","code":"  152 | #[inline]\n  153 | fn forward_octave(kappa: &mut [u32; 8], m: &[u32], r: &[u8]) {","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/cast6/src/lib.rs#L152-L153"},{"ref":"cast6/src/lib.rs:70-80","code":"   70 |         for i in 0..12 {\n   71 |             let m_idx = 16 * i;\n   72 |             let r_idx = 16 * (i % 2);\n   73 | \n   74 |             let m = &TM[m_idx..][..8];\n   75 |             let r = &TR[r_idx..][..8];\n   76 |             forward_octave(&mut kappa, m, r);\n   77 | \n   78 |             let m = &TM[m_idx + 8..][..8];\n   79 |             let r = &TR[r_idx + 8..][..8];\n   80 |             forward_octave(&mut kappa, m, r);","lines":11,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/cast6/src/lib.rs#L70-L80"}]},
{"id":"API_9","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`weak_key_test` takes an untyped `&[u8]` and turns a wrong length into a panic (`assert!(matches!(key.len(), 8 | 16 | 24), ..)`) even though it already returns a `Result`. A crypto helper that is meant to be called as a validation gate on caller-supplied key material is the last place a length mistake should abort the process; in `no_std`/embedded contexts a panic may be unrecoverable. Because the parameter is a bare slice rather than `&Key<Des>` / `&Key<TdesEde3>`, the compiler cannot prevent the mistake either.","fix":"Either add a length variant to the error type and return it instead of panicking, or - better - make the\nfunction generic over the cipher so the length is checked at compile time:\n\n```rust\npub fn weak_key_test<C: KeySizeUser>(key: &Key<C>) -> Result<(), WeakKeyError> { .. }\n```\n\nkeeping the current `&[u8]` entry point as a `weak_key_test_slice` that returns\n`Err(WeakKeyError::InvalidLength)` rather than asserting.","locations":[{"ref":"des/src/weak_key.rs:9-14","code":"    9 | #[inline]\n   10 | pub fn weak_key_test(key: &[u8]) -> Result<(), WeakKeyError> {\n   11 |     assert!(\n   12 |         matches!(key.len(), 8 | 16 | 24),\n   13 |         \"key size is not equal to 8, 16, or 24 bytes\"\n   14 |     );","lines":6,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/des/src/weak_key.rs#L9-L14"}]},
{"id":"API_10","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"The NEON backend is internally inconsistent about how it handles `unsafe`: `sub_bytes` and `transform` are declared `unsafe fn` even though they have no safety preconditions at all (the whole module is only compiled when `target_feature = \"neon\"` is statically enabled, and both take safe `&[u8; 256]` / `&Table` arguments), and neither has a `# Safety` section. Meanwhile `expand_enc_keys` and `inv_enc_keys` in the same file are *safe* functions that wrap their bodies in `unsafe { .. }`. To make the `unsafe fn` bodies compile without per-operation `unsafe` blocks the file needs a blanket `#![allow(unsafe_op_in_unsafe_fn)]`, which switches off the lint for the whole module including the pointer arithmetic in `get!`, `next_const!` and the `into_raw()`-based block loads/stores - the places where an audit actually wants unsafe operations to be marked.","fix":"Make the two helpers safe functions with internal `unsafe` blocks (mirroring `expand_enc_keys`), then delete the module-level `#![allow(unsafe_op_in_unsafe_fn)]` so the remaining raw-pointer work must be wrapped explicitly:\n```rust\n#[inline(always)]\nfn sub_bytes(block: uint8x16_t, sbox: &[u8; 256]) -> uint8x16_t {\n    // SAFETY: the module is only compiled with `target_feature = \"neon\"` and all loads stay\n    // inside `sbox`.\n    unsafe { ... }\n}\n```","locations":[{"ref":"kuznyechik/src/neon/backends.rs:1","code":"    1 | #![allow(unsafe_op_in_unsafe_fn)]","lines":1,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/neon/backends.rs#L1"},{"ref":"kuznyechik/src/neon/backends.rs:35-36","code":"   35 | #[inline(always)]\n   36 | unsafe fn sub_bytes(block: uint8x16_t, sbox: &[u8; 256]) -> uint8x16_t {","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/neon/backends.rs#L35-L36"},{"ref":"kuznyechik/src/neon/backends.rs:82-83","code":"   82 | #[inline(always)]\n   83 | unsafe fn transform(block: uint8x16_t, table: &Table) -> uint8x16_t {","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/neon/backends.rs#L82-L83"}]},
{"id":"API_11","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`neon::sub_bytes` builds its four `uint8x16x4_t` table registers with sixteen calls of the form `vld1q_u8(&sbox[16] as *const u8)`. Each of these takes a reference to a *single* `u8` element and then reads 16 bytes through it. Under Rust's aliasing model (Stacked/Tree Borrows, i.e. what Miri checks) the pointer derived from `&sbox[16]` is only valid for a one-byte access, so all sixteen loads are out-of-bounds accesses for their provenance even though the bytes are inside the 256-byte array. It also duplicates the same expression sixteen times.","fix":"Derive the pointers from the whole array and use the four-register load intrinsic, which is both sound and one instruction per group:\n```rust\nlet p = sbox.as_ptr();\nlet sbox_part1 = vld1q_u8_x4(p);\nlet sbox_part2 = vld1q_u8_x4(p.add(64));\nlet sbox_part3 = vld1q_u8_x4(p.add(128));\nlet sbox_part4 = vld1q_u8_x4(p.add(192));\n```\n(If `vld1q_u8_x4` is undesirable, at least replace every `&sbox[N] as *const u8` with `sbox.as_ptr().add(N)`.)","locations":[{"ref":"kuznyechik/src/neon/backends.rs:36-66","code":"   36 | unsafe fn sub_bytes(block: uint8x16_t, sbox: &[u8; 256]) -> uint8x16_t {\n   37 |     let value_vector = vdupq_n_u8(64);\n   38 | \n   39 |     //Split the sbox table into four parts\n   40 |     let sbox_part1 = uint8x16x4_t(\n   41 |         vld1q_u8(&sbox[0] as *const u8),\n   42 |         vld1q_u8(&sbox[16] as *const u8),\n   43 |         vld1q_u8(&sbox[32] as *const u8),\n   44 |         vld1q_u8(&sbox[48] as *const u8),\n   45 |     );\n   46 | \n   47 |     let sbox_part2 = uint8x16x4_t(\n   48 |         vld1q_u8(&sbox[64] as *const u8),\n   49 |         vld1q_u8(&sbox[80] as *const u8),\n   50 |         vld1q_u8(&sbox[96] as *const u8),\n   51 |         vld1q_u8(&sbox[112] as *const u8),\n   52 |     );\n   53 | \n   54 |     let sbox_part3 = uint8x16x4_t(\n   55 |         vld1q_u8(&sbox[128] as *const u8),\n   56 |         vld1q_u8(&sbox[144] as *const u8),\n   57 |         vld1q_u8(&sbox[160] as *const u8),\n   58 |         vld1q_u8(&sbox[176] as *const u8),\n   59 |     );\n   60 | \n   61 |     let sbox_part4 = uint8x16x4_t(\n   62 |         vld1q_u8(&sbox[192] as *const u8),\n   63 |         vld1q_u8(&sbox[208] as *const u8),\n   64 |         vld1q_u8(&sbox[224] as *const u8),\n   65 |         vld1q_u8(&sbox[240] as *const u8),\n   66 |     );","lines":31,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/neon/backends.rs#L36-L66"}]},
{"id":"API_12","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"`rc5` does not re-export its `cipher` dependency, unlike every other cipher crate in this workspace\n(`aes`, `aria`, `belt-block`, `blowfish`, `camellia`, `cast5`, `cast6`, `des`, `gift-cipher`, `idea`,\n`kuznyechik`, `magma`, `rc2`, `serpent`, `sm4`, `speck-cipher`, `threefish`, `twofish`, `xtea` all have\n`pub use cipher;`). Downstream users cannot reach the traits needed to actually call `encrypt_block`\nwithout adding a separate, version-matched `cipher` dependency of their own.","fix":"Add the re-export next to the imports, as the sibling crates do:\n```rust\npub use cipher;\n\nuse cipher::{ /* ... */ };\n```","locations":[{"ref":"rc5/src/lib.rs:21-29","code":"   21 | use cipher::{\n   22 |     AlgorithmName, Array, BlockCipherDecBackend, BlockCipherDecClosure, BlockCipherDecrypt,\n   23 |     BlockCipherEncBackend, BlockCipherEncClosure, BlockCipherEncrypt, BlockSizeUser, KeyInit,\n   24 |     KeySizeUser, ParBlocksSizeUser,\n   25 |     array::ArraySize,\n   26 |     consts::{U1, U2, U256},\n   27 |     inout::InOut,\n   28 |     typenum::{Diff, IsLess, Le, NonZero, Sum, Unsigned},\n   29 | };","lines":9,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc5/src/lib.rs#L21-L29"}]},
{"id":"API_13","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`RC6` implements neither `Clone` nor `Debug`, unlike `RC5` (`#[derive(Clone)]` plus a\nmanual `fmt::Debug`) and `Serpent` (`#[derive(Clone)]` plus `fmt::Debug`). Verified:\n`c.clone()` on an `RC6<u32, U20, U16>` fails with\n`error[E0599]: no method named \\`clone\\` found for struct \\`RC6<W, R, B>\\``. Cloning a\nkey-initialised cipher is a routine need (e.g. to hand one instance per thread), and\n`Debug` is expected of every public type in the RustCrypto ecosystem - `AlgorithmName`\nis implemented but there is no `Debug` to consume it.","fix":"Add `#[derive(Clone)]` to `pub struct RC6<W, R, B>` in `rc6/src/core/backend.rs`\n(`ExpandedKeyTable<W, R>` and `PhantomData<B>` are both `Clone`), and add a `fmt::Debug`\nimpl next to `AlgorithmName` in `rc6/src/block_cipher.rs` that prints\n`\"RC6 - {W}/{R}/{B} {{ ... }}\"` without leaking key material, matching\n`rc5/src/lib.rs:437-461`.","locations":[{"ref":"rc6/src/core/backend.rs:17-29","code":"   17 | pub struct RC6<W, R, B>\n   18 | where\n   19 |     W: Word,\n   20 |     R: Unsigned,\n   21 |     R: IsLess<U256>,\n   22 |     // ExpandedKeyTableSize\n   23 |     R: Add<U2>,\n   24 |     Sum<R, U2>: Mul<U2>,\n   25 |     ExpandedKeyTableSize<R>: ArraySize,\n   26 | {\n   27 |     key_table: ExpandedKeyTable<W, R>,\n   28 |     _key_size: PhantomData<B>,\n   29 | }","lines":13,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc6/src/core/backend.rs#L17-L29"},{"ref":"rc6/src/block_cipher.rs:308-332","code":"  308 | impl<W, R, B> AlgorithmName for RC6<W, R, B>\n  309 | where\n  310 |     W: Word,\n  311 |     // Block size\n  312 |     W::Bytes: Mul<U4>,\n  313 |     BlockSize<W>: ArraySize,\n  314 |     // Rounds range\n  315 |     R: Unsigned,\n  316 |     R: IsLess<U256>,\n  317 |     Le<R, U256>: NonZero,\n  318 |     // ExpandedKeyTableSize\n  319 |     R: Add<U2>,\n  320 |     Sum<R, U2>: Mul<U2>,\n  321 |     ExpandedKeyTableSize<R>: ArraySize,\n  322 | {\n  323 |     fn write_alg_name(f: &mut core::fmt::Formatter<'_>) -> core::fmt::Result {\n  324 |         write!(\n  325 |             f,\n  326 |             \"RC6 - {}/{}/{}\",\n  327 |             core::any::type_name::<W>(),\n  328 |             <R as Unsigned>::to_u8(),\n  329 |             <R as Unsigned>::to_u8(),\n  330 |         )\n  331 |     }\n  332 | }","lines":25,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc6/src/block_cipher.rs#L308-L332"}]},
{"id":"API_14","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`RC6<W, R, B>` accepts `R = U0`. The `// Rounds range` bound block only encodes\n`R < 256` (`R: IsLess<U256>` + `Le<R, U256>: NonZero`); nothing rejects zero rounds. The\ncomment `// Rounds range` reads as if a valid range were enforced, but\n`RC6<u32, U0, U16>` compiles and encrypts successfully (verified), degenerating the\ncipher to `b += S[0]; d += S[1]; a += S[2]; c += S[3]` - four key additions and no\nmixing, trivially invertible without the key. The same applies to `rc5`.","fix":"Either add `R: NonZero,` (or a stronger `R: IsGreaterOrEqual<U20>` reflecting the RC6\npaper's recommendation of `r = 20`) to the `// Rounds range` block in every `where`\nclause, or, if arbitrary `r` must stay supported for test vectors, replace the misleading\n`// Rounds range` comment with `// r < 256 (no lower bound; r < 20 is not secure)` and\ndocument the hazard on `RC6`.","locations":[{"ref":"rc6/src/core/backend.rs:37-40","code":"   37 |     // Rounds range\n   38 |     R: Unsigned,\n   39 |     R: IsLess<U256>,\n   40 |     Le<R, U256>: NonZero,","lines":4,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc6/src/core/backend.rs#L37-L40"},{"ref":"rc6/src/block_cipher.rs:22-25","code":"   22 |     // Rounds range\n   23 |     R: Unsigned,\n   24 |     R: IsLess<U256>,\n   25 |     Le<R, U256>: NonZero,","lines":4,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc6/src/block_cipher.rs#L22-L25"}]},
{"id":"API_15","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`RC6::encrypt` and `RC6::decrypt` are inherent `pub fn`s on a publicly re-exported type,\nso they are part of `rc6`'s public API, yet they are undocumented, duplicate the\n`BlockCipherEncrypt`/`BlockCipherDecrypt` trait API, and take\n`InOut<'_, '_, Block<W>>` where `Block<W>` is an alias defined in the *private*\n`crate::core` module - a caller has to reverse-engineer that it means\n`Array<u8, Prod<W::Bytes, U4>>`. They also sit in an `impl` block that omits the\n`// Key range` bounds, so `RC6::<u32, U20, U0>::encrypt` is reachable even though such a\ncipher cannot be constructed. `rc5` keeps the equivalent helpers `pub(crate)`.","fix":"Change `pub fn encrypt` / `pub fn decrypt` to `pub(crate) fn encrypt` /\n`pub(crate) fn decrypt` so the only public entry points are the `cipher` traits, and add\n`#[inline]` to both (they are each called from exactly one `#[inline(always)]`\n`encrypt_block`/`decrypt_block`). If they are meant to be public, document them and add\nthe `// Key range` bounds to that `impl` block.","locations":[{"ref":"rc6/src/core/backend.rs:139-141","code":"  139 |     pub fn encrypt(&self, mut block: InOut<'_, '_, Block<W>>) {\n  140 |         let (mut a, mut b, mut c, mut d) = Self::words_from_block(block.get_in());\n  141 |         let key = &self.key_table;","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc6/src/core/backend.rs#L139-L141"},{"ref":"rc6/src/core/backend.rs:169-171","code":"  169 |     pub fn decrypt(&self, mut block: InOut<'_, '_, Block<W>>) {\n  170 |         let (mut a, mut b, mut c, mut d) = Self::words_from_block(block.get_in());\n  171 |         let key = &self.key_table;","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc6/src/core/backend.rs#L169-L171"}]},
{"id":"API_16","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`Serpent` and `Twofish` both override `KeyInit::new_from_slice` to accept key lengths that differ from\n`<Self as KeySizeUser>::KeySize::USIZE`, which contradicts the documented contract of the trait method\n(\"Returns `InvalidLength` in the event the length of the provided slice is not equal to\n`<Self as KeySizeUser>::KeySize::USIZE`\"). Worse, the two crates resolve the resulting ambiguity in opposite\ndirections: `Serpent` declares `type KeySize = U16` (the *smallest* supported size) while accepting 16..=32\nbytes, and `Twofish` declares `type KeySize = U32` (the *largest*) while accepting 16, 24 or 32. Consequently\n`KeyInit::generate_key()` yields a 128-bit key for `Serpent` but a 256-bit key for `Twofish`, and generic code\nthat round-trips a key through `Key<C>` silently downgrades Serpent to its weakest key size. Neither type has\na doc comment mentioning that variable key lengths are supported at all.","fix":"Document the accepted range on both types (e.g. `/// Supports 16..=32 byte keys via `new_from_slice`;\n`KeySize` is the default/generated size.`) and make the choice consistent across the workspace - either pick\nthe largest supported size for `KeySize` in both crates, or split the ciphers into per-key-size types\n(`Serpent128`/`Serpent192`/`Serpent256`, `Twofish128`/`Twofish192`/`Twofish256`) as `camellia` already does,\nwhich removes the contract violation entirely.","locations":[{"ref":"serpent/src/lib.rs:72-84","code":"   72 | impl KeySizeUser for Serpent {\n   73 |     type KeySize = U16;\n   74 | }\n   75 | \n   76 | impl KeyInit for Serpent {\n   77 |     fn new(key: &cipher::Key<Self>) -> Self {\n   78 |         Self::new_from_slice(key).unwrap()\n   79 |     }\n   80 | \n   81 |     fn new_from_slice(key: &[u8]) -> Result<Self, InvalidLength> {\n   82 |         if key.len() < 16 || key.len() > 32 {\n   83 |             return Err(InvalidLength);\n   84 |         }","lines":13,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/serpent/src/lib.rs#L72-L84"},{"ref":"twofish/src/lib.rs:176-199","code":"  176 | impl KeySizeUser for Twofish {\n  177 |     type KeySize = U32;\n  178 | }\n  179 | \n  180 | impl KeyInit for Twofish {\n  181 |     #[inline]\n  182 |     fn new(key: &Key<Self>) -> Self {\n  183 |         Self::new_from_slice(key).unwrap()\n  184 |     }\n  185 | \n  186 |     #[inline]\n  187 |     fn new_from_slice(key: &[u8]) -> Result<Self, InvalidLength> {\n  188 |         let n = key.len();\n  189 |         if n != 16 && n != 24 && n != 32 {\n  190 |             return Err(InvalidLength);\n  191 |         }\n  192 |         let mut twofish = Self {\n  193 |             s: [0u8; 16],\n  194 |             k: [0u32; 40],\n  195 |             start: 0,\n  196 |         };\n  197 |         twofish.key_schedule(key);\n  198 |         Ok(twofish)\n  199 |     }","lines":24,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/twofish/src/lib.rs#L176-L199"},{"ref":"serpent/src/lib.rs:46-50","code":"   46 | /// Serpent block cipher.\n   47 | #[derive(Clone)]\n   48 | pub struct Serpent {\n   49 |     round_keys: RoundKeys,\n   50 | }","lines":5,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/serpent/src/lib.rs#L46-L50"}]},
{"id":"API_17","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"`Xtea` is the only cipher type in the workspace that is not cloneable. Every sibling crate either derives it (`Twofish`, `Sm4`, `Serpent`, `Cast5`, `Cast6`, `Rc2`, `Idea`, `Camellia`, `Blowfish`, `Kuznyechik`, `Gift128`, `Aria`, `RC5`, `BeltBlock`) or provides a hand-written impl (`Gost89` in `magma`). Without `Clone`, callers cannot cheaply hand a key-scheduled instance to another thread or store it in a cloneable higher-level construction, which is a gratuitous inconsistency in the trait surface across the workspace.","fix":"Before:\n```rust\n/// XTEA block self.\npub struct Xtea {\n```\nAfter:\n```rust\n/// XTEA block cipher.\n#[derive(Clone)]\npub struct Xtea {\n```","locations":[{"ref":"xtea/src/lib.rs:38-41","code":"   38 | /// XTEA block self.\n   39 | pub struct Xtea {\n   40 |     k: [u32; 4],\n   41 | }","lines":4,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/xtea/src/lib.rs#L38-L41"}]},
{"id":"API_18","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"`KeyInit for Xtea` overrides `new_from_slice` with code that is functionally identical to the default implementation provided by `crypto_common::KeyInit` (length check against `KeySize`, then call `new`), and then implements the *infallible* `new` as `Self::new_from_slice(key).unwrap()`. This inverts the intended direction of the trait and puts an (unreachable) panic path into the primary constructor of a cryptographic type. `blowfish` and `twofish` legitimately override `new_from_slice` because they accept variable-length keys; `Xtea` has a fixed 16-byte `KeySize = U16`, so the override is pure duplication.","fix":"Before:\n```rust\nimpl KeyInit for Xtea {\n    fn new(key: &Key<Self>) -> Self {\n        Self::new_from_slice(key).unwrap()\n    }\n\n    fn new_from_slice(key: &[u8]) -> Result<Self, InvalidLength> {\n        if key.len() != 16 {\n            return Err(InvalidLength);\n        }\n        let key = [\n            u32::from_le_bytes(key[0..4].try_into().unwrap()),\n            u32::from_le_bytes(key[4..8].try_into().unwrap()),\n            u32::from_le_bytes(key[8..12].try_into().unwrap()),\n            u32::from_le_bytes(key[12..16].try_into().unwrap()),\n        ];\n        Ok(Xtea { k: key })\n    }\n}\n```\nAfter (the default `new_from_slice` keeps the exact same public behaviour, and `InvalidLength` can be dropped from the `use` list):\n```rust\nimpl KeyInit for Xtea {\n    fn new(key: &Key<Self>) -> Self {\n        Self {\n            k: [\n                u32::from_le_bytes(key[0..4].try_into().unwrap()),\n                u32::from_le_bytes(key[4..8].try_into().unwrap()),\n                u32::from_le_bytes(key[8..12].try_into().unwrap()),\n                u32::from_le_bytes(key[12..16].try_into().unwrap()),\n            ],\n        }\n    }\n}\n```","locations":[{"ref":"xtea/src/lib.rs:47-64","code":"   47 | impl KeyInit for Xtea {\n   48 |     fn new(key: &Key<Self>) -> Self {\n   49 |         Self::new_from_slice(key).unwrap()\n   50 |     }\n   51 | \n   52 |     fn new_from_slice(key: &[u8]) -> Result<Self, InvalidLength> {\n   53 |         if key.len() != 16 {\n   54 |             return Err(InvalidLength);\n   55 |         }\n   56 |         let key = [\n   57 |             u32::from_le_bytes(key[0..4].try_into().unwrap()),\n   58 |             u32::from_le_bytes(key[4..8].try_into().unwrap()),\n   59 |             u32::from_le_bytes(key[8..12].try_into().unwrap()),\n   60 |             u32::from_le_bytes(key[12..16].try_into().unwrap()),\n   61 |         ];\n   62 |         Ok(Xtea { k: key })\n   63 |     }\n   64 | }","lines":18,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/xtea/src/lib.rs#L47-L64"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"high","difficulty":"hard","description":"`Twofish` recomputes the key-dependent S-boxes and the whole MDS `GF(2^8)` multiplication from scratch for\n*every single block*. `g_func` calls `sbox` between 12 and 20 times (4 bytes x 3..5 `q`-permutation stages,\ndepending on `self.start`) and `mds_column_mult` 4 times; `encrypt_block`/`decrypt_block` call `g_func` 32\ntimes per 16-byte block (8 loop iterations x 4 calls). Each `sbox` call performs 4 `QBOX` lookups plus ~12\nbit operations, and each `mds_column_mult` call runs two `gf_mult` bit-serial loops. That works out to roughly\n400-640 `sbox` evaluations and 256 `gf_mult` loops (~2000 loop iterations) per block. Every conventional\nTwofish implementation precomputes the four key-dependent S-boxes (optionally folded with the MDS matrix into\nfour 256-entry `u32` tables) once during key setup, reducing `g` to 4 table lookups plus 3 XORs. This is\nper-block work that belongs entirely in key expansion and costs roughly an order of magnitude (or more) in\nthroughput.","fix":"Add precomputed tables to the struct, e.g. `mds_sbox: [[u32; 256]; 4]`, and fill them in `key_schedule` after\n`self.s` and `self.start` are known:\n```rust\nfor y in 0..4 {\n    for x in 0..256 {\n        let mut g = sbox(QORD[y][self.start], x as u8);\n        for z in self.start + 1..5 {\n            g ^= self.s[4 * (z - self.start - 1) + y];\n            g = sbox(QORD[y][z], g);\n        }\n        self.mds_sbox[y][x] = mds_column_mult(g, y);\n    }\n}\n```\nThen `g_func` becomes\n```rust\nfn g_func(&self, x: u32) -> u32 {\n    let b = x.to_le_bytes();\n    self.mds_sbox[0][b[0] as usize]\n        ^ self.mds_sbox[1][b[1] as usize]\n        ^ self.mds_sbox[2][b[2] as usize]\n        ^ self.mds_sbox[3][b[3] as usize]\n}\n```\nRemember to add the new field to the `Drop`/`Zeroize` handling.","locations":[{"ref":"twofish/src/lib.rs:135-148","code":"  135 |     fn g_func(&self, x: u32) -> u32 {\n  136 |         let mut result: u32 = 0;\n  137 |         for y in 0..4 {\n  138 |             let mut g = sbox(QORD[y][self.start], (x >> (8 * y)) as u8);\n  139 | \n  140 |             for z in self.start + 1..5 {\n  141 |                 g ^= self.s[4 * (z - self.start - 1) + y];\n  142 |                 g = sbox(QORD[y][z], g);\n  143 |             }\n  144 | \n  145 |             result ^= mds_column_mult(g, y);\n  146 |         }\n  147 |         result\n  148 |     }","lines":14,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/twofish/src/lib.rs#L135-L148"},{"ref":"twofish/src/lib.rs:75-95","code":"   75 | fn mds_column_mult(x: u8, column: usize) -> u32 {\n   76 |     let x5b = gf_mult(x, 0x5b, MDS_POLY);\n   77 |     let xef = gf_mult(x, 0xef, MDS_POLY);\n   78 | \n   79 |     let v = match column {\n   80 |         0 => [x, x5b, xef, xef],\n   81 |         1 => [xef, xef, x5b, x],\n   82 |         2 => [x5b, xef, x, xef],\n   83 |         3 => [x5b, x, xef, x5b],\n   84 |         _ => unreachable!(),\n   85 |     };\n   86 |     u32::from_le_bytes(v)\n   87 | }\n   88 | \n   89 | fn mds_mult(y: [u8; 4]) -> u32 {\n   90 |     let mut z = 0;\n   91 |     for i in 0..4 {\n   92 |         z ^= mds_column_mult(y[i], i);\n   93 |     }\n   94 |     z\n   95 | }","lines":21,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/twofish/src/lib.rs#L75-L95"},{"ref":"twofish/src/lib.rs:41-45","code":"   41 | pub struct Twofish {\n   42 |     s: [u8; 16],  // S-box key\n   43 |     k: [u32; 40], // Subkeys\n   44 |     start: usize,\n   45 | }","lines":5,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/twofish/src/lib.rs#L41-L45"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"Both VAES backends pick their `ParBlocksSize` from the x86-64 register file - the comments state\n\"AVX2's 16 YMM registers\" and \"AVX-512's 32 ZMM registers\" - but `aes/src/backends.rs` compiles\nboth modules for `target_arch = \"x86\"` as well, where only **8** YMM/ZMM registers exist. On 32-bit\nx86 the VAES256 backend needs 15 live `__m256i` block registers plus a key register, and the VAES512\nbackend needs 16 live `__m512i` registers plus up to 15 broadcast keys, so the inner loops spill\nalmost every value to the stack every round and the backends are far slower than the AES-NI backend\nthey replace. The comments are also unconditionally wrong for that target. Note the `vaes256`/\n`vaes512` CI jobs only build `x86_64-unknown-linux-gnu`, so this is untested.","fix":"Either restrict the VAES backends to `target_arch = \"x86_64\"` in `aes/src/backends.rs` and in the\n`cfg_if!` token block of `aes/src/lib.rs`, or select the par-block size per target, e.g.\n```rust\n#[cfg(target_arch = \"x86_64\")]\ntype ParBlocksSize = U64;\n#[cfg(target_arch = \"x86\")]\ntype ParBlocksSize = U16; // only 8 ZMM registers on 32-bit x86\n```\nand amend the comments to say which target the register budget refers to.","locations":[{"ref":"aes/src/backends/x86_vaes256.rs:43-49","code":"   43 | // Block size of 30 is chosen based on AVX2's 16 YMM registers.\n   44 | //\n   45 | // - 1 register holds round key\n   46 | // - 15 registers hold 2 data blocks\n   47 | impl<const RK: usize> ParBlocksSizeUser for Aes<'_, RK> {\n   48 |     type ParBlocksSize = U30;\n   49 | }","lines":7,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends/x86_vaes256.rs#L43-L49"},{"ref":"aes/src/backends/x86_vaes512.rs:43-51","code":"   43 | // Block sizes are chosen based on AVX-512's 32 ZMM registers.\n   44 | //\n   45 | // Round keys use 11, 13, 15 registers for AES-128/192/256 respectively.\n   46 | // It results in 21, 19, 17 registers available for blocks with each register containing 4 blocks.\n   47 | // We use the closest power-of-two value.\n   48 | // TODO: bench bigger cipher-specific values\n   49 | impl<const RK: usize> ParBlocksSizeUser for Aes<'_, RK> {\n   50 |     type ParBlocksSize = U64;\n   51 | }","lines":9,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends/x86_vaes512.rs#L43-L51"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"medium","difficulty":"hard","description":"`belt_wblock_enc` and `belt_wblock_dec` are quadratic in the input length. Each of the `2 * n`\niterations (a) recomputes `s`/`r1` by XOR-folding *all* `n - 1` leading blocks\n(`data[..len - 1].chunks_exact(BLOCK_SIZE).fold(..)`) and (b) shifts the **entire** buffer by one\nblock with `data.copy_within(BLOCK_SIZE.., 0)` / `data.copy_within(..tail_pos, BLOCK_SIZE)`.\nThat is `O(n)` work per iteration and `O(n^2)` overall, so wide-block encryption of a 1 MiB buffer\ndoes on the order of 8 GiB of memory traffic. Both costs are avoidable: the running XOR satisfies\n`s_new = s_old ^ X_1 ^ X_n ^ belt_block_raw(s_old) ^ i` for the all-full-blocks case, and the\nblock rotation can be replaced by a rotating start index with a single final normalisation pass.","fix":"Keep the running XOR accumulator across iterations instead of re-folding the buffer, and replace the\nper-iteration `copy_within` of the whole buffer with a logical rotation offset (e.g. index arithmetic\nmodulo `len`, or `slice::rotate_left(BLOCK_SIZE)` only once at the end). If the ragged-tail case is\ntoo awkward to fold incrementally, special-case `len % BLOCK_SIZE == 0` (the common path) with the\n`O(n)` algorithm and keep the current code only for the partial-tail case.","locations":[{"ref":"belt-block/src/lib.rs:115-129","code":"  115 |     let len = data.len();\n  116 |     let n = len.div_ceil(BLOCK_SIZE);\n  117 |     for i in 1..(2 * n + 1) {\n  118 |         let s = data[..len - 1]\n  119 |             .chunks_exact(BLOCK_SIZE)\n  120 |             .fold(Block::default(), xor);\n  121 | \n  122 |         data.copy_within(BLOCK_SIZE.., 0);\n  123 |         let (tail1, tail2) = data[len - 2 * BLOCK_SIZE..].split_at_mut(BLOCK_SIZE);\n  124 |         tail2.copy_from_slice(&s);\n  125 | \n  126 |         let s = belt_block_raw(to_u32(&s), key);\n  127 |         xor_set(tail1, &from_u32::<16>(&s));\n  128 |         xor_set(tail1, &i.to_le_bytes());\n  129 |     }","lines":15,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/belt-block/src/lib.rs#L115-L129"},{"ref":"belt-block/src/lib.rs:143-158","code":"  143 |     let len = data.len();\n  144 |     let n = len.div_ceil(BLOCK_SIZE);\n  145 |     for i in (1..(2 * n + 1)).rev() {\n  146 |         let tail_pos = len - BLOCK_SIZE;\n  147 |         let s = Block::try_from(&data[tail_pos..]).unwrap();\n  148 |         data.copy_within(..tail_pos, BLOCK_SIZE);\n  149 | \n  150 |         let s_enc = belt_block_raw(to_u32(&s), key);\n  151 |         xor_set(&mut data[tail_pos..], &from_u32::<16>(&s_enc));\n  152 |         xor_set(&mut data[tail_pos..], &i.to_le_bytes());\n  153 | \n  154 |         let r1 = data[..len - 1]\n  155 |             .chunks_exact(BLOCK_SIZE)\n  156 |             .skip(1)\n  157 |             .fold(s, xor);\n  158 |         data[..BLOCK_SIZE].copy_from_slice(&r1);","lines":16,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/belt-block/src/lib.rs#L143-L158"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"medium","difficulty":"easy","description":"In the `big_soft` backend - the fallback used on every target that is not x86 with SSE2 or aarch64 with NEON, and the backend selected by `kuznyechik_backend=\"soft\"` - `EncBackend` declares `ParBlocksSize = U3` and provides a hand-unrolled `encrypt_par_blocks`, but `DecBackend` declares `ParBlocksSize = consts::U1` and provides no `decrypt_par_blocks`. Bulk decryption therefore falls back to one block at a time through the trait's default implementation and gets none of the instruction-level parallelism that the encryption path gets, even though the decryption round (`transform` + XOR) has exactly the same shape and the same 16-XOR dependency chain that the unrolling is there to hide. Both `sse2` and `neon` implement `decrypt_par_blocks`, so this is an asymmetry specific to the portable backend.","fix":"Set `type ParBlocksSize = ParBlocksSize;` (the `U3` alias already used by `EncBackend`) on `DecBackend` and add a `decrypt_par_blocks` mirroring `encrypt_par_blocks`:\n```rust\n#[inline]\nfn decrypt_par_blocks(&self, mut blocks: InOut<'_, '_, ParBlocks<Self>>) {\n    let k = self.0;\n    let mut bs = blocks.get_in().0.map(|b| u128::from_le_bytes(b.0));\n\n    unroll_par!(j, {\n        bs[j] ^= k[0];\n        bs[j] = transform(sub_bytes(bs[j], &P), &DEC_TABLE);\n    });\n    for i in 1..9 {\n        unroll_par!(j, {\n            bs[j] = transform(bs[j], &DEC_TABLE);\n            bs[j] ^= k[i];\n        });\n    }\n    let out = blocks.get_out();\n    unroll_par!(j, {\n        out[j].0 = (sub_bytes(bs[j], &P_INV) ^ k[9]).to_le_bytes();\n    });\n}\n```\nBenchmark with `cargo bench -p kuznyechik` to confirm the win before/after.","locations":[{"ref":"kuznyechik/src/big_soft/backends.rs:143-145","code":"  143 | impl ParBlocksSizeUser for DecBackend<'_> {\n  144 |     type ParBlocksSize = consts::U1;\n  145 | }","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/big_soft/backends.rs#L143-L145"},{"ref":"kuznyechik/src/big_soft/backends.rs:147-167","code":"  147 | impl BlockCipherDecBackend for DecBackend<'_> {\n  148 |     #[inline]\n  149 |     fn decrypt_block(&self, mut block: InOut<'_, '_, Block>) {\n  150 |         let k = self.0;\n  151 | \n  152 |         let mut b: u128 = u128::from_le_bytes(block.get_in().0);\n  153 | \n  154 |         b ^= k[0];\n  155 |         b = sub_bytes(b, &P);\n  156 |         b = transform(b, &DEC_TABLE);\n  157 | \n  158 |         for i in 1..9 {\n  159 |             b = transform(b, &DEC_TABLE);\n  160 |             b ^= k[i];\n  161 |         }\n  162 |         b = sub_bytes(b, &P_INV);\n  163 |         b ^= k[9];\n  164 | \n  165 |         *block.get_out() = Array(b.to_le_bytes());\n  166 |     }\n  167 | }","lines":21,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/big_soft/backends.rs#L147-L167"},{"ref":"kuznyechik/src/big_soft/backends.rs:116-134","code":"  116 |     #[inline]\n  117 |     fn encrypt_par_blocks(&self, mut blocks: InOut<'_, '_, ParBlocks<Self>>) {\n  118 |         let k = self.0;\n  119 | \n  120 |         let mut bs = blocks.get_in().0.map(|b| u128::from_le_bytes(b.0));\n  121 | \n  122 |         for i in 0..9 {\n  123 |             unroll_par!(j, {\n  124 |                 bs[j] ^= k[i];\n  125 |                 bs[j] = transform(bs[j], &ENC_TABLE);\n  126 |             });\n  127 |         }\n  128 | \n  129 |         let blocks_out = blocks.get_out();\n  130 |         unroll_par!(i, {\n  131 |             bs[i] ^= k[9];\n  132 |             blocks_out[i].0 = u128::to_le_bytes(bs[i]);\n  133 |         });\n  134 |     }","lines":19,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/big_soft/backends.rs#L116-L134"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`Threefish*::encrypt_block_u64` and `decrypt_block_u64` copy the entire block state with `block.clone()` on\n*every round* purely to have a stable source for the word permutation. That is 72 copies for `Threefish256`\nand `Threefish512` and 80 copies for `Threefish1024` per block, i.e. up to 80 x 128 bytes = 10 KiB of state\nshuffling per 128-byte block. In addition, `[u64; N]` is `Copy`, so calling `.clone()` on a `&mut [u64; N]`\n(which auto-derefs to `<[u64; N] as Clone>::clone`) is a misleading way to spell `*block`.","fix":"Replace `let block_prev = block.clone();` with `let block_prev = *block;` for clarity, and remove the\nper-round copy entirely by keeping two `[u64; $n_w]` buffers and swapping the source/destination roles each\nround (or by unrolling 4 or 8 rounds and folding the permutation into the word indices, which is how the\nreference Threefish/Skein implementations avoid the copy).","locations":[{"ref":"threefish/src/lib.rs:110-127","code":"  110 |                 for d in 0..$rounds {\n  111 |                     let block_prev = block.clone();\n  112 |                     for j in 0..($n_w / 2) {\n  113 |                         let v = (block_prev[2 * j], block_prev[2 * j + 1]);\n  114 |                         let e = if d % 4 == 0 {\n  115 |                             let s0 = self.sk[d / 4][2 * j];\n  116 |                             let s1 = self.sk[d / 4][2 * j + 1];\n  117 |                             (v.0.wrapping_add(s0), v.1.wrapping_add(s1))\n  118 |                         } else {\n  119 |                             v\n  120 |                         };\n  121 |                         let r = $rot[d % 8][j];\n  122 |                         let (f0, f1) = mix(r, e);\n  123 |                         let (pi0, pi1) = ($perm[2 * j], $perm[2 * j + 1]);\n  124 |                         block[pi0 as usize] = f0;\n  125 |                         block[pi1 as usize] = f1;\n  126 |                     }\n  127 |                 }","lines":18,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/threefish/src/lib.rs#L110-L127"},{"ref":"threefish/src/lib.rs:141-158","code":"  141 |                 for d in (0..$rounds).rev() {\n  142 |                     let block_prev = block.clone();\n  143 |                     for j in 0..($n_w / 2) {\n  144 |                         let (pi0, pi1) = ($perm[2 * j], $perm[2 * j + 1]);\n  145 |                         let f = (block_prev[pi0 as usize], block_prev[pi1 as usize]);\n  146 |                         let r = $rot[d % 8][j];\n  147 |                         let (e0, e1) = inv_mix(r, f);\n  148 |                         if d % 4 == 0 {\n  149 |                             let s0 = self.sk[d / 4][2 * j];\n  150 |                             let s1 = self.sk[d / 4][2 * j + 1];\n  151 |                             block[2 * j] = e0.wrapping_sub(s0);\n  152 |                             block[2 * j + 1] = e1.wrapping_sub(s1);\n  153 |                         } else {\n  154 |                             block[2 * j] = e0;\n  155 |                             block[2 * j + 1] = e1;\n  156 |                         }\n  157 |                     }\n  158 |                 }","lines":18,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/threefish/src/lib.rs#L141-L158"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"The four single-block fixslice hazmat entry points (`cipher_round`, `equiv_inv_cipher_round`,\n`mix_columns`, `inv_mix_columns`) are instantiated with `NativeWord`, which is `u64` on 64-bit\ntargets. `broadcast::<W>()` replicates the one input block into all `<W as Word>::Blocks` = 4 slots,\n`W::bitslice` packs 4 blocks, the transformation runs on all 4 lanes, `W::inv_bitslice` unpacks 4\nblocks, and `inv_bitslice_one` then throws 3 of the 4 away. That is a 4x waste in the\nbitslice/unbitslice steps, which dominate the cost of these tiny functions; instantiating them with\n`u32` (2 blocks per batch) would halve it for identical results, since the lanes are independent.","fix":"Instantiate the single-block wrappers with the narrowest available word instead of `NativeWord`,\ne.g. `cipher_round_generic::<u32>(block, round_key)`, `mix_columns_generic::<u32>(block)` and so on,\nand keep `NativeWord` only for the `_par` variants that really do fill a batch. Leave a short\ncomment explaining that lane count above 1 is pure waste for a single-block API.","locations":[{"ref":"aes/src/backends/fixslice/hazmat.rs:12-27","code":"   12 | #[inline]\n   13 | fn inv_bitslice_one<W: Word>(block: &mut Block, state: &State<W>) {\n   14 |     let out = W::inv_bitslice(state);\n   15 |     block.copy_from_slice(out[0].as_slice());\n   16 | }\n   17 | \n   18 | fn cipher_round_generic<W: Word>(block: &mut Block, round_key: &Block) {\n   19 |     let mut state = State::<W>::default();\n   20 |     W::bitslice(&mut state, &broadcast::<W>(block.as_slice()));\n   21 |     sub_bytes(&mut state);\n   22 |     sub_bytes_nots(&mut state);\n   23 |     shift_rows_1(&mut state);\n   24 |     mix_columns_0(&mut state);\n   25 |     inv_bitslice_one(block, &state);\n   26 |     xor_in_place(block, round_key);\n   27 | }","lines":16,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends/fixslice/hazmat.rs#L12-L27"},{"ref":"aes/src/backends/fixslice/hazmat.rs:90-102","code":"   90 | fn mix_columns_generic<W: Word>(block: &mut Block) {\n   91 |     let mut state = State::<W>::default();\n   92 |     W::bitslice(&mut state, &broadcast::<W>(block.as_slice()));\n   93 |     mix_columns_0(&mut state);\n   94 |     inv_bitslice_one(block, &state);\n   95 | }\n   96 | \n   97 | fn inv_mix_columns_generic<W: Word>(block: &mut Block) {\n   98 |     let mut state = State::<W>::default();\n   99 |     W::bitslice(&mut state, &broadcast::<W>(block.as_slice()));\n  100 |     inv_mix_columns_0(&mut state);\n  101 |     inv_bitslice_one(block, &state);\n  102 | }","lines":13,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends/fixslice/hazmat.rs#L90-L102"},{"ref":"aes/src/backends/fixslice/hazmat.rs:128-138","code":"  128 | /// AES mix columns function.\n  129 | #[inline]\n  130 | pub(crate) fn mix_columns(block: &mut Block) {\n  131 |     mix_columns_generic::<NativeWord>(block)\n  132 | }\n  133 | \n  134 | /// AES inverse mix columns function.\n  135 | #[inline]\n  136 | pub(crate) fn inv_mix_columns(block: &mut Block) {\n  137 |     inv_mix_columns_generic::<NativeWord>(block)\n  138 | }","lines":11,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends/fixslice/hazmat.rs#L128-L138"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`xor_columns` and `memshift32` are the only helpers in `utils.rs` that lack an `#[inline]` attribute - every other\nhelper in the file (`delta_swap_1`, `delta_swap_2`, `shift_rows_1/2/3`, `inv_shift_rows_1/2/3`, `add_round_key`,\n`add_round_constant_bit`) has `#[inline]` or `#[inline(always)]`. Consequently both are emitted out of line and\ncalled with a real `call` instruction on every key-schedule round: a release build of the crate contains\n`aes::backends::soft::fixslice::utils::xor_columns::<u64>` and\n`aes::backends::soft::fixslice::utils::memshift32::<u64>` as separate functions, invoked from\n`aes128::key_schedule` and `aes256::key_schedule`. Both bodies are 8-iteration loops over a fixed-size buffer, so\nthe call/spill overhead is a significant fraction of their cost and it blocks the mask constants\n(`W::uniform_row(0x03)` etc.) from being hoisted out of the caller's loop.","fix":"Add `#[inline]` above `pub(super) fn xor_columns<W: Word>(...)` and above `pub(super) fn memshift32<W: Word>(...)`, matching the rest of `utils.rs`.","locations":[{"ref":"aes/src/backends/fixslice/utils.rs:83-92","code":"   83 | pub(super) fn xor_columns<W: Word>(rkeys: &mut [W], offset: usize, idx_xor: usize, idx_ror: u32) {\n   84 |     for i in 0..8 {\n   85 |         let off_i = offset + i;\n   86 |         let rk = rkeys[off_i - idx_xor] ^ (W::uniform_row(0x03) & rkeys[off_i].ror(idx_ror));\n   87 |         rkeys[off_i] = rk\n   88 |             ^ (W::uniform_row(0xfc) & (rk << W::QUARTER_ROW))\n   89 |             ^ (W::uniform_row(0xf0) & (rk << W::HALF_ROW))\n   90 |             ^ (W::uniform_row(0xc0) & (rk << (3 * W::QUARTER_ROW)));\n   91 |     }\n   92 | }","lines":10,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends/fixslice/utils.rs#L83-L92"},{"ref":"aes/src/backends/fixslice/utils.rs:94-104","code":"   94 | /// Copy 32-bytes within the provided slice to an 8-byte offset.\n   95 | pub(super) fn memshift32<W: Word>(buffer: &mut [W], src_offset: usize) {\n   96 |     debug_assert_eq!(src_offset % 8, 0);\n   97 | \n   98 |     let dst_offset = src_offset + 8;\n   99 |     debug_assert!(dst_offset + 8 <= buffer.len());\n  100 | \n  101 |     for i in (0..8).rev() {\n  102 |         buffer[dst_offset + i] = buffer[src_offset + i];\n  103 |     }\n  104 | }","lines":11,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends/fixslice/utils.rs#L94-L104"}]},
{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`memshift32` copies its 8 elements with a **reverse** index loop (`for i in (0..8).rev()`), which is the idiom used\nwhen source and destination ranges overlap and must be copied back-to-front. Here they cannot overlap:\n`dst_offset` is defined as exactly `src_offset + 8` and the length is 8, so `src_offset..src_offset + 8` and\n`dst_offset..dst_offset + 8` are disjoint. The reverse loop is therefore misleading about the aliasing situation\nand it also defeats vectorisation/`memcpy` recognition, forcing 8 separate element loads and stores.","fix":"Replace the manual loop with a single slice copy:\n```rust\n    let dst_offset = src_offset + 8;\n    debug_assert!(dst_offset + 8 <= buffer.len());\n\n    buffer.copy_within(src_offset..src_offset + 8, dst_offset);\n```","locations":[{"ref":"aes/src/backends/fixslice/utils.rs:98-103","code":"   98 |     let dst_offset = src_offset + 8;\n   99 |     debug_assert!(dst_offset + 8 <= buffer.len());\n  100 | \n  101 |     for i in (0..8).rev() {\n  102 |         buffer[dst_offset + i] = buffer[src_offset + i];\n  103 |     }","lines":6,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends/fixslice/utils.rs#L98-L103"}]},
{"id":"PERF_9","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"Neither the `Word::bitslice` / `Word::inv_bitslice` trait declarations nor either of the two impls carry\n`#[inline]`, unlike the rest of the trait's methods (`ror`, `uniform_row`, `pack_rows`, `byte_repeat` are all\n`#[inline(always)]`). In a release build this produces out-of-line, GOT-*indirect* calls\n(`call *0x...(%rip) # ...Word8bitslice$got`) for every encrypt/decrypt batch and for every key-schedule\n`bitslice`, and forces the 64-byte `Array<Block, Blocks>` return value of `inv_bitslice` through memory. The cost\nis worst in `fixslice/hazmat.rs`, where `cipher_round`/`mix_columns` perform one `bitslice` + one `inv_bitslice`\nper single 16-byte block.","fix":"Add `#[inline]` to the four impl methods `<u32 as Word>::bitslice`, `<u32 as Word>::inv_bitslice`, `<u64 as Word>::bitslice` and `<u64 as Word>::inv_bitslice` (attributes on the trait declaration are only defaults, so the impls need them).","locations":[{"ref":"aes/src/backends/fixslice/word.rs:54-58","code":"   54 |     /// Pack `Self::Blocks` input blocks into a bitsliced 8-row state slice.\n   55 |     fn bitslice(output: &mut [Self], input: &Array<Block, Self::Blocks>);\n   56 | \n   57 |     /// Unpack a bitsliced 8-row state slice into `Self::Blocks` output blocks.\n   58 |     fn inv_bitslice(input: &[Self]) -> Array<Block, Self::Blocks>;","lines":5,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends/fixslice/word.rs#L54-L58"},{"ref":"aes/src/backends/fixslice/word.rs:85-86","code":"   85 |     fn bitslice(output: &mut [u32], input: &Array<Block, U2>) {\n   86 |         debug_assert_eq!(output.len(), 8);","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends/fixslice/word.rs#L85-L86"},{"ref":"aes/src/backends/fixslice/word.rs:119-120","code":"  119 |     fn inv_bitslice(input: &[u32]) -> Array<Block, U2> {\n  120 |         debug_assert_eq!(input.len(), 8);","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends/fixslice/word.rs#L119-L120"},{"ref":"aes/src/backends/fixslice/word.rs:195-196","code":"  195 |     fn bitslice(output: &mut [u64], input: &Array<Block, U4>) {\n  196 |         debug_assert_eq!(output.len(), 8);","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends/fixslice/word.rs#L195-L196"},{"ref":"aes/src/backends/fixslice/word.rs:241-242","code":"  241 |     fn inv_bitslice(input: &[u64]) -> Array<Block, U4> {\n  242 |         debug_assert_eq!(input.len(), 8);","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends/fixslice/word.rs#L241-L242"}]},
{"id":"PERF_10","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`sl2`, `fo` and `fe` carry no inlining hint even though they are the ARIA round function itself -\ncalled `RK - 2` times per block from `encrypt_block`/`decrypt_block` - and the helpers they are\nbuilt from (`diffuse`, `a`) are both `#[inline(always)]`. With the default multi-codegen-unit\nrelease profile rustc is free to leave these `pub(crate)` functions out-of-line, adding a call plus\na 16-byte argument/return shuffle per round.","fix":"Before:\n```rust\npub(crate) fn sl2(x128: u128) -> u128 {\n...\npub(crate) fn fo(x128: u128) -> u128 {\n...\npub(crate) fn fe(x128: u128) -> u128 {\n```\nAfter:\n```rust\n#[inline(always)]\npub(crate) fn sl2(x128: u128) -> u128 {\n...\n#[inline(always)]\npub(crate) fn fo(x128: u128) -> u128 {\n...\n#[inline(always)]\npub(crate) fn fe(x128: u128) -> u128 {\n```","locations":[{"ref":"aria/src/utils.rs:17-19","code":"   17 | pub(crate) fn sl2(x128: u128) -> u128 {\n   18 |     let x = x128.to_be_bytes();\n   19 |     let y = [","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aria/src/utils.rs#L17-L19"},{"ref":"aria/src/utils.rs:40-42","code":"   40 | pub(crate) fn fo(x128: u128) -> u128 {\n   41 |     let x = x128.to_be_bytes();\n   42 |     diffuse([","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aria/src/utils.rs#L40-L42"},{"ref":"aria/src/utils.rs:62-64","code":"   62 | pub(crate) fn fe(x128: u128) -> u128 {\n   63 |     let x = x128.to_be_bytes();\n   64 |     diffuse([","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aria/src/utils.rs#L62-L64"}]},
{"id":"PERF_11","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`f`, `fl` and `flinv` are tiny leaf helpers invoked from the round loop in\n`Camellia::encrypt_block`/`decrypt_block` (up to 24 `f` calls plus 6 `fl`/`flinv` calls per 16-byte\nblock), yet none of them carries `#[inline]`. They live in a different module from their only caller,\nso with the default release `codegen-units = 16` they can land in a different codegen unit and not be\ninlined at all, turning the innermost step of the cipher into a real call. Every other hot helper in\nthe neighbouring crates (`cast6::forward_quad`, `cast6::reverse_quad`, `cast6::forward_octave`,\n`cast5::key_schedule`) is annotated, so this is also an inconsistency.","fix":"Add `#[inline]` above `pub(crate) fn f`, `pub(crate) fn fl` and `pub(crate) fn flinv` in\n`camellia/src/utils.rs`, e.g.:\n\n```rust\n/// F-function component of Camellia defined in RFC 3713.\n#[inline]\npub(crate) fn f(input: u64, key: u64) -> u64 {\n```","locations":[{"ref":"camellia/src/utils.rs:3-5","code":"    3 | /// F-function of component of Camellia defined in RFC 3713.\n    4 | pub(crate) fn f(input: u64, key: u64) -> u64 {\n    5 |     let x = (input ^ key).to_be_bytes();","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/camellia/src/utils.rs#L3-L5"},{"ref":"camellia/src/utils.rs:19-21","code":"   19 | /// FL-function of component of Camellia defined in RFC 3713.\n   20 | pub(crate) fn fl(input: u64, key: u64) -> u64 {\n   21 |     let mut x1 = u32::try_from(input >> 32).unwrap();","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/camellia/src/utils.rs#L19-L21"},{"ref":"camellia/src/utils.rs:33-35","code":"   33 | /// FLINV-function of component of Camellia defined in RFC 3713.\n   34 | pub(crate) fn flinv(input: u64, key: u64) -> u64 {\n   35 |     let mut y1 = u32::try_from(input >> 32).unwrap();","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/camellia/src/utils.rs#L33-L35"}]},
{"id":"PERF_12","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`fl` and `flinv` split a `u64` into two `u32` halves with `u32::try_from(..).unwrap()` eight times in\ntotal. Both conversions are infallible by construction (`input >> 32` and `input & 0xffff_ffff` are\nalways `< 2^32`), so these are eight `unwrap` call sites - and hence eight nominal panic paths - that\na reader of cryptographic code has to prove unreachable, plus `TryFrom` machinery the optimizer has\nto see through. `as u32` is exact here and expresses the intent directly.","fix":"Before:\n\n```rust\nlet mut x1 = u32::try_from(input >> 32).unwrap();\nlet mut x2 = u32::try_from(input & 0xffff_ffff).unwrap();\n\nlet k1 = u32::try_from(key >> 32).unwrap();\nlet k2 = u32::try_from(key & 0xffff_ffff).unwrap();\n```\n\nAfter:\n\n```rust\nlet mut x1 = (input >> 32) as u32;\nlet mut x2 = input as u32;\n\nlet k1 = (key >> 32) as u32;\nlet k2 = key as u32;\n```\n\nApply the same change to the `y1`/`y2`/`k1`/`k2` bindings in `flinv`.","locations":[{"ref":"camellia/src/utils.rs:21-25","code":"   21 |     let mut x1 = u32::try_from(input >> 32).unwrap();\n   22 |     let mut x2 = u32::try_from(input & 0xffff_ffff).unwrap();\n   23 | \n   24 |     let k1 = u32::try_from(key >> 32).unwrap();\n   25 |     let k2 = u32::try_from(key & 0xffff_ffff).unwrap();","lines":5,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/camellia/src/utils.rs#L21-L25"},{"ref":"camellia/src/utils.rs:35-39","code":"   35 |     let mut y1 = u32::try_from(input >> 32).unwrap();\n   36 |     let mut y2 = u32::try_from(input & 0xffff_ffff).unwrap();\n   37 | \n   38 |     let k1 = u32::try_from(key >> 32).unwrap();\n   39 |     let k2 = u32::try_from(key & 0xffff_ffff).unwrap();","lines":5,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/camellia/src/utils.rs#L35-L39"}]},
{"id":"PERF_13","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`Cast5::encrypt_block` and `Cast5::decrypt_block` start by copying the cipher state **by value** out\nof `&self` - `let masking = self.masking;` copies 64 bytes and `let rotate = self.rotate;` copies 16\nbytes - on every single 8-byte block. Nothing mutates the copies, so the copy is pure overhead\n(80 bytes of stack traffic per 8 bytes of data in the worst case; whether LLVM manages to SROA it\naway depends on the optimization level and is not something a hot block-cipher path should rely on).\n`cast6/src/lib.rs` gets this right with `let masking = &self.masking;`, so the two sibling crates are\nalso inconsistent.","fix":"Before (in both `encrypt_block` and `decrypt_block`):\n\n```rust\nlet masking = self.masking;\nlet rotate = self.rotate;\n```\n\nAfter (matching `cast6`):\n\n```rust\nlet masking = &self.masking;\nlet rotate = &self.rotate;\n```\n\nThe `f1!`/`f2!`/`f3!` invocations index these with `masking[0]` / `rotate[0]`, which auto-derefs, so\nno other change is needed.","locations":[{"ref":"cast5/src/lib.rs:178-180","code":"  178 |     fn encrypt_block(&self, mut block: InOut<'_, '_, Block<Self>>) {\n  179 |         let masking = self.masking;\n  180 |         let rotate = self.rotate;","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/cast5/src/lib.rs#L178-L180"},{"ref":"cast5/src/lib.rs:236-238","code":"  236 |     fn decrypt_block(&self, mut block: InOut<'_, '_, Block<Self>>) {\n  237 |         let masking = self.masking;\n  238 |         let rotate = self.rotate;","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/cast5/src/lib.rs#L236-L238"}]},
{"id":"PERF_14","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`cast5::schedule::key_schedule` is marked `#[inline]` but is a ~180-line straight-line function\ncontaining about 160 S-box lookups, and `Cast5::key_schedule` calls it twice. Honouring the hint\nduplicates the entire body into both call sites, roughly doubling the code size of the key schedule\nfor no benefit - key setup is not the hot path (it runs once per key, versus once per block for\n`encrypt_block`), and there are no generic parameters or small-body wins to unlock. Contrast\n`cast6/src/lib.rs`, where `#[inline]` is applied only to the genuinely tiny `forward_quad`,\n`reverse_quad` and `forward_octave` helpers.","fix":"Before:\n\n```rust\n#[inline]\npub fn key_schedule(x: &mut [u32], z: &mut [u32], k: &mut [u32]) {\n```\n\nAfter (drop the attribute and let the compiler decide):\n\n```rust\npub(crate) fn key_schedule(x: &mut [u32; 4], z: &mut [u32; 4], k: &mut [u32; 16]) {\n```","locations":[{"ref":"cast5/src/schedule.rs:9-10","code":"    9 | #[inline]\n   10 | pub fn key_schedule(x: &mut [u32], z: &mut [u32], k: &mut [u32]) {","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/cast5/src/schedule.rs#L9-L10"}]},
{"id":"PERF_15","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`Des::encrypt` and `Des::decrypt` carry no `#[inline]`, even though they are the per-block hot path and are called *three times per block* from another module (`des/src/tdes.rs`) by all four TDES variants. Every other function on the block path in this crate is marked `#[inline]` (`Des::encrypt_block`, `encrypt_with_backend`, and the TDES equivalents). Without the attribute, cross-CGU inlining is not guaranteed under the default `codegen-units` setting, so each 3DES block can pay three real call plus 16-iteration-loop setups. The `pub(crate)` helpers `round`, `ip` and `fp` in `utils.rs` are likewise un-annotated and are called across the module boundary.","fix":"Add `#[inline]` to `Des::encrypt` and `Des::decrypt`:\n\nbefore\n```rust\nimpl Des {\n    pub(crate) fn encrypt(&self, mut data: u64) -> u64 {\n```\nafter\n```rust\nimpl Des {\n    #[inline]\n    pub(crate) fn encrypt(&self, mut data: u64) -> u64 {\n```\n\nand likewise for `decrypt`, plus `#[inline]` on `pub(crate) fn round`, `fn ip` and `fn fp` in\n`des/src/utils.rs`.","locations":[{"ref":"des/src/des.rs:24-40","code":"   24 | impl Des {\n   25 |     pub(crate) fn encrypt(&self, mut data: u64) -> u64 {\n   26 |         data = ip(data);\n   27 |         for key in &self.keys {\n   28 |             data = round(data, *key);\n   29 |         }\n   30 |         fp(data.rotate_right(32))\n   31 |     }\n   32 | \n   33 |     pub(crate) fn decrypt(&self, mut data: u64) -> u64 {\n   34 |         data = ip(data);\n   35 |         for key in self.keys.iter().rev() {\n   36 |             data = round(data, *key);\n   37 |         }\n   38 |         fp(data.rotate_right(32))\n   39 |     }\n   40 | }","lines":17,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/des/src/des.rs#L24-L40"},{"ref":"des/src/utils.rs:128-133","code":"  128 | pub(crate) fn round(input: u64, key: u64) -> u64 {\n  129 |     let l = input & (0xFFFF_FFFF << 32);\n  130 |     let r = input << 32;\n  131 | \n  132 |     r | ((f(r, key) ^ l) >> 32)\n  133 | }","lines":6,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/des/src/utils.rs#L128-L133"},{"ref":"des/src/utils.rs:44-59","code":"   44 | pub(crate) fn fp(mut message: u64) -> u64 {\n   45 |     message = delta_swap(message, 24, 0x000000FF000000FF);\n   46 |     message = delta_swap(message, 24, 0x00000000FF00FF00);\n   47 |     message = delta_swap(message, 36, 0x000000000F0F0F0F);\n   48 |     message = delta_swap(message, 18, 0x0000333300003333);\n   49 |     delta_swap(message, 9, 0x0055005500550055)\n   50 | }\n   51 | \n   52 | /// Swap bits using the IP table\n   53 | pub(crate) fn ip(mut message: u64) -> u64 {\n   54 |     message = delta_swap(message, 9, 0x0055005500550055);\n   55 |     message = delta_swap(message, 18, 0x0000333300003333);\n   56 |     message = delta_swap(message, 36, 0x000000000F0F0F0F);\n   57 |     message = delta_swap(message, 24, 0x00000000FF00FF00);\n   58 |     delta_swap(message, 24, 0x000000FF000000FF)\n   59 | }","lines":16,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/des/src/utils.rs#L44-L59"}]},
{"id":"PERF_16","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"The GIFT round primitives take unbounded slices where the lengths are statically known, so every access carries a bounds check and a panic path that the compiler cannot always remove: `packing(state: &mut [u32], ..)` and `unpacking(state: &[u32], ..)` index `state[0..=3]`, `quintuple_round`/`inv_quintuple_round` take `rkey: &[u32]` (indexed `[0..=9]`) and `rconst: &[u32]` (indexed `[0..=4]`), and `u32big(x: &[u8])` indexes `x[0..=3]`. `quintuple_round` already takes `state: &mut [u32; 4]`, so the file is internally inconsistent. Besides the codegen cost this is a latent panic surface: a caller that slices `self.k` or `GIFT_RC` one element short compiles fine and panics at run time inside the cipher instead of being rejected.","fix":"Use fixed-size array references throughout and let the call sites do the (compile-time-checked) slicing:\n\n```rust\npub(crate) fn u32big(x: &[u8; 4]) -> u32 { .. }\npub(crate) fn packing(state: &mut [u32; 4], input: &[u8; 16]) { .. }\npub(crate) fn unpacking(state: &[u32; 4], output: &mut [u8; 16]) { .. }\npub(crate) fn quintuple_round(state: &mut [u32; 4], rkey: &[u32; 10], rconst: &[u32; 5]) { .. }\npub(crate) fn inv_quintuple_round(state: &mut [u32; 4], rkey: &[u32; 10], rconst: &[u32; 5]) { .. }\n```\n\nand in `lib.rs`:\n```rust\nquintuple_round(\n    &mut state,\n    self.k[i * 2..][..10].try_into().unwrap(),\n    GIFT_RC[i..][..5].try_into().unwrap(),\n);\n```\n(or `first_chunk::<10>().unwrap()`), plus `u32big(key[12..16].try_into().unwrap())` in `key_schedule.rs`.","locations":[{"ref":"gift-cipher/src/primitives.rs:92-93","code":"   92 | #[inline]\n   93 | pub(crate) fn packing(state: &mut [u32], input: &[u8; 16]) {","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/gift-cipher/src/primitives.rs#L92-L93"},{"ref":"gift-cipher/src/primitives.rs:130-132","code":
