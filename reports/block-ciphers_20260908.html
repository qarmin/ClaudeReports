self.dk[RK - 2]) ^ self.dk[RK - 1];","lines":11,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aria/src/lib.rs#L116-L126"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"All four ciphers implement `Drop` unconditionally but put the whole body behind\n`#[cfg(feature = \"zeroize\")]`. Without the (non-default) `zeroize` feature these are empty\ndestructors that still give the types drop glue: they cannot be destructured or partially moved\nout of, they can never be `Copy`, and the compiler must emit and thread drop calls for values that\nhave nothing to drop (notably for `Blowfish`, a 4 KiB type).","fix":"Gate the whole impl on the feature instead of its body, e.g.\n```rust\n#[cfg(feature = \"zeroize\")]\nimpl<const RK: usize> Drop for Aria<RK> {\n    fn drop(&mut self) {\n        self.ek.zeroize();\n        self.dk.zeroize();\n    }\n}\n```\nand apply the same change to `BeltBlock`, `Blowfish<T>` and `Camellia<KeySize, RK>`.","locations":[{"ref":"aria/src/lib.rs:132-143","code":"  132 | impl<const RK: usize> Drop for Aria<RK> {\n  133 |     fn drop(&mut self) {\n  134 |         #[cfg(feature = \"zeroize\")]\n  135 |         {\n  136 |             self.ek.zeroize();\n  137 |             self.dk.zeroize();\n  138 |         }\n  139 |     }\n  140 | }\n  141 | \n  142 | #[cfg(feature = \"zeroize\")]\n  143 | impl<const RK: usize> ZeroizeOnDrop for Aria<RK> {}","lines":12,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aria/src/lib.rs#L132-L143"},{"ref":"belt-block/src/cipher_impl.rs:117-125","code":"  117 | impl Drop for BeltBlock {\n  118 |     fn drop(&mut self) {\n  119 |         #[cfg(feature = \"zeroize\")]\n  120 |         self.key.zeroize();\n  121 |     }\n  122 | }\n  123 | \n  124 | #[cfg(feature = \"zeroize\")]\n  125 | impl ZeroizeOnDrop for BeltBlock {}","lines":9,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/belt-block/src/cipher_impl.rs#L117-L125"},{"ref":"blowfish/src/lib.rs:210-221","code":"  210 | impl<T: ByteOrder> Drop for Blowfish<T> {\n  211 |     fn drop(&mut self) {\n  212 |         #[cfg(feature = \"zeroize\")]\n  213 |         {\n  214 |             self.s.zeroize();\n  215 |             self.p.zeroize();\n  216 |         }\n  217 |     }\n  218 | }\n  219 | \n  220 | #[cfg(feature = \"zeroize\")]\n  221 | impl<T: ByteOrder> ZeroizeOnDrop for Blowfish<T> {}","lines":12,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/blowfish/src/lib.rs#L210-L221"},{"ref":"camellia/src/lib.rs:175-183","code":"  175 | impl<KeySize: ArraySize, const RK: usize> Drop for Camellia<KeySize, RK> {\n  176 |     fn drop(&mut self) {\n  177 |         #[cfg(feature = \"zeroize\")]\n  178 |         self.k.zeroize();\n  179 |     }\n  180 | }\n  181 | \n  182 | #[cfg(feature = \"zeroize\")]\n  183 | impl<KeySize: ArraySize, const RK: usize> ZeroizeOnDrop for Camellia<KeySize, RK> {}","lines":9,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/camellia/src/lib.rs#L175-L183"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`Cast5::init_state` exists only to compute a single boolean and then zero-fills `masking` and\n`rotate`, both of which are unconditionally and completely overwritten by the immediately following\n`cast5.key_schedule(..)` call. The zero-initialization is dead stores (80 bytes), and the helper adds\nan indirection plus a stale-looking name (\"init_state\" suggests it initializes the round keys, which\nit does not). It also returns `Cast5` rather than `Self`.","fix":"Delete `init_state` and inline it into `new_from_slice`:\n\n```rust\nfn new_from_slice(key: &[u8]) -> Result<Self, InvalidLength> {\n    // Available key sizes are 40...128 bits.\n    if key.len() < 5 || key.len() > 16 {\n        return Err(InvalidLength);\n    }\n    let mut cast5 = Self {\n        masking: [0u32; 16],\n        rotate: [0u8; 16],\n        // RFC 2144: keys of 80 bits or less use 12 rounds instead of 16.\n        small_key: key.len() <= 10,\n    };\n    let mut padded_key = [0u8; 16];\n    padded_key[..key.len()].copy_from_slice(key);\n    cast5.key_schedule(&padded_key);\n    Ok(cast5)\n}\n```","locations":[{"ref":"cast5/src/lib.rs:70-79","code":"   70 | impl Cast5 {\n   71 |     fn init_state(key_len: usize) -> Cast5 {\n   72 |         let small_key = key_len <= 10;\n   73 | \n   74 |         Cast5 {\n   75 |             masking: [0u32; 16],\n   76 |             rotate: [0u8; 16],\n   77 |             small_key,\n   78 |         }\n   79 |     }","lines":10,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/cast5/src/lib.rs#L70-L79"},{"ref":"cast5/src/lib.rs:147-157","code":"  147 |         let mut cast5 = Cast5::init_state(key.len());\n  148 | \n  149 |         if key.len() < 16 {\n  150 |             // Pad keys that are less than 128 bits long.\n  151 |             let mut padded_key = [0u8; 16];\n  152 |             padded_key[..key.len()].copy_from_slice(key);\n  153 |             cast5.key_schedule(&padded_key[..]);\n  154 |         } else {\n  155 |             cast5.key_schedule(key);\n  156 |         }\n  157 |         Ok(cast5)","lines":11,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/cast5/src/lib.rs#L147-L157"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"`impl Drop for Cast5` and `impl Drop for Cast6` are compiled unconditionally, but their bodies are\nentirely inside `#[cfg(feature = \"zeroize\")]`. Without the feature each is an empty `drop`, which is\ndead code that still has real costs: a type with a `Drop` impl can never be partially moved out of or\ndestructured, drop glue is threaded through every enclosing type, and `const`-ness/`Copy`-ness options\nare permanently closed off. Gating the whole `impl` is both clearer and cheaper.","fix":"Before:\n\n```rust\nimpl Drop for Cast6 {\n    fn drop(&mut self) {\n        #[cfg(feature = \"zeroize\")]\n        {\n            self.masking.zeroize();\n            self.rotate.zeroize();\n        }\n    }\n}\n```\n\nAfter:\n\n```rust\n#[cfg(feature = \"zeroize\")]\nimpl Drop for Cast6 {\n    fn drop(&mut self) {\n        self.masking.zeroize();\n        self.rotate.zeroize();\n    }\n}\n```\n\nSame for `Cast5` (where the body also zeroizes the `small_key` bool, which carries no secret and can\nbe dropped from the list).","locations":[{"ref":"cast5/src/lib.rs:284-293","code":"  284 | impl Drop for Cast5 {\n  285 |     fn drop(&mut self) {\n  286 |         #[cfg(feature = \"zeroize\")]\n  287 |         {\n  288 |             self.masking.zeroize();\n  289 |             self.rotate.zeroize();\n  290 |             self.small_key.zeroize();\n  291 |         }\n  292 |     }\n  293 | }","lines":10,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/cast5/src/lib.rs#L284-L293"},{"ref":"cast6/src/lib.rs:297-305","code":"  297 | impl Drop for Cast6 {\n  298 |     fn drop(&mut self) {\n  299 |         #[cfg(feature = \"zeroize\")]\n  300 |         {\n  301 |             self.masking.zeroize();\n  302 |             self.rotate.zeroize();\n  303 |         }\n  304 |     }\n  305 | }","lines":9,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/cast6/src/lib.rs#L297-L305"}]},
{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"Both crates enable `#![cfg_attr(docsrs, feature(doc_cfg))]` but never use a `#[doc(cfg(..))]` attribute anywhere, so the nightly feature gate is dead. The practical consequence is that the `zeroize`-gated items (`impl ZeroizeOnDrop`) show up on docs.rs with no indication that they require a non-default feature, which is exactly what `doc_cfg` was enabled for.","fix":"Either drop the `cfg_attr(docsrs, feature(doc_cfg))` line, or annotate the feature-gated impls:\n```rust\n#[cfg(feature = \"zeroize\")]\n#[cfg_attr(docsrs, doc(cfg(feature = \"zeroize\")))]\nimpl ZeroizeOnDrop for Kuznyechik {}\n```","locations":[{"ref":"idea/src/lib.rs:19-20","code":"   19 | #![cfg_attr(docsrs, feature(doc_cfg))]\n   20 | #![warn(missing_docs, rust_2018_idioms)]","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/idea/src/lib.rs#L19-L20"},{"ref":"idea/src/lib.rs:261-262","code":"  261 | #[cfg(feature = \"zeroize\")]\n  262 | impl ZeroizeOnDrop for Idea {}","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/idea/src/lib.rs#L261-L262"},{"ref":"kuznyechik/src/lib.rs:30-32","code":"   30 | #![cfg_attr(docsrs, feature(doc_cfg))]\n   31 | #![warn(missing_docs, rust_2018_idioms)]\n   32 | #![allow(clippy::needless_range_loop, clippy::transmute_ptr_to_ptr)]","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/lib.rs#L30-L32"},{"ref":"kuznyechik/src/lib.rs:145-146","code":"  145 | #[cfg(feature = \"zeroize\")]\n  146 | impl ZeroizeOnDrop for Kuznyechik {}","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/lib.rs#L145-L146"}]},
{"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`mul`, `add`, `mul_inv` and `add_inv` are all declared as methods taking `&self`, but none of them reads any field of `Idea`. Besides being what `clippy::unused_self` flags, the needless receiver prevents them from being `const fn` and forces every call site to be written as `self.mul(..)`, which makes the round function read as if it depended on cipher state.","fix":"Turn them into free associated functions and mark them `#[inline]`, e.g.\n\nBefore:\n```rust\nfn add(&self, a: u16, b: u16) -> u16 {\n```\nAfter:\n```rust\n#[inline(always)]\nconst fn add(a: u16, b: u16) -> u16 {\n```\nand update the call sites in `crypt` / `invert_sub_keys` from `self.add(x, y)` to `Self::add(x, y)`.","locations":[{"ref":"idea/src/lib.rs:135-137","code":"  135 |     fn mul(&self, a: u16, b: u16) -> u16 {\n  136 |         let x = u32::from(a);\n  137 |         let y = u32::from(b);","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/idea/src/lib.rs#L135-L137"},{"ref":"idea/src/lib.rs:155-157","code":"  155 |     fn add(&self, a: u16, b: u16) -> u16 {\n  156 |         ((u32::from(a) + u32::from(b)) & ONE) as u16\n  157 |     }","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/idea/src/lib.rs#L155-L157"},{"ref":"idea/src/lib.rs:159-161","code":"  159 |     fn mul_inv(&self, a: u16) -> u16 {\n  160 |         if a <= 1 {\n  161 |             a","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/idea/src/lib.rs#L159-L161"},{"ref":"idea/src/lib.rs:182-184","code":"  182 |     fn add_inv(&self, a: u16) -> u16 {\n  183 |         ((FUYI - (u32::from(a))) & ONE) as u16\n  184 |     }","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/idea/src/lib.rs#L182-L184"}]},
{"id":"DEAD_7","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"Both crates implement `Drop` unconditionally and put the `#[cfg(feature = \"zeroize\")]` *inside* the method body, so with the default feature set the compiler sees a `Drop` impl with an empty body. An empty `Drop` impl is not free: it makes the type ineligible for partial moves and for some optimisations, and it is precisely why `From<KuznyechikEnc> for Kuznyechik` has to `enc.keys.clone()` instead of moving the round keys out of the consumed value.","fix":"Gate the whole impl instead of its body:\n\nBefore:\n```rust\nimpl Drop for Kuznyechik {\n    fn drop(&mut self) {\n        #[cfg(feature = \"zeroize\")]\n        unsafe {\n            cipher::zeroize::zeroize_flat_type(self)\n        }\n    }\n}\n```\nAfter:\n```rust\n#[cfg(feature = \"zeroize\")]\nimpl Drop for Kuznyechik {\n    fn drop(&mut self) {\n        unsafe { cipher::zeroize::zeroize_flat_type(self) }\n    }\n}\n```","locations":[{"ref":"idea/src/lib.rs:251-259","code":"  251 | impl Drop for Idea {\n  252 |     fn drop(&mut self) {\n  253 |         #[cfg(feature = \"zeroize\")]\n  254 |         {\n  255 |             self.enc_keys.zeroize();\n  256 |             self.dec_keys.zeroize();\n  257 |         }\n  258 |     }\n  259 | }","lines":9,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/idea/src/lib.rs#L251-L259"},{"ref":"kuznyechik/src/lib.rs:136-143","code":"  136 | impl Drop for Kuznyechik {\n  137 |     fn drop(&mut self) {\n  138 |         #[cfg(feature = \"zeroize\")]\n  139 |         unsafe {\n  140 |             cipher::zeroize::zeroize_flat_type(self)\n  141 |         }\n  142 |     }\n  143 | }","lines":8,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/lib.rs#L136-L143"},{"ref":"kuznyechik/src/lib.rs:181-188","code":"  181 | impl Drop for KuznyechikEnc {\n  182 |     fn drop(&mut self) {\n  183 |         #[cfg(feature = \"zeroize\")]\n  184 |         unsafe {\n  185 |             cipher::zeroize::zeroize_flat_type(self)\n  186 |         }\n  187 |     }\n  188 | }","lines":8,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/lib.rs#L181-L188"},{"ref":"kuznyechik/src/lib.rs:243-250","code":"  243 | impl Drop for KuznyechikDec {\n  244 |     fn drop(&mut self) {\n  245 |         #[cfg(feature = \"zeroize\")]\n  246 |         unsafe {\n  247 |             zeroize_flat_type(self)\n  248 |         }\n  249 |     }\n  250 | }","lines":8,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/lib.rs#L243-L250"}]},
{"id":"DEAD_8","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`#![allow(clippy::transmute_ptr_to_ptr)]` at the crate root suppresses a lint that cannot fire: there is no `transmute` anywhere in the crate (`grep -rn transmute kuznyechik/` matches only this `allow`). It is leftover from an earlier implementation of the table cast, and a stale blanket `allow` in a crate full of raw-pointer casts is worth removing so that a future reintroduction of `transmute` is linted again.","fix":"Before:\n```rust\n#![allow(clippy::needless_range_loop, clippy::transmute_ptr_to_ptr)]\n```\nAfter:\n```rust\n#![allow(clippy::needless_range_loop)]\n```","locations":[{"ref":"kuznyechik/src/lib.rs:32","code":"   32 | #![allow(clippy::needless_range_loop, clippy::transmute_ptr_to_ptr)]","lines":1,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/lib.rs#L32"}]},
{"id":"DEAD_9","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"`Drop` is implemented unconditionally, but its whole body is behind `#[cfg(feature = \"zeroize\")]`, so\nwithout that feature these types get an empty `Drop` impl. That is dead code which also has side effects:\nthe types become non-destructurable, `mem::needs_drop` reports `true`, and drop glue is emitted for\notherwise trivially-droppable values. `RC5`'s version additionally has to carry a copy of the full 15-line\n`where` clause purely to satisfy Rust's \"same bounds as the struct\" rule for `Drop`.","fix":"Gate the impl itself, e.g.\n```rust\n#[cfg(feature = \"zeroize\")]\nimpl Drop for Rc2 {\n    fn drop(&mut self) {\n        self.keys.zeroize();\n    }\n}\n```\nand likewise for `Gost89<S>` and `RC5<W, R, B>`.","locations":[{"ref":"rc5/src/lib.rs:481-500","code":"  481 | impl<W, R, B> Drop for RC5<W, R, B>\n  482 | where\n  483 |     W: Word,\n  484 |     // Block size\n  485 |     W::Bytes: Mul<U2>,\n  486 |     BlockSize<W>: ArraySize,\n  487 |     // Rounds range\n  488 |     R: Unsigned,\n  489 |     R: IsLess<U256>,\n  490 |     Le<R, U256>: NonZero,\n  491 |     // ExpandedKeyTableSize\n  492 |     R: Add<U1>,\n  493 |     Sum<R, U1>: Mul<U2>,\n  494 |     ExpandedKeyTableSize<R>: ArraySize,\n  495 | {\n  496 |     fn drop(&mut self) {\n  497 |         #[cfg(feature = \"zeroize\")]\n  498 |         self.key_table.zeroize()\n  499 |     }\n  500 | }","lines":20,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc5/src/lib.rs#L481-L500"},{"ref":"rc2/src/lib.rs:265-270","code":"  265 | impl Drop for Rc2 {\n  266 |     fn drop(&mut self) {\n  267 |         #[cfg(feature = \"zeroize\")]\n  268 |         self.keys.zeroize();\n  269 |     }\n  270 | }","lines":6,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc2/src/lib.rs#L265-L270"},{"ref":"magma/src/lib.rs:185-190","code":"  185 | impl<S: Sbox> Drop for Gost89<S> {\n  186 |     fn drop(&mut self) {\n  187 |         #[cfg(feature = \"zeroize\")]\n  188 |         self.key.zeroize();\n  189 |     }\n  190 | }","lines":6,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/magma/src/lib.rs#L185-L190"}]},
{"id":"DEAD_10","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`threefish` guards its zeroization with `#[cfg(all(feature = \"zeroize\"))]` in two places. The `all(...)` wrapper around a single predicate does nothing and is leftover noise from a multi-predicate `cfg`; every other crate in the workspace writes plain `#[cfg(feature = \"zeroize\")]`.","fix":"Before:\n```rust\n#[cfg(all(feature = \"zeroize\"))]\nself.sk.zeroize();\n```\nAfter:\n```rust\n#[cfg(feature = \"zeroize\")]\nself.sk.zeroize();\n```\nApply the same change to the `#[cfg(all(feature = \"zeroize\"))] impl ZeroizeOnDrop for $name {}` line.","locations":[{"ref":"threefish/src/lib.rs:253-261","code":"  253 |         impl Drop for $name {\n  254 |             fn drop(&mut self) {\n  255 |                 #[cfg(all(feature = \"zeroize\"))]\n  256 |                 self.sk.zeroize();\n  257 |             }\n  258 |         }\n  259 | \n  260 |         #[cfg(all(feature = \"zeroize\"))]\n  261 |         impl ZeroizeOnDrop for $name {}","lines":9,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/threefish/src/lib.rs#L253-L261"}]},
{"id":"DEAD_11","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`Twofish::drop` zeroizes `self.start`, which is not secret: it is derived solely from the *public* key length\n(`0`, `1` or `2` for 32-, 24- and 16-byte keys). Overwriting it accomplishes nothing while suggesting to a\nreader that it is sensitive.","fix":"Before:\n```rust\n        #[cfg(feature = \"zeroize\")]\n        {\n            self.s.zeroize();\n            self.k.zeroize();\n            self.start.zeroize();\n        }\n```\nAfter:\n```rust\n        #[cfg(feature = \"zeroize\")]\n        {\n            self.s.zeroize();\n            self.k.zeroize();\n        }\n```","locations":[{"ref":"twofish/src/lib.rs:321-329","code":"  321 | impl Drop for Twofish {\n  322 |     fn drop(&mut self) {\n  323 |         #[cfg(feature = \"zeroize\")]\n  324 |         {\n  325 |             self.s.zeroize();\n  326 |             self.k.zeroize();\n  327 |             self.start.zeroize();\n  328 |         }\n  329 |     }","lines":9,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/twofish/src/lib.rs#L321-L329"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"medium","difficulty":"easy","description":"The `## x86/x86_64 intrinsics (AES-NI and VAES)` section claims \"By default this crate uses runtime\ndetection on `i686`/`x86_64` targets in order to determine if AES-NI **and VAES** are available\".\nThat is false: `aes/src/backends.rs` only compiles `x86_vaes256`/`x86_vaes512` under\n`aes_backend = \"avx256\"`/`\"avx512\"`, and `aes/src/lib.rs` only creates the `features_vaes256`/\n`features_vaes512` tokens under the same cfgs, so in a default build VAES is never detected nor\nused. The `# Configuration Flags` list is misleading in the opposite direction, describing `avx256`\nas \"force AVX2 backend\" and `avx512` as \"force AVX-512 backend\": neither *forces* anything (both\nstill runtime-detect and fall back to AES-NI/soft), and neither is satisfied by AVX2 or AVX-512F\nalone - both additionally require the `vaes` CPU feature.","fix":"Rewrite lines 38-41 as \"By default this crate uses runtime detection on `i686`/`x86_64` targets to\ndetermine if AES-NI is available, and if it is not, it falls back to a constant-time software\nimplementation. The VAES backends are opt-in via `--cfg aes_backend=\"avx256\"` /\n`--cfg aes_backend=\"avx512\"`; once enabled they too are runtime-detected.\" and change the flag list\nto:\n```text\n//! - `aes_backend`: explicitly select one of the following backends:\n//!   - `soft`: force software backend\n//!   - `avx256`: additionally enable the runtime-detected VAES + AVX2 backend\n//!   - `avx512`: additionally enable the runtime-detected VAES + AVX-512 backend\n```","locations":[{"ref":"aes/src/lib.rs:38-49","code":"   38 | //! ## `x86`/`x86_64` intrinsics (AES-NI and VAES)\n   39 | //! By default this crate uses runtime detection on `i686`/`x86_64` targets\n   40 | //! in order to determine if AES-NI and VAES are available, and if they are\n   41 | //! not, it will fallback to using a constant-time software implementation.\n   42 | //!\n   43 | //! Passing `RUSTFLAGS=-Ctarget-feature=+aes,+ssse3` explicitly at\n   44 | //! compile-time will override runtime detection and ensure that AES-NI is\n   45 | //! used or passing `RUSTFLAGS=-Ctarget-feature=+aes,+avx512f,+ssse3,+vaes`\n   46 | //! will ensure that AESNI and VAES are always used.\n   47 | //!\n   48 | //! Note: Enabling VAES256 or VAES512 still requires specifying `--cfg\n   49 | //! aes_backend = \"avx256\"` or `--cfg aes_backend = \"avx512\"` explicitly.","lines":12,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/lib.rs#L38-L49"},{"ref":"aes/src/lib.rs:105-108","code":"  105 | //! - `aes_backend`: explicitly select one of the following backends:\n  106 | //!   - `soft`: force software backend\n  107 | //!   - `avx256`: force AVX2 backend\n  108 | //!   - `avx512`: force AVX-512 backend","lines":4,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/lib.rs#L105-L108"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"medium","difficulty":"easy","description":"The two initialisation comments in the RC6 key schedule are swapped, and each states the\nopposite of the truth. `key_into_words` is annotated `// can be uninitialized`, but its\nvery first statement *reads* the array (`key_as_words[i / W::Bytes::USIZE].rotate_left(W::EIGHT)`),\nso a non-zero starting value feeds into the result and the array **must** be zero\ninitialised. Conversely `initialize_expanded_key_table` is annotated\n`// must be zero initialized`, yet it writes `[0] = W::P` and then every remaining slot\nfrom its predecessor without ever reading a pre-existing value, so it genuinely **could**\nbe uninitialised. The adjacent claim `// no need for wrapping addition since we are adding\na byte sized uint onto an uint with its lsb byte zeroed` is also only valid *because* the\narray starts at zero (and for `W = u8`, where `rotate_left(8)` is the identity, the \"lsb\nbyte zeroed\" reasoning does not hold at all - correctness there relies purely on the zero\nstart plus one byte per word). A future reader acting on `// can be uninitialized` (e.g.\nswitching to `MaybeUninit`) would silently break the key schedule. The same swapped pair\nappears verbatim in `rc5/src/lib.rs:98-121`.","fix":"Swap and correct the comments, and drop the needless `Array::from_fn(|_| W::ZERO)` in\nfavour of `Array::default()`:\n\n```rust\nfn key_into_words(key: &Key<B>) -> KeyAsWords<W, B> {\n    // MUST be zero initialized: the first read of each slot feeds into the result,\n    // which is also what makes the plain `+` below non-overflowing.\n    let mut key_as_words: Array<W, KeyAsWordsSize<W, B>> = Array::default();\n    ...\n}\n\nfn initialize_expanded_key_table() -> ExpandedKeyTable<W, R> {\n    // every element is overwritten below, so the initial value is irrelevant\n    let mut expanded_key_table: Array<W, ExpandedKeyTableSize<R>> = Array::default();\n    ...\n}\n```\n\nApply the same fix in `rc5/src/lib.rs`.","locations":[{"ref":"rc6/src/core/backend.rs:69-92","code":"   69 |     fn key_into_words(key: &Key<B>) -> KeyAsWords<W, B> {\n   70 |         // can be uninitialized\n   71 |         let mut key_as_words: Array<W, KeyAsWordsSize<W, B>> = Array::default();\n   72 | \n   73 |         for i in (0..B::USIZE).rev() {\n   74 |             key_as_words[i / W::Bytes::USIZE] =\n   75 |                 key_as_words[i / W::Bytes::USIZE].rotate_left(W::EIGHT) + key[i].into();\n   76 |             // no need for wrapping addition since we are adding a byte sized uint onto an uint with its lsb byte zeroed\n   77 |         }\n   78 | \n   79 |         key_as_words\n   80 |     }\n   81 | \n   82 |     fn initialize_expanded_key_table() -> ExpandedKeyTable<W, R> {\n   83 |         // must be zero initialized\n   84 |         let mut expanded_key_table: Array<W, ExpandedKeyTableSize<R>> = Array::from_fn(|_| W::ZERO);\n   85 | \n   86 |         expanded_key_table[0] = W::P;\n   87 |         for i in 1..expanded_key_table.len() {\n   88 |             expanded_key_table[i] = expanded_key_table[i - 1].wrapping_add(W::Q);\n   89 |         }\n   90 | \n   91 |         expanded_key_table\n   92 |     }","lines":24,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc6/src/core/backend.rs#L69-L92"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"The root `README.md` states flatly that \"Other crates in this repository are not implemented in a constant-time manner\", which overstates what the code shows and contradicts the per-crate READMEs. `serpent` is a fully bitsliced implementation whose S-boxes are `const fn`s built from boolean operations on words (`serpent/src/bitslice.rs`), with no table lookups and no secret-dependent branches; `xtea`, `threefish` and `speck-cipher` are pure ARX designs - `xtea`'s only array index is `self.k[(sum & 3) as usize]`, where `sum` is a function of the public round counter, not of the key or plaintext. Each crate's own README uses the accurate weaker wording (\"has not been thoroughly assessed to ensure its operation is constant-time\"), so the root README makes a stronger claim than the sub-READMEs and than the implementations warrant.","fix":"Reword the paragraph to match the per-crate READMEs, e.g. \"Only the `aes` crate has received a third-party security audit and is explicitly implemented to be constant-time. The other crates in this repository have not been thoroughly assessed to ensure their operation is constant-time on common CPU architectures; several of them (for example `des`, `blowfish`, `camellia`, `kuznyechik`, `sm4`, `twofish`) use secret-dependent table lookups.\"","locations":[{"ref":"README.md:25-33","code":"   25 | ## Warnings\n   26 | \n   27 | Currently only the `aes` crate provides constant-time implementation and has received a third-party security audit.\n   28 | \n   29 | Other crates in this repository are not implemented in a constant-time manner and have not yet received any formal cryptographic and security reviews.\n   30 | \n   31 | It's generally recommended not to use other cipher implementations in this repository besides the `aes` crate.\n   32 | \n   33 | **USE AT YOUR OWN RISK.**","lines":9,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/README.md#L25-L33"},{"ref":"serpent/src/bitslice.rs:77-100","code":"   77 | const fn sbox_e0([mut w1, mut w2, mut w3, mut w4]: Words) -> Words {\n   78 |     w4 ^= w1;\n   79 |     let mut t0 = w2;\n   80 |     w2 &= w4;\n   81 |     t0 ^= w3;\n   82 |     w2 ^= w1;\n   83 |     w1 |= w4;\n   84 |     w1 ^= t0;\n   85 |     t0 ^= w4;\n   86 |     w4 ^= w3;\n   87 |     w3 |= w2;\n   88 |     w3 ^= t0;\n   89 |     t0 = !t0;\n   90 |     t0 |= w2;\n   91 |     w2 ^= w4;\n   92 |     w2 ^= t0;\n   93 |     w4 |= w1;\n   94 |     w2 ^= w4;\n   95 |     t0 ^= w4;\n   96 |     [w2, t0, w3, w1]\n   97 | }\n   98 | \n   99 | #[inline]\n  100 | const fn sbox_e1([mut w1, mut w2, mut w3, mut w4]: Words) -> Words {","lines":24,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/serpent/src/bitslice.rs#L77-L100"},{"ref":"xtea/src/lib.rs:90-100","code":"   90 |         for _ in 0..8 {\n   91 |             v0 = v0.wrapping_add(\n   92 |                 (((v1 << 4) ^ (v1 >> 5)).wrapping_add(v1))\n   93 |                     ^ sum.wrapping_add(self.k[(sum & 3) as usize]),\n   94 |             );\n   95 |             sum = sum.wrapping_add(DELTA);\n   96 |             v1 = v1.wrapping_add(\n   97 |                 (((v0 << 4) ^ (v0 >> 5)).wrapping_add(v0))\n   98 |                     ^ sum.wrapping_add(self.k[((sum >> 11) & 3) as usize]),\n   99 |             );\n  100 |         }","lines":11,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/xtea/src/lib.rs#L90-L100"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The comment `// Loop is intentionally not used here to enforce inlining` above the unrolled\n`par_round` calls does not describe what the code does. Nothing about unrolling the *caller* forces\n`par_round` to be inlined: `par_round` carries no `#[inline]` attribute at all, and\n`#[inline(always)]` cannot even be applied to it because rustc rejects\n`#[inline(always)]` combined with `#[target_feature]` (`error: cannot use #[inline(always)] with\n#[target_feature]`, rust-lang/rust#145574). A plain `for &key in &keys[..KEYS - 2]` loop compiles\nto identical code, so the stated rationale is simply wrong and misleads future maintainers into\npreserving the unrolled form.","fix":"Delete the comment (and the unrolling, see the related finding). If some form of unrolling is kept\nfor a measured reason, replace the comment with the actual reason, e.g.\n`// Unrolled because ...`. Before: `// Loop is intentionally not used here to enforce inlining`.\nAfter: remove the line.","locations":[{"ref":"aes/src/backends/aarch64_aes/encdec.rs:103","code":"  103 |     // Loop is intentionally not used here to enforce inlining","lines":1,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends/aarch64_aes/encdec.rs#L103"},{"ref":"aes/src/backends/aarch64_aes/encdec.rs:103","code":"  103 |     // Loop is intentionally not used here to enforce inlining","lines":1,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends/aarch64_aes/encdec.rs#L103"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"All six `encrypt`/`decrypt` functions in the fixslice backend are documented as\n`Encrypts four blocks in-place and in parallel.` / `Decrypts four blocks in-place and in parallel.`\nBoth halves of that sentence are false. The batch size is `<W as Word>::Blocks`, which is `U2` for\n`W = u32` and `U4` for `W = u64`, so it is two blocks on 32-bit targets; and the functions are not\nin-place - they take `blocks: &BatchBlocks<W>` and *return* a fresh `BatchBlocks<W>`. The\naccompanying line `(the ShiftRows is completely omitted)` plus the `Fully-fixsliced` label are also\nwrong when built with `--cfg aes_backend_soft=\"compact\"`, where the very same function calls\n`shift_rows_2`/`inv_shift_rows_2` and implements semi-fixslicing.","fix":"Replace each pair of doc lines with something that matches the signature and the `cfg`, e.g. for\n`aes128::encrypt`:\n```rust\n/// Fixsliced AES-128 encryption (semi-fixsliced under `aes_backend_soft = \"compact\"`).\n///\n/// Encrypts `<W as Word>::Blocks` blocks in parallel, returning the ciphertext batch.\n```","locations":[{"ref":"aes/src/backends/fixslice/aes128.rs:57-59","code":"   57 | /// Fully-fixsliced AES-128 encryption (the ShiftRows is completely omitted).\n   58 | ///\n   59 | /// Encrypts four blocks in-place and in parallel.","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends/fixslice/aes128.rs#L57-L59"},{"ref":"aes/src/backends/fixslice/aes128.rs:113-115","code":"  113 | /// Fully-fixsliced AES-128 decryption (the InvShiftRows is completely omitted).\n  114 | ///\n  115 | /// Decrypts four blocks in-place and in parallel.","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends/fixslice/aes128.rs#L113-L115"},{"ref":"aes/src/backends/fixslice/aes192.rs:105-107","code":"  105 | /// Fully-fixsliced AES-192 encryption (the ShiftRows is completely omitted).\n  106 | ///\n  107 | /// Encrypts four blocks in-place and in parallel.","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends/fixslice/aes192.rs#L105-L107"},{"ref":"aes/src/backends/fixslice/aes192.rs:155-157","code":"  155 | /// Fully-fixsliced AES-192 decryption (the InvShiftRows is completely omitted).\n  156 | ///\n  157 | /// Decrypts four blocks in-place and in parallel.","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends/fixslice/aes192.rs#L155-L157"},{"ref":"aes/src/backends/fixslice/aes256.rs:65-67","code":"   65 | /// Fully-fixsliced AES-256 encryption (the ShiftRows is completely omitted).\n   66 | ///\n   67 | /// Encrypts four blocks in-place and in parallel.","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends/fixslice/aes256.rs#L65-L67"},{"ref":"aes/src/backends/fixslice/aes256.rs:121-123","code":"  121 | /// Fully-fixsliced AES-256 decryption (the InvShiftRows is completely omitted).\n  122 | ///\n  123 | /// Decrypts four blocks in-place and in parallel.","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends/fixslice/aes256.rs#L121-L123"}]},
{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"In the fixslice hazmat module the two inverse-round wrappers are documented as\n`AES cipher (encrypt) inverse round function.` and\n`AES cipher (encrypt) inverse round function: parallel version.` They implement the *decryption*\n(equivalent inverse cipher) round, as their names `equiv_inv_cipher_round` /\n`equiv_inv_cipher_round_par` and their bodies (`inv_sub_bytes`, `inv_shift_rows_1`,\n`inv_mix_columns_0`) show. The `(encrypt)` label is a copy-paste from the two functions above them;\nthe corresponding `aarch64` and public wrappers correctly say\n`AES equivalent inverse cipher (decrypt) round function`.","fix":"Before: `/// AES cipher (encrypt) inverse round function.` /\n`/// AES cipher (encrypt) inverse round function: parallel version.`\nAfter: `/// AES equivalent inverse cipher (decrypt) round function.` /\n`/// AES equivalent inverse cipher (decrypt) round function: parallel version.`","locations":[{"ref":"aes/src/backends/fixslice/hazmat.rs:116-125","code":"  116 | /// AES cipher (encrypt) inverse round function.\n  117 | #[inline]\n  118 | pub(crate) fn equiv_inv_cipher_round(block: &mut Block, round_key: &Block) {\n  119 |     equiv_inv_cipher_round_generic::<NativeWord>(block, round_key)\n  120 | }\n  121 | \n  122 | /// AES cipher (encrypt) inverse round function: parallel version.\n  123 | #[inline]\n  124 | pub(crate) fn equiv_inv_cipher_round_par(blocks: &mut Block8, round_keys: &Block8) {\n  125 |     equiv_inv_cipher_round_par_generic::<NativeWord>(blocks, round_keys)","lines":10,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends/fixslice/hazmat.rs#L116-L125"}]},
{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The fixslice module header still says `Fixsliced implementations of AES-128, AES-192 and AES-256\n(64-bit)`. The `(64-bit)` qualifier is left over from the old `fixslice64.rs` file; after the\nmachine-word-generic refactor this module is parameterised over the `Word` trait and is instantiated\nwith `u32` (2 blocks per batch) as well as `u64` (4 blocks per batch), selected by\n`cpubits::cpubits!` a few lines below. The header now contradicts the code in the same file.","fix":"Before: `//! Fixsliced implementations of AES-128, AES-192 and AES-256 (64-bit)`.\nAfter: `//! Fixsliced implementations of AES-128, AES-192 and AES-256, generic over the machine`\n`//! word width (`u32`/`u64`),`.","locations":[{"ref":"aes/src/backends/fixslice/mod.rs:1-2","code":"    1 | //! Fixsliced implementations of AES-128, AES-192 and AES-256 (64-bit)\n    2 | //! adapted from the C implementation.","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends/fixslice/mod.rs#L1-L2"}]},
{"id":"CMT_8","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"`memshift32`'s name and doc comment date from the pre-generic, `u32`-only fixslice code and are now wrong.\nThe function moves 8 `W` elements, i.e. 32 bytes only when `W = u32`; for the `u64` word (the default\n`NativeWord` on 64-bit targets) it moves **64** bytes. The phrase \"to an 8-byte offset\" is also wrong: the\ndestination offset is 8 *elements* (32 or 64 bytes), not 8 bytes, and `src_offset` is likewise an element index,\nnot a byte offset (see `debug_assert_eq!(src_offset % 8, 0)`).","fix":"Rename the function to something width-neutral (e.g. `shift_rkey_block`) and fix the doc:\n```rust\n/// Copy the 8-word round-key block at `src_offset` to `src_offset + 8`.\n///\n/// Offsets are element indices into `buffer`, not byte offsets.\npub(super) fn shift_rkey_block<W: Word>(buffer: &mut [W], src_offset: usize) {\n```","locations":[{"ref":"aes/src/backends/fixslice/utils.rs:94-96","code":"   94 | /// Copy 32-bytes within the provided slice to an 8-byte offset.\n   95 | pub(super) fn memshift32<W: Word>(buffer: &mut [W], src_offset: usize) {\n   96 |     debug_assert_eq!(src_offset % 8, 0);","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends/fixslice/utils.rs#L94-L96"}]},
{"id":"CMT_9","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"`Word::uniform_row` and `Word::pack_rows` are documented purely in terms of *bytes* (\"Pack the same byte across\nall 4 rows\", \"Place one byte at each of the 4 row positions\"), but that description is only true for `u32`. For\n`u64` a state row is 16 bits wide, and both methods silently widen the `u8` argument with `double_bits`, so\n`uniform_row(0x0f)` produces `0x00ff_00ff_00ff_00ff`, not `0x0f0f_0f0f_0f0f_0f0f`. The argument is really \"an\n8-bit row pattern expressed one bit per (column, block) pair, widened to the word's row width\" - the whole\ncorrectness of every mask in `utils.rs` (`W::uniform_row(0xfc)`, `W::pack_rows(0x00, 0x03, 0x0f, 0x0c)`, ...)\ndepends on that unstated convention. The hazard is amplified by the fact that `u32`'s `uniform_row` and\n`byte_repeat` have *byte-identical* bodies (`(b as u32) * 0x01010101`), so mixing the two up is invisible on\n16/32-bit-word targets and only corrupts the `u64` path.","fix":"Document the widening contract on the trait methods and cross-reference `double_bits`, e.g.\n```rust\n    /// Broadcast an 8-bit row pattern to all 4 rows of the word.\n    ///\n    /// `b` is indexed by `(column, block)` for a 2-block state; for wider words each bit is\n    /// duplicated to cover the extra blocks (see `double_bits`), so `ROW_BITS` may exceed 8.\n    fn uniform_row(b: u8) -> Self;\n\n    /// Replicate byte `b` across every *byte* of the word, with no row widening.\n    ///\n    /// Unlike `uniform_row`, this is a raw byte splat; the two coincide only for `u32`.\n    fn byte_repeat(b: u8) -> Self;\n```","locations":[{"ref":"aes/src/backends/fixslice/word.rs:45-52","code":"   45 |     /// Pack the same byte across all 4 rows of the word.\n   46 |     fn uniform_row(b: u8) -> Self;\n   47 | \n   48 |     /// Place one byte at each of the 4 row positions of the word (row 0 = LSB).\n   49 |     fn pack_rows(r0: u8, r1: u8, r2: u8, r3: u8) -> Self;\n   50 | \n   51 |     /// Replicate byte `b` across every byte of the word.\n   52 |     fn byte_repeat(b: u8) -> Self;","lines":8,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends/fixslice/word.rs#L45-L52"},{"ref":"aes/src/backends/fixslice/word.rs:69-82","code":"   69 |     #[inline(always)]\n   70 |     fn uniform_row(b: u8) -> u32 {\n   71 |         (b as u32) * 0x01010101\n   72 |     }\n   73 | \n   74 |     #[inline(always)]\n   75 |     fn pack_rows(r0: u8, r1: u8, r2: u8, r3: u8) -> u32 {\n   76 |         (r0 as u32) | ((r1 as u32) << 8) | ((r2 as u32) << 16) | ((r3 as u32) << 24)\n   77 |     }\n   78 | \n   79 |     #[inline(always)]\n   80 |     fn byte_repeat(b: u8) -> u32 {\n   81 |         (b as u32) * 0x01010101\n   82 |     }","lines":14,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends/fixslice/word.rs#L69-L82"},{"ref":"aes/src/backends/fixslice/word.rs:176-192","code":"  176 |     #[inline(always)]\n  177 |     fn uniform_row(b: u8) -> u64 {\n  178 |         (double_bits(b) as u64) * 0x0001_0001_0001_0001\n  179 |     }\n  180 | \n  181 |     #[inline(always)]\n  182 |     fn pack_rows(r0: u8, r1: u8, r2: u8, r3: u8) -> u64 {\n  183 |         (double_bits(r0) as u64)\n  184 |             | ((double_bits(r1) as u64) << 16)\n  185 |             | ((double_bits(r2) as u64) << 32)\n  186 |             | ((double_bits(r3) as u64) << 48)\n  187 |     }\n  188 | \n  189 |     #[inline(always)]\n  190 |     fn byte_repeat(b: u8) -> u64 {\n  191 |         (b as u64) * 0x0101010101010101\n  192 |     }","lines":17,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends/fixslice/word.rs#L176-L192"}]},
{"id":"CMT_10","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The crate documentation tells users to enable a configuration flag named `aes_compact` to shrink the\nsoftware backend, but no such flag exists anywhere in the crate. The real flag is\n`aes_backend_soft = \"compact\"` (used by `aes/src/backends/fixslice/*.rs` and declared in the\n`check-cfg` list of `aes/Cargo.toml`), and it is documented correctly 84 lines further down in the\n`# Configuration Flags` section. A user following line 25 would set a cfg that does nothing and,\nbecause of `check-cfg`, would additionally get an `unexpected_cfgs` warning.","fix":"Before:\n```rust\n//! Enabling the `aes_compact` configuration flag will reduce the code size of this\n//! backend at the cost of decreased performance (using a modified form of\n//! the fixslicing technique called \"semi-fixslicing\").\n```\nAfter:\n```rust\n//! Enabling the `aes_backend_soft = \"compact\"` configuration flag will reduce the code size\n//! of this backend at the cost of decreased performance (using a modified form of\n//! the fixslicing technique called \"semi-fixslicing\").\n```","locations":[{"ref":"aes/src/lib.rs:25-27","code":"   25 | //! Enabling the `aes_compact` configuration flag will reduce the code size of this\n   26 | //! backend at the cost of decreased performance (using a modified form of\n   27 | //! the fixslicing technique called \"semi-fixslicing\").","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/lib.rs#L25-L27"},{"ref":"aes/src/lib.rs:109-110","code":"  109 | //! - `aes_backend_soft`: modify software backend:\n  110 | //!   - `compact`: use compact implementation (less performant, but results in a smaller binary)","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/lib.rs#L109-L110"}]},
{"id":"CMT_11","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The documentation instructs users to pass `RUSTFLAGS=-Ctarget-feature=+aes,+ssse3` (and\n`+aes,+avx512f,+ssse3,+vaes`) to statically enable the hardware backends, but the x86 backend no\nlonger uses SSSE3 anywhere: every function in `aes/src/backends/x86_aes.rs`,\n`x86_aes/encdec.rs`, `x86_aes/expand.rs` and `x86_aes/hazmat.rs` is gated on `aes` (or `sse2`) only,\nand the runtime token is `cpufeatures::new!(features_aes, \"aes\")`. The `+ssse3` requirement is a\nleftover from the pre-refactor backend; keeping it in the docs makes users believe SSSE3 is part of\nthe contract (and needlessly raises the baseline for statically-built binaries).","fix":"Drop `+ssse3` from both `RUSTFLAGS` examples, i.e. `-Ctarget-feature=+aes` and\n`-Ctarget-feature=+aes,+avx512f,+vaes`. While there, note that `+vaes` already implies `+aes` and\n`+avx2` in rustc's target-feature graph, so the second example can be shortened to\n`-Ctarget-feature=+avx512f,+vaes`.","locations":[{"ref":"aes/src/lib.rs:43-46","code":"   43 | //! Passing `RUSTFLAGS=-Ctarget-feature=+aes,+ssse3` explicitly at\n   44 | //! compile-time will override runtime detection and ensure that AES-NI is\n   45 | //! used or passing `RUSTFLAGS=-Ctarget-feature=+aes,+avx512f,+ssse3,+vaes`\n   46 | //! will ensure that AESNI and VAES are always used.","lines":4,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/lib.rs#L43-L46"},{"ref":"aes/src/lib.rs:54-55","code":"   54 | //! Note: runtime detection is not possible on SGX targets. Please use the\n   55 | //! aforementioned `RUSTFLAGS` to leverage AES-NI and VAES on these targets.","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/lib.rs#L54-L55"}]},
{"id":"CMT_12","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment on the `dk` field of `Aria<RK>` is a copy-paste of the `ek` doc comment and says\n`Encrypting subkeys.` even though `dk` holds the *decryption* round keys (it is only read by\n`BlockCipherDecBackend::decrypt_block`). This is exactly the kind of stale doc that leads a\nfuture reader to mix up the two arrays.","fix":"Before:\n```rust\n    /// Encrypting subkeys.\n    ek: [u128; RK],\n    /// Encrypting subkeys.\n    dk: [u128; RK],\n```\nAfter:\n```rust\n    /// Encrypting subkeys.\n    ek: [u128; RK],\n    /// Decrypting subkeys.\n    dk: [u128; RK],\n```","locations":[{"ref":"aria/src/lib.rs:66-72","code":"   66 | #[derive(Clone)]\n   67 | pub struct Aria<const RK: usize> {\n   68 |     /// Encrypting subkeys.\n   69 |     ek: [u128; RK],\n   70 |     /// Encrypting subkeys.\n   71 |     dk: [u128; RK],\n   72 | }","lines":7,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aria/src/lib.rs#L66-L72"}]},
{"id":"CMT_13","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"`f` implements the Camellia P-function using eight magic `u64` multipliers\n(`0x0101_0100_0100_0001`, ...) and the doc comment says nothing beyond \"F-function of component of\nCamellia defined in RFC 3713\" (which is also ungrammatical - \"of component of\"). The trick is\ncompletely opaque: each constant is a byte mask whose set bytes are the output bytes `y1..y8` that\nXOR in that particular S-box result, and multiplying a byte mask by a value `<= 0xff` broadcasts the\nvalue into those byte lanes. Crucially the code relies on there being **no carry between byte lanes**,\nwhich is why plain `*` is safe rather than `wrapping_mul` (I verified the maximum product is\n`0xffffff00ffffff00`, so no `u64` overflow either). None of that invariant is written down, so a\nfuture edit to one of these constants could introduce a debug-build overflow panic or cross-lane\ncarries with no explanation of what was being relied on.","fix":"Expand the doc comment to record the invariant, e.g.:\n\n```rust\n/// F-function component of Camellia defined in RFC 3713.\n///\n/// The P-function is implemented as eight multiplications by byte masks: each constant has a `0x01`\n/// byte in every output-byte lane `y1..y8` that XORs in that S-box result. Because every mask byte\n/// is `0` or `1` and every S-box output is `<= 0xff`, the products never carry between byte lanes\n/// and never overflow `u64`, so plain `*` is exact - do not change a constant to a value with a\n/// byte outside `{0x00, 0x01}`.\n```\nAlso fix the \"F-function of component of\" wording in `f` and the equivalent phrasing on `fl`/`flinv`.","locations":[{"ref":"camellia/src/utils.rs:3-17","code":"    3 | /// F-function of component of Camellia defined in RFC 3713.\n    4 | pub(crate) fn f(input: u64, key: u64) -> u64 {\n    5 |     let x = (input ^ key).to_be_bytes();\n    6 | \n    7 |     let z1 = 0x0101_0100_0100_0001 * u64::from(SBOXES[0][usize::from(x[0])]);\n    8 |     let z2 = 0x0001_0101_0101_0000 * u64::from(SBOXES[1][usize::from(x[1])]);\n    9 |     let z3 = 0x0100_0101_0001_0100 * u64::from(SBOXES[2][usize::from(x[2])]);\n   10 |     let z4 = 0x0101_0001_0000_0101 * u64::from(SBOXES[3][usize::from(x[3])]);\n   11 |     let z5 = 0x0001_0101_0001_0101 * u64::from(SBOXES[1][usize::from(x[4])]);\n   12 |     let z6 = 0x0100_0101_0100_0101 * u64::from(SBOXES[2][usize::from(x[5])]);\n   13 |     let z7 = 0x0101_0001_0101_0001 * u64::from(SBOXES[3][usize::from(x[6])]);\n   14 |     let z8 = 0x0101_0100_0101_0100 * u64::from(SBOXES[0][usize::from(x[7])]);\n   15 | \n   16 |     z1 ^ z2 ^ z3 ^ z4 ^ z5 ^ z6 ^ z7 ^ z8\n   17 | }","lines":15,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/camellia/src/utils.rs#L3-L17"}]},
{"id":"CMT_14","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The relationship between `TM` (192 entries) and `TR` (only 32 entries) in `cast6` is a genuinely\nnon-obvious invariant and is nowhere documented. RFC 2612 defines 192 `Tr` values as\n`Tr_n = (19 + 17n) mod 32`; because `gcd(17, 32) = 1` that sequence has period 32, which is why 32\nstored entries suffice and why `key_schedule` can index it with `r_idx = 16 * (i % 2)` instead of\n`16 * i`. I verified both tables against the RFC recurrences (`Tm_0 = 0x5a827999`, step\n`0x6ed9eba1`; `Tr_0 = 19`, step `17`, mod `32`): both are exact. But a reader confronted with\n`let m_idx = 16 * i; let r_idx = 16 * (i % 2);` and two arrays of wildly different lengths has no way\nto tell whether the `% 2` is a deliberate exploitation of periodicity or an off-by-one bug.","fix":"Document the invariant at both ends. On the constant:\n\n```rust\n/// RFC 2612 round-key rotation amounts: `Tr_n = (19 + 17 * n) mod 32` for `n` in `0..192`.\n///\n/// Only 32 entries are stored: `gcd(17, 32) == 1`, so the sequence is periodic with period 32 and\n/// `Tr_n == TR[n % 32]`. `key_schedule` relies on this to index with `16 * (i % 2)` rather than\n/// `16 * i`.\npub const TR: [u8; 32] = [\n```\n\nand in `key_schedule`:\n\n```rust\n// Each of the 12 rounds consumes 16 Tm/Tr values (two 8-value `W` octaves).\nlet m_idx = 16 * i;\n// TR is only 32 long because Tr is periodic with period 32; 16 * i mod 32 == 16 * (i % 2).\nlet r_idx = 16 * (i % 2);\n```","locations":[{"ref":"cast6/src/lib.rs:68-80","code":"   68 |     fn key_schedule(&mut self, key: &[u8; 32]) {\n   69 |         let mut kappa = to_u32s(key);\n   70 |         for i in 0..12 {\n   71 |             let m_idx = 16 * i;\n   72 |             let r_idx = 16 * (i % 2);\n   73 | \n   74 |             let m = &TM[m_idx..][..8];\n   75 |             let r = &TR[r_idx..][..8];\n   76 |             forward_octave(&mut kappa, m, r);\n   77 | \n   78 |             let m = &TM[m_idx + 8..][..8];\n   79 |             let r = &TR[r_idx + 8..][..8];\n   80 |             forward_octave(&mut kappa, m, r);","lines":13,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/cast6/src/lib.rs#L68-L80"},{"ref":"cast6/src/consts.rs:170-173","code":"  170 | pub const TR: [u8; 32] = [\n  171 |     0x13, 0x04, 0x15, 0x06, 0x17, 0x08, 0x19, 0x0a, 0x1b, 0x0c, 0x1d, 0x0e, 0x1f, 0x10, 0x01, 0x12,\n  172 |     0x03, 0x14, 0x05, 0x16, 0x07, 0x18, 0x09, 0x1a, 0x0b, 0x1c, 0x0d, 0x1e, 0x0f, 0x00, 0x11, 0x02,\n  173 | ];","lines":4,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/cast6/src/consts.rs#L170-L173"}]},
{"id":"CMT_15","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The comment explaining the pre-rearranged DES S-boxes contradicts itself and its first claim is\nfalse. It says the boxes were \"rearranged so that the bottom four bits choose the column and the top\ntwo bits choose the row\", and then \"In other words, we can directly index the sbox array with the 6\ninput bits\". Those two statements describe different layouts, and only the second matches the data.\nI checked all 8 x 64 entries against the FIPS DES S-boxes: `SBOXES[n][i]` equals\n`S(n+1)[row][col]` where `row = 2 * (i >> 5) + (i & 1)` and `col = (i >> 1) & 0xf` - i.e. the\nstandard \"first and last bit select the row, middle four select the column\" mapping is *preserved*\nso that raw 6-bit indexing works. Storing them row-major (top two bits = row) would require a bit\npermutation before indexing and would make `apply_sboxes` in `des/src/utils.rs` wrong. A reader who\nbelieves the first sentence will mis-audit the tables or \"fix\" the lookup.","fix":"Replace the misleading sentence:\n\n```rust\n// These boxes are not laid out the way they appear in the literature. There, the first and last of\n// the six input bits select the row and the middle four select the column, so a literal row-major\n// copy of the published tables would need a bit permutation before lookup. These tables are\n// pre-permuted to `index = row_hi << 5 | col << 1 | row_lo`, i.e. exactly the raw six input bits,\n// so `apply_sboxes` can index them directly with `(input >> (58 - 6 * i)) & 0x3f`.\n```","locations":[{"ref":"des/src/consts.rs:3-10","code":"    3 | // These boxes are not the same ones that appear in the literature. Normally,\n    4 | // the first and the last bits of the six input bits are used to choose the row\n    5 | // and the middle four bits are used to choose the column. These sboxes are\n    6 | // rearranged so that the bottom four bits choose the column and the top two\n    7 | // bits choose the row. In other words, we can directly index the sbox array\n    8 | // with the 6 input bits to get the correct value.\n    9 | #[rustfmt::skip]\n   10 | pub const SBOXES: [[u8; 64]; 8] = [","lines":8,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/des/src/consts.rs#L3-L10"}]},
{"id":"CMT_16","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The `des` crate docs never mention weak keys. `Des::new`, `TdesEde3::new`, `TdesEee3::new`, `TdesEde2::new` and `TdesEee2::new` all accept the 4 weak, 12 semi-weak and 48 possibly-weak DES keys without complaint, and `weak_key_test` - the only defence the crate offers - is opt-in, buried behind a bare `pub use weak_key::{WeakKeyError, weak_key_test};` with no crate-level pointer and no example. Nothing in the crate calls it. A user following the (absent) usage docs will simply never invoke it.","fix":"Add a crate-doc section telling users that key validation is their responsibility and how to do it:\n\n```rust\n//! # Weak keys\n//!\n//! [`Des`] and the `Tdes*` types accept every 8/16/24-byte key, including the\n//! known weak, semi-weak and possibly-weak DES keys. Callers that accept\n//! externally supplied key material should reject it first:\n//!\n//! ```\n//! des::weak_key_test(&key)?;\n//! let cipher = des::Des::new(&key.into());\n//! ```\n```\n\nAlso note the inconsistent re-export style on lines 32-34 (`pub use crate::des::Des;` vs\n`pub use weak_key::..`) - pick one.","locations":[{"ref":"des/src/lib.rs:1-13","code":"    1 | //! Pure Rust implementation of the [Data Encryption Standard][DES] (DES),\n    2 | //! including [Triple DES] (TDES, 3DES) block ciphers.\n    3 | //!\n    4 | //! # ⚠️ Security Warning: Hazmat!\n    5 | //!\n    6 | //! This crate implements only the low-level block cipher function, and is intended\n    7 | //! for use for implementing higher-level constructions *only*. It is NOT\n    8 | //! intended for direct use in applications.\n    9 | //!\n   10 | //! USE AT YOUR OWN RISK!\n   11 | //!\n   12 | //! [DES]: https://en.wikipedia.org/wiki/Data_Encryption_Standard\n   13 | //! [Triple DES]: https://en.wikipedia.org/wiki/Triple_DES","lines":13,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/des/src/lib.rs#L1-L13"},{"ref":"des/src/lib.rs:32-34","code":"   32 | pub use crate::des::Des;\n   33 | pub use crate::tdes::{TdesEde2, TdesEde3, TdesEee2, TdesEee3};\n   34 | pub use weak_key::{WeakKeyError, weak_key_test};","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/des/src/lib.rs#L32-L34"}]},
{"id":"CMT_17","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"All four public TDES types carry the byte-identical doc comment `/// Triple DES (3DES) block cipher.`, so rustdoc gives the reader no way to tell `TdesEde3`, `TdesEee3`, `TdesEde2` and `TdesEee2` apart. This matters because the variants are *not* interchangeable: `TdesEee2`/`TdesEee3` are the non-standard E-E-E constructions (not FIPS SP 800-67 TDEA, and `TdesEee3` gives no better than single-DES-like security against meet-in-the-middle for some uses), and `TdesEde2` is the deprecated two-key keying option 2. Picking the wrong one is a security decision that the docs currently do nothing to guide.","fix":"Give each type a distinct doc comment stating the pipeline, the key size and its standardisation status,\nfor example:\n\n```rust\n/// Triple DES (3DES) in E-D-E mode with three independent 8-byte keys\n/// (FIPS SP 800-67 keying option 1): `C = E_k3(D_k2(E_k1(P)))`.\npub struct TdesEde3 { .. }\n\n/// Triple DES (3DES) in E-E-E mode with three independent 8-byte keys:\n/// `C = E_k3(E_k2(E_k1(P)))`. Non-standard; prefer [`TdesEde3`].\npub struct TdesEee3 { .. }\n```","locations":[{"ref":"des/src/tdes.rs:15-17","code":"   15 | /// Triple DES (3DES) block cipher.\n   16 | #[derive(Clone)]\n   17 | pub struct TdesEde3 {","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/des/src/tdes.rs#L15-L17"},{"ref":"des/src/tdes.rs:99-101","code":"   99 | /// Triple DES (3DES) block cipher.\n  100 | #[derive(Clone)]\n  101 | pub struct TdesEee3 {","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/des/src/tdes.rs#L99-L101"},{"ref":"des/src/tdes.rs:183-185","code":"  183 | /// Triple DES (3DES) block cipher.\n  184 | #[derive(Clone)]\n  185 | pub struct TdesEde2 {","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/des/src/tdes.rs#L183-L185"},{"ref":"des/src/tdes.rs:264-266","code":"  264 | /// Triple DES (3DES) block cipher.\n  265 | #[derive(Clone)]\n  266 | pub struct TdesEee2 {","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/des/src/tdes.rs#L264-L266"}]},
{"id":"CMT_18","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"None of the six permutation helpers in `utils.rs` actually uses a table, yet every doc comment claims one: `/// Swap bits using the PC-1 table`, `/// Swap bits using the PC-2 table`, `/// Swap bits using the E table`, `/// Swap bits using the P table`, `/// Swap bits using the IP table`. They are hand-derived sequences of delta-swaps, masks and magic multiplications (`0x0000000094200201`, `0x0001000000610006`, ...) with no derivation, no reference and no way for a reviewer to check them against FIPS 46-3. Worse, `fp` is documented as `/// Swap bits using the reverse FP table` - `fp` *is* the final permutation (it is the inverse of `ip`, being the same delta-swap chain in reverse order), so calling it \"the reverse FP table\" is actively misleading.","fix":"Reword each comment to say what the function computes rather than claiming a table, and cite the source of\nthe bit-twiddling constants once at the top of the module, e.g.\n\n```rust\n//! Bit-permutation primitives for DES. `ip`/`fp`/`pc1` are implemented as\n//! sequences of involutive delta-swaps and `pc2`/`p`/`e` as mask+multiply bit\n//! gathers rather than table lookups; see <reference> for the derivation.\n\n/// Applies the DES final permutation FP, the inverse of [`ip`].\npub(crate) fn fp(mut message: u64) -> u64 { .. }\n```","locations":[{"ref":"des/src/utils.rs:9-10","code":"    9 | /// Swap bits using the PC-1 table\n   10 | fn pc1(mut key: u64) -> u64 {","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/des/src/utils.rs#L9-L10"},{"ref":"des/src/utils.rs:22-23","code":"   22 | /// Swap bits using the PC-2 table\n   23 | fn pc2(key: u64) -> u64 {","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/des/src/utils.rs#L22-L23"},{"ref":"des/src/utils.rs:43-44","code":"   43 | /// Swap bits using the reverse FP table\n   44 | pub(crate) fn fp(mut message: u64) -> u64 {","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/des/src/utils.rs#L43-L44"},{"ref":"des/src/utils.rs:52-53","code":"   52 | /// Swap bits using the IP table\n   53 | pub(crate) fn ip(mut message: u64) -> u64 {","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/des/src/utils.rs#L52-L53"},{"ref":"des/src/utils.rs:61-62","code":"   61 | /// Swap bits using the E table\n   62 | fn e(block: u64) -> u64 {","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/des/src/utils.rs#L61-L62"},{"ref":"des/src/utils.rs:79-80","code":"   79 | /// Swap bits using the P table\n   80 | fn p(block: u64) -> u64 {","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/des/src/utils.rs#L79-L80"}]},
{"id":"CMT_19","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The doc comment for `weak_key_test` says only that it \"Checks whether `key` contains one of the known weak DES keys\", but for 16- and 24-byte inputs the function additionally rejects keys whose 8-byte sub-keys are *equal to each other* (lines 25-38) - a completely different rule that has nothing to do with the `WEAK_KEYS` table. A caller reading the docs would not expect `weak_key_test(&[0x02; 24])` to fail, nor that a legitimate 2-key 3DES key expressed in 3-key form as `K1||K2||K1` is rejected. The return type is also documented only through the `# Panics` section; there is no `# Errors` section explaining what `WeakKeyError` covers.","fix":"Extend the doc comment to describe both rules and the error condition, e.g.\n\n```rust\n/// Checks whether `key` is unsuitable for DES/3DES.\n///\n/// Returns [`WeakKeyError`] if any 8-byte sub-key is one of the known\n/// [weak DES keys][TCG], or - for 16- and 24-byte keys - if any two sub-keys are\n/// equal (which degenerates 3DES to single DES; also required by the TCG spec,\n/// which forbids `K1 == K3` even though that is standard 2-key 3DES).\n```","locations":[{"ref":"des/src/weak_key.rs:3-14","code":"    3 | /// Checks whether `key` contains one of the known [weak DES keys][TCG].\n    4 | ///\n    5 | /// [TCG]: https://trustedcomputinggroup.org/wp-content/uploads/TPM-2.0-1.83-Part-1-Architecture.pdf#page=82\n    6 | ///\n    7 | /// # Panics\n    8 | /// If `key` length is not equal to 8, 16, or 24.\n    9 | #[inline]\n   10 | pub fn weak_key_test(key: &[u8]) -> Result<(), WeakKeyError> {\n   11 |     assert!(\n   12 |         matches!(key.len(), 8 | 16 | 24),\n   13 |         \"key size is not equal to 8, 16, or 24 bytes\"\n   14 |     );","lines":12,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/des/src/weak_key.rs#L3-L14"},{"ref":"des/src/weak_key.rs:25-38","code":"   25 |     match key.len() {\n   26 |         16 => {\n   27 |             is_weak |= u8::from(key[..8] == key[8..]);\n   28 |         }\n   29 |         24 => {\n   30 |             let k1 = &key[..8];\n   31 |             let k2 = &key[8..16];\n   32 |             let k3 = &key[16..];\n   33 |             is_weak |= u8::from(k1 == k2);\n   34 |             is_weak |= u8::from(k1 == k3);\n   35 |             is_weak |= u8::from(k2 == k3);\n   36 |         }\n   37 |         _ => {}\n   38 |     }","lines":14,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/des/src/weak_key.rs#L25-L38"}]},
{"id":"CMT_20","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"`gift-cipher/src/key_schedule.rs` contains 143 lines and not a single comment. It is an\nunattributed transliteration of the reference fixsliced GIFT-128 implementation, and every line is a\nmagic mask (`0x00550055`, `0x0a0a0a0a`, `0x3fff0000`, ...) or a magic index arithmetic\n(`rkey[i - 19]`, `rkey[i - 17]`, `rkey[i - 12]`, ...). Nothing explains why the second loop deliberately\nleaves `rkey[8]`, `rkey[9]`, `rkey[18]` and `rkey[19]` in the classical (non-rearranged) representation,\nwhy the third loop pairs `_double_` updates with `i - 17`/`i - 15`/`i - 13`/`i - 11` but `_triple_`\nupdates with `i - 18`/`i - 16`/`i - 14`/`i - 12`, or where the 40 `GIFT_RC` words come from. I verified all\nof it against the reference and it is correct, but the file is effectively unreviewable and unmaintainable\nas written - a single transposed offset would be invisible to a reader.","fix":"Add a module header citing the exact source of the representation and constants, and short comments\nmarking the three phases, e.g.\n\n```rust\n//! GIFT-128 key schedule in the fixsliced representation of Adomnicai, Najm and\n//! Peyrin, \"Fixslicing: A New GIFT Representation\" (eprint 2020/412); the masks\n//! and round-key offsets below are transliterated from the reference C code at\n//! <url>.\n\n    // Phase 1: classical key state, 20 words (two 10-word groups).\n    // Phase 2: transpose the first two groups to the fixsliced representation.\n    //          rkey[i + 8] / rkey[i + 9] are intentionally left classical - the\n    //          5th round of each quintuple uses the plain nibble rotations.\n    // Phase 3: derive groups 3..8 by double/triple key updates of group i - 20.\n```\n\nand reference the origin of `GIFT_RC` in `gift-cipher/src/consts.rs`.","locations":[{"ref":"gift-cipher/src/key_schedule.rs:1-44","code":"    1 | use crate::primitives::{ror, swapmov
