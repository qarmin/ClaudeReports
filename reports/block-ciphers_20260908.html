{"id":"OTHER_23","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"Every constant in `idea/src/consts.rs` is undocumented and two of the five names are actively wrong or\nopaque. `ONE = 0xffff` is not one: it is the 16-bit mask, and `idea/src/lib.rs` uses it exclusively as a\nmask (`(c & ONE)`, `& (ONE as i32)`, `(a + b) & ONE`). `FUYI = 0x10000` is a romanised Chinese phrase\n(*fù yī*, \"negative one\") for what is really 2^16, the additive-group modulus used to compute\n`add_inv`. `MAXIM = 0x10001` is the IDEA multiplicative modulus 2^16 + 1, which the name does not convey.\n`LENGTH_SUB_KEYS` is also noun-order-inverted relative to Rust convention. On top of that all five are\ndeclared `pub` inside the private module `mod consts;`, so the visibility is misleading and the crate's\n`#![warn(missing_docs)]` does not catch the absent docs.","fix":"Rename to self-describing identifiers, document each one, and reduce the visibility:\n\nbefore\n```rust\npub const ROUNDS: usize = 8;\npub const LENGTH_SUB_KEYS: usize = ROUNDS * 6 + 4;\npub const ONE: u32 = 0xffff;\npub const FUYI: u32 = 0x10000;\npub const MAXIM: u32 = 0x10001;\n```\nafter\n```rust\n/// Number of IDEA rounds.\npub(crate) const ROUNDS: usize = 8;\n/// Six sub-keys per round plus four for the output transformation.\npub(crate) const SUB_KEYS_LEN: usize = ROUNDS * 6 + 4;\n/// Mask selecting the low 16 bits of a `u32`.\npub(crate) const MASK_16: u32 = 0xffff;\n/// Modulus of the additive group used by IDEA: 2^16.\npub(crate) const MODULUS_ADD: u32 = 0x1_0000;\n/// Modulus of the multiplicative group used by IDEA: 2^16 + 1.\npub(crate) const MODULUS_MUL: u32 = 0x1_0001;\n```\n\nand update the four use sites in `idea/src/lib.rs` accordingly.","locations":[{"ref":"idea/src/consts.rs:1-5","code":"    1 | pub const ROUNDS: usize = 8;\n    2 | pub const LENGTH_SUB_KEYS: usize = ROUNDS * 6 + 4;\n    3 | pub const ONE: u32 = 0xffff;\n    4 | pub const FUYI: u32 = 0x10000;\n    5 | pub const MAXIM: u32 = 0x10001;","lines":5,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/idea/src/consts.rs#L1-L5"}]},
{"id":"OTHER_24","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"`Idea::mul` implements multiplication modulo `2^16 + 1` with two data-dependent early-exit branches (`if x == 0 { ... } else if y == 0 { ... } else { ... }`) plus a third branch `if r < 0`. `mul` is called four times per round with values derived from the plaintext and the round keys, so the executed path (and therefore timing / branch-predictor state) depends on secret data. `Idea::mul_inv` is worse: it runs a variable number of extended-Euclid iterations with `u32` divisions whose operands and iteration count depend directly on the expanded key, so key setup leaks key material through timing. Nothing in the crate claims constant-time behaviour, but these are the two places where a caller who assumed data-independent timing would be wrong.","fix":"Make `mul` branch-free (the reduction is exact because `2^16 = -1 (mod 2^16+1)`), and document that `mul_inv` is key-dependent and only runs during key setup:\n```rust\n#[inline]\nconst fn mul(a: u16, b: u16) -> u16 {\n    // `0` encodes 2^16; select it without branching.\n    let x = u32::from(a) + (((u32::from(a).wrapping_sub(1)) >> 31) << 16);\n    let y = u32::from(b) + (((u32::from(b).wrapping_sub(1)) >> 31) << 16);\n    let p = u64::from(x) * u64::from(y);\n    let s = (p & 0xffff) as i64 - (p >> 16) as i64;\n    // conditional `+= 2^16 + 1` via an arithmetic-shift mask\n    let s = s + ((s >> 63) & 0x1_0001);\n    (s as u32 & u32::from(u16::MAX)) as u16\n}\n```\nAdd a short comment above `mul_inv` stating that it is not constant-time and is only used during key expansion.","locations":[{"ref":"idea/src/lib.rs:135-153","code":"  135 |     fn mul(&self, a: u16, b: u16) -> u16 {\n  136 |         let x = u32::from(a);\n  137 |         let y = u32::from(b);\n  138 |         let mut r: i32;\n  139 | \n  140 |         if x == 0 {\n  141 |             r = (MAXIM - y) as i32;\n  142 |         } else if y == 0 {\n  143 |             r = (MAXIM - x) as i32;\n  144 |         } else {\n  145 |             let c: u32 = x * y;\n  146 |             r = ((c & ONE) as i32) - ((c >> 16) as i32);\n  147 |             if r < 0 {\n  148 |                 r += MAXIM as i32;\n  149 |             }\n  150 |         }\n  151 | \n  152 |         (r & (ONE as i32)) as u16\n  153 |     }","lines":19,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/idea/src/lib.rs#L135-L153"},{"ref":"idea/src/lib.rs:159-180","code":"  159 |     fn mul_inv(&self, a: u16) -> u16 {\n  160 |         if a <= 1 {\n  161 |             a\n  162 |         } else {\n  163 |             let mut x = u32::from(a);\n  164 |             let mut y = MAXIM;\n  165 |             let mut t0 = 1u32;\n  166 |             let mut t1 = 0u32;\n  167 |             loop {\n  168 |                 t1 += y / x * t0;\n  169 |                 y %= x;\n  170 |                 if y == 1 {\n  171 |                     return (MAXIM - t1) as u16;\n  172 |                 }\n  173 |                 t0 += x / y * t1;\n  174 |                 x %= y;\n  175 |                 if x == 1 {\n  176 |                     return t0 as u16;\n  177 |                 }\n  178 |             }\n  179 |         }\n  180 |     }","lines":22,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/idea/src/lib.rs#L159-L180"}]},
{"id":"OTHER_25","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`big_soft::transform` reinterprets the fused table with a bare `unsafe { &*(table.0.as_ptr().cast()) }` producing a `&[[u128; 256]; 16]`, with no `// SAFETY:` comment and no compile-time check. Soundness rests on two facts that live in other files: `Table = Align16<[u8; 16 * 4096]>` is exactly `16 * 256 * 16` bytes, and `#[repr(align(16))]` on `Align16` satisfies `align_of::<u128>()`. If either the table dimensions in `fused_tables.rs` or the `Align16` wrapper in `utils.rs` were ever changed, this cast would start reading out of bounds or under-aligned with nothing in the compiler or the test suite pointing at this line. This is the only `unsafe` block in the portable backend, so it deserves a justification.","fix":"Document and statically check the invariants:\n```rust\n#[inline(always)]\nfn transform(block: u128, table: &Table) -> u128 {\n    type Rows = [[u128; 256]; 16];\n    const { assert!(size_of::<Table>() == size_of::<Rows>()) };\n    const { assert!(align_of::<Table>() >= align_of::<Rows>()) };\n    // SAFETY: `Table` is `Align16<[u8; 16 * 4096]>`, i.e. the same size as `Rows` and aligned to\n    // 16 bytes, which is at least `align_of::<u128>()`; both asserts above are checked at compile\n    // time. Any bit pattern is a valid `u128`.\n    let table: &Rows = unsafe { &*(table.0.as_ptr().cast()) };\n    ...\n}\n```","locations":[{"ref":"kuznyechik/src/big_soft/backends.rs:29-40","code":"   29 | #[inline(always)]\n   30 | fn transform(block: u128, table: &Table) -> u128 {\n   31 |     let table: &[[u128; 256]; 16] = unsafe { &*(table.0.as_ptr().cast()) };\n   32 |     let block = block.to_le_bytes();\n   33 |     let mut res = 0u128;\n   34 |     for i in 0..16 {\n   35 |         res ^= table[i][block[i] as usize];\n   36 |     }\n   37 |     #[cfg(target_endian = \"big\")]\n   38 |     let res = res.swap_bytes();\n   39 |     res\n   40 | }","lines":12,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/big_soft/backends.rs#L29-L40"}]},
{"id":"OTHER_26","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"The most surprising step of the decryption path is completely undocumented in all three fused-table backends: `decrypt_block` starts with `b ^= k[0]; b = sub_bytes(b, &P); b = transform(b, &DEC_TABLE);`, i.e. it applies the *forward* S-box `P` immediately before a table that begins with `P_INV`, purely so the two cancel and the first round performs `L^-1` alone. `inv_enc_keys` does the same thing to the round keys (`sub_bytes(enc_keys[i], &P)` followed by `transform(.., &DEC_TABLE)`) so that the keys live in the `L^-1` domain and can be XORed *after* the transform inside the loop. Without a comment, `sub_bytes(x, &P)` inside a decryption routine reads like a copy-paste error between the encrypt and decrypt paths, and any \"cleanup\" that removes it (or that moves the `b ^= k[i]` back before the transform) silently breaks decryption only - which the single round-trip test vector would catch, but a reviewer would not.","fix":"Add a short comment at both sites, e.g. above `inv_enc_keys`: \"`DEC_TABLE` computes `L^-1 . S^-1`; applying the forward S-box `P` first cancels the `S^-1` so that this yields `L^-1(k)`. Storing the round keys in the `L^-1` domain lets `decrypt_block` XOR them after the transform.\" and above the first three lines of `decrypt_block`: \"`sub_bytes(.., &P)` cancels the `S^-1` baked into `DEC_TABLE`, so this first step is `L^-1` only.\"","locations":[{"ref":"kuznyechik/src/big_soft/backends.rs:77-88","code":"   77 | pub(super) fn inv_enc_keys(enc_keys: &RoundKeys) -> RoundKeys {\n   78 |     let mut dec_keys = [0; 10];\n   79 | \n   80 |     dec_keys[0] = enc_keys[9];\n   81 |     for i in 1..9 {\n   82 |         let k = sub_bytes(enc_keys[i], &P);\n   83 |         dec_keys[9 - i] = transform(k, &DEC_TABLE);\n   84 |     }\n   85 |     dec_keys[9] = enc_keys[0];\n   86 | \n   87 |     dec_keys\n   88 | }","lines":12,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/big_soft/backends.rs#L77-L88"},{"ref":"kuznyechik/src/big_soft/backends.rs:149-166","code":"  149 |     fn decrypt_block(&self, mut block: InOut<'_, '_, Block>) {\n  150 |         let k = self.0;\n  151 | \n  152 |         let mut b: u128 = u128::from_le_bytes(block.get_in().0);\n  153 | \n  154 |         b ^= k[0];\n  155 |         b = sub_bytes(b, &P);\n  156 |         b = transform(b, &DEC_TABLE);\n  157 | \n  158 |         for i in 1..9 {\n  159 |             b = transform(b, &DEC_TABLE);\n  160 |             b ^= k[i];\n  161 |         }\n  162 |         b = sub_bytes(b, &P_INV);\n  163 |         b ^= k[9];\n  164 | \n  165 |         *block.get_out() = Array(b.to_le_bytes());\n  166 |     }","lines":18,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/big_soft/backends.rs#L149-L166"},{"ref":"kuznyechik/src/neon/backends.rs:261-281","code":"  261 |     fn decrypt_block(&self, block: InOut<'_, '_, Block>) {\n  262 |         let k = self.0;\n  263 |         unsafe {\n  264 |             let (in_ptr, out_ptr) = block.into_raw();\n  265 |             let mut b = vld1q_u8(in_ptr as *const u8);\n  266 | \n  267 |             b = veorq_u8(b, k[0]);\n  268 | \n  269 |             b = sub_bytes(b, &P);\n  270 |             b = transform(b, &DEC_TABLE);\n  271 | \n  272 |             for i in 1..9 {\n  273 |                 b = transform(b, &DEC_TABLE);\n  274 |                 b = veorq_u8(b, k[i]);\n  275 |             }\n  276 |             b = sub_bytes(b, &P_INV);\n  277 |             b = veorq_u8(b, k[9]);\n  278 | \n  279 |             vst1q_u8(out_ptr as *mut u8, b);\n  280 |         }\n  281 |     }","lines":21,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/neon/backends.rs#L261-L281"}]},
{"id":"OTHER_27","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"The `zeroize` feature only wipes the cipher structs themselves; the transient copies of the expanded round keys created on the way in are never cleared. `KeyInit::new` builds `EncKeys` on the stack and moves it into `into()` (`EncKeys` has no `Drop`), `From<KuznyechikEnc> for Kuznyechik` / `From<&KuznyechikEnc>` clone a full `RoundKeys`, and `expand_enc_keys` keeps `k1`, `k2` and `t` in registers/stack slots - so after `Kuznyechik::new(&key)` returns, one or more complete copies of the 160-byte expanded key schedule typically remain in the caller's frame. The struct-level `zeroize_flat_type` gives users a reasonable expectation that no key material is left behind, which is not quite true.","fix":"Either document the limitation next to the `zeroize` feature (\"only the cipher state is zeroized; temporary copies created during key expansion are not\"), or give the intermediate key types their own zeroizing `Drop` and construct in place, e.g. make `EncKeys`/`DecKeys`/`EncDecKeys` implement `Drop` with `zeroize_flat_type` under `#[cfg(feature = \"zeroize\")]` and have `From<&KuznyechikEnc>` be the only conversion (the owned `From<KuznyechikEnc>` cannot move the keys out anyway because of the `Drop` impl, so it clones without any benefit).","locations":[{"ref":"kuznyechik/src/lib.rs:100-122","code":"  100 | impl KeyInit for Kuznyechik {\n  101 |     fn new(key: &Key) -> Self {\n  102 |         let enc_keys = EncKeys::new(key);\n  103 |         let keys = enc_keys.into();\n  104 |         Self { keys }\n  105 |     }\n  106 | }\n  107 | \n  108 | impl From<KuznyechikEnc> for Kuznyechik {\n  109 |     #[inline]\n  110 |     fn from(enc: KuznyechikEnc) -> Kuznyechik {\n  111 |         let keys = enc.keys.clone().into();\n  112 |         Self { keys }\n  113 |     }\n  114 | }\n  115 | \n  116 | impl From<&KuznyechikEnc> for Kuznyechik {\n  117 |     #[inline]\n  118 |     fn from(enc: &KuznyechikEnc) -> Kuznyechik {\n  119 |         let keys = enc.keys.clone().into();\n  120 |         Self { keys }\n  121 |     }\n  122 | }","lines":23,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/lib.rs#L100-L122"},{"ref":"kuznyechik/src/big_soft/backends.rs:42-75","code":"   42 | pub(super) fn expand_enc_keys(key: &Key) -> RoundKeys {\n   43 |     #[inline(always)]\n   44 |     fn next_const(i: usize) -> u128 {\n   45 |         u128::from_le_bytes(KEYGEN[i].0)\n   46 |     }\n   47 | \n   48 |     let mut enc_keys = [0; 10];\n   49 | \n   50 |     let mut k1 = u128::from_le_bytes(key[..16].try_into().unwrap());\n   51 |     let mut k2 = u128::from_le_bytes(key[16..].try_into().unwrap());\n   52 | \n   53 |     enc_keys[0] = k1;\n   54 |     enc_keys[1] = k2;\n   55 | \n   56 |     let mut cidx = 0;\n   57 |     for i in 1..5 {\n   58 |         for _ in 0..4 {\n   59 |             let mut t = k1 ^ next_const(cidx);\n   60 |             cidx += 1;\n   61 |             t = transform(t, &ENC_TABLE);\n   62 |             k2 ^= t;\n   63 | \n   64 |             let mut t = k2 ^ next_const(cidx);\n   65 |             cidx += 1;\n   66 |             t = transform(t, &ENC_TABLE);\n   67 |             k1 ^= t;\n   68 |         }\n   69 | \n   70 |         enc_keys[2 * i] = k1;\n   71 |         enc_keys[2 * i + 1] = k2;\n   72 |     }\n   73 | \n   74 |     enc_keys\n   75 | }","lines":34,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/big_soft/backends.rs#L42-L75"}]},
{"id":"OTHER_28","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"`sub_bytes` and `transform` are declared `unsafe fn` with no `# Safety` section, and the module opens with\n`#![allow(unsafe_op_in_unsafe_fn)]`, so callers cannot tell what obligation they are discharging and the\ncompiler no longer flags unsafe operations inside these bodies. Neither function actually has a caller-side\nprecondition: the module is only compiled when `target_feature = \"sse2\"` is enabled at compile time (see the\n`cfg_if!` gate in `kuznyechik/src/lib.rs:49-57`), `sub_bytes` performs no raw-pointer work at all, and\n`transform`'s only load is provably in-bounds and 16-byte aligned because the index is\n`(lane << 12) | (byte << 4) <= 65520` into a 65536-byte `Align16` table. Marking them `unsafe` for no reason\ndilutes the meaning of `unsafe` in the rest of the file, where the real obligations (pointer validity in\n`expand_enc_keys` and the block backends) live.","fix":"Make both functions safe (`fn sub_bytes(...)`, `fn transform(...)`) with an internal `unsafe { ... }` block\naround the `_mm_load_si128` in `get!`, carrying the existing in-bounds/alignment reasoning as a `SAFETY:`\ncomment, and drop `#![allow(unsafe_op_in_unsafe_fn)]` so the remaining raw-pointer operations must be\nwrapped explicitly. If they stay `unsafe`, add a `# Safety` section stating the exact requirement.","locations":[{"ref":"kuznyechik/src/sse2/backends.rs:1","code":"    1 | #![allow(unsafe_op_in_unsafe_fn)]","lines":1,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/sse2/backends.rs#L1"},{"ref":"kuznyechik/src/sse2/backends.rs:35-36","code":"   35 | #[inline(always)]\n   36 | unsafe fn sub_bytes(block: __m128i, sbox: &[u8; 256]) -> __m128i {","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/sse2/backends.rs#L35-L36"},{"ref":"kuznyechik/src/sse2/backends.rs:66-77","code":"   66 | #[inline(always)]\n   67 | unsafe fn transform(block: __m128i, table: &Table) -> __m128i {\n   68 |     macro_rules! get {\n   69 |         ($table:expr, $ind:expr, $i:expr) => {{\n   70 |             let idx = _mm_extract_epi16($ind, $i) as u16 as usize;\n   71 |             let p = $table.0.as_ptr().add(idx).cast();\n   72 |             // correct alignment of `p` is guaranteed since offset values\n   73 |             // are shifted by 4 bits left and the table is aligned to 16 bytes\n   74 |             debug_assert_eq!(p as usize % 16, 0);\n   75 |             _mm_load_si128(p)\n   76 |         }};\n   77 |     }","lines":12,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/sse2/backends.rs#L66-L77"}]},
{"id":"OTHER_29","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`unroll_par!` hard-codes exactly four unrolled iterations while the arrays it fills are sized by\n`ParBlocksSize::USIZE` (`type ParBlocksSize = U4`). The coupling is unchecked and fails silently in one\ndirection: raising `ParBlocksSize` to `U8` (as the NEON backend uses) would leave `blocks[4..8]` at their\n`_mm_setzero_si128()` value, and the final `unroll_par!` would store only 4 of the 8 blocks - i.e. silent\nplaintext/ciphertext corruption rather than a compile error.","fix":"Tie the two together with a compile-time assertion next to the macro, e.g.\n```rust\nconst _: () = assert!(ParBlocksSize::USIZE == 4, \"unroll_par! is hard-coded for 4 blocks\");\n```\nor generate the unrolled bodies from `ParBlocksSize` (a `seq!`-style macro taking the count as an argument).","locations":[{"ref":"kuznyechik/src/sse2/backends.rs:23-33","code":"   23 | type ParBlocksSize = U4;\n   24 | \n   25 | #[rustfmt::skip]\n   26 | macro_rules! unroll_par {\n   27 |     ($var:ident, $body:block) => {\n   28 |         { let $var: usize = 0; $body; }\n   29 |         { let $var: usize = 1; $body; }\n   30 |         { let $var: usize = 2; $body; }\n   31 |         { let $var: usize = 3; $body; }\n   32 |     };\n   33 | }","lines":11,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/sse2/backends.rs#L23-L33"},{"ref":"kuznyechik/src/sse2/backends.rs:204-209","code":"  204 |             let mut blocks = [_mm_setzero_si128(); ParBlocksSize::USIZE];\n  205 |             unroll_par! {\n  206 |                 i, {\n  207 |                     blocks[i] = _mm_loadu_si128(in_ptr.add(i));\n  208 |                 }\n  209 |             };","lines":6,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/sse2/backends.rs#L204-L209"}]},
{"id":"OTHER_30","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"The decryption round structure is highly non-obvious and carries no explanation, which invites a\n\"fix\" that would break it. `decrypt_block` applies the *forward* S-box (`sub_bytes(b, &P)`) inside\ndecryption, then calls `transform(.., &DEC_TABLE)` twice in a row (once before the loop and again on the\nfirst loop iteration), and only at the very end applies `P_INV`. This is correct - `DEC_TABLE` fuses\n`P_INV` with the inverse linear layer, the leading `sub_bytes(.., &P)` cancels the `P_INV` of the first\ntable application so that it degenerates to a pure `L^-1`, and `inv_enc_keys` pre-transforms round keys\n`1..9` accordingly - but nothing in the file says so, and `&P` in a decrypt path reads exactly like a\ncopy-paste error from the encrypt path.","fix":"Add a short comment above the decrypt sequence and above `inv_enc_keys` explaining that `DEC_TABLE` fuses\n`P_INV` with `L^-1`, that the leading `sub_bytes(.., &P)` exists solely to cancel the `P_INV` of the first\ntable lookup, and that round keys `1..=8` are stored pre-multiplied by `L^-1` so that the key XOR can be\nmoved after the linear layer.","locations":[{"ref":"kuznyechik/src/sse2/backends.rs:154-167","code":"  154 | pub(super) fn inv_enc_keys(enc_keys: &RoundKeys) -> RoundKeys {\n  155 |     unsafe {\n  156 |         let mut dec_keys = [_mm_setzero_si128(); 10];\n  157 | \n  158 |         dec_keys[0] = enc_keys[9];\n  159 |         for i in 1..9 {\n  160 |             let k = sub_bytes(enc_keys[i], &P);\n  161 |             dec_keys[9 - i] = transform(k, &DEC_TABLE);\n  162 |         }\n  163 |         dec_keys[9] = enc_keys[0];\n  164 | \n  165 |         dec_keys\n  166 |     }\n  167 | }","lines":14,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/sse2/backends.rs#L154-L167"},{"ref":"kuznyechik/src/sse2/backends.rs:240-260","code":"  240 |     fn decrypt_block(&self, block: InOut<'_, '_, Block>) {\n  241 |         let k = self.0;\n  242 |         unsafe {\n  243 |             let (in_ptr, out_ptr) = block.into_raw();\n  244 |             let mut b = _mm_loadu_si128(in_ptr as *const __m128i);\n  245 | \n  246 |             b = _mm_xor_si128(b, k[0]);\n  247 | \n  248 |             b = sub_bytes(b, &P);\n  249 |             b = transform(b, &DEC_TABLE);\n  250 | \n  251 |             for i in 1..9 {\n  252 |                 b = transform(b, &DEC_TABLE);\n  253 |                 b = _mm_xor_si128(b, k[i]);\n  254 |             }\n  255 |             b = sub_bytes(b, &P_INV);\n  256 |             b = _mm_xor_si128(b, k[9]);\n  257 | \n  258 |             _mm_storeu_si128(out_ptr as *mut __m128i, b)\n  259 |         }\n  260 |     }","lines":21,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/sse2/backends.rs#L240-L260"}]},
{"id":"OTHER_31","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"In both par-block routines the read-only input pointer returned by `InOut::into_raw()` is cast to a mutable\npointer (`let in_ptr = in_ptr as *mut __m128i;`) even though it is only ever used for `_mm_loadu_si128`. The\nsingle-block paths correctly cast to `*const __m128i`. Casting away `const` on a pointer that may alias a\nshared borrow is a UB footgun waiting for someone to add a store through `in_ptr` (which for\n`InOut` may point at the same buffer as `out_ptr`).","fix":"Keep the input pointer const in both places:\n```rust\nlet in_ptr = in_ptr as *const __m128i;\nlet out_ptr = out_ptr as *mut __m128i;\n```","locations":[{"ref":"kuznyechik/src/sse2/backends.rs:199-202","code":"  199 |         unsafe {\n  200 |             let (in_ptr, out_ptr) = blocks.into_raw();\n  201 |             let in_ptr = in_ptr as *mut __m128i;\n  202 |             let out_ptr = out_ptr as *mut __m128i;","lines":4,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/sse2/backends.rs#L199-L202"},{"ref":"kuznyechik/src/sse2/backends.rs:265-268","code":"  265 |         unsafe {\n  266 |             let (in_ptr, out_ptr) = blocks.into_raw();\n  267 |             let in_ptr = in_ptr as *mut __m128i;\n  268 |             let out_ptr = out_ptr as *mut __m128i;","lines":4,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/sse2/backends.rs#L265-L268"}]},
{"id":"OTHER_32","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`kuznyechik/src/utils.rs` has no documentation for its central primitive. `l_step` implements one step of\nthe GOST R 34.12-2015 `R` transformation over a 16-byte register, and the `i` parameter is a rotation offset\nthat lets callers avoid physically shifting the bytes (which is why `compact_soft` calls it with `i` for the\nforward direction and `15 - i` for the inverse). None of this is stated, and `get_idx`'s\n`b.wrapping_sub(i) & 0x0F` masking trick is unexplained, making the function effectively unreviewable\nagainst the standard.","fix":"Add doc comments: on `l_step`, state that it performs one round of the `R` transformation from\nGOST R 34.12-2015 section 4.1.2 on a rotated view of `msg`, that `i` is the rotation offset of the virtual\nregister (so 16 successive calls with `i = 0..16` compute `L`, and `i = 15..0` compute `L^-1`), and that\n`get_idx` maps a logical position to a physical one modulo 16.","locations":[{"ref":"kuznyechik/src/utils.rs:3-11","code":"    3 | #[inline(always)]\n    4 | const fn get_idx(b: usize, i: usize) -> usize {\n    5 |     b.wrapping_sub(i) & 0x0F\n    6 | }\n    7 | \n    8 | #[inline(always)]\n    9 | const fn get_m(msg: [u8; 16], b: usize, i: usize) -> usize {\n   10 |     msg[get_idx(b, i)] as usize\n   11 | }","lines":9,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/utils.rs#L3-L11"},{"ref":"kuznyechik/src/utils.rs:13-14","code":"   13 | pub(crate) const fn l_step(mut msg: [u8; 16], i: usize) -> [u8; 16] {\n   14 |     let mut x = msg[get_idx(15, i)];","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/kuznyechik/src/utils.rs#L13-L14"}]},
{"id":"OTHER_33","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`Debug` and `AlgorithmName` for `Gost89<S>` decide what to print by comparing the S-box name at runtime\n(`if S::NAME == \"Tc26\"`). This is a layering violation (the generic type hard-codes knowledge of one\ninstantiation), it costs a string comparison on every format call where a compile-time constant would do,\nand it is spoofable: any third-party `Sbox` implementation whose `NAME` is `\"Tc26\"` will report itself as\n`Magma` - verified, a custom S-box named `\"Tc26\"` prints `Magma { ... }`.","fix":"Give the trait an explicit display name instead of pattern-matching on `NAME`, e.g. add\n`const ALGORITHM_NAME: &'static str = \"Gost89\";` (overridden to `\"Magma\"` in `impl Sbox for Tc26`) and have\nboth impls simply write `S::ALGORITHM_NAME`.","locations":[{"ref":"magma/src/lib.rs:161-183","code":"  161 | impl<S: Sbox> fmt::Debug for Gost89<S> {\n  162 |     fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {\n  163 |         if S::NAME == \"Tc26\" {\n  164 |             f.write_str(\"Magma { ... }\")\n  165 |         } else {\n  166 |             f.write_str(\"Gost89<\")?;\n  167 |             f.write_str(S::NAME)?;\n  168 |             f.write_str(\"> { ... }\")\n  169 |         }\n  170 |     }\n  171 | }\n  172 | \n  173 | impl<S: Sbox> AlgorithmName for Gost89<S> {\n  174 |     fn write_alg_name(f: &mut fmt::Formatter<'_>) -> fmt::Result {\n  175 |         if S::NAME == \"Tc26\" {\n  176 |             f.write_str(\"Magma\")\n  177 |         } else {\n  178 |             f.write_str(\"Gost89<\")?;\n  179 |             f.write_str(S::NAME)?;\n  180 |             f.write_str(\">\")\n  181 |         }\n  182 |     }\n  183 | }","lines":23,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/magma/src/lib.rs#L161-L183"}]},
{"id":"OTHER_34","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"The public, user-implementable `Sbox` trait exposes two private type aliases in its signature:\n`const SBOX: SmallSbox` where `type SmallSbox = [[u8; 16]; 8]` and `type ExpSbox = [[u8; 256]; 4]` are\ncrate-private. Nothing is unsound (the underlying types are public), but rustdoc renders an unresolvable\n`SmallSbox` for the only item a downstream implementor has to write, and callers cannot name the alias.","fix":"Make the aliases public and re-export them next to `Sbox` in `magma/src/lib.rs`\n(`pub use sboxes::{Sbox, SmallSbox};`), or spell the concrete type in the trait:\n```rust\n    /// Unexpanded S-box; every entry must be in the range `0..=15`.\n    const SBOX: [[u8; 16]; 8];\n```","locations":[{"ref":"magma/src/sboxes.rs:3-4","code":"    3 | type ExpSbox = [[u8; 256]; 4];\n    4 | type SmallSbox = [[u8; 16]; 8];","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/magma/src/sboxes.rs#L3-L4"},{"ref":"magma/src/sboxes.rs:27-32","code":"   27 | pub trait Sbox {\n   28 |     /// S-Box name\n   29 |     const NAME: &'static str;\n   30 |     /// Unexpanded S-box\n   31 |     const SBOX: SmallSbox;\n   32 | }","lines":6,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/magma/src/sboxes.rs#L27-L32"}]},
{"id":"OTHER_35","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"`Rc2::mix` and `Rc2::reverse_mix` thread the round-key index through a caller-owned `&mut usize`, and\n`reverse_mix` decrements it with three plain `*j -= 1` and one `*j = j.wrapping_sub(1)`. The asymmetry is\nload-bearing but unexplained: on the last of the 16 decryption rounds `j` enters as `3`, so the final\ndecrement would underflow, which is why only that one is wrapping. Any future refactor (a 17th round, a\ndifferent starting index, or someone \"cleaning up\" the wrapping call) silently reintroduces an\nunderflow/out-of-bounds panic, and `reverse_mix` will panic outright if it is ever called with `j < 3`.","fix":"Derive the key index from the round number instead of mutating a shared counter, e.g. pass\n`keys: &[u16; 4]` (a slice of the four subkeys for the round) to `mix`/`reverse_mix` and let the caller\ncompute `&self.keys[4 * i..4 * i + 4]`. If the `&mut usize` is kept, add a one-line comment explaining why\nthe last decrement must wrap.","locations":[{"ref":"rc2/src/lib.rs:119-147","code":"  119 |     fn reverse_mix(&self, r: &mut [u16; 4], j: &mut usize) {\n  120 |         r[3] = r[3].rotate_right(5);\n  121 |         r[3] = r[3]\n  122 |             .wrapping_sub(self.keys[*j])\n  123 |             .wrapping_sub(r[2] & r[1])\n  124 |             .wrapping_sub(!r[2] & r[0]);\n  125 |         *j -= 1;\n  126 | \n  127 |         r[2] = r[2].rotate_right(3);\n  128 |         r[2] = r[2]\n  129 |             .wrapping_sub(self.keys[*j])\n  130 |             .wrapping_sub(r[1] & r[0])\n  131 |             .wrapping_sub(!r[1] & r[3]);\n  132 |         *j -= 1;\n  133 | \n  134 |         r[1] = r[1].rotate_right(2);\n  135 |         r[1] = r[1]\n  136 |             .wrapping_sub(self.keys[*j])\n  137 |             .wrapping_sub(r[0] & r[3])\n  138 |             .wrapping_sub(!r[0] & r[2]);\n  139 |         *j -= 1;\n  140 | \n  141 |         r[0] = r[0].rotate_right(1);\n  142 |         r[0] = r[0]\n  143 |             .wrapping_sub(self.keys[*j])\n  144 |             .wrapping_sub(r[3] & r[2])\n  145 |             .wrapping_sub(!r[3] & r[1]);\n  146 |         *j = j.wrapping_sub(1);\n  147 |     }","lines":29,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc2/src/lib.rs#L119-L147"},{"ref":"rc2/src/lib.rs:236-243","code":"  236 |         let mut j = 63;\n  237 | \n  238 |         for i in 0..16 {\n  239 |             self.reverse_mix(&mut b, &mut j);\n  240 |             if i == 4 || i == 10 {\n  241 |                 self.reverse_mash(&mut b);\n  242 |             }\n  243 |         }","lines":8,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc2/src/lib.rs#L236-L243"}]},
{"id":"OTHER_36","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"The `RC5` public API is undocumented beyond `/// RC5 block cipher instance.`: nothing says that `W` is the\nword type, `R` the number of rounds and `B` the key size *in bytes*, nothing states the resulting block\nsize (`2 * size_of::<W>()`), there are no convenience aliases for the standard parameter sets, and there is\nno guidance that low round counts are cryptographically broken. The bounds happily accept degenerate\ninstances: `RC5<u32, U0, U16>` compiles and \"encrypts\" with zero rounds (verified: it just adds `S[0]`/`S[1]`\nand returns), and RC5-32/12 - the parameter set used by the crate's own tests - has been broken by\ndifferential cryptanalysis, with RC5-32/16/16 the usual minimum recommendation.","fix":"Document the parameters on the struct (`W`: word type, `R`: rounds, `B`: key length in bytes; block size is\n`2 * W`), add a `# Security` note in the crate docs recommending at least 16 rounds and warning that\n`R = U0`/low round counts provide no security, and export aliases such as\n`pub type Rc5_32_16_16 = RC5<u32, U16, U16>;` so callers do not have to rediscover the parameter order.","locations":[{"ref":"rc5/src/lib.rs:1-19","code":"    1 | //! Pure Rust implementation of the [RC5] block cipher.\n    2 | //!\n    3 | //! # ⚠️ Security Warning: Hazmat!\n    4 | //!\n    5 | //! This crate implements only the low-level block cipher function, and is intended\n    6 | //! for use for implementing higher-level constructions *only*. It is NOT\n    7 | //! intended for direct use in applications.\n    8 | //!\n    9 | //! USE AT YOUR OWN RISK!\n   10 | //!\n   11 | //! [RC5]: https://en.wikipedia.org/wiki/RC5\n   12 | #![no_std]\n   13 | #![doc(\n   14 |     html_logo_url = \"https://raw.githubusercontent.com/RustCrypto/media/26acc39f/logo.svg\",\n   15 |     html_favicon_url = \"https://raw.githubusercontent.com/RustCrypto/media/26acc39f/logo.svg\"\n   16 | )]\n   17 | #![deny(unsafe_code)]\n   18 | #![cfg_attr(docsrs, feature(doc_cfg))]\n   19 | #![warn(missing_docs, rust_2018_idioms)]","lines":19,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc5/src/lib.rs#L1-L19"},{"ref":"rc5/src/lib.rs:46-65","code":"   46 | /// RC5 block cipher instance.\n   47 | #[derive(Clone)]\n   48 | pub struct RC5<W, R, B>\n   49 | where\n   50 |     W: Word,\n   51 |     // Block size\n   52 |     W::Bytes: Mul<U2>,\n   53 |     BlockSize<W>: ArraySize,\n   54 |     // Rounds range\n   55 |     R: Unsigned,\n   56 |     R: IsLess<U256>,\n   57 |     Le<R, U256>: NonZero,\n   58 |     // ExpandedKeyTableSize\n   59 |     R: Add<U1>,\n   60 |     Sum<R, U1>: Mul<U2>,\n   61 |     ExpandedKeyTableSize<R>: ArraySize,\n   62 | {\n   63 |     key_table: ExpandedKeyTable<W, R>,\n   64 |     _key_size: PhantomData<B>,\n   65 | }","lines":20,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc5/src/lib.rs#L46-L65"}]},
{"id":"OTHER_37","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`Word::rotate_left`/`rotate_right` handle the rotation amount inconsistently across\nwidths, which reads like a bug even though it is currently correct. For `u8`/`u16`/`u32`\nthe amount is passed straight through (`u8::rotate_left(self, n as u32)`), relying on the\nfact that `uN::rotate_left` internally reduces modulo `N` *and* that the widening cast is\nlossless. For `u64`/`u128` an explicit `n % Self::BITS` is applied first - which is\nmandatory there only because `n as u32` would otherwise truncate the amount. Nothing in\nthe code says so, so a reader is left unsure whether the `u8`/`u16`/`u32` arms are missing\na mask (RC5/RC6 require rotation by `n mod w`) or whether the `u64`/`u128` `%` is\nredundant. The `let size = Self::BITS;` temporary in the 64/128-bit arms is also pointless\nindirection.","fix":"Make every impl reduce explicitly and identically, and drop the `size` temporary, e.g.\n\n```rust\n#[inline(always)]\nfn rotate_left(self, n: Self) -> Self {\n    // RC5/RC6 rotate by `n mod w`; the mask also keeps the `as u32` cast lossless.\n    u64::rotate_left(self, (n % Self::BITS as u64) as u32)\n}\n```\n\nand add a one-line comment on the trait method stating that `n` is taken modulo the word\nwidth. Consider replacing the whole hand-rolled set with `num-traits`-style bounds or a\nsingle shared implementation (see the `rc5`/`rc6` `primitives.rs` duplication finding).","locations":[{"ref":"rc5/src/primitives.rs:77-85","code":"   77 |     #[inline(always)]\n   78 |     fn rotate_left(self, n: Self) -> Self {\n   79 |         u8::rotate_left(self, n as u32)\n   80 |     }\n   81 | \n   82 |     #[inline(always)]\n   83 |     fn rotate_right(self, n: Self) -> Self {\n   84 |         u8::rotate_right(self, n as u32)\n   85 |     }","lines":9,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc5/src/primitives.rs#L77-L85"},{"ref":"rc5/src/primitives.rs:212-222","code":"  212 |     #[inline(always)]\n  213 |     fn rotate_left(self, n: Self) -> Self {\n  214 |         let size = Self::BITS;\n  215 |         u64::rotate_left(self, (n % size as u64) as u32)\n  216 |     }\n  217 | \n  218 |     #[inline(always)]\n  219 |     fn rotate_right(self, n: Self) -> Self {\n  220 |         let size = Self::BITS;\n  221 |         u64::rotate_right(self, (n % size as u64) as u32)\n  222 |     }","lines":11,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc5/src/primitives.rs#L212-L222"},{"ref":"rc6/src/core/primitives.rs:67-75","code":"   67 |     #[inline(always)]\n   68 |     fn rotate_left(self, n: Self) -> Self {\n   69 |         u8::rotate_left(self, n as u32)\n   70 |     }\n   71 | \n   72 |     #[inline(always)]\n   73 |     fn rotate_right(self, n: Self) -> Self {\n   74 |         u8::rotate_right(self, n as u32)\n   75 |     }","lines":9,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc6/src/core/primitives.rs#L67-L75"},{"ref":"rc6/src/core/primitives.rs:220-230","code":"  220 |     #[inline(always)]\n  221 |     fn rotate_left(self, n: Self) -> Self {\n  222 |         let size = Self::BITS;\n  223 |         u64::rotate_left(self, (n % size as u64) as u32)\n  224 |     }\n  225 | \n  226 |     #[inline(always)]\n  227 |     fn rotate_right(self, n: Self) -> Self {\n  228 |         let size = Self::BITS;\n  229 |         u64::rotate_right(self, (n % size as u64) as u32)\n  230 |     }","lines":11,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc6/src/core/primitives.rs#L220-L230"}]},
{"id":"OTHER_38","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"`impl KeyInit for RC6` implements `fn new(key) -> Self { Self::new(key) }`. This is not\nrecursion only because Rust resolves the inherent `RC6::new` before the trait method of\nthe same name - a silent, invisible dependency. If the inherent `pub fn new` in\n`rc6/src/core/backend.rs` is ever renamed, made `pub(crate)` in a way that changes\nresolution, or removed, this line becomes unbounded recursion (stack overflow on every\nkey init) with no compiler diagnostic. `rc5` avoids the trap by inlining the constructor\nbody in the `KeyInit` impl.","fix":"Disambiguate explicitly. Before:\n\n```rust\nfn new(key: &cipher::Key<Self>) -> Self {\n    Self::new(key)\n}\n```\n\nAfter:\n\n```rust\nfn new(key: &cipher::Key<Self>) -> Self {\n    RC6::<W, R, B>::new(key)\n}\n```\n\n(or rename the inherent constructor to something like `new_unchecked`/`from_key`).","locations":[{"ref":"rc6/src/block_cipher.rs:40-42","code":"   40 |     fn new(key: &cipher::Key<Self>) -> Self {\n   41 |         Self::new(key)\n   42 |     }","lines":3,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc6/src/block_cipher.rs#L40-L42"},{"ref":"rc6/src/core/backend.rs:55-60","code":"   55 |     pub fn new(key: &Key<B>) -> RC6<W, R, B> {\n   56 |         Self {\n   57 |             key_table: Self::substitute_key(key),\n   58 |             _key_size: PhantomData,\n   59 |         }\n   60 |     }","lines":6,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc6/src/core/backend.rs#L55-L60"}]},
{"id":"OTHER_39","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`rc6/src/lib.rs` is bare: no crate-level documentation, no \"Security Warning: Hazmat!\"\nnotice, no `html_logo_url`/`html_favicon_url`, no `#![deny(unsafe_code)]`, no\n`#![warn(missing_docs, rust_2018_idioms)]`, and no `pub use cipher;`. Every sibling crate\nin the workspace (`rc5`, `serpent`, `aes`, ...) carries all of these. The consequences are\nconcrete rather than cosmetic: with `missing_docs` off, the publicly re-exported `RC6`,\nits inherent `new`/`encrypt`/`decrypt`, and the four `RC6_*` aliases are all undocumented\nand ship that way to docs.rs; without `deny(unsafe_code)` the crate loses the mechanical\nguarantee its siblings advertise; and users get no hazmat warning for a low-level\nprimitive. (`rc6/Cargo.toml` is also missing the\n`[package.metadata.docs.rs] all-features = true` stanza the other crates have.)","fix":"Copy the header of `rc5/src/lib.rs` (lines 1-19) into `rc6/src/lib.rs`, adapting the\nname/link:\n\n```rust\n//! Pure Rust implementation of the [RC6] block cipher.\n//!\n//! # ⚠️ Security Warning: Hazmat!\n//! ...\n//! [RC6]: https://en.wikipedia.org/wiki/RC6\n#![no_std]\n#![doc(html_logo_url = \"...\", html_favicon_url = \"...\")]\n#![deny(unsafe_code)]\n#![cfg_attr(docsrs, feature(doc_cfg))]\n#![warn(missing_docs, rust_2018_idioms)]\n```\n\nthen add the doc comments that `missing_docs` now demands, and add\n`[package.metadata.docs.rs] all-features = true` to `rc6/Cargo.toml`.","locations":[{"ref":"rc6/src/lib.rs:1-7","code":"    1 | #![no_std]\n    2 | \n    3 | mod block_cipher;\n    4 | mod core;\n    5 | \n    6 | pub use crate::core::RC6;\n    7 | pub use block_cipher::*;","lines":7,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc6/src/lib.rs#L1-L7"}]},
{"id":"OTHER_40","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`rc6` names its private module `core`, shadowing the `core` crate inside the crate root.\nThat is why `lib.rs` has to write `pub use crate::core::RC6;` with an explicit `crate::`\nprefix, and why `rc6/src/core/backend.rs` and `rc6/src/core/primitives.rs` write\n`use core::ops::{...}` relying on extern-prelude fallback. It compiles today, but any new\nitem named `core` in an inner module, or a `use core::...` added at the crate root, turns\ninto a confusing resolution error or - worse - silently resolves to the wrong `core`. No\nother crate in the workspace does this.","fix":"Rename the module, e.g. `rc6/src/core/` -> `rc6/src/rc6_core/` (or flatten it: move\n`primitives.rs` and `backend.rs` up to `rc6/src/` and drop the extra level, since the\nmodule only contains two files and re-exports both). Update `lib.rs` to\n`mod primitives; mod backend; pub use backend::RC6;`.","locations":[{"ref":"rc6/src/lib.rs:3-7","code":"    3 | mod block_cipher;\n    4 | mod core;\n    5 | \n    6 | pub use crate::core::RC6;\n    7 | pub use block_cipher::*;","lines":5,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc6/src/lib.rs#L3-L7"},{"ref":"rc6/src/core/mod.rs:1-8","code":"    1 | //! Implementation according to the [RC6 paper]\n    2 | //! [RC6 paper]: https://www.grc.com/r&d/rc6.pdf\n    3 | \n    4 | mod backend;\n    5 | mod primitives;\n    6 | \n    7 | pub use backend::RC6;\n    8 | pub use primitives::*;","lines":8,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/rc6/src/core/mod.rs#L1-L8"}]},
{"id":"OTHER_41","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"`apply_s` and `apply_s_inv` destructure their `Words` argument into `[w1, w2, w3, w4]`\nand then immediately rebuild the identical array for each of the eight arms - 16\nredundant array literals in total, pure noise in the file that most needs to be easy to\nproofread. The `index % 8` is also a silent mask rather than a check: `apply_s` is called\nfrom `serpent/src/lib.rs` with raw round indices `0..=31` and with\n`(ROUNDS + 3 - i) % ROUNDS`, so any future off-by-one in those formulas would be\nabsorbed into a different-but-valid S-box instead of being caught, and the `% 8` forces\nan `_ => unreachable!()` panic arm into an otherwise panic-free file.","fix":"Before:\n\n```rust\npub fn apply_s(index: usize, [w1, w2, w3, w4]: Words) -> Words {\n    match index % 8 {\n        0 => sbox_e0([w1, w2, w3, w4]),\n        ...\n        _ => unreachable!(),\n    }\n}\n```\n\nAfter (same for `apply_s_inv`):\n\n```rust\npub(crate) fn apply_s(index: usize, words: Words) -> Words {\n    match index & 7 {\n        0 => sbox_e0(words),\n        1 => sbox_e1(words),\n        2 => sbox_e2(words),\n        3 => sbox_e3(words),\n        4 => sbox_e4(words),\n        5 => sbox_e5(words),\n        6 => sbox_e6(words),\n        _ => sbox_e7(words),\n    }\n}\n```\n\nwhich removes the `unreachable!()` arm entirely. Additionally add\n`debug_assert!(index < 32);` so a bad caller index is caught in tests, and change these\n`pub fn` items in the private `bitslice` module to `pub(crate) fn`.","locations":[{"ref":"serpent/src/bitslice.rs:46-74","code":"   46 | #[inline]\n   47 | pub fn apply_s(index: usize, [w1, w2, w3, w4]: Words) -> Words {\n   48 |     match index % 8 {\n   49 |         0 => sbox_e0([w1, w2, w3, w4]),\n   50 |         1 => sbox_e1([w1, w2, w3, w4]),\n   51 |         2 => sbox_e2([w1, w2, w3, w4]),\n   52 |         3 => sbox_e3([w1, w2, w3, w4]),\n   53 |         4 => sbox_e4([w1, w2, w3, w4]),\n   54 |         5 => sbox_e5([w1, w2, w3, w4]),\n   55 |         6 => sbox_e6([w1, w2, w3, w4]),\n   56 |         7 => sbox_e7([w1, w2, w3, w4]),\n   57 |         _ => unreachable!(),\n   58 |     }\n   59 | }\n   60 | \n   61 | #[inline]\n   62 | pub fn apply_s_inv(index: usize, [w1, w2, w3, w4]: Words) -> Words {\n   63 |     match index % 8 {\n   64 |         0 => sbox_d0([w1, w2, w3, w4]),\n   65 |         1 => sbox_d1([w1, w2, w3, w4]),\n   66 |         2 => sbox_d2([w1, w2, w3, w4]),\n   67 |         3 => sbox_d3([w1, w2, w3, w4]),\n   68 |         4 => sbox_d4([w1, w2, w3, w4]),\n   69 |         5 => sbox_d5([w1, w2, w3, w4]),\n   70 |         6 => sbox_d6([w1, w2, w3, w4]),\n   71 |         7 => sbox_d7([w1, w2, w3, w4]),\n   72 |         _ => unreachable!(),\n   73 |     }\n   74 | }","lines":29,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/serpent/src/bitslice.rs#L46-L74"}]},
{"id":"OTHER_42","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`serpent/src/bitslice.rs` contains 16 hand-written boolean circuits (8 S-boxes, 8\ninverses) plus the linear transform and its inverse, and has no unit tests at all. Every\ncircuit is only exercised indirectly through whole-cipher test vectors, so a fault is\nreported as \"test vector mismatch\" with no localisation, and any refactor of a single\nS-box gets no targeted signal. Direct tests are cheap here because the circuits are\nbitsliced: feeding the four 16-bit input planes `w_k = sum_v ((v >> k) & 1) << v` makes\none call compute the entire 4-bit truth table at once. (I ran exactly this check\nexternally: all eight `sbox_eN` match the published Serpent tables and all eight\n`sbox_dN` are their exact inverses, and `linear_transform_inv` round-trips\n`linear_transform` on 20000 random inputs - so this is a missing-safety-net finding, not\na correctness bug.)","fix":"Add a `#[cfg(test)] mod tests` at the end of `serpent/src/bitslice.rs` that, for each\n`i in 0..8`, builds the bitsliced truth-table inputs, applies `apply_s(i, ..)` /\n`apply_s_inv(i, ..)`, and asserts the recovered 16-entry table equals the Serpent S-box\nconstant `S[i]` (and its inverse). Add one property test that\n`linear_transform_inv(linear_transform(w)) == w` for a handful of fixed and pseudorandom\n`Words`.","locations":[{"ref":"serpent/src/bitslice.rs:76-97","code":"   76 | #[inline]\n   77 | const fn sbox_e0([mut w1, mut w2, mut w3, mut w4]: Words) -> Words {\n   78 |     w4 ^= w1;\n   79 |     let mut t0 = w2;\n   80 |     w2 &= w4;\n   81 |     t0 ^= w3;\n   82 |     w2 ^= w1;\n   83 |     w1 |= w4;\n   84 |     w1 ^= t0;\n   85 |     t0 ^= w4;\n   86 |     w4 ^= w3;\n   87 |     w3 |= w2;\n   88 |     w3 ^= t0;\n   89 |     t0 = !t0;\n   90 |     t0 |= w2;\n   91 |     w2 ^= w4;\n   92 |     w2 ^= t0;\n   93 |     w4 |= w1;\n   94 |     w2 ^= w4;\n   95 |     t0 ^= w4;\n   96 |     [w2, t0, w3, w1]\n   97 | }","lines":22,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/serpent/src/bitslice.rs#L76-L97"},{"ref":"serpent/src/bitslice.rs:269-291","code":"  269 | #[inline]\n  270 | const fn sbox_d0([mut w1, mut w2, mut w3, mut w4]: Words) -> Words {\n  271 |     w3 = !w3;\n  272 |     let mut t0 = w2;\n  273 |     w2 |= w1;\n  274 |     t0 = !t0;\n  275 |     w2 ^= w3;\n  276 |     w3 |= t0;\n  277 |     w2 ^= w4;\n  278 |     w1 ^= t0;\n  279 |     w3 ^= w1;\n  280 |     w1 &= w4;\n  281 |     t0 ^= w1;\n  282 |     w1 |= w2;\n  283 |     w1 ^= w3;\n  284 |     w4 ^= t0;\n  285 |     w3 ^= w2;\n  286 |     w4 ^= w1;\n  287 |     w4 ^= w2;\n  288 |     w3 &= w4;\n  289 |     t0 ^= w3;\n  290 |     [w1, t0, w2, w4]\n  291 | }","lines":23,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/serpent/src/bitslice.rs#L269-L291"}]},
{"id":"OTHER_43","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"Six of the eight forward S-boxes finish by returning a permuted array literal\n(e.g. `[w2, t0, w3, w1]` in `sbox_e0`), but `sbox_e5` and `sbox_e6` instead perform\nexplicit register shuffles before returning `[w1, w2, w3, w4]`. The shuffles are\nequivalent to the array-literal form, so they add four (resp. one) redundant assignments\nand, more importantly, they break the visual pattern in the file that is by far the most\ncopy-paste-error-prone in the workspace - a reader scanning for \"which register ends up\nwhere\" has to simulate a rename chain in exactly two of sixteen functions. (The circuits\nthemselves are correct: all eight `sbox_eN` were verified to reproduce the Serpent S-box\ntables exactly and all eight `sbox_dN` to be their exact inverses.)","fix":"In `sbox_e5`, replace\n\n```rust\n    w3 = w1;\n    w1 = w2;\n    w2 = w4;\n    w4 = t0;\n    [w1, w2, w3, w4]\n```\n\nwith\n\n```rust\n    [w2, w4, w1, t0]\n```\n\nIn `sbox_e6`, replace\n\n```rust\n    w3 = t0;\n    [w1, w2, w3, w4]\n```\n\nwith\n\n```rust\n    [w1, w2, t0, w4]\n```","locations":[{"ref":"serpent/src/bitslice.rs:213-217","code":"  213 |     w3 = w1;\n  214 |     w1 = w2;\n  215 |     w2 = w4;\n  216 |     w4 = t0;\n  217 |     [w1, w2, w3, w4]","lines":5,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/serpent/src/bitslice.rs#L213-L217"},{"ref":"serpent/src/bitslice.rs:240-241","code":"  240 |     w3 = t0;\n  241 |     [w1, w2, w3, w4]","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/serpent/src/bitslice.rs#L240-L241"}]},
{"id":"OTHER_44","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`expand_key` takes the key length twice - once implicitly as `source.len()` and once explicitly as\n`len_bits` - and the two are used for different purposes: `source.len()` decides how many bytes are copied\nwhile `len_bits` decides where the Serpent `1` padding bit is placed. The single caller passes\n`key.len() * 8`, so they always agree, but the signature makes it possible to place the padding bit inside the\nkey material (silently producing a different cipher) or, for `len_bits` in `248..256` combined with a shorter\n`source`, to write past the copied region. `source.len() > 32` would also panic in `copy_from_slice`; that is\nonly prevented by the caller's range check.","fix":"Drop the redundant parameter and derive everything from the slice:\n```rust\nfn expand_key(source: &[u8]) -> [u8; 32] {\n    debug_assert!(source.len() <= 32);\n    let mut key = [0u8; 32];\n    key[..source.len()].copy_from_slice(source);\n    if source.len() < 32 {\n        key[source.len()] = 1; // Serpent short-key padding: a single `1` bit, then zeros\n    }\n    key\n}\n```\nand call it as `expand_key(key)`.","locations":[{"ref":"serpent/src/lib.rs:61-70","code":"   61 | fn expand_key(source: &[u8], len_bits: usize) -> [u8; 32] {\n   62 |     let mut key = [0u8; 32];\n   63 |     key[..source.len()].copy_from_slice(source);\n   64 |     if len_bits < 256 {\n   65 |         let byte_i = len_bits / 8;\n   66 |         let bit_i = len_bits % 8;\n   67 |         key[byte_i] |= 1 << bit_i;\n   68 |     }\n   69 |     key\n   70 | }","lines":10,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/serpent/src/lib.rs#L61-L70"},{"ref":"serpent/src/lib.rs:81-85","code":"   81 |     fn new_from_slice(key: &[u8]) -> Result<Self, InvalidLength> {\n   82 |         if key.len() < 16 || key.len() > 32 {\n   83 |             return Err(InvalidLength);\n   84 |         }\n   85 |         let key = expand_key(key, key.len() * 8);","lines":5,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/serpent/src/lib.rs#L81-L85"}]},
{"id":"OTHER_45","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"The `unroll31!` macro hard-codes exactly 31 iterations (`let $i = 0; ... let $i = 30;`) with no connection to\nthe `ROUNDS` constant it is meant to track, and its name bakes the count in. `Serpent::encrypt_block` and\n`decrypt_block` combine it with hand-written `ROUNDS - 1` / `ROUNDS` / `30 - i` expressions, so `ROUNDS` and\nthe macro must be kept in sync by hand. Changing `ROUNDS` (or reusing the macro elsewhere) would silently\nproduce a cipher that runs the wrong number of rounds rather than failing to compile, and the misnamed\n`30 - i` in the decrypt path is the only place the `31` is echoed.","fix":"Either take the count as a macro argument and assert it against `ROUNDS`, e.g.\n```rust\nmacro_rules! unroll {\n    ($i:ident, 31, $body:block) => { /* 31 expansions */ };\n}\nconst _: () = assert!(ROUNDS - 1 == 31);\n```\nor replace the macro with a plain `for i in 0..ROUNDS - 1` loop plus `#[cfg(not(serpent_no_unroll))]`-gated\n`#[unroll::unroll_for_loops]`/manual unrolling, so the round count has exactly one source of truth.","locations":[{"ref":"serpent/src/unroll.rs:1-46","code":"    1 | #[cfg(not(serpent_no_unroll))]\n    2 | #[rustfmt::skip]\n    3 | macro_rules! unroll31 {\n    4 |     ($i:ident, $body:block) => {\n    5 |         let $i = 0; $body;\n    6 |         let $i = 1; $body;\n    7 |         let $i = 2; $body;\n    8 |         let $i = 3; $body;\n    9 |         let $i = 4; $body;\n   10 |         let $i = 5; $body;\n   11 |         let $i = 6; $body;\n   12 |         let $i = 7; $body;\n   13 |         let $i = 8; $body;\n   14 |         let $i = 9; $body;\n   15 |         let $i = 10; $body;\n   16 |         let $i = 11; $body;\n   17 |         let $i = 12; $body;\n   18 |         let $i = 13; $body;\n   19 |         let $i = 14; $body;\n   20 |         let $i = 15; $body;\n   21 |         let $i = 16; $body;\n   22 |         let $i = 17; $body;\n   23 |         let $i = 18; $body;\n   24 |         let $i = 19; $body;\n   25 |         let $i = 20; $body;\n   26 |         let $i = 21; $body;\n   27 |         let $i = 22; $body;\n   28 |         let $i = 23; $body;\n   29 |         let $i = 24; $body;\n   30 |         let $i = 25; $body;\n   31 |         let $i = 26; $body;\n   32 |         let $i = 27; $body;\n   33 |         let $i = 28; $body;\n   34 |         let $i = 29; $body;\n   35 |         let $i = 30; $body;\n   36 |     };\n   37 | }\n   38 | \n   39 | #[cfg(serpent_no_unroll)]\n   40 | macro_rules! unroll31 {\n   41 |     ($i:ident, $body:block) => {\n   42 |         for $i in 0..31 {\n   43 |             $body;\n   44 |         }\n   45 |     };\n   46 | }","lines":46,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/serpent/src/unroll.rs#L1-L46"},{"ref":"serpent/src/lib.rs:141-157","code":"  141 | impl BlockCipherEncBackend for Serpent {\n  142 |     #[inline]\n  143 |     fn encrypt_block(&self, mut block: InOut<'_, '_, Block<Self>>) {\n  144 |         let mut b: [u32; 4] = read_words(block.get_in().into());\n  145 | \n  146 |         unroll31!(i, {\n  147 |             let xb = xor(b, self.round_keys[i]);\n  148 |             let s = bitslice::apply_s(i, xb);\n  149 |             b = bitslice::linear_transform(s);\n  150 |         });\n  151 | \n  152 |         let xb = xor(b, self.round_keys[ROUNDS - 1]);\n  153 |         let s = bitslice::apply_s(ROUNDS - 1, xb);\n  154 |         b = xor(s, self.round_keys[ROUNDS]);\n  155 | \n  156 |         write_words(&b, block.get_out().into());\n  157 |     }","lines":17,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/serpent/src/lib.rs#L141-L157"},{"ref":"serpent/src/lib.rs:167-185","code":"  167 | impl BlockCipherDecBackend for Serpent {\n  168 |     #[inline]\n  169 |     fn decrypt_block(&self, mut block: InOut<'_, '_, Block<Self>>) {\n  170 |         let mut b: [u32; 4] = read_words(block.get_in().into());\n  171 | \n  172 |         let s = xor(b, self.round_keys[ROUNDS]);\n  173 |         let xb = bitslice::apply_s_inv(ROUNDS - 1, s);\n  174 |         b = xor(xb, self.round_keys[ROUNDS - 1]);\n  175 | \n  176 |         unroll31!(i, {\n  177 |             let i = 30 - i;\n  178 |             let s = bitslice::linear_transform_inv(b);\n  179 |             let xb = bitslice::apply_s_inv(i, s);\n  180 |             b = xor(xb, self.round_keys[i]);\n  181 |         });\n  182 | \n  183 |         write_words(&b, block.get_out().into());\n  184 |     }\n  185 | }","lines":19,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/serpent/src/lib.rs#L167-L185"}]},
{"id":"OTHER_46","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"The Speck `rotate_left`/`rotate_right` helpers implement an `$n`-bit rotation inside a wider `$word_type`\n(`u32` for the 24-bit variants, `u64` for the 48-bit variants) but do not mask the result to `$n` bits, so\nthey return values with arbitrary garbage in bits `$n..word_bits`. `inverse_round_function` then *returns*\nsuch an unmasked value (`x = $name::rotate_left(x, $alpha)` and `y = $name::rotate_right(y, $beta)` are the\nlast writes), so `decrypt_block` carries garbage high bits across every round and into `to_be_bytes`. The code\nhappens to be correct today only because carries in `wrapping_add`/`wrapping_sub` propagate upward, every\nother operation re-applies `& $mask`, and `to_be_bytes` truncates - an undocumented invariant that is easy to\nbreak with any future reordering, and which also makes the intermediate values impossible to reason about or\nunit-test in isolation.","fix":"Mask inside the helpers so they are total functions on `$n`-bit words:\n```rust\n#[inline]\nfn rotate_right(x: $word_type, pos: $word_type) -> $word_type {\n    ((x >> pos) | (x << ($n - pos))) & $mask\n}\n\n#[inline]\nfn rotate_left(x: $word_type, pos: $word_type) -> $word_type {\n    ((x << pos) | (x >> ($n - pos))) & $mask\n}\n```\nThe extra `&` is a no-op for the variants where `$n` equals the word width and is optimised away, so this\ncosts nothing while removing the invariant.","locations":[{"ref":"speck-cipher/src/lib.rs:64-74","code":"   64 |             #[inline]\n   65 |             fn rotate_right(x: $word_type, pos: $word_type) -> $word_type {\n   66 |                 // We can't use $word_type.rotate_right here because the word size might be different from the word type.\n   67 |                 (x >> pos) | (x << ($n - pos))\n   68 |             }\n   69 | \n   70 |             #[inline]\n   71 |             fn rotate_left(x: $word_type, pos: $word_type) -> $word_type {\n   72 |                 // We can't use $word_type.rotate_left here because the word size might be different from the word type.\n   73 |                 (x << pos) | (x >> ($n - pos))\n   74 |             }","lines":11,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/speck-cipher/src/lib.rs#L64-L74"},{"ref":"speck-cipher/src/lib.rs:90-102","code":"   90 |             #[inline]\n   91 |             fn inverse_round_function(\n   92 |                 k: $word_type,\n   93 |                 mut x: $word_type,\n   94 |                 mut y: $word_type,\n   95 |             ) -> ($word_type, $word_type) {\n   96 |                 y = (y ^ x) & $mask;\n   97 |                 y = $name::rotate_right(y, $beta);\n   98 |                 x = (x ^ k) & $mask;\n   99 |                 x = <$word_type>::wrapping_sub(x, y) & $mask;\n  100 |                 x = $name::rotate_left(x, $alpha);\n  101 |                 (x, y)\n  102 |             }","lines":13,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/speck-cipher/src/lib.rs#L90-L102"}]},
{"id":"OTHER_47","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`intermediate128` asserts only the 40 subkeys and never checks `twofish.s`, unlike its siblings `intermediate192` (which asserts `&twofish.s[..12]`) and `intermediate256` (`&twofish.s[..]`). Because the test uses an all-zero key, the S-box key derived by `rs_mult` is all zeros, so the test would still pass if `rs_mult` were completely broken and simply returned zeros - and no other `intermediate*` test covers the `k == 2` (128-bit) branch of the S-box key computation. None of the three tests assert the `start` field either, even though it selects the S-box ordering in `g_func`.","fix":"Add an `assert_eq!(twofish.start, 2)` and a second 128-bit case built from a non-zero key (e.g. the first 16 bytes of the `0x0123456789ABCDEF...` key already used by `intermediate192`) with the expected `s[..8]` value from the Twofish specification, so that the `k == 2` path through `rs_mult` is actually pinned down.","locations":[{"ref":"twofish/src/tests.rs:3-16","code":"    3 | #[test]\n    4 | fn intermediate128() {\n    5 |     let key = [0u8; 16];\n    6 |     let twofish = Twofish::new_from_slice(&key).unwrap();\n    7 |     let subkeys: [u32; 40] = [\n    8 |         0x52C54DDE, 0x11F0626D, 0x7CAC9D4A, 0x4D1B4AAA, 0xB7B83A10, 0x1E7D0BEB, 0xEE9C341F,\n    9 |         0xCFE14BE4, 0xF98FFEF9, 0x9C5B3C17, 0x15A48310, 0x342A4D81, 0x424D89FE, 0xC14724A7,\n   10 |         0x311B834C, 0xFDE87320, 0x3302778F, 0x26CD67B4, 0x7A6C6362, 0xC2BAF60E, 0x3411B994,\n   11 |         0xD972C87F, 0x84ADB1EA, 0xA7DEE434, 0x54D2960F, 0xA2F7CAA8, 0xA6B8FF8C, 0x8014C425,\n   12 |         0x6A748D1C, 0xEDBAF720, 0x928EF78C, 0x0338EE13, 0x9949D6BE, 0xC8314176, 0x07C07D68,\n   13 |         0xECAE7EA7, 0x1FE71844, 0x85C05C89, 0xF298311E, 0x696EA672,\n   14 |     ];\n   15 |     assert_eq!(&twofish.k[..], &subkeys[..]);\n   16 | }","lines":14,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/twofish/src/tests.rs#L3-L16"},{"ref":"twofish/src/tests.rs:36-37","code":"   36 |     assert_eq!(&twofish.s[..12], &sboxkey[..]);\n   37 |     assert_eq!(&twofish.k[..], &subkeys[..]);","lines":2,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/twofish/src/tests.rs#L36-L37"}]},
{"id":"OTHER_48","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"The entire `xtea` crate is validated by a single test vector (one key, one plaintext, one block) taken from a web page rather than from the reference implementation or a standards document. There is no multi-block test, so the `BlockCipherEncBackend`/`BlockCipherDecBackend` dispatch used by `encrypt_blocks`/`decrypt_blocks` is never exercised, and there is no test at all for the `zeroize` feature even though `cargo test --all-features` is run in CI. Sibling crates such as `camellia`, `serpent` and `idea` use `cipher::block_cipher_test!` with blob files, which covers both the single- and multi-block paths.","fix":"Add more vectors (the XTEA reference implementation and the Botan/Crypto++ test suites both publish sets) and drive them through `cipher::block_cipher_test!` with a `tests/data/xtea.blb` blob, as `camellia/tests/mod.rs` does, so that the multi-block backend path is covered as well.","locations":[{"ref":"xtea/tests/mod.rs:1-18","code":"    1 | use cipher::{BlockCipherDecrypt, BlockCipherEncrypt, KeyInit, array::Array};\n    2 | use xtea::Xtea;\n    3 | \n    4 | #[test]\n    5 | fn xtea() {\n    6 |     // https://web.archive.org/web/20231115163347/https://asecuritysite.com/encryption/xtea\n    7 |     let key = b\"0123456789012345\";\n    8 |     let plaintext = b\"ABCDEFGH\";\n    9 |     let ciphertext = [0xea, 0x0c, 0x3d, 0x7c, 0x1c, 0x22, 0x55, 0x7f];\n   10 |     let cipher = Xtea::new_from_slice(key).unwrap();\n   11 | \n   12 |     let mut block = Array(*plaintext);\n   13 |     cipher.encrypt_block(&mut block);\n   14 |     assert_eq!(ciphertext, block.as_slice());\n   15 | \n   16 |     cipher.decrypt_block(&mut block);\n   17 |     assert_eq!(plaintext, block.as_slice());\n   18 | }","lines":18,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/xtea/tests/mod.rs#L1-L18"}]},
{"id":"OTHER_49","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"`aes` and `threefish` are the only two crates that depend on the `zeroize` crate directly and rely on Cargo's *implicit* optional-dependency feature rather than declaring the feature: neither `[features]` table lists `zeroize`, so the crate's public feature surface is not visible in the manifest (only `hazmat` is listed for `aes`, only `default` for `threefish`). The other 19 crates declare `zeroize = [\"cipher/zeroize\"]` explicitly. The two implicit ones also use different `zeroize` minimum versions (`1.9` in `aes`, `1.6` in `threefish`) and neither forwards to `cipher/zeroize`, so `cipher`'s own types are not zeroize-enabled when a downstream user turns on `aes/zeroize`.","fix":"Add explicit declarations so the feature is documented and cannot be enabled implicitly, e.g. in `threefish/Cargo.toml`:\n```toml\n[dependencies]\ncipher = { version = \"0.5\", optional = true }\nzeroize = { version = \"1.9\", optional = true, default-features = false }\n\n[features]\ndefault = [\"cipher\"]\nzeroize = [\"dep:zeroize\", \"cipher?/zeroize\"]\n```\nand the analogous `zeroize = [\"dep:zeroize\", \"cipher/zeroize\"]` in `aes/Cargo.toml`.","locations":[{"ref":"aes/Cargo.toml:14-27","code":"   14 | [dependencies]\n   15 | cipher = \"0.5\"\n   16 | cpubits = \"0.1\"\n   17 | zeroize = { version = \"1.9\", optional = true, default-features = false }\n   18 | \n   19 | [target.'cfg(any(target_arch = \"aarch64\", target_arch = \"x86_64\", target_arch = \"x86\"))'.dependencies]\n   20 | cpufeatures = \"0.3\"\n   21 | \n   22 | [dev-dependencies]\n   23 | cipher = { version = \"0.5\", features = [\"dev\"] }\n   24 | hex-literal = \"1\"\n   25 | \n   26 | [features]\n   27 | hazmat = [] # Expose cryptographically hazardous APIs","lines":14,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/Cargo.toml#L14-L27"},{"ref":"threefish/Cargo.toml:14-23","code":"   14 | [dependencies]\n   15 | cipher = { version = \"0.5\", optional = true }\n   16 | zeroize = { version = \"1.6\", optional = true, default-features = false }\n   17 | \n   18 | [dev-dependencies]\n   19 | cipher = { version = \"0.5\", features = [\"dev\"] }\n   20 | hex-literal = \"1\"\n   21 | \n   22 | [features]\n   23 | default = [\"cipher\"]","lines":10,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/threefish/Cargo.toml#L14-L23"}]},
{"id":"OTHER_50","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"`BlockCipherEncBackend::encrypt_block` in the `soft` backend has two no-op `.into()` conversions (`Block` -> `Block` via the reflexive `From` impl), while the otherwise identical `decrypt_block` right below it does not. The asymmetry suggests a leftover from an earlier type refactor and makes the two paths look like they differ when they do not. I verified that removing both `.into()` calls compiles and the test suite still passes.","fix":"```rust\n-                blocks[0] = block.clone_in().into();\n+                blocks[0] = block.clone_in();\n                 let res = fixslice::$module::encrypt(&self.keys, &blocks);\n-                *block.get_out() = res[0].into();\n+                *block.get_out() = res[0];\n```","locations":[{"ref":"aes/src/backends/soft.rs:46-69","code":"   46 |         impl BlockCipherEncBackend for $name {\n   47 |             #[inline(always)]\n   48 |             fn encrypt_block(&self, mut block: InOut<'_, '_, Block>) {\n   49 |                 let mut blocks = BatchBlocks::<NativeWord>::default();\n   50 |                 blocks[0] = block.clone_in().into();\n   51 |                 let res = fixslice::$module::encrypt(&self.keys, &blocks);\n   52 |                 *block.get_out() = res[0].into();\n   53 |             }\n   54 | \n   55 |             #[inline(always)]\n   56 |             fn encrypt_par_blocks(&self, mut blocks: InOut<'_, '_, ParBlocks<Self>>) {\n   57 |                 let res = fixslice::$module::encrypt(&self.keys, blocks.get_in());\n   58 |                 *blocks.get_out() = res;\n   59 |             }\n   60 |         }\n   61 | \n   62 |         impl BlockCipherDecBackend for $name {\n   63 |             #[inline(always)]\n   64 |             fn decrypt_block(&self, mut block: InOut<'_, '_, Block>) {\n   65 |                 let mut blocks = BatchBlocks::<NativeWord>::default();\n   66 |                 blocks[0] = block.clone_in();\n   67 |                 let res = fixslice::$module::decrypt(&self.keys, &blocks);\n   68 |                 *block.get_out() = res[0];\n   69 |             }","lines":24,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/aes/src/backends/soft.rs#L46-L69"}]},
{"id":"OTHER_51","type":"other","type_label":"Other","severity":"negligible","difficulty":"easy","description":"`data[..len - 1].chunks_exact(BLOCK_SIZE)` is an unexplained trick for iterating exactly the first\n`n - 1` blocks: it works because `floor((len - 1) / 16) == ceil(len / 16) - 1` for every `len >= 1`,\nwhich is precisely what makes the same expression correct both when `len` is a multiple of\n`BLOCK_SIZE` and when the last block is partial. Nothing in the code says so, and the `- 1` reads\nlike an off-by-one error, so the next reader is likely to \"fix\" it.","fix":"Add a one-line comment such as `// data[..len - 1] yields exactly the n - 1 leading full blocks,\nwhether or not the last block is partial`, or make the intent explicit with\n`data[..(n - 1) * BLOCK_SIZE].chunks_exact(BLOCK_SIZE)`.","locations":[{"ref":"belt-block/src/lib.rs:117-120","code":"  117 |     for i in 1..(2 * n + 1) {\n  118 |         let s = data[..len - 1]\n  119 |             .chunks_exact(BLOCK_SIZE)\n  120 |             .fold(Block::default(), xor);","lines":4,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/belt-block/src/lib.rs#L117-L120"},{"ref":"belt-block/src/lib.rs:154-158","code":"  154 |         let r1 = data[..len - 1]\n  155 |             .chunks_exact(BLOCK_SIZE)\n  156 |             .skip(1)\n  157 |             .fold(s, xor);\n  158 |         data[..BLOCK_SIZE].copy_from_slice(&r1);","lines":5,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/belt-block/src/lib.rs#L154-L158"}]},
{"id":"OTHER_52","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"Several items in this slice are declared `pub` inside private modules, so they are unreachable\noutside their crate but are typed as if they were part of the public API: `cast5::schedule::key_schedule`\nand every `pub const S1..S8` / `TM` / `TR` / `SHIFTS` / `SBOXES`. `clippy::pedantic` flags this\n(`redundant_pub_crate` catches the inverse in `camellia/src/utils.rs`, which correctly uses\n`pub(crate)`). The inconsistency makes it harder to see at a glance what is actually exported, and\n`pub` items in private modules are exempt from the crate's `#![warn(missing_docs)]`, which is part of\nwhy the constant tables ended up undocumented.","fix":"Change `pub` to `pub(crate)` on all items in `cast5/src/schedule.rs`, `cast5/src/consts.rs`,\n`cast6/src/consts.rs` and `des/src/consts.rs`, e.g.:\n\n```rust\npub(crate) fn key_schedule(x: &mut [u32; 4], z: &mut [u32; 4], k: &mut [u32; 16]) {\npub(crate) const S1: [u32; 256] = [\npub(crate) const SHIFTS: [u8; 16] = [1, 1, 2, 2, 2, 2, 2, 2, 1, 2, 2, 2, 2, 2, 2, 1];\n```","locations":[{"ref":"cast5/src/schedule.rs:10","code":"   10 | pub fn key_schedule(x: &mut [u32], z: &mut [u32], k: &mut [u32]) {","lines":1,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/cast5/src/schedule.rs#L10"},{"ref":"cast5/src/consts.rs:3","code":"    3 | pub const S1: [u32; 256] = [","lines":1,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/cast5/src/consts.rs#L3"},{"ref":"cast6/src/consts.rs:3","code":"    3 | pub const S1: [u32; 256] = [","lines":1,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/cast6/src/consts.rs#L3"},{"ref":"des/src/consts.rs:1","code":"    1 | pub const SHIFTS: [u8; 16] = [1, 1, 2, 2, 2, 2, 2, 2, 1, 2, 2, 2, 2, 2, 2, 1];","lines":1,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/des/src/consts.rs#L1"}]},
{"id":"OTHER_53","type":"other","type_label":"Other","severity":"negligible","difficulty":"easy","description":"The four TDES `KeyInit::new` implementations slice-then-`try_into().unwrap()` ten times in total (`key[0..8].try_into().unwrap()`), even though `Key<Self>` is a fixed-size `Array<u8, U24>`/`Array<u8, U16>` and the lengths are known at compile time. The `unwrap`s are unreachable, but they add panic branches inside a `#![deny(unsafe_code)]` cryptographic crate and are inconsistent with `Des`'s own `KeyInit`, which uses the infallible `key.0` instead.","fix":"Use the statically-checked split helpers from `hybrid-array` instead of runtime `try_into`, e.g. `let (k1, rest) = key.split_ref::<U8>(); let (k2, k3) = rest.split_ref::<U8>();` and then `u64::from_be_bytes(k1.0)`. This removes all ten panic paths. (Best applied together with the fix that routes construction through `Des::new`.)","locations":[{"ref":"des/src/tdes.rs:29-32","code":"   29 |     fn new(key: &Key<Self>) -> Self {\n   30 |         let k1 = u64::from_be_bytes(key[0..8].try_into().unwrap());\n   31 |         let k2 = u64::from_be_bytes(key[8..16].try_into().unwrap());\n   32 |         let k3 = u64::from_be_bytes(key[16..24].try_into().unwrap());","lines":4,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/des/src/tdes.rs#L29-L32"},{"ref":"des/src/tdes.rs:113-116","code":"  113 |     fn new(key: &Key<Self>) -> Self {\n  114 |         let k1 = u64::from_be_bytes(key[0..8].try_into().unwrap());\n  115 |         let k2 = u64::from_be_bytes(key[8..16].try_into().unwrap());\n  116 |         let k3 = u64::from_be_bytes(key[16..24].try_into().unwrap());","lines":4,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97631b8f50580a09/des/src/tdes.rs#L113-L116"},{"ref":"des/src/tdes.rs:196-198","code":"  196 |     fn new(key: &Key<Self>) -> Self {\n  197 |         let k1 = u64::from_be_bytes(key[0..8].try_into().unwrap());\n  198 {"id":"OTHER_54","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"In `e()` the two named constants `BLOCK_LEN = 32` and `RESULT_LEN = 48` exist only to be written as `BLOCK_LEN - 1` (= 31) and `RESULT_LEN - 1` (= 47) shift amounts, while the eight shifts in between are bare literals `1, 3, 5, 7, 9, 11, 13, 15`. The constants dress two magic numbers up as if they were derived from a length while leaving the rest magic, which is more confusing than uniform literals, and they are declared `usize` purely to be used as shift counts.","fix":"Either drop the two constants and use literals consistently:\n\nbefore\n```rust\n    const BLOCK_LEN: usize = 32;\n    const RESULT_LEN: usize = 48;\n\n    let b1 = (block << (BLOCK_LEN - 1)) & 0x8000000000000000;\n```\nafter\n```rust\n    let b1 = (block << 31) & 0x8000000000000000;\n```\n(with the matching `let b10 = (block >> 47) & 0x0000000000010000;`), or express *all ten* shifts in terms\nof the input/output widths so the naming actually earns its keep.","locations":[{"ref":"des/src/utils.rs:62-76","code":"   62 | fn e(block: u64) -> u64 {\n   63 |     const BLOCK_LEN: usize = 32;\n   64 |     const RESULT_LEN: usize = 48;\n   65 | \n   66 |     let b1 = (block << (BLOCK_LEN - 1)) & 0x8000000000000000;\n   67 |     let b2 = (block >> 1) & 0x7C00000000000000;\n   68 |     let b3 = (block >> 3) & 0x03F0000000000000;\n   69 |     let b4 = (block >> 5) & 0x000FC00000000000;\n   70 |     let b5 = (block >> 7) & 0x00003F0000000000;\n   71 |     let b6 = (block >> 9) & 0x000000FC00000000;\n   72 |     let b7 = (block >> 11) & 0x00000003F0000000;\n   73 |     let b8 = (block >> 13) & 0x000000000FC00000;\n   74 |     let b9 = (block >> 15) & 0x00000000003E0000;\n   75 |     let b10 = (block >> (RESULT_LEN - 1)) & 0x0000000000010000;\n   76 |     b1 | b2 | b3 | b4 | b5 | b6 | b7 | b8 | b9 | b10","lines":15,"link":"https://github.com/RustCrypto/block-ciphers/blob/99c6b37301341a22312aeedc97
