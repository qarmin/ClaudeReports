*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`cc::Build::get_compiler`, `get_archiver` and `get_ranlib` are documented to **panic** when the tool cannot be determined (they are `try_get_*().unwrap()` internally). This is a realistic build-time failure (no C compiler installed, unknown/cross target, missing `AR_<target>`), and because these calls sit inside `try_build`, the panic escapes the whole `Result`-based error path: the caller never gets the intended `cargo:warning=pavao-src: failed to build samba from source` message and instead sees a raw `cc` panic backtrace.","fix":"Use the fallible variants and map their errors into the function's `String` error type, e.g. `let compiler = cc.try_get_compiler().map_err(|e| format!(\"no C compiler: {e}\"))?;` and likewise `try_get_archiver()` / `try_get_ranlib()` for lines 1471, 1493 and 1560.","locations":[{"ref":"pavao-src/src/lib.rs:1624-1631","code":" 1624 |         let compiler = cc.get_compiler();\n 1625 |         let mut cc_env = compiler.cc_env();\n 1626 |         if cc_env.is_empty() {\n 1627 |             cc_env = compiler.path().to_path_buf().into_os_string();\n 1628 |         }\n 1629 | \n 1630 |         // get ar\n 1631 |         let ar = cc.get_archiver();","lines":8,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao-src/src/lib.rs#L1624-L1631"},{"ref":"pavao-src/src/lib.rs:1688","code":" 1688 |         let ranlib = cc.get_ranlib();","lines":1,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao-src/src/lib.rs#L1688"},{"ref":"pavao-src/src/lib.rs:1755","code":" 1755 |         let mut build_static = cc.get_archiver();","lines":1,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao-src/src/lib.rs#L1755"}]},
{"id":"UAF_1","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"hard","description":"`SmbFile` stores a raw `*mut SMBCFILE` and ties its validity to `&'a SmbClient`, which looks safe but\nis not: the `SMBCCTX` those handles belong to is a **process-global** `SMBCTX`, and\n`Drop for SmbClient` unconditionally calls `smbc_free_context(ctx, 1)` and nulls the global. With two\nlive `SmbClient` values (the second one reuses the existing global context and does not even apply\nits own options), dropping *either* client frees the context and closes all its files, leaving every\n`SmbFile` borrowed from the *other* client with a dangling handle. Its `read`/`write`/`seek` and its\n`Drop` then pass that stale pointer back into libsmbclient - use-after-free. The borrow checker gives\nno protection because the lifetime is attached to the wrong object (the client wrapper, not the\ncontext).","fix":"Make ownership match reality: refcount the shared context (e.g. `Arc<SmbContext>` handed to both `SmbClient` and `SmbFile`) and only call `smbc_free_context` when the last strong reference goes away, so a file keeps the context alive; or drop the global entirely and give each `SmbClient` its own `SMBCCTX` so that `&'a SmbClient` really does bound the handle's lifetime.","locations":[{"ref":"pavao/src/smb/types/file.rs:22-31","code":"   22 | pub struct SmbFile<'a> {\n   23 |     smbc: &'a SmbClient,\n   24 |     fd: *mut SMBCFILE,\n   25 | }\n   26 | \n   27 | impl<'a> SmbFile<'a> {\n   28 |     pub(crate) fn new(smbc: &'a SmbClient, fd: *mut SMBCFILE) -> Self {\n   29 |         Self { smbc, fd }\n   30 |     }\n   31 | }","lines":10,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao/src/smb/types/file.rs#L22-L31"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`auth_wrapper` casts the buffer lengths it receives from C with `wglen as usize`, `unlen as usize`, `pwlen as usize` without any validation. The lengths are `c_int`; a value of `0` makes `utils::write_to_cstr` compute `dest.add(len - 1)`, which underflows to `usize::MAX` and performs a wild out-of-bounds write, and a negative value becomes a huge `usize` that turns the following `slice::from_raw_parts_mut` into a gigantic slice. Since this is an FFI callback, the values come from outside the crate and should be treated as untrusted.","fix":"Validate before converting, e.g.\n\n```rust\nlet write = |dst: *mut c_char, len: c_int, val: &str| {\n    if !dst.is_null() && len > 0 {\n        utils::write_to_cstr(dst as *mut u8, len as usize, val);\n    }\n};\nwrite(wg, wglen, &creds.workgroup);\nwrite(un, unlen, &creds.username);\nwrite(pw, pwlen, &creds.password);\n```","locations":[{"ref":"pavao/src/smb/client.rs:666-668","code":"  666 |             utils::write_to_cstr(wg as *mut u8, wglen as usize, &creds.workgroup);\n  667 |             utils::write_to_cstr(un as *mut u8, unlen as usize, &creds.username);\n  668 |             utils::write_to_cstr(pw as *mut u8, pwlen as usize, &creds.password);","lines":3,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao/src/smb/client.rs#L666-L668"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`time_t_to_system_time` does `Duration::from_secs(t as u64)`, so a negative `time_t` (a pre-1970\ntimestamp, which SMB servers can return, e.g. after a bogus `btime`/`ctime`) is reinterpreted as a\nvalue near `1.8e19` seconds; `checked_add` then fails and the function silently returns `UNIX_EPOCH`.\nEvery negative timestamp therefore collapses to 1970-01-01 instead of the correct pre-epoch instant,\nand the caller has no way to notice.","fix":"Handle the sign explicitly:\n\n```rust\nfn time_t_to_system_time(t: time_t) -> SystemTime {\n    if t >= 0 {\n        UNIX_EPOCH.checked_add(Duration::from_secs(t as u64))\n    } else {\n        UNIX_EPOCH.checked_sub(Duration::from_secs(t.unsigned_abs()))\n    }\n    .unwrap_or(UNIX_EPOCH)\n}\n```","locations":[{"ref":"pavao/src/smb/types/stat.rs:307-311","code":"  307 | fn time_t_to_system_time(t: time_t) -> SystemTime {\n  308 |     UNIX_EPOCH\n  309 |         .checked_add(Duration::from_secs(t as u64))\n  310 |         .unwrap_or(UNIX_EPOCH)\n  311 | }","lines":5,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao/src/smb/types/stat.rs#L307-L311"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"The loop over `compiler.args()` accumulates nothing: every branch either `continue`s or falls through to an empty body, and the only lasting side effect is setting `ios_isysroot`. All of the compiler flags that `cc` computed for the requested target (`--target=`, `-m64`, `-arch`, `--sysroot`, the `opt_level(2)` flag, `-fPIC`, user `CFLAGS`/`CFLAGS_<target>`, etc.) are therefore silently thrown away and never reach samba's `configure`. Consequently `cc.target(target).host(host).warnings(false).opt_level(2)` on line 1463 is effectively a no-op except for locating the compiler binary, and only the bare compiler path is exported as `CC` (`cc_env()` is non-empty only when a compiler wrapper such as `sccache` is configured). This is a truncated copy of `openssl-src`'s argument-filtering loop, which built a `cflags` vector that was then passed to the configure step.","fix":"Collect the surviving arguments and export them, e.g. build a `Vec<OsString>` inside the loop and then `configure.env(\"CFLAGS\", joined_flags)` (merging, not replacing, any pre-existing `CFLAGS`). Also move the `if skip_next { ... }` check to the *top* of the loop body so the value following `-arch` cannot be reinterpreted by the `apple-ios` `-isysroot` branch. If passing the flags through is genuinely not wanted, delete the loop and keep only the `-isysroot` extraction, and drop the misleading `cc.warnings(false).opt_level(2)` configuration.","locations":[{"ref":"pavao-src/src/lib.rs:1693-1729","code":" 1693 |         let mut skip_next = false;\n 1694 |         let mut is_isysroot = false;\n 1695 |         let mut ios_isysroot = None;\n 1696 |         for arg in compiler.args() {\n 1697 |             // For whatever reason `-static` on MUSL seems to cause\n 1698 |             // issues...\n 1699 |             if target.contains(\"musl\") && arg == \"-static\" {\n 1700 |                 continue;\n 1701 |             }\n 1702 | \n 1703 |             // cc includes an `-arch` flag for Apple platforms, but we've\n 1704 |             // already selected an arch implicitly via the target above, and\n 1705 |             // OpenSSL contains about the conflict if both are specified.\n 1706 |             if target.contains(\"apple\") && arg == \"-arch\" {\n 1707 |                 skip_next = true;\n 1708 |                 continue;\n 1709 |             }\n 1710 | \n 1711 |             // cargo-lipo specifies this but OpenSSL complains\n 1712 |             if target.contains(\"apple-ios\") {\n 1713 |                 if arg == \"-isysroot\" {\n 1714 |                     is_isysroot = true;\n 1715 |                     continue;\n 1716 |                 }\n 1717 | \n 1718 |                 if is_isysroot {\n 1719 |                     is_isysroot = false;\n 1720 |                     ios_isysroot = Some(arg.to_str().ok_or(\"isysroot arg\")?.to_string());\n 1721 |                     continue;\n 1722 |                 }\n 1723 |             }\n 1724 | \n 1725 |             if skip_next {\n 1726 |                 skip_next = false;\n 1727 |                 continue;\n 1728 |             }\n 1729 |         }","lines":37,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao-src/src/lib.rs#L1693-L1729"},{"ref":"pavao-src/src/lib.rs:1622-1628","code":" 1622 |         let mut cc = cc::Build::new();\n 1623 |         cc.target(target).host(host).warnings(false).opt_level(2);\n 1624 |         let compiler = cc.get_compiler();\n 1625 |         let mut cc_env = compiler.cc_env();\n 1626 |         if cc_env.is_empty() {\n 1627 |             cc_env = compiler.path().to_path_buf().into_os_string();\n 1628 |         }","lines":7,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao-src/src/lib.rs#L1622-L1628"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"All platform decisions in this crate are taken with `#[cfg(target_os = ...)]`, which in a build-support library evaluates against the **host** that the build script was compiled for, not the target being built. `self.target` is available and is even threaded into `cc` and `Self::os()`, yet `lib/util/gpfswrap.c`, `lib/tevent/tevent_epoll.c`, `--without-acl-support` and the gnutls include handling all key off the host. Cross-compiling (for example host Linux -> target macOS, or host macOS -> target Linux) therefore selects the wrong source list and the wrong `configure` flags, which surfaces as an opaque `object file not found for source file: ...` error from `find_object_for_src` rather than a meaningful diagnostic.","fix":"Decide platform-conditional behaviour from `self.target` (or `CARGO_CFG_TARGET_OS`) at run time instead of from `#[cfg]` at compile time. Turn `SRC_FILES` into a base list plus runtime-appended entries, e.g.:\n\n```rust\nlet mut sources: Vec<&str> = SRC_FILES.to_vec();\nif target.contains(\"linux\") {\n    sources.extend([\"lib/util/gpfswrap.c\", \"lib/tevent/tevent_epoll.c\"]);\n}\nif target.contains(\"apple\") {\n    configure.arg(\"--without-acl-support\");\n}\n```","locations":[{"ref":"pavao-src/src/lib.rs:110-111","code":"  110 |     #[cfg(target_os = \"linux\")]\n  111 |     \"lib/util/gpfswrap.c\",","lines":2,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao-src/src/lib.rs#L110-L111"},{"ref":"pavao-src/src/lib.rs:133-134","code":"  133 |     #[cfg(target_os = \"linux\")]\n  134 |     \"lib/tevent/tevent_epoll.c\",","lines":2,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao-src/src/lib.rs#L133-L134"},{"ref":"pavao-src/src/lib.rs:1476-1477","code":" 1476 |     #[cfg(target_os = \"linux\")]\n 1477 |     \"lib/tevent/tevent_epoll.c\",","lines":2,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao-src/src/lib.rs#L1476-L1477"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`lib/util/charset/charset_macosxfs.c` is listed unconditionally, although it is the macOS/HFS+ specific charset module that samba's build only enables on Darwin hosts. Every other platform-specific entry in these tables (`lib/util/gpfswrap.c`, `lib/tevent/tevent_epoll.c`) is guarded by a `#[cfg]`, so this entry is inconsistent with its siblings. If waf does not compile it on the current platform, no `.o` exists and `find_object_for_src` makes the entire build fail with `object file not found for source file: .../charset_macosxfs.c`; if it *is* always compiled, then the `#[cfg]` guards on the other two entries are pointless. Either way the list and the guards disagree.","fix":"Guard `\"lib/util/charset/charset_macosxfs.c\"` for Apple targets only (in the same runtime, target-based way recommended for `gpfswrap.c`/`tevent_epoll.c`), and make missing objects for optional modules non-fatal - e.g. keep a small `OPTIONAL_SRC` list whose entries are skipped when `find_object_for_src` returns `None` instead of aborting the build.","locations":[{"ref":"pavao-src/src/lib.rs:144","code":"  144 |     \"lib/util/charset/charset_macosxfs.c\",","lines":1,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao-src/src/lib.rs#L144"},{"ref":"pavao-src/src/lib.rs:110-111","code":"  110 |     #[cfg(target_os = \"linux\")]\n  111 |     \"lib/util/gpfswrap.c\",","lines":2,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao-src/src/lib.rs#L110-L111"},{"ref":"pavao-src/src/lib.rs:133-134","code":"  133 |     #[cfg(target_os = \"linux\")]\n  134 |     \"lib/tevent/tevent_epoll.c\",","lines":2,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao-src/src/lib.rs#L133-L134"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`Build::gnutls()` is public and unconditional, but the stored paths are only ever read inside `#[cfg(target_os = \"macos\")]`. On every other host the include directories a caller supplies are accepted and silently discarded, so a gnutls installed in a non-standard prefix on Linux/BSD cannot be found and `configure` fails for a reason the caller believes they already handled. Because the field is never read on non-macOS hosts, it also triggers a `field is never read` dead-code warning there.","fix":"Apply the include paths on all platforms: call `add_env_includes(&mut configure, paths)` whenever `self.gnutls` is `Some`, and remove the `#[cfg(target_os = \"macos\")]` gate from both the call site and the `add_env_includes` definition. Keep the \"required on macOS\" check (`ok_or(\"gnutls paths not set\")`) as the only platform-specific part.","locations":[{"ref":"pavao-src/src/lib.rs:1507","code":" 1507 |     gnutls: Option<Vec<PathBuf>>,","lines":1,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao-src/src/lib.rs#L1507"},{"ref":"pavao-src/src/lib.rs:1555-1558","code":" 1555 |     pub fn gnutls(&mut self, paths: Vec<PathBuf>) -> &mut Build {\n 1556 |         self.gnutls = Some(paths);\n 1557 |         self\n 1558 |     }","lines":4,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao-src/src/lib.rs#L1555-L1558"},{"ref":"pavao-src/src/lib.rs:1682-1686","code":" 1682 |         #[cfg(target_os = \"macos\")]\n 1683 |         {\n 1684 |             let gnutls_paths = self.gnutls.as_ref().ok_or(\"gnutls paths not set\")?;\n 1685 |             add_env_includes(&mut configure, gnutls_paths)?;\n 1686 |         }","lines":5,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao-src/src/lib.rs#L1682-L1686"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"Because `Self::os(target)?` is called before anything else and errors out on unrecognised triples, the build aborts for targets that would build perfectly well - the returned value is only used to detect the iOS simulator. Ordinary triples missing from the table (for instance `sparc64-unknown-linux-gnu`, `x86_64-unknown-linux-gnux32`, `armv7-unknown-linux-gnueabihf`-style variants added after the table was copied, or the renamed `wasm32-wasip1`) fail with the misleading message `don't know how to configure OpenSSL for <target>`, in a crate that does not build OpenSSL. The table also contains `\"x86_64-linux\"`, which is not a rustc target triple at all.","fix":"Do not fail on unknown targets: drop the lookup entirely (see the related `dead_code` finding) or make it non-fatal, e.g. `let os = Self::os(target).unwrap_or(\"\");`. If a lookup failure is kept, reword the message to mention samba rather than OpenSSL.","locations":[{"ref":"pavao-src/src/lib.rs:1606","code":" 1606 |         let os = Self::os(target)?;","lines":1,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao-src/src/lib.rs#L1606"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`pavao-sys/build.rs` uses `cfg!(target_os = ...)` and `cfg!(target_arch = ...)` to decide which library search paths to emit. Build scripts are compiled and run for the *host*, so these macros describe the machine doing the build, not the machine being built for. Cross-compiling (e.g. host x86_64 Linux, target aarch64-apple-darwin, or an x86_64 host building for aarch64) therefore emits the wrong `rustc-link-search` paths and skips the macOS-specific ones entirely, producing confusing link failures.","fix":"Read the target from the environment instead, e.g.\n\n```rust\nlet target_os = std::env::var(\"CARGO_CFG_TARGET_OS\").unwrap();\nlet target_arch = std::env::var(\"CARGO_CFG_TARGET_ARCH\").unwrap();\nif target_os == \"macos\" {\n    if target_arch == \"aarch64\" { /* ... */ }\n}\n```\n\nand replace every `cfg!(target_os = ..)` / `cfg!(target_arch = ..)` in `build_normal`, `build_vendored` and `add_library` with these values.","locations":[{"ref":"pavao-sys/build.rs:27-36","code":"   27 |             if cfg!(target_os = \"macos\") {\n   28 |                 if cfg!(target_arch = \"aarch64\") {\n   29 |                     println!(\"cargo:rustc-link-search=/opt/homebrew/opt/samba/lib\");\n   30 |                 } else if cfg!(target_arch = \"x86_64\") {\n   31 |                     println!(\"cargo:rustc-link-search=/usr/local/Homebrew/opt/samba/lib\");\n   32 |                 }\n   33 |                 println!(\"cargo:rustc-link-lib=smbclient\");\n   34 |             } else {\n   35 |                 println!(\"cargo:rustc-link-lib=smbclient\");\n   36 |             }","lines":10,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao-sys/build.rs#L27-L36"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"The Homebrew library path used for Intel macOS is wrong. On x86_64 macOS the Homebrew prefix is `/usr/local`, so formula libraries live in `/usr/local/opt/<formula>/lib`; `/usr/local/Homebrew` is the Homebrew *repository* checkout and contains no `opt` directory. Every x86_64 branch therefore emits a search path that does not exist, so the fallback path (used whenever `pkg-config` cannot find the library) never actually helps on Intel Macs and the link fails with an unresolved-symbol error instead.","fix":"Replace the three occurrences of\n\n```rust\nprintln!(\"cargo:rustc-link-search=/usr/local/Homebrew/opt/{brew_name}/lib\");\n```\n\n(and the `samba` variant on line 20) with\n\n```rust\nprintln!(\"cargo:rustc-link-search=/usr/local/opt/{brew_name}/lib\");\n```","locations":[{"ref":"pavao-sys/build.rs:30-32","code":"   30 |                 } else if cfg!(target_arch = \"x86_64\") {\n   31 |                     println!(\"cargo:rustc-link-search=/usr/local/Homebrew/opt/samba/lib\");\n   32 |                 }","lines":3,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao-sys/build.rs#L30-L32"},{"ref":"pavao-sys/build.rs:148-150","code":"  148 |                 } else if cfg!(target_arch = \"x86_64\") {\n  149 |                     println!(\"cargo:rustc-link-search=/usr/local/Homebrew/opt/{brew_name}/lib\");\n  150 |                 }","lines":3,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao-sys/build.rs#L148-L150"},{"ref":"pavao-sys/build.rs:148-150","code":"  148 |                 } else if cfg!(target_arch = \"x86_64\") {\n  149 |                     println!(\"cargo:rustc-link-search=/usr/local/Homebrew/opt/{brew_name}/lib\");\n  150 |                 }","lines":3,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao-sys/build.rs#L148-L150"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The `linux_*` cfg aliases cover only `x86_64`, `aarch64`, `arm` and `riscv64`. `SmbStatVfs::from(statvfs)` selects each struct field with a chain of mutually exclusive `#[cfg]` attributes built from those aliases plus `target_os = \"android\"/\"macos\"/\"openbsd\"`, so on any other Linux architecture (`i686`, `powerpc64le`, `s390x`, `mips`, ...) *no* arm matches and the struct literal is missing `blocks`, `bfree`, `bavail`, `files`, `ffree`, ... - a hard compile error rather than a graceful failure. The supported-platform set is encoded implicitly in a build script instead of being enforced or made exhaustive.","fix":"Stop enumerating architectures: build `SmbStatVfs` with plain `as u64` casts for every field (a widening cast is a no-op where the field is already `u64` and clippy can be silenced with `#[allow(clippy::unnecessary_cast)]`), which works on every platform. If per-arch code really is needed, add a final `#[cfg(not(any(...)))] compile_error!(\"unsupported target\")` so unsupported targets fail with a clear message.","locations":[{"ref":"pavao/build.rs:13-18","code":"   13 |         // exclusive features\n   14 |         linux_aarch64: { all(linux, aarch64, unix) },\n   15 |         linux_riscv64: { all(linux, riscv64, unix) },\n   16 |         linux_x86_64: { all(linux, x86_64, unix) },\n   17 |         linux_arm: { all(linux, arm, unix) },\n   18 |     }","lines":6,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao/build.rs#L13-L18"},{"ref":"pavao/src/smb/types/stat.rs:43-60","code":"   43 | impl From<statvfs> for SmbStatVfs {\n   44 |     fn from(s: statvfs) -> Self {\n   45 |         Self {\n   46 |             bsize: s.f_bsize as u64,\n   47 |             frsize: s.f_frsize as u64,\n   48 |             #[cfg(target_os = \"android\")]\n   49 |             blocks: s.f_blocks,\n   50 |             #[cfg(target_os = \"macos\")]\n   51 |             blocks: s.f_blocks as u64,\n   52 |             #[cfg(linux_x86_64)]\n   53 |             blocks: s.f_blocks,\n   54 |             #[cfg(linux_aarch64)]\n   55 |             blocks: s.f_blocks,\n   56 |             #[cfg(linux_arm)]\n   57 |             blocks: s.f_blocks as u64,\n   58 |             #[cfg(linux_riscv64)]\n   59 |             blocks: s.f_blocks,\n   60 |             #[cfg(target_os = \"openbsd\")]","lines":18,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao/src/smb/types/stat.rs#L43-L60"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`From<SmbMode> for mode_t` reconstructs only the 9 permission bits, so the conversion is **not** the\ninverse of `From<mode_t> for SmbMode`: the file-type bits (`S_IFMT`, i.e. `0o170000`) and the\nsetuid/setgid/sticky bits (`0o7000`) are silently discarded. `SmbMode::from(0o104755)` converted back\nyields `0o755`, so `SmbClient::chmod` (which does `chmod_fn(..., mode.into())` in\n`pavao/src/smb/client.rs:368`) silently drops setuid/setgid/sticky whenever the caller round-trips a\nmode obtained from `SmbStat::mode`. The struct also has no way to represent those bits at all, and\n`SmbMode` has no public constructor other than `From<mode_t>`, so a user cannot restore them.","fix":"Keep the non-permission bits so the round-trip is lossless, e.g. add a private field and OR it back:\n\n```rust\npub struct SmbMode {\n    type_: SmbFileType,\n    extra: mode_t, // S_IFMT | S_ISUID | S_ISGID | S_ISVTX bits as received\n    mode: (SmbModeClass, SmbModeClass, SmbModeClass),\n}\n\nimpl From<SmbMode> for mode_t {\n    fn from(pex: SmbMode) -> Self {\n        pex.extra\n            | (mode_t::from(pex.mode.0) << 6)\n            | (mode_t::from(pex.mode.1) << 3)\n            | mode_t::from(pex.mode.2)\n    }\n}\n```\n\nIf that is not desired, at minimum document on both `impl` blocks that only the low 9 bits survive the conversion.","locations":[{"ref":"pavao/src/smb/types/mode.rs:66-83","code":"   66 | impl From<SmbMode> for mode_t {\n   67 |     fn from(pex: SmbMode) -> Self {\n   68 |         (mode_t::from(pex.mode.0) << 6) + (mode_t::from(pex.mode.1) << 3) + mode_t::from(pex.mode.2)\n   69 |     }\n   70 | }\n   71 | \n   72 | impl From<mode_t> for SmbMode {\n   73 |     fn from(x: mode_t) -> Self {\n   74 |         Self {\n   75 |             type_: SmbFileType::from(x),\n   76 |             mode: (\n   77 |                 SmbModeClass::from(((x >> 6) & 0x7) as mode_t),\n   78 |                 SmbModeClass::from(((x >> 3) & 0x7) as mode_t),\n   79 |                 SmbModeClass::from((x & 0x7) as mode_t),\n   80 |             ),\n   81 |         }\n   82 |     }\n   83 | }","lines":18,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao/src/smb/types/mode.rs#L66-L83"},{"ref":"pavao/src/smb/types/mode.rs:9-12","code":"    9 | pub struct SmbMode {\n   10 |     type_: SmbFileType,\n   11 |     mode: (SmbModeClass, SmbModeClass, SmbModeClass),\n   12 | }","lines":4,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao/src/smb/types/mode.rs#L9-L12"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"Object paths are passed to `ar` via `object_file.display().to_string()`, which is lossy: any non-UTF-8 byte in `OUT_DIR` (legal on Unix) is replaced by U+FFFD, so `ar` is handed a path that does not exist and the archive step fails with a confusing error. `Command::arg` accepts `AsRef<OsStr>`, so the conversion is unnecessary.","fix":"Pass the path directly:\n\n```rust\n// before\nbuild_static.arg(object_file.display().to_string());\n// after\nbuild_static.arg(&object_file);\n```","locations":[{"ref":"pavao-src/src/lib.rs:1782","code":" 1782 |             build_static.arg(object_file.display().to_string());","lines":1,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao-src/src/lib.rs#L1782"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"All timestamp conversions throw away sub-second precision. `TryFrom<libsmb_file_info>` uses only\n`*_ts.tv_sec` and ignores `tv_nsec`, even though libsmbclient hands over full `struct timespec`\nvalues; `From<stat>` likewise uses `st_atime`/`st_mtime`/`st_ctime` instead of\n`st_atim`/`st_mtim`/`st_ctim`. Since the public type is `SystemTime`, which can represent\nnanoseconds, the loss is gratuitous and makes timestamp comparison/sync logic (a common use for\nthese fields) inaccurate by up to one second.","fix":"Add a `timespec`-based helper and use it everywhere:\n\n```rust\nfn timespec_to_system_time(ts: libc::timespec) -> SystemTime {\n    time_t_to_system_time(ts.tv_sec)\n        .checked_add(Duration::from_nanos(ts.tv_nsec.clamp(0, 999_999_999) as u64))\n        .unwrap_or(UNIX_EPOCH)\n}\n```\n\nthen `ctime: timespec_to_system_time(di.ctime_ts)` etc., and in `From<stat>` use `s.st_atim`/`s.st_mtim`/`s.st_ctim` (falling back to the `st_*time` fields on platforms that lack them).","locations":[{"ref":"pavao/src/smb/types/stat.rs:285-311","code":"  285 | impl TryFrom<libsmb_file_info> for SmbDirentInfo {\n  286 |     type Error = SmbError;\n  287 | \n  288 |     fn try_from(di: libsmb_file_info) -> Result<Self, Self::Error> {\n  289 |         let name = char_ptr_to_string(di.name)?;\n  290 |         let short_name = char_ptr_to_string(di.short_name)?;\n  291 | \n  292 |         Ok(Self {\n  293 |             name,\n  294 |             short_name,\n  295 |             size: di.size as u64,\n  296 |             ctime: time_t_to_system_time(di.ctime_ts.tv_sec),\n  297 |             btime: time_t_to_system_time(di.btime_ts.tv_sec),\n  298 |             mtime: time_t_to_system_time(di.mtime_ts.tv_sec),\n  299 |             atime: time_t_to_system_time(di.atime_ts.tv_sec),\n  300 |             uid: di.uid,\n  301 |             gid: di.gid,\n  302 |             attrs: di.attrs,\n  303 |         })\n  304 |     }\n  305 | }\n  306 | \n  307 | fn time_t_to_system_time(t: time_t) -> SystemTime {\n  308 |     UNIX_EPOCH\n  309 |         .checked_add(Duration::from_secs(t as u64))\n  310 |         .unwrap_or(UNIX_EPOCH)\n  311 | }","lines":27,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao/src/smb/types/stat.rs#L285-L311"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"`RANLIB` is exported as the program *plus* its arguments (lines 1493-1496), but the immediately adjacent `AR` export passes only `ar.get_program()` and silently drops `ar.get_args()`. Toolchains where `cc` returns an archiver with arguments (LLVM/Android/Emscripten wrappers, `llvm-ar` invoked through a driver, `AR_<target>` set to a command with flags) therefore get a truncated `AR` and samba's `configure`/`make` archives objects with the wrong tool invocation.","fix":"Build `AR` the same way `RANLIB` is built:\n\n```rust\nlet mut ar_args = vec![ar.get_program()];\nar_args.extend(ar.get_args());\nconfigure.env(\"AR\", ar_args.join(OsStr::new(\" \")));\n```\n\n(Note that joining with spaces still breaks on tool paths containing spaces for both variables; quote or use the `_ARGS`-style variables samba supports if that matters.)","locations":[{"ref":"pavao-src/src/lib.rs:1679-1691","code":" 1679 |         configure.env(\"CC\", cc_env);\n 1680 |         configure.env(\"AR\", ar.get_program());\n 1681 |         // On MacOS we need to explicitly declare include paths for gnutls\n 1682 |         #[cfg(target_os = \"macos\")]\n 1683 |         {\n 1684 |             let gnutls_paths = self.gnutls.as_ref().ok_or(\"gnutls paths not set\")?;\n 1685 |             add_env_includes(&mut configure, gnutls_paths)?;\n 1686 |         }\n 1687 | \n 1688 |         let ranlib = cc.get_ranlib();\n 1689 |         let mut args = vec![ranlib.get_program()];\n 1690 |         args.extend(ranlib.get_args());\n 1691 |         configure.env(\"RANLIB\", args.join(OsStr::new(\" \")));","lines":13,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao-src/src/lib.rs#L1679-L1691"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"The cfg alias `android: { target_arch = \"android\" }` is wrong: `android` is a `target_os`, never a `target_arch`, so the alias can never evaluate to true. It is also unused - `pavao/src/smb/types/stat.rs` writes `#[cfg(target_os = \"android\")]` directly - so it is simultaneously dead and misleading (a future reader who starts using `#[cfg(android)]` gets silently-disabled code).","fix":"Fix or delete the alias:\n\n```rust\n        android: { target_os = \"android\" },\n```\n\ninstead of\n\n```rust\n        android: { target_arch = \"android\" },\n```","locations":[{"ref":"pavao/build.rs:5-12","code":"    5 |         // Platforms\n    6 |         aarch64: { target_arch = \"aarch64\" },\n    7 |         android: { target_arch = \"android\" },\n    8 |         arm: { target_arch = \"arm\" },\n    9 |         riscv64: { target_arch = \"riscv64\" },\n   10 |         x86_64: { target_arch = \"x86_64\" },\n   11 |         linux: { target_os = \"linux\" },\n   12 |         macos: { target_os = \"macos\" },","lines":8,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao/build.rs#L5-L12"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`Drop for SmbFile` is the only way a file is closed, and it discards every failure: the return value\nof `close_fn` is ignored, and if `self.smbc.ctx()` or `get_fn(..., smbc_getFunctionClose)` fails the\nhandle is never closed at all (silent leak of the server-side handle for the lifetime of the\ncontext). Since `flush()` is a no-op, `close` is the last point at which the server can report a\nwrite error (out of quota, disk full, lease break), so a write can appear to have succeeded while the\ndata was rejected. There is also no `close()`/`into_inner()` method that would let a caller observe\nthe error.","fix":"Add an explicit `pub fn close(mut self) -> SmbResult<()>` that performs the close, checks the result with `utils::to_result_with_le`, marks the handle as already closed (e.g. set `self.fd = std::ptr::null_mut()` and have `Drop` skip a null fd), and keep `Drop` as a best-effort fallback that at least logs: `if close_fn(ctx, self.fd) < 0 { error!(\"failed to close file: {}\", utils::last_os_error()); }`.","locations":[{"ref":"pavao/src/smb/types/file.rs:72-75","code":"   72 |     fn flush(&mut self) -> io::Result<()> {\n   73 |         trace!(\"flush is not supported on SmbFile\");\n   74 |         Ok(())\n   75 |     }","lines":4,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao/src/smb/types/file.rs#L72-L75"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"very_easy","description":"`Seek::seek` wraps the `lseek` result with `utils::to_result_with_errno(res, libc::EINVAL)`, which\nhard-codes `EINVAL` as the reported error. Any failure - `EBADF` on a stale handle, `ENOTSUP`,\n`EIO`, a broken connection - is reported to the caller as `InvalidInput`, discarding the real `errno`\nthat libsmbclient just set. The `Read` and `Write` impls in the same file correctly use\n`to_result_with_le`, which reads `errno`, so this is an inconsistency inside one file.","fix":"Use the real OS error, like the `Read`/`Write` impls do:\n\n```rust\nlet res = utils::to_result_with_le(res)?;\n```\n\ninstead of `let res = utils::to_result_with_errno(res, libc::EINVAL)?;`","locations":[{"ref":"pavao/src/smb/types/file.rs:88-90","code":"   88 |             let res = lseek_fn(ctx, self.fd, off, whence);\n   89 |             let res = utils::to_result_with_errno(res, libc::EINVAL)?;\n   90 |             Ok(res as u64)","lines":3,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao/src/smb/types/file.rs#L88-L90"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`Build::build()` is public library API but calls `std::process::exit(1)` on failure, which kills the calling process without unwinding, without running destructors and without giving the caller any chance to recover or to fall back to a system libsmbclient. The actual error text is only sent to stderr wrapped in blank lines, while the `cargo:warning` shown to users contains no detail at all. A library should not decide to terminate the process.","fix":"Have `build()` `panic!(\"{e}\")` (build scripts already treat a panic as a failed build and print the message) or, better, keep only `try_build` public and let the caller decide. Include the error text in the `cargo:warning` line - note that `cargo:warning` is single-line, so the multi-line error should also be printed to stderr as it is now.","locations":[{"ref":"pavao-src/src/lib.rs:1583-1592","code":" 1583 |     pub fn build(&mut self) -> Artifacts {\n 1584 |         match self.try_build() {\n 1585 |             Ok(a) => a,\n 1586 |             Err(e) => {\n 1587 |                 println!(\"cargo:warning=pavao-src: failed to build samba from source\");\n 1588 |                 eprintln!(\"\\n\\n\\n{e}\\n\\n\\n\");\n 1589 |                 std::process::exit(1);\n 1590 |             }\n 1591 |         }\n 1592 |     }","lines":10,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao-src/src/lib.rs#L1583-L1592"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`rename<S: AsRef<str>>(&self, orig_url: S, new_url: S)` and `print<S: AsRef<str>>(&self, p: S, print_queue: S)` use a *single* generic parameter for two independent arguments, forcing both to be exactly the same type. `client.rename(\"/a\", String::from(\"/b\"))` or `client.print(path_string, \"queue\")` does not compile, which is a gratuitous restriction (the same mistake is repeated in the test helper `create_file_at`).","fix":"Use one generic parameter per argument:\n\n```rust\npub fn rename<S: AsRef<str>, T: AsRef<str>>(&self, orig_url: S, new_url: T) -> SmbResult<()>\npub fn print<S: AsRef<str>, T: AsRef<str>>(&self, p: S, print_queue: T) -> SmbResult<()>\n```","locations":[{"ref":"pavao/src/smb/client.rs:287-290","code":"  287 |     pub fn rename<S>(&self, orig_url: S, new_url: S) -> SmbResult<()>\n  288 |     where\n  289 |         S: AsRef<str>,\n  290 |     {","lines":4,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao/src/smb/client.rs#L287-L290"},{"ref":"pavao/src/smb/client.rs:530-533","code":"  530 |     pub fn print<S>(&self, p: S, print_queue: S) -> SmbResult<()>\n  531 |     where\n  532 |         S: AsRef<str>,\n  533 |     {","lines":4,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao/src/smb/client.rs#L530-L533"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`TDB_SRC`, `TALLOC_SRC` and `TEVENT_SRC` are entirely redundant: all 15 `TDB_SRC` entries, the single `TALLOC_SRC` entry and all 15 `TEVENT_SRC` entries (including the `#[cfg(target_os = \"linux\")] tevent_epoll.c` guard) already appear verbatim in `SRC_FILES` at lines 84, 97-112 and 223-237. The `.chain(...)` calls and the `HashSet` deduplication exist only to paper over that duplication, and the duplicated data is a maintenance trap: editing one copy and not the other changes nothing today but will silently diverge.","fix":"Delete `TDB_SRC`, `TALLOC_SRC` and `TEVENT_SRC` and reduce the collection to `SRC_FILES` only:\n\n```rust\nlet unique_src: BTreeSet<&str> = SRC_FILES.iter().copied().collect();\n```","locations":[{"ref":"pavao-src/src/lib.rs:1441-1478","code":" 1441 | const TDB_SRC: &[&str] = &[\n 1442 |     \"lib/tdb/common/check.c\",\n 1443 |     \"lib/tdb/common/error.c\",\n 1444 |     \"lib/tdb/common/tdb.c\",\n 1445 |     \"lib/tdb/common/traverse.c\",\n 1446 |     \"lib/tdb/common/freelistcheck.c\",\n 1447 |     \"lib/tdb/common/lock.c\",\n 1448 |     \"lib/tdb/common/dump.c\",\n 1449 |     \"lib/tdb/common/freelist.c\",\n 1450 |     \"lib/tdb/common/io.c\",\n 1451 |     \"lib/tdb/common/open.c\",\n 1452 |     \"lib/tdb/common/transaction.c\",\n 1453 |     \"lib/tdb/common/hash.c\",\n 1454 |     \"lib/tdb/common/summary.c\",\n 1455 |     \"lib/tdb/common/rescue.c\",\n 1456 |     \"lib/tdb/common/mutex.c\",\n 1457 | ];\n 1458 | \n 1459 | const TALLOC_SRC: &[&str] = &[\"lib/talloc/talloc.c\"];\n 1460 | \n 1461 | const TEVENT_SRC: &[&str] = &[\n 1462 |     \"lib/tevent/tevent.c\",\n 1463 |     \"lib/tevent/tevent_debug.c\",\n 1464 |     \"lib/tevent/tevent_fd.c\",\n 1465 |     \"lib/tevent/tevent_immediate.c\",\n 1466 |     \"lib/tevent/tevent_queue.c\",\n 1467 |     \"lib/tevent/tevent_req.c\",\n 1468 |     \"lib/tevent/tevent_wrapper.c\",\n 1469 |     \"lib/tevent/tevent_poll.c\",\n 1470 |     \"lib/tevent/tevent_threads.c\",\n 1471 |     \"lib/tevent/tevent_signal.c\",\n 1472 |     \"lib/tevent/tevent_standard.c\",\n 1473 |     \"lib/tevent/tevent_timed.c\",\n 1474 |     \"lib/tevent/tevent_util.c\",\n 1475 |     \"lib/tevent/tevent_wakeup.c\",\n 1476 |     #[cfg(target_os = \"linux\")]\n 1477 |     \"lib/tevent/tevent_epoll.c\",\n 1478 | ];","lines":38,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao-src/src/lib.rs#L1441-L1478"},{"ref":"pavao-src/src/lib.rs:245-259","code":"  245 |     \"lib/tdb/common/check.c\",\n  246 |     \"lib/tdb/common/error.c\",\n  247 |     \"lib/tdb/common/tdb.c\",\n  248 |     \"lib/tdb/common/traverse.c\",\n  249 |     \"lib/tdb/common/freelistcheck.c\",\n  250 |     \"lib/tdb/common/lock.c\",\n  251 |     \"lib/tdb/common/dump.c\",\n  252 |     \"lib/tdb/common/freelist.c\",\n  253 |     \"lib/tdb/common/io.c\",\n  254 |     \"lib/tdb/common/open.c\",\n  255 |     \"lib/tdb/common/transaction.c\",\n  256 |     \"lib/tdb/common/hash.c\",\n  257 |     \"lib/tdb/common/summary.c\",\n  258 |     \"lib/tdb/common/rescue.c\",\n  259 |     \"lib/tdb/common/mutex.c\",","lines":15,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao-src/src/lib.rs#L245-L259"},{"ref":"pavao-src/src/lib.rs:1761-1767","code":" 1761 |         let unique_src: HashSet<String> = SRC_FILES\n 1762 |             .iter()\n 1763 |             .chain(TDB_SRC)\n 1764 |             .chain(TALLOC_SRC)\n 1765 |             .chain(TEVENT_SRC)\n 1766 |             .map(|s| s.to_string())\n 1767 |             .collect();","lines":7,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao-src/src/lib.rs#L1761-L1767"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"The `samba_dir` field, its `/usr/local/samba` default and the public `samba_dir()` setter are never read anywhere in the crate. Callers that set it reasonably expect it to control where samba comes from or is installed, but the value is silently ignored (the source is always cloned into `OUT_DIR`, and `configure` is never given a `--prefix`). It also produces a `field is never read` warning.","fix":"Either remove `samba_dir`, its default and the setter, or wire it up - the natural use is to skip `clone_samba` and build from an existing checkout when `samba_dir` points at a samba source tree, and/or to pass `--prefix=<samba_dir>` to `configure`.","locations":[{"ref":"pavao-src/src/lib.rs:1506","code":" 1506 |     samba_dir: Option<PathBuf>,","lines":1,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao-src/src/lib.rs#L1506"},{"ref":"pavao-src/src/lib.rs:1523","code":" 1523 |             samba_dir: Some(PathBuf::from(\"/usr/local/samba\")),","lines":1,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao-src/src/lib.rs#L1523"},{"ref":"pavao-src/src/lib.rs:1549-1552","code":" 1549 |     pub fn samba_dir<P: AsRef<Path>>(&mut self, path: P) -> &mut Build {\n 1550 |         self.samba_dir = Some(path.as_ref().to_path_buf());\n 1551 |         self\n 1552 |     }","lines":4,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao-src/src/lib.rs#L1549-L1552"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`setup_options` calls `smbc_setOptionDebugToStderr(ctx, 0)` unconditionally and then, under `#[cfg(feature = \"debug\")]`, calls `smbc_setOptionDebugToStderr(ctx, 1 as i32)` again, so the first call is dead whenever the feature is on. The `1 as i32` cast is also redundant since the literal already infers to `i32`.","fix":"Collapse the two calls into one and drop the cast:\n\n```rust\n#[cfg(feature = \"debug\")]\nsmbc_setOptionDebugToStderr(ctx, 1);\n#[cfg(not(feature = \"debug\"))]\nsmbc_setOptionDebugToStderr(ctx, 0);\n```\n\n(remove the unconditional `smbc_setOptionDebugToStderr(ctx, 0);` line).","locations":[{"ref":"pavao/src/smb/client.rs:600-612","code":"  600 |             smbc_setOptionDebugToStderr(ctx, 0);\n  601 |             smbc_setOptionFallbackAfterKerberos(ctx, options.fallback_after_kerberos as i32);\n  602 |             smbc_setOptionNoAutoAnonymousLogin(ctx, options.no_auto_anonymous_login as i32);\n  603 |             smbc_setOptionOneSharePerServer(ctx, options.one_share_per_server as i32);\n  604 |             smbc_setOptionOpenShareMode(ctx, options.open_share_mode.into());\n  605 |             smbc_setOptionSmbEncryptionLevel(ctx, options.encryption_level.into());\n  606 |             smbc_setOptionUrlEncodeReaddirEntries(ctx, options.url_encode_readdir_entries as i32);\n  607 |             smbc_setOptionUseCCache(ctx, options.use_ccache as i32);\n  608 |             smbc_setOptionUseKerberos(ctx, options.use_kerberos as i32);\n  609 |             #[cfg(feature = \"debug\")]\n  610 |             smbc_setOptionDebugToStderr(ctx, 1 as i32);\n  611 |             #[cfg(feature = \"debug\")]\n  612 |             smbc_setDebug(ctx, 10);","lines":13,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao/src/smb/client.rs#L600-L612"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"Several comments and messages were copied verbatim from `openssl-src` and are wrong here: they talk about OpenSSL in a crate that builds samba, and one contains the typo `OpenSSL contains about the conflict` (meant: *complains*). This actively misleads readers into thinking an OpenSSL build is involved.","fix":"Reword to reference the actual build. For example replace\n\n`// already selected an arch implicitly via the target above, and`\n`// OpenSSL contains about the conflict if both are specified.`\n\nwith\n\n`// already selected an arch implicitly via the target above, and`\n`// the compiler complains if both are specified.`\n\nand change `\"don't know how to configure OpenSSL for {}\"` to `\"don't know how to configure samba for {}\"`.","locations":[{"ref":"pavao-src/src/lib.rs:1703-1712","code":" 1703 |             // cc includes an `-arch` flag for Apple platforms, but we've\n 1704 |             // already selected an arch implicitly via the target above, and\n 1705 |             // OpenSSL contains about the conflict if both are specified.\n 1706 |             if target.contains(\"apple\") && arg == \"-arch\" {\n 1707 |                 skip_next = true;\n 1708 |                 continue;\n 1709 |             }\n 1710 | \n 1711 |             // cargo-lipo specifies this but OpenSSL complains\n 1712 |             if target.contains(\"apple-ios\") {","lines":10,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao-src/src/lib.rs#L1703-L1712"},{"ref":"pavao-src/src/lib.rs:1974","code":" 1974 |                     \"don't know how to configure OpenSSL for {}\",","lines":1,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao-src/src/lib.rs#L1974"}]},
{"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"medium","difficulty":"easy","description":"`From<statvfs>` and `From<stat>` are ~170 lines of `#[cfg]` arms that all do the same thing: six\n`SmbStatVfs` fields and four `SmbStat` fields are each repeated seven times (`target_os = \"android\"`,\n`\"macos\"`, `linux_x86_64`, `linux_aarch64`, `linux_arm`, `linux_riscv64`, `target_os = \"openbsd\"`),\ndiffering only by the presence of an `as u64` / `as i64` cast - and the file already has\n`#![allow(clippy::unnecessary_cast)]` at the top, which is precisely what makes a single unconditional\ncast legal on every platform. Consequences: (a) the code fails to **compile** on any other target\n(`i686-unknown-linux-gnu`, `powerpc64`, `s390x`, `*-freebsd`, `*-netbsd`, ...) with \"missing field\n`blocks`\", because there is no fallback arm; (b) adding a field means editing 7 places; (c) the\npadding already caused the unrelated `created:` and `modified:` initialisers to be pasted *inside*\nthe `blksize` and `dev` cfg groups (lines 186 and 203), which is how field-mix-up bugs happen.","fix":"Delete every `#[cfg]` in both `From` impls and use one unconditional cast per field, which compiles on all targets:\n\n```rust\nimpl From<statvfs> for SmbStatVfs {\n    fn from(s: statvfs) -> Self {\n        Self {\n            bsize: s.f_bsize as u64,\n            frsize: s.f_frsize as u64,\n            blocks: s.f_blocks as u64,\n            bfree: s.f_bfree as u64,\n            bavail: s.f_bavail as u64,\n            files: s.f_files as u64,\n            ffree: s.f_ffree as u64,\n            favail: s.f_favail as u64,\n            fsid: s.f_fsid as u64,\n            flag: s.f_flag as u64,\n            namemax: s.f_namemax as u64,\n        }\n    }\n}\n```\n\nDo the same for `blksize`/`dev`/`nlink`/`rdev` in `From<stat>`; the existing `#![allow(clippy::unnecessary_cast)]` already silences the redundant-cast lint.","locations":[{"ref":"pavao/src/smb/types/stat.rs:43-137","code":"   43 | impl From<statvfs> for SmbStatVfs {\n   44 |     fn from(s: statvfs) -> Self {\n   45 |         Self {\n   46 |             bsize: s.f_bsize as u64,\n   47 |             frsize: s.f_frsize as u64,\n   48 |             #[cfg(target_os = \"android\")]\n   49 |             blocks: s.f_blocks,\n   50 |             #[cfg(target_os = \"macos\")]\n   51 |             blocks: s.f_blocks as u64,\n   52 |             #[cfg(linux_x86_64)]\n   53 |             blocks: s.f_blocks,\n   54 |             #[cfg(linux_aarch64)]\n   55 |             blocks: s.f_blocks,\n   56 |             #[cfg(linux_arm)]\n   57 |             blocks: s.f_blocks as u64,\n   58 |             #[cfg(linux_riscv64)]\n   59 |             blocks: s.f_blocks,\n   60 |             #[cfg(target_os = \"openbsd\")]\n   61 |             blocks: s.f_blocks,\n   62 |             #[cfg(target_os = \"android\")]\n   63 |             bfree: s.f_bfree,\n   64 |             #[cfg(target_os = \"macos\")]\n   65 |             bfree: s.f_bfree as u64,\n   66 |             #[cfg(linux_x86_64)]\n   67 |             bfree: s.f_bfree,\n   68 |             #[cfg(linux_aarch64)]\n   69 |             bfree: s.f_bfree,\n   70 |             #[cfg(linux_arm)]\n   71 |             bfree: s.f_bfree as u64,\n   72 |             #[cfg(linux_riscv64)]\n   73 |             bfree: s.f_bfree,\n   74 |             #[cfg(target_os = \"openbsd\")]\n   75 |             bfree: s.f_bfree,\n   76 |             #[cfg(target_os = \"android\")]\n   77 |             bavail: s.f_bavail,\n   78 |             #[cfg(target_os = \"macos\")]\n   79 |             bavail: s.f_bavail as u64,\n   80 |             #[cfg(linux_x86_64)]\n   81 |             bavail: s.f_bavail,\n   82 |             #[cfg(linux_aarch64)]\n   83 |             bavail: s.f_bavail,\n   84 |             #[cfg(linux_arm)]\n   85 |             bavail: s.f_bavail as u64,\n   86 |             #[cfg(linux_riscv64)]\n   87 |             bavail: s.f_bavail,\n   88 | {"id":"OTHER_1","type":"other","type_label":"Other","severity":"high","difficulty":"easy","description":"`TryFrom<libsmb_file_info>` reads a struct whose Rust declaration does not match the C ABI on 32-bit\ntargets: `pavao_sys::libsmb_file_info::size` is declared `c_ulong` while `libsmbclient.h` declares\n`uint64_t size`. On any ILP32 target - including `linux_arm`, which `stat.rs` explicitly claims to\nsupport - the Rust struct is 4 bytes shorter at the front, so `attrs`, `uid`, `gid`, all four\n`timespec`s and both `*mut c_char` pointers are read from the wrong offsets. `char_ptr_to_string(di.name)`\nthen dereferences a garbage pointer, i.e. undefined behaviour / segfault rather than merely wrong\nmetadata.","fix":"Declare the field with its fixed-width C type:\n\n```rust\npub struct libsmb_file_info {\n    /// Size of file\n    pub size: u64,\n    ...\n}\n```\n\n(`uint64_t` -> `u64`, not `c_ulong`). Consider `debug_assert_eq!(size_of::<libsmb_file_info>(), ...)` or generating the bindings with `bindgen` to prevent recurrence.","locations":[{"ref":"pavao/src/smb/types/stat.rs:285-305","code":"  285 | impl TryFrom<libsmb_file_info> for SmbDirentInfo {\n  286 |     type Error = SmbError;\n  287 | \n  288 |     fn try_from(di: libsmb_file_info) -> Result<Self, Self::Error> {\n  289 |         let name = char_ptr_to_string(di.name)?;\n  290 |         let short_name = char_ptr_to_string(di.short_name)?;\n  291 | \n  292 |         Ok(Self {\n  293 |             name,\n  294 |             short_name,\n  295 |             size: di.size as u64,\n  296 |             ctime: time_t_to_system_time(di.ctime_ts.tv_sec),\n  297 |             btime: time_t_to_system_time(di.btime_ts.tv_sec),\n  298 |             mtime: time_t_to_system_time(di.mtime_ts.tv_sec),\n  299 |             atime: time_t_to_system_time(di.atime_ts.tv_sec),\n  300 |             uid: di.uid,\n  301 |             gid: di.gid,\n  302 |             attrs: di.attrs,\n  303 |         })\n  304 |     }\n  305 | }","lines":21,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao/src/smb/types/stat.rs#L285-L305"}]},
{"id":"OTHER_2","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"`unique_src` is a `HashSet<String>`, so the iteration order that determines the `ar` argument order is randomised per process by the default hasher. The resulting `libsmbclient.a` differs (member order, and therefore bytes) between otherwise identical builds, which breaks reproducible-build and artifact-caching workflows and makes build failures harder to reproduce. It also allocates ~1300 needless `String`s from `&'static str` data.","fix":"Use an ordered, borrowing set:\n\n```rust\nlet unique_src: std::collections::BTreeSet<&str> =\n    SRC_FILES.iter().chain(TDB_SRC).chain(TALLOC_SRC).chain(TEVENT_SRC).copied().collect();\n```\n\n(add `use std::collections::BTreeSet;` and drop the now-unused `HashSet` import if nothing else needs it).","locations":[{"ref":"pavao-src/src/lib.rs:1761-1772","code":" 1761 |         let unique_src: HashSet<String> = SRC_FILES\n 1762 |             .iter()\n 1763 |             .chain(TDB_SRC)\n 1764 |             .chain(TALLOC_SRC)\n 1765 |             .chain(TEVENT_SRC)\n 1766 |             .map(|s| s.to_string())\n 1767 |             .collect();\n 1768 | \n 1769 |         let mut logfile = std::fs::File::create(\"/tmp/samba-build.log\")\n 1770 |             .map_err(|e| format!(\"failed to create build log: {e}\"))?;\n 1771 |         // push object\n 1772 |         for object in unique_src {","lines":12,"link":"https://github.com/veeso/pavao/blob/b380ffb6e3995f979a44a08ded0befec9290c219/pavao-src/src/lib.rs#L1761-L1772"}]},
