{"id":"LOGIC_72","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `helper_integration.py`, the `async_registry_updated` coroutine handles the `remove` action (lines 54-66) without an explicit `return`. Execution falls through to the `if data['action'] != 'update': return` guard on line 68, which happens to be correct because 'remove' != 'update'. However, the missing explicit `return` makes the control flow non-obvious and fragile - any future insertion of code between the remove handler and the guard could silently execute update logic after a remove.","fix":"Add an explicit `return` at the end of the `if data['action'] == 'remove':` block (after line 66).","locations":[{"ref":"homeassistant/helpers/helper_integration.py:70-85","code":"   70 |         if data[\"action\"] == \"remove\":\n   71 |             if source_entity_removed:\n   72 |                 await source_entity_removed()\n   73 |             else:\n   74 |                 for (\n   75 |                     helper_entity_entry\n   76 |                 ) in entity_registry.entities.get_entries_for_config_entry_id(\n   77 |                     helper_config_entry_id\n   78 |                 ):\n   79 |                     # Update the helper entity to link to the new device (or no device)\n   80 |                     entity_registry.async_update_entity(\n   81 |                         helper_entity_entry.entity_id, device_id=None\n   82 |                     )\n   83 | \n   84 |         if data[\"action\"] != \"update\":\n   85 |             return","lines":16,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/helper_integration.py#L70-L85"}]},
{"id":"LOGIC_73","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`_IconsCache.async_fetch` (icon.py:94-107) performs a double-checked locking pattern:\nit checks `components_to_load` before acquiring the lock, then rechecks inside.\nHowever, if `_async_load` raises (e.g., because of an integration load failure), the\nexception propagates out of the `async with self._lock:` block. Any other coroutines\nthat were awaiting the lock will then acquire it and re-enter `_async_load` for the\nsame failing components, producing cascading repeated failures for all waiters. The\nloaded set is never updated so this cycle repeats on every request that includes the\nfailing component.","fix":"Use the fix from the _async_load finding above: mark failed domains as loaded (possibly with a sentinel) so they are not retried indefinitely.","locations":[{"ref":"homeassistant/helpers/icon.py:88-107","code":"   88 |     async def async_fetch(\n   89 |         self,\n   90 |         category: str,\n   91 |         components: set[str],\n   92 |     ) -> dict[str, dict[str, Any]]:\n   93 |         \"\"\"Load resources into the cache.\"\"\"\n   94 |         if components_to_load := components - self._loaded:\n   95 |             # Icons are never unloaded so if there are no components to load\n   96 |             # we can skip the lock which reduces contention\n   97 |             async with self._lock:\n   98 |                 # Check components to load again, as another task might have loaded\n   99 |                 # them while we were waiting for the lock.\n  100 |                 if components_to_load := components - self._loaded:\n  101 |                     await self._async_load(components_to_load)\n  102 | \n  103 |         return {\n  104 |             component: result\n  105 |             for component in components\n  106 |             if (result := self._cache.get(category, {}).get(component))\n  107 |         }","lines":20,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/icon.py#L88-L107"}]},
{"id":"LOGIC_74","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`_process_integration_platforms` (integration_platform.py:134-146) builds the future\nlist using a list comprehension that also calls `integration_platforms_by_name[platform_name]`.\nSince `platform_name` comes from `platforms.items()` (line 136), and\n`integration_platforms_by_name` is keyed by the same platform names (filled at lines\n51-58), this lookup should always succeed. However, if platforms were filtered\ndifferently (e.g., by `platforms_that_exist` containing names not in\n`integration_platforms_by_name`), a `KeyError` would be raised silently inside the\ncomprehension and swallowed - producing an empty list with no indication of the failure.\nThis is more of an architecture fragility than a current bug, but the implicit\nassumption is undocumented.","fix":"Add an assertion or explicit error for the case where `platform_name` is not in `integration_platforms_by_name`, or use `.get()` and log a warning.","locations":[{"ref":"homeassistant/helpers/integration_platform.py:134-146","code":"  134 |     return [\n  135 |         future\n  136 |         for platform_name, platform in platforms.items()\n  137 |         if (integration_platform := integration_platforms_by_name[platform_name])\n  138 |         and (\n  139 |             future := hass.async_run_hass_job(\n  140 |                 integration_platform.process_job,\n  141 |                 hass,\n  142 |                 integration.domain,\n  143 |                 platform,\n  144 |             )\n  145 |         )\n  146 |     ]","lines":13,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/integration_platform.py#L134-L146"}]},
{"id":"LOGIC_75","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `find_paths_unserializable_data` (json.py:263-265), when `obj` is a list, each\nelement is added to the processing queue but the list itself is never reported as\ninvalid even though `dump(obj)` failed for it. This means a list containing only valid\nelements will pass the initial `dump` check (line 236), but if `dump` fails on the\nwhole list for some other reason (e.g., a list subclass with a broken `__iter__`), the\nfunction will try to decompose it into elements and might not identify the root cause.\nThis is an edge case but can lead to confusing empty `invalid` dict returns.","fix":"After decomposing a failed list into elements, continue processing. If no invalid elements are found for a failed list, add the list itself to `invalid` as a fallback.","locations":[{"ref":"homeassistant/helpers/json.py:297-299","code":"  297 |         elif isinstance(obj, list):\n  298 |             for idx, value in enumerate(obj):\n  299 |                 to_process.append((value, f\"{obj_path}[{idx}]\"))","lines":3,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/json.py#L297-L299"}]},
{"id":"LOGIC_76","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`MergedAPI._custom_serializer` (llm.py:452-458) iterates over per-API serializers and\nreturns the first result that is not None. However, `selector_serializer` returns\n`UNSUPPORTED` (a sentinel from the `voluptuous_openapi` library) when the input is not\na recognised selector type. If `UNSUPPORTED` is truthy (which it typically is as a\nnon-None object), the merged serializer will incorrectly treat it as a valid result\nand stop trying further serializers. The downstream `convert()` call that is supposed\nto handle `UNSUPPORTED` will never see it.","fix":"Import UNSUPPORTED and exclude it alongside None in the merged serializer check:\n\n    from voluptuous_openapi import UNSUPPORTED\n\n    def merged(x: Any) -> Any:\n        for serializer in serializers:\n            result = serializer(x)\n            if result is not None and result is not UNSUPPORTED:\n                return result\n        return x","locations":[{"ref":"homeassistant/helpers/llm.py:391-408","code":"  391 |     def _custom_serializer(\n  392 |         self, llm_apis: list[APIInstance]\n  393 |     ) -> Callable[[Any], Any] | None:\n  394 |         serializers = [\n  395 |             api_instance.custom_serializer\n  396 |             for api_instance in llm_apis\n  397 |             if api_instance.custom_serializer is not None\n  398 |         ]\n  399 |         if not serializers:\n  400 |             return None\n  401 | \n  402 |         def merged(x: Any) -> Any:\n  403 |             for serializer in serializers:\n  404 |                 if (result := serializer(x)) is not None:\n  405 |                     return result\n  406 |             return x\n  407 | \n  408 |         return merged","lines":18,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/llm.py#L391-L408"}]},
{"id":"LOGIC_77","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`session_scope` in recorder.py (lines 91-104) only calls `session.rollback()` when\n`need_rollback` is True, which is set only after `session.get_transaction()` returns\na transaction (i.e., right before `session.commit()` is attempted). If user code inside\nthe `yield` body raises an exception after modifying data but before returning, the\nexception handler is reached with `need_rollback=False`, so rollback is NOT called\nexplicitly - only `session.close()` is called. SQLAlchemy 2.x will roll back on\nclose(), but this relies on implicit behaviour. Additionally, `_LOGGER.exception`\nalways logs the traceback even for non-error exceptions that are suppressed by\n`exception_filter`, leaking internal error details unconditionally.","fix":"Set need_rollback before the yield and only clear it on successful commit, or\nunconditionally rollback on exception:\n\n    try:\n        yield session\n        if not read_only and session.get_transaction():\n            session.commit()\n    except Exception as err:\n        _LOGGER.exception(\"Error executing query\")\n        session.rollback()\n        if not exception_filter or not exception_filter(err):\n            raise\n    finally:\n        session.close()","locations":[{"ref":"homeassistant/helpers/recorder.py:91-104","code":"   91 |     need_rollback = False\n   92 |     try:\n   93 |         yield session\n   94 |         if not read_only and session.get_transaction():\n   95 |             need_rollback = True\n   96 |             session.commit()\n   97 |     except Exception as err:\n   98 |         _LOGGER.exception(\"Error executing query\")\n   99 |         if need_rollback:\n  100 |             session.rollback()\n  101 |         if not exception_filter or not exception_filter(err):\n  102 |             raise\n  103 |     finally:\n  104 |         session.close()","lines":14,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/recorder.py#L91-L104"}]},
{"id":"LOGIC_78","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In _async_step_delay (line 1176), timeout_future is accessed without a None check. This is safe only because a positive delay is guaranteed at that point, but the overloaded signature of _async_futures_with_timeout indicates it can return None. A future refactor that changes the caller logic could introduce a NoneType error.","fix":"Add an assertion or local variable cast to make the non-None guarantee explicit: `assert timeout_future is not None` before accessing `.done()`.","locations":[{"ref":"homeassistant/helpers/script.py:1213-1223","code":" 1213 |         futures, timeout_handle, timeout_future = self._async_futures_with_timeout(\n 1214 |             delay\n 1215 |         )\n 1216 | \n 1217 |         try:\n 1218 |             await asyncio.wait(futures, return_when=asyncio.FIRST_COMPLETED)\n 1219 |         finally:\n 1220 |             if timeout_future.done():\n 1221 |                 trace_set_result(delay=delay, done=True)\n 1222 |             else:\n 1223 |                 timeout_handle.cancel()","lines":11,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/script.py#L1213-L1223"}]},
{"id":"LOGIC_79","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"Script._async_unload is called from __del__ (line 1536) which fires when the object is garbage collected. If the Script is still running (_runs is non-empty), _async_unload raises RuntimeError which is silently swallowed by the broad except at line 1537, and DATA_SCRIPTS is never cleaned up. The GC-driven __del__ also runs at unpredictable times and from unpredictable contexts, making it unsafe to interact with hass.data.","fix":"Remove the __del__ fallback or limit it to a warning log. Callers should always call async_unload() explicitly. If a leak-detection safety net is desired, log a warning without calling _async_unload from __del__.","locations":[{"ref":"homeassistant/helpers/script.py:1575-1582","code":" 1575 |     def __del__(self) -> None:\n 1576 |         \"\"\"Clean up when the script is deleted.\"\"\"\n 1577 |         if self._unloaded:\n 1578 |             return\n 1579 |         try:\n 1580 |             self._async_unload()\n 1581 |         except Exception:\n 1582 |             _LOGGER.exception(\"Error while unloading script\")","lines":8,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/script.py#L1575-L1582"},{"ref":"homeassistant/helpers/script.py:2038-2053","code":" 2038 |     def _async_unload(self) -> None:\n 2039 |         \"\"\"Unload the script, cleaning up all resources.\n 2040 | \n 2041 |         Unloads cached conditions, and recursively unloads sub-scripts.\n 2042 |         The script must not be running when this is called; sub-scripts\n 2043 |         are guaranteed to not be running if the parent is not running.\n 2044 |         \"\"\"\n 2045 |         if self._runs:\n 2046 |             raise RuntimeError(\n 2047 |                 f\"Cannot unload script '{self.name}' while it is running\"\n 2048 |             )\n 2049 |         self._unloaded = True\n 2050 | \n 2051 |         # Remove from global script registry\n 2052 |         if self.top_level:\n 2053 |             del self._hass.data[DATA_SCRIPTS][id(self)]","lines":16,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/script.py#L2038-L2053"}]},
{"id":"LOGIC_80","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"Script.update_logger does not propagate the new logger to _sequence_scripts sub-scripts. All other sub-script collections (_repeat_script, _parallel_scripts, _choose_data, _if_data) are updated, but scripts stored in _sequence_scripts are missed, causing them to continue logging to the old logger.","fix":"Add propagation for sequence scripts after the if_data loop: `for sub_script in self._sequence_scripts.values(): sub_script.update_logger(self._logger)`.","locations":[{"ref":"homeassistant/helpers/script.py:1605-1621","code":" 1605 |     def update_logger(self, logger: logging.Logger | None = None) -> None:\n 1606 |         \"\"\"Update logger.\"\"\"\n 1607 |         self._set_logger(logger)\n 1608 |         for script in self._repeat_script.values():\n 1609 |             script.update_logger(self._logger)\n 1610 |         for parallel_scripts in self._parallel_scripts.values():\n 1611 |             for parallel_script in parallel_scripts:\n 1612 |                 parallel_script.update_logger(self._logger)\n 1613 |         for choose_data in self._choose_data.values():\n 1614 |             for _, script in choose_data[\"choices\"]:\n 1615 |                 script.update_logger(self._logger)\n 1616 |             if choose_data[\"default\"] is not None:\n 1617 |                 choose_data[\"default\"].update_logger(self._logger)\n 1618 |         for if_data in self._if_data.values():\n 1619 |             if_data[\"if_then\"].update_logger(self._logger)\n 1620 |             if if_data[\"if_else\"] is not None:\n 1621 |                 if_data[\"if_else\"].update_logger(self._logger)","lines":17,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/script.py#L1605-L1621"}]},
{"id":"LOGIC_81","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"ColorTempSelector.__call__ is annotated to return `int` (line 682) but applies `vol.Coerce(float)` and returns a float. Callers relying on the int return type annotation will receive floats at runtime.","fix":"Change the return type annotation from `int` to `float`, or add `int(value)` before returning if integer truncation is intentional.","locations":[{"ref":"homeassistant/helpers/selector.py:705-723","code":"  705 |     def __call__(self, data: Any) -> int:\n  706 |         \"\"\"Validate the passed selection.\"\"\"\n  707 |         range_min = self.config.get(\"min\")\n  708 |         range_max = self.config.get(\"max\")\n  709 | \n  710 |         if range_min is None:\n  711 |             range_min = self.config.get(\"min_mireds\")\n  712 | \n  713 |         if range_max is None:\n  714 |             range_max = self.config.get(\"max_mireds\")\n  715 | \n  716 |         value: int = vol.All(\n  717 |             vol.Coerce(float),\n  718 |             vol.Range(\n  719 |                 min=range_min,\n  720 |                 max=range_max,\n  721 |             ),\n  722 |         )(data)\n  723 |         return value","lines":19,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/selector.py#L705-L723"}]},
{"id":"LOGIC_82","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `async_prepare_call_from_config`, when neither `CONF_TARGET` nor `CONF_SERVICE_ENTITY_ID` is present, the function returns `target={}` (empty dict) instead of `target=None`. The `ServiceParams` TypedDict declares `target: dict | None`, and callers may check `if target` or `if target is None`. An empty dict is truthy-False but not None, so callers using `target is None` to detect 'no target' would receive the wrong answer.","fix":"Initialize `target = None` and only set it to a dict when `CONF_TARGET` or `CONF_SERVICE_ENTITY_ID` are present, matching the declared `dict | None` type.","locations":[{"ref":"homeassistant/helpers/service.py:296-348","code":"  296 |     target = {}\n  297 |     if CONF_TARGET in config:\n  298 |         conf = config[CONF_TARGET]\n  299 |         try:\n  300 |             if isinstance(conf, template.Template):\n  301 |                 target.update(conf.async_render(variables))\n  302 |             else:\n  303 |                 target.update(template.render_complex(conf, variables))\n  304 | \n  305 |             if CONF_ENTITY_ID in target:\n  306 |                 registry = entity_registry.async_get(hass)\n  307 |                 entity_ids = cv.comp_entity_ids_or_uuids(target[CONF_ENTITY_ID])\n  308 |                 if entity_ids not in (ENTITY_MATCH_ALL, ENTITY_MATCH_NONE):\n  309 |                     entity_ids = entity_registry.async_validate_entity_ids(\n  310 |                         registry, entity_ids\n  311 |                     )\n  312 |                 target[CONF_ENTITY_ID] = entity_ids\n  313 |         except TemplateError as ex:\n  314 |             raise HomeAssistantError(\n  315 |                 f\"Error rendering service target template: {ex}\"\n  316 |             ) from ex\n  317 |         except vol.Invalid as ex:\n  318 |             raise HomeAssistantError(\n  319 |                 f\"Template rendered invalid entity IDs: {target[CONF_ENTITY_ID]}\"\n  320 |             ) from ex\n  321 | \n  322 |     service_data = {}\n  323 | \n  324 |     for conf in (CONF_SERVICE_DATA, CONF_SERVICE_DATA_TEMPLATE):\n  325 |         if conf not in config:\n  326 |             continue\n  327 |         try:\n  328 |             render = template.render_complex(config[conf], variables)\n  329 |             if not isinstance(render, dict):\n  330 |                 raise HomeAssistantError(\n  331 |                     \"Error rendering data template: Result is not a Dictionary\"\n  332 |                 )\n  333 |             service_data.update(render)\n  334 |         except TemplateError as ex:\n  335 |             raise HomeAssistantError(f\"Error rendering data template: {ex}\") from ex\n  336 | \n  337 |     if CONF_SERVICE_ENTITY_ID in config:\n  338 |         if target:\n  339 |             target[ATTR_ENTITY_ID] = config[CONF_SERVICE_ENTITY_ID]\n  340 |         else:\n  341 |             target = {ATTR_ENTITY_ID: config[CONF_SERVICE_ENTITY_ID]}\n  342 | \n  343 |     return {\n  344 |         \"domain\": domain,\n  345 |         \"service\": service,\n  346 |         \"service_data\": service_data,\n  347 |         \"target\": target,\n  348 |     }","lines":53,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/service.py#L296-L348"}]},
{"id":"LOGIC_83","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `_resolve_entity_service_call_entities`, after filtering for available entities (line 763), the `missing` set is computed from `referenced.referenced` minus available-entity IDs. Unavailable entities are silently dropped but not logged as missing; they are already discarded by the availability filter, yet the `log_missing` call (line 771) only logs entities that were never found at all (never in `entity_candidates`). Entities that exist but are unavailable are thus neither acted on nor mentioned, which can surprise callers.","fix":"This is a design choice rather than a code bug, but adding a debug-level log for unavailable-but-referenced entities would improve observability.","locations":[{"ref":"homeassistant/helpers/service.py:731-739","code":"  731 |     entity_candidates = [e for e in entity_candidates if e.available]\n  732 | \n  733 |     if not target_all_entities:\n  734 |         assert referenced is not None\n  735 |         # Only report on explicit referenced entities\n  736 |         missing = referenced.referenced.copy()\n  737 |         for entity in entity_candidates:\n  738 |             missing.discard(entity.entity_id)\n  739 |         referenced.log_missing(missing, _LOGGER)","lines":9,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/service.py#L731-L739"}]},
{"id":"LOGIC_84","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`regex_findall_index` (regex.py line 98) calls `self.regex_findall(...)` and indexes the result without any bounds check. If the pattern has no matches or the requested `index` is out of range, a bare `IndexError` propagates to the template renderer. Unlike other regex helpers which return empty results gracefully, this one will crash the template.","fix":"Wrap the indexing in a try/except IndexError and either return an empty string or re-raise as a `TemplateError` with a descriptive message.","locations":[{"ref":"homeassistant/helpers/template/extensions/regex.py:94-98","code":"   94 |     def regex_findall_index(\n   95 |         self, value: Any, find: str = \"\", index: int = 0, ignorecase: bool = False\n   96 |     ) -> str:\n   97 |         \"\"\"Find all matches using regex and then pick specific match index.\"\"\"\n   98 |         return self.regex_findall(value, find, ignorecase)[index]","lines":5,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/template/extensions/regex.py#L94-L98"}]},
{"id":"LOGIC_85","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `_async_refresh`, when `NotImplementedError` is re-raised (line 544), the `finally` block runs but the code after the try/finally block (lines 574-584) does not execute. This means `_async_refresh_finished()` is never called (so `TimestampDataUpdateCoordinator.last_update_success_time` is not updated) and `async_update_listeners()` is not called. If an update was previously succeeding and `_async_update_data` suddenly raises `NotImplementedError` (e.g. after changing `update_method` to `None` at runtime), entities remain shown as available. The same applies to `ConfigEntryError`/`ConfigEntryAuthFailed` when `raise_on_entry_error`/`raise_on_auth_failed` is `True`, though those cases typically occur during setup before entities are listening.","fix":"Move `_async_refresh_finished()` and the listener-notification logic into the `finally` block, guarded by the same `not auth_failed` and `self._listeners` conditions, so they are called even when an exception is re-raised.","locations":[{"ref":"homeassistant/helpers/update_coordinator.py:555-558","code":"  555 |         except NotImplementedError as err:\n  556 |             self.last_exception = err\n  557 |             self.last_update_success = False\n  558 |             raise","lines":4,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/update_coordinator.py#L555-L558"},{"ref":"homeassistant/helpers/update_coordinator.py:588-598","code":"  588 |         self._async_refresh_finished()\n  589 | \n  590 |         if not self.last_update_success and not previous_update_success:\n  591 |             return\n  592 | \n  593 |         if (\n  594 |             self.always_update\n  595 |             or self.last_update_success != previous_update_success\n  596 |             or previous_data != self.data\n  597 |         ):\n  598 |             self.async_update_listeners()","lines":11,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/update_coordinator.py#L588-L598"}]},
{"id":"LOGIC_86","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `loader.py`, the `overwrites_built_in` property performs a synchronous `is_file()` filesystem check on every access (line 956). This property is not cached (`@property` not `@cached_property`), so every call to `overwrites_built_in` triggers a disk I/O operation. This property is called from `__init__` (indirectly via `is_built_in`), from `quality_scale`, and potentially from other places. For custom integrations checked during startup, this results in repeated filesystem calls for the same integration. Separately, `version` (line 959) also recomputes `AwesomeVersion(self.manifest[\"version\"])` on every access without caching.","fix":"Convert `overwrites_built_in` and `version` from `@property` to `@cached_property` to avoid repeated filesystem I/O and object construction. Since `manifest` is set in `__init__` and not modified afterwards, these cached values will remain valid for the lifetime of the Integration object.","locations":[{"ref":"homeassistant/loader.py:952-967","code":"  952 |     @property\n  953 |     def overwrites_built_in(self) -> bool:\n  954 |         \"\"\"Return if package overwrites a built-in integration.\"\"\"\n  955 |         if self.is_built_in:\n  956 |             return False\n  957 |         core_comp_path = (\n  958 |             pathlib.Path(__file__).parent / \"components\" / self.domain / \"manifest.json\"\n  959 |         )\n  960 |         return core_comp_path.is_file()\n  961 | \n  962 |     @property\n  963 |     def version(self) -> AwesomeVersion | None:\n  964 |         \"\"\"Return the version of the integration.\"\"\"\n  965 |         if \"version\" not in self.manifest:\n  966 |             return None\n  967 |         return AwesomeVersion(self.manifest[\"version\"])","lines":16,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/loader.py#L952-L967"}]},
{"id":"LOGIC_87","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `util/async_iterator.py`, the `AsyncIteratorReader.read` method has an incorrect slicing operation on line 71: `chunk = self._buffer[self._pos : self._pos + n]`. When `n < 0` (read all), this will produce an incorrect slice `self._buffer[pos : pos + (-1)]` = `self._buffer[pos : pos - 1]` which is an empty slice when pos > 0. The outer `while n < 0 or len(result) < n:` loop handles the `n < 0` case by looping indefinitely, but the chunk calculation is still wrong for negative n. The result is that when `n=-1`, the loop reads one chunk per iteration but each chunk would be computed with `n=-1` meaning `self._buffer[pos: pos-1]` which is empty once `pos > 0`, causing an infinite loop that never reads past the first chunk position.","fix":"Special-case the `n < 0` (read-all) branch: when `n < 0`, use `chunk = self._buffer[self._pos:]` to read the rest of the current buffer, and set `n_to_advance = len(chunk)` rather than using `n` for indexing. Alternatively restructure the loop to separate read-all vs read-n paths.","locations":[{"ref":"homeassistant/util/async_iterator.py:70-77","code":"   70 |                 break\n   71 |             chunk = self._buffer[self._pos : self._pos + n]\n   72 |             result.extend(chunk)\n   73 |             n -= len(chunk)\n   74 |             self._pos += len(chunk)\n   75 |             if self._pos == len(self._buffer):\n   76 |                 self._buffer = None\n   77 |         return bytes(result)","lines":8,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/util/async_iterator.py#L70-L77"}]},
{"id":"LOGIC_88","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `util/color.py`, the `color_name_to_rgb` function on line 203 checks `if not hex_value:` which would incorrectly raise `ValueError(\"Unknown color\")` for any color in the `COLORS` dict that maps to `RGBColor(0, 0, 0)` (black). Since `RGBColor(0, 0, 0)` is a NamedTuple with all zeros, it is falsy in a boolean context. Calling `color_name_to_rgb(\"black\")` would return the color correctly since `COLORS.get(\"black\")` returns `RGBColor(0, 0, 0)`, but `if not hex_value:` evaluates `not RGBColor(0, 0, 0)` which is `True` (since the tuple is falsy), causing the function to raise `ValueError(\"Unknown color\")` for the color \"black\".","fix":"Change `if not hex_value:` to `if hex_value is None:` to correctly distinguish between a missing key (returns None from `.get()`) and a black color value (RGBColor(0, 0, 0) which is falsy).","locations":[{"ref":"homeassistant/util/color.py:202-204","code":"  202 |     hex_value = COLORS.get(color_name.replace(\" \", \"\").lower())\n  203 |     if not hex_value:\n  204 |         raise ValueError(\"Unknown color\")","lines":3,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/util/color.py#L202-L204"}]},
{"id":"LOGIC_89","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `util/color.py`, the `check_valid_gamut` function uses `cross_product(v1, v2) > 0.0001` to check if three gamut points are not collinear. However, the cross product can also be negative for a valid non-collinear gamut (depending on the orientation/winding order of the triangle). The check should use `abs(cross_product(v1, v2)) > 0.0001` to correctly validate both clockwise and counter-clockwise gamut definitions. A valid gamut with counter-clockwise winding will have a negative cross product and would incorrectly fail this check.","fix":"Change `cross_product(v1, v2) > 0.0001` to `abs(cross_product(v1, v2)) > 0.0001` to handle both clockwise and counter-clockwise gamut definitions.","locations":[{"ref":"homeassistant/util/color.py:728","code":"  728 |     not_on_line = cross_product(v1, v2) > 0.0001","lines":1,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/util/color.py#L728"}]},
{"id":"LOGIC_90","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `util/dt.py`, the `as_utc` function on line 155 uses `==` to compare `dattim.tzinfo == UTC`. For `ZoneInfo` objects (which UTC is not, but local timezones can be), equality comparison may not behave as expected. More critically, if `dattim.tzinfo` is a fixed-offset `datetime.timezone` that represents UTC (e.g., `datetime.timezone.utc`), this comparison would return True for `dt.UTC` (which is `datetime.timezone.utc`) but might miss other representations. The `as_local` function on line 177 has the same pattern. While this is likely intentional (fast path for the exact UTC sentinel), using `is` instead of `==` would be more correct and faster for an identity check.","fix":"Change `dattim.tzinfo == UTC` to `dattim.tzinfo is UTC` in both `as_utc` and `as_local` for a correct identity check. Also change `dattim.tzinfo == DEFAULT_TIME_ZONE` to `dattim.tzinfo is DEFAULT_TIME_ZONE` in `as_local`.","locations":[{"ref":"homeassistant/util/dt.py:155","code":"  155 |     if dattim.tzinfo == UTC:","lines":1,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/util/dt.py#L155"},{"ref":"homeassistant/util/dt.py:177","code":"  177 |     if dattim.tzinfo == DEFAULT_TIME_ZONE:","lines":1,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/util/dt.py#L177"}]},
{"id":"LOGIC_91","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"_is_action_handler in swallowed_exceptions.py checks `bool(node.parent.bases)` to accept a\nmethod whose parent class has base classes. This is meant to exclude plain helper classes\nthat are not entity subclasses. However, any class with a base (e.g., `class MyHelper(dict):`)\nwould also pass, so methods named `toggle`, `turn_on`, etc. on non-entity classes in\nplatform modules would be incorrectly flagged if those names appear in platform_methods.","fix":"Use inherits_from_entity from helpers.entity_class instead of the bare bool(node.parent.bases):\n\n    from pylint_home_assistant.helpers.entity_class import inherits_from_entity\n\n    if node.name in handlers.platform_methods:\n        return inherits_from_entity(node.parent)","locations":[{"ref":"pylint/plugins/pylint_home_assistant/checkers/actions/swallowed_exceptions.py:75-90","code":"   75 | def _is_action_handler(node: nodes.FunctionDef, handlers: ActionHandlers) -> bool:\n   76 |     \"\"\"Return True if *node* is a registered action handler.\n   77 | \n   78 |     Platform action methods are scoped by module (the ``ActionHandlers``\n   79 |     only contains methods for the current platform), so any method on a\n   80 |     class with base classes is accepted. Dynamically registered handlers\n   81 |     can be standalone functions or methods on any class.\n   82 |     \"\"\"\n   83 |     if isinstance(node.parent, nodes.ClassDef):\n   84 |         # Method on a class — accept if name matches platform or registered\n   85 |         # handlers AND the class has base classes (not a plain helper class)\n   86 |         if node.name in handlers.platform_methods:\n   87 |             return bool(node.parent.bases)\n   88 |         return node.name in handlers.registered_handlers\n   89 |     # Standalone function — only valid if dynamically registered\n   90 |     return node.name in handlers.registered_handlers","lines":16,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/pylint/plugins/pylint_home_assistant/checkers/actions/swallowed_exceptions.py#L75-L90"}]},
{"id":"LOGIC_92","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`async_fixtures.py` tracks whether we are inside an async function by checking\n`isinstance(self._function_queue[-1], nodes.AsyncFunctionDef)`. The checker uses\n`visit_asyncfunctiondef = visit_functiondef` (line 56), meaning both sync and async\nfunctions push to the same queue. However, it does NOT have a corresponding\n`visit_asyncfunctiondef` alias for the actual checker logic - instead the alias IS the\nchecker logic. This is functionally correct but the comment \"Visit a function\ndefinition\" on both `visit_functiondef` and `visit_asyncfunctiondef` (lines 48-50) is\nmisleading since the behavior differs between the two call sites.\n\nMore importantly: the checker does not handle the case where `load_fixture` is called\nat module level (outside any function). In that case `_function_queue` is empty and\nthe check `not self._function_queue` causes an early return - the module-level call is\nsilently ignored even though it is synchronous I/O.","fix":"For the module-level case: if `_function_queue` is empty, the call is at module scope\n(always synchronous), so it should be flagged if `_in_test_module` is True. However,\nthis may be intentional since module-level calls are usually for test parametrize data\nand not a real issue. Clarify with a comment if intentional.","locations":[{"ref":"pylint/plugins/pylint_home_assistant/checkers/async_fixtures.py:59-75","code":"   59 |     def visit_call(self, node: nodes.Call) -> None:\n   60 |         \"\"\"Check for sync I/O in load_fixture.\"\"\"\n   61 |         if (\n   62 |             # Ensure we are in a test module\n   63 |             not self._in_test_module\n   64 |             # Ensure we are in an async function context\n   65 |             or not self._function_queue\n   66 |             or not isinstance(self._function_queue[-1], nodes.AsyncFunctionDef)\n   67 |             # Ensure we are not in the decorators\n   68 |             or self._decorators_queue\n   69 |             # Check function name\n   70 |             or not isinstance(node.func, nodes.Name)\n   71 |             or node.func.name not in FUNCTION_NAMES\n   72 |         ):\n   73 |             return\n   74 | \n   75 |         self.add_message(\"home-assistant-async-load-fixtures\", node=node)","lines":17,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/pylint/plugins/pylint_home_assistant/checkers/async_fixtures.py#L59-L75"}]},
{"id":"LOGIC_93","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`no_name.py` config-flow checker and `no_polling.py` config-flow checker both call\n`parse_module(node.root().name)` and check `parsed.module != Module.CONFIG_FLOW` in\n`visit_call`, which runs once per Call node in the file. `node.root()` re-walks the AST\nto reach the module root on every single Call invocation. In a typical config_flow.py\nwith many call nodes this is O(N * depth) redundant tree traversals. The module name\nshould be cached in `visit_module` instead.","fix":"Add a `visit_module` method that caches `parse_module(node.name)` in an instance\nattribute. In `visit_call`, read the cached value instead of calling\n`parse_module(node.root().name)` on every call.","locations":[{"ref":"pylint/plugins/pylint_home_assistant/checkers/config_flow/no_name.py:48-72","code":"   48 |     def visit_call(self, node: nodes.Call) -> None:\n   49 |         \"\"\"Check for name fields in vol.Required/Optional calls.\"\"\"\n   50 |         parsed = parse_module(node.root().name)\n   51 |         if parsed is None or parsed.module != Module.CONFIG_FLOW:\n   52 |             return\n   53 | \n   54 |         # Check field name first (cheap) before doing heavier checks.\n   55 |         field_name = get_schema_field_name(node)\n   56 |         if field_name is None or field_name not in _NAME_FIELD_NAMES:\n   57 |             return\n   58 | \n   59 |         # Helper integrations legitimately ask users for a name since there\n   60 |         # is no device to discover the name from.\n   61 |         if is_helper_integration(parsed.domain, node.root()):\n   62 |             return\n   63 | \n   64 |         # Subentry flows may legitimately ask for a name.\n   65 |         if is_in_subentry_flow(node):\n   66 |             return\n   67 | \n   68 |         self.add_message(\n   69 |             \"home-assistant-config-flow-name-field\",\n   70 |             node=node,\n   71 |             args=(field_name,),\n   72 |         )","lines":25,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/pylint/plugins/pylint_home_assistant/checkers/config_flow/no_name.py#L48-L72"},{"ref":"pylint/plugins/pylint_home_assistant/checkers/config_flow/no_polling.py:54-69","code":"   54 |     def visit_call(self, node: nodes.Call) -> None:\n   55 |         \"\"\"Check for polling interval fields in vol.Required/Optional calls.\"\"\"\n   56 |         parsed = parse_module(node.root().name)\n   57 |         if parsed is None or parsed.module != Module.CONFIG_FLOW:\n   58 |             return\n   59 | \n   60 |         field_name = get_schema_field_name(node)\n   61 |         if field_name is None:\n   62 |             return\n   63 | \n   64 |         if field_name in _POLLING_FIELD_NAMES:\n   65 |             self.add_message(\n   66 |                 \"home-assistant-config-flow-polling-field\",\n   67 |                 node=node,\n   68 |                 args=(field_name,),\n   69 |             )","lines":16,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/pylint/plugins/pylint_home_assistant/checkers/config_flow/no_polling.py#L54-L69"},{"ref":"pylint/plugins/pylint_home_assistant/checkers/config_flow/unique_id_no_ip.py:51-87","code":"   51 |     def visit_call(self, node: nodes.Call) -> None:\n   52 |         \"\"\"Check async_set_unique_id(host-based-value) calls.\"\"\"\n   53 |         parsed = parse_module(node.root().name)\n   54 |         if parsed is None or parsed.module != Module.CONFIG_FLOW:\n   55 |             return\n   56 | \n   57 |         if not isinstance(node.func, nodes.Attribute):\n   58 |             return\n   59 |         if node.func.attrname != \"async_set_unique_id\":\n   60 |             return\n   61 | \n   62 |         unique_id_node: nodes.NodeNG | None = None\n   63 |         if node.args:\n   64 |             unique_id_nod
