          and (device_name := device.name_by_user or device.name)\n  940 |                     ):\n  941 |                         name = f\"{device_name} {name}\"\n  942 | \n  943 |                     entity[\"name\"] = name\n  944 | \n  945 |             if old_minor_version < 22:\n  946 |                 # Version 1.22 adds support for COMPUTED_NAME in\n  947 |                 # aliases and starts preserving their order.\n  948 |                 # To avoid a major version bump, we keep the old\n  949 |                 # aliases as-is and use aliases_v2 field instead.\n  950 |                 for entity in data[\"entities\"]:\n  951 |                     entity[\"aliases_v2\"] = [None, *entity[\"aliases\"]]\n  952 | \n  953 |                 for entity in data[\"deleted_entities\"]:\n  954 |                     entity[\"aliases_v2\"] = [None, *entity[\"aliases\"]]","lines":32,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/entity_registry.py#L923-L954"}]},
{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `async_get_or_create` (entity_registry.py lines 1378-1395), when the entity already exists the code calls `_async_update_entity` directly, bypassing the `hass.verify_event_loop_thread` check that appears at line 1397 for the creation path. `_async_update_entity` does call `verify_event_loop_thread` itself (line 1858), but only after reading `self.entities[entity_id]` and computing the diff. If called from a wrong thread this means shared registry state is accessed before the safety check fires.","fix":"Move the `hass.verify_event_loop_thread` call to the start of `_async_update_entity` before any reads of `self.entities`, or add it at the top of `async_get_or_create` before the entity_id lookup.","locations":[{"ref":"homeassistant/helpers/entity_registry.py:1464-1485","code":" 1464 |         entity_id = self.async_get_entity_id(domain, platform, unique_id)\n 1465 | \n 1466 |         if entity_id:\n 1467 |             return self._async_update_entity(\n 1468 |                 entity_id,\n 1469 |                 capabilities=capabilities,\n 1470 |                 config_entry_id=config_entry_id,\n 1471 |                 config_subentry_id=config_subentry_id,\n 1472 |                 device_id=device_id,\n 1473 |                 entity_category=entity_category,\n 1474 |                 has_entity_name=has_entity_name,\n 1475 |                 object_id_base=object_id_base,\n 1476 |                 original_device_class=original_device_class,\n 1477 |                 original_icon=original_icon,\n 1478 |                 original_name=original_name,\n 1479 |                 suggested_object_id=suggested_object_id,\n 1480 |                 supported_features=supported_features,\n 1481 |                 translation_key=translation_key,\n 1482 |                 unit_of_measurement=unit_of_measurement,\n 1483 |             )\n 1484 | \n 1485 |         self.hass.verify_event_loop_thread(\"entity_registry.async_get_or_create\")","lines":22,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/entity_registry.py#L1464-L1485"},{"ref":"homeassistant/helpers/entity_registry.py:1981","code":" 1981 |         self.hass.verify_event_loop_thread(\"entity_registry.async_update_entity\")","lines":1,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/entity_registry.py#L1981"}]},
{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `IntegrationSpecificGroup._handle_entity_registry_updated` (group.py lines 124-140), the handler listens to all entity registry events. For an `update` event that renames an entity, the event payload carries the NEW entity_id in `data['entity_id']` and the OLD one in `data['old_entity_id']`. The handler calls `entity_registry.async_get(event.data['entity_id'])` to check the unique_id, which works for the new ID but misses the case where the old entity_id is tracked in `self._member_entity_ids`. If the entity was in the member list under its old ID, the `'remove'` branch check on line 134 (`event.data['entity_id'] in self._member_entity_ids`) will not match the old ID, so the cached list won't be invalidated for renames.","fix":"For update events, also check `event.data.get('old_entity_id')` against `self._member_entity_ids`. Alternatively, subscribe via `async_track_entity_registry_updated_event` with the entity IDs of the members so renames are handled automatically.","locations":[{"ref":"homeassistant/helpers/group.py:124-140","code":"  124 |         def _handle_entity_registry_updated(event: Event[Any]) -> None:\n  125 |             \"\"\"Handle registry create or update event.\"\"\"\n  126 |             if (\n  127 |                 event.data[\"action\"] in {\"create\", \"update\"}\n  128 |                 and (entry := entity_registry.async_get(event.data[\"entity_id\"]))\n  129 |                 and entry.domain == entity.platform.domain\n  130 |                 and entry.platform == entity.platform.platform_name\n  131 |                 and entry.unique_id in self.member_unique_ids\n  132 |             ) or (\n  133 |                 event.data[\"action\"] == \"remove\"\n  134 |                 and self._member_entity_ids is not None\n  135 |                 and event.data[\"entity_id\"] in self._member_entity_ids\n  136 |             ):\n  137 |                 if self._member_entity_ids is not None:\n  138 |                     self._member_entity_ids = None\n  139 |                     del self.member_entity_ids\n  140 |                 entity.async_write_ha_state()","lines":17,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/group.py#L124-L140"}]},
{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`async_recreate` in instance_id.py (lines 50-58) saves a new UUID to persistent\nstorage but does NOT update the singleton cache stored in `hass.data[DATA_KEY]`.\nThe `async_get` function is decorated with `@singleton.singleton(DATA_KEY)`, which\ncaches its result in `hass.data[DATA_KEY]`. After `async_recreate` runs, any\nsubsequent call to `async_get` will still return the old UUID from the cache, making\nthe re-creation functionally inert for the current process lifetime.","fix":"After saving, update the singleton cache:\n\n    await store.async_save(data)\n    hass.data[DATA_KEY] = data[\"uuid\"]\n    return data[\"uuid\"]","locations":[{"ref":"homeassistant/helpers/instance_id.py:50-58","code":"   50 | async def async_recreate(hass: HomeAssistant) -> str:\n   51 |     \"\"\"Recreate a new unique ID for the hass instance.\"\"\"\n   52 |     store = storage.Store[dict[str, str]](hass, DATA_VERSION, DATA_KEY, True)\n   53 | \n   54 |     data = {\"uuid\": uuid.uuid4().hex}\n   55 | \n   56 |     await store.async_save(data)\n   57 | \n   58 |     return data[\"uuid\"]","lines":9,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/instance_id.py#L50-L58"}]},
{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"reject_nested_choose_selector (line 541) checks for a nested choose selector only when `choice['selector']` is a dict. If the selector was stored as a Selector instance (which the schema allows via `vol.Any(Selector, validate_selector)`), the isinstance check is False and a nested ChooseSelector instance is not detected.","fix":"Also check for Selector instances: `if isinstance(choice['selector'], ChooseSelector) or (isinstance(choice['selector'], dict) and _get_selector_type_and_class(choice['selector'])[0] == 'choose'): raise vol.Invalid(...)`.","locations":[{"ref":"homeassistant/helpers/selector.py:561-568","code":"  561 | def reject_nested_choose_selector(config: dict[str, Any]) -> dict[str, Any]:\n  562 |     \"\"\"Reject nested choose selectors.\"\"\"\n  563 |     for choice in config.get(\"choices\", {}).values():\n  564 |         if isinstance(choice[\"selector\"], dict):\n  565 |             selector_type, _ = _get_selector_type_and_class(choice[\"selector\"])\n  566 |             if selector_type == \"choose\":\n  567 |                 raise vol.Invalid(\"Nested choose selectors are not allowed\")\n  568 |     return config","lines":8,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/selector.py#L561-L568"}]},
{"id":"LOGIC_34","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"ChooseSelector.__call__ calls `selector(choice['selector'])` (line 600) where choice['selector'] can be a Selector instance (allowed by the schema: `vol.Any(Selector, validate_selector)`). The module-level `selector()` function expects a dict and will raise `vol.Invalid('Expected a dictionary')` when passed a Selector instance. In the non-dict data branch this error is silently swallowed by the except clause so the choice can never match; in the dict / active_choice branch (line 616) the same call is NOT inside a try/except, so the error propagates to the caller as an unexpected validation failure.","fix":"Before calling `selector(choice['selector'])(data)`, check whether the value is already a Selector instance and call it directly: `sel = choice['selector']; validated = (sel if isinstance(sel, Selector) else selector(sel))(data)`.","locations":[{"ref":"homeassistant/helpers/selector.py:618-641","code":"  618 |     def __call__(self, data: Any) -> Any:\n  619 |         \"\"\"Validate the passed selection.\"\"\"\n  620 |         if not isinstance(data, dict):\n  621 |             for choice in self.config[\"choices\"].values():\n  622 |                 try:\n  623 |                     validated = selector(choice[\"selector\"])(data)  # type: ignore[operator]\n  624 |                 except vol.Invalid, vol.MultipleInvalid:\n  625 |                     continue\n  626 |                 else:\n  627 |                     return validated\n  628 | \n  629 |             raise vol.Invalid(\"Value does not match any choice selector\")\n  630 | \n  631 |         if \"active_choice\" not in data:\n  632 |             raise vol.Invalid(\"Missing active_choice key\")\n  633 |         if data[\"active_choice\"] not in data:\n  634 |             raise vol.Invalid(\"Missing value for active choice\")\n  635 | \n  636 |         choices = self.config.get(\"choices\", {})\n  637 |         if data[\"active_choice\"] not in choices:\n  638 |             raise vol.Invalid(\"Invalid active_choice key\")\n  639 |         return selector(choices[data[\"active_choice\"]][\"selector\"])(  # type: ignore[operator]\n  640 |             data[data[\"active_choice\"]]\n  641 |         )","lines":24,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/selector.py#L618-L641"}]},
{"id":"LOGIC_35","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"CountrySelector.__call__ (line 839-841) only validates the country code against COUNTRIES when the `countries` config key is present. When `countries` is not configured, any arbitrary string passes validation unchecked. If the intent is to always ensure a valid ISO country code, the COUNTRIES check should be unconditional.","fix":"Add an unconditional `country not in COUNTRIES` check before (or separate from) the configured-list check, so invalid country codes are rejected regardless of whether `countries` is set.","locations":[{"ref":"homeassistant/helpers/selector.py:859-866","code":"  859 |     def __call__(self, data: Any) -> Any:\n  860 |         \"\"\"Validate the passed selection.\"\"\"\n  861 |         country: str = vol.Schema(str)(data)\n  862 |         if \"countries\" in self.config and (\n  863 |             country not in self.config[\"countries\"] or country not in COUNTRIES\n  864 |         ):\n  865 |             raise vol.Invalid(f\"Value {country} is not a valid option\")\n  866 |         return country","lines":8,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/selector.py#L859-L866"}]},
{"id":"LOGIC_36","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `_async_handle_entity_calls`, when multiple entities are called in parallel via `asyncio.gather(..., return_exceptions=True)`, if any entity raises a `BaseException`, the code re-raises the first encountered exception with `raise result from None`. The remaining results are not inspected, meaning exceptions from other entities are silently discarded. Additionally, the `should_poll` update tasks that follow are never started for those entities, skipping post-call state updates.","fix":"Log or collect all exceptions from the gather results before raising; consider using `ExceptionGroup` or at minimum log secondary failures before raising the first.","locations":[{"ref":"homeassistant/helpers/service.py:812-816","code":"  812 |     response_data: EntityServiceResponse = {}\n  813 |     for entity, result in zip(entities, results, strict=True):\n  814 |         if isinstance(result, BaseException):\n  815 |             raise result from None\n  816 |         response_data[entity.entity_id] = result","lines":5,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/service.py#L812-L816"}]},
{"id":"LOGIC_37","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The `_initialize` function in `significant_change.py` has a comment saying 'Marked as singleton so multiple calls all wait for same output', but it has no actual singleton mechanism. Two concurrent coroutines can both pass the `if DATA_FUNCTIONS in hass.data:` guard before either has finished initializing. The second coroutine then overwrites `hass.data[DATA_FUNCTIONS]` with a new empty dict, orphaning the dict the first coroutine is populating. The first coroutine's registered platforms are lost.","fix":"Apply the `@singleton` decorator (with `async_=True`) from `homeassistant.helpers.singleton` to `_initialize`, or guard initialization with a `Future` stored in `hass.data` so concurrent callers await the same result.","locations":[{"ref":"homeassistant/helpers/significant_change.py:92-109","code":"   92 | # Marked as singleton so multiple calls all wait for same output.\n   93 | async def _initialize(hass: HomeAssistant) -> None:\n   94 |     \"\"\"Initialize the functions.\"\"\"\n   95 |     if DATA_FUNCTIONS in hass.data:\n   96 |         return\n   97 | \n   98 |     functions = hass.data[DATA_FUNCTIONS] = {}\n   99 | \n  100 |     @callback\n  101 |     def process_platform(\n  102 |         hass: HomeAssistant,\n  103 |         component_name: str,\n  104 |         platform: SignificantChangeProtocol,\n  105 |     ) -> None:\n  106 |         \"\"\"Process a significant change platform.\"\"\"\n  107 |         functions[component_name] = platform.async_check_significant_change\n  108 | \n  109 |     await async_process_integration_platforms(hass, PLATFORM, process_platform)","lines":18,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/significant_change.py#L92-L109"}]},
{"id":"LOGIC_38","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `shuffle()`, the check `if seed:` is falsy for `seed=0`, `seed=0.0`, `seed=False`, and empty strings/lists. Callers that pass `seed=0` as a deterministic shuffle seed will silently fall through to `random.shuffle(items)` (non-deterministic) instead of `random.Random(0).shuffle(items)`. The intent is clearly to check whether a seed was provided.","fix":"Change `if seed:` to `if seed is not None:`.","locations":[{"ref":"homeassistant/helpers/template/extensions/collection.py:122-126","code":"  122 |         if seed:\n  123 |             r = random.Random(seed)\n  124 |             r.shuffle(items)\n  125 |         else:\n  126 |             random.shuffle(items)","lines":5,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/template/extensions/collection.py#L122-L126"}]},
{"id":"LOGIC_39","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`statistical_mode` in math.py treats its default-value argument inconsistently compared to `average` and `median`. When `args[0]` is an iterable that is NOT a `list` or `tuple` (e.g. `range`, `dict.values`, a generator) and `len(args) > 1`, neither the first branch (`len(args) == 1`, line 275) nor the second branch (`isinstance(args[0], list | tuple)`, line 277) matches. Execution falls to `else: mode_list = args` (line 284), so the entire `args` tuple (including what the caller intended as the default) is used as the data sequence. In contrast, `average` and `median` use `isinstance(args[0], Iterable)` for the same check, correctly treating any iterable as the data and the second positional argument as the default.","fix":"Change line 277 from `elif isinstance(args[0], list | tuple):` to `elif isinstance(args[0], Iterable):` to match the behavior of `average` and `median`.","locations":[{"ref":"homeassistant/helpers/template/extensions/math.py:275-291","code":"  275 |         if len(args) == 1 and isinstance(args[0], Iterable):\n  276 |             mode_list = args[0]\n  277 |         elif isinstance(args[0], list | tuple):\n  278 |             mode_list = args[0]\n  279 |             if len(args) > 1 and default is _SENTINEL:\n  280 |                 default = args[1]\n  281 |         elif len(args) == 1:\n  282 |             raise TypeError(f\"'{type(args[0]).__name__}' object is not iterable\")\n  283 |         else:\n  284 |             mode_list = args\n  285 | \n  286 |         try:\n  287 |             return statistics.mode(mode_list)\n  288 |         except TypeError, statistics.StatisticsError:\n  289 |             if default is _SENTINEL:\n  290 |                 raise_no_default(\"statistical_mode\", args)\n  291 |             return default","lines":17,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/template/extensions/math.py#L275-L291"}]},
{"id":"LOGIC_40","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `_render_availability_template`, the state-clearing block (lines 286-289) is guarded by `if ... is False:`, which is a strict identity check. However, `result_as_boolean` (called right after at line 291) treats any falsy value - including `0`, `None`, or the string `\"0\"` - as unavailable. When the availability template renders to `0` or `None` (both falsy and parsed by `parse_result=True` as int or NoneType), the entity correctly becomes unavailable but `_rendered` is NOT cleared. This means stale state values (icon, name, attributes, etc.) are retained for an unavailable entity, inconsistently with the `False` case where they are wiped.","fix":"Change `if (...) is False:` to `if not result_as_boolean(available):` (or evaluate result_as_boolean once and branch on it) so that state clearing happens for all falsy availability results, not just the boolean `False` literal.","locations":[{"ref":"homeassistant/helpers/trigger_template_entity.py:279-289","code":"  279 |             if (\n  280 |                 available := self._availability_template.async_render(\n  281 |                     variables, parse_result=True, strict=True\n  282 |                 )\n  283 |             ) is False:\n  284 |                 name = self._rendered.get(CONF_NAME)\n  285 |                 self._rendered = dict(self._static_rendered)\n  286 |                 if name is not None and CONF_NAME not in self._static_rendered:\n  287 |                     self._rendered[CONF_NAME] = name\n  288 | \n  289 |             self._available = result_as_boolean(available)","lines":11,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/trigger_template_entity.py#L279-L289"}]},
{"id":"LOGIC_41","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `_async_refresh`, when a recoverable `OAuth2TokenRequestError` (non-reauth subtype) is raised, `last_update_success` is set to `False` (line 469). But the handler then falls through, and there is a `return` statement at line 463 inside the `OAuth2TokenRequestReauthError` branch. The real problem is in the non-reauth path: after the except block for `OAuth2TokenRequestError` completes (lines 465-469 without a reauth subtype), execution does fall through to the outer try's else/finally. However, for the REAUTH case (lines 447-463), after setting `auth_failed=True` and `last_update_success=False` and calling `async_start_reauth_if_available`, the `return` at line 463 exits the function. Python's `finally` (line 563) still executes, but the code from line 574 onward (`_async_refresh_finished`, `async_update_listeners`) does NOT run. As a result, listeners are never told that `last_update_success` changed from `True` to `False`, leaving coordinator entities displayed as available even though authentication has failed and a reauth flow has started.","fix":"Remove the `return` at line 463 and instead `raise` to propagate out of the except block naturally, or restructure so that `_async_refresh_finished()` and `async_update_listeners()` are called via the `finally` block instead of after it. Alternatively, call `self.async_update_listeners()` explicitly before returning when `last_update_success` changed.","locations":[{"ref":"homeassistant/helpers/update_coordinator.py:453-469","code":"  453 |             if isinstance(err, OAuth2TokenRequestReauthError):\n  454 |                 # Non-recoverable error\n  455 |                 auth_failed = True\n  456 |                 if self.last_update_success:\n  457 |                     if log_failures:\n  458 |                         self.logger.error(\n  459 |                             \"Authentication failed while fetching %s data: %s\",\n  460 |                             self.name,\n  461 |                             err,\n  462 |                         )\n  463 |                     self.last_update_success = False\n  464 |                 if raise_on_auth_failed:\n  465 |                     raise ConfigEntryAuthFailed from err\n  466 | \n  467 |                 if self.config_entry:\n  468 |                     self.config_entry.async_start_reauth_if_available(self.hass)\n  469 |                 return","lines":17,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/update_coordinator.py#L453-L469"},{"ref":"homeassistant/helpers/update_coordinator.py:588-598","code":"  588 |         self._async_refresh_finished()\n  589 | \n  590 |         if not self.last_update_success and not previous_update_success:\n  591 |             return\n  592 | \n  593 |         if (\n  594 |             self.always_update\n  595 |             or self.last_update_success != previous_update_success\n  596 |             or previous_data != self.data\n  597 |         ):\n  598 |             self.async_update_listeners()","lines":11,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/update_coordinator.py#L588-L598"}]},
{"id":"LOGIC_42","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `loader.py`, `platforms_exists` marks a platform as missing in `_missing_platforms_cache` even when the platform IS found. The logic checks `if full_name not in missing_platforms and (f\"{platform_name}.py\" in files or platform_name in files)` then appends to `existing_platforms` and `continue`s. But when neither condition matches (platform not in missing cache AND the file doesn't exist), it falls through to `missing_platforms[full_name] = True`. However, if `full_name` IS already in `missing_platforms`, the check short-circuits without re-caching, which is correct. But if a platform exists as a file but was previously cached as missing (e.g., hot-reload scenario), it will never be re-checked because the missing cache takes precedence over the file check. The missing platforms cache is never evicted, so a platform that was temporarily absent can never recover in the same HA session.","fix":"Document the intentional permanent nature of the missing platforms cache as a design decision, or add a mechanism to invalidate it when integrations are reloaded. At minimum, make the cache eviction semantics explicit.","locations":[{"ref":"homeassistant/loader.py:1269-1276","code":" 1269 |         for platform_name in platform_names:\n 1270 |             full_name = f\"{domain}.{platform_name}\"\n 1271 |             if full_name not in missing_platforms and (\n 1272 |                 f\"{platform_name}.py\" in files or platform_name in files\n 1273 |             ):\n 1274 |                 existing_platforms.append(platform_name)\n 1275 |                 continue\n 1276 |             missing_platforms[full_name] = True","lines":8,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/loader.py#L1269-L1276"}]},
{"id":"LOGIC_43","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `setup.py`, the `_async_process_dependencies` function has dead code: the check `if dependencies_tasks:` on line 238 is always True at that point because it was already checked to be non-empty on line 235 (`if not dependencies_tasks: return []`). The redundant check on line 238 adds no value and the logging could be moved inside the initial non-empty check.","fix":"Remove the redundant `if dependencies_tasks:` check on line 238 and place the logging statement directly after the early return check is passed, or merge both blocks.","locations":[{"ref":"homeassistant/setup.py:235-243","code":"  235 |     if not dependencies_tasks:\n  236 |         return []\n  237 | \n  238 |     if dependencies_tasks:\n  239 |         _LOGGER.debug(\n  240 |             \"Dependency %s will wait for dependencies %s\",\n  241 |             integration.domain,\n  242 |             dependencies_tasks.keys(),\n  243 |         )","lines":9,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/setup.py#L235-L243"}]},
{"id":"LOGIC_44","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `util/__init__.py`, the `convert` function uses the bare `except ValueError, TypeError:` syntax on line 65. In Python 3, this is not valid multi-exception syntax. The correct form is `except (ValueError, TypeError):` with parentheses. The bare comma form is Python 2 syntax where `TypeError` would be treated as the exception variable name binding, not a second exception type. In Python 3.x this is actually a SyntaxError, meaning the module would fail to import entirely. However, since the CLAUDE.md notes that Python 3.14 allows `except TypeA, TypeB:` without parentheses, this may be intentional. Regardless, the intent is to catch both ValueError and TypeError.","fix":"Verify Python 3.14 compatibility: if `except ValueError, TypeError:` truly works in 3.14, add a comment noting this is 3.14+ specific syntax. Otherwise change to `except (ValueError, TypeError):`.","locations":[{"ref":"homeassistant/util/__init__.py:64-67","code":"   64 |         return default if value is None else to_type(value)\n   65 |     except ValueError, TypeError:\n   66 |         # If value could not be converted\n   67 |         return default","lines":4,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/util/__init__.py#L64-L67"}]},
{"id":"LOGIC_45","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `util/json.py`, the `load_json_array` and `load_json_object` functions call `_LOGGER.exception(...)` outside of an exception handler on lines 98 and 118. `_LOGGER.exception()` logs the current exception info (via `sys.exc_info()`), but since these are called when the loaded value is the wrong type (not during exception handling), `sys.exc_info()` will be `(None, None, None)` and the log line will have no useful traceback. Additionally, the format string on lines 99 and 119 has a bug: `{type(value)}` is wrapped in a set literal `{type(value)}`, so the logged message will read \"Expected JSON to be parsed as a list got {<class 'dict'>}\" rather than just the type.","fix":"Change `_LOGGER.exception(...)` to `_LOGGER.error(...)` since these calls are not inside an except block. Also fix the format string from `{type(value)}` to `%s` or remove the extra braces: `type(value)` instead of `{type(value)}`.","locations":[{"ref":"homeassistant/util/json.py:97-101","code":"   97 |         return value\n   98 |     _LOGGER.exception(\n   99 |         \"Expected JSON to be parsed as a list got %s in: %s\", {type(value)}, filename\n  100 |     )\n  101 |     raise HomeAssistantError(f\"Expected JSON to be parsed as a list got {type(value)}\")","lines":5,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/util/json.py#L97-L101"},{"ref":"homeassistant/util/json.py:117-121","code":"  117 |         return value\n  118 |     _LOGGER.exception(\n  119 |         \"Expected JSON to be parsed as a dict got %s in: %s\", {type(value)}, filename\n  120 |     )\n  121 |     raise HomeAssistantError(f\"Expected JSON to be parsed as a dict got {type(value)}\")","lines":5,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/util/json.py#L117-L121"}]},
{"id":"LOGIC_46","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `util/location.py`, the `_get_whoami` function uses bare comma exception syntax on lines 167 and 172: `except aiohttp.ClientError, TimeoutError:` and `except aiohttp.ClientError, ValueError:`. This is the same Python 2 vs Python 3 issue: in Python 3 `except ExcA, ExcB:` is invalid unless Python 3.14 explicitly permits it. If this is a Python 3.14 feature, it should be documented. More critically, `float(raw_info.get(\"latitude\"))` and `float(raw_info.get(\"longitude\"))` on lines 184-185 will raise `TypeError` (not `ValueError`) when the key is missing and `get` returns `None`, since `float(None)` raises `TypeError`. This TypeError is not caught, so if the whoami endpoint omits latitude or longitude, the function raises an unhandled exception instead of returning `None`.","fix":"Add `TypeError` to the second except clause on line 172: `except (aiohttp.ClientError, ValueError, TypeError):`. Also protect the `float()` conversions by providing a fallback (e.g., `raw_info.get(\"latitude\", 0)`) or wrapping in a try/except.","locations":[{"ref":"homeassistant/util/location.py:167-185","code":"  167 |     except aiohttp.ClientError, TimeoutError:\n  168 |         return None\n  169 | \n  170 |     try:\n  171 |         raw_info = await resp.json()\n  172 |     except aiohttp.ClientError, ValueError:\n  173 |         return None\n  174 | \n  175 |     return {\n  176 |         \"ip\": raw_info.get(\"ip\"),\n  177 |         \"country_code\": raw_info.get(\"country\"),\n  178 |         \"currency\": raw_info.get(\"currency\"),\n  179 |         \"region_code\": raw_info.get(\"region_code\"),\n  180 |         \"region_name\": raw_info.get(\"region\"),\n  181 |         \"city\": raw_info.get(\"city\"),\n  182 |         \"zip_code\": raw_info.get(\"postal_code\"),\n  183 |         \"time_zone\": raw_info.get(\"timezone\"),\n  184 |         \"latitude\": float(raw_info.get(\"latitude\")),\n  185 |         \"longitude\": float(raw_info.get(\"longitude\")),","lines":19,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/util/location.py#L167-L185"}]},
{"id":"LOGIC_47","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"collect_action_handlers in helpers.py only detects async_register_entity_service calls where\nthe handler argument (third positional arg) is a nodes.Const (literal string) or nodes.Name\n(bare function reference). It misses the common pattern where a bound method or attribute is\npassed as the handler, for example:\n\n    platform.async_register_entity_service(\n        SERVICE_NAME, schema, MyEntity.do_thing,\n    )\n\nwhere `MyEntity.do_thing` is a nodes.Attribute, not nodes.Name. Also misses lambda\nexpressions.\n\nFor hass.services.async_register(DOMAIN, \"name\", handler), only nodes.Name handlers are\ndetected (line 68), missing attribute access forms.\n\nThe result is that registered_handlers stays empty for these patterns, so\n_is_action_handler returns False and the swallowed-exception check is not applied.","fix":"For async_register_entity_service, also handle nodes.Attribute as a handler:\n\n    elif isinstance(call.args[2], nodes.Attribute):\n        result.registered_handlers.add(call.args[2].attrname)\n\nDocument lambdas as a known undetectable case. Apply the same fix to hass.services.async_register.","locations":[{"ref":"pylint/plugins/pylint_home_assistant/checkers/actions/helpers.py:53-77","code":"   53 |     for call in module.nodes_of_class(nodes.Call):\n   54 |         match call.func:\n   55 |             case nodes.Attribute(attrname=\"async_register_entity_service\"):\n   56 |                 if len(call.args) >= 3:\n   57 |                     # String method name: \"async_set_speed\"\n   58 |                     if isinstance(call.args[2], nodes.Const):\n   59 |                         result.registered_handlers.add(call.args[2].value)\n   60 |                     # Function reference: async_handle_snapshot_service\n   61 |                     elif isinstance(call.args[2], nodes.Name):\n   62 |                         result.registered_handlers.add(call.args[2].name)\n   63 |             # hass.services.async_register(DOMAIN, \"name\", handler)\n   64 |             case nodes.Attribute(\n   65 |                 attrname=\"async_register\",\n   66 |                 expr=nodes.Attribute(attrname=\"services\"),\n   67 |             ):\n   68 |                 if len(call.args) >= 3 and isinstance(call.args[2], nodes.Name):\n   69 |                     result.registered_handlers.add(call.args[2].name)\n   70 |             # async_register_admin_service(hass, DOMAIN, \"name\", handler)\n   71 |             # Also matches service.async_register_admin_service(...)\n   72 |             case (\n   73 |                 nodes.Name(name=\"async_register_admin_service\")\n   74 |                 | nodes.Attribute(attrname=\"async_register_admin_service\")\n   75 |             ):\n   76 |                 if len(call.args) >= 4 and isinstance(call.args[3], nodes.Name):\n   77 |                     result.registered_handlers.add(call.args[3].name)","lines":25,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/pylint/plugins/pylint_home_assistant/checkers/actions/helpers.py#L53-L77"}]},
{"id":"LOGIC_48","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"_except_block_swallows produces false positives when a non-log statement precedes a log\ncall in an except block. The final return is `not has_any_statement or has_log_call`. Once\n`has_any_statement` is True (set by any non-log, non-pass, non-raise, non-return statement),\nthe expression evaluates to `False or has_log_call`. So a block like:\n\n    except SomeError:\n        cleanup()\n        _LOGGER.warning(...)\n\nsets `has_any_statement = True` (for `cleanup()`), then `has_log_call = True` (for the log\ncall), and the function returns `False or True = True` - incorrectly flagged as swallowed.\nThe intent is to flag log-only blocks, but mixing cleanup code with logging is legitimate.","fix":"Track whether only log/pass statements have been seen, and reset when a meaningful action\nis taken:\n\n    def _except_block_swallows(handler):\n        log_only = True\n        for child in handler.body:\n            if isinstance(child, nodes.Raise):\n                return False\n            if isinstance(child, nodes.Pass):\n                continue\n            if isinstance(child, nodes.Expr) and isinstance(child.value, nodes.Call):\n                call = child.value\n                if (isinstance(call.func, nodes.Attribute)\n                        and call.func.attrname in ('error', 'exception', 'warning')\n                        and isinstance(call.func.expr, nodes.Name)\n                        and call.func.expr.name in ('_LOGGER', 'LOGGER')):\n                    continue\n            if isinstance(child, nodes.Return) and log_only:\n                return True\n            log_only = False\n        return log_only","locations":[{"ref":"pylint/plugins/pylint_home_assistant/checkers/actions/swallowed_exceptions.py:23-56","code":"   23 | def _except_block_swallows(handler: nodes.ExceptHandler) -> bool:\n   24 |     \"\"\"Return True if the except block swallows the exception.\n   25 | \n   26 |     Flags blocks that:\n   27 |     - Are empty (just ``pass``)\n   28 |     - Call ``_LOGGER.error/exception/warning`` and nothing else\n   29 |     - Log then ``return`` (silently swallowing the error)\n   30 | \n   31 |     Does NOT flag blocks that:\n   32 |     - Contain a ``raise`` statement (any kind)\n   33 |     \"\"\"\n   34 |     has_log_call = False\n   35 |     has_any_statement = False\n   36 |     for child in handler.body:\n   37 |         if isinstance(child, nodes.Raise):\n   38 |             return False\n   39 |         if isinstance(child, nodes.Pass):\n   40 |             continue\n   41 |         has_any_statement = True\n   42 |         if isinstance(child, nodes.Expr) and isinstance(child.value, nodes.Call):\n   43 |             call = child.value\n   44 |             if (\n   45 |                 isinstance(call.func, nodes.Attribute)\n   46 |                 and call.func.attrname in (\"error\", \"exception\", \"warning\")\n   47 |                 and isinstance(call.func.expr, nodes.Name)\n   48 |                 and call.func.expr.name in (\"_LOGGER\", \"LOGGER\")\n   49 |             ):\n   50 |                 has_log_call = True\n   51 |                 continue\n   52 |         if isinstance(child, nodes.Return) and has_log_call:\n   53 |             return True\n   54 | \n   55 |     # Empty body (just pass) or log-only body\n   56 |     return not has_any_statement or has_log_call","lines":34,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/pylint/plugins/pylint_home_assistant/checkers/actions/swallowed_exceptions.py#L23-L56"}]},
{"id":"LOGIC_49","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"_check_body_shallow does not scan the `orelse` clause of For, AsyncFor, and While nodes.\nPython for/while statements support an `else` clause that runs when the loop finishes\nwithout break. A contextlib.suppress or swallowing try/except inside a for...else block is\nsilently ignored.\n\nThe If node does recurse into both body and orelse (line 119), but the loop nodes only\nrecurse into body (line 125). This inconsistency produces false negatives for loop-else\npatterns.","fix":"Add orelse scanning for loop nodes:\n\n    elif isinstance(child, (nodes.For, nodes.AsyncFor, nodes.While)):\n        result = _check_body_shallow(child.body) or _check_body_shallow(child.orelse)\n        if result:\n            return result","locations":[{"ref":"pylint/plugins/pylint_home_assistant/checkers/actions/swallowed_exceptions.py:124-127","code":"  124 |         elif isinstance(child, (nodes.For, nodes.AsyncFor, nodes.While)):\n  125 |             result = _check_body_shallow(child.body)\n  126 |             if result:\n  127 |                 return result","lines":4,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/pylint/plugins/pylint_home_assistant/checkers/actions/swallowed_exceptions.py#L124-L127"}]},
{"id":"LOGIC_50","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"_body_guarantees_target_assign in entity_unique_id.py does not treat a bare `raise`\nstatement as a flow terminator. `_stmts_contain_terminator` handles Return, Break, and\nContinue but omits Raise. This means that an early-raise guard:\n\n    def __init__(self):\n        if not valid:\n            raise ValueError(\"bad\")\n        # self._attr_unique_id assignment omitted\n\nwould have `_stmts_contain_terminator([raise])` return False, allowing the scan to treat\nthe if-body as non-terminating. In practice this causes the checker to treat the code\nafter the guard as always-reachable, potentially reporting a false positive for the missing\nassignment when the guard covers the only path that would lack it. Conversely, a method\nwhose entire body is `raise NotImplementedError()` would not be seen as terminating and\nscanning would continue to the (absent) assignment, producing a false positive.","fix":"Add nodes.Raise to _stmts_contain_terminator:\n\n    case nodes.Return() | nodes.Break() | nodes.Continue() | nodes.Raise():\n        return True\n\nAnd in _body_guarantees_target_assign treat a top-level Raise as a terminator:\n\n    case nodes.Return() | nodes.Break() | nodes.Continue() | nodes.Raise():\n        return False","locations":[{"ref":"pylint/plugins/pylint_home_assistant/checkers/quality_scale/entity_unique_id.py:159-169","code":"  159 | def _stmts_contain_terminator(stmts: list[nodes.NodeNG]) -> bool:\n  160 |     \"\"\"Return True if any top-level or nested-If statement is a terminator.\"\"\"\n  161 |     for stmt in stmts:\n  162 |         match stmt:\n  163 |             case nodes.Return() | nodes.Break() | nodes.Continue():\n  164 |                 return True\n  165 |             case nodes.If(body=body, orelse=orelse) if _stmts_contain_terminator(\n  166 |                 body\n  167 |             ) or _stmts_contain_terminator(orelse):\n  168 |                 return True\n  169 |     return False","lines":11,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/pylint/plugins/pylint_home_assistant/checkers/quality_scale/entity_unique_id.py#L159-L169"},{"ref":"pylint/plugins/pylint_home_assistant/checkers/quality_scale/entity_unique_id.py:172-206","code":"  172 | def _body_guarantees_target_assign(stmts: list[nodes.NodeNG]) -> bool:\n  173 |     \"\"\"Return True if every successful path through *stmts* reaches the target.\n  174 | \n  175 |     Walks the statement list in order. Side-effect statements\n  176 |     (``Assign``, ``Expr``, ``AugAssign``, ``Pass``, etc.) are skipped.\n  177 |     Terminators (``return``/``break``/``continue``) end the scan with\n  178 |     False. For an ``If``, the target is reached if both branches reach\n  179 |     it; otherwise, if either branch may terminate, the scan stops;\n  180 |     otherwise the ``If`` is treated as a side-effect block and scanning\n  181 |     continues.\n  182 | \n  183 |     Loops, ``try``, ``with``, etc. are treated as fall-through (we do\n  184 |     not recurse into them): a conservative direction that may miss\n  185 |     some genuinely missing assignments but never produces a false\n  186 |     positive for working code.\n  187 |     \"\"\"\n  188 |     for stmt in stmts:\n  189 |         if _stmt_is_target_assign(stmt):\n  190 |             return True\n  191 |         match stmt:\n  192 |             case nodes.Return() | nodes.Break() | nodes.Continue():\n  193 |                 return False\n  194 |             case nodes.If(body=body, orelse=orelse):\n  195 |                 if (\n  196 |                     _body_guarantees_target_assign(body)\n  197 |                     and orelse\n  198 |                     and _body_guarantees_target_assign(orelse)\n  199 |                 ):\n  200 |                     return True\n  201 |                 if _stmts_contain_terminator(body) or _stmts_contain_terminator(orelse):\n  202 |                     return False\n  203 |         # Other statements (Assign, AnnAssign, Expr, AugAssign, Pass,\n  204 |         # For, While, Try, With, FunctionDef, etc.) are treated as\n  205 |         # fall-through.\n  206 |     return False","lines":35,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/pylint/plugins/pylint_home_assistant/checkers/quality_scale/entity_unique_id.py#L172-L206"}]},
{"id":"LOGIC_51","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`test_determinism.py` applies three exemptions for `if` statements (guard clause,\nparameter reference, and no-assert branches) but applies NONE of those exemptions for\n`match` statements. Every `match` statement inside a `test_*` function is flagged\nunconditionally, even when the subject is a function parameter (analogous to the\n`_condition_references_parameter` exemption for `if`) or when no branch contains an\nassert. This asymmetry produces false positives for valid parametrize-driven match\npatterns.","fix":"Apply the same three exemptions to `match` statements that are already applied to `if`\nstatements: skip if the match subject references a parameter, skip if no case body\ncontains an assert, and skip if the match is a guard (single case with raise/return).","locations":[{"ref":"pylint/plugins/pylint_home_assistant/checkers/test_determinism.py:138-143","code":"  138 |             elif isinstance(child, nodes.Match):\n  139 |                 self.add_message(\n  140 |                     \"home-assistant-test-non-deterministic\",\n  141 |                     node=child,\n  142 |                     args=(node.name, \"match\"),\n  143 |                 )","lines":6,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/pylint/plugins/pylint_home_assistant/checkers/test_determinism.py#L138-L143"}]},
{"id":"LOGIC_52","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`redundant_usefixtures.py`'s `_collect_conftest_fixtures` traverses parent directories\nlooking for `conftest.py` files, stopping when `current.name == \"tests\"`. The stop\ncondition is checked BEFORE examining that directory, so `tests/conftest.py` is never\nloaded. Any autouse or `pytestmark` fixtures defined in the top-level `tests/conftest.py`\nare therefore not included in `_module_fixtures`, producing false negatives (redundant\n`@pytest.mark.usefixtures` decorators that should be flagged are silently ignored).","fix":"Change the loop to continue until the directory's PARENT is \"tests\" (or no longer\ncontains a \"tests\" ancestor), so that `tests/conftest.py` itself is also loaded.\nAlternatively, change the while condition to `while True:` and break after processing\nthe directory named \"tests\".","locations":[{"ref":"pylint/plugins/pylint_home_assistant/checkers/tests/redundant_usefixtures.py:126-138","code":"  126 |     current = module_dir\n  127 |     while current.name and current.name != \"tests\":\n  128 |         conftest_path = current / \"conftest.py\"\n  129 |         if conftest_path.exists():\n  130 |             try:\n  131 |                 conftest_module = astroid.MANAGER.ast_from_file(str(conftest_path))\n  132 |                 fixtures.update(_collect_module_usefixtures(conftest_module))\n  133 |                 fixtures.update(_collect_autouse_fixtures(conftest_module))\n  134 |             except astroid.exceptions.AstroidSyntaxError:\n  135 |                 pass\n  136 |         current = current.parent\n  137 | \n  138 |     return fixtures","lines":13,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/pylint/plugins/pylint_home_assistant/checkers/tests/redundant_usefixtures.py#L126-L138"}]},
{"id":"LOGIC_53","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"HassTypeHintChecker.visit_classdef uses `node.ancestors()` (line 120) instead of the\nproject's `extended_ancestors()` helper. The standard `ancestors()` from astroid silently\ndrops subscript-style generic bases such as `class Foo(Base[T])`. The comment in\nast_utils.py explicitly documents this gap. As a result, a class like:\n\n    class MySensor(CoordinatorEntity[MyCoordinator]):\n        ...\n\nwill not be matched by any ClassTypeHintMatch whose base_class is \"CoordinatorEntity\",\ncausing all matched type-hint checks to be silently skipped. Other checkers in the same\ncodebase (entity_unique_id.py, has_entity_name.py) already use extended_ancestors to avoid\nthis problem.","fix":"Replace:\n    ancestors = list(node.ancestors())  # cache result for inside loop\n\nwith:\n    from pylint_home_assistant.helpers.ast_utils import extended_ancestors\n    ancestors = list(extended_ancestors(node))\n\nThe result is already stored as a list, so iterating it twice is fine.","locations":[{"ref":"pylint/plugins/pylint_home_assistant/checkers/type_hints/__init__.py:120","code":"  120 |         ancestors = list(node.ancestors())  # cache result for inside loop","lines":1,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/pylint/plugins/pylint_home_assistant/checkers/type_hints/__init__.py#L120"},{"ref":"pylint/plugins/pylint_home_assistant/helpers/ast_utils.py:17-57","code":"   17 | def subscript_base_classes(class_node: nodes.ClassDef) -> Iterator[nodes.ClassDef]:\n   18 |     \"\"\"Yield ClassDefs from subscript bases (e.g. ``class B(Base[T])``).\n   19 | \n   20 |     astroid's ``ancestors()`` drops Subscript bases such as\n   21 |     ``VeSyncBaseEntity[VeSyncFanBase | VeSyncPurifier]`` (PEP-695 generic\n   22 |     syntax), so this method recovers them by inferring the subscript's\n   23 |     value.\n   24 |     \"\"\"\n   25 |     for base in class_node.bases:\n   26 |         if not isinstance(base, nodes.Subscript):\n   27 |             continue\n   28 |         try:\n   29 |             inferred = list(base.value.infer())\n   30 |         except astroid.exceptions.InferenceError:\n   31 |             continue\n   32 |         for inferred_node in inferred:\n   33 |             if isinstance(inferred_node, nodes.ClassDef):\n   34 |                 yield inferred_node\n   35 | \n   36 | \n   37 | def extended_ancestors(class_node: nodes.ClassDef) -> Iterator[nodes.ClassDef]:\n   38 |     \"\"\"Yield all ancestors including transitive subscript-based ones.\"\"\"\n   39 |     seen: set[str] = set()\n   40 |     stack: list[nodes.ClassDef] = [class_node]\n   41 | \n   42 |     while stack:\n   43 |         current = stack.pop()\n   44 |         for ancestor in safe_ancestors(current):\n   45 |             qname = ancestor.qname()\n   46 |             if qname in seen:\n   47 |                 continue\n   48 |             seen.add(qname)\n   49 |             yield ancestor\n   50 |             stack.append(ancestor)\n   51 |         for subscript_base in subscript_base_classes(current):\n   52 |             qname = subscript_base.qname()\n   53 |             if qname in seen:\n   54 |                 continue\n   55 |             seen.add(qname)\n   56 |             yield subscript_base\n   57 |             stack.append(subscript_base)","lines":41,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/pylint/plugins/pylint_home_assistant/helpers/ast_utils.py#L17-L57"}]},
{"id":"LOGIC_54","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"HassTypeHintChecker.visit_classdef calls _visit_class_functions once per matching ancestor\n(lines 130-134). If the MRO contains two ancestors with the same short `.name` (which can\nhappen when an integration re-exports a class under the same name), the method is called\nredundantly for the same class matcher. While the `checked_class_methods` set prevents\ndouble-flagging the same method name, the first call marks all matched methods as checked,\nmeaning subsequent matchers for the same base_class name cannot run their checks against\nthose methods. The loop should break after the first match per class_matcher.","fix":"Add a break after the inner call to ensure each ClassTypeHintMatch fires at most once per\nclass:\n\n    for ancestor in ancestors:\n        if ancestor.name == class_matcher.base_class:\n            self._visit_class_functions(\n                node, class_matcher.matches, checked_class_methods\n            )\n            break","locations":[{"ref":"pylint/plugins/pylint_home_assistant/checkers/type_hints/__init__.py:128-134","code":"  128 |             if skip_matcher:\n  129 |                 continue\n  130 |             for ancestor in ancestors:\n  131 |                 if ancestor.name == class_matcher.base_class:\n  132 |                     self._visit_class_functions(\n  133 |                         node, class_matcher.matches, checked_class_methods\n  134 |                     )","lines":7,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/pylint/plugins/pylint_home_assistant/checkers/type_hints/__init__.py#L128-L134"}]},
{"id":"LOGIC_55","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`get_integration_dir` in `helpers/integration.py` builds its iteration sequence as\n`(file_path.parent, *file_path.parents)`. `file_path.parent` is identical to\n`file_path.parents[0]`, so the first element of the iteration is duplicated. On every\ncall the integration directory check is performed twice for the immediate parent of\nthe file. While this does not affect correctness (the first iteration finds the right\nanswer and returns), it is misleading and wastes one iteration per call.","fix":"Replace `(file_path.parent, *file_path.parents)` with `file_path.parents` which\nstarts from `file_path.parents[0]` (the immediate parent) without duplicating it.","locations":[{"ref":"pylint/plugins/pylint_home_assistant/helpers/integration.py:32-39","code":"   32 |     file_path = Path(module.file)\n   33 |     for parent in (file_path.parent, *file_path.parents):\n   34 |         if parent.parent.name in {\"components\", \"custom_components\"}:\n   35 |             return parent\n   36 |         # For custom_components at the repo root the parent IS custom_components\n   37 |         if parent.name != \"custom_components\" and parent.parent.name == \"\":\n   38 |             break\n   39 |     return None","lines":8,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/pylint/plugins/pylint_home_assistant/helpers/integration.py#L32-L39"}]},
{"id":"LOGIC_56","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `_recursive_merge`, the variable `duplicate_key` is overwritten on each recursive call when the current value is a dict. If an earlier key has a duplicate (and the recursive call returns a non-None key) but a later dict key is clean (and the recursive call returns None), `duplicate_key` is reset to None, silencing the earlier duplicate. Only the last detected duplicate key is reported to the caller.","fix":"Use early return or accumulate the first non-None duplicate: `if found := _recursive_merge(...): return found` (or similar) so the first detected duplicate is preserved and returned.","locations":[{"ref":"homeassistant/config.py:641-660","code":"  641 | def _recursive_merge(conf: dict[str, Any], package: dict[str, Any]) -> str | None:\n  642 |     \"\"\"Merge package into conf, recursively.\"\"\"\n  643 |     duplicate_key: str | None = None\n  644 |     for key, pack_conf in package.items():\n  645 |         if isinstance(pack_conf, dict):\n  646 |             if not pack_conf:\n  647 |                 continue\n  648 |             conf[key] = conf.get(key, OrderedDict())\n  649 |             duplicate_key = _recursive_merge(conf=conf[key], package=pack_conf)\n  650 | \n  651 |         elif isinstance(pack_conf, list):\n  652 |             conf[key] = cv.remove_falsy(\n  653 |                 cv.ensure_list(conf.get(key)) + cv.ensure_list(pack_conf)\n  654 |             )\n  655 | \n  656 |         else:\n  657 |             if conf.get(key) is not None:\n  658 |                 return key\n  659 |             conf[key] = pack_conf\n  660 |     return duplicate_key","lines":20,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/config.py#L641-L660"}]},
{"id":"LOGIC_57","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`EventBus._async_dispatch` creates a single shared `Event` object and dispatches it to all\nlisteners (line 1669). Both `listeners` and `match_all_listeners` iterate the same event\nobject. If any listener mutates `event.data` (which is a `_DataT` dict, not always a\n`ReadOnlyDict` at construction time here) the mutation is visible to subsequent listeners in\nthe same dispatch cycle, causing ordering-dependent bugs.","fix":"The `Event` data is passed as-is from the caller; ensure that by the time the event object is constructed the data is wrapped in a ReadOnlyDict, or document explicitly that listeners must not mutate event.data.","locations":[{"ref":"homeassistant/core.py:1658-1680","code":" 1658 |         event: Event[_DataT] | None = None\n 1659 |         for job, event_filter in listeners + match_all_listeners:\n 1660 |             if event_filter is not None:\n 1661 |                 try:\n 1662 |                     if event_data is None or not event_filter(event_data):\n 1663 |                         continue\n 1664 |                 except Exception:\n 1665 |                     _LOGGER.exception(\"Error in event filter\")\n 1666 |                     continue\n 1667 | \n 1668 |             if not event:\n 1669 |                 event = Event(\n 1670 |                     event_type,\n 1671 |                     event_data,\n 1672 |                     origin,\n 1673 |                     time_fired,\n 1674 |                     context,\n 1675 |                 )\n 1676 | \n 1677 |             try:\n 1678 |                 self._hass.async_run_hass_job(job, event)\n 1679 |             except Exception:\n 1680 |                 _LOGGER.exception(\"Error running job: %s\", job)","lines":23,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/core.py#L1658-L1680"}]},
{"id":"LOGIC_58","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `State.from_dict`, when reconstructing a `Context` from the stored dict only `id` and\n`user_id` are restored; `parent_id` is silently dropped (line 2114). This means any restored\nstate will have `context.parent_id = None` even if the original had a parent, which\nbreaks context chain tracing after a round-trip through `from_dict` / `as_dict`.","fix":"Pass `parent_id=context.get('parent_id')` to the `Context` constructor.","locations":[{"ref":"homeassistant/core.py:2113-2114","code":" 2113 |         if context := json_dict.get(\"context\"):\n 2114 |             context = Context(id=context.get(\"id\"), user_id=context.get(\"user_id\"))","lines":2,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/core.py#L2113-L2114"}]},
{"id":"LOGIC_59","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`_validate_currency` catches `vol.InInvalid` but the voluptuous function raises `vol.Invalid`\n(the base class). `vol.InInvalid` is a specific subclass used for `vol.In` validator failures;\ncatching it here means that other kinds of `vol.Invalid` from `cv.currency` are propagated\nuncaught instead of falling through to `cv.historic_currency`. This is likely a typo of\n`vol.Invalid`.","fix":"Replace `vol.InInvalid` with `vol.Invalid` in both `except` clauses.","locations":[{"ref":"homeassistant/core_config.py:244-249","code":"  244 |     try:\n  245 |         return cv.currency(data)\n  246 |     except vol.InInvalid:\n  247 |         with suppress(vol.InInvalid):\n  248 |             return cv.historic_currency(data)\n  249 |         raise","lines":6,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/core_config.py#L244-L249"}]},
{"id":"LOGIC_60","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `AreaRegistry._async_update`, the `verify_event_loop_thread` check on line 427 is placed\nafter the actual mutation (`self.areas[area_id] = dataclasses.replace(...)` on line 428).\nThe check is therefore useless as a guard - the mutation has already happened on a wrong thread\nbefore the warning is issued.","fix":"Move `self.hass.verify_event_loop_thread(...)` to the top of `_async_update`, before any mutations.","locations":[{"ref":"homeassistant/helpers/area_registry.py:425-426","code":"  425 |         self.hass.verify_event_loop_thread(\"area_registry.async_update\")\n  426 |         new = self.areas[area_id] = dataclasses.replace(old, **new_values)","lines":2,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/area_registry.py#L425-L426"}]},
{"id":"LOGIC_61","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`CategoryRegistry.async_update` calls `verify_event_loop_thread` on line 193 after the mutation\n`self.categories[scope][category_id] = dataclasses.replace(old, **changes)` on line 194. Same\nordering bug as in `AreaRegistry._async_update`: the guard fires after the write.","fix":"Move `verify_event_loop_thread` to the start of `async_update`, before any dict mutation.","locations":[{"ref":"homeassistant/helpers/category_registry.py:193-194","code":"  193 |         self.hass.verify_event_loop_thread(\"category_registry.async_update\")\n  194 |         new = self.categories[scope][category_id] = dataclasses.replace(old, **changes)","lines":2,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/category_registry.py#L193-L194"}]},
{"id":"LOGIC_62","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`async_get_chat_session` skips saving and scheduling cleanup when an existing nested session is\nreused (the early-return path at lines 118-123). However, `session.async_updated()` is also not\ncalled in that path, so the session's `last_updated` is not refreshed. This means a reused\nnested session can time out prematurely if the outer timeout fires before the caller had a chance\nto update it.","fix":"Call `session.async_updated()` before yielding in the nested-session reuse path.","locations":[{"ref":"homeassistant/helpers/chat_session.py:118-123","code":"  118 |     if session := current_session.get():\n  119 |         # If a session is already active and it's the requested conversation ID,\n  120 |         # return that. We won't update the last updated time in this case.\n  121 |         if session.conversation_id == conversation_id:\n  122 |             yield session\n  123 |             return","lines":6,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/chat_session.py#L118-L123"}]},
{"id":"LOGIC_63","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `StorageCollection.async_load`, the `CHANGE_ADDED` notifications pass `item` (the raw dict from storage) as the `item` field of `CollectionChange`, but the `self.data` dict is populated with `self._deserialize_item(item)` (line 270). So the `item_hash` argument on line 275 is computed from the raw dict (`item`) via `self._hash_item(item)`, which is consistent, but the `item` field in the change notification is also the raw dict, not the deserialized object. Change listeners that inspect `change.item` will see the raw dict rather than the deserialized form, inconsistent with `CHANGE_ADDED` notifications from `async_create_item` which pass the deserialized item.","fix":"Pass the deserialized item to `CollectionChange`: `CollectionChange(CHANGE_ADDED, item[CONF_ID], self.data[item[CONF_ID]], self._hash_item(item))`.","locations":[{"ref":"homeassistant/helpers/collection.py:264-279","code":"  264 |     async def async_load(self) -> None:\n  265 |         \"\"\"Load the storage Manager.\"\"\"\n  266 |         if not (raw_storage := await self._async_load_data()):\n  267 |             return\n  268 | \n  269 |         for item in raw_storage[\"items\"]:\n  270 |             self.data[item[CONF_ID]] = self._deserialize_item(item)\n  271 | \n  272 |         await self.notify_changes(\n  273 |             [\n  274 |                 CollectionChange(\n  275 |                     CHANGE_ADDED, item[CONF_ID], item, self._hash_item(item)\n  276 |                 )\n  277 |                 for item in raw_storage[\"items\"]\n  278 |             ]\n  279 |         )","lines":16,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/collection.py#L264-L279"}]},
{"id":"LOGIC_64","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `IDLessCollection`, `counter` is defined as a class variable (line 419). On first `self.counter += 1` the assignment creates an instance variable, shadowing the class variable from that point on. This means the class variable is never actually modified and will misleadingly read as `0` even after instances have been used. The intent is clearly to have per-instance counters; the class-level definition only serves as a misleading initialiser.","fix":"Move `counter` into `__init__`: add `def __init__(self, *args, **kwargs): super().__init__(*args, **kwargs); self.counter = 0` so the intent is clear and linters correctly recognise it as an instance variable.","locations":[{"ref":"homeassistant/helpers/collection.py:416-444","code":"  416 | class IDLessCollection(YamlCollection):\n  417 |     \"\"\"A collection without IDs.\"\"\"\n  418 | \n  419 |     counter = 0\n  420 | \n  421 |     @override\n  422 |     async def async_load(self, data: list[dict]) -> None:\n  423 |         \"\"\"Load the collection. Overrides existing data.\"\"\"\n  424 |         await self.notify_changes(\n  425 |             [\n  426 |                 CollectionChange(CHANGE_REMOVED, item_id, item)\n  427 |                 for item_id, item in list(self.data.items())\n  428 |             ]\n  429 |         )\n  430 | \n  431 |         self.data.clear()\n  432 | \n  433 |         for item in data:\n  434 |             self.counter += 1\n  435 |             item_id = f\"fakeid-{self.counter}\"\n  436 | \n  437 |             self.data[item_id] = item\n  438 | \n  439 |         await self.notify_changes(\n  440 |             [\n  441 |                 CollectionChange(CHANGE_ADDED, item_id, item)\n  442 |                 for item_id, item in self.data.items()\n  443 |             ]\n  444 |         )","lines":29,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/collection.py#L416-L444"}]},
{"id":"LOGIC_65","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `_HistoryPrimingManager._async_flush`, the lobby `wait()` at line 503 is inside a single `async with self._flush_condition` block. When `wait()` returns the lock is re-acquired. The code then exits the `async with` block, releasing the lock again. Between exiting the lobby block and entering the `while True` block (lines 504-506), another coroutine could set `_flushing = True` and start a flush. The while loop will then see `_flushing = True` and call `wait()` again - this is correct and handled. However, an edge case occurs when a flush completes and starts again in the tiny window; the waiter may end up participating in the generation it was supposed to skip (because the commit_future already existed when it arrived). This is unlikely in practice but the lobby guarantee is not strictly upheld across the two `async with` blocks.","fix":"Merge the lobby block and while loop into a single `async with` context, using loop-level state to decide whether to flush or wait.","locations":[{"ref":"homeassistant/helpers/condition.py:503-523","code":"  503 |         async with self._flush_condition:\n  504 |             # Lobby: a flush already running began before we arrived, so it may\n  505 |             # not capture our entity's queued changes. Wait it out, don't rely on\n  506 |             # it.\n  507 |             if self._flushing:\n  508 |                 await self._flush_condition.wait()\n  509 | \n  510 |         while True:\n  511 |             async with self._flush_condition:\n  512 |                 if not self._flushing:\n  513 |                     # First past the lobby this generation: we run the flush.\n  514 |                     self._flushing = True\n  515 |                     break\n  516 |                 # A peer began a fresh flush after we cleared the lobby; wait for\n  517 |                 # it.\n  518 |                 await self._flush_condition.wait()\n  519 |                 if self._flush_ok:\n  520 |                     return\n  521 |                 # The flush we waited for was cancelled before completing (its owner\n  522 |                 # timed out): loop and start or wait for a fresh one rather than read\n  523 |                 # against a queue that was never flushed.","lines":21,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/condition.py#L503-L523"}]},
{"id":"LOGIC_66","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `async_from_config`, when a new-style platform condition is used (line 1335-1349), if `relative_condition_key` is not present in `condition_descriptors`, a bare `KeyError` is raised (line 1340) with no useful error message. This can happen if a condition platform's `async_get_conditions` doesn't include the key from the config.","fix":"Replace the bare subscript with `condition_descriptors.get(relative_condition_key)` and raise `HomeAssistantError` with a clear message if it's None.","locations":[{"ref":"homeassistant/helpers/condition.py:1357-1371","code":" 1357 |     if platform is not None:\n 1358 |         condition_descriptors = await platform.async_get_conditions(hass)\n 1359 |         relative_condition_key = get_relative_description_key(\n 1360 |             platform_domain, condition_key\n 1361 |         )\n 1362 |         condition_cls = condition_descriptors[relative_condition_key]\n 1363 |         condition = condition_cls(\n 1364 |             hass,\n 1365 |             ConditionConfig(\n 1366 |                 options=config.get(CONF_OPTIONS),\n 1367 |                 target=config.get(CONF_TARGET),\n 1368 |             ),\n 1369 |         )\n 1370 |         await condition.async_setup()\n 1371 |         return condition","lines":15,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/condition.py#L1357-L1371"}]},
{"id":"LOGIC_67","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `async_validate` in `config_validation.py`, `_validating_async` is a `ContextVar` but is set with `.set(True)` without restoring the previous value via a token. If `async_validate` is called while another `async_validate` is already in progress (e.g. nested validation), the inner call will set `_validating_async` to True and the `finally` block resets it to False, even though the outer call still needs it to be True. This breaks the invariant for the outer caller.","fix":"Use the token returned by `_validating_async.set(True)` and restore via `_validating_async.reset(token)` in the `finally` block instead of `.set(False)`.","locations":[{"ref":"homeassistant/helpers/config_validation.py:2141-2157","code":" 2141 | async def async_validate(\n 2142 |     hass: HomeAssistant, validator: Callable[[Any], Any], value: Any\n 2143 | ) -> Any:\n 2144 |     \"\"\"Async friendly schema validation.\n 2145 | \n 2146 |     If a validator decorated with @not_async_friendly is called, validation will be\n 2147 |     deferred to an executor. If not, validation will happen in the event loop.\n 2148 |     \"\"\"\n 2149 |     _validating_async.set(True)\n 2150 |     try:\n 2151 |         return validator(value)\n 2152 |     except MustValidateInExecutor:\n 2153 |         return await hass.async_add_executor_job(\n 2154 |             _validate_in_executor, hass, validator, value\n 2155 |         )\n 2156 |     finally:\n 2157 |         _validating_async.set(False)","lines":17,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/config_validation.py#L2141-L2157"}]},
{"id":"LOGIC_68","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `FlowDispatcher.async_create` (discovery_flow.py), deduplication of pending flows is done by comparing `existing_values.data == data`. The `data` field is typed `Any`, so equality comparison may raise exceptions for certain object types (e.g., numpy arrays, custom objects without `__eq__`). Additionally, for mutable container types such as dicts, this compares by value at the time of insertion, but the caller may mutate the `data` object later, creating inconsistencies between what was recorded and what is dispatched.","fix":"Document that `data` must be immutable and equality-comparable, or add a try/except around the comparison with a fallback of always appending (accepting potential duplicate flows) to prevent unexpected crashes.","locations":[{"ref":"homeassistant/helpers/discovery_flow.py:141-142","code":"  141 |         if not any(existing_values.data == data for existing_values in existing):\n  142 |             existing.append(values)","lines":2,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/discovery_flow.py#L141-L142"}]},
{"id":"LOGIC_69","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `Entity._async_process_registry_update_or_remove` (entity.py), when `data[\"action\"] == \"remove\"`, the method sets `self.registry_entry = None` at line 1601 before awaiting `async_remove()` at line 1602. If `async_remove` triggers callbacks that read `self.registry_entry` (e.g. via `async_will_remove_from_hass` implemented by an integration), they will see `None` instead of the last known registry entry. This breaks a reasonable assumption that `registry_entry` is valid until removal completes.","fix":"Set `self.registry_entry = None` after `await self.async_remove()` completes, or preserve it in a local variable for use during removal callbacks.","locations":[{"ref":"homeassistant/helpers/entity.py:1600-1603","code":" 1600 |         if data[\"action\"] == \"remove\":\n 1601 |             await self.async_removed_from_registry()\n 1602 |             self.registry_entry = None\n 1603 |             await self.async_remove()","lines":4,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/entity.py#L1600-L1603"}]},
{"id":"LOGIC_70","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `entity_platform.py`, `_async_add_and_update_entities` (line 688) checks `if not results: return` after the `asyncio.gather` call, but `results` is a `list[BaseException | None] | None`. When the timeout fires, `results` remains `None`, and the early return is taken - which is correct. However, if all entities return `None` (no exceptions), `results` would be `[]` (empty list), and the code would also return early without checking - which is fine since there are no exceptions to process. But if `results` is a non-empty list with all `None` entries (all succeeded), `not results` is `False`, so the loop runs unnecessarily iterating over `None` entries. This is correct behavior but the `if not results:` guard is misleading since it only catches the timeout/empty-list cases.","fix":"The comment and guard logic is slightly misleading but functionally correct. Rename the guard to make intent clearer: `if results is None: return` for the timeout path, and rely on the loop body to handle all-None results.","locations":[{"ref":"homeassistant/helpers/entity_platform.py:691-703","code":"  691 |         if not results:\n  692 |             return\n  693 | \n  694 |         for idx, result in enumerate(results):\n  695 |             if isinstance(result, Exception):\n  696 |                 entity = entities[idx]\n  697 |                 self.logger.exception(\n  698 |                     \"Error adding entity %s for domain %s with platform %s\",\n  699 |                     entity.entity_id,\n  700 |                     self.domain,\n  701 |                     self.platform_name,\n  702 |                     exc_info=result,\n  703 |                 )","lines":13,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/entity_platform.py#L691-L703"}]},
{"id":"LOGIC_71","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `_async_strip_prefix_from_entity_name` (entity_registry.py line 634), when the entity name exactly equals the device name prefix after stripping (i.e., nothing remains), the function returns an empty string `''`. Callers such as `async_get_entity_aliases` append `alias.strip()` and may produce an empty alias. Callers checking `if original_name_unprefixed is not None` will treat `''` as a valid unprefixed name and use it, potentially writing empty friendly names or empty entity IDs.","fix":"Return `None` instead of `''` when the stripped name is empty, or ensure every caller explicitly handles the empty-string case.","locations":[{"ref":"homeassistant/helpers/entity_registry.py:674-675","code":"  674 |     if not new_name:\n  675 |         return \"\"","lines":2,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/entity_registry.py#L674-L675"}]},
