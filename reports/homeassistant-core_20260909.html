{"id":"LOGIC_94","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"ExceptionTranslationsChecker.visit_module calls quality_scale_rule_is_done with the raw\nstring \"exception-translations\" rather than QualityScaleRule.EXCEPTION_TRANSLATIONS. Every\nother checker in the quality_scale subpackage uses the enum constant. This raw string will\nsilently diverge if the enum value is ever renamed or refactored.","fix":"Import and use the enum constant:\n\n    from pylint_home_assistant.const import QualityScaleRule\n\n    self._exception_translations_done = (\n        parsed is not None\n        and quality_scale_rule_is_done(node, QualityScaleRule.EXCEPTION_TRANSLATIONS)\n    )","locations":[{"ref":"pylint/plugins/pylint_home_assistant/checkers/exception_translations.py:155-156","code":"  155 |             and quality_scale_rule_is_done(node, \"exception-translations\")\n  156 |         )","lines":2,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/pylint/plugins/pylint_home_assistant/checkers/exception_translations.py#L155-L156"}]},
{"id":"LOGIC_95","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"ExceptionTranslationsChecker.visit_call only checks HomeAssistantError raises when the\ncall node's direct parent is nodes.Raise. This misses the assignment-then-raise pattern:\n\n    err = HomeAssistantError(translation_key=\"...\", translation_domain=\"...\")\n    raise err\n\nIn this form, the HomeAssistantError(...) call is parented to a nodes.Assign, not\nnodes.Raise, so the checker never inspects it. The translation key existence and\nplaceholder mismatch checks (E7406 and E7418) are therefore silently skipped for\nassignment-then-raise patterns.","fix":"As a simpler heuristic, also accept nodes.Assign as a parent when the assigned name is\nsubsequently raised in the same scope. Alternatively, run the key/domain consistency checks\n(E7408 is structural, not raise-dependent) for all HomeAssistantError constructions,\nregardless of whether they are immediately raised.","locations":[{"ref":"pylint/plugins/pylint_home_assistant/checkers/exception_translations.py:158-169","code":"  158 |     def visit_call(self, node: nodes.Call) -> None:\n  159 |         \"\"\"Check HomeAssistantError raises for translation usage.\"\"\"\n  160 |         if not self._in_integration or self._module_node is None:\n  161 |             return\n  162 | \n  163 |         # Must be inside a raise statement\n  164 |         if not isinstance(node.parent, nodes.Raise):\n  165 |             return\n  166 | \n  167 |         exc_name = _is_ha_exception(node)\n  168 |         if exc_name is None:\n  169 |             return","lines":12,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/pylint/plugins/pylint_home_assistant/checkers/exception_translations.py#L158-L169"}]},
{"id":"LOGIC_96","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`greek_micro_char.py`'s `_do_micro_check` only handles two shapes:\n1. A direct `Const` assignment to a name.\n2. A `Dict` assignment where values are `Call` nodes with keyword arguments.\n\nAll other assignment forms are silently skipped: lists/tuples of strings, `Call`\npositional arguments, f-strings, or complex nested structures. This produces false\nnegatives for micro-symbol violations in those forms.","fix":"Use `node.nodes_of_class(nodes.Const)` to recursively visit all Const nodes in the\nright-hand side of the assignment and check each string value for the U+00B5 character,\ninstead of handling only two specific structural patterns.","locations":[{"ref":"pylint/plugins/pylint_home_assistant/checkers/greek_micro_char.py:39-69","code":"   39 |     def _do_micro_check(\n   40 |         self, target: nodes.NodeNG, node: nodes.Assign | nodes.AnnAssign\n   41 |     ) -> None:\n   42 |         \"\"\"Check const assignment is not containing ANSI micro char.\"\"\"\n   43 | \n   44 |         def _check_const(node_const: nodes.Const | Any) -> bool:\n   45 |             if (\n   46 |                 isinstance(node_const, nodes.Const)\n   47 |                 and isinstance(node_const.value, str)\n   48 |                 and \"\\u00b5\" in node_const.value\n   49 |             ):\n   50 |                 self.add_message(\"home-assistant-enforce-greek-micro-char\", node=node)\n   51 |                 return True\n   52 |             return False\n   53 | \n   54 |         # Check constant assignments\n   55 |         if (\n   56 |             isinstance(target, nodes.AssignName)\n   57 |             and isinstance(node.value, nodes.Const)\n   58 |             and _check_const(node.value)\n   59 |         ):\n   60 |             return\n   61 | \n   62 |         # Check dict with EntityDescription calls\n   63 |         if isinstance(target, nodes.AssignName) and isinstance(node.value, nodes.Dict):\n   64 |             for _, subnode in node.value.items:\n   65 |                 if not isinstance(subnode, nodes.Call):\n   66 |                     continue\n   67 |                 for keyword in subnode.keywords:\n   68 |                     if _check_const(keyword.value):\n   69 |                         return","lines":31,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/pylint/plugins/pylint_home_assistant/checkers/greek_micro_char.py#L39-L69"}]},
{"id":"LOGIC_97","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"DiagnosticsChecker.visit_module uses `node.nodes_of_class(nodes.AsyncFunctionDef)` which\nrecursively descends into nested classes, inner functions, and all nested scopes. A function\nnamed async_get_config_entry_diagnostics defined inside a helper class or another function\nwould satisfy the check even though only a top-level module function is the real handler.\n\nThe same issue affects ReauthenticationFlowChecker.visit_module, which uses\n`node.nodes_of_class(nodes.AsyncFunctionDef)` to search for async_step_reauth. A nested\nmethod could satisfy the check.\n\nBy contrast, ConfigEntryUnloadingChecker.visit_module correctly iterates only `node.body`.","fix":"For DiagnosticsChecker, iterate only top-level items and class bodies:\n\n    for item in node.body:\n        if (isinstance(item, (nodes.AsyncFunctionDef, nodes.FunctionDef))\n                and item.name in _DIAGNOSTICS_FUNCTIONS):\n            return\n\nFor ReauthenticationFlowChecker, search only inside top-level class definitions (since\nasync_step_reauth must be a method on a ConfigFlow subclass):\n\n    for item in node.body:\n        if isinstance(item, nodes.ClassDef):\n            for method in item.body:\n                if (isinstance(method, nodes.AsyncFunctionDef)\n                        and method.name == 'async_step_reauth'):\n                    return","locations":[{"ref":"pylint/plugins/pylint_home_assistant/checkers/quality_scale/diagnostics.py:58-60","code":"   58 |         for child in node.nodes_of_class(nodes.AsyncFunctionDef):\n   59 |             if child.name in _DIAGNOSTICS_FUNCTIONS:\n   60 |                 return","lines":3,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/pylint/plugins/pylint_home_assistant/checkers/quality_scale/diagnostics.py#L58-L60"},{"ref":"pylint/plugins/pylint_home_assistant/checkers/quality_scale/reauthentication_flow.py:48-50","code":"   48 |         for child in node.nodes_of_class(nodes.AsyncFunctionDef):\n   49 |             if child.name == \"async_step_reauth\":\n   50 |                 return","lines":3,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/pylint/plugins/pylint_home_assistant/checkers/quality_scale/reauthentication_flow.py#L48-L50"}]},
{"id":"LOGIC_98","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`sorted_platforms.py` compares platform list ordering by calling `as_string()` on each\nelement and sorting lexicographically. This causes false positives (or false negatives)\nwhen the PLATFORMS list mixes different node types. For example, a list of\n`[Platform.SENSOR, Platform.SWITCH]` sorts as `[\"Platform.SENSOR\", \"Platform.SWITCH\"]`\n(correct), but mixing string literals and enum members like `[\"binary_sensor\",\nPlatform.SWITCH]` would sort as `['\"binary_sensor\"', \"Platform.SWITCH\"]` because `'\"'`\n(0x22) < `'P'` (0x50), producing a different order than if only the actual string\nvalues were compared.","fix":"When all elements are `Platform.X` attribute-access nodes, sort by the `.attrname`\ncomponent. For mixed lists or literal string nodes, extract the actual string value\nbefore sorting. This makes the check consistent regardless of how the platforms are\nexpressed.","locations":[{"ref":"pylint/plugins/pylint_home_assistant/checkers/sorted_platforms.py:40-43","code":"   40 |             platforms = [v.as_string() for v in node.value.elts]\n   41 |             sorted_platforms = sorted(platforms)\n   42 |             if platforms != sorted_platforms:\n   43 |                 self.add_message(\"home-assistant-enforce-sorted-platforms\", node=node)","lines":4,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/pylint/plugins/pylint_home_assistant/checkers/sorted_platforms.py#L40-L43"}]},
{"id":"LOGIC_99","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"get_named_annotation in validators.py searches only args.args (regular positional arguments)\nand args.kwonlyargs, but not args.posonlyargs (positional-only arguments defined with `/` in\nthe signature). If a well-known parameter such as `hass` were declared as positional-only,\nthe lookup would fail silently and the annotation check would be skipped.\n\nThis is inconsistent with get_all_annotations, which does include posonlyargs_annotations\nin its result list, meaning the annotation is collected but can never be looked up by name.","fix":"Add a search through args.posonlyargs before args.args in get_named_annotation:\n\n    for index, arg_node in enumerate(args.posonlyargs):\n        if key == arg_node.name:\n            return arg_node, args.posonlyargs_annotations[index]\n    for index, arg_node in enumerate(args.args):\n        ...","locations":[{"ref":"pylint/plugins/pylint_home_assistant/checkers/type_hints/validators.py:213-226","code":"  213 | def get_named_annotation(\n  214 |     node: nodes.FunctionDef, key: str\n  215 | ) -> tuple[nodes.NodeNG, nodes.NodeNG] | tuple[None, None]:\n  216 |     \"\"\"Return (arg_node, annotation) for the argument named *key*.\"\"\"\n  217 |     args = node.args\n  218 |     for index, arg_node in enumerate(args.args):\n  219 |         if key == arg_node.name:\n  220 |             return arg_node, args.annotations[index]\n  221 | \n  222 |     for index, arg_node in enumerate(args.kwonlyargs):\n  223 |         if key == arg_node.name:\n  224 |             return arg_node, args.kwonlyargs_annotations[index]\n  225 | \n  226 |     return None, None","lines":14,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/pylint/plugins/pylint_home_assistant/checkers/type_hints/validators.py#L213-L226"},{"ref":"pylint/plugins/pylint_home_assistant/checkers/type_hints/validators.py:200-210","code":"  200 | def get_all_annotations(node: nodes.FunctionDef) -> list[nodes.NodeNG | None]:\n  201 |     \"\"\"Return all annotations for a function's arguments.\"\"\"\n  202 |     args = node.args\n  203 |     annotations: list[nodes.NodeNG | None] = (\n  204 |         args.posonlyargs_annotations + args.annotations + args.kwonlyargs_annotations\n  205 |     )\n  206 |     if args.vararg is not None:\n  207 |         annotations.append(args.varargannotation)\n  208 |     if args.kwarg is not None:\n  209 |         annotations.append(args.kwargannotation)\n  210 |     return annotations","lines":11,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/pylint/plugins/pylint_home_assistant/checkers/type_hints/validators.py#L200-L210"}]},
{"id":"LOGIC_100","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`unused_test_fixture_args.py` collects \"used names\" by scanning all `nodes.Name` nodes\nin the function via `node.nodes_of_class(nodes.Name)`. This includes Name nodes inside\nannotations and default values of nested function definitions - places that don't\nconstitute actual \"use\" of the fixture argument in the function body. More importantly,\nit also includes Name references inside nested `def`/`lambda` that capture the variable\nby closure but don't run as part of the test body itself. This can suppress true\npositives where a fixture argument is referenced only in a closure (lambda/nested def)\nthat is never called in the test.","fix":"Restrict the Name scan to the direct body of the test function (not recursing into\nnested functions) using a custom visitor that stops at FunctionDef/AsyncFunctionDef\nboundaries. Alternatively, exclude Name nodes whose ancestor chain includes a nested\nFunctionDef other than the test function itself.","locations":[{"ref":"pylint/plugins/pylint_home_assistant/checkers/unused_test_fixture_args.py:59-64","code":"   59 |         # Collect all Name references in the function body\n   60 |         used_names: set[str] = set()\n   61 |         for child in node.nodes_of_class(nodes.Name):\n   62 |             used_names.add(child.name)\n   63 | \n   64 |         for arg_name in sorted(arg_names - used_names):","lines":6,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/pylint/plugins/pylint_home_assistant/checkers/unused_test_fixture_args.py#L59-L64"}]},
{"id":"LOGIC_101","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`datetime_now.py`'s `visit_module` handles `import homeassistant.util.dt` only when\nthe import has an alias (`if alias`). When the module is imported without an alias -\n`import homeassistant.util.dt` - neither `_utc_paths` nor `_datetime_class_paths` is\nupdated, so code using `homeassistant.util.dt.dt.datetime.now(UTC)` would escape all\nthree datetime-now checkers (false negative). While this pattern is pathological and\nunlikely in practice, it is an inconsistency with how `import datetime` (no alias\nrequired) is handled.","fix":"Remove the `if alias` guard and compute the local name as `alias or name`:\n`case \"homeassistant.util.dt\":` without condition, then set the local binding to\n`alias if alias else \"homeassistant.util.dt\"` and derive the dotted paths accordingly.","locations":[{"ref":"pylint/plugins/pylint_home_assistant/helpers/datetime_now.py:121-125","code":"  121 |                             case \"homeassistant.util.dt\" if alias:\n  122 |                                 self._utc_paths.add((alias, \"UTC\"))\n  123 |                                 self._datetime_class_paths.add(\n  124 |                                     (alias, \"dt\", \"datetime\")\n  125 |                                 )","lines":5,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/pylint/plugins/pylint_home_assistant/helpers/datetime_now.py#L121-L125"}]},
{"id":"LOGIC_102","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`module_info.py`'s `parse_module` accepts an `include_test: bool` parameter to also\nrecognize `tests.components.*` modules, but the `_MODULE_REGEX` compiled at module\nlevel (line 11-13) is always anchored to `homeassistant.components` only. The regex is\nused in `get_module_platform` (line 76), which never receives test module names in\npractice, but if `parse_module` with `include_test=True` were used to drive a\nplatform-aware check for test modules in the future, `get_module_platform` would\nsilently return `None` for all of them.","fix":"Either document that `get_module_platform` is only for integration modules (not test\nmodules), or extend the regex / the function to handle `tests.components.*` paths when\nthe caller needs platform information for test modules.","locations":[{"ref":"pylint/plugins/pylint_home_assistant/helpers/module_info.py:11-13","code":"   11 | _MODULE_REGEX: re.Pattern[str] = re.compile(\n   12 |     rf\"^{re.escape(_INTEGRATION_ROOT)}\\.\\w+(\\.\\w+)?$\"\n   13 | )","lines":3,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/pylint/plugins/pylint_home_assistant/helpers/module_info.py#L11-L13"},{"ref":"pylint/plugins/pylint_home_assistant/helpers/module_info.py:70-79","code":"   70 | def get_module_platform(module_name: str) -> str | None:\n   71 |     \"\"\"Return the platform for the module name.\n   72 | \n   73 |     Returns ``\"__init__\"`` for the integration's root module,\n   74 |     the platform name for a sub-module, or ``None`` if not matched.\n   75 |     \"\"\"\n   76 |     if not (module_match := _MODULE_REGEX.match(module_name)):\n   77 |         return None\n   78 |     platform = module_match.group(1)\n   79 |     return platform.lstrip(\".\") if platform else \"__init__\"","lines":10,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/pylint/plugins/pylint_home_assistant/helpers/module_info.py#L70-L79"}]},
{"id":"LOGIC_103","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`translations.py`'s `_load_translations_from_dir` tries `strings.json` first and\n`translations/en.json` second, returning immediately after the FIRST file that exists\n- even if that file fails to parse (in which case `result` is `None`). If\n`strings.json` exists but contains invalid JSON, `translations/en.json` is never\ntried, so a custom integration with a broken `strings.json` and a valid\n`translations/en.json` would silently return `None` for all translation lookups.","fix":"Only stop at the first candidate if the parse succeeds (result is not None). If\nparsing fails (result is None), continue to the next candidate instead of returning\nimmediately.","locations":[{"ref":"pylint/plugins/pylint_home_assistant/helpers/translations.py:30-41","code":"   30 |     for candidate in (\n   31 |         integration_dir / \"strings.json\",\n   32 |         integration_dir / \"translations\" / \"en.json\",\n   33 |     ):\n   34 |         if candidate.exists():\n   35 |             result: dict | None = None\n   36 |             with contextlib.suppress(orjson.JSONDecodeError, OSError):\n   37 |                 parsed = orjson.loads(candidate.read_bytes())\n   38 |                 if isinstance(parsed, dict):\n   39 |                     result = parsed\n   40 |             _translations_cache[cache_key] = result\n   41 |             return result","lines":12,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/pylint/plugins/pylint_home_assistant/helpers/translations.py#L30-L41"}]},
{"id":"LOGIC_104","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"medium","description":"In `util/dt.py`, the `_get_timestring` function returns `\"0 seconds\"` when `timediff == 0.0`, but when `timediff` is negative (which should not happen per the callers, but is not validated), the function simply returns an empty string (the initial `result_string`). While `get_age` and `get_time_remaining` validate their inputs before calling `_get_timestring`, the function itself is exposed and could be called with negative values, returning a confusing empty string instead of raising a ValueError.","fix":"Add a guard at the start of `_get_timestring` to handle negative values explicitly, either raising ValueError or returning a meaningful string.","locations":[{"ref":"homeassistant/util/dt.py:314-346","code":"  314 | def _get_timestring(timediff: float, precision: int = 1) -> str:\n  315 |     \"\"\"Return a string representation of a time diff.\"\"\"\n  316 | \n  317 |     def formatn(number: int, unit: str) -> str:\n  318 |         \"\"\"Add \"unit\" if it's plural.\"\"\"\n  319 |         if number == 1:\n  320 |             return f\"1 {unit} \"\n  321 |         return f\"{number:d} {unit}s \"\n  322 | \n  323 |     if timediff == 0.0:\n  324 |         return \"0 seconds\"\n  325 | \n  326 |     units = (\"year\", \"month\", \"day\", \"hour\", \"minute\", \"second\")\n  327 | \n  328 |     factors = (365 * 24 * 60 * 60, 30 * 24 * 60 * 60, 24 * 60 * 60, 60 * 60, 60, 1)\n  329 | \n  330 |     result_string: str = \"\"\n  331 |     current_precision = 0\n  332 | \n  333 |     for i, current_factor in enumerate(factors):\n  334 |         selected_unit = units[i]\n  335 |         if timediff < current_factor:\n  336 |             continue\n  337 |         current_precision = current_precision + 1\n  338 |         if current_precision == precision:\n  339 |             return (\n  340 |                 result_string + formatn(round(timediff / current_factor), selected_unit)\n  341 |             ).rstrip()\n  342 |         curr_diff = int(timediff // current_factor)\n  343 |         result_string += formatn(curr_diff, selected_unit)\n  344 |         timediff -= (curr_diff) * current_factor\n  345 | \n  346 |     return result_string.rstrip()","lines":33,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/util/dt.py#L314-L346"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"The task name string in `_async_save_and_notify` repeats `entry.domain` twice instead of using `entry.entry_id` for the second occurrence. This makes the task name ambiguous and harder to debug in logs or profilers.","fix":"Replace the second `{entry.domain}` with `{entry.entry_id}`: `f\" {entry.title} {entry.domain} {entry.entry_id}\"`.","locations":[{"ref":"homeassistant/config_entries.py:2681-2686","code":" 2681 |         for listener in entry.update_listeners:\n 2682 |             self.hass.async_create_task(\n 2683 |                 listener(self.hass, entry),\n 2684 |                 \"config entry update listener\"\n 2685 |                 f\" {entry.title} {entry.domain} {entry.domain}\",\n 2686 |             )","lines":6,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/config_entries.py#L2681-L2686"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"very_easy","description":"In `_template_variables_with_value`, `json_loads(value)` is called with `value` typed as `str | None`. When `value` is `None`, `orjson.loads(None)` raises `TypeError`, which is NOT in `JSON_DECODE_EXCEPTIONS = (orjson.JSONDecodeError,)`. The `except JSON_DECODE_EXCEPTIONS: pass` clause does not catch `TypeError`, so the exception propagates uncaught to callers. Real-world callers that pass `None`: `snmp/sensor.py` (line 212, `self.data.value` is `None` on SNMP error without a default_value), and `command_line/sensor.py` (line 154, `self.data.value` can be `None`). The `# type: ignore[arg-type]` on the call site silences the static analysis warning but does not prevent the runtime crash.","fix":"Add `TypeError` (and optionally `ValueError`) to the except clause, or guard with `if value is not None:` before calling `json_loads`.","locations":[{"ref":"homeassistant/helpers/trigger_template_entity.py:367-370","code":"  367 |         try:  # noqa: SIM105 - suppress is much slower\n  368 |             run_variables[\"value_json\"] = json_loads(value)  # type: ignore[arg-type]\n  369 |         except JSON_DECODE_EXCEPTIONS:\n  370 |             pass","lines":4,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/trigger_template_entity.py#L367-L370"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"In `requirements.py`, `async_get_integration_with_requirements`, when a `BaseException` is caught on line 167, the code calls `await future` to clear the exception-retrieved flag. However, a future that has had `set_exception()` called on it will raise when awaited. The code uses `contextlib.suppress(BaseException)` to swallow any exception from that await. The intent is correct - to prevent 'Future exception was never retrieved' warnings - but the implementation relies on the fact that `await future` raises the same exception. If the future is somehow already done or in an unexpected state, the suppress might hide real bugs. More importantly, `future.set_exception()` is called from within a `BaseException` handler, which means `asyncio.CancelledError` is also handled here. If the coroutine is cancelled, the cancellation exception is set on the future, which is actually correct behavior, but the comment only mentions `BaseException` generically without acknowledging the CancelledError case.","fix":"Document that CancelledError is intentionally propagated through the future. Consider adding a specific check for CancelledError vs other exceptions to make the control flow explicit.","locations":[{"ref":"homeassistant/requirements.py:167-178","code":"  167 |         except BaseException as ex:\n  168 |             # We do not cache failures as we want to retry, or\n  169 |             # else people can't fix it and then restart, because\n  170 |             # their config will never be valid.\n  171 |             del cache[domain]\n  172 |             future.set_exception(ex)\n  173 |             with contextlib.suppress(BaseException):\n  174 |                 # Clear the flag as its normal that nothing\n  175 |                 # will wait for this future to be resolved\n  176 |                 # if there are no concurrent requirements fetches.\n  177 |                 await future\n  178 |             raise","lines":12,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/requirements.py#L167-L178"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`class_module.py` calls `node.ancestors()` at lines 135 and 141 without any\n`InferenceError` guard. `astroid.ClassDef.ancestors()` can raise\n`astroid.exceptions.InferenceError` when the base class cannot be resolved (e.g., a\nthird-party stub is missing). This will crash the entire checker with an unhandled\nexception, aborting all subsequent checks for the affected module.\n\nThe same issue exists in `inheritance.py` at line 38.","fix":"Wrap calls to `node.ancestors()` in a try/except for\n`astroid.exceptions.InferenceError` and return/skip early, or use the existing\n`safe_ancestors` helper from `helpers/ast_utils.py`.","locations":[{"ref":"pylint/plugins/pylint_home_assistant/checkers/class_module.py:135-165","code":"  135 |         ancestors = list(node.ancestors())\n  136 | \n  137 |         if (\n  138 |             current_module != Module.ENTITY\n  139 |             and current_integration not in _ENTITY_COMPONENTS\n  140 |         ):\n  141 |             top_level_ancestors = list(node.ancestors(recurs=False))\n  142 | \n  143 |             for ancestor in top_level_ancestors:\n  144 |                 if ancestor.name in _BASE_ENTITY_MODULES and not any(\n  145 |                     parent.name in _MODULE_CLASSES for parent in ancestors\n  146 |                 ):\n  147 |                     self.add_message(\n  148 |                         \"home-assistant-enforce-class-module\",\n  149 |                         node=node,\n  150 |                         args=(ancestor.name, Module.ENTITY),\n  151 |                     )\n  152 |                     return\n  153 | \n  154 |         for expected_module, classes in _MODULES.items():\n  155 |             if expected_module in (current_module, current_integration):\n  156 |                 continue\n  157 | \n  158 |             for ancestor in ancestors:\n  159 |                 if ancestor.name in classes:\n  160 |                     self.add_message(\n  161 |                         \"home-assistant-enforce-class-module\",\n  162 |                         node=node,\n  163 |                         args=(ancestor.name, expected_module),\n  164 |                     )\n  165 |                     return","lines":31,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/pylint/plugins/pylint_home_assistant/checkers/class_module.py#L135-L165"},{"ref":"pylint/plugins/pylint_home_assistant/checkers/inheritance.py:38-58","code":"   38 |         ancestors = [a.name for a in node.ancestors()]\n   39 |         if (\n   40 |             \"RestoreEntity\" in ancestors\n   41 |             and \"SensorEntity\" in ancestors\n   42 |             and \"RestoreSensor\" not in ancestors\n   43 |         ):\n   44 |             self.add_message(\n   45 |                 \"home-assistant-invalid-inheritance\",\n   46 |                 node=node,\n   47 |                 args=\"SensorEntity and RestoreEntity should not be combined, please use RestoreSensor\",\n   48 |             )\n   49 |         elif (\n   50 |             \"RestoreEntity\" in ancestors\n   51 |             and \"NumberEntity\" in ancestors\n   52 |             and \"RestoreNumber\" not in ancestors\n   53 |         ):\n   54 |             self.add_message(\n   55 |                 \"home-assistant-invalid-inheritance\",\n   56 |                 node=node,\n   57 |                 args=\"NumberEntity and RestoreEntity should not be combined, please use RestoreNumber\",\n   58 |             )","lines":21,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/pylint/plugins/pylint_home_assistant/checkers/inheritance.py#L38-L58"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`super_call.py` calls `parent.ancestors()` at line 54 without any `InferenceError`\nguard. If the parent class has unresolvable bases, this raises an unhandled\n`astroid.exceptions.InferenceError`, crashing the checker for that module.","fix":"Wrap the `parent.ancestors()` call in try/except for\n`astroid.exceptions.InferenceError` and treat it as \"no base implementation found\"\n(i.e., skip the message).","locations":[{"ref":"pylint/plugins/pylint_home_assistant/checkers/super_call.py:55-72","code":"   55 |         for base in parent.ancestors():\n   56 |             for method in base.mymethods():\n   57 |                 if method.name != node.name:\n   58 |                     continue\n   59 |                 if method.body and not (\n   60 |                     len(method.body) == 1 and isinstance(method.body[0], nodes.Pass)\n   61 |                 ):\n   62 |                     found_base_implementation = True\n   63 |                 break\n   64 | \n   65 |             if found_base_implementation:\n   66 |                 self.add_message(\n   67 |                     \"home-assistant-missing-super-call\",\n   68 |                     node=node,\n   69 |                     args=(node.name,),\n   70 |                     confidence=INFERENCE,\n   71 |                 )\n   72 |                 break","lines":18,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/pylint/plugins/pylint_home_assistant/checkers/super_call.py#L55-L72"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In `runner.py`, the `_report_existing_instance` function on line 92 accesses `existing_info[\"start_ts\"]` via direct key access, which will raise `KeyError` if the lock file was written by an older HA version that used a different format. The outer exception handler on line 107 only catches `json.JSONDecodeError` and `OSError`, not `KeyError`. Similarly, `existing_info[\"pid\"]` and `existing_info[\"ha_version\"]` on lines 102-103 can raise `KeyError`. If the lock file has valid JSON but missing keys, an unhandled `KeyError` will propagate.","fix":"Add `KeyError` to the except clause on line 107: `except (json.JSONDecodeError, OSError, KeyError) as ex:`. Alternatively use `.get()` with defaults for each key access.","locations":[{"ref":"homeassistant/runner.py:88-108","code":"   88 |     try:\n   89 |         with open(lock_file_path, encoding=\"utf-8\") as f:\n   90 |             if content := f.read().strip():\n   91 |                 existing_info = json.loads(content)\n   92 |                 start_dt = datetime.fromtimestamp(existing_info[\"start_ts\"])\n   93 |                 # Format with timezone abbreviation if available,\n   94 |                 # otherwise add local time indicator\n   95 |                 if tz_abbr := start_dt.strftime(\"%Z\"):\n   96 |                     start_time = start_dt.strftime(f\"%Y-%m-%d %H:%M:%S {tz_abbr}\")\n   97 |                 else:\n   98 |                     start_time = (\n   99 |                         start_dt.strftime(\"%Y-%m-%d %H:%M:%S\") + \" (local time)\"\n  100 |                     )\n  101 | \n  102 |                 error_msg.append(f\"  PID: {existing_info['pid']}\")\n  103 |                 error_msg.append(f\"  Version: {existing_info['ha_version']}\")\n  104 |                 error_msg.append(f\"  Started: {start_time}\")\n  105 |             else:\n  106 |                 error_msg.append(\"  Unable to read lock file details.\")\n  107 |     except (json.JSONDecodeError, OSError) as ex:\n  108 |         error_msg.append(f\"  Unable to read lock file details: {ex}\")","lines":21,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/runner.py#L88-L108"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"Script._async_get_condition uses a lossy cache key (line 1994): `frozenset((k, str(v)) for k, v in config.items())`. Using str() to convert values means different types that stringify identically (e.g. integer 1 and string '1') map to the same cache key, causing incorrect cache hits and reuse of the wrong ConditionChecker. Also, configs with equal keys but semantically different structures (nested dicts/lists) can collide.","fix":"Use a representation that preserves type information, such as `frozenset((k, repr(v)) for k, v in config.items())`, or derive a proper hashable key by serialising to canonical JSON.","locations":[{"ref":"homeassistant/helpers/script.py:2087-2092","code":" 2087 |     async def _async_get_condition(self, config: ConfigType) -> ConditionChecker:\n 2088 |         config_cache_key = frozenset((k, str(v)) for k, v in config.items())\n 2089 |         if not (cond := self._condition_cache.get(config_cache_key)):\n 2090 |             cond = await condition.async_from_config(self._hass, config)\n 2091 |             self._condition_cache[config_cache_key] = cond\n 2092 |         return cond","lines":6,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/script.py#L2087-L2092"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"In `util/location.py`, the `distance` function is decorated with `@lru_cache` (unbounded). The function caches distances between coordinate pairs. With floating-point coordinates, the cache will almost never produce a hit because floating-point coordinates are rarely identical. This means the cache accumulates entries indefinitely (memory leak) while providing essentially no performance benefit. The function is also marked \"Async friendly\" suggesting it is called frequently from async contexts where memory should be conserved.","fix":"Remove the `@lru_cache` decorator from `distance` since floating-point coordinate arguments will almost never match exactly. If caching is desired for truly identical calls (same zone calculation repeated), use `functools.lru_cache(maxsize=128)` with an explicit size bound.","locations":[{"ref":"homeassistant/util/location.py:59-72","code":"   59 | @lru_cache\n   60 | def distance(\n   61 |     lat1: float | None, lon1: float | None, lat2: float, lon2: float\n   62 | ) -> float | None:\n   63 |     \"\"\"Calculate the distance in meters between two points.\n   64 | \n   65 |     Async friendly.\n   66 |     \"\"\"\n   67 |     if lat1 is None or lon1 is None:\n   68 |         return None\n   69 |     result = vincenty((lat1, lon1), (lat2, lon2))\n   70 |     if result is None:\n   71 |         return None\n   72 |     return result * 1000","lines":14,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/util/location.py#L59-L72"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`HomeAssistantTCPConnector.async_resolve_host` calls the private `_resolve_host` method with a\nhard-coded port of `0`. Passing `0` disables port-based service lookups in some resolvers and\nmay cause incorrect resolution for services that depend on port information. More importantly,\naccessing a private method of `aiohttp.TCPConnector` is fragile and will break with aiohttp\ninternal API changes.","fix":"Consider using a public resolution API or wrapping resolution in an executor call with `socket.getaddrinfo`. At a minimum, document the dependency on the private method.","locations":[{"ref":"homeassistant/helpers/aiohttp_client.py:446-448","code":"  446 |     async def async_resolve_host(self, host: str) -> list[aiohttp.abc.ResolveResult]:\n  447 |         \"\"\"Resolve a host to a list of addresses.\"\"\"\n  448 |         return await self._resolve_host(host, 0)","lines":3,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/aiohttp_client.py#L446-L448"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"In `ObservableCollection.notify_changes`, all individual `ChangeListener` callbacks and all `ChangeSetListener` callbacks are gathered with a single `asyncio.gather`. If any `ChangeListener` callback raises, the exception is propagated immediately and the remaining callbacks are not awaited (they are cancelled). A failure in one listener silently prevents others from being notified. The same applies to `ChangeSetListener`. This is inconsistent with the `return_exceptions` pattern used elsewhere in the codebase.","fix":"Use `asyncio.gather(..., return_exceptions=True)` and log/handle any exceptions, rather than letting the first exception abort all other notifications.","locations":[{"ref":"homeassistant/helpers/collection.py:164-176","code":"  164 |     async def notify_changes(self, change_set: Iterable[CollectionChange]) -> None:\n  165 |         \"\"\"Notify listeners of a change.\"\"\"\n  166 |         await asyncio.gather(\n  167 |             *(\n  168 |                 listener(change.change_type, change.item_id, change.item)\n  169 |                 for listener in self.listeners\n  170 |                 for change in change_set\n  171 |             ),\n  172 |             *(\n  173 |                 change_set_listener(change_set)\n  174 |                 for change_set_listener in self.change_set_listeners\n  175 |             ),\n  176 |         )","lines":13,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/collection.py#L164-L176"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In `expand_entity_ids` (group.py lines 161-204), the duplicate-check `if ent_id not in found_ids` performs an O(n) linear scan on a list for every candidate. For groups with many members this is O(n^2). The function is also called recursively for nested groups which compounds the cost.","fix":"Use a `set` for the deduplication check internally and convert to a list only at the return. Pass the set through recursive calls.","locations":[{"ref":"homeassistant/helpers/group.py:161-203","code":"  161 | def expand_entity_ids(hass: HomeAssistant, entity_ids: Iterable[Any]) -> list[str]:\n  162 |     \"\"\"Return entity_ids with group entity ids replaced by their members.\n  163 | \n  164 |     Async friendly.\n  165 |     \"\"\"\n  166 |     group_entities = get_group_entities(hass)\n  167 | \n  168 |     found_ids: list[str] = []\n  169 |     for entity_id in entity_ids:\n  170 |         if not isinstance(entity_id, str) or entity_id in (\n  171 |             ENTITY_MATCH_NONE,\n  172 |             ENTITY_MATCH_ALL,\n  173 |         ):\n  174 |             continue\n  175 | \n  176 |         entity_id = entity_id.lower()\n  177 | \n  178 |         # If entity_id points at a group, expand it\n  179 |         if (entity := group_entities.get(entity_id)) is not None and isinstance(\n  180 |             entity.group, GenericGroup\n  181 |         ):\n  182 |             child_entities = entity.group.member_entity_ids\n  183 |             if entity_id in child_entities:\n  184 |                 child_entities = list(child_entities)\n  185 |                 child_entities.remove(entity_id)\n  186 |             found_ids.extend(\n  187 |                 ent_id\n  188 |                 for ent_id in expand_entity_ids(hass, child_entities)\n  189 |                 if ent_id not in found_ids\n  190 |             )\n  191 |         # If entity_id points at an old-style group, expand it\n  192 |         elif entity_id.startswith(ENTITY_PREFIX):\n  193 |             child_entities = get_entity_ids(hass, entity_id)\n  194 |             if entity_id in child_entities:\n  195 |                 child_entities = list(child_entities)\n  196 |                 child_entities.remove(entity_id)\n  197 |             found_ids.extend(\n  198 |                 ent_id\n  199 |                 for ent_id in expand_entity_ids(hass, child_entities)\n  200 |                 if ent_id not in found_ids\n  201 |             )\n  202 |         elif entity_id not in found_ids:\n  203 |             found_ids.append(entity_id)","lines":43,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/group.py#L161-L203"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In `util/logging.py`, the `HomeAssistantQueueListener.handle` method on line 61 calls `self._module_log_count_skip_flags.get(module_name)`. When `skip_flag` is `False` (not None), it falls through to increment the count. But Python's truthiness means `False` and `None` are both falsy, so `if skip_flag := ...` treats both `False` and `None` the same way. The subsequent check `if skip_flag is None and self._update_skip_flags(module_name):` on line 64 correctly distinguishes None from False, but the walrus assignment on line 61 returns `False` for a cached \"not excluded\" flag, which is falsy, causing the code to fall through to the `is None` check unnecessarily. This means every non-excluded module that logs will call `get()` twice effectively: once via the walrus (returning False, which is falsy), and then the `is None` check fails (correctly) and the count is incremented. This is a minor inefficiency in the hot path.","fix":"Check `if module_name in self._module_log_count_skip_flags:` first and then look up the value, to avoid the double evaluation path. Or restructure to use explicit None comparison: `skip_flag = self._module_log_count_skip_flags.get(module_name); if skip_flag: return; if skip_flag is None: ...`.","locations":[{"ref":"homeassistant/util/logging.py:61-67","code":"   61 |         if skip_flag := self._module_log_count_skip_flags.get(module_name):\n   62 |             return\n   63 | \n   64 |         if skip_flag is None and self._update_skip_flags(module_name):\n   65 |             return\n   66 | \n   67 |         self._log_counts[module_name] += 1","lines":7,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/util/logging.py#L61-L67"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"_ignore_function_match is called twice for every method checked via _visit_class_functions:\nonce as an early-exit guard (line 152) and again inside _check_function (line 204), which\nalso calls _ignore_function_match at the top. The check reads config options and evaluates\nseveral conditions, but the double call is purely redundant - the result cannot change\nbetween the two calls for the same node/match pair.","fix":"Remove the early _ignore_function_match call in _visit_class_functions and rely solely on\nthe check inside _check_function:\n\n    # In _visit_class_functions, replace:\n    annotations = get_all_annotations(function_node)\n    if self._ignore_function_match(function_node, annotations, match):\n        continue\n    self._check_function(function_node, match, annotations)\n    checked_class_methods.add(function_node.name)\n\n    # With:\n    self._check_function(function_node, match, get_all_annotations(function_node))\n    checked_class_methods.add(function_node.name)","locations":[{"ref":"pylint/plugins/pylint_home_assistant/checkers/type_hints/__init__.py:152-155","code":"  152 |                 if self._ignore_function_match(function_node, annotations, match):\n  153 |                     continue\n  154 | \n  155 |                 self._check_function(function_node, match, annotations)","lines":4,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/pylint/plugins/pylint_home_assistant/checkers/type_hints/__init__.py#L152-L155"},{"ref":"pylint/plugins/pylint_home_assistant/checkers/type_hints/__init__.py:198-204","code":"  198 |     def _check_function(\n  199 |         self,\n  200 |         node: nodes.FunctionDef,\n  201 |         match: TypeHintMatch,\n  202 |         annotations: list[nodes.NodeNG | None],\n  203 |     ) -> None:\n  204 |         if self._ignore_function_match(node, annotations, match):","lines":7,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/pylint/plugins/pylint_home_assistant/checkers/type_hints/__init__.py#L198-L204"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"medium","difficulty":"medium","description":"`is_helper_integration` in `helpers/integration.py` accepts an `integration: str`\nparameter (first argument), but the parameter is never used anywhere in the function\nbody. The implementation relies entirely on `read_manifest(module)` and the manifest\ncontent. All callers pass `parsed.domain` as the first argument, which is computed\nbut then silently discarded, making the API misleading.","fix":"Remove the `integration: str` parameter from `is_helper_integration` and update all\ncall sites to pass only `module`. If the parameter is intended for future use, add a\ncomment explaining that intent.","locations":[{"ref":"pylint/plugins/pylint_home_assistant/helpers/integration.py:96-101","code":"   96 | def is_helper_integration(integration: str, module: nodes.Module) -> bool:\n   97 |     \"\"\"Return True if the integration has ``integration_type: helper``.\"\"\"\n   98 |     manifest = read_manifest(module)\n   99 |     if manifest is None:\n  100 |         return False\n  101 |     return manifest.get(\"integration_type\") == IntegrationType.HELPER","lines":6,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/pylint/plugins/pylint_home_assistant/helpers/integration.py#L96-L101"},{"ref":"pylint/plugins/pylint_home_assistant/checkers/config_flow/no_name.py:61","code":"   61 |         if is_helper_integration(parsed.domain, node.root()):","lines":1,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/pylint/plugins/pylint_home_assistant/checkers/config_flow/no_name.py#L61"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"In `min_max_from_filter` (math.py), the inner function `wrapper` is already decorated with `@pass_environment` (line 299), yet line 313 wraps it again with another `pass_environment` call. The outer `pass_environment` is never used as intended because `min_max_min` and `min_max_max` invoke the returned value directly with `(self.environment, *args, **kwargs)`, bypassing the outer decorator's injection logic entirely. The double-wrapping is dead code.","fix":"Remove the redundant `return pass_environment(wrapper)` on line 313 and replace it with `return wrapper`.","locations":[{"ref":"homeassistant/helpers/template/extensions/math.py:293-313","code":"  293 |     def min_max_from_filter(self, builtin_filter: Any, name: str) -> Any:\n  294 |         \"\"\"Convert a built-in min/max Jinja filter to a global function.\n  295 | \n  296 |         The parameters may be passed as an iterable or as separate arguments.\n  297 |         \"\"\"\n  298 | \n  299 |         @pass_environment\n  300 |         @wraps(builtin_filter)\n  301 |         def wrapper(environment: jinja2.Environment, *args: Any, **kwargs: Any) -> Any:\n  302 |             if len(args) == 0:\n  303 |                 raise TypeError(f\"{name} expected at least 1 argument, got 0\")\n  304 | \n  305 |             if len(args) == 1:\n  306 |                 if isinstance(args[0], Iterable):\n  307 |                     return builtin_filter(environment, args[0], **kwargs)\n  308 | \n  309 |                 raise TypeError(f\"'{type(args[0]).__name__}' object is not iterable\")\n  310 | \n  311 |             return builtin_filter(environment, args, **kwargs)\n  312 | \n  313 |         return pass_environment(wrapper)","lines":21,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/template/extensions/math.py#L293-L313"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"In `util/process.py`, the `kill_subprocess` function calls both `process.communicate()` and `process.wait()` on lines 11-12. After `process.communicate()` returns, the process is already finished and `process.wait()` will return immediately with the already-stored return code. The `process.wait()` call is redundant dead code.","fix":"Remove the `process.wait()` call on line 12, as `process.communicate()` already waits for the process to finish and collects its return code.","locations":[{"ref":"homeassistant/util/process.py:7-13","code":"    7 | def kill_subprocess(process: subprocess.Popen[Any]) -> None:\n    8 |     \"\"\"Force kill a subprocess and wait for it to exit.\"\"\"\n    9 |     process.kill()\n   10 |     process.communicate()\n   11 |     process.wait()\n   12 | \n   13 |     del process","lines":7,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/util/process.py#L7-L13"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"merge_policies() calls `cast(PolicyType, new_policy)` at line 20 but discards the\nreturn value. `cast()` is a type-checking no-op at runtime; it returns its second\nargument unchanged. The cast has no effect and the subsequent `return new_policy`\nreturns the uncast variable anyway.","fix":"Remove the dead `cast(PolicyType, new_policy)` line, or change `return new_policy` to `return cast(PolicyType, new_policy)`.","locations":[{"ref":"homeassistant/auth/permissions/merge.py:20-21","code":"   20 |     cast(PolicyType, new_policy)\n   21 |     return new_policy","lines":2,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/auth/permissions/merge.py#L20-L21"}]},
{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"The deprecated connection class constants (`CONN_CLASS_CLOUD_PUSH`, `CONN_CLASS_CLOUD_POLL`, `CONN_CLASS_LOCAL_PUSH`, `CONN_CLASS_LOCAL_POLL`, `CONN_CLASS_ASSUMED`, `CONN_CLASS_UNKNOWN`) and `DISABLED_USER` are documented as deprecated (since 2021.6.0 and 2022.3 respectively) and are no longer used anywhere in the HA core codebase. They only exist for custom integration backward compatibility with no removal date set.","fix":"Apply the same `DeprecatedConstant` pattern used in `const.py` to these values, so accesses are logged and a removal version is specified.","locations":[{"ref":"homeassistant/config_entries.py:242-255","code":"  242 | # DISABLED_* is deprecated, to be removed in 2022.3\n  243 | DISABLED_USER = ConfigEntryDisabler.USER.value\n  244 | \n  245 | RELOAD_AFTER_UPDATE_DELAY = 30\n  246 | \n  247 | # Deprecated: Connection classes\n  248 | # These aren't used anymore since 2021.6.0\n  249 | # Mainly here not to break custom integrations.\n  250 | CONN_CLASS_CLOUD_PUSH = \"cloud_push\"\n  251 | CONN_CLASS_CLOUD_POLL = \"cloud_poll\"\n  252 | CONN_CLASS_LOCAL_PUSH = \"local_push\"\n  253 | CONN_CLASS_LOCAL_POLL = \"local_poll\"\n  254 | CONN_CLASS_ASSUMED = \"assumed\"\n  255 | CONN_CLASS_UNKNOWN = \"unknown\"","lines":14,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/config_entries.py#L242-L255"}]},
{"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`_make_key` in `aiohttp_client.py` is a trivial function that simply returns its arguments as a\ntuple. It adds a function-call overhead on every session and connector lookup with no benefit\nover an inline tuple literal. The type annotation on the return value also differs from the\n`DATA_CONNECTOR` key annotation (`tuple[bool, int, str]` vs actual `tuple[bool, AddressFamily, SSLCipherList]`).","fix":"Inline the tuple construction at the call sites and correct the type annotation in `DATA_CONNECTOR` / `DATA_CLIENTSESSION`.","locations":[{"ref":"homeassistant/helpers/aiohttp_client.py:422-429","code":"  422 | @callback\n  423 | def _make_key(\n  424 |     verify_ssl: bool = True,\n  425 |     family: socket.AddressFamily = socket.AF_UNSPEC,\n  426 |     ssl_cipher: ssl_util.SSLCipherList = ssl_util.SSLCipherList.PYTHON_DEFAULT,\n  427 | ) -> tuple[bool, socket.AddressFamily, ssl_util.SSLCipherList]:\n  428 |     \"\"\"Make a key for connector or session pool.\"\"\"\n  429 |     return (verify_ssl, family, ssl_cipher)","lines":8,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/aiohttp_client.py#L422-L429"}]},

{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"auth_store.async_deactivate_user has docstring \"Activate a user.\" which is the opposite\nof what the method does (it sets is_active = False).","fix":"Change the docstring to \"Deactivate a user.\"","locations":[{"ref":"homeassistant/auth/auth_store.py:183-186","code":"  183 |     async def async_deactivate_user(self, user: models.User) -> None:\n  184 |         \"\"\"Activate a user.\"\"\"\n  185 |         user.is_active = False\n  186 |         self._async_schedule_save()","lines":4,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/auth/auth_store.py#L183-L186"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The comment in the storage migration block for minor version 5 says 'Version 1.4 adds config subentries', but the surrounding `if old_minor_version < 5:` guard and `STORAGE_VERSION_MINOR = 5` make it clear this is the version 1.5 migration. The copy-paste from the version 1.4 block left a stale comment.","fix":"Change the comment to `# Version 1.5 adds config subentries`.","locations":[{"ref":"homeassistant/config_entries.py:2130-2133","code":" 2130 |             if old_minor_version < 5:\n 2131 |                 # Version 1.4 adds config subentries\n 2132 |                 for entry in data[\"entries\"]:\n 2133 |                     entry.setdefault(\"subentries\", entry.get(\"subentries\", {}))","lines":4,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/config_entries.py#L2130-L2133"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"In `_print_deprecation_warning_internal` (deprecation.py), the comment says \"Suppress ImportError due to use of deprecated enum in core.py / Can be removed in HA Core 2025.1\". The current date is 2026-07-03, so this comment is over 18 months stale. If the `suppress(ImportError)` wrapper is still needed, the comment needs updating. If it is no longer needed, both the comment and the `suppress` wrapper should be removed.","fix":"Remove the `suppress(ImportError)` wrapper and the stale comment if the upstream issue in core.py is resolved, or update the comment to reflect the current status.","locations":[{"ref":"homeassistant/helpers/deprecation.py:219-221","code":"  219 |     # Suppress ImportError due to use of deprecated enum in core.py\n  220 |     # Can be removed in HA Core 2025.1\n  221 |     with suppress(ImportError):","lines":3,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/deprecation.py#L219-L221"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The docstring for `create_async_httpx_client` says 'If auto_cleanup is False, the client will be automatically closed on homeassistant_stop.' This is the inverse of the truth: the code at line 132 does `if auto_cleanup: _async_register_async_client_shutdown(...)`, so it is `auto_cleanup=True` (the default) that registers the shutdown. The incorrect docstring will mislead callers.","fix":"Change the docstring line to: 'If auto_cleanup is True (the default), the client will be automatically closed on homeassistant_stop.'","locations":[{"ref":"homeassistant/helpers/httpx_client.py:95-98","code":"   95 |     \"\"\"Create a new httpx.AsyncClient with kwargs, i.e. for cookies.\n   96 | \n   97 |     If auto_cleanup is False, the client will be\n   98 |     automatically closed on homeassistant_stop.","lines":4,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/httpx_client.py#L95-L98"}]},

{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The comment on line 92 of `significant_change.py` says 'Marked as singleton so multiple calls all wait for same output' but the function has no `@singleton` decorator and no Future-based guard. The comment is misleading - the function is NOT a singleton.","fix":"Remove or correct the comment to reflect that the function performs a simple membership check only.","locations":[{"ref":"homeassistant/helpers/significant_change.py:92","code":"   92 | # Marked as singleton so multiple calls all wait for same output.","lines":1,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/significant_change.py#L92"}]},
{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"`urlencode` in string.py (line 54-56) has a docstring that says \"return as UTF-8 string\" but the function encodes the result to `bytes` and the return type annotation is `bytes`. The docstring is misleading.","fix":"Change the docstring to \"Urlencode dictionary and return as UTF-8 bytes.\"","locations":[{"ref":"homeassistant/helpers/template/extensions/string.py:54-56","code":"   54 |     def urlencode(self, value: Any) -> bytes:\n   55 |         \"\"\"Urlencode dictionary and return as UTF-8 string.\"\"\"\n   56 |         return urllib_urlencode(value).encode(\"utf-8\")","lines":3,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/template/extensions/string.py#L54-L56"}]},
{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"The three static _find_referenced_target, _find_referenced_devices, and _find_referenced_entities methods (lines 1626-1787) share near-identical structure: iterate sequence, dispatch on action type, recurse into CHOOSE/IF/PARALLEL/SEQUENCE sub-steps. The CHOOSE/IF/PARALLEL/SEQUENCE recursion blocks are duplicated in all three methods (roughly 30+ lines each with the same shape). This makes adding a new action type error-prone - it must be added to all three methods.","fix":"Extract a common recursive visitor that accepts a per-action callback. Each of the three methods can then pass a small callback that handles only the action-specific extraction (call-service target/data, device_automation step, scene), while the structural recursion lives in one place.","locations":[{"ref":"homeassistant/helpers/script.py:1669-1688","code":" 1669 |     @staticmethod\n 1670 |     def _find_referenced_target(\n 1671 |         target: Literal[\"area_id\", \"floor_id\", \"label_id\"],\n 1672 |         referenced: set[str],\n 1673 |         sequence: Sequence[dict[str, Any]],\n 1674 |     ) -> None:\n 1675 |         \"\"\"Find referenced target in a sequence.\"\"\"\n 1676 |         for step in sequence:\n 1677 |             action = cv.determine_script_action(step)\n 1678 | \n 1679 |             if action == cv.SCRIPT_ACTION_CALL_SERVICE:\n 1680 |                 for data in (\n 1681 |                     step.get(CONF_TARGET),\n 1682 |                     step.get(CONF_SERVICE_DATA),\n 1683 |                     step.get(CONF_SERVICE_DATA_TEMPLATE),\n 1684 |                 ):\n 1685 |                     _referenced_extract_ids(data, target, referenced)\n 1686 | \n 1687 |             elif action == cv.SCRIPT_ACTION_CHECK_CONDITION:\n 1688 |                 referenced |= condition.async_extract_targets(step, target)","lines":20,"link":"https://github.com/home-assi {"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"medium","difficulty":"medium","description":"`AreaRegistry.async_update` calls `self.hass.bus.async_fire` (the non-internal variant) with a\ncomment saying it cannot determine whether the thread-safety check already happened. This is\narchitecturally inconsistent: all other event fires in the same file use `async_fire_internal`.\nThe comment itself (`Since updated may be the old or the new...`) does not explain why\n`async_fire_internal` is inappropriate - the distinction is about thread safety, not about\nwhether the entry changed. Using `async_fire` unconditionally causes an extra thread-id check\nand a deprecation-warning path on every area update.","fix":"Call `async_fire_internal` after verifying the event loop thread (which `_async_update` already does via `verify_event_loop_thread` on line 427 when there are actual changes). For the no-op path (no changes) simply return early without firing the event, matching the pattern in other registries.","locations":[{"ref":"homeassistant/helpers/area_registry.py:374-377","code":"  374 |         self.hass.bus.async_fire(\n  375 |             EVENT_AREA_REGISTRY_UPDATED,\n  376 |             EventAreaRegistryUpdatedData(action=\"update\", area_id=area_id),\n  377 |         )","lines":4,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/area_registry.py#L374-L377"}]},
{"id":"ARCH_2","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"command_line auth provider (async_validate_login, lines 68-107): the subprocess is\nlaunched with `env={\"username\": username, \"password\": password}` - a completely empty\nsystem environment containing only the credentials. This means the child process has\nno PATH, no HOME, no locale variables, etc. If the external command relies on any\nenvironment variable (e.g. needs to find libraries or config files via PATH or HOME),\nit will silently fail or behave unexpectedly. The error from the subprocess will simply\nbe a non-zero exit code, giving the user no actionable diagnostic.","fix":"If the isolation is intentional (security hardening), document it clearly and add a\nstartup warning. If not intentional, pass a sanitized copy of os.environ with only safe\nvariables (PATH, HOME, LANG, etc.) merged with the credentials:\n  env = {k: v for k, v in os.environ.items() if k in SAFE_ENV_VARS}\n  env.update({\"username\": username, \"password\": password})","locations":[{"ref":"homeassistant/auth/providers/command_line.py:68-90","code":"   68 |         \"\"\"Validate a username and password.\"\"\"\n   69 |         env = {\"username\": username, \"password\": password}\n   70 |         try:\n   71 |             process = await asyncio.create_subprocess_exec(\n   72 |                 self.config[CONF_COMMAND],\n   73 |                 *self.config[CONF_ARGS],\n   74 |                 env=env,\n   75 |                 stdout=asyncio.subprocess.PIPE if self.config[CONF_META] else None,\n   76 |                 close_fds=False,  # required for posix_spawn\n   77 |             )\n   78 |             stdout, _ = await process.communicate()\n   79 |         except OSError as err:\n   80 |             # happens when command doesn't exist or permission is denied\n   81 |             _LOGGER.error(\"Error while authenticating %r: %s\", username, err)\n   82 | {"id":"ARCH_3","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"`Entity.async_update_ha_state` (entity.py, lines 975-1011) is a public coroutine that integrations are warned not to use (in favor of `async_write_ha_state`). However, `EntityComponent.async_update_entity` (entity_component.py, line 60) still calls it with `force_refresh=True`. The method's docstring and the warning branch inside it (lines 997-1009) only fire when `force_refresh=False`, creating confusion: the method is deprecated for the `force_refresh=False` case but still serves as the canonical polling update path for `force_refresh=True`. This dual role makes the deprecation warning misleading and complicates future cleanup.","fix":"Introduce a separate internal method (e.g., `_async_update_and_write_ha_state`) for the `force_refresh=True` path used by `async_update_entity` and the polling loop, and fully deprecate the public `async_update_ha_state` method.","locations":[{"ref":"homeassistant/helpers/entity.py:975-1011","code":"  975 |     async def async_update_ha_state(self, force_refresh: bool = False) -> None:\n  976 |         \"\"\"Update Home Assistant with current state of entity.\n  977 | \n  978 |         If force_refresh == True will update entity before setting state.\n  979 | \n  980 |         This method must be run in the event loop.\n  981 |         \"\"\"\n  982 |         if self.hass is None:\n  983 |             raise RuntimeError(f\"Attribute hass is None for {self}\")\n  984 | \n  985 |         if self.entity_id is None:\n  986 |             raise NoEntitySpecifiedError(\n  987 |                 f\"No entity id specified for entity {self.name}\"\n  988 |             )\n  989 | \n  990 |         # update entity data\n  991 |         if force_refresh:\n  992 |             try:\n  993 |                 await self.async_device_update()\n  994 |             except Exception:\n  995 |                 _LOGGER.exception(\"Update for {"id":"ARCH_4","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"In `util/timeout.py`, the `_GlobalFreezeContext.__enter__` and `__exit__` methods use `call_soon_threadsafe` to schedule `_enter` and `_exit` on the event loop when called from a synchronous context. However, this means the freeze doesn't actually take effect until the event loop processes the callback, which is not immediately. If the calling thread immediately proceeds to do work that should be frozen, the freeze hasn't started yet. Similarly, `__exit__` via `call_soon_threadsafe` means the freeze is still active even after `__exit__` returns in the calling thread. This design creates a race window between the thread thinking the freeze is active/inactive and the event loop actually having processed the freeze state change.","fix":"Document the inherent race window when using the synchronous context manager from threads. Consider using `run_callback_threadsafe(...).result()` to make the `__enter__`/`__exit__` calls synchronous (block until the event loop has processed them), at the cost of blocking the calling thread.","locations":[{"ref":"homeassistant/util/timeout.py:47-58","code":"   47 |     def __enter__(self) -> Self:\n   48 |         self._loop.call_soon_threadsafe(self._enter)\n   49 |         return self\n   50 | \n   51 |     def __exit__(\n   52 |         self,\n   53 |         exc_type: type[BaseException] | None,\n   54 |         exc_val: BaseException | None,\n   55 |         exc_tb: TracebackType | None,\n   56 |     ) -> bool | None:\n   57 |         self._loop.call_soon_threadsafe(self._exit)\n   58 |         return None","lines":12,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/util/timeout.py#L47-L58"}]},
{"id":"ARCH_5","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"The auto-discovery mechanism in __init__.py (lines 34-43) filters checker classes by\n`value.__module__ == module.__name__`. When a checker class is defined in a module and\nthe module's `__name__` differs from the fully-qualified module name (which can happen\nin some import scenarios or during test collection), the filter silently excludes the class.\nMore practically, if a module has a `register` function but no checker classes defined\ndirectly within it (all its checker classes are imported from sub-modules), then\n`module_checker_types` is empty. The guard `if module_checker_types and ...` short-circuits\nto False on the empty set, so `register` is always called for such modules - bypassing the\ndeduplication check entirely and potentially calling register multiple times in parallel\npylint workers.","fix":"If module_checker_types is empty, skip the deduplication check and always call register.\nOr: have register implementations guard against double-registration themselves by checking\nexisting_checker_types before registering. Document clearly that modules must define checker\nclasses in the same file to benefit from dedup.","locations":[{"ref":"pylint/plugins/pylint_home_assistant/__init__.py:34-45","code":"   34 |         module_checker_types = {\n   35 |             value\n   36 |             for value in vars(module).values()\n   37 |             if (\n   38 |                 isinstance(value, type)\n   39 |                 and issubclass(value, BaseChecker)\n   40 |                 and value.__module__ == module.__name__\n   41 |             )\n   42 |         }\n   43 |         if module_checker_types and module_checker_types <= existing_checker_types:\n   44 |             continue\n   45 |         module.register(linter)","lines":12,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/pylint/plug
