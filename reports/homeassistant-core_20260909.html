<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"`remap` in math.py raises an unhandled `ZeroDivisionError` at line 496 when `in_min == in_max` and `edges` is neither `\"wrap\"` nor `\"mirror\"` (those two branches already validate that the range is nonzero, but `\"none\"` and `\"clamp\"` do not). With `edges=\"none\"` or `edges=\"clamp\"` and equal min/max bounds, execution reaches `normalized = (value_num - in_min_num) / (in_max_num - in_min_num)` which divides by zero. The short-circuit on line 491 only fires for the case where there are no steps AND the output range also happens to equal the input range, so it does not protect the general case.","fix":"Add a guard before line 496: if `in_max_num == in_min_num`, raise `ValueError` with a descriptive message (or return `out_min_num` as a clamped fallback) rather than letting a bare `ZeroDivisionError` propagate.","locations":[{"ref":"homeassistant/helpers/template/extensions/math.py:491-501","code":"  491 |         if not steps and (in_min_num == out_min_num and in_max_num == out_max_num):\n  492 |             # No remapping needed. Save some cycles and\n  493 |             # floating-point precision.\n  494 |             return value_num\n  495 | \n  496 |         normalized = (value_num - in_min_num) / (in_max_num - in_min_num)\n  497 | \n  498 |         if steps:\n  499 |             normalized = round(normalized * steps) / steps\n  500 | \n  501 |         return out_min_num + (normalized * (out_max_num - out_min_num))","lines":11,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/template/extensions/math.py#L491-L501"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`ordinal` in string.py calls `int(str(value)[-2:])` to extract the last two digits. For non-integer numeric values such as `1.5`, `str(1.5)` is `'1.5'` and `str(1.5)[-2:]` is `'.5'`, which causes `int('.5')` to raise a `ValueError`. The function's signature accepts `Any`, so users can reasonably pass floats.","fix":"Convert `value` to `int` first (or truncate to an integer string) before slicing, or explicitly document and validate that only integer-valued inputs are accepted.","locations":[{"ref":"homeassistant/helpers/template/extensions/string.py:41-48","code":"   41 |     def ordinal(self, value: Any) -> str:\n   42 |         \"\"\"Perform ordinal conversion.\"\"\"\n   43 |         suffixes = [\"th\", \"st\", \"nd\", \"rd\"] + [\"th\"] * 6  # codespell:ignore nd\n   44 |         return str(value) + (\n   45 |             suffixes[(int(str(value)[-1])) % 10]\n   46 |             if int(str(value)[-2:]) % 100 not in range(11, 14)\n   47 |             else \"th\"\n   48 |         )","lines":8,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/template/extensions/string.py#L41-L48"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"trusted_networks: group-based user filtering is broken due to incorrect list flattening.\n`group_list` is a list of plain strings (group IDs, e.g. [\"system-admin\"]).\n`flattened_group_list` then iterates over each string as a sequence, yielding individual\ncharacters: ['s','y','s','t','e','m','-','a','d','m','i','n'].\nThe subsequent check `group.id in flattened_group_list` compares full group ID strings\n(e.g. \"system-admin\") against single characters and therefore ALWAYS returns False.\nThis means group-based trusted-user access configured via `trusted_users` NEVER works.\n\nThe config schema declares `CONF_GROUP` as `str` (a single group ID), but the code\ntreats the value as a list to flatten. The tests work only because they inject a Python\nlist directly into the config, bypassing schema validation.","fix":"Either:\na) Keep CONF_GROUP as str and remove the flattening - replace:\n   `flattened_group_list = [group for sublist in group_list for group in sublist]`\n   with `flattened_group_list = group_list`\nb) Change the schema to accept a list: `vol.Schema({vol.Required(CONF_GROUP): [str]})`\n   and keep the current flattening logic.\nAlso update the test at tests/auth/providers/test_trusted_networks.py:387 to match\nthe intended schema.","locations":[{"ref":"homeassistant/auth/providers/trusted_networks.py:121-139","code":"  121 |             user_list = [\n  122 |                 user_id for user_id in user_or_group_list if isinstance(user_id, str)\n  123 |             ]\n  124 |             group_list = [\n  125 |                 group[CONF_GROUP]\n  126 |                 for group in user_or_group_list\n  127 |                 if isinstance(group, dict)\n  128 |             ]\n  129 |             flattened_group_list = [\n  130 |                 group for sublist in group_list for group in sublist\n  131 |             ]\n  132 |             available_users = [\n  133 |                 user\n  134 |                 for user in available_users\n  135 |                 if (\n  136 |                     user.id in user_list\n  137 |                     or any(group.id in flattened_group_list for group in user.groups)\n  138 |                 )\n  139 |             ]","lines":19,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/auth/providers/trusted_networks.py#L121-L139"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"`async_add_shutdown_job` returns a `remove_job` callback that calls\n`self._shutdown_jobs.remove(job_with_args)` without guarding against the job already being absent\n(e.g. because shutdown already consumed the list). This raises `ValueError` when called after\nshutdown has started. By contrast, `async_add_startup_job` correctly guards with\n`if job_with_args in self._startup_jobs`.","fix":"Mirror the startup job pattern: guard the remove with `if job_with_args in self._shutdown_jobs: self._shutdown_jobs.remove(job_with_args)`","locations":[{"ref":"homeassistant/core.py:1071-1073","code":" 1071 |         @callback\n 1072 |         def remove_job() -> None:\n 1073 |             self._shutdown_jobs.remove(job_with_args)","lines":3,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/core.py#L1071-L1073"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"`ServiceRegistry.supports_response` uses dict subscription (`self._services[domain][service]`) which\nraises `KeyError` when the service does not exist. The docstring says it returns `SupportsResponse.NONE`\nwhen the service is not found, but the truthiness check `if not (handler := ...)` never fires for a\nmissing key - a `KeyError` is raised instead and propagates to the caller unhandled. The guard\n`if not handler` is also semantically wrong: `Service` objects are always truthy.","fix":"Replace the subscription with `.get()` lookups: `handler = self._services.get(domain.lower(), {}).get(service.lower()); if handler is None: return SupportsResponse.NONE; return handler.supports_response`","locations":[{"ref":"homeassistant/core.py:2683-2685","code":" 2683 |         if not (handler := self._services[domain.lower()][service.lower()]):\n 2684 |             return SupportsResponse.NONE\n 2685 |         return handler.supports_response","lines":3,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/core.py#L2683-L2685"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"ws_delete_item sends both an error response and a success response when the item is not found. The `connection.send_result(msg['id'])` call at line 765 is outside the try/except block and executes unconditionally, even after `connection.send_error(...)` has already been called. The WebSocket protocol expects exactly one response per request; sending two responses for the same message ID corrupts the client-side state.","fix":"Move `connection.send_result(msg['id'])` inside the `try` block so it only runs on success, or add an `else` clause to skip it when an error was sent.","locations":[{"ref":"homeassistant/helpers/collection.py:752-765","code":"  752 |     async def ws_delete_item(\n  753 |         self, hass: HomeAssistant, connection: websocket_api.ActiveConnection, msg: dict\n  754 |     ) -> None:\n  755 |         \"\"\"Delete an item.\"\"\"\n  756 |         try:\n  757 |             await self.storage_collection.async_delete_item(msg[self.item_id_key])\n  758 |         except ItemNotFound:\n  759 |             connection.send_error(\n  760 |                 msg[\"id\"],\n  761 |                 websocket_api.ERR_NOT_FOUND,\n  762 |                 f\"Unable to find {self.item_id_key} {msg[self.item_id_key]}\",\n  763 |             )\n  764 | \n  765 |         connection.send_result(msg[\"id\"])","lines":14,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/collection.py#L752-L765"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In `_async_update_entity`, when `disabled_by` is implicitly changed because a config entry is enabled or disabled (lines 1820, 1822, 1824), only `new_values` is updated but `old_values` is never updated with the previous `disabled_by` value. The fired `EVENT_ENTITY_REGISTRY_UPDATED` event therefore omits `disabled_by` from its `changes` dict even though the field actually changed. Any listener inspecting `changes` to detect disabled-state transitions will miss this implicit change.","fix":"After each `new_values['disabled_by'] = ...` assignment in the config-entry block, also record the old value: `old_values.setdefault('disabled_by', old.disabled_by)`.","locations":[{"ref":"homeassistant/helpers/entity_registry.py:1935-1947","code":" 1935 |         if disabled_by is UNDEFINED and config_entry_id is not UNDEFINED:\n 1936 |             if config_entry_id:\n 1937 |                 config_entry = self.hass.config_entries.async_get_entry(config_entry_id)\n 1938 |                 if TYPE_CHECKING:\n 1939 |                     # We've checked the config_entry exists in _validate_item\n 1940 |                     assert config_entry is not None\n 1941 |                 if config_entry.disabled_by:\n 1942 |                     if old.disabled_by is None:\n 1943 |                         new_values[\"disabled_by\"] = RegistryEntryDisabler.CONFIG_ENTRY\n 1944 |                 elif old.disabled_by == RegistryEntryDisabler.CONFIG_ENTRY:\n 1945 |                     new_values[\"disabled_by\"] = None\n 1946 |             elif old.disabled_by == RegistryEntryDisabler.CONFIG_ENTRY:\n 1947 |                 new_values[\"disabled_by\"] = None","lines":13,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/entity_registry.py#L1935-L1947"},{"ref":"homeassistant/helpers/entity_registry.py:2007-2018","code":" 2007 |         old_values.pop(\"original_name_unprefixed\", None)\n 2008 | \n 2009 |         data: _EventEntityRegistryUpdatedData_Update = {\n 2010 |             \"action\": \"update\",\n 2011 |             \"entity_id\": entity_id,\n 2012 |             \"changes\": old_values,\n 2013 |         }\n 2014 | \n 2015 |         if old.entity_id != entity_id:\n 2016 |             data[\"old_entity_id\"] = old.entity_id\n 2017 | \n 2018 |         self.hass.bus.async_fire_internal(EVENT_ENTITY_REGISTRY_UPDATED, data)","lines":12,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/entity_registry.py#L2007-L2018"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"`_IconsCache._async_load` (icon.py:116-117) raises immediately when any single\nintegration in the batch fails to load. This means:\n1. All other integrations in the batch - even those that loaded successfully - never get\n   their icons cached, and `_loaded` is never updated for any of them.\n2. Every subsequent call that includes any of those components will re-enter the lock and\n   re-try, only to raise again on the still-failing integration, causing repeated I/O.\n3. One broken integration permanently prevents icon loading for all other integrations\n   that happen to be batched with it.","fix":"Log and skip failing integrations rather than raising, and always mark successfully\nprocessed components as loaded:\n\n    for domain, int_or_exc in ints_or_excs.items():\n        if isinstance(int_or_exc, Exception):\n            _LOGGER.warning(\"Failed to get integration %s: %s\", domain, int_or_exc)\n            continue\n        integrations[domain] = int_or_exc\n\n    # After loading, mark everything attempted as done (including failed ones)\n    self._loaded.update(components)","locations":[{"ref":"homeassistant/helpers/icon.py:109-123","code":"  109 |     async def _async_load(self, components: set[str]) -> None:\n  110 |         \"\"\"Populate the cache for a given set of components.\"\"\"\n  111 |         _LOGGER.debug(\"Cache miss for: %s\", components)\n  112 | \n  113 |         integrations: dict[str, Integration] = {}\n  114 |         ints_or_excs = await async_get_integrations(self._hass, components)\n  115 |         for domain, int_or_exc in ints_or_excs.items():\n  116 |             if isinstance(int_or_exc, Exception):\n  117 |                 raise int_or_exc\n  118 |             integrations[domain] = int_or_exc\n  119 | \n  120 |         icons = await _async_get_component_icons(self._hass, components, integrations)\n  121 | \n  122 |         self._build_category_cache(components, icons)\n  123 |         self._loaded.update(components)","lines":15,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/icon.py#L109-L123"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"`DynamicServiceIntentHandler.async_handle_states` (intent.py:1125-1139) zips `states`\n(original ordering) with `asyncio.as_completed(service_coros)` (completion ordering).\n`asyncio.as_completed` yields coroutines in the order they *complete*, not in the order\nthey were submitted, so the `target` built from `state` is routinely attributed to the\nwrong coroutine result. A fast call for state[1] completes first and is incorrectly\npaired with state[0], meaning success/failure is recorded for the wrong entity. The\nreported `success_results` and `failed_results` sets become unreliable, and the error\nmessage on total failure refers to the last `service` variable from the for-loop rather\nthan the actual failing entities.","fix":"Remove `asyncio.as_completed` and use `asyncio.gather` with `return_exceptions=True`\ninstead, so each coroutine's result is kept positionally aligned with its state:\n\n    results = await asyncio.gather(*service_coros, return_exceptions=True)\n    for state, result in zip(states, results):\n        target = IntentResponseTarget(...)\n        if isinstance(result, Exception):\n            failed_results.append(target)\n            _LOGGER.exception(\"Service call failed for %s\", state.entity_id, exc_info=result)\n        else:\n            success_results.append(target)","locations":[{"ref":"homeassistant/helpers/intent.py:1125-1148","code":" 1125 |         # Handle service calls in parallel, noting failures as they occur.\n 1126 |         failed_results: list[IntentResponseTarget] = []\n 1127 |         for state, service_coro in zip(\n 1128 |             states, asyncio.as_completed(service_coros), strict=False\n 1129 |         ):\n 1130 |             target = IntentResponseTarget(\n 1131 |                 type=IntentResponseTargetType.ENTITY,\n 1132 |                 name=state.name,\n 1133 |                 id=state.entity_id,\n 1134 |             )\n 1135 | \n 1136 |             try:\n 1137 |                 await service_coro\n 1138 |                 success_results.append(target)\n 1139 |             except Exception:\n 1140 |                 failed_results.append(target)\n 1141 |                 _LOGGER.exception(\"Service call failed for %s\", state.entity_id)\n 1142 | \n 1143 |         if not success_results:\n 1144 |             # If no entities succeeded, raise an error.\n 1145 |             failed_entity_ids = [target.id for target in failed_results]\n 1146 |             raise IntentHandleError(\n 1147 |                 f\"Failed to call {service} for: {failed_entity_ids}\"\n 1148 |             )","lines":24,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/intent.py#L1125-L1148"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"StoredState.from_dict passes a potentially None value as last_seen. dt_util.parse_datetime returns None when the string cannot be parsed. If that happens, last_seen is stored as None (typed datetime) and the comparison at line 211 (`stored_state.last_seen < expiration_time`) will raise TypeError at runtime.","fix":"After calling parse_datetime, check for None and either skip the item or substitute a fallback (e.g. epoch or utcnow()): `if last_seen is None: raise ValueError(...)` or `last_seen = dt_util.utc_from_timestamp(0)`.","locations":[{"ref":"homeassistant/helpers/restore_state.py:87-93","code":"   87 |         last_seen = json_dict[\"last_seen\"]\n   88 | \n   89 |         if isinstance(last_seen, str):\n   90 |             last_seen = dt_util.parse_datetime(last_seen)\n   91 | \n   92 |         return cls(\n   93 |             cast(State, State.from_dict(json_dict[\"state\"])), extra_data, last_seen","lines":7,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/restore_state.py#L87-L93"},{"ref":"homeassistant/helpers/restore_state.py:211","code":"  211 |             if stored_state.last_seen < expiration_time:","lines":1,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/restore_state.py#L211"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In `area_entities` and `area_devices`, the code assumes that `area_name(lookup_value)` returning non-None means `lookup_value` is an area ID. However, `area_name` also returns non-None for entity IDs and device IDs that belong to an area (via the entity/device lookup branches in `area_name`). When an entity ID like `light.living_room` is passed, `area_name` returns the area name (non-None), and then `_area_id` is set to the original entity ID string instead of the actual area ID. The subsequent `er.async_entries_for_area` / `dr.async_entries_for_area` calls receive an entity ID where an area ID is expected, resulting in empty (incorrect) results.","fix":"Always resolve the area ID via `area_id(area_id_or_name)` when the input might be an entity or device ID. Alternatively, use `area_reg.async_get_area(lookup_value)` directly to distinguish area IDs from other inputs before falling back to `area_id()`.","locations":[{"ref":"homeassistant/helpers/template/extensions/areas.py:119-161","code":"  119 |     def area_entities(self, area_id_or_name: str) -> Iterable[str]:\n  120 |         \"\"\"Return entities for a given area ID or name.\"\"\"\n  121 |         _area_id: str | None\n  122 |         # if area_name returns a value, we know the input was an ID, otherwise we\n  123 |         # assume it's a name, and if it's neither, we return early\n  124 |         if self.area_name(area_id_or_name) is None:\n  125 |             _area_id = self.area_id(area_id_or_name)\n  126 |         else:\n  127 |             _area_id = area_id_or_name\n  128 |         if _area_id is None:\n  129 |             return []\n  130 |         ent_reg = er.async_get(self.hass)\n  131 |         entity_ids = [\n  132 |             entry.entity_id for entry in er.async_entries_for_area(ent_reg, _area_id)\n  133 |         ]\n  134 |         dev_reg = dr.async_get(self.hass)\n  135 |         # We also need to add entities tied to a device in the\n  136 |         # area that don't themselves have an area specified\n  137 |         # since they inherit the area from the device.\n  138 |         entity_ids.extend(\n  139 |             [\n  140 |                 entity.entity_id\n  141 |                 for device in dr.async_entries_for_area(dev_reg, _area_id)\n  142 |                 for entity in er.async_entries_for_device(ent_reg, device.id)\n  143 |                 if entity.area_id is None\n  144 |             ]\n  145 |         )\n  146 |         return entity_ids\n  147 | \n  148 |     def area_devices(self, area_id_or_name: str) -> Iterable[str]:\n  149 |         \"\"\"Return device IDs for a given area ID or name.\"\"\"\n  150 |         _area_id: str | None\n  151 |         # if area_name returns a value, we know the input was an ID, otherwise we\n  152 |         # assume it's a name, and if it's neither, we return early\n  153 |         if self.area_name(area_id_or_name) is not None:\n  154 |             _area_id = area_id_or_name\n  155 |         else:\n  156 |             _area_id = self.area_id(area_id_or_name)\n  157 |         if _area_id is None:\n  158 |             return []\n  159 |         dev_reg = dr.async_get(self.hass)\n  160 |         entries = dr.async_entries_for_area(dev_reg, _area_id)\n  161 |         return [entry.id for entry in entries]","lines":43,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/template/extensions/areas.py#L119-L161"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In `merge_response` (functional.py), the `is_single_list` flag is initialized once before the outer loop over entity IDs (line 165) and never reset per entity. If the first entity response matches the single-list format (`is_single_list` becomes `True`), the flag stays `True` for all subsequent entities. For any later entity whose response is NOT in single-list format (its inner loop hits the `break` at line 186 without setting `is_single_list`), the guard `if not is_single_list:` at line 188 evaluates to `False` and that entity's data is silently dropped from the output. This corrupts the merged list when a response mixes single-list and dict-format entities.","fix":"Move `is_single_list = False` inside the outer `for entity_id` loop so it is reset for each entity.","locations":[{"ref":"homeassistant/helpers/template/extensions/functional.py:165-195","code":"  165 |         is_single_list = False\n  166 |         response_items: list = []\n  167 |         input_service_response = deepcopy(value)\n  168 |         for entity_id, entity_response in input_service_response.items():  # pylint: disable=too-many-nested-blocks\n  169 |             if not isinstance(entity_response, dict):\n  170 |                 raise TypeError(\"Response is not a dictionary\")\n  171 |             for value_key, type_response in entity_response.items():\n  172 |                 if len(entity_response) == 1 and isinstance(type_response, list):\n  173 |                     is_single_list = True\n  174 |                     for dict_in_list in type_response:\n  175 |                         if isinstance(dict_in_list, dict):\n  176 |                             if ATTR_ENTITY_ID in dict_in_list:\n  177 |                                 raise ValueError(\n  178 |                                     \"Response dictionary already\"\n  179 |                                     \" contains key\"\n  180 |                                     f\" '{ATTR_ENTITY_ID}'\"\n  181 |                                 )\n  182 |                             dict_in_list[ATTR_ENTITY_ID] = entity_id\n  183 |                             dict_in_list[\"value_key\"] = value_key\n  184 |                     response_items.extend(type_response)\n  185 |                 else:\n  186 |                     break\n  187 | \n  188 |             if not is_single_list:\n  189 |                 _response = entity_response.copy()\n  190 |                 if ATTR_ENTITY_ID in _response:\n  191 |                     raise ValueError(\n  192 |                         f\"Response dictionary already contains key '{ATTR_ENTITY_ID}'\"\n  193 |                     )\n  194 |                 _response[ATTR_ENTITY_ID] = entity_id\n  195 |                 response_items.append(_response)","lines":31,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/template/extensions/functional.py#L165-L195"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In translation.py `async_setup`, a local `_TranslationCache` is created (line 388) and the `_async_load_translations` closure captures it (line 406). A second, separate `_TranslationCache` is then created and stored as the process-wide singleton via `_async_get_translations_cache(hass)` (line 390). When a language change fires `EVENT_CORE_CONFIG_UPDATE`, the handler loads into the local `cache` object - not the singleton consulted by every other caller (`async_get_translations`, `async_get_cached_translations`, etc.). The result is that language changes never actually populate the cache that the rest of the codebase reads, so the UI continues to show the old language's translations indefinitely.","fix":"Replace `cache = _TranslationCache(hass)` with `cache = _async_get_translations_cache(hass)` so the listener and the singleton refer to the same object.","locations":[{"ref":"homeassistant/helpers/translation.py:383-412","code":"  383 | def async_setup(hass: HomeAssistant) -> None:\n  384 |     \"\"\"Create translation cache and register listeners for translation loaders.\n  385 | \n  386 |     Listeners load translations for every loaded component and after config change.\n  387 |     \"\"\"\n  388 |     cache = _TranslationCache(hass)\n  389 |     current_language = hass.config.language\n  390 |     _async_get_translations_cache(hass)\n  391 | \n  392 |     @callback\n  393 |     def _async_load_translations_filter(event_data: Mapping[str, Any]) -> bool:\n  394 |         \"\"\"Filter out unwanted events.\"\"\"\n  395 |         nonlocal current_language\n  396 |         if (\n  397 |             new_language := event_data.get(\"language\")\n  398 |         ) and new_language != current_language:\n  399 |             current_language = new_language\n  400 |             return True\n  401 |         return False\n  402 | \n  403 |     async def _async_load_translations(event: Event) -> None:\n  404 |         new_language = event.data[\"language\"]\n  405 |         _LOGGER.debug(\"Loading translations for language: %s\", new_language)\n  406 |         await cache.async_load(new_language, hass.config.components)\n  407 | \n  408 |     hass.bus.async_listen(\n  409 |         EVENT_CORE_CONFIG_UPDATE,\n  410 |         _async_load_translations,\n  411 |         event_filter=_async_load_translations_filter,\n  412 |     )","lines":30,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/translation.py#L383-L412"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In `async_get_platforms`, when executor import fails with a generic `ImportError` (not `ModuleNotFoundError`), the code falls back to the event loop and calls `self._load_platforms(platform_names)` instead of `self._load_platforms(load_event_loop_platforms)`. This passes the full original `platform_names` iterable rather than just the platforms that need to be loaded in the event loop. Any platform already successfully loaded in the executor will be re-imported, and platforms that were already resolved will be double-processed and overwritten in the platforms dict. The `platform_names` variable is the original argument passed to the function (which could include platforms already cached), while `load_event_loop_platforms` is the intended fallback list.","fix":"Change `self._load_platforms(platform_names)` on line 1190 to `self._load_platforms(load_event_loop_platforms)` to only fall back to loading platforms that were originally slated for executor loading, not the full set.","locations":[{"ref":"homeassistant/loader.py:1193-1194","code":" 1193 |                 if load_event_loop_platforms:\n 1194 |                     platforms.update(self._load_platforms(platform_names))","lines":2,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/loader.py#L1193-L1194"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`_resolve_variable_ip_ref` in the unique_id_no_ip checker uses\n`current.nodes_of_class(nodes.Assign)` to scan the enclosing function for assignments\nto the variable. `nodes_of_class` descends RECURSIVELY into nested functions, so an\nassignment of `host = user_input[CONF_HOST]` inside a nested helper function would\nincorrectly match the outer `host` variable, causing false positives.\n\nSeparately, the scan checks ALL assignments to `host`, regardless of control-flow order.\nIf the variable is later rewritten to a non-IP value (e.g., `host = normalize(host)`),\nthe earlier IP-based assignment is still found and the call is flagged, which is also a\nfalse positive.","fix":"Restrict the scan to Assign nodes whose target's scope is the same function (i.e., skip\nnodes inside nested FunctionDefs). Also consider only the LAST assignment to the\nvariable before the async_set_unique_id call, not all assignments.","locations":[{"ref":"pylint/plugins/pylint_home_assistant/checkers/config_flow/unique_id_no_ip.py:128-150","code":"  128 |     \"\"\"Resolve a variable back to its assignments in the enclosing function.\"\"\"\n  129 |     # Find the enclosing function\n  130 |     current = name_node.parent\n  131 |     while current is not None:\n  132 |         if isinstance(current, nodes.FunctionDef):\n  133 |             break\n  134 |         current = current.parent\n  135 |     else:\n  136 |         return None\n  137 | \n  138 |     # Scan all assignments in the function for this variable name\n  139 |     for assign in current.nodes_of_class(nodes.Assign):\n  140 |         for target in assign.targets:\n  141 |             if (\n  142 |                 isinstance(target, nodes.AssignName)\n  143 |                 and target.name == name_node.name\n  144 |                 and assign.value\n  145 |             ):\n  146 |                 ref = _check_subscript_or_call_ip(assign.value)\n  147 |                 if ref:\n  148 |                     return ref\n  149 | \n  150 |     return None","lines":23,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/pylint/plugins/pylint_home_assistant/checkers/config_flow/unique_id_no_ip.py#L128-L150"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`super_call.py` only looks at the TOP-LEVEL statements of the function body when\nsearching for a `super().async_added_to_hass()` call. If the super call is nested\ninside an `if`, `try`, `with`, or any other control-flow statement - which is common\nin real integration code - the checker reports a false positive (missing super call).\n\nThe relevant loop at line 40 iterates `node.body` directly and the while-unwrap only\nhandles the direct wrapper nodes (Expr/Await/Return); it never recurses into compound\nstatements.","fix":"Replace the flat-body scan with a recursive search using\n`node.nodes_of_class(nodes.Call)` and check whether any of those calls match the\nsuper()-method pattern, regardless of nesting depth.","locations":[{"ref":"pylint/plugins/pylint_home_assistant/checkers/super_call.py:40-51","code":"   40 |         # Check function body for super call\n   41 |         for child_node in node.body:\n   42 |             while isinstance(child_node, (nodes.Expr, nodes.Await, nodes.Return)):\n   43 |                 child_node = child_node.value\n   44 |             match child_node:\n   45 |                 case nodes.Call(\n   46 |                     func=nodes.Attribute(\n   47 |                         expr=nodes.Call(func=nodes.Name(name=\"super\")),\n   48 |                         attrname=node.name,\n   49 |                     ),\n   50 |                 ):\n   51 |                     return","lines":12,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/pylint/plugins/pylint_home_assistant/checkers/super_call.py#L40-L51"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"Duplicate TypeHintMatch for `select_option` in _INHERITANCE_MATCH[Platform.SELECT].\nTwo entries with function_name=\"select_option\" appear consecutively. The\n_visit_class_functions method adds a function name to `checked_class_methods` after the\nfirst match fires (line 156), so the second matcher - which specifies arg_types={1: \"str\"}\nand has_async_counterpart=True - is skipped entirely. This means:\n\n1. The argument-type check for str on select_option is never applied.\n2. async_select_option is never checked at all, because need_to_check_function for the\n   first (no has_async_counterpart) match returns False for async_select_option, and the\n   second match (which has has_async_counterpart=True) is skipped by the dedup guard.\n\nBoth the argument-type enforcement and the async counterpart check for SelectEntity are\nsilently dead.","fix":"Remove the first `select_option` TypeHintMatch (lines 2474-2477) that has no arg_types and\nno has_async_counterpart. Keep only the second one that has arg_types={1: \"str\"} and\nhas_async_counterpart=True. If both sync and async forms need checking, a single entry with\nhas_async_counterpart=True already covers both.","locations":[{"ref":"pylint/plugins/pylint_home_assistant/checkers/type_hints/const.py:2474-2483","code":" 2474 |                 TypeHintMatch(\n 2475 |                     function_name=\"select_option\",\n 2476 |                     return_type=None,\n 2477 |                 ),\n 2478 |                 TypeHintMatch(\n 2479 |                     function_name=\"select_option\",\n 2480 |                     arg_types={1: \"str\"},\n 2481 |                     return_type=None,\n 2482 |                     has_async_counterpart=True,\n 2483 |                 ),","lines":10,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/pylint/plugins/pylint_home_assistant/checkers/type_hints/const.py#L2474-L2483"},{"ref":"pylint/plugins/pylint_home_assistant/checkers/type_hints/__init__.py:143-156","code":"  143 |         for match in matches:\n  144 |             for function_node in cached_methods:\n  145 |                 if (\n  146 |                     function_node.name in checked_class_methods\n  147 |                     or not match.need_to_check_function(function_node)\n  148 |                 ):\n  149 |                     continue\n  150 | \n  151 |                 annotations = get_all_annotations(function_node)\n  152 |                 if self._ignore_function_match(function_node, annotations, match):\n  153 |                     continue\n  154 | \n  155 |                 self._check_function(function_node, match, annotations)\n  156 |                 checked_class_methods.add(function_node.name)","lines":14,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/pylint/plugins/pylint_home_assistant/checkers/type_hints/__init__.py#L143-L156"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"AuthManager._async_track_next_refresh_token_expiration (lines 559-572) overwrites\n`self._expire_callback` with a new scheduled callback without cancelling the previous\none first. If `async_set_expiry` enables expiry on a refresh token whose expire_at is\nsooner than the currently-scheduled wakeup, no rescheduling occurs at all - the token\nwill not be purged until the previously-scheduled (later) time fires.\n\nAdditionally, if the tracking function were ever called twice before the first callback\nfires (possible if HA internals change), the old callback would be leaked (a scheduled\ntask that fires uselessly and reschedules again indefinitely).","fix":"Cancel the existing callback before scheduling a new one:\n  if self._expire_callback:\n      self._expire_callback()\n      self._expire_callback = None\n  self._expire_callback = async_track_point_in_utc_time(...)\n\nAlso call _async_track_next_refresh_token_expiration from async_set_expiry when\nenable_expiry=True so that newly-enabled expiry is scheduled promptly.","locations":[{"ref":"homeassistant/auth/__init__.py:555-568","code":"  555 |     def _async_track_next_refresh_token_expiration(self) -> None:\n  556 |         \"\"\"Initialise all token expiration scheduled tasks.\"\"\"\n  557 |         next_expiration = time.time() + REFRESH_TOKEN_EXPIRATION\n  558 |         for token in self._store.async_get_refresh_tokens():\n  559 |             if (\n  560 |                 expire_at := token.expire_at\n  561 |             ) is not None and expire_at < next_expiration:\n  562 |                 next_expiration = expire_at\n  563 | \n  564 |         self._expire_callback = async_track_point_in_utc_time(\n  565 |             self.hass,\n  566 |             self._remove_expired_job,\n  567 |             dt_util.utc_from_timestamp(next_expiration),\n  568 |         )","lines":14,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/auth/__init__.py#L555-L568"},{"ref":"homeassistant/auth/__init__.py:539-543","code":"  539 |     def async_set_expiry(\n  540 |         self, refresh_token: models.RefreshToken, *, enable_expiry: bool\n  541 |     ) -> None:\n  542 |         \"\"\"Enable or disable expiry of a refresh token.\"\"\"\n  543 |         self._store.async_set_expiry(refresh_token, enable_expiry=enable_expiry)","lines":5,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/auth/__init__.py#L539-L543"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"mfa_modules/_load_mfa_module: DATA_REQS set is reset to empty on every call for a new\nmodule, erasing previously-recorded processed modules.\n\nCode path (lines 166-170):\n  processed = hass.data.get(DATA_REQS)   # may return existing set {A}\n  if processed and module_name in processed: return module  # skip if B is already in set\n  processed = hass.data[DATA_REQS] = set()  # ALWAYS replaces with empty set!\n\nIf module A is processed first, DATA_REQS = {A}.\nWhen module B is loaded: `processed` is {A}, B is not in {A}, so falls through,\nand `hass.data[DATA_REQS] = set()` resets the dict to `{}`, forgetting A.\nNext load of A will re-process its requirements.\n\nCompare with the correct pattern in auth/providers/__init__.py (lines 179-181):\n  if (processed := hass.data.get(DATA_REQS)) is None:\n      processed = hass.data[DATA_REQS] = set()\n  elif provider in processed:\n      return module","fix":"Replace the logic at lines 166-170 with the same pattern used in providers/__init__.py:\n  if (processed := hass.data.get(DATA_REQS)) is None:\n      processed = hass.data[DATA_REQS] = set()\n  elif module_name in processed:\n      return module","locations":[{"ref":"homeassistant/auth/mfa_modules/__init__.py:163-177","code":"  163 |     if hass.config.skip_pip or not hasattr(module, \"REQUIREMENTS\"):\n  164 |         return module\n  165 | \n  166 |     processed = hass.data.get(DATA_REQS)\n  167 |     if processed and module_name in processed:\n  168 |         return module\n  169 | \n  170 |     processed = hass.data[DATA_REQS] = set()\n  171 | \n  172 |     await requirements.async_process_requirements(\n  173 |         hass, module_path, module.REQUIREMENTS\n  174 |     )\n  175 | \n  176 |     processed.add(module_name)\n  177 |     return module","lines":15,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/auth/mfa_modules/__init__.py#L163-L177"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `async_remove` (ConfigEntry), `modified_at` is unconditionally updated at the start and caches are cleared before the early return for `SOURCE_IGNORE` entries on line 1071. If the entry is an ignored entry, the side effects (timestamp update and cache invalidation) are applied but the entry is about to be deleted, so this is harmless in practice - however if an exception occurs between line 1067 and the return, the timestamp has been mutated with no rollback mechanism (unlike the exception handler on line 1103 that restores `old_modified_at`). More importantly, the guard `if self.source == SOURCE_IGNORE: return` skips the `setup_lock` check (line 1074), which is a deliberate design choice but is inconsistent with the pattern applied to other early exits. This is a minor inconsistency rather than a correctness bug, but the timestamp mutation before the guard is surprising.","fix":"Move the `modified_at` update and cache clears to after the `SOURCE_IGNORE` guard, so they only apply to entries that actually proceed with removal.","locations":[{"ref":"homeassistant/config_entries.py:1078-1086","code":" 1078 |     async def async_remove(self, hass: HomeAssistant) -> None:\n 1079 |         \"\"\"Invoke remove callback on component.\"\"\"\n 1080 |         old_modified_at = self.modified_at\n 1081 |         object.__setattr__(self, \"modified_at\", utcnow())\n 1082 |         self.clear_state_cache()\n 1083 |         self.clear_storage_cache()\n 1084 | \n 1085 |         if self.source == SOURCE_IGNORE:\n 1086 |             return","lines":9,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/config_entries.py#L1078-L1086"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `async_update_issues`, existing unique-id collision issues for a domain are collected into `issues` for potential deletion. After processing, `break` stops after the first colliding unique_id per domain. If a domain has two distinct colliding unique_ids (A and B) and both already have issues in the registry, only A's issue_id is discarded from `issues` before the break. B's issue_id remains in `issues` and is then deleted at the end even though the collision for B still exists. The net effect is: when multiple distinct unique_ids within the same domain each have collisions, all but the first collision issue are silently deleted on every call to `async_update_issues`.","fix":"Before breaking, discard all issue_ids for the current domain from `issues`, not just the one being created. Alternatively, iterate over all colliding unique_ids and call `issues.discard(issue_id)` for each before the break, so that existing issues for the same domain are not erroneously deleted.","locations":[{"ref":"homeassistant/config_entries.py:2949-3007","code":" 2949 |         for (\n 2950 |             domain,\n 2951 |             unique_ids,\n 2952 |         ) in self._entries._domain_unique_id_index.items():  # noqa: SLF001\n 2953 |             for unique_id, entries in unique_ids.items():\n 2954 |                 # We might mutate the list of entries, so we need a copy to not mess up\n 2955 |                 # the index\n 2956 |                 entries = list(entries)\n 2957 | \n 2958 |                 # There's no need to raise an issue for ignored entries, we can\n 2959 |                 # safely remove them once we no longer allow unique id collisions.\n 2960 |                 # Iterate over a copy of the copy to allow mutating while iterating\n 2961 |                 for entry in list(entries):\n 2962 |                     if entry.source == SOURCE_IGNORE:\n 2963 |                         entries.remove(entry)\n 2964 | \n 2965 |                 if len(entries) < 2:\n 2966 |                     continue\n 2967 |                 issue_id = f\"{ISSUE_UNIQUE_ID_COLLISION}_{domain}_{unique_id}\"\n 2968 |                 issues.discard(issue_id)\n 2969 |                 titles = [f\"'{entry.title}'\" for entry in entries]\n 2970 |                 translation_placeholders = {\n 2971 |                     \"domain\": domain,\n 2972 |                     \"configure_url\": f\"/config/integrations/integration/{domain}\",\n 2973 |                     \"unique_id\": str(unique_id),\n 2974 |                 }\n 2975 |                 if len(titles) <= UNIQUE_ID_COLLISION_TITLE_LIMIT:\n 2976 |                     translation_key = \"config_entry_unique_id_collision\"\n 2977 |                     translation_placeholders[\"titles\"] = \", \".join(titles)\n 2978 |                 else:\n 2979 |                     translation_key = \"config_entry_unique_id_collision_many\"\n 2980 |                     translation_placeholders[\"number_of_entries\"] = str(len(titles))\n 2981 |                     translation_placeholders[\"titles\"] = \", \".join(\n 2982 |                         titles[:UNIQUE_ID_COLLISION_TITLE_LIMIT]\n 2983 |                     )\n 2984 |                     translation_placeholders[\"title_limit\"] = str(\n 2985 |                         UNIQUE_ID_COLLISION_TITLE_LIMIT\n 2986 |                     )\n 2987 | \n 2988 |                 ir.async_create_issue(\n 2989 |                     self.hass,\n 2990 |                     HOMEASSISTANT_DOMAIN,\n 2991 |                     issue_id,\n 2992 |                     breaks_in_ha_version=\"2025.11.0\",\n 2993 |                     data={\n 2994 |                         \"issue_type\": ISSUE_UNIQUE_ID_COLLISION,\n 2995 |                         \"unique_id\": unique_id,\n 2996 |                     },\n 2997 |                     is_fixable=False,\n 2998 |                     issue_domain=domain,\n 2999 |                     severity=ir.IssueSeverity.ERROR,\n 3000 |                     translation_key=translation_key,\n 3001 |                     translation_placeholders=translation_placeholders,\n 3002 |                 )\n 3003 | \n 3004 |                 break  # Only create one issue per domain\n 3005 | \n 3006 |         for issue_id in issues:\n 3007 |             ir.async_delete_issue(self.hass, HOMEASSISTANT_DOMAIN, issue_id)","lines":59,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/config_entries.py#L2949-L3007"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`StateMachine.get` uses `or` to fall back to the lower-cased entity_id lookup:\n`return self._states_data.get(entity_id) or self._states_data.get(entity_id.lower())`.\nIf the first lookup returns a `State` object whose truth value is `False`-ish this would silently\nfall through to the second lookup. More importantly, if `entity_id` is already lower-cased the\nmethod performs two identical dict lookups every time, wasting CPU on the hot path.\nThe correct idiom is `if (s := ...) is not None: return s`.","fix":"Use explicit `is not None` checks: `if (s := self._states_data.get(entity_id)) is not None: return s; return self._states_data.get(entity_id.lower())`","locations":[{"ref":"homeassistant/core.py:2289-2291","code":" 2289 |         return self._states_data.get(entity_id) or self._states_data.get(\n 2290 |             entity_id.lower()\n 2291 |         )","lines":3,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/core.py#L2289-L2291"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`async_get_chat_session` is a `@contextmanager` that runs code after `yield` unconditionally\n(lines 159-163). If the caller's `with` block raises an exception the generator resumes at the\n`yield` and still executes `current_session.set(None)`, `session.last_updated = ...` and\n`all_sessions[conversation_id] = session`. This means a half-processed session is saved into\n`all_sessions` even on failure, potentially polluting the store with stale/corrupt state. The\n`current_session` context var is also always reset to `None` on exception, which may clobber\na legitimate outer session context.","fix":"Wrap the post-yield code in a try/finally or try/except so that cleanup (resetting current_session) always happens but session persistence only happens on clean exit.","locations":[{"ref":"homeassistant/helpers/chat_session.py:112-163","code":"  112 | @contextmanager\n  113 | def async_get_chat_session(\n  114 |     hass: HomeAssistant,\n  115 |     conversation_id: str | None = None,\n  116 | ) -> Generator[ChatSession]:\n  117 |     \"\"\"Return a chat session.\"\"\"\n  118 |     if session := current_session.get():\n  119 |         # If a session is already active and it's the requested conversation ID,\n  120 |         # return that. We won't update the last updated time in this case.\n  121 |         if session.conversation_id == conversation_id:\n  122 |             yield session\n  123 |             return\n  124 | \n  125 |         # If it's not the same conversation ID, we will create a new session\n  126 |         # because it might be a conversation agent calling a tool that is talking\n  127 |         # to another LLM.\n  128 |         session = None\n  129 | \n  130 |     all_sessions = hass.data.get(DATA_CHAT_SESSION)\n  131 |     if all_sessions is None:\n  132 |         all_sessions = {}\n  133 |         hass.data[DATA_CHAT_SESSION] = all_sessions\n  134 |         hass.data[DATA_CHAT_SESSION_CLEANUP] = SessionCleanup(hass)\n  135 | \n  136 |     if conversation_id is None:\n  137 |         conversation_id = ulid_now()\n  138 | \n  139 |     elif conversation_id in all_sessions:\n  140 |         session = all_sessions[conversation_id]\n  141 | \n  142 |     else:\n  143 |         # Conversation IDs are ULIDs. We generate a new one if not provided.\n  144 |         # If an old ULID is passed in, we will generate a new one to indicate\n  145 |         # a new conversation was started. If the user picks their own, they\n  146 |         # want to track a conversation and we respect it.\n  147 |         try:\n  148 |             ulid_to_bytes(conversation_id)\n  149 |             conversation_id = ulid_now()\n  150 |         except ValueError:\n  151 |             pass\n  152 | \n  153 |     if session is None:\n  154 |         LOGGER.debug(\"Creating new session %s\", conversation_id)\n  155 |         session = ChatSession(conversation_id)\n  156 | \n  157 |     current_session.set(session)\n  158 |     yield session\n  159 |     current_session.set(None)\n  160 | \n  161 |     session.last_updated = dt_util.utcnow()\n  162 |     all_sessions[conversation_id] = session\n  163 |     hass.data[DATA_CHAT_SESSION_CLEANUP].schedule()","lines":52,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/chat_session.py#L112-L163"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`async_get_chat_session` sets `current_session` to `None` after yielding (line 159) even when\nthe function returned early via the nested-session short-circuit path (lines 118-123). That path\nyields the existing session and returns, so the finally cleanup at lines 159-163 is never\nreached - but the ContextVar remains set to the outer session value rather than being restored\nto whatever it was before the call. If the outer session was different from the yielded one, the\nContextVar is left pointing at the wrong value after the `with` block exits.\nActually re-checking: the `return` on line 123 exits the generator cleanly without executing\nlines 159-163, so the ContextVar is never reset. The ContextVar token should be saved and\nrestored to correctly support nested usage.","fix":"Save the token from `current_session.set(...)` and always call `current_session.reset(token)` in a finally block, instead of a bare `current_session.set(None)`.","locations":[{"ref":"homeassistant/helpers/chat_session.py:117-123","code":"  117 |     \"\"\"Return a chat session.\"\"\"\n  118 |     if session := current_session.get():\n  119 |         # If a session is already active and it's the requested conversation ID,\n  120 |         # return that. We won't update the last updated time in this case.\n  121 |         if session.conversation_id == conversation_id:\n  122 |             yield session\n  123 |             return","lines":7,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/chat_session.py#L117-L123"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `notify_changes`, `change_set` (typed as `Iterable[CollectionChange]`) is iterated in the first generator expression (to notify individual `ChangeListener`s) and then passed directly to each `ChangeSetListener`. If both listener lists are non-empty and `change_set` is a one-shot iterable, the `ChangeSetListener`s receive an exhausted iterable and see no changes. In the `gather` call, all arguments are evaluated eagerly left-to-right before any coroutines run; the first generator fully consumes `change_set`, leaving nothing for the second block. All current callers pass lists so this does not trigger today, but any future caller passing a generator would silently drop changes for `change_set_listeners`.","fix":"Materialise `change_set` into a list at the top of the method: `change_set = list(change_set)`. This also prevents the same list being mutated mid-notification.","locations":[{"ref":"homeassistant/helpers/collection.py:164-176","code":"  164 |     async def notify_changes(self, change_set: Iterable[CollectionChange]) -> None:\n  165 |         \"\"\"Notify listeners of a change.\"\"\"\n  166 |         await asyncio.gather(\n  167 |             *(\n  168 |                 listener(change.change_type, change.item_id, change.item)\n  169 |                 for listener in self.listeners\n  170 |                 for change in change_set\n  171 |             ),\n  172 |             *(\n  173 |                 change_set_listener(change_set)\n  174 |                 for change_set_listener in self.change_set_listeners\n  175 |             ),\n  176 |         )","lines":13,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/collection.py#L164-L176"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `_HistoryPrimingManager._async_flush`, after the lobby `wait()` at line 503, the code exits the `async with` block and enters the `while True` loop without checking `_flush_ok`. If the flush that ran during the lobby period failed (cancelled by timeout), `_flush_ok` is False, and the caller must start or wait for a fresh one - which the `while True` loop handles correctly. However, after the inner `wait()` at line 513, the code checks `if self._flush_ok: return` - but `_flush_ok` retains the value set by the most recently completed flush. If the flush that the waiter relied on was successful, this is correct. If multiple rapid flushes occur across generations, `_flush_ok` could reflect a much earlier flush result and the `return` is taken prematurely, skipping the recorder query against a queue that was not yet flushed. The root cause is that `_flush_ok` is a single shared boolean that doesn't distinguish which flush generation it belongs to.","fix":"Use a generation counter (incremented each time a new flush begins) and compare the generation at wait-start vs wait-end so each waiter knows exactly whether the flush it waited for succeeded.","locations":[{"ref":"homeassistant/helpers/condition.py:497-535","code":"  497 |     async def _async_flush(self) -> None:\n  498 |         \"\"\"Return once a recorder flush that began no earlier than this call ends.\n  499 | \n  500 |         The first condition of a generation performs the flush; the rest rely on\n  501 |         it.\n  502 |         \"\"\"\n  503 |         async with self._flush_condition:\n  504 |             # Lobby: a flush already running began before we arrived, so it may\n  505 |             # not capture our entity's queued changes. Wait it out, don't rely on\n  506 |             # it.\n  507 |             if self._flushing:\n  508 |                 await self._flush_condition.wait()\n  509 | \n  510 |         while True:\n  511 |             async with self._flush_condition:\n  512 |                 if not self._flushing:\n  513 |                     # First past the lobby this generation: we run the flush.\n  514 |                     self._flushing = True\n  515 |                     break\n  516 |                 # A peer began a fresh flush after we cleared the lobby; wait for\n  517 |                 # it.\n  518 |                 await self._flush_condition.wait()\n  519 |                 if self._flush_ok:\n  520 |                     return\n  521 |                 # The flush we waited for was cancelled before completing (its owner\n  522 |                 # timed out): loop and start or wait for a fresh one rather than read\n  523 |                 # against a queue that was never flushed.\n  524 | \n  525 |         instance = get_instance(self._hass)\n  526 |         flushed = False\n  527 |         try:\n  528 |             if (commit_future := instance.async_get_commit_future()) is not None:\n  529 |                 await commit_future\n  530 |             flushed = True\n  531 |         finally:\n  532 |             async with self._flush_condition:\n  533 |                 self._flushing = False\n  534 |                 self._flush_ok = flushed\n  535 |                 self._flush_condition.notify_all()","lines":39,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/condition.py#L497-L535"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `async_from_config`, when `platform` is None (built-in condition) and no factory function is found for the condition key (e.g. due to an unrecognised key that slipped past schema validation), `factory` remains None. The code then calls `inspect.iscoroutinefunction(None)` (returns False) and proceeds to `checker = None(config)`, raising a bare `TypeError` instead of a meaningful `HomeAssistantError`. The error gives no indication of which condition type was requested.","fix":"After the factory lookup loop, add `if factory is None: raise HomeAssistantError(f'Unknown condition type: {condition_key}')` before continuing.","locations":[{"ref":"homeassistant/helpers/condition.py:1373-1388","code":" 1373 |     for fmt in (ASYNC_FROM_CONFIG_FORMAT, FROM_CONFIG_FORMAT):\n 1374 |         factory = getattr(sys.modules[__name__], fmt.format(condition_key), None)\n 1375 | \n 1376 |         if factory:\n 1377 |             break\n 1378 | \n 1379 |     # Check for partials to properly determine if coroutine function\n 1380 |     check_factory = factory\n 1381 |     while isinstance(check_factory, ft.partial):\n 1382 |         check_factory = check_factory.func\n 1383 | \n 1384 |     checker: ConditionChecker | ConditionCheckerType\n 1385 |     if inspect.iscoroutinefunction(check_factory):\n 1386 |         checker = await factory(hass, config)\n 1387 |     else:\n 1388 |         checker = factory(config)","lines":16,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/condition.py#L1373-L1388"}]},
{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `condition.time`, the `after` entity branch for the `time` domain (line 1852) calls `datetime.strptime(after_entity.state, '%H:%M:%S').time()` without a try/except. The unavailable/unknown states are filtered by the `elif` guard, but any other malformed state string (e.g. an entity in a transient state during restart) raises an uncaught `ValueError` that propagates up as an unhandled exception instead of returning `False` or raising a `ConditionErrorMessage`. By contrast, the `before` entity branch for the same domain (line 1880) wraps the identical call in `try/except ValueError: return False`.","fix":"Wrap line 1852 in `try/except ValueError: return False` to match the `before` branch.","locations":[{"ref":"homeassistant/helpers/condition.py:1871-1875","code":" 1871 |         elif after_entity.domain == \"time\" and after_entity.state not in (\n 1872 |             STATE_UNAVAILABLE,\n 1873 |             STATE_UNKNOWN,\n 1874 |         ):\n 1875 |             after = datetime.strptime(after_entity.state, \"%H:%M:%S\").time()","lines":5,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/condition.py#L1871-L1875"},{"ref":"homeassistant/helpers/condition.py:1901-1905","code":" 1901 |         elif before_entity.domain == \"time\":\n 1902 |             try:\n 1903 |                 before = datetime.strptime(before_entity.state, \"%H:%M:%S\").time()\n 1904 |             except ValueError:\n 1905 |                 return False","lines":5,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/condition.py#L1901-L1905"}]},
{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `Debouncer._handle_timer_finish`, there is a bare `assert self._job is not None` at line 134. When `async_shutdown()` is called while a `_handle_timer_finish` task is already scheduled (created by `_on_debounce`), `async_shutdown` sets `self._job = None` but cannot cancel the already-created asyncio task. The task then runs and hits the `assert`, raising `AssertionError` inside a background task. Although background task failures are logged, the assert message gives no context and the failure silently swallows the shutdown intent.","fix":"Replace the assertion with an early-return guard that respects the shutdown state:\n\n```python\nasync def _handle_timer_finish(self) -> None:\n    if self._shutdown_requested or self._job is None:\n        return\n    ...\n```\n\nThis is consistent with how `_schedule_timer` (line 200-201) and `_async_schedule_or_call_now` (line 95-97) already check `_shutdown_requested`.","locations":[{"ref":"homeassistant/helpers/debounce.py:132-156","code":"  132 |     async def _handle_timer_finish(self) -> None:\n  133 |         \"\"\"Handle a finished timer.\"\"\"\n  134 |         assert self._job is not None\n  135 | \n  136 |         self._execute_at_end_of_timer = False\n  137 | \n  138 |         # Locked means a call is in progress. Any call is good, so abort.\n  139 |         if self._execute_lock.locked():\n  140 |             return\n  141 | \n  142 |         async with self.async_lock():\n  143 |             # Abort if timer got set while we're waiting for the lock.\n  144 |             if self._timer_task:\n  145 |                 return\n  146 | \n  147 |             try:\n  148 |                 if task := self.hass.async_run_hass_job(\n  149 |                     self._job, background=self._background\n  150 |                 ):\n  151 |                     await task\n  152 |             except Exception:\n  153 |                 self.logger.exception(\"Unexpected exception from %s\", self.function)\n  154 |             finally:\n  155 |                 # Schedule a new timer to prevent new runs during cooldown\n  156 |                 self._schedule_timer()","lines":25,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/debounce.py#L132-L156"}]},
{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `check_if_deprecated_constant` (deprecation.py), the guard `if value is None or replacement is None` is used to detect invalid deprecated-constant entries. However, `None` is a perfectly valid value for a deprecated constant (e.g., `DeprecatedConstant(value=None, replacement=\"use_X\", breaks_in_ha_version=None)`). When such a constant is accessed, the function incorrectly treats it as an unknown/invalid type, logs a debug message with a misleading error string, and raises `AttributeError` - silently breaking access to the constant and hiding the deprecation warning.","fix":"Use a sentinel rather than `None` to detect \"not set\":\n\n```python\n_UNSET = object()\nvalue: Any = _UNSET\nreplacement: str | None = None  # replacement is always str, never None in valid cases\n...\nif value is _UNSET or replacement is None:\n    ...\n```\n\nOr restructure the branches to use `else: raise` and remove the post-branch check entirely, since each branch always sets both `value` and `replacement`.","locations":[{"ref":"homeassistant/helpers/deprecation.py:347-380","code":"  347 |     value = replacement = None\n  348 |     description = \"constant\"\n  349 |     if (deprecated_const := module_globals.get(_PREFIX_DEPRECATED + name)) is None:\n  350 |         raise AttributeError(f\"Module {module_name!r} has no attribute {name!r}\")\n  351 |     if isinstance(deprecated_const, DeprecatedConstant):\n  352 |         value = deprecated_const.value\n  353 |         replacement = deprecated_const.replacement\n  354 |         breaks_in_ha_version = deprecated_const.breaks_in_ha_version\n  355 |     elif isinstance(deprecated_const, DeprecatedConstantEnum):\n  356 |         value = deprecated_const.enum\n  357 |         replacement = (\n  358 |             f\"{deprecated_const.enum.__class__.__name__}.{deprecated_const.enum.name}\"\n  359 |         )\n  360 |         breaks_in_ha_version = deprecated_const.breaks_in_ha_version\n  361 |     elif isinstance(deprecated_const, (DeprecatedAlias, DeferredDeprecatedAlias)):\n  362 |         description = \"alias\"\n  363 |         value = deprecated_const.value\n  364 |         replacement = deprecated_const.replacement\n  365 |         breaks_in_ha_version = deprecated_const.breaks_in_ha_version\n  366 | \n  367 |     if value is None or replacement is None:\n  368 |         msg = (\n  369 |             f\"Value of {_PREFIX_DEPRECATED}{name} is an instance of \"\n  370 |             f\"{type(deprecated_const)} but an instance of DeprecatedAlias, \"\n  371 |             \"DeferredDeprecatedAlias, DeprecatedConstant or DeprecatedConstantEnum \"\n  372 |             \"is required\"\n  373 |         )\n  374 | \n  375 |         logging.getLogger(module_name).debug(msg)\n  376 |         # PEP 562 -- Module __getattr__ and __dir__\n  377 |         # specifies that __getattr__ should raise AttributeError if the attribute is not\n  378 |         # found.\n  379 |         # https://peps.python.org/pep-0562/#specification\n  380 |         raise AttributeError(msg)","lines":34,"link":"https://github.com/home-assistant/core/blob/005d3fb369c3abf84a151c09d53f53cce27523d9/homeassistant/helpers/deprecation.py#L347-L380"}]},
{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In the migration to storage version 1.22 (entity_registry.py line 907), the condition `if old_minor_version < 22` also runs when `old_minor_version == 21`. Version 1.21 was a reverted migration that may have already written an `aliases_v2` field. The v1.22 migration unconditionally overwrites it with `[None, *entity['aliases']]`, discarding any v2 alias data already stored by v1.21. The reverted-v1.21 handling above (lines 885-905) restores original names but does not guard the alias field.","fix":"Inside the `old_minor_version < 22` block, skip setting `aliases_v2` if the key is already present in the entity dict: `entity.setdefault('aliases_v2', [None, *entity['aliases']])`.","locations":[{"ref":"homeassistant/helpers/entity_registry.py:923-954","code":"  923 |             if old_minor_version == 21:\n  924 |                 # Version 1.21 has been reverted.\n  925 |                 # It migrated entity names to the new format stored in `name_v2`\n  926 |                 # field, automatically stripping any device name prefix present.\n  927 |                 # The old name was stored in `name` field for backwards compatibility.\n  928 |                 # For users who already migrated to v1.21, we restore old names\n  929 |                 # but try to preserve any user renames made since that migration.\n  930 |                 device_registry = dr.async_get(self.hass)\n  931 | \n  932 |                 for entity in data[\"entities\"]:\n  933 |                     old_name = entity[\"name\"]\n  934 |                     name = entity.pop(\"name_v2\")\n  935 |                     if (\n  936 |                         (name != old_name)\n  937 |                         and (device_id := entity[\"device_id\"]) is not None\n  938 |                         and (device := device_registry.async_get(device_id)) is not None\n  939 |
