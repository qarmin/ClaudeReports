{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"glslang_program_link casts the raw `int messages` argument directly to EShMessages, but the public header documents this parameter as glslang_messages_t (see glslang_c_interface.h:275 '// glslang_messages_t'). Every other entry point (glslang_shader_parse/preprocess) translates glslang_messages_t through c_shader_messages(). This only works because the two enums currently share identical bit values; it is fragile and contradicts the documented contract.","fix":"Translate the messages through c_shader_messages: return (int)program->program->link((EShMessages)c_shader_messages((glslang_messages_t)messages)); and use a glslang_messages_t-typed parameter for clarity.","locations":[{"ref":"glslang/CInterface/glslang_c_interface.cpp:498-501","code":"  498 | GLSLANG_EXPORT int glslang_program_link(glslang_program_t* program, int messages)\n  499 | {\n  500 |     return (int)program->program->link((EShMessages)messages);\n  501 | }","lines":4,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/CInterface/glslang_c_interface.cpp#L498-L501"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"TWorklist exposes size() and empty() that read worklist without holding the mutex, while add()/remove() lock it. In multi-threaded mode (CompileShaders run on 16 threads) these unsynchronized reads of std::list are a data race. In practice size()/empty() are only called from the main thread before/after the worker threads run, but the class advertises thread-safety (the comment at StandAlone.cpp:1226 says 'TWorkList::remove is thread-safe') and these accessors silently are not.","fix":"Lock the mutex in size() and empty() as well (mutex must then be mutable / methods non-const-incompatible), or document that they are not thread-safe.","locations":[{"ref":"StandAlone/Worklist.h:77-85","code":"   77 |         int size()\n   78 |         {\n   79 |             return (int)worklist.size();\n   80 |         }\n   81 | \n   82 |         bool empty()\n   83 |         {\n   84 |             return worklist.empty();\n   85 |         }","lines":9,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/StandAlone/Worklist.h#L77-L85"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"snprintf is called with size argument 'sizeof(elementNumBuf)-1'. snprintf already guarantees null-termination within the supplied size, so subtracting 1 needlessly reduces the usable buffer by one byte (the standard idiom passes the full sizeof). Harmless here because '[%d]' is far shorter than 20, but it reflects a misunderstanding of the snprintf size contract and could truncate one extra char in a tighter buffer.","fix":"Pass sizeof(elementNumBuf) (not minus one) as the snprintf size.","locations":[{"ref":"glslang/HLSL/hlslParseHelper.cpp:1356-1357","code":" 1356 |         char elementNumBuf[20];  // sufficient for MAXINT\n 1357 |         snprintf(elementNumBuf, sizeof(elementNumBuf)-1, \"[%d]\", element);","lines":2,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/HLSL/hlslParseHelper.cpp#L1356-L1357"}]},
{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"pool_allocator exposes two max_size overloads: 'size_type max_size() const' and 'size_type max_size(int size) const'. The second takes a signed int divisor and divides (size_t)-1 by it; passing a non-positive 'size' yields division-by-zero or a meaningless huge value. It is a non-standard overload not used by STL containers and is a foot-gun in the public allocator interface.","fix":"Remove the non-standard max_size(int) overload; keep only the standard zero-argument max_size().","locations":[{"ref":"glslang/Include/PoolAlloc.h:317-318","code":"  317 |     size_type max_size() const { return static_cast<size_type>(-1) / sizeof(T); }\n  318 |     size_type max_size(int size) const { return static_cast<size_type>(-1) / size; }","lines":2,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/Include/PoolAlloc.h#L317-L318"}]},
{"id":"API_5","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"strncpy is used with the destination buffer size equal to the source length+1; since the buffer is allocated exactly cpp_str.length()+1 and the source is the same length, this works but strncpy provides no benefit over a plain memcpy/strcpy here and obscures intent. More importantly strncpy will not null-terminate if the count equals strlen without the +1; relying on the exact +1 is fragile. The result is also never freed by glslang itself (documented as caller's responsibility), which is fine but malloc failure is unchecked - a null return from malloc leads to strncpy writing to NULL.","fix":"Check malloc's return for null before copying; use memcpy(c_str, cpp_str.c_str(), cpp_str.length()+1) to copy including the terminator, which is clearer than strncpy.","locations":[{"ref":"glslang/ResourceLimits/resource_limits_c.cpp:45-51","code":"   45 | const char* glslang_default_resource_string(void)\n   46 | {\n   47 |     std::string cpp_str = GetDefaultTBuiltInResourceString();\n   48 |     char* c_str = (char*)malloc(cpp_str.length() + 1);\n   49 |     strncpy(c_str, cpp_str.c_str(), cpp_str.length() + 1);\n   50 |     return c_str;\n   51 | }","lines":7,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/ResourceLimits/resource_limits_c.cpp#L45-L51"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"Inside the BDA load/store alignment walk, for every struct/array index the code does a full linear scan of the entire `decorations` list via std::for_each (lines 333 and 346). For deeply-nested access chains in modules with many decorations this is O(indices * decorations) per load/store, repeated for every load/store instruction in the module.","fix":"Build a map keyed by (target id, member index, decoration kind) once before the instruction loop and look up decorations in O(1) instead of rescanning the whole decorations vector per index.","locations":[{"ref":"SPIRV/SpvPostProcess.cpp:313-354","code":"  313 |                 for (int i = 1; i < accessChain->getNumOperands(); ++i) {\n  314 |                     Instruction *idx = module.getInstruction(accessChain->getIdOperand(i));\n  315 |                     if (type->getOpCode() == Op::OpTypeStruct) {\n  316 |                         assert(idx->getOpCode() == Op::OpConstant);\n  317 |                         unsigned int c = idx->getImmediateOperand(0);\n  318 | \n  319 |                         const auto function = [&](const std::unique_ptr<Instruction>& decoration) {\n  320 |                             if (decoration.get()->getOpCode() == Op::OpMemberDecorate &&\n  321 |                                 decoration.get()->getIdOperand(0) == typeId &&\n  322 |                                 decoration.get()->getImmediateOperand(1) == c &&\n  323 |                                 (decoration.get()->getImmediateOperand(2) == Decoration::Offset ||\n  324 |                                  decoration.get()->getImmediateOperand(2) == Decoration::MatrixStride)) {\n  325 |                                 unsigned int opernad_value = decoration.get()->getImmediateOperand(3);\n  326 |                                 alignment |= opernad_value;\n  327 |                                 if (opernad_value == 0 &&\n  328 |                                     decoration.get()->getImmediateOperand(2) == Decoration::Offset) {\n  329 |                                     first_struct_elem = true;\n  330 |                                 }\n  331 |                             }\n  332 |                         };\n  333 |                         std::for_each(decorations.begin(), decorations.end(), function);\n  334 |                         // get the next member type\n  335 |                         typeId = type->getIdOperand(c);\n  336 |                         type = module.getInstruction(typeId);\n  337 |                     } else if (type->getOpCode() == Op::OpTypeArray ||\n  338 |                                type->getOpCode() == Op::OpTypeRuntimeArray) {\n  339 |                         const auto function = [&](const std::unique_ptr<Instruction>& decoration) {\n  340 |                             if (decoration.get()->getOpCode() == Op::OpDecorate &&\n  341 |                                 decoration.get()->getIdOperand(0) == typeId &&\n  342 |                                 decoration.get()->getImmediateOperand(1) == Decoration::ArrayStride) {\n  343 |                                 alignment |= decoration.get()->getImmediateOperand(2);\n  344 |                             }\n  345 |                         };\n  346 |                         std::for_each(decorations.begin(), decorations.end(), function);\n  347 |                         // Get the element type\n  348 |                         typeId = type->getIdOperand(0);\n  349 |                         type = module.getInstruction(typeId);\n  350 |                     } else {\n  351 |                         // Once we get to any non-aggregate type, we're done.\n  352 |                         break;\n  353 |                     }\n  354 |                 }","lines":42,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/SPIRV/SpvPostProcess.cpp#L313-L354"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In the EOpF16tof32 and EOpF32tof16 decompositions, 'node = result' (vector case) or 'node = lowOrder'/'node = packOp' (scalar case) is assigned inside the per-component for loop on every iteration. The assignment only needs to happen once after the loop; reassigning the same pointer each iteration is wasted work and obscures intent.","fix":"Move the 'node = result' assignment out of the loop (set it once after the loop, choosing result vs the single component based on vecSize).","locations":[{"ref":"glslang/HLSL/hlslParseHelper.cpp:5351-5356","code":" 5351 |                 if (result != nullptr) {\n 5352 |                     result->getSequence().push_back(lowOrder);\n 5353 |                     node = result;\n 5354 |                 } else {\n 5355 |                     node = lowOrder;\n 5356 |                 }","lines":6,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/HLSL/hlslParseHelper.cpp#L5351-L5356"},{"ref":"glslang/HLSL/hlslParseHelper.cpp:5406-5411","code":" 5406 |                 if (result != nullptr) {\n 5407 |                     result->getSequence().push_back(packOp);\n 5408 |                     node = result;\n 5409 |                 } else {\n 5410 |                     node = packOp;\n 5411 |                 }","lines":6,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/HLSL/hlslParseHelper.cpp#L5406-L5411"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"IsValid constructs a std::string from cname on every call (std::string name(cname)) solely to compare against a handful of fixed names. This is invoked in the innermost loop of prototype generation (for every arg type x dim0 x dim1 combination of every intrinsic), allocating/freeing a heap string each time. The comparisons could be done with strcmp on the const char* directly, avoiding the allocation.","fix":"Compare cname with strcmp() (e.g. strcmp(cname, \"normalize\")==0) instead of building a std::string, or hoist the name classification out of the inner loops.","locations":[{"ref":"glslang/HLSL/hlslParseables.cpp:334-348","code":"  334 | inline bool IsValid(const char* cname, char /* retOrder */, char /* retType */, char argOrder, char /* argType */, int dim0, int /* dim1 */)\n  335 | {\n  336 |     const bool isVec = (argOrder == 'V');\n  337 | \n  338 |     const std::string name(cname);\n  339 | \n  340 |     // these do not have vec1 versions\n  341 |     if (dim0 == 1 && (name == \"normalize\" || name == \"reflect\" || name == \"refract\"))\n  342 |         return false;\n  343 | \n  344 |     if (!IsTextureType(argOrder) && (isVec && dim0 == 1)) // avoid vec1\n  345 |         return false;\n  346 | \n  347 |     return true;\n  348 | }","lines":15,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/HLSL/hlslParseables.cpp#L334-L348"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"TConstUnionArray::clone() first constructs the copy via TConstUnionArray(size()), which allocates a TConstUnionVector sized to size() (all default-constructed elements), then push_back()s each source element onto that already-sized vector. The result is a vector of length 2*size() (size() defaults followed by size() copies), and the returned data is wrong as well as wasteful: indices [0,size()) are default TConstUnion values, not the source contents.","fix":"Construct the copy empty (e.g. via the default-size path) and reserve, or copy element-wise into the pre-sized array using assignment (copy->unionArray->at(i) = (*unionArray)[i]) instead of push_back. Simplest: rely on the defaulted copy constructor / assign *copy->unionArray = *unionArray.","locations":[{"ref":"glslang/Include/ConstantUnion.h:902-911","code":"  902 |     TConstUnionArray* clone() const\n  903 |     {\n  904 |         TConstUnionArray *copy = new TConstUnionArray(size());\n  905 |         if (unionArray) {\n  906 |             for (const auto i : *unionArray) {\n  907 |                 copy->unionArray->push_back(i);\n  908 |             }\n  909 |         }\n  910 |         return copy;\n  911 |     }","lines":10,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/Include/ConstantUnion.h#L902-L911"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"TIntermAggregate::updatePrecision and TIntermTyped::propagatePrecision copy the entire sequence vector by value (`TIntermSequence operands = getSequence();`) only to iterate over it read-only. TIntermSequence is TVector<TIntermNode*>, so this allocates and copies the whole pointer vector on every call during precision propagation, which runs over the full AST.","fix":"Use a const reference: `const TIntermSequence& operands = getSequence();` in both functions.","locations":[{"ref":"glslang/MachineIndependent/Intermediate.cpp:3908","code":" 3908 |         TIntermSequence operands = getSequence();","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/Intermediate.cpp#L3908"},{"ref":"glslang/MachineIndependent/Intermediate.cpp:3971","code":" 3971 |         TIntermSequence operands = aggregateNode->getSequence();","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/Intermediate.cpp#L3971"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"mergeImplicitArraySizes(TInfoSink&, TIntermediate&) recomputes work redundantly: mergeLinkerObjects already calls mergeImplicitArraySizes(symbol's type, unit type) for every matched symbol pair. The standalone double loop here re-walks all linker-object pairs (O(n*m)) and calls isSameSymbol + mergeImplicitArraySizes again for uniform/buffer symbols, duplicating logic already performed during normal merge for the same matched pairs.","fix":"Confirm whether this pass is still needed given mergeLinkerObjects already merges implicit array sizes; if it only covers cross-stage uniforms, document that, otherwise remove the duplicated traversal.","locations":[{"ref":"glslang/MachineIndependent/linkValidate.cpp:156-183","code":"  156 | void TIntermediate::mergeImplicitArraySizes(TInfoSink&, TIntermediate& unit) {\n  157 |     if (unit.treeRoot == nullptr || treeRoot == nullptr)\n  158 |         return;\n  159 | \n  160 |     // Get the linker-object lists\n  161 |     TIntermSequence& linkerObjects = findLinkerObjects()->getSequence();\n  162 |     TIntermSequence unitLinkerObjects = unit.findLinkerObjects()->getSequence();\n  163 | \n  164 |     // filter unitLinkerObjects to only contain uniforms\n  165 |     auto end = std::remove_if(unitLinkerObjects.begin(), unitLinkerObjects.end(),\n  166 |         [](TIntermNode* node) {return node->getAsSymbolNode()->getQualifier().storage != EvqUniform &&\n  167 |                                       node->getAsSymbolNode()->getQualifier().storage != EvqBuffer; });\n  168 |     unitLinkerObjects.resize(end - unitLinkerObjects.begin());\n  169 | \n  170 |     std::size_t initialNumLinkerObjects = linkerObjects.size();\n  171 |     for (unsigned int unitLinkObj = 0; unitLinkObj < unitLinkerObjects.size(); ++unitLinkObj) {\n  172 |         for (std::size_t linkObj = 0; linkObj < initialNumLinkerObjects; ++linkObj) {\n  173 |             TIntermSymbol* symbol = linkerObjects[linkObj]->getAsSymbolNode();\n  174 |             TIntermSymbol* unitSymbol = unitLinkerObjects[unitLinkObj]->getAsSymbolNode();\n  175 |             assert(symbol && unitSymbol);\n  176 | \n  177 |             if (isSameSymbol(symbol, unitSymbol)) {\n  178 |                 // Update implicit array sizes\n  179 |                 mergeImplicitArraySizes(symbol->getWritableType(), unitSymbol->getType());\n  180 |             }\n  181 |         }\n  182 |     }\n  183 | }","lines":28,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/linkValidate.cpp#L156-L183"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"getSubAccessChainAfterPrefix uses chain.find(prefix) (an O(n*m) substring search over the whole chain) only to test whether prefix occurs at position 0. Since callers already establish prefix as a position-0 prefix, the full search is wasted work; a prefix comparison (chain.compare(0, prefix.length(), prefix)) or rfind(prefix, 0) expresses the intent and avoids scanning the rest of the string.","fix":"Replace 'size_t pos = chain.find(prefix); if (pos != 0) return chain;' with 'if (chain.compare(0, prefix.length(), prefix) != 0) return chain;'.","locations":[{"ref":"glslang/MachineIndependent/propagateNoContraction.cpp:223-230","code":"  223 | ObjectAccessChain getSubAccessChainAfterPrefix(const ObjectAccessChain& chain,\n  224 |                                                const ObjectAccessChain& prefix)\n  225 | {\n  226 |     size_t pos = chain.find(prefix);\n  227 |     if (pos != 0)\n  228 |         return chain;\n  229 |     return chain.substr(prefix.length() + sizeof(ObjectAccesschainDelimiter));\n  230 | }","lines":8,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/propagateNoContraction.cpp#L223-L230"}]},
{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"addBlockName does a redundant double hash lookup: it computes `it = reflection.nameToIndex.find(name.c_str())` and then immediately calls `reflection.nameToIndex.find(name.c_str())` a second time in the if-condition instead of reusing `it`. The first iterator is only used in the else branch. The second find is pure wasted work on every block-name insertion.","fix":"Reuse the iterator: `if (it == reflection.nameToIndex.end()) { ... } else { blockIndex = it->second; ... }` and drop the duplicate find().","locations":[{"ref":"glslang/MachineIndependent/reflection.cpp:651-652","code":"  651 |             TReflection::TNameToIndex::const_iterator it = reflection.nameToIndex.find(name.c_str());\n  652 |             if (reflection.nameToIndex.find(name.c_str()) == reflection.nameToIndex.end()) {","lines":2,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/reflection.cpp#L651-L652"}]},
{"id":"PERF_9","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"GetSuffix computes name.rfind('.') twice: once stored into pos and again inline in the return expression. Redundant scan of the string.","fix":"Reuse pos: return (pos == std::string::npos) ? \"\" : name.substr(pos + 1);","locations":[{"ref":"gtests/TestFixture.cpp:174-178","code":"  174 | std::string GetSuffix(const std::string& name)\n  175 | {\n  176 |     const size_t pos = name.rfind('.');\n  177 |     return (pos == std::string::npos) ? \"\" : name.substr(name.rfind('.') + 1);\n  178 | }","lines":5,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/gtests/TestFixture.cpp#L174-L178"}]},
{"id":"PERF_10","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"In tokenPaste's inner combining loop, strlen(ppToken.name) is recomputed up to three times per pasted token (the length check on line 1414 and twice in the snprintf call on line 1418). For long accumulated paste results this is repeated O(n) scanning of the same string. Minor, but trivially avoidable.","fix":"Compute `size_t curLen = strlen(ppToken.name);` once and reuse it for both the bounds check and the snprintf offset/size arguments.","locations":[{"ref":"glslang/MachineIndependent/preprocessor/PpScanner.cpp:1472-1477","code":" 1472 |             if (strlen(ppToken.name) + strlen(pastedPpToken.name) > MaxTokenLength) {\n 1473 |                 parseContext.ppError(ppToken.loc, \"combined tokens are too long\", \"##\", \"\");\n 1474 |                 return resultToken;\n 1475 |             }\n 1476 |             snprintf(&ppToken.name[0] + strlen(ppToken.name), sizeof(ppToken.name) - strlen(ppToken.name),\n 1477 |                 \"%s\", pastedPpToken.name);","lines":6,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/preprocessor/PpScanner.cpp#L1472-L1477"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"medium","difficulty":"medium","description":"The multi-threaded thread-creation failure check is ineffective. std::thread's constructor either successfully starts the thread (in which case get_id() is never the default-constructed std::thread::id()) or throws std::system_error on failure - it never returns a started thread object whose id equals the default id. Therefore the 'if (threads[t].get_id() == std::thread::id())' branch returning EFailThreadCreate is unreachable dead code, and an actual thread-spawn failure throws an uncaught exception that terminates the process instead of returning the intended EFailThreadCreate code.","fix":"Wrap the std::thread construction loop in try/catch on std::system_error and return EFailThreadCreate from the catch, or document that spawn failure is fatal. Remove the dead get_id() comparison.","locations":[{"ref":"StandAlone/StandAlone.cpp:1801-1807","code":" 1801 |             for (unsigned int t = 0; t < threads.size(); ++t) {\n 1802 |                 threads[t] = std::thread(CompileShaders, std::ref(workList));\n 1803 |                 if (threads[t].get_id() == std::thread::id()) {\n 1804 |                     fprintf(stderr, \"Failed to create thread\\n\");\n 1805 |                     return EFailThreadCreate;\n 1806 |                 }\n 1807 |             }","lines":7,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/StandAlone/StandAlone.cpp#L1801-L1807"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"medium","difficulty":"easy","description":"In findSubtreeOffset(const TIntermNode&), the function unconditionally returns the result of findSubtreeOffset(type, subset, offsets). The following do/while(true) loop is unreachable dead code. Worse, were it ever reached it is an infinite loop with no exit condition (the body only reassigns 'subset' and loops forever), which also makes the intent of the code unclear to maintainers.","fix":"Delete the unreachable do/while(true) block at lines 1448-1450 so the function ends after the return statement.","locations":[{"ref":"glslang/HLSL/hlslParseHelper.cpp:1446-1451","code":" 1446 |     return findSubtreeOffset(sym->getType(), subset, flattenData->second.offsets);\n 1447 | \n 1448 |     do {\n 1449 |         subset = flattenData->second.offsets[subset];\n 1450 |     } while (true);\n 1451 | }","lines":6,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/HLSL/hlslParseHelper.cpp#L1446-L1451"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"Inside the EOpLessThan/.../EOpVectorNotEqual case, binOp is already set to node->getOp() on the line above, then an inner switch reassigns binOp. Every arm of that inner switch (the two explicit cases and the default) assigns exactly node->getOp() / the same enum value, so the switch is a no-op that produces the identical result it started with. It is pure dead code that obscures intent.","fix":"Delete the inner switch; keep only 'binOp = node->getOp();'.","locations":[{"ref":"SPIRV/GlslangToSpv.cpp:3925-3931","code":" 3925 |         binOp = node->getOp();\n 3926 |         reduceComparison = false;\n 3927 |         switch (node->getOp()) {\n 3928 |         case glslang::EOpVectorEqual:     binOp = glslang::EOpVectorEqual;      break;\n 3929 |         case glslang::EOpVectorNotEqual:  binOp = glslang::EOpVectorNotEqual;   break;\n 3930 |         default:                          binOp = node->getOp();                break;\n 3931 |         }","lines":7,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/SPIRV/GlslangToSpv.cpp#L3925-L3931"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"SpirvStream::getOpCode(int id) is declared and defined but never called anywhere in the file. It also indexes idInstruction[id] and stream[idInstruction[id]] with no bounds check on id, so if it were ever used with an out-of-range id it would be unsafe. It is currently pure dead code.","fix":"Remove the unused getOpCode method (or add bounds checking and an actual caller if it is intended to be used).","locations":[{"ref":"SPIRV/disassemble.cpp:101","code":"  101 |     Op getOpCode(int id) const { return idInstruction[id] ? (Op)(stream[idInstruction[id]] & OpCodeMask) : Op::OpNop; }","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/SPIRV/disassemble.cpp#L101"}]},
{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"OperandLiteralNumber/ExtInst handling sets extInstSet = OpenCLExtInst for both \"OpenCL.std\" and \"OpenCL.DebugInfo.100\", but the subsequent if/else-if chain that prints the entrypoint name (lines 567-582) has no branch for OpenCLExtInst. So the classification is computed but never used: OpenCL extended-instruction calls get no name annotation. Either the OpenCL branch is missing, or assigning OpenCLExtInst is pointless work.","fix":"Add an `else if (extInstSet == OpenCLExtInst)` branch that prints an OpenCL instruction name, or remove the dead OpenCLExtInst assignments if OpenCL naming is intentionally unsupported.","locations":[{"ref":"SPIRV/disassemble.cpp:564-567","code":"  564 |                 if (strcmp(\"OpenCL.std\", name) == 0) {\n  565 |                     extInstSet = OpenCLExtInst;\n  566 |                 } else if (strcmp(\"OpenCL.DebugInfo.100\", name) == 0) {\n  567 |                     extInstSet = OpenCLExtInst;","lines":4,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/SPIRV/disassemble.cpp#L564-L567"},{"ref":"SPIRV/disassemble.cpp:589-604","code":"  589 |                 if (extInstSet == GLSL450Inst) {\n  590 |                     if (entrypoint < GLSLstd450Count) {\n  591 |                         out << \"(\" << GlslStd450DebugNames[entrypoint] << \")\";\n  592 |                     }\n  593 |                 } else if (extInstSet == GLSLextAMDInst) {\n  594 |                     out << \"(\" << GLSLextAMDGetDebugNames(name, entrypoint) << \")\";\n  595 |                 }\n  596 |                 else if (extInstSet == GLSLextNVInst) {\n  597 |                     out << \"(\" << GLSLextNVGetDebugNames(name, entrypoint) << \")\";\n  598 |                 } else if (extInstSet == NonSemanticDebugPrintfExtInst) {\n  599 |                     out << \"(DebugPrintf)\";\n  600 |                 } else if (extInstSet == NonSemanticDebugBreakExtInst) {\n  601 |                     out << \"(DebugBreak)\";\n  602 |                 } else if (extInstSet == NonSemanticShaderDebugInfo) {\n  603 |                     out << \"(\" << NonSemanticShaderDebugInfoGetDebugNames(entrypoint) << \")\";\n  604 |                 }","lines":16,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/SPIRV/disassemble.cpp#L589-L604"}]},
{"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In getUnbiasedNormalizedExponent the denorm branch computes 'significand_bits &= fraction_encode_mask;' as the last statement of the if-block, but significand_bits is a local that is never read afterwards (the function returns exp). The masking is a dead store.","fix":"Remove the dead 'significand_bits &= fraction_encode_mask;' line, or restructure if the masking was intended to affect a returned value.","locations":[{"ref":"SPIRV/hex_float.h:605-613","code":"  605 |     if (exp == min_exponent) {  // We are in denorm land.\n  606 |       uint_type significand_bits = getSignificandBits();\n  607 |       while ((significand_bits & (first_exponent_bit >> 1)) == 0) {\n  608 |         significand_bits = static_cast<uint_type>(significand_bits << 1);\n  609 |         exp = static_cast<int_type>(exp - 1);\n  610 |       }\n  611 |       significand_bits &= fraction_encode_mask;\n  612 |     }\n  613 |     return exp;","lines":9,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/SPIRV/hex_float.h#L605-L613"}]},
{"id":"DEAD_7","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"redeclareBuiltinVariable() unconditionally returns nullptr: the guarded branch 'if (!builtInName(identifier) || ...) return nullptr;' and the fall-through both return nullptr, and builtInName() is hard-coded to always return false. The entire function body is effectively dead; the guard and parameters are misleading, suggesting redeclaration logic that does not exist.","fix":"Either remove the unreachable guard and just 'return nullptr;', or document explicitly that HLSL never redeclares built-in variables so the function is intentionally a no-op.","locations":[{"ref":"glslang/HLSL/hlslParseHelper.cpp:7045-7053","code":" 7045 | TSymbol* HlslParseContext::redeclareBuiltinVariable(const TSourceLoc& /*loc*/, const TString& identifier,\n 7046 |                                                     const TQualifier& /*qualifier*/,\n 7047 |                                                     const TShaderQualifiers& /*publicType*/)\n 7048 | {\n 7049 |     if (! builtInName(identifier) || symbolTable.atBuiltInLevel() || ! symbolTable.atGlobalLevel())\n 7050 |         return nullptr;\n 7051 | \n 7052 |     return nullptr;\n 7053 | }","lines":9,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/HLSL/hlslParseHelper.cpp#L7045-L7053"},{"ref":"glslang/HLSL/hlslParseHelper.cpp:6613-6616","code":" 6613 | bool HlslParseContext::builtInName(const TString& /*identifier*/)\n 6614 | {\n 6615 |     return false;\n 6616 | }","lines":4,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/HLSL/hlslParseHelper.cpp#L6613-L6616"}]},
{"id":"DEAD_8","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"FindVectorMatrixBounds takes dim1Min by reference but the parameter is commented out / never written, and dim0Min is only written via the fixedVecSize path. The function writes dim1Max only for matrices and never lowers dim1Min, relying entirely on the caller pre-initializing the four locals to 1. This implicit contract (only ever raises maxima, never sets minima except for fixed vectors) is undocumented and brittle: passing uninitialized locals would silently produce garbage loop bounds.","fix":"Either document that the function only raises the *Max bounds and requires callers to pre-initialize all bounds to 1, or initialize dim0Min/dim0Max/dim1Min/dim1Max inside the function itself instead of relying on the caller.","locations":[{"ref":"glslang/HLSL/hlslParseables.cpp:369-383","code":"  369 | inline void FindVectorMatrixBounds(const char* argOrder, int fixedVecSize, int& dim0Min, int& dim0Max, int& /*dim1Min*/, int& dim1Max)\n  370 | {\n  371 |     for (int arg = 0; ; ++arg) {\n  372 |         const char* nthArgOrder(NthArg(argOrder, arg));\n  373 |         if (nthArgOrder == nullptr)\n  374 |             break;\n  375 |         else if (*nthArgOrder == 'V' || IsSubpassInput(*nthArgOrder))\n  376 |             dim0Max = 4;\n  377 |         else if (*nthArgOrder == 'M')\n  378 |             dim0Max = dim1Max = 4;\n  379 |     }\n  380 | \n  381 |     if (fixedVecSize > 0) // handle fixed sized vectors\n  382 |         dim0Min = dim0Max = fixedVecSize;\n  383 | }","lines":15,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/HLSL/hlslParseables.cpp#L369-L383"}]},
{"id":"DEAD_9","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"getTypeRank() only handles the integer basic types (8/16/32/64-bit signed and unsigned) and asserts(false) for everything else, including all float types. If it is ever called for a float type (EbtFloat, EbtDouble, EbtFloat16, etc.) it asserts in debug and returns -1 in release. The function name suggests a general type-rank query but it silently only ranks integers; callers handling mixed int/float promotion could get -1 unexpectedly.","fix":"Either rename to getIntTypeRank to make the integer-only contract explicit, or extend the switch to cover float types if rank comparisons across int and float are expected.","locations":[{"ref":"glslang/Include/BaseTypes.h:708-733","code":"  708 | __inline int getTypeRank(TBasicType type)\n  709 | {\n  710 |     int res = -1;\n  711 |     switch(type) {\n  712 |     case EbtInt8:\n  713 |     case EbtUint8:\n  714 |         res = 0;\n  715 |         break;\n  716 |     case EbtInt16:\n  717 |     case EbtUint16:\n  718 |         res = 1;\n  719 |         break;\n  720 |     case EbtInt:\n  721 |     case EbtUint:\n  722 |         res = 2;\n  723 |         break;\n  724 |     case EbtInt64:\n  725 |     case EbtUint64:\n  726 |         res = 3;\n  727 |         break;\n  728 |     default:\n  729 |         assert(false);\n  730 |         break;\n  731 |     }\n  732 |     return res;\n  733 | }","lines":26,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/Include/BaseTypes.h#L708-L733"}]},
{"id":"DEAD_10","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"TInfoSinkBase::prefix has a 'default' case appending 'UNKNOWN ERROR: ', but TPrefixType is a plain enum with all six enumerators already handled by explicit cases. The default branch is unreachable for any valid TPrefixType value and only masks a genuinely invalid (out-of-range) argument as 'UNKNOWN ERROR' rather than surfacing it.","fix":"Either drop the default (and rely on -Wswitch to catch new enumerators) or keep it but document that it intentionally handles corrupted/out-of-range values.","locations":[{"ref":"glslang/Include/InfoSink.h:89-99","code":"   89 |     void prefix(TPrefixType message) {\n   90 |         switch(message) {\n   91 |         case EPrefixNone:                                      break;\n   92 |         case EPrefixWarning:       append(\"WARNING: \");        break;\n   93 |         case EPrefixError:         append(\"ERROR: \");          break;\n   94 |         case EPrefixInternalError: append(\"INTERNAL ERROR: \"); break;\n   95 |         case EPrefixUnimplemented: append(\"UNIMPLEMENTED: \");  break;\n   96 |         case EPrefixNote:          append(\"NOTE: \");           break;\n   97 |         default:                   append(\"UNKNOWN ERROR: \");   break;\n   98 |         }\n   99 |     }","lines":11,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/Include/InfoSink.h#L89-L99"}]},
{"id":"DEAD_11","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"This else-if branch tests (profile != EEsProfile) but it is nested inside 'if (profile == EEsProfile)' at line 9130, so the condition can never be true. The intended core-profile tagging of 'fma' with AEP_core_gpu_shader5 is dead code and never executed here.","fix":"Move the non-ES 'fma' branch outside the 'profile == EEsProfile' block, or remove the unreachable else-if.","locations":[{"ref":"glslang/MachineIndependent/Initialize.cpp:9310-9314","code":" 9310 |             if (version == 310) {\n 9311 |                 symbolTable.setFunctionExtensions(\"fma\", Num_AEP_gpu_shader5, AEP_gpu_shader5);\n 9312 |             } else if (profile != EEsProfile && version >= 150) {\n 9313 |                 symbolTable.setFunctionExtensions(\"fma\", Num_AEP_core_gpu_shader5, AEP_core_gpu_shader5);\n 9314 |             }","lines":5,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/Initialize.cpp#L9310-L9314"}]},
{"id":"DEAD_12","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"In TScanContext::tokenize the local 'int token = pp->tokenize(ppToken);' shadows the function parameter 'TParserToken& token'. The parameter is only used once (parserToken = &token) at the top of the loop before the shadow is introduced, then every later reference to 'token' is the int. The shadowing is legal but error-prone: a future edit that tries to touch the TParserToken inside the switch would silently bind to the int instead.","fix":"Rename the inner int (e.g. 'int ppTokenType = pp->tokenize(ppToken);') to remove the shadow.","locations":[{"ref":"glslang/MachineIndependent/Scan.cpp:858-867","code":"  858 | int TScanContext::tokenize(TPpContext* pp, TParserToken& token)\n  859 | {\n  860 |     do {\n  861 |         parserToken = &token;\n  862 |         TPpToken ppToken;\n  863 |         int token = pp->tokenize(ppToken);\n  864 |         if (token == EndOfInput)\n  865 |             return 0;\n  866 | \n  867 |         tokenText = ppToken.name;","lines":10,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/Scan.cpp#L858-L867"}]},
{"id":"DEAD_13","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"SourceLineSynchronizer declares a private 'operator=' with no definition (line 1062) and also has the intended deleted copy-ctor / assignment commented out (lines 1025-1026). The class holds a 'const std::function<int()>' member, so it is already non-assignable; the dead private declaration and the commented-out deletes are leftover noise that obscure the actual copyability contract.","fix":"Remove the commented-out lines and either delete the unused private operator= declaration or replace all of it with explicit '= delete' copy-ctor/assignment.","locations":[{"ref":"glslang/MachineIndependent/ShaderLang.cpp:1025-1026","code":" 1025 | //    SourceLineSynchronizer(const SourceLineSynchronizer&) = delete;\n 1026 | //    SourceLineSynchronizer& operator=(const SourceLineSynchronizer&) = delete;","lines":2,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/ShaderLang.cpp#L1025-L1026"},{"ref":"glslang/MachineIndependent/ShaderLang.cpp:1062","code":" 1062 |     SourceLineSynchronizer& operator=(const SourceLineSynchronizer&);","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/ShaderLang.cpp#L1062"}]},
{"id":"DEAD_14","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In TSymbolTableLevel::clone(), retargetedSymbols.clear() is called on a freshly constructed TSymbolTableLevel whose retargetedSymbols vector is already empty. The clear() is dead/redundant.","fix":"Remove the redundant symTableLevel->retargetedSymbols.clear(); line.","locations":[{"ref":"glslang/MachineIndependent/SymbolTable.cpp:478-481","code":"  478 |     TSymbolTableLevel *symTableLevel = new TSymbolTableLevel();\n  479 |     symTableLevel->anonId = anonId;\n  480 |     symTableLevel->thisLevel = thisLevel;\n  481 |     symTableLevel->retargetedSymbols.clear();","lines":4,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/SymbolTable.cpp#L478-L481"}]},
{"id":"DEAD_15","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In TAttributeArgs::getConstUnion, constVal is initialized as &(...getConstArray()[0]), i.e. the address of an array element, which can never be null; the subsequent `constVal == nullptr` test is dead. Worse, it masks the real hazard: if the constant union array is empty, getConstArray()[0] is an out-of-bounds vector access (operator[] on an empty TConstUnionVector) rather than a checked failure.","fix":"Drop the impossible null check and instead guard the size: if (constUnionNode->getConstArray().size() == 0) return nullptr; before indexing [0], then test only constVal->getType() != basicType.","locations":[{"ref":"glslang/MachineIndependent/attribute.cpp:89-94","code":"   89 |     if (args->getSequence()[argNum]->getAsConstantUnion() == nullptr)\n   90 |         return nullptr;\n   91 | \n   92 |     const TConstUnion* constVal = &args->getSequence()[argNum]->getAsConstantUnion()->getConstArray()[0];\n   93 |     if (constVal == nullptr || constVal->getType() != basicType)\n   94 |         return nullptr;","lines":6,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/attribute.cpp#L89-L94"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"In the generic binary-op path of visitBinary, the two comments are swapped relative to the code: the block labeled 'get right operand' traverses and loads node->getLeft() (the left operand), and the block labeled 'get left operand' traverses and loads node->getRight(). The code order (left then right) is correct; the comments are misleading and could trick a future maintainer into 'fixing' the evaluation order, which GLSL requires to be left-before-right.","fix":"Swap the two comments so 'get left operand' precedes the getLeft() block and 'get right operand' precedes the getRight() block.","locations":[{"ref":"SPIRV/GlslangToSpv.cpp:2820-2828","code":" 2820 |     // get right operand\n 2821 |     builder.clearAccessChain();\n 2822 |     node->getLeft()->traverse(this);\n 2823 |     spv::Id left = accessChainLoad(node->getLeft()->getType());\n 2824 | \n 2825 |     // get left operand\n 2826 |     builder.clearAccessChain();\n 2827 |     node->getRight()->traverse(this);\n 2828 |     spv::Id right = accessChainLoad(node->getRight()->getType());","lines":9,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/SPIRV/GlslangToSpv.cpp#L2820-L2828"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"OutputSpvHex writes the leading comment by streaming GetSpirvGeneratorVersion() directly adjacent to GLSLANG_VERSION_MAJOR with no separator: `out << GetSpirvGeneratorVersion() << GLSLANG_VERSION_MAJOR << \".\" << ...`. With generator version 11 and e.g. major version 15 this emits a garbled token like `1115.x.y` in the generated header comment, conflating two distinct numbers. The generator version is also not labelled. The comment is misleading/incorrect.","fix":"Insert a separator/label, e.g. `out << \"\\t// Generator version \" << GetSpirvGeneratorVersion() << \", glslang \" << GLSLANG_VERSION_MAJOR << \".\" << GLSLANG_VERSION_MINOR << \".\" << GLSLANG_VERSION_PATCH << GLSLANG_VERSION_FLAVOR << std::endl;`.","locations":[{"ref":"SPIRV/GlslangToSpv.cpp:12864-12867","code":"12864 |     out << \"\\t// \" <<\n12865 |         GetSpirvGeneratorVersion() <<\n12866 |         GLSLANG_VERSION_MAJOR << \".\" << GLSLANG_VERSION_MINOR << \".\" << GLSLANG_VERSION_PATCH <<\n12867 |         GLSLANG_VERSION_FLAVOR << std::endl;","lines":4,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/SPIRV/GlslangToSpv.cpp#L12864-L12867"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"makeArrayType has a header comment 'TODO: performance: track arrays per stride' and the dedup logic skips any type recorded in explicitlyLaidOut. Because every strided array is inserted into explicitlyLaidOut and never reused, strided arrays are always rebuilt; the comment understates that reuse is fully disabled for them rather than merely unoptimized. Minor: clarify intent so future readers do not assume some stride-aware caching already exists.","fix":"Update the comment to state that strided (explicitlyLaidOut) array types are intentionally never deduplicated, and that only stride==0 arrays are cached.","locations":[{"ref":"SPIRV/SpvBuilder.cpp:753-768","code":"  753 | // TODO: performance: track arrays per stride\n  754 | // If a stride is supplied (non-zero) make an array.\n  755 | // If no stride (0), reuse previous array types.\n  756 | // 'size' is an Id of a constant or specialization constant of the array size\n  757 | Id Builder::makeArrayType(Id element, Id sizeId, int stride)\n  758 | {\n  759 |     Instruction* type;\n  760 |     if (stride == 0) {\n  761 |         // try to find existing type\n  762 |         for (int t = 0; t < (int)groupedTypes[enumCast(Op::OpTypeArray)].size(); ++t) {\n  763 |             type = groupedTypes[enumCast(Op::OpTypeArray)][t];\n  764 |             if (type->getIdOperand(0) == element &&\n  765 |                 type->getIdOperand(1) == sizeId &&\n  766 |                 explicitlyLaidOut.find(type->getResultId()) == explicitlyLaidOut.end())\n  767 |                 return type->getResultId();\n  768 |         }","lines":16,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/SPIRV/SpvBuilder.cpp#L753-L768"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"Typo in fallback comment: 'godo alignment' should be 'good alignment'. Also the variable name 'opernad_value' (line 325) is a typo for 'operand_value'. Minor but reader-facing.","fix":"Fix the spelling: 'good alignment'; rename opernad_value to operand_value.","locations":[{"ref":"SPIRV/SpvPostProcess.cpp:406","code":"  406 |                         alignment = 16; // fallback if can't determine a godo alignment","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/SPIRV/SpvPostProcess.cpp#L406"},{"ref":"SPIRV/SpvPostProcess.cpp:325-326","code":"  325 |                                 unsigned int opernad_value = decoration.get()->getImmediateOperand(3);\n  326 |                                 alignment |= opernad_value;","lines":2,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/SPIRV/SpvPostProcess.cpp#L325-L326"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"BuiltInString returns \"BuiltInWarpMaxIDARM\" for BuiltIn::WarpMaxIDARM, i.e. it prefixes the value with \"BuiltIn\" while the sibling ARM built-ins (CoreCountARM, CoreIDARM, CoreMaxIDARM, WarpIDARM) all return their bare names. spirv.hpp11 names it \"WarpMaxIDARM\". The stray \"BuiltIn\" prefix is a copy-paste artifact and yields an inconsistent disassembly string.","fix":"Return \"WarpMaxIDARM\".","locations":[{"ref":"SPIRV/doc.cpp:507","code":"  507 |     case (int)BuiltIn::WarpMaxIDARM:           return \"BuiltInWarpMaxIDARM\";","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/SPIRV/doc.cpp#L507"}]},
{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"The local variable named 'max_exponent' here holds the biased all-ones exponent field value (SetBits over num_exponent_bits, e.g. 255 for float), which is the maximum encoded exponent field, not the unbiased maximum exponent. It also shadows the class static member 'max_exponent' which is the unbiased maximum exponent (different value). The reused name is misleading and easy to misread when auditing the overflow/clamp logic.","fix":"Rename the local to e.g. 'max_exponent_field' or 'all_ones_exponent' to avoid shadowing the class static and to reflect that it is the encoded exponent field, not an unbiased exponent.","locations":[{"ref":"SPIRV/hex_float.h:1266-1286","code":" 1266 |   const int_type max_exponent =\n 1267 |       SetBits<uint_type, 0, HF::num_exponent_bits>::get;\n 1268 | \n 1269 |   // Handle actual denorm numbers\n 1270 |   while (exponent < 0 && !is_zero) {\n 1271 |     fraction = static_cast<uint_type>(fraction >> 1);\n 1272 |     exponent = static_cast<int_type>(exponent + 1);\n 1273 | \n 1274 |     fraction &= HF::fraction_encode_mask;\n 1275 |     if (fraction == 0) {\n 1276 |       // We have underflowed our fraction. We should clamp to zero.\n 1277 |       is_zero = true;\n 1278 |       exponent = 0;\n 1279 |     }\n 1280 |   }\n 1281 | \n 1282 |   // We have overflowed so we should be inf/-inf.\n 1283 |   if (exponent > max_exponent) {\n 1284 |     exponent = max_exponent;\n 1285 |     fraction = 0;\n 1286 |   }","lines":21,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/SPIRV/hex_float.h#L1266-L1286"}]},
{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"usage() documents '--set-block-backing name {uniform | buffer | push_constant}' but the actual parsed option is '--set-block-storage' / '--sbs' (see ProcessBlockStorage dispatch at lines 787-789). There is no '--set-block-backing' option; the help text names a flag that does not exist and omits the real one.","fix":"Change the usage text to '--set-block-storage | --sbs name {uniform | buffer | push_constant}'.","locations":[{"ref":"StandAlone/StandAlone.cpp:2147-2153","code":" 2147 |            \"  --set-block-backing name {uniform | buffer | push_constant}\\n\"\n 2148 |            \"                                    changes the backing type of a uniform,\\n\"\n 2149 |            \"                                    buffer, or push_constant block declared in\\n\"\n 2150 |            \"                                    the program when using the -R option; this\\n\"\n 2151 |            \"                                    can be used to change the backing for\\n\"\n 2152 |            \"                                    existing blocks as well as implicit ones\\n\"\n 2153 |            \"                                    such as 'gl_DefaultUniformBlock'\\n\"","lines":7,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/StandAlone/StandAlone.cpp#L2147-L2153"},{"ref":"StandAlone/StandAlone.cpp:788-790","code":"  788 |                     } else if (lowerword == \"set-block-storage\" ||\n  789 |                                lowerword == \"sbs\") {\n  790 |                         ProcessBlockStorage(argc, argv, blockStorageOverrides);","lines":3,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/StandAlone/StandAlone.cpp#L788-L790"}]},
{"id":"CMT_8","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"Typo in comment: 'wwe don't know what to do with it.' should be 'we'.","fix":"Fix 'wwe' to 'we' in the comment.","locations":[{"ref":"glslang/HLSL/hlslParseHelper.cpp:3986","code":" 3986 |                 // wwe don't know what to do with it.  This algorithm could be generalized to handle","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/HLSL/hlslParseHelper.cpp#L3986"}]},
{"id":"CMT_9","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"EShLangAll is defined as EShLanguageMask(EShLangCount - 1). The comment and surrounding code treat this as an all-stages bitmask, but EShLangCount has grown to 15 (ray tracing / mesh / task stages added since this code was written), so EShLangCount-1 == 14 == 0b1110, which is NOT an all-ones mask: it leaves the Vertex bit (bit 0) and the Fragment/Compute/RT/mesh bits clear. It currently still works only because every specific stage mask was also set to EShLangAll and routing relies on the 'intrinsic.stage == EShLangAll' equality plus the unconditional break, not on the actual bits. The construct is fragile and misleading: the value does not mean 'all stages', and the per-stage test '(intrinsic.stage & (1<<stage))' skips Vertex for an 'all' intrinsic.","fix":"Define EShLangAll as a true all-ones stage mask, e.g. EShLanguageMask((1 << EShLangCount) - 1), so the bitwise applicability test in the generation loop is correct regardless of how many stages exist.","locations":[{"ref":"glslang/HLSL/hlslParseables.cpp:458","code":"  458 |     static const EShLanguageMask EShLangAll    = EShLanguageMask(EShLangCount - 1);","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/HLSL/hlslParseables.cpp#L458"},{"ref":"glslang/HLSL/hlslParseables.cpp:883-888","code":"  883 |         for (int stage = 0; stage < EShLangCount; ++stage) {                                // for each stage...\n  884 |             if ((intrinsic.stage & (1<<stage)) == 0) // skip inapplicable stages\n  885 |                 continue;\n  886 | \n  887 |             // reference to either the common builtins, or stage specific builtins.\n  888 |             TString& s = (intrinsic.stage == EShLangAll) ? commonBuiltins : stageBuiltins[stage];","lines":6,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/HLSL/hlslParseables.cpp#L883-L888"}]},
{"id":"CMT_10","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"RoundToPow2's comment says 'Round number up to a multiple of the given powerOf2, which is not a power, just a number that must be a power of 2.' The phrase 'which is not a power' contradicts the rest of the sentence and the assert(IsPow2(powerOf2)); powerOf2 must be a power of 2. The wording is garbled and misleading.","fix":"Rewrite the comment, e.g. 'Round number up to a multiple of powerOf2, which must be a power of 2.'","locations":[{"ref":"glslang/Include/Common.h:279-285","code":"  279 | // Round number up to a multiple of the given powerOf2, which is not\n  280 | // a power, just a number that must be a power of 2.\n  281 | template <class T> void RoundToPow2(T& number, int powerOf2)\n  282 | {\n  283 |     assert(IsPow2(powerOf2));\n  284 |     number = (number + powerOf2 - 1) & ~(powerOf2 - 1);\n  285 | }","lines":7,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/Include/Common.h#L279-L285"}]},
{"id":"CMT_11","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"Corrupted/merge-artifact comment on the `primitives` member of TShaderQualifiers. The trailing text `DerivativeGroupLinear;   // true if layout derivative_group_linearNV set` is leftover from a different field's comment and makes the line misleading.","fix":"Reduce the comment to `int primitives; // mesh shader \"max_primitives\"` and drop the spurious trailing text.","locations":[{"ref":"glslang/Include/Types.h:1396","code":" 1396 |     int primitives;                     // mesh shader \"max_primitives\"DerivativeGroupLinear;   // true if layout derivative_group_linearNV set","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/Include/Types.h#L1396"}]},
{"id":"CMT_12","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"The comments on EOpAtomicCounterIncrement (// results in pre-increment value) and EOpAtomicCounterDecrement (// results in post-decrement value) are inconsistent with each other and with GLSL semantics: atomicCounterIncrement returns the value prior to increment and atomicCounterDecrement returns the value after decrement, i.e. both return a distinct semantics that the asymmetric wording obscures. The mismatched pre-/post- phrasing is misleading to anyone reasoning about the returned value.","fix":"Reword both comments to state precisely what each returns (e.g. increment returns the prior value, decrement returns the decremented value), matching the GLSL spec.","locations":[{"ref":"glslang/Include/intermediate.h:460-461","code":"  460 |     EOpAtomicCounterIncrement, // results in pre-increment value\n  461 |     EOpAtomicCounterDecrement, // results in post-decrement value","lines":2,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/Include/intermediate.h#L460-L461"}]},
{"id":"CMT_13","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"ValidVersion's leading comment says 'nullptr means always valid', but the implementation actually tests function.versioning.empty() (an empty span), not a null pointer. The versioning field is a span<const Versioning>, not a pointer, so the comment is a stale carry-over from an earlier pointer-based design and is misleading to a reader.","fix":"Reword the comment to 'an empty versioning span means always valid' to match the .empty() check.","locations":[{"ref":"glslang/MachineIndependent/Initialize.cpp:475-479","code":"  475 | bool ValidVersion(const BuiltInFunction& function, int version, EProfile profile, const SpvVersion& /* spVersion */)\n  476 | {\n  477 |     // nullptr means always valid\n  478 |     if (function.versioning.empty())\n  479 |         return true;","lines":5,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/Initialize.cpp#L475-L479"}]},
{"id":"CMT_14","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"Misleading extension comments on ES-profile float64 blocks. Several EEsProfile && version >= 310 blocks that declare float64_t / f64vec explicit-type builtins are tagged with the comment 'ARB_gpu_shader_fp64' (and one with 'Explicit Types'). ARB_gpu_shader_fp64 is a desktop-GL extension and does not apply to the ES profile; these ES float64 builtins come from the explicit-arithmetic-types float64 extension, not ARB_gpu_shader_fp64. The copy-pasted comments contradict the gating condition just above them.","fix":"Update the comments on the EEsProfile float64 blocks (1627, 1670) to reference GL_EXT_shader_explicit_arithmetic_types_float64 instead of ARB_gpu_shader_fp64.","locations":[{"ref":"glslang/MachineIndependent/Initialize.cpp:1627","code":" 1627 |     if (profile == EEsProfile && version >= 310) {  // ARB_gpu_shader_fp64","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/Initialize.cpp#L1627"},{"ref":"glslang/MachineIndependent/Initialize.cpp:1670","code":" 1670 |     if (profile == EEsProfile && version >= 310) { // ARB_gpu_shader_fp64","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/Initialize.cpp#L1670"}]},
{"id":"CMT_15","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The comment for the profileString buffer says 'const int maxProfileLength = 13;  // not including any 0', and profileString[maxProfileLength] is filled up to index maxProfileLength-1 and never null-terminated. The 'not including any 0' note is misleading: there is no terminating 0 stored at all, the buffer is exactly the longest profile name ('compatibility' = 13). Comparisons rely solely on strncmp with an explicit length. A reader could wrongly assume profileString is a C string and use it with strlen/strcmp, reading past the buffer.","fix":"Reword the comment to state the buffer is intentionally non-null-terminated and only ever compared with strncmp using profileLength.","locations":[{"ref":"glslang/MachineIndependent/Scan.cpp:254-273","code":"  254 |         const int maxProfileLength = 13;  // not including any 0\n  255 |         char profileString[maxProfileLength];\n  256 |         int profileLength;\n  257 |         for (profileLength = 0; profileLength < maxProfileLength; ++profileLength) {\n  258 |             if (c == EndOfInput || c == ' ' || c == '\\t' || c == '\\n' || c == '\\r')\n  259 |                 break;\n  260 |             profileString[profileLength] = (char)c;\n  261 |             c = get();\n  262 |         }\n  263 |         if (c != EndOfInput && c != ' ' && c != '\\t' && c != '\\n' && c != '\\r') {\n  264 |             versionNotFirst = true;\n  265 |             continue;\n  266 |         }\n  267 | \n  268 |         if (profileLength == 2 && strncmp(profileString, \"es\", profileLength) == 0)\n  269 |             profile = EEsProfile;\n  270 |         else if (profileLength == 4 && strncmp(profileString, \"core\", profileLength) == 0)\n  271 |             profile = ECoreProfile;\n  272 |         else if (profileLength == 13 && strncmp(profileString, \"compatibility\", profileLength) == 0)\n  273 |             profile = ECompatibilityProfile;","lines":20,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/Scan.cpp#L254-L273"}]},
{"id":"CMT_16","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The do/while loop condition `while (newRoot)` is misleading. By the time control reaches the bottom of the loop body, the inner work has finished but newRoot is still the (non-null) value found at the top, so the condition is essentially always true; the loop is actually exited only via the `break` when no unvisited node is found. The trailing comment even admits this ('redundant loop check; should always exit via the break above'), making the loop condition dead/misleading code.","fix":"Replace the do/while with `for (;;)` (or `while (true)`) since the only real exit is the internal break, to avoid implying newRoot is a meaningful loop condition.","locations":[{"ref":"glslang/MachineIndependent/linkValidate.cpp:1755-1815","code":" 1755 |     do {\n 1756 |         // See if we have unvisited parts of the graph.\n 1757 |         newRoot = nullptr;\n 1758 |         for (TGraph::iterator call = callGraph.begin(); call != callGraph.end(); ++call) {\n 1759 |             if (! call->visited) {\n 1760 |                 newRoot = &(*call);\n 1761 |                 break;\n 1762 |             }\n 1763 |         }\n 1764 | \n 1765 |         // If not, we are done.\n 1766 |         if (! newRoot)\n 1767 |             break;\n 1768 | \n 1769 |         // Otherwise, we found a new subgraph, process it:\n 1770 |         // See what all can be reached by this new root, and if any of\n 1771 |         // that is recursive.  This is done by depth-first traversals, seeing\n 1772 |         // if a new call is found that was already in the currentPath (a back edge),\n 1773 |         // thereby detecting recursion.\n 1774 |         std::list<TCall*> stack;\n 1775 |         newRoot->currentPath = true; // currentPath will be true iff it is on the stack\n 1776 |         stack.push_back(newRoot);\n 1777 |         while (! stack.empty()) {\n 1778 |             // get a caller\n 1779 |             TCall* call = stack.back();\n 1780 | \n 1781 |             // Add to the stack just one callee.\n 1782 |             // This algorithm always terminates, because only !visited and !currentPath causes a push\n 1783 |             // and all pushes change currentPath to true, and all pops change visited to true.\n 1784 |             TGraph::iterator child = callGraph.begin();\n 1785 |             for (; child != callGraph.end(); ++child) {\n 1786 | \n 1787 |                 // If we already visited this node, its whole subgraph has already been processed, so skip it.\n 1788 |                 if (child->visited)\n 1789 |                     continue;\n 1790 | \n 1791 |                 if (call->callee == child->caller) {\n 1792 |                     if (child->currentPath) {\n 1793 |                         // Then, we found a back edge\n 1794 |                         if (! child->errorGiven) {\n 1795 |                             error(infoSink, \"Recursion detected:\");\n 1796 |                             infoSink.info << \"    \" << call->callee << \" calling \" << child->callee << \"\\n\";\n 1797 |                             child->errorGiven = true;\n 1798 |                             recursive = true;\n 1799 |                         }\n 1800 |                     } else {\n 1801 |                         child->currentPath = true;\n 1802 |                         stack.push_back(&(*child));\n 1803 |                         break;\n 1804 |                     }\n 1805 |                 }\n 1806 |             }\n 1807 |             if (child == callGraph.end()) {\n 1808 |                 // no more callees, we bottomed out, never look at this node again\n 1809 |                 stack.back()->currentPath = false;\n 1810 |                 stack.back()->visited = true;\n 1811 |                 stack.pop_back();\n 1812 |             }\n 1813 |         }  // end while, meaning nothing left to process in this subtree\n 1814 | \n 1815 |     } while (newRoot);  // redundant loop check; should always exit via the 'break' above","lines":61,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/linkValidate.cpp#L1755-L1815"}]},
{"id":"CMT_17","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"scanHeaderName's comment says 'Always creates a name and returns PpAtomicConstString' but the function returns PpAtomConstString (not PpAtomicConstString) and does NOT always create a name/return that atom: it returns EndOfInput on empty input stack or on hitting EndOfInput mid-name. Misleading documentation of the contract.","fix":"Reword to: 'Returns PpAtomConstString with the scanned name, or EndOfInput if input is exhausted before the closing delimiter.'","locations":[{"ref":"glslang/MachineIndependent/preprocessor/Pp.cpp:1073","code":" 1073 | // Always creates a name and returns PpAtomicConstString, unless we run out of input.","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/preprocessor/Pp.cpp#L1073"}]},
{"id":"CMT_18","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"Comment at line 111-112 reads 'to immediately put as at the end of the dereference change' - 'put as' should be 'put us' and 'change' should be 'chain'. The same garbled comment is duplicated at lines 596-597. Minor but misleading typos in a non-trivial explanatory comment.","fix":"Fix to 'to immediately put us at the end of the dereference chain expected by blowUpActiveAggregate.'","locations":[{"ref":"glslang/MachineIndependent/reflection.cpp:111-112","code":"  111 |             // Use a degenerate (empty) set of dereferences to immediately put as at the end of\n  112 |             // the dereference change expected by blowUpActiveAggregate.","lines":2,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/reflection.cpp#L111-L112"},{"ref":"glslang/MachineIndependent/reflection.cpp:596-597","code":"  596 |                 // Use a degenerate (empty) set of dereferences to immediately put as at the end of\n  597 |                 // the dereference change expected by blowUpActiveAggregate.","lines":2,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/reflection.cpp#L596-L597"}]},
{"id":"CMT_19","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"Float64NanTests labels the last three (positive) NaN entries as '// -nan'. Their bit patterns start with 0x7FF... (sign bit clear), so they are positive NaNs and should be commented '// +nan'. Copy-paste from the negative-NaN block above; misleading when reading expected values.","fix":"Change the trailing comments on the 0x7FF0000000000001LL, 0x7FF0000300000000LL and 0x7FFFFFFFFFFFFFFFLL rows from '// -nan' to '// +nan'.","locations":[{"ref":"gtests/HexFloat.cpp:237-239","code":"  237 |         {uint64_t(0x7FF0000000000001LL), \"0x1.0000000000001p+1024\"},   // -nan\n  238 |         {uint64_t(0x7FF0000300000000LL), \"0x1.00003p+1024\"},           // -nan\n  239 |         {uint64_t(0x7FFFFFFFFFFFFFFFLL), \"0x1.fffffffffffffp+1024\"},   // -nan","lines":3,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/gtests/HexFloat.cpp#L237-L239"}]},
{"id":"CMT_20","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"Copy-paste comment numbering: two tests are both labeled \"Test 2\" and two are both labeled \"Test 3\". Uint8VariableIndex and Uint16VariableIndex are both \"// Test 2:\"; Uint8ConstantIndex and Uint16ConstantIndex are both \"// Test 3:\". The duplicated numbers make the comments misleading when navigating the file.","fix":"Renumber the comment labels uniquely (e.g. Test 2/Test 3/Test 4/Test 5) or drop the numeric prefixes entirely.","locations":[{"ref":"gtests/SpvPatternTest.cpp:108","code":"  108 | // Test 2: Indexing an array with a variable index of type uint8_t should generate a zero extension.","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/gtests/SpvPatternTest.cpp#L108"},{"ref":"gtests/SpvPatternTest.cpp:133","code":"  133 | // Test 2: Indexing an array with a variable index of type uint16_t should generate a zero extension.","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/gtests/SpvPatternTest.cpp#L133"},{"ref":"gtests/SpvPatternTest.cpp:158","code":"  158 | // Test 3: Indexing an array with a constant index of type uint8_t should NOT generate a zero extension.","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/gtests/SpvPatternTest.cpp#L158"},{"ref":"gtests/SpvPatternTest.cpp:184","code":"  184 | // Test 3: Indexing an array with a constant index of type uint16_t should NOT generate a zero extension.","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/gtests/SpvPatternTest.cpp#L184"}]},
{"id":"CMT_21","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"In acceptStructDeclarationList(), a struct-member initializer (member = expr) is correctly warned as ignored, but the third argument passed to warn() is the literal string \"typedef\", which is unrelated to struct member initializers and produces a misleading diagnostic token in the warning output.","fix":"Replace the \"typedef\" string argument with something meaningful (e.g. the member name *idToken.string or \"\").","locations":[{"ref":"glslang/HLSL/hlslGrammar.cpp:2754-2755","code":" 2754 |                 if (acceptTokenClass(EHTokAssign)) {\n 2755 |                     parseContext.warn(idToken.loc, \"struct-member initializers ignored\", \"typedef\", \"\");","lines":2,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/HLSL/hlslGrammar.cpp#L2754-L2755"}]},
{"id":"CMT_22","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"The comments on EOpLogicalAnd and EOpLogicalOr say 'this code is written for possible future use, will not get executed currently', but EOpLogicalXor immediately below is actually executed (it has real folding logic and an assert), and these logical ops can be reached for bool constant folding. The 'will not get executed' claim is misleading/stale and can mislead a maintainer into thinking the branches are dead.","fix":"Remove or correct the stale comments to accurately reflect when these branches are reachable.","locations":[{"ref":"glslang/MachineIndependent/Constant.cpp:329-337","code":"  329 |     case EOpLogicalAnd: // this code is written for possible future use, will not get executed currently\n  330 |         for (int i = 0; i < newComps; i++)\n  331 |             newConstArray[i] = leftUnionArray[i] && rightUnionArray[i];\n  332 |         break;\n  333 | \n  334 |     case EOpLogicalOr: // this code is written for possible future use, will not get executed currently\n  335 |         for (int i = 0; i < newComps; i++)\n  336 |             newConstArray[i] = leftUnionArray[i] || rightUnionArray[i];\n  337 |         break;","lines":9,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/Constant.cpp#L329-L337"}]},
{"id":"CMT_23","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"Malformed comment: the line `// N.B. Invalid numeric suffixes are not consumed.//` has a stray trailing `//` glued onto the end of the sentence, which is a copy/paste artifact rather than intended text.","fix":"Remove the trailing `//` so the line reads `// N.B. Invalid numeric suffixes are not consumed.`","locations":[{"ref":"glslang/MachineIndependent/preprocessor/PpScanner.cpp:503","code":"  503 | // N.B. Invalid numeric suffixes are not consumed.//","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/preprocessor/PpScanner.cpp#L503"}]},
{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"high","difficulty":"medium","description":"OpCooperativeMatrixReduceNV has its operands pushed twice. The first block (lines 3867-3869) registers 'Matrix', 'ReduceMask', 'CombineFunc'. A second, partial block (lines 3887-3888) appends 'Matrix' and 'ReduceMask' again to the SAME instruction's operand vector. The result is a 5-operand description (Matrix, ReduceMask, CombineFunc, Matrix, ReduceMask) instead of 3, so the disassembler will mislabel operands and try to consume two extra operands for this opcode.","fix":"Delete the second block (lines 3887-3888); the correct 3-operand definition already exists at 3867-3869.","locations":[{"ref":"SPIRV/doc.cpp:3900-3902","code":" 3900 |         InstructionDesc[enumCast(Op::OpCooperativeMatrixReduceNV)].operands.push(OperandId, \"'Matrix'\");\n 3901 |         InstructionDesc[enumCast(Op::OpCooperativeMatrixReduceNV)].operands.push(OperandLiteralNumber, \"'ReduceMask'\");\n 3902 |         InstructionDesc[enumCast(Op::OpCooperativeMatrixReduceNV)].operands.push(OperandId, \"'CombineFunc'\");","lines":3,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/SPIRV/doc.cpp#L3900-L3902"},{"ref":"SPIRV/doc.cpp:3900-3901","code":" 3900 |         InstructionDesc[enumCast(Op::OpCooperativeMatrixReduceNV)].operands.push(OperandId, \"'Matrix'\");\n 3901 |         InstructionDesc[enumCast(Op::OpCooperativeMatrixReduceNV)].operands.push(OperandLiteralNumber, \"'ReduceMask'\");","lines":2,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/SPIRV/doc.cpp#L3900-L3901"}]},
{"id":"DUP_2","type":"duplicate_code","type_label":"Duplicate Code","severity":"medium","difficulty":"medium","description":"OpHitObjectGetShaderRecordBufferHandleNV is configured twice with identical statements. The block at 3564-3565 pushes a 'HitObject' operand and sets result/type; the block at 3970-3971 repeats both. Because operands.push appends, the instruction ends up with two 'HitObject' operands, so the disassembler expects/labels an extra operand for this opcode.","fix":"Remove the duplicate block at 3970-3971 (likely a copy-paste from the NV-vs-EXT section that should have targeted the EXT opcode).","locations":[{"ref":"SPIRV/doc.cpp:3589-3590","code":" 3589 |         InstructionDesc[enumCast(Op::OpHitObjectGetShaderRecordBufferHandleNV)].operands.push(OperandId, \"'HitObject'\");\n 3590 |         InstructionDesc[enumCast(Op::OpHitObjectGetShaderRecordBufferHandleNV)].setResultAndType(true, true);","lines":2,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/SPIRV/doc.cpp#L3589-L3590"},{"ref":"SPIRV/doc.cpp:4006-4007","code":" 4006 |         InstructionDesc[enumCast(Op::OpHitObjectGetShaderRecordBufferHandleNV)].operands.push(OperandId, \"'HitObject'\");\n 4007 |         InstructionDesc[enumCast(Op::OpHitObjectGetShaderRecordBufferHandleNV)].setResultAndType(true, true);","lines":2,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/SPIRV/doc.cpp#L4006-L4007"}]},
