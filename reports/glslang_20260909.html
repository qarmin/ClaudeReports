{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"DirStackFileIncluder::newIncludeResult uses 'int length' obtained from file.tellg() cast to int. For an include file >= 2 GiB the cast overflows to a negative or truncated value; 'new tUserDataElement[length]' with a negative length passed as size_t throws bad_array_new_length or allocates a wrong size, and file.read(content, length) then reads the wrong amount. Also if tellg() returns -1 (stream error after ate-seek), length becomes -1 and the new[] gets a huge size_t.","fix":"Use a std::streamsize/size_t for length, check tellg() >= 0, and reject sizes exceeding a sane limit before allocating.","locations":[{"ref":"StandAlone/DirStackFileIncluder.h:116-157","code":"  116 |     virtual IncludeResult* readLocalPath(const char* headerName)\n  117 |     {\n  118 |         // Find a directory that works, using a reverse search of the include stack.\n  119 |         for (auto it = localDirectoryStack.rbegin(); it != localDirectoryStack.rend(); ++it) {\n  120 |             std::string path = *it + '/' + headerName;\n  121 |             std::replace(path.begin(), path.end(), '\\\\', '/');\n  122 |             std::ifstream file(path, std::ios_base::binary | std::ios_base::ate);\n  123 |             if (file) {\n  124 |                 localDirectoryStack.push_back(getDirectory(path));\n  125 |                 includedFiles.insert(path);\n  126 |                 return newIncludeResult(path, file, (int)file.tellg());\n  127 |             }\n  128 |         }\n  129 | \n  130 |         return nullptr;\n  131 |     }\n  132 | \n  133 |     // Search for a valid <system> path.\n  134 |     virtual IncludeResult* readSystemPath(const char* headerName)\n  135 |     {\n  136 |         // Search for external directories only.\n  137 |         for (auto it = externalDirectoryList.begin(); it != externalDirectoryList.end(); ++it) {\n  138 |             std::string path = *it + '/' + headerName;\n  139 |             std::replace(path.begin(), path.end(), '\\\\', '/');\n  140 |             std::ifstream file(path, std::ios_base::binary | std::ios_base::ate);\n  141 |             if (file) {\n  142 |                 localDirectoryStack.push_back(getDirectory(path));\n  143 |                 includedFiles.insert(path);\n  144 |                 return newIncludeResult(path, file, (int)file.tellg());\n  145 |             }\n  146 |         }\n  147 |         return nullptr;\n  148 |     }\n  149 | \n  150 |     // Do actual reading of the file, filling in a new include result.\n  151 |     virtual IncludeResult* newIncludeResult(const std::string& path, std::ifstream& file, int length) const\n  152 |     {\n  153 |         char* content = new tUserDataElement [length];\n  154 |         file.seekg(0, file.beg);\n  155 |         file.read(content, length);\n  156 |         return new IncludeResult(path, content, length, content);\n  157 |     }","lines":42,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/StandAlone/DirStackFileIncluder.h#L116-L157"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"The --stdin option assigns shaderStageName = argv[1] but does not validate argc > 1 and never consumes the argument with bumpArg(). The intended invocation is '--stdin -S <stage>'; here it grabs whatever token immediately follows --stdin (e.g. '-S' itself) and stores it as the shader stage name, then that same token is processed again on the next loop iteration. Unlike every other option that takes a following value (e.g. -S at lines 989-994, --depfile at 913-917), this one neither checks bounds nor advances. If --stdin is the final argument, argv[1] is the NULL argv terminator, silently setting shaderStageName to nullptr. The whole assignment appears to be a stray copy-paste: stdin gets its stage from -S, not from a --stdin operand.","fix":"Remove the 'shaderStageName = argv[1];' line entirely (the stage is provided via -S, which is already required by the check at lines 1098-1099). If a --stdin operand is genuinely intended, guard with 'if (argc <= 1) Error(...)' and call bumpArg() after assigning.","locations":[{"ref":"StandAlone/StandAlone.cpp:845-847","code":"  845 |                     } else if (lowerword == \"stdin\") {\n  846 |                         Options |= EOptionStdin;\n  847 |                         shaderStageName = argv[1];","lines":3,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/StandAlone/StandAlone.cpp#L845-L847"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"acceptType() consumes a leading 'unorm'/'snorm' token (advanceToken at lines 1507/1511) but if the following token is not a recognized type, the function falls through to 'default: return false' (line 2361) without receding the consumed token. Callers such as acceptFullySpecifiedType treat a false return as 'nothing consumed' and may recede only their own qualifier token, leaving the parser desynchronized after input like 'unorm foo'.","fix":"If isUnorm/isSnorm was set and the type switch hits 'default', recedeToken() once before returning false so the consumed unorm/snorm token is restored, keeping the speculative-parse contract intact.","locations":[{"ref":"glslang/HLSL/hlslGrammar.cpp:1506-1517","code":" 1506 |     switch (peek()) {\n 1507 |     case EHTokUnorm:\n 1508 |         isUnorm = true;\n 1509 |         advanceToken();  // eat the token\n 1510 |         break;\n 1511 |     case EHTokSNorm:\n 1512 |         isSnorm = true;\n 1513 |         advanceToken();  // eat the token\n 1514 |         break;\n 1515 |     default:\n 1516 |         break;\n 1517 |     }","lines":12,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/HLSL/hlslGrammar.cpp#L1506-L1517"},{"ref":"glslang/HLSL/hlslGrammar.cpp:2362-2364","code":" 2362 |     default:\n 2363 |         return false;\n 2364 |     }","lines":3,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/HLSL/hlslGrammar.cpp#L2362-L2364"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"getTextureReturnType() asserts 'textureReturnStruct.size() >= sampler.structReturnIndex' before indexing textureReturnStruct[sampler.structReturnIndex]. structReturnIndex is used as an array index, so the precondition must be size > structReturnIndex. With '>=' the assert still passes when structReturnIndex == size(), which is an out-of-bounds access (one past the end), so the bounds assertion fails to catch the exact case it is meant to guard.","fix":"Change the assertion to 'assert(textureReturnStruct.size() > sampler.structReturnIndex);'.","locations":[{"ref":"glslang/HLSL/hlslParseHelper.cpp:9873","code":" 9873 |         assert(textureReturnStruct.size() >= sampler.structReturnIndex);","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/HLSL/hlslParseHelper.cpp#L9873"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The scalar comparison operators (operator==(int), operator==(double), operator==(bool), etc.) read their union field unconditionally without checking the stored 'type'. If the union currently holds, say, a double (type == EbtDouble) and operator==(int) is invoked, it reads iConst, which aliases the low 32 bits of dConst - a wrong/garbage comparison. The TConstUnion::operator==(const TConstUnion&) variant correctly guards on type first; the scalar overloads do not, making them unsafe unless the caller already knows the active type.","fix":"Either assert(type == <expected type>) at the start of each scalar comparison operator, or have each return false when 'type' does not match the operand's basic type, mirroring the type guard used in operator==(const TConstUnion&).","locations":[{"ref":"glslang/Include/ConstantUnion.h:130-208","code":"  130 |     bool operator==(const signed char i) const\n  131 |     {\n  132 |         if (i == i8Const)\n  133 |             return true;\n  134 | \n  135 |         return false;\n  136 |     }\n  137 | \n  138 |     bool operator==(const unsigned char u) const\n  139 |     {\n  140 |         if (u == u8Const)\n  141 |             return true;\n  142 | \n  143 |         return false;\n  144 |     }\n  145 | \n  146 |    bool operator==(const signed short i) const\n  147 |     {\n  148 |         if (i == i16Const)\n  149 |             return true;\n  150 | \n  151 |         return false;\n  152 |     }\n  153 | \n  154 |     bool operator==(const unsigned short u) const\n  155 |     {\n  156 |         if (u == u16Const)\n  157 |             return true;\n  158 | \n  159 |         return false;\n  160 |     }\n  161 | \n  162 |     bool operator==(const int i) const\n  163 |     {\n  164 |         if (i == iConst)\n  165 |             return true;\n  166 | \n  167 |         return false;\n  168 |     }\n  169 | \n  170 |     bool operator==(const unsigned int u) const\n  171 |     {\n  172 |         if (u == uConst)\n  173 |             return true;\n  174 | \n  175 |         return false;\n  176 |     }\n  177 | \n  178 |     bool operator==(const long long i64) const\n  179 |     {\n  180 |         if (i64 == i64Const)\n  181 |             return true;\n  182 | \n  183 |         return false;\n  184 |     }\n  185 | \n  186 |     bool operator==(const unsigned long long u64) const\n  187 |     {\n  188 |         if (u64 == u64Const)\n  189 |             return true;\n  190 | \n  191 |         return false;\n  192 |     }\n  193 | \n  194 |     bool operator==(const double d) const\n  195 |     {\n  196 |         if (d == dConst)\n  197 |             return true;\n  198 | \n  199 |         return false;\n  200 |     }\n  201 | \n  202 |     bool operator==(const bool b) const\n  203 |     {\n  204 |         if (b == bConst)\n  205 |             return true;\n  206 | \n  207 |         return false;\n  208 |     }","lines":79,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/Include/ConstantUnion.h#L130-L208"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"operator!=(const float f) calls operator==(f), but TConstUnion has no operator==(float). The argument is implicitly converted to double and dispatched to operator==(const double), which compares against dConst. There is no symmetric operator==(float), so the float overload set is asymmetric and misleading: a float-typed equality test silently routes through the double field. Either both float operators should exist or neither.","fix":"Remove operator!=(const float) (callers can use the double overloads), or add a matching operator==(const float) that explicitly compares against dConst, so the == and != overload sets are symmetric.","locations":[{"ref":"glslang/Include/ConstantUnion.h:314-317","code":"  314 |     bool operator!=(const float f) const\n  315 |     {\n  316 |         return !operator==(f);\n  317 |     }","lines":4,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/Include/ConstantUnion.h#L314-L317"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The block-reference TType constructor (EbtReference) omits coopvecNV and longVector from its member initializer list. The class declares the bitfields in order coopmatKHRUseValid, coopvecNV, longVector, tileAttachmentQCOM; the initializer list jumps straight from coopmatKHRUseValid to tileAttachmentQCOM, leaving coopvecNV and longVector with indeterminate values for every reference type constructed this way. Reads via isCoopVecNV()/isLongVector() then return garbage.","fix":"Add `coopvecNV(false), longVector(false),` to the initializer list between coopmatKHRUseValid(false) and tileAttachmentQCOM(false), matching the other TType constructors.","locations":[{"ref":"glslang/Include/Types.h:1847-1850","code":" 1847 |     explicit TType(TBasicType t, const TType &p, const TString& n) :\n 1848 |                             basicType(t), vectorSize(1), matrixCols(0), matrixRows(0), vector1(false), coopmatNV(false), coopmatKHR(false), coopmatKHRuse(0), coopmatKHRUseValid(false),\n 1849 |                             tileAttachmentQCOM(false), tensorRankARM(0), arraySizes(nullptr), structure(nullptr), fieldName(nullptr), typeName(nullptr), typeParameters(nullptr),\n 1850 |                             spirvType(nullptr)","lines":4,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/Include/Types.h#L1847-L1850"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"clearInnerUnsized() unconditionally returns false, regardless of whether it changed anything. The sibling predicate isInnerUnsized() returns a meaningful bool, so a reader naturally expects clearInnerUnsized() to report whether any unsized inner dimension was found/cleared. The hardcoded `return false;` is dead/misleading: any caller that branched on the result would always take the false path. Current callers ignore the value, but the signature invites bugs.","fix":"Either make the function void, or track and return whether any dimension was cleared (set a local `bool changed` in the loop and `return changed;`).","locations":[{"ref":"glslang/Include/arrays.h:302-310","code":"  302 |     bool clearInnerUnsized()\n  303 |     {\n  304 |         for (int d = 1; d < sizes.size(); ++d) {\n  305 |             if (sizes.getDimSize(d) == (unsigned)UnsizedArraySize)\n  306 |                 setDimSize(d, 1);\n  307 |         }\n  308 | \n  309 |         return false;\n  310 |     }","lines":9,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/Include/arrays.h#L302-L310"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"TIntermMethod's constructor initializes object and method but never initializes the linkType member. setExport() writes ELinkExport, but if it is never called, getLinkType-style reads (or any logic depending on linkType) observe an indeterminate value. The analogous TIntermAggregate::linkType is given a default member initializer (= ELinkNone); TIntermMethod is not.","fix":"Add a default member initializer `TLinkType linkType = ELinkNone;` or initialize linkType in the constructor initializer list.","locations":[{"ref":"glslang/Include/intermediate.h:1390-1403","code":" 1390 | class TIntermMethod : public TIntermTyped {\n 1391 | public:\n 1392 |     TIntermMethod(TIntermTyped* o, const TType& t, const TString& m) : TIntermTyped(t), object(o), method(m) { }\n 1393 |     virtual       TIntermMethod* getAsMethodNode()       { return this; }\n 1394 |     virtual const TIntermMethod* getAsMethodNode() const { return this; }\n 1395 |     virtual const TString& getMethodName() const { return method; }\n 1396 |     virtual TIntermTyped* getObject() const { return object; }\n 1397 |     virtual void traverse(TIntermTraverser*);\n 1398 |     void setExport() { linkType = ELinkExport; }\n 1399 | protected:\n 1400 |     TIntermTyped* object;\n 1401 |     TString method;\n 1402 |     TLinkType linkType;\n 1403 | };","lines":14,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/Include/intermediate.h#L1390-L1403"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"EOpAbs only handles EbtDouble and EbtInt; for EbtInt8, EbtInt16, and EbtInt64 it falls through to the else branch and copies the operand unchanged, so abs() of a negative constant of those integer types is folded to the wrong (still-negative) value. Float16/etc. types stored as double would also not be handled (they are not EbtDouble). This silently produces incorrect constant results.","fix":"Add explicit cases for EbtInt8/EbtInt16/EbtInt64 (and the half-float types) that compute abs on the correct field, e.g. setI64Const(llabs(getI64Const())) etc., rather than copying the value unchanged.","locations":[{"ref":"glslang/MachineIndependent/Constant.cpp:816-823","code":"  816 |         case EOpAbs:\n  817 |             if (unionArray[i].getType() == EbtDouble)\n  818 |                 newConstArray[i].setDConst(fabs(unionArray[i].getDConst()));\n  819 |             else if (unionArray[i].getType() == EbtInt)\n  820 |                 newConstArray[i].setIConst(abs(unionArray[i].getIConst()));\n  821 |             else\n  822 |                 newConstArray[i] = unionArray[i];\n  823 |             break;","lines":8,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/Constant.cpp#L816-L823"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"EOpSign on a non-double type unconditionally uses getIConst()/setIConst(), reading the 32-bit iConst field. For EbtInt8/EbtInt16/EbtInt64 (and unsigned types) this reads the wrong union field, so sign() of those constant integer types folds to a garbage/incorrect value. Only EbtDouble and EbtInt are handled correctly.","fix":"Switch on getType().getBasicType() and read/write the matching field (getI8Const/getI16Const/getI64Const, and define sign behavior for unsigned types), instead of assuming getIConst() for every non-double case.","locations":[{"ref":"glslang/MachineIndependent/Constant.cpp:824-830","code":"  824 |         case EOpSign:\n  825 |             #define SIGN(X) (X == 0 ? 0 : (X < 0 ? -1 : 1))\n  826 |             if (unionArray[i].getType() == EbtDouble)\n  827 |                 newConstArray[i].setDConst(SIGN(unionArray[i].getDConst()));\n  828 |             else\n  829 |                 newConstArray[i].setIConst(SIGN(unionArray[i].getIConst()));\n  830 |             break;","lines":7,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/Constant.cpp#L824-L830"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In the buffer_reference forward-declaration path of addQualifierToExisting, the error message on failed symbol insertion uses the unrelated member pointer blockName->c_str() instead of the identifier being declared. blockName holds whatever block name was last parsed (and can be nullptr if no block has been declared yet), so this both prints a misleading/incorrect name and can dereference a null pointer. declareBlock uses blockName legitimately, but this function operates on 'identifier'.","fix":"Use identifier.c_str() in the error call: error(loc, \"block name cannot redefine a non-block name\", identifier.c_str(), \"\");","locations":[{"ref":"glslang/MachineIndependent/ParseHelper.cpp:11848-11850","code":"11848 |         if (! symbolTable.insert(*blockNameVar)) {\n11849 |             error(loc, \"block name cannot redefine a non-block name\", blockName->c_str(), \"\");\n11850 |         }","lines":3,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/ParseHelper.cpp#L11848-L11850"}]},
{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"TPoolAllocator's 'totalBytes' statistic member is never initialized. The constructor's member-init list initializes numCalls(0) but omits totalBytes, and PoolAlloc.h declares 'size_t totalBytes;' with no in-class initializer. allocate() then does 'totalBytes += numBytes;' which reads an indeterminate value. It is only a statistic, but it is still reading uninitialized memory (UB) on every allocate call until/unless the garbage happens to be benign.","fix":"Add totalBytes(0) to the constructor initializer list (or give totalBytes an in-class initializer = 0 in PoolAlloc.h).","locations":[{"ref":"glslang/MachineIndependent/PoolAlloc.cpp:73-79","code":"   73 | TPoolAllocator::TPoolAllocator(int growthIncrement, int allocationAlignment) :\n   74 |     pageSize(growthIncrement),\n   75 |     alignment(allocationAlignment),\n   76 |     freeList(nullptr),\n   77 |     inUseList(nullptr),\n   78 |     numCalls(0)\n   79 | {","lines":7,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/PoolAlloc.cpp#L73-L79"},{"ref":"glslang/MachineIndependent/PoolAlloc.cpp:237","code":"  237 |     totalBytes += numBytes;","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/PoolAlloc.cpp#L237"}]},
{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In TInputScanner::unget() (Scan.h), the branch that crosses back into a previous source string does 'do { --currentSource; } while (currentSource > 0 && lengths[currentSource] == 0);'. If every preceding source string has length 0 the loop stops at currentSource == 0 even when lengths[0] == 0, then the 'if (lengths[currentSource] == 0)' check handles index 0. But there is no guard preventing --currentSource from running when currentChar==0 and currentSource is already 0 (e.g. ungetting at the very first character before any get). In that situation currentSource becomes -1 and the subsequent lengths[currentSource]/sources[currentSource] accesses are out of bounds. unget() relies entirely on callers never ungetting past the start; nothing enforces it.","fix":"Guard the cross-source rollback with 'if (currentSource == 0) return;' (or assert) before decrementing, so ungetting before the first character is a no-op rather than indexing currentSource == -1.","locations":[{"ref":"glslang/MachineIndependent/Scan.h:123-156","code":"  123 |     void unget()\n  124 |     {\n  125 |         // Do not roll back once we've reached the end of the file.\n  126 |         if (endOfFileReached)\n  127 |             return;\n  128 | \n  129 |         if (currentChar > 0) {\n  130 |             --currentChar;\n  131 |             --loc[currentSource].column;\n  132 |             --logicalSourceLoc.column;\n  133 |             if (loc[currentSource].column < 0) {\n  134 |                 // We've moved back past a new line. Find the\n  135 |                 // previous newline (or start of the file) to compute\n  136 |                 // the column count on the now current line.\n  137 |                 size_t chIndex = currentChar;\n  138 |                 while (chIndex > 0) {\n  139 |                     if (sources[currentSource][chIndex] == '\\n') {\n  140 |                         break;\n  141 |                     }\n  142 |                     --chIndex;\n  143 |                 }\n  144 |                 logicalSourceLoc.column = (int)(currentChar - chIndex);\n  145 |                 loc[currentSource].column = (int)(currentChar - chIndex);\n  146 |             }\n  147 |         } else {\n  148 |             do {\n  149 |                 --currentSource;\n  150 |             } while (currentSource > 0 && lengths[currentSource] == 0);\n  151 |             if (lengths[currentSource] == 0) {\n  152 |                 // set to 0 if we've backed up to the start of an empty string\n  153 |                 currentChar = 0;\n  154 |             } else\n  155 |                 currentChar = lengths[currentSource] - 1;\n  156 |         }","lines":34,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/Scan.h#L123-L156"}]},
{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"visitSwitch dereferences node->getBody() unconditionally (node->getBody()->traverse(this)), but a switch statement with an empty body produces a null body pointer in the AST. Unlike visitSelection/visitLoop which guard their child pointers with null checks, this will crash when dumping a switch that has no body. getCondition() is also dereferenced unconditionally, but a switch always has a condition, so only the body is the realistic null.","fix":"Guard the body traversal: `if (node->getBody()) node->getBody()->traverse(this); else out.debug << \"no body\\n\";` matching the null-handling style used in visitLoop/visitSelection.","locations":[{"ref":"glslang/MachineIndependent/intermOut.cpp:1452-1455","code":" 1452 |     OutputTreeText(out, node, depth);\n 1453 |     out.debug << \"body\\n\";\n 1454 |     ++depth;\n 1455 |     node->getBody()->traverse(this);","lines":4,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/intermOut.cpp#L1452-L1455"}]},
{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"checkLocationRange's tileImageEXT-vs-out cross check (set == 4 || set == 1) compares basic types with a raw inequality type.getBasicType() != usedIo[againstSet][r].basicType, unlike the primary path above which uses checkCompatibleTypes() to treat signed/unsigned integer pairs as compatible. This inconsistency means an int output aliasing a uint tileImageEXT (or vice versa) at the same location is flagged as a type collision when the rest of the code considers such pairs compatible.","fix":"Use !checkCompatibleTypes(type.getBasicType(), usedIo[againstSet][r].basicType) instead of the raw != comparison for consistency with the primary location-overlap check.","locations":[{"ref":"glslang/MachineIndependent/linkValidate.cpp:2137-2147","code":" 2137 |     // check typeCollision between tileImageEXT and out\n 2138 |     if (set == 4 || set == 1) {\n 2139 |       // if the set is \"tileImageEXT\", check against \"out\" and vice versa\n 2140 |       int againstSet = (set == 4) ? 1 : 4;\n 2141 |       for (size_t r = 0; r < usedIo[againstSet].size(); ++r) {\n 2142 |         if (range.location.overlap(usedIo[againstSet][r].location) && type.getBasicType() != usedIo[againstSet][r].basicType) {\n 2143 |             // aliased-type mismatch\n 2144 |             typeCollision = true;\n 2145 |             return std::max(range.location.start, usedIo[againstSet][r].location.start);\n 2146 |         }\n 2147 |       }","lines":11,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/linkValidate.cpp#L2137-L2147"}]},
{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"getScalarAlignment's array branch computes size = stride * (type.getOuterArraySize() - 1) + size without guarding against unsized arrays. getBaseAlignment (the sibling function) explicitly guards this case (treating an unsized SSBO trailing array as 1 element). Here, if getOuterArraySize() returns 0 for an implicitly/unsized array, the expression becomes stride * (0 - 1) + size = size - stride, producing a negative or wrong size for scalar-packed blocks with a trailing unsized array.","fix":"Mirror getBaseAlignment: compute arraySize = (type.isUnsizedArray() && type.getOuterArraySize() == 0) ? 1 : type.getOuterArraySize(), then size = stride * (arraySize - 1) + size.","locations":[{"ref":"glslang/MachineIndependent/linkValidate.cpp:2636-2644","code":" 2636 |     if (type.isArray()) {\n 2637 |         TType derefType(type, 0);\n 2638 |         alignment = getScalarAlignment(derefType, size, dummyStride, rowMajor);\n 2639 | \n 2640 |         stride = size;\n 2641 |         RoundToPow2(stride, alignment);\n 2642 | \n 2643 |         size = stride * (type.getOuterArraySize() - 1) + size;\n 2644 |         return alignment;","lines":9,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/linkValidate.cpp#L2636-L2644"}]},
{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In readCPPline's #else handler, elseSeen[elsetracker] is set true unconditionally even when ifdepth == 0 (mismatched #else with no open #if). On a top-level '#else' with no matching '#if', elsetracker is 0 and elseSeen[0] is written/marked, polluting state for a later legitimate #if at depth 0 (it will spuriously report '#else after #else'). The '#else after #else' check and the set happen before the ifdepth==0 validation.","fix":"Only touch elseSeen[elsetracker] when ifdepth > 0; perform the mismatch check first and skip the elseSeen bookkeeping when there is no open conditional.","locations":[{"ref":"glslang/MachineIndependent/preprocessor/Pp.cpp:993-998","code":"  993 |         case PpAtomElse:\n  994 |             if (elseSeen[elsetracker])\n  995 |                 parseContext.ppError(ppToken->loc, \"#else after #else\", \"#else\", \"\");\n  996 |             elseSeen[elsetracker] = true;\n  997 |             if (ifdepth == 0)\n  998 |                 parseContext.ppError(ppToken->loc, \"mismatched statements\", \"#else\", \"\");","lines":6,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/preprocessor/Pp.cpp#L993-L998"}]},
{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The 'integer arithmetic should not be noContraction' guard is inconsistent and incomplete. The check 'node->getBasicType() != glslang::EbtInt' was added only to TNoContractionPropagator::visitBinary, but the same arithmetic-marking logic in visitUnary, visitAggregate, and propagateNoContractionInOneExpression (for the top-level binary/unary nodes) has no such guard, so integer ops reached through those paths still get noContraction. Even in visitBinary the guard only excludes signed 32-bit int (EbtInt); it does not exclude EbtUint, EbtInt8/16/64 or EbtUint8/16/64, so most integer types are still incorrectly marked. NoContraction on integer operations is meaningless and emits spurious SPIR-V decorations.","fix":"Factor the integer test into a helper (e.g. isFloatingPointResult(node) that returns true only for float/double/float16 basic types) and apply it consistently at every place arithmetic nodes are marked noContraction, replacing the partial '!= EbtInt' test.","locations":[{"ref":"glslang/MachineIndependent/propagateNoContraction.cpp:638-646","code":"  638 |             if (isArithmeticOperation(BN->getOp())) {\n  639 |                 BN->getWritableType().getQualifier().noContraction = true;\n  640 |             }\n  641 |         } else if (glslang::TIntermUnary* UN = defining_node->getAsUnaryNode()) {\n  642 |             assert(isAssignOperation(UN->getOp()));\n  643 |             UN->getOperand()->traverse(this);\n  644 |             if (isArithmeticOperation(UN->getOp())) {\n  645 |                 UN->getWritableType().getQualifier().noContraction = true;\n  646 |             }","lines":9,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/propagateNoContraction.cpp#L638-L646"},{"ref":"glslang/MachineIndependent/propagateNoContraction.cpp:692-695","code":"  692 |         // If this is an arithmetic operation, marks this node as 'noContraction'.\n  693 |         if (isArithmeticOperation(node->getOp())) {\n  694 |             node->getWritableType().getQualifier().noContraction = true;\n  695 |         }","lines":4,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/propagateNoContraction.cpp#L692-L695"},{"ref":"glslang/MachineIndependent/propagateNoContraction.cpp:727-730","code":"  727 |         // If this is an arithmetic operation, marks this node as 'noContraction'.\n  728 |         if (isArithmeticOperation(node->getOp()) && node->getBasicType() != glslang::EbtInt) {\n  729 |             node->getWritableType().getQualifier().noContraction = true;\n  730 |         }","lines":4,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/propagateNoContraction.cpp#L727-L730"},{"ref":"glslang/MachineIndependent/propagateNoContraction.cpp:740-742","code":"  740 |         if (isArithmeticOperation(node->getOp())) {\n  741 |             node->getWritableType().getQualifier().noContraction = true;\n  742 |         }","lines":3,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/propagateNoContraction.cpp#L740-L742"}]},
{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"buildUniformStageMask early-returns when EShReflectionAllBlockVariables is set, on the assumption that stage masks are already maintained during traversal. But block-member uniforms reflected via blowUpActiveAggregate only OR in the stage bit when 'active' is true (the live-traversal path); the linker-object / non-active expansions (e.g. addUniform and addDereferencedUniform's AllBlockVariables expansion called with active=false) never set any stage bit. With EShReflectionAllBlockVariables, those variables therefore end up with stages==0 and the early return skips the fallback that would have set them, leaving a permanently empty stage mask.","fix":"Either do not early-return for non-active-reflected variables, or ensure the AllBlockVariables expansion path sets the stage bit for the variables it creates. Confirm intended semantics for inactive block variables before changing.","locations":[{"ref":"glslang/MachineIndependent/reflection.cpp:1166-1179","code":" 1166 | void TReflection::buildUniformStageMask(const TIntermediate& intermediate)\n 1167 | {\n 1168 |     if (options & EShReflectionAllBlockVariables)\n 1169 |         return;\n 1170 | \n 1171 |     for (int i = 0; i < int(indexToUniform.size()); ++i) {\n 1172 |         indexToUniform[i].stages = static_cast<EShLanguageMask>(indexToUniform[i].stages | 1 << intermediate.getStage());\n 1173 |     }\n 1174 | \n 1175 |     for (int i = 0; i < int(indexToBufferVariable.size()); ++i) {\n 1176 |         indexToBufferVariable[i].stages =\n 1177 |             static_cast<EShLanguageMask>(indexToBufferVariable[i].stages | 1 << intermediate.getStage());\n 1178 |     }\n 1179 | }","lines":14,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/reflection.cpp#L1166-L1179"},{"ref":"glslang/MachineIndependent/reflection.cpp:464-477","code":"  464 |             if ((reflection.options & EShReflectionAllBlockVariables) && active) {\n  465 |                 EShLanguageMask& stages = variables.back().stages;\n  466 |                 stages = static_cast<EShLanguageMask>(stages | 1 << intermediate.getStage());\n  467 |             }\n  468 |         } else {\n  469 |             if (arraySize > 1) {\n  470 |                 int& reflectedArraySize = variables[it->second].size;\n  471 |                 reflectedArraySize = std::max(arraySize, reflectedArraySize);\n  472 |             }\n  473 | \n  474 |             if ((reflection.options & EShReflectionAllBlockVariables) && active) {\n  475 |               EShLanguageMask& stages = variables[it->second].stages;\n  476 |               stages = static_cast<EShLanguageMask>(stages | 1 << intermediate.getStage());\n  477 |             }","lines":14,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/reflection.cpp#L464-L477"}]},
{"id":"LOGIC_34","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In the OpenGL (non-Vulkan) branch of compileAndLink, setEnvTarget hardcodes EShTargetSpv_1_0 instead of using the caller-supplied targetLanguageVersion parameter. The Vulkan branch (line 283) correctly passes targetLanguageVersion. Any test driven through loadFileCompileAndCheck with Semantics::OpenGL that requests a higher SPIR-V target version (e.g. EShTargetSpv_1_3) silently gets 1.0, so a regression in higher-version OpenGL SPIR-V generation would not be exercised.","fix":"Use the parameter: shader.setEnvTarget(glslang::EShTargetSpv, targetLanguageVersion); in the OpenGL branch, matching the Vulkan branch.","locations":[{"ref":"gtests/TestFixture.h:284-290","code":"  284 |             } else {\n  285 |                 shader.setEnvInput((controls & EShMsgReadHlsl) ? glslang::EShSourceHlsl\n  286 |                                                                : glslang::EShSourceGlsl,\n  287 |                                     stage, glslang::EShClientOpenGL, 100);\n  288 |                 shader.setEnvClient(glslang::EShClientOpenGL, clientTargetVersion);\n  289 |                 shader.setEnvTarget(glslang::EshTargetSpv, glslang::EShTargetSpv_1_0);\n  290 |             }","lines":7,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/gtests/TestFixture.h#L284-L290"}]},
{"id":"LOGIC_35","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In the aggregate EOpDot case, when the operands are an integer vector (vectorSize > 1, not float), neither branch fires: binOp stays EOpNull. Control then falls past the 'if (binOp != EOpNull)' block into the generic-operands path, where an integer dot is not a recognized operation, ultimately reaching the 'unknown glslang aggregate' missingFunctionality fallback. Integer dot products are thus silently unsupported via a confusing path rather than handled or clearly rejected here. Comment 'for scalar dot product, use multiply' also does not describe the float-vector branch.","fix":"Handle the non-float (integer) vector dot explicitly (e.g. via createMiscOperation/multiply-and-add) or emit an explicit missingFunctionality diagnostic for integer dot, rather than relying on the generic fallthrough.","locations":[{"ref":"SPIRV/GlslangToSpv.cpp:3943-3953","code":" 3943 |     case glslang::EOpDot:\n 3944 |     {\n 3945 |         // for scalar dot product, use multiply\n 3946 |         glslang::TIntermSequence& glslangOperands = node->getSequence();\n 3947 |         if (!glslangOperands[0]->getAsTyped()->getType().isLongVector() &&\n 3948 |             glslangOperands[0]->getAsTyped()->getVectorSize() == 1)\n 3949 |             binOp = glslang::EOpMul;\n 3950 |         else if (isTypeFloat(node->getType().getBasicType()))\n 3951 |             binOp = glslang::EOpDot;\n 3952 |         break;\n 3953 |     }","lines":11,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/SPIRV/GlslangToSpv.cpp#L3943-L3953"}]},
{"id":"LOGIC_36","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"After detecting a BuiltIn decoration operand, the code does --numOperands and ++op, then immediately calls disassembleImmediates(numOperands) and returns. The ++op has no effect because the loop is exited via return on the next statement; it is dead and misleading (suggests the loop continues).","fix":"Remove the dead `++op;` (the function returns immediately after disassembleImmediates), keeping only the numOperands adjustment.","locations":[{"ref":"SPIRV/disassemble.cpp:522-531","code":"  522 |         case OperandOptionalLiteral:\n  523 |         case OperandVariableLiterals:\n  524 |             if ((opCode == Op::OpDecorate && stream[word - 1] == Decoration::BuiltIn) ||\n  525 |                 (opCode == Op::OpMemberDecorate && stream[word - 1] == Decoration::BuiltIn)) {\n  526 |                 out << BuiltInString(stream[word++]);\n  527 |                 --numOperands;\n  528 |                 ++op;\n  529 |             }\n  530 |             disassembleImmediates(numOperands);\n  531 |             return;","lines":10,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/SPIRV/disassemble.cpp#L522-L531"}]},
{"id":"LOGIC_37","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"getRoundedNormalizedSignificand initializes *carry_bit=false and then, in the widening/up-cast path (num_throwaway_bits <= 0) and the no-rounding path (throwaway bits all zero), returns without ever updating it. Callers (castTo) read 'carried' and add it to the exponent. While carry can only occur during narrowing rounding, the contract that carry_bit is an out-parameter is only partially honored; relying on the caller's pre-knowledge is fragile.","fix":"Explicitly document that carry_bit is only meaningful on narrowing, or always assign *carry_bit in every return path for clarity and safety.","locations":[{"ref":"SPIRV/hex_float.h:750-766","code":"  750 |     *carry_bit = false;\n  751 |     other_uint_type out_val = 0;\n  752 |     uint_type significand = getNormalizedSignificand();\n  753 |     // If we are up-casting, then we just have to shift to the right location.\n  754 |     if (num_throwaway_bits <= 0) {\n  755 |       out_val = static_cast<other_uint_type>(significand);\n  756 |       uint_type shift_amount = static_cast<uint_type>(-num_throwaway_bits);\n  757 |       out_val = static_cast<other_uint_type>(out_val << shift_amount);\n  758 |       return out_val;\n  759 |     }\n  760 | \n  761 |     // If every non-representable bit is 0, then we don't have any casting to\n  762 |     // do.\n  763 |     if ((significand & throwaway_mask) == 0) {\n  764 |       return static_cast<other_uint_type>(\n  765 |           negatable_right_shift(num_throwaway_bits, significand));\n  766 |     }","lines":17,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/SPIRV/hex_float.h#L750-L766"}]},
{"id":"LOGIC_38","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"recordLocalPath assumes a fixed parse-time depth-of-one initialization: it only sets the directory of the includer when depth == 1, relying on the stack push done by readLocalPath/readSystemPath for deeper levels. The localDirectoryStack.resize(depth) discards entries on pop, but if includeLocal is ever called with depth == 0 (no active includer), resize(0) clears the stack and back() is never written, so a subsequent readLocalPath searches nothing. The depth==1 special-case is fragile and undocumented as an invariant.","fix":"Document the depth>=1 invariant, or handle depth==0 explicitly by seeding the stack with the includer directory regardless of depth.","locations":[{"ref":"StandAlone/DirStackFileIncluder.h:107-112","code":"  107 |     void recordLocalPath(const char * includerName, size_t depth)\n  108 |     {\n  109 |         localDirectoryStack.resize(depth);\n  110 |         if (depth == 1)\n  111 |             localDirectoryStack.back() = getDirectory(includerName);\n  112 |     }","lines":6,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/StandAlone/DirStackFileIncluder.h#L107-L112"}]},
{"id":"LOGIC_39","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"DirStackFileIncluder::newIncludeResult ignores short reads. It allocates 'length' bytes and calls file.read(content, length) but never checks file.gcount(); if the file shrank between the tellg() sizing and the read, the IncludeResult reports 'length' bytes of which the tail is uninitialized memory, which is then fed to the preprocessor.","fix":"Check file.gcount() against length and set the actual length (or zero-fill / error) when they differ.","locations":[{"ref":"StandAlone/DirStackFileIncluder.h:151-157","code":"  151 |     virtual IncludeResult* newIncludeResult(const std::string& path, std::ifstream& file, int length) const\n  152 |     {\n  153 |         char* content = new tUserDataElement [length];\n  154 |         file.seekg(0, file.beg);\n  155 |         file.read(content, length);\n  156 |         return new IncludeResult(path, content, length, content);\n  157 |     }","lines":7,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/StandAlone/DirStackFileIncluder.h#L151-L157"}]},
{"id":"LOGIC_40","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"isdigit/isNonDigit are called on raw 'char' values throughout argument parsing (e.g. ProcessBindingBase argv[arg][0], isValidIdentifier idn[i]). If char is signed and the input byte is >= 0x80, the value passed to isdigit is negative (and not EOF), which is undefined behavior per the C standard. Reachable with non-ASCII bytes in file names or identifiers on the command line.","fix":"Cast to unsigned char before passing to isdigit, e.g. isdigit(static_cast<unsigned char>(argv[arg][0])).","locations":[{"ref":"StandAlone/StandAlone.cpp:374-387","code":"  374 |     if (!isdigit(argv[arg][0])) {\n  375 |         if (argc < 3) // this form needs one more argument\n  376 |             usage();\n  377 | \n  378 |         lang = FindLanguage(argv[arg++], false);\n  379 |     }\n  380 | \n  381 |     if ((argc - arg) >= 2 && isdigit(argv[arg+0][0]) && isdigit(argv[arg+1][0])) {\n  382 |         // Parse a per-set binding base\n  383 |         do {\n  384 |             const int baseNum = atoi(argv[arg++]);\n  385 |             const int setNum = atoi(argv[arg++]);\n  386 |             perSetBase[setNum] = baseNum;\n  387 |         } while ((argc - arg) >= 2 && isdigit(argv[arg + 0][0]) && isdigit(argv[arg + 1][0]));","lines":14,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/StandAlone/StandAlone.cpp#L374-L387"},{"ref":"StandAlone/StandAlone.cpp:495-498","code":"  495 |     for (unsigned int i = 1; i < idn.length(); ++i) {\n  496 |         if (!(isdigit(idn[i]) || isNonDigit(idn[i]))) {\n  497 |             return false;\n  498 |         }","lines":4,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/StandAlone/StandAlone.cpp#L495-L498"}]},
{"id":"LOGIC_41","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"getAttachedNumber treats 0 as an error: 'if (num == 0) ... expected attached non-0 number'. This is used for -V<num> and -G<num> client input semantics. atoi also returns 0 for non-numeric input, so a legitimate '-V0' is indistinguishable from garbage and both are rejected. The downstream check only allows ClientInputSemanticsVersion == 100 anyway, so 0 is invalid in practice, but the error message ('expected attached non-0 number') is misleading for a typo like '-Vx'.","fix":"Parse with strtol and check end-pointer to distinguish 'no number' from an explicit 0; emit a clearer message such as 'expected attached integer'.","locations":[{"ref":"StandAlone/StandAlone.cpp:585-592","code":"  585 |     const auto getAttachedNumber = [&](const char* desc) {\n  586 |         int num = atoi(argv[0] + 2);\n  587 |         if (num == 0) {\n  588 |             printf(\"%s: expected attached non-0 number\\n\", desc);\n  589 |             exit(EFailUsage);\n  590 |         }\n  591 |         return num;\n  592 |     };","lines":8,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/StandAlone/StandAlone.cpp#L585-L592"}]},
{"id":"LOGIC_42","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"For --entry-point, the value is read (entryPointName = argv[1]) BEFORE the bounds check 'if (argc <= 1) Error(...)'. When --entry-point is the last argument, argv[1] is the NULL argv terminator and entryPointName is set to nullptr before the error path runs. While reading argv[argc] is technically defined (it is the guaranteed NULL terminator), the order is backwards and inconsistent with the rest of the parser; the assignment should follow the check.","fix":"Reorder: check 'if (argc <= 1) Error(\"no <name> provided\", lowerword.c_str());' first, then 'entryPointName = argv[1];', then bumpArg().","locations":[{"ref":"StandAlone/StandAlone.cpp:675-679","code":"  675 |                     } else if (lowerword == \"entry-point\") {\n  676 |                         entryPointName = argv[1];\n  677 |                         if (argc <= 1)\n  678 |                             Error(\"no <name> provided\", lowerword.c_str());\n  679 |                         bumpArg();","lines":5,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/StandAlone/StandAlone.cpp#L675-L679"}]},
{"id":"LOGIC_43","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"Same backwards order as --entry-point: for -e, 'entryPointName = argv[1];' executes before 'if (argc <= 1) Error(...)'. The value is consumed before being validated; should validate first.","fix":"Move the 'if (argc <= 1) Error(\"no <name> provided for -e\");' check above the 'entryPointName = argv[1];' assignment.","locations":[{"ref":"StandAlone/StandAlone.cpp:1022-1026","code":" 1022 |             case 'e':\n 1023 |                 entryPointName = argv[1];\n 1024 |                 if (argc <= 1)\n 1025 |                     Error(\"no <name> provided for -e\");\n 1026 |                 bumpArg();","lines":5,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/StandAlone/StandAlone.cpp#L1022-L1026"}]},
{"id":"LOGIC_44","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The block-storage / global-block override settings (blockStorageOverrides, setGlobalBufferBlock, setGlobalUniformBlock) are only applied to the shader when VulkanRulesRelaxed (-R) is set (lines 1441-1457). A user passing --set-block-storage or --set-default-uniform-block without -R gets their option silently ignored with no warning, unlike most mismatched-option combinations which call Error().","fix":"Either emit a warning/Error when these overrides are supplied without -R, or apply them unconditionally as appropriate.","locations":[{"ref":"StandAlone/StandAlone.cpp:1448-1464","code":" 1448 |         if (VulkanRulesRelaxed) {\n 1449 |             for (auto& storageOverride : blockStorageOverrides) {\n 1450 |                 shader->addBlockStorageOverride(storageOverride.first.c_str(),\n 1451 |                     storageOverride.second);\n 1452 |             }\n 1453 | \n 1454 |             if (setGlobalBufferBlock) {\n 1455 |                 shader->setAtomicCounterBlockName(atomicCounterBlockName.c_str());\n 1456 |                 shader->setAtomicCounterBlockSet(atomicCounterBlockSet);\n 1457 |             }\n 1458 | \n 1459 |             if (setGlobalUniformBlock) {\n 1460 |                 shader->setGlobalUniformBlockName(globalUniformName.c_str());\n 1461 |                 shader->setGlobalUniformSet(globalUniformSet);\n 1462 |                 shader->setGlobalUniformBinding(globalUniformBinding);\n 1463 |             }\n 1464 |         }","lines":17,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/StandAlone/StandAlone.cpp#L1448-L1464"}]},
{"id":"LOGIC_45","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In acceptDeclaration(), when a locally-scoped static (storage EvqGlobal, not at global level) is declared, line 525 builds the global initializer aggregate using idToken.loc. If the 'while (acceptIdentifier(idToken))' loop ran zero times (e.g. 'static int ;' with no declarator), idToken is the default-constructed token whose loc was only zero-initialized, so the AST node and any diagnostics get a meaningless source location rather than the declaration's location.","fix":"Capture the declaration location (e.g. the 'loc' saved in acceptFullySpecifiedType, or token.loc at the start of the declarator loop) and use it for growAggregate instead of idToken.loc, which is only valid when at least one declarator was parsed.","locations":[{"ref":"glslang/HLSL/hlslGrammar.cpp:523-525","code":"  523 |     // if we have a locally scoped static, it needs a globally scoped initializer\n  524 |     if (declaredType.getQualifier().storage == EvqGlobal && !parseContext.symbolTable.atGlobalLevel()) {\n  525 |         unitNode = intermediate.growAggregate(unitNode, initializers, idToken.loc);","lines":3,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/HLSL/hlslGrammar.cpp#L523-L525"}]},
{"id":"LOGIC_46","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"acceptStruct() declares the user type with parseContext.declareStruct(token.loc, ...) only after the full member list and the closing RIGHT_BRACE have been consumed (line 2454 advanced past '}'). token.loc therefore points at whatever follows the struct body, not at the struct declaration, so any redefinition/error diagnostics emitted by declareStruct are attributed to the wrong source location.","fix":"Save the struct's source location (e.g. at the STRUCT/CLASS keyword or the struct-name identifier) and pass that saved loc to declareStruct instead of the post-'}' token.loc.","locations":[{"ref":"glslang/HLSL/hlslGrammar.cpp:2455-2470","code":" 2455 |     // RIGHT_BRACE\n 2456 |     if (! acceptTokenClass(EHTokRightBrace)) {\n 2457 |         expected(\"}\");\n 2458 |         return false;\n 2459 |     }\n 2460 | \n 2461 |     // create the user-defined type\n 2462 |     if (storageQualifier == EvqTemporary)\n 2463 |         new(&type) TType(typeList, structName);\n 2464 |     else {\n 2465 |         postDeclQualifier.storage = storageQualifier;\n 2466 |         postDeclQualifier.readonly = readonly;\n 2467 |         new(&type) TType(typeList, structName, postDeclQualifier); // sets EbtBlock\n 2468 |     }\n 2469 | \n 2470 |     parseContext.declareStruct(token.loc, structName, type);","lines":16,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/HLSL/hlslGrammar.cpp#L2455-L2470"}]},
{"id":"LOGIC_47","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"acceptConditionalExpression() increments parseContext.controlFlowNestingLevel (line 3217) but the three error returns at the parsing of the true expression, the ':' token, and the false expression (lines 3222, 3228, 3234) return before the matching decrement at line 3237, leaving controlFlowNestingLevel permanently elevated. The code comment acknowledges 'this only needs to work right if no errors', but the imbalance can mislead later control-flow checks that run despite earlier errors.","fix":"Use a Defer (as done in acceptIterationStatement) to decrement controlFlowNestingLevel on all exit paths, or decrement before each early 'return false'.","locations":[{"ref":"glslang/HLSL/hlslGrammar.cpp:3219-3239","code":" 3219 |     ++parseContext.controlFlowNestingLevel;  // this only needs to work right if no errors\n 3220 | \n 3221 |     TIntermTyped* trueNode = nullptr;\n 3222 |     if (! acceptExpression(trueNode)) {\n 3223 |         expected(\"expression after ?\");\n 3224 |         return false;\n 3225 |     }\n 3226 |     TSourceLoc loc = token.loc;\n 3227 | \n 3228 |     if (! acceptTokenClass(EHTokColon)) {\n 3229 |         expected(\":\");\n 3230 |         return false;\n 3231 |     }\n 3232 | \n 3233 |     TIntermTyped* falseNode = nullptr;\n 3234 |     if (! acceptAssignmentExpression(falseNode)) {\n 3235 |         expected(\"expression after :\");\n 3236 |         return false;\n 3237 |     }\n 3238 | \n 3239 |     --parseContext.controlFlowNestingLevel;","lines":21,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/HLSL/hlslGrammar.cpp#L3219-L3239"}]},
{"id":"LOGIC_48","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In transferTypeAttributes, the EatConstantId case declares a new local 'TSourceLoc loc' that shadows the function's 'loc' parameter, immediately default-initializes it via loc.init(), and passes that empty location to setSpecConstantId. Any diagnostic emitted by setSpecConstantId will report an invalid/zeroed source location instead of the real attribute location that the caller passed in.","fix":"Remove the shadowing local 'TSourceLoc loc; loc.init();' and pass the function parameter 'loc' to setSpecConstantId.","locations":[{"ref":"glslang/HLSL/hlslParseHelper.cpp:1987-1997","code":" 1987 |         case EatConstantId:\n 1988 |             // specialization constant\n 1989 |             if (type.getQualifier().storage != EvqConst) {\n 1990 |                 error(loc, \"needs a const type\", \"constant_id\", \"\");\n 1991 |                 break;\n 1992 |             }\n 1993 |             if (it->getInt(value)) {\n 1994 |                 TSourceLoc loc;\n 1995 |                 loc.init();\n 1996 |                 setSpecConstantId(loc, type.getQualifier(), (unsigned)value);\n 1997 |             }","lines":11,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/HLSL/hlslParseHelper.cpp#L1987-L1997"}]},
{"id":"LOGIC_49","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The std::hash<TString> FNV-1a implementation accumulates into a 32-bit 'unsigned' (_Val) and returns it as size_t. On 64-bit platforms this needlessly limits the hash to 32 bits of entropy, increasing collisions in unordered_map/unordered_set keyed by TString. The constants are also the 32-bit FNV parameters; on a 64-bit size_t the 64-bit FNV constants would be the natural choice.","fix":"Use std::size_t for _Val and the FNV constants (FNV-1a 64-bit basis 14695981039346656037ULL, prime 1099511628211ULL) when size_t is 64-bit, so the full hash width is used.","locations":[{"ref":"glslang/Include/Common.h:130-146","code":"  130 |     template<> struct hash<glslang::TString> {\n  131 |         std::size_t operator()(const glslang::TString& s) const\n  132 |         {\n  133 |             const unsigned _FNV_offset_basis = 2166136261U;\n  134 |             const unsigned _FNV_prime = 16777619U;\n  135 |             unsigned _Val = _FNV_offset_basis;\n  136 |             size_t _Count = s.size();\n  137 |             const char* _First = s.c_str();\n  138 |             for (size_t _Next = 0; _Next < _Count; ++_Next)\n  139 |             {\n  140 |                 _Val ^= (unsigned)_First[_Next];\n  141 |                 _Val *= _FNV_prime;\n  142 |             }\n  143 | \n  144 |             return _Val;\n  145 |         }\n  146 |     };","lines":17,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/Include/Common.h#L130-L146"}]},
{"id":"LOGIC_50","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"TInfoSinkBase::location formats ':%d:%d' into a 24-byte buffer. Two worst-case ints (':-2147483648:-2147483648') need 25 bytes including the terminating NUL, so the location string is silently truncated by snprintf for extreme line/column values. Not a buffer overflow (snprintf is bounded) but produces a corrupted/incomplete location in the info log.","fix":"Size the buffer for two full ints, e.g. maxSize = 32 (or compute from std::numeric_limits<int>::digits10).","locations":[{"ref":"glslang/Include/InfoSink.h:100-107","code":"  100 |     void location(const TSourceLoc& loc, bool absolute = false, bool displayColumn = false) {\n  101 |         const int maxSize = 24;\n  102 |         char locText[maxSize];\n  103 |         if (displayColumn) {\n  104 |             snprintf(locText, maxSize, \":%d:%d\", loc.line, loc.column);\n  105 |         } else {\n  106 |             snprintf(locText, maxSize, \":%d\", loc.line);\n  107 |         }","lines":8,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/Include/InfoSink.h#L100-L107"}]},
{"id":"LOGIC_51","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"TInfoSinkBase::checkMem ignores the requested 'growth' when it grows the buffer: it reserves capacity()*1.5 regardless of how large growth is. If growth exceeds capacity()/2, a single checkMem call does not guarantee capacity() >= size()+growth+2, so the stated invariant (ensure room for growth+2) is not actually established. It happens to be masked because std::string append reallocates on its own, making this growth heuristic effectively dead/ineffective code.","fix":"Reserve max(capacity()*3/2, size()+growth+2) so the requested growth is actually accommodated, or remove the hand-rolled growth heuristic and rely on std::string.","locations":[{"ref":"glslang/Include/InfoSink.h:162-163","code":"  162 |     void checkMem(size_t growth) { if (sink.capacity() < sink.size() + growth + 2)\n  163 |                                        sink.reserve(sink.capacity() +  sink.capacity() / 2); }","lines":2,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/Include/InfoSink.h#L162-L163"}]},
{"id":"LOGIC_52","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"TShaderQualifiers::merge gates localSize override on `src.localSize[i] > 1`, so an explicitly-declared work-group dimension of exactly 1 never overrides the default. The companion localSizeNotDefault[] flag (which exists precisely to distinguish an explicit 1 from the default 1) is merged separately but is not consulted here, so a `local_size_x = 1` declaration is silently dropped during merge.","fix":"Drive the override off localSizeNotDefault, e.g. `if (src.localSizeNotDefault[i]) localSize[i] = src.localSize[i];`, consistent with how that flag is used elsewhere.","locations":[{"ref":"glslang/Include/Types.h:1471-1474","code":" 1471 |         for (int i = 0; i < 3; ++i) {\n 1472 |             if (src.localSize[i] > 1)\n 1473 |                 localSize[i] = src.localSize[i];\n 1474 |         }","lines":4,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/Include/Types.h#L1471-L1474"}]},
{"id":"LOGIC_53","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"addInnerSize(TArraySize pair) sets implicitlySized=false, but the overloads addInnerSize(int s) and addInnerSize(int s, TIntermTyped* n) push a real (possibly sized) dimension without updating implicitlySized. Adding a concrete inner size through the int overloads thus leaves implicitlySized in whatever state it was (default true), making isImplicitlySized()/isDefaultImplicitlySized() report inconsistently depending only on which overload the caller happened to use.","fix":"Decide the intended invariant and apply it uniformly: if adding any explicit inner size should clear implicitlySized, set it in the shared path; otherwise document why the TArraySize overload differs.","locations":[{"ref":"glslang/Include/arrays.h:277-283","code":"  277 |     void addInnerSize() { addInnerSize((unsigned)UnsizedArraySize); }\n  278 |     void addInnerSize(int s) { addInnerSize((unsigned)s, nullptr); }\n  279 |     void addInnerSize(int s, TIntermTyped* n) { sizes.push_back((unsigned)s, n); }\n  280 |     void addInnerSize(TArraySize pair) {\n  281 |         sizes.push_back(pair.size, pair.node);\n  282 |         implicitlySized = false;\n  283 |     }","lines":7,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/Include/arrays.h#L277-L283"}]},
{"id":"LOGIC_54","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"EOpRoundEven computes 'even' as `flr / 2.0 == floor(flr / 2.0)`, i.e. testing whether floor(x) is an even integer using floating-point division/comparison. For large magnitudes where the floor value exceeds the exact-integer range of double this parity test is unreliable, and the branch then picks ceil(x-0.5) vs floor(x+0.5). For typical small constants it is correct, but the parity-by-division approach is fragile compared to using fmod or remainder.","fix":"Determine evenness with `std::fmod(flr, 2.0) == 0.0` (or remainder), and keep the round-half-to-even selection; this is clearer and avoids the divide/compare parity heuristic.","locations":[{"ref":"glslang/MachineIndependent/Constant.cpp:843-850","code":"  843 |         case EOpRoundEven:\n  844 |         {\n  845 |             double flr = floor(unionArray[i].getDConst());\n  846 |             bool even = flr / 2.0 == floor(flr / 2.0);\n  847 |             double rounded = even ? ceil(unionArray[i].getDConst() - 0.5) : floor(unionArray[i].getDConst() + 0.5);\n  848 |             newConstArray[i].setDConst(rounded);\n  849 |             break;\n  850 |         }","lines":8,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/Constant.cpp#L843-L850"}]},
{"id":"LOGIC_55","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"textureGatherOffsets gets the AEP_gpu_shader5 extension requirement only when version == 310 (vertex path, line 9135-9136), but the fragment path uses version < 320 (line 9517-9518) for the equivalent tagging. The two should agree; the exact-equality 310 test misses ES 311 where the extension still applies, producing an inconsistent gate between stages.","fix":"Use 'version < 320' (consistent with line 9517) instead of 'version == 310' for textureGatherOffsets in the vertex/common path.","locations":[{"ref":"glslang/MachineIndependent/Initialize.cpp:9307-9308","code":" 9307 |                 if (version == 310)\n 9308 |                     symbolTable.setFunctionExtensions(\"textureGatherOffsets\", Num_AEP_gpu_shader5, AEP_gpu_shader5);","lines":2,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/Initialize.cpp#L9307-L9308"}]},
{"id":"LOGIC_56","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The SWITCH/DEFAULT case calls reservedWord() but discards its return value (reservedWord() returns 0 and may emit 'Reserved word.' error) and then unconditionally 'return keyword'. For ES<300 / desktop<130 this both raises a reserved-word error AND proceeds to treat the token as the real SWITCH/DEFAULT keyword, instead of degrading to an identifier. Several other early cases (FLAT, ATTRIBUTE/VARYING) follow the same discard-and-continue pattern intentionally, but here it means a hard error is produced while parsing still continues as a keyword, which is inconsistent with the identifierOrType() fallback used by most version-gated keywords.","fix":"Decide intended behavior: either 'return reservedWord();' (degrade to 0/identifier) or drop the reservedWord() call. Match the convention used for other version-gated keywords.","locations":[{"ref":"glslang/MachineIndependent/Scan.cpp:1028-1033","code":" 1028 |     case SWITCH:\n 1029 |     case DEFAULT:\n 1030 |         if ((parseContext.isEsProfile() && parseContext.version < 300) ||\n 1031 |             (!parseContext.isEsProfile() && parseContext.version < 130))\n 1032 |             reservedWord();\n 1033 |         return keyword;","lines":6,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/Scan.cpp#L1028-L1033"}]},
{"id":"LOGIC_57","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"unget() recomputes column by scanning backwards for a newline using sources[currentSource][chIndex] starting at chIndex = currentChar. After the preceding '--currentChar', currentChar can be 0, and the while loop condition is 'chIndex > 0', so for a column that just wrapped past a newline at position 0 the reported column becomes 0 regardless. More importantly the scan reads sources[currentSource][chIndex] without consulting lengths[currentSource]; it assumes currentChar is a valid in-bounds index of the current source, which is only true because of invariants maintained elsewhere - there is no defensive bound. This is fragile coupling between advance()/get() and unget().","fix":"Bound chIndex against lengths[currentSource] and document the invariant that currentChar < lengths[currentSource] holds whenever this branch executes.","locations":[{"ref":"glslang/MachineIndependent/Scan.h:133-146","code":"  133 |             if (loc[currentSource].column < 0) {\n  134 |                 // We've moved back past a new line. Find the\n  135 |                 // previous newline (or start of the file) to compute\n  136 |                 // the column count on the now current line.\n  137 |                 size_t chIndex = currentChar;\n  138 |                 while (chIndex > 0) {\n  139 |                     if (sources[currentSource][chIndex] == '\\n') {\n  140 |                         break;\n  141 |                     }\n  142 |                     --chIndex;\n  143 |                 }\n  144 |                 logicalSourceLoc.column = (int)(currentChar - chIndex);\n  145 |                 loc[currentSource].column = (int)(currentChar - chIndex);\n  146 |             }","lines":14,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/Scan.h#L133-L146"}]},
{"id":"LOGIC_58","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"The built-ins parse-result check reads 'if (! parseContext->parseShaderStrings(ppContext, input) != 0)'. parseShaderStrings returns bool; '!' binds tighter than '!=', so this evaluates as '((!result) != 0)', i.e. simply '!result'. It happens to behave correctly (error branch taken on parse failure) but the '!= 0' is meaningless and the double-negation is misleading - any reader will misread the intent.","fix":"Replace with 'if (! parseContext->parseShaderStrings(ppContext, input)) {'.","locations":[{"ref":"glslang/MachineIndependent/ShaderLang.cpp:281-287","code":"  281 |     if (! parseContext->parseShaderStrings(ppContext, input) != 0) {\n  282 |         infoSink.info.message(EPrefixInternalError, \"Unable to parse built-ins\");\n  283 |         printf(\"Unable to parse built-ins\\n%s\\n\", infoSink.info.c_str());\n  284 |         printf(\"%s\\n\", builtInShaders[0]);\n  285 | \n  286 |         return false;\n  287 |     }","lines":7,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/ShaderLang.cpp#L281-L287"}]},
{"id":"LOGIC_59","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"TFunction::dump (non-complete branch) appends a stray literal \"n\" after the mangled name (probably an intended \"\\n\" that was mistyped), then a real \"\\n\" is appended right after. Output gets a spurious 'n' character. Debug-only, but misleading.","fix":"Drop the trailing \"n\" literal (the subsequent infoSink.debug << \"\\n\" already terminates the line).","locations":[{"ref":"glslang/MachineIndependent/SymbolTable.cpp:265-269","code":"  265 |         infoSink.debug << getName().c_str() << \": \" << returnType.getBasicTypeString() << \" \"\n  266 |                        << getMangledName().c_str() << \"n\";\n  267 |     }\n  268 | \n  269 |     infoSink.debug << \"\\n\";","lines":5,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/SymbolTable.cpp#L265-L269"}]},
{"id":"LOGIC_60","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"TSymbolTableLevel::relateToOperator calls getAsFunction()->relateToOperator(op) with no null check. Any entry whose key string contains '(' and shares the prefix with 'name' is assumed to be a TFunction; if a non-function symbol ever keys with a '(' (or a malformed entry exists) getAsFunction() returns nullptr and this null-derefs. The sibling routines (setFunctionExtensions) avoid this by going through the base TSymbol pointer.","fix":"Null-check the result: 'if (TFunction* function = candidate->second->getAsFunction()) function->relateToOperator(op);'.","locations":[{"ref":"glslang/MachineIndependent/SymbolTable.cpp:330-331","code":"  330 |             TFunction* function = (*candidate).second->getAsFunction();\n  331 |             function->relateToOperator(op);","lines":2,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/SymbolTable.cpp#L330-L331"}]},
{"id":"LOGIC_61","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"TVariable's copy constructor never initializes the 'anonId' member. The primary constructors set anonId(-1), but the copy constructor (used by clone()) leaves it indeterminate. Cloned anonymous-block container variables therefore carry a garbage anonId; getAnonId() on a cloned TVariable returns junk.","fix":"Add 'anonId = copyOf.anonId;' to the TVariable copy constructor.","locations":[{"ref":"glslang/MachineIndependent/SymbolTable.cpp:403-426","code":"  403 | TVariable::TVariable(const TVariable& copyOf) : TSymbol(copyOf)\n  404 | {\n  405 |     type.deepCopy(copyOf.type);\n  406 |     userType = copyOf.userType;\n  407 | \n  408 |     // we don't support specialization-constant subtrees in cloned tables, only extensions\n  409 |     constSubtree = nullptr;\n  410 |     extensions = nullptr;\n  411 |     memberExtensions = nullptr;\n  412 |     if (copyOf.getNumExtensions() > 0)\n  413 |         setExtensions(copyOf.getNumExtensions(), copyOf.getExtensions());\n  414 |     if (copyOf.hasMemberExtensions()) {\n  415 |         for (int m = 0; m < (int)copyOf.type.getStruct()->size(); ++m) {\n  416 |             if (copyOf.getNumMemberExtensions(m) > 0)\n  417 |                 setMemberExtensions(m, copyOf.getNumMemberExtensions(m), copyOf.getMemberExtensions(m));\n  418 |         }\n  419 |     }\n  420 | \n  421 |     if (! copyOf.constArray.empty()) {\n  422 |         assert(! copyOf.type.isStruct());\n  423 |         TConstUnionArray newArray(copyOf.constArray, 0, copyOf.constArray.size());\n  424 |         constArray = newArray;\n  425 |     }\n  426 | }","lines":24,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/SymbolTable.cpp#L403-L426"}]},
{"id":"LOGIC_62","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"TSymbolTableLevel::findFunctionNameList assumes 'name' always contains '('. If parenAt == npos (no paren), 'TString base(name, 0, parenAt + 1)' uses npos+1 == 0 producing an empty string, and 'base[parenAt]' indexes base[npos], an out-of-bounds write on the string buffer. Relies entirely on callers never passing an unparenthesised name.","fix":"Guard for npos (return early if name has no '('), or assert parenAt != npos before the base[parenAt] = ')' write.","locations":[{"ref":"glslang/MachineIndependent/SymbolTable.h:532-539","code":"  532 |     void findFunctionNameList(const TString& name, TVector<const TFunction*>& list)\n  533 |     {\n  534 |         size_t parenAt = name.find_first_of('(');\n  535 |         TString base(name, 0, parenAt + 1);\n  536 | \n  537 |         tLevel::const_iterator begin = level.lower_bound(base);\n  538 |         base[parenAt] = ')';  // assume ')' is lexically after '('\n  539 |         tLevel::const_iterator end = level.upper_bound(base);","lines":8,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/SymbolTable.h#L532-L539"}]},
{"id":"LOGIC_63","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"profileRequires single-extension entry point passes 'extension ? 1 : 0' as the count but always passes &extension as the array. When extension is non-null this is correct; the multi-extension overload handles count 0 fine. However callers frequently pass a literal nullptr (e.g. checkExtensionStage profileRequires(...,nullptr,...)) which correctly yields count 0. This is consistent, but note the dependent: when minVersion is 0 AND extension is nullptr, profileRequires can never become okay and will always error for matching profiles. Verify no caller relies on a (minVersion==0, extension==nullptr) combination as a no-op; such a call is effectively an unconditional error for the masked profiles.","fix":"No code change required if no caller uses (0, nullptr); otherwise document that minVersion==0 with no extension is an unconditional error. Consider asserting minVersion>0 || numExtensions>0 to catch accidental no-op-intended calls.","locations":[{"ref":"glslang/MachineIndependent/Versions.cpp:907-911","code":"  907 | void TParseVersions::profileRequires(const TSourceLoc& loc, int profileMask, int minVersion, const char* extension,\n  908 |     const char* featureDesc)\n  909 | {\n  910 |     profileRequires(loc, profileMask, minVersion, extension ? 1 : 0, &extension, featureDesc);\n  911 | }","lines":5,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/Versions.cpp#L907-L911"},{"ref":"glslang/MachineIndependent/Versions.cpp:884-904","code":"  884 | void TParseVersions::profileRequires(const TSourceLoc& loc, int profileMask, int minVersion, int numExtensions,\n  885 |     const char* const extensions[], const char* featureDesc)\n  886 | {\n  887 |     if (profile & profileMask) {\n  888 |         bool okay = minVersion > 0 && version >= minVersion;\n  889 |         for (int i = 0; i < numExtensions; ++i) {\n  890 |             switch (getExtensionBehavior(extensions[i])) {\n  891 |             case EBhWarn:\n  892 |                 infoSink.info.message(EPrefixWarning, (\"extension \" + TString(extensions[i]) + \" is being used for \" + featureDesc).c_str(), loc, messages & EShMsgAbsolutePath, messages & EShMsgDisplayErrorColumn);\n  893 |                 [[fallthrough]];\n  894 |             case EBhRequire:\n  895 |             case EBhEnable:\n  896 |                 okay = true;\n  897 |                 break;\n  898 |             default: break; // some compilers want this\n  899 |             }\n  900 |         }\n  901 |         if (! okay)\n  902 |             error(loc, \"not supported for this version or the enabled extensions\", featureDesc, \"\");\n  903 |     }\n  904 | }","lines":21,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/Versions.cpp#L884-L904"}]},
