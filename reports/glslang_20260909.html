{"id":"LOGIC_64","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"positiveUnsignedArgument rejects only value == 0 but accepts negative integers, which are then reinterpreted via (unsigned int)value into a huge value (e.g. -1 -> 4294967295). The 'positive' intent is not enforced for negatives. unsignedArgument has the same silent sign-conversion. For iteration_multiple etc. this lets a negative literal produce an absurd unrolling/iteration count instead of an error.","fix":"Reject value < 0 (or <= 0 for the strictly-positive case) before casting to unsigned, emitting the same 'must be ...' error used for the zero case.","locations":[{"ref":"glslang/MachineIndependent/attribute.cpp:283-296","code":"  283 |         const auto positiveUnsignedArgument = [&](const char* feature, unsigned int& uiValue) {\n  284 |             int value;\n  285 |             if (it->size() == 1 && it->getInt(value)) {\n  286 |                 if (value == 0) {\n  287 |                     error(node->getLoc(), \"must be greater than or equal to 1\", feature, \"\");\n  288 |                     return false;\n  289 |                 }\n  290 |             } else {\n  291 |                 warn(node->getLoc(), \"expected a single integer argument\", feature, \"\");\n  292 |                 return false;\n  293 |             }\n  294 |             uiValue = (unsigned int)value;\n  295 |             return true;\n  296 |         };","lines":14,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/attribute.cpp#L283-L296"}]},
{"id":"LOGIC_65","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"checkLocationOverlap returns -2 to signal 'same-named uniform with identical location range' (acceptable re-declaration). The caller only handles overlapLocation == -1 (add) and overlapLocation >= 0 (error), so -2 falls through silently - which is the intended no-op, but the -2 sentinel is undocumented and fragile: any future caller that does 'overlapLocation != -1' to mean 'collision' would misclassify -2. The magic numbers -1/-2 and the >=0 branch are easy to break.","fix":"Replace the int sentinel triple-meaning with an explicit enum/result struct (e.g. {NoCollision, SameUniformExact, Conflict}) so the 'identical re-declaration is OK' case is named and cannot be confused with a collision code.","locations":[{"ref":"glslang/MachineIndependent/iomapper.cpp:487-503","code":"  487 |     int checkLocationOverlap(const TRange& locationRange, std::vector<TRange>& usedUniformLocation, const TString symbolName, std::vector<TString>& usedUniformName, bool& diffLocation)\n  488 |     {\n  489 |         for (size_t r = 0; r < usedUniformLocation.size(); ++r) {\n  490 |             if (usedUniformName[r] == symbolName) {\n  491 |                 diffLocation = true;\n  492 |                 return (usedUniformLocation[r].start == locationRange.start &&\n  493 |                         usedUniformLocation[r].last == locationRange.last)\n  494 |                        ? -2 : std::max(locationRange.start, usedUniformLocation[r].start);\n  495 |             }\n  496 |             if (locationRange.overlap(usedUniformLocation[r])) {\n  497 |                 // there is a collision; pick one\n  498 |                 return std::max(locationRange.start, usedUniformLocation[r].start);\n  499 |             }\n  500 |         }\n  501 | \n  502 |         return -1; // no collision\n  503 |     }","lines":17,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/iomapper.cpp#L487-L503"},{"ref":"glslang/MachineIndependent/iomapper.cpp:436-454","code":"  436 |                         // Overlap locations of uniforms, regardless of components (multi stages)\n  437 |                         if (overlapLocation == -1) {\n  438 |                             usedUniformLocation.push_back(locationRange);\n  439 |                             usedUniformName.push_back(symbolName);\n  440 |                         }\n  441 |                         else if (overlapLocation >= 0) {\n  442 |                             if (diffLocation == true) {\n  443 |                                 TString err = (\"Uniform location should be equal for same uniforms: \" +std::to_string(overlapLocation)).c_str();\n  444 |                                 infoSink.info.message(EPrefixInternalError, err.c_str());\n  445 |                                 hadError = true;\n  446 |                                 break;\n  447 |                             }\n  448 |                             else {\n  449 |                                 TString err = (\"Uniform location overlaps across stages: \" + std::to_string(overlapLocation)).c_str();\n  450 |                                 infoSink.info.message(EPrefixInternalError, err.c_str());\n  451 |                                 hadError = true;\n  452 |                                 break;\n  453 |                             }\n  454 |                         }","lines":19,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/iomapper.cpp#L436-L454"}]},
{"id":"LOGIC_66","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In mergeErrorCheck the layout-offset mismatch check is gated on symbol.getQualifier().hasBinding() (line 1501), which is unrelated to offsets. This appears to be a copy/typo from the preceding binding check (line 1497); it should gate on hasOffset()/the unit symbol's offset presence. As written, layout offset mismatches are only reported when a binding happens to be present, and offset mismatches are silently ignored for symbols without a binding, while symbols with a binding but no explicit offset compare against the default offset.","fix":"Gate the offset comparison on offset presence, e.g. if (symbol.getQualifier().hasOffset() && unitSymbol.getQualifier().hasOffset() && symbol.getQualifier().layoutOffset != unitSymbol.getQualifier().layoutOffset).","locations":[{"ref":"glslang/MachineIndependent/linkValidate.cpp:1497-1504","code":" 1497 |     if (symbol.getQualifier().hasBinding() && unitSymbol.getQualifier().hasBinding() && symbol.getQualifier().layoutBinding != unitSymbol.getQualifier().layoutBinding) {\n 1498 |         error(infoSink, \"Layout binding qualifier must match:\", unitStage);\n 1499 |         layoutQualifierError = true;\n 1500 |     }\n 1501 |     if (symbol.getQualifier().hasBinding() && (symbol.getQualifier().layoutOffset != unitSymbol.getQualifier().layoutOffset)) {\n 1502 |         error(infoSink, \"Layout offset qualifier must match:\", unitStage);\n 1503 |         layoutQualifierError = true;\n 1504 |     }","lines":8,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/linkValidate.cpp#L1497-L1504"}]},
{"id":"LOGIC_67","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"CPPline computes lineRes adjustments but uses the post-adjusted value inconsistently. lineToken is captured before the '++lineRes'/'--lineRes' adjustments and passed to notifyLineDirective, while setCurrentLine gets the adjusted lineRes. The '++lineRes' when token=='\\n' (accounting for the trailing newline being consumed) combined with the unconditional 'if (lineDirectiveShouldSetNextLine) --lineRes' can double-count: when the directive has no trailing tokens the net effect differs from the documented '#line line' semantics. Worth verifying against the spec's next-line definition.","fix":"Re-derive the intended current-line value explicitly (target line minus 1 only once) rather than mutating lineRes through two independent adjustments; add a unit test for '#line N' with and without lineDirectiveShouldSetNextLine.","locations":[{"ref":"glslang/MachineIndependent/preprocessor/Pp.cpp:780-787","code":"  780 |     if (! lineErr) {\n  781 |         lineToken = lineRes;\n  782 |         if (token == '\\n')\n  783 |             ++lineRes;\n  784 | \n  785 |         if (parseContext.lineDirectiveShouldSetNextLine())\n  786 |             --lineRes;\n  787 |         parseContext.setCurrentLine(lineRes);","lines":8,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/preprocessor/Pp.cpp#L780-L787"}]},
{"id":"LOGIC_68","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"addAtomFixed resizes stringMap to 'atom + 100' when atom is out of range, but indexes stringMap[atom] afterward assuming atom fits. getString(atom) (used widely, e.g. error reporting with getString(token) on raw token values in CPPerror line 829) does an unchecked stringMap[atom] dereference. A token value that is a negative sentinel (e.g. tMarkerInput::marker == -3, PUSH/POP -4/-5) or any atom never inserted would index out of bounds / deref a null. CPPerror's default branch calls getString(token) on arbitrary punctuation token codes that may never have been added as atoms.","fix":"Bounds-check atom in getString (return badToken for out-of-range/negative atoms), and avoid passing non-atom punctuation token codes into getString.","locations":[{"ref":"glslang/MachineIndependent/preprocessor/PpContext.h:158","code":"  158 |     const char* getString(int atom) const { return stringMap[atom]->c_str(); }","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/preprocessor/PpContext.h#L158"},{"ref":"glslang/MachineIndependent/preprocessor/Pp.cpp:840","code":"  840 |             message.append(atomStrings.getString(token));","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/preprocessor/Pp.cpp#L840"}]},
{"id":"LOGIC_69","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"saveName in lFloatConst uses the guard `if (len <= MaxTokenLength)` whereas every other place in this file that fills ppToken->name uses `if (len < MaxTokenLength)`. The off-by-one is technically in-bounds for the array write itself (buffer is MaxTokenLength+1 bytes) but it lets len reach MaxTokenLength+1, which is what makes the unclamped '#INF' terminator (see other finding) and any future unclamped name[len] write overflow. The inconsistency is a latent hazard and makes the two suffix-handling styles disagree on the max usable length by one character.","fix":"Use `if (len < MaxTokenLength)` to match the rest of the scanner so len never exceeds MaxTokenLength, keeping a guaranteed slot for the terminator on all paths.","locations":[{"ref":"glslang/MachineIndependent/preprocessor/PpScanner.cpp:114-117","code":"  114 |     const auto saveName = [&](int ch) {\n  115 |         if (len <= MaxTokenLength)\n  116 |             ppToken->name[len++] = static_cast<char>(ch);\n  117 |     };","lines":4,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/preprocessor/PpScanner.cpp#L114-L117"}]},
{"id":"LOGIC_70","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"characterLiteral (HLSL) assigns ppToken->ival = ch directly for the default and unrecognized-escape cases. getChar() can return EndOfInput (-1) at end of input, so an unterminated literal like a trailing `'` at EOF stores -1 into ival and then writes name[0] = (char)-1. The closing-quote search loop afterwards also terminates on EndOfInput, but the negative character value is already baked into the constant. The literal value of a truncated/EOF char literal is silently a garbage negative integer instead of being reported as an error.","fix":"After reading ch in the default/escape-default branches, check for EndOfInput (and '\\n') and emit a 'missing closing quote' / unexpected end-of-input ppError instead of storing the raw value.","locations":[{"ref":"glslang/MachineIndependent/preprocessor/PpScanner.cpp:478-487","code":"  478 |             ppToken->ival = ch;\n  479 |             break;\n  480 |         }\n  481 |         break;\n  482 |     default:\n  483 |         ppToken->ival = ch;\n  484 |         break;\n  485 |     }\n  486 |     ppToken->name[0] = (char)ppToken->ival;\n  487 |     ppToken->name[1] = '\\0';","lines":10,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/preprocessor/PpScanner.cpp#L478-L487"}]},
{"id":"LOGIC_71","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In blowUpActiveAggregate's struct-expansion branch, getOffsets() / memberOffsets is only populated when baseOffset >= 0 (offsets resized only inside `if (baseOffset >= 0)`). But the strictArraySuffix+blockParent sub-branch passes memberOffsets[i] as the offset argument to the recursive calls unconditionally (lines 410, 415, 419), even when baseOffset < 0 and memberOffsets is therefore an empty vector. Indexing an empty TVector with operator[] is out-of-bounds. This is only reachable when blockParent && strictArraySuffix yet offset is negative; verify whether block expansion can ever have offset < 0 (blocks set offset=0 at entry, so it may be unreachable in practice, but the code is fragile).","fix":"Guard memberOffsets[i] usage on baseOffset >= 0, or always populate memberOffsets for struct members regardless of baseOffset sign in this branch.","locations":[{"ref":"glslang/MachineIndependent/reflection.cpp:379-420","code":"  379 |                 TVector<int> memberOffsets;\n  380 | \n  381 |                 if (baseOffset >= 0) {\n  382 |                     memberOffsets.resize(typeList.size());\n  383 |                     getOffsets(*terminalType, memberOffsets);\n  384 |                 }\n  385 | \n  386 |                 for (int i = 0; i < (int)typeList.size(); ++i) {\n  387 |                     TString newBaseName = name;\n  388 |                     if (newBaseName.size() > 0)\n  389 |                         newBaseName.append(\".\");\n  390 |                     newBaseName.append(typeList[i].type->getFieldName());\n  391 |                     TType derefType(*terminalType, i);\n  392 |                     if (offset >= 0)\n  393 |                         offset = baseOffset + memberOffsets[i];\n  394 | \n  395 |                     int arrayStride = topLevelArrayStride;\n  396 |                     if (terminalType->getBasicType() == EbtBlock && terminalType->getQualifier().storage == EvqBuffer &&\n  397 |                         derefType.isArray()) {\n  398 |                         arrayStride = getArrayStride(baseType, derefType);\n  399 |                     }\n  400 | \n  401 |                     if (topLevelArraySize == -1 && arrayStride == 0 && blockParent)\n  402 |                         topLevelArraySize = 1;\n  403 | \n  404 |                     if (strictArraySuffix && blockParent) {\n  405 |                         // if this member is an array, store the top-level array stride but start the explosion from\n  406 |                         // the inner struct type.\n  407 |                         if (derefType.isArray() && derefType.isStruct()) {\n  408 |                             newBaseName.append(\"[0]\");\n  409 |                             auto dimSize = derefType.isUnsizedArray() ? 0 : derefType.getArraySizes()->getDimSize(0);\n  410 |                             blowUpActiveAggregate(TType(derefType, 0), newBaseName, derefs, derefs.end(), memberOffsets[i],\n  411 |                                 blockIndex, 0, dimSize, arrayStride, terminalType->getQualifier().storage, false);\n  412 |                         }\n  413 |                         else if (derefType.isArray()) {\n  414 |                             auto dimSize = derefType.isUnsizedArray() ? 0 : derefType.getArraySizes()->getDimSize(0);\n  415 |                             blowUpActiveAggregate(derefType, newBaseName, derefs, derefs.end(), memberOffsets[i], blockIndex,\n  416 |                                 0, dimSize, 0, terminalType->getQualifier().storage, false);\n  417 |                         }\n  418 |                         else {\n  419 |                             blowUpActiveAggregate(derefType, newBaseName, derefs, derefs.end(), memberOffsets[i], blockIndex,\n  420 |                                 0, 1, 0, terminalType->getQualifier().storage, false);","lines":42,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/reflection.cpp#L379-L420"}]},
{"id":"LOGIC_72","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"convert_glsl_to_spirv calls glslang::InitializeProcess() once guarded by a static `initialized` flag but never calls FinalizeProcess, and the flag is a plain non-atomic global. In the documented single-threaded WASM use case this is acceptable, but the per-process initialization is never balanced and the flag is not thread-safe if the exported function were ever called concurrently.","fix":"Document the single-threaded assumption explicitly, or initialize once via a thread-safe mechanism; this is informational given the intended Emscripten single-thread usage.","locations":[{"ref":"glslang/OSDependent/Web/glslang.js.cpp:167-228","code":"  167 | static bool initialized = false;\n  168 | \n  169 | extern \"C\" {\n  170 | \n  171 | /*\n  172 |  * Takes in a GLSL shader as a string and converts it to SPIR-V in binary form.\n  173 |  *\n  174 |  * |glsl|          Null-terminated string containing the shader to be converted.\n  175 |  * |stage_int|     Magic number indicating the type of shader being processed.\n  176 | *                  Legal values are as follows:\n  177 |  *                   Vertex = 0\n  178 |  *                   Fragment = 4\n  179 |  *                   Compute = 5\n  180 |  * |gen_debug|     Flag to indicate if debug information should be generated.\n  181 |  * |spirv|         Output parameter for a pointer to the resulting SPIR-V data.\n  182 |  * |spirv_len|     Output parameter for the length of the output binary buffer.\n  183 |  *\n  184 |  * Returns a void* pointer which, if not null, must be destroyed by\n  185 |  * destroy_output_buffer.o. (This is not the same pointer returned in |spirv|.)\n  186 |  * If null, the compilation failed.\n  187 |  */\n  188 | EMSCRIPTEN_KEEPALIVE\n  189 | void* convert_glsl_to_spirv(const char* glsl,\n  190 |                             int stage_int,\n  191 |                             bool gen_debug,\n  192 |                             glslang::EShTargetLanguageVersion spirv_version,\n  193 |                             uint32_t** spirv,\n  194 |                             size_t* spirv_len)\n  195 | {\n  196 |     if (glsl == nullptr) {\n  197 |         fprintf(stderr, \"Input pointer null\\n\");\n  198 |         return nullptr;\n  199 |     }\n  200 |     if (spirv == nullptr || spirv_len == nullptr) {\n  201 |         fprintf(stderr, \"Output pointer null\\n\");\n  202 |         return nullptr;\n  203 |     }\n  204 |     *spirv = nullptr;\n  205 |     *spirv_len = 0;\n  206 | \n  207 |     if (stage_int != 0 && stage_int != 4 && stage_int != 5) {\n  208 |         fprintf(stderr, \"Invalid shader stage\\n\");\n  209 |         return nullptr;\n  210 |     }\n  211 |     EShLanguage stage = static_cast<EShLanguage>(stage_int);\n  212 |     switch (spirv_version) {\n  213 |         case glslang::EShTargetSpv_1_0:\n  214 |         case glslang::EShTargetSpv_1_1:\n  215 |         case glslang::EShTargetSpv_1_2:\n  216 |         case glslang::EShTargetSpv_1_3:\n  217 |         case glslang::EShTargetSpv_1_4:\n  218 |         case glslang::EShTargetSpv_1_5:\n  219 |             break;\n  220 |         default:\n  221 |             fprintf(stderr, \"Invalid SPIR-V version number\\n\");\n  222 |             return nullptr;\n  223 |     }\n  224 | \n  225 |     if (!initialized) {\n  226 |         glslang::InitializeProcess();\n  227 |         initialized = true;\n  228 |     }","lines":62,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/OSDependent/Web/glslang.js.cpp#L167-L228"}]},
{"id":"LOGIC_73","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"resolver is declared uninitialized and only assigned inside the stage loop when an intermediate exists; afterwards `delete resolver` runs unconditionally. If no stage ever has an intermediate (e.g. a path where all compiles fail before any intermediate is registered) the loop leaves resolver indeterminate and `delete resolver` is undefined behavior. Initialize to nullptr so the delete is a safe no-op.","fix":"Declare `glslang::TIoMapResolver *resolver = nullptr;` so the unconditional `delete resolver` is well-defined when no stage resolver is found.","locations":[{"ref":"gtests/GlslMapIO.FromFile.cpp:288-302","code":"  288 |     glslang::TIoMapResolver *resolver;\n  289 |     for (unsigned stage = 0; stage < EShLangCount; stage++) {\n  290 |         resolver = program.getGlslIoResolver((EShLanguage)stage);\n  291 |         if (resolver)\n  292 |             break;\n  293 |     }\n  294 |     glslang::TIoMapper *ioMapper = glslang::GetGlslIoMapper();\n  295 | \n  296 |     if (success) {\n  297 |         success &= program.mapIO(resolver, ioMapper);\n  298 |         result.linkingOutput = program.getInfoLog();\n  299 |         result.linkingError = program.getInfoDebugLog();\n  300 |     }\n  301 |     delete ioMapper;\n  302 |     delete resolver;","lines":15,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/gtests/GlslMapIO.FromFile.cpp#L288-L302"}]},
{"id":"LOGIC_74","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"getRoundedNormalizedSignificand is invoked a second time inside the EXPECT_EQ failure-message stream, passing &carry_bit again. The method mutates carry_bit (out-parameter), so on a failing assertion the value of carry_bit examined by the following EXPECT_FALSE(carry_bit) is the one produced by the message-side call, not the asserted call. Re-running the conversion in the diagnostic also defeats the purpose of comparing a single computed result.","fix":"Compute the rounded significand once into a local variable, assert against that local, and print the local in the failure message instead of calling getRoundedNormalizedSignificand again.","locations":[{"ref":"gtests/HexFloat.cpp:821-827","code":"  821 |     EXPECT_EQ(\n  822 |         GetParam().expected_result,\n  823 |         input_value.getRoundedNormalizedSignificand<HF>(round, &carry_bit))\n  824 |         << std::hex << \"0x\"\n  825 |         << input_value.getRoundedNormalizedSignificand<HF>(round, &carry_bit)\n  826 |         << \"  0x\" << GetParam().expected_result;\n  827 |     EXPECT_FALSE(carry_bit);","lines":7,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/gtests/HexFloat.cpp#L821-L827"}]},
{"id":"LOGIC_75","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"enableNonSemanticShaderDebugInfo is only validated by an assert that debug is enabled; the assert is compiled out in release/NDEBUG builds. A test that passes enableNonSemanticShaderDebugInfo=true with enableDebug=false will, in a release build, proceed to set emitNonSemanticShaderDebugInfo without debug info enabled rather than failing, producing a misleading pass/output.","fix":"Promote the precondition to a real failure (e.g. ASSERT/EXPECT in the gtest sense or an explicit return) so it is enforced regardless of NDEBUG.","locations":[{"ref":"gtests/TestFixture.h:268-270","code":"  268 |         if (enableNonSemanticShaderDebugInfo) {\n  269 |             assert(enableDebug && \"Debug must be on for non-semantic debug info\");\n  270 |         }","lines":3,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/gtests/TestFixture.h#L268-L270"}]},
{"id":"LOGIC_76","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The assertion EXPECT_TRUE(spirvText.find(\"Block\") != npos) is ineffective. The disassembly emits OpName/OpMemberName debug strings by default, and the shader's block type names \"DataBlock\" and \"SizeBlock\" both contain the substring \"Block\". The check therefore passes trivially from the variable/type names regardless of whether the intended `Block` decoration is actually present, so it does not validate what the comment claims.","fix":"Search for a more specific token such as \"Decorate %_ Block\" / the exact decoration form (e.g. \" Block\\n\" after a Decorate), or disassemble without friendly names, so the assertion can only be satisfied by the real Block decoration.","locations":[{"ref":"gtests/UboUnsizedArray.cpp:318-320","code":"  318 |     // 3. Block decoration (for uniform blocks with runtime arrays)\n  319 |     EXPECT_TRUE(spirvText.find(\"Block\") != std::string::npos)\n  320 |         << \"SPIR-V should contain Block decoration for uniform blocks with runtime arrays\";","lines":3,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/gtests/UboUnsizedArray.cpp#L318-L320"}]},
{"id":"LOGIC_77","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"setResourceSetBinding() is applied to the shaders only after compile() and program.link() have already run, and the resourceSetBindings are pushed onto the intermediates just before mapIO. While mapIO does read them, applying per-shader resource set bindings after linking (rather than before compilation, as the rest of the per-shader setup at lines 211-219 is done) is fragile: the only data-driven case exercising this (vk.relaxed.changeSet) depends on mapIO picking up bindings set post-link, which is easy to break and untested for the pre-compile path.","fix":"Move the setResourceSetBinding() loop into the per-file setup loop (alongside setAutoMapBindings/setEnvInput, before compile()), guarded by the resourceSetBindings.empty() check.","locations":[{"ref":"gtests/VkRelaxed.FromFile.cpp:234-238","code":"  234 |     if (!resourceSetBindings.empty()) {\n  235 |         assert(resourceSetBindings.size() == fileNames.size());\n  236 |         for (size_t i = 0; i < shaders.size(); i++)\n  237 |             shaders[i]->setResourceSetBinding(resourceSetBindings[i]);\n  238 |     }","lines":5,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/gtests/VkRelaxed.FromFile.cpp#L234-L238"}]},
{"id":"LOGIC_78","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"Same uninitialized-pointer pattern as GlslMapIO: `resolver` is declared without initialization, only set inside the per-stage loop, then `delete resolver` runs unconditionally. If the loop never assigns it, deleting an indeterminate pointer is undefined behavior.","fix":"Declare `glslang::TIoMapResolver *resolver = nullptr;`.","locations":[{"ref":"gtests/VkRelaxed.FromFile.cpp:240-254","code":"  240 |     glslang::TIoMapResolver *resolver;\n  241 |     for (unsigned stage = 0; stage < EShLangCount; stage++) {\n  242 |         resolver = program.getGlslIoResolver((EShLanguage)stage);\n  243 |         if (resolver)\n  244 |             break;\n  245 |     }\n  246 |     glslang::TIoMapper *ioMapper = glslang::GetGlslIoMapper();\n  247 | \n  248 |     if (success) {\n  249 |         success &= program.mapIO(resolver, ioMapper);\n  250 |         result.linkingOutput = program.getInfoLog();\n  251 |         result.linkingError = program.getInfoDebugLog();\n  252 |     }\n  253 |     delete ioMapper;\n  254 |     delete resolver;","lines":15,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/gtests/VkRelaxed.FromFile.cpp#L240-L254"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"easy","description":"Typo in a builtin function name: the i16vec3 overload of halfBitsToInt16 is declared as 'halhBitsToInt16' (note 'halh'). The scalar, f16vec2 and f16vec4 overloads are spelled correctly. As a result there is no 'i16vec3 halfBitsToInt16(f16vec3)' prototype, so calling halfBitsToInt16 on an f16vec3 has no matching overload, while a bogus name 'halhBitsToInt16' is registered that is never wired to any operator (relateToOperator only references 'halfBitsToInt16').","fix":"Change 'halhBitsToInt16' to 'halfBitsToInt16' on line 4423.","locations":[{"ref":"glslang/MachineIndependent/Initialize.cpp:4505","code":" 4505 |             \"i16vec3 halhBitsToInt16(f16vec3);\"","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/Initialize.cpp#L4505"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"easy","description":"In computeTypeXfbSize the recursive call for a sized array passes the wrong out-parameters: it passes contains16BitType for both the 32-bit and 16-bit tracking arguments (the second-to-last argument should be contains32BitType). As a result an array element that contains a 32-bit type never propagates contains32BitType up to the array; instead contains16BitType is written twice. This corrupts xfb stride alignment computation (the 4-byte vs 2-byte rounding in finalCheck depends on these flags), and can lead to wrong xfb_stride alignment / multiple-of checks for arrays of structs/scalars.","fix":"Change the call to computeTypeXfbSize(elementType, contains64BitType, contains32BitType, contains16BitType).","locations":[{"ref":"glslang/MachineIndependent/linkValidate.cpp:2334-2339","code":" 2334 |     if (type.isSizedArray()) {\n 2335 |         // TODO: perf: this can be flattened by using getCumulativeArraySize(), and a deref that discards all arrayness\n 2336 |         // Unsized array use to xfb should be a compile error.\n 2337 |         TType elementType(type, 0);\n 2338 |         return type.getOuterArraySize() * computeTypeXfbSize(elementType, contains64BitType, contains16BitType, contains16BitType);\n 2339 |     }","lines":6,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/linkValidate.cpp#L2334-L2339"}]},
{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"AccessChain::CoherentFlags::operator|= is meant to accumulate (OR-in) coherence flags across the whole access chain, as the struct comment states (\"Accumulate whether anything in the chain of structures has coherent decorations\"). Every member uses |= except 'nontemporal', which uses plain assignment ('nontemporal = other.nontemporal;'). This overwrites the accumulated value instead of merging it, so a 'nontemporal' flag set earlier in the chain is silently dropped when a later element is OR-ed in (and vice versa). This can cause the NonTemporal memory-access flag to be emitted incorrectly on loads/stores derived through multi-step access chains.","fix":"Change 'nontemporal = other.nontemporal;' to 'nontemporal |= other.nontemporal;' to match all the other accumulated flags.","locations":[{"ref":"SPIRV/SpvBuilder.h:1111-1124","code":" 1111 |             CoherentFlags operator |=(const CoherentFlags &other) {\n 1112 |                 coherent |= other.coherent;\n 1113 |                 devicecoherent |= other.devicecoherent;\n 1114 |                 queuefamilycoherent |= other.queuefamilycoherent;\n 1115 |                 workgroupcoherent |= other.workgroupcoherent;\n 1116 |                 subgroupcoherent |= other.subgroupcoherent;\n 1117 |                 shadercallcoherent |= other.shadercallcoherent;\n 1118 |                 nonprivate |= other.nonprivate;\n 1119 |                 volatil |= other.volatil;\n 1120 |                 nontemporal = other.nontemporal;\n 1121 |                 isImage |= other.isImage;\n 1122 |                 nonUniform |= other.nonUniform;\n 1123 |                 return *this;\n 1124 |             }","lines":14,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/SPIRV/SpvBuilder.h#L1111-L1124"}]},
{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"OpcodeString returns the wrong name for Op::OpHitObjectGetHitKindNV: it returns \"OpHitObjectGetFrontFaceNV\" instead of \"OpHitObjectGetHitKindNV\". The case label is the HitKind opcode but the returned string is for a different (nonexistent) FrontFace opcode. The canonical name is \"OpHitObjectGetHitKindNV\" (see spirv.hpp11). Disassembly of this opcode prints a misleading mnemonic.","fix":"Return \"OpHitObjectGetHitKindNV\".","locations":[{"ref":"SPIRV/doc.cpp:1723","code":" 1723 |     case (int)Op::OpHitObjectGetHitKindNV:               return \"OpHitObjectGetFrontFaceNV\";","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/SPIRV/doc.cpp#L1723"}]},
{"id":"CPY_5","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"OpcodeString returns the wrong name for Op::OpHitObjectReorderExecuteShaderEXT: it returns \"OpHitObjectReorderExecuteEXT\" (missing the word \"Shader\"). The canonical name in spirv.hpp11 is \"OpHitObjectReorderExecuteShaderEXT\". Disassembly emits a mnemonic that does not round-trip.","fix":"Return \"OpHitObjectReorderExecuteShaderEXT\".","locations":[{"ref":"SPIRV/doc.cpp:1813","code":" 1813 |     case (int)Op::OpHitObjectReorderExecuteShaderEXT:     return \"OpHitObjectReorderExecuteEXT\";","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/SPIRV/doc.cpp#L1813"}]},
{"id":"CPY_6","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"medium","description":"The 'O-4, status' GatherCmp/GatherCmpRed variants use argOrder \"%@,S,V,S,V,,V,S\" while the sibling GatherCmpGreen/Blue/Alpha use \"%@,S,V,S,V,,,,S\". The two orders are not equivalent: the green/blue/alpha order has 9 fields (matching the 9-field argType \"FIU,s,F,,I,,,,U\"), but the red/cmp order has only 8 fields. Because the argument loop stops as soon as either NthArg(order) or NthArg(type) returns null, the trailing status type 'U' is dropped for GatherCmp/GatherCmpRed, and one offset arg is forced to vector ('V') instead of the repeated scalar offset used by the other channels. The generated prototypes for these two intrinsics therefore differ from their siblings, which is a clear copy/paste divergence.","fix":"Change the argOrder on lines 789 and 795 to \"%@,S,V,S,V,,,,S\" to match the GatherCmpGreen/Blue/Alpha variants so the field count matches the 9-field argType and the status output is generated consistently.","locations":[{"ref":"glslang/HLSL/hlslParseables.cpp:789","code":"  789 |         { \"GatherCmp\",       /* O-4, status */\"V4\",    nullptr,   \"%@,S,V,S,V,,V,S\",\"FIU,s,F,,I,,,,U\",EShLangAll,   true },","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/HLSL/hlslParseables.cpp#L789"},{"ref":"glslang/HLSL/hlslParseables.cpp:795","code":"  795 |         { \"GatherCmpRed\",    /* O-4, status */\"V4\",    nullptr,   \"%@,S,V,S,V,,V,S\",\"FIU,s,F,,I,,,,U\",EShLangAll,   true },","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/HLSL/hlslParseables.cpp#L795"},{"ref":"glslang/HLSL/hlslParseables.cpp:801","code":"  801 |         { \"GatherCmpGreen\",  /* O-4, status */\"V4\",    nullptr,   \"%@,S,V,S,V,,,,S\",\"FIU,s,F,,I,,,,U\",EShLangAll,   true },","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/HLSL/hlslParseables.cpp#L801"},{"ref":"glslang/HLSL/hlslParseables.cpp:807","code":"  807 |         { \"GatherCmpBlue\",   /* O-4, status */\"V4\",    nullptr,   \"%@,S,V,S,V,,,,S\",\"FIU,s,F,,I,,,,U\",EShLangAll,   true },","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/HLSL/hlslParseables.cpp#L807"},{"ref":"glslang/HLSL/hlslParseables.cpp:813","code":"  813 |         { \"GatherCmpAlpha\",  /* O-4, status */\"V4\",    nullptr,   \"%@,S,V,S,V,,,,S\",\"FIU,s,F,,I,,,,U\",EShLangAll,   true },","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/HLSL/hlslParseables.cpp#L813"}]},
{"id":"CPY_7","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"medium","description":"TSampler::getString() has swapped suffixes for the 16-bit unsigned and 8-bit unsigned integer sampler types. EbtUint16 yields \"u8\" and EbtUint8 yields \"u16\" - the two are reversed. This produces wrong, misleading sampler type strings (e.g. in diagnostics/mangling-adjacent output).","fix":"Swap the labels: `case EbtUint16: s.append(\"u16\"); break;` and `case EbtUint8: s.append(\"u8\"); break;`.","locations":[{"ref":"glslang/Include/Types.h:272-274","code":"  272 |         case EbtUint16: s.append(\"u8\");  break;\n  273 |         case EbtInt16:  s.append(\"i16\"); break;\n  274 |         case EbtUint8:  s.append(\"u16\"); break;","lines":3,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/Include/Types.h#L272-L274"}]},
{"id":"CPY_8","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"medium","description":"Bogus second overload of textureWeightedQCOM uses a sampler1DArray weight texture. GL_QCOM_image_processing defines the weighted-sample form only with a sampler2DArray of per-phase weight kernels (the sibling line and the repo's own test Test/spv.tpipSampleWeighted.frag only ever use sampler2DArray). The sampler1DArray overload differs from its sibling by exactly one mistyped token and has no basis in the extension; it is reachable because the block is gated at desktop version >= 140 / ES 310 where sampler1DArray exists.","fix":"Delete the line declaring 'vec4 textureWeightedQCOM(sampler2D, vec2, sampler1DArray);' (line 4690).","locations":[{"ref":"glslang/MachineIndependent/Initialize.cpp:4771-4772","code":" 4771 |            \"vec4 textureWeightedQCOM(sampler2D, vec2, sampler2DArray);\"\n 4772 |            \"vec4 textureWeightedQCOM(sampler2D, vec2, sampler1DArray);\"","lines":2,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/Initialize.cpp#L4771-L4772"}]},
{"id":"CPY_9","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"medium","description":"gl_HitIsSphereNV and gl_HitIsLSSNV are the builtins actually declared in the prototype string (lines 7211-7212) and tagged with BuiltInVariable (10514-10515), but the extension-gating calls reference nonexistent names gl_HitKindSphereNV / gl_HitKindLSSNV. setVariableExtensions silently no-ops on a missing symbol, so the real gl_HitIsSphereNV / gl_HitIsLSSNV variables are NEVER tagged with E_GL_NV_linear_swept_spheres. They can therefore be used without the extension being enabled, defeating the extension check.","fix":"Change the names to gl_HitIsSphereNV and gl_HitIsLSSNV to match the declared/tagged builtins.","locations":[{"ref":"glslang/MachineIndependent/Initialize.cpp:10609-10610","code":"10609 |             symbolTable.setVariableExtensions(\"gl_HitKindSphereNV\", 1, &E_GL_NV_linear_swept_spheres);\n10610 |             symbolTable.setVariableExtensions(\"gl_HitKindLSSNV\", 1, &E_GL_NV_linear_swept_spheres);","lines":2,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/Initialize.cpp#L10609-L10610"}]},
{"id":"CPY_10","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"medium","description":"The declared builtin is gl_HitLSSPositionsNV (plural; see line 7215 and BuiltInVariable at 10518), but setVariableExtensions here references gl_HitLSSPositionNV (singular). Because find() returns null for the wrong name, gl_HitLSSPositionsNV never gets its E_GL_NV_linear_swept_spheres extension requirement applied.","fix":"Rename to gl_HitLSSPositionsNV to match the declared variable name.","locations":[{"ref":"glslang/MachineIndependent/Initialize.cpp:10613","code":"10613 |             symbolTable.setVariableExtensions(\"gl_HitLSSPositionNV\", 1, &E_GL_NV_linear_swept_spheres);","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/Initialize.cpp#L10613"}]},
{"id":"CPY_11","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"medium","description":"hitObjectGetObjectToWorldNV is the real function (declared at 5625/5722/5797 and related to operator at 11658), but the extension tagging here misspells it as hitObjectGetbjectToWorldNV (missing the 'O'). The real hitObjectGetObjectToWorldNV is therefore never tagged with E_GL_NV_shader_invocation_reorder, so it is usable without enabling the extension.","fix":"Fix the typo: hitObjectGetbjectToWorldNV -> hitObjectGetObjectToWorldNV.","locations":[{"ref":"glslang/MachineIndependent/Initialize.cpp:10649","code":"10649 |             symbolTable.setFunctionExtensions(\"hitObjectGetbjectToWorldNV\", 1, &E_GL_NV_shader_invocation_reorder);","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/Initialize.cpp#L10649"}]},
{"id":"CPY_12","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"The uint8 overload of addConstantUnion stores the value with setUConst(u8) instead of setU8Const(u8). setUConst sets the internal TConstUnion::type tag to EbtUint (32-bit) while the value is then wrapped in a TType(EbtUint8). Every sibling overload uses the matching setter (setI8Const, setI16Const, setU16Const, setI64Const, ...). The mismatched internal type tag drives TConstUnion's arithmetic and comparison operator dispatch (they switch on `type`), so a uint8 constant created here behaves as a 32-bit uint during constant folding/comparison, and the union's reported type disagrees with the node's TType.","fix":"Change `unionArray[0].setUConst(u8);` to `unionArray[0].setU8Const(u8);`.","locations":[{"ref":"glslang/MachineIndependent/Intermediate.cpp:2585-2591","code":" 2585 | TIntermConstantUnion* TIntermediate::addConstantUnion(unsigned char u8, const TSourceLoc& loc, bool literal) const\n 2586 | {\n 2587 |     TConstUnionArray unionArray(1);\n 2588 |     unionArray[0].setUConst(u8);\n 2589 | \n 2590 |     return addConstantUnion(unionArray, TType(EbtUint8, EvqConst), loc, literal);\n 2591 | }","lines":7,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/Intermediate.cpp#L2585-L2591"}]},
{"id":"CPY_13","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"BuiltInString returns \"HitLLSSRadiiNV\" (with an extra L) for BuiltIn::HitLSSRadiiNV. The correct spelling, per spirv.hpp11, is \"HitLSSRadiiNV\". A typo in the returned disassembly string.","fix":"Return \"HitLSSRadiiNV\".","locations":[{"ref":"SPIRV/doc.cpp:462","code":"  462 |     case (int)BuiltIn::HitLSSRadiiNV:               return \"HitLLSSRadiiNV\";","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/SPIRV/doc.cpp#L462"}]},
{"id":"CPY_14","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"OpcodeString for Op::OpRayQueryGetClusterIdNV returns \"OpRayQueryGetIntersectionClusterIdNV\", which does not match the enum name. The canonical name in spirv.hpp11 is \"OpRayQueryGetClusterIdNV\" (the spurious \"Intersection\" is inserted). Every other OpcodeString case mirrors the spirv.hpp11 name; this one is inconsistent and will not round-trip through the assembler.","fix":"Return \"OpRayQueryGetClusterIdNV\" to match the enumerant and spirv.hpp11.","locations":[{"ref":"SPIRV/doc.cpp:1649","code":" 1649 |     case (int)Op::OpRayQueryGetClusterIdNV:                                            return \"OpRayQueryGetIntersectionClusterIdNV\";","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/SPIRV/doc.cpp#L1649"}]},
{"id":"CPY_15","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"medium","description":"The 2DArray GetDimensions float variant has argType \"FUI,F,F,F\" (4 trailing type fields) while every analogous GetDimensions variant uses the empty-repeat form (e.g. the uint sibling on line 727 is \"FUI,U,,\" with 3 fields, and the 1DArray/3D/CubeArray float variants use \"FUI,F,\" / \"FUI,F,,\"). The order \"@#2,>S,,\" has only 3 argument fields, so the 4th 'F' is silently dropped; the entry is also stylistically inconsistent with all its peers and was clearly hand-edited differently.","fix":"Change the argType on line 728 to \"FUI,F,,\" to match the 3-field order and the style of the surrounding GetDimensions entries.","locations":[{"ref":"glslang/HLSL/hlslParseables.cpp:728","code":"  728 |         { \"GetDimensions\",   /* 2DArray */    \"-\",     \"-\",       \"@#2,>S,,\",       \"FUI,F,F,F\",      EShLangAll,   true },","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/HLSL/hlslParseables.cpp#L728"}]},
{"id":"CPY_16","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"medium","description":"gl_NumSamples is mapped to the EbvSampleMask built-in enum, the same enum used for gl_SampleMask/gl_SampleMaskIn just above. gl_NumSamples is a count, not a sample mask; tagging it as EbvSampleMask is semantically wrong (e.g. EbvSampleMask is special-cased in Types.h for array/output handling). This only happens on the non-ES, version<400 path.","fix":"Use the correct built-in enum for gl_NumSamples (add/use an EbvNumSamples) instead of reusing EbvSampleMask.","locations":[{"ref":"glslang/MachineIndependent/Initialize.cpp:9646","code":" 9646 |                 BuiltInVariable(\"gl_NumSamples\",     EbvSampleMask,     symbolTable);","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/Initialize.cpp#L9646"}]},
{"id":"CPY_17","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"Copy-paste/wrong-argument bug in the coherent-qualifier conflict diagnostic. The error reports that only one coherent/devicecoherent/... qualifier is allowed, but it passes `GetPrecisionQualifierString(src.precision)` as the offending token. That string is the precision qualifier (e.g. empty or \"highp\"), which is unrelated to the coherent qualifiers being checked, so the diagnostic shows a meaningless/misleading token. It was evidently copied from the precision-qualifier check just above (lines 5392-5395).","fix":"Pass a token describing the actual conflicting coherent qualifier (or an empty string), not GetPrecisionQualifierString(src.precision).","locations":[{"ref":"glslang/MachineIndependent/ParseHelper.cpp:5738-5739","code":" 5738 |         error(loc, \"only one coherent/devicecoherent/queuefamilycoherent/workgroupcoherent/subgroupcoherent/shadercallcoherent qualifier allowed\",\n 5739 |             GetPrecisionQualifierString(src.precision), \"\");","lines":2,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/ParseHelper.cpp#L5738-L5739"}]},
{"id":"CPY_18","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"setLayoutQualifier handles the 'descriptor_heap' layout id but passes the wrong feature name \"descriptor_stride\" to requireExtensions. The user-facing extension-required message will therefore refer to descriptor_stride even though the shader used descriptor_heap. This is a copy-paste from the descriptor_stride handler below.","fix":"Change the feature string to \"descriptor_heap\": requireExtensions(loc, 1, &E_GL_EXT_descriptor_heap, \"descriptor_heap\");","locations":[{"ref":"glslang/MachineIndependent/ParseHelper.cpp:7247-7251","code":" 7247 |     if (id == \"descriptor_heap\") {\n 7248 |         requireExtensions(loc, 1, &E_GL_EXT_descriptor_heap, \"descriptor_stride\");\n 7249 |         requireVulkan(loc, \"descriptor_heap\");\n 7250 |         publicType.qualifier.layoutDescriptorHeap = true;\n 7251 |         return;","lines":5,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/ParseHelper.cpp#L7247-L7251"}]},
{"id":"CPY_19","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"In declareVariable, the bfloat16 and fp8 input/output diagnostics call error() with the reason and token arguments swapped. error()'s signature is error(loc, szReason, szToken, ...). Here the literal \"qualifier\" is passed as the reason and the descriptive message \"bfloat16 types not allowed as input/output\" is passed as the token, so the emitted message is garbled (reason and offending-token are printed in the wrong slots). Compare to every other error() call in the file which puts the human-readable sentence first.","fix":"Swap the arguments: error(loc, \"bfloat16 types not allowed as input/output\", \"qualifier\", \"\"); and likewise error(loc, \"fp8 types not allowed as input/output\", \"qualifier\", \"\").","locations":[{"ref":"glslang/MachineIndependent/ParseHelper.cpp:9908-9914","code":" 9908 |     if (type.getBasicType() == EbtBFloat16 &&\n 9909 |         (type.getQualifier().storage == EvqVaryingIn || type.getQualifier().storage == EvqVaryingOut))\n 9910 |         error(loc, \"qualifier\", \"bfloat16 types not allowed as input/output\", \"\");\n 9911 | \n 9912 |     if ((type.getBasicType() == EbtFloatE5M2 || type.getBasicType() == EbtFloatE4M3) &&\n 9913 |         (type.getQualifier().storage == EvqVaryingIn || type.getQualifier().storage == EvqVaryingOut))\n 9914 |         error(loc, \"qualifier\", \"fp8 types not allowed as input/output\", \"\");","lines":7,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/ParseHelper.cpp#L9908-L9914"}]},
{"id":"CPY_20","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"medium","description":"Several debug op-name strings in visitAggregate have typos that misreport the operation: EOpSparseTextureGradOffsetClamp prints 'sparseTextureGradOffsetClam' (missing 'p'), EOpImageSampleFootprintGradClampNV prints 'mageSampleFootprintGradClampNV' (missing leading 'i'). These are debug-dump-only but produce incorrect tool output.","fix":"Correct the literals to 'sparseTextureGradOffsetClamp' and 'imageSampleFootprintGradClampNV' respectively.","locations":[{"ref":"glslang/MachineIndependent/intermOut.cpp:848","code":"  848 |     case EOpSparseTextureGradOffsetClamp:   out.debug << \"sparseTextureGradOffsetClam\";     break;","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/intermOut.cpp#L848"},{"ref":"glslang/MachineIndependent/intermOut.cpp:865","code":"  865 |     case EOpImageSampleFootprintGradClampNV:    out.debug << \"mageSampleFootprintGradClampNV\";  break;","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/intermOut.cpp#L865"}]},
{"id":"CPY_21","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"medium","description":"The standalone DefaultTBuiltInResource in the Web build defines the EXT mesh/task limits with the old NV-style values (maxMeshOutputPrimitivesEXT=512, maxMeshWorkGroupSizeX/Y/Z_EXT=32/1/1, maxTaskWorkGroupSizeX/Y/Z_EXT=32/1/1) while the canonical defaults in ResourceLimits.cpp use 256 and 128/128/128. The Web default is a stale copy that diverged from the authoritative table; shaders compiled via the Web entry point get different mesh/task limits than every other glslang front end.","fix":"Sync the EXT values in glslang.js.cpp with the canonical defaults (256 / 128 / 128 / 128), or better, have the Web build call GetDefaultResources() instead of maintaining a duplicate literal.","locations":[{"ref":"glslang/OSDependent/Web/glslang.js.cpp:145-151","code":"  145 |     /* .maxMeshOutputPrimitivesEXT = */ 512,\n  146 |     /* .maxMeshWorkGroupSizeX_EXT = */ 32,\n  147 |     /* .maxMeshWorkGroupSizeY_EXT = */ 1,\n  148 |     /* .maxMeshWorkGroupSizeZ_EXT = */ 1,\n  149 |     /* .maxTaskWorkGroupSizeX_EXT = */ 32,\n  150 |     /* .maxTaskWorkGroupSizeY_EXT = */ 1,\n  151 |     /* .maxTaskWorkGroupSizeZ_EXT = */ 1,","lines":7,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/OSDependent/Web/glslang.js.cpp#L145-L151"},{"ref":"glslang/ResourceLimits/ResourceLimits.cpp:138-144","code":"  138 |     /* .maxMeshOutputPrimitivesEXT = */ 256,\n  139 |     /* .maxMeshWorkGroupSizeX_EXT = */ 128,\n  140 |     /* .maxMeshWorkGroupSizeY_EXT = */ 128,\n  141 |     /* .maxMeshWorkGroupSizeZ_EXT = */ 128,\n  142 |     /* .maxTaskWorkGroupSizeX_EXT = */ 128,\n  143 |     /* .maxTaskWorkGroupSizeY_EXT = */ 128,\n  144 |     /* .maxTaskWorkGroupSizeZ_EXT = */ 128,","lines":7,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/ResourceLimits/ResourceLimits.cpp#L138-L144"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"The return value of spvBinaryToText is ignored, and success is inferred solely from diagnostic == nullptr. If the call fails without producing a diagnostic, text remains null and 'out << text->str' dereferences a null pointer. The error path also only prints the diagnostic to stderr rather than reflecting failure to the caller via 'out'.","fix":"Capture the spv_result_t from spvBinaryToText and gate on it (and on text != nullptr) before dereferencing text; on failure print the diagnostic and avoid touching text.","locations":[{"ref":"SPIRV/SpvTools.cpp:140-148","code":"  140 |     spvBinaryToText(context, spirv.data(), spirv.size(),\n  141 |         SPV_BINARY_TO_TEXT_OPTION_FRIENDLY_NAMES | SPV_BINARY_TO_TEXT_OPTION_INDENT,\n  142 |         &text, &diagnostic);\n  143 | \n  144 |     // dump\n  145 |     if (diagnostic == nullptr)\n  146 |         out << text->str;\n  147 |     else\n  148 |         spvDiagnosticPrint(diagnostic);","lines":9,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/SPIRV/SpvTools.cpp#L140-L148"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"ReadFileData does not check the result of malloc. 'char* return_data = (char*)malloc(count + 1);' is dereferenced immediately by fread and 'return_data[count] = 0' with no null check. For a very large file (count near INT_MAX) or under memory pressure, malloc returns NULL and the process crashes with a null-deref instead of a clean error.","fix":"After malloc, add 'if (return_data == nullptr) { fclose(in); Error(\"unable to allocate memory for input file\"); }'.","locations":[{"ref":"StandAlone/StandAlone.cpp:2292-2298","code":" 2292 |     char* return_data = (char*)malloc(count + 1);  // freed in FreeFileData()\n 2293 |     if ((int)fread(return_data, 1, count, in) != count) {\n 2294 |         free(return_data);\n 2295 |         Error(\"can't read input file\");\n 2296 |     }\n 2297 | \n 2298 |     return_data[count] = '\\0';","lines":7,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/StandAlone/StandAlone.cpp#L2292-L2298"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"c_shader_messages() does not convert two defined message bits: GLSLANG_MSG_LINK_TIME_OPTIMIZATION_BIT (1<<18) -> EShMsgLinkTimeOptimization and GLSLANG_MSG_VALIDATE_CROSS_STAGE_IO_BIT (1<<19) -> EShMsgValidateCrossStageIO. A C-API caller that sets these flags has them silently dropped, so link-time optimization and cross-stage IO validation never get enabled through the C interface.","fix":"Add CONVERT_MSG(GLSLANG_MSG_LINK_TIME_OPTIMIZATION_BIT, EShMsgLinkTimeOptimization); and CONVERT_MSG(GLSLANG_MSG_VALIDATE_CROSS_STAGE_IO_BIT, EShMsgValidateCrossStageIO); to the conversion list.","locations":[{"ref":"glslang/CInterface/glslang_c_interface.cpp:204-222","code":"  204 |     CONVERT_MSG(GLSLANG_MSG_RELAXED_ERRORS_BIT, EShMsgRelaxedErrors);\n  205 |     CONVERT_MSG(GLSLANG_MSG_SUPPRESS_WARNINGS_BIT, EShMsgSuppressWarnings);\n  206 |     CONVERT_MSG(GLSLANG_MSG_AST_BIT, EShMsgAST);\n  207 |     CONVERT_MSG(GLSLANG_MSG_SPV_RULES_BIT, EShMsgSpvRules);\n  208 |     CONVERT_MSG(GLSLANG_MSG_VULKAN_RULES_BIT, EShMsgVulkanRules);\n  209 |     CONVERT_MSG(GLSLANG_MSG_ONLY_PREPROCESSOR_BIT, EShMsgOnlyPreprocessor);\n  210 |     CONVERT_MSG(GLSLANG_MSG_READ_HLSL_BIT, EShMsgReadHlsl);\n  211 |     CONVERT_MSG(GLSLANG_MSG_CASCADING_ERRORS_BIT, EShMsgCascadingErrors);\n  212 |     CONVERT_MSG(GLSLANG_MSG_KEEP_UNCALLED_BIT, EShMsgKeepUncalled);\n  213 |     CONVERT_MSG(GLSLANG_MSG_HLSL_OFFSETS_BIT, EShMsgHlslOffsets);\n  214 |     CONVERT_MSG(GLSLANG_MSG_DEBUG_INFO_BIT, EShMsgDebugInfo);\n  215 |     CONVERT_MSG(GLSLANG_MSG_HLSL_ENABLE_16BIT_TYPES_BIT, EShMsgHlslEnable16BitTypes);\n  216 |     CONVERT_MSG(GLSLANG_MSG_HLSL_LEGALIZATION_BIT, EShMsgHlslLegalization);\n  217 |     CONVERT_MSG(GLSLANG_MSG_HLSL_DX9_COMPATIBLE_BIT, EShMsgHlslDX9Compatible);\n  218 |     CONVERT_MSG(GLSLANG_MSG_BUILTIN_SYMBOL_TABLE_BIT, EShMsgBuiltinSymbolTable);\n  219 |     CONVERT_MSG(GLSLANG_MSG_ENHANCED, EShMsgEnhanced);\n  220 |     CONVERT_MSG(GLSLANG_MSG_ABSOLUTE_PATH, EShMsgAbsolutePath);\n  221 |     CONVERT_MSG(GLSLANG_MSG_DISPLAY_ERROR_COLUMN, EShMsgDisplayErrorColumn);\n  222 |     CONVERT_MSG(GLSLANG_MSG_RELAX_SET_BINDING_LIMITS_BIT, EShMsgRelaxSetBindingLimits);","lines":19,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/CInterface/glslang_c_interface.cpp#L204-L222"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"acceptPostDecls() reports a syntax error via expected() but then 'break's out of the do-while loop instead of 'return false'. Because the loop exit returns the local 'found' (which is true once any post-decl was seen), the function reports SUCCESS after emitting an error. This is inconsistent with the sibling error paths in the same function that correctly 'return false', and lets parsing continue in a corrupt state.","fix":"Replace each 'expected(...); break;' in these three spots with 'expected(...); return false;' to match the other error handling in acceptPostDecls.","locations":[{"ref":"glslang/HLSL/hlslGrammar.cpp:4353-4356","code":" 4353 |                 if (! acceptTokenClass(EHTokRightParen)) {\n 4354 |                     expected(\")\");\n 4355 |                     break;\n 4356 |                 }","lines":4,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/HLSL/hlslGrammar.cpp#L4353-L4356"},{"ref":"glslang/HLSL/hlslGrammar.cpp:4393-4396","code":" 4393 |                     if (! acceptTokenClass(EHTokRightBracket)) {\n 4394 |                         expected(\"]\");\n 4395 |                         break;\n 4396 |                     }","lines":4,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/HLSL/hlslGrammar.cpp#L4393-L4396"},{"ref":"glslang/HLSL/hlslGrammar.cpp:4407-4410","code":" 4407 |                 if (! acceptTokenClass(EHTokRightParen)) {\n 4408 |                     expected(\")\");\n 4409 |                     break;\n 4410 |                 }","lines":4,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/HLSL/hlslGrammar.cpp#L4407-L4410"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"decomposeStructBufferMethods accesses argAggregate->getSequence()[1] (and [2]) without verifying the sequence has that many elements, for several methods (EOpMethodLoad, Load2/3/4, Store*, interlocked ops, Append). Earlier code only guarantees the sequence is non-empty (index 0 checked at lines 3497-3500). A malformed call with too few arguments dereferences past the end of the sequence vector, an out-of-bounds read / potential crash during semantic analysis of attacker-supplied HLSL.","fix":"Validate argAggregate->getSequence().size() against the required argument count for each method before indexing, emitting an error and returning on mismatch.","locations":[{"ref":"glslang/HLSL/hlslParseHelper.cpp:3579","code":" 3579 |             TIntermTyped* argIndex = makeIntegerIndex(argAggregate->getSequence()[1]->getAsTyped());  // index","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/HLSL/hlslParseHelper.cpp#L3579"},{"ref":"glslang/HLSL/hlslParseHelper.cpp:3579","code":" 3579 |             TIntermTyped* argIndex = makeIntegerIndex(argAggregate->getSequence()[1]->getAsTyped());  // index","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/HLSL/hlslParseHelper.cpp#L3579"},{"ref":"glslang/HLSL/hlslParseHelper.cpp:3686-3691","code":" 3686 |             TIntermTyped* argIndex = makeIntegerIndex(argAggregate->getSequence()[1]->getAsTyped());  // index\n 3687 |             if (argIndex == nullptr) {\n 3688 |                 error(loc, \"invalid index for Store\", \"\", \"\");\n 3689 |                 return;\n 3690 |             }\n 3691 |             TIntermTyped* argValue = argAggregate->getSequence()[2]->getAsTyped();  // value","lines":6,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/HLSL/hlslParseHelper.cpp#L3686-L3691"},{"ref":"glslang/HLSL/hlslParseHelper.cpp:3809","code":" 3809 |             TIntermTyped* argIndex     = makeIntegerIndex(sequence[1]->getAsTyped());  // index","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/HLSL/hlslParseHelper.cpp#L3809"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"CPPversion reads ppToken->ival via atoi(ppToken->name) and uses it as the version even when the token is not PpAtomConstInt: the 'token != PpAtomConstInt' branch only emits an error but falls through to 'ppToken->ival = atoi(ppToken->name)'. If the token is e.g. an identifier, atoi yields 0 and the code proceeds to notifyVersion/profile parsing with a bogus version rather than bailing out.","fix":"Return early after the 'must be followed by version number' error when token != PpAtomConstInt, as the '\\n' case does.","locations":[{"ref":"glslang/MachineIndependent/preprocessor/Pp.cpp:914-918","code":"  914 |     if (token != PpAtomConstInt)\n  915 |         parseContext.ppError(ppToken->loc, \"must be followed by version number\", \"#version\", \"\");\n  916 | \n  917 |     ppToken->ival = atoi(ppToken->name);\n  918 |     int versionNumber = ppToken->ival;","lines":5,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/preprocessor/Pp.cpp#L914-L918"}]},
{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"Module::getStorageClass indexes idToInstruction[typeId] and immediately dereferences it inside the assert and in the return, with no null/bounds guard, whereas the adjacent Module::getTypeId explicitly checks 'idToInstruction[resultId] == nullptr'. If getStorageClass is ever called with an id that was never mapped (null slot) it dereferences a null pointer instead of failing cleanly; the inconsistency with getTypeId shows the guard was deemed necessary elsewhere.","fix":"Guard getStorageClass like getTypeId: verify idToInstruction[typeId] is non-null (and in range) before dereferencing, or document why the caller invariant makes it impossible.","locations":[{"ref":"SPIRV/spvIR.h:581-591","code":"  581 |     Instruction* getInstruction(Id id) const { return idToInstruction[id]; }\n  582 |     const std::vector<Function*>& getFunctions() const { return functions; }\n  583 |     spv::Id getTypeId(Id resultId) const {\n  584 |         return idToInstruction[resultId] == nullptr ? NoType : idToInstruction[resultId]->getTypeId();\n  585 |     }\n  586 |     StorageClass getStorageClass(Id typeId) const\n  587 |     {\n  588 |         assert(idToInstruction[typeId]->getOpCode() == spv::Op::OpTypePointer ||\n  589 |                idToInstruction[typeId]->getOpCode() == spv::Op::OpTypeUntypedPointerKHR);\n  590 |         return (StorageClass)idToInstruction[typeId]->getImmediateOperand(0);\n  591 |     }","lines":11,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/SPIRV/spvIR.h#L581-L591"}]},
{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"ProcessConfigFile passes the result of ReadFileData directly to DecodeResourceLimits without verifying it. ReadFileData exits on open/read failure so configString is non-null here, but DecodeResourceLimits/FreeFileData receive the buffer with no independent validation; if ReadFileData's contract ever changes (e.g. returns NULL for empty file), this becomes a null-deref. Minor robustness gap.","fix":"Guard 'if (configString == nullptr) Error(...)' before calling DecodeResourceLimits, or make the ReadFileData contract explicit.","locations":[{"ref":"StandAlone/StandAlone.cpp:172-176","code":"  172 |     else {\n  173 |         char* configString = ReadFileData(ConfigFile.c_str());\n  174 |         DecodeResourceLimits(GetResources(),  configString);\n  175 |         FreeFileData(configString);\n  176 |     }","lines":5,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/StandAlone/StandAlone.cpp#L172-L176"}]},
{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"CompileFile does not handle ReadFileData returning without a usable string when reading from a real file: ReadFileData itself exits on failure, but in the --stdin branch 'shaderString = strdup(...)' is not checked for NULL before 'strlen(shaderString)' at line 1944. strdup can return NULL on allocation failure, causing a null-deref in strlen.","fix":"Check strdup's result for nullptr and call Error() (or abort cleanly) before using shaderString.","locations":[{"ref":"StandAlone/StandAlone.cpp:1942-1952","code":" 1942 |     if ((Options & EOptionStdin) != 0) {\n 1943 |         std::istreambuf_iterator<char> begin(std::cin), end;\n 1944 |         std::string tempString(begin, end);\n 1945 |         shaderString = strdup(tempString.c_str());\n 1946 |     } else {\n 1947 |         shaderString = ReadFileData(fileName);\n 1948 |     }\n 1949 | \n 1950 |     // move to length-based strings, rather than null-terminated strings\n 1951 |     int* lengths = new int[1];\n 1952 |     lengths[0] = (int)strlen(shaderString);","lines":11,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/StandAlone/StandAlone.cpp#L1942-L1952"}]},
{"id":"ERR_10","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"acceptSamplerState() returns false (failure, no diagnostic) when it encounters the 'bordercolor' sampler-state name. Every other recognized state name parses its value and continues; 'bordercolor' is silently rejected as a parse error with no expected()/warn() message, so a perfectly valid 'BorderColor = ...;' aborts the whole declaration with no explanation.","fix":"Either parse the bordercolor value like the other states (accept an identifier/literal) or at minimum emit a warn()/expected() before returning, and ideally do not fail the declaration for an unimplemented-but-valid state.","locations":[{"ref":"glslang/HLSL/hlslGrammar.cpp:253-254","code":"  253 |         } else if (stateName == \"bordercolor\") {\n  254 |             return false;","lines":2,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/HLSL/hlslGrammar.cpp#L253-L254"}]},
{"id":"ERR_11","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"TConstUnionArray::dot() dereferences rhs.unionArray and unionArray unconditionally (assert on sizes, then loops over unionArray->size()). For an empty/unallocated array (unionArray == nullptr, the default-constructed state) this is a null-pointer dereference in release builds where assert is compiled out. The surrounding class explicitly supports the unallocated state (see empty(), size(), operator==), so dot() is inconsistent with that contract.","fix":"Guard against null unionArray (return 0.0 when either side is empty) or document/assert the precondition consistently; at minimum avoid the unconditional deref so release builds do not crash.","locations":[{"ref":"glslang/Include/ConstantUnion.h:929-938","code":"  929 |     double dot(const TConstUnionArray& rhs)\n  930 |     {\n  931 |         assert(rhs.unionArray->size() == unionArray->size());\n  932 |         double sum = 0.0;\n  933 | \n  934 |         for (size_t comp = 0; comp < unionArray->size(); ++comp)\n  935 |             sum += (*this)[comp].getDConst() * rhs[comp].getDConst();\n  936 | \n  937 |         return sum;\n  938 |     }","lines":10,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/Include/ConstantUnion.h#L929-L938"}]},
{"id":"ERR_12","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"ProcessDeferred unconditionally calls strlen(strings[1]) on customPreamble. ProcessDeferred is reachable via PreprocessDeferred/CompileDeferred whose 'preamble' parameter is not guaranteed non-null at this layer (only the outermost TShader::parse/preprocess substitute \"\" for null). A null preamble passed through CompileDeferred/PreprocessDeferred directly would crash in strlen.","fix":"Default customPreamble to \"\" when null at the top of ProcessDeferred (or assert/guard before strlen).","locations":[{"ref":"glslang/MachineIndependent/ShaderLang.cpp:995-996","code":"  995 |     strings[1] = customPreamble;\n  996 |     lengths[1] = strlen(strings[1]);","lines":2,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/ShaderLang.cpp#L995-L996"}]},
{"id":"ERR_13","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"setFunctionExtensionsCallback passes exts.size() straight into TSymbol::setExtensions even when the callback returns an empty vector. setExtensions asserts numExts > 0 (debug abort) and, in release, still allocates a TExtensionList and sets a non-null extensions pointer for zero extensions, so getNumExtensions() reasoning and the 'assert(extensions == nullptr)' guard on a later setExtensions call can misbehave.","fix":"Guard the call: 'if (!exts.empty()) symbol->setExtensions((int)exts.size(), exts.data());'.","locations":[{"ref":"glslang/MachineIndependent/SymbolTable.cpp:365-366","code":"  365 |             auto exts = func(candidateName.c_str());\n  366 |             symbol->setExtensions(exts.size(), exts.data());","lines":2,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/SymbolTable.cpp#L365-L366"},{"ref":"glslang/MachineIndependent/SymbolTable.h:113-120","code":"  113 |     virtual void setExtensions(int numExts, const char* const exts[])\n  114 |     {\n  115 |         assert(extensions == nullptr);\n  116 |         assert(numExts > 0);\n  117 |         extensions = NewPoolObject(extensions);\n  118 |         for (int e = 0; e < numExts; ++e)\n  119 |             extensions->push_back(exts[e]);\n  120 |     }","lines":8,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/SymbolTable.h#L113-L120"}]},
{"id":"ERR_14","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In checkExtensionsRequested, when an extension is disabled and relaxedErrors() is set, it emits the generic message 'The following extension must be enabled to use this feature:' but never names the extension (extensions[i]) nor the feature (featureDesc). The subsequent EBhWarn branch does name the extension, so this first message is redundant and uninformative to the user.","fix":"Either drop the first info message and rely on the EBhWarn message that follows, or include the extension name and featureDesc in the relaxed-errors warning so it is actionable.","locations":[{"ref":"glslang/MachineIndependent/Versions.cpp:967-971","code":"  967 |         if (behavior == EBhDisable && relaxedErrors()) {\n  968 |             infoSink.info.message(EPrefixWarning, \"The following extension must be enabled to use this feature:\", loc,\n  969 |                                   messages & EShMsgAbsolutePath, messages & EShMsgDisplayErrorColumn);\n  970 |             behavior = EBhWarn;\n  971 |         }","lines":5,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/Versions.cpp#L967-L971"}]},
{"id":"ERR_15","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"resolveSet parses a user/command-line provided descriptor-set string with atoi() and no validation. atoi returns 0 on a non-numeric string and has undefined behavior on values exceeding INT range, so a malformed --resource-set-binding argument silently maps everything to set 0 (or worse) instead of producing a diagnostic. The resulting set is later range-checked only if it is negative/out-of-range, not for parse failure.","fix":"Parse with strtol and validate that the entire string was consumed and the value is in [0, layoutSetEnd); emit an error via infoSink otherwise instead of using atoi.","locations":[{"ref":"glslang/MachineIndependent/iomapper.cpp:904-906","code":"  904 |     if (getResourceSetBinding(stage).size() == 1) {\n  905 |         return ent.newSet = atoi(getResourceSetBinding(stage)[0].c_str());\n  906 |     }","lines":3,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/iomapper.cpp#L904-L906"}]},
{"id":"ERR_16","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"On a bad/missing value the error message prints valueStr (the value field), but the useful diagnostic for the user is the token name (tokenStr). Printing the value - which is empty or garbage when the value is missing - gives a misleading message like \"Error: '' bad .conf file\" with no indication of which name is offending.","fix":"Include tokenStr in the error message, e.g. print the offending name: \"Error: '%s' bad .conf file. Each name must be followed by one number.\", tokenStr.c_str().","locations":[{"ref":"glslang/ResourceLimits/ResourceLimits.cpp:298-302","code":"  298 |         if (value_s == std::string::npos || ! (valueStr[0] == '-' || isdigit(valueStr[0]))) {\n  299 |             printf(\"Error: '%s' bad .conf file.  Each name must be followed by one number.\\n\",\n  300 |                    valueStr.c_str());\n  301 |             return;\n  302 |         }","lines":5,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/ResourceLimits/ResourceLimits.cpp#L298-L302"}]},
{"id":"ERR_17","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"ReadSpvBinaryFile uses a while(!fstream.eof()) read loop. If the SPIR-V file size is not a multiple of 4 bytes, the final partial read sets eof and the trailing 1-3 bytes are silently dropped, and a truncated/corrupt binary is still returned with success=true rather than flagged. For golden test inputs this masks a malformed file instead of failing the test.","fix":"After the loop, check fstream for a partial trailing read (gcount() != 0 and != sizeof(uint32_t)) and return false on a non-aligned file size, or at minimum detect stream failure bits beyond eof.","locations":[{"ref":"gtests/TestFixture.cpp:153-162","code":"  153 |     // There is no istream iterator traversing by uint32_t, so we must loop.\n  154 |     while (!fstream.eof()) {\n  155 |         std::uint32_t inWord;\n  156 |         fstream.read((char *)&inWord, sizeof(inWord));\n  157 | \n  158 |         if (!fstream.eof())\n  159 |             contents.push_back(inWord);\n  160 |     }\n  161 | \n  162 |     return std::make_pair(true, contents); // hopefully, c++11 move semantics optimizes the copy away.","lines":10,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/gtests/TestFixture.cpp#L153-L162"}]},
