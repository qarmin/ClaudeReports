<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"deepCopy dereferences typeParameters->spirvType without ever allocating it. A freshly-constructed TTypeParameters has spirvType == nullptr (set in its constructor), and deepCopy never allocates a new TSpirvType for it. When the source type's typeParameters carries a spirvType, the line `*typeParameters->spirvType = *copyOf.typeParameters->spirvType;` writes through a null pointer, a reachable null-deref crash. (Compare the correct pattern used a few lines above for the top-level spirvType, which does `spirvType = new TSpirvType;` first.)","fix":"Allocate before dereferencing: inside the `if (copyOf.typeParameters->spirvType)` branch do `typeParameters->spirvType = new TSpirvType; *typeParameters->spirvType = *copyOf.typeParameters->spirvType;` (and initialize typeParameters->spirvType = nullptr otherwise, which the TTypeParameters ctor already does).","locations":[{"ref":"glslang/Include/Types.h:3219-3227","code":" 3219 |         if (copyOf.typeParameters) {\n 3220 |             typeParameters = new TTypeParameters;\n 3221 |             typeParameters->arraySizes = new TArraySizes;\n 3222 |             *typeParameters->arraySizes = *copyOf.typeParameters->arraySizes;\n 3223 |             if (copyOf.typeParameters->spirvType) {\n 3224 |                 *typeParameters->spirvType = *copyOf.typeParameters->spirvType;\n 3225 |             }\n 3226 |             typeParameters->basicType = copyOf.basicType;\n 3227 |         }","lines":9,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/Include/Types.h#L3219-L3227"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"glslang_program_add_source_text and glslang_program_set_source_file call program->program->getIntermediate(stage) and immediately dereference the result. getIntermediate(stage) returns intermediate[stage], which is nullptr for any stage that has no added/linked shader. Calling these C-API functions for an absent stage causes a null-pointer dereference.","fix":"Null-check the intermediate before use and return / no-op (or document the precondition and assert) when getIntermediate(stage) returns nullptr.","locations":[{"ref":"glslang/CInterface/glslang_c_interface.cpp:503-511","code":"  503 | GLSLANG_EXPORT void glslang_program_add_source_text(glslang_program_t* program, glslang_stage_t stage, const char* text, size_t len) {\n  504 |     glslang::TIntermediate* intermediate = program->program->getIntermediate(c_shader_stage(stage));\n  505 |     intermediate->addSourceText(text, len);\n  506 | }\n  507 | \n  508 | GLSLANG_EXPORT void glslang_program_set_source_file(glslang_program_t* program, glslang_stage_t stage, const char* file) {\n  509 |     glslang::TIntermediate* intermediate = program->program->getIntermediate(c_shader_stage(stage));\n  510 |     intermediate->setSourceFile(file);\n  511 | }","lines":9,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/CInterface/glslang_c_interface.cpp#L503-L511"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"In findFunction(), Step 2b dereferences 'args' unconditionally (args->getAsAggregate(), then getAsUnaryNode()/getAsTyped()) even though Step 2a guards all use of 'args' with 'if (args != nullptr)'. A built-in resolved via selectFunction() (not the exact-match early return) with a null argument list reaches line 7821 and null-derefs. The trailing 'else { assert(0); return nullptr; }' is reachable for a non-null but non-typed node, but does not cover args == nullptr.","fix":"Guard Step 2b with 'if (args == nullptr) { /* no args to reconstruct */ } else if (args->getAsAggregate()) { ... }', or skip reconstruction when args is null.","locations":[{"ref":"glslang/HLSL/hlslParseHelper.cpp:7863-7887","code":" 7863 |         // Step 2b: reconstruct the TFunction based on the new arg types\n 7864 |         TFunction convertedCall(&call.getName(), call.getType(), call.getBuiltInOp());\n 7865 | \n 7866 |         if (args->getAsAggregate()) {\n 7867 |             // Handle aggregates: put all args into the new function call\n 7868 |             for (int arg = 0; arg < int(args->getAsAggregate()->getSequence().size()); ++arg) {\n 7869 |                 // TODO: But for constness, we could avoid the new & shallowCopy, and use the pointer directly.\n 7870 |                 TParameter param = { nullptr, new TType, nullptr };\n 7871 |                 param.type->shallowCopy(args->getAsAggregate()->getSequence()[arg]->getAsTyped()->getType());\n 7872 |                 convertedCall.addParameter(param);\n 7873 |             }\n 7874 |         } else if (args->getAsUnaryNode()) {\n 7875 |             // Handle unaries: put all args into the new function call\n 7876 |             TParameter param = { nullptr, new TType, nullptr };\n 7877 |             param.type->shallowCopy(args->getAsUnaryNode()->getOperand()->getAsTyped()->getType());\n 7878 |             convertedCall.addParameter(param);\n 7879 |         } else if (args->getAsTyped()) {\n 7880 |             // Handle bare e.g, floats, not in an aggregate.\n 7881 |             TParameter param = { nullptr, new TType, nullptr };\n 7882 |             param.type->shallowCopy(args->getAsTyped()->getType());\n 7883 |             convertedCall.addParameter(param);\n 7884 |         } else {\n 7885 |             assert(0); // unknown argument list.\n 7886 |             return nullptr;\n 7887 |         }","lines":25,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/HLSL/hlslParseHelper.cpp#L7863-L7887"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"TParseContextBase::finish() looks up each relaxed-symbol name and immediately calls symbol->getWritableType() with no null check, then iterates '*type.getStruct()'. If symbolTable.find returns nullptr (symbol shadowed/removed by the time finish runs) this is a null dereference; if the relaxed symbol is not actually a struct, getStruct() returns nullptr and the range-for dereferences it. relaxedSymbols entries come from user-controlled parsing (glslang_tab.cpp), so a crafted shader could reach this.","fix":"After find(), continue if symbol == nullptr; before the range-for, check that type.getStruct() != nullptr (or type.isStruct()).","locations":[{"ref":"glslang/MachineIndependent/ParseContextBase.cpp:758-773","code":"  758 |     for (const TString& relaxedSymbol : relaxedSymbols)\n  759 |     {\n  760 |         TSymbol* symbol = symbolTable.find(relaxedSymbol);\n  761 |         TType& type = symbol->getWritableType();\n  762 |         for (const TTypeLoc& typeLoc : *type.getStruct())\n  763 |         {\n  764 |             if (typeLoc.type->isOpaque())\n  765 |             {\n  766 |                 typeLoc.type->getSampler() = TSampler{};\n  767 |                 typeLoc.type->setBasicType(EbtInt);\n  768 |                 TString fieldName(\"/*\");\n  769 |                 fieldName.append(typeLoc.type->getFieldName());\n  770 |                 fieldName.append(\"*/\");\n  771 |                 typeLoc.type->setFieldName(fieldName);\n  772 |             }\n  773 |         }","lines":16,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/ParseContextBase.cpp#L758-L773"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"mergeBodies computes loop bounds as globals.size() - 1 and unitGlobals.size() - 1 where size() returns an unsigned size_t. If either sequence were empty, the subtraction underflows to a huge value and the loop reads out of bounds. The final insert at globals.end() - 1 has the same assumption. While the linker-objects invariant normally guarantees a trailing element, this is an unchecked assumption that turns any violation into an out-of-bounds read rather than a clean error.","fix":"Guard with if (globals.empty() || unitGlobals.empty()) return; or assert non-empty before the loops and the end()-1 insert.","locations":[{"ref":"glslang/MachineIndependent/linkValidate.cpp:862-874","code":"  862 |     for (unsigned int child = 0; child < globals.size() - 1; ++child) {\n  863 |         for (unsigned int unitChild = 0; unitChild < unitGlobals.size() - 1; ++unitChild) {\n  864 |             TIntermAggregate* body = globals[child]->getAsAggregate();\n  865 |             TIntermAggregate* unitBody = unitGlobals[unitChild]->getAsAggregate();\n  866 |             if (body && unitBody && body->getOp() == EOpFunction && unitBody->getOp() == EOpFunction && body->getName() == unitBody->getName()) {\n  867 |                 error(infoSink, \"Multiple function bodies in multiple compilation units for the same signature in the same stage:\");\n  868 |                 infoSink.info << \"    \" << globals[child]->getAsAggregate()->getName() << \"\\n\";\n  869 |             }\n  870 |         }\n  871 |     }\n  872 | \n  873 |     // Merge the global objects, just in front of the linker objects\n  874 |     globals.insert(globals.end() - 1, unitGlobals.begin(), unitGlobals.end() - 1);","lines":13,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/linkValidate.cpp#L862-L874"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"Out-of-bounds vector access. precise_accesschain_index is parsed from an access-chain string via strtoul and then used directly to index node->getSequence()[precise_accesschain_index] with no bounds check. The following assert only checks the result for null AFTER the indexing has already happened, so it cannot catch an out-of-range index. A malformed/unexpected struct access chain yields an out-of-range index and undefined behavior (operator[] on std::vector).","fix":"Validate the index before dereferencing: assert(precise_accesschain_index < node->getSequence().size()) and/or guard with an if before calling getSequence()[precise_accesschain_index].","locations":[{"ref":"glslang/MachineIndependent/propagateNoContraction.cpp:677-681","code":"  677 |             unsigned precise_accesschain_index = (unsigned)strtoul(precise_accesschain_index_str.c_str(), nullptr, 10);\n  678 |             // Gets the node pointed by the access chain index extracted before.\n  679 |             glslang::TIntermTyped* potential_precise_node =\n  680 |                 node->getSequence()[precise_accesschain_index]->getAsTyped();\n  681 |             assert(potential_precise_node);","lines":5,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/propagateNoContraction.cpp#L677-L681"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In DecodeResourceLimits, when a resource name appears with no following value (e.g. a trailing token at end of config, or a name as the last whitespace-separated token), find_first_not_of returns std::string::npos for value_s. The substring for valueStr is built on line 296 with pos == npos BEFORE the npos guard on line 298 is reached. std::string::substr(npos, n) throws std::out_of_range, so a malformed config crashes with an uncaught exception instead of printing the intended error message.","fix":"Check `if (value_s == std::string::npos)` and emit the error/return before constructing valueStr. Reorder so the npos guard precedes the substr calls; only build valueStr once value_s is known valid.","locations":[{"ref":"glslang/ResourceLimits/ResourceLimits.cpp:290-302","code":"  290 |         const size_t value_s = configStr.find_first_not_of(delims, token_e);\n  291 |         const size_t value_e = configStr.find_first_of(delims, value_s);\n  292 |         pos = value_e;\n  293 | \n  294 |         // Faster to use compare(), but prefering readability.\n  295 |         const std::string tokenStr = configStr.substr(token_s, token_e-token_s);\n  296 |         const std::string valueStr = configStr.substr(value_s, value_e-value_s);\n  297 | \n  298 |         if (value_s == std::string::npos || ! (valueStr[0] == '-' || isdigit(valueStr[0]))) {\n  299 |             printf(\"Error: '%s' bad .conf file.  Each name must be followed by one number.\\n\",\n  300 |                    valueStr.c_str());\n  301 |             return;\n  302 |         }","lines":13,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/ResourceLimits/ResourceLimits.cpp#L290-L302"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"addStructBuffArguments() dereferences aggregate->getSequence()[param]->getAsTyped()->getType() without a null check, while the earlier any_of() detection guard at the top of the same function explicitly checks 'node && node->getAsTyped() != nullptr'. This inconsistency means a non-typed argument node (getAsTyped()==nullptr) is safely skipped during detection but causes a null deref in the rebuild loop.","fix":"Mirror the detection guard: 'TIntermTyped* typed = aggregate->getSequence()[param]->getAsTyped(); if (typed && hasStructBuffCounter(typed->getType())) { ... }'.","locations":[{"ref":"glslang/HLSL/hlslParseHelper.cpp:6093","code":" 6093 |         if (hasStructBuffCounter(aggregate->getSequence()[param]->getAsTyped()->getType())) {","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/HLSL/hlslParseHelper.cpp#L6093"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"updateStandaloneQualifierDefaults() calls getEditableVariable(\"gl_WorkGroupSize\") and immediately dereferences the result (workGroupSize->getWritableConstArray()/getWritableType()). getEditableVariable() can return nullptr (it only asserts, then returns nullptr in release builds when the symbol is not found), so in a release build with a missing gl_WorkGroupSize this null-derefs instead of erroring.","fix":"Check workGroupSize for nullptr before dereferencing in both branches, e.g. 'if (workGroupSize != nullptr) workGroupSize->...'.","locations":[{"ref":"glslang/HLSL/hlslParseHelper.cpp:9386-9393","code":" 9386 |             TVariable* workGroupSize = getEditableVariable(\"gl_WorkGroupSize\");\n 9387 |             workGroupSize->getWritableConstArray()[i].setUConst(intermediate.getLocalSize(i));\n 9388 |         }\n 9389 |         if (publicType.shaderQualifiers.localSizeSpecId[i] != TQualifier::layoutNotSet) {\n 9390 |             intermediate.setLocalSizeSpecId(i, publicType.shaderQualifiers.localSizeSpecId[i]);\n 9391 |             // Set the workgroup built-in variable as a specialization constant\n 9392 |             TVariable* workGroupSize = getEditableVariable(\"gl_WorkGroupSize\");\n 9393 |             workGroupSize->getWritableType().getQualifier().specConstant = true;","lines":8,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/HLSL/hlslParseHelper.cpp#L9386-L9393"}]},
{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"getTestExpr() dereferences the result of decl->getInitNode() without a null check, then calls getAsTyped() on it. A TIntermVariableDecl's initNode field is documented to be optionally null (declared `TIntermNode* initNode = nullptr`), so a declaration-form loop test with no initializer would null-deref. Current callers happen to guard via the binary-condition path, but the accessor itself is unsafe by contract.","fix":"Guard for a null init node: `if (auto decl = test->getAsVariableDecl()) { auto* init = decl->getInitNode(); return init ? init->getAsTyped() : nullptr; }`.","locations":[{"ref":"glslang/Include/intermediate.h:1303-1310","code":" 1303 |     TIntermTyped* getTestExpr() const {\n 1304 |         if (auto decl = test->getAsVariableDecl()) {\n 1305 |             return decl->getInitNode()->getAsTyped();\n 1306 |         }\n 1307 |         else {\n 1308 |             return test->getAsTyped();\n 1309 |         }\n 1310 |     }","lines":8,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/Include/intermediate.h#L1303-L1310"}]},
{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"mergeAggregate unconditionally dereferences `right` at `right->getAsAggregate()`, but the function begins with an early-out only when BOTH left and right are null. If left is non-null and right is null, the early-out is skipped and right is dereferenced -> null deref. This is inconsistent with the sibling helper growAggregate, which explicitly tolerates a null right operand.","fix":"Guard the right-handling block with `if (right != nullptr) { ... }`, matching growAggregate's null-tolerant behavior.","locations":[{"ref":"glslang/MachineIndependent/Intermediate.cpp:2345-2367","code":" 2345 | TIntermAggregate* TIntermediate::mergeAggregate(TIntermNode* left, TIntermNode* right)\n 2346 | {\n 2347 |     if (left == nullptr && right == nullptr)\n 2348 |         return nullptr;\n 2349 | \n 2350 |     TIntermAggregate* aggNode = nullptr;\n 2351 |     if (left != nullptr)\n 2352 |         aggNode = left->getAsAggregate();\n 2353 |     if (aggNode == nullptr || aggNode->getOp() != EOpNull) {\n 2354 |         aggNode = new TIntermAggregate;\n 2355 |         if (left != nullptr)\n 2356 |             aggNode->getSequence().push_back(left);\n 2357 |     }\n 2358 | \n 2359 |     TIntermAggregate* rhsagg = right->getAsAggregate();\n 2360 |     if (rhsagg == nullptr || rhsagg->getOp() != EOpNull)\n 2361 |         aggNode->getSequence().push_back(right);\n 2362 |     else\n 2363 |         aggNode->getSequence().insert(aggNode->getSequence().end(),\n 2364 |                                       rhsagg->getSequence().begin(),\n 2365 |                                       rhsagg->getSequence().end());\n 2366 | \n 2367 |     return aggNode;","lines":23,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/Intermediate.cpp#L2345-L2367"}]},
{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"addComma calls growAggregate(left, right, loc) and then immediately dereferences the result via commaAggregate->getAsAggregate()->setOperator(EOpComma) without a null check. growAggregate returns nullptr when both inputs are null, which would crash here. The inputs are normally non-null, but the missing check is a latent null-deref with no guard.","fix":"Check `commaAggregate` (and its getAsAggregate()) for null before dereferencing, or assert/return early if growAggregate yields nullptr.","locations":[{"ref":"glslang/MachineIndependent/Intermediate.cpp:2450-2451","code":" 2450 |     TIntermTyped *commaAggregate = growAggregate(left, right, loc);\n 2451 |     commaAggregate->getAsAggregate()->setOperator(EOpComma);","lines":2,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/Intermediate.cpp#L2450-L2451"}]},
{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In lValueErrorCheck and rValueErrorCheck, the EOpIndexDirectStruct/EOpIndexDirect error paths call leftMostTypeNode->getAsSymbolNode()->getName()/getAccessName() with no null check. traverseLValueBase can return a node whose getAsSymbolNode() is nullptr (e.g. a non-symbol left-most base), which would null-deref while emitting an error message.","fix":"Guard leftMostTypeNode and leftMostTypeNode->getAsSymbolNode() for null before dereferencing; fall back to the generic message form when null.","locations":[{"ref":"glslang/MachineIndependent/ParseContextBase.cpp:219-223","code":"  219 |         if (binaryNode && binaryNode->getAsOperator()->getOp() == EOpIndexDirectStruct)\n  220 |             if(IsAnonymous(leftMostTypeNode->getAsSymbolNode()->getName()))\n  221 |                 error(loc, \" l-value required\", op, \"\\\"%s\\\" (%s)\", leftMostTypeNode->getAsSymbolNode()->getAccessName().c_str(), message);\n  222 |             else\n  223 |                 error(loc, \" l-value required\", op, \"\\\"%s\\\" (%s)\", leftMostTypeNode->getAsSymbolNode()->getName().c_str(), message);","lines":5,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/ParseContextBase.cpp#L219-L223"},{"ref":"glslang/MachineIndependent/ParseContextBase.cpp:244-250","code":"  244 |         else if (binaryNode &&\n  245 |                 (binaryNode->getAsOperator()->getOp() == EOpIndexDirectStruct ||\n  246 |                  binaryNode->getAsOperator()->getOp() == EOpIndexDirect))\n  247 |             if(IsAnonymous(leftMostTypeNode->getAsSymbolNode()->getName()))\n  248 |                 error(loc, \"can't read from writeonly object: \", op, leftMostTypeNode->getAsSymbolNode()->getAccessName().c_str());\n  249 |             else\n  250 |                 error(loc, \"can't read from writeonly object: \", op, leftMostTypeNode->getAsSymbolNode()->getName().c_str());","lines":7,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/ParseContextBase.cpp#L244-L250"}]},
{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"SpirvToolsDisassemble allocates a spv_text via spvBinaryToText but never frees it with spvTextDestroy. Every disassembly call leaks the text buffer. The companion spv_diagnostic and spv_context are torn down, but the text is not.","fix":"After printing (and only when text is non-null), call spvTextDestroy(text); before/along with spvDiagnosticDestroy and spvContextDestroy.","locations":[{"ref":"SPIRV/SpvTools.cpp:138-153","code":"  138 |     spv_text text;\n  139 |     spv_diagnostic diagnostic = nullptr;\n  140 |     spvBinaryToText(context, spirv.data(), spirv.size(),\n  141 |         SPV_BINARY_TO_TEXT_OPTION_FRIENDLY_NAMES | SPV_BINARY_TO_TEXT_OPTION_INDENT,\n  142 |         &text, &diagnostic);\n  143 | \n  144 |     // dump\n  145 |     if (diagnostic == nullptr)\n  146 |         out << text->str;\n  147 |     else\n  148 |         spvDiagnosticPrint(diagnostic);\n  149 | \n  150 |     // teardown\n  151 |     spvDiagnosticDestroy(diagnostic);\n  152 |     spvContextDestroy(context);\n  153 | }","lines":16,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/SPIRV/SpvTools.cpp#L138-L153"}]},
{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"On error paths in ReadFileData, the open FILE* 'in' is leaked. When fopen succeeds but a later read fails, Error() is called (which exits) at lines 2279 and 2286 without fclose(in). Likewise the malloc-failure path (if a null check is added) must close it. Since Error() exits the process the OS reclaims the handle, but it is still an unclean leak and a latent bug if Error() is ever changed to be non-terminating.","fix":"Call fclose(in) before each Error() invocation on the read-failure paths (or use an RAII wrapper / goto cleanup).","locations":[{"ref":"StandAlone/StandAlone.cpp:2287-2296","code":" 2287 |         } else {\n 2288 |             Error(\"can't read input file\");\n 2289 |         }\n 2290 |     }\n 2291 | \n 2292 |     char* return_data = (char*)malloc(count + 1);  // freed in FreeFileData()\n 2293 |     if ((int)fread(return_data, 1, count, in) != count) {\n 2294 |         free(return_data);\n 2295 |         Error(\"can't read input file\");\n 2296 |     }","lines":10,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/StandAlone/StandAlone.cpp#L2287-L2296"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"createTextureCall computes the operand reservation as 'optArgNum + (texArgs.size() - (optArgNum + 1))'. When no optional image-operands mask is present (e.g. a plain texture() sample with no bias/lod/offset/etc.), optArgNum == texArgs.size(), so 'texArgs.size() - (optArgNum + 1)' underflows in size_t arithmetic to a huge value. reserveOperands() forwards it to std::vector::reserve, which throws std::length_error / bad_alloc. This is reachable for common texture calls that carry no optional operands.","fix":"Reserve based on the actual operand count, e.g. 'textureInst->reserveOperands(texArgs.size());' which is a safe upper bound, or compute it without the underflowing subtraction.","locations":[{"ref":"SPIRV/SpvBuilder.cpp:4040-4041","code":" 4040 |     Instruction* textureInst = new Instruction(getUniqueId(), resultType, opCode);\n 4041 |     textureInst->reserveOperands(optArgNum + (texArgs.size() - (optArgNum + 1)));","lines":2,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/SPIRV/SpvBuilder.cpp#L4040-L4041"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"TAllocation::allocationSize(size) returns size + 2*guardBlockSize() + headerSize() with no overflow guard, and TPoolAllocator::allocate then evaluates 'currentPageOffset + allocationSize <= pageSize'. A numBytes near SIZE_MAX makes allocationSize wrap to a small value, so the size check can pass (or the wrapped numBytesToAlloc in the multi-page path under-allocates), yielding a buffer far smaller than requested. The header declares allocate() returns nullptr 'if no memory available' but provides no path for an overflowing request.","fix":"Reject requests where numBytes would overflow allocationSize (e.g. numBytes > SIZE_MAX - 2*guardBlockSize() - headerSize()) by returning nullptr before doing the size arithmetic.","locations":[{"ref":"glslang/Include/PoolAlloc.h:102-104","code":"  102 |     inline static size_t allocationSize(size_t size) {\n  103 |         return size + 2 * guardBlockSize() + headerSize();\n  104 |     }","lines":3,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/Include/PoolAlloc.h#L102-L104"},{"ref":"glslang/Include/PoolAlloc.h:184-189","code":"  184 |     //\n  185 |     // Call allocate() to actually acquire memory.  Returns nullptr if no memory\n  186 |     // available, otherwise a properly aligned pointer to 'numBytes' of memory.\n  187 |     //\n  188 |     GLSLANG_EXPORT_FOR_TESTS\n  189 |     void* allocate(size_t numBytes);","lines":6,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/Include/PoolAlloc.h#L184-L189"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"pool_allocator::allocate computes the byte count as n * sizeof(T) with no overflow check. For a large element count n (attacker-influenced container size or a corrupted size value), n * sizeof(T) wraps around size_t, producing a small allocation while the caller believes it received space for n elements, leading to a heap buffer overflow when the container writes its elements. STL allocators are expected to guard this (max_size exists precisely for it) but it is never consulted here.","fix":"In allocate(size_type n) check that n <= max_size() (i.e. n <= SIZE_MAX / sizeof(T)) and throw std::bad_alloc (or return nullptr) on overflow before multiplying.","locations":[{"ref":"glslang/Include/PoolAlloc.h:300-303","code":"  300 |     pointer allocate(size_type n) {\n  301 |         return reinterpret_cast<pointer>(getAllocator().allocate(n * sizeof(T))); }\n  302 |     pointer allocate(size_type n, const void*) {\n  303 |         return reinterpret_cast<pointer>(getAllocator().allocate(n * sizeof(T))); }","lines":4,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/Include/PoolAlloc.h#L300-L303"},{"ref":"glslang/Include/PoolAlloc.h:308-309","code":"  308 |     pointer _Charalloc(size_t n) {\n  309 |         return reinterpret_cast<pointer>(getAllocator().allocate(n)); }","lines":2,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/Include/PoolAlloc.h#L308-L309"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"In the OpTypeImage special case, exactly 7 operand words are consumed unconditionally (sampled-type id, Dim, depth, array, MS, sampled, format) and an 8th if numOperands == 8, but numOperands is never checked to be >= 7. For a truncated/malformed OpTypeImage with fewer words the code reads past the intended operand region (still within the word-count guard, but consuming operands that belong to the next instruction), producing garbage rather than a 'incorrect number of operands' diagnostic; the trailing mismatch is only caught afterwards by processInstructions.","fix":"Guard the OpTypeImage decoding on numOperands being at least 7 (and exactly 8 for the access-qualifier branch), otherwise fall through to the generic path / emit an error.","locations":[{"ref":"SPIRV/disassemble.cpp:480-498","code":"  480 |     if (opCode == Op::OpTypeImage) {\n  481 |         out << \" \";\n  482 |         disassembleIds(1);\n  483 |         out << \" \" << DimensionString((int)(Dim)stream[word++]);\n  484 |         out << (stream[word++] != 0 ? \" depth\" : \"\");\n  485 |         out << (stream[word++] != 0 ? \" array\" : \"\");\n  486 |         out << (stream[word++] != 0 ? \" multi-sampled\" : \"\");\n  487 |         switch (stream[word++]) {\n  488 |         case 0: out << \" runtime\";    break;\n  489 |         case 1: out << \" sampled\";    break;\n  490 |         case 2: out << \" nonsampled\"; break;\n  491 |         }\n  492 |         out << \" format:\" << ImageFormatString((int)(ImageFormat)stream[word++]);\n  493 | \n  494 |         if (numOperands == 8) {\n  495 |             out << \" \" << AccessQualifierString(stream[word++]);\n  496 |         }\n  497 |         return;\n  498 |     }","lines":19,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/SPIRV/disassemble.cpp#L480-L498"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"LoopControlParams is declared with size FunctionControlCeiling (== 4), but it is registered for OperandLoop with ceiling LoopControlCeiling (== LoopControlShift::PartialCount + 1 == 9). Any consumer that indexes the enumParams array by enumerant up to ceiling-1 (e.g. the declared PrintImmediateRow / doc-printing path) would read past the 4-element array for LoopControl bits 4..8. The current disassembler only calls getName(m) and not enumParams[m], so this is latent, but the array size is still wrong.","fix":"Declare EnumParameters LoopControlParams[LoopControlCeiling]; (size it to LoopControlCeiling, not FunctionControlCeiling).","locations":[{"ref":"SPIRV/doc.cpp:1838","code":" 1838 | EnumParameters LoopControlParams[FunctionControlCeiling];","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/SPIRV/doc.cpp#L1838"},{"ref":"SPIRV/doc.cpp:2018","code":" 2018 |         OperandClassParams[OperandLoop].set(LoopControlCeiling, LoopControlString, LoopControlParams, true);","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/SPIRV/doc.cpp#L2018"}]},
{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"Instruction::dump computes wordCount as 1 + (typeId?1:0) + (resultId?1:0) + operands.size() and packs it into the high 16 bits via '(wordCount << WordCountShift) | opCode' (WordCountShift == 16). wordCount is never checked against the 16-bit field limit (0xFFFF). For an instruction with more than ~65534 operand words (e.g. a very large OpConstantComposite / OpTypeStruct, or a long OpString), the shifted word count overflows past bit 31 and/or collides with bits that are reused, silently producing a corrupt SPIR-V binary with no diagnostic.","fix":"Before packing, assert/validate that wordCount <= 0xFFFF (the SPIR-V word-count limit) and report an error via the logger when exceeded, rather than silently truncating.","locations":[{"ref":"SPIRV/spvIR.h:241-261","code":"  241 |     void dump(std::vector<unsigned int>& out) const\n  242 |     {\n  243 |         // Compute the wordCount\n  244 |         unsigned int wordCount = 1;\n  245 |         if (typeId)\n  246 |             ++wordCount;\n  247 |         if (resultId)\n  248 |             ++wordCount;\n  249 |         wordCount += (unsigned int)operands.size();\n  250 | \n  251 |         // Write out the beginning of the instruction\n  252 |         out.push_back(((wordCount) << WordCountShift) | (unsigned)opCode);\n  253 |         if (typeId)\n  254 |             out.push_back(typeId);\n  255 |         if (resultId)\n  256 |             out.push_back(resultId);\n  257 | \n  258 |         // Write out the operands\n  259 |         for (int op = 0; op < (int)operands.size(); ++op)\n  260 |             out.push_back(operands[op]);\n  261 |     }","lines":21,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/SPIRV/spvIR.h#L241-L261"}]},
{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"ReadFileData counts file size into an 'int count' by reading one byte at a time. For files >= 2 GiB, 'count' overflows to a negative value; 'malloc(count + 1)' is then called with a negative-as-size_t (huge) or wrapped value, and the subsequent fread/index corrupts memory. The byte-at-a-time fgetc counting loop is also an O(n) performance pitfall versus fseek/ftell.","fix":"Use fseek(in, 0, SEEK_END)/ftell to size the file into a 64-bit/size_t variable, validate it is non-negative and within size limits before malloc, and avoid the per-byte counting loop.","locations":[{"ref":"StandAlone/StandAlone.cpp:2272-2298","code":" 2272 |     int count = 0;\n 2273 |     while (fgetc(in) != EOF)\n 2274 |         count++;\n 2275 | \n 2276 |     fseek(in, 0, SEEK_SET);\n 2277 | \n 2278 |     if (count > 3) {\n 2279 |         unsigned char head[3];\n 2280 |         if (fread(head, 1, 3, in) == 3) {\n 2281 |             if (head[0] == 0xef && head[1] == 0xbb && head[2] == 0xbf) {\n 2282 |                 // skip BOM\n 2283 |                 count -= 3;\n 2284 |             } else {\n 2285 |                 fseek(in, 0, SEEK_SET);\n 2286 |             }\n 2287 |         } else {\n 2288 |             Error(\"can't read input file\");\n 2289 |         }\n 2290 |     }\n 2291 | \n 2292 |     char* return_data = (char*)malloc(count + 1);  // freed in FreeFileData()\n 2293 |     if ((int)fread(return_data, 1, count, in) != count) {\n 2294 |         free(return_data);\n 2295 |         Error(\"can't read input file\");\n 2296 |     }\n 2297 | \n 2298 |     return_data[count] = '\\0';","lines":27,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/StandAlone/StandAlone.cpp#L2272-L2298"}]},
{"id":"OVF_8","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"String(const int i, base) declares 'char text[16]' with the comment '32 bit ints are at most 10 digits in base 10'. That sizing is only valid for base 10. On the MSVC path _itoa_s is given base as an argument, so a base-2 conversion of a 32-bit int needs up to 33 chars (32 digits + NUL, plus sign), overflowing the 16-byte buffer. No current caller passes a non-default base, so this is latent, but the API accepts arbitrary bases while the buffer assumes base 10.","fix":"Size the buffer for the worst case (e.g. char text[34]) so any base from 2 upward fits, or drop the unused 'base' parameter entirely since every caller uses base 10.","locations":[{"ref":"glslang/Include/Common.h:216-233","code":"  216 | #if defined(_MSC_VER) || (defined(MINGW_HAS_SECURE_API) && MINGW_HAS_SECURE_API)\n  217 | inline const TString String(const int i, const int base = 10)\n  218 | {\n  219 |     char text[16];     // 32 bit ints are at most 10 digits in base 10\n  220 |     _itoa_s(i, text, sizeof(text), base);\n  221 |     return text;\n  222 | }\n  223 | #else\n  224 | inline const TString String(const int i, const int /*base*/ = 10)\n  225 | {\n  226 |     char text[16];     // 32 bit ints are at most 10 digits in base 10\n  227 | \n  228 |     // we assume base 10 for all cases\n  229 |     snprintf(text, sizeof(text), \"%d\", i);\n  230 | \n  231 |     return text;\n  232 | }\n  233 | #endif","lines":18,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/Include/Common.h#L216-L233"}]},
{"id":"OVF_9","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"getCumulativeSize() accumulates the product of dimension sizes into a plain signed `int`. Each getDimSize() is an unsigned int (array sizes are stored as unsigned), so a multi-dimensional array whose product exceeds INT_MAX silently overflows to a wrong/negative size with signed-overflow UB. Array sizes come from user shader source, so large declared sizes are reachable.","fix":"Accumulate into a 64-bit type (e.g. `long long`/`size_t`) and/or check for overflow before multiplying, returning a saturated value or signalling an error to the caller.","locations":[{"ref":"glslang/Include/arrays.h:267-276","code":"  267 |     int getCumulativeSize() const\n  268 |     {\n  269 |         int size = 1;\n  270 |         for (int d = 0; d < sizes.size(); ++d) {\n  271 |             // this only makes sense in paths that have a known array size\n  272 |             assert(sizes.getDimSize(d) != UnsizedArraySize);\n  273 |             size *= sizes.getDimSize(d);\n  274 |         }\n  275 |         return size;\n  276 |     }","lines":10,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/Include/arrays.h#L267-L276"}]},
{"id":"OVF_10","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"EOpRefract and other non-componentwise vector ops index childConstUnions[0]/[1]/[2] up to numComps without verifying the operand vectors are the same length, and EOpCross hardcodes indices 0..2. While the type checker normally guarantees matching vec3 operands for cross and equal-length vectors for refract/reflect/faceforward, there is no defensive check here; a malformed/over-aggressively-folded tree would read out of bounds. Lower severity because front-end semantic checks should prevent mismatches in practice.","fix":"Either document the invariant that operand component counts are validated before folding, or add asserts/guards that the operand vector sizes match numComps (and ==3 for cross) before indexing.","locations":[{"ref":"glslang/MachineIndependent/Constant.cpp:1234-1275","code":" 1234 |         case EOpCross:\n 1235 |             newConstArray[0] = childConstUnions[0][1] * childConstUnions[1][2] - childConstUnions[0][2] * childConstUnions[1][1];\n 1236 |             newConstArray[1] = childConstUnions[0][2] * childConstUnions[1][0] - childConstUnions[0][0] * childConstUnions[1][2];\n 1237 |             newConstArray[2] = childConstUnions[0][0] * childConstUnions[1][1] - childConstUnions[0][1] * childConstUnions[1][0];\n 1238 |             break;\n 1239 |         case EOpFaceForward:\n 1240 |             // If dot(Nref, I) < 0 return N, otherwise return -N:  Arguments are (N, I, Nref).\n 1241 |             dot = childConstUnions[1].dot(childConstUnions[2]);\n 1242 |             for (int comp = 0; comp < numComps; ++comp) {\n 1243 |                 if (dot < 0.0)\n 1244 |                     newConstArray[comp] = childConstUnions[0][comp];\n 1245 |                 else\n 1246 |                     newConstArray[comp].setDConst(-childConstUnions[0][comp].getDConst());\n 1247 |             }\n 1248 |             break;\n 1249 |         case EOpReflect:\n 1250 |             // I - 2 * dot(N, I) * N:  Arguments are (I, N).\n 1251 |             dot = childConstUnions[0].dot(childConstUnions[1]);\n 1252 |             dot *= 2.0;\n 1253 |             for (int comp = 0; comp < numComps; ++comp)\n 1254 |                 newConstArray[comp].setDConst(childConstUnions[0][comp].getDConst() - dot * childConstUnions[1][comp].getDConst());\n 1255 |             break;\n 1256 |         case EOpRefract:\n 1257 |         {\n 1258 |             // Arguments are (I, N, eta).\n 1259 |             // k = 1.0 - eta * eta * (1.0 - dot(N, I) * dot(N, I))\n 1260 |             // if (k < 0.0)\n 1261 |             //     return dvec(0.0)\n 1262 |             // else\n 1263 |             //     return eta * I - (eta * dot(N, I) + sqrt(k)) * N\n 1264 |             dot = childConstUnions[0].dot(childConstUnions[1]);\n 1265 |             double eta = childConstUnions[2][0].getDConst();\n 1266 |             double k = 1.0 - eta * eta * (1.0 - dot * dot);\n 1267 |             if (k < 0.0) {\n 1268 |                 for (int comp = 0; comp < numComps; ++comp)\n 1269 |                     newConstArray[comp].setDConst(0.0);\n 1270 |             } else {\n 1271 |                 for (int comp = 0; comp < numComps; ++comp)\n 1272 |                     newConstArray[comp].setDConst(eta * childConstUnions[0][comp].getDConst() - (eta * dot + sqrt(k)) * childConstUnions[1][comp].getDConst());\n 1273 |             }\n 1274 |             break;\n 1275 |         }","lines":42,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/Constant.cpp#L1234-L1275"}]},
{"id":"OVF_11","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"Type mismatch in printf-style varargs: `indexValue` is an `int64_t`, but the three error() calls format it with `%d`, which expects `int`. Passing an `int64_t` where the format consumes an `int` is undefined behavior and will print a wrong/garbage value on LP64 platforms where the 64-bit argument is not what `%d` reads. Reachable for an out-of-range constant index into gl_ClipDistance / gl_CullDistance / gl_SampleMask.","fix":"Use a 64-bit format specifier (e.g. \"%lld\" with a cast to long long, or \"%\" PRId64) for indexValue, or cast indexValue to int after range-checking it fits.","locations":[{"ref":"glslang/MachineIndependent/ParseHelper.cpp:650-661","code":"  650 |             if (base->getQualifier().builtIn == EbvClipDistance &&\n  651 |                 indexValue >= resources.maxClipDistances) {\n  652 |                 error(loc, \"gl_ClipDistance\", \"[\", \"array index out of range '%d'\", indexValue);\n  653 |             }\n  654 |             else if (base->getQualifier().builtIn == EbvCullDistance &&\n  655 |                 indexValue >= resources.maxCullDistances) {\n  656 |                 error(loc, \"gl_CullDistance\", \"[\", \"array index out of range '%d'\", indexValue);\n  657 |             }\n  658 |             else if (base->getQualifier().builtIn == EbvSampleMask &&\n  659 |                 indexValue >= (resources.maxSamples + 31) / 32) {\n  660 |                 error(loc, \"gl_SampleMask\", \"[\", \"array index out of range '%d'\", indexValue);\n  661 |             }","lines":12,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/ParseHelper.cpp#L650-L661"}]},
{"id":"OVF_12","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"Allocation size math has no overflow guard. TAllocation::allocationSize(numBytes) computes numBytes + 2*guardBlockSize() + headerSize(), and allocate() then computes numBytesToAlloc = allocationSize + headerSkip; pool_allocator::allocate also computes n*sizeof(T). A near-SIZE_MAX request wraps to a small value, so ::new char[small] succeeds and the caller gets a buffer far smaller than requested (heap overflow). No bounds check exists on numBytes.","fix":"Detect overflow before allocating (e.g. if numBytes > SIZE_MAX - fixedOverhead, return nullptr / throw bad_alloc), and check n against max_size() in pool_allocator::allocate.","locations":[{"ref":"glslang/MachineIndependent/PoolAlloc.cpp:231","code":"  231 |     size_t allocationSize = TAllocation::allocationSize(numBytes);","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/PoolAlloc.cpp#L231"},{"ref":"glslang/MachineIndependent/PoolAlloc.cpp:259","code":"  259 |         size_t numBytesToAlloc = allocationSize + headerSkip;","lines":1,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/PoolAlloc.cpp#L259"},{"ref":"glslang/Include/PoolAlloc.h:300-303","code":"  300 |     pointer allocate(size_type n) {\n  301 |         return reinterpret_cast<pointer>(getAllocator().allocate(n * sizeof(T))); }\n  302 |     pointer allocate(size_type n, const void*) {\n  303 |         return reinterpret_cast<pointer>(getAllocator().allocate(n * sizeof(T))); }","lines":4,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/Include/PoolAlloc.h#L300-L303"}]},
{"id":"OVF_13","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"scanVersion() accumulates the version number with 'version = 10 * version + (c - '0')' over an unbounded run of digits with no overflow guard. A source line such as '#version 99999999999' overflows the signed int 'version', which is undefined behavior in C++, and can yield an arbitrary (possibly negative) version that is then handed back to the caller. The preprocessor re-validates later, but the signed overflow in this pre-scan is still UB on attacker-controlled shader text.","fix":"Accumulate into an unsigned/64-bit temporary and clamp/cap (e.g. stop once version exceeds a sane maximum like 100000), or detect overflow and bail out leaving version unchanged.","locations":[{"ref":"glslang/MachineIndependent/Scan.cpp:239-247","code":"  239 |         // version number\n  240 |         while (c >= '0' && c <= '9') {\n  241 |             version = 10 * version + (c - '0');\n  242 |             c = get();\n  243 |         }\n  244 |         if (version == 0) {\n  245 |             versionNotFirst = true;\n  246 |             continue;\n  247 |         }","lines":9,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/Scan.cpp#L239-L247"}]},
{"id":"OVF_14","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"Auto location assignment accumulates into the int counters nextUniformLocation/nextInputLocation/nextOutputLocation by adding computeType*LocationSize with no upper-bound check. With many/large auto-mapped variables these signed ints can overflow (UB) and there is no validation that the produced location stays below layoutLocationEnd (0xFFF). Unlike bindings/sets (range-checked in TResolverUniformAdaptor), auto-assigned locations are never validated against the layout limit.","fix":"After computing a location, verify it plus its size does not exceed the location limit and report an error; use a checked addition (or wider type) for the running counters.","locations":[{"ref":"glslang/MachineIndependent/iomapper.cpp:935-937","code":"  935 |     location = nextUniformLocation;\n  936 |     nextUniformLocation += TIntermediate::computeTypeUniformLocationSize(type);\n  937 |     return ent.newLocation = location;","lines":3,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/iomapper.cpp#L935-L937"},{"ref":"glslang/MachineIndependent/iomapper.cpp:965-971","code":"  965 |     int location = nextLocation;\n  966 |     int typeLocationSize;\n  967 |     // Don’t take into account the outer-most array if the stage’s\n  968 |     // interface is automatically an array.\n  969 |     typeLocationSize = computeTypeLocationSize(type, stage);\n  970 |     nextLocation += typeLocationSize;\n  971 |     return ent.newLocation = location;","lines":7,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/iomapper.cpp#L965-L971"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"makeBoolDebugType's dedup loop compares the wrong operand indices. The instruction's operands are [0]=nonSemanticShaderDebugInfo (id), [1]=DebugTypeBasic (immediate tag), [2]=name id, [3]=size const id, [4]=encoding const id, [5]=flags const id. The loop instead checks getIdOperand(0)==name, getIdOperand(1)==size, getIdOperand(2)==encoding. getIdOperand(1) hits the immediate tag and triggers assert(idOperand[op]) in debug builds; in release builds it compares name/size/encoding against import-id/tag/name, so the type is never correctly deduplicated. Compare with the correct makePointerDebugType which reads payload at indices 2,3.","fix":"Shift the comparisons to the real payload indices: getIdOperand(2)==getStringId(\"bool\"), getIdOperand(3)==makeUintConstant(size), getIdOperand(4)==makeUintConstant(NonSemanticShaderDebugInfoBoolean).","locations":[{"ref":"SPIRV/SpvBuilder.cpp:1023-1028","code":" 1023 |     for (int t = 0; t < (int)groupedDebugTypes[NonSemanticShaderDebugInfoDebugTypeBasic].size(); ++t) {\n 1024 |         type = groupedDebugTypes[NonSemanticShaderDebugInfoDebugTypeBasic][t];\n 1025 |         if (type->getIdOperand(0) == getStringId(\"bool\") &&\n 1026 |             type->getIdOperand(1) == static_cast<unsigned int>(size) &&\n 1027 |             type->getIdOperand(2) == NonSemanticShaderDebugInfoBoolean)\n 1028 |             return type->getResultId();","lines":6,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/SPIRV/SpvBuilder.cpp#L1023-L1028"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"makeIntegerDebugType's dedup loop has the same misaligned-operand bug as makeBoolDebugType. Operands are [0]=import id, [1]=tag immediate, [2]=name id, [3]=size const, [4]=encoding const, [5]=flags const, but the loop checks getIdOperand(0)==nameId, getIdOperand(1)==width, getIdOperand(2)==signedness. getIdOperand(1) asserts on an immediate operand in debug builds, and the dedup never matches in release builds, producing duplicate integer debug types.","fix":"Use payload indices: getIdOperand(2)==nameId, getIdOperand(3)==makeUintConstant(width), getIdOperand(4)==makeUintConstant(signed/unsigned).","locations":[{"ref":"SPIRV/SpvBuilder.cpp:1060-1066","code":" 1060 |     for (int t = 0; t < (int)groupedDebugTypes[NonSemanticShaderDebugInfoDebugTypeBasic].size(); ++t) {\n 1061 |         type = groupedDebugTypes[NonSemanticShaderDebugInfoDebugTypeBasic][t];\n 1062 |         if (type->getIdOperand(0) == nameId &&\n 1063 |             type->getIdOperand(1) == static_cast<unsigned int>(width) &&\n 1064 |             type->getIdOperand(2) == (hasSign ? NonSemanticShaderDebugInfoSigned : NonSemanticShaderDebugInfoUnsigned))\n 1065 |             return type->getResultId();\n 1066 |     }","lines":7,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/SPIRV/SpvBuilder.cpp#L1060-L1066"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"makeFloatDebugType's dedup loop uses the wrong operand indices. Real operands: [0]=import id, [1]=tag immediate, [2]=name id, [3]=size const, [4]=encoding const, [5]=flags const, [6]=optional fpEncoding. The loop checks getIdOperand(0)==nameId, getIdOperand(1)==width, getIdOperand(2)==NonSemanticShaderDebugInfoFloat. getIdOperand(1) asserts on an immediate in debug builds; in release the float debug type is never deduplicated. (The getNumOperands()==6/7 and operand[6] fpEncoding checks are correct.)","fix":"Compare name at index 2, size const at index 3, and encoding const at index 4 (getIdOperand(2)==nameId, getIdOperand(3)==makeUintConstant(width), getIdOperand(4)==makeUintConstant(NonSemanticShaderDebugInfoFloat)).","locations":[{"ref":"SPIRV/SpvBuilder.cpp:1126-1138","code":" 1126 |     for (int t = 0; t < (int)groupedDebugTypes[NonSemanticShaderDebugInfoDebugTypeBasic].size(); ++t) {\n 1127 |         type = groupedDebugTypes[NonSemanticShaderDebugInfoDebugTypeBasic][t];\n 1128 |         if (type->getIdOperand(0) == nameId &&\n 1129 |             type->getIdOperand(1) == static_cast<unsigned int>(width) &&\n 1130 |             type->getIdOperand(2) == NonSemanticShaderDebugInfoFloat) {\n 1131 |             if (fpEncoding == NoType) {\n 1132 |                 if (type->getNumOperands() == 6)\n 1133 |                     return type->getResultId();\n 1134 |             } else {\n 1135 |                 if (type->getNumOperands() == 7 && type->getIdOperand(6) == fpEncoding)\n 1136 |                     return type->getResultId();\n 1137 |             }\n 1138 |         }","lines":13,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/SPIRV/SpvBuilder.cpp#L1126-L1138"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"makeSequentialDebugType's dedup loop checks getIdOperand(0)==baseType and getIdOperand(1)==makeUintConstant(componentCount), but operand [0] is the nonSemanticShaderDebugInfo import id and operand [1] is the immediate sequence-type tag; the base debug type is at index 2 and the count at index 3. getIdOperand(1) asserts on an immediate in debug builds; otherwise array/vector debug types are never deduplicated. Also note the loop compares against baseType while the stored operand is getDebugType(baseType), a further mismatch.","fix":"Compare getIdOperand(2)==getDebugType(baseType) and getIdOperand(3)==componentCount, matching the operands actually written below.","locations":[{"ref":"SPIRV/SpvBuilder.cpp:1167-1172","code":" 1167 |     for (int t = 0; t < (int)groupedDebugTypes[sequenceType].size(); ++t) {\n 1168 |         type = groupedDebugTypes[sequenceType][t];\n 1169 |         if (type->getIdOperand(0) == baseType &&\n 1170 |             type->getIdOperand(1) == makeUintConstant(componentCount))\n 1171 |             return type->getResultId();\n 1172 |     }","lines":6,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/SPIRV/SpvBuilder.cpp#L1167-L1172"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"makeMatrixDebugType's dedup loop checks getIdOperand(0)==vectorType and getIdOperand(1)==makeUintConstant(vectorCount). Operand [0] is the import id and operand [1] is the immediate DebugTypeMatrix tag; the vector debug type is at index 2 and the count at index 3. getIdOperand(1) asserts on an immediate operand in debug builds, and in release builds matrix debug types are never deduplicated. The loop also compares vectorType against the stored getDebugType(vectorType).","fix":"Compare getIdOperand(2)==getDebugType(vectorType) and getIdOperand(3)==makeUintConstant(vectorCount), matching what is written when the instruction is created.","locations":[{"ref":"SPIRV/SpvBuilder.cpp:1202-1208","code":" 1202 |     Instruction* type;\n 1203 |     for (int t = 0; t < (int)groupedDebugTypes[NonSemanticShaderDebugInfoDebugTypeMatrix].size(); ++t) {\n 1204 |         type = groupedDebugTypes[NonSemanticShaderDebugInfoDebugTypeMatrix][t];\n 1205 |         if (type->getIdOperand(0) == vectorType &&\n 1206 |             type->getIdOperand(1) == makeUintConstant(vectorCount))\n 1207 |             return type->getResultId();\n 1208 |     }","lines":7,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/SPIRV/SpvBuilder.cpp#L1202-L1208"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In the EOpMod folding, the EbtInt16 INT_MIN/-1 overflow special-case reads the wrong union field and uses the wrong sentinel. It calls getIConst() (reads the 32-bit iConst field of a 16-bit Int16 union, which is uninitialized/garbage for the active type) and compares against SHRT_MIN, while the EbtInt and EbtInt64 cases correctly use getI16Const-equivalent accessors. This both misreads the operands and the guard is essentially dead/incorrect for 16-bit values. (As a side note 16-bit operands are int-promoted before %, so no real overflow can occur, making this entire special case unnecessary, but the field misuse is the concrete defect.)","fix":"Use getI16Const() for both operands and compare against (signed short)SHRT_MIN, e.g. `if (rightUnionArray[i].getI16Const() == -1 && leftUnionArray[i].getI16Const() == SHRT_MIN)`, then setI16Const(0). Or remove the special case entirely since 16-bit % promotes to int and cannot overflow.","locations":[{"ref":"glslang/MachineIndependent/Constant.cpp:293-297","code":"  293 |                 case EbtInt16:\n  294 |                     if (rightUnionArray[i].getIConst() == -1 && leftUnionArray[i].getIConst() == SHRT_MIN) {\n  295 |                         newConstArray[i].setIConst(0);\n  296 |                         break;\n  297 |                     } else goto modulo_default;","lines":5,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/Constant.cpp#L293-L297"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"ShLinkExt assumes a 1:1 correspondence between input handle index i and the cObjects vector index, but cObjects is built by conditionally push_back-ing only handles that are a linker or a compiler. A handle that is neither (e.g. a uniform-map handle, or a non-glslang pointer) pushes nothing, so cObjects ends up shorter than the loop counter and 'cObjects[i]' reads out of bounds (TVector::operator[] is unchecked). A handle that is both linker and compiler pushes two entries and desyncs all later indices. The intent of the 'cObjects[i] == nullptr' check (validating the last-pushed object) is defeated.","fix":"Track the just-pushed object explicitly instead of indexing by handle position: capture base->getAsLinker()/getAsCompiler() into a local, return 0 if both are null, and push that local. Do not index cObjects with the handle loop variable i.","locations":[{"ref":"glslang/MachineIndependent/ShaderLang.cpp:1535-1549","code":" 1535 |     THandleList cObjects;\n 1536 | \n 1537 |     for (int i = 0; i < numHandles; ++i) {\n 1538 |         if (compHandles[i] == nullptr)\n 1539 |             return 0;\n 1540 |         TShHandleBase* base = reinterpret_cast<TShHandleBase*>(compHandles[i]);\n 1541 |         if (base->getAsLinker()) {\n 1542 |             cObjects.push_back(base->getAsLinker());\n 1543 |         }\n 1544 |         if (base->getAsCompiler())\n 1545 |             cObjects.push_back(base->getAsCompiler());\n 1546 | \n 1547 |         if (cObjects[i] == nullptr)\n 1548 |             return 0;\n 1549 |     }","lines":15,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/ShaderLang.cpp#L1535-L1549"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"TSpirvTypeParameter::operator== assumes both operands hold the same variant alternative. If `this` holds a constant (getAsConstant() != nullptr) but `rhs` holds a TType, then rhs.getAsConstant() returns nullptr and rhs.getAsConstant()->getConstArray() dereferences a null pointer. Comparing a constant-valued type parameter against a type-valued one (e.g. comparing two spirv_type declarations whose parameters differ in kind) is reachable and crashes.","fix":"Compare variant kinds first: if (getAsConstant() != nullptr) { return rhs.getAsConstant() != nullptr && getAsConstant()->getConstArray() == rhs.getAsConstant()->getConstArray(); } then handle the type case symmetrically (return rhs.getAsType() != nullptr && *getAsType() == *rhs.getAsType()). Equivalently compare value.index() before dereferencing.","locations":[{"ref":"glslang/MachineIndependent/SpirvIntrinsics.cpp:46-53","code":"   46 | bool TSpirvTypeParameter::operator==(const TSpirvTypeParameter& rhs) const\n   47 | {\n   48 |     if (getAsConstant() != nullptr)\n   49 |         return getAsConstant()->getConstArray() == rhs.getAsConstant()->getConstArray();\n   50 | \n   51 |     assert(getAsType() != nullptr);\n   52 |     return *getAsType() == *rhs.getAsType();\n   53 | }","lines":8,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/SpirvIntrinsics.cpp#L46-L53"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In OutputDouble's BinaryDoubleOutput path, the loop that prints the 64 raw bits of the double increments the bit pattern (++b) in the loop-increment clause in addition to shifting it left (b <<= 1). The ++b mutates the value being printed mid-dump, corrupting every printed bit pattern (a +1 carry is injected before each shift). The intent is to walk the bits MSB-first by shifting only; ++b is a leftover/copy-paste artifact and must be removed.","fix":"Change the loop to not increment b: `for (size_t i = 0; i < 8 * sizeof(value); ++i) { out.debug << ((b & 0x8000000000000000ull) != 0 ? \"1\" : \"0\"); b <<= 1; }`","locations":[{"ref":"glslang/MachineIndependent/intermOut.cpp:1205-1208","code":" 1205 |             for (size_t i = 0; i < 8 * sizeof(value); ++i, ++b) {\n 1206 |                 out.debug << ((b & 0x8000000000000000) != 0 ? \"1\" : \"0\");\n 1207 |                 b <<= 1;\n 1208 |             }","lines":4,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/intermOut.cpp#L1205-L1208"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"When copying resolved uniform results back into per-stage maps, a previously resolved binding is preserved only when 'resolvedBinding > 0'. Binding 0 is a perfectly valid and common binding, but the > 0 test treats it like the unset sentinel (-1) and discards it: 'at->second = p.second' overwrites newBinding and the guarded restore never runs, so the stage ends up with p.second.newBinding instead of the correct resolvedBinding of 0. The sentinel used everywhere else (clearNewAssignments) is -1, so the boundary should be >= 0.","fix":"Use 'if (resolvedBinding >= 0)' so a resolved binding of 0 is preserved; only -1 means unset.","locations":[{"ref":"glslang/MachineIndependent/iomapper.cpp:1840-1843","code":" 1840 |                             int resolvedBinding = at->second.newBinding;\n 1841 |                             at->second = p.second;\n 1842 |                             if (resolvedBinding > 0)\n 1843 |                                 at->second.newBinding = resolvedBinding;","lines":4,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/iomapper.cpp#L1840-L1843"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In CPPdefine's stringify/paste accumulation, the first '#' is recorded into savePound only when 'pendingPoundSymbols == 0', but that check runs AFTER 'pendingPoundSymbols++', so it is always >= 1 and the assignment is dead. savePound therefore stays a default-constructed (cleared) TPpToken. It is later used at the '##' paste branch (putToken(PpAtomPaste, &savePound)), so every pasted token carries a zeroed location/space instead of the real '#' token's data, giving wrong diagnostics/positions for token pasting.","fix":"Capture the pound token before incrementing, e.g. 'if (pendingPoundSymbols == 0) savePound = *ppToken; pendingPoundSymbols++;', so savePound holds the first '#' token.","locations":[{"ref":"glslang/MachineIndependent/preprocessor/Pp.cpp:159-163","code":"  159 |         if (token == '#') {\n  160 |             pendingPoundSymbols++;\n  161 |             if (pendingPoundSymbols == 0) {\n  162 |                 savePound = *ppToken;\n  163 |             }","lines":5,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/preprocessor/Pp.cpp#L159-L163"},{"ref":"glslang/MachineIndependent/preprocessor/Pp.cpp:191-193","code":"  191 |             for (int i = 0; i < pendingPoundSymbols / 2; i++) {\n  192 |                 mac.body.putToken(PpAtomPaste, &savePound);\n  193 |             }","lines":3,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/preprocessor/Pp.cpp#L191-L193"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In the HLSL '1.#INF' handling path of lFloatConst, after appending 'I','N','F' via saveName the code writes ppToken->name[len] = '\\0' directly without the overflow clamp used on the normal exit path (lines 314-320). saveName allows len to reach MaxTokenLength+1 (its guard is `len <= MaxTokenLength`, so it writes index MaxTokenLength and increments len to MaxTokenLength+1). The name buffer is char[MaxTokenLength+1] (valid indices 0..MaxTokenLength), so name[MaxTokenLength+1] is a one-byte out-of-bounds heap/stack write. A token like a 1024+ digit leading sequence followed by '.#INF' triggers it. This is only reachable when ENABLE_HLSL is built, but it is a real OOB write.","fix":"Before writing the terminating NUL in the #INF branch, clamp len the same way the normal path does: `if (len > MaxTokenLength) len = MaxTokenLength;` then `ppToken->name[len] = '\\0';`, or simply break to the shared clamp/terminate code instead of returning early.","locations":[{"ref":"glslang/MachineIndependent/preprocessor/PpScanner.cpp:160-169","code":"  160 |                     // we have [+-].#INF, and we are targeting IEEE 754, so wrap it up:\n  161 |                     saveName('I');\n  162 |                     saveName('N');\n  163 |                     saveName('F');\n  164 |                     ppToken->name[len] = '\\0';\n  165 |                     if (ppToken->name[0] == '-')\n  166 |                         ppToken->i64val = 0xfff0000000000000; // -Infinity\n  167 |                     else\n  168 |                         ppToken->i64val = 0x7ff0000000000000; // +Infinity\n  169 |                     return PpAtomConstFloat;","lines":10,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/glslang/MachineIndependent/preprocessor/PpScanner.cpp#L160-L169"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In createMiscOperation, the cases EOpHitObjectGetShaderBindingTableRecordIndexNV and ...EXT set typeId and opCode but then immediately `return 0` instead of `break`. Every other sibling getter case (e.g. EOpHitObjectGetHitKindNV/EXT just above and below) uses `break` so that control reaches the instruction-emission code at the bottom of the function. As written, if a node for these two ops ever reaches createMiscOperation it produces no SPIR-V instruction and returns the null id (0), and the assigned opCode/typeId are dead. This is either dead code (if these ops are always routed through createUnaryOperation) or a real miscompile of getHitObjectShaderBindingTableRecordIndex.","fix":"Replace the two `return 0;` statements with `break;` so the OpHitObjectGetShaderBindingTableRecordIndex{NV,EXT} instruction is emitted like the neighbouring getter cases.","locations":[{"ref":"SPIRV/GlslangToSpv.cpp:11562-11569","code":"11562 |     case glslang::EOpHitObjectGetShaderBindingTableRecordIndexNV:\n11563 |         typeId = builder.makeIntegerType(32, 0);\n11564 |         opCode = spv::Op::OpHitObjectGetShaderBindingTableRecordIndexNV;\n11565 |         return 0;\n11566 |     case glslang::EOpHitObjectGetShaderBindingTableRecordIndexEXT:\n11567 |         typeId = builder.makeIntegerType(32, 0);\n11568 |         opCode = spv::Op::OpHitObjectGetShaderBindingTableRecordIndexEXT;\n11569 |         return 0;","lines":8,"link":"https://github.com/KhronosGroup/glslang/blob/ebe60e331c21d5c7f09734fbdcebbc46ee5d8507/SPIRV/GlslangToSpv.cpp#L11562-L11569"}]},
