{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`remove_sensitive_headers` compares origins using `Uri::port()` directly, which returns `None` for an omitted default port. A redirect from `https://host/a` to `https://host:443/b` (same effective origin) yields `prev_uri.port() == None` but `next_uri.port() == Some(443)`, so the ports compare unequal and `Cookie`/`Authorization`/`Proxy-Authorization` are stripped even though the origin is identical. This breaks authenticated same-origin redirects that only differ by explicit vs implicit default port.","fix":"Normalize to effective ports before comparing, e.g. compute `port_or_default` from the scheme (`http` -> 80, `https` -> 443, `ws`/`wss` similarly) for both URIs and compare those, rather than comparing `next_uri.port() != prev_uri.port()` on the raw `Option<Port>`.","locations":[{"ref":"awc/src/middleware/redirect.rs:288-297","code":"  288 | fn remove_sensitive_headers(headers: &mut header::HeaderMap, prev_uri: &Uri, next_uri: &Uri) {\n  289 |     if next_uri.host() != prev_uri.host()\n  290 |         || next_uri.port() != prev_uri.port()\n  291 |         || next_uri.scheme() != prev_uri.scheme()\n  292 |     {\n  293 |         headers.remove(header::COOKIE);\n  294 |         headers.remove(header::AUTHORIZATION);\n  295 |         headers.remove(header::PROXY_AUTHORIZATION);\n  296 |     }\n  297 | }","lines":10,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/awc/src/middleware/redirect.rs#L288-L297"}]},
{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"`WebsocketsRequest::protocols` builds the header by folding with `acc + s.as_ref() + \",\"` and then `protos.pop()` to strip the trailing comma. If the supplied iterator is empty, `protos` is `\"\"`, `pop()` is a no-op, and `self.protocols` becomes `Some(String::new())`, causing an empty `Sec-WebSocket-Protocol` header to be sent during `connect`. An empty protocol list should not emit the header at all.","fix":"Build the list with `protos.into_iter().map(|s| s.as_ref().to_owned()).collect::<Vec<_>>().join(\",\")` and only set `self.protocols` when the result is non-empty (or leave it `None` for an empty iterator).","locations":[{"ref":"awc/src/ws.rs:112-123","code":"  112 |     pub fn protocols<U, V>(mut self, protos: U) -> Self\n  113 |     where\n  114 |         U: IntoIterator<Item = V>,\n  115 |         V: AsRef<str>,\n  116 |     {\n  117 |         let mut protos = protos\n  118 |             .into_iter()\n  119 |             .fold(String::new(), |acc, s| acc + s.as_ref() + \",\");\n  120 |         protos.pop();\n  121 |         self.protocols = Some(protos);\n  122 |         self\n  123 |     }","lines":12,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/awc/src/ws.rs#L112-L123"},{"ref":"awc/src/ws.rs:331-336","code":"  331 |         if let Some(protocols) = self.protocols.take() {\n  332 |             self.head.headers.insert(\n  333 |                 header::SEC_WEBSOCKET_PROTOCOL,\n  334 |                 HeaderValue::try_from(protocols.as_str()).unwrap(),\n  335 |             );\n  336 |         }","lines":6,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/awc/src/ws.rs#L331-L336"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"In the content `Encoder`, the error `trace!` messages in `ContentEncoder::write` say `\"Error decoding ...\"` even though this is the compression (encoding) path, not decoding. Additionally the `zstd` arm misspells the codec as `\"ztsd\"`. These are misleading log messages copied from the decoder.","fix":"Change each message from `\"Error decoding <codec> encoding\"` to `\"Error encoding <codec>\"`, and fix `\"ztsd\"` to `\"zstd\"` at line 396.","locations":[{"ref":"actix-http/src/encoding/encoder.rs:369","code":"  369 |                     trace!(\"Error decoding br encoding: {}\", err);","lines":1,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-http/src/encoding/encoder.rs#L369"},{"ref":"actix-http/src/encoding/encoder.rs:378","code":"  378 |                     trace!(\"Error decoding gzip encoding: {}\", err);","lines":1,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-http/src/encoding/encoder.rs#L378"},{"ref":"actix-http/src/encoding/encoder.rs:387","code":"  387 |                     trace!(\"Error decoding deflate encoding: {}\", err);","lines":1,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-http/src/encoding/encoder.rs#L387"},{"ref":"actix-http/src/encoding/encoder.rs:396","code":"  396 |                     trace!(\"Error decoding ztsd encoding: {}\", err);","lines":1,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-http/src/encoding/encoder.rs#L396"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"`Option<Vec<T>>::handle_field` keys stored state on `field.name().unwrap()`, whereas the sibling collectors (`Vec<T>`, `Option<T>`, and the bare `T` impls) all key on `field.form_field_name`. `field.name()` returns `content_disposition()?.get_name()` (an `Option`), so the `.unwrap()` is a latent panic if a field lacks a Content-Disposition `name`, and it is an inconsistent code path relative to the other three implementations that use the always-populated `form_field_name`. Although `MultipartForm` currently only accepts `multipart/form-data` (where the name is validated to exist), relying on `.unwrap()` here is fragile and easy to break.","fix":"Replace `let field_name = field.name().unwrap().to_string();` with `let field_name = field.form_field_name.clone();` to match the other `FieldGroupReader` impls and remove the `.unwrap()`.","locations":[{"ref":"actix-multipart/src/form/mod.rs:207","code":"  207 |         let field_name = field.name().unwrap().to_string();","lines":1,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-multipart/src/form/mod.rs#L207"}]},
{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"The `Last-Modified` header doc block shows the wrong ABNF: it reads `Expires = HTTP-date` (copy-pasted from `expires.rs`) instead of `Last-Modified = HTTP-date`.","fix":"Before: `/// Expires = HTTP-date` After: `/// Last-Modified = HTTP-date`.","locations":[{"ref":"actix-web/src/http/header/last_modified.rs:14","code":"   14 |     /// Expires = HTTP-date","lines":1,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-web/src/http/header/last_modified.rs#L14"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"In the `parse_value!` macro, the value is percent-decoded into `decoded` and then `decoded.parse()` is attempted, but the failure message formats `self.value` (the still-encoded input) instead of `decoded`. The reported error can therefore be misleading, e.g. it will claim it `can not parse \"%2F\"` when what actually failed to parse was the decoded `\"/\"`.","fix":"Format the decoded value in the error message.\nBefore:\n```rust\nde::value::Error::custom(format!(\"can not parse {:?} to a {}\", self.value, $tp))\n```\nAfter:\n```rust\nde::value::Error::custom(format!(\"can not parse {:?} to a {}\", decoded, $tp))\n```","locations":[{"ref":"actix-router/src/de.rs:66-68","code":"   66 |             let v = decoded.parse().map_err(|_| {\n   67 |                 de::value::Error::custom(format!(\"can not parse {:?} to a {}\", self.value, $tp))\n   68 |             })?;","lines":3,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-router/src/de.rs#L66-L68"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `Redirect::respond_to`, when `self.to` cannot be parsed into a `HeaderValue` (for example if it contains control characters or a newline), the code logs an error but still returns a response carrying the redirect status code (`307`/`308`/etc.) with NO `Location` header. Clients receive a redirect response with no target, which is a broken/confusing result rather than a clear failure.","fix":"On parse failure, return an error response instead of a header-less redirect. In the `else` branch of `if let Ok(hdr_val) = self.to.parse()`, build an internal-server-error response (e.g. via `HttpResponse::InternalServerError()`) in addition to logging, so a malformed target does not surface as a status-only redirect.","locations":[{"ref":"actix-web/src/redirect.rs:166-179","code":"  166 |     fn respond_to(self, _req: &HttpRequest) -> HttpResponse<Self::Body> {\n  167 |         let mut res = HttpResponse::with_body(self.status_code, ());\n  168 | \n  169 |         if let Ok(hdr_val) = self.to.parse() {\n  170 |             res.headers_mut().insert(LOCATION, hdr_val);\n  171 |         } else {\n  172 |             log::error!(\n  173 |                 \"redirect target location can not be converted to header value: {:?}\",\n  174 |                 self.to,\n  175 |             );\n  176 |         }\n  177 | \n  178 |         res\n  179 |     }","lines":14,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-web/src/redirect.rs#L166-L179"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In `h2proto::send_body`, when `send.poll_capacity(cx)` returns `None` while `buf` still holds unsent body bytes, the function returns `Ok(())` without ever calling `send_data(_, true)`. A closed capacity means the stream can no longer accept data, so the request body is truncated and end-of-stream is never explicitly signalled, yet the caller is told the body was sent successfully.","fix":"Treat a `None` from `poll_capacity` while data remains as an error (return a `SendRequestError` indicating the stream was reset/closed) rather than `Ok(())`.","locations":[{"ref":"awc/src/client/h2proto.rs:165-166","code":"  165 |         match poll_fn(|cx| send.poll_capacity(cx)).await {\n  166 |             None => return Ok(()),","lines":2,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/awc/src/client/h2proto.rs#L165-L166"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"In `Parser::parse`, an over-sized WebSocket frame is only rejected once the entire declared payload has been buffered. The `length > max_size` check at lines 119-124 runs only after the `if src.len() < frame_len { ... return Ok(None); }` early return. A client can declare a huge `length` (e.g. multi-GB via the 64-bit length field) and stream the bytes; the decoder keeps returning `Ok(None)` and the framed read buffer grows with the incoming data until `src.len() >= idx + length`, at which point it finally errors with `Overflow`. The `max_size`-capped `reserve` only limits pre-allocation, not the accumulation of actually-received bytes, so memory grows unbounded up to the declared frame size. This defeats the purpose of `max_size` as a DoS guard.","fix":"Reject the frame as soon as the declared `length` exceeds `max_size`, before waiting for the full payload. Move the `if length > max_size { return Err(ProtocolError::Overflow); }` check to run right after `length` is known (and before the `src.len() < frame_len` buffering branch), so the connection is torn down without buffering the whole oversized frame.","locations":[{"ref":"actix-http/src/ws/frame.rs:106-133","code":"  106 |         let frame_len = match idx.checked_add(length) {\n  107 |             Some(len) => len,\n  108 |             None => return Err(ProtocolError::Overflow),\n  109 |         };\n  110 | \n  111 |         // not enough data\n  112 |         if src.len() < frame_len {\n  113 |             let min_length = min(length, max_size);\n  114 |             let required_cap = match idx.checked_add(min_length) {\n  115 |                 Some(cap) => cap,\n  116 |                 None => return Err(ProtocolError::Overflow),\n  117 |             };\n  118 | \n  119 |             if src.capacity() < required_cap {\n  120 |                 src.reserve(required_cap - src.capacity());\n  121 |             }\n  122 |             return Ok(None);\n  123 |         }\n  124 | \n  125 |         // remove prefix\n  126 |         src.advance(idx);\n  127 | \n  128 |         // check for max allowed size\n  129 |         if length > max_size {\n  130 |             // drop the payload\n  131 |             src.advance(length);\n  132 |             return Err(ProtocolError::Overflow);\n  133 |         }","lines":28,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-http/src/ws/frame.rs#L106-L133"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"For every visible entry in a directory listing, `entry.metadata()` is called twice: once inside `Directory::is_visible` (to test the file type) and again in `directory_listing` (to decide whether to append a trailing `/`). Each call is a separate `stat`/`lstat` syscall, doubling the syscall count per entry for large directories.","fix":"Fetch the metadata once. Either have `is_visible` return the resolved metadata/file-type, or restructure `directory_listing` to call `entry.metadata()` a single time and reuse the result for both the visibility check and the directory-vs-file branch.","locations":[{"ref":"actix-files/src/directory.rs:36-38","code":"   36 |             if let Ok(ref md) = entry.metadata() {\n   37 |                 let ft = md.file_type();\n   38 |                 return ft.is_dir() || ft.is_file() || ft.is_symlink();","lines":3,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-files/src/directory.rs#L36-L38"},{"ref":"actix-files/src/directory.rs:79-107","code":"   79 |     for entry in dir.path.read_dir()? {\n   80 |         if dir.is_visible(&entry) {\n   81 |             let entry = entry.unwrap();\n   82 |             let p = match entry.path().strip_prefix(&dir.path) {\n   83 |                 Ok(p) if cfg!(windows) => base.join(p).to_string_lossy().replace('\\\\', \"/\"),\n   84 |                 Ok(p) => base.join(p).to_string_lossy().into_owned(),\n   85 |                 Err(_) => continue,\n   86 |             };\n   87 | \n   88 |             // if file is a directory, add '/' to the end of the name\n   89 |             if let Ok(metadata) = entry.metadata() {\n   90 |                 if metadata.is_dir() {\n   91 |                     let _ = write!(\n   92 |                         body,\n   93 |                         \"<li><a href=\\\"{}\\\">{}/<\/a><\/li>\",\n   94 |                         encode_file_url!(p),\n   95 |                         encode_file_name!(entry),\n   96 |                     );\n   97 |                 } else {\n   98 |                     let _ = write!(\n   99 |                         body,\n  100 |                         \"<li><a href=\\\"{}\\\">{}<\/a><\/li>\",\n  101 |                         encode_file_url!(p),\n  102 |                         encode_file_name!(entry),\n  103 |                     );\n  104 |                 }\n  105 |             } else {\n  106 |                 continue;\n  107 |             }","lines":29,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-files/src/directory.rs#L79-L107"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`Drain::next` pops each header value from the front of the `SmallVec` with `vals.remove(0)`, which is O(n) per element and O(n^2) for a header name with many values (the `// OPTIMIZE: array removals` comment acknowledges this). For pathological multi-value headers this is quadratic.","fix":"Convert the value list into a `smallvec::IntoIter` when first entering a value set (as `IntoIter` already does) and pull from the front in O(1) amortised, or drain from the back if order is not required.","locations":[{"ref":"actix-http/src/header/map.rs:843-853","code":"  843 |         if let Some((ref mut name, ref mut vals)) = self.multi_inner {\n  844 |             if !vals.is_empty() {\n  845 |                 // OPTIMIZE: array removals\n  846 |                 self.remaining -= 1;\n  847 |                 return Some((name.take(), vals.remove(0)));\n  848 |             } else {\n  849 |                 // no more items in value iterator; reset state\n  850 |                 self.multi_inner = None;\n  851 |                 self.multi_idx = 0;\n  852 |             }\n  853 |         }","lines":11,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-http/src/header/map.rs#L843-L853"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`HttpMessage::chunked` uses `s.to_lowercase()` (Unicode-aware, allocates a `String`) before `contains(\"chunked\")`. Header values are ASCII and the sibling method `RequestHead::upgrade` already uses the cheaper `to_ascii_lowercase`. The Unicode lowering is both slower and semantically inappropriate here.","fix":"Use `s.to_ascii_lowercase().contains(\"chunked\")`, or avoid the allocation entirely with a case-insensitive substring check.","locations":[{"ref":"actix-http/src/http_message.rs:93-103","code":"   93 |     fn chunked(&self) -> Result<bool, ParseError> {\n   94 |         if let Some(encodings) = self.headers().get(header::TRANSFER_ENCODING) {\n   95 |             if let Ok(s) = encodings.to_str() {\n   96 |                 Ok(s.to_lowercase().contains(\"chunked\"))\n   97 |             } else {\n   98 |                 Err(ParseError::Header)\n   99 |             }\n  100 |         } else {\n  101 |             Ok(false)\n  102 |         }\n  103 |     }","lines":11,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-http/src/http_message.rs#L93-L103"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`Request::upgrade` lowercases the `Connection` header value with `to_lowercase()`, which performs full Unicode case folding and allocates a `String`, even though HTTP header tokens are ASCII. This runs on every upgrade check.","fix":"Avoid the allocation and Unicode folding. Before:\n```rust\nreturn s.to_lowercase().contains(\"upgrade\");\n```\nAfter:\n```rust\nreturn s.to_ascii_lowercase().contains(\"upgrade\");\n```\n(or, better, compare tokens case-insensitively without allocating).","locations":[{"ref":"actix-http/src/requests/request.rs:163-168","code":"  163 |         if let Some(conn) = self.head().headers.get(header::CONNECTION) {\n  164 |             if let Ok(s) = conn.to_str() {\n  165 |                 return s.to_lowercase().contains(\"upgrade\");\n  166 |             }\n  167 |         }\n  168 |         self.head().method == Method::CONNECT","lines":6,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-http/src/requests/request.rs#L163-L168"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"The multipart `Bytes` field reader unconditionally pre-allocates a 128 KiB `BytesMut` (`BytesMut::with_capacity(131_072)`) for every field regardless of the field's actual size or the configured `limits`. A form with many small fields wastes large amounts of memory up front. Note the lower-level `Field::bytes` collector instead starts at a modest 2 KiB and grows.","fix":"Start with a smaller initial capacity (as `Field::bytes` does with `INITIAL_ALLOC_BYTES`) and/or cap the initial allocation at the field limit, letting `BytesMut` grow as needed.","locations":[{"ref":"actix-multipart/src/form/bytes.rs:29-36","code":"   29 |     fn read_field(_: &'t HttpRequest, mut field: Field, limits: &'t mut Limits) -> Self::Future {\n   30 |         Box::pin(async move {\n   31 |             let mut buf = BytesMut::with_capacity(131_072);\n   32 | \n   33 |             while let Some(chunk) = field.try_next().await? {\n   34 |                 limits.try_consume_limits(chunk.len(), true)?;\n   35 |                 buf.extend(chunk);\n   36 |             }","lines":8,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-multipart/src/form/bytes.rs#L29-L36"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`NormalizePathNormalization::call` allocates a fresh `String` for every request on the hot path even when nothing changes. For `TrailingSlash::Trim` it calls `.trim_end_matches('/').to_string()` and for `TrailingSlash::MergeOnly` it calls `original_path.to_string()`; the latter is a pure unconditional clone of the path that is immediately handed to `merge_slash.replace_all`, which already returns a borrowing `Cow` when there is nothing to merge. So an already-normalized path still incurs an allocation on every request.","fix":"Keep the intermediate path as a `Cow<str>` / `&str`. For `MergeOnly` pass `original_path` straight into `merge_slash.replace_all(original_path, \"/\")` with no `to_string()`, and for `Trim` keep the `trim_end_matches('/')` slice borrowed instead of calling `.to_string()`. `replace_all` accepts `&str`, so the only allocation happens when the path actually changes.","locations":[{"ref":"actix-web/src/middleware/normalize.rs:184-195","code":"  184 |             let path = match self.trailing_slash_behavior {\n  185 |                 TrailingSlash::Always => format!(\"{}/\", original_path),\n  186 |                 TrailingSlash::MergeOnly => original_path.to_string(),\n  187 |                 TrailingSlash::Trim => original_path.trim_end_matches('/').to_string(),\n  188 |             };\n  189 | \n  190 |             // normalize multiple /'s to one /\n  191 |             let path = self.merge_slash.replace_all(&path, \"/\");\n  192 | \n  193 |             // Ensure root paths are still resolvable. If resulting path is blank after previous\n  194 |             // step it means the path was one or more slashes. Reduce to single slash.\n  195 |             let path = if path.is_empty() { \"/\" } else { path.as_ref() };","lines":12,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-web/src/middleware/normalize.rs#L184-L195"}]},
{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"The buffering extractors always pre-allocate a fixed `BytesMut::with_capacity(8192)` regardless of the (often known) `Content-Length` or configured `limit`. For many small requests this over-allocates, and for large known-length bodies it forces repeated reallocations as the buffer grows from 8kB. The known content length and limit are both available at construction time and could size the buffer more accurately.","fix":"Size the initial `BytesMut` from the known length clamped to the limit, e.g. `BytesMut::with_capacity(length.map_or(8192, |len| len.min(limit)))`, falling back to a sensible default when the length is unknown.","locations":[{"ref":"actix-web/src/types/json.rs:370","code":"  370 |             buf: BytesMut::with_capacity(8192),","lines":1,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-web/src/types/json.rs#L370"},{"ref":"actix-web/src/types/form.rs:380","code":"  380 |                 let mut body = BytesMut::with_capacity(8192);","lines":1,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-web/src/types/form.rs#L380"},{"ref":"actix-web/src/types/payload.rs:395","code":"  395 |             buf: BytesMut::with_capacity(8192),","lines":1,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-web/src/types/payload.rs#L395"}]},
{"id":"PERF_9","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"`from_comma_delimited` trims each split segment twice: once inside the first `filter_map` (`match x.trim()`), which yields the already-trimmed slice, and again in the second `filter_map` (`x.trim().parse()`). The second `trim()` is a no-op on an already-trimmed slice.","fix":"Drop the redundant `.trim()` in the second closure: `.filter_map(|x| x.parse().ok())`.","locations":[{"ref":"actix-http/src/header/utils.rs:21-28","code":"   21 |         result.extend(\n   22 |             s.split(',')\n   23 |                 .filter_map(|x| match x.trim() {\n   24 |                     \"\" => None,\n   25 |                     y => Some(y),\n   26 |                 })\n   27 |                 .filter_map(|x| x.trim().parse().ok()),\n   28 |         )","lines":8,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-http/src/header/utils.rs#L21-L28"}]},
{"id":"PERF_10","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"`ConnectionInfo::new` calls `name.trim().to_lowercase()` for every `Forwarded` parameter pair, allocating a new `String` per pair solely to compare against the fixed set `for`/`proto`/`host`/`by`. This is an unnecessary allocation on a hot request path.","fix":"Use `eq_ignore_ascii_case` against the candidate names (e.g. match on `name.trim()` with `.eq_ignore_ascii_case(\"for\")` etc.) to avoid the per-pair `String` allocation, since RFC 7239 parameter names are ASCII and case-insensitive.","locations":[{"ref":"actix-web/src/info.rs:116","code":"  116 |             match name.trim().to_lowercase().as_str() {","lines":1,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-web/src/info.rs#L116"}]},
{"id":"PERF_11","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"`UrlEncoded::new` compares content type via `req.content_type().to_lowercase() != \"application/x-www-form-urlencoded\"`, allocating a fresh lowercased `String` on every form request purely for a comparison.","fix":"Use a case-insensitive comparison without allocation, e.g. `req.content_type().eq_ignore_ascii_case(\"application/x-www-form-urlencoded\")`.","locations":[{"ref":"actix-web/src/types/form.rs:292","code":"  292 |         if req.content_type().to_lowercase() != \"application/x-www-form-urlencoded\" {","lines":1,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-web/src/types/form.rs#L292"}]},
{"id":"PERF_12","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"The HOST header buffer is allocated with `BytesMut::with_capacity(host.len() + 5)`, but the formatted value `host:port` can be `host.len() + 1 (colon) + 5 (max u16 digits) = host.len() + 6` bytes, so a 5-digit port forces a reallocation. Correctness is unaffected (the writer grows) but the capacity hint is off by one.","fix":"Before: `let mut wrt = BytesMut::with_capacity(host.len() + 5).writer();` After: `let mut wrt = BytesMut::with_capacity(host.len() + 6).writer();`","locations":[{"ref":"awc/src/client/h1proto.rs:71","code":"   71 |             let mut wrt = BytesMut::with_capacity(host.len() + 5).writer();","lines":1,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/awc/src/client/h1proto.rs#L71"}]},
{"id":"PERF_13","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"`set_header_if_none` for the `Rc` variant uses `extra_headers.get_or_insert(HeaderMap::new())`, which eagerly constructs a `HeaderMap` on every call even when the `Option` is already `Some`. The lazy form avoids the needless allocation/construction.","fix":"Before:\n```rust\nlet h = extra_headers.get_or_insert(HeaderMap::new());\n```\nAfter:\n```rust\nlet h = extra_headers.get_or_insert_with(HeaderMap::new);\n```","locations":[{"ref":"awc/src/sender.rs:306","code":"  306 |                             let h = extra_headers.get_or_insert(HeaderMap::new());","lines":1,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/awc/src/sender.rs#L306"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"Under the `experimental-io-uring` feature, `ChunkedReadFile` still carries a `read_mode: ReadMode` field and `new_chunked_read` still computes and sets it (`if size < read_mode_threshold ...`), but the io-uring `Stream` impl never reads it (io-uring reads are always async). The field, its initialization, and the sync/async threshold computation are dead under that feature.","fix":"Gate the `read_mode` field and its initialization behind `#[cfg(not(feature = \"experimental-io-uring\"))]` so it is not present/computed when io-uring is enabled.","locations":[{"ref":"actix-files/src/chunked.rs:24-32","code":"   24 |     pub struct ChunkedReadFile<F, Fut> {\n   25 |         size: u64,\n   26 |         offset: u64,\n   27 |         #[pin]\n   28 |         state: ChunkedReadFileState<Fut>,\n   29 |         counter: u64,\n   30 |         callback: F,\n   31 |         read_mode: ReadMode,\n   32 |     }","lines":9,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-files/src/chunked.rs#L24-L32"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`impl ToTokens for MethodTypeExt` (the plain `to_tokens` that emits an `Ident`) is never exercised. All guard code generation goes through `to_tokens_single_guard`, `to_tokens_multi_guard`, and `to_tokens_multi_guard_or_chain`, which match on the enum and interpolate `#method` (a `&MethodType`) or `#lit` directly; no `quote!` interpolates a `MethodTypeExt` value via `#`. `MethodTypeExt` is a private enum, so this impl is unused dead code (and for `Custom` it would additionally mis-emit a bare method name as an identifier).","fix":"Remove the `impl ToTokens for MethodTypeExt` block, or add a test/usage if it is meant to be used.","locations":[{"ref":"actix-web-codegen/src/route.rs:200-210","code":"  200 | impl ToTokens for MethodTypeExt {\n  201 |     fn to_tokens(&self, stream: &mut TokenStream2) {\n  202 |         match self {\n  203 |             MethodTypeExt::Custom(lit_str) => {\n  204 |                 let ident = Ident::new(lit_str.value().as_str(), Span::call_site());\n  205 |                 stream.append(ident);\n  206 |             }\n  207 |             MethodTypeExt::Standard(method) => method.to_tokens(stream),\n  208 |         }\n  209 |     }\n  210 | }","lines":11,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-web-codegen/src/route.rs#L200-L210"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`has_allowed_methods_in_scope` accepts an attribute path equal to the identifier `ROUTE` (upper-case). No such macro exists; the routing attribute macros generated by this crate are all lower-case (`route`, `get`, `post`, ...). The `attr.path().is_ident(\"ROUTE\")` branch can never be true for real code and is dead. It also hides the fact that the real multi-route macro `routes` is not handled by `#[scope]`.","fix":"Remove the `|| attr.path().is_ident(\"ROUTE\")` clause. If handling of `#[routes]` inside a scope is desired, add explicit support instead of relying on a non-existent `ROUTE` name.","locations":[{"ref":"actix-web-codegen/src/scope.rs:99-103","code":"   99 | fn has_allowed_methods_in_scope(attr: &syn::Attribute) -> bool {\n  100 |     MethodType::from_path(attr.path()).is_ok()\n  101 |         || attr.path().is_ident(\"route\")\n  102 |         || attr.path().is_ident(\"ROUTE\")\n  103 | }","lines":5,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-web-codegen/src/scope.rs#L99-L103"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"The final `else` arm of the URI scheme validation is unreachable. The preceding `else if uri.scheme().is_none()` already returns for the `None` case, so by the time control reaches `else if let Some(scheme) = uri.scheme()` the scheme is always `Some`; the trailing `else { return Err(InvalidUrl::UnknownScheme.into()) }` can never execute.","fix":"Drop the dead trailing `else` branch and fold the scheme match directly, e.g. replace the `else if let Some(scheme) = uri.scheme()` / `else` pair with a single `else` that unwraps the already-known-present scheme via `uri.scheme().unwrap()` and matches on `scheme.as_str()`.","locations":[{"ref":"awc/src/ws.rs:274-285","code":"  274 |         if uri.host().is_none() {\n  275 |             return Err(InvalidUrl::MissingHost.into());\n  276 |         } else if uri.scheme().is_none() {\n  277 |             return Err(InvalidUrl::MissingScheme.into());\n  278 |         } else if let Some(scheme) = uri.scheme() {\n  279 |             match scheme.as_str() {\n  280 |                 \"http\" | \"ws\" | \"https\" | \"wss\" => {}\n  281 |                 _ => return Err(InvalidUrl::UnknownScheme.into()),\n  282 |             }\n  283 |         } else {\n  284 |             return Err(InvalidUrl::UnknownScheme.into());\n  285 |         }","lines":12,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/awc/src/ws.rs#L274-L285"}]},
{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`FilesError::IsNotDirectory` is never constructed anywhere in the crate (confirmed: the identifier only appears at its own definition) and is explicitly annotated `#[allow(dead_code)]`. It is dead.","fix":"Remove the unused variant (and its `#[allow(dead_code)]`).\n\nBefore:\n```rust\n    /// Path is not a directory.\n    #[allow(dead_code)]\n    #[display(\"path is not a directory. Unable to serve static files\")]\n    IsNotDirectory,\n```\n\nAfter: (delete the variant entirely)","locations":[{"ref":"actix-files/src/error.rs:6-10","code":"    6 | pub enum FilesError {\n    7 |     /// Path is not a directory.\n    8 |     #[allow(dead_code)]\n    9 |     #[display(\"path is not a directory. Unable to serve static files\")]\n   10 |     IsNotDirectory,","lines":5,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-files/src/error.rs#L6-L10"}]},
{"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"The `Drain` iterator's `multi_idx` field is written (initialised to `0` in `Drain::new` and reset to `0` when a value list is exhausted) but never read. Unlike `Iter`, `Drain` advances through the value list with `vals.remove(0)`, so the index is unused state.","fix":"Remove the `multi_idx` field from `Drain` and the two assignments to it.","locations":[{"ref":"actix-http/src/header/map.rs:823","code":"  823 |     multi_idx: usize,","lines":1,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-http/src/header/map.rs#L823"},{"ref":"actix-http/src/header/map.rs:838-853","code":"  838 | impl Iterator for Drain<'_> {\n  839 |     type Item = (Option<HeaderName>, HeaderValue);\n  840 | \n  841 |     fn next(&mut self) -> Option<Self::Item> {\n  842 |         // handle in-progress multi value iterators first\n  843 |         if let Some((ref mut name, ref mut vals)) = self.multi_inner {\n  844 |             if !vals.is_empty() {\n  845 |                 // OPTIMIZE: array removals\n  846 |                 self.remaining -= 1;\n  847 |                 return Some((name.take(), vals.remove(0)));\n  848 |             } else {\n  849 |                 // no more items in value iterator; reset state\n  850 |                 self.multi_inner = None;\n  851 |                 self.multi_idx = 0;\n  852 |             }\n  853 |         }","lines":16,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-http/src/header/map.rs#L838-L853"}]},
{"id":"DEAD_7","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"In `Inner::skip_until_boundary`, the guard `if chunk.is_empty() { return Err(Error::BoundaryMissing); }` can never fire: `chunk` comes from `payload.readline()` (i.e. `read_until(b\"\\n\")`), which only returns `Some` when the newline needle is found, so the returned chunk always contains at least the `\\n` byte and is never empty. The defensive branch is effectively dead.","fix":"Remove the unreachable `chunk.is_empty()` check, or add a comment clarifying it is purely defensive; if empty-line detection is genuinely intended, compare against `b\"\\r\\n\"`/`b\"\\n\"` instead of `is_empty()`.","locations":[{"ref":"actix-multipart/src/multipart.rs:358-361","code":"  358 |                 Some(chunk) => {\n  359 |                     if chunk.is_empty() {\n  360 |                         return Err(Error::BoundaryMissing);\n  361 |                     }","lines":4,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-multipart/src/multipart.rs#L358-L361"}]},
{"id":"DEAD_8","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `Inner::poll`, `self.state = State::Boundary;` is set redundantly. When execution reaches this point the state has already been set to `State::Boundary` immediately after the field headers are read (in the `if self.state == State::Headers` block), and nothing between those two points changes `state`. The second assignment is dead.","fix":"Remove the redundant assignment.\nBefore:\n```rust\n            self.state = State::Boundary;\n\n            // nested multipart stream is not supported\n```\nAfter:\n```rust\n            // nested multipart stream is not supported\n```","locations":[{"ref":"actix-multipart/src/multipart.rs:501","code":"  501 |             self.state = State::Boundary;","lines":1,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-multipart/src/multipart.rs#L501"}]},
{"id":"DEAD_9","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `EntityTag::from_str`, the guards `slice.len() >= 2` (strong branch) and `slice.len() >= 4` are partly redundant: the early return already guarantees `slice.len() >= 2`, so the `slice.len() >= 2` re-check on the strong branch is always true. It is dead defensive code that obscures the logic.","fix":"Before: `if slice.len() >= 2 && slice.starts_with('\"') && check_slice_validity(&slice[1..length - 1])` After: `if slice.starts_with('\"') && check_slice_validity(&slice[1..length - 1])` (the `slice.len() >= 2` term is guaranteed by the earlier `slice.len() < 2` early return).","locations":[{"ref":"actix-web/src/http/header/entity.rs:155","code":"  155 |         if slice.len() >= 2 && slice.starts_with('\"') && check_slice_validity(&slice[1..length - 1])","lines":1,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-web/src/http/header/entity.rs#L155"}]},
{"id":"DEAD_10","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `Acquired::release`, the statement `let _ = &self.permit;` is a no-op: it borrows the field and immediately discards it, doing nothing at runtime and not actually keeping the permit alive any longer (the permit lives as long as `self`/`Acquired` regardless). It only adds noise.","fix":"Remove the line. Before: `        let _ = &self.permit;` After: (delete the line; if intent was documentation, replace with a one-line comment noting the permit is released when `Acquired` drops).","locations":[{"ref":"awc/src/client/pool.rs:375","code":"  375 |         let _ = &self.permit;","lines":1,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/awc/src/client/pool.rs#L375"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"`handshake_with_protocols` docs state the response contains \"the first protocol in this list [the server's `protocols` argument] which the server also knows\", implying server preference order. The implementation instead iterates over the *client's* requested protocol list (`req_protocols.split(',')`) and returns the first *client* protocol the server knows, i.e. client preference order wins. The test with server list `[\"p3\", \"p2\"]` and client `\"p1, p2, p3\"` returns `\"p2\"` (client order) rather than `\"p3\"` (server order), confirming the mismatch. Either the doc or the selection logic is wrong.","fix":"Decide the intended precedence. To honor server preference (as the doc implies), iterate `protocols` outer and check membership in the request list: `protocols.iter().find(|p| req_protocols.split(',').map(str::trim).any(|rp| rp == **p))`. Otherwise, correct the doc to say the client's preferred order is used.","locations":[{"ref":"actix-web-actors/src/ws.rs:371-435","code":"  371 | /// `protocols` is a sequence of known protocols. On successful handshake, the returned response\n  372 | /// headers contain the first protocol in this list which the server also knows.\n  373 | pub fn handshake_with_protocols(\n  374 |     req: &HttpRequest,\n  375 |     protocols: &[&str],\n  376 | ) -> Result<HttpResponseBuilder, HandshakeError> {\n  377 |     // WebSocket accepts only GET\n  378 |     if *req.method() != Method::GET {\n  379 |         return Err(HandshakeError::GetMethodRequired);\n  380 |     }\n  381 | \n  382 |     // check for \"UPGRADE\" to WebSocket header\n  383 |     let has_hdr = if let Some(hdr) = req.headers().get(&header::UPGRADE) {\n  384 |         if let Ok(s) = hdr.to_str() {\n  385 |             s.to_ascii_lowercase().contains(\"websocket\")\n  386 |         } else {\n  387 |             false\n  388 |         }\n  389 |     } else {\n  390 |         false\n  391 |     };\n  392 |     if !has_hdr {\n  393 |         return Err(HandshakeError::NoWebsocketUpgrade);\n  394 |     }\n  395 | \n  396 |     // Upgrade connection\n  397 |     if !req.head().upgrade() {\n  398 |         return Err(HandshakeError::NoConnectionUpgrade);\n  399 |     }\n  400 | \n  401 |     // check supported version\n  402 |     if !req.headers().contains_key(&header::SEC_WEBSOCKET_VERSION) {\n  403 |         return Err(HandshakeError::NoVersionHeader);\n  404 |     }\n  405 |     let supported_ver = {\n  406 |         if let Some(hdr) = req.headers().get(&header::SEC_WEBSOCKET_VERSION) {\n  407 |             hdr == \"13\" || hdr == \"8\" || hdr == \"7\"\n  408 |         } else {\n  409 |             false\n  410 |         }\n  411 |     };\n  412 |     if !supported_ver {\n  413 |         return Err(HandshakeError::UnsupportedVersion);\n  414 |     }\n  415 | \n  416 |     // check client handshake for validity\n  417 |     if !req.headers().contains_key(&header::SEC_WEBSOCKET_KEY) {\n  418 |         return Err(HandshakeError::BadWebsocketKey);\n  419 |     }\n  420 |     let key = {\n  421 |         let key = req.headers().get(&header::SEC_WEBSOCKET_KEY).unwrap();\n  422 |         hash_key(key.as_ref())\n  423 |     };\n  424 | \n  425 |     // check requested protocols\n  426 |     let protocol = req\n  427 |         .headers()\n  428 |         .get(&header::SEC_WEBSOCKET_PROTOCOL)\n  429 |         .and_then(|req_protocols| {\n  430 |             let req_protocols = req_protocols.to_str().ok()?;\n  431 |             req_protocols\n  432 |                 .split(',')\n  433 |                 .map(|req_p| req_p.trim())\n  434 |                 .find(|req_p| protocols.iter().any(|p| p == req_p))\n  435 |         });","lines":65,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-web-actors/src/ws.rs#L371-L435"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The `UrlencodedError::UnknownLength` variant's doc comment and its `Display` string both read `Payload size is now known.` - a typo; the intended meaning is that the size is *not* known (this is the length-required / unknown-length error). The wrong word is surfaced to end users via the error response body.","fix":"Replace `now` with `not` in both lines.\nBefore:\n```\n    /// Payload size is now known.\n    #[display(\"Payload size is now known.\")]\n```\nAfter:\n```\n    /// Payload size is not known.\n    #[display(\"Payload size is not known.\")]\n```","locations":[{"ref":"actix-web/src/error/mod.rs:74-76","code":"   74 |     /// Payload size is now known.\n   75 |     #[display(\"Payload size is now known.\")]\n   76 |     UnknownLength,","lines":3,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-web/src/error/mod.rs#L74-L76"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment for `DispositionParam::as_unknown_ext` describes the `UnknownExt` variant but links to `[`Unknown`](DispositionParam::Unknown)` (copy-paste from `as_unknown`). The method actually matches `DispositionParam::UnknownExt`, so the rendered docs point to the wrong variant.","fix":"Fix the variant reference.\nBefore:\n```\n    /// [`Unknown`](DispositionParam::Unknown) and the `name` matches.\n```\nAfter:\n```\n    /// [`UnknownExt`](DispositionParam::UnknownExt) and the `name` matches.\n```","locations":[{"ref":"actix-web/src/http/header/content_disposition.rs:194-195","code":"  194 |     /// Returns the value of the unrecognized extended parameter if it is\n  195 |     /// [`Unknown`](DispositionParam::Unknown) and the `name` matches.","lines":2,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-web/src/http/header/content_disposition.rs#L194-L195"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The `Logger` format documentation states that `%b` is the \"Size of response in bytes, including HTTP headers\", but `StreamLog` only accumulates body chunk lengths (`*this.size += chunk.len()`) and never counts header bytes. The reported size excludes headers entirely, so the doc is inaccurate.","fix":"Correct the doc to reflect reality: `%b` is the size of the response body in bytes (excluding HTTP headers), matching the Apache `%b`/`%B` convention. Alternatively, if header bytes should be included, actually add them to `size`, but the simplest correct fix is updating the description.","locations":[{"ref":"actix-web/src/middleware/logger.rs:69","code":"   69 | /// `%b` | Size of response in bytes, including HTTP headers","lines":1,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-web/src/middleware/logger.rs#L69"},{"ref":"actix-web/src/middleware/logger.rs:474-477","code":"  474 |         match ready!(this.body.poll_next(cx)) {\n  475 |             Some(Ok(chunk)) => {\n  476 |                 *this.size += chunk.len();\n  477 |                 Poll::Ready(Some(Ok(chunk)))","lines":4,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-web/src/middleware/logger.rs#L474-L477"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment on `Format::new` claims it returns `None` on invalid syntax, but the function returns `Format` (not `Option<Format>`); it never signals an error and silently drops/reinterprets unrecognized directives. The comment misleads callers into thinking they can detect malformed format strings.","fix":"Remove the false sentence. Before: `/// Returns `None` if the format string syntax is incorrect.` After: delete that line (the function is infallible and returns `Format`).","locations":[{"ref":"actix-web/src/middleware/logger.rs:497-499","code":"  497 |     /// Create a `Format` from a format string.\n  498 |     ///\n  499 |     /// Returns `None` if the format string syntax is incorrect.","lines":3,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-web/src/middleware/logger.rs#L497-L499"}]},
{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment on `UrlEncoded::limit` claims a 256kB default, but `UrlEncoded::new` (line 326) and `UrlEncoded::err` (line 337) both set `limit: 32_768`, i.e. 32kB. The comment misstates the actual default by 8x.","fix":"Change `/// Set maximum accepted payload size. The default limit is 256kB.` to `/// Set maximum accepted payload size. The default limit is 32kB.`","locations":[{"ref":"actix-web/src/types/form.rs:344","code":"  344 |     /// Set maximum accepted payload size. The default limit is 256kB.","lines":1,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-web/src/types/form.rs#L344"}]},
{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The `ConnectionState::Skip` doc comment claims the IO `should be skipped but not dropped`, but in `ConnectionPool::call` the `ConnectionState::Skip => continue` arm drops the popped connection `c` at the end of the loop iteration (its `Io` is not returned to the pool nor gracefully closed), so it is in fact dropped.","fix":"Update the comment to reflect reality. Before: `/// IO should be skipped but not dropped.` After: `/// IO reached EOF (or errored) and is dropped, ending its use for this acquire.`","locations":[{"ref":"awc/src/client/pool.rs:271","code":"  271 |     /// IO should be skipped but not dropped.","lines":1,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/awc/src/client/pool.rs#L271"},{"ref":"awc/src/client/pool.rs:217","code":"  217 |                                     ConnectionState::Skip => continue,","lines":1,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/awc/src/client/pool.rs#L217"}]},
{"id":"CMT_8","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment on `ResponseBody` (the raw `Bytes` body reader) is copy-pasted from `JsonBody`: it states the future errors if `content type is not application/json` and references `[limit](JsonBody::limit)`. `ResponseBody` neither checks content type nor relates to `JsonBody`; it only fails on payload-length overflow / unknown length.","fix":"Rewrite the `ResponseBody` doc comment. Before: `/// - content type is not `application/json`;` and `[limit](JsonBody::limit)`. After: remove the content-type bullet and reference `[limit](ResponseBody::limit)`, describing only the overflow / unknown-length error cases.","locations":[{"ref":"awc/src/responses/response_body.rs:18-22","code":"   18 |     ///\n   19 |     /// # Errors\n   20 |     /// `Future` implementation returns error if:\n   21 |     /// - content type is not `application/json`;\n   22 |     /// - content length is greater than [limit](JsonBody::limit) (default: 2 MiB).","lines":5,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/awc/src/responses/response_body.rs#L18-L22"}]},
{"id":"CMT_9","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The doc comment for `equiv_utf8_text` says it \"Transforms MIME `text/*` types into their UTF-8 equivalent\", but the function also converts `application/javascript` (which is not a `text/*` type), as the comment's own bullet list acknowledges. The summary line is therefore misleading.","fix":"Reword the summary, e.g.\n\nBefore:\n```rust\n/// Transforms MIME `text/*` types into their UTF-8 equivalent, if supported.\n```\n\nAfter:\n```rust\n/// Transforms select text-based MIME types into their UTF-8 equivalent, if supported.\n```","locations":[{"ref":"actix-files/src/encoding.rs:3-11","code":"    3 | /// Transforms MIME `text/*` types into their UTF-8 equivalent, if supported.\n    4 | ///\n    5 | /// MIME types that are converted\n    6 | /// - application/javascript\n    7 | /// - text/html\n    8 | /// - text/css\n    9 | /// - text/plain\n   10 | /// - text/csv\n   11 | /// - text/tab-separated-values","lines":9,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-files/src/encoding.rs#L3-L11"}]},
{"id":"CMT_10","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The `kind` field of `ErrorInner` is annotated `#[allow(dead_code)]`, but it is actively read in `From<Error> for Response`, `Debug`, and `Display`. The annotation is stale and misleading, suggesting the field is unused when it is not.","fix":"Before:\n```\n    #[allow(dead_code)]\n    kind: Kind,\n```\nAfter:\n```\n    kind: Kind,\n```","locations":[{"ref":"actix-http/src/error.rs:16-18","code":"   16 |     #[allow(dead_code)]\n   17 |     kind: Kind,\n   18 |     cause: Option<Box<dyn StdError>>,","lines":3,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-http/src/error.rs#L16-L18"}]},
{"id":"CMT_11","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"`Inner::register_io`'s doc comment is malformed: the first line uses a plain `//` comment (`// Register future feeding data to payload.`) while the following line is a `///` doc comment. The `///` line therefore doc-attaches while the intended summary line is a normal comment, and the wording duplicates `register`'s comment style inconsistently.","fix":"Make both lines `///` (or merge into one `///` doc comment) so the summary line is part of the doc comment.","locations":[{"ref":"actix-http/src/h1/payload.rs:199-200","code":"  199 |     // Register future feeding data to payload.\n  200 |     /// Waker would be used in `Inner::wake_io`","lines":2,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-http/src/h1/payload.rs#L199-L200"}]},

{"id":"CMT_13","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The doc comment on `static_match` claims it \"Returns true if `prefix` acts as a proper prefix (i.e., separated by a slash) in `path`\", but the function also performs exact matching for non-prefix resources (the `is_prefix == false` arm) and returns an `Option<usize>` length, not a bool. The comment describes only the prefix case and the wrong return type.","fix":"Reword to describe both cases, e.g. `/// Returns match length if \\`pattern\\` matches \\`path\\` exactly (non-prefix) or as a segment-aligned prefix (prefix).`","locations":[{"ref":"actix-router/src/resource.rs:831","code":"  831 |     /// Returns true if `prefix` acts as a proper prefix (i.e., separated by a slash) in `path`.","lines":1,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-router/src/resource.rs#L831"}]},

{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"easy","description":"`verify_handshake` looks up the `Sec-WebSocket-Version` header twice: first `req.headers().contains_key(SEC_WEBSOCKET_VERSION)` to emit `NoVersionHeader`, then `req.headers().get(SEC_WEBSOCKET_VERSION)` inside an `if let Some(..)` whose `else => false` branch is dead (the header is already known to exist). This is a redundant double lookup with an unreachable branch.","fix":"Do a single `get`: `match req.headers().get(SEC_WEBSOCKET_VERSION) { None => return Err(HandshakeError::NoVersionHeader), Some(hdr) if hdr == \"13\" || hdr == \"8\" || hdr == \"7\" => {}, Some(_) => return Err(HandshakeError::UnsupportedVersion) }`.","locations":[{"ref":"actix-http/src/ws/mod.rs:196-208","code":"  196 |     if !req.headers().contains_key(header::SEC_WEBSOCKET_VERSION) {\n  197 |         return Err(HandshakeError::NoVersionHeader);\n  198 |     }\n  199 |     let supported_ver = {\n  200 |         if let Some(hdr) = req.headers().get(header::SEC_WEBSOCKET_VERSION) {\n  201 |             hdr == \"13\" || hdr == \"8\" || hdr == \"7\"\n  202 |         } else {\n  203 |             false\n  204 |         }\n  205 |     };\n  206 |     if !supported_ver {\n  207 |         return Err(HandshakeError::UnsupportedVersion);\n  208 |     }","lines":13,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-http/src/ws/mod.rs#L196-L208"}]},
{"id":"DUP_2","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"`HttpRequest::cookies` and `HttpRequest::cookies_raw` are near-identical copies (same UTF-8 decode, same `split(';')`/`trim`/filter loop, same insert-into-extensions dance); they differ only in `Cookie::parse_encoded` vs `Cookie::parse` and the `Cookies` vs `RawCookies` wrapper type. This duplication invites divergent maintenance (a fix applied to one, such as the cookie-parsing bug, can be missed in the other).","fix":"Extract a private helper parameterized over the parse function and marker type, e.g. `fn load_cookies<F>(&self, parse: F) -> ...` returning the built `Vec<Cookie<'static>>`, and have both public methods delegate to it.","locations":[{"ref":"actix-web/src/request.rs:477-522","code":"  477 |     pub fn cookies(&self) -> Result<Ref<'_, Vec<Cookie<'static>>>, CookieParseError> {\n  478 |         use actix_http::header::COOKIE;\n  479 | \n  480 |         if self.extensions().get::<Cookies>().is_none() {\n  481 |             let mut cookies = Vec::new();\n  482 |             for hdr in self.headers().get_all(COOKIE) {\n  483 |                 let s = str::from_utf8(hdr.as_bytes()).map_err(CookieParseError::from)?;\n  484 |                 for cookie_str in s.split(';').map(|s| s.trim()).filter(|s| !s.is_empty()) {\n  485 |                     if let Ok(cookie) = Cookie::parse_encoded(cookie_str) {\n  486 |                         cookies.push(cookie.into_owned());\n  487 |                     }\n  488 |                 }\n  489 |             }\n  490 |             self.extensions_mut().insert(Cookies(cookies));\n  491 |         }\n  492 | \n  493 |         Ok(Ref::map(self.extensions(), |ext| {\n  494 |             &ext.get::<Cookies>().unwrap().0\n  495 |         }))\n  496 |     }\n  497 | \n  498 |     /// Load request cookies **without** percent-decoding their names and values.\n  499 |     ///\n  500 |     /// Any cookie that cannot be parsed is omitted from the result.\n  501 |     /// This includes cookies with an empty name (e.g. `document.cookie = \"=value\"`).\n  502 |     #[cfg(feature = \"cookies\")]\n  503 |     pub fn cookies_raw(&self) -> Result<Ref<'_, Vec<Cookie<'static>>>, CookieParseError> {\n  504 |         use actix_http::header::COOKIE;\n  505 | \n  506 |         if self.extensions().get::<RawCookies>().is_none() {\n  507 |             let mut cookies = Vec::new();\n  508 |             for hdr in self.headers().get_all(COOKIE) {\n  509 |                 let s = str::from_utf8(hdr.as_bytes()).map_err(CookieParseError::from)?;\n  510 |                 for cookie_str in s.split(';').map(|s| s.trim()).filter(|s| !s.is_empty()) {\n  511 |                     if let Ok(cookie) = Cookie::parse(cookie_str) {\n  512 |                         cookies.push(cookie.into_owned());\n  513 |                     }\n  514 |                 }\n  515 |             }\n  516 |             self.extensions_mut().insert(RawCookies(cookies));\n  517 |         }\n  518 | \n  519 |         Ok(Ref::map(self.extensions(), |ext| {\n  520 |             &ext.get::<RawCookies>().unwrap().0\n  521 |         }))\n  522 |     }","lines":46,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-web/src/request.rs#L477-L522"}]},
{"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"medium","difficulty":"hard","description":"`H2ConnectionInner::drop` attempts to wake the spawned connection task by calling `self.sender.send_request(http::Request::new(()), true)` and only aborts the task if that call errors. When the connection is still healthy the `send_request` succeeds, meaning a spurious empty HTTP/2 request is actually dispatched to the remote server purely as a side effect of dropping the connection wrapper. The in-code TODO acknowledges this can emit extraneous requests, which is a real protocol-correctness problem (unexpected requests hitting the server).","fix":"Signal task shutdown without emitting a real request, e.g. always `self.handle.abort()` on drop (dropping the `SendRequest` already lets the `h2` connection close gracefully), or hold an explicit shutdown channel/`gracefully close` handle instead of sending a dummy request.","locations":[{"ref":"awc/src/client/connection.rs:167-178","code":"  167 | impl Drop for H2ConnectionInner {\n  168 |     fn drop(&mut self) {\n  169 |         // TODO: this can end up sending extraneous requests; see if there is a better way to handle\n  170 |         if self\n  171 |             .sender\n  172 |             .send_request(http::Request::new(()), true)\n  173 |             .is_err()\n  174 |         {\n  175 |             self.handle.abort();\n  176 |         }\n  177 |     }\n  178 | }","lines":12,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/awc/src/client/connection.rs#L167-L178"}]},
{"id":"OTHER_1","type":"other","type_label":"Other","severity":"high","difficulty":"medium","description":"The content-encoding `Decoder` applies no limit on decompressed output size, making it vulnerable to a decompression bomb (DoS). In `poll_next`, chunks smaller than `MAX_CHUNK_SIZE_DECODE_IN_PLACE` (2049 bytes) are fed to `decoder.feed_data(chunk)` synchronously on the async task; `feed_data` calls `write_all` into the decompressor whose output accumulates in `Writer.buf` (an unbounded `BytesMut`). A tiny, highly-compressible `gzip`/`deflate`/`brotli`/`zstd` payload can expand to gigabytes in a single call, causing a large synchronous allocation that both exhausts memory and blocks the runtime reactor. Larger chunks use `spawn_blocking` but are still unbounded. The downstream payload byte-limit only sees data after it has already been fully decompressed into memory.","fix":"Track cumulative decompressed bytes per stream and abort with `PayloadError::Overflow` once a configurable ratio/absolute cap is exceeded. Enforce the cap inside `feed_data` around each `write_all`/`flush`/`take` so a single input chunk cannot expand without bound before the check fires.","locations":[{"ref":"actix-http/src/encoding/decoder.rs:122-135","code":"  122 |                     if let Some(mut decoder) = this.decoder.take() {\n  123 |                         if chunk.len() < MAX_CHUNK_SIZE_DECODE_IN_PLACE {\n  124 |                             let chunk = decoder.feed_data(chunk)?;\n  125 |                             *this.decoder = Some(decoder);\n  126 | \n  127 |                             if let Some(chunk) = chunk {\n  128 |                                 return Poll::Ready(Some(Ok(chunk)));\n  129 |                             }\n  130 |                         } else {\n  131 |                             *this.fut = Some(spawn_blocking(move || {\n  132 |                                 let chunk = decoder.feed_data(chunk)?;\n  133 |                                 Ok((chunk, decoder))\n  134 |                             }));\n  135 |                         }","lines":14,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-http/src/encoding/decoder.rs#L122-L135"},{"ref":"actix-http/src/encoding/decoder.rs:236-298","code":"  236 |     fn feed_data(&mut self, data: Bytes) -> io::Result<Option<Bytes>> {\n  237 |         match self {\n  238 |             #[cfg(feature = \"compress-brotli\")]\n  239 |             ContentDecoder::Brotli(ref mut decoder) => match decoder.write_all(&data) {\n  240 |                 Ok(_) => {\n  241 |                     decoder.flush()?;\n  242 |                     let b = decoder.get_mut().take();\n  243 | \n  244 |                     if !b.is_empty() {\n  245 |                         Ok(Some(b))\n  246 |                     } else {\n  247 |                         Ok(None)\n  248 |                     }\n  249 |                 }\n  250 |                 Err(err) => Err(err),\n  251 |             },\n  252 | \n  253 |             #[cfg(feature = \"compress-gzip\")]\n  254 |             ContentDecoder::Gzip(ref mut decoder) => match decoder.write_all(&data) {\n  255 |                 Ok(_) => {\n  256 |                     decoder.flush()?;\n  257 |                     let b = decoder.get_mut().take();\n  258 | \n  259 |                     if !b.is_empty() {\n  260 |                         Ok(Some(b))\n  261 |                     } else {\n  262 |                         Ok(None)\n  263 |                     }\n  264 |                 }\n  265 |                 Err(err) => Err(err),\n  266 |             },\n  267 | \n  268 |             #[cfg(feature = \"compress-gzip\")]\n  269 |             ContentDecoder::Deflate(ref mut decoder) => match decoder.write_all(&data) {\n  270 |                 Ok(_) => {\n  271 |                     decoder.flush()?;\n  272 | \n  273 |                     let b = decoder.get_mut().take();\n  274 |                     if !b.is_empty() {\n  275 |                         Ok(Some(b))\n  276 |                     } else {\n  277 |                         Ok(None)\n  278 |                     }\n  279 |                 }\n  280 |                 Err(err) => Err(err),\n  281 |             },\n  282 | \n  283 |             #[cfg(feature = \"compress-zstd\")]\n  284 |             ContentDecoder::Zstd(ref mut decoder) => match decoder.write_all(&data) {\n  285 |                 Ok(_) => {\n  286 |                     decoder.flush()?;\n  287 | \n  288 |                     let b = decoder.get_mut().take();\n  289 |                     if !b.is_empty() {\n  290 |                         Ok(Some(b))\n  291 |                     } else {\n  292 |                         Ok(None)\n  293 |                     }\n  294 |                 }\n  295 |                 Err(err) => Err(err),\n  296 |             },\n  297 |         }\n  298 |     }","lines":63,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-http/src/encoding/decoder.rs#L236-L298"},{"ref":"actix-http/src/encoding/mod.rs:19-40","code":"   19 | impl Writer {\n   20 |     fn new() -> Writer {\n   21 |         Writer {\n   22 |             buf: BytesMut::with_capacity(8192),\n   23 |         }\n   24 |     }\n   25 | \n   26 |     fn take(&mut self) -> Bytes {\n   27 |         self.buf.split().freeze()\n   28 |     }\n   29 | }\n   30 | \n   31 | impl io::Write for Writer {\n   32 |     fn write(&mut self, buf: &[u8]) -> io::Result<usize> {\n   33 |         self.buf.extend_from_slice(buf);\n   34 |         Ok(buf.len())\n   35 |     }\n   36 | \n   37 |     fn flush(&mut self) -> io::Result<()> {\n   38 |         Ok(())\n   39 |     }\n   40 | }","lines":22,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-http/src/encoding/mod.rs#L19-L40"}]},
{"id":"OTHER_2","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"Method guards are collected into a `HashSet<MethodTypeExt>` and later iterated (`methods.iter()`, taking `first` then the rest) to emit the guard chain. `std::collections::HashSet` has non-deterministic iteration order (randomly seeded `RandomState`), so the generated guard token stream ordering varies between compilations. This does not affect routing correctness (methods are OR-combined) but makes proc-macro output non-reproducible and can confuse expansion diffing/snapshot tests.","fix":"Use an order-preserving collection (e.g. an insertion-ordered `Vec` with a dedup check, or `indexmap::IndexSet`) for `methods` so guard emission order is deterministic.","locations":[{"ref":"actix-web-codegen/src/route.rs:231","code":"  231 |     methods: HashSet<MethodTypeExt>,","lines":1,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-web-codegen/src/route.rs#L231"},{"ref":"actix-web-codegen/src/route.rs:439-454","code":"  439 |                 let method_guards = {\n  440 |                     debug_assert!(!methods.is_empty(), \"Args::methods should not be empty\");\n  441 | \n  442 |                     let mut others = methods.iter();\n  443 |                     let first = others.next().unwrap();\n  444 | \n  445 |                     if methods.len() > 1 {\n  446 |                         let other_method_guards = others\n  447 |                             .map(|method_ext| method_ext.to_tokens_multi_guard_or_chain())\n  448 |                             .collect();\n  449 | \n  450 |                         first.to_tokens_multi_guard(other_method_guards)\n  451 |                     } else {\n  452 |                         first.to_tokens_single_guard()\n  453 |                     }\n  454 |                 };","lines":16,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-web-codegen/src/route.rs#L439-L454"}]},
