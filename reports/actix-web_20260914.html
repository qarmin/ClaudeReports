<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"The `rustls-*` (and `openssl`) TLS finalizers unconditionally advertise HTTP/2 via ALPN (`let mut protos = vec![b\"h2\".to_vec(), b\"http/1.1\".to_vec()];`) and set `proto = Protocol::Http2` whenever the peer negotiates `h2`, but none of this is gated on the `http2` cargo feature. The features are independent (`default = []`, `rustls-0_23 = [\"__tls\", ...]` does not pull in `http2`). When `actix-http` is built with a rustls/openssl feature but without `http2`, the `call()` handler hits `#[cfg(not(feature = \"http2\"))] Protocol::Http2 => panic!(\"HTTP/2 support is disabled ...\")`. A remote client that selects `h2` in the TLS handshake therefore crashes the worker: a remote-triggerable panic / DoS on a buildable feature combination.","fix":"Only advertise `h2` in ALPN and only classify a connection as `Protocol::Http2` when the `http2` feature is enabled. Gate the `vec![b\"h2\".to_vec(), ...]` push and the `alpn_protocol()` -> `Protocol::Http2` branch behind `#[cfg(feature = \"http2\")]`, so a server without HTTP/2 support never negotiates `h2` and the `panic!` branch becomes unreachable.","locations":[{"ref":"actix-http/src/service.rs:966-969","code":"  966 |             #[cfg(not(feature = \"http2\"))]\n  967 |             Protocol::Http2 => {\n  968 |                 panic!(\"HTTP/2 support is disabled (enable with the `http2` feature flag)\")\n  969 |             }","lines":4,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-http/src/service.rs#L966-L969"},{"ref":"actix-http/src/service.rs:747-749","code":"  747 |             let mut protos = vec![b\"h2\".to_vec(), b\"http/1.1\".to_vec()];\n  748 |             protos.extend_from_slice(&config.alpn_protocols);\n  749 |             config.alpn_protocols = protos;","lines":3,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-http/src/service.rs#L747-L749"},{"ref":"actix-http/src/service.rs:763-771","code":"  763 |                     let proto = if let Some(protos) = io.get_ref().1.alpn_protocol() {\n  764 |                         if protos.windows(2).any(|window| window == b\"h2\") {\n  765 |                             Protocol::Http2\n  766 |                         } else {\n  767 |                             Protocol::Http1\n  768 |                         }\n  769 |                     } else {\n  770 |                         Protocol::Http1\n  771 |                     };","lines":9,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-http/src/service.rs#L763-L771"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`Format::new` panics via `unreachable!(\"regex and code mismatch\")` for any format string of the shape `%{KEY}a` where `KEY` is not exactly `r`. The regex `%(\\{([A-Za-z0-9\\-_]+)\\}([aioe]|x[io])|[%atPrUsbTD]?)` accepts *any* `[A-Za-z0-9\\-_]+` key followed by `a`, but the match arm for group `\"a\"` only accepts `key == \"r\"` (the `%{r}a` real-IP directive) and hits `unreachable!()` otherwise. So `Logger::new(\"%{x}a\")` or even `Logger::new(\"%{R}a\")` (wrong case) panics at construction time. The `unreachable!` comment is therefore also wrong: the regex and code genuinely disagree.","fix":"Either tighten the regex so only `r` is accepted before `a` (e.g. split the alternation so `a` requires key `r`), or replace the `unreachable!` with graceful handling: treat an unrecognized `%{KEY}a` as a literal `FormatText::Str` (or return the raw match text) instead of panicking. For example, change the `else` branch from `unreachable!(\"regex and code mismatch\")` to `FormatText::Str(m.as_str().to_owned())`.","locations":[{"ref":"actix-web/src/middleware/logger.rs:515-522","code":"  515 |                 results.push(match cap.get(3).unwrap().as_str() {\n  516 |                     \"a\" => {\n  517 |                         if key.as_str() == \"r\" {\n  518 |                             FormatText::RealIpRemoteAddr\n  519 |                         } else {\n  520 |                             unreachable!(\"regex and code mismatch\")\n  521 |                         }\n  522 |                     }","lines":8,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-web/src/middleware/logger.rs#L515-L522"},{"ref":"actix-web/src/middleware/logger.rs:502","code":"  502 |         let fmt = Regex::new(r\"%(\\{([A-Za-z0-9\\-_]+)\\}([aioe]|x[io])|[%atPrUsbTD]?)\").unwrap();","lines":1,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-web/src/middleware/logger.rs#L502"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`HeaderName::from_bytes(&slice[idx.name.0..idx.name.1]).unwrap()` unwraps on parsed header-name bytes. It relies on the assumption that every token `httparse` accepts as a header name is also accepted by `http::HeaderName::from_bytes`. If the two crates' token tables ever diverge (they have differed historically at edges), this becomes a reachable panic driven directly by untrusted request bytes. Unlike the `HeaderValue` construction just below, there is no `SAFETY`/rationale comment justifying the unwrap.","fix":"Map the error to `ParseError::Header` instead of unwrapping: `let name = HeaderName::from_bytes(...).map_err(|_| ParseError::Header)?;`.","locations":[{"ref":"actix-http/src/h1/decoder.rs:91-92","code":"   91 |             for idx in raw_headers.iter() {\n   92 |                 let name = HeaderName::from_bytes(&slice[idx.name.0..idx.name.1]).unwrap();","lines":2,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-http/src/h1/decoder.rs#L91-L92"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`handshake_response` calls `req.headers().get(header::SEC_WEBSOCKET_KEY).unwrap()`. This is only safe when preceded by `verify_handshake` (as in `handshake()`), but `handshake_response` is a public function and can be called directly on a request without the key header, causing a panic. The `.unwrap()` relies on an unenforced precondition.","fix":"Have `handshake_response` return a `Result` (or take the already-validated key as a parameter), or document the precondition and make the function private if it must only be reached via `handshake`.","locations":[{"ref":"actix-http/src/ws/mod.rs:220-224","code":"  220 | pub fn handshake_response(req: &RequestHead) -> ResponseBuilder {\n  221 |     let key = {\n  222 |         let key = req.headers().get(header::SEC_WEBSOCKET_KEY).unwrap();\n  223 |         proto::hash_key(key.as_ref())\n  224 |     };","lines":5,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-http/src/ws/mod.rs#L220-L224"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`Field`'s `Stream::poll_next` calls `inner.payload.as_ref().expect(\"Field should not be polled after completion\")` with no guard. `InnerField::payload` is set to `None` (`self.payload.take()`) once the field stream finishes, so polling the `Field` stream again after it has yielded `None` panics instead of returning `Poll::Ready(None)`. Polling a completed stream is a documented no-panic expectation for many combinators; `InnerField::poll` itself guards this with an `if self.payload.is_none()` check, but the outer `Field::poll_next` does not.","fix":"In `Field::poll_next`, return `Poll::Ready(None)` when `inner.payload.is_none()` (mirroring the guard at the top of `InnerField::poll`) instead of `expect`-ing on the taken payload.","locations":[{"ref":"actix-multipart/src/field.rs:174-178","code":"  174 |         if let Some(mut buffer) = inner\n  175 |             .payload\n  176 |             .as_ref()\n  177 |             .expect(\"Field should not be polled after completion\")\n  178 |             .get_mut(&this.safety)","lines":5,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-multipart/src/field.rs#L174-L178"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`Connector::limit(0)` sets `config.limit = u32::MAX as usize` to mean unlimited. This value is later passed to `Semaphore::new(config.limit)` in `ConnectionPoolInner::new`. On 32-bit targets `u32::MAX` (4294967295) exceeds tokio's `Semaphore::MAX_PERMITS` (`usize::MAX >> 3`, ~536M on 32-bit), so `Semaphore::new` panics. Thus `Connector::new().limit(0).finish()` panics at build time on 32-bit platforms.","fix":"Cap the unlimited sentinel to a value valid on all targets, e.g. use `Semaphore::MAX_PERMITS` (or a large but safe constant) instead of `u32::MAX as usize`.","locations":[{"ref":"awc/src/client/connector.rs:371-378","code":"  371 |     pub fn limit(mut self, limit: usize) -> Self {\n  372 |         if limit == 0 {\n  373 |             self.config.limit = u32::MAX as usize;\n  374 |         } else {\n  375 |             self.config.limit = limit;\n  376 |         }\n  377 | \n  378 |         self","lines":8,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/awc/src/client/connector.rs#L371-L378"},{"ref":"awc/src/client/pool.rs:64-65","code":"   64 |     fn new(config: ConnectorConfig) -> Self {\n   65 |         let permits = Arc::new(Semaphore::new(config.limit));","lines":2,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/awc/src/client/pool.rs#L64-L65"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`build_next_uri` calls `prev_uri.scheme().cloned().unwrap()`, `prev_uri.authority().cloned().unwrap()`, and `prev_uri.scheme_str().unwrap()` when the `Location` value is relative or scheme-relative. These `unwrap`s panic if `prev_uri` lacks a scheme or authority. While the initial request URI is validated, a redirect chain feeds each `next_uri` back as the next `prev_uri`, and a malformed `Location` parsed via `Uri::try_from(...).unwrap_or_else(|_| Uri::default())` can yield a URI without these components, making a panic reachable from server-controlled input.","fix":"Replace the `unwrap`s with error propagation, e.g. map missing scheme/authority to `SendRequestError::Url(InvalidUrl::MissingScheme)` / `InvalidUrl::MissingHost` instead of panicking.","locations":[{"ref":"awc/src/middleware/redirect.rs:256-261","code":"  256 |             .scheme(prev_uri.scheme().cloned().unwrap())\n  257 |             .authority(prev_uri.authority().cloned().unwrap());\n  258 | \n  259 |         // scheme-relative address\n  260 |         if location.as_bytes().starts_with(b\"//\") {\n  261 |             let scheme = prev_uri.scheme_str().unwrap();","lines":6,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/awc/src/middleware/redirect.rs#L256-L261"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"Both `Future::poll` impls for `SendClientRequest` panic with `\"Attempting to call completed future\"` when the `Err` variant is polled after it already yielded its error (the `Option` is `None`). While polling a fused-completed future is generally a caller error, this converts a benign double-poll (e.g. by a combinator that is not aware the future completed) into a hard panic instead of `Poll::Pending` or a clearer contract.","fix":"Either document `SendClientRequest` as not fused and keep the panic intentionally, or return `Poll::Pending` / integrate with `FusedFuture` so a post-completion poll does not abort the process.","locations":[{"ref":"awc/src/sender.rs:125-128","code":"  125 |             SendClientRequest::Err(ref mut err) => match err.take() {\n  126 |                 Some(err) => Poll::Ready(Err(err)),\n  127 |                 None => panic!(\"Attempting to call completed future\"),\n  128 |             },","lines":4,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/awc/src/sender.rs#L125-L128"},{"ref":"awc/src/sender.rs:150-153","code":"  150 |             SendClientRequest::Err(ref mut err) => match err.take() {\n  151 |                 Some(err) => Poll::Ready(Err(err)),\n  152 |                 None => panic!(\"Attempting to call completed future\"),\n  153 |             },","lines":4,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/awc/src/sender.rs#L150-L153"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"During `connect`, several `HeaderValue` conversions derived from user-controlled input are unwrapped and will panic instead of returning a `WsClientError`. `HeaderValue::try_from(protocols.as_str()).unwrap()` panics if a protocol string contains bytes illegal in a header value, and `HeaderValue::from_str(&Host{..}.to_string()).unwrap()` / `HeaderValue::from_str(&cookie).unwrap()` can panic on an unusual host or cookie. A malformed protocol/host thus aborts the task rather than yielding an error.","fix":"Convert the `unwrap()` calls into fallible handling that stores the conversion error into `self.err` (or returns a `WsClientError`/`HttpError`) instead of panicking, mirroring how `origin` and `header` already record errors.","locations":[{"ref":"awc/src/ws.rs:293","code":"  293 |                 HeaderValue::from_str(&Host { hostname, port }.to_string()).unwrap(),","lines":1,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/awc/src/ws.rs#L293"},{"ref":"awc/src/ws.rs:331-335","code":"  331 |         if let Some(protocols) = self.protocols.take() {\n  332 |             self.head.headers.insert(\n  333 |                 header::SEC_WEBSOCKET_PROTOCOL,\n  334 |                 HeaderValue::try_from(protocols.as_str()).unwrap(),\n  335 |             );","lines":5,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/awc/src/ws.rs#L331-L335"},{"ref":"awc/src/ws.rs:310","code":"  310 |                     .insert(header::COOKIE, HeaderValue::from_str(&cookie).unwrap());","lines":1,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/awc/src/ws.rs#L310"}]},
{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"The connection pool's `available` map is keyed by `Authority` and entries are inserted via `entry(key).or_insert_with(VecDeque::new)` in `Acquired::release`, but empty `VecDeque`s are never removed. In `ConnectionPool::call`, when the last idle connection for a key is popped/evicted the now-empty `VecDeque` is left in the map. A client contacting many distinct authorities (e.g. a crawler) accumulates one permanent empty-`VecDeque` entry per unique authority for the lifetime of the pool, an unbounded `HashMap` growth.","fix":"After draining connections in `call`, remove the map entry when its `VecDeque` becomes empty (e.g. `if conns.is_empty() { map.remove(&key); }`), or use the entry API to prune empty deques on release.","locations":[{"ref":"awc/src/client/pool.rs:193-227","code":"  193 |                 if let Some(conns) = map.get_mut(&key) {\n  194 |                     let now = Instant::now();\n  195 | \n  196 |                     while let Some(mut c) = conns.pop_front() {\n  197 |                         let config = &inner.config;\n  198 |                         let idle_dur = now - c.used;\n  199 |                         let age = now - c.created;\n  200 |                         let conn_ineligible =\n  201 |                             idle_dur > config.conn_keep_alive || age > config.conn_lifetime;\n  202 | \n  203 |                         if conn_ineligible {\n  204 |                             // drop connections that are too old\n  205 |                             inner.close(c.conn);\n  206 |                         } else {\n  207 |                             // check if the connection is still usable\n  208 |                             if let ConnectionInnerType::H1(ref mut io) = c.conn {\n  209 |                                 let check = ConnectionCheckFuture { io };\n  210 |                                 match check.now_or_never().expect(\n  211 |                                     \"ConnectionCheckFuture must never yield with Poll::Pending.\",\n  212 |                                 ) {\n  213 |                                     ConnectionState::Tainted => {\n  214 |                                         inner.close(c.conn);\n  215 |                                         continue;\n  216 |                                     }\n  217 |                                     ConnectionState::Skip => continue,\n  218 |                                     ConnectionState::Live => conn = Some(c),\n  219 |                                 }\n  220 |                             } else {\n  221 |                                 conn = Some(c);\n  222 |                             }\n  223 | \n  224 |                             break;\n  225 |                         }\n  226 |                     }\n  227 |                 };","lines":35,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/awc/src/client/pool.rs#L193-L227"},{"ref":"awc/src/client/pool.rs:364-373","code":"  364 |         inner\n  365 |             .available\n  366 |             .borrow_mut()\n  367 |             .entry(key.clone())\n  368 |             .or_insert_with(VecDeque::new)\n  369 |             .push_back(PooledConnection {\n  370 |                 conn,\n  371 |                 created,\n  372 |                 used: Instant::now(),\n  373 |             });","lines":10,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/awc/src/client/pool.rs#L364-L373"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"Dynamic path segment offsets are stored as `u16` (`PathItem::Segment(u16, u16)`) and the processing cursor `skip` is a `u16`. `Path::skip` does `self.skip += n` and `Path::add` computes `self.skip + begin` / `self.skip + end` with unchecked `u16` arithmetic. For a request path longer than 65535 bytes these additions overflow: in debug builds they panic (DoS), and in release builds they silently wrap, producing bogus start/end indices. The corrupted indices are later used for slicing in `Path::get`, `Path::index`, and `PathIter::next` via `&self.path.path()[(start as usize)..(end as usize)]`, which can panic with an out-of-bounds range or a non-char-boundary slice on attacker-controlled input. `actix-router` imposes no path-length limit of its own.","fix":"Store segment offsets and `skip` as `usize` (or `u32`) so realistic path lengths cannot overflow, or explicitly reject/clamp paths longer than the `u16` range before parsing. At minimum, use `checked_add`/`saturating_add` in `skip` and `add` and guard the slicing sites so malformed indices cannot panic.","locations":[{"ref":"actix-router/src/path.rs:13","code":"   13 |     Segment(u16, u16),","lines":1,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-router/src/path.rs#L13"},{"ref":"actix-router/src/path.rs:145","code":"  145 |         self.skip += n;","lines":1,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-router/src/path.rs#L145"},{"ref":"actix-router/src/path.rs:153","code":"  153 |                 PathItem::Segment(self.skip + begin, self.skip + end),","lines":1,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-router/src/path.rs#L153"},{"ref":"actix-router/src/path.rs:187","code":"  187 |                         Some(&self.path.path()[(*start as usize)..(*end as usize)])","lines":1,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-router/src/path.rs#L187"},{"ref":"actix-router/src/path.rs:247","code":"  247 |                     &self.params.path.path()[(start as usize)..(end as usize)]","lines":1,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-router/src/path.rs#L247"},{"ref":"actix-router/src/path.rs:272","code":"  272 |             PathItem::Segment(start, end) => &self.path.path()[(start as usize)..(end as usize)],","lines":1,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-router/src/path.rs#L272"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"In `parse_metadata`, the 64-bit extended length (`len == 127`) is truncated with `len as usize`. On 32-bit targets a declared length between 2^32 and 2^64 is silently truncated (e.g. 2^32 becomes 0, 2^32+4 becomes 4). The subsequent `idx.checked_add(length)` overflow guard operates on the already-truncated value, so it does not catch this; the parser then consumes the 8 length bytes but reads a wrong (small) payload size, desynchronising the frame stream. 64-bit targets are unaffected.","fix":"Reject lengths that do not fit in `usize` before casting, e.g. `let len = usize::try_from(u64::from_be_bytes(...)).map_err(|_| ProtocolError::Overflow)?;` (also consider enforcing that the top bit is zero and that the value is minimally encoded per RFC 6455).","locations":[{"ref":"actix-http/src/ws/frame.rs:66-72","code":"   66 |         } else if len == 127 {\n   67 |             if chunk_len < 10 {\n   68 |                 return Ok(None);\n   69 |             }\n   70 |             let len = u64::from_be_bytes(TryFrom::try_from(&src[idx..idx + 8]).unwrap());\n   71 |             idx += 8;\n   72 |             len as usize","lines":7,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-http/src/ws/frame.rs#L66-L72"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"In `capture_match_info_fn`, regex match offsets and the matched length are cast from `usize` to `u16` (`m.start() as u16`, `m.end() as u16`, `matched_len as u16`). For request paths longer than 65535 bytes these casts silently truncate (wrap), producing wrong segment boundaries and a wrong `skip` length, which corrupts extracted path parameters and downstream matching. `PathItem` and `Path::skip` are `u16`-based, so nothing rejects such paths at this layer.","fix":"Reject (or saturate and bail out returning `false`) when any offset or `matched_len` exceeds `u16::MAX` before casting, e.g. `if m.end() > u16::MAX as usize { return false; }`, or widen `PathItem`/`skip` to `u32`.","locations":[{"ref":"actix-router/src/resource.rs:700","code":"  700 |                         segments[no] = PathItem::Segment(m.start() as u16, m.end() as u16);","lines":1,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-router/src/resource.rs#L700"},{"ref":"actix-router/src/resource.rs:724","code":"  724 |                         segments[no] = PathItem::Segment(m.start() as u16, m.end() as u16);","lines":1,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-router/src/resource.rs#L724"},{"ref":"actix-router/src/resource.rs:748","code":"  748 |         path.skip(matched_len as u16);","lines":1,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-router/src/resource.rs#L748"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"The directory listing generates the `href` attribute by percent-encoding the file URL with only the `CONTROLS` ASCII set (`utf8_percent_encode(&$path, CONTROLS)` in the `encode_file_url!` macro). `CONTROLS` covers only C0 control characters and `DEL`; it does NOT encode `\"`, `<`, `>` or backtick. The encoded value is then written directly inside a double-quoted attribute: `<li><a href=\"{}\">...`. A filesystem entry whose name contains a `\"` (legal on Linux, and attacker-controllable where uploads or user-named files exist) terminates the attribute and injects arbitrary HTML/attributes, i.e. stored XSS in the generated listing. Note the visible link text is correctly escaped via `escape_fmt` (`encode_file_name!`), so only the `href` is vulnerable. Reachable when `Files::show_files_listing()` is enabled.","fix":"Percent-encode the URL path with a set that also escapes HTML/attribute-significant characters. Extend the set used by `encode_file_url!`, e.g. `const HREF_ENCODE_SET: &AsciiSet = &CONTROLS.add(b'\"').add(b'\\'').add(b'<').add(b'>').add(b'`').add(b' ');` (or a stricter path-segment set), and use it in the macro instead of bare `CONTROLS`.","locations":[{"ref":"actix-files/src/directory.rs:49-53","code":"   49 | macro_rules! encode_file_url {\n   50 |     ($path:ident) => {\n   51 |         utf8_percent_encode(&$path, CONTROLS)\n   52 |     };\n   53 | }","lines":5,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-files/src/directory.rs#L49-L53"},{"ref":"actix-files/src/directory.rs:91-104","code":"   91 |                     let _ = write!(\n   92 |                         body,\n   93 |                         \"<li><a href=\\\"{}\\\">{}/<\/a><\/li>\",\n   94 |                         encode_file_url!(p),\n   95 |                         encode_file_name!(entry),\n   96 |                     );\n   97 |                 } else {\n   98 |                     let _ = write!(\n   99 |                         body,\n  100 |                         \"<li><a href=\\\"{}\\\">{}<\/a><\/li>\",\n  101 |                         encode_file_url!(p),\n  102 |                         encode_file_name!(entry),\n  103 |                     );\n  104 |                 }","lines":14,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-files/src/directory.rs#L91-L104"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In `Readlines::poll_next`, when a payload chunk contains no newline the code appends it to `this.buf` and returns `Poll::Pending` after the inner stream returned `Poll::Ready(Some(..))`. Consuming a `Ready` item from the inner stream and then returning `Pending` without a registered waker violates the `Future`/`Stream` contract: the inner `Payload` did not store a waker (it returned data), so nothing guarantees the task is polled again. Any logical line that spans more than one payload chunk (large lines, slow/streamed network payloads) can hang the `Readlines` stream indefinitely. The unit test only passes because it manually re-polls.","fix":"Wrap the stream-polling section in a `loop` so that after `this.buf.extend_from_slice(&bytes)` with no newline found, control loops back to `ready!(Pin::new(&mut this.stream).poll_next(cx))` instead of returning `Poll::Pending`. Only return `Pending` when the inner stream itself returns `Pending` (which `ready!` already does).","locations":[{"ref":"actix-web/src/types/readlines.rs:147-148","code":"  147 |                 this.buf.extend_from_slice(&bytes);\n  148 |                 Poll::Pending","lines":2,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-web/src/types/readlines.rs#L147-L148"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"hard","description":"The chunked decoder does not support trailer fields. After the last chunk `0`, `read_size_lf` transitions directly to `EndCr`, which requires the next bytes to be exactly `\\r\\n`. A valid chunked request that includes trailers (e.g. `0\\r\\nFoo: bar\\r\\n\\r\\n`) hits `read_end_cr`, sees `F` instead of `\\r`, and fails with `\"Invalid chunk end CR\"`, rejecting a spec-conformant message. RFC 7230 permits a trailer section after the last chunk.","fix":"Add trailer-parsing states between the last-chunk `\\r\\n` and end-of-stream that consume (and optionally expose or discard) trailer header lines until the terminating empty line, instead of requiring `\\r\\n` immediately after `0`.","locations":[{"ref":"actix-http/src/h1/chunked.rs:112-121","code":"  112 |     fn read_size_lf(rdr: &mut BytesMut, size: u64) -> Poll<Result<ChunkedState, io::Error>> {\n  113 |         match byte!(rdr) {\n  114 |             b'\\n' if size > 0 => Poll::Ready(Ok(ChunkedState::Body)),\n  115 |             b'\\n' if size == 0 => Poll::Ready(Ok(ChunkedState::EndCr)),\n  116 |             _ => Poll::Ready(Err(io::Error::new(\n  117 |                 io::ErrorKind::InvalidInput,\n  118 |                 \"Invalid chunk size LF\",\n  119 |             ))),\n  120 |         }\n  121 |     }","lines":10,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-http/src/h1/chunked.rs#L112-L121"},{"ref":"actix-http/src/h1/chunked.rs:169-186","code":"  169 |     fn read_end_cr(rdr: &mut BytesMut) -> Poll<Result<ChunkedState, io::Error>> {\n  170 |         match byte!(rdr) {\n  171 |             b'\\r' => Poll::Ready(Ok(ChunkedState::EndLf)),\n  172 |             _ => Poll::Ready(Err(io::Error::new(\n  173 |                 io::ErrorKind::InvalidInput,\n  174 |                 \"Invalid chunk end CR\",\n  175 |             ))),\n  176 |         }\n  177 |     }\n  178 |     fn read_end_lf(rdr: &mut BytesMut) -> Poll<Result<ChunkedState, io::Error>> {\n  179 |         match byte!(rdr) {\n  180 |             b'\\n' => Poll::Ready(Ok(ChunkedState::End)),\n  181 |             _ => Poll::Ready(Err(io::Error::new(\n  182 |                 io::ErrorKind::InvalidInput,\n  183 |                 \"Invalid chunk end LF\",\n  184 |             ))),\n  185 |         }\n  186 |     }","lines":18,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-http/src/h1/chunked.rs#L169-L186"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The `Connection` header parser matches the whole trimmed header value against the exact tokens `keep-alive`/`close`/`upgrade`, instead of splitting the value into comma-separated tokens. A conformant request such as `Connection: upgrade, http2-settings` therefore does not set `ConnectionType::Upgrade` (it falls through to `None`), so the connection is treated as keep-alive rather than upgrade. This limitation is even acknowledged by the `test_http_request_upgrade_h2c` test in the same crate.","fix":"Split the header value on `,` and `eq_ignore_ascii_case`-compare each trimmed token, treating the connection as upgrade/close/keep-alive if any matching token is present (close taking precedence).","locations":[{"ref":"actix-http/src/h1/decoder.rs:153-167","code":"  153 |                     header::CONNECTION => {\n  154 |                         ka = if let Ok(conn) = value.to_str().map(str::trim) {\n  155 |                             if conn.eq_ignore_ascii_case(\"keep-alive\") {\n  156 |                                 Some(ConnectionType::KeepAlive)\n  157 |                             } else if conn.eq_ignore_ascii_case(\"close\") {\n  158 |                                 Some(ConnectionType::Close)\n  159 |                             } else if conn.eq_ignore_ascii_case(\"upgrade\") {\n  160 |                                 Some(ConnectionType::Upgrade)\n  161 |                             } else {\n  162 |                                 None\n  163 |                             }\n  164 |                         } else {\n  165 |                             None\n  166 |                         };\n  167 |                     }","lines":15,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-http/src/h1/decoder.rs#L153-L167"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`TestServer::request()` passes the raw `path` straight to `self.client.request(method, path.as_ref())`, unlike every sibling helper (`get`, `post`, `head`, `put`, `patch`, `delete`, `options`) which first calls `self.url(path.as_ref())` to build a fully-qualified URL (scheme + `self.addr` + path). As a result, calling `srv.request(Method::GET, \"/foo\")` sends a request with a bare path and no host/port, so it never reaches the test server (awc will fail or misroute it). This breaks the documented contract \"Connect request with given method and path.\"","fix":"Build the full URL like the other helpers: `self.client.request(method, self.url(path.as_ref()).as_str())` instead of `self.client.request(method, path.as_ref())`.","locations":[{"ref":"actix-test/src/lib.rs:711-713","code":"  711 |     pub fn request(&self, method: Method, path: impl AsRef<str>) -> ClientRequest {\n  712 |         self.client.request(method, path.as_ref())\n  713 |     }","lines":3,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-test/src/lib.rs#L711-L713"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"The `quoted-string` escaping regex in `impl fmt::Display for DispositionParam` is `[\\x00-\\x08\\x10-\\x1F\\x7F\"\\\\]`, which skips the byte range `\\x09`-`\\x0F`. The adjacent comment explicitly states that all ASCII control characters (0-31 and DEL) should be escaped, yet `\\x0B` (VT), `\\x0C` (FF), `\\x0E` (SO), and `\\x0F` (SI) are never escaped when serializing a `Filename`/`Unknown` value. Because `HeaderValue::from_maybe_shared` rejects raw control bytes, a filename containing any of these characters will fail to serialize (`try_into_value` returns `Err`) instead of being safely escaped. The gap between `\\x08` and `\\x10` is almost certainly a hex typo (`\\x10` where `\\x0E` was likely intended). Note `test_display_space_tab` asserts tab `\\x09` stays unescaped, so only the non-LWS control chars need fixing.","fix":"Escape the currently missed control characters, keeping the intentional LWS exceptions. For example change the class to `[\\x00-\\x08\\x0B\\x0C\\x0E-\\x1F\\x7F\"\\\\]` (escapes VT/FF/SO/SI and 0x10-0x1F while still leaving tab `\\x09` unescaped as the existing test expects).","locations":[{"ref":"actix-web/src/http/header/content_disposition.rs:557-558","code":"  557 |         static RE: Lazy<Regex> =\n  558 |             Lazy::new(|| Regex::new(\"[\\x00-\\x08\\x10-\\x1F\\x7F\\\"\\\\\\\\]\").unwrap());","lines":2,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-web/src/http/header/content_disposition.rs#L557-L558"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`impl fmt::Display for DispositionParam` renders the `Name` variant as `write!(f, \"name={}\", value)` with no quoting or escaping, unlike `Filename` and `Unknown` which emit an escaped `quoted-string`. A form-data field name containing a space, `;`, `\"`, or a control character produces a malformed `Content-Disposition` value (and, for control characters, causes `try_into_value` to fail in `HeaderValue::from_maybe_shared`). This makes round-tripping such names impossible and can emit an invalid header.","fix":"Emit the name as a quoted-string with the same escaping used for `Filename`/`Unknown`, e.g. `write!(f, \"name=\\\"{}\\\"\", RE.replace_all(value, \"\\\\$0\").as_ref())`.","locations":[{"ref":"actix-web/src/http/header/content_disposition.rs:561","code":"  561 |             DispositionParam::Name(ref value) => write!(f, \"name={}\", value),","lines":1,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-web/src/http/header/content_disposition.rs#L561"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`CookieIter::next` uses `v.to_str().ok()?` which propagates `None` out of `next()`, permanently terminating the iterator, whenever a single `Set-Cookie` header value is not valid visible-ASCII (`to_str()` fails). A single un-stringable header value therefore silently drops all remaining cookies instead of skipping just the bad one. Note that `del_cookie` handles the same situation correctly with `if let Ok(s) = v.to_str()` and continues, so the behavior is inconsistent.","fix":"Skip the offending value instead of ending iteration. Change `if let Ok(c) = Cookie::parse_encoded(v.to_str().ok()?)` to first match `v.to_str()` and `continue` on `Err`, e.g.:\n```rust\nfor v in self.iter.by_ref() {\n    let Ok(s) = v.to_str() else { continue };\n    if let Ok(c) = Cookie::parse_encoded(s) {\n        return Some(c);\n    }\n}\nNone\n```","locations":[{"ref":"actix-web/src/response/response.rs:386-394","code":"  386 |     #[inline]\n  387 |     fn next(&mut self) -> Option<Cookie<'a>> {\n  388 |         for v in self.iter.by_ref() {\n  389 |             if let Ok(c) = Cookie::parse_encoded(v.to_str().ok()?) {\n  390 |                 return Some(c);\n  391 |             }\n  392 |         }\n  393 |         None\n  394 |     }","lines":9,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-web/src/response/response.rs#L386-L394"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`Query::from_request` only looks up the config via `req.app_data::<QueryConfig>()`; it does not fall back to `req.app_data::<Data<QueryConfig>>()`. Every other extractor config in this crate (`JsonConfig` at json.rs:272-276, `FormConfig` at form.rs:248-252, `PathConfig` at path.rs:96-99, `PayloadConfig` at payload.rs:323-327) checks both `T` and `Data<T>`. Consequently, a `QueryConfig` registered via `App::app_data(web::Data::new(QueryConfig...))` is silently ignored and the custom error handler never runs.","fix":"Mirror the other extractors: `req.app_data::<QueryConfig>().or_else(|| req.app_data::<web::Data<QueryConfig>>().map(|d| d.as_ref())).and_then(|c| c.err_handler.clone())`.","locations":[{"ref":"actix-web/src/types/query.rs:114-117","code":"  114 |     fn from_request(req: &HttpRequest, _: &mut Payload) -> Self::Future {\n  115 |         let error_handler = req\n  116 |             .app_data::<QueryConfig>()\n  117 |             .and_then(|c| c.err_handler.clone());","lines":4,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-web/src/types/query.rs#L114-L117"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"When following a redirect for a `RequestHeadType::Rc(head, extra_headers)` request, `RedirectService::call` extracts only `head.headers` and discards the `extra_headers` map (the `..` in the pattern). Extra per-request headers added via `FrozenSendBuilder::extra_headers`/`extra_header` are therefore silently dropped on every redirected request, even for same-origin redirects, so the redirect target receives a request missing those headers.","fix":"In the `RequestHeadType::Rc(ref head, ref extra_headers)` arm, merge `extra_headers` into the `headers` map that is carried forward for the redirect (e.g. clone `head.headers` then overlay any `extra_headers` entries), so redirected requests preserve the extra headers.","locations":[{"ref":"awc/src/middleware/redirect.rs:85-92","code":"   85 |                 let (uri, method, headers) = match head {\n   86 |                     RequestHeadType::Owned(ref head) => {\n   87 |                         (head.uri.clone(), head.method.clone(), head.headers.clone())\n   88 |                     }\n   89 |                     RequestHeadType::Rc(ref head, ..) => {\n   90 |                         (head.uri.clone(), head.method.clone(), head.headers.clone())\n   91 |                     }\n   92 |                 };","lines":8,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/awc/src/middleware/redirect.rs#L85-L92"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"For `307`/`308` redirects (`reuse_body == true`) the body is only reused when the original body was `AnyBody::Bytes` (captured into `body_opt`). If the original request used a streaming body (`send_stream`) or any non-`Bytes` body, `body_opt` is `None` and the redirect resends the request with `AnyBody::empty()` while keeping the original method (e.g. `POST`). This silently sends an empty body on a method/status that is supposed to preserve it, causing silent data loss rather than an error.","fix":"When a `307`/`308` redirect is required but the body cannot be reused, return an error (e.g. a `SendRequestError`) instead of silently substituting an empty body, or document/buffer the body so it can be replayed.","locations":[{"ref":"awc/src/middleware/redirect.rs:94-97","code":"   94 |                 let body_opt = match body {\n   95 |                     AnyBody::Bytes { ref body } => Some(body.clone()),\n   96 |                     _ => None,\n   97 |                 };","lines":4,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/awc/src/middleware/redirect.rs#L94-L97"},{"ref":"awc/src/middleware/redirect.rs:190-199","code":"  190 |                         let body_new = if reuse_body {\n  191 |                             // try to reuse saved body\n  192 |                             match body {\n  193 |                                 Some(ref bytes) => AnyBody::Bytes {\n  194 |                                     body: bytes.clone(),\n  195 |                                 },\n  196 | \n  197 |                                 // body was a non-reusable type so send an empty body instead\n  198 |                                 _ => AnyBody::empty(),\n  199 |                             }","lines":10,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/awc/src/middleware/redirect.rs#L190-L199"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"When a `301`/`302`/`303` redirect downgrades the method to `GET` and sets the body to `AnyBody::None`, the code carries the original request's `headers` forward unchanged via `head.headers = headers.clone()`. Entity headers describing the now-removed body (e.g. `Content-Type`, and an explicit `Content-Length` set via `ClientRequest::content_length`) are not removed. The resulting GET therefore advertises a body it will not send; a stale `Content-Length` can cause request/response desync or the server to wait for a body that never arrives.","fix":"When `reuse_body` is false (method downgraded to GET / body dropped), strip entity headers from `headers` before cloning into the new head: remove `header::CONTENT_LENGTH`, `header::CONTENT_TYPE`, `header::CONTENT_ENCODING`, and `header::TRANSFER_ENCODING`.","locations":[{"ref":"awc/src/middleware/redirect.rs:189-214","code":"  189 |                         let mut body = body.take();\n  190 |                         let body_new = if reuse_body {\n  191 |                             // try to reuse saved body\n  192 |                             match body {\n  193 |                                 Some(ref bytes) => AnyBody::Bytes {\n  194 |                                     body: bytes.clone(),\n  195 |                                 },\n  196 | \n  197 |                                 // body was a non-reusable type so send an empty body instead\n  198 |                                 _ => AnyBody::empty(),\n  199 |                             }\n  200 |                         } else {\n  201 |                             body = None;\n  202 |                             // remove body since we're downgrading to a GET\n  203 |                             AnyBody::None\n  204 |                         };\n  205 | \n  206 |                         let mut headers = headers.take().unwrap();\n  207 | \n  208 |                         remove_sensitive_headers(&mut headers, &prev_uri, &next_uri);\n  209 | \n  210 |                         // use a new request head.\n  211 |                         let mut head = RequestHead::default();\n  212 |                         head.uri = next_uri.clone();\n  213 |                         head.method = method.clone();\n  214 |                         head.headers = headers.clone();","lines":26,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/awc/src/middleware/redirect.rs#L189-L214"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `TestResponse::finish`, each cookie from `self.cookies.delta()` is written with `head.headers.insert(header::SET_COOKIE, ...)`. `HeaderMap::insert` removes all pre-existing values for the key, so when the jar holds more than one cookie every iteration overwrites the previous `Set-Cookie` value and only the last cookie survives in the produced `ClientResponse`. A response mocked with multiple cookies silently loses all but one.","fix":"Use `head.headers.append(header::SET_COOKIE, ...)` instead of `head.headers.insert(...)` so each cookie becomes a separate `Set-Cookie` header value.","locations":[{"ref":"awc/src/test.rs:79-86","code":"   79 |         for cookie in self.cookies.delta() {\n   80 |             use actix_http::header::{self, HeaderValue};\n   81 | \n   82 |             head.headers.insert(\n   83 |                 header::SET_COOKIE,\n   84 |                 HeaderValue::from_str(&cookie.encoded().to_string()).unwrap(),\n   85 |             );\n   86 |         }","lines":8,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/awc/src/test.rs#L79-L86"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `NamedFile::into_response`, the `Range` header is processed (and can `return` `RANGE_NOT_SATISFIABLE` or `BAD_REQUEST`) before the precondition/`not_modified` results are acted on. RFC 7232 requires conditional requests to be evaluated first. Consequences: (1) a request with a failing `If-Unmodified-Since` and an unsatisfiable range gets `416` instead of `412`; (2) when a range is satisfiable but the resource is unmodified, the code inserts a `Content-Range` header and only afterwards returns `304 Not Modified`, so the `304` carries a spurious `Content-Range`.","fix":"Evaluate `precondition_failed` (return `412`) and `not_modified` (return `304`) before parsing and applying the `Range` header, so range handling only runs once the conditional checks pass.","locations":[{"ref":"actix-files/src/named.rs:550-580","code":"  550 |         if let Some(ranges) = req.headers().get(header::RANGE) {\n  551 |             if let Ok(ranges_header) = ranges.to_str() {\n  552 |                 if let Some(range) = HttpRange::parse(ranges_header, length)\n  553 |                     .ok()\n  554 |                     .and_then(|ranges| ranges.first().copied())\n  555 |                 {\n  556 |                     ranged_req = true;\n  557 |                     length = range.length;\n  558 |                     offset = range.start;\n  559 | \n  560 |                     res.insert_header((\n  561 |                         header::CONTENT_RANGE,\n  562 |                         format!(\"bytes {}-{}/{}\", offset, offset + length - 1, self.md.len()),\n  563 |                     ));\n  564 |                 } else {\n  565 |                     res.insert_header((header::CONTENT_RANGE, format!(\"bytes */{}\", length)));\n  566 |                     return res.status(StatusCode::RANGE_NOT_SATISFIABLE).finish();\n  567 |                 };\n  568 |             } else {\n  569 |                 return res.status(StatusCode::BAD_REQUEST).finish();\n  570 |             };\n  571 |         };\n  572 | \n  573 |         if precondition_failed {\n  574 |             return res.status(StatusCode::PRECONDITION_FAILED).finish();\n  575 |         } else if not_modified {\n  576 |             return res\n  577 |                 .status(StatusCode::NOT_MODIFIED)\n  578 |                 .body(body::None::new())\n  579 |                 .map_into_boxed_body();\n  580 |         }","lines":31,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-files/src/named.rs#L550-L580"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`ServiceConfigBuilder::build` does not normalize the keep-alive value, whereas the legacy `ServiceConfig::new` does (`keep_alive: keep_alive.normalize()`). `KeepAlive::normalize` maps `KeepAlive::Timeout(Duration::ZERO)` to `KeepAlive::Disabled`. If a caller passes a `KeepAlive` value directly (e.g. `HttpServiceBuilder::keep_alive(KeepAlive::Timeout(Duration::ZERO))`, since `Into<KeepAlive>` is the identity for `KeepAlive` and skips the normalizing `From<Duration>` impl), the un-normalized `Timeout(ZERO)` reaches the config. Then `keep_alive().enabled()` reports `true` and `keep_alive_deadline()` returns `Some(now + 0)` instead of the `None` that `Disabled` would yield, producing inconsistent keep-alive behavior between the two construction paths.","fix":"Normalize in `ServiceConfigBuilder::build` (or in the `keep_alive` setter): `self.inner.keep_alive = self.inner.keep_alive.normalize();` before constructing the `Rc<Inner>`, matching `ServiceConfig::new`.","locations":[{"ref":"actix-http/src/config.rs:171-173","code":"  171 |     pub fn build(self) -> ServiceConfig {\n  172 |         ServiceConfig(Rc::new(self.inner))\n  173 |     }","lines":3,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-http/src/config.rs#L171-L173"},{"ref":"actix-http/src/builder.rs:87-90","code":"   87 |     pub fn keep_alive<W: Into<KeepAlive>>(mut self, val: W) -> Self {\n   88 |         self.keep_alive = val.into();\n   89 |         self\n   90 |     }","lines":4,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-http/src/builder.rs#L87-L90"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"The `Expect` header is treated as `100-continue` whenever the value merely starts with `100-` (`bytes.len() >= 4 && &bytes[0..4] == b\"100-\"`). Values like `100-foo` or `100-continue-bar` are wrongly accepted, causing the server to send `100 Continue` for expectations it does not understand. RFC 7231 requires responding `417 Expectation Failed` for unknown expectations; only the exact token `100-continue` should trigger continue handling.","fix":"Compare the trimmed value case-insensitively against the full token `100-continue` (`value.to_str().map(str::trim).map(|v| v.eq_ignore_ascii_case(\"100-continue\"))`) rather than matching only the `100-` prefix.","locations":[{"ref":"actix-http/src/h1/decoder.rs:177-182","code":"  177 |                     header::EXPECT => {\n  178 |                         let bytes = value.as_bytes();\n  179 |                         if bytes.len() >= 4 && &bytes[0..4] == b\"100-\" {\n  180 |                             expect = true;\n  181 |                         }\n  182 |                     }","lines":6,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-http/src/h1/decoder.rs#L177-L182"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`write_camel_case` upper-cases the character following a hyphen by consuming it with an inner `iter.next()`. When two hyphens are adjacent (e.g. header name `x--y`), the hyphen branch consumes the second hyphen as the \"next\" character (which is not a letter, so nothing is upper-cased) and the letter after the second hyphen is then processed as an ordinary character and never upper-cased. Result is `X--y` instead of the expected `X--Y`. Only affects the (rare) camel-case output path for header names containing consecutive hyphens.","fix":"Do not treat the character consumed after a hyphen as already-processed when it is itself a hyphen. Either re-check the consumed byte for `b'-'` and keep looking, or restructure to peek rather than consume (track the previous byte and upper-case the current byte when the previous was `b'-'`).","locations":[{"ref":"actix-http/src/h1/encoder.rs:519-530","code":"  519 |     // remaining characters after hyphens should also be uppercase\n  520 |     while let Some(&c) = iter.next() {\n  521 |         if c == b'-' {\n  522 |             // advance iter by one and uppercase if needed\n  523 |             if let Some(c @ b'a'..=b'z') = iter.next() {\n  524 |                 buffer[index] = c & 0b1101_1111;\n  525 |             }\n  526 |             index += 1;\n  527 |         }\n  528 | \n  529 |         index += 1;\n  530 |     }","lines":12,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-http/src/h1/encoder.rs#L519-L530"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"The `HTTP_VALUE` percent-encoding set adds `b'-'` to the encode set, so hyphens in RFC 5987 extended values (used by `ExtendedValue`'s `Display` and `http_percent_encode`) are percent-encoded as `%2D`. RFC 5987 lists `-` in `attr-char`, i.e. it is a safe character that must NOT be encoded. The odd placement of `.add(b'-')` between `.add(b'<')` and `.add(b'>')` suggests an accidental insertion. Output still round-trips but is non-canonical and unnecessarily larger.","fix":"Remove the `.add(b'-')` line from the `HTTP_VALUE` `AsciiSet` so hyphens are emitted literally, matching RFC 5987 `attr-char`.","locations":[{"ref":"actix-http/src/header/mod.rs:70-90","code":"   70 | pub(crate) const HTTP_VALUE: &AsciiSet = &CONTROLS\n   71 |     .add(b' ')\n   72 |     .add(b'\"')\n   73 |     .add(b'%')\n   74 |     .add(b'\\'')\n   75 |     .add(b'(')\n   76 |     .add(b')')\n   77 |     .add(b'*')\n   78 |     .add(b',')\n   79 |     .add(b'/')\n   80 |     .add(b':')\n   81 |     .add(b';')\n   82 |     .add(b'<')\n   83 |     .add(b'-')\n   84 |     .add(b'>')\n   85 |     .add(b'?')\n   86 |     .add(b'[')\n   87 |     .add(b'\\\\')\n   88 |     .add(b']')\n   89 |     .add(b'{')\n   90 |     .add(b'}');","lines":21,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-http/src/header/mod.rs#L70-L90"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`Charset` uses a hyphen for Shift_JIS in both directions: `label()` returns `\"Shift-JIS\"` and `FromStr` only matches the upper-cased input against `\"SHIFT-JIS\"`. The IANA/MIME canonical name is `Shift_JIS` (underscore). A real-world charset token `Shift_JIS` upper-cases to `SHIFT_JIS`, fails the `\"SHIFT-JIS\"` arm, and is silently captured as `Charset::Ext(\"SHIFT_JIS\")` instead of the `Shift_Jis` variant.","fix":"Match the canonical `\"SHIFT_JIS\"` (underscore) in `FromStr` and emit `\"Shift_JIS\"` from `label()`; optionally accept the hyphenated form as an alias for compatibility.","locations":[{"ref":"actix-http/src/header/shared/charset.rs:79","code":"   79 |             Shift_Jis => \"Shift-JIS\",","lines":1,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-http/src/header/shared/charset.rs#L79"},{"ref":"actix-http/src/header/shared/charset.rs:119","code":"  119 |             \"SHIFT-JIS\" => Shift_Jis,","lines":1,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-http/src/header/shared/charset.rs#L119"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`Quality::from_f32` computes the internal q-value with `(value * MAX_QUALITY_INT as f32) as u16`, which truncates toward zero. For several valid three-decimal q-values the `f32` product lands just below the integer (e.g. `0.251 * 1000.0 == 250.99998`), so parsing `q=0.251`, `q=0.253`, `q=0.502`, `q=0.506` and `q=0.511` yields `Quality(250)`, `Quality(252)`, `Quality(501)`, `Quality(505)` and `Quality(510)` respectively - each off by one. This corrupts client/server content-negotiation preferences and the re-serialized value (e.g. `0.251` prints back as `0.25`). Verified by emulating IEEE-754 `f32` multiply over all 1001 q-values.","fix":"Round instead of truncate. Before: `Quality((value * MAX_QUALITY_INT as f32) as u16)` After: `Quality((value * MAX_QUALITY_INT as f32).round() as u16)`. This maps all 1001 canonical q-values back to their exact integer.","locations":[{"ref":"actix-http/src/header/shared/quality.rs:51-60","code":"   51 |     fn from_f32(value: f32) -> Self {\n   52 |         // Check that `value` is within range should be done before calling this method.\n   53 |         // Just in case, this debug_assert should catch if we were forgetful.\n   54 |         debug_assert!(\n   55 |             (0.0..=MAX_QUALITY_FLOAT).contains(&value),\n   56 |             \"q value must be between 0.0 and 1.0\"\n   57 |         );\n   58 | \n   59 |         Quality((value * MAX_QUALITY_INT as f32) as u16)\n   60 |     }","lines":10,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-http/src/header/shared/quality.rs#L51-L60"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The field-draining loop at the top of `Inner::poll` is structured as `loop { if safety.current() { ... break; } }` with no `else` branch. If `safety.current()` ever evaluates to `false` on entry to an iteration, the loop body does nothing and the `break` is never reached, producing an unbounded busy-spin (100% CPU hang). It is currently safe only because `poll` is reached exclusively when `safety.current()` was true and nothing inside the loop mutates the payload `Rc` strong count; that invariant is subtle and easy to violate in future changes.","fix":"Add an explicit `else { break; }` (or `return Poll::Pending;`) to the `if safety.current()` check so the loop cannot spin when the safety guard is not current.","locations":[{"ref":"actix-multipart/src/multipart.rs:395-415","code":"  395 |             loop {\n  396 |                 // Nested multipart streams of fields has to be consumed\n  397 |                 // before switching to next\n  398 |                 if safety.current() {\n  399 |                     let stop = match self.item {\n  400 |                         Item::Field(ref mut field) => match field.borrow_mut().poll(safety) {\n  401 |                             Poll::Pending => return Poll::Pending,\n  402 |                             Poll::Ready(Some(Ok(_))) => continue,\n  403 |                             Poll::Ready(Some(Err(err))) => return Poll::Ready(Some(Err(err))),\n  404 |                             Poll::Ready(None) => true,\n  405 |                         },\n  406 |                         Item::None => false,\n  407 |                     };\n  408 |                     if stop {\n  409 |                         self.item = Item::None;\n  410 |                     }\n  411 |                     if let Item::None = self.item {\n  412 |                         break;\n  413 |                     }\n  414 |                 }\n  415 |             }","lines":21,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-multipart/src/multipart.rs#L395-L415"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`Value::deserialize_bytes`/`deserialize_byte_buf` percent-decode through `requote_str_lossy`, which runs `String::from_utf8_lossy` over the decoded bytes. When a path segment contains percent-encoded bytes that are not valid UTF-8 (e.g. `%FF`), the raw decoded byte `0xFF` is replaced by the U+FFFD replacement character (`0xEF 0xBF 0xBD`) before being handed to `visit_byte_buf`. A consumer deserializing into a byte buffer therefore receives corrupted bytes rather than the actual decoded ones. `Quoter::requote` already returns exact `Vec<u8>`; only the byte-oriented visitor path needs it.","fix":"For the bytes visitor paths, feed the exact decoded bytes from `Quoter::requote(self.value.as_bytes())` (a `Vec<u8>`) directly into `visit_byte_buf`, instead of routing through the lossy UTF-8 conversion in `requote_str_lossy`.","locations":[{"ref":"actix-router/src/de.rs:348-356","code":"  348 |     fn deserialize_bytes<V>(self, visitor: V) -> Result<V::Value, Self::Error>\n  349 |     where\n  350 |         V: Visitor<'de>,\n  351 |     {\n  352 |         match FULL_QUOTER.with(|q| q.requote_str_lossy(self.value)) {\n  353 |             Some(s) => visitor.visit_byte_buf(s.into()),\n  354 |             None => visitor.visit_borrowed_bytes(self.value.as_bytes()),\n  355 |         }\n  356 |     }","lines":9,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-router/src/de.rs#L348-L356"},{"ref":"actix-router/src/quoter.rs:89-92","code":"   89 |     pub(crate) fn requote_str_lossy(&self, val: &str) -> Option<String> {\n   90 |         self.requote(val.as_bytes())\n   91 |             .map(|data| String::from_utf8_lossy(&data).into_owned())\n   92 |     }","lines":4,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-router/src/quoter.rs#L89-L92"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`Patterns::is_empty` unconditionally returns `false` for the `Single` variant, so a `Patterns::Single(String::new())` built from an empty pattern string (e.g. via `\"\".patterns()` or `vec![\"\"].patterns()`) is reported as non-empty. Callers using `is_empty()` to detect an absent/empty pattern set will be misled by an empty single pattern.","fix":"Make `is_empty` consider the content of the single pattern, e.g. `Patterns::Single(pat) => pat.is_empty()`, if an empty single pattern should be treated as empty; otherwise document explicitly why `Single` is always non-empty.","locations":[{"ref":"actix-router/src/pattern.rs:8-15","code":"    8 | impl Patterns {\n    9 |     pub fn is_empty(&self) -> bool {\n   10 |         match self {\n   11 |             Patterns::Single(_) => false,\n   12 |             Patterns::List(pats) => pats.is_empty(),\n   13 |         }\n   14 |     }\n   15 | }","lines":8,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-router/src/pattern.rs#L8-L15"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`PatternIter::size_hint` ignores iteration progress. For `Patterns::Single` it always returns `(1, Some(1))` even after the single item has been yielded (`self.done == true`), and for `Patterns::List` it always returns `(patterns.len(), Some(patterns.len()))` regardless of `list_idx`. Consumers relying on `size_hint` (e.g. `collect`/`flat_map` in `join`) can over-reserve, and the reported length is incorrect once iteration has begun.","fix":"Account for consumed state: for `Single` return `(0, Some(0))` when `self.done`; for `List` return `(patterns.len().saturating_sub(self.list_idx), Some(patterns.len().saturating_sub(self.list_idx)))`.","locations":[{"ref":"actix-router/src/resource.rs:478-483","code":"  478 |             fn size_hint(&self) -> (usize, Option<usize>) {\n  479 |                 match &self.patterns {\n  480 |                     Patterns::Single(_) => (1, Some(1)),\n  481 |                     Patterns::List(patterns) => (patterns.len(), Some(patterns.len())),\n  482 |                 }\n  483 |             }","lines":6,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-router/src/resource.rs#L478-L483"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `HostGuard::check`, the scheme match compares the guard's scheme against the request URI scheme with `scheme == req_host_uri_scheme`, which is a case-sensitive `String`/`&str` comparison. URI schemes are case-insensitive per RFC 3986, so `Host(\"...\").scheme(\"HTTPS\")` would fail to match a request whose scheme parses as `https`. The guard's stored host is likewise compared case-sensitively at line 100 even though hostnames are case-insensitive.","fix":"Compare schemes (and hosts) case-insensitively, e.g. `scheme.eq_ignore_ascii_case(req_host_uri_scheme)` and `self.host.eq_ignore_ascii_case(uri_host)`.","locations":[{"ref":"actix-web/src/guard/host.rs:108-111","code":"  108 |         if let Some(ref scheme) = self.scheme {\n  109 |             if let Some(ref req_host_uri_scheme) = req_host_uri.scheme_str() {\n  110 |                 return scheme == req_host_uri_scheme;\n  111 |             }","lines":4,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-web/src/guard/host.rs#L108-L111"}]},
{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`CacheDirective::from_str` unquotes numeric directive values with `s[idx + 1..].trim_matches('\"')`. `trim_matches` strips any number of leading/trailing quote characters independently, so unbalanced input like `max-age=\"200` or `max-age=200\"` is silently accepted. For the `Extension(name, Some(value))` fallback the surrounding quotes are also stripped, so a quoted extension value such as `foo=\"bar baz\"` is stored as `bar baz` and then re-emitted unquoted by `Display` as `foo=bar baz`, which is an invalid (whitespace-containing) directive that does not round-trip.","fix":"Only strip a single matched pair of surrounding quotes (verify the value both starts and ends with `\"` before removing), and preserve/re-quote extension values that contain characters requiring a quoted-string when displaying.","locations":[{"ref":"actix-web/src/http/header/cache_control.rs:177-189","code":"  177 |             _ => match s.find('=') {\n  178 |                 Some(idx) if idx + 1 < s.len() => {\n  179 |                     match (&s[..idx], s[idx + 1..].trim_matches('\"')) {\n  180 |                         (\"max-age\", secs) => secs.parse().map(MaxAge).map_err(Some),\n  181 |                         (\"max-stale\", secs) => secs.parse().map(MaxStale).map_err(Some),\n  182 |                         (\"min-fresh\", secs) => secs.parse().map(MinFresh).map_err(Some),\n  183 |                         (\"s-maxage\", secs) => secs.parse().map(SMaxAge).map_err(Some),\n  184 |                         (left, right) => Ok(Extension(left.to_owned(), Some(right.to_owned()))),\n  185 |                     }\n  186 |                 }\n  187 |                 Some(_) => Err(None),\n  188 |                 None => Ok(Extension(s.to_owned(), None)),\n  189 |             },","lines":13,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-web/src/http/header/cache_control.rs#L177-L189"}]},
{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"When `content_type_required` is `false`, `JsonBody::new` returns `can_parse_json = true` unconditionally and never consults the user-supplied `content_type` predicate. A user who configures `JsonConfig::default().content_type(pred).content_type_required(false)` reasonably expects `pred` to still restrict accepted content types, but it is silently ignored and any/no content type is accepted as JSON. The two options interact in a surprising, undocumented way.","fix":"Either document explicitly that setting `content_type_required(false)` disables the custom `content_type` predicate entirely, or, in the `(false, Ok(Some(mime)))` case, still honor a configured `ctype_fn` predicate when a valid content type is present.","locations":[{"ref":"actix-web/src/types/json.rs:331-344","code":"  331 |         let can_parse_json = match (ctype_required, req.mime_type()) {\n  332 |             (true, Ok(Some(mime))) => {\n  333 |                 mime.subtype() == mime::JSON\n  334 |                     || mime.suffix() == Some(mime::JSON)\n  335 |                     || ctype_fn.is_some_and(|predicate| predicate(mime))\n  336 |             }\n  337 | \n  338 |             // if content-type is expected but not parsable as mime type, bail\n  339 |             (true, _) => false,\n  340 | \n  341 |             // if content-type validation is disabled, assume payload is JSON\n  342 |             // even when content-type header is missing or invalid mime type\n  343 |             (false, _) => true,\n  344 |         };","lines":14,"link":"https://github.com/actix/actix-web/blob/d7ce1a3faba0eb565abad4f852c1f714ed9e19d2/actix-web/src/types/json.rs#L331-L344"}]},
