{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `iter_overeager_cloned::check`, the `Op::FixClosure` non-closure branch builds the suggestion `format!(\"|&x| {predicate}(x)\")`, hardcoding the closure parameter name `x`. If `predicate` itself refers to a variable named `x` in scope, the generated `|&x| predicate(x)` shadows it and changes meaning, yet the suggestion is emitted with full applicability. A latent capture/shadowing hazard in an auto-applied fix.","fix":"Use a fresh binding name unlikely to collide (or verify `x` is unused in `predicate`), or downgrade applicability to `MaybeIncorrect` for the synthesized-closure case.","locations":[{"ref":"clippy_lints/src/methods/iter_overeager_cloned.rs:123-133","code":"  123 |             Op::FixClosure(name, predicate_expr) => {\n  124 |                 if let Some(predicate) = snippet_opt(cx, predicate_expr.span) {\n  125 |                     let new_closure = if let ExprKind::Closure(_) = predicate_expr.kind {\n  126 |                         predicate.replacen('|', \"|&\", 1)\n  127 |                     } else {\n  128 |                         format!(\"|&x| {predicate}(x)\")\n  129 |                     };\n  130 |                     let snip = format!(\".{name}({new_closure}).cloned()\");\n  131 |                     let replace_span = expr.span.with_lo(cloned_recv.span.hi());\n  132 |                     diag.span_suggestion(replace_span, \"try\", snip, Applicability::MachineApplicable);\n  133 |                 }","lines":11,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/methods/iter_overeager_cloned.rs#L123-L133"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"For a temporary-creating expression that is a `Call` whose function is a `QPath::Resolved` multi-segment path (e.g. `a::b::make_option()`), `func_path.segments[0].ident.name` returns the first path segment (`a`) instead of the function name (`make_option`), producing a misleading note like \"`a` creates a temporary value\". The neighboring `QPath::TypeRelative` branch correctly uses the final segment.","fix":"Use the last segment: `func_path.segments.last().map(|s| s.ident.name)` instead of `segments[0]`.","locations":[{"ref":"clippy_lints/src/methods/needless_option_take.rs:48-52","code":"   48 |             if let ExprKind::Path(QPath::Resolved(_, func_path)) = function.kind\n   49 |                 && !func_path.segments.is_empty()\n   50 |             {\n   51 |                 return Some(func_path.segments[0].ident.name);\n   52 |             }","lines":5,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/methods/needless_option_take.rs#L48-L52"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`trim_start_matches(\"test_\")` strips the prefix repeatedly, not once. For a test function named `test_test_foo`, the suggested rename becomes `foo` instead of the intended `test_foo`. The guard on line 83 only checks `starts_with(\"test_\")`, so removal of a single prefix is intended. The suggestion is MaybeIncorrect, limiting impact.","fix":"Use `strip_prefix(\"test_\")` (the `starts_with` guard already ensures the prefix is present).","locations":[{"ref":"clippy_lints/src/redundant_test_prefix.rs:82-97","code":"   82 |         if !ident.as_str().starts_with(\"test_\") {\n   83 |             return;\n   84 |         }\n   85 | \n   86 |         // If the function is not a test function, skip the lint.\n   87 |         if !is_test_function(cx.tcx, fn_def_id) {\n   88 |             return;\n   89 |         }\n   90 | \n   91 |         span_lint_and_then(\n   92 |             cx,\n   93 |             REDUNDANT_TEST_PREFIX,\n   94 |             ident.span,\n   95 |             \"redundant `test_` prefix in test function name\",\n   96 |             |diag| {\n   97 |                 let non_prefixed = Symbol::intern(ident.as_str().trim_start_matches(\"test_\"));","lines":16,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/redundant_test_prefix.rs#L82-L97"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`normalize_comparison` is documented to put the expression in the form `lhs OP rhs`, and the comparison arms swap operands only when they flip the operator. But the `Eq` and `Ne` arms return `(Rel::Eq, rhs, lhs)` / `(Rel::Ne, rhs, lhs)` - they swap operands without flipping the operator, so callers receive operands reversed. Harmless for symmetric ==/!= today, but inconsistent with the documented contract and could yield wrong spans/sides for a caller relying on operand order.","fix":"Return `(Rel::Eq, lhs, rhs)` and `(Rel::Ne, lhs, rhs)` to match the non-swapping equal-operator semantics, unless swapping is intended (then document why).","locations":[{"ref":"clippy_utils/src/comparisons.rs:32-33","code":"   32 |         BinOpKind::Eq => Some((Rel::Eq, rhs, lhs)),\n   33 |         BinOpKind::Ne => Some((Rel::Ne, rhs, lhs)),","lines":2,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_utils/src/comparisons.rs#L32-L33"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`Constant`'s `PartialEq` returns `false` for two `Adt(ConstValue)` values (catch-all `_ => false`), and `partial_cmp` has no `Adt` arm either, so two equal struct constants compare as neither equal nor ordered. Since `Adt` values are produced by `expr` (field-access path) and can flow into equality checks, lints relying on constant equality silently miss cases (false negatives) rather than erroring.","fix":"Either compare `Adt` `ConstValue`s structurally where possible, or document explicitly at `PartialEq`/`partial_cmp` that `Adt` constants are never considered equal/ordered.","locations":[{"ref":"clippy_utils/src/consts.rs:127-149","code":"  127 | impl PartialEq for Constant {\n  128 |     fn eq(&self, other: &Self) -> bool {\n  129 |         match (self, other) {\n  130 |             (Self::Str(ls), Self::Str(rs)) => ls == rs,\n  131 |             (Self::Binary(l), Self::Binary(r)) => l == r,\n  132 |             (&Self::Char(l), &Self::Char(r)) => l == r,\n  133 |             (&Self::Int(l), &Self::Int(r)) => l == r,\n  134 |             (&Self::F64(l), &Self::F64(r)) => {\n  135 |                 // `to_bits` is required to catch non-matching `0.0` and `-0.0`.\n  136 |                 l.to_bits() == r.to_bits() && !l.is_nan()\n  137 |             },\n  138 |             (&Self::F32(l), &Self::F32(r)) => {\n  139 |                 // `to_bits` is required to catch non-matching `0.0` and `-0.0`.\n  140 |                 l.to_bits() == r.to_bits() && !l.is_nan()\n  141 |             },\n  142 |             (&Self::Bool(l), &Self::Bool(r)) => l == r,\n  143 |             (&Self::Vec(ref l), &Self::Vec(ref r)) | (&Self::Tuple(ref l), &Self::Tuple(ref r)) => l == r,\n  144 |             (Self::Repeat(lv, ls), Self::Repeat(rv, rs)) => ls == rs && lv == rv,\n  145 |             (Self::Ref(lb), Self::Ref(rb)) => *lb == *rb,\n  146 |             // TODO: are there inter-type equalities?\n  147 |             _ => false,\n  148 |         }\n  149 |     }","lines":23,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_utils/src/consts.rs#L127-L149"},{"ref":"clippy_utils/src/consts.rs:209-263","code":"  209 |     pub fn partial_cmp(tcx: TyCtxt<'_>, cmp_type: Ty<'_>, left: &Self, right: &Self) -> Option<Ordering> {\n  210 |         match (left, right) {\n  211 |             (Self::Str(ls), Self::Str(rs)) => Some(ls.cmp(rs)),\n  212 |             (Self::Char(l), Self::Char(r)) => Some(l.cmp(r)),\n  213 |             (&Self::Int(l), &Self::Int(r)) => match *cmp_type.kind() {\n  214 |                 ty::Int(int_ty) => Some(sext(tcx, l, int_ty).cmp(&sext(tcx, r, int_ty))),\n  215 |                 ty::Uint(_) => Some(l.cmp(&r)),\n  216 |                 _ => bug!(\"Not an int type\"),\n  217 |             },\n  218 |             (&Self::F64(l), &Self::F64(r)) => l.partial_cmp(&r),\n  219 |             (&Self::F32(l), &Self::F32(r)) => l.partial_cmp(&r),\n  220 |             (Self::Bool(l), Self::Bool(r)) => Some(l.cmp(r)),\n  221 |             (Self::Tuple(l), Self::Tuple(r)) if l.len() == r.len() => match *cmp_type.kind() {\n  222 |                 ty::Tuple(tys) if tys.len() == l.len() => l\n  223 |                     .iter()\n  224 |                     .zip(r)\n  225 |                     .zip(tys)\n  226 |                     .map(|((li, ri), cmp_type)| Self::partial_cmp(tcx, cmp_type, li, ri))\n  227 |                     .find(|r| r.is_none_or(|o| o != Ordering::Equal))\n  228 |                     .unwrap_or_else(|| Some(l.len().cmp(&r.len()))),\n  229 |                 _ => None,\n  230 |             },\n  231 |             (Self::Vec(l), Self::Vec(r)) => {\n  232 |                 let cmp_type = cmp_type.builtin_index()?;\n  233 |                 iter::zip(l, r)\n  234 |                     .map(|(li, ri)| Self::partial_cmp(tcx, cmp_type, li, ri))\n  235 |                     .find(|r| r.is_none_or(|o| o != Ordering::Equal))\n  236 |                     .unwrap_or_else(|| Some(l.len().cmp(&r.len())))\n  237 |             },\n  238 |             (Self::Repeat(lv, ls), Self::Repeat(rv, rs)) => {\n  239 |                 match Self::partial_cmp(\n  240 |                     tcx,\n  241 |                     match *cmp_type.kind() {\n  242 |                         ty::Array(ty, _) => ty,\n  243 |                         _ => return None,\n  244 |                     },\n  245 |                     lv,\n  246 |                     rv,\n  247 |                 ) {\n  248 |                     Some(Ordering::Equal) => Some(ls.cmp(rs)),\n  249 |                     x => x,\n  250 |                 }\n  251 |             },\n  252 |             (Self::Ref(lb), Self::Ref(rb)) => Self::partial_cmp(\n  253 |                 tcx,\n  254 |                 match *cmp_type.kind() {\n  255 |                     ty::Ref(_, ty, _) => ty,\n  256 |                     _ => return None,\n  257 |                 },\n  258 |                 lb,\n  259 |                 rb,\n  260 |             ),\n  261 |             // TODO: are there any useful inter-type orderings?\n  262 |             _ => None,\n  263 |         }","lines":55,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_utils/src/consts.rs#L209-L263"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`Constant::partial_cmp` Tuple arm is guarded by `l.len() == r.len()` (and the inner `ty::Tuple` arm requires `tys.len() == l.len()`), yet the per-element comparison ends with `.unwrap_or_else(|| Some(l.len().cmp(&r.len())))`. Since lengths are guaranteed equal, that fallback can only yield `Some(Equal)`, making the length-compare branch dead/misleading - a copy-paste of the `Vec` idiom (where lengths genuinely differ).","fix":"Replace `.unwrap_or_else(|| Some(l.len().cmp(&r.len())))` with `.unwrap_or(Some(Ordering::Equal))` to make the intent explicit.","locations":[{"ref":"clippy_utils/src/consts.rs:221-228","code":"  221 |             (Self::Tuple(l), Self::Tuple(r)) if l.len() == r.len() => match *cmp_type.kind() {\n  222 |                 ty::Tuple(tys) if tys.len() == l.len() => l\n  223 |                     .iter()\n  224 |                     .zip(r)\n  225 |                     .zip(tys)\n  226 |                     .map(|((li, ri), cmp_type)| Self::partial_cmp(tcx, cmp_type, li, ri))\n  227 |                     .find(|r| r.is_none_or(|o| o != Ordering::Equal))\n  228 |                     .unwrap_or_else(|| Some(l.len().cmp(&r.len()))),","lines":8,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_utils/src/consts.rs#L221-L228"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`is_integral() | is_bool()` uses bitwise-OR instead of logical `||`. Both operands are `bool` so the result is correct, but it is the only place in the file using `|` between two boolean method calls (line 198 uses `||`), prevents short-circuiting, and looks like an accidental typo.","fix":"Change `ty.is_integral() | ty.is_bool()` to `ty.is_integral() || ty.is_bool()`.","locations":[{"ref":"clippy_utils/src/qualify_min_const_fn.rs:212","code":"  212 |             if ty.is_integral() | ty.is_bool() {","lines":1,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_utils/src/qualify_min_const_fn.rs#L212"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`for_each_local_assignment` does not stop traversal promptly once the callback returns `Break`. After `self.res` becomes `Break`, the subsequent `self.visit_expr(rhs)` still walks the RHS subtree (the assign-arm guard then fails, falling through to `walk_expr`), doing extra work instead of short-circuiting.","fix":"Return early if `self.res.is_break()` at the top of `visit_expr`, mirroring `for_each_local_use_after_expr`.","locations":[{"ref":"clippy_utils/src/visitors.rs:815-825","code":"  815 |         fn visit_expr(&mut self, e: &'tcx Expr<'tcx>) {\n  816 |             if let ExprKind::Assign(lhs, rhs, _) = e.kind\n  817 |                 && self.res.is_continue()\n  818 |                 && lhs.res_local_id() == Some(self.local_id)\n  819 |             {\n  820 |                 self.res = (self.f)(rhs);\n  821 |                 self.visit_expr(rhs);\n  822 |             } else {\n  823 |                 walk_expr(self, e);\n  824 |             }\n  825 |         }","lines":11,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_utils/src/visitors.rs#L815-L825"}]},
{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`RustcIce::from_stderr_and_status` treats *any* process exit code of 101 as an internal compiler error, ignoring stderr content (the `stderr` parameter is only copied into `ice_content`, never inspected). Exit code 101 is also the default Rust panic exit code and is commonly returned by cargo/build failures that are not clippy ICEs, producing false 'Some crates ICEd' results and spurious ICE entries.","fix":"Require an ICE signature in stderr (e.g. `stderr.contains(\"internal compiler error\")` or `\"thread 'rustc' panicked\"`) before classifying as a `RustcIce`.","locations":[{"ref":"lintcheck/src/output.rs:36-49","code":"   36 | impl RustcIce {\n   37 |     pub fn from_stderr_and_status(crate_name: &str, status: ExitStatus, stderr: &str) -> Option<Self> {\n   38 |         if status.code().unwrap_or(0) == 101\n   39 |         /* ice exit status */\n   40 |         {\n   41 |             Some(Self {\n   42 |                 crate_name: crate_name.to_owned(),\n   43 |                 ice_content: stderr.to_owned(),\n   44 |             })\n   45 |         } else {\n   46 |             None\n   47 |         }\n   48 |     }\n   49 | }","lines":14,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/lintcheck/src/output.rs#L36-L49"}]},
{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"In `verify_case`, the `UpperCase`/`LowerCase` checks use `c.to_uppercase().next() == Some(c)` and `c.to_lowercase().next() == Some(c)`. Characters whose case mapping expands to multiple chars (e.g. 'ß' -> \"SS\") are judged only by their first mapped char, so a string-literal arm containing such a character can be classified inaccurately. Best-effort heuristic, but not a faithful case test.","fix":"Compare the full case-mapped string against the original, or document the ASCII-only intent.","locations":[{"ref":"clippy_lints/src/matches/match_str_case_mismatch.rs:83-85","code":"   83 |         CaseMethod::LowerCase => |input: &str| -> bool { input.chars().all(|c| c.to_lowercase().next() == Some(c)) },\n   84 |         CaseMethod::AsciiLowerCase => |input: &str| -> bool { !input.chars().any(|c| c.is_ascii_uppercase()) },\n   85 |         CaseMethod::UpperCase => |input: &str| -> bool { input.chars().all(|c| c.to_uppercase().next() == Some(c)) },","lines":3,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/matches/match_str_case_mismatch.rs#L83-L85"}]},
{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"medium","description":"Inconsistent `peel_refs()` usage in transmute_undefined_repr when deciding whether to emit the 'has an undefined layout' note. At lines 72/86 the comparison peels refs on BOTH sides (`from_ty_orig.peel_refs() != from_ty.peel_refs()`), but the later branches at 120/123/141/158 peel only the original side (`from_ty_orig.peel_refs() != from_ty`), comparing operands at different reduction levels so the inequality is essentially always true there. This affects only a diagnostic note (cannot cause a wrong lint to fire), so impact is cosmetic, but the asymmetry looks unintentional.","fix":"Make all five comparisons consistent - peel refs on both sides (`from_ty_orig.peel_refs() != from_ty.peel_refs()`) everywhere, or none.","locations":[{"ref":"clippy_lints/src/transmute/transmute_undefined_repr.rs:72","code":"   72 |                         if from_ty_orig.peel_refs() != from_ty.peel_refs() {","lines":1,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/transmute/transmute_undefined_repr.rs#L72"},{"ref":"clippy_lints/src/transmute/transmute_undefined_repr.rs:86","code":"   86 |                         if to_ty_orig.peel_refs() != to_ty.peel_refs() {","lines":1,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/transmute/transmute_undefined_repr.rs#L86"},{"ref":"clippy_lints/src/transmute/transmute_undefined_repr.rs:120-125","code":"  120 |                             if from_ty_orig.peel_refs() != from_ty {\n  121 |                                 diag.note(format!(\"the contained type `{from_ty}` has an undefined layout\"));\n  122 |                             }\n  123 |                             if to_ty_orig.peel_refs() != to_ty {\n  124 |                                 diag.note(format!(\"the contained type `{to_ty}` has an undefined layout\"));\n  125 |                             }","lines":6,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/transmute/transmute_undefined_repr.rs#L120-L125"},{"ref":"clippy_lints/src/transmute/transmute_undefined_repr.rs:141-143","code":"  141 |                         if from_ty_orig.peel_refs() != from_ty {\n  142 |                             diag.note(format!(\"the contained type `{from_ty}` has an undefined layout\"));\n  143 |                         }","lines":3,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/transmute/transmute_undefined_repr.rs#L141-L143"},{"ref":"clippy_lints/src/transmute/transmute_undefined_repr.rs:158-160","code":"  158 |                         if to_ty_orig.peel_refs() != to_ty {\n  159 |                             diag.note(format!(\"the contained type `{to_ty}` has an undefined layout\"));\n  160 |                         }","lines":3,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/transmute/transmute_undefined_repr.rs#L158-L160"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"The `HEURISTICS` table entry `(sym::peekable, 1, First, Infinite)` declares that `peekable` takes 1 argument, but `Iterator::peekable(self) -> Peekable<Self>` takes zero arguments. In `is_infinite` the match requires `args.len() == len`, so this entry can never fire and infiniteness is not propagated through `.peekable()` (e.g. `(0..).peekable()` is not recognised as infinite), whereas the adjacent zero-arg methods `fuse`, `cloned`, `rev`, `cycle`, `enumerate` work correctly.","fix":"Change the arg count to 0: `(sym::peekable, 0, First, Infinite),`.","locations":[{"ref":"clippy_lints/src/infinite_iter.rs:133","code":"  133 |     (sym::peekable, 1, First, Infinite),","lines":1,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/infinite_iter.rs#L133"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"easy","description":"In `check_if_chains`, the `TyCtxt::is_diagnostic_item` branch binds the `did1` snippet to a variable named `recv` and then uses it as `get_diagnostic_name({recv})`. The value is correct (it is the `did` argument) but the name `recv` is misleading copy-paste residue from the receiver-based branch above; the parallel `check_block` branch correctly names the same thing `did`. Cosmetic, output is correct.","fix":"Rename the local `recv` to `did` for clarity.","locations":[{"ref":"clippy_lints_internal/src/repeated_is_diagnostic_item.rs:481","code":"  481 |                 let recv = snippet_with_applicability(cx, did1.span, \"_\", &mut app);","lines":1,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints_internal/src/repeated_is_diagnostic_item.rs#L481"},{"ref":"clippy_lints_internal/src/repeated_is_diagnostic_item.rs:225","code":"  225 |                         let did = snippet_with_applicability(cx, did1.span, \"_\", &mut app);","lines":1,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints_internal/src/repeated_is_diagnostic_item.rs#L225"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"easy","description":"In `check_crate_post`, the outer loop iterates all functions and the inner loop iterates each function's unused `&mut` parameters. When `span_extend_to_prev_str` fails to locate `mut` it triggers the `let ... else { return; }`, which aborts the entire `check_crate_post` method. That suppresses NEEDLESS_PASS_BY_REF_MUT not just for the offending parameter but for every remaining parameter and every remaining function in the crate. The intent is to skip only the current parameter.","fix":"Change `return;` on line 277 to `continue;` so only the current parameter is skipped.","locations":[{"ref":"clippy_lints/src/needless_pass_by_ref_mut.rs:266-277","code":"  266 |             for input in unused {\n  267 |                 // If the argument is never used mutably, we emit the warning.\n  268 |                 let sp = input.span;\n  269 |                 if let rustc_hir::TyKind::Ref(_, inner_ty) = input.kind {\n  270 |                     let Some(after_mut_span) = cx.tcx.sess.source_map().span_extend_to_prev_str(\n  271 |                         inner_ty.ty.span.shrink_to_lo(),\n  272 |                         \"mut\",\n  273 |                         true,\n  274 |                         true,\n  275 |                     ) else {\n  276 |                         return;\n  277 |                     };","lines":12,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/needless_pass_by_ref_mut.rs#L266-L277"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`Meta.next_page` is typed as a non-optional `String`, but the crates.io API returns `\"next_page\": null` once there are no further pages. The pagination loop `while crates.len() < number` only stops once `number` crates are collected; if `number` exceeds the total available crates (or the API otherwise terminates pagination with a null `next_page`), the next `into_json::<Page>()` fails to deserialize `null` into `String`, so `fetch` returns `Err` which `main` then `.unwrap()`s, panicking. There is no termination guard for 'no more pages'.","fix":"Make `next_page: Option<String>` and break the loop when it is `None` (or when a page returns zero crates), in addition to the length check.","locations":[{"ref":"lintcheck/src/popular_crates.rs:19-22","code":"   19 | #[derive(Deserialize, Debug)]\n   20 | struct Meta {\n   21 |     next_page: String,\n   22 | }","lines":4,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/lintcheck/src/popular_crates.rs#L19-L22"},{"ref":"lintcheck/src/popular_crates.rs:31-43","code":"   31 |     while crates.len() < number {\n   32 |         let page: Page = agent\n   33 |             .get(&format!(\"https://crates.io/api/v1/crates{query}\"))\n   34 |             .call()?\n   35 |             .into_json()?;\n   36 | \n   37 |         query = page.meta.next_page;\n   38 |         crates.extend(page.crates);\n   39 |         crates.truncate(number);\n   40 | \n   41 |         let width = number.ilog10() as usize + 1;\n   42 |         println!(\"Fetched {:>width$}/{number} crates\", crates.len());\n   43 |     }","lines":13,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/lintcheck/src/popular_crates.rs#L31-L43"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`run_rustfmt` configures the rustfmt child with `Stdio::piped()` stderr but only reads that stderr in the error branches; on a successful exit the pipe is never drained. rustfmt run with `--check` over many files can write substantial output to stderr; because the pipe buffer is never read on the success path, a child that writes more than the OS pipe buffer before exiting could block in `write` and `child.wait()` would then deadlock. Latent rather than commonly hit.","fix":"Always drain the child's stderr (e.g. via `wait_with_output`) in all match arms, or only pipe stderr when it is consumed.","locations":[{"ref":"clippy_dev/src/fmt.rs:291-326","code":"  291 |             cmd.stdout(Stdio::null())\n  292 |                 .stdin(Stdio::null())\n  293 |                 .stderr(Stdio::piped())\n  294 |                 .args([\"--unstable-features\", \"--skip-children\"]);\n  295 |             cmd\n  296 |         },\n  297 |         args.iter(),\n  298 |     )\n  299 |     .map(|mut cmd| expect_action(cmd.spawn(), ErrAction::Run, \"rustfmt\"))\n  300 |     .collect();\n  301 | \n  302 |     for child in &mut children {\n  303 |         let status = expect_action(child.wait(), ErrAction::Run, \"rustfmt\");\n  304 |         match (update_mode, status.exit_ok()) {\n  305 |             (UpdateMode::Check | UpdateMode::Change, Ok(())) => {},\n  306 |             (UpdateMode::Check, Err(_)) => {\n  307 |                 let mut s = String::new();\n  308 |                 if let Some(mut stderr) = child.stderr.take()\n  309 |                     && stderr.read_to_string(&mut s).is_ok()\n  310 |                 {\n  311 |                     eprintln!(\"{s}\");\n  312 |                 }\n  313 |                 eprintln!(\"Formatting check failed!\\nRun `cargo dev fmt` to update.\");\n  314 |                 process::exit(1);\n  315 |             },\n  316 |             (UpdateMode::Change, e) => {\n  317 |                 let mut s = String::new();\n  318 |                 if let Some(mut stderr) = child.stderr.take()\n  319 |                     && stderr.read_to_string(&mut s).is_ok()\n  320 |                 {\n  321 |                     eprintln!(\"{s}\");\n  322 |                 }\n  323 |                 expect_action(e, ErrAction::Run, \"rustfmt\");\n  324 |             },\n  325 |         }\n  326 |     }","lines":36,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_dev/src/fmt.rs#L291-L326"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `check_install_precondition`, when `.vscode` does not exist and `fs::create_dir` fails, the error is printed but the function falls through and still returns `true`. `install_tasks` then proceeds to `fs::copy` into the missing directory, which fails again, emitting a second redundant error. The user sees two errors for one root cause and the precondition function's contract ('return false when install can't proceed') is violated.","fix":"In the `Err` arm of `create_dir` return `false` after printing the error.","locations":[{"ref":"clippy_dev/src/setup/vscode.rs:43-53","code":"   43 |         match fs::create_dir(vs_dir_path) {\n   44 |             Ok(()) => {\n   45 |                 println!(\"info: created `{VSCODE_DIR}` directory for clippy\");\n   46 |             },\n   47 |             Err(err) => {\n   48 |                 eprintln!(\"error: the task target directory `{VSCODE_DIR}` could not be created ({err})\");\n   49 |             },\n   50 |         }\n   51 |     }\n   52 | \n   53 |     true","lines":11,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_dev/src/setup/vscode.rs#L43-L53"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"For `CrateSource::Git`, a failed `git clone` or `git checkout` only prints to stderr via `eprintln!` and then proceeds to construct and return the `Crate` as if the source were ready. A failed clone leaves `repo_path` nonexistent/empty; lintcheck then runs clippy against missing sources and surfaces a much less clear error far from the root cause. The clone is also skipped entirely when `repo_path` already exists, so a previously-failed partial clone is never retried.","fix":"On clone/checkout failure return an error or exit with a clear message instead of returning an unusable crate path.","locations":[{"ref":"lintcheck/src/input.rs:247-271","code":"  247 |                 if !repo_path.is_dir() {\n  248 |                     println!(\"Cloning {url} and checking out {commit}\");\n  249 |                     if !Command::new(\"git\")\n  250 |                         .arg(\"clone\")\n  251 |                         .arg(url)\n  252 |                         .arg(&repo_path)\n  253 |                         .status()\n  254 |                         .expect(\"Failed to clone git repo!\")\n  255 |                         .success()\n  256 |                     {\n  257 |                         eprintln!(\"Failed to clone {url} into {}\", repo_path.display());\n  258 |                     }\n  259 |                 }\n  260 |                 // check out the commit/branch/whatever\n  261 |                 if !Command::new(\"git\")\n  262 |                     .args([\"-c\", \"advice.detachedHead=false\"])\n  263 |                     .arg(\"checkout\")\n  264 |                     .arg(commit)\n  265 |                     .current_dir(&repo_path)\n  266 |                     .status()\n  267 |                     .expect(\"Failed to check out commit\")\n  268 |                     .success()\n  269 |                 {\n  270 |                     eprintln!(\"Failed to checkout {commit} of repo at {}\", repo_path.display());\n  271 |                 }","lines":25,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/lintcheck/src/input.rs#L247-L271"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"Three OP_REF suggestion sites compute a mutable `applicability` and pass `&mut applicability` to `snippet_with_context` (which may downgrade it to `HasPlaceholders` when the `...` placeholder is used), but then hand a fresh hardcoded `Applicability::MachineApplicable` to `span_suggestion` instead of the (possibly downgraded) `applicability` variable, so the computed value is discarded. The sibling blocks at op_ref.rs:64-71 and op_ref.rs:84-87 correctly forward `applicability`. Result: rustfix may auto-apply a suggestion that still contains `...` placeholders.","fix":"Pass the mutated `applicability` variable to `span_suggestion` in all three sites instead of `Applicability::MachineApplicable`.","locations":[{"ref":"clippy_lints/src/operators/op_ref.rs:99-107","code":"   99 |                             let mut applicability = Applicability::MachineApplicable;\n  100 |                             let (rsnip, _) = snippet_with_context(cx, r.span, e.span.ctxt(), \"...\", &mut applicability);\n  101 |                             diag.span_suggestion(\n  102 |                                 right.span,\n  103 |                                 \"use the right value directly\",\n  104 |                                 rsnip,\n  105 |                                 Applicability::MachineApplicable,\n  106 |                             );\n  107 |                         },","lines":9,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/operators/op_ref.rs#L99-L107"},{"ref":"clippy_lints/src/operators/op_ref.rs:131-140","code":"  131 |                         |diag| {\n  132 |                             let mut applicability = Applicability::MachineApplicable;\n  133 |                             let (lsnip, _) = snippet_with_context(cx, l.span, e.span.ctxt(), \"...\", &mut applicability);\n  134 |                             diag.span_suggestion(\n  135 |                                 left.span,\n  136 |                                 \"use the left value directly\",\n  137 |                                 lsnip,\n  138 |                                 Applicability::MachineApplicable,\n  139 |                             );\n  140 |                         },","lines":10,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/operators/op_ref.rs#L131-L140"},{"ref":"clippy_lints/src/operators/op_ref.rs:159-168","code":"  159 |                     span_lint_and_then(cx, OP_REF, e.span, \"taken reference of right operand\", |diag| {\n  160 |                         let mut applicability = Applicability::MachineApplicable;\n  161 |                         let (rsnip, _) = snippet_with_context(cx, r.span, e.span.ctxt(), \"...\", &mut applicability);\n  162 |                         diag.span_suggestion(\n  163 |                             right.span,\n  164 |                             \"use the right value directly\",\n  165 |                             rsnip,\n  166 |                             Applicability::MachineApplicable,\n  167 |                         );\n  168 |                     });","lines":10,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/operators/op_ref.rs#L159-L168"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`let mut packages = metadata.packages.clone();` deep-clones the entire package list (each `Package` is a large struct) just to sort it for `group_by`. The function only needs sorted references.","fix":"Sort a `Vec<&Package>` of references (`let mut packages: Vec<&Package> = metadata.packages.iter().collect(); packages.sort_by(...)`) instead of cloning the owned packages.","locations":[{"ref":"clippy_lints/src/cargo/multiple_crate_versions.rs:13-14","code":"   13 |     let mut packages = metadata.packages.clone();\n   14 |     packages.sort_by(|a, b| a.name.cmp(&b.name));","lines":2,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/cargo/multiple_crate_versions.rs#L13-L14"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"In `VarBindingVisitor::visit_stmt`, a `Let` statement's `init` expression is visited twice: once manually (so the let's own pattern bindings are still in `self.identifiers`), then again via `walk_stmt` -> `visit_local` -> `walk_local`, which re-walks the entire init subtree. The second visit is redundant work on every local in the trailing-statement scan.","fix":"In the `Let` case, after the manual init visit and binding removal, avoid `walk_stmt` re-visiting `init` (e.g. visit only the `els` block), instead of calling `walk_stmt` which re-walks `init`.","locations":[{"ref":"clippy_lints/src/matches/match_single_binding.rs:186-197","code":"  186 |     fn visit_stmt(&mut self, stmt: &'tcx Stmt<'tcx>) -> Self::Result {\n  187 |         if let StmtKind::Let(let_stmt) = stmt.kind {\n  188 |             if let Some(init) = let_stmt.init {\n  189 |                 self.visit_expr(init)?;\n  190 |             }\n  191 | \n  192 |             let_stmt.pat.each_binding(|_, _, _, ident| {\n  193 |                 self.identifiers.remove(&ident.name);\n  194 |             });\n  195 |         }\n  196 |         walk_stmt(self, stmt)\n  197 |     }","lines":12,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/matches/match_single_binding.rs#L186-L197"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`cx.tcx.hir_get_parent_item(expr.hir_id)` is called twice: line 82 (taking `.def_id`) and line 86, where the result re-runs the identical query and shadows the `parent_fn` binding with a different-typed value. One redundant query plus confusing reuse of the same name.","fix":"Bind the result once: `let parent_item = cx.tcx.hir_get_parent_item(expr.hir_id);` then use `parent_item.def_id` and pass `parent_item` to `trait_ref_of_method`.","locations":[{"ref":"clippy_lints/src/suspicious_trait_impl.rs:81-86","code":"   81 |             && let parent_fn = cx.tcx.hir_get_parent_item(expr.hir_id).def_id\n   82 |             && let hir::Node::ImplItem(impl_item) = cx.tcx.hir_node_by_def_id(parent_fn)\n   83 |             && let hir::ImplItemKind::Fn(_, body_id) = impl_item.kind\n   84 |             && let body = cx.tcx.hir_body(body_id)\n   85 |             && let parent_fn = cx.tcx.hir_get_parent_item(expr.hir_id)\n   86 |             && let Some(trait_ref) = trait_ref_of_method(cx, parent_fn)","lines":6,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/suspicious_trait_impl.rs#L81-L86"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`format!(\"{generic_snippet}\")` formats a snippet into a fresh `String` solely to clone the existing `Cow<str>`. This is an unnecessary allocation/format in the suggestion path.","fix":"Pass `generic_snippet` directly (it already implements `Display`/`Into<String>`), e.g. `generic_snippet.to_string()` or `generic_snippet.into_owned()`, instead of `format!(\"{generic_snippet}\")`.","locations":[{"ref":"clippy_lints/src/types/redundant_allocation.rs:32","code":"   32 |                 diag.span_suggestion(hir_ty.span, \"try\", format!(\"{generic_snippet}\"), applicability);","lines":1,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/types/redundant_allocation.rs#L32"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`find_assert_within_debug_assert` and `is_assert_arg` each call `cx.tcx.item_name(...)` (a query) inside a per-expression visitor closure, and `is_assert_arg` is invoked per expression from `find_assert_args_inner`'s walk. Repeatedly interning/looking up names during a full subtree walk is more expensive than necessary on assert-heavy code.","fix":"Compare resolved `DefId`s directly outside the per-expression closure rather than calling `item_name` per node.","locations":[{"ref":"clippy_utils/src/macros.rs:389-430","code":"  389 | fn find_assert_within_debug_assert<'a>(\n  390 |     cx: &LateContext<'_>,\n  391 |     expr: &'a Expr<'a>,\n  392 |     expn: ExpnId,\n  393 |     assert_name: Symbol,\n  394 | ) -> Option<(&'a Expr<'a>, ExpnId)> {\n  395 |     for_each_expr_without_closures(expr, |e| {\n  396 |         if !e.span.from_expansion() {\n  397 |             return ControlFlow::Continue(Descend::No);\n  398 |         }\n  399 |         let e_expn = e.span.ctxt().outer_expn();\n  400 |         if e_expn == expn {\n  401 |             ControlFlow::Continue(Descend::Yes)\n  402 |         } else if e_expn.expn_data().macro_def_id.map(|id| cx.tcx.item_name(id)) == Some(assert_name) {\n  403 |             ControlFlow::Break((e, e_expn))\n  404 |         } else {\n  405 |             ControlFlow::Continue(Descend::No)\n  406 |         }\n  407 |     })\n  408 | }\n  409 | \n  410 | fn is_assert_arg(cx: &LateContext<'_>, expr: &Expr<'_>, assert_expn: ExpnId) -> bool {\n  411 |     if !expr.span.from_expansion() {\n  412 |         return true;\n  413 |     }\n  414 |     let result = macro_backtrace(expr.span).try_for_each(|macro_call| {\n  415 |         if macro_call.expn == assert_expn {\n  416 |             ControlFlow::Break(false)\n  417 |         } else {\n  418 |             match cx.tcx.item_name(macro_call.def_id) {\n  419 |                 // `cfg!(debug_assertions)` in `debug_assert!`\n  420 |                 sym::cfg => ControlFlow::Continue(()),\n  421 |                 // assert!(other_macro!(..))\n  422 |                 _ => ControlFlow::Break(true),\n  423 |             }\n  424 |         }\n  425 |     });\n  426 |     match result {\n  427 |         ControlFlow::Break(is_assert_arg) => is_assert_arg,\n  428 |         ControlFlow::Continue(()) => true,\n  429 |     }\n  430 | }","lines":42,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_utils/src/macros.rs#L389-L430"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`position_before_rarrow` allocates a full `Vec<char>` of the entire string to walk backwards over whitespace, when it only inspects characters near the end. Additionally `rpos` is a byte offset from `rfind` but is used to index the `Vec<char>`, so on input with multibyte characters before the arrow it indexes the wrong element.","fix":"Walk backwards over the byte slice `s[..rpos]` (e.g. `char_indices().rev()` or `trim_end` on `&s[..rpos]`) to find the last non-whitespace position, avoiding both the allocation and the byte/char index mismatch.","locations":[{"ref":"clippy_utils/src/source.rs:475-490","code":"  475 | pub fn position_before_rarrow(s: &str) -> Option<usize> {\n  476 |     s.rfind(\"->\").map(|rpos| {\n  477 |         let mut rpos = rpos;\n  478 |         let chars: Vec<char> = s.chars().collect();\n  479 |         while rpos > 1 {\n  480 |             if let Some(c) = chars.get(rpos - 1)\n  481 |                 && c.is_whitespace()\n  482 |             {\n  483 |                 rpos -= 1;\n  484 |                 continue;\n  485 |             }\n  486 |             break;\n  487 |         }\n  488 |         rpos\n  489 |     })\n  490 | }","lines":16,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_utils/src/source.rs#L475-L490"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`str_literal_to_char_literal` computes `string.chars().count()` (a full pass over the string) in the non-ascii branch only to check `len == 1`. For long string literals this scans the whole string when it only needs to know whether there is exactly one char.","fix":"Use `let mut it = string.chars(); it.next().is_some() && it.next().is_none()` to stop after the second character.","locations":[{"ref":"clippy_utils/src/source.rs:790-795","code":"  790 |         && let len = if ascii_only {\n  791 |             string.len()\n  792 |         } else {\n  793 |             string.chars().count()\n  794 |         }\n  795 |         && len == 1","lines":6,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_utils/src/source.rs#L790-L795"}]},
{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`camel_case_split` allocates a `Vec<usize>` of byte offsets purely to iterate `windows(2)`, while `camel_case_indices` already allocates a `Vec<StrIndex>`. This is a second allocation and a redundant pass over the components on the string-name hot path used by `item_name_repetitions`.","fix":"Iterate the `StrIndex` vec pairwise directly and slice `s` without materializing a separate `Vec<usize>`.","locations":[{"ref":"clippy_utils/src/str_utils.rs:156-166","code":"  156 | pub fn camel_case_split(s: &str) -> Vec<&str> {\n  157 |     let mut offsets = camel_case_indices(s)\n  158 |         .iter()\n  159 |         .map(|e| e.byte_index)\n  160 |         .collect::<Vec<usize>>();\n  161 |     if offsets[0] != 0 {\n  162 |         offsets.insert(0, 0);\n  163 |     }\n  164 | \n  165 |     offsets.windows(2).map(|w| &s[w[0]..w[1]]).collect()\n  166 | }","lines":11,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_utils/src/str_utils.rs#L156-L166"}]},
{"id":"PERF_9","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In `DerefDelegate::borrow`, `cmt.place.projections.clone()` allocates a fresh `Vec` only to truncate it and iterate, on the suggestion-building path of `deref_closure_args`. The clone+truncate can be replaced by slicing.","fix":"Iterate `cmt.place.projections[..pos].iter().filter(|p| p.kind == ProjectionKind::Deref)` instead of cloning the projections vector.","locations":[{"ref":"clippy_utils/src/sugg.rs:1075-1084","code":" 1075 |                     if let Some(pos) = last_deref {\n 1076 |                         let mut projections = cmt.place.projections.clone();\n 1077 |                         projections.truncate(pos);\n 1078 | \n 1079 |                         for item in projections {\n 1080 |                             if item.kind == ProjectionKind::Deref {\n 1081 |                                 replacement_str = format!(\"*{replacement_str}\");\n 1082 |                             }\n 1083 |                         }\n 1084 |                     }","lines":10,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_utils/src/sugg.rs#L1075-L1084"}]},
{"id":"PERF_10","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`ParamBindingIdCollector::collect_binding_hir_ids` copies each collected `HirId` from a per-param finder into the aggregate vec one element at a time via a manual loop, instead of appending the whole vec. Needless per-element copy on a path run for every body checked by `are_params_used`.","fix":"Replace the inner `for hir_id in &finder.binding_hir_ids { hir_ids.push(*hir_id); }` with `hir_ids.append(&mut finder.binding_hir_ids);`.","locations":[{"ref":"clippy_utils/src/usage.rs:90-102","code":"   90 |     fn collect_binding_hir_ids(body: &'tcx hir::Body<'tcx>) -> Vec<HirId> {\n   91 |         let mut hir_ids: Vec<HirId> = Vec::new();\n   92 |         for param in body.params {\n   93 |             let mut finder = ParamBindingIdCollector {\n   94 |                 binding_hir_ids: Vec::new(),\n   95 |             };\n   96 |             finder.visit_param(param);\n   97 |             for hir_id in &finder.binding_hir_ids {\n   98 |                 hir_ids.push(*hir_id);\n   99 |             }\n  100 |         }\n  101 |         hir_ids\n  102 |     }","lines":13,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_utils/src/usage.rs#L90-L102"}]},
{"id":"PERF_11","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"In `build_manual_memcpy_suggestion`'s `print_offset`, the zero check is done by allocating a string and comparing `offset.to_string() == \"0\"`, instead of reusing the existing `MinifyingSugg::is_zero()` helper used elsewhere in the file.","fix":"Use `if offset.is_zero()` instead of `if offset.to_string() == \"0\"`.","locations":[{"ref":"clippy_lints/src/loops/manual_memcpy.rs:126-132","code":"  126 |     fn print_offset(offset: MinifyingSugg<'static>) -> MinifyingSugg<'static> {\n  127 |         if offset.to_string() == \"0\" {\n  128 |             sugg::EMPTY.into()\n  129 |         } else {\n  130 |             offset\n  131 |         }\n  132 |     }","lines":7,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/loops/manual_memcpy.rs#L126-L132"}]},
{"id":"PERF_12","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"`make_iterator_snippet` wraps an already-`Sugg` value in `format!(\"{}\", ...)`, producing a needless intermediate format pass/allocation.","fix":"Replace `format!(\"{}\", ...maybe_paren())` with `....maybe_paren().to_string()`.","locations":[{"ref":"clippy_lints/src/loops/utils.rs:273-277","code":"  273 |     if impls_iterator {\n  274 |         format!(\n  275 |             \"{}\",\n  276 |             sugg::Sugg::hir_with_applicability(cx, arg, \"_\", applicability).maybe_paren()\n  277 |         )","lines":5,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/loops/utils.rs#L273-L277"}]},
{"id":"PERF_13","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"In `is_method`, the `Closure` arm collects all closure params into a heap `Vec` (`collect::<Vec<_>>()`) on every call solely to pass a slice to the recursive call. For closures this allocates per filter predicate examined.","fix":"Collect into a `SmallVec`, or restructure `is_method` to accept an iterator, avoiding the per-call `Vec` allocation.","locations":[{"ref":"clippy_lints/src/methods/iter_filter.rs:97-102","code":"   97 |         ExprKind::Closure(&hir::Closure { body, .. }) => {\n   98 |             let body = cx.tcx.hir_body(body);\n   99 |             let closure_expr = peel_blocks(body.value);\n  100 |             let params = body.params.iter().map(|param| param.pat).collect::<Vec<_>>();\n  101 |             is_method(cx, closure_expr, type_symbol, method_name, params.as_slice())\n  102 |         },","lines":6,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/methods/iter_filter.rs#L97-L102"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"medium","difficulty":"easy","description":"The `then` block is matched with an or-pattern accepting either `stmts: [Stmt {..}], expr: None` or `stmts: [], expr: Some(ex)`, binding `ex` in both arms. But line 74 adds the guard `&& block.expr.is_none()`. For the second alternative `block.expr` is `Some(ex)`, so the guard is always false, making that arm dead: an `if` whose then-block is a tail expression `u += 1` (no trailing semicolon, valid since `u += 1` evaluates to `()`) is never linted. The or-pattern was clearly written to cover that case but the guard defeats half the matcher.","fix":"Remove the redundant `&& block.expr.is_none()` on line 74; the two block shapes are already fully described by the or-pattern and `ex` is bound from either the statement or the tail expression.","locations":[{"ref":"clippy_lints/src/implicit_saturating_add.rs:43-73","code":"   43 |         if let ExprKind::If(cond, then, None) = expr.kind\n   44 |             && let Some((c, op_node, l)) = get_const(cx, cond)\n   45 |             && let BinOpKind::Ne | BinOpKind::Lt = op_node\n   46 |             && let ExprKind::Block(block, None) = then.kind\n   47 |             && let Block {\n   48 |                 stmts:\n   49 |                     [\n   50 |                         Stmt {\n   51 |                             kind: StmtKind::Expr(ex) | StmtKind::Semi(ex),\n   52 |                             ..\n   53 |                         },\n   54 |                     ],\n   55 |                 expr: None,\n   56 |                 ..\n   57 |             }\n   58 |             | Block {\n   59 |                 stmts: [],\n   60 |                 expr: Some(ex),\n   61 |                 ..\n   62 |             } = block\n   63 |             && let ExprKind::AssignOp(op1, target, value) = ex.kind\n   64 |             && let ty = cx.typeck_results().expr_ty(target)\n   65 |             && Some(c) == get_int_max(ty)\n   66 |             && let ctxt = expr.span.ctxt()\n   67 |             && ex.span.ctxt() == ctxt\n   68 |             && cond.span.ctxt() == ctxt\n   69 |             && clippy_utils::SpanlessEq::new(cx).eq_expr(ctxt, l, target)\n   70 |             && AssignOpKind::AddAssign == op1.node\n   71 |             && let ExprKind::Lit(lit) = value.kind\n   72 |             && let LitKind::Int(Pu128(1), LitIntType::Unsuffixed) = lit.node\n   73 |             && block.expr.is_none()","lines":31,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/implicit_saturating_add.rs#L43-L73"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`self_type` (line 20) and `self_ty` (line 31) are computed by the identical expression `cx.typeck_results().expr_ty(self_expr)`, duplicating a typeck query and the binding for no reason.","fix":"Remove the `self_ty` binding and reuse `self_type` in the `has_non_owning_mutable_access(cx, self_type)` call.","locations":[{"ref":"clippy_lints/src/methods/double_ended_iterator_last.rs:20-32","code":"   20 |         && let self_type = cx.typeck_results().expr_ty(self_expr)\n   21 |         && implements_trait(cx, self_type.peel_refs(), deiter_id, &[])\n   22 |         // resolve the method definition\n   23 |         && let id = typeck.type_dependent_def_id(expr.hir_id).unwrap()\n   24 |         && let args = typeck.node_args(expr.hir_id)\n   25 |         && let Ok(Some(fn_def)) = Instance::try_resolve(cx.tcx, cx.typing_env(), id, args)\n   26 |         // find the provided definition of Iterator::last\n   27 |         && let Some(item) = cx.tcx.get_diagnostic_item(sym::Iterator)\n   28 |         && let Some(last_def) = cx.tcx.provided_trait_methods(item).find(|m| m.name() == sym::last)\n   29 |         // if the resolved method is the same as the provided definition\n   30 |         && fn_def.def_id() == last_def.def_id\n   31 |         && let self_ty = cx.typeck_results().expr_ty(self_expr)\n   32 |         && !has_non_owning_mutable_access(cx, self_ty)","lines":13,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/methods/double_ended_iterator_last.rs#L20-L32"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In the `else if` branch, `is_some` is necessarily `false` (the `if is_some` arm was already taken otherwise), so the ternary `if is_some { \"\" } else { \"!\" }` always evaluates to \"!\". The conditional is dead/redundant and misleadingly implies the `is_some` case is handled here.","fix":"Replace `if is_some { \"\" } else { \"!\" }` with the literal `\"!\"`.","locations":[{"ref":"clippy_lints/src/methods/unnecessary_get_then_check.rs:79","code":"   79 |                         format!(\"{}{caller_snippet}.{suggestion}\", if is_some { \"\" } else { \"!\" }),","lines":1,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/methods/unnecessary_get_then_check.rs#L79"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"The `local_used_in`/`local_used_after_expr` guard that prepends `&`/`&mut` to the eta-reduction suggestion is wrapped by a FIXME (lines 233-236) stating: `Do we really need this local_used_in check? ... currently nothing changes after deleting this check.` The author explicitly suspects this branch is dead/unnecessary and unverified by any test.","fix":"Add a regression test exercising a callee local used in args or after the expr, or remove the branch if confirmed unreachable.","locations":[{"ref":"clippy_lints/src/eta_reduction.rs:232-247","code":"  232 |                             if callee.res_local_id().is_some_and(|l| {\n  233 |                                 // FIXME: Do we really need this `local_used_in` check?\n  234 |                                 // Isn't it checking something like... `callee(callee)`?\n  235 |                                 // If somehow this check is needed, add some test for it,\n  236 |                                 // 'cuz currently nothing changes after deleting this check.\n  237 |                                 local_used_in(cx, l, args) || local_used_after_expr(cx, l, expr)\n  238 |                             }) {\n  239 |                                 match closure_kind {\n  240 |                                     // Mutable closure is used after current expr; we cannot consume it.\n  241 |                                     ClosureKind::FnMut => snippet = format!(\"&mut {snippet}\"),\n  242 |                                     ClosureKind::Fn if !callee_ty_raw.is_ref() => {\n  243 |                                         snippet = format!(\"&{snippet}\");\n  244 |                                     },\n  245 |                                     _ => (),\n  246 |                                 }\n  247 |                             }","lines":16,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/eta_reduction.rs#L232-L247"}]},
{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"Trailing commented-out call `//try_parse_contains(cx, cond_expr)` refers to a function that no longer exists in the file. Leftover noise.","fix":"Remove the commented-out fragment from the end of line 61.","locations":[{"ref":"clippy_lints/src/set_contains_or_insert.rs:60","code":"   60 |             && let Some((contains_expr, sym)) = try_parse_op_call(cx, cond_expr, sym::contains)//try_parse_contains(cx, cond_expr)","lines":1,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/set_contains_or_insert.rs#L60"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The comment 'Ignore the command result; we'll fall back to displaying the old metadata' precedes `expect_action(cargo_cmd().arg(\"collect-metadata\").status(), ...)`. `expect_action` panics on `Err`. `Command::status()` returns `Err` only when the process fails to spawn (e.g. cargo not on PATH). So a non-zero exit is ignored as the comment says, but a spawn failure crashes the whole serve loop rather than falling back to old metadata.","fix":"Either truly ignore the result (`let _ = cargo_cmd().arg(\"collect-metadata\").status();`) to match the comment, or correct the comment to state a spawn failure is fatal.","locations":[{"ref":"clippy_dev/src/serve.rs:28-33","code":"   28 |             // Ignore the command result; we'll fall back to displaying the old metadata.\n   29 |             let _ = expect_action(\n   30 |                 cargo_cmd().arg(\"collect-metadata\").status(),\n   31 |                 ErrAction::Run,\n   32 |                 \"cargo collect-metadata\",\n   33 |             );","lines":6,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_dev/src/serve.rs#L28-L33"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"Typo in the help message of `cast_slice_from_raw_parts::check_implicit_cast`: the help string is `\"replace_with\"` (with an underscore) instead of `\"replace with\"`, producing the awkward rendered help `replace_with: ...`. The sibling `check` function at line 53 correctly uses `\"replace with\"`.","fix":"Change `\"replace_with\"` to `\"replace with\"` to match line 53 and produce a grammatical help message.","locations":[{"ref":"clippy_lints/src/casts/cast_slice_from_raw_parts.rs:92","code":"   92 |             \"replace_with\",","lines":1,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/casts/cast_slice_from_raw_parts.rs#L92"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The `iter_over_hash_type` `Use instead` doc example does `let mut keys = my_map.keys().clone().collect::<Vec<_>>();`. `my_map.keys()` returns a `Keys` iterator; `.clone()` clones the iterator itself, which is a pointless no-op here since `.collect()` consumes it. The snippet teaches a misleading pattern.","fix":"Drop `.clone()`: `let mut keys = my_map.keys().collect::<Vec<_>>();` (use `.copied()` if owned keys are wanted).","locations":[{"ref":"clippy_lints/src/iter_over_hash_type.rs:25","code":"   25 |     ///     let mut keys = my_map.keys().clone().collect::<Vec<_>>();","lines":1,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/iter_over_hash_type.rs#L25"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"Variable `immutable` is bound to `src_ty.is_mutable_ptr()`, so it is `true` exactly when the source IS a mutable pointer - the opposite of what the name implies. The downstream `if immutable { \"\" } else { \"&mut \" }` is correct (a mutable ptr needs no extra `&mut`), so behavior is fine, but a future edit reading the name as 'is immutable' would invert the logic and introduce a bug.","fix":"Rename to `already_mut_ref` (true == already a `&mut`): `let already_mut_ref = src_ty.is_mutable_ptr();` and keep `if already_mut_ref { \"\" } else { \"&mut \" }`.","locations":[{"ref":"clippy_lints/src/methods/extend_with_drain.rs:20","code":"   20 |         && let immutable = src_ty.is_mutable_ptr()","lines":1,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/methods/extend_with_drain.rs#L20"},{"ref":"clippy_lints/src/methods/extend_with_drain.rs:37","code":"   37 |                 if immutable { \"\" } else { \"&mut \" },","lines":1,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/methods/extend_with_drain.rs#L37"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The diagnostic message renders the iterator method without its call parentheses: the format string interpolates `{method_name}` directly between two dots, producing `using `.iter.next()` on an array` / `.iter_mut.next()` instead of `.iter().next()`. Confirmed by the blessed test output. Misleading user-facing text.","fix":"Change the format strings to `using `.{method_name}().next()` ...`, then re-bless the test.","locations":[{"ref":"clippy_lints/src/methods/iter_next_slice.rs:65","code":"   65 |                 format!(\"using `.{method_name}.next()` on a Slice without end index\"),","lines":1,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/methods/iter_next_slice.rs#L65"},{"ref":"clippy_lints/src/methods/iter_next_slice.rs:78","code":"   78 |             format!(\"using `.{method_name}.next()` on an array\"),","lines":1,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/methods/iter_next_slice.rs#L78"}]},
{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The second `span_suggestion` help message says \"if this is intentional, consider using `Path::new`\" but the actual emitted replacement is `PathBuf::from(...)`. The message names a different API than the code it inserts (and `Path::new` would not even type-check as a replacement here since it returns `&Path`), which is confusing.","fix":"Change the message to \"if this is intentional, consider using `PathBuf::from`\" to match the emitted suggestion.","locations":[{"ref":"clippy_lints/src/methods/join_absolute_paths.rs:44-49","code":"   44 |                     .span_suggestion(\n   45 |                         expr_span,\n   46 |                         \"if this is intentional, consider using `Path::new`\",\n   47 |                         format!(\"PathBuf::from({arg_str})\"),\n   48 |                         Applicability::Unspecified,\n   49 |                     );","lines":6,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/methods/join_absolute_paths.rs#L44-L49"}]},
{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"The comment for `check_split_call_arg` is a verbatim copy-paste of the comment on `check_into_iter_call_arg`; it claims the function checks whether `expr` is an argument in an `into_iter` call, but this function handles `.split(...)` calls. Misleading for maintainers.","fix":"Rewrite the comment to describe the split case.","locations":[{"ref":"clippy_lints/src/methods/unnecessary_to_owned.rs:312-313","code":"  312 | /// Checks whether `expr` is an argument in an `into_iter` call and, if so, determines whether its\n  313 | /// call of a `to_owned`-like function is unnecessary.","lines":2,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/methods/unnecessary_to_owned.rs#L312-L313"}]},
{"id":"CMT_8","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The lint's documentation example silently changes the initializer body, misrepresenting what the suggestion does (the lint only swaps the wrapper type). The \"Bad\" block shows `static ref FOO: String = \"foo\".to_uppercase();` but \"Use instead\" shows `LazyLock::new(|| \"FOO\".to_lowercase())` - both the literal (\"foo\" -> \"FOO\") and the method (to_uppercase -> to_lowercase) were changed.","fix":"Keep the body identical, e.g. `LazyLock::new(|| \"foo\".to_uppercase())` in the FOO \"Use instead\" line.","locations":[{"ref":"clippy_lints/src/non_std_lazy_statics.rs:29-40","code":"   29 |     /// ### Example\n   30 |     /// ```ignore\n   31 |     /// lazy_static! {\n   32 |     ///     static ref FOO: String = \"foo\".to_uppercase();\n   33 |     /// }\n   34 |     /// static BAR: once_cell::sync::Lazy<String> = once_cell::sync::Lazy::new(|| \"BAR\".to_lowercase());\n   35 |     /// ```\n   36 |     /// Use instead:\n   37 |     /// ```ignore\n   38 |     /// static FOO: std::sync::LazyLock<String> = std::sync::LazyLock::new(|| \"FOO\".to_lowercase());\n   39 |     /// static BAR: std::sync::LazyLock<String> = std::sync::LazyLock::new(|| \"BAR\".to_lowercase());\n   40 |     /// ```","lines":12,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/non_std_lazy_statics.rs#L29-L40"}]},
{"id":"CMT_9","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"Malformed user-facing diagnostic text in REDUNDANT_COMPARISONS notes. The note format strings have a stray leading backtick before `if` and mismatched backticks around the snippet substitutions: `format!(\"`if `{rhs_str}` evaluates to true, {lhs_str}` will always evaluate to true as well\")`. This renders as e.g. `` `if `x > 5` evaluates to true, x > 4` will always... `` - leading backtick before `if`, and `{lhs_str}` has a closing backtick with no opening one. Line 101 has the identical defect with lhs/rhs swapped.","fix":"Rewrite as `format!(\"if `{rhs_str}` evaluates to true, `{lhs_str}` will always evaluate to true as well\")`: drop the leading backtick and balance the backticks around each snippet.","locations":[{"ref":"clippy_lints/src/operators/const_comparisons.rs:92","code":"   92 |                     format!(\"`if `{rhs_str}` evaluates to true, {lhs_str}` will always evaluate to true as well\"),","lines":1,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/operators/const_comparisons.rs#L92"},{"ref":"clippy_lints/src/operators/const_comparisons.rs:101","code":"  101 |                     format!(\"`if `{lhs_str}` evaluates to true, {rhs_str}` will always evaluate to true as well\"),","lines":1,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/operators/const_comparisons.rs#L101"}]},
{"id":"CMT_10","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The \"Use instead\" doc example shows `if set.insert(&value)` while the \"before\" example uses `set.insert(value)`. For a `HashSet<i32>`, `insert` takes the value by value, so `set.insert(&value)` would not compile. The example is misleading/incorrect.","fix":"Change the \"Use instead\" line to `if set.insert(value) {`.","locations":[{"ref":"clippy_lints/src/set_contains_or_insert.rs:30-41","code":"   30 |     /// if !set.contains(&value) {\n   31 |     ///     set.insert(value);\n   32 |     ///     println!(\"inserted {value:?}\");\n   33 |     /// }\n   34 |     /// ```\n   35 |     /// Use instead:\n   36 |     /// ```rust\n   37 |     /// use std::collections::HashSet;\n   38 |     /// let mut set = HashSet::new();\n   39 |     /// let value = 5;\n   40 |     /// if set.insert(&value) {\n   41 |     ///     println!(\"inserted {value:?}\");","lines":12,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/set_contains_or_insert.rs#L30-L41"}]},
{"id":"CMT_11","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The doc comment on `for_each_local_assignment` is copy-pasted from `for_each_local_use_after_expr` and says it runs the function for each path expression referencing the given local that occurs after a given expression. The function actually visits the RHS of every `Assign` whose LHS is the given local across the enclosing block (no 'after expr' notion, no 'path expression' semantics).","fix":"Rewrite to: 'Runs the given function for the right-hand side of each assignment to the given local within its enclosing block.'","locations":[{"ref":"clippy_utils/src/visitors.rs:796-797","code":"  796 | /// Runs the given function for each path expression referencing the given local which occur after\n  797 | /// the given expression.","lines":2,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_utils/src/visitors.rs#L796-L797"}]},
{"id":"CMT_12","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The doc comment on `LintInfo::location` says the format is `clippy_lints/src/absolute_paths.rs#43`, but the macro generates it with `concat!(file!(), \"#L\", line!())`, producing `...#L43` (note the `#L`). The example is stale versus what the code produces and what consumers (e.g. compile-test `id_location`) receive.","fix":"Update the doc example to `clippy_lints/src/absolute_paths.rs#L43`.","locations":[{"ref":"declare_clippy_lint/src/lib.rs:106","code":"  106 |     /// e.g. `clippy_lints/src/absolute_paths.rs#43`","lines":1,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/declare_clippy_lint/src/lib.rs#L106"},{"ref":"declare_clippy_lint/src/lib.rs:145","code":"  145 |             location: concat!(file!(), \"#L\", line!()),","lines":1,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/declare_clippy_lint/src/lib.rs#L145"}]},
{"id":"CMT_13","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"The comment on the space literal states it allows 'numbered list can have up to nine digits, plus the dot, plus four spaces on either side', implying a budget around 9+1+4 (or up to ~18), but the actual literal contains exactly 18 spaces and the indexing has no relation to '+four spaces on either side'. The comment misdescribes both the size and the layout of the buffer it documents.","fix":"Update the comment to reflect the real buffer size and how `indent` is bounded, or remove it once the indexing is made dynamic.","locations":[{"ref":"clippy_lints/src/doc/lazy_continuation.rs:13-14","code":"   13 |         // numbered list can have up to nine digits, plus the dot, plus four spaces on either side\n   14 |         super::Container::List(indent) => &\"                  \"[0..*indent],","lines":2,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/doc/lazy_continuation.rs#L13-L14"}]},
{"id":"CMT_14","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"Inside the `ExprKind::Match` arm of the entry-pass visitor, the comment says `.await` expression appears alongside map insertion in the same `then` or `else` block. This arm handles `match` expressions (`.await` desugars to a match), not `if`/`then`/`else`; the `then`/`else` wording was copied from the if-arm context and is misleading for a reader of the match-specific handling. The underlying logic is correct.","fix":"Reword to refer to the matched/awaited expression rather than `then`/`else` blocks.","locations":[{"ref":"clippy_lints/src/entry.rs:535-542","code":"  535 |                 ExprKind::Match(scrutinee_expr, arms, _) => {\n  536 |                     // If the map is a non-async-aware `MutexGuard` and\n  537 |                     // `.await` expression appears alongside map insertion in the same `then` or `else` block,\n  538 |                     // we cannot suggest using `entry()` because it would hold the lock across the await point,\n  539 |                     // triggering `await_holding_lock` and risking deadlock.\n  540 |                     if self.map_is_mutex_guard && desugar_await(expr).is_some() {\n  541 |                         self.can_use_entry = false;\n  542 |                     }","lines":8,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/entry.rs#L535-L542"}]},
{"id":"CMT_15","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"The lint message string is `\"unnecessary \\`>= y + 1\\` or \\`x - 1 >=\\`\"`. The second fragment `\\`x - 1 >=\\`` is truncated (missing the right-hand side) and the message omits the `<=` cases (`x + 1 <= y`, `x <= y - 1`) the lint also handles, so the user-facing diagnostic is garbled and incomplete.","fix":"Reword to a complete, symmetric message, e.g. `\"unnecessary \\`+ 1\\` or \\`- 1\\` in comparison; use \\`>\\` / \\`<\\` instead\"`.","locations":[{"ref":"clippy_lints/src/int_plus_one.rs:133","code":"  133 |             \"unnecessary `>= y + 1` or `x - 1 >=`\",","lines":1,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/int_plus_one.rs#L133"}]},
{"id":"CMT_16","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"Doc comments on the `indexed_indirectly` and `indexed_directly` fields read \"the extend is `None` for global\" - `extend` is a typo for `extent` (the `region::Scope`), which is misleading when reading the struct.","fix":"Fix the typo: change \"the extend is `None`\" to \"the extent is `None`\".","locations":[{"ref":"clippy_lints/src/loops/needless_range_loop.rs:239-244","code":"  239 |     /// indirectly indexed variables (`v[(i + 4) % N]`), the extend is `None` for global\n  240 |     indexed_indirectly: FxHashMap<Symbol, Option<region::Scope>>,\n  241 |     /// indirectly indexed literals, like `[1, 2, 3][(i + 4) % N]`\n  242 |     unnamed_indexed_indirectly: bool,\n  243 |     /// subset of `indexed` of vars that are indexed directly: `v[i]`\n  244 |     /// this will not contain cases like `v[calc_index(i)]` or `v[(i + 4) % N]`","lines":6,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/loops/needless_range_loop.rs#L239-L244"}]},
{"id":"CMT_17","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"In `check_is_some_is_none`, the comment 'We need to use `as_ref()` because `filter` takes a reference' references `filter`, but the suggestion produced is `is_some_and`/`is_none_or`, not `filter`. The comment is a stale copy-paste and is now misleading about why `as_ref()` is inserted.","fix":"Update the comment to reference the actual `is_some_and`/`is_none_or` rationale.","locations":[{"ref":"clippy_lints/src/methods/manual_is_variant_and.rs:332-338","code":"  332 |                 // We need to use `as_ref()` because `filter` takes a reference\n  333 |                 diag.span_suggestion(\n  334 |                     lint_span,\n  335 |                     \"use\",\n  336 |                     format!(\"{recv_snip}.as_ref().{method}({map_func_snip})\"),\n  337 |                     app,\n  338 |                 );","lines":7,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/methods/manual_is_variant_and.rs#L332-L338"}]},
{"id":"CMT_18","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"Garbled comparison-operator set in the BAD_BIT_MASK doc comment. The doc lists `<cmp_op>` as `{!=, >=, >, !=, >=, >}` - `!=`, `>=`, `>` are each duplicated and the set omits `==`, `<`, and `<=`, all of which `check_bit_mask` actually handles (see bit_mask.rs). The table just below (mod.rs:153-158) correctly references `==`/`!=`/`<`/`>=`/`>`/`<=`, contradicting line 148.","fix":"Replace the set with `{==, !=, <, <=, >, >=}`.","locations":[{"ref":"clippy_lints/src/operators/mod.rs:147","code":"  147 |     /// {`!=`, `>=`, `>`, `!=`, `>=`, `>`}) can be determined from the following","lines":1,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/operators/mod.rs#L147"}]},
