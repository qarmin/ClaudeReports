<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`map_container_to_text` indexes a fixed 18-space string literal with `&\"                  \"[0..*indent]` for `Container::List(indent)`. The `indent` value is computed in `doc/mod.rs` as `start.saturating_sub(range.start)` (the offset of the list item's content from the marker) and is not bounded to 18. A list item with a wide marker or deep indentation (e.g. content indented by 20+ spaces, or a numbered list with many digits plus spaces) yields `indent > 18`, so the slice is out of bounds and panics (ICE). The stale comment even claims the budget is only 'nine digits, plus the dot, plus four spaces on either side' but the literal holds 18 spaces, not enough for the documented worst case.","fix":"Build the indentation string dynamically, e.g. `\" \".repeat(*indent)` returning an owned String, or clamp/saturate the slice length with `&SPACES[0..(*indent).min(SPACES.len())]` after widening the literal. Do not index a fixed-width literal with an unbounded user-derived length.","locations":[{"ref":"clippy_lints/src/doc/lazy_continuation.rs:10-16","code":"   10 | fn map_container_to_text(c: &super::Container) -> &'static str {\n   11 |     match c {\n   12 |         super::Container::Blockquote => \"> \",\n   13 |         // numbered list can have up to nine digits, plus the dot, plus four spaces on either side\n   14 |         super::Container::List(indent) => &\"                  \"[0..*indent],\n   15 |     }\n   16 | }","lines":7,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/doc/lazy_continuation.rs#L10-L16"},{"ref":"clippy_lints/src/doc/mod.rs:1216-1229","code":" 1216 |                             refdefrange.start - range.start\n 1217 |                         } else {\n 1218 |                             let mut start = next_range.start;\n 1219 |                             if start > 0 && doc.as_bytes().get(start - 1) == Some(&b'\\\\') {\n 1220 |                                 // backslashes aren't in the event stream...\n 1221 |                                 start -= 1;\n 1222 |                             }\n 1223 | \n 1224 |                             start.saturating_sub(range.start)\n 1225 |                         }\n 1226 |                     } else {\n 1227 |                         0\n 1228 |                     };\n 1229 |                     containers.push(Container::List(indent));","lines":14,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/doc/mod.rs#L1216-L1229"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`metadata.packages[0]` indexes the first package unconditionally. For a virtual workspace manifest (a `Cargo.toml` with only `[workspace]` and no `[package]`), `cargo metadata --no-deps` can return an empty `packages` vector, so this indexing panics. Every other cargo lint in this directory iterates `&metadata.packages` safely; only this one indexes `[0]`.","fix":"Use `if let Some(package) = metadata.packages.first()` (or iterate, matching the other cargo lints) instead of `metadata.packages[0]`.","locations":[{"ref":"clippy_lints/src/cargo/wildcard_dependencies.rs:8-9","code":"    8 | pub(super) fn check(cx: &LateContext<'_>, metadata: &Metadata) {\n    9 |     for dep in &metadata.packages[0].dependencies {","lines":2,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/cargo/wildcard_dependencies.rs#L8-L9"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`get_captured_ids_recursive` calls `cx.tcx.hir_get_if_local(*def_id).unwrap()` on a closure DefId discovered inside an iterator type, then `can_move_expr_to_closure(cx, closure_expr).unwrap()`. The first unwrap can ICE when the closure DefId is non-local (a closure embedded in a type coming from another crate or a monomorphized generic). The second unwraps `None`, which `can_move_expr_to_closure` returns whenever it cannot prove the body movable. Iterator types like `Map<I, F>` routinely carry a closure `F`, so a body the analyzer declines triggers the ICE on otherwise-valid user code.","fix":"Replace both unwraps with graceful fallbacks: `if let Some(node) = cx.tcx.hir_get_if_local(*def_id)` and `if let Some(caps) = can_move_expr_to_closure(cx, closure_expr)`, treating the `None` cases as 'no captured ids'.","locations":[{"ref":"clippy_lints/src/methods/needless_collect.rs:763-774","code":"  763 |             ty::Closure(def_id, _) => {\n  764 |                 let closure_hir_node = cx.tcx.hir_get_if_local(*def_id).unwrap();\n  765 |                 if let Node::Expr(closure_expr) = closure_hir_node {\n  766 |                     can_move_expr_to_closure(cx, closure_expr)\n  767 |                         .unwrap()\n  768 |                         .into_iter()\n  769 |                         .for_each(|(hir_id, capture_kind)| {\n  770 |                             if matches!(capture_kind, CaptureKind::Ref(Mutability::Mut)) {\n  771 |                                 set.insert(hir_id);\n  772 |                             }\n  773 |                         });\n  774 |                 }","lines":12,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/methods/needless_collect.rs#L763-L774"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`iter_input_pats` does `(0..decl.inputs.len()).map(move |i| &body.params[i])`, assuming `decl.inputs.len() == body.params.len()`. On HIR where these differ (recovered/malformed functions, or desugarings where body params do not match declared inputs) the slice index panics and ICEs.","fix":"Iterate `body.params.iter()` directly, or `decl.inputs.iter().zip(body.params)` so the shorter side bounds the loop.","locations":[{"ref":"clippy_utils/src/lib.rs:1554-1556","code":" 1554 | pub fn iter_input_pats<'tcx>(decl: &FnDecl<'_>, body: &'tcx Body<'_>) -> impl Iterator<Item = &'tcx Param<'tcx>> {\n 1555 |     (0..decl.inputs.len()).map(move |i| &body.params[i])\n 1556 | }","lines":3,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_utils/src/lib.rs#L1554-L1556"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`PanicCall::parse` calls `path.segments.last().unwrap()` on a callee path. A `QPath::Resolved` path with zero segments panics. In practice resolved call paths have at least one segment, but this is an unchecked `unwrap` on user-derived HIR in a widely-used utility; a malformed/synthetic path would ICE.","fix":"Use `path.segments.last()?.ident.name` and return `None` if the path has no segments.","locations":[{"ref":"clippy_utils/src/macros.rs:297","code":"  297 |         let name = path.segments.last().unwrap().ident.name;","lines":1,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_utils/src/macros.rs#L297"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In `same_item_push::check`, `vec_ty.walk().nth(1).unwrap().expect_ty()` extracts the Vec element type. The `.unwrap()` assumes the walked type has a second component and `.expect_ty()` assumes it is a type arg (not a const/region). This holds for a well-formed `Vec<T>` reached via `get_vec_push`, but is brittle: any future change letting `vec` be non-`Vec`, or an unusual instantiation, turns this into an ICE.","fix":"Extract the element type defensively: `if let ty::Adt(_, args) = vec_ty.kind() && let Some(ty) = args.types().next()`, bailing out otherwise, instead of `walk().nth(1).unwrap().expect_ty()`.","locations":[{"ref":"clippy_lints/src/loops/same_item_push.rs:59-60","code":"   59 |         && let vec_ty = cx.typeck_results().expr_ty(vec)\n   60 |         && let ty = vec_ty.walk().nth(1).unwrap().expect_ty()","lines":2,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/loops/same_item_push.rs#L59-L60"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`map_clone::check` indexes `closure_body.params[0]` without verifying the closure has exactly one parameter. `map` is dispatched here, and a malformed closure with the wrong arity (e.g. user writes `.map(|| 5)`, a type error that still produces valid HIR which clippy lints over) makes this index out of bounds and ICE. Other closure handlers in this directory guard arity with `let [param] = body.params else { return; }`.","fix":"Match the param list before indexing: `let [param] = closure_body.params else { return; };` and use `param.pat.kind`.","locations":[{"ref":"clippy_lints/src/methods/map_clone.rs:53","code":"   53 |                 match closure_body.params[0].pat.kind {","lines":1,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/methods/map_clone.rs#L53"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`inputs[arg_idx]` indexes the callee's input-type slice with an index derived from the call's argument position (incremented by 1 for method calls). For a variadic extern fn, `fn_sig().inputs()` excludes the `...` part, so a `collect()` result passed in a variadic position yields `arg_idx >= inputs.len()` and an out-of-bounds panic/ICE. Unlikely but unguarded.","fix":"Use `inputs.get(arg_idx)` and `return` early if it is `None` instead of direct indexing.","locations":[{"ref":"clippy_lints/src/methods/needless_collect.rs:220","code":"  220 |                 .any(|ty| ty == inputs[arg_idx])","lines":1,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/methods/needless_collect.rs#L220"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`recv.span.get_text(cx).unwrap()` panics if the source text for the receiver span cannot be retrieved. `get_text` returns `None` for spans whose source is inaccessible (e.g. a receiver originating from a macro expansion while the outer `as_deref()`/`as_deref_mut()` call site is real source, so the crate-level `from_expansion()` guard does not protect it). Every other lint here uses `snippet`/`snippet_with_applicability`, which fall back to a placeholder.","fix":"Guard the result: `let Some(text) = recv.span.get_text(cx) else { return; };` then suggest `text.to_owned()`, or use `snippet(cx, recv.span, \"..\")`.","locations":[{"ref":"clippy_lints/src/methods/needless_option_as_deref.rs:35","code":"   35 |             recv.span.get_text(cx).unwrap().to_owned(),","lines":1,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/methods/needless_option_as_deref.rs#L35"}]},
{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In the `PTR_ARG` suggestion builder, `r.self_span.get_text(cx).unwrap()` unwraps the source text of the method-call receiver span. `get_text` returns `Option`, and unwrapping inside the diagnostic closure will ICE if the span has no recoverable source text (e.g. spans touched by macro/desugaring edge cases). The rest of the file handles `get_text` fallibly (see DerefTyDisplay).","fix":"Handle the `None` case: fall back to a placeholder or skip emitting the per-usage replacement when `get_text` returns `None`, rather than `.unwrap()`.","locations":[{"ref":"clippy_lints/src/ptr/ptr_arg.rs:53-60","code":"   53 |                 iter::once((args.span, format!(\"{}{}\", args.ref_prefix, args.deref_ty.display(cx))))\n   54 |                     .chain(result.replacements.iter().map(|r| {\n   55 |                         (\n   56 |                             r.expr_span,\n   57 |                             format!(\"{}{}\", r.self_span.get_text(cx).unwrap(), r.replacement),\n   58 |                         )\n   59 |                     }))\n   60 |                     .collect(),","lines":8,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/ptr/ptr_arg.rs#L53-L60"}]},
{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`walk_span_to_context(init.span, local.span.ctxt()).unwrap()` unwraps the result of walking a span to a context. While usually `Some`, `walk_span_to_context` returns `Option` and can yield `None` for spans in mismatched hygiene contexts, which would ICE inside the diagnostic closure.","fix":"Bind with `let Some(init_new_span) = walk_span_to_context(init.span, local.span.ctxt()) else { return; };` and bail out of the suggestion instead of `.unwrap()`.","locations":[{"ref":"clippy_lints/src/unit_types/let_unit_value.rs:77","code":"   77 |                     let init_new_span = walk_span_to_context(init.span, local.span.ctxt()).unwrap();","lines":1,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/unit_types/let_unit_value.rs#L77"}]},
{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In `UnnecessaryDefPath::check_expr`, each path segment is const-evaluated and if a segment cannot be resolved/const-evaluated the code calls `panic!(\"failed to resolve path {:?}\", expr.span)`. This is inside a lint pass, so a `type_path!`/`value_path!` invocation whose segment const cannot be const-evaluated (e.g. due to an error elsewhere) would ICE the compiler rather than skipping. The sibling code in `symbols.rs` handles the identical `const_eval_poly` + `to_u32` case gracefully with `if let Ok(...)`/`discard_err()`, making this panic inconsistent.","fix":"Replace the `panic!` with an early `return` / skip (use `if let` and bail), mirroring the graceful handling in `symbols.rs`.","locations":[{"ref":"clippy_lints_internal/src/unnecessary_def_path.rs:53-65","code":"   53 |             let path: Vec<Symbol> = segments\n   54 |                 .iter()\n   55 |                 .map(|segment| {\n   56 |                     if let Some(const_def_id) = segment.res(cx).opt_def_id()\n   57 |                         && let Ok(ConstValue::Scalar(value)) = cx.tcx.const_eval_poly(const_def_id)\n   58 |                         && let Some(value) = value.to_u32().discard_err()\n   59 |                     {\n   60 |                         Symbol::new(value)\n   61 |                     } else {\n   62 |                         panic!(\"failed to resolve path {:?}\", expr.span);\n   63 |                     }\n   64 |                 })\n   65 |                 .collect();","lines":13,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints_internal/src/unnecessary_def_path.rs#L53-L65"}]},
{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`hash_pat` has `PatKind::Missing => unreachable!()` with no message. `PatKind::Missing` is produced for omitted parameter patterns; if a `Missing` pattern is ever hashed (e.g. via SpanlessHash over a body with a recovered/omitted param) clippy ICEs instead of producing a stable hash.","fix":"Hash the discriminant only (the `mem::discriminant` is already hashed on line 1458) and return for `PatKind::Missing` instead of `unreachable!()`, or add a message and a graceful release-build fallback.","locations":[{"ref":"clippy_utils/src/hir_utils.rs:1455-1458","code":" 1455 |     pub fn hash_pat(&mut self, pat: &Pat<'_>) {\n 1456 |         mem::discriminant(&pat.kind).hash(&mut self.s);\n 1457 |         match &pat.kind {\n 1458 |             PatKind::Missing => unreachable!(),","lines":4,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_utils/src/hir_utils.rs#L1455-L1458"}]},
{"id":"PANIC_14","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`is_refutable` has `PatKind::Missing => unreachable!()` with no context message. If reached with an omitted/recovered parameter pattern it ICEs rather than degrading gracefully.","fix":"Return a sensible default (e.g. `false`) for `PatKind::Missing`, or add a message and `debug_assert!` so release builds do not ICE.","locations":[{"ref":"clippy_utils/src/lib.rs:1490","code":" 1490 |         PatKind::Missing => unreachable!(),","lines":1,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_utils/src/lib.rs#L1490"}]},
{"id":"PANIC_15","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`if_sequence` calls `panic!(\"ExprKind::If node is not an ExprKind::Block\")` when an `if` then-branch is not a block. This is a hard panic in shared utility code; any future HIR/desugaring change turns into an ICE rather than a skipped lint.","fix":"Replace the `panic!` with a graceful `break` (returning conds/blocks collected so far) or a `debug_assert!` plus break.","locations":[{"ref":"clippy_utils/src/lib.rs:1722-1726","code":" 1722 |         if let ExprKind::Block(block, _) = then.kind {\n 1723 |             blocks.push(block);\n 1724 |         } else {\n 1725 |             panic!(\"ExprKind::If node is not an ExprKind::Block\");\n 1726 |         }","lines":5,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_utils/src/lib.rs#L1722-L1726"}]},
{"id":"PANIC_16","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`is_slice_of_primitives` uses `expr_type.peel_refs().walk().nth(1).unwrap().expect_ty()` and `refs_peeled.walk().last().unwrap()`. These rely on the walked type having the expected structure after `is_primitive`. If the structure does not match (unusual primitive/wrapper combination), `nth(1)` returns `None` / `expect_ty` fails and it ICEs in hot shared code.","fix":"Match on the walked `GenericArg` instead of unwrapping; return `None` when the element type cannot be extracted.","locations":[{"ref":"clippy_utils/src/lib.rs:2169","code":" 2169 |         match expr_type.peel_refs().walk().nth(1).unwrap().expect_ty().kind() {","lines":1,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_utils/src/lib.rs#L2169"},{"ref":"clippy_utils/src/lib.rs:2177","code":" 2177 |                 return Some(refs_peeled.walk().last().unwrap().to_string());","lines":1,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_utils/src/lib.rs#L2177"}]},
{"id":"PANIC_17","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`group_digits` computes `digits.clone().count() - 1` when `partial_group_first` is true; an empty digit iterator underflows and panics. Current callers feed only lexer-validated literals so the empty case is not reachable today, but `NumericLiteral::new`/`format` are public APIs with no such guarantee, so a malformed input ICEs instead of degrading gracefully.","fix":"Guard the empty case, e.g. `let n = digits.clone().count(); if n == 0 { return; }` (or use `checked_sub`).","locations":[{"ref":"clippy_utils/src/numeric_literal.rs:205-206","code":"  205 |         if partial_group_first {\n  206 |             first_group_size = (digits.clone().count() - 1) % group_size + 1;","lines":2,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_utils/src/numeric_literal.rs#L205-L206"}]},
{"id":"PANIC_18","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`line_span` calls `sm.source_map().lookup_line(span.lo()).unwrap()`. `lookup_line` returns `Err` for a position in a file with no source lines (empty/zero-length virtual file). `line_span` feeds `indent_of`, `snippet_indent`, and `first_char_in_first_line`, reached from many lints on possibly synthetic spans, so an `Err` ICEs.","fix":"Return the original span (or an `Option`) when `lookup_line` returns `Err` instead of `unwrap()`.","locations":[{"ref":"clippy_utils/src/source.rs:421-427","code":"  421 | fn line_span<'sm>(sm: impl HasSourceMap<'sm>, span: Span) -> Span {\n  422 |     let span = original_sp(span, DUMMY_SP);\n  423 |     let SourceFileAndLine { sf, line } = sm.source_map().lookup_line(span.lo()).unwrap();\n  424 |     let line_start = sf.lines()[line];\n  425 |     let line_start = sf.absolute_position(line_start);\n  426 |     span.with_lo(line_start)\n  427 | }","lines":7,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_utils/src/source.rs#L421-L427"}]},
{"id":"PANIC_19","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`snippet_with_context_sm` calls `span.parent_callsite().unwrap()` when `span.desugaring_kind() == Some(DesugaringKind::RangeExpr)`, assuming a range-desugaring span always has a parent callsite. A malformed/synthetic range span lacking a parent callsite would ICE.","fix":"Guard with `if let Some(parent) = span.parent_callsite() && parent.ctxt() == outer`, falling through to the normal path otherwise.","locations":[{"ref":"clippy_utils/src/source.rs:694","code":"  694 |     if span.desugaring_kind() == Some(DesugaringKind::RangeExpr) && span.parent_callsite().unwrap().ctxt() == outer {","lines":1,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_utils/src/source.rs#L694"}]},
{"id":"PANIC_20","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`trim_span` computes `data.lo - sf.start_pos` and indexes the source. If `data.lo < sf.start_pos` (a span whose lo precedes the looked-up source file start, possible with malformed/cross-file spans), `BytePos` subtraction underflows and panics in debug builds.","fix":"Use checked/saturating conversion or verify `data.lo >= sf.start_pos && data.hi >= sf.start_pos` before subtracting, returning `span` otherwise.","locations":[{"ref":"clippy_utils/src/source.rs:749-767","code":"  749 | pub fn trim_span(sm: &SourceMap, span: Span) -> Span {\n  750 |     let data = span.data();\n  751 |     let sf: &_ = &sm.lookup_source_file(data.lo);\n  752 |     let Some(src) = sf.src.as_deref() else {\n  753 |         return span;\n  754 |     };\n  755 |     let Some(snip) = &src.get((data.lo - sf.start_pos).to_usize()..(data.hi - sf.start_pos).to_usize()) else {\n  756 |         return span;\n  757 |     };\n  758 |     let trim_start = snip.len() - snip.trim_start().len();\n  759 |     let trim_end = snip.len() - snip.trim_end().len();\n  760 |     SpanData {\n  761 |         lo: data.lo + BytePos::from_usize(trim_start),\n  762 |         hi: data.hi - BytePos::from_usize(trim_end),\n  763 |         ctxt: data.ctxt,\n  764 |         parent: data.parent,\n  765 |     }\n  766 |     .span()\n  767 | }","lines":19,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_utils/src/source.rs#L749-L767"}]},
{"id":"PANIC_21","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"After downloading, `if crates.is_empty()` reports the error with `config.only.unwrap()`. But `crates` can be empty for reasons unrelated to `--only` (e.g. an empty/misconfigured sources TOML, or all crates filtered out). In those cases `config.only` is `None` and `.unwrap()` panics with a misleading message instead of reporting the real problem.","fix":"Branch on `config.only`: if `Some(name)` report the missing crate, otherwise print a generic 'no crates to check' message and exit.","locations":[{"ref":"lintcheck/src/main.rs:381-387","code":"  381 |     if crates.is_empty() {\n  382 |         eprintln!(\n  383 |             \"ERROR: could not find crate '{}' in lintcheck/lintcheck_crates.toml\",\n  384 |             config.only.unwrap(),\n  385 |         );\n  386 |         std::process::exit(1);\n  387 |     }","lines":7,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/lintcheck/src/main.rs#L381-L387"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"In `fmt_conf`, the attribute-nesting depth counter can underflow. `State::Attr(0)` with a `CloseBracket` is handled at line 127, but `State::Attr(0)` with a `CloseParen` or `CloseBrace` falls through to the generic arm and computes `State::Attr(x - 1)` with `x == 0`, panicking on `u32` underflow in debug builds (this dev binary is built in debug). Requires a malformed/unbalanced attribute in `conf.rs`, so it produces a confusing panic instead of the intended parse-error diagnostic.","fix":"Guard the decrement, e.g. `State::Attr(x.saturating_sub(1))`, or route any depth-0 `CloseParen`/`CloseBrace` to the parse-error arm.","locations":[{"ref":"clippy_dev/src/fmt.rs:126-135","code":"  126 |             (State::Attr(0), TokenKind::CloseBracket) => {\n  127 |                 attrs_end = i + 1;\n  128 |                 state = State::Docs;\n  129 |             },\n  130 |             (State::Attr(x), TokenKind::OpenParen | TokenKind::OpenBracket | TokenKind::OpenBrace) => {\n  131 |                 state = State::Attr(x + 1);\n  132 |             },\n  133 |             (State::Attr(x), TokenKind::CloseParen | TokenKind::CloseBracket | TokenKind::CloseBrace) => {\n  134 |                 state = State::Attr(x - 1);\n  135 |             },","lines":10,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_dev/src/fmt.rs#L126-L135"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"`doc.as_bytes().get(start - 1)` computes `start - 1` in `usize` where `start = i + range.start` can be `0` (a `[` at the very start of the doc text). When `start == 0`, `start - 1` underflows; with overflow checks this panics, otherwise it wraps to `usize::MAX` (the `.get` then returns `None`, silently changing behavior). The equivalent code in `doc/mod.rs:1312` explicitly guards this exact case with a comment noting the underflow risk, so this site is an inconsistent, unguarded copy.","fix":"Guard the index like mod.rs does: `&& (start == 0 || doc.as_bytes().get(start - 1) != Some(&b'\\\\'))`, or use `start.checked_sub(1).map_or(true, |p| doc.as_bytes().get(p) != Some(&b'\\\\'))`.","locations":[{"ref":"clippy_lints/src/doc/doc_suspicious_footnotes.rs:19-23","code":"   19 |         let start = i + range.start;\n   20 |         if doc.as_bytes().get(start + 1) == Some(&b'^')\n   21 |             && let Some(end) = all_numbers_upto_brace(doc, start + 2)\n   22 |             && doc.as_bytes().get(end) != Some(&b':')\n   23 |             && doc.as_bytes().get(start - 1) != Some(&b'\\\\')","lines":5,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/doc/doc_suspicious_footnotes.rs#L19-L23"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"In `is_array_length_equal_to_range`, `end_value - start_value` subtracts two raw u128 literal values extracted from user source with no ordering check. A reversed range literal such as `for i in 5..3 { dst[i] = src[i]; }` (start=5, end=3) underflows and panics in a debug build of clippy (ICE). The values come straight from `extract_lit_value` on user literals, so this is reachable.","fix":"Use `end_value.checked_sub(start_value)` and bail out (`_ => return false`) on `None`.","locations":[{"ref":"clippy_lints/src/loops/manual_memcpy.rs:506-509","code":"  506 |         let range = match (extract_lit_value(start), extract_lit_value(end)) {\n  507 |             (Some(start_value), Some(end_value)) => end_value - start_value,\n  508 |             _ => return false,\n  509 |         };","lines":4,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/loops/manual_memcpy.rs#L506-L509"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"The coverage loop `while num <= max.val { ... num += 1 ... }` increments `num: i128` unconditionally when a found value is hit. `expr_as_i128` accepts any literal that fits in i128, including exactly `i128::MAX` (line 46: `i128::try_from(num.get()).ok()?`). If `max.val == i128::MAX`, then when `num` reaches `i128::MAX` and is in `numbers_found`, `num += 1` (line 124) overflows: panic (ICE) in a debug build of clippy, wrap-around to i128::MIN in release causing an incorrect/looping lint. Triggerable by an OR-pattern containing i128::MAX and two neighbors on a 128-bit-typed scrutinee. The `range.end() + 1` on line 134 has the same risk.","fix":"Use checked arithmetic and break on overflow, e.g. `let Some(next) = num.checked_add(1) else { break }; num = next;`, and likewise guard `range.end().checked_add(1)`.","locations":[{"ref":"clippy_lints/src/manual_range_patterns.rs:120-137","code":"  120 |             let mut num = min.val;\n  121 |             while num <= max.val {\n  122 |                 if numbers_found.contains(&num) {\n  123 |                     num += 1;\n  124 |                 }\n  125 |                 // Given a list of (potentially overlapping) ranges like:\n  126 |                 // 1..=5, 3..=7, 6..=10\n  127 |                 // We want to find the range with the highest end that still contains the current number\n  128 |                 else if let Some(range) = ranges_found\n  129 |                     .iter()\n  130 |                     .filter(|range| range.contains(&num))\n  131 |                     .max_by_key(|range| range.end())\n  132 |                 {\n  133 |                     num = range.end() + 1;\n  134 |                 } else {\n  135 |                     return;\n  136 |                 }\n  137 |             }","lines":18,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/manual_range_patterns.rs#L120-L137"},{"ref":"clippy_lints/src/manual_range_patterns.rs:40-45","code":"   40 | fn expr_as_i128(expr: &PatExpr<'_>) -> Option<i128> {\n   41 |     if let PatExprKind::Lit { lit, negated } = expr.kind\n   42 |         && let LitKind::Int(num, _) = lit.node\n   43 |     {\n   44 |         // Intentionally not handling numbers greater than i128::MAX (for u128 literals) for now.\n   45 |         let n = i128::try_from(num.get()).ok()?;","lines":6,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/manual_range_patterns.rs#L40-L45"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"In identity_op's `check_remainder`, signed full-int operands are compared with `lv.abs() < rv.abs()` where `lv`/`rv` are `i128`. For an expression like `i128::MIN % 5`, `lv == i128::MIN` and `i128::MIN.abs()` overflows: it panics in an overflow-checks build of clippy and silently wraps to `i128::MIN` (negative) otherwise, making the magnitude comparison nonsensical. `rv.abs()` has the same exposure for `_ % i128::MIN`.","fix":"Use total operations: `lv.unsigned_abs() < rv.unsigned_abs()` (both `u128`), which never overflows and gives the intended magnitude comparison.","locations":[{"ref":"clippy_lints/src/operators/identity_op.rs:194-200","code":"  194 |     if match (ecx.eval_full_int(left, ctxt), ecx.eval_full_int(right, ctxt)) {\n  195 |         (Some(FullInt::S(lv)), Some(FullInt::S(rv))) => lv.abs() < rv.abs(),\n  196 |         (Some(FullInt::U(lv)), Some(FullInt::U(rv))) => lv < rv,\n  197 |         _ => return,\n  198 |     } {\n  199 |         span_ineffective_operation(cx, span, arg, Parens::Unneeded, false);\n  200 |     }","lines":7,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/operators/identity_op.rs#L194-L200"}]},
{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"In `const_eval_duration`, the `from_days` and `from_weeks` arms compute the duration via an explicit multiplication in clippy's own arithmetic: `from_hours(days * 24)` and `from_hours(weeks * 24 * 7)`, where `days`/`weeks` are `u64` parsed directly from a user literal. For large literals (e.g. `Duration::from_days(u64::MAX)`) the multiplication overflows: panic in a debug build of clippy, wrong wrapped value in release leading to an incorrect UNCHECKED_TIME_SUBTRACTION decision.","fix":"Use checked multiplication and bail on overflow, e.g. `from_hours(days.checked_mul(24)?)` and `from_hours(weeks.checked_mul(24 * 7)?)` (adapting the macro to allow `?` in the constructor arg, or via an explicit let).","locations":[{"ref":"clippy_lints/src/time_subtraction.rs:248-253","code":"  248 |             sym::from_days => {\n  249 |                 try_parse_duration! { (days: Int(u64)) -> from_hours(days * 24) }\n  250 |             },\n  251 |             sym::from_weeks => {\n  252 |                 try_parse_duration! { (weeks: Int(u64)) -> from_hours(weeks * 24 * 7) }\n  253 |             },","lines":6,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/time_subtraction.rs#L248-L253"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`add_ampersand_if_copy` inserts `&` at byte index 1 of `body_str`, assuming the string always begins with a closure pipe `|`. But `check_with` (manual_utils.rs lines 129-134) can produce a bare function-path body via the `can_pass_as_func` shortcut. For manual_filter, `get_cond_expr` makes the if-condition the `some_expr.expr`; a condition of the form `is_even(x)` collapses to just the function name `is_even`. When the scrutinee is `Copy`, `add_ampersand_if_copy` then turns `\"is_even\"` into `\"i&s_even\"`, emitting a broken `filter(i&s_even)` suggestion. The applicability is MachineApplicable, so it can be auto-applied to produce uncompilable code. (Note: the same `can_pass_as_func` path also bypasses the `needs_negated` handling that `to_snippet_with_context` would apply, a second correctness problem for manual_filter.)","fix":"Do not mutate `body_str` by byte index. Suppress the `can_pass_as_func` shortcut for the manual_filter caller (where prepending `&` is invalid and negation is needed), or thread the 'needs `&`' decision into `check_with` so the `&` is inserted right before the binding in the closure-form branch only.","locations":[{"ref":"clippy_lints/src/matches/manual_filter.rs:81-89","code":"   81 | fn add_ampersand_if_copy(body_str: String, has_copy_trait: bool) -> String {\n   82 |     if has_copy_trait {\n   83 |         let mut with_ampersand = body_str;\n   84 |         with_ampersand.insert(1, '&');\n   85 |         with_ampersand\n   86 |     } else {\n   87 |         body_str\n   88 |     }\n   89 | }","lines":9,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/matches/manual_filter.rs#L81-L89"},{"ref":"clippy_lints/src/matches/manual_filter.rs:211","code":"  211 |         let body_str = add_ampersand_if_copy(sugg_info.body_str, sugg_info.scrutinee_impl_copy);","lines":1,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/matches/manual_filter.rs#L211"},{"ref":"clippy_lints/src/matches/manual_utils.rs:129-151","code":"  129 |     let body_str = if let PatKind::Binding(annotation, id, some_binding, None) = some_pat.kind {\n  130 |         if !some_expr.needs_unsafe_block\n  131 |             && let Some(func) = can_pass_as_func(cx, id, some_expr.expr)\n  132 |             && func.span.eq_ctxt(some_expr.expr.span)\n  133 |         {\n  134 |             snippet_with_applicability(cx, func.span, \"..\", &mut app).into_owned()\n  135 |         } else {\n  136 |             if some_expr.expr.res_local_id() == Some(id)\n  137 |                 && !is_lint_allowed(cx, MATCH_AS_REF, expr.hir_id)\n  138 |                 && binding_ref.is_some()\n  139 |             {\n  140 |                 return None;\n  141 |             }\n  142 | \n  143 |             // `ref` and `ref mut` annotations were handled earlier.\n  144 |             let annotation = if matches!(annotation, BindingMode::MUT) {\n  145 |                 \"mut \"\n  146 |             } else {\n  147 |                 \"\"\n  148 |             };\n  149 | \n  150 |             format!(\"|{annotation}{some_binding}| {closure_body}\")\n  151 |         }","lines":23,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/matches/manual_utils.rs#L129-L151"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In `is_non_freeze_init_borrowed`, the recursive call passes `init_typeck` (the constant's definition-site `TypeckResults`, per the doc comment at lines 567-568) together with `src_expr` (a use-site expression). But `is_non_freeze_val_borrowed` (signature at line 489) immediately calls `typeck.expr_ty(src_expr)`, `typeck.expr_adjustments(src_expr)` and walks `hir_parent_iter(src_expr.hir_id)` on the passed typeck. `TypeckResults` are keyed per-body, so querying use-site HIR nodes against the definition-site typeck yields wrong type/adjustment data or panics with a node-not-found / hir-id-owner ICE. Every other call site (lines 540, 628, 676, 701, 866) correctly pairs the use-site `typeck` with `src_expr`; only line 613 uses `init_typeck`. The sibling fallback at line 628 in the same function uses `typeck` correctly.","fix":"Change `init_typeck` to `typeck` (the use-site parameter in scope) in the call on line 613.","locations":[{"ref":"clippy_lints/src/non_copy_const.rs:610-611","code":"  610 |                                 ) && let Ok(res) =\n  611 |                                     self.is_non_freeze_val_borrowed(tcx, typing_env, init_typeck, src_expr, val) =>","lines":2,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/non_copy_const.rs#L610-L611"},{"ref":"clippy_lints/src/non_copy_const.rs:487-496","code":"  487 |     fn is_non_freeze_val_borrowed(\n  488 |         &mut self,\n  489 |         tcx: TyCtxt<'tcx>,\n  490 |         typing_env: TypingEnv<'tcx>,\n  491 |         typeck: &'tcx TypeckResults<'tcx>,\n  492 |         mut src_expr: &'tcx Expr<'tcx>,\n  493 |         mut val: ConstValue,\n  494 |     ) -> Result<Option<BorrowSource<'tcx>>, ()> {\n  495 |         let mut parents = tcx.hir_parent_iter(src_expr.hir_id);\n  496 |         let mut ty = typeck.expr_ty(src_expr);","lines":10,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/non_copy_const.rs#L487-L496"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`Meet for Certainty` is incorrect when one side is `Contradiction`. The catch-all arm `(Certain(inner), _) | (_, Certain(inner)) => Certain(inner)` is reached for `(Certain, Contradiction)` and `(Contradiction, Certain)` (the `Uncertain` and `(Certain,Certain)` arms above did not match), so `meet(Certain(x), Contradiction) == Certain(x)`, silently swallowing a contradiction. `join` propagates `Contradiction` first. A meet that drops a known contradiction can upgrade a contradictory type-heuristic result to `Certain`, violating the module invariant that claiming false certainty is a bug.","fix":"Handle `Contradiction` explicitly before the catch-all, e.g. `(Certainty::Contradiction, _) | (_, Certainty::Contradiction) => Certainty::Contradiction,`, or deliberately document why a contradiction is absorbed.","locations":[{"ref":"clippy_utils/src/ty/type_certainty/certainty.rs:45-53","code":"   45 | impl Meet for Certainty {\n   46 |     fn meet(self, other: Self) -> Self {\n   47 |         match (self, other) {\n   48 |             (Certainty::Uncertain, _) | (_, Certainty::Uncertain) => Certainty::Uncertain,\n   49 |             (Certainty::Certain(lhs), Certainty::Certain(rhs)) => Certainty::Certain(lhs.meet(rhs)),\n   50 |             (Certainty::Certain(inner), _) | (_, Certainty::Certain(inner)) => Certainty::Certain(inner),\n   51 |             (Certainty::Contradiction, Certainty::Contradiction) => Certainty::Contradiction,\n   52 |         }\n   53 |     }","lines":9,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_utils/src/ty/type_certainty/certainty.rs#L45-L53"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"manual_dangling_ptr's `is_literal_aligned` accepts ANY literal value that is `<= align` (`u128::from(val) <= align`), not only `val == align`. But the MachineApplicable suggestion replaces `N as *const T` with `ptr::dangling::<T>()`, whose address equals `align_of::<T>()`. So e.g. `2 as *const u32` (address 2) is rewritten to `std::ptr::dangling::<u32>()` (address 4) - the actual pointer value silently changes from 2 to 4. The lint's own test fixture confirms this (`2 as *const u32` -> `dangling::<u32>()`). For any value strictly between 1 and align the autofix is value-changing yet marked MachineApplicable.","fix":"Only lint when the literal exactly equals the alignment: replace `u128::from(val) <= align` with `u128::from(val) == align` (the `dangling` pointer's address is exactly the alignment). Values below the alignment are not equivalent to `ptr::dangling`.","locations":[{"ref":"clippy_lints/src/casts/manual_dangling_ptr.rs:69-81","code":"   69 | fn is_literal_aligned(cx: &LateContext<'_>, lit: &Spanned<LitKind>, to: &Ty<'_>) -> bool {\n   70 |     let LitKind::Int(val, _) = lit.node else { return false };\n   71 |     if val == 0 {\n   72 |         return false;\n   73 |     }\n   74 |     let to_mid_ty = cx.typeck_results().node_type(to.hir_id);\n   75 |     cx.tcx\n   76 |         .layout_of(cx.typing_env().as_query_input(to_mid_ty))\n   77 |         .is_ok_and(|layout| {\n   78 |             let align = u128::from(layout.align.bytes());\n   79 |             u128::from(val) <= align\n   80 |         })\n   81 | }","lines":13,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/casts/manual_dangling_ptr.rs#L69-L81"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `collection_is_never_read`, the closure-read detection passes `param.hir_id` to `has_no_read_access`, but that function compares against `expr.res_local_id()`, which returns the binding pattern's HirId (`PatKind::Binding(_, local_id, ..)` on `param.pat`), NOT the `Param` node's `hir_id`. These two HirIds are always distinct (see line 49 in the same file, which correctly extracts the binding id from `local.pat.kind`). Consequently no expression inside the closure body ever has `res_local_id() == Some(param.hir_id)`, so `has_no_read_access` always reports `no read`, `is_read_in_closure_arg` is always false, and the special-case block (114-131) is effectively dead. The documented example `items.retain(|item| send_item(item).is_ok());` is still flagged as a never-read collection: a false positive.","fix":"Extract the binding id from the closure param pattern: `&& let PatKind::Binding(_, arg_id, ..) = param.pat.kind` and pass `arg_id` (not `param.hir_id`) to `has_no_read_access`, mirroring line 49.","locations":[{"ref":"clippy_lints/src/collection_is_never_read.rs:118-131","code":"  118 |             let is_read_in_closure_arg = args.iter().any(|arg| {\n  119 |                 if let ExprKind::Closure(closure) = arg.kind\n  120 |                     // To keep things simple, we only check the first param to see if its read.\n  121 |                     && let Body { params: [param, ..], value } = cx.tcx.hir_body(closure.body)\n  122 |                 {\n  123 |                     !has_no_read_access(cx, param.hir_id, *value)\n  124 |                 } else {\n  125 |                     false\n  126 |                 }\n  127 |             });\n  128 |             if is_read_in_closure_arg {\n  129 |                 has_read_access = true;\n  130 |                 return ControlFlow::Break(());\n  131 |             }","lines":14,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/collection_is_never_read.rs#L118-L131"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`local_assignments` rescans every statement and terminator of every basic block (via `is_local_assignment`/`stmt_at`) for a single `local`. It is O(MIR size) per local and is reachable on arbitrary user MIR; when a lint queries many locals it becomes O(locals * MIR size). Unlike `expr_local`, it carries no cost warning.","fix":"When callers query assignments for many locals, build a single `Local -> Vec<Location>` map in one pass instead of calling `local_assignments` repeatedly; or document the cost.","locations":[{"ref":"clippy_utils/src/mir/mod.rs:255-267","code":"  255 | /// Returns a vector of `mir::Location` where `local` is assigned.\n  256 | pub fn local_assignments(mir: &Body<'_>, local: Local) -> Vec<Location> {\n  257 |     let mut locations = Vec::new();\n  258 |     for (block, data) in mir.basic_blocks.iter_enumerated() {\n  259 |         for statement_index in 0..=data.statements.len() {\n  260 |             let location = Location { block, statement_index };\n  261 |             if is_local_assignment(mir, local, location) {\n  262 |                 locations.push(location);\n  263 |             }\n  264 |         }\n  265 |     }\n  266 |     locations\n  267 | }","lines":13,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_utils/src/mir/mod.rs#L255-L267"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `--fix` mode, the code finds a stderr line that *contains* `\"failed to automatically apply fixes suggested by rustc to crate\"`, then extracts the crate name with `&stderr[63..]` (where `stderr` is the single matched line). The 63-byte slice only works if the matched line *starts* with that exact 63-char phrase. Cargo emits it as `warning: failed to automatically apply fixes...`, so with any prefix the slice is at the wrong offset (mangled output), and if the matched line is shorter than 63 bytes it is an out-of-range slice panic.","fix":"Slice relative to the found phrase position: `let marker = \"...to crate \"; if let Some(line) = stderr.lines().find(|l| l.contains(marker)) { let subcrate = &line[line.find(marker).unwrap() + marker.len()..]; ... }`.","locations":[{"ref":"lintcheck/src/main.rs:197-207","code":"  197 |         if config.fix {\n  198 |             if let Some(stderr) = stderr\n  199 |                 .lines()\n  200 |                 .find(|line| line.contains(\"failed to automatically apply fixes suggested by rustc to crate\"))\n  201 |             {\n  202 |                 let subcrate = &stderr[63..];\n  203 |                 println!(\n  204 |                     \"ERROR: failed to apply some suggestion to {} / to (sub)crate {subcrate}\",\n  205 |                     self.name\n  206 |                 );\n  207 |             }","lines":11,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/lintcheck/src/main.rs#L197-L207"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `parse_cargo_package`, the start offset of the version literal uses total trimmed whitespace on both sides: `value.len() - value.trim().len()`. This is meant to skip only leading whitespace after `=`, but `trim()` also removes trailing whitespace, so any trailing whitespace after the version value (e.g. a trailing `\\r` on a CRLF checkout) inflates the start offset and yields a misaligned range. The `.end` computation correctly uses `trim_end()` only. Works for rustfmt-clean Unix files but is fragile.","fix":"Use leading-only whitespace: `value.len() - value.trim_start().len()`.","locations":[{"ref":"clippy_dev/src/utils.rs:256-257","code":"  256 |                     version_range.start = offset + (value.len() - value.trim().len()) + key.len() + 1;\n  257 |                     version_range.end = offset + key.len() + value.trim_end().len() + 1;","lines":2,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_dev/src/utils.rs#L256-L257"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`SuggestContext::recurse` returns `Option<()>` to signal that a snippet could not be built (it returns `None` at lines 362-363 when an inner terminal's snippet is not MachineApplicable, and at line 396 when `get_text` fails). The recursive calls in the `Not(And|Or)` arm (line 350), in the `And` arm (lines 379 and 382), and in the `Or` arm (line 391) ignore the returned Option (no `?`), while line 369 correctly propagates with `?`. As a result, a nested terminal that fails to produce a snippet inside an And/Or/Not(group) is silently swallowed and `recurse` still returns `Some(())`, so the caller emits a partial/malformed suggestion string instead of detecting the failure. Blast radius is limited because the suggestion is emitted with Applicability::Unspecified (not auto-applied).","fix":"Propagate consistently: use `self.recurse(inner)?;` at lines 350, 379, 382 and 391, and have the caller skip emitting the suggestion when `recurse` returns None.","locations":[{"ref":"clippy_lints/src/booleans.rs:346-397","code":"  346 |             Not(inner) => match **inner {\n  347 |                 And(_) | Or(_) => {\n  348 |                     self.output.push('!');\n  349 |                     self.output.push('(');\n  350 |                     self.recurse(inner);\n  351 |                     self.output.push(')');\n  352 |                 },\n  353 |                 Term(n) => {\n  354 |                     let terminal = self.terminals[n as usize];\n  355 |                     if let Some(str) = simplify_not(self.cx, self.msrv, terminal) {\n  356 |                         self.output.push_str(&str);\n  357 |                     } else {\n  358 |                         let mut app = Applicability::MachineApplicable;\n  359 |                         let snip = Sugg::hir_with_context(self.cx, terminal, SyntaxContext::root(), \"\", &mut app);\n  360 |                         // Ignore the case If the expression is inside a macro expansion, or the default snippet is used\n  361 |                         if app != Applicability::MachineApplicable {\n  362 |                             return None;\n  363 |                         }\n  364 |                         let _cannot_fail = write!(&mut self.output, \"{}\", !snip);\n  365 |                     }\n  366 |                 },\n  367 |                 True | False | Not(_) => {\n  368 |                     self.output.push('!');\n  369 |                     self.recurse(inner)?;\n  370 |                 },\n  371 |             },\n  372 |             And(v) => {\n  373 |                 for (index, inner) in v.iter().enumerate() {\n  374 |                     if index > 0 {\n  375 |                         self.output.push_str(\" && \");\n  376 |                     }\n  377 |                     if let Or(_) = *inner {\n  378 |                         self.output.push('(');\n  379 |                         self.recurse(inner);\n  380 |                         self.output.push(')');\n  381 |                     } else {\n  382 |                         self.recurse(inner);\n  383 |                     }\n  384 |                 }\n  385 |             },\n  386 |             Or(v) => {\n  387 |                 for (index, inner) in v.iter().rev().enumerate() {\n  388 |                     if index > 0 {\n  389 |                         self.output.push_str(\" || \");\n  390 |                     }\n  391 |                     self.recurse(inner);\n  392 |                 }\n  393 |             },\n  394 |             &Term(n) => {\n  395 |                 self.output\n  396 |                     .push_str(&self.terminals[n as usize].span.source_callsite().get_text(self.cx)?);\n  397 |             },","lines":52,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/booleans.rs#L346-L397"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`cognitive_complexity` subtracts a return-based adjustment with `if cc >= ret_adjust { cc -= ret_adjust; }`. The comment claims this prevents degenerate cases, but when `ret_adjust > cc` the code leaves `cc` at its full, un-reduced value rather than clamping it. So a function with many `return`s and few branches keeps its inflated complexity and can still trip the threshold: the opposite of the comment's stated intent. The branch only avoids the underflow panic, not the degenerate false positive it claims to prevent.","fix":"Clamp with a floor, e.g. `cc = cc.saturating_sub(ret_adjust).max(1);`, so the result matches the documented `subtract returns, floor at 1` semantics.","locations":[{"ref":"clippy_lints/src/cognitive_complexity.rs:100-103","code":"  100 |         // prevent degenerate cases where unreachable code contains `return` statements\n  101 |         if cc >= ret_adjust {\n  102 |             cc -= ret_adjust;\n  103 |         }","lines":4,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/cognitive_complexity.rs#L100-L103"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`disallowed_script_idents` flags an identifier if ANY of a character's Unicode Script_Extensions is not whitelisted (`.find(|script| !self.whitelist.contains(script))`). Script_Extensions encodes that a character is shared across several scripts (e.g. shared punctuation/digits); the comment at line 88 says `not part of any allowed script`, which matches an all-extensions-disallowed test. As written, a character belonging to both an allowed and a disallowed script is flagged - a potential false positive, and inconsistent with the comment.","fix":"Flag only when none of a character's script extensions are whitelisted: find a char where `c.script_extension().iter().all(|script| !self.whitelist.contains(script))`.","locations":[{"ref":"clippy_lints/src/disallowed_script_idents.rs:87-98","code":"   87 |             // Check if any character in the symbol is not part of any allowed script.\n   88 |             // Fast path for ascii-only idents.\n   89 |             if !symbol_str.is_ascii()\n   90 |                 && let Some(script) = symbol_str.chars().find_map(|c| {\n   91 |                     if c.is_ascii() {\n   92 |                         return None;\n   93 |                     }\n   94 | \n   95 |                     c.script_extension()\n   96 |                         .iter()\n   97 |                         .find(|script| !self.whitelist.contains(script))\n   98 |                 })","lines":12,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/disallowed_script_idents.rs#L87-L98"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"radians.rs hardcodes the `_f64` suffix when the multiplicand is an unsuffixed float literal: `format!(\"{recv}_f64.to_degrees()\")`. If the surrounding expression is f32-typed, the original literal would have been inferred as f32, so appending `_f64` changes the literal's type in the suggested code. The existing tests only cover variable receivers and already-f64 literals, so the literal-in-f32-context case is untested.","fix":"Derive the suffix from `cx.typeck_results().expr_ty(mul_lhs)` (use the float type's `name_str()`, like `lib::prepare_receiver_sugg` does) instead of hardcoding `_f64`.","locations":[{"ref":"clippy_lints/src/floating_point_arithmetic/radians.rs:46-57","code":"   46 |                     let proposal = if let ExprKind::Lit(literal) = mul_lhs.kind\n   47 |                         && let ast::LitKind::Float(ref value, float_type) = literal.node\n   48 |                         && float_type == ast::LitFloatType::Unsuffixed\n   49 |                     {\n   50 |                         if value.as_str().ends_with('.') {\n   51 |                             format!(\"{recv}0_f64.to_degrees()\")\n   52 |                         } else {\n   53 |                             format!(\"{recv}_f64.to_degrees()\")\n   54 |                         }\n   55 |                     } else {\n   56 |                         format!(\"{}.to_degrees()\", recv.maybe_paren())\n   57 |                     };","lines":12,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/floating_point_arithmetic/radians.rs#L46-L57"},{"ref":"clippy_lints/src/floating_point_arithmetic/radians.rs:72-83","code":"   72 |                     let proposal = if let ExprKind::Lit(literal) = mul_lhs.kind\n   73 |                         && let ast::LitKind::Float(ref value, float_type) = literal.node\n   74 |                         && float_type == ast::LitFloatType::Unsuffixed\n   75 |                     {\n   76 |                         if value.as_str().ends_with('.') {\n   77 |                             format!(\"{recv}0_f64.to_radians()\")\n   78 |                         } else {\n   79 |                             format!(\"{recv}_f64.to_radians()\")\n   80 |                         }\n   81 |                     } else {\n   82 |                         format!(\"{}.to_radians()\", recv.maybe_paren())\n   83 |                     };","lines":12,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/floating_point_arithmetic/radians.rs#L72-L83"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`check_impl_item` unconditionally sets `self.format_trait_impl = is_format_trait_impl(...)` on every impl item entered, while `check_impl_item_post` resets it to `None` only when the post item is itself a format-trait impl. The comment at line 124 acknowledges this is an unenforced assumption. If a format method body (e.g. `Display::fmt`) contains an inner `impl Display`/`impl Debug` (for a locally-defined type), entering the inner impl overwrites the outer `format_trait_impl`, and the inner `check_impl_item_post` resets it to None, so expressions in the remainder of the outer body are no longer checked for `to_string`/self-format/print recursion.","fix":"Maintain a stack: push the previous `format_trait_impl` in `check_impl_item` and pop/restore it in `check_impl_item_post`, instead of using a single `Option`.","locations":[{"ref":"clippy_lints/src/format_impl.rs:117-127","code":"  117 | impl<'tcx> LateLintPass<'tcx> for FormatImpl {\n  118 |     fn check_impl_item(&mut self, cx: &LateContext<'_>, impl_item: &ImplItem<'_>) {\n  119 |         self.format_trait_impl = is_format_trait_impl(cx, impl_item);\n  120 |     }\n  121 | \n  122 |     fn check_impl_item_post(&mut self, cx: &LateContext<'_>, impl_item: &ImplItem<'_>) {\n  123 |         // Assume no nested Impl of Debug and Display within each other\n  124 |         if is_format_trait_impl(cx, impl_item).is_some() {\n  125 |             self.format_trait_impl = None;\n  126 |         }\n  127 |     }","lines":11,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/format_impl.rs#L117-L127"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `check_enum_start`, the third condition `name.chars().nth(item_name_chars + 1).is_some_and(|c| !c.is_numeric())` requires a character at index `item_name_chars + 1`, i.e. it forces the variant name to be at least `enum_name_len + 2` chars. A variant equal to the enum name plus a single non-digit char (enum `Foo`, variant `FooX`) has no char at that index, so `is_some_and` is false and ENUM_VARIANT_NAMES never fires, even though `FooX` plainly starts with the enum name. The intent (per the lint docs) is only to exclude a numeric char immediately after the prefix (`Foo1`); that check belongs at index `item_name_chars`, not `item_name_chars + 1`. Existing UI tests use multi-char suffixes so the bug is masked.","fix":"Check the boundary char itself: combine into `name.chars().nth(item_name_chars).is_some_and(|c| !c.is_lowercase() && !c.is_numeric())` and drop the separate `nth(item_name_chars + 1)` clause.","locations":[{"ref":"clippy_lints/src/item_name_repetitions.rs:417-420","code":"  417 |     if count_match_start(item_name, name).char_count == item_name_chars\n  418 |         && name.chars().nth(item_name_chars).is_some_and(|c| !c.is_lowercase())\n  419 |         && name.chars().nth(item_name_chars + 1).is_some_and(|c| !c.is_numeric())\n  420 |         && !check_enum_tuple_path_match(name, variant.data)","lines":4,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/item_name_repetitions.rs#L417-L420"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `explicit_counter_loop`, when `InitializeVisitor` returns no counter type (`ty == None`), the counter is assumed to be `usize` and an `.enumerate()` suggestion is emitted. If the counter's real type is a non-usize integer but type info is unavailable, `.enumerate()` (which yields `usize`) would silently change the counter's type, possibly breaking compilation. The `None` case is collapsed together with confirmed `usize`.","fix":"Treat the `None` type case conservatively: skip the `.enumerate()` suggestion (use the `.zip()` form) or lower applicability, rather than equating `None` with `usize`.","locations":[{"ref":"clippy_lints/src/loops/explicit_counter_loop.rs:60-72","code":"   60 |                 let int_name = match ty.map(Ty::kind) {\n   61 |                     Some(ty::Uint(UintTy::Usize)) | None => {\n   62 |                         if is_zero {\n   63 |                             diag.span_suggestion(\n   64 |                                 span,\n   65 |                                 \"consider using\",\n   66 |                                 format!(\"{loop_label}for ({name}, {pat_snippet}) in {iter_snippet}.enumerate()\"),\n   67 |                                 applicability,\n   68 |                             );\n   69 |                             return;\n   70 |                         }\n   71 |                         None\n   72 |                     },","lines":13,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/loops/explicit_counter_loop.rs#L60-L72"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `manual_find`, applicability is set to `MachineApplicable` for the `Copy` return branch and is only downgraded to `MaybeIncorrect` in the non-Copy branch. When `inner_ret` has adjustments, `.map(|v| v as _)` is appended unconditionally. `v as _` is only valid for primitive numeric casts; if the adjustment is an unsizing/deref coercion rather than a numeric cast, the emitted MachineApplicable suggestion may not compile.","fix":"When `.map(|v| v as _)` is appended (adjustments present), downgrade `applicability` to `Applicability::MaybeIncorrect` regardless of whether the type is Copy, or restrict the cast-map to numeric adjustment kinds.","locations":[{"ref":"clippy_lints/src/loops/manual_find.rs:56-89","code":"   56 |         let ty = cx.typeck_results().expr_ty(inner_ret);\n   57 |         if cx\n   58 |             .tcx\n   59 |             .lang_items()\n   60 |             .copy_trait()\n   61 |             .is_some_and(|id| implements_trait(cx, ty, id, &[]))\n   62 |         {\n   63 |             snippet.push_str(\n   64 |                 &format!(\n   65 |                     \".find(|{}{}| {})\",\n   66 |                     \"&\".repeat(1 + usize::from(is_ref_to_binding)),\n   67 |                     snippet_with_applicability(cx, inner_ret.span, \"..\", &mut applicability),\n   68 |                     snippet_with_applicability(cx, cond.span, \"..\", &mut applicability),\n   69 |                 )[..],\n   70 |             );\n   71 |             if is_ref_to_binding {\n   72 |                 snippet.push_str(\".copied()\");\n   73 |             }\n   74 |         } else {\n   75 |             applicability = Applicability::MaybeIncorrect;\n   76 |             snippet.push_str(\n   77 |                 &format!(\n   78 |                     \".find(|{}| {})\",\n   79 |                     snippet_with_applicability(cx, inner_ret.span, \"..\", &mut applicability),\n   80 |                     snippet_with_applicability(cx, cond.span, \"..\", &mut applicability),\n   81 |                 )[..],\n   82 |             );\n   83 |         }\n   84 | \n   85 |         // If the return type requires adjustments, we need to add a `.map` after the iterator\n   86 |         let inner_ret_adjust = cx.typeck_results().expr_adjustments(inner_ret);\n   87 |         if !inner_ret_adjust.is_empty() {\n   88 |             snippet.push_str(\".map(|v| v as _)\");\n   89 |         }","lines":34,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/loops/manual_find.rs#L56-L89"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`b_n_refs` is the reference-nesting count of the original `b` operand computed by `are_ty_eligible` (line 64/106). Inside the diagnostic closure, lines 74-76 may swap `(a, b) = (b, a)` when `a` is an unsuffixed numeric literal and `b` is not. After the swap `b` points at the original `a`, but line 87 still prepends `\"*\".repeat(b_n_refs)` (the OLD `b`'s deref count) to the NEW `b`. When the operands had different reference levels (e.g. the non-literal side was `&i32`), the suggestion gets the wrong number of `*`, emitting something like `5.abs_diff(*x)` reversed, producing an uncompilable replacement still marked MachineApplicable when there are no comments.","fix":"Perform the literal-ordering swap before calling `are_ty_eligible` so `b_n_refs` is derived from the final `b`, or recompute the deref count after the swap.","locations":[{"ref":"clippy_lints/src/manual_abs_diff.rs:63-90","code":"   63 |             && let Some((ty, b_n_refs)) = self.are_ty_eligible(cx, a, b)\n   64 |             && is_sub_expr(cx, if_expr.then, a, b, ty)\n   65 |             && is_sub_expr(cx, r#else, b, a, ty)\n   66 |         {\n   67 |             span_lint_and_then(\n   68 |                 cx,\n   69 |                 MANUAL_ABS_DIFF,\n   70 |                 expr.span,\n   71 |                 \"manual absolute difference pattern without using `abs_diff`\",\n   72 |                 |diag| {\n   73 |                     if is_unsuffixed_numeral_lit(a) && !is_unsuffixed_numeral_lit(b) {\n   74 |                         (a, b) = (b, a);\n   75 |                     }\n   76 |                     let applicability = {\n   77 |                         if span_contains_comment(cx, if_expr.then.span) || span_contains_comment(cx, r#else.span) {\n   78 |                             Applicability::MaybeIncorrect\n   79 |                         } else {\n   80 |                             Applicability::MachineApplicable\n   81 |                         }\n   82 |                     };\n   83 |                     let sugg = format!(\n   84 |                         \"{}.abs_diff({}{})\",\n   85 |                         Sugg::hir(cx, a, \"..\").maybe_paren(),\n   86 |                         \"*\".repeat(b_n_refs),\n   87 |                         Sugg::hir(cx, b, \"..\")\n   88 |                     );\n   89 |                     diag.span_suggestion(expr.span, \"replace with `abs_diff`\", sugg, applicability);\n   90 |                 },","lines":28,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/manual_abs_diff.rs#L63-L90"},{"ref":"clippy_lints/src/manual_abs_diff.rs:99-108","code":"   99 |     fn are_ty_eligible<'tcx>(&self, cx: &LateContext<'tcx>, a: &Expr<'_>, b: &Expr<'_>) -> Option<(Ty<'tcx>, usize)> {\n  100 |         let is_int = |ty: Ty<'_>| matches!(ty.kind(), ty::Uint(_) | ty::Int(_)) && self.msrv.meets(cx, msrvs::ABS_DIFF);\n  101 |         let is_duration =\n  102 |             |ty: Ty<'_>| ty.is_diag_item(cx, sym::Duration) && self.msrv.meets(cx, msrvs::DURATION_ABS_DIFF);\n  103 | \n  104 |         let a_ty = cx.typeck_results().expr_ty(a).peel_refs();\n  105 |         let (b_ty, b_n_refs, _) = peel_and_count_ty_refs(cx.typeck_results().expr_ty(b));\n  106 | \n  107 |         (a_ty == b_ty && (is_int(a_ty) || is_duration(a_ty))).then_some((a_ty, b_n_refs))\n  108 |     }","lines":10,"link":"https://github.com/rust-lang/rust-clippy/blob/c9d938fb4d39fe1c56362436ac944a8e4550f969/clippy_lints/src/manual_abs_diff.rs#L99-L108"}]},
