{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"gdm_daemon_ensure_dirs() calls getgrnam(GDM_GROUPNAME) and, if it returns NULL (group lookup fails), only logs a warning ('things will probably be very broken') but does not return early. Execution continues to gdm_ensure_dir(LOGDIR, 0, grent->gr_gid, ...) which dereferences the NULL grent pointer, crashing the GDM daemon during startup if the gdm group does not exist on the system.","fix":"After the NULL check on grent, either return/skip the LOGDIR chown step, or use a sentinel gid (e.g. -1 / 0) instead of dereferencing grent->gr_gid when grent is NULL.","locations":[{"ref":"daemon/main.c:146-167","code":"  146 | static void\n  147 | gdm_daemon_ensure_dirs (void)\n  148 | {\n  149 |         g_autoptr (GError) error = NULL;\n  150 |         struct group *grent;\n  151 | \n  152 |         grent = getgrnam (GDM_GROUPNAME);\n  153 |         if (G_UNLIKELY (grent == NULL))\n  154 |                 g_warning (\"Failed to find the GDM group, things will probably be very broken!\");\n  155 | \n  156 |         /* Set up /run/gdm */\n  157 |         if (!gdm_ensure_dir (GDM_RUN_DIR, 0, 0, 0755, FALSE, &error)) {\n  158 |                 g_warning (\"Failed to create \" GDM_RUN_DIR \": %s\", error->message);\n  159 |                 g_clear_error (&error);\n  160 |         }\n  161 | \n  162 |         /* Set up /var/log/gdm */\n  163 |         if (!gdm_ensure_dir (LOGDIR, 0, grent->gr_gid, 0711, FALSE, &error)) {\n  164 |                 g_warning (\"Failed to create \" LOGDIR \": %s\", error->message);\n  165 |                 g_clear_error (&error);\n  166 |         }\n  167 | }","lines":22,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/daemon/main.c#L146-167"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"gdm-new-session correlates the display/session it is supposed to watch purely by username string (on_display_added compares state->username to the username of any GDBusObject that appears on the Displays object manager). CreateUserDisplay/DestroyUserDisplay are likewise invoked only with the username (call_gdm_display_factory_method). If the same user already has another running session, or two gdm-new-session processes are launched concurrently for the same user, this process can latch onto, report success for, and ultimately terminate (via the SIGTERM handler or terminate_requested logic) a session it did not create.","fix":"Have CreateUserDisplay return (or correlate via) a request/session identifier and match on that identifier in on_display_added/on_display_removed instead of (or in addition to) username, so a tool instance only acts on the display/session it actually created.","locations":[{"ref":"utils/gdm-new-session.c:52-99","code":"   52 | on_display_added (GDBusObjectManager *displays,\n   53 |                   GDBusObject        *display_object,\n   54 |                   State              *state)\n   55 | {\n   56 |         g_autoptr (GDBusInterface) display_proxy = NULL;\n   57 |         g_autoptr (GVariant) reply = NULL;\n   58 |         g_autoptr (GError) error = NULL;\n   59 |         g_autofree char *session_id = NULL;\n   60 |         g_autofree char *username = NULL;\n   61 | \n   62 |         display_proxy = g_dbus_object_get_interface (display_object, GDM_DISPLAY_INTERFACE);\n   63 |         if (display_proxy == NULL) {\n   64 |                 g_warning (\"GDM exported a non Display object on dbus\");\n   65 |                 return;\n   66 |         }\n   67 | \n   68 |         reply = g_dbus_proxy_call_sync (G_DBUS_PROXY (display_proxy),\n   69 |                                         \"GetSessionId\",\n   70 |                                         NULL,\n   71 |                                         G_DBUS_CALL_FLAGS_NONE,\n   72 |                                         -1,\n   73 |                                         NULL,\n   74 |                                         &error);\n   75 |         if (reply == NULL) {\n   76 |                 g_warning (\"Failed getting SessionId: %s\", error->message);\n   77 |                 return;\n   78 |         }\n   79 | \n   80 |         g_variant_get (reply, \"(s)\", &session_id);\n   81 | \n   82 |         if (sd_session_get_username (session_id, &username) < 0)\n   83 |                 return;\n   84 | \n   85 |         if (g_strcmp0 (state->username, username) == 0) {\n   86 |                 g_print (\"Session started\\n\");\n   87 | \n   88 |                 g_set_str (&state->display_path, g_dbus_object_get_object_path (display_object));\n   89 | \n   90 |                 g_signal_handlers_disconnect_by_func (displays,\n   91 |                                                       G_CALLBACK (on_display_added),\n   92 |                                                       state);\n   93 | \n   94 |                 if (state->terminate_requested) {\n   95 |                         if (!terminate_session (state, &error))\n   96 |                                 g_warning (\"Terminating session failed: %s\", error->message);\n   97 |                 }\n   98 |         }\n   99 | }","lines":48,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/utils/gdm-new-session.c#L52-99"},{"ref":"utils/gdm-new-session.c:170-204","code":"  170 | static gboolean\n  171 | call_gdm_display_factory_method (State       *state,\n  172 |                                  const char  *method,\n  173 |                                  GError     **error)\n  174 | {\n  175 |         GDBusConnection *connection = state->connection;\n  176 |         gboolean headless = state->headless;\n  177 |         g_autoptr (GVariant) reply = NULL;\n  178 |         const char *dbus_path;\n  179 |         const char *dbus_iface;\n  180 | \n  181 |         if (headless) {\n  182 |                 dbus_path = GDM_REMOTE_DISPLAY_FACTORY_PATH;\n  183 |                 dbus_iface = GDM_REMOTE_DISPLAY_FACTORY_INTERFACE;\n  184 |         } else {\n  185 |                 dbus_path = GDM_LOCAL_DISPLAY_FACTORY_PATH;\n  186 |                 dbus_iface = GDM_LOCAL_DISPLAY_FACTORY_INTERFACE;\n  187 |         }\n  188 | \n  189 |         reply = g_dbus_connection_call_sync (connection,\n  190 |                                              GDM_DBUS_NAME,\n  191 |                                              dbus_path,\n  192 |                                              dbus_iface,\n  193 |                                              method,\n  194 |                                              g_variant_new (\"(s)\", state->username),\n  195 |                                              NULL,\n  196 |                                              G_DBUS_CALL_FLAGS_NONE,\n  197 |                                              -1, NULL, error);\n  198 |         if (reply == NULL) {\n  199 |                 g_dbus_error_strip_remote_error (*error);\n  200 |                 return FALSE;\n  201 |         }\n  202 | \n  203 |         return TRUE;\n  204 | }","lines":35,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/utils/gdm-new-session.c#L170-204"},{"ref":"utils/gdm-new-session.c:206-222","code":"  206 | static gboolean\n  207 | create_session (State   *state,\n  208 |                 GError **error)\n  209 | {\n  210 |         return call_gdm_display_factory_method (state,\n  211 |                                                 \"CreateUserDisplay\",\n  212 |                                                 error);\n  213 | }\n  214 | \n  215 | static gboolean\n  216 | terminate_session (State   *state,\n  217 |                    GError **error)\n  218 | {\n  219 |         return call_gdm_display_factory_method (state,\n  220 |                                                 \"DestroyUserDisplay\",\n  221 |                                                 error);\n  222 | }","lines":17,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/utils/gdm-new-session.c#L206-222"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"start_element_cb() only allocates info->entry when it sees a <schema> start tag. If the schema XML has a <key>, <signature>, or <default> element outside of (or before) a <schema> element -- e.g. a malformed/corrupted schema file -- text_cb() will dereference info->entry->key/signature/default_value while info->entry is still NULL, crashing the process (gdm daemon or any tool linking gdm-settings-utils.c) with a NULL pointer dereference.","fix":"In text_cb(), guard each branch with 'info->entry != NULL' before dereferencing, or have start_element_cb() reject/warn on out-of-context <key>/<signature>/<default> elements via the GError** parameter.","locations":[{"ref":"common/gdm-settings-utils.c:124-147","code":"  124 | static void\n  125 | start_element_cb (GMarkupParseContext *ctx,\n  126 |                   const char          *element_name,\n  127 |                   const char         **attribute_names,\n  128 |                   const char         **attribute_values,\n  129 |                   gpointer             user_data,\n  130 |                   GError             **error)\n  131 | {\n  132 |         ParserInfo *info;\n  133 | \n  134 |         info = (ParserInfo *) user_data;\n  135 | \n  136 |         /*g_debug (\"parsing start: '%s'\", element_name);*/\n  137 | \n  138 |         if (strcmp (element_name, \"schema\") == 0) {\n  139 |                 info->entry = gdm_settings_entry_new ();\n  140 |         } else if (strcmp (element_name, \"key\") == 0) {\n  141 |                 info->in_key = TRUE;\n  142 |         } else if (strcmp (element_name, \"signature\") == 0) {\n  143 |                 info->in_signature = TRUE;\n  144 |         } else if (strcmp (element_name, \"default\") == 0) {\n  145 |                 info->in_default = TRUE;\n  146 |         }\n  147 | }","lines":24,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/common/gdm-settings-utils.c#L124-147"},{"ref":"common/gdm-settings-utils.c:180-204","code":"  180 | static void\n  181 | text_cb (GMarkupParseContext *ctx,\n  182 |          const char          *text,\n  183 |          gsize                text_len,\n  184 |          gpointer             user_data,\n  185 |          GError             **error)\n  186 | {\n  187 |         ParserInfo *info;\n  188 |         char       *t;\n  189 | \n  190 |         info = (ParserInfo *) user_data;\n  191 | \n  192 |         t = g_strndup (text, text_len);\n  193 | \n  194 |         if (info->in_key) {\n  195 |                 info->entry->key = g_strdup (t);\n  196 |         } else if (info->in_signature) {\n  197 |                 info->entry->signature = g_strdup (t);\n  198 |         } else if (info->in_default) {\n  199 |                 info->entry->default_value = g_strdup (t);\n  200 |         }\n  201 | \n  202 |         g_free (t);\n  203 | \n  204 | }","lines":25,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/common/gdm-settings-utils.c#L180-204"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"gdm_settings_parse_schemas() calls g_markup_parse_context_parse(ctx, contents, len, NULL), discarding the GError entirely and ignoring the boolean return value. It also never calls g_markup_parse_context_end_parse(), which is required to detect truncated/unclosed XML documents. A malformed or truncated schema file therefore silently yields a partial (or empty) schema list while the function still returns TRUE, so gdm_settings_direct_init() proceeds to treat broken/missing settings schemas as successfully loaded with no warning logged anywhere (error_cb is a no-op).","fix":"Capture and check the GError from g_markup_parse_context_parse(), call g_markup_parse_context_end_parse(ctx, &error) afterward, and return FALSE (logging via g_warning) on any parse failure instead of silently returning TRUE with a possibly-incomplete schema list.","locations":[{"ref":"common/gdm-settings-utils.c:206-211","code":"  206 | static void\n  207 | error_cb (GMarkupParseContext *ctx,\n  208 |           GError              *error,\n  209 |           gpointer             user_data)\n  210 | {\n  211 | }","lines":6,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/common/gdm-settings-utils.c#L206-211"},{"ref":"common/gdm-settings-utils.c:247-248","code":"  247 |         ctx = g_markup_parse_context_new (&parser, 0, info, NULL);\n  248 |         g_markup_parse_context_parse (ctx, contents, len, NULL);","lines":2,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/common/gdm-settings-utils.c#L247-248"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"gdm_display_factory_on_user_display_destruction() removes the user from priv->display_creation_users via g_hash_table_remove() as the very first step, before verifying that graphical sessions actually exist for the user and before attempting to terminate them. If gdm_find_graphical_sessions_for_username() fails, returns zero sessions, or gdm_terminate_session_by_id() fails partway through the loop, the function returns FALSE/error but the user has already been dropped from display_creation_users. A subsequent call to gdm_display_factory_on_user_display_creation() for that same user will then succeed even though the previous display/session may still be alive (in the partial-termination-failure case), allowing duplicate/overlapping user displays to be created against the 'one display per user' invariant this hashtable is meant to enforce.","fix":"Only remove the user from display_creation_users after all session terminations have succeeded (move the g_hash_table_remove call to just before the final `return TRUE;`), or re-insert the user back into the table if any later step fails.","locations":[{"ref":"daemon/gdm-display-factory.c:263-310","code":"  263 | gboolean\n  264 | gdm_display_factory_on_user_display_destruction (GdmDisplayFactory  *factory,\n  265 |                                                  const char         *user,\n  266 |                                                  GError            **error)\n  267 | {\n  268 |         g_auto (GStrv) session_ids = NULL;\n  269 |         g_autoptr (GError) local_error = NULL;\n  270 |         g_autoptr (GDBusConnection) connection = NULL;\n  271 |         GdmDisplayFactoryPrivate *priv;\n  272 |         int i;\n  273 | \n  274 |         g_return_val_if_fail (GDM_IS_DISPLAY_FACTORY (factory), FALSE);\n  275 | \n  276 |         priv = gdm_display_factory_get_instance_private (factory);\n  277 | \n  278 |         if (!g_hash_table_remove (priv->display_creation_users, user)) {\n  279 |                 g_set_error (error, GDM_DISPLAY_ERROR, GDM_DISPLAY_ERROR_GENERAL,\n  280 |                              \"A display for user %s wasn't created\", user);\n  281 |                 return FALSE;\n  282 |         }\n  283 | \n  284 |         if (!gdm_find_graphical_sessions_for_username (user, &session_ids, error))\n  285 |                 return FALSE;\n  286 | \n  287 |         if (g_strv_length (session_ids) == 0) {\n  288 |                 g_set_error (error, GDM_DISPLAY_ERROR, GDM_DISPLAY_ERROR_GENERAL,\n  289 |                              \"There's no display for user %s\", user);\n  290 |                 return FALSE;\n  291 |         }\n  292 | \n  293 |         connection = g_bus_get_sync (G_BUS_TYPE_SYSTEM, NULL, &local_error);\n  294 |         if (connection == NULL) {\n  295 |                 g_set_error (error, GDM_DISPLAY_ERROR, GDM_DISPLAY_ERROR_GENERAL,\n  296 |                              \"Failed getting system bus %s\", local_error->message);\n  297 |                 return FALSE;\n  298 |         }\n  299 | \n  300 |         for (i = 0; session_ids[i] != NULL; i++) {\n  301 |                 if (!gdm_terminate_session_by_id (connection, NULL, session_ids[i])) {\n  302 |                         g_set_error (error, GDM_DISPLAY_ERROR, GDM_DISPLAY_ERROR_GENERAL,\n  303 |                                      \"Failed to terminate session %s\",\n  304 |                                      session_ids[i]);\n  305 |                         return FALSE;\n  306 |                 }\n  307 |         }\n  308 | \n  309 |         return TRUE;\n  310 | }","lines":48,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/daemon/gdm-display-factory.c#L263-310"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"gdm_display_store_remove() unconditionally `return FALSE;` regardless of whether gdm_display_store_foreach_remove() actually found and removed the display (that function returns a guint count of removed entries, which is discarded). Any future caller relying on the documented gboolean return value to detect whether removal succeeded will always see failure, even on successful removal. The single current caller in gdm-manager.c ignores the return value, which is why this hasn't surfaced as a visible bug yet, but the function's contract is broken.","fix":"Capture the count from gdm_display_store_foreach_remove() and return `count > 0` (or similarly correct boolean) instead of a hardcoded FALSE.","locations":[{"ref":"daemon/gdm-display-store.c:120-131","code":"  120 | gboolean\n  121 | gdm_display_store_remove (GdmDisplayStore    *store,\n  122 |                           GdmDisplay         *display)\n  123 | {\n  124 |         g_return_val_if_fail (GDM_IS_DISPLAY_STORE (store), FALSE);\n  125 |         g_return_val_if_fail (display != NULL, FALSE);\n  126 | \n  127 |         gdm_display_store_foreach_remove (store,\n  128 |                                           (GdmDisplayStoreFunc)remove_display,\n  129 |                                           display);\n  130 |         return FALSE;\n  131 | }","lines":12,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/daemon/gdm-display-store.c#L120-131"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"gdm_dynamic_user_store_remove() looks up the user in store->by_uid (g_hash_table_lookup) before taking store->mutex; the lock is only acquired afterward for the actual removal. Every other accessor of by_uid/by_name (gdm_dynamic_user_store_create, vl_get_user_record, vl_get_memberships) consistently takes the mutex before touching these tables. This unlocked read violates the locking protocol the rest of the file relies on and is a maintenance/correctness hazard: any future caller of _remove() from a different thread (or a future writer added to the varlink worker) would race with this unlocked lookup.","fix":"Move g_mutex_lock(&store->mutex) before the g_hash_table_lookup call, performing the lookup and the two removals under a single critical section (e.g. using G_MUTEX_AUTO_LOCK like the varlink handlers do).","locations":[{"ref":"daemon/gdm-dynamic-user-store.c:347-361","code":"  347 | void\n  348 | gdm_dynamic_user_store_remove (GdmDynamicUserStore *store,\n  349 |                                uid_t                uid)\n  350 | {\n  351 |         DynamicUser *user;\n  352 | \n  353 |         user = g_hash_table_lookup (store->by_uid, &uid);\n  354 |         if (user == NULL)\n  355 |                 return;\n  356 | \n  357 |         g_mutex_lock (&store->mutex);\n  358 |         g_hash_table_remove (store->by_uid, &uid);\n  359 |         g_hash_table_remove (store->by_name, user->username);\n  360 |         g_mutex_unlock (&store->mutex);\n  361 | }","lines":15,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/daemon/gdm-dynamic-user-store.c#L347-361"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"GdmLaunchEnvironment->pid is never reset to 0 after gdm_signal_pid(-pid, SIGTERM) is sent in gdm_launch_environment_stop() (unlike dyn_uid, which is zeroed right after use on the next line, and session, which is cleared via g_clear_object). gdm_launch_environment_stop() is called both explicitly from gdm-display.c during teardown and again from gdm_launch_environment_finalize(), and on_conversation_stopped() also signals the same pid earlier in the shutdown sequence. Because pid is left stale, the same process-group ID can be SIGTERM'd a second time after the kernel has already reaped and possibly recycled that PID for an unrelated process group, which is a real risk in a root daemon.","fix":"Set launch_environment->pid = 0 immediately after calling gdm_signal_pid() in both on_conversation_stopped() and gdm_launch_environment_stop(), mirroring the dyn_uid = 0 pattern already used in the same function.","locations":[{"ref":"daemon/gdm-launch-environment.c:628-652","code":"  628 | gboolean\n  629 | gdm_launch_environment_stop (GdmLaunchEnvironment *launch_environment)\n  630 | {\n  631 |         g_return_val_if_fail (GDM_IS_LAUNCH_ENVIRONMENT (launch_environment), FALSE);\n  632 | \n  633 |         if (launch_environment->pid > 1) {\n  634 |                 gdm_signal_pid (-launch_environment->pid, SIGTERM);\n  635 |         }\n  636 | \n  637 |         if (launch_environment->session != NULL) {\n  638 |                 gdm_session_close (launch_environment->session);\n  639 | \n  640 |                 g_clear_object (&launch_environment->session);\n  641 |         }\n  642 | \n  643 |         if (launch_environment->dyn_uid != 0) {\n  644 |                 gdm_dynamic_user_store_remove (launch_environment->dyn_user_store,\n  645 |                                                launch_environment->dyn_uid);\n  646 |                 launch_environment->dyn_uid = 0;\n  647 |         }\n  648 | \n  649 |         g_signal_emit (G_OBJECT (launch_environment), signals [STOPPED], 0);\n  650 | \n  651 |         return TRUE;\n  652 | }","lines":25,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/daemon/gdm-launch-environment.c#L628-652"},{"ref":"daemon/gdm-launch-environment.c:509-528","code":"  509 | static void\n  510 | on_conversation_stopped (GdmSession           *session,\n  511 |                          const char           *service_name,\n  512 |                          GdmLaunchEnvironment *launch_environment)\n  513 | {\n  514 |         g_autoptr(GdmSession) conversation_session = NULL;\n  515 | \n  516 |         conversation_session = g_steal_pointer (&launch_environment->session);\n  517 | \n  518 |         g_debug (\"GdmLaunchEnvironment: conversation stopped\");\n  519 | \n  520 |         if (launch_environment->pid > 1) {\n  521 |                 gdm_signal_pid (-launch_environment->pid, SIGTERM);\n  522 |                 g_signal_emit (G_OBJECT (launch_environment), signals [STOPPED], 0);\n  523 |         }\n  524 | \n  525 |         if (conversation_session != NULL) {\n  526 |                 gdm_session_close (conversation_session);\n  527 |         }\n  528 | }","lines":20,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/daemon/gdm-launch-environment.c#L509-528"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"is_remote_session() treats sd_session_is_remote() returning -ENXIO (no seat associated with the session) as 'is remote' = TRUE, because the final return is `ret != FALSE` i.e. `ret != 0`, and -ENXIO is non-zero. Every other helper in this file (get_seat_id_for_session_id, get_tty_for_session_id) explicitly special-cases -ENXIO as 'no data' rather than folding it into a truthy/positive result. This makes seatless sessions get misclassified as remote, which feeds into are_sessions_compatible() and reauthentication-channel routing decisions.","fix":"Special-case ret == -ENXIO the same way the sibling helpers do (treat as FALSE/unknown rather than truthy), e.g. `if (ret == -ENXIO) return FALSE;` before the generic error check, and only return `ret > 0` for the success path.","locations":[{"ref":"daemon/gdm-manager.c:380-397","code":"  380 | static gboolean\n  381 | is_remote_session (GdmManager  *self,\n  382 |                    const char  *session_id,\n  383 |                    GError     **error)\n  384 | {\n  385 |         int ret;\n  386 | \n  387 |         ret = sd_session_is_remote (session_id);\n  388 | \n  389 |         if (ret < 0 && ret != -ENXIO) {\n  390 |                 g_set_error (error,\n  391 |                              GDM_DISPLAY_ERROR,\n  392 |                              GDM_DISPLAY_ERROR_GETTING_SESSION_INFO,\n  393 |                              \"%s\", g_strerror (-ret));\n  394 |                 return FALSE;\n  395 |         }\n  396 | \n  397 |         return ret != FALSE;","lines":18,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/daemon/gdm-manager.c#L380-397"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"gdm_manager_handle_open_reauthentication_channel() validates session_id/pid/uid for NULL/zero but never checks `display` for NULL before using it. get_display_and_details_for_bus_sender() can return display == NULL (its display lookup via lookup_by_session_id can fail) while still populating session_id/pid/uid from the session info. When is_login_screen is TRUE, the code then calls `g_object_set_data (G_OBJECT (display), \"reauth-pid-of-caller\", ...)` with display possibly NULL, which trips a g_critical via G_IS_OBJECT() inside g_object_set_data and silently no-ops, masking what should be a clean access-denied error to the caller.","fix":"After the session_id/pid/uid validation, also check `if (display == NULL) { return access-denied error; }` before dereferencing display in the is_login_screen branch.","locations":[{"ref":"daemon/gdm-manager.c:1090-1105","code":" 1090 |         if (session_id == NULL || pid == 0 || uid == (uid_t) -1) {\n 1091 |                 g_dbus_method_invocation_return_error_literal (invocation,\n 1092 |                                                                G_DBUS_ERROR,\n 1093 |                                                                G_DBUS_ERROR_ACCESS_DENIED,\n 1094 |                                                                _(\"No session available\"));\n 1095 | \n 1096 |                 return TRUE;\n 1097 |         }\n 1098 | \n 1099 |         if (is_login_screen) {\n 1100 |                 g_debug (\"GdmManager: looking for login screen session for user %s\", username);\n 1101 |                 session = find_session_for_user (self,\n 1102 |                                                  username,\n 1103 |                                                  NULL);\n 1104 |                 login_session = get_user_session_for_display (display);\n 1105 |                 g_object_set_data (G_OBJECT (display), \"reauth-pid-of-caller\", GINT_TO_POINTER (pid));","lines":16,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/daemon/gdm-manager.c#L1090-1105"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In gdm_session_solaris_auditor_report_login_failure(), when user_accredited is FALSE, `tid` is declared but only conditionally assigned by adt_load_hostname()/adt_load_ttyname(); if either call fails (returns != 0), only a syslog warning is emitted and `tid` is left holding stack garbage, yet it is unconditionally passed to adt_set_user(ah, ..., tid, ADT_NEW) right after. This passes an uninitialized pointer into the Solaris audit API on the failure path.","fix":"Initialize `tid = NULL;` at declaration, so a failed adt_load_hostname()/adt_load_ttyname() results in a defined (NULL) value being passed to adt_set_user() instead of uninitialized stack memory.","locations":[{"ref":"daemon/gdm-session-solaris-auditor.c:181-201","code":"  181 |                 /* If display is on console or VT */\n  182 |                 if (hostname != NULL && hostname[0] != '\\0') {\n  183 |                         /* Login from a remote host */\n  184 |                         if (adt_load_hostname (hostname, &tid) != 0) {\n  185 |                                 syslog (LOG_AUTH | LOG_ALERT,\n  186 |                                         \"adt_loadhostname (%s): %m\", hostname);\n  187 |                         }\n  188 |                 } else {\n  189 |                         /* login from the local host */\n  190 |                         if (adt_load_ttyname (display_device, &tid) != 0) {\n  191 |                                 syslog (LOG_AUTH | LOG_ALERT,\n  192 |                                         \"adt_loadhostname (localhost): %m\");\n  193 |                         }\n  194 |                 }\n  195 | \n  196 |                 if (adt_set_user (ah,\n  197 |                                   solaris_auditor->username != NULL ? solaris_auditor->uid : ADT_NO_ATTRIB,\n  198 |                                   solaris_auditor->username != NULL ? solaris_auditor->gid : ADT_NO_ATTRIB,\n  199 |                                   solaris_auditor->username != NULL ? solaris_auditor->uid : ADT_NO_ATTRIB,\n  200 |                                   solaris_auditor->username != NULL ? solaris_auditor->gid : ADT_NO_ATTRIB,\n  201 |                                   tid, ADT_NEW) != 0) {","lines":21,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/daemon/gdm-session-solaris-auditor.c#L181-201"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"user_verifier_extensions is a single hashtable owned at the GdmSession level, but its entries (GDBusInterfaceSkeleton extension objects) are exported onto a specific GDBusConnection inside gdm_session_handle_client_enable_extensions(). If more than one outside connection calls EnableExtensions on the same GdmSession (e.g. greeter reconnects, or a second client), the second call does g_hash_table_remove_all() which unexports and disposes (unexport_and_free_user_verifier_extension) the interfaces that were exported on the FIRST connection's D-Bus object path, even though that first connection may still be alive and relying on them. This causes cross-connection interface corruption rather than being scoped per-connection.","fix":"Scope user_verifier_extensions per-connection (e.g. store it in connection object data alongside 'gdm-session', or key the table by connection) instead of a single session-wide table shared across all outside connections.","locations":[{"ref":"daemon/gdm-session.c:1581-1609","code":" 1581 | static gboolean\n 1582 | gdm_session_handle_client_enable_extensions (GdmDBusUserVerifier    *user_verifier_interface,\n 1583 |                                              GDBusMethodInvocation  *invocation,\n 1584 |                                              const char * const *    extensions,\n 1585 |                                              GDBusConnection        *connection)\n 1586 | {\n 1587 |         GdmSession *self = g_object_get_data (G_OBJECT (connection), \"gdm-session\");\n 1588 |         size_t i;\n 1589 | \n 1590 |         g_hash_table_remove_all (self->user_verifier_extensions);\n 1591 | \n 1592 |         for (i = 0; extensions[i] != NULL; i++) {\n 1593 |                 if (g_hash_table_lookup (self->user_verifier_extensions, extensions[i]) != NULL)\n 1594 |                         continue;\n 1595 | \n 1596 |                 if (strcmp (extensions[i],\n 1597 |                             gdm_dbus_user_verifier_choice_list_interface_info ()->name) == 0)\n 1598 |                         export_user_verifier_choice_list_interface (self, connection);\n 1599 | \n 1600 |                 if (g_str_equal (extensions[i],\n 1601 |                                  gdm_dbus_user_verifier_custom_json_interface_info ()->name))\n 1602 |                         export_user_verifier_custom_json_interface (self, connection);\n 1603 | \n 1604 |         }\n 1605 | \n 1606 |         gdm_dbus_user_verifier_complete_enable_extensions (user_verifier_interface, invocation);\n 1607 | \n 1608 |         return TRUE;\n 1609 | }","lines":29,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/daemon/gdm-session.c#L1581-1609"},{"ref":"daemon/gdm-session.c:1874-1911","code":" 1874 | static void\n 1875 | export_user_verifier_interface (GdmSession      *self,\n 1876 |                                 GDBusConnection *connection)\n 1877 | {\n 1878 |         g_autoptr (GdmDBusUserVerifier) user_verifier_interface = NULL;\n 1879 | \n 1880 |         user_verifier_interface = GDM_DBUS_USER_VERIFIER (gdm_dbus_user_verifier_skeleton_new ());\n 1881 | \n 1882 |         g_object_set_data (G_OBJECT (connection), \"gdm-session\", self);\n 1883 | \n 1884 |         g_signal_connect (user_verifier_interface,\n 1885 |                           \"handle-enable-extensions\",\n 1886 |                           G_CALLBACK (gdm_session_handle_client_enable_extensions),\n 1887 |                           connection);\n 1888 |         g_signal_connect (user_verifier_interface,\n 1889 |                           \"handle-begin-verification\",\n 1890 |                           G_CALLBACK (gdm_session_handle_client_begin_verification),\n 1891 |                           self);\n 1892 |         g_signal_connect (user_verifier_interface,\n 1893 |                           \"handle-begin-verification-for-user\",\n 1894 |                           G_CALLBACK (gdm_session_handle_client_begin_verification_for_user),\n 1895 |                           self);\n 1896 |         g_signal_connect (user_verifier_interface,\n 1897 |                           \"handle-answer-query\",\n 1898 |                           G_CALLBACK (gdm_session_handle_client_answer_query),\n 1899 |                           self);\n 1900 |         g_signal_connect (user_verifier_interface,\n 1901 |                           \"handle-cancel\",\n 1902 |                           G_CALLBACK (gdm_session_handle_client_cancel),\n 1903 |                           self);\n 1904 | \n 1905 |         g_dbus_interface_skeleton_export (G_DBUS_INTERFACE_SKELETON (user_verifier_interface),\n 1906 |                                           connection,\n 1907 |                                           GDM_SESSION_DBUS_OBJECT_PATH,\n 1908 |                                           NULL);\n 1909 | \n 1910 |         g_set_object (&self->user_verifier_interface, user_verifier_interface);\n 1911 | }","lines":38,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/daemon/gdm-session.c#L1874-1911"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"on_initialization_complete_cb() checks conversation->starting_invocation for NULL before using it on the success path (ret != NULL), but on the failure path it calls g_dbus_method_invocation_return_gerror (conversation->starting_invocation, error) unconditionally. starting_invocation is NULL whenever the conversation was started via gdm_session_setup_for_program() (which never sets starting_invocation, see gdm_session_setup_for_program at line 2637), so an initialization failure for a program-session conversation will pass NULL into g_dbus_method_invocation_return_gerror().","fix":"Guard the failure branch the same way the success branch does: if (conversation->starting_invocation) { g_dbus_method_invocation_return_gerror (...); }","locations":[{"ref":"daemon/gdm-session.c:2557-2561","code":" 2557 |         } else {\n 2558 |                 g_dbus_method_invocation_return_gerror (conversation->starting_invocation, error);\n 2559 |                 report_and_stop_conversation (self, service_name, error);\n 2560 |                 g_error_free (error);\n 2561 |         }","lines":5,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/daemon/gdm-session.c#L2557-2561"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"gdm_session_setup() (the normal login verification path) never resets self->is_program_session to FALSE, while gdm_session_setup_for_user() explicitly does (self->is_program_session = FALSE at line 2632) and gdm_session_setup_for_program() sets it to TRUE. do_reset()/gdm_session_reset() also never clears this flag. Since GdmSession is reused across conversations within the same display/session-object lifecycle, if a program-session conversation (e.g. autologin helper) runs before a plain gdm_session_setup() call on the same GdmSession, is_program_session incorrectly remains TRUE and is sent to the worker as 'is-program-session' in initialize(), affecting PAM/session setup behavior for what should be a normal login.","fix":"Explicitly set self->is_program_session = FALSE at the start of gdm_session_setup(), or reset it in do_reset() so each fresh login pass starts from a known state.","locations":[{"ref":"daemon/gdm-session.c:2627-2639","code":" 2627 | void\n 2628 | gdm_session_setup (GdmSession *self,\n 2629 |                    const char *service_name)\n 2630 | {\n 2631 | \n 2632 |         g_return_if_fail (GDM_IS_SESSION (self));\n 2633 |         g_return_if_fail (service_name != NULL);\n 2634 | \n 2635 |         update_session_type (self);\n 2636 | \n 2637 |         initialize (self, service_name, NULL, NULL);\n 2638 |         gdm_session_defaults_changed (self);\n 2639 | }","lines":13,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/daemon/gdm-session.c#L2627-2639"},{"ref":"daemon/gdm-session.c:3184-3209","code":" 3184 | static void\n 3185 | do_reset (GdmSession *self)\n 3186 | {\n 3187 |         stop_all_conversations (self);\n 3188 | \n 3189 |         free_pending_worker_connections (self);\n 3190 | \n 3191 |         g_free (self->selected_user);\n 3192 |         self->selected_user = NULL;\n 3193 | \n 3194 |         g_free (self->selected_session);\n 3195 |         self->selected_session = NULL;\n 3196 | \n 3197 |         g_free (self->saved_session);\n 3198 |         self->saved_session = NULL;\n 3199 | \n 3200 |         g_free (self->saved_language);\n 3201 |         self->saved_language = NULL;\n 3202 | \n 3203 |         g_hash_table_remove_all (self->environment);\n 3204 | \n 3205 |         g_clear_pointer (&self->session_opened, g_free);\n 3206 | \n 3207 |         self->session_pid = -1;\n 3208 |         self->session_conversation = NULL;\n 3209 | }","lines":26,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/daemon/gdm-session.c#L3184-3209"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"handle_reset's interactive confirmation loop calls fgets(buffer, sizeof(buffer), stdin) and on failure (NULL return, e.g. EOF because stdin is closed/redirected from /dev/null, which is common for a privileged tool invoked from scripts or systemd) just does 'continue', looping forever and repeatedly re-printing the prompt. There is no escape path, causing gdm-config reset to hang/busy-loop indefinitely when run non-interactively without the -y/--yes flag misuse or stdin EOF.","fix":"Break out of the loop (and treat as cancelled / return an error) when fgets returns NULL instead of continuing the loop forever.","locations":[{"ref":"utils/gdm-config.c:1899-1914","code":" 1899 |                 while (TRUE) {\n 1900 |                         g_print (C_(\"Interactive question\", \"Do you want to continue? [Y/n]? \"));\n 1901 |                         if (!fgets(buffer, sizeof (buffer), stdin))\n 1902 |                                 continue;\n 1903 | \n 1904 |                         g_strstrip (buffer);\n 1905 | \n 1906 |                         if (g_str_equal (buffer, reply_Y))\n 1907 |                                 break;\n 1908 |                         if (g_str_equal (buffer, reply_y))\n 1909 |                                 break;\n 1910 |                         if (g_str_equal (buffer, reply_N))\n 1911 |                                 break;\n 1912 |                         if (g_str_equal (buffer, reply_n))\n 1913 |                                 break;\n 1914 |                 }","lines":16,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/utils/gdm-config.c#L1899-1914"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"gdm_session_display_mode_from_string() returns -1 cast to the GdmSessionDisplayMode enum when given an unrecognized string, but the enum has no member representing an invalid/unknown value. Callers such as gdm_session_display_mode_to_string() only handle the two real enum values and fall into a 'default: g_warning(...); return \"\";' branch, silently propagating an invalid display mode rather than failing loudly at the point of conversion. Additionally str is dereferenced via strcmp() without a NULL guard (currently safe because the only caller passes a GVariant 's' argument, which GVariant guarantees non-NULL, but the function has no defense if reused elsewhere).","fix":"Return a proper sentinel (or have the function take an out-gboolean for success) and have the caller (gdm-session-worker.c:2394) reject the SetSessionDisplayMode call outright when the string is unrecognized, instead of silently storing an invalid enum value.","locations":[{"ref":"daemon/gdm-session.c:4238-4248","code":" 4238 | GdmSessionDisplayMode\n 4239 | gdm_session_display_mode_from_string (const char *str)\n 4240 | {\n 4241 |         if (strcmp (str, \"new-vt\") == 0)\n 4242 |                 return GDM_SESSION_DISPLAY_MODE_NEW_VT;\n 4243 |         if (strcmp (str, \"logind-managed\") == 0)\n 4244 |                 return GDM_SESSION_DISPLAY_MODE_LOGIND_MANAGED;\n 4245 | \n 4246 |         g_warning (\"Unknown GdmSessionDisplayMode %s\", str);\n 4247 |         return -1;\n 4248 | }","lines":11,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/daemon/gdm-session.c#L4238-4248"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"write_dconf_setting_to_key_file's final g_debug call always references value_str even on the 'remove key' path (value == NULL), where value_str is never assigned and remains NULL for the entire function. Passing NULL for a \"%s\" conversion is technically undefined behavior in C (though glib's printf usually tolerates it by printing \"(null)\"), and the debug message is misleading since it claims to show what was written when in fact the key was removed, not set to a value.","fix":"Use a separate debug message for the remove-key path that doesn't reference value_str, or initialize value_str to a placeholder like \"<removed>\" before the unconditional g_debug call.","locations":[{"ref":"utils/gdm-config.c:1093-1118","code":" 1093 |         if (value) {\n 1094 |                 value_ref = g_variant_ref_sink (value);\n 1095 |                 value_str = g_variant_print (value_ref, FALSE);\n 1096 | \n 1097 |                 if (g_variant_is_of_type (value, G_VARIANT_TYPE_BOOLEAN))\n 1098 |                         g_key_file_set_boolean (key_file, setting_path, key,\n 1099 |                                                 g_variant_get_boolean (value));\n 1100 |                 else\n 1101 |                         g_key_file_set_string (key_file, setting_path, key, value_str);\n 1102 |         } else {\n 1103 |                 g_clear_error (&local_error);\n 1104 |                 g_key_file_remove_key (key_file, setting_path, key, &local_error);\n 1105 | \n 1106 |                 if (local_error &&\n 1107 |                     !g_error_matches (local_error, G_KEY_FILE_ERROR,\n 1108 |                                       G_KEY_FILE_ERROR_KEY_NOT_FOUND) &&\n 1109 |                     !g_error_matches (local_error, G_KEY_FILE_ERROR,\n 1110 |                                       G_KEY_FILE_ERROR_GROUP_NOT_FOUND)) {\n 1111 |                         g_propagate_error (error, g_steal_pointer (&local_error));\n 1112 |                         return FALSE;\n 1113 |                 }\n 1114 |         }\n 1115 | \n 1116 |         g_debug (\"Writing %s configuration “%s = %s” to file %s\",\n 1117 |                  setting_path, key, value_str,\n 1118 |                  file_path);","lines":26,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/utils/gdm-config.c#L1093-1118"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"register_display_timeout_cb() in gdm-wayland-session.c logs the warning 'Could not display session' on failure, which is a copy-paste leftover from gdm-x-session.c's near-identical function (which correctly says 'Could not register display'). The wayland version's message is misleading since this callback registers the *display*, not the session.","fix":"Change the warning text to 'Could not register display: %s' to match what the function actually does (and the x-session.c equivalent).","locations":[{"ref":"daemon/gdm-wayland-session.c:455-465","code":"  455 | static void\n  456 | register_display_timeout_cb (gpointer user_data)\n  457 | {\n  458 |         State *state = (State *) user_data;\n  459 |         g_autoptr(GError) error = NULL;\n  460 | \n  461 |         if (!gdm_dbus_manager_call_register_display_sync (state->display_manager_proxy,\n  462 |                                                           state->cancellable,\n  463 |                                                           &error))\n  464 |                 g_warning (\"Could not display session: %s\", error->message);\n  465 | }","lines":11,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/daemon/gdm-wayland-session.c#L455-465"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"In write_dconf_setting_to_key_file, when the key file load succeeds but has no leading comment, g_key_file_get_comment(key_file, NULL, NULL, &local_error) returns NULL and sets local_error. The code immediately calls g_strstrip(file_comment) on that NULL pointer before checking local_error, which triggers a GLib critical warning (g_return_val_if_fail) on every write to a settings file lacking a recognizable header comment, even though this is an expected/handled case a few lines later.","fix":"Check local_error (or NULL-ness of file_comment) before calling g_strstrip; only strip when file_comment is non-NULL.","locations":[{"ref":"utils/gdm-config.c:1076-1088","code":" 1076 |                 g_autofree char *file_comment = NULL;\n 1077 | \n 1078 |                 file_comment = g_key_file_get_comment (key_file, NULL, NULL, &local_error);\n 1079 |                 file_comment = g_strstrip (file_comment);\n 1080 | \n 1081 |                 if (local_error) {\n 1082 |                         /* TRANSLATORS: First value is a file path, second is an error message */\n 1083 |                         g_warning (_(\"Failed to get the “%s” header comment: %s, was it modified?\"),\n 1084 |                                    file_path, local_error->message);\n 1085 |                 } else if (g_strcmp0 (file_comment, header_comment) != 0) {\n 1086 |                         g_warning (_(\"File “%s” header comment does not match, was it modified?\"),\n 1087 |                                    file_path);\n 1088 |                 }","lines":13,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/utils/gdm-config.c#L1076-1088"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"gdm_session_worker_ask_list_of_choices() validates that list->items[i].key is non-NULL before adding to the GVariantBuilder, but does not validate list->items[i].text. g_variant_builder_add() with format \"{ss}\" requires both strings to be non-NULL (g_variant_new_string() on a NULL pointer triggers a GLib critical/assertion). This data originates from a PAM module via the GDM_PAM_EXTENSION_CHOICE_LIST binary PAM message, i.e. untrusted-module-controlled input, so a malicious or buggy PAM module can crash the privileged session worker.","fix":"Validate list->items[i].text != NULL the same way key is validated, warning and bailing out (clearing the builder) if it is NULL.","locations":[{"ref":"daemon/gdm-session-worker.c:551-559","code":"  551 |         for (i = 0; i < list->number_of_items; i++) {\n  552 |                 if (list->items[i].key == NULL) {\n  553 |                         g_warning (\"choice list contains item with NULL key\");\n  554 |                         g_variant_builder_clear (&builder);\n  555 |                         return FALSE;\n  556 |                 }\n  557 |                 g_debug (\"GdmSessionWorker:        choices['%s'] = \\\"%s\\\"\", list->items[i].key, list->items[i].text);\n  558 |                 g_variant_builder_add (&builder, \"{ss}\", list->items[i].key, list->items[i].text);\n  559 |         }","lines":9,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/daemon/gdm-session-worker.c#L551-559"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"gdm_client_get_user_verifier_sync calls gdm_user_verifier_call_enable_extensions_sync() with the trailing GError** argument hard-coded to NULL, so if enabling PAM extensions fails, the failure is completely silent (no g_debug/g_warning, no way for the caller to learn why extensions weren't applied) and the function just falls back to returning the verifier without extensions. The async counterpart (on_user_verifier_extensions_enabled) does capture and log the equivalent error via g_debug, making the sync path strictly less debuggable than the async one for the same operation.","fix":"Pass a real GError** (or at least a local GError that gets logged via g_debug) instead of NULL, mirroring the async on_user_verifier_extensions_enabled error handling.","locations":[{"ref":"libgdm/gdm-client.c:813-819","code":"  813 |         res = gdm_user_verifier_call_enable_extensions_sync (client->user_verifier,\n  814 |                                                              (const char * const *)\n  815 |                                                              client->enabled_extensions,\n  816 |                                                              cancellable,\n  817 |                                                              NULL);\n  818 |         if (!res)\n  819 |                 return g_object_ref (client->user_verifier);","lines":7,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/libgdm/gdm-client.c#L813-819"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"easy","description":"gdm_session_settings_set_language_name() and gdm_session_settings_set_session_name() call strcmp(settings->X, X) directly instead of g_strcmp0(). If settings->X is already set (non-NULL) and the caller passes a NULL X (e.g. an unset/cleared language or session name), this dereferences NULL inside strcmp() and crashes the privileged daemon. gdm_session_settings_set_session_type() right below correctly uses g_strcmp0() for the same kind of comparison, showing the inconsistency.","fix":"Replace the raw strcmp() calls with g_strcmp0(), matching gdm_session_settings_set_session_type(), so a NULL new value doesn't crash when an old value is set.","locations":[{"ref":"daemon/gdm-session-settings.c:142-152","code":"  142 | gdm_session_settings_set_language_name (GdmSessionSettings *settings,\n  143 |                                         const char         *language_name)\n  144 | {\n  145 |         g_return_if_fail (GDM_IS_SESSION_SETTINGS (settings));\n  146 | \n  147 |         if (settings->language_name == NULL ||\n  148 |             strcmp (settings->language_name, language_name) != 0) {\n  149 |                 settings->language_name = g_strdup (language_name);\n  150 |                 g_object_notify (G_OBJECT (settings), \"language-name\");\n  151 |         }\n  152 | }","lines":11,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/daemon/gdm-session-settings.c#L142-152"},{"ref":"daemon/gdm-session-settings.c:154-165","code":"  154 | void\n  155 | gdm_session_settings_set_session_name (GdmSessionSettings *settings,\n  156 |                                        const char         *session_name)\n  157 | {\n  158 |         g_return_if_fail (GDM_IS_SESSION_SETTINGS (settings));\n  159 | \n  160 |         if (settings->session_name == NULL ||\n  161 |             strcmp (settings->session_name, session_name) != 0) {\n  162 |                 settings->session_name = g_strdup (session_name);\n  163 |                 g_object_notify (G_OBJECT (settings), \"session-name\");\n  164 |         }\n  165 | }","lines":12,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/daemon/gdm-session-settings.c#L154-165"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"medium","description":"_open_program_session_log() is invoked from the forked session child while the process is STILL ROOT (it runs before setsid()/setuid()/setusercontext() in the child, at the top of the fork branch). It operates on worker->log_file, a path that is fully attacker/caller-influenced data received over D-Bus in gdm_session_worker_handle_initialize() (the \"log-file\" key). Inside, rotate_logs() calls g_unlink()/g_rename() on attacker-influenced filenames without O_NOFOLLOW, and _open_program_session_log() itself calls g_open(filename, O_WRONLY|O_APPEND|O_CREAT, 0600) without O_NOFOLLOW either. If any component that can set 'log-file' (e.g. a compromised or buggy higher-level caller, custom session config, or future code path) supplies a path containing attacker-controlled directory components, a classic symlink/TOCTOU race lets a local user redirect this root-owned open/rename/unlink/fchmod sequence at an arbitrary file, since none of these operations validate the target is the expected regular file owned by the expected user before acting on it as root.","fix":"Either move log-file opening to after privileges are dropped (matching how _open_user_session_log is invoked post-setuid for the user-session case), or, if it must run as root, harden rotate_logs()/_open_program_session_log() to use O_NOFOLLOW on every open(), avoid following the final path component via openat()+O_NOFOLLOW, and verify (via fstat after open, not lstat before) that the opened file is a regular file with expected ownership before truncating/chmod'ing it.","locations":[{"ref":"daemon/gdm-session-worker.c:2116-2119","code":" 2116 |                 if (!has_journald && worker->is_program_session) {\n 2117 |                         stdout_fd = _open_program_session_log (worker->log_file);\n 2118 |                         stderr_fd = dup (stdout_fd);\n 2119 |                 }","lines":4,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/daemon/gdm-session-worker.c#L2116-2119"},{"ref":"daemon/gdm-session-worker.c:1930-1997","code":" 1930 | rotate_logs (const char *path,\n 1931 |              guint       n_copies)\n 1932 | {\n 1933 |         int i;\n 1934 | \n 1935 |         for (i = n_copies - 1; i > 0; i--) {\n 1936 |                 g_autofree char *name_n = NULL;\n 1937 |                 g_autofree char *name_n1 = NULL;\n 1938 | \n 1939 |                 name_n = g_strdup_printf (\"%s.%d\", path, i);\n 1940 |                 if (i > 1) {\n 1941 |                         name_n1 = g_strdup_printf (\"%s.%d\", path, i - 1);\n 1942 |                 } else {\n 1943 |                         name_n1 = g_strdup (path);\n 1944 |                 }\n 1945 | \n 1946 |                 g_unlink (name_n);\n 1947 |                 g_rename (name_n1, name_n);\n 1948 |         }\n 1949 | \n 1950 |         g_unlink (path);\n 1951 | }\n 1952 | \n 1953 | static int\n 1954 | _open_program_session_log (const char *filename)\n 1955 | {\n 1956 |         int   fd;\n 1957 | \n 1958 |         rotate_logs (filename, MAX_LOGS);\n 1959 | \n 1960 |         fd = g_open (filename, O_WRONLY | O_APPEND | O_CREAT, 0600);\n 1961 | \n 1962 |         if (fd < 0) {\n 1963 |                 g_autofree char *temp_name = NULL;\n 1964 | \n 1965 |                 temp_name = g_strdup_printf (\"%s.XXXXXXXX\", filename);\n 1966 | \n 1967 |                 fd = g_mkstemp (temp_name);\n 1968 | \n 1969 |                 if (fd < 0) {\n 1970 |                         goto out;\n 1971 |                 }\n 1972 | \n 1973 |                 g_warning (\"session log '%s' is not appendable, logging session to '%s' instead.\\n\", filename,\n 1974 |                            temp_name);\n 1975 |         } else {\n 1976 |                 if (ftruncate (fd, 0) < 0) {\n 1977 |                         close (fd);\n 1978 |                         fd = -1;\n 1979 |                         goto out;\n 1980 |                 }\n 1981 |         }\n 1982 | \n 1983 |         if (fchmod (fd, 0644) < 0) {\n 1984 |                 close (fd);\n 1985 |                 fd = -1;\n 1986 |                 goto out;\n 1987 |         }\n 1988 | \n 1989 | \n 1990 | out:\n 1991 |         if (fd < 0) {\n 1992 |                 g_warning (\"unable to log program session\");\n 1993 |                 fd = g_open (\"/dev/null\", O_RDWR);\n 1994 |         }\n 1995 | \n 1996 |         return fd;\n 1997 | }","lines":68,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/daemon/gdm-session-worker.c#L1930-1997"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"medium","description":"gdm_session_report_error() calls g_dbus_method_invocation_return_error_literal() on conversation->pending_invocation via g_steal_pointer without checking it is non-NULL first (unlike cancel_pending_query(), which explicitly guards against a NULL pending_invocation). gdm_session_handle_client_custom_json_report_error() invokes gdm_session_report_error() directly from a client-facing D-Bus method (handle-report-error on the CustomJSON extension) with no guarantee a query is currently pending. A client/greeter that calls ReportError without an outstanding query causes a NULL GDBusMethodInvocation to be passed into GIO, producing at least a g_critical in this root daemon (and an abort under G_DEBUG=fatal-warnings).","fix":"Guard gdm_session_report_error() the same way cancel_pending_query() does: if (conversation->pending_invocation == NULL) return; before calling g_dbus_method_invocation_return_error_literal().","locations":[{"ref":"daemon/gdm-session.c:3240-3257","code":" 3240 | void\n 3241 | gdm_session_report_error (GdmSession *self,\n 3242 |                           const char *service_name,\n 3243 |                           GDBusError  code,\n 3244 |                           const char *message)\n 3245 | {\n 3246 |         GdmSessionConversation *conversation;\n 3247 | \n 3248 |         g_return_if_fail (GDM_IS_SESSION (self));\n 3249 |         g_return_if_fail (service_name != NULL);\n 3250 | \n 3251 |         conversation = find_conversation_by_name (self, service_name);\n 3252 |         if (conversation == NULL)\n 3253 |                 return;\n 3254 | \n 3255 |         g_dbus_method_invocation_return_error_literal (g_steal_pointer (&conversation->pending_invocation),\n 3256 |                                                        G_DBUS_ERROR, code, message);\n 3257 | }","lines":18,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/daemon/gdm-session.c#L3240-3257"},{"ref":"daemon/gdm-session.c:1540-1552","code":" 1540 | static gboolean\n 1541 | gdm_session_handle_client_custom_json_report_error (GdmDBusUserVerifierCustomJSON *custom_json_interface,\n 1542 |                                                     GDBusMethodInvocation         *invocation,\n 1543 |                                                     const char                    *service_name,\n 1544 |                                                     const char                    *message,\n 1545 |                                                     GdmSession                    *self)\n 1546 | {\n 1547 |         g_debug (\"GdmSession: user reported custom JSON error: %s\", message);\n 1548 | \n 1549 |         gdm_dbus_user_verifier_custom_json_complete_report_error (custom_json_interface, invocation);\n 1550 |         gdm_session_report_error (self, service_name, G_DBUS_ERROR_ACCESS_DENIED, message);\n 1551 |         return TRUE;\n 1552 | }","lines":13,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/daemon/gdm-session.c#L1540-1552"}]},
{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"recursive_copy_dir() dereferences *error (via g_error_matches(*error, ...)) after g_file_make_directory() fails, without checking whether 'error' itself is NULL. GError convention (used throughout the rest of this same file, e.g. gdm_ensure_dir) explicitly allows callers to pass NULL for 'error' when they don't care about the failure reason. gdm_copy_dir_recursively() forwards its 'error' parameter straight through with no NULL check, so any future or external caller that passes NULL (legal per GLib convention) will crash with a NULL pointer dereference if the directory already exists or creation fails for another reason.","fix":"Use a local GError* and g_propagate_error(), or guard with 'if (error != NULL && !g_error_matches (*error, ...))'. Simplest fix: always use a local g_autoptr(GError) inside recursive_copy_dir and propagate it to the caller-supplied error at the end.","locations":[{"ref":"common/gdm-file-utils.c:175-181","code":"  175 |         if (!g_file_make_directory (dest, NULL, error)) {\n  176 |                 if (!g_error_matches (*error, G_IO_ERROR, G_IO_ERROR_EXISTS))\n  177 |                         return FALSE;\n  178 | \n  179 |                 /* It's not an error if the directory exists */\n  180 |                 g_clear_error (error);\n  181 |         }","lines":7,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/common/gdm-file-utils.c#L175-181"},{"ref":"common/gdm-file-utils.c:216-239","code":"  216 | gboolean\n  217 | gdm_copy_dir_recursively (const char *source,\n  218 |                           const char *dest,\n  219 |                           GError **error)\n  220 | {\n  221 |         g_autoptr (GFile) gio_source = NULL;\n  222 |         g_autoptr (GFile) gio_dest = NULL;\n  223 | \n  224 |         gio_source = g_file_new_for_path (source);\n  225 |         gio_dest = g_file_new_for_path (dest);\n  226 | \n  227 |         if (!recursive_copy_dir (gio_source, gio_dest, error)) {\n  228 |                 g_autoptr (GError) inner_error = NULL;\n  229 | \n  230 |                 if (!gdm_rm_recursively (gio_dest, &inner_error)) {\n  231 |                         g_warning (\"Failed to clean up '%s' after failed recursive copy: %s\",\n  232 |                                    dest, inner_error->message);\n  233 |                 }\n  234 | \n  235 |                 return FALSE;\n  236 |         }\n  237 | \n  238 |         return TRUE;\n  239 | }","lines":24,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/common/gdm-file-utils.c#L216-239"}]},
{"id":"API_5","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"get_session_desktop_names() calls g_key_file_free (keyfile) unconditionally after the if (keyfile != NULL) block, but keyfile can legitimately be NULL whenever load_key_file_for_file() doesn't find the session's .desktop file (a normal, non-error condition handled everywhere else in the file via NULL checks, e.g. gdm_session_is_wayland_session uses g_clear_pointer). g_key_file_free()/g_key_file_unref() asserts its argument is non-NULL, so this triggers a GLib critical warning on every lookup miss.","fix":"Use g_clear_pointer (&keyfile, g_key_file_free) instead of the unconditional g_key_file_free (keyfile), matching the pattern used in gdm_session_is_wayland_session().","locations":[{"ref":"daemon/gdm-session.c:2806-2831","code":" 2806 | static gchar *\n 2807 | get_session_desktop_names (GdmSession *self)\n 2808 | {\n 2809 |         gchar *filename;\n 2810 |         GKeyFile *keyfile;\n 2811 |         gchar *desktop_names = NULL;\n 2812 | \n 2813 |         filename = g_strdup_printf (\"%s.desktop\", get_session_name (self));\n 2814 |         g_debug (\"GdmSession: getting desktop names for file '%s'\", filename);\n 2815 |         keyfile = load_key_file_for_file (self, filename, NULL, NULL);\n 2816 |         if (keyfile != NULL) {\n 2817 |               gchar **names;\n 2818 | \n 2819 |               names = g_key_file_get_string_list (keyfile, G_KEY_FILE_DESKTOP_GROUP,\n 2820 |                                                   \"DesktopNames\", NULL, NULL);\n 2821 |               if (names != NULL) {\n 2822 |                       desktop_names = g_strjoinv (\":\", names);\n 2823 | \n 2824 |                       g_strfreev (names);\n 2825 |               }\n 2826 |         }\n 2827 | \n 2828 |         g_key_file_free (keyfile);\n 2829 |         g_free (filename);\n 2830 |         return desktop_names;\n 2831 | }","lines":26,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/daemon/gdm-session.c#L2806-2831"}]},
{"id":"API_6","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"read_file_contents_to_array() builds a GPtrArray by directly assigning the public 'len' and 'pdata' struct fields after taking ownership of a raw GStrv from g_strsplit, bypassing the GPtrArray API entirely (no g_ptr_array_set_size, no g_ptr_array_add). This relies on internal GLib implementation details: the array's internal allocated-capacity bookkeeping (not exposed in the public struct) is never updated to match the spliced-in length, only happens to behave correctly because the very next g_ptr_array_add call (seen at the two call sites that mutate the returned array, e.g. ensure_dconf_configurable_system_profile and set_dconf_setting_lock_full) forces a realloc since GLib sees len > the stale/zero capacity it still believes the array has. This is fragile, undocumented behavior that could silently break (or read/write out of bounds) on a future GLib ABI change to GPtrArray's private layout.","fix":"Build the array using the public API (g_ptr_array_add or g_ptr_array_extend) instead of poking pdata/len directly, e.g. iterate the g_strsplit result and add each line to a properly constructed GPtrArray, or use g_ptr_array_new_take if available for the GLib version targeted.","locations":[{"ref":"utils/gdm-config.c:498-516","code":"  498 |         if (content) {\n  499 |                 char **lines = g_strsplit (content, \"\\n\", -1);\n  500 |                 int i;\n  501 | \n  502 |                 if (lines && *lines) {\n  503 |                         array->len = g_strv_length (lines) + 1;\n  504 |                         array->pdata = (gpointer *) g_steal_pointer (&lines);\n  505 |                 }\n  506 | \n  507 |                 /* Strip the trailing empty and NULL lines */\n  508 |                 for (i = array->len - 1; i >= 0; i--) {\n  509 |                         char *line = g_ptr_array_index (array, i);\n  510 | \n  511 |                         if (line && (g_ascii_isgraph (line[0]) || strlen (line) > 1))\n  512 |                                 break;\n  513 | \n  514 |                         g_ptr_array_remove_index (array, i);\n  515 |                 }\n  516 |         }","lines":19,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/utils/gdm-config.c#L498-516"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"text_cb() allocates t = g_strndup(text, text_len), then in the matching branch immediately allocates a second copy via g_strdup(t), and finally frees t. This is a redundant double allocation/copy of every XML text node parsed from the settings schema file.","fix":"Assign the g_strndup() result directly to the destination field (info->entry->key = t;) in the matching branch instead of calling g_strdup(t) again, and only g_free(t) in the non-matching (discarded) case.","locations":[{"ref":"common/gdm-settings-utils.c:180-204","code":"  180 | static void\n  181 | text_cb (GMarkupParseContext *ctx,\n  182 |          const char          *text,\n  183 |          gsize                text_len,\n  184 |          gpointer             user_data,\n  185 |          GError             **error)\n  186 | {\n  187 |         ParserInfo *info;\n  188 |         char       *t;\n  189 | \n  190 |         info = (ParserInfo *) user_data;\n  191 | \n  192 |         t = g_strndup (text, text_len);\n  193 | \n  194 |         if (info->in_key) {\n  195 |                 info->entry->key = g_strdup (t);\n  196 |         } else if (info->in_signature) {\n  197 |                 info->entry->signature = g_strdup (t);\n  198 |         } else if (info->in_default) {\n  199 |                 info->entry->default_value = g_strdup (t);\n  200 |         }\n  201 | \n  202 |         g_free (t);\n  203 | \n  204 | }","lines":25,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/common/gdm-settings-utils.c#L180-204"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"gdm_manager_handle_open_session() initializes `session = NULL` and then immediately tests `if (session == NULL)`, which is always true at that point - the branch can never be skipped, so the check is dead/misleading. It reads as if there were a prior code path that could set `session` before this point, but there isn't.","fix":"Drop the redundant `if (session == NULL)` guard and unconditionally do `session = get_user_session_for_display (display);` followed by the running-session check, or add a comment if the redundancy is intentionally defensive for future refactors.","locations":[{"ref":"daemon/gdm-manager.c:771-806","code":"  771 |         GdmSession       *session = NULL;\n  772 |         const char       *address;\n  773 |         GPid              pid = 0;\n  774 |         uid_t             uid = (uid_t) -1;\n  775 |         uid_t             allowed_user;\n  776 | \n  777 |         g_debug (\"GdmManager: trying to open new session\");\n  778 | \n  779 |         sender = g_dbus_method_invocation_get_sender (invocation);\n  780 |         connection = g_dbus_method_invocation_get_connection (invocation);\n  781 |         get_display_and_details_for_bus_sender (self, connection, sender, &display, NULL, NULL, NULL, &pid, &uid, NULL, NULL);\n  782 | \n  783 |         if (display == NULL) {\n  784 |                 g_dbus_method_invocation_return_error_literal (invocation,\n  785 |                                                                G_DBUS_ERROR,\n  786 |                                                                G_DBUS_ERROR_ACCESS_DENIED,\n  787 |                                                                _(\"No session available\"));\n  788 | \n  789 |                 return TRUE;\n  790 |         }\n  791 | \n  792 |         if (session == NULL) {\n  793 |                 session = get_user_session_for_display (display);\n  794 | {"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"collect_sessions_from_directory has a stale '/* FIXME: add file monitor to directory */' comment, and the session cache (gdm_available_sessions_map / gdm_sessions_map_is_initialized) is populated exactly once and never invalidated or refreshed for the lifetime of the process. Any session .desktop files added, removed, or modified after the first call to gdm_get_session_ids()/gdm_get_session_name_and_description() are silently ignored for the remainder of the process's life, which is surprising for a long-lived consumer such as gnome-shell or the greeter.","fix":"Either implement the file monitor mentioned in the FIXME to invalidate the cache on changes, or document clearly that callers must restart/re-exec to see new sessions, and remove the stale FIXME if no monitor is planned.","locations":[{"ref":"libgdm/gdm-sessions.c:251","code":"  251 |         /* FIXME: add file monitor to directory */","lines":1,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/libgdm/gdm-sessions.c#L251"},{"ref":"libgdm/gdm-sessions.c:360-364","code":"  360 |         if (!gdm_sessions_map_is_initialized) {\n  361 |                 collect_sessions ();\n  362 | \n  363 |                 gdm_sessions_map_is_initialized = TRUE;\n  364 |         }","lines":5,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/libgdm/gdm-sessions.c#L360-364"},{"ref":"libgdm/gdm-sessions.c:398-402","code":"  398 |         if (!gdm_sessions_map_is_initialized) {\n  399 |                 collect_sessions ();\n  400 | \n  401 |                 gdm_sessions_map_is_initialized = TRUE;\n  402 |         }","lines":5,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/libgdm/gdm-sessions.c#L398-402"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"gdm_settings_direct_shutdown() has an empty body and does nothing, despite gdm_settings_direct_init() allocating a global 'schemas' GHashTable that is only ever freed/replaced inside gdm_settings_direct_init() itself (when called again), never on shutdown.","fix":"Either remove the unused shutdown hook if it serves no purpose, or have it free the global 'schemas' hash table (g_clear_pointer (&schemas, g_hash_table_unref)) to make shutdown actually release resources.","locations":[{"ref":"common/gdm-settings-direct.c:242-245","code":"  242 | gdm_settings_direct_shutdown (void)\n  243 | {\n  244 | \n  245 | }","lines":4,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/common/gdm-settings-direct.c#L242-245"}]},
{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"GdmDisplayPrivate (the private-data struct used via G_DEFINE_ABSTRACT_TYPE_WITH_PRIVATE/gdm_display_get_instance_private) embeds an unused `GObject parent;` field as its first member. This is a copy-paste leftover from the old manual-private-struct pattern; with G_DEFINE_TYPE_WITH_PRIVATE the private struct should not embed GObject at all - GLib already manages the public instance separately. The field is never read or written anywhere in the file, just wastes sizeof(GObject) bytes per GdmDisplay instance and is misleading to anyone reading the struct layout.","fix":"Remove the stray `GObject parent;` member from GdmDisplayPrivate; it serves no purpose under the _WITH_PRIVATE macro pattern used here.","locations":[{"ref":"daemon/gdm-display.c:51-86","code":"   51 | typedef struct _GdmDisplayPrivate\n   52 | {\n   53 |         GObject               parent;\n   54 | \n   55 |         char                 *id;\n   56 |         char                 *seat_id;\n   57 |         char                 *session_id;\n   58 |         char                 *session_class;\n   59 | \n   60 |         char                 *remote_hostname;\n   61 |         int                   status;\n   62 |         time_t                creation_time;\n   63 | \n   64 |         char                 *autologin_user;\n   65 | \n   66 |         guint                 finish_idle_id;\n   67 | \n   68 |         GDBusConnection      *connection;\n   69 | \n   70 |         GdmDBusDisplay       *display_skeleton;\n   71 |         GDBusObjectSkeleton  *object_skeleton;\n   72 | \n   73 |         GDBusProxy           *accountsservice_proxy;\n   74 | \n   75 |         /* this spawns and controls the greeter session */\n   76 |         GdmLaunchEnvironment *launch_environment;\n   77 | \n   78 |         guint                 is_local : 1;\n   79 |         guint                 is_initial : 1;\ {"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"GError *error is declared and initialized to NULL, then immediately reassigned error = NULL again on the very next line before first use - a harmless but pointless duplicate initialization.","fix":"Remove the redundant `error = NULL;` on line 1308.","locations":[{"ref":"daemon/gdm-local-display-factory.c:1309-1311","code":" 1309 |         GError *error = NULL;\n 1310 | \n 1311 |         error = NULL;","lines":3,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/daemon/gdm-local-display-factory.c#L1309-1311"}]},
{"id":"DEAD_7","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"_change_user() has a `#ifdef THE_MAN_PAGE_ISNT_LYING` block guarding a setreuid() call; THE_MAN_PAGE_ISNT_LYING is never defined anywhere in the codebase (grep confirms no definition), so this branch is permanently dead and the accompanying comment about pam_setcred/pam_open_session uid requirements is misleading since the code now relies entirely on the later setuid() in the forked child instead.","fix":"Remove the dead #ifdef block and stale comment, or replace it with an explanatory comment that accurately documents that uid is intentionally not dropped here because pam_open_session() must run as root and the actual setuid() happens later in the forked session child.","locations":[{"ref":"daemon/gdm-session-worker.c:1573-1583","code":" 1573 | #ifdef THE_MAN_PAGE_ISNT_LYING\n 1574 |         /* pam_setcred wants to be called as the authenticated user\n 1575 |          * but pam_open_session needs to be called as super-user.\n 1576 |          *\n 1577 |          * Set the real uid and gid to the user and give the user a\n 1578 |          * temporary super-user effective id.\n 1579 |          */\n 1580 |         if (setreuid (uid, GDM_SESSION_ROOT_UID) < 0) {\n 1581 |                 return FALSE;\n 1582 |         }\n 1583 | #endif","lines":11,"link":"https://gitlab.gnome.org/GNOME/gdm/-/blob/33b44282abc604b90e22c19cfb9b0e041b8d96de/daemon/gdm-session-worker.c#L1573-1583"}]},
