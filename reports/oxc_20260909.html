<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"search_original_line_and_column indexes the per-line `columns` table with `original_column - byte_offset_to_first` without an upper-bounds check. The table is sized to cover the line up to (and including) its terminator / EOF, so for in-source spans it is safe; but any caller passing a `position` that lands past the recorded columns on a Unicode-containing line (e.g. a synthesized span end beyond the line's last recorded byte) would index out of bounds and panic. The neighbouring `add_source_mapping_for_name` already guards with a debug_assert on `span.end <= source.len()`, but this hot path has no such guard for the column dimension.","fix":"Clamp the column index to `columns.len() - 1` (or `.get(...).copied().unwrap_or(last)`) so an out-of-range position degrades to the last known column instead of panicking.","locations":[{"ref":"crates/oxc_codegen/src/sourcemap_builder.rs:174-183","code":"  174 |         let line = &self.line_offset_tables.lines[original_line];\n  175 |         let mut original_column = position - line.byte_offset_to_start_of_line;\n  176 |         if let Some(column_offsets_id) = line.column_offsets_id {\n  177 |             let column_offsets = &self.line_offset_tables.column_offsets[column_offsets_id];\n  178 |             if original_column >= column_offsets.byte_offset_to_first {\n  179 |                 original_column = column_offsets.columns\n  180 |                     [(original_column - column_offsets.byte_offset_to_first) as usize];\n  181 |             }\n  182 |         }\n  183 |         (original_line as u32, original_column)","lines":10,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_codegen/src/sourcemap_builder.rs#L174-L183"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"print_lossy_replacement reads `bytes.as_slice()[3..7]` assuming exactly 4 hex bytes always follow a U+FFFD escape marker when `lone_surrogates` is set. This relies entirely on the upstream invariant that every U+FFFD in a lone-surrogate string is followed by 4 ASCII hex digits. If that invariant is ever violated (e.g. a malformed/truncated lone-surrogate-encoded StringLiteral reaches codegen), this slice index panics instead of degrading gracefully.","fix":"Use a checked slice (`get(3..7)`) and fall back to printing the replacement char verbatim when fewer than 4 bytes follow, rather than indexing unconditionally.","locations":[{"ref":"crates/oxc_codegen/src/str.rs:690-729","code":"  690 |         if next2 == LOSSY_REPLACEMENT_CHAR_LAST_2_BYTES {\n  691 |             // Get the 4 hex bytes\n  692 |             let bytes = &mut state.bytes;\n  693 |             let hex: [u8; 4] = bytes.as_slice()[3..7].try_into().unwrap();\n  694 | \n  695 |             if hex == *b\"fffd\" {\n  696 |                 // Actual lossy replacement character.\n  697 |                 // Flush up to and including the lossy replacement character, then skip the 4 hex bytes.\n  698 |                 // SAFETY: 0xEF is always the start of a 3-byte Unicode character\n  699 |                 unsafe { state.consume_bytes_unchecked(3) };\n  700 |                 state.flush(codegen);\n  701 |                 // SAFETY: 0xEF is always the start of a 3-byte Unicode character.\n  702 |                 // `bytes.as_slice()[3..7]` would have panicked if there weren't 4 more bytes after it.\n  703 |                 // All those bytes are ASCII, so this leaves `bytes` on a UTF-8 char boundary.\n  704 |                 unsafe { state.consume_bytes_unchecked(4) };\n  705 |                 // Start next chunk after the 4 hex bytes\n  706 |                 state.start_chunk();\n  707 |                 return;\n  708 |             }\n  709 | \n  710 |             // Flush text before the lossy replacement character\n  711 |             state.flush(codegen);\n  712 | \n  713 |             // Check all 4 hex bytes are ASCII\n  714 |             assert_eq!(u32::from_ne_bytes(hex) & 0x8080_8080, 0);\n  715 | \n  716 |             // SAFETY: `bytes.as_slice()[3..7]` would have panicked if there weren't at least 7 bytes\n  717 |             // remaining. First 3 bytes are lossy replacement character, and we just checked that\n  718 |             // next 4 bytes are ASCII, so this leaves `bytes` on a UTF-8 char boundary.\n  719 |             unsafe { state.consume_bytes_unchecked(7) };\n  720 | \n  721 |             // Start next chunk after the 4 hex bytes\n  722 |             state.start_chunk();\n  723 | \n  724 |             codegen.print_str(\"\\\\u\");\n  725 |             // SAFETY: Just checked all 4 hex bytes are ASCII\n  726 |             unsafe { codegen.code.print_bytes_unchecked(&hex) };\n  727 | \n  728 |             return;\n  729 |         }","lines":40,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_codegen/src/str.rs#L690-L729"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`GroupModes::unwrap_print_mode` panics (with a formatted message) when a `StartConditionalContent` / `StartIndentIfGroupBreaks` / `EndIndentIfGroupBreaks` references a group id that has not been seen yet. The printer's `print_element` calls this for `StartIndentIfGroupBreaks` (line 285) and `EndIndentIfGroupBreaks` (line 307) unconditionally, so a malformed IR with a dangling group id reference aborts the whole format with a panic instead of returning a `PrintError::InvalidDocument` like the other invalid-document paths in this file (`invalid_start_tag` / `invalid_end_tag`).","fix":"Make the indent-if-group-breaks paths fall back gracefully (e.g. treat a missing group mode as `Flat`, as the `FitsMeasurer` already does via `get_print_mode(...).unwrap_or_else(|| args.mode())`) or surface a `PrintError::InvalidDocument` rather than panicking.","locations":[{"ref":"crates/oxc_formatter_core/src/printer/mod.rs:915-919","code":"  915 |     fn unwrap_print_mode(&self, group_id: GroupId, next_element: &FormatElement) -> PrintMode {\n  916 |         self.get_print_mode(group_id).unwrap_or_else(|| {\n  917 |             panic!(\"Expected group with id {group_id:?} to exist but it wasn't present in the document. Ensure that a group with such a document appears in the document before the element {next_element:?}.\")\n  918 |         })\n  919 |     }","lines":5,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_formatter_core/src/printer/mod.rs#L915-L919"},{"ref":"crates/oxc_formatter_core/src/printer/mod.rs:322-351","code":"  322 |             FormatElement::Tag(StartIndentIfGroupBreaks(group_id)) => {\n  323 |                 let group_mode = self.state.group_modes.unwrap_print_mode(*group_id, element);\n  324 | \n  325 |                 if group_mode == PrintMode::Expanded {\n  326 |                     indent_stack.indent {"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"negligible","difficulty":"medium","description":"`character_to_string` calls `char::from_u32(cp).expect(\"Invalid surrogate pair `Character`!\")` after combining a lead+trail surrogate pair during Display. The combine is only guarded by `is_lead_surrogate`/`is_trail_surrogate` range checks; if the AST were ever constructed with a `Character` value that is itself outside the BMP yet flagged as a surrogate (e.g. via direct AST mutation rather than the parser), this `expect` would panic in the Display path. Parser-produced ASTs cannot hit this, so impact is limited to external AST construction.","fix":"Fall back to emitting `\\u{X}` escapes when `char::from_u32` returns `None` instead of unwrapping, making Display total over all `Character` values.","locations":[{"ref":"crates/oxc_regular_expression/src/ast_impl/display.rs:308-321","code":"  308 |         if is_lead_surrogate(cp) {\n  309 |             if let Some(peek) = peek.filter(|peek| is_trail_surrogate(peek.value)) {\n  310 |                 // Lead+Trail\n  311 |                 let cp = combine_surrogate_pair(cp, peek.value);\n  312 |                 let ch = char::from_u32(cp).expect(\"Invalid surrogate pair `Character`!\");\n  313 |                 return (Cow::Owned(format!(\"{ch}\")), true);\n  314 |             }\n  315 | \n  316 |             // Lead only\n  317 |             return (Cow::Owned(format!(r\"\\u{cp:X}\")), false);\n  318 |         }\n  319 |     }\n  320 | \n  321 |     let ch = char::from_u32(cp).expect(\"Invalid `Character`!\");","lines":14,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_regular_expression/src/ast_impl/display.rs#L308-L321"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`FunctionReturnType::return_statement_count` is a `u8`. `visit_return_statement` increments it for every `return` it visits, with no cap. A function body with 256 or more `return` statements overflows the counter: in debug builds this panics, and in release builds it wraps to 0. After wrapping, the `return_statement_count > 1` checks used to decide whether to union the inferred type with `undefined` produce wrong results, so the emitted `.d.ts` return type can be silently incorrect.","fix":"Use a wider integer (`u32`) for `return_statement_count`, or saturate the counter (`self.return_statement_count = self.return_statement_count.saturating_add(1)`), since only the distinction between 0, 1 and >1 matters.","locations":[{"ref":"crates/oxc_isolated_declarations/src/return_type.rs:44","code":"   44 |     return_statement_count: u8,","lines":1,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_isolated_declarations/src/return_type.rs#L44"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`Span::sized(start, size)` computes `start + size` with a plain (non-saturating, non-checked) addition. Every other arithmetic constructor on `Span` (`expand`, `shrink`, `move_left`, `move_right`, etc.) uses saturating arithmetic, but `sized` does not. If `start + size` exceeds `u32::MAX` this panics in debug builds and silently wraps in release builds, producing a `Span` whose `end < start` (violating the type's documented invariant), which then yields a reversed/garbage byte range when used to index source text.","fix":"Use `start.saturating_add(size)` (or `checked_add` with a documented panic), matching the saturating behavior of the other `Span` constructors.","locations":[{"ref":"crates/oxc_span/src/span.rs:141-143","code":"  141 |     pub const fn sized(start: u32, size: u32) -> Self {\n  142 |         Self::new(start, start + size)\n  143 |     }","lines":3,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_span/src/span.rs#L141-L143"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"medium","description":"In `grow_amortized`, `cmp::max((self.capacity_u32() as usize) * 2, required_cap)` doubles capacity. For zero-sized types `capacity_u32()` returns `u32::MAX`, so on 32-bit platforms `u32::MAX as usize * 2` overflows `usize` (panics in debug, wraps in release) before the `alloc_guard` check that the comment says will catch overflow. This is inherited bumpalo-derived code; oxc does not currently allocate ZST `Vec`s on 32-bit targets, so impact is negligible, but the comment's claim that the guard catches the overflow is inaccurate because the wrap happens first.","fix":"Use `saturating_mul` / `checked_mul` for the doubling, or special-case ZSTs before the multiply, so the capacity-overflow path is reached deterministically on 32-bit.","locations":[{"ref":"crates/oxc_allocator/src/vec2/raw_vec.rs:735-740","code":"  735 |             let required_cap =\n  736 |                 (len as usize).checked_add(additional).ok_or(AllocError::CapacityOverflow)?;\n  737 | \n  738 |             // This guarantees exponential growth. The doubling cannot overflow\n  739 |             // because `cap <= isize::MAX` and the type of `cap` is `u32`.\n  740 |             let cap = cmp::max((self.capacity_u32() as usize) * 2, required_cap);","lines":6,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_allocator/src/vec2/raw_vec.rs#L735-L740"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"medium","description":"`compute_layout` accumulates the total allocation size with unchecked `+=` (`size = (size + align - 1) & ...; size += size_of * cap`). Only the per-field `size_of::<T>() * cap` product is guarded by `checked_mul`; the running `size` sum across multiple fields and the alignment round-up are not checked. With several large fields and a near-`u32::MAX` capacity this could wrap before `Layout::from_size_align` validates it. Practically unreachable given current field sizes and index ranges, but the asymmetry (one product checked, the sum unchecked) is a latent soundness gap in unsafe allocation code.","fix":"Use `checked_add` for the running `size` accumulation (and the alignment round-up) and return `None`/panic on overflow, consistent with the existing `checked_mul`.","locations":[{"ref":"crates/oxc_semantic/src/multi_index_vec.rs:77-86","code":"   77 |                 let mut size = 0usize;\n   78 |                 let mut max_align = 1usize;\n   79 |                 $(\n   80 |                     let align = ::core::mem::align_of::<$fty>();\n   81 |                     if align > max_align { max_align = align; }\n   82 |                     size = (size + align - 1) & !(align - 1);\n   83 |                     size += ::core::mem::size_of::<$fty>().checked_mul(cap).expect(\"capacity overflow\");\n   84 |                 )*\n   85 |                 Some(::core::alloc::Layout::from_size_align(size, max_align).expect(\"invalid layout\"))\n   86 |             }","lines":10,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_semantic/src/multi_index_vec.rs#L77-L86"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`parseFloat` constant folding incorrectly accepts numeric separators (`_`), which are not part of the spec's StrDecimalLiteral grammar. `match_decimal_digits` treats `_` as a valid digit separator, so `parseFloat(\"1_1\")` folds to the prefix `\"1_1\"`, strips the underscore, and yields `11`. Real JS `parseFloat(\"1_1\")` is `1` (it stops at the underscore). This is a miscompilation that changes program output.","fix":"Remove the `b'_'` handling from `match_decimal_digits` entirely (and the `cow_replace('_', \"\")` at line 690). The parseFloat StrDecimalLiteral grammar has no numeric separators, so the prefix must stop at the first `_`.","locations":[{"ref":"crates/oxc_ecmascript/src/constant_evaluation/call_expr.rs:711-735","code":"  711 |     fn match_decimal_digits(s: &str) -> Option<usize> {\n  712 |         let bytes = s.as_bytes();\n  713 |         if bytes.first().is_none_or(|b| !b.is_ascii_digit()) {\n  714 |             // must have at least one digit\n  715 |             return None;\n  716 |         }\n  717 |         let mut iter = bytes.iter().enumerate().skip(1);\n  718 |         while let Some((i, &b)) = iter.next() {\n  719 |             match b {\n  720 |                 b'0'..=b'9' => {}\n  721 |                 b'_' => {\n  722 |                     let Some((i, &b)) = iter.next() else {\n  723 |                         // must have at least one digit after _\n  724 |                         return Some(i); // without _\n  725 |                     };\n  726 |                     if !b.is_ascii_digit() {\n  727 |                         // must have at least one digit after _\n  728 |                         return Some(i); // without _\n  729 |                     }\n  730 |                 }\n  731 |                 _ => return Some(i),\n  732 |             }\n  733 |         }\n  734 |         Some(s.len())\n  735 |     }","lines":25,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_ecmascript/src/constant_evaluation/call_expr.rs#L711-L735"},{"ref":"crates/oxc_ecmascript/src/constant_evaluation/call_expr.rs:697-702","code":"  697 |     let parsed = trimmed_prefix.cow_replace('_', \"\").parse::<f64>().unwrap_or_else(|_| {\n  698 |         unreachable!(\n  699 |             \"StrDecimalLiteral should be parse-able with Rust FromStr for f64: {trimmed_prefix}\"\n  700 |         )\n  701 |     });\n  702 |     Some(ConstantValue::Number(parsed))","lines":6,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_ecmascript/src/constant_evaluation/call_expr.rs#L697-L702"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`String.prototype.substring` constant folding operates on the wrong index space. JS `substring` indexes by UTF-16 code units, but `substring()` clamps `start`/`end` against `self.len()` (byte length) and then slices with `chars().skip(start).take(end-start)` (Unicode scalar values). For non-ASCII input the result is wrong, e.g. `\"𝟙abc\".substring(0,2)` produces `\"𝟙a\"` instead of `\"𝟙\"`. The bailout in `try_fold_string_substring_or_slice` only compares against byte `len()`, so it does not catch the mismatch.","fix":"Operate on UTF-16 code units: convert the string to a Vec<u16> (or compute UTF-16 length), clamp start/end to that length, slice the UTF-16 units, and re-decode. Alternatively bail out (return None) whenever the string is not all-ASCII.","locations":[{"ref":"crates/oxc_ecmascript/src/string_substring.rs:11-20","code":"   11 |     fn substring(&self, start: Option<f64>, end: Option<f64>) -> String {\n   12 |         let start = start.map_or(0, |x| x.to_int_32().max(0) as usize);\n   13 |         let end = end.map_or(usize::MAX, |x| x.to_int_32().max(0) as usize);\n   14 |         let start = start.min(self.len());\n   15 |         let end = end.min(self.len());\n   16 |         if start > end {\n   17 |             return String::new();\n   18 |         }\n   19 |         self.chars().skip(start).take(end - start).collect()\n   20 |     }","lines":10,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_ecmascript/src/string_substring.rs#L11-L20"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`neighbors_filtered_by_edge_weight` pushes the initial `node` onto the work queue but never inserts it into the `visited` set (only targets discovered via edges are inserted at line 50). If any edge points back to the start node (e.g. a loop whose header is the start block, common in CFGs), the start node is re-visited and the visitor closure is invoked on it a second time with a path-derived state, producing incorrect aggregated states. This utility is used by several lint rules (no_this_before_super, constructor_super, no_fallthrough, require_render_return).","fix":"Insert the start node into `visited` before/when it is pushed onto `q` (e.g. `visited.insert(node);` alongside the initial `q.push((node, new_state));`).","locations":[{"ref":"crates/oxc_cfg/src/visit.rs:27-60","code":"   27 |     let (new_state, keep_walking_this_path) = visitor(&node, Default::default());\n   28 |     // if we will continue walking push this node\n   29 |     if keep_walking_this_path {\n   30 |         q.push((node, new_state));\n   31 |     } else {\n   32 |         final_states.push(new_state);\n   33 |     }\n   34 | \n   35 |     while let Some((graph_ix, state)) = q.pop() {\n   36 |         let mut edges = 0;\n   37 | \n   38 |         for edge in graph.edges_directed(graph_ix, Direction::Outgoing) {\n   39 |             if visited.contains(&edge.target()) {\n   40 |                 continue;\n   41 |             }\n   42 |             if let Some(result_of_edge_filtering) = edge_filter(edge.weight()) {\n   43 |                 final_states.push(result_of_edge_filtering);\n   44 |             } else {\n   45 |                 let target = edge.target();\n   46 |                 let (new_state, keep_walking_this_path) = visitor(&target, state.clone());\n   47 |                 visited.insert(target);\n   48 |                 if keep_walking_this_path {\n   49 |                     q.push((target, new_state.clone()));\n   50 |                 } else {\n   51 |                     final_states.push(new_state.clone());\n   52 |                 }\n   53 |                 edges += 1;\n   54 |             }\n   55 |         }\n   56 | \n   57 |         if edges == 0 {\n   58 |             final_states.push(state);\n   59 |         }\n   60 |     }","lines":34,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_cfg/src/visit.rs#L27-L60"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"print_comments_in_range iterates FxHashMap keys with `find` and only prints the comments attached to the single, arbitrarily-ordered key it happens to encounter first. When more than one comment key falls in the (start, end) range, all but one are silently dropped, and which one survives is nondeterministic across runs (HashMap iteration order). Used for `{ /*a*/ /*b*/ ...spread }` JSX attributes, where multiple leading comments before the spread argument get dropped/reordered.","fix":"Collect every key in the range (sorted ascending), remove and print them in source order, instead of `keys().find(...)` over a single key.","locations":[{"ref":"crates/oxc_codegen/src/comment.rs:317-329","code":"  317 |     pub(crate) fn print_comments_in_range(&mut self, start: u32, end: u32) -> bool {\n  318 |         if self.comments.is_empty() {\n  319 |             return false;\n  320 |         }\n  321 |         // Find and remove the first key in the range.\n  322 |         let key = self.comments.keys().find(|&&k| k > start && k < end).copied();\n  323 |         if let Some(key) = key {\n  324 |             let comments = self.comments.remove(&key).unwrap();\n  325 |             self.print_comments(&comments);\n  326 |             return true;\n  327 |         }\n  328 |         false\n  329 |     }","lines":13,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_codegen/src/comment.rs#L317-L329"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"JSX attribute string value is emitted by picking a single quote char (single quote if the value contains `\"`, double otherwise) and then printing the raw value with no escaping. When the value contains BOTH `'` and `\"` (e.g. parsed value `x'\"y`), it selects single quote because the value contains `\"`, then prints the unescaped `'`, prematurely terminating the attribute and producing invalid/broken JSX output.","fix":"When the value contains both quote characters, escape the chosen quote (or emit the value via a JSX expression container `{\"...\"}`) so the output round-trips.","locations":[{"ref":"crates/oxc_codegen/src/gen.rs:2742-2747","code":" 2742 |             Self::StringLiteral(lit) => {\n 2743 |                 let quote = if lit.value.contains('\"') { b'\\'' } else { b'\"' };\n 2744 |                 p.print_ascii_byte(quote);\n 2745 |                 p.print_str(&lit.value);\n 2746 |                 p.print_ascii_byte(quote);\n 2747 |             }","lines":6,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_codegen/src/gen.rs#L2742-L2747"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`JavaScriptSource::as_str` (and `as_ref`, which delegates to it) slices the section text by `self.start`, but `source_text` is already the section slice extracted by the partial loaders while `start` is the offset of that section within the *original* file (e.g. vue.rs returns `&source_text[js_start..js_end]` with `start = js_start`). For any embedded script not at file offset 0 this produces a wrong substring, and panics with an out-of-bounds slice whenever `start > section_len`. The methods are currently unused by the engine (runtime.rs reads `section_source.source_text` directly), so this is a latent footgun rather than an active crash.","fix":"Either delete `as_str`/`as_ref` (they are dead and incorrect), or return `self.source_text` unchanged since the field already holds only the section text. Do not re-slice by `start`.","locations":[{"ref":"crates/oxc_linter/src/loader/source.rs:49-58","code":"   49 |     pub fn as_str(&self) -> &'a str {\n   50 |         &self.source_text[(self.start as usize)..]\n   51 |     }\n   52 | }\n   53 | \n   54 | impl AsRef<str> for JavaScriptSource<'_> {\n   55 |     fn as_ref(&self) -> &str {\n   56 |         self.as_str()\n   57 |     }\n   58 | }","lines":10,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_linter/src/loader/source.rs#L49-L58"},{"ref":"crates/oxc_linter/src/loader/partial_loader/vue.rs:86-89","code":"   86 |         let source_text = &self.source_text[js_start..js_end];\n   87 |         // NOTE: loader checked that source_text.len() is less than u32::MAX\n   88 |         #[expect(clippy::cast_possible_truncation)]\n   89 |         Some(JavaScriptSource::partial_with_framework_options(","lines":4,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_linter/src/loader/partial_loader/vue.rs#L86-L89"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `find_jsx_pragma`, the preceding-character check that prevents matching pragmas inside inline code spans only inspects the byte immediately before `@`. After a non-`@jsx` `@`-prefixed token is skipped via `get_unchecked(at_sign_index + 1..)`, subsequent `@` scans compute `at_sign_index` relative to the *trimmed* slice, so `comment_str.as_bytes()[at_sign_index - 1]` reads the byte before `@` within the trimmed slice — which is correct — but when a quasi/comment begins exactly at an `@` that was produced by trimming (at_sign_index == 0), the guard at line 117 is skipped entirely, allowing a pragma to be recognized even when the original preceding char (now removed) was a non-whitespace like a backtick. e.g. `` `x@jsx h` `` is split after the first non-matching `@`-less scan and can mis-recognize. This weakens the backtick-guard the function intends to enforce.","fix":"Track the absolute position into the original comment (or pass the original preceding byte along when re-slicing) so the preceding-character check uses the true previous byte rather than treating any trim point as start-of-comment.","locations":[{"ref":"crates/oxc_transformer/src/jsx/comments.rs:117-137","code":"  117 |         if at_sign_index > 0 {\n  118 |             let prev_byte = comment_str.as_bytes()[at_sign_index - 1];\n  119 |             if !matches!(prev_byte, b' ' | b'\\t' | b'\\r' | b'\\n' | b'*') {\n  120 |                 // SAFETY: Byte at `at_sign_index` is `@`, so `at_sign_index + 1` is either within\n  121 |                 // string or end of string, and on a UTF-8 char boundary.\n  122 |                 comment_str = unsafe { comment_str.get_unchecked(at_sign_index + 1..) };\n  123 |                 continue;\n  124 |             }\n  125 |         }\n  126 | \n  127 |         // Check `@` is start of `@jsx`.\n  128 |         // Note: Checking 4 bytes including leading `@` is faster than checking the 3 bytes after `@`,\n  129 |         // because 4 bytes is a `u32`.\n  130 |         let next4 = comment_str.as_bytes().get(at_sign_index..at_sign_index + 4)?;\n  131 |         if next4 != b\"@jsx\" {\n  132 |             // Not `@jsx`. Trim off up to and including `@` and search again.\n  133 |             // SAFETY: Byte at `at_sign_index` is `@`, so `at_sign_index + 1` is either within string\n  134 |             // or end of string, and on a UTF-8 char boundary.\n  135 |             comment_str = unsafe { comment_str.get_unchecked(at_sign_index + 1..) };\n  136 |             continue;\n  137 |         }","lines":21,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_transformer/src/jsx/comments.rs#L117-L137"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`Number.isInteger`/`Number.isSafeInteger` folding uses `extracted.fract().abs() < f64::EPSILON` instead of `== 0.0`. f64::EPSILON (~2.22e-16) is an absolute threshold that is meaningless for large magnitudes and can misclassify near-integer literals. Since only numeric literals reach this path their fract is exact, so `== 0.0` is both correct and simpler; the epsilon test risks classifying a non-integer with a tiny fractional part as an integer.","fix":"Use `extracted.fract() == 0.0` for the integer check (it already implies finiteness for the literal values handled here).","locations":[{"ref":"crates/oxc_ecmascript/src/constant_evaluation/call_expr.rs:418-426","code":"  418 |     let result = match name {\n  419 |         \"isFinite\" => Some(extracted.is_finite()),\n  420 |         \"isInteger\" => Some(extracted.fract().abs() < f64::EPSILON),\n  421 |         \"isNaN\" => Some(extracted.is_nan()),\n  422 |         \"isSafeInteger\" => {\n  423 |             let integer = extracted.fract().abs() < f64::EPSILON;\n  424 |             let safe = extracted.abs() <= 2f64.powi(53) - 1.0;\n  425 |             Some(safe && integer)\n  426 |         }","lines":9,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_ecmascript/src/constant_evaluation/call_expr.rs#L418-L426"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`RemoveSoftLinesBuffer` decides whether the current element sits inside an expanded conditional by looking only at the top of `conditional_content_stack` (`iter().last()`). With nested conditional content where an outer `StartConditionalContent(Expanded)` encloses an inner `StartConditionalContent(Flat)`, the inner-flat condition is on top, so `is_in_expanded_conditional_content()` returns false and the content is kept even though it is nested inside an expanded conditional that should be dropped. The same `.last()` check is duplicated in the `clean_interned` helper, so the bug is consistent across both the live-write and interned paths.","fix":"Track expanded-conditional nesting with a depth counter (or scan the whole stack for any `Expanded` entry) instead of inspecting only the top entry, so any element inside an expanded conditional is dropped regardless of inner flat conditionals.","locations":[{"ref":"crates/oxc_formatter_core/src/write/buffer.rs:393-398","code":"  393 |     fn is_in_expanded_conditional_content(&self) -> bool {\n  394 |         self.conditional_content_stack\n  395 |             .iter()\n  396 |             .last()\n  397 |             .is_some_and(|condition| condition.mode == PrintMode::Expanded)\n  398 |     }","lines":6,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_formatter_core/src/write/buffer.rs#L393-L398"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`eval_unary_expression` mishandles `UnaryPlus`/`typeof`/etc. applied to a string constant. When the operand is a `ConstantValue::String`, the code special-cases only `UnaryNegation` (-> NaN) and `BitwiseNot` (-> -1) and otherwise returns the original string unchanged. For `+\"abc\"` JavaScript yields `NaN` and for `+\"5\"` yields the number `5`, but here a `+`-prefixed string enum initializer is preserved as the raw string, producing an incorrect computed const-enum member value.","fix":"For string operands under `UnaryPlus`, coerce via JS `ToNumber` semantics (parse the string to f64, NaN on failure) instead of returning the string; only string concatenation should preserve string values.","locations":[{"ref":"crates/oxc_isolated_declarations/src/enum.rs:254-266","code":"  254 |         let value = match value {\n  255 |             ConstantValue::Number(value) => value,\n  256 |             ConstantValue::String(_) => {\n  257 |                 let value = if expr.operator == UnaryOperator::UnaryNegation {\n  258 |                     ConstantValue::Number(f64::NAN)\n  259 |                 } else if expr.operator == UnaryOperator::BitwiseNot {\n  260 |                     ConstantValue::Number(-1.0)\n  261 |                 } else {\n  262 |                     value\n  263 |                 };\n  264 |                 return Some(value);\n  265 |             }\n  266 |         };","lines":13,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_isolated_declarations/src/enum.rs#L254-L266"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`DisableLine` directives are stored with `is_next_line: true` (lines 686 and 705). The `is_next_line` flag in `contains` selects the 'diagnostic must *start* within the interval' matching rather than 'any overlap'. For a `disable-line` directive the interval covers `[line_start, comment_start)`; a diagnostic for a construct that begins on a previous line but extends onto this line (e.g. a multi-line statement) will not be suppressed even though it visually occupies the disabled line. This may or may not match ESLint exactly, but the shared `is_next_line` name conflates 'next-line' and 'this-line' semantics and is a likely source of subtle suppression mismatches.","fix":"Rename the flag to something like `match_start_only` to reflect its actual meaning, and verify against ESLint that `disable-line` suppression of constructs starting on earlier lines behaves as intended.","locations":[{"ref":"crates/oxc_linter/src/disable_directives.rs:679-689","code":"  679 |                     if rule_names.is_empty() {\n  680 |                         self.add_interval(\n  681 |                             start,\n  682 |                             stop,\n  683 |                             DisabledRule::All {\n  684 |                                 directive_prefix,\n  685 |                                 comment_span: outer_span,\n  686 |                                 fix_span: comment_fix_span,\n  687 |                                 is_next_line: true,\n  688 |                             },\n  689 |                         );","lines":11,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_linter/src/disable_directives.rs#L679-L689"},{"ref":"crates/oxc_linter/src/disable_directives.rs:346-357","code":"  346 |             let span_covered = if interval.val.is_next_line() {\n  347 |                 // For next-line directives, only check if the diagnostic starts within the interval\n  348 |                 // We intentionally only check span.start (not span.end) to avoid suppressing\n  349 |                 // diagnostics for large constructs that merely contain the disabled line\n  350 |                 #[expect(clippy::suspicious_operation_groupings)]\n  351 |                 {\n  352 |                     span.start >= interval.start && span.start < interval.stop\n  353 |                 }\n  354 |             } else {\n  355 |                 // For regular disable directives, check if there's any overlap\n  356 |                 span.start < interval.stop && span.end > interval.start\n  357 |             };","lines":12,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_linter/src/disable_directives.rs#L346-L357"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"When the fold accumulator becomes `Stop` and the recursion `break`s (after `fold` or after the recursive call), `self.depth` is not decremented even though it was incremented at the start of the iteration, and the `Leave` event / `leave` callback are skipped. Because `ModuleGraphVisitor` is shared across the whole recursive traversal, the inflated `depth` can later cause `max_depth` to be hit prematurely if the traversal continued. The enter/leave imbalance is currently masked only because the `enter`/`leave` builder setters are commented out (always no-ops).","fix":"Decrement `self.depth` and emit the Leave event before breaking on `accumulator.is_done()`, or restructure so the depth bookkeeping uses a guard/RAII pattern that runs on every exit path.","locations":[{"ref":"crates/oxc_linter/src/module_graph_visitor.rs:226-246","code":"  226 |             self.depth += 1;\n  227 | \n  228 |             event(ModuleGraphVisitorEvent::Enter, pair, module_record);\n  229 |             enter(pair, module_record);\n  230 | \n  231 |             accumulator = fold(accumulator.into_inner(), pair, module_record);\n  232 |             if accumulator.is_done() {\n  233 |                 break;\n  234 |             }\n  235 | \n  236 |             accumulator =\n  237 |                 self.filter_fold_recursive(accumulator, pair.1, filter, fold, event, enter, leave);\n  238 |             if accumulator.is_done() {\n  239 |                 break;\n  240 |             }\n  241 | \n  242 |             event(ModuleGraphVisitorEvent::Leave, pair, module_record);\n  243 |             leave(pair, module_record);\n  244 | \n  245 |             self.depth -= 1;\n  246 |         }","lines":21,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_linter/src/module_graph_visitor.rs#L226-L246"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`TriviaBuilder::irregular_whitespaces` is a plain `Vec<Span>` that is never truncated or rewound. The lexer's `rewind` (lexer/mod.rs) restores source position, token, errors and the `tokens` vec, and comments are protected against rewind via the `processed` index and the `add_comment` dedup, but irregular whitespaces are only protected by the `start <= last.start` dedup in `add_irregular_whitespace`. During speculative parsing (`try_parse` / lookahead) the lexer can advance past irregular whitespace, record it, then rewind; if the committed parse path stops before that whitespace (so it is never re-lexed), the abandoned whitespace stays in the list and is reported to oxlint. The dedup only prevents re-recording the same start, it does not remove already-recorded entries from abandoned branches.","fix":"Snapshot `irregular_whitespaces.len()` in `LexerCheckpoint` and truncate back to it in `Lexer::rewind`, mirroring how `tokens` are handled, so speculatively-lexed whitespace from abandoned branches is discarded.","locations":[{"ref":"crates/oxc_parser/src/lexer/trivia_builder.rs:105-115","code":"  105 |     pub fn add_irregular_whitespace(&mut self, start: u32, end: u32) {\n  106 |         // The irregular whitespaces array is ordered; only add if not added before, to avoid\n  107 |         // duplicates when the parser looks ahead (e.g. `peek_token`) and rewinds, then re-lexes the\n  108 |         // same whitespace. Same approach as `add_comment`.\n  109 |         if let Some(last) = self.irregular_whitespaces.last()\n  110 |             && start <= last.start\n  111 |         {\n  112 |             return;\n  113 |         }\n  114 |         self.irregular_whitespaces.push(Span::new(start, end));\n  115 |     }","lines":11,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_parser/src/lexer/trivia_builder.rs#L105-L115"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`is_identifier_part_char` (used for `RegExpIdentifierPart`, i.e. characters in named capture group names) only accepts `is_id_continue` and `$`. Per the ECMAScript grammar `IdentifierPartChar :: UnicodeIDContinue | $ | <ZWNJ> | <ZWJ>`, U+200C (ZWNJ) and U+200D (ZWJ) are also valid. Oxc's own identifier code (`oxc_syntax::identifier::is_identifier_part_unicode`) correctly includes `c == ZWNJ || c == ZWJ`, so the regex parser is inconsistent and will reject otherwise-valid named group identifiers such as `(?<a‍>)`.","fix":"Mirror `oxc_syntax`: `char::from_u32(cp).is_some_and(|ch| unicode_id_start::is_id_continue(ch) || ch == '$' || ch == '\\u{200c}' || ch == '\\u{200d}')`.","locations":[{"ref":"crates/oxc_regular_expression/src/parser/pattern_parser/character.rs:111-113","code":"  111 | pub fn is_identifier_part_char(cp: u32) -> bool {\n  112 |     char::from_u32(cp).is_some_and(|ch| unicode_id_start::is_id_continue(ch) || ch == '$')\n  113 | }","lines":3,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_regular_expression/src/parser/pattern_parser/character.rs#L111-L113"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`best_match` pre-filters candidates with `candidate.len().abs_diff(needle.len()) > threshold`, comparing byte lengths, but `threshold` is a Levenshtein distance measured in chars (`min_edit_distance` iterates over `char`s). For strings containing multi-byte UTF-8 characters, a candidate within `threshold` edits can have a byte-length difference larger than `threshold` and be wrongly skipped, so a valid typo suggestion is silently dropped.","fix":"Compare char counts in the pre-filter, e.g. `candidate.chars().count().abs_diff(needle.chars().count())`, or drop the byte-length fast path. For ASCII identifiers (the common case) behavior is unchanged.","locations":[{"ref":"crates/oxc_span/src/edit_distance.rs:38-41","code":"   38 |         // no need to calculate distance if length difference exceeds threshold\n   39 |         if candidate.len().abs_diff(needle.len()) > threshold {\n   40 |             continue;\n   41 |         }","lines":4,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_span/src/edit_distance.rs#L38-L41"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"Styled-components CSS minifier line-comment detection uses `bytes[i - 1] != b':'` to avoid breaking URLs like `https://`, but after a comment-continuation merge the byte slice is re-sliced (`bytes = &bytes[start_index..]`) and the loop index `i` restarts at 0 against the new slice. The `i == 0 || bytes[i - 1] != b':'` check therefore loses the real preceding character context across the quasi/comment boundary, so a `//` that directly follows a `:` carried over from the previous quasi segment can be wrongly treated as a comment (or vice versa), corrupting the minified CSS in rare interpolation-adjacent cases.","fix":"Track the last emitted/seen byte across quasi boundaries (e.g. inspect `output.last()`) instead of `bytes[i - 1]` when deciding whether a `//` is preceded by a colon, so the URL guard remains correct after comment-merge re-slicing.","locations":[{"ref":"crates/oxc_transformer/src/plugins/styled_components.rs:1037-1052","code":" 1037 |                             // Skip line comments, but be careful not to break URLs like `https://...`\n 1038 |                             b'/' if paren_depth == 0 && (i == 0 || bytes[i - 1] != b':') => {\n 1039 |                                 let end_index =\n 1040 |                                     bytes[i + 2..].iter().position(|&b| matches!(b, b'\\n' | b'\\r'));\n 1041 |                                 if let Some(end_index) = end_index {\n 1042 |                                     // Insert space in place of `\\n` / `\\r`\n 1043 |                                     insert_space_if_required(&mut output, is_first_output);\n 1044 | \n 1045 |                                     i += end_index + 3; // After `\\n` or `\\r`\n 1046 |                                     continue;\n 1047 |                                 }\n 1048 | \n 1049 |                                 // Comment is not complete at end of quasi\n 1050 |                                 comment_type = Some(false);\n 1051 |                                 break;\n 1052 |                             }","lines":16,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_transformer/src/plugins/styled_components.rs#L1037-L1052"},{"ref":"crates/oxc_transformer/src/plugins/styled_components.rs:951-956","code":"  951 |                 // Trim off to end of comment\n  952 |                 bytes = &bytes[start_index..];\n  953 | \n  954 |                 comment_type = None;\n  955 | \n  956 |                 // Don't touch `output`. This quasi continues appending to existing `output`.","lines":6,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_transformer/src/plugins/styled_components.rs#L951-L956"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"medium","description":"`find_function_params_start` guards keyword skipping with strict `i + N < len` (e.g. `text[i..].starts_with(\"export\") && i + 6 < len`). When a recognized keyword sits exactly at the end of the slice (`i + N == len`), the keyword is not consumed and parameter extraction bails, so `@param` reordering is silently skipped. This is an off-by-one in the boundary check (`<` should be `<=`), though in practice a function always has more source after these keywords so the path is unreachable for real inputs.","fix":"Use `i + N <= len` (or check the byte only when present) so a keyword ending exactly at the slice boundary is still recognized; harmless but removes a latent off-by-one.","locations":[{"ref":"crates/oxc_formatter/src/formatter/jsdoc/param_order.rs:113-124","code":"  113 |         if text[i..].starts_with(\"export\") && i + 6 < len && !is_id_continue(bytes[i + 6]) {\n  114 |             i += 6;\n  115 |             continue;\n  116 |         }\n  117 |         if text[i..].starts_with(\"async\") && i + 5 < len && !is_id_continue(bytes[i + 5]) {\n  118 |             i += 5;\n  119 |             continue;\n  120 |         }\n  121 |         if text[i..].starts_with(\"default\") && i + 7 < len && !is_id_continue(bytes[i + 7]) {\n  122 |             i += 7;\n  123 |             continue;\n  124 |         }","lines":12,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_formatter/src/formatter/jsdoc/param_order.rs#L113-L124"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`offset_to_position` detects CRLF with the condition `i + 1 < offset && bytes[i + 1] == b'\\n'`. The bound should be against `source_text.len()` (the slice length), not `offset`. When `offset` lands exactly between the `\\r` and `\\n` of a CRLF (i.e. `\\r` at index `offset-1`), the `\\n` is not seen and the `\\r` is treated as a lone CR, advancing by 1 and ending on the `\\n` boundary - yielding a position with `character == 0` on the new line instead of staying on the CR. LSP positions are not supposed to point inside a CRLF, so impact is small, but the bound is conceptually wrong.","fix":"Compare against the text length, e.g. `i + 1 < source_text.len()`, so CRLF is detected even when `offset` falls on the `\\n`.","locations":[{"ref":"crates/oxc_language_server/src/position.rs:26-30","code":"   26 |             b'\\r' => {\n   27 |                 i += if i + 1 < offset && bytes[i + 1] == b'\\n' { 2 } else { 1 };\n   28 |                 line += 1;\n   29 |                 line_start = i;\n   30 |             }","lines":5,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_language_server/src/position.rs#L26-L30"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In non-unicode mode, a lone quantifier metacharacter (`*`, `+`, `?`) at a position with no preceding atom is reported via the InvalidBracedQuantifier path in `parse_extended_atom`: `consume_quantifier` succeeds on `*`/`+`/`?` and the code unconditionally raises `invalid_braced_quantifier`. The input contains no braces, so the diagnostic message (\"Invalid braced quantifier\") misdescribes the actual error and never reaches the more accurate `lone_quantifier` branch in `parse_term`.","fix":"Only treat the consumed quantifier as InvalidBracedQuantifier when it was actually brace-delimited (`{...}`); otherwise fall through so `parse_term` can emit the `lone_quantifier` diagnostic, or introduce a dedicated message for prefix quantifiers.","locations":[{"ref":"crates/oxc_regular_expression/src/parser/pattern_parser/pattern_parser_impl.rs:433-442","code":"  433 |         // InvalidBracedQuantifier\n  434 |         let span_start = self.reader.offset();\n  435 |         if self.consume_quantifier()?.is_some() {\n  436 |             // [SS:EE] ExtendedAtom :: InvalidBracedQuantifier\n  437 |             // It is a Syntax Error if any source text is matched by this production.\n  438 |             // (Annex B)\n  439 |             return Err(diagnostics::invalid_braced_quantifier(\n  440 |                 self.span_factory.create(span_start, self.reader.offset()),\n  441 |             ));\n  442 |         }","lines":10,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_regular_expression/src/parser/pattern_parser/pattern_parser_impl.rs#L433-L442"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`debug_assert_token_ascii_only_and_no_linebreaks` validates `token()` input only in debug builds. In release, a `token()` containing non-ASCII or `\\n` / `\\t` is later printed through `print_bytes_unchecked` and counted with `text.len()` (byte length) as the column width (printer `print_text`, Token branch). A multi-byte or newline-containing token therefore corrupts width tracking and line-break decisions silently. Builders for `text()` similarly only debug-assert the no-`\\r` invariant.","fix":"Document the hard safety contract on `token()` (callers must guarantee ASCII, no line breaks/tabs) and audit call sites; consider a release-time assertion in the few non-hot construction paths, since a violated invariant produces silently wrong formatting rather than a clear failure.","locations":[{"ref":"crates/oxc_formatter_core/src/write/builders.rs:246-257","code":"  246 | #[inline]\n  247 | pub fn token(text: &'static str) -> Token {\n  248 |     debug_assert_token_ascii_only_and_no_linebreaks(text);\n  249 |     Token { text }\n  250 | }\n  251 | \n  252 | fn debug_assert_token_ascii_only_and_no_linebreaks(text: &str) {\n  253 |     debug_assert!(\n  254 |         text.as_bytes().iter().all(|&c| c.is_ascii() && !matches!(c, b'\\r' | b'\\n' | b'\\t')),\n  255 |         \"`FormatElement::Token` can only contain ASCII characters without line breaks or tab characters. Found invalid content: '{text}'\"\n  256 |     );\n  257 | }","lines":12,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_formatter_core/src/write/builders.rs#L246-L257"},{"ref":"crates/oxc_formatter_core/src/printer/mod.rs:779-786","code":"  779 |         match text {\n  780 |             Text::Token(text) => {\n  781 |                 // SAFETY: `text` is a ASCII-only string\n  782 |                 unsafe {\n  783 |                     self.state.buffer.print_bytes_unchecked(text.as_bytes());\n  784 |                 }\n  785 |                 self.state.line_width += text.len();\n  786 |             }","lines":8,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_formatter_core/src/printer/mod.rs#L779-L786"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"Tailwind class sorting allocates a fresh heap `String` for every emitted class run via `.to_string()` on each write path (string literal content, preserve-whitespace, and three template-element branches). For class-heavy files this is one allocation per class attribute/quasi even though the underlying text is already arena-resident `&str`. The collected strings are only ever read back for sorting.","fix":"Store `&'a str` (arena/source slices) or `Cow<'a, str>` in the tailwind-class collection instead of owned `String`s, allocating only for the rare normalized/trimmed cases, to avoid an allocation per class.","locations":[{"ref":"crates/oxc_formatter/src/utils/tailwindcss.rs:267","code":"  267 |         let index = f.context_mut().add_tailwind_class(content.to_string());","lines":1,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_formatter/src/utils/tailwindcss.rs#L267"},{"ref":"crates/oxc_formatter/src/utils/tailwindcss.rs:294","code":"  294 |     let index = f.context_mut().add_tailwind_class(trimmed.to_string());","lines":1,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_formatter/src/utils/tailwindcss.rs#L294"},{"ref":"crates/oxc_formatter/src/utils/tailwindcss.rs:267","code":"  267 |         let index = f.context_mut().add_tailwind_class(content.to_string());","lines":1,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_formatter/src/utils/tailwindcss.rs#L267"},{"ref":"crates/oxc_formatter/src/utils/tailwindcss.rs:294","code":"  294 |     let index = f.context_mut().add_tailwind_class(trimmed.to_string());","lines":1,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_formatter/src/utils/tailwindcss.rs#L294"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`DirectivesStore::report_unused` reads each file's full source from disk again via `std::fs::read_to_string` (falling back to an empty string on error) purely to wrap diagnostics with source context. The source text was already in memory during linting. On large projects this re-reads every file with a disable directive.","fix":"Carry the already-loaded source text (or a cheap handle to it) alongside the stored `DisableDirectives` so unused-directive diagnostics can be wrapped without a second disk read.","locations":[{"ref":"crates/oxc_linter/src/lint_runner.rs:91-109","code":"   91 |     pub fn report_unused(&self, severity: AllowWarnDeny, cwd: &Path, tx_error: &DiagnosticSender) {\n   92 |         use crate::create_unused_directives_diagnostics;\n   93 | \n   94 |         let map = self.map.lock().expect(\"DirectivesStore mutex poisoned in report_unused\");\n   95 |         for (path, directives) in map.iter() {\n   96 |             let diagnostics = create_unused_directives_diagnostics(directives, severity);\n   97 | \n   98 |             if !diagnostics.is_empty() {\n   99 |                 let source_text = std::fs::read_to_string(path.as_path()).unwrap_or_default();\n  100 |                 let wrapped = DiagnosticService::wrap_diagnostics(\n  101 |                     cwd,\n  102 |                     path.clone(),\n  103 |                     &source_text,\n  104 |                     diagnostics,\n  105 |                 );\n  106 |                 tx_error.send(wrapped).expect(\"failed to send unused directive diagnostics\");\n  107 |             }\n  108 |         }\n  109 |     }","lines":19,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_linter/src/lint_runner.rs#L91-L109"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"JSX `__source` line/column computation builds and rescans the source `Rope` per-offset. `get_line_column` lazily builds a `Rope` once (good), but `get_line_column(rope, offset, source_text)` performs an O(log n)+ lookup for every JSX opening element, and the code's own TODO acknowledges this is expensive. For files with many JSX elements in development mode this is repeated work that could be replaced by a precomputed line-start table giving O(log lines) lookups with far less constant overhead.","fix":"Build a sorted `Vec<u32>` of line-start byte offsets once on first use and binary-search it for line/column, as the existing TODO comment suggests, instead of relying on `Rope` per call.","locations":[{"ref":"crates/oxc_transformer/src/jsx/jsx_source.rs:81-87","code":"   81 |     pub fn get_line_column(&mut self, offset: u32, ctx: &TraverseCtx<'a>) -> (u32, u32) {\n   82 |         let source_rope =\n   83 |             self.source_rope.get_or_insert_with(|| Rope::from_str(ctx.state.source_text));\n   84 |         let (line, column) = get_line_column(source_rope, offset, ctx.state.source_text);\n   85 |         // line and column are zero-indexed, but we want 1-indexed\n   86 |         (line + 1, column + 1)\n   87 |     }","lines":7,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_transformer/src/jsx/jsx_source.rs#L81-L87"},{"ref":"crates/oxc_transformer/src/jsx/jsx_source.rs:122-125","code":"  122 |         // TODO: We shouldn't calculate line + column from scratch each time as it's expensive.\n  123 |         // Build a table of byte indexes of each line's start on first usage, and save it.\n  124 |         // Then calculate line and column from that.\n  125 |         let (line, column) = self.get_line_column(elem.span.start, ctx);","lines":4,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_transformer/src/jsx/jsx_source.rs#L122-L125"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`convert_and_call_external_linter` builds two fresh `Vec<u32>` for every linted file by mapping over `external_rules` twice (`map(...).collect()` for rule ids and again for option ids), allocating on each file even though `external_rules` is a stable slice for the file's resolved config.","fix":"If the JS callback signature allows it, pass iterators/slices, or precompute and cache these id vectors per resolved config rather than per file.","locations":[{"ref":"crates/oxc_linter/src/lib.rs:848-851","code":"  848 |         let result = (external_linter.lint_file)(\n  849 |             path_string.to_owned(),\n  850 |             external_rules.iter().map(|(rule_id, _, _)| rule_id.raw()).collect(),\n  851 |             external_rules.iter().map(|(_, options_id, _)| options_id.raw()).collect(),","lines":4,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_linter/src/lib.rs#L848-L851"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`get_component_name` walks all ancestors and ends with `unreachable!()` as the loop's final fallthrough. The `unreachable!()` at line 602 relies on always hitting an `is_parent_of_statement` ancestor before exhausting the iterator. This holds because the root is always a `Program`, but the contract is implicit; if `ctx.ancestors()` is ever called in a context detached from a statement (future refactor), this becomes a panic instead of returning `None`.","fix":"Replace the trailing `unreachable!()` with `assignment_name` (or `None`) so exhausting ancestors degrades gracefully instead of panicking.","locations":[{"ref":"crates/oxc_transformer/src/plugins/styled_components.rs:548-605","code":"  548 |     fn get_component_name(ctx: &TraverseCtx<'a>) -> Option<Str<'a>> {\n  549 |         let mut assignment_name = None;\n  550 | \n  551 |         for ancestor in ctx.ancestors() {\n  552 |             match ancestor {\n  553 |                 // `X = styled` or `X.prop = styled`\n  554 |                 Ancestor::AssignmentExpressionRight(assignment) => {\n  555 |                     assignment_name = match assignment.left() {\n  556 |                         // we've got an displayName (if we need it) no need to continue\n  557 |                         // However if this is an assignment expression like X = styled then we\n  558 |                         // want to keep going up incase there is Y = X = styled; in this case we\n  559 |                         // want to pick the outer name because react-refresh will add HMR variables\n  560 |                         // like this: X = _a = styled. We could also consider only doing this if the\n  561 |                         // name starts with an underscore.\n  562 |                         AssignmentTarget::AssignmentTargetIdentifier(ident) => {\n  563 |                             Some(ident.name.into())\n  564 |                         }\n  565 |                         AssignmentTarget::StaticMemberExpression(member) => {\n  566 |                             Some(member.property.name.into())\n  567 |                         }\n  568 |                         _ => return None,\n  569 |                     };\n  570 |                 }\n  571 |                 // `const X = styled`\n  572 |                 Ancestor::VariableDeclaratorInit(declarator) => {\n  573 |                     return if let BindingPattern::BindingIdentifier(ident) = &declarator.id() {\n  574 |                         Some(ident.name.into())\n  575 |                     } else {\n  576 |                         None\n  577 |                     };\n  578 |                 }\n  579 |                 // `const X = { Y: styled }`\n  580 |                 Ancestor::ObjectPropertyValue(property) => {\n  581 |                     return if let PropertyKey::StaticIdentifier(ident) = property.key() {\n  582 |                         Some(ident.name.into())\n  583 |                     } else {\n  584 |                         None\n  585 |                     };\n  586 |                 }\n  587 |                 // `class Y { (static) X = styled }`\n  588 |                 Ancestor::PropertyDefinitionValue(property) => {\n  589 |                     return if let PropertyKey::StaticIdentifier(ident) = property.key() {\n  590 |                         Some(ident.name.into())\n  591 |                     } else {\n  592 |                         None\n  593 |                     };\n  594 |                 }\n  595 |                 _ => {\n  596 |                     if ancestor.is_parent_of_statement() {\n  597 |                         // we've hit a statement, we should stop crawling up\n  598 |                         return assignment_name;\n  599 |                     }\n  600 |                 }\n  601 |             }\n  602 |         }\n  603 | \n  604 |         unreachable!()\n  605 |     }","lines":58,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_transformer/src/plugins/styled_components.rs#L548-L605"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"In `compute_diagnostics`, the `else if runtime_map.contains_key(filename)` branch is unreachable: it sits in the `else` arm of `if let Some(_) = runtime_map.get(filename)`, so reaching it already implies `get` returned `None`, hence `contains_key` is always `false`. The `has_unused = true` inside it can never execute.","fix":"Remove the dead `else if runtime_map.contains_key(filename)` branch, or fix the intended condition (the comment suggests it was meant to flag a static file that is missing from runtime results).","locations":[{"ref":"crates/oxc_linter/src/suppression/mod.rs:253-280","code":"  253 |         for (filename, static_rules) in static_map.iter() {\n  254 |             if let Some(runtime_rules) = runtime_map.get(filename) {\n  255 |                 for (rule, static_count) in static_rules {\n  256 |                     if let Some(runtime_count) = runtime_rules.get(rule) {\n  257 |                         if static_count.count > runtime_count.count {\n  258 |                             has_unused = true;\n  259 |                         } else if static_count.count < runtime_count.count {\n  260 |                             has_new = true;\n  261 |                         }\n  262 |                     } else {\n  263 |                         has_unused = true;\n  264 |                     }\n  265 |                     if has_unused && has_new {\n  266 |                         break;\n  267 |                     }\n  268 |                 }\n  269 | \n  270 |                 if !(has_unused && has_new) {\n  271 |                     for rule in runtime_rules.keys() {\n  272 |                         if !static_rules.contains_key(rule) {\n  273 |                             has_new = true;\n  274 |                             break;\n  275 |                         }\n  276 |                     }\n  277 |                 }\n  278 |             } else if runtime_map.contains_key(filename) {\n  279 |                 has_unused = true;\n  280 |             }","lines":28,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_linter/src/suppression/mod.rs#L253-L280"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"In print_expr_comments, `self.comments.remove(&start)` returns early via `let ... else` when the key is absent, and comment entries are only ever stored non-empty (pushed in build_comments; empty entries are removed in print_legal_orphans_before). So `comments` is always non-empty here and the `if comments.is_empty()` branch returning `false` is unreachable dead code.","fix":"Drop the `is_empty` check and always print the trailing newline and return `true`.","locations":[{"ref":"crates/oxc_codegen/src/comment.rs:335-348","code":"  335 |         let Some(comments) = self.comments.remove(&start) else { return false };\n  336 | \n  337 |         for comment in &comments {\n  338 |             self.print_hard_newline();\n  339 |             self.print_indent();\n  340 |             self.print_comment(comment);\n  341 |         }\n  342 | \n  343 |         if comments.is_empty() {\n  344 |             false\n  345 |         } else {\n  346 |             self.print_hard_newline();\n  347 |             true\n  348 |         }","lines":14,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_codegen/src/comment.rs#L335-L348"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"`ModuleGraphVisitorBuilder::enter` and `leave` setters are commented out, so `EnterFn`/`LeaveFn`, the `enter`/`leave` builder fields, and the corresponding parameters threaded through `filter_fold_while`/`filter_fold_recursive` are unreachable - they are always defaulted to no-op closures. This is a meaningful chunk of unused machinery.","fix":"Either re-enable the `enter`/`leave` builder methods if they are intended API, or remove the enter/leave fields, type aliases, and parameters entirely.","locations":[{"ref":"crates/oxc_linter/src/module_graph_visitor.rs:80-92","code":"   80 |     // /// Sets the enter module event closure.\n   81 |     // #[must_use]\n   82 |     // pub fn enter<F: FnMut(ModulePair, &ModuleRecord) + 'a>(mut self, enter: F) -> Self {\n   83 |     // self.enter = Some(Box::new(enter));\n   84 |     // self\n   85 |     // }\n   86 | \n   87 |     // /// Sets the leave module event closure.\n   88 |     // #[must_use]\n   89 |     // pub fn leave<F: FnMut(ModulePair, &ModuleRecord) + 'a>(mut self, leave: F) -> Self {\n   90 |     // self.leave = Some(Box::new(leave));\n   91 |     // self\n   92 |     // }","lines":13,"link":"https://github.com/oxc-project/oxc/blob/3f0318739fcffb18c37a78c40eaaa09313bf093a/crates/oxc_linter/src/module_graph_visitor.rs#L80-L92"},{"ref":"crates/oxc_linter/src/module_graph_visitor.rs:106-111","code":"  106 |         let filter = self.filter.unwrap_or_else(|| Box::new(|_, _| true));\n  107 |         let event = self.event.unwrap_or_else(|| Box::new(|_, _, _| {}));\n  108 |         let enter = self.enter.unwrap_or_else(|| Box::new(|_, _| {}));\n  109 |         let leave = self.leave.unwrap_or_else(|| Box::new(|_, _| {}));\n  110 |         let result =\n  111 |             visitor.filter_fold_while(initial_value, module, filter, visit, event, enter, leave);","lines":6,"link":"https://github.com/oxc-pr
