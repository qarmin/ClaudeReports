{"id":"DUP_2","type":"duplicate_code","type_label":"Duplicate Code","severity":"medium","difficulty":"medium","description":"`Create::create` (`packages/cli/src/cli/create.rs:57-111`) and `Init::init` (`packages/cli/src/cli/init.rs:53-93`) duplicate the same ~30-line orchestration: resolve the project name, run `check_connectivity`, call `resolve_template_and_branch`, `create_dir_all` the destination, build an almost-identical `GenerateArgs` (only `verbose` and `destination` handling differ slightly), call `cargo_generate::generate`, then call `post_create`. Any future fix to this flow (e.g. the `is_workspace`/git-init bug noted separately, or error handling around `cargo_generate::generate`) has to be applied in two places and is easy to forget for the other one.","fix":"Extract a shared helper, e.g. `pub(crate) async fn generate_project(path: PathBuf, name: Option<String>, template: Option<String>, branch: Option<String>, revision: Option<String>, tag: Option<String>, subtemplate: Option<String>, option: Vec<String>, yes: bool, vcs: Option<Vcs>, verbose: bool) -> Result<PathBuf>` that both `Create::create` and `Init::init` call, keeping only their CLI-specific differences (e.g. `Create` requires an explicit path and does the pre-existence `check_path` check, `Init` defaults to `.`) in the two thin wrappers.","locations":[{"ref":"packages/cli/src/cli/create.rs:57-111","code":"   57 | impl Create {\n   58 |     pub async fn create(mut self) -> Result<StructuredOutput> {\n   59 |         // Project name defaults to directory name.\n   60 |         if self.name.is_none() {\n   61 |             self.name = Some(create::name_from_path(&self.path)?);\n   62 |         }\n   63 | \n   64 |         check_path(&self.path).await?;\n   65 | \n   66 |         // Perform a connectivity check so we just don't it around doing nothing if there's a network error\n   67 |         if self.template.is_none() {\n   68 |             check_connectivity().await?;\n   69 |         }\n   70 | \n   71 |         // If no template is specified, use the default one and set the branch to the latest release.\n   72 |         resolve_template_and_branch(&mut self.template, &mut self.branch);\n   73 | \n   74 |         // cargo-generate requires the path to be created first.\n   75 |         std::fs::create_dir_all(&self.path)?;\n   76 | \n   77 |         let args = GenerateArgs {\n   78 |             define: self.option,\n   79 |             destination: Some(self.path),\n   80 |             // NOTE: destination without init means base_dir + name, with —\n   81 |             // means dest_dir. So use `init: true` and always handle\n   82 |             // the dest_dir manually and carefully.\n   83 |             // Cargo never adds name to the path. Name is solely for project name.\n   84 |             // https://github.com/cargo-generate/cargo-generate/issues/1250\n   85 |             init: true,\n   86 |             name: self.name,\n   87 |             silent: self.yes,\n   88 |             vcs: self.vcs,\n   89 |             template_path: TemplatePath {\n   90 |                 auto_path: self.template,\n   91 |                 branch: self.branch,\n   92 |                 revision: self.revision,\n   93 |                 subfolder: self.subtemplate,\n   94 |                 tag: self.tag,\n   95 |                 ..Default::default()\n   96 |             },\n   97 |             verbose: crate::logging::VERBOSITY\n   98 |                 .get()\n   99 |                 .map(|f| f.verbose)\n  100 |                 .unwrap_or(false),\n  101 |             ..Default::default()\n  102 |         };\n  103 | \n  104 |         tracing::debug!(dx_src = ?TraceSrc::Dev, \"Creating new project with args: {args:#?}\");\n  105 |         let path = cargo_generate::generate(args)?;\n  106 | \n  107 |         _ = post_create(&path, &self.vcs.unwrap_or(Vcs::Git));\n  108 | \n  109 |         Ok(StructuredOutput::Success)\n  110 |     }\n  111 | }","lines":55,"link":"https:/ {"id":"DUP_3","type":"duplicate_code","type_label":"Duplicate Code","severity":"medium","difficulty":"medium","description":"`packages/cli/src/config/bundle.rs` and `packages/cli/src/config/manifest.rs` define near-identical struct schemas twice, once as the legacy `BundleConfig`-nested settings and once as the new unified per-platform config: `WixSettings` (`bundle.rs:100-150`) vs `WindowsWixSettings` (`manifest.rs:1137-1204`) share all 16 fields; `NsisSettings` (`bundle.rs:290-319`) vs `WindowsNsisSettings` (`manifest.rs:1206-1256`) share all fields; `MacOsSettings` (`bundle.rs:152-218`) vs `MacosConfig`'s bundle-related fields (`manifest.rs:811-937`) overlap heavily (`bundle_version`, `frameworks`, `minimum_system_version`, `signing_identity`, `provider_short_name`, `entitlements`, `info_plist_path`/`info_plist`, `bundle_name`, `files`, `hardened_runtime`); `AndroidSettings` (`bundle.rs:344-351`) vs `AndroidSigningConfig` (`manifest.rs:667-680`) are field-for-field identical (`jks_file`, `jks_password`, `key_alias`, `key_password`); `DebianSettings` (`bundle.rs:44-98`) vs `LinuxDebSettings` (`manifest.rs:1380-1437`) share all fields; `WebviewInstallMode` (`bundle.rs:329-342`) vs `WindowsWebviewInstallMode` (`manifest.rs:1258-1281`) are the same enum; `CustomSignCommandSettings` (`bundle.rs:353-361`) vs `WindowsSignCommand` (`manifest.rs:1283-1290`) are identical. This is hundreds of lines of duplicated schema that must be kept in sync by hand, and (per the other finding in this file) one copy of each pair is effectively dead code.","fix":"Pick a single source of truth for each platform settings struct (the unified `manifest.rs` schema seems to be the intended direction given the doc comments say it 'replaces' the bundle.rs versions). Have the legacy `BundleConfig` fields either be removed, or become thin `#[serde(alias/deprecated)]` wrappers that deserialize into the same shared struct used by `manifest.rs`, instead of maintaining two independent struct definitio {"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"high","difficulty":"hard","description":"Most of the new unified per-platform manifest schema in `manifest.rs` is parsed from `Dioxus.toml` but never actually consumed by the build/bundle pipeline. `WindowsConfig` (the whole `[windows]` section: `wix`, `nsis`, `icon_path`, `webview_install_mode`, `allow_downgrades`, `sign_command`, `capabilities`, etc, `manifest.rs:1039-1135`) and `LinuxConfig` (the whole `[linux]` section: `deb`, `flatpak_permissions`, `dbus_access`, `categories`, `keywords`, `mime_types`, `manifest.rs:1309-1377`) have zero readers anywhere in `packages/cli/src` outside of `manifest.rs`/`config/mod.rs` themselves. Likewise `AndroidConfig.signing` (`manifest.rs:589-590`, backed by `AndroidSigningConfig` at `manifest.rs:667-680`) is documented as replacing the deprecated `[bundle.android]` section (see the doc comment at `manifest.rs:533-534`, `\"This replaces the deprecated [bundle.android] section\"`), but the actual Android build code in `packages/cli/src/build/android.rs:183` still reads `self.config.bundle.android` (the legacy `AndroidSettings` from `bundle.rs:344-351`) and feeds it into the `build.gradle.kts.hbs` template (`packages/cli/assets/android/gen/app/build.gradle.kts.hbs:19-25`) - `android.signing` (jks_file/jks_password/key_alias/key_password) is never read. Similarly `bundler/mod.rs:100` and `bundler/mod.rs:425` only read `build.config.bundle.windows`/`.macos`/`.deb` (the legacy `bundle.rs` structs), not the new `WindowsConfig`/`MacosConfig`/`LinuxConfig`. Even `MacosConfig` itself is mostly dead: only `.plist`, `.raw.info_plist`, `.entitlements`, and `.raw.entitlements` are read (`packages/cli/src/build/apple.rs:216-217,495,594`); fields like `signing_identity`, `bundle_version`, `bundle_name`, `provider_short_name`, `hardened_runtime`, `frameworks`, `minimum_system_version`, `info_plist`, `category`, `document_types` etc are parsed but never consulted. A user who configures signing, WiX/NSIS installer options, or Linux packaging using the documented new schema will have that configuration silently ignored, while the legacy/deprecated `[bundle.*]` sections keep controlling the actual build - this is a functional correctness and security-relevant footgun (e.g. an Android release could ship without the intended signing config, with no error or warning).","fix":"Either wire `AndroidConfig.signing`, `WindowsConfig`, `LinuxConfig`, and the unused `MacosConfig` fields into the actual build/bundle pipeline (replacing the reads of `config.bundle.android/windows/macos/deb`), or remove/deprecate the unused fields and update the doc comments so they don't claim functionality that doesn't exist. At minimum, add a startup validation that warns when a user sets `[android.signing]`, `[windows.wix]`, `[windows.nsis]`, `[linux.deb]`, etc. so the config isn't silently a no-op.","locations":[{"ref":"packages/cli/src/config/manifest.rs:589-590","code":"  589 |     #[serde(default)]\n  590 |     pub signing: Option<AndroidSigningConfig>,","lines":2,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/config/manifest.rs#L589-L590"},{"ref":"packages/cli/src/config/manifest.rs:667-680","code":"  667 | #[derive(Debug, Clone, Serialize, Deserialize, JsonSchema)]\n  668 | pub struct AndroidSigningConfig {\n  669 |     /// Path to the Java keystore file.\n  670 |     pub jks_file: PathBuf,\n  671 | \n  672 |     /// Password for the keystore.\n  673 |     pub jks_password: String,\n  674 | \n  675 |     /// Alias of the key in the keystore.\n  676 |     pub key_alias: String,\n  677 | \n  678 |     /// Password for the key.\n  679 |     pub key_password: String,\n  680 | }","lines":14,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/config/manifest.rs#L667-L680"},{"ref":"packages/cli/src/config/manifest.rs:1039-1135","code":" 1039 | {"id":"ARCH_2","type":"architecture","type_label":"Architecture","severity":"medium","difficulty":"medium","description":"`packages/desktop/build.rs`'s `check_gnu()` unconditionally appends `EXAMPLES_TOML` to `Cargo.toml` in append mode whenever `DIOXUS_RELEASE` is set, with no check for whether the block was already appended. Cargo re-runs build scripts whenever any file in the package changes (this build.rs has no `cargo:rerun-if-changed` directives to narrow that down), so any repeated build with `DIOXUS_RELEASE` set (e.g. re-running `cargo publish --dry-run`, `cargo doc`, or CI retries) will append the `[[example]]` blocks again, growing `Cargo.toml` and eventually producing duplicate `[[example]] name = \"...\"` entries, which Cargo rejects as a manifest error.","fix":"Before appending, check whether `Cargo.toml` already contains the marker (e.g. search for `name = \"video_stream\"` or a dedicated sentinel comment) and skip the append if it's already present, or write to a separate included manifest instead of mutating `Cargo.toml` in place.","locations":[{"ref":"packages/desktop/build.rs:14-38","code":"   14 |     // To prepare for a release, we add extra examples to desktop for doc scraping and copy assets from the workspace to make those examples compile\n   15 |     if option_env!(\"DIOXUS_RELEASE\").is_some() {\n   16 |         // Append EXAMPLES_TOML to the cargo.toml\n   17 |         let cargo_toml = std::fs::OpenOptions::new()\n   18 |             .append(true)\n   19 |             .open(\"Cargo.toml\")\n   20 |             .unwrap();\n   21 |         let mut write = std::io::BufWriter::new(cargo_toml);\n   22 |         write.write_all(EXAMPLES_TOML.as_bytes()).unwrap();\n   23 | \n   24 |         // Copy the assets from the workspace to the examples directory\n   25 |         let crate_dir = PathBuf::from(std::env::var(\"CARGO_MANIFEST_DIR\").unwrap());\n   26 |         let workspace_dir = crate_dir.parent().unwrap().parent().unwrap();\n   27 | {"id":"ARCH_3","type":"architecture","type_label":"Architecture","severity":"medium","difficulty":"medium","description":"When `SsrRendererPool::check_cached_route` serves a cache hit for an incrementally-rendered route, it always returns an empty `HeaderMap::new()` (see `ssr.rs:152-165`, and the `Ok(None) => HeaderMap::new()` path used in `FullstackState::render_handler`, `server.rs:343-361`). Only the rendered HTML body is cached (`IncrementalRenderer::cache` in `mod.rs:66-81` only stores `route`/`timestamp`/`html`); any custom response headers set during the original render via `FullstackContext`/`streaming_context.take_response_headers()` (e.g. `Set-Cookie`, custom `Content-Security-Policy`, `Vary`, cache directives set by the app) are silently dropped on every subsequent cache hit.\n\nThis is undocumented behavior: nothing in `ServeConfig`/`IncrementalRendererConfig`'s docs warns that per-response headers set by the application are not replayed on cached (ISR) responses, which could cause subtle bugs for apps that rely on headers set during rendering (e.g. auth-adjacent headers, security headers) being present on every response for a given route.","fix":"Either persist the response headers alongside the cached HTML body (extend `IncrementalRenderer::cache`/`get` to store a `HeaderMap` next to the bytes) so cache hits can replay them, or explicitly document that only static, cacheable-safe headers should be relied on for ISR-cached routes.","locations":[{"ref":"packages/fullstack-server/src/ssr.rs:62-92","code":"   62 |     /// Look for a cached route in the incremental cache and send it into the render channel if it exists\n   63 |     fn check_cached_route(\n   64 |         &self,\n   65 |         route: &str,\n   66 |         render_into: &mut Sender<Result<String, IncrementalRendererError>>,\n   67 |     ) -> Option<RenderFreshness> {\n   68 |         let incremental = self.incremental_cache.as_ref()?;\n   69 | \n   70 |         if let Ok(mut incremental) = {"id":"ARCH_5","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"`cargo_toml.rs`'s `extend_manifest_config_toml` only merges `path/.cargo/config.toml` and the global `$CARGO_HOME/config.toml`. Real `cargo` resolves configuration by walking every ancestor directory between the current directory and the filesystem root, merging `.cargo/config.toml` (and the legacy extensionless `.cargo/config`) at each level, in addition to `$CARGO_HOME/config.toml`. Because this module only checks two locations, a workspace member's own `.cargo/config.toml` several directories up (a common layout for large workspaces) or a legacy `config` file (no `.toml` extension) is silently ignored, so profile settings a real `cargo build` would pick up can be missed here.","fix":"Walk from `path` up through every ancestor directory (merging each `.cargo/config.toml`/`.cargo/config` found, closest-wins per cargo's actual precedence) before falling back to the global `$CARGO_HOME/config.toml`, to match cargo's documented config discovery rules.","locations":[{"ref":"packages/cli/src/cargo_toml.rs:9-45","code":"    9 | /// Load the manifest from a path inheriting from the global config where needed\n   10 | pub fn load_manifest_from_path(path: &Path) -> Result<Manifest, cargo_toml::Error> {\n   11 |     let mut original = Manifest::from_path(path)?;\n   12 | \n   13 |     // Merge the .cargo/config.toml if it exists\n   14 |     extend_manifest_config_toml(&mut original, &path.join(\".cargo\").join(\"config.toml\"));\n   15 | \n   16 |     // Merge the global cargo config if it exists\n   17 |     if let Some(global_config) = global_cargo_config_path() {\n   18 |         extend_manifest_config_toml(&mut original, &global_config);\n   19 |     }\n   20 | \n   21 |     Ok(original)\n   22 | }\n   23 | \n   24 | /// Get the path to cargo home\n   25 | fn cargo_home() -> Option<PathBuf> {\n   26 |     // If the cargo home env var is set, use that\n {"id":"ARCH_6","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"very_easy","description":"`mod test_harnesses;` in `main.rs` is not gated behind `#[cfg(test)]`, so the entire `TestHarnessBuilder` scenario-testing engine (which exists solely to drive `#[tokio::test] async fn run_harness()`) is compiled into every build of the `dx` binary, including release builds, even though `#[test]`-annotated functions themselves are stripped from non-test builds. The `#[allow(dead_code)]` on `test_harnesses()` is a symptom of this: the helper builder code only has a live caller in test builds, but the module is compiled unconditionally otherwise, adding needless compile time and code size.","fix":"Gate the module declaration with `#[cfg(test)] mod test_harnesses;` in `main.rs` so the harness code is only compiled for test builds.","locations":[{"ref":"packages/cli/src/main.rs:26","code":"   26 | mod test_harnesses;","lines":1,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/main.rs#L26"},{"ref":"packages/cli/src/test_harnesses.rs:1-21","code":"    1 | use crate::{BuildTargets, BundleFormat, Cli, Commands, Workspace};\n    2 | use anyhow::Result;\n    3 | use clap::Parser;\n    4 | use futures_util::{StreamExt, stream::FuturesUnordered};\n    5 | use std::{\n    6 |     collections::HashSet,\n    7 |     fmt::Write,\n    8 |     path::{Path, PathBuf},\n    9 |     pin::Pin,\n   10 |     prelude::rust_2024::Future,\n   11 | };\n   12 | use target_lexicon::Triple;\n   13 | use tracing_subscriber::{EnvFilter, Layer, prelude::*, util::SubscriberInitExt};\n   14 | \n   15 | #[tokio::test]\n   16 | async fn run_harness() {\n   17 |     test_harnesses().await;\n   18 | }\n   19 | \n   20 | #[allow(dead_code)]\n   21 | async fn test_harnesses() {","lines":21,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/test_harnesses.rs#L1-L21"}]},
{"id":"ARCH_7","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"hard","description":"The workspace contains two separately-published crates with almost identical names and overlapping purpose: `dioxus-config-macro` (`packages/config-macro`, proc-macro crate providing `web!`/`desktop!`/`server_only!` etc. cfg-gated code-emission macros) and `dioxus-config-macros` (`packages/config-macros`, providing the `maybe_wasm_split!` declarative macro for conditional code emission). Both do compile-time conditional codegen but are unrelated crates; the singular/plural naming is easy to confuse for contributors and in dependency listings.","fix":"Rename one of the crates to a clearly distinct name (e.g. `dioxus-wasm-split-macros` for the `maybe_wasm_split!` crate) to avoid confusion between `dioxus-config-macro` and `dioxus-config-macros`.","locations":[{"ref":"packages/config-macro/src/lib.rs:1-38","code":"    1 | #![doc = include_str!(\"../README.md\")]\n    2 | #![doc(html_logo_url = \"https://avatars.githubusercontent.com/u/79236386\")]\n    3 | #![doc(html_favicon_url = \"https://avatars.githubusercontent.com/u/79236386\")]\n    4 | \n    5 | use proc_macro::TokenStream;\n    6 | use proc_macro2::TokenStream as TokenStream2;\n    7 | use quote::quote;\n    8 | \n    9 | macro_rules! define_config_macro {\n   10 |     ($name:ident if $($cfg:tt)+) => {\n   11 |         #[proc_macro]\n   12 |         pub fn $name(input: TokenStream) -> TokenStream {\n   13 |             if cfg!($($cfg)+) {\n   14 |                 let input = TokenStream2::from(input);\n   15 |                 quote! {\n   16 |                     {\n   17 |                         #input\n   18 |                     }\n   19 |                 }\n   20 |             } else {\n   21 |                 quote! {\n   22 |                     ()\n   23 |                 }\n   24 |             }\n   25 |             .into()\n   26 |         }\n   27 |     };\n   28 | }\n   29 | \n   30 {"id":"OTHER_1","type":"other","type_label":"Other","severity":"critical","difficulty":"medium","description":"`deserialize_const_primitive` writes the raw little-endian bytes of a decoded CBOR number directly into the output buffer for any primitive, including `bool` (`impl_serialize_const!(bool)` in the same file). There is no validation that the decoded byte is `0` or `1`. Since `bool` in Rust has only two valid bit patterns (any other byte value is an instantly invalid value), and `deserialize_const_raw` (in `lib.rs`) later does `std::mem::transmute_copy::<[MaybeUninit<u8>; N], T>(&out)` to produce the final `T`, feeding this API attacker-controlled or corrupted bytes (e.g. a struct containing a `bool` field, encoded with CBOR unsigned integer `200`) will transmute an out-of-range byte into a `bool`, which is undefined behavior per Rust's validity invariants - independent of whether the resulting value is ever branched on.","fix":"Reject invalid values before they can be transmuted. Since `PrimitiveLayout` currently only tracks `size` and not the concrete Rust type, either (a) add a `valid_values` check/kind field to `PrimitiveLayout` so `deserialize_const_primitive` can reject out-of-range bytes for `bool` (only 0/1 allowed) and return `None`, or (b) give `bool` its own `SerializeConst` impl with a dedicated deserialize path that validates the byte before accepting it, e.g.:\n```rust\nunsafe impl SerializeConst for bool {\n    const MEMORY_LAYOUT: Layout = Layout::Primitive(PrimitiveLayout { size: 1 });\n}\n// in deserialize_const_primitive, or a bool-specific wrapper:\nif byte > 1 { return None; }\n```","locations":[{"ref":"packages/const-serialize/src/primitive.rs:99-121","code":"   99 | /// Deserialize a primitive type into the out buffer at the offset passed in. Returns a new version of the buffer with the data added.\n  100 | pub(crate) const fn deserialize_const_primitive<'a>(\n  101 |     from: &'a [u8],\n  102 |     layout: &PrimitiveLayout,\n  103 |     out: &mut [MaybeUninit<u8>],\n  104 | ) -> Option<&'a [u8]> {\n  105 |     let mut offset = 0;\n  106 |     let Ok((number, from)) = take_number(from) else {\n  107 |         return None;\n  108 |     };\n  109 |     let bytes = number.to_le_bytes();\n  110 |     while offset < layout.size {\n  111 |         // If the bytes are reversed, walk backwards from the end of the number when filling in bytes\n  112 |         let byte = bytes[offset];\n  113 |         if cfg!(any(target_endian = \"big\", feature = \"test-big-endian\")) {\n  114 |             out[layout.size - offset - 1] = MaybeUninit::new(byte);\n  115 |         } else {\n  116 |             out[offset] = MaybeUninit::new(byte);\n  117 |         }\n  118 |         offset += 1;\n  119 |     }\n  120 |     Some(from)\n  121 | }","lines":23,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/const-serialize/src/primitive.rs#L99-L121"},{"ref":"packages/const-serialize/src/lib.rs:168-181","code":"  168 | pub const unsafe fn deserialize_const_raw<const N: usize, T: SerializeConst>(\n  169 |     from: &[u8],\n  170 | ) -> Option<(&[u8], T)> {\n  171 |     // Create uninitized memory with the size of the type\n  172 |     let mut out = [MaybeUninit::uninit(); N];\n  173 |     // Fill in the bytes into the buffer for the type\n  174 |     let Some(from) = deserialize_const_ptr(from, &T::MEMORY_LAYOUT, &mut out) else {\n  175 |         return None;\n  176 |     };\n  177 |     // Now that the memory is filled in, transmute it into the type\n  178 |     Some((from, unsafe {\n  179 |         std::mem::transmute_copy::<[MaybeUninit<u8>; N], T>(&out)\n  180 |     }))\n  181 | }","lines":14,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/const-serialize/src/lib.rs#L168-L181"}]},
{"id":"OTHER_2","type":"other","type_label":"Other","severity":"medium","difficulty":"hard","description":"`SyncStorage::change_reference` (used by `GenerationalBox::point_to`) acquires locks in an order that is inconsistent with itself when called with swapped arguments: it first locks `other.storage.data` for read (inside `Self::get_split_ref(other)`, held as `other_write` for the whole function body) and only afterwards locks `location.storage.data` for write. If thread A calls `change_reference(A_ptr, B_ptr)` (locks B then A) while thread B concurrently calls `change_reference(B_ptr, A_ptr)` (locks A then B), this is a classic AB-BA lock-order inversion and can deadlock the two threads holding `parking_lot::RwLock`s on `A_ptr.storage` and `B_ptr.storage` with no timeout or detection. Because `SyncStorage`/`point_to` is precisely the API meant to be used from multiple threads (`SyncSignal`, `SyncStorage`), this concurrent-swap pattern is a realistic trigger, e.g. two threads independently redirecting two signals to point at each other's targets.","fix":"Establish a total lock order independent of argument position before acquiring the two locks, e.g. compare `location.storage as *const SyncStorage as usize` and `other.storage as *const SyncStorage as usize` and always lock the lower address first, or acquire both locks via `try_write`/`try_read` with backoff instead of blocking acquisition.","locations":[{"ref":"packages/generational-box/src/sync.rs:357-395","code":"  357 |     fn change_reference(\n  358 |         location: GenerationalPointer<Self>,\n  359 |         other: GenerationalPointer<Self>,\n  360 |     ) -> BorrowResult {\n  361 |         if location == other {\n  362 |             return Ok(());\n  363 |         }\n  364 | \n  365 |         let (other_final, other_write) = Self::get_split_ref(other)?;\n  366 | \n  367 |         let mut write = location.storage.data.write();\n  368 |         // First check if the generation is still valid\n  369 |         if !write.valid(&location.location) {\n  370 |             return Err(BorrowError::Dropped(ValueDroppedError::new_for_location(\n  371 |                 location.location,\n  372 |             )));\n  373 |         }\n  374 | \n  375 |         if let (RwLockStorageEntryData::Reference(reference), RwLockStorageEntryData::Rc(data)) =\n  376 |             (&mut write.data, &other_write.data)\n  377 |         {\n  378 |             if reference == &other_final {\n  379 |                 return Ok(());\n  380 |             }\n  381 |             drop_ref(*reference);\n  382 |             *reference = other_final;\n  383 |             data.add_ref();\n  384 |         } else {\n  385 |             tracing::trace!(\n  386 |                 \"References should always point to a data entry directly found {:?} instead\",\n  387 |                 other_write.data\n  388 |             );\n  389 |             return Err(BorrowError::Dropped(ValueDroppedError::new_for_location(\n  390 |                 other_final.location,\n  391 |             )));\n  392 |         }\n  393 | \n  394 |         Ok(())\n  395 |     }","lines":39,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/generational-box/src/sync.rs#L357-L395"}]},
{"id":"OTHER_3","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"Several proc-macro parsing paths in `fullstack-macro` use `panic!`/`unimplemented!` instead of returning a `syn::Error`, for conditions that are directly triggerable by ordinary (if mistaken) user code, e.g.:\n- A `#[server]`/`#[get]`/etc. function with a `&self`/`self` receiver hits `FnArg::Receiver(_receiver) => panic!(\"Self type is not supported\")` (three separate copies at different call sites) or `unimplemented!(\"Self type is not supported\")`.\n- `new_from_string` panics on an unrecognized HTTP method string instead of surfacing a compile error.\n- `doc_iter` panics (`panic!(\"doc attribute is not a name-value attribute\")`, etc.) if a `#[doc]` attribute isn't in the expected shape.\n\nBecause these run during macro expansion, a user hitting one of these conditions gets a raw `proc macro panicked` message instead of a normal, span-pointing compiler error, which is a materially worse debugging experience than the `syn::Error` path used elsewhere in the same file (e.g. the path-parameter-not-found errors in `CompiledRoute::from_route`).","fix":"Replace these `panic!`/`unimplemented!` calls with `return Err(syn::Error::new(span, \"...\"))` (propagated through the existing `syn::Result` return types) so misuse produces a normal compile error pointing at the offending code, consistent with the rest of the macro's error handling.","locations":[{"ref":"packages/fullstack-macro/src/lib.rs:235","code":"  235 |             FnArg::Receiver(_receiver) => panic!(\"Self type is not supported\"),","lines":1,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/fullstack-macro/src/lib.rs#L235"},{"ref":"packages/fullstack-macro/src/lib.rs:317","code":"  317 |             FnArg::Receiver(_) => panic!(\"Self type is not supported\"),","lines":1,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/fullstack-macro/src/lib.rs#L317"},{"ref":"packages/fullstack-macro/src/lib.rs:427-428","code":"  427 |             FnArg::Receiver(_receiver) => panic!(),\n  428 |         };","lines":2,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/fullstack-macro/src/lib.rs#L427-L428"},{"ref":"packages/fullstack-macro/src/lib.rs:850","code":"  850 |                     unimplemented!(\"Self type is not supported\")","lines":1,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/fullstack-macro/src/lib.rs#L850"},{"ref":"packages/fullstack-macro/src/lib.rs:1463","code":" 1463 |             _ => panic!(\"expected one of (GET, POST, PUT, DELETE, HEAD, CONNECT, OPTIONS, TRACE)\"),","lines":1,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/fullstack-macro/src/lib.rs#L1463"},{"ref":"packages/fullstack-macro/src/lib.rs:1317-1325","code":" 1317 |             let Meta::NameValue(meta) = &attr.meta else {\n 1318 |                 panic!(\"doc attribute is not a name-value attribute\");\n 1319 |             };\n 1320 |             let Expr::Lit(lit) = &meta.value else {\n 1321 |                 panic!(\"doc attribute is not a string literal\");\n 1322 |             };\n 1323 |             let Lit::Str(lit_str) = &lit.lit else {\n 1324 |                 panic!(\"doc attribute is not a string literal\");\n 1325 |             };","lines":9,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/fullstack-macro/src/lib.rs#L1317-L1325"}]},
{"id":"OTHER_4","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"In `RcStorageEntry::drop_ref`, the local variable is named `new_ref_count` but `AtomicU64::fetch_sub` returns the value *before* the subtraction, not after. The subsequent check `new_ref_count == 0` is therefore comparing the pre-decrement count to zero, not the post-decrement count. The logic happens to be self-consistent only because `RcStorageEntry` is initialized at `0` (via `RcStorageEntry::new`) to represent the *first* implicit owner, with each `new_reference()`/clone calling `add_ref()` for every *additional* owner - so \"the count was already 0 before this decrement\" correctly identifies \"this is the last live reference\", relying on the atomic wrapping from `0` to `u64::MAX` on the final decrement. This invariant is undocumented and the misleading variable name (implying a post-decrement value) makes it very easy for a future contributor to \"fix\" this into `new_ref_count == 1` (the conventional Arc-style check), which would silently reintroduce a premature-free / use-after-free bug for any type with more than one reference.","fix":"Rename the variable to reflect what `fetch_sub` actually returns, and document the \"starts at 0 for the implicit first owner\" invariant:\n```rust\npub fn drop_ref(&self) -> bool {\n    // `fetch_sub` returns the value *before* decrementing. `ref_count` starts at 0\n    // (representing the first, implicit owner), and each additional clone calls\n    // `add_ref()`, so seeing a pre-decrement value of 0 means this was the last owner.\n    let prev_ref_count = self.ref_count.fetch_sub(1, Ordering::SeqCst);\n    prev_ref_count == 0\n}\n```","locations":[{"ref":"packages/generational-box/src/entry.rs:23-31","code":"   23 |     pub fn add_ref(&self) {\n   24 |         self.ref_count.fetch_add(1, Ordering::SeqCst);\n   25 |     }\n   26 | \n   27 |     pub fn drop_ref(&self) -> bool {\n   28 |         let new_ref_count = self.ref_count.fetch_sub(1, Ordering::SeqCst);\n   29 |         new_ref_count == 0\n   30 |     }\n   31 | }","lines":9,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/generational-box/src/entry.rs#L23-L31"}]}

// State

  search: '', searchScope: 'all', groupBy: 'type',

  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    if (S.searchScope !== 'all') p.set('qs', S.searchScope);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('qs'))  { S.searchScope = p.get('qs'); }
  document.getElementById('search-scope').classList.toggle('active', S.searchScope === 'locations');
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build a [project] header block from embedded PROJECT_INFO, so the exported
// findings.toml is self-contained (doesn't depend on a sibling project-info.toml
// that a second, separately-triggered download could silently fail to save).
// '' when there is no project info at all.
function buildProjectToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = PROJECT_INFO || {};
  if (!Object.keys(pi).length) return '';
  const lines = ['[project]'];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n\n';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return buildProjectToml() + chunks.join('\n\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystacks per finding (cleared on full re-render).
// Two variants: everything (default), and file/folder paths only - for when a
// search term (e.g. a directory name like 'dlls/abc') also happens to appear
// inside description/fix prose and you only want path matches.
const _hay = new Map();
const _hayLoc = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}
function hayLocOf(f) {
  if (!_hayLoc.has(f.id)) {
    _hayLoc.set(f.id, f.locations.map(l => l.ref).join(' ').toLowerCase());
  }
  return _hayLoc.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (S.searchScope === 'locations') {
      if (!hayLocOf(f).includes(q)) return false;
    } else if (!hayOf(f).includes(q) && !st.includes(q)) {
      return false;
    }
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  _hayLoc.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    // Single download (was two) - a second auto-triggered download is commonly
    // blocked by the browser unless the user explicitly allows it, which silently
    // drops project-info.toml. Embedding [project] in findings.toml itself avoids
    // that failure mode entirely.
    downloadText(buildFindingsToml(), 'findings.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});
document.getElementById('search-scope').addEventListener('click', e => {
  S.searchScope = S.searchScope === 'locations' ? 'all' : 'locations';
  e.currentTarget.classList.toggle('active', S.searchScope === 'locations');
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
