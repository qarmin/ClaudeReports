{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"`message_pack_content_type` in `msgpack.rs` checks the `Content-Type` header with an exact string match (`\"application/msgpack\"`, `\"application/x-msgpack\"`, or a manual `starts_with`/`ends_with` check), unlike the sibling implementations `is_valid_cbor_content_type` (`cbor.rs`) and `postcard_content_type` (`postcard.rs`), which both parse the header as a `mime::Mime` and compare `type_()`/`subtype()`/`suffix()`. Because the msgpack check is a raw string comparison, a perfectly valid request with `Content-Type: application/msgpack; charset=utf-8` (or any other MIME parameter) is rejected with `MissingMsgPackContentType`, whereas the equivalent CBOR/Postcard request with extra MIME parameters would be accepted. This is the copy-paste drift the payload modules are prone to: one sibling encoding's content-type check was written differently from the other two.","fix":"Rewrite `message_pack_content_type` to parse with the `mime` crate like the other two encodings:\n```rust\nfn message_pack_content_type<B>(req: &Request<B>) -> bool {\n    let Some(content_type) = req.headers().get(\"Content-Type\") else { return false; };\n    let Ok(content_type) = content_type.to_str() else { return false; };\n    let Ok(mime) = content_type.parse::<mime::Mime>() else { return false; };\n    mime.type_() == \"application\"\n        && (mime.subtype() == \"msgpack\" || mime.subtype() == \"x-msgpack\" || mime.suffix().is_some_and(|s| s == \"msgpack\"))\n}\n```","locations":[{"ref":"packages/fullstack/src/payloads/msgpack.rs:122-137","code":"  122 | fn message_pack_content_type<B>(req: &Request<B>) -> bool {\n  123 |     let Some(content_type) = req.headers().get(\"Content-Type\") else {\n  124 |         return false;\n  125 |     };\n  126 | \n  127 |     let Ok(content_type) = content_type.to_str() else {\n  128 |         return false;\n  129 |     };\n  130 | \n  131 |     match content_type {\n  132 |         \"application/msgpack\" => true,\n  133 |         \"application/x-msgpack\" => true,\n  134 |         ct if ct.starts_with(\"application/\") && ct.ends_with(\"+msgpack\") => true,\n  135 |         _ => false,\n  136 |     }\n  137 | }","lines":16,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/fullstack/src/payloads/msgpack.rs#L122-L137"},{"ref":"packages/fullstack/src/payloads/cbor.rs:32-47","code":"   32 | fn is_valid_cbor_content_type(headers: &HeaderMap) -> bool {\n   33 |     let Some(content_type) = headers.get(header::CONTENT_TYPE) else {\n   34 |         return false;\n   35 |     };\n   36 | \n   37 |     let Ok(content_type) = content_type.to_str() else {\n   38 |         return false;\n   39 |     };\n   40 | \n   41 |     let Ok(mime) = content_type.parse::<mime::Mime>() else {\n   42 |         return false;\n   43 |     };\n   44 | \n   45 |     mime.type_() == \"application\"\n   46 |         && (mime.subtype() == \"cbor\" || mime.suffix().is_some_and(|name| name == \"cbor\"))\n   47 | }","lines":16,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/fullstack/src/payloads/cbor.rs#L32-L47"},{"ref":"packages/fullstack/src/payloads/postcard.rs:81-102","code":"   81 | fn postcard_content_type(headers: &HeaderMap) -> bool {\n   82 |     let content_type = if let Some(content_type) = headers.get(header::CONTENT_TYPE) {\n   83 |         content_type\n   84 |     } else {\n   85 |         return false;\n   86 |     };\n   87 | \n   88 |     let content_type = if let Ok(content_type) = content_type.to_str() {\n   89 |         content_type\n   90 |     } else {\n   91 |         return false;\n   92 |     };\n   93 | \n   94 |     let mime = if let Ok(mime) = content_type.parse::<mime::Mime>() {\n   95 |         mime\n   96 |     } else {\n   97 |         return false;\n   98 |     };\n   99 | \n  100 |     mime.type_() == \"application\"\n  101 |         && (mime.subtype() == \"postcard\" || mime.suffix().is_some_and(|name| name == \"postcard\"))\n  102 | }","lines":22,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/fullstack/src/payloads/postcard.rs#L81-L102"}]},
{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"`MemoryLocationBorrowInfo::borrow_error` (used by `try_read` in both `unsync.rs` and presumably `sync.rs`) reads `self.0.read()` and populates `AlreadyBorrowedMutError { borrowed_mut_at: ... }` under `#[cfg(any(debug_assertions, feature = \"debug_ownership\"))]`. But `self.0` (the `parking_lot::RwLock` field of `MemoryLocationBorrowInfo`) only exists under `#[cfg(any(debug_assertions, feature = \"debug_borrows\"))]`, and the `AlreadyBorrowedMutError::borrowed_mut_at` field is likewise only declared under `debug_borrows` (see `error.rs`). This mismatches the sibling function `borrow_mut_error` in the same file, which correctly uses `debug_borrows` throughout. Building with the `debug_borrows` feature alone (no `debug_assertions`, no `debug_ownership`) will fail to compile: `self.0` exists, but the field initializer that would use it is compiled out, leaving `AlreadyBorrowedMutError`'s mandatory `borrowed_mut_at` field unset.","fix":"Change the cfg predicate in `borrow_error` to match `borrow_mut_error` and the struct definition:\n```rust\npub(crate) fn borrow_error(&self) -> BorrowError {\n    BorrowError::AlreadyBorrowedMut(crate::error::AlreadyBorrowedMutError {\n        #[cfg(any(debug_assertions, feature = \"debug_borrows\"))]\n        borrowed_mut_at: self.0.read().borrowed_mut_at.unwrap(),\n    })\n}\n```","locations":[{"ref":"packages/generational-box/src/entry.rs:92-97","code":"   92 |     pub(crate) fn borrow_error(&self) -> BorrowError {\n   93 |         BorrowError::AlreadyBorrowedMut(crate::error::AlreadyBorrowedMutError {\n   94 |             #[cfg(any(debug_assertions, feature = \"debug_ownership\"))]\n   95 |             borrowed_mut_at: self.0.read().borrowed_mut_at.unwrap(),\n   96 |         })\n   97 |     }","lines":6,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/generational-box/src/entry.rs#L92-L97"},{"ref":"packages/generational-box/src/error.rs:107-111","code":"  107 | #[derive(Debug, Copy, Clone, PartialEq)]\n  108 | pub struct AlreadyBorrowedMutError {\n  109 |     #[cfg(any(debug_assertions, feature = \"debug_borrows\"))]\n  110 |     pub(crate) borrowed_mut_at: &'static std::panic::Location<'static>,\n  111 | }","lines":5,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/generational-box/src/error.rs#L107-L111"}]},
{"id":"CPY_5","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"`ValueDroppedError::new_for_location` gates its `created_at` field assignment with `#[cfg(any(debug_assertions, feature = \"debug_borrows\"))]`, but the `ValueDroppedError` struct itself declares that same field under `#[cfg(any(debug_assertions, feature = \"debug_ownership\"))]` (and the sibling constructor `ValueDroppedError::new` correctly uses `debug_ownership`). `debug_borrows` and `debug_ownership` are two distinct Cargo features (both defined in `packages/generational-box/Cargo.toml`). Since `new_for_location` is reachable from many call sites in `sync.rs`/`unsync.rs`, building with only the `debug_borrows` feature enabled (and `debug_assertions` off, e.g. a release build) will fail to compile: the struct requires `created_at` (via `debug_ownership`, which is off) to be absent, while the constructor tries to assign it under `debug_borrows` (which is on) - a struct-literal field mismatch.","fix":"Make `new_for_location` use the same cfg predicate as the struct definition and `new()`:\n```rust\npub(crate) fn new_for_location(location: GenerationalLocation) -> Self {\n    Self {\n        #[cfg(any(debug_assertions, feature = \"debug_ownership\"))]\n        created_at: location.created_at,\n    }\n}\n```","locations":[{"ref":"packages/generational-box/src/error.rs:75-93","code":"   75 | impl ValueDroppedError {\n   76 |     /// Create a new `ValueDroppedError`.\n   77 |     #[allow(unused)]\n   78 |     pub fn new(created_at: &'static std::panic::Location<'static>) -> Self {\n   79 |         Self {\n   80 |             #[cfg(any(debug_assertions, feature = \"debug_ownership\"))]\n   81 |             created_at,\n   82 |         }\n   83 |     }\n   84 | \n   85 |     /// Create a new `ValueDroppedError` for a [`GenerationalLocation`].\n   86 |     #[allow(unused)]\n   87 |     pub(crate) fn new_for_location(location: GenerationalLocation) -> Self {\n   88 |         Self {\n   89 |             #[cfg(any(debug_assertions, feature = \"debug_borrows\"))]\n   90 |             created_at: location.created_at,\n   91 |         }\n   92 |     }\n   93 | }","lines":19,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/generational-box/src/error.rs#L75-L93"}]},
{"id":"CPY_6","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"`autoformat_project` in `packages/cli/src/cli/autoformat.rs` has the exact same `if files_to_format.is_empty() { return Ok(()); }` check written twice back-to-back with no code in between. The second check is unreachable dead code left over from an edit.","fix":"Remove the duplicated block:\n```rust\nif files_to_format.is_empty() {\n    return Ok(());\n}\n```\nso only one copy remains.","locations":[{"ref":"packages/cli/src/cli/autoformat.rs:167-173","code":"  167 |     if files_to_format.is_empty() {\n  168 |         return Ok(());\n  169 |     }\n  170 | \n  171 |     if files_to_format.is_empty() {\n  172 |         return Ok(());\n  173 |     }","lines":7,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/cli/autoformat.rs#L167-L173"}]},
{"id":"CPY_7","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `Doctor::doctor` in `packages/cli/src/cli/doctor.rs`, the block that resolves `java_home` from `tools.java_home` is duplicated verbatim: it appears once right after the `ndk` check and again right after the `sdk` check, both doing `if let Some(jh) = tools.java_home.as_ref() { java_home = jh.display().to_string(); }`. The second copy is dead, redundant code.","fix":"Delete the second, duplicate block:\n```rust\nif let Some(jh) = tools.java_home.as_ref() {\n    java_home = jh.display().to_string();\n}\n```\nkeeping only the first occurrence.","locations":[{"ref":"packages/cli/src/cli/doctor.rs:101-109","code":"  101 |             if let Some(jh) = tools.java_home.as_ref() {\n  102 |                 java_home = jh.display().to_string();\n  103 |             }\n  104 |             if tools.sdk().exists() {\n  105 |                 sdk = tools.sdk().display().to_string();\n  106 |             }\n  107 |             if let Some(jh) = tools.java_home.as_ref() {\n  108 |                 java_home = jh.display().to_string();\n  109 |             }","lines":9,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/cli/doctor.rs#L101-L109"}]},
{"id":"CPY_8","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `TraceController::telemetry_to_posthog`, the `line` and `file` values are inserted under swapped property keys: `cli_source_file` receives the numeric `line` and `cli_source_line` receives the `file` string. Every telemetry/error event uploaded to PostHog will have these two fields transposed, corrupting crash-location data used for debugging.","fix":"Swap the values to match their key names:\n```rust\n_ = ph_event.insert_prop(\"cli_source_file\", file);\n_ = ph_event.insert_prop(\"cli_source_line\", line);\n_ = ph_event.insert_prop(\"cli_source_column\", column);\n```","locations":[{"ref":"packages/cli/src/logging.rs:534-536","code":"  534 |         _ = ph_event.insert_prop(\"cli_source_file\", line);\n  535 |         _ = ph_event.insert_prop(\"cli_source_line\", file);\n  536 |         _ = ph_event.insert_prop(\"cli_source_column\", column);","lines":3,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/logging.rs#L534-L536"}]},
{"id":"CPY_9","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"`ExtractSingleTextNodeError::log` emits the exact same error message for both the `NonTextNode` and `NonTemplate` variants (`\"The children of {component} must be a single text node\"`), even though the enum's own doc comments describe them as different situations (`NonTextNode`: single child but not text; `NonTemplate`: multiple child nodes). Developers debugging a `Title`/`Script`/`Style` component that failed to render can't tell which case they hit from the log output.","fix":"Differentiate the message for `NonTemplate`, e.g.:\n\n```rust\nExtractSingleTextNodeError::NonTemplate => {\n    tracing::error!(\n        \"Error while rendering {component}: The children of {component} must be a single static or formatted text node, not multiple nodes\"\n    );\n}\n```","locations":[{"ref":"packages/document/src/elements/mod.rs:55-64","code":"   55 |             ExtractSingleTextNodeError::NonTextNode => {\n   56 |                 tracing::error!(\n   57 |                     \"Error while rendering {component}: The children of {component} must be a single text node\"\n   58 |                 );\n   59 |             }\n   60 |             ExtractSingleTextNodeError::NonTemplate => {\n   61 |                 tracing::error!(\n   62 |                     \"Error while rendering {component}: The children of {component} must be a single text node\"\n   63 |                 );\n   64 |             }","lines":10,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/document/src/elements/mod.rs#L55-L64"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"medium","description":"In `check_files_and_report` in `packages/cli/src/cli/check.rs`, each file is read with `tokio::fs::read_to_string(&_path).await.map(|contents| crate::check::check_file(_path, &contents))` inside a `tokio::spawn`. The outer `Result` returned by `tokio::spawn(...).await` is a `Result<Result<IssueReport, io::Error>, JoinError>`. The code only checks `res.is_err()` (which is only `true` on a `JoinError`, i.e. a panic inside the task) and logs `\"error checking file: {}\"` in that case. If `tokio::fs::read_to_string` itself fails (permission denied, non-UTF8 file, broken symlink, etc.), the result is `Ok(Err(io::Error))`, so `res.is_err()` is `false` and nothing is logged at all. The inner `io::Error` is then silently discarded by the later `.flatten().flatten()` chain. This means files that fail to read are silently skipped from the `dx check` report with zero indication to the user, which can hide real issues and make `dx check` under-report problems without any warning.","fix":"Match on the inner `Result` explicitly and log both cases, e.g. after the `tokio::spawn(...).await`, check `match res { Ok(Ok(report)) => Some(report), Ok(Err(io_err)) => { tracing::error!(\"error reading file {}: {io_err}\", path.display()); None }, Err(join_err) => { tracing::error!(\"error checking file {}: {join_err}\", path.display()); None } }` so read failures are surfaced instead of vanishing silently.","locations":[{"ref":"packages/cli/src/cli/check.rs:78-106","code":"   78 | async fn check_files_and_report(files_to_check: Vec<PathBuf>) -> Result<()> {\n   79 |     let issue_reports = files_to_check\n   80 |         .into_iter()\n   81 |         .filter(|file| file.components().all(|f| f.as_os_str() != \"target\"))\n   82 |         .map(|path| async move {\n   83 |             let _path = path.clone();\n   84 |             let res = tokio::spawn(async move {\n   85 |                 tokio::fs::read_to_string(&_path)\n   86 |                     .await\n   87 |                     .map(|contents| crate::check::check_file(_path, &contents))\n   88 |             })\n   89 |             .await;\n   90 | \n   91 |             if res.is_err() {\n   92 |                 tracing::error!(\"error checking file: {}\", path.display());\n   93 |             }\n   94 | \n   95 |             res\n   96 |         })\n   97 |         .collect::<FuturesUnordered<_>>()\n   98 |         .collect::<Vec<_>>()\n   99 |         .await;\n  100 | \n  101 |     // remove error results which we've already printed\n  102 |     let issue_reports = issue_reports\n  103 |         .into_iter()\n  104 |         .flatten()\n  105 |         .flatten()\n  106 |         .collect::<Vec<_>>();","lines":29,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/cli/check.rs#L78-L106"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"In `bundle_linux_rpm`'s inline icon-handling loop, PNG decoding failures are silently swallowed: `if let Ok(file) = fs::File::open(icon_path) { if let Ok(reader) = decoder.read_info() { ... } }` simply drops the icon with no warning if the file can't be opened or its PNG header can't be decoded. This is inconsistent with the copy-pasted twin logic in `copy_linux_icons` (used for `.deb`/AppImage), which propagates the same failures as hard errors via `.with_context(...)?`. As written, an RPM package can silently ship without its icon while the equivalent `.deb`/AppImage build for the same input would fail loudly, which is confusing and makes the RPM icon failure very hard to notice.","fix":"Match the behavior used in `copy_linux_icons`: propagate the error (or at minimum log a `tracing::warn!` when an icon file can't be opened/decoded) instead of silently discarding it, e.g.:\n```rust\n\"png\" => {\n    let file = fs::File::open(icon_path)\n        .with_context(|| format!(\"Failed to open PNG icon: {}\", icon_path.display()))?;\n    let decoder = png::Decoder::new(BufReader::new(file));\n    let reader = decoder.read_info()\n        .with_context(|| format!(\"Failed to decode PNG dimensions: {}\", icon_path.display()))?;\n    ...\n}\n```","locations":[{"ref":"packages/cli/src/bundler/linux.rs:283-300","code":"  283 |                 \"png\" => {\n  284 |                     if let Ok(file) = fs::File::open(icon_path) {\n  285 |                         let decoder = png::Decoder::new(BufReader::new(file));\n  286 |                         if let Ok(reader) = decoder.read_info() {\n  287 |                             let info = reader.info();\n  288 |                             let (w, h) = (info.width, info.height);\n  289 |                             let size = w.max(h);\n  290 |                             let dest =\n  291 |                                 format!(\"/usr/share/icons/hicolor/{size}x{size}/apps/{name}.png\");\n  292 |                             builder = builder\n  293 |                                 .with_file(\n  294 |                                     icon_path,\n  295 |                                     rpm::FileOptions::new(dest).permissions(0o644),\n  296 |                                 )\n  297 |                                 .context(\"Failed to add icon to RPM\")?;\n  298 |                         }\n  299 |                     }\n  300 |                 }","lines":18,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/bundler/linux.rs#L283-L300"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`serialize_const_enum` loops over `layout.variants` looking for the one whose `tag` matches the runtime discriminant read from memory. If no variant matches (which should never happen for a correctly generated layout, but would happen if a layout is malformed or hand-constructed incorrectly via the public `EnumLayout::new`/`EnumVariant::new` API), the loop simply finishes without ever writing the map header, key, or struct data for the enum. Unlike `deserialize_const_enum`, which explicitly tracks `matched_variant` and returns `None` on a mismatch, the serialize side has no equivalent signal: it silently returns `to` unchanged, producing truncated/corrupt CBOR output with no panic or error, which will then fail (or worse, misparse) far away at deserialization time.","fix":"Make the missing-variant case observable close to the source, e.g. panic with a clear message after the loop if no match was found:\n```rust\nlet mut matched = false;\nwhile i < layout.variants.len() {\n    ...\n    if discriminant == *tag {\n        ...\n        matched = true;\n        break;\n    }\n    i += 1;\n}\nassert!(matched, \"no enum variant matched the discriminant; the EnumLayout does not match the type\");\nto\n```","locations":[{"ref":"packages/const-serialize/src/enum.rs:4-28","code":"    4 | pub(crate) const unsafe fn serialize_const_enum(\n    5 |     ptr: *const (),\n    6 |     mut to: ConstVec<u8>,\n    7 |     layout: &EnumLayout,\n    8 | ) -> ConstVec<u8> {\n    9 |     let byte_ptr = ptr as *const u8;\n   10 |     let discriminant = unsafe { layout.discriminant.read(byte_ptr) };\n   11 | \n   12 |     let mut i = 0;\n   13 |     while i < layout.variants.len() {\n   14 |         // If the variant is the discriminated one, serialize it\n   15 |         let EnumVariant {\n   16 |             tag, name, data, ..\n   17 |         } = &layout.variants[i];\n   18 |         if discriminant == *tag {\n   19 |             to = write_map(to, 1);\n   20 |             to = write_map_key(to, name);\n   21 |             let data_ptr = ptr.wrapping_byte_offset(layout.variants_offset as _);\n   22 |             to = unsafe { serialize_const_struct(data_ptr, to, data) };\n   23 |             break;\n   24 |         }\n   25 |         i += 1;\n   26 |     }\n   27 |     to\n   28 | }","lines":25,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/const-serialize/src/enum.rs#L4-L28"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"The doc comment on `Mutations` says \"Note: this list does not contain any `Any` attribute values\", implying `AttributeValue::Any` is simply excluded/omitted from the mutation stream. But `WriteMutations::set_attribute` for `Mutations` does the opposite of quietly excluding it - it `panic!(\"Cannot serialize attribute value\")` whenever it receives `AttributeValue::Any` (or `AttributeValue::Listener`, which should never reach this path anyway). Since `VNode::write_attribute` in `diff/node.rs` forwards every non-`Listener` attribute value straight into `to.set_attribute(...)`, any renderer/tool that uses the default `Mutations`/`WriteMutations` implementation (used for testing, `render_to_vec`-style utilities, and any custom renderer built on top of it) will crash the whole diffing pass the first time a component uses `AttributeValue::any_value` for a dynamic attribute, instead of the documented behavior of the value simply not appearing in the mutation list.","fix":"Either update the implementation to match the documented contract by skipping `Any` values instead of panicking:\n```rust\nfn set_attribute(\n    &mut self,\n    name: &'static str,\n    ns: Option<&'static str>,\n    value: &AttributeValue,\n    id: ElementId,\n) {\n    let value = match value {\n        AttributeValue::Text(s) => AttributeValue::Text(s.clone()),\n        AttributeValue::Bool(b) => AttributeValue::Bool(*b),\n        AttributeValue::Float(n) => AttributeValue::Float(*n),\n        AttributeValue::Int(n) => AttributeValue::Int(*n),\n        AttributeValue::None => AttributeValue::None,\n        // Any/Listener values can't be represented in the serialized mutation log; skip them per the documented contract\n        AttributeValue::Any(_) | AttributeValue::Listener(_) => return,\n    };\n    self.edits.push(Mutation::SetAttribute { name, ns, value, id })\n}\n```\nor, if panicking really is intended, update the doc comment to say so explicitly instead of describing it as simple omission.","locations":[{"ref":"packages/core/src/mutations.rs:420-425","code":"  420 | /// A static list of mutations that can be applied to the DOM. Note: this list does not contain any `Any` attribute values\n  421 | #[derive(Debug, PartialEq, Default)]\n  422 | pub struct Mutations {\n  423 |     /// Any mutations required to patch the renderer to match the layout of the VirtualDom\n  424 |     pub edits: Vec<Mutation>,\n  425 | }","lines":6,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/core/src/mutations.rs#L420-L425"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"very_easy","description":"`android_runtime_lock()` in `packages/desktop/src/android_sync_lock.rs` calls `.lock().unwrap()` on a plain `std::sync::Mutex`. This lock is taken around arbitrary user/webview callbacks at several call sites across the desktop crate (`assets.rs::handle_request`, `event_handlers.rs::apply_event`, `webview.rs`, `app.rs`). If any code running while the lock is held panics (e.g. a user-provided asset handler or event callback), the `Mutex` becomes poisoned, and every subsequent call to `android_runtime_lock()` will panic on `.unwrap()` too - turning one recoverable panic into a permanently broken Android app (every future asset request, IPC event, and render pass panics forever).","fix":"Recover from poisoning instead of propagating it, since the guarded data is just `()`:\n```rust\nRUNTIME_LOCK\n    .get_or_init(|| Mutex::new(()))\n    .lock()\n    .unwrap_or_else(|poisoned| poisoned.into_inner())\n```","locations":[{"ref":"packages/desktop/src/android_sync_lock.rs:5-11","code":"    5 | pub fn android_runtime_lock() -> std::sync::MutexGuard<'static, ()> {\n    6 |     use std::sync::{Mutex, OnceLock};\n    7 | \n    8 |     static RUNTIME_LOCK: OnceLock<Mutex<()>> = OnceLock::new();\n    9 | \n   10 |     RUNTIME_LOCK.get_or_init(|| Mutex::new(())).lock().unwrap()\n   11 | }","lines":7,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/desktop/src/android_sync_lock.rs#L5-L11"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`dioxus_devtools::apply_changes` is defined as `try_apply_changes(dom, msg).unwrap()`, discarding the whole point of `try_apply_changes` returning a `Result<(), PatchError>`. Its only caller in the audited scope, `App::handle_hot_reload_msg` (`packages/desktop/src/app.rs:339`), invokes `apply_changes` (not the fallible `try_apply_changes`), so any hot-patch failure - a legitimately expected outcome the fallible API exists to handle (mismatched jump table, ASLR reference mismatch, bad binary patch, etc.) - crashes the entire running desktop app rather than falling back to a full reload or showing an error toast, even though the desktop crate already has toast infrastructure (`send_toast_to_all`) it could use to report the failure gracefully.","fix":"Use `try_apply_changes` in `handle_hot_reload_msg` and report failures through the existing toast mechanism instead of letting the underlying `.unwrap()` in `apply_changes` crash the app:\n\n```rust\nif let Err(err) = dioxus_devtools::try_apply_changes(&webview.dom, &hr_msg) {\n    tracing::error!(\"Failed to hot-patch: {err:?}\");\n    self.send_toast_to_all(\"Hot-patch failed\", &format!(\"{err}\"), \"error\", TOAST_TIMEOUT_LONG, false);\n    continue;\n}\n```","locations":[{"ref":"packages/devtools/src/lib.rs:12-14","code":"   12 | pub fn apply_changes(dom: &VirtualDom, msg: &HotReloadMsg) {\n   13 |     try_apply_changes(dom, msg).unwrap()\n   14 | }","lines":3,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/devtools/src/lib.rs#L12-L14"}]},
{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`decode_stream_frame_multi` is documented to return `None` only when the frame buffer is empty (\"no more frames\") and `Some(Err(StreamingError::Decoding))` when framing or payload decoding fails. In practice, when `offset_payload_len` succeeds (valid framing, enough bytes) but `E::decode(...)` fails to deserialize the payload into `T` (returns `None`), the function returns plain `None` via `r.map(|r| Ok(r))` - indistinguishable from the legitimate \"buffer empty\" case. The caller `byte_stream_to_client_stream` handles this correctly only in the `UnChecked` state (where a `None` result is forced into `Some(Err(StreamingError::Decoding))`), but in the `Checked` state (subsequent frames within the same byte chunk) a `None` result is passed straight through as the end of the stream. A corrupted second-or-later frame in a chunk is therefore silently treated as a clean stream end instead of surfacing a decode error, truncating the stream without any indication of failure to the caller.","fix":"Change `decode_stream_frame_multi` to distinguish \"no bytes left\" from \"payload failed to decode\", e.g. return a 3-way enum or keep returning `Option<Result<T, StreamingError>>` but only use `None` for the genuinely-empty case:\n```rust\nlet r = E::decode(frame.slice(offset..offset + payload_len));\nframe.advance(offset + payload_len);\nmatch r {\n    Some(v) => Some(Ok(v)),\n    None => Some(Err(StreamingError::Decoding)),\n}\n```\nso every call site (both `Checked` and `UnChecked`) observes decode failures instead of only the first one.","locations":[{"ref":"packages/fullstack/src/payloads/stream.rs:491-535","code":"  491 | fn byte_stream_to_client_stream<E, T, S, E1>(\n  492 |     stream: S,\n  493 | ) -> Pin<Box<dyn Stream<Item = Result<T, StreamingError>> + Send>>\n  494 | where\n  495 |     S: Stream<Item = Result<Bytes, E1>> + 'static + Send,\n  496 |     E: Encoding,\n  497 |     T: DeserializeOwned + 'static,\n  498 | {\n  499 |     Box::pin(stream.flat_map(|bytes| {\n  500 |         enum DecodeIteratorState {\n  501 |             Empty,\n  502 |             Failed,\n  503 |             Checked(Bytes),\n  504 |             UnChecked(Bytes),\n  505 |         }\n  506 | \n  507 |         let mut state = match bytes {\n  508 |             Ok(bytes) => DecodeIteratorState::UnChecked(bytes),\n  509 |             Err(_) => DecodeIteratorState::Failed,\n  510 |         };\n  511 | \n  512 |         futures::stream::iter(std::iter::from_fn(move || {\n  513 |             match std::mem::replace(&mut state, DecodeIteratorState::Empty) {\n  514 |                 DecodeIteratorState::Empty => None,\n  515 |                 DecodeIteratorState::Failed => Some(Err(StreamingError::Failed)),\n  516 |                 DecodeIteratorState::Checked(mut bytes) => {\n  517 |                     let r = decode_stream_frame_multi::<T, E>(&mut bytes);\n  518 |                     if r.is_some() {\n  519 |                         state = DecodeIteratorState::Checked(bytes)\n  520 |                     }\n  521 |                     r\n  522 |                 }\n  523 |                 DecodeIteratorState::UnChecked(mut bytes) => {\n  524 |                     let r = decode_stream_frame_multi::<T, E>(&mut bytes);\n  525 |                     if r.is_some() {\n  526 |                         state = DecodeIteratorState::Checked(bytes);\n  527 |                         r\n  528 |                     } else {\n  529 |                         Some(Err(StreamingError::Decoding))\n  530 |                     }\n  531 |                 }\n  532 |             }\n  533 |         }))\n  534 |     }))\n  535 | }","lines":45,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/fullstack/src/payloads/stream.rs#L491-L535"},{"ref":"packages/fullstack/src/payloads/stream.rs:556-569","code":"  556 | fn decode_stream_frame_multi<T, E>(frame: &mut Bytes) -> Option<Result<T, StreamingError>>\n  557 | where\n  558 |     E: Encoding,\n  559 |     T: DeserializeOwned,\n  560 | {\n  561 |     let (offset, payload_len) = match offset_payload_len(frame)? {\n  562 |         Ok(r) => r,\n  563 |         Err(e) => return Some(Err(e)),\n  564 |     };\n  565 | \n  566 |     let r = E::decode(frame.slice(offset..offset + payload_len));\n  567 |     frame.advance(offset + payload_len);\n  568 |     r.map(|r| Ok(r))\n  569 | }","lines":14,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/fullstack/src/payloads/stream.rs#L556-L569"}]},
{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `build_doc_fields`, parsing the `#[deprecated]` attribute's meta via `crate::utils::DeprecatedAttribute::from_meta` uses `panic!(\"{}\", e.to_string())` on error instead of propagating a `syn::Error`. Since this executes during proc-macro expansion, a malformed `#[deprecated(...)]` attribute on a component argument crashes the proc macro process (\"proc macro panicked\") rather than producing a normal, well-located compiler error via `Error::to_compile_error()`, which is a noticeably worse developer experience and loses the span information that `syn::Error` would have carried.","fix":"Propagate the error instead of panicking, e.g. change `build_doc_fields` to return `Result<Option<DocField<'_>>, syn::Error>` and use `?`/early-return so the caller can turn it into `error.to_compile_error()`, matching how other parse errors in this crate are surfaced.","locations":[{"ref":"packages/core-macro/src/component.rs:441-452","code":"  441 |         deprecation: pt.attrs.iter().find_map(|attr| {\n  442 |             if !attr.path().is_ident(\"deprecated\") {\n  443 |                 return None;\n  444 |             }\n  445 | \n  446 |             let res = crate::utils::DeprecatedAttribute::from_meta(&attr.meta);\n  447 | \n  448 |             match res {\n  449 |                 Err(e) => panic!(\"{}\", e.to_string()),\n  450 |                 Ok(v) => Some(v),\n  451 |             }\n  452 |         }),","lines":12,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/core-macro/src/component.rs#L441-L452"}]},
{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`FullstackContext::add_response_header` silently does nothing if `response_headers` has already been taken via `take_response_headers` (i.e. after the response has been committed). A caller that adds a header slightly too late loses the header with no error, warning, or log line, making the bug hard to notice in production.","fix":"Log when a header is dropped so the mistake is visible:\n\n```rust\npub fn add_response_header(\n    &self,\n    key: impl Into<http::header::HeaderName>,\n    value: impl Into<http::header::HeaderValue>,\n) {\n    let mut lock = self.lock.write();\n    match lock.response_headers.as_mut() {\n        Some(headers) => { headers.insert(key.into(), value.into()); }\n        None => tracing::warn!(\"add_response_header called after the response headers were already committed; header dropped\"),\n    }\n}\n```","locations":[{"ref":"packages/fullstack-core/src/streaming.rs:196-205","code":"  196 |     pub fn add_response_header(\n  197 |         &self,\n  198 |         key: impl Into<http::header::HeaderName>,\n  199 |         value: impl Into<http::header::HeaderValue>,\n  200 |     ) {\n  201 |         let mut lock = self.lock.write();\n  202 |         if let Some(headers) = lock.response_headers.as_mut() {\n  203 |             headers.insert(key.into(), value.into());\n  204 |         }\n  205 |     }","lines":10,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/fullstack-core/src/streaming.rs#L196-L205"}]},
{"id":"ERR_10","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `Storage::try_read`/`try_write` for both `SyncStorage` and `UnsyncStorage`, a failed downcast (`any.downcast_ref()`/`any.downcast_mut()` returning `Err`) is mapped to `BorrowError::Dropped(ValueDroppedError::new_for_location(pointer.location))` / `BorrowMutError::Dropped(...)`. A downcast failure means the stored `Box<dyn Any>` holds a different concrete type than `T`, i.e. a type-confusion bug, not that the value was dropped. Reporting it as `Dropped` would hide the real cause (a type-safety violation) behind a misleading and unrelated error variant if this code path is ever hit due to an internal invariant break.","fix":"If a downcast failure is believed to be unreachable under the safe public API, replace the silent `Err(..Dropped..)` mapping with a `debug_assert!`/`unreachable!` with a clear message so misuse is caught loudly in debug builds, or add a dedicated `BorrowError` variant (e.g. `TypeMismatch`) instead of reusing `Dropped` for an unrelated failure mode.","locations":[{"ref":"packages/generational-box/src/sync.rs:279-320","code":"  279 | impl<T: Sync + Send + 'static> Storage<T> for SyncStorage {\n  280 |     #[track_caller]\n  281 |     fn try_read(\n  282 |         pointer: GenerationalPointer<Self>,\n  283 |     ) -> Result<Self::Ref<'static, T>, error::BorrowError> {\n  284 |         let (read, pointer) = Self::read(pointer)?;\n  285 | \n  286 |         let read = MappedRwLockReadGuard::try_map(read, |any| {\n  287 |             // Then try to downcast\n  288 |             any.downcast_ref()\n  289 |         });\n  290 |         match read {\n  291 |             Ok(guard) => Ok(GenerationalRef::new(\n  292 |                 guard,\n  293 |                 pointer.storage.borrow_info.borrow_guard(),\n  294 |             )),\n  295 |             Err(_) => Err(error::BorrowError::Dropped(\n  296 |                 ValueDroppedError::new_for_location(pointer.location),\n  297 |             )),\n  298 |         }\n  299 |     }\n  300 | \n  301 |     #[track_caller]\n  302 |     fn try_write(\n  303 |         pointer: GenerationalPointer<Self>,\n  304 |     ) -> Result<Self::Mut<'static, T>, error::BorrowMutError> {\n  305 |         let (write, pointer) = Self::write(pointer)?;\n  306 | \n  307 |         let write = MappedRwLockWriteGuard::try_map(write, |any| {\n  308 |             // Then try to downcast\n  309 |             any.downcast_mut()\n  310 |         });\n  311 |         match write {\n  312 |             Ok(guard) => Ok(GenerationalRefMut::new(\n  313 |                 guard,\n  314 |                 pointer.storage.borrow_info.borrow_mut_guard(),\n  315 |             )),\n  316 |             Err(_) => Err(error::BorrowMutError::Dropped(\n  317 |                 ValueDroppedError::new_for_location(pointer.location),\n  318 |             )),\n  319 |         }\n  320 |     }","lines":42,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/generational-box/src/sync.rs#L279-L320"},{"ref":"packages/generational-box/src/unsync.rs:275-316","code":"  275 | impl<T: 'static> Storage<T> for UnsyncStorage {\n  276 |     #[track_caller]\n  277 |     fn try_read(\n  278 |         pointer: GenerationalPointer<Self>,\n  279 |     ) -> Result<Self::Ref<'static, T>, error::BorrowError> {\n  280 |         let (read, pointer) = Self::read(pointer)?;\n  281 | \n  282 |         let ref_ = Ref::filter_map(read, |any| {\n  283 |             // Then try to downcast\n  284 |             any.downcast_ref()\n  285 |         });\n  286 |         match ref_ {\n  287 |             Ok(guard) => Ok(GenerationalRef::new(\n  288 |                 guard,\n  289 |                 pointer.storage.borrow_info.borrow_guard(),\n  290 |             )),\n  291 |             Err(_) => Err(error::BorrowError::Dropped(\n  292 |                 error::ValueDroppedError::new_for_location(pointer.location),\n  293 |             )),\n  294 |         }\n  295 |     }\n  296 | \n  297 |     #[track_caller]\n  298 |     fn try_write(\n  299 |         pointer: GenerationalPointer<Self>,\n  300 |     ) -> Result<Self::Mut<'static, T>, error::BorrowMutError> {\n  301 |         let (write, pointer) = Self::write(pointer)?;\n  302 | \n  303 |         let ref_mut = RefMut::filter_map(write, |any| {\n  304 |             // Then try to downcast\n  305 |             any.downcast_mut()\n  306 |         });\n  307 |         match ref_mut {\n  308 |             Ok(guard) => Ok(GenerationalRefMut::new(\n  309 |                 guard,\n  310 |                 pointer.storage.borrow_info.borrow_mut_guard(),\n  311 |             )),\n  312 |             Err(_) => Err(error::BorrowMutError::Dropped(\n  313 |                 error::ValueDroppedError::new_for_location(pointer.location),\n  314 |             )),\n  315 |         }\n  316 |     }","lines":42,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/generational-box/src/unsync.rs#L275-L316"}]},
{"id":"ERR_11","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In `change_reference`'s `else` branch (both `sync.rs` and `unsync.rs`), the pattern match `(RwLockStorageEntryData::Reference(reference), RwLockStorageEntryData::Rc(data)) = (&mut write.data, &other_write.data)` fails for two structurally different reasons: (1) `location` (`self`) is not itself an rc-reference box (e.g. it was created via `leak`/`insert` rather than `leak_rc`/`insert_rc`), or (2) `other` does not resolve to an `Rc` entry. The `tracing::trace!` message and returned `BorrowError::Dropped(ValueDroppedError::new_for_location(other_final.location))` unconditionally blame `other_write.data` and report `other_final.location` as the dropped value, even in case (1) where `other` is perfectly valid and the real problem is that `location` itself is the wrong kind of box. This produces a misleading diagnostic and error location when debugging `point_to` misuse.","fix":"Check `write.data` and `other_write.data` separately and produce distinct, accurate diagnostics/locations for each failure case instead of a single combined `else` that always blames `other`, e.g. first match on `&mut write.data` to confirm it is `Reference`, returning an error referencing `location.location` if not, before checking `other_write.data`.","locations":[{"ref":"packages/generational-box/src/sync.rs:375-392","code":"  375 |         if let (RwLockStorageEntryData::Reference(reference), RwLockStorageEntryData::Rc(data)) =\n  376 |             (&mut write.data, &other_write.data)\n  377 |         {\n  378 |             if reference == &other_final {\n  379 |                 return Ok(());\n  380 |             }\n  381 |             drop_ref(*reference);\n  382 |             *reference = other_final;\n  383 |             data.add_ref();\n  384 |         } else {\n  385 |             tracing::trace!(\n  386 |                 \"References should always point to a data entry directly found {:?} instead\",\n  387 |                 other_write.data\n  388 |             );\n  389 |             return Err(BorrowError::Dropped(ValueDroppedError::new_for_location(\n  390 |                 other_final.location,\n  391 |             )));\n  392 |         }","lines":18,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/generational-box/src/sync.rs#L375-L392"},{"ref":"packages/generational-box/src/unsync.rs:371-388","code":"  371 |         if let (RefCellStorageEntryData::Reference(reference), RefCellStorageEntryData::Rc(data)) =\n  372 |             (&mut write.data, &other_write.data)\n  373 |         {\n  374 |             if reference == &other_final {\n  375 |                 return Ok(());\n  376 |             }\n  377 |             drop_ref(*reference);\n  378 |             *reference = other_final;\n  379 |             data.add_ref();\n  380 |         } else {\n  381 |             tracing::trace!(\n  382 |                 \"References should always point to a data entry directly found {:?} instead\",\n  383 |                 other_write.data\n  384 |             );\n  385 |             return Err(BorrowError::Dropped(ValueDroppedError::new_for_location(\n  386 |                 other_final.location,\n  387 |             )));\n  388 |         }","lines":18,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/generational-box/src/unsync.rs#L371-L388"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"`ClientRequest` has an unconditional `unsafe impl Send for ClientRequest {}` / `unsafe impl Sync for ClientRequest {}` with no `#[cfg(target_arch = \"wasm32\")]` guard, even though the justifying comment (\"On wasm reqwest not being send/sync gets annoying... it's not relevant since wasm is single-threaded\") only applies to wasm. On native targets this unsafe impl applies too, but is entirely redundant there: every field of `ClientRequest` (`Url`, `HeaderMap`, `Method`, `Extensions`) is already `Send + Sync` on native, so the auto traits would be derived automatically without any `unsafe impl`.\n\nBecause the impl isn't scoped to wasm, if a future field is ever added to `ClientRequest` that is genuinely `!Send`/`!Sync` on native (e.g. holding a native, non-thread-safe handle), this blanket `unsafe impl` would silently paper over it and introduce real undefined behavior/data races on multi-threaded native servers, since the compiler would no longer catch the violation.","fix":"Scope the unsafe impls to wasm only, matching the justification:\n```rust\n#[cfg(target_arch = \"wasm32\")]\nunsafe impl Send for ClientRequest {}\n#[cfg(target_arch = \"wasm32\")]\nunsafe impl Sync for ClientRequest {}\n```\nOr remove them entirely on native builds since the auto traits already hold there without any `unsafe` needed.","locations":[{"ref":"packages/fullstack/src/client.rs:415-417","code":"  415 | // On wasm reqwest not being send/sync gets annoying, but it's not relevant since wasm is single-threaded\n  416 | unsafe impl Send for ClientRequest {}\n  417 | unsafe impl Sync for ClientRequest {}","lines":3,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/fullstack/src/client.rs#L415-L417"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"SCSS/SASS source is compiled twice for every asset: once in `hash_scss` (called from `hash_file_with_options` while computing the asset's content hash) and again in `process_scss` (called from `process_file_to` while actually generating the output file). Both call `compile_scss`, which invokes `grass::from_path` from scratch, including re-parsing and re-resolving all `@import`/`@use` files. For projects with non-trivial SCSS (many partials/imports), this doubles compile time for every asset build and every incremental rebuild that needs to check the hash.","fix":"Compute the compiled CSS once and reuse it for both hashing and writing the output (e.g. have the hashing path return the compiled string so `process_scss` can consume it directly instead of recompiling), or cache the last `compile_scss` result keyed by source path + mtime.","locations":[{"ref":"packages/cli/src/opt/css.rs:146-163","code":"  146 | pub(crate) fn compile_scss(\n  147 |     scss_options: &CssAssetOptions,\n  148 |     source: &Path,\n  149 | ) -> anyhow::Result<String> {\n  150 |     let style = match scss_options.minified() {\n  151 |         true => OutputStyle::Compressed,\n  152 |         false => OutputStyle::Expanded,\n  153 |     };\n  154 | \n  155 |     let options = grass::Options::default()\n  156 |         .style(style)\n  157 |         .quiet(false)\n  158 |         .logger(&ScssLogger {});\n  159 | \n  160 |     let css = grass::from_path(source, &options)\n  161 |         .with_context(|| format!(\"Failed to compile scss file: {}\", source.display()))?;\n  162 |     Ok(css)\n  163 | }","lines":18,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/opt/css.rs#L146-L163"},{"ref":"packages/cli/src/opt/css.rs:166-182","code":"  166 | pub(crate) fn process_scss(\n  167 |     scss_options: &CssAssetOptions,\n  168 |     source: &Path,\n  169 |     output_path: &Path,\n  170 | ) -> anyhow::Result<()> {\n  171 |     let css = compile_scss(scss_options, source)?;\n  172 |     let minified = minify_css(&css)?;\n  173 | \n  174 |     std::fs::write(output_path, minified).with_context(|| {\n  175 |         format!(\n  176 |             \"Failed to write css to output location: {}\",\n  177 |             output_path.display()\n  178 |         )\n  179 |     })?;\n  180 | \n  181 |     Ok(())\n  182 | }","lines":17,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/opt/css.rs#L166-L182"},{"ref":"packages/cli/src/opt/css.rs:210-223","code":"  210 | pub(crate) fn hash_scss(\n  211 |     scss_options: &CssAssetOptions,\n  212 |     source: &Path,\n  213 |     hasher: &mut impl Hasher,\n  214 | ) -> anyhow::Result<()> {\n  215 |     // Grass doesn't expose the ast for us to traverse the imports in the file. Instead of parsing scss ourselves\n  216 |     // we just hash the expanded version of the file for now\n  217 |     let css = compile_scss(scss_options, source)?;\n  218 | \n  219 |     // Hash the compiled css\n  220 |     hasher.write(css.as_bytes());\n  221 | \n  222 |     Ok(())\n  223 | }","lines":14,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/opt/css.rs#L210-L223"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`document.rs` uses a single process-wide `static RENDERER: LazyLock<RwLock<Renderer>>` to render the `<title>` and collected `<meta>`/`<link>`/`<script>` head elements for every request (`ServerDocument::title`/`render`, lines 38-58). Every call takes `RENDERER.write()`, so all concurrent requests across the whole server serialize through this single lock just to render head content, even though the main body rendering deliberately uses a *pool* of `Renderer`s (`SsrRendererPool::renderers: RwLock<Vec<Renderer>>` in `ssr.rs`) specifically to avoid exactly this kind of contention.\n\nThis is compounded by `SsrRendererPool::render_to`, which calls `Self::render_head` (which in turn calls into this global `RENDERER`) twice per request when incremental caching is enabled: once for the live streamed response (`ssr.rs:306`) and again to build the cached copy after suspense resolves (`ssr.rs:400`), doubling the contention/work on this global lock for cached routes.","fix":"Use a per-request `Renderer` (or pull one from the existing renderer pool) for head-element rendering instead of a single global `static RwLock<Renderer>`, so head rendering scales with concurrency the same way body rendering already does.","locations":[{"ref":"packages/fullstack-server/src/document.rs:18-59","code":"   18 | static RENDERER: LazyLock<RwLock<Renderer>> = LazyLock::new(|| RwLock::new(Renderer::new()));\n   19 | \n   20 | /// Reset the static renderer to a fresh state, clearing its cache.\n   21 | pub(crate) fn reset_renderer() {\n   22 |     RENDERER.write().clear();\n   23 | }\n   24 | \n   25 | #[derive(Default)]\n   26 | struct ServerDocumentInner {\n   27 |     streaming: bool,\n   28 |     title: Option<String>,\n   29 |     meta: Vec<Element>,\n   30 |     link: Vec<Element>,\n   31 |     script: Vec<Element>,\n   32 | }\n   33 | \n   34 | /// A Document provider that collects all contents injected into the head for SSR rendering.\n   35 | #[derive(Default)]\n   36 | pub struct ServerDocument(RefCell<ServerDocumentInner>);\n   37 | \n   38 | impl ServerDocument {\n   39 |     pub(crate) fn title(&self) -> Option<String> {\n   40 |         let myself = self.0.borrow();\n   41 |         myself.title.as_ref().map(|title| {\n   42 |             RENDERER\n   43 |                 .write()\n   44 |                 .render_element(rsx! { title { \"{title}\" } })\n   45 |         })\n   46 |     }\n   47 | \n   48 |     pub(crate) fn render(&self, to: &mut impl std::fmt::Write) -> std::fmt::Result {\n   49 |         let myself = self.0.borrow();\n   50 |         let element = rsx! {\n   51 |             {myself.meta.iter().map(|m| rsx! { {m} })}\n   52 |             {myself.link.iter().map(|l| rsx! { {l} })}\n   53 |             {myself.script.iter().map(|s| rsx! { {s} })}\n   54 |         };\n   55 | \n   56 |         RENDERER.write().render_element_to(to, element)?;\n   57 | \n   58 |         Ok(())\n   59 |     }","lines":42,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/fullstack-server/src/document.rs#L18-L59"},{"ref":"packages/fullstack-server/src/ssr.rs:300","code":"  300 |             if let Err(err) = Self::render_head(&cfg, &mut pre_body, &virtual_dom) {","lines":1,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/fullstack-server/src/ssr.rs#L300"},{"ref":"packages/fullstack-server/src/ssr.rs:391","code":"  391 |                 if let Err(err) = Self::render_head(&cfg, &mut cached_render, &virtual_dom) {","lines":1,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/fullstack-server/src/ssr.rs#L391"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"When `invalidate_after` is set, `FileSystemCache::find_file` accumulates stale timestamped cache files on disk indefinitely instead of pruning them. On each call it iterates the directory entries and returns on the *first* still-valid (`elapsed < deadline`) entry it encounters (line 115); only entries visited *before* finding that valid one get deleted (lines 117-120). Directory iteration order from `std::fs::read_dir` is not guaranteed to be chronological, so once a fresh entry exists, older still-on-disk (but now stale) entries that happen to be enumerated after it are never reached and never removed - they just accumulate forever as long as a newer valid file exists in the same folder.\n\nBecause `route_as_path` (`fs_cache.rs:138-148`) creates a brand-new timestamped file on every `cache()`/`put()` call when `track_timestamps()` is true, this leads to unbounded growth of `.html` files per route directory over the lifetime of the server, and every subsequent `get()`/`find_file()` call becomes an O(n) scan over that ever-growing directory.","fix":"When scanning the directory, don't short-circuit on the first valid entry - collect all valid entries, keep the most recent, and delete every other entry (valid or stale) so the folder never holds more than one live cache file per route. For example, iterate all entries, delete anything with `elapsed >= deadline`, and among the remaining valid ones keep only the one with the largest timestamp, deleting the rest.","locations":[{"ref":"packages/fullstack-server/src/isrg/fs_cache.rs:103-136","code":"  103 |     fn find_file(&self, route: &str) -> Option<ValidCachedPath> {\n  104 |         let mut file_path = (self.map_path)(route);\n  105 |         if let Some(deadline) = self.invalidate_after {\n  106 |             // find the first file that matches the route and is a html file\n  107 |             file_path.push(\"index\");\n  108 |             if let Ok(dir) = std::fs::read_dir(file_path) {\n  109 |                 for entry in dir.flatten() {\n  110 |                     if let Some(cached_path) = ValidCachedPath::try_from_path(entry.path()) {\n  111 |                         if let Ok(elapsed) = cached_path.timestamp.elapsed()\n  112 |                             && elapsed < deadline\n  113 |                         {\n  114 |                             // The timestamp is valid, return the file\n  115 |                             return Some(cached_path);\n  116 |                         }\n  117 |                         // if the timestamp is invalid or passed, delete the file\n  118 |                         if let Err(err) = std::fs::remove_file(entry.path()) {\n  119 |                             tracing::error!(\"Failed to remove file: {}\", err);\n  120 |                         }\n  121 |                     }\n  122 |                 }\n  123 |                 None\n  124 |             } else {\n  125 |                 None\n  126 |             }\n  127 |         } else {\n  128 |             file_path.push(\"index.html\");\n  129 |             file_path.exists().then_some({\n  130 |                 ValidCachedPath {\n  131 |                     full_path: file_path,\n  132 |                     timestamp: SystemTime::now(),\n  133 |                 }\n  134 |             })\n  135 |         }\n  136 |     }","lines":34,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/fullstack-server/src/isrg/fs_cache.rs#L103-L136"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`create_element_in_head` re-embeds the entire contents of `head.js` (via `include_str!`) into a freshly formatted JS string on every single call. Every `Meta`, `Script`, `Style`, and `Link` component mounted therefore ships a duplicate copy of the same helper function definition through `Document::eval` instead of defining it once. For pages with many head elements this means redundant string allocation and redundant bytes sent across the eval bridge (JS execution, IPC serialization for desktop, etc.) for no benefit.","fix":"Inject `createElementInHead` once during document/eval-channel initialization (or guard the definition with `if (!window.createElementInHead) { ... }` inside the generated script), and have `create_element_in_head` only emit the `window.createElementInHead(tag, attrs, children);` call on subsequent invocations.","locations":[{"ref":"packages/document/src/document.rs:36-49","code":"   36 | pub fn create_element_in_head(\n   37 |     tag: &str,\n   38 |     attributes: &[(&str, String)],\n   39 |     children: Option<String>,\n   40 | ) -> String {\n   41 |     let helpers = include_str!(\"./js/head.js\");\n   42 |     let attributes = format_attributes(attributes);\n   43 |     let children = children\n   44 |         .as_deref()\n   45 |         .map(format_string_for_js)\n   46 |         .unwrap_or(\"null\".to_string());\n   47 |     let tag = format_string_for_js(tag);\n   48 |     format!(r#\"{helpers};window.createElementInHead({tag}, {attributes}, {children});\"#)\n   49 | }","lines":14,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/document/src/document.rs#L36-L49"}]},

{"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`MsgPackRejection::BodyAlreadyExtracted` is declared and has a corresponding `IntoResponse` match arm, but it is never constructed anywhere in the crate (`FromRequest for MsgPack`/`MsgPackRaw` only ever produce `MissingMsgPackContentType`, `InvalidMsgPackBody`, or `BytesRejection`). It appears to be leftover/copy-pasted from another rejection enum (e.g. axum's own `Json` rejection, which does have a body-already-extracted case) and is unreachable dead code in this crate.","fix":"Remove the unused `BodyAlreadyExtracted` variant (and its `IntoResponse` arm) unless there is a planned code path that will construct it.","locations":[{"ref":"packages/fullstack/src/payloads/msgpack.rs:148-149","code":"  148 |     #[error(\"Cannot have two request body extractors for a single handler\")]\n  149 |     BodyAlreadyExtracted,","lines":2,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/fullstack/src/payloads/msgpack.rs#L148-L149"},{"ref":"packages/fullstack/src/payloads/msgpack.rs:175-181","code":"  175 |             Self::BodyAlreadyExtracted => {\n  176 |                 let mut res = Response::new(Body::from(\n  177 |                     \"Cannot have two request body extractors for a single handler\",\n  178 |                 ));\n  179 |                 *res.status_mut() = http::StatusCode::INTERNAL_SERVER_ERROR;\n  180 |                 res\n  181 |             }","lines":7,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/fullstack/src/payloads/msgpack.rs#L175-L181"}]},
{"id":"DEAD_7","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"In `MemoryHistory::with_initial_path`, `path.to_string().parse().unwrap_or_else(|err| panic!(\"index route does not exist:\\n{err}\\n use MemoryHistory::with_initial_path to set a custom path\"))` parses a `String` into the struct field `current: String`. Since the target type is inferred as `String`, and `String`'s `FromStr` implementation has `Err = Infallible` and always succeeds, `.parse()` here can never fail, making the `unwrap_or_else` panic branch unreachable dead code with a misleading message (it reads as if invalid route strings are rejected, but no validation actually happens - any string, including nonsense, is accepted verbatim).","fix":"Replace `path.to_string().parse().unwrap_or_else(|err| panic!(...))` with a plain `path.to_string()`, since parsing to `String` can never fail and the panic branch is unreachable.","locations":[{"ref":"packages/history/src/memory.rs:44-55","code":"   44 |     pub fn with_initial_path(path: impl ToString) -> Self {\n   45 |         Self {\n   46 |             state: MemoryHistoryState{\n   47 |                 current: path.to_string().parse().unwrap_or_else(|err| {\n   48 |                     panic!(\"index route does not exist:\\n{err}\\n use MemoryHistory::with_initial_path to set a custom path\")\n   49 |                 }),\n   50 |                 history: Vec::new(),\n   51 |                 future: Vec::new(),\n   52 |             }.into(),\n   53 |             base_path: None,\n   54 |         }\n   55 |     }","lines":12,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/history/src/memory.rs#L44-L55"}]},
{"id":"DEAD_8","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`packages/hooks/src/use_collection.rs` contains nothing but a large `/* ... */` block comment (a design sketch for a hypothetical `use_map`/`use_collection` hook) and zero executable code. The module is not declared anywhere in `packages/hooks/src/lib.rs` (`grep -n \"^mod \" lib.rs` lists `use_callback`, `use_on_destroy`, `use_context`, `use_coroutine`, `use_future`, `use_reactive`, `use_resource`, `use_effect`, `use_memo`, `use_root_context`, `use_hook_did_run`, `use_signal`, `use_set_compare`, `use_after_suspense_resolved`, `use_action`, `use_waker` - no `use_collection`), so this file is not even compiled into the crate. It is orphaned, vestigial content left over from an abandoned design.","fix":"Delete `packages/hooks/src/use_collection.rs` since it is unreferenced and non-functional, or if the `use_map`/`use_collection` hook is still desired, implement it and add `mod use_collection; pub use use_collection::*;` to `lib.rs`.","locations":[{"ref":"packages/hooks/src/use_collection.rs:1-76","code":"    1 | /*\n    2 | a form of use_signal explicitly for map-style collections (BTreeMap, HashMap, etc).\n    3 | \n    4 | Why?\n    5 | ---\n    6 | Traditionally, it's possible to use the \"use_state\" hook for collections in the React world.\n    7 | Adding a new entry would look something similar to:\n    8 | \n    9 | ```js\n   10 | let (map, set_map) = useState({});\n   11 | set_map({ ...map, [key]: value });\n   12 | ```\n   13 | The new value then causes the appropriate update when passed into children.\n   14 | \n   15 | This is moderately efficient because the fields of the map are moved, but the data itself is not cloned.\n   16 | However, if you used similar approach with Dioxus:\n   17 | \n   18 | ```rust\n   19 | let (map, set_map) = use_signal(|| HashMap::new());\n   20 | set_map({\n   21 |     let mut newmap = map.clone();\n   22 |     newmap.set(key, value);\n   23 |     newmap\n   24 | })\n   25 | ```\n   26 | Unfortunately, you'd be cloning the entire state every time a value is changed. The obvious solution is to\n   27 | wrap every element in the HashMap with an Rc. That way, cloning the HashMap is on par with its JS equivalent.\n   28 | \n   29 | Fortunately, we can make this operation even more efficient in Dioxus, leveraging the borrow rules of Rust.\n   30 | \n   31 | This hook provides a memoized collection, memoized setters, and memoized getters. This particular hook is\n   32 | extremely powerful for implementing lists and supporting core state management needs for small apps.\n   33 | \n   34 | If you need something even more powerful, check out the dedicated atomic state management Dioxus Dataflow, which\n   35 | uses the same memoization on top of the use_context API.\n   36 | \n   37 | Here's a fully-functional todo app using the use_map API:\n   38 | ```rust\n   39 | static TodoList: Component = |cx| {\n   40 |     let todos = use_map(|| HashMap::new());\n   41 |     let input = use_signal(|| None);\n   42 | \n   43 |     rsx! {\n   44 |         div {\n   45 |             button {\n   46 |                 \"Add todo\"\n   47 |                 onclick: move |_| {\n   48 |                     let new_todo = TodoItem::new(input.contents());\n   49 |                     todos.insert(new_todo.id.clone(), new_todo);\n   50 |                     input.clear();\n   51 |                 }\n   52 |             }\n   53 |             button {\n   54 |                 \"Clear todos\"\n   55 |                 onclick: move |_| todos.clear()\n   56 |             }\n   57 |             input {\n   58 |                 placeholder: \"What needs to be done?\"\n   59 |                 ref: input\n   60 |             }\n   61 |             ul {\n   62 |                 {todos.iter().map(|todo| rsx!(\n   63 |                     li {\n   64 |                         key: todo.id\n   65 |                         span { \"{todo.content}\" }\n   66 |                         button {\"x\", onclick: move |_| todos.remove(todo.key.clone())}\n   67 |                     }\n   68 |                 ))}\n   69 |             }\n   70 |         }\n   71 |     })\n   72 | }\n   73 | \n   74 | ```\n   75 | \n   76 | */","lines":76,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/hooks/src/use_collection.rs#L1-L76"}]},
{"id":"DEAD_9","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`App::handle_tray_menu_event` takes a `tray_icon::menu::MenuEvent` and immediately discards it with `_ = event;`, doing nothing. Since the general wry event dispatch (`app.tick` -> `WindowEventHandlers::apply_event`, called for every event before this match arm runs) is what actually delivers `TrayMenuEvent` to user code registered via `use_tray_menu_event_handler`, this handler is a no-op stub. It is harmless but reads as if it should do something (mirroring `handle_menu_event`, which does dispatch on well-known IDs) and offers no place to add default tray-menu item behavior without a reviewer noticing it currently does nothing.","fix":"Either remove the empty handler (and the `Event::UserEvent(UserWindowEvent::TrayMenuEvent(evnt)) => app.handle_tray_menu_event(evnt)` dispatch arm in `packages/desktop/src/launch.rs`) if no default behavior is planned, or add a short comment explaining that tray menu events are only consumed via `use_tray_menu_event_handler` and this hook is reserved for future built-in tray menu item IDs.","locations":[{"ref":"packages/desktop/src/app.rs:135-138","code":"  135 |     #[cfg(any(target_os = \"windows\", target_os = \"linux\", target_os = \"macos\"))]\n  136 |     pub fn handle_tray_menu_event(&mut self, event: tray_icon::menu::MenuEvent) {\n  137 |         _ = event;\n  138 |     }","lines":4,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/desktop/src/app.rs#L135-L138"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"medium","difficulty":"easy","description":"In `use_action`, the comment above the `reader` field construction states `We never set the value back to None, only modify the state of the action`, but the `Err` branch of the same `match result` block just above it (lines 106-110) explicitly calls `value.set(None)`. The code is currently safe only because `Action::value()` checks `self.error` and returns `Err(..)` before ever touching `self.reader`/`self.value` when an error occurred, but the comment's stated invariant is simply false. A future maintainer relying on this comment (e.g. when refactoring `value()` or exposing `reader` more directly) could easily introduce a panic, since `reader` is built as `value.boxed().map(|v| v.as_ref().unwrap())`, which will panic if ever read while the underlying `value` signal is `None`.","fix":"Correct the comment to reflect reality, e.g.: `value is reset to None on error; reader must only be handed out after confirming value.read().is_some() (see value() below), since it unwraps unconditionally.`","locations":[{"ref":"packages/hooks/src/use_action.rs:106-123","code":"  106 |                 Err(err) => {\n  107 |                     error.set(Some(err.into()));\n  108 |                     value.set(None);\n  109 |                     state.set(ActionState::Errored);\n  110 |                 }\n  111 |             }\n  112 | \n  113 |             tx.send(()).ok();\n  114 |         });\n  115 | \n  116 |         task.set(Some(new_task));\n  117 | \n  118 |         rx\n  119 |     });\n  120 | \n  121 |     // Create a reader that maps the Option<T> to T, unwrapping the Option\n  122 |     // This should only be handed out if we know the value is Some. We never set the value back to None, only modify the state of the action\n  123 |     let reader = use_hook(|| value.boxed().map(|v| v.as_ref().unwrap()).boxed());","lines":18,"link":"https://github.com/D {"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The module doc comment for `fastfs.rs` claims: \"Methods for working with the filesystem that are faster than the std fs methods. Uses stuff like rayon, caching, and other optimizations.\" In reality `pre_compress_folder` just does a single-threaded `WalkDir` iteration with no `rayon`, no parallelism, and no caching of any kind - it is a plain sequential loop calling `pre_compress_file` for each entry.","fix":"Update the module doc to describe what the file actually does (sequential brotli pre-compression via `walkdir`), or actually parallelize the folder walk with `rayon` (e.g. `WalkDir::into_iter().par_bridge()`) to match the stated intent and improve performance on large asset folders.","locations":[{"ref":"packages/cli/src/fastfs.rs:1-4","code":"    1 | //! Methods for working with the filesystem that are faster than the std fs methods\n    2 | //! Uses stuff like rayon, caching, and other optimizations\n    3 | //!\n    4 | //! Allows configuration in case you want to do some work while copying and allows you to track progress","lines":4,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/fastfs.rs#L1-L4"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The comment on `write_map` says \"We write 2 * len as the length of the map because each key-value pair is a separate entry\" but the code actually writes `len as u64` (the pair count), not `2 * len`. The `2x` multiplication only happens later, in the readers `take_map` and `item_length`, where `items_left = length * 2` is used to skip both key and value of each pair. The comment describing `write_map` itself is simply wrong and misleading about what that function does.","fix":"Correct the comment to describe what `write_map` actually does, e.g.:\n```rust\n/// Write the header and length of a map. The length written is the number of key-value pairs;\n/// readers (`take_map`, `item_length`) multiply it by 2 internally to account for keys and values.\n```","locations":[{"ref":"packages/const-serialize/src/cbor.rs:283-290","code":"  283 | /// Write the header and length of a map.\n  284 | pub(crate) const fn write_map<const MAX_SIZE: usize>(\n  285 |     vec: ConstVec<u8, MAX_SIZE>,\n  286 |     len: usize,\n  287 | ) -> ConstVec<u8, MAX_SIZE> {\n  288 |     // We write 2 * len as the length of the map because each key-value pair is a separate entry.\n  289 |     write_major_type_and_u64(vec, MajorType::Map, len as u64)\n  290 | }","lines":8,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/const-serialize/src/cbor.rs#L283-L290"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The panic message produced by `Runtime::current()` when there is no active runtime includes an example code snippet suggesting the user call `Runtime::current().expect(\"Components run in the Dioxus runtime\")`. But `Runtime::current()` returns `Rc<Runtime>` directly (it panics internally instead of returning an `Option`/`Result`), so `.expect(...)` would not compile against it - the example should use `Runtime::try_current()`, which is the actual fallible accessor defined a few lines below in the same file. The snippet is shown to users precisely in the situation this bug describes (no active runtime), so a user copying it verbatim gets a second, confusing compiler error instead of a fix.","fix":"Change the example in the panic message to use the fallible accessor:\n```text\nlet runtime = Runtime::try_current().expect(\"Components run in the Dioxus runtime\");\n```\ninstead of `Runtime::current().expect(...)`.","locations":[{"ref":"packages/core/src/runtime.rs:130-148","code":"  130 | ```rust\n  131 | use dioxus::prelude::*;\n  132 | static COUNT: GlobalSignal<i32> = Signal::global(|| 0);\n  133 | \n  134 | #[component]\n  135 | fn MyComponent() -> Element {{\n  136 |     use_effect(|| {{\n  137 |         // Grab the runtime from the MyComponent scope\n  138 |         let runtime = Runtime::current().expect(\\\"Components run in the Dioxus runtime\\\");\n  139 |         // Move the runtime into the web-sys closure scope\n  140 |         let web_sys_closure = Closure::new(|| {{\n  141 |             // Then create a guard to provide the runtime to the closure\n  142 |             let _guard = RuntimeGuard::new(runtime);\n  143 |             // and run whatever code needs the runtime\n  144 |             tracing::info!(\\\"The count is: {{COUNT}}\\\");\n  145 |         }});\n  146 |     }})\n  147 | }}\n  148 | ```\"","lines":19,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/core/src/runtime.rs#L130-L148"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"Several doc comments describe `try_read`/`try_write` as returning `None` when the value is invalid, but the actual return type is `Result<_, BorrowError>` / `Result<_, BorrowMutError>` (a `BorrowResult`), not `Option`. This is inconsistent with the correct sibling doc on `GenerationalBox::try_read` a few lines above (`Try to read the value. Returns an error if the value is no longer valid.`), showing the `try_write` doc and the trait-level docs were not updated when the API moved from `Option` to `Result`.","fix":"Update the three doc comments from `Returns None if the value is no longer valid.` to `Returns an error if the value is no longer valid.` to match the actual `Result`/`BorrowResult` return type.","locations":[{"ref":"packages/generational-box/src/lib.rs:99-101","code":"   99 |     /// Try to write the value. Returns None if the value is no longer valid.\n  100 |     #[track_caller]\n  101 |     pub fn try_write(&self) -> Result<S::Mut<'static, T>, BorrowMutError> {","lines":3,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/generational-box/src/lib.rs#L99-L101"},{"ref":"packages/generational-box/src/lib.rs:168-169","code":"  168 |     /// Try to read the value. Returns None if the value is no longer valid.\n  169 |     fn try_read(pointer: GenerationalPointer<Self>) -> BorrowResult<Self::Ref<'static, Data>>;","lines":2,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/generational-box/src/lib.rs#L168-L169"},{"ref":"packages/generational-box/src/lib.rs:171-172","code":"  171 |     /// Try to write the value. Returns None if the value is no longer valid.\n  172 |     fn try_write(pointer: GenerationalPointer<Self>) -> BorrowMutResult<Self::Mut<'static, Data>>;","lines":2,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0 {"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The module doc comment in `magic.rs` states the module is \"broken up into several parts, attempting to match how the server macro generates code\" and lists `ReqwestEncoder: encodes a set of arguments into a reqwest request` as one of those parts, but no type named `ReqwestEncoder` exists anywhere in the crate - the actual encoder type defined just below is `ServerFnEncoder`. The comment is stale and references a name that was seemingly renamed without updating the doc.","fix":"Update the doc comment to reference the real type name, e.g. `- ServerFnEncoder: encodes a set of arguments into a reqwest request`.","locations":[{"ref":"packages/fullstack/src/magic.rs:35-36","code":"   35 | //! This module is broken up into several parts, attempting to match how the server macro generates code:\n   36 | //! - ReqwestEncoder: encodes a set of arguments into a reqwest request","lines":2,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/fullstack/src/magic.rs#L35-L36"}]},
