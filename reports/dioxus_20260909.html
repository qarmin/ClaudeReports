{"id":"PANIC_30","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`SetHeader<T>::into_response_parts` calls `self.data.expect(\"SetHeader must have data to set\")` and `SetHeader<T>::into_response` calls `self.data.unwrap()`, both of which panic when `data` is `None`. `SetHeader::from_response_parts` explicitly constructs a `SetHeader { data: None }` when the header is absent from the response being parsed (line 42-44 of the same file), so any code path that receives a `SetHeader<T>` from `from_response_parts` (e.g. forwarding/relaying a header extracted from one response into another response) and then calls `.into_response()`/`.into_response_parts()` on it will panic instead of simply omitting the header.","fix":"Treat `data: None` as \"no header to set\" instead of panicking:\n```rust\nimpl<T: Header> IntoResponseParts for SetHeader<T> {\n    type Error = ();\n    fn into_response_parts(self, res: ResponseParts) -> Result<ResponseParts, Self::Error> {\n        let Some(data) = self.data else { return Ok(res); };\n        let mut headers = vec![];\n        data.encode(&mut headers);\n        axum::response::AppendHeaders(headers.into_iter().map(|value| (T::name().clone(), value)))\n            .into_response_parts(res)\n            .map_err(|_| ())\n    }\n}\n```\nand analogously return an empty response (or `NoContent`-equivalent) from `IntoResponse::into_response` when `data` is `None`.","locations":[{"ref":"packages/fullstack/src/payloads/header.rs:23-38","code":"   23 | impl<T: Header> IntoResponseParts for SetHeader<T> {\n   24 |     type Error = ();\n   25 | \n   26 |     fn into_response_parts(self, res: ResponseParts) -> Result<ResponseParts, Self::Error> {\n   27 |         let data = self.data.expect(\"SetHeader must have data to set\");\n   28 | \n   29 |         let mut headers = vec![];\n   30 |         data.encode(&mut headers);\n   31 | \n   32 |         Ok(axum::response::AppendHeaders(\n   33 |             headers.into_iter().map(|value| (T::name().clone(), value)),\n   34 |         )\n   35 |         .into_response_parts(res)\n   36 |         .unwrap())\n   37 |     }\n   38 | }","lines":16,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/fullstack/src/payloads/header.rs#L23-L38"},{"ref":"packages/fullstack/src/payloads/header.rs:40-51","code":"   40 | impl<T: Header> FromResponseParts for SetHeader<T> {\n   41 |     fn from_response_parts(parts: &mut axum::http::response::Parts) -> Result<Self, ServerFnError> {\n   42 |         let Some(header) = parts.headers.remove(T::name()) else {\n   43 |             return Ok(SetHeader { data: None });\n   44 |         };\n   45 | \n   46 |         let data = T::decode(&mut std::iter::once(&header))\n   47 |             .map_err(|_| ServerFnError::Deserialization(\"Failed to decode header\".into()))?;\n   48 | \n   49 |         Ok(SetHeader { data: Some(data) })\n   50 |     }\n   51 | }","lines":12,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/fullstack/src/payloads/header.rs#L40-L51"},{"ref":"packages/fullstack/src/payloads/header.rs:53-66","code":"   53 | impl<T: Header> IntoResponse for SetHeader<T> {\n   54 |     fn into_response(self) -> axum::response::Response {\n   55 |         let mut values = vec![];\n   56 |         self.data.unwrap().encode(&mut values);\n   57 | \n   58 |         let mut response = axum::response::Response::builder();\n   59 | \n   60 |         for value in values {\n   61 |             response = response.header(T::name(), value);\n   62 |         }\n   63 | \n   64 |         response.body(axum_core::body::Body::empty()).unwrap()\n   65 |     }\n   66 | }","lines":14,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/fullstack/src/payloads/header.rs#L53-L66"}]},
{"id":"PANIC_31","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In `Bundle::bundle` (`packages/cli/src/cli/bundle.rs`), `outdir.join(bundle_path.file_name().unwrap())` (line 105) and `bundle_path.absolutize().unwrap()` (line 129) both use bare `.unwrap()` on values derived from build/bundle artifact paths. `Path::file_name()` returns `None` for paths ending in `..`, and `absolutize()` returns a `Result` that can fail on I/O errors; either would panic the whole `dx bundle` command right after (or during) copying bundle artifacts, instead of surfacing a clean error.","fix":"Use `.context(\"bundle path has no file name\")?` and `.context(\"failed to absolutize bundle path\")?` instead of `.unwrap()` so malformed paths produce a normal error instead of a panic.","locations":[{"ref":"packages/cli/src/cli/bundle.rs:104-105","code":"  104 |             for bundle_path in bundles.iter_mut() {\n  105 |                 let destination = outdir.join(bundle_path.file_name().unwrap());","lines":2,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/cli/bundle.rs#L104-L105"},{"ref":"packages/cli/src/cli/bundle.rs:127-130","code":"  127 |         println!(\"Bundled {} bundles:\", bundles.len());\n  128 |         for bundle_path in bundles.iter() {\n  129 |             println!(\"{}\", bundle_path.absolutize().unwrap().display());\n  130 |         }","lines":4,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/cli/bundle.rs#L127-L130"}]},
{"id":"PANIC_32","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In the no-custom-linker branch of `run_link_inner` (`packages/cli/src/cli/link.rs:201-226`), several `match` arms call `unimplemented!()`/`unimplemented!(\"...\")` for binary formats, architectures, and endianness that aren't explicitly handled (`BinaryFormat::Unknown`, unmatched `Architecture` variants, `Err(_)` from `endianness()`). Since this code runs whenever `dx` needs to emit the dummy stub object file for an unusual host/target combination, an unsupported platform causes a hard panic rather than a clean 'unsupported platform' error.","fix":"Replace the `unimplemented!()` arms with `bail!(\"unsupported {kind} for hotpatch stub object: {:?}\", value)` (propagated through the already-`Result`-returning `run_link_inner`) so unsupported platforms fail gracefully instead of panicking.","locations":[{"ref":"packages/cli/src/cli/link.rs:201-226","code":"  201 |                 let format = match triple.binary_format {\n  202 |                     target_lexicon::BinaryFormat::Elf => object::BinaryFormat::Elf,\n  203 |                     target_lexicon::BinaryFormat::Coff => object::BinaryFormat::Coff,\n  204 |                     target_lexicon::BinaryFormat::Macho => object::BinaryFormat::MachO,\n  205 |                     target_lexicon::BinaryFormat::Wasm => object::BinaryFormat::Wasm,\n  206 |                     target_lexicon::BinaryFormat::Xcoff => object::BinaryFormat::Xcoff,\n  207 |                     target_lexicon::BinaryFormat::Unknown => unimplemented!(),\n  208 |                     _ => unimplemented!(\"Binary format not supported\"),\n  209 |                 };\n  210 | \n  211 |                 let arch = match triple.architecture {\n  212 |                     target_lexicon::Architecture::Wasm32 => object::Architecture::Wasm32,\n  213 |                     target_lexicon::Architecture::Wasm64 => object::Architecture::Wasm64,\n  214 |
