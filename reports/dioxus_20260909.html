{"id":"PANIC_33","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`determine_input` in `translate.rs` calls `std::io::stdin().read_to_string(&mut buffer).unwrap()` when falling back to reading from stdin. If the piped input is not valid UTF-8, `read_to_string` returns an `Err` and this `unwrap()` panics instead of surfacing a normal CLI error.","fix":"Replace the `unwrap()` with `?` after adding a `.context(\"stdin is not valid UTF-8\")`, since `determine_input` already returns `Result<String>`.","locations":[{"ref":"packages/cli/src/cli/translate.rs:124-131","code":"  124 |     if std::io::stdin().is_terminal() {\n  125 |         bail!(\"No input file, source, or stdin to translate from.\");\n  126 |     }\n  127 | \n  128 |     let mut buffer = String::new();\n  129 |     std::io::stdin().read_to_string(&mut buffer).unwrap();\n  130 | \n  131 |     Ok(buffer.trim().to_string())","lines":8,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/cli/translate.rs#L124-L131"}]},
{"id":"PANIC_34","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In the main serve loop, `builder.get_build(id).unwrap().build.bundle` panics if `get_build` ever returns `None` for the `id` carried by a `ServeUpdate::BuilderUpdate` message. While `id` is expected to always be valid today, an `unwrap()` on a value derived from an internal message channel is fragile against future refactors (e.g. a build being torn down concurrently with an in-flight update) and would crash the whole `dx serve` session instead of degrading gracefully.","fix":"Use `if let Some(build) = builder.get_build(id) { ... }` (skipping/logging the update when the build is missing) instead of `.unwrap()`, or add an `.expect(\"build id from BuilderUpdate must be tracked\")` message so a future crash at least self-documents the invariant.","locations":[{"ref":"packages/cli/src/serve/mod.rs:144","code":"  144 |                 let bundle_format = builder.get_build(id).unwrap().build.bundle;","lines":1,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/serve/mod.rs#L144"}]},
{"id":"PANIC_35","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`AppServer::handle_file_change`'s non-rebuild branch unconditionally indexes `files[0]` (`let file = files[0].display().to_string();`) after the main loop, relying on the caller never passing an empty slice. Both current call sites in `serve/mod.rs` do check `files.is_empty()`/`pending.is_empty()` before calling, so this isn't reachable today, but the invariant lives in the caller rather than the function itself, so a future call site (or a refactor of the existing guards) could reintroduce a panic here silently.","fix":"Add an explicit early return (`if files.is_empty() { return; }`) at the top of `handle_file_change` so the function is safe on its own instead of depending on caller discipline.","locations":[{"ref":"packages/cli/src/serve/runner.rs:387-402","code":"  387 |     pub(crate) async fn handle_file_change(&mut self, files: &[PathBuf], server: &mut WebServer) {\n  388 |         // We can attempt to hotpatch if the build is in a bad state, since this patch might be a recovery.\n  389 |         if !matches!(\n  390 |             self.client.stage,\n  391 |             BuildStage::Failed | BuildStage::Aborted | BuildStage::Success\n  392 |         ) {\n  393 |             // Queue file changes that arrive during a build, so we can process them after the build completes.\n  394 |             // This prevents losing changes from tools like stylance, tailwind, or sass that generate files\n  395 |             // in response to source changes.\n  396 |             tracing::debug!(\n  397 |                 \"Queueing file change - client is not ready to receive hotreloads. Files: {:?}\",\n  398 |                 files\n  399 |             );\n  400 |             self.pending_file_changes.extend(files.iter().cloned());\n  401 |             return;\n  402 |         }","lines":16,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/serve/runner.rs#L387-L402"},{"ref":"packages/cli/src/serve/runner.rs:669-675","code":"  669 |             self.add_hot_reload_message(&msg);\n  670 | \n  671 |             let file = files[0].display().to_string();\n  672 |             let workspace_dir = self.client.build.workspace_dir().display().to_string();\n  673 |             let file = file\n  674 |                 .trim_start_matches(&workspace_dir)\n  675 |                 .trim_start_matches('/');","lines":7,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/serve/runner.rs#L669-L675"}]},
{"id":"PANIC_36","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`NativeFileData::name` calls `self.0.file_name().unwrap()`. `Path::file_name()` returns `None` for paths that end in `..`, or are the root/prefix (e.g. `/` on Unix, `C:\\` on Windows). Such a path can reach here from a native drag-and-drop of a filesystem root (`DesktopFileDragEvent`/`DesktopFileData` wraps whatever `PathBuf` wry hands back from the OS), or from a directory picker (`FileDialogRequest` with `directory: true`) if the user selects a drive root. In that case `.unwrap()` panics instead of falling back to an empty/placeholder name.","fix":"Fall back to a safe default instead of panicking:\n\n```rust\nfn name(&self) -> String {\n    self.0\n        .file_name()\n        .map(|n| n.to_string_lossy().into_owned())\n        .unwrap_or_default()\n}\n```","locations":[{"ref":"packages/desktop/src/file_upload.rs:407-410","code":"  407 | impl NativeFileData for DesktopFileData {\n  408 |     fn name(&self) -> String {\n  409 |         self.0.file_name().unwrap().to_string_lossy().into_owned()\n  410 |     }","lines":4,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/desktop/src/file_upload.rs#L407-L410"}]},
{"id":"PANIC_37","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`index_request` uses `index.find(\"<\/head>\").expect(\"Head element to exist\")` and `index.find(\"<\/body>\").expect(\"Body element to exist\")` when injecting the custom head/module-loader script into a user-supplied `custom_index`/`custom_head` HTML document (set via `Config::with_custom_index`/`with_custom_head`). Any app that supplies a custom index without a literal `<\/head>` or `<\/body>` tag (e.g. self-closing markup, different casing, or a template that assembles the body tag dynamically at runtime) causes this to panic on every request for `/`, taking down the webview instead of surfacing a clear configuration error.","fix":"Return a clear startup error instead of panicking deep inside the HTTP request handler, e.g. validate `custom_index`/`custom_head` once during `WebviewInstance::new` and fail fast with a descriptive message, or fall back to appending the tags when missing:\n\n```rust\nlet head_pos = index.find(\"<\/head>\").unwrap_or_else(|| index.len());\n```\n\nAt minimum, replace `.expect(...)` with a `tracing::error!` + graceful fallback so a malformed custom index doesn't crash the running app.","locations":[{"ref":"packages/desktop/src/protocol.rs:116-131","code":"  116 |     // Load a custom index file if provided\n  117 |     let mut index = custom_index.unwrap_or_else(|| DEFAULT_INDEX.to_string());\n  118 | \n  119 |     // Insert a custom head if provided\n  120 |     // We look just for the closing head tag. If a user provided a custom index with weird syntax, this might fail\n  121 |     if let Some(head) = custom_head {\n  122 |         index.insert_str(index.find(\"<\/head>\").expect(\"Head element to exist\"), &head);\n  123 |     }\n  124 | \n  125 |     // Inject our module loader by looking for a body tag\n  126 |     // A failure mode here, obviously, is if the user provided a custom index without a body tag\n  127 |     // Might want to document this\n  128 |     index.insert_str(\n  129 |         index.find(\"<\/body>\").expect(\"Body element to exist\"),\n  130 |         &module_loader(root_name, headless, edit_state),\n  131 |     );","lines":16,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/desktop/src/protocol.rs#L116-L131"}]},
{"id":"PANIC_38","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`impl IntoAccelerator for &str` implements `accelerator()` as `HotKey::from_str(self).unwrap()`. `HotKey::from_str` (from the `global_hotkey` crate) returns `Err` for any string that isn't a valid accelerator syntax. Since this trait is reachable from the public `use_global_shortcut`/`DesktopService::create_shortcut` API with an arbitrary `&str` (e.g. a string built from user preferences, a config file, or a typo), a malformed accelerator string panics instead of surfacing a `ShortcutRegistryError`, even though `add_shortcut` already returns a `Result` specifically to report this kind of failure gracefully.","fix":"Since `IntoAccelerator::accelerator()` returns `HotKey` (not a `Result`), plumb the parse failure through instead of unwrapping, e.g. change the trait to return `Result<HotKey, ShortcutRegistryError>` or document that callers must validate the string first. As a minimal fix that still avoids a hard panic:\n\n```rust\nimpl IntoAccelerator for &str {\n    fn accelerator(&self) -> HotKey {\n        HotKey::from_str(self).unwrap_or_else(|_| {\n            tracing::error!(\"Invalid accelerator string: {self:?}\");\n            HotKey::new(None, Code::Unidentified)\n        })\n    }\n}\n```","locations":[{"ref":"packages/desktop/src/shortcut.rs:155-159","code":"  155 | impl IntoAccelerator for &str {\n  156 |     fn accelerator(&self) -> HotKey {\n  157 |         HotKey::from_str(self).unwrap()\n  158 |     }\n  159 | }","lines":5,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/desktop/src/shortcut.rs#L155-L159"}]},
{"id":"PANIC_39","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`WebSocketOptions::on_upgrade` calls `self.upgrade.unwrap()`, which panics if `on_upgrade` is called on a `WebSocketOptions` that was not produced by the server-side `FromRequest` extraction path (which is the only place `upgrade` is set to `Some`). A user constructing `WebSocketOptions::new()` manually (e.g. for client-side configuration, matching the type's dual client/server role suggested by `with_automatic_reconnect`) and then mistakenly calling `.on_upgrade(...)` instead of using it purely as request options will panic instead of getting a compile-time or documented runtime error.","fix":"Document clearly on `on_upgrade` that it must only be called on a server-extracted `WebSocketOptions`, or make the invariant safer by returning a `Result`/`HttpError` response when `self.upgrade` is `None` instead of panicking.","locations":[{"ref":"packages/fullstack/src/payloads/websocket.rs:554-581","code":"  554 |     #[cfg(feature = \"server\")]\n  555 |     pub fn on_upgrade<F, Fut, In, Out, Enc>(mut self, callback: F) -> Websocket<In, Out, Enc>\n  556 |     where\n  557 |         F: FnOnce(TypedWebsocket<In, Out, Enc>) -> Fut + Send + 'static,\n  558 |         Fut: Future<Output = ()> + 'static,\n  559 |     {\n  560 |         let on_failed_upgrade = self.on_failed_upgrade.take();\n  561 |         let response = self\n  562 |             .upgrade\n  563 |             .unwrap()\n  564 |             .on_failed_upgrade(|e| {\n  565 |                 if let Some(callback) = on_failed_upgrade {\n  566 |                     callback(e);\n  567 |                 }\n  568 |             })\n  569 |             .on_upgrade(|socket| {\n  570 |                 let res = crate::spawn_platform(move || {\n  571 |                     callback(TypedWebsocket {\n  572 |                         _in: PhantomData,\n  573 |                         _out: PhantomData,\n  574 |                         _enc: PhantomData,\n  575 |                         inner: socket,\n  576 |                     })\n  577 |                 });\n  578 |                 async move {\n  579 |                     let _ = res.await;\n  580 |                 }\n  581 |             });","lines":28,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/fullstack/src/payloads/websocket.rs#L554-L581"}]},
{"id":"UAF_1","type":"use_after_free","type_label":"Use After Free","severity":"critical","difficulty":"medium","description":"`MultipartFormData` (default type parameter `MultipartFormData<()>`) contains `_client: Option<Rc<FormData>>`, but the type has manual `unsafe impl Send for MultipartFormData {}` and `unsafe impl Sync for MultipartFormData {}`. `Rc<T>` is never `Send`/`Sync` because its reference count is a plain (non-atomic) integer; forcing `Send`/`Sync` onto a struct that can hold a live `Rc` bypasses that guarantee. If a `MultipartFormData` populated via `From<FormEvent>`/`From<Rc<FormData>>` (i.e. `_client: Some(rc)`) is captured into a future that is actually moved across OS threads (e.g. passed through `IntoRequest::into_request`'s `'static` future on a multi-threaded tokio runtime, or a naive `tokio::spawn` elsewhere that only compiles because of this unsafe impl), concurrent non-atomic increments/decrements of the `Rc`'s strong count from different threads is a data race that can under-count or over-count references, leading to premature deallocation while a live reference still exists (use-after-free) or a double free.","fix":"Do not blanket-implement `Send`/`Sync` for a type holding an `Rc`. Either wrap `_client` in `send_wrapper::SendWrapper<Rc<FormData>>` (already used elsewhere in this crate, e.g. `magic.rs`/`stream.rs`) so misuse panics loudly instead of racing, or switch the client-side storage to `Arc<FormData>` if it must genuinely cross threads, and drop the manual `unsafe impl Send/Sync` entirely so the compiler enforces the real thread-safety of whatever type is chosen.","locations":[{"ref":"packages/fullstack/src/payloads/multipart.rs:43-50","code":"   43 | pub struct MultipartFormData<T = ()> {\n   44 |     #[cfg(feature = \"server\")]\n   45 |     form: Option<axum::extract::Multipart>,\n   46 | \n   47 |     _client: Option<Rc<FormData>>,\n   48 | \n   49 |     _phantom: std::marker::PhantomData<T>,\n   50 | }","lines":8,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/fullstack/src/payloads/multipart.rs#L43-L50"},{"ref":"packages/fullstack/src/payloads/multipart.rs:145-169","code":"  145 | impl<T> From<Rc<FormData>> for MultipartFormData<T> {\n  146 |     fn from(_value: Rc<FormData>) -> Self {\n  147 |         MultipartFormData {\n  148 |             #[cfg(feature = \"server\")]\n  149 |             form: None,\n  150 |             _client: Some(_value),\n  151 |             _phantom: std::marker::PhantomData,\n  152 |         }\n  153 |     }\n  154 | }\n  155 | \n  156 | impl<T> From<FormEvent> for MultipartFormData<T> {\n  157 |     fn from(event: FormEvent) -> Self {\n  158 |         let data = event.data();\n  159 |         MultipartFormData {\n  160 |             #[cfg(feature = \"server\")]\n  161 |             form: None,\n  162 |             _client: Some(data),\n  163 |             _phantom: std::marker::PhantomData,\n  164 |         }\n  165 |     }\n  166 | }\n  167 | \n  168 | unsafe impl Send for MultipartFormData {}\n  169 | unsafe impl Sync for MultipartFormData {}","lines":25,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/fullstack/src/payloads/multipart.rs#L145-L169"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"`ConstStr::rsplit_once` computes `let mut index = str.len() - 1;` before checking whether the string is empty. If `self` is an empty `ConstStr` (`str.len() == 0`), this underflows: in debug builds it panics with \"attempt to subtract with overflow\", and in release builds it wraps to `usize::MAX`, which then panics on the subsequent `bytes[index]` access. The sibling method `split_once` handles the empty case correctly (its `while index < bytes.len()` loop simply never executes and returns `None`), showing this is an asymmetric, unintended gap rather than a deliberate precondition.","fix":"Guard against the empty-string case before subtracting, e.g.:\n```rust\npub const fn rsplit_once(&self, char: char) -> Option<(Self, Self)> {\n    let str = self.as_str();\n    if str.is_empty() {\n        return None;\n    }\n    let mut index = str.len() - 1;\n    ...\n```","locations":[{"ref":"packages/const-serialize/src/str.rs:160-163","code":"  160 |     pub const fn rsplit_once(&self, char: char) -> Option<(Self, Self)> {\n  161 |         let str = self.as_str();\n  162 |         let mut index = str.len() - 1;\n  163 |         // First find the bytes we are searching for","lines":4,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/const-serialize/src/str.rs#L160-L163"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`write_attr_comments` computes `attr_span.start().column - 1` on a `usize` without checking for `column == 0`. `column` is 0-indexed, so any attribute that starts as the very first character of its line (e.g. unformatted/minimally-indented rsx being fed through the autoformatter for the first time, such as `div {\\nattr: 1\\n}`) triggers an underflow. In debug/test builds (this workspace does not set `overflow-checks` in `[profile.dev]`, so it defaults on with `debug-assertions`) this panics; in release it silently wraps to `usize::MAX`, and the subsequent `line.get(..huge_number)` returns `None`, silently skipping comment handling instead of failing loudly.","fix":"Use `saturating_sub` to avoid the underflow:\n```rust\nlet row_start = line\n    .get(..attr_span.start().column.saturating_sub(1))\n    .unwrap_or(\"\");\n```","locations":[{"ref":"packages/autofmt/src/writer.rs:681-704","code":"  681 |     fn write_attr_comments(&mut self, brace: &Brace, attr_span: Span) -> Result {\n  682 |         // There's a chance this line actually shares the same line as the previous\n  683 |         // Only write comments if the comments actually belong to this line\n  684 |         //\n  685 |         // to do this, we check if the attr span starts on the same line as the brace\n  686 |         // if it doesn't, we write the comments\n  687 |         let brace_line = brace.span.span().start().line;\n  688 |         let attr_line = attr_span.start().line;\n  689 | \n  690 |         if brace_line != attr_line {\n  691 |             // Get the raw line of the attribute\n  692 |             let line = self.src.get(attr_line - 1).unwrap_or(&\"\");\n  693 | \n  694 |             // Only write comments if the line is empty before the attribute start\n  695 |             let row_start = line.get(..attr_span.start().column - 1).unwrap_or(\"\");\n  696 |             if !row_start.trim().is_empty() {\n  697 |                 return Ok(());\n  698 |             }\n  699 | \n  700 |             self.write_comments(attr_span.start())?;\n  701 |         }\n  702 | \n  703 |         Ok(())\n  704 |     }","lines":24,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/autofmt/src/writer.rs#L681-L704"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"`PrimitiveLayout::read` accumulates into a `u32` with `value |= (byte as u32) << (offset * 8)` while looping `offset` from `0` to `self.size - 1`. If `self.size > 4` (e.g. a `PrimitiveLayout` describing an 8-byte discriminant for a `#[repr(i64)]`/`#[repr(u64)]`/`#[repr(usize)]` enum on a 64-bit target), then at `offset == 4` the shift amount becomes `32`, which panics with \"attempt to shift left with overflow\" in debug builds and yields an incorrect masked shift in release builds. The companion `write` method has the same undocumented 4-byte assumption: it does `let bytes = value.to_ne_bytes()` on a `u32` (always 4 bytes) but then loops `offset < self.size`, so for `self.size > 4` the `bytes[offset]` access at `offset >= 4` panics with an index-out-of-bounds error. Neither function asserts or documents that `size` must be `<= 4`, even though `PrimitiveLayout::new` is a public constructor that accepts an arbitrary `size`, and this type is used for enum discriminants (`EnumLayout`) and list length fields, whose size is derived from the real Rust type and is not guaranteed to be `<= 4` bytes.","fix":"Either enforce the 4-byte limit explicitly (e.g. `assert!(self.size <= 4)` in `read`/`write`, or in `PrimitiveLayout::new`), or generalize both functions to operate on `u64`/8 bytes so larger discriminant sizes are handled correctly:\n```rust\npub const unsafe fn read(self, byte_ptr: *const u8) -> u64 { /* accumulate into u64 */ }\npub const fn write(self, value: u64, out: &mut [MaybeUninit<u8>]) { let bytes = value.to_ne_bytes(); /* 8 bytes */ }\n```","locations":[{"ref":"packages/const-serialize/src/primitive.rs:20-48","code":"   20 |     pub const unsafe fn read(self, byte_ptr: *const u8) -> u32 {\n   21 |         let mut value = 0;\n   22 |         let mut offset = 0;\n   23 |         while offset < self.size {\n   24 |             // If the bytes are reversed, walk backwards from the end of the number when pushing bytes\n   25 |             let byte = if cfg!(target_endian = \"big\") {\n   26 |                 unsafe {\n   27 |                     byte_ptr\n   28 |                         .wrapping_byte_add((self.size - offset - 1) as _)\n   29 |                         .read()\n   30 |                 }\n   31 |             } else {\n   32 |                 unsafe { byte_ptr.wrapping_byte_add(offset as _).read() }\n   33 |             };\n   34 |             value |= (byte as u32) << (offset * 8);\n   35 |             offset += 1;\n   36 |         }\n   37 |         value\n   38 |     }\n   39 | \n   40 |     /// Write the value to the given buffer\n   41 |     pub const fn write(self, value: u32, out: &mut [MaybeUninit<u8>]) {\n   42 |         let bytes = value.to_ne_bytes();\n   43 |         let mut offset = 0;\n   44 |         while offset < self.size {\n   45 |             out[offset] = MaybeUninit::new(bytes[offset]);\n   46 |             offset += 1;\n   47 |         }\n   48 |     }","lines":29,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/const-serialize/src/primitive.rs#L20-L48"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"In `Output::render_log`, `let start = start.min(term_size.height - 1);` subtracts 1 from `term_size.height` without a bounds check. If the terminal reports a height of 0 (e.g. a very small/resizing terminal, or a headless PTY briefly reporting a zero size), this underflows the `u16`, which panics in debug builds and silently wraps to `65535` in release builds, corrupting the cursor position math used afterward.","fix":"Use a saturating subtraction:\n```rust\nlet start = start.min(term_size.height.saturating_sub(1));\n```","locations":[{"ref":"packages/cli/src/serve/output.rs:976-977","code":"  976 |             let start = frame_rect.y + idx as u16;\n  977 |             let start = start.min(term_size.height - 1);","lines":2,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/serve/output.rs#L976-L977"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"critical","difficulty":"very_easy","description":"In the `SerializeConst` derive macro (`const-serialize-macro`), the discriminant byte size computed from `#[repr(u*)]` is wrong for `u32` and `u64`. The code maps `u8 -> 1`, `u16 -> 2`, `u32 -> 3`, `u64 -> 4` (a sequential counter) instead of the actual byte widths `1, 2, 4, 8`. This `discriminant_size` value is fed directly into `#krate::PrimitiveLayout::new(#discriminant_size as usize)`, which `const-serialize/src/primitive.rs` treats as the number of bytes to read/write for the discriminant (see `PrimitiveLayout::size` and its `read`/`write` methods). For any enum annotated `#[repr(u32, ...)]` this causes the discriminant to be serialized/deserialized using only 3 of its 4 bytes, and for `#[repr(u64, ...)]` only 4 of its 8 bytes. `EnumLayout::new` also uses `discriminant.size` to compute `variants_offset` (where the variant's data starts), so the wrong size additionally misaligns/corrupts the offset used to read the rest of the enum's fields, and `deserialize_const_enum` writes into `MaybeUninit<u8>` output leaving some discriminant bytes uninitialized. This is a silent correctness/memory-safety bug in a public macro (`#[derive(SerializeConst)]`) for any `repr(u32)`/`repr(u64)` enum.","fix":"Use actual byte widths instead of a sequential counter:\n```rust\nif meta.path.is_ident(\"u8\") {\n    discriminant_size = Some(1);\n    return Ok(());\n}\nif meta.path.is_ident(\"u16\") {\n    discriminant_size = Some(2);\n    return Ok(());\n}\nif meta.path.is_ident(\"u32\") {\n    discriminant_size = Some(4);\n    return Ok(());\n}\nif meta.path.is_ident(\"u64\") {\n    discriminant_size = Some(8);\n    return Ok(());\n}\n```","locations":[{"ref":"packages/const-serialize-macro/src/lib.rs:114-136","code":"  114 |                             // #[repr(u8)]\n  115 |                             if meta.path.is_ident(\"u8\") {\n  116 |                                 discriminant_size = Some(1);\n  117 |                                 return Ok(());\n  118 |                             }\n  119 | \n  120 |                             // #[repr(u16)]\n  121 |                             if meta.path.is_ident(\"u16\") {\n  122 |                                 discriminant_size = Some(2);\n  123 |                                 return Ok(());\n  124 |                             }\n  125 | \n  126 |                             // #[repr(u32)]\n  127 |                             if meta.path.is_ident(\"u32\") {\n  128 |                                 discriminant_size = Some(3);\n  129 |                                 return Ok(());\n  130 |                             }\n  131 | \n  132 |                             // #[repr(u64)]\n  133 |                             if meta.path.is_ident(\"u64\") {\n  134 |                                 discriminant_size = Some(4);\n  135 |                                 return Ok(());\n  136 |                             }","lines":23,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/const-serialize-macro/src/lib.rs#L114-L136"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In `post_create` (`packages/cli/src/cli/create.rs`), `is_workspace` is computed as `metadata.is_some()` (line 164) purely from whether `cargo_metadata::MetadataCommand` succeeded in the parent directory - which is true even when the parent directory is a *single, non-workspace* crate (cargo_metadata always returns a `workspace_root`, even for standalone packages). The subsequent `metadata.and_then(...)` block (lines 165-178) that actually tries to append the new crate to `[workspace] members` uses `?` on `Option` and silently does nothing if there is no `[workspace]` table (`cargo_toml.get_mut(\"workspace\")?` returns `None`). So when the new project is created next to/inside an existing standalone (non-workspace) crate, `is_workspace` is wrongly `true`, the member-registration silently no-ops, AND the later step `if !is_workspace { vcs.initialize(path, ...) }` (lines 217-219) is skipped - leaving the freshly generated project with neither a workspace membership entry nor its own git repository initialized.","fix":"Determine `is_workspace` from whether the member was actually added (e.g. make the `and_then` closure return a `bool`/`Result<bool>` indicating success and use that value for the git-init decision), rather than merely from `cargo_metadata` succeeding. Alternatively check `metadata.workspace_root != <parent crate path>` and that the parsed Cargo.toml actually contains a `[workspace]` table before treating it as a workspace.","locations":[{"ref":"packages/cli/src/cli/create.rs:145-219","code":"  145 | pub(crate) fn post_create(path: &Path, vcs: &Vcs) -> Result<()> {\n  146 |     let metadata = if let Some(parent_dir) = path.parent() {\n  147 |         match cargo_metadata::MetadataCommand::new()\n  148 |             .current_dir(parent_dir)\n  149 |             .exec()\n  150 |         {\n  151 |             Ok(v) => Some(v),\n  152 |             // Only 1 error means that CWD isn't a cargo project.\n  153 |             Err(cargo_metadata::Error::CargoMetadata { .. }) => None,\n  154 |             Err(err) => {\n  155 |                 anyhow::bail!(\"Couldn't retrieve cargo metadata: {:?}\", err)\n  156 |             }\n  157 |         }\n  158 |     } else {\n  159 |         None\n  160 |     };\n  161 | \n  162 |     // 1. Add the new project to the workspace, if it exists.\n  163 |     //    This must be executed first in order to run `cargo fmt` on the new project.\n  164 |     let is_workspace = metadata.is_some();\n  165 |     metadata.and_then(|metadata| {\n  166 |         let cargo_toml_path = &metadata.workspace_root.join(\"Cargo.toml\");\n  167 |         let cargo_toml_str = std::fs::read_to_string(cargo_toml_path).ok()?;\n  168 |         let relative_path = path.strip_prefix(metadata.workspace_root).ok()?;\n  169 | \n  170 |         let mut cargo_toml: toml_edit::DocumentMut = cargo_toml_str.parse().ok()?;\n  171 |         cargo_toml\n  172 |             .get_mut(\"workspace\")?\n  173 |             .get_mut(\"members\")?\n  174 |             .as_array_mut()?\n  175 |             .push(relative_path.display().to_string());\n  176 | \n  177 |         std::fs::write(cargo_toml_path, cargo_toml.to_string()).ok()\n  178 |     });\n  179 | \n  180 |     // 2. Run `cargo fmt` on the new project.\n  181 |     let mut cmd = Command::new(\"cargo\");\n  182 |     let cmd = cmd.arg(\"fmt\").current_dir(path);\n  183 |     let output = cmd.output().expect(\"failed to execute process\");\n  184 |     if !output.status.success() {\n  185 |         tracing::error!(dx_src = ?TraceSrc::Dev, \"cargo fmt failed\");\n  186 |         tracing::error!(dx_src = ?TraceSrc::Build, \"stdout: {}\", String::from_utf8_lossy(&output.stdout));\n  187 |         tracing::error!(dx_src = ?TraceSrc::Build, \"stderr: {}\", String::from_utf8_lossy(&output.stderr));\n  188 |     }\n  189 | \n  190 |     // 3. Format the `Cargo.toml` and `Dioxus.toml` files.\n  191 |     let toml_paths = [path.join(\"Cargo.toml\"), path.join(\"Dioxus.toml\")];\n  192 |     for toml_path in &toml_paths {\n  193 |         let Ok(toml) = std::fs::read_to_string(toml_path) else {\n  194 |             continue;\n  195 |         };\n  196 | \n  197 |         let mut toml = toml.parse::<toml_edit::DocumentMut>().map_err(|e| {\n  198 |             anyhow::anyhow!(\"failed to parse toml at {}: {}\", toml_path.display(), e)\n  199 |         })?;\n  200 | \n  201 |         toml.as_table_mut().fmt();\n  202 | \n  203 |         let as_string = toml.to_string();\n  204 |         let new_string = remove_triple_newlines(&as_string);\n  205 |         let mut file = std::fs::File::create(toml_path)?;\n  206 |         file.write_all(new_string.as_bytes())?;\n  207 |     }\n  208 | \n  209 |     // 4. Remove any triple newlines from the readme.\n  210 |     let readme_path = path.join(\"README.md\");\n  211 |     let readme = std::fs::read_to_string(&readme_path)?;\n  212 |     let new_readme = remove_triple_newlines(&readme);\n  213 |     let mut file = std::fs::File::create(readme_path)?;\n  214 |     file.write_all(new_readme.as_bytes())?;\n  215 | \n  216 |     // 5. Run git init\n  217 |     if !is_workspace {\n  218 |         vcs.initialize(path, Some(\"main\"), true)?;\n  219 |     }","lines":75,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/cli/create.rs#L145-L219"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In `add_hash_to_asset`, the asset hash bytes are formatted with `format!(\"{byte:x}\")`, which omits the leading zero for byte values below 0x10. Because the per-byte hex strings are concatenated directly (no separator, no fixed width), two different hash byte sequences can produce the *same* string, e.g. bytes `[0x1, 0x23]` -> \"1\"+\"23\" = \"123\" and bytes `[0x12, 0x3]` -> \"12\"+\"3\" = \"123\". This silently reduces the effective collision resistance of the `-dxh<hash>` suffix used to cache-bust and disambiguate bundled asset filenames. Combined with `process_folder`'s parallel (`rayon`) processing in `packages/cli/src/opt/folder.rs`, two differently-hashed assets that collide to the same formatted string can race on the same `partial.<name>` temp file / final output path in `process_file_to` (`packages/cli/src/opt/file.rs`), corrupting one asset with another's contents.","fix":"Zero-pad each byte to two hex digits so the mapping from bytes to string is unambiguous:\n```rust\nlet hash = hash\n    .iter()\n    .map(|byte| format!(\"{byte:02x}\"))\n    .collect::<String>();\n```","locations":[{"ref":"packages/cli/src/opt/hash.rs:155-159","code":"  155 |             let hash = hash.bytes();\n  156 |             let hash = hash\n  157 |                 .iter()\n  158 |                 .map(|byte| format!(\"{byte:x}\"))\n  159 |                 .collect::<String>();","lines":5,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/opt/hash.rs#L155-L159"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`CargoDependency::Detailed.default_features` is declared as `#[serde(default, skip_serializing_if = \"std::ops::Not::not\")] default_features: bool`. Because plain `#[serde(default)]` on a `bool` yields `false`, any component manifest that specifies a detailed cargo dependency (e.g. `{ name = \"foo\", version = \"1.0\" }`) without explicitly writing `default_features = true` will deserialize `default_features` as `false`. In `CargoDependency::add_command` (`if !*default_features { cmd.arg(\"--no-default-features\"); }`), this silently appends `--no-default-features` to the generated `cargo add` command in `packages/cli/src/cli/component.rs::add_rust_dependencies`, disabling the dependency's default features even though the manifest author never asked for that - the opposite of Cargo's own default behavior (which keeps default features unless explicitly disabled).","fix":"Give `default_features` a `true` default so omitting the field matches Cargo's own semantics:\n```rust\n#[serde(default = \"default_true\", skip_serializing_if = \"std::ops::Not::not\")]\ndefault_features: bool,\n```\nand add `fn default_true() -> bool { true }` (adjusting `skip_serializing_if` if the serialized form should now omit `true` instead of `false`).","locations":[{"ref":"packages/component-manifest/src/lib.rs:49-66","code":"   49 | #[derive(Deserialize, Serialize, JsonSchema, Clone, Debug, PartialEq, Eq, Hash)]\n   50 | #[serde(untagged)]\n   51 | pub enum CargoDependency {\n   52 |     Simple(String),\n   53 |     Detailed {\n   54 |         name: String,\n   55 |         #[serde(default)]\n   56 |         version: Option<String>,\n   57 |         #[serde(default, skip_serializing_if = \"Vec::is_empty\")]\n   58 |         features: Vec<String>,\n   59 |         #[serde(default, skip_serializing_if = \"std::ops::Not::not\")]\n   60 |         default_features: bool,\n   61 |         #[serde(default, skip_serializing_if = \"Option::is_none\")]\n   62 |         git: Option<String>,\n   63 |         #[serde(default, skip_serializing_if = \"Option::is_none\")]\n   64 |         rev: Option<String>,\n   65 |     },\n   66 | }","lines":18,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/component-manifest/src/lib.rs#L49-L66"},{"ref":"packages/component-manifest/src/lib.rs:92-97","code":"   92 |                 if !features.is_empty() {\n   93 |                     cmd.arg(\"--features\").arg(features.join(\",\"));\n   94 |                 }\n   95 |                 if !*default_features {\n   96 |                     cmd.arg(\"--no-default-features\");\n   97 |                 }","lines":6,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/component-manifest/src/lib.rs#L92-L97"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`ReactiveContext::run_in` pushes `*self` onto the thread-local `CURRENT` stack, calls `f()`, then pops the stack and calls `self.update_subscribers()`. None of this is panic-safe: if `f()` panics (which is a supported, documented scenario in this codebase - components are rendered inside `std::panic::catch_unwind` in `any_props.rs`, and reactive closures such as `use_memo`/`use_selector` closures run inside `run_in`), the `pop()` call and the `self.update_subscribers()` call are skipped. The stale `ReactiveContext` entry is left on `CURRENT` forever (for the lifetime of the thread), so every subsequent, unrelated call to `ReactiveContext::current()` will return this stale/wrong context until something else happens to push and correctly pop over it. This corrupts subscription bookkeeping silently: unrelated signal reads elsewhere in the app can end up subscribing the wrong (possibly already-dropped) reactive context, causing missed updates or updates delivered to the wrong component.","fix":"Use a drop guard so the stack is always popped, even on panic:\n```rust\npub fn run_in<O>(&self, f: impl FnOnce() -> O) -> O {\n    struct PopOnDrop;\n    impl Drop for PopOnDrop {\n        fn drop(&mut self) {\n            CURRENT.with(|current| { current.borrow_mut().pop(); });\n        }\n    }\n\n    CURRENT.with(|current| current.borrow_mut().push(*self));\n    let _guard = PopOnDrop;\n    let out = f();\n    drop(_guard);\n    self.update_subscribers();\n    out\n}\n```\nAlternatively wrap the call in `std::panic::catch_unwind`/`scopeguard::guard` so the pop always runs before the panic continues to unwind.","locations":[{"ref":"packages/core/src/reactive_context.rs:204-210","code":"  204 |     pub fn run_in<O>(&self, f: impl FnOnce() -> O) -> O {\n  205 |         CURRENT.with(|current| current.borrow_mut().push(*self));\n  206 |         let out = f();\n  207 |         CURRENT.with(|current| current.borrow_mut().pop());\n  208 |         self.update_subscribers();\n  209 |         out\n  210 |     }","lines":7,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/core/src/reactive_context.rs#L204-L210"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In `packages/desktop/src/default_icon.rs`, the `path()` implementations for `DioxusTrayIcon`, `DioxusMenuIcon`, and `Icon` accept an optional `size: Option<(u32, u32)>` but never actually resize the decoded image. `load_image_from_path` returns `(img, width, height)` where `img` is an RGBA byte buffer whose length is `width * height * 4`. When `size` is `Some((width, height))`, the code shadows the outer `width`/`height` with the requested size and calls `from_rgba(img, width, height)` - passing the *original*, un-resized pixel buffer together with the *requested* dimensions. Both the `if` and `else` branches are otherwise identical, so the only effect of supplying `size` is to mismatch the buffer length against the claimed width/height. Since icon backends (`tao::window::Icon::from_rgba`, `tray-icon`, etc.) validate that `buffer.len() == width * height * 4`, any call with a `size` different from the source image's actual dimensions will return an `Err` (or otherwise produce a corrupted icon) instead of resizing the image as the API implies. This makes the public `icon_from_path(path, Some(size))` API effectively broken whenever `size` differs from the file's native dimensions.","fix":"Actually resize the decoded image to the requested size before building the icon, e.g.:\n```rust\nfn path<P: AsRef<Path>>(path: P, size: Option<(u32, u32)>) -> Result<Self> {\n    let img = ImageReader::open(path)?.decode()?;\n    let (img, width, height) = match size {\n        Some((w, h)) => (img.resize_exact(w, h, image::imageops::FilterType::Lanczos3), w, h),\n        None => {\n            let (w, h) = img.dimensions();\n            (img, w, h)\n        }\n    };\n    Ok(Icon::from_rgba(img.to_rgba8().to_vec(), width, height)?)\n}\n```\nApply the same fix to all three copies (`DioxusTrayIcon`, `DioxusMenuIcon`, `Icon`), or factor the shared logic into `load_image_from_path` so there is only one implementation to fix.","locations":[{"ref":"packages/desktop/src/default_icon.rs:68-78","code":"   68 |     fn path<P: AsRef<Path>>(path: P, size: Option<(u32, u32)>) -> Result<Self>\n   69 |     where\n   70 |         Self: Sized,\n   71 |     {\n   72 |         let (img, width, height) = load_image_from_path(path)?;\n   73 |         if let Some((width, height)) = size {\n   74 |             Ok(DioxusTrayIcon::from_rgba(img, width, height)?)\n   75 |         } else {\n   76 |             Ok(DioxusTrayIcon::from_rgba(img, width, height)?)\n   77 |         }\n   78 |     }","lines":11,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/desktop/src/default_icon.rs#L68-L78"},{"ref":"packages/desktop/src/default_icon.rs:110-120","code":"  110 |     fn path<P: AsRef<Path>>(path: P, size: Option<(u32, u32)>) -> Result<Self>\n  111 |     where\n  112 |         Self: Sized,\n  113 |     {\n  114 |         let (img, width, height) = load_image_from_path(path)?;\n  115 |         if let Some((width, height)) = size {\n  116 |             Ok(DioxusMenuIcon::from_rgba(img, width, height)?)\n  117 |         } else {\n  118 |             Ok(DioxusMenuIcon::from_rgba(img, width, height)?)\n  119 |         }\n  120 |     }","lines":11,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/desktop/src/default_icon.rs#L110-L120"},{"ref":"packages/desktop/src/default_icon.rs:153-163","code":"  153 |     fn path<P: AsRef<Path>>(path: P, size: Option<(u32, u32)>) -> Result<Self>\n  154 |     where\n  155 |         Self: Sized,\n  156 |     {\n  157 |         let (img, width, height) = load_image_from_path(path)?;\n  158 |         if let Some((width, height)) = size {\n  159 |             Ok(Icon::from_rgba(img, width, height)?)\n  160 |         } else {\n  161 |             Ok(Icon::from_rgba(img, width, height)?)\n  162 |         }\n  163 |     }","lines":11,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/desktop/src/default_icon.rs#L153-L163"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"Setting `IncrementalRendererConfig::memory_cache_limit(0)` silently disables reads from the on-disk ISR cache entirely, even though the file system cache is still being written to.\n\n`InMemoryCache::new` stores `lru: None` when `NonZeroUsize::new(memory_cache_limit)` is `None` (i.e. `memory_cache_limit == 0`). In `try_get_or_insert` (`packages/fullstack-server/src/isrg/memory_cache.rs:50-88`), the `or_insert` closure - which is the only place that actually queries `FileSystemCache::get` (see `IncrementalRenderer::get` in `mod.rs:105-146`) - is passed to `self.lru.as_mut()...try_get_or_insert(...)`. When `self.lru` is `None`, that whole branch is skipped and the function falls straight through to `Ok(None)` at the bottom without ever calling `or_insert`.\n\nThis means a user who configures `.memory_cache_limit(0)` (e.g. intending \"don't cache in memory, but keep the persisted file-system cache for durability across restarts\") gets a complete cache miss on every single request: `cache()`/`put()` still writes the html to disk, but `get()` never checks disk when the in-memory LRU is disabled, so every request pays the full render cost and the `IncrementalRendererConfig` feature is effectively broken for that configuration.","fix":"Restructure `IncrementalRenderer::get` so the file-system cache lookup does not depend on the in-memory LRU being enabled - e.g. check the file system cache directly when `self.lru` is `None` (or always check it first, then use the memory cache only for eviction/perf on top), rather than relying on `InMemoryCache::try_get_or_insert`'s closure as the sole trigger for the disk lookup.","locations":[{"ref":"packages/fullstack-server/src/isrg/memory_cache.rs:45-88","code":"   45 |     pub fn try_get_or_insert<'a, F: FnOnce() -> Result<(DateTime<Utc>, Vec<u8>), E>, E>(\n   46 |         &'a mut self,\n   47 |         route: &str,\n   48 |         or_insert: F,\n   49 |     ) -> Result<Option<(RenderFreshness, &'a [u8])>, E> {\n   50 |         if let Some(memory_cache) = self.lru.as_mut() {\n   51 |             let (timestamp, _) = memory_cache.try_get_or_insert(route.to_string(), or_insert)?;\n   52 | \n   53 |             let now = Utc::now();\n   54 |             let elapsed = timestamp.signed_duration_since(now);\n   55 |             let age = elapsed.num_seconds();\n   56 |             // The cache entry is out of date, so we need to remove it.\n   57 |             if let Some(invalidate_after) = self.invalidate_after {\n   58 |                 // If we can't convert to a std duration, the duration is negative and hasn't elapsed yet.\n   59 |                 if let Ok(std_elapsed) = elapsed.to_std()\n   60 |                     && std_elapsed > invalidate_after\n   61 |                 {\n   62 |                     tracing::trace!(\"memory cache out of date\");\n   63 |                     memory_cache.pop(route);\n   64 |                     return Ok(None);\n   65 |                 }\n   66 |             }\n   67 | \n   68 |             // We need to reborrow because we may have invalidated the lifetime if the route was removed.\n   69 |             // We know it wasn't because we returned... but rust doesn't understand that.\n   70 |             let (timestamp, cache_hit) = memory_cache.get(route).unwrap();\n   71 | \n   72 |             return match self.invalidate_after {\n   73 |                 Some(invalidate_after) => {\n   74 |                     tracing::trace!(\"memory cache hit\");\n   75 |                     let max_age = invalidate_after.as_secs();\n   76 |                     let freshness = RenderFreshness::new(age as u64, max_age, *timestamp);\n   77 |                     Ok(Some((freshness, cache_hit)))\n   78 |                 }\n   79 |                 None => {\n   80 |                     tracing::trace!(\"memory cache hit\");\n   81 |                     let freshness = RenderFreshness::new_age(age as u64, *timestamp);\n   82 |                     Ok(Some((freshness, cache_hit)))\n   83 |                 }\n   84 |             };\n   85 |         }\n   86 | \n   87 |         Ok(None)\n   88 |     }","lines":44,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/fullstack-server/src/isrg/memory_cache.rs#L45-L88"},{"ref":"packages/fullstack-server/src/isrg/mod.rs:105-146","code":"  105 |     pub fn get<'a>(\n  106 |         &'a mut self,\n  107 |         route: &str,\n  108 |     ) -> Result<Option<CachedRender<'a>>, IncrementalRendererError> {\n  109 |         let Self {\n  110 |             memory_cache,\n  111 |             #[cfg(not(target_arch = \"wasm32\"))]\n  112 |             file_system_cache,\n  113 |             ..\n  114 |         } = self;\n  115 | \n  116 |         #[allow(unused)]\n  117 |         enum FsGetError {\n  118 |             NotPresent,\n  119 |             Error(IncrementalRendererError),\n  120 |         }\n  121 | \n  122 |         // The borrow checker prevents us from simply using a match/if and returning early. Instead we need to use the more complex closure API\n  123 |         // non lexical lifetimes will make this possible (it works with polonius)\n  124 |         let or_insert = || {\n  125 |             // check the file cache\n  126 |             #[cfg(not(target_arch = \"wasm32\"))]\n  127 |             return match file_system_cache.get(route) {\n  128 |                 Ok(Some((freshness, bytes))) => Ok((freshness.timestamp(), bytes)),\n  129 |                 Ok(None) => Err(FsGetError::NotPresent),\n  130 |                 Err(e) => Err(FsGetError::Error(e)),\n  131 |             };\n  132 | \n  133 |             #[allow(unreachable_code)]\n  134 |             Err(FsGetError::NotPresent)\n  135 |         };\n  136 | \n  137 |         match memory_cache.try_get_or_insert(route, or_insert) {\n  138 |             Ok(Some((freshness, bytes))) => Ok(Some(CachedRender {\n  139 |                 route: route.to_string(),\n  140 |                 freshness,\n  141 |                 response: bytes,\n  142 |             })),\n  143 |             Err(FsGetError::NotPresent) | Ok(None) => Ok(None),\n  144 |             Err(FsGetError::Error(e)) => Err(e),\n  145 |         }\n  146 |     }","lines":42,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/fullstack-server/src/isrg/mod.rs#L105-L146"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In `InMemoryCache::try_get_or_insert`, the age/elapsed computation has the subtraction order inverted, which breaks both the `Age` header value and the `invalidate_after` expiry check for the in-memory ISR cache.\n\n`elapsed` is computed as `timestamp.signed_duration_since(now)`, i.e. `timestamp - now`. Since `timestamp` is always the time the entry was *created* (set via `Utc::now()` at write time in `IncrementalRenderer::cache`), by the time `get()` runs later, `timestamp` is always in the past, so `elapsed` is always negative (or zero).\n\nTwo bugs follow from this:\n1. `elapsed.to_std()` (`chrono::TimeDelta::to_std`) returns `Err` for negative durations. Since `elapsed` is essentially always negative for real cache lookups, `if let Ok(std_elapsed) = elapsed.to_std()` is essentially always false, so the `invalidate_after` expiry branch (lines 57-66) never actually fires for normal entries - the memory cache never expires content by age, only by LRU eviction, regardless of the configured `invalidate_after`. The comment on line 58 (\"If we can't convert to a std duration, the duration is negative and hasn't elapsed yet\") states the opposite of reality: a negative `elapsed` here means the timestamp *is* in the past (has elapsed), not that it hasn't.\n2. `age` (`elapsed.num_seconds()`) is negative for real entries, and it is cast directly with `age as u64` at lines 76 and 81. Casting a negative `i64` to `u64` wraps around to a huge number near `u64::MAX`, so the `Age` HTTP header written via `RenderFreshness::write` will contain a nonsensical huge value instead of the number of seconds since the entry was cached.\n\nContrast this with `fs_cache.rs`'s `ValidCachedPath::freshness` (`self.timestamp.elapsed()`, i.e. `now - self`, always positive) and `freshness.rs`'s `RenderFreshness::created_at` (which correctly uses `.unsigned_abs()` to normalize the sign) - both compute the age correctly. `memory_cache.rs` is the only one of the three that gets it wrong.","fix":"Compute elapsed the other way around, e.g.:\n```rust\nlet now = Utc::now();\nlet elapsed = now.signed_duration_since(timestamp);\nlet age = elapsed.num_seconds().max(0) as u64;\n```\nAnd use `elapsed.to_std()` on the now-positive duration (or just compare `elapsed.num_seconds()` against `invalidate_after.as_secs() as i64` directly) so the `invalidate_after` branch actually triggers for aged-out entries. This also fixes the `Age` header wraparound since `age` is guaranteed non-negative before the `as u64` cast.","locations":[{"ref":"packages/fullstack-server/src/isrg/memory_cache.rs:53-66","code":"   53 |             let now = Utc::now();\n   54 |             let elapsed = timestamp.signed_duration_since(now);\n   55 |             let age = elapsed.num_seconds();\n   56 |             // The cache entry is out of date, so we need to remove it.\n   57 |             if let Some(invalidate_after) = self.invalidate_after {\n   58 |                 // If we can't convert to a std duration, the duration is negative and hasn't elapsed yet.\n   59 |                 if let Ok(std_elapsed) = elapsed.to_std()\n   60 |                     && std_elapsed > invalidate_after\n   61 |                 {\n   62 |                     tracing::trace!(\"memory cache out of date\");\n   63 |                     memory_cache.pop(route);\n   64 |                     return Ok(None);\n   65 |                 }\n   66 |             }","lines":14,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/fullstack-server/src/isrg/memory_cache.rs#L53-L66"},{"ref":"packages/fullstack-server/src/isrg/memory_cache.rs:70-84","code":"   70 |             let (timestamp, cache_hit) = memory_cache.get(route).unwrap();\n   71 | \n   72 |             return match self.invalidate_after {\n   73 |                 Some(invalidate_after) => {\n   74 |                     tracing::trace!(\"memory cache hit\");\n   75 |                     let max_age = invalidate_after.as_secs();\n   76 |                     let freshness = RenderFreshness::new(age as u64, max_age, *timestamp);\n   77 |                     Ok(Some((freshness, cache_hit)))\n   78 |                 }\n   79 |                 None => {\n   80 |                     tracing::trace!(\"memory cache hit\");\n   81 |                     let freshness = RenderFreshness::new_age(age as u64, *timestamp);\n   82 |                     Ok(Some((freshness, cache_hit)))\n   83 |                 }\n   84 |             };","lines":15,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/fullstack-server/src/isrg/memory_cache.rs#L70-L84"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`copy_external_binaries` resolves each configured `external_bin` entry as `PathBuf::from(format!(\"{bin}-{target}\"))` and only checks `src.exists()` relative to the process's current working directory - it never joins the path against `self.build.crate_dir()`. Likewise, in `BundleContext::new`, custom `bundle.resources` entries are inserted into `resources_map` as the raw config string (`resources_map.insert(resource_path.clone(), String::new())`), and later consumed by `copy_resources` via `PathBuf::from(src)` with no `crate_dir()` join either. Every other config-relative path in this same file (`icon_files`, `add_linux_deb_data`'s `deb_settings.files`, `resolve_path`) is explicitly resolved against `crate_dir()`. The CLI never calls `std::env::set_current_dir`, so when `dx bundle` is run from a workspace root (a very common layout for multi-crate Cargo workspaces) rather than from inside the target crate's directory, these two relative-path lookups silently miss (the `if src.exists()` / `if !src_path.exists() { warn!(...); continue; }` guards just skip them), producing a bundle silently missing its configured external binaries and/or extra resources.","fix":"Resolve relative paths against `self.crate_dir()` (mirroring `icon_files()`), e.g. in `copy_external_binaries`:\n```rust\nlet src = self.crate_dir().join(format!(\"{bin}-{target}\"));\n```\nand in the `bundle.resources` merge step in `new()`:\n```rust\nfor resource_path in resources {\n    let abs = if Path::new(resource_path).is_absolute() {\n        PathBuf::from(resource_path)\n    } else {\n        build.crate_dir().join(resource_path)\n    };\n    resources_map.insert(abs.display().to_string(), String::new());\n}\n```","locations":[{"ref":"packages/cli/src/bundler/mod.rs:65-70","code":"   65 |         // Merge in any custom resources from config\n   66 |         if let Some(resources) = &build.config.bundle.resources {\n   67 |             for resource_path in resources {\n   68 |                 resources_map.insert(resource_path.clone(), String::new());\n   69 |             }\n   70 |         }","lines":6,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/bundler/mod.rs#L65-L70"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `TraceController::enroll_reporter`, the session-refresh check calls `reporter.last_used.duration_since(SystemTime::now())` instead of `SystemTime::now().duration_since(reporter.last_used)`. `SystemTime::duration_since` computes `self - earlier` and returns an `Err` when `self` is earlier than the argument. Since `last_used` is essentially always in the past relative to `now()`, this call almost always returns `Err`, and `.unwrap_or(true)` then treats every invocation as \"older than 30 minutes\", forcing `session_id` to be regenerated on every single CLI run. This defeats the entire purpose of the 30-minute session-continuity window used for telemetry grouping.","fix":"Swap the operands so the duration is computed the correct direction:\n```rust\nif SystemTime::now()\n    .duration_since(reporter.last_used)\n    .map(|d| d.as_secs() > (30 * 60))\n    .unwrap_or(true)\n{\n    ...\n}\n```","locations":[{"ref":"packages/cli/src/logging.rs:616-628","code":"  616 |         // Update the last used time to now, updating the session ID if it's older than 30 minutes.\n  617 |         if reporter\n  618 |             .last_used\n  619 |             .duration_since(SystemTime::now())\n  620 |             .map(|d| d.as_secs() > (30 * 60))\n  621 |             .unwrap_or(true)\n  622 |         {\n  623 |             reporter.created_at = SystemTime::now();\n  624 |             reporter.session_id = Uuid::new_v7(uuid::Timestamp::now(\n  625 |                 uuid::timestamp::context::ContextV7::new(),\n  626 |             ));\n  627 |         }\n  628 |         reporter.last_used = SystemTime::now();","lines":13,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/logging.rs#L616-L628"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `Output::push_ws_message`, `ClientMsg::Log { messages, .. }` can carry multiple log messages, but only `messages.first()` is used and the rest are silently discarded (the author even left a `// FIXME(jon): why are we pulling only the first message here?` marker). Any client-side log call that batches multiple lines into one `ClientMsg::Log` will have all but the first line dropped from the dev-server TUI/log output.","fix":"Iterate over all messages instead of only the first one:\n```rust\nfor content in messages {\n    self.push_log(TraceMsg::text(TraceSrc::App(bundle), level, content));\n}\n```","locations":[{"ref":"packages/cli/src/serve/output.rs:400-417","code":"  400 |         let ClientMsg::Log { level, messages } = msg else {\n  401 |             return;\n  402 |         };\n  403 | \n  404 |         // FIXME(jon): why are we pulling only the first message here?\n  405 |         let content = messages.first().unwrap_or(&String::new()).clone();\n  406 | \n  407 |         let level = match level.as_str() {\n  408 |             \"trace\" => Level::TRACE,\n  409 |             \"debug\" => Level::DEBUG,\n  410 |             \"info\" => Level::INFO,\n  411 |             \"warn\" => Level::WARN,\n  412 |             \"error\" => Level::ERROR,\n  413 |             _ => Level::INFO,\n  414 |         };\n  415 | \n  416 |         // We don't care about logging the app's message so we directly push it instead of using tracing.\n  417 |         self.push_log(TraceMsg::text(TraceSrc::App(bundle), level, content));","lines":18,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/serve/output.rs#L400-L417"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`App::disable_dma_buf` is documented as disabling DMA-BUF rendering \"on Linux Wayland sessions\" and only performs the `/dev/dri` + `XDG_SESSION_TYPE == \"wayland\"` detection to decide whether to set `WEBKIT_DISABLE_DMABUF_RENDERER`. However the following `std::env::set_var(\"GDK_BACKEND\", \"x11\")` call sits *outside* that Wayland check and runs unconditionally whenever `cfg!(target_os = \"linux\")` and `self.disable_dma_buf_on_wayland` (which defaults to `true`) are true - i.e. on every Linux session, Wayland or not. So by default every Dioxus desktop app on Linux forces GTK into the X11/XWayland backend even on machines that aren't running Wayland at all (harmless there) and, more importantly, even on Wayland sessions where the `/dev/dri` + session-type probe fails to detect Wayland for some reason it still forces XWayland - the two checks are inconsistent with each other and with the function's stated purpose.","fix":"Gate the `GDK_BACKEND` override behind the same Wayland detection used for the DMA-BUF env var so the two stay consistent:\n\n```rust\nfn disable_dma_buf(&self) {\n    if cfg!(target_os = \"linux\") && self.disable_dma_buf_on_wayland {\n        static INIT: std::sync::Once = std::sync::Once::new();\n        INIT.call_once(|| {\n            let is_wayland = std::path::Path::new(\"/dev/dri\").exists()\n                && std::env::var(\"XDG_SESSION_TYPE\").unwrap_or_default() == \"wayland\";\n            if is_wayland {\n                unsafe {\n                    std::env::set_var(\"WEBKIT_DISABLE_DMABUF_RENDERER\", \"1\");\n                    std::env::set_var(\"GDK_BACKEND\", \"x11\");\n                }\n            }\n        });\n    }\n}\n```","locations":[{"ref":"packages/desktop/src/app.rs:644-664","code":"  644 |     /// Disable DMA buffer rendering on Linux Wayland sessions to avoid bugs with WebKitGTK\n  645 |     fn disable_dma_buf(&self) {\n  646 |         if cfg!(target_os = \"linux\") && self.disable_dma_buf_on_wayland {\n  647 |             static INIT: std::sync::Once = std::sync::Once::new();\n  648 |             INIT.call_once(|| {\n  649 |                 if std::path::Path::new(\"/dev/dri\").exists()\n  650 |                     && std::env::var(\"XDG_SESSION_TYPE\").unwrap_or_default() == \"wayland\"\n  651 |                 {\n  652 |                     // Gnome Webkit is currently buggy under Wayland and KDE, so we will run it with XWayland mode.\n  653 |                     // See: https://github.com/DioxusLabs/dioxus/issues/3667\n  654 |                     unsafe {\n  655 |                         // Disable explicit sync for NVIDIA drivers on Linux when using Way\n  656 |                         std::env::set_var(\"WEBKIT_DISABLE_DMABUF_RENDERER\", \"1\");\n  657 |                     }\n  658 |                 }\n  659 |                 unsafe {\n  660 |                     std::env::set_var(\"GDK_BACKEND\", \"x11\");\n  661 |                 }\n  662 |             });\n  663 |         }\n  664 |     }","lines":21,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/desktop/src/app.rs#L644-L664"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"hard","description":"`HTMLData::create_entry` hands out ids from `self.cursor` (starting at 1) and increments it, but `HTMLData::extend` (used by `HydrationContext::extend`) appends another context's entire `data`/`debug_types`/`debug_locations` vectors without ever advancing `self.cursor`. If `create_entry`/`create_entry_with_id` is called on the same `HydrationContext` again after an `extend`, the returned id can collide with an index that was just populated by the merged-in data, and the later `insert` on that id will silently overwrite the previously extended entry (data corruption between two independently-serialized suspense subtrees). The only current caller (`extract_from_suspense_boundary` in `fullstack-server/src/ssr.rs`) happens to never create further entries on the aggregating context after calling `extend`, so the bug is currently dormant, but nothing in the API prevents it, and `extend`/`create_entry` are both public/`pub(crate)` entry points that can be composed this way in the future.","fix":"Advance `self.cursor` in `extend` to account for the entries just appended (e.g. `self.cursor = self.cursor.max(self.data.len())` after the merge), so any subsequent `create_entry` call on the same context can't collide with previously-extended indices.","locations":[{"ref":"packages/fullstack-core/src/transport.rs:239-243","code":"  239 |     fn create_entry(&mut self) -> usize {\n  240 |         let id = self.cursor;\n  241 |         self.cursor += 1;\n  242 |         self.create_entry_with_id(id)\n  243 |     }","lines":5,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/fullstack-core/src/transport.rs#L239-L243"},{"ref":"packages/fullstack-core/src/transport.rs:315-349","code":"  315 |     pub(crate) fn extend(&mut self, other: &Self) {\n  316 |         // Make sure this vectors error entry exists even if it is empty\n  317 |         if self.data.is_empty() {\n  318 |             self.data.push(None);\n  319 |             #[cfg(debug_assertions)]\n  320 |             {\n  321 |                 self.debug_types.push(None);\n  322 |                 self.debug_locations.push(None);\n  323 |             }\n  324 |         }\n  325 | \n  326 |         let mut other_data_iter = other.data.iter().cloned();\n  327 |         #[cfg(debug_assertions)]\n  328 |         let mut other_debug_types_iter = other.debug_types.iter().cloned();\n  329 |         #[cfg(debug_assertions)]\n  330 |         let mut other_debug_locations_iter = other.debug_locations.iter().cloned();\n  331 | \n  332 |         // Merge the error entry from the other context\n  333 |         if let Some(Some(other_error)) = other_data_iter.next() {\n  334 |             self.data[0] = Some(other_error.clone());\n  335 |             #[cfg(debug_assertions)]\n  336 |             {\n  337 |                 self.debug_types[0] = other_debug_types_iter.next().unwrap_or(None);\n  338 |                 self.debug_locations[0] = other_debug_locations_iter.next().unwrap_or(None);\n  339 |             }\n  340 |         }\n  341 | \n  342 |         // Don't copy the error from the other context\n  343 |         self.data.extend(other_data_iter);\n  344 |         #[cfg(debug_assertions)]\n  345 |         {\n  346 |             self.debug_types.extend(other_debug_types_iter);\n  347 |             self.debug_locations.extend(other_debug_locations_iter);\n  348 |         }\n  349 |     }","lines":35,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/fullstack-core/src/transport.rs#L315-L349"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `check_connectivity` (`packages/cli/src/cli/create.rs`), the retry loop's fallback timeout uses `if x == 1 { 500 } else { 2000 }` milliseconds (line 267). This gives the *second* connectivity attempt (`x == 1`) a short 500ms timeout while the *first* attempt (`x == 0`) and every attempt after get the longer 2000ms timeout. Given the accompanying messages (`x == 0` prints an initial 'Waiting for...' notice, and this is normally where you'd want the fastest first probe), the special-cased branch looks like an off-by-one: `x == 0` was likely intended to get the short timeout.","fix":"Change the condition to `if x == 0 { 500 } else { 2000 }` (or otherwise clarify the intended backoff schedule) so the first probe uses the shorter timeout as apparently intended.","locations":[{"ref":"packages/cli/src/cli/create.rs:259-278","code":"  259 |     for x in 0..=5 {\n  260 |         tokio::select! {\n  261 |             res = client.head(\"https://github.com/DioxusLabs/\").header(\"User-Agent\", \"dioxus-cli\").send() => {\n  262 |                 if res.is_ok() {\n  263 |                     return Ok(());\n  264 |                 }\n  265 |                 tokio::time::sleep(std::time::Duration::from_millis(2000)).await;\n  266 |             },\n  267 |             _ = tokio::time::sleep(std::time::Duration::from_millis(if x == 1 { 500 } else { 2000 })) => {}\n  268 |         }\n  269 |         if x == 0 {\n  270 |             eprintln!(\n  271 |                 \"{GLOW_STYLE}warning{GLOW_STYLE:#}: Waiting for {LINK_STYLE}https://github.com/dioxuslabs{LINK_STYLE:#}...\"\n  272 |             )\n  273 |         } else {\n  274 |             eprintln!(\n  275 |                 \"{GLOW_STYLE}warning{GLOW_STYLE:#}: ({x}/5) Taking a while, maybe your internet is down?\"\n  276 |             );\n  277 |         }\n  278 |     }","lines":20,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/cli/create.rs#L259-L278"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`compressed_path` in `fastfs.rs` checks whether a file is already a brotli-compressed artifact using `ext.to_string_lossy().to_lowercase().ends_with(\"br\")`. This matches any extension ending in the letters `br`, not just an exact `.br` extension - e.g. a file named `photo.abr` (a Photoshop brush file) or `page.docbr` would be incorrectly treated as already-compressed and skipped by `pre_compress_folder`/`pre_compress_file`, or have its (nonexistent) `.br.br` compressed sibling silently removed during the 'not pre_compress' branch of `pre_compress_folder`.","fix":"Use an exact comparison instead of `ends_with`:\n```rust\n// before\nif ext.to_string_lossy().to_lowercase().ends_with(\"br\") {\n    return None;\n}\n// after\nif ext.eq_ignore_ascii_case(\"br\") {\n    return None;\n}\n```","locations":[{"ref":"packages/cli/src/fastfs.rs:15-29","code":"   15 | fn compressed_path(path: &Path) -> Option<PathBuf> {\n   16 |     let new_extension = match path.extension() {\n   17 |         Some(ext) => {\n   18 |             if ext.to_string_lossy().to_lowercase().ends_with(\"br\") {\n   19 |                 return None;\n   20 |             }\n   21 |             let mut ext = ext.to_os_string();\n   22 |             ext.push(\".br\");\n   23 |             ext\n   24 |         }\n   25 |         None => OsString::from(\"br\"),\n   26 |     };\n   27 | \n   28 |     Some(path.with_extension(new_extension))\n   29 | }","lines":15,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/fastfs.rs#L15-L29"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"On iOS/Android, `mobile_shortcut.rs`'s stub `HotKey::id()` always returns `0` for every `HotKey` instance, regardless of the key/modifiers used to construct it. `ShortcutRegistry::add_shortcut` (`packages/desktop/src/shortcut.rs:76-112`) keys its `shortcuts: RefCell<HashMap<u32, ShortcutInner>>` by this `id()`, so on mobile every distinct shortcut registered through the public `DesktopService::create_shortcut`/`use_global_shortcut` API collapses into the single hash bucket `0`. Callbacks for entirely different key combinations end up sharing one `ShortcutInner.shortcut: HotKey`, so `remove_shortcut` for one accelerator can end up unregistering the underlying stub `HotKey` shared by unrelated shortcuts once its `Slab` empties. This currently has no visible effect (mobile never wires up an event source to call `ShortcutRegistry::call_handlers`), but it silently defeats the registry's per-accelerator bookkeeping the moment mobile shortcut delivery is implemented.","fix":"Give the mobile stub `HotKey` a real, unique id (e.g. hash the `Modifiers`/`Code` pair passed to `HotKey::new`) so the registry's `HashMap` key space matches accelerator identity even before mobile event delivery is implemented:\n\n```rust\nimpl HotKey {\n    pub fn new(mods: Option<Modifiers>, key: Code) -> Self {\n        // store mods/key and derive id() from them instead of hardcoding 0\n        Self { mods, key }\n    }\n}\n```","locations":[{"ref":"packages/desktop/src/mobile_shortcut.rs:15-23","code":"   15 | impl HotKey {\n   16 |     pub fn new(mods: Option<Modifiers>, key: Code) -> Self {\n   17 |         Self\n   18 |     }\n   19 | \n   20 |     pub fn id(&self) -> u32 {\n   21 |         0\n   22 |     }\n   23 | }","lines":9,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/desktop/src/mobile_shortcut.rs#L15-L23"},{"ref":"packages/desktop/src/shortcut.rs:76-112","code":"   76 |     pub(crate) fn add_shortcut(\n   77 |         &self,\n   78 |         hotkey: HotKey,\n   79 |         callback: Box<dyn FnMut(HotKeyState)>,\n   80 |     ) -> Result<ShortcutHandle, ShortcutRegistryError> {\n   81 |         let accelerator_id = hotkey.clone().id();\n   82 | \n   83 |         let mut shortcuts = self.shortcuts.borrow_mut();\n   84 | \n   85 |         if let Some(callbacks) = shortcuts.get_mut(&accelerator_id) {\n   86 |             return Ok(ShortcutHandle {\n   87 |                 id: accelerator_id,\n   88 |                 number: callbacks.callbacks.insert(callback),\n   89 |             });\n   90 |         };\n   91 | \n   92 |         self.manager.register(hotkey).map_err(|e| match e {\n   93 |             HotkeyError::HotKeyParseError(shortcut) => {\n   94 |                 ShortcutRegistryError::InvalidShortcut(shortcut)\n   95 |             }\n   96 |             err => ShortcutRegistryError::Other(Rc::new(err)),\n   97 |         })?;\n   98 | \n   99 |         let mut shortcut = ShortcutInner {\n  100 |             shortcut: hotkey,\n  101 |             callbacks: Slab::new(),\n  102 |         };\n  103 | \n  104 |         let id = shortcut.callbacks.insert(callback);\n  105 | \n  106 |         shortcuts.insert(accelerator_id, shortcut);\n  107 | \n  108 |         Ok(ShortcutHandle {\n  109 |             id: accelerator_id,\n  110 |             number: id,\n  111 |         })\n  112 |     }","lines":37,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/desktop/src/shortcut.rs#L76-L112"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In `TailwindCli::run_once`, the code checks `if !output.stderr.is_empty()` but then logs `output.stdout` in the warning message instead of `output.stderr`. Any real tailwind warnings/errors printed to stderr are never shown to the user, while unrelated stdout content (which may be empty) is logged as if it were the warning.","fix":"```rust\nif !output.stderr.is_empty() {\n    tracing::warn!(\n        \"Warnings while running tailwind: {}\",\n        String::from_utf8_lossy(&output.stderr)\n    );\n}\n```","locations":[{"ref":"packages/cli/src/tailwind.rs:41-46","code":"   41 |         if !output.stderr.is_empty() {\n   42 |             tracing::warn!(\n   43 |                 \"Warnings while running tailwind: {}\",\n   44 |                 String::from_utf8_lossy(&output.stdout)\n   45 |             );\n   46 |         }","lines":6,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/tailwind.rs#L41-L46"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"medium","description":"`packages/desktop/src/default_icon.rs` implements `DioxusIconTrait` three times (for `DioxusTrayIcon`, `DioxusMenuIcon`, and `Icon`) with nearly byte-for-byte identical `get_icon`, `from_memory`, and `path` bodies, differing only in the concrete type name. This is roughly 90 lines of duplicated logic across 3 impls (lines 43-79, 85-121, 128-164). Besides the maintenance cost, the duplication is exactly why the broken-resize bug (see the `logic_error` finding on this file) had to be fixed in three places instead of one.","fix":"Extract a single generic helper, e.g. `fn build_icon<F>(from_rgba: F, size: Option<(u32,u32)>, path/bytes) -> Result<...>` or a macro that takes the type name, and have the three `impl DioxusIconTrait for ...` blocks delegate to it instead of re-implementing the same logic three times.","locations":[{"ref":"packages/desktop/src/default_icon.rs:43-79","code":"   43 | impl DioxusIconTrait for DioxusTrayIcon {\n   44 |     fn get_icon() -> Result<Self>\n   45 |     where\n   46 |         Self: Sized,\n   47 |     {\n   48 |         #[cfg(target_os = \"windows\")]\n   49 |         if let Ok(icon) = DioxusTrayIcon::from_resource(32512, None) {\n   50 |             return Ok(icon);\n   51 |         }\n   52 |         DioxusTrayIcon::from_rgba(\n   53 |             FALLBACK_ICON_RGBA.to_vec(),\n   54 |             FALLBACK_ICON_WIDTH,\n   55 |             FALLBACK_ICON_HEIGHT,\n   56 |         )\n   57 |         .map_err(Into::into)\n   58 |     }\n   59 | \n   60 |     fn from_memory(value: &[u8]) -> Result<Self>\n   61 |     where\n   62 |         Self: Sized,\n   63 |     {\n   64 |         let (icon, width, height) = load_image_from_memory(value)?;\n   65 |         DioxusTrayIcon::from_rgba(icon, width, height).map_err(Into::into)\n   66 |     }\n   67 | \n   68 |     fn path<P: AsRef<Path>>(path: P, size: Option<(u32, u32)>) -> Re
