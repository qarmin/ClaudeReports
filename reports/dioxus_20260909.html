<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}

.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}

.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}

.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}

.search-wrap{display:flex;align-items:center;gap:.35rem}

.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}

.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}

.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}

.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}

.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}

.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}

.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"In `resolve_asset_path_from_filesystem`, the incoming asset `path` (which on native platforms comes from a webview custom-protocol request, i.e. untrusted/attacker-influenceable input) is percent-decoded and then `.expect(\"expected URL to be UTF-8 encoded\")`-ed. Any request whose percent-encoding decodes to invalid UTF-8 (e.g. a raw `%ff` byte with no valid continuation) will panic instead of returning `AssetPathError::NotFound` / a 404. Since this runs on the asset-serving path of every native Dioxus desktop/mobile app, a single malformed request (crafted link, redirect, or buggy embedded content) can crash the whole application process.","fix":"Replace the `.expect(...)` with graceful fallback handling, e.g.:\n```rust\nlet mut uri_path = PathBuf::from(\n    percent_encoding::percent_decode_str(path)\n        .decode_utf8()\n        .unwrap_or(std::borrow::Cow::Borrowed(path))\n        .as_ref(),\n);\n```\nor propagate a `None`/`AssetPathError::NotFound` from `resolve_asset_path_from_filesystem` when decoding fails, instead of panicking.","locations":[{"ref":"packages/asset-resolver/src/native.rs:43-48","code":"   43 |     let mut uri_path = PathBuf::from(\n   44 |         percent_encoding::percent_decode_str(path)\n   45 |             .decode_utf8()\n   46 |             .expect(\"expected URL to be UTF-8 encoded\")\n   47 |             .as_ref(),\n   48 |     );","lines":6,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/asset-resolver/src/native.rs#L43-L48"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`WebAssetResolveError::from_js_value` assumes any JS exception value can be downcast to `js_sys::Error` and calls `unreachable!(\"Expected a js_sys::Error, got: {:?}\", value)` on the else branch. In the browser, `fetch()` rejects with a `DOMException` (e.g. `AbortError` when the request is aborted, or `NetworkError`), and `DOMException` does NOT inherit from JS `Error`, so `value.dyn_ref::<js_sys::Error>()` returns `None` and this `unreachable!()` fires for real, common conditions like an aborted or cancelled fetch, crashing the wasm module.","fix":"Don't assume the rejection value is always a `js_sys::Error`; build a `WebAssetResolveError` from whatever was thrown instead of panicking, e.g. store the `JsValue`/its string representation directly rather than requiring a downcast to `js_sys::Error`:\n```rust\nfn from_js_value(value: JsValue) -> Self {\n    let error = value\n        .dyn_ref::<js_sys::Error>()\n        .cloned()\n        .unwrap_or_else(|| js_sys::Error::new(&format!(\"{value:?}\")));\n    WebAssetResolveError::from(error)\n}\n```","locations":[{"ref":"packages/asset-resolver/src/web.rs:16-24","code":"   16 | impl WebAssetResolveError {\n   17 |     fn from_js_value(value: JsValue) -> Self {\n   18 |         if let Some(error) = value.dyn_ref::<js_sys::Error>() {\n   19 |             WebAssetResolveError::from(error.clone())\n   20 |         } else {\n   21 |             unreachable!(\"Expected a js_sys::Error, got: {:?}\", value)\n   22 |         }\n   23 |     }\n   24 | }","lines":9,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/asset-resolver/src/web.rs#L16-L24"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`compress_png` (and its helper calls) returns `()` instead of `Result` and uses `.unwrap()`/`panic!()` throughout: `liq.set_speed(5).unwrap()`, `liq.set_quality(0, 99).unwrap()`, `liq.new_image(...).unwrap()`, `liq.quantize(&mut img)` explicitly `panic!`s on error, `res.remapped(&mut img).unwrap()`, `std::fs::File::create(output_location).unwrap()`, and several `writer.*().unwrap()` calls. Since this function processes arbitrary user-supplied PNG assets from `process_image`, any edge case (zero-dimension image after `resize_exact`, disk-full/permission error creating the output file, or a quantization failure on unusual color data) crashes the entire `dx build`/`dx serve` process with an unhandled panic instead of surfacing a clean, recoverable error for that one asset.","fix":"Change `compress_png` to return `anyhow::Result<()>` and propagate errors with `?`/`.context(...)` instead of `.unwrap()`/`panic!`, then update the call site in `process_image` to use `compress_png(...)?;` instead of a bare statement.","locations":[{"ref":"packages/cli/src/opt/image.rs:78-125","code":"   78 | pub(crate) fn compress_png(image: DynamicImage, output_location: &Path) {\n   79 |     // Image loading/saving is outside scope of this library\n   80 |     let width = image.width() as usize;\n   81 |     let height = image.height() as usize;\n   82 |     let bitmap: Vec<_> = image\n   83 |         .into_rgba8()\n   84 |         .pixels()\n   85 |         .map(|px| imagequant::RGBA::new(px[0], px[1], px[2], px[3]))\n   86 |         .collect();\n   87 | \n   88 |     // Configure the library\n   89 |     let mut liq = imagequant::new();\n   90 |     liq.set_speed(5).unwrap();\n   91 |     liq.set_quality(0, 99).unwrap();\n   92 | \n   93 |     // Describe the bitmap\n   94 |     let mut img = liq.new_image(&bitmap[..], width, height, 0.0).unwrap();\n   95 | \n   96 |     // The magic happens in quantize()\n   97 |     let mut res = match liq.quantize(&mut img) {\n   98 |         Ok(res) => res,\n   99 |         Err(err) => panic!(\"Quantization failed, because: {err:?}\"),\n  100 |     };\n  101 | \n  102 |     let (palette, pixels) = res.remapped(&mut img).unwrap();\n  103 | \n  104 |     let file = std::fs::File::create(output_location).unwrap();\n  105 |     let w = &mut BufWriter::new(file);\n  106 | \n  107 |     let mut encoder = png::Encoder::new(w, width as u32, height as u32);\n  108 |     encoder.set_color(png::ColorType::Rgba);\n  109 |     let mut flattened_palette = Vec::new();\n  110 |     let mut alpha_palette = Vec::new();\n  111 |     for px in palette {\n  112 |         flattened_palette.push(px.r);\n  113 |         flattened_palette.push(px.g);\n  114 |         flattened_palette.push(px.b);\n  115 |         alpha_palette.push(px.a);\n  116 |     }\n  117 |     encoder.set_palette(flattened_palette);\n  118 |     encoder.set_trns(alpha_palette);\n  119 |     encoder.set_depth(png::BitDepth::Eight);\n  120 |     encoder.set_color(png::ColorType::Indexed);\n  121 |     encoder.set_compression(png::Compression::Best);\n  122 |     let mut writer = encoder.write_header().unwrap();\n  123 |     writer.write_image_data(&pixels).unwrap();\n  124 |     writer.finish().unwrap();\n  125 | }","lines":48,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/opt/image.rs#L78-L125"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`Workspace::find_main_package` resolves `[workspace] default-members` entries with `std::fs::canonicalize(default).unwrap()` where `default` is the raw (workspace-root-relative) string from `Cargo.toml`. It is never joined with `self.workspace_root()` first, so `canonicalize` resolves it relative to the process's current working directory instead. When `dx` is invoked from a subdirectory of the workspace (a very common workflow - running `dx serve`/`dx build` from inside a member crate) and a `default-members` path doesn't happen to also exist relative to that subdirectory, this call fails and `.unwrap()` panics the whole CLI instead of finding the right default package (or it can silently resolve to the wrong directory if a coincidentally-matching path exists under the CWD).","fix":"Join the default-member path with the workspace root before canonicalizing, and propagate errors instead of unwrapping:\n```rust\nlet default_member_path = self.workspace_root().join(default);\nlet default_member_path = std::fs::canonicalize(&default_member_path)\n    .with_context(|| format!(\"Failed to resolve workspace default-member {default}\"))?;\n```","locations":[{"ref":"packages/cli/src/workspace.rs:344-373","code":"  344 |         // if we have default members specified, try them first\n  345 |         if let Some(ws) = &self.cargo_toml.workspace {\n  346 |             for default in &ws.default_members {\n  347 |                 let mut workspace_members = self.krates.workspace_members();\n  348 |                 let default_member_path = std::fs::canonicalize(default).unwrap();\n  349 | \n  350 |                 let found = workspace_members.find_map(|node| {\n  351 |                     if let krates::Node::Krate { id, krate, .. } = node {\n  352 |                         // Skip this default member if it doesn't have any binary targets\n  353 |                         if !krate\n  354 |                             .targets\n  355 |                             .iter()\n  356 |                             .any(|t| t.kind.contains(&krates::cm::TargetKind::Bin))\n  357 |                         {\n  358 |                             return None;\n  359 |                         }\n  360 |                         let member_path =\n  361 |                             std::fs::canonicalize(krate.manifest_path.parent().unwrap()).unwrap();\n  362 |                         if member_path == default_member_path {\n  363 |                             return Some(id);\n  364 |                         }\n  365 |                     }\n  366 |                     None\n  367 |                 });\n  368 | \n  369 |                 if let Some(kid) = found {\n  370 |                     return Ok(self.krates.nid_for_kid(kid).unwrap());\n  371 |                 }\n  372 |             }\n  373 |         }","lines":30,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/workspace.rs#L344-L373"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`Effect::run` in `effect.rs` takes a `RefCell::borrow_mut()` on `self.effect` and holds that guard (`effect`) for the entire duration of the loop, including while invoking each user callback `f()`. `Effect::push_back` also needs `self.effect.borrow_mut()`. If any callback executed inside `run` (directly or transitively, e.g. a `use_effect` closure that calls `queue_effect` again for the same scope/order) causes `push_back` to be called on the same `Effect` instance before `run` returns, the second `borrow_mut()` will hit the already-held borrow and panic with `already borrowed: BorrowMutError`. This turns a plausible reentrant effect-scheduling pattern into a hard crash instead of just queuing the new callback for a later pass.","fix":"Release the borrow before invoking the callback so `push_back` can safely re-enter while an effect is running:\n```rust\npub(crate) fn run(&self) {\n    loop {\n        let f = self.effect.borrow_mut().pop_front();\n        match f {\n            Some(f) => f(),\n            None => break,\n        }\n    }\n}\n```\nThis borrows `effect` only long enough to pop the next closure, then drops the guard before calling `f()`, so a reentrant `push_back` from within `f()` no longer panics.","locations":[{"ref":"packages/core/src/effect.rs:27-36","code":"   27 |     pub(crate) fn push_back(&self, f: impl FnOnce() + 'static) {\n   28 |         self.effect.borrow_mut().push_back(Box::new(f));\n   29 |     }\n   30 | \n   31 |     pub(crate) fn run(&self) {\n   32 |         let mut effect = self.effect.borrow_mut();\n   33 |         while let Some(f) = effect.pop_front() {\n   34 |             f();\n   35 |         }\n   36 |     }","lines":10,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/core/src/effect.rs#L27-L36"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"In `EditWebsocket::handle_connection`, right after the WebSocket handshake completes, the code does `websocket.send(tungstenite::Message::Text(hex_encoded_server_key.into())).unwrap()`. This call runs directly on the background thread that owns `accept_loop`'s `while let Ok((stream, _)) = server.accept()` loop (the per-connection processing is only spawned onto its own thread *after* this line, at `packages/desktop/src/edits.rs:305`). If the client disconnects (or resets the TCP connection) between completing the handshake and this send - which is a completely normal, attacker/flaky-network-triggerable event, not exotic - `send` returns `Err` and `.unwrap()` panics. Because this runs on the sole accept-loop thread (spawned once in `EditWebsocket::start`, with no `catch_unwind`), the panic kills that thread permanently: the `TcpListener` stops being polled and the app can never accept another edits WebSocket connection again (e.g. the iOS reconnect-after-sleep path described in the module doc comment would then hang forever, or a newly created window's webview could never receive UI edits).","fix":"Replace the `.unwrap()` with graceful error handling so a single bad connection cannot kill the accept loop:\n\n```rust\nif let Err(e) = websocket.send(tungstenite::Message::Text(hex_encoded_server_key.into())) {\n    tracing::error!(\"Error sending server key to websocket client: {}\", e);\n    return;\n}\n```\n\nConsider also wrapping the whole `accept_loop` body in `std::panic::catch_unwind` as defense in depth, since any future panic here has the same fatal, permanent effect on all windows.","locations":[{"ref":"packages/desktop/src/edits.rs:280-348","code":"  280 |     fn handle_connection(\n  281 |         stream: TcpStream,\n  282 |         server_location: Arc<Mutex<ServerLocation>>,\n  283 |         connections: Arc<RwLock<HashMap<u32, WebviewConnectionState>>>,\n  284 |     ) {\n  285 |         use tungstenite::handshake::server::{Request, Response};\n  286 | \n  287 |         let current_server_location = { *server_location.lock().unwrap() };\n  288 |         let hex_encoded_client_key = encode_key_string(&current_server_location.client_key);\n  289 |         let hex_encoded_server_key = encode_key_string(&current_server_location.server_key);\n  290 |         let mut location = None;\n  291 | \n  292 |         #[allow(clippy::result_large_err)]\n  293 |         let on_request = |req: &Request, res| {\n  294 |             // Try to parse the webview id and key from the path\n  295 |             let path = req.uri().path();\n  296 | \n  297 |             // The path should have two parts `/webview_id/key`\n  298 |             let mut segments = path.trim_matches('/').split('/');\n  299 |             let webview_id = segments\n  300 |                 .next()\n  301 |                 .and_then(|s| s.parse::<u32>().ok())\n  302 |                 .ok_or_else(|| {\n  303 |                     Response::builder()\n  304 |                         .status(400)\n  305 |                         .body(Some(\"Bad Request: Invalid webview ID\".to_string()))\n  306 |                         .unwrap()\n  307 |                 })?;\n  308 |             let key = segments.next().ok_or_else(|| {\n  309 |                 Response::builder()\n  310 |                     .status(400)\n  311 |                     .body(Some(\"Bad Request: Missing key\".to_string()))\n  312 |                     .unwrap()\n  313 |             })?;\n  314 | \n  315 |             // Make sure the key matches the expected key.\n  316 |             // VERY IMPORTANT: We cannot use normal string comparison here because it reveals information\n  317 |             // about the key based on timing information. Instead we use a constant time comparison method.\n  318 |             let key_matches: bool =\n  319 |                 subtle::ConstantTimeEq::ct_eq(hex_encoded_client_key.as_ref(), key.as_bytes())\n  320 |                     .into();\n  321 |             if !key_matches {\n  322 |                 return Err(Response::builder()\n  323 |                     .status(403)\n  324 |                     .body(Some(\"Forbidden: Invalid key\".to_string()))\n  325 |                     .unwrap());\n  326 |             }\n  327 | \n  328 |             location = Some(WebviewWebsocketLocation {\n  329 |                 webview_id,\n  330 |                 server: server_location,\n  331 |             });\n  332 | \n  333 |             Ok(res)\n  334 |         };\n  335 | \n  336 |         // Accept the websocket connection while reading the path and setting the location\n  337 |         let mut websocket = match tungstenite::accept_hdr(stream, on_request) {\n  338 |             Ok(ws) => ws,\n  339 |             Err(e) => {\n  340 |                 tracing::error!(\"Error accepting websocket connection: {}\", e);\n  341 |                 return;\n  342 |             }\n  343 |         };\n  344 | \n  345 |         // Immediately send the key to authenticate the server\n  346 |         websocket\n  347 |             .send(tungstenite::Message::Text(hex_encoded_server_key.into()))\n  348 |             .unwrap();","lines":69,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/desktop/src/edits.rs#L280-L348"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`HTMLData::from_serialized` calls `ciborium::from_reader(Cursor::new(data)).unwrap()` to decode the hydration payload embedded in the server-rendered HTML. This payload is external input from the client's point of view (it round-trips through the DOM/network and can be truncated, corrupted, or mismatched between a stale client bundle and a newer server, or vice versa). Any decode failure panics on the client during hydration setup instead of returning an error, which aborts the entire app boot instead of falling back to a client-side re-render.","fix":"Propagate the decode failure instead of unwrapping:\n\n```rust\nfn from_serialized(\n    data: &[u8],\n    debug_types: Option<Vec<String>>,\n    debug_locations: Option<Vec<String>>,\n) -> Self {\n    let data = ciborium::from_reader(Cursor::new(data)).unwrap_or_default();\n    ...\n```\n\nor change the signature to return a `Result` and have the two callers in `packages/web/src/lib.rs` and `packages/web/src/hydration/hydrate.rs` fall back to a clean client-side render (skip hydration data) when decoding fails, logging a `tracing::error!` instead of crashing the whole app.","locations":[{"ref":"packages/fullstack-core/src/transport.rs:214-220","code":"  214 |     fn from_serialized(\n  215 |         data: &[u8],\n  216 |         debug_types: Option<Vec<String>>,\n  217 |         debug_locations: Option<Vec<String>>,\n  218 |     ) -> Self {\n  219 |         let data = ciborium::from_reader(Cursor::new(data)).unwrap();\n  220 |         Self {","lines":7,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/fullstack-core/src/transport.rs#L214-L220"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`FileSystemCache::invalidate` panics with `.unwrap()` if the given route has no cached file (never rendered, or already invalidated). `find_file` returns `None` in that case, so `self.find_file(route).unwrap()` panics.\n\nThis is reachable from the public API: `IncrementalRenderer::invalidate` (re-exported via `pub use isrg::*` in `lib.rs`) calls `self.file_system_cache.invalidate(route)` unconditionally whenever the file-system cache is enabled, with no existence check. Any caller invalidating a route that hasn't been rendered yet (e.g. a webhook that invalidates a page id before it was ever visited) or double-invalidating the same route will panic.","fix":"Make `find_file` failure a no-op instead of a panic:\n```rust\npub fn invalidate(&mut self, route: &str) {\n    let Some(file_path) = self.find_file(route) else { return };\n    if let Err(err) = std::fs::remove_file(file_path.full_path) {\n        tracing::error!(\"Failed to remove file: {}\", err);\n    }\n}\n```","locations":[{"ref":"packages/fullstack-server/src/isrg/fs_cache.rs:78-83","code":"   78 |     pub fn invalidate(&mut self, route: &str) {\n   79 |         let file_path = self.find_file(route).unwrap().full_path;\n   80 |         if let Err(err) = std::fs::remove_file(file_path) {\n   81 |             tracing::error!(\"Failed to remove file: {}\", err);\n   82 |         }\n   83 |     }","lines":6,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/fullstack-server/src/isrg/fs_cache.rs#L78-L83"},{"ref":"packages/fullstack-server/src/isrg/mod.rs:44-48","code":"   44 |     pub fn invalidate(&mut self, route: &str) {\n   45 |         self.memory_cache.invalidate(route);\n   46 |         #[cfg(not(target_arch = \"wasm32\"))]\n   47 |         self.file_system_cache.invalidate(route);\n   48 |     }","lines":5,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/fullstack-server/src/isrg/mod.rs#L44-L48"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"high","difficulty":"very_easy","description":"In `Lazy::initialize`, the user-provided async constructor's result is unwrapped with `constructor().unwrap()` instead of being propagated. The enclosing function `initialize` returns `Result<(), CapturedError>` specifically so that constructor errors (e.g. a database pool failing to connect during server startup) can be handled gracefully, but the `.unwrap()` turns any `Err` from the constructor into an immediate panic, crashing the thread (and via `Lazy::get`'s `.expect(\"Failed to initialize lazy value\")`, any `deref` of the `Lazy`) instead of surfacing the real error to the caller.","fix":"Propagate the constructor error instead of unwrapping it:\n```rust\n// before\nself.set(constructor().unwrap())?;\n\n// after\nself.set(constructor()?)?;\n```","locations":[{"ref":"packages/fullstack/src/lazy.rs:88-90","code":"   88 |             // Otherwise, we need to initialize the value\n   89 |             self.set(constructor().unwrap())?;\n   90 |         }","lines":3,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/fullstack/src/lazy.rs#L88-L90"}]},
{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"In `req_from::ExtractRequest` (the one-arg `DeserializeOwned` path used when a server function has a single argument implementing `DeserializeOwned`), `Bytes::from_request(request, &()).await.unwrap()` unwraps the result of reading the request body. `Bytes::from_request` can fail on IO errors (client disconnects mid-body, truncated/aborted uploads, chunked-encoding errors), which are entirely client-controlled and reachable in production. Instead of returning a `400`/error response like the rest of the extractor pipeline does (see the `.map_err(|e| e.into_response())?` pattern used one line above for `H::from_request_parts`), this path panics the request-handling task.","fix":"Replace the `unwrap()` with proper error propagation, mirroring the header extraction above:\n```rust\nlet bytes = Bytes::from_request(request, &())\n    .await\n    .map_err(|e| ServerFnError::from(e.into_response()... /* or a dedicated Request error */)\n    .into_response())?;\n```\nor at minimum map the rejection into a `Response` via `.map_err(|e| e.into_response())?` instead of unwrapping.","locations":[{"ref":"packages/fullstack/src/magic.rs:535-557","code":"  535 |             async move {\n  536 |                 let (mut parts, body) = request.into_parts();\n  537 |                 let headers = H::from_request_parts(&mut parts, &_state)\n  538 |                     .await\n  539 |                     .map_err(|e| e.into_response())?;\n  540 | \n  541 |                 let request = Request::from_parts(parts, body);\n  542 |                 let bytes = Bytes::from_request(request, &()).await.unwrap();\n  543 |                 let as_str = String::from_utf8_lossy(&bytes);\n  544 | \n  545 |                 let bytes = if as_str.is_empty() {\n  546 |                     \"{}\".as_bytes()\n  547 |                 } else {\n  548 |                     &bytes\n  549 |                 };\n  550 | \n  551 |                 let out = serde_json::from_slice::<In>(bytes)\n  552 |                     .map(map)\n  553 |                     .map_err(|e| ServerFnError::from(e).into_response())?;\n  554 | \n  555 |                 Ok((out, headers))\n  556 |             }\n  557 |         }","lines":23,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/fullstack/src/magic.rs#L535-L557"}]},
{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`IntoResponse for FileStream` builds the `Content-Type` and `Content-Disposition` response headers with `.parse().unwrap()` on values that can originate entirely from an untrusted client upload: `content_type` comes verbatim from the incoming request's `Content-Type` header (set in `FromRequest for FileStream`), and `name` comes from parsing the incoming request's `Content-Disposition` header via `content_disposition::parse_content_disposition`. If a client sends a `Content-Type` or filename containing bytes that are invalid in an HTTP header value (e.g. control characters that survive RFC 5987/2231 percent-decoding in the filename), `HeaderValue`'s `.parse()` returns `Err`, and the subsequent `.unwrap()` panics the request-handling task - a remotely triggerable panic in any handler that re-serves an uploaded `FileStream` back to a client (echo/relay/proxy endpoints).","fix":"Sanitize or fall back instead of unwrapping, e.g.:\n```rust\nif let Some(content_type) = &self.content_type {\n    if let Ok(value) = content_type.parse() {\n        res.headers_mut().insert(\"Content-Type\", value);\n    }\n}\n...\nlet disposition = format!(\"attachment; filename=\\\"{}\\\"\", self.name);\nif let Ok(value) = disposition.parse() {\n    res.headers_mut().insert(\"Content-Disposition\", value);\n}\n```\nso a malformed filename/content-type degrades to a missing header rather than crashing the handler.","locations":[{"ref":"packages/fullstack/src/payloads/files.rs:309-340","code":"  309 | #[cfg(feature = \"server\")]\n  310 | impl IntoResponse for FileStream {\n  311 |     fn into_response(self) -> axum::response::Response {\n  312 |         use axum::body::Body;\n  313 | \n  314 |         let Some(body) = self.server_body else {\n  315 |             use dioxus_fullstack_core::HttpError;\n  316 |             return HttpError::new(http::StatusCode::BAD_REQUEST, \"FileStream has no body\")\n  317 |                 .into_response();\n  318 |         };\n  319 | \n  320 |         let mut res = axum::response::Response::new(Body::from_stream(body));\n  321 | \n  322 |         // Set relevant headers if available\n  323 |         if let Some(content_type) = &self.content_type {\n  324 |             res.headers_mut()\n  325 |                 .insert(\"Content-Type\", content_type.parse().unwrap());\n  326 |         }\n  327 |         if let Some(size) = self.size {\n  328 |             res.headers_mut()\n  329 |                 .insert(\"Content-Length\", size.to_string().parse().unwrap());\n  330 |         }\n  331 |         res.headers_mut().insert(\n  332 |             \"Content-Disposition\",\n  333 |             format!(\"attachment; filename=\\\"{}\\\"\", self.name)\n  334 |                 .parse()\n  335 |                 .unwrap(),\n  336 |         );\n  337 | \n  338 |         res\n  339 |     }\n  340 | }","lines":32,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/fullstack/src/payloads/files.rs#L309-L340"}]},
{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`SyncStorage::new_reference` and `UnsyncStorage::new_reference` call `unreachable!()` when the resolved entry is not `RwLockStorageEntryData::Rc` / `RefCellStorageEntryData::Rc`. This branch is actually reachable through the public, safe API: `GenerationalBox::leak_reference()` and `Owner::insert_reference()` call `S::new_reference(self.raw)` on **any** `GenerationalBox<T, S>`, including ones created with the plain (non-rc) `leak`/`insert` constructors, whose terminal entry is `Data(_)`, not `Rc(_)`. Calling `.leak_reference()` or `owner.insert_reference(box)` on a box that was not created with `leak_rc`/`insert_rc` therefore panics via `unreachable!()` instead of returning a `BorrowResult` error, even though the function's signature (`-> BorrowResult<GenerationalPointer<Self>>`) and the sibling function `change_reference` (which handles exactly this same mismatch gracefully by returning `Err(BorrowError::Dropped(..))`) both signal that this should be a recoverable error, not a hard panic.","fix":"Replace the `unreachable!()` arm with a graceful error return, mirroring the pattern already used in `change_reference`'s `else` branch, e.g.:\n```rust\nlet (location, value) = Self::get_split_ref(location)?;\nlet data = match &value.data {\n    RwLockStorageEntryData::Rc(data) => data,\n    _ => return Err(BorrowError::Dropped(ValueDroppedError::new_for_location(location.location))),\n};\ndata.add_ref();\n```\nApply the analogous change in `unsync.rs`.","locations":[{"ref":"packages/generational-box/src/sync.rs:338-355","code":"  338 |     fn new_reference(\n  339 |         location: GenerationalPointer<Self>,\n  340 |     ) -> BorrowResult<GenerationalPointer<Self>> {\n  341 |         // Chase the reference to get the final location\n  342 |         let (location, value) = Self::get_split_ref(location)?;\n  343 |         if let RwLockStorageEntryData::Rc(data) = &value.data {\n  344 |             data.add_ref();\n  345 |         } else {\n  346 |             unreachable!()\n  347 |         }\n  348 |         Ok(Self::create_new(\n  349 |             RwLockStorageEntryData::Reference(location),\n  350 |             location\n  351 |                 .location\n  352 |                 .created_at()\n  353 |                 .unwrap_or(std::panic::Location::caller()),\n  354 |         ))\n  355 |     }","lines":18,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/generational-box/src/sync.rs#L338-L355"},{"ref":"packages/generational-box/src/unsync.rs:334-351","code":"  334 |     fn new_reference(\n  335 |         pointer: GenerationalPointer<Self>,\n  336 |     ) -> BorrowResult<GenerationalPointer<Self>> {\n  337 |         // Chase the reference to get the final location\n  338 |         let (pointer, value) = Self::get_split_ref(pointer)?;\n  339 |         if let RefCellStorageEntryData::Rc(data) = &value.data {\n  340 |             data.add_ref();\n  341 |         } else {\n  342 |             unreachable!()\n  343 |         }\n  344 |         Ok(Self::create_new(\n  345 |             RefCellStorageEntryData::Reference(pointer),\n  346 |             pointer\n  347 |                 .location\n  348 |                 .created_at()\n  349 |                 .unwrap_or(std::panic::Location::caller()),\n  350 |         ))\n  351 |     }","lines":18,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/generational-box/src/unsync.rs#L334-L351"}]},
{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`check_file` in `packages/cli/src/check/mod.rs` calls `syn::parse_file(file_content).unwrap()`. This is a public function (`pub fn check_file`) whose only caller in production code (`packages/cli/src/cli/check.rs`) happens to wrap it in `tokio::spawn` so the panic becomes a `JoinError` instead of crashing the process, but the actual `syn::Error` (which contains the useful line/column of the syntax problem) is thrown away entirely - the user only sees a generic \"error checking file\" log line. Any other caller of this public API (or future refactor that calls it outside a spawned task) would crash the whole CLI on any file with a parse error (e.g. a file mid-edit, an unsupported edition, or macro-heavy code `syn` cannot parse).","fix":"Change `check_file` to return `Result<IssueReport>` (or `Result<IssueReport, syn::Error>`) and propagate the parse error with `?` instead of `.unwrap()`, then have the caller log the real `syn::Error` message including its line/column.","locations":[{"ref":"packages/cli/src/check/mod.rs:30-40","code":"   30 | pub fn check_file(path: PathBuf, file_content: &str) -> IssueReport {\n   31 |     let file = syn::parse_file(file_content).unwrap();\n   32 |     let mut visit_hooks = VisitHooks::new();\n   33 |     visit_hooks.visit_file(&file);\n   34 |     IssueReport::new(\n   35 |         path,\n   36 |         std::env::current_dir().unwrap_or_default(),\n   37 |         file_content.to_string(),\n   38 |         visit_hooks.issues,\n   39 |     )\n   40 | }","lines":11,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/check/mod.rs#L30-L40"}]},
{"id":"PANIC_14","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`RemoteComponentRegistry::update` in `packages/cli/src/cli/component.rs` calls `repo.find_object(oid, None).unwrap()` after resolving `oid` via `repo.refname_to_id(...)`. If the resolved oid is somehow not directly loadable (corrupted repo, dangling ref after a failed fetch, shallow clone edge case), this panics inside the `spawn_blocking` closure during `dx component update`, instead of surfacing a normal git error like the surrounding calls (`?`) do.","fix":"Replace `repo.find_object(oid, None).unwrap()` with `repo.find_object(oid, None)?` so the error propagates like the other git2 calls in this closure.","locations":[{"ref":"packages/cli/src/cli/component.rs:399-421","code":"  399 |         tokio::task::spawn_blocking({\n  400 |             let path = path.clone();\n  401 |             move || {\n  402 |                 let repo = Repository::open(path)?;\n  403 |                 let mut remote = repo.find_remote(\"origin\")?;\n  404 |                 // Fetch all remote branches with the same name as local branches\n  405 |                 remote.fetch(&[\"refs/heads/*:refs/heads/*\"], None, None)?;\n  406 |                 // If a rev is provided, checkout that rev\n  407 |                 if let Some(rev) = &rev {\n  408 |                     Self::checkout_rev(&repo, &git, rev)?;\n  409 |                 }\n  410 |                 // Otherwise, just checkout the latest commit on the default branch\n  411 |                 else {\n  412 |                     let head = repo.head()?;\n  413 |                     let branch = head.shorthand().unwrap_or(\"main\");\n  414 |                     let oid = repo.refname_to_id(&format!(\"refs/remotes/origin/{branch}\"))?;\n  415 |                     let object = repo.find_object(oid, None).unwrap();\n  416 |                     repo.reset(&object, git2::ResetType::Hard, None)?;\n  417 |                 }\n  418 |                 anyhow::Ok(())\n  419 |             }\n  420 |         })\n  421 |         .await??;","lines":23,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/cli/component.rs#L399-L421"}]},
{"id":"PANIC_15","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`post_create` in `packages/cli/src/cli/create.rs` runs `cargo fmt` via `cmd.output().expect(\"failed to execute process\")`. If `cargo` is not on `PATH` or fails to spawn for any reason, this panics and crashes the whole `dx new`/`dx init` command right after the project files were generated, instead of returning the `Result<()>` error that this function already supports.","fix":"Replace `cmd.output().expect(\"failed to execute process\")` with `cmd.output().context(\"failed to run `cargo fmt`\")?` since `post_create` already returns `anyhow::Result<()>`.","locations":[{"ref":"packages/cli/src/cli/create.rs:181-188","code":"  181 |     let mut cmd = Command::new(\"cargo\");\n  182 |     let cmd = cmd.arg(\"fmt\").current_dir(path);\n  183 |     let output = cmd.output().expect(\"failed to execute process\");\n  184 |     if !output.status.success() {\n  185 |         tracing::error!(dx_src = ?TraceSrc::Dev, \"cargo fmt failed\");\n  186 |         tracing::error!(dx_src = ?TraceSrc::Build, \"stdout: {}\", String::from_utf8_lossy(&output.stdout));\n  187 |         tracing::error!(dx_src = ?TraceSrc::Build, \"stderr: {}\", String::from_utf8_lossy(&output.stderr));\n  188 |     }","lines":8,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/cli/create.rs#L181-L188"}]},
{"id":"PANIC_16","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`run_link_inner` in `packages/cli/src/cli/link.rs` uses `cmd.output().expect(\"Failed to run linker\")` (line 156) even though the function returns `Result<()>`. If the configured custom linker binary is missing or cannot be spawned, `dx` panics instead of reporting a clean linker error through the existing error-file mechanism used a few lines below.","fix":"Replace `.expect(\"Failed to run linker\")` with `.with_context(|| format!(\"Failed to run linker {linker:?}\"))?` so the failure flows through the same `Result` path as the rest of `run_link_inner`.","locations":[{"ref":"packages/cli/src/cli/link.rs:150-164","code":"  150 |             Some(linker) => {\n  151 |                 let mut cmd = std::process::Command::new(linker);\n  152 |                 match cfg!(target_os = \"windows\") {\n  153 |                     true => cmd.arg(format!(\"@{}\", &self.link_args_file.display())),\n  154 |                     false => cmd.args(args),\n  155 |                 };\n  156 |                 let res = cmd.output().expect(\"Failed to run linker\");\n  157 | \n  158 |                 if !res.status.success() {\n  159 |                     bail!(\n  160 |                         \"{}\\n{}\",\n  161 |                         String::from_utf8_lossy(&res.stdout),\n  162 |                         String::from_utf8_lossy(&res.stderr)\n  163 |                     );\n  164 |                 }","lines":15,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/cli/link.rs#L150-L164"}]},
{"id":"PANIC_17","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`run_link_inner` in `packages/cli/src/cli/link.rs` extracts the output path with two unchecked `.unwrap()` calls: `args.iter().find(|arg| arg.starts_with(\"/OUT\")).unwrap()` on Windows (line 182) and `args.iter().position(|arg| arg == \"-o\").unwrap()` followed by indexing `args[out + 1]` on other platforms (lines 186-187). If rustc/the linker invocation ever omits the expected flag (or `-o` is the very last argument with no following value), this panics instead of producing a diagnosable linker error, aborting the whole build with an unhelpful backtrace.","fix":"Replace the `.unwrap()`s with `.ok_or_else(|| anyhow::anyhow!(\"linker invocation missing output flag\"))?` (and bounds-check `out + 1 < args.len()` before indexing) so a malformed/unexpected linker command line produces a normal `Result` error.","locations":[{"ref":"packages/cli/src/cli/link.rs:180-189","code":"  180 |                 let out_file: PathBuf = match self.triple.operating_system {\n  181 |                     target_lexicon::OperatingSystem::Windows => {\n  182 |                         let out_arg = args.iter().find(|arg| arg.starts_with(\"/OUT\")).unwrap();\n  183 |                         out_arg.trim_start_matches(\"/OUT:\").to_string().into()\n  184 |                     }\n  185 |                     _ => {\n  186 |                         let out = args.iter().position(|arg| arg == \"-o\").unwrap();\n  187 |                         args[out + 1].clone().into()\n  188 |                     }\n  189 |                 };","lines":10,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/cli/link.rs#L180-L189"}]},
{"id":"PANIC_18","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`handle_linker_arg_response_file` in `packages/cli/src/cli/link.rs` calls `std::fs::read(path).unwrap()` (line 257) to read a Windows linker response file (`@path`). This function is invoked while `dx` is acting as a linker proxy during a real build; if the response file path is missing, was already cleaned up, or is unreadable for any reason, this panics and takes down the whole link step instead of surfacing a normal error.","fix":"Change the function to return `Result<Vec<String>>` and propagate the read failure with `?`/`.with_context(...)` instead of `.unwrap()`, updating `get_actual_linker_args_excluding_program_name` and its caller accordingly.","locations":[{"ref":"packages/cli/src/cli/link.rs:254-268","code":"  254 | pub fn handle_linker_arg_response_file(arg: String) -> Vec<String> {\n  255 |     if arg.starts_with('@') {\n  256 |         let path = arg.trim().trim_start_matches('@');\n  257 |         let file_binary = std::fs::read(path).unwrap();\n  258 | \n  259 |         // This may be a utf-16le file. Let's try utf-8 first.\n  260 |         let mut content = String::from_utf8(file_binary.clone()).unwrap_or_else(|_| {\n  261 |             // Convert Vec<u8> to Vec<u16> to convert into a String\n  262 |             let binary_u16le: Vec<u16> = file_binary\n  263 |                 .chunks_exact(2)\n  264 |                 .map(|a| u16::from_le_bytes([a[0], a[1]]))\n  265 |                 .collect();\n  266 | \n  267 |             String::from_utf16_lossy(&binary_u16le)\n  268 |         });","lines":15,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/cli/link.rs#L254-L268"}]},
{"id":"PANIC_19","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`run_rustc` and `write_rustc_args` use `.expect(...)` on multiple fallible I/O operations that occur on the hot path of every single rustc invocation performed through the `dx` wrapper: `std::env::current_dir().expect(...)`, `std::fs::create_dir_all(args_dir).expect(...)`, `serde_json::to_string(rustc_args).expect(...)`, `std::fs::write(...).expect(...)`, and `cmd.status().expect(\"Failed to execute rustc command\")`. Because this wrapper is invoked once per crate compiled in the workspace, any transient failure (disk full, permission error, path too long, antivirus lock on Windows) aborts the entire build with a raw panic message instead of a clean, actionable error.","fix":"Change `run_rustc`/`write_rustc_args` to return `anyhow::Result<ExitCode>` (or similar) and propagate errors with `?`/`.context(...)` instead of `.expect(...)`, printing a clear error message before exiting non-zero.","locations":[{"ref":"packages/cli/src/rustcwrapper.rs:54-96","code":"   54 | pub fn run_rustc() -> ExitCode {\n   55 |     let args_dir: PathBuf = std::env::var(DX_RUSTC_WRAPPER_ENV_VAR)\n   56 |         .expect(\"DX_RUSTC env var must be set\")\n   57 |         .into();\n   58 | \n   59 |     // Cargo invokes a workspace wrapper like: `wrapper-name rustc [args...]`\n   60 |     // We skip our own executable name (`wrapper-name`) to get the args passed to us.\n   61 |     let captured_args = args().skip(1).collect::<Vec<_>>();\n   62 | \n   63 |     let rustc_args = RustcArgs {\n   64 |         args: captured_args.clone(),\n   65 |         envs: vars().collect::<_>(),\n   66 |         cwd: std::env::current_dir().expect(\"Failed to get current dir\"),\n   67 |     };\n   68 | \n   69 |     // Always persist the captured rustc invocation, even for link steps.\n   70 |     // The tip crate's bin target is typically only observed during the final link invocation,\n   71 |     // so returning early before writing would lose the exact args/envs we need for fat-link replay.\n   72 |     write_rustc_args(&args_dir, &rustc_args);\n   73 | \n   74 |     // If we are being asked to link, delegate to the linker action after capturing.\n   75 |     if has_linking_args() {\n   76 |         return crate::link::LinkAction::from_env()\n   77 |             .expect(\"Linker action not found\")\n   78 |             .run_link();\n   79 |     }\n   80 | \n   81 |     // Run the actual rustc command.\n   82 |     // We want all stdout/stderr to be inherited, so the user sees the compiler output.\n   83 |     let mut cmd = std::process::Command::new(\"rustc\");\n   84 | \n   85 |     // The first argument in `captured_args` is the rustc path, which we need to skip\n   86 |     // when passing arguments to the `rustc` command we are spawning.\n   87 |     cmd.args(captured_args.iter().skip(1));\n   88 |     cmd.envs(rustc_args.envs);\n   89 |     cmd.current_dir(rustc_args.cwd);\n   90 |     cmd.stdout(std::process::Stdio::inherit());\n   91 |     cmd.stderr(std::process::Stdio::inherit());\n   92 | \n   93 |     // Spawn the process and propagate its exit code.\n   94 |     let status = cmd.status().expect(\"Failed to execute rustc command\");\n   95 |     std::process::exit(status.code().unwrap_or(1)); // Exit with 1 if process was killed by signal\n   96 | }","lines":43,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/rustcwrapper.rs#L54-L96"},{"ref":"packages/cli/src/rustcwrapper.rs:98-138","code":"   98 | fn write_rustc_args(args_dir: &PathBuf, rustc_args: &RustcArgs) {\n   99 |     // Extract the crate name from the args to use as the filename.\n  100 |     // Skip non-sensical args when a build is completely fresh (rustc is invoked with --crate-name ___)\n  101 |     let crate_name = rustc_args\n  102 |         .args\n  103 |         .iter()\n  104 |         .skip_while(|arg| *arg != \"--crat {"id":"PANIC_20","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"In `AppServer::open`, the fallback build-time calculation uses `.unwrap()` on `duration_since`: `artifacts.time_end.duration_since(artifacts.time_start).unwrap()`. `SystemTime::duration_since` returns an `Err` whenever `time_end` is earlier than `time_start`, which can happen from ordinary system clock adjustments (NTP sync, manual clock change, VM snapshot resume) between recording the two timestamps. The sibling code in `AppServer::hotpatch` handles the exact same computation defensively with `.unwrap_or_default()`, showing this `unwrap()` is an oversight rather than an intentional invariant.","fix":"Match the safer pattern already used in `hotpatch`:\n```rust\nlet time_taken = self.client.total_build_time().unwrap_or_else(|| {\n    artifacts\n        .time_end\n        .duration_since(artifacts.time_start)\n        .unwrap_or_default()\n});\n```","locations":[{"ref":"packages/cli/src/serve/runner.rs:721-727","code":"  721 |         if should_open {\n  722 |             let time_taken = self.client.total_build_time().unwrap_or_else(|| {\n  723 |                 artifacts\n  724 |                     .time_end\n  725 |                     .duration_since(artifacts.time_start)\n  726 |                     .unwrap()\n  727 |             });","lines":7,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/serve/runner.rs#L721-L727"},{"ref":"packages/cli/src/serve/runner.rs:871-874","code":"  871 |         let elapsed = bundle\n  872 |             .time_end\n  873 |             .duration_since(bundle.time_start)\n  874 |             .unwrap_or_default();","lines":4,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/serve/runner.rs#L871-L874"}]},
{"id":"PANIC_21","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`WebServer::wait` calls `panic!(\"Could not receive a socket - the devtools could not boot - the port is likely already in use\")` whenever `new_hot_reload_sockets`/`new_build_status_sockets` yields `None`. These channels only close when the router spawned in `devserver_mainloop` (via `tokio::spawn`) exits - e.g. if `axum::serve(...)` or `axum_server::from_tcp_rustls(...)` returns an `Err` after already running successfully for a while (transient I/O error, resource exhaustion, TLS renegotiation failure, etc.), not necessarily a port-already-in-use condition at startup. This turns a recoverable/loggable background-task failure into a hard process panic with a misleading diagnostic message, rather than surfacing a clean error and shutting down gracefully.","fix":"Instead of panicking, treat a closed channel as a fatal-but-clean condition: return a `ServeUpdate::Exit { error: Some(...) }` (or equivalent) so the caller can log the real cause and shut down cleanly instead of panicking with a hardcoded, potentially inaccurate message.","locations":[{"ref":"packages/cli/src/serve/server.rs:144-173","code":"  144 |         tokio::select! {\n  145 |             new_hot_reload_socket = &mut new_hot_reload_socket => {\n  146 |                 if let Some(new_socket) = new_hot_reload_socket {\n  147 |                     let aslr_reference = new_socket.aslr_reference;\n  148 |                     let pid = new_socket.pid;\n  149 |                     let id = new_socket.build_id.unwrap_or(BuildId::PRIMARY);\n  150 | \n  151 |                     drop(new_message);\n  152 |                     self.hot_reload_sockets.push(new_socket);\n  153 | \n  154 |                     return ServeUpdate::NewConnection { aslr_reference, id, pid };\n  155 |                 } else {\n  156 |                     panic!(\"Could not receive a socket - the devtools could not boot - the port is likely already in use\");\n  157 |                 }\n  158 |             }\n  159 |             new_build_status_socket = &mut new_build_status_socket => {\n  160 |                 if let Some(mut new_socket) = new_build_status_socket {\n  161 |                     drop(new_message);\n  162 | \n  163 |                     // Update the socket with project info and current build status\n  164 |                     let project_info = SharedStatus::new(Status::ClientInit { application_name: self.application_name.clone(), bundle: self.bundle });\n  165 |                     if project_info.send_to(&mut new_socket.socket).await.is_ok() {\n  166 |                         _ = self.build_status.send_to(&mut new_socket.socket).await;\n  167 |                         self.build_status_sockets.push(new_socket);\n  168 |                     }\n  169 |                     return future::pending::<ServeUpdate>().await;\n  170 |                 } else {\n  171 |                     panic!(\"Could not receive a socket - the devtools could not boot - the port is likely already in use\");\n  172 |                 }\n  173 |             }","lines":30,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/serve/server.rs#L144-L173"}]},
{"id":"PANIC_22","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`WebServer::new_build_update` computes `progress: (*current as f64 / *total as f64).clamp(0.0, 1.0)` for `BuildStage::Compiling { current, total, .. }` without guarding against `total == 0`. If both `current` and `total` are `0` (plausible during the earliest compiling progress event before the real crate count is known), the division yields `NaN`, and `f64::clamp` leaves `NaN` unchanged. This `Status::Building { progress: NaN, .. }` is later serialized in `SharedStatus::send_to` / `send_build_status` via `serde_json::to_string(&self.get()).unwrap()` - `serde_json` cannot represent non-finite floats and returns an `Err`, so the `.unwrap()` panics and takes down the whole devserver.","fix":"Guard the division, e.g.:\n```rust\nprogress: if *total == 0 { 0.0 } else { (*current as f64 / *total as f64).clamp(0.0, 1.0) },\n```\nand/or replace the `serde_json::to_string(..).unwrap()` calls with graceful error handling so a serialization failure never panics the server.","locations":[{"ref":"packages/cli/src/serve/server.rs:228-243","code":"  228 |                     BuildStage::Compiling {\n  229 |                         current,\n  230 |                         total,\n  231 |                         krate,\n  232 |                         ..\n  233 |                     } if !matches!(\n  234 |                         self.build_status.get(),\n  235 |                         Status::Ready | Status::BuildError { .. }\n  236 |                     ) =>\n  237 |                     {\n  238 |                         self.build_status.set(Status::Building {\n  239 |                             progress: (*current as f64 / *total as f64).clamp(0.0, 1.0),\n  240 |                             build_message: format!(\"{krate} compiling\"),\n  241 |                         });\n  242 |                         self.send_build_status().await;\n  243 |                     }","lines":16,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/serve/server.rs#L228-L243"},{"ref":"packages/cli/src/serve/server.rs:789-791","code":"  789 |     async fn send_to(&self, socket: &mut WebSocket) -> Result<(), axum::Error> {\n  790 |         let msg = serde_json::to_string(&self.get()).unwrap();\n  791 |         socket.send(Message::Text(msg.into())).await","lines":3,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/serve/server.rs#L789-L791"}]},
{"id":"PANIC_23","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`WasmOpt::optimize` uses `.unwrap()` on `std::fs::copy` in both the success and failure branches (copying the temp output to `output_path`, or falling back to copying the original input). A full disk, permission error, or another process holding a lock on the destination file (common on Windows) will panic the CLI mid-build instead of surfacing a normal build error, even though the rest of the function propagates errors via `Result`/`?`.","fix":"Propagate the error instead of unwrapping:\n```rust\nif self.input_path != self.output_path {\n    std::fs::copy(&self.input_path, &self.output_path)\n        .context(\"failed to copy original wasm after wasm-opt failure\")?;\n}\n...\nstd::fs::copy(self.temporary_output_path.path(), &self.output_path)\n    .context(\"failed to copy optimized wasm output\")?;\n```","locations":[{"ref":"packages/cli/src/wasm_opt.rs:111-133","code":"  111 |     pub async fn optimize(&self) -> Result<()> {\n  112 |         let mut command = self.build_command();\n  113 |         let res = command.output().await?;\n  114 | \n  115 |         if !res.status.success() {\n  116 |             let err = String::from_utf8_lossy(&res.stderr);\n  117 |             tracing::error!(\n  118 |                 telemetry = %serde_json::json!({ \"event\": \"wasm_opt_failed\" }),\n  119 |                 \"wasm-opt failed with status code {}\\nstderr: {}\\nstdout: {}\",\n  120 |                 res.status,\n  121 |                 err,\n  122 |                 String::from_utf8_lossy(&res.stdout)\n  123 |             );\n  124 |             // A failing wasm-opt execution may leave behind an empty file so copy the original file instead.\n  125 |             if self.input_path != self.output_path {\n  126 |                 std::fs::copy(&self.input_path, &self.output_path).unwrap();\n  127 |             }\n  128 |         } else {\n  129 |             std::fs::copy(self.temporary_output_path.path(), &self.output_path).unwrap();\n  130 |         }\n  131 | \n  132 |         Ok(())\n  133 |     }","lines":23,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/cli/src/wasm_opt.rs#L111-L133"}]},
{"id":"PANIC_24","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`ReactiveContext::mark_dirty` acquires a write guard (`self_write` from `self.inner.try_write()`) and keeps it alive while calling the arbitrary user-supplied `(self_write.update)()` callback. If that callback (or anything it triggers, e.g. re-entrant work that ends up calling `subscribe()`, `clear_subscribers()`, or `mark_dirty()` again on the very same `ReactiveContext`) tries to acquire another write/borrow of `self.inner`, `subscribe()`'s `Err(expect) => panic!(...)` branch will fire because the box is already mutably borrowed. This makes reentrant dirty-marking on the same context a hard panic instead of a no-op or queued retry.","fix":"Drop the write guard before invoking the callback, e.g. by copying/taking what is needed out of `Inner` first:\n```rust\npub fn mark_dirty(&self) -> bool {\n    let Ok(mut self_write) = self.inner.try_write() else { return false; };\n    // Take the callback out so we don't hold a write borrow while it runs\n    let mut update = std::mem::replace(&mut self_write.update, Box::new(|| {}));\n    drop(self_write);\n    update();\n    // put it back if still needed, or restructure Inner.update as Rc<RefCell<..>> so it can be invoked without holding the whole struct's guard\n    true\n}\n```\nThe important part is that no lock on `self.inner` is held while `update()` executes.","locations":[{"ref":"packages/core/src/reactive_context.rs:217-233","code":"  217 |     pub fn mark_dirty(&self) -> bool {\n  218 |         if let Ok(mut self_write) = self.inner.try_write() {\n  219 |             #[cfg(debug_assertions)]\n  220 |             {\n  221 |                 tracing::trace!(\n  222 |                     \"Marking reactive context created at {} as dirty\",\n  223 |                     self_write.origin\n  224 |                 );\n  225 |             }\n  226 | \n  227 |             (self_write.update)();\n  228 | \n  229 |             true\n  230 |         } else {\n  231 |             false\n  232 |         }\n  233 |     }","lines":17,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/core/src/reactive_context.rs#L217-L233"}]},
{"id":"PANIC_25","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`WebviewEdits::handle_html_event` calls `desktop_context.upgrade().unwrap()` after confirming the `Weak` reference was previously set via `set_desktop_context`. The `Weak` can still go dead between that check and the `unwrap()` if the owning `DesktopService`/`WebviewInstance` is dropped concurrently (e.g. the window is closed on the main thread while an in-flight async custom-protocol request for `__events` - dispatched onto the tokio runtime, see `request_handler` in `packages/desktop/src/webview.rs:284-301` - is still being processed). When that race hits, this `unwrap()` panics and crashes the app instead of simply dropping the stale event.","fix":"Return the default (no-op) response instead of panicking when the context has already been dropped:\n\n```rust\nlet Some(desktop_context) = self.desktop_context.get().and_then(|c| c.upgrade()) else {\n    tracing::warn!(\"Dropped HTML event because the window has already closed\");\n    return Default::default();\n};\n```","locations":[{"ref":"packages/desktop/src/webview.rs:132-146","code":"  132 |     pub fn handle_html_event(&self, event: HtmlEvent) -> SynchronousEventResponse {\n  133 |         let HtmlEvent {\n  134 |             element,\n  135 |             name,\n  136 |             bubbles,\n  137 |             data,\n  138 |         } = event;\n  139 |         let Some(desktop_context) = self.desktop_context.get() else {\n  140 |             tracing::error!(\n  141 |                 \"Tried to handle event before setting the desktop context on the event handler\"\n  142 |             );\n  143 |             return Default::default();\n  144 |         };\n  145 | \n  146 |         let desktop_context = desktop_context.upgrade().unwrap();","lines":15,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/desktop/src/webview.rs#L132-L146"}]},
{"id":"PANIC_26","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`format_rsx` and `format_selection` in the VS Code extension's wasm bridge both call `dioxus_autofmt::fmt_block(...).unwrap()`. `fmt_block` returns `Option<String>` and returns `None` whenever the given snippet isn't a formattable RSX block (very easy to trigger from `format_selection`, which is fed an arbitrary user text selection in `packages/extension/src/main.ts`'s `fmtSelection`). This turns a normal 'selection wasn't valid RSX' case into a wasm panic/trap instead of a clean error.","fix":"Return the original input (or a `Result`) instead of unwrapping, matching how `format_file` already handles the failure case a few lines below:\n\n```rust\npub fn format_rsx(raw: String, use_tabs: bool, indent_size: usize) -> String {\n    let block = dioxus_autofmt::fmt_block(&raw, 0, IndentOptions::new(..));\n    block.unwrap_or(raw)\n}\n```","locations":[{"ref":"packages/extension/src/lib.rs:7-22","code":"    7 | pub fn format_rsx(raw: String, use_tabs: bool, indent_size: usize) -> String {\n    8 |     let block = dioxus_autofmt::fmt_block(\n    9 |         &raw,\n   10 |         0,\n   11 |         IndentOptions::new(\n   12 |             if use_tabs {\n   13 |                 IndentType::Tabs\n   14 |             } else {\n   15 |                 IndentType::Spaces\n   16 |             },\n   17 |             indent_size,\n   18 |             false,\n   19 |         ),\n   20 |     );\n   21 |     block.unwrap()\n   22 | }","lines":16,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/extension/src/lib.rs#L7-L22"},{"ref":"packages/extension/src/lib.rs:25-45","code":"   25 | pub fn format_selection(\n   26 |     raw: String,\n   27 |     use_tabs: bool,\n   28 |     indent_size: usize,\n   29 |     base_indent: usize,\n   30 | ) -> String {\n   31 |     let block = dioxus_autofmt::fmt_block(\n   32 |         &raw,\n   33 |         base_indent,\n   34 |         IndentOptions::new(\n   35 |             if use_tabs {\n   36 |                 IndentType::Tabs\n   37 |             } else {\n   38 |                 IndentType::Spaces\n   39 |             },\n   40 |             indent_size,\n   41 |             false,\n   42 |         ),\n   43 |     );\n   44 |     block.unwrap()\n   45 | }","lines":21,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/extension/src/lib.rs#L25-L45"}]},
{"id":"PANIC_27","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`translate_rsx` calls `html_parser::Dom::parse(&contents).unwrap()` and `dioxus_autofmt::write_block_out(&callbody).unwrap()`. Both can fail on attacker- or user-controlled input: `translate_rsx` is invoked directly on the user's editor selection from `packages/extension/src/main.ts`'s `translate()` function, which has no `try`/`catch` around the call (unlike `fmtSelection`, which does wrap its call in `try`/`catch`). The JS caller clearly expects a graceful failure path - it checks `out.length > 0` and otherwise shows `Errors occurred while translating, make sure this block of HTML is valid` - but an invalid HTML fragment instead throws an uncaught wasm exception before that branch is ever reached.","fix":"Change `translate_rsx` to return an empty string on parse/translation failure instead of unwrapping, e.g. `let Ok(dom) = html_parser::Dom::parse(&contents) else { return String::new(); };` and the same pattern for `write_block_out`, so the existing `out.length > 0` check in `main.ts` can do its job.","locations":[{"ref":"packages/extension/src/lib.rs:92-101","code":"   92 | #[wasm_bindgen]\n   93 | pub fn translate_rsx(contents: String, _component: bool) -> String {\n   94 |     // Ensure we're loading valid HTML\n   95 |     let dom = html_parser::Dom::parse(&contents).unwrap();\n   96 | \n   97 |     let callbody = dioxus_rsx_rosetta::rsx_from_html(&dom);\n   98 | \n   99 |     // Convert the HTML to RSX\n  100 |     dioxus_autofmt::write_block_out(&callbody).unwrap()\n  101 | }","lines":10,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/extension/src/lib.rs#L92-L101"},{"ref":"packages/extension/src/main.ts:84-103","code":"   84 | function translate(component: boolean) {\n   85 | \t// Load the activate editor\n   86 | \tconst editor = vscode.window.activeTextEditor;\n   87 | \tif (!editor) return;\n   88 | \n   89 | \t// Get the selected text\n   90 | \tconst html = editor.document.getText(editor.selection);\n   91 | \tif (html.length == 0) {\n   92 | \t\tvscode.window.showWarningMessage(\"Please select HTML fragment before invoking this command!\");\n   93 | \t\treturn;\n   94 | \t}\n   95 | \n   96 | \t// Translate the HTML to RSX\n   97 | \tconst out = dioxus.translate_rsx(html, component);\n   98 | \tif (out.length > 0) {\n   99 | \t\teditor.edit(editBuilder => editBuilder.replace(editor.selection, out));\n  100 | \t} else {\n  101 | \t\tvscode.window.showWarningMessage(`Errors occurred while translating, make sure this block of HTML is valid`);\n  102 | \t}\n  103 | }","lines":20,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/extension/src/main.ts#L84-L103"}]},
{"id":"PANIC_28","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"In `finalize_route`, the `web` branch does `entry.get().expect(\"Failed to get initial route from hydration context\")`. The function's own comment acknowledges the surrounding context (`RouteEntry`) may be missing in some scenarios (e.g. tests) and handles that with an early return, but once inside the `web` branch it assumes `entry.get()` always succeeds. If the client fails to deserialize the route (e.g. due to a `TakeDataError` from a version mismatch or truncated hydration data - see the related `from_serialized` panic finding), this `expect` panics on the client during route finalization instead of degrading gracefully.","fix":"Fall back to `self.history.current_route()` (the same fallback already used in `FullstackHistory::initial_route`) instead of panicking, e.g. `let route = entry.get().unwrap_or_else(|_| history().current_route());`.","locations":[{"ref":"packages/fullstack-core/src/history.rs:29-52","code":"   29 | pub(crate) fn finalize_route() {\n   30 |     // This may run in tests without the full hydration context set up, if it does, then just\n   31 |     // return without modifying the context\n   32 |     let Some(entry) = try_consume_context::<RouteEntry>() else {\n   33 |         return;\n   34 |     };\n   35 | \n   36 |     let Some(entry) = entry.entry.borrow_mut().take() else {\n   37 |         // If it was already taken, then just return. This can happen if commit_initial_chunk is called twice\n   38 |         return;\n   39 |     };\n   40 | \n   41 |     if cfg!(feature = \"server\") {\n   42 |         let history = history();\n   43 |         let route = history.current_route();\n   44 |         entry.insert(&route, std::panic::Location::caller());\n   45 |         provide_context(ResolvedRouteContext { route });\n   46 |     } else if cfg!(feature = \"web\") {\n   47 |         let route = entry\n   48 |             .get()\n   49 |             .expect(\"Failed to get initial route from hydration context\");\n   50 |         provide_context(ResolvedRouteContext { route });\n   51 |     }\n   52 | }","lines":24,"link":"https://github.com/DioxusLabs/dioxus/blob/74a49736c029e0e6f6fc4a79b5def923f0d587b8/packages/fullstack-core/src/history.rs#L29-L52"}]},
{"id":"PANIC_29","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"Throughout `magic.rs`, response bodies are built with `serde_json::to_string(&value).unwrap()` in six separate places (`MakeAxumResponse` for regular types, and all four `MakeAxumError` impls plus the `CapturedError`/`anyhow::Error` variants). `serde_json::to_string` can fail (e.g. a user's error/response type contains a `HashMap` with non-string keys, or a float `NaN`/`Infinity`), and since these types are user-defined (server function arguments/return types/errors), a value that fails to serialize will panic the request-handling task instead of falling back to a generic 500 response.","fix":"Replace each `serde_json::to_string(&x).unwrap()` with a fallback path, e.g. `serde_json::to_string(&x).unwrap_or_else(|_| \"{\\\"message\\\":\\\"failed to serialize error\\\"}\".to_string())`, or centralize this in the shared helper suggested by the accompanying `duplicate_code` finding so the fallback only needs to be written once.","locations":[{"ref":"packages/fullstack/src/magic.rs:623-642","code":"  623 |     impl<T, E> MakeAxumResponse<T, E, ()> for &&&ServerFnDecoder<Result<T, E>>\n  624 |     where\n  625 |         T: DeserializeOwned + Serialize,\n  626 |     {\n  627 |         fn make_axum_response(self, result: Result<T, E>) -> Result<Response, E> {\n  628 |             match result {\n  629 |                 Ok(res) => {\n  630 |                     let body = serde_json::to_string(&res).unwrap();\n  631 |                     let mut resp = Response::new(body.into());\n  632 |                     resp.headers_mut().insert(\n  633 |                         http::header::CONTENT_TYPE,\n  634 |                         HeaderValue::from_static(\"application/json\"),\n  635 |                     );\n  636 |                     *resp.status_mut() = StatusCode::OK;\n  637 |                     Ok(resp)\n  638 |                 }\n  639 |                 Err(err)
