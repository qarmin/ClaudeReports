<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`render_short_message` unconditionally requires the first `Group` to have a `Title` and aborts the process otherwise: `let Some(title) = &group.title else { panic!(\"Expected a Title\") };`. A title-less group is perfectly legal public API - `Group::with_level(Level::ERROR)` sets `title: None` (see `Group::with_level` in `src/snippet.rs`), and `Renderer::short_message(true)` is also public. Verified by running:\n\n```rust\nlet r = Renderer::plain().short_message(true);\nlet g = [Group::with_level(Level::ERROR).element(Level::NOTE.message(\"hi\"))];\nr.render(&g); // thread 'main' panicked at src/renderer/render.rs:241:9: Expected a Title\n```\n\nThe non-short path (`render` / `pre_process`) handles `group.title == None` gracefully (`if let Some(title) = &group.title`), so this is an inconsistency between the two rendering modes, not a documented precondition.","fix":"Degrade gracefully instead of panicking. Either fall back to the group's `primary_level` with an empty text, or skip the title portion entirely, e.g.:\n\n```rust\nif let Some(title) = &group.title {\n    render_title(renderer, &mut buffer, title, 0, TitleStyle::MainHeader, false, 0);\n}\n```\n\nand use `group.primary_level` for the final `buffer.render(...)` call instead of `title.level`. If a title truly is a hard precondition, it must be documented on `Renderer::short_message` and on `Group::with_level`.","locations":[{"ref":"src/renderer/graphics.rs:245-247","code":"  245 |     let Some(title) = &group.title else {\n  246 |         panic!(\"Expected a Title\");\n  247 |     };","lines":3,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L245-L247"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`span_to_locations` slices the line with raw byte arithmetic: `start_info.line[0..(span.start - start_info.start_byte).min(start_info.line.len())]` and the mirrored `end_info.line[0..(span.end - end_info.start_byte).min(end_info.line.len())]`. If the caller passes a byte offset that is not a UTF-8 char boundary, `str` indexing panics with `byte index N is not a char boundary`. This is reachable from the public API and is *not* caught by the range validation in `annotated_lines` / `splice_lines`, which only rejects `span.end > source_len + 1`. Verified against the built crate:\n```rust\n// panics: \"end byte index 10 is not a char boundary; it is inside 'é' (bytes 9..11 of string)\"\nSnippet::source(\"let x = \\\"é\\\";\").annotation(AnnotationKind::Primary.span(9..10))\n// panics: \"end byte index 2 is not a char boundary; it is inside 'é' (bytes 1..3 of string)\"\nSnippet::source(\"aé\\nbb\").annotation(AnnotationKind::Primary.span(0..2))\n```\nNote the inconsistency with `span_to_snippet`, which uses `self.source.get(span)` and returns `None` for the exact same input instead of panicking.","fix":"Do not index with an unvalidated offset. Either round the offset to the nearest char boundary, or validate up front and panic with a descriptive message like the existing `Annotation range ... is beyond the end of buffer ...` check. E.g. replace the slicing with a `char_indices`-driven walk that stops once the accumulated byte offset reaches the target:\n```rust\nlet target = (span.start - start_info.start_byte).min(start_info.line.len());\nlet (mut start_char_pos, start_display_pos) = start_info\n    .line\n    .char_indices()\n    .take_while(|(i, _)| *i < target)\n    .fold((0, 0), |(char_pos, display_pos), (_, c)| (char_pos + 1, display_pos + char_width(c)));\n```\nand add an explicit `assert!(source.is_char_boundary(span.start) && source.is_char_boundary(span.end), ...)` in `annotated_lines` and `splice_lines` next to the existing range check so the failure mode is a clear contract violation rather than an internal slicing panic.","locations":[{"ref":"src/renderer/source_map.rs:64-76","code":"   64 |     pub(crate) fn span_to_locations(&self, span: Range<usize>) -> (Loc, Loc) {\n   65 |         let start_info = self\n   66 |             .lines\n   67 |             .iter()\n   68 |             .find(|info| span.start >= info.start_byte && span.start < info.end_byte)\n   69 |             .unwrap_or(self.lines.last().unwrap());\n   70 |         let (mut start_char_pos, start_display_pos) = start_info.line\n   71 |             [0..(span.start - start_info.start_byte).min(start_info.line.len())]\n   72 |             .chars()\n   73 |             .fold((0, 0), |(char_pos, byte_pos), c| {\n   74 |                 let display = char_width(c);\n   75 |                 (char_pos + 1, byte_pos + display)\n   76 |             });","lines":13,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/source_map.rs#L64-L76"},{"ref":"src/renderer/source_map.rs:92-103","code":"   92 |         let end_info = self\n   93 |             .lines\n   94 |             .iter()\n   95 |             .find(|info| span.end >= info.start_byte && span.end < info.end_byte)\n   96 |             .unwrap_or(self.lines.last().unwrap());\n   97 |         let (end_char_pos, end_display_pos) = end_info.line\n   98 |             [0..(span.end - end_info.start_byte).min(end_info.line.len())]\n   99 |             .chars()\n  100 |             .fold((0, 0), |(char_pos, byte_pos), c| {\n  101 |                 let display = char_width(c);\n  102 |                 (char_pos + 1, byte_pos + display)\n  103 |             });","lines":12,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/source_map.rs#L92-L103"},{"ref":"src/renderer/source_map.rs:119 {"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"Nothing in `AnnotationKind::span` rejects an inverted range (`span.start > span.end`), and the renderer assumes `start <= end`. Verified: `Snippet::source(\"hello world\").annotation(AnnotationKind::Primary.span(5..2))` panics with `attempt to subtract with overflow` at `src/renderer/render.rs:1399` (`let width = annotation.end.display - annotation.start.display;`) in debug builds. With overflow checks off the subtraction wraps and the annotation is silently dropped from the output (verified: the caret row is rendered empty), i.e. a wrong diagnostic instead of a crash. `Range<usize>` cannot express this invariant, so it has to be checked.","fix":"Normalize the range in `AnnotationKind::span` before storing it, e.g.\n```rust\npub fn span<'a>(self, span: Range<usize>) -> Annotation<'a> {\n    let span = if span.start > span.end { span.end..span.start } else { span };\n    Annotation { span, label: None, kind: self, highlight_source: false }\n}\n```\n(or `debug_assert!(span.start <= span.end)` plus a documented `# Panics` section), and defensively use `saturating_sub` at `src/renderer/render.rs:1399`.","locations":[{"ref":"src/snippet.rs:404-413","code":"  404 | impl AnnotationKind {\n  405 |     /// Annotate a byte span within [`Snippet`]\n  406 |     pub fn span<'a>(self, span: Range<usize>) -> Annotation<'a> {\n  407 |         Annotation {\n  408 |             span,\n  409 |             label: None,\n  410 |             kind: self,\n  411 |             highlight_source: false,\n  412 |         }\n  413 |     }","lines":10,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/snippet.rs#L404-L413"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`AnnotationKind::span` accepts any `Range<usize>` without checking that the endpoints fall on UTF-8 character boundaries of the `Snippet`'s source. During rendering, `SourceMap::span_to_locations` slices the line with `start_info.line[0..(span.start - start_info.start_byte).min(start_info.line.len())]`, which panics on a non-boundary index. Verified: rendering `Snippet::source(\"héllo world\").annotation(AnnotationKind::Primary.span(2..5))` aborts with `end byte index 2 is not a char boundary; it is inside 'é' (bytes 1..3 of string)` from `src/renderer/source_map.rs:71`. The same happens through `Patch::new`. Any tool that computes byte offsets from a different source of truth (a lexer over a re-encoded buffer, a byte-oriented diff, a `#[cfg]`-stripped copy of the file) can crash the whole diagnostic renderer with a user-visible process abort (`panic = \"abort\"` is set for both profiles in `Cargo.toml`).","fix":"Either validate in the constructors or degrade gracefully in the renderer. Cheapest robust fix is in `SourceMap::span_to_locations`: replace the panicking index expressions with a boundary-safe lookup, e.g.\n```rust\nlet offset = (span.start - start_info.start_byte).min(start_info.line.len());\nlet prefix = start_info\n    .line\n    .get(0..offset)\n    .unwrap_or_else(|| &start_info.line[0..floor_char_boundary(start_info.line, offset)]);\n```\nand do the same for the `span.end` slice. Additionally document the requirement on `AnnotationKind::span` and `Patch::new` with a `# Panics` section, or snap the incoming `Range` to char boundaries there using `str::is_char_boundary`.","locations":[{"ref":"src/snippet.rs:404-413","code":"  404 | impl AnnotationKind {\n  405 |     /// Annotate a byte span within [`Snippet`]\n  406 |     pub fn span<'a>(self, span: Range<usize>) -> Annotation<'a> {\n  407 |         Annotation {\n  408 |             span,\n  409 | {"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"`render_short_message` calls `groups.first().expect(\"Expected at least one group\")`, which panics for an empty `Report` (`&[]`). The normal (non-short) path handles the empty slice fine and returns an empty `String` (the `for` loop over `groups` simply does not execute), so the two modes disagree. Verified: `Renderer::plain().short_message(true).render(&[])` panics at `src/renderer/render.rs:238:32`.","fix":"Return an empty string instead of panicking.\n\nBefore:\n```rust\nlet group = groups.first().expect(\"Expected at least one group\");\n```\n\nAfter:\n```rust\nlet Some(group) = groups.first() else {\n    return Ok(String::new());\n};\n```","locations":[{"ref":"src/renderer/graphics.rs:241-247","code":"  241 |     let mut buffer = StyledBuffer::new();\n  242 |     let mut labels = None;\n  243 |     let group = groups.first().expect(\"Expected at least one group\");\n  244 | \n  245 |     let Some(title) = &group.title else {\n  246 |         panic!(\"Expected a Title\");\n  247 |     };","lines":7,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L241-L247"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`StyledBuffer::replace` indexes `self.lines[line]` directly, so it panics with an index-out-of-bounds if `line >= self.lines.len()`. This is inconsistent with every other method on the type: `putc`, `puts` and `append` call `ensure_lines` to grow the grid, and `set_style` uses `self.lines.get_mut(line)`. It is also inconsistent with `replace`'s own comment two lines below (\"If the replacement range would be out of bounds, do nothing, as we can't replace things that don't exist\") - the column bounds are checked defensively, the row bound is not. The two current call sites in `render.rs` happen to be preceded by the column-separator loop that guarantees `line_offset + 1` exists, so this is a latent rather than currently-reachable panic.","fix":"Bounds-check the row like the columns.\n\nBefore:\n```rust\nif start > self.lines[line].len() || end > self.lines[line].len() {\n    return;\n};\nself.lines[line].splice(\n```\nAfter:\n```rust\nlet Some(line) = self.lines.get_mut(line) else {\n    return;\n};\nif start > line.len() || end > line.len() {\n    return;\n};\nline.splice(\n```","locations":[{"ref":"src/renderer/styled_buffer.rs:118-126","code":"  118 |     pub(crate) fn replace(&mut self, line: usize, start: usize, end: usize, string: &str) {\n  119 |         if start == end {\n  120 |             return;\n  121 |         }\n  122 |         // If the replacement range would be out of bounds, do nothing, as we\n  123 |         // can't replace things that don't exist.\n  124 |         if start > self.lines[line].len() || end > self.lines[line].len() {\n  125 |             return;\n  126 |         };","lines":9,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/styled_buffer.rs#L118-L126"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"very_easy","description":"`margin.term_width * 2` overflows for large `term_width` values, panicking in debug builds\n(\"attempt to multiply with overflow\") and wrapping in release builds. `term_width` comes straight\nfrom the public `Renderer::term_width()` setter (`column_width = renderer.term_width.saturating_sub(code_offset)`\nin `render_snippet_annotations`), so any caller passing a very large `usize` crashes the renderer.\nVerified: `Renderer::plain().term_width(usize::MAX).render(&report)` panics at this exact line.","fix":"Use a saturating multiplication.\n\nBefore:\n```rust\nif width > margin.term_width * 2 && width > (MIN_PAD * 2 + margin_width) {\n```\nAfter:\n```rust\nif width > margin.term_width.saturating_mul(2) && width > (MIN_PAD * 2 + margin_width) {\n```","locations":[{"ref":"src/renderer/graphics.rs:1434-1436","code":" 1434 |         static MIN_PAD: usize = 5;\n 1435 |         let margin_width = str_width(renderer.decor_style.margin());\n 1436 |         if width > margin.term_width * 2 && width > (MIN_PAD * 2 + margin_width) {","lines":3,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L1434-L1436"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`let line_end = ann.end.line - 1;` subtracts without any guard. `Loc::line` is `line_start + idx`, and `line_start` is fully caller-controlled through `Snippet::line_start` (it is a plain `usize`, so `0` is accepted). A multiline annotation whose `span.start > span.end` produces `lo.line > hi.line`; combined with `line_start(0)` this yields `ann.end.line == 0` and the subtraction underflows. Verified against the built crate:\n```rust\nSnippet::source(\"aaa\\nbbb\\nccc\\n\").line_start(0).annotation(AnnotationKind::Primary.span(8..1))\n// thread 'main' panicked: attempt to subtract with overflow\n```\nIn release builds this wraps to `usize::MAX`, and `middle < line_end` then becomes true, so `add_annotation_to_file` is called with `usize::MAX` and hits its `.unwrap()` on the line lookup. Note also that neither `annotated_lines` nor `splice_lines` validates `span.start <= span.end`; only `span.end` is bounds-checked.","fix":"Use `ann.end.line.saturating_sub(1)` (matching the defensive `saturating_sub` already used in `MultilineAnnotation::as_end`), and additionally reject inverted spans next to the existing bounds check in `annotated_lines`/`splice_lines`, e.g. `assert!(x.span.start <= x.span.end, \"Annotation range `{:?}` is inverted\", x.span)`.","locations":[{"ref":"src/renderer/source_map.rs:313-317","code":"  313 |                 let line_end = ann.end.line - 1;\n  314 |                 let end_is_empty = self.get_line(line_end).is_some_and(|s| !filter(s));\n  315 |                 if middle < line_end && !end_is_empty {\n  316 |                     self.add_annotation_to_file(&mut annotated_line_infos, line_end, ann.as_line());\n  317 |                 }","lines":5,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/source_map.rs#L313-L317"},{"ref":"src/renderer/source_map.rs:149-159","code":"  149 |         let source_len = self.source.len();\n  150 |         if let Some(bigger) = annotations.iter().find_map(|x| {\n  151 |             // Allow highlighting one past the last character in the source.\n  152 |             if source_len + 1 < x.span.end {\n  153 |                 Some(&x.span)\n  154 |             } else {\n  155 |                 None\n  156 |             }\n  157 |         }) {\n  158 |             panic!(\"Annotation range `{bigger:?}` is beyond the end of buffer `{source_len}`\")\n  159 |         }","lines":11,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/source_map.rs#L149-L159"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`Snippet::line_start` stores an unvalidated `usize`. `SourceMap::new` then computes `line_index: line_start + idx` for every line, which overflows for large values. Verified: `Snippet::source(\"a\\nb\").line_start(usize::MAX)` panics with `attempt to add with overflow` at `src/renderer/source_map.rs:43` (and silently wraps when overflow checks are disabled, producing a line number of `0` for the second line). At the other end, `line_start(0)` is accepted and renders 0-based gutter numbers and origins such as `f.rs:0:1`, even though every other part of the API treats line numbers as 1-based (the default is `1`, and `Loc::line` is documented as \"The (1-based) line number\").","fix":"Clamp and document in the setter:\n```rust\npub fn line_start(mut self, line_start: usize) -> Self {\n    self.line_start = line_start.max(1);\n    self\n}\n```\nand use `line_start.saturating_add(idx)` in `SourceMap::new`, so an absurd `line_start` produces saturated line numbers rather than a panic or a wrapped `0`.","locations":[{"ref":"src/snippet.rs:263-268","code":"  263 |     /// When manually [`fold`][Self::fold]ing,\n  264 |     /// the [`source`][Self::source]s line offset from the original start\n  265 |     pub fn line_start(mut self, line_start: usize) -> Self {\n  266 |         self.line_start = line_start;\n  267 |         self\n  268 |     }","lines":6,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/snippet.rs#L263-L268"},{"ref":"src/renderer/source_map.rs:41-49","code":"   41 |             mapping.push(LineInfo {\n   42 |                 line,\n   43 |                 line_index: line_start + idx,\n   44 |                 start_byte: line_range.start,\n   45 |                 end_byte: line_range.end + end_line_size,\n   46 |                 end_line_size,\n   47 |             });\n {"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"`annotation.end.display - annotation.start.display` is a raw subtraction, while\n`LineAnnotation::len()` computes exactly the same quantity with `abs_diff` and an explicit comment\n(\"Account for usize underflows\"). One of the two is wrong: if the underflow the helper guards\nagainst is really possible, this line panics in debug builds and produces a gigantic `width` (which\nthen enters the trimming branch and calls `buffer.replace` with absurd columns) in release builds.","fix":"Reuse the helper that already handles this.\n\nBefore:\n```rust\nlet width = annotation.end.display - annotation.start.display;\n```\nAfter:\n```rust\nlet width = annotation.len();\n```","locations":[{"ref":"src/renderer/graphics.rs:1429-1432","code":" 1429 |         let LineAnnotationType::Singleline = annotation.annotation_type else {\n 1430 |             continue;\n 1431 |         };\n 1432 |         let width = annotation.end.display - annotation.start.display;","lines":4,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L1429-L1432"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`Margin::compute` mixes checked and unchecked arithmetic on `usize`. Lines 74 and 106 correctly use `saturating_sub`, but the two `else if` guards and the padding computations use plain `-`:\n`self.label_right - self.span_left` (twice) and `self.span_right - self.span_left` (twice). These only avoid underflow because of a non-local invariant in `render.rs`: `span_left_margin` is a `min` over `ann.start.display`/`ann.end.display` and `label_right_margin` / `span_right_margin` are `max`es over the *same* annotation set, so `span_left <= label_right` and `span_left <= span_right` happen to hold. Nothing in `margin.rs` documents or enforces that, and `new()` biases the three values in *opposite* directions (`span_left` is `-ELLIPSIS_PASSING`, the other two `+ELLIPSIS_PASSING`), which makes the invariant easy to break with any future change to how the margins are gathered - the result would be a release-mode wraparound to a near-`usize::MAX` width rather than a clean panic.","fix":"Use `saturating_sub` consistently, matching the rest of the file:\n```rust\n} else if self.label_right.saturating_sub(self.span_left) <= self.term_width {\n    let padding_left = (self.term_width - self.label_right.saturating_sub(self.span_left)) / 2;\n    ...\n} else if self.span_right.saturating_sub(self.span_left) <= self.term_width {\n    let padding_left = (self.term_width - self.span_right.saturating_sub(self.span_left)) / 5 * 2;\n```\nand add a `debug_assert!(self.span_left <= self.span_right && self.span_left <= self.label_right);` at the top of `compute` so the invariant is documented and checked.","locations":[{"ref":"src/renderer/margin.rs:83-92","code":"   83 |             } else if self.label_right - self.span_left <= self.term_width {\n   84 |                 // Attempt to fit the code window considering only the spans and labels.\n   85 |                 let padding_left = (self.term_width - (self.label_right - self.span_left)) / 2;\n   86 |                 self.computed_left = self.span_left.saturating_sub(padding_left);\n   87 |                 self.computed_right = self.computed_left + self.term_width;\n   88 |             } else if self.span_right - self.span_left <= self.term_width {\n   89 |                 // Attempt to fit the code window considering the spans and labels plus padding.\n   90 |                 let padding_left = (self.term_width - (self.span_right - self.span_left)) / 5 * 2;\n   91 |                 self.computed_left = self.span_left.saturating_sub(padding_left);\n   92 |                 self.computed_right = self.computed_left + self.term_width;","lines":10,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/margin.rs#L83-L92"},{"ref":"src/renderer/graphics.rs:678-702","code":"  678 |     // Left-most column any visible span points at.\n  679 |     let mut span_left_margin = usize::MAX;\n  680 |     for line_info in annotated_lines {\n  681 |         for ann in &line_info.annotations {\n  682 |             span_left_margin = min(span_left_margin, ann.start.display);\n  683 |             span_left_margin = min(span_left_margin, ann.end.display);\n  684 |         }\n  685 |     }\n  686 |     if span_left_margin == usize::MAX {\n  687 |         span_left_margin = 0;\n  688 |     }\n  689 | \n  690 |     // Right-most column any visible span points at.\n  691 |     let mut span_right_margin = 0;\n  692 |     let mut label_right_margin = 0;\n  693 |     let mut max_line_len = 0;\n  694 |     for line_info in annotated_lines {\n  695 |         max_line_len = max(max_line_len, str_width(line_info.line));\n  696 |         for ann in &line_info.annotations {\n  697 |             span_right_margin = max(span_right_margin, ann.start.display);\n  698 |             span_right_margin = max(span_right_margin, ann.end.display);\n  699 |             // FIXME: account for labels not in the same line\n  700 |             let label_right = ann.label.as_ref().map_or(0, |l| str_width(l) + 1);\n  701 |             label_right_margin = max(label_right_margin, ann.end.display + label_right);\n  702 |         }","lines":25,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L678-L702"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`span_to_lines` uses `if end < line_info.start_byte { break; }` to decide where the span stops. Because `end` is *exclusive*, a span that ends exactly at the first byte of the next line (i.e. a span that includes a trailing `\\n`) satisfies `end == line_info.start_byte`, so the following, completely untouched line is included in the result. `render.rs` feeds this list into `draw_code_line` as `file_lines`, where every element but the last is emitted as a `N - <line>` removal row, so an unrelated line is rendered as deleted. Verified against the built crate:\n```rust\nSnippet::source(\"aaa\\nbbb\\nccc\\n\").patch(Patch::new(0..4, \"xxx\\n\"))\n```\nrenders\n```\n1 - aaa\n2 - bbb      <-- line 2 is not touched by the patch\n1 + xxx\n```","fix":"Treat `end` as exclusive while still allowing empty spans to select their own line:\n```rust\n// before\nif end < line_info.start_byte {\n    break;\n}\n// after\nif end <= line_info.start_byte && end != start {\n    break;\n}\n```\n(the `end != start` guard preserves the current behaviour for degenerate `n..n` spans, which must still map to the line beginning at `n`).","locations":[{"ref":"src/renderer/source_map.rs:123-142","code":"  123 |     pub(crate) fn span_to_lines(&self, span: Range<usize>) -> Vec<&LineInfo<'a>> {\n  124 |         let mut lines = vec![];\n  125 |         let start = span.start;\n  126 |         let end = span.end;\n  127 |         for line_info in &self.lines {\n  128 |             if start >= line_info.end_byte {\n  129 |                 continue;\n  130 |             }\n  131 |             if end < line_info.start_byte {\n  132 |                 break;\n  133 |             }\n  134 |             lines.push(line_info);\n  135 |         }\n  136 | \n  137 |         if lines.is_empty() && !self.lines.is_empty() {\n  138 |             lines.push(self.lines.last().unwrap());\n  139 |         }\n  140 | \n  141 |         lines\n  142 |     }","lines":20,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/source_map.rs#L123-L142"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `render_source_line`, the \"short start\" optimisation (rendering `2 | / fn foo() {` instead of the `|  _^` two-line form) tests whether the code preceding a `MultilineStart` is all whitespace with `source_string.chars().take(ann.start.display).all(char::is_whitespace)`. `Iterator::take` counts **chars**, but `ann.start.display` is a **display column** (see `Loc::display`, computed with `char_width` in `SourceMap::span_to_locations`). For any line whose leading run contains non-single-width characters the two differ, and the check inspects the wrong slice of the line.\n\nVerified: with `\\u{3000}\\u{3000}fn foo() {` (two ideographic spaces, each `char_width == 2`), `ann.start.char == 2` but `ann.start.display == 4`, so `take(4)` also pulls in `f` and `o`, the check fails and the compact form is lost:\n\n```text\n1 |   　　fn foo() {          (buggy: falls back to the verbose form)\n  |  _____^\n2 | | 　　}\n  | |_____^ here\n```\n\nwhereas the ASCII-indented equivalent correctly renders `1 | /     fn foo() {`.","fix":"Consume `source_string` by accumulated display width rather than by char count, since `source_string` is the *normalized* line (tabs already expanded) and `ann.start.display` is a display column:\n\n```rust\nlet mut consumed = 0;\nlet leading_is_blank = source_string\n    .chars()\n    .take_while(|c| {\n        let keep = consumed < ann.start.display;\n        consumed += char_width(*c);\n        keep\n    })\n    .all(char::is_whitespace);\nif leading_is_blank {\n```\n\n`char_width` is already available in this module.","locations":[{"ref":"src/renderer/graphics.rs:933-953","code":"  933 |     for ann in &line_info.annotations {\n  934 |         if let LineAnnotationType::MultilineStart(depth) = ann.annotation_type {\n  935 |             if source_string\n  936 |                 .chars()\n  937 |                 .take(ann.start.display)\n  938 |                 .all(char::is_whitespace)\n  939 |             {\n  940 |                 let uline = renderer.decor_style.underline(ann.is_primary());\n  941 |                 let chr = uline.multiline_whole_line;\n  942 |                 annotations.push((depth, uline.style));\n  943 |                 buffer_ops.push((line_offset, width_offset + depth - 1, chr, uline.style));\n  944 |             } else {\n  945 |                 short_start = false;\n  946 |                 break;\n  947 |             }\n  948 |         } else if let LineAnnotationType::MultilineLine(_) = ann.annotation_type {\n  949 |         } else {\n  950 |             short_start = false;\n  951 |             break;\n  952 |         }\n  953 |     }","lines":21,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L933-L953"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"The label padding used to decide whether two labels can share a line is computed from the label's\n*byte* length (`label.len() + 2`) instead of its display width, while everything it is compared\nagainst (`start.display`, `end.display` inside `overlaps`) is measured in display columns. Any\nnon-ASCII label is treated as wider than it is, so labels are pushed onto extra lines for no reason.\nVerified: two annotations with an 11-character label render on one line with `\"aaaaaaaaaaa\"` but the\nlabel is moved to its own line (plus a vertical bar row) with the equally wide `\"ééééééééééé\"`.","fix":"Use the display width helper that the rest of the file uses.\n\nBefore:\n```rust\nlet l = next.label.as_ref().map_or(0, |label| label.len() + 2);\n```\nAfter:\n```rust\nlet l = next.label.as_ref().map_or(0, |label| str_width(label) + 2);\n```","locations":[{"ref":"src/renderer/graphics.rs:1091-1094","code":" 1091 |         for (j, next) in annotations.iter().enumerate() {\n 1092 |             if j > i {\n 1093 |                 let l = next.label.as_ref().map_or(0, |label| label.len() + 2);\n 1094 |                 if (overlaps(next, annotation, l) // Do not allow two labels to be in the same","lines":4,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L1091-L1094"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The `highlight_source` arm styles the source row with *char* offsets (`annotation.start.char`,\n`annotation.end.char`) but subtracts `left`, which is the number of *display columns* trimmed off\nthe left of the line by `draw_line`/`Margin`. The two units only agree for lines made of\nsingle-width characters. When a left-trimmed line contains wide characters, `start.char - left`\nunderflows (saturating to `0`) or lands on the wrong cell, and the source highlight is applied to\nthe wrong text or dropped entirely.\n\nVerified with `Renderer::styled().term_width(60)` on a line of 60 `日` followed by `abcde`\nannotated with `.highlight_source(true)`: the ASCII control line emits the highlight escape around\n`abcde`, while the wide-character line emits no source highlight at all (the `^^^^^` underline row,\nwhich correctly uses `.display`, is still aligned).","fix":"`left` must be converted to a char count before being subtracted from a char index (or `draw_line`\nshould return both the display and char amount it skipped). For example, have `draw_line` return\n`(left_display, left_chars)` and use `left_chars` here while continuing to use `left_display` for\nthe underline/label rows that are drawn with `annotation.*.display`.","locations":[{"ref":"src/renderer/graphics.rs:1210-1218","code":" 1210 |             _ if annotation.highlight_source => {\n 1211 |                 buffer.set_style_range(\n 1212 |                     line_offset,\n 1213 |                     (code_offset + annotation.start.char).saturating_sub(left),\n 1214 |                     (code_offset + annotation.end.char).saturating_sub(left),\n 1215 |                     underline.style,\n 1216 |                     annotation.is_primary(),\n 1217 |                 );\n 1218 |             }","lines":9,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a {"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`overlap` is built while iterating `annotations` (sorted by `Reverse((start.display, start.char))`)\nand `annotations_position` is pushed in that same order, but `annotations_position` is then re-sorted\nby `(Reverse(ann.len()), ann.is_primary())`. The long-span trimming loop afterwards indexes\n`overlap[i]` with `i` being the position in the *re-sorted* `annotations_position`, so the flag that\nis consulted belongs to a completely different annotation. With three or more annotations on a line\nthe trimming decision is effectively random: an overlapping long span can be trimmed (corrupting the\nlayout of the annotations that overlap it) while a safe one is skipped.","fix":"Do not carry a parallel index-keyed `Vec<bool>` across a re-sort. Either store the flag on the tuple,\ne.g. make `annotations_position` a `Vec<(usize, bool, &LineAnnotation<'_>)>` (position, overlaps,\nannotation) so it travels with the annotation through `sort_by_key`, or compute the overlap test\non demand inside the trimming loop:\n```rust\nlet overlaps_other = annotations\n    .iter()\n    .any(|other| !core::ptr::eq(other, *annotation) && overlaps(other, annotation, 0));\nif overlaps_other {\n    continue;\n}\n```","locations":[{"ref":"src/renderer/graphics.rs:1347-1350","code":" 1347 |     annotations_position.sort_by_key(|(_, ann)| {\n 1348 |         // Decreasing order. When annotations share the same length, prefer `Primary`.\n 1349 |         (Reverse(ann.len()), ann.is_primary())\n 1350 |     });","lines":4,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L1347-L1350"},{"ref":"src/renderer/graphics.rs:1424-1428","code":" 1424 |     for (i, (_pos, annotation)) in annotations_position.iter().enumerate() {\n 1425 |         // Skip cases where multiple spans overlap eachother.\n 1426 |         if overlap[i] {\n 1427 |             continue;\n 1428 |         };","lines":5,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L1424-L1428"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`SubstitutionHighlight` spans are char/column based (see the `SplicedLines` doc comment, \"Char spans\nto highlight per line of the post-substitution output\", and `style_substitution_highlights`, which\nadds them straight to buffer columns), but this guard compares `end` against `line_to_add.len()`,\nwhich is a *byte* length. For any wholly-new suggestion line containing a multi-byte character or a\ntab the guard fails and the line is prefixed with the replacement marker `~ ` instead of the\naddition marker `+ `.\n\nVerified: inserting `\"    a();\\n    b();\\n\"` renders both lines with `+`; inserting\n`\"    ä();\\n    b();\\n\"` renders the first line with `~` and the second with `+`. A leading tab\nbehaves the same way (`end` counts a tab as 4, `len()` as 1).","fix":"Compare against the char count.\n\nBefore:\n```rust\n[SubstitutionHighlight { start: 0, end }] if *end == line_to_add.len() => {\n```\nAfter:\n```rust\n[SubstitutionHighlight { start: 0, end }] if *end == line_to_add.chars().count() => {\n```\n(Tabs still need the same 4-column expansion that `splice_lines` applies when it builds `end`;\nusing `str_width(line_to_add)` would cover both.)","locations":[{"ref":"src/renderer/graphics.rs:1914-1917","code":" 1914 |         match &highlight_parts {\n 1915 |             [SubstitutionHighlight { start: 0, end }] if *end == line_to_add.len() => {\n 1916 |                 buffer.puts(*row_num, max_line_num_len + 1, \"+ \", ElementStyle::Addition);\n 1917 |             }","lines":4,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L1914-L1917"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`draw_code_line` calls `style_substitution_highlights` with `ElementStyle::Addition` unconditionally at the\nend of the function, even on the code paths where no `+` (addition) row was emitted at all. In the\n`DisplaySuggestion::Diff` branch, when the post-substitution line is only whitespace the code does\n`*row_num -= 1` (line 1821) and deliberately skips drawing the `+` row; `*row_num` then points at the\nalready-drawn `-` (removal) row, and the addition highlights are painted onto that row with\n`overwrite = true`, overriding the `Removal` style. The same happens for the collapse case at line 1781\n(`*row_num -= 2`).\nVerified: source `\"fn f() {\\n    .await\\n}\\n\"` with `Patch::new(at..at+6, \"  \")` (replacing `.await` with\ntwo spaces) renders `2 - .await` where `.a` is painted green (`Addition`, `\\u{1b}[92m`) and only `wait`\nstays red, because the addition highlight `4..6` of the whitespace-only replacement lands on the removal\nrow.","fix":"Only style addition highlights when an addition row was actually written. Track that in the `Diff`\nbranch (e.g. a `let mut wrote_addition_row = true;` set to `false` in the\n`if line_to_add.trim().is_empty()` arm and in the `last_line.line == line_to_add` collapse arm) and guard\nthe trailing call:\n```rust\nif wrote_addition_row {\n    style_substitution_highlights(\n        highlight_parts,\n        ElementStyle::Addition,\n        *row_num,\n        line_to_add,\n        max_line_num_len,\n        buffer,\n    );\n}\n```","locations":[{"ref":"src/renderer/graphics.rs:1971-1978","code":" 1971 |     style_substitution_highlights(\n 1972 |         highlight_parts,\n 1973 |         ElementStyle::Addition,\n 1974 |         *row_num,\n 1975 |         line_to_add,\n 1976 |         max_line_num_len,\n 1977 |         buffer,\n 1978 |     );","lines":8,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L1971-L1978"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`style_substitution_highlights` applies a tab correction that double-counts tabs that are *inside* the\nhighlighted range for the *addition* highlights. The two highlight arrays it is called with use two\ndifferent coordinate systems: the \"replaced\" highlights (`replaced_highlights`, built in\n`SourceMap::splice_lines`) hold plain char offsets (`cur_lo.char`/`cur_hi.char`), while the \"addition\"\nhighlights (`highlights`) hold offsets whose *length* is already tab-expanded, because\n`splice_lines` computes `len` with `.map(|c| match c { '\\t' => 4, _ => 1 })`.\n`style_substitution_highlights` unconditionally adds `extra_width_from_tabs(...)` (3 per tab) to both\n`start` and `end`, so for an addition containing a tab the styled range is 3 columns too wide per tab.\nThe same mismatch makes `extra_width_from_tabs(unnormalized_line, end)` wrong in a second way: it does\n`s.chars().take(n)`, i.e. it treats `n` as a *char* count, but `end` is a tab-expanded display offset,\nso it can also scan past the real character position.\nVerified: rendering `Patch::new(12..12, \"\\tabc\")` against `\"fn main() {\\nlet x = 1;\\n}\\n\"` produces\n`2 |     abclet x = 1;` where the green `Addition` style covers `    abclet` (10 columns) instead of the\n7 columns actually inserted - the following source text `let` is wrongly painted as added code.","fix":"Make both highlight arrays use the same coordinate system. Cleanest: drop the `'\\t' => 4` expansion in\n`SourceMap::splice_lines` so `SubstitutionHighlight::start`/`end` are always plain char offsets, and let\n`extra_width_from_tabs` be the single place that converts to display columns. If that is too invasive,\npass a flag to `style_substitution_highlights` and skip the `extra_width_*` adjustment for the\nalready-expanded addition highlights, e.g.\n```rust\nlet (extra_width_start, extra_width_end) = if tab_expanded {\n    (0, 0)\n} else {\n    (\n        extra_width_from_tabs(unnormalized_line, start),\n        extra_width_from_tabs(unnormalized_line, end),\n    )\n};\n```","locations":[{"ref":"src/renderer/graphics.rs:1991-2005","code":" 1991 |     for &SubstitutionHighlight { start, end } in highlight_parts {\n 1992 |         // This is a no-op for empty ranges\n 1993 |         if start != end {\n 1994 |             // We calculate the extra width from tabs for both the start and end\n 1995 |             // of the span, as tabs could be present in the middle of the span\n 1996 |             let extra_width_start: usize = extra_width_from_tabs(unnormalized_line, start);\n 1997 |             let extra_width_end: usize = extra_width_from_tabs(unnormalized_line, end);\n 1998 |             buffer.set_style_range(\n 1999 |                 row_num,\n 2000 |                 max_line_num_len + 3 + start + extra_width_start,\n 2001 |                 max_line_num_len + 3 + end + extra_width_end,\n 2002 |                 style,\n 2003 |                 true,\n 2004 |             );\n 2005 |         }","lines":15,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L1991-L2005"},{"ref":"src/renderer/graphics.rs:2329-2333","code":" 2329 | /// Count extra display columns from tabs in the first `n` chars of `s`.\n 2330 | /// Each tab is displayed as 4 spaces, so the extra width per tab is 3.\n 2331 | fn extra_width_from_tabs(s: &str, n: usize) -> usize {\n 2332 |     s.chars().take(n).filter(|&ch| ch == '\\t').count() * 3\n 2333 | }","lines":5,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L2329-L2333"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`Margin::compute` silently abandons the terminal-width guarantee whenever a single span is wider than `term_width`. When none of the first three branches match, the final `else` sets `computed_left = self.span_left` / `computed_right = self.span_right`, and `right()` then returns `min(line_len, self.computed_right)`, so the rendered window is `span_right - span_left` columns wide - which is `(real span width) + 2 * ELLIPSIS_PASSING` and is completely unbounded by `term_width`. The middle-trimming pass in `render.rs` only kicks in when `width > margin.term_width * 2`, so there is a dead zone for spans in `(term_width, 2 * term_width]` where nothing clamps the output at all.\n\nVerified: source line `\"z\".repeat(40) + \" tail\".repeat(3)` (55 columns) with one `AnnotationKind::Primary.span(0..40).label(\"A\")` rendered with `Renderer::plain().term_width(30)` produces a widest output line of **50 columns**:\n```text\n1 | zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz ta...\n  | ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^ A\n```\nParadoxically `term_width(20)` yields only 23 columns (because there the `> term_width * 2` middle-trim path is taken), so the overflow is non-monotonic in `term_width`.","fix":"Clamp the give-up branch to the terminal width instead of the raw span extent, e.g. keep `computed_left = self.span_left` but set `self.computed_right = self.computed_left + max(self.term_width, MIN_WINDOW)`, and let the middle-trimming pass in `render.rs` insert the `...` for the elided centre. Alternatively make `right()` clamp unconditionally:\n```rust\npub(crate) fn right(&self, line_len: usize) -> usize {\n    min(line_len, max(self.computed_right, self.computed_left + self.term_width))\n}\n```\nand lower the middle-trim trigger in `render.rs` from `width > margin.term_width * 2` to `width > margin.term_width` so spans in the dead zone are actually trimmed.","locations":[{"ref":"src/renderer/margin.rs:93-97","code":"   93 |             } else {\n   94 |                 // Mostly give up but still don't show the full line.\n   95 |                 self.computed_left = self.span_left;\n   96 |                 self.computed_right = self.span_right;\n   97 |             }","lines":5,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/margin.rs#L93-L97"},{"ref":"src/renderer/margin.rs:105-111","code":"  105 |     pub(crate) fn right(&self, line_len: usize) -> usize {\n  106 |         if line_len.saturating_sub(self.computed_left) <= self.term_width {\n  107 |             line_len\n  108 |         } else {\n  109 |             min(line_len, self.computed_right)\n  110 |         }\n  111 |     }","lines":7,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/margin.rs#L105-L111"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"The \"correct the char pos if we are highlighting the end of a line\" fix-up increments `start_char_pos` but leaves `start_display_pos` untouched, so the returned `Loc` has inconsistent `char` and `display` fields for the very same position. The symmetric correction for the end location (lines 111-114) correctly bumps *both* `end.char` and `end.display`. `render.rs` uses `loc.char + 1` for the `--> path:line:col` header and `loc.display` for the caret column, so the two disagree for pure-ASCII input. Verified against the built crate:\n```rust\nSnippet::source(\"ab\\r\\ncd\\r\\n\").path(\"f.rs\").annotation(AnnotationKind::Primary.span(3..3))\n```\nrenders `--> f.rs:1:4` while the caret sits at column 3, on a line that only has 2 characters. Same for `Snippet::source(\"hello\\n\")` with span `6..6`: header says `1:7`, caret is at column 6.","fix":"Keep the two fields in sync, mirroring the end-location branch:\n```rust\n// before\nif (span.start - start_info.start_byte).saturating_sub(start_info.line.len()) > 0 {\n    start_char_pos += 1;\n}\n// after\nlet mut start_display_pos = start_display_pos;\nif (span.start - start_info.start_byte).saturating_sub(start_info.line.len()) > 0 {\n    start_char_pos += 1;\n    start_display_pos += 1;\n}\n```","locations":[{"ref":"src/renderer/source_map.rs:77-86","code":"   77 |         // correct the char pos if we are highlighting the end of a line\n   78 |         if (span.start - start_info.start_byte).saturating_sub(start_info.line.len()) > 0 {\n   79 |             start_char_pos += 1;\n   80 |         }\n   81 |         let start = Loc {\n   82 |             line: start_info.line_index,\n   83 |             char: start_char_pos,\n   84 |             display: start_display_pos,\n   85 |             byte: span.start,\n   86 |         };","lines":10,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/source_map.rs#L77-L86"},{"ref":"src/renderer/source_map.rs:111-114","code":"  111 |         if start.line != end.line && end.byte > end_info.end_byte - end_info.end_line_size {\n  112 |             end.char += 1;\n  113 |             end.display += 1;\n  114 |         }","lines":4,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/source_map.rs#L111-L114"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`replaced_highlights` is sized and indexed relative to `bounding_lo`, which is derived from the **untrimmed** patch spans (`lo`/`hi` are computed at lines 423-429 from `patches`, before `trim_trivial_replacements` runs), while every write into it uses the **trimmed** spans of `trimmed_patches`. The consumer then re-derives its own base from the trimmed spans: `render.rs:1490-1493` does `parts.iter().map(|p| p.span.start).min()` over the *trimmed* parts and calls `sm.span_to_lines(lo..hi)`, and `draw_code_line` (`render.rs:1743`) zips that `file_lines` list positionally against `replaced_parts`. Whenever trimming moves the minimum start onto a later line (which `Patch::trim_trivial_replacements` does whenever the replacement has a common prefix crossing a newline), the two index bases differ and each removal row is paired with the highlight vector of a different source line.","fix":"Compute the bounding range from the same spans used to fill the table. Move the `trim_trivial_replacements` mapping above the `lo`/`hi` computation and derive `lo`/`hi` from `trimmed_patches`, so `bounding_lo` matches what `render.rs` recomputes from `parts`. Alternatively, return the bounding `Loc` alongside `replaced_highlights` in `SplicedLines` so the consumer cannot pick a different base.","locations":[{"ref":"src/renderer/source_map.rs:422-431","code":"  422 |         // Find the bounding span.\n  423 |         let (lo, hi) = if fold {\n  424 |             let lo = patches.iter().map(|p| p.span.start).min()?;\n  425 |             let hi = patches.iter().map(|p| p.span.end).max()?;\n  426 |             (lo, hi)\n  427 |         } else {\n  428 |             (0, source_len)\n  429 |         };\n  430 | \n  431 |         let lines = self.span_to_lines(lo..hi);","lines":10,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/source_map.rs#L422-L431"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`StyledBuffer::replace` uses `Vec::splice`, so it *changes the length of the line* (the replacement `string` is the `...`/`…` marker, far shorter than `start..end`). It also silently returns when the requested range no longer fits (`start > len || end > len`). The caller in `render.rs` loops over several annotations and computes every range from `annotation.start.display` / `annotation.end.display`, i.e. from columns captured *before* any splice ran. As soon as the first `replace` shortens the row, all later ranges in the same loop are stale: they either point at the wrong columns or fall out of bounds and are dropped without any signal.\n\nVerified: source `\"a\".repeat(100) + \" \" + \"b\".repeat(60)` with `AnnotationKind::Primary.span(0..100)` and `AnnotationKind::Context.span(101..161)` rendered with `Renderer::plain().term_width(30)` gives\n```text\n1 | aaaaaaaa...aaaaaaaa bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb\n  | ^^^^^^^^...^^^^^^^^ ------------------------------------------------------------ B\n```\nThe second (60-column) span is not trimmed at all - its `replace` range `73..117` exceeds the length of the row that the first splice already shortened, so `replace` no-ops. The result is an 80-column line for a `term_width(30)` renderer. Reversing the two span lengths makes it work, so the bug only shows up depending on the `sort_by_key(|(_, ann)| (Reverse(ann.len()), ann.is_primary()))` order.","fix":"Either make `replace` length-preserving (overwrite the range with the marker plus `StyledChar::SPACE` padding, or mark cells as \"elided\" and drop them in `render`), or have the caller track the cumulative column shift. The simplest correct change is to collect all `(start, end)` ranges for a row first, then apply them right-to-left so that earlier (left-hand) ranges are unaffected by later splices:\n```rust\nfor (start, end) in ranges.into_iter().rev() {\n    buffer.replace(line_offset, start, end, marker);\n    buffer.replace(line_offset + 1, start, end, marker);\n}\n```\nIndependently, `replace` should not silently swallow an out-of-range request - at minimum `debug_assert!` on it so the stale-column bug is caught in tests.","locations":[{"ref":"src/renderer/styled_buffer.rs:118-133","code":"  118 |     pub(crate) fn replace(&mut self, line: usize, start: usize, end: usize, string: &str) {\n  119 |         if start == end {\n  120 |             return;\n  121 |         }\n  122 |         // If the replacement range would be out of bounds, do nothing, as we\n  123 |         // can't replace things that don't exist.\n  124 |         if start > self.lines[line].len() || end > self.lines[line].len() {\n  125 |             return;\n  126 |         };\n  127 |         self.lines[line].splice(\n  128 |             start..end,\n  129 |             string\n  130 |                 .chars()\n  131 |                 .map(|c| StyledChar::new(c, ElementStyle::LineNumber)),\n  132 |         );\n  133 |     }","lines":16,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/styled_buffer.rs#L118-L133"},{"ref":"src/renderer/graphics.rs:1424-1454","code":" 1424 |     for (i, (_pos, annotation)) in annotations_position.iter().enumerate() {\n 1425 |         // Skip cases where multiple spans overlap eachother.\n 1426 |         if overlap[i] {\n 1427 |             continue;\n 1428 |         };\n 1429 |         let LineAnnotationType::Singleline = annotation.annotation_type else {\n 1430 |             continue;\n 1431 |         };\n 1432 |         let width = annotation.end.display - annotation.start.display;\n 1433 | \n 1434 |         static MIN_PAD: usize = 5;\n 1435 |         let margin_width = str_width(renderer.decor_style.margin());\n 1436 |         if width > margin.term_width * 2 && width > (MIN_PAD * 2 + margin_width) {\n 1437 |             // If the terminal is *too* small, we keep at least a tiny bit of the span for\n 1438 |             // display.\n 1439 |             let pad = max(margin.term_width / 3, MIN_PAD);\n 1440 |             // Code line\n 1441 |             buffer.replace(\n 1442 |                 line_offset,\n 1443 |                 code_offset + (annotation.start.display + pad).saturating_sub(left),\n 1444 |                 code_offset + (annotation.end.display - pad).saturating_sub(left),\n 1445 |                 renderer.decor_style.margin(),\n 1446 |             );\n 1447 |             // Underline line\n 1448 |             buffer.replace(\n 1449 |                 line_offset + 1,\n 1450 |                 code_offset + (annotation.start.display + pad).saturating_sub(left),\n 1451 |                 code_offset + (annotation.end.display - pad).saturating_sub(left),\n 1452 |                 renderer.decor_style.margin(),\n 1453 |             );\n 1454 |         }","lines":31,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L1424-L1454"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`Level` encodes \"hide the name\" as `name == Some(None)` and \"custom name\" as\n`name == Some(Some(s))`, but nothing rejects `Some(Some(\"\"))`. `Level::ERROR.with_name(Some(\"\"))`\ntherefore takes the *named* path in the renderer (`title.level().name != Some(None)` is true), so\nan empty string is appended followed by the unconditional `\": \"` separator, producing a title that\nbegins with a bare colon.\n\nVerified by running against the crate:\n\n```text\nRenderer::plain().render(&[Group::with_title(\n    Level::ERROR.with_name(Some(\"\")).primary_title(\"boom\"))])\n== \": boom\"\n```\n\nAn empty name is the natural way a caller expresses \"no name\" (and is what `with_name(\"\")` from a\nconfig value degenerates to), yet it produces different, malformed output compared to\n`no_name()`, which yields `\"boom\"`. `label_width` is also incremented by 2 for the phantom\nseparator, mis-aligning continuation lines.","fix":"Normalize an empty name to the \"no name\" representation in `with_name`:\n\n```rust\npub fn with_name(self, name: impl Into<OptionCow<'a>>) -> Level<'a> {\n    let name = name.into().0.filter(|n| !n.is_empty());\n    Level { name: Some(name), level: self.level }\n}\n```\n\nor make the renderer skip the label when `title.level().as_str().is_empty()` rather than only\nwhen `name == Some(None)`.","locations":[{"ref":"src/level.rs:129-139","code":"  129 |     pub(crate) fn as_str(&'a self) -> &'a str {\n  130 |         match (&self.name, self.level) {\n  131 |             (Some(Some(name)), _) => name.as_ref(),\n  132 |             (Some(None), _) => \"\",\n  133 |             (None, LevelInner::Error) => ERROR_TXT,\n  134 |             (None, LevelInner::Warning) => WARNING_TXT,\n  135 |             (None, LevelInner::Info) => INFO_TXT,\n  136 |             (None, LevelInner::Note) => NOTE_TXT,\n  137 |             (None, LevelInner::Help) => HELP_TXT,\n  138 |         }\n  139 |     }","lines":11,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/level.rs#L129-L139"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"When a `Snippet` has no `path`, `render_snippet_annotations` still emits the file-location decoration even though there is no location text to follow it, producing a dangling arrow plus trailing whitespace. For a primary pathless snippet in `DecorStyle::Unicode` it writes `\" ╭▸ \"` (line 582-587), and for a non-primary pathless snippet it writes `\"::: \"` / `\" ⸬  \"` (line 614-619). Verified output:\n\n```text\nerror: t\n --> f.rs:2:3\n  |\n2 |   let x = 1;\n  |   ^ a\n  |\n :::·                 <- \"::: \" pointing at nothing, with a trailing space\n1 | fn main() {\n  |    -- b\n```\n\nThe trailing space also means the rendered string carries trailing whitespace on those rows, which breaks `git diff --check`-style tooling on captured output.","fix":"Only draw `file_start` / `secondary_file_start` when there is a path to print. In the pathless branch emit just the column separator (`draw_col_separator_no_space`), matching what the `DecorStyle::Ascii` primary case already does at lines 588-595, and drop the `buffer.puts(... secondary_file_start() ...)` call at lines 614-619.","locations":[{"ref":"src/renderer/graphics.rs:607-650","code":"  607 |     } else {\n  608 |         let buffer_msg_line_offset = buffer.num_lines();\n  609 |         if is_primary {\n  610 |             if renderer.decor_style == DecorStyle::Unicode {\n  611 |                 buffer.puts(\n  612 |                     buffer_msg_line_offset,\n  613 |                     max_line_num_len,\n  614 |                     renderer.decor_style.file_start(is_first, false),\n  615 |                     ElementStyle::LineNumber,\n  616 |                 );\n  617 |             } else {\n  618 |                 draw_col_separator_no_space(\n  619 |                     renderer,\n  620 |                     buffer,\n  621 |                     buffer_msg_line_offset,\n  622 |                     max_line_num_len + 1,\n  623 |                 );\n  624 |             }\n  625 |         } else {\n  626 |             // Add spacing line, as shown:\n  627 |             //   --> $DIR/file:54:15\n  628 |             //    |\n  629 |             // LL |         code\n  630 |             //    |         ^^^^\n  631 |             //    | (<- It prints *this* line)\n  632 |             //   ::: $DIR/other_file.rs:15:5\n  633 |             //    |\n  634 |             // LL |     code\n  635 |             //    |     ----\n  636 |             draw_col_separator_no_space(\n  637 |                 renderer,\n  638 |                 buffer,\n  639 |                 buffer_msg_line_offset,\n  640 |                 max_line_num_len + 1,\n  641 |             );\n  642 | \n  643 |             buffer.puts(\n  644 |                 buffer_msg_line_offset + 1,\n  645 |                 max_line_num_len,\n  646 |                 renderer.decor_style.secondary_file_start(),\n  647 |                 ElementStyle::LineNumber,\n  648 |             );\n  649 |         }\n  650 |     }","lines":44,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L607-L650"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`Margin` compares four quantities against each other (`whitespace_left`, `span_left`, `span_right`,\n`label_right` at `src/renderer/margin.rs:72-92`) that are computed with **two different width\nformulas** in `render_snippet_annotations`:\n\n- `whitespace_margin` (`src/renderer/render.rs:628-647`) uses an ad-hoc inline table:\n```rust\n.map(|c| match c { '\\t' => 4, _ => 1 })\n```\n  i.e. every non-tab whitespace character counts as exactly 1 column.\n- `span_left_margin`, `span_right_margin`, `label_right_margin` (render.rs:650-674) come from\n  `ann.start.display` / `ann.end.display`, which `SourceMap::span_to_locations`\n  (`src/renderer/source_map.rs:70-76`) accumulates with `char_width`, and from `str_width` - both\n  of which honour `unicode_width` (verified: `char_width('\\u{3000}') == 2`).\n\nSo for any whitespace character wider than one column - `U+3000 IDEOGRAPHIC SPACE` is whitespace\nper `char::is_whitespace` and 2 columns wide - `whitespace_left` under-reports by a factor of two\nrelative to the columns it is compared against at margin.rs:74-83, and the resulting\n`computed_left` (margin.rs:63-67) trims the wrong number of columns.\n\nVerified with `Renderer::plain().term_width(30)` on two display-identical inputs (60 columns of\nleading whitespace before `let x = 1;`): 30x `U+3000` keeps 12 columns of whitespace after the\n`...` marker, while 60x ASCII space keeps 22.","fix":"Use the crate's own width function so all four `Margin` inputs are in display columns:\n\n```rust\nlet leading_whitespace: usize = line_info\n    .line\n    .chars()\n    .take_while(|c| c.is_whitespace())\n    .map(char_width)\n    .sum();\n```\n\nreplacing the inline `match c { '\\t' => 4, _ => 1 }` at render.rs:632-639. `char_width` already\nmaps `'\\t'` to 4 (render.rs:2302), so tab handling is preserved. Document on `Margin`'s fields that\nevery column value it receives is a display column.","locations":[{"ref":"src/renderer/graphics.rs:657-676","code":"  657 |     for line_info in annotated_lines {\n  658 |         let leading_whitespace = line_info\n  659 |             .line\n  660 |             .chars()\n  661 |             .take_while(|c| c.is_whitespace())\n  662 |             .map(|c| {\n  663 |                 match c {\n  664 |                     // Tabs are displayed as 4 spaces\n  665 |                     '\\t' => 4,\n  666 |                     _ => 1,\n  667 |                 }\n  668 |             })\n  669 |             .sum();\n  670 |         if line_info.line.chars().any(|c| !c.is_whitespace()) {\n  671 |             whitespace_margin = min(whitespace_margin, leading_whitespace);\n  672 |         }\n  673 |     }\n  674 |     if whitespace_margin == usize::MAX {\n  675 |         whitespace_margin = 0;\n  676 |     }","lines":20,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L657-L676"},{"ref":"src/renderer/margin.rs:61-98","code":"   61 |     fn compute(&mut self, max_line_len: usize) {\n   62 |         // When there's a lot of whitespace (>20), we want to trim it as it is useless.\n   63 |         self.computed_left = if self.whitespace_left > LONG_WHITESPACE {\n   64 |             self.whitespace_left - (LONG_WHITESPACE - LONG_WHITESPACE_PADDING) // We want some padding.\n   65 |         } else {\n   66 |             0\n   67 |         };\n   68 |         // We want to show as much as possible, max_line_len is the right-most boundary for the\n   69 |         // relevant code.\n   70 |         self.computed_right = max(max_line_len, self.computed_left);\n   71 | \n   72 |         if self.computed_right - self.computed_left > self.term_width {\n   73 |             // Trimming only whitespace isn't enough, let's get craftier.\n   74 |             if self.label_right.saturating_sub(self.whitespace_left) <= self.term_width\n   75 |                 // Trimming whitespace when the right-most label is somewhrere\n   76 |                 // within it would result in the label pointing to the wrong\n   77 |                 // place\n   78 |                 && self.label_right >= self.whitespace_left\n   79 |             {\n   80 |                 // Attempt to fit the code window only trimming whitespace.\n   81 |                 self.computed_left = self.whitespace_left;\n   82 |                 self.computed_right = self.computed_left + self.term_width;\n   83 |             } else if self.label_right - self.span_left <= self.term_width {\n   84 |                 // Attempt to fit the code window considering only the spans and labels.\n   85 |                 let padding_left = (self.term_width - (self.label_right - self.span_left)) / 2;\n   86 |                 self.computed_left = self.span_left.saturating_sub(padding_left);\n   87 |                 self.computed_right = self.computed_left + self.term_width;\n   88 |             } else if self.span_right - self.span_left <= self.term_width {\n   89 |                 // Attempt to fit the code window considering the spans and labels plus padding.\n   90 |                 let padding_left = (self.term_width - (self.span_right - self.span_left)) / 5 * 2;\n   91 |                 self.computed_left = self.span_left.saturating_sub(padding_left);\n   92 |                 self.computed_right = self.computed_left + self.term_width;\n   93 |             } else {\n   94 |                 // Mostly give up but still don't show the full line.\n   95 |                 self.computed_left = self.span_left;\n   96 |                 self.computed_right = self.span_right;\n   97 |             }\n   98 |         }","lines":38,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/margin.rs#L61-L98"},{"ref":"src/renderer/source_map.rs:70-76","code":"   70 |         let (mut start_char_pos, start_display_pos) = start_info.line\n   71 |             [0..(span.start - start_info.start_byte).min(start_info.line.len())]\n   72 |             .chars()\n   73 |             .fold((0, 0), |(char_pos, byte_pos), c| {\n   74 |                 let display = char_width(c);\n   75 |                 (char_pos + 1, byte_pos + display)\n   76 |             });","lines":7,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/source_map.rs#L70-L76"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The `span_left_margin` loop takes the `min` over `ann.start.display` / `ann.end.display` of *every* annotation on every line, including `LineAnnotationType::MultilineLine` placeholders. Those placeholders are built by `MultilineAnnotation::as_line()` (`src/renderer/source_map.rs:618-627`) with `start: Loc::default()` and `end: Loc::default()`, i.e. column `0`. Consequently any snippet that contains a multiline span long enough to emit `MultilineLine` bridge rows forces `span_left_margin == 0`, which then feeds `Margin::span_left = 0` and defeats the span-based horizontal trimming heuristics in `Margin::compute`. The comment on line 649 (\"Left-most column any visible span points at\") no longer describes what the code computes.","fix":"Skip placeholder annotations when computing the margin, e.g.:\n\n```rust\nfor ann in line_info.annotations.iter().filter(|a| !a.is_line()) {\n    span_left_margin = min(span_left_margin, ann.start.display);\n    span_left_margin = min(span_left_margin, ann.end.display);\n}\n```\n\n`LineAnnotation::is_line` already exists for exactly this predicate.","locations":[{"ref":"src/renderer/graphics.rs:678-688","code":"  678 |     // Left-most column any visible span points at.\n  679 |     let mut span_left_margin = usize::MAX;\n  680 |     for line_info in annotated_lines {\n  681 |         for ann in &line_info.annotations {\n  682 |             span_left_margin = min(span_left_margin, ann.start.display);\n  683 |             span_left_margin = min(span_left_margin, ann.end.display);\n  684 |         }\n  685 |     }\n  686 |     if span_left_margin == usize::MAX {\n  687 |         span_left_margin = 0;\n  688 |     }","lines":11,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L678-L688"}]},
