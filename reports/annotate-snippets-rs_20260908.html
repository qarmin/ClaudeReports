{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The long-span trimming loop calls `buffer.replace(...)`, which is implemented with\n`Vec::splice` and therefore *shifts* every cell after the replaced range to the left. All the\ncolumn arithmetic in the loop (`code_offset + (annotation.start.display + pad) - left`) is computed\nagainst the original, unshifted coordinates, so the second and later iterations address the wrong\ncells. Because `StyledBuffer::replace` silently does nothing when the range no longer fits\n(`start > line.len() || end > line.len()`), the usual outcome is that only the first long span is\ntrimmed and the feature silently gives up on the rest.\n\nVerified: an 800-column line with `0..340` (\"A\") and `400..700` (\"B\") at `term_width(140)` trims A\nbut leaves B completely untrimmed, producing a 463-column-wide rendering - far past the terminal\nwidth the trimming exists to respect.","fix":"Track the accumulated shift while iterating (each `replace` shrinks the row by\n`(end - start) - str_width(margin)` cells) and offset subsequent `buffer.replace` ranges by it, or\ncollect all the ranges first and apply them right-to-left so earlier ranges are still valid.","locations":[{"ref":"src/renderer/graphics.rs:1424-1454","code":" 1424 |     for (i, (_pos, annotation)) in annotations_position.iter().enumerate() {\n 1425 |         // Skip cases where multiple spans overlap eachother.\n 1426 |         if overlap[i] {\n 1427 |             continue;\n 1428 |         };\n 1429 |         let LineAnnotationType::Singleline = annotation.annotation_type else {\n 1430 |             continue;\n 1431 |         };\n 1432 |         let width = annotation.end.display - annotation.start.display;\n 1433 | \n 1434 |         static MIN_PAD: usize = 5;\n 1435 |         let margin_width = str_width(renderer.decor_style.margin());\n 1436 |         if width > margin.term_width * 2 && width > (MIN_PAD * 2 + margin_width) {\n 1437 |             // If the terminal is *too* small, we keep at least a tiny bit of the span for\n 1438 |             // display.\n 1439 |             let pad = max(margin.term_width / 3, MIN_PAD);\n 1440 |             // Code line\n 1441 |             buffer.replace(\n 1442 |                 line_offset,\n 1443 |                 code_offset + (annotation.start.display + pad).saturating_sub(left),\n 1444 |                 code_offset + (annotation.end.display - pad).saturating_sub(left),\n 1445 |                 renderer.decor_style.margin(),\n 1446 |             );\n 1447 |             // Underline line\n 1448 |             buffer.replace(\n 1449 |                 line_offset + 1,\n 1450 |                 code_offset + (annotation.start.display + pad).saturating_sub(left),\n 1451 |                 code_offset + (annotation.end.display - pad).saturating_sub(left),\n 1452 |                 renderer.decor_style.margin(),\n 1453 |             );\n 1454 |         }","lines":31,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L1424-L1454"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`StyledBuffer::render` initialises `current_style` to `stylesheet.none` but never emits the escape sequence for it. Consequently (a) `ElementStyle::NoStyle` / `Quotation` / `LineAndColumn` text that appears at the *start* of a buffer line is written with no escape at all, so a user-configured `Renderer::none(style)` is not applied there, while the very same `ElementStyle` later on the line does get the style; and (b) as soon as the first character has a different style, `write!(str, \"{current_style:#}\")` emits a stray reset before anything has been written.\n\nVerified with `Renderer::plain().none(anstyle::AnsiColor::Magenta.on_default())`, whose output begins with a reset and leaves the leading `NoStyle` run unstyled while a later `NoStyle` run is magenta. The `if !line.is_empty()` guard on the reset is vacuous (see the separate dead-code finding), so it does not prevent this.","fix":"Track whether anything has been emitted on the current line and write the initial style explicitly:\n```rust\nfor (i, line) in self.lines.iter().enumerate() {\n    let mut current_style = stylesheet.none;\n    let mut started = false;\n    for StyledChar { ch, style } in line {\n        let ch_style = style.color_spec(level, stylesheet);\n        if !started || ch_style != current_style {\n            if started {\n                write!(str, \"{current_style:#}\")?;\n            }\n            current_style = ch_style;\n            write!(str, \"{current_style}\")?;\n            started = true;\n        }\n        str.push(*ch);\n    }\n    if started {\n        write!(str, \"{current_style:#}\")?;\n    }\n    ...\n}\n```","locations":[{"ref":"src/renderer/styled_buffer.rs:52-68","code":"   52 |         for (i, line) in self.lines.iter().enumerate() {\n   53 |             let mut current_style = stylesheet.none;\n   54 |             for StyledChar { ch, style } in line {\n   55 |                 let ch_style = style.color_spec(level, stylesheet);\n   56 |                 if ch_style != current_style {\n   57 |                     if !line.is_empty() {\n   58 |                         write!(str, \"{current_style:#}\")?;\n   59 |                     }\n   60 |                     current_style = ch_style;\n   61 |                     write!(str, \"{current_style}\")?;\n   62 |                 }\n   63 |                 str.push(*ch);\n   64 |             }\n   65 |             write!(str, \"{current_style:#}\")?;\n   66 |             if i != self.lines.len() - 1 {\n   67 |                 str.push('\\n');\n   68 |             }","lines":17,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/styled_buffer.rs#L52-L68"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"The overlap-detection loop compares `j` against the literal `1` instead of against the outer index\n`i`: `if overlaps(next, annotation, 0) && j > 1`. This has two consequences:\n\n1. Genuine overlaps between annotation pairs with `j <= 1` are never recorded, so `overlap[]` stays\n   `false` and the \"skip long-span trimming when spans overlap\" guard at line 1393 does not fire.\n2. When `i == j`, `overlaps(annotation, annotation, 0)` is trivially `true` for any non-empty span,\n   so *every* annotation with index `>= 2` is unconditionally marked as overlapping itself.\n\nVerified repro (two annotations on one very long line, the short one nested inside the long one):\n```rust\nSnippet::source(&source).path(\"f.rs\")\n    .annotation(AnnotationKind::Primary.span(12..312).label(\"long\"))\n    .annotation(AnnotationKind::Context.span(112..117).label(\"small\"))\n```\nrenders as\n```text\n2 | xxxxxxxxxxxxxxxxxxxxxxxxxxxxx...xxxxxxxxxxxxxxxxxxxxxxxxxxxxx...\n  | ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^...^^^^^^^^^^^^^^^^^^^^^^^^^^^^^\n  | |                                                                    |\n  | |                                                                    small\n  | long\n```\nThe middle of the long span is elided even though `small` overlaps it, leaving `small`'s vertical\nbar and label dangling ~100 columns past the end of the (now shortened) underline row.","fix":"Compare the two loop indices instead of a constant, and skip the self-comparison:\n```rust\nfor (j, next) in annotations.iter().enumerate() {\n    if i != j && overlaps(next, annotation, 0) {\n        overlap[i] = true;\n        overlap[j] = true;\n    }\n```","locations":[{"ref":"src/renderer/graphics.rs:1062-1067","code":" 1062 |     for (i, annotation) in annotations.iter().enumerate() {\n 1063 |         for (j, next) in annotations.iter().enumerate() {\n 1064 |             if overlaps(next, annotation, 0) && j > 1 {\n 1065 |                 overlap[i] = true;\n 1066 |                 overlap[j] = true;\n 1067 |             }","lines":6,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L1062-L1067"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`StyledBuffer::render` returns `Result<(), fmt::Error>` even though its only sink is a `&mut String`, whose `core::fmt::Write` impl is infallible (it can only abort on allocation failure). The `?` operators therefore propagate an error that can never occur, and the chain ends at `render::render`, which resolves it with `render_short_message(renderer, groups).unwrap()`. This is an `unwrap()` on a value the type system says can fail but the implementation says cannot - either it is dead error handling or it is a latent panic, and a reader cannot tell which.","fix":"Make the signature infallible and drop the `?`/`unwrap()` chain: change the return type to `()`, replace `write!(str, \"{current_style:#}\")?` with `let _ = write!(str, \"{current_style:#}\");` (or push the rendered escape via `str.push_str`), and remove the corresponding `?`/`.unwrap()` at the call sites in `render.rs`.","locations":[{"ref":"src/renderer/styled_buffer.rs:43-71","code":"   43 |     pub(crate) fn render(\n   44 |         &self,\n   45 |         level: &Level<'_>,\n   46 |         stylesheet: &Stylesheet,\n   47 |         str: &mut String,\n   48 |     ) -> Result<(), fmt::Error> {\n   49 |         let capacity = self.lines.iter().map(|line| line.len()).sum();\n   50 |         str.reserve(capacity);\n   51 | \n   52 |         for (i, line) in self.lines.iter().enumerate() {\n   53 |             let mut current_style = stylesheet.none;\n   54 |             for StyledChar { ch, style } in line {\n   55 |                 let ch_style = style.color_spec(level, stylesheet);\n   56 |                 if ch_style != current_style {\n   57 |                     if !line.is_empty() {\n   58 |                         write!(str, \"{current_style:#}\")?;\n   59 |                     }\n   60 |                     current_style = ch_style;\n   61 |                     write!(str, \"{current_style}\")?;\n   62 |                 }\n   63 |                 str.push(*ch);\n   64 |             }\n   65 |             write!(str, \"{current_style:#}\")?;\n   66 |             if i != self.lines.len() - 1 {\n   67 |                 str.push('\\n');\n   68 |             }\n   69 |         }\n   70 |         Ok(())\n   71 |     }","lines":29,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/styled_buffer.rs#L43-L71"},{"ref":"src/renderer/graphics.rs:31-33","code":"   31 |     if renderer.short_message {\n   32 |         render_short_message(renderer, groups).unwrap()\n   33 |     } else {","lines":3,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L31-L33"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"negligible","difficulty":"very_easy","description":"`StyledBuffer::render` returns `Result<(), fmt::Error>` only because it uses `write!` into a `String`, which cannot fail. Both call sites in `render` swallow that with `.unwrap()`, which means a future change to `StyledBuffer::render` that can genuinely fail would silently turn into a panic in a library that otherwise returns a `String`.","fix":"Make `StyledBuffer::render` and `render_short_message` infallible (drop the `Result`, since `String: fmt::Write` never errors) so the `.unwrap()`s disappear:\n\n```rust\npub(crate) fn render(&self, level: &Level<'_>, stylesheet: &Stylesheet, str: &mut String) { ... }\n```","locations":[{"ref":"src/renderer/graphics.rs:30-32","code":"   30 | pub(crate) fn render(renderer: &Renderer, groups: Report<'_>) -> String {\n   31 |     if renderer.short_message {\n   32 |         render_short_message(renderer, groups).unwrap()","lines":3,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L30-L32"},{"ref":"src/renderer/graphics.rs:230-232","code":"  230 |         buffer\n  231 |             .render(&level, &renderer.stylesheet, &mut out_string)\n  232 |             .unwrap();","lines":3,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L230-L232"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"medium","description":"`Title::id_url` is the only text-taking builder in this file with no \"untrusted input\" warning, and its value is the most dangerous one: `render_title` embeds it raw inside an OSC 8 hyperlink escape, `format!(\"\\x1B]8;;{url}\\x1B\\\\\")`. Neither normalization nor escaping is applied, and the sequence is emitted even by `Renderer::plain()`, which callers reasonably expect to be escape-free. Verified: `Level::ERROR.primary_title(\"t\").id(\"E0308\").id_url(\"https://x/\\u{1b}\\\\\\u{1b}]0;pwned\\u{7}\")` renders, under `Renderer::plain()`, `error[\\u{1b}]8;;https://x/\\u{1b}\\\\\\u{1b}]0;pwned\\u{7}\\u{1b}\\\\E0308...]: t` - the `\\u{1b}\\\\` inside the URL terminates the OSC string and the remainder is executed by the terminal (here, setting the window title). Any tool that forwards an externally supplied lint documentation URL into `id_url` becomes a terminal-escape-injection vector.","fix":"Reject or sanitize control characters in the URL - drop the hyperlink entirely if `url.chars().any(char::is_control)`, or percent-encode them - and only emit the OSC 8 sequence when the renderer is actually styled (gate it the same way ANSI styling is gated, so `Renderer::plain()` prints the bare `[E0308]`). Also add the same `<div class=\"warning\">` untrusted-input note that `Title::id` has.","locations":[{"ref":"src/snippet.rs:185-195","code":"  185 |     /// Provide a URL for [`Title::id`] for more information on this diagnostic\n  186 |     ///\n  187 |     /// <div class=\"warning\">\n  188 |     ///\n  189 |     /// This is only relevant if `id` is present\n  190 |     ///\n  191 |     /// <\/div>\n  192 |     pub fn id_url(mut self, url: impl Into<Cow<'a, str>>) -> Self {\n  193 |         self.id.get_or_insert(Id::default()).url = Some(url.into());\n  194 |         self\n  195 |     }","lines":11,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/snippet.rs#L185-L195"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`Level` is documented as \"Severity level for `Title`s and `Message`s\" and publicly derives\n`PartialOrd`/`Ord`, but the derived ordering is lexicographic over the *field declaration order*\n`(name, level)`, so the cosmetic `name` override dominates the actual severity:\n\n```rust\nassert!(Level::WARNING < Level::ERROR.with_name(Some(\"a\"))); // true - a warning outranks an error\nassert!(Level::ERROR   < Level::WARNING);                    // true - ERROR is the *minimum*\nassert!(Level::ERROR   < Level::HELP);                       // true - HELP is the *maximum*\n```\n\n(all three verified by running against the crate). Two problems compound:\n\n1. Because `name: Option<Option<Cow<'a, str>>>` is compared first and `None < Some(_)`, *any*\n   level carrying a custom name sorts above *every* default level regardless of `LevelInner`.\n2. Even for default levels the direction is the opposite of the intuitive one -\n   `LevelInner::Error` is declared first so it is the smallest; a user calling\n   `.iter().max()` to find the most severe diagnostic gets `Level::HELP`.\n\nNeither the `Ord` direction nor the name-first tie-break is documented. The derive is unused\ninside the crate (`grep` finds no `Level` comparison in `src/`), so this is pure public API\nsurface that will silently mis-sort user code.","fix":"Either drop `PartialOrd`/`Ord` from the `Level` derive (they are unused internally) and expose an\nexplicit accessor for severity, or implement them by hand so severity dominates and the direction\nis documented:\n\n```rust\n#[derive(Clone, Debug, PartialEq, Eq)]\npub struct Level<'a> { /* ... */ }\n\nimpl Ord for Level<'_> {\n    fn cmp(&self, other: &Self) -> core::cmp::Ordering {\n        // `Error` is the most severe, so reverse the declaration order of `LevelInner`\n        other.level.cmp(&self.level).then_with(|| self.name.cmp(&other.name))\n    }\n}\n```\n\nWhichever is chosen, add a doc-comment on `Level` stating which end of the ordering is \"most\nsevere\".","locations":[{"ref":"src/level.rs:55-59","code":"   55 | #[derive(Clone, Debug, PartialEq, Eq, PartialOrd, Ord)]\n   56 | pub struct Level<'a> {\n   57 |     pub(crate) name: Option<Option<Cow<'a, str>>>,\n   58 |     pub(crate) level: LevelInner,\n   59 | }","lines":5,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/level.rs#L55-L59"},{"ref":"src/level.rs:214-221","code":"  214 | #[derive(Clone, Copy, Debug, PartialEq, Eq, PartialOrd, Ord)]\n  215 | pub(crate) enum LevelInner {\n  216 |     Error,\n  217 |     Warning,\n  218 |     Info,\n  219 |     Note,\n  220 |     Help,\n  221 | }","lines":8,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/level.rs#L214-L221"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"`src/renderer/mod.rs:38` does `pub use anstyle::*;`, re-exporting the *entire* `anstyle` crate into\n`annotate_snippets::renderer`. This makes every current and future public item of `anstyle`\n(`Style`, `AnsiColor`, `Effects`, `Color`, `Ansi256Color`, `RgbColor`, `Reset`, `EffectIter`, ...)\npart of `annotate-snippets`' public API surface. Two concrete consequences:\n\n- A semver-minor release of `anstyle` that adds a new public item silently changes\n  `annotate-snippets`' public API, and can break downstream `use annotate_snippets::renderer::*;`\n  glob imports through a name collision that this crate never authored.\n- The crate's own public names in that module (`Renderer`, `DecorStyle`, `DEFAULT_TERM_WIDTH`, the\n  `DEFAULT_*_STYLE` constants) are indistinguishable from the re-exported foreign ones in rustdoc.\n\nOnly `Style` (used in the `Renderer::error`/`warning`/... setters at mod.rs:205-269) and the color\ntypes needed to construct one are actually part of this crate's contract.","fix":"Replace the glob with an explicit, documented re-export list, e.g.\n\n```rust\npub use anstyle::{Ansi256Color, AnsiColor, Color, Effects, RgbColor, Style};\n```\n\nso that additions to `anstyle` cannot change this crate's API, and add a doc comment noting that\nthese are re-exports of `anstyle` types accepted by [`Renderer::error`] and friends.","locations":[{"ref":"src/renderer/mod.rs:39","code":"   39 | pub use anstyle::*;","lines":1,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/mod.rs#L39"}]},
{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"`AnnotationKind::span` and `Patch::new` are the only way to supply byte ranges, yet neither documents that an out-of-range span aborts rendering. `SourceMap::annotated_lines` and `SourceMap::splice_lines` `panic!` with `Annotation range ... is beyond the end of buffer ...` / `Patch span ... is beyond the end of buffer ...`. Verified: `AnnotationKind::Primary.span(2..99)` on a 5-byte source and `Patch::new(2..99, \"x\")` on a 5-byte source both panic. `Renderer::render` has no `# Panics` section either, so the only way a caller learns about this contract is by crashing in production.","fix":"Add a `# Panics` section to the doc comments of `AnnotationKind::span`, `Patch::new`, `Snippet::annotation`/`Snippet::patch` and `Renderer::render` stating that spans must satisfy `span.start <= span.end <= source.len() + 1` and must lie on UTF-8 char boundaries. Better still, clamp the span to `source.len() + 1` in the renderer and drop the `panic!`s so a malformed span degrades to a slightly wrong caret instead of killing the host process.","locations":[{"ref":"src/snippet.rs:405-413","code":"  405 |     /// Annotate a byte span within [`Snippet`]\n  406 |     pub fn span<'a>(self, span: Range<usize>) -> Annotation<'a> {\n  407 |         Annotation {\n  408 |             span,\n  409 |             label: None,\n  410 |             kind: self,\n  411 |             highlight_source: false,\n  412 |         }\n  413 |     }","lines":9,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/snippet.rs#L405-L413"},{"ref":"src/snippet.rs:439-453","code":"  439 |     /// Splice `replacement` into the [`Snippet`] at the specified byte span\n  440 |     ///\n  441 |     /// <div class=\"warning\">\n  442 |     ///\n  443 |     /// Text passed to this function is considered \"untrusted input\", as such\n  444 |     /// all text is passed through a normalization function. Pre-styled text is\n  445 |     /// not allowed to be passed to this function.\n  446 |     ///\n  447 |     /// <\/div>\n  448 |     pub fn new(span: Range<usize>, replacement: impl Into<Cow<'a, str>>) -> Self {\n  449 |         Self {\n  450 |             span,\n  451 |             replacement: replacement.into(),\n  452 |         }\n  453 |     }","lines":15,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/snippet.rs#L439-L453"},{"ref":"src/renderer/source_map.rs:149-159","code":"  149 |         let source_len = self.source.len();\n  150 |         if let Some(bigger) = annotations.iter().find_map(|x| {\n  151 |             // Allow highlighting one past the last character in the source.\n  152 |             if source_len + 1 < x.span.end {\n  153 |                 Some(&x.span)\n  154 |             } else {\n  155 |                 None\n  156 |             }\n  157 |         }) {\n  158 |             panic!(\"Annotation range `{bigger:?}` is beyond the end of buffer `{source_len}`\")\n  159 |         }","lines":11,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/source_map.rs#L149-L159"},{"ref":"src/renderer/source_map.rs:406-416","code":"  406 |         let source_len = self.source.len();\n  407 |         if let Some(bigger) = patches.iter().find_map(|x| {\n  408 |             // Allow patching one past the last character in the source.\n  409 |             if source_len + 1 < x.span.end {\n  410 |                 Some(&x.span)\n  411 |             } else {\n  412 |                 None\n  413 |             }\n  414 |         }) {\n  415 |             panic!(\"Patch span `{bigger:?}` is beyond the end of buffer `{source_len}`\")\n  416 |         }","lines":11,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/source_map.rs#L406-L416"}]},
{"id":"API_5","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`Patch::new` / `Snippet::patch` / `Snippet::patches` place no constraint on the supplied spans, but `SourceMap::splice_lines` documents and relies on the assumption \"all spans are in the same file, and all spans are disjoint\" and only sorts by `span.start`. Overlapping or inverted patch spans therefore silently produce corrupted suggestion text instead of an error. Verified: patches `0..5 -> \"abc\"` and `2..7 -> \"zzz\"` on `\"hello world\"` render the suggestion `abczzzorld` (the overlap is applied twice), and `Patch::new(7..3, \"xyz\")` on `\"hello world\"` renders `hello wxyzlo world`, duplicating source text that does not exist. A user of the public API has no way to know this rule from the docs.","fix":"Document the disjointness/ordering requirement on `Patch::new` and `Snippet::patch`, and enforce it where the patches are collected: in `SourceMap::splice_lines`, after `patches.sort_by_key(|p| p.span.start)`, drop (or clamp) any patch whose `span.start` is less than the previous patch's `span.end`, and skip patches where `span.start > span.end`, instead of splicing them blindly.","locations":[{"ref":"src/snippet.rs:438-453","code":"  438 | impl<'a> Patch<'a> {\n  439 |     /// Splice `replacement` into the [`Snippet`] at the specified byte span\n  440 |     ///\n  441 |     /// <div class=\"warning\">\n  442 |     ///\n  443 |     /// Text passed to this function is considered \"untrusted input\", as such\n  444 |     /// all text is passed through a normalization function. Pre-styled text is\n  445 |     /// not allowed to be passed to this function.\n  446 |     ///\n  447 |     /// <\/div>\n  448 |     pub fn new(span: Range<usize>, replacement: impl Into<Cow<'a, str>>) -> Self {\n  449 |         Self {\n  450 |             span,\n  451 |             replacement: replacement.into(),\n  452 |         }\n  453 |     }","lines":16,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/snippet.rs#L438-L453"},{"ref":"src/renderer/source_map.rs:418-420","code":"  418 |         // Assumption: all spans are in the same file, and all spans\n  419 |         // are disjoint. Sort in ascending order.\n  420 |         patches.sort_by_key(|p| p.span.start);","lines":3,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/source_map.rs#L418-L420"}]},
{"id":"API_6","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`Level::as_str` is declared as `pub(crate) fn as_str(&'a self) -> &'a str`, tying the borrow of\n`self` to `'a`, the *data* lifetime parameter of `Level<'a>`. This is the classic over-constrained\n`&'a self` anti-pattern: it forces the `Level` value itself to stay borrowed for the whole of\n`'a` (for a `Level<'static>` that means borrowed forever), which prevents any later mutation or\nmove of the `Level` even though the returned `&str` does not need it.\n\nThe signature is also unnecessary: the only branch that could return data with lifetime `'a` is\n`(Some(Some(name)), _) => name.as_ref()`, and `Cow::as_ref` borrows from `&self`, not from `'a`.\nEvery other arm returns a `&'static str` constant. The sibling method on the very next line,\n`style(&self, ...)`, correctly uses an elided lifetime.","fix":"Use lifetime elision so the returned borrow is tied to the borrow of `self` rather than to the\nstruct's data lifetime:\n\n```rust\npub(crate) fn as_str(&self) -> &str {\n```","locations":[{"ref":"src/level.rs:129-143","code":"  129 |     pub(crate) fn as_str(&'a self) -> &'a str {\n  130 |         match (&self.name, self.level) {\n  131 |             (Some(Some(name)), _) => name.as_ref(),\n  132 |             (Some(None), _) => \"\",\n  133 |             (None, LevelInner::Error) => ERROR_TXT,\n  134 |             (None, LevelInner::Warning) => WARNING_TXT,\n  135 |             (None, LevelInner::Info) => INFO_TXT,\n  136 |             (None, LevelInner::Note) => NOTE_TXT,\n  137 |             (None, LevelInner::Help) => HELP_TXT,\n  138 |         }\n  139 |     }\n  140 | \n  141 |     pub(crate) fn style(&self, stylesheet: &Stylesheet) -> Style {\n  142 |         self.level.style(stylesheet)\n  143 |     }","lines":15,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/level.rs#L129-L143"}]},
{"id":"API_7","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"A `Snippet` with no markers cannot be added to a `Group` without a turbofish. `Element` has two `From<Snippet<'a, _>>` impls (`Annotation` -> `Cause`, `Patch` -> `Suggestion`), so `T` is only ever inferred from a call to `.annotation()`/`.patch()`. Verified: `Group::with_level(Level::ERROR).element(Snippet::source(\"a\\nb\\nc\").path(\"f.rs\"))` fails to compile with `E0283: cannot infer type of the type parameter T declared on the struct Snippet` plus `multiple impls satisfying Element<'_>: From<Snippet<'_, _>> found`, and the user has to write `Snippet::<Annotation<'_>>::source(...)`. Showing plain source context with `fold(false)` and no annotations is a legitimate and natural use of this API, and nothing documents the workaround.","fix":"Give `T` a default (`pub struct Snippet<'a, T = Annotation<'a>>`) so `Snippet::source(..)` resolves to the annotation flavor, or add dedicated constructors such as `Snippet::cause(source)` / `Snippet::suggestion(source)` that pin `T`. At minimum, document the turbofish in the `Snippet` type-level doc comment next to the existing \"`Snippet`s come in the following styles (`T`)\" list.","locations":[{"ref":"src/snippet.rs:115-125","code":"  115 | impl<'a> From<Snippet<'a, Annotation<'a>>> for Element<'a> {\n  116 |     fn from(value: Snippet<'a, Annotation<'a>>) -> Self {\n  117 |         Element::Cause(value)\n  118 |     }\n  119 | }\n  120 | \n  121 | impl<'a> From<Snippet<'a, Patch<'a>>> for Element<'a> {\n  122 |     fn from(value: Snippet<'a, Patch<'a>>) -> Self {\n  123 |         Element::Suggestion(value)\n  124 |     }\n  125 | }","lines":11,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/snippet.rs#L115-L125"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"easy","description":"`get_line` does a linear `self.lines.iter().find(|l| l.line_index == idx)` even though `line_index` is `line_start + idx` for `idx in 0..lines.len()`, i.e. strictly contiguous and sorted by construction (see `SourceMap::new`). It is called from inside loops: once per candidate line in `annotated_lines`, once per skipped line in `splice_lines`, once per patch, and once per line of every patch span in the `replaced_highlights` loop. The result is O(lines²) behaviour on large sources with multi-line spans. `render.rs` calls it in loops too (e.g. `render.rs:1519`).","fix":"Store `line_start` in `SourceMap` and make the lookup O(1):\n```rust\npub(crate) fn get_line(&self, idx: usize) -> Option<&'a str> {\n    let offset = idx.checked_sub(self.line_start)?;\n    self.lines.get(offset).map(|info| info.line)\n}\n```\nFalling back to `self.lines.binary_search_by_key(&idx, |l| l.line_index)` would also work without adding a field.","locations":[{"ref":"src/renderer/source_map.rs:57-62","code":"   57 |     pub(crate) fn get_line(&self, idx: usize) -> Option<&'a str> {\n   58 |         self.lines\n   59 |             .iter()\n   60 |             .find(|l| l.line_index == idx)\n   61 |             .map(|info| info.line)\n   62 |     }","lines":6,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/source_map.rs#L57-L62"},{"ref":"src/renderer/source_map.rs:304-308","code":"  304 |                 let until = (ann.start.line..middle)\n  305 |                     .rev()\n  306 |                     .filter_map(|line| self.get_line(line).map(|s| (line + 1, s)))\n  307 |                     .find(|(_, s)| filter(s))\n  308 |                     .map_or(ann.start.line, |(line, _)| line);","lines":5,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/source_map.rs#L304-L308"},{"ref":"src/renderer/source_map.rs:467-476","code":"  467 |                 push_trailing(&mut buf, prev_line, &prev_hi, None);\n  468 |                 // push lines between the previous and current span (if any)\n  469 |                 for idx in prev_hi.line + 1..(cur_lo.line) {\n  470 |                     if let Some(line) = self.get_line(idx) {\n  471 |                         buf.push_str(line.as_ref());\n  472 |                         buf.push('\\n');\n  473 |                         highlights.push(core::mem::take(&mut line_highlight));\n  474 |                     }\n  475 |                 }\n  476 |                 if let Some(cur_line) = self.get_line(cur_lo.line) {","lines":10,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/source_map.rs#L467-L476"},{"ref":"src/renderer/source_map.rs:543-554","code":"  543 |         for part in &trimmed_patches {\n  544 |             let (cur_lo, cur_hi) = self.span_to_locations(part.span.clone());\n  545 |             for line in cur_lo.line..=cur_hi.line {\n  546 |                 let start = if line == cur_lo.line { cur_lo.char } else { 0 };\n  547 |                 let end = if line == cur_hi.line {\n  548 |                     cur_hi.char\n  549 |                 } else {\n  550 |                     self.get_line(line).unwrap_or_default().chars().count()\n  551 |                 };\n  552 |                 replaced_highlights[line - bounding_lo.line]\n  553 |                     .push(SubstitutionHighlight { start, end });\n  554 |             }","lines":12,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/source_map.rs#L543-L554"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"medium","difficulty":"easy","description":"`span_to_locations` locates the start and end lines with two full linear scans (`self.lines.iter().find(...)`), and `span_to_lines` linearly walks every line from the beginning of the file (the `if start >= line_info.end_byte { continue; }` arm skips lines one by one instead of seeking). `self.lines` is sorted by `start_byte`, so both are binary-searchable. `span_to_locations` is called once per annotation in `annotated_lines`, twice per patch in `splice_lines`, plus again from `render.rs` (lines 1462, 1496, 1498, 1632), so a large file with many annotations degrades to O(annotations × lines).","fix":"Replace the scans with `partition_point`, e.g.\n```rust\nlet idx = self.lines.partition_point(|info| info.end_byte <= span.start);\nlet start_info = self.lines.get(idx).unwrap_or_else(|| self.lines.last().unwrap());\n```\nand use the same technique to find the first line of `span_to_lines` before iterating forward.","locations":[{"ref":"src/renderer/source_map.rs:64-69","code":"   64 |     pub(crate) fn span_to_locations(&self, span: Range<usize>) -> (Loc, Loc) {\n   65 |         let start_info = self\n   66 |             .lines\n   67 |             .iter()\n   68 |             .find(|info| span.start >= info.start_byte && span.start < info.end_byte)\n   69 |             .unwrap_or(self.lines.last().unwrap());","lines":6,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/source_map.rs#L64-L69"},{"ref":"src/renderer/source_map.rs:92-96","code":"   92 |         let end_info = self\n   93 |             .lines\n   94 |             .iter()\n   95 |             .find(|info| span.end >= info.start_byte && span.end < info.end_byte)\n   96 |             .unwrap_or(self.lines.last().unwrap());","lines":5,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/source_map.rs#L92-L96"},{"ref":"src/renderer/source_map.rs:123-135","code":"  123 |     pub(crate) fn span_to_lines(&self, span: Range<usize>) -> Vec<&LineInfo<'a>> {\n  124 |         let mut lines = vec![];\n  125 |         let start = span.start;\n  126 |         let end = span.end;\n  127 |         for line_info in &self.lines {\n  128 |             if start >= line_info.end_byte {\n  129 |                 continue;\n  130 |             }\n  131 |             if end < line_info.start_byte {\n  132 |                 break;\n  133 |             }\n  134 |             lines.push(line_info);\n  135 |         }","lines":13,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/source_map.rs#L123-L135"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"Both places that locate the \"primary\" annotated line use `Option::or` with an eagerly-evaluated argument, so the second full linear scan over `annotated_lines` runs even when the first `find` already succeeded. `Option::or_else` gives the intended short-circuit.","fix":"Before:\n```rust\n.find(|l| l.annotations.iter().any(LineAnnotation::is_primary))\n.or(annotated_lines.iter().find(|l| !l.annotations.is_empty()))\n```\n\nAfter:\n```rust\n.find(|l| l.annotations.iter().any(LineAnnotation::is_primary))\n.or_else(|| annotated_lines.iter().find(|l| !l.annotations.is_empty()))\n```","locations":[{"ref":"src/renderer/graphics.rs:280-284","code":"  280 |             if let Some(primary_line) = annotated_lines\n  281 |                 .iter()\n  282 |                 .find(|l| l.annotations.iter().any(LineAnnotation::is_primary))\n  283 |                 .or(annotated_lines.iter().find(|l| !l.annotations.is_empty()))\n  284 |             {","lines":5,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L280-L284"},{"ref":"src/renderer/graphics.rs:280-284","code":"  280 |             if let Some(primary_line) = annotated_lines\n  281 |                 .iter()\n  282 |                 .find(|l| l.annotations.iter().any(LineAnnotation::is_primary))\n  283 |                 .or(annotated_lines.iter().find(|l| !l.annotations.is_empty()))\n  284 |             {","lines":5,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L280-L284"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`render_source_line` clones the whole annotation list for every rendered line\n(`line_info.annotations.clone()`), deep-copying every `Cow::Owned` label, only to sort it. The\nfollowing nested loop is then O(n^2) and calls `overlaps` up to four times for the same `(i, j)`\npair (lines 1031, 1035, 1061 and 1079), each call redoing the same `num_overlap` arithmetic. All of\nthis work is discarded for lines that early-return at line 1100.","fix":"Sort a `Vec<&LineAnnotation<'_>>` instead of cloning the annotations\n(`let mut annotations: Vec<&LineAnnotation<'_>> = line_info.annotations.iter().collect();`\nthen `annotations.sort_by_key(|a| Reverse((a.start.display, a.start.char)));`), and hoist the\nrepeated `overlaps(next, annotation, 0)` call into a `let overlaps_0 = ...;` binding at the top of\nthe inner loop body.","locations":[{"ref":"src/renderer/graphics.rs:993-994","code":"  993 |     let mut annotations = line_info.annotations.clone();\n  994 |     annotations.sort_by_key(|a| Reverse((a.start.display, a.start.char)));","lines":2,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L993-L994"},{"ref":"src/renderer/graphics.rs:1062-1125","code":" 1062 |     for (i, annotation) in annotations.iter().enumerate() {\n 1063 |         for (j, next) in annotations.iter().enumerate() {\n 1064 |             if overlaps(next, annotation, 0) && j > 1 {\n 1065 |                 overlap[i] = true;\n 1066 |                 overlap[j] = true;\n 1067 |             }\n 1068 |             if overlaps(next, annotation, 0)  // This label overlaps with another one and both\n 1069 |                     && annotation.has_label()     // take space (they have text and are not\n 1070 |                     && j > i                      // multiline lines).\n 1071 |                     && p == 0\n 1072 |             // We're currently on the first line, move the label one line down\n 1073 |             {\n 1074 |                 // If we're overlapping with an un-labelled annotation with the same span\n 1075 |                 // we can just merge them in the output\n 1076 |                 if next.start.display == annotation.start.display\n 1077 |                     && next.start.char == annotation.start.char\n 1078 |                     && next.end.display == annotation.end.display\n 1079 |                     && next.end.char == annotation.end.char\n 1080 |                     && !next.has_label()\n 1081 |                 {\n 1082 |                     continue;\n 1083 |                 }\n 1084 | \n 1085 |                 // This annotation needs a new line in the output.\n 1086 |                 p += 1;\n 1087 |                 break;\n 1088 |             }\n 1089 |         }\n 1090 |         annotations_position.push((p, annotation));\n 1091 |         for (j, next) in annotations.iter().enumerate() {\n 1092 |             if j > i {\n 1093 |                 let l = next.label.as_ref().map_or(0, |label| label.len() + 2);\n 1094 |                 if (overlaps(next, annotation, l) // Do not allow two labels to be in the same\n 1095 |                         // line if they overlap including padding, to\n 1096 |                         // avoid situations like:\n 1097 |                         //\n 1098 |                         //      fn foo(x: u32) {\n 1099 |                         //      -------^------\n 1100 |                         //      |      |\n 1101 |                         //      fn_spanx_span\n 1102 |                         //\n 1103 |                         && annotation.has_label()    // Both labels must have some text, otherwise\n 1104 |                         && next.has_label())         // they are not overlapping.\n 1105 |                         // Do not add a new line if this annotation\n 1106 |                         // or the next are vertical line placeholders.\n 1107 |                         || (annotation.takes_space() // If either this or the next annotation is\n 1108 |                         && next.has_label())     // multiline start/end, move it to a new line\n 1109 |                         || (annotation.has_label()   // so as not to overlap the horizontal lines.\n 1110 |                         && next.takes_space())\n 1111 |                         || (annotation.takes_space() && next.takes_space())\n 1112 |                         || (overlaps(next, annotation, l)\n 1113 |                         && (next.end.display, next.end.char) <= (annotation.end.display, annotation.end.char)\n 1114 |                         && next.has_label()\n 1115 |                         && p == 0)\n 1116 |                 // Avoid #42595.\n 1117 |                 {\n 1118 |                     // This annotation needs a new line in the output.\n 1119 |                     p += 1;\n 1120 |                     break;\n 1121 |                 }\n 1122 |             }\n 1123 |         }\n 1124 |         line_len = max(line_len, p);\n 1125 |     }","lines":64,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L1062-L1125"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"The gutter helpers allocate a `String` on every call, and they are called at least once per rendered\nline: `draw_col_separator` builds `format!(\"{chr} \")` just to write two characters, and\n`maybe_anonymized` builds a padded `String` for every single line number (including the anonymized case,\nwhere it wraps the `ANONYMIZED_LINE_NUM` constant in a `Cow::Borrowed` only to `format!` it again).","fix":"For the separator, write the two characters directly instead of allocating.\nBefore:\n```rust\n    let chr = renderer.decor_style.col_separator();\n    buffer.puts(line, col, &format!(\"{chr} \"), ElementStyle::LineNumber);\n```\nAfter:\n```rust\n    let chr = renderer.decor_style.col_separator();\n    buffer.putc(line, col, chr, ElementStyle::LineNumber);\n    buffer.putc(line, col + 1, ' ', ElementStyle::LineNumber);\n```\nFor `maybe_anonymized`, emit the padding spaces with `buffer.putc`/`itoa`-style digit writing, or cache a\nreusable `String` in the caller and `write!` into it instead of allocating a fresh one per line.","locations":[{"ref":"src/renderer/graphics.rs:2165-2168","code":" 2165 | fn draw_col_separator(renderer: &Renderer, buffer: &mut StyledBuffer, line: usize, col: usize) {\n 2166 |     let chr = renderer.decor_style.col_separator();\n 2167 |     buffer.puts(line, col, &format!(\"{chr} \"), ElementStyle::LineNumber);\n 2168 | }","lines":4,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L2165-L2168"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`normalize_whitespace` is called for essentially every rendered source/suggestion line, and its fast-path\nguard is a nested linear scan: for each char of the line it walks all 43 entries of `OUTPUT_REPLACEMENTS`\n(`OUTPUT_REPLACEMENTS.iter().any(...)`), i.e. ~43 comparisons per character in the common case where\nnothing needs replacing. The table is sorted (there is even a unit test enforcing that,\n`ensure_output_replacements_is_sorted`) and the replacement loop below already uses\n`binary_search_by_key`, so the guard is doing far more work than the transformation it is guarding.","fix":"Use the same binary search (or a cheap range pre-filter) in the guard.\nBefore:\n```rust\n    if !s\n        .chars()\n        .any(|user| OUTPUT_REPLACEMENTS.iter().any(|(bad, _)| user == *bad))\n    {\n        return Cow::Borrowed(s);\n    }\n```\nAfter:\n```rust\n    if !s.chars().any(|user| {\n        OUTPUT_REPLACEMENTS\n            .binary_search_by_key(&user, |(k, _)| *k)\n            .is_ok()\n    }) {\n        return Cow::Borrowed(s);\n    }\n```","locations":[{"ref":"src/renderer/graphics.rs:2551-2557","code":" 2551 | pub(crate) fn normalize_whitespace(s: &str) -> Cow<'_, str> {\n 2552 |     if !s\n 2553 |         .chars()\n 2554 |         .any(|user| OUTPUT_REPLACEMENTS.iter().any(|(bad, _)| user == *bad))\n 2555 |     {\n 2556 |         return Cow::Borrowed(s);\n 2557 |     }","lines":7,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L2551-L2557"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"The depth-assignment pass clones the entire `multiline_annotations` vector (`multiline_annotations.clone().into_iter()`) solely to be able to iterate while mutating. `MultilineAnnotation` contains a `Option<Cow<'a, str>>` label, so this is a deep clone of every label, and the surrounding nested loop is already O(n²).","fix":"Iterate by index instead of cloning:\n```rust\nfor outer_i in 0..multiline_annotations.len() {\n    let (start, end, kind) = {\n        let ann = &multiline_annotations[outer_i];\n        (ann.start, ann.end, ann.kind)\n    };\n    ...\n}\n```\n`Loc` is `Copy` and `AnnotationKind` is `Copy`, so only the label needs to stay borrowed, and the inner loop can use `split_at_mut` or index-based access.","locations":[{"ref":"src/renderer/source_map.rs:222-247","code":"  222 |         // Find overlapping multiline annotations, put them at different depths\n  223 |         multiline_annotations.sort_by_key(|ml| (ml.start.line, usize::MAX - ml.end.line));\n  224 |         for (outer_i, ann) in multiline_annotations.clone().into_iter().enumerate() {\n  225 |             if ann.kind.is_primary() {\n  226 |                 primary_spans.push((ann.start, ann.end));\n  227 |             }\n  228 |             for (inner_i, a) in &mut multiline_annotations.iter_mut().enumerate() {\n  229 |                 // Move all other multiline annotations overlapping with this one\n  230 |                 // one level to the right.\n  231 |                 if !ann.same_span(a)\n  232 |                     && num_overlap(ann.start.line, ann.end.line, a.start.line, a.end.line, true)\n  233 |                 {\n  234 |                     a.increase_depth();\n  235 |                 } else if ann.same_span(a) && outer_i != inner_i {\n  236 |                     a.overlaps_exactly = true;\n  237 |                 } else {\n  238 |                     if primary_spans\n  239 |                         .iter()\n  240 |                         .any(|(s, e)| a.start == *s && a.end == *e)\n  241 |                     {\n  242 |                         a.kind = AnnotationKind::Primary;\n  243 |                     }\n  244 |                     break;\n  245 |                 }\n  246 |             }\n  247 |         }","lines":26,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/source_map.rs#L222-L247"}]},
{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`StyledBuffer::render` pre-reserves `self.lines.iter().map(|line| line.len()).sum()` bytes, but `line.len()` is a count of `StyledChar`s (i.e. `char`s), not bytes. The estimate therefore ignores (a) multi-byte characters - the whole `DecorStyle::Unicode` glyph set plus any non-ASCII source text is 3 bytes per `char`, (b) the `'\\n'` appended after every line, and (c) the ANSI escape sequences, which are ~5-10 bytes per style transition and dominate styled output. For a styled Unicode render the reservation can be off by several times, so the `String` reallocates and memcpy's repeatedly during the hot write loop.","fix":"Account for byte width and the newlines.\n\nBefore:\n```rust\nlet capacity = self.lines.iter().map(|line| line.len()).sum();\nstr.reserve(capacity);\n```\nAfter:\n```rust\nlet capacity: usize = self\n    .lines\n    .iter()\n    .map(|line| line.iter().map(|c| c.ch.len_utf8()).sum::<usize>() + 1)\n    .sum();\nstr.reserve(capacity);\n```","locations":[{"ref":"src/renderer/styled_buffer.rs:49-50","code":"   49 |         let capacity = self.lines.iter().map(|line| line.len()).sum();\n   50 |         str.reserve(capacity);","lines":2,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/styled_buffer.rs#L49-L50"}]},
{"id":"PERF_9","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`Patch::trim_trivial_replacements` always heap-allocates the trimmed replacement via `Cow::Owned(substr.to_owned())`, even though `substr` is by construction always a subslice of `trimmed.replacement` (every branch of `as_substr` returns a piece of its `suggestion` argument, never of `original`). `splice_lines` calls this for every patch of every suggestion, so a report with many patches performs one avoidable `String` allocation and copy per patch. The allocation is forced only because `as_substr` unifies both input lifetimes into one, hiding the fact that the result borrows from the suggestion.","fix":"Split the lifetimes in `as_substr` (`fn as_substr<'s>(original: &str, suggestion: &'s str) -> Option<(usize, &'s str, usize)>`) so the returned slice is known to borrow from `suggestion`, then compute the trimmed replacement as a byte range and reslice in place instead of copying:\n```rust\nif let Some((prefix, suffix)) = as_substr_range(snippet, &trimmed.replacement) {\n    trimmed.span = trimmed.original_span.start + prefix..trimmed.original_span.end.saturating_sub(suffix);\n    trimmed.replacement = match trimmed.replacement {\n        Cow::Borrowed(s) => Cow::Borrowed(&s[prefix..s.len() - suffix]),\n        Cow::Owned(mut s) => { s.truncate(s.len() - suffix); s.drain(..prefix); Cow::Owned(s) }\n    };\n}\n```","locations":[{"ref":"src/snippet.rs:457-477","code":"  457 |     pub(crate) fn trim_trivial_replacements(self, source: &str) -> TrimmedPatch<'a> {\n  458 |         let mut trimmed = TrimmedPatch {\n  459 |             original_span: self.span.clone(),\n  460 |             span: self.span,\n  461 |             replacement: self.replacement,\n  462 |         };\n  463 | \n  464 |         if trimmed.replacement.is_empty() {\n  465 |             return trimmed;\n  466 |         }\n  467 |         let Some(snippet) = source.get(trimmed.original_span.clone()) else {\n  468 |             return trimmed;\n  469 |         };\n  470 | \n  471 |         if let Some((prefix, substr, suffix)) = as_substr(snippet, &trimmed.replacement) {\n  472 |             trimmed.span = trimmed.original_span.start + prefix\n  473 |                 ..trimmed.original_span.end.saturating_sub(suffix);\n  474 |             trimmed.replacement = Cow::Owned(substr.to_owned());\n  475 |         }\n  476 |         trimmed\n  477 |     }","lines":21,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/snippet.rs#L457-L477"},{"ref":"src/renderer/source_map.rs:781-805","code":"  781 | pub(crate) fn as_substr<'a>(\n  782 |     original: &'a str,\n  783 |     suggestion: &'a str,\n  784 | ) -> Option<(usize, &'a str, usize)> {\n  785 |     if let Some(stripped) = suggestion.strip_prefix(original) {\n  786 |         Some((original.len(), stripped, 0))\n  787 |     } else if let Some(stripped) = suggestion.strip_suffix(original) {\n  788 |         Some((0, stripped, original.len()))\n  789 |     } else {\n  790 |         let common_prefix = original\n  791 |             .chars()\n  792 |             .zip(suggestion.chars())\n  793 |             .take_while(|(c1, c2)| c1 == c2)\n  794 |             .map(|(c, _)| c.len_utf8())\n  795 |             .sum();\n  796 |         let original = &original[common_prefix..];\n  797 |         let suggestion = &suggestion[common_prefix..];\n  798 |         if let Some(stripped) = suggestion.strip_suffix(original) {\n  799 |             let common_suffix = original.len();\n  800 |             Some((common_prefix, stripped, common_suffix))\n  801 |         } else {\n  802 |             None\n  803 |         }\n  804 |     }\n  805 | }","lines":25,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/source_map.rs#L781-L805"}]},
{"id":"PERF_10","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"`normalize_untrusted_str` unconditionally allocates. `normalize_whitespace` is deliberately\nwritten to return `Cow::Borrowed(s)` on the common path where the input contains none of the\n`OUTPUT_REPLACEMENTS` characters, but `into_owned()` immediately throws that away and heap-copies\nthe string. For the overwhelmingly common clean-input case this turns a zero-allocation scan into\na full copy, and the only public entry point to the normalizer cannot opt out.","fix":"Return the `Cow` and let the caller decide:\n\n```rust\npub fn normalize_untrusted_str(s: &str) -> Cow<'_, str> {\n    renderer::normalize_whitespace(s)\n}\n```\n\nThis is a breaking change, so if the signature must stay, at minimum document that the function\nalways allocates, or add a `normalize_untrusted_cow` variant alongside it.","locations":[{"ref":"src/lib.rs:114-120","code":"  114 | /// Normalize the string to avoid any unicode control characters.\n  115 | ///\n  116 | /// This is important for untrusted input, as it can contain\n  117 | /// invalid unicode sequences.\n  118 | pub fn normalize_untrusted_str(s: &str) -> String {\n  119 |     renderer::normalize_whitespace(s).into_owned()\n  120 | }","lines":7,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/lib.rs#L114-L120"}]},
{"id":"PERF_11","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"`let level = group.primary_level.clone();` deep-copies a `Level<'a>` (which owns an `Option<Option<Cow<'a, str>>>`, potentially an owned `String`) once per group, even though the value is only ever used as `&level` in `buffer.render(&level, ...)`. `group` is a `&'a Group<'a>`, so borrowing the field directly works and does not conflict with the `&mut buffer` borrow.","fix":"Before:\n```rust\nlet level = group.primary_level.clone();\n```\n\nAfter: delete the line and use the field at the render site:\n```rust\nbuffer\n    .render(&group.primary_level, &renderer.stylesheet, &mut out_string)\n    .unwrap();\n```","locations":[{"ref":"src/renderer/graphics.rs:61-62","code":"   61 |         let mut buffer = StyledBuffer::new();\n   62 |         let level = group.primary_level.clone();","lines":2,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L61-L62"},{"ref":"src/renderer/graphics.rs:230-232","code":"  230 |         buffer\n  231 |             .render(&level, &renderer.stylesheet, &mut out_string)\n  232 |             .unwrap();","lines":3,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L230-L232"}]},
{"id":"PERF_12","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"The short-message label list allocates a `String` per primary label via `msg.to_string()`, collects them into a `Vec<String>`, and then `join(\", \")` allocates a third time and copies everything again. `Iterator::intersperse` is unstable, but a simple `fold` avoids both the per-label `String` and the intermediate `Vec`.","fix":"Before:\n```rust\n.collect::<Vec<_>>()\n.join(\", \");\n```\n\nAfter (dropping the `msg.to_string()` in the `filter_map` and yielding `&str` instead):\n```rust\n.fold(String::new(), |mut acc, msg| {\n    if !acc.is_empty() {\n        acc.push_str(\", \");\n    }\n    acc.push_str(msg);\n    acc\n});\n```","locations":[{"ref":"src/renderer/graphics.rs:254-271","code":"  254 |         let labels_inner = cause\n  255 |             .markers\n  256 |             .iter()\n  257 |             .filter_map(|ann| match &ann.label {\n  258 |                 Some(msg) if ann.kind.is_primary() => {\n  259 |                     if !msg.trim().is_empty() {\n  260 |                         Some(msg.to_string())\n  261 |                     } else {\n  262 |                         None\n  263 |                     }\n  264 |                 }\n  265 |                 _ => None,\n  266 |             })\n  267 |             .collect::<Vec<_>>()\n  268 |             .join(\", \");\n  269 |         if !labels_inner.is_empty() {\n  270 |             labels = Some(labels_inner);\n  271 |         }","lines":18,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L254-L271"}]},
{"id":"PERF_13","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"`max_line_num_len` leading spaces are written one `buffer.append` call at a time. Each `append` reads `self.lines[line].len()`, then `puts` re-checks bounds and may `resize` the row `Vec` - so an O(n) sequence of resizes replaces what a single `puts` of an n-space string would do.","fix":"Before:\n```rust\nfor _ in 0..max_line_num_len {\n    buffer.append(buffer_msg_line_offset, \" \", ElementStyle::NoStyle);\n}\n```\n\nAfter:\n```rust\nbuffer.append(\n    buffer_msg_line_offset,\n    &\" \".repeat(max_line_num_len),\n    ElementStyle::NoStyle,\n);\n```","locations":[{"ref":"src/renderer/graphics.rs:345-347","code":"  345 |             for _ in 0..max_line_num_len {\n  346 |                 buffer.append(buffer_msg_line_offset, \" \", ElementStyle::NoStyle);\n  347 |             }","lines":3,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L345-L347"}]},
{"id":"PERF_14","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"`set_style_range` calls `set_style` once per column, and each `set_style` call redoes `self.lines.get_mut(line)` - a bounds check and pointer chase for the row - before touching a single cell. For a wide highlighted span this repeats the row lookup once per column. The same pattern appears in `draw_range` in `render.rs`, which calls `putc` per column and thus re-runs `ensure_lines` plus two bounds checks for every character.","fix":"Resolve the row once and iterate the slice:\n```rust\npub(crate) fn set_style_range(\n    &mut self,\n    line: usize,\n    col_start: usize,\n    col_end: usize,\n    style: ElementStyle,\n    overwrite: bool,\n) {\n    let Some(line) = self.lines.get_mut(line) else {\n        return;\n    };\n    let end = col_end.min(line.len());\n    for c in &mut line[col_start.min(end)..end] {\n        if overwrite || matches!(c.style, ElementStyle::NoStyle | ElementStyle::Quotation) {\n            c.style = style;\n        }\n    }\n}\n```","locations":[{"ref":"src/renderer/styled_buffer.rs:142-153","code":"  142 |     pub(crate) fn set_style_range(\n  143 |         &mut self,\n  144 |         line: usize,\n  145 |         col_start: usize,\n  146 |         col_end: usize,\n  147 |         style: ElementStyle,\n  148 |         overwrite: bool,\n  149 |     ) {\n  150 |         for col in col_start..col_end {\n  151 |             self.set_style(line, col, style, overwrite);\n  152 |         }\n  153 |     }","lines":12,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/styled_buffer.rs#L142-L153"}]},
{"id":"PERF_15","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"`Group::with_title` clones the whole `Level` out of the title just to store it a second time in `primary_level`, and `Level` can own a `Cow<'a, str>` name (`Level::with_name`), so this is a real `String` copy whenever a custom owned level name is used. The two fields can never disagree for a group built with `with_title`, so the field is pure duplicated state; the renderer clones it a third time at `src/renderer/render.rs:52`.","fix":"Store the level once and derive it on read, e.g. make `primary_level` an `Option<Level<'a>>` set only by `Group::with_level` and add a `pub(crate) fn primary_level(&self) -> &Level<'a>` that falls back to `self.title.as_ref().map(|t| &t.level)`; then take `&group.primary_level()` in `render` instead of `group.primary_level.clone()`.","locations":[{"ref":"src/snippet.rs:49-62","code":"   49 | pub struct Group<'a> {\n   50 |     pub(crate) primary_level: Level<'a>,\n   51 |     pub(crate) title: Option<Title<'a>>,\n   52 |     pub(crate) elements: Vec<Element<'a>>,\n   53 | }\n   54 | \n   55 | impl<'a> Group<'a> {\n   56 |     /// Create group with a [`Title`], deriving [`AnnotationKind::Primary`] from its [`Level`]\n   57 |     pub fn with_title(title: Title<'a>) -> Self {\n   58 |         let level = title.level.clone();\n   59 |         let mut x = Self::with_level(level);\n   60 |         x.title = Some(title);\n   61 |         x\n   62 |     }","lines":14,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/snippet.rs#L49-L62"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"This early return is unreachable, and its comment is stale. To get here the `short_start` loop above\nmust have set `short_start = false`, which only happens when an annotation is neither\n`MultilineStart` nor `MultilineLine` (i.e. `Singleline`/`MultilineEnd`, so `all(is_line)` is false),\nor when a `MultilineStart` has non-whitespace before it (so `all(is_line)` is false as well). A line\nwhose annotations are *all* `MultilineLine` keeps `short_start == true` and returns at line 925.\nThe \"If there are no annotations\" half of the comment is also stale: that case already returned at\nline 872-879. Verified: replacing the `return` with a `panic!` leaves the entire test suite\n(230 tests, including `rustc_tests.rs`) green.","fix":"Delete the block, or - if it is meant as a defensive guard - move it to the top of\n`render_source_line` next to the `line_info.annotations.is_empty()` check so it is actually\nreachable and so the discarded work below (`annotations.clone()` plus the O(n^2) overlap analysis)\nis skipped. Note that moving it up also has to preserve the `close_window` handling that\nlines 872-879 perform.","locations":[{"ref":"src/renderer/graphics.rs:1131-1135","code":" 1131 |     // If there are no annotations or the only annotations on this line are\n 1132 |     // MultilineLine, then there's only code being shown, stop processing.\n 1133 |     if line_info.annotations.iter().all(LineAnnotation::is_line) {\n 1134 |         return vec![];\n 1135 |     }","lines":5,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L1131-L1135"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"The `else` branches of `add_annotation_to_file` and `keep_line` are unreachable. `annotated_line_infos` is initialised with one entry per element of `self.lines` (lines 161-170) and is only shrunk *after* all annotation insertion (the `fold` `retain` at line 322), while every `line_index` passed in is derived from a `Loc::line` or from a range strictly between two `Loc::line`s, and `line_index` values are contiguous by construction. The `find` therefore always succeeds. The dead branches also contain a `.unwrap()` that would panic and an `annotated_line_infos.sort_by_key(...)` that would make insertion O(n log n) per call, so they are a latent panic plus misleading complexity rather than a safety net.","fix":"Collapse both helpers to the lookup they actually perform, e.g.\n```rust\nfn add_annotation_to_file(&self, infos: &mut [AnnotatedLineInfo<'a>], line_index: usize, line_ann: LineAnnotation<'a>) {\n    let line_info = infos\n        .iter_mut()\n        .find(|li| li.line_index == line_index)\n        .expect(\"annotated_line_infos covers every line of the source map\");\n    line_info.annotations.push(line_ann);\n}\n```\nwhich also lets the parameter be `&mut [..]` instead of `&mut Vec<..>`.","locations":[{"ref":"src/renderer/source_map.rs:335-354","code":"  335 |         if let Some(line_info) = annotated_line_infos\n  336 |             .iter_mut()\n  337 |             .find(|line_info| line_info.line_index == line_index)\n  338 |         {\n  339 |             line_info.annotations.push(line_ann);\n  340 |         } else {\n  341 |             let info = self\n  342 |                 .lines\n  343 |                 .iter()\n  344 |                 .find(|l| l.line_index == line_index)\n  345 |                 .unwrap();\n  346 |             annotated_line_infos.push(AnnotatedLineInfo {\n  347 |                 line: info.line,\n  348 | {"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"The `if !line.is_empty()` guard inside `StyledBuffer::render` is always `true`: it sits inside `for StyledChar { ch, style } in line`, so the loop body only runs when `line` is non-empty. It has been vacuous since the file was introduced in commit `9ec2939`. The condition was clearly meant to suppress the reset sequence *before the first character of a line*, which is the behaviour the adjacent `logic_error` finding describes; as written it suppresses nothing.","fix":"Replace the vacuous check with a real \"have we emitted anything yet\" flag.\n\nBefore:\n```rust\nif ch_style != current_style {\n    if !line.is_empty() {\n        write!(str, \"{current_style:#}\")?;\n    }\n    current_style = ch_style;\n    write!(str, \"{current_style}\")?;\n}\n```\nAfter:\n```rust\nif !started || ch_style != current_style {\n    if started {\n        write!(str, \"{current_style:#}\")?;\n    }\n    current_style = ch_style;\n    write!(str, \"{current_style}\")?;\n    started = true;\n}\n```\n(with `let mut started = false;` declared next to `let mut current_style = stylesheet.none;`).","locations":[{"ref":"src/renderer/styled_buffer.rs:56-62","code":"   56 |                 if ch_style != current_style {\n   57 |                     if !line.is_empty() {\n   58 |                         write!(str, \"{current_style:#}\")?;\n   59 |                     }\n   60 |                     current_style = ch_style;\n   61 |                     write!(str, \"{current_style}\")?;\n   62 |                 }","lines":7,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/styled_buffer.rs#L56-L62"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`src/renderer/render.rs` carries several blocks of commented-out code, the largest being a 19-line\ndisabled branch inside `render_origin`:\n\n- render.rs:460-478 - a full `if !origin.standalone { .. draw_col_separator_no_space(..);\n  buffer_msg_line_offset += 1; }` block plus its ASCII-art explanation, commented out. It refers to\n  a field `origin.standalone` that does not exist on `Origin` (`src/snippet.rs:485-490` has only\n  `path`, `line`, `char_column`), so the code could not compile if re-enabled as written.\n- render.rs:169 - a commented-out replacement for the `is_cont` argument at the\n  `emit_suggestion_default` call site:\n  `//matches!(peek, Some(Element::Message(_) | Element::Padding(_))),`, sitting between two live\n  positional arguments.\n- render.rs:514 - `//let is_primary = primary_path == Some(&origin.path);`, superseded by the\n  `is_primary` parameter added at render.rs:504.\n- render.rs:1835 - `// *row_num -= 1;` in the middle of the explanatory comment in\n  `draw_code_line`.","fix":"Delete all four blocks; git history preserves them. If the `render.rs:460-478` branch and the\n`render.rs:169` alternative represent known open questions, replace them with a one-line\n`// FIXME:` describing the question rather than leaving non-compiling code in place - for example\n`// FIXME: secondary origins may need a leading separator line; see rust-lang/rust#..`.","locations":[{"ref":"src/renderer/graphics.rs:476-494","code":"  476 |             // if !origin.standalone {\n  477 |             //     // Add spacing line, as shown:\n  478 |             //     //   --> $DIR/file:54:15\n  479 |             //     //    |\n  480 |             //     // LL |         code\n  481 |             //     //    |         ^^^^\n  482 |             //     //    | (<- It prints *this* line)\n  483 |             //     //   ::: $DIR/other_file.rs:15:5 {"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"The first arm of the `match` in `draw_multiline_line` is unreachable-by-value: it produces exactly the\nsame `'|'` as the following catch-all `(_, DecorStyle::Ascii)` arm, so the primary/secondary distinction\nit appears to make has no effect. It only makes the reader believe ASCII output differentiates primary\nunderlines (it does not, and it also ignores `elided`).","fix":"Delete the redundant arm.\nBefore:\n```rust\n    let chr = match (style, renderer.decor_style) {\n        (ElementStyle::UnderlinePrimary | ElementStyle::LabelPrimary, DecorStyle::Ascii) => '|',\n        (_, DecorStyle::Ascii) => '|',\n```\nAfter:\n```rust\n    let chr = match (style, renderer.decor_style) {\n        (_, DecorStyle::Ascii) => '|',\n```","locations":[{"ref":"src/renderer/graphics.rs:2144-2146","code":" 2144 |     let chr = match (style, renderer.decor_style) {\n 2145 |         (ElementStyle::UnderlinePrimary | ElementStyle::LabelPrimary, DecorStyle::Ascii) => '|',\n 2146 |         (_, DecorStyle::Ascii) => '|',","lines":3,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L2144-L2146"}]},
{"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`Margin` derives `PartialEq`, but no `Margin` value is ever compared. The only uses of the type are the `use super::margin::Margin;` import, the `Margin::new` call in `render_snippet_annotations`, and two `margin: Margin` parameters - no `==`, `!=`, `assert_eq!` or `PartialEq` bound anywhere in `src/`, `tests/` or `benches/`.","fix":"Before:\n```rust\n#[derive(Clone, Copy, Debug, PartialEq)]\npub(crate) struct Margin {\n```\nAfter:\n```rust\n#[derive(Clone, Copy, Debug)]\npub(crate) struct Margin {\n```","locations":[{"ref":"src/renderer/margin.rs:7-8","code":"    7 | #[derive(Clone, Copy, Debug, PartialEq)]\n    8 | pub(crate) struct Margin {","lines":2,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/margin.rs#L7-L8"}]},
{"id":"DEAD_7","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"Two redundant constructs. In `span_to_lines`, `!self.lines.is_empty()` is always true — `SourceMap::new` explicitly synthesises a single empty `LineInfo` for empty sources, so `lines` is never empty (which is also why the `self.lines.last().unwrap()` calls at lines 69 and 96 are sound). In the non-folded trailing branch of `splice_lines`, `core::mem::take(&mut line_highlight)` is applied to a vector that was already emptied by the `take` on line 520 and never refilled, so the loop just pushes empty vectors while suggesting it is flushing accumulated state.","fix":"```rust\n// before\nif lines.is_empty() && !self.lines.is_empty() {\n    lines.push(self.lines.last().unwrap());\n}\n// after\nif lines.is_empty()\n    && let Some(last) = self.lines.last()\n{\n    lines.push(last);\n}\n```\nand in the trailing branch replace `highlights.push(core::mem::take(&mut line_highlight));` with `highlights.push(Vec::new());`.","locations":[{"ref":"src/renderer/source_map.rs:137-139","code":"  137 |         if lines.is_empty() && !self.lines.is_empty() {\n  138 |             lines.push(self.lines.last().unwrap());\n  139 |         }","lines":3,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/source_map.rs#L137-L139"},{"ref":"src/renderer/source_map.rs:527-534","code":"  527 |         } else {\n  528 |             // Add the trailing part of the source after the last patch\n  529 |             if let Some(snippet) = self.span_to_snippet(prev_hi.byte..source_len) {\n  530 |                 buf.push_str(snippet);\n  531 |                 for _ in snippet.matches('\\n') {\n  532 |                     highlights.push(core::mem::take(&mut line_highlight));\n  533 |                 }\n  534 |             }","lines":8,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa
