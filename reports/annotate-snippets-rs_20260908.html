{"id":"DEAD_8","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`impl Default for Stylesheet` is never used. `Stylesheet` is `pub(crate)` and the only two\nconstruction sites in the crate are `Stylesheet::plain()` (`renderer/mod.rs:123`) and the\nexplicit struct literal in `Renderer::styled` (`renderer/mod.rs:139`); a grep for\n`Stylesheet::default`, `Default::default()` and `..Default::default()` across `src/`, `tests/`\nand `benches/` returns nothing. rustc's `dead_code` lint does not report unused trait impls, so\nthis sits unnoticed.\n\nIt is also semantically questionable: a type called `Stylesheet` whose `Default` is \"no styling\nat all\" is a trap for anyone who later writes `Stylesheet { error: ..., ..Default::default() }`\nand silently loses every other style.","fix":"before:\n```rust\nimpl Default for Stylesheet {\n    fn default() -> Self {\n        Self::plain()\n    }\n}\n```\nafter: (delete the impl; call `Stylesheet::plain()` explicitly, as the two existing call sites\nalready do)","locations":[{"ref":"src/renderer/stylesheet.rs:18-22","code":"   18 | impl Default for Stylesheet {\n   19 |     fn default() -> Self {\n   20 |         Self::plain()\n   21 |     }\n   22 | }","lines":5,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/stylesheet.rs#L18-L22"}]},
{"id":"DEAD_9","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`Group::is_empty` is the only public item in this file with no doc comment, and it is never called anywhere in the crate (no use in `src/`, `tests/`, `examples/` or `benches/`). Its semantics are also non-obvious: it ignores `primary_level`, so `Group::with_level(Level::ERROR).is_empty()` is `true` even though the group is a fully constructed value that renders (as an empty string).","fix":"Before:\n```rust\n    pub fn is_empty(&self) -> bool {\n```\nAfter:\n```rust\n    /// Whether this group has neither a [`Title`] nor any [`Element`]s\n    ///\n    /// Such a group renders as nothing; the group's [`Level`] is not considered content.\n    pub fn is_empty(&self) -> bool {\n```","locations":[{"ref":"src/snippet.rs:93-95","code":"   93 |     pub fn is_empty(&self) -> bool {\n   94 |         self.elements.is_empty() && self.title.is_none()\n   95 |     }","lines":3,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/snippet.rs#L93-L95"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"medium","difficulty":"easy","description":"The doc-comment on `normalize_untrusted_str` makes two claims that the implementation\ncontradicts:\n\n1. \"This is important for untrusted input, as it can contain **invalid unicode sequences**\" -\n   the parameter is `&str`, which Rust guarantees to be valid UTF-8. A `&str` can never hold an\n   invalid unicode sequence, so the stated motivation is impossible.\n2. \"Normalize the string to avoid **any** unicode control characters\" - `normalize_whitespace`\n   only rewrites a fixed table (`OUTPUT_REPLACEMENTS`): the C0 controls, `DEL`, `U+200D`, and the\n   bidi controls `U+202A..U+202E` / `U+2066..U+2069`. The C1 control block `U+0080..U+009F`\n   (which includes `U+009B`, the single-byte CSI that some terminals honour) is *not* handled,\n   so \"any unicode control characters\" overstates the guarantee.\n\nAdditionally, the biggest observable behaviour of the function is entirely undocumented: the\ntable maps `('\\t', \"    \")`, so the function silently expands every tab into four spaces.\nVerified: `normalize_untrusted_str(\"a\\tb\")` returns `\"a    b\"`. A caller reading this doc would\nnot expect a \"normalize control characters\" helper to reflow their indentation.","fix":"Reword to describe what the function actually does, e.g.\n\n```rust\n/// Replace terminal-hostile characters so untrusted text can be safely rendered.\n///\n/// Control characters (`U+0000..U+001F`, `U+007F`) are replaced with their Unicode \"control\n/// picture\" glyphs, the bidi overrides/isolates (`U+202A..U+202E`, `U+2066..U+2069`) and\n/// `U+200D` are replaced, and each tab is expanded to four spaces. Newlines are preserved.\n```\n\nand drop the \"invalid unicode sequences\" sentence. If C1 controls are meant to be covered, add\n`U+0080..U+009F` to `OUTPUT_REPLACEMENTS`.","locations":[{"ref":"src/lib.rs:114-120","code":"  114 | /// Normalize the string to avoid any unicode control characters.\n  115 | ///\n  116 | /// This is important for untrusted input, as it can contain\n  117 | /// invalid unicode sequences.\n  118 | pub fn normalize_untrusted_str(s: &str) -> String {\n  119 |     renderer::normalize_whitespace(s).into_owned()\n  120 | }","lines":7,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/lib.rs#L114-L120"},{"ref":"src/renderer/graphics.rs:2551-2570","code":" 2551 | pub(crate) fn normalize_whitespace(s: &str) -> Cow<'_, str> {\n 2552 |     if !s\n 2553 |         .chars()\n 2554 |         .any(|user| OUTPUT_REPLACEMENTS.iter().any(|(bad, _)| user == *bad))\n 2555 |     {\n 2556 |         return Cow::Borrowed(s);\n 2557 |     }\n 2558 | \n 2559 |     // Scan the input string for a character in the ordered table above.\n 2560 |     // If it's present, replace it with its alternative string (it can be more than 1 char!).\n 2561 |     // Otherwise, retain the input char.\n 2562 |     let normalized = s.chars().fold(String::with_capacity(s.len()), |mut s, c| {\n 2563 |         match OUTPUT_REPLACEMENTS.binary_search_by_key(&c, |(k, _)| *k) {\n 2564 |             Ok(i) => s.push_str(OUTPUT_REPLACEMENTS[i].1),\n 2565 |             _ => s.push(c),\n 2566 |         }\n 2567 |         s\n 2568 |     });\n 2569 |     Cow::Owned(normalized)\n 2570 | }","lines":20,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L2551-L2570"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"medium","difficulty":"easy","description":"The doc comment on `Title::id` states: \"Text passed to this function is considered \"untrusted input\", as such all text is passed through a normalization function.\" That is false - the id is written to the output buffer verbatim at `src/renderer/render.rs:367` (`buffer.append(buffer_msg_line_offset, id, label_style)`), with no `normalize_whitespace` call anywhere on the path. Verified: `Level::ERROR.primary_title(\"t\").id(\"E\\u{7}03\\t08\")` renders `error[E\\u{7}03\\t08]: t`, i.e. the BEL control character and the raw tab reach the terminal. Title *text* really is normalized (`src/renderer/render.rs:401-405`), which makes the discrepancy easy to miss and the doc actively misleading for anyone relying on it for untrusted diagnostic codes.","fix":"Normalize at render time, e.g. `buffer.append(buffer_msg_line_offset, &normalize_whitespace(id), label_style)` in `render_title`, and use the normalized string's display width for `label_width` as well; otherwise delete the \"passed through a normalization function\" claim from the `Title::id` doc comment and tell callers to run `normalize_untrusted_str` themselves.","locations":[{"ref":"src/snippet.rs:169-183","code":"  169 |     /// The category for this [`Report`]\n  170 |     ///\n  171 |     /// Useful for looking searching for more information to resolve the diagnostic.\n  172 |     ///\n  173 |     /// <div class=\"warning\">\n  174 |     ///\n  175 |     /// Text passed to this function is considered \"untrusted input\", as such\n  176 |     /// all text is passed through a normalization function. Styled text is\n  177 |     /// not allowed to be passed to this function.\n  178 |     ///\n  179 |     /// <\/div>\n  180 |     pub fn id(mut self, id: impl Into<Cow<'a, str>>) -> Self {\n  181 |         self.id.get_or_insert(Id::default()).id = Some(id.into());\n  182 |         self\n  183 |     }","lines":15,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/snippet.rs#L169-L183"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"medium","difficulty":"easy","description":"Both `Snippet::path` and `Origin::path` carry the warning \"Text passed to this function is considered \"untrusted input\", as such all text is passed through a normalization function.\" Paths are never normalized: `render_origin` builds the string with `format!(\"{}:{}:{}\", origin.path, line, col)` and appends it directly. Verified: `Snippet::source(..).path(\"f\\u{7}i\\tl\\u{202e}e.rs\")` renders `--> f\\u{7}i\\tl\\u{202e}e.rs:1:1`, passing through BEL, a raw tab and a U+202E RIGHT-TO-LEFT OVERRIDE - exactly the characters `OUTPUT_REPLACEMENTS` exists to strip. A file path is very often attacker-controlled (it comes from the compiled project), so the guarantee the doc makes is the one that matters most here.","fix":"Apply the existing normalizer in `render_origin`:\n```rust\nlet path = normalize_whitespace(&origin.path);\nlet str = match (&origin.line, &origin.char_column) {\n    (Some(line), Some(col)) => format!(\"{path}:{line}:{col}\"),\n    (Some(line), None) => format!(\"{path}:{line}\"),\n    _ => path.into_owned(),\n};\n```\n(and likewise for the suggestion/secondary origin paths), or remove the false normalization claim from both doc comments.","locations":[{"ref":"src/snippet.rs:270-282","code":"  270 |     /// The location of the [`source`][Self::source] (e.g. a path)\n  271 |     ///\n  272 |     /// <div class=\"warning\">\n  273 |     ///\n  274 |     /// Text passed to this function is considered \"untrusted input\", as such\n  275 |     /// all text is passed through a normalization function. Pre-styled text is\n  276 |     /// not allowed to be passed to this function.\n  277 |     ///\n  278 |     /// <\/div>\n  279 |     pub fn path(mut self, path: impl Into<OptionCow<'a>>) -> Self {\n  280 |         self.path = path.into().0;\n  281 |         self\n  282 |     }","lines":13,"link":"https://github.com/rust-lang/annotate-sn {"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"In the \"Visual overview\" section, the `Patch` Option 1 block is annotated with line number `21`\nwhile every other block in the same walkthrough - and the actual rendered output it is describing\n- uses line `17`. Rendering `examples/multi_suggestion.rs` produces `17` for all ten gutter\nentries (checked by extracting the text of `examples/multi_suggestion.svg`), including\n`17 -     let _ = Box {};` / `17 +     let _ = Box::new(_);`. The `21` is a copy-paste slip that\nmakes the walkthrough look like the two suggestions patch different lines.","fix":"before:\n```text\n   ╭╴\n21 -     let _ = Box {};\n21 +     let _ = Box::new(_);\n   ├╴\n```\nafter:\n```text\n   ╭╴\n17 -     let _ = Box {};\n17 +     let _ = Box::new(_);\n   ├╴\n```","locations":[{"ref":"src/lib.rs:49-55","code":"   49 | //! [`Patch`] Option 1 on a [`Snippet`]\n   50 | //! ```text\n   51 | //!    ╭╴\n   52 | //! 21 -     let _ = Box {};\n   53 | //! 21 +     let _ = Box::new(_);\n   54 | //!    ├╴\n   55 | //! ```","lines":7,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/lib.rs#L49-L55"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The `# Cargo `features`` section documents only `simd` and `testing-colors`, but `Cargo.toml`\ndeclares four features: `default = [\"std\"]`, `std`, `simd`, `testing-colors`. `std` is the one\nfeature with real semantic consequences - `#![cfg_attr(all(not(feature = \"std\"), not(test)),\nno_std)]` means the crate is `no_std`-capable only when default features are disabled - and it is\ndocumented neither here nor in `README.md` (grep for `no_std` / `default-features` in `README.md`\nreturns nothing). A `no_std` user has no way to discover that this crate supports them.\n\nSeparately, the fenced block at lines 94-96 starts in column 0 while the list item it belongs to\nrequires 2-space indentation, so CommonMark closes the `<ul>` before the code block and the\ncommand renders as a sibling of the list rather than as part of the `testing-colors` bullet.","fix":"Document the `std` feature and indent the fence into the list item:\n\n```rust\n//! # Cargo `features`\n//!\n//! - `std` *(default)* - Enables `std` support. Disable with\n//!   `default-features = false` to build the crate as `no_std` (an allocator is still required).\n//!\n//! - `simd` - Speeds up folding\n//!\n//! - `testing-colors` - Makes [`Renderer::styled`] colors OS independent, which\n//!   allows for easier testing when testing colored output. It should be added as\n//!   a feature in `[dev-dependencies]`, which can be done with the following command:\n//!   ```text\n//!   cargo add annotate-snippets --dev --features testing-colors\n//!   ```\n```","locations":[{"ref":"src/lib.rs:87-96","code":"   87 | //! # Cargo `features`\n   88 | //!\n   89 | //! - `simd` - Speeds up folding\n   90 | //!\n   91 | //! - `testing-colors` - Makes [Renderer::styled] colors OS independent, which\n   92 | //! allows for easier testing when testing colored output. It should be added as\n   93 | //! a feature in `[dev-dependencies]`, which can be done with the following command:\n   94 | //! ```text\n   95 | //! cargo add annotate-snippets --dev --feature testing-colors\n   96 | //! ```","lines":10,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/lib.rs#L87-L96"},{"ref":"src/lib.rs:98","code":"   98 | #![cfg_attr(all(not(feature = \"std\"), not(test)), no_std)]","lines":1,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/lib.rs#L98"}]},
{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The crate-level features heading is `# Cargo `features``, which rustdoc turns into the anchor id\n`cargo-features`. `Renderer::styled` links to it as `crate#features`, which resolves to\n`../index.html#features` - an anchor that does not exist, so the link lands at the top of the\ncrate page instead of the features section.\n\nVerified against the generated docs:\n\n```text\n$ grep -o 'id=\"[a-z-]*features[a-z-]*\"' target/doc/annotate_snippets/index.html\nid=\"cargo-features\"\n$ grep -o 'href=\"[^\"]*#features\"' target/doc/annotate_snippets/renderer/struct.Renderer.html\nhref=\"../index.html#features\"\n```\n\nrustdoc's `broken_intra_doc_links` lint does not validate `#fragment` suffixes, so this is silent.","fix":"Point the link at the real anchor. In `src/renderer/mod.rs:136`:\n\nbefore:\n```rust\n    /// When testing styled terminal output, see the [`testing-colors` feature](crate#features)\n```\nafter:\n```rust\n    /// When testing styled terminal output, see the [`testing-colors` feature](crate#cargo-features)\n```","locations":[{"ref":"src/lib.rs:87","code":"   87 | //! # Cargo `features`","lines":1,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/lib.rs#L87"},{"ref":"src/renderer/mod.rs:141","code":"  141 |     /// When testing styled terminal output, see the [`testing-colors` feature](crate#features)","lines":1,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/mod.rs#L141"}]},
{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The copy-pasteable command in the crate-level docs uses `--feature`, which is not a `cargo add`\nflag; the flag is `-F` / `--features`. Running the documented command fails with\n`error: unexpected argument '--feature' found`.\n\nVerified: `cargo add --help` lists only `--no-default-features`, `--default-features` and\n`-F, --features <FEATURES>`.","fix":"before:\n```text\ncargo add annotate-snippets --dev --feature testing-colors\n```\nafter:\n```text\ncargo add annotate-snippets --dev --features testing-colors\n```","locations":[{"ref":"src/lib.rs:94-96","code":"   94 | //! ```text\n   95 | //! cargo add annotate-snippets --dev --feature testing-colors\n   96 | //! ```","lines":3,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/lib.rs#L94-L96"}]},
{"id":"CMT_8","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The `FIXME` claims the arm is not exercised by any test, but it is: replacing the body with a\n`panic!` fails `multiple_replacements`, `suggestion_no_fold`,\n`suggestion_no_fold_replacement_ends_with_newline`, `trimmed_multiline_suggestion` and\n`trimmed_multiline_suggestion_elided_lines`. The `[]` pattern is hit for every unhighlighted context\nline of a folded multi-line suggestion (`draw_code_line` is called with `&[]` at lines 1544, 1570\nand 1599).","fix":"Drop the stale `FIXME`.\n\nBefore:\n```rust\n[] | [SubstitutionHighlight { start: 0, end: 0 }] => {\n    // FIXME: needed? Doesn't get exercised in any test.\n    draw_col_separator_no_space(renderer, buffer, *row_num, max_line_num_len + 1);\n}\n```\nAfter:\n```rust\n[] | [SubstitutionHighlight { start: 0, end: 0 }] => {\n    // Context line of a folded suggestion: no `+`/`~` marker, just the gutter.\n    draw_col_separator_no_space(renderer, buffer, *row_num, max_line_num_len + 1);\n}\n```","locations":[{"ref":"src/renderer/graphics.rs:1918-1921","code":" 1918 |             [] | [SubstitutionHighlight { start: 0, end: 0 }] => {\n 1919 |                 // FIXME: needed? Doesn't get exercised in any test.\n 1920 |                 draw_col_separator_no_space(renderer, buffer, *row_num, max_line_num_len + 1);\n 1921 |             }","lines":4,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L1918-L1921"}]},
{"id":"CMT_9","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"Every field doc on `Margin` describes the *raw* column, but `Margin::new` stores a value biased by `ELLIPSIS_PASSING` (6): `whitespace_left` is stored as `whitespace_left.saturating_sub(6)`, `span_left` as `span_left.saturating_sub(6)`, `span_right` as `span_right + 6` and `label_right` as `label_right + 6`. So `\"The column of the beginning of left-most span\"` is off by -6 and `\"The column of the end of right-most span\"` is off by +6. This is not cosmetic: the guard `self.label_right >= self.whitespace_left` (whose comment says it protects against \"the right-most label ... within [the whitespace]\") is actually comparing `real_label_right + 6` against `real_whitespace - 6`, i.e. it is skewed by 12 columns relative to what the comment describes.","fix":"Either document the bias on each field (e.g. `/// The column of the beginning of the left-most span, less ELLIPSIS_PASSING`) or, better, store the raw columns and apply `ELLIPSIS_PASSING` at the comparison sites in `compute` so that `span_left`, `span_right`, `label_right` and `whitespace_left` mean exactly what their docs say.","locations":[{"ref":"src/renderer/margin.rs:9-23","code":"    9 |     /// The available whitespace in the left that can be consumed when centering.\n   10 |     whitespace_left: usize,\n   11 |     /// The column of the beginning of left-most span.\n   12 |     span_left: usize,\n   13 |     /// The column of the end of right-most span.\n   14 |     span_right: usize,\n   15 |     /// The beginning of the line to be displayed.\n   16 |     computed_left: usize,\n   17 |     /// The end of the line to be displayed.\n   18 |     computed_right: usize,\n   19 |     /// The current width of the terminal. 140 by default and in tests.\n   20 |     pub(crate) term_width: usize,\n   21 |     /// The end column of a span label, including the span. Doesn't account for labels not in the\n   22 |     /// same line as the span.\n   23 |     label_right: usize,","lines":15,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/margin.rs#L9-L23"}]},
{"id":"CMT_10","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"`Margin::term_width` is documented as\n```rust\n/// The current width of the terminal. 140 by default and in tests.\npub(crate) term_width: usize,\n```\n(`src/renderer/margin.rs:19-20`), but the only construction site passes the *remaining code column\nwidth*, not the terminal width:\n\n```rust\n// src/renderer/render.rs:675-691\nlet width_offset = 3 + max_line_num_len;\nlet code_offset = if multiline_depth == 0 { width_offset } else { width_offset + multiline_depth + 1 };\nlet column_width = renderer.term_width.saturating_sub(code_offset);\nlet margin = Margin::new(whitespace_margin, span_left_margin, span_right_margin,\n                         label_right_margin, column_width, max_line_len);\n```\n\nSo with the default `DEFAULT_TERM_WIDTH = 140` and a 2-digit line-number gutter, `term_width` is\n135, not 140 - and the \"140 by default and in tests\" claim is never true in practice. `Margin` also\ncompares this value against `computed_right - computed_left` and `label_right - span_left`\n(margin.rs:72-92), which are *code-local* columns, so the field is being used correctly and only\nthe name and doc are wrong.\n\n`render_source_line` then reads the field back out as if it were a terminal measurement:\n`if width > margin.term_width * 2` and `max(margin.term_width / 3, MIN_PAD)`\n(render.rs:1403-1406), which is the kind of misreading the wrong name invites.","fix":"Rename the field and its constructor parameter to reflect what it holds and fix the doc:\n\n```rust\n/// The number of columns available for source text, i.e.\n/// `Renderer::term_width` minus the gutter and multiline-depth offsets.\npub(crate) code_width: usize,\n```\n\nand update the six reads inside `Margin::compute`/`Margin::right` (margin.rs:72-106) plus the two\nreads in `render_source_line` (render.rs:1403, 1406) accordingly.","locations":[{"ref":"src/renderer/margin.rs:19-20","code":"   19 |     /// The current width of the terminal. 140 by default and in tests.\n   20 |     pub(crate) term_width: usize,","lines":2,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/margin.rs#L19-L20"},{"ref":"src/renderer/graphics.rs:711-720","code":"  711 |     let column_width = renderer.term_width.saturating_sub(code_offset);\n  712 | \n  713 |     let margin = Margin::new(\n  714 |         whitespace_margin,\n  715 |         span_left_margin,\n  716 |         span_right_margin,\n  717 |         label_right_margin,\n  718 |         column_width,\n  719 |         max_line_len,\n  720 |     );","lines":10,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L711-L720"},{"ref":"src/renderer/graphics.rs:1436-1439","code":" 1436 |         if width > margin.term_width * 2 && width > (MIN_PAD * 2 + margin_width) {\n 1437 |             // If the terminal is *too* small, we keep at least a tiny bit of the span for\n 1438 |             // display.\n 1439 |             let pad = max(margin.term_width / 3, MIN_PAD);","lines":4,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L1436-L1439"}]},
{"id":"CMT_11","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The comment `// When there's a lot of whitespace (>20), we want to trim it as it is useless.` is wrong on both numbers. `self.whitespace_left` has already had `ELLIPSIS_PASSING` (6) subtracted in `new`, so the real trigger is a raw indent of **more than 26** columns (verified: 26 leading spaces renders untrimmed, 27 renders with `...`). And the amount kept is not `LONG_WHITESPACE_PADDING` (4) as the constant name suggests - `computed_left = whitespace_left - (LONG_WHITESPACE - LONG_WHITESPACE_PADDING)` keeps 16 columns, plus the 6 already shaved off, i.e. **22** columns of leading whitespace regardless of how deep the indent is (verified: a 40-space indent renders as `...` followed by 19 spaces).","fix":"Correct the comment and give the constant an honest name, e.g.\n```rust\n// A raw indent of more than `LONG_WHITESPACE + ELLIPSIS_PASSING` (26) columns is useless; keep\n// `RETAINED_WHITESPACE + ELLIPSIS_PASSING` (22) columns of it and elide the rest.\nconst RETAINED_WHITESPACE: usize = LONG_WHITESPACE - LONG_WHITESPACE_PADDING;\nself.computed_left = if self.whitespace_left > LONG_WHITESPACE {\n    self.whitespace_left - RETAINED_WHITESPACE\n} else {\n    0\n};\n```","locations":[{"ref":"src/renderer/margin.rs:61-67","code":"   61 |     fn compute(&mut self, max_line_len: usize) {\n   62 |         // When there's a lot of whitespace (>20), we want to trim it as it is useless.\n   63 |         self.computed_left = if self.whitespace_left > LONG_WHITESPACE {\n   64 |             self.whitespace_left - (LONG_WHITESPACE - LONG_WHITESPACE_PADDING) // We want some padding.\n   65 |         } else {\n   66 |             0\n   67 |         };","lines":7,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/margin.rs#L61-L67"}]},
{"id":"CMT_12","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The ASCII-art legend above `DecorStyle::underline` labels two glyphs with field names that do not exist on `UnderlineParts`. `< top_right` should be `bottom_right` (the primary `┙` is stored in the `bottom_right` field), and `< bottom_right_with_text` should be `multiline_bottom_right_with_text`. The legend is the only documentation of what each of the 15 `UnderlineParts` fields draws, so wrong names here directly mislead anyone adding a new `DecorStyle`.","fix":"Before:\n```rust\n//           top_left > ┏│━━━┙ < top_right\n// multiline_vertical > ┃│\n//                      ┃│   X1 Y1\n//                      ┃│   X2 Y2\n//                      ┃└────╿──┘ < multiline_end_same_line\n//        bottom_left > ┗━━━━━┥ < bottom_right_with_text\n```\nAfter:\n```rust\n//           top_left > ┏│━━━┙ < bottom_right\n// multiline_vertical > ┃│\n//                      ┃│   X1 Y1\n//                      ┃│   X2 Y2\n//                      ┃└────╿──┘ < multiline_end_same_line\n//        bottom_left > ┗━━━━━┥ < multiline_bottom_right_with_text\n```","locations":[{"ref":"src/renderer/mod.rs:382-386","code":"  382 |         //                      ┃│   X1 Y1\n  383 |         //                      ┃│   X2 Y2\n  384 |         //                      ┃└────╿──┘ < multiline_end_same_line\n  385 |         //        bottom_left > ┗━━━━━┥ < bottom_right_with_text\n  386 |         //   multiline_horizontal ^   `X` is a good letter","lines":5,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/mod.rs#L382-L386"}]},
{"id":"CMT_13","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"`push_trailing` carries a comment referring to `CharPos`/`CharPose` and `Usize`, types that only exist in `rustc_span`, not in this crate. Nothing in this function converts anything; it just reads the `char` field of two `Loc`s. The typo `CharPose` compounds the confusion.","fix":"```rust\n// before\n// Convert CharPos to Usize, as CharPose is character offset\n// Extract low index and high index\nlet (lo, hi_opt) = (lo.char, hi_opt.map(|hi| hi.char));\n// after\n// `Loc::char` is a character (not byte) offset into the line.\nlet (lo, hi_opt) = (lo.char, hi_opt.map(|hi| hi.char));\n```","locations":[{"ref":"src/renderer/source_map.rs:383-386","code":"  383 |         fn push_trailing(buf: &mut String, line_opt: Option<&str>, lo: &Loc, hi_opt: Option<&Loc>) {\n  384 |             // Convert CharPos to Usize, as CharPose is character offset\n  385 |             // Extract low index and high index\n  386 |             let (lo, hi_opt) = (lo.char, hi_opt.map(|hi| hi.char));","lines":4,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/source_map.rs#L383-L386"}]},
{"id":"CMT_14","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"`Loc`'s field documentation is wrong on two counts. `line` is documented as \"The (1-based) line number\", but it is `line_start + idx` where `line_start` comes straight from the caller via `Snippet::line_start` and may be `0` (or anything else) — this is exactly what makes the `ann.end.line - 1` underflow reachable. `char` is documented as \"The (0-based) column offset\", but `span_to_locations` deliberately pushes it one past the last character of the line for end-of-line positions, so it can exceed `line.chars().count()`.","fix":"```rust\n// before\n/// The (1-based) line number.\npub(crate) line: usize,\n/// The (0-based) column offset.\npub(crate) char: usize,\n// after\n/// The line number, offset by the caller-supplied `Snippet::line_start` (usually 1-based).\npub(crate) line: usize,\n/// The (0-based) character offset within the line; may be one past the last character when the\n/// location points at the line terminator.\npub(crate) char: usize,\n```","locations":[{"ref":"src/renderer/source_map.rs:652-663","code":"  652 | /// A source code location used for error reporting.\n  653 | #[derive(Clone, Copy, Debug, Default, PartialOrd, Ord, PartialEq, Eq)]\n  654 | pub(crate) struct Loc {\n  655 |     /// The (1-based) line number.\n  656 |     pub(crate) line: usize,\n  657 |     /// The (0-based) column offset.\n  658 |     pub(crate) char: usize,\n  659 |     /// The (0-based) column offset when displayed.\n  660 |     pub(crate) display: usize,\n  661 |     /// The (0-based) byte offset.\n  662 |     pub(crate) byte: usize,\n  663 | }","lines":12,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/source_map.rs#L652-L663"}]},
{"id":"CMT_15","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"`puts` documents \"If `line` does not exist in our buffer, adds empty lines up to the given and fills the last line with unstyled whitespace\", but the early return for `string.is_empty()` runs *before* `ensure_lines`, so `puts(line, col, \"\", style)` never creates the line. The same applies to `append(line, \"\")`, which delegates to `puts`. Callers such as `render_title` compute subsequent row indices from `buffer.num_lines()`, so a caller that relies on the documented line-creating behaviour with a possibly-empty string would silently shift every later row.","fix":"Document the exception on `puts` and `append`.\n\nBefore:\n```rust\n/// Sets `string` with `style` for given `line`, starting from `col`.\n/// If `line` does not exist in our buffer, adds empty lines up to the given\n/// and fills the last line with unstyled whitespace.\n```\nAfter:\n```rust\n/// Sets `string` with `style` for given `line`, starting from `col`.\n/// If `line` does not exist in our buffer, adds empty lines up to the given\n/// and fills the last line with unstyled whitespace.\n///\n/// An empty `string` is a no-op: no line is created and no padding is added.\n```","locations":[{"ref":"src/renderer/styled_buffer.rs:84-93","code":"   84 |     /// Sets `string` with `style` for given `line`, starting from `col`.\n   85 |     /// If `line` does not exist in our buffer, adds empty lines up to the given\n   86 |     /// and fills the last line with unstyled whitespace.\n   87 |     pub(crate) fn puts(&mut self, line: usize, col: usize, string: &str, style: ElementStyle) {\n   88 |         if string.is_empty() {\n   89 |             // don't add trailing whitespace (from column offset) for blank strings\n   90 |             return;\n   91 |         }\n   92 | \n   93 |         self.ensure_lines(line);","lines":10,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/styled_buffer.rs#L84-L93"}]},
{"id":"CMT_16","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comments on `set_style_range` and `set_style` refer to `Style::NoStyle` and `Style::Quotation`. There is no such type - the variants live on `ElementStyle`, and `Style` is a *different*, real type (`anstyle::Style`, re-exported from `crate::renderer`) that has no such variants. The docs therefore point at the wrong type and do not resolve as intra-doc links.","fix":"Before (in both doc blocks):\n```rust\n/// 2. `overwrite` is `true` or existing style is `Style::NoStyle` or `Style::Quotation`\n```\nAfter:\n```rust\n/// 2. `overwrite` is `true` or existing style is `ElementStyle::NoStyle` or `ElementStyle::Quotation`\n```","locations":[{"ref":"src/renderer/styled_buffer.rs:139-141","code":"  139 |     /// Set `style` for `line`, `col_start..col_end` range if:\n  140 |     /// 1. That line and column range exist in `StyledBuffer`\n  141 |     /// 2. `overwrite` is `true` or existing style is `Style::NoStyle` or `Style::Quotation`","lines":3,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/styled_buffer.rs#L139-L141"},{"ref":"src/renderer/styled_buffer.rs:155-157","code":"  155 |     /// Set `style` for `line`, `col` if:\n  156 |     /// 1. That line and column exist in `StyledBuffer`\n  157 |     /// 2. `overwrite` is `true` or existing style is `Style::NoStyle` or `Style::Quotation`","lines":3,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/styled_buffer.rs#L155-L157"}]},
{"id":"CMT_17","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The `Snippet::line_start` doc comment - \"When manually [`fold`][Self::fold]ing, the [`source`][Self::source]s line offset from the original start\" - contradicts the code twice. It is not tied to folding: `SourceMap::new` uses `line_start` for the `line_index` of *every* line regardless of `fold`, and the value is rendered in the gutter and in the `path:line:col` origin in all cases. It is also not an \"offset\": the default is `1`, not `0`, and `Loc::line` is documented as \"The (1-based) line number\".","fix":"Before:\n```rust\n    /// When manually [`fold`][Self::fold]ing,\n    /// the [`source`][Self::source]s line offset from the original start\n    pub fn line_start(mut self, line_start: usize) -> Self {\n```\nAfter:\n```rust\n    /// The 1-based line number of the first line of [`source`][Self::source]\n    ///\n    /// Defaults to `1`. Set this when [`source`][Self::source] is an excerpt of a larger file so\n    /// that rendered line numbers match the original.\n    pub fn line_start(mut self, line_start: usize) -> Self {\n```","locations":[{"ref":"src/snippet.rs:263-268","code":"  263 |     /// When manually [`fold`][Self::fold]ing,\n  264 |     /// the [`source`][Self::source]s line offset from the original start\n  265 |     pub fn line_start(mut self, line_start: usize) -> Self {\n  266 |         self.line_start = line_start;\n  267 |         self\n  268 |     }","lines":6,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/snippet.rs#L263-L268"},{"ref":"src/renderer/source_map.rs:41-49","code":"   41 |             mapping.push(LineInfo {\n   42 |                 line,\n   43 |                 line_index: line_start + idx,\n   44 |                 start_byte: line_range.start,\n   45 |                 end_byte: line_range.end + end_line_size,\n   46 |                 end_line_size,\n   47 |             });\n   48 | \n   49 |             current_index += line_length + end_line_size;","lines":9,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/source_map.rs#L41-L49"}]},
{"id":"CMT_18","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The explanatory comment about leaving a line with only whitespace after a removal - together with a\ncommented-out `// *row_num -= 1;` - sits inside the `else` branch, i.e. the branch that *does* print\nthe addition line. The behaviour it describes is implemented by the `if line_to_add.trim().is_empty()`\nbranch immediately above it. A reader looking at the `else` branch is told the opposite of what the\ncode does, and the dead commented-out statement suggests unfinished work that is in fact already\ndone three lines earlier.","fix":"Move the comment onto the `if` branch and delete the commented-out statement.\n\nBefore:\n```rust\nif line_to_add.trim().is_empty() {\n    *row_num -= 1;\n} else {\n    // Check if after the removal, the line is left with only whitespace. If so, we\n    // will not show an \"addition\" line, as removing the whole line is what the user\n    // would really want.\n    // ...\n    // *row_num -= 1;\n    buffer.puts(/* ... */);\n```\nAfter:\n```rust\n// If after the removal the line is left with only whitespace, do not show an\n// \"addition\" line: removing the whole line is what the user really wants.\nif line_to_add.trim().is_empty() {\n    *row_num -= 1;\n} else {\n    buffer.puts(/* ... */);\n```","locations":[{"ref":"src/renderer/graphics.rs:1877-1893","code":" 1877 |             if line_to_add.trim().is_empty() {\n 1878 |                 *row_num -= 1;\n 1879 |             } else {\n 1880 |                 // Check if after the removal, the line is left with only whitespace. If so, we\n 1881 |                 // will not show an \"addition\" line, as removing the whole line is what the user\n 1882 |                 // would really want.\n 1883 |                 // For example, for the following:\n 1884 |                 //   |\n 1885 |                 // 2 -     .await\n 1886 |                 // 2 +     (note the left over whitespace)\n 1887 |                 //   |\n 1888 |                 // We really want\n 1889 |                 //   |\n 1890 |                 // 2 -     .await\n 1891 |                 //   |\n 1892 |                 // *row_num -= 1;\n 1893 |                 buffer.puts(","lines":17,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L1877-L1893"}]},

{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"medium","difficulty":"medium","description":"`src/renderer/render.rs` contains two hand-maintained parallel tables that must agree on the\ndisplay width of every special character, with nothing but a comment enforcing the invariant:\n\n- `char_width` (render.rs:2298-2315) lists 41 control/bidi code points that must render as width 1,\n  plus `'\\t' => 4`. Its comment says \"Keep the following list in sync with\n  `rustc_errors::emitter::OUTPUT_REPLACEMENTS`\".\n- `OUTPUT_REPLACEMENTS` (render.rs:2467-2513) maps 43 code points to their replacement strings, and\n  is what `normalize_whitespace` (render.rs:2515-2534) actually substitutes before emission. Its\n  comment says \"Keep the following list in sync with `rustc_span::char_width`.\"\n\nThe invariant they encode is `str_width(s) == str_width(normalize_whitespace(s))` - layout is\ncomputed on the *raw* line (`max_line_len = max(max_line_len, str_width(line_info.line))`,\nrender.rs:666; `Loc::display` via `char_width`, source_map.rs:74) while emission writes the\n*normalized* line (`normalize_whitespace(line_info.line)`, render.rs:855). Any entry present in one\ntable and absent from the other silently shifts every underline and label on that line.\n\nThe tables currently do agree (each replacement is 1 column except `'\\t' -> \"    \"` at 4 and\n`'\\u{200d}' -> \"\"` at 0, matching `char_width`), but the only test that exists\n(`ensure_output_replacements_is_sorted`, render.rs:2763-2773) checks sortedness and de-duplication -\nnot width agreement. `'\\u{200d}'` (ZWJ) is in `OUTPUT_REPLACEMENTS` but not in `char_width`'s\nexplicit list; it happens to work only because `unicode_width` independently reports 0 for it.","fix":"Derive one table from the other so they cannot drift, and pin the invariant with a test:\n\n```rust\npub(crate) fn char_width(ch: char) -> usize {\n    match OUTPUT_REPLACEMENTS.binary_search_by_key(&ch, |(k, _)| *k) {\n        Ok(i) => OUTPUT_REPLACEMENTS[i].1.chars()\n            .map(|c| unicode_width::UnicodeWidthChar::width(c).unwrap_or(1))\n            .sum(),\n        Err(_) => unicode_width::UnicodeWidthChar::width(ch).unwrap_or(1),\n    }\n}\n```\n\nand add to the existing `mod test`:\n\n```rust\n#[test]\nfn normalization_preserves_width() {\n    for (bad, replacement) in OUTPUT_REPLACEMENTS {\n        assert_eq!(char_width(*bad), str_width(replacement), \"width drift for {bad:?}\");\n    }\n}\n```","locations":[{"ref":"src/renderer/graphics.rs:2367-2384","code":" 2367 | pub(crate) fn char_width(ch: char) -> usize {\n 2368 |     // FIXME: `unicode_width` sometimes disagrees with terminals on how wide a `char` is. For now,\n 2369 |     // just accept that sometimes the code line will be longer than desired.\n 2370 |     match ch {\n 2371 |         '\\t' => 4,\n 2372 |         // Keep the following list in sync with `rustc_errors::emitter::OUTPUT_REPLACEMENTS`. These\n 2373 |         // are control points that we replace before printing with a visible codepoint for the sake\n 2374 |         // of being able to point at them with underlines.\n 2375 |         '\\u{0000}' | '\\u{0001}' | '\\u{0002}' | '\\u{0003}' | '\\u{0004}' | '\\u{0005}'\n 2376 |         | '\\u{0006}' | '\\u{0007}' | '\\u{0008}' | '\\u{000B}' | '\\u{000C}' | '\\u{000D}'\n 2377 |         | '\\u{000E}' | '\\u{000F}' | '\\u{0010}' | '\\u{0011}' | '\\u{0012}' | '\\u{0013}'\n 2378 |         | '\\u{0014}' | '\\u{0015}' | '\\u{0016}' | '\\u{0017}' | '\\u{0018}' | '\\u{0019}'\n 2379 |         | '\\u{001A}' | '\\u{001B}' | '\\u{001C}' | '\\u{001D}' | '\\u{001E}' | '\\u{001F}'\n 2380 |         | '\\u{007F}' | '\\u{202A}' | '\\u{202B}' | '\\u{202D}' | '\\u{202E}' | '\\u{2066}'\n 2381 |         | '\\u{2067}' | '\\u{2068}' | '\\u{202C}' | '\\u{2069}' => 1,\n 2382 |         _ => unicode_width::UnicodeWidthChar::width(ch).unwrap_or(1),\n 2383 |     }\n 2384 | }","lines":18,"link":"https://github.com/rust-lang/annotate-s {"id":"DUP_2","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"easy","description":"Every level constant is defined twice and both copies are public:\n\n- `level::ERROR`, `level::WARNING`, `level::INFO`, `level::NOTE`, `level::HELP` as free consts\n- `Level::ERROR`, `Level::WARNING`, `Level::INFO`, `Level::NOTE`, `Level::HELP` as associated\n  consts that are pure aliases of the free ones\n\nThis is five duplicated, near-identical declarations plus five alias lines, doubles the rustdoc\nsurface, and gives two spellings for the same value in every code sample. It also means adding a\nnew level requires touching two blocks, which is exactly the copy-paste hazard this file is\notherwise prone to. Nothing in `src/` references the free consts other than the alias block\nitself; the doc examples and `examples/*.rs` all use the `Level::` form.","fix":"Keep one set. Define the associated consts as the source of truth:\n\n```rust\n/// # Constructors\nimpl<'a> Level<'a> {\n    /// Default `error:` [`Level`]\n    pub const ERROR: Level<'a> = Level { name: None, level: LevelInner::Error };\n    // ... etc\n}\n```\n\nand either delete the free consts or, if they must stay for backwards compatibility, make them\n`pub const ERROR: Level<'_> = Level::ERROR;` and mark them `#[deprecated]` / `#[doc(hidden)]`.","locations":[{"ref":"src/level.rs:11-39","code":"   11 | /// Default `error:` [`Level`]\n   12 | pub const ERROR: Level<'_> = Level {\n   13 |     name: None,\n   14 |     level: LevelInner::Error,\n   15 | };\n   16 | \n   17 | /// Default `warning:` [`Level`]\n   18 | pub const WARNING: Level<'_> = Level {\n   19 |     name: None,\n   20 |     level: LevelInner::Warning,\n   21 | };\n   22 | \n   23 | /// Default `info:` [`Level`]\n   24 | pub const INFO: Level<'_> = Level {\n   25 |     name: None,\n   26 |     level: LevelInner::Info,\n   27 | };\n   28 | \n   29 | /// Default `note:` [`Level`]\n   30 | pub const NOTE: Level<'_> = Level {\n   31 |     name: None,\n   32 |     level: LevelInner::Note,\n   33 | };\n   34 | \n   35 | /// Default `help:` [`Level`]\n   36 | pub const HELP: Level<'_> = Level {\n   37 |     name: None,\n   38 |     level: LevelInner::Help,\n   39 | };","lines":29,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/level.rs#L11-L39"}]},

{"id":"DUP_4","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"very_easy","description":"The logic that derives an `Origin`'s line and column from the annotated lines is duplicated\nverbatim between `render_short_message` (`src/renderer/render.rs:275-288`) and\n`render_snippet_annotations` (`src/renderer/render.rs:517-530`). `diff` of the two 14-line regions\nreports no differences at all:\n\n```rust\nif let Some(primary_line) = annotated_lines\n    .iter()\n    .find(|l| l.annotations.iter().any(LineAnnotation::is_primary))\n    .or(annotated_lines.iter().find(|l| !l.annotations.is_empty()))\n{\n    origin.line = Some(primary_line.line_index);\n    if let Some(first_annotation) = primary_line\n        .annotations\n        .iter()\n        .min_by_key(|a| (Reverse(a.is_primary()), a.start.char))\n    {\n        origin.char_column = Some(first_annotation.start.char + 1);\n    }\n}\n```\n\nThe surrounding `let mut origin = Origin::path(path.as_ref());` is duplicated too\n(render.rs:269 and render.rs:511). A third, subtly *different* copy sits immediately below at\nrender.rs:549-558 (secondary snippets: `find(|l| !l.annotations.is_empty()).or(first())` and\n`annotations.first()` instead of `min_by_key`), so the fix at commit `eb47916`\n(\"fix: Pick correct origin for non-folded secondary snippets\") had to reason about all three.","fix":"Add one helper next to `render_origin` and call it from all three sites:\n\n```rust\nfn origin_for_snippet<'a>(\n    path: &'a Cow<'a, str>,\n    annotated_lines: &[AnnotatedLineInfo<'_>],\n    is_primary: bool,\n) -> Origin<'a> {\n    let mut origin = Origin::path(path.as_ref());\n    let line = if is_primary {\n        annotated_lines.iter()\n            .find(|l| l.annotations.iter().any(LineAnnotation::is_primary))\n            .or_else(|| annotated_lines.iter().find(|l| !l.annotations.is_empty()))\n    } else {\n        annotated_lines.iter()\n            .find(|l| !l.annotations.is_empty())\n            .or(annotated_lines.first())\n    };\n    if let Some(line) = line {\n        origin.line = Some(line.line_index);\n        let ann = if is_primary {\n            line.annotations.iter().min_by_key(|a| (Reverse(a.is_primary()), a.start.char))\n        } else {\n            line.annotations.first()\n        };\n        origin.char_column = ann.map(|a| a.start.char + 1);\n    }\n    origin\n}\n```","locations":[{"ref":"src/renderer/graphics.rs:280-293","code":"  280 |             if let Some(primary_line) = annotated_lines\n  281 |                 .iter()\n  282 |                 .find(|l| l.annotations.iter().any(LineAnnotation::is_primary))\n  283 |                 .or(annotated_lines.iter().find(|l| !l.annotations.is_empty()))\n  284 |             {\n  285 |                 origin.line = Some(primary_line.line_index);\n  286 |                 if let Some(first_annotation) = primary_line\n  287 |                     .annotations\n  288 |                     .iter()\n  289 |                     .min_by_key(|a| (Reverse(a.is_primary()), a.start.char))\n  290 |                 {\n  291 |                     origin.char_column = Some(first_annotation.start.char + 1);\n  292 |                 }\n  293 |             }","lines":14,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L280-L293"},{"ref":"src/renderer/graphics.rs:280-293","code":"  280 |             if let Some(primary_line) = annotated_lines\n  281 |                 .iter()\n  282 |                 .find(|l| l.annotations.iter().any(LineAnnotation::is_primary))\n  283 |                 .or(annotated_lines.iter().find(|l| !l.annotations.is_empty()))\n  284 |             {\n  285 |                 origin.line = Some(primary_line.line_index);\n  286 |                 if let Some(first_annotation) = primary_line\n  287 |                     .annotations\n  288 |                     .iter()\n  289 |                     .min_by_ {"id":"DUP_7","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"very_easy","description":"`draw_col_separator_start` (`src/renderer/render.rs:2122-2155`, 34 lines) and\n`draw_col_separator_end` (`src/renderer/render.rs:2157-2185`, 29 lines) are character-for-character\nidentical apart from a single glyph: `'╭'` vs `'╰'` in the `DecorStyle::Unicode` arm. Both match on\n`renderer.decor_style`, both emit `'|'` for ASCII, both emit the corner glyph at `col` followed by\n`'╴'` at `col + 1` for Unicode, both with `ElementStyle::LineNumber`.","fix":"Collapse into one helper parameterised by the corner glyph (or, better, driven by the `DecorSheet`\nproposed elsewhere):\n\n```rust\nfn draw_window_edge(renderer: &Renderer, buffer: &mut StyledBuffer, line: usize, col: usize, corner: char) {\n    match renderer.decor_style {\n        DecorStyle::Ascii => buffer.putc(line, col, '|', ElementStyle::LineNumber),\n        DecorStyle::Unicode => {\n            buffer.putc(line, col, corner, ElementStyle::LineNumber);\n            buffer.putc(line, col + 1, '╴', ElementStyle::LineNumber);\n        }\n    }\n}\n\nfn draw_col_separator_start(r: &Renderer, b: &mut StyledBuffer, line: usize, col: usize) { draw_window_edge(r, b, line, col, '╭') }\nfn draw_col_separator_end  (r: &Renderer, b: &mut StyledBuffer, line: usize, col: usize) { draw_window_edge(r, b, line, col, '╰') }\n```","locations":[{"ref":"src/renderer/graphics.rs:2180-2213","code":" 2180 | fn draw_col_separator_start(\n 2181 |     renderer: &Renderer,\n 2182 |     buffer: &mut StyledBuffer,\n 2183 |     line: usize,\n 2184 |     col: usize,\n 2185 | ) {\n 2186 |     match renderer.decor_style {\n 2187 |         DecorStyle::Ascii => {\n 2188 |             draw_col_separator_no_space_with_style(\n 2189 |                 buffer,\n 2190 |                 '|',\n 2191 |                 line,\n 2192 |                 col,\n 2193 |                 ElementStyle::LineNumber,\n 2194 |             );\n 2195 |         }\n 2196 |         DecorStyle::Unicode => {\n 2197 |             draw_col_separator_no_space_with_style(\n 2198 |                 buffer,\n 2199 |                 '╭',\n 2200 |                 line,\n 2201 |                 col,\n 2202 |                 ElementStyle::LineNumber,\n 2203 |             );\n 2204 |             draw_col_separator_no_space_with_style(\n 2205 |                 buffer,\n 2206 |                 '╴',\n 2207 |                 line,\n 2208 |                 col + 1,\n 2209 |                 ElementStyle::LineNumber,\n 2210 |             );\n 2211 |         }\n 2212 |     }\n 2213 | }","lines":34,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L2180-L2213"},{"ref":"src/renderer/graphics.rs:2215-2243","code":" 2215 | fn draw_col_separator_end(renderer: &Renderer, buffer: &mut StyledBuffer, line: usize, col: usize) {\n 2216 |     match renderer.decor_style {\n 2217 |         DecorStyle::Ascii => {\n 2218 |             draw_col_separator_no_space_with_style(\n 2219 |                 buffer,\n 2220 |                 '|',\n 2221 |                 line,\n 2222 |                 col,\n 2223 |                 ElementStyle::LineNumber,\n 2224 |             );\n 2225 |         }\n 2226 |         DecorStyle::Unicode => {\n 2227 |             draw_col_separator_no_space_with_style(\n 2228 |                 buffer,\n 2229 |                 '╰',\n 2230 |                 line,\n 2231 |                 col,\n 2232 |                 ElementStyle::LineNumber,\n 2233 |             );\n 2234 |             draw_col_separator_no_space_with_style(\n 2235 |                 buffer,\n 2236 |                 '╴',\n 2237 |                 line,\n 2238 |                 col + 1,\n 2239 |                 ElementStyle::LineNumber,\n 2240 |             );\n 2241 |         }\n 2242 |     }\n 2243 | }","lines":29,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f {"id":"DUP_8","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"very_easy","description":"`SourceMap::add_annotation_to_file` (`src/renderer/source_map.rs:329-354`, 26 lines) and\n`SourceMap::keep_line` (`src/renderer/source_map.rs:356-376`, 21 lines) share an identical\n\"find-or-insert-and-re-sort\" body. A `diff` of the two functions shows only three differing lines:\n\n```\n-            line_info.annotations.push(line_ann);\n+            line_info.keep = true;\n...\n-                annotations: vec![line_ann],\n-                keep: false,\n+                annotations: vec![],\n+                keep: true,\n```\n\nEverything else - the `iter_mut().find(|li| li.line_index == line_index)`, the\n`self.lines.iter().find(|l| l.line_index == line_index).unwrap()` lookup, the\n`AnnotatedLineInfo { line: info.line, line_index, .. }` construction and the trailing\n`annotated_line_infos.sort_by_key(|l| l.line_index)` - is byte-identical. Any fix to the lookup\n(e.g. removing the `.unwrap()` panic or replacing the O(n log n) re-sort) has to be applied twice.","fix":"Factor the find-or-insert into one helper and have both callers mutate the returned entry:\n\n```rust\nfn line_entry(&self, infos: &mut Vec<AnnotatedLineInfo<'a>>, line_index: usize) -> &mut AnnotatedLineInfo<'a> {\n    if let Some(pos) = infos.iter().position(|li| li.line_index == line_index) {\n        return &mut infos[pos];\n    }\n    let info = self.lines.iter().find(|l| l.line_index == line_index).unwrap();\n    let insert_at = infos.partition_point(|l| l.line_index < line_index);\n    infos.insert(insert_at, AnnotatedLineInfo { line: info.line, line_index, annotations: vec![], keep: false });\n    &mut infos[insert_at]\n}\n\nfn add_annotation_to_file(&self, infos: &mut Vec<AnnotatedLineInfo<'a>>, line_index: usize, ann: LineAnnotation<'a>) {\n    self.line_entry(infos, line_index).annotations.push(ann);\n}\nfn keep_line(&self, infos: &mut Vec<AnnotatedLineInfo<'a>>, line_index: usize) {\n    self.line_entry(infos, line_index).keep = true;\n}\n```\n\nUsing `partition_point` + `insert` also removes the full re-sort per insertion.","locations":[{"ref":"src/renderer/source_map.rs:329-354","code":"  329 |     fn add_annotation_to_file(\n  330 |         &self,\n  331 |         annotated_line_infos: &mut Vec<AnnotatedLineInfo<'a>>,\n  332 |         line_index: usize,\n  333 |         line_ann: LineAnnotation<'a>,\n  334 |     ) {\n  335 |         if let Some(line_info) = annotated_line_infos\n  336 |             .iter_mut()\n  337 |             .find(|line_info| line_info.line_index == line_index)\n  338 |         {\n  339 |             line_info.annotations.push(line_ann);\n  340 |         } else {\n  341 |             let info = self\n  342 |                 .lines\n  343 |                 .iter()\n  344 |                 .find(|l| l.line_index == line_index)\n  345 |                 .unwrap();\n  346 |             annotated_line_infos.push(AnnotatedLineInfo {\n  347 |                 line: info.line,\n  348 |                 line_index,\n  349 |                 annotations: vec![line_ann],\n  350 |                 keep: false,\n  351 |             });\n  352 |             annotated_line_infos.sort_by_key(|l| l.line_index);\n  353 |         }\n  354 |     }","lines":26,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/source_map.rs#L329-L354"},{"ref":"src/renderer/source_map.rs:356-376","code":"  356 |     fn keep_line(&self, annotated_line_infos: &mut Vec<AnnotatedLineInfo<'a>>, line_index: usize) {\n  357 |         if let Some(line_info) = annotated_line_infos\n  358 |             .iter_mut()\n  359 |             .find(|line_info| line_info.line_index == line_index)\n  360 |         {\n  361 |             line_info.keep = true;\n  362 |         } else {\n  363 |             let info = self\n  364 |                 .lines\n  365 |                 .iter()\n  366 | {"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"medium","difficulty":"medium","description":"The gutter geometry of the output is encoded as scattered magic arithmetic rather than one type.\nIn `src/renderer/render.rs` alone:\n\n- `max_line_num_len + 1` (the separator column) appears **28** times\n- `max_line_num_len + 3` (the code column) appears **8** times (lines 396, 1518, 1669, 1759, 1807,\n  1882, 1943, 1944)\n- `width_offset - 2` appears **4** times (lines 876, 1141, 1148, 2059) - and `width_offset` is\n  itself defined as `3 + max_line_num_len` at line 675, so `width_offset - 2` *is*\n  `max_line_num_len + 1`, i.e. the same column is spelled two different ways in the same file.\n\nWorse, the two rendering paths use *different* spellings for the same columns: the snippet path\ncarries `width_offset`/`code_offset` (computed once at render.rs:675-680, and `code_offset` grows\nby `multiline_depth + 1`), while the suggestion path hardcodes `max_line_num_len + 3`\n(render.rs:1518, 1759, 1807, 1882, 1943) and never accounts for multiline depth. There is no single\nplace to read to learn the output's column layout, and a change to the gutter requires editing 40\ncall sites.\n\nThe magic `3` is even documented three separate times in ASCII art comments (render.rs:378-395,\n1875-1879, and again implicitly at 1669) rather than named once.","fix":"Introduce a small value type and use it everywhere:\n\n```rust\n#[derive(Clone, Copy)]\nstruct Gutter {\n    max_line_num_len: usize,\n    multiline_depth: usize,\n}\n\nimpl Gutter {\n    /// Column of the `|` / `│` separator.\n    fn sep_col(self) -> usize { self.max_line_num_len + 1 }\n    /// Column where source text starts.\n    fn code_col(self) -> usize {\n        self.max_line_num_len + 3\n            + if self.multiline_depth == 0 { 0 } else { self.multiline_depth + 1 }\n    }\n    /// Legacy `width_offset` (== `sep_col() + 2`).\n    fn width_offset(self) -> usize { self.max_line_num_len + 3 }\n}\n```\n\nThen `draw_col_separator_no_space(renderer, buffer, line, width_offset - 2)` becomes\n`painter.draw_col_separator_no_space(line, gutter.sep_col())`, and the suggestion path picks up\nmultiline-depth awareness for free instead of hardcoding `max_line_num_len + 3`.","locations":[{"ref":"src/renderer/graphics.rs:704-720","code":"  704 |     let width_offset = 3 + max_line_num_len;\n  705 |     let code_offset = if multiline_depth == 0 {\n  706 |         width_offset\n  707 |     } else {\n  708 |         width_offset + multiline_depth + 1\n  709 |     };\n  710 | \n  711 |     let column_width = renderer.term_width.saturating_sub(code_offset);\n  712 | \n  713 |     let margin = Margin::new(\n  714 |         whitespace_margin,\n  715 |         span_left_margin,\n  716 |         span_right_margin,\n  717 |         label_right_margin,\n  718 |         column_width,\n  719 |         max_line_len,\n  720 |     );","lines":17,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L704-L720"},{"ref":"src/renderer/graphics.rs:1932-1942","code":" 1932 |         //   LL | line_to_add\n 1933 |         //   ++^^^\n 1934 |         //    |  |\n 1935 |         //    |  magic `3`\n 1936 |         //    `max_line_num_len`\n 1937 |         buffer.puts(\n 1938 |             *row_num,\n 1939 |             max_line_num_len + 3,\n 1940 |             &normalize_whitespace(line_to_add),\n 1941 |             ElementStyle::NoStyle,\n 1942 |         );","lines":11,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L1932-L1942"},{"ref":"src/renderer/graphics.rs:395-416","code":"  395 |     let padding = \" \".repeat(if title_style == TitleStyle::Secondary {\n  396 |         // The extra 3 ` ` is padding that's always needed to align to the\n  397 |         // label i.e. `note: `:\n  398 |         //\n  399 |         //   error: message\n  400 |         //     --> file.rs:13:20\n  401 |         //      |\n  402 |         //   13 |     <CODE>\n  403 |         //      |      ^^^^\n  404 |         //      |\n  405 |         //      = note: multiline\n  406 |         //              message\n  407 |         //   ++^^^------\n  408 |         //    |  |     |\n  409 |         //    |  |     |\n  410 |         //    |  |     width of label\n  411 |         //    |  magic `3`\n  412 |         //    `max_line_num_len`\n  413 |         max_line_num_len + 3 + label_width\n  414 |     } else {\n  415 |         label_width\n  416 |     });","lines":22,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L395-L416"}]},
{"id":"ARCH_2","type":"architecture","type_label":"Architecture","severity":"medium","difficulty":"medium","description":"Seven functions in `src/renderer/render.rs` carry `#[allow(clippy::too_many_arguments)]`\n(lines 315, 436, 497, 830, 1439, 1725, 1952) because the same ambient rendering context is\nre-threaded by hand through every call:\n\n- `emit_suggestion_default` - 11 parameters (`renderer`, `buffer`, `suggestion`, `spliced_lines`,\n  `show_code_change`, `max_line_num_len`, `sm`, `primary_path`, `matches_previous_suggestion`,\n  `is_first`, `is_cont`)\n- `draw_code_line` - 11 parameters\n- `render_snippet_annotations` - 10 parameters\n- `draw_line` - 9 parameters\n- `render_source_line` - 8 parameters\n- `render_origin` - 8 parameters\n- `render_title` - 7 parameters\n\nThree of these signatures end in three consecutive `bool`s (`is_primary`/`is_cont`/`is_first`,\n`matches_previous_suggestion`/`is_first`/`is_cont`), which is exactly the shape that makes\ncall sites unreadable and swap-prone - see the call at render.rs:158-171 where the boolean\narguments are separated from their names only by a comment, and the stale commented-out argument\non render.rs:169.\n\n`renderer`, `buffer`, `max_line_num_len`, `width_offset`, `code_offset` and `margin` are invariant\nfor the whole of one snippet render, yet are passed positionally through five call levels\n(`render` -> `render_snippet_annotations` -> `render_source_line` -> `draw_line`).","fix":"Introduce a context struct carrying the invariant state and make the drawing helpers methods on it:\n\n```rust\nstruct Painter<'r, 'b> {\n    renderer: &'r Renderer,\n    buffer: &'b mut StyledBuffer,\n    gutter: Gutter,   // see the `Gutter` proposal for max_line_num_len / width_offset / code_offset\n    margin: Margin,\n}\n\nimpl Painter<'_, '_> {\n    fn draw_line(&mut self, source: &str, line_index: usize, line_offset: usize) -> usize { .. }\n    fn draw_col_separator_no_space(&mut self, line: usize, col: usize) { .. }\n}\n```\n\nand replace the trailing boolean triples with a single named flags struct, e.g.\n`struct Placement { is_primary: bool, is_first: bool, is_cont: bool }`, so call sites read\n`Placement { is_primary: true, is_first, is_cont: peek.is_some() }` instead of `true, is_first,\npeek.is_some()`. Then drop all seven `#[allow(clippy::too_many_arguments)]` attributes.","locations":[{"ref":"src/renderer/graphics.rs:1473-1485","code":" 1473 | fn emit_suggestion_default(\n 1474 |     renderer: &Renderer,\n 1475 |     buffer: &mut StyledBuffer,\n 1476 |     suggestion: &Snippet<'_, Patch<'_>>,\n 1477 |     spliced_lines: SplicedLines<'_>,\n 1478 |     show_code_change: DisplaySuggestion,\n 1479 |     max_line_num_len: usize,\n 1480 |     sm: &SourceMap<'_>,\n 1481 |     primary_path: Option<&Cow<'_, str>>,\n 1482 |     matches_previous_suggestion: bool,\n 1483 |     is_first: bool,\n 1484 |     is_cont: bool,\n 1485 | ) {","lines":13,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L1473-L1485"},{"ref":"src/renderer/graphics.rs:527-538","code":"  527 | fn render_snippet_annotations(\n  528 |     renderer: &Renderer,\n  529 |     buffer: &mut StyledBuffer,\n  530 |     max_line_num_len: usize,\n  531 |     snippet: &Snippet<'_, Annotation<'_>>,\n  532 |     is_primary: bool,\n  533 |     sm: &SourceMap<'_>,\n  534 |     annotated_lines: &[AnnotatedLineInfo<'_>],\n  535 |     multiline_depth: usize,\n  536 |     is_cont: bool,\n  537 |     is_first: bool,\n  538 | ) {","lines":12,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/graphics.rs#L527-L538"}]},
{"id":"ARCH_3","type":"architecture","type_label":"Architecture","severity":"medium","difficulty":"medium","description":"The layering between the public input model and the renderer is circular in two places:\n\n1. `src/snippet.rs` (the public builder/input module, documented as \"Structures used as an input\n   for the library\") imports renderer internals at line 9:\n   `use crate::renderer::source_map::{TrimmedPatch, as_substr};`\n   and implements `Patch::trim_trivial_replacements` (snippet.rs:445-467), a purely\n   renderer-internal transformation that produces `TrimmedPatch`, on the *public* `Patch` type.\n   Meanwhile `src/renderer/source_map.rs:8` imports `crate::{Annotation, AnnotationKind, Patch}`\n   back from the input module. So `snippet` -> `renderer::source_map` -> `snippet`.\n\n2. `src/renderer/source_map.rs:7` imports `LineAnnotation`, `LineAnnotationType`, `char_width`,\n   `num_overlap` from `crate::renderer` (all defined in `render.rs`), while\n   `src/renderer/render.rs:17-19` imports `AnnotatedLineInfo`, `LineInfo`, `Loc`, `SourceMap`,\n   `SplicedLines`, `SubstitutionHighlight`, `TrimmedPatch` from `source_map`. The two largest\n   modules in the crate (2804 and 800 lines) are mutually dependent, so neither can be reasoned\n   about or moved independently.\n\n`src/renderer/mod.rs:32-36` exists mostly to launder this: it re-exports seven `render.rs` items as\n`pub(crate)` purely so `source_map.rs` can spell them `crate::renderer::X`.","fix":"Break the cycle by extracting the shared vocabulary types into a leaf module that both layers can\ndepend on:\n- Move `LineAnnotation`, `LineAnnotationType`, `Loc`, `num_overlap`, `char_width` into a\n  dependency-free `src/renderer/annotation.rs` + `src/renderer/text.rs`; `render.rs` and\n  `source_map.rs` then both depend on those leaves instead of on each other.\n- Move `Patch::trim_trivial_replacements` (snippet.rs:445-467) into\n  `impl TrimmedPatch { fn from_patch(patch: Patch<'a>, source: &str) -> Self }` in\n  `source_map.rs`, so `snippet.rs` no longer imports anything from `crate::renderer`.\n- Once `source_map.rs` no longer needs items from `render.rs`, delete the pass-through re-exports\n  at `src/renderer/mod.rs:32-36`.","locations":[{"ref":"src/snippet.rs:9","code":"    9 | use crate::renderer::source_map::{TrimmedPatch, as_substr};","lines":1,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/snippet.rs#L9"},{"ref":"src/snippet.rs:455-477","code":"  455 |     /// Try to turn a replacement into an addition when the span that is being\n  456 |     /// overwritten matches either the prefix or suffix of the replacement.\n  457 |     pub(crate) fn trim_trivial_replacements(self, source: &str) -> TrimmedPatch<'a> {\n  458 |         let mut trimmed = TrimmedPatch {\n  459 |             original_span: self.span.clone(),\n  460 |             span: self.span,\n  461 |             replacement: self.replacement,\n  462 |         };\n  463 | \n  464 |         if trimmed.replacement.is_empty() {\n  465 |             return trimmed;\n  466 |         }\n  467 |         let Some(snippet) = source.get(trimmed.original_span.clone()) else {\n  468 |             return trimmed;\n  469 |         };\n  470 | \n  471 |         if let Some((prefix, substr, suffix)) = as_substr(snippet, &trimmed.replacement) {\n  472 |             trimmed.span = trimmed.original_span.start + prefix\n  473 |                 ..trimmed.original_span.end.saturating_sub(suffix);\n  474 |             trimmed.replacement = Cow::Owned(substr.to_owned());\n  475 |         }\n  476 |         trimmed\n  477 |     }","lines":23,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/snippet.rs#L455-L477"},{"ref":"src/renderer/source_map.rs:7-8","code":"    7 | use crate::renderer::{LineAnnotation, LineAnnotationType, char_width, num_overlap};\n    8 | use crate::{Annotation, AnnotationKind, Patch};","lines":2,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/renderer/source_map.rs#L7-L8"}]},
{"id":"ARCH_4","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"easy","description":"The invariant \"`name == Some(None)` means the level name is hidden\" is encoded in two places that\nmust be kept in sync manually:\n\n- `src/level.rs:132` - `(Some(None), _) => \"\"` inside `as_str`\n- `src/renderer/render.rs:355` - `if title.level().name != Some(None)` guards the whole label block\n\nBecause the renderer short-circuits on the raw field, the `(Some(None), _) => \"\"` arm in `as_str`\nis unreachable in practice (`as_str` has exactly two call sites, `render.rs:356` and `:357`, both\ninside that guard) - it is dead code that nevertheless looks like the authoritative definition of\nthe behaviour. A future change to either side (e.g. adding a second `as_str` caller, or switching\nthe guard to `as_str().is_empty()`) silently changes semantics, and `render.rs` reaching into the\n`pub(crate)` `name` field defeats the accessor.","fix":"Encapsulate the invariant in one place, e.g. add\n\n```rust\npub(crate) fn is_hidden(&self) -> bool {\n    matches!(self.name, Some(None))\n}\n```\n\nto `Level` and have `render.rs` call `title.level().is_hidden()` instead of comparing `name`\ndirectly, or return `Option<&str>` from `as_str` and let the renderer drive off `None`.","locations":[{"ref":"src/level.rs:129-139","code":"  129 |     pub(crate) fn as_str(&'a self) -> &'a str {\n  130 |         match (&self.name, self.level) {\n  131 |             (Some(Some(name)), _) => name.as_ref(),\n  132 |             (Some(None), _) => \"\",\n  133 |             (None, LevelInner::Error) => ERROR_TXT,\n  134 |             (None, LevelInner::Warning) => WARNING_TXT,\n  135 |             (None, LevelInner::Info) => INFO_TXT,\n  136 |             (None, LevelInner::Note) => NOTE_TXT,\n  137 |             (None, LevelInner::Help) => HELP_TXT,\n  138 |         }\n  139 |     }","lines":11,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/level.rs#L129-L139"}]},
{"id":"ARCH_5","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"easy","description":"`mod snippet;` is private but re-exported wholesale with `pub use snippet::*;`. A glob re-export\nfrom a private module means the crate's public API is whatever happens to be `pub` inside\n`snippet.rs` at any given time - adding a `pub` item there (currently 10+ types, including\n`OptionCow`, which is only ever meant to be used as an `impl Into<...>` bound) silently expands\nthe public API and can cause an accidental semver-major change or a name collision with the\nexplicitly re-exported `Level`/`Renderer` right above it.\n\nThis also interacts badly with the workspace's `unnameable_types` and `unreachable_pub` lints,\nwhich cannot help here: everything in `snippet.rs` must be `pub` to be re-exported, so the lints\nhave nothing to catch.","fix":"Replace the glob with an explicit list so the public surface is reviewable in one place:\n\n```rust\npub use snippet::{\n    Annotation, AnnotationKind, Element, Group, Message, Origin, OptionCow, Patch, Report,\n    Snippet, Title,\n};\n```","locations":[{"ref":"src/lib.rs:110-126","code":"  110 | pub mod level;\n  111 | pub mod renderer;\n  112 | mod snippet;\n  113 | \n  114 | /// Normalize the string to avoid any unicode control characters.\n  115 | ///\n  116 | /// This is important for untrusted input, as it can contain\n  117 | /// invalid unicode sequences.\n  118 | pub fn normalize_untrusted_str(s: &str) -> String {\n  119 |     renderer::normalize_whitespace(s).into_owned()\n  120 | }\n  121 | \n  122 | #[doc(inline)]\n  123 | pub use level::Level;\n  124 | #[doc(inline)]\n  125 | pub use renderer::Renderer;\n  126 | pub use snippet::*;","lines":17,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/a7a1428f8479297f7d7eaa16a405a396f7ea9e32/src/lib.rs#L110-L126"}]},
{"id":"ARCH_6","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"hard","description":"`render_source_line` is a ~600-line function (lines 831-1437) that computes the annotation layout,\nmutates `StyledBuffer` in seven separate passes, and returns the multiline depths, all while\njuggling three different coordinate systems (byte, char, display column) plus the margin offset\n`left`. `emit_suggestion_default` is a ~285-line function with 11 parameters (both need\n`#[allow(clippy::too_many_arguments)]`). The mixing of layout computation and buffer mutation is\nwhat makes the `overlap` index-mismatch bug and the stale-coordinate bug in the trimming loop\npossible in the first place, and it is why unit-testing any single layout rule requires rendering a\nwhole diagnostic.","fix":"Split the layout decision from the drawing: extract a pure function that turns\n`&[LineAnnotation<'_>]` into a `Vec<AnnotationPlacement>` (row, column, kind, overlaps flag) that\ncan be unit-tested without a `StyledBuffer`, then let `render_source_line` only walk that plan and\ncall `buffer.putc`/`buffer.puts`. Group the repeated `(renderer, buffer, max_line_num_len,\ncode_offset, width_offset, left, margin)` arguments into a small `RenderCtx` struct to shrink the\nparameter lists of `render_source_line`, `emit_suggestion_default` and `draw_code_line`.","locations":[{"ref":"src/renderer/graphics.rs:993-1470","code":"  993 |     let mut annotations = line_info.annotations.clone();\n  994 |     annotations.sort_by_key(|a| Reverse((a.start.display, a.start.char)));\n  995 | \n  996 |     // First, figure out where each label will be positioned.\n  997 |     //\n  998 |     // In the case where you have the following annotations:\n  999 |     //\n 1000 |     //      vec.push(vec.pop().unwrap());\n 1001 |     //      --------                    - previous borrow ends here [C]\n 1002 |     //      ||\n 1003 |     //      |this makes no sense [B]\n 1004 |     //      prev
