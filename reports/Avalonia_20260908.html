er(data);\n  129 | \n  130 |             // Cache the last advance width for glyphs beyond numOfHMetrics\n  131 |             ushort? lastAdvanceWidth = null;\n  132 | \n  133 |             for (int i = 0; i < glyphIndices.Length; i++)\n  134 |             {\n  135 |                 ushort glyphIndex = glyphIndices[i];\n  136 | \n  137 |                 if (glyphIndex >= _numGlyphs)\n  138 |                 {\n  139 |                     return false;\n  140 |                 }\n  141 | \n  142 |                 if (glyphIndex < _numOfHMetrics)\n  143 |                 {\n  144 |                     reader.Seek(glyphIndex * 4);\n  145 |                     advances[i] = reader.ReadUInt16();\n  146 |                 }\n  147 |                 else\n  148 |                 {\n  149 |                     // All glyphs beyond numOfHMetrics share the same advance width\n  150 |                     if (!lastAdvanceWidth.HasValue)\n  151 |                     {\n  152 |                         reader.Seek((_numOfHMetrics - 1) * 4);\n  153 |                         lastAdvanceWidth = reader.ReadUInt16();\n  154 |                     }\n  155 | \n  156 |                     advances[i] = lastAdvanceWidth.Value;\n  157 |                 }\n  158 |             }\n  159 | \n  160 |             return true;\n  161 |         }\n  162 | \n  163 |         /// <summary>\n  164 |         /// Attempts to retrieve horizontal glyph metrics for multiple glyphs in a single operation.\n  165 |         /// <\/summary>\n  166 |         /// <param name=\"glyphIndices\">Read-only span of glyph indices to query.<\/param>\n  167 |         /// <param name=\"metrics\">Output span to write the metrics. Must be at least as long as <paramref name=\"glyphIndices\"/>.<\/param>\n  168 |         /// <returns><c>true<\/c> if all glyph indices are valid and metrics were retrieved; otherwise, <c>false<\/c>.<\/returns>\n  169 |         /// <remarks>\n  170 |         /// This method is more efficient than calling <see cref=\"TryGetMetrics(ushort, out HorizontalGlyphMetric)\"/> multiple times as it reuses\n  171 |         /// the same reader and span reference. If any glyph index is invalid, the method returns <c>false<\/c>\n  172 |         /// and the contents of <paramref name=\"metrics\"/> are undefined.\n  173 |         /// <\/remarks>\n  174 |         public bool TryGetMetrics(ReadOnlySpan<ushort> glyphIndices, Span<HorizontalGlyphMetric> metrics)\n  175 |         {\n  176 |             if (metrics.Length < glyphIndices.Length)\n  177 |             {\n  178 |                 return false;\n  179 |             }\n  180 | \n  181 |             var data = _data.Span;\n  182 |             var reader = new BigEndianBinaryReader(data);\n  183 | \n  184 |             // Cache the last advance width for glyphs beyond numOfHMetrics\n  185 |             ushort? lastAdvanceWidth = null;\n  186 | \n  187 |             for (int i = 0; i < glyphIndices.Length; i++)\n  188 |             {\n  189 |                 ushort glyphIndex = glyphIndices[i];\n  190 | \n  191 |                 if (glyphIndex >= _numGlyphs)\n  192 |                 {\n  193 |                     return false;\n  194 |                 }\n  195 | \n  196 |                 if (glyphIndex < _numOfHMetrics)\n  197 |                 {\n  198 |                     reader.Seek(glyphIndex * 4);\n  199 | \n  200 |                     ushort advanceWidth = reader.ReadUInt16();\n  201 |                     short leftSideBearing = reader.ReadInt16();\n  202 | \n  203 |                     metrics[i] = new HorizontalGlyphMetric(advanceWidth, leftSideBearing);\n  204 |                 }\n  205 |                 else\n  206 |                 {\n  207 |                     // All glyphs beyond numOfHMetrics share the same advance width\n  208 |                     if (!lastAdvanceWidth.HasValue)\n  209 |                     {\n  210 |                         reader.Seek((_numOfHMetrics - 1) * 4);\n  211 | nt i = 0; i < glyphIndices.Length; i++)\n  188 |             {\n  189 |                 ushort glyphIndex = glyphIndices[i];\n  190 | \n  191 |                 if (glyphIndex >= _numGlyphs)\n  192 |                 {\n  193 |                     return false;\n  194 |                 }\n  195 | \n  196 |                 if (glyphIndex < _numOfVMetrics)\n  197 |                 {\n  198 |                     reader.Seek(glyphIndex * 4);\n  199 | \n  200 |                     ushort advanceHeight = reader.ReadUInt16();\n  201 |                     short topSideBearing = reader.ReadInt16();\n  202 | \n  203 |                     metrics[i] = new VerticalGlyphMetric(advanceHeight, topSideBearing);\n  204 |                 }\n  205 |                 else\n  206 |                 {\n  207 |                     // All glyphs beyond numOfVMetrics share the same advance height\n  208 |                     if (!lastAdvanceHeight.HasValue)\n  209 |                     {\n  210 |                         reader.Seek((_numOfVMetrics - 1) * 4);\n  211 |                         lastAdvanceHeight = reader.ReadUInt16();\n  212 |                     }\n  213 | \n  214 |                     int tsbIndex = glyphIndex - _numOfVMetrics;\n  215 |                     int tsbOffset = _numOfVMetrics * 4 + tsbIndex * 2;\n  216 | \n  217 |                     reader.Seek(tsbOffset);\n  218 |                     short topSideBearing = reader.ReadInt16();\n  219 | \n  220 |                     metrics[i] = new VerticalGlyphMetric(lastAdvanceHeight.Value, topSideBearing);\n  221 |                 }\n  222 |             }\n  223 | \n  224 |             return true;\n  225 |         }","lines":189,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Media/Fonts/Tables/Metrics/VerticalMetricsTable.cs#L37-L225"}]},
{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`TransformParser.Parse` only checks that `(` and `)` both exist, not that `(` comes before `)`. For a malformed transform string where `)` precedes `(` (e.g. `\")(\"`, `\"scale)5(1\"`), `endIndex - beginIndex - 1` is negative, so `span.Slice(beginIndex + 1, endIndex - beginIndex - 1)` throws `ArgumentOutOfRangeException` instead of the `FormatException` the parser contractually raises for bad input. This is reachable from user input: `TransformOperations.Parse` / `TransformConverter.ConvertFrom` parse `RenderTransform` XAML values and animation transform strings, so callers catching `FormatException` will not catch this leaked exception.","fix":"Validate ordering alongside the existence check so the code throws the intended `FormatException`:\n```csharp\nif (beginIndex == -1 || endIndex == -1 || endIndex < beginIndex)\n{\n    ThrowInvalidFormat();\n}\n```","locations":[{"ref":"src/Avalonia.Base/Media/Transformation/TransformParser.cs:56-73","code":"   56 |                 var beginIndex = span.IndexOf('(');\n   57 |                 var endIndex = span.IndexOf(')');\n   58 | \n   59 |                 if (beginIndex == -1 || endIndex == -1)\n   60 |                 {\n   61 |                     ThrowInvalidFormat();\n   62 |                 }\n   63 | \n   64 |                 var namePart = span.Slice(0, beginIndex).Trim();\n   65 | \n   66 |                 var function = ParseTransformFunction(in namePart);\n   67 | \n   68 |                 if (function == TransformFunction.Invalid)\n   69 |                 {\n   70 |                     ThrowInvalidFormat();\n   71 |                 }\n   72 | \n   73 |                 var valuePart = span.Slice(beginIndex + 1, endIndex - beginIndex - 1).Trim();","lines":18,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Media/Transformation/TransformParser.cs#L56-L73"}]},
{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"ScreenHelper.checkPermissions calls navigator.permissions.query with the non-standard 'window-management' permission name. This throws a TypeError in browsers that do not support that permission name (e.g., Firefox). The function has no try/catch, so the unhandled rejection propagates to the caller. At the call site in C# interop, this will appear as an unhandled JS exception.","fix":"Wrap the permissions.query call in try/catch: try { const { state } = await ...; if (state === 'granted') ... } catch { /* ignore unsupported permission */ }","locations":[{"ref":"src/Browser/Avalonia.Browser/webapp/modules/avalonia/screens.ts:21-27","code":"   21 |     public static async checkPermissions(globalThis: Window): Promise<void> {\n   22 |         // If previous session already granted \"window-management\" permissions, just re-request details, before they are used.\n   23 |         const { state } = await globalThis.navigator.permissions.query({ name: \"window-management\" } as any);\n   24 |         if (state === \"granted\") {\n   25 |             await this.requestDetailedScreens(globalThis);\n   26 |         }\n   27 |     }","lines":7,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Browser/Avalonia.Browser/webapp/modules/avalonia/screens.ts#L21-L27"}]},
{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"DxgiRenderTarget.BeginDrawCore() calls _swapChain.Present(0, 0) without checking\nfor DXGI_STATUS_OCCLUDED (0x087A0001). When a window is minimized or covered,\nPresent with SyncInterval=0 and no flags returns DXGI_STATUS_OCCLUDED (an S_ success\ncode, not an error), indicating that nothing was presented. The current code ignores\nthis return value entirely. While this does not cause a crash, it prevents the code\nfrom optimizing away renders when the window is not visible, and the DXGI_SWAP_CHAIN_FLAG_ALLOW_TEARING\nflag requires passing DXGI_PRESENT_ALLOW_TEARING when SyncInterval is 0, otherwise\nPresent returns DXGI_ERROR_INVALID_CALL.","fix":"Since _flagsUsed includes DXGI_SWAP_CHAIN_FLAG_ALLOW_TEARING, the Present call must\npass DXGI_PRESENT_ALLOW_TEARING (0x00000200) as the Flags parameter when SyncInterval\nis 0. Change the call to `_swapChain.Present(0, DXGI_PRESENT_ALLOW_TEARING)` and\ncheck for DXGI_STATUS_OCCLUDED to skip rendering when the window is invisible.","locations":[{"ref":"src/Windows/Avalonia.Win32/DirectX/DxgiRenderTarget.cs:139","code":"  139 |                     _swapChain.Present((ushort)0U, (ushort)0U);","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Windows/Avalonia.Win32/DirectX/DxgiRenderTarget.cs#L139"}]},
{"id":"ERR_10","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In `TargetTypeConverter.ReflectionConverter.TryConvert`, when the incoming value is `AvaloniaProperty.UnsetValue` the code returns `Activator.CreateInstance(type)` and reports success. This works for value types (producing the default), but for reference types without a public parameterless constructor (e.g. `string`, interfaces, abstract classes) `Activator.CreateInstance` throws (`MissingMethodException`/`MissingMemberException`) instead of yielding a default. The sibling `DefaultConverter` deliberately returns `false` for `UnsetValue` for exactly this reason (see its comment). The reflection converter is used by `ReflectionBinding`; the unguarded call path is `BindingExpression.WriteValueToSource` (src/Avalonia.Base/Data/Core/BindingExpression.cs:287) which invokes `_targetTypeConverter.TryConvert(value, type, ...)` without first excluding `UnsetValue` (unlike the forward/fallback paths which are guarded).","fix":"Guard reference types (or types without a usable default) instead of blindly calling `Activator.CreateInstance`:\n```csharp\nelse if (value == AvaloniaProperty.UnsetValue)\n{\n    result = type.IsValueType ? Activator.CreateInstance(type) : null;\n    return true;\n}\n```","locations":[{"ref":"src/Avalonia.Base/Data/Core/TargetTypeConverter.cs:157-161","code":"  157 |             else if (value == AvaloniaProperty.UnsetValue)\n  158 |             {\n  159 |                 result = Activator.CreateInstance(type);\n  160 |                 return true;\n  161 |             }","lines":5,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Data/Core/TargetTypeConverter.cs#L157-L161"}]},
{"id":"ERR_11","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"`VisualTreeAttachmentEventArgs` dereferences `presentationSource.RootVisual` on the first line of the constructor (line 20) before the `presentationSource ?? throw new ArgumentNullException(...)` guard on line 23. If `presentationSource` is null the constructor throws a `NullReferenceException` instead of the intended `ArgumentNullException`, and the explicit null-check that runs afterward can never fire.","fix":"Validate `presentationSource` before using it, e.g. assign `PresentationSource` first with the null check, then read `RootVisual`:\n```csharp\nPresentationSource = presentationSource ?? throw new ArgumentNullException(nameof(presentationSource));\nRootVisual = presentationSource.RootVisual ??\n             throw new InvalidOperationException(\"PresentationSource must have a non-null RootVisual.\");\nAttachmentPoint = attachmentPoint;\n```","locations":[{"ref":"src/Avalonia.Base/VisualTreeAttachmentEventArgs.cs:18-24","code":"   18 |         public VisualTreeAttachmentEventArgs(Visual? attachmentPoint, IPresentationSource presentationSource)\n   19 |         {\n   20 |             RootVisual = presentationSource.RootVisual ??\n   21 |                          throw new InvalidOperationException(\"PresentationSource must have a non-null RootVisual.\");\n   22 |             AttachmentPoint = attachmentPoint;\n   23 |             PresentationSource = presentationSource ?? throw new ArgumentNullException(nameof(presentationSource));\n   24 |         }","lines":7,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/VisualTreeAttachmentEventArgs.cs#L18-L24"}]},
{"id":"ERR_12","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`RefreshCompletionDeferral.Complete` decrements the counter with `Interlocked.Decrement(ref _deferCount)` but then reads `_deferCount` in a separate, non-atomic `if (_deferCount == 0)`. If two threads complete concurrently they can both observe 0 and invoke `_deferredAction` twice (or a re-entrant `Get`/`Complete` can interleave and skip the invocation). The atomic result of the decrement should be used for the comparison.","fix":"Capture and test the return value: `if (Interlocked.Decrement(ref _deferCount) == 0) { _deferredAction?.Invoke(); }`.","locations":[{"ref":"src/Avalonia.Controls/PullToRefresh/RefreshCompletionDeferral.cs:19-27","code":"   19 |         public void Complete()\n   20 |         {\n   21 |             Interlocked.Decrement(ref _deferCount);\n   22 | \n   23 |             if (_deferCount == 0)\n   24 |             {\n   25 |                 _deferredAction?.Invoke();\n   26 |             }\n   27 |         }","lines":9,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/PullToRefresh/RefreshCompletionDeferral.cs#L19-L27"}]},
{"id":"ERR_13","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"UpdaterThread is an `async void` polling loop that calls `File.ReadAllText(_path)` with no try/catch. If the watched file is momentarily locked or being rewritten (a common case for an editor saving XAML, which is exactly this feature's purpose), the IOException propagates out of the async void method as an unhandled exception, terminating the previewer process instead of retrying on the next tick.","fix":"Wrap the `File.ReadAllText`/message-dispatch body in a try/catch that logs and continues the loop (e.g. `catch (Exception) { }` before the `await Task.Delay(100)`), so transient read failures do not kill the poller.","locations":[{"ref":"src/Avalonia.DesignerSupport/Remote/FileWatcherTransport.cs:71-89","code":"   71 |         async void UpdaterThread()\n   72 |         {\n   73 |             while (!_disposed)\n   74 |             {\n   75 |                 var data = File.ReadAllText(_path);\n   76 |                 if (data != _lastContents)\n   77 |                 {\n   78 |                     Console.WriteLine(\"Triggering XAML update\");\n   79 |                     _lastContents = data;\n   80 |                     _onMessage?.Invoke(this, new UpdateXamlMessage\n   81 |                     {\n   82 |                         Xaml = data,\n   83 |                         AssemblyPath = _appPath\n   84 |                     });\n   85 |                 }\n   86 | \n   87 |                 await Task.Delay(100);\n   88 |             }\n   89 |         }","lines":19,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.DesignerSupport/Remote/FileWatcherTransport.cs#L71-L89"}]},
{"id":"ERR_14","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"GetByGuid/GetGuid index into the dictionaries directly, throwing KeyNotFoundException for any unknown GUID or type. In the Bson reader loop this means a single unrecognized message type (e.g. from a peer running a different protocol version) throws, is caught by FireException, and permanently terminates the whole read loop instead of skipping the unknown message.","fix":"Use `TryGetValue` and return null / throw a typed, recoverable exception, and have the reader skip unknown message types rather than tearing down the connection.","locations":[{"ref":"src/Avalonia.Remote.Protocol/DefaultMessageTypeResolver.cs:34-35","code":"   34 |         public Type GetByGuid(Guid id) => _guidsToTypes[id];\n   35 |         public Guid GetGuid(Type type) => _typesToGuids[type];","lines":2,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Remote.Protocol/DefaultMessageTypeResolver.cs#L34-L35"}]},
{"id":"ERR_15","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In X11DropTarget.OnXdndDrop, if ProcessRawEvent throws an exception, 'drag.Dropped' remains false, and DisposeCurrentDrag will skip sending XdndFinished (line 196-199). The drag source then waits for XdndFinished until it times out (DragDropTimeoutManager fires). This produces a noticeable delay (SelectionHelper.Timeout) before the drag operation completes from the source's perspective.","fix":"Wrap ProcessRawEvent in a try/catch in OnXdndDrop. In the catch, set drag.Dropped = true with DragDropEffects.None as result so XdndFinished is still sent to unblock the source.","locations":[{"ref":"src/Avalonia.X11/Selections/DragDrop/X11DropTarget.cs:131-153","code":"  131 |     public void OnXdndDrop(in XClientMessageEvent message)\n  132 |     {\n  133 |         if (_currentDrag is not { } drag || message.ptr1 != drag.SourceWindow)\n  134 |             return;\n  135 | \n  136 |         var modifiers = GetModifiers();\n  137 | \n  138 |         var drop = new RawDragEvent(\n  139 |             _dragDropDevice,\n  140 |             RawDragEventType.Drop,\n  141 |             drag.InputRoot,\n  142 |             drag.LastPosition ?? default,\n  143 |             drag,\n  144 |             drag.ResultEffects,\n  145 |             modifiers);\n  146 | \n  147 |         _dragDropDevice.ProcessRawEvent(drop);\n  148 | \n  149 |         drag.ResultEffects = drop.Effects;\n  150 |         drag.Dropped = true;\n  151 | \n  152 |         DisposeCurrentDrag();\n  153 |     }","lines":23,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.X11/Selections/DragDrop/X11DropTarget.cs#L131-L153"},{"ref":"src/Avalonia.X11/Selections/DragDrop/X11DropTarget.cs:189-202","code":"  189 |     private void DisposeCurrentDrag()\n  190 |     {\n  191 |         if (_currentDrag is not { } drag)\n  192 |             return;\n  193 | \n  194 |         _currentDrag = null;\n  195 | \n  196 |         if (drag.Dropped)\n  197 |         {\n  198 |             var resultAction = XdndActionHelper.EffectsToAction(drag.ResultEffects, _atoms);\n  199 |             SendXdndMessage(_atoms.XdndFinished, drag, resultAction == 0 ? 0 : 1, resultAction, 0, 0);\n  200 |         }\n  201 | \n  202 |         drag.Dispose();","lines":14,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.X11/Selections/DragDrop/X11DropTarget.cs#L189-L202"}]},
{"id":"ERR_16","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"D3D11AngleWin32PlatformGraphics.CreateContext(IEnumerable<GlVersion>) throws an\nOpenGlException with the message \"Unable to create context with requested version\"\nwhen the version list does not include OpenGLES 3.x. However the check\n`versions.All(v => v.Type != GlProfileType.OpenGLES || v.Major != 3)` is an\noverly strict filter: it rejects any list that does not contain exactly an ES3\ncontext, including ES 3.1 or ES 3.2 requests (Major == 3 but Minor != 0). Since\nANGLE supports ES 3.1/3.2, this is an unnecessary restriction that would throw\nfor valid version requests.","fix":"Change the check to accept any OpenGLES 3.x version:\n`versions.All(v => v.Type != GlProfileType.OpenGLES || v.Major < 3)`.","locations":[{"ref":"src/Windows/Avalonia.Win32/OpenGl/Angle/D3D11AngleWin32PlatformGraphics.cs:61-64","code":"   61 |     public IGlContext CreateContext(IEnumerable<GlVersion>? versions)\n   62 |     {\n   63 |         if (versions is not null && versions.All(v => v.Type != GlProfileType.OpenGLES || v.Major != 3))\n   64 |             throw new OpenGlException(\"Unable to create context with requested version\");","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Windows/Avalonia.Win32/OpenGl/Angle/D3D11AngleWin32PlatformGraphics.cs#L61-L64"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"medium","description":"PointerButtonChangeType is declared as : ulong (8 bytes) but the native Win32 type POINTER_BUTTON_CHANGE_TYPE is a DWORD (4 bytes / uint). With Pack=1 layout, every struct that embeds POINTER_INFO is 4 bytes larger than its native counterpart: POINTER_INFO is 96 bytes in C# vs 92 bytes in Win32; POINTER_TOUCH_INFO is 144 vs 140; POINTER_PEN_INFO is 120 vs 116. Single-element P/Invoke calls (GetPointerInfo, GetPointerTouchInfo, GetPointerPenInfo) are unaffected because Windows writes 92 bytes into the C# allocation and the extra 4 bytes remain zero, leaving the enum comparison intact. However, array P/Invoke calls (GetPointerInfoHistory, GetPointerTouchInfoHistory, GetPointerPenInfoHistory) use MarshalAs(UnmanagedType.LPArray), which lays out a contiguous C-style array. Windows writes elements with native stride while the C# runtime reads with the inflated stride. Elements at index 1 and beyond are deserialized from the wrong memory offset, causing corrupted position, button, and timestamp data for all historical pointer events past the first.","fix":"Change 'public enum PointerButtonChangeType : ulong' to ': uint'. The values (0-10) fit comfortably in 32 bits. This restores native struct size and fixes array stride for all GetPointer*History calls.","locations":[{"ref":"src/Windows/Avalonia.Win32/Interop/UnmanagedMethods.cs:1001-1014","code":" 1001 |         public enum PointerButtonChangeType : ulong\n 1002 |         {\n 1003 |             POINTER_CHANGE_NONE,\n 1004 |             POINTER_CHANGE_FIRSTBUTTON_DOWN,\n 1005 |             POINTER_CHANGE_FIRSTBUTTON_UP,\n 1006 |             POINTER_CHANGE_SECONDBUTTON_DOWN,\n 1007 |             POINTER_CHANGE_SECONDBUTTON_UP,\n 1008 |             POINTER_CHANGE_THIRDBUTTON_DOWN,\n 1009 |             POINTER_CHANGE_THIRDBUTTON_UP,\n 1010 |             POINTER_CHANGE_FOURTHBUTTON_DOWN,\n 1011 |             POINTER_CHANGE_FOURTHBUTTON_UP,\n 1012 |             POINTER_CHANGE_FIFTHBUTTON_DOWN,\n 1013 |             POINTER_CHANGE_FIFTHBUTTON_UP\n 1014 |         }","lines":14,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Windows/Avalonia.Win32/Interop/UnmanagedMethods.cs#L1001-L1014"},{"ref":"src/Windows/Avalonia.Win32/Interop/UnmanagedMethods.cs:1080-1103","code":" 1080 |         [StructLayout(LayoutKind.Sequential, Pack = 1)]\n 1081 |         public struct POINTER_INFO\n 1082 |         {\n 1083 |             public PointerInputType pointerType;\n 1084 |             public uint pointerId;\n 1085 |             public uint frameId;\n 1086 |             public PointerFlags pointerFlags;\n 1087 |             public IntPtr sourceDevice;\n 1088 |             public IntPtr hwndTarget;\n 1089 |             public int ptPixelLocationX;\n 1090 |             public int ptPixelLocationY;\n 1091 |             public int ptHimetricLocationX;\n 1092 |             public int ptHimetricLocationY;\n 1093 |             public int ptPixelLocationRawX;\n 1094 |             public int ptPixelLocationRawY;\n 1095 |             public int ptHimetricLocationRawX;\n 1096 |             public int ptHimetricLocationRawY;\n 1097 |             public uint dwTime;\n 1098 |             public uint historyCount;\n 1099 |             public int inputData;\n 1100 |             public ModifierKeys dwKeyStates;\n 1101 |             public ulong PerformanceCount;\n 1102 |             public PointerButtonChangeType ButtonChangeType;\n 1103 |         }","lines":24,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Windows/Avalonia.Win32/Interop/UnmanagedMethods.cs#L1080-L1103"},{"ref":"src/Windows/Avalonia.Win32/Interop/UnmanagedMethods.cs:1238-1253","code":" 1238 |         public static extern bool GetPointerInfoHistory(uint pointerId, ref int entriesCount, [MarshalAs(UnmanagedType.LPArray), In, Out] POINTER_INFO[] pointerInfos);\n 1239 | \n 1240 |         [DllImport(\"user32.dll\", SetLastError = true)]\n 1241 |         public static extern bool GetPointerPenInfo(uint pointerId, out POINTER_PEN_INFO penInfo);\n 1242 | \n 1243 |         [DllImport(\"user32.dll\", SetLastError = true)]\n 1244 |         public static extern bool GetPointerPenInfoHistory(uint pointerId, ref int entriesCount, [MarshalAs(UnmanagedType.LPArray), In, Out] POINTER_PEN_INFO[] penInfos);\n 1245 | \n 1246 |         [DllImport(\"user32.dll\", SetLastError = true)]\n 1247 |         public static extern bool GetPointerTouchInfo(uint pointerId, out POINTER_TOUCH_INFO touchInfo);\n 1248 | \n 1249 |         [DllImport(\"user32.dll\", SetLastError = true)]\n 1250 |         public static extern bool GetPointerDeviceRects(IntPtr device, out RECT pointerDeviceRect, out RECT displayRect);\n 1251 | \n 1252 |         [DllImport(\"user32.dll\", SetLastError = true)]\n 1253 |         public static extern bool GetPointerTouchInfoHistory(uint pointerId, ref int entriesCount, [MarshalAs(UnmanagedType.LPArray), In, Out] POINTER_TOUCH_INFO[] touchInfos);","lines":16,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Windows/Avalonia.Win32/Interop/UnmanagedMethods.cs#L1238-L1253"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"medium","description":"`LayerFbo.Dispose` deletes all three GL objects (framebuffer, depth renderbuffer,\ncolor renderbuffer) at lines 91-93 and only then checks whether the EAGL context is\ncurrent at line 94. Because OpenGL ES operations on a non-current context produce\nundefined behavior (typically a no-op or a crash in the driver), the deletes at\n91-93 silently operate on the wrong context. The context check that follows then\nthrows `InvalidOperationException` even though the (incorrectly performed) deletes\nhave already \"executed.\" The GL resource names are leaked on the GPU.","fix":"Move the context check to the top of `Dispose`, before any GL calls: check that `_context == EAGLContext.CurrentContext` first, throw (or make the context current) if it is not, then perform the GL deletes. `SizeSynchronizedLayerFbo.Dispose` already checks first (line 138) - mirror that pattern.","locations":[{"ref":"src/iOS/Avalonia.iOS/Eagl/LayerFbo.cs:86-96","code":"   86 |         public void Dispose()\n   87 |         {\n   88 |             if(_disposed)\n   89 |                 return;\n   90 |             _disposed = true;\n   91 |             _gl.DeleteFramebuffer(_framebuffer);\n   92 |             _gl.DeleteRenderbuffer(_depthBuffer);\n   93 |             _gl.DeleteRenderbuffer(_renderbuffer);\n   94 |             if (_context != EAGLContext.CurrentContext)\n   95 |                 throw new InvalidOperationException(\"Associated EAGLContext is not current\");\n   96 |         }","lines":11,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/iOS/Avalonia.iOS/Eagl/LayerFbo.cs#L86-L96"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"AndroidStorageFile.GetVirtualFileStream() opens an AssetFileDescriptor via OpenTypedAssetFileDescriptor but neither closes the descriptor itself nor wraps it in a using block. The returned stream (from asset.CreateInputStream() or asset.CreateOutputStream()) is returned to the caller, but the AssetFileDescriptor is not closed when the stream is closed. AssetFileDescriptor holds a native file descriptor that will only be released by GC finalization.","fix":"Wrap the AssetFileDescriptor in a using statement or return a wrapper stream that closes both the inner stream and the descriptor on Dispose.","locations":[{"ref":"src/Android/Avalonia.Android/Platform/Storage/AndroidStorageItem.cs:521-537","code":"  521 |     private static Stream? GetVirtualFileStream(Context context, AndroidUri uri, bool isOutput)\n  522 |     {\n  523 |         var mimeTypes = context.ContentResolver?.GetStreamTypes(uri, FilePickerFileTypes.All.MimeTypes![0]);\n  524 |         if (mimeTypes?.Length >= 1)\n  525 |         {\n  526 |             var mimeType = mimeTypes[0];\n  527 |             var asset = context.ContentResolver!\n  528 |                 .OpenTypedAssetFileDescriptor(uri, mimeType, null);\n  529 | \n  530 |             var stream = isOutput\n  531 |                 ? asset?.CreateOutputStream()\n  532 |                 : asset?.CreateInputStream();\n  533 | \n  534 |             return stream;\n  535 |         }\n  536 | \n  537 |         return null;","lines":17,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Android/Avalonia.Android/Platform/Storage/AndroidStorageItem.cs#L521-L537"}]},
{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"very_easy","description":"SurfaceRenderTarget.Dispose() calls _canvas.Dispose() on a canvas that was obtained from SKSurface.Canvas. SKSurface owns its canvas; the canvas reference must not be independently disposed. Disposing it before disposing the surface can lead to use-after-free in Skia's native layer when the surface destructor subsequently touches the canvas.","fix":"Remove _canvas.Dispose(); - only dispose _surface (which disposes its canvas internally).","locations":[{"ref":"src/Skia/Avalonia.Skia/SurfaceRenderTarget.cs:98-101","code":"   98 |         {\n   99 |             _canvas.Dispose();\n  100 |             _surface.Dispose();\n  101 |         }","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Skia/Avalonia.Skia/SurfaceRenderTarget.cs#L98-L101"}]},
{"id":"API_5","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"very_easy","description":"`TextInputResponder.TextContentType` is initialized to `new NSString(\"text/plain\")`\n(line 74). The `UITextContentType` constants that iOS recognizes are strings like\n`UITextContentTypeUsername`, `UITextContentTypePassword`, etc. (all under the\n`com.apple.UIKit.field.` namespace). The MIME type `\"text/plain\"` is not a valid\n`UITextContentType` identifier; iOS silently ignores unknown content types, so the\nautofill system never activates for any field including password fields. This means\npassword managers and keychain autofill do not suggest credentials even when\n`IsSecureEntry` is true.","fix":"Set `TextContentType` to `UITextContentType.Password.ToString()` when `IsSecureEntry` is true, or to an empty string (`NSString.Empty`) to let the system infer the type. Wire the assignment to `SetOptions` so it mirrors the `ContentType`.","locations":[{"ref":"src/iOS/Avalonia.iOS/TextInputResponder.Properties.cs:74","code":"   74 |         [Export(\"textContentType\")] public NSString TextContentType { get; set; } = new NSString(\"text/plain\");","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/iOS/Avalonia.iOS/TextInputResponder.Properties.cs#L74"}]},
{"id":"API_6","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"ComPtr::operator& returns &_obj directly without calling Release first (unlike getPPV). Code that uses &ptr to obtain an output pointer (e.g. SomeAPI(&ptr)) bypasses the existing object without releasing it, leaking the prior reference. getPPV exists for this purpose but operator& is still exposed and will silently cause leaks.","fix":"Either remove operator& or make it behave like getPPV by releasing the current object first.","locations":[{"ref":"native/Avalonia.Native/inc/comimpl.h:137-140","code":"  137 |     TInterface** operator&()\n  138 |     {\n  139 |         return &_obj;\n  140 |     }","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/native/Avalonia.Native/inc/comimpl.h#L137-L140"}]},
{"id":"API_7","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"The property/method accessor plugins registered as process-wide singletons in `BindingPlugins` (`InpcPropertyAccessorPlugin` and `ReflectionMethodAccessorPlugin`) cache reflection lookups in plain non-concurrent `Dictionary<(Type,string), ...>` fields and write to them from `Match`/`Start`. These instances are the shared `s_propertyAccessors` list used by every binding. Concurrent binding evaluation from more than one thread would race on `Dictionary.Add`, which can corrupt the dictionary (torn buckets leading to an infinite loop or `IndexOutOfRangeException`), not merely lose a cache entry. Avalonia bindings are normally UI-thread bound, hence low severity, but the caches offer no protection if that assumption is violated.","fix":"Use a `ConcurrentDictionary<(Type,string), PropertyInfo?>` / `ConcurrentDictionary<(Type,string), MethodInfo?>` for the caches (with `GetOrAdd`), or guard the dictionary access with a lock, so concurrent `Match`/`Start` calls cannot corrupt the shared cache.","locations":[{"ref":"src/Avalonia.Base/Data/Core/Plugins/InpcPropertyAccessorPlugin.cs:17-18","code":"   17 |         private readonly Dictionary<(Type, string), PropertyInfo?> _propertyLookup =\n   18 |             new Dictionary<(Type, string), PropertyInfo?>();","lines":2,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Data/Core/Plugins/InpcPropertyAccessorPlugin.cs#L17-L18"},{"ref":"src/Avalonia.Base/Data/Core/Plugins/InpcPropertyAccessorPlugin.cs:74-94","code":"   74 |         private PropertyInfo? TryFindAndCacheProperty(\n   75 |             [DynamicallyAccessedMembers(DynamicallyAccessedMemberTypes.PublicProperties | DynamicallyAccessedMemberTypes.NonPublicProperties)] Type type, string propertyName)\n   76 |         {\n   77 |             PropertyInfo? found = null;\n   78 | \n   79 |             var properties = type.GetProperties(PropertyBindingFlags);\n   80 | \n   81 |             foreach (var propertyInfo in properties)\n   82 |             {\n   83 |                 if (propertyInfo.Name == propertyName)\n   84 |                 {\n   85 |                     found = propertyInfo;\n   86 | \n   87 |                     break;\n   88 |                 }\n   89 |             }\n   90 | \n   91 |             _propertyLookup.Add((type, propertyName), found);\n   92 | \n   93 |             return found;\n   94 |         }","lines":21,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Data/Core/Plugins/InpcPropertyAccessorPlugin.cs#L74-L94"}]},
{"id":"API_8","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`CalendarDatePicker.DateTimeToString` wraps an already-formatted date string in a redundant `string.Format` call: `string.Format(CultureInfo.CurrentCulture, d.ToString(pattern, dtfi))`. `d.ToString(...)` already produces the final string; passing it as the `format` argument of `string.Format` (with no format arguments) is pointless work and is actively harmful when the resulting string contains literal brace characters. With `SelectedDateFormat = Custom` and a `CustomDateFormatString` that emits `{` or `}` (e.g. a pattern using literal braces), the produced string becomes an invalid composite format string and `string.Format` throws `FormatException` on an otherwise valid date. The `d.ToString(...)` result should be returned directly.","fix":"Return the formatted value directly instead of re-running it through `string.Format`:\n```csharp\ncase CalendarDatePickerFormat.Short:\n    return d.ToString(dtfi.ShortDatePattern, dtfi);\ncase CalendarDatePickerFormat.Long:\n    return d.ToString(dtfi.LongDatePattern, dtfi);\ncase CalendarDatePickerFormat.Custom:\n    return d.ToString(CustomDateFormatString, dtfi);\n```","locations":[{"ref":"src/Avalonia.Controls/CalendarDatePicker/CalendarDatePicker.cs:773-781","code":"  773 |             switch (SelectedDateFormat)\n  774 |             {\n  775 |                 case CalendarDatePickerFormat.Short:\n  776 |                     return string.Format(CultureInfo.CurrentCulture, d.ToString(dtfi.ShortDatePattern, dtfi));\n  777 |                 case CalendarDatePickerFormat.Long:\n  778 |                     return string.Format(CultureInfo.CurrentCulture, d.ToString(dtfi.LongDatePattern, dtfi));\n  779 |                 case CalendarDatePickerFormat.Custom:\n  780 |                     return string.Format(CultureInfo.CurrentCulture, d.ToString(CustomDateFormatString, dtfi));\n  781 |             }","lines":9,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/CalendarDatePicker/CalendarDatePicker.cs#L773-L781"}]},
{"id":"API_9","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"MountedVolumeInfo implements IEquatable<MountedVolumeInfo>.Equals but overrides neither object.Equals nor GetHashCode. Value-based equality is therefore only used when the static/generic type is MountedVolumeInfo; when stored in a HashSet/Dictionary or compared as object, reference equality (and the default hash) is used, breaking deduplication/lookup that this value type is clearly meant to support. Equals also dereferences other.VolumePath/other.VolumeLabel while only null-guarding other.VolumeSizeBytes, which relies on the && short-circuit to avoid an NRE and is fragile.","fix":"Add `public override bool Equals(object? obj) => Equals(obj as MountedVolumeInfo);` and `public override int GetHashCode()` combining VolumeSizeBytes/VolumePath/VolumeLabel, and add an explicit `if (other is null) return false;` at the top of the typed Equals.","locations":[{"ref":"src/Avalonia.Controls/Platform/Dialogs/MountedDriveInfo.cs:10-22","code":"   10 |     public class MountedVolumeInfo : IEquatable<MountedVolumeInfo>\n   11 |     {\n   12 |         public string? VolumeLabel { get; set; }\n   13 |         public string? VolumePath { get; set; }\n   14 |         public ulong VolumeSizeBytes { get; set; }\n   15 | \n   16 |         public bool Equals(MountedVolumeInfo? other)\n   17 |         {\n   18 |             return this.VolumeSizeBytes.Equals(other?.VolumeSizeBytes) &&\n   19 |                    Equals(this.VolumePath, other.VolumePath) &&\n   20 |                    (this.VolumeLabel ?? string.Empty).Equals(other.VolumeLabel ?? string.Empty);\n   21 |         }\n   22 |     }","lines":13,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/Platform/Dialogs/MountedDriveInfo.cs#L10-L22"}]},
{"id":"API_10","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"IDisposable.Dispose is implemented as `async void`. After the synchronous cleanup it awaits DisconnectAsync, so disposal returns to the caller before the D-Bus context is actually destroyed (fire-and-forget), and any exception thrown after the first await cannot be observed by the caller and escapes as an unobserved async-void exception. Callers that dispose and immediately tear down the connection may race with the still-pending DisconnectAsync.","fix":"Either implement IAsyncDisposable and have callers await DisposeAsync, or make Dispose fully synchronous (queue the DisconnectAsync onto the call queue and don't await it in a void method), and wrap the post-await work so exceptions are logged rather than thrown from async void.","locations":[{"ref":"src/Avalonia.FreeDesktop/DBusIme/DBusTextInputMethodBase.cs:208-227","code":"  208 |         public async void Dispose()\n  209 |         {\n  210 |             _watchCts?.Cancel();\n  211 |             foreach(var d in _disposables)\n  212 |                 d.Dispose();\n  213 |             _disposables.Clear();\n  214 |             if (!IsConnected)\n  215 |                 return;\n  216 |             try\n  217 |             {\n  218 |                 await DisconnectAsync();\n  219 |             }\n  220 |             catch (Exception ex)\n  221 |             {\n  222 |                 Logger.TryGet(LogEventLevel.Error, \"IME\")\n  223 |                     ?.Log(this, \"Error while destroying the context:\\n\" + ex);\n  224 |             }\n  225 | \n  226 |             _currentName = null;\n  227 |         }","lines":20,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.FreeDesktop/DBusIme/DBusTextInputMethodBase.cs#L208-L227"}]},
{"id":"API_11","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"In the XDND drag source (X11DragSource), no explicit XGrabPointer call is made. The code relies on the implicit pointer grab from the triggering ButtonPress event (comment at line 86: 'Assume we have an implicit grab here'). However, calling 'triggerEvent.Pointer.Capture(null)' at line 32 releases the Avalonia-level capture. If the X11 implicit grab was already released before DoDragDropAsync is called, pointer events from outside the source window will not be delivered, silently breaking cross-window drag.","fix":"After releasing the Avalonia pointer capture, explicitly call XGrabPointer on the source window to ensure pointer events are captured throughout the drag operation, and update UngrabPointer to call XUngrabPointer on the explicit grab.","locations":[{"ref":"src/Avalonia.X11/Selections/DragDrop/X11DragSource.cs:32","code":"   32 |         triggerEvent.Pointer.Capture(null);","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.X11/Selections/DragDrop/X11DragSource.cs#L32"},{"ref":"src/Avalonia.X11/Selections/DragDrop/X11DragSource.cs:86-87","code":"   86 |             // Assume we have an implicit grab here.\n   87 |             _pointerGrabbed = true;","lines":2,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.X11/Selections/DragDrop/X11DragSource.cs#L86-L87"}]},
{"id":"API_12","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"GetWindowLongPtrW (aliased as GetWindowLongPtr) is declared with return type 'uint' (32 bits). On 64-bit Windows, GetWindowLongPtrW returns a LONG_PTR (64 bits). For GWL_STYLE / GWL_EXSTYLE the values are always 32-bit style flags so truncation does not occur in practice. However the declaration violates the P/Invoke contract and would silently truncate pointer-sized values (e.g., GWL_WNDPROC or GWL_USERDATA on 64-bit) if the function is ever called with those indices.","fix":"Change the return type to 'nint' (or 'IntPtr') to match the 64-bit LONG_PTR return type of GetWindowLongPtrW. The wrapper GetWindowLong() that casts the result to WindowStyles would need a corresponding update.","locations":[{"ref":"src/Windows/Avalonia.Win32/Interop/UnmanagedMethods.cs:1357-1358","code":" 1357 |         [DllImport(\"user32.dll\", SetLastError = true, EntryPoint = \"GetWindowLongPtrW\", ExactSpelling = true)]\n 1358 |         public static extern uint GetWindowLongPtr(IntPtr hWnd, int nIndex);","lines":2,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Windows/Avalonia.Win32/Interop/UnmanagedMethods.cs#L1357-L1358"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"very_easy","description":"`RecomputeOwnProperties` reads the three delay-propagate flags into locals, then resets them - but the reset chain assigns `_delayPropagateIsDirtyForRender` twice and never clears `_delayPropagateNeedsBoundsUpdate`. `_delayPropagateNeedsBoundsUpdate` is set to `true` in ServerCompositionVisual.DirtyInputs.cs:161 and, because it is never cleared, `setDirtyBounds` stays `true` on every subsequent recompute for that visual. This causes `PropagateFlags(needsBoundingBoxUpdate: true, ...)` to walk and mark the parent chain for a bounding-box update on every update pass forever after the flag is first set - permanent redundant per-frame work.","fix":"Reset all three distinct fields (the middle assignment should be `_delayPropagateNeedsBoundsUpdate`):\n```csharp\n_delayPropagateIsDirtyForRender =\n    _delayPropagateHasExtraDirtyRects =\n        _delayPropagateNeedsBoundsUpdate = false;\n```","locations":[{"ref":"src/Avalonia.Base/Rendering/Composition/Server/ServerCompositionVisual/ServerCompositionVisual.ComputedProperties.cs:119-121","code":"  119 |         _delayPropagateIsDirtyForRender =\n  120 |             _delayPropagateHasExtraDirtyRects =\n  121 |                 _delayPropagateIsDirtyForRender = false;","lines":3,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Rendering/Composition/Server/ServerCompositionVisual/ServerCompositionVisual.ComputedProperties.cs#L119-L121"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"SurfaceInfo.Size (a property getter) calls XResizeWindow as a side effect on every read (line 328). This is unexpected for a property getter and means any code that reads the size also triggers a resize X11 call. This property is invoked from the render thread to synchronize the render window size, but the side-effect-in-getter pattern is fragile: reading Size twice will call XResizeWindow twice, and the side effect is invisible to callers.","fix":"Extract the resize logic into a dedicated method (e.g., 'SyncRenderWindowSize') and have the Size getter return only the current geometry. Callers that need the resize behavior should call SyncRenderWindowSize explicitly.","locations":[{"ref":"src/Avalonia.X11/X11Window.cs:333-343","code":"  333 |             public PixelSize Size\n  334 |             {\n  335 |                 get\n  336 |                 {\n  337 |                     XLockDisplay(_display);\n  338 |                     XGetGeometry(_display, _parent, out var geo);\n  339 |                     XResizeWindow(_display, Handle, geo.width, geo.height);\n  340 |                     XUnlockDisplay(_display);\n  341 |                     return new PixelSize(geo.width, geo.height);\n  342 |                 }\n  343 |             }","lines":11,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.X11/X11Window.cs#L333-L343"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"The per-frame render path allocates a new page-flip callback delegate, pins it with GCHandle.Alloc, and builds a DrmEventContext plus a Marshal.GetFunctionPointerForDelegate call on every single frame (inside RenderSession.Dispose, which runs once per presented frame). This produces garbage and marshalling overhead on the hot rendering loop; these objects can be created once and reused for the lifetime of the output.","fix":"Create the `DrmEventPageFlipHandlerDelegate`, its `GCHandle`, and the `DrmEventContext` once (e.g. as fields initialized in `Init`) and reuse them each frame, communicating the flip completion via a field instead of a captured local.","locations":[{"ref":"src/Linux/Avalonia.LinuxFramebuffer/Output/DrmOutput.cs:480-498","code":"  480 |                         DrmEventPageFlipHandlerDelegate flipCb =\n  481 |                             (int fd, uint sequence, uint tv_sec, uint tv_usec, void* user_data) =>\n  482 |                             {\n  483 |                                 waitingForFlip = false;\n  484 |                             };\n  485 |                         var cbHandle = GCHandle.Alloc(flipCb);\n  486 |                         var ctx = new DrmEventContext\n  487 |                         {\n  488 |                             version = 4,\n  489 |                             page_flip_handler = Marshal.GetFunctionPointerForDelegate(flipCb)\n  490 |                         };\n  491 |                         while (waitingForFlip)\n  492 |                         {\n  493 |                             var pfd = new PollFd {events = 1, fd = _parent._card.Fd};\n  494 |                             poll(&pfd, new IntPtr(1), -1);\n  495 |                             drmHandleEvent(_parent._card.Fd, &ctx);\n  496 |                         }\n  497 | \n  498 |                         cbHandle.Free();","lines":19,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Linux/Avalonia.LinuxFramebuffer/Output/DrmOutput.cs#L480-L498"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"medium","difficulty":"very_easy","description":"DrawingContextImpl.ConfigureGradientBrush() calls gradientBrush.GradientStops.Select(...).ToArray() twice - once for stop colors and once for stop offsets - iterating the stop collection twice and allocating two arrays per brush paint call. This occurs in hot rendering paths.","fix":"Iterate GradientStops once and fill both arrays in a single pass.","locations":[{"ref":"src/Skia/Avalonia.Skia/DrawingContextImpl.cs:913-914","code":"  913 |             var stopColors = gradientBrush.GradientStops.Select(s => s.Color.ToSKColor()).ToArray();\n  914 |             var stopOffsets = gradientBrush.GradientStops.Select(s => (float)s.Offset).ToArray();","lines":2,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Skia/Avalonia.Skia/DrawingContextImpl.cs#L913-L914"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"AndroidMotionEventsHelper uses a static shared PooledList<RawPointerPoint> (s_intermediatePointsPooledList) for intermediate touch points. This list is captured inside a Lazy<> lambda and the Lazy is stored in RawTouchEventArgs. If two move events are dispatched before both Lazy values are evaluated, or if the Lazy is evaluated on a different thread, the shared list will be cleared and refilled, corrupting the first event's intermediate points.","fix":"Use a new list per event instead of a shared static, or ensure the Lazy is evaluated synchronously before processing the next event.","locations":[{"ref":"src/Android/Avalonia.Android/Platform/Specific/Helpers/AndroidMotionEventsHelper.cs:15","code":"   15 |         private static readonly PooledList<RawPointerPoint> s_intermediatePointsPooledList = new(ClearMode.Never);","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Android/Avalonia.Android/Platform/Specific/Helpers/AndroidMotionEventsHelper.cs#L15"},{"ref":"src/Android/Avalonia.Android/Platform/Specific/Helpers/AndroidMotionEventsHelper.cs:65-78","code":"   65 |                         IntermediatePoints = new Lazy<IReadOnlyList<RawPointerPoint>?>(() =>\n   66 |                         {\n   67 |                             var site = e.HistorySize;\n   68 |                             s_intermediatePointsPooledList.Clear();\n   69 |                             s_intermediatePointsPooledList.Capacity = site;\n   70 | \n   71 |                             for (int pos = 0; pos < site; pos++)\n   72 |                             {\n   73 |                                 s_intermediatePointsPooledList.Add(CreateHistoricalPoint(e, index, pos));\n   74 |                             }\n   75 | \n   76 |                             return s_intermediatePointsPooledList;\n   77 |                         })\n   78 |                     };","lines":14,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Android/Avalonia.Android/Platform/Specific/Helpers/AndroidMotionEventsHelper.cs#L65-L78"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`BindingExpressionGrammar` keeps a single process-wide mutable `static readonly List<INode> s_pool` that `ParseToPooledList` clears and reuses for every reflection-binding parse (called from `ReflectionBinding.CreateInstance`). This is not thread-safe: if two threads parse binding paths concurrently (or a re-entrant parse occurs), `s_pool.Clear()` on one thread corrupts the list another thread is still filling/reading, producing wrong AST nodes or collection-mutation exceptions. The pool saves one small list allocation per binding creation, which is negligible compared to the reflection work that follows.","fix":"Either allocate a fresh list per call (drop the pool entirely, matching `Parse`) or make the pool `[ThreadStatic]` so each thread has its own instance. The safest minimal change is to remove `s_pool` and have `ParseToPooledList` allocate `new List<INode>()` like `Parse` does.","locations":[{"ref":"src/Avalonia.Base/Data/Core/Parsers/BindingExpressionGrammar.cs:19-41","code":"   19 |         private static readonly List<INode> s_pool = new();\n   20 | \n   21 |         public static (List<INode> Nodes, SourceMode Mode) Parse(string text)\n   22 |         {\n   23 |             var r = new CharacterReader(text.AsSpan());\n   24 |             return Parse(ref r);\n   25 |         }\n   26 | \n   27 |         public static (List<INode> Nodes, SourceMode Mode) Parse(ref CharacterReader r)\n   28 |         {\n   29 |             var result = new List<INode>();\n   30 |             var mode = Parse(ref r, result);\n   31 |             return (result, mode);\n   32 |         }\n   33 | \n   34 |         public static (List<INode> Nodes, SourceMode Mode) ParseToPooledList(ref CharacterReader r)\n   35 |         {\n   36 |             // Most of the time the list will be passed to `ExpressionNodeFactory.CreateFromAst`\n   37 |             // and then discarded so as a micro-optimization we can reuse the list.\n   38 |             s_pool.Clear();\n   39 |             var mode = Parse(ref r, s_pool);\n   40 |             return (s_pool, mode);\n   41 |         }","lines":23,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Data/Core/Parsers/BindingExpressionGrammar.cs#L19-L41"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`FeatureListTable.Load` deduplicates feature tags with `tempFeatures.Contains(tag)` inside the parse loop, giving O(n^2) behaviour. `featureCount` is an untrusted `uint16` (up to 65535), so a crafted font with a maximal, mostly-unique feature list forces ~4 billion span comparisons on first access (a multi-second hang during `GlyphTypeface.LoadSupportedFeatures`). Realistic fonts have few features, but the input is attacker-influenced.","fix":"Collect tags into a `HashSet<OpenTypeTag>` (O(1) membership) instead of linear `Contains` scans, or bound `featureCount` to a sane maximum before parsing.","locations":[{"ref":"src/Avalonia.Base/Media/Fonts/Tables/FeatureListTable.cs:104-134","code":"  104 |             int uniqueCount = 0;\n  105 | \n  106 |             for (var i = 0; i < featureCount; i++)\n  107 |             {\n  108 |                 // FeatureRecord\n  109 |                 // +----------+---------------+--------------------------------------------------------+\n  110 |                 // | Type     | Name          | Description                                            |\n  111 |                 // +==========+===============+========================================================+\n  112 |                 // | Tag      | featureTag    | 4-byte feature identification tag                      |\n  113 |                 // +----------+---------------+--------------------------------------------------------+\n  114 |                 // | Offset16 | featureOffset | Offset to Feature table, from beginning of FeatureList |\n  115 |                 // +----------+---------------+--------------------------------------------------------+\n  116 |                 var featureTag = reader.ReadUInt32();\n  117 |                 reader.ReadOffset16();\n  118 | \n  119 |                 var tag = new OpenTypeTag(featureTag);\n  120 | \n  121 |                 // Check for duplicates in already added features\n  122 |                 bool isDuplicate = tempFeatures.Contains(tag);\n  123 | \n  124 |                 if (!isDuplicate)\n  125 |                 {\n  126 |                     tempFeatures[uniqueCount++] = tag;\n  127 |                 }\n  128 |             }\n  129 | \n  130 |             // Create array with only unique features\n  131 |             var features = new OpenTypeTag[uniqueCount];\n  132 |             tempFeatures.Slice(0, uniqueCount).CopyTo(features);\n  133 | \n  134 |             return new FeatureListTable(features);","lines":31,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Media/Fonts/Tables/FeatureListTable.cs#L104-L134"}]},
{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"ArrangeOverride unconditionally raises HorizontalSnapPointsChanged/VerticalSnapPointsChanged on every arrange pass, even when the snap points did not actually change. Because arrange runs frequently (any layout invalidation), this produces a bubbling routed event storm and can trigger redundant snap-point recalculation in listeners such as ScrollViewer.","fix":"Only raise the snap-points-changed event when the computed snap points/child arrangement actually change (track and compare the previous values), rather than on every ArrangeOverride call.","locations":[{"ref":"src/Avalonia.Controls/StackPanel.cs:345","code":"  345 |             RaiseEvent(new RoutedEventArgs(Orientation == Orientation.Horizontal ? HorizontalSnapPointsChangedEvent : VerticalSnapPointsChangedEvent));","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/StackPanel.cs#L345"}]},
{"id":"PERF_9","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"GetCursorPos (called during BeginMoveDrag, BeginResizeDrag, and drawn-decoration mouse handling) invokes QueryPointer which calls XGrabServer. XGrabServer freezes all other X11 clients from interacting with the server while the pointer window tree is walked. On slow connections or busy desktops, this can cause visible freezes. The pointer position for these operations could be read with a simple XQueryPointer call (no grab needed) since the tree walk to find the deepest child is unnecessary here.","fix":"For GetCursorPos when called from drag/resize initiation, use XQueryPointer directly instead of QueryPointer. The full XGrabServer-based tree walk is needed only when the deepest child window must be found; cursor position for move/resize can be read with a single XQueryPointer call on the root window.","locations":[{"ref":"src/Avalonia.X11/XLib.cs:788-815","code":"  788 |         public static void QueryPointer (IntPtr display, IntPtr w, out IntPtr root, out IntPtr child,\n  789 |             out int root_x, out int root_y, out int child_x, out int child_y,\n  790 |             out XModifierMask mask)\n  791 |         {\n  792 | \n  793 |             IntPtr c;\n  794 | \n  795 |             XGrabServer (display);\n  796 | \n  797 |             XQueryPointer(display, w, out root, out c,\n  798 |                 out root_x, out root_y, out child_x, out child_y,\n  799 |                 out mask);\n  800 | \n  801 |             if (root != w)\n  802 |                 c = root;\n  803 | \n  804 |             IntPtr child_last = IntPtr.Zero;\n  805 |             while (c != IntPtr.Zero) {\n  806 |                 child_last = c;\n  807 |                 XQueryPointer(display, c, out root, out c,\n  808 |                     out root_x, out root_y, out child_x, out child_y,\n  809 |                     out mask);\n  810 |             }\n  811 |             XUngrabServer (display);\n  812 |             XFlush (display);\n  813 | \n  814 |             child = child_last;\n  815 |         }","lines":28,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.X11/XLib.cs#L788-L815"},{"ref":"src/Avalonia.X11/X11Window.cs:1032-1037","code":" 1032 |                             var pos = GetCursorPos(_x11);\n 1033 |                             XUngrabPointer(_x11.Display, IntPtr.Zero);\n 1034 |                             SendNetWMMessage(_x11.Atoms._NET_WM_MOVERESIZE,\n 1035 |                                 (IntPtr)pos.x, (IntPtr)pos.y,\n 1036 |                                 (IntPtr)moveResizeSide.Value,\n 1037 |                                 (IntPtr)1, (IntPtr)1);","lines":6,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.X11/X11Window.cs#L1032-L1037"},{"ref":"src/Avalonia.X11/X11Window.cs:1466-1469","code":" 1466 |             var pos = GetCursorPos(_x11);\n 1467 |             XUngrabPointer(_x11.Display, new IntPtr(0));\n 1468 |             SendNetWMMessage (_x11.Atoms._NET_WM_MOVERESIZE, (IntPtr) pos.x, (IntPtr) pos.y,\n 1469 |                 (IntPtr) side,","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.X11/X11Window.cs#L1466-L1469"}]},
{"id":"PERF_10","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"DxgiConnection.GetBestOutputToVWaitOn() retrieves monitor frequencies via\nGetAllMonitorFrequencies() on every call, which internally calls GetMonitorInfo and\nEnumDisplaySettings for every monitor. This function is called both during startup\nand after every WaitForVBlank failure (line 112). On systems with many monitors\nthis is an unnecessary repeated enumeration. Additionally the DXGI output selected\nis based only on the highest refresh rate monitor regardless of which monitor the\napplication window is on.","fix":"Cache the monitor frequency map and the chosen output. Invalidate the cache on\nWM_DISPLAYCHANGE. Consider selecting the output that contains the application's\nmain window rather than always the highest-refresh monitor.","locations":[{"ref":"src/Windows/Avalonia.Win32/DirectX/DxgiConnection.cs:134-184","code":"  134 |         private void GetBestOutputToVWaitOn()\n  135 |         {\n  136 |             double highestRefreshRate = 0.0d;\n  137 | \n  138 |             // IDXGIFactory Guid: [Guid(\"7B7166EC-21C7-44AE-B21A-C9AE321AE369\")]\n  139 |             Guid factoryGuid = MicroComRuntime.GetGuidFor(typeof(IDXGIFactory));\n  140 |             CreateDXGIFactory(ref factoryGuid, out var factPointer);\n  141 | \n  142 |             using var fact = MicroComRuntime.CreateProxyFor<IDXGIFactory>(factPointer, true);\n  143 | \n  144 |             void* adapterPointer = null;\n  145 | \n  146 |             ushort adapterIndex = 0;\n  147 | \n  148 |             Dictionary<HMONITOR /*MonitorHandler*/, uint /*Frequency*/> monitorFrequencies = GetAllMonitorFrequencies();\n  149 | \n  150 |             // this looks odd, but that's just how one enumerates adapters in DXGI \n  151 |             while (fact.EnumAdapters(adapterIndex, &adapterPointer) == 0)\n  152 |             {\n  153 |                 using var adapter = MicroComRuntime.CreateProxyFor<IDXGIAdapter>(adapterPointer, true);\n  154 |                 void* outputPointer = null;\n  155 |                 ushort outputIndex = 0;\n  156 |                 while (adapter.EnumOutputs(outputIndex, &outputPointer) == 0)\n  157 |                 {\n  158 |                     using var output = MicroComRuntime.CreateProxyFor<IDXGIOutput>(outputPointer, true);\n  159 |                     DXGI_OUTPUT_DESC outputDesc = output.Desc;\n  160 | \n  161 |                     var hMonitor = new HMONITOR(outputDesc.Monitor.Value);\n  162 | \n  163 |                     var frequency =\n  164 |                         monitorFrequencies.TryGetValue(hMonitor, out uint frequencyValue) ?\n  165 |                             frequencyValue :\n  166 |                             highestRefreshRate;\n  167 | \n  168 |                     if (highestRefreshRate < frequency)\n  169 |                     {\n  170 |                         // ooh I like this output! \n  171 |                         if (_output is not null)\n  172 |                         {\n  173 |                             _output.Dispose();\n  174 |                             _output = null;\n  175 |                         }\n  176 |                         _output = MicroComRuntime.CloneReference(output);\n  177 |                         highestRefreshRate = frequency;\n  178 |                     }\n  179 |                     // and then increment index to move onto the next monitor \n  180 |                     outputIndex++;\n  181 |                 }\n  182 |                 // and then increment index to move onto the next display adapater\n  183 |                 adapterIndex++;\n  184 |             }","lines":51,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Windows/Avalonia.Win32/DirectX/DxgiConnection.cs#L134-L184"},{"ref":"src/Windows/Avalonia.Win32/DirectX/DxgiConnection.cs:188-213","code":"  188 |         private unsafe Dictionary<HMONITOR /*MonitorHandler*/, uint /*Frequency*/> GetAllMonitorFrequencies()\n  189 |         {\n  190 |             var monitorHandlers = ScreenImpl.GetAllDisplayMonitorHandlers();\n  191 |             var dictionary = new Dictionary<HMONITOR /*MonitorHandler*/, uint /*Frequency*/>(monitorHandlers.Count);\n  192 | \n  193 |             foreach (var monitorHandler in monitorHandlers)\n  194 |             {\n  195 |                 var info = MONITORINFOEX.Create();\n  196 |                 var hMonitor = new HMONITOR(monitorHandler);\n  197 |                 PInvoke.GetMonitorInfo(hMonitor, (MONITORINFO*)&info);\n  198 | \n  199 |                 var deviceMode = new DEVMODEW\n  200 |                 {\n  201 |                     dmFields = DEVMODE_FIELD_FLAGS.DM_DISPLAYORIENTATION | DEVMODE_FIELD_FLAGS.DM_DISPLAYFREQUENCY,\n  202 |                     dmSize = (ushort)Marshal.SizeOf<DEVMODEW>()\n  203 |                 };\n  204 |                 PInvoke.EnumDisplaySettings(info.szDevice.ToString(), ENUM_DISPLAY_SETTINGS_MODE.ENUM_CURRENT_SETTINGS,\n  205 |                     ref deviceMode);\n  206 | \n  207 |                 var frequency = deviceMode.dmDisplayFrequency;\n  208 | \n  209 |                 dictionary[hMonitor] = frequency;\n  210 |             }\n  211 | \n  212 |             return dictionary;\n  213 |         }","lines":26,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Windows/Avalonia.Win32/DirectX/DxgiConnection.cs#L188-L213"}]},
{"id":"PERF_11","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`InputHandler.s_intermediatePointsPooledList` is a `static readonly` shared list\n(line 17). Its `Lazy<>` factory (lines 92-105) captures `thisEvent` and the loop\nvariable `t` (the `UITouch` object) by closure, but the list itself is mutated\ninside the lazy. Because the list is shared across all touch points processed in a\nsingle call to `Handle`, and multiple `RawTouchEventArgs` objects each carry their\nown `Lazy<>` that references the same list, evaluating the lazy for the first event\nclears and repopulates the list, and evaluating it for subsequent events from the\nsame batch would produce wrong results (the list would have been cleared and\nrefilled for the later touch). In practice only one Lazy tends to be evaluated per\nframe so this does not visibly corrupt data, but it is a latent correctness hazard.","fix":"Make the pooled list an instance field instead of static, or capture a local copy of the list reference inside the lambda, or materialize the coalesced points eagerly and pass the list directly instead of using Lazy.","locations":[{"ref":"src/iOS/Avalonia.iOS/InputHandler.cs:17","code":"   17 |     private static readonly PooledList<RawPointerPoint> s_intermediatePointsPooledList = new(ClearMode.Never);","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/iOS/Avalonia.iOS/InputHandler.cs#L17"},{"ref":"src/iOS/Avalonia.iOS/InputHandler.cs:92-106","code":"   92 |                 IntermediatePoints = evt is {} thisEvent ? new Lazy<IReadOnlyList<RawPointerPoint>?>(() =>\n   93 |                 {\n   94 |                     var coalesced = thisEvent.GetCoalescedTouches(t) ?? Array.Empty<UITouch>();\n   95 |                     s_intermediatePointsPooledList.Clear();\n   96 |                     s_intermediatePointsPooledList.Capacity = coalesced.Length - 1;\n   97 | \n   98 |                     // Skip the last one, as it is already processed point.\n   99 |                     for (var i = 0; i < coalesced.Length - 1; i++)\n  100 |                     {\n  101 |                         s_intermediatePointsPooledList.Add(ToPointerPoint(coalesced[i]));\n  102 |                     }\n  103 | \n  104 |                     return s_intermediatePointsPooledList;\n  105 |                 }) : null\n  106 |             };","lines":15,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/iOS/Avalonia.iOS/InputHandler.cs#L92-L106"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"medium","difficulty":"medium","description":"AtSpiCollectionHandler implements the full AT-SPI Collection interface (GetMatches, GetMatchesTo, GetMatchesFrom, match rules, etc.) but is never instantiated or registered anywhere. AtSpiNode.BuildAndRegisterHandlers never adds a Collection handler to its D-Bus targets, GetSupportedInterfaces never returns IfaceCollection, and IfaceCollection is defined but unused. As a result the entire Collection interface (used by ATs like Orca for efficient tree queries) is unreachable, and a substantial amount of code is dead.","fix":"Either wire the Collection interface up (instantiate an `AtSpiCollectionHandler` in `BuildAndRegisterHandlers`, add it to `targets`, and include `IfaceCollection` in `GetSupportedInterfaces`), or delete the unused handler and the `IfaceCollection`/`CollectionVersion` constants.","locations":[{"ref":"src/Avalonia.FreeDesktop.AtSpi/Handlers/AtSpiCollectionHandler.cs:14-33","code":"   14 |     internal sealed class AtSpiCollectionHandler(AtSpiServer server, AtSpiNode node) : IOrgA11yAtspiCollection\n   15 |     {\n   16 |         private enum MatchType\n   17 |         {\n   18 |             Invalid = 0,\n   19 |             All = 1,\n   20 |             Any = 2,\n   21 |             None = 3,\n   22 |             Empty = 4,\n   23 |         }\n   24 | \n   25 |         public uint Version => CollectionVersion;\n   26 | \n   27 |         public ValueTask<List<AtSpiObjectReference>> GetMatchesAsync(\n   28 |             AtSpiMatchRule rule, uint sortby, int count, bool traverse)\n   29 |         {\n   30 |             var results = new List<AtSpiObjectReference>();\n   31 |             CollectMatches(node, rule, count, traverse, results, skipSelf: true);\n   32 |             return ValueTask.FromResult(results);\n   33 |         }","lines":20,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/sr
