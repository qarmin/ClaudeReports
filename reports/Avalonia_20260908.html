{"id":"LOGIC_161","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In XimInputMethod.SetCursorRect (X11Window.Xim.cs), the lambda posted to the dispatcher captures the '_queuedCursorRect' field by reference but then reads 'rc' from '_queuedCursorRect.Value' (line 38-39). If SetCursorRect is called a second time before the posted lambda runs, '_queuedCursorRect' is updated (line 33), 'needEnqueue' becomes false and no new lambda is posted. The existing lambda will then use the updated (second) rect value stored in '_queuedCursorRect', effectively coalescing the updates. This is intentional (as indicated by the 'needEnqueue' logic). However, the 'rect *= _parent._scaling' at line 44 uses the method parameter 'rect' (captured by the closure) rather than 'rc' (the snapshot), so it scales the ORIGINAL rect value passed to the FIRST SetCursorRect call, not the coalesced newer rect. The coalescing optimization is broken: the IME position will reflect the first call's rect rather than the latest.","fix":"On line 44, replace 'rect *= _parent._scaling' with 'rc *= _parent._scaling'. The variable 'rc' was read from '_queuedCursorRect.Value' on line 39 and represents the coalesced (most recent) cursor rect.","locations":[{"ref":"src/Avalonia.X11/X11Window.Xim.cs:32-57","code":"   32 |                 var needEnqueue = _queuedCursorRect == null;\n   33 |                 _queuedCursorRect = rect;\n   34 |                 if(needEnqueue)\n   35 |                     Dispatcher.UIThread.Post(() =>\n   36 |                     {\n   37 |                         if(_queuedCursorRect == null)\n   38 |                             return;\n   39 |                         var rc = _queuedCursorRect.Value;\n   40 |                         _queuedCursorRect = null;\n   41 | \n   42 |                         if (_parent._xic == IntPtr.Zero)\n   43 |                             return;\n   44 | \n   45 |                         rect *= _parent._scaling;\n   46 |                         \n   47 |                         var pt = new XPoint\n   48 |                         {\n   49 |                             X = (short)Math.Min(Math.Max(rect.X, short.MinValue), short.MaxValue),\n   50 |                             Y = (short)Math.Min(Math.Max(rect.Y + rect.Height, short.MinValue), short.MaxValue)\n   51 |                         };\n   52 | \n   53 |                         using var spotLoc = new Utf8Buffer(XNames.XNSpotLocation);\n   54 |                         var list = XVaCreateNestedList(0, spotLoc, ref pt, IntPtr.Zero);\n   55 |                         XSetICValues(_parent._xic, XNames.XNPreeditAttributes, list, IntPtr.Zero);\n   56 |                         XFree(list);\n   57 |                     }, DispatcherPriority.Background);","lines":26,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.X11/X11Window.Xim.cs#L32-L57"}]},
{"id":"LOGIC_162","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The _NET_WM_SYNC_REQUEST state machine in X11Window does not guard against receiving two consecutive sync requests before ConfigureNotify arrives. If the WM sends a second _NET_WM_SYNC_REQUEST while _xSyncState == WaitConfigure, the new counter value overwrites _xSyncValue (lines 718-720), and the first counter value is never signaled back to the WM. This leaves the first sync counter permanently unsignaled, which can cause the WM to stop sending resize events or mark the window as unresponsive.","fix":"Before overwriting _xSyncValue on a new WM_SYNC_REQUEST, check if _xSyncState != None and if so, immediately signal the previous counter value before accepting the new one.","locations":[{"ref":"src/Avalonia.X11/X11Window.cs:739-743","code":"  739 |                     else if (ev.ClientMessageEvent.ptr1 == _x11.Atoms._NET_WM_SYNC_REQUEST)\n  740 |                     {\n  741 |                         _xSyncValue.Lo = new UIntPtr(ev.ClientMessageEvent.ptr3.ToPointer()).ToUInt32();\n  742 |                         _xSyncValue.Hi = ev.ClientMessageEvent.ptr4.ToInt32();\n  743 |                         _xSyncState = XSyncState.WaitConfigure;","lines":5,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.X11/X11Window.cs#L739-L743"},{"ref":"src/Avalonia.X11/X11Window.cs:717-721","code":"  717 |                 if (_xSyncState == XSyncState.WaitConfigure)\n  718 |                 {\n  719 |                     _xSyncState = XSyncState.WaitPaint;\n  720 |                     EnqueuePaint();\n  721 |                 }","lines":5,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.X11/X11Window.cs#L717-L721"}]},
{"id":"LOGIC_163","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"_NET_WM_STATE client messages sent by ChangeWMAtoms always set data.l[3] (source indication) to 0. Per EWMH spec section 1.3, data.l[3] must be 1 for normal application requests (2 for pagers). Source indication 0 is technically invalid and can cause some strict window managers to mishandle or ignore maximize, fullscreen, topmost, and taskbar-visibility state changes.","fix":"Pass source indication 1 as the fourth argument to SendNetWMMessage. Change the call to: SendNetWMMessage(_x11.Atoms._NET_WM_STATE, (IntPtr)(enable ? 1 : 0), atoms[0], atoms.Length > 1 ? atoms[1] : IntPtr.Zero, (IntPtr)1, IntPtr.Zero);","locations":[{"ref":"src/Avalonia.X11/X11Window.cs:1691-1697","code":" 1691 |             SendNetWMMessage(_x11.Atoms._NET_WM_STATE,\n 1692 |                 (IntPtr)(enable ? 1 : 0),\n 1693 |                 atoms[0],\n 1694 |                 atoms.Length > 1 ? atoms[1] : IntPtr.Zero,\n 1695 |                 atoms.Length > 2 ? atoms[2] : IntPtr.Zero,\n 1696 |                 atoms.Length > 3 ? atoms[3] : IntPtr.Zero\n 1697 |             );","lines":7,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.X11/X11Window.cs#L1691-L1697"}]},
{"id":"LOGIC_164","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"The beforeInput handler in input.ts hard-codes start = 2 and end = 4 for inputType === 'insertCompositionText', overriding the actual target ranges that were already computed from args.getTargetRanges(). These magic numbers are not derived from the actual input and will report wrong caret offsets for composition text, potentially causing incorrect IME cursor positioning.","fix":"Remove the hardcoded override. Let the ranges computed from getTargetRanges() above be used for all inputTypes, including 'insertCompositionText'. If special handling is needed, derive the values from the actual event data.","locations":[{"ref":"src/Browser/Avalonia.Browser/webapp/modules/avalonia/input.ts:396-399","code":"  396 |             if (args.inputType === \"insertCompositionText\") {\n  397 |                 start = 2;\n  398 |                 end = start + 2;\n  399 |             }","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Browser/Avalonia.Browser/webapp/modules/avalonia/input.ts#L396-L399"}]},
{"id":"LOGIC_165","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In sw.ts, the service worker fetch handler on line 69 calls map.delete(url) and then uses data.rs as the response body, but never checks whether the ReadableStream was correctly transferred via the MessagePort before responding. If the 'message' event handler at line 57 set data.rs using a MessagePortSource that has not yet emitted any data, the fetch handler still responds immediately. More importantly, the service worker responds with null return value (return null) instead of letting the event fall through when data is not found - service workers should call event.respondWith() only when handling the request; returning null has no effect.","fix":"Replace 'if (!data) return null;' with 'if (!data) return;' - returning null from a fetch event handler is not meaningful; simply returning without calling respondWith correctly delegates to the browser's default fetch.","locations":[{"ref":"src/Browser/Avalonia.Browser/webapp/modules/sw.ts:69-78","code":"   69 | globalThis.addEventListener(\"fetch\", evt => {\n   70 |     const url = (evt as any).request.url;\n   71 |     const map = (self as any).map;\n   72 |     const data = map.get(url);\n   73 |     if (!data) return null;\n   74 |     map.delete(url);\n   75 |     (evt as any).respondWith(new Response(data.rs, {\n   76 |         headers: data.headers\n   77 |     }));\n   78 | });","lines":10,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Browser/Avalonia.Browser/webapp/modules/sw.ts#L69-L78"}]},
{"id":"LOGIC_166","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"When mapping VNC pressed buttons to `RawInputModifiers`, `(RawInputModifiers)(((int)buttons & 7) << 4)` shifts the VncButton bits (Left=1, Middle=2, Right=4) left by 4. This yields Left->16 (LeftMouseButton, correct) but Middle(2)->32 (RightMouseButton) and Right(4)->64 (MiddleMouseButton), so the middle and right mouse-button modifier flags are swapped in the reported modifiers.","fix":"Build the modifiers explicitly per button instead of a blanket shift, e.g. OR in `RawInputModifiers.LeftMouseButton`/`RightMouseButton`/`MiddleMouseButton` based on the corresponding `VncButton` flags so Middle maps to 64 and Right maps to 32.","locations":[{"ref":"src/Headless/Avalonia.Headless.Vnc/HeadlessVncFramebufferSource.cs:38","code":"   38 |                 var modifiers = (RawInputModifiers)(((int)buttons & 7) << 4);","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Headless/Avalonia.Headless.Vnc/HeadlessVncFramebufferSource.cs#L38"}]},
{"id":"LOGIC_167","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`EvDevDevice.Open` treats a return value of 0 from `open()` as failure (`if (fd <= 0)`). File descriptor 0 is valid (it is returned when stdin is closed), so a legitimately opened device could be rejected, and conversely the intended error sentinel from `open` is -1.","fix":"Test for the real error sentinel: `if (fd < 0)` (open returns -1 on failure).","locations":[{"ref":"src/Linux/Avalonia.LinuxFramebuffer/Input/EvDev/EvDevDevice.cs:44-46","code":"   44 |             var fd = NativeUnsafeMethods.open(device, 2048, 0);\n   45 |             if (fd <= 0)\n   46 |                 throw new Exception($\"Unable to open {device} code {Marshal.GetLastWin32Error()}\");","lines":3,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Linux/Avalonia.LinuxFramebuffer/Input/EvDev/EvDevDevice.cs#L44-L46"}]},
{"id":"LOGIC_168","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"SelectorGrammar.Expect takes a `char c` parameter and builds error messages from it, but the actual check hardcodes `!r.TakeIf(')')` instead of `!r.TakeIf(c)`. It only works today because every caller happens to pass `')'`; any future call with a different expected character would silently accept `)` and reject the intended one, with a misleading error message.","fix":"Use the parameter:\n```csharp\nelse if (!r.TakeIf(c))\n    throw new ExpressionParseException(r.Position, $\"Expected '{c}', got '{r.Peek}'.\");\n```","locations":[{"ref":"src/Markup/Avalonia.Markup/Markup/Parsers/SelectorGrammar.cs:504-514","code":"  504 |         private static void Expect(ref CharacterReader r, char c)\n  505 |         {\n  506 |             if (r.End)\n  507 |             {\n  508 |                 throw new ExpressionParseException(r.Position, $\"Expected '{c}', got end of selector.\");\n  509 |             }\n  510 |             else if (!r.TakeIf(')'))\n  511 |             {\n  512 |                 throw new ExpressionParseException(r.Position, $\"Expected '{c}', got '{r.Peek}'.\");\n  513 |             }\n  514 |         }","lines":11,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Markup/Avalonia.Markup/Markup/Parsers/SelectorGrammar.cs#L504-L514"}]},
{"id":"LOGIC_169","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"The netstandard2.0 polyfill attribute is misspelled `ModuleInitializerhAttribute` (extra `h`). The C# compiler only recognizes module initializers via the exact type name `System.Runtime.CompilerServices.ModuleInitializerAttribute`, so this polyfill would not be picked up if any netstandard2.0 code applied `[ModuleInitializer]`; the polyfill is effectively useless (and currently unused, making it dead code).","fix":"Rename the type to `ModuleInitializerAttribute` (remove the stray `h`).","locations":[{"ref":"src/Shared/ModuleInitializer.cs:5","code":"    5 |     internal sealed class ModuleInitializerhAttribute : Attribute","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Shared/ModuleInitializer.cs#L5"}]},
{"id":"LOGIC_170","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In DrawingContextImpl.DrawRectangle() the outset shadow loop checks !boxShadow.IsInset on line 437, then inside the branch redundantly checks if (boxShadow.IsInset) on line 442 and negates spread (line 443). Since IsInset is already known to be false at this point, the spread negation branch is dead code. The existing variable 'spread' is always the positive value.","fix":"Remove the if (boxShadow.IsInset) spread = -spread; block inside the outset shadow loop since it is unreachable.","locations":[{"ref":"src/Skia/Avalonia.Skia/DrawingContextImpl.cs:437-443","code":"  437 |                 if (boxShadow != default && !boxShadow.IsInset)\n  438 |                 {\n  439 |                     using (var shadow = BoxShadowFilter.Create(_boxShadowPaint, boxShadow, _currentOpacity))\n  440 |                     {\n  441 |                         var spread = (float)boxShadow.Spread;\n  442 |                         if (boxShadow.IsInset)\n  443 |                             spread = -spread;","lines":7,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Skia/Avalonia.Skia/DrawingContextImpl.cs#L437-L443"}]},
{"id":"LOGIC_171","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"WM_DPICHANGED wParam unpacking reads the HIWORD (Y / vertical DPI) when it should read the LOWORD (X / horizontal DPI). Per MSDN, LOWORD(wParam) is the new horizontal DPI and HIWORD(wParam) is the new vertical DPI. The code uses '(uint)wParam >> 16' which isolates the high 16 bits (vertical DPI). On the rare non-square-pixel display where X-DPI != Y-DPI the scaling factor would be wrong. On standard monitors the values are identical so there is no observable bug.","fix":"Change to '_dpi = (uint)(ushort)(uint)wParam;' (or equivalently '(uint)(ushort)ToInt32(wParam)') to extract the LOWORD (horizontal DPI) as documented by MSDN.","locations":[{"ref":"src/Windows/Avalonia.Win32/WindowImpl.AppWndProc.cs:194","code":"  194 |                         _dpi = (uint)wParam >> 16;","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Windows/Avalonia.Win32/WindowImpl.AppWndProc.cs#L194"}]},
{"id":"LOGIC_172","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`IOSStorageItem.DeleteAsync` (line 83) calls\n`SecurityScopedAncestorUrl.StartAccessingSecurityScopedResource()` but ignores its\n`bool` return value. If the call returns `false` (access denied or resource\nunavailable), the subsequent `NSFileManager.Remove` will fail with a permissions\nerror that surfaces as a misleading `NSErrorException` rather than a clear\n\"access denied\" error. Contrast with `SaveBookmarkAsync` (line 141) and\n`CreateFileAsync` (line 274) which correctly check the return value and bail early.","fix":"Check the return value: `if (!SecurityScopedAncestorUrl.StartAccessingSecurityScopedResource()) return Task.FromException(new UnauthorizedAccessException(...));` before attempting the file removal.","locations":[{"ref":"src/iOS/Avalonia.iOS/Storage/IOSStorageItem.cs:79-93","code":"   79 |     public Task DeleteAsync()\n   80 |     {\n   81 |         try\n   82 |         {\n   83 |             SecurityScopedAncestorUrl.StartAccessingSecurityScopedResource();\n   84 | \n   85 |             return NSFileManager.DefaultManager.Remove(Url, out var error)\n   86 |                 ? Task.CompletedTask\n   87 |                 : Task.FromException(new NSErrorException(error));\n   88 |         }\n   89 |         finally\n   90 |         {\n   91 |             SecurityScopedAncestorUrl.StopAccessingSecurityScopedResource();\n   92 |         }\n   93 |     }","lines":15,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/iOS/Avalonia.iOS/Storage/IOSStorageItem.cs#L79-L93"}]},
{"id":"LOGIC_173","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`OnPropertyChangedOverrideAnalyzer.AnalyzeMethod` only inspects `method.Body` for the `base.OnPropertyChanged` call and never looks at `method.ExpressionBody`. An expression-bodied override such as `protected override void OnPropertyChanged(AvaloniaPropertyChangedEventArgs change) => base.OnPropertyChanged(change);` has `Body == null`, so `baseInvocations` is null, the guard is skipped, and a false-positive AVA2001 diagnostic (\"do not invoke base\") is reported even though it does call base.","fix":"Also collect `BaseExpressionSyntax` nodes from `method.ExpressionBody` (e.g. `var baseInvocations = ((SyntaxNode?)method.Body ?? method.ExpressionBody)?.DescendantNodes().OfType<BaseExpressionSyntax>();`) before deciding to report the diagnostic.","locations":[{"ref":"src/tools/Avalonia.Analyzers.CSharp/OnPropertyChangedOverrideAnalyzer.cs:38-53","code":"   38 |             var baseInvocations = method.Body?.DescendantNodes().OfType<BaseExpressionSyntax>();\n   39 |             if (baseInvocations?.Any() == true)\n   40 |             {\n   41 |                 foreach (var baseInvocation in baseInvocations)\n   42 |                 {\n   43 |                     if (baseInvocation.Parent is SyntaxNode parent)\n   44 |                     {\n   45 |                         var targetSymbol = context.SemanticModel.GetSymbolInfo(parent, context.CancellationToken);\n   46 |                         if (SymbolEqualityComparer.Default.Equals(targetSymbol.Symbol, originalMethod))\n   47 |                         {\n   48 |                             return;\n   49 |                         }\n   50 |                     }\n   51 |                 }\n   52 |             }\n   53 |             context.ReportDiagnostic(Diagnostic.Create(Rule, currentMethod.Locations[0], currentMethod.Name));","lines":16,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/tools/Avalonia.Analyzers.CSharp/OnPropertyChangedOverrideAnalyzer.cs#L38-L53"}]},
{"id":"LOGIC_174","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"The analyzer only inspects `method.Body` for a `base.OnPropertyChanged(...)` call. An expression-bodied override (`protected override void OnPropertyChanged(...) => base.OnPropertyChanged(e);`) has a null `Body` and a non-null `ExpressionBody`, so `baseInvocations` is null and the analyzer emits a false-positive AVADEV2001 warning even though the base call is present.","fix":"Search both bodies for the base invocation, e.g. gather `BaseExpressionSyntax` from `method.Body` OR `method.ExpressionBody` (`((SyntaxNode?)method.Body ?? method.ExpressionBody)?.DescendantNodes()...`).","locations":[{"ref":"src/tools/DevAnalyzers/OnPropertyChangedOverrideAnalyzer.cs:40-55","code":"   40 |                 var baseInvocations = method.Body?.DescendantNodes().OfType<BaseExpressionSyntax>();\n   41 |                 if (baseInvocations?.Any() == true)\n   42 |                 {\n   43 |                     foreach (var baseInvocation in baseInvocations)\n   44 |                     {\n   45 |                         if (baseInvocation.Parent is SyntaxNode parent)\n   46 |                         {\n   47 |                             var targetSymbol = context.SemanticModel.GetSymbolInfo(parent, context.CancellationToken);\n   48 |                             if (SymbolEqualityComparer.Default.Equals(targetSymbol.Symbol, originalMethod))\n   49 |                             {\n   50 |                                 return;\n   51 |                             }\n   52 |                         }\n   53 |                     }\n   54 |                 }\n   55 |                 context.ReportDiagnostic(Diagnostic.Create(Rule, currentMethod.Locations[0], currentMethod.Name));","lines":16,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/tools/DevAnalyzers/OnPropertyChangedOverrideAnalyzer.cs#L40-L55"}]},
{"id":"LOGIC_175","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"very_easy","description":"MoveToPoint adds `double.Epsilon` (the smallest denormal, ~5e-324) to the thumb length, apparently to avoid a divide-by-zero on `trackLength`. This constant is far too small to have any effect: `x + double.Epsilon == x` for any non-tiny `x`, so the guard is ineffective (though the subsequent `Clamp` prevents an actual crash). It reflects a misunderstanding of `double.Epsilon` versus a small tolerance.","fix":"Either drop the meaningless `+ double.Epsilon` or guard the division explicitly, e.g.:\n```csharp\nvar logicalPos = trackLength <= 0 ? 0.0 : MathUtilities.Clamp((trackPos - thumbLength * 0.5) / trackLength, 0.0, 1.0);\n```","locations":[{"ref":"src/Avalonia.Controls/Slider.cs:378-380","code":"  378 |             var thumbLength = (orient\n  379 |                 ? _track.Thumb?.Bounds.Width ?? 0.0\n  380 |                 : _track.Thumb?.Bounds.Height ?? 0.0) + double.Epsilon;","lines":3,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/Slider.cs#L378-L380"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"critical","difficulty":"very_easy","description":"The __IID_DEF macro materializes GUID Data4 bytes entirely from d42, ignoring d43 through d48. All COM interface IDs share the same last 6 bytes, which will cause QueryInterface to match the wrong interface or fail to differentiate interfaces at runtime.","fix":"Fix the macro to use each parameter: {0x ## d41, 0x ## d42, 0x ## d43, 0x ## d44, 0x ## d45, 0x ## d46, 0x ## d47, 0x ## d48 }","locations":[{"ref":"native/Avalonia.Native/inc/com.h:47-48","code":"   47 | #define __IID_DEF(name,d1,d2,d3, d41, d42, d43, d44, d45, d46, d47, d48) extern \"C\" const GUID IID_ ## name = {0x ## d1, 0x ## d2, 0x ## d3, \\\n   48 | {0x ## d41, 0x ## d42, 0x ## d42, 0x ## d42, 0x ## d42, 0x ## d42, 0x ## d42, 0x ## d42 } };","lines":2,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/native/Avalonia.Native/inc/com.h#L47-L48"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"critical","difficulty":"very_easy","description":"LtrbRect.ToSKRect() passes r.Right as both the 'left' and 'right' arguments to SKRect, making the X coordinate equal to the right edge instead of the left. Any caller that converts an LtrbRect to an SKRect gets a zero-width rectangle shifted to the wrong X position, silently corrupting clips, bounds checks, and draw calls.","fix":"Change the second argument from (float)r.Right to (float)r.Top: return new SKRect((float)r.Left, (float)r.Top, (float)r.Right, (float)r.Bottom);","locations":[{"ref":"src/Skia/Avalonia.Skia/SkiaSharpExtensions.cs:84-87","code":"   84 |         internal static SKRect ToSKRect(this LtrbRect r)\n   85 |         {\n   86 |             return new SKRect((float)r.Left, (float)r.Right, (float)r.Right, (float)r.Bottom);\n   87 |         }","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Skia/Avalonia.Skia/SkiaSharpExtensions.cs#L84-L87"}]},
{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"easy","description":"The two-value overload of `EffectiveValue<T>.SetAndRaiseCore` (used only from `CoerceValue`, which re-coerces a distinct value and base value) has two copy/paste errors in the base-value branch. It compares `_baseValue` against `bv` (the coerced base value) but then assigns the coerced main value `v`, and it writes the uncoerced *value* field instead of the uncoerced *base* field. As a result, when a property with a coercion function has an active animation value plus a separate base value and `CoerceValue` is invoked, the stored base value is overwritten with the animation value and `_uncoercedBaseValue` is left stale. When the animation is later removed (`RemoveAnimationAndRaise` reverts to `_baseValue`), the property reverts to the wrong value.","fix":"Assign the base value `bv` and update `_uncoercedBaseValue`:\n```csharp\nif (!EqualityComparer<T>.Default.Equals(_baseValue, bv))\n{\n    _baseValue = bv;\n    baseValueChanged = true;\n    if (_uncommon is not null)\n        _uncommon._uncoercedBaseValue = baseValue;\n}\n```","locations":[{"ref":"src/Avalonia.Base/PropertyStore/EffectiveValue`1.cs:287-293","code":"  287 |             if (!EqualityComparer<T>.Default.Equals(_baseValue, bv))\n  288 |             {\n  289 |                 _baseValue = v;\n  290 |                 baseValueChanged = true;\n  291 |                 if (_uncommon is not null)\n  292 |                     _uncommon._uncoercedValue = baseValue;\n  293 |             }","lines":7,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/PropertyStore/EffectiveValue`1.cs#L287-L293"}]},
{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"easy","description":"`CompositionVisual.OnParentChanged` decrements ancestor `CustomHitTestCountInSubTree` instead of incrementing it. The generated `Parent` setter calls `OnParentChanging()` while `Parent` is still the OLD parent (correctly subtracting this subtree's custom-hit-test count from the old ancestor chain), then assigns the new parent and calls `OnParentChanged()` where `Parent` is the NEW parent. `OnParentChanged` must ADD the count to the new ancestor chain, but it copies the `OnParentChanging` body verbatim and subtracts (`-=`). As a result every time a subtree containing an `ICustomHitTest` visual is attached, the new ancestors' counters are corrupted (driven negative / never balanced with the matching detach). Since `DisableSubTreeBoundsHitTestOptimization => CustomHitTestCountInSubTree != 0`, this permanently disables the subtree-bounds hit-test optimization for affected branches and, when the corrupted counters happen to cancel to zero while custom-hit-test visuals are still present, can cause custom hit testing to be skipped entirely (missed hits).","fix":"In `OnParentChanged`, add rather than subtract:\n```csharp\nparent.CustomHitTestCountInSubTree += CustomHitTestCountInSubTree;\n```\n(Leave the `-=` in `OnParentChanging`, which correctly removes the count from the old parent chain.)","locations":[{"ref":"src/Avalonia.Base/Rendering/Composition/Visual.cs:25-33","code":"   25 |             if (CustomHitTestCountInSubTree != 0)\n   26 |             {\n   27 |                 var parent = Parent;\n   28 |                 while (parent != null)\n   29 |                 {\n   30 |                     parent.CustomHitTestCountInSubTree -= CustomHitTestCountInSubTree;\n   31 |                     parent = parent.Parent;\n   32 |                 }\n   33 |             }","lines":9,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Rendering/Composition/Visual.cs#L25-L33"}]},
{"id":"CPY_5","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"In ColorSpectrum.UpdateBitmapSources() every switch branch assigns `_spectrumOverlayRectangle.Fill` twice and never assigns `_spectrumOverlayEllipse.Fill`. `PART_SpectrumOverlayEllipse` is a real template part (used in both the Fluent and Simple ColorSpectrum.xaml themes, shown when Shape=Ring). Its Opacity is set (lines 1620/1640/1698) but its Fill brush is never applied, so the Ring-shape spectrum shows only the base bitmap with no overlay blend, producing incorrect colors (e.g. no saturation/hue blending) for all component configurations.","fix":"In each branch change the duplicated second assignment to target the ellipse:\n```csharp\n_spectrumOverlayRectangle.Fill = spectrumOverlayBrush;\n_spectrumOverlayEllipse.Fill = spectrumOverlayBrush;\n```","locations":[{"ref":"src/Avalonia.Controls.ColorPicker/ColorSpectrum/ColorSpectrum.cs:1623-1624","code":" 1623 |                         _spectrumOverlayRectangle.Fill = spectrumOverlayBrush;\n 1624 |                         _spectrumOverlayRectangle.Fill = spectrumOverlayBrush;","lines":2,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls.ColorPicker/ColorSpectrum/ColorSpectrum.cs#L1623-L1624"},{"ref":"src/Avalonia.Controls.ColorPicker/ColorSpectrum/ColorSpectrum.cs:1643-1644","code":" 1643 |                         _spectrumOverlayRectangle.Fill = spectrumOverlayBrush;\n 1644 |                         _spectrumOverlayRectangle.Fill = spectrumOverlayBrush;","lines":2,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls.ColorPicker/ColorSpectrum/ColorSpectrum.cs#L1643-L1644"},{"ref":"src/Avalonia.Controls.ColorPicker/ColorSpectrum/ColorSpectrum.cs:1701-1702","code":" 1701 |                         _spectrumOverlayRectangle.Fill = spectrumOverlayBrush;\n 1702 |                         _spectrumOverlayRectangle.Fill = spectrumOverlayBrush;","lines":2,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls.ColorPicker/ColorSpectrum/ColorSpectrum.cs#L1701-L1702"}]},
{"id":"CPY_6","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"The `ImmutableRadialGradientBrush(RadialGradientBrush source)` copy constructor sets `RadiusY = source.RadiusX` instead of `source.RadiusY`. Any RadialGradientBrush with different X and Y radii will render incorrectly once made immutable (this path is hit by `RadialGradientBrush.ToImmutable()` and thus every time such a brush is committed to the compositor/immutable pipeline).","fix":"```csharp\nRadiusX = source.RadiusX;\nRadiusY = source.RadiusY; // was: source.RadiusX\n```","locations":[{"ref":"src/Avalonia.Base/Media/Immutable/ImmutableRadialGradientBrush.cs:73-74","code":"   73 |             RadiusX = source.RadiusX;\n   74 |             RadiusY = source.RadiusX;","lines":2,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Media/Immutable/ImmutableRadialGradientBrush.cs#L73-L74"}]},
{"id":"CPY_7","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"`SlicedStream.CanSeek` is derived from the base stream's `CanRead` instead of its `CanSeek`. A `SlicedStream` always relies on `Position`/`Seek` against `_baseStream`, so its seekability depends on `_baseStream.CanSeek`, not `CanRead`. As written a base stream that is readable but not seekable would incorrectly report `CanSeek == true` (and a seekable-but-not-readable base stream would report `false`), so callers that check `CanSeek` before seeking can hit runtime failures.","fix":"Change `public override bool CanSeek => _baseStream.CanRead;` to `public override bool CanSeek => _baseStream.CanSeek;`.","locations":[{"ref":"src/Avalonia.Base/Platform/Internal/SlicedStream.cs:43","code":"   43 |     public override bool CanSeek => _baseStream.CanRead;","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Platform/Internal/SlicedStream.cs#L43"}]},
{"id":"CPY_8","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In `BuiltInExpressionFfi`, the `Matrix3x2.CreateTranslation` and `Matrix4x4.CreateTranslation` FFI functions are wired to `Matrix3x2.CreateScale(v)` / `Matrix4x4.CreateScale(v)` respectively (copy-paste from the `CreateScale`/`CreateFromScale` entries just above). Any expression animation calling `Matrix3x2.CreateTranslation(...)` or `Matrix4x4.CreateTranslation(...)` produces a scale matrix instead of a translation matrix.","fix":"```csharp\n{\"Matrix3x2.CreateTranslation\", (Vector2 v) => Matrix3x2.CreateTranslation(v)},\n...\n{\"Matrix4x4.CreateTranslation\", (Vector3 v) => Matrix4x4.CreateTranslation(v)},\n```","locations":[{"ref":"src/Avalonia.Base/Rendering/Composition/Expressions/BuiltInExpressionFfi.cs:187","code":"  187 |                 {\"Matrix3x2.CreateTranslation\", (Vector2 v) => Matrix3x2.CreateScale(v)},","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Rendering/Composition/Expressions/BuiltInExpressionFfi.cs#L187"},{"ref":"src/Avalonia.Base/Rendering/Composition/Expressions/BuiltInExpressionFfi.cs:196","code":"  196 |                 {\"Matrix4x4.CreateTranslation\", (Vector3 v) => Matrix4x4.CreateScale(v)},","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Rendering/Composition/Expressions/BuiltInExpressionFfi.cs#L196"}]},
{"id":"CPY_9","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"`DelegateExpressionFfi.Add` overloads index the wrong argument slot. In `Add<T1..T6>` the sixth argument is read as `args[4].CastOrDefault<T6>()` instead of `args[5]`. In `Add<T1..T16>` every argument from T6 through T16 is read from `args[4]` instead of `args[5]..args[15]`. These are used by the built-in `Matrix3x2(6 floats)` and `Matrix4x4(16 floats)` expression functions, so those functions build garbage matrices (e.g. `Matrix4x4(...)` fills M22..M44 all from the 5th argument).","fix":"Use the correct positional indices. For the 6-arg overload the last line must be `args[5].CastOrDefault<T6>()`; for the 16-arg overload use `args[5]`, `args[6]`, ... `args[15]` for T6..T16 respectively.","locations":[{"ref":"src/Avalonia.Base/Rendering/Composition/Expressions/DelegateExpressionFfi.cs:178-185","code":"  178 |             Add(name, args => cb(\n  179 |                     args[0].CastOrDefault<T1>(),\n  180 |                     args[1].CastOrDefault<T2>(), \n  181 |                     args[2].CastOrDefault<T3>(),\n  182 |                     args[3].CastOrDefault<T4>(),\n  183 |                     args[4].CastOrDefault<T5>(),\n  184 |                     args[4].CastOrDefault<T6>()),\n  185 |                 typeof(T1), typeof(T2), typeof(T3), typeof(T4), typeof(T5), typeof(T6));","lines":8,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Rendering/Composition/Expressions/DelegateExpressionFfi.cs#L178-L185"},{"ref":"src/Avalonia.Base/Rendering/Composition/Expressions/DelegateExpressionFfi.cs:208-225","code":"  208 |             Add(name, args => cb(\n  209 |                     args[0].CastOrDefault<T1>(),\n  210 |                     args[1].CastOrDefault<T2>(),\n  211 |                     args[2].CastOrDefault<T3>(),\n  212 |                     args[3].CastOrDefault<T4>(),\n  213 |                     args[4].CastOrDefault<T5>(),\n  214 |                     args[4].CastOrDefault<T6>(),\n  215 |                     args[4].CastOrDefault<T7>(),\n  216 |                     args[4].CastOrDefault<T8>(),\n  217 |                     args[4].CastOrDefault<T9>(),\n  218 |                     args[4].CastOrDefault<T10>(),\n  219 |                     args[4].CastOrDefault<T11>(),\n  220 |                     args[4].CastOrDefault<T12>(),\n  221 |                     args[4].CastOrDefault<T13>(),\n  222 |                     args[4].CastOrDefault<T14>(),\n  223 |                     args[4].CastOrDefault<T15>(),\n  224 |                     args[4].CastOrDefault<T16>()\n  225 |                 ),","lines":18,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Rendering/Composition/Expressions/DelegateExpressionFfi.cs#L208-L225"}]},
{"id":"CPY_10","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"`ServerCompositionVisualCache.Draw` creates the offscreen render target passing the horizontal scale for BOTH axes: `new Vector(_scaleX, _scaleX)`. `_scaleX` and `_scaleY` are computed separately in `UpdateRealizationDimensions` and diverge when the cache width and height are clamped to `MaxOffscreenRenderTargetPixelSize` by different factors. The drawing transform a few lines later correctly uses `Matrix.CreateScale(_scaleX, _scaleY)`, so the render-target DPI (Y component) is inconsistent with the actual vertical scale, producing incorrectly scaled / distorted cached content for very large non-square cached visuals.","fix":"```csharp\n_layer = renderContext.CreateOffscreenRenderTarget(_desiredLayerSize, new Vector(_scaleX, _scaleY),\n    EnableClearType);\n```","locations":[{"ref":"src/Avalonia.Base/Rendering/Composition/Server/ServerCompositionVisual/ServerCompositionVisualCache.cs:167-168","code":"  167 |             _layer = renderContext.CreateOffscreenRenderTarget(_desiredLayerSize, new Vector(_scaleX, _scaleX),\n  168 |                 EnableClearType);","lines":2,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Rendering/Composition/Server/ServerCompositionVisual/ServerCompositionVisualCache.cs#L167-L168"}]},
{"id":"CPY_11","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"In `AutoCompleteBox.ItemsCollectionChanged`, the `Replace` branch writes every new item to the same slot `_items[e.NewStartingIndex]` instead of `_items[e.NewStartingIndex + index]`. When an `ObservableCollection` raises a multi-item Replace, all but the last new item are lost and the earlier slots are clobbered, corrupting the control's cached copy of the data (compare with the `Add` branch two blocks up, which correctly uses `e.NewStartingIndex + index`).","fix":"Index by the loop variable:\n```csharp\nfor (int index = 0; index < e.NewItems.Count; index++)\n{\n    _items![e.NewStartingIndex + index] = e.NewItems[index]!;\n}\n```","locations":[{"ref":"src/Avalonia.Controls/AutoCompleteBox/AutoCompleteBox.cs:1465-1471","code":" 1465 |             if (e.Action == NotifyCollectionChangedAction.Replace && e.NewItems != null && e.OldItems != null)\n 1466 |             {\n 1467 |                 for (int index = 0; index < e.NewItems.Count; index++)\n 1468 |                 {\n 1469 |                     _items![e.NewStartingIndex] = e.NewItems[index]!;\n 1470 |                 }\n 1471 |             }","lines":7,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/AutoCompleteBox/AutoCompleteBox.cs#L1465-L1471"}]},
{"id":"CPY_12","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In `Popup.UpdateHostSizing`, the vertical scale factor `scaleY` is computed from the matrix's first row (`M11`, `M12`) instead of the second row (`M21`, `M22`). It is a copy-paste of the `scaleX` expression, so `scaleY` always equals `scaleX`. When the placement target has a non-uniform scale transform (different X and Y scales), the popup's height, MinHeight, MaxHeight and vertical ScaleTransform are all sized using the horizontal scale, producing an incorrectly sized popup.","fix":"Compute `scaleY` from the second matrix row:\n```csharp\nscaleX = Math.Sqrt(m.M11 * m.M11 + m.M12 * m.M12);\nscaleY = Math.Sqrt(m.M21 * m.M21 + m.M22 * m.M22);\n```","locations":[{"ref":"src/Avalonia.Controls/Primitives/Popup.cs:741-744","code":"  741 |             if (InheritsTransform && placementTarget.TransformToVisual(topLevel) is { } m)\n  742 |             {\n  743 |                 scaleX = Math.Sqrt(m.M11 * m.M11 + m.M12 * m.M12);\n  744 |                 scaleY = Math.Sqrt(m.M11 * m.M11 + m.M12 * m.M12);","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/Primitives/Popup.cs#L741-L744"}]},
{"id":"CPY_13","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In the VNC key translation table the lowercase 'n' key is mapped to `Key.M` instead of `Key.N` (the produced text is still \"n\"). Pressing 'n' over a VNC connection therefore generates a KeyDown/KeyUp for the M key, breaking shortcuts and physical-key handling for that key.","fix":"Change the mapping from `KeySym.n => (Key.M, \"n\")` to `KeySym.n => (Key.N, \"n\")`.","locations":[{"ref":"src/Headless/Avalonia.Headless.Vnc/HeadlessVncFramebufferSource.cs:282","code":"  282 |                 KeySym.n => (Key.M, \"n\"),","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Headless/Avalonia.Headless.Vnc/HeadlessVncFramebufferSource.cs#L282"}]},
{"id":"CPY_14","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"ThemeVariantNodeEquals compares two XamlAstNewClrObjectNode ThemeVariant nodes but the recursive argument comparison uses the left node's argument on BOTH sides instead of comparing left vs right. As a result the constructor argument (the actual variant key/name) is never really compared - the recursion always compares a node to itself and returns true. Two distinct custom ThemeVariants are therefore treated as equal, causing wrong merging of ThemeDictionaries when compiling merged resource dictionaries.","fix":"Compare the right node's argument, not the left one again:\n```csharp\n&& ThemeVariantNodeEquals(context, leftClrObjectNode.Arguments.Single(),\n    rightClrObjectNode.Arguments.Single());\n```","locations":[{"ref":"src/Markup/Avalonia.Markup.Xaml.Loader/CompilerExtensions/GroupTransformers/XamlMergeResourceGroupTransformer.cs:205-206","code":"  205 |                    && ThemeVariantNodeEquals(context, leftClrObjectNode.Arguments.Single(),\n  206 |                        leftClrObjectNode.Arguments.Single());","lines":2,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Markup/Avalonia.Markup.Xaml.Loader/CompilerExtensions/GroupTransformers/XamlMergeResourceGroupTransformer.cs#L205-L206"}]},
{"id":"CPY_15","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In the height branch of ContainerQueryGrammar.ParseFeature the operator ternary tests `identifier.SequenceEqual(WidthKeyword.AsSpan())` for the `Equals` case, copied verbatim from the width branch. Since `identifier` here is only ever `min-height`, `max-height`, or `height`, the `WidthKeyword` comparison can never be true, so a plain `height:NNN` query falls through to `LessThanOrEquals` (i.e. behaves like `max-height`) instead of `Equals`.","fix":"Compare against `HeightKeyword`:\n```csharp\nOperator = identifier.SequenceEqual(HeightKeyword.AsSpan()) ? StyleQueryComparisonOperator.Equals\n    : identifier.SequenceEqual(MinHeightKeyword.AsSpan()) ? StyleQueryComparisonOperator.GreaterThanOrEquals\n    : StyleQueryComparisonOperator.LessThanOrEquals\n```","locations":[{"ref":"src/Markup/Avalonia.Markup/Markup/Parsers/ContainerQueryGrammar.cs:107-113","code":"  107 |                 var syntax = new HeightSyntax()\n  108 |                 {\n  109 |                     Value = val,\n  110 |                     Operator = identifier.SequenceEqual(WidthKeyword.AsSpan()) ? StyleQueryComparisonOperator.Equals \n  111 |                     : identifier.SequenceEqual(MinHeightKeyword.AsSpan()) ? StyleQueryComparisonOperator.GreaterThanOrEquals \n  112 |                     : StyleQueryComparisonOperator.LessThanOrEquals\n  113 |                 };","lines":7,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Markup/Avalonia.Markup/Markup/Parsers/ContainerQueryGrammar.cs#L107-L113"}]},
{"id":"CPY_16","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"The `RoutedEvent` constructor validates all three reference parameters with `?? throw new ArgumentNullException(...)`, but the null checks for `eventArgsType` and `ownerType` both pass `nameof(name)` instead of their own parameter names. If a caller passes a null `eventArgsType` or `ownerType`, the resulting exception will incorrectly report the parameter name as \"name\", misleading debugging.","fix":"Use the correct `nameof` for each parameter:\n```csharp\nname = name ?? throw new ArgumentNullException(nameof(name));\neventArgsType = eventArgsType ?? throw new ArgumentNullException(nameof(eventArgsType));\nownerType = ownerType ?? throw new ArgumentNullException(nameof(ownerType));\n```","locations":[{"ref":"src/Avalonia.Base/Interactivity/RoutedEvent.cs:25-27","code":"   25 |             name = name ?? throw new ArgumentNullException(nameof(name));\n   26 |             eventArgsType = eventArgsType ?? throw new ArgumentNullException(nameof(name));\n   27 |             ownerType = ownerType ?? throw new ArgumentNullException(nameof(name));","lines":3,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Interactivity/RoutedEvent.cs#L25-L27"}]},
{"id":"CPY_17","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `FeatureListTable`, the local variable names in `LoadGSub` and `LoadGPos` are swapped: `LoadGSub` reads the GSUB table into a variable named `gPosTable`, and `LoadGPos` reads the GPOS table into a variable named `gSubTable`. The correct tags (`GSubTag`/`GPosTag`) are used, so behaviour is correct, but the misleading names are a clear copy-paste artifact that will mislead future maintainers.","fix":"Rename the locals to match their contents: `gSubTable` in `LoadGSub` and `gPosTable` in `LoadGPos`.","locations":[{"ref":"src/Avalonia.Base/Media/Fonts/Tables/FeatureListTable.cs:30-52","code":"   30 |         public static FeatureListTable? LoadGSub(GlyphTypeface glyphTypeface)\n   31 |         {\n   32 |             if (!glyphTypeface.PlatformTypeface.TryGetTable(GSubTag, out var gPosTable))\n   33 |             {\n   34 |                 return null;\n   35 |             }\n   36 | \n   37 |             var reader = new BigEndianBinaryReader(gPosTable.Span);\n   38 | \n   39 |             return Load(ref reader);\n   40 |         }\n   41 | \n   42 |         public static FeatureListTable? LoadGPos(GlyphTypeface glyphTypeface)\n   43 |         {\n   44 |             if (!glyphTypeface.PlatformTypeface.TryGetTable(GPosTag, out var gSubTable))\n   45 |             {\n   46 |                 return null;\n   47 |             }\n   48 | \n   49 |             var reader = new BigEndianBinaryReader(gSubTable.Span);\n   50 | \n   51 |             return Load(ref reader);\n   52 |         }","lines":23,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Media/Fonts/Tables/FeatureListTable.cs#L30-L52"}]},
{"id":"CPY_18","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"Rule W5 of the Bidi algorithm declares a loop variable `j` but never uses it: the loop condition and\nbody use the outer loop counter `i` instead.\n```csharp\nfor (var j = sequenceStart; i < sequenceEnd; ++i)\n{\n    _runResolvedClasses[i] = BidiClass.EuropeanNumber;\n}\n```\nIt currently produces the correct result only because `i == sequenceStart` on entry (and `i` is then\nreset by the following `i = sequenceEnd;`). This is a fragile copy-paste typo: it mutates the outer\nloop counter as a side effect and leaves `j` dead, so any future change to the starting index would\nsilently break the whitespace/European-terminator resolution.","fix":"Use `j` consistently:\n```csharp\nfor (var j = sequenceStart; j < sequenceEnd; ++j)\n{\n    _runResolvedClasses[j] = BidiClass.EuropeanNumber;\n}\n```","locations":[{"ref":"src/Avalonia.Base/Media/TextFormatting/Unicode/BiDiAlgorithm.cs:1030-1033","code":" 1030 |                         for (var j = sequenceStart; i < sequenceEnd; ++i)\n 1031 |                         {\n 1032 |                             _runResolvedClasses[i] = BidiClass.EuropeanNumber;\n 1033 |                         }","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Media/TextFormatting/Unicode/BiDiAlgorithm.cs#L1030-L1033"}]},
{"id":"CPY_19","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"The `ICompositionGpuInterop.ImportSemaphore(ICompositionImportableSharedGpuContextSemaphore)` overload declares its return type as `ICompositionImportedGpuImage` instead of `ICompositionImportedGpuSemaphore` - a copy-paste from the `ImportImage` overloads directly above it. This is a public API defined in `CompositionExternalMemory.cs`; a caller of this overload cannot obtain a usable semaphore object. The implementation in `CompositionInterop.cs` mirrors the wrong signature and simply throws `NotSupportedException`.","fix":"Change the interface method (and the implementation) return type to `ICompositionImportedGpuSemaphore ImportSemaphore(ICompositionImportableSharedGpuContextSemaphore image);`.","locations":[{"ref":"src/Avalonia.Base/Rendering/Composition/CompositionExternalMemory.cs:52","code":"   52 |     ICompositionImportedGpuImage ImportSemaphore(ICompositionImportableSharedGpuContextSemaphore image);","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Rendering/Composition/CompositionExternalMemory.cs#L52"},{"ref":"src/Avalonia.Base/Rendering/Composition/CompositionInterop.cs:54-57","code":"   54 |     public ICompositionImportedGpuImage ImportSemaphore(ICompositionImportableSharedGpuContextSemaphore image)\n   55 |     {\n   56 |         throw new System.NotSupportedException();\n   57 |     }","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Rendering/Composition/CompositionInterop.cs#L54-L57"}]},
{"id":"CPY_20","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"medium","description":"`ServerCompositionVisual.UpdateContext` uses an asymmetric condition for balancing the effect dirty-region push/pop. `PreSubgraph` increments state using the virtual `HasEffect` property (`node is { _isDirtyForRenderInSubgraph: true, HasEffect: true }`), while `PostSubgraph` decrements using the raw field (`node is { _isDirtyForRenderInSubgraph: true, Effect: not null }`). `HasEffect` is declared `protected virtual bool HasEffect => Effect != null;` explicitly to allow subclasses to report an effect without an `Effect` value; the moment any subclass overrides it, the pre/post branches diverge and the `_dirtyRegionDisableCount` counter (and the extra dirty-rect add) become unbalanced, corrupting dirty-region tracking. Currently no subclass overrides `HasEffect`, so this is latent, but the inconsistency is clearly unintentional.","fix":"Use the same predicate in both places. In `PostSubgraph` (line 163) replace `Effect: not null` with the `HasEffect` property so pre/post stay symmetric: `node is { _isDirtyForRenderInSubgraph: true, HasEffect: true }`.","locations":[{"ref":"src/Avalonia.Base/Rendering/Composition/Server/ServerCompositionVisual/ServerCompositionVisual.Update.cs:74-90","code":"   74 |             if (node._isDirtyForRender || node is { _isDirtyForRenderInSubgraph: true, HasEffect: true })\n   75 |             {\n   76 |                 // If bounds haven't actually changed, there is no point in adding them now since they will be added\n   77 |                 // again in PostSubgraph.\n   78 |                 if (node._needsBoundingBoxUpdate && !AreDirtyRegionsDisabled())\n   79 |                 {\n   80 |                     // We add this node's bbox to the dirty region. Alternatively we could walk the sub-graph and add the\n   81 |                     // bbox of each node's content to the dirty region. Note that this is much harder to do because if the\n   82 |                     // transform changes we don't know anymore the old transform. We would have to use to a two phased dirty\n   83 |                     // region algorithm.\n   84 |                     AddToDirtyRegion(node._transformedSubTreeBounds);\n   85 |                 }\n   86 |                 \n   87 |                 // If we added a node in the parent chain to the bbox we don't need to add anything below this node\n   88 |                 // to the dirty region.\n   89 |                 _dirtyRegionDisableCount++;\n   90 |             }","lines":17,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Rendering/Composition/Server/ServerCompositionVisual/ServerCompositionVisual.Update.cs#L74-L90"},{"ref":"src/Avalonia.Base/Rendering/Composition/Server/ServerCompositionVisual/ServerCompositionVisual.Update.cs:163-167","code":"  163 |             if(node._isDirtyForRender || node is { _isDirtyForRenderInSubgraph: true, Effect: not null })\n  164 |             {\n  165 |                 _dirtyRegionDisableCount--;\n  166 |                 AddToDirtyRegion(node._transformedSubTreeBounds);\n  167 |             }","lines":5,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Rendering/Composition/Server/ServerCompositionVisual/ServerCompositionVisual.Update.cs#L163-L167"}]},
{"id":"CPY_21","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"`PooledInlineList<T>.Remove` tests the wrong variable. When the list has grown past one element the items are stored in the internal `_item` (a `SimplePooledList`), but the code checks `if (item is SimplePooledList list)` where `item` is the element being removed (a `T`). Since `T` can never be the private `SimplePooledList`, that branch is dead and `Remove` always returns `false` (never removing anything) once the list holds 2+ items. It should test `_item`. This method currently has no callers (both usages only Add/Dispose/enumerate), so it is a latent bug, but it is a real correctness defect in the reusable API.","fix":"Check the backing field, not the incoming element:\n```csharp\nif (_item is SimplePooledList list)\n    return list.Remove(item);\n```","locations":[{"ref":"src/Avalonia.Base/Utilities/PooledInlineList.cs:32-44","code":"   32 |     public bool Remove(T item)\n   33 |     {\n   34 |         if (item == _item)\n   35 |         {\n   36 |             _item = null;\n   37 |             return true;\n   38 |         }\n   39 | \n   40 |         if (item is SimplePooledList list)\n   41 |             return list.Remove(item);\n   42 | \n   43 |         return false;\n   44 |     }","lines":13,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Utilities/PooledInlineList.cs#L32-L44"}]},
{"id":"CPY_22","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"LinkProgramAndGetError is missing the `logLength == 0` guard that its sibling CompileShaderAndGetError has (lines 243-244). If the driver reports GL_INFO_LOG_LENGTH as 0 on a failed link, the code allocates a zero-length buffer and returns an empty (but non-null) string, silently discarding the link-failure signal instead of falling back to a reasonable buffer size.","fix":"Add the same fallback used in `CompileShaderAndGetError`:\n```csharp\nint logLength;\nGetProgramiv(program, GL_INFO_LOG_LENGTH, &logLength);\nif (logLength == 0)\n    logLength = 4096;\n```","locations":[{"ref":"src/Avalonia.OpenGL/GlInterface.cs:278-284","code":"  278 |             int logLength;\n  279 |             GetProgramiv(program, GL_INFO_LOG_LENGTH, &logLength);\n  280 |             var logData = new byte[logLength];\n  281 |             int len;\n  282 |             fixed (void* ptr = logData)\n  283 |                 GetProgramInfoLog(program, logLength, out len, ptr);\n  284 |             return Encoding.UTF8.GetString(logData, 0, len);","lines":7,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.OpenGL/GlInterface.cs#L278-L284"},{"ref":"src/Avalonia.OpenGL/GlInterface.cs:244-252","code":"  244 |             int logLength;\n  245 |             GetShaderiv(shader, GL_INFO_LOG_LENGTH, &logLength);\n  246 |             if (logLength == 0)\n  247 |                 logLength = 4096;\n  248 |             var logData = new byte[logLength];\n  249 |             int len;\n  250 |             fixed (void* ptr = logData)\n  251 |                 GetShaderInfoLog(shader, logLength, out len, ptr);\n  252 |             return Encoding.UTF8.GetString(logData, 0, len);","lines":9,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.OpenGL/GlInterface.cs#L244-L252"}]},
{"id":"CPY_23","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In GlxDisplay.GetExtensions, the extension string is split on both comma and space (',' and ' '). GLX extension strings are space-separated only (per the GLX spec). The comma separator is likely a copy-paste from EGL extension parsing. Using a comma as a separator is harmless in practice since GLX extension names don't contain commas, but it is incorrect.","fix":"Remove ',' from the split characters: change 'new[] { ',', ' ' }' to 'new[] { ' ' }'.","locations":[{"ref":"src/Avalonia.X11/Glx/Glx.cs:120","code":"  120 | ","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.X11/Glx/Glx.cs#L120"}]},
{"id":"CPY_24","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"`InputHandler.s_keys` maps `UIKeyboardHidUsage.KeyboardHyphen` to\n`PhysicalKey.NumPadSubtract` (line 432) and `UIKeyboardHidUsage.KeyboardEqualSign`\nto `PhysicalKey.NumPadEqual` (line 433). These HID usages refer to the main-keyboard\nhyphen/minus and equals keys, not the numpad equivalents. The physical key labels\non keyboards are `PhysicalKey.Minus` (HID 0x2D, the same usage as\n`KeyboardHyphen`) and `PhysicalKey.Equal` (HID 0x2E). Mapping them to numpad\nphysical keys causes incorrect shortcut matching and key display.","fix":"Change `PhysicalKey.NumPadSubtract` to `PhysicalKey.Minus` for `KeyboardHyphen`, and `PhysicalKey.NumPadEqual` to `PhysicalKey.Equal` for `KeyboardEqualSign`.","locations":[{"ref":"src/iOS/Avalonia.iOS/InputHandler.cs:432-433","code":"  432 |         [UIKeyboardHidUsage.KeyboardHyphen] = PhysicalKey.NumPadSubtract,\n  433 |         [UIKeyboardHidUsage.KeyboardEqualSign] = PhysicalKey.NumPadEqual,","lines":2,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/iOS/Avalonia.iOS/InputHandler.cs#L432-L433"}]},
{"id":"CPY_25","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"very_easy","description":"`StringLogSink` has two near-duplicate `Format` methods. The generic `Format<T0,T1,T2>` overload emits the area prefix as \"[area] \" (with a trailing space, line 58), while the params-array `Format` overload emits \"[area]\" (no trailing space, line 102). Log lines produced by the parameterless vs parameterized `Log` calls therefore have inconsistent spacing after the area tag.","fix":"Make both overloads emit the same prefix. Change line 102 from `result.Append(']');` to `result.Append(\"] \");` (or extract the shared prefix/body into a single helper to remove the duplication entirely).","locations":[{"ref":"src/Avalonia.Base/Logging/StringLogSink.cs:56-58","code":"   56 |             result.Append('[');\n   57 |             result.Append(area);\n   58 |             result.Append(\"] \");","lines":3,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Logging/StringLogSink.cs#L56-L58"},{"ref":"src/Avalonia.Base/Logging/StringLogSink.cs:100-102","code":"  100 |             result.Append('[');\n  101 |             result.Append(area);\n  102 |             result.Append(']');","lines":3,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Logging/StringLogSink.cs#L100-L102"}]},
{"id":"CPY_26","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"very_easy","description":"In RenderOptions.MergeWith, the second pragma around the obsolete TextRenderingMode read is `#pragma warning disable CS0618` where it should be `restore`. As a result the CS0618 (obsolete-usage) warning stays suppressed for the remainder of the file rather than being re-enabled after the intentional obsolete access. Harmless at runtime but hides genuine obsolete-usage warnings.","fix":"```csharp\n#pragma warning disable CS0618\n                textRenderingMode = other.TextRenderingMode;\n#pragma warning restore CS0618   // was: disable\n```","locations":[{"ref":"src/Avalonia.Base/Media/RenderOptions.cs:172-174","code":"  172 | #pragma warning disable CS0618\n  173 |                 textRenderingMode = other.TextRenderingMode;\n  174 | #pragma warning disable CS0618","lines":3,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Media/RenderOptions.cs#L172-L174"}]},
{"id":"CPY_27","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"very_easy","description":"`SelectionContainerProperty` carries the doc comment \"Indicates the element is currently selected.\" copied verbatim from `IsSelectedProperty`. It should describe the selection container, not selection state.","fix":"Replace the second comment with something accurate, e.g. `/// <summary>Identifies the container that manages the element's selection.<\/summary>`.","locations":[{"ref":"src/Avalonia.Controls/Automation/SelectionItemPatternIdentifiers.cs:10-14","code":"   10 |         /// <summary>Indicates the element is currently selected.<\/summary>\n   11 |         public static AutomationProperty IsSelectedProperty { get; } = new AutomationProperty();\n   12 | \n   13 |         /// <summary>Indicates the element is currently selected.<\/summary>\n   14 |         public static AutomationProperty SelectionContainerProperty { get; } = new AutomationProperty();","lines":5,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/Automation/SelectionItemPatternIdentifiers.cs#L10-L14"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"very_easy","description":"AvnGlRenderTarget::BeginDrawing calls MakeCurrent (which locks the CGL context) and then calls prepareForGlRender. If prepareForGlRender fails (returns non-zero HRESULT), the function returns the error code early. The ComPtr<IUnknown> releaseContext is a local on the stack, so it will be destroyed and the CGL context will be unlocked, which is correct. However, the surface obtained from getNextSurfaceInSafeContext is leaked back into neither the queue nor any active slot - it is simply dropped. A newly allocated IOSurfaceHolder (including its IOSurface) that was just created is lost without being placed back or freed.","fix":"When prepareForGlRender fails, either return the surface back to the surface queue or present it so it can be reused. At minimum, add a comment that the IOSurface is intentionally discarded in the error path.","locations":[{"ref":"native/Avalonia.Native/src/OSX/rendertarget.mm:365-378","code":"  365 |     virtual HRESULT BeginDrawing(IAvnGlSurfaceRenderingSession** ret)  override\n  366 |     {\n  367 |         START_COM_ARP_CALL;\n  368 |         ComPtr<IUnknown> releaseContext;\n  369 |         @synchronized (_target->lock) {\n  370 |             auto surface = [_target getNextSurfaceInSafeContext];\n  371 |             _target->_glContext->MakeCurrent(releaseContext.getPPV());\n  372 |             HRESULT res = [surface prepareForGlRender];\n  373 |             if(res)\n  374 |                 return res;\n  375 |             *ret = new AvnGlRenderingSession(_target, surface, releaseContext);\n  376 |             return S_OK;\n  377 |         }\n  378 |     }","lines":14,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/native/Avalonia.Native/src/OSX/rendertarget.mm#L365-L378"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"very_easy","description":"GlRenderTarget.BeginRenderingSession() calls SKSurface.Create() but never checks whether the returned surface is null. Skia returns null when the render target parameters are invalid (e.g. unsupported sample count on a driver). A null SKSurface is silently stored in GlGpuSession and will cause a NullReferenceException the first time drawing commands are issued.","fix":"Add a null check: if (surface == null) throw new InvalidOperationException(\"SKSurface.Create returned null\"); Dispose renderTarget and glSession in the failure path.","locations":[{"ref":"src/Skia/Avalonia.Skia/Gpu/OpenGl/GlRenderTarget.cs:92-98","code":"   92 |                     var surface = SKSurface.Create(_grContext, renderTarget,\n   93 |                         glSession.IsYFlipped ? GRSurfaceOrigin.TopLeft : GRSurfaceOrigin.BottomLeft,\n   94 |                         colorType, _surfaceProperties);\n   95 | \n   96 |                     success = true;\n   97 | \n   98 |                     return new GlGpuSession(_grContext, renderTarget, surface, glSession);","lines":7,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Skia/Avalonia.Skia/Gpu/OpenGl/GlRenderTarget.cs#L92-L98"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"medium","description":"In WglDisplay.CreateContext(), when context creation succeeds the debug-message\ncallback is installed (via wglMakeCurrent + s_glDebugMessageCallback) BEFORE\nverifying that the context is valid (context != IntPtr.Zero check comes after).\nIf s_glDebugMessageCallback is non-null and context is zero (wglCreateContextAttribsArb\nfailed), the code tries to call wglMakeCurrent(dc, 0) which would clear the bootstrap\ncontext, and then falls through to the next version without restoring state. More\ncritically: the WglRestoreContext constructor always calls wglMakeCurrent(dc, context),\nso passing a zero context crashes with an OpenGlException before the check at line 156.\nActually the flow tries to install the debug callback regardless of whether context!=0,\nbut WglRestoreContext will throw if context is 0 since it will fail to make a null\ncontext current. That exception propagates out of CreateContext uncaught, leaking the\n`window` HWND and `dc` HDC that were already obtained.","fix":"Move the debug callback installation block (lines 150-154) inside the\n`if (context != IntPtr.Zero)` check, or check context before attempting to use it.\nAlso ensure that when all versions fail and null is returned, the window and dc\ncreated at lines 119-121 are properly released before returning null.","locations":[{"ref":"src/Windows/Avalonia.Win32/OpenGl/WglDisplay.cs:150-163","code":"  150 |                     if (s_glDebugMessageCallback is not null)\n  151 |                     {\n  152 |                         using (new WglRestoreContext(dc, context, null))\n  153 |                             s_glDebugMessageCallback(Marshal.GetFunctionPointerForDelegate(_debugCallback), IntPtr.Zero);\n  154 |                     }\n  155 | \n  156 |                     if (context != IntPtr.Zero)\n  157 |                         return new WglContext(shareContext, version, context, window, dc,\n  158 |                             _defaultPixelFormat, _defaultPfd);\n  159 |                 }\n  160 | \n  161 |                 WglGdiResourceManager.ReleaseDC(window, dc);\n  162 |                 WglGdiResourceManager.DestroyWindow(window);\n  163 |                 return null;","lines":14,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Windows/Avalonia.Win32/OpenGl/WglDisplay.cs#L150-L163"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"very_easy","description":"AvnSoftwareRenderTarget::SetFrame calls [_target setSwFrame:fb] and ignores its HRESULT return value, always returning 0 (S_OK) to the caller. If setSwFrame fails (e.g., IOSurfaceLock returns an error, or the pixel format is invalid), the error is silently swallowed and the caller believes the frame was committed successfully.","fix":"Capture and propagate the return value: HRESULT res = [_target setSwFrame:fb]; return res;","locations":[{"ref":"native/Avalonia.Native/src/OSX/rendertarget.mm:398-402","code":"  398 |     HRESULT SetFrame(AvnFramebuffer *fb) override {\n  399 |         START_COM_ARP_CALL;\n  400 |         [_target setSwFrame: fb];\n  401 |         return 0;\n  402 |     }","lines":5,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/native/Avalonia.Native/src/OSX/rendertarget.mm#L398-L402"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"very_easy","description":"AndroidStorageFile.MoveAsync() catches Exception broadly and calls newFile?.DeleteAsync() without awaiting it in the catch block. This means the cleanup delete runs fire-and-forget; if it fails, the error is silently swallowed. Additionally, the function returns null after the non-awaited cleanup, leaving a dangling empty file on the device.","fix":"Await newFile.DeleteAsync() in the catch block: catch { if (newFile != null) await newFile.DeleteAsync(); }","locations":[{"ref":"src/Android/Avalonia.Android/Platform/Storage/AndroidStorageItem.cs:643-667","code":"  643 |         async Task<AndroidStorageFile?> MoveFileByCopy()\n  644 |         {\n  645 |             var newFile = await storageFolder.CreateFileAsync(Name) as AndroidStorageFile;\n  646 | \n  647 |             try\n  648 |             {\n  649 |                 if (newFile != null)\n  650 |                 {\n  651 |                     using var input = await OpenReadAsync();\n  652 |                     using var output = await newFile.OpenWriteAsync();\n  653 | \n  654 |                     await input.CopyToAsync(output);\n  655 | \n  656 |                     await DeleteAsync();\n  657 | \n  658 |                     return new AndroidStorageFile(Activity, newFile.Uri, storageFolder);\n  659 |                 }\n  660 |             }\n  661 |             catch\n  662 |             {\n  663 |                 newFile?.DeleteAsync();\n  664 |             }\n  665 | \n  666 |             return null;\n  667 |         }","lines":25,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Android/Avalonia.Android/Platform/Storage/AndroidStorageItem.cs#L643-L667"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`HorizontalMetricsTable` and `VerticalMetricsTable` locate metrics purely from values declared elsewhere in the font: `_numGlyphs` (from `maxp`) and `_numOfHMetrics`/`_numOfVMetrics` (from `hhea`/`vhea`), never validating them against the actual `hmtx`/`vmtx` table length. For any `glyphIndex < _numGlyphs` the code does `reader.Seek(glyphIndex * 4)` (or `_numOfHMetrics * 4 + lsbIndex * 2`) and reads. If the font declares a large `numberOfHMetrics`/`numGlyphs` but ships a short/truncated `hmtx`/`vmtx` table, `Seek` throws `ArgumentOutOfRangeException` (or `ReadUInt16` throws `InvalidOperationException`). These `Try*` methods are documented to return `false` for invalid input, but instead throw, and they are called at render/measure time via `GlyphTypeface.TryGetHorizontalGlyphAdvance(s)`/`TryGetGlyphMetrics` - a path NOT wrapped by `GlyphTypeface.TryCreate`. Glyph indices originate from the same (untrusted) font's cmap, so a crafted font passes load and then crashes text layout. Affects all six accessor methods in each class.","fix":"Before seeking, bounds-check against the actual table span length and return `false` (matching the documented contract) when the offset would exceed it. E.g. clamp `_numOfHMetrics`/`_numGlyphs` to what `_data.Length` can hold at load time, or in each accessor compute the required offset and verify `offset + neededBytes <= _data.Length` before calling `reader.Seek`, returning `false` otherwise. Wrapping the seek/read in a `try`/`catch` that returns `false` is an acceptable minimal fix.","locations":[{"ref":"src/Avalonia.Base/Media/Fonts/Tables/Metrics/HorizontalMetricsTable.cs:37-225","code":"   37 |         public bool TryGetMetrics(ushort glyphIndex, out HorizontalGlyphMetric metric)\n   38 |         {\n   39 |             metric = default;\n   40 | \n   41 |             if (glyphIndex >= _numGlyphs)\n   42 |             {\n   43 |                 return false;\n   44 |             }\n   45 | \n   46 |             var reader = new BigEndianBinaryReader(_data.Span);\n   47 | \n   48 |             if (glyphIndex < _numOfHMetrics)\n   49 |             {\n   50 |                 reader.Seek(glyphIndex * 4);\n   51 | \n   52 |                 ushort advanceWidth = reader.ReadUInt16();\n   53 |                 short leftSideBearing = reader.ReadInt16();\n   54 | \n   55 |                 metric = new HorizontalGlyphMetric(advanceWidth, leftSideBearing);\n   56 |             }\n   57 |             else\n   58 |             {\n   59 |                 reader.Seek((_numOfHMetrics - 1) * 4);\n   60 | \n   61 |                 ushort lastAdvanceWidth = reader.ReadUInt16();\n   62 | \n   63 |                 int lsbIndex = glyphIndex - _numOfHMetrics;\n   64 |                 int lsbOffset = _numOfHMetrics * 4 + lsbIndex * 2;\n   65 | \n   66 |                 reader.Seek(lsbOffset);\n   67 | \n   68 |                 short leftSideBearing = reader.ReadInt16();\n   69 | \n   70 |                 metric = new HorizontalGlyphMetric(lastAdvanceWidth, leftSideBearing);\n   71 |             }\n   72 | \n   73 |             return true;\n   74 |         }\n   75 | \n   76 |         /// <summary>\n   77 |         /// Attempts to retrieve the advance width for a single glyph.\n   78 |         /// <\/summary>\n   79 |         /// <param name=\"glyphIndex\">Glyph index to query.<\/param>\n   80 |         /// <param name=\"advance\">When this method returns, contains the advance width if the glyph index is valid; otherwise, zero.<\/param>\n   81 |         /// <returns><c>true<\/c> if the glyph index is valid and the advance was retrieved; otherwise, <c>false<\/c>.<\/returns>\n   82 |         public bool TryGetAdvance(ushort glyphIndex, out ushort advance)\n   83 |         {\n   84 |             advance = 0;\n   85 | \n   86 |             if (glyphIndex >= _numGlyphs)\n   87 |             {\n   88 |                 return false;\n   89 |             }\n   90 | \n   91 |             var reader = new BigEndianBinaryReader(_data.Span);\n   92 | \n   93 |             if (glyphIndex < _numOfHMetrics)\n   94 |             {\n   95 |                 reader.Seek(glyphIndex * 4);\n   96 | \n   97 |                 advance = reader.ReadUInt16();\n   98 |             }\n   99 |             else\n  100 |             {\n  101 |                 reader.Seek((_numOfHMetrics - 1) * 4);\n  102 | \n  103 |                 advance = reader.ReadUInt16();\n  104 |             }\n  105 | \n  106 |             return true;\n  107 |         }\n  108 | \n  109 |         /// <summary>\n  110 |         /// Attempts to retrieve advance widths for multiple glyphs in a single operation.\n  111 |         /// <\/summary>\n  112 |         /// <param name=\"glyphIndices\">Read-only span of glyph indices to query.<\/param>\n  113 |         /// <param name=\"advances\">Output span to write the advance widths. Must be at least as long as <paramref name=\"glyphIndices\"/>.<\/param>\n  114 |         /// <returns><c>true<\/c> if all glyph indices are valid and advances were retrieved; otherwise, <c>false<\/c>.<\/returns>\n  115 |         /// <remarks>\n  116 |         /// This method is more efficient than calling <see cref=\"TryGetAdvance\"/> multiple times as it reuses\n  117 |         /// the same reader and span reference. If any glyph index is invalid, the method returns <c>false<\/c>\n  118 |         /// and the contents of <paramref name=\"advances\"/> are undefined.\n  119 |         /// <\/remarks>\n  120 |         public bool TryGetAdvances(ReadOnlySpan<ushort> glyphIndices, Span<ushort> advances)\n  121 |         {\n  122 |             if (advances.Length < glyphIndices.Length)\n  123 |             {\n  124 |                 return false;\n  125 |             }\n  126 | \n  127 |             var data = _data.Span;\n  128 |             var reader = new BigEndianBinaryRead
