{"id":"MEM_16","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"medium","description":"`IOSLauncher.LaunchFileAsync` creates a `UIDocumentInteractionController` on the\nstack (local variable `documentController`, line 32) and immediately calls\n`PresentPreview(animated: true)`. The preview sheet is asynchronous - the user\ninteracts with it over time - but the `documentController` object is not retained\nanywhere after the method returns. In Xamarin.iOS / .NET for iOS, native objects\nwrapped by managed wrappers are released when the managed wrapper is GC'd; once\n`LaunchFileAsync` returns the wrapper becomes unreachable. The native\n`UIDocumentInteractionController` may be deallocated while the preview sheet is\nstill visible, causing a crash or a blank/broken preview UI.","fix":"Store `documentController` in a field on `IOSLauncher` (or use a static variable) until the interaction is complete. Implement `UIDocumentInteractionControllerDelegate.DidEndSendingToApplication` / `DidDismissOpenInMenu` to know when it is safe to release the controller.","locations":[{"ref":"src/iOS/Avalonia.iOS/IOSLauncher.cs:32-39","code":"   32 |             var documentController = new UIDocumentInteractionController()\n   33 |             {\n   34 |                 Name = storageItem.Name,\n   35 |                 Url = uri\n   36 |             };\n   37 | \n   38 |             var result = documentController.PresentPreview(true);\n   39 |             return Task.FromResult(result);","lines":8,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/iOS/Avalonia.iOS/IOSLauncher.cs#L32-L39"}]},
{"id":"MEM_17","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"PlatformSettings::RegisterColorsChange stores the observer object in a plain ivar (observer), so there is no KVO removeObserver call at object destruction time. When PlatformSettings is destroyed, the observer remains registered against NSApplication and will call back into freed memory.","fix":"Add a destructor to PlatformSettings that calls [[NSApplication sharedApplication] removeObserver:observer forKeyPath:@\"effectiveAppearance\"].","locations":[{"ref":"native/Avalonia.Native/src/OSX/PlatformSettings.mm:71-76","code":"   71 |     virtual void RegisterColorsChange(IAvnActionCallback *callback) override\n   72 |     {\n   73 |         if (@available(macOS 10.14, *))\n   74 |         {\n   75 |             observer = [[CocoaThemeObserver alloc] initWithCallback: callback];\n   76 |             [[NSApplication sharedApplication] addObserver:observer forKeyPath:@\"effectiveAppearance\" options:NSKeyValueObservingOptionNew context:nil];","lines":6,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/native/Avalonia.Native/src/OSX/PlatformSettings.mm#L71-L76"}]},
{"id":"MEM_18","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"In app.mm, CreateAvnStringArray returns a newly allocated ComObject with ref count 1. The result is passed directly to FilesOpened / UrlsOpened without wrapping in a ComPtr or releasing afterward. The COM object is leaked unless the callee takes ownership and releases it.","fix":"Wrap the result in a ComPtr<IAvnStringArray> so it is released when the call returns, or ensure the callee documents that it takes ownership and releases the object.","locations":[{"ref":"native/Avalonia.Native/src/OSX/app.mm:74-76","code":"   74 |     auto array = CreateAvnStringArray(filenames);\n   75 |     \n   76 |     _events->FilesOpened(array);","lines":3,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/native/Avalonia.Native/src/OSX/app.mm#L74-L76"},{"ref":"native/Avalonia.Native/src/OSX/app.mm:81-83","code":"   81 |     auto array = CreateAvnStringArray(urls);\n   82 |     \n   83 |     _events->UrlsOpened(array);","lines":3,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/native/Avalonia.Native/src/OSX/app.mm#L81-L83"}]},
{"id":"MEM_19","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"very_easy","description":"AvnGlDisplay opens /System/Library/Frameworks/OpenGL.framework/Versions/A/Libraries/libGL.dylib via dlopen in its constructor but never calls dlclose in any destructor. The library handle _libgl is leaked for the lifetime of the process. Additionally, GetProcAddress calls dlsym(_libgl, proc) without checking that _libgl is non-null (dlopen can return null if the path does not exist), which would cause a crash on systems where the path is absent.","fix":"Add a destructor to AvnGlDisplay that calls dlclose(_libgl) if _libgl != nullptr. Add a null check for _libgl before calling dlsym.","locations":[{"ref":"native/Avalonia.Native/src/OSX/cgl.mm:173-185","code":"  173 |     void* _libgl;\n  174 |     \n  175 | public:\n  176 |     FORWARD_IUNKNOWN()\n  177 |     \n  178 |     AvnGlDisplay()\n  179 |     {\n  180 |         _libgl = dlopen(\"/System/Library/Frameworks/OpenGL.framework/Versions/A/Libraries/libGL.dylib\", RTLD_LAZY);\n  181 |     }\n  182 |     \n  183 |     virtual void* GetProcAddress(char* proc)  override\n  184 |     {\n  185 |         return dlsym(_libgl, proc);","lines":13,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/native/Avalonia.Native/src/OSX/cgl.mm#L173-L185"}]},
{"id":"MEM_20","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"`Animation.RunAsync` guards against looping animations by calling `run.SetException(...)` when `IterationCount == Infinite`, but it does not `return` afterwards. Execution falls through and still calls `this.Apply(...)`, which subscribes the infinite animation to the clock. Because the animation never completes, the `onComplete` callback that disposes `subscriptions` is never invoked, so the animation runs forever on the target control and the subscriptions leak, while the returned task is already faulted.","fix":"After `run.SetException(...)` for the infinite case, `return run.Task;` immediately so the animation is never applied. For example wrap the Apply/cancellation-registration block in an `else`, or add an early return right after `SetException`.","locations":[{"ref":"src/Avalonia.Base/Animation/Animation.cs:380-401","code":"  380 |             var run = new TaskCompletionSource<object?>();\n  381 | \n  382 |             if (this.IterationCount == IterationCount.Infinite)\n  383 |                 run.SetException(new InvalidOperationException(\"Looping animations must not use the Run method.\"));\n  384 | \n  385 |             IDisposable? subscriptions = null, cancellation = null;\n  386 |             subscriptions = this.Apply(control, clock, Observable.Return(true), () =>\n  387 |             {\n  388 |                 run.TrySetResult(null);\n  389 |                 subscriptions?.Dispose();\n  390 |                 cancellation?.Dispose();\n  391 |             }, isManuallyStarted: true);\n  392 | \n  393 |             cancellation = cancellationToken.Register(() =>\n  394 |             {\n  395 |                 run.TrySetResult(null);\n  396 |                 subscriptions?.Dispose();\n  397 |                 cancellation?.Dispose();\n  398 |             });\n  399 | \n  400 |             return run.Task;\n  401 |         }","lines":22,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Animation/Animation.cs#L380-L401"}]},
{"id":"MEM_21","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"`ParentDataContextNode` subscribes to the visual parent's `PropertyChanged` event\n(`_parent.PropertyChanged += OnParentPropertyChanged` in `SetParent`), but this subscription is\nonly ever removed from inside `SetParent` (via the private `Unsubscribe()`). When the binding is\nstopped, `BindingExpression.StopCore` calls `node.SetSource(AvaloniaProperty.UnsetValue, null)` for\nevery node. In `ExpressionNode.SetSource`, the `UnsetValue` branch calls the override\n`Unsubscribe(object oldSource)` (which only detaches `OnPropertyChanged` from the child element) and\nthen sets `_source = null` WITHOUT calling `OnSourceChanged`/`SetParent`. As a result\n`OnParentPropertyChanged` is never detached from `_parent` on teardown, so the still-live parent\ncontrol keeps a strong reference to the node -> `Owner` `BindingExpression` -> the whole node graph.\nSince `ParentDataContextNode` is created for every non-rooted binding whose target property is\n`DataContext` (see `ExpressionNodeFactory.CreateDataContext`), this is a common path, and repeatedly\ncreating/tearing down such bindings under a long-lived parent accumulates dangling handlers on the\nparent (memory growth plus stale handler invocations on every parent DataContext change).","fix":"Ensure the parent subscription is released when the node's source is unset. Detach the parent handler\nin the `Unsubscribe(object oldSource)` override (and reset `_parent`), e.g.:\n```csharp\nprotected override void Unsubscribe(object oldSource)\n{\n    if (oldSource is AvaloniaObject oldElement)\n        oldElement.PropertyChanged -= OnPropertyChanged;\n\n    // Also release the subscription made in SetParent, which the UnsetValue\n    // branch of ExpressionNode.SetSource would otherwise skip.\n    Unsubscribe();\n    _parent = s_unset;\n}\n```","locations":[{"ref":"src/Avalonia.Base/Data/Core/ExpressionNodes/ParentDataContextNode.cs:28-57","code":"   28 |     protected override void Unsubscribe(object oldSource)\n   29 |     {\n   30 |         if (oldSource is AvaloniaObject oldElement)\n   31 |             oldElement.PropertyChanged -= OnPropertyChanged;\n   32 |     }\n   33 | \n   34 |     private void SetParent(AvaloniaObject? parent)\n   35 |     {\n   36 |         if (parent == _parent)\n   37 |             return;\n   38 | \n   39 |         Unsubscribe();\n   40 |         _parent = parent;\n   41 | \n   42 |         if (_parent is IDataContextProvider)\n   43 |         {\n   44 |             _parent.PropertyChanged += OnParentPropertyChanged;\n   45 |             SetValue(_parent.GetValue(StyledElement.DataContextProperty));\n   46 |         }\n   47 |         else\n   48 |         {\n   49 |             SetValue(null);\n   50 |         }\n   51 |     }\n   52 | \n   53 |     private void Unsubscribe()\n   54 |     {\n   55 |         if (_parent is not null)\n   56 |             _parent.PropertyChanged -= OnParentPropertyChanged;\n   57 |     }","lines":30,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Data/Core/ExpressionNodes/ParentDataContextNode.cs#L28-L57"},{"ref":"src/Avalonia.Base/Data/Core/ExpressionNodes/ExpressionNode.cs:104-117","code":"  104 |         if (source == AvaloniaProperty.UnsetValue)\n  105 |         {\n  106 |             // If the source is unset then the value is unset. We explicitly do not want to call\n  107 |             // OnSourceChanged as we don't want to raise errors for subsequent nodes in the\n  108 |             // binding change.\n  109 |             _source = null;\n  110 |             _value = AvaloniaProperty.UnsetValue;\n  111 |         }\n  112 |         else\n  113 |         {\n  114 |             _source = new(source);\n  115 |             try { OnSourceChanged(source, dataValidationError); }\n  116 |             catch (Exception e) { SetError(e); }\n  117 |         }","lines":14,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Data/Core/ExpressionNodes/ExpressionNode.cs#L104-L117"}]},
{"id":"MEM_22","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"`GestureRecognizerCollection.Add` subscribes to the parent's `TemplatedParentProperty` observable to forward the templated parent to the recognizer, but the returned `IDisposable` is discarded. `Remove` clears `Target` and the logical parent but never disposes this subscription. The parent's observable keeps a strong reference to a closure capturing the removed `GestureRecognizer`, so a recognizer that is added and later removed remains subscribed and reachable for as long as the parent element lives, leaking the recognizer (and continuing to mutate its `TemplatedParent` after removal).","fix":"Store the `IDisposable` from `Subscribe(...)` (e.g. in a dictionary keyed by recognizer, or on the recognizer) when adding, and dispose it in `Remove` when the recognizer is successfully removed.","locations":[{"ref":"src/Avalonia.Base/Input/GestureRecognizers/GestureRecognizerCollection.cs:31-58","code":"   31 |             // Hacks to make bindings work\n   32 | \n   33 |             if (_inputElement is ILogical logicalParent && recognizer is ISetLogicalParent logical)\n   34 |             {\n   35 |                 logical.SetParent(logicalParent);\n   36 |                 if (recognizer is StyledElement styleableRecognizer\n   37 |                     && _inputElement is StyledElement styleableParent)\n   38 |                     styleableParent.GetObservable(StyledElement.TemplatedParentProperty).Subscribe(parent => styleableRecognizer.TemplatedParent = parent);\n   39 |             }\n   40 |         }\n   41 | \n   42 |         public bool Remove(GestureRecognizer recognizer)\n   43 |         {\n   44 |             if (_recognizers == null)\n   45 |                 return false;\n   46 | \n   47 |             var removed = _recognizers.Remove(recognizer);\n   48 | \n   49 |             if (removed)\n   50 |             {\n   51 |                 recognizer.Target = null;\n   52 | \n   53 |                 if (recognizer is ISetLogicalParent logical)\n   54 |                     logical.SetParent(null);\n   55 |             }\n   56 | \n   57 |             return removed;\n   58 |         }","lines":28,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Input/GestureRecognizers/GestureRecognizerCollection.cs#L31-L58"}]},
{"id":"MEM_23","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"WriteableBitmap holds a `BitmapMemory? _pixelFormatMemory` (unmanaged Marshal.AllocHGlobal buffer) when a non-native pixel format requires transcoding, but it never overrides Bitmap.Dispose to dispose it. Calling Dispose() on such a WriteableBitmap frees only the platform impl (base class), leaving the AllocHGlobal buffer to be reclaimed non-deterministically by BitmapMemory's finalizer. For large bitmaps this is a sizeable native allocation retained until the next GC despite explicit disposal.","fix":"Override Dispose in WriteableBitmap to release the buffer:\n```csharp\npublic override void Dispose()\n{\n    _pixelFormatMemory?.Dispose();\n    base.Dispose();\n}\n```","locations":[{"ref":"src/Avalonia.Base/Media/Imaging/WriteableBitmap.cs:11-38","code":"   11 |     public class WriteableBitmap : Bitmap\n   12 |     {\n   13 |         // Holds a buffer with pixel format that requires transcoding\n   14 |         private readonly BitmapMemory? _pixelFormatMemory = null;\n   15 |         \n   16 |         /// <summary>\n   17 |         /// Initializes a new instance of the <see cref=\"WriteableBitmap\"/> class.\n   18 |         /// <\/summary>\n   19 |         /// <param name=\"size\">The size of the bitmap in device pixels.<\/param>\n   20 |         /// <param name=\"dpi\">The DPI of the bitmap.<\/param>\n   21 |         /// <param name=\"format\">The pixel format (optional).<\/param>\n   22 |         /// <param name=\"alphaFormat\">The alpha format (optional).<\/param>\n   23 |         /// <returns>An instance of the <see cref=\"WriteableBitmap\"/> class.<\/returns>\n   24 |         public WriteableBitmap(PixelSize size, Vector dpi, PixelFormat? format = null, AlphaFormat? alphaFormat = null) \n   25 |             : this(CreatePlatformImpl(size, dpi, format, alphaFormat))\n   26 |         {\n   27 |         }\n   28 | \n   29 |         private WriteableBitmap((IBitmapImpl impl, BitmapMemory? mem) bitmapWithMem) : this(bitmapWithMem.impl,\n   30 |             bitmapWithMem.mem)\n   31 |         {\n   32 |             \n   33 |         }\n   34 |         \n   35 |         private WriteableBitmap(IBitmapImpl impl, BitmapMemory? pixelFormatMemory = null) : base(impl)\n   36 |         {\n   37 |             _pixelFormatMemory = pixelFormatMemory;\n   38 |         }","lines":28,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Media/Imaging/WriteableBitmap.cs#L11-L38"},{"ref":"src/Avalonia.Base/Media/Imaging/BitmapMemory.cs:36-45","code":"   36 |     public void Dispose()\n   37 |     {\n   38 |         ReleaseUnmanagedResources();\n   39 |         GC.SuppressFinalize(this);\n   40 |     }\n   41 | \n   42 |     ~BitmapMemory()\n   43 |     {\n   44 |         ReleaseUnmanagedResources();\n   45 |     }","lines":10,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Media/Imaging/BitmapMemory.cs#L36-L45"}]},
{"id":"MEM_24","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"ColorSpectrum holds up to eleven Bitmap fields (_hueRed/Yellow/Green/Cyan/Blue/Purple, _saturationMinimum/Maximum, _valueBitmap, _minBitmap, _maxBitmap) but has no disposal path. OnDetachedFromVisualTree only calls base and there is no override of a dispose/cleanup that releases these bitmaps. Individual bitmaps are only Disposed when reassigned during a later regeneration; when the control itself is removed/discarded all currently-held bitmaps (native Skia surfaces) are leaked until finalization. UnregisterEvents() disposes the observable subscriptions but not the bitmaps.","fix":"Dispose all bitmap fields when the control is detached/unloaded (e.g. in OnDetachedFromVisualTree or a dedicated cleanup called from UnregisterEvents), setting each field to null after Dispose to avoid double-dispose.","locations":[{"ref":"src/Avalonia.Controls.ColorPicker/ColorSpectrum/ColorSpectrum.cs:196-199","code":"  196 |         protected override void OnDetachedFromVisualTree(VisualTreeAttachmentEventArgs e)\n  197 |         {\n  198 |             base.OnDetachedFromVisualTree(e);\n  199 |         }","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls.ColorPicker/ColorSpectrum/ColorSpectrum.cs#L196-L199"},{"ref":"src/Avalonia.Controls.ColorPicker/ColorSpectrum/ColorSpectrum.cs:69-81","code":"   69 |         private Bitmap? _hueRedBitmap;\n   70 |         private Bitmap? _hueYellowBitmap;\n   71 |         private Bitmap? _hueGreenBitmap;\n   72 |         private Bitmap? _hueCyanBitmap;\n   73 |         private Bitmap? _hueBlueBitmap;\n   74 |         private Bitmap? _huePurpleBitmap;\n   75 | \n   76 |         private Bitmap? _saturationMinimumBitmap;\n   77 |         private Bitmap? _saturationMaximumBitmap;\n   78 | \n   79 |         private Bitmap? _valueBitmap;\n   80 |         private Bitmap? _minBitmap;\n   81 |         private Bitmap? _maxBitmap;","lines":13,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls.ColorPicker/ColorSpectrum/ColorSpectrum.cs#L69-L81"}]},
{"id":"MEM_25","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"In ColorSpectrum.CreateBitmapsAndColorMap() `_minBitmap` is always created (line 1188), but in the HueSaturation/SaturationHue branch only `_maxBitmap` is adopted into a retained field (`_valueBitmap`). The freshly-allocated `_minBitmap` is never disposed and never stored in a kept field; on the next call line 1188 overwrites the field without calling Dispose, leaking one Bitmap (native/Skia memory) per regeneration. HueSaturation is the DEFAULT `Components` value, and regeneration happens on every layout/Bounds change, so this leaks repeatedly under normal use.","fix":"In the `HueSaturation`/`SaturationHue` case dispose the unused min bitmap (and avoid computing it if possible). Minimal fix: release the min bitmap generated for this configuration, e.g. dispose it right after the switch when it was not adopted, or skip generating `bgraMinPixelData` entirely for these components.","locations":[{"ref":"src/Avalonia.Controls.ColorPicker/ColorSpectrum/ColorSpectrum.cs:1188-1204","code":" 1188 |                 _minBitmap = ColorPickerHelpers.CreateBitmapFromPixelData(bgraMinPixelData, pixelWidth, pixelHeight);\n 1189 |                 _maxBitmap = ColorPickerHelpers.CreateBitmapFromPixelData(bgraMaxPixelData, pixelWidth, pixelHeight);\n 1190 | \n 1191 |                 switch (components2)\n 1192 |                 {\n 1193 |                     case ColorSpectrumComponents.HueValue:\n 1194 |                     case ColorSpectrumComponents.ValueHue:\n 1195 |                         _saturationMinimumBitmap?.Dispose();\n 1196 |                         _saturationMinimumBitmap = _minBitmap;\n 1197 |                         _saturationMaximumBitmap?.Dispose();\n 1198 |                         _saturationMaximumBitmap = _maxBitmap;\n 1199 |                         break;\n 1200 |                     case ColorSpectrumComponents.HueSaturation:\n 1201 |                     case ColorSpectrumComponents.SaturationHue:\n 1202 |                         _valueBitmap?.Dispose();\n 1203 |                         _valueBitmap = _maxBitmap;\n 1204 |                         break;","lines":17,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls.ColorPicker/ColorSpectrum/ColorSpectrum.cs#L1188-L1204"}]},
{"id":"MEM_26","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"`ExperimentalAcrylicBorder.OnDetachedFromVisualTree` calls `UpdateMaterialSubscription()` in an attempt to tear down the `Material.PropertyChanged` subscription, but that method RE-SUBSCRIBES instead of only disposing. `UpdateMaterialSubscription` early-returns (leaving `_materialSubscription` disposed) only if `CompositionVisual == null`; otherwise it creates a fresh `FromEventPattern` subscription to `Material.PropertyChanged`. However, in the visual-tree detach sequence `OnDetachedFromVisualTree` runs BEFORE `DetachFromCompositor` (see `Visual.OnDetachedFromVisualTreeCore`: `OnDetachedFromVisualTree(e)` at line 594, then `DetachFromCompositor()` at line 595 which nulls `CompositionVisual`). So when the border is detached, `CompositionVisual` is still non-null and `UpdateMaterialSubscription` re-subscribes the detached border to `Material.PropertyChanged`. If the `Material` instance outlives the border (e.g. a shared/resource material, or a control repeatedly detached), the detached border stays referenced by the material's event and leaks.","fix":"On detach, dispose the material subscription directly rather than routing through `UpdateMaterialSubscription`, which re-subscribes while `CompositionVisual` is still alive:\n```csharp\nprotected override void OnDetachedFromVisualTree(VisualTreeAttachmentEventArgs e)\n{\n    base.OnDetachedFromVisualTree(e);\n    _materialSubscription?.Dispose();\n    _materialSubscription = null;\n    _subscription?.Dispose();\n    _subscription = null;\n}\n```","locations":[{"ref":"src/Avalonia.Controls/ExperimentalAcrylicBorder.cs:113-118","code":"  113 |         protected override void OnDetachedFromVisualTree(VisualTreeAttachmentEventArgs e)\n  114 |         {\n  115 |             base.OnDetachedFromVisualTree(e);\n  116 |             UpdateMaterialSubscription();\n  117 |             _subscription?.Dispose();\n  118 |         }","lines":6,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/ExperimentalAcrylicBorder.cs#L113-L118"},{"ref":"src/Avalonia.Controls/ExperimentalAcrylicBorder.cs:78-91","code":"   78 |         void UpdateMaterialSubscription()\n   79 |         {\n   80 |             _materialSubscription?.Dispose();\n   81 |             _materialSubscription = null;\n   82 |             if (CompositionVisual == null)\n   83 |                 return;\n   84 |             if (Material == null!)\n   85 |                 return;\n   86 |             _materialSubscription = Observable.FromEventPattern<AvaloniaPropertyChangedEventArgs>(\n   87 |                     h => Material.PropertyChanged += h,\n   88 |                     h => Material.PropertyChanged -= h)\n   89 |                 .Subscribe(_ => UpdateMaterialSubscription());\n   90 |             SyncMaterial(CompositionVisual);\n   91 |         }","lines":14,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/ExperimentalAcrylicBorder.cs#L78-L91"}]},
{"id":"MEM_27","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"When `UseRenderTransform` is set to true, the control subscribes to the global static `RenderTransformProperty.Changed` observable and stores the subscription in `_renderTransformChangedEvent`. This subscription is only ever disposed when `UseRenderTransform` is later set to false; it is NOT disposed in `OnDetachedFromVisualTree` (which only unsubscribes the layout transform). As a result every `LayoutTransformControl` that used `UseRenderTransform=true` and is subsequently detached leaves a permanent observer registered on the process-wide `RenderTransformProperty.Changed` subject. That observer keeps firing for every render-transform change of every control in the application for the remainder of the app's lifetime, causing an accumulating subscription leak and steadily degrading performance.","fix":"Dispose `_renderTransformChangedEvent` in `OnDetachedFromVisualTree` (and re-subscribe in `OnAttachedToVisualTree` when `UseRenderTransform` is true), or dispose the previous subscription before creating a new one. At minimum add `_renderTransformChangedEvent?.Dispose(); _renderTransformChangedEvent = null;` to `OnDetachedFromVisualTree`.","locations":[{"ref":"src/Avalonia.Controls/LayoutTransformControl.cs:156-195","code":"  156 |         protected override void OnDetachedFromVisualTree(VisualTreeAttachmentEventArgs e)\n  157 |         {\n  158 |             base.OnDetachedFromVisualTree(e);\n  159 |             UnsubscribeLayoutTransform(LayoutTransform as Transform);\n  160 |         }\n  161 | \n  162 |         private IDisposable? _renderTransformChangedEvent;\n  163 | \n  164 |         private void OnUseRenderTransformPropertyChanged(AvaloniaPropertyChangedEventArgs e)\n  165 |         {\n  166 |             // HACK: In theory, this method and the UseRenderTransform shouldn't exist but\n  167 |             //       it's hard to animate this particular control with style animations without\n  168 |             //       PropertyPaths.\n  169 |             //\n  170 |             //       So until we get that implemented, we'll stick on this not-so-good\n  171 |             //       workaround.\n  172 | \n  173 |             var target = e.Sender as LayoutTransformControl;\n  174 |             var shouldUseRenderTransform = (bool)e.NewValue!;\n  175 |             if (target != null)\n  176 |             {\n  177 |                 if (shouldUseRenderTransform)\n  178 |                 {\n  179 |                     _renderTransformChangedEvent = RenderTransformProperty.Changed\n  180 |                             .Subscribe(\n  181 |                                 (x) =>\n  182 |                                 {\n  183 |                                     if (x.Sender is LayoutTransformControl target2)\n  184 |                                     {\n  185 |                                         target2.LayoutTransform = target2.RenderTransform;\n  186 |                                     }\n  187 |                                 });\n  188 |                 }\n  189 |                 else\n  190 |                 {\n  191 |                     _renderTransformChangedEvent?.Dispose();\n  192 |                     ClearValue(LayoutTransformProperty);\n  193 |                 }\n  194 |             }\n  195 |         }","lines":40,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/LayoutTransformControl.cs#L156-L195"}]},
{"id":"MEM_28","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"DBusMenuExporterImpl.Dispose removes the DBus method handler and unregisters the window, but never unsubscribes the CollectionChanged handler attached to `_menu.Items` in SetNativeMenu, nor the per-item PropertyChanged handlers and per-submenu CollectionChanged handlers added in GetId/EnsureSubscribed. If the exported NativeMenu outlives the exporter (e.g. an application/shared menu), those event subscriptions keep the disposed exporter alive and it keeps responding to menu changes.","fix":"In Dispose, unsubscribe from `_menu.Items` CollectionChanged and run the same cleanup as DoLayoutReset (detach `OnItemPropertyChanged` from every item in `_idsToItems` and `OnMenuItemsChanged` from every menu in `_menus`) before removing the method handler.","locations":[{"ref":"src/Avalonia.FreeDesktop/DBusMenuExporter.cs:128-143","code":"  128 |             public void Dispose()\n  129 |             {\n  130 |                 if (_disposed)\n  131 |                     return;\n  132 |                 _disposed = true;\n  133 |                 // Fire and forget\n  134 |                 _ = _registrar?.UnregisterWindowAsync(_xid)?.ContinueWith(t =>\n  135 |                 {\n  136 |                     if (t.Exception != null)\n  137 |                     {\n  138 |                         Logger.TryGet(LogEventLevel.Warning, LogArea.Platform)\n  139 |                             ?.Log(this, \"DBusMenu UnregisterWindowAsync failed: {Exception}\", t.Exception);\n  140 |                     }\n  141 |                 }, TaskContinuationOptions.OnlyOnFaulted);\n  142 |                 Connection.RemoveMethodHandler(Path);\n  143 |             }","lines":16,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.FreeDesktop/DBusMenuExporter.cs#L128-L143"},{"ref":"src/Avalonia.FreeDesktop/DBusMenuExporter.cs:149-159","code":"  149 |             public void SetNativeMenu(NativeMenu? menu)\n  150 |             {\n  151 |                 menu ??= [];\n  152 | \n  153 |                 if (_menu is not null)\n  154 |                     ((INotifyCollectionChanged)_menu.Items).CollectionChanged -= OnMenuItemsChanged;\n  155 |                 _menu = menu;\n  156 |                 ((INotifyCollectionChanged)_menu.Items).CollectionChanged += OnMenuItemsChanged;\n  157 | \n  158 |                 DoLayoutReset();\n  159 |             }","lines":11,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.FreeDesktop/DBusMenuExporter.cs#L149-L159"}]},
{"id":"MEM_29","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"AvaloniaNativeTextInputMethod.SetClient subscribes to the client's SurroundingTextChanged/CursorRectangleChanged/SelectionChanged events and creates a native client unconditionally for any non-null client, but the cleanup block that unsubscribes those handlers and disposes the native client only runs when the OLD client had `SupportsSurroundingText: true`. When the previous client did not support surrounding text, its event subscriptions are never removed (the old client keeps this input method rooted and its stale handlers keep firing against the new `_client`) and the previous `_nativeClient` is set to null without being disposed, leaking the native COM object.","fix":"Make the teardown symmetric with the subscribe: always unsubscribe the three handlers and dispose `_nativeClient` when replacing a non-null `_client`, regardless of `SupportsSurroundingText`. E.g. guard the cleanup on `_client is not null` (and dispose `_nativeClient` there) rather than on `_client is { SupportsSurroundingText: true }`.","locations":[{"ref":"src/Avalonia.Native/AvaloniaNativeTextInputMethod.cs:29-57","code":"   29 |         public void SetClient(TextInputMethodClient? client)\n   30 |         {\n   31 |             if (_client is { SupportsSurroundingText: true })\n   32 |             {\n   33 |                 _client.SurroundingTextChanged -= OnSurroundingTextChanged;\n   34 |                 _client.CursorRectangleChanged -= OnCursorRectangleChanged;\n   35 |                 _client.SelectionChanged -= OnSelectionChanged;\n   36 | \n   37 |                 _nativeClient?.Dispose();\n   38 |             }\n   39 | \n   40 |             _nativeClient = null;\n   41 |             _client = client;\n   42 | \n   43 |             if (_client != null)\n   44 |             {\n   45 |                 _nativeClient = new AvnTextInputMethodClient(_client);\n   46 | \n   47 |                 OnSurroundingTextChanged(this, EventArgs.Empty);\n   48 |                 OnCursorRectangleChanged(this, EventArgs.Empty);\n   49 |                 // Note: OnSelectionChanged isn't called, it's already up-to-date thanks to OnSurroundingTextChanged\n   50 | \n   51 |                 _client.SurroundingTextChanged += OnSurroundingTextChanged;\n   52 |                 _client.CursorRectangleChanged += OnCursorRectangleChanged;\n   53 |                 _client.SelectionChanged += OnSelectionChanged;\n   54 |             }\n   55 | \n   56 |             _inputMethod.SetClient(_nativeClient);\n   57 |         }","lines":29,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Native/AvaloniaNativeTextInputMethod.cs#L29-L57"}]},
{"id":"MEM_30","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"very_easy","description":"MacOSMountedVolumeInfoListener.Dispose never disposes the DispatcherTimer registration stored in `_disposable`, so the 1-second `Poll` timer keeps running forever after the listener is disposed (unlike the Linux equivalent which calls `_disposable.Dispose()`). This leaks the timer and keeps the ObservableCollection being mutated indefinitely.","fix":"Dispose the timer in the disposing branch:\n```\nprotected virtual void Dispose(bool disposing)\n{\n    if (!_beenDisposed)\n    {\n        if (disposing)\n            _disposable.Dispose();\n        _beenDisposed = true;\n    }\n}\n```","locations":[{"ref":"src/Avalonia.Native/MacOSMountedVolumeInfoProvider.cs:50-60","code":"   50 |         protected virtual void Dispose(bool disposing)\n   51 |         {\n   52 |             if (!_beenDisposed)\n   53 |             {\n   54 |                 if (disposing)\n   55 |                 {\n   56 | \n   57 |                 }\n   58 |                 _beenDisposed = true;\n   59 |             }\n   60 |         }","lines":11,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Native/MacOSMountedVolumeInfoProvider.cs#L50-L60"}]},
{"id":"MEM_31","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"`DisposeAsync` guards its entire body with `if (Context is { IsLost: false })`. When the GL context is lost, the method becomes a no-op: `Surface.Dispose()`, `_swapchain.DisposeAsync()` (which releases compositor-imported GPU images) and `Context.Dispose()` are all skipped. These are managed/compositor resources that do not require a current GL context and must still be released on context loss, otherwise they leak every time a context is lost and the control is torn down.","fix":"Only guard the GL calls (DeleteFramebuffer/DeleteRenderbuffer) with the `IsLost` check; always dispose `Surface`, await `_swapchain.DisposeAsync()` and dispose `Context` regardless of context-lost state.","locations":[{"ref":"src/Avalonia.OpenGL/Controls/OpenGlControlResources.cs:140-170","code":"  140 |     public async ValueTask DisposeAsync()\n  141 |     {\n  142 |         if (Context is { IsLost: false })\n  143 |         {\n  144 |             try\n  145 |             {\n  146 |                 using (Context.MakeCurrent())\n  147 |                 {\n  148 |                     var gl = Context.GlInterface;\n  149 |                     if (Fbo != 0)\n  150 |                         gl.DeleteFramebuffer(Fbo);\n  151 |                     Fbo = 0;\n  152 |                     if (_depthBuffer != 0)\n  153 |                         gl.DeleteRenderbuffer(_depthBuffer);\n  154 |                     _depthBuffer = 0;\n  155 |                 }\n  156 | \n  157 |             }\n  158 |             catch\n  159 |             {\n  160 |                 //\n  161 |             }\n  162 | \n  163 |             Surface.Dispose();\n  164 |            \n  165 |             await _swapchain.DisposeAsync();\n  166 |             Context.Dispose();\n  167 | \n  168 |             Context = null!;\n  169 |         }\n  170 |     }","lines":31,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.OpenGL/Controls/OpenGlControlResources.cs#L140-L170"}]},
{"id":"MEM_32","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"`VulkanContext.Dispose()` is empty even though the context owns a `VulkanExternalObjectsFeature` that holds a `VulkanCommandBufferPool` (allocated in its constructor). Neither `VulkanContext` nor `VulkanExternalObjectsFeature` disposes that pool, so every context that enables external objects leaks its command buffer pool for its whole lifetime; combined with the recreation bug in `GetSharedContext` this leaks on every shared-context request.","fix":"Make `VulkanExternalObjectsFeature` implement `IDisposable` and dispose its `_pool`, then dispose `_externalObjectsFeature` (and any other owned resources) from `VulkanContext.Dispose`.","locations":[{"ref":"src/Avalonia.Vulkan/VulkanContext.cs:35-38","code":"   35 |     public void Dispose()\n   36 |     {\n   37 |         \n   38 |     }","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Vulkan/VulkanContext.cs#L35-L38"},{"ref":"src/Avalonia.Vulkan/VulkanExternalObjectsFeature.cs:45-96","code":"   45 |     private readonly VulkanContext _context;\n   46 |     private readonly VulkanCommandBufferPool _pool;\n   47 | \n   48 |     public VulkanExternalObjectsFeature(VulkanContext context)\n   49 |     {\n   50 |         _context = context;\n   51 |         if (RuntimeInformation.IsOSPlatform(OSPlatform.Windows))\n   52 |         {\n   53 |             //TODO: keyed muted\n   54 |             SupportedImageHandleTypes = new[]\n   55 |             {\n   56 |                 KnownPlatformGraphicsExternalImageHandleTypes.VulkanOpaqueNtHandle,\n   57 |                 KnownPlatformGraphicsExternalImageHandleTypes.VulkanOpaqueKmtHandle,\n   58 |             };\n   59 |             SupportedSemaphoreTypes = new[]\n   60 |             {\n   61 |                 KnownPlatformGraphicsExternalSemaphoreHandleTypes.VulkanOpaqueNtHandle,\n   62 |                 KnownPlatformGraphicsExternalSemaphoreHandleTypes.VulkanOpaqueKmtHandle\n   63 |             };\n   64 |         }\n   65 |         else\n   66 |         {\n   67 |             SupportedImageHandleTypes = new[]\n   68 |             {\n   69 |                 KnownPlatformGraphicsExternalImageHandleTypes.VulkanOpaquePosixFileDescriptor\n   70 |             };\n   71 |             SupportedSemaphoreTypes = new[]\n   72 |             {\n   73 |                 KnownPlatformGraphicsExternalSemaphoreHandleTypes.VulkanOpaquePosixFileDescriptor\n   74 |             };\n   75 |         }\n   76 | \n   77 |         var physicalDeviceIDProperties = new VkPhysicalDeviceIDProperties()\n   78 |         {\n   79 |             sType = VkStructureType.VK_STRUCTURE_TYPE_PHYSICAL_DEVICE_ID_PROPERTIES\n   80 |         };\n   81 |         \n   82 |         var physicalDeviceProperties2 = new VkPhysicalDeviceProperties2()\n   83 |         {\n   84 |             sType = VkStructureType.VK_STRUCTURE_TYPE_PHYSICAL_DEVICE_PROPERTIES_2,\n   85 |             pNext = &physicalDeviceIDProperties\n   86 |         };\n   87 |         _context.InstanceApi.GetPhysicalDeviceProperties2(_context.PhysicalDeviceHandle, &physicalDeviceProperties2);\n   88 | \n   89 |         var luid = new Span<byte>(physicalDeviceIDProperties.deviceLUID, 8).ToArray();\n   90 |         if (luid.Any(b => b != 0))\n   91 |             DeviceLuid = luid;\n   92 |         var uuid = new Span<byte>(physicalDeviceIDProperties.deviceUUID, 16).ToArray();\n   93 |         if (uuid.Any(b => b != 0))\n   94 |             DeviceUuid = uuid;\n   95 |         _pool = new VulkanCommandBufferPool(_context, true);\n   96 |     }","lines":52,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Vulkan/VulkanExternalObjectsFeature.cs#L45-L96"}]},
{"id":"MEM_33","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"In the failure path of `TryCreate`, the `instance?.Dispose()` call is commented out. If `VulkanInstance.Create` succeeds but the subsequent `VulkanDevice.Create` (the probe) throws, the created Vulkan instance is never destroyed and leaks, along with any native resources it owns.","fix":"Uncomment and keep `instance?.Dispose();` at the start of the `catch` block so a partially-initialized instance is released before returning `null`.","locations":[{"ref":"src/Avalonia.Vulkan/VulkanPlatformGraphics.cs:82-99","code":"   82 |         IVulkanInstance? instance = null;\n   83 |         try\n   84 |         {\n   85 |             instance = VulkanInstance.Create(options.VulkanInstanceCreationOptions ?? new(),\n   86 |                 platformOptions);\n   87 | \n   88 |             var devOpts = options.VulkanDeviceCreationOptions ?? new();\n   89 |             Interop.VulkanDevice.Create(instance, devOpts, platformOptions)\n   90 |                 .Dispose();\n   91 | \n   92 |             return new VulkanPlatformGraphics(new DefaultDeviceFactory(instance, devOpts), platformOptions);\n   93 |         }\n   94 |         catch (Exception e)\n   95 |         {\n   96 |             //instance?.Dispose();\n   97 |             Logger.TryGet(LogEventLevel.Error, \"Vulkan\")?.Log(null, \"Unable to initialize Vulkan rendering: {0}\", e);\n   98 |             return null;\n   99 |         }","lines":18,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Vulkan/VulkanPlatformGraphics.cs#L82-L99"}]},
{"id":"MEM_34","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"WaylandDataOffer.Dispose calls _offer.Destroy() but not _offer.Dispose(). This mirrors the DataSource issue: the NWayland WlDataOffer proxy is a managed object wrapping a native resource; Destroy sends the protocol destructor but the managed wrapper is not freed.","fix":"After _offer.Destroy(), call _offer.Dispose() to release the managed wrapper.","locations":[{"ref":"src/Avalonia.Wayland/Server/Transient/Clipboard/WaylandDataOffer.cs:95-98","code":"   95 |     public void Dispose()\n   96 |     {\n   97 |         _offer.Destroy();\n   98 |     }","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Wayland/Server/Transient/Clipboard/WaylandDataOffer.cs#L95-L98"}]},
{"id":"MEM_35","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"WaylandDataSource.Dispose only calls _source.Destroy() but never _source.Dispose(). The WlDataSource object is a native proxy that wraps a C pointer; calling Destroy() sends the wl_data_source.destroy request to the compositor but the managed wrapper (_source) remains un-disposed, leaking the managed handle and potentially the underlying libwayland client allocation.","fix":"After calling _source.Destroy(), also call _source.Dispose() to release the managed NWayland proxy wrapper.","locations":[{"ref":"src/Avalonia.Wayland/Server/Transient/Clipboard/WaylandDataSource.cs:68-75","code":"   68 |     public void Dispose()\n   69 |     {\n   70 |         if (!_destroyed)\n   71 |         {\n   72 |             _destroyed = true;\n   73 |             _source.Destroy();\n   74 |         }\n   75 |     }","lines":8,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Wayland/Server/Transient/Clipboard/WaylandDataSource.cs#L68-L75"}]},
{"id":"MEM_36","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"In GlxDisplay constructor (lines 83-84), two PBuffers are created via Glx.CreatePbuffer but their return values are immediately discarded. These PBuffer handles are never stored and therefore never destroyed with Glx.DestroyPbuffer. This leaks two GLX PBuffers for the lifetime of the GlxDisplay object. The intent is unclear; this may be leftover debug code or an attempt to warm up the GLX driver.","fix":"Either remove these two calls entirely (they serve no documented purpose), or if they are needed for driver warm-up, store and destroy the returned handles in the GlxDisplay destructor.","locations":[{"ref":"src/Avalonia.X11/Glx/GlxDisplay.cs:83-84","code":"   83 |             Glx.CreatePbuffer(_x11.DeferredDisplay, _fbconfig, attributes);\n   84 |             Glx.CreatePbuffer(_x11.DeferredDisplay, _fbconfig, attributes);","lines":2,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.X11/Glx/GlxDisplay.cs#L83-L84"}]},
{"id":"MEM_37","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"very_easy","description":"In GetNullCursor (X11CursorFactory.cs), an X11 Pixmap is created with XCreateBitmapFromData and passed to XCreatePixmapCursor, but the Pixmap is never freed with XFreePixmap. Per the X11 documentation, XCreatePixmapCursor does NOT take ownership of the source/mask pixmaps; they must be freed by the caller. The pixmap leaks for the lifetime of the application.","fix":"After XCreatePixmapCursor, call XLib.XFreePixmap(display, pixmap) to release the bitmap pixmap.","locations":[{"ref":"src/Avalonia.X11/X11CursorFactory.cs:91-96","code":"   91 |         private static IntPtr GetNullCursor(IntPtr display)\n   92 |         {\n   93 |             XColor color = new XColor();\n   94 |             IntPtr window = XLib.XRootWindow(display, 0);\n   95 |             IntPtr pixmap = XLib.XCreateBitmapFromData(display, window, NullCursorData, 1, 1);\n   96 |             return XLib.XCreatePixmapCursor(display, pixmap, pixmap, ref color, ref color, 0, 0);","lines":6,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.X11/X11CursorFactory.cs#L91-L96"}]},
{"id":"MEM_38","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"very_easy","description":"X11Window creates a colormap with XCreateColormap (line 152) that is never freed. The handle is stored only in the local 'attr' struct and discarded after XCreateWindow. This leaks one X11 colormap per window that uses a non-default visual (GLX, EGL, or transparent). For applications that create and destroy many windows (e.g., dialogs), these colormaps accumulate until the display connection is closed.","fix":"Store the created colormap in a private field (e.g., '_colormap') and call XFreeColormap(_x11.Display, _colormap) in the Cleanup method after XDestroyWindow, but only when _colormap != IntPtr.Zero.","locations":[{"ref":"src/Avalonia.X11/X11Window.cs:154","code":"  154 |                 attr.colormap = XCreateColormap(_x11.Display, _x11.RootWindow, visualInfo.Value.visual, 0);","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.X11/X11Window.cs#L154"}]},
{"id":"MEM_39","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"very_easy","description":"InputHelper.subscribeTextEvents registers a 'beforeinput' event listener (beforeInputHandler) on the element but the returned cleanup function does not remove it. The returned lambda at line 416 removes compositionstart, compositionupdate, and compositionend, but omits the removeEventListener call for 'beforeinput'. This causes a permanent listener leak on every subscribeInputEvents call.","fix":"Add element.removeEventListener('beforeinput', beforeInputHandler) inside the returned cleanup lambda alongside the other removeEventListener calls.","locations":[{"ref":"src/Browser/Avalonia.Browser/webapp/modules/avalonia/input.ts:403-421","code":"  403 |         element.addEventListener(\"beforeinput\", beforeInputHandler);\n  404 | \n  405 |         const compositionUpdateHandler = (args: CompositionEvent) => {\n  406 |             JsExports.InputHelper.OnCompositionUpdate(topLevelId, args.data);\n  407 |         };\n  408 |         element.addEventListener(\"compositionupdate\", compositionUpdateHandler);\n  409 | \n  410 |         const compositionEndHandler = (args: CompositionEvent) => {\n  411 |             JsExports.InputHelper.OnCompositionEnd(topLevelId, args.data);\n  412 |             args.preventDefault();\n  413 |         };\n  414 |         element.addEventListener(\"compositionend\", compositionEndHandler);\n  415 | \n  416 |         return () => {\n  417 |             element.removeEventListener(\"compositionstart\", compositionStartHandler);\n  418 |             element.removeEventListener(\"compositionupdate\", compositionUpdateHandler);\n  419 |             element.removeEventListener(\"compositionend\", compositionEndHandler);\n  420 |         };\n  421 |     }","lines":19,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Browser/Avalonia.Browser/webapp/modules/avalonia/input.ts#L403-L421"}]},
{"id":"MEM_40","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"In GlRenderTarget.BeginRenderingSession(), if SKSurface.Create() succeeds (line 92) but an exception is thrown before 'success = true' on line 96, the newly created SKSurface is leaked because the finally block only disposes glSession, not the surface or renderTarget objects.","fix":"Track surface and renderTarget with local variables and dispose them in the finally block when !success.","locations":[{"ref":"src/Skia/Avalonia.Skia/Gpu/OpenGl/GlRenderTarget.cs:60-105","code":"   60 |         public ISkiaGpuRenderSession BeginRenderingSession(IRenderTarget.RenderTargetSceneInfo sceneInfo)\n   61 |         {\n   62 |             var glSession = _surface.BeginDraw(sceneInfo);\n   63 |             \n   64 |             bool success = false;\n   65 |             try\n   66 |             {\n   67 |                 var disp = glSession.Context;\n   68 |                 var gl = disp.GlInterface;\n   69 |                 gl.GetIntegerv(GL_FRAMEBUFFER_BINDING, out var fb);\n   70 | \n   71 |                 var size = glSession.Size;\n   72 |                 var colorType = SKColorType.Rgba8888;\n   73 |                 var scaling = glSession.Scaling;\n   74 |                 if (size.Width <= 0 || size.Height <= 0 || scaling < 0)\n   75 |                 {\n   76 |                     glSession.Dispose();\n   77 |                     throw new InvalidOperationException(\n   78 |                         $\"Can't create drawing context for surface with {size} size and {scaling} scaling\");\n   79 |                 }\n   80 | \n   81 |                 lock (_grContext)\n   82 |                 {\n   83 |                     _grContext.ResetContext();\n   84 | \n   85 |                     var samples = disp.SampleCount;\n   86 |                     var maxSamples = _grContext.GetMaxSurfaceSampleCount(colorType);\n   87 |                     if (samples > maxSamples)\n   88 |                         samples = maxSamples;\n   89 | \n   90 |                     var glInfo = new GRGlFramebufferInfo((uint)fb, colorType.ToGlSizedFormat());\n   91 |                     var renderTarget = new GRBackendRenderTarget(size.Width, size.Height, samples, disp.StencilSize, glInfo);\n   92 |                     var surface = SKSurface.Create(_grContext, renderTarget,\n   93 |                         glSession.IsYFlipped ? GRSurfaceOrigin.TopLeft : GRSurfaceOrigin.BottomLeft,\n   94 |                         colorType, _surfaceProperties);\n   95 | \n   96 |                     success = true;\n   97 | \n   98 |                     return new GlGpuSession(_grContext, renderTarget, surface, glSession);\n   99 |                 }\n  100 |             }\n  101 |             finally\n  102 |             {\n  103 |                 if (!success)\n  104 |                     glSession.Dispose();\n  105 |             }","lines":46,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Skia/Avalonia.Skia/Gpu/OpenGl/GlRenderTarget.cs#L60-L105"}]},
{"id":"MEM_41","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"very_easy","description":"PlatformRenderInterface.BuildGlyphRunGeometry() calls skFont.GetGlyphPath(glyph) in a loop. GetGlyphPath returns a new SKPath each call. The returned path is used (AddPath) but never disposed. For a glyph run with N glyphs this leaks N SKPath objects.","fix":"Wrap the returned path in a using statement: using var glyphPath = skFont.GetGlyphPath(glyph);","locations":[{"ref":"src/Skia/Avalonia.Skia/PlatformRenderInterface.cs:104-109","code":"  104 |                 var glyphPath = skFont.GetGlyphPath(glyph);\n  105 | \n  106 |                 if (glyphPath is not null && !glyphPath.IsEmpty)\n  107 |                 {\n  108 |                     path.AddPath(glyphPath, (float)currentX, (float)currentY);\n  109 |                 }","lines":6,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Skia/Avalonia.Skia/PlatformRenderInterface.cs#L104-L109"}]},
{"id":"MEM_42","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"very_easy","description":"In EnableImm, when ImmGetContext returns a non-zero handle that equals _currentHimc, the if (himc != _currentHimc) branch is not taken, so ImmReleaseContext is never called for that handle. Every call to EnableImm with an already-associated context leaks an IMM handle reference.","fix":"Call ImmReleaseContext unconditionally when himc was obtained from ImmGetContext (i.e., when himc != IntPtr.Zero and himc was returned by ImmGetContext rather than ImmCreateContext). Track whether ImmGetContext was the source and always release in a finally block.","locations":[{"ref":"src/Windows/Avalonia.Win32/Input/Imm32InputMethod.cs:46-70","code":"   46 |         public void EnableImm()\n   47 |         {\n   48 |             var himc = ImmGetContext(Hwnd);\n   49 | \n   50 |             if(himc == IntPtr.Zero)\n   51 |             {\n   52 |                 himc = ImmCreateContext();\n   53 |             }\n   54 | \n   55 |             if(himc != _currentHimc)\n   56 |             {\n   57 |                 if(_currentHimc != IntPtr.Zero)\n   58 |                 {\n   59 |                     DisableImm();\n   60 |                 }\n   61 | \n   62 |                 ImmAssociateContext(Hwnd, himc);\n   63 | \n   64 |                 ImmReleaseContext(Hwnd, himc);\n   65 | \n   66 |                 _currentHimc = himc;\n   67 | \n   68 |                 _caretManager.TryCreate(Hwnd);\n   69 |             }\n   70 |         }","lines":25,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Windows/Avalonia.Win32/Input/Imm32InputMethod.cs#L46-L70"}]},
{"id":"MEM_43","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"ShCoreAvailable is a computed property that calls LoadLibrary(\"shcore.dll\") each time it is evaluated. LoadLibrary increments the DLL reference count and returns a handle that must be balanced with FreeLibrary. Since the property never stores or releases the handle, every evaluation leaks one reference-count increment on the shcore.dll module handle. The property is called at least twice per window construction (WindowImpl.cs lines 541, 1030) and on every Position.set, plus from FramebufferManager and TrayIconImpl.","fix":"Replace 'LoadLibrary(\"shcore.dll\")' with 'GetModuleHandle(\"shcore.dll\")'. GetModuleHandle does not increment the reference count. Alternatively, cache the result of a single LoadLibrary call in a static readonly field and free it only on process exit.","locations":[{"ref":"src/Windows/Avalonia.Win32/Interop/UnmanagedMethods.cs:1721","code":" 1721 |         public static bool ShCoreAvailable => LoadLibrary(\"shcore.dll\") != IntPtr.Zero;","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Windows/Avalonia.Win32/Interop/UnmanagedMethods.cs#L1721"}]},
{"id":"MEM_44","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"In Win32StorageProvider.FiltersToPointer, Marshal.StructureToPtr marshals COMDLG_FILTERSPEC (which contains [MarshalAs(UnmanagedType.LPWStr)] string fields) allocating unmanaged CoTaskMem strings for pszName and pszSpec. The finally block only calls Marshal.FreeHGlobal(filterPtr) which frees the struct buffer itself but not the two string buffers pointed to by the struct. The marshaled strings are leaked on each filter entry.","fix":"Before Marshal.FreeHGlobal(filterPtr), add 'Marshal.DestroyStructure<UnmanagedMethods.COMDLG_FILTERSPEC>(filterPtr);' to free the marshaled string memory. Alternatively, marshal the strings manually with Marshal.StringToCoTaskMemUni and track/free them explicitly.","locations":[{"ref":"src/Windows/Avalonia.Win32/Win32StorageProvider.cs:297-312","code":"  297 |                 var filterPtr = Marshal.AllocHGlobal(size);\n  298 |                 try\n  299 |                 {\n  300 |                     var filterStr = new UnmanagedMethods.COMDLG_FILTERSPEC\n  301 |                     {\n  302 |                         pszName = filter.Name,\n  303 |                         pszSpec = string.Join(\";\", filter.Patterns)\n  304 |                     };\n  305 | \n  306 |                     Marshal.StructureToPtr(filterStr, filterPtr, false);\n  307 |                     Marshal.Copy(filterPtr, resultArr, i * size, size);\n  308 |                 }\n  309 |                 finally\n  310 |                 {\n  311 |                     Marshal.FreeHGlobal(filterPtr);\n  312 |                 }","lines":16,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Windows/Avalonia.Win32/Win32StorageProvider.cs#L297-L312"}]},
{"id":"MEM_45","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"very_easy","description":"NativeWinRTMethods.CreateInstance<T> and CreateActivationFactory<T> both create an\nHString (via WindowsCreateString), use it, then call WindowsDeleteString on it.\nHowever if RoActivateInstance or RoGetActivationFactory throws (they are declared\nPreserveSig=false so they can throw), WindowsDeleteString is never called and the\nHSTRING leaks. The pattern `var s = WindowsCreateString(...); ...; WindowsDeleteString(s);`\nis not exception-safe.","fix":"Wrap the HSTRING in a try/finally or use HStringInterop (which calls WindowsDeleteString\nin its own Dispose) to ensure the string is always freed even when the activation call\nthrows.","locations":[{"ref":"src/Windows/Avalonia.Win32/WinRT/NativeWinRTMethods.cs:41-59","code":"   41 |         internal static T CreateInstance<T>(string fullName) where T : IUnknown\n   42 |         {\n   43 |             var s = WindowsCreateString(fullName);\n   44 |             EnsureRoInitialized();\n   45 |             var pUnk = RoActivateInstance(s);\n   46 |             using var unk = MicroComRuntime.CreateProxyFor<IUnknown>(pUnk, true);\n   47 |             WindowsDeleteString(s);\n   48 |             return MicroComRuntime.QueryInterface<T>(unk);\n   49 |         }\n   50 |         \n   51 |         internal static TFactory CreateActivationFactory<TFactory>(string fullName) where TFactory : IUnknown\n   52 |         {\n   53 |             var s = WindowsCreateString(fullName);\n   54 |             EnsureRoInitialized();\n   55 |             var guid = MicroComRuntime.GetGuidFor(typeof(TFactory));\n   56 |             var pUnk = RoGetActivationFactory(s, ref guid);\n   57 |             using var unk = MicroComRuntime.CreateProxyFor<IUnknown>(pUnk, true);\n   58 |             WindowsDeleteString(s);\n   59 |             return MicroComRuntime.QueryInterface<TFactory>(unk);","lines":19,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Windows/Avalonia.Win32/WinRT/NativeWinRTMethods.cs#L41-L59"}]},
{"id":"MEM_46","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"In WinRTInspectable.GetIids(), memory is allocated via Marshal.AllocCoTaskMem for\nthe IIDs array and the pointer is written to *iids. The WinRT contract for\nIInspectable.GetIids requires that the caller frees this memory via CoTaskMemFree.\nThe implementation correctly uses CoTaskMem, so this is technically correct by WinRT\nconvention. However, RuntimeClassName at line 24 returns a raw HSTRING created by\nWindowsCreateString but never deletes it. The WinRT contract for RuntimeClassName\nis that the returned HSTRING is owned by the caller who must call WindowsDeleteString.\nSince this is a callback into managed code from a native WinRT caller, the native\ncaller will call WindowsDeleteString, so this is fine if callers are compliant.\nBUT: if GetIids is ever called on a managed thread directly (e.g., in tests or via\nreflection), the returned array is never freed.\n\nMore directly: WinRTInspectable.RuntimeClassName is a property getter that calls\nWindowsCreateString every time it is accessed but the HSTRING is never tracked or\nfreed by the managed side. If a managed caller accesses this property it leaks the\nHSTRING.","fix":"This property is only called by the COM infrastructure which is responsible for\nfreeing the returned HSTRING. Add a comment documenting this ownership transfer\ncontract to prevent future confusion.","locations":[{"ref":"src/Windows/Avalonia.Win32/WinRT/WinRTInspectable.cs:24","code":"   24 |         public IntPtr RuntimeClassName => NativeWinRTMethods.WindowsCreateString(GetType().FullName!);","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Windows/Avalonia.Win32/WinRT/WinRTInspectable.cs#L24"}]},
{"id":"MEM_47","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"Clipboard.SetDataAsync overwrites `_lastDataTransfer` with the new transfer when the impl is an `IOwnedClipboardImpl`, but never disposes the previously stored `IAsyncDataTransfer`. `ClearAsync` does dispose it, so the class otherwise takes ownership; calling SetDataAsync twice in a row leaks the first transfer's disposable resources.","fix":"Dispose the previous transfer before replacing it, e.g. inside the `IOwnedClipboardImpl` branch: `if (!ReferenceEquals(_lastDataTransfer, dataTransfer)) _lastDataTransfer?.Dispose(); _lastDataTransfer = dataTransfer;`.","locations":[{"ref":"src/Avalonia.Base/Input/Platform/Clipboard.cs:21-30","code":"   21 |     public Task SetDataAsync(IAsyncDataTransfer? dataTransfer)\n   22 |     {\n   23 |         if (dataTransfer is null)\n   24 |             return ClearAsync();\n   25 | \n   26 |         if (_clipboardImpl is IOwnedClipboardImpl)\n   27 |             _lastDataTransfer = dataTransfer;\n   28 | \n   29 |         return _clipboardImpl.SetDataAsync(dataTransfer);\n   30 |     }","lines":10,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Input/Platform/Clipboard.cs#L21-L30"}]},
{"id":"MEM_48","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"`RemoteWidget` subscribes to `_connection.OnMessage` in its constructor with a lambda that is never unsubscribed, and the control never disposes `_bitmap` (a `WriteableBitmap`, which is `IDisposable`) on detach. As long as the transport connection lives, it keeps the widget alive and keeps posting `OnMessage`/`InvalidateVisual` to a possibly-detached control, and the last framebuffer bitmap is leaked.","fix":"Store the subscription handler and detach it (and dispose `_bitmap`) when the widget is removed from the visual tree (e.g. in `OnDetachedFromVisualTree`), or make `RemoteWidget` implement `IDisposable` and clean up there.","locations":[{"ref":"src/Avalonia.Controls/Remote/RemoteWidget.cs:24-38","code":"   24 |         public RemoteWidget(IAvaloniaRemoteTransportConnection connection)\n   25 |         {\n   26 |             Mode = SizingMode.Local;\n   27 | \n   28 |             _connection = connection;\n   29 |             _connection.OnMessage += (t, msg) => Dispatcher.UIThread.Post(OnMessage, msg);\n   30 |             _connection.Send(new ClientSupportedPixelFormatsMessage\n   31 |             {\n   32 |                 Formats = new[]\n   33 |                 {\n   34 |                     Avalonia.Remote.Protocol.Viewport.PixelFormat.Bgra8888,\n   35 |                     Avalonia.Remote.Protocol.Viewport.PixelFormat.Rgba8888,\n   36 |                 }\n   37 |             });\n   38 |         }","lines":15,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/Remote/RemoteWidget.cs#L24-L38"},{"ref":"src/Avalonia.Controls/Remote/RemoteWidget.cs:77-83","code":"   77 |                 if (_bitmap == null || _bitmap.PixelSize.Width != _lastFrame.Width ||\n   78 |                     _bitmap.PixelSize.Height != _lastFrame.Height)\n   79 |                 {\n   80 |                     _bitmap?.Dispose();\n   81 |                     _bitmap = new WriteableBitmap(new PixelSize(_lastFrame.Width, _lastFrame.Height),\n   82 |                         new Vector(96, 96), fmt);\n   83 |                 }","lines":7,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/Remote/RemoteWidget.cs#L77-L83"}]},
{"id":"MEM_49","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"`InvalidateChildInsetsPadding` only unsubscribes `InsetsManager.SafeAreaChanged` and disposes `_insetsPaddings` inside the `if (Content is Control child && InsetsManager is { } insetsManager)` block. When `Content` is changed to `null` (or a non-Control), `OnPropertyChanged(ContentProperty)` calls this method but the whole block is skipped, so the previous `SafeAreaChanged` subscription and the padding binding on the old child are never released, leaking the subscription that keeps `this` alive via the closure.","fix":"Always tear down the previous subscription/binding before deciding whether to re-create it: unsubscribe `SafeAreaChanged` and dispose `_insetsPaddings` outside/before the `Content is Control` guard, then only re-subscribe when a valid child with `AutoSafeAreaPadding` exists.","locations":[{"ref":"src/Avalonia.Controls/TopLevel.cs:637-659","code":"  637 |         private void InvalidateChildInsetsPadding()\n  638 |         {\n  639 |             if (Content is Control child\n  640 |                 && InsetsManager is { } insetsManager)\n  641 |             {\n  642 |                 insetsManager.SafeAreaChanged -= InsetsManagerOnSafeAreaChanged;\n  643 |                 _insetsPaddings?.Dispose();\n  644 | \n  645 |                 if (child.GetValue(AutoSafeAreaPaddingProperty))\n  646 |                 {\n  647 |                     insetsManager.SafeAreaChanged += InsetsManagerOnSafeAreaChanged;\n  648 |                     _insetsPaddings = child.SetValue(\n  649 |                         PaddingProperty,\n  650 |                         insetsManager.SafeAreaPadding,\n  651 |                         BindingPriority.Style); // lower priority, so it can be redefined by user\n  652 |                 }\n  653 | \n  654 |                 void InsetsManagerOnSafeAreaChanged(object? sender, SafeAreaChangedArgs e)\n  655 |                 {\n  656 |                     InvalidateChildInsetsPadding();\n  657 |                 }\n  658 |             }\n  659 |         }","lines":23,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/TopLevel.cs#L637-L659"}]},
{"id":"MEM_50","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"In the static `IconsProperty.Changed` handler, when the `Icons` collection is replaced, the old collection's icons are disposed via `RemoveIcons(args.OldValue.Value)` but the `Icons_CollectionChanged` handler previously attached to the old `TrayIcons` collection is never detached. The old collection therefore keeps a live delegate reference (and would still run `Icons_CollectionChanged` if later mutated), leaking the subscription.","fix":"Before/while handling `OldValue`, detach the handler: `args.OldValue.Value.CollectionChanged -= Icons_CollectionChanged;` in addition to calling `RemoveIcons`.","locations":[{"ref":"src/Avalonia.Controls/TrayIcon.cs:48-66","code":"   48 |             IconsProperty.Changed.Subscribe(args =>\n   49 |             {\n   50 |                 if (args.Sender is Application)\n   51 |                 {\n   52 |                     if (args.OldValue.Value != null)\n   53 |                     {\n   54 |                         RemoveIcons(args.OldValue.Value);\n   55 |                     }\n   56 | \n   57 |                     if (args.NewValue.Value != null)\n   58 |                     {\n   59 |                         args.NewValue.Value.CollectionChanged += Icons_CollectionChanged;\n   60 |                     }\n   61 |                 }\n   62 |                 else\n   63 |                 {\n   64 |                     throw new InvalidOperationException(\"TrayIcon.Icons must be set on the Application.\");\n   65 |                 }\n   66 |             });","lines":19,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/TrayIcon.cs#L48-L66"}]},
{"id":"MEM_51","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"In the AvaloniaNativeGlPlatformGraphics constructor a temporary GL context is created via `display.CreateContext(null)` solely to query the GL version, used inside a `using (context.MakeCurrent())` block, and then never disposed or stored. Only the disposable returned by MakeCurrent() is released; the IAvnGlContext itself leaks a native GL context on every graphics initialization.","fix":"Wrap the temporary context in `using var context = display.CreateContext(null);` (or dispose it after the version query) so the native context is released once version detection completes.","locations":[{"ref":"src/Avalonia.Native/AvaloniaNativeGlPlatformGraphics.cs:21-43","code":"   21 |             var context = display.CreateContext(null);\n   22 |             \n   23 |             int major, minor;\n   24 |             GlInterface glInterface;\n   25 |             using (context.MakeCurrent())\n   26 |             {\n   27 |                 var basic = new GlBasicInfoInterface(display.GetProcAddress);\n   28 |                 basic.GetIntegerv(GlConsts.GL_MAJOR_VERSION, out major);\n   29 |                 basic.GetIntegerv(GlConsts.GL_MINOR_VERSION, out minor);\n   30 |                 basic.GetIntegerv(GlConsts.GL_CONTEXT_PROFILE_MASK, out var profileMask);\n   31 |                 var isCompatibilityProfile = (profileMask & GlConsts.GL_CONTEXT_COMPATIBILITY_PROFILE_BIT) == GlConsts.GL_CONTEXT_COMPATIBILITY_PROFILE_BIT;\n   32 | \n   33 |                 _version = new GlVersion(GlProfileType.OpenGL, major, minor, isCompatibilityProfile);\n   34 |                 glInterface = new GlInterface(_version, (name) =>\n   35 |                 {\n   36 |                     var rv = _display.GetProcAddress(name);\n   37 |                     return rv;\n   38 |                 });\n   39 |             }\n   40 | \n   41 |             GlDisplay = new GlDisplay(display, glInterface, context.SampleCount, context.StencilSize, factory);\n   42 |             SharedContext =(GlContext)CreateContext();\n   43 |         }","lines":23,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Native/AvaloniaNativeGlPlatformGraphics.cs#L21-L43"}]},
{"id":"MEM_52","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"When `UseDebug` is set, a `VkDebugUtilsMessengerEXT` is created but the returned `messenger` handle is discarded and never stored, so it can never be passed to `vkDestroyDebugUtilsMessengerEXT`. The messenger leaks for the lifetime of the instance and typically triggers a Vulkan validation error at `vkDestroyInstance` because objects must be destroyed before the instance.","fix":"Store the returned `messenger` handle on the `VulkanInstance` and destroy it (via `vkDestroyDebugUtilsMessengerEXT`) when the instance/context is torn down.","locations":[{"ref":"src/Avalonia.Vulkan/Interop/VulkanInstance.cs:99-115","code":"   99 |         if (options.UseDebug)\n  100 |         {\n  101 |             var debugCreateInfo = new VkDebugUtilsMessengerCreateInfoEXT\n  102 |             {\n  103 |                 sType = VkStructureType.VK_STRUCTURE_TYPE_DEBUG_UTILS_MESSENGER_CREATE_INFO_EXT,\n  104 |                 messageSeverity = VkDebugUtilsMessageSeverityFlagsEXT.VK_DEBUG_UTILS_MESSAGE_SEVERITY_VERBOSE_BIT_EXT\n  105 |                     |VkDebugUtilsMessageSeverityFlagsEXT.VK_DEBUG_UTILS_MESSAGE_SEVERITY_WARNING_BIT_EXT\n  106 |                     |VkDebugUtilsMessageSeverityFlagsEXT.VK_DEBUG_UTILS_MESSAGE_SEVERITY_INFO_BIT_EXT\n  107 |                     |VkDebugUtilsMessageSeverityFlagsEXT.VK_DEBUG_UTILS_MESSAGE_SEVERITY_ERROR_BIT_EXT,\n  108 |                 messageType = VkDebugUtilsMessageTypeFlagsEXT.VK_DEBUG_UTILS_MESSAGE_TYPE_GENERAL_BIT_EXT\n  109 |                     |VkDebugUtilsMessageTypeFlagsEXT.VK_DEBUG_UTILS_MESSAGE_TYPE_VALIDATION_BIT_EXT\n  110 |                     |VkDebugUtilsMessageTypeFlagsEXT.VK_DEBUG_UTILS_MESSAGE_TYPE_PERFORMANCE_BIT_EXT,\n  111 |                 pfnUserCallback = VulkanDebugLogger.CallbackPtr\n  112 |             };\n  113 | \n  114 |             instanceApi.CreateDebugUtilsMessengerEXT(pInstance, ref debugCreateInfo, IntPtr.Zero, out var messenger);\n  115 |         }","lines":17,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Vulkan/Interop/VulkanInstance.cs#L99-L115"}]},
{"id":"MEM_53","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"NavigationHelper.addBackHandler sets window.onpopstate directly, clobbering any previously registered handler. If this function is called multiple times (e.g., after navigation state changes), each subsequent call replaces the previous onpopstate and the old backHandlerCallback closure is lost. Additionally, there is no way to remove the handler once added.","fix":"Use addEventListener('popstate', handler) with a stored reference, and expose a removeBackHandler method that calls removeEventListener.","locations":[{"ref":"src/Browser/Avalonia.Browser/webapp/modules/avalonia/navigationHelper.ts:3-13","code":"    3 |         history.pushState(null, \"\", window.location.href);\n    4 |         window.onpopstate = () => {\n    5 |             const handled = backHandlerCallback();\n    6 | \n    7 |             if (!handled) {\n    8 |                 history.back();\n    9 |             } else {\n   10 |                 history.forward();\n   11 |             }\n   12 |         };\n   13 |     }","lines":11,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Browser/Avalonia.Browser/webapp/modules/avalonia/navigationHelper.ts#L3-L13"}]},
{"id":"MEM_54","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"The VNC accept loop creates a `TcpClient` (via `AcceptTcpClientAsync`) and a `VncServerSession` for every connection inside an unbounded `while (true)` loop but never disposes them, and the loop has no shutdown/cancellation path, so the `TcpListener` and every accepted client/session outlive application shutdown. Disconnected clients accumulate undisposed sockets and sessions.","fix":"Track and dispose the `TcpClient`/`VncServerSession` when a connection ends (e.g. on session disconnect), and break the accept loop / stop the listener when the application lifetime is cancelled.","locations":[{"ref":"src/Headless/Avalonia.Headless.Vnc/HeadlessVncPlatformExtensions.cs:66-103","code":"   66 |                     lt.Startup += async delegate\n   67 |                     {\n   68 |                         while (true)\n   69 |                         {\n   70 |                             try\n   71 |                             {\n   72 |                                 var client = await tcpServer.AcceptTcpClientAsync();\n   73 |                                 var options = new VncServerSessionOptions\n   74 |                                 {\n   75 |                                     AuthenticationMethod = string.IsNullOrWhiteSpace(password)\n   76 |                                         ? AuthenticationMethod.None\n   77 |                                         : AuthenticationMethod.Password\n   78 |                                 };\n   79 |                                 var session = new VncServerSession(new VncPasswordChallenge(), logger:vncLogger);\n   80 |                                 if (string.IsNullOrWhiteSpace(password) == false)\n   81 |                                 {\n   82 |                                     session.PasswordProvided += (s, e) =>\n   83 |                                     {\n   84 |
