{"id":"LOGIC_114","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"The two-argument overload `FindType(string name, string assembly)` completely ignores its `assembly` parameter. It selects `FindType(name)` from every assembly and returns the first non-null match, so an assembly-qualified XAML type reference (e.g. `clr-namespace:...;assembly=...`) can resolve to a same-named type in a different assembly, silently producing wrong code-behind.","fix":"Filter by the requested assembly before searching for the type, e.g.:\n```csharp\npublic IXamlType? FindType(string name, string assembly) =>\n    _assemblies\n        .Where(a => string.Equals(a.Name, assembly, StringComparison.OrdinalIgnoreCase))\n        .Select(a => a.FindType(name))\n        .FirstOrDefault(type => type != null);\n```","locations":[{"ref":"src/tools/Avalonia.Generators/Compiler/RoslynTypeSystem.cs:47-51","code":"   47 |     [UnconditionalSuppressMessage(\"Trimming\", \"IL2092\", Justification = TrimmingMessages.Roslyn)]\n   48 |     public IXamlType? FindType(string name, string assembly) =>\n   49 |         _assemblies\n   50 |             .Select(assemblyInstance => assemblyInstance.FindType(name))\n   51 |             .FirstOrDefault(type => type != null);","lines":5,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/tools/Avalonia.Generators/Compiler/RoslynTypeSystem.cs#L47-L51"}]},
{"id":"LOGIC_115","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`RoslynType.IsInterface` returns `_symbol.IsAbstract`, so every abstract class is reported as an interface (and a non-abstract interface would be missed). This mis-classifies types for any XamlX logic that branches on `IsInterface`.","fix":"Test the actual type kind:\n```csharp\n// before\npublic bool IsInterface => _symbol.IsAbstract;\n// after\npublic bool IsInterface => _symbol.TypeKind == TypeKind.Interface;\n```","locations":[{"ref":"src/tools/Avalonia.Generators/Compiler/RoslynTypeSystem.cs:193","code":"  193 |     public bool IsInterface => _symbol.IsAbstract;","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/tools/Avalonia.Generators/Compiler/RoslynTypeSystem.cs#L193"}]},
{"id":"LOGIC_116","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"ComPtr::operator= uses pass-by-value (takes a copy of the source) and does not guard against self-assignment. When the same object is assigned to itself, Release is called before AddRef on the same underlying pointer, potentially destroying the object before the re-assignment completes if the ref count is 1.","fix":"Add a self-assignment guard: if (_obj == other._obj) return *this; at the top of operator=.","locations":[{"ref":"native/Avalonia.Native/inc/comimpl.h:73-81","code":"   73 |     ComPtr& operator=(ComPtr other)\n   74 |     {\n   75 |         if(_obj != NULL)\n   76 |             _obj->Release();\n   77 |         _obj = other._obj;\n   78 |         if(_obj != NULL)\n   79 |             _obj->AddRef();\n   80 |         return *this;\n   81 |     }","lines":9,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/native/Avalonia.Native/inc/comimpl.h#L73-L81"}]},
{"id":"LOGIC_117","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"TopLevelImpl::PointToClient and PointToScreen call [[[NSScreen screens] firstObject] frame] without checking whether [NSScreen screens] is empty. On headless or server environments, the screens array can be empty, making firstObject return nil and the NSMaxY call return 0 instead of crashing (Objective-C sends to nil), but silently producing wrong coordinates.","fix":"Guard with: if ([NSScreen screens].count == 0) return E_FAIL; before relying on firstObject.","locations":[{"ref":"native/Avalonia.Native/src/OSX/TopLevelImpl.mm:203","code":"  203 |         auto primaryDisplayHeight = NSMaxY([[[NSScreen screens] firstObject] frame]);","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/native/Avalonia.Native/src/OSX/TopLevelImpl.mm#L203"},{"ref":"native/Avalonia.Native/src/OSX/TopLevelImpl.mm:243","code":"  243 |         auto primaryDisplayHeight = NSMaxY([[[NSScreen screens] firstObject] frame]);","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/native/Avalonia.Native/src/OSX/TopLevelImpl.mm#L243"}]},
{"id":"LOGIC_118","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"AvaloniaActivity.ActivityResult and AvaloniaActivity.RequestPermissionsResult are plain Action/event fields (not proper events), so any code holding a reference to the activity can set them to null or replace them entirely, breaking other subscribers. AndroidStorageProvider relies on += and -= on these fields, which works, but a buggy external subclass can wipe all subscribers by assigning null.","fix":"Change the field types from Action<...>? to proper event EventHandler<...> delegates so the add/remove semantics are encapsulated.","locations":[{"ref":"src/Android/Avalonia.Android/AvaloniaActivity.cs:33-34","code":"   33 |     public Action<int, Result, Intent?>? ActivityResult { get; set; }\n   34 |     public Action<int, string[], Permission[]>? RequestPermissionsResult { get; set; }","lines":2,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Android/Avalonia.Android/AvaloniaActivity.cs#L33-L34"}]},
{"id":"LOGIC_119","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"AvaloniaActivity.OnResume() unconditionally forces LayoutInDisplayCutoutMode.ShortEdges on every resume, overriding any value set by AndroidInsetsManager.UpdateDisplayEdgeToEdgeState() (which may set LayoutInDisplayCutoutMode.Default when edge-to-edge is disabled). This means the insets manager's cutout mode setting is reset to ShortEdges on every resume, potentially showing content under the display cutout unexpectedly.","fix":"Delegate the cutout mode setting entirely to AndroidInsetsManager and remove the forced ShortEdges override from OnResume(), or call insetsManager.ApplyStatusBarState() here instead.","locations":[{"ref":"src/Android/Avalonia.Android/AvaloniaActivity.cs:159-170","code":"  159 |     protected override void OnResume()\n  160 |     {\n  161 |         base.OnResume();\n  162 | \n  163 |         // Android only respects LayoutInDisplayCutoutMode value if it has been set once before window becomes visible.\n  164 |         if (OperatingSystem.IsAndroidVersionAtLeast(28) && Window is { Attributes: { } attributes })\n  165 |         {\n  166 |             attributes.LayoutInDisplayCutoutMode = LayoutInDisplayCutoutMode.ShortEdges;\n  167 |         }\n  168 | \n  169 |         // We inform the ContentView that it has become visible. OnVisibleChanged() sometimes doesn't get called. Issue #15807.\n  170 |         _view?.OnVisibilityChanged(true);","lines":12,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Android/Avalonia.Android/AvaloniaActivity.cs#L159-L170"}]},
{"id":"LOGIC_120","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"AndroidInsetsManager registers a ViewTreeObserver.IOnGlobalLayoutListener (itself) for API < 30, but never removes it. The listener is added in the constructor but there is no Dispose() method on AndroidInsetsManager. When the activity is destroyed and a new one is created, the old listener still fires on the old DecorView's ViewTreeObserver, keeping the old AndroidInsetsManager and TopLevelImpl alive.","fix":"Implement IDisposable on AndroidInsetsManager; in Dispose() call Window.DecorView.ViewTreeObserver?.RemoveOnGlobalLayoutListener(this) and ViewCompat.SetOnApplyWindowInsetsListener(Window.DecorView, null).","locations":[{"ref":"src/Android/Avalonia.Android/Platform/AndroidInsetsManager.cs:104-113","code":"  104 |             if (Build.VERSION.SdkInt < BuildVersionCodes.R)\n  105 |             {\n  106 |                 _usesLegacyLayouts = true;\n  107 |                 _activity.Window?.DecorView.ViewTreeObserver?.AddOnGlobalLayoutListener(this);\n  108 |             }\n  109 | \n  110 |             DisplayEdgeToEdgePreference = false;\n  111 | \n  112 |             ViewCompat.SetWindowInsetsAnimationCallback(Window.DecorView, this);\n  113 |         }","lines":10,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Android/Avalonia.Android/Platform/AndroidInsetsManager.cs#L104-L113"}]},
{"id":"LOGIC_121","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"CommitTextCommand.Apply() computes the new cursor position as: newCursor = newCursorPosition > 0 ? Selection.Start + newCursorPosition - 1 : Selection.Start + newCursorPosition - _text.Length. After Replace() the selection already moves to the end of the inserted text, but newCursor is computed relative to Selection.Start before the Replace. The correct base should be the insertion point (realStart or Composition.Start) + _text.Length, not the pre-Replace Selection.Start.","fix":"Capture the insertion point before calling Replace(), then compute newCursor relative to insertPoint + _text.Length for positive newCursorPosition, and insertPoint for negative, matching the Android InputConnection contract.","locations":[{"ref":"src/Android/Avalonia.Android/Platform/Input/EditCommand.cs:148-171","code":"  148 |     internal class CommitTextCommand : EditCommand\n  149 |     {\n  150 |         private readonly string _text;\n  151 |         private readonly int _newCursorPosition;\n  152 | \n  153 |         public CommitTextCommand(string text, int newCursorPosition)\n  154 |         {\n  155 |             _text = text;\n  156 |             _newCursorPosition = newCursorPosition;\n  157 |         }\n  158 | \n  159 |         public override void Apply(TextEditBuffer buffer)\n  160 |         {\n  161 |             if (buffer.HasComposition)\n  162 |             {\n  163 |                 buffer.Replace(buffer.Composition!.Value.Start, buffer.Composition!.Value.End, _text);\n  164 |             }\n  165 |             else\n  166 |             {\n  167 |                 buffer.Replace(buffer.Selection.Start, buffer.Selection.End, _text);\n  168 |             }\n  169 |             var newCursor = _newCursorPosition > 0 ? buffer.Selection.Start + _newCursorPosition - 1 : buffer.Selection.Start + _newCursorPosition - _text.Length;\n  170 |             buffer.Selection = new TextSelection(newCursor, newCursor);\n  171 |         }","lines":24,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Android/Avalonia.Android/Platform/Input/EditCommand.cs#L148-L171"}]},
{"id":"LOGIC_122","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"PlatformSupport.GetNextRequestCode() uses a non-atomic post-increment (s_lastRequestCode++) on a static field, which is not thread-safe. If two threads (e.g. background tasks awaiting file pickers) call this concurrently, they may receive the same request code, causing one picker's result to be misrouted.","fix":"Use Interlocked.Increment(ref s_lastRequestCode) instead of s_lastRequestCode++.","locations":[{"ref":"src/Android/Avalonia.Android/Platform/PlatformSupport.cs:13","code":"   13 |     public static int GetNextRequestCode() => s_lastRequestCode++;","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Android/Avalonia.Android/Platform/PlatformSupport.cs#L13"}]},
{"id":"LOGIC_123","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"Off-by-one when stripping the class-binding prefix in `ClassBindingManager.IsClassesBindingProperty`. The proxy property name is built as `ClassPropertyPrefix + className` with no extra separator (see `GetClassProperty`/`RegisterClassProxyProperty`, where `ClassPropertyPrefix` = `\"__AvaloniaReserved::Classes::\"` already ends with `::`). Recovering the class name should therefore be `Substring(ClassPropertyPrefix.Length)`, but the code uses `ClassPropertyPrefix.Length + 1`, which drops the first character of the class name (e.g. \"foo\" becomes \"oo\"). The value flows into `Setter.Instance` where it is used to format an `InvalidOperationException` message, so the diagnostic text is wrong (\"(Classes.oo)\" instead of \"(Classes.foo)\").","fix":"Drop the `+ 1`:\n```csharp\nclassPropertyName = property.Name.Substring(ClassPropertyPrefix.Length);\n```","locations":[{"ref":"src/Avalonia.Base/ClassBindingManager.cs:49-52","code":"   49 |             if(property.Name?.StartsWith(ClassPropertyPrefix, StringComparison.OrdinalIgnoreCase) == true)\n   50 |             {\n   51 |                 classPropertyName = property.Name.Substring(ClassPropertyPrefix.Length + 1);\n   52 |                 return true;","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/ClassBindingManager.cs#L49-L52"}]},
{"id":"LOGIC_124","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`DataContextNode` has an asymmetric subscribe/unsubscribe cast. `OnSourceChanged` subscribes the\nhandler whenever the source is `IDataContextProvider && AvaloniaObject`\n(`ao.PropertyChanged += OnPropertyChanged`), but `Unsubscribe` only removes it when the old source is\na `StyledElement` (`if (oldSource is StyledElement oldElement)`). The only `IDataContextProvider`\nthat is an `AvaloniaObject` but not a `StyledElement` is `Application`, so a binding whose data-context\nsource resolves to `Application` will subscribe but never unsubscribe, leaking the handler. The two\ntype checks should match.","fix":"Make the `Unsubscribe` type check match the subscribe condition: `if (oldSource is AvaloniaObject oldElement) oldElement.PropertyChanged -= OnPropertyChanged;`","locations":[{"ref":"src/Avalonia.Base/Data/Core/ExpressionNodes/DataContextNode.cs:7-27","code":"    7 |     protected override void OnSourceChanged(object? source, Exception? dataValidationError)\n    8 |     {\n    9 |         if (!ValidateNonNullSource(source))\n   10 |             return;\n   11 | \n   12 |         if (source is IDataContextProvider && source is AvaloniaObject ao)\n   13 |         {\n   14 |             ao.PropertyChanged += OnPropertyChanged;\n   15 |             SetValue(ao.GetValue(StyledElement.DataContextProperty));\n   16 |         }\n   17 |         else\n   18 |         {\n   19 |             SetError($\"Unable to read DataContext from '{source.GetType()}'.\");\n   20 |         }\n   21 |     }\n   22 | \n   23 |     protected override void Unsubscribe(object oldSource)\n   24 |     {\n   25 |         if (oldSource is StyledElement oldElement)\n   26 |             oldElement.PropertyChanged -= OnPropertyChanged;\n   27 |     }","lines":21,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Data/Core/ExpressionNodes/DataContextNode.cs#L7-L27"}]},
{"id":"LOGIC_125","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`ExpressionTreeIndexerNode.BuildString` renders indexer arguments incorrectly. It loops from index\n`1` to the end appending each argument, then appends `Arguments[0]` last, with no separator before\nit. For a two-argument indexer `[a, b]` it produces `[ba]`; for `[a, b, c]` it produces `[b, ca]`.\nThe first argument is misplaced to the end and a delimiter is missing. This corrupts binding\ndescriptions used in error messages/diagnostics for reflection-based multi-argument indexer bindings.","fix":"Iterate all arguments in order with a single separator:\n```csharp\npublic override void BuildString(StringBuilder builder)\n{\n    builder.Append('[');\n    for (var i = 0; i < _expression.Arguments.Count; ++i)\n    {\n        if (i > 0)\n            builder.Append(\", \");\n        builder.Append(_expression.Arguments[i]);\n    }\n    builder.Append(']');\n}\n```","locations":[{"ref":"src/Avalonia.Base/Data/Core/ExpressionNodes/Reflection/ExpressionTreeIndexerNode.cs:32-45","code":"   32 |     public override void BuildString(StringBuilder builder)\n   33 |     {\n   34 |         builder.Append('[');\n   35 |         \n   36 |         for (var i = 1; i < _expression.Arguments.Count; ++i)\n   37 |         {\n   38 |             if (i > 1)\n   39 |                 builder.Append(\", \");\n   40 |             builder.Append(_expression.Arguments[i]);\n   41 |         }\n   42 | \n   43 |         builder.Append(_expression.Arguments[0]);\n   44 |         builder.Append(']');\n   45 |     }","lines":14,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Data/Core/ExpressionNodes/Reflection/ExpressionTreeIndexerNode.cs#L32-L45"}]},
{"id":"LOGIC_126","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"The `IsGestureRecognitionSkipped` property setter on PointerEventArgs ignores its `value` parameter and unconditionally assigns `true`. Currently harmless because the only caller (`PreventGestureRecognition`) sets `true`, but any future assignment of `false` would silently be turned into `true`.","fix":"Use the parameter: change `pointer.IsGestureRecognitionSkipped = true;` to `pointer.IsGestureRecognitionSkipped = value;`.","locations":[{"ref":"src/Avalonia.Base/Input/PointerEventArgs.cs:74-78","code":"   74 |             private set\n   75 |             {\n   76 |                 if (Pointer is Pointer pointer)\n   77 |                     pointer.IsGestureRecognitionSkipped = true;\n   78 |             }","lines":5,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Input/PointerEventArgs.cs#L74-L78"}]},
{"id":"LOGIC_127","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"The `PointerPointProperties(PointerPointProperties basedOn, RawPointerPoint rawPoint)` constructor copies button/pen flags and tilt/pressure/twist but never copies `PointerUpdateKind` or `ContactRect`. It is used by `PointerEventArgs.GetIntermediatePoints` (`new PointerPointProperties(_properties, pt)`), so every intermediate point reports `PointerUpdateKind = LeftButtonPressed` (the field default) and a default `ContactRect`, even though the current/last point reports the real kind. Public consumers reading `PointerPoint.Properties.PointerUpdateKind` (or `GetMouseButton()`) on intermediate points get incorrect values.","fix":"Copy the missing members in the constructor, e.g. add `PointerUpdateKind = basedOn.PointerUpdateKind;` (and `ContactRect = basedOn.ContactRect;` if appropriate) so intermediate points match the source properties.","locations":[{"ref":"src/Avalonia.Base/Input/PointerPoint.cs:176-191","code":"  176 |         internal PointerPointProperties(PointerPointProperties basedOn, RawPointerPoint rawPoint)\n  177 |         {\n  178 |             IsLeftButtonPressed = basedOn.IsLeftButtonPressed;\n  179 |             IsMiddleButtonPressed = basedOn.IsMiddleButtonPressed;\n  180 |             IsRightButtonPressed = basedOn.IsRightButtonPressed;\n  181 |             IsXButton1Pressed = basedOn.IsXButton1Pressed;\n  182 |             IsXButton2Pressed = basedOn.IsXButton2Pressed;\n  183 |             IsInverted = basedOn.IsInverted;\n  184 |             IsEraser = basedOn.IsEraser;\n  185 |             IsBarrelButtonPressed = basedOn.IsBarrelButtonPressed;\n  186 | \n  187 |             Twist = rawPoint.Twist;\n  188 |             Pressure = rawPoint.Pressure;\n  189 |             XTilt = rawPoint.XTilt;\n  190 |             YTilt = rawPoint.YTilt;\n  191 |         }","lines":16,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Input/PointerPoint.cs#L176-L191"}]},
{"id":"LOGIC_128","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `Layoutable.MeasureCore`, the container-query sizing switch handles the free (non-container) axis inconsistently. For `ContainerSizing.Width` the free axis (`height`) keeps its already-clamped value from `MathUtilities.Clamp(measured.Height, minMax.MinHeight, minMax.MaxHeight)`. For `ContainerSizing.Height`, however, the free axis is overwritten with `width = measured.Width`, discarding the earlier Min/MaxWidth clamp. This means MinWidth/MaxWidth constraints are silently ignored on the free axis when a control uses `ContainerSizing.Height`.","fix":"In the `ContainerSizing.Height` branch, drop the `width = measured.Width;` line so the free axis keeps the clamped `width` value (mirroring the `ContainerSizing.Width` branch, which leaves `height` untouched).","locations":[{"ref":"src/Avalonia.Base/Layout/Layoutable.cs:583-599","code":"  583 |                 if (isContainer)\n  584 |                 {\n  585 |                     switch (containerSizing)\n  586 |                     {\n  587 |                         case ContainerSizing.Width:\n  588 |                             width = double.IsInfinity(constrainedSize.Width) ? width : constrainedSize.Width;\n  589 |                             break;\n  590 |                         case ContainerSizing.Height:\n  591 |                             width = measured.Width;\n  592 |                             height = double.IsInfinity(constrainedSize.Height) ? height : constrainedSize.Height;\n  593 |                             break;\n  594 |                         case ContainerSizing.WidthAndHeight:\n  595 |                             width = double.IsInfinity(constrainedSize.Width) ? width : constrainedSize.Width;\n  596 |                             height = double.IsInfinity(constrainedSize.Height) ? height : constrainedSize.Height;\n  597 |                             break;\n  598 |                     }\n  599 |                 }","lines":17,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Layout/Layoutable.cs#L583-L599"}]},
{"id":"LOGIC_129","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`ExperimentalAcrylicMaterial.GetEffectiveTintColor` computes the effective alpha as `(byte)(255 * ((255.0 / tintColor.A) * tintOpacity) * tintOpacityModifier)`. Dividing by `tintColor.A` is wrong for any semi-transparent tint: when `A < 255` the factor `255/A > 1`, so the product can exceed 255 and the `(byte)` cast wraps/truncates, producing an alpha unrelated to the intended opacity (for the common WinUI-derived formula this term should be `tintColor.A`, not `255 * 255 / tintColor.A`). When `tintColor.A == 0` (the default `Color` value, and any explicitly transparent tint) the expression divides by zero, yielding `double.PositiveInfinity` that casts to alpha 0. The handlers only recompute on property change, so the effect surfaces as soon as a user assigns a `TintColor` whose alpha is less than 255.","fix":"Base the effective alpha on the tint's own alpha and clamp the result, e.g.:\n```\ndouble tintOpacityModifier = GetTintOpacityModifier(tintColor);\nvar alpha = (byte)Math.Clamp(Math.Round(tintColor.A * tintOpacity * tintOpacityModifier), 0, 255);\nreturn new Color(alpha, tintColor.R, tintColor.G, tintColor.B);\n```","locations":[{"ref":"src/Avalonia.Base/Media/ExperimentalAcrylicMaterial.cs:148-154","code":"  148 |         private static Color GetEffectiveTintColor(Color tintColor, double tintOpacity)\n  149 |         {\n  150 |             // Update tintColor's alpha with the combined opacity value\n  151 |             double tintOpacityModifier = GetTintOpacityModifier(tintColor);\n  152 | \n  153 |             return new Color((byte)(255 * ((255.0 / tintColor.A) * tintOpacity) * tintOpacityModifier), tintColor.R, tintColor.G, tintColor.B);\n  154 |         }","lines":7,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Media/ExperimentalAcrylicMaterial.cs#L148-L154"}]},
{"id":"LOGIC_130","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`BreakUnit.MapClass` special-cases a single hardcoded magic codepoint value with no explanation: `if (cp.Value == 327685) return LineBreakClass.Alphabetic;`. 327685 is 0x50005, an unassigned supplementary-plane codepoint; forcing exactly one arbitrary codepoint to `Alphabetic` ahead of the normal trie-driven classification has no documented Unicode justification and looks like leftover debug/test code. If it is not needed it silently overrides that codepoint's real class; if it is needed the intent is undocumented and unmaintainable.","fix":"Remove the magic-number special case so classification comes solely from the trie:\n```\n// delete:\nif (cp.Value == 327685)\n{\n    return LineBreakClass.Alphabetic;\n}\n```\nIf the override is genuinely required, replace the literal with a named constant and add a comment citing the Unicode rule/codepoint it addresses.","locations":[{"ref":"src/Avalonia.Base/Media/TextFormatting/Unicode/LineBreakEnumerator.cs:1465-1468","code":" 1465 |                 if (cp.Value == 327685)\n 1466 |                 {\n 1467 |                     return LineBreakClass.Alphabetic;\n 1468 |                 }","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Media/TextFormatting/Unicode/LineBreakEnumerator.cs#L1465-L1468"}]},
{"id":"LOGIC_131","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`PixelVector.NearlyEquals` declares `const float tolerance = float.Epsilon;` (~1.4e-45) and compares integer differences against it: `Math.Abs(_x - other._x) < tolerance`. Since `_x`/`_y` are `int`, the difference is an integer; any nonzero difference is >= 1 which is far larger than `float.Epsilon`, so the method is exactly equivalent to bitwise `Equals` and the \"tolerance\" is meaningless. The method is also unused anywhere in the codebase, so the misleading name/semantics is pure dead code.","fix":"Either remove the unused `NearlyEquals` method, or if a real tolerance is intended, document that for integer pixel vectors it is identical to `Equals`. As written the tolerance comparison serves no purpose.","locations":[{"ref":"src/Avalonia.Base/PixelVector.cs:137-142","code":"  137 |         public bool NearlyEquals(PixelVector other)\n  138 |         {\n  139 |             const float tolerance = float.Epsilon;\n  140 | \n  141 |             return Math.Abs(_x - other._x) < tolerance && Math.Abs(_y - other._y) < tolerance;\n  142 |         }","lines":6,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/PixelVector.cs#L137-L142"}]},
{"id":"LOGIC_132","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`ValueStore.RemoveFrame` unconditionally returns `false`, even when it successfully removes, disposes and reevaluates a frame. The method signature promises to report whether the frame was removed, so any caller relying on the return value gets a wrong result.","fix":"Return `true` when the frame is removed:\n```csharp\npublic bool RemoveFrame(ValueFrame frame)\n{\n    if (_frames.Remove(frame))\n    {\n        frame.Dispose();\n        ++_frameGeneration;\n        ReevaluateEffectiveValues();\n        return true;\n    }\n\n    return false;\n}\n```","locations":[{"ref":"src/Avalonia.Base/PropertyStore/ValueStore.cs:715-725","code":"  715 |         public bool RemoveFrame(ValueFrame frame)\n  716 |         {\n  717 |             if (_frames.Remove(frame))\n  718 |             {\n  719 |                 frame.Dispose();\n  720 |                 ++_frameGeneration;\n  721 |                 ReevaluateEffectiveValues();\n  722 |             }\n  723 | \n  724 |             return false;\n  725 |         }","lines":11,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/PropertyStore/ValueStore.cs#L715-L725"}]},
{"id":"LOGIC_133","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"The `Description` property in three property observables formats `_target.GetType().Name`, but `_target` is a `WeakReference<AvaloniaObject>`, so this always yields the string \"WeakReference`1\" instead of the wrapped target's type name. `Description` (from `IDescription`) is used for binding/diagnostics output, so the diagnostics are effectively useless for identifying the target object.","fix":"Resolve the real target before formatting, e.g. `public string Description => $\"{(_target.TryGetTarget(out var t) ? t.GetType().Name : \"(null)\")}.{_property.Name}\";`.","locations":[{"ref":"src/Avalonia.Base/Reactive/AvaloniaPropertyBindingObservable.cs:24","code":"   24 |         public string Description => $\"{_target.GetType().Name}.{_property.Name}\";","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Reactive/AvaloniaPropertyBindingObservable.cs#L24"},{"ref":"src/Avalonia.Base/Reactive/AvaloniaPropertyChangedObservable.cs:20","code":"   20 |         public string Description => $\"{_target.GetType().Name}.{_property.Name}\";","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Reactive/AvaloniaPropertyChangedObservable.cs#L20"},{"ref":"src/Avalonia.Base/Reactive/AvaloniaPropertyObservable.cs:24","code":"   24 |         public string Description => $\"{_target.GetType().Name}.{_property.Name}\";","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Reactive/AvaloniaPropertyObservable.cs#L24"}]},
{"id":"LOGIC_134","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`RegionDirtyRectTracker.GetInflatedPixelRect` computes `rc.Inflate(new Thickness(1)).IntersectOrEmpty(rc)` - inflating the rect by 1px and then intersecting with the *original un-inflated* rect, which yields `rc` back and completely nullifies the 1px anti-aliasing inflation. The other trackers correctly intersect the inflated rect with the surface `bounds` (MultiDirtyRectTracker.cs:38, SingleDirtyRectTracker.cs:26), and `FinalizeFrame` even receives a `bounds` parameter that is ignored here. Result: dirty regions are 1px too tight and can leave AA fringe artifacts at region edges. Only reachable when the region tracker is selected (SupportsRegions + UseRegionDirtyRectClipping + MaxDirtyRects <= 0).","fix":"Intersect with the surface bounds instead of `rc`. Pass `bounds` through:\n```csharp\nprivate LtrbPixelRect GetInflatedPixelRect(LtrbRect rc, LtrbRect bounds)\n{\n    var inflated = rc.Inflate(new Thickness(1)).IntersectOrEmpty(bounds);\n    return LtrbPixelRect.FromRectUnscaled(inflated);\n}\n```\nand call `GetInflatedPixelRect(rc, bounds)` from `FinalizeFrame`.","locations":[{"ref":"src/Avalonia.Base/Rendering/Composition/Server/DirtyRects/RegionDirtyRectTracker.cs:23-36","code":"   23 |     private LtrbPixelRect GetInflatedPixelRect(LtrbRect rc)\n   24 |     {\n   25 |         var inflated = rc.Inflate(new Thickness(1)).IntersectOrEmpty(rc);\n   26 |         var pixelRect = LtrbPixelRect.FromRectUnscaled(inflated);\n   27 |         return pixelRect;\n   28 |     }\n   29 |     \n   30 |     public void FinalizeFrame(LtrbRect bounds)\n   31 |     {\n   32 |         _region.Reset();\n   33 |         foreach (var rc in _rects) \n   34 |             _region.AddRect(GetInflatedPixelRect(rc));\n   35 |         CombinedRect = _region.Bounds.ToLtrbRectUnscaled();\n   36 |     }","lines":14,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Rendering/Composition/Server/DirtyRects/RegionDirtyRectTracker.cs#L23-L36"}]},
{"id":"LOGIC_135","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `UiThreadRenderTimer.TimerInstance`'s constructor the two `Interval` statements are swapped. `_timer.Interval = Interval;` runs BEFORE `Interval` (a get-only auto-property) has been assigned, so the timer's first interval is set to `default(TimeSpan)` (zero) rather than `1/FramesPerSecond`. `Interval` is only assigned on the next line. The first frame therefore fires immediately instead of after the intended frame interval (subsequent ticks recompute the interval correctly in `OnTick`).","fix":"Swap the two lines so `Interval` is set before it is used:\n```csharp\nInterval = TimeSpan.FromSeconds(1.0 / _parent.FramesPerSecond);\n_timer.Interval = Interval;\n```","locations":[{"ref":"src/Avalonia.Base/Rendering/UiThreadRenderTimer.cs:37-38","code":"   37 |             _timer.Interval = Interval;\n   38 |             Interval = TimeSpan.FromSeconds(1.0 / _parent.FramesPerSecond);","lines":2,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Rendering/UiThreadRenderTimer.cs#L37-L38"}]},
{"id":"LOGIC_136","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`Rotate3DTransform.Value` decides whether to apply the center transl/untranslate by testing the SUM of the three center components: `centerSum = CenterX + CenterY + CenterZ; if (Math.Abs(centerSum) > double.Epsilon) ...`. This is wrong for any center whose components cancel out, e.g. `Center = (5, -5, 0)`: the sum is 0 so the translate-to-center / translate-back is skipped and the rotation is performed about the origin instead of the requested center, giving an incorrect transform.","fix":"Test each component (or their magnitudes) rather than their signed sum, e.g.:\n```csharp\nvar hasCenter = copyCenterX != 0 || copyCenterY != 0 || copyCenterZ != 0;\n...\nif (hasCenter) matrix44 *= Matrix4x4.CreateTranslation(-(float)copyCenterX, -(float)copyCenterY, -(float)copyCenterZ);\n...\nif (hasCenter) matrix44 *= Matrix4x4.CreateTranslation((float)copyCenterX, (float)copyCenterY, (float)copyCenterZ);\n```","locations":[{"ref":"src/Avalonia.Base/Rotate3DTransform.cs:174-182","code":"  174 |             var centerSum = copyCenterX + copyCenterY + copyCenterZ;\n  175 |             \n  176 |             if (Math.Abs(centerSum) > double.Epsilon) matrix44 *= Matrix4x4.CreateTranslation(-(float)copyCenterX, -(float)copyCenterY, -(float)copyCenterZ);\n  177 | \n  178 |             if (copyAngleX != 0) matrix44 *= Matrix4x4.CreateRotationX((float)Matrix.ToRadians(copyAngleX));\n  179 |             if (copyAngleY != 0) matrix44 *= Matrix4x4.CreateRotationY((float)Matrix.ToRadians(copyAngleY));\n  180 |             if (copyAngleZ != 0) matrix44 *= Matrix4x4.CreateRotationZ((float)Matrix.ToRadians(copyAngleZ));\n  181 | \n  182 |             if (Math.Abs(centerSum) > double.Epsilon) matrix44 *= Matrix4x4.CreateTranslation((float)copyCenterX, (float)copyCenterY, (float)copyCenterZ);","lines":9,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Rotate3DTransform.cs#L174-L182"}]},
{"id":"LOGIC_137","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"Off-by-one in the DEBUG bounds checks of `ArraySlice<T>` and `ArrayBuilder<T>` indexers: they throw only when `index.CompareTo(Length/_size) > 0`, which permits `index == Length` (a valid array element outside the logical slice / an uninitialized capacity slot for `ArrayBuilder`). The valid range is `0 .. Length-1`, so the comparison should be `>= 0` for the upper bound. Impact is limited because the checks are `#if DEBUG` only, but the assertion fails to catch a genuine one-past-the-end access.","fix":"Change the upper-bound test to reject `index == Length`, e.g. `if (index < 0 || index >= Length)` (and `>= _size` in `ArrayBuilder`).","locations":[{"ref":"src/Avalonia.Base/Utilities/ArraySlice.cs:102-105","code":"  102 |                 if (index.CompareTo(0) < 0 || index.CompareTo(Length) > 0)\n  103 |                 {\n  104 |                     throw new ArgumentOutOfRangeException(nameof(index));\n  105 |                 }","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Utilities/ArraySlice.cs#L102-L105"},{"ref":"src/Avalonia.Base/Utilities/ArrayBuilder.cs:70-73","code":"   70 |                 if (index.CompareTo(0) < 0 || index.CompareTo(_size) > 0)\n   71 |                 {\n   72 |                     throw new ArgumentOutOfRangeException(nameof(index));\n   73 |                 }","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Utilities/ArrayBuilder.cs#L70-L73"}]},
{"id":"LOGIC_138","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`CharacterReader.Skip(int count)` advances the underlying span but, unlike every other consuming method (`Take`, `TakeUntil`, `TakeWhile`, `TakeIf(string)`, `SkipWhitespace`), it does not increment `Position`. `Skip` is used by `KeywordParser.TakeIfKeyword`, which is used by `PropertyPathGrammar` where `r.Position` is subsequently used as the character offset in `ExpressionParseException` messages. After a keyword (e.g. `\":=\"`, `\":>\"`, `\"as \"`) is consumed, all later error positions are understated by the skipped length, producing misleading parse-error offsets.","fix":"Update `Position` when skipping:\n```csharp\npublic void Skip(int count)\n{\n    if (_s.Length < count)\n        throw new IndexOutOfRangeException();\n    _s = _s.Slice(count);\n    Position += count;\n}\n```","locations":[{"ref":"src/Avalonia.Base/Utilities/CharacterReader.cs:107-112","code":"  107 |         public void Skip(int count)\n  108 |         {\n  109 |             if (_s.Length < count)\n  110 |                 throw new IndexOutOfRangeException();\n  111 |             _s = _s.Slice(count);\n  112 |         }","lines":6,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Utilities/CharacterReader.cs#L107-L112"}]},
{"id":"LOGIC_139","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `WeakEvent<TSender,TEventArgs>.Subscription.Remove`, the branch that should schedule a compaction uses the wrong condition: `else if (_list.NeedCompact && _compactScheduled) ScheduleCompact();`. `ScheduleCompact()` early-returns whenever `_compactScheduled` is already true, so gating the call on `_compactScheduled == true` makes this branch a permanent no-op - a compaction is never scheduled from the removal path. Compare with the correct condition in `OnEvent` (line 162): `if (_list.NeedCompact && !_compactScheduled) ScheduleCompact();`. As a result, dead weak-reference slots revealed around a `Remove` linger until some later `OnEvent` happens to reschedule compaction.","fix":"Change the condition to `else if (_list.NeedCompact && !_compactScheduled)` to match the `OnEvent` path.","locations":[{"ref":"src/Avalonia.Base/Utilities/WeakEvent.cs:110-114","code":"  110 |                 if(_list.IsEmpty)\n  111 |                     Destroy();\n  112 |                 else if(_list.NeedCompact && _compactScheduled)\n  113 |                     ScheduleCompact();\n  114 |             }","lines":5,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Utilities/WeakEvent.cs#L110-L114"}]},
{"id":"LOGIC_140","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In ColorSpectrum.RaiseColorChanged() the variable `areBothColorsBlack` is computed by OR-ing the three per-channel checks, so it becomes true whenever ANY single channel is zero in both the old and new color - which contradicts the name and intent (both colors being fully black requires ALL channels to be zero). Because it is OR-ed into the `if (colorChanged || areBothColorsBlack)` condition, ColorChanged fires spuriously for unchanged colors that merely have any zero channel (e.g. pure red 255,0,0 re-selected), causing redundant event raises and tooltip/display-name recomputation.","fix":"Use `&&` between the three channel checks so the flag is true only when both colors are fully black:\n```csharp\nbool areBothColorsBlack =\n    (_oldColor.R == newColor.R && newColor.R == 0) &&\n    (_oldColor.G == newColor.G && newColor.G == 0) &&\n    (_oldColor.B == newColor.B && newColor.B == 0);\n```","locations":[{"ref":"src/Avalonia.Controls.ColorPicker/ColorSpectrum/ColorSpectrum.cs:565-568","code":"  565 |             bool areBothColorsBlack =\n  566 |                 (_oldColor.R == newColor.R && newColor.R == 0) ||\n  567 |                 (_oldColor.G == newColor.G && newColor.G == 0) ||\n  568 |                 (_oldColor.B == newColor.B && newColor.B == 0);","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls.ColorPicker/ColorSpectrum/ColorSpectrum.cs#L565-L568"}]},
{"id":"LOGIC_141","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`Expander.StartContentTransition` (an `async void`) always posts `OnExpanded`/`OnCollapsed` via `Dispatcher.UIThread.Post` after the awaited transition completes, with no check for whether its own transition was cancelled/superseded. On every `IsExpanded` change a new `CancellationTokenSource` is created and the previous one is cancelled; the built-in transitions (`CrossFade`, etc.) complete normally on cancellation (they do not throw), so the cancelled invocation's continuation still runs and posts an event. Rapidly toggling `IsExpanded` (with a `ContentTransition` set and non-null `Content`) therefore fires duplicate / stale `Expanded`/`Collapsed` events - e.g. two `Collapsed` events after an expand-then-collapse sequence. Additionally each superseded `CancellationTokenSource` is cancelled but never disposed.","fix":"Guard the post with the transition's token and dispose superseded token sources. For example capture the token locally and skip the post when cancellation was requested:\n```csharp\n_lastTransitionCts?.Cancel();\n_lastTransitionCts?.Dispose();\n_lastTransitionCts = new CancellationTokenSource();\nvar token = _lastTransitionCts.Token;\n...\nif (token.IsCancellationRequested)\n    return;\nDispatcher.UIThread.Post(() => { ... });\n```","locations":[{"ref":"src/Avalonia.Controls/Expander.cs:221-254","code":"  221 |         private async void StartContentTransition()\n  222 |         {\n  223 |             if (Content != null && ContentTransition != null && Presenter is Visual visualContent)\n  224 |             {\n  225 |                 bool forward = ExpandDirection == ExpandDirection.Left ||\n  226 |                                ExpandDirection == ExpandDirection.Up;\n  227 | \n  228 |                 _lastTransitionCts?.Cancel();\n  229 |                 _lastTransitionCts = new CancellationTokenSource();\n  230 | \n  231 |                 if (IsExpanded)\n  232 |                 {\n  233 |                     await ContentTransition.Start(null, visualContent, forward, _lastTransitionCts.Token);\n  234 |                 }\n  235 |                 else\n  236 |                 {\n  237 |                     await ContentTransition.Start(visualContent, null, !forward, _lastTransitionCts.Token);\n  238 |                 }\n  239 |             }\n  240 | \n  241 |             // Expanded/Collapsed events are invoked asynchronously to ensure other events,\n  242 |             // such as Click, have time to complete first.\n  243 |             Dispatcher.UIThread.Post(() =>\n  244 |             {\n  245 |                 if (IsExpanded)\n  246 |                 {\n  247 |                     OnExpanded(new RoutedEventArgs(ExpandedEvent, this));\n  248 |                 }\n  249 |                 else\n  250 |                 {\n  251 |                     OnCollapsed(new RoutedEventArgs(CollapsedEvent, this));\n  252 |                 }\n  253 |             });\n  254 |         }","lines":34,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/Expander.cs#L221-L254"}]},
{"id":"LOGIC_142","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"Grid.GridLinesRenderer._lastArrangeSize is declared static, but it stores per-grid arrange size. Each Grid owns its own GridLinesRenderer instance, yet they all read/write the same static field. UpdateRenderBounds (called from each Grid's ArrangeOverride) overwrites the shared value, and Render reads it. When two or more grids have ShowGridLines enabled, the last grid to arrange determines the arrange size used to draw grid lines for every grid, so grid lines are drawn with the wrong width/height on all but the most-recently-arranged grid.","fix":"Make the field an instance field: change `private static Size _lastArrangeSize;` to `private Size _lastArrangeSize;`.","locations":[{"ref":"src/Avalonia.Controls/Grid.cs:3283-3289","code":" 3283 |             internal void UpdateRenderBounds(Size arrangeSize)\n 3284 |             {\n 3285 |                 _lastArrangeSize = arrangeSize;\n 3286 |                 InvalidateVisual();\n 3287 |             }\n 3288 | \n 3289 |             private static Size _lastArrangeSize;","lines":7,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/Grid.cs#L3283-L3289"},{"ref":"src/Avalonia.Controls/Grid.cs:3239-3262","code":" 3239 |                         grid.ColumnDefinitions[i].FinalOffset, _lastArrangeSize.Height);\n 3240 | \n 3241 |                     if (grid.ColumnSpacing != 0)\n 3242 |                     {\n 3243 |                         DrawGridLine(\n 3244 |                             drawingContext,\n 3245 |                             grid.ColumnDefinitions[i].FinalOffset - grid.ColumnSpacing, 0.0,\n 3246 |                             grid.ColumnDefinitions[i].FinalOffset - grid.ColumnSpacing, _lastArrangeSize.Height);\n 3247 |                     }\n 3248 |                 }\n 3249 | \n 3250 |                 for (int i = 1; i < grid.RowDefinitions.Count; ++i)\n 3251 |                 {\n 3252 |                     DrawGridLine(\n 3253 |                         drawingContext,\n 3254 |                         0.0, grid.RowDefinitions[i].FinalOffset,\n 3255 |                         _lastArrangeSize.Width, grid.RowDefinitions[i].FinalOffset);\n 3256 | \n 3257 |                     if (grid.RowSpacing != 0)\n 3258 |                     {\n 3259 |                         DrawGridLine(\n 3260 |                             drawingContext,\n 3261 |                             0.0, grid.RowDefinitions[i].FinalOffset - grid.RowSpacing,\n 3262 |                             _lastArrangeSize.Width, grid.RowDefinitions[i].FinalOffset - grid.RowSpacing);","lines":24,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/Grid.cs#L3239-L3262"}]},
{"id":"LOGIC_143","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"GridLength violates the Equals/GetHashCode contract for Auto values with a non-zero Value. operator== treats any two Auto GridLengths as equal regardless of their Value ((a.IsAuto && b.IsAuto) || ...), but GetHashCode mixes in _value.GetHashCode(). The public constructor GridLength(double, GridUnitType) accepts Auto with any non-negative value, so `new GridLength(5, GridUnitType.Auto).Equals(GridLength.Auto)` returns true while their hash codes differ. This breaks Dictionary/HashSet lookups keyed by GridLength.","fix":"Make GetHashCode consistent with equality by ignoring Value for Auto, e.g.:\n```csharp\npublic override int GetHashCode()\n{\n    return IsAuto ? _type.GetHashCode() : _value.GetHashCode() ^ _type.GetHashCode();\n}\n```","locations":[{"ref":"src/Avalonia.Controls/GridLength.cs:117-120","code":"  117 |         public static bool operator ==(GridLength a, GridLength b)\n  118 |         {\n  119 |             return (a.IsAuto && b.IsAuto) || (a._value == b._value && a._type == b._type);\n  120 |         }","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/GridLength.cs#L117-L120"},{"ref":"src/Avalonia.Controls/GridLength.cs:167-170","code":"  167 |         public override int GetHashCode()\n  168 |         {\n  169 |             return _value.GetHashCode() ^ _type.GetHashCode();\n  170 |         }","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/GridLength.cs#L167-L170"}]},
{"id":"LOGIC_144","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In DrawerPage.OnPropertyChanged, when Content changes the code calls UpdateActivePage() (which, when attached to the visual tree, sets _hasHadFirstPage = true and fires NavigatedTo with NavigationType.Replace on the new page) and only afterwards resets _hasHadFirstPage = false. Because the flag is cleared after it was used, a subsequent Loaded (e.g. the control being re-attached to the visual tree) will see _hasHadFirstPage == false and fire a second NavigatedTo with NavigationType.Push on the already-active CurrentPage, producing a duplicate NavigatedTo lifecycle callback without a matching NavigatedFrom.","fix":"Reset _hasHadFirstPage before calling UpdateActivePage() (or do not reset it at all when UpdateActivePage already dispatched a NavigatedTo for the new content), so that a later OnLoaded does not re-send a Push NavigatedTo for a page that is already active.","locations":[{"ref":"src/Avalonia.Controls/Page/DrawerPage.cs:629-646","code":"  629 |                 UpdateActivePage();\n  630 | \n  631 |                 if (change.Property == ContentProperty)\n  632 |                 {\n  633 |                     _hasHadFirstPage = false;\n  634 |                     _navBarVisibleSub?.Dispose();\n  635 |                     _navBarVisibleSub = null;\n  636 | \n  637 |                     if (change.OldValue is NavigationPage oldNav)\n  638 |                         oldNav.SetDrawerPage(null);\n  639 |                     if (change.NewValue is NavigationPage newNav)\n  640 |                     {\n  641 |                         newNav.SetDrawerPage(this);\n  642 |                         _navBarVisibleSub = newNav.GetObservable(NavigationPage.IsNavBarEffectivelyVisibleProperty)\n  643 |                             .Subscribe(new AnonymousObserver<bool>(_ => UpdateDetailNavBarVisiblePseudoClass()));\n  644 |                     }\n  645 |                     UpdateDetailNavBarVisiblePseudoClass();\n  646 |                 }","lines":18,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/Page/DrawerPage.cs#L629-L646"},{"ref":"src/Avalonia.Controls/Page/DrawerPage.cs:774-783","code":"  774 |         protected override void OnLoaded(RoutedEventArgs e)\n  775 |         {\n  776 |             base.OnLoaded(e);\n  777 | \n  778 |             if (!_hasHadFirstPage && CurrentPage != null)\n  779 |             {\n  780 |                 _hasHadFirstPage = true;\n  781 |                 CurrentPage.SendNavigatedTo(new NavigatedToEventArgs(null, NavigationType.Push));\n  782 |             }\n  783 |         }","lines":10,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/Page/DrawerPage.cs#L774-L783"}]},
{"id":"LOGIC_145","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"When building selection-foreground overrides over complex inline content, the loop accumulates run offsets using `textRun.Text.Length`, but the resulting `ValueSpan<TextRunProperties>` offsets are interpreted by the text source in the run's `Length`-based coordinate space (the same space as SelectionStart/SelectionEnd). For runs where `Text.Length != Length` (e.g. `EmbeddedControlRun` from an InlineUIContainer, which has empty Text but Length 1), `accumulatedLength` drifts out of sync, so the selection foreground brush is applied at the wrong character offsets for text following an embedded run.","fix":"Accumulate positions using `textRun.Length` (the text-source length) rather than `textRun.Text.Length`, so the computed `overlapStart`/`overlapLength` match the coordinate space used by `SelectionStart`/`SelectionEnd`.","locations":[{"ref":"src/Avalonia.Controls/SelectableTextBlock.cs:225-253","code":"  225 |                     var accumulatedLength = 0;\n  226 |                     foreach (var textRun in _textRuns)\n  227 |                     {\n  228 |                         var runLength = textRun.Text.Length;\n  229 |                         if (accumulatedLength + runLength <= start ||\n  230 |                             accumulatedLength >= start + length)\n  231 |                         {\n  232 |                             accumulatedLength += runLength;\n  233 |                             continue;\n  234 |                         }\n  235 | \n  236 |                         var overlapStart = Math.Max(start, accumulatedLength);\n  237 |                         var overlapEnd = Math.Min(start + length, accumulatedLength + runLength);\n  238 |                         var overlapLength = overlapEnd - overlapStart;\n  239 | \n  240 |                         textStyleOverrides ??= [];\n  241 | \n  242 |                         textStyleOverrides.Add(\n  243 |                             new ValueSpan<TextRunProperties>(\n  244 |                                 overlapStart,\n  245 |                                 overlapLength,\n  246 |                                 new GenericTextRunProperties(\n  247 |                                     textRun.Properties?.Typeface ?? typeface,\n  248 |                                     FontSize,\n  249 |                                     foregroundBrush: SelectionForegroundBrush,\n  250 |                                     fontFeatures: textRun.Properties?.FontFeatures ?? FontFeatures)));\n  251 | \n  252 |                         accumulatedLength += runLength;\n  253 |                     }","lines":29,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/SelectableTextBlock.cs#L225-L253"}]},
{"id":"LOGIC_146","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"SendFrame selects the WebSocket header size using `data.Length` in the first branch but everything else (payload length field and the bytes actually written) uses the `length` parameter. When a subrange is sent (`length < data.Length`) with `data.Length > 125` but `length <= 125`, the code skips the 2-byte header path and emits a 4-byte extended-length header for a tiny payload, producing a non-minimal (and inconsistent) frame encoding that some strict clients may reject.","fix":"Base the branch on the actual payload length: change `if (data.Length <= 125)` to `if (length <= 125)`.","locations":[{"ref":"src/Avalonia.DesignerSupport/Remote/HtmlTransport/SimpleWebSocketHttpServer.cs:306-316","code":"  306 |                 int headerLength;\n  307 |                 if (data.Length <= 125)\n  308 |                 {\n  309 |                     headerLength = WebsocketInitialHeaderLength;\n  310 |                     header.Length8 = (byte) length;\n  311 |                 }\n  312 |                 else if (length <= 0xffff)\n  313 |                 {\n  314 |                     headerLength = WebsocketLen16Length;\n  315 |                     header.Length8 = WebsocketLen16Code;\n  316 |                     header.Length16 = (ushort) IPAddress.HostToNetworkOrder((short) (ushort) length);","lines":11,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.DesignerSupport/Remote/HtmlTransport/SimpleWebSocketHttpServer.cs#L306-L316"}]},
{"id":"LOGIC_147","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In FramePresenter.tsx, the constructor explicitly calls this.componentDidUpdate({ conn: null! }, this.state) before mounting. At this point, the component has not been mounted, canvasRef.current is null, and this.props is the real props. The intent seems to be to wire up frame listeners if a conn is already provided, but componentDidUpdate is a React lifecycle method designed to be called after an update, not in the constructor. Calling it manually can lead to unexpected behavior and violates the React component contract.","fix":"Remove the constructor call to componentDidUpdate. Move any initialization logic that needs to run once into componentDidMount.","locations":[{"ref":"src/Avalonia.DesignerSupport/Remote/HtmlTransport/webapp/src/FramePresenter.tsx:20-22","code":"   20 |         this.componentDidUpdate({\n   21 |             conn: null!\n   22 |         }, this.state);","lines":3,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.DesignerSupport/Remote/HtmlTransport/webapp/src/FramePresenter.tsx#L20-L22"}]},
{"id":"LOGIC_148","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"FramePresenter.tsx posts canvas resize messages to the parent frame with '*' as the targetOrigin, which sends the message to any origin. Since the parent is expected to be a VSCode webview (origin checked for incoming messages), using '*' for outgoing postMessage exposes canvas dimensions to any malicious iframe that might embed this page.","fix":"Replace the '*' targetOrigin with a specific expected origin or store the origin from the first validated incoming message and use it for replies: parent?.postMessage({ ... }, trustedOrigin);","locations":[{"ref":"src/Avalonia.DesignerSupport/Remote/HtmlTransport/webapp/src/FramePresenter.tsx:93-98","code":"   93 |             parent?.postMessage({\n   94 |                 type: 'resize',\n   95 |                 width: canvas.width / window.devicePixelRatio,\n   96 |                 height: canvas.height / window.devicePixelRatio,\n   97 |             }, '*');\n   98 |         }","lines":6,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.DesignerSupport/Remote/HtmlTransport/webapp/src/FramePresenter.tsx#L93-L98"}]},
{"id":"LOGIC_149","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"DoubleClickHelper.IsDoubleClick returns true only when `_clickCount == 2` and never resets `_clickCount` after a successful double click. Within a single rapid burst the counter keeps incrementing (3, 4, 5, ...), so a fourth rapid click that should form a second double click is reported as a single click; double-click detection only ever works on exactly the second click of a burst until a timing/position gap resets the counter.","fix":"Reset `_clickCount` to 0 after returning a double click (or return `_clickCount % 2 == 0`) so alternating clicks in a fast sequence continue to register as double clicks.","locations":[{"ref":"src/Avalonia.Native/DoubleClickHelper.cs:20-30","code":"   20 |             if (!_lastClickRect.Contains(p) || timestamp - _lastClickTime > doubleClickTime)\n   21 |             {\n   22 |                 _clickCount = 0;\n   23 |             }\n   24 | \n   25 |             ++_clickCount;\n   26 |             _lastClickTime = timestamp;\n   27 |             _lastClickRect = new Rect(p, new Size())\n   28 |                 .Inflate(new Thickness(doubleClickSize.Width / 2, doubleClickSize.Height / 2));\n   29 | \n   30 |             return _clickCount == 2;","lines":11,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Native/DoubleClickHelper.cs#L20-L30"}]},
{"id":"LOGIC_150","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"InputModifiers is marked [Flags] but its members are assigned sequential ordinal values (Alt=0, Control=1, Shift=2, Windows=3, LeftMouseButton=4, ...) instead of distinct power-of-two bits. As a flags enum this is broken: Windows(3) == Control(1) | Shift(2), Alt(0) is indistinguishable from 'no flags', and any bitwise combination is ambiguous. It is also out of sync with the main library's modifier enum (which uses 1,2,4,8,...) despite the 'keep in sync' comment.","fix":"Either remove the `[Flags]` attribute (if these are always transmitted as an array of single values) or assign explicit power-of-two values (`Alt = 1, Control = 2, Shift = 4, Windows = 8, ...`) matching the main library.","locations":[{"ref":"src/Avalonia.Remote.Protocol/InputMessages.cs:15-25","code":"   15 |     [Flags]\n   16 |     public enum InputModifiers\n   17 |     {\n   18 |         Alt,\n   19 |         Control,\n   20 |         Shift,\n   21 |         Windows,\n   22 |         LeftMouseButton,\n   23 |         RightMouseButton,\n   24 |         MiddleMouseButton\n   25 |     }","lines":11,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Remote.Protocol/InputMessages.cs#L15-L25"}]},
{"id":"LOGIC_151","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The DRM format codes DRM_FORMAT_ARGB8888 and DRM_FORMAT_XRGB8888 are computed using DrmFormatCode('A','R','2','4') and DrmFormatCode('X','R','2','4') respectively. These are the correct standard DRM four-character codes (matching /usr/include/libdrm/drm_fourcc.h where AR24 = 0x34325241 and XR24 = 0x34325258). However the naming is confusing: 'AR24' is the FourCC shorthand for ARGB8888 (not 'ARGB') and the code uses '2' and '4' as the last two bytes rather than 'G' and 'B'. A future maintainer could mistake this for a copy-paste error and \"correct\" it to ('A','R','G','B') which would produce a completely wrong format code.","fix":"Add a comment explicitly stating these are the standard DRM fourcc codes (DRM_FORMAT_ARGB8888 = 0x34325241 = 'AR24') and cross-reference drm_fourcc.h. Optionally use the numeric constants directly with a comment instead of the character construction.","locations":[{"ref":"src/Avalonia.Wayland/Server/Interop/DrmGbmUnsafeNativeMethods.cs:46-50","code":"   46 |         public static uint DrmFormatCode(char a, char b, char c, char d) =>\n   47 |             (uint)a | ((uint)b << 8) | ((uint)c << 16) | ((uint)d << 24);\n   48 | \n   49 |         public static readonly uint DRM_FORMAT_ARGB8888 = DrmFormatCode('A', 'R', '2', '4');\n   50 |         public static readonly uint DRM_FORMAT_XRGB8888 = DrmFormatCode('X', 'R', '2', '4');","lines":5,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Wayland/Server/Interop/DrmGbmUnsafeNativeMethods.cs#L46-L50"}]},
{"id":"LOGIC_152","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In WXdgTopLevel.OnDisconnected, _decoration is destroyed and nulled but _decoration.Dispose() is not called (compare with OnConnected's DestroyDecoration helper which calls both Destroy and Dispose). This leaks the managed ZxdgToplevelDecorationV1 NWayland proxy on disconnect/reconnect cycles.","fix":"After _decoration.Destroy(), also call _decoration.Dispose() before setting _decoration = null, matching the pattern in DestroyDecoration().","locations":[{"ref":"src/Avalonia.Wayland/Server/Persistent/WSurface.cs:835-847","code":"  835 |     public override void OnDisconnected()\n  836 |     {\n  837 |         EventSink.OnKeyboardLeave();\n  838 |         foreach (var ex in _activeExports.ToList())\n  839 |             ex.Dispose();\n  840 |         _activeExports.Clear();\n  841 |         _decoration?.Destroy();\n  842 |         _decoration = null;\n  843 |         _xdgTopLevel?.Destroy();\n  844 |         _xdgTopLevel = null;\n  845 |         _pendingBatch = new();\n  846 |         base.OnDisconnected();\n  847 |     }","lines":13,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Wayland/Server/Persistent/WSurface.cs#L835-L847"}]},
{"id":"LOGIC_153","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In WaylandEglDmaBufSurface.RenderTarget.BeginDrawCore, when no free buffer slot is found an InvalidOperationException is thrown. But the swapchain size is 4 and the frame callback is supposed to gate rendering (only render when no frame callback is pending). If all 4 slots are busy it means 4 frames were committed without compositor release events firing between them. Rather than throwing, the surface should return RenderTargetNotReadyException (which is the standard 'not ready' signal that callers handle gracefully) so the render loop backs off.","fix":"Replace 'throw new InvalidOperationException(\"No free buffer slots\")' with 'throw new RenderTargetNotReadyException()' so the compositor-side backpressure is surfaced as a retriable condition instead of a fatal error.","locations":[{"ref":"src/Avalonia.Wayland/Server/Transient/Rendering/WaylandEglDmaBufSurface.cs:71-72","code":"   71 |             if (freeSlot == null)\n   72 |                 throw new InvalidOperationException(\"No free buffer slots available in swapchain\");","lines":2,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Wayland/Server/Transient/Rendering/WaylandEglDmaBufSurface.cs#L71-L72"}]},
{"id":"LOGIC_154","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In WaylandInputDispatcher.Seat, EnsureDataDevice() is called from the constructor before OnInitialGlobalsBound is called. EnsureDataDevice checks if DataDeviceManager is available (it may not be yet since the seats can be announced before the data-device manager global), so the device may not be created. This is handled correctly by the deferred call in OnInitialGlobalsBound. However, if a seat is added after OnInitialGlobalsBound has already run, EnsureDataDevice in the constructor will fire and successfully create the device. Then OnInitialGlobalsBound iterates existing seats and calls EnsureDataDevice again. The check 'if (DataDevice != null) return' prevents double creation. But seat constructed after OnInitialGlobalsBound gets EnsureDataDevice called twice (once from constructor, once from OnSeatAdded which then calls TextInputV3?.OnSeatAdded). The TextInputV3 seat is added twice because both OnSeatAdded (which calls TextInputV3?.OnSeatAdded) and OnInitialGlobalsBound (which iterates and calls TextInputV3?.OnSeatAdded) can race for late-arriving seats.","fix":"In OnInitialGlobalsBound, only call TextInputV3?.OnSeatAdded for seats whose seat was added before OnInitialGlobalsBound ran. Mark a boolean _initialGlobalsBound and skip the TextInputV3.OnSeatAdded call from OnInitialGlobalsBound for seats that already had it called. Or, since WaylandTextInputV3.OnSeatAdded checks _seats.ContainsKey, this is already idempotent — no real bug, but the intent is unclear.","locations":[{"ref":"src/Avalonia.Wayland/Server/Transient/WaylandInputDispatcher.cs:80-101","code":"   80 |     internal void OnSeatAdded(uint globalName, WlRegistry registry, uint version)\n   81 |     {\n   82 |         var seat = new Seat(this, registry, globalName, version);\n   83 |         _seats[globalName] = seat;\n   84 |         TextInputV3?.OnSeatAdded(globalName, seat.WlSeat);\n   85 |     }\n   86 | \n   87 |     /// <summary>\n   88 |     /// Called once after <see cref=\"WaylandGlobals\"/> has bound all available\n   89 |     /// globals. Constructs the text-input-v3 facade if the manager is present\n   90 |     /// and backfills per-seat objects (data devices, text-input-v3 proxies)\n   91 |     /// for any seats that were announced before this point.\n   92 |     /// <\/summary>\n   93 |     internal void OnInitialGlobalsBound()\n   94 |     {\n   95 |         if (_globals.TextInputManagerV3 is { } manager)\n   96 |             TextInputV3 = new WaylandTextInputV3(manager);\n   97 |         foreach (var (globalName, seat) in _seats)\n   98 |         {\n   99 |             seat.EnsureDataDevice();\n  100 |             TextInputV3?.OnSeatAdded(globalName, seat.WlSeat);\n  101 |         }","lines":22,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Wayland/Server/Transient/WaylandInputDispatcher.cs#L80-L101"}]},
{"id":"LOGIC_155","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The XkbCommonKeymap.ResolveKey method allocates bufSize = needed + 1 on the stack (stackalloc byte[bufSize]) where needed comes from an xkbcommon native call. xkb_state_key_get_utf8 can theoretically return large values for unusual keysyms (though in practice <= 6 bytes for any Unicode codepoint). If needed is large due to a corrupt keymap or future xkbcommon behavior, the stackalloc can overflow the thread stack without a guard. This is unlikely in practice but is an unbounded stackalloc on untrusted native input.","fix":"Add a cap: if needed > 256 (no legitimate single-key text is longer), fall back to heap allocation or return null. Typical needed values are 1-4 bytes for standard keys.","locations":[{"ref":"src/Avalonia.Wayland/XkbCommonKeymap.cs:84-88","code":"   84 |         var bufSize = needed + 1;\n   85 |         var buf = stackalloc byte[bufSize];\n   86 |         xkb_state_key_get_utf8(_state, xkbKey, buf, (IntPtr)bufSize);\n   87 | \n   88 |         var text = Encoding.UTF8.GetString(buf, needed);","lines":5,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Wayland/XkbCommonKeymap.cs#L84-L88"}]},
{"id":"LOGIC_156","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"FilterKeySymbol suppresses the form feed character (\\f = 0x0C) by the control character filter (c < ' '), and suppresses escape (\\x1b) since it's not in the explicit allow-list. But escape is explicitly allowed via the condition `c != '\\x1b'` — however the comment says control chars are rejected. The filter allows \\b (backspace), \\t (tab), \\r (carriage return), and \\x1b (escape) but blocks \\n (line feed = 0x0A) which is a printable text character that some text editors expect. Users pressing Enter in a multi-line context expect \\n to be delivered as keySymbol.","fix":"Consider also allowing '\\n' (0x0A, line feed) in the whitelist. The current filter sends \\r but not \\n which may cause issues in editors that distinguish them. Alternatively, keep current behavior but document the decision.","locations":[{"ref":"src/Avalonia.Wayland/XkbKeyTransform.cs:370-386","code":"  370 |     internal static string? FilterKeySymbol(string? text)\n  371 |     {\n  372 |         if (text is null || text.Length == 0)\n  373 |             return null;\n  374 | \n  375 |         if (text.Length == 1)\n  376 |         {\n  377 |             var c = text[0];\n  378 |             // Reject control characters and DEL\n  379 |             if (c < ' ' && c != '\\b' && c != '\\t' && c != '\\r' && c != '\\x1b')\n  380 |                 return null;\n  381 |             if (c == '\\x7f')\n  382 |                 return null;\n  383 |         }\n  384 | \n  385 |         return text;\n  386 |     }","lines":17,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Wayland/XkbKeyTransform.cs#L370-L386"}]},
{"id":"LOGIC_157","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In GlibDispatcherImplBase.Signal, the flag _signaledSourceAdded is set to true before g_idle_add_full is called. If g_idle_add_full throws (rare but possible), _signaledSourceAdded remains true but no GLib source was added. Subsequent Signal() calls will skip adding a new source (due to the '_signaledSourceAdded' guard), and the signaled event will never be processed.","fix":"Set _signaledSourceAdded inside a try/catch, resetting it to false if g_idle_add_full throws, or set it only after the successful call.","locations":[{"ref":"src/Avalonia.X11/Dispatching/GlibDispatcherImplBase.cs:96-106","code":"   96 |         lock (_signalLock)\n   97 |         {\n   98 |             if(_signaled)\n   99 |                 return;\n  100 |             _signaled = true;\n  101 |             if(_signaledSourceAdded)\n  102 |                 return;\n  103 |             _signaledSourceAdded = true;\n  104 |         }\n  105 |         g_idle_add_full(G_PRIORITY_DEFAULT - 1, SignalSourceCallback);\n  106 |     }","lines":11,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.X11/Dispatching/GlibDispatcherImplBase.cs#L96-L106"}]},
{"id":"LOGIC_158","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In X11PlatformThreading.RunLoop, the timer check at line 136 uses '_nextTimer < now' without checking for null: 'if (_nextTimer < now) continue'. Since _nextTimer is a 'long?' this compares a nullable long. The null-forgiving comparison 'nullable_long < long' evaluates to false when null, so this is technically correct but fragile. More importantly, line 123 uses '_nextTimer.HasValue && now > _nextTimer.Value', but line 136 uses '_nextTimer < now' (nullable comparison), meaning the two checks are semantically different: line 123 checks 'timer expired' and fires the Timer event, while line 136 checks 'timer already expired, skip sleeping' but uses a different null-comparison pattern. The inconsistency is confusing and 'continue' on line 136 skips the XFlush on re-entry.","fix":"Normalize the timer comparisons: use '_nextTimer.HasValue && _nextTimer.Value < now' on line 136 to match the style of line 123, making the intent clear.","locations":[{"ref":"src/Avalonia.X11/Dispatching/X11PlatformThreading.cs:119-140","code":"  119 |             while (!cancellationToken.IsCancellationRequested)\n  120 |             {\n  121 |                 var now = _clock.ElapsedMilliseconds;\n  122 |                 if (_nextTimer.HasValue && now > _nextTimer.Value)\n  123 |                 {\n  124 |                     Timer?.Invoke();\n  125 |                 }\n  126 | \n  127 |                 if (cancellationToken.IsCancellationRequested)\n  128 |                     return;\n  129 |                 \n  130 |                 //Flush whatever requests were made to XServer\n  131 |                 _x11Events.Flush();\n  132 |                 epoll_event ev;\n  133 |                 if (!_x11Events.IsPending)\n  134 |                 {\n  135 |                     now = _clock.ElapsedMilliseconds;\n  136 |                     if (_nextTimer < now)\n  137 |                         continue;\n  138 |                     \n  139 |                     var timeout = _nextTimer == null ? (int)-1 : Math.Max(1, _nextTimer.Value - now);\n  140 |                     epoll_wait(_epoll, &ev, 1, (int)Math.Min(int.MaxValue, timeout));","lines":22,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.X11/Dispatching/X11PlatformThreading.cs#L119-L140"}]},
{"id":"LOGIC_159","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In FindXdndTarget, the loop calls TryGetXdndTargetInfo on the root window first (line 469). If the root window itself somehow had an XdndAware property, the drag would target the root, which is almost certainly wrong. The XDND spec says walking should start at the top-level children of the root, not the root window itself.","fix":"Skip the TryGetXdndTargetInfo check when currentWindow == rootWindow, since the X root window is never an XDND target.","locations":[{"ref":"src/Avalonia.X11/Selections/DragDrop/X11DragSource.cs:461-482","code":"  461 |         private XdndTargetInfo? FindXdndTarget(PixelPoint rootPosition)\n  462 |         {\n  463 |             var display = _platform.Display;\n  464 |             var rootWindow = _platform.Info.RootWindow;\n  465 |             var currentWindow = rootWindow;\n  466 | \n  467 |             while (currentWindow != 0)\n  468 |             {\n  469 |                 if (TryGetXdndTargetInfo(currentWindow) is { } info)\n  470 |                     return info;\n  471 | \n  472 |                 if (!XTranslateCoordinates(display, rootWindow, currentWindow, rootPosition.X, rootPosition.Y,\n  473 |                     out _, out _, out var childWindow))\n  474 |                 {\n  475 |                     return null;\n  476 |                 }\n  477 | \n  478 |                 currentWindow = childWindow;\n  479 |             }\n  480 | \n  481 |             return null;\n  482 |         }","lines":22,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.X11/Selections/DragDrop/X11DragSource.cs#L461-L482"}]},
{"id":"LOGIC_160","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In X11DropTarget.OnXdndPosition (line 107), the XdndStatus response always sends ptr3=0 and ptr4=0 for the rectangle hint fields. While this is spec-compliant (it means 'no preferred rect, always re-send'), omitting a proper rectangle causes the drag source to flood the target with XdndPosition messages on every mouse move, since the source must re-send position whenever the pointer moves outside the given rectangle. This increases IPC traffic unnecessarily during drags.","fix":"Return the window's bounding rect in ptr3/ptr4 of XdndStatus. This tells the source it does not need to re-send XdndPosition unless the pointer moves outside the window bounds.","locations":[{"ref":"src/Avalonia.X11/Selections/DragDrop/X11DropTarget.cs:107","code":"  107 |         SendXdndMessage(_atoms.XdndStatus, drag, resultAction == 0 ? 0 : 1, 0, 0, resultAction);","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.X11/Selections/DragDrop/X11DropTarget.cs#L107"}]},
