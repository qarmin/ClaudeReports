<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"PolyBezierSegment.ApplyTo loops with `for (; i < points.Count; i += 3)` but reads `points[i + 1]` and `points[i + 2]` inside the body. Whenever Points.Count is not an exact multiple of 3 (e.g. 1, 2, 4, 5, ...), the last iteration indexes past the end of the collection and throws IndexOutOfRangeException. This is reachable from XAML/user data (a `<PolyBezierSegment Points=\"...\"/>` with any point count that isn't a multiple of 3) and crashes geometry construction. Ironically the code right after the loop logs a warning about \"invalid number of points\" that will be ignored - but the crash happens before that check is ever reached.","fix":"Only iterate while a full triple is available:\n```csharp\nfor (; i + 2 < points.Count; i += 3)\n{\n    ctx.CubicBezierTo(points[i], points[i + 1], points[i + 2], isStroken);\n}\n```\nThe existing `delta`/warning block then correctly reports the leftover 1-2 points.","locations":[{"ref":"src/Avalonia.Base/Media/PolyBezierSegment.cs:56-71","code":"   56 |             var i = 0;\n   57 |             for (; i < points.Count; i += 3)\n   58 |             {\n   59 |                 ctx.CubicBezierTo(points[i],\n   60 |                     points[i + 1],\n   61 |                     points[i + 2],\n   62 |                     isStroken);\n   63 |             }\n   64 |             var delta = i - points.Count;\n   65 |             if (delta != 0)\n   66 |             {\n   67 |                 Logging.Logger.TryGet(Logging.LogEventLevel.Warning,\n   68 |                     Logging.LogArea.Visual)\n   69 |                     ?.Log(nameof(PolyBezierSegment),\n   70 |                         $\"{nameof(PolyBezierSegment)} has ivalid number of points. Last {Math.Abs(delta)} points will be ignored.\");\n   71 |             }","lines":16,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Media/PolyBezierSegment.cs#L56-L71"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"PathMarkupParser.ReadArgument increments `i` past a trailing 'E'/'e' (scientific-notation exponent) without a bounds check before dereferencing `remaining[i]`. Input whose number token ends right after the exponent marker (e.g. path data \"M1E\" or \"L2e\") makes `i == remaining.Length` at line 497, so `remaining[i]` throws IndexOutOfRangeException instead of a graceful InvalidDataException. Path markup is externally supplied (XAML / PathGeometry.Parse / PathFigures.Parse), so malformed input crashes rather than being rejected cleanly.","fix":"Guard the read after incrementing past the exponent character:\n```csharp\nif (remaining[i] == 'E' || remaining[i] == 'e')\n{\n    valid = false;\n    i++;\n    if (i < remaining.Length && (remaining[i] == '-' || remaining[i] == '+'))\n    {\n        i++;\n        for (; i < remaining.Length && char.IsNumber(remaining[i]); i++) valid = true;\n    }\n}\n```","locations":[{"ref":"src/Avalonia.Base/Media/PathMarkupParser.cs:490-503","code":"  490 |             if (i < remaining.Length)\n  491 |             {\n  492 |                 // scientific notation\n  493 |                 if (remaining[i] == 'E' || remaining[i] == 'e')\n  494 |                 {\n  495 |                     valid = false;\n  496 |                     i++;\n  497 |                     if (remaining[i] == '-' || remaining[i] == '+')\n  498 |                     {\n  499 |                         i++;\n  500 |                         for (; i < remaining.Length && char.IsNumber(remaining[i]); i++) valid = true;\n  501 |                     }                  \n  502 |                 }               \n  503 |             }          ","lines":14,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Media/PathMarkupParser.cs#L490-L503"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`RefCountingSmallDictionary<TKey>.Remove` dereferences a possibly-null ref without checking. `GetValueRefOrNullRef(key)` returns `Unsafe.NullRef<TValue>()` when the key is not present, and the code then unconditionally executes `cnt--` on it, which dereferences a null managed pointer and crashes (AccessViolation/NRE). The sibling type `RefTrackingDictionary.ReleaseRef` guards exactly this case (`if (Unsafe.IsNullRef(ref count)) ...`), so the missing guard here is an inconsistency. It is reachable via `SimpleServerRenderResource.RemoveObserver` -> `_observers.Remove(observer)` whenever an observer is removed that was never (or no longer) registered (e.g. add/remove skewed by the `_disposed` short-circuit in `AddObserver`).","fix":"Guard against the null ref before decrementing:\n```csharp\npublic bool Remove(TKey key)\n{\n    ref var cnt = ref _counts.GetValueRefOrNullRef(key);\n    if (Unsafe.IsNullRef(ref cnt))\n        return false;\n    cnt--;\n    if (cnt == 0)\n    {\n        _counts.Remove(key);\n        return true;\n    }\n    return false;\n}\n```\n(Add `using System.Runtime.CompilerServices;`.)","locations":[{"ref":"src/Avalonia.Base/Utilities/RefCountingSmallDictionary.cs:18-29","code":"   18 |     public bool Remove(TKey key)\n   19 |     {\n   20 |         ref var cnt = ref _counts.GetValueRefOrNullRef(key);\n   21 |         cnt--;\n   22 |         if (cnt == 0)\n   23 |         {\n   24 |             _counts.Remove(key);\n   25 |             return true;\n   26 |         }\n   27 |         \n   28 |         return false;\n   29 |     }","lines":12,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Utilities/RefCountingSmallDictionary.cs#L18-L29"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`ComboBox.MoveSelection` throws `DivideByZeroException` when the control has no items and `WrapSelection` is true. For an empty combo box `SelectedIndex` is -1 and `ItemCount` (`count`) is 0. The loop enters with `i = startIndex + step` (e.g. 0 for a Down key), then `i >= count` (0 >= 0) is true, and because `wrap` is true it executes `i %= count`, i.e. `i %= 0`, which throws. This is reachable from the UI: with a focused empty `ComboBox` that has `WrapSelection=\"True\"`, pressing the Down/Up arrow (`OnKeyDown` -> `SelectNext`/`SelectPrevious`) or scrolling the mouse wheel (`OnPointerWheelChanged`) crashes the app. Neither caller guards against `ItemCount == 0`.","fix":"Bail out early when there are no items. Add at the top of `MoveSelection`:\n```csharp\nvar count = ItemCount;\nif (count == 0)\n    return false;\n```\n(The `i %= count` / `i += count` wrap arithmetic is only safe for `count > 0`.)","locations":[{"ref":"src/Avalonia.Controls/ComboBox.cs:609-643","code":"  609 |         private bool MoveSelection(int startIndex, int step, bool wrap)\n  610 |         {\n  611 |             static bool IsSelectable(object? o) => (o as AvaloniaObject)?.GetValue(IsEnabledProperty) ?? true;\n  612 | \n  613 |             var count = ItemCount;\n  614 | \n  615 |             for (int i = startIndex + step; i != startIndex; i += step)\n  616 |             {\n  617 |                 if (i < 0 || i >= count)\n  618 |                 {\n  619 |                     if (wrap)\n  620 |                     {\n  621 |                         if (i < 0)\n  622 |                             i += count;\n  623 |                         else if (i >= count)\n  624 |                             i %= count;\n  625 |                     }\n  626 |                     else\n  627 |                     {\n  628 |                         return false;\n  629 |                     }\n  630 |                 }\n  631 | \n  632 |                 var item = ItemsView[i];\n  633 |                 var container = ContainerFromIndex(i);\n  634 |                 \n  635 |                 if (IsSelectable(item) && IsSelectable(container))\n  636 |                 {\n  637 |                     SelectedIndex = i;\n  638 |                     return true;\n  639 |                 }\n  640 |             }\n  641 | \n  642 |             return false;\n  643 |         }","lines":35,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/ComboBox.cs#L609-L643"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"Mip-level count is computed without the mandatory `+ 1`. The full mip chain is `floor(log2(max(w,h))) + 1`. As written, an image whose largest dimension is 1 yields `MipLevels = 0`, which is illegal for `vkCreateImage` (mipLevels must be >= 1) and makes `CreateImage(...).ThrowOnError` throw. Every other size also gets one fewer level than a complete chain (and the `image` view / layout transitions inherit the wrong count).","fix":"Add the missing `+ 1`:\n```\nMipLevels = MipLevels != 0 ? MipLevels : (uint)Math.Floor(Math.Log(Math.Max(Size.Width, Size.Height), 2)) + 1;\n```","locations":[{"ref":"src/Avalonia.Vulkan/Interop/VulkanImage.cs:87","code":"   87 |         MipLevels = MipLevels != 0 ? MipLevels : (uint)Math.Floor(Math.Log(Math.Max(Size.Width, Size.Height), 2));","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Vulkan/Interop/VulkanImage.cs#L87"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"DrmResources dereferences the pointers returned by drmModeGetCrtc, drmModeGetEncoder and drmModeGetConnector/drmModeGetConnectorCurrent without null-checking them. All of these libdrm functions can return NULL (e.g. a connector/encoder disappears between enumeration and query, or ioctl fails). A NULL return leads to a null-pointer dereference (*crtc, *enc, or passing null into the DrmConnector ctor which reads conn->connection) and a hard crash.","fix":"Null-check each returned pointer (`crtc`, `enc`, `conn`) after the libdrm call and skip or throw a descriptive Win32Exception before dereferencing.","locations":[{"ref":"src/Linux/Avalonia.LinuxFramebuffer/Output/Drm.cs:96-116","code":"   96 |         }\n   97 | \n   98 |         [StructLayout(LayoutKind.Sequential)]\n   99 |         public struct drmModeModeInfo\n  100 |         {\n  101 |             public uint clock;\n  102 |             public ushort hdisplay, hsync_start, hsync_end, htotal, hskew;\n  103 |             public ushort vdisplay, vsync_start, vsync_end, vtotal, vscan;\n  104 | \n  105 |             public uint vrefresh;\n  106 | \n  107 |             public uint flags;\n  108 |             public DrmModeType type;\n  109 |             public fixed byte name[32];\n  110 |             public PixelSize Resolution => new PixelSize(hdisplay, vdisplay);\n  111 |         }\n  112 | \n  113 |         [StructLayout(LayoutKind.Sequential)]\n  114 |         public struct drmModeConnector {\n  115 |             public uint connector_id;\n  116 |             public uint encoder_id; // Encoder currently connected to ","lines":21,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Linux/Avalonia.LinuxFramebuffer/Output/Drm.cs#L96-L116"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`BitmapAnalyzerCodeFixProvider.RegisterCodeFixesAsync` assumes the flagged `new Bitmap(\"avares://...\")` is always inside a `LocalDeclarationStatementSyntax`: it calls `.OfType<LocalDeclarationStatementSyntax>().First()`. `BitmapAnalyzer` reports AVA2002 on *any* object-creation expression, so a `Bitmap` created in a field initializer, property initializer, return statement, method argument, etc. has no ancestor `LocalDeclarationStatementSyntax`, and `.First()` throws `InvalidOperationException`, causing the code fix to fail. `root` from `GetSyntaxRootAsync` is also dereferenced without a null check.","fix":"Use `.FirstOrDefault()` and bail out (return without registering a fix) if no enclosing declaration/object-creation is found, or locate the `ObjectCreationExpressionSyntax` directly from the diagnostic span instead of requiring a `LocalDeclarationStatementSyntax`. Also null-check `root` before use.","locations":[{"ref":"src/tools/Avalonia.Analyzers.CodeFixes.CSharp/BitmapAnalyzerCodeFixProvider.cs:38-54","code":"   38 |         var root = await context.Document.GetSyntaxRootAsync(context.CancellationToken).ConfigureAwait(false);\n   39 | \n   40 |         var diagnostic = context.Diagnostics.First();\n   41 |         var diagnosticSpan = diagnostic.Location.SourceSpan;\n   42 | \n   43 |         // Find the type declaration identified by the diagnostic.\n   44 |         var declaration = root.FindToken(diagnosticSpan.Start).Parent.AncestorsAndSelf()\n   45 |                               .OfType<LocalDeclarationStatementSyntax>().First();\n   46 | \n   47 |         // Register a code action that will invoke the fix.\n   48 |         context.RegisterCodeFix(\n   49 |             CodeAction.Create(\n   50 |                 _title,\n   51 |                 c => ReplaceArgumentAsync(context.Document, declaration, c),\n   52 |                 _title),\n   53 |             diagnostic);\n   54 |     }","lines":17,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/tools/Avalonia.Analyzers.CodeFixes.CSharp/BitmapAnalyzerCodeFixProvider.cs#L38-L54"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In `InterpretKeyframes`, keyframes using TimeSpan timing convert to a Cue with `keyframe.KeyTime.TotalSeconds / Duration.TotalSeconds`. When `Duration` is `TimeSpan.Zero` (its default), this divides by zero, yielding NaN or Infinity, which the `Cue` constructor rejects with `ArgumentException` (its range check `value <= 1 && value >= 0` is false for NaN/Infinity). So an animation with KeyTime-based keyframes but no Duration set throws an unhelpful exception at apply time instead of degrading gracefully like the zero-duration path elsewhere in the animation engine handles.","fix":"Guard against a zero (or negative) `Duration` before dividing, e.g. treat KeyTime as cue 1.0 (or 0.0) when `Duration.TotalSeconds <= 0`, or validate/throw a clear error explaining that a non-zero `Duration` is required when using `KeyTime`-based keyframes.","locations":[{"ref":"src/Avalonia.Base/Animation/Animation.cs:251-254","code":"  251 |                     if (keyframe.TimingMode == KeyFrameTimingMode.TimeSpan)\n  252 |                     {\n  253 |                         cue = new Cue(keyframe.KeyTime.TotalSeconds / Duration.TotalSeconds);\n  254 |                     }","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Animation/Animation.cs#L251-L254"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In GlyphRun.FindNearestCharacterHit the _hasOneCharPerCluster fast path indexes _glyphInfos[index] with the raw, unclamped input index (and FindGlyphIndex also returns the raw index unchanged for one-char-per-cluster runs). Unlike the general path (which uses the clamped glyphIndex), this branch performs no bounds check, so an out-of-range index throws IndexOutOfRangeException. This is reachable through the public caret-navigation API on GlyphRuns built with the ushort[] glyphIndices constructor (which sets _hasOneCharPerCluster = true): e.g. GetPreviousCaretCharacterHit(new CharacterHit(0)) calls FindNearestCharacterHit(-1), and GetNextCaretCharacterHit past the last cluster calls FindNearestCharacterHit(Count).","fix":"Clamp the index in the fast path (and/or in FindGlyphIndex for the one-char-per-cluster case) before indexing:\n```csharp\nvar glyphIndex = FindGlyphIndex(index);\nif (_hasOneCharPerCluster)\n{\n    glyphIndex = Math.Clamp(glyphIndex, 0, _glyphInfos.Count - 1);\n    width = _glyphInfos[glyphIndex].GlyphAdvance;\n    return new CharacterHit(glyphIndex, 1);\n}\n```","locations":[{"ref":"src/Avalonia.Base/Media/GlyphRun.cs:583-589","code":"  583 |             var glyphIndex = FindGlyphIndex(index);\n  584 | \n  585 |             if (_hasOneCharPerCluster)\n  586 |             {\n  587 |                 width = _glyphInfos[index].GlyphAdvance;\n  588 | \n  589 |                 return new CharacterHit(glyphIndex, 1);","lines":7,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Media/GlyphRun.cs#L583-L589"}]},
{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`UriExtensions.GetAssemblyNameFromQuery` can throw `IndexOutOfRangeException` on a malformed `resm:` query. The inner loop `for (var i = 0; i < assembly.Length; ++currentIndex, ++i)` indexes `query[currentIndex]` without checking `currentIndex < query.Length`. When the query is a non-empty prefix of the word \"assembly\" that runs to the end of the string (e.g. a `resm:` URI whose query is `?a` or `?assembl`), `currentIndex` advances past the end and the access crashes. This is reached from `StandardAssetLoader.TryGetAssembly` for `resm:` URIs (line 243), which does not guard the call. Secondarily, the match logic never verifies the character after \"assembly\" is `=`, so a key such as `assemblyfoo` is mistakenly accepted as `assembly` and returns a wrong value.","fix":"Bound the comparison loop with `currentIndex < query.Length` and only treat it as a match when the full key was matched and is followed by `=`. Simpler and safer: split the query manually, e.g. parse `query.TrimStart('?').Split('&')` and look for the segment starting with `assembly=`, returning the part after `=`.","locations":[{"ref":"src/Avalonia.Base/Utilities/UriExtensions.cs:42-66","code":"   42 |         while (currentIndex < query.Length)\n   43 |         {\n   44 |             var isFind = false;\n   45 |             for (var i = 0; i < assembly.Length; ++currentIndex, ++i)\n   46 |                 if (query[currentIndex] == assembly[i])\n   47 |                 {\n   48 |                     isFind = i == assembly.Length - 1;\n   49 |                 }\n   50 |                 else\n   51 |                 {\n   52 |                     break;\n   53 |                 }\n   54 | \n   55 |             // Skip the '='\n   56 |             ++currentIndex;\n   57 | \n   58 |             var beginIndex = currentIndex;\n   59 |             while (currentIndex < query.Length && query[currentIndex] != '&')\n   60 |                 ++currentIndex;\n   61 | \n   62 |             if (isFind)\n   63 |                 return query.Substring(beginIndex, currentIndex - beginIndex);\n   64 | \n   65 |             ++currentIndex;\n   66 |         }","lines":25,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Utilities/UriExtensions.cs#L42-L66"}]},
{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`AutoCompleteBox.OnTextBoxTextChanged` posts a UI-thread callback that dereferences `_textBox!` (`TextUpdated(_textBox!.Text, true)`). The `TextBox` setter disposes the text-changed subscription and can set `_textBox` to null (e.g. when the template is re-applied) between the `Post` and its execution, so the queued callback can throw a `NullReferenceException`.","fix":"Capture and null-check the text box inside the posted lambda, e.g. `Dispatcher.UIThread.Post(() => { if (_textBox is { } tb) TextUpdated(tb.Text, true); });`.","locations":[{"ref":"src/Avalonia.Controls/AutoCompleteBox/AutoCompleteBox.cs:1180-1194","code":" 1180 |         private void OnTextBoxTextChanged()\n 1181 |         {\n 1182 |             if (_ignoreTextBoxTextChange > 0)\n 1183 |             {\n 1184 |                 _ignoreTextBoxTextChange--;\n 1185 |                 return;\n 1186 |             }\n 1187 | \n 1188 |             //Uses Dispatcher.Post to allow the TextBox selection to update before processing\n 1189 |             Dispatcher.UIThread.Post(() =>\n 1190 |             {\n 1191 |                 // Call the central updated text method as a user-initiated action\n 1192 |                 TextUpdated(_textBox!.Text, true);\n 1193 |             });\n 1194 |         }","lines":15,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/AutoCompleteBox/AutoCompleteBox.cs#L1180-L1194"}]},
{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`DatePicker.SetGrid` dereferences the optional spacer template parts unconditionally via the null-forgiving operator:\n```csharp\nGrid.SetColumn(_spacer1!, isSpacer1Visible ? 1 : 0);\nGrid.SetColumn(_spacer2!, isSpacer2Visible ? 3 : 0);\n_spacer1!.IsVisible = isSpacer1Visible;\n_spacer2!.IsVisible = isSpacer2Visible;\n```\n`PART_FirstSpacer`/`PART_SecondSpacer` are declared as non-required `[TemplatePart]`s, so a custom template that omits them leaves `_spacer1`/`_spacer2` null and `Grid.SetColumn(null, ...)` throws `ArgumentNullException` (or the `.IsVisible` set throws `NullReferenceException`). The equivalent `DatePickerPresenter.SetGrid` was clearly written to tolerate missing spacers (its `ConfigureSpacer` local guards `if (spacer == null) return;`), so this is an inconsistency/oversight in `DatePicker`.","fix":"Guard against null spacers, mirroring `DatePickerPresenter.SetGrid`'s `ConfigureSpacer`:\n```csharp\nif (_spacer1 is not null)\n{\n    Grid.SetColumn(_spacer1, isSpacer1Visible ? 1 : 0);\n    _spacer1.IsVisible = isSpacer1Visible;\n}\nif (_spacer2 is not null)\n{\n    Grid.SetColumn(_spacer2, isSpacer2Visible ? 3 : 0);\n    _spacer2.IsVisible = isSpacer2Visible;\n}\n```","locations":[{"ref":"src/Avalonia.Controls/DateTimePickers/DatePicker.cs:375-379","code":"  375 |             Grid.SetColumn(_spacer1!, isSpacer1Visible ? 1 : 0);\n  376 |             Grid.SetColumn(_spacer2!, isSpacer2Visible ? 3 : 0);\n  377 | \n  378 |             _spacer1!.IsVisible = isSpacer1Visible;\n  379 |             _spacer2!.IsVisible = isSpacer2Visible;","lines":5,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/DateTimePickers/DatePicker.cs#L375-L379"}]},
{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"HyperlinkButton.OnClick posts an async continuation that dereferences TopLevel.GetTopLevel(this) with the null-forgiving operator. Because the work is deferred onto the dispatcher, the button may be detached from its visual tree between the click and when the continuation runs (e.g. clicking a hyperlink inside a menu/popup that closes on click), in which case GetTopLevel returns null and the continuation throws a NullReferenceException that is unobserved (fire-and-forget async lambda).","fix":"Null-check the top level inside the posted lambda before use, e.g. `var topLevel = TopLevel.GetTopLevel(this); if (topLevel is null) return; bool success = await topLevel.Launcher.LaunchUriAsync(uri);`.","locations":[{"ref":"src/Avalonia.Controls/HyperlinkButton.cs:84-91","code":"   84 |                 Dispatcher.UIThread.Post(async () =>\n   85 |                 {\n   86 |                     bool success = await TopLevel.GetTopLevel(this)!.Launcher.LaunchUriAsync(uri);\n   87 |                     if (success)\n   88 |                     {\n   89 |                         SetCurrentValue(IsVisitedProperty, true);\n   90 |                     }\n   91 |                 });","lines":8,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/HyperlinkButton.cs#L84-L91"}]},
{"id":"PANIC_14","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In `TreeView.OnKeyDown`, when a directional key is pressed and `SelectedItem` is null, the code unconditionally assigns `SelectedItem = ItemsView[0]`. If the tree has no items, `ItemsView[0]` throws `ArgumentOutOfRangeException`. This is reachable if the TreeView is made focusable (or otherwise receives key input) while empty.","fix":"Guard the access, e.g. `if (ItemsView.Count > 0) SelectedItem = ItemsView[0];`.","locations":[{"ref":"src/Avalonia.Controls/TreeView.cs:577-580","code":"  577 |                 else\n  578 |                 {\n  579 |                     SelectedItem = ItemsView[0];\n  580 |                 }","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/TreeView.cs#L577-L580"}]},
{"id":"PANIC_15","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"drive.VolumeLabel is read outside the guarded try/catch block (which ends at the `continue`). DriveInfo.VolumeLabel can throw (e.g. IOException/UnauthorizedAccessException on some volumes even after IsReady returned true, or on transient device removal), and it is also dereferenced with .Trim() which throws if the label is null. Because this is outside the try, any such exception propagates out of Listen and prevents the managed file dialog's volume list from being populated at all.","fix":"Move the `drive.VolumeLabel` access inside the try block (capture it into a local like `directory`/`totalSize`), and null-guard it, e.g. `var label = drive.VolumeLabel;` then `VolumeLabel = string.IsNullOrWhiteSpace(label) ? directory : label`.","locations":[{"ref":"src/Avalonia.Dialogs/Internal/BclMountedVolumeInfoProvider.cs:17-36","code":"   17 |             try\n   18 |             {\n   19 |                 if (!drive.IsReady)\n   20 |                     continue;\n   21 |                 totalSize = (ulong)drive.TotalSize;\n   22 |                 directory = drive.RootDirectory.FullName;\n   23 | \n   24 |                 _ = new DirectoryInfo(directory).EnumerateFileSystemInfos();\n   25 |             }\n   26 |             catch\n   27 |             {\n   28 |                 continue;\n   29 |             }\n   30 | \n   31 |             mountedDrives.Add(new MountedVolumeInfo\n   32 |             {\n   33 |                 VolumeLabel = string.IsNullOrEmpty(drive.VolumeLabel.Trim()) ? directory : drive.VolumeLabel,\n   34 |                 VolumePath = directory,\n   35 |                 VolumeSizeBytes = totalSize\n   36 |             });","lines":20,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Dialogs/Internal/BclMountedVolumeInfoProvider.cs#L17-L36"}]},
{"id":"PANIC_16","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"NativeMethods.ReadLink does not check the return value of `readlink`. On error readlink returns -1; the `Debug.Assert(size < BufferSize)` passes for -1 in debug builds (and is absent in release), then `Encoding.UTF8.GetString(buffer, 0, (int)size)` is called with a negative count, throwing ArgumentOutOfRangeException. This is reachable from LinuxMountedVolumeInfoListener when a symlink under /dev/disk/by-label is removed between enumeration and readlink (TOCTOU), and the exception then escapes the DispatcherTimer poll callback.","fix":"After the call, handle failure explicitly, e.g. `if (size < 0) return string.Empty;` (or throw a Win32Exception) before calling GetString, and only assert on the success path.","locations":[{"ref":"src/Avalonia.FreeDesktop/NativeMethods.cs:28-31","code":"   28 |                 var size = readlink(symlink, buffer, BufferSize);\n   29 |                 Debug.Assert(size < BufferSize); // if this fails, we need to increase the buffer size (dynamically?)\n   30 | \n   31 |                 return Encoding.UTF8.GetString(buffer, 0, (int)size);","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.FreeDesktop/NativeMethods.cs#L28-L31"}]},
{"id":"UAF_1","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"easy","description":"`ContextLost()` disposes `_resources` but, unlike `DoCleanup()`, never sets `_resources = null` (nor clears `_visual`). On the non-shared-context recreation path (the DXGI/external-objects path where `contextSharingFeature?.CanCreateSharedContext` is not true), `EnsureInitializedCore` only creates a new `OpenGlControlBaseResources` when `_resources == null`. Because the field still points at the disposed, context-lost resources, both `if (_resources == null)` branches are skipped, so the stale lost context is reused: `_visual.Surface = _resources.Surface` binds the old surface and the next `BeginDraw` calls `Context.EnsureCurrent()` on a lost context, throwing `PlatformGraphicsContextLostException`. Context-loss recovery is therefore permanently broken on that path.","fix":"In `ContextLost()`, after `_resources?.DisposeAsync();` set `_resources = null;` (and clear `_visual`/detach the child visual) so `EnsureInitializedCore` recreates the resources, mirroring `DoCleanup()`.","locations":[{"ref":"src/Avalonia.OpenGL/Controls/OpenGlControlBase.cs:154-159","code":"  154 |         private void ContextLost()\n  155 |         {\n  156 |             _initialization = null;\n  157 |             _resources?.DisposeAsync();\n  158 |             OnOpenGlLost();\n  159 |         }","lines":6,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.OpenGL/Controls/OpenGlControlBase.cs#L154-L159"},{"ref":"src/Avalonia.OpenGL/Controls/OpenGlControlBase.cs:110-124","code":"  110 |                 if(_resources == null)\n  111 |                 {\n  112 |                     var contextFactory = AvaloniaLocator.Current.GetRequiredService<IPlatformGraphicsOpenGlContextFactory>();\n  113 |                     ctx = contextFactory.CreateContext(null);\n  114 |                     if (ctx.TryGetFeature<IGlContextExternalObjectsFeature>(out var externalObjects))\n  115 |                         _resources = OpenGlControlBaseResources.TryCreate(ctx, surface, interop, externalObjects);\n  116 |                 }\n  117 |                 \n  118 |                 if(_resources == null)\n  119 |                 {\n  120 |                     Logger.TryGet(LogEventLevel.Error, \"OpenGL\")?.Log(\"OpenGlControlBase\",\n  121 |                         \"Unable to initialize OpenGL: current platform does not support multithreaded context sharing and shared memory\");\n  122 |                     ctx?.Dispose();\n  123 |                     return false;\n  124 |                 }","lines":15,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.OpenGL/Controls/OpenGlControlBase.cs#L110-L124"}]},
{"id":"UAF_2","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"medium","description":"In SynchronousXEventWaiter.WaitForEvent, when a GenericEvent is stashed and later put back via XPutBackEvent, there is a use-after-free risk. The code calls XGetEventData to fill cookie.data, stashes the event (with data pointer set), calls XPutBackEvent (which copies the struct including the non-null data pointer into the server queue), and only then calls XFreeEventData (which frees the memory and sets the local struct's data pointer to null). The copy already inserted into the Xlib queue by XPutBackEvent retains the now-freed data pointer. When the main event loop later dequeues this event and calls XGetEventData again (X11EventDispatcher.cs:40), the behavior is undefined: Xlib may attempt to reference the stale pointer or double-free it.","fix":"When stashing a GenericEvent, call XFreeEventData immediately after stashing (before putting it back), and clear cookie.data to zero in the local copy before calling XPutBackEvent. This ensures the re-queued event has data=null, so the main loop's XGetEventData will safely re-fetch it.","locations":[{"ref":"src/Avalonia.X11/Selections/DragDrop/SynchronousXEventWaiter.cs:76-96","code":"   76 |                 stashedEvents ??= [];\n   77 |                 stashedEvents.Add(evt);\n   78 |             }\n   79 |         }\n   80 |         finally\n   81 |         {\n   82 |             if (stashedEvents is not null)\n   83 |             {\n   84 |                 foreach (var evt in stashedEvents)\n   85 |                 {\n   86 |                     XPutBackEvent(display, evt);\n   87 | \n   88 |                     if (evt.type == XEventName.GenericEvent)\n   89 |                     {\n   90 |                         unsafe\n   91 |                         {\n   92 |                             if (evt.GenericEventCookie.data != null)\n   93 |                                 XFreeEventData(display, &evt.GenericEventCookie);\n   94 |                         }\n   95 |                     }\n   96 |                 }","lines":21,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.X11/Selections/DragDrop/SynchronousXEventWaiter.cs#L76-L96"},{"ref":"src/Avalonia.X11/Dispatching/X11EventDispatcher.cs:39-40","code":"   39 |             if (xev.type == XEventName.GenericEvent)\n   40 |                 XGetEventData(_display, &xev.GenericEventCookie);","lines":2,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.X11/Dispatching/X11EventDispatcher.cs#L39-L40"}]},
{"id":"UAF_3","type":"use_after_free","type_label":"Use After Free","severity":"low","difficulty":"easy","description":"In the failure path of `Initialize`, when `CreateMemory` throws the image is destroyed via `DestroyImage` but `_handle` is not cleared. `_handle.Handle` therefore remains non-zero, so a later `Dispose()` (lines 176-180) will call `DestroyImage` again on the already-destroyed handle - a double free / use-after-free. Reachable whenever `Initialize` is invoked on a `VulkanImageBase` that is subsequently disposed after a memory-allocation failure.","fix":"Set `_handle = default;` after `DestroyImage` in the catch block (before `throw;`).","locations":[{"ref":"src/Avalonia.Vulkan/Interop/VulkanImage.cs:114-122","code":"  114 |         try\n  115 |         {\n  116 |             _imageMemory = CreateMemory(_handle, memoryRequirements.size, memoryRequirements.memoryTypeBits);\n  117 |         }\n  118 |         catch\n  119 |         {\n  120 |             _context.DeviceApi.DestroyImage(_context.DeviceHandle, _handle, IntPtr.Zero);\n  121 |             throw;\n  122 |         }","lines":9,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Vulkan/Interop/VulkanImage.cs#L114-L122"}]},
{"id":"RACE_1","type":"race_condition","type_label":"Race Condition","severity":"high","difficulty":"medium","description":"AvaloniaInputConnection uses Interlocked operations on _batchLevel but the field is also read with plain field access (IsInBatchEdit, EndBatchEdit). Specifically BeginBatchEdit and EndBatchEdit both do _batchLevel = Interlocked.Increment/Decrement(...), writing the result back via a plain assignment that races with concurrent increments on another thread. The intent was to use the return value of Interlocked.Increment as the new value, but then assigning it back is redundant and racing.","fix":"Remove the plain assignment: just call Interlocked.Increment(ref _batchLevel) without assigning the result, and read _batchLevel with Volatile.Read for IsInBatchEdit, or restrict all batch editing to the UI thread and drop the Interlocked entirely.","locations":[{"ref":"src/Android/Avalonia.Android/Platform/Input/AvaloniaInputConnection.cs:99-121","code":"   99 |         public bool BeginBatchEdit()\n  100 |         {\n  101 |             _batchLevel = Interlocked.Increment(ref _batchLevel);\n  102 |             return InputMethod.IsActive;\n  103 |         }\n  104 | \n  105 |         public bool EndBatchEdit()\n  106 |         {\n  107 |             _batchLevel = Interlocked.Decrement(ref _batchLevel);\n  108 | \n  109 |             if (!IsInBatchEdit)\n  110 |             {\n  111 |                 IsInUpdate = true;\n  112 |                 while (_commandQueue.TryDequeue(out var command))\n  113 |                 {\n  114 |                     command.Apply(_editBuffer);\n  115 |                 }\n  116 |                 IsInUpdate = false;\n  117 |             }\n  118 | \n  119 |             UpdateState();\n  120 |             return IsInBatchEdit;\n  121 |         }","lines":23,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Android/Avalonia.Android/Platform/Input/AvaloniaInputConnection.cs#L99-L121"}]},
{"id":"RACE_2","type":"race_condition","type_label":"Race Condition","severity":"medium","difficulty":"medium","description":"EventStash.Fire reads the `_delegate` field outside of any lock (line 62) to decide whether to stash the event or invoke handlers. This races with Add, which under the lock sets `_delegate` and then swaps out and replays `_stash`. If Fire observes `_delegate == null` just before Add adds a handler and nulls out `_stash`, Fire then locks and appends to a (now abandoned) stash list, so the event is silently lost; conversely an event can also be delivered twice. The nested `lock(this)` in Add is redundant and does not fix the TOCTOU because Fire's read is unsynchronized.","fix":"Perform the `_delegate == null` check and the corresponding stash/invoke decision inside a single `lock (this)` block in `Fire`, matching the locking discipline used by `Add`/`Remove`.","locations":[{"ref":"src/Avalonia.Remote.Protocol/EventStash.cs:60-72","code":"   60 |         public void Fire(IAvaloniaRemoteTransportConnection transport, T ev)\n   61 |         {\n   62 |             if (_delegate == null)\n   63 |             {\n   64 |                 lock (this)\n   65 |                 {\n   66 |                     _stash = _stash ?? new List<T>();\n   67 |                     _stash.Add(ev);\n   68 |                 }\n   69 |             }\n   70 |             else\n   71 |                 _delegate?.Invoke(_transport, ev);\n   72 |         }","lines":13,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Remote.Protocol/EventStash.cs#L60-L72"},{"ref":"src/Avalonia.Remote.Protocol/EventStash.cs:19-51","code":"   19 |         public void Add(Action<IAvaloniaRemoteTransportConnection, T> handler)\n   20 |         {\n   21 |             List<T> stash;\n   22 |             lock (this)\n   23 |             {\n   24 |                 var needsReplay = _delegate == null;\n   25 |                 _delegate += handler;\n   26 |                 if(!needsReplay)\n   27 |                     return;\n   28 | \n   29 |                 lock (this)\n   30 |                 {\n   31 |                     stash = _stash;\n   32 |                     if(_stash == null)\n   33 |                         return;\n   34 |                     _stash = null;\n   35 |                 }\n   36 |             }\n   37 |             foreach (var m in stash)\n   38 |             {\n   39 |                 if (_exceptionHandler != null)\n   40 |                     try\n   41 |                     {\n   42 |                         _delegate?.Invoke(_transport, m);\n   43 |                     }\n   44 |                     catch (Exception e)\n   45 |                     {\n   46 |                         _exceptionHandler(e);\n   47 |                     }\n   48 |                 else\n   49 |                     _delegate?.Invoke(_transport, m);\n   50 |             }\n   51 |         }","lines":33,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Remote.Protocol/EventStash.cs#L19-L51"}]},
{"id":"RACE_3","type":"race_condition","type_label":"Race Condition","severity":"low","difficulty":"easy","description":"The single-context guard `if (SingleContext && _contexts.Any())` reads `_contexts` outside the `_lock`, while `_contexts` is otherwise mutated only under `_lock` (Add in CreateContext, Remove in OnContextDisposed, clear in Dispose). Two threads can both pass the check before either adds its context (TOCTOU), and the unsynchronized enumeration can also race with a concurrent `List` mutation and throw.","fix":"Move the `SingleContext && _contexts.Any()` check inside the `lock (_lock)` block that already surrounds context creation.","locations":[{"ref":"src/Avalonia.OpenGL/Egl/EglDisplay.cs:54-59","code":"   54 |         public EglContext CreateContext(EglContextOptions? options)\n   55 |         {\n   56 |             if (SingleContext && _contexts.Any())\n   57 |                 throw new OpenGlException(\"This EGLDisplay can only have one active context\");\n   58 |             \n   59 |             options ??= new EglContextOptions();","lines":6,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.OpenGL/Egl/EglDisplay.cs#L54-L59"}]},
{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"very_easy","description":"TISCopyCurrentKeyboardInputSource returns a retained object that must be released with CFRelease, but CharsFromScanCode (called from both VirtualKeyFromScanCode and KeySymbolFromScanCode) never releases it. Every key event leaks one Core Foundation object.","fix":"Add CFRelease(currentKeyboard) before each return path in CharsFromScanCode.","locations":[{"ref":"native/Avalonia.Native/src/OSX/KeyTransform.mm:408-466","code":"  408 |     auto currentKeyboard = TISCopyCurrentKeyboardInputSource();\n  409 |     if (!currentKeyboard)\n  410 |         return 0;\n  411 | \n  412 |     auto layoutData = static_cast<CFDataRef>(TISGetInputSourceProperty(currentKeyboard, kTISPropertyUnicodeKeyLayoutData));\n  413 |     if (!layoutData)\n  414 |         return 0;\n  415 | \n  416 |     auto* keyboardLayout = reinterpret_cast<const UCKeyboardLayout*>(CFDataGetBytePtr(layoutData));\n  417 | \n  418 |     UInt32 deadKeyState = 0;\n  419 |     UniCharCount length = 0;\n  420 |     \n  421 |     int glyphModifiers = 0;\n  422 |     if (modifierFlags & NSEventModifierFlagShift)\n  423 |         glyphModifiers |= shiftKey;\n  424 |     if (modifierFlags & NSEventModifierFlagCapsLock)\n  425 |         glyphModifiers |= alphaLock;\n  426 |     if (modifierFlags & NSEventModifierFlagOption)\n  427 |         glyphModifiers |= optionKey;\n  428 | \n  429 |     auto result = UCKeyTranslate(\n  430 |         keyboardLayout,\n  431 |         scanCode,\n  432 |         keyAction,\n  433 |         (glyphModifiers >> 8) & 0xFF,\n  434 |         LMGetKbdType(),\n  435 |         kUCKeyTranslateNoDeadKeysBit,\n  436 |         &deadKeyState,\n  437 |         bufferSize,\n  438 |         &length,\n  439 |         buffer);\n  440 | \n  441 |     if (result != noErr)\n  442 |         return 0;\n  443 | \n  444 |     if (deadKeyState)\n  445 |     {\n  446 |         // translate a space with dead key state to get the dead key itself\n  447 |         result = UCKeyTranslate(\n  448 |             keyboardLayout,\n  449 |             kVK_Space,\n  450 |             keyAction,\n  451 |             0,\n  452 |             LMGetKbdType(),\n  453 |             kUCKeyTranslateNoDeadKeysBit,\n  454 |             &deadKeyState,\n  455 |             bufferSize,\n  456 |             &length,\n  457 |             buffer);\n  458 | \n  459 |         if (result != noErr)\n  460 |             return 0;\n  461 |     }\n  462 | \n  463 |     if (length == 1 && buffer[0] <= 0x7F && !IsAllowedAsciiChar(buffer[0]))\n  464 |         return 0;\n  465 | \n  466 |     return length;","lines":59,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/native/Avalonia.Native/src/OSX/KeyTransform.mm#L408-L466"}]},
{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"medium","description":"PlatformRenderTimer creates a CVDisplayLinkRef in RegisterTick but has no destructor and never calls CVDisplayLinkRelease. When the object is destroyed (ref count reaches zero) the display link is leaked along with any internal CoreVideo resources.","fix":"Add a destructor that calls CVDisplayLinkStop if running and then CVDisplayLinkRelease(_displayLink).","locations":[{"ref":"native/Avalonia.Native/src/OSX/PlatformRenderTimer.mm:3-85","code":"    3 | class PlatformRenderTimer : public ComSingleObject<IAvnPlatformRenderTimer, &IID_IAvnPlatformRenderTimer>\n    4 | {\n    5 | private:\n    6 |     ComPtr<IAvnActionCallback> _callback;\n    7 |     CVDisplayLinkRef _displayLink;\n    8 | \n    9 | public:\n   10 |     FORWARD_IUNKNOWN()\n   11 |     virtual int RegisterTick (\n   12 |         IAvnActionCallback* callback) override\n   13 |     {\n   14 |         START_COM_CALL;\n   15 |         \n   16 |         @autoreleasepool\n   17 |         {\n   18 |             if (_displayLink != nil)\n   19 |             {\n   20 |                 return E_UNEXPECTED;\n   21 |             }\n   22 | \n   23 |             _callback = callback;\n   24 |             auto result = CVDisplayLinkCreateWithActiveCGDisplays(&_displayLink);\n   25 |             if (result != 0)\n   26 |             {\n   27 |                 return result;\n   28 |             }\n   29 | \n   30 |             result = CVDisplayLinkSetOutputCallback(_displayLink, OnTick, this);\n   31 |             if (result != 0)\n   32 |             {\n   33 |                 return result;\n   34 |             }\n   35 |         }\n   36 |         return S_OK;\n   37 |     }\n   38 | \n   39 |     virtual void Start () override\n   40 |     {\n   41 |         START_COM_CALL;\n   42 | \n   43 |         @autoreleasepool\n   44 |         {\n   45 |             if (CVDisplayLinkIsRunning(_displayLink) == false) {\n   46 |                 CVDisplayLinkStart(_displayLink);\n   47 |             }\n   48 |         }\n   49 |     }\n   50 | \n   51 |     virtual void Stop () override\n   52 |     {\n   53 |         START_COM_CALL;\n   54 | \n   55 |         @autoreleasepool\n   56 |         {\n   57 |             if (CVDisplayLinkIsRunning(_displayLink) == true) {\n   58 |                 CVDisplayLinkStop(_displayLink);\n   59 |             }\n   60 |         }\n   61 |     }\n   62 | \n   63 |     virtual bool RunsInBackground () override\n   64 |     {\n   65 |         START_COM_CALL;\n   66 | \n   67 |         @autoreleasepool\n   68 |         {\n   69 |             return true;\n   70 |         }\n   71 |     }\n   72 |     \n   73 |     static CVReturn OnTick(CVDisplayLinkRef displayLink, const CVTimeStamp *inNow, const CVTimeStamp *inOutputTime, CVOptionFlags flagsIn, CVOptionFlags *flagsOut, void *displayLinkContext)\n   74 |     {\n   75 |         START_ARP_CALL;\n   76 |         PlatformRenderTimer *object = (PlatformRenderTimer *)displayLinkContext;\n   77 |         object->_callback->Run();\n   78 |         return kCVReturnSuccess;\n   79 |     }\n   80 | };\n   81 | \n   82 | extern IAvnPlatformRenderTimer* CreatePlatformRenderTimer()\n   83 | {\n   84 |     return new PlatformRenderTimer();\n   85 | }","lines":83,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/native/Avalonia.Native/src/OSX/PlatformRenderTimer.mm#L3-L85"}]},
{"id":"MEM_3","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"medium","description":"Screens registers a CGDisplayReconfigurationCallback with a raw this pointer in its constructor but never calls CGDisplayRemoveReconfigurationCallback in a destructor. When the object is destroyed, macOS calls back into freed memory.","fix":"Add a destructor that calls CGDisplayRemoveReconfigurationCallback(CGDisplayReconfigurationCallBack, this).","locations":[{"ref":"native/Avalonia.Native/src/OSX/Screens.mm:12-13","code":"   12 |         _events = events;\n   13 |         CGDisplayRegisterReconfigurationCallback(CGDisplayReconfigurationCallBack, this);","lines":2,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/native/Avalonia.Native/src/OSX/Screens.mm#L12-L13"}]},
{"id":"MEM_4","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"medium","description":"NodeInfoProvider<T> subscribes to peer.PropertyChanged in its constructor but never unsubscribes. AutomationPeer peers are managed by AvaloniaAccessHelper which itself is recreated on every OnAttachedToWindow() call. The old NodeInfoProvider instances keep their PropertyChanged subscriptions alive, preventing old peer objects from being GC'd for the lifetime of the new peers that hold indirect references through event chains.","fix":"Implement IDisposable on NodeInfoProvider<T> and unsubscribe from peer.PropertyChanged in Dispose(). Dispose old NodeInfoProvider instances when AvaloniaAccessHelper is detached.","locations":[{"ref":"src/Android/Avalonia.Android/Automation/NodeInfoProvider.cs:26-27","code":"   26 |             _peer.PropertyChanged += PeerPropertyChanged;\n   27 |         }","lines":2,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Android/Avalonia.Android/Automation/NodeInfoProvider.cs#L26-L27"}]},
{"id":"MEM_5","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"easy","description":"`GetSharedContext` unconditionally allocates a new `VulkanContext` on every call. The `if (_currentSharedContext?.IsLost == true)` block only nulls the field but never returns the existing (non-lost) context, so the assignment below always overwrites it with a brand-new instance. Each new `VulkanContext` may construct a `VulkanExternalObjectsFeature` which allocates a `VulkanCommandBufferPool` (a real Vulkan resource), and the previous shared context is dropped without disposal (see the empty `VulkanContext.Dispose`). Repeated calls therefore leak command pools and needlessly rebuild the API wrappers.","fix":"Return the cached context when it is still valid:\n```csharp\npublic IPlatformGraphicsContext GetSharedContext()\n{\n    if (_currentSharedContext is { IsLost: false })\n        return _currentSharedContext;\n    return _currentSharedContext =\n        new VulkanContext(_factory.GetSharedDevice(_platformOptions), _platformOptions.PlatformFeatures);\n}\n```","locations":[{"ref":"src/Avalonia.Vulkan/VulkanPlatformGraphics.cs:21-27","code":"   21 |     public IPlatformGraphicsContext GetSharedContext()\n   22 |     {\n   23 |         if (_currentSharedContext?.IsLost == true)\n   24 |             _currentSharedContext = null;\n   25 |         return _currentSharedContext =\n   26 |             new VulkanContext(_factory.GetSharedDevice(_platformOptions), _platformOptions.PlatformFeatures);\n   27 |     }","lines":7,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Vulkan/VulkanPlatformGraphics.cs#L21-L27"}]},
{"id":"MEM_6","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"very_easy","description":"In PushOpacity() when useOpacitySaveLayer is true, new SKPaint objects are heap-allocated on lines 730 and 734 and passed directly to Canvas.SaveLayer(). SKCanvas does not take ownership and does not dispose them. Skia's managed wrapper finalizer will eventually collect them, but there is no deterministic disposal, and every push in a busy rendering loop leaks one SKPaint from the pool.","fix":"Use SKPaintCache.Shared.Get() / ReturnReset() for the opacity paint, matching the pattern used elsewhere in DrawingContextImpl. Dispose the paint (return it to the cache) immediately after the SaveLayer call.","locations":[{"ref":"src/Skia/Avalonia.Skia/DrawingContextImpl.cs:727-735","code":"  727 |                 if (bounds.HasValue)\n  728 |                 {\n  729 |                     var rect = bounds.Value.ToSKRect();\n  730 |                     Canvas.SaveLayer(rect, new SKPaint { ColorF = new SKColorF(0, 0, 0, (float)opacity) });\n  731 |                 }\n  732 |                 else\n  733 |                 {\n  734 |                     Canvas.SaveLayer(new SKPaint { ColorF = new SKColorF(0, 0, 0, (float)opacity) });\n  735 |                 }","lines":9,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Skia/Avalonia.Skia/DrawingContextImpl.cs#L727-L735"}]},
{"id":"MEM_7","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"very_easy","description":"FontManagerImpl.GetInstalledFontFamilyNames() replaces _skFontManager with a new SKFontManager.CreateDefault() instance when checkForUpdates is true, without disposing the old one. SKFontManager holds native resources and each leaked instance permanently grows native memory.","fix":"Dispose the old manager before replacing it: var old = _skFontManager; _skFontManager = SKFontManager.CreateDefault(); old.Dispose();","locations":[{"ref":"src/Skia/Avalonia.Skia/FontManagerImpl.cs:26-29","code":"   26 |             if (checkForUpdates)\n   27 |             {\n   28 |                 _skFontManager = SKFontManager.CreateDefault();\n   29 |             }","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Skia/Avalonia.Skia/FontManagerImpl.cs#L26-L29"}]},
{"id":"MEM_8","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"very_easy","description":"SkiaTypeface.TryGetStream() calls SKTypeface.OpenStream() which returns a SKStreamAsset (an SKObject). The asset is never disposed - only the buffer bytes are copied into a MemoryStream and the asset is abandoned. Every call to TryGetStream() leaks the underlying Skia stream object.","fix":"Wrap the asset in a using statement: using var asset = SKTypeface.OpenStream();","locations":[{"ref":"src/Skia/Avalonia.Skia/SkiaTypeface.cs:60-68","code":"   60 |                 var asset = SKTypeface.OpenStream();\n   61 |                 var size = asset.Length;\n   62 |                 var buffer = new byte[size];\n   63 | \n   64 |                 asset.Read(buffer, size);\n   65 | \n   66 |                 stream = new MemoryStream(buffer);\n   67 | \n   68 |                 return true;","lines":9,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Skia/Avalonia.Skia/SkiaTypeface.cs#L60-L68"}]},
{"id":"MEM_9","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"very_easy","description":"GetCompositionString calls ImmGetContext(Hwnd) but never calls ImmReleaseContext, leaking the IMM context handle on every call. Every composing keystroke calls this method, so the leak is continuous during active IME sessions.","fix":"Wrap the body of GetCompositionString in a try/finally: acquire himc with ImmGetContext, call ImmGetCompositionString in the try, and call ImmReleaseContext in the finally.","locations":[{"ref":"src/Windows/Avalonia.Win32/Input/Imm32InputMethod.cs:288-298","code":"  288 |         public string? GetCompositionString(GCS flag)\n  289 |         {\n  290 |             if (!IsComposing)\n  291 |             {\n  292 |                 return null;\n  293 |             }\n  294 | \n  295 |             var himc = ImmGetContext(Hwnd);\n  296 | \n  297 |             return ImmGetCompositionString(himc, flag);\n  298 |         }","lines":11,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Windows/Avalonia.Win32/Input/Imm32InputMethod.cs#L288-L298"}]},
{"id":"MEM_10","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"very_easy","description":"In ReadDataFromGdi and ReadDataFromHGlobal (CF_DIB path) and WriteDataToGdi, device contexts created with CreateCompatibleDC are freed with ReleaseDC instead of DeleteDC. ReleaseDC is only valid for DCs obtained from GetDC/GetWindowDC. Calling ReleaseDC on a compatible DC has no effect and leaks the GDI handle.","fix":"Replace all ReleaseDC calls on DCs created via CreateCompatibleDC with DeleteDC. Only the DCs obtained from GetDC(IntPtr.Zero) should use ReleaseDC.","locations":[{"ref":"src/Windows/Avalonia.Win32/OleDataObjectHelper.cs:158-167","code":"  158 |                     ReleaseDC(IntPtr.Zero, sourceHdc);\n  159 | \n  160 |                 if (srcCompatHdc != IntPtr.Zero)\n  161 |                     ReleaseDC(IntPtr.Zero, srcCompatHdc);\n  162 | \n  163 |                 if (compatDc != IntPtr.Zero)\n  164 |                     ReleaseDC(IntPtr.Zero, compatDc);\n  165 | \n  166 |                 if (destHdc != IntPtr.Zero)\n  167 |                     ReleaseDC(IntPtr.Zero, destHdc);","lines":10,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Windows/Avalonia.Win32/OleDataObjectHelper.cs#L158-L167"},{"ref":"src/Windows/Avalonia.Win32/OleDataObjectHelper.cs:250-258","code":"  250 |                     {\n  251 |                         if (section != IntPtr.Zero)\n  252 |                             DeleteObject(section);\n  253 | \n  254 |                         if (compatDc != IntPtr.Zero)\n  255 |                             ReleaseDC(IntPtr.Zero, compatDc);\n  256 | \n  257 |                         if (hdc != IntPtr.Zero)\n  258 |                             ReleaseDC(IntPtr.Zero, hdc);","lines":9,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Windows/Avalonia.Win32/OleDataObjectHelper.cs#L250-L258"},{"ref":"src/Windows/Avalonia.Win32/OleDataObjectHelper.cs:591-602","code":"  591 |                     {\n  592 |                         SelectObject(compatDc, IntPtr.Zero);\n  593 |                         SelectObject(desDc, IntPtr.Zero);\n  594 | \n  595 |                         if (desDc != IntPtr.Zero)\n  596 |                             ReleaseDC(IntPtr.Zero, desDc);\n  597 | \n  598 |                         if (compatDc != IntPtr.Zero)\n  599 |                             ReleaseDC(IntPtr.Zero, compatDc);\n  600 | \n  601 |                         if (hdc != IntPtr.Zero)\n  602 |                             ReleaseDC(IntPtr.Zero, hdc);","lines":12,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Windows/Avalonia.Win32/OleDataObjectHelper.cs#L591-L602"}]},
{"id":"MEM_11","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"very_easy","description":"In WriteDataToGdi the DIB section created by CreateDIBSection (stored in 'section') is never deleted in the finally block. On all code paths - success, BitBlt failure, or early DV_E_FORMATETC return - the finally block deselects section from compatDc but never calls DeleteObject(section), leaking the GDI bitmap handle.","fix":"Add 'if (section != IntPtr.Zero) DeleteObject(section);' to the finally block on line ~592, after the SelectObject(compatDc, IntPtr.Zero) call.","locations":[{"ref":"src/Windows/Avalonia.Win32/OleDataObjectHelper.cs:567-603","code":"  567 |                         section = CreateDIBSection(compatDc, bitmapInfoHeader, 0, out var lbBits, IntPtr.Zero, 0);\n  568 |                         if (section == IntPtr.Zero)\n  569 |                             return DV_E_FORMATETC;\n  570 | \n  571 |                         SelectObject(compatDc, section);\n  572 | \n  573 |                         Marshal.Copy(buffer, 0, lbBits, buffer.Length);\n  574 | \n  575 |                         hbitmap = CreateCompatibleBitmap(desDc, pixelSize.Width, pixelSize.Height);\n  576 | \n  577 |                         SelectObject(desDc, hbitmap);\n  578 | \n  579 |                         if (!BitBlt(desDc, 0, 0, pixelSize.Width, pixelSize.Height, compatDc, 0, 0, SRCCOPY))\n  580 |                         {\n  581 |                             return DV_E_FORMATETC;\n  582 |                         }\n  583 | \n  584 |                         hGlobalBitmap = hbitmap;\n  585 | \n  586 |                         GdiFlush();\n  587 | \n  588 |                         return (uint)HRESULT.S_OK;\n  589 |                     }\n  590 |                     finally\n  591 |                     {\n  592 |                         SelectObject(compatDc, IntPtr.Zero);\n  593 |                         SelectObject(desDc, IntPtr.Zero);\n  594 | \n  595 |                         if (desDc != IntPtr.Zero)\n  596 |                             ReleaseDC(IntPtr.Zero, desDc);\n  597 | \n  598 |                         if (compatDc != IntPtr.Zero)\n  599 |                             ReleaseDC(IntPtr.Zero, compatDc);\n  600 | \n  601 |                         if (hdc != IntPtr.Zero)\n  602 |                             ReleaseDC(IntPtr.Zero, hdc);\n  603 |                     }","lines":37,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Windows/Avalonia.Win32/OleDataObjectHelper.cs#L567-L603"}]},
{"id":"MEM_12","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"very_easy","description":"AngleExternalObjectsFeature.Dispose() releases _device but never releases _device1.\n_device1 is a QueryInterface result (a new COM reference) stored in a field, so it\nholds an AddRef'd reference to the underlying ID3D11Device1 COM object. Forgetting\nto Dispose it leaks that COM reference until GC collects it (non-deterministic).","fix":"Add `_device1.Dispose();` before `_device.Dispose();` in the Dispose() method.","locations":[{"ref":"src/Windows/Avalonia.Win32/OpenGl/Angle/AngleExternalObjectsFeature.cs:105-108","code":"  105 |     public void Dispose()\n  106 |     {\n  107 |         _device.Dispose();\n  108 |     }","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Windows/Avalonia.Win32/OpenGl/Angle/AngleExternalObjectsFeature.cs#L105-L108"}]},
{"id":"MEM_13","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"medium","description":"SwapChainGlRenderTarget.Dispose() calls base.Dispose(), disposes _surface and\n_renderTexture, but does NOT dispose the contextLock if BeginDrawCore is currently\nin flight and the context was made current. More concretely: when SwapChainGlSurface\nitself is disposed via DisposeSwapChain(), all render targets become orphaned and\ntheir underlying EGL surfaces / textures won't be released if Dispose() is called\nwhile no draw is active. The Dispose method disposes _surface and _renderTexture\nwithout first ensuring the context is current, which means the EGL surface backing\n_surface may not be fully cleaned up by the EGL driver. The EglSurface.Dispose() is\nsafe to call without current context since it calls eglDestroySurface, but the OpenGL\ntexture created by eglBindTexImage (in AngleExternalMemoryD3D11Texture2D) is not\ndeleted in this path.","fix":"In SwapChainGlRenderTarget.Dispose(), make the context current before disposing\n_surface and _renderTexture so the EGL driver can properly release any bound\ntextures. Call `using (Context.EnsureCurrent()) { _surface?.Dispose(); _renderTexture?.Dispose(); }`.","locations":[{"ref":"src/Windows/Avalonia.Win32/OpenGl/Angle/SwapChainGlSurface.cs:246-251","code":"  246 |     public override void Dispose()\n  247 |     {\n  248 |         base.Dispose();\n  249 |         _surface?.Dispose();\n  250 |         _renderTexture?.Dispose();\n  251 |     }","lines":6,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Windows/Avalonia.Win32/OpenGl/Angle/SwapChainGlSurface.cs#L246-L251"}]},
{"id":"MEM_14","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"medium","description":"In WglDisplay.CreateContext(), when no GL version succeeds (the foreach loop falls\nthrough without returning), the code calls WglGdiResourceManager.ReleaseDC and\nDestroyWindow at lines 161-162. However if the loop throws (e.g. the debug callback\ninstallation path throws via WglRestoreContext when context == 0), the HDC and HWND\nare leaked because the cleanup at lines 161-162 is only reached on normal exit from\nthe loop, not on exception. There is no try/finally guarding the window/dc cleanup.","fix":"Wrap the dc/window acquisition and the loop in a try/finally that always releases\ndc and destroys window if the method is about to exit without having returned a valid\nWglContext.","locations":[{"ref":"src/Windows/Avalonia.Win32/OpenGl/WglDisplay.cs:119-164","code":"  119 |                 var window = WglGdiResourceManager.CreateOffscreenWindow();\n  120 |                 var dc = WglGdiResourceManager.GetDC(window);\n  121 |                 SetPixelFormat(dc, _defaultPixelFormat, ref _defaultPfd);\n  122 |                 foreach (var version in versions)\n  123 |                 {\n  124 |                     if(version.Type != GlProfileType.OpenGL)\n  125 |                         continue;\n  126 |                     IntPtr context;\n  127 |                     using (shareContext?.Lock())\n  128 |                     {\n  129 |                         var profileMask = WGL_CONTEXT_CORE_PROFILE_BIT_ARB;\n  130 |                         if (version.IsCompatibilityProfile &&\n  131 |                             (version.Major > 3 || version.Major == 3 && version.Minor >= 2))\n  132 |                             profileMask = WGL_CONTEXT_COMPATIBILITY_PROFILE_BIT_ARB;\n  133 | \n  134 |                         context = s_wglCreateContextAttribsArb(dc, shareContext?.Handle ?? IntPtr.Zero,\n  135 |                             new[]\n  136 |                             {\n  137 |                                 // major\n  138 |                                 WGL_CONTEXT_MAJOR_VERSION_ARB, version.Major,\n  139 |                                 // minor\n  140 |                                 WGL_CONTEXT_MINOR_VERSION_ARB, version.Minor,\n  141 |                                 // core or compatibility profile\n  142 |                                 WGL_CONTEXT_PROFILE_MASK_ARB, profileMask,\n  143 |                                 // debug \n  144 |                                 // WGL_CONTEXT_FLAGS_ARB, 1,\n  145 |                                 // end\n  146 |                                 0, 0\n  147 |                             });\n  148 |                     }\n  149 | \n  150 |                     if (s_glDebugMessageCallback is not null)\n  151 |                     {\n  152 |                         using (new WglRestoreContext(dc, context, null))\n  153 |                             s_glDebugMessageCallback(Marshal.GetFunctionPointerForDelegate(_debugCallback), IntPtr.Zero);\n  154 |                     }\n  155 | \n  156 |                     if (context != IntPtr.Zero)\n  157 |                         return new WglContext(shareContext, version, context, window, dc,\n  158 |                             _defaultPixelFormat, _defaultPfd);\n  159 |                 }\n  160 | \n  161 |                 WglGdiResourceManager.ReleaseDC(window, dc);\n  162 |                 WglGdiResourceManager.DestroyWindow(window);\n  163 |                 return null;\n  164 |             }","lines":46,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Windows/Avalonia.Win32/OpenGl/WglDisplay.cs#L119-L164"}]},
{"id":"MEM_15","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"medium","description":"In WinUiCompositionUtils.GetParameterSource(), two COM objects are created\n(backDropParameter and backdropString HString) but neither is disposed before the\nmethod returns. The method returns backDropParameterAsSource (a QueryInterface result)\nand exposes handle as an out parameter, but the intermediate backDropParameter\n(ICompositionEffectSourceParameter) and the backdropString (HStringInterop) allocated\non the stack are leaked because HStringInterop is not in a using block and\nbackDropParameter is not disposed. The caller only has access to the derived\nIGraphicsEffectSource, so the original ICompositionEffectSourceParameter reference\ncount stays elevated permanently.","fix":"Wrap backdropString and backDropParameter in using statements inside GetParameterSource.\nNote that handle is returned to the caller so the HString lifetime must be managed by\nthe caller; the cleanest fix is to return an HStringInterop (IDisposable) and let the\ncaller own the lifetime rather than exposing a raw IntPtr handle.","locations":[{"ref":"src/Windows/Avalonia.Win32/WinRT/Composition/WinUiCompositionUtils.cs:167-176","code":"  167 |     private static IGraphicsEffectSource GetParameterSource(string name,\n  168 |         ICompositionEffectSourceParameterFactory backDropParameterFactory, out IntPtr handle)\n  169 |     {\n  170 |         var backdropString = new HStringInterop(name);\n  171 |         var backDropParameter =\n  172 |             backDropParameterFactory.Create(backdropString.Handle);\n  173 |         var backDropParameterAsSource = backDropParameter.QueryInterface<IGraphicsEffectSource>();\n  174 |         handle = backdropString.Handle;\n  175 |         return backDropParameterAsSource;\n  176 |     }","lines":10,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Windows/Avalonia.Win32/WinRT/Composition/WinUiCompositionUtils.cs#L167-L176"}]},
