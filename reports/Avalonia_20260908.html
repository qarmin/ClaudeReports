                  e.Accept(password.ToCharArray());\n   85 |                                     };\n   86 |                                 }\n   87 | \n   88 |                                 session.SetFramebufferSource(new HeadlessVncFramebufferSource(\n   89 |                                     session,\n   90 |                                     lt.MainWindow ??\n   91 |                                     throw new InvalidOperationException(\"MainWindow wasn't initialized\")));\n   92 |                                 session.Connect(client.GetStream(), options);\n   93 |                             }\n   94 |                             catch (Exception e)\n   95 |                             {\n   96 |                                 Logger.TryGet(LogEventLevel.Error, LogArea.VncPlatform)?.Log(tcpServer,\"Error accepting client:{Exception}\", e);\n   97 |                             }\n   98 |                             finally\n   99 |                             {\n  100 |                                 await Task.Delay(100);\n  101 |                             }\n  102 |                         }\n  103 |                     };","lines":38,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Headless/Avalonia.Headless.Vnc/HeadlessVncPlatformExtensions.cs#L66-L103"}]},
{"id":"MEM_55","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"DrmOutput allocates many unmanaged/graphics resources - EglDisplay, EglSurface, EglContext (all IDisposable), a GBM device and surface, and, when rotation is enabled, an FBO, texture, shader program, VBO and VAO - but the class implements no IDisposable/finalizer, so none of these are ever released. If a DrmOutput is created more than once (e.g. mode/monitor reconfiguration) the previous instance's GL and DRM resources leak.","fix":"Implement IDisposable on DrmOutput and dispose _eglSurface/_eglContext/_eglDisplay, delete the rotation GL objects (framebuffer, texture, program, buffer, vertex array), and release the GBM surface/device and DrmCard.","locations":[{"ref":"src/Linux/Avalonia.LinuxFramebuffer/Output/DrmOutput.cs:117-130","code":"  117 |         private GbmBoUserDataDestroyCallbackDelegate FbDestroyDelegate;\n  118 |         private drmModeModeInfo _mode;\n  119 |         private EglDisplay _eglDisplay;\n  120 |         private EglSurface _eglSurface;\n  121 |         private EglContext _deferredContext;\n  122 |         private IntPtr _currentBo;\n  123 |         private IntPtr _gbmTargetSurface;\n  124 |         private uint _crtcId;\n  125 |         private int _rotationFbo;\n  126 |         private int _rotationTexture;\n  127 |         private PixelSize _rotatedSize;\n  128 |         private int _rotationProgram;\n  129 |         private int _rotationVbo;\n  130 |         private int _rotationVao;","lines":14,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Linux/Avalonia.LinuxFramebuffer/Output/DrmOutput.cs#L117-L130"},{"ref":"src/Linux/Avalonia.LinuxFramebuffer/Output/DrmOutput.cs:212-227","code":"  212 |             _eglDisplay = new EglDisplay(\n  213 |                 new EglDisplayCreationOptions\n  214 |                 {\n  215 |                     Egl = new EglInterface(eglGetProcAddress),\n  216 |                     PlatformType = 0x31D7,\n  217 |                     PlatformDisplay = device,\n  218 |                     SupportsMultipleContexts = true,\n  219 |                     SupportsContextSharing = true\n  220 |                 });\n  221 | \n  222 |             var surface = _eglDisplay.EglInterface.CreateWindowSurface(_eglDisplay.Handle, _eglDisplay.Config, _gbmTargetSurface, new[] { EglConsts.EGL_NONE, EglConsts.EGL_NONE });\n  223 | \n  224 |             _eglSurface = new EglSurface(_eglDisplay, surface);\n  225 | \n  226 |             _deferredContext = _eglDisplay.CreateContext(null);\n  227 |             PlatformGraphics = new SharedContextGraphics(_deferredContext);","lines":16,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Linux/Avalonia.LinuxFramebuffer/Output/DrmOutput.cs#L212-L227"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"very_easy","description":"The touch pressure calculation `(float)t.Force / 2` (line 118) can return values\ngreater than 1.0. Apple Pencil and 3D Touch devices can report `UITouch.Force`\nvalues significantly above 1.0 (the typical maximum possible force is ~6.667 on\niPhones with 3D Touch). Dividing by 2 maps the *average* force (1.0) to Avalonia's\n0.5, which is the stated intent, but any force above 2.0 produces a Pressure value\noutside the [0, 1] range expected by Avalonia's pointer event model. Downstream\nconsumers that assume the value is normalized will misbehave.","fix":"Clamp the result to [0, 1]: `Pressure = t.MaximumPossibleForce == 0 ? 0.5f : Math.Clamp((float)t.Force / 2, 0f, 1f)`. Alternatively normalize via MaximumPossibleForce: `(float)(t.Force / t.MaximumPossibleForce) * 0.5f` which also clamps naturally.","locations":[{"ref":"src/iOS/Avalonia.iOS/InputHandler.cs:113-119","code":"  113 |             RawPointerPoint ToPointerPoint(UITouch touch) => new()\n  114 |             {\n  115 |                 Position = touch.LocationInView(_view).ToAvalonia(),\n  116 |                 // in iOS \"1.0 represents the force of an average touch\", when Avalonia expects 0.5 for \"average\".\n  117 |                 // If MaximumPossibleForce is 0, we ignore it completely.\n  118 |                 Pressure = t.MaximumPossibleForce == 0 ? 0.5f : (float)t.Force / 2\n  119 |             };","lines":7,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/iOS/Avalonia.iOS/InputHandler.cs#L113-L119"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"very_easy","description":"SwapChainGlRenderTarget.BeginDrawCore() calls _swapChain.ResizeBuffers with\n`(ushort)size.Width` and `(ushort)size.Height`. PixelSize fields are signed int.\nIf the window size exceeds 65535 pixels in either dimension (unlikely but possible\non multi-monitor high-DPI setups with virtual pixel coordinates), the cast silently\ntruncates, creating a swap chain with wrong dimensions.\n\nThe same issue exists in DxgiRenderTarget.BeginDrawCore() which casts\n`(ushort)(pClientRect.right - pClientRect.left)` and `(ushort)(pClientRect.bottom - pClientRect.top)`.","fix":"The DXGI ResizeBuffers signature takes UINT (uint) parameters. Use `(uint)size.Width`\ninstead of `(ushort)`. Add a guard that clamps or throws if dimensions exceed a\nreasonable maximum.","locations":[{"ref":"src/Windows/Avalonia.Win32/OpenGl/Angle/SwapChainGlSurface.cs:193-197","code":"  193 |                 _swapChain.ResizeBuffers(2,\n  194 |                     (ushort)size.Width,\n  195 |                     (ushort)size.Height,\n  196 |                     DXGI_FORMAT.DXGI_FORMAT_B8G8R8A8_UNORM,\n  197 |                     0);","lines":5,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Windows/Avalonia.Win32/OpenGl/Angle/SwapChainGlSurface.cs#L193-L197"},{"ref":"src/Windows/Avalonia.Win32/DirectX/DxgiRenderTarget.cs:108-113","code":"  108 |                     _swapChain.ResizeBuffers(2,\n  109 |                         (ushort)(pClientRect.right - pClientRect.left),\n  110 |                         (ushort)(pClientRect.bottom - pClientRect.top),\n  111 |                         DXGI_FORMAT.DXGI_FORMAT_B8G8R8A8_UNORM,\n  112 |                         (ushort)_flagsUsed\n  113 |                         );","lines":6,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Windows/Avalonia.Win32/DirectX/DxgiRenderTarget.cs#L108-L113"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"BitmapMemory computes its allocation size in 32-bit int arithmetic: RowBytes = 4 * ((size.Width * bytesPerPixel + 3) / 4) and _memorySize = RowBytes * size.Height. For large bitmaps (e.g. a 4-byte-per-pixel image around 30000x20000, ~2.4 GB) the RowBytes*Height product overflows Int32 and wraps to a negative or truncated value. The truncated size is then passed to Marshal.AllocHGlobal and GC.AddMemoryPressure, so a smaller-than-required buffer is allocated while callers (e.g. the Bitmap transcode path and PixelFormatTranscoder) write full-size rows into it, corrupting the heap. Reachable via the public Bitmap(PixelFormat,...) constructor's transcode branch and other BitmapMemory users when handling very large images.","fix":"Perform the size computation in 64-bit and guard before allocating:\n```csharp\nlong rowBytes = 4L * ((size.Width * (long)bytesPerPixel + 3) / 4);\nlong memorySize = rowBytes * size.Height;\nif (rowBytes > int.MaxValue || memorySize > int.MaxValue)\n    throw new ArgumentOutOfRangeException(nameof(size), \"Bitmap is too large.\");\nRowBytes = (int)rowBytes;\n_memorySize = (int)memorySize; // or store as long / nint\n```","locations":[{"ref":"src/Avalonia.Base/Media/Imaging/BitmapMemory.cs:18-24","code":"   18 |         var bytesPerPixel = (format.BitsPerPixel + 7) / 8;\n   19 |         \n   20 |         RowBytes =  4 * ((size.Width * bytesPerPixel + 3) / 4);\n   21 |         \n   22 |         _memorySize = RowBytes * size.Height;\n   23 |         Address = Marshal.AllocHGlobal(_memorySize);\n   24 |         GC.AddMemoryPressure(_memorySize);","lines":7,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Media/Imaging/BitmapMemory.cs#L18-L24"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"PixelFormatTranscoder.Transcode computes `pixelCount = srcSize.Width * srcSize.Height` and `bufferSize = pixelCount * sizeof(Rgba8888Pixel)` as 32-bit ints. For very large images the multiplications overflow: `bufferSize` can wrap negative/small while `pixelCount` stays large, so UnmanagedBlob is allocated too small and the subsequent `Span<Rgba8888Pixel>((void*)blob.Address, pixelCount)` reads/writes out of bounds (heap corruption). Dimensions are externally influenced (WriteableBitmap size with a transcoded pixel format).","fix":"Compute the counts as `long` (`long pixelCount = (long)srcSize.Width * srcSize.Height; long bufferSize = pixelCount * sizeof(Rgba8888Pixel);`) and validate against a sane maximum before allocating, or throw on overflow.","locations":[{"ref":"src/Avalonia.Base/Media/Imaging/PixelFormatTranscoder.cs:20-24","code":"   20 |         var pixelCount = srcSize.Width * srcSize.Height;\n   21 |         var bufferSize = pixelCount * sizeof(Rgba8888Pixel);\n   22 |         using var blob = new UnmanagedBlob(bufferSize);\n   23 |       \n   24 |         var pixels = new Span<Rgba8888Pixel>((void*)blob.Address, pixelCount);","lines":5,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Media/Imaging/PixelFormatTranscoder.cs#L20-L24"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"The WM_SIZE lParam HIWORD extraction at line 749 does not cast to (ushort) or use an unsigned shift. 'ToInt32(lParam) >> 16' performs an arithmetic (signed) right shift: if the HIWORD has its high bit set (window height > 32767 pixels), bit 31 of the int32 is set and the shift propagates the sign bit, yielding a negative height. The 'new Size(width, height)' constructor would then receive a negative value. DipFromLParam and PointFromLParam at lines 1416/1421 correctly use the '(short)' cast to handle negative screen coordinates, but the WM_SIZE path does not.","fix":"Change 'ToInt32(lParam) >> 16' to '(int)(uint)(ushort)(ToInt32(lParam) >> 16)' or equivalently '(ushort)((uint)ToInt32(lParam) >> 16)' to get an unsigned 16-bit window dimension.","locations":[{"ref":"src/Windows/Avalonia.Win32/WindowImpl.AppWndProc.cs:742","code":"  742 |                             var clientSize = new Size(ToInt32(lParam) & 0xffff, ToInt32(lParam) >> 16);","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Windows/Avalonia.Win32/WindowImpl.AppWndProc.cs#L742"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"PlatformBehaviorInhibition::SetInhibitAppSleep sets s_inhibitAppSleepHandle = nullptr to stop inhibition, but never calls endActivity:withReason: on NSProcessInfo. The system activity token is silently leaked and the inhibition never actually ends.","fix":"Call [[NSProcessInfo processInfo] endActivity:s_inhibitAppSleepHandle] before setting the handle to nullptr.","locations":[{"ref":"native/Avalonia.Native/src/OSX/PlatformBehaviorInhibition.mm:26-28","code":"   26 |             {\n   27 |                 s_inhibitAppSleepHandle = nullptr;\n   28 |             }","lines":3,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/native/Avalonia.Native/src/OSX/PlatformBehaviorInhibition.mm#L26-L28"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"TopLevelImpl::SetCursor does dynamic_cast<Cursor*>(cursor) without checking the result. If cursor is null or the wrong type, avnCursor is null and the immediately following avnCursor->GetNative() crashes.","fix":"Check avnCursor != nullptr after the cast. Return E_INVALIDARG or E_POINTER if null.","locations":[{"ref":"native/Avalonia.Native/src/OSX/TopLevelImpl.mm:93-97","code":"   93 |         Cursor *avnCursor = dynamic_cast<Cursor *>(cursor);\n   94 |         this->cursor = avnCursor->GetNative();\n   95 |         UpdateCursor();\n   96 | \n   97 |         if (avnCursor->IsHidden()) {","lines":5,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/native/Avalonia.Native/src/OSX/TopLevelImpl.mm#L93-L97"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"WindowBaseImpl::SetMainMenu unconditionally dereferences nativeMenu after a dynamic_cast that may return nullptr (if menu is not an AvnAppMenu). A caller passing a different IAvnMenu implementation causes a null pointer crash.","fix":"Check nativeMenu != nullptr after the cast and return E_INVALIDARG if it is null.","locations":[{"ref":"native/Avalonia.Native/src/OSX/WindowBaseImpl.mm:329-331","code":"  329 |     auto nativeMenu = dynamic_cast<AvnAppMenu *>(menu);\n  330 | \n  331 |     lastMenu = nativeMenu->GetNative();","lines":3,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/native/Avalonia.Native/src/OSX/WindowBaseImpl.mm#L329-L331"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"WindowBaseImpl::SetClientSize(NSSize size) ignores its parameter and always uses the member variable lastSize. Any caller that passes a value different from lastSize will silently get the wrong size applied. TopLevelImpl::SetClientSize is correct and passes the parameter through, but the WindowBase override breaks this contract.","fix":"Change the implementation to: [Window setContentSize:size];","locations":[{"ref":"native/Avalonia.Native/src/OSX/WindowBaseImpl.mm:455-457","code":"  455 | void WindowBaseImpl::SetClientSize(NSSize size){\n  456 |     [Window setContentSize:lastSize];\n  457 | }","lines":3,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/native/Avalonia.Native/src/OSX/WindowBaseImpl.mm#L455-L457"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"GetIOKitRegistryId in AvnGlContext queries the registry ID of renderer index 0 instead of the matched renderer index i. The loop iterates over renderers to find one whose kCGLRPRendererID matches the current renderer, but then calls CGLDescribeRenderer(rendererInfo, 0, ...) instead of CGLDescribeRenderer(rendererInfo, i, ...) to retrieve kCGLRPRegistryIDLow and kCGLRPRegistryIDHigh. This always returns the registry ID of the first renderer, breaking GPU matching on multi-GPU systems.","fix":"Replace both CGLDescribeRenderer(rendererInfo, 0, ...) calls with CGLDescribeRenderer(rendererInfo, i, ...) so the registry ID is read from the matched renderer.","locations":[{"ref":"native/Avalonia.Native/src/OSX/cgl.mm:142-146","code":"  142 |                         if(CGLDescribeRenderer(rendererInfo, 0, kCGLRPRegistryIDLow, &gpuIDLow))\n  143 |                             return false;\n  144 |                         \n  145 |                         if(CGLDescribeRenderer(rendererInfo, 0, kCGLRPRegistryIDHigh, &gpuIDHigh))\n  146 |                             return false;","lines":5,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/native/Avalonia.Native/src/OSX/cgl.mm#L142-L146"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"SetServicesMenu unconditionally calls nativeMenu->GetNative() without checking whether the dynamic_cast succeeded (i.e., without checking whether nativeMenu is null). If menu points to an object that is not an AvnAppMenu, or if menu is nullptr, dynamic_cast returns nullptr and GetNative() is called on a null pointer, causing a crash.","fix":"Add a null check after the dynamic_cast: if (nativeMenu == nullptr) return; before calling GetNative().","locations":[{"ref":"native/Avalonia.Native/src/OSX/menu.mm:534-538","code":"  534 | extern void SetServicesMenu (IAvnMenu* menu)\n  535 | {\n  536 |     auto nativeMenu = dynamic_cast<AvnAppMenu*>(menu);\n  537 |     [NSApplication sharedApplication].servicesMenu = nativeMenu->GetNative();\n  538 | }","lines":5,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/native/Avalonia.Native/src/OSX/menu.mm#L534-L538"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"ChoreographerTimer.RenderLoop() is an infinite loop that blocks forever on _event.WaitOne() with no cancellation path. There is no way to stop this thread when the timer or the app is torn down: the thread will keep the process alive after all UI activity ends, and will invoke _tick after it has been nulled-out or after the compositor has been disposed.","fix":"Add a CancellationTokenSource; use _event.WaitOne(timeout) or a ManualResetEventSlim with cancellation support, and break the loop when cancellation is requested during Dispose().","locations":[{"ref":"src/Android/Avalonia.Android/ChoreographerTimer.cs:57-68","code":"   57 |         {\n   58 |             while (true)\n   59 |             {\n   60 |                 _event.WaitOne();\n   61 |                 long time;\n   62 |                 lock (_lock)\n   63 |                 {\n   64 |                     time = _lastTime;\n   65 |                 }\n   66 |                 _tick?.Invoke(TimeSpan.FromTicks(time / 100));\n   67 |             }\n   68 |         }","lines":12,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Android/Avalonia.Android/ChoreographerTimer.cs#L57-L68"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"RadiansToDegree constant is computed as 180*PI instead of 180/PI. The formula to convert radians to degrees is degrees = radians * (180 / PI), but the constant is set to 180 * PI (~565.49), so all orientation/twist values reported for touch and pen events are wildly wrong.","fix":"Change the constant to: private const float RadiansToDegree = (float)(180.0 / Math.PI);","locations":[{"ref":"src/Android/Avalonia.Android/Platform/Specific/Helpers/AndroidMotionEventsHelper.cs:16","code":"   16 |         private const float RadiansToDegree = (float)(180f * Math.PI);","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Android/Avalonia.Android/Platform/Specific/Helpers/AndroidMotionEventsHelper.cs#L16"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`DrawingImage.IImage.Draw` builds the render transform as `translate * scale`, where the `translate` vector already includes the destination-rect origin (`-sourceRect.X + destRect.X - bounds.X`). Avalonia matrices use row-vector semantics (`p * M`, translation in M31/M32), so `translate * scale` applies the translation first and then scales it — i.e. `screen = (p + translate) * scale`. That means `destRect.X`/`destRect.Y` get multiplied by the scale factor, which is wrong: the destination origin must be added AFTER scaling. The bug is invisible when `destRect` starts at (0,0) or when scale == 1, but it mis-positions (and, because of the `PushClip(destRect)`, partially clips) the drawing whenever the image is both scaled and centered/letterboxed. This is reachable from the standard `Image` control: e.g. a 24x24 `DrawingImage` in a 96x48 container with the default `Stretch=Uniform` produces `destRect=(24,0,48,48)` and `scale=2`, so content that should start at x=24 is drawn at x=48 and clipped.","fix":"Apply the destination-rect translation after the scale instead of folding it into the pre-scale translate:\n```\nvar scale = Matrix.CreateScale(\n    destRect.Width / sourceRect.Width,\n    destRect.Height / sourceRect.Height);\nvar matrix =\n    Matrix.CreateTranslation(-sourceRect.X - bounds.X, -sourceRect.Y - bounds.Y)\n    * scale\n    * Matrix.CreateTranslation(destRect.X, destRect.Y);\n\nusing (context.PushClip(destRect))\nusing (context.PushTransform(matrix))\n{\n    drawing.Draw(context);\n}\n```","locations":[{"ref":"src/Avalonia.Base/Media/DrawingImage.cs:82-90","code":"   82 |             var scale = Matrix.CreateScale(\n   83 |                 destRect.Width / sourceRect.Width,\n   84 |                 destRect.Height / sourceRect.Height);\n   85 |             var translate = Matrix.CreateTranslation(\n   86 |                 -sourceRect.X + destRect.X - bounds.X,\n   87 |                 -sourceRect.Y + destRect.Y - bounds.Y);\n   88 | \n   89 |             using (context.PushClip(destRect))\n   90 |             using (context.PushTransform(translate * scale))","lines":9,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Media/DrawingImage.cs#L82-L90"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`StorageBookmarkHelper.TryDecodeBookmark` uses `&&` where it must use `||` when validating the decoded bookmark header. The intent (per the comment) is to reject the bookmark if it is too short OR does not start with the `ava.v1.` prefix. As written the guard only triggers when BOTH are true, which has two consequences:\n1. Broken validation: a decoded bookmark of length >= 16 with the WRONG prefix passes the guard (first operand false) and is treated as a valid Avalonia bookmark.\n2. Reachable crash: when the decoded bookmark is shorter than `AvaHeaderPrefix.Length` (7 bytes), the first operand is true so the right operand `decodedBookmark.Slice(0, 7)` is evaluated on a span shorter than 7 bytes, throwing `ArgumentOutOfRangeException`. `TryDecodeBookmark` is called with user-supplied bookmark strings from public APIs such as `IStorageProvider.OpenFileBookmarkAsync`; e.g. `AndroidStorageProvider.OpenFileBookmarkAsync` -> `DecodeUriFromBookmark` calls it without a try/catch, so a bookmark like base64 \"AAAA\" (3 decoded bytes) crashes instead of returning `InvalidFormat`.","fix":"Change the `&&` to `||` so the short-length check short-circuits before the slice and a wrong prefix is also rejected:\n```csharp\nif (decodedBookmark.Length < HeaderLength\n    // Check if decoded string starts with the correct prefix, checking v1 at the same time.\n    || !AvaHeaderPrefix.SequenceEqual(decodedBookmark.Slice(0, AvaHeaderPrefix.Length)))\n{\n    nativeBookmark = null;\n    return DecodeResult.InvalidFormat;\n}\n```","locations":[{"ref":"src/Avalonia.Base/Platform/Storage/FileIO/StorageBookmarkHelper.cs:102-108","code":"  102 |             if (decodedBookmark.Length < HeaderLength\n  103 |                 // Check if decoded string starts with the correct prefix, checking v1 at the same time.\n  104 |                 && !AvaHeaderPrefix.SequenceEqual(decodedBookmark.Slice(0, AvaHeaderPrefix.Length)))\n  105 |             {\n  106 |                 nativeBookmark = null;\n  107 |                 return DecodeResult.InvalidFormat;\n  108 |             }","lines":7,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Platform/Storage/FileIO/StorageBookmarkHelper.cs#L102-L108"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"`ServerResourceHelperExtensions.GetServer(this ITransform?, Compositor?)` calls `resource.GetForCompositor(compositor)` but throws the result away (no `return`), then unconditionally returns a fresh `new ImmutableTransform(transform.Value)` snapshot. The two sibling overloads for `IBrush` and `IPen` both correctly `return resource.GetForCompositor(compositor)`. This method is the one used by `Brush.SerializeChanges` (`Transform.GetServer(c)` at Media/Brush.cs:140), so a brush's server-side transform is always a static value snapshot instead of the live `ServerCompositionSimpleTransform` resource that `OnReferencedFromCompositor` addref'd. Composition-driven / animated brush transforms therefore never update on the render thread.","fix":"Add the missing `return`:\n```csharp\nif (transform is ICompositionRenderResource<ITransform> resource)\n    return resource.GetForCompositor(compositor);\nreturn new ImmutableTransform(transform.Value);\n```","locations":[{"ref":"src/Avalonia.Base/Rendering/Composition/Drawing/ServerResourceHelperExtensions.cs:57-68","code":"   57 |     public static ITransform? GetServer(this ITransform? transform, Compositor? compositor)\n   58 |     {\n   59 |         if (compositor == null)\n   60 |             return transform;\n   61 |         if (transform == null)\n   62 |             return null;\n   63 |         if (transform is ImmutableTransform immutable)\n   64 |             return immutable;\n   65 |         if (transform is ICompositionRenderResource<ITransform> resource)\n   66 |             resource.GetForCompositor(compositor);\n   67 |         return new ImmutableTransform(transform.Value);\n   68 |     }","lines":12,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Rendering/Composition/Drawing/ServerResourceHelperExtensions.cs#L57-L68"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`InlineDictionary<TKey,TValue>.TryGetAndRemoveValue` returns the wrong result once the dictionary has been upgraded to a backing `Dictionary` (i.e. more than 6 distinct keys). In the `Dictionary` branch it removes the key but then falls through to `value = default; return false;`, so it reports failure even though the entry was found and removed. The single-element and small-array branches correctly return `true`. Reachable callers rely on the return value: `VisualBrush`/`DrawingBrush.OnUnreferencedFromCompositor` (`if (_renderDataDictionary.TryGetAndRemoveValue(c, out var content)) content?.Dispose();`) will silently skip disposing render data (resource/memory leak), and `ServerObjectAnimations.RemoveAnimationForProperty` will skip `animation.Animation.Deactivate()`, leaving animations running. `InlineDictionary.GetAndRemove` (built on this method) will even throw `KeyNotFoundException` for a key it just removed.","fix":"Return the actual result of the dictionary removal:\n```csharp\nelse if (_data is Dictionary<TKey, TValue?> dic)\n    return dic.Remove(key, out value);\n\nvalue = default;\nreturn false;\n```","locations":[{"ref":"src/Avalonia.Base/Utilities/SmallDictionary.cs:290-297","code":"  290 |         else if (_data is Dictionary<TKey, TValue?> dic)\n  291 |         {\n  292 |             if (!dic.Remove(key, out value))\n  293 |                 return false;\n  294 |         }\n  295 | \n  296 |         value = default;\n  297 |         return false;","lines":8,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Utilities/SmallDictionary.cs#L290-L297"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`AlignHorizontalCenterWithProperty` is registered with the wrong `RegisterAttached` overload. It uses `RegisterAttached<Layoutable, object>(\"AlignHorizontalCenterWith\", typeof(object), typeof(RelativePanel))`, whose signature is `(string name, Type ownerType, TValue defaultValue = ...)`. This means `ownerType` is set to `typeof(object)` (instead of `RelativePanel`) and the default value is set to `typeof(RelativePanel)` (a `Type` object) instead of the intended `null`. Every sibling object-typed property (e.g. `AboveProperty`, `AlignBottomWithProperty`) correctly passes `typeof(RelativePanel)` as the owner and leaves the default null. As a result the property is registered under the wrong owner type (breaking XAML resolution of `RelativePanel.AlignHorizontalCenterWith`) and its default value is a bogus non-null `Type` instead of null.","fix":"Register it the same way as the other object properties, e.g.:\n```csharp\npublic static readonly AttachedProperty<object> AlignHorizontalCenterWithProperty =\n    AvaloniaProperty.RegisterAttached<Layoutable, object>(\"AlignHorizontalCenterWith\", typeof(RelativePanel));\n```\nor use the three-generic form `RegisterAttached<RelativePanel, Layoutable, object>(\"AlignHorizontalCenterWith\")`.","locations":[{"ref":"src/Avalonia.Controls/RelativePanel.AttachedProperties.cs:191-192","code":"  191 |         public static readonly AttachedProperty<object> AlignHorizontalCenterWithProperty =\n  192 |             AvaloniaProperty.RegisterAttached<Layoutable, object>(\"AlignHorizontalCenterWith\", typeof(object), typeof(RelativePanel));","lines":2,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/RelativePanel.AttachedProperties.cs#L191-L192"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"DispatchQueueOrWakeup calls Queue.PrepareRead() but dispatches queue.DispatchPending() where 'queue' is the parameter and 'Queue' is the field. When the method is called with connection.Queue as the queue argument (which is the only public caller in WaylandWorker), they are identical, so this is a latent bug. However the public overload DispatchQueueOrWakeup(int wakeupFd) exists and forwards to the two-argument version with queue=Queue, while the two-argument public method signature accepts any queue. If any future caller passes a different event queue (e.g. a temporary per-object queue used in CreateParams roundtrip), PrepareRead races on Queue but pending events are dispatched on the wrong queue, corrupting protocol state.","fix":"Make DispatchQueueOrWakeup always use Queue for both PrepareRead and DispatchPending, or assert that queue == Queue. The two-argument overload is not needed outside WaylandDmaBufSurface's temporary roundtrip — that roundtrip uses a separate tempQueue.Roundtrip() call already, so the public overload should just operate on the primary Queue.","locations":[{"ref":"src/Avalonia.Wayland/Server/Interop/WaylandConnection.cs:126-174","code":"  126 |     public unsafe DispatchResult DispatchQueueOrWakeup(WlEventQueue queue, int wakeupFd)\n  127 |     {\n  128 |         // This initiates the race of sorts for who will have to use the wayland socket\n  129 |         if (Queue.PrepareRead() == -1)\n  130 |         {\n  131 |             // Other thread has won the race and read from the display, we can safely dispatch pending events\n  132 |             queue.DispatchPending();\n  133 |             return DispatchResult.Dispatched;\n  134 |         }\n  135 |         \n  136 |         // We won the race and are now responsible to drive libwayland's flush/poll/read cycle\n  137 |         \n  138 |         \n  139 |         // First flush any pending data to the compositor\n  140 |         if (!FlushDisplay(out var flushError))\n  141 |         {\n  142 |             // If somebody wants to read errors they should call Display.Dispatch() \n  143 |             Display.CancelRead();\n  144 |             if (ClassifyErrorOrThrow(flushError, out var dispatchResult))\n  145 |                 return dispatchResult;\n  146 |             \n  147 |             throw new AvaloniaWaylandFlushException(flushError);\n  148 |         }\n  149 | \n  150 | \n  151 |         Span<pollfd> fds = stackalloc pollfd[]\n  152 |         {\n  153 |             new pollfd() { fd = _fd, events = PollEvents.POLLIN },\n  154 |             new pollfd() { fd = wakeupFd, events = PollEvents.POLLIN },\n  155 |         };\n  156 |         DoPoll(fds);\n  157 | \n  158 |         if (fds[0].revents == default)\n  159 |         {\n  160 |             // ppoll got woken up by the wakeup fd\n  161 |             Display.CancelRead();\n  162 |             return DispatchResult.Wakeup;\n  163 |         }\n  164 | \n  165 |         // Actual read call\n  166 |         if(Display.ReadEvents() == -1)\n  167 |         {\n  168 |             var errno = (Errno)Marshal.GetLastPInvokeError();\n  169 |             if (ClassifyErrorOrThrow(errno, out var dispatchResult))\n  170 |                 return dispatchResult;\n  171 |             throw new AvaloniaWaylandReadException(errno);\n  172 |         }\n  173 | \n  174 |         Queue.DispatchPending();","lines":49,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Wayland/Server/Interop/WaylandConnection.cs#L126-L174"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"wl_data_offer.finish() is unconditionally called after a Drop event regardless of whether the drop was accepted. The Wayland protocol (wl_data_offer.finish request description) explicitly requires that finish is only called when the drop destination accepted the transfer. Calling finish after a rejected drop (where UpdateDndFeedback posted DragDropEffects.None) triggers a protocol error on strict compositors (the spec says 'illegal request' if the client calls finish when no action was accepted).","fix":"Check the drop event's Effects before calling PostFinish. Only call PostFinish when dragEvent.Effects != DragDropEffects.None. When effects are None (rejected), call a PostCancel (or just let the pending offer be destroyed without finish) so the source learns the transfer was declined without a protocol error.","locations":[{"ref":"src/Avalonia.Wayland/WindowImplBase.DragDrop.cs:66-69","code":"   66 |             else if (dragEvent.Type is RawDragEventType.Drop)\n   67 |             {\n   68 |                 dragEvent.OfferCookie?.PostFinish();\n   69 |             }","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Wayland/WindowImplBase.DragDrop.cs#L66-L69"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"XRRGetOutputProperty parameter names are swapped in GetPhysicalMonitorSizeFromEDID. The P/Invoke signature is 'out int nitems, out long bytes_after' but the call site passes 'out int bytesAfter, out _', mapping the variable named 'bytesAfter' to the 'nitems' output position and silently discarding the real 'bytes_after'. The subsequent 'new byte[bytesAfter]' and 'Marshal.Copy(..., bytesAfter)' therefore use 'nitems' (number of 8-bit items returned) instead of 'bytes_after' (remaining unread bytes). In the common case where all 128 EDID bytes are returned in a single call, nitems == 128 and bytes_after == 0, so the result is accidentally correct. If the EDID is larger or the X server splits the response (bytes_after > 0), the code reads the wrong number of bytes and the truncated remaining data is silently ignored.","fix":"Add the nitems out parameter explicitly: 'out IntPtr actualType, out int actualFormat, out int nitems, out long bytesAfter, out IntPtr prop'. Then size the array from nitems (total items already read) and verify bytesAfter == 0 before assuming the full EDID is present.","locations":[{"ref":"src/Avalonia.X11/Screens/X11Screen.Providers.cs:299-308","code":"  299 |             XRRGetOutputProperty(_x11.Display, rrOutput, _x11.Atoms.EDID, 0, EDIDStructureLength, false, false,\n  300 |                 AnyPropertyType, out IntPtr actualType, out int actualFormat, out int bytesAfter, out _,\n  301 |                 out IntPtr prop);\n  302 |             if (actualType != _x11.Atoms.INTEGER)\n  303 |                 return null;\n  304 |             if (actualFormat != 8) // Expecting an byte array\n  305 |                 return null;\n  306 | \n  307 |             var edid = new byte[bytesAfter];\n  308 |             Marshal.Copy(prop, edid, 0, bytesAfter);","lines":10,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.X11/Screens/X11Screen.Providers.cs#L299-L308"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"The coalesced-points loop mixes two different units in its bounds. `pointsCount` is the number of points (array length / 6), but the loop counter `i` is used both as the loop bound (`i < pointsCount - 1`) and as a raw index into `pointsProps` that advances by `itemsPerPoint` (6) each iteration. Because the step is 6 while the limit is a point count, only about `(pointsCount-1)/6` points are ever emitted instead of `pointsCount-1`. For any pointer move with more than a couple of coalesced points, most intermediate points are silently dropped, degrading input fidelity (e.g. inking/drawing). Additionally, if `GetCoalescedEvents` ever returns an empty array, `Capacity = pointsCount - 1` becomes -1 and throws `ArgumentOutOfRangeException`.","fix":"Separate the point count from the flat-array offset. Iterate over point offsets directly:\n```csharp\nvar pointsCount = pointsProps.Length / itemsPerPoint;\nif (pointsCount <= 1)\n    return s_intermediatePointsPooledList;\ns_intermediatePointsPooledList.Capacity = pointsCount - 1;\n\n// Skip the last one, as it is already processed point.\nfor (var i = 0; i < (pointsCount - 1) * itemsPerPoint; i += itemsPerPoint)\n{\n    s_intermediatePointsPooledList.Add(CreateRawPointer(\n        pointsProps[i], pointsProps[i + 1],\n        pointsProps[i + 2], pointsProps[i + 3],\n        pointsProps[i + 4], pointsProps[i + 5]));\n}\n```","locations":[{"ref":"src/Browser/Avalonia.Browser/BrowserInputHandler.cs:90-100","code":"   90 |                 var pointsCount = pointsProps.Length / itemsPerPoint;\n   91 |                 s_intermediatePointsPooledList.Capacity = pointsCount - 1;\n   92 | \n   93 |                 // Skip the last one, as it is already processed point.\n   94 |                 for (var i = 0; i < pointsCount - 1; i += itemsPerPoint)\n   95 |                 {\n   96 |                     s_intermediatePointsPooledList.Add(CreateRawPointer(\n   97 |                         pointsProps[i], pointsProps[i + 1],\n   98 |                         pointsProps[i + 2], pointsProps[i + 3],\n   99 |                         pointsProps[i + 4], pointsProps[i + 5]));\n  100 |                 }","lines":11,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Browser/Avalonia.Browser/BrowserInputHandler.cs#L90-L100"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In the LibInput pointer handler, the right and middle button states are decoded incorrectly. `libinput_event_pointer_get_button_state` only ever returns 0 (released) or 1 (pressed), yet the code maps `BTN_RIGHT when buttonState == 1` to `RightButtonUp` (should be Down) and gates the real Down handler on `buttonState == 2`, which never occurs. Same mistake for `BTN_MIDDLE` where the `MiddleButtonUp` branch is guarded by the impossible `buttonState == 2`. As a result, right-clicks are reported as button-up (Down/Up inverted and never balanced) and neither right nor middle button releases are ever delivered, breaking context menus and middle-button interactions on the Linux framebuffer backend.","fix":"Mirror the LEFT handling: use `buttonState == 1` for Down and `buttonState == 0` for Up for both RIGHT and MIDDLE.\n```csharp\nEvKey.BTN_RIGHT when buttonState == 1\n    => new(_mouse, ts, InputRoot, RawPointerEventType.RightButtonDown, _mousePosition, modifiers),\nEvKey.BTN_RIGHT when buttonState == 0\n    => new(_mouse, ts, InputRoot, RawPointerEventType.RightButtonUp, _mousePosition, modifiers),\nEvKey.BTN_MIDDLE when buttonState == 1\n    => new(_mouse, ts, InputRoot, RawPointerEventType.MiddleButtonDown, _mousePosition, modifiers),\nEvKey.BTN_MIDDLE when buttonState == 0\n    => new(_mouse, ts, InputRoot, RawPointerEventType.MiddleButtonUp, _mousePosition, modifiers),\n```","locations":[{"ref":"src/Linux/Avalonia.LinuxFramebuffer/Input/LibInput/LibInputBackend.Pointer.cs:40-47","code":"   40 |                         EvKey.BTN_RIGHT when buttonState == 1\n   41 |                             => new(_mouse, ts, InputRoot, RawPointerEventType.RightButtonUp, _mousePosition, modifiers),\n   42 |                         EvKey.BTN_RIGHT when buttonState == 2\n   43 |                             => new(_mouse, ts, InputRoot, RawPointerEventType.RightButtonDown, _mousePosition, modifiers),\n   44 |                         EvKey.BTN_MIDDLE when buttonState == 1\n   45 |                             => new(_mouse, ts, InputRoot, RawPointerEventType.MiddleButtonDown, _mousePosition, modifiers),\n   46 |                         EvKey.BTN_MIDDLE when buttonState == 2\n   47 |                             => new(_mouse, ts, InputRoot, RawPointerEventType.MiddleButtonUp, _mousePosition, modifiers),","lines":8,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Linux/Avalonia.LinuxFramebuffer/Input/LibInput/LibInputBackend.Pointer.cs#L40-L47"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"The container-query builder mishandles the `and` combinator. When a query contains `and` but no comma (`,`/Or), the accumulated `andNode` is silently discarded: after the loop the method returns `results ?? result ?? initialNode`, and since `results` is null (no Or seen) it returns `result`, which holds only the LAST parsed sub-query. For example `min-width:100 and min-height:200` compiles to just the height condition, dropping the width condition entirely. Additionally, for chains of three or more (`A and B and C`) the middle query is added twice: the `AndSyntax` case calls `andNode.Add(result)` and the post-switch block `if (andNode != null && result != initialNode) andNode.Add(result)` adds the same node again, producing a duplicated sub-query. `andNode` is a local of `Create`, so nothing downstream recovers it.","fix":"Fold any open `andNode` into the final result before returning, and avoid the double-add. For example, after the loop:\n```csharp\nvar final = andNode ?? result;\nif (results != null)\n{\n    results.Add(final);\n    return results;\n}\nreturn final;\n```\nand drop the redundant `andNode.Add(result)` in the `AndSyntax` case (or the post-switch `andNode.Add(result)`) so each sub-query is added exactly once.","locations":[{"ref":"src/Markup/Avalonia.Markup.Xaml.Loader/CompilerExtensions/Transformers/AvaloniaXamlIlQueryTransformer.cs:46-92","code":"   46 |             XamlIlQueryNode Create(IEnumerable<ISyntax> syntax)\n   47 |             {\n   48 |                 XamlIlQueryNode result = initialNode;\n   49 |                 XamlIlOrQueryNode? results = null;\n   50 |                 XamlIlAndQueryNode? andNode = null;\n   51 |                 foreach (var i in syntax)\n   52 |                 {\n   53 |                     switch (i)\n   54 |                     {\n   55 |                         case ContainerQueryGrammar.WidthSyntax width:\n   56 |                             result = new XamlIlWidthQuery(result, width);\n   57 |                             break;\n   58 |                         case ContainerQueryGrammar.HeightSyntax height:\n   59 |                             result = new XamlIlHeightQuery(result, height);\n   60 |                             break;\n   61 |                         case ContainerQueryGrammar.OrSyntax or:\n   62 |                             if (results == null)\n   63 |                                 results = new XamlIlOrQueryNode(node, queryType);\n   64 |                             if (andNode != null && result == initialNode)\n   65 |                                 throw new XamlParseException($\"Previously opened And node is not closed.\", node);\n   66 |                             results.Add(andNode ?? result);\n   67 |                             result = initialNode;\n   68 |                             andNode = null;\n   69 |                             break;\n   70 |                         case ContainerQueryGrammar.AndSyntax and:\n   71 |                             if (andNode == null)\n   72 |                                 andNode = new XamlIlAndQueryNode(node, queryType);\n   73 |                             andNode.Add(result);\n   74 |                             result = initialNode;\n   75 |                             break;\n   76 |                         default:\n   77 |                             throw new XamlParseException($\"Unsupported query grammar '{i.GetType()}'.\", node);\n   78 |                     }\n   79 | \n   80 |                     if (andNode != null && result != initialNode)\n   81 |                     {\n   82 |                         andNode.Add(result);\n   83 |                     }\n   84 |                 }\n   85 | \n   86 |                 if (results != null && result != null)\n   87 |                 {\n   88 |                     results.Add(result);\n   89 |                 }\n   90 | \n   91 |                 return results ?? result ?? initialNode;\n   92 |             }","lines":47,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Markup/Avalonia.Markup.Xaml.Loader/CompilerExtensions/Transformers/AvaloniaXamlIlQueryTransformer.cs#L46-L92"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"ContainerQueryParser.Create treats `AndSyntax` and `OrSyntax` identically: both fall into the same switch arm that appends the current query to `results` and resets `result`, and at the end everything is combined with `StyleQueries.Or`. The distinct `StyleQueries.And` API is never used. A container query like `min-width:100 and max-width:200` is therefore compiled as `Or(width>=100, width<=200)`, which matches when *either* bound holds instead of *both* - the exact opposite of the intended range semantics. `and` is the most common way to express a size range in container queries, so this silently breaks a core feature.","fix":"Track the combining operator per boundary instead of flattening everything into one OR. E.g. keep separate lists / a small combinator tree so that `AndSyntax` produces `StyleQueries.And(...)` and `OrSyntax` produces `StyleQueries.Or(...)`, honoring standard CSS precedence (`and` binds tighter than `,`).","locations":[{"ref":"src/Markup/Avalonia.Markup/Markup/Parsers/ContainerQueryParser.cs:49-71","code":"   49 |                     case ContainerQueryGrammar.OrSyntax or:\n   50 |                     case ContainerQueryGrammar.AndSyntax and:\n   51 |                         if (results == null)\n   52 |                         {\n   53 |                             results = new List<StyleQuery>();\n   54 |                         }\n   55 | \n   56 |                         results.Add(result ?? throw new NotSupportedException(\"Invalid query!\"));\n   57 |                         result = null;\n   58 |                         break;\n   59 |                     default:\n   60 |                         throw new NotSupportedException($\"Unsupported selector grammar '{i.GetType()}'.\");\n   61 |                 }\n   62 |             }\n   63 | \n   64 |             if (results != null)\n   65 |             {\n   66 |                 if (result != null)\n   67 |                 {\n   68 |                     results.Add(result);\n   69 |                 }\n   70 | \n   71 |                 result = results.Count > 1 ? StyleQueries.Or(results) : results[0];","lines":23,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Markup/Avalonia.Markup/Markup/Parsers/ContainerQueryParser.cs#L49-L71"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In DrawingContextImpl.DrawRectangle() for outset box shadows (lines 435-474), Transform is mutated to apply the shadow offset and then restored manually. If an exception occurs between the Transform assignment (line 455 or 467) and the manual restore (line 457 or 469), the transform is left in the shadow-offset state, permanently shifting all subsequent drawing. No try/finally is used.","fix":"Use try/finally to restore the transform: var oldTransform = Transform; try { Transform = ...; ... } finally { Transform = oldTransform; }","locations":[{"ref":"src/Skia/Avalonia.Skia/DrawingContextImpl.cs:435-475","code":"  435 |             foreach (var boxShadow in boxShadows)\n  436 |             {\n  437 |                 if (boxShadow != default && !boxShadow.IsInset)\n  438 |                 {\n  439 |                     using (var shadow = BoxShadowFilter.Create(_boxShadowPaint, boxShadow, _currentOpacity))\n  440 |                     {\n  441 |                         var spread = (float)boxShadow.Spread;\n  442 |                         if (boxShadow.IsInset)\n  443 |                             spread = -spread;\n  444 | \n  445 |                         Canvas.Save();\n  446 |                         if (isRounded)\n  447 |                         {\n  448 |                             var shadowRect = SKRoundRectCache.Shared.GetAndSetRadii(skRoundRect!.Rect, skRoundRect.Radii);\n  449 |                             if (spread != 0)\n  450 |                                 shadowRect.Inflate(spread, spread);\n  451 |                             Canvas.ClipRoundRect(skRoundRect,\n  452 |                                 shadow.ClipOperation, true);\n  453 |                             \n  454 |                             var oldTransform = Transform;\n  455 |                             Transform = oldTransform * Matrix.CreateTranslation(boxShadow.OffsetX, boxShadow.OffsetY);\n  456 |                             Canvas.DrawRoundRect(shadowRect, shadow.Paint);\n  457 |                             Transform = oldTransform;\n  458 |                             SKRoundRectCache.Shared.Return(shadowRect);\n  459 |                         }\n  460 |                         else\n  461 |                         {\n  462 |                             var shadowRect = rc;\n  463 |                             if (spread != 0)\n  464 |                                 shadowRect.Inflate(spread, spread);\n  465 |                             Canvas.ClipRect(rc, shadow.ClipOperation);\n  466 |                             var oldTransform = Transform;\n  467 |                             Transform = oldTransform * Matrix.CreateTranslation(boxShadow.OffsetX, boxShadow.OffsetY);\n  468 |                             Canvas.DrawRect(shadowRect, shadow.Paint);\n  469 |                             Transform = oldTransform;\n  470 |                         }\n  471 | \n  472 |                         RestoreCanvas();\n  473 |                     }\n  474 |                 }\n  475 |             }","lines":41,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Skia/Avalonia.Skia/DrawingContextImpl.cs#L435-L475"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In DrawingContextImpl.DrawRectangle() for inset box shadows (lines 492-519), Canvas.Save() is called before DrawRoundRectDifference. After the draw, RestoreCanvas() is called, then SKRoundRectCache.Shared.Return(shadowRect) is called. But if an exception is thrown anywhere between Save() and RestoreCanvas(), the canvas save stack is permanently unbalanced, corrupting all subsequent rendering. No try/finally guards the Restore.","fix":"Wrap each Canvas.Save() / RestoreCanvas() pair in a try/finally to ensure Restore is always called on exception.","locations":[{"ref":"src/Skia/Avalonia.Skia/DrawingContextImpl.cs:493-518","code":"  493 |             {\n  494 |                 if (boxShadow != default && boxShadow.IsInset)\n  495 |                 {\n  496 |                     using (var shadow = BoxShadowFilter.Create(_boxShadowPaint, boxShadow, _currentOpacity))\n  497 |                     {\n  498 |                         var spread = (float)boxShadow.Spread;\n  499 |                         var offsetX = (float)boxShadow.OffsetX;\n  500 |                         var offsetY = (float)boxShadow.OffsetY;\n  501 |                         var outerRect = AreaCastingShadowInHole(rc, (float)boxShadow.Blur, spread, offsetX, offsetY);\n  502 | \n  503 |                         Canvas.Save();\n  504 |                         var shadowRect = SKRoundRectCache.Shared.GetAndSetRadii(skRoundRect!.Rect, skRoundRect.Radii);\n  505 |                         if (spread != 0)\n  506 |                             shadowRect.Deflate(spread, spread);\n  507 |                         Canvas.ClipRoundRect(skRoundRect,\n  508 |                             shadow.ClipOperation, true);\n  509 |                         \n  510 |                         var oldTransform = Transform;\n  511 |                         Transform = oldTransform * Matrix.CreateTranslation(boxShadow.OffsetX, boxShadow.OffsetY);\n  512 |                         using (var outerRRect = new SKRoundRect(outerRect))\n  513 |                             Canvas.DrawRoundRectDifference(outerRRect, shadowRect, shadow.Paint);\n  514 |                         Transform = oldTransform;\n  515 |                         RestoreCanvas();\n  516 |                         SKRoundRectCache.Shared.Return(shadowRect);\n  517 |                     }\n  518 |                 }","lines":26,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Skia/Avalonia.Skia/DrawingContextImpl.cs#L493-L518"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In DrawingContextImpl.PopOpacityMask(), after drawing the mask via DrawPaint(), the code calls SKPaintCache.Shared.Return(paintWrapper.Paint) to return the paint to the cache without resetting it. PaintWrapper.Dispose() already calls paint.Reset() internally, so the reset is correct - but this is a separate additional Return call that returns the *same* paint object that was already part of the wrapper. Since PaintWrapper does not clear its Paint reference on Dispose, the paint is returned twice if anything calls Return on it again. More critically: the Dispose() call on paintWrapper (via 'using') resets and does NOT return the paint to the cache; the explicit Return on line 863 is the only return. However, that paint was originally obtained from the cache in PushOpacityMask (line 839) and passed to _maskStack. The flow is complex enough that a future refactor could cause double-return.","fix":"Replace the bare SKPaintCache.Shared.Return() call on line 863 with SKPaintCache.Shared.ReturnReset(), and remove the paint.Reset() duplication in PaintWrapper.Dispose() for this case, or restructure PopOpacityMask to use a consistent single return path.","locations":[{"ref":"src/Skia/Avalonia.Skia/DrawingContextImpl.cs:836-867","code":"  836 |         {\n  837 |             CheckLease();\n  838 | \n  839 |             var paint = SKPaintCache.Shared.Get();\n  840 | \n  841 |             Canvas.SaveLayer(bounds.ToSKRect(), paint);\n  842 |             _maskStack.Push((Canvas.TotalMatrix, CreatePaint(paint, mask, bounds)));\n  843 |         }\n  844 | \n  845 |         /// <inheritdoc />\n  846 |         public void PopOpacityMask()\n  847 |         {\n  848 |             CheckLease();\n  849 | \n  850 |             var paint = SKPaintCache.Shared.Get();\n  851 |             paint.BlendMode = SKBlendMode.DstIn;\n  852 |             \n  853 |             Canvas.SaveLayer(paint);\n  854 |             SKPaintCache.Shared.ReturnReset(paint);\n  855 |             \n  856 |             var (transform, paintWrapper) = _maskStack.Pop();\n  857 |             Canvas.SetMatrix(transform);\n  858 |             using (paintWrapper)\n  859 |             {\n  860 |                 Canvas.DrawPaint(paintWrapper.Paint);\n  861 |             }\n  862 |             // Return the paint wrapper's paint less the reset since the paint is already reset in the Dispose method above.\n  863 |             SKPaintCache.Shared.Return(paintWrapper.Paint);\n  864 | \n  865 |             RestoreCanvas();\n  866 | \n  867 |             RestoreCanvas();","lines":32,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Skia/Avalonia.Skia/DrawingContextImpl.cs#L836-L867"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"SkiaRegionImpl.Rects never sets _rectsValid = true after rebuilding the list. Every call to the Rects getter rebuilds the full iterator even when the region has not changed, because the cache-valid flag stays false permanently. This turns what should be an O(1) cached lookup into O(rects) on every access.","fix":"Add _rectsValid = true; after the while loop that populates _rects (line 45).","locations":[{"ref":"src/Skia/Avalonia.Skia/SkiaRegionImpl.cs:35-49","code":"   35 |     public IList<LtrbPixelRect> Rects\n   36 |     {\n   37 |         get\n   38 |         {\n   39 |             _rects ??= new();\n   40 |             if (!_rectsValid)\n   41 |             {\n   42 |                 _rects.Clear();\n   43 |                 using var iter = Region.CreateRectIterator();\n   44 |                 while (iter.Next(out var rc))\n   45 |                     _rects.Add(rc.ToAvaloniaLtrbPixelRect());\n   46 |             }\n   47 |             return _rects;\n   48 |         }\n   49 |     }","lines":15,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Skia/Avalonia.Skia/SkiaRegionImpl.cs#L35-L49"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"MK_ALT and MK_XBUTTON1 both have the value 0x0020 in the ModifierKeys enum. MK_ALT is not a real Win32 constant for mouse-message wParam bits; Win32 has no MK_ALT bit. The real XButton1 bit is 0x0020. Any code that checks MK_XBUTTON1 will also fire when testing for the non-existent MK_ALT, and vice versa. GetInputModifiers already tests MK_XBUTTON1 directly (line 1461), so a second constant with the same value merely pollutes the enum and could mislead future authors into thinking Alt-key state is available in mouse-message wParam.","fix":"Remove MK_ALT from the ModifierKeys flags enum entirely. It is not a Win32-defined bit for mouse wParam. Alt-key state in mouse messages must be read via GetKeyState(VK_MENU) or from keyboard modifier tracking.","locations":[{"ref":"src/Windows/Avalonia.Win32/Interop/UnmanagedMethods.cs:266-281","code":"  266 |         [Flags]\n  267 |         public enum ModifierKeys\n  268 |         {\n  269 |             MK_NONE    = 0x0000,\n  270 | \n  271 |             MK_LBUTTON = 0x0001,\n  272 |             MK_RBUTTON = 0x0002,\n  273 | \n  274 |             MK_SHIFT   = 0x0004,\n  275 |             MK_CONTROL = 0x0008,\n  276 | \n  277 |             MK_MBUTTON  = 0x0010,\n  278 |             MK_ALT      = 0x0020,\n  279 |             MK_XBUTTON1 = 0x0020,\n  280 |             MK_XBUTTON2 = 0x0040\n  281 |         }","lines":16,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Windows/Avalonia.Win32/Interop/UnmanagedMethods.cs#L266-L281"}]},
{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In AlphaToMask (Win32Icon), the transparency check reads 'pSource[x * 4] == 0', which tests the Blue channel (BGRA offset 0), not the Alpha channel (BGRA offset 3). This causes incorrect cursor/icon masks: pixels with zero blue but non-zero alpha will be treated as transparent, and fully transparent pixels with non-zero blue will be treated as opaque.","fix":"Change 'pSource[x * 4] == 0' to 'pSource[x * 4 + 3] == 0' to check the Alpha byte in the BGRA pixel layout.","locations":[{"ref":"src/Windows/Avalonia.Win32/Interop/Win32Icon.cs:119","code":"  119 |                     if (pSource[x * 4] == 0)","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Windows/Avalonia.Win32/Interop/Win32Icon.cs#L119"}]},
{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"WinUiCompositionUtils.CreateAcrylicBlurBackdropBrush creates a SaturationEffect from\nblurEffect, builds a separate satEffectFactory and sat brush, but then calls\ncompositionEffectBrush.SetSourceParameter (the BLUR factory brush, not the saturate\nbrush), and returns the BLUR brush's QueryInterface without ever using the saturation\nbrush. The saturation step is completely dead - the returned brush is the unsaturated\nGaussian-blur-only brush. The SaturationEffect, satEffectFactory, and sat objects are\ncreated and immediately discarded.","fix":"Either chain the effects correctly (the saturation effect should take the\ncompositionEffectBrush result as input and the final returned brush should be the\nsaturation brush), or remove the unused saturation code. The current code creates\nSaturationEffect, satEffectFactory, and sat only to silently discard them.","locations":[{"ref":"src/Windows/Avalonia.Win32/WinRT/Composition/WinUiCompositionUtils.cs:100-104","code":"  100 |         using var saturateEffect = new SaturationEffect(blurEffect);\n  101 |         using var satEffectFactory = compositor.CreateEffectFactory(saturateEffect);\n  102 |         using var sat = satEffectFactory.CreateBrush();\n  103 |         compositionEffectBrush.SetSourceParameter(backdropString.Handle, backdropBrush);\n  104 |         return compositionEffectBrush.QueryInterface<ICompositionBrush>();","lines":5,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Windows/Avalonia.Win32/WinRT/Composition/WinUiCompositionUtils.cs#L100-L104"}]},
{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"PressesChanged calls base.PressesBegan instead of base.PressesChanged. When the\ninput handler does not consume a key event during an ongoing press (Phase.Changed),\nthe wrong UIResponder chain method is invoked. UIKit expects PressesChanged to\npropagate up the responder chain; sending PressesBegan instead may suppress\nplatform default key-repeat behavior or double-fire keyDown handlers in responders\nhigher in the chain.","fix":"Change `base.PressesBegan(presses, evt)` inside `PressesChanged` (line 375) to `base.PressesChanged(presses, evt)`.","locations":[{"ref":"src/iOS/Avalonia.iOS/AvaloniaView.cs:371-377","code":"  371 |         public override void PressesChanged(NSSet<UIPress> presses, UIPressesEvent evt)\n  372 |         {\n  373 |             if (!_input.Handle(presses, evt))\n  374 |             {\n  375 |                 base.PressesBegan(presses, evt);\n  376 |             }\n  377 |         }","lines":7,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/iOS/Avalonia.iOS/AvaloniaView.cs#L371-L377"}]},
{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`LayerFbo.TryCreate` allocates a depth renderbuffer (`db`) at line 50, attaches it\nto `GL_DEPTH_ATTACHMENT` at line 54, but the two calls that would allocate its\nstorage (`BindRenderbuffer` and `RenderbufferStorage`) are commented out (lines\n52-53). A depth renderbuffer attached to the framebuffer without any storage is\nagainst the GLES3 spec; the framebuffer becomes incomplete on conformant drivers,\ncausing `CheckFramebufferStatus` to fail and the function to delete all objects and\nreturn `null` - effectively preventing EAGL rendering from working at all. On\nlenient drivers the framebuffer may be accepted but depth testing is undefined.","fix":"Uncomment and fix the storage allocation: bind `db`, call `RenderbufferStorage(GL_RENDERBUFFER, GL_DEPTH_COMPONENT16, w, h)`, then attach it. If depth is intentionally not needed for 2D rendering, remove the `GenRenderbuffer` / `FramebufferRenderbuffer` calls for the depth slot entirely.","locations":[{"ref":"src/iOS/Avalonia.iOS/Eagl/LayerFbo.cs:50-54","code":"   50 |             var db = gl.GenRenderbuffer();\n   51 |             \n   52 |             //GL.BindRenderbuffer(RenderbufferTarget.Renderbuffer, depthBuffer);\n   53 |             //GL.RenderbufferStorage(RenderbufferTarget.Renderbuffer, RenderbufferInternalFormat.DepthComponent16, w, h);\n   54 |             gl.FramebufferRenderbuffer(GlConsts.GL_FRAMEBUFFER, GlConsts.GL_DEPTH_ATTACHMENT, GlConsts.GL_RENDERBUFFER, db);","lines":5,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/iOS/Avalonia.iOS/Eagl/LayerFbo.cs#L50-L54"}]},
{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`TextInRange` builds the virtual document incorrectly when preedit (marked) text is\nactive. The `CombinedSpan3` is constructed as:\n  span1 = surroundingText[0..selection.Start]\n  span2 = _markedText\n  span3 = surroundingText[selection.Start..selection.End]\n\nThis inserts the marked text and then replays the selected region, but completely\nomits the text that follows selection.End. The correct virtual document during IME\ncomposition should be:\n  text_before_caret + preedit_text + text_after_caret\n\nThe omission means any `UITextRange` that spans into the tail of the document\nreturns truncated or empty text, which confuses the system input method and can\ncorrupt autocomplete suggestions and cursor positioning.","fix":"Replace span3 with `surroundingText.AsSpan(currentSelection.End)` (i.e. the text after the current selection, not the selected text itself).","locations":[{"ref":"src/iOS/Avalonia.iOS/TextInputResponder.cs:246-253","code":"  246 |                 {\n  247 |                     var currentSelection = _client.Selection;\n  248 |                     var span = new CombinedSpan3<char>(surroundingText.AsSpan(0, currentSelection.Start),\n  249 |                         _markedText,\n  250 |                         surroundingText.AsSpan(currentSelection.Start, currentSelection.End - currentSelection.Start));\n  251 |                     var buf = new char[r.EndIndex - r.StartIndex];\n  252 |                     span.CopyTo(buf, r.StartIndex);\n  253 |                     result = new string(buf);","lines":8,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/iOS/Avalonia.iOS/TextInputResponder.cs#L246-L253"}]},
{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`GetCharacterRange(byExtendingPosition, direction)` implements the Left/Up case by\nreturning the range from the beginning of the document to `position` (line 408),\nand the Right/Down case by returning from `position` to the end of the document\n(line 410). The UITextInput contract for this method is to extend by one character\nunit in the given direction from `byExtendingPosition`, not to span the entire\ndocument half. Returning the half-document range causes text-selection gesture\nhandling to select enormous ranges when the system calls this API for caret\nmovement or smart selection, misplacing the cursor and producing broken selection\nbehavior.","fix":"For Left/Up: return `new AvaloniaTextRange(Math.Max(0, p.Index - 1), p.Index)`.\nFor Right/Down: return `new AvaloniaTextRange(p.Index, Math.Min(DocumentLength, p.Index + 1))`.\nSurrogate-pair and grapheme-cluster awareness should be added for correctness.","locations":[{"ref":"src/iOS/Avalonia.iOS/TextInputResponder.cs:420-431","code":"  420 |         UITextRange IUITextInput.GetCharacterRange(UITextPosition byExtendingPosition, UITextLayoutDirection direction)\n  421 |         {\n  422 |             if (byExtendingPosition is AvaloniaTextPosition p)\n  423 |             {\n  424 |                 if (direction is UITextLayoutDirection.Left or UITextLayoutDirection.Up)\n  425 |                     return new AvaloniaTextRange(0, p.Index);\n  426 | \n  427 |                 return new AvaloniaTextRange(p.Index, DocumentLength);\n  428 |             }\n  429 | \n  430 |             return null!;\n  431 |         }","lines":12,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/iOS/Avalonia.iOS/TextInputResponder.cs#L420-L431"}]},
{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"AutoFitContentView::initWithContent: calls setAutoresizesSubviews, setWantsLayer, and addSubview on self before [super init] has been called, then returns self without calling [super init] at all. Using self before [super init] is undefined behaviour in Objective-C.","fix":"Add self = [super init]; at the start of the method, guard the rest with if (self) { ... }, and return self at the end.","locations":[{"ref":"native/Avalonia.Native/src/OSX/AutoFitContentView.mm:21-58","code":"   21 | -(AutoFitContentView* _Nonnull) initWithContent:(NSView *)content\n   22 | {\n   23 |     _titleBarHeightHint = -1;\n   24 |     _content = content;\n   25 |     _settingSize = false;\n   26 | \n   27 |     [self setAutoresizesSubviews:true];\n   28 |     [self setWantsLayer:true];\n   29 | \n   30 |     _titleBarMaterial = [NSVisualEffectView new];\n   31 |     [_titleBarMaterial setBlendingMode:NSVisualEffectBlendingModeWithinWindow];\n   32 |     [_titleBarMaterial setMaterial:NSVisualEffectMaterialTitlebar];\n   33 |     [_titleBarMaterial setWantsLayer:true];\n   34 |     _titleBarMaterial.hidden = true;\n   35 | \n   36 |     _titleBarUnderline = [NSBox new];\n   37 |     _titleBarUnderline.boxType = NSBoxSeparator;\n   38 |     _titleBarUnderline.fillColor = [NSColor underPageBackgroundColor];\n   39 |     _titleBarUnderline.hidden = true;\n   40 | \n   41 |     [self addSubview:_titleBarMaterial];\n   42 |     [self addSubview:_titleBarUnderline];\n   43 | \n   44 |     _blurBehind = [NSVisualEffectView new];\n   45 |     [_blurBehind setBlendingMode:NSVisualEffectBlendingModeBehindWindow];\n   46 |     [_blurBehind setMaterial:NSVisualEffectMaterialLight];\n   47 |     [_blurBehind setWantsLayer:true];\n   48 |     _blurBehind.hidden = true;\n   49 | \n   50 |     [_blurBehind setAutoresizingMask:NSViewWidthSizable | NSViewHeightSizable];\n   51 |     [_content setAutoresizingMask:NSViewWidthSizable | NSViewHeightSizable];\n   52 | \n   53 |     [self addSubview:_blurBehind];\n   54 |     [self addSubview:_content];\n   55 | \n   56 |     [self setWantsLayer:true];\n   57 |     return self;\n   58 | }","lines":38,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/native/Avalonia.Native/src/OSX/AutoFitContentView.mm#L21-L58"}]},
{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"AvnWindow::getExtendedTitleBarHeight accesses [subview subviews][0] without checking whether the subviews array is non-empty. If NSTitlebarContainerView has no subviews the subscript raises an NSRangeException and crashes.","fix":"Check that [subview subviews].count > 0 before accessing index 0.","locations":[{"ref":"native/Avalonia.Native/src/OSX/AvnWindow.mm:65-80","code":"   65 |         for (id subview in self.contentView.superview.subviews)\n   66 |         {\n   67 |             if ([subview isKindOfClass:NSClassFromString(@\"NSTitlebarContainerView\")])\n   68 |             {\n   69 |                 NSView *titlebarView = [subview subviews][0];\n   70 | \n   71 |                 return (double)titlebarView.frame.size.height;\n   72 |             }\n   73 |         }\n   74 | \n   75 |         return -1;\n   76 |     }\n   77 |     else\n   78 |     {\n   79 |         return 0;\n   80 |     }","lines":16,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/native/Avalonia.Native/src/OSX/AvnWindow.mm#L65-L80"}]},

{"id":"LOGIC_36","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"TopLevelImpl::GetInputMethod assigns InputMethod (a ComPtr) directly to *retOut with the implicit operator TInterface*, which does NOT call AddRef. The caller receives a raw pointer without an owning reference; if the ComPtr is released, the caller holds a dangling pointer.","fix":"Use *retOut = InputMethod.getRetainedReference(); to return an AddRef'd pointer.","locations":[{"ref":"native/Avalonia.Native/src/OSX/TopLevelImpl.mm:60","code":"   60 |     *retOut = InputMethod;","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/native/Avalonia.Native/src/OSX/TopLevelImpl.mm#L60"}]},
{"id":"LOGIC_37","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"TopLevelImpl::PointToClient and PointToScreen assign ret = &point when window is nil, but ret is an output parameter (a pointer already provided by the caller). This re-seats the local variable ret and does not write through to the caller's pointer, so the caller's output is left uninitialised.","fix":"Replace ret = &point; with *ret = point; to actually write to the output parameter.","locations":[{"ref":"native/Avalonia.Native/src/OSX/TopLevelImpl.mm:192-194","code":"  192 |             ret = &point;\n  193 |             \n  194 |             return S_OK;","lines":3,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/native/Avalonia.Native/src/OSX/TopLevelImpl.mm#L192-L194"},{"ref":"native/Avalonia.Native/src/OSX/TopLevelImpl.mm:230-232","code":"  230 |             ret = &point;\n  231 |             \n  232 |             return S_OK;","lines":3,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/native/Avalonia.Native/src/OSX/TopLevelImpl.mm#L230-L232"}]},
{"id":"LOGIC_38","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"BeginDragAndDropOperation may still pass nsevent == nil to beginDraggingSessionWithItems:event:source: when [NSApp currentEvent] returns nil and the View has no window. beginDraggingSession: requires a non-nil mouse event and will crash or silently fail.","fix":"After the synthetic event creation block, check if nsevent is still nil and return E_FAIL rather than proceeding.","locations":[{"ref":"native/Avalonia.Native/src/OSX/TopLevelImpl.mm:288-335","code":"  288 |     auto nsevent = [NSApp currentEvent];\n  289 |     auto nseventType = [nsevent type];\n  290 | \n  291 |     // If current event isn't a mouse one (probably due to malfunctioning user app)\n  292 |     // attempt to forge a new one\n  293 |     if (!((nseventType >= NSEventTypeLeftMouseDown && nseventType <= NSEventTypeMouseExited)\n  294 |             || (nseventType >= NSEventTypeOtherMouseDown && nseventType <= NSEventTypeOtherMouseDragged))) {\n  295 |         // For TopLevelImpl, we don't have a Window so we use the View's window\n  296 |         auto window = [View window];\n  297 |         if (window != nil) {\n  298 |             NSRect convertRect = [window convertRectToScreen:NSMakeRect(point.X, point.Y, 0.0, 0.0)];\n  299 |             auto nspoint = NSMakePoint(convertRect.origin.x, convertRect.origin.y);\n  300 |             CGPoint cgpoint = NSPointToCGPoint(nspoint);\n  301 |             auto cgevent = CGEventCreateMouseEvent(NULL, kCGEventLeftMouseDown, cgpoint, kCGMouseButtonLeft);\n  302 |             nsevent = [NSEvent eventWithCGEvent:cgevent];\n  303 |             CFRelease(cgevent);\n  304 |         }\n  305 |     }\n  306 | \n  307 |     auto itemCount = source->GetItemCount();\n  308 |     auto draggingItems = [NSMutableArray<NSDraggingItem*> arrayWithCapacity:itemCount];\n  309 |     auto dragItemImage = [NSImage imageNamed:NSImageNameMultipleDocuments];\n
