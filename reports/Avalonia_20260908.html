 310 |     NSRect dragItemRect = {(float) point.X, (float) point.Y, [dragItemImage size].width, [dragItemImage size].height};\n  311 | \n  312 |     for (auto i = 0; i < itemCount; ++i)\n  313 |     {\n  314 |         ComPtr<IAvnClipboardDataItem> item;\n  315 |         if(S_OK != source->GetItem(i, item.getPPV()))\n  316 |             continue;\n  317 |         auto writeableItem = [[WriteableClipboardItem alloc] initWithItem:item source:source];\n  318 |         auto draggingItem = [[NSDraggingItem alloc] initWithPasteboardWriter:writeableItem];\n  319 |         [draggingItem setDraggingFrame:dragItemRect contents:dragItemImage];\n  320 |         [draggingItems addObject:draggingItem];\n  321 |     }\n  322 | \n  323 |     int op = 0;\n  324 |     int ieffects = (int) effects;\n  325 |     if ((ieffects & (int) AvnDragDropEffects::Copy) != 0)\n  326 |         op |= NSDragOperationCopy;\n  327 |     if ((ieffects & (int) AvnDragDropEffects::Link) != 0)\n  328 |         op |= NSDragOperationLink;\n  329 |     if ((ieffects & (int) AvnDragDropEffects::Move) != 0)\n  330 |         op |= NSDragOperationMove;\n  331 | \n  332 |     [View beginDraggingSessionWithItems:draggingItems\n  333 |                                   event:nsevent\n  334 |                                  source:CreateDraggingSource((NSDragOperation) op, callback, sourceHandle)];\n  335 |     return S_OK;","lines":48,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/native/Avalonia.Native/src/OSX/TopLevelImpl.mm#L288-L335"}]},
{"id":"LOGIC_39","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"CGEventCreateMouseEvent can return NULL (documented to do so on failure). The result is immediately passed to +[NSEvent eventWithCGEvent:] without a null check, then CFRelease is called unconditionally. CFRelease(NULL) is safe, but passing NULL to eventWithCGEvent: is not documented to be safe and will likely crash.","fix":"Check cgevent != NULL before calling eventWithCGEvent:, and skip the drag if it is null.","locations":[{"ref":"native/Avalonia.Native/src/OSX/TopLevelImpl.mm:301-303","code":"  301 |             auto cgevent = CGEventCreateMouseEvent(NULL, kCGEventLeftMouseDown, cgpoint, kCGMouseButtonLeft);\n  302 |             nsevent = [NSEvent eventWithCGEvent:cgevent];\n  303 |             CFRelease(cgevent);","lines":3,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/native/Avalonia.Native/src/OSX/TopLevelImpl.mm#L301-L303"}]},
{"id":"LOGIC_40","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"clipboard.mm converts TIFF or JPEG clipboard data to PNG by drawing via lockFocus/unlockFocus (line 146-148). This requires a running window context on the main thread. lockFocus on an off-screen NSImage without a current drawing context may silently fail, and the resulting bitmapRep will be nil, causing representationUsingType:... to be called on nil (which returns nil in ObjC, so the output is nil). No error is reported. More critically, lockFocus must only be called on the main thread.","fix":"Check whether image is non-nil after initWithData. Use CGImageRef-based pixel extraction (CGBitmapContext) instead of lockFocus/unlockFocus to avoid thread-safety constraints and potential nil context issues.","locations":[{"ref":"native/Avalonia.Native/src/OSX/clipboard.mm:143-152","code":"  143 |                 }\n  144 | \n  145 |                 if (!bitmapRep) {\n  146 |                     [image lockFocus];\n  147 |                     bitmapRep = [[NSBitmapImageRep alloc] initWithFocusedViewRect:NSMakeRect(0, 0, image.size.width, image.size.height)];\n  148 |                     [image unlockFocus];\n  149 |                 }\n  150 | \n  151 |                 value = [bitmapRep representationUsingType:NSBitmapImageFileTypePNG properties:@{}];\n  152 |             }","lines":10,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/native/Avalonia.Native/src/OSX/clipboard.mm#L143-L152"}]},
{"id":"LOGIC_41","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In deadlock.mm the global Counter variable is a plain int accessed from potentially multiple threads (the AvnInsidePotentialDeadlock constructor/destructor increment/decrement it, and IsInside reads it). There is no atomic or mutex protection. Concurrent access from different threads can cause lost updates or torn reads.","fix":"Declare Counter as std::atomic<int> Counter(0) and use standard atomic increment/decrement operations, or protect all accesses with a mutex.","locations":[{"ref":"native/Avalonia.Native/src/OSX/deadlock.mm:3-16","code":"    3 | static int Counter = 0;\n    4 | AvnInsidePotentialDeadlock::AvnInsidePotentialDeadlock()\n    5 | {\n    6 |     Counter++;\n    7 | }\n    8 | \n    9 | AvnInsidePotentialDeadlock::~AvnInsidePotentialDeadlock()\n   10 | {\n   11 |     Counter--;\n   12 | }\n   13 | \n   14 | bool AvnInsidePotentialDeadlock::IsInside()\n   15 | {\n   16 |     return Counter!=0;","lines":14,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/native/Avalonia.Native/src/OSX/deadlock.mm#L3-L16"}]},
{"id":"LOGIC_42","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The AvnMenuItem initializer checks `if (self != nil)` before calling [super initWithTitle:...], then assigns the result of super's init back to self inside the if-block. The idiom is inverted: the check for self != nil before super init is meaningless because self is always non-nil at that point (alloc already succeeded). After [super initWithTitle:...], self might have changed (super's init can return a different object or nil), but the function returns the potentially updated self without re-checking. The _item weak-pointer is also set to menuItem before super's init, which can point to a dangling item if super's init replaces self.","fix":"Use the standard ObjC init pattern: self = [super initWithTitle:@\"\" action:@selector(didSelectItem:) keyEquivalent:@\"\"]; if (self) { _item = menuItem; [self setEnabled:YES]; [self setTarget:self]; } return self;","locations":[{"ref":"native/Avalonia.Native/src/OSX/menu.mm:41-56","code":"   41 | - (id) initWithAvnAppMenuItem: (AvnAppMenuItem*)menuItem\n   42 | {\n   43 |     if(self != nil)\n   44 |     {\n   45 |         _item = menuItem;\n   46 |         self = [super initWithTitle:@\"\"\n   47 |                              action:@selector(didSelectItem:)\n   48 |                       keyEquivalent:@\"\"];\n   49 |         \n   50 |         [self setEnabled:YES];\n   51 |         \n   52 |         [self setTarget:self];\n   53 |     }\n   54 |     \n   55 |     return self;\n   56 | }","lines":16,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/native/Avalonia.Native/src/OSX/menu.mm#L41-L56"}]},
{"id":"LOGIC_43","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"SetAppMenu calls [s_appMenu->GetNative() itemAtIndex:0] without checking that the native menu has at least one item. If the caller provides an empty AvnAppMenu, itemAtIndex:0 returns nil and s_appMenuItem is set to nil. The subsequent call [[s_appMenuItem menu] removeItem:s_appMenuItem] silently no-ops on nil in ObjC, but [currentMenu insertItem:s_appMenuItem atIndex:0] inserts nil which throws an NSInvalidArgumentException at runtime.","fix":"After line 503, add: if (s_appMenuItem == nil) return; to guard against an empty app menu.","locations":[{"ref":"native/Avalonia.Native/src/OSX/menu.mm:512-521","code":"  512 |         s_appMenuItem = [s_appMenu->GetNative() itemAtIndex:0];\n  513 |         \n  514 |         if (currentMenu == nullptr)\n  515 |         {\n  516 |             currentMenu = [s_appMenuItem menu];\n  517 |         }\n  518 |         \n  519 |         [[s_appMenuItem menu] removeItem:s_appMenuItem];\n  520 |         \n  521 |         [currentMenu insertItem:s_appMenuItem atIndex:0];","lines":10,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/native/Avalonia.Native/src/OSX/menu.mm#L512-L521"}]},
{"id":"LOGIC_44","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In trayicon.mm SetIcon and in menu.mm SetIcon, the code divides by originalSize.height to compute scaleFactor. If the image data is invalid or the image has a zero height (e.g., malformed PNG), originalSize.height is 0.0 and the division produces NaN or infinity. The resulting scaleFactor is then used to compute size.width via floor(), producing a NaN dimension that is passed to setSize:.","fix":"Guard against a zero height: if (originalSize.height <= 0) { ... skip scaling ... } before computing scaleFactor. Also check that image != nil after initWithData.","locations":[{"ref":"native/Avalonia.Native/src/OSX/trayicon.mm:39-48","code":"   39 |             NSSize originalSize = [image size];\n   40 |              \n   41 |             NSSize size;\n   42 |             size.height = floor([[NSFont menuFontOfSize:0] pointSize] * 1.333333);\n   43 | \n   44 |             auto scaleFactor = size.height / originalSize.height;\n   45 |             size.width = floor(originalSize.width * scaleFactor);\n   46 |             \n   47 |             [image setSize: size];\n   48 |             [image setTemplate: _isTemplateIcon];","lines":10,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/native/Avalonia.Native/src/OSX/trayicon.mm#L39-L48"},{"ref":"native/Avalonia.Native/src/OSX/menu.mm:277-286","code":"  277 |             NSSize originalSize = [image size];\n  278 |              \n  279 |             NSSize size;\n  280 |             size.height = floor([[NSFont menuFontOfSize:0] pointSize] * 1.333333);\n  281 |             \n  282 |             auto scaleFactor = size.height / originalSize.height;\n  283 |             size.width = floor(originalSize.width * scaleFactor);\n  284 |             \n  285 |             [image setSize: size];\n  286 |             [_native setImage:image];","lines":10,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/native/Avalonia.Native/src/OSX/menu.mm#L277-L286"}]},
{"id":"LOGIC_45","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"AndroidInsetsManager.OccludedRect computes the keyboard height as (imeInset - navbarInset), which can produce wrong results when edge-to-edge mode is active and the navbar inset is reported differently. More critically, when _displaysEdgeToEdge is true, SafeAreaPadding.Bottom already includes the navbar inset, yet OccludedRect subtracts it again from the IME inset. This double-subtraction causes the keyboard rect height to be negative (clamped to 0) when the IME opens in edge-to-edge mode.","fix":"When DisplaysEdgeToEdge is true, use the raw IME inset bottom without subtracting the nav bar inset for the keyboard height calculation, as SafeAreaPadding.Bottom already accounts for the navigation bar.","locations":[{"ref":"src/Android/Avalonia.Android/Platform/AndroidInsetsManager.cs:143-161","code":"  143 |         public Rect OccludedRect\n  144 |         {\n  145 |             get\n  146 |             {\n  147 |                 var insets = ViewCompat.GetRootWindowInsets(Window.DecorView);\n  148 | \n  149 |                 if (insets != null)\n  150 |                 {\n  151 |                     var navbarInset = insets.GetInsets(WindowInsetsCompat.Type.NavigationBars())?.Bottom ?? 0;\n  152 |                     var imeInset = insets.GetInsets(WindowInsetsCompat.Type.Ime())?.Bottom ?? 0;\n  153 | \n  154 |                     var height = Math.Max((float)((imeInset - navbarInset) / _topLevel.RenderScaling), 0);\n  155 | \n  156 |                     return new Rect(0, _topLevel.ClientSize.Height - SafeAreaPadding.Bottom - height, _topLevel.ClientSize.Width, height);\n  157 |                 }\n  158 | \n  159 |                 return default;\n  160 |             }\n  161 |         }","lines":19,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Android/Avalonia.Android/Platform/AndroidInsetsManager.cs#L143-L161"}]},
{"id":"LOGIC_46","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"AndroidScreens.AndroidScreen.Refresh() builds a WindowInsetsCompat via new WindowInsetsCompat.Builder().Build() with no actual inset values set, then queries GetInsets(SystemBars) from it. This always returns zero insets, so WorkingArea is always set equal to Bounds, never reflecting real system bar sizes. The working area calculation is effectively dead code.","fix":"Use ViewCompat.GetRootWindowInsets(decorView) to obtain real insets, or remove the WorkingArea calculation and set WorkingArea = Bounds directly since the inset data is not available at this layer.","locations":[{"ref":"src/Android/Avalonia.Android/Platform/AndroidScreens.cs:36-43","code":"   36 |             var windowInsets = new WindowInsetsCompat.Builder().Build();\n   37 |             if (windowInsets?.GetInsets(WindowInsetsCompat.Type.SystemBars()) is { } inset)\n   38 |             {\n   39 |                 WorkingArea = new(Bounds.X + inset.Left,\n   40 |                     Bounds.Y + inset.Top,\n   41 |                     Bounds.Width - (inset.Left + inset.Right),\n   42 |                     Bounds.Height - (inset.Top + inset.Bottom));\n   43 |             }","lines":8,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Android/Avalonia.Android/Platform/AndroidScreens.cs#L36-L43"}]},
{"id":"LOGIC_47","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"DeleteRegionInCodePointsCommand.Apply() checks surrogate pairs with an off-by-one index. The backward loop checks buffer.Text[buffer.Selection.Start - beforeLengthInChar - 1] as the lead and buffer.Text[buffer.Selection.Start - beforeLengthInChar] as the trail, but this access happens before the guard check 'if (buffer.Selection.Start > beforeLengthInChar)', which does not account for the -1 offset on the lead character. When beforeLengthInChar equals Selection.Start - 1, the lead index becomes -1 + Selection.Start - (Selection.Start - 1) = index 0 while the guard passes, but the guard should be > beforeLengthInChar + 1 to prevent index -1 on the lead.","fix":"Change the guard to: if (buffer.Selection.Start > beforeLengthInChar + 1) to ensure the lead character index is always >= 0.","locations":[{"ref":"src/Android/Avalonia.Android/Platform/Input/EditCommand.cs:83-100","code":"   83 |             var beforeLengthInChar = 0;\n   84 | \n   85 |             for (int i = 0; i < _before; i++)\n   86 |             {\n   87 |                 beforeLengthInChar++;\n   88 |                 if (buffer.Selection.Start > beforeLengthInChar)\n   89 |                 {\n   90 |                     var lead = buffer.Text[buffer.Selection.Start - beforeLengthInChar - 1];\n   91 |                     var trail = buffer.Text[buffer.Selection.Start - beforeLengthInChar];\n   92 | \n   93 |                     if (char.IsSurrogatePair(lead, trail))\n   94 |                     {\n   95 |                         beforeLengthInChar++;\n   96 |                     }\n   97 |                 }\n   98 | \n   99 |                 if (beforeLengthInChar == buffer.Selection.Start)\n  100 |                     break;","lines":18,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Android/Avalonia.Android/Platform/Input/EditCommand.cs#L83-L100"}]},
{"id":"LOGIC_48","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"AndroidStorageFolder.DeleteAsync() deletes the folder's children but uses the wrong URI when deleting the folder itself. Inside DeleteContents the call is DeleteDocument(Activity.ContentResolver!, treeUri!) where treeUri is obtained from GetTreeUri().treeUri (the children URI), not the document URI of the folder being deleted. For the root folder the treeUri may be a children list URI rather than the folder's own document URI, causing the delete to fail silently or target the wrong document.","fix":"Pass the folder's own document URI (Uri) to DeleteDocument, not the children URI returned by GetTreeUri().","locations":[{"ref":"src/Android/Avalonia.Android/Platform/Storage/AndroidStorageItem.cs:218-246","code":"  218 |     public override async Task DeleteAsync()\n  219 |     {\n  220 |         if (!await EnsureExternalFilesPermission(false))\n  221 |         {\n  222 |             return;\n  223 |         }\n  224 | \n  225 |         if (Activity != null)\n  226 |         {\n  227 |             await DeleteContents(this);\n  228 |         }\n  229 | \n  230 |         async Task DeleteContents(AndroidStorageFolder storageFolder)\n  231 |         {\n  232 |             await foreach (var file in storageFolder.GetItemsAsync())\n  233 |             {\n  234 |                 if (file is AndroidStorageFolder folder)\n  235 |                 {\n  236 |                     await DeleteContents(folder);\n  237 |                 }\n  238 |                 else if (file is AndroidStorageFile storageFile)\n  239 |                 {\n  240 |                     await storageFile.DeleteAsync();\n  241 |                 }\n  242 |             }\n  243 | \n  244 |             var treeUri = GetTreeUri().treeUri;\n  245 |             DeleteDocument(Activity.ContentResolver!, treeUri!);\n  246 |         }","lines":29,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Android/Avalonia.Android/Platform/Storage/AndroidStorageItem.cs#L218-L246"}]},
{"id":"LOGIC_49","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"AndroidStorageProvider.StartActivity() subscribes to mainActivity.ActivityResult but never unsubscribes if StartActivityForResult throws an exception. If _activity.StartActivityForResult(pickerIntent, currentRequestCode) throws, the lambda OnActivityResult remains subscribed permanently, leaking a TaskCompletionSource and potentially being triggered by future unrelated activity results.","fix":"Wrap StartActivityForResult in a try/finally block that unsubscribes OnActivityResult and sets the TCS to faulted on exception.","locations":[{"ref":"src/Android/Avalonia.Android/Platform/Storage/AndroidStorageProvider.cs:278-332","code":"  278 |     private async Task<List<AndroidUri>> StartActivity(Intent? pickerIntent, bool singleResult)\n  279 |     {\n  280 |         var resultList = new List<AndroidUri>(1);\n  281 |         var tcs = new TaskCompletionSource<Intent?>();\n  282 |         var currentRequestCode = PlatformSupport.GetNextRequestCode();\n  283 | \n  284 |         if (!(_activity is IActivityResultHandler mainActivity))\n  285 |         {\n  286 |             throw new InvalidOperationException(\"Main activity must implement IActivityResultHandler interface.\");\n  287 |         }\n  288 | \n  289 |         mainActivity.ActivityResult += OnActivityResult;\n  290 |         _activity.StartActivityForResult(pickerIntent, currentRequestCode);\n  291 | \n  292 |         var result = await tcs.Task;\n  293 | \n  294 |         if (result != null)\n  295 |         {\n  296 |             // ClipData first to avoid issue with multiple files selection.\n  297 |             if (!singleResult && result.ClipData is { } clipData)\n  298 |             {\n  299 |                 for (var i = 0; i < clipData.ItemCount; i++)\n  300 |                 {\n  301 |                     var uri = clipData.GetItemAt(i)?.Uri;\n  302 |                     if (uri != null)\n  303 |                     {\n  304 |                         resultList.Add(uri);\n  305 |                     }\n  306 |                 }\n  307 |             }\n  308 |             else if (result.Data is { } uri)\n  309 |             {\n  310 |                 resultList.Add(uri);\n  311 |             }\n  312 |         }\n  313 | \n  314 |         if (result?.HasExtra(\"error\") == true)\n  315 |         {\n  316 |             throw new Exception(result.GetStringExtra(\"error\"));\n  317 |         }\n  318 | \n  319 |         return resultList;\n  320 | \n  321 |         void OnActivityResult(int requestCode, Result resultCode, Intent? data)\n  322 |         {\n  323 |             if (currentRequestCode != requestCode)\n  324 |             {\n  325 |                 return;\n  326 |             }\n  327 | \n  328 |             mainActivity.ActivityResult -= OnActivityResult;\n  329 | \n  330 |             _ = tcs.TrySetResult(resultCode == Result.Ok ? data : null);\n  331 |         }\n  332 |     }","lines":55,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Android/Avalonia.Android/Platform/Storage/AndroidStorageProvider.cs#L278-L332"}]},
{"id":"LOGIC_50","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `InputElement.ProcessTabStop`, `newTabStop` is set to null at the top and never reassigned before the two guards that test `newTabStop != null` (lines 826 and 846). Consequently: (a) the `else if (isTabStopOverridden && newTabStop != null)` branch at line 826 is dead code and never runs; and (b) at line 846 the assignment `newTabStop = spNewTabStop;` never executes, so when a control's `ProcessTabStopOverride` returns true with a computed `spNewTabStop`, the `out newTabStop` result is silently discarded (stays null) even though `isTabStopOverridden` is returned true. The custom tab-stop override provided by a subclass is therefore lost. Both guards were clearly intended to test `spNewTabStop`, not the always-null `newTabStop`. Reachable by overriding the `protected internal virtual ProcessTabStopOverride`/`ProcessCandidateTabStopOverride` extensibility points.","fix":"Guard on `spNewTabStop` (the value actually produced by the override) instead of the always-null `newTabStop`:\n```csharp\nelse if (isTabStopOverridden && spNewTabStop != null)\n{\n    newCandidateTargetAsIE = spNewTabStop as InputElement;\n    ...\n}\n...\nelse if (isTabStopOverridden)\n{\n    if (spNewTabStop != null)\n        newTabStop = spNewTabStop;\n    isTabStopOverridden = true;\n}\n```","locations":[{"ref":"src/Avalonia.Base/Input/InputElement.cs:807-852","code":"  807 |             newTabStop = null;\n  808 |             bool isTabStopOverridden = false;\n  809 |             bool isCandidateTabStopOverridden = false;\n  810 |             IInputElement? currentFocusedTarget = focusedElement;\n  811 |             InputElement? focusedTargetAsIE = focusedElement as InputElement;\n  812 |             InputElement? candidateTargetAsIE = candidateTabStopElement as InputElement;\n  813 |             InputElement? newCandidateTargetAsIE = null;\n  814 |             IInputElement? newCandidateTabStop = null;\n  815 |             IInputElement? spNewTabStop = null;\n  816 | \n  817 |             if (focusedTargetAsIE != null)\n  818 |             {\n  819 |                 isTabStopOverridden = focusedTargetAsIE.ProcessTabStopInternal(candidateTabStopElement, isReverse, didCycleFocusAtRootVisual, out spNewTabStop);\n  820 |             }\n  821 | \n  822 |             if (!isTabStopOverridden && candidateTargetAsIE != null)\n  823 |             {\n  824 |                 isTabStopOverridden = candidateTargetAsIE.ProcessCandidateTabStopInternal(focusedElement, null, isReverse, out spNewTabStop);\n  825 |             }\n  826 |             else if (isTabStopOverridden && newTabStop != null)\n  827 |             {\n  828 |                 newCandidateTargetAsIE = spNewTabStop as InputElement;\n  829 |                 if (newCandidateTargetAsIE != null)\n  830 |                 {\n  831 |                     isCandidateTabStopOverridden = newCandidateTargetAsIE.ProcessCandidateTabStopInternal(focusedElement, spNewTabStop, isReverse, out newCandidateTabStop);\n  832 |                 }\n  833 |             }\n  834 | \n  835 |             if (isCandidateTabStopOverridden)\n  836 |             {\n  837 |                 if (newCandidateTabStop != null)\n  838 |                 {\n  839 |                     newTabStop = newCandidateTabStop;\n  840 |                 }\n  841 | \n  842 |                 isTabStopOverridden = true;\n  843 |             }\n  844 |             else if (isTabStopOverridden)\n  845 |             {\n  846 |                 if (newTabStop != null)\n  847 |                 {\n  848 |                     newTabStop = spNewTabStop;\n  849 |                 }\n  850 | \n  851 |                 isTabStopOverridden = true;\n  852 |             }","lines":46,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Input/InputElement.cs#L807-L852"}]},
{"id":"LOGIC_51","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In PointerOverPreProcessor.OnNext, the first `if` already matches `RawPointerEventType.TouchCancel or RawPointerEventType.TouchEnd`, so the later `else if (args.Type is RawPointerEventType.TouchCancel or RawPointerEventType.TouchEnd && ...)` branch is unreachable dead code. The dead branch was written to clear pointer-over for the specific touch pointer obtained via `pointerDevice.TryGetPointer(args)` using `args.Position` directly, but instead every TouchCancel/TouchEnd is funneled through the first branch which relies on the shared `_currentPointer` (only ever set for non-touch pointers, since the pointer-over branch at line 79 requires `pointer.Type != PointerType.Touch`). The touch-specific cleanup logic therefore never runs.","fix":"Remove `RawPointerEventType.TouchCancel` and `RawPointerEventType.TouchEnd` from the first branch's condition (leaving only `LeaveWindow` and `NonClientLeftButtonDown`) so the dedicated touch branch at lines 71-78 becomes reachable, or delete the dead branch if the consolidated handling is intended.","locations":[{"ref":"src/Avalonia.Base/Input/PointerOverPreProcessor.cs:56-78","code":"   56 |                 if (args.Type is RawPointerEventType.LeaveWindow or RawPointerEventType.NonClientLeftButtonDown\n   57 |                     or RawPointerEventType.TouchCancel or RawPointerEventType.TouchEnd)\n   58 |                 {\n   59 |                     if (_currentPointer is var (lastPointer, lastPosition))\n   60 |                     {\n   61 |                         _currentPointer = null;\n   62 |                         ClearPointerOver(lastPointer, args.Root, 0, PointToClient(args.Root, lastPosition),\n   63 |                             new PointerPointProperties(args.InputModifiers, args.Type.ToUpdateKind()),\n   64 |                             args.InputModifiers.ToKeyModifiers());\n   65 |                     }\n   66 |                 }\n   67 |                 else if (args.Type is RawPointerEventType.TouchBegin or RawPointerEventType.TouchUpdate && args.Root.RootElement is {} visual)\n   68 |                 {\n   69 |                     _lastKnownPosition = visual.PointToScreen(args.Position);\n   70 |                 }\n   71 |                 else if (args.Type is RawPointerEventType.TouchCancel or RawPointerEventType.TouchEnd\n   72 |                     && pointerDevice.TryGetPointer(args) is { } p)\n   73 |                 {\n   74 |                     _currentPointer = null;\n   75 |                     ClearPointerOver(p, args.Root, 0, args.Position,\n   76 |                         new PointerPointProperties(args.InputModifiers, args.Type.ToUpdateKind()),\n   77 |                         args.InputModifiers.ToKeyModifiers());\n   78 |                 }","lines":23,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Input/PointerOverPreProcessor.cs#L56-L78"}]},
{"id":"LOGIC_52","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"RotateTransform only raises the Transform.Changed event for changes to AngleProperty (it subscribes solely to `GetObservable(AngleProperty)` in the constructor). Changes to CenterXProperty or CenterYProperty do not raise Changed, so a Visual whose RenderTransform is a RotateTransform is not invalidated/re-rendered when CenterX/CenterY are changed at runtime (e.g. via binding or animation). Visual.RenderTransformChanged -> InvalidateVisual is driven by that event, and sibling transforms (ScaleTransform, SkewTransform) correctly raise Changed for all of their properties.","fix":"Raise Changed for all three properties, e.g. override OnPropertyChanged like ScaleTransform/SkewTransform:\n```csharp\nprotected override void OnPropertyChanged(AvaloniaPropertyChangedEventArgs change)\n{\n    base.OnPropertyChanged(change);\n    if (change.Property == AngleProperty ||\n        change.Property == CenterXProperty ||\n        change.Property == CenterYProperty)\n        RaiseChanged();\n}\n```\nand drop the Angle-only observable subscription.","locations":[{"ref":"src/Avalonia.Base/Media/RotateTransform.cs:33-36","code":"   33 |         public RotateTransform()\n   34 |         {\n   35 |             this.GetObservable(AngleProperty).Subscribe(_ => RaiseChanged());\n   36 |         }","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Media/RotateTransform.cs#L33-L36"}]},
{"id":"LOGIC_53","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`TextLineImpl.GetCharacterHitFromDistance` has two index bugs in the branch that walks a\nconsecutive run of right-to-left shaped runs, so hit-testing (distance -> caret) returns wrong\nresults for lines that contain RTL text (Arabic/Hebrew) followed by more runs. It is reachable via\n`TextLayout.HitTestPoint` -> `TextLine.GetCharacterHitFromDistance` used by TextBox/SelectableTextBlock\npointer hit testing.\n\n1. The inner `for` loop condition tests the OUTER index `i` instead of the loop variable `j`:\n`for (var j = i; i <= rightToLeftIndex; j++)`. Because `i` never changes and `rightToLeftIndex >= i`,\nthe condition is always true; the loop only stops on the `j > _textRuns.Length - 1` guard or the\n`return`, so it iterates over ALL remaining runs, not just the RTL sub-range.\n\n2. The `while` loop that finds the extent of the RTL run advances `rightToLeftIndex` twice per\nnon-breaking iteration (`_textRuns[++rightToLeftIndex]` on line 248 and `rightToLeftIndex++` on\nline 255). For runs [RTL, RTL, RTL, LTR] it lands on index 3 (the LTR run) and never inspects\nindex 2, overshooting the true end of the RTL sequence.","fix":"Fix the loop bound to use `j`, and remove the extra increment in the `while` loop:\n```csharp\nwhile (rightToLeftIndex + 1 <= _textRuns.Length - 1)\n{\n    var nextShaped = _textRuns[rightToLeftIndex + 1] as ShapedTextRun;\n    if (nextShaped == null || nextShaped.ShapedBuffer.IsLeftToRight)\n        break;\n    rightToLeftIndex++;\n}\n\nfor (var j = i; j <= rightToLeftIndex; j++)   // was: i <= rightToLeftIndex\n{\n    ...\n}\n```","locations":[{"ref":"src/Avalonia.Base/Media/TextFormatting/TextLineImpl.cs:277-316","code":"  277 |                     var rightToLeftIndex = i;\n  278 | \n  279 |                     while (rightToLeftIndex + 1 <= _textRuns.Length - 1)\n  280 |                     {\n  281 |                         var nextShaped = _textRuns[++rightToLeftIndex] as ShapedTextRun;\n  282 | \n  283 |                         if (nextShaped == null || nextShaped.ShapedBuffer.IsLeftToRight)\n  284 |                         {\n  285 |                             break;\n  286 |                         }\n  287 | \n  288 |                         rightToLeftIndex++;\n  289 |                     }\n  290 | \n  291 |                     for (var j = i; i <= rightToLeftIndex; j++)\n  292 |                     {\n  293 |                         if (j > _textRuns.Length - 1)\n  294 |                         {\n  295 |                             break;\n  296 |                         }\n  297 | \n  298 |                         currentRun = _textRuns[j];\n  299 |                         currentVisualIndex = j;\n  300 | \n  301 |                         if (currentRun is not ShapedTextRun)\n  302 |                         {\n  303 |                             continue;\n  304 |                         }\n  305 | \n  306 |                         shapedRun = (ShapedTextRun)currentRun;\n  307 | \n  308 |                         if (currentDistance + shapedRun.Size.Width <= distance)\n  309 |                         {\n  310 |                             currentDistance += shapedRun.Size.Width;\n  311 | \n  312 |                             continue;\n  313 |                         }\n  314 | \n  315 |                         return GetRunCharacterHit(currentRun, GetRunTextSourcePosition(j), distance - currentDistance);\n  316 |                     }","lines":40,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Media/TextFormatting/TextLineImpl.cs#L277-L316"}]},
{"id":"LOGIC_54","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"LB25 (number line-break rule) has a copy-paste bug in the `ClosePunctuation` (CL) sub-branches. For the pattern `NU (SY|IS)* CL × PR` and `NU (SY|IS)* CL × PO`, when the item immediately before the close punctuation is `SY` or `IS`, the code must look one further position back to confirm a `Numeric` (the `CloseParenthesis` branch does this correctly via `LineBreakState.Before(text, state.Previous)` at line 934). Instead, the `ClosePunctuation` branches test `state.PreviousClass == LineBreakClass.Numeric` while already inside `case LineBreakClass.BreakSymbols: case LineBreakClass.InfixNumeric:`, so the condition is always false and can never fire. As a result sequences such as `1.}` followed by a currency prefix/postfix (e.g. digit, infix separator, close-punctuation, then PR/PO) get an incorrect break opportunity that violates UAX #14 LB25.","fix":"Mirror the working `CloseParenthesis` branch (line 934): look one position further back. In both `ClosePunctuation` sub-cases replace the always-false self-comparison\n```\ncase LineBreakClass.BreakSymbols:\ncase LineBreakClass.InfixNumeric:\n    if (state.PreviousClass == LineBreakClass.Numeric)\n        return RuleResult.NoBreak;\n    break;\n```\nwith\n```\ncase LineBreakClass.BreakSymbols:\ncase LineBreakClass.InfixNumeric:\n    if (LineBreakState.Before(text, state.Previous).LineBreakClass == LineBreakClass.Numeric)\n        return RuleResult.NoBreak;\n    break;\n```","locations":[{"ref":"src/Avalonia.Base/Media/TextFormatting/Unicode/LineBreakEnumerator.cs:974-983","code":"  974 |                                         case LineBreakClass.BreakSymbols:\n  975 |                                         case LineBreakClass.InfixNumeric:\n  976 |                                             {\n  977 |                                                 if (state.PreviousClass == LineBreakClass.Numeric)\n  978 |                                                 {\n  979 |                                                     return RuleResult.NoBreak;\n  980 |                                                 }\n  981 | \n  982 |                                                 break;\n  983 |                                             }","lines":10,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Media/TextFormatting/Unicode/LineBreakEnumerator.cs#L974-L983"},{"ref":"src/Avalonia.Base/Media/TextFormatting/Unicode/LineBreakEnumerator.cs:1021-1042","code":" 1021 |                             case LineBreakClass.ClosePunctuation:\n 1022 |                                 {\n 1023 |                                     switch (state.PreviousClass)\n 1024 |                                     {\n 1025 |                                         case LineBreakClass.Numeric:\n 1026 |                                             {\n 1027 |                                                 return RuleResult.NoBreak;\n 1028 |                                             }\n 1029 |                                         case LineBreakClass.BreakSymbols:\n 1030 |                                         case LineBreakClass.InfixNumeric:\n 1031 |                                             {\n 1032 |                                                 if (state.PreviousClass == LineBreakClass.Numeric)\n 1033 |                                                 {\n 1034 |                                                     return RuleResult.NoBreak;\n 1035 |                                                 }\n 1036 | \n 1037 |                                                 break;\n 1038 |                                             }\n 1039 |                                     }\n 1040 | \n 1041 |                                     break;\n 1042 |                                 }","lines":22,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Media/TextFormatting/Unicode/LineBreakEnumerator.cs#L1021-L1042"}]},
{"id":"LOGIC_55","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"The `KeyFrameAnimation.Duration` setter validates the current field `_duration` instead of the incoming `value`. Because `_duration` defaults to a valid 1ms and is only ever assigned a valid value, the guard can never throw, so the public API accepts any duration (zero, negative, or huge). Invalid values then slip through and blow up later as a less clear `InvalidOperationException(\"Invalid animation duration\")` in the `KeyFrameAnimationInstance` constructor (which checks `_duration.Ticks <= 0`). Secondary defect: the doc/message say the maximum is \"24 days\" but the check uses `TimeSpan.FromDays(1)` (1 day).","fix":"Validate `value`, not `_duration`, and fix the bound to match the documented 24 days:\n```csharp\nset\n{\n    if (value < TimeSpan.FromMilliseconds(1) || value > TimeSpan.FromDays(24))\n        throw new ArgumentException(\"Minimum allowed value is 1ms and maximum allowed value is 24 days.\");\n    _duration = value;\n}\n```","locations":[{"ref":"src/Avalonia.Base/Rendering/Composition/Animations/KeyFrameAnimation.cs:43-52","code":"   43 |         public TimeSpan Duration\n   44 |         {\n   45 |             get => _duration;\n   46 |             set\n   47 |             {\n   48 |                 if (_duration < TimeSpan.FromMilliseconds(1) || _duration > TimeSpan.FromDays(1))\n   49 |                     throw new ArgumentException(\"Minimum allowed value is 1ms and maximum allowed value is 24 days.\");\n   50 |                 _duration = value;\n   51 |             }\n   52 |         }","lines":10,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Rendering/Composition/Animations/KeyFrameAnimation.cs#L43-L52"}]},
{"id":"LOGIC_56","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`BinaryExpression.Evaluate` evaluates `MoreThanOrEqual` as `left > right` and `LessThanOrEqual` as `left < right`, dropping the equality case entirely. `ExpressionVariant` only defines `operator >` and `operator <` (no `>=`/`<=`), and the parser correctly produces `MoreThanOrEqual`/`LessThanOrEqual` tokens for `>=`/`<=`. As a result any composition expression animation using `>=` or `<=` returns `false` when the operands are equal (e.g. `x >= 1` is false at `x == 1`).","fix":"Implement `>=`/`<=` semantics, e.g. add `operator >=`/`operator <=` to `ExpressionVariant` (returning `left.Double >= right.Double` etc.) and call them here, or express them as `!(left < right)` / `!(left > right)` for the `Double` case.","locations":[{"ref":"src/Avalonia.Base/Rendering/Composition/Expressions/Expression.cs:357-360","code":"  357 |             if (Type == ExpressionType.MoreThanOrEqual)\n  358 |                 return left > right;\n  359 |             if (Type == ExpressionType.LessThanOrEqual)\n  360 |                 return left < right;","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Rendering/Composition/Expressions/Expression.cs#L357-L360"}]},
{"id":"LOGIC_57","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`ServerCompositionTarget.RequestFullRedraw()` only sets `_redrawRequested`, not `_fullRedrawRequested`, despite its name and its sole use in `ServerCompositor.InvalidateAllCompositionTargets()` (called e.g. from the Wayland backend after surface reconfigure). When there are no dirty rects, `Render()` reaches `if (!DirtyRects.IsEmpty)` (line 252) with an empty dirty region and skips all drawing, so a requested \"full redraw\" repaints nothing. Only `_fullRedrawRequested` (line 239) causes `DirtyRects.Initialize`/`AddRect(renderBounds)` that forces a genuine full repaint.","fix":"Set the full-redraw flag so the whole surface is marked dirty:\n```csharp\npublic void RequestFullRedraw()\n{\n    _redrawRequested = true;\n    _fullRedrawRequested = true;\n}\n```","locations":[{"ref":"src/Avalonia.Base/Rendering/Composition/Server/ServerCompositionTarget.cs:361","code":"  361 |         public void RequestFullRedraw() => _redrawRequested = true;","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Rendering/Composition/Server/ServerCompositionTarget.cs#L361"}]},
{"id":"LOGIC_58","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"The non-subscribe evaluation path of `WidthQuery`/`HeightQuery` is more restrictive than the live activator path, so the same container query yields different results depending on `subscribe`. `WidthQuery.Evaluate` only matches when `Container.GetSizing(layoutable) == ContainerSizing.WidthAndHeight`, but the subscribed `WidthActivator` matches when sizing `is ContainerSizing.Width or ContainerSizing.WidthAndHeight` (see ScreenActivator.cs:18). Likewise `HeightQuery` requires `WidthAndHeight` while `HeightActivator` accepts `Height or WidthAndHeight` (ScreenActivator.cs:34). Consequently a container declared with `Container.Sizing = Width` (or `Height`) will match a width (height) query when tracked live, but not when evaluated immediately with `subscribe=false`.","fix":"Relax the non-subscribe sizing checks to match the activators. In `WidthQuery.Evaluate` use `Container.GetSizing(layoutable) is ContainerSizing.Width or ContainerSizing.WidthAndHeight` and in `HeightQuery.Evaluate` use `is ContainerSizing.Height or ContainerSizing.WidthAndHeight`.","locations":[{"ref":"src/Avalonia.Base/Styling/ScreenQueries.cs:26-34","code":"   26 |             if (ContainerQueryActivatorBase.GetContainer(visual, containerName) is { } container\n   27 |                 && container is Layoutable layoutable\n   28 |                 && Container.GetQueryProvider(layoutable) is { } queryProvider\n   29 |                 && Container.GetSizing(layoutable) == Styling.ContainerSizing.WidthAndHeight)\n   30 |             {\n   31 |                 return Evaluate(queryProvider, Argument);\n   32 |             }\n   33 | \n   34 |             return SelectorMatch.NeverThisInstance;","lines":9,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Styling/ScreenQueries.cs#L26-L34"},{"ref":"src/Avalonia.Base/Styling/ScreenQueries.cs:107-115","code":"  107 |             if (ContainerQueryActivatorBase.GetContainer(visual, containerName) is { } container\n  108 |                 && container is Layoutable layoutable\n  109 |                 && Container.GetQueryProvider(layoutable) is { } queryProvider\n  110 |                 && Container.GetSizing(layoutable) == Styling.ContainerSizing.WidthAndHeight)\n  111 |             {\n  112 |                 return Evaluate(queryProvider, Argument);\n  113 |             }\n  114 | \n  115 |             return SelectorMatch.NeverThisInstance;","lines":9,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Styling/ScreenQueries.cs#L107-L115"}]},
{"id":"LOGIC_59","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`StyleChildren.SetItem` (invoked when replacing a nested style via the collection indexer, e.g. `someStyle.Children[i] = newStyle`) sets the new item's parent and adds it as a resource owner, but never clears the parent of the item being replaced nor removes it from the resource host. Compare with `RemoveItem`, which correctly calls `SetParent(null)` and `RemoveOwner(host)` on the removed item. As a result the replaced style keeps a stale `Parent` reference and stays registered as a resource owner of the host after it has been removed from the tree - a resource/reference leak and incorrect state.","fix":"Un-parent and remove the owner of the outgoing item before inserting the replacement, mirroring `RemoveItem`:\n```csharp\nprotected override void SetItem(int index, IStyle item)\n{\n    var oldItem = Items[index];\n    (oldItem as StyleBase)?.SetParent(null);\n    if (_owner.Owner is IResourceHost oldHost)\n        (oldItem as IResourceProvider)?.RemoveOwner(oldHost);\n\n    (item as StyleBase)?.SetParent(_owner);\n    base.SetItem(index, item);\n    if (_owner.Owner is IResourceHost host)\n        (item as IResourceProvider)?.AddOwner(host);\n}\n```","locations":[{"ref":"src/Avalonia.Base/Styling/StyleChildren.cs:27-33","code":"   27 |         protected override void SetItem(int index, IStyle item)\n   28 |         {\n   29 |             (item as StyleBase)?.SetParent(_owner);\n   30 |             base.SetItem(index, item);\n   31 |             if (_owner.Owner is IResourceHost host)\n   32 |                 (item as IResourceProvider)?.AddOwner(host);\n   33 |         }","lines":7,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Styling/StyleChildren.cs#L27-L33"}]},
{"id":"LOGIC_60","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`ReadOnlySpan<char>.IndexOf(ReadOnlySpan<char> v, StringComparison, int start)` in the netstandard2.0 build-task span shim is broken. The inner loop compares the candidate against `v`, but `return c` is placed *outside* and unconditionally after that loop, so the method returns the first index where only `v[0]` matches - not where the whole substring `v` matches. The `StringComparison` argument is also ignored entirely. Worse, `this[c + i]` is indexed for `i` up to `v.Length-1` with no bounds check, so when a partial match starts near the end of the span (`c + i >= _length`) it reads past the backing string and throws `IndexOutOfRangeException`. This shim is compiled for the netstandard2.0 build task (the only target), so any consumer of this overload gets wrong results or a crash.","fix":"Track full-match success and bound the inner loop, e.g.:\n```csharp\nfor (var c = start; c + v.Length <= _length; c++)\n{\n    var match = true;\n    for (var i = 0; i < v.Length; i++)\n    {\n        if (this[c + i] != v[i]) { match = false; break; }\n    }\n    if (match)\n        return c;\n}\nreturn -1;\n```","locations":[{"ref":"src/Avalonia.Build.Tasks/SpanCompat.cs:91-114","code":"   91 |         internal int IndexOf(ReadOnlySpan<char> v, StringComparison ordinal, int start = 0)\n   92 |         {\n   93 |             if(Length == 0 || v.IsEmpty)\n   94 |             {\n   95 |                 return -1;\n   96 |             }\n   97 | \n   98 |             for (var c = start; c < _length; c++)\n   99 |             {\n  100 |                 if (this[c] == v[0])\n  101 |                 {\n  102 |                     for(var i = 0; i < v.Length; i++)\n  103 |                     {\n  104 |                         if (this[c + i] != v[i])\n  105 |                         {\n  106 |                             break;\n  107 |                         }\n  108 |                     } \n  109 |                     return c;\n  110 |                 }\n  111 |             }\n  112 | \n  113 |             return -1;\n  114 |         }","lines":24,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Build.Tasks/SpanCompat.cs#L91-L114"}]},
{"id":"LOGIC_61","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In ColorSpectrum.UpdateEllipse() the Box-shape branch computes hPercent/sPercent/vPercent by dividing by (max - min) with no guard against max == min. The Ring-shape branch of the same method explicitly guards every one of these divisions with a `_maxX != _minX ? ... : 0` check. When MinHue==MaxHue (or MinSaturation==MaxSaturation, or MinValue==MaxValue) - a supported configuration used to pin an axis to a single value - the Box branch divides by zero, yielding NaN percentages and NaN x/y positions passed to Canvas.SetLeft/SetTop, mispositioning (or failing to position) the selection ellipse.","fix":"Guard each division the same way the Ring branch does, e.g.:\n```csharp\ndouble hPercent = _maxHueFromLastBitmapCreation != _minHueFromLastBitmapCreation\n    ? (hsvColor.H - _minHueFromLastBitmapCreation) / (_maxHueFromLastBitmapCreation - _minHueFromLastBitmapCreation)\n    : 0;\n```\nand likewise for sPercent and vPercent.","locations":[{"ref":"src/Avalonia.Controls.ColorPicker/ColorSpectrum/ColorSpectrum.cs:837-839","code":"  837 |                 double hPercent = (hsvColor.H - _minHueFromLastBitmapCreation) / (_maxHueFromLastBitmapCreation - _minHueFromLastBitmapCreation);\n  838 |                 double sPercent = (hsvColor.S * 100.0 - _minSaturationFromLastBitmapCreation) / (_maxSaturationFromLastBitmapCreation - _minSaturationFromLastBitmapCreation);\n  839 |                 double vPercent = (hsvColor.V * 100.0 - _minValueFromLastBitmapCreation) / (_maxValueFromLastBitmapCreation - _minValueFromLastBitmapCreation);","lines":3,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls.ColorPicker/ColorSpectrum/ColorSpectrum.cs#L837-L839"}]},
{"id":"LOGIC_62","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`ConnectedAnimation.Dispose` restores `_activeDestination.Opacity` when disposed mid-flight, but never restores the coordinated elements whose opacity was set to 0 at the start of `RunAnimationCoreAsync`/`RunFallbackAnimationAsync`. If the animation is disposed while running (e.g. `PrepareToAnimate` is called again with the same key, which disposes the running animation), the cancellation propagates through `_animationCts` and is swallowed by the `catch (OperationCanceledException)` in `RunAnimationAsync`, leaving the coordinated UI elements permanently invisible (opacity 0).","fix":"Track the coordinated elements and their original opacities in active-flight state (like `_activeDestination`) and restore them in `Dispose` when `wasMidFlight` is true, mirroring the restore loop already present at the end of the normal completion path.","locations":[{"ref":"src/Avalonia.Controls/Animation/ConnectedAnimation.cs:170-203","code":"  170 |         public void Dispose()\n  171 |         {\n  172 |             if (_disposed) return;\n  173 |             _disposed = true;\n  174 | \n  175 |             CancelTimeout();\n  176 |             _service.RemoveAnimation(_key);\n  177 |             _animationCts?.Cancel();\n  178 |             _animationCts?.Dispose();\n  179 |             _animationCts = null;\n  180 |             _animationTimer?.Stop();\n  181 |             _animationTimer = null;\n  182 | \n  183 |             var wasMidFlight = _activeDestination != null;\n  184 | \n  185 |             if (_activeDestination != null)\n  186 |             {\n  187 |                 _activeDestination.Opacity = _activeDestOriginalOpacity;\n  188 |                 _activeDestination = null;\n  189 |             }\n  190 | \n  191 |             if (_activeProxy != null && _activeOverlayLayer != null)\n  192 |             {\n  193 |                 _activeOverlayLayer.Children.Remove(_activeProxy);\n  194 |                 _activeProxy = null;\n  195 |                 _activeOverlayLayer = null;\n  196 |             }\n  197 | \n  198 |             _sourceSnapshot?.Dispose();\n  199 |             _sourceSnapshot = null;\n  200 | \n  201 |             if (wasMidFlight)\n  202 |                 Completed?.Invoke(this, new ConnectedAnimationCompletedEventArgs(cancelled: true));\n  203 |         }","lines":34,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/Animation/ConnectedAnimation.cs#L170-L203"},{"ref":"src/Avalonia.Controls/Animation/ConnectedAnimation.cs:350-357","code":"  350 |             var originalOpacities = new double[coordinatedElements.Count];\n  351 |             for (int i = 0; i < coordinatedElements.Count; i++)\n  352 |             {\n  353 |                 if (ReferenceEquals(coordinatedElements[i], destination))\n  354 |                     continue;\n  355 |                 originalOpacities[i] = coordinatedElements[i].Opacity;\n  356 |                 coordinatedElements[i].Opacity = 0;\n  357 |             }","lines":8,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/Animation/ConnectedAnimation.cs#L350-L357"}]},
{"id":"LOGIC_63","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`AutoCompleteBox.PopulateAsync` disposes and nulls the shared field `_populationCancellationTokenSource` in its `finally`, but with a fast-typing user the field may already have been reassigned to a newer request's token source by a subsequent `TryPopulateAsync` call (both methods run interleaved on the UI thread across `await` points). The completing older invocation then (1) disposes a `CancellationTokenSource` that the newer in-flight `PopulateAsync` is still relying on, and (2) sets the field to null, so a later keystroke cannot cancel the still-running newer request - allowing stale async results to overwrite the items source.","fix":"Only clear/dispose the field if it still refers to this invocation's own source. Capture the CTS locally in `TryPopulateAsync`, pass it to `PopulateAsync`, and in the `finally` do `if (ReferenceEquals(_populationCancellationTokenSource, myCts)) { _populationCancellationTokenSource = null; } myCts.Dispose();` so a newer request's source is never disposed or orphaned.","locations":[{"ref":"src/Avalonia.Controls/AutoCompleteBox/AutoCompleteBox.cs:1082-1112","code":" 1082 |         private async Task PopulateAsync(string? searchText, CancellationToken cancellationToken)\n 1083 |         {\n 1084 | \n 1085 |             try\n 1086 |             {\n 1087 |                 IEnumerable<object> result = await AsyncPopulator!.Invoke(searchText, cancellationToken);\n 1088 |                 var resultList = result.ToList();\n 1089 | \n 1090 |                 if (cancellationToken.IsCancellationRequested)\n 1091 |                 {\n 1092 |                     return;\n 1093 |                 }\n 1094 | \n 1095 |                 await Dispatcher.UIThread.InvokeAsync(() =>\n 1096 |                 {\n 1097 |                     if (!cancellationToken.IsCancellationRequested)\n 1098 |                     {\n 1099 |                         SetCurrentValue(ItemsSourceProperty, resultList);\n 1100 |                         PopulateComplete();\n 1101 |                     }\n 1102 |                 });\n 1103 |             }\n 1104 |             catch (TaskCanceledException)\n 1105 |             { }\n 1106 |             finally\n 1107 |             {\n 1108 |                 _populationCancellationTokenSource?.Dispose();\n 1109 |                 _populationCancellationTokenSource = null;\n 1110 |             }\n 1111 | \n 1112 |         }","lines":31,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/AutoCompleteBox/AutoCompleteBox.cs#L1082-L1112"},{"ref":"src/Avalonia.Controls/AutoCompleteBox/AutoCompleteBox.cs:1064-1081","code":" 1064 |         private bool TryPopulateAsync(string? searchText)\n 1065 |         {\n 1066 |             _populationCancellationTokenSource?.Cancel(false);\n 1067 |             _populationCancellationTokenSource?.Dispose();\n 1068 |             _populationCancellationTokenSource = null;\n 1069 | \n 1070 |             if (AsyncPopulator == null)\n 1071 |             {\n 1072 |                 return false;\n 1073 |             }\n 1074 | \n 1075 |             _populationCancellationTokenSource = new CancellationTokenSource();\n 1076 |             var task = PopulateAsync(searchText, _populationCancellationTokenSource.Token);\n 1077 |             if (task.Status == TaskStatus.Created)\n 1078 |                 task.Start();\n 1079 | \n 1080 |             return true;\n 1081 |         }","lines":18,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/AutoCompleteBox/AutoCompleteBox.cs#L1064-L1081"}]},
{"id":"LOGIC_64","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The keyboard `Home`/`End` navigation paths call `ProcessSelection(shift, selectedDate, null)` with a null `index`. `ProcessSelection` uses `index == null && !shift` as the sole discriminator for \"this is a tap-range selection\" (the tap feature was intended for pointer taps, which call `ProcessTapRangeSelection` directly from `CalendarItem`). As a result, when `AllowTapRangeSelection` is enabled (its default) and `SelectionMode` is `SingleRange`/`MultipleRange`, pressing `Home` or `End` no longer simply selects the first/last day of the month - it arms/completes a tap range. `Home` then `End` selects the whole month instead of moving the single selection. Arrow keys are unaffected (they pass a non-null index) and PageUp/PageDown without shift return early, so only Home/End regress.","fix":"Distinguish keyboard navigation from pointer taps by an explicit flag rather than by `index == null`. E.g. add a parameter such as `bool fromTap` to `ProcessSelection` (only the pointer path in `CalendarItem` should pass `true`), or gate the tap branch on `IsMouseSelection`, so that keyboard `Home`/`End` continue to run the normal range/single-selection logic.","locations":[{"ref":"src/Avalonia.Controls/Calendar/Calendar.cs:1624-1632","code":" 1624 |             // Handle tap range selection.\n 1625 |             if (lastSelectedDate != null && index == null && !shift)\n 1626 |             {\n 1627 |                 if (ProcessTapRangeSelection(lastSelectedDate.Value))\n 1628 |                 {\n 1629 |                     OnDayClick(lastSelectedDate.Value);\n 1630 |                     return;\n 1631 |                 }\n 1632 |             }","lines":9,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/Calendar/Calendar.cs#L1624-L1632"},{"ref":"src/Avalonia.Controls/Calendar/Calendar.cs:2023-2084","code":" 2023 |         internal void ProcessHomeKey(bool shift)\n 2024 |         {\n 2025 |             switch (DisplayMode)\n 2026 |             {\n 2027 |                 case CalendarMode.Month:\n 2028 |                     {\n 2029 |                         // REMOVE_RTM: Not all types of calendars start with Day1. If Non-Gregorian is supported check this:\n 2030 |                         DateTime? selectedDate = new DateTime(DisplayDateInternal.Year, DisplayDateInternal.Month, 1);\n 2031 |                         ProcessSelection(shift, selectedDate, null);\n 2032 |                         break;\n 2033 |                     }\n 2034 |                 case CalendarMode.Year:\n 2035 |                     {\n 2036 |                         DateTime selectedMonth = new DateTime(_selectedMonth.Year, 1, 1);\n 2037 |                         OnSelectedMonthChanged(selectedMonth);\n 2038 |                         break;\n 2039 |                     }\n 2040 |                 case CalendarMode.Decade:\n 2041 |                     {\n 2042 |                         DateTime? selectedYear = new DateTime(DateTimeHelper.DecadeOfDate(SelectedYear), 1, 1);\n 2043 |                         OnSelectedYearChanged(selectedYear);\n 2044 |                         break;\n 2045 |                     }\n 2046 |             }\n 2047 |         }\n 2048 |         internal void ProcessEndKey(bool shift)\n 2049 |         {\n 2050 |             switch (DisplayMode)\n 2051 |             {\n 2052 |                 case CalendarMode.Month:\n 2053 |                     {\n 2054 |                         DateTime? selectedDate = new DateTime(DisplayDateInternal.Year, DisplayDateInternal.Month, 1);\n 2055 | \n 2056 |                         if (DateTimeHelper.CompareYearMonth(DateTime.MaxValue, selectedDate.Value) > 0)\n 2057 |                         {\n 2058 |                             // since DisplayDate is not equal to\n 2059 |                             // DateTime.MaxValue we are sure selectedDate is\\\n 2060 |                             // not null\n 2061 |                             selectedDate = DateTimeHelper.AddMonths(selectedDate.Value, 1)!.Value;\n 2062 |                             selectedDate = DateTimeHelper.AddDays(selectedDate.Value, -1)!.Value;\n 2063 |                         }\n 2064 |                         else\n 2065 |                         {\n 2066 |                             selectedDate = DateTime.MaxValue;\n 2067 |                         }\n 2068 |                         ProcessSelection(shift, selectedDate, null);\n 2069 |                         break;\n 2070 |                     }\n 2071 |                 case CalendarMode.Year:\n 2072 |                     {\n 2073 |                         DateTime selectedMonth = new DateTime(_selectedMonth.Year, 12, 1);\n 2074 |                         OnSelectedMonthChanged(selectedMonth);\n 2075 |                         break;\n 2076 |                     }\n 2077 |                 case CalendarMode.Decade:\n 2078 |                     {\n 2079 |                         DateTime? selectedYear = new DateTime(DateTimeHelper.EndOfDecade(SelectedYear), 1, 1);\n 2080 |                         OnSelectedYearChanged(selectedYear);\n 2081 |                         break;\n 2082 |                     }\n 2083 |             }\n 2084 |         }","lines":62,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/Calendar/Calendar.cs#L2023-L2084"}]},
{"id":"LOGIC_65","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `DateTimePickerPanel.SelectedValue`'s setter, the coerced value is stored in `_selectedValue`, but `_selectedIndex` is computed from the raw, un-coerced `value`:\n```csharp\nvar sel = CoerceSelected(value);\n_selectedValue = sel;\n_selectedIndex = (value - MinimumValue) / Increment;   // uses `value`, not `sel`\n```\nWhen `Increment > 1` and the incoming value is not a multiple of `Increment`, `CoerceSelected` snaps `_selectedValue` to the nearest aligned value, but `_selectedIndex` is left computed from the un-snapped value, so the two disagree. `_selectedIndex` drives the scroll `_offset` (lines 180-181) and item arrangement/highlighting (ArrangeOverride/UpdateItems), so the panel centers/positions the wrong item relative to the highlighted selection. This is reachable from `TimePickerPresenter.InitPicker`, which does `items._minuteSelector.Increment = MinuteIncrement; items._minuteSelector.SelectedValue = Time.Minutes;` - e.g. a `MinuteIncrement` of 20 with a selected time whose minute is 23 snaps `_selectedValue` to 20 (index 1) but sets `_selectedIndex` to 23/20 = 1... more clearly with increment 15 and minute 23: `_selectedValue` becomes 30 (index 2) while `_selectedIndex` becomes 1.","fix":"Derive the index from the coerced value:\n```csharp\nvar sel = CoerceSelected(value);\n_selectedValue = sel;\n_selectedIndex = (sel - MinimumValue) / Increment;\n```\nNote also `CoerceSelected` (lines 533-547) has latent bugs that only avoid firing because every increment>1 caller currently uses `MinimumValue == 0`: `Enumerable.Range(MinimumValue, MaximumValue + 1)` passes a COUNT (should be `MaximumValue - MinimumValue + 1`), and `return items.IndexOf(nearest) * Increment;` returns an index-scaled value rather than `nearest` itself. Consider returning `nearest` directly.","locations":[{"ref":"src/Avalonia.Controls/DateTimePickers/DateTimePickerPanel.cs:172-174","code":"  172 |                 var sel = CoerceSelected(value);\n  173 |                 _selectedValue = sel;\n  174 |                 _selectedIndex = (value - MinimumValue) / Increment;","lines":3,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/DateTimePickers/DateTimePickerPanel.cs#L172-L174"}]},
{"id":"LOGIC_66","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`Span.OnPropertyChanged` switches on `change.Property.Name` and compares it against `nameof(InlinesProperty)`, which evaluates to the string \"InlinesProperty\". However the property's registered/CLR name is \"Inlines\" (`InlinesProperty` was registered with `nameof(Inlines)`), so `change.Property.Name` is \"Inlines\". The `case` therefore NEVER matches and `OnInlinesChanged(...)` is effectively dead. Consequences when the `Inlines` property is reassigned (e.g. `span.Inlines = newCollection` or an `Inlines=\"{Binding}\"` binding): the old collection is never detached (its `LogicalChildren`/`InlineHost` are not cleared and its `Invalidated` handler stays subscribed - a leak), and the new collection is never wired up (`LogicalChildren`, `InlineHost`, and the `Invalidated` subscription are not set), so children of the new collection do not enter the logical tree and invalidation via the `Invalidated` event is lost. Every sibling handler (`Run`, `Inline`, `TextElement`, and `TextBlock.cs:878`) correctly uses the CLR name.","fix":"Match the CLR property name like every other handler:\n```csharp\nswitch (change.Property.Name)\n{\n    case nameof(Inlines):\n        OnInlinesChanged(change.OldValue as InlineCollection, change.NewValue as InlineCollection);\n        InlineHost?.Invalidate();\n        break;\n}\n```","locations":[{"ref":"src/Avalonia.Controls/Documents/Span.cs:74-80","code":"   74 |             switch (change.Property.Name)\n   75 |             {\n   76 |                 case nameof(InlinesProperty):\n   77 |                     OnInlinesChanged(change.OldValue as InlineCollection, change.NewValue as InlineCollection);\n   78 |                     InlineHost?.Invalidate();\n   79 |                     break;\n   80 |             }","lines":7,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/Documents/Span.cs#L74-L80"}]},
{"id":"LOGIC_67","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"ItemsSourceView.RemoveListenerIfNecessary only tears down the underlying collection-changed listener when both _collectionChanged and _postCollectionChanged are null, but it ignores _preCollectionChanged. AddListenerIfNecessary is called by all three event accessors (CollectionChanged, PreCollectionChanged, PostCollectionChanged), so the removal condition is asymmetric. Concretely: subscribe to PreCollectionChanged (adds the listener), then subscribe to and later unsubscribe from CollectionChanged. The unsubscribe runs RemoveListenerIfNecessary, sees _collectionChanged==null and _postCollectionChanged==null, removes the underlying listener and sets _listening=false, even though PreCollectionChanged still has a live subscriber. From then on Pre notifications are silently lost.","fix":"Include _preCollectionChanged in the guard so the listener is only removed when there are no subscribers at all:\n```csharp\nif (_listening && _collectionChanged is null && _preCollectionChanged is null && _postCollectionChanged is null)\n```","locations":[{"ref":"src/Avalonia.Controls/ItemsSourceView.cs:299-307","code":"  299 |         private void RemoveListenerIfNecessary()\n  300 |         {\n  301 |             if (_listening && _collectionChanged is null && _postCollectionChanged is null)\n  302 |             {\n  303 |                 if (_source is INotifyCollectionChanged incc)\n  304 |                     CollectionChangedEventManager.Instance.RemoveListener(incc, this);\n  305 |                 _listening = false;\n  306 |             }\n  307 |         }","lines":9,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/ItemsSourceView.cs#L299-L307"}]},
{"id":"LOGIC_68","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`GetNextCharacterPosition` computes the next edit position via `MaskProvider.FindEditPositionFrom(startPosition, true)` (which returns -1 / `MaskedTextProvider.InvalidIndex` when no edit position exists), but then guards the return with `if (CaretIndex != -1)` instead of `if (position != -1)`. The control's `CaretIndex` is essentially never -1 (the TextBox coerces it to a non-negative value), so the guard is effectively dead: the method always returns `position`, including when `position == -1`. Callers (`OnTextInput`, paste handling) then use this as a caret index / insertion position, producing incorrect caret movement when the mask has no further edit position.","fix":"Guard on the computed `position`, not on `CaretIndex`:\n```csharp\nprivate int GetNextCharacterPosition(int startPosition)\n{\n    if (MaskProvider != null)\n    {\n        var position = MaskProvider.FindEditPositionFrom(startPosition, true);\n        if (position != -1)\n        {\n            return position;\n        }\n    }\n    return startPosition;\n}\n```","locations":[{"ref":"src/Avalonia.Controls/MaskedTextBox.cs:416-427","code":"  416 |         private int GetNextCharacterPosition(int startPosition)\n  417 |         {\n  418 |             if (MaskProvider != null)\n  419 |             {\n  420 |                 var position = MaskProvider.FindEditPositionFrom(startPosition, true);\n  421 |                 if (CaretIndex != -1)\n  422 |                 {\n  423 |                     return position;\n  424 |                 }\n  425 |             }\n  426 |             return startPosition;\n  427 |         }","lines":12,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/MaskedTextBox.cs#L416-L427"}]},
{"id":"LOGIC_69","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"AccessText.TextChanged re-registers the control with the access-key handler every time the Text changes, but never unregisters the previous registration first. AccessKeyHandler.Register only removes dead (garbage-collected) entries with a matching key, not live duplicates, so (a) after the access key changes (e.g. text goes from \"_File\" to \"_Save\") the old key ('F') still triggers this element, and (b) repeatedly changing Text accumulates unbounded live registrations for the same element, causing the access key to fire multiple times and the handler's registration list to grow without bound. OnAttachedToVisualTree also registers once, so a single post-attach text change already produces a duplicate.","fix":"Unregister the element before (re)registering in TextChanged, e.g. call `_accessKeys?.Unregister(this)` at the start of the `if (_accessKeys != null ...)` block (or whenever AccessKey changes) before `_accessKeys.Register(AccessKey, this)`.","locations":[{"ref":"src/Avalonia.Controls/Primitives/AccessText.cs:155-176","code":"  155 |         private void TextChanged(string? text)\n  156 |         {\n  157 |             string? key = null;\n  158 | \n  159 |             if (text != null)\n  160 |             {\n  161 |                 int underscore = text.IndexOf('_');\n  162 | \n  163 |                 if (underscore != -1 && underscore < text.Length - 1)\n  164 |                 {\n  165 |                     var rune = Rune.GetRuneAt(text, underscore + 1);\n  166 |                     key = rune.ToString();\n  167 |                 }\n  168 |             }\n  169 | \n  170 |             AccessKey = key;\n  171 | \n  172 |             if (_accessKeys != null && !string.IsNullOrEmpty(AccessKey))\n  173 |             {\n  174 |                 _accessKeys.Register(AccessKey, this);\n  175 |             }\n  176 |         }","lines":22,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/Primitives/AccessText.cs#L155-L176"}]},
{"id":"LOGIC_70","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `ManagedPopupPositioner.Calculate`, the horizontal resize (ResizeX) path computes the clamped width as `bounds.Width - unconstrainedRect.X`, which is only correct when `bounds.X == 0`. The symmetric vertical path (ResizeY) correctly uses `bounds.Bottom - unconstrainedRect.Y`. When the target screen/working-area has a non-zero left origin (e.g. a secondary monitor positioned to the right, where WorkingArea.X > 0, as produced by ManagedPopupPositionerPopupImplHelper), the popup width is over- or under-sized by `bounds.X` because the right edge is not `bounds.Width` but `bounds.Right`.","fix":"Use the right edge instead of the raw width: `unconstrainedRect = unconstrainedRect.WithWidth(bounds.Right - unconstrainedRect.X);` to match the ResizeY implementation at lines 219-222.","locations":[{"ref":"src/Avalonia.Controls/Primitives/PopupPositioning/ManagedPopupPositioner.cs:182-185","code":"  182 |                 if (!FitsInBounds(unconstrainedRect, PopupAnchor.Right))\n  183 |                 {\n  184 |                     unconstrainedRect = unconstrainedRect.WithWidth(bounds.Width - unconstrainedRect.X);\n  185 |                 }","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/Primitives/PopupPositioning/ManagedPopupPositioner.cs#L182-L185"}]},
{"id":"LOGIC_71","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`ApplyThumbDrag` computes `var factor = e.Vector / delta;` without guarding against `delta == 0`. `delta` is `ValueFromDistance(...)` which is 0 whenever `Density` is 0 (e.g. a Slider configured with `Minimum == Maximum`) or the drag vector is orthogonal to the track. Dividing a non-zero `Vector` by 0 yields infinities, and the subsequent `_lastDrag = (Value - oldValue) * factor` produces `0 * Infinity = NaN`. This NaN is stored in `_lastDrag` and later fed into `CalculateThumbAdjustment` / `Thumb.AdjustDrag` on the next arrange pass, corrupting the thumb's drag tracking.","fix":"Guard against a zero delta before dividing, e.g. `var factor = delta == 0 ? default : e.Vector / delta;` and skip updating `_lastDrag` (or set it to `default`) when `delta` is 0.","locations":[{"ref":"src/Avalonia.Controls/Primitives/Track.cs:481-495","code":"  481 |         private void ApplyThumbDrag(VectorEventArgs e)\n  482 |         {\n  483 |             var delta = ValueFromDistance(e.Vector.X, e.Vector.Y);\n  484 |             var factor = e.Vector / delta;\n  485 |             var oldValue = Value;\n  486 | \n  487 |             SetCurrentValue(ValueProperty, MathUtilities.Clamp(\n  488 |                 Value + delta,\n  489 |                 Minimum,\n  490 |                 Maximum));\n  491 | \n  492 |             // Record the part of the drag that actually had effect as the last drag delta.\n  493 |             // Due to clamping, we need to compare the two values instead of using the drag delta.\n  494 |             _lastDrag = (Value - oldValue) * factor;\n  495 |         }","lines":15,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/Primitives/Track.cs#L481-L495"}]},
{"id":"LOGIC_72","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In the `Pending` state branch of `InteractionRatioObserver`, the conditions are ordered so that the retract-to-zero case is unreachable. `if (_interactionRatio <= _executingRatio)` is evaluated before `else if (_interactionRatio <= 0)`. Since `_executingRatio` is 0.8, any value `<= 0` also satisfies `<= _executingRatio`, so the `<= 0 -> Idle` transition can never fire and a fully retracted pull while Pending is incorrectly treated as Interacting instead of resetting to Idle. The analogous `Interacting` branch above correctly tests `<= 0` first.","fix":"Reorder the checks so `_interactionRatio <= 0` is tested first (as in the Interacting branch): test `if (_interactionRatio <= 0) -> Idle`, then `else if (_interactionRatio <= _executingRatio) -> Interacting`, then `else UpdateContent()`.","locations":[{"ref":"src/Avalonia.Controls/PullToRefresh/RefreshVisualizer.cs:507-521","code":"  507 |                 else if (RefreshVisualizerState == RefreshVisualizerState.Pending)\n  508 |                 {\n  509 |                     if (_interactionRatio <= _executingRatio)\n  510 |                     {\n  511 |                         RefreshVisualizerState = RefreshVisualizerState.Interacting;\n  512 |                     }\n  513 |                     else if (_interactionRatio <= 0)\n  514 |                     {\n  515 |                         RefreshVisualizerState = RefreshVisualizerState.Idle;\n  516 |                     }\n  517 |                     else\n  518 |                     {\n  519 |                         UpdateContent();\n  520 |                     }\n  521 |                 }","lines":15,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/PullToRefresh/RefreshVisualizer.cs#L507-L521"}]},
