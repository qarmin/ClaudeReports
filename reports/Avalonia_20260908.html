{"id":"LOGIC_73","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In OnItemsAdded the anchor index is shifted using the *selected* index's condition. `shiftCount` is derived solely from `SelectedIndex >= index`, then applied to both `_selectedIndex` and `_anchorIndex`. When the anchor and the selected index sit on opposite sides of the insertion point the anchor is adjusted incorrectly: e.g. SelectedIndex=2, AnchorIndex=5, inserting one item at index 4 leaves the anchor at 5 (it should become 6), and SelectedIndex=5, AnchorIndex=2 inserting at index 4 wrongly bumps the anchor to 3. The sibling method OnItemsRemoved (lines 408-431) correctly tests each index independently. A stale anchor corrupts subsequent shift-range selections.","fix":"Compute the anchor shift from the anchor's own position, mirroring OnItemsRemoved:\n```csharp\nif (SelectedIndex >= index)\n    _selectedIndex += count;\nif (AnchorIndex >= index)\n    _anchorIndex += count;\nvar shifted = SelectedIndex >= index || AnchorIndex >= index;\n```","locations":[{"ref":"src/Avalonia.Controls/Selection/SelectionModel.cs:381-385","code":"  381 |             var shifted = SelectedIndex >= index;\n  382 |             var shiftCount = shifted ? count : 0;\n  383 | \n  384 |             _selectedIndex += shiftCount;\n  385 |             _anchorIndex += shiftCount;","lines":5,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/Selection/SelectionModel.cs#L381-L385"}]},
{"id":"LOGIC_74","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"Arc passes the arc's angular span (`angleGap`) as the `rotationAngle` argument of `ArcTo`. That parameter is documented as the rotation (in radians) of the ellipse's x-axis, not the sweep of the arc. For non-circular bounds (width != height) this rotates the underlying ellipse by the sweep amount, producing a distorted/incorrect arc. The analogous Sector control correctly passes `rotationAngle: 0.0d`.","fix":"Pass `rotationAngle: 0` to `context.ArcTo(...)` (an axis-aligned ellipse has no rotation); keep `isLargeArc: angleGap >= Math.PI`.","locations":[{"ref":"src/Avalonia.Controls/Shapes/Arc.cs:95-100","code":"   95 |                     context.ArcTo(\n   96 |                         endPoint,\n   97 |                         new Size(radiusX, radiusY),\n   98 |                         rotationAngle: angleGap,\n   99 |                         isLargeArc: angleGap >= Math.PI,\n  100 |                         SweepDirection.Clockwise);","lines":6,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/Shapes/Arc.cs#L95-L100"}]},
{"id":"LOGIC_75","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"When an intermediate ancestor changes, `FinderNode.OnValueChanged` disposes the previous child node (`_child?.Dispose()`). `FinderNode.Dispose` calls `_subject.OnCompleted()`, and because a parent node subscribes its own `_subject` to the child's observable (`_child.Observable.Subscribe(_subject)`), completing the child's subject propagates `OnCompleted` up to the parent subject and out to the outer observer. This permanently tears down the whole ancestor-tracking chain: the newly created child is then subscribed to an already-completed subject and never emits again. AncestorFinder is used by HotkeyManager to track the TopLevel ancestor, so reparenting a hot-key-bound control through an intermediate element a second time silently stops the hotkey from working.","fix":"Do not conflate teardown with re-parenting. Store the subscription returned by `_child.Observable.Subscribe(_subject)` and dispose only that subscription (plus the child's inner `_disposable`) when replacing the child, without calling the parent subject's `OnCompleted`. Only call `_subject.OnCompleted()` in the outer teardown path. For example, split `Dispose()` into a `DisposeChild()` that tears down the child chain and its subscription without completing this node's subject, and keep `OnCompleted()` only in the top-level dispose.","locations":[{"ref":"src/Avalonia.Controls/Utils/AncestorFinder.cs:29-47","code":"   29 |             private void OnValueChanged(StyledElement? next)\n   30 |             {\n   31 |                 if (next == null || _ancestorType.IsInstanceOfType(next))\n   32 |                     _subject.OnNext(next);\n   33 |                 else\n   34 |                 {\n   35 |                     _child?.Dispose();\n   36 |                     _child = new FinderNode(next, _ancestorType);\n   37 |                     _child.Observable.Subscribe(_subject);\n   38 |                     _child.Init();\n   39 |                 }\n   40 |             }\n   41 | \n   42 |             public void Dispose()\n   43 |             {\n   44 |                 _child?.Dispose();\n   45 |                 _subject.OnCompleted();\n   46 |                 _disposable?.Dispose();\n   47 |             }","lines":19,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/Utils/AncestorFinder.cs#L29-L47"}]},
{"id":"LOGIC_76","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"RemoveInternalChildRange removes logical children with the loop `for (var i = index; i < count; ++i)`, which iterates the wrong range. When `index > 0` it detaches too few (or, if `index >= count`, zero) logical children while `Children.RemoveRange(index, count)` still removes `count` visual children. The bound must be `index + count`. This leaks logical-tree references (and skips generator cleanup) for any derived virtualizing panel that calls it with a non-zero start index.","fix":"Change the loop bound to cover the actual range:\n```csharp\nfor (var i = index; i < index + count; ++i)\n{\n    var c = Children[i];\n    itemsControl.RemoveLogicalChild(c);\n}\n```","locations":[{"ref":"src/Avalonia.Controls/VirtualizingPanel.cs:183-194","code":"  183 |         protected void RemoveInternalChildRange(int index, int count)\n  184 |         {\n  185 |             var itemsControl = EnsureItemsControl();\n  186 |             \n  187 |             for (var i = index; i < count; ++i)\n  188 |             {\n  189 |                 var c = Children[i];\n  190 |                 itemsControl.RemoveLogicalChild(c);\n  191 |             }\n  192 | \n  193 |             Children.RemoveRange(index, count);\n  194 |         }","lines":12,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/VirtualizingPanel.cs#L183-L194"}]},
{"id":"LOGIC_77","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"The guard `if (u <= viewport.anchorU)` compares `u` to `viewport.anchorU`, but `u` was just assigned `viewport.anchorU` two lines above, so the condition is always true. The comment says elements should be recycled only when the anchor is at/before the viewport start, implying the intended comparison is against `viewport.viewportUStart`. As written it unconditionally recycles all realized elements before the anchor on every measure pass; the subsequent backward realization then recreates the buffered elements above the viewport from the recycle pool, churning containers each layout cycle.","fix":"Compare against the viewport start instead: `if (u <= viewport.viewportUStart)` so elements before the anchor are only recycled when the anchor actually sits at or before the viewport start.","locations":[{"ref":"src/Avalonia.Controls/VirtualizingStackPanel.cs:964-967","code":"  964 |             // If the anchor element is at the beginning of, or before, the start of the viewport\n  965 |             // then we can recycle all elements before it.\n  966 |             if (u <= viewport.anchorU)\n  967 |                 _realizedElements.RecycleElementsBefore(viewport.anchorIndex, _recycleElement);","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/VirtualizingStackPanel.cs#L964-L967"}]},
{"id":"LOGIC_78","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"Missing parentheses cause an operator-precedence bug: `&&` binds tighter than `||`, so the condition is evaluated as `(sizeToContent != Manual && CanResize && reason == Unspecified) || (reason == User)`. Any resize with `reason == WindowResizeReason.User` enters the auto-size-off block regardless of `SizeToContent` or `CanResize`, and a resize with `reason == Unspecified` requires `CanResize`, contrary to the intended `... && (reason == Unspecified || reason == User)`.","fix":"Group the reason comparisons:\n```csharp\nif (sizeToContent != SizeToContent.Manual &&\n    CanResize &&\n    (reason == WindowResizeReason.Unspecified || reason == WindowResizeReason.User))\n```","locations":[{"ref":"src/Avalonia.Controls/Window.cs:1483-1493","code":" 1483 |                 if (sizeToContent != SizeToContent.Manual &&\n 1484 |                     CanResize &&\n 1485 |                     reason == WindowResizeReason.Unspecified ||\n 1486 |                     reason == WindowResizeReason.User)\n 1487 |                 {\n 1488 |                     if (clientSize.Width != ClientSize.Width)\n 1489 |                         sizeToContent &= ~SizeToContent.Width;\n 1490 |                     if (clientSize.Height != ClientSize.Height)\n 1491 |                         sizeToContent &= ~SizeToContent.Height;\n 1492 |                     SizeToContent = sizeToContent;\n 1493 |                 }","lines":11,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/Window.cs#L1483-L1493"}]},
{"id":"LOGIC_79","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"When a peer's children change, OnPeerChildrenChanged emits a children-changed(\"add\") signal whose payload variant is a reference to the node itself (Server.GetReference(this)) at a hard-coded index 0, instead of a reference to the child that was actually added. Everywhere else in the codebase (AtSpiServer.EmbedAndAnnounceOnceAsync, EmitWindowChildAdded, RemoveWindow) the any_data payload is the child reference at its real index. Passing the parent's own reference misinforms ATs about which object was added and at what index.","fix":"Emit one children-changed(\"add\") per newly-attached child with that child's reference and its actual index, e.g. after `EnsureChildren()` diff the previous/current lists and call `eventHandler.EmitChildrenChangedSignal(\"add\", index, new DBusVariant(Server.GetReference(addedChild).ToDbusStruct()))` for each added node, mirroring the pattern in `AtSpiServer.EmitWindowChildAdded`.","locations":[{"ref":"src/Avalonia.FreeDesktop.AtSpi/AtSpiNode.cs:325-329","code":"  325 |             if (!Server.HasEventListeners || EventObjectHandler is not { } eventHandler) return;\n  326 |             var reference = Server.GetReference(this);\n  327 |             var childVariant = new DBusVariant(reference.ToDbusStruct());\n  328 |             eventHandler.EmitChildrenChangedSignal(\"add\", 0, childVariant);\n  329 |         }","lines":5,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.FreeDesktop.AtSpi/AtSpiNode.cs#L325-L329"}]},
{"id":"LOGIC_80","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"The PBUFFER-support guard uses bitwise OR instead of AND. `EGL_PBUFFER_BIT` is `0x0001`, so `(_config.SurfaceType | EGL_PBUFFER_BIT)` is always non-zero and the condition `== 0` is never true. The intent is to detect configs that do NOT advertise PBUFFER support (e.g. a config chosen with `EGL_WINDOW_BIT` only, value 0x0004). As written the guard never fires, so on a surfaceless-unsupported platform with a window-only config the code proceeds to call `eglCreatePBufferSurface` on a config that cannot back a pbuffer, producing a confusing driver error instead of the intended clear `InvalidOperationException`.","fix":"Use bitwise AND to test the flag:\n```csharp\nif ((_config.SurfaceType & EGL_PBUFFER_BIT) == 0)\n    throw new InvalidOperationException(\n        \"Platform doesn't support EGL_KHR_surfaceless_context and PBUFFER surfaces\");\n```","locations":[{"ref":"src/Avalonia.OpenGL/Egl/EglDisplay.cs:75-77","code":"   75 |                         if ((_config.SurfaceType | EGL_PBUFFER_BIT) == 0)\n   76 |                             throw new InvalidOperationException(\n   77 |                                 \"Platform doesn't support EGL_KHR_surfaceless_context and PBUFFER surfaces\");","lines":3,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.OpenGL/Egl/EglDisplay.cs#L75-L77"}]},
{"id":"LOGIC_81","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"The message length prefix is read directly from the wire and used to allocate a buffer without any validation. A negative length throws OverflowException and a huge length throws OutOfMemoryException; either way a single malformed/hostile frame permanently kills the reader loop (the exception is caught by FireException, and the while(true) loop is exited). A remote peer can therefore trivially DoS the connection or force an OOM allocation.","fix":"Validate `length` before allocating: reject negative values and cap the maximum accepted message size, e.g. ```csharp\nvar length = BitConverter.ToInt32(infoBlock, 0);\nif (length < 0 || length > MaxMessageSize)\n    throw new InvalidDataException($\"Invalid message length {length}\");\n```","locations":[{"ref":"src/Avalonia.Remote.Protocol/BsonStreamTransport.cs:72-83","code":"   72 |                     var infoBlock = new byte[20];\n   73 |                     await ReadExact(infoBlock).ConfigureAwait(false);\n   74 |                     var length = BitConverter.ToInt32(infoBlock, 0);\n   75 |                     var guidBytes = new byte[16];\n   76 |                     Buffer.BlockCopy(infoBlock, 4, guidBytes, 0, 16);\n   77 |                     var guid = new Guid(guidBytes);\n   78 |                     var buffer = new byte[length];\n   79 |                     await ReadExact(buffer).ConfigureAwait(false);\n   80 |                     var message = Deserializer.Deserialize(new BinaryReader(new MemoryStream(buffer)),\n   81 |                         _resolver.GetByGuid(guid));\n   82 |                     OnMessage?.Invoke(this, message);\n   83 |                 }","lines":12,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Remote.Protocol/BsonStreamTransport.cs#L72-L83"}]},
{"id":"LOGIC_82","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Lost-wakeup race in the send worker. When `Worker` finds the queue empty it releases the lock (line 44), then re-acquires it only to store the wait signal (lines 47-49). Between those two lock regions a concurrent `Send` can enqueue an item and check `_signal` (line 80), find it still `null`, and therefore not signal the worker. The worker then installs `_signal` and awaits it forever, so the just-enqueued message is stuck until the *next* `Send` happens to wake the worker. The last message before a quiet period can be delayed indefinitely (never sent). The check-for-empty and the wait installation must be atomic (or the queue must be re-checked after installing the signal).","fix":"Hold the lock across the empty-check and signal installation, or re-check the queue after installing `_signal`. For example, inside `Worker` acquire the lock, dequeue if possible, and only if still empty create+store the signal under that same lock before awaiting:\n```\nTaskCompletionSource<int> signal;\nlock (_lock)\n{\n    if (_sendQueue.Count != 0) { wi = _sendQueue.Dequeue(); }\n    else { signal = new(); _signal = signal; }\n}\nif (wi == null) { await signal.Task.ConfigureAwait(false); continue; }\n```","locations":[{"ref":"src/Avalonia.Remote.Protocol/TransportConnectionWrapper.cs:35-63","code":"   35 |         async void Worker()\n   36 |         {\n   37 |             while (true)\n   38 |             {\n   39 |                 SendOperation wi = null;\n   40 |                 lock (_lock)\n   41 |                 {\n   42 |                     if (_sendQueue.Count != 0)\n   43 |                         wi = _sendQueue.Dequeue();\n   44 |                 }\n   45 |                 if (wi == null)\n   46 |                 {\n   47 |                     var signal = new TaskCompletionSource<int>();\n   48 |                     lock (_lock)\n   49 |                         _signal = signal;\n   50 |                     await signal.Task.ConfigureAwait(false);\n   51 |                     continue;\n   52 |                 }\n   53 |                 try\n   54 |                 {\n   55 |                     await _conn.Send(wi.Message).ConfigureAwait(false);\n   56 |                     wi.Tcs.TrySetResult(0);\n   57 |                 }\n   58 |                 catch (Exception e)\n   59 |                 {\n   60 |                     wi.Tcs.TrySetException(e);\n   61 |                 }\n   62 |             }    \n   63 |         }","lines":29,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Remote.Protocol/TransportConnectionWrapper.cs#L35-L63"},{"ref":"src/Avalonia.Remote.Protocol/TransportConnectionWrapper.cs:80-85","code":"   80 |                 if (_signal != null)\n   81 |                 {\n   82 |                     var signal = _signal;\n   83 |                     _signal = null;\n   84 |                     signal.SetResult(0);\n   85 |                 }","lines":6,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Remote.Protocol/TransportConnectionWrapper.cs#L80-L85"}]},
{"id":"LOGIC_83","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The RenderSurfaces property on WSurface creates a new WaylandFramebuffer instance every time the graphics backend changes (on reconnect). Old WaylandFramebuffer instances are not tracked or disposed when _renderSurfaces is replaced by a new array. Each WaylandFramebuffer creates a RenderTarget on construction which calls RegisterRenderTarget, but the old render surfaces are silently dropped without UnregisterRenderTarget. In the reconnect path of OnDisconnected the active render targets list is iterated and disposed, but only if they were previously registered via RegisterRenderTarget. The old framebuffer render surface itself (not the RenderTarget) is also never disposed.","fix":"Before assigning _renderSurfaces to a new array, dispose any existing render surface entries that implement IDisposable. Alternatively track the old surfaces explicitly and dispose them.","locations":[{"ref":"src/Avalonia.Wayland/Server/Persistent/WSurface.cs:207-221","code":"  207 |     public IPlatformRenderSurface[] RenderSurfaces\n  208 |     {\n  209 |         get\n  210 |         {\n  211 |             var graphics = Worker.PlatformGraphics.CurrentGraphics;\n  212 |             if (_renderSurfaces != null && ReferenceEquals(_renderSurfacesGraphicsKey, graphics))\n  213 |                 return _renderSurfaces;\n  214 | \n  215 |             _renderSurfacesGraphicsKey = graphics;\n  216 |             _renderSurfaces = graphics != null\n  217 |                 ? [graphics.CreateRenderSurface(this), new WaylandFramebuffer(this)]\n  218 |                 : [new WaylandFramebuffer(this)];\n  219 |             return _renderSurfaces;\n  220 |         }\n  221 |     }","lines":15,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Wayland/Server/Persistent/WSurface.cs#L207-L221"}]},
{"id":"LOGIC_84","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In UpdateDndFeedback, when the app accepts the drag, wl_data_offer.accept() is called with every MIME type in the offer list (calling it in a loop). The accept request is meant to be called once per motion event, providing the single MIME type the destination prefers. Sending it multiple times for the same serial is redundant at best; more importantly, it sends stale serials after subsequent motion events because _dndSerial is only set in OnDndEnter and never updated during motion. wl_data_offer.accept() requires the serial from the most recent wl_data_device.enter event which in the DragOver scenario still refers to the original enter serial, not the motion timestamp. Some compositors treat repeated accept calls as indicating the destination is confused.","fix":"Call Accept with only the single preferred MIME type (e.g. the first or most specific type). Keep _dndSerial as the enter serial (which is correct per protocol - wl_data_offer.accept takes the wl_data_device.enter serial, not a motion serial). Remove the loop and just call Accept with one MIME type.","locations":[{"ref":"src/Avalonia.Wayland/Server/Transient/Clipboard/WaylandDataDevice.cs:202-217","code":"  202 |     internal void UpdateDndFeedback(DragDropEffects effects)\n  203 |     {\n  204 |         if (_dndOffer == null)\n  205 |             return;\n  206 | \n  207 |         var (actions, preferred) = EffectsToActionsWithPreferred(effects);\n  208 |         _dndOffer.SetActions(actions, preferred);\n  209 | \n  210 |         if (effects == DragDropEffects.None) \n  211 |             _dndOffer.Accept(_dndSerial, null);\n  212 |         else\n  213 |         {\n  214 |             foreach(var mime in _dndOffer.MimeTypes)\n  215 |                 _dndOffer.Accept(_dndSerial, mime);\n  216 |         }\n  217 |     }","lines":16,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Wayland/Server/Transient/Clipboard/WaylandDataDevice.cs#L202-L217"}]},
{"id":"LOGIC_85","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Hardcoded XKB modifier bit positions (Shift=bit 0, Ctrl=bit 2, Alt=bit 3, Meta=bit 6) in ModifiersFromXkbMask are derived from traditional X11 modifier mask values but the wl_keyboard.modifiers event delivers xkb depressed/latched/locked values whose bit layout is keymap-specific. On a keymap where AltGr is Mod5 and has a different index, or where Super/Meta is bound to a different modifier index, the hardcoded shifts will silently misidentify modifier state. The proper approach is to call xkb_keymap_mod_get_index to obtain the actual index for named modifiers (\"Shift\", \"Control\", \"Alt\", \"Mod4\") and use those at runtime.","fix":"After keymap creation in XkbCommonKeymap, call xkb_keymap_mod_get_index for each named modifier (XKB_MOD_NAME_SHIFT, XKB_MOD_NAME_CTRL, XKB_MOD_NAME_ALT, XKB_MOD_NAME_LOGO) and store the returned indices. In ModifiersFromXkbMask use those indices instead of hardcoded constants. Add xkb_keymap_mod_get_index to XkbCommonNativeMethods.","locations":[{"ref":"src/Avalonia.Wayland/Server/Transient/WaylandInputDispatcher.Keyboard.cs:27-48","code":"   27 |         // Standard XKB modifier bit positions\n   28 |         private const uint ModShift = 1 << 0;\n   29 |         private const uint ModControl = 1 << 2;\n   30 |         private const uint ModAlt = 1 << 3;    // Mod1\n   31 |         private const uint ModMeta = 1 << 6;   // Mod4 / Super\n   32 | \n   33 |         public KeyboardHandler(Seat seat)\n   34 |         {\n   35 |             _seat = seat;\n   36 |             _xkbContext = new XkbContext();\n   37 |             _composeTable = XkbComposeTable.TryCreate(_xkbContext);\n   38 | \n   39 |             _keyboard = seat.WlSeat.GetKeyboard(new Listener(this));\n   40 |         }\n   41 | \n   42 |         private static RawInputModifiers ModifiersFromXkbMask(uint mask)\n   43 |         {\n   44 |             var mods = RawInputModifiers.None;\n   45 |             if ((mask & ModShift) != 0) mods |= RawInputModifiers.Shift;\n   46 |             if ((mask & ModControl) != 0) mods |= RawInputModifiers.Control;\n   47 |             if ((mask & ModAlt) != 0) mods |= RawInputModifiers.Alt;\n   48 |             if ((mask & ModMeta) != 0) mods |= RawInputModifiers.Meta;","lines":22,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Wayland/Server/Transient/WaylandInputDispatcher.Keyboard.cs#L27-L48"}]},
{"id":"LOGIC_86","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"WaylandTextInputV3.Reset sends disable, commit, enable, and then PushSeatStateLocked + commit in sequence for each seat. However, after calling proxy.Disable() and seat.Commit(), the seat.CommitSerial is incremented. Then proxy.Enable() and another seat.Commit() increments it again. The compositor replies with a done event carrying the commit serial from when it processed the state. If the preedit is cleared via the sink.OnImeUpdate call at line 207 but the serial check in Done is still pending a matching serial, the client and compositor can lose sync. The reset path calls ClearLastDelivered() which is correct, but the serial double-bump means two roundtrips are needed before a new preedit is considered fresh.","fix":"Combine the disable+enable into a single commit per seat: call Disable, Enable, PushSeatStateLocked in sequence and only call seat.Commit() once at the end. This reduces the serial to a single increment and avoids the stale-serial window.","locations":[{"ref":"src/Avalonia.Wayland/Server/Transient/WaylandTextInputV3.cs:182-208","code":"  182 |     public void Reset(WSurface s)\n  183 |     {\n  184 |         // v3 has no reset request. Closest safe behaviour: drop pending preedit\n  185 |         // by issuing disable + enable + commit. Compositor treats this as a fresh\n  186 |         // session and discards in-flight preedit.\n  187 |         if (!_surfaces.TryGetValue(s, out var ps) || !ps.HasClient)\n  188 |             return;\n  189 |         var hadDeliveredPreedit = false;\n  190 |         foreach (var seat in ps.EnteredSeats)\n  191 |         {\n  192 |             if (seat.Proxy is not { } proxy)\n  193 |                 continue;\n  194 |             if (!string.IsNullOrEmpty(seat.LastDeliveredPreedit))\n  195 |                 hadDeliveredPreedit = true;\n  196 |             seat.ClearPending();\n  197 |             seat.ClearLastDelivered();\n  198 |             proxy.Disable();\n  199 |             seat.Commit();\n  200 |             proxy.Enable();\n  201 |             PushSeatStateLocked(seat, s, ps);\n  202 |             seat.Commit();\n  203 |         }\n  204 |         // Clear stale composition on the client side too — otherwise the visible\n  205 |         // preedit lingers until the IME (re-)sends one, which may be deduped.\n  206 |         if (hadDeliveredPreedit)\n  207 |             ps.Sink.OnImeUpdate(ps.Surface.TextInputSessionToken, 0, 0, null, null, -1, -1);\n  208 |     }","lines":27,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Wayland/Server/Transient/WaylandTextInputV3.cs#L182-L208"}]},
{"id":"LOGIC_87","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Surrounding text cursor and anchor are passed in the wrong order to SetTextInputSurroundingText. The call is SetTextInputSurroundingText(text, selection.End, selection.Start), mapping End->cursorChar and Start->anchorChar. In the zwp_text_input_v3 protocol the cursor is where the caret sits (the active end of the selection), which corresponds to TextSelection.End when a forward selection exists but to TextSelection.Start when a backwards selection exists. The Avalonia TextSelection convention is Start <= End, so the cursor could be at either end. Consistently passing End as cursor means IMEs that insert at the cursor position (delete_surrounding_text, commit_string) will misalign by the selection width when the user has a non-empty backwards selection.","fix":"Track the cursor (active caret end) separately from the anchor. The TextInputMethodClient.Selection uses Start/End but not which end is active. Either expose a CursorPosition property on TextInputMethodClient, or as a pragmatic fix, call SetTextInputSurroundingText(text, selection.Start, selection.End) since compositors generally treat the first byte offset as cursor and second as anchor per zwp_text_input_v3 protocol (cursor_pos comes before anchor_pos in the set_surrounding_text request).","locations":[{"ref":"src/Avalonia.Wayland/WindowImpl.TextInput.cs:221-222","code":"  221 |             var selection = client.Selection;\n  222 |             _owner._surfaceProxy?.SetTextInputSurroundingText(text, selection.End, selection.Start);","lines":2,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Wayland/WindowImpl.TextInput.cs#L221-L222"}]},
{"id":"LOGIC_88","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In XkbCommonKeymap constructor, xkb_keymap_new_from_buffer is called with length = size - 1 (to exclude null terminator), which is correct. However, if xkb_keymap_new_from_buffer fails and throws, Dispose() is called in the catch block. At that point _state is still IntPtr.Zero (since it hasn't been created yet) but _keymap may be non-null — however xkb_keymap_unref will correctly handle the valid keymap pointer. More critically, if _keymap creation succeeds but _state creation fails, the catch block calls Dispose() which calls xkb_keymap_unref and xkb_state_unref. But xkb_state_unref is guarded by `_state != IntPtr.Zero` so that is fine. The real issue is munmap in the finally block runs with (IntPtr)size which includes the null terminator byte, while the mmap was done with the same size, so this is correct. No actual bug here - but the pattern is fragile.","fix":"No critical fix needed. The size passed to munmap correctly matches the size from mmap. Consider adding a comment clarifying why `size` (not `size-1`) is passed to munmap.","locations":[{"ref":"src/Avalonia.Wayland/XkbCommonKeymap.cs:17-48","code":"   17 |     public XkbCommonKeymap(XkbContext context, int fd, uint size)\n   18 |     {\n   19 |         var mapped = UnsafeNativeMethods.mmap(\n   20 |             IntPtr.Zero, (IntPtr)size, PROT_READ, MAP_PRIVATE, fd, IntPtr.Zero);\n   21 |         UnsafeNativeMethods.close(fd);\n   22 | \n   23 |         if (mapped == IntPtr.Zero || mapped == new IntPtr(-1))\n   24 |             throw new InvalidOperationException(\"Failed to mmap keymap fd\");\n   25 | \n   26 |         try\n   27 |         {\n   28 |             // size includes null terminator; xkb_keymap_new_from_buffer expects length without it\n   29 |             _keymap = xkb_keymap_new_from_buffer(\n   30 |                 context.Handle, (byte*)mapped, (IntPtr)(size - 1),\n   31 |                 XKB_KEYMAP_FORMAT_TEXT_V1, XKB_KEYMAP_COMPILE_NO_FLAGS);\n   32 | \n   33 |             if (_keymap == IntPtr.Zero)\n   34 |                 throw new InvalidOperationException(\"Failed to create xkb keymap from buffer\");\n   35 | \n   36 |             _state = xkb_state_new(_keymap);\n   37 |             if (_state == IntPtr.Zero)\n   38 |                 throw new InvalidOperationException(\"Failed to create xkb state\");\n   39 |         }\n   40 |         catch\n   41 |         {\n   42 |             Dispose();\n   43 |             throw;\n   44 |         }\n   45 |         finally\n   46 |         {\n   47 |             UnsafeNativeMethods.munmap(mapped, (IntPtr)size);\n   48 |         }","lines":32,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Wayland/XkbCommonKeymap.cs#L17-L48"}]},
{"id":"LOGIC_89","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In GlibDispatcherImplBase, the timer source tag (_glibTimerSourceTag) is removed via g_source_remove on UpdateTimer, but the old g_timeout_add_once callback (s_onceSourceCb) closes over a GCHandle-wrapped Action delegate. If g_source_remove races with the timer already firing (the timer fires between checking if it is scheduled and removing it), the GCHandle will be freed twice: once by the GDestroyNotify callback and once during normal GCHandle.Free in the action invocation path. In practice, g_source_remove returns false if the source already ran, so there is no actual double-free - but the code does not check the return value of g_source_remove and does not handle the case where the timer callback has already been queued but not yet invoked. The approach is unsafe with GLib's threading model.","fix":"Use g_timeout_add_full with a persistent GDestroyNotify, or track whether the timer source fired using a generation counter, to ensure the callback Action is only invoked or freed once.","locations":[{"ref":"src/Avalonia.X11/Dispatching/GlibDispatcherImplBase.cs:141-153","code":"  141 |     public void UpdateTimer(long? dueTimeInMs)\n  142 |     {\n  143 |         if (_glibTimerSourceTag.HasValue)\n  144 |         {\n  145 |             g_source_remove(_glibTimerSourceTag.Value);\n  146 |             _glibTimerSourceTag = null;\n  147 |         }\n  148 | \n  149 |         if (dueTimeInMs == null)\n  150 |             return;\n  151 | \n  152 |         var interval = (uint)Math.Max(0, (int)Math.Min(int.MaxValue, dueTimeInMs.Value - Now));\n  153 |         _glibTimerSourceTag = g_timeout_add_once(interval, TimerCallback);","lines":13,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.X11/Dispatching/GlibDispatcherImplBase.cs#L141-L153"}]},
{"id":"LOGIC_90","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In EventStreamWindow, the timeout timer fires every second (TimeSpan.FromSeconds(1), line 35) to check for expired listeners. The timeout comparison is 'timeout < _time.Elapsed' (line 50), where 'timeout' is the absolute deadline stored as '_time.Elapsed + timeout_param' at listener creation time. The timer interval (1 second) can cause late expiry: a listener with a 5-second timeout may actually fire up to 1 second late. For clipboard operations with a 5-second SelectionHelper.Timeout, this means the actual timeout can be up to 6 seconds. This is minor but can cause visible freezes in edge cases.","fix":"Reschedule the timer to fire at exactly the next expiry deadline instead of polling at a fixed 1-second interval. On each listener addition, compute the time until the nearest deadline and set the timer interval accordingly.","locations":[{"ref":"src/Avalonia.X11/Selections/Clipboard/EventStreamWindow.cs:35","code":"   35 |         _timeoutTimer = new(TimeSpan.FromSeconds(1), DispatcherPriority.Background, OnTimer);","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.X11/Selections/Clipboard/EventStreamWindow.cs#L35"},{"ref":"src/Avalonia.X11/Selections/Clipboard/EventStreamWindow.cs:44-58","code":"   44 |     private void OnTimer(object? sender, EventArgs eventArgs)\n   45 |     {\n   46 |         MergeListeners();\n   47 |         for (var i = 0; i < _listeners.Count; i++)\n   48 |         {\n   49 |             var (filter, tcs, timeout) = _listeners[i];\n   50 |             if (timeout < _time.Elapsed)\n   51 |             {\n   52 |                 _listeners.RemoveAt(i);\n   53 |                 i--;\n   54 |                 tcs.SetResult(null);\n   55 |             }\n   56 |         }\n   57 |         if(_listeners.Count == 0)\n   58 |             _timeoutTimer.Stop();","lines":15,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.X11/Selections/Clipboard/EventStreamWindow.cs#L44-L58"}]},
{"id":"LOGIC_91","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In X11ClipboardImpl.StoreAtomsInClipboardManager, the method skips storing atoms for the clipboard manager if dataTransfer contains any non-text formats (line 59). This prevents clipboard manager persistence even for simple copy operations that happen to include both text and a bitmap or file. The check 'Any(f => !DataFormat.Text.Equals(f))' should probably be checking whether all formats are 'trivially small' rather than short-circuiting on any non-text format.","fix":"Consider allowing clipboard manager storage of text even when other formats are present, filtering out non-text formats from the TARGETS list sent to the clipboard manager rather than skipping the operation entirely.","locations":[{"ref":"src/Avalonia.X11/Selections/Clipboard/X11ClipboardImpl.cs:59","code":"   59 |         if (dataTransfer.Formats.Any(f => !DataFormat.Text.Equals(f)))","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.X11/Selections/Clipboard/X11ClipboardImpl.cs#L59"}]},
{"id":"LOGIC_92","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"XdndPosition coordinate packing in SendXdndPosition (line 562) uses C# int arithmetic '(rootPosition.X << 16) | rootPosition.Y'. If rootPosition.X >= 65536 (possible on very large multi-monitor virtual desktops), the shift overflows 32-bit int and the X coordinate is silently corrupted. The destination decodes with '(ushort)((message.ptr3 >> 16) & 0xFFFF)' which cannot recover an overflowed coordinate. Drags over large multi-monitor setups would have incorrect drop positions.","fix":"Mask coordinates to 16-bit range before packing: '((rootPosition.X & 0xFFFF) << 16) | (rootPosition.Y & 0xFFFF)'. Both source and the drop target already mask on the decode side; only the encode side needs fixing.","locations":[{"ref":"src/Avalonia.X11/Selections/DragDrop/X11DragSource.cs:562","code":"  562 |                 (rootPosition.X << 16) | rootPosition.Y,","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.X11/Selections/DragDrop/X11DragSource.cs#L562"},{"ref":"src/Avalonia.X11/Selections/DragDrop/X11DropTarget.cs:83-84","code":"   83 |         var screenX = (ushort)((message.ptr3 >> 16) & 0xFFFF);\n   84 |         var screenY = (ushort)(message.ptr3 & 0xFFFF);","lines":2,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.X11/Selections/DragDrop/X11DropTarget.cs#L83-L84"}]},
{"id":"LOGIC_93","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In X11DropTarget.OnXdndEnter, when 'hasExtraFormats' is true but XGetWindowPropertyAsIntPtrArray returns null (e.g., source window already gone), the code falls into the 'else' branch and reads ptr3/ptr4/ptr5 from the XdndEnter message. Per the XDND spec, when bit 0 of data.l[1] is set (more than 3 types), data.l[2..4] are undefined/unused and MUST NOT be treated as type atoms. This results in garbage atom values being added to the formats set, which may cause incorrect data format negotiation or errors when querying atoms.","fix":"When hasExtraFormats is true and the XdndTypeList property cannot be read, treat the drag as having no supported formats (leave 'formats' empty) rather than falling back to reading ptr3/ptr4/ptr5. Add an explicit 'else if (!hasExtraFormats)' guard.","locations":[{"ref":"src/Avalonia.X11/Selections/DragDrop/X11DropTarget.cs:54-71","code":"   54 |         if (hasExtraFormats &&\n   55 |             XGetWindowPropertyAsIntPtrArray(_display, sourceWindow, _atoms.XdndTypeList, _atoms.ATOM) is { } formatList)\n   56 |         {\n   57 |             foreach (var format in formatList)\n   58 |             {\n   59 |                 if (format != 0)\n   60 |                     formats.Add(format);\n   61 |             }\n   62 |         }\n   63 |         else\n   64 |         {\n   65 |             if (message.ptr3 != 0)\n   66 |                 formats.Add(message.ptr3);\n   67 |             if (message.ptr4 != 0)\n   68 |                 formats.Add(message.ptr4);\n   69 |             if (message.ptr5 != 0)\n   70 |                 formats.Add(message.ptr5);\n   71 |         }","lines":18,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.X11/Selections/DragDrop/X11DropTarget.cs#L54-L71"}]},
{"id":"LOGIC_94","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In X11DropTarget.OnXdndDrop, the XdndFinished message is only sent from DisposeCurrentDrag when drag.Dropped is true. However, the XdndFinished message is sent from DisposeCurrentDrag whether or not a Drop action was accepted (it checks ResultEffects). If the user's drop handler invokes another drag-and-drop or otherwise causes DisposeCurrentDrag to be called before drag.Dropped is set to true (line 150 comes after ProcessRawEvent at line 147), there is a window where the state is inconsistent. More specifically, if ProcessRawEvent throws, drag.Dropped is never set to true, DisposeCurrentDrag is not called (no try/finally), and the XdndFinished message is never sent, leaving the drag source hanging indefinitely.","fix":"Wrap lines 138-150 in a try/finally to ensure DisposeCurrentDrag() is always called even if ProcessRawEvent throws. Set drag.Dropped = true before calling ProcessRawEvent if appropriate, or set ResultEffects before the call.","locations":[{"ref":"src/Avalonia.X11/Selections/DragDrop/X11DropTarget.cs:131-153","code":"  131 |     public void OnXdndDrop(in XClientMessageEvent message)\n  132 |     {\n  133 |         if (_currentDrag is not { } drag || message.ptr1 != drag.SourceWindow)\n  134 |             return;\n  135 | \n  136 |         var modifiers = GetModifiers();\n  137 | \n  138 |         var drop = new RawDragEvent(\n  139 |             _dragDropDevice,\n  140 |             RawDragEventType.Drop,\n  141 |             drag.InputRoot,\n  142 |             drag.LastPosition ?? default,\n  143 |             drag,\n  144 |             drag.ResultEffects,\n  145 |             modifiers);\n  146 | \n  147 |         _dragDropDevice.ProcessRawEvent(drop);\n  148 | \n  149 |         drag.ResultEffects = drop.Effects;\n  150 |         drag.Dropped = true;\n  151 | \n  152 |         DisposeCurrentDrag();\n  153 |     }","lines":23,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.X11/Selections/DragDrop/X11DropTarget.cs#L131-L153"}]},
{"id":"LOGIC_95","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In SelectionDataProvider.SendIncrDataToClientAsync (INCR clipboard sender), the ArrayPool buffer is rented on line 199 but only returned (line 225) if the while loop exits normally. If the await on line 204 or 217 throws an exception (e.g., due to UI thread teardown), the buffer is never returned to the pool, causing a permanent pool-slot leak.","fix":"Use a try/finally block around the while loop to guarantee 'ArrayPool<byte>.Shared.Return(buffer)' is always called.","locations":[{"ref":"src/Avalonia.X11/Selections/SelectionDataProvider.cs:200-226","code":"  200 |         var buffer = ArrayPool<byte>.Shared.Rent((int)Math.Min(_maximumPropertySize, data.Length));\n  201 |         var gotTimeout = false;\n  202 | \n  203 |         while (true)\n  204 |         {\n  205 |             var evt = await events.WaitForEventAsync(\n  206 |                 x =>\n  207 |                     x.type == XEventName.PropertyNotify &&\n  208 |                     x.PropertyEvent.atom == property &&\n  209 |                     x.PropertyEvent.state == 1,\n  210 |                 SelectionHelper.Timeout);\n  211 | \n  212 |             if (evt is null)\n  213 |             {\n  214 |                 gotTimeout = true;\n  215 |                 break;\n  216 |             }\n  217 | \n  218 |             var read = await data.ReadAsync(buffer, 0, buffer.Length);\n  219 |             if (read == 0)\n  220 |                 break;\n  221 | \n  222 |             XChangeProperty(Platform.Display, window, property, target, 8, PropertyMode.Replace, buffer, read);\n  223 |             OnActivity();\n  224 |         }\n  225 | \n  226 |         ArrayPool<byte>.Shared.Return(buffer);","lines":27,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.X11/Selections/SelectionDataProvider.cs#L200-L226"}]},
{"id":"LOGIC_96","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`hasSupportedImage` is assigned with `=` on every loop iteration, so after the loop it only reflects whether the LAST format string equals \"image/png\", not whether any format did. If \"image/png\" appears anywhere except the final position of the format list, the synthetic `DataFormat.Bitmap` entry is never appended and clipboard/drag image reads fail to expose the bitmap format.","fix":"Accumulate with `|=` instead of overwriting:\n```csharp\nhasSupportedImage |= formatString is \"image/png\";\n```","locations":[{"ref":"src/Browser/Avalonia.Browser/BrowserDataTransferHelper.cs:18-27","code":"   18 |         var hasSupportedImage = false;\n   19 |         for (var i = 0; i < formatStrings.Length; ++i)\n   20 |         {\n   21 |             var formatString = formatStrings[i];\n   22 |             hasSupportedImage = formatString is \"image/png\";\n   23 |             formats[i] = BrowserDataFormatHelper.ToDataFormat(formatString);\n   24 |         }\n   25 | \n   26 |         if (hasSupportedImage)\n   27 |             formats = [..formats, DataFormat.Bitmap];","lines":10,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Browser/Avalonia.Browser/BrowserDataTransferHelper.cs#L18-L27"}]},
{"id":"LOGIC_97","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"InputHelper.subscribePointerEvents adds a listener for 'pointermove' on line 460 but the cleanup function at line 467 calls removeEventListener('pointerover', ...) instead of removeEventListener('pointermove', ...). The 'pointermove' handler is never unregistered, leaking a listener and potentially causing duplicate events if the subscription is re-established.","fix":"Change element.removeEventListener('pointerover', pointerMoveHandler) to element.removeEventListener('pointermove', pointerMoveHandler).","locations":[{"ref":"src/Browser/Avalonia.Browser/webapp/modules/avalonia/input.ts:460-472","code":"  460 |         element.addEventListener(\"pointermove\", pointerMoveHandler);\n  461 |         element.addEventListener(\"pointerdown\", pointerDownHandler);\n  462 |         element.addEventListener(\"pointerup\", pointerUpHandler);\n  463 |         element.addEventListener(\"wheel\", wheelHandler);\n  464 |         element.addEventListener(\"pointercancel\", pointerCancelHandler);\n  465 | \n  466 |         return () => {\n  467 |             element.removeEventListener(\"pointerover\", pointerMoveHandler);\n  468 |             element.removeEventListener(\"pointerdown\", pointerDownHandler);\n  469 |             element.removeEventListener(\"pointerup\", pointerUpHandler);\n  470 |             element.removeEventListener(\"pointercancel\", pointerCancelHandler);\n  471 |             element.removeEventListener(\"wheel\", wheelHandler);\n  472 |         };","lines":13,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Browser/Avalonia.Browser/webapp/modules/avalonia/input.ts#L460-L472"}]},
{"id":"LOGIC_98","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"ScreenHelper.getCurrentOrientation has a switch statement over screen.orientation.type covering four known string values but has no default case and no explicit return after the switch. In TypeScript, orientation.type can theoretically be an unexpected value (or the API might not exist on some platforms). The function implicitly returns undefined in that case, typed as ScreenOrientation, causing silent type confusion in callers.","fix":"Add a default case that returns ScreenOrientation.None (value 0) or the most appropriate fallback, e.g.: default: return ScreenOrientation.None;","locations":[{"ref":"src/Browser/Avalonia.Browser/webapp/modules/avalonia/screens.ts:126-138","code":"  126 |     static getCurrentOrientation(screen: BrowserScreen): ScreenOrientation {\n  127 |         switch (screen.orientation.type) {\n  128 |             case \"landscape-primary\":\n  129 |                 return ScreenOrientation.Landscape;\n  130 |             case \"landscape-secondary\":\n  131 |                 return ScreenOrientation.LandscapeFlipped;\n  132 |             case \"portrait-primary\":\n  133 |                 return ScreenOrientation.Portrait;\n  134 |             case \"portrait-secondary\":\n  135 |                 return ScreenOrientation.PortraitFlipped;\n  136 |         }\n  137 |     }\n  138 | }","lines":13,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Browser/Avalonia.Browser/webapp/modules/avalonia/screens.ts#L126-L138"}]},
{"id":"LOGIC_99","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"HarfBuzz `Language` objects are cached keyed on `CultureInfo.LCID`. On .NET Core / ICU (notably Linux) many distinct cultures report the same catch-all LCID 0x1000 (4096, custom/unspecified). `GetOrAdd` will therefore return the first-cached Language for every such culture, so text is shaped with the wrong language for all but the first culture that happened to share LCID 4096, potentially producing incorrect locale-specific shaping.","fix":"Key the cache on a value that uniquely identifies the culture, such as `usedCulture.Name` (or the BCP-47 / IETF language tag) instead of `usedCulture.LCID`.","locations":[{"ref":"src/HarfBuzz/Avalonia.HarfBuzz/HarfBuzzTextShaper.cs:57-60","code":"   57 |             buffer.Language = s_cachedLanguage.GetOrAdd(\n   58 |                 usedCulture.LCID,\n   59 |                 static (_, culture) => new Language(culture),\n   60 |                 usedCulture);","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/HarfBuzz/Avalonia.HarfBuzz/HarfBuzzTextShaper.cs#L57-L60"}]},
{"id":"LOGIC_100","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The InputThread only dispatches pointer events whose type is between `LIBINPUT_EVENT_POINTER_MOTION` (400) and `LIBINPUT_EVENT_POINTER_AXIS` (403) inclusive. Modern libinput emits high-resolution wheel scrolling as `LIBINPUT_EVENT_POINTER_SCROLL_WHEEL` (404), which falls outside this range and is never forwarded to `HandlePointer`. Consequently the `LIBINPUT_EVENT_POINTER_SCROLL_WHEEL` case inside `HandlePointer` is dead code and mouse-wheel scrolling does not work on libinput versions that use the hi-res scroll events.","fix":"Extend the dispatch range to cover the scroll events, e.g. change the upper bound to `LIBINPUT_EVENT_POINTER_SCROLL_CONTINUOUS` (or explicitly include `LIBINPUT_EVENT_POINTER_SCROLL_WHEEL`) so hi-res wheel events reach `HandlePointer`.","locations":[{"ref":"src/Linux/Avalonia.LinuxFramebuffer/Input/LibInput/LibInputBackend.cs:63-65","code":"   63 |                     if (type >= LibInputEventType.LIBINPUT_EVENT_POINTER_MOTION\n   64 |                         && type <= LibInputEventType.LIBINPUT_EVENT_POINTER_AXIS)\n   65 |                         HandlePointer(ev, type);","lines":3,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Linux/Avalonia.LinuxFramebuffer/Input/LibInput/LibInputBackend.cs#L63-L65"},{"ref":"src/Linux/Avalonia.LinuxFramebuffer/Input/LibInput/LibInputBackend.Pointer.cs:90-102","code":"   90 |             case LibInputEventType.LIBINPUT_EVENT_POINTER_SCROLL_WHEEL:\n   91 |                 {\n   92 |                     var value = new Vector(0,\n   93 |                         -libinput_event_pointer_get_scroll_value_v120(pev,\n   94 |                             LibInputPointerAxis.LIBINPUT_POINTER_AXIS_SCROLL_VERTICAL) / 120);\n   95 |                     ScheduleInput(new RawMouseWheelEventArgs(_mouse\n   96 |                         , ts\n   97 |                         , InputRoot\n   98 |                         , _mousePosition\n   99 |                         , value\n  100 |                         , modifiers));\n  101 |                 }\n  102 |                 break;","lines":13,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Linux/Avalonia.LinuxFramebuffer/Input/LibInput/LibInputBackend.Pointer.cs#L90-L102"}]},
{"id":"LOGIC_101","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"When emulating StringSplitOptions.TrimEntries for netstandard, the code strips the trim bit with XOR (`splitOptions ^ trimOption`). XOR only clears the bit when it is already set. When an AvaloniaListAttribute supplies a custom SplitOptions that does NOT include TrimEntries, the XOR instead SETS the TrimEntries bit and passes it to string.Split, so entries get trimmed against the attribute's intent (and the following `HasFlag(trimOption)` check is then false, so no compensating logic runs). The correct operation is masking the bit off.","fix":"Use `splitOptions & ~trimOption` instead of `splitOptions ^ trimOption` when calling `text.Split`, so the trim bit is always cleared rather than toggled.","locations":[{"ref":"src/Markup/Avalonia.Markup.Xaml.Loader/CompilerExtensions/AvaloniaXamlIlLanguageParseIntrinsics.cs:393-398","code":"  393 |                     items = text.Split(separators, splitOptions ^ trimOption);\n  394 |                     // Compiler targets netstandard, so we need to emulate StringSplitOptions.TrimEntries, if it was requested.\n  395 |                     if (splitOptions.HasFlag(trimOption))\n  396 |                     {\n  397 |                         items = items.Select(i => i.Trim()).ToArray();\n  398 |                     }","lines":6,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Markup/Avalonia.Markup.Xaml.Loader/CompilerExtensions/AvaloniaXamlIlLanguageParseIntrinsics.cs#L393-L398"}]},
{"id":"LOGIC_102","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`TryGetSharedValue` parses the `x:Shared` directive value into `parseValue` but never assigns it to the `out bool value` parameter, so `value` always remains its `default` (`false`). The caller in `ResolveAdderAndValue` computes `TryGetSharedValue(valueNode, out var isShared) && !isShared`, which is therefore `true` whenever the directive is present regardless of its actual text. As a result `x:Shared=\"True\"` on a deferred resource is silently treated as not-shared (uses `ResourceDictionaryNotSharedDeferredAdd`), so a fresh instance is created on every resource lookup instead of being cached/shared.","fix":"Assign the parsed value to the `out` parameter before returning:\n```csharp\nif (bool.TryParse(text.Text, out var parseValue))\n{\n    value = parseValue;              // <-- was missing\n    co.Children.Remove(sharedDirective);\n    return true;\n}\n```","locations":[{"ref":"src/Markup/Avalonia.Markup.Xaml.Loader/CompilerExtensions/Transformers/AvaloniaXamlIlResourceTransformer.cs:78-106","code":"   78 |             bool TryGetSharedValue(IXamlAstValueNode valueNode, out bool value)\n   79 |             {\n   80 |                 value = default;\n   81 |                 if (valueNode is XamlAstConstructableObjectNode co)\n   82 |                 {\n   83 |                     // Try find x:Share directive\n   84 |                     if (co.Children.Find(d => d is XamlAstXmlDirective { Namespace: XamlNamespaces.Xaml2006, Name: \"Shared\" }) is XamlAstXmlDirective sharedDirective)\n   85 |                     {\n   86 |                         if (sharedDirective.Values.Count == 1 && sharedDirective.Values[0] is XamlAstTextNode text)\n   87 |                         {\n   88 |                             if (bool.TryParse(text.Text, out var parseValue))\n   89 |                             {\n   90 |                                 // If the parser succeeds, remove the x:Share directive\n   91 |                                 co.Children.Remove(sharedDirective);\n   92 |                                 return true;\n   93 |                             }\n   94 |                             else\n   95 |                             {\n   96 |                                 context.ReportTransformError(\"Invalid argument type for x:Shared directive.\", node);\n   97 |                             }\n   98 |                         }\n   99 |                         else\n  100 |                         {\n  101 |                             context.ReportTransformError(\"Invalid number of arguments for x:Shared directive.\", node);\n  102 |                         }\n  103 |                     }\n  104 |                 }\n  105 |                 return false;\n  106 |             }","lines":29,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Markup/Avalonia.Markup.Xaml.Loader/CompilerExtensions/Transformers/AvaloniaXamlIlResourceTransformer.cs#L78-L106"}]},
{"id":"LOGIC_103","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"This `ReadExactly(Stream, byte[], int, int)` polyfill ignores its `offset` and `count` arguments entirely. It validates `offset >= 0` but never uses it, and the loop reads into `buffer` starting at index `totalRead` (from 0) while looping `until totalRead < buffer.Length` and requesting `buffer.Length - totalRead` bytes - hardcoding `offset == 0` and `count == buffer.Length`. Any caller passing a non-zero offset or a count smaller than the buffer will read into the wrong region and/or read too many bytes (potential over-read past the intended slice). The one in-repo caller (nukebuild RefAssemblyGenerator, `ReadExactly(snk, 0, snk.Length)`) only works by coincidence.","fix":"Honor the parameters:\n```csharp\nvar totalRead = 0;\nwhile (totalRead < count)\n{\n    var read = stream.Read(buffer, offset + totalRead, count - totalRead);\n    if (read == 0) throw new EndOfStreamException();\n    totalRead += read;\n}\n```\nAlso validate `count` and `offset + count <= buffer.Length`.","locations":[{"ref":"src/Shared/StreamCompatibilityExtensions.cs:5-21","code":"    5 |     public static void ReadExactly(this Stream stream, byte[] buffer, int offset, int count)\n    6 |     {\n    7 |         if (offset < 0)\n    8 |             throw new ArgumentOutOfRangeException(nameof(offset));\n    9 | \n   10 |         var totalRead = 0;\n   11 |         while (totalRead < buffer.Length)\n   12 |         {\n   13 |             var read = stream.Read(buffer, totalRead, buffer.Length - totalRead);\n   14 |             if (read == 0)\n   15 |             {\n   16 |                 throw new EndOfStreamException();\n   17 |             }\n   18 | \n   19 |             totalRead += read;\n   20 |         }\n   21 |     }","lines":17,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Shared/StreamCompatibilityExtensions.cs#L5-L21"}]},
{"id":"LOGIC_104","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In the radial gradient 'different origin' path (line 1039), the background fill color is hardcoded to stopColors[0]. After the 'reverse' branch reassigns stopColors to reversedColors, stopColors[0] is the last original stop (the one near the center after reversal), which is correct for the reverse case. However, without reversal the comment says 'fill with the final color' but uses stopColors[0] (the first stop), not the last. This produces a wrong background fill color in the non-reversed case with a gradient origin offset from center.","fix":"When reverse is false, use stopColors[stopColors.Length - 1] as the background color (the actual final stop) instead of stopColors[0].","locations":[{"ref":"src/Skia/Avalonia.Skia/DrawingContextImpl.cs:1037-1049","code":" 1037 |                             // compose with a background colour of the final stop to match D2D's behaviour of filling with the final color\n 1038 |                             using (var shader = SKShader.CreateCompose(\n 1039 |                                        SKShader.CreateColor(stopColors[0]),\n 1040 |                                        transform.HasValue\n 1041 |                                            ? SKShader.CreateTwoPointConicalGradient(start, radiusStart, end, radiusEnd,\n 1042 |                                               stopColors, stopOffsets, tileMode, transform.Value.ToSKMatrix())\n 1043 |                                            : SKShader.CreateTwoPointConicalGradient(start, radiusStart, end, radiusEnd,\n 1044 |                                               stopColors, stopOffsets, tileMode)\n 1045 |                                         )\n 1046 |                                     )\n 1047 |                             {\n 1048 |                                 paintWrapper.Paint.Shader = shader;\n 1049 |                             }","lines":13,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Skia/Avalonia.Skia/DrawingContextImpl.cs#L1037-L1049"}]},
{"id":"LOGIC_105","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"SkiaMetalGpu always reports IsLost = false. If the underlying Metal device is lost (which can happen e.g. on GPU reset or app backgrounding on iOS), the GPU render targets will continue to be used without triggering a re-creation path. Surfaces created from a lost device silently produce garbage or crash.","fix":"Propagate IsLost from the underlying IMetalDevice if it exposes a lost state, or at minimum return GrContext?.IsAbandoned() ?? false.","locations":[{"ref":"src/Skia/Avalonia.Skia/Gpu/Metal/SkiaMetalGpu.cs:47","code":"   47 |     public bool IsLost => false;","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Skia/Avalonia.Skia/Gpu/Metal/SkiaMetalGpu.cs#L47"}]},
{"id":"LOGIC_106","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"DirectCompositionConnection.TryCreateAndRegisterCore() creates an IDCompositionDesktopDevice\nproxy with `false` (no ownership) as the addRef parameter, then immediately wraps\nthe device in a `using` block. The MicroComRuntime.CreateProxyFor call with `false`\nmeans it won't AddRef the pointer, so when the `using` block calls Dispose, it will\nRelease a reference it didn't own, potentially decrementing the COM object's reference\ncount below zero. DirectCompositionShared then clones a reference from the same\n(possibly-invalid) object.","fix":"Pass `true` as the addRef argument to CreateProxyFor so the proxy owns the reference:\n`MicroComRuntime.CreateProxyFor<IDCompositionDesktopDevice>(cDevice, true)`.","locations":[{"ref":"src/Windows/Avalonia.Win32/DComposition/DirectCompositionConnection.cs:63-73","code":"   63 |                 var result = NativeMethods.DCompositionCreateDevice2(default, IID_IDCompositionDesktopDevice, out var cDevice);\n   64 |                 if (result != UnmanagedMethods.HRESULT.S_OK)\n   65 |                 {\n   66 |                     throw new Win32Exception((int)result);\n   67 |                 }\n   68 | \n   69 |                 using (var device = MicroComRuntime.CreateProxyFor<IDCompositionDesktopDevice>(cDevice, false))\n   70 |                 {\n   71 |                     var shared = new DirectCompositionShared(device);\n   72 |                     connect = new DirectCompositionConnection(shared);\n   73 |                 }","lines":11,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Windows/Avalonia.Win32/DComposition/DirectCompositionConnection.cs#L63-L73"}]},
{"id":"LOGIC_107","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In AlphaToMask (Win32Icon) the bit-set expression is '1 << (x % 8)' (LSB-first, bit 0 = leftmost pixel). However the Avalonia BlackWhite pixel format (used by AllocFramebuffer above) writes bits MSB-first (bit 7 = leftmost pixel, as per BlackWhitePixelFormatWriter). The manual bit-setting in the else branch uses the opposite convention, so the transparency mask is bit-reversed within each byte compared to what CreateBitmap with 1-bit depth expects.","fix":"Change '1 << (x % 8)' to '1 << (7 - x % 8)' to match MSB-first bit ordering expected by CreateBitmap with a 1-bit-per-pixel monochrome bitmap.","locations":[{"ref":"src/Windows/Avalonia.Win32/Interop/Win32Icon.cs:121","code":"  121 |                         pDest[x / 8] |= (byte)(1 << (x % 8));","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Windows/Avalonia.Win32/Interop/Win32Icon.cs#L121"}]},
{"id":"LOGIC_108","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"WglGdiResourceManager.Worker() processes only ONE item per AutoResetEvent signal.\nThe loop calls `s_event.WaitOne()`, dequeues exactly one job, then loops back to\nWaitOne(). If multiple callers enqueue jobs in rapid succession and only one Set()\nraces through before Worker() re-enters WaitOne(), subsequent jobs sit in the queue\nwithout a corresponding signal and the callers will block forever (or until another\nSet() happens for an unrelated reason).\n\nExample: two threads each call CreateOffscreenWindow() simultaneously. Both enqueue\nand both call Set(). Worker wakes, processes the first job, calls WaitOne() again.\nIf both Sets were already consumed by the first WaitOne(), the second job is never\nprocessed.","fix":"After dequeueing and processing a job, check if the queue still has items and\ncontinue processing without waiting: replace the single `Dequeue` with a loop inside\n`lock(s_queue)` that drains all available items, or use `Set()` again if the queue\nis non-empty after processing one item.","locations":[{"ref":"src/Windows/Avalonia.Win32/OpenGl/WglGdiResourceManager.cs:73-111","code":"   73 |     private static void Worker()\n   74 |     {\n   75 |         while (true)\n   76 |         {\n   77 |             s_event.WaitOne();\n   78 |             lock (s_queue)\n   79 |             {\n   80 |                 if(s_queue.Count == 0)\n   81 |                     continue;\n   82 |                 var job = s_queue.Dequeue();\n   83 |                 if (job is GetDCOp getDc)\n   84 |                     getDc.Result.TrySetResult(UnmanagedMethods.GetDC(getDc.Window));\n   85 |                 else if (job is ReleaseDCOp releaseDc)\n   86 |                 {\n   87 |                     UnmanagedMethods.ReleaseDC(releaseDc.Window, releaseDc.DC);\n   88 |                     releaseDc.Result.SetResult(null);\n   89 |                 }\n   90 |                 else if (job is CreateWindowOp createWindow)\n   91 |                     createWindow.Result.TrySetResult(UnmanagedMethods.CreateWindowEx(\n   92 |                         0,\n   93 |                         s_windowClass,\n   94 |                         null,\n   95 |                         (int)UnmanagedMethods.WindowStyles.WS_OVERLAPPEDWINDOW,\n   96 |                         0,\n   97 |                         0,\n   98 |                         640,\n   99 |                         480,\n  100 |                         IntPtr.Zero,\n  101 |                         IntPtr.Zero,\n  102 |                         IntPtr.Zero,\n  103 |                         IntPtr.Zero));\n  104 |                 else if (job is DestroyWindowOp destroyWindow)\n  105 |                 {\n  106 |                     UnmanagedMethods.DestroyWindow(destroyWindow.Window);\n  107 |                     destroyWindow.Result.TrySetResult(null);\n  108 |                 }\n  109 |             }\n  110 |         }\n  111 |     }","lines":39,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Windows/Avalonia.Win32/OpenGl/WglGdiResourceManager.cs#L73-L111"}]},
{"id":"LOGIC_109","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In WinUIEffectBase.GetSource(), the bounds check is `index > _sources.Length`\n(strictly greater than), so calling GetSource(_sources.Length) would return\n_sources[_sources.Length] which is an ArrayIndexOutOfRangeException (an exception\nrather than the intended COMException). The condition should be `index >= _sources.Length`.","fix":"Change `index > _sources.Length` to `index >= _sources.Length`.","locations":[{"ref":"src/Windows/Avalonia.Win32/WinRT/Composition/WinUIEffectBase.cs:38-40","code":"   38 |             if (_sources == null || index> _sources.Length)\n   39 |                 throw new COMException(\"Invalid index\", unchecked((int)0x80070057));\n   40 |             return _sources[index];","lines":3,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Windows/Avalonia.Win32/WinRT/Composition/WinUIEffectBase.cs#L38-L40"}]},
{"id":"LOGIC_110","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In WinUiCompositionShared the MinAcrylicVersion (10.0.15063) is older than\nMinWinCompositionVersion (10.0.17134). WinUiCompositedWindowSurface.IsBlurSupported\nchecks `Win32Platform.WindowsVersion >= WinUiCompositionShared.MinAcrylicVersion`\nfor Acrylic, which would return true on Windows 10 1703 (build 15063). But\nWinUiCompositorConnection.IsSupported() requires build 17134 (1803). So on build\n15063-17133, IsBlurSupported(Acrylic) returns true but the compositor is never\ninitialized, meaning SetBlur(Acrylic) is called on a null _window reference in\nWinUiCompositedWindowSurface, causing NullReferenceException.","fix":"Change the Acrylic version check in IsBlurSupported to also require at least\nMinWinCompositionVersion, or raise MinAcrylicVersion to match MinWinCompositionVersion.","locations":[{"ref":"src/Windows/Avalonia.Win32/WinRT/Composition/WinUiCompositedWindowSurface.cs:47-53","code":"   47 |         {\n   48 |             BlurEffect.None => true,\n   49 |             BlurEffect.Acrylic => Win32Platform.WindowsVersion >= WinUiCompositionShared.MinAcrylicVersion,\n   50 |             BlurEffect.MicaLight => Win32Platform.WindowsVersion >= WinUiCompositionShared.MinHostBackdropVersion,\n   51 |             BlurEffect.MicaDark => Win32Platform.WindowsVersion >= WinUiCompositionShared.MinHostBackdropVersion,\n   52 |             _ => false\n   53 |         };","lines":7,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Windows/Avalonia.Win32/WinRT/Composition/WinUiCompositedWindowSurface.cs#L47-L53"},{"ref":"src/Windows/Avalonia.Win32/WinRT/Composition/WinUiCompositionShared.cs:16-18","code":"   16 |     public static readonly Version MinWinCompositionVersion = new(10, 0, 17134);\n   17 |     public static readonly Version MinAcrylicVersion = new(10, 0, 15063);\n   18 |     public static readonly Version MinHostBackdropVersion = new(10, 0, 22000);","lines":3,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Windows/Avalonia.Win32/WinRT/Composition/WinUiCompositionShared.cs#L16-L18"}]},
{"id":"LOGIC_111","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"_trackingMouse is never set to true anywhere in the codebase (the field itself even carries a TODO comment: '//ToDo - there is something missed. Needs investigation @Steven Kirk'). The guard 'if (!_trackingMouse)' at line 358 of AppWndProc.cs therefore always evaluates to true, and TrackMouseEvent is called on every single WM_MOUSEMOVE message instead of once per mouse-enter. The performance cost is a system call on each mouse move. The intended behaviour - call once and then wait for WM_MOUSELEAVE before re-arming - is never achieved.","fix":"Add '_trackingMouse = true;' immediately after the TrackMouseEvent call (around line 369). The existing WM_MOUSELEAVE handler already sets it back to false at line 441.","locations":[{"ref":"src/Windows/Avalonia.Win32/WindowImpl.cs:92","code":"   92 |         private bool _trackingMouse;//ToDo - there is something missed. Needs investigation @Steven Kirk","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Windows/Avalonia.Win32/WindowImpl.cs#L92"},{"ref":"src/Windows/Avalonia.Win32/WindowImpl.AppWndProc.cs:358-369","code":"  358 |                         if (!_trackingMouse)\n  359 |                         {\n  360 |                             var tm = new TRACKMOUSEEVENT\n  361 |                             {\n  362 |                                 cbSize = Marshal.SizeOf<TRACKMOUSEEVENT>(),\n  363 |                                 dwFlags = 2,\n  364 |                                 hwndTrack = _hwnd,\n  365 |                                 dwHoverTime = 0,\n  366 |                             };\n  367 | \n  368 |                             TrackMouseEvent(ref tm);\n  369 |                         }","lines":12,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Windows/Avalonia.Win32/WindowImpl.AppWndProc.cs#L358-L369"},{"ref":"src/Windows/Avalonia.Win32/WindowImpl.AppWndProc.cs:440-441","code":"  440 |                         }\n  441 |                         _trackingMouse = false;","lines":2,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Windows/Avalonia.Win32/WindowImpl.AppWndProc.cs#L440-L441"}]},
{"id":"LOGIC_112","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`UIPresentationControllerDelegate.Dispose` (lines 424-427) can invoke\n`_dismissHandler` a second time. Normal flow: UIKit calls `DidDismiss` which\ninvokes `_dismissHandler` and sets it to `null`; Xamarin later disposes the\ndelegate and `Dispose` checks `_dismissHandler?.Invoke()` - which is already null,\nso it's a no-op. However, if UIKit disposes the delegate WITHOUT first calling\n`DidDismiss` (which can happen when the picker is dismissed programmatically or\nduring scene teardown), `Dispose` invokes `_dismissHandler` and then does NOT set\nit to `null`. If `Dispose` is then called again (e.g. via finalizer or double\ndispose), `_dismissHandler` fires again, causing `tcs.TrySetResult` to be called\ntwice (harmless because of `Try`) but potentially triggering the inner lambda a\nsecond time with side-effects. The safer fix is to null the handler in `Dispose`\nafter invoking it.","fix":"In `Dispose`:\n```csharp\nprotected override void Dispose(bool disposing)\n{\n    _dismissHandler?.Invoke();\n    _dismissHandler = null;\n    base.Dispose(disposing);\n}\n```","locations":[{"ref":"src/iOS/Avalonia.iOS/Storage/IOSStorageProvider.cs:417-434","code":"  417 |     private class UIPresentationControllerDelegate : UIAdaptivePresentationControllerDelegate\n  418 |     {\n  419 |         private Action? _dismissHandler;\n  420 | \n  421 |         internal UIPresentationControllerDelegate(Action dismissHandler)\n  422 |             => this._dismissHandler = dismissHandler;\n  423 | \n  424 |         public override void DidDismiss(UIPresentationController presentationController)\n  425 |         {\n  426 |             _dismissHandler?.Invoke();\n  427 |             _dismissHandler = null;\n  428 |         }\n  429 | \n  430 |         protected override void Dispose(bool disposing)\n  431 |         {\n  432 |             _dismissHandler?.Invoke();\n  433 |             base.Dispose(disposing);\n  434 |         }","lines":18,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/iOS/Avalonia.iOS/Storage/IOSStorageProvider.cs#L417-L434"}]},
{"id":"LOGIC_113","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`GetPositionCore(fromPosition, direction, offset)` (lines 341-363) handles only\n`UITextLayoutDirection.Left` and `UITextLayoutDirection.Right` in its switch\nstatement. `UITextLayoutDirection.Up` and `UITextLayoutDirection.Down` fall through\nwithout modifying `newPosition`, so the function returns the same position\nregardless of the offset for vertical directions. iOS calls this method when\nhandling vertical arrow-key movement and certain assistive-technology navigation\ngestures; always returning the original position makes vertical cursor movement via\nthe UITextInput API a no-op.","fix":"Handle `Up` and `Down` in the switch by moving backward/forward by `offset` (same as `Left`/`Right` for single-column text). For multi-line text a proper line-hit-test through the `TextPresenter` would be needed, but even the simple offset logic is better than a no-op.","locations":[{"ref":"src/iOS/Avalonia.iOS/TextInputResponder.cs:358-380","code":"  358 |         private AvaloniaTextPosition? GetPositionCore(AvaloniaTextPosition fromPosition, UITextLayoutDirection inDirection, nint offset)\n  359 |         {\n  360 |             var newPosition = fromPosition.Index;\n  361 | \n  362 |             switch (inDirection)\n  363 |             {\n  364 |                 case UITextLayoutDirection.Left:\n  365 |                     newPosition -= (int)offset;\n  366 |                     break;\n  367 | \n  368 |                 case UITextLayoutDirection.Right:\n  369 |                     newPosition += (int)offset;\n  370 |                     break;\n  371 |             }\n  372 | \n  373 |             if (newPosition < 0)\n  374 |                 return null;\n  375 | \n  376 |             if (newPosition > DocumentLength)\n  377 |                 return null;\n  378 | \n  379 |             return new AvaloniaTextPosition(newPosition);\n  380 |         }","lines":23,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/iOS/Avalonia.iOS/TextInputResponder.cs#L358-L380"}]},
