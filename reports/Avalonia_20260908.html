{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"In PlatformSettings.mm, the didChangeValueForKey: method is commented out entirely (lines 86-93). The working observer is observeValueForKeyPath:. The dead commented-out block suggests an earlier implementation that was never cleaned up.","fix":"Remove the commented-out method block.","locations":[{"ref":"native/Avalonia.Native/src/OSX/PlatformSettings.mm:126-133","code":"  126 | /*- (void)didChangeValueForKey:(NSString *)key {\n  127 |     if([key isEqualToString:@\"effectiveAppearance\"]) {\n  128 |         _callback->Run();\n  129 |     }\n  130 |     else {\n  131 |         [super didChangeValueForKey:key];\n  132 |     }\n  133 | }*/","lines":8,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/native/Avalonia.Native/src/OSX/PlatformSettings.mm#L126-L133"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"The static constructor of XYFocus registers a class handler on `IsFocusEngagedProperty.Changed` whose body is empty (only a commented-out `// if ()`). This registers a global no-op handler that runs for every `IsFocusEngaged` change on any Visual, adding needless subscription overhead while doing nothing.","fix":"Remove the empty static constructor / class handler registration, or implement the intended engagement-change logic.","locations":[{"ref":"src/Avalonia.Base/Input/Navigation/XYFocus.Properties.cs:101-107","code":"  101 |     static XYFocus()\n  102 |     {\n  103 |         IsFocusEngagedProperty.Changed.AddClassHandler<Visual>((s, args) =>\n  104 |         {\n  105 |             // if ()\n  106 |         });\n  107 |     }","lines":7,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Input/Navigation/XYFocus.Properties.cs#L101-L107"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`TryGetLineBreak` returns `lineBreak.PositionWrap >= textRun.Length || true`, which is unconditionally `true`. The `lineBreak.PositionWrap >= textRun.Length` comparison is dead: it is computed and then discarded by the `|| true`. Either the `|| true` is a leftover that defeats the intended condition (a real logic bug), or the comparison should be removed to make the always-break intent explicit. As written it is confusing and hides whichever behavior was meant.","fix":"Decide the intended semantics and make it explicit. If a required break should always cause a split (current effective behavior), write:\n```csharp\nreturn true;\n```\nIf the break should only be honored when it reaches/exceeds the run length, drop the `|| true`:\n```csharp\nreturn lineBreak.PositionWrap >= textRun.Length;\n```","locations":[{"ref":"src/Avalonia.Base/Media/TextFormatting/TextFormatterImpl.cs:750","code":"  750 |                 return lineBreak.PositionWrap >= textRun.Length || true;","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Media/TextFormatting/TextFormatterImpl.cs#L750"}]},
{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`CompositionVisual.TryGetValidReadback` performs the same `readback.TargetId != Root.Server.Id` check twice in a row. Line 92 already returns null when `readback.TargetId != Root.Server.Id` (as part of the `!readback.Visible || ...` condition), so the second identical check on lines 96-97 (commented \"was reparented (potential race here)\") can never be true and is dead code. The comment implies the author intended to re-read a value to detect a race, but the expression reads exactly the same fields, so no race is actually re-checked.","fix":"Remove the redundant second `if (readback.TargetId != Root.Server.Id) return null;` block (lines 95-97), or, if a genuine re-read for race detection was intended, capture `Root.Server.Id` once and compare a freshly re-read `readback.TargetId`.","locations":[{"ref":"src/Avalonia.Base/Rendering/Composition/Visual.cs:88-94","code":"   88 |             // CompositionVisual wasn't visible or wasn't even attached to the composition target during the lat frame\n   89 |             if (!readback.Visible || readback.TargetId != Root.Server.Id)\n   90 |                 return null;\n   91 |             \n   92 |             // CompositionVisual was reparented (potential race here)\n   93 |             if (readback.TargetId != Root.Server.Id)\n   94 |                 return null;","lines":7,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Rendering/Composition/Visual.cs#L88-L94"}]},
{"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`StyledElement.RecurseStyles(IReadOnlyList<IStyle>)` (and by extension its only-internally-used two-argument overload) has no callers anywhere in the codebase. The public entry-point overload at line 1039 is never invoked, so the whole `RecurseStyles` pair is dead code.","fix":"Delete both `RecurseStyles` methods (lines 1039-1058) if no future use is planned.","locations":[{"ref":"src/Avalonia.Base/StyledElement.cs:1035-1054","code":" 1035 |         private static IReadOnlyList<StyleBase> RecurseStyles(IReadOnlyList<IStyle> styles)\n 1036 |         {\n 1037 |             var result = new List<StyleBase>();\n 1038 |             RecurseStyles(styles, result);\n 1039 |             return result;\n 1040 |         }\n 1041 | \n 1042 |         private static void RecurseStyles(IReadOnlyList<IStyle> styles, List<StyleBase> result)\n 1043 |         {\n 1044 |             var count = styles.Count;\n 1045 | \n 1046 |             for (var i = 0; i < count; ++i)\n 1047 |             {\n 1048 |                 var s = styles[i];\n 1049 |                 if (s is StyleBase style)\n 1050 |                     result.Add(style);\n 1051 |                 else if (s is IReadOnlyList<IStyle> children)\n 1052 |                     RecurseStyles(children, result);\n 1053 |             }\n 1054 |         }","lines":20,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/StyledElement.cs#L1035-L1054"}]},
{"id":"DEAD_7","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"In TextPresenter.Render the block that computes the presenter's offset relative to the visual root stores it into `_previousOffset`, but `_previousOffset` is never read anywhere else in the class, so the whole computation (including the `TranslatePoint` call executed on every render) is dead work with no effect.","fix":"Remove the dead block and the unused field `_previousOffset`:\n```\nif (VisualRoot is Visual root)\n{\n    var offset = this.TranslatePoint(Bounds.Position, root);\n\n    if (_previousOffset != offset)\n    {\n        _previousOffset = offset;\n    }\n}\n```","locations":[{"ref":"src/Avalonia.Controls/Presenters/TextPresenter.cs:430-438","code":"  430 |             if (VisualRoot is Visual root)\n  431 |             {\n  432 |                 var offset = this.TranslatePoint(Bounds.Position, root);\n  433 | \n  434 |                 if (_previousOffset != offset)\n  435 |                 {\n  436 |                     _previousOffset = offset;\n  437 |                 }\n  438 |             }","lines":9,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/Presenters/TextPresenter.cs#L430-L438"}]},
{"id":"DEAD_8","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"The `include == true` branch of `LineEnd` is never exercised (the only caller, `NextWord`, calls `LineEnd(text, cursor)` with the default `include = false`, and the method is `private static`). Worse, that dead branch contains a latent out-of-bounds access: after checking `cursor < text.Length`, it dereferences `text[cursor + 1]` when the current char is '\\r', which throws `IndexOutOfRangeException` if '\\r' is the final character of the string.","fix":"Either remove the unused `include` parameter and its branch entirely, or guard the lookahead: `if (text[cursor] == '\\r' && cursor + 1 < text.Length && text[cursor + 1] == '\\n')`.","locations":[{"ref":"src/Avalonia.Controls/Utils/StringUtils.cs:263-283","code":"  263 |         private static int LineEnd(string text, int cursor, bool include = false)\n  264 |         {\n  265 |             while (cursor < text.Length && !IsEol(text[cursor]))\n  266 |             {\n  267 |                 cursor++;\n  268 |             }\n  269 | \n  270 |             if (include && cursor < text.Length)\n  271 |             {\n  272 |                 if (text[cursor] == '\\r' && text[cursor + 1] == '\\n')\n  273 |                 {\n  274 |                     cursor += 2;\n  275 |                 }\n  276 |                 else\n  277 |                 {\n  278 |                     cursor++;\n  279 |                 }\n  280 |             }\n  281 | \n  282 |             return cursor;\n  283 |         }","lines":21,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/Utils/StringUtils.cs#L263-L283"}]},
{"id":"DEAD_9","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"ResetContextCore contains the identical null check on `_context` twice in a row (lines 137-140). The second check is unreachable-effect dead code.","fix":"Remove the duplicated guard:\n```csharp\nprotected override async Task ResetContextCore()\n{\n    if (_context == null)\n        return;\n\n    try\n    {\n        _insideReset++;\n        await _context.ResetAsync();\n    }\n    finally\n    {\n        _insideReset--;\n    }\n}\n```","locations":[{"ref":"src/Avalonia.FreeDesktop/DBusIme/IBus/IBusX11TextInputMethod.cs:135-151","code":"  135 |         protected override async Task ResetContextCore()\n  136 |         {\n  137 |             if (_context == null)\n  138 |                 return;\n  139 |             if (_context == null)\n  140 |                 return;\n  141 | \n  142 |             try\n  143 |             {\n  144 |                 _insideReset++;\n  145 |                 await _context.ResetAsync();\n  146 |             }\n  147 |             finally\n  148 |             {\n  149 |                 _insideReset--;\n  150 |             }\n  151 |         }","lines":17,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.FreeDesktop/DBusIme/IBus/IBusX11TextInputMethod.cs#L135-L151"}]},
{"id":"DEAD_10","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"WriteBuffer is bound to the entry point \"glWriteBuffer\", which is not a real OpenGL function (the actual functions are glReadBuffer and glDrawBuffer, both already declared just above). Because the entry point is marked optional it will silently never resolve, making this method permanently non-functional dead code.","fix":"Remove the `WriteBuffer` declaration, or correct the entry point name if a specific GL function was intended:\n```csharp\n// delete this - glWriteBuffer does not exist\n[GetProcAddress(\"glWriteBuffer\", true)]\npublic partial void WriteBuffer(int buffer);\n```","locations":[{"ref":"src/Avalonia.OpenGL/GlInterface.cs:400-401","code":"  400 |         [GetProcAddress(\"glWriteBuffer\", true)]\n  401 |         public partial void WriteBuffer(int buffer);","lines":2,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.OpenGL/GlInterface.cs#L400-L401"}]},
{"id":"DEAD_11","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"In the POSIX branch of `ImportSemaphore`, `addr` is resolved via `GetDeviceProcAddress`/`GetInstanceProcAddress` for \"vkImportSemaphoreFdKHR\" but is never used - the actual import is done through `_context.DeviceApi.ImportSemaphoreFdKHR`. The lookup is dead code.","fix":"Remove the unused lookup:\n```csharp\n_context.DeviceApi.ImportSemaphoreFdKHR(_context.DeviceHandle, &info)\n    .ThrowOnError(\"vkImportSemaphoreFdKHR\");\n```","locations":[{"ref":"src/Avalonia.Vulkan/VulkanExternalObjectsFeature.cs:147-151","code":"  147 |             var addr = _context.Instance.GetDeviceProcAddress(_context.Device.Handle, \"vkImportSemaphoreFdKHR\");\n  148 |             if (addr == IntPtr.Zero)\n  149 |                 addr = _context.Instance.GetInstanceProcAddress(_context.Instance.Handle, \"vkImportSemaphoreFdKHR\");\n  150 |             _context.DeviceApi.ImportSemaphoreFdKHR(_context.DeviceHandle, &info)\n  151 |                 .ThrowOnError(\"vkImportSemaphoreFdKHR\");","lines":5,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Vulkan/VulkanExternalObjectsFeature.cs#L147-L151"}]},
{"id":"DEAD_12","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"DrawingContextImpl declares PaintState (lines 1515-1534), a private struct that saves/restores paint color and shader. It is never used anywhere in the file or in DrawingContextImpl.Effects.cs.","fix":"Remove the PaintState struct.","locations":[{"ref":"src/Skia/Avalonia.Skia/DrawingContextImpl.cs:1515-1534","code":" 1515 |         private readonly struct PaintState : IDisposable\n 1516 |         {\n 1517 |             private readonly SKColor _color;\n 1518 |             private readonly SKShader _shader;\n 1519 |             private readonly SKPaint _paint;\n 1520 |             \n 1521 |             public PaintState(SKPaint paint, SKColor color, SKShader shader)\n 1522 |             {\n 1523 |                 _paint = paint;\n 1524 |                 _color = color;\n 1525 |                 _shader = shader;\n 1526 |             }\n 1527 | \n 1528 |             /// <inheritdoc />\n 1529 |             public void Dispose()\n 1530 |             {\n 1531 |                 _paint.Color = _color;\n 1532 |                 _paint.Shader = _shader;\n 1533 |             }\n 1534 |         }","lines":20,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Skia/Avalonia.Skia/DrawingContextImpl.cs#L1515-L1534"}]},
{"id":"DEAD_13","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"WinUiCompositorConnection constructor contains a large block of commented-out code\n(lines 47-61) that includes a D3D device creation attempt, composition device setup,\nand surface draw calls. This appears to be old debug/prototype code that was never\nremoved.","fix":"Remove the commented-out block.","locations":[{"ref":"src/Windows/Avalonia.Win32/WinRT/Composition/WinUiCompositorConnection.cs:47-61","code":"   47 |         /*\n   48 |         var levels = new[] { D3D_FEATURE_LEVEL.D3D_FEATURE_LEVEL_11_1 };\n   49 |         DirectXUnmanagedMethods.D3D11CreateDevice(IntPtr.Zero, D3D_DRIVER_TYPE.D3D_DRIVER_TYPE_HARDWARE,\n   50 |             IntPtr.Zero, 0, levels, (uint)levels.Length, 7, out var pD3dDevice, out var level, null);\n   51 | \n   52 |         var d3dDevice = MicroComRuntime.CreateProxyFor<IUnknown>(pD3dDevice, true);\n   53 | \n   54 |         var compositionDevice = compositor.QueryInterface<ICompositorInterop>().CreateGraphicsDevice(d3dDevice);\n   55 |         var surf = compositionDevice.CreateDrawingSurface(new UnmanagedMethods.SIZE_F { X = 100, Y = 100 },\n   56 |             DirectXPixelFormat.B8G8R8A8UIntNormalized, DirectXAlphaMode.Premultiplied);\n   57 |         var surfInterop = surf.QueryInterface<ICompositionDrawingSurfaceInterop>();\n   58 |         var IID_ID3D11Texture2D = Guid.Parse(\"6f15aaf2-d208-4e89-9ab4-489535d34f9c\");\n   59 |         void* texture = null;\n   60 |         surfInterop.BeginDraw(null, &IID_ID3D11Texture2D, &texture);\n   61 |         */","lines":15,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Windows/Avalonia.Win32/WinRT/Composition/WinUiCompositorConnection.cs#L47-L61"}]},
{"id":"DEAD_14","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`CmapFormat4Table.ResolveGlyph(int segmentIndex, int codePoint)` is a private method that is never called anywhere (glyph resolution is duplicated inline in `this[]`, `TryGetGlyph`, `ContainsGlyph` and `GetGlyphs`). It is dead code duplicating logic that already exists in four other places.","fix":"Delete the unused `ResolveGlyph` method (or, better, refactor the four inline copies of the delta/idRangeOffset resolution to call a single shared helper).","locations":[{"ref":"src/Avalonia.Base/Media/Fonts/Tables/Cmap/CmapFormat4Table.cs:350-382","code":"  350 |         // Resolves the glyph ID for a given code point within a specific segment\n  351 |         private ushort ResolveGlyph(int segmentIndex, int codePoint)\n  352 |         {\n  353 |             ushort idRangeOffset = ReadUInt16BE(_idRangeOffsets.Span, segmentIndex);\n  354 |             ushort idDelta = ReadUInt16BE(_idDeltas.Span, segmentIndex);\n  355 | \n  356 |             if (idRangeOffset == 0)\n  357 |             {\n  358 |                 return (ushort)((codePoint + idDelta) & 0xFFFF);\n  359 |             }\n  360 |             else\n  361 |             {\n  362 |                 int start = ReadUInt16BE(_startCodes.Span, segmentIndex);\n  363 |                 int ro = idRangeOffset / 2; // words\n  364 |                 int idx = (codePoint - start) + ro - (_segCount - segmentIndex);\n  365 |                 int glyphArrayWords = _glyphIdArray.Length / 2;\n  366 | \n  367 |                 if ((uint)idx < (uint)glyphArrayWords)\n  368 |                 {\n  369 |                     ushort glyphId = ReadUInt16BE(_glyphIdArray.Span, idx);\n  370 | \n  371 |                     if (glyphId != 0)\n  372 |                     {\n  373 |                         glyphId = (ushort)((glyphId + idDelta) & 0xFFFF);\n  374 |                     }\n  375 | \n  376 | {"id":"DEAD_15","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`GraphemeBreak` is an unused internal class whose only member returns `Array.Empty<byte>()`. A repo-wide\nsearch finds no references (grapheme breaking uses `GraphemeBreakTrie`/`GraphemeEnumerator` instead), so\nthis file is dead code that only adds confusion next to the real grapheme-break implementation.","fix":"Delete `GraphemeBreak.cs` (the `GraphemeBreak` type is not referenced anywhere).","locations":[{"ref":"src/Avalonia.Base/Media/TextFormatting/Unicode/GraphemeBreak.cs:1-7","code":"    1 | namespace Avalonia.Media.TextFormatting.Unicode\n    2 | {\n    3 |     internal static class GraphemeBreak\n    4 |     {\n    5 |         public static byte[] Data => System.Array.Empty<byte>();\n    6 |     }\n    7 | }","lines":7,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Media/TextFormatting/Unicode/GraphemeBreak.cs#L1-L7"}]},
{"id":"DEAD_16","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`ByteSizeHelper.ToString(ulong bytes, bool separate)` contains negative-value handling that can never execute because `bytes` is an unsigned `ulong`. `Math.Abs((double)bytes)` is a no-op (the value is always >= 0), and `bytes < 0 ? \"-\" : null` always yields `null` (the compiler treats `ulong < 0` as constant false). The negative-sign prefix is dead code.","fix":"Drop the `Math.Abs` and the `bytes < 0 ? \"-\" : null` branch (pass `null` directly), or change the parameter to a signed type if negative sizes are actually intended.","locations":[{"ref":"src/Avalonia.Base/Utilities/ByteSizeHelper.cs:30-38","code":"   30 |             var absSize = Math.Abs((double)bytes);\n   31 |             var fpPower = Math.Log(absSize, 1000);\n   32 |             var intPower = (int)fpPower;\n   33 |             var iUnit = intPower >= Prefixes.Length\n   34 |                 ? Prefixes.Length - 1\n   35 |                 : intPower;\n   36 |             var normSize = absSize / Math.Pow(1000, iUnit);\n   37 | \n   38 |             return string.Format(formatTemplate,bytes < 0 ? \"-\" : null, normSize, Prefixes[iUnit]);","lines":9,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Utilities/ByteSizeHelper.cs#L30-L38"}]},
{"id":"DEAD_17","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `VisualExtensions.GetTransformedBounds`, the clip-update block is already guarded by `if (visual.ClipToBounds)`, yet inside it the ternary `visual.ClipToBounds ? globalBounds.Intersect(clip) : clip` re-tests the same condition, which is always true here. The `: clip` branch is unreachable, making the ternary redundant.","fix":"Drop the redundant ternary:\n```csharp\nif (visual.ClipToBounds)\n{\n    var globalBounds = bounds.TransformToAABB(transform);\n    clip = clip.Intersect(globalBounds.Intersect(clip));\n}\n```","locations":[{"ref":"src/Avalonia.Base/VisualTree/VisualExtensions.cs:293-300","code":"  293 |                 if (visual.ClipToBounds)\n  294 |                 {\n  295 |                     var globalBounds = bounds.TransformToAABB(transform);\n  296 |                     var clipBounds = visual.ClipToBounds ?\n  297 |                         globalBounds.Intersect(clip) :\n  298 |                         clip;\n  299 |                     clip = clip.Intersect(clipBounds);\n  300 |                 }","lines":8,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/VisualTree/VisualExtensions.cs#L293-L300"}]},
{"id":"DEAD_18","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"In both root automation peers, `OnFocusChanged` computes a local `peer` (via `GetOrCreate(_focus)` / conditional) but never uses it; the subsequent `FocusChanged?.Invoke(this, EventArgs.Empty)` ignores it. The local is dead - it just allocates/creates a peer whose value is discarded.","fix":"Remove the unused `peer` local, keeping only the `if (_focus != oldFocus) FocusChanged?.Invoke(this, EventArgs.Empty);` logic.","locations":[{"ref":"src/Avalonia.Controls/Automation/Peers/WindowBaseAutomationPeer.cs:75-81","code":"   75 |             if (_focus != oldFocus)\n   76 |             {\n   77 |                 var peer = _focus is object ?\n   78 |                     _focus == Owner ? this :\n   79 |                     GetOrCreate(_focus) : null;\n   80 |                 FocusChanged?.Invoke(this, EventArgs.Empty);\n   81 |             }","lines":7,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/Automation/Peers/WindowBaseAutomationPeer.cs#L75-L81"},{"ref":"src/Avalonia.Controls/Automation/Peers/EmbeddableControlRootAutomationPeer.cs:67-73","code":"   67 |             if (_focus != oldFocus)\n   68 |             {\n   69 |                 var peer = _focus is object ?\n   70 |                     _focus == Owner ? this :\n   71 |                     GetOrCreate(_focus) : null;\n   72 |                 FocusChanged?.Invoke(this, EventArgs.Empty);\n   73 |             }","lines":7,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/Automation/Peers/EmbeddableControlRootAutomationPeer.cs#L67-L73"}]},
{"id":"DEAD_19","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In Grid.MeasureOverride the locals rowSpacing and columnSpacing are assigned but never used; the surrounding code re-reads the RowSpacing/ColumnSpacing properties directly on the following lines.","fix":"Either remove the unused locals, or use them in the following lines:\n```csharp\ndouble combinedRowSpacing = rowSpacing * (DefinitionsV.Count - 1);\ndouble combinedColumnSpacing = columnSpacing * (DefinitionsU.Count - 1);\n```","locations":[{"ref":"src/Avalonia.Controls/Grid.cs:461-464","code":"  461 |                     double rowSpacing = RowSpacing;\n  462 |                     double columnSpacing = ColumnSpacing;\n  463 |                     double combinedRowSpacing = RowSpacing * (DefinitionsV.Count - 1);\n  464 |                     double combinedColumnSpacing = ColumnSpacing * (DefinitionsU.Count - 1);","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/Grid.cs#L461-L464"}]},
{"id":"DEAD_20","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`Presenter_SizeChanged` is a private handler that is never subscribed to any event anywhere (size changes are handled by the inner `PresenterVisualListener`). It is dead code.","fix":"Delete the unused `Presenter_SizeChanged` method:\n```csharp\nprivate void Presenter_SizeChanged(object? sender, SizeChangedEventArgs e)\n{\n    InvalidateMeasure();\n}\n```","locations":[{"ref":"src/Avalonia.Controls/Primitives/TextSelectionCanvas.cs:523-526","code":"  523 |         private void Presenter_SizeChanged(object? sender, SizeChangedEventArgs e)\n  524 |         {\n  525 |             InvalidateMeasure();\n  526 |         }","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/Primitives/TextSelectionCanvas.cs#L523-L526"}]},
{"id":"DEAD_21","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"The `Refreshing` case computes a local `translationRatio` that is never used - `CalculateAndSetOffsets` is called immediately afterward without reference to it.","fix":"Remove the unused local:\n```csharp\n// delete these lines\nfloat translationRatio = (float)(_refreshInfoProvider != null ? (1.0f - _refreshInfoProvider.ExecutionRatio) * ParallaxPositionRatio : 1.0f)\n    * (IsPullDirectionFar ? -1f : 1f);\n```","locations":[{"ref":"src/Avalonia.Controls/PullToRefresh/RefreshVisualizer.cs:266-269","code":"  266 |                             float translationRatio = (float)(_refreshInfoProvider != null ?  (1.0f - _refreshInfoProvider.ExecutionRatio) * ParallaxPositionRatio : 1.0f) \n  267 |                                 * (IsPullDirectionFar ? -1f : 1f);\n  268 | \n  269 |                             CalculateAndSetOffsets(root, visual, visualizerVisual);","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/PullToRefresh/RefreshVisualizer.cs#L266-L269"}]},
{"id":"DEAD_22","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`var ticks = Ticks ?? null;` is a no-op: `?? null` does nothing, and the Ticks getter still calls GetValue, so the adjacent comment claiming this avoids \"the GetValue caching of the mutable default value\" is misleading/incorrect. The same pattern is duplicated in both the vertical and horizontal branches.","fix":"Replace with a plain read and drop the misleading comment:\n```csharp\nvar ticks = Ticks;\n```","locations":[{"ref":"src/Avalonia.Controls/TickBar.cs:313-315","code":"  313 |                 // This property is rarely set so let's try to avoid the GetValue\n  314 |                 // caching of the mutable default value\n  315 |                 var ticks = Ticks ?? null;","lines":3,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/TickBar.cs#L313-L315"},{"ref":"src/Avalonia.Controls/TickBar.cs:366-368","code":"  366 |                 // This property is rarely set so let's try to avoid the GetValue\n  367 |                 // caching of the mutable default value\n  368 |                 var ticks = Ticks ?? null;","lines":3,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/TickBar.cs#L366-L368"}]},
{"id":"DEAD_23","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"For the index.html resource, `resultIndexBytes` is computed and returned, but the preceding `ms.Write(resultIndexBytes, 0, resultIndexBytes.Length)` writes into the MemoryStream after `ms.ToArray()` has already been taken and just before the stream is disposed by the enclosing `using`; the written bytes are never read. The write is dead code (and `ms.CanWrite` is always true for a fresh MemoryStream).","fix":"Drop the redundant write (and the always-true `ms.CanWrite` check):\n```csharp\nif (r == resourcePrefix + \"index.html.gz\")\n{\n    _secretCookie = Guid.NewGuid();\n    var resultIndexString = Encoding.Default.GetString(currentIndexBytes)\n        .Replace(\"PREVIEWER_SECURITY_COOKIE\", _secretCookie.ToString());\n    return Encoding.UTF8.GetBytes(resultIndexString);\n}\n```","locations":[{"ref":"src/Avalonia.DesignerSupport/Remote/HtmlTransport/HtmlTransport.cs:63-72","code":"   63 |                             if (r == resourcePrefix + \"index.html.gz\" && ms.CanWrite)\n   64 |                             { \n   65 |                                 _secretCookie = Guid.NewGuid();\n   66 |                                 var resultIndexString = Encoding.Default.GetString(currentIndexBytes)\n   67 |                                                                         .Replace(\"PREVIEWER_SECURITY_COOKIE\", _secretCookie.ToString());\n   68 |                                 var resultIndexBytes = Encoding.UTF8.GetBytes(resultIndexString);\n   69 |                                 \n   70 |                                 ms.Write(resultIndexBytes, 0, resultIndexBytes.Length);\n   71 |                                 return resultIndexBytes;\n   72 |                             }","lines":10,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.DesignerSupport/Remote/HtmlTransport/HtmlTransport.cs#L63-L72"}]},
{"id":"DEAD_24","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"The catch (ArgumentException) block is effectively unreachable: the generic `Enum.GetName<T>(T)` overload returns null for undefined values rather than throwing ArgumentException, and `errorCode.ToString(\"X\")` on an enum does not throw for out-of-range values. When the error code is undefined, `errorName` becomes null and the message renders as 'failed with error  (0x...)' with a blank name instead of hitting the fallback.","fix":"Handle the null result of `Enum.GetName` explicitly (fall back to the hex-only message when it is null) instead of relying on an ArgumentException that is never thrown.","locations":[{"ref":"src/Avalonia.OpenGL/OpenGlException.cs:36-48","code":"   36 |         private static OpenGlException GetFormattedException<T>(string funcName, T errorCode, int intErrorCode) where T : struct, Enum\n   37 |         {\n   38 |             try\n   39 |             {\n   40 |                 var errorName = Enum.GetName(errorCode);\n   41 |                 return new OpenGlException(\n   42 |                     $\"{funcName} failed with error {errorName} (0x{errorCode.ToString(\"X\")})\", intErrorCode);\n   43 |             }\n   44 |             catch (ArgumentException)\n   45 |             {\n   46 |                 return new OpenGlException($\"{funcName} failed with error 0x{errorCode.ToString(\"X\")}\", intErrorCode);\n   47 |             }\n   48 |         }","lines":13,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.OpenGL/OpenGlException.cs#L36-L48"}]},
{"id":"DEAD_25","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"ChangeWMAtoms enforces atoms.Length == 1 or 2 via a guard (line 1618), but the SendNetWMMessage call below it checks atoms.Length > 2 and atoms.Length > 3 (lines 1641-1642), which can never be true. These two conditions are unreachable dead code.","fix":"Remove the dead conditions at lines 1641-1642 and replace with IntPtr.Zero literals, or expand the method to actually support more atoms by removing the restriction.","locations":[{"ref":"src/Avalonia.X11/X11Window.cs:1672-1697","code":" 1672 |             if (atoms.Length != 1 && atoms.Length != 2)\n 1673 |                 throw new ArgumentException();\n 1674 | \n 1675 |             if (!_mapped)\n 1676 |             {\n 1677 |                 var newAtoms = new HashSet<IntPtr>(XGetWindowPropertyAsIntPtrArray(_x11.Display, _handle,\n 1678 |                     _x11.Atoms._NET_WM_STATE,\n 1679 |                     (IntPtr)Atom.XA_ATOM) ?? []);\n 1680 |                 \n 1681 |                 foreach(var atom in atoms)\n 1682 |                     if (enable)\n 1683 |                         newAtoms.Add(atom);\n 1684 |                     else\n 1685 |                         newAtoms.Remove(atom);\n 1686 | \n 1687 |                 XChangeProperty(_x11.Display, _handle, _x11.Atoms._NET_WM_STATE, (IntPtr)Atom.XA_ATOM, 32,\n 1688 |                     PropertyMode.Replace, newAtoms.ToArray(), newAtoms.Count);\n 1689 |             }\n 1690 |             \n 1691 |             SendNetWMMessage(_x11.Atoms._NET_WM_STATE,\n 1692 |                 (IntPtr)(enable ? 1 : 0),\n 1693 |                 atoms[0],\n 1694 |                 atoms.Length > 1 ? atoms[1] : IntPtr.Zero,\n 1695 |                 atoms.Length > 2 ? atoms[2] : IntPtr.Zero,\n 1696 |                 atoms.Length > 3 ? atoms[3] : IntPtr.Zero\n 1697 |             );","lines":26,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.X11/X11Window.cs#L1672-L1697"}]},
{"id":"DEAD_26","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In LoadOrPopulate the `isp` parameter expression is created on line 359 and then immediately overwritten on line 364 without being used in between, making the first assignment dead code.","fix":"Remove the redundant first assignment:\n```csharp\nvar isp = Expression.Parameter(typeof(IServiceProvider));\nvar epar = Expression.Parameter(typeof(object));\nvar populate = created.GetMethod(AvaloniaXamlIlCompiler.PopulateName)!;\n```\nand delete the duplicate `isp = Expression.Parameter(typeof(IServiceProvider));` on line 364.","locations":[{"ref":"src/Markup/Avalonia.Markup.Xaml.Loader/AvaloniaXamlIlRuntimeCompiler.cs:359-364","code":"  359 |             var isp = Expression.Parameter(typeof(IServiceProvider));\n  360 | \n  361 | \n  362 |             var epar = Expression.Parameter(typeof(object));\n  363 |             var populate = created.GetMethod(AvaloniaXamlIlCompiler.PopulateName)!;\n  364 |             isp = Expression.Parameter(typeof(IServiceProvider));","lines":6,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Markup/Avalonia.Markup.Xaml.Loader/AvaloniaXamlIlRuntimeCompiler.cs#L359-L364"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"Comment references a nonexistent field `_maxCollapsedSegments`. The window-expansion loop is bounded by `candidateCount` (`for (int windowSize = 1; windowSize <= candidateCount; windowSize++)`), and no `_maxCollapsedSegments` field or limit exists anywhere in the class. The comment misleads readers into thinking there is a cap on collapsed segments.","fix":"Update the comment to reflect the actual behavior, e.g. `// Expand windows around centerCandidateIdx, growing window size up to the number of candidate segments.`","locations":[{"ref":"src/Avalonia.Base/Media/TextPathSegmentEllipsis.cs:211","code":"  211 |                 // Expand windows around centerCandidateIdx, up to _maxCollapsedSegments segments.","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Media/TextPathSegmentEllipsis.cs#L211"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The XML doc on `DirectConnectedAnimationConfiguration` states \"the default duration is shorter (150 ms)\", but `ConnectedAnimation.ResolveTimingAndEasing` uses `direct.Duration ?? service.DefaultDuration`, and `DefaultDuration` is 300 ms - there is no 150 ms default anywhere. The comment misleads about actual behavior.","fix":"Either apply a 150 ms default in `ResolveTimingAndEasing` for the `DirectConnectedAnimationConfiguration` case (`duration = direct.Duration ?? TimeSpan.FromMilliseconds(150);`) or correct the comment to say the service default (300 ms) is used when `Duration` is null.","locations":[{"ref":"src/Avalonia.Controls/Animation/ConnectedAnimationConfiguration.cs:31-38","code":"   31 |     /// <summary>\n   32 |     /// Produces a direct, linear translation suitable for back navigation.\n   33 |     /// No gravity arc or shadow is applied, and the default duration is shorter (150 ms).\n   34 |     /// <\/summary>\n   35 |     /// <remarks>\n   36 |     /// Assign this to <see cref=\"ConnectedAnimation.Configuration\"/> before calling\n   37 |     /// <c>TryStart<\/c> on the return animation to animate back to the source view.\n   38 |     /// <\/remarks>","lines":8,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/Animation/ConnectedAnimationConfiguration.cs#L31-L38"},{"ref":"src/Avalonia.Controls/Animation/ConnectedAnimation.cs:703-709","code":"  703 |             if (Configuration is DirectConnectedAnimationConfiguration direct)\n  704 |             {\n  705 |                 duration      = direct.Duration ?? service.DefaultDuration;\n  706 |                 easing        = s_directEasing;\n  707 |                 useGravityDip = false;\n  708 |                 useShadow     = false;\n  709 |             }","lines":7,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/Animation/ConnectedAnimation.cs#L703-L709"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The XML doc for `AllowTapRangeSelection` contradicts the code. The `<value>` says \"The default is false.\" but the property is registered with `defaultValue: true`. The `<remarks>` says \"This feature only works when SelectionMode is set to SingleRange\" but `ProcessTapRangeSelection` also handles `CalendarSelectionMode.MultipleRange`. Misleading docs for a public API.","fix":"Correct the doc comment to state the default is `true` and that the feature applies to both `SingleRange` and `MultipleRange`, e.g. change the `<value>` line to \"True to enable tap range selection; otherwise, false. The default is true.\" and update the remarks accordingly.","locations":[{"ref":"src/Avalonia.Controls/Calendar/Calendar.cs:482-528","code":"  482 |         public static readonly StyledProperty<bool> AllowTapRangeSelectionProperty =\n  483 |             AvaloniaProperty.Register<Calendar, bool>(\n  484 |                 nameof(AllowTapRangeSelection),\n  485 |                 defaultValue: true);\n  486 | \n  487 |         /// <summary>\n  488 |         /// Gets or sets a value that indicates what kind of selections are\n  489 |         /// allowed.\n  490 |         /// <\/summary>\n  491 |         /// <value>\n  492 |         /// A value that indicates the current selection mode. The default is\n  493 |         /// <see cref=\"F:Avalonia.Controls.CalendarSelectionMode.SingleDate\" />.\n  494 |         /// <\/value>\n  495 |         /// <remarks>\n  496 |         /// <para>\n  497 |         /// This property determines whether the Calendar allows no selection,\n  498 |         /// selection of a single date, or selection of multiple dates.  The\n  499 |         /// selection mode is specified with the CalendarSelectionMode\n  500 |         /// enumeration.\n  501 |         /// <\/para>\n  502 |         /// <para>\n  503 |         /// When this property is changed, all selected dates will be cleared.\n  504 |         /// <\/para>\n  505 |         /// <\/remarks>\n  506 |         public CalendarSelectionMode SelectionMode\n  507 |         {\n  508 |             get => GetValue(SelectionModeProperty);\n  509 |             set => SetValue(SelectionModeProperty, value);\n  510 |         }\n  511 | \n  512 |         /// <summary>\n  513 |         /// Gets or sets a value indicating whether tap-to-select range mode is enabled.\n  514 |         /// When enabled, users can tap a start date and then tap an end date to select a range.\n  515 |         /// <\/summary>\n  516 |         /// <value>\n  517 |         /// True to enable tap range selection; otherwise, false. The default is false.\n  518 |         /// <\/value>\n  519 |         /// <remarks>\n  520 |         /// This feature only works when SelectionMode is set to SingleRange.\n  521 |         /// When enabled, the first tap selects the start date, and the second tap selects \n  522 |         /// the end date to complete the range. Tapping a third date starts a new range.\n  523 |         /// <\/remarks>\n  524 |         public bool AllowTapRangeSelection\n  525 |         {\n  526 |             get => GetValue(AllowTapRangeSelectionProperty);\n  527 |             set => SetValue(AllowTapRangeSelectionProperty, value);\n  528 |         }","lines":47,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/Calendar/Calendar.cs#L482-L528"},{"ref":"src/Avalonia.Controls/Calendar/Calendar.cs:1536-1537","code":" 1536 |             if (!AllowTapRangeSelection || \n 1537 |                 (SelectionMode != CalendarSelectionMode.SingleRange && SelectionMode != CalendarSelectionMode.MultipleRange))","lines":2,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/Calendar/Calendar.cs#L1536-L1537"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"RemovePage is documented as removing a page \"without animation\", but the branch that removes the current top page calls ExecutePopCore(), which sets _isPop = true and calls UpdateActivePage(). UpdateActivePage resolves the transition to the configured PageTransition (no override is active and _hasHadFirstPage is true), so removing the visible top page actually runs the full page transition. This contradicts the XML doc and is also inconsistent with the non-top branch, which mutates the stack silently with no transition.","fix":"Either update the doc remark to state that removing the currently visible page animates using PageTransition, or suppress the transition for RemovePage by pushing an explicit no-animation override before ExecutePopCore() (set _hasOverrideTransition = true; _overrideTransition = null; around the ExecutePopCore call) so the top-page removal matches the documented no-animation behavior.","locations":[{"ref":"src/Avalonia.Controls/Page/NavigationPage.cs:1618-1635","code":" 1618 |         public void RemovePage(Page page)\n 1619 |         {\n 1620 |             ArgumentNullException.ThrowIfNull(page);\n 1621 |             if (_isNavigating)\n 1622 |                 return;\n 1623 | \n 1624 |             if (_navigationStack.Count > 0 && ReferenceEquals(_navigationStack.Peek(), page))\n 1625 |             {\n 1626 |                 var old = ExecutePopCore();\n 1627 |                 if (old != null)\n 1628 |                 {\n 1629 |                     var newCurrentPage = CurrentPage;\n 1630 |                     old.SendNavigatedFrom(new NavigatedFromEventArgs(newCurrentPage, NavigationType.Remove));\n 1631 |                     newCurrentPage?.SendNavigatedTo(new NavigatedToEventArgs(old, NavigationType.Remove));\n 1632 |                 }\n 1633 |                 PageRemoved?.Invoke(this, new PageRemovedEventArgs(page));\n 1634 |                 return;\n 1635 |             }","lines":18,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/Page/NavigationPage.cs#L1618-L1635"},{"ref":"src/Avalonia.Controls/Page/NavigationPage.cs:1802-1829","code":" 1802 |         protected override void UpdateActivePage(NavigationType navigationType)\n 1803 |         {\n 1804 |             bool isPop = _isPop;\n 1805 |             _isPop = false;\n 1806 | \n 1807 |             bool hasOverride = _hasOverrideTransition;\n 1808 |             IPageTransition? overrideTransition = _overrideTransition;\n 1809 |             _hasOverrideTransition = false;\n 1810 |             _overrideTransition = null;\n 1811 | \n 1812 |             _navigationStack.TryPeek(out var page);\n 1813 | \n 1814 |             if (_contentHost != null && _pagePresenter != null && _pageBackPresenter != null)\n 1815 |             {\n 1816 |                 IPageTransition? resolvedTransition;\n 1817 | \n 1818 |                 if (!_hasHadFirstPage)\n 1819 |                 {\n 1820 |                     resolvedTransition = null;\n 1821 |                 }\n 1822 |                 else if (hasOverride)\n 1823 |                 {\n 1824 |                     resolvedTransition = overrideTransition;\n 1825 |                 }\n 1826 |                 else\n 1827 |                 {\n 1828 |                     resolvedTransition = PageTransition;\n 1829 |                 }","lines":28,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/Page/NavigationPage.cs#L1802-L1829"}]},

{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"`SetMarkedText` logs `selectedRange.Location` twice - once for the `{start}`\nplaceholder and once for the `{len}` placeholder (line 259-260). The second\nargument should be `selectedRange.Length` to show the selection length. As written,\nthe log always prints the same integer twice under different labels, making the\ndebug output misleading when diagnosing IME issues.","fix":"Change the second `selectedRange.Location` to `selectedRange.Length`.","locations":[{"ref":"src/iOS/Avalonia.iOS/TextInputResponder.cs:275-277","code":"  275 |             Logger.TryGet(LogEventLevel.Debug, ImeLog)?\n  276 |                 .Log(null, \"IUIKeyInput.SetMarkedText {start} {len} {text}\", selectedRange.Location,\n  277 |                     selectedRange.Location, markedText);","lines":3,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/iOS/Avalonia.iOS/TextInputResponder.cs#L275-L277"}]},
{"id":"CMT_8","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The `Typeface` constructor validates `if ((int)stretch < 1)` (i.e. stretch must be >= 1, matching `FontStretch.UltraCondensed == 1`) but throws with the message \"Font stretch must be > 1.\", which is off by one and would confuse a caller who passed `UltraCondensed` (a valid value).","fix":"Correct the message to match the check, e.g. `throw new ArgumentException(\"Font stretch must be >= 1.\");`","locations":[{"ref":"src/Avalonia.Base/Media/Typeface.cs:31-34","code":"   31 |             if ((int)stretch < 1)\n   32 |             {\n   33 |                 throw new ArgumentException(\"Font stretch must be > 1.\");\n   34 |             }","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Base/Media/Typeface.cs#L31-L34"}]},
{"id":"CMT_9","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The `Underline` class summary comment describes it as \"markup helper for indicating superscript content\" - a copy/paste leftover from a superscript element. `Underline` sets `TextDecorationsProperty` to `TextDecorations.Underline`, i.e. it underlines content, not superscript.","fix":"Change the summary to \"Underline element - markup helper for indicating underlined content.\"","locations":[{"ref":"src/Avalonia.Controls/Documents/Underline.cs:4-5","code":"    4 |     /// Underline element - markup helper for indicating superscript content.\n    5 |     /// Equivalent to a Span with TextDecorations property set to TextDecorations.Underlined.","lines":2,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/Documents/Underline.cs#L4-L5"}]},

{"id":"DUP_2","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"`DatePicker.SetGrid` and `DatePickerPresenter.SetGrid` are near-identical (~45 lines each): both build the same `(control, index)` column list keyed off `CultureInfo.CurrentCulture.DateTimeFormat.ShortDatePattern.IndexOf(\"m\"/\"y\"/\"d\")`, sort by index, clear `ColumnDefinitions`, then loop adding an Auto separator column + a Star (138/78) column, reparent, `Grid.SetColumn`, and finally configure two spacers. Only the field/host names differ. This duplication invites drift (indeed one guards spacer nulls and the other does not - see the related finding). A similar duplication exists between `TimePicker.SetGrid` and `TimePickerPresenter.SetGrid`.","fix":"Extract the shared column-building/sorting/spacer logic into a single internal helper (e.g. taking the container `Grid`, the three `(Control host, bool visible)` tuples, and a spacer-configuration callback) and call it from both `SetGrid` implementations.","locations":[{"ref":"src/Avalonia.Controls/DateTimePickers/DatePicker.cs:328-380","code":"  328 |         private void SetGrid()\n  329 |         {\n  330 |             if (_container == null)\n  331 |                 return;\n  332 | \n  333 |             var fmt = CultureInfo.CurrentCulture.DateTimeFormat.ShortDatePattern;\n  334 |             var columns = new List<(TextBlock?, int)>\n  335 |             {\n  336 |                 (_monthText, MonthVisible ? fmt.IndexOf(\"m\", StringComparison.OrdinalIgnoreCase) : -1),\n  337 |                 (_yearText, YearVisible ? fmt.IndexOf(\"y\", StringComparison.OrdinalIgnoreCase) : -1),\n  338 |                 (_dayText, DayVisible ? fmt.IndexOf(\"d\", StringComparison.OrdinalIgnoreCase) : -1),\n  339 |             };\n  340 | \n  341 |             columns.Sort((x, y) => x.Item2 - y.Item2);\n  342 |             _container.ColumnDefinitions.Clear();\n  343 | \n  344 |             var columnIndex = 0;\n  345 | \n  346 |             foreach (var column in columns)\n  347 |             {\n  348 |                 if (column.Item1 is null)\n  349 |                     continue;\n  350 | \n  351 |                 column.Item1.IsVisible = column.Item2 != -1;\n  352 | \n  353 |                 if (column.Item2 != -1)\n  354 |                 {\n  355 |                     if (columnIndex > 0)\n  356 |                     {\n  357 |                         _container.ColumnDefinitions.Add(new ColumnDefinition(0, GridUnitType.Auto));\n  358 |                     }\n  359 | \n  360 |                     _container.ColumnDefinitions.Add(\n  361 |                         new ColumnDefinition(column.Item1 == _monthText ? 138 : 78, GridUnitType.Star));\n  362 | \n  363 |                     if (column.Item1.Parent is null)\n  364 |                     {\n  365 |                         _container.Children.Add(column.Item1);\n  366 |                     }\n  367 | \n  368 |                     Grid.SetColumn(column.Item1, (columnIndex++ * 2));\n  369 |                 }\n  370 |             }\n  371 | \n  372 |             var isSpacer1Visible = columnIndex > 1;\n  373 |             var isSpacer2Visible = columnIndex > 2;\n  374 |             // ternary conditional operator is used to make sure grid cells will be validated\n  375 |             Grid.SetColumn(_spacer1!, isSpacer1Visible ? 1 : 0);\n  376 |             Grid.SetColumn(_spacer2!, isSpacer2Visible ? 3 : 0);\n  377 | \n  378 |             _spacer1!.IsVisible = isSpacer1Visible;\n  379 |             _spacer2!.IsVisible = isSpacer2Visible;\n  380 |         }","lines":53,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Controls/DateTimePickers/DatePicker.cs#L328-L380"},{"ref":"src/Avalonia.Controls/DateTimePickers/DatePickerPresenter.cs:419-472","code":"  419 |         private void SetGrid(TemplateItems items)\n  420 |         {\n  421 |             var fmt = C {"id":"DUP_4","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"UpdateDndFeedback is called with effects from DragEnter (via HandleDragDropPostDispatch) and separately from HandleDragDropDispatch for DragOver (via PostUpdateFeedback). However in HandleDragDropDispatch for DragOver (WaylandDragMotionArgs), PostUpdateFeedback is called with effects from the RawDragEvent. But in HandleDragDropPostDispatch the DragEnter path also calls PostUpdateFeedback. The motion args path (line 42) and the enter path (line 64) both call PostUpdateFeedback, but with different args types — the motion path extracts effects from the RawDragEvent created internally while the enter path reads dragEvent.Effects after Input.Invoke. The DragOver effect is read from the grouper's dispatched event but DragEnter's effect comes from the WaylandRawDragEvent which wraps the source effects, not the framework-modified effects.","fix":"Verify that dragEvent.Effects in HandleDragDropPostDispatch reflects the UI framework's accepted effects (after Input.Invoke), not the original sourceEffects. Since RawDragEvent.Effects is mutated by the framework handler, this should be correct. Add a comment making this explicit.","locations":[{"ref":"src/Avalonia.Wayland/WindowImplBase.DragDrop.cs:37-47","code":"   37 |                 var overEvent = new RawDragEvent(DragDropDevice.Instance, RawDragEventType.DragOver,\n   38 |                     InputRoot!, pos, dragMotion.DataTransfer, dragMotion.SourceEffects, mods);\n   39 |                 Parent.Input?.Invoke(overEvent);\n   40 | \n   41 |                 var effects = overEvent.Effects;\n   42 |                 dragMotion.OfferCookie?.PostUpdateFeedback(effects);\n   43 |                 return true;\n   44 |             }\n   45 | \n   46 |             return false;\n   47 |         }","lines":11,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Wayland/WindowImplBase.DragDrop.cs#L37-L47"},{"ref":"src/Avalonia.Wayland/WindowImplBase.DragDrop.cs:54-71","code":"   54 |         protected bool HandleDragDropPostDispatch(RawInputEventArgs args)\n   55 |         {\n   56 |             if (args is not WaylandRawDragEvent dragEvent)\n   57 |                 return false;\n   58 | \n   59 |             // Route DnD feedback through the session cookie, which resolves\n   60 |             // the correct data device on the Wayland thread.\n   61 |             if (dragEvent.Type is RawDragEventType.DragEnter)\n   62 |             {\n   63 |                 var effects = dragEvent.Effects;\n   64 |                 dragEvent.OfferCookie?.PostUpdateFeedback(effects);\n   65 |             }\n   66 |             else if (dragEvent.Type is RawDragEventType.Drop)\n   67 |             {\n   68 |                 dragEvent.OfferCookie?.PostFinish();\n   69 |             }\n   70 | \n   71 |             return true;","lines":18,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Wayland/WindowImplBase.DragDrop.cs#L54-L71"}]},

{"id":"DUP_6","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"The UCD line-parsing loops are duplicated almost verbatim across the generator: identical regex `([0-9A-F]+)(?:\\.\\.([0-9A-F]+))?\\s*;\\s*(\\w+)\\s*#.*`, StreamReader loop, empty-line skip, hex parse of start/end, and tuple append. `ReadData` and `ReadBreakData` are byte-for-byte the same (~35 lines each) and `ReadUnicodeData`/`ReadMissingUnicodeData`/`ReadBiDiPairedBracketData`/`ReadIndicConjunctBreakData` are near-identical variants, so a fix to one (e.g. a format change) must be repeated in every copy.","fix":"Extract a single shared helper that takes the file name and the `Regex` (or a line-parsing delegate) and returns the `List<(int,int,string)>`, then call it from each generator instead of copy-pasting the loop.","locations":[{"ref":"src/tools/Avalonia.UnicodeTrieGenerator/EastAsianWidthClassTrieGenerator.cs:61-97","code":"   61 |     private static List<(int, int, string)> ReadData(string file)\n   62 |     {\n   63 |         var data = new List<(int, int, string)>();\n   64 |         var rx = new Regex(@\"([0-9A-F]+)(?:\\.\\.([0-9A-F]+))?\\s*;\\s*(\\w+)\\s*#.*\", RegexOptions.Compiled);\n   65 | \n   66 |         using var stream = UcdDownloader.OpenRead(file);\n   67 |         using var reader = new StreamReader(stream);\n   68 | \n   69 |         while (!reader.EndOfStream)\n   70 |         {\n   71 |             var line = reader.ReadLine();\n   72 | \n   73 |             if (string.IsNullOrEmpty(line))\n   74 |             {\n   75 |                 continue;\n   76 |             }\n   77 | \n   78 |             var match = rx.Match(line);\n   79 | \n   80 |             if (!match.Success)\n   81 |             {\n   82 |                 continue;\n   83 |             }\n   84 | \n   85 |             var start = Convert.ToInt32(match.Groups[1].Value, 16);\n   86 |             var end = start;\n   87 | \n   88 |             if (!strin {"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"AvnPanelWindow.mm achieves code reuse by #include-ing AvnWindow.mm with IS_NSPANEL defined. Including .mm files is fragile: it causes the entire translation unit to be re-compiled under a different macro, any static variables inside AvnWindow.mm are duplicated in each TU, and linker diagnostics become confusing.","fix":"Refactor the shared implementation into a proper base class or use a separate .mm file with template/macro-free parameterization.","locations":[{"ref":"native/Avalonia.Native/src/OSX/AvnPanelWindow.mm:1-8","code":"    1 | //\n    2 | // Created by Dan Walmsley on 06/05/2022.\n    3 | // Copyright (c) 2022 Avalonia. All rights reserved.\n    4 | //\n    5 | \n    6 | #define IS_NSPANEL\n    7 | \n    8 | #include \"AvnWindow.mm\"","lines":8,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/native/Avalonia.Native/src/OSX/AvnPanelWindow.mm#L1-L8"}]},
{"id":"ARCH_2","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"The in-process DnD sentinel MIME type dictionary s_inProcessDrags is a static Dictionary<string, IDataTransfer> shared across all Wayland sessions. It is accessed exclusively from the Wayland thread (PostOob callbacks), so it is thread-safe for single-connection use. However, when EnableReconnects is true and the compositor reconnects, the Wayland worker thread changes (a new Thread starts in StartCore) and s_inProcessDrags might be accessed from two different threads if a reconnect races with an in-flight DnD. Also, since s_inProcessDrags is static, it survives across headless test sessions within the same process, potentially causing cross-test pollution.","fix":"Make s_inProcessDrags an instance field on WaylandOutgoingTransfer or on WaylandWorker, not a static. Pass it through the globals or worker so each session has its own dictionary.","locations":[{"ref":"src/Avalonia.Wayland/Clipboard/WaylandOutgoingTransfer.cs:48","code":"   48 |     private static readonly Dictionary<string, IDataTransfer> s_inProcessDrags = new();","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.Wayland/Clipboard/WaylandOutgoingTransfer.cs#L48"}]},
{"id":"ARCH_3","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"X11Window is 1725 lines and implements IWindowImpl, IPopupImpl, IXI2Client, IX11OptionsToplevelImplFeature, and IXdndWindow simultaneously. It mixes window lifecycle, event routing, IME handling, drag-drop, XSync, transparency, decorations, screen scaling, and input method logic. The class is split across multiple partial files (X11Window.cs, X11Window.Ime.cs, etc.) but remains a large, multi-responsibility class. Adding new features requires understanding many interacting concerns.","fix":"Consider extracting self-contained subsystems (XSync counter management, decoration state, scaling state) into small helper classes, similar to how TransparencyHelper and WindowActivationTrackingHelper are already extracted.","locations":[{"ref":"src/Avalonia.X11/X11Window.cs:36-38","code":"   36 |     internal unsafe partial class X11Window : IWindowImpl, IPopupImpl, IXI2Client,\n   37 |         IX11OptionsToplevelImplFeature, IXdndWindow\n   38 |     {","lines":3,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Avalonia.X11/X11Window.cs#L36-L38"}]},
{"id":"ARCH_4","type":"architecture","type_label":"Architecture","severity":"negligible","difficulty":"medium","description":"WinUiCompositedWindow.ResizeIfNeeded() acquires _shared.SyncRoot via `lock` but\nthe method is also called from WinUiCompositedWindowRenderTarget.BeginDraw() which\nholds the SyncRoot indirectly via BeginTransaction(). The transaction holds the\nmonitor for the entire drawing duration. ResizeIfNeeded is called while the monitor\nis already held (BeginTransaction returns a Disposable that holds the monitor), so\nthe inner `lock` in ResizeIfNeeded is a recursive lock acquisition on the same\nmonitor by the same thread. In .NET, Monitor is re-entrant for the same thread, so\nthis does not deadlock, but it is a code-smell that can mask future deadlocks if\nthe locking discipline changes.","fix":"Remove the redundant lock inside ResizeIfNeeded since it is always called with\nthe SyncRoot already held via BeginTransaction. Add a Debug.Assert to enforce this.","locations":[{"ref":"src/Windows/Avalonia.Win32/WinRT/Composition/WinUiCompositedWindow.cs:97-114","code":"   97 |     public IDisposable BeginTransaction()\n   98 |     {\n   99 |         Monitor.Enter(_shared.SyncRoot);\n  100 |         return Disposable.Create(() => Monitor.Exit(_shared.SyncRoot));\n  101 |     }\n  102 | \n  103 |     public void ResizeIfNeeded(PixelSize size)\n  104 |     {\n  105 |         lock (_shared.SyncRoot)\n  106 |         {\n  107 |             if (_size != size)\n  108 |             {\n  109 |                 _visual.SetSize(new Vector2(size.Width, size.Height));\n  110 |                 _compositionRoundedRectangleGeometry?.SetSize(new Vector2(size.Width, size.Height));\n  111 |                 _size = size;\n  112 |             }\n  113 |         }\n  114 |     }","lines":18,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Windows/Avalonia.Win32/WinRT/Composition/WinUiCompositedWindow.cs#L97-L114"},{"ref":"src/Windows/Avalonia.Win32/WinRT/Composition/WinUiCompositedWindowSurface.cs:149-215","code":"  149 |         public unsafe IDirect3D11TextureRenderTargetRenderSession BeginDraw(\n  150 |             IRenderTarget.RenderTargetSceneInfo sceneInfo)\n  151 |         {\n  152 |             if (State.IsCorrupted)\n  153 |                 throw new RenderTargetCorruptedException();\n  154 |             var transaction = _window.BeginTransaction();\n  155 | \n  156 |             bool needsEndDraw = false;\n  157 |             try\n  158 |             {\n  159 |                 bool isTransparency = sceneInfo.TransparencyLevel != CompositionTransparencyLevel.None;\n  160 |                \n  161 |                 if (_surface is null || _surfaceInterop is null || _drawingSurface is null || _isSurfaceSupportTransparency != isTransparency)\n  162 |                 {\n  163 |                     // Re-create the surface with correct alpha mode if the transparency support is not correct. This can happen when the transparency level is changed.\n  164 |                     _surface?.Dispose();\n  165 |                     _surfaceInterop?.Dispose();\n  166 |                     _drawingSurface?.Dispose();\n  167 | \n  168 |                     CreateSurface(in sceneInfo);\n  169 |                 }\n  170 | \n  171 |                 var size = sceneInfo.Size;\n  172 |                 var scale = sceneInfo.Scaling;\n  173 |                 _window.ResizeIfNeeded(size);\n  174 |                 _window.SetSurface(_surface);\n  175 |                 \n  176 |                 void* pTexture;\n  177 |                 UnmanagedMethods.POINT off;\n  178 |                 try\n  179 |                 {\n  180 |                     if (_size != size)\n  181 |                     {\n  182 |                         _surfaceInterop.Resize(new UnmanagedMethods.POINT\n  183 |                         {\n  184 |                             X = size.Width,\n  185 |                             Y = size. {"id":"OTHER_1","type":"other","type_label":"Other","severity":"high","difficulty":"medium","description":"s_acrylicNoiseShader is a static field initialized lazily without any lock in DrawingContextImpl.CreateAcrylicPaint(). Multiple threads can concurrently call CreateAcrylicPaint() (one per window / render context). Two threads can both see the field as null, create two SKShader objects, and one thread's shader is then leaked permanently. Additionally the winner's shader may reference a SKBitmap that was already disposed by another thread's using block.","fix":"Use Interlocked.CompareExchange or a dedicated lock to initialize s_acrylicNoiseShader exactly once.","locations":[{"ref":"src/Skia/Avalonia.Skia/DrawingContextImpl.cs:42","code":"   42 |         private static SKShader? s_acrylicNoiseShader;","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Skia/Avalonia.Skia/DrawingContextImpl.cs#L42"},{"ref":"src/Skia/Avalonia.Skia/DrawingContextImpl.cs:1351-1359","code":" 1351 |             if (s_acrylicNoiseShader == null)\n 1352 |             {\n 1353 |                 using (var stream = typeof(DrawingContextImpl).Assembly.GetManifestResourceStream(\"Avalonia.Skia.Assets.NoiseAsset_256X256_PNG.png\"))\n 1354 |                 using (var bitmap = SKBitmap.Decode(stream))\n 1355 |                 {\n 1356 |                     s_acrylicNoiseShader = SKShader.CreateBitmap(bitmap, SKShaderTileMode.Repeat, SKShaderTileMode.Repeat)\n 1357 |                         .WithColorFilter(CreateAlphaColorFilter(noiseOpcity));\n 1358 |                 }\n 1359 |             }","lines":9,"link":"https://github.com/AvaloniaUI/Avalonia/blob/cd3b218eb4f652905bfdab7a0e704a6139c5d332/src/Skia/Avalonia.Skia/DrawingContextImpl.cs#L1351-L1359"}]}
