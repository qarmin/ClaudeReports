<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`parse_hex_color` in `anstyle-git` computes `l = hex.len()` (a byte count) and then slices `hex[0..l]`, `hex[l..(2*l)]`, `hex[(2*l)..(3*l)]` on the `&str`. If `hex` contains a multi-byte UTF-8 character whose byte length happens to be `3` or `6` (e.g. a single 3-byte character like `'日'`), the length check `l != 3 && l != 6` passes, but the subsequent byte-offset slicing lands in the middle of the multi-byte character, which is not a char boundary. Slicing a `&str` at a non-char-boundary index panics. Since `anstyle_git::parse` is a public API that feeds arbitrary whitespace-separated words from a caller-supplied string (e.g. `GIT_COLOR` style config values, which can come from an untrusted `.gitconfig`) into `parse_color` -> `parse_hex_color`, a string like `anstyle_git::parse(\"#日\")` panics instead of returning `Err(())`, turning a malformed-input case into a crash / denial of service.","fix":"Reject non-ASCII input before slicing by byte length, since hex digits are always ASCII:\n```rust\nfn parse_hex_color(hex: &str) -> Result<anstyle::Color, ()> {\n    if !hex.is_ascii() {\n        return Err(());\n    }\n    let l = hex.len();\n    if l != 3 && l != 6 {\n        return Err(());\n    }\n    ...\n}\n```\nWith the `is_ascii()` guard, every byte index is guaranteed to be a char boundary, so the existing slicing can no longer panic.","locations":[{"ref":"crates/anstyle-git/src/lib.rs:125-141","code":"  125 | fn parse_hex_color(hex: &str) -> Result<anstyle::Color, ()> {\n  126 |     let l = hex.len();\n  127 |     if l != 3 && l != 6 {\n  128 |         return Err(());\n  129 |     }\n  130 |     let l = l / 3;\n  131 |     if let (Ok(r), Ok(g), Ok(b)) = (\n  132 |         u8::from_str_radix(&hex[0..l], 16),\n  133 |         u8::from_str_radix(&hex[l..(2 * l)], 16),\n  134 |         u8::from_str_radix(&hex[(2 * l)..(3 * l)], 16),\n  135 |     ) {\n  136 |         let m = if l == 1 { 0x11 } else { 1 };\n  137 |         Ok(anstyle::Color::from((r * m, g * m, b * m)))\n  138 |     } else {\n  139 |         Err(())\n  140 |     }\n  141 | }","lines":17,"link":"https://github.com/rust-cli/anstyle/blob/9816ad155169e70e997f4200afc2ba93fc72497b/crates/anstyle-git/src/lib.rs#L125-L141"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`anstyle_parse::Params` yields `u16` values, but in `csi_dispatch` the 256-color and RGB branches truncate them to `u8` without range-checking: `anstyle::Ansi256Color(n as u8)` at line 205, and `anstyle::RgbColor(r as u8, g as u8, b as u8)` at line 221 (using the previously captured `r`/`g` plus the current `b`). A malformed or adversarial escape sequence such as `\\x1b[38;5;300m` silently wraps `300` to `44` instead of being rejected or clamped, producing a plausible-looking but wrong color rather than surfacing the malformed input.","fix":"Validate the value is within `0..=255` before casting (e.g. `u8::try_from(n).ok()` / `u8::try_from(b).ok()`) and skip/ignore the color update (falling back to `CsiState::Normal`) when out of range, instead of silently truncating with `as u8`.","locations":[{"ref":"crates/anstream/src/adapter/wincon.rs:204-212","code":"  204 |                     (CsiState::Ansi256, n) => {\n  205 |                         let color = anstyle::Ansi256Color(n as u8);\n  206 |                         style = match color_target {\n  207 |                             ColorTarget::Fg => style.fg_color(Some(color.into())),\n  208 |                             ColorTarget::Bg => style.bg_color(Some(color.into())),\n  209 |                             ColorTarget::Underline => style.underline_color(Some(color.into())),\n  210 |                         };\n  211 |                         break;\n  212 |                     }","lines":9,"link":"https://github.com/rust-cli/anstyle/blob/9816ad155169e70e997f4200afc2ba93fc72497b/crates/anstream/src/adapter/wincon.rs#L204-L212"},{"ref":"crates/anstream/src/adapter/wincon.rs:213-229","code":"  213 |                     (CsiState::Rgb, b) => match (r, g) {\n  214 |                         (None, _) => {\n  215 |                             r = Some(b);\n  216 |                         }\n  217 |                         (Some(_), None) => {\n  218 |                             g = Some(b);\n  219 |                         }\n  220 |                         (Some(r), Some(g)) => {\n  221 |                             let color = anstyle::RgbColor(r as u8, g as u8, b as u8);\n  222 |                             style = match color_target {\n  223 |                                 ColorTarget::Fg => style.fg_color(Some(color.into())),\n  224 |                                 ColorTarget::Bg => style.bg_color(Some(color.into())),\n  225 |                                 ColorTarget::Underline => style.underline_color(Some(color.into())),\n  226 |                             };\n  227 |                             break;\n  228 |                         }\n  229 |                     },","lines":17,"link":"https://github.com/rust-cli/anstyle/blob/9816ad155169e70e997f4200afc2ba93fc72497b/crates/anstream/src/adapter/wincon.rs#L213-L229"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"In `AnsiCapture::csi_dispatch` (`anstyle-svg/src/adapter.rs`), when parsing an SGR Ansi256 color (`38;5;n` / `48;5;n` / `58;5;n`) or an RGB color (`38;2;r;g;b` etc.), the raw parameter value is truncated with `n as u8` / `b as u8` without range-checking (`anstyle::Ansi256Color(n as u8)`, `anstyle::RgbColor(r as u8, g as u8, b as u8)`). If a malformed/adversarial ANSI stream supplies a value greater than 255 (params are parsed as larger integers by `anstyle_parse`), the value silently wraps instead of being rejected, producing an unexpected, unrelated color rather than an error or a no-op. Since `anstyle-svg` is meant to faithfully render arbitrary/untrusted terminal capture data (e.g. from CI logs), this could misrender colors without any indication something was truncated.","fix":"Validate the parameter is within `0..=255` before constructing the color (e.g. `u8::try_from(n).ok()`), and skip/ignore the SGR sequence (falling back to `CsiState::Normal`) when it is out of range instead of silently truncating.","locations":[{"ref":"crates/anstyle-svg/src/adapter.rs:251-276","code":"  251 |                     (CsiState::Ansi256, n) => {\n  252 |                         let color = anstyle::Ansi256Color(n as u8);\n  253 |                         style = match color_target {\n  254 |                             ColorTarget::Fg => style.fg_color(Some(color.into())),\n  255 |                             ColorTarget::Bg => style.bg_color(Some(color.into())),\n  256 |                             ColorTarget::Underline => style.underline_color(Some(color.into())),\n  257 |                         };\n  258 |                         break;\n  259 |                     }\n  260 |                     (CsiState::Rgb, b) => match (r, g) {\n  261 |                         (None, _) => {\n  262 |                             r = Some(b);\n  263 |                         }\n  264 |                         (Some(_), None) => {\n  265 |                             g = Some(b);\n  266 |                         }\n  267 |                         (Some(r), Some(g)) => {\n  268 |                             let color = anstyle::RgbColor(r as u8, g as u8, b as u8);\n  269 |                             style = match color_target {\n  270 |                                 ColorTarget::Fg => style.fg_color(Some(color.into())),\n  271 |                                 ColorTarget::Bg => style.bg_color(Some(color.into())),\n  272 |                                 ColorTarget::Underline => style.underline_color(Some(color.into())),\n  273 |                             };\n  274 |                             break;\n  275 |                         }\n  276 |                     },","lines":26,"link":"https://github.com/rust-cli/anstyle/blob/9816ad155169e70e997f4200afc2ba93fc72497b/crates/anstyle-svg/src/adapter.rs#L251-L276"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In `WinconCapture::csi_dispatch`, the local `state: CsiState` (and the `r`/`g` accumulators) are declared once before the `for param in params { for value in param { ... } }` loop and are never reset back to `CsiState::Normal` (or `r`/`g` to `None`) once a `PrepareCustomColor`/`Ansi256`/`Rgb`/`Underline` sub-sequence has been fully consumed. `anstyle_parse::Params` yields one slice per semicolon-separated top-level parameter (colon-separated subparameters share a slice), so a real-world SGI sequence like `\\x1b[38;5;208;1m` (256-color foreground followed by bold) is delivered as four separate top-level params `[38]`, `[5]`, `[208]`, `[1]`. After `208` is consumed the code hits `(CsiState::Ansi256, n) => { ...; break; }` which sets the color but leaves `state == CsiState::Ansi256`. The next param `[1]` (meant to be bold) then matches the same `(CsiState::Ansi256, n)` arm again with `n = 1`, silently overwriting the just-set color with `Ansi256Color(1)` and never applying bold. The same problem affects `CsiState::Rgb` (stale `r`/`g` get reused with a new component from an unrelated later param, producing a bogus RGB color) and `CsiState::Underline` (e.g. `4:3;1m` for curly-underline+bold loses the bold because `1` matches `(CsiState::Underline, 1) => { // underline already set }`, a no-op). This corrupts styling on Windows console output (`wincon` feature) for any combined color+attribute SGI sequence, and is not covered by the existing tests (`start`/`middle`/`end`/`ansi256_colors` only ever set a single style per test).","fix":"Reset `state` (and `r`/`g`) back to `Normal`/`None` on every arm that fully consumes a color/underline value, e.g.:\n```rust\n(CsiState::Ansi256, n) => {\n    let color = anstyle::Ansi256Color(n as u8);\n    style = match color_target {\n        ColorTarget::Fg => style.fg_color(Some(color.into())),\n        ColorTarget::Bg => style.bg_color(Some(color.into())),\n        ColorTarget::Underline => style.underline_color(Some(color.into())),\n    };\n    state = CsiState::Normal;\n    break;\n}\n```\nand similarly add `state = CsiState::Normal;` (plus `r = None; g = None;`) in the `(Some(r), Some(g))` Rgb arm, all `CsiState::Underline` arms, and the fallback `_ => { state = CsiState::Normal; break; }` arm so an unexpected value cannot leave the state machine stuck in a sub-state for subsequent, unrelated params.","locations":[{"ref":"crates/anstream/src/adapter/wincon.rs:107-262","code":"  107 |         let mut style = self.style;\n  108 |         // param/value differences are dependent on the escape code\n  109 |         let mut state = CsiState::Normal;\n  110 |         let mut r = None;\n  111 |         let mut g = None;\n  112 |         let mut color_target = ColorTarget::Fg;\n  113 |         for param in params {\n  114 |             for value in param {\n  115 |                 match (state, *value) {\n  116 |                     (CsiState::Normal, 0) => {\n  117 |                         style = anstyle::Style::default();\n  118 |                         break;\n  119 |                     }\n  120 |                     (CsiState::Normal, 1) => {\n  121 |                         style = style.bold();\n  122 |                         break;\n  123 |                     }\n  124 |                     (CsiState::Normal, 2) => {\n  125 |                         style = style.dimmed();\n  126 |                         break;\n  127 |                     }\n  128 |                     (CsiState::Normal, 3) => {\n  129 |                         style = style.italic();\n  130 |                         break;\n  131 |                     }\n  132 |                     (CsiState::Normal, 4) => {\n  133 |                         style = style.underline();\n  134 |                         state = CsiState::Underline;\n  135 |                     }\n  136 |                     (CsiState::Normal {"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`encode_path` (used by `file_to_url`/`dir_to_url`/`path_to_url` in `anstyle-hyperlink`) builds a `file://` URL purely from `path.components()`, prefixing every `Normal`/`ParentDir` component with `/` and skipping `RootDir`/`CurDir` entirely. It never checks whether `path` is actually absolute. For a relative path such as `\"foo/bar.txt\"`, `components()` yields only `Normal(\"foo\")`, `Normal(\"bar.txt\")` (no `RootDir`), so `encode_path` still emits `/foo/bar.txt`, and the final URL becomes `file:///foo/bar.txt` - i.e. a relative path is silently turned into an absolute-looking URI rooted at `/`, pointing at a location unrelated to the file the caller passed in. None of `path_to_url`, `file_to_url`, or `dir_to_url` document a requirement that `path` be absolute, so this is easy API misuse with a wrong (not just degraded) result rather than an error.","fix":"Either document that callers must pass an absolute path (and debug_assert!/canonicalize accordingly), or make the functions defensive, e.g. in `file_to_url`/`dir_to_url` canonicalize/absolutize the path first:\n```rust\npub fn file_to_url(hostname: Option<&str>, path: &std::path::Path) -> Option<String> {\n    if !path.is_absolute() {\n        return None; // or canonicalize\n    }\n    ...\n}\n```","locations":[{"ref":"crates/anstyle-hyperlink/src/file.rs:1-31","code":"    1 | /// Create a URL from a given path\n    2 | pub fn path_to_url(path: &std::path::Path) -> Option<String> {\n    3 |     // Do a best-effort for getting the host in the URL\n    4 |     let hostname = if cfg!(windows) {\n    5 |         // Not supported correctly on windows\n    6 |         None\n    7 |     } else {\n    8 |         crate::hostname().ok().and_then(|os| os.into_string().ok())\n    9 |     };\n   10 |     if path.is_dir() {\n   11 |         dir_to_url(hostname.as_deref(), path)\n   12 |     } else {\n   13 |         file_to_url(hostname.as_deref(), path)\n   14 |     }\n   15 | }\n   16 | \n   17 | /// Create a URL from a given hostname and file path\n   18 | ///\n   19 | /// For hyperlink escape codes, the hostname is used to avoid issues with opening a link scoped to\n   20 | /// the computer you've SSH'ed into\n   21 | /// ([reference](https://gist.github.com/egmontkob/eb114294efbcd5adb1944c9f3cb5feda#file-uris-and-the-hostname))\n   22 | pub fn file_to_url(hostname: Option<&str>, path: &std::path::Path) -> Option<String> {\n   23 |     let mut url = \"file://\".to_owned();\n   24 |     if let Some(hostname) = hostname {\n   25 |         url.push_str(hostname);\n   26 |     }\n   27 | \n   28 |     encode_path(path, &mut url);\n   29 | \n   30 |     Some(url)\n   31 | }","lines":31,"link":"https://github.com/rust-cli/anstyle/blob/9816ad155169e70e997f4200afc2ba93fc72497b/crates/anstyle-hyperlink/src/file.rs#L1-L31"},{"ref":"crates/anstyle-hyperlink/src/file.rs:176-207","code":"  176 | fn encode_path(path: &std::path::Path, url: &mut String) {\n  177 |     let mut is_path_empty = true;\n  178 | \n  179 |     for component in path.components() {\n  180 |         is_path_empty = false;\n  181 |         match component {\n  182 |             std::path::Component::Prefix(prefix) => {\n  183 |                 url.push_str(URL_PATH_SEP);\n  184 |                 let component = prefix.as_os_str().to_string_lossy();\n  185 |                 url.push_str(&component);\n  186 |             }\n  187 |             std::path::Component::RootDir => {}\n  188 |             std::path::Component::CurDir => {}\n  189 |             std::path::Component::ParentDir => {\n  190 |                 url.push_str(URL_PATH_SEP);\n  191 |                 url.push_str(\"..\");\n  192 |             }\n  193 |             std::path::Component::Normal(part) => {\n  194 |                 url.push_str(URL_PATH_SEP);\n  195 |                 let component = part.to_string_lossy();\n  196 | {"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `encode_path`, `std::path::Component::Normal` parts are percent-encoded via `percent_encoding::percent_encode(component.as_bytes(), SPECIAL_PATH_SEGMENT)`, but `std::path::Component::Prefix` (Windows drive letters and, notably, UNC `\\\\server\\share` prefixes) is pushed raw via `prefix.as_os_str().to_string_lossy()` with no percent-encoding at all. A UNC prefix can contain characters that need escaping in a URL path segment (spaces, `#`, `%`, non-ASCII host/share names), and since it's inserted unescaped, the resulting `file://` URL can be malformed or have a different meaning than intended for such paths. This is an inconsistency between how `Prefix` and `Normal` components are handled in the same function.","fix":"Percent-encode the prefix component the same way `Normal` components are encoded:\n```rust\nstd::path::Component::Prefix(prefix) => {\n    url.push_str(URL_PATH_SEP);\n    let component = prefix.as_os_str().to_string_lossy();\n    url.extend(percent_encoding::percent_encode(component.as_bytes(), SPECIAL_PATH_SEGMENT));\n}\n```","locations":[{"ref":"crates/anstyle-hyperlink/src/file.rs:182-186","code":"  182 |             std::path::Component::Prefix(prefix) => {\n  183 |                 url.push_str(URL_PATH_SEP);\n  184 |                 let component = prefix.as_os_str().to_string_lossy();\n  185 |                 url.push_str(&component);\n  186 |             }","lines":5,"link":"https://github.com/rust-cli/anstyle/blob/9816ad155169e70e997f4200afc2ba93fc72497b/crates/anstyle-hyperlink/src/file.rs#L182-L186"}]},

{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"In `ansi_to_termcolor_color` (`anstyle-termcolor/src/lib.rs`), `AnsiColor::BrightBlue` is mapped to `termcolor::Color::Black` instead of `termcolor::Color::Blue`. Every other bright variant maps to its matching base color (`BrightRed` -> `Red`, `BrightGreen` -> `Green`, etc.), so this is clearly a copy-paste error from the `BrightBlack => Black` line just above it. Any code using `anstyle_termcolor::to_termcolor_color` (or `to_termcolor_spec`) with `AnsiColor::BrightBlue` will render black text/background instead of blue. Notably, `crates/anstyle-crossterm/CHANGELOG.md:16` documents fixing this *exact* bug (\"Convert `BrightBlue` to `Blue`, not `Black`\") in the sibling `anstyle-crossterm` crate, confirming this is a known bug pattern that was never fixed here.","fix":"Change the `BrightBlue` arm to match the pattern of the other colors:\n```rust\nanstyle::AnsiColor::BrightBlue => termcolor::Color::Blue,\n```","locations":[{"ref":"crates/anstyle-termcolor/src/lib.rs:33-52","code":"   33 | fn ansi_to_termcolor_color(color: anstyle::AnsiColor) -> termcolor::Color {\n   34 |     match color {\n   35 |         anstyle::AnsiColor::Black => termcolor::Color::Black,\n   36 |         anstyle::AnsiColor::Red => termcolor::Color::Red,\n   37 |         anstyle::AnsiColor::Green => termcolor::Color::Green,\n   38 |         anstyle::AnsiColor::Yellow => termcolor::Color::Yellow,\n   39 |         anstyle::AnsiColor::Blue => termcolor::Color::Blue,\n   40 |         anstyle::AnsiColor::Magenta => termcolor::Color::Magenta,\n   41 |         anstyle::AnsiColor::Cyan => termcolor::Color::Cyan,\n   42 |         anstyle::AnsiColor::White => termcolor::Color::White,\n   43 |         anstyle::AnsiColor::BrightBlack => termcolor::Color::Black,\n   44 |         anstyle::AnsiColor::BrightRed => termcolor::Color::Red,\n   45 |         anstyle::AnsiColor::BrightGreen => termcolor::Color::Green,\n   46 |         anstyle::AnsiColor::BrightYellow => termcolor::Color::Yellow,\n   47 |         anstyle::AnsiColor::BrightBlue => termcolor::Color::Black,\n   48 |         anstyle::AnsiColor::BrightMagenta => termcolor::Color::Magenta,\n   49 |         anstyle::AnsiColor::BrightCyan => termcolor::Color::Cyan,\n   50 |         anstyle::AnsiColor::BrightWhite => termcolor::Color::White,\n   51 |     }\n   52 | }","lines":20,"link":"https://github.com/rust-cli/anstyle/blob/9816ad155169e70e997f4200afc2ba93fc72497b/crates/anstyle-termcolor/src/lib.rs#L33-L52"}]},
{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"In `ansi_to_yansi_color` (`anstyle-yansi/src/lib.rs`), `AnsiColor::BrightBlue` is mapped to `yansi::Color::BrightBlack` instead of `yansi::Color::BrightBlue`. Every other bright variant maps to the matching `yansi::Color::Bright*` variant (`BrightRed` -> `BrightRed`, `BrightGreen` -> `BrightGreen`, etc.), so this line was clearly copy-pasted from the `BrightBlack => BrightBlack` line above without updating the target. Any code using `anstyle_yansi::to_yansi_color`/`to_yansi_style` with `AnsiColor::BrightBlue` renders as bright black (gray) instead of bright blue.","fix":"Change the `BrightBlue` arm to:\n```rust\nanstyle::AnsiColor::BrightBlue => yansi::Color::BrightBlue,\n```","locations":[{"ref":"crates/anstyle-yansi/src/lib.rs:57-76","code":"   57 | fn ansi_to_yansi_color(color: anstyle::AnsiColor) -> yansi::Color {\n   58 |     match color {\n   59 |         anstyle::AnsiColor::Black => yansi::Color::Black,\n   60 |         anstyle::AnsiColor::Red => yansi::Color::Red,\n   61 |         anstyle::AnsiColor::Green => yansi::Color::Green,\n   62 |         anstyle::AnsiColor::Yellow => yansi::Color::Yellow,\n   63 |         anstyle::AnsiColor::Blue => yansi::Color::Blue,\n   64 |         anstyle::AnsiColor::Magenta => yansi::Color::Magenta,\n   65 |         anstyle::AnsiColor::Cyan => yansi::Color::Cyan,\n   66 |         anstyle::AnsiColor::White => yansi::Color::White,\n   67 |         anstyle::AnsiColor::BrightBlack => yansi::Color::BrightBlack,\n   68 |         anstyle::AnsiColor::BrightRed => yansi::Color::BrightRed,\n   69 |         anstyle::AnsiColor::BrightGreen => yansi::Color::BrightGreen,\n   70 |         anstyle::AnsiColor::BrightYellow => yansi::Color::BrightYellow,\n   71 |         anstyle::AnsiColor::BrightBlue => yansi::Color::BrightBlack,\n   72 |         anstyle::AnsiColor::BrightMagenta => yansi::Color::BrightMagenta,\n   73 | {"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In the `dump-wincon` example's `EFFECTS` table, the `\"double_underline\"` command-line value is mapped to `anstyle::Effects::UNDERLINE` instead of `anstyle::Effects::DOUBLE_UNDERLINE`:\n```rust\n(\"underline\", anstyle::Effects::UNDERLINE),\n(\"double_underline\", anstyle::Effects::UNDERLINE),\n```\nThis duplicates the `\"underline\"` entry's effect rather than using the distinct `DOUBLE_UNDERLINE` effect that the crate defines (and that `anstyle-svg/src/adapter.rs` correctly uses for CSI code 21). Passing `--effect double_underline` to this example silently produces a plain underline instead of a double underline.","fix":"Use the correct effect constant:\n```rust\n(\"double_underline\", anstyle::Effects::DOUBLE_UNDERLINE),\n```","locations":[{"ref":"crates/anstyle-wincon/examples/dump-wincon.rs:104-118","code":"  104 |                 Long(\"effect\") => {\n  105 |                     const EFFECTS: [(&str, anstyle::Effects); 12] = [\n  106 |                         (\"bold\", anstyle::Effects::BOLD),\n  107 |                         (\"dimmed\", anstyle::Effects::DIMMED),\n  108 |                         (\"italic\", anstyle::Effects::ITALIC),\n  109 |                         (\"underline\", anstyle::Effects::UNDERLINE),\n  110 |                         (\"double_underline\", anstyle::Effects::UNDERLINE),\n  111 |                         (\"curly_underline\", anstyle::Effects::CURLY_UNDERLINE),\n  112 |                         (\"dotted_underline\", anstyle::Effects::DOTTED_UNDERLINE),\n  113 |                         (\"dashed_underline\", anstyle::Effects::DASHED_UNDERLINE),\n  114 |                         (\"blink\", anstyle::Effects::BLINK),\n  115 |                         (\"invert\", anstyle::Effects::INVERT),\n  116 |                         (\"hidden\", anstyle::Effects::HIDDEN),\n  117 |                         (\"strikethrough\", ans {"id":"CPY_5","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In the `set-wincon` example's `Args::parse`, the `Long(\"bg\")` branch assigns to `res.fg` instead of `res.bg`:\n```rust\nLong(\"bg\") => {\n    res.fg = Some( ... );\n}\n```\nThis means `--bg <color>` never sets the background color (`args.bg` stays `None` forever) and instead silently overwrites whatever `--fg` was set to. The example, whose entire purpose is to let a user interactively set fg/bg wincon colors, cannot set a background color at all.","fix":"Fix the field assigned in the `bg` branch:\n```rust\nLong(\"bg\") => {\n    res.bg = Some(\n        args.value()?\n            .parse_with(|s| s.parse::<u8>().map(anstyle::Ansi256Color))?,\n    );\n}\n```","locations":[{"ref":"crates/anstyle-wincon/examples/set-wincon.rs:50-55","code":"   50 |                 Long(\"bg\") => {\n   51 |                     res.fg = Some(\n   52 |                         args.value()?\n   53 |                             .parse_with(|s| s.parse::<u8>().map(anstyle::Ansi256Color))?,\n   54 |                     );\n   55 |                 }","lines":6,"link":"https://github.com/rust-cli/anstyle/blob/9816ad155169e70e997f4200afc2ba93fc72497b/crates/anstyle-wincon/examples/set-wincon.rs#L50-L55"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"The free function `write` in `crates/anstream/src/wincon.rs` (used by `WinconStream::write`) breaks out of the loop and returns `Ok(buf.len())` even when `raw.write_colored(..)` performed a short write (`possible != written`, marked `// HACK: Unsupported atm`). This violates the `std::io::Write::write` contract, which requires the return value to reflect how many bytes of `buf` were actually consumed. Callers (e.g. `std::io::copy`, or any code that trusts the `Ok(n)` result to advance a cursor) will believe the entire buffer was written and silently lose the unwritten remainder. Contrast with the sibling `crates/anstream/src/strip.rs::write`, which correctly recomputes the real consumed offset via `offset_to`/`initial_state` on a short write.","fix":"Track how many bytes of `buf` correspond to the successfully-written prefix and return that instead of `buf.len()`, mirroring `strip.rs`'s approach, e.g. compute the offset of the printable chunk that only partially wrote and return `Ok(offset + written)` rather than assuming full success.","locations":[{"ref":"crates/anstream/src/wincon.rs:122-138","code":"  122 | fn write(\n  123 |     raw: &mut dyn anstyle_wincon::WinconStream,\n  124 |     state: &mut WinconBytes,\n  125 |     buf: &[u8],\n  126 | ) -> std::io::Result<usize> {\n  127 |     for (style, printable) in state.extract_next(buf) {\n  128 |         let fg = style.get_fg_color().and_then(cap_wincon_color);\n  129 |         let bg = style.get_bg_color().and_then(cap_wincon_color);\n  130 |         let written = raw.write_colored(fg, bg, printable.as_bytes())?;\n  131 |         let possible = printable.len();\n  132 |         if possible != written {\n  133 |             // HACK: Unsupported atm\n  134 |             break;\n  135 |         }\n  136 |     }\n  137 |     Ok(buf.len())\n  138 | }","lines":17,"link":"https://github.com/rust-cli/anstyle/blob/9816ad155169e70e997f4200afc2ba93fc72497b/crates/anstream/src/wincon.rs#L122-L138"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`Parser::osc_raw` is `ArrayVec<u8, MAX_OSC_RAW>` (bounded to 1024 bytes) only under the `core` feature; with the default feature set (`default = [\"utf8\"]`, no `core`), it is `alloc::vec::Vec<u8>` with no size cap at all. In `Action::OscPut`, the `#[cfg(feature = \"core\")] { if self.osc_raw.is_full() { return; } }` guard that bounds growth is compiled out entirely in that default configuration, so `self.osc_raw.push(byte)` runs unconditionally for every byte until an OSC terminator (BEL/ST) arrives. A long-running parser fed an unterminated or extremely long OSC string (e.g. parsing untrusted/remote terminal output, which is exactly the threat model `anstyle-parse` targets) can grow `osc_raw` without bound, giving an easy unbounded-memory-growth / DoS vector in the common (non-`core`) build of the crate.","fix":"Apply an OSC raw-buffer length cap regardless of the `core` feature, e.g. check `self.osc_raw.len() >= MAX_OSC_RAW` (define `MAX_OSC_RAW` unconditionally, not just under `core`) before pushing in the `alloc::vec::Vec` path too, so both configurations bound memory growth the same way.","locations":[{"ref":"crates/anstyle-parse/src/lib.rs:68-71","code":"   68 |     #[cfg(feature = \"core\")]\n   69 |     osc_raw: ArrayVec<u8, MAX_OSC_RAW>,\n   70 |     #[cfg(not(feature = \"core\"))]\n   71 |     osc_raw: alloc::vec::Vec<u8>,","lines":4,"link":"https://github.com/rust-cli/anstyle/blob/9816ad155169e70e997f4200afc2ba93fc72497b/crates/anstyle-parse/src/lib.rs#L68-L71"},{"ref":"crates/anstyle-parse/src/lib.rs:209-243","code":"  209 |             Action::OscPut => {\n  210 |                 #[cfg(feature = \"core\")]\n  211 |                 {\n  212 |                     if self.osc_raw.is_full() {\n  213 |                         return;\n  214 |                     }\n  215 |                 }\n  216 | \n  217 |                 let idx = self.osc_raw.len();\n  218 | \n  219 |                 // Param separator\n  220 |                 if byte == b';' {\n  221 |                     let param_idx = self.osc_num_params;\n  222 |                     match param_idx {\n  223 |                         // Only process up to MAX_OSC_PARAMS\n  224 |                         MAX_OSC_PARAMS => return,\n  225 | \n  226 |                         // First param is special - 0 to current byte index\n  227 |                         0 => {\n  228 |                             self.osc_params[param_idx] = (0, idx);\n  229 |                         }\n  230 | \n  231 |                         // All other params depend on previous indexing\n  232 |                         _ => {\n  233 |                             let prev = self.osc_params[param_idx - 1];\n  234 |                             let begin = prev.1;\n  235 |                             self.osc_params[param_idx] = (begin, idx);\n  236 |                         }\n  237 |                     }\n  238 | \n  239 |                     self.osc_num_params += 1;\n  240 |                 } else {\n  241 |                     self.osc_raw.push(byte);\n  242 |                 }\n  243 |             }","lines":35,"link":"https://github.com/rust-cli/anstyle/blob/9816ad155169e70e997f4200afc2ba93fc72497b/crates/anstyle-parse/src/lib.rs#L209-L243"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`AnsiColor::as_fg_buffer`/`as_bg_buffer` (and the corresponding `Color::write_fg_to`/`write_bg_to` paths for `Color::Ansi`) copy a small `&'static str` (already fully-formed ANSI escape text produced by the `escape!` macro) byte-by-byte into a stack-allocated `DisplayBuffer` via `write_str`, only to immediately copy those same bytes back out again in `DisplayBuffer::write_to`/`Display::fmt`. Unlike `Ansi256Color`/`RgbColor` (which must dynamically format a numeric code and so genuinely need the buffer), `AnsiColor`'s escape codes are fully static, so this indirection is a pure double-copy with no benefit; `render_fg`/`render_bg` for `AnsiColor` already avoid this by using `NullFormatter` directly, so the buffer path is an inconsistent, slower fallback used only by `write_fg_to`/`write_bg_to`/`write_underline_to` via the `Color` enum dispatch.","fix":"For the `Color::Ansi(color)` arm in `write_fg_to`/`write_bg_to`, write `color.as_fg_str().as_bytes()` (or a `NullFormatter`-based writer) directly to the `dyn std::io::Write` instead of routing through `DisplayBuffer::as_fg_buffer`, avoiding the redundant copy.","locations":[{"ref":"crates/anstyle/src/color.rs:44-53","code":"   44 |     #[inline]\n   45 |     #[cfg(feature = \"std\")]\n   46 |     pub(crate) fn write_fg_to(self, write: &mut dyn std::io::Write) -> std::io::Result<()> {\n   47 |         let buffer = match self {\n   48 |             Self::Ansi(color) => color.as_fg_buffer(),\n   49 |             Self::Ansi256(color) => color.as_fg_buffer(),\n   50 |             Self::Rgb(color) => color.as_fg_buffer(),\n   51 |         };\n   52 |         buffer.write_to(write)\n   53 |     }","lines":10,"link":"https://github.com/rust-cli/anstyle/blob/9816ad155169e70e997f4200afc2ba93fc72497b/crates/anstyle/src/color.rs#L44-L53"},{"ref":"crates/anstyle/src/color.rs:231-234","code":"  231 |     #[inline]\n {"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`impl Default for AtomicChoice` in `crates/colorchoice/src/lib.rs` is never called anywhere in the crate. The single `static USER: AtomicChoice` is constructed directly via `AtomicChoice::new()` (a `const fn`), and no test or other code path calls `AtomicChoice::default()` or relies on the `Default` trait for this type. It is unreachable, unused code that adds surface area without benefit.","fix":"Remove the unused `impl Default for AtomicChoice` block, or if a `Default` impl is desired for API consistency, add a `#[test]` or doc example that actually exercises it so it isn't silently dead.","locations":[{"ref":"crates/colorchoice/src/lib.rs:81-85","code":"   81 | impl Default for AtomicChoice {\n   82 |     fn default() -> Self {\n   83 |         Self::new()\n   84 |     }\n   85 | }","lines":5,"link":"https://github.com/rust-cli/anstyle/blob/9816ad155169e70e997f4200afc2ba93fc72497b/crates/colorchoice/src/lib.rs#L81-L85"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"medium","difficulty":"very_easy","description":"The doc comments for `Color::Ansi256` and for the `Ansi256Color` struct describe the 8-bit ANSI 256-color palette layout as `0..16` are `AnsiColor` codes, `0..232` map to `RgbColor` values, and `232..` map to grayscale. The second bullet is wrong and self-contradictory: it overlaps the first bullet's `0..16` range, which is already claimed by `AnsiColor`. Per the actual xterm 256-color spec (and per `Ansi256Color::into_ansi`, which only maps indices `0..=15` to `AnsiColor`), the 6x6x6 RGB color cube occupies indices `16..232`, not `0..232`. This is misleading public API documentation for the foundational `Color`/`Ansi256Color` types used throughout the whole workspace (e.g. by crates converting between `Ansi256Color` and RGB, such as `anstyle-lossy`), and could lead downstream implementers to build an incorrect index-to-RGB mapping table that includes the reserved `0..16` ANSI range.","fix":"Change `- `0..232` map to [`RgbColor`] color values` to `- `16..232` map to [`RgbColor`] color values` in both doc comments (on the `Color::Ansi256` variant and on the `Ansi256Color` struct).","locations":[{"ref":"crates/anstyle/src/color.rs:9-13","code":"    9 |     /// 256 (8-bit) color support\n   10 |     ///\n   11 |     /// - `0..16` are [`AnsiColor`] palette codes\n   12 |     /// - `0..232` map to [`RgbColor`] color values\n   13 |     /// - `232..` map to [`RgbColor`] gray-scale values","lines":5,"link":"https://github.com/rust-cli/anstyle/blob/9816ad155169e70e997f4200afc2ba93fc72497b/crates/anstyle/src/color.rs#L9-L13"},{"ref":"crates/anstyle/src/color.rs:344-348","code":"  344 | /// 256 (8-bit) color support\n  345 | ///\n  346 | /// - `0..16` are [`AnsiColor`] palette codes\n  347 | /// - `0..232` map to [`RgbColor`] color values\n  348 | /// - `232..` map to [`RgbColor`] gray-scale values","lines":5,"link":"https://github.com/rust-cli/anstyle/blob/9816ad155169e70e997f4200afc2ba93fc72497b/crates/anstyle/src/color.rs#L344-L348"}]},
{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"The `print!`, `println!`, `eprint!`, and `eprintln!` macros in `_macros.rs` each repeat the same ~15-line body (check `cfg!(test) || FEATURE_TEST_ACTIVATED`, build a stream, adapt/format, and otherwise `write!`/`writeln!` to the live stream while panicking on any error other than `BrokenPipe`), differing only in the target stream (`stdout`/`stderr`) and the underlying `std` macro invoked. This ~4x duplication (roughly 60 lines of near-identical control flow) makes it easy for a future edit (e.g. the `BrokenPipe` handling) to be applied to one macro and forgotten in the others.","fix":"Factor the shared body into a single internal helper macro (or function taking the stream constructor and a `std` macro name as a `macro_rules!` fragment) that `print!`/`println!`/`eprint!`/`eprintln!` all delegate to, so the error-handling/test-capture logic exists in one place.","locations":[{"ref":"crates/anstream/src/_macros.rs:61-79","code":"   61 | macro_rules! print {\n   62 |     ($($arg:tt)*) => {{\n   63 |         if cfg!(test) || $crate::_macros::FEATURE_TEST_ACTIVATED {\n   64 |             let target_stream = std::io::stdout();\n   65 |             let buffer = $crate::_macros::to_adapted_string(&format_args!($($arg)*), &target_stream);\n   66 |             ::std::print!(\"{}\", buffer)\n   67 |         } else {\n   68 |             use std::io::Write as _;\n   69 | \n   70 |             let mut stream = $crate::stdout();\n   71 |             match ::std::write!(&mut stream, $($arg)*) {\n   72 |                 Err(e) if e.kind() != ::std::io::ErrorKind::BrokenPipe => {\n   73 |                     ::std::panic!(\"failed printing to stdout: {e}\");\n   74 |                 }\n   75 |                 Err(_) | Ok(_) => {}\n   76 |             }\n   77 |         }\n   78 |     }};\n   79 | }","lines":19,"link":"https://github.com/rust-cli/anstyle/blob/9816 ng to stderr: {e}\");\n  197 |                 }\n  198 |                 Err(_) | Ok(_) => {}\n  199 |             }\n  200 |         }\n  201 |     }};\n  202 | }","lines":19,"link":"https://github.com/rust-cli/anstyle/blob/9816ad155169e70e997f4200afc2ba93fc72497b/crates/anstream/src/_macros.rs#L184-L202"},{"ref":"crates/anstream/src/_macros.rs:235-256","code":"  235 | macro_rules! eprintln {\n  236 |     () => {\n  237 |         $crate::eprint!(\"\\n\")\n  238 |     };\n  239 |     ($($arg:tt)*) => {{\n  240 |         if cfg!(test) || $crate::_macros::FEATURE_TEST_ACTIVATED {\n  241 |             let target_stream = std::io::stderr();\n  242 |             let buffer = $crate::_macros::to_adapted_string(&format_args!($($arg)*), &target_stream);\n  243 |             ::std::eprintln!(\"{}\", buffer)\n  244 |         } else {\n  245 |             use std::io::Write as _;\n  246 | \n  247 |             let mut stream = $crate::stderr();\n  248 |             match ::std::writeln!(&mut stream, $($arg)*) {\n  249 |                 Err(e) if e.kind() != ::std::io::ErrorKind::BrokenPipe => {\n  250 |                     ::std::panic!(\"failed printing to stderr: {e}\");\n  251 |                 }\n  252 |                 Err(_) | Ok(_) => {}\n  253 |             }\n  254 |         }\n  255 |     }};\n  256 | }","lines":22,"link":"https://github.com/rust-cli/anstyle/blob/9816ad155169e70e997f4200afc2ba93fc72497b/crates/anstream/src/_macros.rs#L235-L256"}]},
{"id":"DUP_2","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"hard","description":"`crates/anstream/src/strip.rs` and `crates/anstream/src/wincon.rs` define near-identical boilerplate: the `new`/`into_inner`/`as_inner`/`is_terminal` inherent impls, the `Stdout`/`Stderr` `lock()` specializations, and the `std::io::Write` forwarding impl (`write`/`write_vectored`/`flush`/`write_all`/`write_fmt`) are structurally the same between `StripStream<S>` and `WinconStream<S>`, differing only in the inner state type and the color-handling details of their private `write`/`write_all` free functions. `auto.rs`'s `StreamInner` dispatch match arms repeat the same pattern a third time for `PassThrough`/`Strip`/`Wincon`. This is a substantial amount (100+ lines) of parallel structure that must be kept in sync by hand across three files.","fix":"Consider a shared macro (or a common private trait implemented by `StripBytes`/`WinconBytes`) to generate the `new`/`into_inner`/`as_inner`/`is_terminal`/`lock` boilerplate and the `Write` forwarding impl once, parameterized over the state type and the per-chunk write behavior, reducing the three near-duplicate implementations to one generic definition.","locations":[{"ref":"crates/anstream/src/strip.rs:1-158","code":"    1 | use crate::adapter::StripBytes;\n    2 | use crate::stream::AsLockedWrite;\n    3 | use crate::stream::IsTerminal;\n    4 | \n    5 | /// Only pass printable data to the inner `Write`\n    6 | #[derive(Debug)]\n    7 | pub struct StripStream<S>\n    8 | where\n    9 |     S: std::io::Write,\n   10 | {\n   11 |     raw: S,\n   12 |     state: StripBytes,\n   13 | }\n   14 | \n   15 | impl<S> StripStream<S>\n   16 | where\n   17 |     S: std::io::Write,\n   18 | {\n   19 |     /// Only pass printable data to the inner `Write`\n   20 |     #[inline]\n   21 |     pub fn new(raw: S) -> Self {\n   22 |         Self {\n   23 |             raw,\n   24 |             state: Default::default(),\n {"id":"DUP_3","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"easy","description":"In `Parser::perform_action` (`anstyle-parse`), the `Action::OscPut` handler (on seeing `byte == b';'`) and the `Action::OscEnd` handler both contain nearly identical logic for recording the `(begin, end)` span of the current OSC parameter into `self.osc_params[param_idx]` based on `self.osc_num_params`/`MAX_OSC_PARAMS` (~15 lines each, differing only in the `MAX_OSC_PARAMS` arm and whether `osc_num_params` is incremented inside or outside the `match`). This duplication makes it easy for the two copies to drift (e.g. a future fix to the indexing logic applied to only one of the two call sites) and adds unnecessary length to an already large `perform_action` match.","fix":"Factor the shared span-recording logic into a helper, e.g.:\n```rust\nfn record_osc_param(&mut self, idx: usize) {\n    let param_idx = self.osc_num_params;\n    if param_idx == MAX_OSC_PARAMS {\n        return;\n    }\n    let begin = if param_idx == 0 { 0 } else { self.osc_params[param_idx - 1].1 };\n    self.osc_params[param_idx] = (begin, idx);\n    self.osc_num_params += 1;\n}\n```\nand call `self.record_osc_param(idx)` from both `OscPut`'s `;` branch and `OscEnd`.","locations":[{"ref":"crates/anstyle-parse/src/lib.rs:219-243","code":"  219 |                 // Param separator\n  220 |                 if byte == b';' {\n  221 |                     let param_idx = self.osc_num_params;\n  222 |                     match param_idx {\n  223 |                         // Only process up to MAX_OSC_PARAMS\n  224 |                         MAX_OSC_PARAMS => return,\n  225 | \n  226 |                         // First param is special - 0 to current byte index\n  227 |                         0 => {\n  228 |                             self.osc_params[param_idx] = (0, idx);\n  229 |                         }\n  230 | \n  231 |                         // All other params depend on previou {"id":"DUP_4","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"The `on`/`on_default` convenience methods are re-implemented nearly identically for `Color`, `AnsiColor`, `Ansi256Color`, and `RgbColor` in `crates/anstyle/src/color.rs` - each `on` builds `crate::Style::new().fg_color(Some(self.into())).bg_color(Some(background.into()))` and each `on_default` builds `crate::Style::new().fg_color(Some(Color::Variant(self)))`. This is roughly 25-30 lines of boilerplate duplicated four times; any future change to how `Style` is constructed from a foreground color (e.g. adding a new field that should default) needs to be replicated in four call sites, risking an inconsistent update (copy-paste drift).","fix":"Factor the shared logic into a small internal helper, e.g. `fn on_default_color(fg: Color) -> crate::Style { crate::Style::new().fg_color(Some(fg)) }`, and have each type's `on_default`/`on` delegate to it (or generate the four impls with a small `macro_rules!` block), so the construction logic lives in one place.","locations":[{"ref":"crates/anstyle/src/color.rs:19-32","code":"   19 | impl Color {\n   20 |     /// Create a [`Style`][crate::Style] with this as the foreground\n   21 |     #[inline]\n   22 |     pub fn on(self, background: impl Into<Self>) -> crate::Style {\n   23 |         crate::Style::new()\n   24 |             .fg_color(Some(self))\n   25 |             .bg_color(Some(background.into()))\n   26 |     }\n   27 | \n   28 |     /// Create a [`Style`][crate::Style] with this as the foreground\n   29 |     #[inline]\n   30 |     pub const fn on_default(self) -> crate::Style {\n   31 |         crate::Style::new().fg_color(Some(self))\n   32 |     }","lines":14,"link":"https://github.com/rust-cli/anstyle/blob/9816ad155169e70e997f4200afc2ba93fc72497b/crates/anstyle/src/color.rs#L19-L32"},{"ref":"crates/anstyle/src/color.rs:188-201","code":"  188 | impl AnsiColor {\n  189 |     /// Create a [`Style`][c {"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"hard","description":"`AnsiCapture::csi_dispatch` in `anstyle-svg/src/adapter.rs` is a single ~260-line function containing a large nested state machine (`CsiState::Normal` / `PrepareCustomColor` / `Ansi256` / `Rgb` / `Underline`) handling SGR parameter parsing, color parsing (4-bit, 8-bit, 24-bit), and underline-style parsing all inline. This mixes several distinct responsibilities (basic attribute toggles, fg/bg color parsing, underline color/style parsing) in one match expression, making it hard to unit test sub-pieces in isolation and easy to introduce subtle bugs (as seen with the truncation issue above) without being noticed.","fix":"Consider splitting the SGR handling into smaller helper functions per concern, e.g. `parse_basic_attribute`, `parse_color_param` (shared by Fg/Bg/Underline), and `parse_underline_style`, so each piece can be tested and reviewed independently.","locations":[{"ref":"crates/anstyle-svg/src/adapter.rs:98-358","code":"   98 |     fn csi_dispatch(\n   99 |         &mut self,\n  100 |         params: &anstyle_parse::Params,\n  101 |         _intermediates: &[u8],\n  102 |         ignore: bool,\n  103 |         action: u8,\n  104 |     ) {\n  105 |         if ignore {\n  106 |             return;\n  107 |         }\n  108 |         if action != b'm' {\n  109 |             return;\n  110 |         }\n  111 | \n  112 |         let mut style = self.style;\n  113 |         // param/value differences are dependent on the escape code\n  114 |         let mut state = CsiState::Normal;\n  115 |         let mut r = None;\n  116 |         let mut g = None;\n  117 |         let mut color_target = ColorTarget::Fg;\n  118 |         for param in params {\n  119 |             for value in param {\n  120 |                 match (state, *value) {\n  121 |                     (CsiState::Normal, 0) => {\n  122 |                         style = anstyle::Style::defa {"id":"OTHER_1","type":"other","type_label":"Other","severity":"medium","difficulty":"easy","description":"`file_to_url` builds `\"file://\" + hostname + <percent-encoded path>` but pushes the caller-supplied `hostname` string directly with `url.push_str(hostname)` with no percent-encoding or validation, unlike the path components which go through `percent_encoding::percent_encode` with the `SPECIAL_PATH_SEGMENT` set. Since `file_to_url`/`dir_to_url`/`Editor::to_url` are public functions taking `hostname: Option<&str>` from any caller (not just the crate's own `crate::hostname()`), a hostname containing reserved URL characters (`/`, `#`, `?`, `@`, control characters, spaces) will corrupt the URL structure or change its meaning (e.g. injecting a bogus path/fragment/userinfo component). Because these URLs are emitted as OSC 8 terminal hyperlinks, a malformed/attacker-influenced hostname can make the rendered link point somewhere other than what it visually appears to say, which is a mild spoofing/URL-injection concern as well as a correctness bug.","fix":"Percent-encode the hostname the same way path components are encoded before appending it, e.g.:\n```rust\nif let Some(hostname) = hostname {\n    url.extend(percent_encoding::percent_encode(hostname.as_bytes(), PATH_SEGMENT));\n}\n```","locations":[{"ref":"crates/anstyle-hyperlink/src/file.rs:22-31","code":"   22 | pub fn file_to_url(hostname: Option<&str>, path: &std::path::Path) -> Option<String> {\n   23 |     let mut url = \"file://\".to_owned();\n   24 |     if let Some(hostname) = hostname {\n   25 |         url.push_str(hostname);\n   26 |     }\n   27 | \n   28 |     encode_path(path, &mut url);\n   29 | \n   30 |     Some(url)\n   31 | }","lines":10,"link":"https://github.com/rust-cli/anstyle/blob/9816ad155169e70e997f4200afc2ba93fc72497b/crates/anstyle-hyperlink/src/file.rs#L22-L31"},{"ref":"crates/anstyle-hyperlink/src/file.rs:97-130","code":"   97 |     pub fn to_url(\n   98 |         &self,\n   99 |   search: '', searchScope: 'all', groupBy: 'type',
