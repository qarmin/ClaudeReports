<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"FundamentalInstance::object_for_gvalue() calls FundamentalPrototype::for_gtype() and immediately dereferences the returned pointer (proto_priv->call_get_value_function()) without a null check. for_gtype() is GJS_JSAPI_RETURN_CONVENTION and returns nullptr when the prototype lookup fails (e.g. the gtype has no introspection info, or a JS exception is pending). A null fundamental prototype here causes a null-pointer dereference / crash instead of propagating the error.","fix":"After 'auto* proto_priv = FundamentalPrototype::for_gtype(cx, gtype);' add 'if (!proto_priv) return false;' before using it.","locations":[{"ref":"gi/fundamental.cpp:404-410","code":"  404 | bool FundamentalInstance::object_for_gvalue(\n  405 |     JSContext* cx, const GValue* value, GType gtype,\n  406 |     JS::MutableHandleObject object_out) {\n  407 |     auto* proto_priv = FundamentalPrototype::for_gtype(cx, gtype);\n  408 |     void* fobj = nullptr;\n  409 | \n  410 |     if (!proto_priv->call_get_value_function(value, &fobj)) {","lines":7,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/fundamental.cpp#L404-410"},{"ref":"gi/fundamental.cpp:394-402","code":"  394 | FundamentalPrototype* FundamentalPrototype::for_gtype(JSContext* cx,\n  395 |                                                       GType gtype) {\n  396 |     JS::RootedObject proto(\n  397 |         cx, gjs_lookup_fundamental_prototype_from_gtype(cx, gtype));\n  398 |     if (!proto)\n  399 |         return nullptr;\n  400 | \n  401 |     return FundamentalPrototype::for_js(cx, proto);\n  402 | }","lines":9,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/fundamental.cpp#L394-402"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"FundamentalInstance::copy_ptr() calls FundamentalPrototype::for_gtype() and dereferences the result (priv->call_ref_function()) with no null check. for_gtype() can return nullptr (failed prototype lookup / pending exception), producing a null-pointer dereference.","fix":"Check 'if (!priv) return nullptr;' after the for_gtype() call before calling priv->call_ref_function().","locations":[{"ref":"gi/fundamental.cpp:464-468","code":"  464 | void* FundamentalInstance::copy_ptr(JSContext* cx, GType gtype,\n  465 |                                     void* gfundamental) {\n  466 |     auto* priv = FundamentalPrototype::for_gtype(cx, gtype);\n  467 |     return priv->call_ref_function(gfundamental);\n  468 | }","lines":5,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/fundamental.cpp#L464-468"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"In gjs_array_from_zero_terminated_c_array(), for GI_TYPE_TAG_INTERFACE elements, reg_info is obtained via interface_info.as<GI::InfoTag::REGISTERED_TYPE>() and then reg_info->is_struct() is called unconditionally. If the interface is not a registered type (e.g. a callback interface used as a zero-terminated array element), reg_info is an empty Maybe and dereferencing it is a null/invalid deref. The parallel function gjs_array_from_carray_internal() guards struct handling differently and does not assume reg_info is present.","fix":"Guard the struct branch on reg_info being present, e.g. test `bool is_struct = reg_info && reg_info->is_struct();` (matching the is_struct/is_union checks done elsewhere) before dereferencing, and fall through to the pointer-array path otherwise.","locations":[{"ref":"gi/arg.cpp:2865-2882","code":" 2865 |         case GI_TYPE_TAG_INTERFACE: {\n 2866 |             GI::AutoBaseInfo interface_info{element_type.interface()};\n 2867 |             auto reg_info = interface_info.as<GI::InfoTag::REGISTERED_TYPE>();\n 2868 |             bool element_is_pointer = element_type.is_pointer();\n 2869 |             bool is_struct = reg_info->is_struct();\n 2870 | \n 2871 |             if (!element_is_pointer && is_struct) {\n 2872 |                 auto struct_info = interface_info.as<GI::InfoTag::STRUCT>();\n 2873 |                 size_t element_size = struct_info->size();\n 2874 | \n 2875 |                 if (!fill_vector_from_zero_terminated_non_pointer_carray(\n 2876 |                         cx, elems, element_type, &arg, element_size, c_array))\n 2877 |                     return false;\n 2878 |                 break;\n 2879 |             }\n 2880 | \n 2881 |             [[fallthrough]];\n 2882 |         }","lines":18,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/arg.cpp#L2865-2882"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"BoxedPrototype::lookup_field() calls JS_EncodeStringToUTF8() and then immediately uses encoded_prop_name.get() to construct a std::string and to compare. JS_EncodeStringToUTF8 can return a null UniqueChars on OOM/error; dereferencing .get() (passing nullptr to std::string ctor) is undefined behavior / crash. Other call sites in this codebase guard the result of JS_EncodeStringToUTF8.","fix":"Check 'if (!encoded_prop_name) return {};' (an exception is already pending) before using encoded_prop_name.get().","locations":[{"ref":"gi/boxed.cpp:210-218","code":"  210 |     JS::RootedString rooted_name(cx, prop_name);\n  211 |     JS::UniqueChars encoded_prop_name = JS_EncodeStringToUTF8(cx, rooted_name);\n  212 |     const std::string field_name{\n  213 |         find_unique_js_field_name(info(), encoded_prop_name.get())};\n  214 | \n  215 |     if (field_name != encoded_prop_name.get()) {\n  216 |         prop_name = JS_AtomizeAndPinStringN(cx, field_name.c_str(),\n  217 |                                             field_name.length());\n  218 |     }","lines":9,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/boxed.cpp#L210-218"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In the G_TYPE_ENUM conversion path, when an invalid enum value is supplied the error message calls value.toInt32(). JS::Value::toInt32() asserts that the value is an Int32, but the value reaching this branch was converted via js_value_to_c<int64_t>(), so it can be a JS double (e.g. 5.5) or a BigInt. Passing such a value triggers an assertion failure / undefined behavior in a debug build instead of a clean JS exception.","fix":"Use the already-computed value_int64 in the error string (e.g. \"%\" G_GINT64_FORMAT) instead of value.toInt32(), or guard with value.isInt32().","locations":[{"ref":"gi/value.cpp:863-881","code":"  863 |     if (g_type_is_a(gtype, G_TYPE_ENUM)) {\n  864 |         int64_t value_int64;\n  865 | \n  866 |         if (Gjs::js_value_to_c<int64_t>(cx, value, &value_int64)) {\n  867 |             Gjs::AutoTypeClass<GEnumClass> enum_class{gtype};\n  868 | \n  869 |             // See arg.c:_gjs_enum_to_int()\n  870 |             GEnumValue* v =\n  871 |                 g_enum_get_value(enum_class, static_cast<int>(value_int64));\n  872 |             if (v == nullptr) {\n  873 |                 gjs_throw(cx, \"%d is not a valid value for enumeration %s\",\n  874 |                           value.toInt32(), g_type_name(gtype));\n  875 |                 return false;\n  876 |             }\n  877 | \n  878 |             g_value_set_enum(gvalue, v->value);\n  879 |             return true;\n  880 |         }\n  881 |         return throw_expect_type(cx, value, \"enum\", gtype);","lines":19,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/value.cpp#L863-881"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"GjsScriptModule::create() does not check the result of JS_NewObject() before using it. If allocation fails (returns nullptr), JS::SetReservedSlot() is called on a null JSObject*, and the freshly-allocated GjsScriptModule leaks (it is never stored where finalize() could delete it). JS_NewObject can fail under OOM, so this is a real null dereference + leak path, not just theoretical.","fix":"After 'JSObject* module = JS_NewObject(...)', add 'if (!module) return nullptr;' before allocating the GjsScriptModule and setting the reserved slot.","locations":[{"ref":"gjs/module.cpp:85-91","code":"   85 |     [[nodiscard]]\n   86 |     static JSObject* create(JSContext* cx, const char* name) {\n   87 |         JSObject* module = JS_NewObject(cx, &GjsScriptModule::klass);\n   88 |         JS::SetReservedSlot(module, GjsScriptModule::POINTER,\n   89 |                             JS::PrivateValue(new GjsScriptModule(name)));\n   90 |         return module;\n   91 |     }","lines":7,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/module.cpp#L85-91"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"find_error_domain_info() calls repo.require(\"GIRepository\", \"3.0\").unwrap() as a 'last attempt' to resolve an unknown error domain. mozilla::Result::unwrap() aborts the process if the result is Err. While GLib/GObject/Gio are guaranteed dependencies, the GIRepository-3.0 typelib is described in the comment as 'rarely needed' and is not guaranteed to be installed; if it is missing, error marshalling for an unknown domain would abort the whole process instead of falling back to a plain GError.","fix":"Handle the GIRepository require() failure gracefully (e.g. check isOk() and just skip the find_by_error_domain() if it failed) rather than unwrap(), so a missing optional typelib does not abort the process.","locations":[{"ref":"gi/gerror.cpp:260-262","code":"  260 |     // last attempt: load GIRepository (for invoke errors, rarely needed)\n  261 |     repo.require(\"GIRepository\", \"3.0\").unwrap();\n  262 |     return repo.find_by_error_domain(domain);","lines":3,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/gerror.cpp#L260-262"},{"ref":"gi/gerror.cpp:244-263","code":"  244 | [[nodiscard]]\n  245 | static Maybe<const GI::EnumInfo> find_error_domain_info(\n  246 |     const GI::Repository& repo, GQuark domain) {\n  247 |     // first an attempt without loading extra libraries\n  248 |     Maybe<GI::AutoEnumInfo> info = repo.find_by_error_domain(domain);\n  249 |     if (info)\n  250 |         return info;\n  251 | \n  252 |     // load standard stuff\n  253 |     repo.require(\"GLib\", \"2.0\").unwrap();\n  254 |     repo.require(\"GObject\", \"2.0\").unwrap();\n  255 |     repo.require(\"Gio\", \"2.0\").unwrap();\n  256 |     info = repo.find_by_error_domain(domain);\n  257 |     if (info)\n  258 |         return info;\n  259 | \n  260 |     // last attempt: load GIRepository (for invoke errors, rarely needed)\n  261 |     repo.require(\"GIRepository\", \"3.0\").unwrap();\n  262 |     return repo.find_by_error_domain(domain);\n  263 | }","lines":20,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/gerror.cpp#L244-263"}]},
{"id":"UAF_1","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"easy","description":"Possible null-pointer dereference / write to uninitialized buffer in gjs_byte_array_from_data_copy(). JS::NewArrayBuffer(cx, nbytes) is called at line 163 and, when it succeeds-or-fails, the code immediately enters the AutoCheckCannotGC block and calls JS::GetArrayBufferData(array_buffer, ...) and std::copy_n into `storage` at lines 165-168, BEFORE the null check on `array_buffer` at line 172. If the allocation fails (OOM, huge nbytes), array_buffer is null, GetArrayBufferData dereferences/uses a null object and storage is garbage, leading to a crash or out-of-bounds write of nbytes bytes.","fix":"Check `if (!array_buffer) return nullptr;` immediately after the NewArrayBuffer call (before entering the nogc block and copying), as is done correctly in from_gbytes_func.","locations":[{"ref":"gjs/byteArray.cpp:158-173","code":"  158 | JSObject* gjs_byte_array_from_data_copy(JSContext* cx, size_t nbytes,\n  159 |                                         void* data) {\n  160 |     JS::RootedObject array_buffer(cx);\n  161 |     // a null data pointer takes precedence over whatever `nbytes` says\n  162 |     if (data) {\n  163 |         array_buffer = JS::NewArrayBuffer(cx, nbytes);\n  164 | \n  165 |         JS::AutoCheckCannotGC nogc{};\n  166 |         bool unused;\n  167 |         uint8_t* storage = JS::GetArrayBufferData(array_buffer, &unused, nogc);\n  168 |         std::copy_n(static_cast<uint8_t*>(data), nbytes, storage);\n  169 |     } else {\n  170 |         array_buffer = JS::NewArrayBuffer(cx, 0);\n  171 |     }\n  172 |     if (!array_buffer)\n  173 |         return nullptr;","lines":16,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/byteArray.cpp#L158-173"}]},
{"id":"UAF_2","type":"use_after_free","type_label":"Use After Free","severity":"medium","difficulty":"medium","description":"CallbackIn::m_ffi_closure is never initialized in the constructor (the Callback base does not initialize it either). It is only assigned inside CallbackIn::in(). If a function call fails on an earlier argument before this callback argument's in() runs, the cleanup path still invokes release() on every argument, and CallbackIn::release() reads m_ffi_closure (and then dereferences closure->user_data and calls g_closure_unref). Reading the uninitialized pointer can crash or unref an arbitrary pointer.","fix":"Initialize m_ffi_closure = nullptr in the CallbackIn/Callback constructor (e.g. in the member declaration: ffi_closure* m_ffi_closure = nullptr;).","locations":[{"ref":"gi/arg-cache.cpp:1527-1529","code":" 1527 |  private:\n 1528 |     ffi_closure* m_ffi_closure;\n 1529 | };","lines":3,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/arg-cache.cpp#L1527-1529"},{"ref":"gi/arg-cache.cpp:2462-2475","code":" 2462 | GJS_JSAPI_RETURN_CONVENTION\n 2463 | bool CallbackIn::release(JSContext*, GjsFunctionCallState*, GIArgument* in_arg,\n 2464 |                          GIArgument* out_arg [[maybe_unused]]) {\n 2465 |     ffi_closure* closure = m_ffi_closure;\n 2466 |     if (!closure)\n 2467 |         return true;\n 2468 | \n 2469 |     g_closure_unref(static_cast<GClosure*>(closure->user_data));\n 2470 |     // CallbackTrampolines are refcounted because for notified/async closures\n 2471 |     // it is possible to destroy it while in call, and therefore we cannot\n 2472 |     // check its scope at this point\n 2473 |     gjs_arg_unset(in_arg);\n 2474 |     return true;\n 2475 | }","lines":14,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/arg-cache.cpp#L2462-2475"}]},
{"id":"UAF_3","type":"use_after_free","type_label":"Use After Free","severity":"low","difficulty":"medium","description":"Surface methods (flush, finish, writeToPNG, getType, get*, etc.) operate on the wrapped cairo_surface_t with no guard against the surface already having been finished via finish(). After cairo_surface_finish(), most operations put the surface into CAIRO_STATUS_SURFACE_FINISHED; the binding's status checks will surface that as an error, so it is not a hard crash, but there is no use-after-free protection beyond cairo's own status handling. Worth noting that finish() does not invalidate the wrapper, so JS can keep calling drawing operations on a finished surface (and any Context still targeting it).","fix":"This is largely cairo-managed via status, so likely acceptable; if stricter behavior is desired, track a finished flag and throw early. At minimum ensure every entry point checks cairo_surface_status (they do).","locations":[{"ref":"modules/cairo-surface.cpp:89-109","code":"   89 | GJS_JSAPI_RETURN_CONVENTION\n   90 | bool finish_func(JSContext* cx, unsigned argc, JS::Value* vp) {\n   91 |     GJS_GET_THIS(cx, argc, vp, argv, obj);\n   92 | \n   93 |     if (argc > 1) {\n   94 |         gjs_throw(cx, \"Surface.finish() takes no arguments\");\n   95 |         return false;\n   96 |     }\n   97 | \n   98 |     cairo_surface_t* surface = CairoSurface::for_js(cx, obj);\n   99 |     if (!surface)\n  100 |         return false;\n  101 | \n  102 |     cairo_surface_finish(surface);\n  103 | \n  104 |     if (!gjs_cairo_check_status(cx, cairo_surface_status(surface), \"surface\"))\n  105 |         return false;\n  106 | \n  107 |     argv.rval().setUndefined();\n  108 |     return true;\n  109 | }","lines":21,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/cairo-surface.cpp#L89-109"}]},
{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"In gjs_log_writer_func_wrapper, g_variant_dict_end() returns a floating GVariant reference. The code then calls g_variant_ref() (which adds a normal ref but does NOT sink the floating ref) followed by a single g_variant_unref(). The variant ends with refcount 1 and is still floating, so it is never freed - a leak on every log message routed through a JS writer. g_variant_ref_sink() (or just removing the extra ref/unref pair and sinking) is required to take ownership of a floating variant.","fix":"Use GVariant* string_fields = g_variant_ref_sink(g_variant_dict_end(&dict)); then g_variant_unref(string_fields) after use, or call g_variant_dict_end and pass directly without the spurious ref.","locations":[{"ref":"libgjs-private/gjs-util.c:505-511","code":"  505 |     GVariant* string_fields = g_variant_dict_end(&dict);\n  506 |     g_variant_ref(string_fields);\n  507 | \n  508 |     GLogWriterOutput output =\n  509 |         func(log_level, string_fields, log_writer_user_data);\n  510 | \n  511 |     g_variant_unref(string_fields);","lines":7,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/libgjs-private/gjs-util.c#L505-511"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"In gjs_lossy_decode_from_uint8array_slow the buffer-growth heuristic can loop without ever making progress on degenerate inputs. When g_converter_convert writes 0 bytes, sets no recognized error, and input_len stays > 0, none of the branches (INVALID_DATA/PARTIAL_INPUT skip a byte, NO_SPACE grows buffer, else throws) is taken, so the do/while spins forever. The NO_SPACE growth `buffer_size += bytes_len` also assumes bytes_len > 0; for pathological converters that repeatedly return NO_SPACE the buffer keeps growing unbounded (no upper cap relative to SIZE_MAX), and `bytes_len * 2 + 12` / `bytes_len * 4` can overflow size_t for very large inputs, yielding a too-small allocation and subsequent over-append into output_str.","fix":"Add an explicit progress guard: if a conversion iteration reads 0 bytes and writes 0 bytes and produced no actionable error, break or throw. Use mozilla::CheckedInt for the buffer_size arithmetic (bytes_len*2+12, bytes_len*4) and bail with JS_ReportOutOfMemory on overflow.","locations":[{"ref":"gjs/text-encoding.cpp:116-191","code":"  116 |     size_t buffer_size =\n  117 |         std::max(bytes_len * 2 + 12, static_cast<size_t>(256u));\n  118 | \n  119 |     // Cast data to correct input types\n  120 |     const char* input = reinterpret_cast<const char*>(bytes);\n  121 |     size_t input_len = bytes_len;\n  122 | \n  123 |     // The base string that we'll append to.\n  124 |     std::u16string output_str;\n  125 | \n  126 |     do {\n  127 |         Gjs::AutoError local_error;\n  128 | \n  129 |         // Create a buffer to convert into.\n  130 |         std::unique_ptr<char[]> buffer = std::make_unique<char[]>(buffer_size);\n  131 |         size_t bytes_written = 0, bytes_read = 0;\n  132 | \n  133 |         g_converter_convert(G_CONVERTER(converter.get()), input, input_len,\n  134 |                             buffer.get(), buffer_size, G_CONVERTER_INPUT_AT_END,\n  135 |                             &bytes_read, &bytes_written, &local_error);\n  136 | \n  137 |         // If bytes were read, adjust input.\n  138 |         if (bytes_read > 0) {\n  139 |             input += bytes_read;\n  140 |             input_len -= bytes_read;\n  141 |         }\n  142 | \n  143 |         // If bytes were written append the buffer contents to our string\n  144 |         // accumulator\n  145 |         if (bytes_written > 0) {\n  146 |             char16_t* utf16_buffer = reinterpret_cast<char16_t*>(buffer.get());\n  147 |             // std::u16string uses exactly 2 bytes for every character.\n  148 |             output_str.append(utf16_buffer, bytes_written / 2);\n  149 |         } else if (local_error) {\n  150 |             // A PARTIAL_INPUT error can only occur if the user does not provide\n  151 |             // the full sequence for a multi-byte character, we skip over the\n  152 |             // next character and insert a unicode fallback.\n  153 | \n  154 |             // An INVALID_DATA error occurs when there is no way to decode a\n  155 |             // given byte into UTF-16 or the given byte does not exist in the\n  156 |             // source encoding.\n  157 |             if (g_error_matches(local_error, G_IO_ERROR,\n  158 |                                 G_IO_ERROR_INVALID_DATA) ||\n  159 |                 g_error_matches(local_error, G_IO_ERROR,\n  160 |                                 G_IO_ERROR_PARTIAL_INPUT)) {\n  161 |                 // If we're already at the end of the string, don't insert a\n  162 |                 // fallback.\n  163 |                 if (input_len > 0) {\n  164 |                     // Skip the next byte and reduce length by one.\n  165 |                     input += 1;\n  166 |                     input_len -= 1;\n  167 | \n  168 |                     // Append the unicode fallback character to the output\n  169 |                     output_str.append(u\"\\ufffd\", 1);\n  170 |                 }\n  171 |             } else if (g_error_matches(local_error, G_IO_ERROR,\n  172 |                                        G_IO_ERROR_NO_SPACE)) {\n  173 |                 // If the buffer was full increase the buffer\n  174 |                 // size and re-try the conversion.\n  175 |                 //\n  176 |                 // This logic allocates bytes_len * 3 first,\n  177 |                 // then bytes_len * 4 (the worst case scenario\n  178 |                 // is nearly impossible) and then continues appending\n  179 |                 // arbitrary padding because we'll trust Gio and give\n  180 |                 // it additional space.\n  181 |                 if (buffer_size > bytes_len * 4) {\n  182 |                     buffer_size += 256;\n  183 |                 } else {\n  184 |                     buffer_size += bytes_len;\n  185 |                 }\n  186 |             } else {\n  187 |                 // Stop decoding if an unknown error occurs.\n  188 |                 return gjs_throw_type_error_from_gerror(cx, local_error);\n  189 |             }\n  190 |         }\n  191 |     } while (input_len > 0);","lines":76,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/text-encoding.cpp#L116-191"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"gjs_arg_set<Gjs::Tag::Enum>(arg, GI::enum_to_int(value_int64)) in value_to_interface_gi_argument_internal stores an enum value that was validated only by gjs_enum_value_is_valid (membership) or gjs_flags_value_is_valid; for enums the int64 is narrowed to int (v_int) via enum_to_int without an explicit range check that the value fits in the C enum storage. For flags, gjs_flags_value_is_valid only checks the mask when gtype != G_TYPE_NONE; an enum/flags with G_TYPE_NONE bypasses range validation entirely and truncating narrowing occurs silently.","fix":"When gtype == G_TYPE_NONE (no GType to validate against), still bound-check the value against the storage size / known enum members before narrowing, or reject.","locations":[{"ref":"gi/arg.cpp:1393-1410","code":" 1393 |     if (value.isNumber()) {\n 1394 |         if (auto enum_info = interface_info.as<GI::InfoTag::ENUM>()) {\n 1395 |             int64_t value_int64;\n 1396 | \n 1397 |             if (!JS::ToInt64(cx, value, &value_int64))\n 1398 |                 return false;\n 1399 | \n 1400 |             if (interface_info.is_flags()) {\n 1401 |                 if (!gjs_flags_value_is_valid(cx, gtype, value_int64))\n 1402 |                     return false;\n 1403 |             } else {\n 1404 |                 if (!gjs_enum_value_is_valid(cx, enum_info.value(),\n 1405 |                                              value_int64))\n 1406 |                     return false;\n 1407 |             }\n 1408 | \n 1409 |             gjs_arg_set<Gjs::Tag::Enum>(arg, GI::enum_to_int(value_int64));\n 1410 |             return true;","lines":18,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/arg.cpp#L1393-1410"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"In the SIGPROF handler, `depth` (uint32_t from stack.stackSize()) is used to size an alloca: `alloca(sizeof(SysprofCaptureAddress) * depth)`. The multiplication can overflow size_t on a pathologically deep stack, and even without overflow an unbounded alloca in a signal handler can blow the (signal) stack, causing a crash. There is no cap on depth before the allocation.","fix":"Clamp depth to a fixed maximum (e.g. min(depth, kMaxFrames)) and use a fixed-size stack buffer of that maximum instead of alloca, which is both safer in a signal handler and avoids the overflow.","locations":[{"ref":"gjs/profiler.cpp:418-425","code":"  418 |     uint32_t depth = self->stack.stackSize();\n  419 |     if (depth == 0)\n  420 |         return;\n  421 | \n  422 |     ProfilerTimePoint now = profiler_timestamp();\n  423 | \n  424 |     auto* addrs = static_cast<SysprofCaptureAddress*>(\n  425 |         alloca(sizeof(SysprofCaptureAddress) * depth));","lines":8,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/profiler.cpp#L418-425"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In ObjectInstance::constructor_impl(), when g_object_new_with_properties() returns an already-wrapped GObject (singleton/re-entrant case), the code tries to drop the extra reference it just acquired. But it checks and reads `this->m_uses_toggle_ref` while it adds the toggle ref to `other_priv`. `this` is a brand-new instance whose m_uses_toggle_ref is always false, so `if (!m_uses_toggle_ref)` is always true and `toggle_ref_added = m_uses_toggle_ref` is always false. Consequently g_clear_object(&gobj) is never executed and the reference returned by g_object_new_with_properties() is leaked. The two reads of m_uses_toggle_ref should be other_priv->m_uses_toggle_ref.","fix":"Test and capture other_priv's toggle state: change to `bool was_toggle = other_priv->m_uses_toggle_ref; if (!was_toggle) other_priv->ensure_uses_toggle_ref(cx); bool toggle_ref_added = !was_toggle && other_priv->m_uses_toggle_ref;` (or otherwise base toggle_ref_added on other_priv), so the surplus ref on gobj is actually released.","locations":[{"ref":"gi/object.cpp:2674-2684","code":" 2674 |         bool toggle_ref_added = false;\n 2675 |         if (!m_uses_toggle_ref) {\n 2676 |             other_priv->ensure_uses_toggle_ref(cx);\n 2677 |             toggle_ref_added = m_uses_toggle_ref;\n 2678 |         }\n 2679 | \n 2680 |         args.rval().setObject(*other_priv->m_wrapper.get());\n 2681 | \n 2682 |         if (toggle_ref_added)\n 2683 |             g_clear_object(&gobj);  // We already own a reference\n 2684 |         return true;","lines":11,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/object.cpp#L2674-2684"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"fill_vector_from_zero_terminated_non_pointer_carray() and release_basic_array_internal/ZERO_TERMINATED detect the terminating element by testing *element_start == 0 and memcmp(element_start, element_start+1, element_size-1) == 0 (i.e. the whole element is all-zero bytes). For struct/interface element types this is a heuristic that can both (a) terminate early on a legitimately all-zero struct element and (b) read element_size bytes past a buffer that is not actually all-zero-terminated, since these arrays are only guaranteed zero-terminated when the element type is a pointer. There is no length bound, so a non-pointer non-zero-terminated array reaching here reads out of bounds.","fix":"Only use the all-zero-bytes heuristic for element types that are documented zero-terminated; otherwise require an explicit length. At minimum, document the precondition and assert that the caller guaranteed zero-termination for non-pointer element types.","locations":[{"ref":"gi/arg.cpp:2715-2741","code":" 2715 | static bool fill_vector_from_zero_terminated_non_pointer_carray(\n 2716 |     JSContext* cx, JS::RootedValueVector& elems,  // NOLINT(runtime/references)\n 2717 |     const GI::TypeInfo& param_info, GIArgument* arg, size_t element_size,\n 2718 |     void* c_array, GITransfer transfer = GI_TRANSFER_EVERYTHING) {\n 2719 |     uint8_t* element_start = reinterpret_cast<uint8_t*>(c_array);\n 2720 | \n 2721 |     for (size_t i = 0;; i++) {\n 2722 |         if (*element_start == 0 &&\n 2723 |             memcmp(element_start, element_start + 1, element_size - 1) == 0)\n 2724 |             break;\n 2725 | \n 2726 |         gjs_arg_set(arg, element_start);\n 2727 |         element_start += element_size;\n 2728 | \n 2729 |         if (!elems.growBy(1)) {\n 2730 |             JS_ReportOutOfMemory(cx);\n 2731 |             return false;\n 2732 |         }\n 2733 | \n 2734 |         if (!gjs_value_from_gi_argument(cx, elems[i], param_info,\n 2735 |                                         GJS_ARGUMENT_ARRAY_ELEMENT, transfer,\n 2736 |                                         arg))\n 2737 |             return false;\n 2738 |     }\n 2739 | \n 2740 |     return true;\n 2741 | }","lines":27,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/arg.cpp#L2715-2741"},{"ref":"gi/arg.cpp:3584-3613","code":" 3584 |     for (size_t i = 0;; i++) {\n 3585 |         GIArgument elem;\n 3586 |         auto* element_start = &arg_array[i * element_size];\n 3587 |         auto* pointer =\n 3588 |             is_pointer ? *reinterpret_cast<uint8_t**>(element_start) : nullptr;\n 3589 | \n 3590 |         if constexpr (release_type == ArrayReleaseType::ZERO_TERMINATED) {\n 3591 |             if (is_pointer) {\n 3592 |                 if (!pointer)\n 3593 |                     break;\n 3594 |             } else if (*element_start == 0 &&\n 3595 |                        memcmp(element_start, element_start + 1,\n 3596 |                               element_size - 1) == 0) {\n 3597 |                 break;\n 3598 |             }\n 3599 |         }\n 3600 | \n 3601 |         gjs_arg_set(&elem, is_pointer ? pointer : element_start);\n 3602 |         JS::AutoSaveExceptionState saved_exc(cx);\n 3603 |         if (!gjs_g_arg_release_internal(cx, element_transfer, element_type,\n 3604 |                                         type_tag, GJS_ARGUMENT_ARRAY_ELEMENT,\n 3605 |                                         flags, &elem)) {\n 3606 |             return false;\n 3607 |         }\n 3608 | \n 3609 |         if constexpr (release_type == ArrayReleaseType::EXPLICIT_LENGTH) {\n 3610 |             if (i == *length - 1)\n 3611 |                 break;\n 3612 |         }\n 3613 |     }","lines":30,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/arg.cpp#L3584-3613"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"BoxedPrototype::create_field_map() ignores the return value of JS_AtomizeAndPinStringN(), which is GJS_JSAPI_RETURN_CONVENTION-equivalent and can return nullptr on OOM. The null atom is then stored as the key via putNewInfallible(). A null key corrupts the field map (later lookups by a real interned atom will never match) and silently loses fields, with no error reported to the caller.","fix":"Check the atom for null after JS_AtomizeAndPinStringN(); on null, call JS_ReportOutOfMemory(cx) and return nullptr from create_field_map().","locations":[{"ref":"gi/boxed.cpp:173-176","code":"  173 |         JSString* atom = JS_AtomizeAndPinStringN(cx, field_name.c_str(),\n  174 |                                                  field_name.length());\n  175 | \n  176 |         result->putNewInfallible(atom, std::move(field_info));","lines":4,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/boxed.cpp#L173-176"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"BoxedPrototype::lookup_field() likewise ignores a possible nullptr from JS_AtomizeAndPinStringN() when the field name differs from the encoded property name. If atomization fails, prop_name becomes nullptr and is passed to m_field_map->lookup(prop_name), which will not match and produces a misleading 'No field' exception instead of an OOM error.","fix":"After JS_AtomizeAndPinStringN(), if the result is null, report OOM and return {}.","locations":[{"ref":"gi/boxed.cpp:215-220","code":"  215 |     if (field_name != encoded_prop_name.get()) {\n  216 |         prop_name = JS_AtomizeAndPinStringN(cx, field_name.c_str(),\n  217 |                                             field_name.length());\n  218 |     }\n  219 | \n  220 |     auto entry = m_field_map->lookup(prop_name);","lines":6,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/boxed.cpp#L215-220"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"BoxedInstance::set_nested_interface_object() reads value.toObject() unconditionally when constructing source_priv (lines 678 and 684), but field_setter_impl()/init_from_props pass arbitrary JS values for the field. If 'value' is not an object (e.g. null or a primitive assigned to a nested-struct field), value.toObject() asserts/UB. The non-pointer interface field path is only reached for nested struct/union fields, but there is no isObject() guard before toObject().","fix":"At the start of set_nested_interface_object(), verify value.isObject() and throw a TypeError otherwise, before any value.toObject() call.","locations":[{"ref":"gi/boxed.cpp:649-699","code":"  649 | template <class Base, class Prototype, class Instance>\n  650 | template <class FieldBase>\n  651 | bool BoxedInstance<Base, Prototype, Instance>::set_nested_interface_object(\n  652 |     JSContext* cx, const GI::FieldInfo& field_info,\n  653 |     const GI::UnownedInfo<FieldBase::TAG>& boxed_info, JS::HandleValue value) {\n  654 |     if (!GI::struct_is_simple(boxed_info)) {\n  655 |         gjs_throw(cx, \"Writing field %s.%s is not supported\",\n  656 |                   format_name().c_str(), field_info.name());\n  657 | \n  658 |         return false;\n  659 |     }\n  660 | \n  661 |     /* If we can't directly copy from the source object we need to construct a\n  662 |      * new temporary object. */\n  663 |     FieldBase* source_priv = nullptr;\n  664 |     JS::RootedObject source_object{cx};\n  665 |     bool field_has_same_info = false;\n  666 | \n  667 |     if constexpr (std::is_same_v<FieldBase, Base>) {\n  668 |         field_has_same_info = info() == boxed_info;\n  669 |         if (field_has_same_info) {\n  670 |             source_object = &value.toObject();\n  671 |             source_priv = FieldBase::for_js(cx, source_object);\n  672 |         }\n  673 |     }\n  674 | \n  675 |     if (!source_priv && !field_has_same_info) {\n  676 |         source_object = &value.toObject();\n  677 |         source_priv = FieldBase::for_js(cx, source_object);\n  678 | \n  679 |         if (source_priv && source_priv->info() != boxed_info) {\n  680 |             std::string source_name{source_priv->format_name()};\n  681 |             gjs_throw(cx, \"Impossible to associate a %s to a %s.%s field\",\n  682 |                       source_name.c_str(), name(), field_info.name());\n  683 |             return false;\n  684 |         }\n  685 |     }\n  686 | \n  687 |     if (!source_priv) {\n  688 |         JS::RootedObject proto{cx,\n  689 |                                gjs_lookup_generic_prototype(cx, boxed_info)};\n  690 |         if (!proto)\n  691 |             return false;\n  692 | \n  693 |         JS::RootedValueArray<1> args{cx};\n  694 |         args[0].set(value);\n  695 |         source_object = gjs_construct_object_dynamic(cx, proto, args);\n  696 |         if (!source_object ||\n  697 |             !FieldBase::for_js_typecheck(cx, source_object, &source_priv))\n  698 |             return false;\n  699 |     }","lines":51,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/boxed.cpp#L649-699"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In the getter slow-path fallback of ObjectInstance::prop_getter_impl(ObjectPropertyInfoCaller*, ...), when gjs_value_from_gi_argument() fails and the code falls back to GValue mode, it calls prop_getter_impl<void>(cx, pspec, args[0]). The template overload's last parameter is the MutableHandleValue *output* (rval), but args[0] is the getter's first argument slot, not the return value. The converted value is therefore written into args[0] instead of args.rval(), so the getter returns the wrong value (whatever was already in rval, typically undefined). The analogous setter fallback (line 886) correctly passes args[0] because there args[0] is the input. It should be args.rval().","fix":"Pass args.rval() instead of args[0]: `return prop_getter_impl<void>(cx, pspec, args.rval());`","locations":[{"ref":"gi/object.cpp:503","code":"  503 |         return prop_getter_impl<void>(cx, pspec, args[0]);","lines":1,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/object.cpp#L503"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Construct-only properties profiler-enabled and profiler-sigusr2 are applied by gjs_context_set_property() (set_should_profile / set_should_listen_sigusr2) during g_object_new, which runs BEFORE gjs_context_constructed(). But gjs_context_constructed() then does `new (gjs_location) GjsContextPrivate(...)` (context.cpp:514), and the constructor's member-init list does not carry m_should_profile / m_should_listen_sigusr2 forward. Placement-new constructs over the same memory; since those members are not initialized by the constructor they retain whatever was there (the value the setter wrote), so it works only by accident of memory layout/zeroing. The intended values written by the property setters are not robustly preserved across the placement-new.","fix":"Do not store profiler flags in the pre-placement-new private memory. Either read the construct properties from the GObject inside the constructor after placement-new, or pass them into the GjsContextPrivate constructor explicitly, instead of relying on setter writes surviving the placement-new.","locations":[{"ref":"gjs/context.cpp:507-517","code":"  507 | static void gjs_context_constructed(GObject* object) {\n  508 |     GjsContext* self = GJS_CONTEXT(object);\n  509 | \n  510 |     G_OBJECT_CLASS(gjs_context_parent_class)->constructed(object);\n  511 | \n  512 |     GjsContextPrivate* gjs_location = GjsContextPrivate::from_object(object);\n  513 |     JSContext* cx = gjs_create_js_context(gjs_location);\n  514 |     if (!cx)\n  515 |         g_error(\"Failed to create javascript context\");\n  516 | \n  517 |     new (gjs_location) GjsContextPrivate(cx, self);","lines":11,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/context.cpp#L507-517"},{"ref":"gjs/context.cpp:658-671","code":"  658 |     const char* env_profiler = g_getenv(\"GJS_ENABLE_PROFILER\");\n  659 |     if (env_profiler || m_should_listen_sigusr2)\n  660 |         m_should_profile = true;\n  661 | \n  662 |     if (m_should_profile) {\n  663 |         m_profiler = gjs_profiler_new(public_context);\n  664 | \n  665 |         if (!m_profiler) {\n  666 |             m_should_profile = false;\n  667 |         } else {\n  668 |             if (m_should_listen_sigusr2)\n  669 |                 gjs_profiler_setup_signals(m_profiler, public_context);\n  670 |         }\n  671 |     }","lines":14,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/context.cpp#L658-671"},{"ref":"gjs/context.cpp:835-840","code":"  835 |         case PROP_PROFILER_ENABLED:\n  836 |             gjs->set_should_profile(g_value_get_boolean(value));\n  837 |             break;\n  838 |         case PROP_PROFILER_SIGUSR2:\n  839 |             gjs->set_should_listen_sigusr2(g_value_get_boolean(value));\n  840 |             break;","lines":6,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/context.cpp#L835-840"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"ModuleLoaderPrincipals::subsumes() returns `first == &the_principals || second != &the_principals`. When second != &the_principals it returns true unconditionally regardless of first, meaning a non-internal principal is reported as subsuming (being at least as privileged as) everything. The intended semantics of subsumes(A,B) is 'does A subsume B'. This expression makes any caller whose object's principal is the internal one (second) only subsumable by the internal principal, but for all other second it returns true for any first - effectively granting subsumption broadly. Worth verifying this matches the intended security model rather than being an inverted/over-broad condition.","fix":"Re-derive the intended subsumes semantics. Most likely it should be `first == &the_principals` (only the internal/module-loader principal subsumes others), i.e. drop or correct the `|| second != &the_principals` term.","locations":[{"ref":"gjs/engine.cpp:166-168","code":"  166 |     static bool subsumes(JSPrincipals* first, JSPrincipals* second) {\n  167 |         return first == &the_principals || second != &the_principals;\n  168 |     }","lines":3,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/engine.cpp#L166-168"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"Off-by-one in gjs_hyphen_to_underscore(). The loop `while (*(s++) != '\\0')` reads the character at the current position to decide whether to continue, but then tests/modifies `*s` AFTER the increment, i.e. the NEXT character. As a result the first character of the string is never examined for a hyphen (a leading '-' is not converted to '_'), and the conversion is effectively shifted by one position relative to the intended semantics. A property/signal name beginning with '-' would not be normalized correctly.","fix":"Iterate cleanly over each character, e.g. `for (char* p = retval.get(); *p; ++p) if (*p == '-') *p = '_';` so every character including the first is checked exactly once.","locations":[{"ref":"gjs/jsapi-util-string.cpp:46-54","code":"   46 | Gjs::AutoChar gjs_hyphen_to_underscore(const char* str) {\n   47 |     char* s = g_strdup(str);\n   48 |     char* retval = s;\n   49 |     while (*(s++) != '\\0') {\n   50 |         if (*s == '-')\n   51 |             *s = '_';\n   52 |     }\n   53 |     return retval;\n   54 | }","lines":9,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/jsapi-util-string.cpp#L46-54"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"PromiseJobDispatcher::Source::dispatch() always returns G_SOURCE_CONTINUE after calling js::RunJobs, but it does not check whether the context is exiting / should stop. If the cancellable is triggered concurrently the child-source mechanism handles detachment, but RunJobs is unconditionally driven on every dispatch even when m_gjs is shutting down. Combined with prepare() returning !m_gjs->empty(), a job that itself enqueues more jobs will keep this highest-priority (-1000) source dispatching, starving all other GSources - this is documented as intentional, but there is no safety valve if RunJobs cannot make progress, risking a live-lock of the main context.","fix":"Consider bounding the number of RunJobs iterations per dispatch or yielding to the main loop periodically; at minimum verify the context is not in should_exit state before draining.","locations":[{"ref":"gjs/promise.cpp:80-93","code":"   80 |     gboolean dispatch() {\n   81 |         if (g_cancellable_is_cancelled(m_cancellable))\n   82 |             return G_SOURCE_REMOVE;\n   83 | \n   84 |         // The ready time is sometimes set to 0 to kick us out of polling,\n   85 |         // we need to reset the value here or this source will always be the\n   86 |         // next one to execute. (it will starve the other sources)\n   87 |         g_source_set_ready_time(this, -1);\n   88 | \n   89 |         // Drain the job queue.\n   90 |         js::RunJobs(m_gjs->context());\n   91 | \n   92 |         return G_SOURCE_CONTINUE;\n   93 |     }","lines":14,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/promise.cpp#L80-93"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"gjs_dbus_implementation_get_properties() emits handle-property-get and unconditionally adds the returned value to the vardict builder without checking for NULL. If a JS handler returns no value (or none is connected, since handle-property-get uses g_signal_accumulator_first_wins and may yield NULL), g_variant_builder_add(&builder, \"{sv}\", prop->name, value) is called with value == NULL, which aborts/crashes inside GVariant. The synchronous property_get path (lines 141-151) explicitly guards against this exact NULL case, but get_properties does not.","fix":"After emitting the signal, skip the property (continue) or substitute a sane default when value is NULL, mirroring the NULL guard in gjs_dbus_implementation_property_get().","locations":[{"ref":"libgjs-private/gjs-gdbus-wrapper.c:238-252","code":"  238 |     for (GDBusPropertyInfo** props = info->properties; *props; ++props) {\n  239 |         GDBusPropertyInfo* prop = *props;\n  240 |         GVariant* value;\n  241 | \n  242 |         /* If we have a cached value, we use that instead of querying again */\n  243 |         if ((value = (GVariant*)g_hash_table_lookup(\n  244 |                  self->outstanding_properties, prop->name))) {\n  245 |             g_variant_builder_add(&builder, \"{sv}\", prop->name, value);\n  246 |             continue;\n  247 |         }\n  248 | \n  249 |         g_signal_emit(self, signals[SIGNAL_HANDLE_PROPERTY_GET], 0, prop->name,\n  250 |                       &value);\n  251 |         g_variant_builder_add(&builder, \"{sv}\", prop->name, value);\n  252 |     }","lines":15,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/libgjs-private/gjs-gdbus-wrapper.c#L238-252"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In _signals.js _emit(), handlers are snapshotted at emission start (handlers = connections.map(...)). A handler connected DURING emission via a 'before' handler will not be invoked in the current emission (correct), but a handler that was disconnected during emission is still in the snapshot and is only skipped via the `if (handler.disconnected) continue` check in _callHandlers. However, _disconnect() also splices the id out of _signalConnectionsByName and deletes _signalConnections[id]; the snapshot `handlers` already holds the object reference so `disconnected` is observed correctly. The real issue: connections.map(id => this._signalConnections[id]) can yield `undefined` entries if an id in the by-name list was already removed from _signalConnections but the splice in the by-name array hasn't happened yet in a nested/re-entrant disconnect, leading to a TypeError on handler.after / handler.disconnected access.","fix":"Filter out undefined entries after the map (handlers = connections.map(...).filter(Boolean)) before partitioning into before/after handlers.","locations":[{"ref":"modules/core/_signals.js:89-121","code":"   89 | function _emit(name, ...args) {\n   90 |     const connections = this._signalConnectionsByName?.[name];\n   91 | \n   92 |     // may not be any signal handlers at all, if not then return\n   93 |     if (!connections)\n   94 |         return;\n   95 | \n   96 |     // To deal with re-entrancy (removal/addition while\n   97 |     // emitting), we copy out a list of what was connected\n   98 |     // at emission start; and just before invoking each\n   99 |     // handler we check its disconnected flag.\n  100 |     const handlers = connections.map(id => this._signalConnections[id]);\n  101 | \n  102 |     // create arg array which is emitter + everything passed in except\n  103 |     // signal name. Would be more convenient not to pass emitter to\n  104 |     // the callback, but trying to be 100% consistent with GObject\n  105 |     // which does pass it in. Also if we pass in the emitter here,\n  106 |     // people don't create closures with the emitter in them,\n  107 |     // which would be a cycle.\n  108 |     const argArray = [this, ...args];\n  109 | \n  110 |     const afterHandlers = [];\n  111 |     const beforeHandlers = handlers.filter(c => {\n  112 |         if (!c.after)\n  113 |             return true;\n  114 | \n  115 |         afterHandlers.push(c);\n  116 |         return false;\n  117 |     });\n  118 | \n  119 |     if (!_callHandlers(beforeHandlers, argArray))\n  120 |         _callHandlers(afterHandlers, argArray);\n  121 | }","lines":33,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/core/_signals.js#L89-121"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"_timers.js setTimeout/setInterval call import.meta.importSync('_promiseNative').drainMicrotaskQueue() AFTER invoking boundCallback(). If boundCallback() throws, drainMicrotaskQueue() is never reached, so pending microtasks (promise continuations) scheduled before the throw are left undrained until the next event-loop turn, and the source for setTimeout is also never released (releaseSource on line 73 is also skipped on throw), leaking the entry in the timeouts Map. There is no try/finally around the callback.","fix":"Wrap boundCallback() in try/finally so releaseSource() (for setTimeout) and drainMicrotaskQueue() always run even when the callback throws.","locations":[{"ref":"modules/esm/_timers.js:68-77","code":"   68 |     const source = createTimeoutSource(delay, () => {\n   69 |         if (!timeouts.has(source))\n   70 |             return imports.gi.GLib.SOURCE_REMOVE;\n   71 | \n   72 |         boundCallback();\n   73 |         releaseSource(source);\n   74 |         import.meta.importSync('_promiseNative').drainMicrotaskQueue();\n   75 | \n   76 |         return imports.gi.GLib.SOURCE_REMOVE;\n   77 |     });","lines":10,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/esm/_timers.js#L68-77"},{"ref":"modules/esm/_timers.js:94-102","code":"   94 |     const source = createTimeoutSource(delay, () => {\n   95 |         if (!timeouts.has(source))\n   96 |             return imports.gi.GLib.SOURCE_REMOVE;\n   97 | \n   98 |         boundCallback();\n   99 |         import.meta.importSync('_promiseNative').drainMicrotaskQueue();\n  100 | \n  101 |         return imports.gi.GLib.SOURCE_CONTINUE;\n  102 |     });","lines":9,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/esm/_timers.js#L94-102"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"moduleResolveAsyncHook() looks up an already-loaded module by the raw specifier first (registry.get(specifier)) before resolving it to a URI. The synchronous resolveModule() does the same. However the async path stores compiled modules only under uri.uriWithQuery (line 240), never under the bare specifier, whereas the registry-by-specifier check exists to short-circuit. For a bare specifier resolved to an internal URI, a second concurrent import with the same specifier will pass the first `registry.get(specifier)` (miss), re-resolve, then both await loadURIAsync and the later one is caught by the post-await `registry.get(uri.uriWithQuery)` check - but only the URI form is ever populated, so the initial specifier-keyed fast path is effectively dead for async-loaded modules and every async import re-resolves the specifier.","fix":"Either also register the compiled module under the original specifier when appropriate, or drop the misleading specifier-keyed lookup; document that the URI form is the canonical cache key.","locations":[{"ref":"modules/internal/loader.js:211-244","code":"  211 |     async moduleResolveAsyncHook(importingModulePriv, specifier) {\n  212 |         const registry = getRegistry(this.global);\n  213 | \n  214 |         // Check if the module has already been loaded\n  215 |         let module = registry.get(specifier);\n  216 |         if (module)\n  217 |             return module;\n  218 | \n  219 |         // 1) Resolve path and URI-based imports.\n  220 |         const importingModuleURI = importingModulePriv ? parseURI(importingModulePriv.uri) : null;\n  221 |         const uri = this.resolveSpecifier(specifier, importingModuleURI);\n  222 | \n  223 |         module = registry.get(uri.uriWithQuery);\n  224 | \n  225 |         // Check if module is already loaded (relative handling)\n  226 |         if (module)\n  227 |             return module;\n  228 | \n  229 |         const text = await this.loadURIAsync(uri);\n  230 | \n  231 |         // Check if module loaded while awaiting.\n  232 |         module = registry.get(uri.uriWithQuery);\n  233 |         if (module)\n  234 |             return module;\n  235 | \n  236 |         const internal = this.isInternal(uri);\n  237 |         const priv = new ModulePrivate(uri.uriWithQuery, uri.uri, internal);\n  238 |         const compiled = this.compileModule(priv, text);\n  239 | \n  240 |         registry.set(uri.uriWithQuery, compiled);\n  241 | \n  242 |         this.populateSourceMap(text, uri.uri);\n  243 |         return compiled;\n  244 |     }","lines":34,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/internal/loader.js#L211-244"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"mainloop.js quit() nulls out _mainLoops[name] BEFORE verifying the loop is actually running. If the loop exists but is not running, the function throws 'Main loop was stopped already' yet has already removed the loop from the registry, leaving inconsistent state (the stored loop object is lost even though quit failed). The registry mutation should happen only after the running check passes, or after loop.quit().","fix":"Check loop.is_running() first; only set _mainLoops[name] = null after deciding to actually quit (or move the null assignment after the is_running guard).","locations":[{"ref":"modules/script/mainloop.js:22-33","code":"   22 | function quit(name) {\n   23 |     if (!_mainLoops[name])\n   24 |         throw new Error('No main loop with this id');\n   25 | \n   26 |     let loop = _mainLoops[name];\n   27 |     _mainLoops[name] = null;\n   28 | \n   29 |     if (!loop.is_running())\n   30 |         throw new Error('Main loop was stopped already');\n   31 | \n   32 |     loop.quit();\n   33 | }","lines":12,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/script/mainloop.js#L22-33"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"On failure, g_utf16_to_utf8() returns NULL without writing to the items_written out-param (bytes_written). The code substitutes \"<invalid string>\" for the buffer but then calls fwrite(utf8, 1, bytes_written, fp) with bytes_written still uninitialized (declared `long bytes_written;` with no initializer). This reads an indeterminate length and writes garbage / out-of-bounds bytes to the dump file. On the success path it is fine, but the error path is broken.","fix":"Initialize `long bytes_written = 0;` and on the fallback path set bytes_written to the length of the replacement string, e.g. bytes_written = strlen(utf8) (or strlen(\"<invalid string>\")).","locations":[{"ref":"modules/system.cpp:170-177","code":"  170 |     long bytes_written;\n  171 |     Gjs::AutoChar utf8{g_utf16_to_utf8(reinterpret_cast<const uint16_t*>(buf),\n  172 |                                        len, /* items_read = */ nullptr,\n  173 |                                        &bytes_written, /* error = */ nullptr)};\n  174 |     if (!utf8)\n  175 |         utf8 = g_strdup(\"<invalid string>\");\n  176 | \n  177 |     fwrite(utf8, 1, bytes_written, fp);","lines":8,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/system.cpp#L170-177"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"gjs_console_clear() returns success only if fflush(stdout) > 0, but fflush() returns 0 on success and EOF (nonzero, typically -1) on error. So the function returns false even when the screen was cleared successfully, and the predicate never indicates a genuine flush success. The fputs check is also fragile (fputs returns a non-negative count on success, which could be 0 for an empty string, though here the string is non-empty).","fix":"Test for non-error explicitly: return fputs(...) != EOF && fflush(stdout) == 0;","locations":[{"ref":"util/console.cpp:63-68","code":"   63 | bool gjs_console_clear() {\n   64 |     if (stdout_fd < 0 || !g_log_writer_supports_color(stdout_fd))\n   65 |         return false;\n   66 | \n   67 |     return fputs(ANSICode::CLEAR_SCREEN, stdout) > 0 && fflush(stdout) > 0;\n   68 | }","lines":6,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/util/console.cpp#L63-68"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"gjs_value_from_gi_argument(): for GI_TRANSFER_CONTAINER struct elements, the switch over argument_type that promotes transfer to GI_TRANSFER_EVERYTHING for ARRAY/LIST/HASH elements falls through the cases without a break before default (relying on the trailing 'default: break'). While currently harmless, the missing break after the GJS_ARGUMENT_HASH_ELEMENT/transfer assignment is fragile; adding a case above default would silently change behavior.","fix":"Add an explicit break after the transfer assignment, or restructure as an if/else, to make the intended control flow robust.","locations":[{"ref":"gi/arg.cpp:3349-3358","code":" 3349 |                 } else if (transfer == GI_TRANSFER_CONTAINER) {\n 3350 |                     switch (argument_type) {\n 3351 |                         case GJS_ARGUMENT_ARRAY_ELEMENT:\n 3352 |                         case GJS_ARGUMENT_LIST_ELEMENT:\n 3353 |                         case GJS_ARGUMENT_HASH_ELEMENT:\n 3354 |                             transfer = GI_TRANSFER_EVERYTHING;\n 3355 |                         default:\n 3356 |                             break;\n 3357 |                     }\n 3358 |                 }","lines":10,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/arg.cpp#L3349-3358"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"BoxedInstance::field_getter_impl() handles a non-pointer interface field that is a STRUCT or UNION by creating a nested object, but if the interface is some other kind (e.g. a flags/enum embedded by value, or an unhandled interface kind) it silently falls through to field_info.read(). For a non-pointer interface tag that is neither struct nor union, the code relies entirely on read()/gjs_value_from_gi_argument behaving correctly; there is no explicit handling or diagnostic, which can produce confusing results for unusual field types.","fix":"Either document why other non-pointer interface kinds are safe to pass to read(), or add explicit handling/diagnostics for unsupported embedded interface kinds.","locations":[{"ref":"gi/boxed.cpp:581-631","code":"  581 | template <class Base, class Prototype, class Instance>\n  582 | bool BoxedInstance<Base, Prototype, Instance>::field_getter_impl(\n  583 |     JSContext* cx, JSObject* obj, const GI::FieldInfo& field_info,\n  584 |     JS::MutableHandleValue rval) const {\n  585 |     GI::AutoTypeInfo type_info{field_info.type_info()};\n  586 | \n  587 |     if (!type_info.is_pointer() && type_info.tag() == GI_TYPE_TAG_INTERFACE) {\n  588 |         GI::AutoBaseInfo interface{type_info.interface()};\n  589 |         if (auto union_info = interface.as<GI::InfoTag::UNION>()) {\n  590 |             return get_nested_interface_object<UnionInstance>(\n  591 |                 cx, obj, field_info, union_info.value(), rval);\n  592 |         }\n  593 |         if (auto struct_info = interface.as<GI::InfoTag::STRUCT>()) {\n  594 |             return get_nested_interface_object<StructInstance>(\n  595 |                 cx, obj, field_info, struct_info.value(), rval);\n  596 |         }\n  597 |     }\n  598 | \n  599 |     GIArgument arg;\n  600 |     if (field_info.read(m_ptr, &arg).isErr()) {\n  601 |         gjs_throw(cx, \"Reading field %s.%s is not supported\",\n  602 |                   format_name().c_str(), field_info.name());\n  603 |         return false;\n  604 |     }\n  605 | \n  606 |     if (type_info.tag() == GI_TYPE_TAG_ARRAY &&\n  607 |         type_info.array_length_index()) {\n  608 |         unsigned length_field_ix = type_info.array_length_index().value();\n  609 |         Maybe<GI::AutoFieldInfo> length_field_info{\n  610 |             get_field_info(cx, length_field_ix)};\n  611 |         if (!length_field_info) {\n  612 |             gjs_throw(cx, \"Reading field %s.%s is not supported\",\n  613 |                       format_name().c_str(), field_info.name());\n  614 |             return false;\n  615 |         }\n  616 | \n  617 |         GIArgument length_arg;\n  618 |         if (length_field_info->read(m_ptr, &length_arg).isErr()) {\n  619 |             gjs_throw(cx, \"Reading field %s.%s is not supported\",\n  620 |                       format_name().c_str(), length_field_info->name());\n  621 |             return false;\n  622 |         }\n  623 | \n  624 |         size_t length = gjs_gi_argument_get_array_length(\n  625 |             length_field_info->type_info().tag(), &length_arg);\n  626 |         return gjs_value_from_explicit_array(cx, rval, type_info, &arg, length);\n  627 |     }\n  628 | \n  629 |     return gjs_value_from_gi_argument(cx, rval, type_info, GJS_ARGUMENT_FIELD,\n  630 |                                       GI_TRANSFER_EVERYTHING, &arg);\n  631 | }","lines":51,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/boxed.cpp#L581-631"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In Function::invoke() the 'too many arguments' branch only emits a warning and proceeds, while extra args beyond m_js_in_argc are silently ignored. That is acceptable, but js_arg_pos is advanced only when !skip_in, and js_in_arg is left undefined when js_arg_pos >= args.length(). For an under-supplied call this is caught earlier by reportMoreArgsNeeded, but for skipped-in args interleaved with normal args the mapping between JS positions and GI positions relies on skip_in being consistent; any annotation inconsistency yields undefined (uninitialized JS::RootedValue defaults to undefined, which is safe) silently rather than an error.","fix":"No action strictly required (RootedValue defaults to undefined). Consider asserting js_arg_pos progression matches m_js_in_argc after the loop to catch annotation bugs early.","locations":[{"ref":"gi/function.cpp:978-988","code":"  978 |         JS::RootedValue js_in_arg{cx};\n  979 |         if (js_arg_pos < args.length())\n  980 |             js_in_arg = args[js_arg_pos];\n  981 | \n  982 |         if (!gjs_arg->in(cx, &state, in_value, js_in_arg)) {\n  983 |             state.failed = true;\n  984 |             break;\n  985 |         }\n  986 | \n  987 |         if (!gjs_arg->skip_in())\n  988 |             js_arg_pos++;","lines":11,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/function.cpp#L978-988"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In the Gio platform-specific preload, repo.require(platform_specific, version.get()) requires e.g. \"GioUnix\" using the *same* version string that was selected for \"Gio\" (via imports.gi.versions). GioUnix and Gio are separate typelibs whose version numbers are not guaranteed to coincide, so forwarding the Gio version to the platform-specific typelib can cause a spurious 'Failed to require GioUnix <version>' failure when the user pins a Gio version. The fixed-version definitions in repo_new() pin GioUnix/GLibUnix to \"2.0\" independently, which suggests the platform libs are meant to be versioned independently.","fix":"Require the platform-specific typelib with its own version (or null to accept any) rather than blindly forwarding the Gio version string.","locations":[{"ref":"gi/repo.cpp:111-127","code":"  111 | #if (defined(G_OS_UNIX) || defined(G_OS_WIN32))\n  112 |     if (strcmp(ns_name.get(), \"Gio\") == 0) {\n  113 | #    ifdef G_OS_UNIX\n  114 |         const char* platform = \"Unix\";\n  115 | #    else   // G_OS_WIN32\n  116 |         const char* platform = \"Win32\";\n  117 | #    endif  // G_OS_UNIX/G_OS_WIN32\n  118 |         Gjs::AutoChar platform_specific{\n  119 |             g_strconcat(ns_name.get(), platform, nullptr)};\n  120 |         auto required = repo.require(platform_specific, version.get());\n  121 |         if (!required.isOk()) {\n  122 |             gjs_throw(cx, \"Failed to require %s %s: %s\",\n  123 |                       platform_specific.get(), version.get(),\n  124 |                       required.inspectErr()->message);\n  125 |             return false;\n  126 |         }\n  127 |     }","lines":17,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/repo.cpp#L111-127"},{"ref":"gi/repo.cpp:225-237","code":"  225 | #ifdef G_OS_UNIX\n  226 |     if (!JS_DefineProperty(cx, versions, \"GLibUnix\", two_point_oh,\n  227 |                            JSPROP_PERMANENT) ||\n  228 |         !JS_DefineProperty(cx, versions, \"GioUnix\", two_point_oh,\n  229 |                            JSPROP_PERMANENT))\n  230 |         return nullptr;\n  231 | #elif defined(G_OS_WIN32)\n  232 |     if (!JS_DefineProperty(cx, versions, \"GLibWin32\", two_point_oh,\n  233 |                            JSPROP_PERMANENT) ||\n  234 |         !JS_DefineProperty(cx, versions, \"GioWin32\", two_point_oh,\n  235 |                            JSPROP_PERMANENT))\n  236 |         return nullptr;\n  237 | #endif  // G_OS_UNIX/G_OS_WIN32","lines":13,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/repo.cpp#L225-237"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"gjs_value_guess_g_type() maps any JS BigInt that JS::BigIntFits(int64_t) to G_TYPE_INT64, including positive values that also fit in uint64_t. The comment says 'if negative or within int64 limit -> signed', but a large positive BigInt that fits int64_t but was conceptually unsigned is still coerced to INT64. Combined with the OR, the only values treated as UINT64 are those exceeding int64_t max, which is the intended heuristic but loses information for round-tripping unsigned 64-bit values that happen to fit in int64_t.","fix":"Document this as an intentional lossy heuristic, or accept an explicit signedness hint when available rather than guessing from magnitude.","locations":[{"ref":"gi/value.cpp:472-482","code":"  472 |     if (value.isBigInt()) {\n  473 |         // Assume that if the value is negative or within the int64_t limit,\n  474 |         // then we're handling a signed integer, otherwise unsigned.\n  475 |         int64_t ignored;\n  476 |         if (JS::BigIntIsNegative(value.toBigInt()) ||\n  477 |             JS::BigIntFits(value.toBigInt(), &ignored))\n  478 |             *gtype_out = G_TYPE_INT64;\n  479 |         else\n  480 |             *gtype_out = G_TYPE_UINT64;\n  481 |         return true;\n  482 |     }","lines":11,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/value.cpp#L472-482"}]},
