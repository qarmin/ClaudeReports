{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"In load_async_executor(), the GFile is taken out of the reserved slot into Gjs::AutoUnref<GFile> file (consuming the ref stashed via file.copy() in the caller), then passed to g_file_load_contents_async, and the AutoUnref drops that ref at scope exit. This is actually balanced because g_file_load_contents_async takes its own ref on the GFile for the async operation's lifetime. However the comment 'We now own the GFile, and will pass the reference to the GAsyncResult' is misleading: the executor's reference is NOT passed to the async call - it is dropped by the AutoUnref, and the async machinery relies on GIO's own internal ref. The comment should not be read as 'do not unref here', which a future maintainer might believe and then break the balance.","fix":"Clarify the comment: the AutoUnref owns the reference taken out of the slot and releases it on return; g_file_load_contents_async holds its own reference for the duration of the async load.","locations":[{"ref":"gjs/internal.cpp:600-611","code":"  600 |     Gjs::AutoUnref<GFile> file{G_FILE(priv_value.toPrivate())};\n  601 |     g_assert(file && \"Executor called twice\");\n  602 |     // We now own the GFile, and will pass the reference to the GAsyncResult, so\n  603 |     // remove it from the executor's private slot so it doesn't become dangling\n  604 |     js::SetFunctionNativeReserved(&args.callee(), 0, JS::NullValue());\n  605 | \n  606 |     auto* data = new PromiseData(cx, JS_GetObjectFunction(resolve),\n  607 |                                  JS_GetObjectFunction(reject));\n  608 | \n  609 |     // Hold the main loop until this function resolves...\n  610 |     GjsContextPrivate::from_cx(cx)->main_loop_hold();\n  611 |     g_file_load_contents_async(file, nullptr, load_async_callback, data);","lines":12,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/internal.cpp#L600-611"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"Comment in Closure::invoke() debug log on success-with-exception path passes m_cx where the format string '%p ... closure %p' expects the closure pointer (this); it logs the JSContext pointer labeled as the closure. Cosmetic/debug-only mismatch.","fix":"Pass 'this' instead of m_cx to the gjs_debug_closure call so the logged pointer matches the 'closure %p' label.","locations":[{"ref":"gi/closure.cpp:190-195","code":"  190 |     if (gjs_log_exception_uncaught(m_cx)) {\n  191 |         gjs_debug_closure(\n  192 |             \"Closure invocation succeeded but an exception was set\"\n  193 |             \" - closure %p\",\n  194 |             m_cx);\n  195 |     }","lines":6,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/closure.cpp#L190-195"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"Comment says '2 means: recurse at most three times (including this call)' but actual_gtype passes recurse=2 to actual_gtype_recurse, which recurses while 'recurse > 0', i.e. it makes the initial call plus at most 2 more recursive calls = three calls total, but the phrasing '2 means ... three times' is confusing and the second comment block restates the same thing. The number 2 is a bare magic value whose mapping to the level count is non-obvious.","fix":"Clarify the comment to state explicitly that the argument is the maximum number of additional recursion levels (so 2 => 3 total lookups), or introduce a named constant.","locations":[{"ref":"gi/gtype.cpp:181-193","code":"  181 |     GJS_JSAPI_RETURN_CONVENTION\n  182 |     static bool actual_gtype(JSContext* cx, JS::HandleObject object,\n  183 |                              GType* gtype_out) {\n  184 |         g_assert(gtype_out && \"Missing return location\");\n  185 | \n  186 |         // 2 means: recurse at most three times (including this call).\n  187 |         // The levels are calculated considering that, in the worst case we need\n  188 |         // to go from instance to class, from class to GType object and from\n  189 |         // GType object to GType value.\n  190 | \n  191 |         const GjsAtoms& atoms = GjsContextPrivate::atoms(cx);\n  192 |         return actual_gtype_recurse(cx, atoms, object, gtype_out, 2);\n  193 |     }","lines":13,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/gtype.cpp#L181-193"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"The comment block before the _init check in lookup_override_function() states 'function being undefined means there was no override module', but the code path reaching this point has already successfully resolved the overrides module (gjs_object_require_property for `module` succeeded). At this point a missing/undefined _init does NOT mean there was no override module; it means the module exists but lacks a callable _init, which is exactly what the throw reports. The parenthetical comment is misleading about the control flow.","fix":"Reword the comment to clarify that the module was found and that a non-callable _init is unexpected; the 'no override module' case was already handled by the is_import_error() branch above.","locations":[{"ref":"gi/repo.cpp:424-432","code":"  424 |     // If the override module is present, it must have a callable _init(). An\n  425 |     // override module without _init() is probably unintentional. (function\n  426 |     // being undefined means there was no override module.)\n  427 |     if (!gjs_object_require_property(cx, module, \"override module\",\n  428 |                                      atoms.init(), function) ||\n  429 |         !function.isObject() || !JS::IsCallable(&function.toObject())) {\n  430 |         gjs_throw(cx, \"Unexpected value for _init in overrides module\");\n  431 |         return false;\n  432 |     }","lines":9,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/repo.cpp#L424-432"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"compile_module()'s doc comment says 'Returns: whether an error occurred while compiling the module.' Returning true here means success, not 'an error occurred'; the phrasing inverts the meaning. Same inverted wording appears on gjs_internal_compile_internal_module / gjs_internal_compile_module via their summaries.","fix":"Reword to 'Returns: false if an exception is pending, otherwise true' to match the actual GJS_JSAPI_RETURN_CONVENTION semantics.","locations":[{"ref":"gjs/internal.cpp:151-152","code":"  151 |  *\n  152 |  * Returns: whether an error occurred while compiling the module.","lines":2,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/internal.cpp#L151-152"}]},
{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"The doc comment for gjs_module_load() says 'Returns: whether an error occurred while resolving the specifier.' but the function returns JSObject* (the module object, or nullptr on failure), not a bool 'whether an error occurred'. The same boolean-style 'Returns' wording is copy-pasted onto gjs_module_resolve() (line 540) which also returns JSObject*. Copy-paste from a bool-returning hook doc.","fix":"Update the Returns: lines to describe the JSObject* return value (module object or nullptr on failure).","locations":[{"ref":"gjs/module.cpp:345","code":"  345 |  * Returns: whether an error occurred while resolving the specifier.","lines":1,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/module.cpp#L345"},{"ref":"gjs/module.cpp:532","code":"  532 |  * Returns: whether an error occurred while resolving the specifier.","lines":1,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/module.cpp#L532"}]},
{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"In getSource_func the comment \"pattern belongs to the context, so keep the reference\" precedes a call to gjs_cairo_pattern_from_pattern, which internally takes its OWN new reference (via copy_ptr/cairo_pattern_reference). The comment implies the wrapper adopts the context's reference, which is not what happens; the wrapper holds an independent ref and the context keeps its own. The comment is misleading about the ownership model (the code is correct).","fix":"Reword the comment to reflect that from_pattern takes its own reference and the context retains ownership of its reference.","locations":[{"ref":"modules/cairo-context.cpp:699-710","code":"  699 |     cairo_pattern_t* pattern = cairo_get_source(cr);\n  700 |     if (!gjs_cairo_check_status(cx, cairo_status(cr), \"context\"))\n  701 |         return false;\n  702 | \n  703 |     // pattern belongs to the context, so keep the reference\n  704 |     JSObject* pattern_wrapper = gjs_cairo_pattern_from_pattern(cx, pattern);\n  705 |     if (!pattern_wrapper) {\n  706 |         gjs_throw(cx, \"failed to create pattern\");\n  707 |         return false;\n  708 |     }\n  709 | \n  710 |     rec.rval().setObject(*pattern_wrapper);","lines":12,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/cairo-context.cpp#L699-710"}]},

442 |                 set_argument(new Arg::BasicGPtrArrayOut(type_info),\n 3443 |                              common_args);\n 3444 |                 return;\n 3445 |             }\n 3446 |         }\n 3447 |     }","lines":31,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/arg-cache.cpp#L3417-3447"},{"ref":"gi/arg-cache.cpp:3460-3490","code":" 3460 |     } else if (tag == GI_TYPE_TAG_ARRAY) {\n 3461 |         GIArrayType array_type = type_info.array_type();\n 3462 |         if (array_type == GI_ARRAY_TYPE_BYTE_ARRAY) {\n 3463 |             set_argument(new Arg::ByteArrayOut(), common_args);\n 3464 |             return;\n 3465 |         }\n 3466 | \n 3467 |         if (type_info.element_type().is_basic()) {\n 3468 |             if (array_type == GI_ARRAY_TYPE_C) {\n 3469 |                 if (type_info.is_zero_terminated()) {\n 3470 |                     set_argument(\n 3471 |                         new Arg::BasicCZeroTerminatedArrayOut(type_info),\n 3472 |                         common_args);\n 3473 |                     return;\n 3474 |                 }\n 3475 | \n 3476 |                 if (type_info.array_fixed_size()) {\n 3477 |                     set_argument(new Arg::BasicCFixedSizeArrayOut(type_info),\n 3478 |                                  common_args);\n 3479 |                     return;\n 3480 |                 }\n 3481 |             } else if (array_type == GI_ARRAY_TYPE_ARRAY) {\n 3482 |                 set_argument(new Arg::BasicGArrayOut(type_info), common_args);\n 3483 |                 return;\n 3484 |             } else if (array_type == GI_ARRAY_TYPE_PTR_ARRAY) {\n 3485 |                 set_argument(new Arg::BasicGPtrArrayOut(type_info),\n 3486 |                              common_args);\n 3487 |                 return;\n 3488 |             }\n 3489 |         }\n 3490 |     }","lines":31,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/arg-cache.cp {"id":"DUP_2","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"The four near-identical resolve_impl() method-lookup blocks (BoxedPrototype, FundamentalPrototype, InterfacePrototype, and param_resolve) repeat the same pattern: get_string_id -> null check -> info().method(name) -> is_method() -> gjs_define_function -> set *resolved. This copy-paste makes it easy for one variant to drift (e.g. the fundamental and boxed variants differ subtly in deprecated-method handling and interface fallthrough).","fix":"Factor the common method-resolution sequence into a shared helper that the wrapper-specific resolve_impl() functions call, parameterizing the small differences (deprecated handling, interface fallthrough).","locations":[{"ref":"gi/boxed.cpp:60-93","code":"   60 | template <class Base, class Prototype, class Instance>\n   61 | bool BoxedPrototype<Base, Prototype, Instance>::resolve_impl(\n   62 |     JSContext* cx, JS::HandleObject obj, JS::HandleId id, bool* resolved) {\n   63 |     JS::UniqueChars prop_name;\n   64 |     if (!gjs_get_string_id(cx, id, &prop_name))\n   65 |         return false;\n   66 |     if (!prop_name) {\n   67 |         *resolved = false;\n   68 |         return true;  // not resolved, but no error\n   69 |     }\n   70 | \n   71 |     // Look for methods and other class properties\n   72 |     Maybe<GI::AutoFunctionInfo> method_info{info().method(prop_name.get())};\n   73 |     if (!method_info) {\n   74 |         *resolved = false;\n   75 |         return true;\n   76 |     }\n   77 |     method_info->log_usage();\n   78 | \n   79 |     if (method_info->is_method()) {\n   80 |         gjs_debug(GJS_DEBUG_GBOXED, \"Defining method %s in prototype for %s\",\n   81 |                   method_info->name(), format_name().c_str());\n   82 | \n   83 |         // obj is the Boxed prototype\n   84 |         if (!gjs_define_function(cx, obj, gtype(), *method_info))\n   85 |             return false;\n   86 | \n   87 |         *resolved = true;\n   88 |     } else {\n   89 |         *resolved = false;\n   90 |     }\n   91 | \n   92 |     return true;\n   93 | }","lines":34,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/boxed.cpp#L60-93"},{"ref":"gi/fundamental.cpp:116-156","code":"  116 | bool FundamentalPrototype::resolve_impl(JSContext* cx, JS::HandleObject obj,\n  117 |                                         JS::HandleId id, bool* resolved) {\n  118 |     JS::UniqueChars prop_name;\n  119 |     if (!gjs_get_string_id(cx, id, &prop_name))\n  120 |         return false;\n  121 |     if (!prop_name) {\n  122 |         *resolved = false;\n  123 |         return true;  // not resolved, but no error\n  124 |     }\n  125 | \n  126 |     // We are the prototype, so look for methods and other class properties\n  127 |     Maybe<GI::AutoFunctionInfo> method_info{info().method(prop_name.get())};\n  128 | \n  129 |     if (method_info) {\n  130 |         method_info->log_usage();\n  131 |         if (method_info->is_method()) {\n  132 |             // we do not define deprecated methods in the prototype\n  133 |             if (method_info->is_deprecated()) {\n  134 |                 gjs_debug(GJS_DEBUG_GFUNDAMENTAL,\n  135 |                           \"Ignoring definition of deprecated method %s in \"\n  136 |                           \"prototype %s\",\n  137 |                           method_info->name(), format_name().c_str());\n  138 |                 *resolved = false;\n  139 |                 return true;\n  140 |             }\n  141 | \n  142 |             gjs_debug(GJS_DEBUG_GFUNDAMENTAL,\n  143 |                       \"Defining method %s in prototype for %s\",\n  144 |                       method_info->name(), format_name().c_str());\n  145 | \n  146 |             if (!gjs_define_function(cx, obj, gtype(), *method_info))\n  147 |                 return false;\n  148 | \n  149 |             *resolved = {"id":"ARCH_2","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"The GjsContextPrivate constructor (context.cpp:640-784) is a ~145-line monster that creates the JS context callbacks, profiler, weak caches, atoms, internal and default globals, the root importer, module hooks, loads two bootstrap modules, spins the main loop, and connects the memory-monitor signal. Failures are handled inconsistently with g_error() (which aborts the whole process) deep inside an object constructor. This makes the lifecycle hard to follow and impossible to recover from; a failed bootstrap aborts instead of returning an error to the GObject construction path.","fix":"Extract discrete phases (create globals, init atoms, define globals, load bootstrap modules, connect signals) into named helper methods, and consider a fallible init path rather than g_error() aborts so construction failures can be surfaced.","locations":[{"ref":"gjs/context.cpp:643-787","code":"  643 | GjsContextPrivate::GjsContextPrivate(JSContext* cx, GjsContext* public_context)\n  644 |     : m_public_context(public_context),\n  645 |       m_cx(cx),\n  646 |       m_owner_thread(std::this_thread::get_id()),\n  647 |       m_dispatcher(this),\n  648 |       m_memory_monitor(g_memory_monitor_dup_default()),\n  649 |       m_environment_preparer(cx) {\n  650 |     JS_SetGCCallback(\n  651 |         cx,\n  652 |         [](JSContext*, JSGCStatus status, JS::GCReason reason, void* data) {\n  653 |             static_cast<GjsContextPrivate*>(data)->on_garbage_collection(\n  654 |                 status, reason);\n  655 |         },\n  656 |         this);\n  657 | \n  658 |     const char* env_profiler = g_getenv(\"GJS_ENABLE_PROFILER\");\n  659 |     if (env_profiler || m_should_listen_sigusr2)\n  660 |         m_should_profile = true;\n  661 | \n  662 |     if (m_should_profile) {\n  663 |         m_profiler = gjs_profiler_new(public_context);\n  664 | \n  665 | {"id":"ARCH_3","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"gjs_get_search_path() lazily initializes a function-local static std::vector guarded by a plain bool, with an explicit 'not thread safe' comment. While gjs is largely single-threaded per context, this is a global mutable cache shared across all contexts/threads in a process; concurrent first-use from two threads is a data race. The bool guard pattern is also redundant with C++11 magic-static initialization, which would be thread-safe if the whole body were moved into the initializer of the static.","fix":"Build the vector inside the static initializer (e.g. 'static const std::vector<std::string> p = [] { ... }();') to get thread-safe, one-time initialization and drop the manual bool flag.","locations":[{"ref":"gjs/importer.cpp:733-782","code":"  733 | [[nodiscard]]\n  734 | static const std::vector<std::string>& gjs_get_search_path() {\n  735 |     static std::vector<std::string> gjs_search_path;\n  736 |     static bool search_path_initialized = false;\n  737 | \n  738 |     // not thread safe\n  739 | \n  740 |     if (!search_path_initialized) {\n  741 |         // in order of priority\n  742 | \n  743 |         // $GJS_PATH\n  744 |         const char* envstr = g_getenv(\"GJS_PATH\");\n  745 |         if (envstr) {\n  746 |             // we assume the array and strings are allocated separately\n  747 |             Gjs::AutoFree<char*> dirs{\n  748 |                 g_strsplit(envstr, G_SEARCHPATH_SEPARATOR_S, 0)};\n  749 |             for (char** d = dirs; *d != nullptr; d++)\n  750 |                 gjs_search_path.emplace_back(*d);\n  751 |         }\n  752 | \n  753 |         gjs_search_path.emplace_back(\n  754 |             \"resource:///org/gnome/gjs/modules/script/\");\n  755 |         gjs_search_path.emplace_back(\"resource:///org/gnome/gjs/modules/core/\");\n  756 | \n  757 |         // $XDG_DATA_DIRS /gjs-1.0\n  758 |         const char* const* system_data_dirs = g_get_system_data_dirs();\n  759 |         for (size_t i = 0; system_data_dirs[i] != nullptr; ++i) {\n  760 |             Gjs::AutoChar s{\n  761 |                 g_build_filename(system_data_dirs[i], \"gjs-1.0\", nullptr)};\n  762 |             gjs_search_path.emplace_back(s.get());\n  763 |         }\n  764 | \n  765 |         // ${datadir}/share/gjs-1.0\n  766 | #ifdef G_OS_WIN32\n  767 |         extern HMODULE gjs_dll;\n  768 |         char* basedir =\n  769 |             g_win32_get_package_installation_directory_of_module(gjs_dll);\n  770 |         Gjs::AutoChar gjs_data_dir{\n  771 |             g_build_filename(basedir, \"share\", \"gjs-1.0\", nullptr)};\n  772 |         gjs_search_path.emplace_back(gjs_data_dir.get());\n  773 |         g_free(basedir);\n  774 | #else\n  775 |         gjs_search_path.emplace_back(GJS_JS_DIR);\n  776 | #endif\n  777 | \n  778 |         search_path_initialized = true;\n  779 |     }\n  780 | \n  781 |     return gjs_search_path;\n  782 | }","lines":50,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/importer.cpp#L733-782"}]},
{"id":"OTHER_1","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"gjs_profiler_chain_signal() calls gjs_profiler_sigusr2(gjs_context) directly from the caller's (signal) context. gjs_profiler_sigusr2 calls gjs_profiler_start()/gjs_profiler_stop(), both of which perform extensive malloc/locking/logging work (sysprof writer creation, g_timeout_source, g_message). The doc says chain_signal may be called from a custom signal handler, so this runs start/stop in signal context - unsafe. (The SIGUSR2 GLib path via g_unix_signal_add is safe because GLib dispatches it from the main loop, but the chain_signal path is not.)","fix":"Document clearly that chain_signal for SIGUSR2 must be invoked from the main loop, not from raw signal context, or defer the start/stop work to a main-loop idle as g_unix_signal_add does.","locations":[{"ref":"gjs/profiler.cpp:796-819","code":"  796 | bool gjs_profiler_chain_signal(GjsContext* gjs_context, siginfo_t* info) {\n  797 | #ifdef ENABLE_PROFILER\n  798 | \n  799 |     if (info) {\n  800 |         if (info->si_signo == SIGPROF) {\n  801 |             gjs_profiler_sigprof(SIGPROF, info, nullptr);\n  802 |             return true;\n  803 |         }\n  804 | \n  805 |         if (info->si_signo == SIGUSR2) {\n  806 |             gjs_profiler_sigusr2(gjs_context);\n  807 |             return true;\n  808 |         }\n  809 |     }\n  810 | \n  811 | #else  // !ENABLE_PROFILER\n  812 | \n  813 |     (void)gjs_context;\n  814 |     (void)info;\n  815 | \n  816 | #endif  // ENABLE_PROFILER\n  817 | \n  818 |     return false;\n  819 | }","lines":24,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/profiler.cpp#L796-819"},{"ref":"gjs/profiler.cpp:735-747","code":"  735 | static gboolean gjs_profiler_sigusr2(void* data) {\n  736 |     GjsContext* gjs_context = GJS_CONTEXT(data);\n  737 |     GjsProfiler* current_profiler = gjs_context_get_profiler(gjs_context);\n {"id":"OTHER_2","type":"other","type_label":"Other","severity":"negligible","difficulty":"easy","description":"ErrorBase::get_domain() and value_of() store the GQuark (an unsigned guint32) into a JS value via setInt32(), and the C++ domain() accessor returns GQuark. For quark values above INT32_MAX this would surface in JS as a negative number. In practice GQuarks are small monotonically-assigned integers so this never occurs, but the signed/unsigned mismatch is latent.","fix":"Use args.rval().setNumber(static_cast<uint32_t>(priv->domain())) to represent the quark as an unsigned value, avoiding any sign reinterpretation.","locations":[{"ref":"gi/gerror.cpp:107-111","code":"  107 | bool ErrorBase::get_domain(JSContext* cx, unsigned argc, JS::Value* vp) {\n  108 |     GJS_CHECK_WRAPPER_PRIV(cx, argc, vp, args, obj, ErrorBase, priv);\n  109 |     args.rval().setInt32(priv->domain());\n  110 |     return true;\n  111 | }","lines":5,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/gerror.cpp#L107-111"},{"ref":"gi/gerror.cpp:185-191","code":"  185 |     ErrorBase* priv;\n  186 |     if (!for_js_typecheck(cx, prototype, &priv, &rec))\n  187 |         return false;\n  188 | \n  189 |     rec.rval().setInt32(priv->domain());\n  190 |     return true;\n  191 | }","lines":7,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/gerror.cpp#L185-191"}]},

<script>
(function(){
'use strict';

// Data
const FINDINGS     = JSON.parse(document.getElementById('D').textContent);
const PROJECT_INFO = JSON.parse(document.getElementById('PI').textContent);
const SEVS     = ['critical','high','medium','low','negligible'];
const STATUSES = ['open','fixed','wont-fix','false-positive'];
const ALL_TYPES = [...new Set(FINDINGS.map(f => f.type))].sort();
// Build lookup map for O(1) access
const FINDING_BY_ID = new Map(FINDINGS.map(f => [f.id, f]));
// Only severities actually present in the report — the filter bar hides the rest.
const PRESENT_SEVS = SEVS.filter(s => FINDINGS.some(f => (f.severity || 'medium') === s));
// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};
const PRESENT_DIFFS = DIFFICULTY_ORDER.filter(d => FINDINGS.some(f => f.difficulty === d));
const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', searchScope: 'all', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),
};
const statuses = {};

// Persistence
function loadStatuses() {
  try { Object.assign(statuses, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}
}
function saveStatuses() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    if (S.searchScope !== 'all') p.set('qs', S.searchScope);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('qs'))  { S.searchScope = p.get('qs'); }
  document.getElementById('search-scope').classList.toggle('active', S.searchScope === 'locations');
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build a [project] header block from embedded PROJECT_INFO, so the exported
// findings.toml is self-contained (doesn't depend on a sibling project-info.toml
// that a second, separately-triggered download could silently fail to save).
// '' when there is no project info at all.
function buildProjectToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = PROJECT_INFO || {};
  if (!Object.keys(pi).length) return '';
  const lines = ['[project]'];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n\n';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return buildProjectToml() + chunks.join('\n\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystacks per finding (cleared on full re-render).
// Two variants: everything (default), and file/folder paths only - for when a
// search term (e.g. a directory name like 'dlls/abc') also happens to appear
// inside description/fix prose and you only want path matches.
const _hay = new Map();
const _hayLoc = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}
function hayLocOf(f) {
  if (!_hayLoc.has(f.id)) {
    _hayLoc.set(f.id, f.locations.map(l => l.ref).join(' ').toLowerCase());
  }
  return _hayLoc.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (S.searchScope === 'locations') {
      if (!hayLocOf(f).includes(q)) return false;
    } else if (!hayOf(f).includes(q) && !st.includes(q)) {
      return false;
    }
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  _hayLoc.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    // Single download (was two) - a second auto-triggered download is commonly
    // blocked by the browser unless the user explicitly allows it, which silently
    // drops project-info.toml. Embedding [project] in findings.toml itself avoids
    // that failure mode entirely.
    downloadText(buildFindingsToml(), 'findings.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});
document.getElementById('search-scope').addEventListener('click', e => {
  S.searchScope = S.searchScope === 'locations' ? 'all' : 'locations';
  e.currentTarget.classList.toggle('active', S.searchScope === 'locations');
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
