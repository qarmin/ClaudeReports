{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"gjs_value_to_g_value_internal()'s G_TYPE_VARIANT branch (inside the G_TYPE_BOXED block, via the explicit gtype==G_TYPE_VARIANT handling at the dedicated section) and the boxed handling can call g_value_set_boxed()/g_value_set_static_boxed() with a gboxed pulled from a foreign struct conversion whose ownership semantics (transfer) are not honored: gjs_struct_foreign_convert_to_gi_argument() is invoked with GI_TRANSFER_NOTHING and the returned pointer is then stored without considering that no_copy controls static-vs-copy but not the foreign allocation lifetime. If the foreign 'to' function allocated, this can leak or store a pointer outliving its owner.","fix":"Track and release the GIArgument produced by gjs_struct_foreign_convert_to_gi_argument(), or document/assert that foreign 'to' conversions for boxed GValues never transfer ownership.","locations":[{"ref":"gi/value.cpp:796-838","code":"  796 |                 if (registered) {\n  797 |                     if (auto struct_info =\n  798 |                             registered->as<GI::InfoTag::STRUCT>();\n  799 |                         struct_info && struct_info->is_foreign()) {\n  800 |                         GIArgument arg;\n  801 | \n  802 |                         if (!gjs_struct_foreign_convert_to_gi_argument(\n  803 |                                 cx, value, struct_info.value(), nullptr,\n  804 |                                 GJS_ARGUMENT_ARGUMENT, GI_TRANSFER_NOTHING,\n  805 |                                 GjsArgumentFlags::MAY_BE_NULL, &arg))\n  806 |                             return false;\n  807 | \n  808 |                         gboxed = gjs_arg_get<void*>(&arg);\n  809 |                     }\n  810 |                 }\n  811 | \n  812 |                 // First try a union. If that fails, assume a boxed struct.\n  813 |                 // Distinguishing which one is expected would require checking\n  814 |                 // the associated GIBaseInfo, which is not necessarily possible,\n  815 |                 // if e.g. we see the GType without loading the typelib.\n  816 |                 if (!gboxed) {\n  817 |                     if (UnionBase::typecheck(cx, obj, gtype,\n  818 |                                              GjsTypecheckNoThrow{})) {\n  819 |                         gboxed = UnionBase::to_c_ptr(cx, obj);\n  820 |                     } else {\n  821 |                         if (!StructBase::typecheck(cx, obj, gtype))\n  822 |                             return false;\n  823 | \n  824 |                         gboxed = StructBase::to_c_ptr(cx, obj);\n  825 |                     }\n  826 |                     if (!gboxed)\n  827 |                         return false;\n  828 |                 }\n  829 |             }\n  830 |         } else {\n  831 |             return throw_expect_type(cx, value, \"boxed type\", gtype);\n  832 |         }\n  833 | \n  834 |         if (no_copy)\n  835 |             g_value_set_static_boxed(gvalue, gboxed);\n  836 |         else\n  837 |             g_value_set_boxed(gvalue, gboxed);\n  838 |         return true;","lines":43,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/value.cpp#L796-838"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"unregister_unhandled_promise_rejection() logs a g_critical if erase() did not remove exactly one entry. But on_promise_unhandled_rejection (engine.cpp) calls unregister for state==Handled even for promises that were never registered as unhandled (e.g. a promise that rejected and was handled in the same turn). This can produce spurious 'handler attached to rejected promise that wasn't previously marked as unhandled' criticals during normal operation where a rejection is immediately caught.","fix":"Only emit the critical when the promise was actually expected to be tracked; treat erase()==0 for an untracked-but-handled promise as benign, or gate registration so unregister is only called for previously registered IDs.","locations":[{"ref":"gjs/context.cpp:1254-1263","code":" 1254 | void GjsContextPrivate::unregister_unhandled_promise_rejection(uint64_t id) {\n 1255 |     size_t erased = m_unhandled_rejection_stacks.erase(id);\n 1256 |     if (erased != 1) {\n 1257 |         g_critical(\n 1258 |             \"Promise %\" PRIu64\n 1259 |             \" handler attached to rejected promise that wasn't previously \"\n 1260 |             \"marked as unhandled or that we wrongly reported as unhandled\",\n 1261 |             id);\n 1262 |     }\n 1263 | }","lines":10,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/context.cpp#L1254-1263"},{"ref":"gjs/engine.cpp:54-69","code":"   54 | static void on_promise_unhandled_rejection(\n   55 |     JSContext* cx, bool mutedErrors [[maybe_unused]], JS::HandleObject promise,\n   56 |     JS::PromiseRejectionHandlingState state, void* data) {\n   57 |     auto* gjs = static_cast<GjsContextPrivate*>(data);\n   58 |     uint64_t id = JS::GetPromiseID(promise);\n   59 | \n   60 |     if (state == JS::PromiseRejectionHandlingState::Handled) {\n   61 |         // This happens when catching an exception from an await expression.\n   62 |         gjs->unregister_unhandled_promise_rejection(id);\n   63 |         return;\n   64 |     }\n   65 | \n   66 |     JS::RootedObject allocation_site(cx, JS::GetPromiseAllocationSite(promise));\n   67 |     JS::UniqueChars stack = format_saved_frame(cx, allocation_site);\n   68 |     gjs->register_unhandled_promise_rejection(id, std::move(stack));\n   69 | }","lines":16,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/engine.cpp#L54-69"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"gjs_import_native_module() interns id_str and checks 'if (id.isVoid()) return false;' but does not set a pending exception. gjs_intern_string_to_id returns a void id on OOM; returning false without an exception pending violates the GJS_JSAPI_RETURN_CONVENTION (caller expects an exception to be pending on false). Downstream code (do_import asserts 'JS_IsExceptionPending' at importer.cpp:576 in the no-module path) and SpiderMonkey generally assert that a false return is accompanied by a pending exception.","fix":"On id.isVoid(), report OOM (JS_ReportOutOfMemory) before returning false, or rely on gjs_intern_string_to_id to have set the exception and document that.","locations":[{"ref":"gjs/importer.cpp:267-269","code":"  267 |     JS::RootedId id(cx, gjs_intern_string_to_id(cx, id_str));\n  268 |     if (id.isVoid())\n  269 |         return false;","lines":3,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/importer.cpp#L267-269"}]},
{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"import_module_init() declares 'gsize script_len = 0;' with the comment 'Do not use size_t, may be different width', then passes &script_len to g_file_load_contents (correct, expects gsize*) and forwards it to gjs->eval_with_scope(..., script_len, ...). By contrast GjsScriptModule::import_file() uses 'size_t script_len' with g_file_load_contents (gjs/module.cpp:153). On LLP64 (Windows) gsize and size_t are both 8 bytes so this is fine, but the two sibling functions are inconsistent and one of the comments is misleading: gsize and size_t are the same width on all platforms GLib supports.","fix":"Pick one type consistently. The comment claiming gsize 'may be different width' from size_t is incorrect on supported platforms; either remove it or align module.cpp to use gsize as well.","locations":[{"ref":"gjs/importer.cpp:288","code":"  288 |     gsize script_len = 0;  // Do not use size_t, may be different width","lines":1,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/importer.cpp#L288"},{"ref":"gjs/module.cpp:152","code":"  152 |         size_t script_len = 0;","lines":1,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/module.cpp#L152"}]},
{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"gjs_string_from_ucs4 ignores a partially-failed conversion length. g_ucs4_to_utf16 writes u16_string_length as a `long`; it is passed to JS_NewUCStringCopyN as a size_t. If u16_string_length were ever negative (it should not be on success, but the value is used without validation), the implicit long->size_t conversion would produce a huge length and an out-of-bounds read. Minor because GLib returns non-negative on the success path checked here.","fix":"Assert/validate u16_string_length >= 0 before converting to size_t, or store it in an unsigned type after the null-check.","locations":[{"ref":"gjs/jsapi-util-string.cpp:393-408","code":"  393 |     long u16_string_length;\n  394 |     Gjs::AutoError error;\n  395 | \n  396 |     gunichar2* u16_string = g_ucs4_to_utf16(ucs4_string, n_chars, nullptr,\n  397 |                                             &u16_string_length, &error);\n  398 |     if (!u16_string) {\n  399 |         gjs_throw(cx, \"Failed to convert UCS-4 string to UTF-16: %s\",\n  400 |                   error->message);\n  401 |         return false;\n  402 |     }\n  403 | \n  404 |     // Sadly, must copy, because js::UniquePtr forces that chars passed to\n  405 |     // JS_NewUCString() must have been allocated by the JS engine.\n  406 |     JS::RootedString str(\n  407 |         cx, JS_NewUCStringCopyN(cx, reinterpret_cast<char16_t*>(u16_string),\n  408 |                                 u16_string_length));","lines":16,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/jsapi-util-string.cpp#L393-408"}]},
{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"MainLoop::spin only calls g_main_context_iteration when g_main_context_pending() is true. With blocking==true and no pending sources, the loop will not block waiting for new events; instead it spins the while-condition. If can_block() is true (loop is held) but there are momentarily no pending sources, the loop busy-waits (tight CPU spin) rather than blocking in g_main_context_iteration. g_main_context_iteration with may_block=true is the standard way to block until a source is ready; gating it on g_main_context_pending() defeats blocking.","fix":"Call g_main_context_iteration(main_context, blocking) unconditionally when blocking is true (it will block internally until a source is ready), and only gate on g_main_context_pending() for the non-blocking case.","locations":[{"ref":"gjs/mainloop.cpp:32-50","code":"   32 |     do {\n   33 |         bool blocking = can_block();\n   34 | \n   35 |         // Only run the loop if there are pending jobs.\n   36 |         if (g_main_context_pending(main_context))\n   37 |             g_main_context_iteration(main_context, blocking);\n   38 | \n   39 |         // If System.exit() has not been called\n   40 |         if (gjs->should_exit(nullptr)) {\n   41 |             debug(\"Stopped spinning loop because System.exit called\");\n   42 |             exit();\n   43 |             return false;\n   44 |         }\n   45 |     } while (\n   46 |         // and there is not a pending main loop hook\n   47 |         !gjs->has_main_loop_hook() &&\n   48 |         // and there are pending sources or the job queue is not empty\n   49 |         // continue spinning the event loop.\n   50 |         (can_block() || !gjs->empty()));","lines":19,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/mainloop.cpp#L32-50"}]},
{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"canonicalize_specifier() round-trips a non-'gi' specifier through GFile to canonicalize host/path, but then rebuilds the final URI joining the ORIGINAL query (query.get()) with the RE-PARSED host/path. If the GFile round-trip (g_file_new_for_uri / g_file_get_uri) normalizes or percent-re-encodes the path in a way that interacts with the query, the recombination can produce a specifier that no longer round-trips, defeating the dedup purpose for URIs that carry a query. Also, g_file_get_uri() result is assigned back into for_file_uri (a Gjs::AutoChar) replacing the previous value; confirm the previous buffer is freed by the assignment operator and not leaked.","fix":"Verify AutoChar assignment frees the prior allocation; add a test for specifiers with query strings to confirm canonicalization is idempotent.","locations":[{"ref":"gjs/module.cpp:495-512","code":"  495 |     if (g_strcmp0(scheme, \"gi\")) {\n  496 |         // canonicalize without the query portion to avoid it being encoded\n  497 |         Gjs::AutoChar for_file_uri{g_uri_join(G_URI_FLAGS_NONE, scheme.get(),\n  498 |                                               nullptr, host.get(), -1,\n  499 |                                               path.get(), nullptr, nullptr)};\n  500 |         Gjs::AutoUnref<GFile> file{g_file_new_for_uri(for_file_uri.get())};\n  501 |         for_file_uri = g_file_get_uri(file);\n  502 |         host.reset();\n  503 |         path.reset();\n  504 |         if (!g_uri_split(for_file_uri.get(), G_URI_FLAGS_NONE, nullptr, nullptr,\n  505 |                          host.out(), nullptr, path.out(), nullptr, nullptr,\n  506 |                          nullptr))\n  507 |             return false;\n  508 |     }\n  509 | \n  510 |     Gjs::AutoChar canonical_specifier{\n  511 |         g_uri_join(G_URI_FLAGS_NONE, scheme.get(), nullptr, host.get(), -1,\n  512 |                    path.get(), query.get(), nullptr)};","lines":18,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/module.cpp#L495-512"}]},
{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In gjs_dynamic_module_resolve(), main_loop_hold() is taken at line 716 after the JS::Call succeeds. After that, three code paths return false without releasing the hold: if NewFunctionWithReserved for 'resolved' fails (line 721), if 'rejected' fails (line 726), or if AddPromiseReactions() fails (line 737). The matching main_loop_release() lives only in finish_import(), which is invoked exclusively from the resolved/rejected reaction handlers - and those never run if the reactions could not be created/registered. Each such failure leaks a main-loop hold, which can hang context shutdown (the main loop will not exit while held).","fix":"On every false-return path after main_loop_hold() (lines 721, 726, and the AddPromiseReactions failure at 737), call GjsContextPrivate::from_cx(cx)->main_loop_release() before returning, or restructure so the hold is only taken once the reactions are guaranteed registered.","locations":[{"ref":"gjs/module.cpp:708-729","code":"  708 |     priv->main_loop_hold();\n  709 | \n  710 |     JS::RootedObject resolved(\n  711 |         cx, JS_GetFunctionObject(js::NewFunctionWithReserved(\n  712 |                 cx, import_resolved, 1, 0, \"async import resolved\")));\n  713 |     if (!resolved)\n  714 |         return false;\n  715 |     JS::RootedObject rejected(\n  716 |         cx, JS_GetFunctionObject(js::NewFunctionWithReserved(\n  717 |                 cx, import_rejected, 1, 0, \"async import rejected\")));\n  718 |     if (!rejected)\n  719 |         return false;\n  720 |     js::SetFunctionNativeReserved(resolved, 0, JS::ObjectValue(*callback_data));\n  721 |     js::SetFunctionNativeReserved(rejected, 0, JS::ObjectValue(*callback_data));\n  722 | \n  723 |     JS::RootedObject promise(cx, &result.toObject());\n  724 | \n  725 |     // Calling JS::FinishDynamicModuleImport() at the end of the resolve and\n  726 |     // reject handlers will also call the module resolve hook. The module will\n  727 |     // already have been resolved, but that is how SpiderMonkey obtains the\n  728 |     // module object.\n  729 |     return JS::AddPromiseReactions(cx, promise, resolved, rejected);","lines":22,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/module.cpp#L708-729"}]},
{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In gjs_lossy_decode_from_uint8array_slow's fallback handling, when an INVALID_DATA/PARTIAL_INPUT error occurs at the very end of the input (input_len == 0 after a prior read), the code intentionally skips inserting the U+FFFD replacement character. This silently drops the final invalid/partial byte sequence from the decoded output instead of emitting a replacement character, which diverges from the WHATWG Encoding spec's lossy-decode behavior (a trailing incomplete sequence should yield U+FFFD).","fix":"Emit a single U+FFFD replacement when a partial/invalid sequence is detected at end-of-input as well, matching spec semantics, rather than dropping it.","locations":[{"ref":"gjs/text-encoding.cpp:149-170","code":"  149 |         } else if (local_error) {\n  150 |             // A PARTIAL_INPUT error can only occur if the user does not provide\n  151 |             // the full sequence for a multi-byte character, we skip over the\n  152 |             // next character and insert a unicode fallback.\n  153 | \n  154 |             // An INVALID_DATA error occurs when there is no way to decode a\n  155 |             // given byte into UTF-16 or the given byte does not exist in the\n  156 |             // source encoding.\n  157 |             if (g_error_matches(local_error, G_IO_ERROR,\n  158 |                                 G_IO_ERROR_INVALID_DATA) ||\n  159 |                 g_error_matches(local_error, G_IO_ERROR,\n  160 |                                 G_IO_ERROR_PARTIAL_INPUT)) {\n  161 |                 // If we're already at the end of the string, don't insert a\n  162 |                 // fallback.\n  163 |                 if (input_len > 0) {\n  164 |                     // Skip the next byte and reduce length by one.\n  165 |                     input += 1;\n  166 |                     input_len -= 1;\n  167 | \n  168 |                     // Append the unicode fallback character to the output\n  169 |                     output_str.append(u\"\\ufffd\", 1);\n  170 |                 }","lines":22,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/text-encoding.cpp#L149-170"}]},
{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"gjs_encode_to_uint8array UTF-8 path: when string_termination == ZERO_TERMINATED, utf8_len is recomputed with strlen(utf8.get()), but the buffer allocated by gjs_string_to_utf8_n has length original_utf8_len+1. NewArrayBufferWithContents is then given utf8_len = strlen() (which truncates at the first embedded NUL). The remaining allocated bytes after the NUL are silently dropped from the ArrayBuffer view but the underlying allocation is larger than reported; this is correct for byte length but means the ArrayBuffer's backing store is over-allocated and any embedded-NUL content is truncated. Worth confirming this truncation-at-NUL is the intended fromString() semantics.","fix":"Confirm intended ZERO_TERMINATED semantics; if embedded NULs should be preserved up to a single trailing terminator the strlen() approach is wrong. Otherwise document that fromString() truncates at the first embedded NUL.","locations":[{"ref":"gjs/text-encoding.cpp:392-407","code":"  392 |     bool encoding_is_utf8 = is_utf8_label(encoding);\n  393 |     if (encoding_is_utf8) {\n  394 |         JS::UniqueChars utf8;\n  395 |         size_t utf8_len;\n  396 | \n  397 |         if (!gjs_string_to_utf8_n(cx, str, &utf8, &utf8_len))\n  398 |             return nullptr;\n  399 | \n  400 |         if (string_termination == GjsStringTermination::ZERO_TERMINATED) {\n  401 |             // strlen is safe because gjs_string_to_utf8_n returns\n  402 |             // a null-terminated string.\n  403 |             utf8_len = strlen(utf8.get());\n  404 |         }\n  405 | \n  406 |         array_buffer =\n  407 |             JS::NewArrayBufferWithContents(cx, utf8_len, std::move(utf8));","lines":16,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/text-encoding.cpp#L392-407"}]},
{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"setDash silently drops array elements whose value is `undefined` (the `if (elem.isUndefined()) continue;` skip). A sparse or partially-undefined array thus produces a dash pattern of a different length than the JS array, rather than coercing undefined to NaN/throwing. This is surprising and inconsistent with how every other numeric argument here is handled (ToNumber, which would turn undefined into NaN and let cairo reject it).","fix":"Remove the isUndefined() skip and run every element through JS::ToNumber, or explicitly document/throw on holes. The length of the produced dash array should match the input array length.","locations":[{"ref":"modules/cairo-context.cpp:533-551","code":"  533 |     for (uint32_t i = 0; i < len; ++i) {\n  534 |         double b;\n  535 | \n  536 |         elem.setUndefined();\n  537 |         if (!JS_GetElement(cx, dashes, i, &elem)) {\n  538 |             return false;\n  539 |         }\n  540 |         if (elem.isUndefined())\n  541 |             continue;\n  542 | \n  543 |         if (!JS::ToNumber(cx, elem, &b))\n  544 |             return false;\n  545 |         if (b <= 0) {\n  546 |             gjs_throw(cx, \"Dash value must be positive\");\n  547 |             return false;\n  548 |         }\n  549 | \n  550 |         dashes_c[dashes_c_size++] = b;\n  551 |     }","lines":19,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/cairo-context.cpp#L533-551"}]},
{"id":"LOGIC_34","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"setDash rejects any individual dash value <= 0 with \"Dash value must be positive\". Cairo's actual contract (cairo_set_dash) allows zero entries in the dash array; only the case where every entry is zero is an error (CAIRO_STATUS_INVALID_DASH). This binding is stricter than cairo and rejects legal dash patterns containing a 0 (e.g. [0, 5] for round-dotted lines with round caps).","fix":"Reject only negative values (`if (b < 0)`), pass the array to cairo_set_dash, and let cairo_status(cr) report CAIRO_STATUS_INVALID_DASH for the all-zero case via the FUNC_END status check.","locations":[{"ref":"modules/cairo-context.cpp:545-548","code":"  545 |         if (b <= 0) {\n  546 |             gjs_throw(cx, \"Dash value must be positive\");\n  547 |             return false;\n  548 |         }","lines":4,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/cairo-context.cpp#L545-548"}]},
{"id":"LOGIC_35","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"get_rectangle_func passes an arbitrary, JS-controlled signed integer index `i` directly to cairo_region_get_rectangle without bounds-checking it against cairo_region_num_rectangles(). A negative or out-of-range index triggers a cairo internal assertion/error and the returned rect is whatever cairo leaves it (the local `rect` is uninitialized if cairo bails early), so make_rectangle can read uninitialized stack data. RETURN_STATUS may not catch an out-of-range access on all cairo versions.","fix":"Validate `i` against cairo_region_num_rectangles(this_region) (and reject negatives) before calling cairo_region_get_rectangle, throwing a RangeError otherwise. Also zero-initialize `cairo_rectangle_int_t rect{}`.","locations":[{"ref":"modules/cairo-region.cpp:159-175","code":"  159 | GJS_JSAPI_RETURN_CONVENTION\n  160 | static bool get_rectangle_func(JSContext* cx, unsigned argc, JS::Value* vp) {\n  161 |     PRELUDE;\n  162 |     int i;\n  163 |     cairo_rectangle_int_t rect;\n  164 | \n  165 |     if (!gjs_parse_call_args(cx, \"get_rectangle\", argv, \"i\", \"rect\", &i))\n  166 |         return false;\n  167 | \n  168 |     cairo_region_get_rectangle(this_region, i, &rect);\n  169 |     JSObject* rect_obj = make_rectangle(cx, &rect);\n  170 |     if (!rect_obj)\n  171 |         return false;\n  172 | \n  173 |     argv.rval().setObject(*rect_obj);\n  174 |     RETURN_STATUS;\n  175 | }","lines":17,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/cairo-region.cpp#L159-175"}]},
{"id":"LOGIC_36","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"Several no-argument Surface/ImageSurface methods check `if (argc > 1)` but their error message says \"takes no arguments\". This off-by-one allows a single extra argument to be passed silently (ignored) while two or more throw. Compare getDeviceOffset/getDeviceScale which correctly use `argc > 0`. Inconsistent and the guard does not match its message.","fix":"Change the guards to `if (argc > 0)` so they actually enforce \"takes no arguments\", matching getDeviceOffset_func/getDeviceScale_func.","locations":[{"ref":"modules/cairo-surface.cpp:71-74","code":"   71 |     if (argc > 1) {\n   72 |         gjs_throw(cx, \"Surface.flush() takes no arguments\");\n   73 |         return false;\n   74 |     }","lines":4,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/cairo-surface.cpp#L71-74"},{"ref":"modules/cairo-surface.cpp:93-96","code":"   93 |     if (argc > 1) {\n   94 |         gjs_throw(cx, \"Surface.finish() takes no arguments\");\n   95 |         return false;\n   96 |     }","lines":4,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/cairo-surface.cpp#L93-96"},{"ref":"modules/cairo-surface.cpp:115-118","code":"  115 |     if (argc > 1) {\n  116 |         gjs_throw(cx, \"Surface.getType() takes no arguments\");\n  117 |         return false;\n  118 |     }","lines":4,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/cairo-surface.cpp#L115-118"},{"ref":"modules/cairo-image-surface.cpp:80-83","code":"   80 |     if (argc > 1) {\n   81 |         gjs_throw(cx, \"ImageSurface.getFormat() takes no arguments\");\n   82 |         return false;\n   83 |     }","lines":4,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/cairo-image-surface.cpp#L80-83"},{"ref":"modules/cairo-image-surface.cpp:102-105","code":"  102 |     if (argc > 1) {\n  103 |         gjs_throw(cx, \"ImageSurface.getWidth() takes no arguments\");\n  104 |         return false;\n  105 |     }","lines":4,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/cairo-image-surface.cpp#L102-105"},{"ref":"modules/cairo-image-surface.cpp:124-127","code":"  124 |     if (argc > 1) {\n  125 |         gjs_throw(cx, \"ImageSurface.getHeight() takes no arguments\");\n  126 |         return false;\n  127 |     }","lines":4,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/cairo-image-surface.cpp#L124-127"},{"ref":"modules/cairo-image-surface.cpp:146-149","code":"  146 |     if (argc > 1) {\n  147 |         gjs_throw(cx, \"ImageSurface.getStride() takes no arguments\");\n  148 |         return false;\n  149 |     }","lines":4,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/cairo-image-surface.cpp#L146-149"}]},
{"id":"LOGIC_37","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"_common.js _checkAccessors: when the property name is compound (contains '-') and only an underscore/camel descriptor pre-exists, the generated/propagated propdesc is defined on the dash name (if !dashPropdesc) and on underscore/camel names guarded individually. But the accessors generated by _generateAccessors capture `name` (the dash name) in their closures for this.notify(name) and the privateName symbol. Defining the SAME propdesc object on dash, underscore, and camel names means all three share one backing privateName symbol (good), but also means all three getters call this.notify(name) with the dash form only - which is correct for GObject, yet the autogenerated default value is read once at definition time (line 35 defaultValue = pspec.get_default_value()) and captured, so any later change to the pspec default is not reflected. Minor, but the shared-descriptor coupling across three property names is subtle and undocumented.","fix":"Add a brief comment documenting that the dash/underscore/camel names intentionally share one descriptor (and thus one backing field), to prevent a future reader from splitting them.","locations":[{"ref":"modules/core/_common.js:66-98","code":"   66 | function _checkAccessors(proto, pspec, GObject) {\n   67 |     const {name, flags} = pspec;\n   68 |     if (flags & GObject.ParamFlags.CONSTRUCT_ONLY)\n   69 |         return;\n   70 | \n   71 |     const underscoreName = name.replace(/-/g, '_');\n   72 |     const camelName = name.replace(/-([a-z])/g, match => match[1].toUpperCase());\n   73 |     let propdesc = Object.getOwnPropertyDescriptor(proto, name);\n   74 |     let dashPropdesc = propdesc, underscorePropdesc, camelPropdesc;\n   75 |     const nameIsCompound = name.includes('-');\n   76 |     if (nameIsCompound) {\n   77 |         underscorePropdesc = Object.getOwnPropertyDescriptor(proto, underscoreName);\n   78 |         camelPropdesc = Object.getOwnPropertyDescriptor(proto, camelName);\n   79 |         if (!propdesc)\n   80 |             propdesc = underscorePropdesc;\n   81 |         if (!propdesc)\n   82 |             propdesc = camelPropdesc;\n   83 |     }\n   84 | \n   85 |     const readable = flags & GObject.ParamFlags.READABLE;\n   86 |     const writable = flags & GObject.ParamFlags.WRITABLE;\n   87 |     if (!propdesc || (readable && !propdesc.get) || (writable && !propdesc.set))\n   88 |         propdesc = _generateAccessors(pspec, propdesc, GObject);\n   89 | \n   90 |     if (!dashPropdesc)\n   91 |         Object.defineProperty(proto, name, propdesc);\n   92 |     if (nameIsCompound) {\n   93 |         if (!underscorePropdesc)\n   94 |             Object.defineProperty(proto, underscoreName, propdesc);\n   95 |         if (!camelPropdesc)\n   96 |             Object.defineProperty(proto, camelName, propdesc);\n   97 |     }\n   98 | }","lines":33,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/core/_common.js#L66-98"},{"ref":"modules/core/_common.js:29-43","code":"   29 |     if (readable && writable) {\n   30 |         if (!propdesc.get && !propdesc.set) {\n   31 |             const privateName = Symbol(`__autogeneratedAccessor__${name}`);\n   32 |             const defaultValue = pspec.get_default_value();\n   33 |             propdesc.get = function () {\n   34 |                 if (!(privateName in this))\n   35 |                     this[privateName] = defaultValue;\n   36 |                 return this[privateName];\n   37 |             };\n   38 |             propdesc.set = function (value) {\n   39 |                 if (value !== this[privateName]) {\n   40 |                     this[privateName] = value;\n   41 |                     this.notify(name);\n   42 |                 }\n   43 |             };","lines":15,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/core/_common.js#L29-43"}]},
{"id":"LOGIC_38","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"_format.js fillWidth uses String.prototype.substr, a deprecated/legacy method, and the padding logic `c.repeat(w)` allocates a width-w string on every conversion even when no padding is needed (width 0 is the common case: c.repeat(0) = '' so harmless, but for any width >= s.length the full repeat is built then sliced). More importantly there is no support for left-justification (the printf '-' flag), and negative numbers with '0' fill produce a sign in the wrong position (e.g. '%05d'.format(-1) yields '000-1' instead of '-0001').","fix":"Use padStart/padEnd instead of the substr-based fill, and special-case the sign when zero-padding negative numbers.","locations":[{"ref":"modules/core/_format.js:32-35","code":"   32 |         function fillWidth(s, c, w) {\n   33 |             let fill = c.repeat(w);\n   34 |             return fill.substr(s.length) + s;\n   35 |         }","lines":4,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/core/_format.js#L32-35"},{"ref":"modules/core/_format.js:70","code":"   70 |         return fillWidth(s, fillChar, width);","lines":1,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/core/_format.js#L70"}]},
{"id":"LOGIC_39","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"Console #formatter recursion can return inconsistent types. When the first format specifier is processed it builds `result = [target, ...args.slice(2)]`. If after substitution `target` still has specifiers but only one element remains (no more args), it returns the array `result` (line 478-479); but in the no-more-specifiers branch it also returns the array. However at the top, when args.length === 1 it returns `target` (a string, line 423-424), not an array. So #formatter returns either a string or an array depending on path, and #logger passes its result straight to #printer which expects an array. The single-arg-string return is only reachable via direct recursion termination and is masked because #logger only calls #formatter with length >= 2, but the inconsistency is a latent bug if reused.","fix":"Always return an array from #formatter (wrap the early `return target` as `return [target]`), so callers have a single, consistent contract.","locations":[{"ref":"modules/esm/console.js:420-483","code":"  420 |     #formatter(args) {\n  421 |         // The initial formatting string is the first arg\n  422 |         let target = args[0];\n  423 | \n  424 |         if (args.length === 1)\n  425 |             return target;\n  426 | \n  427 |         const current = args[1];\n  428 | \n  429 |         // Find the index of the first format specifier.\n  430 |         const specifierIndex = specifierTest.exec(target).index;\n  431 |         const specifier = target.slice(specifierIndex, specifierIndex + 2);\n  432 |         let converted = null;\n  433 |         switch (specifier) {\n  434 |         case '%s':\n  435 |             converted = String(current);\n  436 |             break;\n  437 |         case '%d':\n  438 |         case '%i':\n  439 |             if (typeof current === 'symbol')\n  440 |                 converted = Number.NaN;\n  441 |             else\n  442 |                 converted = parseInt(current, 10);\n  443 |             break;\n  444 |         case '%f':\n  445 |             if (typeof current === 'symbol')\n  446 |                 converted = Number.NaN;\n  447 |             else\n  448 |                 converted = parseFloat(current);\n  449 |             break;\n  450 |         case '%o':\n  451 |             converted = formatOptimally(current);\n  452 |             break;\n  453 |         case '%O':\n  454 |             converted = formatGenerically(current);\n  455 |             break;\n  456 |         case '%c':\n  457 |             converted = '';\n  458 |             break;\n  459 |         }\n  460 |         // If any of the previous steps set converted, replace the specifier in\n  461 |         // target with the converted value.\n  462 |         if (converted !== null) {\n  463 |             target =\n  464 |                 target.slice(0, specifierIndex) +\n  465 |                 converted +\n  466 |                 target.slice(specifierIndex + 2);\n  467 |         }\n  468 | \n  469 |         /**\n  470 |          * Create the next format input...\n  471 |          *\n  472 |          * @type {[string, ...any[]]}\n  473 |          */\n  474 |         const result = [target, ...args.slice(2)];\n  475 | \n  476 |         if (!hasFormatSpecifiers(target))\n  477 |             return result;\n  478 | \n  479 |         if (result.length === 1)\n  480 |             return result;\n  481 | \n  482 |         return this.#formatter(result);\n  483 |     }","lines":64,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/esm/console.js#L420-483"}]},
{"id":"LOGIC_40","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"console.js #printer derives the stack trace by matching the current file with /^[^@]*@(.*):\\d+:\\d+$/m against new Error().stack and then computing index = lastIndexOf(currentFile)+currentFile.length. If currentFile is undefined (stack format does not match, e.g. a future SpiderMonkey stack format or an empty stack), `stackTrace.lastIndexOf(undefined)` coerces to lastIndexOf('undefined') and `currentFile.length` throws a TypeError, breaking console.trace/warn/error entirely. There is no guard for the no-match case.","fix":"Guard for currentFile being undefined (bail out of stack-trace trimming if the regex does not match) before dereferencing .length and calling lastIndexOf.","locations":[{"ref":"modules/esm/console.js:562-572","code":"  562 |         let stackTrace = options?.stackTrace;\n  563 |         if (!stackTrace &&\n  564 |             (logLevel === 'trace' || severity <= GLib.LogLevelFlags.LEVEL_WARNING)) {\n  565 |             stackTrace = new Error().stack;\n  566 |             const currentFile = stackTrace.match(/^[^@]*@(.*):\\d+:\\d+$/m)?.at(1);\n  567 |             const index = stackTrace.lastIndexOf(currentFile) + currentFile.length;\n  568 | \n  569 |             stackTrace = stackTrace.substring(index).split('\\n');\n  570 |             // Remove the remainder of the first line\n  571 |             stackTrace.shift();\n  572 |         }","lines":11,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/esm/console.js#L562-572"}]},
{"id":"LOGIC_41","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"gi.js Gi.require: when version is requested and a different version is already loaded, it throws AFTER having already mutated gi.versions[namespace] = version (line 13) and accessed gi[namespace] (line 16). The rollback in the catch block (line 26) restores oldVersion, so this is handled - but the success path leaves gi.versions[namespace] set to the requested version even though the actually returned module is the previously-loaded one whose __version__ may differ only when version===undefined. When version===undefined no version check is performed at all, so requiring a namespace without a version silently accepts whatever version is already loaded, with no diagnostic.","fix":"This is mostly acceptable, but consider logging or documenting that require(ns) with no version returns whatever is already loaded; ensure gi.versions is not left pointing at an unloaded version on the success path.","locations":[{"ref":"modules/esm/gi.js:6-29","code":"    6 | const Gi = {\n    7 |     require(namespace, version = undefined) {\n    8 |         if (namespace === 'versions')\n    9 |             throw new Error('Cannot import namespace \"versions\", use the version parameter of Gi.require to specify versions.');\n   10 | \n   11 |         let oldVersion = gi.versions[namespace];\n   12 |         if (version !== undefined)\n   13 |             gi.versions[namespace] = version;\n   14 | \n   15 |         try {\n   16 |             const module = gi[namespace];\n   17 | \n   18 |             if (version !== undefined && version !== module.__version__) {\n   19 |                 throw new Error(`Version ${module.__version__} of GI module ${\n   20 |                     namespace} already loaded, cannot load version ${version}`);\n   21 |             }\n   22 | \n   23 |             return module;\n   24 |         } catch (error) {\n   25 |             // Roll back change to versions object if import failed\n   26 |             gi.versions[namespace] = oldVersion;\n   27 |             throw error;\n   28 |         }\n   29 |     },","lines":24,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/esm/gi.js#L6-29"}]},
{"id":"LOGIC_42","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"InternalModuleLoader.isInternal default returns false and ModuleLoader.isInternal matches by `s.startsWith(start) && s.endsWith(end)` where [start, end] = pattern.split('*'). For the pattern 'resource:///org/gnome/gjs/modules/esm/*.js', end is '.js', so ANY resource/file URI that merely starts with the esm directory prefix and ends with '.js' is treated as internal - including a user file placed under a path that shares the prefix. More importantly, a specifier whose resolved name contains a '/' (e.g. importing 'foo/bar') would substitute into the single '*' producing '.../esm/foo/bar.js' and still be flagged internal, granting it import.meta.importSync access.","fix":"Match the full glob more strictly (ensure the substituted segment contains no '/'), or compare against the exact resolved set of internal module URIs rather than prefix/suffix string matching.","locations":[{"ref":"modules/internal/loader.js:66-74","code":"   66 |     isInternal(uri) {\n   67 |         const s = uri.uri;\n   68 |         for (const internalURIPattern of this.moduleURIs) {\n   69 |             const [start, end] = internalURIPattern.split('*');\n   70 |             if (s.startsWith(start) && s.endsWith(end))\n   71 |                 return true;\n   72 |         }\n   73 |         return false;\n   74 |     }","lines":9,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/internal/loader.js#L66-74"},{"ref":"modules/internal/loader.js:49-59","code":"   49 |     buildInternalURIs(specifier) {\n   50 |         const {moduleURIs} = this;\n   51 |         const builtURIs = [];\n   52 | \n   53 |         for (const uri of moduleURIs) {\n   54 |             const builtURI = uri.replace('*', specifier);\n   55 |             builtURIs.push(builtURI);\n   56 |         }\n   57 | \n   58 |         return builtURIs;\n   59 |     }","lines":11,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/internal/loader.js#L49-59"}]},
{"id":"LOGIC_43","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"GObjectInterface.prototype._init in _legacy.js deletes params.Signals then calls Interface.prototype._init, then _createSignals(this.$gtype, signals). If params.Signals was undefined, signals is undefined and _createSignals iterates `for (let signalName in signals)` over undefined - in non-strict legacy code for-in over undefined is a no-op, but this relies on that quirk. The sibling GObjectMeta._init guards with `if (signals)` (line 467) before calling _createSignals, so the two code paths are inconsistent and the interface path is fragile.","fix":"Guard the interface path the same way: only call _createSignals(this.$gtype, signals) when signals is defined, matching GObjectMeta._init.","locations":[{"ref":"modules/script/_legacy.js:634-641","code":"  634 |     GObjectInterface.prototype._init = function (params) {\n  635 |         let signals = params.Signals;\n  636 |         delete params.Signals;\n  637 | \n  638 |         Interface.prototype._init.call(this, params);\n  639 | \n  640 |         _createSignals(this.$gtype, signals);\n  641 |     };","lines":8,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/script/_legacy.js#L634-641"},{"ref":"modules/script/_legacy.js:420-434","code":"  420 |     function _createSignals(gtype, signals) {\n  421 |         for (let signalName in signals) {\n  422 |             let obj = signals[signalName];\n  423 |             let flags = obj.flags !== undefined ? obj.flags : GObject.SignalFlags.RUN_FIRST;\n  424 |             let accumulator = obj.accumulator !== undefined ? obj.accumulator : GObject.AccumulatorType.NONE;\n  425 |             let rtype = obj.return_type !== undefined ? obj.return_type : GObject.TYPE_NONE;\n  426 |             let paramtypes = obj.param_types !== undefined ? obj.param_types : [];\n  427 | \n  428 |             try {\n  429 |                 obj.signal_id = Gi.signal_new(gtype, signalName, flags, accumulator, rtype, paramtypes);\n  430 |             } catch (e) {\n  431 |                 throw new TypeError(`Invalid signal ${signalName}: ${e.message}`);\n  432 |             }\n  433 |         }\n  434 |     }","lines":15,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/script/_legacy.js#L420-434"}]},
{"id":"LOGIC_44","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"_gettext.js has a stale FIXME comment ('missing dcngettext ?') indicating an intentionally unimplemented function, and dcgettext is exposed but there is no dcngettext, so category-specific plural translations are unavailable. Either implement dcngettext or remove the dangling FIXME.","fix":"Add dcngettext wrapping GLib.dcngettext if available, or remove the FIXME and document the omission.","locations":[{"ref":"modules/core/_gettext.js:50-53","code":"   50 | function dngettext(dom, msgid1, msgid2, n) {\n   51 |     return GLib.dngettext(dom, msgid1, msgid2, n);\n   52 | }\n   53 | // FIXME: missing dcngettext ?","lines":4,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/core/_gettext.js#L50-53"}]},
{"id":"LOGIC_45","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"gjs_print_parse_args() returns true (success) but overwrites the whole buffer with \"<invalid string>\" the moment any single argument fails JS::ToString, discarding all previously-accumulated and any subsequent arguments. A failure to stringify the 3rd of 5 args therefore prints only \"<invalid string>\" rather than marking just that argument. Minor, but surprising for print()/printerr().","fix":"Append a placeholder token (e.g. \"<invalid string>\") for the offending argument and continue, preserving the other arguments, rather than replacing the entire buffer.","locations":[{"ref":"modules/print.cpp:111-114","code":"  111 |         } else {\n  112 |             *buffer = \"<invalid string>\";\n  113 |             return true;\n  114 |         }","lines":4,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/print.cpp#L111-114"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"easy","description":"gjs_type_get_element_size() returns the wrong node size for linked lists: GI_TYPE_TAG_GLIST returns sizeof(GSList) and GI_TYPE_TAG_GSLIST returns sizeof(GList). The two cases are swapped. GList nodes are larger than GSList nodes (3 pointers vs 2), so this miscomputes element sizes used to allocate/iterate flat arrays whose elements are lists, leading to wrong stride and potential OOB reads/writes or memory corruption.","fix":"Swap the two return values: GI_TYPE_TAG_GLIST should return sizeof(GList) and GI_TYPE_TAG_GSLIST should return sizeof(GSList).","locations":[{"ref":"gi/arg.cpp:914-917","code":"  914 |         case GI_TYPE_TAG_GLIST:\n  915 |             return sizeof(GSList);\n  916 |         case GI_TYPE_TAG_GSLIST:\n  917 |             return sizeof(GList);","lines":4,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/arg.cpp#L914-917"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"The error message prints the address of the local JS::RootedObject handle (&target_obj), not the address of the object the user passed. Every failure will print a meaningless stack address instead of the object pointer the message claims to show.","fix":"Use target_obj.get() instead of &target_obj: gjs_throw(cx, \"Object %p is not a GObject\", target_obj.get());","locations":[{"ref":"modules/system.cpp:70","code":"   70 |         gjs_throw(cx, \"Object %p is not a GObject\", &target_obj);","lines":1,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/system.cpp#L70"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"gjs_register_type() does not null-check the result of gjs_lookup_private_namespace(cx) before passing it to ObjectPrototype::define_class(), whereas the three sibling functions gjs_register_interface(), gjs_register_interface_with_class(), and gjs_register_type_with_class() all do check and bail out. gjs_lookup_private_namespace() can return nullptr (with a pending exception), and create_class() only asserts g_assert(in_object), which is a no-op in release builds with assertions disabled. The result is that a pending exception is swallowed and a null `module` is used as the in_object.","fix":"After `JS::RootedObject module(cx, gjs_lookup_private_namespace(cx));` add `if (!module) return false;` (matching the other three call sites) before calling ObjectPrototype::define_class().","locations":[{"ref":"gi/private.cpp:415-420","code":"  415 |     JS::RootedObject module(cx, gjs_lookup_private_namespace(cx));\n  416 |     JS::RootedObject constructor(cx), prototype(cx);\n  417 |     if (!ObjectPrototype::define_class(cx, module, Nothing{}, instance_type,\n  418 |                                        iface_types, n_interfaces, &constructor,\n  419 |                                        &prototype))\n  420 |         return false;","lines":6,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/private.cpp#L415-420"},{"ref":"gi/private.cpp:272-274","code":"  272 |     JS::RootedObject module(cx, gjs_lookup_private_namespace(cx));\n  273 |     if (!module)\n  274 |         return false;  // error will have been thrown already","lines":3,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/private.cpp#L272-274"},{"ref":"gi/private.cpp:453-455","code":"  453 |     JS::RootedObject module(cx, gjs_lookup_private_namespace(cx));\n  454 |     if (!module)\n  455 |         return false;","lines":3,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/private.cpp#L453-455"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"register_non_module_sourcemap() ignores all failures. JS_NewStringCopyZ can return null (OOM) and JS::Call can fail, but neither return value is checked: script_str/file_name_str are stored into the args array unconditionally (a null JSString would be set into a Value), and the JS::Call return value is discarded. On OOM or a throwing populateSourceMap this silently leaves a pending exception on m_cx, which then propagates into the following eval()/eval_with_scope() path where eval_with_scope() bails out with the misleading warning 'eval_with_scope() called with a pending exception'.","fix":"Check JS_NewStringCopyZ results for null and check the JS::Call return value; on failure either clear the exception (source maps are best-effort) or propagate it cleanly, so it does not leak into the subsequent eval().","locations":[{"ref":"gjs/context.cpp:1490-1520","code":" 1490 | void GjsContextPrivate::register_non_module_sourcemap(const char* script,\n 1491 |                                                       const char* filename) {\n 1492 |     using AutoURI = Gjs::AutoPointer<GUri, GUri, g_uri_unref>;\n 1493 |     Gjs::AutoMainRealm ar{this};\n 1494 | \n 1495 |     JS::RootedObject global{m_cx, JS::CurrentGlobalOrNull(m_cx)};\n 1496 |     JS::RootedValue v_loader{\n 1497 |         m_cx, gjs_get_global_slot(global, GjsGlobalSlot::MODULE_LOADER)};\n 1498 |     g_assert(v_loader.isObject());\n 1499 |     JS::RootedObject v_loader_obj{m_cx, &v_loader.toObject()};\n 1500 | \n 1501 |     JS::RootedValueArray<3> args{m_cx};\n 1502 |     JS::RootedString script_str{m_cx, JS_NewStringCopyZ(m_cx, script)};\n 1503 |     JS::RootedString file_name_str{m_cx, JS_NewStringCopyZ(m_cx, filename)};\n 1504 |     args[0].setString(script_str);\n 1505 |     args[1].setString(file_name_str);\n 1506 | \n 1507 |     // if the file uri is not an absolute uri with a scheme, build one assuming\n 1508 |     // file:// this parameter is used to help locate non-inlined source map file\n 1509 |     AutoURI uri = g_uri_parse(filename, G_URI_FLAGS_NONE, nullptr);\n 1510 |     if (!uri) {\n 1511 |         Gjs::AutoUnref<GFile> file = g_file_new_for_path(filename);\n 1512 |         Gjs::AutoChar file_uri = g_file_get_uri(file);\n 1513 |         JS::RootedString abs_filename_scheme_str{\n 1514 |             m_cx, JS_NewStringCopyZ(m_cx, file_uri.get())};\n 1515 |         args[2].setString(abs_filename_scheme_str);\n 1516 |     }\n 1517 | \n 1518 |     JS::RootedValue ignored{m_cx};\n 1519 |     JS::Call(m_cx, v_loader_obj, \"populateSourceMap\", args, &ignored);\n 1520 | }","lines":31,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/context.cpp#L1490-1520"},{"ref":"gjs/context.cpp:1739-1743","code":" 1739 |     // log and clear exception if it's set (should not be, normally...)\n 1740 |     if (JS_IsExceptionPending(m_cx)) {\n 1741 |         g_warning(\"eval_with_scope() called with a pending exception\");\n 1742 |         return false;\n 1743 |     }","lines":5,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/context.cpp#L1739-1743"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"import_module_init() swallows G_IO_ERROR_NOT_DIRECTORY and G_IO_ERROR_NOT_FOUND as 'no __init__.js, that's fine'. But it also treats G_IO_ERROR_IS_DIRECTORY the same way. If __init__.js exists but is itself a directory (or any of these errors arises for a path that genuinely is the init file), the failure is silently ignored and load returns success with an empty module object, masking a real misconfiguration. More importantly, errors other than these three (e.g. permission denied, I/O error) are correctly thrown, but a permission error on __init__.js will abort the entire directory import rather than being skippable, which is inconsistent with how a missing file is handled.","fix":"Reconsider which g_error_matches cases should be silently ignored; at minimum document why IS_DIRECTORY is swallowed, and consider whether permission/I/O errors on an optional __init__.js should block the whole import.","locations":[{"ref":"gjs/importer.cpp:295-305","code":"  295 |     if (!g_file_load_contents(file, nullptr, script.out(), &script_len, nullptr,\n  296 |                               &error)) {\n  297 |         if (!g_error_matches(error, G_IO_ERROR, G_IO_ERROR_IS_DIRECTORY) &&\n  298 |             !g_error_matches(error, G_IO_ERROR, G_IO_ERROR_NOT_DIRECTORY) &&\n  299 |             !g_error_matches(error, G_IO_ERROR, G_IO_ERROR_NOT_FOUND)) {\n  300 |             gjs_throw_gerror_message(cx, error);\n  301 |             return false;\n  302 |         }\n  303 | \n  304 |         return true;\n  305 |     }","lines":11,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/importer.cpp#L295-305"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"gjs_internal_resolve_relative_resource_or_file() calls g_uri_resolve_relative() with a nullptr GError and never checks whether output_uri is null. g_uri_resolve_relative() returns nullptr on a malformed base URI or relative path. The null output_uri is then passed to gjs_uri_object(), which calls g_uri_parse(nullptr, ...) -> undefined behavior / crash, instead of producing a clean JS exception.","fix":"Pass a GError out-param to g_uri_resolve_relative() and, if it returns nullptr, throw an ImportError describing the failure instead of forwarding nullptr to gjs_uri_object().","locations":[{"ref":"gjs/internal.cpp:430-442","code":"  430 | bool gjs_internal_resolve_relative_resource_or_file(JSContext* cx,\n  431 |                                                     unsigned argc,\n  432 |                                                     JS::Value* vp) {\n  433 |     JS::CallArgs args = JS::CallArgsFromVp(argc, vp);\n  434 |     JS::UniqueChars uri, relative_path;\n  435 |     if (!gjs_parse_call_args(cx, \"resolveRelativeResourceOrFile\", args, \"ss\",\n  436 |                              \"uri\", &uri, \"relativePath\", &relative_path))\n  437 |         return handle_wrong_args(cx);\n  438 | \n  439 |     Gjs::AutoChar output_uri{g_uri_resolve_relative(\n  440 |         uri.get(), relative_path.get(), G_URI_FLAGS_NONE, nullptr)};\n  441 | \n  442 |     return gjs_uri_object(cx, output_uri.get(), args.rval());","lines":13,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/internal.cpp#L430-442"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"Null-pointer dereference in exception_to_string(). When the exception is an InternalError, JS_ErrorFromException(cx, exc_obj) is called and its result `report` is dereferenced via `report->message()` without checking for null. JS_ErrorFromException can return nullptr (e.g. if the object is not actually backed by an error report), which would crash while trying to format an exception for logging - precisely a low-resource/edge situation.","fix":"Guard with `if (report && report->message()) return JS_NewStringCopyUTF8Z(cx, report->message());` and fall through to a generic string / JS::ToString when report is null.","locations":[{"ref":"gjs/jsapi-util.cpp:235-246","code":"  235 | static JSString* exception_to_string(JSContext* cx, JS::HandleValue exc) {\n  236 |     if (exc.isObject()) {\n  237 |         JS::RootedObject exc_obj(cx, &exc.toObject());\n  238 |         const JSClass* internal_error =\n  239 |             js::ProtoKeyToClass(JSProto_InternalError);\n  240 |         if (JS_InstanceOf(cx, exc_obj, internal_error, nullptr)) {\n  241 |             JSErrorReport* report = JS_ErrorFromException(cx, exc_obj);\n  242 |             if (!report->message())\n  243 |                 return JS_NewStringCopyZ(cx, \"(unknown internal error)\");\n  244 |             return JS_NewStringCopyUTF8Z(cx, report->message());\n  245 |         }\n  246 |     }","lines":12,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/jsapi-util.cpp#L235-246"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"gjs_module_load() and gjs_module_resolve() assert (g_assert) that the loader hook returned a JS object: 'g_assert(result.isObject() && \"Module hook failed to return an object!\")'. Since g_assert can be compiled out (G_DISABLE_ASSERT) and even when present aborts the whole process, a JS-side loader returning a non-object (a programming error in modules/internal/loader.js, but reachable) crashes the process instead of producing a catchable error. In a release build with assertions disabled, &result.toObject() on a non-object is undefined behavior.","fix":"Replace the assert with a real check that throws a JS error (or returns nullptr) when the hook result is not an object, so it is handled rather than aborting / invoking UB.","locations":[{"ref":"gjs/module.cpp:378-382","code":"  378 |     if (!JS::Call(cx, loader, \"moduleLoadHook\", args, &result))\n  379 |         return nullptr;\n  380 | \n  381 |     g_assert(result.isObject() && \"Module hook failed to return an object!\");\n  382 |     return &result.toObject();","lines":5,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/module.cpp#L378-382"},{"ref":"gjs/module.cpp:563-567","code":"  563 |     if (!JS::Call(cx, loader, \"moduleResolveHook\", args, &result))\n  564 |         return nullptr;\n  565 | \n  566 |     g_assert(result.isObject() && \"resolve hook failed to return an object!\");\n  567 |     return &result.toObject();","lines":5,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/module.cpp#L563-567"}]},
{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"In the region binary-operation macro, CairoRegion::for_js(cx, other_obj) can return nullptr (wrong class / no private data) WITHOUT setting a pending JS exception, yet the result is passed straight into cairo_region_union/subtract/intersect/xor. Passing a null region to these cairo functions yields undefined/garbage behavior and the user gets no meaningful error. Every other cairo binding in this slice null-checks the for_js result and returns false; this macro does not.","fix":"After `cairo_region_t* other_region = CairoRegion::for_js(cx, other_obj);` add `if (!other_region) { gjs_throw(cx, \"other region is not a Cairo.Region\"); return false; }` before calling cairo_region_##method. Better, use for_js_typecheck so a proper exception is thrown.","locations":[{"ref":"modules/cairo-region.cpp:47-61","code":"   47 | #define REGION_DEFINE_REGION_FUNC(method)                                    \\\n   48 |     GJS_JSAPI_RETURN_CONVENTION                                              \\\n   49 |     static bool method##_func(JSContext* cx, unsigned argc, JS::Value* vp) { \\\n   50 |         PRELUDE;                                                             \\\n   51 |         JS::RootedObject other_obj{cx};                                      \\\n   52 |         if (!gjs_parse_call_args(cx, #method, argv, \"o\", \"other_region\",     \\\n   53 |                                  &other_obj))                                \\\n   54 |             return false;                                                    \\\n   55 |                                                                              \\\n   56 |         cairo_region_t* other_region = CairoRegion::for_js(cx, other_obj);   \\\n   57 |                                                                              \\\n   58 |         cairo_region_##method(this_region, other_region);                    \\\n   59 |         argv.rval().setUndefined();                                          \\\n   60 |         RETURN_STATUS;                                                       \\\n   61 |     }","lines":15,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/cairo-region.cpp#L47-61"}]},
{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In gjs_array_from_g_value_array(), the else branch calls g_assert_not_reached() followed by gjs_throw()/return false. With assertions enabled (normal builds) the g_assert_not_reached() aborts the process for what is a recoverable 'not an array type' condition; the throw/return after it is dead code. Receiving a GValue of an unexpected type from C should not abort.","fix":"Drop the g_assert_not_reached() (or convert to a debug-only warning) and keep the gjs_throw()/return false path so unexpected GValue types are reported as JS exceptions rather than aborting.","locations":[{"ref":"gi/arg.cpp:2654-2658","code":" 2654 |     } else {\n 2655 |         g_assert_not_reached();\n 2656 |         gjs_throw(cx, \"%s is not an array type\", g_type_name(value_gtype));\n 2657 |         return false;\n 2658 |     }","lines":5,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/arg.cpp#L2654-2658"}]},
{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"gjs_foreign_load_foreign_module() sets entry->second = Loaded only on success, but on the eval failure path it logs g_critical and returns false without resetting state, which is correct; however foreign_modules and foreign_structs_table are process-global mutable std::unordered_maps accessed without synchronization. The closure/marshal paths already guard against non-owner-thread callbacks, but gjs_struct_foreign_register() (called at module init) mutating the same global table concurrently with lookups is not guarded. In multi-context/multi-thread embeddings this is a data race.","fix":"Document the single-threaded-owner assumption explicitly, or guard the global tables with the GJS owner-thread assertion / a lock if registration can occur off the owner thread.","locations":[{"ref":"gi/foreign.cpp:27-39","code":"   27 | static std::unordered_map<std::string, LoadedStatus> foreign_modules{\n   28 |     {\"cairo\", NotLoaded}};\n   29 | \n   30 | using StructID = std::pair<std::string, std::string>;\n   31 | struct StructIDHash {\n   32 |     [[nodiscard]]\n   33 |     size_t operator()(const StructID& val) const {\n   34 |         std::hash<std::string> hasher;\n   35 |         return hasher(val.first) ^ hasher(val.second);\n   36 |     }\n   37 | };\n   38 | static std::unordered_map<StructID, GjsForeignInfo*, StructIDHash>\n   39 |     foreign_structs_table;","lines":13,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/foreign.cpp#L27-39"},{"ref":"gi/foreign.cpp:65-68","code":"   65 | void gjs_struct_foreign_register(const char* gi_namespace,\n   66 |                                  const char* type_name, GjsForeignInfo* info) {\n   67 |     foreign_structs_table.insert({{gi_namespace, type_name}, info});\n   68 | }","lines":4,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/foreign.cpp#L65-68"}]},
{"id":"ERR_10","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"FundamentalPrototype::resolve_impl() defines the method and sets *resolved=true, then unconditionally calls resolve_interface(), which iterates over all implemented interfaces and may call gjs_define_function() again for an interface method with the same name, redefining a property already defined on the prototype. When a method is found on the object itself, the interface scan is unnecessary work and risks a duplicate define.","fix":"Return early (after setting *resolved=true) when the method was found and defined on the object itself, rather than falling through to resolve_interface().","locations":[{"ref":"gi/fundamental.cpp:127-156","code":"  127 |     Maybe<GI::AutoFunctionInfo> method_info{info().method(prop_name.get())};\n  128 | \n  129 |     if (method_info) {\n  130 |         method_info->log_usage();\n  131 |         if (method_info->is_method()) {\n  132 |             // we do not define deprecated methods in the prototype\n  133 |             if (method_info->is_deprecated()) {\n  134 |                 gjs_debug(GJS_DEBUG_GFUNDAMENTAL,\n  135 |                           \"Ignoring definition of deprecated method %s in \"\n  136 |                           \"prototype %s\",\n  137 |                           method_info->name(), format_name().c_str());\n  138 |                 *resolved = false;\n  139 |                 return true;\n  140 |             }\n  141 | \n  142 |             gjs_debug(GJS_DEBUG_GFUNDAMENTAL,\n  143 |                       \"Defining method %s in prototype for %s\",\n  144 |                       method_info->name(), format_name().c_str());\n  145 | \n  146 |             if (!gjs_define_function(cx, obj, gtype(), *method_info))\n  147 |                 return false;\n  148 | \n  149 |             *resolved = true;\n  150 |         }\n  151 |     } else {\n  152 |         *resolved = false;\n  153 |     }\n  154 | \n  155 |     return resolve_interface(cx, obj, resolved, prop_name.get());\n  156 | }","lines":30,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/fundamental.cpp#L127-156"}]},
{"id":"ERR_11","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"Inconsistent exception logging between the GObject property accessors in gobject.cpp. gjs_object_set_gproperty() logs a failed set with gjs_log_exception_uncaught(), but gjs_object_get_gproperty() logs the conversion failure with gjs_log_exception() (and the property fetch failure with gjs_log_exception_uncaught()). The two paths should use the same uncaught-vs-caught convention; using gjs_log_exception() here may swallow an exception that should be surfaced as uncaught.","fix":"Decide on one convention (most other callbacks here use gjs_log_exception_uncaught) and apply it consistently in gjs_object_get_gproperty().","locations":[{"ref":"gi/gobject.cpp:243-244","code":"  243 |     if (!gjs_value_to_g_value(cx, jsvalue, value))\n  244 |         gjs_log_exception(cx);","lines":2,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/gobject.cpp#L243-244"},{"ref":"gi/gobject.cpp:218-219","code":"  218 |     if (!jsobj_set_gproperty(cx, js_obj, value, pspec))\n  219 |         gjs_log_exception_uncaught(cx);","lines":2,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/gobject.cpp#L218-219"}]},
{"id":"ERR_12","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"gjs_signal_new() treats the `params` argument as an array via JS::GetArrayLength() without first verifying it is actually an array (it is parsed only as a generic object 'o'). GetArrayLength on a non-array object reads its `length` property and does not raise the expected 'expected Array' error, unlike validate_interfaces_and_properties_args() which does the IsArrayObject check for the register_* functions. A non-array object would silently produce a bogus parameter count instead of a clear error.","fix":"Validate params_obj with JS::IsArrayObject() and throw a descriptive error before calling JS::GetArrayLength(), consistent with validate_interfaces_and_properties_args().","locations":[{"ref":"gi/private.cpp:509-511","code":"  509 |     uint32_t n_parameters;\n  510 |     if (!JS::GetArrayLength(cx, params_obj, &n_parameters))\n  511 |         return false;","lines":3,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/private.cpp#L509-511"},{"ref":"gi/private.cpp:101-123","code":"  101 | static bool validate_interfaces_and_properties_args(JSContext* cx,\n  102 |                                                     JS::HandleObject interfaces,\n  103 |                                                     JS::HandleObject properties,\n  104 |                                                     uint32_t* n_interfaces,\n  105 |                                                     uint32_t* n_properties) {\n  106 |     bool is_array;\n  107 |     if (!JS::IsArrayObject(cx, interfaces, &is_array))\n  108 |         return false;\n  109 |     if (!is_array) {\n  110 |         gjs_throw(cx, \"Invalid parameter interfaces (expected Array)\");\n  111 |         return false;\n  112 |     }\n  113 | \n  114 |     uint32_t n_int;\n  115 |     if (!JS::GetArrayLength(cx, interfaces, &n_int))\n  116 |         return false;\n  117 | \n  118 |     if (!JS::IsArrayObject(cx, properties, &is_array))\n  119 |         return false;\n  120 |     if (!is_array) {\n  121 |         gjs_throw(cx, \"Invalid parameter properties (expected Array)\");\n  122 |         return false;\n  123 |     }","lines":23,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/private.cpp#L101-123"}]},
{"id":"ERR_13","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"gjs_define_private_gi_stuff() sets module.set(JS_NewPlainObject(cx)) and then immediately calls JS_DefineFunctions/JS_DefineProperties on it without checking for null. If the allocation fails (OOM), module is null and the subsequent JSAPI calls operate on a null object handle.","fix":"Check the result: `module.set(JS_NewPlainObject(cx)); if (!module) return false;` before defining functions and properties.","locations":[{"ref":"gi/private.cpp:628-633","code":"  628 | bool gjs_define_private_gi_stuff(JSContext* cx,\n  629 |                                  JS::MutableHandleObject module) {\n  630 |     module.set(JS_NewPlainObject(cx));\n  631 |     return JS_DefineFunctions(cx, module, private_module_funcs) &&\n  632 |            JS_DefineProperties(cx, module, private_module_props);\n  633 | }","lines":6,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/private.cpp#L628-633"}]},
{"id":"ERR_14","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In Closure::marshal(), if the JS callback returns undefined while return_value != nullptr, the GValue is left uninitialized and the function returns without setting it. The code comment itself flags this (\"not sure what happens on the other side with an uninitialized GValue\"). A C caller that reads the return GValue then observes an uninitialized/garbage value, which can lead to undefined behavior in the emitting signal machinery.","fix":"When return_value is provided and the result is undefined (and no exception), initialize the GValue to a defined default for its type (the GValue already carries its GType), rather than leaving it untouched.","locations":[{"ref":"gi/value.cpp:427-444","code":"  427 |     // null return_value means the closure wasn't expected to return a value.\n  428 |     // Discard the JS function's return value in that case.\n  429 |     if (return_value != nullptr) {\n  430 |         if (rval.isUndefined()) {\n  431 |             // Either an exception was thrown and logged, or the JS function\n  432 |             // returned undefined. Leave the GValue uninitialized.\n  433 |             // FIXME: not sure what happens on the other side with an\n  434 |             // uninitialized GValue!\n  435 |             return;\n  436 |         }\n  437 | \n  438 |         if (!gjs_value_to_g_value(m_cx, rval, return_value)) {\n  439 |             gjs_debug(GJS_DEBUG_GCLOSURE,\n  440 |                       \"Unable to convert return value when invoking closure\");\n  441 |             gjs_log_exception(m_cx);\n  442 |             return;\n  443 |         }\n  444 |     }","lines":18,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/value.cpp#L427-444"}]},
{"id":"ERR_15","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In gjs_context_constructed(), gjs_create_js_context() failure triggers g_error('Failed to create javascript context') which aborts the process. Since GjsContext is a public GObject created with g_object_new(), an OOM or context-creation failure cannot be reported to the caller and instead kills the whole application. Same pattern repeats throughout the constructor with g_error on every bootstrap step.","fix":"Where feasible, propagate construction failure via a GError/initable interface (e.g. GInitable) instead of aborting, so embedders can handle JS engine init failures gracefully.","locations":[{"ref":"gjs/context.cpp:513-517","code":"  513 |     JSContext* cx = gjs_create_js_context(gjs_location);\n  514 |     if (!cx)\n  515 |         g_error(\"Failed to create javascript context\");\n  516 | \n  517 |     new (gjs_location) GjsContextPrivate(cx, self);","lines":5,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/context.cpp#L513-517"},{"ref":"gjs/context.cpp:685-771","code":"  685 |     if (!internal_global) {\n  686 |         gjs_log_exception(m_cx);\n  687 |         g_error(\"Failed to initialize internal global object\");\n  688 |     }\n  689 | \n  690 |     m_internal_global = internal_global;\n  691 |     Gjs::AutoInternalRealm ar{this};\n  692 |     JS_AddExtraGCRootsTracer(m_cx, &GjsContextPrivate::trace, this);\n  693 | \n  694 |     if (!m_atoms->init_atoms(m_cx)) {\n  695 |         gjs_log_exception(m_cx);\n  696 |         g_error(\"Failed to initialize global strings\");\n  697 |     }\n  698 | \n  699 |     if (!gjs_define_global_properties(m_cx, internal_global,\n  700 |                                       GjsGlobalType::INTERNAL,\n  701 |                                       \"GJS internal global\", \"nullptr\")) {\n  702 |         gjs_log_exception(m_cx);\n
