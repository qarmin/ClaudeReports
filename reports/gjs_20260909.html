 703 |         g_error(\"Failed to define properties on internal global object\");\n  704 |     }\n  705 | \n  706 |     JS::RootedObject global(\n  707 |         m_cx,\n  708 |         gjs_create_global_object(cx, GjsGlobalType::DEFAULT, internal_global));\n  709 | \n  710 |     if (!global) {\n  711 |         gjs_log_exception(m_cx);\n  712 |         g_error(\"Failed to initialize global object\");\n  713 |     }\n  714 | \n  715 |     m_global = global;\n  716 | \n  717 |     {\n  718 |         Gjs::AutoMainRealm ar{this};\n  719 | \n  720 |         std::vector<std::string> paths;\n  721 |         if (m_search_path)\n  722 |             paths = {m_search_path,\n  723 |                      m_search_path + g_strv_length(m_search_path)};\n  724 |         JS::RootedObject importer(m_cx, gjs_create_root_importer(m_cx, paths));\n  725 |         if (!importer) {\n  726 |             gjs_log_exception(cx);\n  727 |             g_error(\"Failed to create root importer\");\n  728 |         }\n  729 | \n  730 |         g_assert(\n  731 |             gjs_get_global_slot(global, GjsGlobalSlot::IMPORTS).isUndefined() &&\n  732 |             \"Someone else already created root importer\");\n  733 | \n  734 |         gjs_set_global_slot(global, GjsGlobalSlot::IMPORTS,\n  735 |                             JS::ObjectValue(*importer));\n  736 | \n  737 |         if (!gjs_define_global_properties(m_cx, global, GjsGlobalType::DEFAULT,\n  738 |                                           \"GJS\", \"default\")) {\n  739 |             gjs_log_exception(m_cx);\n  740 |             g_error(\"Failed to define properties on global object\");\n  741 |         }\n  742 |     }\n  743 | \n  744 |     JS::SetModuleResolveHook(rt, gjs_module_resolve);\n  745 |     JS::SetModuleDynamicImportHook(rt, gjs_dynamic_module_resolve);\n  746 |     JS::SetModuleMetadataHook(rt, gjs_populate_module_meta);\n  747 | \n  748 |     if (!JS_DefineProperty(m_cx, internal_global, \"moduleGlobalThis\", global,\n  749 |                            JSPROP_PERMANENT)) {\n  750 |         gjs_log_exception(m_cx);\n  751 |         g_error(\"Failed to define module global in internal global.\");\n  752 |     }\n  753 | \n  754 |     if (!gjs_load_internal_module(cx, \"internalLoader\")) {\n  755 |         gjs_log_exception(cx);\n  756 |         g_error(\"Failed to load internal module loaders.\");\n  757 |     }\n  758 | \n  759 |     load_context_module(cx,\n  760 |                         \"resource:///org/gnome/gjs/modules/internal/loader.js\",\n  761 |                         \"module loader\");\n  762 | \n  763 |     {\n  764 |         Gjs::AutoMainRealm ar{this};\n  765 |         load_context_module(\n  766 |             cx, \"resource:///org/gnome/gjs/modules/esm/_bootstrap/default.js\",\n  767 |             \"ESM bootstrap\");\n  768 |     }\n  769 | \n  770 |     [[maybe_unused]] bool success = m_main_loop.spin(this);\n  771 |     g_assert(success && \"bootstrap should not call system.exit()\");","lines":87,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/context.cpp#L685-771"}]},
{"id":"ERR_16","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In gjs_warn_deprecated_once_per_callsite, the 'excess args' diagnostic prints `nargs_given` as the count of excess args, but nargs_given is the total number of args supplied, not the number of excess (unconsumed) ones. The message reads e.g. \"Excess 3 format args passed\" even when only 1 was excess. Misleading diagnostic.","fix":"Print the actual excess count: `nargs_given - args_ptr` instead of `nargs_given`.","locations":[{"ref":"gjs/deprecation.cpp:156-160","code":"  156 |     if (args_ptr != nargs_given) {\n  157 |         g_critical(\"Excess %zu format args passed for message ID %u\",\n  158 |                    nargs_given, unsigned{id});\n  159 |         return;\n  160 |     }","lines":5,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/deprecation.cpp#L156-160"}]},
{"id":"ERR_17","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"GjsInternalGlobal::create() and create_with_compartment() pass get_internal_principals() but never JS_HoldPrincipals it. The ModuleLoaderPrincipals::destroy callback (engine.cpp:165-170) asserts refcount==0 on destroy, implying the design intends refcount management. As written the singleton principal's refcount is never incremented, so the destroy-time refcount assertion is only ever trivially satisfied; if any code path ever did Hold/Drop the matched assert in destroy() would still abort because destroy is only meant for the singleton. This Hold/Drop omission is benign only because the principal is a static singleton, which is a fragile coupling worth documenting/asserting more explicitly.","fix":"Document that the singleton principal is deliberately never ref-counted, or add an explicit static-lifetime guarantee; consider asserting the singleton identity at create time too.","locations":[{"ref":"gjs/global.cpp:313-323","code":"  313 |     GJS_JSAPI_RETURN_CONVENTION\n  314 |     static JSObject* create(JSContext* cx) {\n  315 |         return GjsBaseGlobal::create(cx, &klass, {}, get_internal_principals());\n  316 |     }\n  317 | \n  318 |     GJS_JSAPI_RETURN_CONVENTION\n  319 |     static JSObject* create_with_compartment(JSContext* cx,\n  320 |                                              JS::HandleObject cmp_global) {\n  321 |         return GjsBaseGlobal::create_with_compartment(\n  322 |             cx, cmp_global, &klass, {}, get_internal_principals());\n  323 |     }","lines":11,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/global.cpp#L313-323"},{"ref":"gjs/engine.cpp:165-185","code":"  165 |  public:\n  166 |     static bool subsumes(JSPrincipals* first, JSPrincipals* second) {\n  167 |         return first == &the_principals || second != &the_principals;\n  168 |     }\n  169 | \n  170 |     static void destroy(JSPrincipals* principals [[maybe_unused]]) {\n  171 |         g_assert(principals == &the_principals &&\n  172 |                  \"Should not create other instances of ModuleLoaderPrinciples\");\n  173 |         g_assert(principals->refcount == 0 &&\n  174 |                  \"Mismatched JS_HoldPrincipals/JS_DropPrincipals\");\n  175 |     }\n  176 | \n  177 |     // Singleton\n  178 |     static ModuleLoaderPrincipals the_principals;\n  179 | };\n  180 | \n  181 | ModuleLoaderPrincipals ModuleLoaderPrincipals::the_principals{};\n  182 | \n  183 | JSPrincipals* get_internal_principals() {\n  184 |     return &ModuleLoaderPrincipals::the_principals;\n  185 | }","lines":21,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/engine.cpp#L165-185"}]},
{"id":"ERR_18","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In gjs_throw_abstract_constructor_error, if JS_GetPropertyById fails or `prototype` is not an object, `name` stays \"anonymous\" but the code still unconditionally calls `prototype.toObject()` inside the success branch. JS_GetPropertyById returning true does not guarantee the value is an object (a prototype could be null), so `prototype.toObject()` could assert/crash. The pending exception from a failing JS_GetPropertyById is also silently ignored.","fix":"Check `prototype.isObject()` before calling toObject(), and handle the false return of JS_GetPropertyById (clear or propagate) rather than assuming the property fetch succeeded.","locations":[{"ref":"gjs/jsapi-util.cpp:185-198","code":"  185 | void gjs_throw_abstract_constructor_error(JSContext* cx,\n  186 |                                           const JS::CallArgs& args) {\n  187 |     const char* name = \"anonymous\";\n  188 | \n  189 |     const GjsAtoms& atoms = GjsContextPrivate::atoms(cx);\n  190 |     JS::RootedObject callee{cx, &args.callee()};\n  191 |     JS::RootedValue prototype{cx};\n  192 |     if (JS_GetPropertyById(cx, callee, atoms.prototype(), &prototype)) {\n  193 |         const JSClass* proto_class = JS::GetClass(&prototype.toObject());\n  194 |         name = proto_class->name;\n  195 |     }\n  196 | \n  197 |     gjs_throw(cx, \"You cannot construct new instances of '%s'\", name);\n  198 | }","lines":14,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/jsapi-util.cpp#L185-198"}]},
{"id":"ERR_19","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"gjs_profiler_extract_maps parses /proc/self/maps lines into a fixed `char file[256]` with sscanf format \"%255s\". Lines with paths longer than 255 bytes are silently truncated, and the truncated (possibly nonexistent) path is then passed to sysprof_capture_writer_add_map. This yields incorrect symbol resolution for mappings with long path names rather than a clean failure or skip.","fix":"Detect truncation (e.g. check that the scanned token length is < buffer size, or parse the map line without a fixed bound) and either skip or handle long paths explicitly.","locations":[{"ref":"gjs/profiler.cpp:205-227","code":"  205 |         char file[256];\n  206 |         unsigned long start;\n  207 |         unsigned long end;\n  208 |         unsigned long offset;\n  209 |         unsigned long inode;\n  210 | \n  211 |         file[sizeof file - 1] = '\\0';\n  212 | \n  213 |         int r = sscanf(lines[ix], \"%lx-%lx %*15s %lx %*x:%*x %lu %255s\",\n  214 |                        &start, &end, &offset, &inode, file);\n  215 |         if (r != 5)\n  216 |             continue;\n  217 | \n  218 |         if (strcmp(\"[vdso]\", file) == 0) {\n  219 |             offset = 0;\n  220 |             inode = 0;\n  221 |         }\n  222 | \n  223 |         if (!sysprof_capture_writer_add_map(\n  224 |                 self->capture, now.time_since_epoch().count(), -1, self->pid,\n  225 |                 start, end, offset, inode, file))\n  226 |             return false;\n  227 |     }","lines":23,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/profiler.cpp#L205-227"}]},
{"id":"ERR_20","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"gjs_dbus_implementation_set_property() does not handle an unknown property_id. The switch has only PROP_G_INTERFACE_INFO and no default branch calling G_OBJECT_WARN_INVALID_PROPERTY_ID, and the pspec argument is silently discarded via (void)pspec. Any future property added without a case would be silently ignored with no warning.","fix":"Add a `default:` case calling G_OBJECT_WARN_INVALID_PROPERTY_ID(object, property_id, pspec); instead of voiding pspec.","locations":[{"ref":"libgjs-private/gjs-gdbus-wrapper.c:200-213","code":"  200 | static void gjs_dbus_implementation_set_property(GObject* object,\n  201 |                                                  unsigned property_id,\n  202 |                                                  const GValue* value,\n  203 |                                                  GParamSpec* pspec) {\n  204 |     GjsDBusImplementation* self = GJS_DBUS_IMPLEMENTATION(object);\n  205 | \n  206 |     switch ((GjsDBusImplementationProps)property_id) {\n  207 |         case PROP_G_INTERFACE_INFO:\n  208 |             self->ifaceinfo = (GDBusInterfaceInfo*)g_value_dup_boxed(value);\n  209 |             break;\n  210 |     }\n  211 | \n  212 |     (void)pspec;\n  213 | }","lines":14,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/libgjs-private/gjs-gdbus-wrapper.c#L200-213"}]},
{"id":"ERR_21","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"createFromPNG_func calls cairo_image_surface_create_from_png and then checks cairo_surface_status. cairo always returns a non-null surface here (a \"nil\" surface on error) so the null path is fine, but on the error path the nil surface is never destroyed: gjs_cairo_check_status returns false and the function returns without calling cairo_surface_destroy on the failed surface, leaking the cairo nil-surface error object's reference. (The same pattern in constructor_impl is fine because the returned pointer is adopted by the wrapper.)","fix":"On the failure branch (status != SUCCESS) call cairo_surface_destroy(surface) before returning false. Note cairo nil surfaces are statically allocated singletons so the leak is benign in practice, but the code is asymmetric with the success path which does destroy.","locations":[{"ref":"modules/cairo-image-surface.cpp:52-74","code":"   52 | GJS_JSAPI_RETURN_CONVENTION\n   53 | static bool createFromPNG_func(JSContext* cx, unsigned argc, JS::Value* vp) {\n   54 |     JS::CallArgs args = JS::CallArgsFromVp(argc, vp);\n   55 |     Gjs::AutoChar filename;\n   56 | \n   57 |     if (!gjs_parse_call_args(cx, \"createFromPNG\", args, \"F\", \"filename\",\n   58 |                              &filename))\n   59 |         return false;\n   60 | \n   61 |     cairo_surface_t* surface = cairo_image_surface_create_from_png(filename);\n   62 | \n   63 |     if (!gjs_cairo_check_status(cx, cairo_surface_status(surface), \"surface\"))\n   64 |         return false;\n   65 | \n   66 |     JSObject* surface_wrapper = CairoImageSurface::from_c_ptr(cx, surface);\n   67 |     if (!surface_wrapper)\n   68 |         return false;\n   69 | \n   70 |     cairo_surface_destroy(surface);\n   71 | \n   72 |     args.rval().setObject(*surface_wrapper);\n   73 |     return true;\n   74 | }","lines":23,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/cairo-image-surface.cpp#L52-74"}]},
{"id":"ERR_22","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"When pretty-print (JS::Call) fails, gjs_console_eval_and_print() logs the exception via gjs_log_exception(cx), then restores the saved exception state, and finally returns true. Returning true tells the caller that evaluation succeeded normally, so an uncatchable exception raised inside the pretty-printer would be swallowed rather than propagated. In practice pretty-print is internal JS so this is unlikely, but the success/failure contract documented in the function's own comment (false == uncatchable) is not honored for the print step.","fix":"If the pretty-print Call fails because of an uncatchable/pending exception that should terminate the REPL, propagate it (return false) rather than always returning true after printing \"[error printing value]\".","locations":[{"ref":"modules/console.cpp:260-277","code":"  260 |     JS::AutoSaveExceptionState exc_state(cx);\n  261 |     JS::RootedValue v_printed_string(cx);\n  262 |     JS::RootedValue v_pretty_print(\n  263 |         cx, gjs_get_global_slot(global, GjsGlobalSlot::PRETTY_PRINT_FUNC));\n  264 |     bool ok = JS::Call(cx, global, v_pretty_print, JS::HandleValueArray(result),\n  265 |                        &v_printed_string);\n  266 |     if (!ok)\n  267 |         gjs_log_exception(cx);\n  268 |     exc_state.restore();\n  269 | \n  270 |     if (ok) {\n  271 |         g_fprintf(stdout, \"%s\\n\",\n  272 |                   print_string_value(cx, v_printed_string).c_str());\n  273 |     } else {\n  274 |         g_fprintf(stdout, \"[error printing value]\\n\");\n  275 |     }\n  276 | \n  277 |     return true;","lines":18,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/console.cpp#L260-277"}]},
{"id":"ERR_23","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"_format.js vprintf: the '%d' case does `parseInt(getArg())` with no radix argument. A string argument beginning with '0x' would be parsed as hex, and a leading-zero string is parsed as decimal in modern engines but the intent is decimal integer conversion. Combined with the alternative-int (I) flag using Intl.NumberFormat on the parsed value, malformed inputs silently become NaN-derived output rather than a clear error. The '%x' case (line 59) similarly uses parseInt without radix on arbitrary input.","fix":"Pass an explicit radix 10 to parseInt for %d (parseInt(getArg(), 10)) and validate NaN, to make decimal parsing deterministic.","locations":[{"ref":"modules/core/_format.js:48-59","code":"   48 |         case 'd': {\n   49 |             let intV = parseInt(getArg());\n   50 |             if (hasAlternativeIntFlag) {\n   51 |                 numberFormatter ??= new Intl.NumberFormat();\n   52 |                 s = numberFormatter.format(intV);\n   53 |             } else {\n   54 |                 s = intV.toString();\n   55 |             }\n   56 |             break;\n   57 |         }\n   58 |         case 'x':\n   59 |             s = parseInt(getArg()).toString(16);","lines":12,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/core/_format.js#L48-59"}]},
{"id":"ERR_24","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"loader.js populateSourceMap swallows all errors with empty catch blocks (lines 156, 165). While the doc states it 'fails gracefully and not throw', a malformed inline base64 data URI or invalid JSON silently produces no source map and no diagnostic at any log level, making source-map debugging failures invisible. atob() on malformed base64 throws and is caught silently.","fix":"Keep failing gracefully but emit a debug-level log (e.g. via the internal logger) when source map parsing fails, so the failure is discoverable.","locations":[{"ref":"modules/internal/loader.js:144-166","code":"  144 |         let jsonText = null;\n  145 |         try {\n  146 |             // check if we have an inlined data uri\n  147 |             if (sourceMapUrl?.startsWith(DATA_URI_PREFIX)) {\n  148 |                 jsonText = atob(sourceMapUrl.substring(DATA_URI_PREFIX.length));\n  149 |             } else {\n  150 |                 // load the source map resource or file\n  151 |                 // resolve the source map file relative to the source file\n  152 |                 const sourceMapUri = resolveRelativeResourceOrFile(absoluteUri ?? uri,\n  153 |                     `./${sourceMapUrl}`);\n  154 |                 jsonText = this.loadURI(sourceMapUri);\n  155 |             }\n  156 |         } catch {}\n  157 | \n  158 |         if (jsonText) {\n  159 |             try {\n  160 |                 const sourceMapRegistry = getSourceMapRegistry(this.global);\n  161 |                 const sourceMap = JSON.parse(jsonText);\n  162 |                 const consumer = new SourceMapConsumer(sourceMap);\n  163 | \n  164 |                 sourceMapRegistry.set(uri, consumer);\n  165 |             } catch {}\n  166 |         }","lines":23,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/internal/loader.js#L144-166"}]},
{"id":"ERR_25","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"gjs_console_write_repl_history()/read_history() treat the readline return value as an errno and pass it to g_strerror(). readline's write_history()/read_history() return errno values, so this happens to work, but the warning is emitted unconditionally on any nonzero return for write_history (history.cpp), and for read_history a missing-file (ENOENT) on first run is reported as an error only when GJS_REPL_HISTORY is set. The write path has no such guard, so a transient failure spams a warning on every line entered.","fix":"Guard the write_history warning similarly (e.g. only warn once, or only when the path was explicitly configured), and confirm the returned value is actually an errno before formatting with g_strerror.","locations":[{"ref":"util/console.cpp:71-78","code":"   71 | void gjs_console_write_repl_history(const char* path) {\n   72 |     if (path) {\n   73 |         int err = write_history(path);\n   74 |         if (err != 0)\n   75 |             g_warning(\"Could not persist history to defined file %s: %s\", path,\n   76 |                       g_strerror(err));\n   77 |     }\n   78 | }","lines":8,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/util/console.cpp#L71-78"},{"ref":"modules/console.cpp:207-210","code":"  207 |     if ((*bufp)[0] != '\\0') {\n  208 |         add_history(bufp->c_str());\n  209 |         gjs_console_write_repl_history(repl_history_path);\n  210 |     }","lines":4,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/console.cpp#L207-210"}]},
{"id":"ERR_26","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"negligible","difficulty":"easy","description":"In the platform-specific Gio resolution branch, when `version` is null the error message format string \"Failed to require %s %s\" is passed version.get() (== nullptr) for the second %s. This is routed through g_strdup_vprintf which renders it as \"(null)\", so it is not undefined behavior, but the message is misleading (it claims to require a specific version when none was requested). The non-platform path just below handles this correctly with `version ? version.get() : \"none\"`.","fix":"Use the same guard as the general path: pass `version ? version.get() : \"none\"` in the platform-specific error message.","locations":[{"ref":"gi/repo.cpp:120-126","code":"  120 |         auto required = repo.require(platform_specific, version.get());\n  121 |         if (!required.isOk()) {\n  122 |             gjs_throw(cx, \"Failed to require %s %s: %s\",\n  123 |                       platform_specific.get(), version.get(),\n  124 |                       required.inspectErr()->message);\n  125 |             return false;\n  126 |         }","lines":7,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/repo.cpp#L120-126"},{"ref":"gi/repo.cpp:130-136","code":"  130 |     auto required = repo.require(ns_name.get(), version.get());\n  131 |     if (!required.isOk()) {\n  132 |         gjs_throw(cx, \"Requiring %s, version %s: %s\", ns_name.get(),\n  133 |                   version ? version.get() : \"none\",\n  134 |                   required.inspectErr()->message);\n  135 |         return false;\n  136 |     }","lines":7,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/repo.cpp#L130-136"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"medium","description":"gjs_profiler_stop() is documented and used (e.g. on sysprof write failure inside gjs_profiler_sigprof, and via gjs_profiler_chain_signal) as callable from the SIGPROF signal handler, yet it calls async-signal-unsafe functions: g_message() (logging, locks/malloc), sysprof_capture_writer_flush(), and g_clear_pointer(..., sysprof_capture_writer_unref) which frees the writer (malloc/free). It also calls sysprof_capture_writer_set_counters and timer_delete. Running this from inside the SIGPROF handler can deadlock or corrupt the heap. The file header explicitly warns that nothing in the handler may malloc or lock.","fix":"Do not call gjs_profiler_stop() directly from the signal handler. Instead set an async-signal-safe flag (sig_atomic_t) and disarm the POSIX timer, then perform the teardown (flush/unref/g_message) from the periodic_flush GSource or another main-loop callback outside signal context.","locations":[{"ref":"gjs/profiler.cpp:486-491","code":"  486 |     if (!sysprof_capture_writer_add_sample(self->capture,\n  487 |                                            now.time_since_epoch().count(), -1,\n  488 |                                            self->pid, -1, addrs, depth)) {\n  489 |         gjs_profiler_stop(self);\n  490 |         return;\n  491 |     }","lines":6,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/profiler.cpp#L486-491"},{"ref":"gjs/profiler.cpp:510-513","code":"  510 |     if (new_counts > 0 && !sysprof_capture_writer_set_counters(\n  511 |                               self->capture, now.time_since_epoch().count(), -1,\n  512 |                               self->pid, ids, values, new_counts))\n  513 |         gjs_profiler_stop(self);","lines":4,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/profiler.cpp#L510-513"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"InterfacePrototype constructor calls g_type_default_interface_ref(gtype) and stores the GTypeInterface* in m_vtable, releasing it in the destructor. However m_vtable is acquired unconditionally even for interfaces defined purely from within GJS (no GIRepository info). If gtype is not actually a registered interface type at construction time, g_type_default_interface_ref may return garbage/null or warn; there is no validation that gtype is an interface before the ref.","fix":"Assert or verify G_TYPE_IS_INTERFACE(gtype) before calling g_type_default_interface_ref(), or document the invariant that gtype is always a valid interface type here.","locations":[{"ref":"gi/interface.cpp:30-41","code":"   30 | InterfacePrototype::InterfacePrototype(\n   31 |     const Maybe<const GI::InterfaceInfo>& info, GType gtype)\n   32 |     : GIWrapperPrototype(info, gtype),\n   33 |       m_vtable(\n   34 |           static_cast<GTypeInterface*>(g_type_default_interface_ref(gtype))) {\n   35 |     GJS_INC_COUNTER(interface);\n   36 | }\n   37 | \n   38 | InterfacePrototype::~InterfacePrototype() {\n   39 |     g_clear_pointer(&m_vtable, g_type_default_interface_unref);\n   40 |     GJS_DEC_COUNTER(interface);\n   41 | }","lines":12,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/interface.cpp#L30-41"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"The SIGPROF handler calls gjs_context_get_profiler(profiling_context), which routes through GjsContextPrivate::from_object() -> g_return_val_if_fail(GJS_IS_CONTEXT(...)). GJS_IS_CONTEXT performs a GType instance check, and on failure g_return_val_if_fail invokes g_log/g_logv (not async-signal-safe). The GType check machinery is also not guaranteed async-signal-safe. Calling this from inside the SIGPROF handler violates the signal-safety constraint described in the file header.","fix":"Cache the GjsProfiler* (and pid) into a plain static/global at gjs_profiler_start() time and read only that raw pointer in the handler, avoiding any GObject type checks or logging calls in signal context.","locations":[{"ref":"gjs/profiler.cpp:399-416","code":"  399 | static void gjs_profiler_sigprof(int signum [[maybe_unused]], siginfo_t* info,\n  400 |                                  void*) {\n  401 |     GjsProfiler* self = gjs_context_get_profiler(profiling_context);\n  402 | \n  403 |     g_assert(info && \"SIGPROF handler called with invalid signal info\");\n  404 |     g_assert(info->si_signo == SIGPROF &&\n  405 |              \"SIGPROF handler called with other signal\");\n  406 | \n  407 |     /*\n  408 |      * NOTE:\n  409 |      *\n  410 |      * This is the SIGPROF signal handler. Everything done in this thread\n  411 |      * needs to be things that are safe to do in a signal handler. One thing\n  412 |      * that is not okay to do, is *malloc*.\n  413 |      */\n  414 | \n  415 |     if (!self || info->si_code != SI_TIMER)\n  416 |         return;","lines":18,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/profiler.cpp#L399-416"}]},
{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"gjs_value_from_constant_info() ignores the int return value of info.load_value() (gi_constant_info_get_value), which returns the size of the constant and is 0 on failure. If loading the constant value fails, `garg` may be left uninitialized and is then passed to gjs_value_from_gi_argument(), and free_value() is unconditionally run on possibly-uninitialized data via the scope guard.","fix":"Check the return value of load_value(); on 0 (failure), throw or return false before using/freeing garg.","locations":[{"ref":"gi/repo.cpp:252-262","code":"  252 | GJS_JSAPI_RETURN_CONVENTION\n  253 | static bool gjs_value_from_constant_info(JSContext* cx,\n  254 |                                          const GI::ConstantInfo info,\n  255 |                                          JS::MutableHandleValue value) {\n  256 |     GIArgument garg;\n  257 |     info.load_value(&garg);\n  258 |     auto guard =\n  259 |         mozilla::MakeScopeExit([&info, &garg]() { info.free_value(&garg); });\n  260 | \n  261 |     return gjs_value_from_gi_argument(cx, value, info.type_info(), &garg, true);\n  262 | }","lines":11,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/repo.cpp#L252-262"},{"ref":"gi/info.h:1059-1061","code":" 1059 |     int load_value(GIArgument* arg) const {\n 1060 |         return gi_constant_info_get_value(ptr(), arg);\n 1061 |     }","lines":3,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/info.h#L1059-1061"}]},
{"id":"API_5","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"AutoGValue's move constructor's complex-case branch does this->steal() then *this = src (copy-assign, which copy-constructs a temporary from src by value) then g_value_unset(&src). This performs a full deep copy plus unset rather than a move, defeating the purpose of the move constructor for boxed/object/string GValues and doing redundant work. The scalar branch likewise does *this = src (a copy). The move constructor never actually moves.","fix":"For the complex case, transfer ownership by memcpy-ing the GValue bytes from src into *this and then zeroing src (G_VALUE_INIT) without unset/copy, which is a true move and avoids deep-copying boxed data.","locations":[{"ref":"gi/value.h:45-67","code":"   45 |     AutoGValue(AutoGValue&& src) {\n   46 |         switch (G_VALUE_TYPE(&src)) {\n   47 |             case G_TYPE_NONE:\n   48 |             case G_TYPE_CHAR:\n   49 |             case G_TYPE_UCHAR:\n   50 |             case G_TYPE_BOOLEAN:\n   51 |             case G_TYPE_INT:\n   52 |             case G_TYPE_UINT:\n   53 |             case G_TYPE_LONG:\n   54 |             case G_TYPE_ULONG:\n   55 |             case G_TYPE_INT64:\n   56 |             case G_TYPE_UINT64:\n   57 |             case G_TYPE_FLOAT:\n   58 |             case G_TYPE_DOUBLE:\n   59 |                 *this = src;\n   60 |                 break;\n   61 |             default:\n   62 |                 // We can't safely move in complex cases, so let's just copy\n   63 |                 this->steal();\n   64 |                 *this = src;\n   65 |                 g_value_unset(&src);\n   66 |         }\n   67 |     }","lines":23,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/value.h#L45-67"}]},
{"id":"API_6","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"gjs_uri_object() constructs JS strings from g_uri_get_scheme/host/path using JS_NewStringCopyZ, justified by the comment that components are %-encoded ASCII because g_uri_parse was called with G_URI_FLAGS_ENCODED. However g_uri_get_host() can legitimately return nullptr (e.g. for a 'file:' or 'gi:' URI with no authority). JS_NewStringCopyZ(cx, nullptr) is passed a null pointer; depending on the SpiderMonkey build this is undefined or returns an empty/null string, then the !host check may or may not catch it. The path/scheme are generally non-null but host is the risky one.","fix":"Guard g_uri_get_host()/get_scheme() against nullptr (substitute an empty string) before passing to JS_NewStringCopyZ.","locations":[{"ref":"gjs/internal.cpp:387-391","code":"  387 |     JS::RootedString host(cx, JS_NewStringCopyZ(cx, g_uri_get_host(parsed)));\n  388 |     if (!host)\n  389 |         return false;\n  390 | \n  391 |     JS::RootedString path(cx, JS_NewStringCopyZ(cx, g_uri_get_path(parsed)));","lines":5,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/internal.cpp#L387-391"}]},
{"id":"API_7","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"gjs_dbus_implementation_emit_signal and the flush path take connections via g_dbus_interface_skeleton_get_connections() (transfer container, elements owned) and then g_object_unref each element individually inside the loop (lines 294, 425) followed by g_list_free(connections). gjs_dbus_implementation_unexport_from_connection instead uses g_list_free_full(connections, g_object_unref) (line 470). Both are correct, but the inconsistent idioms for freeing the same list type invite a future copy-paste error (e.g. double free if someone adds g_list_free_full where individual unrefs already ran).","fix":"Standardize on g_list_free_full(connections, g_object_unref) in all three sites for clarity and to reduce copy-paste hazard.","locations":[{"ref":"libgjs-private/gjs-gdbus-wrapper.c:286-298","code":"  286 |     for (const GList* iter = connections; iter; iter = iter->next) {\n  287 |         g_dbus_connection_emit_signal(G_DBUS_CONNECTION(iter->data),\n  288 |                                       NULL, /* bus name */\n  289 |                                       object_path,\n  290 |                                       \"org.freedesktop.DBus.Properties\",\n  291 |                                       \"PropertiesChanged\",\n  292 |                                       properties,\n  293 |                                       NULL /* error */);\n  294 | \n  295 |         g_object_unref(iter->data);\n  296 |     }\n  297 |     g_variant_unref(properties);\n  298 |     g_list_free(connections);","lines":13,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/libgjs-private/gjs-gdbus-wrapper.c#L286-298"},{"ref":"libgjs-private/gjs-gdbus-wrapper.c:419-428","code":"  419 |     for (const GList* iter = connections; iter; iter = iter->next) {\n  420 |         g_dbus_connection_emit_signal(G_DBUS_CONNECTION(iter->data), NULL,\n  421 |                                       object_path, self->ifaceinfo->name,\n  422 |                                       signal_name, parameters, NULL);\n  423 | \n  424 |         g_object_unref(iter->data);\n  425 |     }\n  426 |     gjs_gvariant_unref0(parameters);\n  427 | \n  428 |     g_list_free(connections);","lines":10,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/libgjs-private/gjs-gdbus-wrapper.c#L419-428"},{"ref":"libgjs-private/gjs-gdbus-wrapper.c:462-469","code":"  462 |     GList* connections = g_dbus_interface_skeleton_get_connections(skeleton);\n  463 | \n  464 |     if (g_list_length(connections) <= 1) {\n  465 |         g_hash_table_remove_all(self->outstanding_properties);\n  466 |         g_clear_handle_id(&self->idle_id, g_source_remove);\n  467 |     }\n  468 | \n  469 |     g_list_free_full(connections, g_object_unref);","lines":8,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/libgjs-private/gjs-gdbus-wrapper.c#L462-469"}]},
{"id":"API_8","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"gjs_set_thread_locale() indexes the per-thread locales array directly with the GjsLocaleCategory value: `locale = &locales[category]` and `locale = &locales[category]`. The category constants are the raw LC_* macro values (LC_ALL, LC_MESSAGES, ...), which are not guaranteed to be a contiguous 0-based range. The array is sized get_number_of_locale_categories() = popcount(LC_ALL_MASK)+1. On glibc the LC_* values happen to fit, but this couples array layout to libc's numeric LC_* values and risks out-of-bounds indexing on platforms where an LC_* value is >= the category count.","fix":"Map the GjsLocaleCategory to a dense 0-based index explicitly (e.g. a small switch), instead of using the raw LC_* value as the array subscript.","locations":[{"ref":"libgjs-private/gjs-util.c:84-86","code":"   84 | static size_t get_number_of_locale_categories(void) {\n   85 |     return __builtin_popcount(LC_ALL_MASK) + 1;\n   86 | }","lines":3,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/libgjs-private/gjs-util.c#L84-86"},{"ref":"libgjs-private/gjs-util.c:127","code":"  127 |     GjsLocale* locale = &locales[category];","lines":1,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/libgjs-private/gjs-util.c#L127"}]},
{"id":"API_9","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"estimate_size_of_xlib_surface multiplies width * height * depth where depth is in BITS per pixel, not bytes. The estimated byte size of an xlib surface is therefore inflated by roughly 8x (and also ignores row padding). Since this value is only used as a GC memory-pressure hint via JS::AddAssociatedMemory, it is not a correctness bug, but it systematically over-reports xlib surface memory and can cause more aggressive GC than warranted.","fix":"Convert depth to bytes (e.g. width * ((depth + 7) / 8) * height), or better, use the surface stride if obtainable, to match the image-surface estimate which correctly uses stride * height.","locations":[{"ref":"modules/cairo-memory.cpp:31-42","code":"   31 | #ifdef CAIRO_HAS_XLIB_SURFACE\n   32 | int32_t estimate_size_of_xlib_surface(cairo_surface_t* surface) {\n   33 |     int width = cairo_xlib_surface_get_width(surface);\n   34 |     int height = cairo_xlib_surface_get_height(surface);\n   35 |     int depth = cairo_xlib_surface_get_depth(surface);\n   36 |     mozilla::CheckedInt32 result =\n   37 |         mozilla::CheckedInt32{width} * height * depth;\n   38 |     if (!result.isValid())\n   39 |         return INT32_MAX;\n   40 |     return result.value();\n   41 | }\n   42 | #endif","lines":12,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/cairo-memory.cpp#L31-42"}]},
{"id":"API_10","type":"api_misuse","type_label":"Api Misuse","severity":"negligible","difficulty":"easy","description":"Several JSFunctionSpec nargs values disagree with the functions' actual required/declared arguments. gjs_exit requires one mandatory \"i\" arg but is registered with nargs 0 (JS_FN(\"exit\", gjs_exit, 0, ...)); dumpMemoryInfo takes an optional filename but is registered with nargs 0 while dumpHeap (also optional filename) uses 1. nargs only affects Function.length and arguments-object padding, so this is cosmetic, but it is inconsistent and slightly misreports arity to JS.","fix":"Set nargs to match each function's mandatory argument count (exit -> 1) and make optional-arg functions consistent (dumpMemoryInfo -> 1 like dumpHeap).","locations":[{"ref":"modules/system.cpp:258-261","code":"  258 |     JS_FN(\"dumpHeap\", gjs_dump_heap, 1, GJS_MODULE_PROP_FLAGS),\n  259 |     JS_FN(\"dumpMemoryInfo\", gjs_dump_memory_info, 0, GJS_MODULE_PROP_FLAGS),\n  260 |     JS_FN(\"gc\", gjs_gc, 0, GJS_MODULE_PROP_FLAGS),\n  261 |     JS_FN(\"exit\", gjs_exit, 0, GJS_MODULE_PROP_FLAGS),","lines":4,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/system.cpp#L258-261"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"The interactive readline wait loop busy-spins. The outer `while (!rl_async_done)` repeatedly calls `g_main_context_iteration(main_context, may_block=false)` only while there are pending sources, otherwise it loops again immediately without ever blocking. While waiting for the user to type a line, this pins a CPU core at ~100% the entire time the prompt is idle.","fix":"Block when there is nothing pending, e.g. call g_main_context_iteration(main_context, /*may_block=*/true) directly in the wait loop (a single blocking iteration per turn) instead of spinning with may_block=false.","locations":[{"ref":"modules/console.cpp:194-198","code":"  194 |     while (!rl_async_done) {\n  195 |         // Yield to other things while waiting for input\n  196 |         while (g_main_context_pending(main_context))\n  197 |             g_main_context_iteration(main_context, /* may_block = */ false);\n  198 |     }","lines":5,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/console.cpp#L194-198"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"gjs_value_from_basic_ghash() and gjs_object_from_g_hash() use JS_NewPlainObject()/JS_NewPlainObject and define properties one by one without presizing, which is acceptable, but gjs_array_from_g_list()/array_from_basic_linked_list() call elems.growBy(1) inside the per-element loop instead of resizing once up front. For long lists this repeatedly reallocates the RootedValueVector. The fixed-length array paths correctly use elems.resize(length) first. Linked lists do not know length up front, so growBy is required there, but the zero-terminated array fill helpers (fill_vector_from_basic_zero_terminated_c_array, fill_vector_from_zero_terminated_pointer_carray) also growBy(1) per element where the length is likewise unknown - acceptable, but worth a reserve heuristic.","fix":"Where the element count is known (GArray/GPtrArray/explicit length), resize once. For linked lists, consider counting length first (g_list_length/g_slist_length) and resizing, to avoid repeated reallocations.","locations":[{"ref":"gi/arg.cpp:2294-2306","code":" 2294 |     for (size_t i = 0; list; list = list->next, ++i) {\n 2295 |         element_type.argument_from_hash_pointer(list->data, &arg);\n 2296 | \n 2297 |         if (!elems.growBy(1)) {\n 2298 |             JS_ReportOutOfMemory(cx);\n 2299 |             return false;\n 2300 |         }\n 2301 | \n 2302 |         if (!gjs_value_from_gi_argument(cx, elems[i], element_type,\n 2303 |                                         GJS_ARGUMENT_LIST_ELEMENT, transfer,\n 2304 |                                         &arg))\n 2305 |             return false;\n 2306 |     }","lines":13,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/arg.cpp#L2294-2306"},{"ref":"gi/arg.cpp:3043-3054","code":" 3043 |     for (size_t i = 0; list; list = list->next, ++i) {\n 3044 |         // for basic types, type tag == storage type\n 3045 |         gi_type_tag_argument_from_hash_pointer(element_tag, list->data, &arg);\n 3046 | \n 3047 |         if (!elems.growBy(1)) {\n 3048 |             JS_ReportOutOfMemory(cx);\n 3049 |             return false;\n 3050 |         }\n 3051 | \n 3052 |         if (!gjs_value_from_basic_gi_argument(cx, elems[i], element_tag, &arg))\n 3053 |             return false;\n 3054 |     }","lines":12,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/arg.cpp#L3043-3054"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"BoxedPrototype::define_boxed_class_fields() and create_field_map()/lookup_field() each call find_unique_js_field_name() per field, which itself loops calling info.method(name) repeatedly (prepending '_' until no method collision). For boxed types with many fields and methods this is repeated O(fields * methods) introspection work performed multiple times (once at class definition, again per field map build, again per lookup miss).","fix":"Cache the resolved unique JS field name alongside the FieldInfo in the field map (computed once during create_field_map) instead of recomputing it on every define and lookup.","locations":[{"ref":"gi/boxed.cpp:787-799","code":"  787 | template <class Base, class Prototype, class Instance>\n  788 | std::string\n  789 | BoxedPrototype<Base, Prototype, Instance>::find_unique_js_field_name(\n  790 |     const BoxedInfo& info, std::string const& c_field_name) {\n  791 |     // Give priority to methods that have names equal to fields\n  792 |     std::string property_name{c_field_name};\n  793 | \n  794 |     Maybe<GI::AutoFunctionInfo> method_info;\n  795 |     while ((method_info = info.method(property_name.c_str())))\n  796 |         property_name.insert(0, \"_\");\n  797 | \n  798 |     return property_name;\n  799 | }","lines":13,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/boxed.cpp#L787-799"},{"ref":"gi/boxed.cpp:203-228","code":"  203 | template <class Base, class Prototype, class Instance>\n  204 | Maybe<const GI::FieldInfo>\n  205 | BoxedPrototype<Base, Prototype, Instance>::lookup_field(JSContext* cx,\n  206 |                                                         JSString* prop_name) {\n  207 |     if (!ensure_field_map(cx))\n  208 |         return {};\n  209 | \n  210 |     JS::RootedString rooted_name(cx, prop_name);\n  211 |     JS::UniqueChars encoded_prop_name = JS_EncodeStringToUTF8(cx, rooted_name);\n  212 |     const std::string field_name{\n  213 |         find_unique_js_field_name(info(), encoded_prop_name.get())};\n  214 | \n  215 |     if (field_name != encoded_prop_name.get()) {\n  216 |         prop_name = JS_AtomizeAndPinStringN(cx, field_name.c_str(),\n  217 |                                             field_name.length());\n  218 |     }\n  219 | \n  220 |     auto entry = m_field_map->lookup(prop_name);\n  221 |     if (!entry) {\n  222 |         gjs_throw(cx, \"No field %s on boxed type %s\",\n  223 |                   gjs_debug_string(prop_name).c_str(), name());\n  224 |         return {};\n  225 |     }\n  226 | \n  227 |     return Some(entry->value());\n  228 | }","lines":26,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/boxed.cpp#L203-228"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"gjs_struct_foreign_lookup() builds a StructID = std::pair<std::string,std::string> from info.ns()/info.name() on every conversion, allocating two std::strings per call, and StructIDHash combines hashes with XOR (poor distribution; symmetric collisions for swapped ns/name). Foreign-struct conversions (e.g. cairo) hit this on each marshalling.","fix":"Use a transparent/string_view-keyed lookup to avoid allocations, and combine the two hashes with a proper mixing function (e.g. boost-style hash_combine) instead of XOR.","locations":[{"ref":"gi/foreign.cpp:30-37","code":"   30 | using StructID = std::pair<std::string, std::string>;\n   31 | struct StructIDHash {\n   32 |     [[nodiscard]]\n   33 |     size_t operator()(const StructID& val) const {\n   34 |         std::hash<std::string> hasher;\n   35 |         return hasher(val.first) ^ hasher(val.second);\n   36 |     }\n   37 | };","lines":8,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/foreign.cpp#L30-37"},{"ref":"gi/foreign.cpp:70-87","code":"   70 | GJS_JSAPI_RETURN_CONVENTION\n   71 | static GjsForeignInfo* gjs_struct_foreign_lookup(JSContext* cx,\n   72 |                                                  const GI::StructInfo& info) {\n   73 |     StructID key{info.ns(), info.name()};\n   74 |     auto entry = foreign_structs_table.find(key);\n   75 |     if (entry == foreign_structs_table.end()) {\n   76 |         if (gjs_foreign_load_foreign_module(cx, info.ns()))\n   77 |             entry = foreign_structs_table.find(key);\n   78 |     }\n   79 | \n   80 |     if (entry == foreign_structs_table.end()) {\n   81 |         gjs_throw(cx, \"Unable to find module implementing foreign type %s.%s\",\n   82 |                   key.first.c_str(), key.second.c_str());\n   83 |         return nullptr;\n   84 |     }\n   85 | \n   86 |     return entry->second;\n   87 | }","lines":18,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/foreign.cpp#L70-87"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"interface_setter() atomizes a fresh string ('Private interface function setter') and creates a brand-new JS Symbol on every single property set through an interface-proxied accessor, then stores it under atoms.override(). This runs in a hot path (every set of a monkeypatchable interface method/property) and allocates per call. The description string at least could be cached/atomized once.","fix":"Hoist the atomized description (or the symbol description) into a GjsAtoms entry or a static, and avoid re-atomizing the constant string on each setter invocation.","locations":[{"ref":"gi/object.cpp:1629-1650","code":" 1629 | static bool interface_setter(JSContext* cx, unsigned argc, JS::Value* vp) {\n 1630 |     JS::CallArgs args = JS::CallArgsFromVp(argc, vp);\n 1631 |     JS::RootedValue v_accessor(\n 1632 |         cx, js::GetFunctionNativeReserved(&args.callee(), ACCESSOR_SLOT));\n 1633 |     JS::RootedObject accessor(cx, &v_accessor.toObject());\n 1634 |     JS::RootedString description(\n 1635 |         cx, JS_AtomizeAndPinString(cx, \"Private interface function setter\"));\n 1636 |     JS::RootedSymbol symbol(cx, JS::NewSymbol(cx, description));\n 1637 |     JS::RootedValue v_symbol(cx, JS::SymbolValue(symbol));\n 1638 | \n 1639 |     const GjsAtoms& atoms = GjsContextPrivate::atoms(cx);\n 1640 |     if (!JS_SetPropertyById(cx, accessor, atoms.override(), v_symbol))\n 1641 |         return false;\n 1642 | \n 1643 |     args.rval().setUndefined();\n 1644 | \n 1645 |     JS::RootedObject this_obj(cx);\n 1646 |     if (!args.computeThis(cx, &this_obj))\n 1647 |         return false;\n 1648 |     JS::RootedId override_id(cx, JS::PropertyKey::Symbol(symbol));\n 1649 | \n 1650 |     return JS_SetPropertyById(cx, this_obj, override_id, args[0]);","lines":22,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/object.cpp#L1629-1650"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"do_import() and importer_new_enumerate() repeatedly stat/query the filesystem per search-path element using separate calls: import_symbol_from_init_js() loads/parses __init__.js, then g_file_query_file_type() for the directory case, then g_file_query_exists() plus a load for the file case. Each __init__.js is re-loaded and re-evaluated through load_module_init on every resolve of a different symbol in the same directory (the result is cached as a property, mitigating this somewhat, but query_file_type + query_exists are independent stat round-trips that could be merged via a single g_file_query_info call retrieving the file type).","fix":"Fetch file type once with g_file_query_info(standard::type) and branch on the result, avoiding the separate query_file_type and query_exists round-trips.","locations":[{"ref":"gjs/importer.cpp:510-550","code":"  510 |         Gjs::AutoUnref<GFile> directory{\n  511 |             g_file_new_for_commandline_arg(dirname.get())};\n  512 | \n  513 |         // Try importing __init__.js and loading the symbol from it\n  514 |         bool found = false;\n  515 |         if (!import_symbol_from_init_js(cx, obj, directory, name.get(), &found))\n  516 |             return false;\n  517 |         if (found)\n  518 |             return true;\n  519 | \n  520 |         // Second try importing a directory (a sub-importer)\n  521 |         Gjs::AutoUnref<GFile> file{g_file_get_child(directory, name.get())};\n  522 | \n  523 |         if (g_file_query_file_type(file, GFileQueryInfoFlags(0), nullptr) ==\n  524 |             G_FILE_TYPE_DIRECTORY) {\n  525 |             Gjs::AutoChar full_path{g_file_get_parse_name(file)};\n  526 |             gjs_debug(GJS_DEBUG_IMPORTER,\n  527 |                       \"Adding directory '%s' to child importer '%s'\",\n  528 |                       full_path.get(), name.get());\n  529 |             directories.emplace_back(full_path.get());\n  530 |         }\n  531 | \n  532 |         /* If we just added to directories, we know we don't need to check for a\n  533 |          * file.  If we added to directories on an earlier iteration, we want to\n  534 |          * ignore any files later in the path. So, always skip the rest of the\n  535 |          * loop block if we have directories.\n  536 |          */\n  537 |         if (!directories.empty())\n  538 |             continue;\n  539 | \n  540 |         // Third, if it's not a directory, try importing a file\n  541 |         file = g_file_get_child(directory, filename.get());\n  542 |         bool exists = g_file_query_exists(file, nullptr);\n  543 | \n  544 |         if (!exists) {\n  545 |             Gjs::AutoChar full_path{g_file_get_parse_name(file)};\n  546 |             gjs_debug(GJS_DEBUG_IMPORTER,\n  547 |                       \"JS import '%s' not found in %s at %s\", name.get(),\n  548 |                       dirname.get(), full_path.get());\n  549 |             continue;\n  550 |         }","lines":41,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/importer.cpp#L510-550"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"gjs_lossy_string_from_utf8 / gjs_lossy_string_from_utf8_n perform a double allocation+copy: LossyUTF8CharsToNewTwoByteCharsZ allocates a fresh UTF-16 buffer, then JS_NewUCStringCopyN copies it again into a JS string and the first buffer is freed. For large strings on the lossy decode path (the default toString path for byte arrays) this doubles transient memory and copy cost.","fix":"If SpiderMonkey exposes an adopt-style constructor (e.g. JS_NewUCString that takes ownership of a JS-engine-allocated buffer), hand the allocated twobyte_chars buffer directly to the engine instead of copying.","locations":[{"ref":"gjs/jsapi-util-string.cpp:167-203","code":"  167 | JSString* gjs_lossy_string_from_utf8(JSContext* cx, const char* utf8_string) {\n  168 |     JS::UTF8Chars chars{utf8_string, strlen(utf8_string)};\n  169 |     size_t outlen;\n  170 |     JS::UniqueTwoByteChars twobyte_chars(\n  171 |         JS::LossyUTF8CharsToNewTwoByteCharsZ(cx, chars, &outlen,\n  172 |                                              js::MallocArena)\n  173 |             .get());\n  174 |     if (!twobyte_chars)\n  175 |         return nullptr;\n  176 | \n  177 |     return JS_NewUCStringCopyN(cx, twobyte_chars.get(), outlen);\n  178 | }\n  179 | \n  180 | /**\n  181 |  * gjs_lossy_string_from_utf8_n:\n  182 |  * @cx: the current #JSContext\n  183 |  * @utf8_string: an array of UTF-8 characters to decode\n  184 |  * @len: length of @utf8_string\n  185 |  *\n  186 |  * Provides the same conversion behavior as gjs_lossy_string_from_utf8\n  187 |  * with a fixed length. See gjs_lossy_string_from_utf8().\n  188 |  *\n  189 |  * Returns: The decoded string.\n  190 |  */\n  191 | JSString* gjs_lossy_string_from_utf8_n(JSContext* cx, const char* utf8_string,\n  192 |                                        size_t len) {\n  193 |     JS::UTF8Chars chars(utf8_string, len);\n  194 |     size_t outlen;\n  195 |     JS::UniqueTwoByteChars twobyte_chars(\n  196 |         JS::LossyUTF8CharsToNewTwoByteCharsZ(cx, chars, &outlen,\n  197 |                                              js::MallocArena)\n  198 |             .get());\n  199 |     if (!twobyte_chars)\n  200 |         return nullptr;\n  201 | \n  202 |     return JS_NewUCStringCopyN(cx, twobyte_chars.get(), outlen);\n  203 | }","lines":37,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/jsapi-util-string.cpp#L167-203"}]},
{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"CairoPath::copy_ptr implements path duplication by creating a throwaway 0x0 ARGB32 image surface and a cairo_t, appending the path, copying it back, then destroying both. This is the documented PyGObject workaround for the lack of a cairo path-copy API, but it allocates a surface and context on every transfer-everything marshalling of a Path (e.g. passing a Path to a GI function with GI_TRANSFER_EVERYTHING). For paths copied frequently this is heavyweight.","fix":"Acceptable given cairo offers no public deep-copy of cairo_path_t; if this shows up in profiles, cache a shared scratch context, or deep-copy the cairo_path_data_t array manually.","locations":[{"ref":"modules/cairo-path.cpp:122-133","code":"  122 | // Adapted from PyGObject cairo code\n  123 | cairo_path_t* CairoPath::copy_ptr(cairo_path_t* path) {\n  124 |     cairo_surface_t* surface =\n  125 |         cairo_image_surface_create(CAIRO_FORMAT_ARGB32, 0, 0);\n  126 |     cairo_t* cr = cairo_create(surface);\n  127 |     cairo_append_path(cr, path);\n  128 |     cairo_path_t* copy = cairo_copy_path(cr);\n  129 |     cairo_destroy(cr);\n  130 |     cairo_surface_destroy(surface);\n  131 | \n  132 |     return copy;\n  133 | }","lines":12,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/cairo-path.cpp#L122-133"}]},
{"id":"PERF_9","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"In ErrorPrototype::get_parent_proto() and find_error_domain_info(), repo.require(\"GLib\"/\"GObject\"/\"Gio\", ...) is called on every invocation. get_parent_proto() runs once per error-domain class definition and object_for_c_ptr()/find_error_domain_info() runs for every GError-to-JS conversion that lacks cached domain info. gi_repository_require is reasonably cheap once loaded, but the repeated require(\"GLib\")/require(\"GObject\")/require(\"Gio\") on the no-metadata path adds avoidable overhead to error marshalling.","fix":"These typelibs are guaranteed loaded at startup; the extra require() calls in find_error_domain_info() could be dropped (or done once) since the namespaces are already registered by the time errors are marshalled.","locations":[{"ref":"gi/gerror.cpp:215-225","code":"  215 | bool ErrorPrototype::get_parent_proto(JSContext* cx,\n  216 |                                       JS::MutableHandleObject proto) {\n  217 |     GI::Repository repo{};\n  218 |     repo.require(\"GLib\", \"2.0\").unwrap();\n  219 | \n  220 |     GI::AutoBaseInfo glib_error_info{\n  221 |         repo.find_by_name(\"GLib\", \"Error\").value()};\n  222 | \n  223 |     proto.set(gjs_lookup_generic_prototype(cx, glib_error_info));\n  224 |     return !!proto;\n  225 | }","lines":11,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/gerror.cpp#L215-225"},{"ref":"gi/gerror.cpp:244-263","code":"  244 | [[nodiscard]]\n  245 | static Maybe<const GI::EnumInfo> find_error_domain_info(\n  246 |     const GI::Repository& repo, GQuark domain) {\n  247 |     // first an attempt without loading extra libraries\n  248 |     Maybe<GI::AutoEnumInfo> info = repo.find_by_error_domain(domain);\n  249 |     if (info)\n  250 |         return info;\n  251 | \n  252 |     // load standard stuff\n  253 |     repo.require(\"GLib\", \"2.0\").unwrap();\n  254 |     repo.require(\"GObject\", \"2.0\").unwrap();\n  255 |     repo.require(\"Gio\", \"2.0\").unwrap();\n  256 |     info = repo.find_by_error_domain(domain);\n  257 |     if (info)\n  258 |         return info;\n  259 | \n  260 |     // last attempt: load GIRepository (for invoke errors, rarely needed)\n  261 |     repo.require(\"GIRepository\", \"3.0\").unwrap();\n  262 |     return repo.find_by_error_domain(domain);\n  263 | }","lines":20,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/gerror.cpp#L244-263"}]},
{"id":"PERF_10","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"In emit_impl(), inside the per-parameter loop, the code re-fetches the signal info via ObjectBase::info()->signal(signal_query.signal_name) on every iteration (once per signal parameter) to obtain transfer ownership for each arg. The signal lookup is invariant across the loop and could be hoisted out, fetching the GI::AutoSignalInfo once before the loop.","fix":"Move the info()->signal(...) lookup above the for loop and reuse the resulting Maybe<GI::AutoSignalInfo> for each arg's ownership_transfer() check.","locations":[{"ref":"gi/object.cpp:3097-3111","code":" 3097 |         if (!ObjectBase::info())\n 3098 |             continue;\n 3099 | \n 3100 |         Maybe<GI::AutoSignalInfo> signal_info =\n 3101 |             ObjectBase::info()->signal(signal_query.signal_name);\n 3102 |         if (!signal_info)\n 3103 |             continue;\n 3104 | \n 3105 |         GI::AutoArgInfo arg_info{signal_info->arg(i)};\n 3106 |         if (arg_info.ownership_transfer() != GI_TRANSFER_NOTHING) {\n 3107 |             // FIXME(3v1n0): As it happens in many places in gjs, we can't track\n 3108 |             // (yet) containers content, so in case of transfer container we\n 3109 |             // can only leak.\n 3110 |             args_to_steal.push_back(&value);\n 3111 |         }","lines":15,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gi/object.cpp#L3097-3111"}]},
{"id":"PERF_11","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"filename_has_coverage_prefixes calls g_get_current_dir() and g_canonicalize_filename() for the working dir on every invocation, and re-canonicalizes every prefix on every call. Since this runs once per SF: record while writing lcov statistics, the prefixes (and workdir) could be canonicalized once up front rather than O(files * prefixes) times.","fix":"Canonicalize the workdir and prefixes once (e.g. cache them) before the lcov loop, then only canonicalize the per-file filename inside the loop.","locations":[{"ref":"gjs/coverage.cpp:163-177","code":"  163 | [[nodiscard]]\n  164 | static bool filename_has_coverage_prefixes(GjsCoverage* self,\n  165 |                                            const char* filename) {\n  166 |     auto* priv = static_cast<GjsCoveragePrivate*>(\n  167 |         gjs_coverage_get_instance_private(self));\n  168 |     Gjs::AutoChar workdir{g_get_current_dir()};\n  169 |     Gjs::AutoChar abs_filename{g_canonicalize_filename(filename, workdir)};\n  170 | \n  171 |     for (const char* const* prefix = priv->prefixes; *prefix; prefix++) {\n  172 |         Gjs::AutoChar abs_prefix{g_canonicalize_filename(*prefix, workdir)};\n  173 |         if (g_str_has_prefix(abs_filename, abs_prefix))\n  174 |             return true;\n  175 |     }\n  176 |     return false;\n  177 | }","lines":15,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/coverage.cpp#L163-177"}]},
{"id":"PERF_12","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"gjs_load_internal_source() computes `filename + 11` with the comment `len(\"resource://\")`, but \"resource://\" is 11 characters so the value is correct; however the literal 11 is a magic number duplicated from the string and could silently break if the scheme prefix used by callers changes. The callers pass URIs like 'resource:///org/gnome/...'. Minor maintainability hazard, not a live bug.","fix":"Replace the hardcoded 11 with `strlen(\"resource://\")` or skip past a named constant to keep the offset in sync with the scheme string.","locations":[{"ref":"gjs/engine.cpp:85-96","code":"   85 | bool gjs_load_internal_source(JSContext* cx, const char* filename, char** src,\n   86 |                               size_t* length) {\n   87 |     Gjs::AutoError error;\n   88 |     const char* path = filename + 11;  // len(\"resource://\")\n   89 |     GBytes* script_bytes =\n   90 |         g_resources_lookup_data(path, G_RESOURCE_LOOKUP_FLAGS_NONE, &error);\n   91 |     if (!script_bytes)\n   92 |         return gjs_throw_gerror_message(cx, error);\n   93 | \n   94 |     *src = static_cast<char*>(g_bytes_unref_to_data(script_bytes, length));\n   95 |     return true;\n   96 | }","lines":12,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/engine.cpp#L85-96"}]},
{"id":"PERF_13","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"gjs_memory_report() loads each counter's atomic value multiple times: once summing into total_objects (counters[i]->value, which reads .value implicitly) and again in the per-counter debug print (counters[i]->value.load()). Minor, but under a debug build that calls this frequently the redundant atomic loads and the separate GJS_GET_COUNTER(everything) loads add up; more importantly total_objects is compared to GJS_GET_COUNTER(everything) without any synchronization, so in a multithreaded scenario the 'counts don't add up' warning can spuriously fire.","fix":"Snapshot each counter once into a local; acknowledge the inherent raciness or take a lock if counters can change concurrently during the report.","locations":[{"ref":"gjs/mem.cpp:45-66","code":"   45 |     int64_t total_objects = 0;\n   46 |     for (size_t i = 0; i < n_counters; ++i) {\n   47 |         total_objects += counters[i]->value;\n   48 |     }\n   49 | \n   50 |     if (total_objects != GJS_GET_COUNTER(everything)) {\n   51 |         gjs_debug(GJS_DEBUG_MEMORY,\n   52 |                   \"Object counts don't add up!\");\n   53 |     }\n   54 | \n   55 |     gjs_debug(GJS_DEBUG_MEMORY, \"  %\" PRId64 \" objects currently alive\",\n   56 |               GJS_GET_COUNTER(everything));\n   57 | \n   58 |     if (GJS_GET_COUNTER(everything) != 0) {\n   59 |         for (size_t i = 0; i < n_counters; ++i) {\n   60 |             gjs_debug(GJS_DEBUG_MEMORY, \"    %24s = %\" PRId64,\n   61 |                       counters[i]->name, counters[i]->value.load());\n   62 |         }\n   63 | \n   64 |         if (die_if_leaks)\n   65 |             g_error(\"%s: JavaScript objects were leaked.\", where);\n   66 |     }","lines":22,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/mem.cpp#L45-66"}]},
{"id":"PERF_14","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"is_utf8_label() is called on every encode/decode and, on the non-trivial path (label not exactly 'utf-8'/'utf8'), it g_strdup()s the whole encoding string just to g_strstrip() and compare. For the common 'UTF-8' (uppercase) or whitespace-padded labels this is an allocation per call on a hot conversion path.","fix":"Strip leading/trailing whitespace by pointer/length arithmetic without duplicating the string, then case-insensitively compare against the two literals.","locations":[{"ref":"gjs/text-encoding.cpp:233-249","code":"  233 | [[nodiscard]]\n  234 | static bool is_utf8_label(const char* encoding) {\n  235 |     // We could be smarter about utf8 synonyms here.\n  236 |     // For now, we handle any casing and trailing/leading\n  237 |     // whitespace.\n  238 |     //\n  239 |     // is_utf8_label is only an optimization, so if a label\n  240 |     // doesn't match we just use the slower path.\n  241 |     if (g_ascii_strcasecmp(encoding, \"utf-8\") == 0 ||\n  242 |         g_ascii_strcasecmp(encoding, \"utf8\") == 0)\n  243 |         return true;\n  244 | \n  245 |     Gjs::AutoChar stripped{g_strdup(encoding)};\n  246 |     g_strstrip(stripped);  // modifies in place\n  247 |     return g_ascii_strcasecmp(stripped, \"utf-8\") == 0 ||\n  248 |            g_ascii_strcasecmp(stripped, \"utf8\") == 0;\n  249 | }","lines":17,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/text-encoding.cpp#L233-249"}]},
{"id":"PERF_15","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"console.js builds the global console by binding every Console.prototype method to the singleton and freezing the object at module load. formatOptimally() calls imports.gi.GLib on every invocation (line 43) and #printer calls imports.gi.GLib on every print (line 507); these imports.gi.GLib property lookups happen per-call rather than being hoisted to module scope, adding overhead to every console call on a hot logging path.","fix":"Cache GLib once at module top-level (const GLib = imports.gi.GLib) and reference it, as other modules in this slice (mainloop.js, _gettext.js) already do.","locations":[{"ref":"modules/esm/console.js:43","code":"   43 |     const GLib = imports.gi.GLib;","lines":1,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/esm/console.js#L43"},{"ref":"modules/esm/console.js:508","code":"  508 |         const GLib = imports.gi.GLib;","lines":1,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/esm/console.js#L508"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"set_main_loop_hook() asserts `JS::IsCallable(callable)` at the top, which dereferences/uses callable and requires it to be non-null and callable. The subsequent `if (!callable) { m_main_loop_hook = nullptr; return true; }` branch is therefore dead code: a null callable would already have tripped the assertion (and IsCallable(nullptr) is itself invalid). The null-clearing path can never be reached.","fix":"Either remove the dead `if (!callable)` block, or move the null check before the assertion if clearing the hook via nullptr is a supported use case.","locations":[{"ref":"gjs/context.cpp:1463-1476","code":" 1463 | bool GjsContextPrivate::set_main_loop_hook(JSObject* callable) {\n 1464 |     g_assert(JS::IsCallable(callable) &&\n 1465 |              \"main loop hook must be a callable object\");\n 1466 | \n 1467 |     if (!callable) {\n 1468 |         m_main_loop_hook = nullptr;\n 1469 |         return true;\n 1470 |     }\n 1471 | \n 1472 |     if (m_main_loop_hook)\n 1473 |         return false;\n 1474 | \n 1475 |     m_main_loop_hook = callable;\n 1476 |     return true;","lines":14,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/context.cpp#L1463-1476"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"importer_resolve() checks 'if (!id.isString())' twice with identical bodies. The second check at line 707 is unreachable as a positive branch because the first check at line 692 already returned for non-string ids, and nothing between them can change id. The second block is pure dead code.","fix":"Remove the duplicate 'if (!id.isString())' block at lines 707-710.","locations":[{"ref":"gjs/importer.cpp:692-695","code":"  692 |     if (!id.isString()) {\n  693 |         *resolved = false;\n  694 |         return true;\n  695 |     }","lines":4,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/importer.cpp#L692-695"},{"ref":"gjs/importer.cpp:707-710","code":"  707 |     if (!id.isString()) {\n  708 |         *resolved = false;\n  709 |         return true;\n  710 |     }","lines":4,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/importer.cpp#L707-710"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"encoded_stack_str is computed via g_filename_from_utf8() and null-checked, but the code then prints stack_str.get() (the un-encoded UTF-8 string) instead of encoded_stack_str. The filename-encoding conversion is entirely wasted, and the intent (printing the locale/filename-encoded stack) is silently not honored.","fix":"Print encoded_stack_str in the else branch: g_printerr(\"%s\", encoded_stack_str.get()); (or drop the conversion if UTF-8 output is actually intended).","locations":[{"ref":"modules/console.cpp:105-110","code":"  105 |                 Gjs::AutoChar encoded_stack_str{g_filename_from_utf8(\n  106 |                     stack_str.get(), -1, nullptr, nullptr, nullptr)};\n  107 |                 if (!encoded_stack_str)\n  108 |                     g_printerr(\"(Unable to print stack trace)\\n\");\n  109 |                 else\n  110 |                     g_printerr(\"%s\", stack_str.get());","lines":6,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/modules/console.cpp#L105-110"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"Redundant null check in gjs_string_to_ucs4. The function returns early at the top when `ucs4_string_p == nullptr` (lines 319-320), so by line 340 ucs4_string_p is guaranteed non-null; the `if (ucs4_string_p != nullptr)` guard is dead and always true. Also `size_t len;` and `Gjs::AutoError error;` declared at the top are unused on the Latin-1 early-return path.","fix":"Drop the redundant `if (ucs4_string_p != nullptr)` wrapper and rely on the early return; declare `len`/`error` only in the two-byte branch.","locations":[{"ref":"gjs/jsapi-util-string.cpp:336-371","code":"  336 | bool gjs_string_to_ucs4(JSContext* cx, JS::HandleString str,\n  337 |                         gunichar** ucs4_string_p, size_t* len_p) {\n  338 |     if (ucs4_string_p == nullptr)\n  339 |         return true;\n  340 | \n  341 |     size_t len;\n  342 |     Gjs::AutoError error;\n  343 | \n  344 |     if (JS::StringHasLatin1Chars(str))\n  345 |         return from_latin1(cx, str, ucs4_string_p, len_p);\n  346 | \n  347 |     /* From this point on, crash if a GC is triggered while we are using the\n  348 |      * string's chars */\n  349 |     JS::AutoCheckCannotGC nogc;\n  350 | \n  351 |     const char16_t* utf16 =\n  352 |         JS_GetTwoByteStringCharsAndLength(cx, nogc, str, &len);\n  353 | \n  354 |     if (utf16 == nullptr) {\n  355 |         gjs_throw(cx, \"Failed to get UTF-16 string data\");\n  356 |         return false;\n  357 |     }\n  358 | \n  359 |     if (ucs4_string_p != nullptr) {\n  360 |         long length;\n  361 |         *ucs4_string_p =\n  362 |             g_utf16_to_ucs4(reinterpret_cast<const gunichar2*>(utf16), len,\n  363 |                             nullptr, &length, &error);\n  364 |         if (*ucs4_string_p == nullptr) {\n  365 |             gjs_throw(cx, \"Failed to convert UTF-16 string to UCS-4: %s\",\n  366 |                       error->message);\n  367 |             return false;\n  368 |         }\n  369 |         if (len_p != nullptr)\n  370 |             *len_p = static_cast<size_t>(length);\n  371 |     }","lines":36,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/jsapi-util-string.cpp#L336-371"}]},
{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"In gjs_profiler_add_mark the non-profiler branch does `(void)time; (void)duration; (void)message;` but omits `(void)group` and `(void)name`. Those two parameters are checked by g_return_if_fail above (which is compiled in regardless of ENABLE_PROFILER), so they are technically used; however this is inconsistent with the other (void) casts and relies on the g_return_if_fail not being compiled out (it is removed with G_DISABLE_CHECKS), which would then make group/name unused in a no-profiler + G_DISABLE_CHECKS build.","fix":"For consistency and to be safe under G_DISABLE_CHECKS, also cast (void)group and (void)name in the non-profiler branch, or mark the parameters [[maybe_unused]].","locations":[{"ref":"gjs/profiler.cpp:874-879","code":"  874 | #else\n  875 |     // Unused in the no-profiler case\n  876 |     (void)time;\n  877 |     (void)duration;\n  878 |     (void)message;\n  879 | #endif","lines":6,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/gjs/profiler.cpp#L874-879"}]},
{"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"gjs_match_info_free() is documented as accepting a NULL self (annotation `@self: (nullable)`), but the first statement is g_return_if_fail(self != NULL), which logs a critical warning and returns for NULL. The subsequent `if (self == NULL) return;` is therefore unreachable dead code, and the function does not actually honor its nullable contract.","fix":"If NULL is meant to be allowed, drop the g_return_if_fail and keep the NULL check; otherwise remove the redundant NULL check and fix the (nullable) annotation.","locations":[{"ref":"libgjs-private/gjs-match-info.c:98-104","code":"   98 | void gjs_match_info_free(GjsMatchInfo* self) {\n   99 |     g_return_if_fail(self != NULL);\n  100 |     if (self == NULL)\n  101 |         return;\n  102 | \n  103 |     gjs_match_info_unref(self);\n  104 | }","lines":7,"link":"https://gitlab.gnome.org/GNOME/gjs/-/blob/4296eafe7961537de9c692773e5f30a15f1f28ae/libgjs-private/gjs-match-info.c#L98-104"}]},
