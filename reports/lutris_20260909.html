{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"medium","description":"update_search_results_cb is an AsyncCall callback invoked on the GTK main loop. On error it\nre-raises the exception with `raise error` instead of presenting it to the user. Raising from a\nGLib idle/main-loop callback does not propagate to any caller that can handle it; depending on the\nexception backstop it is either swallowed or crashes the handler, and the spinner started in\nupdate_search_results is never stopped/hidden, leaving the search UI stuck in a spinning state.\nNetwork errors from api.search_games (very common: offline, timeout) hit this path.","fix":"Handle the error gracefully: stop/hide the spinner first, then show the message in\nsearch_result_label (e.g. self.search_result_label.set_markup(gtk_safe(str(error))) and show it),\ninstead of `raise error`.","locations":[{"ref":"lutris/gui/addgameswindow.py:262-267","code":"  262 |     def update_search_results_cb(self, api_games, error):\n  263 |         if error:\n  264 |             raise error\n  265 | \n  266 |         self.search_spinner.stop()\n  267 |         self.search_spinner.hide()","lines":6,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/addgameswindow.py#L262-L267"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"get_lutris_action can return parse_installer_url's result, but when a URL is present and invalid,\nparse_installer_url raises ValueError which is caught at the call site (line 652). However when\n`url` is present but parse_installer_url returns a dict missing expected keys, the subsequent\nunconditional indexing installer_info[\"game_slug\"], [\"action\"], [\"service\"], [\"appid\"],\n[\"launch_config_name\"], [\"revision\"] will raise KeyError (not ValueError) and is NOT caught,\ncrashing do_command_line. The default dict in get_lutris_action has these keys, but\nparse_installer_url's return is trusted to have them all.","fix":"Use installer_info.get(...) for each field, or validate the dict returned by\nparse_installer_url has all required keys and treat missing keys as an invalid URI (returning the\nsame error path as ValueError).","locations":[{"ref":"lutris/gui/application.py:649-664","code":"  649 |         url = options.lookup_value(GLib.OPTION_REMAINING)\n  650 |         try:\n  651 |             installer_info = self.get_lutris_action(url)\n  652 |         except ValueError:\n  653 |             self._print(command_line, _(\"%s is not a valid URI\") % (url.get_strv() if url else \"''\"))\n  654 |             return 1\n  655 | \n  656 |         game_slug = installer_info[\"game_slug\"]\n  657 |         action = installer_info[\"action\"]\n  658 |         service = installer_info[\"service\"]\n  659 |         appid = installer_info[\"appid\"]\n  660 |         launch_config_name = installer_info[\"launch_config_name\"]\n  661 | \n  662 |         self.launch_ui_delegate = CommandLineUIDelegate(launch_config_name)\n  663 | \n  664 |         revision = installer_info[\"revision\"]","lines":16,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/application.py#L649-L664"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"SearchFiltersBox.on_save and EditCategoryGamesDialog.on_save raise RuntimeError directly from a save\nbutton handler when a name collides with an existing saved search / reserved category. These are\nGObject signal/button callbacks; a raised exception propagates into the GTK main loop and is logged as\nan unhandled error rather than shown to the user, and the dialog stays open in an undefined state with\nno user-visible message explaining the conflict.","fix":"Show an ErrorDialog (or inline validation message) and return without saving on name conflicts /\nreserved names, instead of raising RuntimeError out of the handler.","locations":[{"ref":"lutris/gui/config/edit_saved_search.py:294-303","code":"  294 |         if self.original_search.name != self.saved_search.name:\n  295 |             if saved_searches.get_saved_search_by_name(self.saved_search.name):\n  296 |                 raise RuntimeError(_(\"'%s' is already a saved search.\") % self.saved_search.name)\n  297 | \n  298 |         if not self.saved_search.saved_search_id:\n  299 |             # Creating new search!\n  300 |             self.saved_search.add()\n  301 |         elif self.original_search != self.saved_search:\n  302 |             # Changing an existing search.\n  303 |             self.saved_search.update()","lines":10,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/config/edit_saved_search.py#L294-L303"},{"ref":"lutris/gui/config/edit_game_categories.py:114-115","code":"  114 |         category_entry.connect(\"activate\", on_add_category)\n  115 |         hbox.pack_start(category_entry, True, True, 0)","lines":2,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/config/edit_game_categories.py#L114-L115"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"GameInfoBox.on_custom_image_download_clicked runs the network download via AsyncCall with a callback\ndownload_cb that does 'if error: raise error'. AsyncCall callbacks run on the UI thread; raising the\nerror there does not surface a user-facing message and is swallowed/logged by the jobs machinery at\nbest. A failed image download (bad URL, network error, non-OK status) gives the user no feedback. The\nsame pattern is repeated in _save_transcoded_media_to.transcode_cb.","fix":"Replace 'raise error' in these callbacks with proper user feedback (e.g. ErrorDialog or a logged\nwarning plus a UI notice) so download/transcode failures are reported instead of re-raised on the\nUI thread.","locations":[{"ref":"lutris/gui/config/game_info_box.py:520-524","code":"  520 |         def download_cb(_result, error):\n  521 |             if error:\n  522 |                 raise error\n  523 | \n  524 |         AsyncCall(download, download_cb)","lines":5,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/config/game_info_box.py#L520-L524"},{"ref":"lutris/gui/config/game_info_box.py:587-589","code":"  587 |         def transcode_cb(_result, error):\n  588 |             if error:\n  589 |                 raise error","lines":3,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/config/game_info_box.py#L587-L589"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"ErrorDialog truncates markup with message_markup[:256] and secondary_markup[:256] before passing\nto set_markup()/format_secondary_markup(). Truncating Pango markup at an arbitrary byte offset can\nsplit a markup tag (e.g. '<span ...') or an entity, producing invalid markup. Gtk's markup parser\nwill then raise/emit a warning and the error text may not render, defeating the purpose of the\nerror dialog at exactly the moment it is needed.","fix":"Don't truncate already-built markup. If a length cap is needed, cap the plain-text source before\nescaping/wrapping in markup, or escape the truncated text via gtk_safe() rather than slicing a\nmarkup string.","locations":[{"ref":"lutris/gui/dialogs/__init__.py:316-320","code":"  316 |         if message_markup:\n  317 |             self.set_markup(message_markup[:256])\n  318 | \n  319 |         if secondary_markup:\n  320 |             self.format_secondary_markup(secondary_markup[:256])","lines":5,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/dialogs/__init__.py#L316-L320"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"RunnerInstallDialog.cancel_install does self.installing[runner[\"version\"]].cancel() then\nself.installing.pop(runner[\"version\"]) with no guard. cancel_install is invoked both from the\nuser Cancel button and automatically from get_progress() on downloader ERROR. If both fire (or\ncancel_install runs twice for the same row), the second access raises KeyError, leaving the UI in\nan inconsistent state. on_extracted similarly pops unconditionally.","fix":"Use self.installing.pop(version, None) and check membership before calling .cancel(), so repeated\nor racing cancellations are idempotent.","locations":[{"ref":"lutris/gui/dialogs/runner_install.py:325-332","code":"  325 |     def cancel_install(self, row):\n  326 |         \"\"\"Cancel the installation of a runner version\"\"\"\n  327 |         runner = row.runner\n  328 |         self.installing[runner[\"version\"]].cancel()\n  329 |         self.uninstall_runner(row)\n  330 |         runner[\"progress\"] = 0\n  331 |         self.installing.pop(runner[\"version\"])\n  332 |         self.update_listboxrow(row)","lines":8,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/dialogs/runner_install.py#L325-L332"},{"ref":"lutris/gui/dialogs/runner_install.py:425-439","code":"  425 |     def on_extracted(self, row_info, error):\n  426 |         \"\"\"Called when a runner archive is extracted\"\"\"\n  427 |         if error or not row_info:\n  428 |             ErrorDialog(_(\"Failed to retrieve the runner archive\"), parent=self)\n  429 |             return\n  430 |         src, row = row_info\n  431 |         runner = row.runner\n  432 |         os.remove(src)\n  433 |         runner[\"progress\"] = 0\n  434 |         runner[\"is_installed\"] = True\n  435 |         self.installing.pop(runner[\"version\"])\n  436 |         row.install_progress.set_text(\"\")\n  437 |         row.install_progress.set_fraction(0.0)\n  438 |         row.install_progress.hide()\n  439 |         self.update_listboxrow(row)","lines":15,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/dialogs/runner_install.py#L425-L439"}]},
{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"on_files_confirmed wraps installer_files_box.start_all() and only catches PermissionError,\nre-raising it as ScriptingError. start_all() calls each file_entry.start(), which runs\ninstaller_file.prepare() and provider-specific code that can raise other exceptions\n(ValueError for invalid providers in get_file_provider_widget, RuntimeError for\nInstallerFileCollection+steam, OSError, etc.). Those escape this clicked-signal handler\nuncaught, producing an unhandled exception in the GTK main loop instead of the installer\nerror page.","fix":"Catch a broader exception (or at least also handle the documented RuntimeError/ValueError/OSError) and route it through self.load_error_page()/_handle_callback_error rather than only PermissionError.","locations":[{"ref":"lutris/gui/installerwindow.py:719-727","code":"  719 |     def on_files_confirmed(self, _button):\n  720 |         \"\"\"Call this when the user confirms the install files\n  721 |         This will start the downloads.\n  722 |         \"\"\"\n  723 |         try:\n  724 |             self.installer_files_box.start_all()\n  725 |             self.stack.jump_to_page(self.present_downloading_files_page)\n  726 |         except PermissionError as ex:\n  727 |             raise ScriptingError(_(\"Unable to get files: %s\") % ex) from ex","lines":9,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/installerwindow.py#L719-L727"},{"ref":"lutris/gui/installer/file_box.py:73-90","code":"   73 |         if self.provider == \"steam\":\n   74 |             if isinstance(self.installer_file, InstallerFileCollection):\n   75 |                 raise RuntimeError(\"Installer file is type InstallerFileCollection and do not support 'steam' provider\")\n   76 |             steam_installer = SteamInstaller(self.installer_file.url, self.installer_file.id)\n   77 |             steam_installer.game_installed.register(self.on_steam_game_installed)\n   78 |             steam_installer.game_state_changed.register(self.on_steam_game_state_changed)\n   79 |             self.start_func = steam_installer.install_steam_game\n   80 |             self.stop_func = steam_installer.stop_func\n   81 | \n   82 |             steam_box = Gtk.HBox(spacing=6)\n   83 |             info_box = Gtk.VBox(spacing=6)\n   84 |             steam_label = InstallerLabel(_(\"Steam game <b>{appid}<\/b>\").format(appid=steam_installer.appid))\n   85 |             info_box.add(steam_label)\n   86 |             self.state_label = InstallerLabel(\"\")\n   87 |             info_box.add(self.state_label)\n   88 |             steam_box.add(info_box)\n   89 |             return steam_box\n   90 |         raise ValueError(\"Invalid provider %s\" % self.provider)","lines":18,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/installer/file_box.py#L73-L90"}]},
{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"In get_games_from_filters(), when service_id is in services.SERVICES the code immediately\ndereferences self.service.online / self.service.is_authenticated() (line 688). But\nset_service() sets self.service to None on KeyError or when instantiation is otherwise\nabsent, and the sidebar handler can call set_service() with a name that fails. If\nself.service is None here while service_id is still a known key, this raises\nAttributeError on None. The service_id presence check and the self.service object are not\nguaranteed to be consistent.","fix":"Guard on self.service rather than (or in addition to) service_id, e.g.\n'if self.service and service_id in services.SERVICES:' and fall through to the non-service\npath otherwise.","locations":[{"ref":"lutris/gui/lutriswindow.py:695-701","code":"  695 |     def get_games_from_filters(self):\n  696 |         service_id = self.filters.get(\"service\")\n  697 |         if service_id in services.SERVICES:\n  698 |             if self.service.online and not self.service.is_authenticated():\n  699 |                 self.show_empty_label()\n  700 |                 return []\n  701 |             return self.get_service_games(service_id)","lines":7,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/lutriswindow.py#L695-L701"},{"ref":"lutris/gui/lutriswindow.py:655-666","code":"  655 |     def set_service(self, service_name):\n  656 |         if self.service and self.service.id == service_name:\n  657 |             return self.service\n  658 |         if not service_name:\n  659 |             self.service = None\n  660 |             return\n  661 |         try:\n  662 |             self.service = services.SERVICES[service_name]()\n  663 |         except KeyError:\n  664 |             logger.error(\"Non existent service '%s'\", service_name)\n  665 |             self.service = None\n  666 |         return self.service","lines":12,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/lutriswindow.py#L655-L666"}]},
{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"In DownloadCollectionProgressBox._progress, os.rename(ad.file.tmp_file,\nad.file.dest_file) is called when a download completes with no error handling. If the rename\nfails (cross-device link, permission, destination directory missing), it raises inside the\nidle callback, leaving the cache lock in DOWNLOADING state and the collection in an\ninconsistent partial-complete state. DownloadProgressBox._progress has the same unguarded\nos.rename.","fix":"Wrap os.rename in try/except, emit an error signal and call _cancel_all / clean up the cache lock on failure.","locations":[{"ref":"lutris/gui/widgets/download_collection_progress_box.py:344-350","code":"  344 |         # ---- Process completions ----\n  345 |         for ad in finished:\n  346 |             self.num_files_downloaded += 1\n  347 |             self._completed_sizes[ad.file.dest_file] = ad.downloader.downloaded_size\n  348 |             os.rename(ad.file.tmp_file, ad.file.dest_file)\n  349 |             update_cache_lock(ad.file.dest_file, CacheState.DOWNLOADED)\n  350 |             self._active_downloads.remove(ad)","lines":7,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/widgets/download_collection_progress_box.py#L344-L350"},{"ref":"lutris/gui/widgets/download_progress_box.py:152-154","code":"  152 |         if downloader.state == downloader.COMPLETED:\n  153 |             os.rename(self.temp, self.dest)\n  154 |             update_cache_lock(self.dest, CacheState.DOWNLOADED)","lines":3,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/widgets/download_progress_box.py#L152-L154"}]},
{"id":"ERR_10","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"notifications.send_notification calls application.send_notification on the\nresult of Gio.Application.get_default() without checking for None. If no application is\nregistered as default (e.g. called from a context where the GApplication isn't set up), this\nraises AttributeError. Most other helpers in this codebase guard get_default() returning\nNone.","fix":"Check `application = Gio.Application.get_default()` for None and return/log early if it is missing.","locations":[{"ref":"lutris/gui/widgets/notifications.py:6-14","code":"    6 | def send_notification(title, text, file_path_to_icon=\"net.lutris.Lutris\"):\n    7 |     icon_file = Gio.File.new_for_path(file_path_to_icon)\n    8 |     icon = Gio.FileIcon.new(icon_file)\n    9 |     notification = Gio.Notification.new(title)\n   10 |     notification.set_body(text)\n   11 |     notification.set_icon(icon)\n   12 | \n   13 |     application = Gio.Application.get_default()\n   14 |     application.send_notification(None, notification)","lines":9,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/widgets/notifications.py#L6-L14"}]},
{"id":"ERR_11","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"redream.py's play() never validates that 'main_file' exists before launching. Unlike nearly every other runner, it does not call system.path_exists() or raise MissingGameExecutableError. If the game's main_file is unset or points to a missing file, None or an invalid path is silently appended to the command argv, causing a confusing low-level crash from the emulator or subprocess layer instead of a clear Lutris error message.","fix":"Add a system.path_exists() check on main_file before building the command, raising MissingGameExecutableError(filename=main_file) if missing, matching the pattern used in other runners (e.g. mednafen.py, mame.py).","locations":[{"ref":"lutris/runners/redream.py:112-138","code":"  112 |     def play(self):\n  113 |         command = self.get_command()\n  114 | \n  115 |         if self.runner_config.get(\"fs\") is True:\n  116 |             command.append(\"--fullscreen=1\")\n  117 |         else:\n  118 |             command.append(\"--fullscreen=0\")\n  119 | \n  120 |         if self.runner_config.get(\"ar\"):\n  121 |             command.append(\"--aspect=\" + self.runner_config.get(\"ar\"))\n  122 | \n  123 |         if self.runner_config.get(\"region\"):\n  124 |             command.append(\"--region=\" + self.runner_config.get(\"region\"))\n  125 | \n  126 |         if self.runner_config.get(\"language\"):\n  127 |             command.append(\"--language=\" + self.runner_config.get(\"language\"))\n  128 | \n  129 |         if self.runner_config.get(\"broadcast\"):\n  130 |             command.append(\"--broadcast=\" + self.runner_config.get(\"broadcast\"))\n  131 | \n  132 |         if self.runner_config.get(\"time_sync\"):\n  133 |             command.append(\"--time_sync=\" + self.runner_config.get(\"time_sync\"))\n  134 | \n  135 |         if self.runner_config.get(\"int_res\"):\n  136 |             command.append(\"--res=\" + self.runner_config.get(\"int_res\"))\n  137 | \n  138 |         command.append(self.game_config.get(\"main_file\"))","lines":27,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/runners/redream.py#L112-L138"}]},
{"id":"ERR_12","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"reicast.py's play() reads 'iso' from game_config and uses it directly to build the '-config image=' argument without checking system.path_exists() or raising MissingGameExecutableError, unlike nearly every other runner. If 'iso' is unset, the emulator is launched with the literal string 'config:image=None', producing an obscure failure instead of a clear error.","fix":"Validate the iso path with system.path_exists() before use and raise MissingGameExecutableError(filename=iso) if missing.","locations":[{"ref":"lutris/runners/reicast.py:152-153","code":"  152 |         iso = self.game_config.get(\"iso\")\n  153 |         return {\"command\": self.get_command() + [\"-config\", f\"config:image={iso}\"]}","lines":2,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/runners/reicast.py#L152-L153"}]},
{"id":"ERR_13","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"on_playtron_import_complete re-enables back_button and cancel_button at the top, but\ncontinue_button.set_sensitive(True) only happens in the error branch and again unconditionally near\nthe end (line 574). In the success-with-zero-games branch the continue button is re-enabled (line\n574) but then display_continue_button is called turning it into a \"_Close\" button. That's fine, but\nif result is a non-list truthy value, `game_ids = result or []` keeps it and len() may raise\nTypeError for a non-sized result. The callback trusts the scanner's return type.","fix":"Validate result is a list/sized collection before len(); default defensively to an\nempty list for any unexpected type.","locations":[{"ref":"lutris/gui/addgameswindow.py:560-575","code":"  560 |         game_ids = result or []\n  561 |         count = len(game_ids)\n  562 | \n  563 |         if count == 0:\n  564 |             self.import_playtron_result_label.set_text(_(\"No new games found to import.\"))\n  565 |         else:\n  566 |             self.import_playtron_result_label.set_text(\n  567 |                 ngettext(\"Successfully imported %d game.\", \"Successfully imported %d games.\", count) % count\n  568 |             )\n  569 |             # Refresh the game library\n  570 |             application = Gio.Application.get_default()\n  571 |             if application and hasattr(application, \"window\"):\n  572 |                 application.window.refresh_view()\n  573 | \n  574 |         self.continue_button.set_sensitive(True)\n  575 |         self.display_continue_button(lambda _w: self.destroy(), label=_(\"_Close\"), suggested_action=False)","lines":16,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/addgameswindow.py#L560-L575"}]},
{"id":"ERR_14","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"_handle_keyerror does error.args[0] to format the message. A KeyError raised without arguments\n(KeyError() with empty args) makes args[0] raise IndexError inside the error handler itself,\nmasking the original error.","fix":"Guard with: key = error.args[0] if error.args else '?' before formatting the message.","locations":[{"ref":"lutris/gui/dialogs/__init__.py:808-810","code":"  808 | def _handle_keyerror(error: KeyError, parent: Gtk.Window) -> None:\n  809 |     message = _(\"The key '%s' could not be found.\") % error.args[0]\n  810 |     ErrorDialog(error, message_markup=gtk_safe(message), parent=parent)","lines":3,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/dialogs/__init__.py#L808-L810"}]},
{"id":"ERR_15","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"IssueReportWindow.on_folder_selected writes the JSON report with open(..., \"w\") and\njson.dump(...) with no exception handling. gather_system_info() output that is not JSON\nserializable, or an unwritable target folder, raises out of the signal handler. Also, the dialog\nis only destroyed after a successful write, so on failure the file chooser response handler leaves\nthe native dialog object around.","fix":"Wrap the write in try/except, show an ErrorDialog on failure, and destroy the file chooser in a\nfinally block.","locations":[{"ref":"lutris/gui/dialogs/issue.py:79-91","code":"   79 |     def on_folder_selected(self, dialog, response, _dialog):\n   80 |         if response != Gtk.ResponseType.ACCEPT:\n   81 |             return\n   82 |         target_path = dialog.get_filename()\n   83 |         if not target_path:\n   84 |             return\n   85 |         issue_path = os.path.join(target_path, \"lutris-issue-report.json\")\n   86 |         issue_info = self.get_issue_info()\n   87 |         with open(issue_path, \"w\", encoding=\"utf-8\") as issue_file:\n   88 |             json.dump(issue_info, issue_file, indent=2)\n   89 |         dialog.destroy()\n   90 |         NoticeDialog(_(\"Issue saved in %s\") % issue_path)\n   91 |         self.destroy()","lines":13,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/dialogs/issue.py#L79-L91"}]},
{"id":"ERR_16","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"LogWindow.on_save_clicked writes the log via open(log_path, \"w\") with no exception handling. If\nthe chosen path is not writable (permissions, removed device, read-only filesystem), the unhandled\nIOError/OSError propagates out of the GTK signal handler and is only caught by the global backstop,\ngiving the user a generic crash dialog instead of a clear 'could not save' message.","fix":"Wrap the file write in try/except OSError and show an ErrorDialog with a clear message on failure.","locations":[{"ref":"lutris/gui/dialogs/log.py:62-75","code":"   62 |     def on_save_clicked(self, _button: Gtk.Button) -> None:\n   63 |         \"\"\"Handler to save log to a file\"\"\"\n   64 |         now = datetime.now()\n   65 |         log_filename = \"%s (%s).log\" % (self.title, now.strftime(\"%Y-%m-%d-%H-%M\"))\n   66 |         file_dialog = FileDialog(\n   67 |             message=\"Save the logs to...\", default_path=os.path.expanduser(\"~/%s\" % log_filename), mode=\"save\"\n   68 |         )\n   69 |         log_path = file_dialog.filename\n   70 |         if not log_path:\n   71 |             return None\n   72 | \n   73 |         text = self.buffer.get_text(self.buffer.get_start_iter(), self.buffer.get_end_iter(), True)\n   74 |         with open(log_path, \"w\", encoding=\"utf-8\") as log_file:\n   75 |             log_file.write(text)","lines":14,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/dialogs/log.py#L62-L75"}]},
{"id":"ERR_17","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"on_browse_clicked opens a DirectoryDialog and immediately reads dialog.folder then invokes\nthe callback (installerwindow.py:918-923). There is no check for the user cancelling the\ndialog; if dialog.folder is empty/None on cancel, the disc-selection callback is invoked\nwith a missing folder, likely failing downstream rather than being a no-op.","fix":"Return early if dialog.folder is falsy (user cancelled) before calling the callback.","locations":[{"ref":"lutris/gui/installerwindow.py:918-923","code":"  918 |     def on_browse_clicked(self, widget, callback_data):\n  919 |         dialog = DirectoryDialog(_(\"Select the folder where the disc is mounted\"), parent=self)\n  920 |         folder = dialog.folder\n  921 |         callback = callback_data[\"callback\"]\n  922 |         requires = callback_data[\"requires\"]\n  923 |         callback(widget, requires, folder)","lines":6,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/installerwindow.py#L918-L923"}]},
{"id":"ERR_18","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"on_games_ready / apply_store re-raise background errors with 'raise error' to bounce them\nagainst an unspecified 'backstop' (lines 832, 847). These run inside AsyncCall completion\ncallbacks on the main loop; re-raising relies on a global exception backstop being\ninstalled. If that backstop is absent or changes, the exception is swallowed by the GLib\nmain loop and the spinner/overlay state can be left half-updated (e.g. spinner shown,\nstore never applied). There is no local cleanup of UI state on error.","fix":"On error, restore a sane UI state (hide spinner, show an error label) in addition to (or\ninstead of) re-raising, so a failed store build does not leave the view stuck on a\nspinner.","locations":[{"ref":"lutris/gui/lutriswindow.py:837-859","code":"  837 |         def on_games_ready(games, error):\n  838 |             if generation != self._game_store_generation:\n  839 |                 return  # no longer applicable, we got switched again!\n  840 | \n  841 |             if error:\n  842 |                 raise error  # bounce any error against the backstop\n  843 | \n  844 |             # Since get_games_from_filters() seems to be much faster than making a GameStore,\n  845 |             # we defer the spinner to here, when we know how many games we will show. If there\n  846 |             # are \"many\" we show a spinner while the store is built.\n  847 |             if len(games) > 512:\n  848 |                 self.show_spinner()\n  849 | \n  850 |             AsyncCall(make_game_store, apply_store, games)\n  851 | \n  852 |         def apply_store(result, error):\n  853 |             if generation != self._game_store_generation:\n  854 |                 return  # no longer applicable, we got switched again!\n  855 | \n  856 |             if error:\n  857 |                 raise error  # bounce any error against the backstop\n  858 | \n  859 |             games, game_store = result","lines":23,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/lutriswindow.py#L837-L859"}]},
{"id":"ERR_19","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"easyrpg.py accesses several runner_config/game_config keys via direct dict indexing instead of .get() -- e.g. self.runner_config[\"audio\"] (line 455), [\"fullscreen\"] (line 471), [\"stretch\"] (line 484), [\"vsync\"] (line 487), [\"rtp\"] (line 501), and self.game_config[\"test_play\"] (line 567), [\"hide_title\"] (line 570). Every other option read in this file (and in most other runners) uses .get() with a default. If any of these keys is absent from a saved config (e.g. a config saved before the option existed, or a hand-edited YAML), play() raises an unhandled KeyError instead of falling back to a sane default.","fix":"Use self.runner_config.get(\"audio\", <default>) / self.game_config.get(\"test_play\", False) style accesses consistent with the rest of the file, so missing legacy config keys degrade gracefully instead of crashing.","locations":[{"ref":"lutris/runners/easyrpg.py:455","code":"  455 |         if not self.runner_config[\"audio\"]:","lines":1,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/runners/easyrpg.py#L455"},{"ref":"lutris/runners/easyrpg.py:471","code":"  471 |         if self.runner_config[\"fullscreen\"]:","lines":1,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/runners/easyrpg.py#L471"},{"ref":"lutris/runners/easyrpg.py:484","code":"  484 |         if self.runner_config[\"stretch\"]:","lines":1,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/runners/easyrpg.py#L484"},{"ref":"lutris/runners/easyrpg.py:487","code":"  487 |         if not self.runner_config[\"vsync\"]:","lines":1,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/runners/easyrpg.py#L487"},{"ref":"lutris/runners/easyrpg.py:501","code":"  501 |         if not self.runner_config[\"rtp\"]:","lines":1,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/runners/easyrpg.py#L501"},{"ref":"lutris/runners/easyrpg.py:567","code":"  567 |         if self.game_config[\"test_play\"]:","lines":1,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/runners/easyrpg.py#L567"},{"ref":"lutris/runners/easyrpg.py:570","code":"  570 |         if self.game_config[\"hide_title\"]:","lines":1,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/runners/easyrpg.py#L570"}]},
{"id":"ERR_20","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"Message.read_varint() in the Amazon manifest protobuf-like decoder calls ord(stream.read(1)) in a loop with no EOF check. If the stream is truncated/empty at that point, stream.read(1) returns b\"\", and ord(b\"\") raises TypeError rather than a clear/handled parsing error. A malformed or truncated Amazon Games manifest response would surface as an unhelpful TypeError instead of a controlled parse failure.","fix":"Check for EOF explicitly:\nb = stream.read(1)\nif not b:\n    raise EOFError(\"Unexpected end of stream while reading varint\")\nbyte = ord(b)","locations":[{"ref":"lutris/util/amazon/protobuf_decoder.py:181-190","code":"  181 |     def read_varint(stream):\n  182 |         res = 0\n  183 |         i = 0\n  184 |         while 1:\n  185 |             c = ord(stream.read(1))\n  186 |             res |= (c & 127) << (i * 7)\n  187 |             if c & 128 == 0:\n  188 |                 break\n  189 |             i += 1\n  190 |         return res","lines":10,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/util/amazon/protobuf_decoder.py#L181-L190"}]},
{"id":"ERR_21","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"DiscordPresence.update() assigns self.rpc = Presence(discord_id) before calling self.rpc.connect(). If connect() raises DiscordNotFound, the except block returns without resetting self.rpc to None, leaving a never-connected Presence object stored. A later call to clear() will see self.rpc is not None and invoke methods (clear/close) on an object that was never actually connected. Module is explicitly marked unmaintained/deprecated in its docstring, limiting real-world impact.","fix":"Reset self.rpc on failure:\nexcept DiscordNotFound:\n    self.rpc = None\n    return","locations":[{"ref":"lutris/util/discord/client.py:15-27","code":"   15 |     def update(self, discord_id):\n   16 |         if self.rpc is not None:\n   17 |             # Clear the old RPC before creating a new one\n   18 |             self.clear()\n   19 | \n   20 |         # Create a new Presence object with the desired app id\n   21 |         try:\n   22 |             self.rpc = Presence(discord_id)\n   23 |             self.rpc.connect()\n   24 |         except DiscordNotFound:\n   25 |             return\n   26 | \n   27 |         self.rpc.update()","lines":13,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/util/discord/client.py#L15-L27"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"_print calls `command_line.do_print_literal(command_line, string + \"\\n\")`. do_print_literal is an\ninstance virtual method, so passing command_line again as the first positional argument passes the\nApplicationCommandLine twice (self plus an extra arg). The comment claims this is a workaround for\n\"broken pygobject bindings\", but this is fragile and version-dependent; on bindings where\ndo_print_literal has the normal (self, string) signature this raises TypeError, breaking every\ntext-output command (--list-games, --export errors, URI errors, etc.).","fix":"Use the public API `command_line.print_literal(string + \"\\n\")`, or if the binding\ntruly requires the vfunc, call `Gio.ApplicationCommandLine.do_print_literal(command_line, string + \"\\n\")`.\nVerify against the supported pygobject version and drop the doubled argument if not needed.","locations":[{"ref":"lutris/gui/application.py:448-451","code":"  448 |     @staticmethod\n  449 |     def _print(command_line: Gio.ApplicationCommandLine, string: str) -> None:\n  450 |         # Workaround broken pygobject bindings\n  451 |         command_line.do_print_literal(command_line, string + \"\\n\")  # type: ignore","lines":4,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/application.py#L448-L451"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"DialogInstallUIDelegate passes \"parent\": self into QuestionDialog/FileDialog and DownloadDialog,\nwhere self is the delegate object (e.g. a runner or window mixin), not necessarily a Gtk.Window.\nQuestionDialog does self.set_transient_for(dialog_settings[\"parent\"]) and DownloadDialog passes it\nstraight to a Dialog parent. If self is not a Gtk.Window, set_transient_for / parent handling\nraises or warns at runtime.","fix":"Resolve a real top-level window before passing it as parent (as display_error() does with\nget_toplevel()), or assert/convert self to a Gtk.Window.","locations":[{"ref":"lutris/gui/dialogs/delegates.py:135-161","code":"  135 |     def show_install_yesno_inquiry(self, question: str, title: str) -> bool:\n  136 |         dialog = dialogs.QuestionDialog(\n  137 |             {\n  138 |                 \"parent\": self,\n  139 |                 \"question\": question,\n  140 |                 \"title\": title,\n  141 |             }\n  142 |         )\n  143 |         return Gtk.ResponseType.YES == dialog.result\n  144 | \n  145 |     def show_install_file_inquiry(self, question: str, title: str, message: str) -> str | None:\n  146 |         dlg = dialogs.QuestionDialog(\n  147 |             {\n  148 |                 \"parent\": self,\n  149 |                 \"question\": question,\n  150 |                 \"title\": title,\n  151 |             }\n  152 |         )\n  153 |         if dlg.result == dlg.YES:\n  154 |             file_dlg = dialogs.FileDialog(message)\n  155 |             return file_dlg.filename\n  156 |         return None\n  157 | \n  158 |     def download_install_file(self, url: str, destination: str) -> bool:\n  159 |         dialog = DownloadDialog(url, destination, parent=self)\n  160 |         dialog.run()\n  161 |         return dialog.downloader.state == BaseDownloader.COMPLETED","lines":27,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/dialogs/delegates.py#L135-L161"},{"ref":"lutris/gui/dialogs/__init__.py:403-408","code":"  403 |     def __init__(self, dialog_settings: Dict[str, Any]) -> None:\n  404 |         super().__init__(message_type=Gtk.MessageType.QUESTION, buttons=Gtk.ButtonsType.YES_NO)\n  405 |         self.set_markup(dialog_settings[\"question\"])\n  406 |         self.set_title(dialog_settings[\"title\"])\n  407 |         if \"parent\" in dialog_settings:\n  408 |             self.set_transient_for(dialog_settings[\"parent\"])","lines":6,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/dialogs/__init__.py#L403-L408"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"UninstallDialog.on_remove_button_clicked reads row.game._id (private attribute) to call\nget_game_by_field(row.game._id, 'id'). Game exposes a public 'id' property; _id may be None for\ngames never persisted, and reaching into the private attribute couples this dialog to Game\ninternals. Using a None _id silently returns no db_game and the game is skipped from remote\nlibrary deletion.","fix":"Use row.game.id (the public accessor) and handle the not-installed/unsaved case explicitly.","locations":[{"ref":"lutris/gui/dialogs/uninstall_dialog.py:298-303","code":"  298 |         for row in rows:\n  299 |             if library_syncer and row.remove_from_library:\n  300 |                 db_game = get_game_by_field(row.game._id, \"id\")\n  301 |                 if db_game:\n  302 |                     games_removed_from_library.append(db_game)\n  303 |             row.perform_removal()","lines":6,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/dialogs/uninstall_dialog.py#L298-L303"}]},
{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"on_download_complete (file_box.py:230-238) checks isinstance(widget, SteamInstaller) to\ndecide whether to set dest_file from steam data. But this handler is only connected to the\ndownload_progress widget's 'complete' signal (file_box.py:48), never to a SteamInstaller;\nSteam completion is handled separately by on_steam_game_installed (line 240). The\nisinstance(widget, SteamInstaller) branch is therefore unreachable dead code, and the\ncomment/intent is misleading.","fix":"Drop the SteamInstaller branch from on_download_complete; it can never be a SteamInstaller. Keep only check_hash() + cache_file().","locations":[{"ref":"lutris/gui/installer/file_box.py:230-238","code":"  230 |     def on_download_complete(self, widget, _data=None):\n  231 |         \"\"\"Action called on a completed download.\"\"\"\n  232 |         logger.info(\"Download completed\")\n  233 |         self.installer_file.check_hash()\n  234 |         if isinstance(widget, SteamInstaller):\n  235 |             self.installer_file.dest_file = widget.get_steam_data_path()\n  236 |         else:\n  237 |             self.cache_file()\n  238 |         self.emit(\"file-available\")","lines":9,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/installer/file_box.py#L230-L238"}]},
{"id":"API_5","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"extras_tree_store is a TreeStore(bool, bool, object, str). Heading rows are appended with\n(None, None, None, extra_source) (installerwindow.py:569). Columns 0 and 1 are declared as\nbool (GType gboolean); passing Python None for a gboolean column is relying on PyGObject\ncoercing None->False. This is fragile/implicit and the CellRendererToggle 'active'/\n'inconsistent' attributes are bound to these columns; clearer to pass explicit False.","fix":"Append heading rows with explicit (False, False, None, extra_source).","locations":[{"ref":"lutris/gui/installerwindow.py:139-144","code":"  139 |         self.extras_tree_store = Gtk.TreeStore(\n  140 |             bool,  # is selected?\n  141 |             bool,  # is inconsistent?\n  142 |             object,  # extras dict\n  143 |             str,  # label\n  144 |         )","lines":6,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/installerwindow.py#L139-L144"},{"ref":"lutris/gui/installerwindow.py:569","code":"  569 |                 parent = self.extras_tree_store.append(None, (None, None, None, extra_source))","lines":1,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/installerwindow.py#L569"}]},
{"id":"API_6","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"StoreItem.id reads self._game_data[\"slug\"] and self._game_data[\"id\"] with subscript access that\nraises KeyError if the key is absent. self.slug and self.name likewise do self._game_data[\"slug\"]\n/ [\"name\"] unconditionally. StoreItem is constructed from arbitrary db_game / service game dicts,\nand an item lacking 'service_id', 'appid' and 'slug' (or lacking 'name'/'slug') will raise\nKeyError deep inside view population rather than degrading gracefully.","fix":"Use .get() with sensible fallbacks (e.g. self._game_data.get('slug') or '') and log when a\nrequired identifier is missing instead of letting a bare KeyError propagate into the view code.","locations":[{"ref":"lutris/gui/views/store_item.py:115-131","code":"  115 |     @property\n  116 |     def id(self) -> str:  # pylint: disable=invalid-name\n  117 |         \"\"\"Game internal ID\"\"\"\n  118 |         # Return a unique identifier for the game.\n  119 |         # Since service games are not related to lutris, use the appid\n  120 |         if \"service_id\" not in self._game_data:\n  121 |             if \"appid\" in self._game_data:\n  122 |                 _id = self._game_data[\"appid\"]\n  123 |             else:\n  124 |                 _id = self._game_data[\"slug\"]\n  125 |         else:\n  126 |             _id = self._game_data[\"id\"]\n  127 | \n  128 |         if not _id:\n  129 |             logger.error(\"No id could be found for '%s'\", self.name)\n  130 | \n  131 |         return str(_id)","lines":17,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/views/store_item.py#L115-L131"},{"ref":"lutris/gui/views/store_item.py:141-149","code":"  141 |     @property\n  142 |     def slug(self):\n  143 |         \"\"\"Slug identifier\"\"\"\n  144 |         return gtk_safe(self._game_data[\"slug\"])\n  145 | \n  146 |     @property\n  147 |     def name(self):\n  148 |         \"\"\"Name\"\"\"\n  149 |         return gtk_safe(self._game_data[\"name\"])","lines":9,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/views/store_item.py#L141-L149"}]},
{"id":"API_7","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"LogTextView.find_previous calls buffer_iter.backward_chars(...) and then uses\nbuffer_iter for backward_search, but Gtk.TextIter.backward_chars mutates the iter in place and\nreturns a bool (whether the move was fully possible), which is discarded. More importantly, the\nintent (\"go to the beginning of the searched string\" before searching backward) relies on the\nmark sitting at the END of the previous match; after find_next the mark is placed at\nnext_occurence[1] (match end), so backward_chars by len(text) lands inside/at the start of the\nalready-found match, causing find_previous to potentially re-find the same match instead of the\ntrue previous one.","fix":"Track search position consistently (store the match start as the mark, or move the iter strictly before the current match) so find_previous reliably steps to the prior occurrence.","locations":[{"ref":"lutris/gui/widgets/log_text_view.py:68-87","code":"   68 |     def find_previous(self, searched_entry: Gtk.SearchEntry) -> None:\n   69 |         # First go to the beginning of searched_entry string\n   70 |         buffer_iter = self.props.buffer.get_iter_at_mark(self.mark)\n   71 |         buffer_iter.backward_chars(len(searched_entry.get_text()))\n   72 | \n   73 |         previous_occurence = buffer_iter.backward_search(\n   74 |             searched_entry.get_text(), Gtk.TextSearchFlags.CASE_INSENSITIVE, None\n   75 |         )\n   76 | \n   77 |         # Found nothing ? Try from the end\n   78 |         if previous_occurence is None:\n   79 |             previous_occurence = self.props.buffer.get_end_iter().backward_search(\n   80 |                 searched_entry.get_text(), Gtk.TextSearchFlags.CASE_INSENSITIVE, None\n   81 |             )\n   82 | \n   83 |         # Highlight if result\n   84 |         if previous_occurence is not None:\n   85 |             self.highlight(previous_occurence[0], previous_occurence[1])\n   86 |             self.props.buffer.delete_mark(self.mark)\n   87 |             self.mark = self.create_new_mark(previous_occurence[1])","lines":20,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/widgets/log_text_view.py#L68-L87"}]},
{"id":"API_8","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"NavigationStack._update_back_button unconditionally calls\nself.cancel_button.set_visible(...), but cancel_button defaults to None in __init__. Any\nNavigationStack constructed without a cancel_button (the documented default) raises\nAttributeError on the first call to set_back_allowed / navigate_* which all invoke\n_update_back_button.","fix":"Guard the cancel_button access: `if self.cancel_button: self.cancel_button.set_visible(...)`.","locations":[{"ref":"lutris/gui/widgets/navigation_stack.py:28-60","code":"   28 |     def __init__(self, back_button, cancel_button=None, **kwargs):\n   29 |         super().__init__(**kwargs)\n   30 | \n   31 |         self.back_button = back_button\n   32 |         self.cancel_button = cancel_button\n   33 |         self.page_factories = {}\n   34 |         self.stack_pages = {}\n   35 |         self.navigation_stack = []\n   36 |         self.navigation_exit_handler = None\n   37 |         self.current_page_presenter = None\n   38 |         self.current_navigated_page_presenter = None\n   39 |         self.back_allowed = True\n   40 |         self.cancel_allowed = True\n   41 | \n   42 |     def add_named_factory(self, name, factory):\n   43 |         \"\"\"This specifies the factory functioin for the page named;\n   44 |         this function takes no arguments, but returns the page's widget.\"\"\"\n   45 |         self.page_factories[name] = factory\n   46 | \n   47 |     def set_back_allowed(self, is_allowed=True):\n   48 |         \"\"\"This turns the back button off, or back on.\"\"\"\n   49 |         self.back_allowed = is_allowed\n   50 |         self._update_back_button()\n   51 | \n   52 |     def set_cancel_allowed(self, is_allowed=True):\n   53 |         \"\"\"This turns the back button off, or back on.\"\"\"\n   54 |         self.cancel_allowed = is_allowed\n   55 |         self._update_back_button()\n   56 | \n   57 |     def _update_back_button(self):\n   58 |         can_go_back = self.back_allowed and self.navigation_stack\n   59 |         self.back_button.set_visible(can_go_back)\n   60 |         self.cancel_button.set_visible(not can_go_back and self.cancel_allowed)","lines":33,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/widgets/navigation_stack.py#L28-L60"}]},
{"id":"API_9","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"ScriptingError is constructed as ScriptingError(message, key) where key is intended as diagnostic context, but ScriptingError.__init__(self, message, message_markup=None, faulty_data=None) binds the second positional argument to message_markup, not faulty_data. The same mistaken pattern (passing diagnostic data positionally instead of via faulty_data=) recurs in lutris/installer/commands.py at lines 290, 368, and 372. As a result the diagnostic value never appears via ScriptingError.__str__/faulty_data (which is what error_handler in errors.py uses to show details in the UI's ErrorDialog), and instead gets silently treated as Pango/GTK markup text, which could also raise a markup-parsing error if the value contains characters like '<' or '&'.","fix":"Pass the diagnostic value via the faulty_data keyword consistently, e.g. raise ScriptingError(_(\"Game config key must be a string\"), faulty_data=key) and likewise faulty_data=params / faulty_data=src_ref / faulty_data=dst_ref in commands.py.","locations":[{"ref":"lutris/installer/installer.py:256-257","code":"  256 |             if not isinstance(key, str):\n  257 |                 raise ScriptingError(_(\"Game config key must be a string\"), key)","lines":2,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/installer/installer.py#L256-L257"},{"ref":"lutris/installer/commands.py:290","code":"  290 |             raise ScriptingError(_(\"Source does not exist: %s\") % src, params)","lines":1,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/installer/commands.py#L290"},{"ref":"lutris/installer/commands.py:374","code":"  374 |             raise ScriptingError(_(\"Wrong value for 'src' param\"), src_ref)","lines":1,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/installer/commands.py#L374"},{"ref":"lutris/installer/commands.py:378","code":"  378 |             raise ScriptingError(_(\"Wrong value for 'dst' param\"), dst_ref)","lines":1,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/installer/commands.py#L378"}]},
{"id":"API_10","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"WinePrefix.set_dpi() passes a bare int to set_lutris_directory_settings(), whose signature is set_lutris_directory_settings(directory: str, settings: dict[str, str], merge: bool = True). Every other call site in this file passes a dict (e.g. {\"dpi_assigned\": dpi}). This call instead does set_lutris_directory_settings(self.path, int(dpi_assigned)), passing an int where a dict is expected. This is only reached on a one-time migration path (reading an obsolete .lutris_dpi_assignment file), but when it does run it will raise inside set_lutris_directory_settings (e.g. AttributeError from calling dict methods on an int), get caught by the broad except Exception in set_dpi, and silently fail to migrate the old DPI setting while logging a misleading exception.","fix":"Pass a dict as the other call sites do:\nset_lutris_directory_settings(self.path, {\"dpi_assigned\": dpi_assigned})","locations":[{"ref":"lutris/util/wine/prefix.py:286-294","code":"  286 |         # Convert the old hidden file into a 'lutris.json' settings file\n  287 |         obsolete_path = os.path.join(self.path, \".lutris_dpi_assignment\")\n  288 |         try:\n  289 |             if os.path.isfile(obsolete_path):\n  290 |                 with open(obsolete_path, \"r\", encoding=\"utf-8\") as f:\n  291 |                     dpi_assigned = int(f.read())\n  292 |                 set_lutris_directory_settings(self.path, int(dpi_assigned))\n  293 |                 os.unlink(obsolete_path)\n  294 |         except Exception as ex:","lines":9,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/util/wine/prefix.py#L286-L294"}]},
{"id":"API_11","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"present_install_from_setup_page builds the preset and locale ListStores by appending to\nself.installer_presets / self.installer_locale inside create_install_from_setup_page. Because the\nNavigationStack uses named factories that may be invoked more than once (e.g. re-entering the page),\nthe same rows get appended again, duplicating preset/locale entries each visit. The factory should\nbuild the model once or clear it first.","fix":"Clear the ListStores at the start of the factory (self.installer_presets.clear())\nor populate them once in __init__ rather than in the page factory.","locations":[{"ref":"lutris/gui/addgameswindow.py:334-341","code":"  334 |         self.installer_presets.append([\"win11\", _(\"Windows 11 64-bit\")])\n  335 |         self.installer_presets.append([\"win10\", _(\"Windows 10 64-bit (Default)\")])\n  336 |         self.installer_presets.append([\"win7\", _(\"Windows 7 64-bit\")])\n  337 | \n  338 |         wine_version = LutrisConfig(runner_slug=\"wine\").runner_config.get(\"version\")\n  339 |         if wine_version != GE_PROTON_LATEST and not is_proton_version(wine_version):\n  340 |             self.installer_presets.append([\"winxp\", _(\"Windows XP 32-bit\")])\n  341 |             self.installer_presets.append([\"win98\", _(\"Windows 98 32-bit\")])","lines":8,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/addgameswindow.py#L334-L341"},{"ref":"lutris/gui/addgameswindow.py:356-358","code":"  356 |         locale_list = sysoptions.get_locale_choices()\n  357 |         for locale_humanized, locale in locale_list:\n  358 |             self.installer_locale.append([locale, _(locale_humanized)])","lines":3,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/addgameswindow.py#L356-L358"}]},
{"id":"API_12","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"do_handle_local_options uses print() for the version output instead of the command_line print\nhelpers, and sets logger.setLevel(logging.NOTSET) as a side effect of --version. Using bare print()\nhere is inconsistent with the rest of the CLI (which routes through _print/command_line) and writes\nto the primary process stdout, not necessarily the invoking terminal when invoked remotely.","fix":"do_handle_local_options runs in the local instance so print() is acceptable here, but\nmake it consistent and drop the unrelated logger.setLevel side effect or document why version\nprinting changes the log level.","locations":[{"ref":"lutris/gui/application.py:453-461","code":"  453 |     def do_handle_local_options(self, options: GLib.VariantDict) -> int:\n  454 |         # Text only commands\n  455 | \n  456 |         # Print Lutris version and exit\n  457 |         if options.contains(\"version\"):\n  458 |             executable_name = os.path.basename(sys.argv[0])\n  459 |             print(executable_name + \"-\" + settings.VERSION)\n  460 |             logger.setLevel(logging.NOTSET)\n  461 |             return 0","lines":9,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/application.py#L453-L461"}]},
{"id":"API_13","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"RunnerConfigDialog.on_save has signature on_save(self, _wigdet, data=None) while the base class\nSavableModelessDialog / GameDialogCommon connect 'save' related handlers as on_save(self, button).\nThe extra 'data' parameter and the typo '_wigdet' suggest copy-paste; if the save button signal ever\npasses user_data the signature mismatch could break, and the typo'd name is confusing.","fix":"Match the base on_save(self, _button) signature and fix the '_wigdet' typo.","locations":[{"ref":"lutris/gui/config/runner.py:29-32","code":"   29 |     def on_save(self, _wigdet, data=None):\n   30 |         self.lutris_config.save()\n   31 |         self.emit(\"runner-updated\", self.runner_name)\n   32 |         self.destroy()","lines":4,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/config/runner.py#L29-L32"}]},
{"id":"API_14","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"ConfigErrorBox / ConfigWarningBox warning boxes are appended to self.warning_messages in\nconfigure_warning_messages and reset via self.warning_messages.clear() at the start of\ngenerate_widget. However warning_messages is a per-generator attribute shared across all options;\nbetween generate_widget for option A and create_option_container for the same option the list is\ncorrect, but get_condition (line 769-775) iterates container.get_children() looking for\nblocks_sensitivity. This relies on the error box being a direct child of the option container.\nConfigWidgetGenerator.create_option_container wraps the wrapper in an extra reset_container before\ncalling super().create_option_container, so for the config dialog the error boxes are siblings of\nreset_container inside the outer box - which is the container get_condition inspects - so it still\nworks, but the coupling between container nesting depth and get_condition's direct-children scan is\nfragile and undocumented.","fix":"Make blocks_sensitivity detection robust to nesting (e.g. recurse, or track the error boxes\nexplicitly in a dict keyed by option), rather than depending on them being direct children of the\nspecific container layer get_condition happens to receive.","locations":[{"ref":"lutris/gui/config/widget_generator.py:769-775","code":"  769 |         container = self.option_containers[option[\"option\"]]\n  770 | \n  771 |         for child in container.get_children():\n  772 |             if hasattr(child, \"blocks_sensitivity\") and child.blocks_sensitivity:\n  773 |                 return False\n  774 | \n  775 |         return condition","lines":7,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/config/widget_generator.py#L769-L775"},{"ref":"lutris/gui/config/boxes.py:295-320","code":"  295 |     def create_option_container(self, option: dict[str, Any], wrapper: Gtk.Widget) -> Gtk.Container:\n  296 |         option_key = option[\"option\"]\n  297 |         reset_container = Gtk.Box(visible=True)\n  298 |         reset_container.set_margin_left(18)\n  299 |         reset_container.pack_start(wrapper, True, True, 0)\n  300 | \n  301 |         reset_button = Gtk.Button.new_from_icon_name(\"edit-undo-symbolic\", Gtk.IconSize.MENU)\n  302 |         reset_button.get_style_context().add_class(\"reset-button\")\n  303 |         reset_button.set_valign(Gtk.Align.CENTER)\n  304 |         reset_button.set_halign(Gtk.Align.CENTER)\n  305 |         reset_button.set_margin_bottom(6)\n  306 |         reset_button.set_relief(Gtk.ReliefStyle.NONE)\n  307 |         reset_button.set_tooltip_text(_(\"Reset option to global or default config\"))\n  308 |         reset_button.connect(\"clicked\", self.on_reset_button_clicked, option)\n  309 |         self.reset_buttons[option_key] = reset_button\n  310 | \n  311 |         if option_key not in self.raw_config:\n  312 |             reset_button.set_visible(False)\n  313 |             reset_button.set_no_show_all(True)\n  314 | \n  315 |         placeholder = Gtk.Box()\n  316 |         placeholder.set_size_request(28, -1)\n  317 | \n  318 |         placeholder.pack_start(reset_button, False, False, 0)\n  319 |         reset_container.pack_end(placeholder, False, False, 5)\n  320 |         return super().create_option_container(option, reset_container)","lines":26,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/config/boxes.py#L295-L320"}]},
{"id":"API_15","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"InstallerScriptBox.get_install_button uses Gtk.Alignment and Alignment.set(...) (script_box.py:59-67),\nand get_notes/get_credits return bare Gtk.Alignment() placeholders (lines 73,79). Gtk.Alignment\nis deprecated since GTK 3.14 in favor of halign/valign/margin properties on the child widget.\nUsing it works but is deprecated API.","fix":"Replace Gtk.Alignment with halign/valign on the button (e.g. Gtk.Align.START) and return None / empty Gtk.Box instead of Gtk.Alignment placeholders.","locations":[{"ref":"lutris/gui/installer/script_box.py:57-67","code":"   57 |     def get_install_button(self):\n   58 |         \"\"\"Return the install button widget\"\"\"\n   59 |         align = Gtk.Alignment()\n   60 |         align.set(0, 0, 0, 0)\n   61 | \n   62 |         install_button = Gtk.Button(_(\"Install\"))\n   63 |         install_button.connect(\"clicked\", self.on_install_clicked)\n   64 |         style_context = install_button.get_style_context()\n   65 |         style_context.add_class(\"suggested-action\")\n   66 |         align.add(install_button)\n   67 |         return align","lines":11,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/installer/script_box.py#L57-L67"},{"ref":"lutris/gui/installer/script_box.py:69-80","code":"   69 |     def get_notes(self):\n   70 |         \"\"\"Return the notes widget\"\"\"\n   71 |         notes = self.script[\"notes\"].strip()\n   72 |         if not notes:\n   73 |             return Gtk.Alignment()\n   74 |         return self._get_installer_label(notes)\n   75 | \n   76 |     def get_credits(self):\n   77 |         credits_text = self.script.get(\"credits\", \"\").strip()\n   78 |         if not credits_text:\n   79 |             return Gtk.Alignment()\n   80 |         return self._get_installer_label(gtk_safe_urls(credits_text))","lines":12,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/installer/script_box.py#L69-L80"}]},
{"id":"API_16","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"InstallerPicker.on_activate and InstallerScriptBox.on_install_clicked reach into widget\ninternals with row.get_children()[0] (script_picker.py:24-27) assuming the ListBoxRow's\nfirst child is the InstallerScriptBox. This brittle index-based child access breaks if the\nrow layout changes and silently indexes the wrong widget.","fix":"Use row.get_child() (ListBoxRow has a single child) instead of get_children()[0].","locations":[{"ref":"lutris/gui/installer/script_picker.py:20-27","code":"   20 |     @staticmethod\n   21 |     def on_activate(widget, row):\n   22 |         \"\"\"Handler for hiding and showing the revealers in children\"\"\"\n   23 |         for script_box_row in widget:\n   24 |             script_box = script_box_row.get_children()[0]\n   25 |             script_box.reveal(False)\n   26 |         installer_row = row.get_children()[0]\n   27 |         installer_row.reveal()","lines":8,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/installer/script_picker.py#L20-L27"}]},
{"id":"API_17","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"The 'toggle-badges' action default is built from settings.read_setting(...) which returns\na string (\"\" when unset, or \"True\"/\"False\"). This string is passed as the default for a\nboolean (\"b\") GLib.Variant (lines 256-261, used at line 310). PyGObject coerces it with\nbool(), so the empty-string default becomes False and the string \"False\" becomes True\n(non-empty string is truthy) - the opposite of the intended saved value. The badge toggle\ndefault state can therefore be inverted relative to the stored setting.","fix":"Use settings.read_bool_setting(\"hide_badges_on_icons\") for the default so a real bool is\npassed to GLib.Variant(\"b\", ...), matching how the value is read elsewhere\n(on_toggle_badges / update_view_settings).","locations":[{"ref":"lutris/gui/lutriswindow.py:264-269","code":"  264 |             \"toggle-badges\": Action(\n  265 |                 self.on_toggle_badges,\n  266 |                 type=\"b\",\n  267 |                 default=settings.read_setting(\"hide_badges_on_icons\"),\n  268 |                 accel=\"<Primary>p\",\n  269 |             ),","lines":6,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/lutriswindow.py#L264-L269"},{"ref":"lutris/gui/lutriswindow.py:315-321","code":"  315 |                 default_value = None\n  316 |                 param_type = None\n  317 |                 if value.default is not None:\n  318 |                     default_value = GLib.Variant(value.type, value.default)\n  319 |                 if value.type != \"b\":\n  320 |                     param_type = default_value.get_type()\n  321 |                 action = Gio.SimpleAction.new_stateful(name, param_type, default_value)","lines":7,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/lutriswindow.py#L315-L321"}]},
{"id":"API_18","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"show_label() constructs Gtk.Label(message, visible=True) passing the text as the first\npositional argument. In PyGObject the first positional constructor arg is not 'label'; the\ndocumented/safe form is Gtk.Label(label=message, ...). Relying on positional ordering for\nGObject constructors is fragile and inconsistent with the rest of the file which uses\nkeyword args (e.g. Gtk.HBox(visible=True), Gtk.Image(visible=True)).","fix":"Use Gtk.Label(label=message, visible=True).","locations":[{"ref":"lutris/gui/lutriswindow.py:929-931","code":"  929 |     def show_label(self, message):\n  930 |         \"\"\"Display a label in the middle of the UI\"\"\"\n  931 |         self.show_overlay(Gtk.Label(message, visible=True))","lines":3,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/lutriswindow.py#L929-L931"}]},
{"id":"API_19","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"GridViewCellRendererImage attribute setup in grid.py uses self.image_renderer with show_badges and\nCOL_PLATFORM, while list.py's media_column does not include platform/badges at all\n(media_paths/is_installed/game_id only). base.on_missing_games_updated triggers queue_draw only\nwhen image_renderer.show_badges, but the list view renderer never gets show_badges set, so missing-\ngame badge updates never refresh the list view even though it shares the same renderer class.","fix":"If badges are intended in list view, configure show_badges/platform attribute on the list media\ncolumn; otherwise document that the list view intentionally has no badges so the queue_draw guard\nis understood.","locations":[{"ref":"lutris/gui/views/grid.py:71-78","code":"   71 |     def _initialize_image_renderer_attributes(self):\n   72 |         if self.image_renderer:\n   73 |             self.image_renderer.show_badges = self.show_badges\n   74 |             self.clear_attributes(self.image_renderer)\n   75 |             self.add_attribute(self.image_renderer, \"game_id\", COL_ID)\n   76 |             self.add_attribute(self.image_renderer, \"media_paths\", COL_MEDIA_PATHS)\n   77 |             self.add_attribute(self.image_renderer, \"platform\", COL_PLATFORM)\n   78 |             self.add_attribute(self.image_renderer, \"is_installed\", COL_INSTALLED)","lines":8,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/views/grid.py#L71-L78"},{"ref":"lutris/gui/views/list.py:44-52","code":"   44 |         if settings.SHOW_MEDIA:\n   45 |             self.image_renderer = GridViewCellRendererImage()\n   46 |             self.media_column = Gtk.TreeViewColumn(\n   47 |                 \"\", self.image_renderer, media_paths=COL_MEDIA_PATHS, is_installed=COL_INSTALLED, game_id=COL_ID\n   48 |             )\n   49 |             self.media_column.set_reorderable(True)\n   50 |             self.media_column.set_sort_indicator(False)\n   51 |             self.media_column.set_sizing(Gtk.TreeViewColumnSizing.FIXED)\n   52 |             self.append_column(self.media_column)","lines":9,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/views/list.py#L44-L52"},{"ref":"lutris/gui/views/base.py:55-57","code":"   55 |     def on_missing_games_updated(self):\n   56 |         if self.image_renderer and self.image_renderer.show_badges:\n   57 |             self.queue_draw()","lines":3,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/views/base.py#L55-L57"}]},
{"id":"API_20","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"StockIconImage connects to the icon theme \"changed\" signal in _on_realize and\ndisconnects in _on_unrealize, but it uses Gtk.IconTheme.get_default() in both places. If the\ndefault icon theme object differs between realize and unrealize (it generally does not, but is\nprocess-global and could be swapped via load_icon_theme path manipulation), the disconnect\nwould target a different object and leak the handler. More practically, multiple realize/\nunrealize cycles are fine, but a widget realized but never unrealized (destroyed while\nrealized) leaks the connection because there is no 'destroy' cleanup.","fix":"Also disconnect on 'destroy', and cache the theme object connected to so the matching object is used for disconnect.","locations":[{"ref":"lutris/gui/widgets/stock_icon_image.py:42-52","code":"   42 |     def _on_realize(self, _widget: Gtk.Widget) -> None:\n   43 |         theme = Gtk.IconTheme.get_default()\n   44 |         self._theme_changed_handler_id = theme.connect(\"changed\", self._on_theme_changed)\n   45 | \n   46 |     def _on_unrealize(self, _widget: Gtk.Widget) -> None:\n   47 |         if self._theme_changed_handler_id:\n   48 |             Gtk.IconTheme.get_default().disconnect(self._theme_changed_handler_id)\n   49 |             self._theme_changed_handler_id = 0\n   50 | \n   51 |     def _on_theme_changed(self, _theme: Gtk.IconTheme) -> None:\n   52 |         self._reload_icon()","lines":11,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/widgets/stock_icon_image.py#L42-L52"}]},
{"id":"API_21","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"UbisoftClient.get_configuration() calls self._do_request_safe(...) and then `.json()` on the result, but _do_request_safe() delegates to _do_request(), which already calls response.json() and returns the parsed dict. Calling .json() again on a plain dict raises AttributeError. The method appears unused elsewhere in the codebase (lutris/services/ubisoft.py has its own differently-named get_configurations()), so this is likely dead/untested code, but it is a genuine crash if ever invoked.","fix":"Return the already-parsed result directly: return self._do_request_safe(\"get\", \"https://uplaywebcenter.ubi.com/v1/configuration\")","locations":[{"ref":"lutris/util/ubisoft/client.py:294-296","code":"  294 |     def get_configuration(self):\n  295 |         response = self._do_request_safe(\"get\", \"https://uplaywebcenter.ubi.com/v1/configuration\")\n  296 |         return response.json()","lines":3,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/util/ubisoft/client.py#L294-L296"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"high","difficulty":"medium","description":"get_service_games() updates the module-global _SERVICE_CACHE_ACCESSED to time.time() before comparing it against the previous value, so the staleness check (_SERVICE_CACHE_ACCESSED - previous_cache_accessed > 1) actually measures the time between this call and the immediately preceding call, not the age of the cached data. For any two calls spaced more than one second apart (the normal case for UI-driven calls), this condition is always true, so the cache is rebuilt from the database on essentially every call, defeating the purpose of the cache entirely (a DB query and list comprehension over all installed games runs on practically every invocation).","fix":"Compare against the cache's own age recorded before the refresh, not the previous-call-to-this-call delta. E.g. only update _SERVICE_CACHE_ACCESSED inside the if-block after refreshing the cache: check 'time.time() - _SERVICE_CACHE_ACCESSED > 1' first (without overwriting), and only set _SERVICE_CACHE_ACCESSED = time.time() once the cache is actually rebuilt.","locations":[{"ref":"lutris/database/games.py:134-146","code":"  134 | def get_service_games(service: str) -> list[str]:\n  135 |     \"\"\"Return the list of all installed games for a service\"\"\"\n  136 |     global _SERVICE_CACHE_ACCESSED\n  137 |     previous_cache_accessed = _SERVICE_CACHE_ACCESSED or 0\n  138 |     _SERVICE_CACHE_ACCESSED = time.time()\n  139 |     if service not in _SERVICE_CACHE or _SERVICE_CACHE_ACCESSED - previous_cache_accessed > 1:\n  140 |         if service == \"lutris\":\n  141 |             _SERVICE_CACHE[service] = [game[\"slug\"] for game in get_games(filters={\"installed\": \"1\"})]\n  142 |         else:\n  143 |             _SERVICE_CACHE[service] = [\n  144 |                 game[\"service_id\"] for game in get_games(filters={\"service\": service, \"installed\": \"1\"})\n  145 |             ]\n  146 |     return _SERVICE_CACHE[service]","lines":13,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/database/games.py#L134-L146"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"update_missing_games_sidebar_row() calls self.get_missing_games(), which runs\ngames_db.get_games_by_ids(...), filter_games(...) and a full apply_view_sort over all\nmissing games, purely to decide whether the sidebar 'missing' row should be shown or\nhidden. It only needs to know whether any missing games exist. This is registered on\nMISSING_GAMES.updated and also called from refresh_view(), so the expensive build+sort\nruns on every refresh even when the result list is discarded.","fix":"Use a cheap existence check (e.g. bool(MISSING_GAMES.missing_game_ids) combined with a\nlightweight filtered count) to decide visibility, and only build the full sorted list when\nthe missing category is actually the selected view.","locations":[{"ref":"lutris/gui/lutriswindow.py:599-609","code":"  599 |     def update_missing_games_sidebar_row(self) -> None:\n  600 |         missing_games = self.get_missing_games()\n  601 |         if missing_games:\n  602 |             self.sidebar.missing_row.show()\n  603 |             if self.selected_category == (\"dynamic_category\", \"missing\"):\n  604 |                 self.update_store()\n  605 |         else:\n  606 |             missing_ids = MISSING_GAMES.missing_game_ids\n  607 |             if missing_ids:\n  608 |                 logger.warning(\"Path cache out of date? (%s IDs missing)\", len(missing_ids))\n  609 |             self.sidebar.missing_row.hide()","lines":11,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/lutriswindow.py#L599-L609"},{"ref":"lutris/gui/lutriswindow.py:595-597","code":"  595 |     def get_missing_games(self):\n  596 |         games = games_db.get_games_by_ids(MISSING_GAMES.missing_game_ids)\n  597 |         return self.apply_view_sort(self.filter_games(games))","lines":3,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed0
