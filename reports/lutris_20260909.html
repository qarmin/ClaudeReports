{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"DialogLaunchUIDelegate.select_game_launch_config.get_preferred_config_index: when preferred_name is\nset but preferred_index is falsy/None, it falls through to a linear name scan returning index+1.\nBut game_config.get(\"preferred_launch_config_index\") is typed as int and used in\nconfigs[preferred_index - 1]; if it is stored as a string (configs are loaded from YAML/JSON), the\n'configs[preferred_index - 1]' indexing and the 'preferred_index == 0' comparison behave\nincorrectly (string vs int), potentially selecting the wrong config or raising TypeError.","fix":"Coerce preferred_index to int (with a try/except) before comparisons and indexing, defaulting to\nNone on failure.","locations":[{"ref":"lutris/gui/dialogs/delegates.py:207-230","code":"  207 |         def get_preferred_config_index() -> int | None:\n  208 |             # Validate that the settings are still valid; we need the index to\n  209 |             # cope when two configs have the same name but we insist on a name\n  210 |             # match. Returns None if it can't find a match, and then the user\n  211 |             # must decide.\n  212 |             preferred_name = game_config.get(\"preferred_launch_config_name\")\n  213 |             preferred_index: int = game_config.get(\"preferred_launch_config_index\")\n  214 | \n  215 |             if preferred_index == 0 or preferred_name == Game.PRIMARY_LAUNCH_CONFIG_NAME:\n  216 |                 return 0\n  217 | \n  218 |             if preferred_name:\n  219 |                 if preferred_index:\n  220 |                     try:\n  221 |                         if configs[preferred_index - 1].get(\"name\") == preferred_name:\n  222 |                             return preferred_index\n  223 |                     except IndexError:\n  224 |                         pass\n  225 | \n  226 |                 for index, config in enumerate(configs):\n  227 |                     if config.get(\"name\") == preferred_name:\n  228 |                         return index + 1\n  229 | \n  230 |             return None","lines":24,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/dialogs/delegates.py#L207-L230"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"WebConnectDialog builds webview_locales but always keeps 'en_US' as the final fallback by\nprepending. The debug log reports webview_locales[-1] as the '[Default]'. That part is fine, but\nthe locale strings are passed verbatim to set_preferred_languages after only splitting on '.'.\nA LANG like 'C' or 'POSIX' (common in minimal environments) is forwarded as a bogus preferred\nlanguage. More notably, environment_locale_lang and lutris_locale are not validated, so malformed\nvalues silently become webview language preferences.","fix":"Filter out non-locale values ('C', 'POSIX', empty) before adding to webview_locales, normalizing\nto a language code form WebKit expects.","locations":[{"ref":"lutris/gui/dialogs/webconnect_dialog.py:38-55","code":"   38 |         # Set locale\n   39 |         # Locale fallback routine:\n   40 |         # Lutris locale -> System environment locale -> US English\n   41 |         webview_locales = [\"en_US\"]\n   42 |         lutris_config = LutrisConfig()\n   43 |         environment_locale_lang = os.environ.get(\"LANG\")\n   44 |         if environment_locale_lang:\n   45 |             webview_locales = [environment_locale_lang.split(\".\")[0]] + webview_locales\n   46 |         lutris_locale = lutris_config.system_config.get(\"locale\")\n   47 |         if lutris_locale:\n   48 |             webview_locales = [lutris_locale.split(\".\")[0]] + webview_locales\n   49 |         logger.debug(\n   50 |             f\"Webview locale fallback order: \"\n   51 |             f\"[Lutris locale]: '{lutris_locale}' -> \"\n   52 |             f\"[env: LANG]: '{environment_locale_lang}' -> \"\n   53 |             f\"[Default]: '{webview_locales[-1]}'\"\n   54 |         )\n   55 |         self.context.set_preferred_languages(webview_locales)","lines":18,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/dialogs/webconnect_dialog.py#L38-L55"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In start_all(), the download-throttling counter started_downloads is incremented for every\nnot-yet-available 'download' file and compared with max_downloads. Files beyond the limit\nare queued in self._file_queue and later started LIFO via _file_queue.pop() in\non_file_available (files_box.py:111). pop() removes the LAST queued item, so queued\ndownloads start in reverse order. Combined with dict insertion order this means files are\nnot downloaded in the order presented; for ordered/patch-style installs this is surprising.","fix":"Use a collections.deque and popleft(), or self._file_queue.pop(0), to preserve FIFO ordering of queued downloads.","locations":[{"ref":"lutris/gui/installer/files_box.py:58-66","code":"   58 |         started_downloads = 0\n   59 |         for file_id, file_entry in self.installer_files_boxes.items():\n   60 |             if file_id not in self.available_files:\n   61 |                 if file_entry.provider == \"download\":\n   62 |                     started_downloads += 1\n   63 |                     if started_downloads <= self.max_downloads:\n   64 |                         file_entry.start()\n   65 |                     else:\n   66 |                         self._file_queue.append(file_id)","lines":9,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/installer/files_box.py#L58-L66"},{"ref":"lutris/gui/installer/files_box.py:110-112","code":"  110 |         if self._file_queue:\n  111 |             next_file_id = self._file_queue.pop()\n  112 |             self.installer_files_boxes[next_file_id].start()","lines":3,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/installer/files_box.py#L110-L112"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"cache_button.is_available is a lambda that returns truthy when there is no interpreter or\nthe interpreter has script_files (installerwindow.py:132). display_buttons (line 1128) calls\nb.is_available() for buttons that define it. The continue_button and source_button do not\ndefine is_available, so 'not hasattr(b,...)' is True for them - fine. But the cache_button's\npredicate accesses self.interpreter.installer.script_files; during early pages interpreter is\nNone (handled), yet once interpreter exists but installer attribute access raises if installer\nis not yet set, this lambda can throw inside display_buttons. Worth confirming installer is\nalways set whenever interpreter is non-None.","fix":"Guard the lambda defensively: 'not self.interpreter or bool(getattr(self.interpreter.installer, \"script_files\", None))' or ensure installer is set before any display_buttons call.","locations":[{"ref":"lutris/gui/installerwindow.py:132","code":"  132 |         self.cache_button.is_available = lambda: not self.interpreter or bool(self.interpreter.installer.script_files)","lines":1,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/installerwindow.py#L132"},{"ref":"lutris/gui/installerwindow.py:1128-1132","code":" 1128 |         all_buttons = [self.cache_button, self.source_button, self.continue_button]\n 1129 | \n 1130 |         for b in all_buttons:\n 1131 |             available = not hasattr(b, \"is_available\") or b.is_available()\n 1132 |             b.set_visible(b in buttons and available)","lines":5,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/installerwindow.py#L1128-L1132"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"on_extra_toggled updates the parent heading checkbox state only when a leaf (extra) row is\ntoggled (the 'else' branch at line 627). When a heading row itself is toggled (the 'if\niter_has_child' branch), it propagates down to children but the heading's own inconsistent\nflag is force-cleared to False at line 619 before the child loop, which is fine; however the\nrecompute loop in the else branch iterates ALL heading rows on every leaf toggle, which is\nO(headings*children) per click and recomputes unrelated headings. Minor, but the asymmetry\nalso means toggling a heading never sets inconsistent=False consistently if a child toggle\nhandler is skipped. Primarily this is an unnecessary full re-scan on each leaf toggle.","fix":"When a leaf toggles, recompute only its own parent heading (via model.iter_parent) instead of looping over every heading row.","locations":[{"ref":"lutris/gui/installerwindow.py:614-641","code":"  614 |     def on_extra_toggled(self, _widget, path, model):\n  615 |         toggled_row = model[path]\n  616 |         toggled_row_iter = model.get_iter(path)\n  617 | \n  618 |         toggled_row[0] = not toggled_row[0]\n  619 |         toggled_row[1] = False\n  620 | \n  621 |         if model.iter_has_child(toggled_row_iter):\n  622 |             extra_iter = model.iter_children(toggled_row_iter)\n  623 |             while extra_iter:\n  624 |                 extra_row = model[extra_iter]\n  625 |                 extra_row[0] = toggled_row[0]\n  626 |                 extra_iter = model.iter_next(extra_iter)\n  627 |         else:\n  628 |             for heading_row in model:\n  629 |                 all_extras_active = True\n  630 |                 any_extras_active = False\n  631 |                 extra_iter = model.iter_children(heading_row.iter)\n  632 |                 while extra_iter:\n  633 |                     extra_row = model[extra_iter]\n  634 |                     if extra_row[0]:\n  635 |                         any_extras_active = True\n  636 |                     else:\n  637 |                         all_extras_active = False\n  638 |                     extra_iter = model.iter_next(extra_iter)\n  639 | \n  640 |                 heading_row[0] = all_extras_active\n  641 |                 heading_row[1] = any_extras_active","lines":28,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/installerwindow.py#L614-L641"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"update_store() schedules self.update_revealer via GLib.idle_add(self.update_revealer) with\nNO games argument (line 857). With games=None, update_revealer keeps the existing game_bar\n(the 'pass' branch) and only toggles the revealer based on current children. So after the\nstore is rebuilt and the selection is recomputed (lines 864-870), the game_bar may still\nshow a game that is no longer selected or no longer present, because update_revealer was\ncalled with None rather than the new selection. The selection change handler\n(on_game_selection_changed) is what passes real games, but set_selected() may not always\nre-fire it.","fix":"After recomputing the selection, call update_revealer with the actual selected games (or\nexplicitly refresh the game bar) so a stale game bar is not left showing a game that is no\nlonger selected/present.","locations":[{"ref":"lutris/gui/lutriswindow.py:864-880","code":"  864 |             for view in self.views.values():\n  865 |                 view.service = self.service\n  866 | \n  867 |             GLib.idle_add(self.update_revealer)\n  868 | \n  869 |             if self.game_store != game_store:\n  870 |                 self.game_store = game_store\n  871 | \n  872 |                 view_type = self.current_view_type\n  873 | \n  874 |                 if view_type in self.views:\n  875 |                     view = self.views[view_type]\n  876 |                     self.current_view = view\n  877 |                     selected_ids = [view.get_game_id_for_path(p) for p in view.get_selected()]\n  878 |                     view.set_game_store(self.game_store)\n  879 |                     new_selection = [view.get_path_for_game_id(game_id) for game_id in selected_ids]\n  880 |                     view.set_selected(filter(None, new_selection), scroll_into_view=True)","lines":17,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/lutriswindow.py#L864-L880"}]},
{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"on_lutris_log_in_label_activate_link creates a ClientLoginDialog and connects to its\n'connected' signal but never keeps a reference and the local 'login_dialog' goes out of\nscope at function end. The on_connect_success closure is the only thing referencing the\ndialog (via the signal connection held by the dialog itself). If the dialog is a GTK\nbuilder dialog that does not run a modal loop, nothing in this method guarantees it stays\nshown / alive, and the handler binding is easy to break. At minimum the unused\n'login_dialog' assignment plus the fire-and-forget connect is fragile and the return value\nis ignored.","fix":"Keep an explicit reference to the dialog (e.g. self._login_dialog) until 'connected'/\n'cancel' fires, and verify the dialog is actually presented (run/show) before relying on\nthe signal.","locations":[{"ref":"lutris/gui/lutriswindow.py:1116-1123","code":" 1116 |     @GtkTemplate.Callback\n 1117 |     def on_lutris_log_in_label_activate_link(self, _label, _url):\n 1118 |         def on_connect_success(widget, _username):\n 1119 |             self.sync_library(force=True)\n 1120 | \n 1121 |         self.login_notification_revealer.set_reveal_child(False)\n 1122 |         login_dialog = ClientLoginDialog(parent=self)\n 1123 |         login_dialog.connect(\"connected\", on_connect_success)","lines":8,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/lutriswindow.py#L1116-L1123"}]},
{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"on_toggle_badges reads settings.read_setting(\"hide_badges_on_icons\").lower() == \"true\" to\nget the current state, then writes 'not state' and calls on_settings_changed with\n'not state'. But the action's stored GVariant state (set up via the 'toggle-badges'\nstateful action) is never updated with action.set_state(), unlike every other stateful\ntoggle handler in this file (on_show_installed_state_change, on_side_panel_state_change,\netc. all call action.set_state(value)). The menu checkbox state and the actual setting can\ndrift out of sync.","fix":"Follow the pattern of the other toggle handlers: accept and apply the action value /\ncall self.actions[\"toggle-badges\"].set_state(...) so the action state, the setting, and\nthe UI stay consistent.","locations":[{"ref":"lutris/gui/lutriswindow.py:1393-1397","code":" 1393 |     def on_toggle_badges(self, _widget, _data):\n 1394 |         \"\"\"Event handler to toggle badge visibility\"\"\"\n 1395 |         state = settings.read_setting(\"hide_badges_on_icons\").lower() == \"true\"\n 1396 |         settings.write_setting(\"hide_badges_on_icons\", not state)\n 1397 |         self.on_settings_changed(None, not state, \"hide_badges_on_icons\")","lines":5,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/lutriswindow.py#L1393-L1397"}]},
{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"GameListView.get_selected returns None when there is no selection (get_selected_rows() falsy),\nbut GameGridView.get_selected returns a list. base.GameView.get_selected_game_id does\nlen(selected) and popup_contextual_menu does 'current_path not in selection' / iterates selection.\nWith the list view returning None, len(None) and 'in None' raise TypeError. The base\nget_selected() default returns [] specifically to avoid this, but the list override breaks the\ncontract.","fix":"Return an empty list instead of None from GameListView.get_selected (e.g. 'return selection[1] if\nselection else []').","locations":[{"ref":"lutris/gui/views/list.py:127-132","code":"  127 |     def get_selected(self):\n  128 |         \"\"\"Return list of all selected items\"\"\"\n  129 |         selection = self.get_selection().get_selected_rows()\n  130 |         if not selection:\n  131 |             return None\n  132 |         return selection[1]","lines":6,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/views/list.py#L127-L132"},{"ref":"lutris/gui/views/base.py:119-125","code":"  119 |     def get_selected_game_id(self):\n  120 |         \"\"\"Returns the ID of the selected game, if there is exactly one- or\n  121 |         None if there is no selection or a multiple-selection.\"\"\"\n  122 |         selected = self.get_selected()\n  123 |         if len(selected) == 1:\n  124 |             return self.get_game_id_for_path(selected[0])\n  125 |         return None","lines":7,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/views/base.py#L119-L125"},{"ref":"lutris/gui/views/base.py:64-78","code":"   64 |     def popup_contextual_menu(self, view, event):\n   65 |         \"\"\"Contextual menu.\"\"\"\n   66 |         if event.button != Gdk.BUTTON_SECONDARY:\n   67 |
