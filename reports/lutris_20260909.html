<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"is_config_dark getter/setter on StyleManager reference self._is_config_dark, but this attribute is never declared as a class attribute (unlike _preferred_theme, _system_theme, _is_dark which are) and is never set in __init__. The getter raises AttributeError if read before the setter is ever called, and the setter's own equality check (self._is_config_dark == is_config_dark) raises AttributeError on the very first call since the attribute does not exist yet.","fix":"Add _is_config_dark = False as a class attribute alongside the other _* defaults (_preferred_theme, _system_theme, _is_dark) so the getter and the setter's equality check have a valid initial value.","locations":[{"ref":"lutris/style_manager.py:101-113","code":"  101 |     @property\n  102 |     def is_config_dark(self) -> bool:\n  103 |         \"\"\"True if we override light mode to be dark; if we're\n  104 |         defaulting to dark, this does nothing.\"\"\"\n  105 |         return self._is_config_dark\n  106 | \n  107 |     @is_config_dark.setter  # type: ignore\n  108 |     def is_config_dark(self, is_config_dark: bool) -> None:\n  109 |         if self._is_config_dark == is_config_dark:\n  110 |             return\n  111 | \n  112 |         self._is_config_dark = is_config_dark\n  113 |         self._update_is_dark()","lines":13,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/style_manager.py#L101-L113"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"on_installer_selected searches self.installers for a matching version and leaves script=None\nif none matches (installerwindow.py:418-421). It then passes script straight into\nScriptInterpreter(script, self) with no guard. If installer_version does not match any\nscript (e.g. signal carries an unexpected value), script is None and the interpreter\nconstructor will fail on a None script, throwing inside a clicked handler rather than a\nclean error.","fix":"After the loop, if script is None raise a ScriptingError (or break and handle) instead of constructing the interpreter with None; also break out of the loop on first match.","locations":[{"ref":"lutris/gui/installerwindow.py:417-422","code":"  417 |         try:\n  418 |             script = None\n  419 |             for _script in self.installers:\n  420 |                 if _script[\"version\"] == installer_version:\n  421 |                     script = _script\n  422 |             self.interpreter = interpreter.ScriptInterpreter(script, self)","lines":6,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/installerwindow.py#L417-L422"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"GPUInfo.get_vulkaninfo() builds result[current_gpu][...] for lines containing \"= \", but current_gpu is only assigned when a prior line starts with \"GPU\". If vulkaninfo's --summary output ever contains a \"key = value\" line before any \"GPU\" line is seen (within the \"Devices:\" section), current_gpu is referenced before assignment, raising NameError/UnboundLocalError and aborting GPU info collection.","fix":"Initialize current_gpu = None before the loop and guard the elif branch:\nelif current_gpu is not None and \"= \" in line:\n    key, value = line.split(\"= \", maxsplit=1)\n    result[current_gpu][key.strip()] = value.strip()","locations":[{"ref":"lutris/util/graphics/gpu.py:184-200","code":"  184 |         result = {}\n  185 |         devices_seen = False\n  186 |         for line in vulkaninfo_output:\n  187 |             line = line.strip()\n  188 |             if not line or line.startswith(\"===\"):\n  189 |                 continue\n  190 |             if line == \"Devices:\":\n  191 |                 devices_seen = True\n  192 |                 continue\n  193 |             if not devices_seen:\n  194 |                 continue\n  195 |             if line.startswith(\"GPU\"):\n  196 |                 current_gpu = line\n  197 |                 result[current_gpu] = {}\n  198 |             elif \"= \" in line:\n  199 |                 key, value = line.split(\"= \", maxsplit=1)\n  200 |                 result[current_gpu][key.strip()] = value.strip()","lines":17,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/util/graphics/gpu.py#L184-L200"}]},
{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"GOGDownloader creates self._parallel_session = requests.Session() configured with an HTTPAdapter (pool_maxsize=...) for parallel chunk downloads, but never closes it. The base downloader's _release_resources() is a no-op and GOGDownloader does not override it to close _parallel_session. Each GOG download (especially large games using parallel workers) leaks a Session object and its underlying connection pool / sockets until garbage collection happens to run.","fix":"Override _release_resources() in GOGDownloader to close the session:\ndef _release_resources(self):\n    if self._parallel_session:\n        self._parallel_session.close()\n    super()._release_resources()","locations":[{"ref":"lutris/util/gog_downloader.py:70-89","code":"   70 |         # Pipelining: bounded queue decouples download I/O from disk writes\n   71 |         self._write_queue: queue.Queue = queue.Queue(maxsize=64)\n   72 |         self._writer_error: Exception | None = None\n   73 |         self._writer_error_event = threading.Event()\n   74 |         # Create a dedicated session with connection pooling sized for our workers\n   75 |         self._parallel_session = requests.Session()\n   76 |         adapter = HTTPAdapter(pool_maxsize=self.num_workers + 2)\n   77 |         self._parallel_session.mount(\"https://\", adapter)\n   78 |         self._parallel_session.mount(\"http://\", adapter)\n   79 |         self._parallel_session.headers[\"User-Agent\"] = \"Lutris/%s\" % __version__\n   80 | \n   81 |     def __repr__(self):\n   82 |         return \"GOG parallel downloader (%d workers) for %s\" % (self.num_workers, self.url)\n   83 | \n   84 |     @property\n   85 |     def _log_name(self) -> str:\n   86 |         return \"GOG parallel (%d workers): %s\" % (self.num_workers, self.url)\n   87 | \n   88 |     def _prepare_destination(self) -> None:\n   89 |         \"\"\"Detect resumable progress, or clear stale files for a fresh start.","lines":20,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/util/gog_downloader.py#L70-L89"}]},
{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"CabInstaller.__init__ unconditionally creates self.tmpdir = tempfile.mkdtemp(). cleanup() (which removes it via shutil.rmtree) is only called at the very end of install(), after extract_from_cab/get_registry_files/apply_to_registry have all succeeded. If any of those steps raises partway through, install() propagates the exception without ever calling cleanup(), leaking the temporary directory (and any partially-extracted cab contents) on every error path.","fix":"Wrap the body of install() in try/finally so cleanup() always runs:\ndef install(self):\n    try:\n        ...existing steps...\n    finally:\n        self.cleanup()","locations":[{"ref":"lutris/util/wine/cabinstall.py:21-51","code":"   21 |         self.tmpdir = tempfile.mkdtemp()\n   22 |         self.wine_path = wine_path\n   23 | \n   24 |         self.register_dlls = False  # Whether to register DLLs, I don't the purpose of that\n   25 |         self.strip_dlls = False  # When registering, strip the full path\n   26 | \n   27 |     @staticmethod\n   28 |     def process_key(key):\n   29 |         \"\"\"I have no clue why\"\"\"\n   30 |         return key.strip(\"\\\\\").replace(\"HKEY_CLASSES_ROOT\", \"HKEY_LOCAL_MACHINE\\\\Software\\\\Classes\")\n   31 | \n   32 |     @staticmethod\n   33 |     def get_arch_from_manifest(root):\n   34 |         registry_keys = root.findall(\"{urn:schemas-microsoft-com:asm.v3}assemblyIdentity\")\n   35 |         arch = registry_keys[0].attrib[\"processorArchitecture\"]\n   36 |         arch_map = {\"amd64\": \"win64\", \"x86\": \"win32\", \"wow64\": \"wow64\"}\n   37 |         return arch_map[arch]\n   38 | \n   39 |     def get_winebin(self, arch):\n   40 |         wine_path = self.wine_path or \"wine\"\n   41 |         return wine_path if arch in (\"win32\", \"wow64\") else wine_path + \"64\"\n   42 | \n   43 |     @staticmethod\n   44 |     def get_arch_from_dll(dll_path):\n   45 |         if \"x86-64\" in read_process_output([\"file\", dll_path]):\n   46 |             return \"win64\"\n   47 |         return \"win32\"\n   48 | \n   49 |     def cleanup(self):\n   50 |         logger.info(\"Cleaning up %s\", self.tmpdir)\n   51 |         shutil.rmtree(self.tmpdir)","lines":31,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/util/wine/cabinstall.py#L21-L51"}]},
{"id":"MEM_3","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"execute_command creates a new GLib.MainLoop and runs it, but on KeyboardInterrupt only calls\nmonitored_command.stop(); the MainLoop is never quit/cleaned and the function returns while the\ncommand may still be tearing down. Since this is a one-shot CLI path the impact is small, but a\nfresh MainLoop() each call plus no quit() on the loop is sloppy and can leave the loop running if\nthe command exits by another path.","fix":"Hold a reference to the loop, quit() it from the monitored command's completion\ncallback, and ensure it is quit in the KeyboardInterrupt/finally path.","locations":[{"ref":"lutris/gui/application.py:997-1007","code":"  997 |     @staticmethod\n  998 |     def execute_command(command: str) -> None:\n  999 |         \"\"\"Execute an arbitrary command in a Lutris context\n 1000 |         with the runtime enabled and monitored by a MonitoredCommand\n 1001 |         \"\"\"\n 1002 |         logger.info(\"Running command '%s'\", command)\n 1003 |         monitored_command = exec_command(command)\n 1004 |         try:\n 1005 |             GLib.MainLoop().run()\n 1006 |         except KeyboardInterrupt:\n 1007 |             monitored_command.stop()","lines":11,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/application.py#L997-L1007"}]},
{"id":"MEM_4","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"GameInfoBox.on_custom_image_download_clicked downloads to a tmp file and intentionally does not delete\nit (relying on init_dirs cleanup at next startup, per the comment). If save_custom_media decides the\nfile does not match any destination path or transcoding fails, the tmp file persists until the next\nlaunch. Over many failed/aborted downloads in one session, tmp files accumulate. This is documented as\nintentional but is still an unbounded-within-session leak.","fix":"Clean up the tmp file after save_custom_media completes (or on download/transcode failure) rather than\ndeferring all cleanup to the next startup.","locations":[{"ref":"lutris/gui/config/game_info_box.py:499-524","code":"  499 |         # This tmp file is consumed asynchronously by save_custom_media's\n  500 |         # async chains (copy or transcode), so we can't delete it here.\n  501 |         # Leftover tmp files are cleaned up on next startup in init_dirs().\n  502 |         file_id = uuid.uuid4()\n  503 |         tmp_file = os.path.join(settings.TMP_DIR, f\"download-{file_id}.tmp\")\n  504 |         logger.info(f\"Downloading custom image from `{url}` to `{tmp_file}`\")\n  505 | \n  506 |         def download():\n  507 |             with requests.get(url, stream=True) as r:\n  508 |                 if not r.ok:\n  509 |                     logger.error(\n  510 |                         f\"Request returned a status code that didn't indicate success: `{url}` (`{r.status_code}`)\"\n  511 |                     )\n  512 |                     return\n  513 |                 with open(tmp_file, \"wb\") as fp:\n  514 |                     for chunk in r.iter_content(chunk_size=8196):\n  515 |                         if chunk:\n  516 |                             fp.write(chunk)\n  517 | \n  518 |             self.save_custom_media(image_type, tmp_file)\n  519 | \n  520 |         def download_cb(_result, error):\n  521 |             if error:\n  522 |                 raise error\n  523 | \n  524 |         AsyncCall(download, download_cb)","lines":26,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/config/game_info_box.py#L499-L524"}]},
{"id":"MEM_5","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"WebConnectDialog creates a fresh WebKit2.WebContext per dialog and never tears it down; on_destroy\nonly resets service.is_login_in_progress. The webview and its WebContext (with cookie manager and\npersistent storage) are not explicitly released, so repeated open/close cycles of the login dialog\ncan accumulate WebKit contexts/processes.","fix":"Explicitly destroy/unparent the webview and drop the WebContext reference in on_destroy, allowing\nWebKit to reclaim the associated process and resources.","locations":[{"ref":"lutris/gui/dialogs/webconnect_dialog.py:36","code":"   36 |         self.context: WebKit2.WebContext = WebKit2.WebContext.new()","lines":1,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/dialogs/webconnect_dialog.py#L36"},{"ref":"lutris/gui/dialogs/webconnect_dialog.py:99-100","code":"   99 |     def on_destroy(self, _widget):\n  100 |         self.service.is_login_in_progress = False","lines":2,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/dialogs/webconnect_dialog.py#L99-L100"}]},
{"id":"MEM_6","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"load_finish_install_page connects a 'focus-in-event' handler (on_window_focus) every time\nthe page loads while the window is not active (installerwindow.py:1025-1027). on_window_focus\nclears the urgency hint but never disconnects itself, so the handler stays connected for the\nwindow's lifetime and fires on every subsequent focus-in. Minor, but it is an\naccumulating/never-removed signal connection.","fix":"Disconnect the focus-in-event handler inside on_window_focus after clearing the urgency hint, or guard against connecting it more than once.","locations":[{"ref":"lutris/gui/installerwindow.py:1028-1030","code":" 1028 |         if not self.is_active():\n 1029 |             self.set_urgency_hint(True)  # Blink in taskbar\n 1030 |             self.connect(\"focus-in-event\", self.on_window_focus)","lines":3,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/installerwindow.py#L1028-L1030"},{"ref":"lutris/gui/installerwindow.py:1050-1052","code":" 1050 |     def on_window_focus(self, _widget, *_args):\n 1051 |         \"\"\"Remove urgency hint (flashing indicator) when window receives focus\"\"\"\n 1052 |         self.set_urgency_hint(False)","lines":3,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/installerwindow.py#L1050-L1052"}]},
{"id":"MEM_7","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"SearchableEntrybox.repopulate replaces self.popup_menu with a brand-new\nGtk.Menu() but never destroys the old menu nor disconnects the MenuItem 'activate' handlers\ncreated in _populate_entrybox_choices. The old menu and its items (which hold references to\nself via the connected callbacks) are orphaned each repopulate, leaking widgets and keeping\nthe box alive.","fix":"Call self.popup_menu.destroy() (or remove and destroy all its children) before reassigning a new Gtk.Menu in repopulate.","locations":[{"ref":"lutris/gui/widgets/searchable_entrybox.py:80-84","code":"   80 |     def repopulate(self):\n   81 |         \"\"\"Clear and repopulate choices; used when an async choices load completes.\"\"\"\n   82 |         self.liststore.clear()\n   83 |         self.popup_menu = Gtk.Menu()\n   84 |         self._populate_entrybox_choices(self.choice_func)","lines":5,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/widgets/searchable_entrybox.py#L80-L84"},{"ref":"lutris/gui/widgets/searchable_entrybox.py:59-67","code":"   59 |     def _populate_entrybox_choices(self, choice_func):\n   60 |         \"\"\"Populate the liststore and popup menu with choices.\"\"\"\n   61 |         try:\n   62 |             choices = choice_func()\n   63 |             for choice in choices:\n   64 |                 self.liststore.append(choice)\n   65 |                 menu_item = Gtk.MenuItem(label=choice[0])\n   66 |                 menu_item.connect(\"activate\", self.on_menu_item_activate, choice[1])\n   67 |                 self.popup_menu.append(menu_item)","lines":9,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/widgets/searchable_entrybox.py#L59-L67"}]},
{"id":"MEM_8","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"GOGCloudStorageClient._make_request() calls urllib.request.urlopen() and only calls response.close() on the success path (after read() and getheaders() complete). It is not wrapped in a `with` statement or try/finally. If response.read() or getheaders() raises (e.g. connection reset mid-body), the open response object/socket is never explicitly closed. Additionally, on HTTPError the raised error object itself wraps an open file-like response that is never closed. Impact is limited since these are short-lived per-call connections that Python's GC will eventually clean up, but it leaves sockets open longer than necessary and is inconsistent with proper resource handling elsewhere.","fix":"Use urlopen as a context manager so the response is always closed:\nwith urllib.request.urlopen(req, timeout=CLOUD_API_TIMEOUT) as response:\n    response_body = response.read()\n    response_headers = {k: v for k, v in response.getheaders()}\nreturn response_body, response_headers\nAlso close error.fp / use `with` around the except urllib.error.HTTPError handling if the body isn't needed.","locations":[{"ref":"lutris/services/gog_cloud.py:178-193","code":"  178 |         req = urllib.request.Request(url=url, data=data, headers=headers, method=method)\n  179 |         try:\n  180 |             response = urllib.request.urlopen(req, timeout=CLOUD_API_TIMEOUT)\n  181 |             response_body = response.read()\n  182 |             response_headers = {k: v for k, v in response.getheaders()}\n  183 |             response.close()\n  184 |             return response_body, response_headers\n  185 |         except urllib.error.HTTPError as error:\n  186 |             if error.code == 404:\n  187 |                 return b\"\", {}\n  188 |             raise HTTPError(\n  189 |                 \"Cloud storage API error: %s %s -> %s\" % (method, url, error),\n  190 |                 code=error.code,\n  191 |             ) from error\n  192 |         except (urllib.error.URLError, OSError) as error:\n  193 |             raise HTTPError(\"Cloud storage connection error: %s\" % error) from error","lines":16,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/services/gog_cloud.py#L178-L193"}]},
{"id":"MEM_9","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"TrashPortal._trash_next_file() opens a file descriptor with os.open(file_path, flags) and appends it to a Gio.UnixFDList via fds_in.append(file_handle). Gio.UnixFDList.append() dup()s the descriptor internally rather than taking ownership of the original, so file_handle itself is never os.close()'d. Every file moved to trash through the D-Bus trash portal leaks one file descriptor. Individually cheap, but accumulates across bulk trash operations and can eventually exhaust the process's fd limit.","fix":"Close the original descriptor after handing it to the FD list:\nfile_handle = os.open(file_path, flags)\ntry:\n    fds_in.append(file_handle)\n    self._dbus_proxy.call_with_unix_fd_list(...)\nfinally:\n    os.close(file_handle)","locations":[{"ref":"lutris/util/portals.py:70-82","code":"   70 |         try:\n   71 |             fds_in = Gio.UnixFDList.new()\n   72 |             flags = os.O_RDONLY | os.O_PATH | os.O_CLOEXEC\n   73 |             # You'd think you could use O_NOFOLLOW for any file, but\n   74 |             # I find TrashFile fails. We don't want to trash the link target\n   75 |             # in any case.\n   76 |             if os.path.islink(file_path):\n   77 |                 flags |= os.O_NOFOLLOW\n   78 |             file_handle = os.open(file_path, flags)\n   79 |             fds_in.append(file_handle)\n   80 | \n   81 |             self._dbus_proxy.call_with_unix_fd_list(\n   82 |                 \"TrashFile\",","lines":13,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/util/portals.py#L70-L82"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"EditCategoryGamesDialog matches checkboxes back to games by game *name* via\ngames_db.get_game_by_field(label, 'name'). Game names are not unique (two installed games can share a\ndisplay name), so on_save can resolve a checkbox to the wrong game id, or to an arbitrary one of\nseveral games sharing the name. This silently assigns/removes category membership on the wrong game.\nThe dialog also builds its checkbox list from self.available_games by name but stores no game id with\nthe checkbox, making correct round-tripping impossible.","fix":"Store the game id on each checkbox (e.g. as an attribute or in a dict keyed by checkbox) when\nbuilding the list, and use that id in on_save instead of looking the game up by name.","locations":[{"ref":"lutris/gui/config/edit_category_games.py:49-64","code":"   49 |     def _create_games_checkboxes(self):\n   50 |         frame = Gtk.Frame()\n   51 |         sw = Gtk.ScrolledWindow()\n   52 |         row = Gtk.VBox()\n   53 |         category_games_names = sorted([x.name for x in self.category_games.values()])\n   54 |         for game in self.available_games:\n   55 |             label = game.name\n   56 |             checkbutton_option = Gtk.CheckButton(label)\n   57 |             if label in category_games_names:\n   58 |                 checkbutton_option.set_active(True)\n   59 |             self.grid.attach_next_to(checkbutton_option, None, Gtk.PositionType.BOTTOM, 3, 1)\n   60 | \n   61 |         row.pack_start(self.grid, True, True, 0)\n   62 |         sw.add_with_viewport(row)\n   63 |         frame.add(sw)\n   64 |         return frame","lines":16,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/config/edit_category_games.py#L49-L64"},{"ref":"lutris/gui/config/edit_category_games.py:99-111","code":"   99 |         for game_checkbox in self.grid.get_children():\n  100 |             label = game_checkbox.get_label()\n  101 |             db_game = games_db.get_game_by_field(label, \"name\")\n  102 |             if not db_game:\n  103 |                 continue\n  104 |             game_id = db_game[\"id\"]\n  105 |             if game_checkbox.get_active():\n  106 |                 checked_game_ids.add(game_id)\n  107 |             else:\n  108 |                 unchecked_game_ids.add(game_id)\n  109 | \n  110 |         added_game_ids = checked_game_ids - category_games_ids\n  111 |         removed_game_ids = unchecked_game_ids & category_games_ids","lines":13,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/config/edit_category_games.py#L99-L111"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"DownloadQueue.start() with a 'wait_for' set defers the start and returns True without\nreserving 'operation_name' in self.running_operation_names. The whole point of\noperation_name is to prevent duplicate queued work (the docstring says \"If the name is\npresent already, this method does nothing but returns False\"). But while an operation is\ndeferred via the DOWNLOAD_QUEUE_COMPLETED registration, its name is NOT recorded, so a\nsecond call to start() with the same operation_name and the same wait_for will register a\nSECOND deferred start instead of being rejected. When the blocking operations finish, both\ndeferred starts fire and the duplicate-prevention check inside start_multiple() may or may\nnot catch them depending on timing (both could pass the isdisjoint check before either\nupdates the set). This can launch the same operation twice.","fix":"Reserve the operation name(s) before deferring (e.g. add operation_name to\nrunning_operation_names when registering the deferred callback, and remove it if the\ndeferred start is ever abandoned), or check running_operation_names plus a separate\n'deferred names' set before registering a new deferred start so duplicates are rejected\nwith False as documented.","locations":[{"ref":"lutris/gui/download_queue.py:123-138","code":"  123 |         if wait_for and not self.running_operation_names.isdisjoint(wait_for):\n  124 |             # Defer the entire start (including the progress box) until the\n  125 |             # blocking operations complete.\n  126 |             def on_maybe_ready():\n  127 |                 if self.running_operation_names.isdisjoint(wait_for):\n  128 |                     registration.unregister()\n  129 |                     self.start(\n  130 |                         operation,\n  131 |                         progress_function,\n  132 |                         completion_function=completion_function,\n  133 |                         error_function=error_function,\n  134 |                         operation_name=operation_name,\n  135 |                     )\n  136 | \n  137 |             registration = DOWNLOAD_QUEUE_COMPLETED.register(on_maybe_ready)\n  138 |             return True","lines":16,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/download_queue.py#L123-L138"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"When the file provider is \"steam\", self.stop_func is set to steam_installer.stop_func\n(file_box.py:80) at widget-construction time. At that moment SteamInstaller.stop_func is\nstill None (it is only assigned the real cancel lambda inside install_steam_game(), see\nsteam_installer.py:77). Because Python binds the value (None), not the attribute, the\nInstallerFileBox keeps stop_func = None forever. Consequently InstallerFilesBox.stop_all()\n(files_box.py:77, guarded by 'file_box.stop_func is not None') can never cancel/clean up an\nin-progress Steam install when the user aborts.","fix":"Store the installer and call it indirectly, e.g. self.stop_func = lambda: steam_installer.stop_func and steam_installer.stop_func(), or assign self.steam_installer = steam_installer and have stop_all invoke a method that defers to the live attribute.","locations":[{"ref":"lutris/gui/installer/file_box.py:79-80","code":"   79 |             self.start_func = steam_installer.install_steam_game\n   80 |             self.stop_func = steam_installer.stop_func","lines":2,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/installer/file_box.py#L79-L80"},{"ref":"lutris/installer/steam_installer.py:35","code":"   35 |         self.stop_func = None","lines":1,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/installer/steam_installer.py#L35"},{"ref":"lutris/installer/steam_installer.py:77","code":"   77 |             self.stop_func = lambda: self.runner.remove_game_data(appid=self.appid)","lines":1,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/installer/steam_installer.py#L77"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"GameListView.set_selected_game() calls self.game_store.get_row_by_id(game_id, filtered=True),\nbut GameStore.get_row_by_id(self, game_id) takes no 'filtered' parameter, so this raises\nTypeError. It also references row.path, but the rows returned (Gtk.ListStore rows) expose .iter,\nnot .path. Any call to this method crashes. The method is currently dead (no caller), but it is\na latent landmine that will fail the moment anyone wires it up.","fix":"Remove set_selected_game() if unused, or fix it: call self.game_store.get_path_by_id(game_id)\nand pass that path to self.set_cursor(path). Drop the non-existent 'filtered' kwarg and the\n'.path' attribute access.","locations":[{"ref":"lutris/gui/views/list.py:143-146","code":"  143 |     def set_selected_game(self, game_id):\n  144 |         row = self.game_store.get_row_by_id(game_id, filtered=True)\n  145 |         if row:\n  146 |             self.set_cursor(row.path)","lines":4,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/views/list.py#L143-L146"},{"ref":"lutris/gui/views/store.py:112-117","code":"  112 |     def get_row_by_id(self, game_id):\n  113 |         if not game_id:\n  114 |             return\n  115 |         path = self.get_path_by_id(game_id)\n  116 |         if path is not None:\n  117 |             return self.store[path]","lines":6,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/views/store.py#L112-L117"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"LutrisStatusIcon.on_activate dereferences self.application.window without a\nNone check (app_window.get_visible()), unlike update_present_menu which checks `if app_window`.\nIf the tray icon is activated while the main window does not yet exist (e.g. during startup or\nafter window destruction), this raises AttributeError on None.","fix":"Add an `if not app_window: return` guard at the start of on_activate, mirroring update_present_menu.","locations":[{"ref":"lutris/gui/widgets/status_icon.py:115-128","code":"  115 |     def on_activate(self, _status_icon, _event=None):\n  116 |         \"\"\"Callback to show or hide the window\"\"\"\n  117 |         app_window = self.application.window\n  118 |         if app_window.get_visible():\n  119 |             # If the window has any transients, hiding it will hide them too\n  120 |             # never to be shown again, which is broken. So we don't allow that.\n  121 |             windows = Gtk.Window.list_toplevels()\n  122 |             for w in windows:\n  123 |                 if w.get_visible() and w.get_transient_for() == app_window:\n  124 |                     return\n  125 | \n  126 |             app_window.hide()\n  127 |         else:\n  128 |             app_window.show()","lines":14,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/widgets/status_icon.py#L115-L128"},{"ref":"lutris/gui/widgets/status_icon.py:107-113","code":"  107 |     def update_present_menu(self):\n  108 |         app_window = self.application.window\n  109 |         if app_window and self.present_menu:\n  110 |             if app_window.get_visible():\n  111 |                 self.present_menu.set_label(_(\"Hide Lutris\"))\n  112 |             else:\n  113 |                 self.present_menu.set_label(_(\"Show Lutris\"))","lines":7,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/widgets/status_icon.py#L107-L113"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"pico8.py's prelaunch() only short-circuits when main_file is falsy AND the runner is already installed (line 141: \"if not self.game_config.get(\\\"main_file\\\") and self.is_installed(): return True\"). If main_file is empty/None and the runner is NOT yet installed, execution falls through to line 147, which calls self.game_config.get(\"main_file\").startswith(\"http\") on a None value, raising AttributeError. The same unguarded .startswith()/.isdigit() pattern on a possibly-None main_file also exists in the cart_path property (lines 98-103).","fix":"Guard against a missing main_file independent of installation state, e.g. \"if not self.game_config.get(\\\"main_file\\\"): return True\" (or raise a clear error), and add a None-check at the top of cart_path before calling string methods on main_file.","locations":[{"ref":"lutris/runners/pico8.py:140-150","code":"  140 |     def prelaunch(self):\n  141 |         if not self.game_config.get(\"main_file\") and self.is_installed():\n  142 |             return True\n  143 |         if os.path.exists(os.path.join(settings.RUNNER_DIR, \"pico8/cartridges\", \"tmp.p8.png\")):\n  144 |             os.remove(os.path.join(settings.RUNNER_DIR, \"pico8/cartridges\", \"tmp.p8.png\"))\n  145 | \n  146 |         # Don't download cartridge if using web backend and cart is url\n  147 |         if self.is_native or not self.game_config.get(\"main_file\").startswith(\"http\"):\n  148 |             if not os.path.exists(self.game_config.get(\"main_file\")) and (\n  149 |                 self.game_config.get(\"main_file\").isdigit() or self.game_config.get(\"main_file\").startswith(\"http\")\n  150 |             ):","lines":11,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/runners/pico8.py#L140-L150"},{"ref":"lutris/runners/pico8.py:96-103","code":"   96 |     @property\n   97 |     def cart_path(self):\n   98 |         main_file = self.game_config.get(\"main_file\")\n   99 |         if self.is_native and main_file.startswith(\"http\"):\n  100 |             return os.path.join(settings.RUNNER_DIR, \"pico8/cartridges\", \"tmp.p8.png\")\n  101 |         if not os.path.exists(main_file) and main_file.isdigit():\n  102 |             return os.path.join(settings.RUNNER_DIR, \"pico8/cartridges\", main_file + \".p8.png\")\n  103 |         return main_file","lines":8,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/runners/pico8.py#L96-L103"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"GOGCloudSync.sync_saves() handles \"trivial cases\" (Step 7, when one side has files and the other is completely empty) by immediately performing the action and returning, BEFORE Step 9 evaluates the caller-supplied `preferred_action` override/guard. Concretely: if `local_files` is non-empty and `cloud_files` is empty, the code unconditionally uploads everything and returns at line 894 - even if the caller passed `preferred_action=\"download\"`. gog_cloud_hooks.py's sync_before_launch() always calls _sync_location with preferred_action=\"download\" specifically to prevent uploads before a game starts. With an empty/wiped cloud save (e.g. first run on a new GOG Galaxy cloud account, or after the cloud save was cleared), pre-launch sync will silently UPLOAD all local files instead of refusing, bypassing the safety guard at lines 928-931 that exists for exactly this scenario. This can overwrite intended cloud state with stale/wrong local saves without the user's consent.","fix":"Apply the preferred_action guard before/within the trivial-case handling too, e.g. check `preferred_action == \"download\"` before uploading in the local-only branch (and vice versa for the cloud-only branch), refusing and returning SyncAction.NONE just like Step 9 does:\nif local_files and not cloud_files:\n    if preferred_action == \"download\":\n        logger.warning(\"Refused to upload: download requested but no cloud files exist\")\n        result.action = SyncAction.NONE\n        return result\n    ...","locations":[{"ref":"lutris/services/gog_cloud.py:882-931","code":"  882 |         # Step 7: Handle trivial cases\n  883 |         if local_files and not cloud_files:\n  884 |             logger.info(\"No files in cloud, uploading all local files\")\n  885 |             action = SyncAction.UPLOAD\n  886 |             for i, f in enumerate(local_files):\n  887 |                 if progress_callback:\n  888 |                     progress_callback(i, len(local_files), f.relative_path)\n  889 |                 if client.upload_file(f, location_name):\n  890 |                     result.uploaded.append(f.relative_path)\n  891 |             result.action = action\n  892 |             result.timestamp = datetime.datetime.now().timestamp()\n  893 |             self.set_sync_timestamp(game_id, location_name, result.timestamp)\n  894 |             return result\n  895 | \n  896 |         if not local_files and cloud_files:\n  897 |             logger.info(\"No local files, downloading all cloud files\")\n  898 |             action = SyncAction.DOWNLOAD\n  899 |             for i, f in enumerate(downloadable_cloud):\n  900 |                 if progress_callback:\n  901 |                     progress_callback(i, len(downloadable_cloud), f.relative_path)\n  902 |                 if client.download_file(f, location_name):\n  903 |                     result.downloaded.append(f.relative_path)\n  904 |             result.action = action\n  905 |             result.timestamp = datetime.datetime.now().timestamp()\n  906 |             self.set_sync_timestamp(game_id, location_name, result.timestamp)\n  907 |             return result\n  908 | \n  909 |         # Step 8: Classify sync direction\n  910 |         timestamp = self.get_sync_timestamp(game_id, location_name)\n  911 |         classifier = SyncClassifier.classify(local_files, cloud_files, timestamp)\n  912 |         action = classifier.get_action()\n  913 | \n  914 |         # Step 9: Handle preferred action overrides\n  915 |         if preferred_action:\n  916 |             if preferred_action == \"forceupload\":\n  917 |                 logger.warning(\"Forcing upload\")\n  918 |                 classifier.updated_local = local_files\n  919 |                 action = SyncAction.UPLOAD\n  920 |             elif preferred_action == \"forcedownload\":\n  921 |                 logger.warning(\"Forcing download\")\n  922 |                 classifier.updated_cloud = downloadable_cloud\n  923 |                 action = SyncAction.DOWNLOAD\n  924 |             elif preferred_action == \"upload\" and action == SyncAction.DOWNLOAD:\n  925 |                 logger.warning(\"Refused to upload: newer files in cloud\")\n  926 |                 result.action = SyncAction.NONE\n  927 |                 return result\n  928 |             elif preferred_action == \"download\" and action == SyncAction.UPLOAD:\n  929 |                 logger.warning(\"Refused to download: newer files locally\")\n  930 |                 result.action = SyncAction.NONE\n  931 |                 return result","lines":50,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/services/gog_cloud.py#L882-L931"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In lutris.py's sync_media(), the loop that resolves alias slugs mutates game[\"slug\"] in place while iterating, then immediately re-derives a lookup key from the just-mutated value: `game[\"slug\"] = alias_map[game[\"slug\"]]` is executed inside a loop over `used_alias_slugs`, but `alias_map` is keyed by the games' ORIGINAL slugs. Once a game's slug is overwritten, any later match against the same game in the same or a subsequent outer iteration looks the new (already-renamed) slug up in alias_map, which was never populated for that value. This can raise KeyError or silently produce wrong/no media downloads for games that have multiple matching alias entries. The trailing `continue` is also dead code since it's the last statement in its loop body and changes nothing.","fix":"Don't mutate game[\"slug\"] while it's still being used as a dict key for further lookups. Compute the final slug into a separate variable / new dict, or break out of the inner loop once a game is renamed:\nfor alias_slug in used_alias_slugs:\n    for game in games:\n        original_slug = game[\"slug\"]\n        if alias_slug in [alias[\"slug\"] for alias in game[\"aliases\"]]:\n            game[\"slug\"] = alias_map[original_slug]\n            break","locations":[{"ref":"lutris/services/lutris.py:216-229","code":"  216 |     alias_map = {}\n  217 |     api_slugs = set()\n  218 |     for game in games:\n  219 |         api_slugs.add(game[\"slug\"])\n  220 |         for alias in game[\"aliases\"]:\n  221 |             if alias[\"slug\"] in slugs_to_download:\n  222 |                 alias_map[game[\"slug\"]] = alias[\"slug\"]\n  223 |     alias_slugs = set(alias_map.values())\n  224 |     used_alias_slugs = alias_slugs - api_slugs\n  225 |     for alias_slug in used_alias_slugs:\n  226 |         for game in games:\n  227 |             if alias_slug in [alias[\"slug\"] for alias in game[\"aliases\"]]:\n  228 |                 game[\"slug\"] = alias_map[game[\"slug\"]]\n  229 |                 continue","lines":14,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/services/lutris.py#L216-L229"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"DolphinCacheReader.get_games() loops `while self.offset < len(self.cache_content):` and calls self.get_game() inside a try/except that logs and swallows any exception, but self.offset is never advanced when an exception occurs. If get_game() ever raises partway through parsing (corrupted or unexpected GameCube/Wii cache file structure), the loop condition stays true forever with the same offset, causing an infinite loop that hangs the application (or floods the log indefinitely) instead of skipping the bad entry or aborting.","fix":"Advance the offset (or break) on failure so the loop can't spin forever:\nwhile self.offset < len(self.cache_content):\n    start_offset = self.offset\n    try:\n        games.append(self.get_game())\n    except Exception as ex:\n        logger.error(\"Failed to read Dolphin database: %s\", ex)\n        break  # or advance self.offset past the bad record\n    if self.offset == start_offset:\n        break  # safety net against any non-advancing path","locations":[{"ref":"lutris/util/dolphin/cache_reader.py:90-98","code":"   90 |     def get_games(self):\n   91 |         self.offset += self.header_size\n   92 |         games = []\n   93 |         while self.offset < len(self.cache_content):\n   94 |             try:\n   95 |                 games.append(self.get_game())\n   96 |             except Exception as ex:\n   97 |                 logger.error(\"Failed to read Dolphin database: %s\", ex)\n   98 |         return games","lines":9,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/util/dolphin/cache_reader.py#L90-L98"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"DLLManager.upgrade() iterates candidate versions to find one that downloads and is compatible, but never assigns the loop variable to self._version (the property self.download() actually uses). Each iteration calls self.download() using whatever self._version already was, so it downloads the same version repeatedly (or the wrong one) instead of trying each candidate from `versions` in turn. The compatibility check `self.is_compatible_version(version)` does use the loop variable, so the loop can spin through all versions, redownloading the identical file each time, and may never actually try the versions it logs (\"Downloading %s %s...\", human_name, version) as being downloaded.","fix":"Set self._version = version (or equivalent) before calling self.download() inside the loop, e.g.:\nfor version in versions:\n    self._version = version\n    logger.info(\"Downloading %s %s...\", self.human_name, version)\n    self.download()\n    if self.is_compatible_version(version):\n        return","locations":[{"ref":"lutris/util/wine/dll_manager.py:321-342","code":"  321 |     def upgrade(self):\n  322 |         if not self.is_available():\n  323 |             versions = self.load_versions()\n  324 | \n  325 |             if not versions:\n  326 |                 logger.warning(\"Unable to download %s because version information was not available.\", self.human_name)\n  327 | \n  328 |             # We prefer recommended versions, so download those first.\n  329 |             versions.sort(key=self.is_recommended_version, reverse=True)\n  330 | \n  331 |             for version in versions:\n  332 |                 logger.info(\"Downloading %s %s...\", self.human_name, version)\n  333 |                 self.download()\n  334 | \n  335 |                 if self.is_compatible_version(version):\n  336 |                     return  # got a compatible version, that'll do.\n  337 | \n  338 |                 logger.warning(\n  339 |                     \"Version %s of %s is not compatible with this version of Lutris.\", version, self.human_name\n  340 |                 )\n  341 | \n  342 |             # We found nothing compatible, and downloaded everything, we just give up.","lines":22,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/util/wine/dll_manager.py#L321-L342"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"logger.warning call has a %s placeholder in the format string but no argument is passed, so old_location is never substituted. The resulting log message literally prints 'Initial location %s does not exist...' instead of the actual path, making this diagnostic message useless when debugging a failed game move.","fix":"Pass old_location as a format argument: logger.warning(\"Initial location %s does not exist, files may have already been moved.\", old_location)","locations":[{"ref":"lutris/game.py:1187-1189","code":" 1187 |         if not system.path_exists(old_location):\n 1188 |             logger.warning(\"Initial location %s does not exist, files may have already been moved.\")\n 1189 |             return target_directory","lines":3,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/game.py#L1187-L1189"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"on_install_from_setup_game_name_changed is connected to the name entry's \"changed\" signal and is\nalso called directly from on_install_from_setup_game_slug_toggled. It only updates the slug entry\nwhen the slug checkbox is NOT active. But the slug entry's sensitivity is set to follow the checkbox\n(sensitive when checked). So when the checkbox is unchecked, the auto-derived slug is written into a\nNON-sensitive entry, and when checked the user edits a sensitive entry; toggling off does not\nrestore the auto-slug until the name changes again. The interaction between sensitivity and the\nderived value is inconsistent.","fix":"On toggling the checkbox off, immediately recompute and set the proposed slug; the\ndirect call already does this, but verify the entry sensitivity and value stay consistent (derived\nslug shown read-only when unchecked).","locations":[{"ref":"lutris/gui/addgameswindow.py:381-389","code":"  381 |     def on_install_from_setup_game_slug_toggled(self, checkbutton):\n  382 |         self.install_from_setup_game_slug_entry.set_sensitive(checkbutton.get_active())\n  383 |         self.on_install_from_setup_game_name_changed()\n  384 | \n  385 |     def on_install_from_setup_game_name_changed(self, *_args):\n  386 |         if not self.install_from_setup_game_slug_checkbox.get_active():\n  387 |             name = self.install_from_setup_game_name_entry.get_text()\n  388 |             proposed_slug = slugify(name) if name else \"\"\n  389 |             self.install_from_setup_game_slug_entry.set_text(proposed_slug)","lines":9,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/addgameswindow.py#L381-L389"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"_on_install_setup_continue derives win_ver via installer_preset.split(\"-\")[0]. The preset ids are\nplain strings like \"win11\"/\"win10\"/\"winxp\" with no hyphen, so the split is a no-op and win_ver\nequals installer_preset. The `arch` is computed by startswith((\"win98\", \"winxp\")) -> win32 else\nwin64, but the winetricks task uses `app=win_ver` for any non-win10 preset including win11; if the\nwinetricks verb for \"win11\" is not valid this task will fail at install time. The hyphen split\nsuggests the id format was expected to differ from what installer_presets actually contains.","fix":"Drop the misleading split (or document why it exists) and validate that each preset\nid maps to a real winetricks verb; guard against unsupported presets.","locations":[{"ref":"lutris/gui/addgameswindow.py:403-409","code":"  403 |         installer_preset = self.installer_presets[self.install_preset_dropdown.get_active()][0]\n  404 |         arch = \"win32\" if installer_preset.startswith((\"win98\", \"winxp\")) else \"win64\"\n  405 |         win_ver = installer_preset.split(\"-\")[0]\n  406 |         if win_ver != \"win10\":\n  407 |             win_ver_task = {\"task\": {\"name\": \"winetricks\", \"app\": win_ver, \"arch\": arch}}\n  408 |         else:\n  409 |             win_ver_task = None","lines":7,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/addgameswindow.py#L403-L409"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"do_command_line computes argc to decide whether to run checks asynchronously and route log output,\nby scanning sys.argv and only special-casing the `-d`/`--debug` flag. Any other option\n(e.g. --list-games, --json, --install, a URI) makes argc nonzero, which is intended, but the logic\nsilently breaks for combined short flags (e.g. `-dl`) and does not account for option arguments,\nso `--debug` combined with other flags can mis-count. More importantly it reads the raw sys.argv of\nthe primary instance even when invoked remotely via D-Bus from a second process, so a remote\ninvocation's arguments are not what argc reflects.","fix":"Derive the argument count from the parsed `options` VariantDict / command_line\narguments (command_line.get_arguments()) rather than the primary process's sys.argv, and stop\nhand-parsing flag strings.","locations":[{"ref":"lutris/gui/application.py:471-477","code":"  471 |         argc = len(sys.argv) - 1\n  472 |         if \"-d\" in sys.argv or \"--debug\" in sys.argv:\n  473 |             argc -= 1\n  474 |         if not argc:\n  475 |             # Switch back the log output to stderr (the default in Python)\n  476 |             # to avoid messing with any output from command line options.\n  477 |             log.console_handler.setStream(sys.stderr)","lines":7,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/application.py#L471-L477"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"uninstall_runner branches on `\"wine\" in runner` first, then `runner.startswith(\"lutris\")`. A\nlutris-managed wine version string (which typically contains \"wine\", e.g. a runtime like\n\"lutris-7.2-x86_64\" passed for wine) will match the first branch and prompt to delete ALL of Wine\nrather than the specific lutris wine build the user asked to uninstall. The ordering means the\nspecific-version uninstall path (wine_runner_uninstall) is unreachable for names containing \"wine\".","fix":"Check the more specific condition first: if runner.startswith(\"lutris\") route to\nwine_runner_uninstall; only treat a bare \"wine\" (exact match) as the full-Wine removal prompt.","locations":[{"ref":"lutris/gui/application.py:1033-1044","code":" 1033 |     def uninstall_runner(self, runner: str) -> None:\n 1034 |         if \"wine\" in runner:\n 1035 |             print(\"Are sure you want to delete Wine and all of the installed runners?[Y/N]\")\n 1036 |             ans = input()\n 1037 |             if ans.lower() in (\"y\", \"yes\"):\n 1038 |                 self.uninstall_runner_cli(runner)\n 1039 |             else:\n 1040 |                 print(\"Not Removing Wine\")\n 1041 |         elif runner.startswith(\"lutris\"):\n 1042 |             self.wine_runner_uninstall(runner)\n 1043 |         else:\n 1044 |             self.uninstall_runner_cli(runner)","lines":12,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/application.py#L1033-L1044"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In AccountsBox.on_sync_state_set, when the user opens the sync confirmation dialog and answers\nanything other than YES, the handler simply 'return's. Because this is a Gtk 'state-set' handler,\nreturning None (falsy) lets GTK proceed with the visual state change, so the switch visibly turns\non (or off) while the underlying 'library_sync_enabled' setting is never written and the sync frame\nvisibility is never updated. The UI and the saved setting end up out of sync. Additionally the\ndialog text always says 'Enable library sync...' even when the user is toggling the switch OFF\n(state is False), which is misleading.","fix":"Only prompt when actually enabling (state is True and last_library_sync_at is unset). On a non-YES\nanswer, revert the switch (switch.set_active(not state)) and return True to veto the state change so\nthe visual state matches the saved setting.","locations":[{"ref":"lutris/gui/config/accounts_box.py:197-211","code":"  197 |     def on_sync_state_set(self, switch, state):\n  198 |         if not settings.read_setting(\"last_library_sync_at\"):\n  199 |             sync_warn_dialog = QuestionDialog(\n  200 |                 {\n  201 |                     \"title\": _(\"Synchronize library?\"),\n  202 |                     \"question\": _(\"Enable library sync and run a full sync with lutris.net?\"),\n  203 |                 }\n  204 |             )\n  205 |             if sync_warn_dialog.result == Gtk.ResponseType.YES:\n  206 |                 AsyncCall(LibrarySyncer().sync_local_library, None)\n  207 |             else:\n  208 |                 return\n  209 | \n  210 |         self.on_setting_change(switch, state, \"library_sync_enabled\")\n  211 |         self.sync_frame.set_visible(state)","lines":15,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/config/accounts_box.py#L197-L211"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"EditCategoryGamesDialog._create_games_checkboxes determines initial checkbox state by checking\n'if label in category_games_names' where category_games_names is a list of *names* of games already in\nthe category. Because matching is by name (see related finding) and only the name is compared, games\nsharing a name will all be checked/unchecked together regardless of which specific game is in the\ncategory, producing an incorrect initial selection.","fix":"Initialize each checkbox from the actual game id membership (self.category_games keyed by id), not by\ncomparing display names.","locations":[{"ref":"lutris/gui/config/edit_category_games.py:49-64","code":"   49 |     def _create_games_checkboxes(self):\n   50 |         frame = Gtk.Frame()\n   51 |         sw = Gtk.ScrolledWindow()\n   52 |         row = Gtk.VBox()\n   53 |         category_games_names = sorted([x.name for x in self.category_games.values()])\n   54 |         for game in self.available_games:\n   55 |             label = game.name\n   56 |             checkbutton_option = Gtk.CheckButton(label)\n   57 |             if label in category_games_names:\n   58 |                 checkbutton_option.set_active(True)\n   59 |             self.grid.attach_next_to(checkbutton_option, None, Gtk.PositionType.BOTTOM, 3, 1)\n   60 | \n   61 |         row.pack_start(self.grid, True, True, 0)\n   62 |         sw.add_with_viewport(row)\n   63 |         frame.add(sw)\n   64 |         return frame","lines":16,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/config/edit_category_games.py#L49-L64"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"GameDialogCommon.on_save reads year via int(game_info_box.year_entry.get_text()) guarded only by\n'if ...get_text()'. NumberEntry restricts input, but if the field somehow contains a non-numeric\nstring (e.g. leading/trailing characters or a partial value not caught by is_valid), int() raises\nValueError inside the save handler, propagating into the GTK main loop. is_valid validates playtime\nbut never validates the year field, so the year is converted without prior validation.","fix":"Validate the year in is_valid (try/except around int()) and present an ErrorDialog on failure, or\nparse defensively in on_save and report a user-facing error instead of letting int() raise.","locations":[{"ref":"lutris/gui/config/game_common.py:419-421","code":"  419 |         year = None\n  420 |         if game_info_box.year_entry.get_text():\n  421 |             year = int(game_info_box.year_entry.get_text())","lines":3,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/config/game_common.py#L419-L421"},{"ref":"lutris/gui/config/game_common.py:364-401","code":"  364 |     def is_valid(self) -> bool:\n  365 |         game_info_box = self.info_box\n  366 |         if not self.runner_name:\n  367 |             ErrorDialog(_(\"Runner not provided\"), parent=self)\n  368 |             return False\n  369 |         if not game_info_box.name_entry.get_text():\n  370 |             ErrorDialog(_(\"Please fill in the name\"), parent=self)\n  371 |             return False\n  372 |         if self.runner_name == \"steam\" and not self.lutris_config.game_config.get(\"appid\"):\n  373 |             ErrorDialog(_(\"Steam AppID not provided\"), parent=self)\n  374 |             return False\n  375 |         playtime_text = game_info_box.playtime_entry.get_text()\n  376 |         if playtime_text and (not self.game or playtime_text != self.game.formatted_playtime):\n  377 |             try:\n  378 |                 parse_playtime(playtime_text)\n  379 |             except ValueError as ex:\n  380 |                 display_error(ex, parent=self)\n  381 |                 return False\n  382 | \n  383 |         invalid_fields = []\n  384 |         runner_class = import_runner(self.runner_name)\n  385 |         runner_instance = runner_class()\n  386 |         for config in [\"game\", \"runner\"]:\n  387 |             for k, v in getattr(self.lutris_config, config + \"_config\").items():\n  388 |                 option = runner_instance.find_option(config + \"_options\", k)\n  389 |                 if option is None:\n  390 |                     continue\n  391 |                 validator = option.get(\"validator\")\n  392 |                 if validator is not None:\n  393 |                     try:\n  394 |                         res = validator(v)\n  395 |                         logger.debug(\"%s validated successfully: %s\", k, res)\n  396 |                     except Exception:\n  397 |                         invalid_fields.append(option.get(\"label\"))\n  398 |         if invalid_fields:\n  399 |             ErrorDialog(_(\"The following fields have invalid values: \") + \", \".join(invalid_fields), parent=self)\n  400 |             return False\n  401 |         return True","lines":38,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/config/game_common.py#L364-L401"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In WidgetGenerator._generate_choice the async 'reload_choices' callback repopulates the liststore\nand re-runs set_active_id, but it does not recompute 'valid_choices'. The get_invalidity_error\nclosure and the ConfigWarningBox appended at lines 511-512 capture the original (empty) valid_choices\nlist from before the async data arrived. After a background reload populates real choices, an\notherwise-valid current value can still be reported as 'no longer available' because the warning\nclosure validates against the stale, empty valid_choices.","fix":"Recompute valid_choices inside reload_choices (e.g. from the freshly expanded choices) and have the\nget_invalidity_error closure read a mutable/nonlocal valid_choices that reload_choices updates.","locations":[{"ref":"lutris/gui/config/widget_generator.py:504-530","code":"  504 |         def get_invalidity_error(key: str):\n  505 |             v = self.get_setting(key, self.get_default(option))\n  506 |             if v in valid_choices:\n  507 |                 return None\n  508 | \n  509 |             return _(\"The setting '%s' is no longer available. You should select another choice.\") % v\n  510 | \n  511 |         if not has_entry and value not in valid_choices:\n  512 |             self.warning_messages.append(ConfigWarningBox(get_invalidity_error))\n  513 | \n  514 |         # Async choices protocol: if the choices callable has a register_reload_callback attribute,\n  515 |         # it supports background loading. The callable returns [] immediately when data isn't ready\n  516 |         # yet and kicks off a background fetch; callers register a callback to be invoked on the\n  517 |         # UI thread when loading completes, at which point the combobox is repopulated in place.\n  518 |         if callable(choices_src) and hasattr(choices_src, \"register_reload_callback\"):\n  519 | \n
