{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"GameStore.update() can locate a row via the 'service_id' fallback (get_row_by_id(db_game[\n'service_id'])), but then updates self._rows_by_id using old_id = row[COL_ID] (the game's COL_ID\nvalue) as the pop key. If the row was registered in _rows_by_id under the service_id rather than\nCOL_ID, the pop(old_id) misses and the row reference is left under a stale key while a new key is\nnot added, so subsequent get_path_by_id(new_id) lookups fail (forcing slow fallbacks or missing\nupdates).","fix":"Track which key was used to find the row (COL_ID vs service_id) and pop that exact key from\n_rows_by_id, or rebuild the mapping by removing any entries whose row_ref resolves to this row\nbefore inserting under new_id.","locations":[{"ref":"lutris/gui/views/store.py:126-170","code":"  126 |     def update(self, db_game: dict) -> set[int] | None:\n  127 |         \"\"\"Update game information\n  128 |         Return the indices of the row that were updated, or an empty set if no change\n  129 |         was made, or None if the game could not be found.\n  130 |         \"\"\"\n  131 |         store_item = StoreItem(db_game, self.service, self.service_media)\n  132 |         row = self.get_row_by_id(store_item.id)\n  133 |         if not row and \"service_id\" in db_game:\n  134 |             row = self.get_row_by_id(db_game[\"service_id\"])\n  135 |         if not row:\n  136 |             return None\n  137 | \n  138 |         old_id = row[COL_ID]\n  139 |         new_values = dict()\n  140 | \n  141 |         new_values[COL_ID] = store_item.id\n  142 |         new_values[COL_SLUG] = store_item.slug\n  143 |         new_values[COL_NAME] = store_item.name\n  144 |         new_values[COL_SORTNAME] = store_item.sortname if store_item.sortname else store_item.name\n  145 |         new_values[COL_MEDIA_PATHS] = store_item.get_media_paths() if settings.SHOW_MEDIA else []\n  146 |         new_values[COL_YEAR] = store_item.year\n  147 |         new_values[COL_RUNNER] = store_item.runner\n  148 |         new_values[COL_RUNNER_HUMAN_NAME] = store_item.runner_text\n  149 |         new_values[COL_PLATFORM] = store_item.platform\n  150 |         new_values[COL_LASTPLAYED] = store_item.lastplayed\n  151 |         new_values[COL_LASTPLAYED_TEXT] = store_item.lastplayed_text\n  152 |         new_values[COL_INSTALLED] = store_item.installed\n  153 |         new_values[COL_INSTALLED_AT] = store_item.installed_at\n  154 |         new_values[COL_INSTALLED_AT_TEXT] = store_item.installed_at_text\n  155 |         new_values[COL_PLAYTIME] = store_item.playtime\n  156 |         new_values[COL_PLAYTIME_TEXT] = store_item.playtime_text\n  157 | \n  158 |         changed_indices = set()\n  159 |         for idx, value in new_values.items():\n  160 |             if row[idx] != value:\n  161 |                 row[idx] = value\n  162 |                 changed_indices.add(idx)\n  163 | \n  164 |         new_id = store_item.id\n  165 |         if old_id != new_id:\n  166 |             row_ref = self._rows_by_id.pop(old_id, None)\n  167 |             if row_ref is not None:\n  168 |                 self._rows_by_id[new_id] = row_ref\n  169 | \n  170 |         return changed_indices","lines":45,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/views/store.py#L126-L170"}]},
{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"StoreItem._installed_game_data only sets self._cached_installed_game_data_loaded = True inside the\n'if appid and service_id:' branch. When a service game lacks an appid or service, the cache flag\nis never set, so every access re-enters the method and re-evaluates .get() calls. More importantly,\nthe docstring claims the value is cached, but for these items it is effectively never cached and\nthe method silently returns the initial None each time. Properties like 'installed' and\n'sortname' that fall through to _installed_game_data repeatedly recompute.","fix":"Set self._cached_installed_game_data_loaded = True unconditionally after the first call (move it\noutside the 'if appid and service_id' block), so the negative result is also cached.","locations":[{"ref":"lutris/gui/views/store_item.py:86-98","code":"   86 |     @property\n   87 |     def _installed_game_data(self):\n   88 |         \"\"\"Provides- and caches- the DB data for the installed game corresponding to this one,\n   89 |         if it's a service game. We can get away with caching this because StoreItem instances are\n   90 |         very short-lived, so the game won't be changed underneath us.\"\"\"\n   91 |         if not self._cached_installed_game_data_loaded:\n   92 |             appid = self._game_data.get(\"appid\")\n   93 |             service_id = self._game_data.get(\"service\")\n   94 |             if appid and service_id:\n   95 |                 self._cached_installed_game_data = games.get_game_for_service(service_id, appid) or {}\n   96 |                 self._cached_installed_game_data_loaded = True\n   97 | \n   98 |         return self._cached_installed_game_data","lines":13,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/views/store_item.py#L86-L98"}]},
{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"NumberEntry.do_insert_text passes the original, unfiltered `length` to\ninsert_text even after stripping non-numeric characters. If the user pastes e.g. \"1a2\", the\nfiltered text becomes \"12\" but `length` is still 3, so GTK reads past the end of the new\nstring buffer. This passes a length longer than the actual filtered string and can insert\ngarbage or trigger an assertion. SlugEntry above it correctly recomputes `length`.","fix":"Recompute `length = len(new_text)` after filtering, as SlugEntry does, and pass that to insert_text. Also return position + len(new_text).","locations":[{"ref":"lutris/gui/widgets/common.py:31-38","code":"   31 | class NumberEntry(Gtk.Entry, Gtk.Editable):  # type:ignore[misc]\n   32 |     def do_insert_text(self, new_text, length, position):\n   33 |         \"\"\"Filter inserted characters to only accept numbers\"\"\"\n   34 |         new_text = \"\".join([c for c in new_text if c.isnumeric()])\n   35 |         if new_text:\n   36 |             self.get_buffer().insert_text(position, new_text, length)\n   37 |             return position + length\n   38 |         return position","lines":8,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/widgets/common.py#L31-L38"}]},
{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"DownloadCollectionProgressBox pops files from the END of the queue via\nlist.pop() (both in _pop_next_downloadable_file and in the legacy downloader path in start()).\nThis downloads the collection in reverse order. While usually harmless for correctness, it is\nsurprising and inconsistent with the natural files_list order; combined with concurrency it\nmakes the displayed/active file ordering non-deterministic relative to the source list.","fix":"Use a collections.deque with popleft(), or pop(0), to preserve list order; or document explicitly that reverse order is intended.","locations":[{"ref":"lutris/gui/widgets/download_collection_progress_box.py:160-174","code":"  160 |     def _pop_next_downloadable_file(self):\n  161 |         \"\"\"Pop and return the next file from the queue, skipping cached files.\n  162 | \n  163 |         Returns ``None`` when the queue is empty.\n  164 |         \"\"\"\n  165 |         while self._file_queue:\n  166 |             file = self._file_queue.pop()\n  167 |             if os.path.exists(file.dest_file):\n  168 |                 logger.info(\"File exists, skipping download: '%s'\", file.dest_file)\n  169 |                 self.num_files_downloaded += 1\n  170 |                 size = os.path.getsize(file.dest_file)\n  171 |                 self._completed_sizes[file.dest_file] = size\n  172 |                 continue\n  173 |             return file\n  174 |         return None","lines":15,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/widgets/download_collection_progress_box.py#L160-L174"},{"ref":"lutris/gui/widgets/download_collection_progress_box.py:211-212","code":"  211 |         if self.downloader:\n  212 |             file = self._file_queue.pop() if self._file_queue else None","lines":2,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/widgets/download_collection_progress_box.py#L211-L212"}]},
{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In GameBar.__init__, when db_game has no 'service_id' and self.service is set,\nit reads db_game['appid']; but if the 'service' key exists yet maps to an unknown service,\nself.service stays None (KeyError swallowed) and neither branch runs, leaving self.appid\nunset. Later on_game_state_changed references self.appid (and other methods assume it exists),\nraising AttributeError. self.appid is only assigned inside the two conditional branches.","fix":"Initialize self.appid = None before the conditionals so it always exists.","locations":[{"ref":"lutris/gui/widgets/game_bar.py:46-65","code":"   46 |         if db_game.get(\"service\"):\n   47 |             try:\n   48 |                 self.service = services.SERVICES[db_game[\"service\"]]()\n   49 |             except KeyError:\n   50 |                 pass\n   51 | \n   52 |         game_id = None\n   53 |         if \"service_id\" in db_game:\n   54 |             self.appid = db_game[\"service_id\"]\n   55 |             game_id = db_game[\"id\"]\n   56 |         elif self.service:\n   57 |             self.appid = db_game[\"appid\"]\n   58 |             game = get_game_for_service(self.service.id, self.appid)\n   59 |             if game:\n   60 |                 game_id = game[\"id\"]\n   61 |         if game_id:\n   62 |             self.game = application.get_game_by_id(game_id)\n   63 |         else:\n   64 |             self.game = Game.create_empty_service_game(db_game, self.service)\n   65 |         self.update_view()","lines":20,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/widgets/game_bar.py#L46-L65"},{"ref":"lutris/gui/widgets/game_bar.py:278-280","code":"  278 |     def on_game_state_changed(self, game: Game) -> None:\n  279 |         \"\"\"Handler called when the game has changed state\"\"\"\n  280 |         if (self.game.is_db_stored and game.id == self.game.id) or (self.appid and game.appid == self.appid):","lines":3,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/widgets/game_bar.py#L278-L280"}]},
{"id":"LOGIC_34","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"SearchableEntrybox.on_entrybox_change only emits the \"changed\" signal when\nget_active_id() returns a non-None id (i.e. when the typed text exactly matches a row label).\nWhen the user clears the entry or types a value that no longer matches, no \"changed\" signal is\nemitted, so downstream consumers never learn the selection was cleared/invalidated. This makes\nit impossible to react to deselection through the normal signal path.","fix":"Emit \"changed\" (possibly with an empty/None id) whenever the active id transitions, including to None, or document that clearing is intentionally ignored.","locations":[{"ref":"lutris/gui/widgets/searchable_entrybox.py:108-113","code":"  108 |     def on_entrybox_change(self, _widget):\n  109 |         \"\"\"Action triggered on entrybox 'changed' signal.\"\"\"\n  110 |         active_id = self.get_active_id()\n  111 |         self._update_search_icon()\n  112 |         if active_id:\n  113 |             self.emit(\"changed\", active_id)","lines":6,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/widgets/searchable_entrybox.py#L108-L113"}]},
{"id":"LOGIC_35","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"SidebarRow.create_button_box is invoked from on_realize (per row) and the\nbutton widgets are added to self.btn_box, which is configured with no_show_all=True. The\nbuttons are created with visible=True but the btn_box itself is hidden until update_buttons\nshows it. on_service_auth_changed calls create_button_box() again (rebuilding buttons) but does\nnot clear self.buttons of stale entries beyond what btn_box children removal covers - the\nself.buttons dict keeps references to destroyed buttons for keys no longer present, so a later\nenable_refresh_button() may operate on a destroyed widget if the 'refresh' action disappeared.","fix":"Clear self.buttons = {} at the start of create_button_box before repopulating, so the dict never references destroyed buttons.","locations":[{"ref":"lutris/gui/widgets/sidebar.py:127-138","code":"  127 |     def create_button_box(self):\n  128 |         \"\"\"Adds buttons in the button box based on the row's actions\"\"\"\n  129 |         for child in self.btn_box.get_children():\n  130 |             child.destroy()\n  131 |         for icon_name, text, clicked, key in self.get_actions():\n  132 |             btn = Gtk.Button(tooltip_text=text, relief=Gtk.ReliefStyle.NONE, visible=True)\n  133 |             image = StockIconImage([icon_name], fallback_name=\"preferences-system-symbolic\")\n  134 |             image.show()\n  135 |             btn.add(image)\n  136 |             btn.connect(\"clicked\", clicked)\n  137 |             self.buttons[key] = btn\n  138 |             self.btn_box.add(btn)","lines":12,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/widgets/sidebar.py#L127-L138"},{"ref":"lutris/gui/widgets/sidebar.py:183-184","code":"  183 |     def enable_refresh_button(self) -> None:\n  184 |         self.buttons[\"refresh\"].set_sensitive(True)","lines":2,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/widgets/sidebar.py#L183-L184"},{"ref":"lutris/gui/widgets/sidebar.py:818-825","code":"  818 |     def on_service_auth_changed(self, service):\n  819 |         logger.debug(\"Service %s auth changed\", service.id)\n  820 |         if service.id in self.service_rows:\n  821 |             self.service_rows[service.id].create_button_box()\n  822 |             self.service_rows[service.id].update_buttons()\n  823 |         else:\n  824 |             logger.warning(\"Service %s is not found\", service.id)\n  825 |         return True","lines":8,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/widgets/sidebar.py#L818-L825"}]},
{"id":"LOGIC_36","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In scanners/lutris.py, find_game_folder() (lines 23-32) implicitly returns None when neither the api_game's own slug nor any of its aliases match a local folder in slugs_map. scan_directory() (lines 76-98) calls this and only checks \"if game_folder in directories\" (line 87) -- it never checks game_folder for None before passing it into find_game(game_folder, api_game) at line 90, which forwards it to detect_game_from_installer(game_folder, installer), which calls os.path.join(game_folder, exe_path) (line 48). os.path.join(None, ...) raises TypeError, crashing the whole directory scan for any api_game returned by the API whose slug isn't present in the local slugs_map (a real possibility since aliasing/slug normalization can diverge between the local slugify() and the server).","fix":"In scan_directory(), skip api_game entries where find_game_folder() returned None before calling find_game(), e.g. \"if not game_folder: continue\" right after the call at line 86.","locations":[{"ref":"lutris/scanners/lutris.py:23-32","code":"   23 | def find_game_folder(dirname, api_game, slugs_map):\n   24 |     if api_game[\"slug\"] in slugs_map:\n   25 |         game_folder = os.path.join(dirname, slugs_map[api_game[\"slug\"]])\n   26 |         if os.path.exists(game_folder):\n   27 |             return game_folder\n   28 |     for alias in api_game[\"aliases\"]:\n   29 |         if alias[\"slug\"] in slugs_map:\n   30 |             game_folder = os.path.join(dirname, slugs_map[alias[\"slug\"]])\n   31 |             if os.path.exists(game_folder):\n   32 |                 return game_folder","lines":10,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/scanners/lutris.py#L23-L32"},{"ref":"lutris/scanners/lutris.py:35-50","code":"   35 | def detect_game_from_installer(game_folder, installer):\n   36 |     try:\n   37 |         exe_path = installer[\"script\"][\"game\"].get(\"exe\")\n   38 |     except KeyError:\n   39 |         exe_path = installer[\"script\"].get(\"exe\")\n   40 |     if not exe_path:\n   41 |         try:\n   42 |             exe_path = installer[\"script\"][\"game\"].get(\"main_file\")\n   43 |         except KeyError:\n   44 |             pass\n   45 |     if not exe_path:\n   46 |         return None\n   47 |     exe_path = exe_path.replace(\"$GAMEDIR/\", \"\")\n   48 |     full_path = os.path.join(game_folder, exe_path)\n   49 |     if os.path.exists(full_path):\n   50 |         return full_path","lines":16,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/scanners/lutris.py#L35-L50"},{"ref":"lutris/scanners/lutris.py:76-98","code":"   76 | def scan_directory(dirname):\n   77 |     slugs_map = get_game_slugs_and_folders(dirname)\n   78 |     directories = get_used_directories()\n   79 |     api_games = get_api_games(list(slugs_map.keys()))\n   80 |     slugs_seen = set()\n   81 |     slugs_installed = set()\n   82 |     for api_game in api_games:\n   83 |         if api_game[\"slug\"] in slugs_seen:\n   84 |             continue\n   85 |         slugs_seen.add(api_game[\"slug\"])\n   86 |         game_folder = find_game_folder(dirname, api_game, slugs_map)\n   87 |         if game_folder in directories:\n   88 |             slugs_installed.add(api_game[\"slug\"])\n   89 |             continue\n   90 |         full_path, installer = find_game(game_folder, api_game)\n   91 |         if full_path:\n   92 |             logger.info(\"Found %s in %s\", api_game[\"name\"], full_path)\n   93 |             try:\n   94 |                 install_game(installer, game_folder)\n   95 |             except MissingGameDependencyError as ex:\n   96 |                 logger.error(\"Skipped %s: %s\", api_game[\"name\"], ex)\n   97 |             download_lutris_media(installer[\"game_slug\"])\n   98 |             slugs_installed.add(api_game[\"slug\"])","lines":23,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/scanners/lutris.py#L76-L98"}]},
{"id":"LOGIC_37","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"tosec.py's clean_rom_name() is meant to strip a trailing parenthesized or bracketed tag from a ROM name by scanning the string in reverse and tracking whether the scan is currently inside such a tag. The opening condition correctly checks for '(' or ']' is wrong -- it should check for '(' or '[' to close the in_parens state when an opening delimiter is reached scanning backwards. Because the code checks \"c in ('(', ']')\" instead of \"c in ('(', '[')\", a name containing a square-bracket tag like 'Some Game [T-En by Someone]' never has in_parens reset to False at the '[', so the scan keeps treating the rest of the string as inside the tag, producing a corrupted, truncated result ('Some Game [T-En by Someone' instead of 'Some Game'). Verified by direct execution of the function.","fix":"Change line 157 from \"if c in (\\\"(\\\", \\\"]\\\"):\" to \"if c in (\\\"(\\\", \\\"[\\\"):\" so the in_parens flag correctly resets on the matching opening bracket.","locations":[{"ref":"lutris/scanners/tosec.py:149-162","code":"  149 | def clean_rom_name(name):\n  150 |     in_parens = False\n  151 |     good_index = 0\n  152 |     for i, c in enumerate(name[::-1], start=1):\n  153 |         if c in (\")\", \"]\"):\n  154 |             in_parens = True\n  155 |         if in_parens:\n  156 |             good_index = i\n  157 |         if c in (\"(\", \"]\"):\n  158 |             in_parens = False\n  159 |     name = name[: len(name) - good_index].strip()\n  160 |     if name.endswith(\", The\"):\n  161 |         name = \"The \" + name[:-5]\n  162 |     return name","lines":14,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/scanners/tosec.py#L149-L162"}]},
{"id":"LOGIC_38","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Process.wait_for_finish() calls os.waitpid(int(self.pid) * -1, 0), which waits on the entire process GROUP (negative pid means \"any child in this process group\") rather than the specific self.pid. The docstring says it \"waits until the process finishes,\" implying the specific process, but the returned (pid, ret_status) can belong to a different process within the same group that happens to exit first. Callers relying on ret_status reflecting self.pid's own exit code can get a different process's status instead, and the function could return before self.pid itself has actually exited.","fix":"Wait on the specific pid unless waiting on the whole group is genuinely intended:\npid, ret_status = os.waitpid(int(self.pid), 0)\nIf group-waiting is intentional (e.g. to reap children of a launcher process), document why and loop until self.pid specifically has exited.","locations":[{"ref":"lutris/util/process.py:136-147","code":"  136 |     def wait_for_finish(self):\n  137 |         \"\"\"Waits until the process finishes\n  138 |         This only works if self.pid is a child process of Lutris\n  139 |         \"\"\"\n  140 |         try:\n  141 |             pid, ret_status = os.waitpid(int(self.pid) * -1, 0)\n  142 |         except OSError as ex:\n  143 |             logger.error(\"Failed to get exit status for PID %s\", self.pid)\n  144 |             logger.error(ex)\n  145 |             return -1\n  146 |         logger.info(\"PID %s exited with code %s\", pid, ret_status)\n  147 |         return ret_status","lines":12,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/util/process.py#L136-L147"}]},
{"id":"LOGIC_39","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"_get_listbox_row only adds the right/next icon when left_icon_name is truthy (it is nested inside\nthe same `if left_icon_name:` condition's sibling block at lines 688-690). Search-result rows are\ncreated with an empty left_icon_name, so they never show the next/chevron icon - which may be\nintended - but the right_icon_name parameter is silently ignored whenever there is no left icon,\nwhich is a surprising coupling and makes the parameter dead in that case.","fix":"Decide the next-icon visibility independently of left_icon_name (e.g. add it when\nright_icon_name is non-empty) so the parameters are orthogonal.","locations":[{"ref":"lutris/gui/addgameswindow.py:683-690","code":"  683 |         if left_icon_name:\n  684 |             icon = self._get_icon(left_icon_name)\n  685 |             box.pack_start(icon, False, False, 0)\n  686 |         label = self._get_label(f\"<b>{text}<\/b>\\n{subtext}\")\n  687 |         box.pack_start(label, True, True, 0)\n  688 |         if left_icon_name:\n  689 |             next_icon = self._get_icon(right_icon_name, small=True)\n  690 |             box.pack_start(next_icon, False, False, 0)","lines":8,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/addgameswindow.py#L683-L690"}]},
{"id":"LOGIC_40","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In do_command_line, when downloading an installer from a URL, the Content-Disposition header is\nparsed as `headers[\"Content-Disposition\"].split(\"=\", 1)[-1]` to derive the filename. This does not\nstrip surrounding quotes or the `filename=`/`filename*=` distinction, so a header like\n`attachment; filename=\"game.exe\"` yields the filename `\"game.exe\"` (with quotes) and\n`filename*=UTF-8''game.exe` yields a percent-encoded value. The resulting temp file path can be\nmalformed or contain unexpected characters.","fix":"Parse Content-Disposition robustly (strip quotes, handle the `filename`/`filename*`\nparameters, e.g. using email.message or werkzeug-style parsing) before building the temp path.","locations":[{"ref":"lutris/gui/application.py:675-680","code":"  675 |                 try:\n  676 |                     headers = dict(request.response_headers or {})\n  677 |                     file_name = headers[\"Content-Disposition\"].split(\"=\", 1)[-1]\n  678 |                 except (KeyError, IndexError):\n  679 |                     file_name = os.path.basename(installer_file)\n  680 |                 file_path = os.path.join(tempfile.gettempdir(), file_name)","lines":6,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/application.py#L675-L680"}]},
{"id":"LOGIC_41","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In do_command_line the rungame/rungameid path installs SIGTERM/SIGINT handlers that call\ngame.stop() only when self.quit_on_game_exit is true. do_startup already reset SIGINT to SIG_DFL.\nThese handlers are installed in the command-line handler which may run in the primary instance for a\nremote invocation, so a second `lutris lutris:rungameid/...` invocation reconfigures the primary\nprocess's signal handlers, affecting any already-running game launched earlier. Signal handlers are\nprocess-global and are overwritten on each rungame invocation.","fix":"Avoid mutating process-global signal handlers per invocation; track games to stop in\na structure and install a single stable handler, or only do this in genuine single-game CLI mode.","locations":[{"ref":"lutris/gui/application.py:788-795","code":"  788 |             if self.quit_on_game_exit:\n  789 | \n  790 |                 def game_stop_signal_handler(signum: int, _frame: types.FrameType | None) -> None:\n  791 |                     logger.debug(\"signal handler called with signal: %d\", signum)\n  792 |                     game.stop()\n  793 | \n  794 |                 signal.signal(signal.SIGTERM, game_stop_signal_handler)\n  795 |                 signal.signal(signal.SIGINT, game_stop_signal_handler)","lines":8,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/application.py#L788-L795"}]},
{"id":"LOGIC_42","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"on_game_stopped shows the launcher window only when hide_client_on_game_start is set and\nnot quit_on_game_exit; otherwise it calls _quit_if_hidden_and_idle. But when\nhide_client_on_game_start is False (window was never hidden) the code still falls into the else\nbranch and may quit Lutris if the window happens to be invisible for another reason and there is no\ntray icon. The show/quit decision conflates \"we hid the window for a game\" with \"window is not\nvisible\", which can quit a normally-running GUI in edge cases.","fix":"Track explicitly whether the window was hidden due to game start, and only restore\nor quit based on that flag rather than re-reading the setting and the current visibility.","locations":[{"ref":"lutris/gui/application.py:835-838","code":"  835 |         if self.window and settings.read_bool_setting(\"hide_client_on_game_start\") and not self.quit_on_game_exit:\n  836 |             self.window.show()  # Show launcher window\n  837 |         else:\n  838 |             self._quit_if_hidden_and_idle()","lines":4,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/application.py#L835-L838"}]},
{"id":"LOGIC_43","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"AccountsBox.on_connect_response has an unused/oddly-named parameter 'bliblu' and the login flow\nrelies on the 'connected' signal of ClientLoginDialog. on_login_clicked creates the dialog and\nconnects the signal but never keeps a reference or runs it; if ClientLoginDialog is not self-running\nor is garbage collected before the user logs in, the connected handler may never fire. At minimum the\nparameter name should be meaningful.","fix":"Rename the parameter (e.g. 'credentials' or '_data'), and verify ClientLoginDialog keeps itself alive\n/ is shown so the 'connected' signal reliably reaches on_connect_response.","locations":[{"ref":"lutris/gui/config/accounts_box.py:169-174","code":"  169 |     def on_login_clicked(self, _widget):\n  170 |         login_dialog = ClientLoginDialog(parent=self.get_toplevel())\n  171 |         login_dialog.connect(\"connected\", self.on_connect_response)\n  172 | \n  173 |     def on_connect_response(self, _dialog, bliblu):\n  174 |         self.rebuild_lutris_options()","lines":6,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/config/accounts_box.py#L169-L174"}]},
{"id":"LOGIC_44","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"ConfigWidgetGenerator.on_reset_button_clicked hides the reset button (btn.set_visible(False)) then\nregenerates the widget via generate_widget(option, wrapper=wrapper). generate_widget rebuilds the\nwrapper contents but the reset_button instance stored in self.reset_buttons[option_key] still points\nto the old button that was just hidden; subsequent on_changed will call\nreset_buttons.get(option_key).set_visible(True) on that old (now possibly detached) button rather than\na freshly created one. Whether the button reappears correctly depends on the button not being\nrecreated by generate_widget (it is created in create_option_container, which is not re-run here), so\nthe reset button is reused - but the manual set_visible(False) plus no_show_all state from\ncreate_option_container can leave it stuck hidden after a value change.","fix":"After regenerating the widget, also reset the reset button's no_show_all/visibility state\nconsistently, or recreate/re-register the reset button so its tracked instance matches its shown\nstate.","locations":[{"ref":"lutris/gui/config/boxes.py:363-374","code":"  363 |     def on_reset_button_clicked(self, btn, option):\n  364 |         \"\"\"Clear option (remove from config, reset option widget).\"\"\"\n  365 |         option_key = option[\"option\"]\n  366 |         wrapper = self.wrappers[option_key]\n  367 | \n  368 |         btn.set_visible(False)\n  369 | \n  370 |         self.raw_config.pop(option_key, None)\n  371 |         self.lutris_config.update_cascaded_config()\n  372 | \n  373 |         self.generate_widget(option, wrapper=wrapper)\n  374 |         self.update_widgets()","lines":12,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/config/boxes.py#L363-L374"},{"ref":"lutris/gui/config/boxes.py:311-313","code":"  311 |         if option_key not in self.raw_config:\n  312 |             reset_button.set_visible(False)\n  313 |             reset_button.set_no_show_all(True)","lines":3,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/config/boxes.py#L311-L313"}]},
{"id":"LOGIC_45","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"GameDialogCommon._build_options_tab eagerly generates widgets for page_index == 0 and defers all\nothers to a lazy generator registered in notebook_page_generators. This assumes the first options tab\ncreated is always page index 0 and currently visible. In the runner config and preferences flows the\nGame info tab (added first in _build_info_tab) occupies index 0, so the first *options* tab is never\nindex 0 and is always lazily generated; but for runner-level dialogs (config_level != 'game') the\nfirst options tab IS index 0 and gets eagerly generated. The branch silently couples eager generation\nto a positional index rather than to which page is actually selected, so a future reordering of tabs\nwould generate the wrong page up front.","fix":"Decide eager vs lazy generation based on self.notebook.get_current_page() (the actually-visible\npage) instead of hard-coding 'page_index == 0'.","locations":[{"ref":"lutris/gui/config/game_common.py:211-234","code":"  211 |     def _build_options_tab(\n  212 |         self,\n  213 |         notebook_label: str,\n  214 |         box_factory: Callable[[], \"ConfigBox\"],\n  215 |         advanced: bool = True,\n  216 |         searchable: bool = True,\n  217 |     ) -> \"ConfigBox\":\n  218 |         if not self.lutris_config:\n  219 |             raise RuntimeError(\"Lutris config not loaded yet\")\n  220 |         config_box = box_factory()\n  221 |         page_index = self._add_notebook_tab(self.build_scrolled_window(config_box), notebook_label)\n  222 | \n  223 |         self.notebook_page_updater[page_index] = config_box.update_widgets\n  224 | \n  225 |         if page_index == 0:\n  226 |             config_box.generate_widgets()\n  227 |         else:\n  228 |             self.notebook_page_generators[page_index] = config_box.generate_widgets\n  229 | \n  230 |         if advanced:\n  231 |             self.option_page_indices.add(page_index)\n  232 |         if searchable:\n  233 |             self.searchable_page_indices.add(page_index)\n  234 |         return config_box","lines":24,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/config/game_common.py#L211-L234"}]},
{"id":"LOGIC_46","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"GameDialogCommon.on_runner_changed guards the 'reset configuration' confirmation with\n'if game_info_box.runner_index and ...'. runner_index is an integer index into the runner\ncombobox where 0 means 'Select a runner from the list'. Using a truthiness test means index 0 is\ntreated the same as 'no previous selection', which is the intent for the no-runner case, but it\nalso means the comparison silently relies on 0 being falsy rather than an explicit check. If the\nsentinel index ever changes, or runner_index is legitimately 0 for a selected first runner, the\nconfirmation prompt is skipped. An explicit 'is not None' style check would be clearer and safer.","fix":"Compare explicitly, e.g. 'if game_info_box.runner_index is not None and game_info_box.runner_index\n> 0 and new_runner_index != game_info_box.runner_index:' so the intent and the sentinel are\nunambiguous.","locations":[{"ref":"lutris/gui/config/game_common.py:303-324","code":"  303 |         new_runner_index = widget.get_active()\n  304 |         game_info_box = self.info_box\n  305 |         if game_info_box.runner_index and new_runner_index != game_info_box.runner_index:\n  306 |             dlg = QuestionDialog(\n  307 |                 {\n  308 |                     \"parent\": self,\n  309 |                     \"question\": _(\n  310 |                         \"Are you sure you want to change the runner for this game ? \"\n  311 |                         \"This will reset the full configuration for this game and \"\n  312 |                         \"is not reversible.\"\n  313 |                     ),\n  314 |                     \"title\": _(\"Confirm runner change\"),\n  315 |                 }\n  316 |             )\n  317 | \n  318 |             if dlg.result == Gtk.ResponseType.YES:\n  319 |                 self._switch_runner(widget, new_runner_index)\n  320 |             else:\n  321 |                 # Revert the dropdown menu to the previously selected runner\n  322 |                 widget.set_active(game_info_box.runner_index)\n  323 |         else:\n  324 |             self._switch_runner(widget, new_runner_index)","lines":22,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/config/game_common.py#L303-L324"}]},
{"id":"LOGIC_47","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"ServicesBox._on_service_change always calls include_in_games_checkbox.set_active(True) whenever the\nservice switch state changes, including when the service is being turned OFF. The comment only\njustifies forcing it true when the service view is hidden (service disabled). Turning a service off\ntherefore silently resets the user's 'show games in games view' preference to True, and because\nset_active fires 'toggled', writes that True back to settings.","fix":"Only force include_in_games_checkbox active when state is False (service disabled); leave the user's\nchoice untouched when enabling the service.","locations":[{"ref":"lutris/gui/config/services_box.py:92-99","code":"   92 |     def _on_service_change(self, widget, state, setting_key, include_in_games_checkbox):\n   93 |         \"\"\"Save a setting when an option is toggled\"\"\"\n   94 |         settings.write_setting(setting_key, state, section=\"services\")\n   95 |         include_in_games_checkbox.set_visible(state)\n   96 |         # if you can't view the games in their own service view, then\n   97 |         # you need to see the min the name view, so make them visible there.\n   98 |         include_in_games_checkbox.set_active(True)\n   99 |         self.emit(\"services-changed\")","lines":8,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/config/services_box.py#L92-L99"}]},
{"id":"LOGIC_48","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"GtkBuilderDialog.on_response hides the dialog only on DELETE_EVENT, but the class also defines a\n'destroy' gsignal it emits in on_close. There is no generic response handling and on_response is\nnot connected anywhere in this base class (subclasses connect their own buttons), so on_response is\neffectively dead code for the base flow and the AttributeError guard around self.dialog.hide()\nhides real bugs (self.dialog is always set in __init__).","fix":"Remove the unused on_response method (or wire it to the dialog's response signal); drop the\nAttributeError swallow which can mask genuine errors.","locations":[{"ref":"lutris/gui/dialogs/__init__.py:228-233","code":"  228 |     def on_response(self, _widget: Gtk.Dialog, response: Gtk.ResponseType) -> None:\n  229 |         if response == Gtk.ResponseType.DELETE_EVENT:\n  230 |             try:\n  231 |                 self.dialog.hide()\n  232 |             except AttributeError:\n  233 |                 pass","lines":6,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/dialogs/__init__.py#L228-L233"}]},
{"id":"LOGIC_49","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"DownloadDialog.on_response cancels the download on DELETE_EVENT or CANCEL, but the dialog also\nissues response(Gtk.ResponseType.OK) on completion. There is no handling to ensure the\nDownloadProgressBox 'complete'/'cancel' signal handlers are disconnected before destroy; combined\nwith ModalDialog.destroy_at_idle this is usually fine, but cancel_download() is also invoked when\nthe download already completed (CANCEL path after an OK race), which can call cancel on a finished\ndownloader.","fix":"Guard cancel_download() so it is a no-op once the downloader has completed, and/or disconnect the\nprogress-box signals in on_response before tearing down.","locations":[{"ref":"lutris/gui/dialogs/download.py:31-40","code":"   31 |     def download_complete(self, _widget, _data):\n   32 |         self.response(Gtk.ResponseType.OK)\n   33 | \n   34 |     def download_cancelled(self, _widget):\n   35 |         self.response(Gtk.ResponseType.CANCEL)\n   36 | \n   37 |     def on_response(self, dialog, response):\n   38 |         if response in (Gtk.ResponseType.DELETE_EVENT, Gtk.ResponseType.CANCEL):\n   39 |             self.dialog_progress_box.cancel_download()\n   40 |         super().on_response(dialog, response)","lines":10,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/dialogs/download.py#L31-L40"}]},
{"id":"LOGIC_50","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In game_import.py search_single(filepath), line 138 calls show_progress(filename, ...) using the\nouter-loop variable 'filename' instead of the function parameter 'filepath'. It works today only\nbecause the single caller passes search_single(filename) so the two names coincide; if\nsearch_single is ever reused with a different argument the progress update targets the wrong row.","fix":"Use the parameter consistently: show_progress(filepath, _(\"Looking up checksum on Lutris.net...\")).","locations":[{"ref":"lutris/gui/dialogs/game_import.py:123-141","code":"  123 |         def search_single(filepath):\n  124 |             existing_game = get_existing_game(filepath)\n  125 |             if existing_game:\n  126 |                 # Found a game to launch instead of installing, but we can't safely\n  127 |                 # do this on this thread, so we return the game and handle it later.\n  128 |                 return [{\"name\": existing_game.name, \"game\": existing_game, \"roms\": []}]\n  129 |             show_progress(filepath, _(\"Calculating checksum...\"))\n  130 |             if filepath.lower().endswith(\".zip\"):\n  131 |                 md5 = get_md5_in_zip(filepath)\n  132 |             else:\n  133 |                 md5 = get_md5_hash(filepath)\n  134 | \n  135 |             if self.search_stopping:\n  136 |                 return None\n  137 | \n  138 |             show_progress(filename, _(\"Looking up checksum on Lutris.net...\"))\n  139 |             result = search_tosec_by_md5(md5)\n  140 |             if not result:\n  141 |                 raise RuntimeError(_(\"This ROM could not be identified.\"))","lines":19,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/dialogs/game_import.py#L123-L141"}]},
{"id":"LOGIC_51","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"IssueReportWindow creates self.title_label and adds it to the vbox, but never sets any text on it,\nso an empty label is packed at the top of the dialog. A second, separate title_label local is then\ncreated and given the actual '<b>Submit an issue<\/b>' markup. The instance attribute is dead and\nproduces a stray empty widget.","fix":"Remove the unused self.title_label (lines 20-21) or set its markup; keep only one title label.","locations":[{"ref":"lutris/gui/dialogs/issue.py:20-26","code":"   20 |         self.title_label = Gtk.Label(visible=True)\n   21 |         self.vbox.add(self.title_label)\n   22 | \n   23 |         title_label = Gtk.Label()\n   24 |         title_label.set_markup(_(\"<b>Submit an issue<\/b>\"))\n   25 |         self.vbox.add(title_label)\n   26 |         self.vbox.add(Gtk.HSeparator())","lines":7,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/dialogs/issue.py#L20-L26"}]},
{"id":"LOGIC_52","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"LogWindow.on_key_press_event triggers next/previous search match on Return/Shift+Return regardless\nof focus. Because it is connected to the whole window's key-press-event, pressing Return anywhere\n(including in non-search contexts) emits search navigation. It also returns None implicitly rather\nthan True, so the event keeps propagating, which may double-handle Return.","fix":"Only handle Return when the search entry has focus (or is mapped/visible), and return True to stop\npropagation when the key is consumed.","locations":[{"ref":"lutris/gui/dialogs/log.py:54-60","code":"   54 |     def on_key_press_event(self, widget: Gtk.ApplicationWindow, event: Gdk.EventKey) -> None:\n   55 |         shift = event.state & Gdk.ModifierType.SHIFT_MASK\n   56 |         if event.keyval == Gdk.KEY_Return:\n   57 |             if shift:\n   58 |                 self.search_entry.emit(\"previous-match\")\n   59 |             else:\n   60 |                 self.search_entry.emit(\"next-match\")","lines":7,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/dialogs/log.py#L54-L60"}]},
{"id":"LOGIC_53","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"RunnerInstallDialog.runner_fetch_cb filters children with: if child_widget.get_name() not in\n\"GtkBox\". 'in \"GtkBox\"' is a substring test against the literal string \"GtkBox\", not an identity\nor set check. Any widget whose get_name() returns a substring of \"GtkBox\" (e.g. \"Box\", \"Gtk\",\n\"\") would be wrongly preserved, and the intent (skip GtkBox containers) is fragile. This relies on\ndefault widget type-names and breaks if a name is set.","fix":"Compare explicitly: if child_widget.get_name() != \"GtkBox\": child_widget.destroy(), or better,\ntrack the widgets to remove directly rather than matching on type name strings.","locations":[{"ref":"lutris/gui/dialogs/runner_install.py:185-187","code":"  185 |         for child_widget in self.vbox.get_children():\n  186 |             if child_widget.get_name() not in \"GtkBox\":\n  187 |                 child_widget.destroy()","lines":3,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/dialogs/runner_install.py#L185-L187"}]},
{"id":"LOGIC_54","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"UninstallDialog.update_uninstall_button only ever sets the button label to 'Uninstall' when at\nleast one installed game is present; it never resets the label back. Since add_games can be called\nmultiple times and games can transition, the button label can stay 'Uninstall' even when only\nremove-from-library actions remain, mislabeling the destructive action.","fix":"Set the label in both branches: 'Uninstall' when any installed game is present, otherwise the\nappropriate 'Remove' label.","locations":[{"ref":"lutris/gui/dialogs/uninstall_dialog.py:231-233","code":"  231 |     def update_uninstall_button(self) -> None:\n  232 |         if any(g for g in self.games if g.is_installed):\n  233 |             self.uninstall_button.set_label(_(\"Uninstall\"))","lines":3,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/dialogs/uninstall_dialog.py#L231-L233"}]},
{"id":"LOGIC_55","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"get_rating() always returns '' (script_box.py:25-27) and is the only source for the\nrating_label, so the rating column is permanently empty - a packed, aligned label that never\ndisplays anything. Either dead presentation code or an unfinished feature left wired into the\nUI layout.","fix":"Remove the rating label/column until ratings are implemented, or implement get_rating().","locations":[{"ref":"lutris/gui/installer/script_box.py:25-27","code":"   25 |     def get_rating(self):\n   26 |         \"\"\"Return a string representation of the API rating\"\"\"\n   27 |         return \"\"","lines":3,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/installer/script_box.py#L25-L27"},{"ref":"lutris/gui/installer/script_box.py:38-40","code":"   38 |         rating_label = InstallerLabel(self.get_rating(), selectable=True)\n   39 |         rating_label.set_alignment(1, 0.5)\n   40 |         title_box.pack_end(rating_label, False, False, 0)","lines":3,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/installer/script_box.py#L38-L40"}]},
{"id":"LOGIC_56","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"get_status() returns the label text only when the status label is visible, otherwise ''.\non copy_clicked in create_error_page composes 'f\"{status}\\n\\n{details}\"'. If the status\nlabel happens to be hidden at copy time the copied report silently loses the error summary\nline, even though present_error_page set it via set_status (which also makes it visible). The\ncoupling between visibility and text retrieval is fragile.","fix":"Have get_status() return the text regardless of visibility (or store the last status string separately) so error reports always include the summary.","locations":[{"ref":"lutris/gui/installerwindow.py:301-302","code":"  301 |     def get_status(self):\n  302 |         return self.status_label.get_text() if self.status_label.get_visible() else \"\"","lines":2,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/installerwindow.py#L301-L302"},{"ref":"lutris/gui/installerwindow.py:959-966","code":"  959 |         def on_copy_clicked(_button):\n  960 |             status = self.get_status()\n  961 |             details = self.error_details_buffer.get_text(\n  962 |                 self.error_details_buffer.get_start_iter(), self.error_details_buffer.get_end_iter(), True\n  963 |             )\n  964 |             text = f\"{status}\\n\\n{details}\"\n  965 |             clipboard = Gtk.Clipboard.get(Gdk.SELECTION_CLIPBOARD)\n  966 |             clipboard.set_text(text, -1)","lines":8,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/installerwindow.py#L959-L966"}]},
{"id":"LOGIC_57","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"load_input_menu_page consumes the options via option.popitem() (installerwindow.py:837),\nmutating the caller's option dicts. If this page is revisited or the same options list is\nreused, the dicts are now empty and popitem() raises KeyError. The page uses jump_to_page\n(comment at 855 says revisiting is unsafe) which mitigates re-entry, but the destructive\nmutation of caller-owned data is a latent footgun.","fix":"Read the single key/value non-destructively, e.g. (key, label) = next(iter(option.items())), instead of popitem().","locations":[{"ref":"lutris/gui/installerwindow.py:836-838","code":"  836 |             for option in options:\n  837 |                 key, label = option.popitem()\n  838 |                 model.append([key, label])","lines":3,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/installerwindow.py#L836-L838"}]},
{"id":"LOGIC_58","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"on_game_updated(): in the service branch (self.service set) the code computes db_game via\nself.service.get_service_db_game(game) but never applies the is_game_displayed() removal\ncheck that the non-service branch applies (lines 1427-1429). So when a game update moves it\nout of the current service-backed category, it is updated in place instead of removed from\nthe view, leaving stale entries in service views until a full update_store().","fix":"Apply the same is_game_displayed()-based removal logic in the service branch, or factor the\ndisplay/removal decision so both branches share it.","locations":[{"ref":"lutris/gui/lutriswindow.py:1435-1455","code":" 1435 |     def on_game_updated(self, game):\n 1436 |         \"\"\"Updates an individual entry in the view when a game is updated\"\"\"\n 1437 |         add_to_path_cache(game)\n 1438 |         self.update_action_state()\n 1439 | \n 1440 |         if self.service:\n 1441 |             db_game = self.service.get_service_db_game(game)\n 1442 |         else:\n 1443 |             db_game = games_db.get_game_by_field(game.id, \"id\")\n 1444 | \n 1445 |             if db_game and not self.is_game_displayed(game) and \"id\" in db_game:\n 1446 |                 self.game_store.remove_game(db_game[\"id\"])\n 1447 |                 return True\n 1448 | \n 1449 |         if db_game:\n 1450 |             updated_columns = self.game_store.update(db_game)\n 1451 |             sensitive_columns = self.get_sort_sensitive_columns()\n 1452 |             if updated_columns is None or not sensitive_columns.isdisjoint(updated_columns):\n 1453 |                 self.update_store()\n 1454 | \n 1455 |         return True","lines":21,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/lutriswindow.py#L1435-L1455"}]},
{"id":"LOGIC_59","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In cellrenderers.render_badge_stack, spacing is computed as\n(media_area.height - badge_height * len(icon_paths)) / max(1, len(icon_paths) - 1) and then\nclamped with min(spacing, 1). This silently negates the intended behavior when there is one\nicon: with a single badge, len-1 == 0 so the denominator is forced to 1, and spacing can be a\nlarge positive number that then gets clamped to 1, but y_offset = floor(badge_height + spacing)\nis still applied via (len(icon_paths) - 1) == 0, so it happens to work. However spacing can be\nnegative (overlapping badges) and min(spacing, 1) does not clamp a negative lower bound,\nallowing badges to be pushed off the top of the media when many icons must fit.","fix":"Clamp spacing to a sensible range (e.g. max(min_overlap, min(spacing, 1))) and verify the multi-icon overflow case keeps all badges within media_area.","locations":[{"ref":"lutris/gui/widgets/cellrenderers.py:430-460","code":"  430 |     def render_badge_stack(self, cr, widget, surface, surface_x, icon_paths, media_area):\n  431 |         \"\"\"Renders a vertical stack of badges, placed at the edge of the media, just to the left\n  432 |         of 'media_area.right'. The icons in icon_paths are drawn from top to bottom, and spaced\n  433 |         to fit in 'media_area', even if they overlap because of this.\"\"\"\n  434 | \n  435 |         badge_width = self.badge_size[0]\n  436 |         badge_height = self.badge_size[1]\n  437 |         alpha = self.badge_alpha\n  438 |         fore_color = self.badge_fore_color\n  439 |         back_color = self.badge_back_color\n  440 | \n  441 |         def render_badge(badge_x, badge_y, path):\n  442 |             cr.rectangle(badge_x, badge_y, badge_width, badge_height)\n  443 |             cr.set_source_rgba(back_color[0], back_color[1], back_color[2], alpha)\n  444 |             cr.fill()\n  445 | \n  446 |             icon = self._get_cached_surface_by_path(widget, path, size=self.badge_size)\n  447 |             cr.set_source_rgba(fore_color[0], fore_color[1], fore_color[2], alpha)\n  448 |             cr.mask_surface(icon, badge_x, badge_y)\n  449 | \n  450 |         media_right = surface_x + get_surface_size(surface)[0]\n  451 | \n  452 |         x = media_right - badge_width\n  453 |         spacing = (media_area.height - badge_height * len(icon_paths)) / max(1, len(icon_paths) - 1)\n  454 |         spacing = min(spacing, 1)\n  455 |         y_offset = floor(badge_height + spacing)\n  456 |         y = media_area.y + media_area.height - badge_height - y_offset * (len(icon_paths) - 1)\n  457 | \n  458 |         for icon_path in icon_paths:\n  459 |             render_badge(x, y, icon_path)\n  460 |             y = y + y_offset","lines":31,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/widgets/cellrenderers.py#L430-L460"}]},
{"id":"LOGIC_60","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"FileChooserEntry.update_completion appends one more completion item than the\ndocumented maximum. The loop breaks only after `index > self.max_completion_items`, but `index`\nis incremented before the check, so up to max_completion_items + 1 (16) rows are appended while\nmax_completion_items is 15.","fix":"Use `if index >= self.max_completion_items: break` (checked before append), or break when `len(self.path_completion) >= self.max_completion_items`.","locations":[{"ref":"lutris/gui/widgets/common.py:319-328","code":"  319 |             index = 0\n  320 |             for filename in sorted(os.listdir(current_path)):\n  321 |                 if filename.startswith(\".\"):\n  322 |                     continue\n  323 |                 if filefilter is not None and not filename.startswith(filefilter):\n  324 |                     continue\n  325 |                 self.path_completion.append([os.path.join(current_path, filename)])\n  326 |                 index += 1\n  327 |                 if index > self.max_completion_items:\n  328 |                     break","lines":10,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/widgets/common.py#L319-L328"}]},
{"id":"LOGIC_61","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"DownloadCollectionProgressBox.on_retry_clicked clears self._active_downloads\nwithout cancelling the downloaders still referenced by them. If a retry is triggered while\ndownloads are mid-flight (e.g. one file errored but others are active), the active downloaders\nkeep running in the background untracked, and start() launches a fresh set, doubling network\nactivity and racing on the same .tmp files.","fix":"Cancel each active downloader (as _cancel_all does) before clearing the list in on_retry_clicked.","locations":[{"ref":"lutris/gui/widgets/download_collection_progress_box.py:262-271","code":"  262 |     def on_retry_clicked(self, button):\n  263 |         \"\"\"Retry current download.\"\"\"\n  264 |         logger.debug(\"Retrying download\")\n  265 |         button.set_label(_(\"Cancel\"))\n  266 |         button.disconnect(self.cancel_cb_id)\n  267 |         self.cancel_cb_id = button.connect(\"clicked\", self.on_cancel_clicked)\n  268 |         if self.downloader:\n  269 |             self.downloader.reset()\n  270 |         self._active_downloads.clear()\n  271 |         self.start()","lines":10,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/widgets/download_collection_progress_box.py#L262-L271"}]},
{"id":"LOGIC_62","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"update_speed_and_time only updates self.time_left_check_time at the very end of\nthe method, after the early-returns. On the first call, time_left_check_time is 0, so\nelapsed_time = get_time() - 0 is huge, producing a wildly inflated initial speed sample that\npollutes the rolling average. The single-file DownloadProgressBox does not have this issue\nbecause the downloader manages its own timing.","fix":"Initialize time_left_check_time to get_time() at construction (or on start()), so the first elapsed_time is realistic.","locations":[{"ref":"lutris/gui/widgets/download_collection_progress_box.py:387-412","code":"  387 |     def update_speed_and_time(self):\n  388 |         \"\"\"Update time left and average speed using aggregate throughput.\"\"\"\n  389 |         elapsed_time = get_time() - self.time_left_check_time\n  390 |         if elapsed_time < 1:  # Minimum delay\n  391 |             return\n  392 | \n  393 |         downloaded_size = self._aggregate_downloaded_size()\n  394 |         elapsed_size = downloaded_size - self.last_size\n  395 |         self.last_size = downloaded_size\n  396 | \n  397 |         speed = elapsed_size / elapsed_time\n  398 |         # last 20 speeds\n  399 |         if len(self.speed_list) >= 20:\n  400 |             self.speed_list.pop(0)\n  401 |         self.speed_list.append(speed)\n  402 | \n  403 |         self.avg_speed = sum(self.speed_list) / len(self.speed_list)\n  404 |         if self.avg_speed == 0:\n  405 |             self.time_left = \"???\"\n  406 |             return\n  407 | \n  408 |         average_time_left = (self.full_size - downloaded_size) / self.avg_speed\n  409 |         minutes, seconds = divmod(average_time_left, 60)\n  410 |         hours, minutes = divmod(minutes, 60)\n  411 |         self.time_left_check_time = get_time()\n  412 |         self.time_left = \"%d:%02d:%02d\" % (hours, minutes, seconds)","lines":26,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/widgets/download_collection_progress_box.py#L387-L412"}]},
{"id":"LOGIC_63","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"LogTextView.autoscroll compares adj.get_value() == self.scroll_max using exact\nfloat equality to decide whether the user is scrolled to the bottom. Floating-point\nadjustment values rarely compare exactly equal after layout changes, so autoscroll can\nsilently stop following new log output. The comment-free magic of scroll_max==0 also only\ncovers the very first call.","fix":"Compare with a small epsilon or use `adj.get_value() >= adj.get_upper() - adj.get_page_size() - epsilon` to detect bottom robustly.","locations":[{"ref":"lutris/gui/widgets/log_text_view.py:30-36","code":"   30 |     def autoscroll(self, *args: Any) -> None:  # pylint: disable=unused-argument\n   31 |         adj = self.get_vadjustment()\n   32 |         if adj.get_value() == self.scroll_max or self.scroll_max == 0:\n   33 |             adj.set_value(adj.get_upper() - adj.get_page_size())\n   34 |             self.scroll_max = adj.get_value()\n   35 |         else:\n   36 |             self.scroll_max = adj.get_upper() - adj.get_page_size()","lines":7,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/widgets/log_text_view.py#L30-L36"}]},
{"id":"LOGIC_64","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"ProgressBox._set_label compares the new span-wrapped markup against\nself.label.get_text(). get_text() returns the *rendered* text without markup, while `markup`\nis the full \"<span ...>...<\/span>\" string, so the comparison is essentially always unequal and\nset_markup/set_tooltip_markup run every update cycle. The intended short-circuit (skip if\nunchanged) never triggers.","fix":"Compare against the stored previous markup (cache it), or compare get_label()/the inner text against the inner text, not the full markup string.","locations":[{"ref":"lutris/gui/widgets/progress_box.py:116-122","code":"  116 |     def _set_label(self, markup: str) -> None:\n  117 |         if markup:\n  118 |             markup = \"<span size='10000'>%s<\/span>\" % markup\n  119 |             if markup != self.label.get_text():\n  120 |                 self.label.set_markup(markup)\n  121 |                 self.label.set_tooltip_markup(markup)\n  122 |             self.label.show()","lines":7,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/widgets/progress_box.py#L116-L122"}]},
{"id":"LOGIC_65","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"ScaledImage.get_runtime_icon_image returns an icon with set_visible(visible)\nwhere visible defaults to False, but callers that build sidebar/service icons via\nLutrisSidebar.get_sidebar_icon use StockIconImage instead; the runtime-icon path here defaults\ninvisible. Any caller relying on the default and adding the icon to a container with no_show_all\nor without an explicit show() gets an invisible icon. The default of False is an easy footgun\nfor an image-construction helper.","fix":"Default visible=True for an image factory, or require callers to pass visibility explicitly and document the default clearly.","locations":[{"ref":"lutris/gui/widgets/scaled_image.py:57-73","code":"   57 |     @staticmethod\n   58 |     def get_runtime_icon_image(icon_name, fallback_stock_icon_name=None, scale_factor=1, visible=False):\n   59 |         \"\"\"Returns a ScaledImage of an icon for runtime or service; the image has the\n   60 |         default icon size. If the icon can't be found, we'll fall back onto another,\n   61 |         stock icon. If you don't supply one (or it's not available) we'll fall back\n   62 |         further to 'package-x-generic-symbolic'; we always give you something.\"\"\"\n   63 | \n   64 |         path = get_runtime_icon_path(icon_name)\n   65 |         if path:\n   66 |             icon = ScaledImage.new_scaled_from_path(path, size=ICON_SIZE, scale_factor=scale_factor)\n   67 |         else:\n   68 |             if not has_stock_icon(fallback_stock_icon_name):\n   69 |                 fallback_stock_icon_name = \"package-x-generic-symbolic\"\n   70 | \n   71 |             icon = Gtk.Image.new_from_icon_name(fallback_stock_icon_name, Gtk.IconSize.DND)\n   72 |         icon.set_visible(visible)\n   73 |         return icon","lines":17,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/widgets/scaled_image.py#L57-L73"}]},
{"id":"LOGIC_66","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"After updating the sortname field, the success log message 'Added blank sortname for %s' is logged unconditionally for every game returned by the API, not just the ones whose sortname was actually missing and updated (the logger.info call is outside/after the if-block, at the same indentation, rather than nested inside it). This produces misleading log output implying every game got a blank sortname added, even when nothing changed for most of them.","fix":"Indent the logger.info call inside the if block so it only logs when the update actually happens, or change the wording to not imply an update occurred.","locations":[{"ref":"lutris/migrations/migrate_sortname.py:13-16","code":"   13 |     for game in games:\n   14 |         if \"sortname\" not in game.keys() or game[\"sortname\"] is None:\n   15 |             sql.db_update(settings.DB_PATH, \"games\", {\"sortname\": \"\"}, {\"slug\": game[\"slug\"]})\n   16 |         logger.info(\"Added blank sortname for %s\", game[\"name\"])","lines":4,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/migrations/migrate_sortname.py#L13-L16"}]},
{"id":"LOGIC_67","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"PreferencesDialog defines self.page_generators and uses it for stack pages, while the base\nGameDialogCommon already maintains notebook_page_generators. The two are unrelated mechanisms that\nhappen to use near-identical names, which is confusing. PreferencesDialog also overrides on_save with a\nsignature on_save(self, _widget) that ignores the notebook-based saving in the base class - acceptable\nsince it uses a stack, but the divergence between notebook-based and stack-based dialogs sharing one\nbase class is an architectural smell.","fix":"Rename page_generators to something stack-specific (e.g. stack_page_generators) to avoid confusion\nwith the base class notebook_page_generators.","locations":[{"ref":"lutris/gui/config/preferences_dialog.py:28","code":"   28 |         self.page_generators = {}","lines":1,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/config/preferences_dialog.py#L28"},{"ref":"lutris/gui/config/preferences_dialog.py:81-88","code":"   81 |     def on_sidebar_activated(self, _listbox, row):\n   82 |         stack_id = row.get_children()[0].stack_id\n   83 | \n   84 |         generator = self.page_generators.get(stack_id)\n   85 | \n   86 |         if generator:\n   87 |             del self.page_generators[stack_id]\n   88 |             generator()","lines":8,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/config/preferences_dialog.py#L81-L88"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"easy","description":"easyrpg.py defines the game option with key \"patch\" (singular) at line 72, but play() reads self.game_config.get(\"patches\") (plural) at line 533 -- a nonexistent key that always returns None. As a result, the user's patch selection is silently ignored: neither \"--patches\" nor \"--no-patch\" is ever passed to the emulator, regardless of what the user configured in the UI.","fix":"Change line 533 to self.game_config.get(\"patch\") to match the option key defined at line 72.","locations":[{"ref":"lutris/runners/easyrpg.py:72","code":"   72 |             \"option\": \"patch\",","lines":1,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/runners/easyrpg.py#L72"},{"ref":"lutris/runners/easyrpg.py:530-537","code":"  530 |         if engine:\n  531 |             cmd.extend((\"--engine\", engine))\n  532 | \n  533 |         patches = self.game_config.get(\"patches\")\n  534 |         if patches == \"none\":\n  535 |             cmd.append(\"--no-patch\")\n  536 |         elif patches:\n  537 |             cmd.extend((\"--patches\", *patches.split()))","lines":8,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/runners/easyrpg.py#L530-L537"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"medium","description":"mednafen.py's platform_dict maps \"NEC PC Engine TurboGrafx-16\" to the machine code \"pce_fast\" (line 29) and \"SNK Neo Geo Pocket (Color)\" to \"gnp\" (line 27). However, the 'layout' dict inside set_joystick_controls() (used to build per-machine joystick control arguments) only defines the key \"pce\" (line 305) and \"ngp\" (line 388) -- never \"pce_fast\" or \"gnp\". When a joystick is connected and controller mapping is not disabled, play() calls set_joystick_controls(joy_ids, machine) (line 489), which does layout[machine] (line 447). Selecting either the PC Engine or Neo Geo Pocket platform with a joystick plugged in raises an unhandled KeyError, crashing the launch.","fix":"Rename the layout dict keys to match platform_dict's machine codes (\"pce_fast\" and \"gnp\"), or normalize both ends to a single canonical code. Also note the gamepad-selection chain at lines 433-444 doesn't special-case \"pce_fast\"/\"gnp\" either, so it should be reviewed at the same time.","locations":[{"ref":"lutris/runners/mednafen.py:27-29","code":"   27 |         _(\"SNK Neo Geo Pocket (Color)\"): \"gnp\",\n   28 |         _(\"Nintendo NES\"): \"nes\",\n   29 |         _(\"NEC PC Engine TurboGrafx-16\"): \"pce_fast\",","lines":3,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/runners/mednafen.py#L27-L29"},{"ref":"lutris/runners/mednafen.py:290-430","code":"  290 |         layout = {\n  291 |             \"nes\": [\"a\", \"b\", \"start\", \"select\", \"up\", \"down\", \"left\", \"right\"],\n  292 |             \"gb\": [\"a\", \"b\", \"start\", \"select\", \"up\", \"down\", \"left\", \"right\"],\n  293 |             \"gba\": [\n  294 |                 \"a\",\n  295 |                 \"b\",\n  296 |                 \"shoulder_r\",\n  297 |                 \"shoulder_l\",\n  298 |                 \"start\",\n  299 | {"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"easy","description":"vice.py's platform_dict and the executables dict correctly use the key \"cbmii\" for the Commodore CBM II machine (lines 23 and 94), but four other dicts used during play() -- get_roms_path's paths dict (line 129), get_option_prefix's prefixes dict (line 142), get_joydevs's joydevs dict (line 148), and get_rom_args's crt_option dict (line 162) -- all use the typo'd key \"cmbii\" instead. Selecting the \"Commodore CBM II\" platform and starting the game raises an unhandled KeyError in get_option_prefix() (called unconditionally at line 183 in play()) or get_rom_args() (called unconditionally at line 206), making this platform option guaranteed to crash on launch.","fix":"Replace the typo'd \"cmbii\" key with \"cbmii\" in the paths, prefixes, joydevs, and crt_option dicts so they match platform_dict and executables.","locations":[{"ref":"lutris/runners/vice.py:23","code":"   23 |         _(\"Commodore CBM II\"): \"cbmii\",","lines":1,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/runners/vice.py#L23"},{"ref":"lutris/runners/vice.py:94","code":"   94 |             \"cbmii\": \"xcbm2\",","lines":1,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/runners/vice.py#L94"},{"ref":"lutris/runners/vice.py:129","code":"  129 |             \"cmbii\": \"CBM-II\",","lines":1,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/runners/vice.py#L129"},{"ref":"lutris/runners/vice.py:142","code":"  142 |             \"cmbii\": \"CRTC\",","lines":1,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/runners/vice.py#L142"},{"ref":"lutris/runners/vice.py:148","code":"  148 |         joydevs = {\"c64\": 2, \"c128\": 2, \"vic20\": 1, \"pet\": 0, \"plus4\": 2, \"cmbii\": 0}","lines":1,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/runners/vice.py#L148"},{"ref":"lutris/runners/vice.py:162","code":"  162 |                 \"cmbii\": None,","lines":1,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/runners/vice.py#L162"},{"ref":"lutris/runners/vice.py:183","code":"  183 |         option_prefix = self.get_option_prefix(machine)","lines":1,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/runners/vice.py#L183"},{"ref":"lutris/runners/vice.py:206","code":"  206 |         params.extend(self.get_rom_args(machine, rom))","lines":1,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/runners/vice.py#L206"}]},
{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"The FileNotFoundError branch's message contains a literal '%s' placeholder ('Path %s not found, unable to create game folder. Is the disk mounted?') but it is never formatted with self.target_path via the % operator; target_path is instead passed as faulty_data, a separate field that ScriptingError.__str__ appends on a new line. The user sees a literal, unsubstituted '%s' in the primary error message. This is inconsistent with the sibling PermissionError branch immediately above, which correctly omits the %s and relies solely on faulty_data.","fix":"Either format the string directly: ScriptingError(_(\"Path %s not found, unable to create game folder. Is the disk mounted?\") % self.target_path) or drop the %s from the message text to match the PermissionError branch's style, relying on faulty_data alone.","locations":[{"ref":"lutris/installer/interpreter.py:234-243","code":"  234 |             except PermissionError as err:\n  235 |                 raise ScriptingError(\n  236 |                     _(\"Lutris does not have the necessary permissions to install to path:\"),\n  237 |                     faulty_data=self.target_path,\n  238 |                 ) from err\n  239 |             except FileNotFoundError as err:\n  240 |                 raise ScriptingError(\n  241 |                     _(\"Path %s not found, unable to create game folder. Is the disk mounted?\"),\n  242 |                     faulty_data=self.target_path,\n  243 |                 ) from err","lines":10,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/installer/interpreter.py#L234-L243"}]},
{"id":"CPY_5","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"In print_service_game_list the truncation `[:15]` is applied to the literal string \"false\" rather\nthan to the formatted field. `\"false\"[:15]` is a no-op, and the intended truncation/alignment of the\ninstalled column is not what was written. The ternary also makes the slice apply only to the False\nbranch, which is clearly a copy-paste artifact from the adjacent truncated columns.","fix":"Replace `\"true\" if game[\"installed\"] else \"false\"[:15]` with simply\n`\"true\" if game[\"installed\"] else \"false\"` (the field already fits the {:<15} format spec).","locations":[{"ref":"lutris/gui/application.py:961","code":"  961 |                     \"true\" if game[\"installed\"] else \"false\"[:15],","lines":1,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/application.py#L961"}]},
{"id":"CPY_6","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"The exception handler for failed runner sidebar rows logs the wrong variable.\nWhen a RunnerSidebarRow fails to load, the log message interpolates `service_name` (left over\nfrom the service loop above) instead of `runner_name`. `service_name` may hold a stale value\nfrom the previous loop, or be undefined if the service loop never iterated, raising a\nNameError inside the except handler and masking the original error.","fix":"Change the log call to use `runner_name` instead of `service_name`.","locations":[{"ref":"lutris/gui/widgets/sidebar.py:759-774","code":"  759 |         for runner_name in self.installed_runners:\n  760 |             if runner_name not in self.runner_rows:\n  761 |                 try:\n  762 |                     icon_name = runner_name.lower().replace(\" \", \"\") + \"-symbolic\"\n  763 |                     runner = runners.import_runner(runner_name)()\n  764 |                     runner_row = RunnerSidebarRow(\n  765 |                         runner_name,\n  766 |                         \"runner\",\n  767 |                         runner.human_name,\n  768 |                         self.get_sidebar_icon(icon_name),\n  769 |                         application=self.application,\n  770 |                     )\n  771 |                     insert_row(runner_row)\n  772 |                     self.runner_rows[runner_name] = runner_row\n  773 |                 except Exception as ex:\n  774 |                     logger.exception(\"Sidebar row for '%s' could not be loaded: %s\", service_name, ex)","lines":16,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/widgets/sidebar.py#L759-L774"}]},
