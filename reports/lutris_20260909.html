51b669884f389b1eb8e6d/lutris/gui/lutriswindow.py#L595-L597"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"WidgetGenerator._generate_choice calls expand_combobox_choices() once inside\npopulate_combobox_choices() (via line 475) and then again directly at line 489 to compute\nvalid_choices/expanded_choices. For every combobox option this iterates the (possibly evaluated)\nchoices twice, and if 'choices' is a callable it may have already been invoked once via\n_evaluate_option. The duplicate expansion is wasteful and risks inconsistency if the choices source\nis non-deterministic.","fix":"Call expand_combobox_choices() once, store its (expanded, tooltip_default, valid) result, and reuse\nit for both populating the liststore and computing valid_choices/active id.","locations":[{"ref":"lutris/gui/config/widget_generator.py:474-489","code":"  474 |         liststore = Gtk.ListStore(str, str)\n  475 |         populate_combobox_choices()\n  476 |         # With entry (\"choice_with_entry\" type)\n  477 |         if has_entry:\n  478 |             combobox = Gtk.ComboBox.new_with_model_and_entry(liststore)\n  479 |             combobox.set_entry_text_column(0)\n  480 |         # No entry (\"choice\" type)\n  481 |         else:\n  482 |             combobox = Gtk.ComboBox.new_with_model(liststore)\n  483 |             cell = Gtk.CellRendererText()\n  484 |             combobox.pack_start(cell, True)\n  485 |             combobox.add_attribute(cell, \"text\", 0)\n  486 | \n  487 |         combobox.set_id_column(1)\n  488 | \n  489 |         expanded_choices, _tooltip_default, valid_choices = expand_combobox_choices()","lines":16,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/config/widget_generator.py#L474-L489"}]},

error):\n  426 |         \"\"\"Called when a runner archive is extracted\"\"\"\n  427 |         if error or not row_info:\n  428 |             ErrorDialog(_(\"Failed to retrieve the runner archive\"), parent=self)\n  429 |             return","lines":5,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/dialogs/runner_install.py#L425-L429"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"UninstallDialog calls get_widget_children(self.uninstall_game_list, GameRemovalRow) on every\nget_game_removal_rows() invocation, and several update methods iterate all rows repeatedly\n(update_deletability, update_all_checkboxes calls it twice via the nested update(), on_row_updated,\n_apply_all_checkbox, _get_next_folder_size_cb). For large libraries each checkbox toggle triggers\nmultiple full traversals of the list-box children. With many games this is O(n) per toggle times\nseveral traversals.","fix":"Cache the list of GameRemovalRow objects (rebuild only when rows are added/removed) instead of\nre-querying widget children on every access.","locations":[{"ref":"lutris/gui/dialogs/uninstall_dialog.py:49-50","code":"   49 |     def get_game_removal_rows(self) -> list[\"GameRemovalRow\"]:\n   50 |         return get_widget_children(self.uninstall_game_list, GameRemovalRow)","lines":2,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/dialogs/uninstall_dialog.py#L49-L50"},{"ref":"lutris/gui/dialogs/uninstall_dialog.py:195-229","code":"  195 |     def update_all_checkboxes(self) -> None:\n  196 |         \"\"\"Sets the state of the checkboxes at the button that are used to control all\n  197 |         settings together. While we are actually updating these checkboxes en-mass,\n  198 |         this method does nothing at all.\"\"\"\n  199 | \n  200 |         def update(checkbox, is_candidate, is_set):\n  201 |             set_count = 0\n  202 |             unset_count = 0\n  203 |             for row in self.get_game_removal_rows():\n  204 |                 if is_candidate(row):\n  205 |                     if is_set(row):\n  206 |                         set_count += 1\n  207 |                     else:\n  208 |                         unset_count += 1\n  209 | \n  210 |             checkbox.set_active(se {"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"NotificationSource._notify pops scheduled callbacks from the front of a list with\nself._scheduled_callbacks.pop(0), which is O(n) per pop and O(n^2) for the batch. While\nthis is in widgets/__init__.py (out of slice), download_queue.py fires\nDOWNLOAD_QUEUE_COMPLETED after every operation and lutriswindow registers many handlers on\nmany NotificationSources; high-frequency fires (e.g. per-poll progress) amplify the cost.\nNoted here as it affects the download-queue path's responsiveness.","fix":"Have download-queue fire completion less aggressively, or change NotificationSource to\ndrain via a deque / index pointer (O(1) pops) upstream.","locations":[{"ref":"lutris/gui/download_queue.py:197-199","code":"  197 |             DOWNLOAD_QUEUE_COMPLETED.fire()\n  198 | \n  199 |         AsyncCall(operation, completion_callback)","lines":3,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/download_queue.py#L197-L199"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"GridViewCellRendererImage._get_cached_surface_by_path keys its surface cache on\n(widget, path, size, preserve_aspect_ratio), holding a strong reference to the GTK widget in the\ndict keys. Across widget recreation these stale widget references stay in cached_surfaces_old/new\nuntil cycle_cache ages them out, keeping destroyed widgets alive longer than necessary.","fix":"Key the cache on the scale factor (or an id) rather than the widget object, since only widget.get_scale_factor() is actually used in _get_surface_by_path.","locations":[{"ref":"lutris/gui/widgets/cellrenderers.py:531-555","code":"  531 |     def _get_cached_surface_by_path(self, widget, path, size, preserve_aspect_ratio=True):\n  532 |         \"\"\"This obtains the scaled surface to rander for a given media path; this is cached\n  533 |         in this render, but we'll clear that cache when the media generation number is changed,\n  534 |         or certain properties are. We also age surfaces from the cache at idle time after\n  535 |         rendering.\"\"\"\n  536 |         if self.cached_surface_generation != _MEDIA_CACHE_GENERATION_NUMBER:\n  537 |             self.cached_surface_generation = _MEDIA_CACHE_GENERATION_NUMBER\n  538 |             self.clear_cache()\n  539 | \n  540 |         key = widget, path, size, preserve_aspect_ratio\n  541 | \n  542 |         if key in self.cached_surfaces_new:\n  543 |             return self.cached_surfaces_new[key]\n  544 | \n  545 |         if key in self.cached_surfaces_old:\n  546 |             surface = self.cached_surfaces_old[key]\n  547 |         else:\n  548 |             surface = self._get_surface_by_path(widget, path, size, preserve_aspect_ratio)\n  549 |             if surface:\n  550 |                 # We cache missing surfaces too, but only a successful load trigger\n  551 |                 # cache cycling\n  552 |                 self.cached_surfaces_loaded += 1\n  553 | \n  554 |         self.cached_surfaces_new[key] = surface\n  555 |         return surface","lines":25,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/widgets/cellrenderers.py#L531-L555"}]},

 = service_row\n  756 |                 except Exception as ex:\n  757 |                     logger.exception(\"Sidebar row for '%s' could not be loaded: %s\", service_name, ex)\n  758 | \n  759 |         for runner_name in self.installed_runners:\n  760 |             if runner_name not in self.runner_rows:\n  761 |                 try:\n  762 |                     icon_name = runner_name.lower().replace(\" \", \"\") + \"-symbolic\"\n  763 |                     runner = runners.import_runner(runner_name)()\n  764 |                     runner_row = RunnerSidebarRow(\n  765 |                         runner_name,\n  766 |                         \"runner\",\n  767 |                         runner.human_name,\n  768 |                         self.get_sidebar_icon(icon_name),\n  769 |                         application=self.application,\n  770 |                     )\n  771 |                     insert_row(runner_row)\n  772 |                     self.runner_rows[runner_name] = runner_row\n  773 |                 except Exception as ex:\n  774 |                     logger.exception(\"Sidebar row for '%s' could not be loaded: %s\", service_name, ex)\n  775 | \n  776 |         for platform in self.active_platforms:\n  777 |             if platform not in self.platform_rows:\n  778 |                 icon_name = platform.lower().replace(\" \", \"\").replace(\"/\", \"_\") + \"-symbolic\"\n  779 |                 platform_row = SidebarRow(\n  780 |                     platform, \"platform\", platform, self.get_sidebar_icon(icon_name), application=self.application\n  781 |                 )\n  782 |                 self.platform_rows[platform] = platform_row\n  783 |                 insert_row(platform_row)\n  784 | \n  785 |         # Remove stale category rows that no longer exist in the database\n  786 |         stale_categories = set(self.category_rows.keys()) - self.used_categories\n  787 |         for stale_name in stale_categories:\n  788 |             stale_row = self. {"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"medium","difficulty":"easy","description":"In GOGService.get_extras_files, the fallback branch compares a string to a list of dicts: `selected_extras` is typed `list[dict]`, but the elif condition does `str(extra[\"id\"]) in selected_extras`, which checks membership of a string against a list of dict objects. This is always False, so `links = self.query_download_links(extra)` can never execute. Any extra lacking a `downlinks` key silently gets an empty `links` list instead of falling back to querying download links, meaning some GOG extras can never be downloaded through this path.","fix":"Compare against the ids in selected_extras, e.g.:\nelif str(extra[\"id\"]) in [str(e[\"id\"]) for e in selected_extras]:\n    links = self.query_download_links(extra)\nOr restructure to avoid needing this membership check at all since `extra` already comes from `selected_extras`.","locations":[{"ref":"lutris/services/gog.py:519-528","code":"  519 |     def get_extras_files(self, installer: \"LutrisInstaller\", selected_extras: list[dict]) -> list[InstallerFile]:\n  520 |         extra_files = []\n  521 |         for extra in selected_extras:\n  522 |             downlinks = extra.get(\"downlinks\")\n  523 |             if downlinks:\n  524 |                 links = [info for link in downlinks for info in self.get_download_info(link)]\n  525 |             elif str(extra[\"id\"]) in selected_extras:\n  526 |                 links = self.query_download_links(extra)\n  527 |             else:\n  528 |                 links = []","lines":10,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/services/gog.py#L519-L528"}]},

{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"InstallerFileBox.on_state_changed(self, _widget, state) is never connected or called\nanywhere. The Steam state updates are routed through on_steam_game_state_changed\n(registered at line 78), which reads installer.state directly. on_state_changed is leftover\ndead code with a now-incorrect signature/contract.","fix":"Remove the unused on_state_changed method.","locations":[{"ref":"lutris/gui/installer/file_box.py:196-198","code":"  196 |     def on_state_changed(self, _widget, state):\n  197 |         \"\"\"Update the state label with a new state\"\"\"\n  198 |         self.state_label.set_text(state)","lines":3,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/installer/file_box.py#L196-L198"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"The 'view_type' property (lines 978-984) duplicates 'current_view_type' (lines 415-418)\nbut with different fallback behavior (returns self.default_view_type vs \"grid\"). A\ncodebase-wide search shows nothing reads self.view_type; every caller uses\ncurrent_view_type. This property is dead code and its divergent fallback is a trap for\nfuture readers who may use the wrong one.","fix":"Remove the unused 'view_type' property, or consolidate the two into one property used consistently.","locations":[{"ref":"lutris/gui/lutriswindow.py:988-994","code":"  988 |     @property\n  989 |     def view_type(self):\n  990 |         \"\"\"Return the type of view saved by the user\"\"\"\n  991 |         view_type = settings.read_setting(\"view_type\")\n  992 |         if view_type in [\"grid\", \"list\"]:\n  993 |             return view_type\n  994 |         return self.default_view_type","lines":7,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/lutriswindow.py#L988-L994"},{"ref":"lutris/gui/lutriswindow.py:425-428","code":"  425 |     @property\n  426 |     def current_view_type(self):\n  427 |         \"\"\"Returns which kind of view is currently presented (grid or list)\"\"\"\n  428 |         return settings.read_setting(\"view_type\") or \"grid\"","lines":4,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/lutriswindow.py#L425-L428"}]},
{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In DownloadCache.is_safe_to_delete(), the early check already returns when state is in a tuple that includes CacheState.DOWNLOADED, making the later `if state == CacheState.DOWNLOADED:` block unreachable. Harmless but indicates the logic was edited without removing the now-dead branch, and makes the function's true behavior harder to follow.","fix":"Remove the dead `if state == CacheState.DOWNLOADED:` block, or restructure the membership check to make intent clearer.","locations":[{"ref":"lutris/util/download_cache.py:147-162","code":"  147 |     # Active states - never delete\n  148 |     if state in (CacheState.DOWNLOADING, CacheState.DOWNLOADED, CacheState.INSTALLING):\n  149 |         logger.info(\n  150 |             \"Cache protection: preserving %s (state: %s)\",\n  151 |             os.path.basename(file_path),\n  152 |             state.value,\n  153 |         )\n  154 |         return False\n  155 | \n  156 |     # Downloaded but not yet installed - preserve\n  157 |     if state == CacheState.DOWNLOADED:\n  158 |         logger.info(\n  159 |             \"Cache protection: preserving downloaded file %s for installation\",\n  160 |             os.path.basename(file_path),\n  161 |         )\n  162 |         return False","lines":16,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/util/download_cache.py#L147-L162"}]},

{"id":"DEAD_8","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"ItchIoService declares a class attribute `key_cache = {}` that is never read or written anywhere else in the file. Only the similarly-named `key_cache_file` (a path string) is actually used for the on-disk owned-keys cache. `key_cache` appears to be leftover/vestigial from a prior in-memory caching approach that was replaced by the file-based cache, and is now pure dead code (and, being a mutable class-level dict, would also be a latent shared-mutable-default bug if ever (re)used as-is across instances).","fix":"Remove the unused `key_cache = {}` class attribute.","locations":[{"ref":"lutris/services/itchio.py:106","code":"  106 |     key_cache = {}","lines":1,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/services/itchio.py#L106"}]},

wait_for and not self.running_operation_names.isdisjoint(wait_for):\n  124 |             # Defer the entire start (including the progress box) until the\n  125 |             # blocking operations complete.\n  126 |             def on_maybe_ready():\n  127 |                 if self.running_operation_names.isdisjoint(wait_for):\n  128 |                     registration.unregister()\n  129 |                     self.start(\n  130 |                         operation,\n  131 |                         progress_function,\n  132 |                         completion_function=completion_function,\n  133 |                         error_function=error_function,\n  134 |                         operation_name=operation_name,\n  135 |                     )\n  136 | \n  137 |             registration = DOWNLOAD_QUEUE_COMPLETED.register(on_maybe_ready)\n  138 |             return True","lines":32,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/download_queue.py#L107-L138"}]},

{"id":"ARCH_2","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"GameDialogCommon.is_valid instantiates a fresh runner object (runner_class()) purely to iterate\noption validators every time validation runs, and iterates all game+runner config items calling\nfind_option for each. For runners with many options this is repeated work on every save attempt, and\nconstructing a runner instance can have side effects. Validation could reuse the already-loaded\nrunner where available.","fix":"Reuse an existing runner instance (e.g. self.game.runner when present) instead of importing and\ninstantiating a new runner solely for validation, and cache find_option lookups.","locations":[{"ref":"lutris/gui/config/game_common.py:383-401","code":"  383 |         invalid_fields = []\n  384 |         runner_class = import_runner(self.runner_name)\n  385 |         runner_instance = runner_class()\n  386 |         for config in [\"game\", \"runner\"]:\n  387 |             for k, v in getattr(self.lutris_config, config + \"_config\").items():\n  388 |                 option = runner_instance.find_option(config + \"_options\", k)\n  389 |                 if option is None:\n  390 |                     continue\n  391 |                 validator = option.get(\"validator\")\n  392 |                 if validator is not None:\n  393 |                     try:\n  394 |                         res = validator(v)\n  395 |                         logger.debug(\"%s validated successfully: %s\", k, res)\n  396 |                     except Exception:\n  397 |                         invalid_fields.append(option.get(\"label\"))\n  398 |         if invalid_fields:\n  399 |             ErrorDialog(_(\"The following fields have invalid values: \") + \", \".join(invalid_fields), parent=self)\n  400 |             return False\n  401 |         return True","lines":19,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/config/game_common.py#L383-L401"}]},
{"id":"ARCH_3","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"WidgetGenerator (~908 lines) is a single class that owns: an ABC contract, 12 widget factory methods\neach with nested closures, async-reload protocol handling, tooltip/condition/visibility evaluation,\nand callable-arity introspection (evaluate_option_value). The arity-guessing logic in\nevaluate_option_value (inspecting signatures and slicing args) is especially subtle and fragile - it\nsilently changes how callbacks are invoked based on declared parameter count, which is surprising\nbehavior that can call a callback with the wrong arguments if a callback's signature is refactored.","fix":"Split the widget factories out of WidgetGenerator and replace the implicit arity-based dispatch in\nevaluate_option_value with an explicit, documented callback protocol (fixed signature) so callbacks\nare always invoked the same way.","locations":[{"ref":"lutris/gui/config/widget_generator.py:797-823","code":"  797 |     def evaluate_option_value(self, value: Any, option: dict[str, Any]) -> Any:\n  798 |         \"\"\"Evaluates the 'value' given, if it is callable. If not, this method just\n  799 |         returns the 'value'.\n  800 | \n  801 |         The 'value' is called with the option-key and then all the callback arguments\n  802 |         given to this generator's __init__. If the 'value' takes fewer arguments than\n  803 |         this, trailing arguments are omitted.\"\"\"\n  804 |         if callable(value):\n  805 |             sig = signature(value)\n  806 |             argcount = len(sig.parameters)\n  807 | \n  808 |             option_key = option[\"option\"]\n  809 |             argsneeded = 1 + len(self.callback_args)\n  810 | \n  811 |             if argcount >= argsneeded:  # enough declared args?\n  812 |                 return value(option_key, *self.callback_args, **self.callback_kwargs)\n  813 |             elif any(p.kind == Parameter.VAR_POSITIONAL for p in sig.parameters.values()):  # unlimited args via *args?\n  814 |                 return value(option_key, *self.callback_args, **self.callback_kwargs)\n  815 |             elif argcount == 0:  # no args?\n  816 |                 return value(**self.callback_kwargs)\n  817 |             else:  # any other number of args\n  818 |                 args = list(self.callback_args)\n  819 |                 args.insert(0, option_key)\n  820 |                 args = args[:argcount]\n  821 |                 return value(*args, **self.callback_kwargs)\n  822 | \n  823 |         return value","lines":27,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/config/widget_generator.py#L797-L823"}]},
{"id":"ARCH_4","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"ShowAppsDialog is a ModelessDialog, but on_show_apps_usage calls dialog.run() on it. ModelessDialog\nis designed for non-blocking use (it self-destructs in on_response and clears transient-for at\nidle); calling the blocking run() on it mixes the two interaction models and can interact poorly\nwith the idle-time transient-for clearing and the modeless window group setup.","fix":"Either make ShowAppsDialog a ModalDialog if blocking behavior is intended, or present it modelessly\nwithout run().","locations":[{"ref":"lutris/gui/dialogs/runner_install.py:295-300","code":"  295 |     def on_show_apps_usage(self, _button, row):\n  296 |         \"\"\"Return grid with games that uses this wine version\"\"\"\n  297 |         runner = row.runner\n  298 |         runner_version = \"%s-%s\" % (runner[\"version\"], runner[\"architecture\"])\n  299 |         dialog = ShowAppsDialog(_(\"Wine version usage\"), self.get_toplevel(), self.runner_name, runner_version)\n  300 |         dialog.run()","lines":6,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/dialogs/runner_install.py#L295-L300"},{"ref":"lutris/gui/dialogs/__init__.py:128-165","code":"  128 | class ModelessDialog(Dialog):\n  129 |     \"\"\"A base class for modeless dialogs. They have a parent only temporarily, so\n  130 |     they can be centered over it during creation. But each modeless dialog gets\n  131 |     its own window group, so it treats its own modal dialogs separately, and it resets\n  132 |     its transient-for after being created.\"\"\"\n  133 | \n  134 |     def __init__(\n  135 |         self,\n  136 |         title: str | None = None,\n  137 |         parent: Gtk.Widget | None = None,\n  138 |         flags: Gtk.DialogFlags = 0,\n  139 |         buttons: Gtk.ButtonsType | None = None,\n  140 |         **kwargs: Any,\n  141 |     ):\n  14 {"id":"ARCH_5","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"installerwindow.py is a single ~1140-line class (InstallerWindow) that owns every page's\ncreation, presentation, navigation, button management, error handling, shortcut creation and\ninterpreter-delegate callbacks. The file even carries '# pylint: disable=too-many-lines'.\nThis is a monolithic God-object mixing many responsibilities, making the page lifecycle\n(load_X/present_X/create_X triples repeated ~8 times) hard to follow and modify.","fix":"Extract each page (destination, extras, files, log, input-menu, ask-for-disc, error, finished) into its own page/controller class with a shared interface, leaving InstallerWindow as a thin coordinator.","locations":[{"ref":"lutris/gui/installerwindow.py:1-3","code":"    1 | \"\"\"Window used for game installers\"\"\"\n    2 | \n    3 | # pylint: disable=too-many-lines","lines":3,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/installerwindow.py#L1-L3"},{"ref":"lutris/gui/installerwindow.py:53-65","code":"   53 | class InstallerWindow(ModelessDialog, DialogInstallUIDelegate, ScriptInterpreter.InterpreterUIDelegate):  # type:ignore[misc]\n   54 |     \"\"\"GUI for the install process.\n   55 | \n   56 |     This window is divided into pages; as you go through the install each page\n   57 |     is created and displayed to you. You can also go back and visit previous pages\n   58 |     again. Going *forward* triggers installation work- it does not all way until the\n   59 |     very end.\n   60 | \n   61 |     Most pages are defined by a load_X_page() function that initializes the page\n   62 |     when arriving at it, and which presents it. But this uses a present_X_page() page\n   63 |     that shows the page (and is used alone for the 'Back' button), and this in turn\n   64 |     uses a create_X_page() function to create the page the first time it is visited.\n   65 |     \"\"\"","lines":13,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/gui/installerwindow.py#L53-L65"}]},

{"id":"ARCH_7","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"Module-level statement 'sys.excepthook = error_handler' runs unconditionally as an import side effect of lutris.installer.errors, a module whose primary purpose is defining exception classes (ScriptingError, MissingGameDependencyError). Merely importing this module (e.g. transitively, for the exception type) silently rewires global interpreter exception handling, which is surprising and can complicate testing or reuse of ScriptingError in contexts that don't want this hook installed.","fix":"Move the sys.excepthook installation into an explicit setup function (e.g. install_error_handler()) called once during application startup, rather than as an import-time side effect.","locations":[{"ref":"lutris/installer/errors.py:53-67","code":"   53 | _excepthook = sys.excepthook  # pylint: disable=invalid-name\n   54 | \n   55 | \n   56 | def error_handler(error_type, value, traceback):\n   57 |     \"\"\"Intercept all possible exceptions and raise them as ScriptingErrors\"\"\"\n   58 |     if error_type == ScriptingError:\n   59 |         message = value.message\n   60 |         if value.faulty_data:\n   61 |             message += \"\\n<b>%s<\/b>\" % gtk_safe(value.faulty_data)\n   62 |         ErrorDialog(message)\n   63 |     else:\n   64 |         _excepthook(error_type, value, traceback)\n   65 | \n   66 | \n   67 | sys.excepthook = error_handler","lines":15,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/installer/errors.py#L53-L67"}]},
{"id":"OTHER_1","type":"other","type_label":"Other","severity":"medium","difficulty":"easy","description":"ZoomService._get_installers() uses a bare `print(files)` debug statement left in production code (line 291), and immediately follows it with `assert len(files) == 1, \"More than one file found for %s\" % platform  # TODO: Handle multiple files` (line 292). Using assert for a known, acknowledged-incomplete case is problematic two ways: (1) assertions are stripped when Python runs with -O, silently letting `files[0]` be used on a list that might have 0 or >1 elements, causing an IndexError or wrong file being installed instead of a clear error; (2) when assertions are enabled, this hard-crashes the install flow with an unhandled AssertionError instead of a clean user-facing error message, for a case the developers already knew was unhandled (per the TODO).","fix":"Remove the print(files) debug line, and replace the assert with proper error handling, e.g.:\nif not files:\n    raise UnavailableGameError(_(\"No installer file found for %s\") % platform)\nif len(files) > 1:\n    logger.warning(\"Multiple installer files found for %s, using the first one\", platform)","locations":[{"ref":"lutris/services/zoom.py:286-293","code":"  286 |         files_request = self.make_request(f\"{self.api_url}/li/game/{appid}/files\")\n  287 |         # print(json)\n  288 | \n  289 |         file_list = []\n  290 |         files = files_request[platform]\n  291 |         print(files)\n  292 |         assert len(files) == 1, \"More than one file found for %s\" % platform  # TODO: Handle multiple files\n  293 |         json = self.make_request(f\"{self.api_url}/li/download/{files[0]['id']}\")","lines":8,"link":"https://github.com/lutris/lutris/blob/abcefd06481b36eaed051b669884f389b1eb8e6d/lutris/services/zoom.py#L286-L293"}]},

<script>
(function(){
'use strict';

// Data
const FINDINGS     = JSON.parse(document.getElementById('D').textContent);
const PROJECT_INFO = JSON.parse(document.getElementById('PI').textContent);
const SEVS     = ['critical','high','medium','low','negligible'];
const STATUSES = ['open','fixed','wont-fix','false-positive'];
const ALL_TYPES = [...new Set(FINDINGS.map(f => f.type))].sort();
// Build lookup map for O(1) access
const FINDING_BY_ID = new Map(FINDINGS.map(f => [f.id, f]));
// Only severities actually present in the report — the filter bar hides the rest.
const PRESENT_SEVS = SEVS.filter(s => FINDINGS.some(f => (f.severity || 'medium') === s));
// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};
const PRESENT_DIFFS = DIFFICULTY_ORDER.filter(d => FINDINGS.some(f => f.difficulty === d));
const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', searchScope: 'all', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),
};
const statuses = {};

// Persistence
function loadStatuses() {
  try { Object.assign(statuses, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}
}
function saveStatuses() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    if (S.searchScope !== 'all') p.set('qs', S.searchScope);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('qs'))  { S.searchScope = p.get('qs'); }
  document.getElementById('search-scope').classList.toggle('active', S.searchScope === 'locations');
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build a [project] header block from embedded PROJECT_INFO, so the exported
// findings.toml is self-contained (doesn't depend on a sibling project-info.toml
// that a second, separately-triggered download could silently fail to save).
// '' when there is no project info at all.
function buildProjectToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = PROJECT_INFO || {};
  if (!Object.keys(pi).length) return '';
  const lines = ['[project]'];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n\n';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return buildProjectToml() + chunks.join('\n\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystacks per finding (cleared on full re-render).
// Two variants: everything (default), and file/folder paths only - for when a
// search term (e.g. a directory name like 'dlls/abc') also happens to appear
// inside description/fix prose and you only want path matches.
const _hay = new Map();
const _hayLoc = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}
function hayLocOf(f) {
  if (!_hayLoc.has(f.id)) {
    _hayLoc.set(f.id, f.locations.map(l => l.ref).join(' ').toLowerCase());
  }
  return _hayLoc.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (S.searchScope === 'locations') {
      if (!hayLocOf(f).includes(q)) return false;
    } else if (!hayOf(f).includes(q) && !st.includes(q)) {
      return false;
    }
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  _hayLoc.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    // Single download (was two) - a second auto-triggered download is commonly
    // blocked by the browser unless the user explicitly allows it, which silently
    // drops project-info.toml. Embedding [project] in findings.toml itself avoids
    // that failure mode entirely.
    downloadText(buildFindingsToml(), 'findings.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});
document.getElementById('search-scope').addEventListener('click', e => {
  S.searchScope = S.searchScope === 'locations' ? 'all' : 'locations';
  e.currentTarget.classList.toggle('active', S.searchScope === 'locations');
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
