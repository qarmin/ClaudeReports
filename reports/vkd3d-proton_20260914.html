{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"d3d12_command_list_workgraph_setup_indirect reads `input = wg_state->entry_points[i].node_input` and immediately dereferences `input->launch_type` for every pipeline index in [0, num_pipelines) with no NULL check. d3d12_wg_state_object_rearrange_entry_points pads sparse node arrays with zero-initialized entries whose node_input is NULL, so this NULL-derefs for padded slots. The analogous loop in d3d12_wg_state_object_compile_program guards with `if (!node_input) continue;`. Reachable for GPU-input dispatch of any work graph with sparse/padded node arrays.","fix":"Skip padding slots: add `if (!input) { write sentinel/continue; }` before dereferencing input->launch_type, mirroring the guard in d3d12_wg_state_object_compile_program.","locations":[{"ref":"libs/vkd3d/workgraphs.c:3155-3175","code":" 3155 |     for (i = 0; i < program->num_pipelines; i++)\n 3156 |     {\n 3157 |         const struct vkd3d_shader_node_input_data *input;\n 3158 |         int coalesce_divider_or_amp;\n 3159 |         uint32_t max_amplification;\n 3160 | \n 3161 |         input = wg_state->entry_points[i].node_input;\n 3162 |         if (input->launch_type == VKD3D_SHADER_NODE_LAUNCH_TYPE_BROADCASTING)\n 3163 |         {\n 3164 |             max_amplification = input->broadcast_grid[0] * input->broadcast_grid[1] * input->broadcast_grid[2];\n 3165 |             max_amplification = min(max_amplification, MAX_AMPLIFICATION_RATE);\n 3166 |             coalesce_divider_or_amp = -(int)max_amplification;\n 3167 |         }\n 3168 |         else if (input->launch_type == VKD3D_SHADER_NODE_LAUNCH_TYPE_COALESCING)\n 3169 |             coalesce_divider_or_amp = (int)input->coalesce_factor;\n 3170 |         else\n 3171 |             coalesce_divider_or_amp = THREAD_COALESCE_COUNT;\n 3172 | \n 3173 |         ((uint32_t *)entry_scratch.host_ptr)[i] = UINT32_MAX;\n 3174 |         ((int32_t *)dividers_scratch.host_ptr)[i] = coalesce_divider_or_amp;\n 3175 |     }","lines":21,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/workgraphs.c#L3155-L3175"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"d3d12_dred_settings_create passes the result of vkd3d_malloc straight to d3d12_dred_settings_init and then dereferences it (vtbl, AddRef) without a NULL check. vkd3d_malloc only logs and returns NULL on failure, so under memory pressure this is a NULL-pointer dereference / crash instead of returning E_OUTOFMEMORY.","fix":"Check the allocation: if NULL, unlock debug_singleton_lock and return E_OUTOFMEMORY before calling d3d12_dred_settings_init.","locations":[{"ref":"libs/d3d12core/debug.c:128-141","code":"  128 |     if (!d3d12_dred_settings_instance)\n  129 |     {\n  130 |         d3d12_dred_settings_instance = vkd3d_malloc(sizeof(*d3d12_dred_settings_instance));\n  131 |         d3d12_dred_settings_init(d3d12_dred_settings_instance);\n  132 |     }\n  133 | \n  134 |     iface = &d3d12_dred_settings_instance->ID3D12DeviceRemovedExtendedDataSettings_iface;\n  135 |     ID3D12DeviceRemovedExtendedDataSettings_AddRef(iface);\n  136 | \n  137 |     pthread_mutex_unlock(&debug_singleton_lock);\n  138 | \n  139 |     *object = iface;\n  140 |     return hr;\n  141 | }","lines":14,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/d3d12core/debug.c#L128-L141"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"vkd3d_shader_dxil_copy_subobject calls vkd3d_malloc(payload_size) and immediately memcpy()s into the result without checking for NULL (vkd3d_malloc only logs and returns NULL on OOM). The vkd3d_malloc for pExports at 2174-2179 is used the same way. Reachable while parsing untrusted DXIL library subobjects (RDAT); on allocation failure this is a NULL write/deref crash instead of a graceful error.","fix":"Check each vkd3d_malloc result before memcpy; have vkd3d_shader_dxil_copy_subobject return a status and propagate VKD3D_ERROR_OUT_OF_MEMORY at its call sites.","locations":[{"ref":"libs/vkd3d-shader/dxil.c:2187-2189","code":" 2187 |             subobject->data.payload.data = vkd3d_malloc(dxil_subobject->payload_size);\n 2188 |             memcpy(subobject->data.payload.data, dxil_subobject->payload, dxil_subobject->payload_size);\n 2189 |             subobject->data.payload.size = dxil_subobject->payload_size;","lines":3,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d-shader/dxil.c#L2187-L2189"},{"ref":"libs/vkd3d-shader/dxil.c:2229-2234","code":" 2229 |             assert(dxil_subobject->num_exports >= 1);\n 2230 |             subobject->data.association.SubobjectToAssociate = vkd3d_dup_entry_point(dxil_subobject->exports[0]);\n 2231 |             subobject->data.association.pExports = vkd3d_malloc((dxil_subobject->num_exports - 1) * sizeof(LPCWSTR));\n 2232 |             subobject->data.association.NumExports = dxil_subobject->num_exports - 1;\n 2233 |             for (i = 1; i < dxil_subobject->num_exports; i++)\n 2234 |                 subobject->data.association.pExports[i - 1] = vkd3d_dup_entry_point(dxil_subobject->exports[i]);","lines":6,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d-shader/dxil.c#L2229-L2234"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"vkd3d_breadcrumb_tracer_link_submission dereferences trace_contexts[context] without checking `context == UINT32_MAX`, unlike every other tracer entrypoint (begin/add/signal/end all early-out on UINT32_MAX). If a command list failed to allocate a breadcrumb context (ring exhausted -> UINT32_MAX), this indexes trace_contexts out of bounds.","fix":"Add `if (context == UINT32_MAX) return;` after reading context, consistent with the other tracer functions.","locations":[{"ref":"libs/vkd3d/breadcrumbs.c:791-801","code":"  791 | void vkd3d_breadcrumb_tracer_link_submission(struct d3d12_command_list *list,\n  792 |         struct d3d12_command_list *prev, struct d3d12_command_list *next)\n  793 | {\n  794 |     struct vkd3d_breadcrumb_tracer *breadcrumb_tracer = &list->device->breadcrumb_tracer;\n  795 |     struct vkd3d_breadcrumb_command_list_trace_context *trace;\n  796 |     unsigned int context = list->breadcrumb_context_index;\n  797 | \n  798 |     trace = &breadcrumb_tracer->trace_contexts[context];\n  799 |     trace->prev = prev ? prev->breadcrumb_context_index : UINT32_MAX;\n  800 |     trace->next = next ? next->breadcrumb_context_index : UINT32_MAX;\n  801 | }","lines":11,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/breadcrumbs.c#L791-L801"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"vkd3d_supports_minimum_coopmat_caps calls `props = vkd3d_calloc(count, sizeof(*props))` and does not check it for NULL before the loop at 3061-3062 dereferences props[i]. On allocation failure (count > 0, the normal case when cooperativeMatrix is enabled) this is a NULL-pointer dereference. Every other enumeration helper in this file checks its allocation.","fix":"Check `if (!(props = vkd3d_calloc(count, sizeof(*props)))) return false;` before initializing the array.","locations":[{"ref":"libs/vkd3d/device.c:2311-2316","code":" 2311 |     props = vkd3d_calloc(count, sizeof(*props));\n 2312 |     for (i = 0; i < count; i++)\n 2313 |         props[i].sType = VK_STRUCTURE_TYPE_COOPERATIVE_MATRIX_PROPERTIES_KHR;\n 2314 | \n 2315 |     if (VK_CALL(vkGetPhysicalDeviceCooperativeMatrixPropertiesKHR(\n 2316 |             device->vk_physical_device, &count, props)) != VK_SUCCESS)","lines":6,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/device.c#L2311-L2316"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"d3d12_root_signature_create_from_blob unconditionally writes object->root_signature_blob via vkd3d_malloc + memcpy without checking the malloc result for NULL. Under memory pressure (with EXTENDED_DEBUG_UTILS set, non-local root signature) vkd3d_malloc returns NULL and memcpy NULL-derefs. bytecode_length is app/blob-influenced so the allocation can also be large.","fix":"Check the malloc result; on NULL skip storing the blob (blob=NULL,size=0) or fail creation, rather than memcpy into NULL.","locations":[{"ref":"libs/vkd3d/state.c:2182-2189","code":" 2182 |     if (SUCCEEDED(hr) && !raw_payload &&\n 2183 |             !(root_signature_desc.d3d12.Desc_1_2.Flags & D3D12_ROOT_SIGNATURE_FLAG_LOCAL_ROOT_SIGNATURE) &&\n 2184 |             VKD3D_CONFIG_FLAG_IS_SET(EXTENDED_DEBUG_UTILS))\n 2185 |     {\n 2186 |         object->root_signature_blob = vkd3d_malloc(bytecode_length);\n 2187 |         memcpy(object->root_signature_blob, bytecode, bytecode_length);\n 2188 |         object->root_signature_blob_size = bytecode_length;\n 2189 |     }","lines":8,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/state.c#L2182-L2189"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"openvr_instance_extensions and openvr_device_extensions call vkd3d_calloc(len, sizeof(BYTE)) without checking for NULL, then pass the buffer to RegQueryValueExA which writes len bytes into it. On allocation failure this is a NULL write / crash.","fix":"Check the calloc result; on NULL, RegCloseKey(vr_key) and return NULL.","locations":[{"ref":"libs/d3d12core/main.c:162-163","code":"  162 |     openvr_instance_extensions = vkd3d_calloc(len, sizeof(BYTE));\n  163 |     status = RegQueryValueExA(vr_key, \"openvr_vulkan_instance_extensions\", NULL, &type, (BYTE *)openvr_instance_extensions, &len);","lines":2,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/d3d12core/main.c#L162-L163"},{"ref":"libs/d3d12core/main.c:210-211","code":"  210 |     openvr_device_extensions = vkd3d_calloc(len, sizeof(BYTE));\n  211 |     status = RegQueryValueExA(vr_key, key_name, NULL, &type, (BYTE *)openvr_device_extensions, &len);","lines":2,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/d3d12core/main.c#L210-L211"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"openxr_vulkan_extensions does not check the vkd3d_malloc(len) return before passing the buffer to get_extensions(), which writes the extension string into it. A NULL allocation leads to a NULL write and crash rather than a graceful NULL return.","fix":"After `ret = vkd3d_malloc(len);` add `if (!ret) return NULL;` before calling get_extensions().","locations":[{"ref":"libs/d3d12core/main.c:242-248","code":"  242 |     ret = vkd3d_malloc(len);\n  243 |     if (get_extensions(len, &len, ret))\n  244 |     {\n  245 |         WARN(\"Failed to get OpenXR extensions from wineopenxr.\\n\");\n  246 |         return NULL;\n  247 |     }\n  248 |     return ret;","lines":7,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/d3d12core/main.c#L242-L248"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In the Win32 VR-extension augmentation paths, `calloc(len, sizeof(char *))` is not checked for NULL before `memcpy(extensions, ...)` writes into it. Allocation failure causes a NULL-pointer write / crash.","fix":"Check the calloc return; if NULL, fall back to the base extension list instead of memcpy'ing into NULL.","locations":[{"ref":"libs/d3d12core/main.c:621-622","code":"  621 |         char **extensions = calloc(len, sizeof(char *));\n  622 |         memcpy(extensions, instance_extensions, sizeof(char *) * ARRAY_SIZE(instance_extensions));","lines":2,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/d3d12core/main.c#L621-L622"},{"ref":"libs/d3d12core/main.c:717-718","code":"  717 |         char **extensions = calloc(len, sizeof(char *));\n  718 |         memcpy(extensions, device_extensions, sizeof(char *) * ARRAY_SIZE(device_extensions));","lines":2,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/d3d12core/main.c#L717-L718"}]},
{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"vkd3d_utf16_read reads s[1] (the low surrogate) when s[0] is a high surrogate, but the bounded caller (vkd3d_strdup_w_utf8 with max_elements) only validates the cursor for s[0] < max_elements. A high surrogate at the last in-bounds element causes an out-of-bounds read of s[1] one element past the window. For NUL-terminated input this is masked (s[1]==0 treated invalid), but for length-bounded non-NUL buffers it is a genuine OOB read.","fix":"Pass the remaining element count (or end pointer) into vkd3d_utf16_read and treat a trailing high surrogate with no available second element as invalid (return 0, advance by 1).","locations":[{"ref":"libs/vkd3d-common/utf8.c:87-106","code":"   87 | static uint32_t vkd3d_utf16_read(const WCHAR **src)\n   88 | {\n   89 |     const WCHAR *s = *src;\n   90 | \n   91 |     if (s[0] < 0xd800 || s[0] > 0xdfff) /* Not a surrogate pair. */\n   92 |     {\n   93 |         *src += 1;\n   94 |         return s[0];\n   95 |     }\n   96 | \n   97 |     if (s[0] > 0xdbff /* Invalid high surrogate. */\n   98 |             || s[1] < 0xdc00 || s[1] > 0xdfff) /* Invalid low surrogate. */\n   99 |     {\n  100 |         *src += 1;\n  101 |         return 0;\n  102 |     }\n  103 | \n  104 |     *src += 2;\n  105 |     return 0x10000 + ((s[0] & 0x3ff) << 10) + (s[1] & 0x3ff);\n  106 | }","lines":20,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d-common/utf8.c#L87-L106"}]},
{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"vkd3d_dxil_converter_set_options dereferences compiler_args unconditionally (min_subgroup_size / max_subgroup_size), and vkd3d_shader_compile_dxil dereferences compiler_args->promote_wave_size_heuristics unconditionally, yet later code in the same function guards with `if (compiler_args)`. The inconsistency means a NULL compiler_args crashes; the guard is misleading/dead given the earlier unconditional deref.","fix":"Either assert compiler_args is non-NULL on the DXIL path (removing the dead guard), or make the early dereferences NULL-safe to match the guard.","locations":[{"ref":"libs/vkd3d-shader/dxil.c:1001-1013","code":" 1001 |     {\n 1002 |         const struct dxil_spv_option_subgroup_properties helper =\n 1003 |                 { { DXIL_SPV_OPTION_SUBGROUP_PROPERTIES },\n 1004 |                         compiler_args->min_subgroup_size,\n 1005 |                         compiler_args->max_subgroup_size };\n 1006 |         if (dxil_spv_converter_add_option(converter, &helper.base) != DXIL_SPV_SUCCESS)\n 1007 |         {\n 1008 |             WARN(\"dxil-spirv does not support SUBGROUP_PROPERTIES.\\n\");\n 1009 |             return VKD3D_ERROR_NOT_IMPLEMENTED;\n 1010 |         }\n 1011 |     }\n 1012 | \n 1013 |     if (compiler_args)","lines":13,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d-shader/dxil.c#L1001-L1013"},{"ref":"libs/vkd3d-shader/dxil.c:1660","code":" 1660 |     if (compiler_args->promote_wave_size_heuristics)","lines":1,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d-shader/dxil.c#L1660"}]},
{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"d3d12_bundle_add_command does not check the result of d3d12_bundle_allocator_alloc_chunk_data, which returns NULL on OOM. The next line writes command->proc, dereferencing NULL. All bundle recording entrypoints route through this helper, so any of them crashes on allocation failure.","fix":"Return NULL on allocation failure and have callers tolerate it (skip recording the command) instead of dereferencing.","locations":[{"ref":"libs/vkd3d/bundle.c:253-266","code":"  253 | void *d3d12_bundle_add_command(struct d3d12_bundle *bundle, pfn_d3d12_bundle_command proc, size_t size)\n  254 | {\n  255 |     struct d3d12_bundle_command *command = d3d12_bundle_allocator_alloc_chunk_data(bundle->allocator, size);\n  256 | \n  257 |     command->proc = proc;\n  258 |     command->next = NULL;\n  259 | \n  260 |     if (bundle->tail)\n  261 |         bundle->tail->next = command;\n  262 |     else\n  263 |         bundle->head = command;\n  264 | \n  265 |     bundle->tail = command;\n  266 |     return command;","lines":14,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/bundle.c#L253-L266"}]},
{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"d3d12_command_queue_flush_bind_sparse allocates `resource_info->resources` via vkd3d_calloc(num_resources, ...) but never checks the result before writing to it in the loop. If tracked_count > 0 and the allocation fails, this is a NULL-pointer write.","fix":"Check resource_info->resources for NULL after the calloc; on failure set num_resources to 0 (skip the loop) or fail gracefully.","locations":[{"ref":"libs/vkd3d/command.c:26256-26265","code":"26256 |     resource_info = vkd3d_waiting_fence_set_callback(&fence_info,\n26257 |             &vkd3d_waiting_fence_release_sparse_resources, sizeof(*resource_info));\n26258 |     resource_info->num_resources = command_queue->sparse.tracked_count;\n26259 |     resource_info->resources = vkd3d_calloc(resource_info->num_resources, sizeof(*resource_info->resources));\n26260 | \n26261 |     for (i = 0; i < command_queue->sparse.tracked_count; i++)\n26262 |     {\n26263 |         resource_info->resources[i] = command_queue->sparse.tracked[i].resource;\n26264 |         d3d12_resource_incref(resource_info->resources[i]);\n26265 |     }","lines":10,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/command.c#L26256-L26265"}]},
{"id":"PANIC_14","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"d3d12_device_GetResourceAllocationInfo1 allocates `desc1 = vkd3d_malloc(sizeof(*desc1) * count)` with no NULL check when count > 16, then the loop dereferences desc1[i]. An application can pass an arbitrary count; on OOM this is a NULL deref.","fix":"Check desc1 for NULL after vkd3d_malloc; on failure take the existing invalid/error path instead of dereferencing.","locations":[{"ref":"libs/vkd3d/device.c:7684-7695","code":" 7684 |     if (count > ARRAY_SIZE(local_descs))\n 7685 |         desc1 = vkd3d_malloc(sizeof(*desc1) * count);\n 7686 |     else\n 7687 |     {\n 7688 |         /* Avoid a compiler warning */\n 7689 |         memset(local_descs, 0, sizeof(local_descs));\n 7690 |         desc1 = local_descs;\n 7691 |     }\n 7692 | \n 7693 | \n 7694 |     for (i = 0; i < count; i++)\n 7695 |         d3d12_resource_promote_desc(&resource_descs[i], &desc1[i]);","lines":12,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/device.c#L7684-L7695"}]},
{"id":"PANIC_15","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"vkd3d_meta_get_execute_indirect_pipeline ignores the return value of vkd3d_array_reserve. On allocation failure `pipelines` stays NULL/too small and the following writes to pipelines[pipelines_count].workgroup_size_x/.vk_pipeline dereference NULL or write out of bounds while the mutex is held.","fix":"Check the vkd3d_array_reserve return; on failure unlock the mutex and return E_OUTOFMEMORY.","locations":[{"ref":"libs/vkd3d/meta.c:1997-2006","code":" 1997 |     vkd3d_array_reserve((void**)&meta_indirect_ops->pipelines, &meta_indirect_ops->pipelines_size,\n 1998 |             meta_indirect_ops->pipelines_count + 1, sizeof(*meta_indirect_ops->pipelines));\n 1999 | \n 2000 |     meta_indirect_ops->pipelines[meta_indirect_ops->pipelines_count].workgroup_size_x = patch_command_count;\n 2001 | \n 2002 |     vr = vkd3d_meta_create_compute_pipeline(meta_ops->device,\n 2003 |             debug ? sizeof(cs_execute_indirect_patch_debug_ring) : sizeof(cs_execute_indirect_patch),\n 2004 |             debug ? cs_execute_indirect_patch_debug_ring : cs_execute_indirect_patch,\n 2005 |             meta_indirect_ops->vk_pipeline_layout, &spec,\n 2006 |             true, NULL, &meta_indirect_ops->pipelines[meta_indirect_ops->pipelines_count].vk_pipeline);","lines":10,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/meta.c#L1997-L2006"}]},
{"id":"PANIC_16","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"d3d12_resource_init_subresource_layouts stores vkd3d_calloc into resource->subresource_layouts without checking for NULL, and the caller ignores the return. A failed allocation leaves subresource_layouts NULL; later WriteToSubresource/ReadFromSubresource dereference resource->subresource_layouts[sub_resource] -> NULL deref / OOB.","fix":"Have d3d12_resource_init_subresource_layouts return HRESULT and propagate E_OUTOFMEMORY on calloc failure; fail resource creation accordingly.","locations":[{"ref":"libs/vkd3d/resource.c:4137-4143","code":" 4137 | static size_t d3d12_resource_init_subresource_layouts(struct d3d12_resource *resource, struct d3d12_device *device)\n 4138 | {\n 4139 |     unsigned int subresource_count = d3d12_resource_get_sub_resource_count(resource);\n 4140 | \n 4141 |     resource->subresource_layouts = vkd3d_calloc(subresource_count, sizeof(*resource->subresource_layouts));\n 4142 |     return vkd3d_compute_resource_layouts_from_desc(device, &resource->desc, resource->subresource_layouts);\n 4143 | }","lines":7,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/resource.c#L4137-L4143"},{"ref":"libs/vkd3d/resource.c:4239-4245","code":" 4239 |     if (!(flags & VKD3D_RESOURCE_RESERVED) && d3d12_resource_is_texture(object) &&\n 4240 |             is_cpu_accessible_heap(heap_properties))\n 4241 |     {\n 4242 |         const UINT unsupported_flags = D3D12_RESOURCE_FLAG_ALLOW_SIMULTANEOUS_ACCESS | D3D12_RESOURCE_FLAG_ALLOW_UNORDERED_ACCESS;\n 4243 | \n 4244 |         object->flags |= VKD3D_RESOURCE_LINEAR_STAGING_COPY | VKD3D_RESOURCE_GENERAL_LAYOUT;\n 4245 |         d3d12_resource_init_subresource_layouts(object, device);","lines":7,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/resource.c#L4239-L4245"}]},
{"id":"PANIC_17","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"vkd3d_create_raw_buffer_view asserts `resource && resource->va && resource->size` after vkd3d_va_map_deref, then unconditionally dereferences resource->vk_buffer/size. In release builds (asserts compiled out) a stale/invalid GPU VA that fails to resolve yields resource == NULL and an immediate NULL dereference rather than a graceful failure.","fix":"Replace the assert with a runtime `if (!resource) return false;` guard before dereferencing.","locations":[{"ref":"libs/vkd3d/resource.c:8327-8334","code":" 8327 |     resource = vkd3d_va_map_deref(&device->memory_allocator.va_map, gpu_address);\n 8328 |     assert(resource && resource->va && resource->size);\n 8329 | \n 8330 |     offset = gpu_address - resource->va;\n 8331 |     range = min(resource->size - offset, device->vk_info.device_limits.maxStorageBufferRange);\n 8332 | \n 8333 |     return vkd3d_create_raw_r32ui_vk_buffer_view(device, resource->vk_buffer,\n 8334 |             offset, range, vk_buffer_view);","lines":8,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/resource.c#L8327-L8334"}]},
{"id":"PANIC_18","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"vkd3d_get_descriptor_size_for_binding dereferences `mutable = vk_find_pnext(..., MUTABLE_DESCRIPTOR_TYPE_CREATE_INFO_EXT)` then accesses mutable->pMutableDescriptorTypeLists[binding_index] with no NULL check and no bounds check against mutableDescriptorTypeListCount. A MUTABLE_EXT binding whose pNext chain lacks the mutable info NULL-derefs.","fix":"Guard that `mutable` is non-NULL and binding_index < mutableDescriptorTypeListCount before indexing.","locations":[{"ref":"libs/vkd3d/state.c:7406-7418","code":" 7406 |     if (vk_binding->descriptorType != VK_DESCRIPTOR_TYPE_MUTABLE_EXT)\n 7407 |         max_size = vkd3d_get_descriptor_size_for_type(device, vk_binding->descriptorType);\n 7408 |     else\n 7409 |     {\n 7410 |         mutable = vk_find_pnext(set_layout_info->pNext, VK_STRUCTURE_TYPE_MUTABLE_DESCRIPTOR_TYPE_CREATE_INFO_EXT);\n 7411 |         type_list = &mutable->pMutableDescriptorTypeLists[binding_index];\n 7412 | \n 7413 |         max_size = 0;\n 7414 |         for (i = 0; i < type_list->descriptorTypeCount; i++)\n 7415 |         {\n 7416 |             type_size = vkd3d_get_descriptor_size_for_type(device, type_list->pDescriptorTypes[i]);\n 7417 |             max_size = max(max_size, type_size);\n 7418 |         }","lines":13,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/state.c#L7406-L7418"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"critical","difficulty":"hard","description":"The pipeline-library TOC parser sums three disk/blob-controlled uint32_t counts in 32-bit unsigned arithmetic before widening to size_t: `total_toc_entries = header->pipeline_count + header->spirv_count + header->driver_cache_count`. If the sum exceeds 2^32 it wraps to a small value, so header_entry_size stays small and the `blob_length < header_entry_size` guard passes. serialized_data_base then points inside the tiny TOC, and the three unserialize_hash_map calls iterate over the REAL per-map counts (up to ~4 billion) indexing header->entries[i] and reading blob_offset/blob_length far past the buffer end -> massive OOB read and hash-map entries referencing arbitrary memory. The blob originates from CreatePipelineLibrary input and on-disk cache files.","fix":"Accumulate the counts as uint64_t and reject the blob if `total_toc_entries * sizeof(toc_entry) + header size` exceeds blob_length; additionally bound each individual count against the remaining TOC space before its per-map iteration. The serialize path at cache.c:2034-2037 has the same 32-bit sum and should match.","locations":[{"ref":"libs/vkd3d/cache.c:2445-2482","code":" 2445 |     total_toc_entries = header->pipeline_count + header->spirv_count + header->driver_cache_count;\n 2446 | \n 2447 |     header_entry_size = offsetof(struct vkd3d_serialized_pipeline_library_toc, entries) +\n 2448 |             total_toc_entries * sizeof(struct vkd3d_serialized_pipeline_toc_entry);\n 2449 | \n 2450 |     if (blob_length < header_entry_size)\n 2451 |     {\n 2452 |         if (VKD3D_CONFIG_FLAG_IS_SET(PIPELINE_LIBRARY_LOG))\n 2453 |             INFO(\"Rejecting pipeline library due to too small blob length compared to expected size.\\n\");\n 2454 |         return D3D12_ERROR_DRIVER_VERSION_MISMATCH;\n 2455 |     }\n 2456 | \n 2457 |     serialized_data_size = blob_length - header_entry_size;\n 2458 |     serialized_data_base = (const uint8_t *)&header->entries[total_toc_entries];\n 2459 |     name_table = serialized_data_base;\n 2460 | \n 2461 |     i = 0;\n 2462 | \n 2463 |     if (FAILED(hr = d3d12_pipeline_library_unserialize_hash_map(pipeline_library,\n 2464 |             &header->entries[i], header->spirv_count,\n 2465 |             &pipeline_library->spirv_cache_map, serialized_data_base, serialized_data_size,\n 2466 |             &name_table)))\n 2467 |         return hr;\n 2468 |     i += header->spirv_count;\n 2469 | \n 2470 |     if (FAILED(hr = d3d12_pipeline_library_unserialize_hash_map(pipeline_library,\n 2471 |             &header->entries[i], header->driver_cache_count,\n 2472 |             &pipeline_library->driver_cache_map, serialized_data_base, serialized_data_size,\n 2473 |             &name_table)))\n 2474 |         return hr;\n 2475 |     i += header->driver_cache_count;\n 2476 | \n 2477 |     if (FAILED(hr = d3d12_pipeline_library_unserialize_hash_map(pipeline_library,\n 2478 |             &header->entries[i], header->pipeline_count,\n 2479 |             &pipeline_library->pso_map, serialized_data_base, serialized_data_size,\n 2480 |             &name_table)))\n 2481 |         return hr;\n 2482 |     i += header->pipeline_count;","lines":38,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/cache.c#L2445-L2482"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"In the buffered logging path, local_buffer_count is the vsnprintf return value — the number of bytes that WOULD have been written, not what fit. If the formatted message exceeds the 4096-byte local_buffer, local_buffer_count > 4096; as long as the total still fits the ring buffer, `memcpy(..., local_buffer, local_buffer_count)` at line 225 reads out of bounds of the 4096-byte stack array. The same applies to prefix_buffer_count vs the 256-byte prefix_buffer, and required_count (signed int) can overflow.","fix":"Clamp the counts to the actual buffer sizes before using them as memcpy lengths (e.g. min(count, (int)sizeof(buf) - 1)) and guard against negative vsnprintf return values.","locations":[{"ref":"libs/vkd3d-common/debug.c:198-226","code":"  198 |         prefix_buffer_count = snprintf(prefix_buffer, sizeof(prefix_buffer),\n  199 |                 \"%04x:%s:%s: \", tid, debug_level_names[level], function);\n  200 |         local_buffer_count = vsnprintf(local_buffer, sizeof(local_buffer), fmt, args);\n  201 |         required_count = prefix_buffer_count + local_buffer_count;\n  202 | \n  203 |         spinlock_acquire(&vkd3d_debug_buffer_spin);\n  204 |         if (vkd3d_dbg_buffer.offset + required_count > vkd3d_dbg_buffer.size)\n  205 |         {\n  206 |             if (vkd3d_log_file)\n  207 |             {\n  208 |                 fwrite(vkd3d_dbg_buffer.buffer, 1, vkd3d_dbg_buffer.offset, vkd3d_log_file);\n  209 |             }\n  210 |             else\n  211 |             {\n  212 |                 /* Binary vs text matters on Win32.\n  213 |                  * Don't bother trying to be clever here reopening stdio files as O_BINARY, etc. */\n  214 |                 fputs(vkd3d_dbg_buffer.buffer, stderr);\n  215 |             }\n  216 | \n  217 |             vkd3d_dbg_buffer.offset = 0;\n  218 |         }\n  219 | \n  220 |         /* Here we trade performance for robustness. Some data will be left behind on early termination or crash. */\n  221 |         if (vkd3d_dbg_buffer.offset + required_count <= vkd3d_dbg_buffer.size)\n  222 |         {\n  223 |             memcpy(vkd3d_dbg_buffer.buffer + vkd3d_dbg_buffer.offset, prefix_buffer, prefix_buffer_count);\n  224 |             vkd3d_dbg_buffer.offset += prefix_buffer_count;\n  225 |             memcpy(vkd3d_dbg_buffer.buffer + vkd3d_dbg_buffer.offset, local_buffer, local_buffer_count);\n  226 |             vkd3d_dbg_buffer.offset += local_buffer_count;","lines":29,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d-common/debug.c#L198-L226"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"very_easy","description":"debugstr_a reads each byte into a plain (signed) `char c` and for non-printable bytes does `sprintf(ptr, \"%02x\", c)`. For c >= 0x80 the signed char is promoted to a negative int and printed as 8 hex digits (e.g. \"ffffff80\"), but the code only advances ptr by 2, so ~6 extra bytes are written past the accounted-for position, overflowing the per-thread 512-byte debug buffer. isprint(c)/the switch on a negative char value is also undefined behavior.","fix":"Read the byte as `unsigned char` (or cast before isprint and the sprintf): `sprintf(ptr, \"%02x\", (unsigned char)c);`.","locations":[{"ref":"libs/vkd3d-common/debug.c:302-348","code":"  302 | const char *debugstr_a(const char *str)\n  303 | {\n  304 |     char *buffer, *ptr;\n  305 |     char c;\n  306 | \n  307 |     if (!str)\n  308 |         return \"(null)\";\n  309 | \n  310 |     ptr = buffer = get_buffer();\n  311 | \n  312 |     *ptr++ = '\"';\n  313 |     while ((c = *str++) && ptr <= buffer + VKD3D_DEBUG_BUFFER_SIZE - 8)\n  314 |     {\n  315 |         int escape_char;\n  316 | \n  317 |         switch (c)\n  318 |         {\n  319 |             case '\"':\n  320 |             case '\\\\':\n  321 |             case '\\n':\n  322 |             case '\\r':\n  323 |             case '\\t':\n  324 |                 escape_char = c;\n  325 |                 break;\n  326 |             default:\n  327 |                 escape_char = 0;\n  328 |                 break;\n  329 |         }\n  330 | \n  331 |         if (escape_char)\n  332 |         {\n  333 |             *ptr++ = '\\\\';\n  334 |             *ptr++ = escape_char;\n  335 |             continue;\n  336 |         }\n  337 | \n  338 |         if (isprint(c))\n  339 |         {\n  340 |             *ptr++ = c;\n  341 |         }\n  342 |         else\n  343 |         {\n  344 |             *ptr++ = '\\\\';\n  345 |             sprintf(ptr, \"%02x\", c);\n  346 |             ptr += 2;\n  347 |         }\n  348 |     }","lines":47,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d-common/debug.c#L302-L348"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"require_space computes `(data_size - offset) / count >= size` with both operands as size_t. The root-signature sub-parsers (descriptor_table/table1, root_constants, root_descriptor/_descriptor1, etc.) pass an attacker-controlled `offset` read straight from the blob without first checking `offset <= data_size`. When offset > data_size the subtraction wraps to a huge size_t, the check passes, and `ptr = &context->data[offset]` + read_uint32 reads out of bounds. parse_dxbc guards this for chunk offsets, but these sub-parsers do not. Reachable from untrusted root-signature blobs via vkd3d_shader_parse_root_signature / CreateRootSignatureDeserializer.","fix":"Make require_space robust to offset > data_size, e.g. `return offset <= data_size && (!count || (data_size - offset) / count >= size);` and add explicit `offset > data_size` guards before dereferencing context->data[offset] in each sub-parser.","locations":[{"ref":"libs/vkd3d-shader/dxbc.c:41-44","code":"   41 | static bool require_space(size_t offset, size_t count, size_t size, size_t data_size)\n   42 | {\n   43 |     return !count || (data_size - offset) / count >= size;\n   44 | }","lines":4,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d-shader/dxbc.c#L41-L44"},{"ref":"libs/vkd3d-shader/dxbc.c:450-455","code":"  450 |     if (!require_space(offset, 2, sizeof(DWORD), context->data_size))\n  451 |     {\n  452 |         WARN(\"Invalid data size %#x (offset %u).\\n\", context->data_size, offset);\n  453 |         return VKD3D_ERROR_INVALID_ARGUMENT;\n  454 |     }\n  455 |     ptr = &context->data[offset];","lines":6,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d-shader/dxbc.c#L450-L455"},{"ref":"libs/vkd3d-shader/dxbc.c:477-482","code":"  477 |     if (!require_space(offset, 2, sizeof(DWORD), context->data_size))\n  478 |     {\n  479 |         WARN(\"Invalid data size %#x (offset %u).\\n\", context->data_size, offset);\n  480 |         return VKD3D_ERROR_INVALID_ARGUMENT;\n  481 |     }\n  482 |     ptr = &context->data[offset];","lines":6,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d-shader/dxbc.c#L477-L482"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"d3d12_device_CreateSharedHandle writes a session prefix into buffer[MAX_PATH] via swprintf, then `memcpy(buffer + len, name, (name_len + 1) * sizeof(WCHAR))` copies the caller-supplied name with no check that `len + name_len + 1 <= MAX_PATH`. A long name overflows the fixed stack buffer (stack smash). len and name_len are never validated against ARRAY_SIZE(buffer).","fix":"Validate `len + name_len + 1 <= ARRAY_SIZE(buffer)` (return E_INVALIDARG otherwise), or size the buffer dynamically.","locations":[{"ref":"libs/vkd3d/device.c:6641-6653","code":" 6641 |     {\n 6642 |         DWORD session, len, name_len = wcslen(name);\n 6643 | \n 6644 |         ProcessIdToSessionId(GetCurrentProcessId(), &session);\n 6645 |         len = swprintf(buffer, ARRAY_SIZE(buffer), L\"\\\\Sessions\\\\%u\\\\BaseNamedObjects\\\\\", session);\n 6646 |         memcpy(buffer + len, name, (name_len + 1) * sizeof(WCHAR));\n 6647 |         name_str.MaximumLength = name_str.Length = (len + name_len) * sizeof(WCHAR);\n 6648 |         name_str.MaximumLength += sizeof(WCHAR);\n 6649 |         name_str.Buffer = buffer;\n 6650 | \n 6651 |         attr.ObjectName = &name_str;\n 6652 |         attr.Attributes = OBJ_CASE_INSENSITIVE;\n 6653 |     }","lines":13,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/device.c#L6641-L6653"}]},
{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"vkd3d_array_reserve computes `max_capacity = ~(size_t)0 / element_size` with no guard for element_size == 0 (division by zero). All in-tree callers pass a non-zero sizeof, so this is latent rather than currently triggerable, but the helper does not defend against it.","fix":"Early-return false (or assert) when element_size == 0 before the division.","locations":[{"ref":"libs/vkd3d-common/memory.c:24-34","code":"   24 | bool vkd3d_array_reserve(void **elements, size_t *capacity, size_t element_count, size_t element_size)\n   25 | {\n   26 |     size_t new_capacity, max_capacity;\n   27 |     void *new_elements;\n   28 | \n   29 |     if (element_count <= *capacity)\n   30 |         return true;\n   31 | \n   32 |     max_capacity = ~(size_t)0 / element_size;\n   33 |     if (max_capacity < element_count)\n   34 |         return false;","lines":11,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d-common/memory.c#L24-L34"}]},
{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"vkd3d_acceleration_structure_convert_inputs / get_geometry_count use desc->NumDescs (app-controlled UINT) directly to size memsets and geometry arrays with no upper-bound sanity check. On 32-bit builds count*element-size can overflow size_t for extreme NumDescs, yielding an undersized allocation followed by OOB writes.","fix":"Validate desc->NumDescs against a sane maximum and/or use a checked multiply before sizing allocations/memsets.","locations":[{"ref":"libs/vkd3d/acceleration_structure.c:62-69","code":"   62 | uint32_t vkd3d_acceleration_structure_get_geometry_count(\n   63 |         const D3D12_BUILD_RAYTRACING_ACCELERATION_STRUCTURE_INPUTS *desc)\n   64 | {\n   65 |     if (desc->Type != D3D12_RAYTRACING_ACCELERATION_STRUCTURE_TYPE_BOTTOM_LEVEL)\n   66 |         return 1;\n   67 |     else\n   68 |         return desc->NumDescs;\n   69 | }","lines":8,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/acceleration_structure.c#L62-L69"}]},
{"id":"OVF_8","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"d3d12_bundle_SetSamplePositions computes `array_size = sample_count * pixel_count` in 32-bit UINT arithmetic before widening to size_t, then allocates `sizeof(*args) + sizeof(*sample_positions) * array_size`. Large app-supplied values can wrap the product and under-allocate; the subsequent memcpy then overflows.","fix":"Compute the product as size_t (cast operands) and/or validate sample_count/pixel_count against D3D12 limits before allocating.","locations":[{"ref":"libs/vkd3d/bundle.c:1406-1415","code":" 1406 |     size_t array_size = sample_count * pixel_count;\n 1407 | \n 1408 |     TRACE(\"iface %p, sample_count %u, pixel_count %u, sample_positions %p.\\n\",\n 1409 |             iface, sample_count, pixel_count, sample_positions);\n 1410 | \n 1411 |     args = d3d12_bundle_add_command(bundle, &d3d12_bundle_exec_set_sample_positions,\n 1412 |             sizeof(*args) + sizeof(*sample_positions) * array_size);\n 1413 |     args->sample_count = sample_count;\n 1414 |     args->pixel_count = pixel_count;\n 1415 |     memcpy(args->positions, sample_positions, sizeof(*sample_positions) * array_size);","lines":10,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/bundle.c#L1406-L1415"}]},
{"id":"OVF_9","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"Signed left-shift UB in varint decode: `buffer[offset]` (uint8_t) is promoted to int, `(buffer[offset] & 0x7f)` is int, and at shift == 28 the expression `(0x7f << 28)` exceeds INT_MAX — undefined behavior for signed shift. The encoder caps at 5 bytes so shift reaches 28 for any word with bits >= 28 set. In practice it wraps correctly but trips UBSan and is not standard-guaranteed.","fix":"Cast to unsigned before shifting: `*w |= (uint32_t)(buffer[offset] & 0x7f) << shift;`","locations":[{"ref":"libs/vkd3d/cache.c:155-163","code":"  155 |         shift = 0;\n  156 |         do\n  157 |         {\n  158 |             if (offset >= buffer_size || shift >= 32u)\n  159 |                 return false;\n  160 | \n  161 |             *w |= (buffer[offset] & 0x7f) << shift;\n  162 |             shift += 7;\n  163 |         } while (buffer[offset++] & 0x80);","lines":9,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/cache.c#L155-L163"}]},
{"id":"OVF_10","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"max_miplevel_count truncates 64-bit desc->Width into `unsigned int size = max(desc->Width, desc->Height)`. For in-range textures this is benign, but the implicit 64->32 truncation silently mishandles out-of-range widths (computing a wrong mip count instead of rejecting).","fix":"Use uint64_t for the intermediate, or clamp/validate desc->Width before truncation.","locations":[{"ref":"libs/vkd3d/resource.c:303-309","code":"  303 | static unsigned int max_miplevel_count(const D3D12_RESOURCE_DESC1 *desc)\n  304 | {\n  305 |     unsigned int size = max(desc->Width, desc->Height);\n  306 |     if (desc->Dimension == D3D12_RESOURCE_DIMENSION_TEXTURE3D)\n  307 |         size = max(size, desc->DepthOrArraySize);\n  308 |     return vkd3d_log2i(size) + 1;\n  309 | }","lines":7,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/resource.c#L303-L309"}]},
{"id":"OVF_11","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"d3d12_resource_get_tiling computes the buffer tile count `align(desc->Width, VKD3D_TILE_SIZE) / VKD3D_TILE_SIZE` into a 32-bit `unsigned int tile_count` and stores it into *total_tile_count (UINT). desc->Width is UINT64; a very large reserved buffer silently truncates the tile count.","fix":"Compute tile_count as uint64_t and validate it fits in UINT before assigning, or clamp.","locations":[{"ref":"libs/vkd3d/resource.c:1961-1979","code":" 1961 |     if (desc->Dimension == D3D12_RESOURCE_DIMENSION_BUFFER)\n 1962 |     {\n 1963 |         tile_count = align(desc->Width, VKD3D_TILE_SIZE) / VKD3D_TILE_SIZE;\n 1964 | \n 1965 |         packed_mip_info->NumStandardMips = 0;\n 1966 |         packed_mip_info->NumPackedMips = 0;\n 1967 |         packed_mip_info->NumTilesForPackedMips = 0;\n 1968 |         packed_mip_info->StartTileIndexInOverallResource = 0;\n 1969 | \n 1970 |         tile_shape->WidthInTexels = VKD3D_TILE_SIZE;\n 1971 |         tile_shape->HeightInTexels = 1;\n 1972 |         tile_shape->DepthInTexels = 1;\n 1973 | \n 1974 |         tilings[0].WidthInTiles = tile_count;\n 1975 |         tilings[0].HeightInTiles = 1;\n 1976 |         tilings[0].DepthInTiles = 1;\n 1977 |         tilings[0].StartTileIndexInOverallResource = 0;\n 1978 | \n 1979 |         *total_tile_count = tile_count;","lines":19,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/resource.c#L1961-L1979"}]},
{"id":"OVF_12","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"d3d12_resource_supports_small_resource_alignment computes the slice size estimate as `desc->Width * desc->Height * format->byte_count * format->block_byte_count / (...)`. desc->Width is UINT64 but the other factors are 32-bit, so intermediates can overflow 32-bit before the UINT64 result is assigned, potentially mis-classifying a large texture as eligible for small alignment.","fix":"Cast to uint64_t at the start of the product, e.g. `(uint64_t)desc->Width * desc->Height * ...`.","locations":[{"ref":"libs/vkd3d/resource.c:3072-3085","code":" 3072 |     uint64_t estimated_size;\n 3073 | \n 3074 |     if (desc->Flags & (D3D12_RESOURCE_FLAG_ALLOW_DEPTH_STENCIL | D3D12_RESOURCE_FLAG_ALLOW_RENDER_TARGET))\n 3075 |         return false;\n 3076 | \n 3077 |     /* MSAA does not support 4K alignment at all (but it would most likely be covered by RTV/DSV check). */\n 3078 |     if (desc->SampleDesc.Count > 1)\n 3079 |         return false;\n 3080 | \n 3081 |     /* Windows uses the slice size to determine small alignment eligibility. DepthOrArraySize is ignored. */\n 3082 |     estimated_size = desc->Width * desc->Height * format->byte_count * format->block_byte_count\n 3083 |             / (format->block_width * format->block_height);\n 3084 | \n 3085 |     return estimated_size <= D3D12_DEFAULT_RESOURCE_PLACEMENT_ALIGNMENT;","lines":14,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/resource.c#L3072-L3085"}]},
{"id":"OVF_13","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"root-signature `info->cost` is a uint32_t accumulated directly from blob-controlled Num32BitValues with no per-iteration bound before the aggregate `cost > D3D12_MAX_ROOT_COST` (64) check. A crafted blob can wrap cost. The expression `(D3D12_MAX_ROOT_COST - info->cost) / 2` then underflows in unsigned arithmetic (saved only by a preceding min()), and a wrapped small cost could bypass the >64 rejection and mis-size the inline-redzone path.","fix":"Use a 64-bit (or saturating) accumulator for cost, and reorder the subtraction to guard against cost >= D3D12_MAX_ROOT_COST before subtracting.","locations":[{"ref":"libs/vkd3d/state.c:555-558","code":"  555 |             case D3D12_ROOT_PARAMETER_TYPE_32BIT_CONSTANTS:\n  556 |                 info->root_constant_count += 1;\n  557 |                 info->cost += p->Constants.Num32BitValues;\n  558 |                 break;","lines":4,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/state.c#L555-L558"},{"ref":"libs/vkd3d/state.c:574-575","code":"  574 |         info->hoist_descriptor_count = min(info->hoist_descriptor_count, VKD3D_MAX_HOISTED_DESCRIPTORS);\n  575 |         info->hoist_descriptor_count = min(info->hoist_descriptor_count, (D3D12_MAX_ROOT_COST - info->cost) / 2);","lines":2,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/state.c#L574-L575"},{"ref":"libs/vkd3d/state.c:1863-1867","code":" 1863 |     if (info.cost > D3D12_MAX_ROOT_COST)\n 1864 |     {\n 1865 |         WARN(\"Root signature cost %u exceeds maximum allowed cost.\\n\", info.cost);\n 1866 |         return E_INVALIDARG;\n 1867 |     }","lines":5,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/state.c#L1863-L1867"}]},
{"id":"OVF_14","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"vkd3d_shader_transform_feedback_info_dup allocates `NumStrides * sizeof(...)` and `NumEntries * sizeof(...)` where NumStrides/NumEntries are app-supplied UINTs. The count*size product is computed without an overflow guard; on 32-bit builds a large NumEntries can overflow the multiply and under-allocate, after which the memcpy of NumEntries elements overflows the heap buffer.","fix":"Use vkd3d_calloc (which guards count*size) or validate NumStrides/NumEntries against D3D12 stream-output limits before allocating/copying.","locations":[{"ref":"libs/vkd3d/state.c:2855-2869","code":" 2855 |     new_buffer_strides = vkd3d_malloc(so_desc->NumStrides * sizeof(*new_buffer_strides));\n 2856 |     if (!new_buffer_strides)\n 2857 |         goto fail;\n 2858 |     memcpy(new_buffer_strides, so_desc->pBufferStrides, so_desc->NumStrides * sizeof(*new_buffer_strides));\n 2859 |     xfb_info->buffer_strides = new_buffer_strides;\n 2860 | \n 2861 |     new_entries = vkd3d_malloc(so_desc->NumEntries * sizeof(*new_entries));\n 2862 |     if (!new_entries)\n 2863 |         goto fail;\n 2864 |     memcpy(new_entries, so_desc->pSODeclaration, so_desc->NumEntries * sizeof(*new_entries));\n 2865 |     xfb_info->elements = new_entries;\n 2866 | \n 2867 |     for (i = 0; i < so_desc->NumEntries; i++, num_duped++)\n 2868 |         if (!(new_entries[i].semantic_name = vkd3d_strdup(new_entries[i].semantic_name)))\n 2869 |             goto fail;","lines":15,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/state.c#L2855-L2869"}]},
{"id":"RES_1","type":"resource_leak","type_label":"Resource Leak","severity":"high","difficulty":"easy","description":"When vkd3d_array_reserve fails (OOM) the meta-pipeline getters return E_OUTOFMEMORY without unlocking the ops mutex that was locked earlier in the function. The mutex stays permanently locked, deadlocking all subsequent meta-pipeline lookups of that kind. The copy-image, resolve-image, and swapchain getters share this pattern.","fix":"Call pthread_mutex_unlock(&...->mutex) before returning E_OUTOFMEMORY in each array-reserve failure branch.","locations":[{"ref":"libs/vkd3d/meta.c:1035-1040","code":" 1035 |     if (!vkd3d_array_reserve((void **)&meta_copy_image_ops->pipelines, &meta_copy_image_ops->pipelines_size,\n 1036 |             meta_copy_image_ops->pipeline_count + 1, sizeof(*meta_copy_image_ops->pipelines)))\n 1037 |     {\n 1038 |         ERR(\"Failed to reserve space for pipeline.\\n\");\n 1039 |         return E_OUTOFMEMORY;\n 1040 |     }","lines":6,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/meta.c#L1035-L1040"},{"ref":"libs/vkd3d/meta.c:1469-1474","code":" 1469 |     if (!vkd3d_array_reserve((void **)&meta_resolve_image_ops->pipelines, &meta_resolve_image_ops->pipelines_size,\n 1470 |             meta_resolve_image_ops->pipeline_count + 1, sizeof(*meta_resolve_image_ops->pipelines)))\n 1471 |     {\n 1472 |         ERR(\"Failed to reserve space for pipeline.\\n\");\n 1473 |         return E_OUTOFMEMORY;\n 1474 |     }","lines":6,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/meta.c#L1469-L1474"},{"ref":"libs/vkd3d/meta.c:1648-1653","code":" 1648 |     if (!vkd3d_array_reserve((void **)&meta_swapchain_ops->pipelines, &meta_swapchain_ops->pipelines_size,\n 1649 |             meta_swapchain_ops->pipeline_count + 1, sizeof(*meta_swapchain_ops->pipelines)))\n 1650 |     {\n 1651 |         ERR(\"Failed to reserve space for pipeline.\\n\");\n 1652 |         return E_OUTOFMEMORY;\n 1653 |     }","lines":6,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/meta.c#L1648-L1653"}]},
{"id":"RES_2","type":"resource_leak","type_label":"Resource Leak","severity":"high","difficulty":"very_easy","description":"d3d12_resource_create_reserved does `return E_FAIL;` directly (instead of `goto fail;`) when vkd3d_get_buffer_device_address returns 0 for a sparse buffer. This leaks the entire d3d12_resource: the sparse VkBuffer, the sparse tiling/tile arrays, the view map, the private store, and the device reference taken in d3d12_resource_create. The object is never destroyed and the device refcount never balanced.","fix":"Set `hr = E_FAIL;` and `goto fail;` so d3d12_resource_destroy_and_release_device runs, matching every other error path in this function.","locations":[{"ref":"libs/vkd3d/resource.c:4889-4893","code":" 4889 |         if (!object->res.va)\n 4890 |         {\n 4891 |             ERR(\"Failed to get VA for sparse resource.\\n\");\n 4892 |             return E_FAIL;\n 4893 |         }","lines":5,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/resource.c#L4889-L4893"}]},
{"id":"RES_3","type":"resource_leak","type_label":"Resource Leak","severity":"medium","difficulty":"very_easy","description":"On Win32, d3d12core_CreateDeviceFromFactory acquires dxgi_adapter via d3d12_get_adapter (which AddRefs it), but if vkd3d_create_instance_global fails it does `return hr;` directly, bypassing the out_release_adapter label that calls IDXGIAdapter_Release. Every failed instance creation leaks an IDXGIAdapter reference.","fix":"Replace the early `return hr;` with `goto out_release_adapter;` (Win32) so the adapter reference is released on the error path.","locations":[{"ref":"libs/d3d12core/main.c:688-738","code":"  688 | #endif\n  689 | \n  690 |     if (FAILED(hr = vkd3d_create_instance_global(&instance)))\n  691 |         return hr;\n  692 | \n  693 |     memset(&device_create_info, 0, sizeof(device_create_info));\n  694 |     device_create_info.minimum_feature_level = minimum_feature_level;\n  695 |     device_create_info.instance = instance;\n  696 |     device_create_info.instance_create_info = NULL;\n  697 |     device_create_info.device_extensions = device_extensions;\n  698 |     device_create_info.device_extension_count = ARRAY_SIZE(device_extensions);\n  699 |     device_create_info.optional_device_extensions = optional_device_extensions;\n  700 |     device_create_info.optional_device_extension_count = ARRAY_SIZE(optional_device_extensions);\n  701 |     device_create_info.independent = factory != NULL;\n  702 |     if (factory)\n  703 |         device_create_info.device_factory_flags = ID3D12DeviceFactory_GetFlags(factory);\n  704 | \n  705 | #ifdef _WIN32\n  706 |     device_create_info.vk_physical_device = d3d12_find_physical_device(instance, vulkan_vkGetInstanceProcAddr, &adapter_desc);\n  707 |     device_create_info.parent = (IUnknown *)dxgi_adapter;\n  708 |     memcpy(&device_create_info.adapter_luid, &adapter_desc.AdapterLuid, VK_LUID_SIZE);\n  709 | \n  710 |     openvr_extensions = openvr_device_extensions(&adapter_desc);\n  711 |     openxr_extensions = openxr_vulkan_extensions(true);\n  712 |     vr_extension_count = parse_extension_list(openvr_extensions, NULL) + parse_extension_list(openxr_extensions, NULL);\n  713 |     if (vr_extension_count > 0)\n  714 |     {\n  715 |         size_t len = ARRAY_SIZE(device_extensions) + vr_extension_count;\n  716 |         uint32_t offset = ARRAY_SIZE(device_extensions);\n  717 |         char **extensions = calloc(len, sizeof(char *));\n  718 |         memcpy(extensions, device_extensions, sizeof(char *) * ARRAY_SIZE(device_extensions));\n  719 |         offset += parse_extension_list(openvr_extensions, extensions + offset);\n  720 |         parse_extension_list(openxr_extensions, extensions + offset);\n  721 |         device_create_info.device_extensions = (const char *const *)extensions;\n  722 |         device_create_info.device_extension_count = len;\n  723 |     }\n  724 | #endif\n  725 | \n  726 |     hr = vkd3d_create_device(&device_create_info, iid, device);\n  727 |     vkd3d_instance_decref(instance);\n  728 | \n  729 | #ifdef _WIN32\n  730 |     passthrough_unix_environment(\"VKD3D_UNIX_POST_ENV\");\n  731 |     if (device_create_info.device_extensions != device_extensions)\n  732 |         vkd3d_free((void *)device_create_info.device_extensions);\n  733 |     vkd3d_free(openvr_extensions);\n  734 |     vkd3d_free(openxr_extensions);\n  735 | \n  736 | out_release_adapter:\n  737 |     IDXGIAdapter_Release(dxgi_adapter);\n  738 | #endif","lines":51,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/d3d12core/main.c#L688-L738"}]},
{"id":"RES_4","type":"resource_leak","type_label":"Resource Leak","severity":"medium","difficulty":"easy","description":"In vkd3d_memory_allocation_init the host_ptr coherent-fallback branch calls vkMapMemory only to make Flush/Invalidate legal; if it fails the error is merely logged and execution continues with cpu_address set to the imported host_ptr. This diverges from the non-host_ptr branch which frees on map failure, and the implicit mapping is not explicitly unmapped on later teardown paths (bounded by vkFreeMemory implicitly unmapping).","fix":"Treat vkMapMemory failure in the host_ptr branch as fatal (free the allocation and return), mirroring the non-host_ptr branch.","locations":[{"ref":"libs/vkd3d/memory.c:1545-1571","code":" 1545 |     if (host_ptr)\n 1546 |     {\n 1547 |         /* D3D12 expects us to forward the host pointer as-is. Map the memory\n 1548 |          * region anyway so that calling Flush/Invalidate becomes legal, but\n 1549 |          * discard the mapped pointer. */\n 1550 |         allocation->flags |= VKD3D_ALLOCATION_FLAG_CPU_ACCESS;\n 1551 |         allocation->cpu_address = host_ptr;\n 1552 | \n 1553 |         if (!(device->memory_properties.memoryTypes[allocation->device_allocation.vk_memory_type].propertyFlags & VK_MEMORY_PROPERTY_HOST_COHERENT_BIT))\n 1554 |         {\n 1555 |             if ((vr = VK_CALL(vkMapMemory(device->vk_device, allocation->device_allocation.vk_memory,\n 1556 |                     0, VK_WHOLE_SIZE, 0, &dummy_mapping))))\n 1557 |                 ERR(\"Failed to map memory, vr %d.\\n\", vr);\n 1558 |         }\n 1559 |     }\n 1560 |     else if (type_flags & VK_MEMORY_PROPERTY_HOST_VISIBLE_BIT)\n 1561 |     {\n 1562 |         allocation->flags |= VKD3D_ALLOCATION_FLAG_CPU_ACCESS;\n 1563 | \n 1564 |         if ((vr = VK_CALL(vkMapMemory(device->vk_device, allocation->device_allocation.vk_memory,\n 1565 |                 0, VK_WHOLE_SIZE, 0, &allocation->cpu_address))))\n 1566 |         {\n 1567 |             ERR(\"Failed to map memory, vr %d.\\n\", vr);\n 1568 |             vkd3d_memory_allocation_free(allocation, device, allocator);\n 1569 |             return hresult_from_vk_result(vr);\n 1570 |         }\n 1571 |     }","lines":27,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/memory.c#L1545-L1571"}]},
{"id":"RES_5","type":"resource_leak","type_label":"Resource Leak","severity":"medium","difficulty":"medium","description":"vkd3d_meta_get_copy_image_pipeline increments pipeline_count BEFORE vkd3d_meta_create_copy_image_pipeline is called. On failure (e.g. unhandled view type returns E_INVALIDARG, or a Vulkan failure) the function returns with pipeline_count already incremented, pointing at a slot whose vk_pipeline is uninitialized garbage; on later cleanup vkDestroyPipeline is called on that garbage handle. The resolve-image getter avoids this by incrementing only after success.","fix":"Do not increment pipeline_count until vkd3d_meta_create_copy_image_pipeline succeeds, or zero the slot before creation.","locations":[{"ref":"libs/vkd3d/meta.c:1042-1048","code":" 1042 |     pipeline = &meta_copy_image_ops->pipelines[meta_copy_image_ops->pipeline_count++];\n 1043 | \n 1044 |     if (FAILED(hr = vkd3d_meta_create_copy_image_pipeline(meta_ops, key, pipeline, heap)))\n 1045 |     {\n 1046 |         pthread_mutex_unlock(&meta_copy_image_ops->mutex);\n 1047 |         return hr;\n 1048 |     }","lines":7,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/meta.c#L1042-L1048"}]},
{"id":"RES_6","type":"resource_leak","type_label":"Resource Leak","severity":"medium","difficulty":"medium","description":"d3d12_query_heap_create: on the inline (buffer-backed) path object->vk_buffer and object->device_allocation are created, but if vkd3d_private_store_init then fails it only calls vkd3d_free(object), leaking the VkBuffer and the device memory allocation (the query-pool path leaks the pool similarly).","fix":"Before vkd3d_free(object) in the private_store_init failure branch, destroy object->vk_query_pool / object->vk_buffer and free object->device_allocation.","locations":[{"ref":"libs/vkd3d/resource.c:10863-10867","code":"10863 |     if (FAILED(hr = vkd3d_private_store_init(&object->private_store)))\n10864 |     {\n10865 |         vkd3d_free(object);\n10866 |         return hr;\n10867 |     }","lines":5,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/resource.c#L10863-L10867"}]},
{"id":"RES_7","type":"resource_leak","type_label":"Resource Leak","severity":"low","difficulty":"very_easy","description":"d3d12_command_queue_ExecuteCommandLists returns immediately when the cmd_cost allocation fails, without freeing the already-allocated `buffers` and `allocators` arrays (the allocators-failure path just above correctly frees `buffers`). Both leak on every OOM here.","fix":"Before returning, `vkd3d_free(allocators); vkd3d_free(buffers);` (and complete the timeline trace as the other error paths do).","locations":[{"ref":"libs/vkd3d/command.c:24015-24019","code":"24015 |     if (!(cmd_cost = vkd3d_calloc(num_command_buffers, sizeof(*cmd_cost))))\n24016 |     {\n24017 |         ERR(\"Failed to allocate command buffer cost array.\\n\");\n24018 |         return;\n24019 |     }","lines":5,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/command.c#L24015-L24019"}]},
{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"easy","description":"In vkd3d_create_vk_device the `extensions` array (allocated earlier) is leaked on two error paths after vkCreateDevice succeeds: when vkd3d_load_vk_device_procs fails (4106-4112) and when d3d12_device_create_vkd3d_queues fails (4116-4121). `extensions` is only assigned to device->vk_info.extension_names at 4123-4124 (where the destroy path frees it), so both earlier failures `return hr;` without freeing it. (The vr<0 path at 4102 frees it correctly.)","fix":"Add `vkd3d_free((void *)extensions);` before `return hr;` in both the load-procs failure block and the create-queues failure block.","locations":[{"ref":"libs/vkd3d/device.c:3234-3259","code":" 3234 |     if (vr < 0)\n 3235 |     {\n 3236 |         ERR(\"Failed to create Vulkan device, vr %d.\\n\", vr);\n 3237 |         vkd3d_free((void *)extensions);\n 3238 |         return hresult_from_vk_result(vr);\n 3239 |     }\n 3240 | \n 3241 |     if (FAILED(hr = vkd3d_load_vk_device_procs(&device->vk_procs, vk_procs, vk_device)))\n 3242 |     {\n 3243 |         ERR(\"Failed to load device procs, hr %#x.\\n\", (int)hr);\n 3244 |         if (device->vk_procs.vkDestroyDevice)\n 3245 |             device->vk_procs.vkDestroyDevice(vk_device, NULL);\n 3246 |         return hr;\n 3247 |     }\n 3248 | \n 3249 |     device->vk_device = vk_device;\n 3250 | \n 3251 |     if (FAILED(hr = d3d12_device_create_vkd3d_queues(device, &device_queue_info)))\n 3252 |     {\n 3253 |         ERR(\"Failed to create queues, hr %#x.\\n\", (int)hr);\n 3254 |         device->vk_procs.vkDestroyDevice(vk_device, NULL);\n 3255 |         return hr;\n 3256 |     }\n 3257 | \n 3258 |     device->vk_info.extension_count = device_info.enabledExtensionCount;\n 3259 |     device->vk_info.extension_names = extensions;","lines":26,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/device.c#L3234-L3259"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"vkd3d_breadcrumb_trace_contexts_are_linked spins forever on a non-linked/corrupted context chain: when the link-validity test at line 442 is false (next == UINT32_MAX, a self-loop, or a prev mismatch), context_index is never advanced yet the while-condition stays true. Reached during NV device-lost breadcrumb analysis when contexts are not actually linked.","fix":"Break out of the loop (return false) when the condition at line 442 is not satisfied, instead of looping with context_index unchanged.","locations":[{"ref":"libs/vkd3d/breadcrumbs.c:434-445","code":"  434 | static bool vkd3d_breadcrumb_trace_contexts_are_linked(struct vkd3d_breadcrumb_tracer *tracer,\n  435 |         uint32_t context_index, uint32_t target_context_index)\n  436 | {\n  437 |     while (context_index != target_context_index)\n  438 |     {\n  439 |         uint32_t next = tracer->trace_contexts[context_index].next;\n  440 |         if (next != UINT32_MAX && next != context_index && tracer->trace_contexts[next].prev == context_index)\n  441 |             context_index = next;\n  442 |     }\n  443 | \n  444 |     return context_index == target_context_index;\n  445 | }","lines":12,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/breadcrumbs.c#L434-L445"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"d3d12_command_list_EndRenderPass tests the wrong bitfield for \"render pass never started\": it ANDs `list->rendering_info.info.flags` (a VkRenderingFlags value, where bit 0 is VK_RENDERING_CONTENTS_SECONDARY_COMMAND_BUFFERS_BIT) with VKD3D_RENDERING_ACTIVE (a vkd3d state bit, value 1). Every other \"is rendering active\" check in the file uses `rendering_info.state_flags & VKD3D_RENDERING_ACTIVE`. As written, pending load/store/clear work may be skipped or a redundant render pass forced.","fix":"Change the condition to `!(list->rendering_info.state_flags & VKD3D_RENDERING_ACTIVE)`.","locations":[{"ref":"libs/vkd3d/command.c:21103-21110","code":"21103 |     if (list->rendering_info.has_pending_render_pass_load_store_work &&\n21104 |             !(list->rendering_info.info.flags & VKD3D_RENDERING_ACTIVE))\n21105 |     {\n21106 |         /* If we never started the render pass due to no draw calls,\n21107 |          * forcefully start it so that we can get the fused clears in the proper render pass,\n21108 |          * and not forcing a separate clear. */\n21109 |         d3d12_command_list_begin_render_pass(list, VKD3D_PIPELINE_TYPE_NONE);\n21110 |     }","lines":8,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/command.c#L21103-L21110"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In the 16-bit dispatch-grid branch of the work-graph static-broadcast path, a spurious outer `for (i = 0; i < desc->NumRecords; i++)` wraps an inner `for (i = 0; i < node_input->dispatch_grid_components; i++)` that reuses and clobbers the same loop variable `i`. The 32-bit sibling branch has no such outer loop, confirming a copy-paste mistake; `grid` is also read from a fixed offset regardless of record.","fix":"Remove the spurious outer NumRecords loop in the 16-bit branch so it matches the 32-bit branch, reading grid directly with a single component loop.","locations":[{"ref":"libs/vkd3d/workgraphs.c:2688-2696","code":" 2688 |             else\n 2689 |             {\n 2690 |                 for (i = 0; i < desc->NumRecords; i++)\n 2691 |                 {\n 2692 |                     const uint16_t *grid = (const uint16_t *)(records + node_input->dispatch_grid_offset);\n 2693 |                     for (i = 0; i < node_input->dispatch_grid_components; i++)\n 2694 |                         num_wgx[i] = grid[i];\n 2695 |                 }\n 2696 |             }","lines":9,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/workgraphs.c#L2688-L2696"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"Win32 vkd3d_get_program_name uses strncpy(program_name, name, VKD3D_PATH_MAX) without forcing NUL termination. strncpy does not NUL-terminate when the source length >= VKD3D_PATH_MAX, leaving program_name non-terminated. The Linux variant correctly does `program_name[VKD3D_PATH_MAX - 1] = 0`; the Win32 path omits it, so later string use can read past the buffer.","fix":"Add `program_name[VKD3D_PATH_MAX - 1] = 0;` after the strncpy in the Win32 implementation.","locations":[{"ref":"libs/vkd3d-common/platform.c:172-193","code":"  172 | bool vkd3d_get_program_name(char program_name[VKD3D_PATH_MAX])\n  173 | {\n  174 |     char *name;\n  175 |     char exe_path[VKD3D_PATH_MAX];\n  176 |     GetModuleFileNameA(NULL, exe_path, VKD3D_PATH_MAX);\n  177 | \n  178 |     if ((name = strrchr(exe_path, '/')))\n  179 |     {\n  180 |         ++name;\n  181 |     }\n  182 |     else if ((name = strrchr(exe_path, '\\\\')))\n  183 |     {\n  184 |         ++name;\n  185 |     }\n  186 |     else\n  187 |     {\n  188 |         name = exe_path;\n  189 |     }\n  190 | \n  191 |     strncpy(program_name, name, VKD3D_PATH_MAX);\n  192 |     return true;\n  193 | }","lines":22,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d-common/platform.c#L172-L193"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"Win32 vkd3d_get_env_var success test `len > 0 && len <= value_size` is off-by-one versus GetEnvironmentVariableA semantics (it returns char count NOT including the NUL on success, and the required size INCLUDING the NUL when too small). The canonical test is `len < value_size`; the `<=` boundary is the wrong contract and muddies truncation detection.","fix":"Use `if (len > 0 && len < value_size)`.","locations":[{"ref":"libs/vkd3d-common/platform.c:389-404","code":"  389 | bool vkd3d_get_env_var(const char *name, char *value, size_t value_size)\n  390 | {\n  391 |     DWORD len;\n  392 |     \n  393 |     assert(value);\n  394 |     assert(value_size > 0);\n  395 | \n  396 |     len = GetEnvironmentVariableA(name, value, value_size);\n  397 |     if (len > 0 && len <= value_size)\n  398 |     {\n  399 |         return true;\n  400 |     }\n  401 | \n  402 |     value[0] = '\\0';\n  403 |     return false;\n  404 | }","lines":16,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d-common/platform.c#L389-L404"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"vkd3d_export_strequal_mixed compares an unsigned-short WCHAR (*a) against a signed `char` (*b). For byte values >= 0x80 the char is sign-extended to a negative int while the WCHAR stays positive, so identical non-ASCII bytes never compare equal. Only ASCII comparisons are reliable.","fix":"Compare against `(unsigned char)*b`.","locations":[{"ref":"libs/vkd3d-common/string.c:85-98","code":"   85 | bool vkd3d_export_strequal_mixed(const WCHAR *a, const char *b)\n   86 | {\n   87 |     if (!a || !b)\n   88 |         return false;\n   89 | \n   90 |     while (*a != '\\0' && *b != '\\0')\n   91 |     {\n   92 |         if (*a != *b)\n   93 |             return false;\n   94 |         a++;\n   95 |         b++;\n   96 |     }\n   97 |     return *a == *b;\n   98 | }","lines":14,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d-common/string.c#L85-L98"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"vkd3d_get_cached_spirv_code_from_d3d12_desc allocates and decodes `decompressed_spirv_size` bytes read from the (untrusted) cache blob, but never checks that the value is a multiple of 4. SPIR-V must be a multiple of 4 bytes; a non-multiple value silently yields a partially-uninitialized shader blob handed to Vulkan (the size is set to the full value while trailing bytes are never written). Not memory-unsafe but a correctness/robustness gap.","fix":"Reject the chunk if `decompressed_spirv_size % sizeof(uint32_t) != 0` before allocating/decoding.","locations":[{"ref":"libs/vkd3d/cache.c:726-740","code":"  726 |     duped_code = vkd3d_malloc(spirv->decompressed_spirv_size);\n  727 |     if (!duped_code)\n  728 |         return E_OUTOFMEMORY;\n  729 | \n  730 |     if (!vkd3d_decode_varint(duped_code,\n  731 |             spirv->decompressed_spirv_size / sizeof(uint32_t),\n  732 |             spirv->data, spirv->compressed_spirv_size))\n  733 |     {\n  734 |         FIXME(\"Failed to decode VARINT.\\n\");\n  735 |         vkd3d_free(duped_code);\n  736 |         return E_INVALIDARG;\n  737 |     }\n  738 | \n  739 |     spirv_code->code = duped_code;\n  740 |     spirv_code->size = spirv->decompressed_spirv_size;","lines":15,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/cache.c#L726-L740"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In vkd3d_create_texture_srv_view the PREALLOCATE_SRV_MIP_CLAMPS loop treats mip_count as an end index: `for (i = starting_mip; i < mip_count; i++)`, but mip_count is a count, not an end index. When starting_mip > 0 this skips clamp levels and iterates the wrong range. Config-flag-gated optimization, so impact is missed prealloc rather than corruption.","fix":"Iterate `for (i = starting_mip; i < starting_mip + mip_count; i++)` (clamped to resource->desc.MipLevels).","locations":[{"ref":"libs/vkd3d/resource.c:7112-7124","code":" 7112 |             uint32_t starting_mip = key.u.texture.miplevel_idx;\n 7113 |             uint32_t mip_count = key.u.texture.miplevel_count != UINT32_MAX ?\n 7114 |                     key.u.texture.miplevel_count :\n 7115 |                     resource->desc.MipLevels - starting_mip;\n 7116 |             uint32_t i;\n 7117 | \n 7118 |             struct vkd3d_view_key preallocate_key = key;\n 7119 | \n 7120 |             for (i = starting_mip; i < mip_count; i++)\n 7121 |             {\n 7122 |                 preallocate_key.u.texture.miplevel_clamp = (float)(i);\n 7123 |                 vkd3d_view_map_create_view(&resource->view_map, device, &preallocate_key);\n 7124 |             }","lines":13,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/resource.c#L7112-L7124"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"d3d12_root_signature_init_root_descriptor_tables relies on a subtle, undocumented invariant that count_srv_uav_table (counting up to 4 bindings per range) and init_srv_uav_binding (appending up to 4 bindings: aux + buffer + raw_ssbo + image) stay in lockstep. A mismatch would overflow root_signature->bindings (heap corruption).","fix":"Add `assert(context->binding_index + table->binding_count <= root_signature->binding_count)` after each table is filled to catch count/fill divergence before it corrupts the heap.","locations":[{"ref":"libs/vkd3d/state.c:418-439","code":"  418 | static void d3d12_root_signature_info_count_srv_uav_table(struct d3d12_root_signature_info *info,\n  419 |         struct d3d12_device *device, D3D12_DESCRIPTOR_RANGE_TYPE range_type)\n  420 | {\n  421 |     /* Separate image + buffer descriptors + (most likely) aux buffer descriptor.\n  422 |      * Needs to match d3d12_root_signature_init_srv_uav_binding. */\n  423 |     bool can_skip_rtas_binding = d3d12_device_use_descriptor_heap(device) && range_type == D3D12_DESCRIPTOR_RANGE_TYPE_SRV;\n  424 |     info->binding_count += 2;\n  425 | \n  426 |     /* For UAV we always need an extra binding for the UAV counter.\n  427 |      * This UAV counter is either a texel buffer or a raw VA binding.\n  428 |      * For SRV we can map to RTAS. */\n  429 |     if (!can_skip_rtas_binding)\n  430 |         info->binding_count += 1;\n  431 | \n  432 |     if (device->bindless_state.flags & VKD3D_BINDLESS_RAW_SSBO)\n  433 |         info->binding_count += 1;\n  434 | \n  435 |     if (device->bindless_state.flags & VKD3D_SSBO_OFFSET_BUFFER)\n  436 |         info->has_ssbo_offset_buffer = true;\n  437 |     if (device->bindless_state.flags & VKD3D_TYPED_OFFSET_BUFFER)\n  438 |         info->has_typed_offset_buffer = true;\n  439 | }","lines":22,"link":"https://github.com/HansKristian-Work/vkd3
