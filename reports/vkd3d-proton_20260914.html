led without shader magic.\n  797 |          * - App creates RWStructuredBuffer with counter, app reads as typed buffer: Typed buffer will read from counter. */\n  798 |         if (vkd3d_bindless_state_find_binding(bindless_state, range_flag | VKD3D_BINDLESS_SET_BUFFER, &binding->binding))\n  799 |             out_bindings_base[(*out_index)++] = *binding;\n  800 |     }\n  801 |     else if (range_type == D3D12_DESCRIPTOR_RANGE_TYPE_UAV || !d3d12_device_use_descriptor_heap(root_signature->device))\n  802 |     {\n  803 |         /* Use raw VA for both RTAS and UAV counters.\n  804 |          * On heap, we use proper descriptors for RTAS, so skip this path for SRV. We'll pick up the normal buffer bindings. */\n  805 |         binding->flags |= VKD3D_SHADER_BINDING_FLAG_RAW_VA;\n  806 |         binding->binding = root_signature->raw_va_aux_buffer_binding;\n  807 |         out_bindings_base[(*out_index)++] = *binding;\n  808 |     }\n  809 | \n  810 |     if (vkd3d_bindless_state_find_binding(bindless_state, range_flag | VKD3D_BINDLESS_SET_BUFFER, &binding->binding))\n  811 |     {\n  812 |         binding->flags = VKD3D_SHADER_BINDING_FLAG_BINDLESS | VKD3D_SHADER_BINDING_FLAG_BUFFER;\n  813 |         out_bindings_base[(*out_index)++] = *binding;\n  814 |     }\n  815 | \n  816 |     if (vkd3d_bindless_state_find_binding(bindless_state, range_flag | VKD3D_BINDLESS_SET_RAW_SSBO, &binding->binding))\n  817 |     {\n  818 |         binding->flags = VKD3D_SHADER_BINDING_FLAG_BINDLESS | VKD3D_SHADER_BINDING_FLAG_BUFFER | VKD3D_SHADER_BINDING_FLAG_RAW_SSBO;\n  819 |         out_bindings_base[(*out_index)++] = *binding;\n  820 |     }\n  821 | \n  822 |     if (vkd3d_bindless_state_find_binding(bindless_state, range_flag | VKD3D_BINDLESS_SET_IMAGE, &binding->binding))\n  823 |     {\n  824 |         binding->flags = VKD3D_SHADER_BINDING_FLAG_BINDLESS | VKD3D_SHADER_BINDING_FLAG_IMAGE;\n  825 |         out_bindings_base[(*out_index)++] = *binding;\n  826 |     }\n  827 | }","lines":54,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/state.c#L774-L827"},{"ref":"libs/vkd3d/state.c:1053-1063","code":" 1053 |                     d3d12_root_signature_init_srv_uav_binding(root_signature, context, range->RangeType,\n 1054 |                             &binding, table->first_binding, &table->binding_count);\n 1055 |                     break;\n 1056 |                 default:\n 1057 |                     FIXME(\"Unhandled descriptor range type %u.\\n\", range->RangeType);\n 1058 |             }\n 1059 | \n 1060 |             range_descriptor_offset = binding.descriptor_offset + binding.register_count;\n 1061 |         }\n 1062 | \n 1063 |         context->binding_index += table->binding_count;","lines":11,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/state.c#L1053-L1063"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"vkd3d_report_pipeline_creation_feedback_results prints the per-stage compile duration using `feedback->pPipelineCreationFeedback->duration` (the GLOBAL feedback) inside the per-stage loop, instead of `feedback->pPipelineStageCreationFeedbacks[i].duration`. Every stage is reported with the global pipeline duration, making the per-stage timing log incorrect (diagnostic only).","fix":"Use feedback->pPipelineStageCreationFeedbacks[i].duration for the per-stage INFO line.","locations":[{"ref":"libs/vkd3d/state.c:3490-3504","code":" 3490 |     for (i = 0; i < feedback->pipelineStageCreationFeedbackCount; i++)\n 3491 |     {\n 3492 |         if (feedback->pPipelineStageCreationFeedbacks[i].flags &\n 3493 |                 VK_PIPELINE_CREATION_FEEDBACK_VALID_BIT_EXT)\n 3494 |         {\n 3495 |             if (feedback->pPipelineStageCreationFeedbacks[i].flags &\n 3496 |                     VK_PIPELINE_CREATION_FEEDBACK_APPLICATION_PIPELINE_CACHE_HIT_BIT_EXT)\n 3497 |             {\n 3498 |                 INFO(\"  Stage %u: Pipeline compilation reused pipeline cache.\\n\", i);\n 3499 |             }\n 3500 |             else\n 3501 |             {\n 3502 |                 INFO(\"  Stage %u: compilation took %\"PRIu64\" ns.\\n\",\n 3503 |                         i, feedback->pPipelineCreationFeedback->duration);\n 3504 |             }","lines":15,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/state.c#L3490-L3504"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"d3d12_pipeline_state_create_pipeline_variant fallback path: if vkd3d_late_compile_shader_stages succeeds and the second vkCreateGraphicsPipelines also returns VK_PIPELINE_COMPILE_REQUIRED (a positive code, not < 0), the vr<0 error block is skipped and the function falls through to the success return with a VK_NULL_HANDLE/uninitialized vk_pipeline that the caller treats as success.","fix":"Treat vr == VK_PIPELINE_COMPILE_REQUIRED after the fallback create as a hard error (set vk_pipeline = VK_NULL_HANDLE and goto err).","locations":[{"ref":"libs/vkd3d/state.c:7058-7108","code":" 7058 |     if (vr == VK_PIPELINE_COMPILE_REQUIRED)\n 7059 |     {\n 7060 |         if (FAILED(hr = vkd3d_late_compile_shader_stages(state)))\n 7061 |         {\n 7062 |             ERR(\"Late compilation of SPIR-V failed.\\n\");\n 7063 |             vk_pipeline = VK_NULL_HANDLE;\n 7064 |             goto err;\n 7065 |         }\n 7066 | \n 7067 |         flags2.flags &= ~VK_PIPELINE_CREATE_2_FAIL_ON_PIPELINE_COMPILE_REQUIRED_BIT;\n 7068 | \n 7069 |         /* Internal modules are known to be non-null now. */\n 7070 |         pipeline_desc.pStages = state->graphics.stages;\n 7071 | \n 7072 |         cookie = vkd3d_queue_timeline_trace_register_pso_compile(&device->queue_timeline_trace);\n 7073 |         vr = VK_CALL(vkCreateGraphicsPipelines(device->vk_device, vk_cache, 1, &pipeline_desc, NULL, &vk_pipeline));\n 7074 | \n 7075 |         if (vkd3d_queue_timeline_trace_cookie_is_valid(cookie))\n 7076 |         {\n 7077 |             const char *kind = vr == VK_SUCCESS ? \"FALLBACK OK\" : \"FALLBACK ERR\";\n 7078 |             vkd3d_queue_timeline_trace_complete_pso_compile(&device->queue_timeline_trace,\n 7079 |                     cookie, vkd3d_pipeline_cache_compatibility_condense(&state->pipeline_cache_compat), kind);\n 7080 |         }\n 7081 |     }\n 7082 | \n 7083 |     TRACE(\"Completed vkCreateGraphicsPipelines.\\n\");\n 7084 | \n 7085 |     if (vr < 0)\n 7086 |     {\n 7087 |         ERR(\"Failed to create Vulkan graphics pipeline, vr %d.\\n\", vr);\n 7088 |         d3d12_pipeline_state_log_graphics_state(state);\n 7089 | \n 7090 |         vk_pipeline = VK_NULL_HANDLE;\n 7091 |         goto err;\n 7092 |     }\n 7093 | \n 7094 |     if (feedback_info.pipelineStageCreationFeedbackCount)\n 7095 |         vkd3d_report_pipeline_creation_feedback_results(&feedback_info);\n 7096 | \n 7097 |     if (library_flags)\n 7098 |         graphics->library_create_flags = flags2.flags & VK_PIPELINE_CREATE_2_FAIL_ON_PIPELINE_COMPILE_REQUIRED_BIT;\n 7099 | \n 7100 | err:\n 7101 |     /* Clean up any temporary SPIR-V modules we created. */\n 7102 |     while (stages_module_dup_mask)\n 7103 |     {\n 7104 |         i = vkd3d_bitmask_iter32(&stages_module_dup_mask);\n 7105 |         VK_CALL(vkDestroyShaderModule(device->vk_device, stages[i].module, NULL));\n 7106 |     }\n 7107 | \n 7108 |     return vk_pipeline;","lines":51,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/state.c#L7058-L7108"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"easy","description":"In the three deferred COLLECTION matching loops (entry points, hit groups, subobjects) the inner loop iterates `j` over num_exports to find a matching export, but the export descriptor is indexed with the OUTER loop variable: `exports[i].ExportToRename / exports[i].Name`. `i` ranges over deferred->entry_points_count / hit_groups_count / subobjects_count, unrelated to num_exports — so it compares the wrong export name (logic bug) and reads out of bounds of the app-provided exports[] array whenever i >= num_exports. App-controlled OOB read.","fix":"Use exports[j] consistently inside the inner loop, matching the non-deferred compile path which correctly uses collection->exports[j].","locations":[{"ref":"libs/vkd3d/raytracing_pipeline.c:714-723","code":"  714 |             for (j = 0; j < num_exports; j++)\n  715 |                 if (vkd3d_export_equal(exports[i].ExportToRename ? exports[i].ExportToRename : exports[i].Name, entry))\n  716 |                     break;\n  717 | \n  718 |             if (j < num_exports)\n  719 |             {\n  720 |                 export_desc = &exports[i];\n  721 |                 accept_entry_point = true;\n  722 |             }\n  723 |         }","lines":10,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/raytracing_pipeline.c#L714-L723"},{"ref":"libs/vkd3d/raytracing_pipeline.c:780-794","code":"  780 |             for (j = 0; j < num_exports; j++)\n  781 |             {\n  782 |                 if (exports[i].ExportToRename)\n  783 |                     FIXME(\"Cannot rename deferred COLLECTION hit group export name.\\n\");\n  784 | \n  785 |                 if (vkd3d_export_strequal(\n  786 |                         exports[i].ExportToRename ? exports[i].ExportToRename : exports[i].Name,\n  787 |                         deferred->hit_groups[i]->HitGroupExport))\n  788 |                 {\n  789 |                     break;\n  790 |                 }\n  791 |             }\n  792 | \n  793 |             if (j < num_exports)\n  794 |                 accept_hit_group = true;","lines":15,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/raytracing_pipeline.c#L780-L794"},{"ref":"libs/vkd3d/raytracing_pipeline.c:820-838","code":"  820 |             for (j = 0; j < num_exports; j++)\n  821 |             {\n  822 |                 if (exports[i].ExportToRename)\n  823 |                     FIXME(\"Cannot rename deferred COLLECTION subobject export name.\\n\");\n  824 | \n  825 |                 if (vkd3d_export_strequal(\n  826 |                         exports[i].ExportToRename ? exports[i].ExportToRename : exports[i].Name,\n  827 |                         deferred->subobjects[i].name))\n  828 |                 {\n  829 |                     break;\n  830 |                 }\n  831 |             }\n  832 | \n  833 |             if (j < num_exports)\n  834 |             {\n  835 |                 accept_subobject = true;\n  836 |                 export_desc = &exports[i];\n  837 |             }\n  838 |         }","lines":19,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/raytracing_pipeline.c#L820-L838"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"very_easy","description":"The CopyTileMappings out-of-bounds WARN logs the dst-coordinate Y argument using `src_region_start_coordinate->Y` instead of `dst_region_start_coordinate->Y` (the rest of the dst argument group uses dst_region_start_coordinate). Diagnostic-only: misleading log when tiles are out of bounds.","fix":"Replace the second `src_region_start_coordinate->Y` with `dst_region_start_coordinate->Y`.","locations":[{"ref":"libs/vkd3d/command.c:23765-23767","code":"23765 |             WARN(\"Tile coordinates out of bounds, src subresource %u @ (%u,%u,%u), dst subresource %u @ (%u,%u,%u), tile %u.\\n\",\n23766 |                     src_region_start_coordinate->Subresource, src_region_start_coordinate->X, src_region_start_coordinate->Y, src_region_start_coordinate->Z,\n23767 |                     dst_region_start_coordinate->Subresource, dst_region_start_coordinate->X, src_region_start_coordinate->Y, dst_region_start_coordinate->Z, i);","lines":3,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/command.c#L23765-L23767"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"On error, vkd3d_memory_transfer_queue_flush_locked returns early (vkResetCommandBuffer/Begin/EndCommandBuffer fail, vkd3d_queue_acquire fail, vkQueueSubmit2 fail) WITHOUT resetting queue->transfer_count / num_bytes_pending or advancing command_buffer_index / next_signal_value. Allocations in the batch already recorded clear_semaphore_value = next_signal_value, but that timeline value is now never signaled, so a later vkd3d_free_memory -> wait_allocation can block forever, or stale transfers get re-submitted, corrupting accounting.","fix":"On the error paths keep the batch consistent (do not strand the timeline value used by queued allocations); clamp/clear clear_semaphore_value tracking, or mark the failure so a later wait does not block on an unreachable value.","locations":[{"ref":"libs/vkd3d/memory.c:318-333","code":"  318 |     if ((vr = VK_CALL(vkResetCommandBuffer(vk_cmd_buffer, 0))))\n  319 |     {\n  320 |         ERR(\"Failed to reset command pool, vr %d.\\n\", vr);\n  321 |         return hresult_from_vk_result(vr);\n  322 |     }\n  323 | \n  324 |     begin_info.sType = VK_STRUCTURE_TYPE_COMMAND_BUFFER_BEGIN_INFO;\n  325 |     begin_info.pNext = NULL;\n  326 |     begin_info.flags = VK_COMMAND_BUFFER_USAGE_ONE_TIME_SUBMIT_BIT;\n  327 |     begin_info.pInheritanceInfo = NULL;\n  328 | \n  329 |     if ((vr = VK_CALL(vkBeginCommandBuffer(vk_cmd_buffer, &begin_info))) < 0)\n  330 |     {\n  331 |         ERR(\"Failed to begin command buffer, vr %d.\\n\", vr);\n  332 |         return hresult_from_vk_result(vr);\n  333 |     }","lines":16,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/memory.c#L318-L333"},{"ref":"libs/vkd3d/memory.c:426-478","code":"  426 |     if ((vr = VK_CALL(vkEndCommandBuffer(vk_cmd_buffer))) < 0)\n  427 |     {\n  428 |         ERR(\"Failed to end command buffer, vr %d.\\n\", vr);\n  429 |         return hresult_from_vk_result(vr);\n  430 |     }\n  431 | \n  432 |     if (!(vk_queue = vkd3d_queue_acquire(queue->vkd3d_queue)))\n  433 |         return E_FAIL;\n  434 | \n  435 |     memset(&cmd_buffer_info, 0, sizeof(cmd_buffer_info));\n  436 |     cmd_buffer_info.sType = VK_STRUCTURE_TYPE_COMMAND_BUFFER_SUBMIT_INFO;\n  437 |     cmd_buffer_info.commandBuffer = vk_cmd_buffer;\n  438 | \n  439 |     memset(&signal_semaphore_infos, 0, sizeof(signal_semaphore_infos));\n  440 |     signal_semaphore_infos[0].sType = VK_STRUCTURE_TYPE_SEMAPHORE_SUBMIT_INFO;\n  441 |     signal_semaphore_infos[0].semaphore = queue->vk_semaphore;\n  442 |     signal_semaphore_infos[0].value = queue->next_signal_value;\n  443 |     signal_semaphore_infos[0].stageMask = VK_PIPELINE_STAGE_2_COPY_BIT;\n  444 | \n  445 |     /* External submission */\n  446 |     signal_semaphore_infos[1].sType = VK_STRUCTURE_TYPE_SEMAPHORE_SUBMIT_INFO;\n  447 |     signal_semaphore_infos[1].semaphore = queue->vkd3d_queue->submission_timeline;\n  448 |     signal_semaphore_infos[1].value = ++queue->vkd3d_queue->submission_timeline_count;\n  449 |     signal_semaphore_infos[1].stageMask = VK_PIPELINE_STAGE_2_COPY_BIT;\n  450 | \n  451 |     memset(&submit_info, 0, sizeof(submit_info));\n  452 |     submit_info.sType = VK_STRUCTURE_TYPE_SUBMIT_INFO_2;\n  453 |     submit_info.commandBufferInfoCount = 1;\n  454 |     submit_info.pCommandBufferInfos = &cmd_buffer_info;\n  455 |     submit_info.signalSemaphoreInfoCount = ARRAY_SIZE(signal_semaphore_infos);\n  456 |     submit_info.pSignalSemaphoreInfos = signal_semaphore_infos;\n  457 | \n  458 |     vr = VK_CALL(vkQueueSubmit2(vk_queue, 1, &submit_info, VK_NULL_HANDLE));\n  459 |     vkd3d_queue_release(queue->vkd3d_queue);\n  460 | \n  461 |     VKD3D_DEVICE_REPORT_FAULT_AND_BREADCRUMB_IF(queue->device, vr == VK_ERROR_DEVICE_LOST);\n  462 | \n  463 |     if (vr < 0)\n  464 |     {\n  465 |         ERR(\"Failed to submit command buffer, vr %d.\\n\", vr);\n  466 |         return hresult_from_vk_result(vr);\n  467 |     }\n  468 | \n  469 |     /* Stall future submissions on other queues until the clear has finished */\n  470 |     vkd3d_add_wait_to_all_queues(queue->device, queue->vk_semaphore, queue->next_signal_value);\n  471 | \n  472 |     /* Keep next_signal always one ahead of the last signaled value */\n  473 |     queue->next_signal_value += 1;\n  474 |     queue->num_bytes_pending = 0;\n  475 |     queue->transfer_count = 0;\n  476 |     queue->command_buffer_index += 1;\n  477 |     queue->command_buffer_index %= VKD3D_MEMORY_TRANSFER_COMMAND_BUFFER_COUNT;\n  478 |     return S_OK;","lines":53,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/memory.c#L426-L478"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"vkd3d_bindless_state_add_binding only ERR-logs (does not return) when the first vkCreateDescriptorSetLayout fails, then continues to use the (undefined/VK_NULL_HANDLE) layout: it calls vkGetDescriptorSetLayoutBindingOffsetEXT / builds copy templates on it, unconditionally does set_count++, and returns. This is API-misuse/UB on the error path.","fix":"On vkCreateDescriptorSetLayout failure, immediately return hresult_from_vk_result(vr) before touching the invalid layout handle; do not increment set_count for a failed set.","locations":[{"ref":"libs/vkd3d/state.c:7537-7591","code":" 7537 |     if ((vr = VK_CALL(vkCreateDescriptorSetLayout(device->vk_device,\n 7538 |             &vk_set_layout_info, NULL, &set_info->vk_set_layout))) < 0)\n 7539 |         ERR(\"Failed to create descriptor set layout, vr %d.\\n\", vr);\n 7540 | \n 7541 |     /* If we're able, we should implement descriptor copies with functions we roll ourselves. */\n 7542 |     if (d3d12_device_uses_descriptor_buffers(device))\n 7543 |     {\n 7544 |         INFO(\"Device supports VK_EXT_descriptor_buffer!\\n\");\n 7545 |         VK_CALL(vkGetDescriptorSetLayoutBindingOffsetEXT(device->vk_device, set_info->vk_set_layout,\n 7546 |                 set_info->binding_index, &desc_offset));\n 7547 |         set_info->host_mapping_offset = desc_offset;\n 7548 |         set_info->host_mapping_descriptor_size = vkd3d_get_descriptor_size_for_binding(device,\n 7549 |                 &vk_set_layout_info, set_info->binding_index);\n 7550 | \n 7551 |         set_info->host_copy_template =\n 7552 |                 vkd3d_bindless_find_copy_template(set_info->host_mapping_descriptor_size);\n 7553 |         set_info->host_copy_template_single =\n 7554 |                 vkd3d_bindless_find_copy_template_single(set_info->host_mapping_descriptor_size);\n 7555 | \n 7556 |         if (!set_info->host_copy_template || !set_info->host_copy_template_single)\n 7557 |         {\n 7558 |             FIXME(\"Couldn't find suitable host copy template.\\n\");\n 7559 |             set_info->host_copy_template = NULL;\n 7560 |             set_info->host_copy_template_single = NULL;\n 7561 |         }\n 7562 |     }\n 7563 |     else\n 7564 |     {\n 7565 |         set_info->host_mapping_offset = 0;\n 7566 |         set_info->host_mapping_descriptor_size = 0;\n 7567 |         set_info->host_copy_template = NULL;\n 7568 |         set_info->host_copy_template_single = NULL;\n 7569 |     }\n 7570 | \n 7571 |     /* If we have descriptor buffers, we don't need host descriptor set layouts at all. We'll just malloc manually. */\n 7572 |     if (!d3d12_device_uses_descriptor_buffers(device))\n 7573 |     {\n 7574 |         vk_binding->descriptorCount = d3d12_max_host_descriptor_count_from_heap_type(device, set_info->heap_type);\n 7575 | \n 7576 |         if (device->bindless_state.flags & VKD3D_BINDLESS_MUTABLE_TYPE)\n 7577 |         {\n 7578 |             /* If we have mutable descriptor extension, we will allocate these descriptors with\n 7579 |              * HOST_BIT and not UPDATE_AFTER_BIND, since that is enough to get threading guarantees. */\n 7580 |             vk_binding_flags[set_info->binding_index] = VK_DESCRIPTOR_BINDING_VARIABLE_DESCRIPTOR_COUNT_BIT;\n 7581 |             vk_set_layout_info.flags = VK_DESCRIPTOR_SET_LAYOUT_CREATE_HOST_ONLY_POOL_BIT_EXT;\n 7582 |         }\n 7583 | \n 7584 |         if ((vr = VK_CALL(vkCreateDescriptorSetLayout(device->vk_device,\n 7585 |                 &vk_set_layout_info, NULL, &set_info->vk_host_set_layout))) < 0)\n 7586 |             ERR(\"Failed to create descriptor set layout, vr %d.\\n\", vr);\n 7587 |     }\n 7588 | \n 7589 |     bindless_state->legacy.set_count++;\n 7590 | \n 7591 |     return hresult_from_vk_result(vr);","lines":55,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/state.c#L7537-L7591"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"d3d12_device_report_fault calls vkd3d_calloc/vkd3d_malloc for addressInfos/vendorBinary/vendorInfo without NULL checks, then passes the pointers to vkGetDeviceFaultInfoEXT which writes into them. On a large count with allocation failure the driver writes through NULL. This is the device-lost diagnostic path, so it can turn a recoverable DEVICE_LOST report into a hard crash.","fix":"Check each allocation for NULL (when its count/size is non-zero) and skip the corresponding output array, or abort the fault dump gracefully.","locations":[{"ref":"libs/vkd3d/device.c:10917-10921","code":"10917 |     fault_info.pAddressInfos = vkd3d_calloc(fault_counts.addressInfoCount, sizeof(*fault_info.pAddressInfos));\n10918 |     fault_info.pVendorBinaryData = vkd3d_malloc(fault_counts.vendorBinarySize);\n10919 |     fault_info.pVendorInfos = vkd3d_calloc(fault_counts.vendorInfoCount, sizeof(*fault_info.pVendorInfos));\n10920 | \n10921 |     vr = VK_CALL(vkGetDeviceFaultInfoEXT(device->vk_device, &fault_counts, &fault_info));","lines":5,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/device.c#L10917-L10921"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"GetCudaMergedTextureSamplerObject leaves image_index/sampler_index at their initial 0 when params->texDesc / smpDesc are 0 (lookup skipped), so the `image_index == UINT32_MAX` guard never fires and a stale index 0 is passed to vkGetDeviceCombinedImageSamplerIndexNVX, silently using an unspecified descriptor.","fix":"Track whether each lookup actually ran and reject (E_INVALIDARG) when a required descriptor handle was not provided, rather than defaulting to index 0.","locations":[{"ref":"libs/vkd3d/device_vkd3d_ext.c:515-551","code":"  515 |     uint32_t image_index = 0, sampler_index = 0;\n  516 | \n  517 |     TRACE(\"iface %p, tex_desc %zu, smp_desc %zu.\\n\",\n  518 |             iface, (size_t)params->texDesc, (size_t)params->smpDesc);\n  519 | \n  520 |     if (!device->vk_info.supports_cubin_64bit)\n  521 |         return E_NOTIMPL;\n  522 | \n  523 |     if (params->pNext)\n  524 |     {\n  525 |         FIXME(\"pNext not supported.\\n\");\n  526 |         params->pNext = NULL;\n  527 |     }\n  528 | \n  529 |     if (d3d12_device_use_descriptor_heap(device))\n  530 |     {\n  531 |         if (params->texDesc)\n  532 |         {\n  533 |             image_index = d3d12_device_find_shader_visible_descriptor_heap_offset(device, params->texDesc,\n  534 |                 D3D12_DESCRIPTOR_HEAP_TYPE_CBV_SRV_UAV);\n  535 |         }\n  536 | \n  537 |         if (params->smpDesc)\n  538 |         {\n  539 |             sampler_index = d3d12_device_find_shader_visible_descriptor_heap_offset(device, params->smpDesc,\n  540 |                 D3D12_DESCRIPTOR_HEAP_TYPE_SAMPLER);\n  541 |         }\n  542 | \n  543 |         if (image_index == UINT32_MAX || sampler_index == UINT32_MAX)\n  544 |         {\n  545 |             FIXME(\"Could not find heap index. CPU handles must point to SHADER_VISIBLE heaps to have any meaning.\\n\");\n  546 |             return E_INVALIDARG;\n  547 |         }\n  548 | \n  549 |         params->textureHandle = VK_CALL(vkGetDeviceCombinedImageSamplerIndexNVX(\n  550 |                 device->vk_device, image_index, sampler_index));\n  551 |         return S_OK;","lines":37,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/device_vkd3d_ext.c#L515-L551"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"In vkd3d_clear_uav_ops_init, vr is initialized to VK_SUCCESS and assigned only inside the loop when !use_heap. When use_heap is true that branch is skipped, so the subsequent `if (vr < 0)` check tests a value that may be stale from a prior iteration. Currently benign but fragile.","fix":"Reset vr = VK_SUCCESS at the top of each iteration, or guard the `if (vr < 0)` check with the same !use_heap condition.","locations":[{"ref":"libs/vkd3d/meta.c:528-535","code":"  528 |         if (!use_heap)\n  529 |             vr = vkd3d_meta_create_descriptor_set_layout(device, 1, &set_binding, true, set_layouts[i].set_layout);\n  530 | \n  531 |         if (vr < 0)\n  532 |         {\n  533 |             ERR(\"Failed to create descriptor set layout %u, vr %d.\\n\", i, vr);\n  534 |             goto fail;\n  535 |         }","lines":8,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/meta.c#L528-L535"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"On compute-pipeline creation failure the ERR logs the local `hr`, which is only assigned inside conditional branches (identifier path / fallback path). If the first vkCreateComputePipelines fails before either branch runs, `hr` was never written and the printed value is garbage/UB. The function correctly returns hresult_from_vk_result(vr); only the diagnostic is wrong.","fix":"Log `vr` (the real result) instead of `(int)hr`.","locations":[{"ref":"libs/vkd3d/state.c:3677-3683","code":" 3677 |     if (vr < 0)\n 3678 |     {\n 3679 |         ERR(\"Failed to create Vulkan compute pipeline, hr %#x.\\n\", (int)hr);\n 3680 |         ERR(\"  Root signature: %\"PRIx64\"\\n\", state->root_signature->pso_compatibility_hash);\n 3681 |         ERR(\"  Shader: %\"PRIx64\".\\n\", state->compute.code.meta.hash);\n 3682 |         return hresult_from_vk_result(vr);\n 3683 |     }","lines":7,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/state.c#L3677-L3683"}]},
{"id":"UAF_1","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"medium","description":"vkd3d_va_map_query_descriptor_heap_offset reads the mappings base pointer (resource_mappings / sampler_mappings) BEFORE acquiring va_map->mutex, then dereferences it after taking the lock. A concurrent vkd3d_va_map_insert_descriptor_heap holds the same mutex and may vkd3d_array_reserve -> realloc the array, freeing the old backing store. The reader then indexes a stale (freed) pointer — use-after-free / OOB read. The count is read under the lock but the base pointer is not, defeating the locking.","fix":"Read the `mappings` base pointer inside the critical section (after pthread_mutex_lock), together with `count`.","locations":[{"ref":"libs/vkd3d/va_map.c:463-489","code":"  463 | size_t vkd3d_va_map_query_descriptor_heap_offset(struct vkd3d_va_map *va_map,\n  464 |         uintptr_t va, D3D12_DESCRIPTOR_HEAP_TYPE type)\n  465 | {\n  466 |     const struct vkd3d_descriptor_heap_mapping *mappings = type == D3D12_DESCRIPTOR_HEAP_TYPE_CBV_SRV_UAV\n  467 |             ? va_map->resource_mappings : va_map->sampler_mappings;\n  468 |     size_t ret = SIZE_MAX;\n  469 |     size_t count;\n  470 |     size_t i;\n  471 | \n  472 |     pthread_mutex_lock(&va_map->mutex);\n  473 | \n  474 |     count = type == D3D12_DESCRIPTOR_HEAP_TYPE_CBV_SRV_UAV ?\n  475 |             va_map->resource_mappings_count : va_map->sampler_mappings_count;\n  476 | \n  477 |     /* We don't expect there to be that many shader visible descriptor heaps live on the device,\n  478 |      * so a simple linear search is perfectly fine. */\n  479 |     for (i = 0; i < count; i++)\n  480 |     {\n  481 |         if (va >= mappings[i].va && va < mappings[i].va + mappings[i].range)\n  482 |         {\n  483 |             ret = va - mappings[i].va;\n  484 |             break;\n  485 |         }\n  486 |     }\n  487 | \n  488 |     pthread_mutex_unlock(&va_map->mutex);\n  489 |     return ret;","lines":27,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/va_map.c#L463-L489"}]},
{"id":"RACE_1","type":"race_condition","type_label":"Race Condition","severity":"high","difficulty":"hard","description":"vkd3d_va_map_insert/_remove write each block entry's {va, resource} as two independent relaxed atomic stores, and vkd3d_va_map_deref_mutable reads them with two separate relaxed loads. A reader concurrent with insert/remove can observe a torn pair — a non-zero va with a stale/NULL resource, or a fresh resource with an old va — yielding a wrong or NULL resource for a valid VA. The relaxed ordering provides no cross-field atomicity.","fix":"Update {va,resource} as a single atomic unit (double-width atomic or seqlock), or use release/acquire and re-validate va after loading resource (retry on change).","locations":[{"ref":"libs/vkd3d/va_map.c:142-151","code":"  142 |             if (block_va < min_va)\n  143 |             {\n  144 |                 vkd3d_atomic_uint64_store_explicit(&block->r.va, min_va, vkd3d_memory_order_relaxed);\n  145 |                 vkd3d_atomic_ptr_store_explicit(&block->r.resource, resource, vkd3d_memory_order_relaxed);\n  146 |             }\n  147 |             else\n  148 |             {\n  149 |                 vkd3d_atomic_uint64_store_explicit(&block->l.va, max_va, vkd3d_memory_order_relaxed);\n  150 |                 vkd3d_atomic_ptr_store_explicit(&block->l.resource, resource, vkd3d_memory_order_relaxed);\n  151 |             }","lines":10,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/va_map.c#L142-L151"},{"ref":"libs/vkd3d/va_map.c:192-201","code":"  192 |             if (vkd3d_atomic_ptr_load_explicit(&block->l.resource, vkd3d_memory_order_relaxed) == resource)\n  193 |             {\n  194 |                 vkd3d_atomic_uint64_store_explicit(&block->l.va, 0, vkd3d_memory_order_relaxed);\n  195 |                 vkd3d_atomic_ptr_store_explicit(&block->l.resource, NULL, vkd3d_memory_order_relaxed);\n  196 |             }\n  197 |             else if (vkd3d_atomic_ptr_load_explicit(&block->r.resource, vkd3d_memory_order_relaxed) == resource)\n  198 |             {\n  199 |                 vkd3d_atomic_uint64_store_explicit(&block->r.va, 0, vkd3d_memory_order_relaxed);\n  200 |                 vkd3d_atomic_ptr_store_explicit(&block->r.resource, NULL, vkd3d_memory_order_relaxed);\n  201 |             }","lines":10,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/va_map.c#L192-L201"},{"ref":"libs/vkd3d/va_map.c:222-243","code":"  222 | static struct vkd3d_unique_resource *vkd3d_va_map_deref_mutable(struct vkd3d_va_map *va_map, VkDeviceAddress va)\n  223 | {\n  224 |     struct vkd3d_va_block *block = vkd3d_va_map_find_block(va_map, va);\n  225 |     struct vkd3d_unique_resource *resource = NULL;\n  226 | \n  227 |     if (block)\n  228 |     {\n  229 |         if (va < vkd3d_atomic_uint64_load_explicit(&block->l.va, vkd3d_memory_order_relaxed))\n  230 |             resource = vkd3d_atomic_ptr_load_explicit(&block->l.resource, vkd3d_memory_order_relaxed);\n  231 |         else if (va >= vkd3d_atomic_uint64_load_explicit(&block->r.va, vkd3d_memory_order_relaxed))\n  232 |             resource = vkd3d_atomic_ptr_load_explicit(&block->r.resource, vkd3d_memory_order_relaxed);\n  233 |     }\n  234 | \n  235 |     if (!resource)\n  236 |     {\n  237 |         pthread_mutex_lock(&va_map->mutex);\n  238 |         resource = vkd3d_va_map_find_small_entry(va_map, va, NULL);\n  239 |         pthread_mutex_unlock(&va_map->mutex);\n  240 |     }\n  241 | \n  242 |     return resource;\n  243 | }","lines":22,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/va_map.c#L222-L243"}]},
{"id":"RACE_2","type":"race_condition","type_label":"Race Condition","severity":"medium","difficulty":"medium","description":"vkd3d_memory_transfer_queue_wait_allocation reads allocation->clear_semaphore_value without synchronization, while vkd3d_memory_transfer_queue_fill_allocation writes it under queue->mutex. For a chunk allocation whose clear value is updated concurrently this can read a stale value and, combined with the later wait_value adjustment, under-wait and let the GPU still be clearing freed memory.","fix":"Read allocation->clear_semaphore_value under queue->mutex (or via an atomic paired with the store in fill_allocation) before deciding whether to wait.","locations":[{"ref":"libs/vkd3d/memory.c:538-557","code":"  538 |     else if (allocation->resource.vk_buffer)\n  539 |     {\n  540 |         pthread_mutex_lock(&queue->mutex);\n  541 |         allocation->clear_semaphore_value = queue->next_signal_value;\n  542 | \n  543 |         if (allocation->chunk)\n  544 |             allocation->chunk->allocation.clear_semaphore_value = queue->next_signal_value;\n  545 | \n  546 |         memset(&transfer, 0, sizeof(transfer));\n  547 |         transfer.op = value != 0 ?\n  548 |                 VKD3D_MEMORY_TRANSFER_OP_DEBUG_FILL_ALLOCATION :\n  549 |                 VKD3D_MEMORY_TRANSFER_OP_CLEAR_ALLOCATION;\n  550 |         transfer.vk_buffer = allocation->resource.vk_buffer;\n  551 |         transfer.vk_buffer_offset = allocation->offset;\n  552 |         transfer.vk_buffer_size = allocation->resource.size;\n  553 |         transfer.fill_value = value * 0x01010101u;\n  554 | \n  555 |         vkd3d_memory_transfer_queue_execute_transfer_locked(queue, &transfer);\n  556 |         pthread_mutex_unlock(&queue->mutex);\n  557 |     }","lines":20,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/memory.c#L538-L557"},{"ref":"libs/vkd3d/memory.c:622-671","code":"  622 | static void vkd3d_memory_transfer_queue_wait_allocation(struct vkd3d_memory_transfer_queue *queue,\n  623 |         const struct vkd3d_memory_allocation *allocation)\n  624 | {\n  625 |     uint64_t wait_value = allocation->clear_semaphore_value;\n  626 |     size_t i;\n  627 | \n  628 |     /* If the clear semaphore has been signaled to the expected value,\n  629 |      * the GPU is already done clearing the allocation, and it cannot\n  630 |      * be in the clear queue either, so there is nothing to do. */\n  631 |     if (vkd3d_memory_transfer_queue_wait_semaphore(queue, wait_value, 0))\n  632 |         return;\n  633 | \n  634 |     /* If the allocation is still in the queue, the GPU has not started\n  635 |      * using it yet so we can remove it from the queue and exit. */\n  636 |     pthread_mutex_lock(&queue->mutex);\n  637 | \n  638 |     for (i = 0; i < queue->transfer_count; i++)\n  639 |     {\n  640 |         if ((queue->transfers[i].op == VKD3D_MEMORY_TRANSFER_OP_CLEAR_ALLOCATION ||\n  641 |                 queue->transfers[i].op == VKD3D_MEMORY_TRANSFER_OP_DEBUG_FILL_ALLOCATION) &&\n  642 |                 queue->transfers[i].vk_buffer == allocation->resource.vk_buffer &&\n  643 |                 queue->transfers[i].vk_buffer_offset == allocation->offset &&\n  644 |                 queue->transfers[i].vk_buffer_size == allocation->resource.size)\n  645 |         {\n  646 |             queue->transfers[i] = queue->transfers[--queue->transfer_count];\n  647 |             queue->num_bytes_pending -= allocation->resource.size;\n  648 |             pthread_mutex_unlock(&queue->mutex);\n  649 |             return;\n  650 |         }\n  651 |     }\n  652 | \n  653 |     /* If this is a chunk and a suballocation from it had been immediately\n  654 |      * freed, it is possible that the suballocation got removed from the\n  655 |      * clear queue so that the chunk's wait value never gets signaled. Wait\n  656 |      * for the last signaled value in that case. */\n  657 |     if (wait_value == queue->next_signal_value)\n  658 |         wait_value = queue->next_signal_value - 1;\n  659 | \n  660 |     pthread_mutex_unlock(&queue->mutex);\n  661 | \n  662 |     /* If this allocation was suballocated from a chunk, we will wait\n  663 |      * on the semaphore when the parent chunk itself gets destroyed. */\n  664 |     if (allocation->chunk)\n  665 |         return;\n  666 | \n  667 |     /* Otherwise, we actually have to wait for the GPU. */\n  668 |     WARN(\"Waiting for GPU to clear allocation %p.\\n\", allocation);\n  669 | \n  670 |     vkd3d_memory_transfer_queue_wait_semaphore(queue, wait_value, UINT64_MAX);\n  671 | }","lines":50,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/memory.c#L622-L671"}]},
{"id":"RACE_3","type":"race_condition","type_label":"Race Condition","severity":"low","difficulty":"medium","description":"vkd3d_breadcrumb_tracer_allocate_command_list appends to allocator->breadcrumb_context_indices (vkd3d_array_reserve + write) outside tracer->lock and without any allocator-side lock; tracer->lock only protects trace_contexts. Concurrent breadcrumb-context allocation for command lists from the same allocator races. (Command allocators are generally single-thread per D3D12 rules, limiting impact.)","fix":"Document/enforce exclusive caller access to the allocator, or protect the allocator array with an appropriate lock.","locations":[{"ref":"libs/vkd3d/breadcrumbs.c:281-284","code":"  281 |     vkd3d_array_reserve((void**)&allocator->breadcrumb_context_indices, &allocator->breadcrumb_context_index_size,\n  282 |             allocator->breadcrumb_context_index_count + 1,\n  283 |             sizeof(*allocator->breadcrumb_context_indices));\n  284 |     allocator->breadcrumb_context_indices[allocator->breadcrumb_context_index_count++] = index;","lines":4,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/breadcrumbs.c#L281-L284"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"The Win32 file-mapping path tests CreateFileMappingA's result with `== INVALID_HANDLE_VALUE`, but that API returns NULL on failure (not INVALID_HANDLE_VALUE). On failure the NULL handle passes the check, execution falls through to MapViewOfFile(NULL, ...) and then CloseHandle(NULL); the real error is swallowed.","fix":"Test `if (!file_mapping) goto out;` and only CloseHandle(file_mapping) when non-NULL.","locations":[{"ref":"libs/vkd3d-common/file_utils.c:145-151","code":"  145 |     file_mapping = CreateFileMappingA(handle, NULL, PAGE_READONLY, 0, 0, NULL);\n  146 |     if (file_mapping == INVALID_HANDLE_VALUE)\n  147 |         goto out;\n  148 | \n  149 |     file->mapped = MapViewOfFile(file_mapping, FILE_MAP_READ, 0, 0, file->mapped_size);\n  150 |     CloseHandle(file_mapping);\n  151 |     file_mapping = INVALID_HANDLE_VALUE;","lines":7,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d-common/file_utils.c#L145-L151"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"very_easy","description":"vkd3d_init_profiling mmaps the profiling region but checks the result with `if (!mapped_blocks)`. mmap returns MAP_FAILED ((void*)-1) on failure, never NULL, so on a real failure the sentinel passes the NULL check: mapped_blocks is left as -1, the fd is leaked, vkd3d_uses_profiling() returns true, and a later vkd3d_profiling_notify_work dereferences (void*)-1 -> crash. file_utils.c correctly checks against MAP_FAILED.","fix":"Check `if (mapped_blocks == MAP_FAILED) { mapped_blocks = NULL; close(profiling_fd); return; }`.","locations":[{"ref":"libs/vkd3d-common/profiling.c:108-118","code":"  108 |         mapped_blocks = mmap(NULL, VKD3D_MAX_PROFILING_REGIONS * sizeof(*mapped_blocks),\n  109 |                 PROT_READ | PROT_WRITE, MAP_SHARED, profiling_fd, 0);\n  110 |         if (!mapped_blocks)\n  111 |         {\n  112 |             ERR(\"Failed to map block.\\n\");\n  113 |             close(profiling_fd);\n  114 |             return;\n  115 |         }\n  116 |         memset(mapped_blocks, 0, VKD3D_MAX_PROFILING_REGIONS * sizeof(*mapped_blocks));\n  117 |         close(profiling_fd);\n  118 |     }","lines":11,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d-common/profiling.c#L108-L118"}]},

{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"In vkd3d_instance_deduce_config_flags_from_environment the INFO \"shader_cache is used, global_pipeline_cache is enforced.\" is printed unconditionally inside the `if (!APP_CACHE_ONLY)` branch even when VKD3D_SHADER_CACHE_PATH is unset (the default), wrongly stating the shader cache \"is used\". The adjacent comment also does not match the branch.","fix":"Reword to reflect that global pipeline cache is enabled unless app-cache-only is requested, and only log when meaningful.","locations":[{"ref":"libs/vkd3d/device_workarounds.c:817-829","code":"  817 |     vkd3d_get_env_var(\"VKD3D_SHADER_CACHE_PATH\", env, sizeof(env));\n  818 |     if (strcmp(env, \"0\") == 0)\n  819 |     {\n  820 |         INFO(\"Shader cache is explicitly disabled, relying solely on application caches.\\n\");\n  821 |         vkd3d_config_flag_global_add(VKD3D_CONFIG_FLAG(PIPELINE_LIBRARY_APP_CACHE_ONLY));\n  822 |     }\n  823 | \n  824 |     /* If we're using a global shader cache, it's meaningless to use PSO caches. */\n  825 |     if (!VKD3D_CONFIG_FLAG_IS_SET(PIPELINE_LIBRARY_APP_CACHE_ONLY))\n  826 |     {\n  827 |         INFO(\"shader_cache is used, global_pipeline_cache is enforced.\\n\");\n  828 |         vkd3d_config_flag_global_add(VKD3D_CONFIG_FLAG(GLOBAL_PIPELINE_CACHE));\n  829 |     }","lines":13,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/device_workarounds.c#L817-L829"}]},

{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"d3d12_device_caps_init_feature_options1 unconditionally emits FIXME(\"TotalLaneCount ... may be inaccurate.\") on every device creation, even on the AMD/NV paths where the value is computed from real properties — log noise on the device-init path; the FIXME is only meaningful for the fallback else branch.","fix":"Move the FIXME into the fallback else branch only, or downgrade to TRACE.","locations":[{"ref":"libs/vkd3d/device.c:9254-9272","code":" 9254 |         options1->TotalLaneCount = compute_units * 64;\n 9255 |     }\n 9256 |     else if (device->vk_info.NV_shader_sm_builtins)\n 9257 |     {\n 9258 |         /* Approximation, since we cannot query the number of lanes\n 9259 |          * per SM. Appears to be correct on Pascal and Turing. */\n 9260 |         const VkPhysicalDeviceShaderSMBuiltinsPropertiesNV *nv = &device->device_info.shader_sm_builtins_properties;\n 9261 |         options1->TotalLaneCount = nv->shaderSMCount * nv->shaderWarpsPerSM * 2;\n 9262 |     }\n 9263 |     else\n 9264 |     {\n 9265 |         options1->TotalLaneCount = 32 * device->device_info.vulkan_1_1_properties.subgroupSize;\n 9266 |         WARN(\"No device info available for TotalLaneCount = %u.\\n\", options1->TotalLaneCount);\n 9267 |     }\n 9268 | \n 9269 |     options1->ExpandedComputeResourceStates = TRUE;\n 9270 |     options1->Int64ShaderOps = device->device_info.features2.features.shaderInt64;\n 9271 | \n 9272 |     FIXME(\"TotalLaneCount = %u, may be inaccurate.\\n\", options1->TotalLaneCount);","lines":19,"link":"https://github.com/HansKristian-Work/vkd3d-proton/blob/2a38e7991f851e85151c104504d5e343530d1523/libs/vkd3d/device.c#L9254-L9272"}]},

(function(){
'use strict';

// Data
const FINDINGS     = JSON.parse(document.getElementById('D').textContent);
const PROJECT_INFO = JSON.parse(document.getElementById('PI').textContent);
const SEVS     = ['critical','high','medium','low','negligible'];
const STATUSES = ['open','fixed','wont-fix','false-positive'];
const ALL_TYPES = [...new Set(FINDINGS.map(f => f.type))].sort(cmpTypes);
// Build lookup map for O(1) access
const FINDING_BY_ID = new Map(FINDINGS.map(f => [f.id, f]));
// Only severities actually present in the report — the filter bar hides the rest.
const PRESENT_SEVS = SEVS.filter(s => FINDINGS.some(f => (f.severity || 'medium') === s));
// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};
const PRESENT_DIFFS = DIFFICULTY_ORDER.filter(d => FINDINGS.some(f => f.difficulty === d));
const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', searchScope: 'all', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),
};
const statuses = {};

// Persistence
function loadStatuses() {
  try { Object.assign(statuses, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}
}
function saveStatuses() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    if (S.searchScope !== 'all') p.set('qs', S.searchScope);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('qs'))  { S.searchScope = p.get('qs'); }
  document.getElementById('search-scope').classList.toggle('active', S.searchScope === 'locations');
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }
function isCustom(t)  { return String(t).toLowerCase() === 'custom'; }
function typeCls(t)   { return 'type-badge' + (isCustom(t) ? ' custom-type' : ''); }
// 'custom' findings are the user's own externally-sourced ones; pin them first
// everywhere types are listed so they never blend into the audit's own categories.
function cmpTypes(a, b) {
  if (isCustom(a) !== isCustom(b)) return isCustom(a) ? -1 : 1;
  return String(a).localeCompare(String(b));
}

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort(cmpTypes);

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build a [project] header block from embedded PROJECT_INFO, so the exported
// findings.toml is self-contained (doesn't depend on a sibling project-info.toml
// that a second, separately-triggered download could silently fail to save).
// '' when there is no project info at all.
function buildProjectToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = PROJECT_INFO || {};
  if (!Object.keys(pi).length) return '';
  const lines = ['[project]'];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n\n';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    // Pin the id so re-rendering this export - or filtering it down later - can't
    // renumber findings that were already referenced by id elsewhere.
    if (f.id && f.id !== '?') lns.push(pad('id') + '= ' + tomlStr(f.id));
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return buildProjectToml() + chunks.join('\n\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'folder') {
    if (!f.locations.length) return '(no location)';
    const path = f.locations[0].ref.replace(/:.*/,'');
    const idx = path.lastIndexOf('/');
    return idx === -1 ? '(root)' : path.slice(0, idx);
  }
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystacks per finding (cleared on full re-render).
// Two variants: everything (default), and file/folder paths only - for when a
// search term (e.g. a directory name like 'dlls/abc') also happens to appear
// inside description/fix prose and you only want path matches.
const _hay = new Map();
const _hayLoc = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}
function hayLocOf(f) {
  if (!_hayLoc.has(f.id)) {
    _hayLoc.set(f.id, f.locations.map(l => l.ref).join(' ').toLowerCase());
  }
  return _hayLoc.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (S.searchScope === 'locations') {
      if (!hayLocOf(f).includes(q)) return false;
    } else if (!hayOf(f).includes(q) && !st.includes(q)) {
      return false;
    }
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  if (S.groupBy === 'type') return [...keys].sort(cmpTypes);
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge ' + typeCls(f.type) + '" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge ' + typeCls(t) + '" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  _hayLoc.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    // Single download (was two) - a second auto-triggered download is commonly
    // blocked by the browser unless the user explicitly allows it, which silently
    // drops project-info.toml. Embedding [project] in findings.toml itself avoids
    // that failure mode entirely.
    downloadText(buildFindingsToml(), 'findings.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});
document.getElementById('search-scope').addEventListener('click', e => {
  S.searchScope = S.searchScope === 'locations' ? 'all' : 'locations';
  e.currentTarget.classList.toggle('active', S.searchScope === 'locations');
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
