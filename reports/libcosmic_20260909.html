 },\n  177 |                 text_color: container.component.on.into(),\n  178 |             },\n  179 |             hover: super::hover(cosmic, &active, 0.3),\n  180 |             pressed: super::hover(cosmic, &active, 0.25),\n  181 |             active,\n  182 |             ..Default::default()\n  183 |         }\n  184 |     }","lines":32,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/theme/style/segmented_button.rs#L153-L184"},{"ref":"src/theme/style/segmented_button.rs:261-279","code":"  261 |     pub fn tab_bar(cosmic: &cosmic_theme::Theme, container: &Container) -> Appearance {\n  262 |         let active = tab_bar_active(cosmic);\n  263 |         Appearance {\n  264 |             active_width: 4.0,\n  265 |             border: Border {\n  266 |                 radius: cosmic.corner_radii.radius_0.into(),\n  267 |                 ..Default::default()\n  268 |             },\n  269 |             inactive: ItemStatusAppearance {\n  270 |                 background: None,\n  271 |                 text_color: container.component.on.into(),\n  272 |                 ..active\n  273 |             },\n  274 |             hover: super::hover(cosmic, &active, 0.3),\n  275 |             pressed: super::hover(cosmic, &active, 0.25),\n  276 |             active,\n  277 |             ..Default::default()\n  278 |         }\n  279 |     }","lines":19,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/theme/style/segmented_button.rs#L261-L279"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`CalendarModel::show_prev_month`/`show_next_month` add/subtract `1.month()` directly to/from `self.visible` using jiff's date arithmetic, which saturates the day-of-month to the target month's last valid day when it overflows (e.g. Jan 31 + 1 month = Feb 28). Because each navigation step re-applies the saturated result rather than tracking the originally selected day, repeatedly clicking 'next month' starting from a 31st-of-the-month date causes the visible day to drift downward over time (Jan 31 -> Feb 28 -> Mar 28 instead of Mar 31), a well-known date-arithmetic pitfall that is user-visible in the calendar's month navigation.","fix":"Track the originally selected day-of-month separately (e.g. keep the day from `self.selected` or an anchor date) and reconstruct `self.visible` as `first_of_month().with().day(anchor_day)` (clamped to the new month's length) each time, instead of chaining `checked_add`/`checked_sub` of `1.month()` onto the already-saturated previous `visible` value.","locations":[{"ref":"src/widget/calendar.rs:59-65","code":"   59 |     pub fn show_prev_month(&mut self) {\n   60 |         self.visible = self.visible.checked_sub(1.month()).expect(\"valid date\");\n   61 |     }\n   62 | \n   63 |     pub fn show_next_month(&mut self) {\n   64 |         self.visible = self.visible.checked_add(1.month()).expect(\"valid date\");\n   65 |     }","lines":7,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/calendar.rs#L59-L65"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In ContextMenu::update, the condition `} else if !was_open && right_button_released(event) || (touch_lifted(event)) || left_button_released(event) {` relies on `&&` binding tighter than `||`, so it actually parses as `(!was_open && right_button_released(event)) || touch_lifted(event) || left_button_released(event)`. The `!was_open` guard, which is clearly intended (mirroring the pattern used a few lines above at line 412-414) to apply to all three branches, only applies to the first one. Today this happens to be harmless because the earlier `was_open`-setting block only matches button-press/key-press events while this block matches button-release/touch-lifted events (mutually exclusive event kinds for the same `event` value), but the code reads as if `!was_open` guards all three and will silently break (causing this block to run a second time on the same event after state was already reset by the block above) the moment someone adds an event kind that overlaps both blocks.","fix":"Parenthesize the intended grouping explicitly: `} else if !was_open && (right_button_released(event) || touch_lifted(event) || left_button_released(event)) {`.","locations":[{"ref":"src/widget/context_menu.rs:430-433","code":"  430 |             } else if !was_open && right_button_released(event)\n  431 |                 || (touch_lifted(event))\n  432 |                 || left_button_released(event)\n  433 |             {","lines":4,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/context_menu.rs#L430-L433"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Even when lists is non-zero, the separator-count math `(lists - 1)` is wrong: `Model::elements()` appends a `Separator` after every list's options (`.chain(std::iter::once(OptionElement::Separator))` runs once per list, including the last one), so the true number of separators rendered/hovered is `lists`, not `lists - 1`. InnerList::layout therefore undercounts the intrinsic content height by one separator's height, which can cause the last item(s) to be clipped or the overlay to be sized too small relative to what visible_options/element_heights will actually iterate over (those two functions correctly account for one separator per list).","fix":"Change the separators count to `lists as f32` (one separator per list) to match what `elements()`/`element_heights()` actually produce, e.g. `let separators = ((vertical_padding / 2.0) + 1.0) * lists as f32;`.","locations":[{"ref":"src/widget/dropdown/multi/menu.rs:304-323","code":"  304 |         let lists = self.options.lists.len();\n  305 |         let (descriptions, options) = self.options.lists.iter().fold((0, 0), |acc, l| {\n  306 |             (\n  307 |                 acc.0 + i32::from(l.description.is_some()),\n  308 |                 acc.1 + l.options.len(),\n  309 |             )\n  310 |         });\n  311 | \n  312 |         let vertical_padding = self.padding.y();\n  313 |         let text_line_height = f32::from(text_line_height);\n  314 | \n  315 |         let size = {\n  316 |             #[allow(clippy::cast_precision_loss)]\n  317 |             let intrinsic = Size::new(0.0, {\n  318 |                 let text = vertical_padding + text_line_height;\n  319 |                 let separators = ((vertical_padding / 2.0) + 1.0) * (lists - 1) as f32;\n  320 |                 let descriptions = (text + 4.0) * descriptions as f32;\n  321 |                 let options = text * options as f32;\n  322 |                 separators + descriptions + options\n  323 |             });","lines":20,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/dropdown/multi/menu.rs#L304-L323"},{"ref":"src/widget/dropdown/multi/menu.rs:683-698","code":"  683 | impl<S, Message> Model<S, Message> {\n  684 |     pub(super) fn elements(&self) -> impl Iterator<Item = OptionElement<'_, S, Message>> + '_ {\n  685 |         self.lists.iter().flat_map(|list| {\n  686 |             let description = list\n  687 |                 .description\n  688 |                 .as_ref()\n  689 |                 .into_iter()\n  690 |                 .map(OptionElement::Description);\n  691 | \n  692 |             let options = list.options.iter().map(OptionElement::Option);\n  693 | \n  694 |             description\n  695 |                 .chain(options)\n  696 |                 .chain(std::iter::once(OptionElement::Separator))\n  697 |         })\n  698 |     }","lines":16,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/dropdown/multi/menu.rs#L683-L698"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `flex_row::layout::resolve`, every child unconditionally pushes a layout `Node` into `nodes` (line 69), but the corresponding taffy leaf is only pushed into `leafs` on success; on `taffy_tree.new_leaf` failure the loop does `continue` and skips the `leafs.push`. After any single failure, `leafs.len() < nodes.len()`, so the final `leafs.into_iter().zip(items.iter_mut()).zip(nodes.iter_mut()).zip(tree)` chain (driven by the shorter `leafs` iterator) silently misaligns every subsequent leaf with the wrong item/node/tree triple, corrupting positions for all remaining children in the row, not just the one that failed.","fix":"Keep `leafs` and `nodes` in lock-step, e.g. push a placeholder/sentinel leaf id on failure (or skip pushing to `nodes` too and track failures via index so the final zip stays aligned), or collect failures separately and filter all three vectors consistently before the final zip.","locations":[{"ref":"src/widget/flex_row/layout.rs:64-163","code":"   64 |     for (child, tree) in items.iter_mut().zip(tree.iter_mut()) {\n   65 |         let child_widget = child.as_widget_mut();\n   66 |         let child_node = child_widget.layout(tree, renderer, limits);\n   67 |         let size = child_node.size();\n   68 | \n   69 |         nodes.push(child_node);\n   70 | \n   71 |         let c_size = child_widget.size();\n   72 |         let (width, flex_grow, justify_self) = match c_size.width {\n   73 |             Length::Fill | Length::FillPortion(_) => {\n   74 |                 (Dimension::auto(), 1.0, Some(AlignItems::Stretch))\n   75 |             }\n   76 |             _ => (length(size.width), 0.0, None),\n   77 |         };\n   78 | \n   79 |         let child_style = Style {\n   80 |             flex_grow,\n   81 | \n   82 |             min_size: taffy::geometry::Size {\n   83 |                 width: match min_item_width {\n   84 |                     Some(width) => length(size.width.min(width)),\n   85 |                     None => Dimension::auto(),\n   86 |                 },\n   87 |                 height: Dimension::auto(),\n   88 |             },\n   89 | \n   90 |             size: taffy::geometry::Size {\n   91 |                 width,\n   92 |                 height: match c_size.height {\n   93 |                     Length::Fill | Length::FillPortion(_) => Dimension::auto(),\n   94 |                     _ => length(size.height),\n   95 |                 },\n   96 |             },\n   97 | \n   98 |             justify_self,\n   99 | \n  100 |             ..Style::default()\n  101 |         };\n  102 | \n  103 |         leafs.push(match taffy_tree.new_leaf(child_style) {\n  104 |             Ok(leaf) => leaf,\n  105 |             Err(why) => {\n  106 |                 tracing::error!(?why, \"failed to add child element to flex row\");\n  107 |                 continue;\n  108 |             }\n  109 |         });\n  110 |     }\n  111 | \n  112 |     let root = match taffy_tree.new_with_children(style, &leafs) {\n  113 |         Ok(root) => root,\n  114 |         Err(why) => {\n  115 |             tracing::error!(?why, \"flex row style is invalid\");\n  116 |             return Node::new(Size::ZERO);\n  117 |         }\n  118 |     };\n  119 | \n  120 |     if let Err(why) = taffy_tree.compute_layout(\n  121 |         root,\n  122 |         taffy::geometry::Size {\n  123 |             width: length(max_size.width),\n  124 |             height: length(max_size.height),\n  125 |         },\n  126 |     ) {\n  127 |         tracing::error!(?why, \"flex row layout invalid\");\n  128 |         return Node::new(Size::ZERO);\n  129 |     }\n  130 | \n  131 |     let flex_layout = match taffy_tree.layout(root) {\n  132 |         Ok(layout) => layout,\n  133 |         Err(why) => {\n  134 |             tracing::error!(?why, \"cannot get flex row layout\");\n  135 |             return Nod {"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `grid::layout::resolve`, when `taffy.new_leaf(...)` fails the code logs an error and does `continue` (skipping the push to `leafs`), but the corresponding `child_node` was already unconditionally pushed to `nodes` on every iteration (line 50) before the leaf is created. This means `leafs.len()` can become shorter than `items.len()`/`nodes.len()`/`tree.len()` after a failure. The final assembly loop zips `leafs.into_iter().zip(items.iter_mut()).zip(nodes.iter_mut()).zip(tree)`, which silently realigns each subsequent successful leaf with the WRONG item/node/tree (shifted by one for every prior failure), corrupting layout for all grid children after the first failure.","fix":"Track failures with a parallel `Option<LeafId>` per item (or filter items/nodes/tree together with leafs) instead of relying on positional zip after a partial skip, e.g. collect `Vec<Option<NodeId>>` of the same length as items and zip on index, skipping `None` entries explicitly rather than shrinking only `leafs`.","locations":[{"ref":"src/widget/grid/layout.rs:39-96","code":"   39 |     // Attach widgets as child nodes.\n   40 |     for ((child, assignment), tree) in items\n   41 |         .iter_mut()\n   42 |         .zip(assignments.iter())\n   43 |         .zip(tree.iter_mut())\n   44 |     {\n   45 |         // Calculate the dimensions of the item.\n   46 |         let child_widget = child.as_widget_mut();\n   47 |         let child_node = child_widget.layout(tree, renderer, limits);\n   48 |         let size = child_node.size();\n   49 | \n   50 |         nodes.push(child_node);\n   51 | \n   52 |         let c_size = child_widget.size();\n   53 |         let (width, flex_grow, justify_self) = match c_size.width {\n   54 |             Length::Fill | Length::FillPortion(_) => {\n   55 |                 (Dimension::auto(), 1.0, Some(AlignItems::Stretch))\n   56 | {"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `grid::layout::resolve`'s final assembly loop, a child is only re-laid-out with the grid-resolved size when `c_size.width` is `Length::Fill`/`FillPortion` (line 186-192), and even then only the resolved *width* is passed via `limits.width(leaf_layout.size.width)` -- the resolved height from `leaf_layout.size.height` is never applied. A grid cell child with `height: Length::Fill` (independent of its width setting) never gets relaid-out to actually receive its assigned cell height; it keeps whatever height resulted from the initial unconstrained `limits`-based layout pass at line 47, so 'Fill' height inside a grid cell is effectively broken.","fix":"Re-layout the child whenever either dimension is Fill/FillPortion, passing both the resolved width and height: `if matches!(c_size.width, Length::Fill | Length::FillPortion(_)) || matches!(c_size.height, Length::Fill | Length::FillPortion(_)) { *node = child_widget.layout(tree, renderer, &limits.width(leaf_layout.size.width).height(leaf_layout.size.height)); }`.","locations":[{"ref":"src/widget/grid/layout.rs:183-199","code":"  183 |         if let Ok(leaf_layout) = taffy.layout(leaf) {\n  184 |             let child_widget = child.as_widget_mut();\n  185 |             let c_size = child_widget.size();\n  186 |             match c_size.width {\n  187 |                 Length::Fill | Length::FillPortion(_) => {\n  188 |                     *node =\n  189 |                         child_widget.layout(tree, renderer, &limits.width(leaf_layout.size.width));\n  190 |                 }\n  191 |                 _ => (),\n  192 |             }\n  193 | \n  194 |             node.move_to_mut(Point {\n  195 |                 x: leaf_layout.location.x,\n  196 |                 y: leaf_layout.location.y,\n  197 |             })\n  198 |         }\n  199 |     }","lines":17,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/grid/layout.rs#L183-L199"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"last_tab() indexes `order[buttons_offset + buttons_visible]`, but the visible tab range produced by `iterate_visible_tabs` (skip(buttons_offset).take(buttons_visible)) is `[buttons_offset, buttons_offset + buttons_visible)`. The true last visible tab is at index `buttons_offset + buttons_visible - 1`. As written, `last_tab()` returns the first tab that is NOT visible (one past the end), so pressing Enter on the focused 'next' pagination button, or Shift+Tab navigation that calls `last_tab`, focuses the wrong (off-screen) tab.","fix":"Index with `buttons_offset + buttons_visible - 1` (guarding for buttons_visible == 0), e.g. `state.buttons_visible.checked_sub(1).and_then(|last| self.model.order.get(state.buttons_offset + last)).copied()`.","locations":[{"ref":"src/widget/segmented_button/widget.rs:595-600","code":"  595 |     fn last_tab(&self, state: &LocalState) -> Option<Entity> {\n  596 |         self.model\n  597 |             .order\n  598 |             .get(state.buttons_offset + state.buttons_visible)\n  599 |             .copied()\n  600 |     }","lines":6,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/segmented_button/widget.rs#L595-L600"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In draw(), `button_amount` is set to `self.model.items.len()` (the TOTAL number of items in the model), but the draw loop only iterates the currently-visible/paginated buttons (bounded by `state.buttons_visible` via `variant_bounds`), incrementing a separate counter `nth` from 0. The 'last' style variant (rounded corner, etc.) is only applied when `nth + 1 == button_amount`. Whenever the widget is collapsed/paginated (buttons_visible < items.len()), `nth` never reaches a value where `nth + 1 == button_amount`, so the visually-last rendered button never receives the 'last' appearance (e.g. correct border radius), producing incorrect styling at the end of a paginated segmented button.","fix":"Compare against the number of buttons actually being drawn instead of the total model size, e.g. capture `let button_amount = state.buttons_visible;` (or compute it from the iterator) so `nth + 1 == button_amount` correctly identifies the last rendered button.","locations":[{"ref":"src/widget/segmented_button/widget.rs:1997","code":" 1997 |         let button_amount = self.model.items.len();","lines":1,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/segmented_button/widget.rs#L1997"},{"ref":"src/widget/segmented_button/widget.rs:2206-2212","code":" 2206 |             let button_appearance = if nth == 0 {\n 2207 |                 status_appearance.first\n 2208 |             } else if nth + 1 == button_amount {\n 2209 |                 status_appearance.last\n 2210 |             } else {\n 2211 |                 status_appearance.middle\n 2212 |             };","lines":7,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/segmented_button/widget.rs#L2206-L2212"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In CompactTableView's rendering, the body text shows `item.get_text(Category::default())` as the title, and the caption row below it is built from `val.model.categories.iter().skip_while(|cat| **cat != Category::default())`. `skip_while` stops skipping (and includes) the first element for which the predicate is false, i.e. the first category that equals `Category::default()`. That means the default category's text is rendered twice: once as the title and again as the first caption chip, while the intent was clearly to show the *remaining* categories after the default one.","fix":"Skip the default category itself, e.g. `.skip_while(|cat| **cat != Category::default()).skip(1)`, or filter it out explicitly with `.filter(|cat| **cat != Category::default())`.","locations":[{"ref":"src/widget/table/widget/compact.rs:79-101","code":"   79 |                             .push(\n   80 |                                 widget::column::with_capacity(2)\n   81 |                                     .push(widget::text::body(item.get_text(Category::default())))\n   82 |                                     .push({\n   83 |                                         let mut elements = val\n   84 |                                             .model\n   85 |                                             .categories\n   86 |                                             .iter()\n   87 |                                             .skip_while(|cat| **cat != Category::default())\n   88 |                                             .flat_map(|category| {\n   89 |                                                 [\n   90 |                                                     widget::text::caption(item.get_text(*category))\n   91 |                                                         .apply(Element::from),\n   92 |                                                     widget::text::caption(\"-\").apply(Element::from),\n   93 |                                                 ]\n   94 |                                             })\n   95 |                                             .collect::<Vec<Element<'static, Message>>>();\n   96 |                                         elements.pop();\n   97 |                                         elements\n   98 |                                             .apply(widget::row::with_children)\n   99 |                                             .spacing(space_xxxs)\n  100 |                                             .wrap()\n  101 |                                     }),","lines":23,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/table/widget/compact.rs#L79-L101"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"previous_start_of_word clamps the lookup index for building `previous_string` (`index.min(self.graphemes.len())`) but then uses the original, unclamped `index` in the final arithmetic (`index - graphemes(...).count() - graphemes(...).count()`). If called with an index greater than the grapheme length, the returned position is computed against a string that was built using the clamped index while the offset arithmetic uses the unclamped one, producing an incorrect (too large) result instead of a value consistent with the actual content length. Worse, because the result is a `usize` subtraction chain, an inconsistent index can drive the subtraction below zero and panic with an overflow in debug builds. All current call sites happen to pass already-clamped indices (via Cursor::state/left/right), so this is latent rather than triggered today, but the method is exported (pub) and not safe to call generally as documented (it claims to operate on 'the given grapheme index' without clamping guarantees).","fix":"Clamp once at the top: `let index = index.min(self.graphemes.len());` and use that clamped value consistently throughout the function (both for building previous_string and in the final arithmetic), or use saturating_sub for the final subtraction to avoid a panic if the invariant is ever violated.","locations":[{"ref":"src/widget/text_input/value.rs:45-60","code":"   45 |     pub fn previous_start_of_word(&self, index: usize) -> usize {\n   46 |         let previous_string = &self.graphemes[..index.min(self.graphemes.len())].concat();\n   47 | \n   48 |         UnicodeSegmentation::split_word_bound_indices(previous_string as &str)\n   49 |             .filter(|(_, word)| !word.trim_start().is_empty())\n   50 |             .next_back()\n   51 |             .map_or(0, |(i, previous_word)| {\n   52 |                 index\n   53 |                     - UnicodeSegmentation::graphemes(previous_word, true).count()\n   54 |                     - UnicodeSegmentation::graphemes(\n   55 |                         &previous_string[i + previous_word.len()..] as &str,\n   56 |                         true,\n   57 |                     )\n   58 |                     .count()\n   59 |             })\n   60 |     }","lines":16,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/text_input/value.rs#L45-L60"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`Message::Remove(id)` removes an entry from `self.images` by index but never adjusts `self.selected`. After removing an image at an index at or before the currently selected index, `self.selected` can point at a different image than the one the user actually selected, or (if the last image was selected and removed) at an index past the end of the now-shorter `images` vector. This doesn't panic here (the index is only used in an `==` comparison for highlighting), but produces a visibly wrong/stale selection highlight that a copy-paste user might not expect, and would panic if this same `selected` field were ever used to index into `images` directly.","fix":"After removing an item, clamp or update `self.selected` (e.g. `self.selected = self.selected.min(self.images.len().saturating_sub(1))`, or clear it if the removed image was the selected one).","locations":[{"ref":"examples/image-button/src/main.rs:70-79","code":"   70 |     fn update(&mut self, message: Self::Message) -> Task<Self::Message> {\n   71 |         match message {\n   72 |             Message::Clicked(id) => self.selected = id,\n   73 |             Message::Remove(id) => {\n   74 |                 self.images.remove(id);\n   75 |             }\n   76 |         }\n   77 | \n   78 |         Task::none()\n   79 |     }","lines":10,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/examples/image-button/src/main.rs#L70-L79"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`anim::State::t()` divides `Instant::now().duration_since(t).as_millis() as f32` by `dur.as_millis() as f32` with no guard against `dur` being `Duration::ZERO`. Float division by zero does not panic in Rust, but it produces `inf` (or `NaN` if the numerator is also zero), which then flows into `forward { res } else { 1. - res }` and from there into `lerp`/`slerp` callers, producing garbage interpolation values (`NaN`/`inf`) instead of the presumably-intended 'animation is already complete' (`t = 1.0`) result for a zero-length animation.","fix":"Special-case a zero (or near-zero) duration to return 1.0 (animation complete) directly: `if dur.is_zero() { return if forward { 1.0 } else { 0.0 }; }` before doing the division.","locations":[{"ref":"src/anim.rs:45-50","code":"   45 |     pub fn t(&self, dur: Duration, forward: bool) -> f32 {\n   46 |         let res = self.last_change.map_or(1., |t| {\n   47 |             Instant::now().duration_since(t).as_millis() as f32 / dur.as_millis() as f32\n   48 |         });\n   49 |         if forward { res } else { 1. - res }\n   50 |     }","lines":6,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/anim.rs#L45-L50"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In DndDestination::update, the `OfferEvent::Leave` and `OfferEvent::LeaveDestination` match arms (unlike Enter, Motion, Drop, SelectedAction, and Data) do not check `if *id == Some(my_id)` before acting — they match on `Event::Dnd(DndEvent::Offer(_, OfferEvent::Leave))` with the id wildcarded. Practically this is mostly harmless today because `State::on_leave` only fires when `self.drag_offer` is already `Some(..)` (i.e. only a destination that previously entered will react), but it is inconsistent with every other arm in the same match and with the general per-id targeting model used throughout this widget, making it easy to introduce a real cross-destination state bug if the guard logic in `on_leave` is ever relaxed or the protocol starts reusing ids across simultaneous offers.","fix":"Add the same `if *id == Some(my_id)` guard used by the other arms to the Leave and LeaveDestination match patterns for consistency and defense-in-depth, e.g. `Event::Dnd(DndEvent::Offer(id, OfferEvent::Leave)) if *id == Some(my_id) => { ... }`.","locations":[{"ref":"src/widget/dnd_destination.rs:401-428","code":"  401 |             Event::Dnd(DndEvent::Offer(_, OfferEvent::Leave)) => {\n  402 |                 log::trace!(\n  403 |                     target: DND_DEST_LOG_TARGET,\n  404 |                     \"offer leave id={:?}\",\n  405 |                     my_id\n  406 |                 );\n  407 |                 if let Some(msg) =\n  408 |                     state.on_leave(self.on_leave.as_ref().map(std::convert::AsRef::as_ref))\n  409 |                 {\n  410 |                     shell.publish(msg);\n  411 |                 }\n  412 | \n  413 |                 if self.forward_drag_as_cursor {\n  414 |                     let drag_cursor = mouse::Cursor::Unavailable;\n  415 |                     let event = Event::Mouse(mouse::Event::CursorLeft);\n  416 |                     self.container.as_widget_mut().update(\n  417 |                         &mut tree.children[0],\n  418 |                         &event,\n  419 |                         layout,\n  420 |                         drag_cursor,\n  421 |                         renderer,\n  422 |                         clipboard,\n  423 |                         shell,\n  424 |                         viewport,\n  425 |                     );\n  426 |                 }\n  427 |                 return;\n  428 |             }","lines":28,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/dnd_destination.rs#L401-L428"},{"ref":"src/widget/dnd_destination.rs:464-476","code":"  464 |             Event::Dnd(DndEvent::Offer(_, OfferEvent::LeaveDestination)) => {\n  465 |                 log::trace!(\n  466 |                     target: DND_DEST_LOG_TARGET,\n  467 |                     \"offer leave-destination id={:?}\",\n  468 |                     my_id\n  469 |                 );\n  470 |                 if let Some(msg) =\n  471 |                     state.on_leave(self.on_leave.as_ref().map(std::convert::AsRef::as_ref))\n  472 |                 {\n  473 |                     shell.publish(msg);\n  474 |                 }\n  475 |                 return;\n  476 |             }","lines":13,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/dnd_destination.rs#L464-L476"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"multi::widget's State.selections cache is only (re)populated when it is completely empty (`if state.selections.is_empty()`), both in `layout()` and lazily via push in `overlay()`. If the Model's lists are replaced/changed without the cache ever becoming literally empty in between (e.g. items are swapped out one-for-one, or the model grows after the cache was already populated for a smaller model on a previous frame), stale entries for since-removed Items remain in the Vec indefinitely (a minor memory/staleness leak) while genuinely new Items are only picked up via the separate fallback insertion path in `overlay()`'s measure closure, so `layout()`'s own cache-priming loop silently does nothing for an already-nonempty-but-stale cache.","fix":"Rebuild/sync state.selections against the current Model contents whenever the Model's item set actually changes (e.g. compare lengths or a hash like the single-select Dropdown's `diff()` does with state.hashes), instead of only gating on `is_empty()`.","locations":[{"ref":"src/widget/dropdown/multi/widget.rs:95-115","code":"   95 |             self.selections.selected.as_ref().and_then(|id| {\n   96 |                 self.selections.get(id).map(AsRef::as_ref).zip({\n   97 |                     let state = tree.state.downcast_mut::<State<Item>>();\n   98 | \n   99 |                     if state.selections.is_empty() {\n  100 |                         for list in &self.selections.lists {\n  101 |                             for (_, item) in &list.options {\n  102 |                                 state\n  103 |                                     .selections\n  104 |                                     .push((item.clone(), crate::Plain::default()));\n  105 |                             }\n  106 |                         }\n  107 |                     }\n  108 | \n  109 |                     state\n  110 |                         .selections\n  111 |                         .iter_mut()\n  112 |                         .find(|(i, _)| i == id)\n  113 |                         .map(|(_, p)| p)\n  114 |                 })\n  115 |             }),","lines":21,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/dropdown/multi/widget.rs#L95-L115"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In the Length::Shrink branch of horizontal layout, `visible_width -= spacing;` runs unconditionally after the loop. When the loop exits via the `else` branch (a button doesn't fit), `visible_width` was just reassigned to `max_size.width - max_height` (reserved space for the prev/next pagination buttons) and the loop `break`s before reaching the `visible_width += spacing` line -- so this value never had a trailing spacing added to it. The subsequent unconditional `-= spacing` incorrectly shrinks this reserved-space value by one spacing unit, slightly under-allocating the minimum width whenever pagination buttons are needed. (When the loop completes normally without breaking, the `-= spacing` correctly cancels a trailing `+= spacing` that was added after the last accepted button.)","fix":"Only subtract the trailing spacing when the loop completed without breaking through the fallback branch, e.g. track a `bool` for whether the break path was taken, or restructure so the early-break path sets the final value directly without involving the shared `-= spacing` correction.","locations":[{"ref":"src/widget/segmented_button/horizontal.rs:149-165","code":"  149 |             let mut visible_width = 0.0;\n  150 |             state.buttons_visible = 0;\n  151 | \n  152 |             for (button_size, _actual_size) in &state.internal_layout {\n  153 |                 visible_width += button_size.width;\n  154 | \n  155 |                 if max_size.width - spacing >= visible_width {\n  156 |                     state.buttons_visible += 1;\n  157 |                 } else {\n  158 |                     visible_width = max_size.width - max_height;\n  159 |                     break;\n  160 |                 }\n  161 | \n  162 |                 visible_width += spacing;\n  163 |             }\n  164 | \n  165 |             visible_width -= spacing;","lines":17,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/segmented_button/horizontal.rs#L149-L165"}]},
{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"TextInput::diff() unfocuses the input whenever its on_input callback is None and manage_value is false, but it does this unconditionally on every diff() call while the condition holds, even for a TextInput that is not currently using on_input at all by design (e.g. read-only display variants). Separately, the condition `!self.manage_value || !self.value.is_empty() && state.tracked_value != self.value` relies on && binding tighter than ||, parsing as `(!self.manage_value) || (!self.value.is_empty() && state.tracked_value != self.value)`. This is easy to misread as `!(self.manage_value || (!self.value.is_empty() && ...))` and the lack of parentheses makes the intended precedence non-obvious to a future maintainer, increasing the chance of an incorrect edit.","fix":"Add explicit parentheses to make the intended precedence unambiguous: `if !self.manage_value || (!self.value.is_empty() && state.tracked_value != self.value) { ... }`. No behavior change is required, just clarify intent for future readers.","locations":[{"ref":"src/widget/text_input/input.rs:623-628","code":"  623 |         if !self.manage_value || !self.value.is_empty() && state.tracked_value != self.value {\n  624 |             state.tracked_value = self.value.clone();\n  625 |         } else if self.value.is_empty() {\n  626 |             self.value = state.tracked_value.clone();\n  627 |             // std::mem::swap(&mut state.tracked_value, &mut self.value);\n  628 |         }","lines":6,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/text_input/input.rs#L623-L628"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"easy","description":"`open::portal::FileResponse::url()` calls `self.0.uris().first().expect(\"no files selected\")`, which panics if the portal returns zero URIs. The structurally identical `save::portal::Response::url()` handles the exact same situation safely by returning `Option<&Url>` via `.first()` without panicking. Since the open dialog's `file()`/`folder()` functions only check `Result` (any `Ok` is treated as success), a portal response that succeeds with an empty selection (e.g. due to a buggy or unusual portal backend) will panic deep inside application code that merely calls `.url()` on the response, instead of surfacing a recoverable error like the save-dialog path does.","fix":"Change `FileResponse::url()` to return `Option<&Url>` (mirroring `save::portal::Response::url()`), e.g. `pub fn url(&self) -> Option<&Url> { self.0.uris().first() }`, and update callers/doc examples to handle the `None` case instead of relying on a panic.","locations":[{"ref":"src/dialog/file_chooser/open.rs:208-216","code":"  208 |     impl FileResponse {\n  209 |         pub fn choices(&self) -> &[(String, String)] {\n  210 |             self.0.choices()\n  211 |         }\n  212 | \n  213 |         pub fn url(&self) -> &Url {\n  214 |             self.0.uris().first().expect(\"no files selected\")\n  215 |         }\n  216 |     }","lines":9,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/dialog/file_chooser/open.rs#L208-L216"},{"ref":"src/dialog/file_chooser/save.rs:159-170","code":"  159 |     /// A dialog response containing the selected file or folder.\n  160 |     pub struct Response(pub SelectedFiles);\n  161 | \n  162 |     impl Response {\n  163 |         pub fn choices(&self) -> &[(String, String)] {\n  164 |             self.0.choices()\n  165 |         }\n  166 | \n  167 |         pub fn url(&self) -> Option<&Url> {\n  168 |             self.0.uris().first()\n  169 |         }\n  170 |     }","lines":12,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/dialog/file_chooser/save.rs#L159-L170"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"medium","description":"as_gtk4() defines three conceptually identical \"black shade overlay\" constants with inconsistent dark/light alpha values. `shade` (used for the global shade_color) uses alpha 0.32 in dark mode / 0.08 in light mode, matching Theme::build()'s canonical `shade` field (theme.rs ~1154-1158: dark=0.32, light=0.08). But `sidebar_shade`, `secondary_sidebar_shade`, and `backdrop_overlay` all use the opposite mapping: alpha 0.08 in dark mode / 0.32 in light mode. Since these are meant to represent the same kind of overlay (and `backdrop_overlay` is literally composited with the same intent as `shade`), this looks like the light/dark branches were swapped by copy-paste in two of the three definitions, producing visibly wrong (inverted) shading intensity for GTK sidebar/backdrop colors relative to the rest of the theme.","fix":"Make `sidebar_shade`, `secondary_sidebar_shade`, and `backdrop_overlay` use the same dark=0.32/light=0.08 mapping as `shade` (and as Theme::build()'s shade field), unless there is a documented design reason for sidebars to use the inverse intensity -- in which case add a comment explaining why, since right now it reads as an accidental inversion.","locations":[{"ref":"cosmic-theme/src/output/gtk4_output.rs:42-57","code":"   42 |         let sidebar_shade = to_rgba(if self.is_dark {\n   43 |             Rgba::new(0.0, 0.0, 0.0, 0.08)\n   44 |         } else {\n   45 |             Rgba::new(0.0, 0.0, 0.0, 0.32)\n   46 |         });\n   47 |         let backdrop_overlay = Srgba::new(1.0, 1.0, 1.0, if self.is_dark { 0.08 } else { 0.32 });\n   48 |         let sidebar_backdrop = to_rgba(over(backdrop_overlay, primary.base));\n   49 | \n   50 |         let secondary_sidebar_bg = to_rgba(secondary.base);\n   51 |         let secondary_sidebar_fg = to_rgba(secondary.on);\n   52 |         let secondary_sidebar_shade = to_rgba(if self.is_dark {\n   53 |             Rgba::new(0.0, 0.0, 0.0, 0.08)\n   54 |         } else {\n   55 |             Rgba::new(0.0, 0.0, 0.0, 0.32)\n   56 |         });\n   57 |         let secondary_sidebar_backdrop = to_rgba(over(backdrop_overlay, secondary.base));","lines":16,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/cosmic-theme/src/output/gtk4_output.rs#L42-L57"},{"ref":"cosmic-theme/src/output/gtk4_output.rs:73-77","code":"   73 |         let shade = to_rgba(if self.is_dark {\n   74 |             Rgba::new(0.0, 0.0, 0.0, 0.32)\n   75 |         } else {\n   76 |             Rgba::new(0.0, 0.0, 0.0, 0.08)\n   77 |         });","lines":5,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/cosmic-theme/src/output/gtk4_output.rs#L73-L77"}]},
{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"`Message::ShowMinimizeButton(value)` sets `self.show_maximize_button` instead of `self.show_minimize_button`. This is a copy-paste error from the adjacent `ShowMaximizeButton` arm: toggling the \"Show Minimize Button\" control in the demo UI actually changes the maximize-button state, leaving the minimize toggle non-functional and silently corrupting the maximize toggle's value.","fix":"Change line 108 to `Message::ShowMinimizeButton(value) => self.show_minimize_button = value,`.","locations":[{"ref":"examples/cosmic/src/window/desktop.rs:107-108","code":"  107 |             Message::ShowMaximizeButton(value) => self.show_maximize_button = value,\n  108 |             Message::ShowMinimizeButton(value) => self.show_maximize_button = value,","lines":2,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/examples/cosmic/src/window/desktop.rs#L107-L108"}]},
{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"When rendering a button, the right edge of the content bounds is computed as `bounds.width -= button_padding[0] - button_padding[2]` after `bounds.x` was already advanced by `button_padding[0]`. Every other place in this file/horizontal.rs that derives a content width from button_padding subtracts the SUM of both paddings (`width -= button_padding[0] + button_padding[2]`, see widget.rs:660, 677, 700-701, 726-727). Using a minus here is inconsistent: when left and right padding are equal the width is not reduced at all (it should shrink by 2x padding since x moved right by padding[0]), and when padding[2] > padding[0] the width actually grows past the button's right edge, causing visual overflow/clipping artifacts especially with asymmetric `button_padding`.","fix":"Change to `bounds.width -= f32::from(self.button_padding[0]) + f32::from(self.button_padding[2]);` to match the pattern used everywhere else in this file.","locations":[{"ref":"src/widget/segmented_button/widget.rs:2248-2249","code":" 2248 |             bounds.x += f32::from(self.button_padding[0]);\n 2249 |             bounds.width -= f32::from(self.button_padding[0]) - f32::from(self.button_padding[2]);","lines":2,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/segmented_button/widget.rs#L2248-L2249"}]},
{"id":"CPY_5","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"In `vertical_variant`, the accessibility name strings for the increment/decrement buttons are built from `spin_button.label` (the visible numeric value text) instead of `spin_button.name` (the dedicated a11y screen-reader name set via `.name()`). The horizontal variant correctly uses `spin_button.name`. This means vertical spin buttons announce the wrong accessible name to screen readers whenever `name` differs from `label`, which is the whole reason the separate `name` field/setter exists.","fix":"Change `[&spin_button.label, \" decrease\"].concat()` and `[&spin_button.label, \" increase\"].concat()` in `vertical_variant` to use `&spin_button.name` instead, matching `horizontal_variant`.","locations":[{"ref":"src/widget/spin_button.rs:251-265","code":"  251 |     let decrement_button = make_button(\n  252 |         &spin_button,\n  253 |         \"list-remove-symbolic\",\n  254 |         #[cfg(feature = \"a11y\")]\n  255 |         [&spin_button.label, \" decrease\"].concat(),\n  256 |         match spin_button.value == spin_button.min {\n  257 |             true => None,\n  258 |             false => Some(decrement),\n  259 |         },\n  260 |     );\n  261 |     let increment_button = make_button(\n  262 |         &spin_button,\n  263 |         \"list-add-symbolic\",\n  264 |         #[cfg(feature = \"a11y\")]\n  265 |         [&spin_button.label, \" increase\"].concat(),","lines":15,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/spin_button.rs#L251-L265"}]},
{"id":"CPY_6","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"In Theme::as_gtk4, `component_gtk4_css(\"accent\", accent)` is emitted twice in a row (lines 120 and 124), writing the exact same `@define-color accent_color/accent_bg_color/accent_fg_color` block twice into the generated CSS. This is dead duplicate output and strongly suggests a copy-paste mistake where a different component (e.g. primary/suggested) was intended for one of the two calls.","fix":"Remove the duplicate `component_gtk4_css(\"accent\", accent)` call, or replace it with whatever component was actually intended to be exported there.","locations":[{"ref":"cosmic-theme/src/output/gtk4_output.rs:120-125","code":"  120 |         css.push_str(&component_gtk4_css(\"accent\", accent));\n  121 |         css.push_str(&component_gtk4_css(\"destructive\", destructive));\n  122 |         css.push_str(&component_gtk4_css(\"warning\", warning));\n  123 |         css.push_str(&component_gtk4_css(\"success\", success));\n  124 |         css.push_str(&component_gtk4_css(\"accent\", accent));\n  125 |         css.push_str(&component_gtk4_css(\"error\", destructive));","lines":6,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/cosmic-theme/src/output/gtk4_output.rs#L120-L125"}]},
{"id":"CPY_7","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"`view_desktop_workspaces` passes `DesktopPage::Wallpaper` to `window.parent_page_button`, copy-pasted from `view_desktop_wallpaper` above it, instead of `DesktopPage::Workspaces`. The back-button on the Workspaces sub-page therefore displays the wrong label/icon and is wired to the wrong page identity for that button (cosmetic, but a clear leftover copy-paste bug).","fix":"Change line 257 to `window.parent_page_button(DesktopPage::Workspaces)`.","locations":[{"ref":"examples/cosmic/src/window/desktop.rs:255-257","code":"  255 |     fn view_desktop_workspaces<'a>(&'a self, window: &'a Window) -> Element<'a, Message> {\n  256 |         settings::view_column(vec![\n  257 |             window.parent_page_button(DesktopPage::Wallpaper),","lines":3,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/examples/cosmic/src/window/desktop.rs#L255-L257"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"medium","description":"Both `subscription.rs` and `dbus.rs` call `CosmicConfigEntry::update_keys`, which can return non-empty `errors` (e.g. a key file contains malformed RON and fails to parse) together with an empty `changed`/`keys` list (because the field was not actually updated when the parse failed). In both call sites, the `Update` message carrying those errors is only sent to the application `if !keys.is_empty()` / `if !changed.is_empty()`. This means that whenever a config key changes on disk but fails to parse, the error is computed and then thrown away — the subscriber application is never notified that anything went wrong, and is left silently holding a stale/default value with no diagnostic at all, defeating the purpose of returning `errors` from `update_keys` in the first place.","fix":"Send the `Update` (or at least log the errors) whenever `errors` is non-empty, not only when `keys`/`changed` is non-empty. For example: `if !changed.is_empty() || !errors.is_empty() { output.send(...).await; }`.","locations":[{"ref":"cosmic-config/src/subscription.rs:123-137","code":"  123 |         ConfigState::Waiting(mut conf_data, watcher, mut rx, config) => match rx.next().await {\n  124 |             Some(keys) => {\n  125 |                 let (errors, changed) = conf_data.update_keys(&config, &keys);\n  126 | \n  127 |                 if !changed.is_empty() {\n  128 |                     _ = output\n  129 |                         .send(crate::Update {\n  130 |                             errors,\n  131 |                             keys: changed,\n  132 |                             config: conf_data.clone(),\n  133 |                         })\n  134 |                         .await;\n  135 |                 }\n  136 |                 ConfigState::Waiting(conf_data, watcher, rx, config)\n  137 |             }","lines":15,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/cosmic-config/src/subscription.rs#L123-L137"},{"ref":"cosmic-config/src/dbus.rs:244-256","code":"  244 |                             let (errors, keys) = config.update_keys(&cosmic_config, &[args.key]);\n  245 |                             if !keys.is_empty() {\n  246 |                                 if let Err(err) = tx\n  247 |                                     .send(Update {\n  248 |                                         errors,\n  249 |                                         keys,\n  250 |                                         config: config.clone(),\n  251 |                                     })\n  252 |                                     .await\n  253 |                                 {\n  254 |                                     tracing::error!(\"Failed to send config update: {err}\");\n  255 |                                 }\n  256 |                             }","lines":13,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/cosmic-config/src/dbus.rs#L244-L256"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"In the `notify` watcher callback, both the path-prefix-stripping error and the top-level `notify::Error` from the watcher are silently discarded with `//TODO: handle errors` and no logging. The rest of this same file uses `tracing::debug!`/`tracing::warn!` for far less important Flatpak path-resolution diagnostics, but actual watcher failures (which break live config reload entirely) are dropped on the floor, making misbehaving watches very hard to diagnose in the field.","fix":"Log the discarded errors with `tracing::warn!` or `tracing::error!` instead of swallowing them silently, e.g. `Err(err) => tracing::warn!(\"failed to strip config path prefix: {err}\")` and `Err(err) => tracing::warn!(\"config watcher error: {err}\")`.","locations":[{"ref":"cosmic-config/src/lib.rs:368-372","code":"  368 |                                 }\n  369 |                                 Err(_err) => {\n  370 |                                     //TODO: handle errors\n  371 |                                 }\n  372 |                             }","lines":5,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/cosmic-config/src/lib.rs#L368-L372"},{"ref":"cosmic-config/src/lib.rs:368-372","code":"  368 |                                 }\n  369 |                                 Err(_err) => {\n  370 |                                     //TODO: handle errors\n  371 |                                 }\n  372 |                             }","lines":5,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/cosmic-config/src/lib.rs#L368-L372"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"Theme::apply_vs_code reads the existing settings.json with `std::fs::read_to_string(&settings_file).unwrap_or_default()`, so when the file does not exist yet (very common on first run, since the function itself creates the parent directory if missing) `settings` becomes an empty string `\"\"`. It is then passed to `serde_json::from_str(&settings)?`, but `serde_json::from_str::<Value>(\"\")` returns an Err (unexpected end of input), which propagates via `?` as OutputError::Serde. So the very first time a user enables the VS Code theme export (no existing settings.json), apply_vs_code fails instead of treating the missing file as an empty JSON object. Note reset_vs_code has the same read pattern but masks the parse failure with `.unwrap_or_default()` on the Value itself, so the two functions handle the identical missing-file scenario inconsistently.","fix":"In apply_vs_code, fall back to `\"{}\"` (or directly to `serde_json::Value::Object(Default::default())`) when the settings file is missing/empty, instead of letting an empty string reach serde_json::from_str. For consistency, mirror reset_vs_code's `unwrap_or_default()` on the parsed Value, or better, make both functions use the same explicit empty-object fallback rather than relying on a panic-free default that doesn't actually parse.","locations":[{"ref":"cosmic-theme/src/output/vs_code.rs:280-289","code":"  280 |         let settings_file = vs_code_dir.join(\"settings.json\");\n  281 |         let settings = std::fs::read_to_string(&settings_file).unwrap_or_default();\n  282 |         let mut settings: serde_json::Value = serde_json::from_str(&settings)?;\n  283 |         settings[\"workbench.colorCustomizations\"] = serde_json::to_value(vs_theme).unwrap();\n  284 |         settings[\"window.autoDetectColorScheme\"] = serde_json::Value::Bool(true);\n  285 |         std::fs::write(\n  286 |             &settings_file,\n  287 |             serde_json::to_string_pretty(&settings).unwrap(),\n  288 |         )\n  289 |         .map_err(OutputError::Io)?;","lines":10,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/cosmic-theme/src/output/vs_code.rs#L280-L289"},{"ref":"cosmic-theme/src/output/vs_code.rs:296-302","code":"  296 |         let mut config_dir = dirs::config_dir().ok_or(OutputError::MissingConfigDir)?;\n  297 |         config_dir.extend([\"Code\", \"User\", \"settings.json\"]);\n  298 |         let settings_file = config_dir;\n  299 |         // just remove the json entry for workbench.colorCustomizations\n  300 |         let settings = std::fs::read_to_string(&settings_file).unwrap_or_default();\n  301 |         let mut settings: serde_json::Value = serde_json::from_str(&settings).unwrap_or_default();\n  302 |         settings[\"workbench.colorCustomizations\"] = serde_json::Value::Null;","lines":7,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/cosmic-theme/src/output/vs_code.rs#L296-L302"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`wayland_handler` (run on a dedicated OS thread spawned per applet activation-token subscription) calls `.unwrap()` on `Connection::from_socket(socket)`, `Connection::connect_to_env()`, and `registry_queue_init(&conn)`, and `.expect(...)` on inserting the wayland source. Any failure to connect to or initialize the Wayland connection (e.g. compositor restart, socket permission issue, race during panel startup) panics the spawned thread instead of reporting a recoverable error through the existing `TokenUpdate`/`output` channel that the rest of the module already uses for graceful shutdown (`TokenUpdate::Finished`).","fix":"Replace the `unwrap()`/`expect()` calls with proper error propagation: return a `Result` from `wayland_handler` (or send a `TokenUpdate::Finished`/new error variant through `tx` before returning) so `start_listening` in subscription.rs can detect the failure via `handle.is_finished()` without relying on a bare thread panic, and so the failure is logged via `tracing::error!` instead of an unstructured panic message.","locations":[{"ref":"src/applet/token/wayland_handler.rs:97-118","code":"   97 |     let socket = std::env::var(\"X_PRIVILEGED_WAYLAND_SOCKET\")\n   98 |         .ok()\n   99 |         .and_then(|fd| {\n  100 |             fd.parse::<RawFd>()\n  101 |                 .ok()\n  102 |                 .map(|fd| unsafe { UnixStream::from_raw_fd(fd) })\n  103 |         });\n  104 | \n  105 |     let conn = if let Some(socket) = socket {\n  106 |         Connection::from_socket(socket).unwrap()\n  107 |     } else {\n  108 |         Connection::connect_to_env().unwrap()\n  109 |     };\n  110 |     let (globals, event_queue) = registry_queue_init(&conn).unwrap();\n  111 | \n  112 |     let mut event_loop = calloop::EventLoop::<AppData>::try_new().unwrap();\n  113 |     let qh = event_queue.handle();\n {"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In the dbus activation subscription, the first `output.send(...)` call (sending `Action::Cosmic(Action::DbusConnection(conn.clone()))`) ignores its `Result` entirely, while every other `output.send(...)` call in the same function (for `Activate` and the `DbusActivation` message forwarding) explicitly checks the result and logs via `tracing::error!` on failure. If the receiver has already been dropped at this point, the dropped-channel error is silently swallowed instead of being logged like its siblings.","fix":"Match the pattern used elsewhere in the function: `if let Err(err) = output.send(...).await { tracing::error!(?err, \"Failed to send message\"); }`.","locations":[{"ref":"src/dbus_activation.rs:46-50","code":"   46 |                         output\n   47 |                             .send(crate::Action::Cosmic(crate::app::Action::DbusConnection(\n   48 |                                 conn.clone(),\n   49 |                             )))\n   50 |                             .await;","lines":5,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/dbus_activation.rs#L46-L50"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"critical","difficulty":"easy","description":"This example uses `cosmic::iced::Application` (the raw iced trait, see `impl Application for Window` at line 316 and `Window::run(settings)` in main.rs) instead of `cosmic::Application`. The `Window` struct (lines 144-166) has no `core` field, no `core()`/`core_mut()` methods, and there is no `Deref` impl anywhere in this module or its submodules that would provide one. Yet `update()` references `self.core.main_window_id().unwrap()` four times. This cannot compile (`no field 'core' on type '&mut Window'`); the example as committed is broken and cannot be used as a copy-paste starting point.","fix":"Either switch this example to implement `cosmic::Application` (which provides `core`/`core_mut`) and add a `core: Core` field to `Window`, or, if intentionally using raw `iced::Application`, remove the `self.core.main_window_id()` calls and use the appropriate iced-native window-targeting API (e.g. track the window id manually) for drag/close/minimize/maximize.","locations":[{"ref":"examples/cosmic/src/window.rs:144-166","code":"  144 | #[derive(Default)]\n  145 | pub struct Window {\n  146 |     bluetooth: bluetooth::State,\n  147 |     debug: bool,\n  148 |     demo: demo::State,\n  149 |     editor: editor::State,\n  150 |     desktop: desktop::State,\n  151 |     nav_bar: segmented_button::SingleSelectModel,\n  152 |     nav_id_to_page: segmented_button::SecondaryMap<Page>,\n  153 |     nav_bar_toggled_condensed: bool,\n  154 |     nav_bar_toggled: bool,\n  155 |     page: Page,\n  156 |     show_maximize: bool,\n  157 |     show_minimize: bool,\n  158 |     system_and_accounts: system_and_accounts::State,\n  159 |     theme: Theme,\n  160 |     title: String,\n  161 |     show_warning: bool,\n  162 |     warning_message: String,\n  163 |     scale_factor: f64,\n  164 |     scale_factor_string: String,\n  165 |     timeline: Rc<RefCell<Timeline>>,\n  16 {"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"Two distinct, simultaneously-rendered text input widgets (a `secure_input` and a plain `text_input`, both inside the same `settings::view_column`) are both given the same `INPUT_ID.clone()` widget id. The same file's parent module (window.rs:32) explicitly documents that assigning the same `id::Id` to multiple widgets \"causes a crash when a11y is enabled\" — yet this exact pattern is reproduced here unaddressed, risking the very crash the codebase's own comment warns about.","fix":"Give each text input its own unique `id::Id` (e.g. a second static `Lazy<id::Id>`), since `id::Id` values must be unique per concurrently-rendered widget.","locations":[{"ref":"examples/cosmic/src/window/demo.rs:483-499","code":"  483 |             cosmic::widget::text_input::secure_input(\n  484 |                 \"Type to search apps or type “?” for more options...\",\n  485 |                 &self.entry_value,\n  486 |                 Some(Message::Hidden),\n  487 |                 self.hidden,\n  488 |             )\n  489 |             .on_input(Message::InputChanged)\n  490 |             .size(20)\n  491 |             .id(INPUT_ID.clone())\n  492 |             .into(),\n  493 |             cosmic::widget::text_input(\"\", &self.entry_value)\n  494 |                 .label(\"Test Input\")\n  495 |                 .helper_text(\"test helper text\")\n  496 |                 .on_input(Message::InputChanged)\n  497 |                 .size(20)\n  498 |                 .id(INPUT_ID.clone())\n  499 |                 .into(),","lines":17,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/examples/cosmic/src/window/demo.rs#L483-L499"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`AspectRatio` wraps an inner `Container` but, unlike its near-identical sibling `LayerContainer` (which delegates `tag()`, `state()`, `id()`, `set_id()`, and `drag_destinations()` to the inner container), `AspectRatio` does not override any of these five `Widget` trait methods. As a result it falls back to the default `Widget` implementations: `id()` returns `None` and `set_id()` is a no-op, so any code that tries to locate/target an `AspectRatio`-wrapped widget by `Id` (e.g. operations, focus, or the `responsive_container`'s `operation.container(Some(&self.id), ...)` pattern) silently fails to reach it. `drag_destinations()` also isn't propagated, so drag-and-drop destination rectangles registered by content inside an `AspectRatio` container never get reported, breaking DnD for any content wrapped in it.","fix":"Add `tag()`, `state()`, `id()`, `set_id()`, and `drag_destinations()` overrides to `AspectRatio`'s `Widget` impl that delegate to `self.container`, mirroring exactly what `LayerContainer` already does (lines 155-165, 277-283 of layer_container.rs and 266-275 there for drag_destinations).","locations":[{"ref":"src/widget/aspect_ratio.rs:154-273","code":"  154 | impl<Message, Renderer> Widget<Message, crate::Theme, Renderer>\n  155 |     for AspectRatio<'_, Message, Renderer>\n  156 | where\n  157 |     Renderer: iced_core::Renderer,\n  158 | {\n  159 |     fn children(&self) -> Vec<Tree> {\n  160 |         self.container.children()\n  161 |     }\n  162 | \n  163 |     fn diff(&mut self, tree: &mut Tree) {\n  164 |         self.container.diff(tree);\n  165 |     }\n  166 | \n  167 |     fn size(&self) -> Size<Length> {\n  168 |         self.container.size()\n  169 |     }\n  170 | \n  171 |     fn layout(\n  172 |         &mut self,\n  173 |         tree: &mut Tree,\n  174 |         renderer: &Renderer,\n  175 |         limits: &layout::Limits {"id":"API_5","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"Model::data_remove<Data>() silently discards the removed value (calls .remove(id) inside and_then but ignores the Option result), unlike its sibling removal methods icon_remove, text_remove, and indent_remove, which all return Option<T> with the previously-stored value. This inconsistency means callers cannot retrieve or inspect data that was just removed via data_remove, even though the doc comment style and surrounding API suggest they could.","fix":"Change the signature to `pub fn data_remove<Data: 'static>(&mut self, id: Entity) -> Option<Data>` and return the downcast removed value, matching the pattern used by icon_remove/text_remove/indent_remove.","locations":[{"ref":"src/widget/segmented_button/model/mod.rs:206-211","code":"  206 |     pub fn data_remove<Data: 'static>(&mut self, id: Entity) {\n  207 |         self.storage\n  208 |             .0\n  209 |             .get_mut(&TypeId::of::<Data>())\n  210 |             .and_then(|storage| storage.remove(id));\n  211 |     }","lines":6,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/segmented_button/model/mod.rs#L206-L211"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"high","difficulty":"easy","description":"Value::insert inserts the new character as a single-grapheme String at the target index, then immediately discards that work and re-derives the ENTIRE grapheme vector from scratch by calling self.to_string() (concatenating all graphemes into a new String) and re-running unicode grapheme segmentation over the whole text. This runs on every single keystroke typed into a text input, making typing cost O(n) per character and the whole-string typing cost O(n^2) for an n-character input.","fix":"Avoid the full re-segmentation: after computing the new grapheme(s) introduced by inserting `c` next to its neighboring graphemes (only the boundary may change), splice only the affected region, or at minimum avoid the full to_string()+graphemes() round trip by re-segmenting only the substring around the insertion point (e.g., the previous grapheme + new char + next grapheme) and splicing the result back into self.graphemes.","locations":[{"ref":"src/widget/text_input/value.rs:97-105","code":"   97 |     /// Inserts a new `char` at the given grapheme `index`.\n   98 |     #[inline]\n   99 |     pub fn insert(&mut self, index: usize, c: char) {\n  100 |         self.graphemes.insert(index, c.to_string());\n  101 | \n  102 |         self.graphemes = UnicodeSegmentation::graphemes(&self.to_string() as &str, true)\n  103 |             .map(String::from)\n  104 |             .collect();\n  105 |     }","lines":9,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/text_input/value.rs#L97-L105"}]},

{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`ResponsiveContainer::layout` calls `self.content.as_widget_mut().layout(...)` up to three times per layout pass: once inside the `unwrap_or_else` closure for `unrestricted_size` (only when `self.size` is `None`), once again immediately after for `cur_unrestricted_size` with the exact same `&Limits::NONE` argument, and once more with the real `limits` for the final `node`. The first two calls are redundant (identical arguments) whenever `self.size` is `None`, and laying out an arbitrary widget subtree is recursive/expensive, so this triples layout cost for every responsive container on every layout pass (which can happen every frame during resize).","fix":"Compute the unrestricted layout once (`let cur_node = self.content.as_widget_mut().layout(&mut tree.children[0], renderer, &Limits::NONE);`) and reuse its `.size()` for both `unrestricted_size`'s fallback and `cur_unrestricted_size`, instead of invoking `layout` twice with identical arguments.","locations":[{"ref":"src/widget/responsive_container.rs:96-136","code":"   96 |         let state = tree.state.downcast_mut::<State>();\n   97 |         let mut unrestricted_size = self.size.unwrap_or_else(|| {\n   98 |             let node =\n   99 |                 self.content\n  100 |                     .as_widget_mut()\n  101 |                     .layout(&mut tree.children[0], renderer, &Limits::NONE);\n  102 |             node.size()\n  103 |         });\n  104 | \n  105 |         let cur_unrestricted_size = {\n  106 |             let node =\n  107 |                 self.content\n  108 |                     .as_widget_mut()\n  109 |                     .layout(&mut tree.children[0], renderer, &Limits::NONE);\n  110 |             node.size()\n  111 |         };\n  112 | \n  113 |         let max_size = limits.max();\n  114 | \n  115 |         let old_max = state.limits.max();\n  116 | \n  117 |         state.needs_update = (cur_unrestricted_size.width > max_size.width)\n  118 |             || (cur_unrestricted_size.width > old_max.width)\n  119 |             || (cur_unrestricted_size.height > max_size.height)\n  120 |             || (cur_unrestricted_size.height > old_max.height)\n  121 |             || ((unrestricted_size.width <= max_size.width)\n  122 |                 && (unrestricted_size.height <= max_size.height)\n  123 |                 && (unrestricted_size.width - cur_unrestricted_size.width > 1.\n  124 |                     || unrestricted_size.height - cur_unrestricted_size.height > 1.));\n  125 | \n  126 |         if unrestricted_size.width < cur_unrestricted_size.width {\n  127 |             state.needs_update = true;\n  128 |             unrestricted_size.width = cur_unrestricted_size.width;\n  129 |         } else if unrestricted_size.height < cur_unrestricted_size.height {\n  130 |             state.needs_update = true;\n  131 |             unrestricted_size.height = cur_unrestricted_size.height;\n  132 |         }\n  133 |         let node = self\n  134 |             .content\n  135 |             .as_widget_mut()\n  136 |             .layout(&mut tree.children[0], renderer, limits);","lines":41,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/responsive_container.rs#L96-L136"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`icon::Button::new`, `extra_small`, `medium`, `large`, and `extra_large` each independently call `crate::theme::THEME.lock().unwrap()` to read spacing values. Chaining presets, e.g. `icon(handle).large()`, locks and unlocks the global `THEME` mutex twice for a single button construction, and this happens on every widget tree rebuild (every view() call). The lock itself is uncontended and cheap, but the pattern is repeated 5 times in this one file and scales with the number of icon buttons built per frame.","fix":"Fetch the theme once per call chain (e.g. lock once in `new()` and pass the already-resolved spacing values down, or have the preset methods take an optional pre-fetched `Spacing` instead of re-locking THEME each time).","locations":[{"ref":"src/widget/button/icon.rs:33-120","code":"   33 | impl<Message> Button<'_, Message> {\n   34 |     pub fn new(icon: Icon) -> Self {\n   35 |         let guard = crate::theme::THEME.lock().unwrap();\n   36 |         let theme = guard.cosmic();\n   37 |         let padding = theme.space_xxs();\n   38 | \n   39 |         Self {\n   40 |             id: Id::unique(),\n   41 |             label: Cow::Borrowed(\"\"),\n   42 |             #[cfg(feature = \"a11y\")]\n   43 |             name: Cow::Borrowed(\"\"),\n   44 |             #[cfg(feature = \"a11y\")]\n   45 |             description: Cow::Borrowed(\"\"),\n   46 |             tooltip: Cow::Borrowed(\"\"),\n   47 |             on_press: None,\n   48 |             width: Length::Shrink,\n   49 |             height: Length::Shrink,\n   50 |             padding: Padding::from(padding),\n   51 |             spacing: theme.space_xxxs(),\n   52 |             icon_size: if icon.handle.symbolic { 16 } else { 24 },\n   53 |             line_height: 20,\n   54 |             font_size: 14,\n   55 |             font_weight: Weight::Normal,\n   56 |             class: B
