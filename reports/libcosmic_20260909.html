 109 |         let theme = guard.cosmic();\n  110 |         let padding = theme.space_xs();\n  111 | \n  112 |         self.font_size = 32;\n  113 |         self.font_weight = Weight::Light;\n  114 |         self.icon_size = 56;\n  115 |         self.line_height = 44;\n  116 |         self.padding = Padding::from(padding);\n  117 |         self.spacing = theme.space_xxs();\n  118 | \n  119 |         self\n  120 |     }","lines":88,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/button/icon.rs#L33-L120"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"multi::widget's State.selections (a Vec<(Item, Plain)>) is used as an association list / cache from Item to its cached text Plain. Both `layout()` and `overlay()`'s width-measuring closure do a linear `iter_mut().find(...)`/`iter().position(...)` scan over this Vec per item per layout/overlay pass instead of using a map keyed by something O(1)-lookupable (or simply storing the Plain alongside the option in the Model). For large multi-list dropdowns (many lists/options) this turns each layout/overlay pass into O(n^2) work just to locate cached paragraphs for measurement.","fix":"Store the Plain paragraph directly alongside each option in the Model (or key the cache by list/option index instead of doing an Item equality scan) so paragraph lookup during layout/overlay is O(1) instead of O(n).","locations":[{"ref":"src/widget/dropdown/multi/widget.rs:95-115","code":"   95 |             self.selections.selected.as_ref().and_then(|id| {\n   96 |                 self.selections.get(id).map(AsRef::as_ref).zip({\n   97 |                     let state = tree.state.downcast_mut::<State<Item>>();\n   98 | \n   99 |                     if state.selections.is_empty() {\n  100 |                         for list in &self.selections.lists {\n  101 |                             for (_, item) in &list.options {\n  102 |                                 state\n  103 |                                     .selections\n  104 |                                     .push((item.clone(), crate::Plain::default()));\n  105 |                             }\n  106 |                         }\n  107 |                     }\n  108 | \n  109 |                     state\n  110 |                         .selections\n  111 |                         .iter_mut()\n  112 |                         .find(|(i, _)| i == id)\n  113 |                         .map(|(_, p)| p)\n  114 |                 })\n  115 |             }),","lines":21,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/dropdown/multi/widget.rs#L95-L115"},{"ref":"src/widget/dropdown/multi/menu.rs:452-468","code":"  452 |                         current_offset += elem_height;\n  453 |                     }\n  454 |                 }\n  455 |             }\n  456 |             _ => {}\n  457 |         }\n  458 |     }\n  459 | \n  460 |     fn mouse_interaction(\n  461 |         &self,\n  462 |         _state: &Tree,\n  463 |         layout: Layout<'_>,\n  464 |         cursor: mouse::Cursor,\n  465 |         _viewport: &Rectangle,\n  466 |         _renderer: &crate::Renderer,\n  467 |     ) -> mouse::Interaction {\n  468 |         let is_mouse_over = cursor.is_over(layout.bounds());","lines":17,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/dropdown/multi/menu.rs#L452-L468"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"HeaderBarWidget::layout (via HeaderBar::view) lays out the `center` element twice per layout pass when a center region is present: once with loose limits purely to measure `natural_width` (lines 211-215), and again with the actual constrained slot width to get the real node (lines 217-221). Since `center` is frequently a text widget (the window title), this means text shaping/measurement work is done twice every layout, which can matter on every resize/redraw for windows with long titles or many resizes in quick succession.","fix":"If avoidable, cache the natural (unconstrained) size from one layout call instead of issuing two separate `.layout()` calls on the same element, or document why the double layout is required (e.g. if `as_widget_mut().layout()` is not idempotent/cheap to call twice, consider exposing a cheaper `measure`-only path).","locations":[{"ref":"src/widget/header_bar.rs:206-227","code":"  206 |         if let Some(center) = &mut self.center {\n  207 |             let slot_start = start_width + gap;\n  208 |             let slot_end = (width - end_width - gap).max(slot_start);\n  209 |             let slot_width = slot_end - slot_start;\n  210 |             // this instead of `node.size().width` prevents center jitter as text ellipsizes\n  211 |             let natural_width = center\n  212 |                 .as_widget_mut()\n  213 |                 .layout(&mut tree.children[2], renderer, &limits.loose())\n  214 |                 .size()\n  215 |                 .width;\n  216 | \n  217 |             let node = center.as_widget_mut().layout(\n  218 |                 &mut tree.children[2],\n  219 |                 renderer,\n  220 |                 &layout::Limits::new(Size::ZERO, Size::new(slot_width, height)),\n  221 |             );\n  222 | \n  223 |             let ideal_x = (width - natural_width) / 2.0;\n  224 |             let max_x = (width - end_width - gap - natural_width).max(slot_start);\n  225 |             let center_x = ideal_x.clamp(slot_start, max_x);\n  226 | \n  227 |             child_nodes.push(vcenter(node, center_x))","lines":22,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/header_bar.rs#L206-L227"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"Model::clear() clones the entire `order` VecDeque and then calls remove() once per entity. Each remove() call performs an O(n) linear scan via position() plus an O(n) VecDeque::remove, making clear() overall O(n^2) in the number of items. For typical tab-bar sizes this is unlikely to matter, but it's a needless inefficiency for an operation that could be done in O(n) by clearing the underlying collections directly.","fix":"Implement clear() by directly clearing items, order, storage, icons, indents, text, and divider_aboves, and resetting the selection state, instead of looping with per-item remove() calls.","locations":[{"ref":"src/widget/segmented_button/model/mod.rs:133-138","code":"  133 |     #[inline]\n  134 |     pub fn clear(&mut self) {\n  135 |         for entity in self.order.clone() {\n  136 |             self.remove(entity);\n  137 |         }\n  138 |     }","lines":6,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/segmented_button/model/mod.rs#L133-L138"}]},

{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"cosmic-theme/src/model/layout.rs defines a `Layout` struct but the module is never declared with `mod layout;` anywhere in model/mod.rs (which lists corner, cosmic_palette, derivation, mode, spacing, theme but not layout). The file is therefore not even compiled into the crate, and `Layout` is unreferenced anywhere in the workspace.","fix":"Either delete cosmic-theme/src/model/layout.rs entirely, or add `mod layout; pub use layout::*;` to model/mod.rs and actually wire `Layout` into the theme/spacing system if it was meant to be used.","locations":[{"ref":"cosmic-theme/src/model/layout.rs:1-4","code":"    1 | #[derive(Default)]\n    2 | pub struct Layout {\n    3 |     corner_radii: [u32; 4],\n    4 | }","lines":4,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/cosmic-theme/src/model/layout.rs#L1-L4"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In `Context::autosize_window`, two local variables are computed but never used: `force_configured` (line 462) is assigned and never read anywhere in the function, and `suggested_window_size` (line 465) is computed and discarded. The latter is especially wasteful because `suggested_window_size()` has an unconditional `info!(\"{configured_height:?}\")` logging side effect (see `src/applet/mod.rs:158`), so every call to `autosize_window` (which runs on every view rebuild) logs a value that is never used.","fix":"Remove the unused `force_configured` and `suggested_window_size` bindings from `autosize_window` if they are not needed, or actually use them (e.g. apply `suggested_window_size` to the limits, or use `force_configured` to decide whether to apply the suggested-bounds limits at all).","locations":[{"ref":"src/applet/mod.rs:459-486","code":"  459 |     pub fn autosize_window<'a, Message: 'static>(\n  460 |         &self,\n  461 |         content: impl Into<Element<'a, Message>>,\n  462 |     ) -> Autosize<'a, Message, crate::Theme, crate::Renderer> {\n  463 |         let force_configured = matches!(&self.panel_type, PanelType::Other(n) if n.is_empty());\n  464 |         let w = autosize(content, AUTOSIZE_MAIN_ID.clone());\n  465 |         let mut limits = Limits::NONE;\n  466 |         let suggested_window_size = self.suggested_window_size();\n  467 | \n  468 |         if let Some(width) = self\n  469 |             .suggested_bounds\n  470 |             .as_ref()\n  471 |             .filter(|c| c.width as i32 > 0)\n  472 |             .map(|c| c.width)\n  473 |         {\n  474 |             limits = limits.width(width);\n  475 |         }\n  476 |         if let Some(height) = self\n  477 |             .suggested_bounds\n  478 |             .as_ref()\n  479 |             .filter(|c| c.height as i32 > 0)\n  480 |             .map(|c| c.height)\n  481 |         {\n  482 |             limits = limits.height(height);\n  483 |         }\n  484 | \n  485 |         w.limits(limits)\n  486 |     }","lines":28,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/applet/mod.rs#L459-L486"}]},
{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"In the `smol`-feature branch of the dbus activation subscription, the spawned background thread's `JoinHandle` is bound to `handle` but never joined, awaited, or stored anywhere -- it is simply dropped when the enclosing async block's scope ends (or leaked, since the thread runs an infinite `loop`). Combined with the `_conn` compile error in the same block, this code path appears to be unfinished/untested. Even once the compile error is fixed, the handle binding serves no purpose as written and the thread becomes an undetached, unmanaged background thread with no shutdown path tied to subscription cancellation.","fix":"Either remove the unused `handle` binding (use `std::thread::spawn(...);` directly if the handle is genuinely not needed), or store/use it so the thread's lifecycle is tied to the subscription (e.g. signal it to stop when the stream loop in the outer function exits).","locations":[{"ref":"src/dbus_activation.rs:52-63","code":"   52 |                         #[cfg(feature = \"smol\")]\n   53 |                         let handle = {\n   54 |                             std::thread::spawn(move || {\n   55 |                                 let conn_clone = _conn.clone();\n   56 | \n   57 |                                 zbus::block_on(async move {\n   58 |                                     loop {\n   59 |                                         conn_clone.executor().tick().await;\n   60 |                                     }\n   61 |                                 })\n   62 |                             })\n   63 |                         };","lines":12,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/dbus_activation.rs#L52-L63"}]},
{"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"Both async executors (`single.rs` single-threaded executor and `multi.rs` multi-threaded executor) implement `spawn` by discarding the `JoinHandle` returned from `tokio::runtime::Runtime::spawn`: `let _res = self.0.spawn(future);`. If the spawned future panics, tokio normally surfaces this through the dropped `JoinHandle`'s `JoinError` only if something polls/awaits it; here it is immediately dropped, so a panicking task silently disappears (the panic is reported to stderr by tokio's default panic hook but the application has no way to detect or react to the failure, and -- depending on the panic hook configuration -- the failure could go unnoticed entirely in a release build with custom panic handling).","fix":"If task failures should be observable, spawn a supervising task that awaits the `JoinHandle` and logs/reports `JoinError`s (panics or cancellations) via `tracing::error!`, instead of discarding the handle outright. At minimum, document why dropping the handle is acceptable for this executor's use case (iced expects `()`-returning futures, so panics are the only failure mode of interest).","locations":[{"ref":"src/executor/single.rs:25-27","code":"   25 |     fn spawn(&self, future: impl Future<Output = ()> + Send + 'static) {\n   26 |         let _res = self.0.spawn(future);\n   27 |     }","lines":3,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/executor/single.rs#L25-L27"},{"ref":"src/executor/multi.rs:21-23","code":"   21 |     fn spawn(&self, future: impl Future<Output = ()> + Send + 'static) {\n   22 |         let _res = self.0.spawn(future);\n   23 |     }","lines":3,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/executor/multi.rs#L21-L23"}]},
{"id":"DEAD_7","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In the toggler Catalog::style match, the `is_toggled` bindings in `toggler::Status::Active { is_toggled }` and `toggler::Status::Disabled { is_toggled }` are captured but never used in their match arm bodies (the Active arm just returns `active` unchanged, the Disabled arm only scales alpha). This is misleading dead code that masks the real bug where is_toggled should actually be consulted (see related logic_error finding) and will trigger an unused-variable warning.","fix":"Either use `is_toggled` in these arms (recommended, see the related disabled-toggler logic bug) or rename the bindings to `_is_toggled` if intentionally unused.","locations":[{"ref":"src/theme/style/iced.rs:969","code":"  969 |             toggler::Status::Active { is_toggled } => active,","lines":1,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/theme/style/iced.rs#L969"},{"ref":"src/theme/style/iced.rs:989","code":"  989 |             toggler::Status::Disabled { is_toggled } => {","lines":1,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/theme/style/iced.rs#L989"}]},
{"id":"DEAD_8","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`date_button` calls `set_day(date, date.day())`, which rebuilds `date` with the same day it already has -- a functional no-op equivalent to just using `date` directly. This is the only call site of the public `set_day` function in the entire codebase, making the indirection pointless and confusing (it reads as if it's doing meaningful date normalization when it isn't).","fix":"Replace `(on_select)(set_day(date, date.day()))` with `(on_select)(date)` directly. If `set_day` is intended as a public utility for downstream consumers, keep it, but remove this no-op call site; otherwise remove `set_day` entirely.","locations":[{"ref":"src/widget/calendar.rs:31-37","code":"   31 | pub fn set_day(date_selected: Date, day: i8) -> Date {\n   32 |     date_selected\n   33 |         .with()\n   34 |         .day(day)\n   35 |         .build()\n   36 |         .unwrap_or(date_selected)\n   37 | }","lines":7,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/calendar.rs#L31-L37"},{"ref":"src/widget/calendar.rs:251-252","code":"  251 |     if is_currently_viewed_month {\n  252 |         button.on_press((on_select)(set_day(date, date.day())))","lines":2,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/calendar.rs#L251-L252"}]},
{"id":"DEAD_9","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`ContextDrawer::on_close: Option<Message>` is set via `on_close_maybe()` and copied through `map()`, but it is never read anywhere in `Widget` impl (`update`, `draw`, etc.) or anywhere else in the crate. The actual close button's message is wired separately inside `new_inner` (consumed into the drawer's `Element` button press handler before the struct is even built), making this field and its public setter `on_close_maybe` completely inert dead state that misleads API users into thinking it controls drawer-close behavior.","fix":"Remove the unused `on_close` field and `on_close_maybe` method from `ContextDrawer`, or wire it to actually be used (e.g. consulted when an Escape key event or outside click is detected in `update`).","locations":[{"ref":"src/widget/context_drawer/widget.rs:17-22","code":"   17 | pub struct ContextDrawer<'a, Message> {\n   18 |     id: Option<iced_core::widget::Id>,\n   19 |     content: Element<'a, Message>,\n   20 |     drawer: Element<'a, Message>,\n   21 |     on_close: Option<Message>,\n   22 | }","lines":6,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/context_drawer/widget.rs#L17-L22"},{"ref":"src/widget/context_drawer/widget.rs:200-205","code":"  200 |     /// Optionally assigns message to `on_close` event.\n  201 |     #[inline]\n  202 |     pub fn on_close_maybe(mut self, message: Option<Message>) -> Self {\n  203 |         self.on_close = message;\n  204 |         self\n  205 |     }","lines":6,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/context_drawer/widget.rs#L200-L205"}]},
{"id":"DEAD_10","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`pub fn get_mut_or_default` is a public function defined in menu_bar.rs but is never called anywhere in the menu module or the rest of the crate, and it is not re-exported from widget/menu.rs (which selectively re-exports MenuBar, bar, Appearance, StyleSheet, menu_roots_children, menu_roots_diff but not this function). It is unreachable dead code.","fix":"Remove get_mut_or_default if it has no remaining use case, or mark it pub(crate) and use it where intended if it was meant to replace inline resize-and-index logic elsewhere.","locations":[{"ref":"src/widget/menu/menu_bar.rs:162-169","code":"  162 | pub fn get_mut_or_default<T: Default>(vec: &mut Vec<T>, index: usize) -> &mut T {\n  163 |     if index < vec.len() {\n  164 |         &mut vec[index]\n  165 |     } else {\n  166 |         vec.resize_with(index + 1, T::default);\n  167 |         &mut vec[index]\n  168 |     }\n  169 | }","lines":8,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/menu/menu_bar.rs#L162-L169"}]},
{"id":"DEAD_11","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"Menu::menu_roots is typed as `Cow<'b, [MenuTree<Message>]>`, and the code has two `Cow::Borrowed(_) => panic!()` arms to handle the borrowed case defensively. However, every construction site of a `Menu` struct in the crate (4 call sites checked) always uses `Cow::Owned(...)`; the Borrowed variant is never actually constructed. This means the Cow abstraction and its lifetime parameter add complexity (and a panic risk if ever misused) without providing any real benefit, since the borrowed path is dead in practice.","fix":"Replace `Cow<'b, [MenuTree<Message>]>` with a plain `Vec<MenuTree<Message>>` (dropping the now-unnecessary lifetime parameter `'b` on Menu), removing the two panic!() arms entirely since there is no longer a Borrowed variant to match against.","locations":[{"ref":"src/widget/menu/menu_inner.rs:439","code":"  439 |     pub(crate) menu_roots: Cow<'b, [MenuTree<Message>]>,","lines":1,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/menu/menu_inner.rs#L439"},{"ref":"src/widget/menu/menu_inner.rs:579","code":"  579 |             Cow::Borrowed(_) => panic!(),","lines":1,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/menu/menu_inner.rs#L579"},{"ref":"src/widget/menu/menu_inner.rs:1351","code":" 1351 |         Cow::Borrowed(_) => panic!(),","lines":1,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/menu/menu_inner.rs#L1351"}]},
{"id":"DEAD_12","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`use event::Status::{Captured, Ignored};` is imported in two functions (Menu::update and process_scroll_events) but neither Captured nor Ignored is referenced anywhere in either function body, making both imports dead code that should trigger unused-import warnings (likely suppressed by other #[allow] attributes on these functions).","fix":"Remove the unused `use event::Status::{Captured, Ignored};` lines from both functions.","locations":[{"ref":"src/widget/menu/menu_inner.rs:560","code":"  560 |         use event::Status::{Captured, Ignored};","lines":1,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/menu/menu_inner.rs#L560"},{"ref":"src/widget/menu/menu_inner.rs:1643","code":" 1643 |     use event::Status::{Captured, Ignored};","lines":1,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/menu/menu_inner.rs#L1643"}]},
{"id":"DEAD_13","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"Popover defines a local `State { is_open: bool }` struct (with `#[derive(Debug, Default)]`) but the `Popover` widget never implements `tag()`/`state()` to install it into the widget tree, and `is_open` is never read or written anywhere in the file. It is entirely dead code.","fix":"Remove the unused `State` struct, or if popover open/close tracking was intended to be tracked here rather than implicitly via `Option<popup>`, wire it up via `tag()`/`state()` and actually use it.","locations":[{"ref":"src/widget/popover.rs:511-515","code":"  511 | /// The local state of a [`Popover`].\n  512 | #[derive(Debug, Default)]\n  513 | struct State {\n  514 |     is_open: bool,\n  515 | }","lines":5,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/popover.rs#L511-L515"}]},
{"id":"DEAD_14","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In the Wayland DnD Offer::Enter handler, `is_clicked` is computed from text_layout bounds but never read anywhere in the match arm, and inside the mime-type loop `let clone = m.clone();` is assigned to a never-used binding for every matching mime type. Both are leftover/vestigial code that does nothing but waste cycles per DnD enter event.","fix":"Remove the unused `is_clicked` binding and the unused `clone` binding (the loop can just be `accepted = mime_types.iter().any(|m| SUPPORTED_TEXT_MIME_TYPES.contains(&m.as_str()))`).","locations":[{"ref":"src/widget/text_input/input.rs:2386-2389","code":" 2386 |             let is_clicked = text_layout.bounds().contains(Point {\n 2387 |                 x: *x as f32,\n 2388 |                 y: *y as f32,\n 2389 |             });","lines":4,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/text_input/input.rs#L2386-L2389"},{"ref":"src/widget/text_input/input.rs:2391-2397","code":" 2391 |             let mut accepted = false;\n 2392 |             for m in mime_types {\n 2393 |                 if SUPPORTED_TEXT_MIME_TYPES.contains(&m.as_str()) {\n 2394 |                     let clone = m.clone();\n 2395 |                     accepted = true;\n 2396 |                 }\n 2397 |             }","lines":7,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/text_input/input.rs#L2391-L2397"}]},
{"id":"DEAD_15","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"In Base::name(), the `ThemeType::Custom(theme)` arm binds `theme` but never uses it (the arm just returns a constant string), and the `ThemeType::System { prefer_dark, theme }` arm binds `prefer_dark` but never uses it either. These produce unused-variable noise and obscure that the Custom theme's actual name (if it has one) is being discarded in favor of a generic label, unlike the System arm which does use `theme.name`.","fix":"Rename unused bindings to `_theme`/`_prefer_dark`, or for the Custom arm consider returning the custom theme's actual name if `CosmicTheme` exposes one, for consistency with the System arm.","locations":[{"ref":"src/theme/style/iced.rs:1672-1680","code":" 1672 |     fn name(&self) -> &str {\n 1673 |         match &self.theme_type {\n 1674 |             crate::theme::ThemeType::Dark => \"Cosmic Dark Theme\",\n 1675 |             crate::theme::ThemeType::Light => \"Cosmic Light Theme\",\n 1676 |             crate::theme::ThemeType::HighContrastDark => \"Cosmic High Contrast Dark Theme\",\n 1677 |             crate::theme::ThemeType::HighContrastLight => \"Cosmic High Contrast Light Theme\",\n 1678 |             crate::theme::ThemeType::Custom(theme) => \"Custom Cosmic Theme\",\n 1679 |             crate::theme::ThemeType::System { prefer_dark, theme } => &theme.name,\n 1680 |         }","lines":9,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/theme/style/iced.rs#L1672-L1680"}]},
{"id":"DEAD_16","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"`use std::ffi::OsStr;` is imported but never referenced anywhere else in either file (verified: the identifier `OsStr` appears exactly once per file, the import line itself). This is leftover/unused dead code in both the single-select and multi-select Dropdown widget files.","fix":"Remove the unused `use std::ffi::OsStr;` import from both files.","locations":[{"ref":"src/widget/dropdown/widget.rs:20","code":"   20 | use std::ffi::OsStr;","lines":1,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/dropdown/widget.rs#L20"},{"ref":"src/widget/dropdown/multi/widget.rs:16","code":"   16 | use std::ffi::OsStr;","lines":1,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/dropdown/multi/widget.rs#L16"}]},
{"id":"DEAD_17","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"`bundle::get(icon_name: &str)` on unix (non-macOS) platforms takes a named parameter that is never used in the function body (it always returns `None`), which differs from the non-unix variant a few lines below that does use the parameter to look up `ICONS`. This generates an unused-variable warning and signals the function signature/behavior pairing is easy to get out of sync across the cfg-gated variants.","fix":"Rename the parameter to `_icon_name` in the unix branch to silence the warning and make the intentional no-op explicit.","locations":[{"ref":"src/widget/icon/bundle.rs:6-10","code":"    6 | /// Icon bundling is not enabled on unix platforms.\n    7 | #[cfg(all(unix, not(target_os = \"macos\")))]\n    8 | pub fn get(icon_name: &str) -> Option<super::Data> {\n    9 |     None\n   10 | }","lines":5,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/icon/bundle.rs#L6-L10"}]},
{"id":"DEAD_18","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"The redundant condition `menu.is_overlay && mb.children_bounds.contains(overlay_cursor)` includes a `menu.is_overlay &&` check inside a branch that is already gated by `if menu.is_overlay && menu.close_condition.leave` two lines above, so `menu.is_overlay` is always true at that point and the check is a no-op leftover, likely from a prior refactor that used to share this loop between overlay and non-overlay code paths.","fix":"Drop the redundant `menu.is_overlay &&` from line 1421 since it is already implied by the enclosing if-condition, to avoid confusing future readers into thinking this branch can run with is_overlay == false.","locations":[{"ref":"src/widget/menu/menu_inner.rs:1444-1452","code":" 1444 |             if menu.is_overlay && menu.close_condition.leave {\n 1445 |                 for i in (0..state.menu_states.len()).rev() {\n 1446 |                     let mb = &state.menu_states[i].menu_bounds;\n 1447 | \n 1448 |                     if mb.parent_bounds.contains(overlay_cursor)\n 1449 |                         || menu.is_overlay && mb.children_bounds.contains(overlay_cursor)\n 1450 |                         || mb.offset_bounds.contains(overlay_cursor)\n 1451 |                         || (mb.check_bounds.contains(overlay_cursor)\n 1452 |                             && prev_bounds.iter().all(|pvb| !pvb.contains(overlay_cursor)))","lines":9,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/menu/menu_inner.rs#L1444-L1452"}]},

{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"The comment `//TODO: sanitize key (no slashes, cannot be . or ..)` is stale: `ConfigTransaction::set` immediately calls `self.config.key_path(key)`, which already calls `sanitize_name(key)` internally (lib.rs:377-382), rejecting any key containing `.`, `..`, or path separators. The TODO inaccurately suggests this is an open security gap when it is already handled.","fix":"Remove the stale TODO comment, since `key_path` already sanitizes the key via `sanitize_name`.","locations":[{"ref":"cosmic-config/src/lib.rs:482","code":"  482 |         //TODO: sanitize key (no slashes, cannot be . or ..)","lines":1,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/cosmic-config/src/lib.rs#L482"}]},

{"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"medium","difficulty":"medium","description":"Divider rendering is implemented via two completely different and non-interoperable mechanisms depending on orientation. Horizontal layout draws a divider after every item based on the single boolean `self.dividers` widget setting (only when style is Control), and entirely ignores the per-item `model.divider_above(key)` data. Vertical layout does the exact opposite: it only consults `model.divider_above(key)` per item and entirely ignores `self.dividers`. This means the `divider_above()` builder/EntityMut method (set on individual items) silently has no visual effect at all when used with a horizontal SegmentedButton, which is a confusing API trap for callers who don't realize divider behavior differs by orientation.","fix":"Unify the divider mechanism: either have both orientations honor per-item divider_above data, or have both honor the dividers flag, and document/share the logic via a common helper instead of duplicating divergent implementations.","locations":[{"ref":"src/widget/segmented_button/horizontal.rs:96-106","code":"   96 |                     if self.dividers && is_control && nth + 1 < num {\n   97 |                         divider = Some(ItemBounds::Divider(\n   98 |                             Rectangle {\n   99 |                                 width: 1.0,\n  100 |                                 ..bounds\n  101 |                             },\n  102 |                             true,\n  103 |                         ));\n  104 | \n  105 |                         bounds.x += 1.0;\n  106 |                     }","lines":11,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/segmented_button/horizontal.rs#L96-L106"},{"ref":"src/widget/segmented_button/vertical.rs:62-73","code":"   62 |                 .flat_map(move |(nth, key)| {\n   63 |                     let mut divider = Non {"id":"ARCH_4","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"`Cards` (the `Widget` impl struct returned by `widget::cards(...)`) is declared `pub struct Cards` inside a private module (`mod cards;` in mod.rs), and mod.rs only re-exports the constructor function (`pub use cards::cards;`), never the type itself. Every sibling widget in this same file (Toggler, HeaderBar, Radio, Popover, ContextMenu, DndSource, DndDestination, etc.) re-exports both the constructor and the type name. As a result, external users of the `cosmic::widget::cards(...)` builder can call its builder methods (`.width()`, `.anim_multiplier()`, `.duration()`, `.id()`) fluently, but cannot name the `Cards<'a, Message, Renderer>` type itself (e.g. to store it in a struct field or write a function returning it), and the public function technically leaks a type that is private-by-path, which is the kind of inconsistency `private_interfaces`-style lints flag.","fix":"Re-export the type alongside the constructor for consistency with every other widget in this module: change line 135 to `pub use cards::{Cards, cards};` (or make `mod cards` itself `pub`).","locations":[{"ref":"src/widget/mod.rs:134-136","code":"  134 | mod cards;\n  135 | #[doc(inline)]\n  136 | pub use cards::cards;","lines":3,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/mod.rs#L134-L136"},{"ref":"src/widget/cards.rs:74-87","code":"   74 | pub struct Cards<'a, Message, Renderer = crate::Renderer>\n   75 | where\n   76 |     Renderer: iced_core::text::Renderer,\n   77 | {\n   78 |     id: Id,\n   79 |     show_less_button: Element<'a, Message, crate::Theme, Renderer>,\n   80 |     clear_all_button: Element<'a, Message, crate::Theme, Renderer>,\n   81 |     elements: Vec<Element<'a, Message, crate::Theme, Renderer>>,\n   82 |     expanded: bool,\n   83 |     can_show_more: bool,\n   84 |     width: Length,\n   85 |     anim_multiplier: f32,\n   86 |     duration: Duration,\n   87 | }","lines":14,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/cards.rs#L74-L87"}]},
{"id":"OTHER_1","type":"other","type_label":"Other","severity":"critical","difficulty":"easy","description":"In the `smol`-feature branch of the dbus activation subscription, a background thread is spawned that calls `_conn.clone()`, but no variable named `_conn` exists anywhere in scope -- only `conn` (bound by `if let Ok(conn) = builder.build().await`) is defined. This is a use of an undeclared identifier, which fails to compile (E0425) whenever the crate is built with `single-instance` and `smol` enabled together (both are independent, combinable Cargo features). The whole `single-instance` feature is unusable with the `smol` runtime as a result.","fix":"Change `let conn_clone = _conn.clone();` to `let conn_clone = conn.clone();`, capturing the actual `conn` connection variable defined a few lines above. Also confirm the closure correctly captures `conn` (clone it before moving into `std::thread::spawn` if needed).","locations":[{"ref":"src/dbus_activation.rs:52-63","code":"   52 |                         #[cfg(feature = \"smol\")]\n   53 |                         let handle = {\n   54 |                             std::thread::spawn(move || {\n   55 |                                 let conn_clone = _conn.clone();\n   56 | \n   57 |                                 zbus::block_on(async move {\n   58 |                                     loop {\n   59 |                                         conn_clone.executor().tick().await;\n   60 |                                     }\n   61 |                                 })\n   62 |                             })\n   63 |                         };","lines":12,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/dbus_activation.rs#L52-L63"}]},
{"id":"OTHER_2","type":"other","type_label":"Other","severity":"high","difficulty":"medium","description":"DndSource's `state.is_dragging` is only ever reset to false inside the `SourceEvent::Cancelled` or `SourceEvent::Finished` event arms. There is no fallback (timeout, window-focus-lost handling, Escape key, or widget-removal cleanup) for cases where the platform/compositor never emits one of those two events for an in-progress drag (e.g. the surface is destroyed, the compositor crashes/restarts, or the drag is otherwise abandoned). When that happens `is_dragging` stays stuck at true forever: `mouse_interaction` keeps returning `Grabbing` permanently for that widget, and `on_cancelled`/`on_finish` never fire, desyncing the widget's visible state from reality with no way to recover short of restarting the app.","fix":"Add a defensive reset path: e.g. clear `is_dragging` (and treat it as cancelled) on window focus-lost / CursorLeft-while-dragging events, or track a start Instant and time out the drag after a few seconds without a terminal Source event, publishing `on_cancelled` in that case.","locations":[{"ref":"src/widget/dnd_source.rs:258-271","code":"  258 |                         if let Some(left_pressed_position) = state.left_pressed_position\n  259 |                             && position.distance(left_pressed_position) > self.drag_threshold\n  260 |                         {\n  261 |                             if let Some(on_start) = self.on_start.as_ref() {\n  262 |                                 shell.publish(on_start.clone());\n  263 |                             }\n  264 |                             let offset = Vector::new(\n  265 |                                 left_pressed_position.x - layout.bounds().x,\n  266 |                                 left_pressed_position.y - layout.bounds().y,\n  267 |                             );\n  268 |                             self.start_dnd(clipboard, state.cached_bounds, offset);\n  269 |                             state.is_dragging = true;\n  270 |                             state.left_pressed_position = None;\n  271 |                         }","lines":14,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/dnd_source.rs#L258-L271"},{"ref":"src/widget/dnd_source.rs:280-297","code":"  280 |             Event::Dnd(DndEvent::Source(SourceEvent::Cancelled)) => {\n  281 |                 if state.is_dragging {\n  282 |                     if let Some(m) = self.on_cancelled.as_ref() {\n  283 |                         shell.publish(m.clone());\n  284 |                     }\n  285 |                     state.is_dragging = false;\n  286 |                     shell.capture_event();\n  287 |                 }\n  288 |             }\n  289 |             Event::Dnd(DndEvent::Source(SourceEvent::Finished)) => {\n  290 |                 if state.is_dragging {\n  291 |                     if let Some(m) = self.on_finish.as_ref() {\n  292 |                         shell.publish(m.clone());\n  293 |                     }\n  294 |                     state.is_dragging = false;\n  295 |                     shell.capture_event();\n  296 |                 }\n  297 |             }","lines":18,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/dnd_source.rs#L280-L297"},{"ref":"src/widget/dnd_source.rs:408-420","code":"  408 | /// Local state of the [`MouseListener`].\n  409 | #[derive(Debug, Default)]\n  410 | struct State {\n  411 |     left_pressed_position: Option<Point>,\n  412 |     is_dragging: bool,\n  413 |     cached_bounds: Rectangle,\n  414 | }\n  415 | \n  416 | impl State {\n  417 |     fn new() -> Self {\n  418 |         Self::default()\n  419 |     }\n  420 | }","lines":13,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/dnd_source.rs#L408-L420"}]},
{"id":"OTHER_3","type":"other","type_label":"Other","severity":"high","difficulty":"medium","description":"menu_roots_diff casts a shared reference (`&mt.item`, obtained from `root: &MenuTree` via `menu_roots.iter()`, an immutable iterator) to a raw `*const dyn Widget`, then to `*mut dyn Widget`, then dereferences it as `&mut` inside an unsafe block. This casts away the immutability guarantee of the original `&` borrow and produces a mutable alias to data that the type system believes is only shared-borrowed elsewhere (since `menu_roots: &mut [MenuTree<Message>]` is the actual mutable reference, but the inner `.iter()` only re-borrows it immutably before the cast happens). This is the exact pattern the `invalid_reference_casting` lint exists to catch (note the `#[allow(invalid_reference_casting)]` annotation acknowledging this), and is undefined behavior under Rust's aliasing model even if no observable corruption occurs in practice. The accompanying `//TODO: find a way to diff_children without unsafe code` comment confirms this is a known, unresolved workaround.","fix":"Change menu_roots.iter() to menu_roots.iter_mut() so the original borrow is already mutable, removing the need for the const-to-mut pointer cast entirely (the closure can then take `mt: &mut MenuTree` and produce `&mut dyn Widget` directly via a safe reborrow).","locations":[{"ref":"src/widget/menu/menu_bar.rs:118-145","code":"  118 | #[allow(invalid_reference_casting)]\n  119 | pub(crate) fn menu_roots_diff<Message>(menu_roots: &mut [MenuTree<Message>], tree: &mut Tree)\n  120 | where\n  121 |     Message: Clone + 'static,\n  122 | {\n  123 |     if tree.children.len() > menu_roots.len() {\n  124 |         tree.children.truncate(menu_roots.len());\n  125 |     }\n  126 | \n  127 |     tree.children\n  128 |         .iter_mut()\n  129 |         .zip(menu_roots.iter())\n  130 |         .for_each(|(t, root)| {\n  131 |             let mut flat = root\n  132 |                 .flattern()\n  133 |                 .iter()\n  134 |                 .map(|mt| {\n  135 |                     let widget = &mt.item;\n  136 |                     let widget_ptr = widget as *const dyn Widget<Message, crate::Theme, Renderer>;\n  137 |                     let widget_ptr_mut =\n  138 |                         widget_ptr as *mut dyn Widget<Message, crate::Theme, Renderer>;\n  139 |                     //TODO: find a way to diff_children without unsafe code\n  140 |                     unsafe { &mut *widget_ptr_mut }\n  141 |                 })\n  142 |                 .collect::<Vec<_>>();\n  143 | \n  144 |             t.diff_children(flat.as_mut_slice());\n  145 |         });","lines":28,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/menu/menu_bar.rs#L118-L145"}]},
{"id":"OTHER_4","type":"other","type_label":"Other","severity":"medium","difficulty":"easy","description":"Theme::to_high_contrast is a public, documented method (\"Convert the theme to a high-contrast variant\") whose body is `todo!()`, so calling it always panics. Since high-contrast palettes already exist as builder constructors (ThemeBuilder::dark_high_contrast/light_high_contrast), shipping an unimplemented public API that panics is a foot-gun for any downstream consumer who discovers and calls it.","fix":"Either implement the conversion (e.g. rebuild via ThemeBuilder using the existing palette but switching to the HighContrast* variant), or remove the method/mark it deprecated until implemented, so the public API surface doesn't contain a guaranteed panic.","locations":[{"ref":"cosmic-theme/src/model/theme.rs:204-208","code":"  204 |     #[inline]\n  205 |     /// Convert the theme to a high-contrast variant\n  206 |     pub fn to_high_contrast(&self) -> Self {\n  207 |         todo!();\n  208 |     }","lines":5,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/cosmic-theme/src/model/theme.rs#L204-L208"}]},
{"id":"OTHER_5","type":"other","type_label":"Other","severity":"medium","difficulty":"medium","description":"ContextMenu::update contains a self-acknowledged unresolved design gap: the comment at line 343 (\"XXX this should reset the state if there are no other copies of the state, which implies no dropdown menus open\") documents that the `reset` logic does not actually check whether other copies of `LocalState`/`MenuBarState` exist. Since `MenuBarState.inner` is an `RcWrapper` (reference-counted shared state), and the overlay built in `overlay()`/`create_popup()` clones `menu_bar_state` (so the live overlay and the tree-owned state alias the same inner data), the `reset` heuristic at lines 344-359 can behave unpredictably: it triggers based solely on `!d.open && !d.active_root.is_empty()` without regard to whether an overlay clone is still actively using that shared state, which is exactly the scenario the XXX comment flags as unhandled.","fix":"Resolve the XXX: either track a reference count / liveness flag on the shared inner state to know when it is safe to reset, or restructure so the popup overlay does not alias the same `RcWrapper` instance that `reset` mutates.","locations":[{"ref":"src/widget/context_menu.rs:346-365","code":"  346 |         let state = tree.state.downcast_mut::<LocalState>();\n  347 |         let bounds = layout.bounds();\n  348 | \n  349 |         // XXX this should reset the state if there are no other copies of the state, which implies no dropdown menus open.\n  350 |         let reset = self.window_id != window::Id::NONE\n  351 |             && state\n  352 |                 .menu_bar_state\n  353 |                 .inner\n  354 |                 .with_data(|d| !d.open && !d.active_root.is_empty());\n  355 | \n  356 |         let open = state.menu_bar_state.inner.with_data_mut(|state| {\n  357 |             if reset\n  358 |                 && let Some(popup_id) = state.popup_id.get(&self.window_id).copied()\n  359 |                 && let Some(handler) = self.on_surface_action.as_ref()\n  360 |             {\n  361 |                 shell.publish((handler)(crate::surface::Action::DestroyPopup(popup_id)));\n  362 |                 state.reset();\n  363 |             }\n  364 |             state.open\n  365 |         });","lines":20,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/context_menu.rs#L346-L365"}]},
{"id":"OTHER_6","type":"other","type_label":"Other","severity":"medium","difficulty":"medium","description":"`Toasts::push` only schedules the auto-dismiss timer (`tokio::time::sleep` followed by `on_close(id)`) under `#[cfg(feature = \"tokio\")]`; the `#[cfg(not(feature = \"tokio\"))]` branch just returns `Task::none()`. Elsewhere in the same crate (e.g. the wayland tooltip's delayed-popup logic) both `tokio` and `async-std` feature flags are supported for sleeping. Building libcosmic with the `async-std` feature instead of `tokio` silently disables toast auto-dismissal: toasts will accumulate (up to the internal `limit`) and only ever be removed by eviction or an explicit `Toasts::remove` call, never by their configured `Duration`.","fix":"Add an `#[cfg(feature = \"async-std\")]` branch using `async_std::task::sleep(duration).await` mirroring the pattern already used in src/widget/wayland/tooltip/widget.rs, so toast duration works consistently across the supported async runtimes.","locations":[{"ref":"src/widget/toaster/mod.rs:173-201","code":"  173 |     /// Add a new [`Toast`]\n  174 |     pub fn push(&mut self, toast: Toast<Message>) -> Task<Message> {\n  175 |         while self.toasts.len() >= self.limit {\n  176 |             self.toasts.remove(\n  177 |                 self.queue\n  178 |                     .pop_front()\n  179 |                     .expect(\"Queue must contain all toast ids\"),\n  180 |             );\n  181 |         }\n  182 | \n  183 |         #[cfg(feature = \"tokio\")]\n  184 |         let duration = toast.duration.duration();\n  185 | \n  186 |         let id = self.toasts.insert(toast);\n  187 |         self.queue.push_back(id);\n  188 | \n  189 |         #[cfg(feature = \"tokio\")]\n  190 |         {\n  191 |             let on_close = self.on_close;\n  192 |             crate::task::future(async move {\n  193 |                 tokio::time::sleep(duration).await;\n  194 |                 on_close(id)\n  195 |             })\n  196 {"id":"OTHER_7","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"`AspectRatio::constrain_limits` divides `size.width / size.height` and, in the else branch, `width / self.ratio` with no validation that `height` or `ratio` are non-zero/positive/finite. `ratio` is a public, unvalidated `f32` constructor parameter (`aspect_ratio_container(content, ratio)`), and `limits.min()` is commonly `Size::ZERO`, so a zero height yields `NaN` or `inf` from the division, and a zero/negative `ratio` passed by a caller propagates `NaN`/`inf`/wrong-signed sizes into the layout limits, which can cascade into rendering glitches or panics deeper in iced's layout/arithmetic.","fix":"Validate `ratio` in `AspectRatio::new`/`aspect_ratio_container` (e.g. `assert!(ratio.is_finite() && ratio > 0.0)` or clamp to a sane default), and guard `constrain_limits` against zero-height/zero-width inputs before dividing, e.g. returning the input `size` unchanged when either dimension is zero.","locations":[{"ref":"src/widget/aspect_ratio.rs:38-49","code":"   38 |     fn constrain_limits(&self, size: Size) -> Size {\n   39 |         let Size {\n   40 |             mut width,\n   41 |             mut height,\n   42 |         } = size;\n   43 |         if size.width / size.height > self.ratio {\n   44 |             width = self.ratio * height;\n   45 |         } else {\n   46 |             height = width / self.ratio;\n   47 |         }\n   48 |         Size { width, height }\n   49 |     }","lines":12,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/aspect_ratio.rs#L38-L49"},{"ref":"src/widget/aspect_ratio.rs:14-22","code":"   14 | pub fn aspect_ratio_container<'a, Message: 'static, T>(\n   15 |     content: T,\n   16 |     ratio: f32,\n   17 | ) -> AspectRatio<'a, Message, crate::Renderer>\n   18 | where\n   19 |     T: Into<Element<'a, Message, crate::Theme, crate::Renderer>>,\n   20 | {\n   21 |     AspectRatio: {"id":"OTHER_8","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"In `sync_slot_positions`, `drag_item_index` is read out of `state.drag.as_ref()` into a snapshot tuple, and a few lines later is written straight back into `drag.item_index` (`drag.item_index = drag_item_index`) without ever being changed in between. The assignment is a no-op that adds confusion about whether `item_index` is supposed to be recomputed here (it visually suggests `item_index` tracks something dynamic, but it never changes during a drag).","fix":"Remove the redundant `drag.item_index = drag_item_index;` line (or, if `item_index` actually needs to be recomputed for some scenario, add a comment explaining why and fix the assignment to use a recomputed value instead of the unchanged snapshot).","locations":[{"ref":"src/widget/reorderable_flex_row/widget.rs:399-446","code":"  399 |         let Some(drag_snapshot) = state.drag.as_ref().map(|drag| {\n  400 |             (\n  401 |                 drag.key.clone(),\n  402 |                 drag.cursor_local,\n  403 |                 drag.pointer_offset,\n  404 |                 drag.item_index,\n  405 |             )\n  406 |         }) else {\n  407 |             for slot in slots {\n  408 |                 state.apply_layout_position(\n  409 |                     &slot.key,\n  410 |                     Point::new(slot.bounds.x, slot.bounds.y),\n  411 |                     self.animation_duration,\n  412 |                 );\n  413 |             }\n  414 |             return;\n  415 |         };\n  416 | \n  417 |         let (drag_key, cursor_local, pointer_offset, drag_item_index) = drag_snapshot;\n  418 | \n  419 |         let Some(dragged_slot) = slots.iter().find(|slot| slot.key == drag_key) else {\n  420 |             state.drag = None;\n  421 |             for slot in slots {\n  422 |                 state.apply_layout_position(\n  423 |                     &slot.key,\n  424 |                     Poi {"id":"OTHER_11","type":"other","type_label":"Other","severity":"negligible","difficulty":"easy","description":"start_tab_drag logs a hardcoded `data_len = 0` as the 'bytes' count of the drag payload, but the actual drag data constructed two lines later is `SimpleDragData::new(tab_drag.mime.clone(), vec![1])`, a 1-byte payload. The trace log will always claim 'bytes=0' regardless of the real payload size, which is misleading when debugging drag-and-drop issues via the TAB_REORDER_LOG_TARGET trace logs.","fix":"Either remove the unused data_len variable and log literal '1', or compute it from the actual payload, e.g. `let data_len = 1;` matching `vec![1]`, or derive it from the SimpleDragData bytes length.","locations":[{"ref":"src/widget/segmented_button/widget.rs:835-851","code":"  835 |         let data_len = 0;\n  836 | \n  837 |         iced_core::clipboard::start_dnd::<crate::Theme, crate::Renderer>(\n  838 |             clipboard,\n  839 |             false,\n  840 |             Some(iced_core::clipboard::DndSource::Widget(self.id.0.clone())),\n  841 |             None,\n  842 |             Box::new(SimpleDragData::new(tab_drag.mime.clone(), vec![1])),\n  843 |             DndAction::Move,\n  844 |         );\n  845 |         log::trace!(\n  846 |             target: TAB_REORDER_LOG_TARGET,\n  847 |             \"tab drag started entity={:?} mime={} bytes={}\",\n  848 |             entity,\n  849 |             tab_drag.mime,\n  850 |             data_len\n  851 |         );","lines":17,"link":"https://github.com/pop-os/libcosmic/blob/0304f1d92e2d2db4b05624d9ba827cca03c0407d/src/widget/segmented_button/widget.rs#L835-L851"}]},
