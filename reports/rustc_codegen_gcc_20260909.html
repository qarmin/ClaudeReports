{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In `codegen`, the `EmitObj::ObjectCode(_)` branch reads up to four environment variables (`CG_GCCJIT_DUMP_MODULE_NAMES`, `CG_GCCJIT_DUMP_ALL_MODULES`, `CG_GCCJIT_DUMP_MODULE`, `CG_GCCJIT_DUMP_TO_FILE`) via `env::var(...)` on every module codegen. `new_context` in gcc_util.rs reads a further ~11 env vars per context creation. `env::var` is comparatively expensive (allocates, locks process env) and these are invoked once per CGU; for many-CGU builds this is repeated work for values that never change during a compilation.","fix":"Read these env vars once into a lazily-initialized static (e.g. `LazyLock`) or compute them at backend setup and thread the booleans through, instead of re-querying the environment per module.","locations":[{"ref":"src/back/write.rs:90-108","code":"   90 |                 if env::var(\"CG_GCCJIT_DUMP_MODULE_NAMES\").as_deref() == Ok(\"1\") {\n   91 |                     println!(\"Module {}\", module.name);\n   92 |                 }\n   93 |                 if env::var(\"CG_GCCJIT_DUMP_ALL_MODULES\").as_deref() == Ok(\"1\")\n   94 |                     || env::var(\"CG_GCCJIT_DUMP_MODULE\").as_deref() == Ok(&module.name)\n   95 |                 {\n   96 |                     println!(\"Dumping reproducer {}\", module.name);\n   97 |                     let _ = fs::create_dir(\"/tmp/reproducers\");\n   98 |                     // FIXME(antoyo): segfault in dump_reproducer_to_file() might be caused by\n   99 |                     // transmuting an rvalue to an lvalue.\n  100 |                     // Segfault is actually in gcc::jit::reproducer::get_identifier_as_lvalue\n  101 |                     context.dump_reproducer_to_file(format!(\"/tmp/reproducers/{}.c\", module.name));\n  102 |                     println!(\"Dumped reproducer {}\", module.name);\n  103 |                 }\n  104 |                 if env::var(\"CG_GCCJIT_DUMP_TO_FILE\").as_deref() == Ok(\"1\") {\n  105 |                     let _ = fs::create_dir(\"/tmp/gccjit_dumps\");\n  106 |                     let path = &format!(\"/tmp/gccjit_dumps/{}.c\", module.name);\n  107 |                     context.set_debug_info(true);\n  108 |                     context.dump_to_file(path, true);","lines":19,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/back/write.rs#L90-L108"},{"ref":"src/gcc_util.rs:244-270","code":"  244 |     if env::var(\"CG_GCCJIT_DUMP_RTL\").as_deref() == Ok(\"1\") {\n  245 |         context.add_command_line_option(\"-fdump-rtl-vregs\");\n  246 |     }\n  247 |     if env::var(\"CG_GCCJIT_DUMP_RTL_ALL\").as_deref() == Ok(\"1\") {\n  248 |         context.add_command_line_option(\"-fdump-rtl-all\");\n  249 |     }\n  250 |     if env::var(\"CG_GCCJIT_DUMP_TREE_ALL\").as_deref() == Ok(\"1\") {\n  251 |         context.add_command_line_option(\"-fdump-tree-all-eh\");\n  252 |     }\n  253 |     if env::var(\"CG_GCCJIT_DUMP_IPA_ALL\").as_deref() == Ok(\"1\") {\n  254 |         context.add_command_line_option(\"-fdump-ipa-all-eh\");\n  255 |     }\n  256 |     if env::var(\"CG_GCCJIT_DUMP_CODE\").as_deref() == Ok(\"1\") {\n  257 |         context.set_dump_code_on_compile(true);\n  258 |     }\n  259 |     if env::var(\"CG_GCCJIT_DUMP_GIMPLE\").as_deref() == Ok(\"1\") {\n  260 |         context.set_dump_initial_gimple(true);\n  261 |     }\n  262 |     if env::var(\"CG_GCCJIT_DUMP_EVERYTHING\").as_deref() == Ok(\"1\") {\n  263 |         context.set_dump_everything(true);\n  264 |     }\n  265 |     if env::var(\"CG_GCCJIT_KEEP_INTERMEDIATES\").as_deref() == Ok(\"1\") {\n  266 |         context.set_keep_intermediates(true);\n  267 |     }\n  268 |     if env::var(\"CG_GCCJIT_VERBOSE\").as_deref() == Ok(\"1\") {\n  269 |         context.add_driver_option(\"-v\");\n  270 |     }","lines":27,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/gcc_util.rs#L244-L270"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"function_ptr_call computes `let func_name = format!(\"{:?}\", func_ptr);` on every indirect call, and check_ptr_call also does `format!(\"{:?}\", func_ptr)` again. These Debug formats of an RValue are non-trivial and run on every function-pointer call even when no intrinsic adjustment or arg cast is needed (the common case). Two full Debug renders per indirect call.","fix":"Compute the func_name once and pass it down to check_ptr_call instead of recomputing, and ideally only format lazily when an adjustment/cast actually occurs.","locations":[{"ref":"src/builder.rs:428-436","code":"  428 |         let func_name = format!(\"{:?}\", func_ptr);\n  429 |         let previous_arg_count = args.len();\n  430 |         let orig_args = args;\n  431 |         let args = {\n  432 |             func_ptr = llvm::adjust_function(self.context, &func_name, func_ptr, args);\n  433 |             llvm::adjust_intrinsic_arguments(self, gcc_func, args.into(), &func_name)\n  434 |         };\n  435 |         let args_adjusted = args.len() != previous_arg_count;\n  436 |         let args = self.check_ptr_call(\"call\", func_ptr, &args, &on_stack_param_indices);","lines":9,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/builder.rs#L428-L436"},{"ref":"src/builder.rs:267","code":"  267 |         let func_name = format!(\"{:?}\", func_ptr);","lines":1,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/builder.rs#L267"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`is_native_int_type` rebuilds an 8-element `[Type; 8]` array and loops with `is_compatible_with` on every call. This is invoked very frequently throughout codegen (it is also called by `is_native_int_type_or_bool` and `is_int_type_or_bool`). The array construction and linear scan are pure overhead on a hot path.","fix":"Hoist the candidate list out of the function (e.g. a method that compares against the cached fields directly via a short-circuiting boolean expression) so no temporary array is allocated/scanned per call, or precompute a set/flag once.","locations":[{"ref":"src/context.rs:374-394","code":"  374 |     pub fn is_native_int_type(&self, typ: Type<'gcc>) -> bool {\n  375 |         let types = [\n  376 |             self.u8_type,\n  377 |             self.u16_type,\n  378 |             self.u32_type,\n  379 |             self.u64_type,\n  380 |             self.i8_type,\n  381 |             self.i16_type,\n  382 |             self.i32_type,\n  383 |             self.i64_type,\n  384 |         ];\n  385 | \n  386 |         for native_type in types {\n  387 |             if native_type.is_compatible_with(typ) {\n  388 |                 return true;\n  389 |             }\n  390 |         }\n  391 | \n  392 |         self.supports_128bit_integers\n  393 |             && (self.u128_type.is_compatible_with(typ) || self.i128_type.is_compatible_with(typ))\n  394 |     }","lines":21,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/context.rs#L374-L394"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"Comment claims the rotate implementation 'generates efficient code for other platforms' and uses a branchless algorithm, but the lowering ignores the fact that GCC has rotate patterns; more importantly `rotate_left`/`rotate_right` compute `-n & (width-1)` which is only correct when `width` is a power of two. All integer widths here are powers of two so it is correct in practice, but the masking is silently wrong for any non-power-of-two width, which is a latent trap if this helper is ever reused.","fix":"Document the power-of-two precondition on `rotate_left`/`rotate_right`, or compute the counter-rotation as `(width - shift) % width` instead of `-shift & (width-1)` to be correct for arbitrary widths.","locations":[{"ref":"src/intrinsic/mod.rs:1199-1228","code":" 1199 |     fn rotate_left(\n 1200 |         &mut self,\n 1201 |         value: RValue<'gcc>,\n 1202 |         shift: RValue<'gcc>,\n 1203 |         width: u64,\n 1204 |     ) -> RValue<'gcc> {\n 1205 |         let max = self.const_uint(shift.get_type(), width);\n 1206 |         let shift = self.urem(shift, max);\n 1207 |         let lhs = self.shl(value, shift);\n 1208 |         let result_neg = self.neg(shift);\n 1209 |         let result_and = self.and(result_neg, self.const_uint(shift.get_type(), width - 1));\n 1210 |         let rhs = self.lshr(value, result_and);\n 1211 |         self.or(lhs, rhs)\n 1212 |     }\n 1213 | \n 1214 |     // Algorithm from: https://blog.regehr.org/archives/1063\n 1215 |     fn rotate_right(\n 1216 |         &mut self,\n 1217 |         value: RValue<'gcc>,\n 1218 |         shift: RValue<'gcc>,\n 1219 |         width: u64,\n 1220 |     ) -> RValue<'gcc> {\n 1221 |         let max = self.const_uint(shift.get_type(), width);\n 1222 |         let shift = self.urem(shift, max);\n 1223 |         let lhs = self.lshr(value, shift);\n 1224 |         let result_neg = self.neg(shift);\n 1225 |         let result_and = self.and(result_neg, self.const_uint(shift.get_type(), width - 1));\n 1226 |         let rhs = self.shl(value, result_and);\n 1227 |         self.or(lhs, rhs)\n 1228 |     }","lines":30,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/intrinsic/mod.rs#L1199-L1228"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In the `arith_red!` macro, the unordered integer reduction path computes `bx.vector_reduce_op(args[0].immediate(), $vec_op)` into `r` (line 1358) and then, in the `else` (unordered) branch, computes the very same reduction a second time at line 1364 instead of reusing `r`. This emits the reduction twice for every unordered integer reduce (simd_reduce_add_unordered / simd_reduce_mul_unordered).","fix":"Reuse `r` in the unordered branch: `Ok(r)` instead of recomputing `bx.vector_reduce_op(args[0].immediate(), $vec_op)`.","locations":[{"ref":"src/intrinsic/simd.rs:1407-1417","code":" 1407 |                 return match *in_elem.kind() {\n 1408 |                     ty::Int(_) | ty::Uint(_) => {\n 1409 |                         let r = bx.vector_reduce_op(args[0].immediate(), $vec_op);\n 1410 |                         if $ordered {\n 1411 |                             // if overflow occurs, the result is the\n 1412 |                             // mathematical result modulo 2^n:\n 1413 |                             Ok(bx.$op(args[1].immediate(), r))\n 1414 |                         } else {\n 1415 |                             Ok(bx.vector_reduce_op(args[0].immediate(), $vec_op))\n 1416 |                         }\n 1417 |                     }","lines":11,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/intrinsic/simd.rs#L1407-L1417"}]},
{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"shuffle_vector builds the second dummy vector with `&vec![zero; mask_num_units]` and vector_select builds `vec![...; num_units]` for zeros/minus_ones; these heap allocations could be avoided, but more notably `vec![zero; mask_num_units]` is created via the vec! macro then immediately borrowed - minor, but allocation per shuffle on a hot SIMD path.","fix":"These are minor; if profiling shows SIMD codegen hot, build the constant vectors via an iterator collected once or a splat helper rather than vec! macros.","locations":[{"ref":"src/builder.rs:2198-2202","code":" 2198 |             let v2 = self.context.new_rvalue_from_vector(\n 2199 |                 self.location,\n 2200 |                 result_type,\n 2201 |                 &vec![zero; mask_num_units],\n 2202 |             );","lines":5,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/builder.rs#L2198-L2202"},{"ref":"src/builder.rs:2448-2461","code":" 2448 |         let zeros = vec![self.context.new_rvalue_zero(element_type); num_units];\n 2449 |         let zeros = self.context.new_rvalue_from_vector(self.location, cond_type, &zeros);\n 2450 | \n 2451 |         let result_type = then_val.get_type();\n 2452 | \n 2453 |         let masks =\n 2454 |             self.context.new_comparison(self.location, ComparisonOp::NotEquals, cond, zeros);\n 2455 |         // NOTE: masks is a vector of integers, but the values can be vectors of floats, so use bitcast to make\n 2456 |         // the & operation work.\n 2457 |         let then_val = self.bitcast_if_needed(then_val, masks.get_type());\n 2458 |         let then_vals = masks & then_val;\n 2459 | \n 2460 |         let minus_ones = vec![self.context.new_rvalue_from_int(element_type, -1); num_units];\n 2461 |         let minus_ones = self.context.new_rvalue_from_vector(self.location, cond_type {"id":"PERF_9","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"gcc_bswap recursively halves `width` for non-native (128-bit) integers and ultimately calls `get_builtin_function(format!(\"__builtin_bswap{}\", width))`. The format! allocation happens on every bswap. The FIXME at line 735-736 already notes a match on literals would be faster. Minor.","fix":"Match width against known sizes (16/32/64) and use string literals to avoid the format! allocation.","locations":[{"ref":"src/int.rs:780-789","code":"  780 |         // FIXME(antoyo): check if it's faster to use string literals and a\n  781 |         // match instead of format!.\n  782 |         let bswap = self.cx.context.get_builtin_function(format!(\"__builtin_bswap{}\", width));\n  783 |         // FIXME(antoyo): this cast should not be necessary. Remove\n  784 |         // when having proper sized integer types.\n  785 |         let param_type = bswap.get_param(0).to_rvalue().get_type();\n  786 |         if param_type != arg_type {\n  787 |             arg = self.bitcast(arg, param_type);\n  788 |         }\n  789 |         self.cx.context.new_call(self.location, bswap, &[arg])","lines":10,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/int.rs#L780-L789"}]},
{"id":"PERF_10","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`adjust_intrinsic_arguments` allocates a fresh `Vec` (`args.to_vec()`) for almost every adjusted builtin even when the `Cow` is already owned, and the common `func_name == \"__builtin_trap\"` early check runs a string compare on every intrinsic call. These run once per intrinsic call site during codegen; minor but repeated.","fix":"Operate on `args.to_mut()` where possible to reuse an already-owned Cow, and gate the work behind the existing `get_param_count() != args.len()` check rather than re-deriving vectors.","locations":[{"ref":"src/intrinsic/llvm.rs:117-131","code":"  117 | pub fn adjust_intrinsic_arguments<'a, 'b, 'gcc, 'tcx>(\n  118 |     builder: &Builder<'a, 'gcc, 'tcx>,\n  119 |     gcc_func: FunctionPtrType<'gcc>,\n  120 |     mut args: Cow<'b, [RValue<'gcc>]>,\n  121 |     func_name: &str,\n  122 | ) -> Cow<'b, [RValue<'gcc>]> {\n  123 |     // FIXME: this might not be a good way to workaround the missing tile builtins.\n  124 |     if func_name == \"__builtin_trap\" {\n  125 |         return vec![].into();\n  126 |     }\n  127 | \n  128 |     // Some LLVM intrinsics do not map 1-to-1 to GCC intrinsics, so we add the missing\n  129 |     // arguments here.\n  130 |     if gcc_func.get_param_count() != args.len() {\n  131 |         match func_name {","lines":15,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/intrinsic/llvm.rs#L117-L131"}]},
{"id":"PERF_11","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`gather` allocates `mask_types` and pushes a fresh `new_field(None, i32_type, \"m\")` for every lane (lines 944-948) only to build a struct type used as the shuffle mask. The field vector and per-lane field creation is recomputed on every gather/scatter call; for large `in_len` this is O(N) struct-field allocation that could be simplified.","fix":"If libgccjit allows, build the shuffle mask as a vector rvalue directly instead of constructing a struct type with N named fields, or cache the field-type construction.","locations":[{"ref":"src/intrinsic/simd.rs:999-1012","code":"  999 |         let mut mask_types = Vec::with_capacity(in_len as usize);\n 1000 |         let mut mask_values = Vec::with_capacity(in_len as usize);\n 1001 |         for i in 0..in_len {\n 1002 |             let index = bx.context.new_rvalue_from_long(bx.i32_type, i as i64);\n 1003 |             mask_types.push(bx.context.new_field(None, bx.i32_type, \"m\"));\n 1004 |             let mask_value = bx.context.new_vector_access(None, mask, index).to_rvalue();\n 1005 |             let mask_value_cast = bx.context.new_cast(None, mask_value, bx.i32_type);\n 1006 |             let masked =\n 1007 |                 bx.context.new_rvalue_from_int(bx.i32_type, in_len as i32) & mask_value_cast;\n 1008 |             let value = index + masked;\n 1009 |             mask_values.push(value);\n 1010 |         }\n 1011 |         let mask_type = bx.context.new_struct_type(None, \"mask_type\", &mask_types);\n 1012 |         let mask = bx.context.new_struct_constructor(None, mask_type.as_type(), None, &mask_values);","lines":14,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/intrinsic/simd.rs#L999-L1012"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"In `get_fn`, the `get_declared_value(sym)` branch is `unreachable!()` followed by a large commented-out block, with a comment explaining that get_declared_value only ever returns global variables, never functions, so this path is never hit. This is a permanently-dead branch plus a ~35-line comment block carried as dead code.","fix":"Replace the always-false `if let Some(_func) = cx.get_declared_value(sym)` with the else body directly (drop the unreachable branch and commented block), or add a clear note that the lookup is intentionally a placeholder. Remove the dead commented code.","locations":[{"ref":"src/callee.rs:31-68","code":"   31 |     let func = if let Some(_func) = cx.get_declared_value(sym) {\n   32 |         // FIXME(antoyo): we never reach this because get_declared_value only returns global variables\n   33 |         // and here we try to get a function.\n   34 |         unreachable!();\n   35 |         /*\n   36 |         // Create a fn pointer with the new signature.\n   37 |         let ptrtype = fn_abi.ptr_to_gcc_type(cx);\n   38 | \n   39 |         // This is subtle and surprising, but sometimes we have to bitcast\n   40 |         // the resulting fn pointer.  The reason has to do with external\n   41 |         // functions.  If you have two crates that both bind the same C\n   42 |         // library, they may not use precisely the same types: for\n   43 |         // example, they will probably each declare their own structs,\n   44 |         // which are distinct types from LLVM's point of view (nominal\n   45 |         // types).\n   46 |         //\n   47 |         // Now, if those two crates are linked into an application, and\n   48 |         // they contain inlined code, you can wind up with a situation\n   49 |         // where both of those functions wind up being loaded into this\n   50 |         // application simultaneously. In that case, the same function\n   51 |         // (from LLVM's point of view) requires two types. But of course\n   52 |         // LLVM won't allow one function to have two types.\n   53 |         //\n   54 |         // What we currently do, therefore, is declare the function with\n   55 |         // one of the two types (whichever happens to come first) and then\n   56 |         // bitcast as needed when the function is referenced to make sure\n   57 |         // it has the type we expect.\n   58 |         //\n   59 |         // This can occur on either a crate-local or crate-external\n   60 |         // reference. It also occurs when testing libcore and in some\n   61 |         // other weird situations. Annoying.\n   62 |         if cx.val_ty(func) != ptrtype {\n   63 |             // FIXME(antoyo): cast the pointer.\n   64 |             func\n   65 |         }\n   66 |         else {\n   67 |             func\n   68 |         }*/","lines":38,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/callee.rs#L31-L68"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"`fuzz_range` ends with `drop(workers);` but the worker `JoinHandle`s are never joined — the manager loop spins until all are `is_finished()`, then drops the handles, detaching them. The explicit `drop` is a no-op for synchronization and any panic in a worker is swallowed. Combined with the unwraps in workers, failures are invisible.","fix":"Join the handles (`for w in workers { let _ = w.join(); }`) and propagate/report panics.","locations":[{"ref":"build_system/src/fuzz.rs:142-160","code":"  142 |     while start.load(Ordering::Relaxed) < end || !workers.iter().all(|t| t.is_finished()) {\n  143 |         // Every 500 ms...\n  144 |         let five_hundred_millis = Duration::from_millis(500);\n  145 |         std::thread::sleep(five_hundred_millis);\n  146 |         // ... calculate the remaining fuzz iters ...\n  147 |         let remaining = end - start.load(Ordering::Relaxed);\n  148 |         // ... fix the count(the start counter counts the cases that\n  149 |         // begun fuzzing, and not only the ones that are done)...\n  150 |         let fuzzed = (total - remaining).saturating_sub(threads as u64);\n  151 |         // ... and the fuzz speed ...\n  152 |         let iter_per_sec = fuzzed as f64 / start_time.elapsed().as_secs_f64();\n  153 |         // .. and use them to display fuzzing stats.\n  154 |         println!(\n  155 |             \"fuzzed {fuzzed} cases({}%), at rate {iter_per_sec} iter/s, remaining ~{}s\",\n  156 |             (100 * fuzzed) as f64 / total as f64,\n  157 |             (remaining as f64) / iter_per_sec\n  158 |         )\n  159 |     }\n  160 |     drop(workers);","lines":19,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/build_system/src/fuzz.rs#L142-L160"}]},

{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"In fptoint_sat the local fn `compute_clamp_bounds_half` mirrors the generic `compute_clamp_bounds<F>` but is needed only because ieee::Half lacks the trait bound; it carries a commented-out `//assert_eq!(rounded_min.status, Status::OK);` that the generic version keeps live. The dropped assertion means the f16 path silently skips the min-rounding sanity check the other widths enforce.","fix":"Either restore the rounded_min status assertion for the Half path or add a comment explaining why f16 legitimately cannot satisfy Status::OK, instead of leaving it commented out.","locations":[{"ref":"src/builder.rs:1981-1989","code":" 1981 |         let compute_clamp_bounds_half = |signed: bool, int_width: u64| -> (u128, u128) {\n 1982 |             let rounded_min =\n 1983 |                 ieee::Half::from_i128_r(int_min(signed, int_width), Round::TowardZero);\n 1984 |             //assert_eq!(rounded_min.status, Status::OK);\n 1985 |             let rounded_max =\n 1986 |                 ieee::Half::from_u128_r(int_max(signed, int_width), Round::TowardZero);\n 1987 |             assert!(rounded_max.value.is_finite());\n 1988 |             (rounded_min.value.to_bits(), rounded_max.value.to_bits())\n 1989 |         };","lines":9,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/builder.rs#L1981-L1989"}]},

{"id":"DEAD_7","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"gcc_checked_binop's OverflowOp::Mul match includes Int(I32) => __mulosi4 and Int(I64) => __mulodi4 arms (lines 307-308) inside the `else` branch that is only reached when lhs is NOT a native int type. i32/i64 are native int types on supported platforms, so these arms in the non-native branch are effectively unreachable for normal targets (the native branch at line 288 handles i32/i64 via __builtin_mul_overflow). Likely dead for the platforms this backend supports.","fix":"Confirm whether i32/i64 can ever be non-native here; if not, remove the dead arms or convert to unreachable!().","locations":[{"ref":"src/int.rs:331-337","code":"  331 |                 OverflowOp::Mul => match new_kind {\n  332 |                     Int(I32) => (\"__mulosi4\", 32),\n  333 |                     Int(I64) => (\"__mulodi4\", 64),\n  334 |                     Int(I128) => (\"__rust_i128_mulo\", 128), // FIXME(antoyo): use __muloti4d instead?\n  335 |                     Uint(U128) => (\"__rust_u128_mulo\", 128),\n  336 |                     _ => unreachable!(),\n  337 |                 },","lines":7,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/int.rs#L331-L337"}]},

         _ => (),\n  112 |     }\n  113 | \n  114 |     func_ptr\n  115 | }","lines":31,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/intrinsic/llvm.rs#L85-L115"}]},
{"id":"DEAD_9","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"In the `simd_scatter` arm the `result` of `gather(... invert=true)` (line 1189-1190) is computed and used, but `pointer_count`/`underlying_ty` are asserted (lines 1173-1175) and `vector_type`/`elem_type` are recomputed; `underlying_ty` is only used to build `vector_type` when `pointer_count == 1`. The `assert_eq!`/`assert!` triplet (1173-1175) duplicates the identical assertions already present in `simd_gather` (1058-1060) and is effectively a debug-only invariant check on compiler-guaranteed types; on release builds the work is dead.","fix":"These asserts encode frontend invariants; consider removing them or converting to debug_assert! to avoid the duplicated runtime checks. (Low priority - they are cheap and document intent.)","locations":[{"ref":"src/intrinsic/simd.rs:1228-1230","code":" 1228 |         assert!(pointer_count > 0);\n 1229 |         assert_eq!(pointer_count - 1, ptr_count(element_ty0));\n 1230 |         assert_eq!(underlying_ty, non_ptr(element_ty0));","lines":3,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/intrinsic/simd.rs#L1228-L1230"},{"ref":"src/intrinsic/simd.rs:1113-1115","code":" 1113 |         assert!(pointer_count > 0);\n 1114 |         assert_eq!(pointer_count - 1, ptr_count(element_ty0));\n 1115 |         assert_eq!(underlying_ty, non_ptr(element_ty0));","lines":3,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/intrinsic/simd.rs#L1113-L1115"}]},

{"id":"CMT_10","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"Comment on the unordered-comparison select step reads `%greater = fcmp olt %val, %f_max` but the code and intent use a greater-than (OGT) comparison; the comment says `olt` (less-than). Copy-paste/typo in the explanatory comment, misleading to readers.","fix":"Change the comment to `%greater = fcmp ogt %val, %f_max`.","locations":[{"ref":"src/builder.rs:2072","code":" 2072 |         //     %greater = fcmp olt %val, %f_max","lines":1,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/builder.rs#L2072"}]},
{"id":"CMT_11","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"Comment in `create_type` says 'For types with size 1, the alignment can be 1 and only 1 So, we can skip the call to `get_aligned`' but the typo/backtick `get_aligned`` (double backtick) and the reasoning conflate size==1 byte with alignment==1; it is correct in practice but the malformed markup and terse phrasing are misleading.","fix":"Fix the stray backtick and clarify: a type whose size is exactly 1 byte necessarily has alignment 1, so get_aligned is a no-op and can be skipped.","locations":[{"ref":"src/context.rs:180-186","code":"  180 |             // For types with size 1, the alignment can be 1 and only 1\n  181 |             // So, we can skip the call to ``get_aligned`.\n  182 |             // In the future, we can add a GCC API to query the type align,\n  183 |             // and call `get_aligned` if and only if that differs from Rust's expectations.\n  184 |             if layout.size.bytes() == 1 {\n  185 |                 return context.new_c_type(ctype);\n  186 |             }","lines":7,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/context.rs#L180-L186"}]},

{"id":"CMT_13","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"Several comments in type-of/scalar handling still reference \"LLVM\" though this is the GCC backend (e.g. \"the right LLVM type for an `alloca`\", \"a named struct is created in LLVM. Name collisions are avoided by LLVM\", \"crippling LLVM optimizations or triggering other LLVM bugs with `i1`\"). The named-struct comment is even contradicted by the immediately following FIXME (\"I don't think that's true for libgccjit\"). Misleading for readers of the GCC backend.","fix":"Reword comments to refer to libgccjit/GCC behavior, or mark clearly as inherited-from-LLVM context.","locations":[{"ref":"src/type_of.rs:182-185","code":"  182 |     /// containing a value of that type, and most immediates (except `bool`).\n  183 |     /// Unsized types, however, are represented by a \"minimal unit\", e.g.\n  184 |     /// `[T]` becomes `T`, while `str` and `Trait` turn into `i8` - this\n  185 |     /// is useful for indexing slices, as `&[T]`'s data pointer is `T*`.","lines":4,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/type_of.rs#L182-L185"},{"ref":"src/type_of.rs:118-124","code":"  118 |         ty::Adt(..) => {\n  119 |             // If `Some` is returned then a named struct is created in LLVM. Name collisions are\n  120 |             // avoided by LLVM (with increasing suffixes). If rustc doesn't generate names then that\n  121 |             // can improve perf.\n  122 |             // FIXME(antoyo): I don't think that's true for libgccjit.\n  123 |             Some(String::new())\n  124 |         }","lines":7,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/type_of.rs#L118-L124"},{"ref":"src/type_of.rs:301-307","code":"  301 |         // Make sure to return the same type `immediate_gcc_type` would when\n  302 |         // dealing with an immediate pair.  This means that `(bool, bool)` is\n  303 |         // effectively represented as `{i8, i8}` in memory and two `i1`s as an\n  304 |         // immediate, just like `bool` is typically `i8` in memory and only `i1`\n  305 |         // when immediate.  We need to load/store `bool` as `i8` to avoid\n  306 |         // crippling LLVM optimizations or triggering other LLVM bugs with `i1`.\n  307 |         // FIXME(antoyo): this bugs certainly don't happen in this case since the bool type is used instead of i1.","lines":7,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/type_of.rs#L301-L307"}]},
{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"The signed saturating-add (true,true) and signed saturating-sub (true,false) branches are byte-for-byte identical except that the sub branch first negates `rhs`. The entire ~20-line saturation algorithm (xor1/xor2/and/mask/shift1/shift2/mask_min/and1/and2) is duplicated verbatim. A future fix to the saturation math must be applied in two places, which is exactly the kind of spot where one copy gets updated and the other does not.","fix":"Factor the shared saturating-add-of-(possibly-negated)-rhs algorithm into a single helper closure taking lhs and rhs, and call it from both branches (the sub branch passing the negated rhs).","locations":[{"ref":"src/intrinsic/simd.rs:1329-1358","code":" 1329 |             (true, true) => {\n 1330 |                 // Algorithm from: https://codereview.stackexchange.com/questions/115869/saturated-signed-addition\n 1331 |                 // FIXME(antoyo): improve using conditional operators if possible.\n 1332 |                 // FIXME(antoyo): dyncast_vector should not require a call to unqualified.\n 1333 |                 let arg_type = lhs.get_type().unqualified();\n 1334 |                 // FIXME(antoyo): convert lhs and rhs to unsigned.\n 1335 |                 let sum = lhs + rhs;\n 1336 |                 let vector_type = arg_type.dyncast_vector().expect(\"vector type\");\n 1337 |                 let unit = vector_type.get_num_units();\n 1338 |                 let a = bx.context.new_rvalue_from_int(elem_ty, ((elem_width as i32) << 3) - 1);\n 1339 |                 let width = bx.context.new_rvalue_from_vector(None, lhs.get_type(), &vec![a; unit]);\n 1340 | \n 1341 |                 let xor1 = lhs ^ rhs;\n 1342 |                 let xor2 = lhs ^ sum;\n 1343 |                 let and =\n 1344 |                     bx.context.new_unary_op(None, UnaryOp::BitwiseNegate, arg_type, xor1) & xor2;\n 1345 |                 let mask = and >> width;\n 1346 | \n 1347 |                 let one = bx.context.new_rvalue_one(elem_ty);\n 1348 |                 let ones =\n 1349 |                     bx.context.new_rvalue_from_vector(None, lhs.get_type(), &vec![one; unit]);\n 1350 |                 let shift1 = ones << width;\n 1351 |                 let shift2 = sum >> width;\n 1352 |                 let mask_min = shift1 ^ shift2;\n 1353 | \n 1354 |                 let and1 =\n 1355 |                     bx.context.new_unary_op(None, UnaryOp::BitwiseNegate, arg_type, mask) & sum;\n 1356 |                 let and2 = mask & mask_min;\n 1357 | \n 1358 |                 and1 + and2","lines":30,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/intrinsic/simd.rs#L1329-L1358"}]},

<script>
(function(){
'use strict';

// Data
const FINDINGS     = JSON.parse(document.getElementById('D').textContent);
const PROJECT_INFO = JSON.parse(document.getElementById('PI').textContent);
const SEVS     = ['critical','high','medium','low','negligible'];
const STATUSES = ['open','fixed','wont-fix','false-positive'];
const ALL_TYPES = [...new Set(FINDINGS.map(f => f.type))].sort();
// Build lookup map for O(1) access
const FINDING_BY_ID = new Map(FINDINGS.map(f => [f.id, f]));
// Only severities actually present in the report — the filter bar hides the rest.
const PRESENT_SEVS = SEVS.filter(s => FINDINGS.some(f => (f.severity || 'medium') === s));
// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};
const PRESENT_DIFFS = DIFFICULTY_ORDER.filter(d => FINDINGS.some(f => f.difficulty === d));
const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', searchScope: 'all', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),

const statuses = {};

// Persistence
function loadStatuses() {

}
function saveStatuses() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    if (S.searchScope !== 'all') p.set('qs', S.searchScope);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);

}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('qs'))  { S.searchScope = p.get('qs'); }
  document.getElementById('search-scope').classList.toggle('active', S.searchScope === 'locations');
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build a [project] header block from embedded PROJECT_INFO, so the exported
// findings.toml is self-contained (doesn't depend on a sibling project-info.toml
// that a second, separately-triggered download could silently fail to save).
// '' when there is no project info at all.
function buildProjectToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = PROJECT_INFO || {};
  if (!Object.keys(pi).length) return '';
  const lines = ['[project]'];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n\n';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return buildProjectToml() + chunks.join('\n\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystacks per finding (cleared on full re-render).
// Two variants: everything (default), and file/folder paths only - for when a
// search term (e.g. a directory name like 'dlls/abc') also happens to appear
// inside description/fix prose and you only want path matches.
const _hay = new Map();
const _hayLoc = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}
function hayLocOf(f) {
  if (!_hayLoc.has(f.id)) {
    _hayLoc.set(f.id, f.locations.map(l => l.ref).join(' ').toLowerCase());
  }
  return _hayLoc.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (S.searchScope === 'locations') {
      if (!hayLocOf(f).includes(q)) return false;
    } else if (!hayOf(f).includes(q) && !st.includes(q)) {
      return false;
    }
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  _hayLoc.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    // Single download (was two) - a second auto-triggered download is commonly
    // blocked by the browser unless the user explicitly allows it, which silently
    // drops project-info.toml. Embedding [project] in findings.toml itself avoids
    // that failure mode entirely.
    downloadText(buildFindingsToml(), 'findings.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});
document.getElementById('search-scope').addEventListener('click', e => {
  S.searchScope = S.searchScope === 'locations' ? 'all' : 'locations';
  e.currentTarget.classList.toggle('active', S.searchScope === 'locations');
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
