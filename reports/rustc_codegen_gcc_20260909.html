{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"zext is implemented as gcc_int_cast with a self-acknowledged FIXME `this does not zero-extend`, and trunc likewise just calls gcc_int_cast without confirming truncation. If gcc_int_cast performs a signedness-preserving cast, zext of a value held in a signed type would sign-extend instead of zero-extend, corrupting values like bool/enum widening. Correctness depends entirely on gcc_int_cast picking unsigned semantics, which the FIXME doubts.","fix":"Ensure zext casts through the unsigned variant of the source type (to_unsigned) before widening, so the widening is guaranteed zero-extension regardless of the source type's signedness.","locations":[{"ref":"src/builder.rs:1892-1895","code":" 1892 |     fn zext(&mut self, value: RValue<'gcc>, dest_typ: Type<'gcc>) -> RValue<'gcc> {\n 1893 |         // FIXME(antoyo): this does not zero-extend.\n 1894 |         self.gcc_int_cast(value, dest_typ)\n 1895 |     }","lines":4,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/builder.rs#L1892-L1895"},{"ref":"src/builder.rs:1337-1340","code":" 1337 |     fn trunc(&mut self, value: RValue<'gcc>, dest_ty: Type<'gcc>) -> RValue<'gcc> {\n 1338 |         // FIXME(antoyo): check that it indeed truncate the value.\n 1339 |         self.gcc_int_cast(value, dest_ty)\n 1340 |     }","lines":4,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/builder.rs#L1337-L1340"}]},
{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`const_str` holds `const_str_cache.borrow_mut()` across the `unwrap_or_else` closure that calls `self.global_string(s)`. `global_string` performs unrelated codegen work (declare_private_global, symbol generation). Holding the RefCell borrow across this call is unnecessary and risks a future re-entrant borrow panic if any callee ever touches `const_str_cache`.","fix":"Look up the cache, drop the borrow, build the global outside the borrow, then re-borrow to insert; or use the entry API only around the map mutation.","locations":[{"ref":"src/common.rs:292-305","code":"  292 |     fn const_str(&self, s: &str) -> (RValue<'gcc>, RValue<'gcc>) {\n  293 |         let mut const_str_cache = self.const_str_cache.borrow_mut();\n  294 |         let str_global = const_str_cache.get(s).copied().unwrap_or_else(|| {\n  295 |             let g = self.global_string(s);\n  296 |             const_str_cache.insert(s.to_owned(), g);\n  297 |             g\n  298 |         });\n  299 |         let len = s.len();\n  300 |         let cs = self.const_ptrcast(\n  301 |             str_global.get_address(None),\n  302 |             self.type_ptr_to(self.layout_of(self.tcx.types.str_).gcc_type(self)),\n  303 |         );\n  304 |         (cs, self.const_usize(len as u64))\n  305 |     }","lines":14,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/common.rs#L292-L305"}]},
{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"Double application of `to_gcc_features` in the `extend_backend_features` closure: the outer `to_gcc_features(sess, feature)` is iterated, and each result `feat` is passed through `to_gcc_features(sess, feat)` again. For features that expand to multiple GCC names this re-expands the already-expanded names. Example: `sse4.2` -> `[\"sse4.2\", \"crc32\"]`; the second pass maps `\"sse4.2\"` -> `[\"sse4.2\", \"crc32\"]` and `\"crc32\"` -> `[\"crc32\"]`, yielding `[\"sse4.2\", \"crc32\", \"crc32\"]` with a duplicate. Similar duplication occurs for any multi-output mapping (avx512vbmi2, the AArch64 neon-tying entries, etc.). The duplicates are harmless to GCC but indicate the nested call is unintended.","fix":"Remove the inner re-mapping: `features.extend(to_gcc_features(sess, feature).iter().map(|feat| if !enable { format!(\"-{feat}\") } else { feat.to_string() }));`.","locations":[{"ref":"src/gcc_util.rs:47-53","code":"   47 |         features.extend(\n   48 |             to_gcc_features(sess, feature)\n   49 |                 .iter()\n   50 |                 .flat_map(|feat| to_gcc_features(sess, feat).into_iter())\n   51 |                 .map(|feature| if !enable { format!(\"-{}\", feature) } else { feature.to_string() }),\n   52 |         );\n   53 |     };","lines":7,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/gcc_util.rs#L47-L53"}]},
{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`disabled_features` parsing in `new_context` splits `-Ctarget-feature` on ',' and slices `&string[1..]` for entries starting with '-'. An empty target-feature string (or a trailing comma) yields an empty `\"\"` token; it does not start with '-' so it is filtered out, which is fine. However the parsing only ever looks for the literal feature name `avx` and does not account for the GCC-vs-Rust name remapping done by `to_gcc_features`, nor for a later '+avx' re-enabling after a '-avx'. The check is a simple substring-membership test that can disagree with the features actually computed by `global_gcc_features`, so `-mavx` may be force-added even when the user effectively disabled it through an aliased name, or omitted when they re-enabled it.","fix":"Derive the AVX enable/disable decision from the already-computed `global_gcc_features` result (the canonical GCC feature list) rather than re-parsing the raw `-Ctarget-feature` string, so the two stay consistent.","locations":[{"ref":"src/gcc_util.rs:174-188","code":"  174 |     let disabled_features: HashSet<_> = sess\n  175 |         .opts\n  176 |         .cg\n  177 |         .target_feature\n  178 |         .split(',')\n  179 |         .filter(|feature| feature.starts_with('-'))\n  180 |         .map(|string| &string[1..])\n  181 |         .collect();\n  182 | \n  183 |     if !disabled_features.contains(\"avx\") && sess.target.arch == Arch::X86_64 {\n  184 |         // NOTE: we always enable AVX because the equivalent of llvm.x86.sse2.cmp.pd in GCC for\n  185 |         // SSE2 is multiple builtins, so we use the AVX __builtin_ia32_cmppd instead.\n  186 |         // FIXME(antoyo): use the proper builtins for llvm.x86.sse2.cmp.pd and similar.\n  187 |         context.add_command_line_option(\"-mavx\");\n  188 |     }","lines":15,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/gcc_util.rs#L174-L188"}]},
{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"gcc_int (constant builder for 128-bit) sets the high word to `-(int.is_negative() as i64)`, i.e. sign-extends a signed i64 into a 128-bit value. This is correct for signed types, but gcc_int is also reachable for an unsigned non-native type (it does not check signedness, only is_native_int_type_or_bool). If a negative i64 is ever passed intending an unsigned u128 constant, the high word becomes all-ones rather than zero. Callers currently pass small non-negative constants (0,1,63,64), so it is latent, but the function silently conflates signed/unsigned 128-bit constants.","fix":"Document that gcc_int is for signed-style sign-extended constants, or branch on the destination type's signedness like gcc_uint does.","locations":[{"ref":"src/int.rs:794-801","code":"  794 |     pub fn gcc_int(&self, typ: Type<'gcc>, int: i64) -> RValue<'gcc> {\n  795 |         if self.is_native_int_type_or_bool(typ) {\n  796 |             self.context.new_rvalue_from_long(typ, int)\n  797 |         } else {\n  798 |             // NOTE: set the sign in high.\n  799 |             self.concat_low_high(typ, int, -(int.is_negative() as i64))\n  800 |         }\n  801 |     }","lines":8,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/int.rs#L794-L801"}]},
{"id":"LOGIC_34","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"gcc_int_cast, when casting a native int to a non-native (128-bit) type, computes the sign-extension as `is_negative = (value < 0)` then negates it into the high word (lines 878-886). `is_negative` is computed with a signed comparison `value < 0` regardless of whether `value_type` is signed or unsigned. For an unsigned source value with the top bit set, `value < 0` on the unsigned native type is always false (correct: zero-extend). But the comparison is built directly on `value` without ensuring its type's signedness drives the comparison; if value_type is signed but the cast is conceptually an unsigned widen, the high word gets sign-filled. The signedness of the widen is not threaded through (there is only one gcc_int_cast, used for both signed and unsigned).","fix":"Thread the source signedness through (or cast value to the appropriate signed/unsigned native type before the `< 0` test) so the high-word fill matches the intended widen semantics.","locations":[{"ref":"src/int.rs:922-934","code":"  922 |         } else if self.is_native_int_type_or_bool(value_type) {\n  923 |             let dest_element_type = dest_typ.dyncast_array().expect(\"get element type\");\n  924 | \n  925 |             // NOTE: set the sign of the value.\n  926 |             let zero = self.context.new_rvalue_zero(value_type);\n  927 |             let is_negative =\n  928 |                 self.context.new_comparison(None, ComparisonOp::LessThan, value, zero);\n  929 |             let is_negative = self.gcc_int_cast(is_negative, dest_element_type);\n  930 |             self.concat_low_high_rvalues(\n  931 |                 dest_typ,\n  932 |                 self.context.new_cast(None, value, dest_element_type),\n  933 |                 self.context.new_unary_op(None, UnaryOp::Minus, dest_element_type, is_negative),\n  934 |             )","lines":13,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/int.rs#L922-L934"}]},
{"id":"LOGIC_35","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`__builtin_ia32_stmxcsr` is handled in BOTH the `get_param_count() != args.len()` branch (args replaced with empty vec, line 468-470) and indirectly relies on `adjust_intrinsic_return_value` re-reading `orig_args[0]`. If the GCC builtin's declared param count happens to already equal the (1) LLVM arg count for some libgccjit version, the argument-stripping arm would be skipped while the return-value handler still treats `orig_args[0]` as the original pointer and `args` as empty; the two halves are coupled through an implicit assumption that the count always mismatches.","fix":"Make the stmxcsr argument rewrite unconditional (move it out of the count-mismatch gate) so it cannot desync from the return-value adjustment.","locations":[{"ref":"src/intrinsic/llvm.rs:465-467","code":"  465 |             \"__builtin_ia32_stmxcsr\" => {\n  466 |                 args = vec![].into();\n  467 |             }","lines":3,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/intrinsic/llvm.rs#L465-L467"},{"ref":"src/intrinsic/llvm.rs:862-873","code":"  862 |         \"__builtin_ia32_stmxcsr\" => {\n  863 |             // The builtin __builtin_ia32_stmxcsr returns a value while llvm.x86.sse.stmxcsr writes\n  864 |             // the result in its pointer argument.\n  865 |             // We removed the argument since __builtin_ia32_stmxcsr takes no arguments, so we need\n  866 |             // to get back the original argument to get the pointer we need to write the result to.\n  867 |             let uint_ptr_type = builder.uint_type.make_pointer();\n  868 |             let ptr = builder.context.new_cast(None, orig_args[0], uint_ptr_type);\n  869 |             builder.llbb().add_assignment(None, ptr.dereference(None), return_value);\n  870 |             // The return value was assigned to the result pointer above. {"id":"LOGIC_36","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`simd_ctlz`/`simd_cttz` are handled without first requiring that the element type is an integer, unlike `simd_bswap`/`simd_bitreverse`/`simd_ctpop` which are gated by the integer-element check at lines 247-252. If a float-element vector ever reached this arm, `count_leading_zeroes`/`count_trailing_zeroes` would be emitted on float lanes (relying on the frontend to reject it). The check is inconsistent with the sibling count intrinsics.","fix":"Add `sym::simd_ctlz | sym::simd_cttz` to the integer-element-type `require!` at line 247 (or add an equivalent element-type check at the start of the ctlz/cttz arm).","locations":[{"ref":"src/intrinsic/simd.rs:248-253","code":"  248 |     if matches!(name, sym::simd_bswap | sym::simd_bitreverse | sym::simd_ctpop) {\n  249 |         require!(\n  250 |             bx.type_kind(bx.element_type(llret_ty)) == TypeKind::Integer,\n  251 |             InvalidMonomorphization::UnsupportedOperation { span, name, in_ty, in_elem }\n  252 |         );\n  253 |     }","lines":6,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/intrinsic/simd.rs#L248-L253"},{"ref":"src/intrinsic/simd.rs:419-435","code":"  419 |     if name == sym::simd_ctlz || name == sym::simd_cttz {\n  420 |         let vector = args[0].immediate();\n  421 |         let elements: Vec<_> = (0..in_len)\n  422 |             .map(|i| {\n  423 |                 let index = bx.context.new_rvalue_from_long(bx.i32_type, i as i64);\n  424 |                 let value = bx.extract_element(vector, index).to_rvalue();\n  425 |                 let value_type = value.get_type();\n  426 |                 let element = if name == sym::simd_ctlz {\n  427 |                     bx.count_leading_zeroes(value_type.get_size() as u64 * 8, value)\n  428 |                 } else {\n  429 |                     bx.count_trailing_ {"id":"LOGIC_37","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`simd_funnel_shift` does not mask/reduce the per-lane shift amount modulo the element bit width. For shift_left it computes `(val << shift_val) >> int_shift_val` and for shift_right `(val >> shift_val) & int_mask`. If `shift_val >= element_bit_width`, the widened-integer shift no longer matches the LLVM funnel-shift semantics (which take the shift modulo the bit width). The Rust SIMD intrinsics currently constrain the shift below the bit width, so this is latent, but the implementation silently diverges if that ever changes.","fix":"Mask the shift amount to the element bit width before applying it (e.g. `shift_val % int_shift_val`, or bitwise-and with `width-1`), mirroring LLVM funnel-shift semantics.","locations":[{"ref":"src/intrinsic/simd.rs:1775-1782","code":" 1775 |         let shift_val = bx.context.new_vector_access(None, shift, index).to_rvalue();\n 1776 |         let shift_val = bx.gcc_int_cast(shift_val, new_int_type);\n 1777 |         let mut val = a_val << int_shift_val | b_val;\n 1778 |         if shift_left {\n 1779 |             val = (val << shift_val) >> int_shift_val;\n 1780 |         } else {\n 1781 |             val = (val >> shift_val) & int_mask;\n 1782 |         }","lines":8,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/intrinsic/simd.rs#L1775-L1782"}]},
{"id":"LOGIC_38","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"medium","description":"The `costliest_module` selection maps every regular in-memory module to the constant cost `(0, i)` (the real cost computation is FIXME'd out). `.max()` over equal first components therefore always picks the module with the largest index `i`, not a costliest module. This is benign (any regular base works) but the comment about choosing the costliest module to avoid re-serializing the largest CGU is currently aspirational, not implemented; a reader may assume cost-based selection is happening.","fix":"Either implement a real cost metric or update the comment to state that selection is arbitrary (largest-index regular module) until cost computation is available.","locations":[{"ref":"src/back/lto.rs:170-187","code":"  170 |     let costliest_module = in_memory\n  171 |         .iter()\n  172 |         .enumerate()\n  173 |         .filter(|&(_, module)| module.kind == ModuleKind::Regular)\n  174 |         .map(|(i, _module)| {\n  175 |             //let cost = unsafe { llvm::LLVMRustModuleCost(module.module_llvm.llmod()) };\n  176 |             // FIXME(antoyo): compute the cost of a module if GCC allows this.\n  177 |             (0, i)\n  178 |         })\n  179 |         .max();\n  180 | \n  181 |     // If we found a costliest module, we're good to go. Otherwise all our\n  182 |     // inputs were serialized which could happen in the case, for example, that\n  183 |     // all our inputs were incrementally reread from the cache and we're just\n  184 |     // re-executing the LTO passes. If that's the case deserialize the first\n  185 |     // module and create a linker with it.\n  186 |     let mut module: ModuleCodegen<GccContext> = match costliest_module {\n  187 |         Some((_cost, i)) => in_memory.remove(i),","lines":18,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/back/lto.rs#L170-L187"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"medium","description":"The `simd_bswap` closure takes a `vector` parameter and derives `v_type` (and the final bitcast-back type) from it, but at the byte-vector bitcast it ignores `vector` and re-reads `args[0].immediate()`. It also computes `type_size_bytes` from the outer `in_len` rather than from the passed vector's element count. Today both call sites pass `args[0].immediate()` so there is no live miscompile, but this is a latent copy-paste/aliasing bug: any future caller passing a different vector (or a vector with a different length than `in_len`) would silently byte-swap the wrong value and/or build a mismatched byte-vector type.","fix":"Inside the closure use the `vector` argument consistently: bitcast `vector` (not `args[0].immediate()`) at line 218, and derive the element count from `vector_type.get_num_units()` instead of the captured `in_len` for `type_size_bytes`.","locations":[{"ref":"src/intrinsic/simd.rs:207-246","code":"  207 |     let simd_bswap = |bx: &mut Builder<'a, 'gcc, 'tcx>, vector: RValue<'gcc>| -> RValue<'gcc> {\n  208 |         let v_type = vector.get_type();\n  209 |         let vector_type = v_type.unqualified().dyncast_vector().expect(\"vector type\");\n  210 |         let elem_type = vector_type.get_element_type();\n  211 |         let elem_size_bytes = elem_type.get_size();\n  212 |         if elem_size_bytes == 1 {\n  213 |             return vector;\n  214 |         }\n  215 | \n  216 |         let type_size_bytes = elem_size_bytes as u64 * in_len;\n  217 |         let shuffle_indices = Vec::from_iter(0..type_size_bytes);\n  218 |         let byte_vector_type = bx.context.new_vector_type(bx.type_u8(), type_size_bytes);\n  219 |         let byte_vector = bx.context.new_bitcast(None, args[0].immediate(), byte_vector_type);\n  220 | \n  221 |         #[cfg(not(feature = \"master\"))]\n  222 |         let shuffled = {\n  223 |             let new_elements: Vec<_> = shuffle_indices\n  224 |                 .chunks_exact(elem_size_bytes as _)\n  225 |                 .flat_map(|x| x.iter().rev())\n  226 |                 .map(|&i| {\n  227 |                     let index = bx.context.new_rvalue_from_long(bx.u64_type, i as _);\n  228 |                     bx.extract_element(byte_vector, index)\n  229 |                 })\n  230 |                 .collect();\n  231 | \n  232 |             bx.context.new_rvalue_from_vector(None, byte_vector_type, &new_elements)\n  233 |         };\n  234 |         #[cfg(feature = \"master\")]\n  235 |         let shuffled = {\n  236 |             let indices: Vec<_> = shuffle_indices\n  237 |                 .chunks_exact(elem_size_bytes as _)\n  238 |                 .flat_map(|x| x.iter().rev())\n  239 |                 .map(|&i| bx.context.new_rvalue_from_int(bx.u8_type, i as _))\n  240 |                 .collect();\n  241 | \n  242 |             let mask = bx.context.new_rvalue_from_vector(None, byte_vector_type, &indices);\n  243 |             bx.context.new_rvalue_vector_perm(None, byte_vector, byte_vector, mask)\n  244 |         };\n  245 |         bx.context.new_bitcast(None, shuffled, v_type)\n  246 |     };","lines":40,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/intrinsic/simd.rs#L207-L246"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`build_sysroot` pushes `-Csymbol-mangling-version=v0` to `rustflags` twice when `config.no_default_features` is set: once at lines 139-141 and again inside the `if config.no_default_features` block at line 153-156. Harmless to rustc but it is dead duplication and signals confused control flow (the second block already gates on the same condition).","fix":"Remove the duplicate `rustflags.push_str(\" -Csymbol-mangling-version=v0\");` at line 154 (keep the one that also pushes `--no-default-features`), or consolidate both into a single guarded block.","locations":[{"ref":"build_system/src/build.rs:157-174","code":"  157 |     if config.no_default_features {\n  158 |         rustflags.push_str(\" -Csymbol-mangling-version=v0\");\n  159 |     }\n  160 | \n  161 |     let mut args: Vec<&dyn AsRef<OsStr>> = vec![&\"cargo\", &\"build\", &\"--target\", &config.target];\n  162 |     if config.target.ends_with(\".json\") {\n  163 |         args.push(&\"-Zjson-target-spec\");\n  164 |     }\n  165 | \n  166 |     for feature in &config.features {\n  167 |         args.push(&\"--features\");\n  168 |         args.push(feature);\n  169 |     }\n  170 | \n  171 |     if config.no_default_features {\n  172 |         rustflags.push_str(\" -Csymbol-mangling-version=v0\");\n  173 |         args.push(&\"--no-default-features\");\n  174 |     }","lines":18,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/build_system/src/build.rs#L157-L174"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`check_exit_status` and `command_error` build the displayed command string with `s.as_ref().to_str().unwrap()`. Command arguments include arbitrary paths (e.g. patch paths, sysroot paths, test file paths) which on non-UTF8 filesystems are valid `OsStr` but not valid UTF-8. Formatting the error message then panics with `unwrap()` on `None`, masking the real command failure with an unrelated panic.","fix":"Use `to_string_lossy()` instead of `to_str().unwrap()` when building the human-readable command string.","locations":[{"ref":"build_system/src/utils.rs:61-66","code":"   61 |     let mut error = format!(\n   62 |         \"Command `{}`{} exited with status {:?}\",\n   63 |         input.iter().map(|s| s.as_ref().to_str().unwrap()).collect::<Vec<_>>().join(\" \"),\n   64 |         cwd.map(|cwd| format!(\" (running in folder `{}`)\", cwd.display())).unwrap_or_default(),\n   65 |         exit_status.code()\n   66 |     );","lines":6,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/build_system/src/utils.rs#L61-L66"},{"ref":"build_system/src/utils.rs:86-94","code":"   86 | fn command_error<D: Debug>(input: &[&dyn AsRef<OsStr>], cwd: &Option<&Path>, error: D) -> String {\n   87 |     format!(\n   88 |         \"Command `{}`{} failed to run: {error:?}\",\n   89 |         input.iter().map(|s| s.as_ref().to_str().unwrap()).collect::<Vec<_>>().join(\" \"),\n   90 |         cwd.as_ref()\n   91 |             .map(|cwd| format!(\" (running in folder `{}`)\", cwd.display(),))\n   92 |             .unwrap_or_default(),\n   93 |     )\n   94 | }","lines":9,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/build_system/src/utils.rs#L86-L94"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"The return value of `context.compile_to_file(OutputKind::ObjectFile, path)` is ignored in `fat_lto`. If GCC fails to produce the object file (e.g. disk full, invalid path), compilation silently proceeds and the missing/empty file is later fed to the linker, producing a confusing downstream failure rather than a clear codegen error at the point of failure. `back/write.rs` ignores the same return value in every `compile_to_file` call as well.","fix":"If gccjit's `compile_to_file` reports errors (via the context's error state or a return value), check it and emit a fatal diagnostic. At minimum, verify the output file exists/was written before continuing.","locations":[{"ref":"src/back/lto.rs:213","code":"  213 |             context.compile_to_file(OutputKind::ObjectFile, path);","lines":1,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/back/lto.rs#L213"},{"ref":"src/back/write.rs:55-56","code":"   55 |                 context\n   56 |                     .compile_to_file(OutputKind::ObjectFile, bc_out.to_str().expect(\"path to str\"));","lines":2,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/back/write.rs#L55-L56"},{"ref":"src/back/write.rs:68-69","code":"   68 |                 context\n   69 |                     .compile_to_file(OutputKind::ObjectFile, bc_out.to_str().expect(\"path to str\"));","lines":2,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/back/write.rs#L68-L69"},{"ref":"src/back/write.rs:83","code":"   83 |             context.compile_to_file(OutputKind::Assembler, path.to_str().expect(\"path to str\"));","lines":1,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/back/write.rs#L83"},{"ref":"src/back/write.rs:146","code":"  146 |                         context.compile_to_file(OutputKind::Executable, &lto_path);","lines":1,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/back/write.rs#L146"},{"ref":"src/back/write.rs:163","code":"  163 |                         context.compile_to_file(OutputKind::ObjectFile, path);","lines":1,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/back/write.rs#L163"},{"ref":"src/back/write.rs:167","code":"  167 |                         context.compile_to_file(OutputKind::Executable, path);","lines":1,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/back/write.rs#L167"},{"ref":"src/back/write.rs:170-173","code":"  170 |                     context.compile_to_file(\n  171 |                         OutputKind::ObjectFile,\n  172 |                         obj_out.to_str().expect(\"path to str\"),\n  173 |                     );","lines":4,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/back/write.rs#L170-L173"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"gcc_checked_binop builds the result local using `rhs.get_type()` (see the FIXME at line 320) rather than the operand type `typ`/the normalized kind. For checked add/sub/mul on native ints where lhs and rhs were already coerced this is usually fine, but the result and the `__builtin_*_overflow` out-pointer are typed from rhs, then everything is re-cast to `new_type` derived from `new_kind`. If lhs and rhs differ in type/width the binopResult local has the wrong type for the pointer cast at line 327 (`res` cast to `new_type.make_pointer()` aliases a local of `rhs` type), which can misbehave when widths differ. The FIXME acknowledges the uncertainty.","fix":"Allocate `binopResult` with `new_type` (the normalized kind's GCC type) instead of `rhs.get_type()`, so the out-pointer cast and dereference are type-consistent.","locations":[{"ref":"src/int.rs:342-355","code":"  342 |         let intrinsic = self.context.get_builtin_function(name);\n  343 |         let res = self\n  344 |             .current_func()\n  345 |             // FIXME(antoyo): is it correct to use rhs type instead of the parameter typ?\n  346 |             .new_local(self.location, rhs.get_type(), \"binopResult\")\n  347 |             .get_address(self.location);\n  348 |         let new_type = type_kind_to_gcc_type(new_kind);\n  349 |         let new_type = self.context.new_c_type(new_type);\n  350 |         let lhs = self.context.new_cast(self.location, lhs, new_type);\n  351 |         let rhs = self.context.new_cast(self.location, rhs, new_type);\n  352 |         let res = self.context.new_cast(self.location, res, new_type.make_pointer());\n  353 |         let overflow = self.overflow_call(intrinsic, &[lhs, rhs, res], None);\n  354 |         (res.dereference(self.location).to_rvalue(), overflow)\n  355 |     }","lines":14,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/int.rs#L342-L355"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`abi_test::run` uses `std::fs::copy(\"rust-toolchain\", ...).expect(...)` and `std::path::absolute(...).unwrap()`. If `rust-toolchain` is missing or the path cannot be made absolute, the tool panics with a backtrace instead of returning the `Result<(), String>` error it already supports.","fix":"Replace `.expect()`/`.unwrap()` with `.map_err(|e| format!(...))?` to surface a clean error.","locations":[{"ref":"build_system/src/abi_test.rs:37-41","code":"   37 |     std::fs::copy(\"rust-toolchain\", \"clones/abi-cafe/rust-toolchain\")\n   38 |         .expect(\"Could not copy toolchain configs!\");\n   39 |     // Get the backend path.\n   40 |     // We will use the *debug* build of the backend - it has more checks enabled.\n   41 |     let backend_path = std::path::absolute(\"target/debug/librustc_codegen_gcc.so\").unwrap();","lines":5,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/build_system/src/abi_test.rs#L37-L41"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`fuzz::run` ignores the exit status of building rustlantis only insofar as it propagates errors, but `git pull origin` is run unconditionally even when the repo was freshly cloned (shallow, depth 1). A shallow clone followed by `git pull origin` with no branch can fail or fetch unexpectedly; the error then aborts fuzzing. Minor robustness concern in the fuzz setup path.","fix":"Skip the `git pull` when the clone just ran, or specify the branch and handle shallow-repo pull semantics.","locations":[{"ref":"build_system/src/fuzz.rs:63-77","code":"   63 |     // Ensure that we have a cloned version of rustlantis on hand.\n   64 |     crate::utils::git_clone(\n   65 |         \"https://github.com/cbeuw/rustlantis.git\",\n   66 |         Some(\"clones/rustlantis\".as_ref()),\n   67 |         true,\n   68 |     )\n   69 |     .map_err(|err| format!(\"Git clone failed with message: {err:?}!\"))?;\n   70 | \n   71 |     // Ensure that we are on the newest rustlantis commit.\n   72 |     let cmd: &[&dyn AsRef<OsStr>] = &[&\"git\", &\"pull\", &\"origin\"];\n   73 |     run_command_with_output(cmd, Some(Path::new(\"clones/rustlantis\")))?;\n   74 | \n   75 |     // Build the release version of rustlantis\n   76 |     let cmd: &[&dyn AsRef<OsStr>] = &[&\"cargo\", &\"build\", &\"--release\"];\n   77 |     run_command_with_output(cmd, Some(Path::new(\"clones/rustlantis\")))?;","lines":15,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/build_system/src/fuzz.rs#L63-L77"}]},
{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In `fuzz_range`, worker threads call `.unwrap()` on `fs::create_dir_all`, `fs::copy`, and the `reduce` flow. A failure (e.g. disk full, permission, or the source file having been removed) panics the worker thread rather than reporting a clear error; the manager loop then keeps running because it only checks `is_finished()`, so a panicked thread looks like a finished one and its work is silently lost.","fix":"Propagate errors out of the worker closure (collect a Result) and join workers, or at least log the path/error before unwrapping; check `JoinHandle::join` results in the manager loop.","locations":[{"ref":"build_system/src/fuzz.rs:108-134","code":"  108 |                         // ... copy that file to the directory `target/fuzz/compiletime_error`...\n  109 |                         let mut out_path: std::path::PathBuf =\n  110 |                             \"target/fuzz/compiletime_error\".into();\n  111 |                         std::fs::create_dir_all(&out_path).unwrap();\n  112 |                         // .. into a file named `fuzz{seed}.rs`.\n  113 |                         out_path.push(format!(\"fuzz{next}.rs\"));\n  114 |                         std::fs::copy(err, out_path).unwrap();\n  115 |                     }\n  116 |                     Ok(Err(err)) => {\n  117 |                         // If the test failed at run-time...\n  118 |                         println!(\"The LLVM and GCC results don't match for {err:?}\");\n  119 |                         // ... generate a new file, which prints temporaries(instead of hashing them)...\n  120 |                         let mut out_path: std::path::PathBuf = \"target/fuzz/runtime_error\".into();\n  121 |                         std::fs::create_dir_all(&out_path).unwrap();\n  122 |                         let Ok(Err(tmp_print_err)) = test(next, true) else {\n  123 |                             // ... if that file does not reproduce the issue...\n  124 |                             // ... save the original sample in a file named `fuzz{seed}.rs`...\n  125 |                             out_path.push(format!(\"fuzz{next}.rs\"));\n  126 |                             std::fs::copy(err, &out_path).unwrap();\n  127 |                             continue;\n  128 |                         };\n  129 |                         // ... if that new file still produces the issue, copy it to `fuzz{seed}.rs`..\n  130 |                         out_path.push(format!(\"fuzz{next}.rs\"));\n  131 |                         std::fs::copy(tmp_print_err, &out_path).unwrap();\n  132 |                         // ... and start reducing it, using some properties of `rustlantis` to speed up the process.\n  133 |                         reduce::reduce(&out_path);\n  134 |                     }","lines":27,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/build_system/src/fuzz.rs#L108-L134"},{"ref":"build_system/src/fuzz.rs:142-159","code":"  142 |     while start.load(Ordering::Relaxed) < end || !workers.iter().all(|t| t.is_finished()) {\n  143 |         // Every 500 ms...\n  144 |         let five_hundred_millis = Duration::from_millis(500);\n  145 |         std::thread::sleep(five_hundred_millis);\n  146 |         // ... calculate the remaining fuzz iters ...\n  147 |         let remaining = end - start.load(Ordering::Relaxed);\n  148 |         // ... fix the count(the start counter counts the cases that\n  149 |         // begun fuzzing, and not only the ones that are done)...\n  150 |         let fuzzed = (total - remaining).saturating_sub(threads as u64);\n  151 |         // ... and the fuzz speed ...\n  152 |         let iter_per_sec = fuzzed as f64 / start_time.elapsed().as_secs_f64();\n  153 |         // .. and use them to display fuzzing stats.\n  154 |         println!(\n  155 |             \"fuzzed {fuzzed} cases({}%), at rate {iter_per_sec} iter/s, remaining ~{}s\",\n  156 |             (100 * fuzzed) as f64 / total as f64,\n  157 |             (remaining as f64) / iter_per_sec\n  158 |         )\n  159 |     }","lines":18,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/build_system/src/fuzz.rs#L142-L159"}]},
{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`prepare_rand` and `prepare_libcore` apply patches with hard-coded relative parent paths (`Path::new(\"../..\")` / `Path::new(\"../../..\")`) joined to patch paths, relying on the exact cwd-depth of the git command. These magic relative prefixes are brittle: if the sysroot directory depth changes the `git apply` silently targets the wrong path and fails with a confusing git error rather than a clear message.","fix":"Canonicalize patch paths to absolute before passing them to `git apply` instead of computing `../..` prefixes relative to the git cwd.","locations":[{"ref":"build_system/src/prepare.rs:135-145","code":"  135 |     for file_path in patches {\n  136 |         println!(\"[GIT] apply `{}`\", file_path.display());\n  137 |         let path = Path::new(\"../../..\").join(file_path);\n  138 |         run_git_command_with_output(&\"apply\", &[&path], Some(&sysroot_dir))?;\n  139 |         run_git_command_with_output(&\"add\", &[&\"-A\"], Some(&sysroot_dir))?;\n  140 |         run_git_command_with_output(\n  141 |             &\"commit\",\n  142 |             &[&\"-m\", &format!(\"Patch {}\", path.display())],\n  143 |             Some(&sysroot_dir),\n  144 |         )?;\n  145 |     }","lines":11,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/build_system/src/prepare.rs#L135-L145"},{"ref":"build_system/src/prepare.rs:152-164","code":"  152 | fn prepare_rand() -> Result<(), String> {\n  153 |     // Apply patch for the rand crate.\n  154 |     let file_path = \"patches/crates/0001-Remove-deny-warnings.patch\";\n  155 |     let rand_dir = Path::new(\"build/rand\");\n  156 |     println!(\"[GIT] apply `{file_path}`\");\n  157 |     let path = Path::new(\"../..\").join(file_path);\n  158 |     run_git_command_with_output(&\"apply\", &[&path], Some(rand_dir))?;\n  159 | {"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`setup_rustc` writes a hard-coded `change-id = 115898` into the generated rust `config.toml`. This bootstrap change-id drifts over time and, when stale, causes `x.py` to print a warning or (in stricter modes) fail. It is a maintenance/foot-gun constant embedded in a format string with no explanation of how it is kept in sync with the checked-out rustc commit.","fix":"Document the source of the change-id and/or derive it, or suppress the warning explicitly; add a FIXME noting it must track the pinned rustc.","locations":[{"ref":"build_system/src/test.rs:598-624","code":"  598 |     std::fs::write(\n  599 |         &file_path,\n  600 |         format!(\n  601 |             r#\"change-id = 115898\n  602 | \n  603 | [rust]\n  604 | codegen-backends = [\"gcc\"]\n  605 | deny-warnings = false\n  606 | verbose-tests = true\n  607 | \n  608 | [build]\n  609 | cargo = \"{cargo}\"\n  610 | local-rebuild = true\n  611 | rustc = \"{rustc}\"\n  612 | \n  613 | [target.x86_64-unknown-linux-gnu]\n  614 | llvm-filecheck = \"{llvm_filecheck}\"\n  615 | \n  616 | [llvm]\n  617 | download-ci-llvm = false\n  618 | \"#,\n  619 |             cargo = cargo,\n  620 |             rustc = rustc,\n  621 |             llvm_filecheck = llvm_filecheck.trim(),\n  622 |         ),\n  623 |     )\n  624 |     .map_err(|error| format!(\"Failed to write into `{}`: {:?}\", file_path.display(), error))?;","lines":27,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/build_system/src/test.rs#L598-L624"}]},
{"id":"ERR_10","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`run()` dispatch for runners does `runners.get(runner.as_str()).unwrap().1(...)`. The runner strings are validated against `runners` at parse time, so this is currently safe, but the `unwrap` couples two separate `get_runners()` constructions; if the parse-time and run-time runner sets ever diverge it becomes a panic. Minor robustness issue.","fix":"Match on `runners.get(...)` and return a descriptive error for the `None` case.","locations":[{"ref":"build_system/src/test.rs:1616-1619","code":" 1616 |         let runners = get_runners();\n 1617 |         for runner in args.runners.iter() {\n 1618 |             runners.get(runner.as_str()).unwrap().1(&env, &args)?;\n 1619 |         }","lines":4,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/build_system/src/test.rs#L1616-L1619"}]},
{"id":"ERR_11","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`get_command_inner` panics (`panic!(\"empty command\")`) on an empty input slice. While all current call sites pass non-empty literals, an empty command is a programmer error that aborts the whole tool with a backtrace rather than a graceful error. Minor.","fix":"Acceptable as an invariant, but consider returning a `Result` so the failure is reported cleanly.","locations":[{"ref":"build_system/src/utils.rs:36-39","code":"   36 |     let (cmd, args) = match input {\n   37 |         [] => panic!(\"empty command\"),\n   38 |         [cmd, args @ ..] => (cmd, args),\n   39 |     };","lines":4,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/build_system/src/utils.rs#L36-L39"}]},
{"id":"ERR_12","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`emit_ir` is handled by writing an empty file (`std::fs::write(out, \"\").expect(\"write file\")`). This both fabricates an empty .ll output silently (a user requesting LLVM IR gets an empty file with no warning that IR emission is unimplemented for the GCC backend) and panics via `expect` on any write error (a disk/permission failure, not an internal invariant).","fix":"Emit a diagnostic that IR output is unsupported by the GCC backend, and if a placeholder file must be written, handle the io::Error with a proper diagnostic instead of `expect`.","locations":[{"ref":"src/back/write.rs:73-77","code":"   73 |         if config.emit_ir {\n   74 |             let out =\n   75 |                 cgcx.output_filenames.temp_path_for_cgu(OutputType::LlvmAssembly, &module.name);\n   76 |             std::fs::write(out, \"\").expect(\"write file\");\n   77 |         }","lines":5,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/back/write.rs#L73-L77"}]},
{"id":"ERR_13","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`CopyBitcode` error in `back/write.rs` emits a diagnostic (`dcx.emit_err`) but then control flow falls through and `module.into_compiled_module(...)` is still called with `config.emit_obj != EmitObj::None` as the `object` flag, implying an object file exists when the copy failed. The compilation may continue with a missing object file. emit_err records an error so the overall compile will fail, but the immediate state is inconsistent.","fix":"On copy failure, treat the object as not produced (or bail), so `into_compiled_module` is not told an object file exists.","locations":[{"ref":"src/back/write.rs:177-187","code":"  177 |             EmitObj::Bitcode => {\n  178 |                 debug!(\"copying bitcode {:?} to obj {:?}\", bc_out, obj_out);\n  179 |                 if let Err(err) = link_or_copy(&bc_out, &obj_out) {\n  180 |                     dcx.emit_err(CopyBitcode { err });\n  181 |                 }\n  182 | \n  183 |                 if !config.emit_bc {\n  184 |                     debug!(\"removing_bitcode {:?}\", bc_out);\n  185 |                     ensure_removed(dcx, &bc_out);\n  186 |                 }\n  187 |             }","lines":11,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/back/write.rs#L177-L187"},{"ref":"src/back/write.rs:193-200","code":"  193 |     module.into_compiled_module(\n  194 |         config.emit_obj != EmitObj::None,\n  195 |         cgcx.target_can_use_split_dwarf && cgcx.split_debuginfo == SplitDebuginfo::Unpacked,\n  196 |         config.emit_bc,\n  197 |         config.emit_asm,\n  198 |         config.emit_ir,\n  199 |         &cgcx.output_filenames,\n  200 |     )","lines":8,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/back/write.rs#L193-L200"}]},
{"id":"ERR_14","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"extract_value and insert_value call panic!() / panic!(\"Unexpected type\") for vector and unknown aggregate types. extract_value on a vector is an outright bare `panic!()`. These are reachable if SSA codegen ever calls extract_value/insert_value on a vector aggregate; using bug!() would give a proper compiler ICE message instead of an opaque panic.","fix":"Replace the bare panic!() calls with rustc_middle::bug!() with a descriptive message, or implement the vector case.","locations":[{"ref":"src/builder.rs:1633-1641","code":" 1633 |         } else if value_type.dyncast_vector().is_some() {\n 1634 |             panic!();\n 1635 |         } else if let Some(struct_type) = value_type.is_struct() {\n 1636 |             aggregate_value\n 1637 |                 .access_field(self.location, struct_type.get_field(idx as i32))\n 1638 |                 .to_rvalue()\n 1639 |         } else {\n 1640 |             panic!(\"Unexpected type {:?}\", value_type);\n 1641 |         }","lines":9,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/builder.rs#L1633-L1641"},{"ref":"src/builder.rs:1662-1668","code":" 1662 |         } else if value_type.dyncast_vector().is_some() {\n 1663 |             panic!();\n 1664 |         } else if let Some(struct_type) = value_type.is_struct() {\n 1665 |             new_val.access_field(None, struct_type.get_field(idx as i32))\n 1666 |         } else {\n 1667 |             panic!(\"Unexpected type {:?}\", value_type);\n 1668 |         };","lines":7,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/builder.rs#L1662-L1668"}]},
{"id":"ERR_15","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`mangle_name` (non-master builds) uses `debug_assert!` with a string literal as the condition: `debug_assert!(\"$.*\".contains(char), ...)`. A non-empty `&str` is not a bool, so this does not even type-check as written for a normal assert; relying on it being `debug_assert!` means it is compiled out in release and its intent (assert that the unsupported char is one of `$ . *`) is never actually checked. If it does compile, the literal is truthy and the assertion can never fail, making it useless.","fix":"Change to `debug_assert!(\"$.*\".contains(char), \"Unsupported char in function name {name}: {char}\")` ensuring the condition is the `contains(...)` bool (it appears the closure body intends exactly this); verify it compiles and actually guards the invariant.","locations":[{"ref":"src/declare.rs:252-269","code":"  252 | #[cfg(not(feature = \"master\"))]\n  253 | fn mangle_name(name: &str) -> String {\n  254 |     name.replace(\n  255 |         |char: char| {\n  256 |             if !char.is_alphanumeric() && char != '_' {\n  257 |                 debug_assert!(\n  258 |                     \"$.*\".contains(char),\n  259 |                     \"Unsupported char in function name {}: {}\",\n  260 |                     name,\n  261 |                     char\n  262 |                 );\n  263 |                 true\n  264 |             } else {\n  265 |                 false\n  266 |             }\n  267 |         },\n  268 |         \"_\",\n  269 |     )","lines":18,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/declare.rs#L252-L269"}]},
{"id":"ERR_16","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"Unsupported relocation models are reported with `eprintln!` to stderr and then silently ignored (no PIC/PIE/no-pie option is added at all). This bypasses the compiler's diagnostic machinery (no span, not captured by the error emitter, does not set an error flag) and produces a binary with an unspecified relocation model instead of failing. RelocModel has more variants (e.g. DynamicNoPic, Ropi, Rwpi, RopiRwpi) that fall into this arm.","fix":"Either handle the remaining RelocModel variants explicitly, or pass a `&Session`/`DiagCtxtHandle` in and emit a fatal/error diagnostic instead of `eprintln!` so the unsupported model is a hard, visible failure.","locations":[{"ref":"src/gcc_util.rs:275-294","code":"  275 | pub fn add_pic_option<'gcc>(context: &Context<'gcc>, relocation_model: RelocModel) {\n  276 |     match relocation_model {\n  277 |         rustc_target::spec::RelocModel::Static => {\n  278 |             context.add_command_line_option(\"-fno-pie\");\n  279 |             context.add_driver_option(\"-fno-pie\");\n  280 |         }\n  281 |         rustc_target::spec::RelocModel::Pic => {\n  282 |             context.add_command_line_option(\"-fPIC\");\n  283 |             // NOTE: we use both add_command_line_option and add_driver_option because the usage in\n  284 |             // base (compile_codegen_unit) requires add_command_line_option while the usage\n  285 |             // in the back::write module (codegen) requires add_driver_option.\n  286 |             context.add_driver_option(\"-fPIC\");\n  287 |         }\n  288 |         rustc_target::spec::RelocModel::Pie => {\n  289 |             context.add_command_line_option(\"-fPIE\");\n  290 |             context.add_driver_option(\"-fPIE\");\n  291 |         }\n  292 |         model => eprintln!(\"Unsupported relocation model: {:?}\", model),\n  293 |     }\n  294 | }","lines":20,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/gcc_util.rs#L275-L294"}]},
{"id":"ERR_17","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In `codegen_intrinsic_call`, `result_place.unwrap()` is taken unconditionally at the top, before dispatch. Intrinsics whose result is a unit/never type may legitimately be called with `result_place == None`; the early unwrap turns that into an ICE instead of being handled per-arm. Most arms that `return ... WroteIntoPlace`/`Fallback` never touch `result`, so building the `PlaceRef` eagerly is both wasteful and a latent panic source.","fix":"Only unwrap `result_place` in the arms that actually write a result (the fall-through store at the bottom), or use `expect` with a message documenting the invariant that codegen always supplies a place for these intrinsics.","locations":[{"ref":"src/intrinsic/mod.rs:174","code":"  174 |         let result = PlaceRef { val: result_place.unwrap(), layout: result_layout };","lines":1,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/intrinsic/mod.rs#L174"}]},
{"id":"ERR_18","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`simd_funnel_shift` ends with `unimplemented!(\"funnel shift on {:?}\", elem_type)` for any element type that is not an 8/16/32/64-bit integer (e.g. i128/u128). `unimplemented!` panics the compiler (ICE) rather than emitting a proper InvalidMonomorphization diagnostic, unlike the rest of this file which uses `return_error!`. A 128-bit-element funnel shift would ICE.","fix":"Plumb the span/name through and emit an InvalidMonomorphization::UnsupportedOperation (or similar) diagnostic instead of `unimplemented!`, consistent with the other unsupported-element-type paths.","locations":[{"ref":"src/intrinsic/simd.rs:1759-1761","code":" 1759 |     } else {\n 1760 |         unimplemented!(\"funnel shift on {:?}\", elem_type);\n 1761 |     };","lines":3,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/intrinsic/simd.rs#L1759-L1761"}]},
{"id":"ERR_19","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`load_libgccjit_if_needed` panics with `panic!(\"Cannot load libgccjit.so: {}\", error)` and `init` panics listing attempted paths. These are user-facing failure modes (wrong sysroot/library path) handled via raw `panic!` rather than a proper session fatal diagnostic, producing an ICE-style backtrace instead of a clean compiler error.","fix":"Emit a fatal session diagnostic (sess.dcx().fatal(...)) for the missing/unloadable libgccjit case so the user sees a clean error rather than a panic/backtrace.","locations":[{"ref":"src/lib.rs:178-191","code":"  178 | fn load_libgccjit_if_needed(libgccjit_target_lib_file: &Path) {\n  179 |     if gccjit::is_loaded() {\n  180 |         // Do not load a libgccjit second time.\n  181 |         return;\n  182 |     }\n  183 | \n  184 |     let path = libgccjit_target_lib_file.to_str().expect(\"libgccjit path\");\n  185 | \n  186 |     let string = CString::new(path).expect(\"string to libgccjit path\");\n  187 | \n  188 |     if let Err(error) = gccjit::load(&string) {\n  189 |         panic!(\"Cannot load libgccjit.so: {}\", error);\n  190 |     }\n  191 | }","lines":14,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/lib.rs#L178-L191"}]},
{"id":"ERR_20","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"negligible","difficulty":"medium","description":"Debug-dump side effects use `let _ = fs::create_dir(\"/tmp/reproducers\")` / `\"/tmp/gccjit_dumps\"` and hardcode absolute `/tmp` paths. These are non-portable (no $TMPDIR, fails on non-Unix), and discarding the create_dir result means a failure other than already-exists (e.g. /tmp not writable) is masked and the subsequent `dump_*_to_file` will then fail. These are debug-only env-gated paths, so impact is low.","fix":"Use `std::env::temp_dir()` joined with a subdir, and ignore only `AlreadyExists` errors while surfacing others.","locations":[{"ref":"src/back/write.rs:96-108","code":"   96 |                     println!(\"Dumping reproducer {}\", module.name);\n   97 |                     let _ = fs::create_dir(\"/tmp/reproducers\");\n   98 |                     // FIXME(antoyo): segfault in dump_reproducer_to_file() might be caused by\n   99 |                     // transmuting an rvalue to an lvalue.\n  100 |                     // Segfault is actually in gcc::jit::reproducer::get_identifier_as_lvalue\n  101 |                     context.dump_reproducer_to_file(format!(\"/tmp/reproducers/{}.c\", module.name));\n  102 |                     println!(\"Dumped reproducer {}\", module.name);\n  103 |                 }\n  104 |                 if env::var(\"CG_GCCJIT_DUMP_TO_FILE\").as_deref() == Ok(\"1\") {\n  105 |                     let _ = fs::create_dir(\"/tmp/gccjit_dumps\");\n  106 |                     let path = &format!(\"/tmp/gccjit_dumps/{}.c\", module.name);\n  107 |                     context.set_debug_info(true);\n  108 |                     context.dump_to_file(path, true);","lines":13,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/back/write.rs#L96-L108"}]},
{"id":"ERR_21","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"negligible","difficulty":"medium","description":"The catch-all `unimplemented!(\"simd {}\", name)` at the end of `generic_simd_intrinsic` panics (ICE) for any unhandled SIMD intrinsic symbol instead of emitting a user-facing diagnostic. This is an existing convention but means an unrecognized/unsupported simd intrinsic crashes the compiler rather than producing an error.","fix":"Emit InvalidMonomorphization::UnrecognizedIntrinsic (already used by simd_simple_float_intrinsic) instead of `unimplemented!`.","locations":[{"ref":"src/intrinsic/simd.rs:1728","code":" 1728 |     unimplemented!(\"simd {}\", name);","lines":1,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/intrinsic/simd.rs#L1728"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"operation_with_overflow rebuilds the full FnAbi (layout_of, adjust_for_foreign_abi) on EVERY call to determine whether the return is passed indirectly, and re-creates the extern function and three parameters each time. For i128 add/sub/mul-overflow this query+function-creation happens at every use site. layout_of and adjust_for_foreign_abi are non-trivial; this is per-callsite overhead that could be cached by width.","fix":"Cache the (ret_indirect, fn signature) per width on the CodegenCx, or compute the indirect-return decision once.","locations":[{"ref":"src/int.rs:358-435","code":"  358 |     pub fn operation_with_overflow(\n  359 |         &self,\n  360 |         func_name: &str,\n  361 |         lhs: RValue<'gcc>,\n  362 |         rhs: RValue<'gcc>,\n  363 |         width: u64,\n  364 |     ) -> (RValue<'gcc>, RValue<'gcc>) {\n  365 |         let a_type = lhs.get_type();\n  366 |         let b_type = rhs.get_type();\n  367 |         debug_assert!(a_type.dyncast_array().is_some());\n  368 |         debug_assert!(b_type.dyncast_array().is_some());\n  369 |         let overflow_type = self.i32_type;\n  370 |         let overflow_param_type = overflow_type.make_pointer();\n  371 |         let res_type = a_type;\n  372 | \n  373 |         let overflow_value =\n  374 |             self.current_func().new_local(self.location, overflow_type, \"overflow\");\n  375 |         let overflow_addr = overflow_value.get_address(self.location);\n  376 | \n  377 |         let param_a = self.context.new_parameter(self.location, a_type, \"a\");\n  378 |         let param_b = self.context.new_parameter(self.location, b_type, \"b\");\n  379 |         let param_overflow =\n  380 |             self.context.new_parameter(self.location, overflow_param_type, \"overflow\");\n  381 | \n  382 |         let a_elem_type = a_type.dyncast_array().expect(\"non-array a value\");\n  383 |         debug_assert!(a_elem_type.is_integral());\n  384 |         let res_ty = match width {\n  385 |             32 => self.tcx.types.i32,\n  386 |             64 => self.tcx.types.i64,\n  387 |             128 => self.tcx.types.i128,\n  388 |             _ => unreachable!(\"unexpected integer size\"),\n  389 |         };\n  390 |         let layout = self\n  391 |             .tcx\n  392 |             .layout_of(ty::TypingEnv::fully_monomorphized().as_query_input(res_ty))\n  393 |             .unwrap();\n  394 | \n  395 |         let arg_abi = ArgAbi { layout, mode: PassMode::Direct(ArgAttributes::new()) };\n  396 |         let mut fn_abi = FnAbi {\n  397 |             args: vec![arg_abi.clone(), arg_abi.clone(), arg_abi.clone()].into_boxed_slice(),\n  398 |             ret: arg_abi,\n  399 |             c_variadic: false,\n  400 |             fixed_count: 3,\n  401 |             conv: CanonAbi::C,\n  402 |             can_unwind: false,\n  403 |         };\n  404 |         fn_abi.adjust_for_foreign_abi(self.cx, ExternAbi::C { unwind: false });\n  405 | \n  406 |         let ret_indirect = matches!(fn_abi.ret.mode, PassMode::Indirect { .. });\n  407 | \n  408 |         let call = if ret_indirect {\n  409 |             let res_value = self.current_func().new_local(self.location, res_type, \"result_value\");\n  410 |             let res_addr = res_value.get_address(self.location);\n  411 |             let res_param_type = res_type.make_pointer();\n  412 |             let param_res = self.context.new_parameter(self.location, res_param_type, \"result\");\n  413 | \n  414 |             let func = self.context.new_function(\n  415 |                 self.location,\n  416 |                 FunctionType::Extern,\n  417 |                 self.type_void(),\n  418 |                 &[param_res, param_a, param_b, param_overflow],\n  419 |                 func_name,\n  420 |                 false,\n  421 |             );\n  422 |             let _void =\n  423 |                 self.context.new_call(self.location, func, &[res_addr, lhs, rhs, overflow_addr]);\n  424 |             res_value.to_rvalue()\n  425 |         } else {\n  426 |             let func = self.context.new_function(\n  427 |                 self.location,\n  428 |                 FunctionType::Extern,\n  429 |                 res_type,\n  430 |                 &[param_a, param_b, param_overflow],\n  431 |                 func_name,\n  432 |                 false,\n  433 |             );\n  434 |             self.context.new_call(self.location, func, &[lhs, rhs, overflow_addr])\n  435 |         };","lines":78,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/int.rs#L358-L435"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`adjust_function` distinguishes the two LLVM intrinsics that share a GCC builtin by formatting the rounding-mode argument with `format!(\"{:?}\", args[3])` and testing whether the debug string `ends_with(\"255\")`. Matching on the textual debug representation of an RValue is fragile: any change in gccjit's Debug impl, or a constant like 1255 / 4255, would silently select the wrong builtin. It also indexes `args[3]` unconditionally.","fix":"Extract the immediate integer value of `args[3]` through the gccjit API (or thread the rounding mode through from the caller) and compare it numerically to 255 instead of string-matching the Debug output.","locations":[{"ref":"src/intrinsic/llvm.rs:92-112","code":"   92 |     // FIXME: we should not need this hack: this is required because both _mm_fcmadd_sch\n   93 |     // and _mm_mask3_fcmadd_round_sch calls llvm.x86.avx512fp16.mask.vfcmadd.csh and we\n   94 |     // seem to need to map this one LLVM intrinsic to 2 different GCC builtins.\n   95 |     #[cfg(feature = \"master\")]\n   96 |     match func_name {\n   97 |         \"__builtin_ia32_vfcmaddcsh_mask3_round\" => {\n   98 |             if format!(\"{:?}\", args[3]).ends_with(\"255\") {\n   99 |                 return context\n  100 |                     .get_target_builtin_function(\"__builtin_ia32_vfcmaddcsh_mask_round\")\n  101 |                     .get_address(None);\n  102 |             }\n  103 |         }\n  104 |         \"__builtin_ia32_vfmaddcsh_mask3_round\" => {\n  105 |             if format!(\"{:?}\", args[3]).ends_with(\"255\") {\n  106 |                 return context\n  107 |                     .get_target_builtin_function(\"__builtin_ia32_vfmaddcsh_mask_round\")\n  108 |                     .get_address(None);\n  109 |             }\n  110 |         }\n  111 |         _ => (),\n  112 |     }","lines":21,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/intrinsic/llvm.rs#L92-L112"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`ModuleBuffer::data` always returns an empty slice `&[]`, and `ModuleBufferMethods::data` is the trait method cg_llvm uses to read the serialized module bytes. The actual data lives in the file at `ModuleBuffer(PathBuf)`. Any generic ssa code that calls `.data()` on this buffer (e.g. to hash or embed bitcode) will silently operate on zero bytes. This is a latent correctness trap if upstream ssa starts relying on the method.","fix":"Either read and return the file contents (memory-mapped) from `data()`, or document clearly (and assert) that this backend never routes through `data()` and combines object files via file paths instead.","locations":[{"ref":"src/back/lto.rs:266-278","code":"  266 | pub struct ModuleBuffer(PathBuf);\n  267 | \n  268 | impl ModuleBuffer {\n  269 |     pub fn new(path: PathBuf) -> ModuleBuffer {\n  270 |         ModuleBuffer(path)\n  271 |     }\n  272 | }\n  273 | \n  274 | impl ModuleBufferMethods for ModuleBuffer {\n  275 |     fn data(&self) -> &[u8] {\n  276 |         &[]\n  277 |     }\n  278 | }","lines":13,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/back/lto.rs#L266-L278"}]},
{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`dbg_loc` passes the line and column to `new_location` as `line as i32` / `col as i32`. `line`/`col` are `u32`; for files with more than 2^31 lines/columns this truncates to a negative value. Practically unreachable for real source files, but the cast is an unchecked narrowing of an externally-influenced value (line numbers come from source maps).","fix":"These values are tiny in practice; if defensiveness is desired, clamp to `i32::MAX` rather than casting. Otherwise document the assumption.","locations":[{"ref":"src/debuginfo.rs:58-65","code":"   58 |         let DebugLoc { file, line, col } = self.lookup_debug_loc(pos);\n   59 |         match file.name {\n   60 |             rustc_span::FileName::Real(ref name) => self.context.new_location(\n   61 |                 name.path(rustc_span::RemapPathScopeComponents::DEBUGINFO).to_string_lossy(),\n   62 |                 line as i32,\n   63 |                 col as i32,\n   64 |             ),\n   65 |             _ => Location::null(),","lines":8,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/debuginfo.rs#L58-L65"}]},
{"id":"API_5","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`type_ptr_to_ext` / `type_i8p_ext` ignore the `address_space` parameter entirely (FIXME present), so all pointers collapse to the default address space. In `const_alloc_to_gcc_uncached` the per-allocation `address_space` is computed (line 350) and threaded into `type_i8p_ext` and the scalar conversion, but it is then dropped, meaning pointers into non-default address spaces are mistyped. Tracked by FIXME but can produce wrong codegen on targets that use multiple address spaces.","fix":"Honor address_space when libgccjit gains support (TYPE_ADDR_SPACE), or document that only the default address space is currently supported and assert others are unused.","locations":[{"ref":"src/type_.rs:69-80","code":"   69 |     pub fn type_ptr_to_ext(&self, ty: Type<'gcc>, _address_space: AddressSpace) -> Type<'gcc> {\n   70 |         // FIXME(antoyo): use address_space, perhaps with TYPE_ADDR_SPACE?\n   71 |         ty.make_pointer()\n   72 |     }\n   73 | \n   74 |     pub fn type_i8p(&self) -> Type<'gcc> {\n   75 |         self.type_ptr_to(self.type_i8())\n   76 |     }\n   77 | \n   78 |     pub fn type_i8p_ext(&self, address_space: AddressSpace) -> Type<'gcc> {\n   79 |         self.type_ptr_to_ext(self.type_i8(), address_space)\n   80 |     }","lines":12,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/type_.rs#L69-L80"}]},
{"id":"API_6","type":"api_misuse","type_label":"Api Misuse","severity":"negligible","difficulty":"medium","description":"Throughout simd.rs many builder calls pass `None` as the source location (e.g. new_cast/new_rvalue_from_vector/new_bitcast), while a few pass `bx.location` (e.g. lines 157, 577, 616, 655). The inconsistency means most generated SIMD code carries no debug-location info even when `bx.location` is available, degrading debuginfo for SIMD intrinsics.","fix":"Prefer passing `bx.location` consistently where available instead of `None`, so emitted SIMD operations retain source locations.","locations":[{"ref":"src/intrinsic/simd.rs:113-120","code":"  113 |         let mut elements = vec![];\n  114 |         let one = bx.context.new_rvalue_one(mask.get_type());\n  115 |         for _ in 0..len {\n  116 |             let element = bx.context.new_cast(None, mask & one, mask_element_type);\n  117 |             elements.push(element);\n  118 |             mask = mask >> one;\n  119 |         }\n  120 |         let vector_mask = bx.context.new_rvalue_from_vector(None, vector_mask_type, &elements);","lines":8,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/intrinsic/simd.rs#L113-L120"},{"ref":"src/intrinsic/simd.rs:281-290","code":"  281 |     let simd_ctpop = |bx: &mut Builder<'a, 'gcc, 'tcx>, vector: RValue<'gcc>| -> RValue<'gcc> {\n  282 |         let mut vector_elements = vec![];\n  283 |         let elem_ty = bx.element_type(llret_ty);\n  284 |         for i in 0..in_len {\n  285 |             let index = bx.context.new_rvalue_from_long(bx.ulong_type, i as i64);\n  286 |             let element = bx.extract_element(vector, index).to_rvalue();\n  287 |             let result = bx.context.new_cast(None, bx.pop_count(element), elem_ty);\n  288 |             vector_elements.push(result);\n  289 |         }\n  290 |         bx.context.new_rvalue_from_vector(None, llret_ty, &vector_elements)","lines":10,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/intrinsic/simd.rs#L281-L290"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`const_alloc_to_gcc` deep-clones the entire allocation (`alloc.inner().clone()`, copying all bytes and provenance) on EVERY call just to build a cache key with alignment zeroed out, even on a cache hit. For large constant allocations (big arrays/strings) this allocates and copies the whole buffer twice per lookup (once for the borrow().get probe, then the value is dropped; again is not needed but the clone always happens before the hit check). This defeats much of the benefit of the dedup cache for large allocs.","fix":"Key the cache on a cheap, alignment-independent fingerprint (e.g. a hash of bytes+provenance, or wrap Allocation in a newtype whose Hash/Eq ignore alignment) instead of cloning the whole allocation. At minimum, avoid the clone on the hot cache-hit path.","locations":[{"ref":"src/consts.rs:30-47","code":"   30 | pub(crate) fn const_alloc_to_gcc<'gcc, 'tcx>(\n   31 |     cx: &CodegenCx<'gcc, 'tcx>,\n   32 |     alloc: ConstAllocation<'_>,\n   33 | ) -> RValue<'gcc> {\n   34 |     // We ignore the alignment for the purpose of deduping RValues\n   35 |     // The alignment is not handled / used in any way by `const_alloc_to_gcc`,\n   36 |     // so it is OK to overwrite it here.\n   37 |     let mut mock_alloc = alloc.inner().clone();\n   38 |     mock_alloc.align = rustc_abi::Align::MAX;\n   39 |     // Check if the rvalue is already in the cache - if so, just return it directly.\n   40 |     if let Some(res) = cx.const_cache.borrow().get(&mock_alloc) {\n   41 |         return *res;\n   42 |     }\n   43 |     // Rvalue not in the cache - convert and add it.\n   44 |     let res = crate::consts::const_alloc_to_gcc_uncached(cx, alloc);\n   45 |     cx.const_cache.borrow_mut().insert(mock_alloc, res);\n   46 |     res\n   47 | }","lines":18,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/consts.rs#L30-L47"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"Every reduction pass clones the entire file `Vec<String>` (`file.clone()`) on each candidate step inside the inner loops (often once per line/block), and `save_reduction` re-creates and rewrites the whole file after each pass. For large rustlantis outputs this is O(n^2) memory churn during reduction. It is a dev/fuzzing tool so impact is limited, but the repeated full-buffer clones dominate runtime.","fix":"Operate on indices/splices in place and revert on failure instead of cloning the whole vector each iteration; write `save_reduction` only once per pass (already once per pass, but it always rewrites the full file).","locations":[{"ref":"build_system/src/fuzz/reduce.rs:95-122","code":"   95 | fn remove_dump_var(file: &mut Vec<String>, path: &PathBuf) {\n   96 |     let mut curr = 0;\n   97 |     // ... try disabling `dump_vars` one by one, until only the necessary ones are left.\n   98 |     while curr < file.len() {\n   99 |         let Some(line) = file[curr..].iter().position(|line| line.contains(\"dump_var\")) else {\n  100 |             // No more `dump_var`s to remove - exit early.\n  101 |             break;\n  102 |         };\n  103 |         // Make the line absolute again.\n  104 |         let line = line + curr;\n  105 |         let mut file_copy = file.clone();\n  106 |         // Try removing 3 consecutive lines(the call, block end and block beginning). This effectively removes a `dump_var`.\n  107 |         file_copy.remove(line);\n  108 |         file_copy.remove(line);\n  109 |         file_copy.remove(line);\n  110 |         // Not cached - the execution result can change.\n  111 |         let mut uncached = None;\n  112 |         // Check if this reduction is valid.\n  113 |         if test_reduction(&file_copy, path, &mut uncached) {\n  114 |             println!(\"Reduced {path:?} by 3 lines `remove_dump_var`\");\n  115 |             *file = file_copy;\n  116 |             curr = line;\n  117 |         } else {\n  118 |             curr = line + 1;\n  119 |         }\n  120 |     }\n  121 |     save_reduction(file, path, \"remove_dump_var\");\n  122 | }","lines":28,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/build_system/src/fuzz/reduce.rs#L95-L122"},{"ref":"build_system/src/fuzz/reduce.rs:177-260","code":"  177 | fn block_abort(file: &mut Vec<String>, path: &PathBuf, cache: &mut ResultCache) {\n  178 |     let mut curr = 0;\n  179 |     while curr < file.len() {\n  180 |         let Some(block_starts) = file[curr..]\n  181 |             .iter()\n  182 |             .position(|line| line.starts_with(\"bb\") && line.trim_end().ends_with(\" = {\"))\n  183 |         else {\n  184 |             // No more `block`s to kill - exit early.\n  185 |             break;\n  186 |         };\n  187 |         let block_starts = block_starts + curr;\n  188 |         // Find the beginning of the next block to find the end of this block.\n  189 |         let Some(block_ends) = file[(block_starts + 1)..]\n  190 |             .iter()\n  191 |             .position(|line| line.starts_with(\"bb\") && line.trim_end().ends_with(\" = {\"))\n  192 |         else {\n  193 |             // No more `block`s to kill - exit early.\n  194 |             break;\n  195 |         };\n  196 |         let block_ends = block_starts + block_ends;\n  197 |         let block_starts = block_starts + 1;\n  198 |         let mut file_copy = file.clone();\n  199 |         // Remove the block body...\n  200 |         for _ in block_starts..(block_ends) {\n  201 |             file_copy.remove(block_starts);\n  202 |         }\n  203 |         // ..and insert an unconditional call to abort.\n  204 |         file_copy.insert(\n  205 |             block_starts,\n  206 |             \"Call(tmp = core::intrinsics::abort(), ReturnTo(bb1), UnwindUnreachable())\\n\"\n  207 |                 .to_string(),\n  208 |         );\n  209 |         file_copy.insert(block_starts, \"let tmp = ();\\n\".to_string());\n  210 | \n  211 |         if test_reduction(&file_copy, path, cache) {\n  212 |             println!(\"Reduced {path:?} by {} lines `block_abort`\", block_ends - block_starts - 2);\n  213 |             *file = file_copy;\n  214 |             curr = block_starts;\n  215 |         } else {\n  216 |             curr = block_ends;\n  217 |         }\n  218 |     }\n  219 |     save_reduction(file, path, \"block_abort\");\n  220 | }\n  221 | \n  222 | /// Removes unreachable basic blocks\n  223 | fn remove_block(file: &mut Vec<String>, path: &PathBuf, cache: &mut ResultCache) {\n  224 |     let mut curr = 0;\n  225 | \n  226 |     // Next, we try to outright remove blocks.\n  227 |     while curr < file.len() {\n  228 |         let Some(block_starts) = file[curr..]\n  229 |             .iter()\n  230 |             .position(|line| line.starts_with(\"bb\") && line.trim_end().ends_with(\" = {\"))\n  231 |         else {\n  232 |             // No more `block`s to remove - exit early.\n  233 |             break;\n  234 |         };\n  235 |         let block_starts = block_starts + curr;\n  236 |         // Find the beginning of the next block to find the end of this block.\n  237 |         let Some(block_ends) = file[(block_starts + 1)..]\n  238 |             .iter()\n  239 |             .position(|line| line.starts_with(\"bb\") && line.trim_end().ends_with(\" = {\"))\n  240 |         else {\n  241 |             // No more `block`s to remove - exit early.\n  242 |             break;\n  243 |         };\n  244 |         let block_ends = block_starts + block_ends + 1;\n  245 |         // Large blocks are likely to be necessary.\n  246 |         if block_ends - block_starts > 6 {\n  247 |             curr = block_starts + 1;\n  248 |             continue;\n  249 |         }\n  250 |         let mut file_copy = file.clone();\n  251 |         file_copy.drain
