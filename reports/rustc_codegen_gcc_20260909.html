<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"rlib loading in `prepare_lto` uses `expect`/`unwrap` on fallible I/O and parsing: `File::open(path).expect(\"couldn't open rlib\")`, `Mmap::map(...).expect(\"couldn't map rlib\")`, `rmeta_link::read_from_data(...).unwrap()`, `ArchiveFile::parse(...).expect(\"wanted an rlib\")`, and `child.data(...).expect(\"corrupt rlib\")`. These depend on the state of external rlib files on disk during LTO (which can be truncated, corrupted, or unreadable due to permissions / a concurrent build), not on internal compiler invariants. Any such condition aborts the compiler with a panic + backtrace instead of a clean diagnostic. The temporary-directory creation just above (lines 51-56) correctly uses `dcx.fatal`, so these paths are inconsistent with the surrounding error-handling style.","fix":"Convert these to emitted diagnostics via `dcx.fatal(...)` / a dedicated `Diagnostic` (as is already done for `LtoBitcodeFromRlib` in `save_as_file`), e.g. match on the `Result` and call `dcx.fatal(format!(\"failed to open rlib {}: {error}\", path.display()))`.","locations":[{"ref":"src/back/lto.rs:65-92","code":"   65 |     for path in each_linked_rlib_for_lto {\n   66 |         let archive_data = unsafe {\n   67 |             Mmap::map(File::open(path).expect(\"couldn't open rlib\")).expect(\"couldn't map rlib\")\n   68 |         };\n   69 |         let metadata_link = rmeta_link::read_from_data(&archive_data, path).unwrap();\n   70 |         let archive = ArchiveFile::parse(&*archive_data).expect(\"wanted an rlib\");\n   71 |         let obj_files = archive\n   72 |             .members()\n   73 |             .filter_map(|child| {\n   74 |                 child\n   75 |                     .ok()\n   76 |                     .and_then(|c| std::str::from_utf8(c.name()).ok().map(|name| (name.trim(), c)))\n   77 |             })\n   78 |             .filter(|&(name, _)| metadata_link.rust {"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`remove_dup_assign` iterates `for index in starts..ends` and accesses `file_copy[index + 1]`. When `ends == file.len()` (the initial call from `reduce` passes `ends = file.len()`), `index + 1` equals `file.len()` on the last iteration and panics with an out-of-bounds index. The early-return guard only skips when `ends - starts < 8`, so for files with >=8 lines this is reachable.","fix":"Iterate `for index in starts..ends.saturating_sub(1)` (or `starts..(ends - 1)`), so the `index + 1` access stays in bounds.","locations":[{"ref":"build_system/src/fuzz/reduce.rs:35-70","code":"   35 | fn remove_dup_assign(\n   36 |     file: &mut Vec<String>,\n   37 |     path: &PathBuf,\n   38 |     starts: usize,\n   39 |     ends: usize,\n   40 |     cache: &mut ResultCache,\n   41 | ) {\n   42 |     let mut file_copy = file.clone();\n   43 |     let mut reduction_count = 0;\n   44 |     // Not worth it.\n   45 |     if ends - starts < 8 {\n   46 |         return;\n   47 |     }\n   48 |     for index in starts..ends {\n   49 |         let Some((prefix, _)) = file_copy[index].split_once('=') else {\n   50 |             continue;\n   51 |         };\n   52 |         let Some((prefix2, postifx2)) = file_copy[index + 1].split_once('=') else {\n   53 |             continue;\n   54 |         };\n   55 |         let prefix = prefix.trim();\n   56 |         let prefix2 = prefix2.trim();\n   57 |         // FIXME: Right now, remove_dup_assign cares about assignments to the exact same place.\n   58 |         // However, given an assigemnt like this:\n   59 |         // ```\n   60 |         // A.0 = 1_u32;\n   61 |         // A = (2_u32, 3.0);\n   62 |         // ```\n   63 |         // The first assignment could be safely omitted.\n   64 |         // Additionally, we try to check if the second assignment could depend on the first one.\n   65 |         // In such cases, the result is likely to change, so we bail.\n   66 |         if prefix == prefix2 && !postifx2.contains(prefix) {\n   67 |             file_copy[index] = \"\".into();\n   68 |             reduction_count += 1;\n   69 |         }\n   70 |     }","lines":36,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/build_system/src/fuzz/reduce.rs#L35-L70"},{"ref":"build_system/src/fuzz/reduce.rs:417-419","code":"  417 |     let len = file.len();\n  418 |     println!(\"running `remove_dup_assign` on {path:?}.\");\n  419 |     remove_dup_assign(&mut file, &path, 0, len, &mut cache);","lines":3,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/build_system/src/fuzz/reduce.rs#L417-L419"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`get_rustc_path` calls `String::from_utf8(out.stdout).unwrap()` on the output of `rustup which rustc`. If rustup emits non-UTF8 bytes this panics. As this is in the `prepare` path, a confusing crash results instead of a clear message.","fix":"Use `String::from_utf8_lossy` or propagate a descriptive error (the function returns Option, so map failures to None or change the signature).","locations":[{"ref":"build_system/src/rustc_info.rs:9-12","code":"    9 |     run_command(&[&\"rustup\", &\"which\", &\"rustc\"], None)\n   10 |         .ok()\n   11 |         .map(|out| Path::new(String::from_utf8(out.stdout).unwrap().trim()).to_path_buf())\n   12 | }","lines":4,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/build_system/src/rustc_info.rs#L9-L12"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`maybe_run_command_in_vm` uses several `.unwrap()` calls: `std::env::current_dir().unwrap()` (when CG_GCC_VM_DIR unset), `command.first().unwrap()`, and `exe.file_name().unwrap()`. A command whose first element has no file name component (e.g. ends in `..` or `/`) or a process with no cwd will panic with an opaque message instead of a clear error. Only reachable with `run_in_vm` (m68k cross), so low severity.","fix":"Replace the unwraps with `?`/`ok_or_else` returning descriptive `String` errors.","locations":[{"ref":"build_system/src/test.rs:316-326","code":"  316 |     let vm_parent_dir = match env.get(\"CG_GCC_VM_DIR\") {\n  317 |         Some(dir) if !dir.is_empty() => PathBuf::from(dir.clone()),\n  318 |         _ => std::env::current_dir().unwrap(),\n  319 |     };\n  320 |     let vm_dir = \"vm\";\n  321 |     let exe_to_run = command.first().unwrap();\n  322 |     let exe = Path::new(&exe_to_run);\n  323 |     let exe_filename = exe.file_name().unwrap();\n  324 |     let vm_home_dir = vm_parent_dir.join(vm_dir).join(\"home\");\n  325 |     let vm_exe_path = vm_home_dir.join(exe_filename);\n  326 |     let inside_vm_exe_path = Path::new(\"/home\").join(exe_filename);","lines":11,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/build_system/src/test.rs#L316-L326"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`extended_regex_example_tests` builds the bash pipeline by joining `cargo_command.iter().map(|s| s.as_ref().to_str().unwrap())`. If any cargo arg is non-UTF8 (path-derived), this panics. Also note the resulting command is passed unescaped to `bash -c`, so paths with spaces/special chars would break the pipeline (a correctness latent bug).","fix":"Use `to_string_lossy()` and shell-escape arguments, or follow the existing FIXME and feed input via `child.stdin.write_all`.","locations":[{"ref":"build_system/src/test.rs:942-950","code":"  942 |             let mut command: Vec<&dyn AsRef<OsStr>> = vec![&\"bash\", &\"-c\"];\n  943 |             let cargo_args =\n  944 |                 cargo_command.iter().map(|s| s.as_ref().to_str().unwrap()).collect::<Vec<_>>();\n  945 |             let bash_command = format!(\n  946 |                 \"cat examples/regexdna-input.txt | {} | grep -v 'Spawned thread' > res.txt\",\n  947 |                 cargo_args.join(\" \"),\n  948 |             );\n  949 |             command.push(&bash_command);\n  950 |             run_command_with_output_and_env(&command, cwd, Some(env))?;","lines":9,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/build_system/src/test.rs#L942-L950"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`test_rustc_inner` does `env.get_mut(\"RUSTFLAGS\").unwrap().clear()`. If `RUSTFLAGS` is not present in the env map (it is normally inserted by `config.setup`, but this function is also reachable via callbacks that clone env), this panics. Relying on an env key inserted elsewhere is fragile.","fix":"Use `env.entry(\"RUSTFLAGS\".to_string()).or_default().clear();` or guard with `if let Some(v) = env.get_mut(...)`.","locations":[{"ref":"build_system/src/test.rs:1209","code":" 1209 |     env.get_mut(\"RUSTFLAGS\").unwrap().clear();","lines":1,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/build_system/src/test.rs#L1209"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`cargo_install` calls `String::from_utf8(output.stdout).unwrap()` on the output of `cargo install --list`. Non-UTF8 output (unlikely but possible with odd crate names/locales) panics with a confusing crash instead of a clear error.","fix":"Use `String::from_utf8_lossy(&output.stdout)` or map the error to a descriptive `String`.","locations":[{"ref":"build_system/src/utils.rs:173-179","code":"  173 |     if String::from_utf8(output.stdout)\n  174 |         .unwrap()\n  175 |         .lines()\n  176 |         .any(|line| line.ends_with(':') && line.starts_with(&to_install_needle))\n  177 |     {\n  178 |         return Ok(());\n  179 |     }","lines":7,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/build_system/src/utils.rs#L173-L179"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`get_repo_name` does `url.split('/').next_back().unwrap()`. `split` on a non-empty `&str` always yields at least one element so this cannot panic today, but it is brittle: an empty URL string would panic. Low severity since callers pass literals.","fix":"Use `unwrap_or(url)` or handle the empty case explicitly.","locations":[{"ref":"build_system/src/utils.rs:295-301","code":"  295 | fn get_repo_name(url: &str) -> String {\n  296 |     let repo_name = url.split('/').next_back().unwrap();\n  297 |     match repo_name.strip_suffix(\".git\") {\n  298 |         Some(n) => n.to_string(),\n  299 |         None => repo_name.to_string(),\n  300 |     }\n  301 | }","lines":7,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/build_system/src/utils.rs#L295-L301"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`CString::new(name).unwrap()` (lto.rs:86 and :215) and `CString::new(...).unwrap()` for serialized module names assume the names contain no interior NUL byte. Module/object-file names ultimately derive from archive member names read off disk (`std::str::from_utf8(c.name())`); a crafted/corrupt rlib member name could contain a NUL and turn this into a panic rather than a diagnostic. Reachable on malformed input rather than an internal invariant.","fix":"Handle the `CString::new` error path with a diagnostic (corrupt rlib / invalid object name) instead of `unwrap()`.","locations":[{"ref":"src/back/lto.rs:86","code":"   86 |                     upstream_modules.push((module, CString::new(name).unwrap()));","lines":1,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/back/lto.rs#L86"},{"ref":"src/back/lto.rs:155","code":"  155 |                     CString::new(name).unwrap(),","lines":1,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/back/lto.rs#L155"},{"ref":"src/back/lto.rs:215","code":"  215 |             let llmod_id = CString::new(&module.name[..]).unwrap();","lines":1,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/back/lto.rs#L215"}]},
{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`compile_codegen_unit` cost computation: `time_to_codegen.as_secs() * 1_000_000_000 + subsec_nanos() as u64`. `as_secs()` is u64; multiplying by 1e9 overflows u64 only after ~584 years of codegen time, so practically safe, but on a debug build a pathologically long (or clock-adjusted) duration could trigger a multiply overflow panic. Negligible real impact; noted for completeness.","fix":"Prefer `time_to_codegen.as_nanos() as u64` (saturating) which expresses intent and avoids the explicit multiply.","locations":[{"ref":"src/base.rs:134","code":"  134 |     let cost = time_to_codegen.as_secs() * 1_000_000_000 + time_to_codegen.subsec_nanos() as u64;","lines":1,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/base.rs#L134"}]},
{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`const_vector` indexes `values[0]` to derive the element type. If called with an empty slice this panics with an out-of-bounds index. While SIMD vectors are normally non-empty, there is no assertion documenting the invariant, and the panic message would be opaque.","fix":"Add an explicit `assert!(!values.is_empty(), \"const_vector requires at least one element\")` or use `values.first().expect(...)` with a descriptive message.","locations":[{"ref":"src/common.rs:315-318","code":"  315 |     fn const_vector(&self, values: &[RValue<'gcc>]) -> RValue<'gcc> {\n  316 |         let typ = self.type_vector(values[0].get_type(), values.len() as u64);\n  317 |         self.context.new_rvalue_from_vector(None, typ, values)\n  318 |     }","lines":4,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/common.rs#L315-L318"}]},
{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`map_arch_intrinsic` fallback and the non-master `intrinsic` use `unimplemented!(\"unsupported LLVM intrinsic {}\", name)`. For the non-master build any LLVM intrinsic other than the two hard-coded ones panics the compiler rather than emitting a diagnostic. This is reachable from user code referencing target intrinsics under a libgccjit-12 build.","fix":"Emit a proper unsupported-target-feature/intrinsic diagnostic via the session's dcx instead of `unimplemented!`, or document that these builds intentionally ICE on unknown intrinsics.","locations":[{"ref":"src/intrinsic/llvm.rs:1081-1095","code":" 1081 | #[cfg(not(feature = \"master\"))]\n 1082 | pub fn intrinsic<'gcc, 'tcx>(name: &str, cx: &CodegenCx<'gcc, 'tcx>) -> Function<'gcc> {\n 1083 |     let gcc_name = match name {\n 1084 |         \"llvm.x86.sse2.pause\" => {\n 1085 |             // NOTE: pause is only a hint, so we use a dummy built-in because target built-ins\n 1086 |             // are not supported in libgccjit 12.\n 1087 |             \"__builtin_inff\"\n 1088 |         }\n 1089 |         \"llvm.x86.xgetbv\" => \"__builtin_trap\",\n 1090 |         _ => unimplemented!(\"unsupported LLVM intrinsic {}\", name),\n 1091 |     };\n 1092 |     let func = cx.context.get_builtin_function(gcc_name);\n 1093 |     cx.functions.borrow_mut().insert(gcc_name.to_string(), func);\n 1094 |     func\n 1095 | }","lines":15,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/intrinsic/llvm.rs#L1081-L1095"}]},
{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"negligible","difficulty":"medium","description":"`cleanup_sysroot_previous_build` uses `filename.to_str().unwrap()` inside the walk callbacks when checking for the `libsysroot` prefix. A non-UTF8 filename in the target dir would panic. Errors from the walk are otherwise ignored (`let _ =`), so this lone unwrap is an inconsistency that can abort an otherwise best-effort cleanup.","fix":"Use `filename.to_str().map(|s| s.starts_with(\"libsysroot\")).unwrap_or(false)` (or `to_string_lossy`).","locations":[{"ref":"build_system/src/build.rs:80-96","code":"   80 |                         if sub_dir\n   81 |                             .file_name()\n   82 |                             .map(|filename| filename.to_str().unwrap().starts_with(\"libsysroot\"))\n   83 |                             .unwrap_or(false)\n   84 |                         {\n   85 |                             let _ = fs::remove_dir_all(sub_dir);\n   86 |                         }\n   87 |                         Ok(())\n   88 |                     },\n   89 |                     &mut |file: &Path| {\n   90 |                         if file\n   91 |                             .file_name()\n   92 |                             .map(|filename| filename.to_str().unwrap().starts_with(\"libsysroot\"))\n   93 |                             .unwrap_or(false)\n   94 |                         {\n   95 |                             let _ = fs::remove_file(file);\n   96 |                         }","lines":17,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/build_system/src/build.rs#L80-L96"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`linearize_cf` indexes `file[block_starts - 2]` and removes at `block_starts - 2`. If a block header (`bb.. = {`) appears within the first two lines of the file, `block_starts < 2` and this subtraction underflows, panicking with an index/overflow error. For rustlantis-generated MIR this is unlikely but not guaranteed, especially after earlier passes have already removed lines.","fix":"Guard with `if block_starts < 2 { curr = block_starts + 1; continue; }` before indexing `block_starts - 2`.","locations":[{"ref":"build_system/src/fuzz/reduce.rs:289-297","code":"  289 |         if file[block_starts - 2].trim() != format!(\"Goto({block})\") {\n  290 |             curr = block_starts + 1;\n  291 |             continue;\n  292 |         }\n  293 |         let mut file_copy = file.clone();\n  294 |         // Try removing 3 consecutive lines(the goto, block end and block beginning). This effectively removes a `Goto(next)`.\n  295 |         file_copy.remove(block_starts - 2);\n  296 |         file_copy.remove(block_starts - 2);\n  297 |         file_copy.remove(block_starts - 2);","lines":9,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/build_system/src/fuzz/reduce.rs#L289-L297"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`set_global_alignment` and `static_addr_of_mut` cast alignment byte counts to `i32` (`align.bytes() as i32`, `align.bytes()` passed to get_aligned). For pathological/very large alignments this truncates, but more importantly `set_alignment` takes i32 while alignments are u64-derived; on legitimate but large alignment values the truncation is silent. Low severity because real alignments are small powers of two, but the cast is unchecked.","fix":"Document the invariant that alignment fits in i32, or assert `align.bytes() <= i32::MAX as u64` before casting.","locations":[{"ref":"src/consts.rs:49-61","code":"   49 | fn set_global_alignment<'gcc, 'tcx>(\n   50 |     cx: &CodegenCx<'gcc, 'tcx>,\n   51 |     gv: LValue<'gcc>,\n   52 |     mut align: Align,\n   53 | ) {\n   54 |     // The target may require greater alignment for globals than the type does.\n   55 |     // Note: GCC and Clang also allow `__attribute__((aligned))` on variables,\n   56 |     // which can force it to be smaller. Rust doesn't support this yet.\n   57 |     if let Some(min_global) = cx.sess().target.min_global_align {\n   58 |         align = Ord::max(align, min_global);\n   59 |     }\n   60 |     gv.set_alignment(align.bytes() as i32);\n   61 | }","lines":13,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/consts.rs#L49-L61"},{"ref":"src/consts.rs:232-244","code":"  232 |         let global = match kind {\n  233 |             Some(kind) if !self.tcx.sess.fewer_names() => {\n  234 |                 let name = self.generate_local_symbol_name(kind);\n  235 |                 // FIXME(antoyo): check if it's okay that no link_section is set.\n  236 | \n  237 |                 let typ = self.val_ty(cv).get_aligned(align.bytes());\n  238 |                 self.declare_private_global(&name[..], typ)\n  239 | {"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"In `lookup_debug_loc`, `col` is computed as `(file.relative_position(pos) - line_pos).to_u32() + 1`. This relies on the invariant `relative_position(pos) >= line_pos` (pos is on or after the start of its line). If `lookup_line` ever returns a line whose recorded `line_pos` is greater than the relative position of `pos` (e.g. multibyte boundary / remapped span edge cases), the `BytePos` subtraction underflows and panics in debug builds (or wraps in release, producing a nonsensical column). It is a compiler invariant in normal use but worth a defensive note given debuginfo handles arbitrary spans.","fix":"Use a saturating/checked subtraction or clamp, mirroring however cg_llvm guards this; at minimum keep the invariant documented.","locations":[{"ref":"src/debuginfo.rs:144-153","code":"  144 |         let (file, line, col) = match self.sess().source_map().lookup_line(pos) {\n  145 |             Ok(SourceFileAndLine { sf: file, line }) => {\n  146 |                 let line_pos = file.lines()[line];\n  147 | \n  148 |                 // Use 1-based indexing.\n  149 |                 let line = (line + 1) as u32;\n  150 |                 let col = (file.relative_position(pos) - line_pos).to_u32() + 1;\n  151 | \n  152 |                 (file, line, col)\n  153 |             }","lines":10,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/debuginfo.rs#L144-L153"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"critical","difficulty":"easy","description":"`is_val_statically_known` is inverted. `__builtin_constant_p` returns 1 when the argument is a known compile-time constant and 0 otherwise, but the code returns `icmp EQ(res, 0)`, i.e. it reports `true` exactly when the value is NOT statically known and `false` when it IS. Rust code relies on this intrinsic for soundness-relevant specialization (e.g. choosing a branch that is only valid when the value is a constant); returning `true` for non-constants can lead to miscompilation, and the common `false` for actual constants defeats the optimization.","fix":"Compare for inequality with zero: `self.icmp(IntPredicate::IntNE, res, self.const_i32(0))` so the result is true iff `__builtin_constant_p` returned non-zero.","locations":[{"ref":"src/intrinsic/mod.rs:302-307","code":"  302 |             sym::is_val_statically_known => {\n  303 |                 let a = args[0].immediate();\n  304 |                 let builtin = self.context.get_builtin_function(\"__builtin_constant_p\");\n  305 |                 let res = self.context.new_call(None, builtin, &[a]);\n  306 |                 self.icmp(IntPredicate::IntEQ, res, self.const_i32(0))\n  307 |             }","lines":6,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/intrinsic/mod.rs#L302-L307"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In codegen_inline_asm, an `Out { reg: explicit Register, place: None }` whose register is NOT in input_registers and IS target-supported is pushed onto `clobbers` and the loop does `continue` WITHOUT pushing anything to `outputs`. Later, when the template references this operand by index (the Placeholder/Out arm at line 475-482) it does `outputs.iter().position(|op| operand_idx == op.rust_idx).expect(\"wrong rust index\")`. If user asm template ever references such a clobber-only explicit-register out operand by its operand index, this `.expect` panics the compiler. Normally `clobber_abi`-generated lateouts are not referenced in the template, but a hand-written `out(\"rax\") _` that is referenced as `{0}` would hit this.","fix":"Either guarantee such operands are never templated (they are `_`, so frontend should forbid referencing them) and document it, or handle the missing-position case gracefully instead of expect().","locations":[{"ref":"src/asm.rs:218-245","code":"  218 |                             } else {\n  219 |                                 let is_target_supported = match reg.reg_class() {\n  220 |                                     // `clobber_abi` clobbers spe_acc on all PowerPC targets. This\n  221 |                                     // register is unique to the powerpc*spe target, and the target\n  222 |                                     // is not supported by gcc. Ignore it.\n  223 |                                     InlineAsmRegClass::PowerPC(\n  224 |                                         PowerPCInlineAsmRegClass::spe_acc,\n  225 |                                     ) => false,\n  226 |                                     // `clobber_abi` can add lots of clobbers that are not supported by the target,\n  227 |                                     // such as AVX-512 registers, so we just ignore unsupported registers\n  228 |                                     x => x.supported_types(asm_arch, true).iter().any(\n  229 |                                         |&(_, feature)| {\n  230 |                                             if let Some(feature) = feature {\n  231 |                                                 self.tcx\n  232 |                                                     .asm_target_features(instance.def_id())\n  233 |                                                     .contains(&feature)\n  234 |                                             } else {\n  235 |                                                 true // Register class is unconditionally supported\n  236 |                                             }\n  237 |                                         },\n  238 |                                     ),\n  239 |                                 };\n  240 | \n  241 |                                 if is_target_supported && !clobbers.contains(&reg_name) {\n  242 |                                     clobbers.push(reg_name);\n  243 |                                 }\n  244 |                                 continue;\n  245 |                             }","lines":28,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/asm.rs#L218-L245"},{"ref":"src/asm.rs:477-484","code":"  477 |                         InlineAsmOperandRef::Out { reg, .. } => {\n  478 |                             let modifier = modifier_to_gcc(asm_arch, reg.reg_class(), modifier);\n  479 |                             let gcc_index = outputs\n  480 |                                 .iter()\n  481 |                                 .position(|op| operand_idx == op.rust_idx)\n  482 |                                 .expect(\"wrong rust index\");\n  483 |                             push_to_template(modifier, gcc_index);\n  484 |                         }","lines":8,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120 {"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"atomic_rmw maps the unsigned AtomicUMax/AtomicUMin operations to ExtremumOperation::Max/Min, exactly the same as the signed AtomicMax/AtomicMin. atomic_extremum performs the loop comparison with signed ComparisonOp::LessThan/GreaterThan on whatever type the value has, so unsigned atomic max/min will compute wrong results when the high bit is set (e.g. comparing 0xFF... vs 0x01 as signed).","fix":"Introduce signed/unsigned variants in ExtremumOperation (or pass a signedness flag) and cast the operands to the unsigned type for AtomicUMax/AtomicUMin before the comparison in atomic_extremum.","locations":[{"ref":"src/builder.rs:1796-1807","code":" 1796 |             AtomicRmwBinOp::AtomicMax => {\n 1797 |                 return self.atomic_extremum(ExtremumOperation::Max, dst, src, order);\n 1798 |             }\n 1799 |             AtomicRmwBinOp::AtomicMin => {\n 1800 |                 return self.atomic_extremum(ExtremumOperation::Min, dst, src, order);\n 1801 |             }\n 1802 |             AtomicRmwBinOp::AtomicUMax => {\n 1803 |                 return self.atomic_extremum(ExtremumOperation::Max, dst, src, order);\n 1804 |             }\n 1805 |             AtomicRmwBinOp::AtomicUMin => {\n 1806 |                 return self.atomic_extremum(ExtremumOperation::Min, dst, src, order);\n 1807 |             }","lines":12,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/builder.rs#L1796-L1807"},{"ref":"src/builder.rs:133-143","code":"  133 |         let comparison_operator = match operation {\n  134 |             ExtremumOperation::Max => ComparisonOp::LessThan,\n  135 |             ExtremumOperation::Min => ComparisonOp::GreaterThan,\n  136 |         };\n  137 | \n  138 |         let cond1 = self.context.new_comparison(\n  139 |             self.location,\n  140 |             comparison_operator,\n  141 |             previous_var.to_rvalue(),\n  142 |             self.context.new_cast(self.location, src, previous_value.get_type()),\n  143 |         );","lines":11,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/builder.rs#L133-L143"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"RealPredicate::RealUGE and RealULE lose their equality semantics. to_gcc_comparison maps RealUGE -> GreaterThan and RealULE -> LessThan (strict), and fcmp only OR-s in the NaN check. So `uge` produces `a > b || isNaN` and `ule` produces `a < b || isNaN`, missing the `a == b` case. Equal operands incorrectly compare as false.","fix":"Map RealUGE -> GreaterThanEquals and RealULE -> LessThanEquals in ToGccComp for RealPredicate (the NaN handling in fcmp already covers the unordered part).","locations":[{"ref":"src/builder.rs:2579-2584","code":" 2579 |             RealPredicate::RealUEQ => ComparisonOp::Equals,\n 2580 |             RealPredicate::RealUGT => ComparisonOp::GreaterThan,\n 2581 |             RealPredicate::RealUGE => ComparisonOp::GreaterThan,\n 2582 |             RealPredicate::RealULT => ComparisonOp::LessThan,\n 2583 |             RealPredicate::RealULE => ComparisonOp::LessThan,\n 2584 |             RealPredicate::RealUNE => ComparisonOp::NotEquals,","lines":6,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/builder.rs#L2579-L2584"},{"ref":"src/builder.rs:1449-1478","code":" 1449 |             RealPredicate::RealUGT => true,\n 1450 |             RealPredicate::RealUGE => true,\n 1451 |             RealPredicate::RealULT => true,\n 1452 |             RealPredicate::RealULE => true,\n 1453 |             RealPredicate::RealUNE => false,\n 1454 |             RealPredicate::RealPredicateTrue => unreachable!(),\n 1455 |         };\n 1456 | \n 1457 |         let cmp = self.context.new_comparison(self.location, op.to_gcc_comparison(), lhs, rhs);\n 1458 | \n 1459 |         if must_handle_nan {\n 1460 |             let is_nan = self.context.new_binary_op(\n 1461 |                 self.location,\n 1462 |                 BinaryOp::LogicalOr,\n 1463 |                 self.cx.bool_type,\n 1464 |                 // compare a value to itself to check whether it is NaN\n 1465 |                 self.context.new_comparison(self.location, ComparisonOp::NotEquals, lhs, lhs),\n 1466 |                 self.context.new_comparison(self.location, ComparisonOp::NotEquals, rhs, rhs),\n 1467 |             );\n 1468 | \n 1469 |             self.context.new_binary_op(\n 1470 |                 self.location,\n 1471 |                 BinaryOp::LogicalOr,\n 1472 |                 self.cx.bool_type,\n 1473 |                 is_nan,\n 1474 |                 cmp,\n 1475 |             )\n 1476 |         } else {\n 1477 |             cmp\n 1478 |         }","lines":30,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/builder.rs#L1449-L1478"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In `static_addr_of`, when an existing global is found in the cache, alignment is computed and compared in BITS (`align.bits() as i32`) but compared against and stored via `get_alignment()`/`set_alignment()`, which operate in BYTES everywhere else in this file (see `set_global_alignment` line 55 using `align.bytes() as i32`). Using bits here means the comparison `alignment > global_variable.get_alignment()` is against an 8x-too-large value and `set_alignment` is given a bit count where a byte count is expected, over-aligning cached globals (e.g. an 8-byte alignment would be set as 64).","fix":"Use `let alignment = align.bytes() as i32;` to match the byte-based semantics of get_alignment/set_alignment used throughout the file.","locations":[{"ref":"src/consts.rs:68-75","code":"   68 |         if let Some(variable) = self.const_globals.borrow().get(&cv) {\n   69 |             if let Some(global_variable) = self.global_lvalues.borrow().get(variable) {\n   70 |                 let alignment = align.bits() as i32;\n   71 |                 if alignment > global_variable.get_alignment() {\n   72 |                     global_variable.set_alignment(alignment);\n   73 |                 }\n   74 |             }\n   75 |             return *variable;","lines":8,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/consts.rs#L68-L75"},{"ref":"src/consts.rs:60","code":"   60 |     gv.set_alignment(align.bytes() as i32);","lines":1,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/consts.rs#L60"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"gcc_lshr's non-native (128-bit) path uses `a_type.is_signed(self)` to decide whether to do an arithmetic (sign-propagating) or logical right shift. For a 128-bit value the type is an array type (`dyncast_array` element), and `is_signed` is being asked of the array `a_type`, not of the element type. The element-type signedness is what matters for the sign-fill of the high word (line 124 computes `sign = high >> 63` for signed). If `is_signed` on the composite array type does not reflect i128-vs-u128 correctly, lshr on i128/u128 produces wrong results (logical shift treated as arithmetic or vice-versa). This is the routine used for `>>` on 128-bit integers, so any miscompile here is silent and affects correctness of user code.","fix":"Determine signedness from the i128/u128 identity (e.g. `a_type.is_compatible_with(self.i128_type)`, as additive_operation/operation already do at line 181), not from `is_signed` on the array wrapper, and use that to choose the high-word fill.","locations":[{"ref":"src/int.rs:100-153","code":"  100 |         } else {\n  101 |             // NOTE: we cannot use the lshr builtin because it's calling hi() (to get the most\n  102 |             // significant half of the number) which uses lshr.\n  103 | \n  104 |             let native_int_type = a_type.dyncast_array().expect(\"get element type\");\n  105 | \n  106 |             let func = self.current_func();\n  107 |             let then_block = func.new_block(\"then\");\n  108 |             let else_block = func.new_block(\"else\");\n  109 |             let after_block = func.new_block(\"after\");\n  110 |             let b0_block = func.new_block(\"b0\");\n  111 |             let actual_else_block = func.new_block(\"actual_else\");\n  112 | \n  113 |             let result = func.new_local(self.location, a_type, \"shiftResult\");\n  114 | \n  115 |             let sixty_f {"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"gcc_lshr 128-bit `then_block` (shift amount has bit 0x40 set, i.e. >= 64) builds the result with `concat_low_high_rvalues(a_type, high >> shift_value, sign)` where shift_value = b - 64. The low word receives `high >> (b-64)`. But `high` here is the *signed* native high word and `>>` is therefore an arithmetic shift even in the unsigned case (for unsigned, `sign` is zero but the low word still uses an arithmetic shift of a signed `high`). For an unsigned 128-bit value with the top bit of the high word set, shifting right by >=64 will sign-extend garbage into the low word instead of zero-filling. The high word should be cast to its unsigned type before the `>> shift_value` in the unsigned branch.","fix":"In the unsigned case cast `high` to its unsigned native type before `>> shift_value` so the in-element shift is logical; keep arithmetic only for the signed case.","locations":[{"ref":"src/int.rs:122-127","code":"  122 |             let shift_value = self.gcc_sub(b, sixty_four);\n  123 |             let high = self.high(a);\n  124 |             let sign = if a_type.is_signed(self) { high >> sixty_three } else { zero };\n  125 |             let array_value = self.concat_low_high_rvalues(a_type, high >> shift_value, sign);\n  126 |             then_block.add_assignment(self.location, result, array_value);\n  127 |             then_block.end_with_jump(self.location, after_block);","lines":6,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/int.rs#L122-L127"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`type_uint_from_ty` returns SIGNED gcc integer types for unsigned Rust integer types: U8->type_i8, U16->type_i16, U32->type_i32, U64->type_i64, U128->type_i128, and Usize->type_isize. The sibling helper `type_from_unsigned_integer` returns the proper unsigned types (type_u8/u16/u32/u64/u128), proving unsigned types exist and are the intended mapping. `type_uint_from_ty` is used in SIMD intrinsics (src/intrinsic/simd.rs:911 and :1256, the unsigned gather/cast paths) where signedness of the element type can change codegen behavior (e.g. sign- vs zero-extension, comparison semantics). This is most likely a copy-paste of `type_int_from_ty`.","fix":"Map unsigned types to unsigned gcc types: Usize->type_usize (or the unsigned size type), U8->type_u8(), U16->type_u16(), U32->type_u32(), U64->type_u64(), U128->type_u128().","locations":[{"ref":"src/type_of.rs:46-56","code":"   46 |     #[cfg(feature = \"master\")]\n   47 |     pub fn type_uint_from_ty(&self, t: ty::UintTy) -> Type<'gcc> {\n   48 |         match t {\n   49 |             ty::UintTy::Usize => self.type_isize(),\n   50 |             ty::UintTy::U8 => self.type_i8(),\n   51 |             ty::UintTy::U16 => self.type_i16(),\n   52 |             ty::UintTy::U32 => self.type_i32(),\n   53 |             ty::UintTy::U64 => self.type_i64(),\n   54 |             ty::UintTy::U128 => self.type_i128(),\n   55 |         }\n   56 |     }","lines":11,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/type_of.rs#L46-L56"},{"ref":"src/type_of.rs:23-32","code":"   23 |     fn type_from_unsigned_integer(&self, i: Integer) -> Type<'gcc> {\n   24 |         use Integer::*;\n   25 |         match i {\n   26 |             I8 => self.type_u8(),\n   27 |             I16 => self.type_u16(),\n   28 |             I32 => self.type_u32(),\n   29 |             I64 => self {"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`remove_fns` never advances `curr` on a successful reduction. In the success branch it sets `*file = file_copy` but leaves `curr` unchanged, while `fn_start` is computed relative to `curr` via `file[curr..].iter().position(...)`. After removing a function the same `#[custom_mir(...)]` marker region shifts, and because `curr` is not moved past it the loop can re-scan from the same offset; combined with the existing FIXME about the last function, the pass behaves inconsistently versus all the other passes which set `curr = <start>` on success.","fix":"On the successful branch set `curr = fn_start;` (mirroring the other reduction passes) instead of leaving `curr` untouched.","locations":[{"ref":"build_system/src/fuzz/reduce.rs:361-392","code":"  361 | fn remove_fns(file: &mut Vec<String>, path: &PathBuf, cache: &mut ResultCache) {\n  362 |     let mut curr = 0;\n  363 | \n  364 |     while curr < file.len() {\n  365 |         // Find a function start\n  366 |         let Some(fn_start) = file[curr..].iter().position(|line| {\n  367 |             line.contains(\"#[custom_mir(dialect = \\\"runtime\\\", phase = \\\"initial\\\")]\")\n  368 |         }) else {\n  369 |             // No more functions to remove - exit early.\n  370 |             break;\n  371 |         };\n  372 |         // Find the next function(and use that to find the end of this one).\n  373 |         // FIXME: this check is flawed: it will never remove the very last function(the one before main).\n  374 |         // The other checks will turn that function into a single call to abort, but it is still annoying that it is kept.\n  375 |         let fn_start = fn_start + curr;\n  376 |         let Some(fn_end) = file[(fn_start + 3)..].iter().position(|line| line.contains(\"fn fn\"))\n  377 |         else {\n  378 |             // No more functions to remove - exit early.\n  379 | {"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`test_projects` part-splitting math is off. `count = projects.len().checked_div(nb_parts)` floors the division, then `count + 1` is used as the take size and `start = current_part * count` (note: start uses the post-increment `count`). With e.g. 6 projects and nb_parts=4, count=1, count+1=2, parts cover [0,2),[2,4),[4,6),[6,8) — part 3 starts at index 6 which is out of range (tests nothing) while the math intends 4 even parts. The skip/take with the `+1` fudge can both skip and duplicate projects across parts depending on counts.","fix":"Compute balanced partitions explicitly, e.g. `start = current_part * len / nb_parts` and `end = (current_part + 1) * len / nb_parts`, then `skip(start).take(end - start)`; avoid the `+1` fudge.","locations":[{"ref":"build_system/src/test.rs:765-776","code":"  765 |     let nb_parts = args.nb_parts.unwrap_or(0);\n  766 |     if let Some(count) = projects.len().checked_div(nb_parts) {\n  767 |         // We increment the number of tests by one because if this is an odd number, we would skip\n  768 |         // one test.\n  769 |         let count = count + 1;\n  770 |         let current_part = args.current_part.unwrap();\n  771 |         let start = current_part * count;\n  772 |         // We remove the projects we don't want to test.\n  773 |         run_tests(projects_path, &mut projects.iter().skip(start).take(count))?;\n  774 |     } else {\n  775 |         run_tests(projects_path, &mut projects.iter())?;\n  776 |     }","lines":12,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/build_system/src/test.rs#L765-L776"}]},

{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"estimate_template_length reserves 3 bytes per Placeholder ('%' + 1 modifier + 1 index char), but the GCC index can exceed one digit (outputs.len()+inputs.len()+labels can easily exceed 9 operands), and label placeholders also push an 'l' modifier plus a multi-digit index. The 5% fudge on the string-piece total does not cover under-estimated placeholder indices. This only causes a String reallocation (not a bug), but the comment 'should be fair enough as the upper bound' is misleading - it is not an upper bound.","fix":"Reserve a few more bytes per placeholder (e.g. 4-5) or drop the misleading 'upper bound' claim; functionally harmless but the comment is wrong.","locations":[{"ref":"src/asm.rs:638-665","code":"  638 | fn estimate_template_length(\n  639 |     template: &[InlineAsmTemplatePiece],\n  640 |     constants_len: usize,\n  641 |     att_dialect: bool,\n  642 | ) -> usize {\n  643 |     let len: usize = template\n  644 |         .iter()\n  645 |         .map(|piece| {\n  646 |             match *piece {\n  647 |                 InlineAsmTemplatePiece::String(ref string) => string.len(),\n  648 |                 InlineAsmTemplatePiece::Placeholder { .. } => {\n  649 |                     // '%' + 1 char modifier + 1 char index\n  650 |                     3\n  651 |                 }\n  652 |             }\n  653 |         })\n  654 |         .sum();\n  655 | \n  656 |     // increase it by 5% to account for possible '%' signs that'll be duplicated\n  657 |     // I pulled the number out of blue, but should be fair enough\n  658 |     // as the upper bound\n  659 |     let mut res = (len as f32 * 1.05) as usize + constants_len;\n  660 | \n  661 |     if att_dialect {\n  662 |         res += INTEL_SYNTAX_INS.len() + ATT_SYNTAX_INS.len();\n  663 |     }\n  664 |     res\n  665 | }","lines":28,"link":"https://github.com/rust-lang/rustc_codegen_ {"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"codegen_global_asm comment-stripping loop has a subtle bug: after copying up to a `//`, it advances `index` to the next newline via `string[comment_index..].find('\\n')`. But if there is no `//` in the remainder, comment_index is set to string.len() and `string[comment_index..]` is the empty string; find('\\n') returns None so index = string.len() and the loop exits - fine. However when a `//` IS found mid-line, the code jumps index to the newline but the newline itself is then re-scanned: the next iteration's slice `string[index..]` starts AT the '\\n'. The '\\n' is preserved (good) but everything between `//` and '\\n' is dropped including the newline is kept - that is intended. The real issue: a `//` inside a string literal or after an already-stripped region is treated as a comment unconditionally, which can corrupt legitimate asm containing `//` that is not a comment (e.g. inside a string/symbol).","fix":"This is a known limitation; at minimum document that `//` anywhere in global_asm template strings is treated as a line comment, or use a more robust tokenizer.","locations":[{"ref":"src/asm.rs:965-981","code":"  965 |         for piece in template {\n  966 |             match *piece {\n  967 |                 InlineAsmTemplatePiece::String(ref string) => {\n  968 |                     let mut index = 0;\n  969 |                     while index < string.len() {\n  970 |                         // NOTE: gcc does not allow inline comment, so remove them.\n  971 |                         let comment_index = string[index..]\n  972 |                             .find(\"//\")\n  973 |                             .map(|comment_index| comment_index + index)\n  974 |                             .unwrap_or(string.len());\n  975 |                         template_str.push_str(&string[index..comment_index]);\n  976 |                         index = stri {"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`llvm.x86.avx512fp16.mask.vfmadd.csh` and `llvm.x86.avx512fp16.mask.vfcmadd.csh` are mapped to the `*_mask3_round` GCC builtins (lines 1532, 1536), the same builtins used for the LLVM `*mask3*`-flavored fcmadd handled by the `adjust_function` 255-hack. The `mask.vfmadd.cph.512` (non-csh) likewise maps to `mask3_round` (line 1530). If LLVM distinguishes `mask` vs `mask3` semantics (writeback operand selection) these collapse two distinct mask behaviors onto the mask3 builtin, which is only corrected for the csh case via the brittle 255 string check and not at all for the cph.512 case.","fix":"Verify each `mask`/`maskz`/`mask3` fp16 fcmadd/fmadd LLVM intrinsic maps to the GCC builtin with matching writeback semantics; the `mask` (not mask3) variants likely need a distinct builtin or argument reordering rather than reusing the mask3 builtin.","locations":[{"ref":"src/intrinsic/llvm.rs:1527-1534","code":" 1527 |         \"llvm.x86.avx512fp16.mask.vfmadd.cph.512\" => \"__builtin_ia32_vfmaddcph512_mask3_round\",\n 1528 |         \"llvm.x86.avx512fp16.maskz.vfmadd.cph.512\" => \"__builtin_ia32_vfmaddcph512_maskz_round\",\n 1529 |         \"llvm.x86.avx512fp16.mask.vfmadd.csh\" => \"__builtin_ia32_vfmaddcsh_mask3_round\",\n 1530 |         \"llvm.x86.avx512fp16.maskz.vfmadd.csh\" => \"__builtin_ia32_vfmaddcsh_maskz_round\",\n 1531 |         \"llvm.x86.avx512fp16.mask.vfcmadd.cph.512\" => \"__builtin_ia32_vfcmaddcph512_mask3_round\",\n 1532 |         \"llvm.x86.avx512fp16.maskz.vfcmadd.cph.512\" => \"__builtin_ia32_vfcmaddcph512_maskz_round\",\n 1533 |         \"llvm.x86.avx512fp16.mask.vfcmadd.csh\" => \"__builtin_ia32_vfcmaddcsh_mask3_round\",\n 1534 |         \"llvm.x86.avx512fp16.maskz.vfcmadd.csh\" => \"__builtin_ia32_vfcmaddcsh_maskz_round\",","lines":8,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f7442 {"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `predefine_fn`, function linkage is stored via `self.linkage.set(base::linkage_to_gcc(linkage))` on the shared `CodegenCx` rather than being attached to the specific function `decl`. This is a single `Cell`/field on the cx that is overwritten on every predefine call and presumably read later when the function body is created. Because predefine runs for ALL mono items first (see base.rs: the predefine loop completes before the define loop), by the time any function is defined `self.linkage` holds the value from the LAST predefined item, not the one being defined. Unless `define` re-derives linkage, every function would get the last item's linkage. This cross-call coupling through shared mutable state is fragile and likely incorrect for multi-function CGUs.","fix":"Verify how `self.linkage` is consumed during `define`. If it is read per-function there, store linkage per-function (e.g. in a map keyed by instance/symbol) instead of a single shared cell, or set it immediately before the corresponding define rather than during predefine.","locations":[{"ref":"src/mono_item.rs:188","code":"  188 |         self.linkage.set(base::linkage_to_gcc(linkage));","lines":1,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/mono_item.rs#L188"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`type_ix` computes the backing integer as `(num_bits / 8).next_power_of_two()` bytes. For num_bits that are not a multiple of 8 (e.g. 96-bit, as the FIXME notes rustc_codegen_ssa sometimes uses), this yields an integer of a DIFFERENT size than requested (96 bits -> 12 bytes -> rounded to 16 -> i128), silently changing the value width. The FIXME acknowledges this but it remains a correctness hazard for callers like CastTarget::gcc_type (abi.rs:73 `cx.type_ix(rem_bytes * 8)`) and Reg::gcc_type (abi.rs:87 `cx.type_ix(self.size.bits())`).","fix":"Round the bit width up to the next valid integer size based on bits, not truncated bytes (e.g. `Integer::fit_unsigned`/`approximate`), or assert the requested width matches a supported size and reject mismatches instead of silently widening.","locations":[{"ref":"src/type_.rs:21-35","code":"   21 |     pub fn type_ix(&self, num_bits: u64) -> Type<'gcc> {\n   22 |         // gcc only supports 1, 2, 4 or 8-byte integers.\n   23 |         // FIXME(antoyo): this is misleading to use the next power of two as rustc_codegen_ssa\n   24 |         // sometimes use 96-bit numbers and the following code will give an integer of a different\n   25 |         // size.\n   26 |         let bytes = (num_bits / 8).next_power_of_two() as i32;\n   27 |         match bytes {\n   28 |             1 => self.i8_type,\n   29 |             2 => self.i16_type,\n   30 |             4 => self.i32_type,\n   31 |             8 => self.i64_type,\n   32 |             16 => self.i128_type,\n   33 |             _ => panic!(\"unexpected num_bits: {}\", num_bits),\n   34 |         }\n   35 |     }","lines":15,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/type_.rs#L21-L35"},{"ref":"src/abi.rs:70-74","code":"   70 |         if rem_bytes != 0 {\n   71 |             // Only integers can be r {"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"Same `+1` fudge in the ui_test splitting: `count = files.len() / nb_parts + 1; start = current_part * count`. With the `+1`, consecutive parts overlap/skip and the last part's `start` can exceed `files.len()` (then `skip` yields nothing, removing no files, i.e. running all remaining files). The comment claims this avoids skipping a test on odd counts, but the real effect is uneven and overlapping partitions.","fix":"Use the proportional partitioning `start = current_part * len / nb_parts`, `end = (current_part + 1) * len / nb_parts`.","locations":[{"ref":"build_system/src/test.rs:1184-1191","code":" 1184 |             // We increment the number of tests by one because if this is an odd number, we would skip\n 1185 |             // one test.\n 1186 |             let count = files.len() / nb_parts + 1;\n 1187 |             // We remove the files we don't want to test.\n 1188 |             let start = current_part * count;\n 1189 |             for path in files.iter().skip(start).take(count) {\n 1190 |                 remove_file(&rust_path.join(path))?;\n 1191 |             }","lines":8,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/build_system/src/test.rs#L1184-L1191"}]},
{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In codegen_global_asm, att_dialect emits `.att_syntax\\n` at the start but `.intel_syntax noprefix` at the end with no `noprefix` on the opening `.att_syntax`. In the inline-asm path the constant is `.att_syntax noprefix`. The global-asm opening directive omits `noprefix`, which differs from inline asm and from the closing directive's expectation, potentially changing operand-prefix handling for global asm in ATT mode.","fix":"Use `.att_syntax noprefix` (matching ATT_SYNTAX_INS) for consistency, or confirm the asymmetry is intentional and comment why.","locations":[{"ref":"src/asm.rs:962-964","code":"  962 |         if att_dialect {\n  963 |             template_str.push_str(\".att_syntax\\n\");\n  964 |         }","lines":3,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/asm.rs#L962-L964"},{"ref":"src/asm.rs:1043-1045","code":" 1043 |         if att_dialect {\n 1044 |             template_str.push_str(\"\\n\\t.intel_syntax noprefix\");\n 1045 |         }","lines":3,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/asm.rs#L1043-L1045"}]},
{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `codegen`, when `config.bitcode_needed()` is true and both `config.emit_bc` (or `emit_obj == Bitcode`) and `emit_obj == ObjectCode(BitcodeSection::Full)` request a bitcode artifact, the context is compiled to the same `bc_out` path twice in a row (lines 55-56 and 68-69), with `-ffat-lto-objects` only added on the second pass. The first `compile_to_file` output is immediately overwritten. While these two conditions are usually mutually exclusive in practice, nothing here enforces that, so this is wasted compilation when both are set and relies on an implicit invariant.","fix":"Restructure as an if/else (the two arms write the same `bc_out`), or assert the two configs are mutually exclusive, to avoid double-compiling and clarify intent.","locations":[{"ref":"src/back/write.rs:48-70","code":"   48 |             if config.emit_bc || config.emit_obj == EmitObj::Bitcode {\n   49 |                 let _timer = prof\n   50 |                     .generic_activity_with_arg(\"GCC_module_codegen_emit_bitcode\", &*module.name);\n   51 |                 if lto_supported {\n   52 |                     context.add_command_line_option(\"-flto=auto\");\n   53 |                     context.add_command_line_option(\"-flto-partition=one\");\n   54 |                 }\n   55 |                 context\n   56 |                     .compile_to_file(OutputKind::ObjectFile, bc_out.to_str().expect(\"path to str\"));\n   57 |             }\n   58 | \n   59 |             if config.emit_obj == EmitObj::ObjectCode(BitcodeSection::Full) {\n   60 |                 let _timer = prof\n   61 |                     .generic_activity_with_arg(\"GCC_module_codegen_embed_bitcode\", &*module.name);\n   62 |                 if lto_supported {\n   63 |                     context.add_command_line_option(\"-flto=auto\");\n   64 |                     context.add_command_line_option(\"-flto-partition=one\");\n   65 |                     context.add_command_line_option(\"-ffat-lto-objects\");\n   66 |                 }\n   67 |                 // FIXME(antoyo): Send -plugin/usr/lib/gcc/x86_64-pc-linux-gnu/11.1.0/liblto_plugin.so to linker (this should be done when specifying the appropriate rustc cli argument).\n   68 |                 context\n   69 |                     .compile_to_file(OutputKind::ObjectFile, bc_out.to_str().expect(\"path to str\"));\n   70 |             }","lines":23,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/back/write.rs#L48-L70"}]},
{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"check_ptr_call's cast condition has misplaced precedence: `!a.is_vector() && !b.is_vector() && (a.is_integral() && b.is_integral()) || (a.get_pointee().is_some() && b.get_pointee().is_some())`. Due to && binding tighter than ||, the pointer branch is taken whenever both are pointers regardless of the vector checks, and the comment at the assert below explicitly flags the related condition as \"seems wrong\". This can route mismatched pointer types through new_cast in cases the author did not intend.","fix":"Add explicit parentheses to express the intended grouping, e.g. `(!a.is_vector() && !b.is_vector()) && ((a.is_integral() && b.is_integral()) || (a.get_pointee().is_some() && b.get_pointee().is_some()))`, and re-evaluate the assert condition flagged by the FIXME.","locations":[{"ref":"src/builder.rs:280-285","code":"  280 |                     if !actual_ty.is_vector()\n  281 |                         && !expected_ty.is_vector()\n  282 |                         && (actual_ty.is_integral() && expected_ty.is_integral())\n  283 |                         || (actual_ty.get_pointee().is_some()\n  284 |                             && expected_ty.get_pointee().is_some())\n  285 |                     {","lines":6,"link":"https://github.com/rust-lang/rustc_codegen_gcc/blob/45528bc28230519c15d8ae14120c34b16f744250/src/builder.rs#L280-L285"},{"ref":"src/builder.rs:305-317","code":"  305 |                         // FIXME: this condition seems wrong: it will pass when both types are not\n  306 |                         // a vector.\n  307 |                         assert!(\n  308 |                             (!expected_ty.is_vector() || actual_ty.is_vector())\n  309 |                                 && (expected_ty.is_vector() || !actual_ty.is_vector()),\n  310 |                             \"{:?} (is vector: {}) -> {:?} (is vector: {}), Function: {:?}[{}]\",
