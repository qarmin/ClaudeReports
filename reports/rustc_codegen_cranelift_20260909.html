{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`get_toolchain_binary` derives the tool path by string-replacing substrings of the linker filename: `.replace(\"ld\", tool).replace(\"gcc\", tool).replace(\"clang\", tool).replace(\"cc\", tool)`. These run unconditionally and on the whole filename, so (a) `cc`/`ld` substrings inside an unrelated name get rewritten (e.g. `gold` -> contains `ld`; `aarch64-...-gcc` contains `cc` only after gcc->tool? no, but a custom linker named e.g. `mycc-ld` is mangled twice), and (b) chained replaces can apply to the result of a previous replace if `tool` itself contains one of these substrings. This can produce a wrong assembler path and a confusing failure far away in compile_global_asm.","fix":"Match the linker flavor/known filenames explicitly (gcc/clang/cc/ld.lld/ld) and map to the tool deterministically, or only replace a recognized trailing component rather than blind substring replacement on the full name.","locations":[{"ref":"src/toolchain.rs:14-26","code":"   14 |     if linker_file_name == \"ld.lld\" {\n   15 |         if tool != \"ld\" {\n   16 |             linker.set_file_name(tool)\n   17 |         }\n   18 |     } else {\n   19 |         let tool_file_name = linker_file_name\n   20 |             .replace(\"ld\", tool)\n   21 |             .replace(\"gcc\", tool)\n   22 |             .replace(\"clang\", tool)\n   23 |             .replace(\"cc\", tool);\n   24 | \n   25 |         linker.set_file_name(tool_file_name)\n   26 |     }","lines":13,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/toolchain.rs#L14-L26"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`hyperfine_command` takes a `warmup` parameter and skips `--warmup` when it is 0, but both call sites pass `0`, so warmup is always disabled. The parameter (and the `if warmup != 0` branch) is effectively dead configuration; benchmarks run with zero warmup runs, which can skew first-run results.","fix":"Either pass a meaningful warmup count at the call sites or remove the unused parameter and dead branch.","locations":[{"ref":"build_system/bench.rs:91-92","code":"   91 |     let bench_compile = hyperfine_command(\n   92 |         0,","lines":2,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/build_system/bench.rs#L91-L92"},{"ref":"build_system/bench.rs:115-117","code":"  115 |     let mut bench_run = hyperfine_command(\n  116 |         0,\n  117 |         bench_runs,","lines":3,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/build_system/bench.rs#L115-L117"},{"ref":"build_system/bench.rs:148-150","code":"  148 |     if warmup != 0 {\n  149 |         bench.arg(\"--warmup\").arg(warmup.to_string());\n  150 |     }","lines":3,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/build_system/bench.rs#L148-L150"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`config::load_config_file()` reads `config.txt` via a bare relative path, so the build system silently depends on being invoked from the project root. `main()` immediately does `current_dir().unwrap()` and treats it as the source dir, but config.txt is never resolved relative to that source dir; if cwd ever differs from the source root the config read either fails (unwrap panic) or reads the wrong file.","fix":"Resolve the config path relative to the known source dir (pass `&Dirs` / source_dir into `get_bool`/`load_config_file` and join `source_dir.join(\"config.txt\")`) instead of using a bare relative `\"config.txt\"`.","locations":[{"ref":"build_system/config.rs:3-5","code":"    3 | fn load_config_file() -> Vec<(String, Option<String>)> {\n    4 |     fs::read_to_string(\"config.txt\")\n    5 |         .unwrap()","lines":3,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/build_system/config.rs#L3-L5"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`fetch` copies the lockfile from patches only when `source_lockfile.exists()`, otherwise asserts `target_lockfile.exists()`. If a repo legitimately ships no Cargo.lock (rare for libs) and no patch lockfile is provided, this asserts and aborts the whole prepare with a bare assertion failure rather than a descriptive message.","fix":"Replace the bare `assert!(target_lockfile.exists())` with an explicit error message explaining that a lockfile is required (from the repo or patches dir).","locations":[{"ref":"build_system/prepare.rs:149-157","code":"  149 |         let source_lockfile =\n  150 |             dirs.source_dir.join(\"patches\").join(format!(\"{}-lock.toml\", self.patch_name));\n  151 |         let target_lockfile = download_dir.join(\"Cargo.lock\");\n  152 |         if source_lockfile.exists() {\n  153 |             assert!(!target_lockfile.exists());\n  154 |             fs::copy(source_lockfile, target_lockfile).unwrap();\n  155 |         } else {\n  156 |             assert!(target_lockfile.exists());\n  157 |         }","lines":9,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/build_system/prepare.rs#L149-L157"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`get_patches` filters patch filenames by `split_once(\"-\").unwrap().1.starts_with(crate_name)`. A patch file whose name has no `-` (e.g. a hand-added `patch.patch`) makes `split_once.unwrap()` panic. Also the `starts_with` match is a prefix test, so crate names that are prefixes of one another could pick up unintended patches.","fix":"Skip filenames without the expected `NNNN-<crate>-...` shape instead of unwrapping, and consider matching the full crate-name segment rather than a bare prefix.","locations":[{"ref":"build_system/prepare.rs:217-232","code":"  217 | fn get_patches(dirs: &Dirs, crate_name: &str) -> Vec<PathBuf> {\n  218 |     let mut patches: Vec<_> = fs::read_dir(dirs.source_dir.join(\"patches\"))\n  219 |         .unwrap()\n  220 |         .map(|entry| entry.unwrap().path())\n  221 |         .filter(|path| path.extension() == Some(OsStr::new(\"patch\")))\n  222 |         .filter(|path| {\n  223 |             path.file_name()\n  224 |                 .unwrap()\n  225 |                 .to_str()\n  226 |                 .unwrap()\n  227 |                 .split_once(\"-\")\n  228 |                 .unwrap()\n  229 |                 .1\n  230 |                 .starts_with(crate_name)\n  231 |         })\n  232 |         .collect();","lines":16,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/build_system/prepare.rs#L217-L232"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `run_testsuite`, `source.split('/').last().unwrap().split('.').next().unwrap()` derives the output binary name from the source path. This assumes a single `.rs` extension and no dots in the stem; a source filename like `foo.bar.rs` would yield `foo` and run the wrong / nonexistent binary. It also hardcodes `/` as the separator (fine since these are repo-relative literals, but brittle).","fix":"Use `Path::new(source).file_stem()` to derive the binary name robustly.","locations":[{"ref":"build_system/tests.rs:437-440","code":"  437 |                     self.run_out_command(\n  438 |                         source.split('/').last().unwrap().split('.').next().unwrap(),\n  439 |                         args,\n  440 |                     );","lines":4,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/build_system/tests.rs#L437-L440"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`copy_dir_recursively` checks `filename == \".\" || filename == \"..\"` and skips them, but `fs::read_dir` never yields `.` or `..` entries on any platform, so this guard is dead code that suggests a misunderstanding of read_dir semantics.","fix":"Remove the dead `.`/`..` check.","locations":[{"ref":"build_system/utils.rs:212-215","code":"  212 |         let filename = entry.file_name();\n  213 |         if filename == \".\" || filename == \"..\" {\n  214 |             continue;\n  215 |         }","lines":4,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/build_system/utils.rs#L212-L215"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`codegen_array_len` is referenced by name as `Rvalue::Len` in its bug! message (src/base.rs:967) but the function is only called from the ConstantIndex from_end path in codegen_place; if Rvalue::Len handling was removed/relocated the bug! string is now misleading about the caller context.","fix":"Update the bug! message to reflect the actual caller (place projection length) rather than `Rvalue::Len`.","locations":[{"ref":"src/base.rs:975-987","code":"  975 | fn codegen_array_len<'tcx>(fx: &mut FunctionCx<'_, '_, 'tcx>, place: CPlace<'tcx>) -> Value {\n  976 |     match *place.layout().ty.kind() {\n  977 |         ty::Array(_elem_ty, len) => {\n  978 |             let len = fx\n  979 |                 .monomorphize(len)\n  980 |                 .try_to_target_usize(fx.tcx)\n  981 |                 .expect(\"expected monomorphic const in codegen\") as i64;\n  982 |             fx.bcx.ins().iconst(fx.pointer_type, len)\n  983 |         }\n  984 |         ty::Slice(_elem_ty) => place.to_ptr_unsized().1,\n  985 |         _ => bug!(\"Rvalue::Len({:?})\", place),\n  986 |     }\n  987 | }","lines":13,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/base.rs#L975-L987"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"Operator precedence makes the f16/f128 routing condition parse as `A || (B && C)`. The intent is to route to the f16/f128 software-emulation path whenever either operand type is f16/f128 and the source/dest types differ. As written, when `from_ty` is f16/f128 the `&& from_ty != to_ty` guard is bypassed, so an identity cast (e.g. f16->f16 or f128->f128) is routed into `codegen_f16_f128::codegen_cast`, where the float->float match has no same-type arm and falls into `unreachable!()`, panicking the compiler. Same-type casts are normally elided by MIR so this is unlikely to be hit in practice, but the guard is incorrect.","fix":"Add parentheses to express the intended grouping: `if (matches!(from_ty, types::F16 | types::F128) || matches!(to_ty, types::F16 | types::F128)) && from_ty != to_ty`.","locations":[{"ref":"src/cast.rs:42-46","code":"   42 |     if matches!(from_ty, types::F16 | types::F128)\n   43 |         || matches!(to_ty, types::F16 | types::F128) && from_ty != to_ty\n   44 |     {\n   45 |         return codegen_f16_f128::codegen_cast(fx, from, from_signed, to_ty, to_signed);\n   46 |     }","lines":5,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/cast.rs#L42-L46"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`LenWriter::write_at` asserts `offset + bytes.len() < self.0`. The bound should be `<=` (writing the final byte at the very end of the buffer is valid), and `offset + bytes.len()` can overflow `usize` for malformed input. Additionally the method silently does nothing (correct for a length-only writer) but the strict `<` could spuriously fail a legitimate end-aligned write. Currently `write_at` is never invoked on a `LenWriter` (only `write` is used during size measurement), so impact is latent.","fix":"Change the assertion to `offset.checked_add(bytes.len()).is_some_and(|e| e <= self.0)` or simply `offset + bytes.len() <= self.0`.","locations":[{"ref":"src/debuginfo/gcc_except_table.rs:267-270","code":"  267 |     fn write_at(&mut self, offset: usize, bytes: &[u8]) -> gimli::write::Result<()> {\n  268 |         assert!(offset + bytes.len() < self.0);\n  269 |         Ok(())\n  270 |     }","lines":4,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/debuginfo/gcc_except_table.rs#L267-L270"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`llvm.aarch64.neon.uaddlv.i32.v16i8` accumulates 16 u8 lanes into an I16 accumulator (`iadd` into types::I16). 16 * 255 = 4080 which fits in u16, so it is correct today, but the comment/contract is the wide-add-across-vector (uaddlv) and using an I16 accumulator is a latent overflow trap if ever reused for wider lane counts; an I32 accumulator (matching the i32 result) would be safer and clearer.","fix":"Accumulate directly in types::I32 (uextend each lane to I32) to remove the implicit width assumption.","locations":[{"ref":"src/intrinsics/llvm_aarch64.rs:245-259","code":"  245 |         \"llvm.aarch64.neon.uaddlv.i32.v16i8\" => {\n  246 |             intrinsic_args!(fx, args => (v); intrinsic);\n  247 | \n  248 |             let mut res_val = fx.bcx.ins().iconst(types::I16, 0);\n  249 |             for lane_idx in 0..16 {\n  250 |                 let lane = v.value_lane(fx, lane_idx).load_scalar(fx);\n  251 |                 let lane = fx.bcx.ins().uextend(types::I16, lane);\n  252 |                 res_val = fx.bcx.ins().iadd(res_val, lane);\n  253 |             }\n  254 |             let res = CValue::by_val(\n  255 |                 fx.bcx.ins().uextend(types::I32, res_val),\n  256 |                 fx.layout_of(fx.tcx.types.i32),\n  257 |             );\n  258 |             ret.write_cvalue(fx, res);\n  259 |         }","lines":15,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/intrinsics/llvm_aarch64.rs#L245-L259"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`ctlz_nonzero`/`cttz_nonzero` ignore the `nonzero` precondition (FIXMEs at the sites). For a zero argument the std intrinsic contract is UB, and `clz`/`ctz` of 0 returns the bit width; this is the documented FIXME but means no trap-on-zero hardening is done unlike other backends.","fix":"Optionally emit a trap (debug builds) when the argument is zero, as the FIXME notes; at minimum keep the FIXME tracked.","locations":[{"ref":"src/intrinsics/mod.rs:673-692","code":"  673 |         sym::ctlz | sym::ctlz_nonzero => {\n  674 |             intrinsic_args!(fx, args => (arg); intrinsic);\n  675 |             let val = arg.load_scalar(fx);\n  676 | \n  677 |             // FIXME trap on `ctlz_nonzero` with zero arg.\n  678 |             let res = fx.bcx.ins().clz(val);\n  679 |             let res = clif_intcast(fx, res, types::I32, false);\n  680 |             let res = CValue::by_val(res, ret.layout());\n  681 |             ret.write_cvalue(fx, res);\n  682 |         }\n  683 |         sym::cttz | sym::cttz_nonzero => {\n  684 |             intrinsic_args!(fx, args => (arg); intrinsic);\n  685 |             let val = arg.load_scalar(fx);\n  686 | \n  687 |             // FIXME trap on `cttz_nonzero` with zero arg.\n  688 |             let res = fx.bcx.ins().ctz(val);\n  689 |             let res = clif_intcast(fx, res, types::I32, false);\n  690 |             let res = CValue::by_val(res, ret.layout());\n  691 |             ret.write_cvalue(fx, res);\n  692 |         }","lines":20,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/intrinsics/mod.rs#L673-L692"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`new_stack_slot` rejects sizes `>= u32::MAX - 16` with a fatal diagnostic, but `create_stack_slot` is then called with `u32::try_from(layout.size.bytes()).unwrap()`. The guard `u64::from(u32::MAX - 16)` ensures the value fits in u32 so the unwrap cannot fail, but the relationship between the bound and the unwrap is implicit; a future change to the bound could reintroduce a panic. Minor robustness concern.","fix":"Add a comment tying the `u32::MAX - 16` bound to the subsequent `u32::try_from(...).unwrap()` so the invariant is explicit, or restructure to avoid the separate unwrap.","locations":[{"ref":"src/value_and_place.rs:380-389","code":"  380 |         if layout.size.bytes() >= u64::from(u32::MAX - 16) {\n  381 |             fx.tcx\n  382 |                 .dcx()\n  383 |                 .fatal(format!(\"values of type {} are too big to store on the stack\", layout.ty));\n  384 |         }\n  385 | \n  386 |         let stack_slot = fx.create_stack_slot(\n  387 |             u32::try_from(layout.size.bytes()).unwrap(),\n  388 |             u32::try_from(layout.align.bytes()).unwrap(),\n  389 |         );","lines":10,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/value_and_place.rs#L380-L389"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"config.rs strips inline `#` comments with `split_once('#')`, which also strips a literal `#` that might appear inside a value (e.g. a URL fragment or hash). Given current config keys are booleans/simple values this is harmless today, but it is a latent surprise if a value ever needs a `#`.","fix":"Document that `#` is always a comment delimiter, or only treat `#` as a comment at line start / after whitespace if values ever need it.","locations":[{"ref":"build_system/config.rs:7","code":"    7 |         .map(|line| if let Some((line, _comment)) = line.split_once('#') { line } else { line })","lines":1,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/build_system/config.rs#L7"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"medium","description":"When `CG_CLIF_JIT_ARGS` is set but empty, `\"\".split(' ')` yields a single empty-string element, so jit_args becomes `[\"\"]` (one bogus empty argument) rather than an empty list.","fix":"Filter out empty fields, e.g. `args.split(' ').filter(|s| !s.is_empty())`, or treat an empty string as no args.","locations":[{"ref":"src/config.rs:20-22","code":"   20 |             jit_args: match std::env::var(\"CG_CLIF_JIT_ARGS\") {\n   21 |                 Ok(args) => args.split(' ').map(|arg| arg.to_string()).collect(),\n   22 |                 Err(std::env::VarError::NotPresent) => vec![],","lines":3,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/config.rs#L20-L22"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`clone_repo` ignores the exit status of `git clone` (the comment says \"Ignore exit code as the repo may already have been checked out\", but the directory was just removed via `remove_dir_all` immediately above, so it cannot already be checked out). If `git clone` fails (e.g. network error), the failure is swallowed and the subsequent `git checkout` commands run in a non-repo, producing a confusing error far from the real cause.","fix":"Use `spawn_and_wait` for the clone (which checks the exit status) and remove the now-inapplicable comment, since the target dir is unconditionally deleted just before cloning.","locations":[{"ref":"build_system/prepare.rs:182-183","code":"  182 |     // Ignore exit code as the repo may already have been checked out\n  183 |     git_command(None, \"clone\").arg(repo).arg(download_dir).spawn().unwrap().wait().unwrap();","lines":2,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/build_system/prepare.rs#L182-L183"},{"ref":"build_system/prepare.rs:176-180","code":"  176 |     match fs::remove_dir_all(download_dir) {\n  177 |         Ok(()) => {}\n  178 |         Err(err) if err.kind() == io::ErrorKind::NotFound => {}\n  179 |         Err(err) => panic!(\"Failed to remove {path}: {err}\", path = download_dir.display()),\n  180 |     }","lines":5,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/build_system/prepare.rs#L176-L180"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"Benchmark availability check runs `Command::new(\"hyperfine\").output()` with no arguments and treats only an Err (spawn failure) as \"not installed\". Running bare `hyperfine` with no args exits non-zero but still spawns successfully, so this only detects a missing binary, not e.g. a broken one; more importantly it needlessly executes hyperfine's usage/help path. Minor, but the intent (detect presence) would be clearer with `--version`.","fix":"Probe with `hyperfine --version` and check both spawn success and exit status.","locations":[{"ref":"build_system/bench.rs:21-25","code":"   21 |     if std::process::Command::new(\"hyperfine\").output().is_err() {\n   22 |         eprintln!(\"Hyperfine not installed\");\n   23 |         eprintln!(\"Hint: Try `cargo install hyperfine` to install hyperfine\");\n   24 |         std::process::exit(1);\n   25 |     }","lines":5,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/build_system/bench.rs#L21-L25"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`set_cross_linker_and_runner` falls through to `eprintln!(\"Unknown non-native platform\")` for any unrecognized triple but does not set a runner or exit. The build/test then proceeds as if native execution were possible on a cross target, leading to confusing downstream failures (e.g. trying to run a foreign-arch binary) rather than a clear early error.","fix":"For an unknown cross triple, either exit with an error or clearly document that tests will be skipped, and ensure `is_native`/runner state is consistent.","locations":[{"ref":"build_system/utils.rs:58-61","code":"   58 |             _ => {\n   59 |                 eprintln!(\"Unknown non-native platform\");\n   60 |             }\n   61 |         }","lines":4,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/build_system/utils.rs#L58-L61"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`import_function` carefully maps two ModuleError variants to clean fatal diagnostics but falls through to `Err::<_,_>(err).unwrap()` for all other module errors, producing an ugly panic/backtrace instead of a diagnostic. `lib_call_unadjusted`, `codegen_fn`, and `codegen_panic_inner` likewise `declare_function(...).unwrap()` and `define_function` in compile_fn `panic!`s on the catch-all. These declaration failures are generally bugs, but the inconsistent handling (some fatal-diagnostic, some unwrap/panic) is worth noting.","fix":"Route the catch-all declaration/definition errors through tcx.dcx().fatal with the symbol name for a consistent, user-facing message.","locations":[{"ref":"src/abi/mod.rs:116","code":"  116 |         Err(err) => Err::<_, _>(err).unwrap(),","lines":1,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/abi/mod.rs#L116"},{"ref":"src/base.rs:61","code":"   61 |     let func_id = module.declare_function(&symbol_name, Linkage::Local, &sig).unwrap();","lines":1,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/base.rs#L61"},{"ref":"src/base.rs:1130","code":" 1130 |     let func_id = fx.module.declare_function(symbol_name, Linkage::Import, &sig).unwrap();","lines":1,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/base.rs#L1130"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"Several object-file emission steps that can fail at compile time use `.unwrap()` instead of producing a proper diagnostic: `tmp_file.file_name().unwrap()` and `file.metadata().unwrap().len()` in the profiling block. While file_name is normally present, `metadata()` can fail (e.g. file removed by another process, FS error) and would panic instead of being reported. This is only reached when self-profiling is enabled, so impact is low.","fix":"Handle the `metadata()` error gracefully (skip recording the artifact size or emit a non-fatal warning) rather than unwrapping inside the profiling path.","locations":[{"ref":"src/driver/aot.rs:126-132","code":"  126 |     if prof.enabled() {\n  127 |         prof.artifact_size(\n  128 |             \"object_file\",\n  129 |             tmp_file.file_name().unwrap().to_string_lossy(),\n  130 |             file.metadata().unwrap().len(),\n  131 |         );\n  132 |     }","lines":7,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/driver/aot.rs#L126-L132"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"On assembler failure the returned error embeds the entire (possibly very large) asm source: `format!(\"Failed to assemble `{}`\", global_asm)`. In the non-GNU branch `global_asm` has been shadowed by the brace-escaped copy (`{` -> `{{`), so the error text shows mangled, misleading asm that does not match what was fed to the assembler.","fix":"Report a short fixed message (e.g. \"failed to assemble global_asm\") plus the assembler exit status; if the source is wanted, log the original unescaped string, not the brace-escaped shadow.","locations":[{"ref":"src/global_asm.rs:237-239","code":"  237 |         if !status.success() {\n  238 |             return Err(format!(\"Failed to assemble `{}`\", global_asm));\n  239 |         }","lines":3,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/global_asm.rs#L237-L239"},{"ref":"src/global_asm.rs:242","code":"  242 |         let global_asm = global_asm.replace('{', \"{{\").replace('}', \"}}\");","lines":1,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/global_asm.rs#L242"},{"ref":"src/global_asm.rs:237-239","code":"  237 |         if !status.success() {\n  238 |             return Err(format!(\"Failed to assemble `{}`\", global_asm));\n  239 |         }","lines":3,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/global_asm.rs#L237-L239"}]},
{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`simd_insert` and `simd_extract` report an out-of-range index using `fx.mir.span` (the whole function's span) rather than the call's `span`, unlike every neighbouring diagnostic which uses `span`. This produces a worse error location for a user-facing monomorphization error.","fix":"Use `span` (the intrinsic call span) for these span_fatal calls, matching simd_insert's non-constant branch and the other arms.","locations":[{"ref":"src/intrinsics/simd.rs:279-284","code":"  279 |             if u64::from(idx) >= lane_count {\n  280 |                 fx.tcx.dcx().span_fatal(\n  281 |                     fx.mir.span,\n  282 |                     format!(\"[simd_insert] idx {} >= lane_count {}\", idx, lane_count),\n  283 |                 );\n  284 |             }","lines":6,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/intrinsics/simd.rs#L279-L284"},{"ref":"src/intrinsics/simd.rs:329-334","code":"  329 |             if u64::from(idx) >= lane_count {\n  330 |                 fx.tcx.dcx().span_fatal(\n  331 |                     fx.mir.span,\n  332 |                     format!(\"[simd_extract] idx {} >= lane_count {}\", idx, lane_count),\n  333 |                 );\n  334 |             }","lines":6,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/intrinsics/simd.rs#L329-L334"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`MeasuremeProfiler::start_pass` stores a `ManuallyDrop<SelfProfilerRef>` in a heap box and then takes a raw pointer to it (`&*timing_guard.profiler as *const SelfProfilerRef`) to obtain a `TimingGuard<'static>` borrowing from it, relying on the box not moving. The `'static` lifetime is forged via the unsafe cast and the self-referential `TimingGuard`/`inner` pair is manually torn down in `Drop` (drop inner before the ManuallyDrop profiler). This is fragile self-referential unsafe code: any reordering, or a panic between setting `inner` and returning, risks a dangling borrow or use-after-free of the profiler. The construction is more complex than necessary.","fix":"Avoid the self-referential struct: store the owned `SelfProfilerRef` and create the `TimingGuard` lazily, or use a crate like `ouroboros`, or restructure so the guard owns the profiler and produces the timing on drop without a forged `'static` borrow. At minimum document the move-stability and drop-order invariants.","locations":[{"ref":"src/driver/mod.rs:54-82","code":"   54 | struct MeasuremeProfiler(SelfProfilerRef);\n   55 | \n   56 | struct TimingGuard {\n   57 |     profiler: std::mem::ManuallyDrop<SelfProfilerRef>,\n   58 |     inner: Option<rustc_data_structures::profiling::TimingGuard<'static>>,\n   59 | }\n   60 | \n   61 | impl Drop for TimingGuard {\n   62 |     fn drop(&mut self) {\n   63 |         self.inner.take();\n   64 |         unsafe {\n   65 |             std::mem::ManuallyDrop::drop(&mut self.profiler);\n   66 |         }\n   67 |     }\n   68 | }\n   69 | \n   70 | impl cranelift_codegen::timing::Profiler for MeasuremeProfiler {\n   71 |     fn start_pass(&self, pass: cranelift_codegen::timing::Pass) -> Box<dyn std::any::Any> {\n   72 |         let mut timing_guard = Box::new(TimingGuard {\n   73 |             profiler: std::mem::ManuallyDrop::new(self.0.clone()),\n   74 |             inner: None,\n   75 |         });\n   76 |         timing_guard.inner = Some(\n   77 |             unsafe { &*(&*timing_guard.profiler as &SelfProfilerRef as *const SelfProfilerRef) }\n   78 |                 .generic_activity(pass.description()),\n   79 |         );\n   80 |         timing_guard\n   81 |     }\n   82 | }","lines":29,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/driver/mod.rs#L54-L82"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"negligible","difficulty":"medium","description":"`ObjectBuilder::new(...).unwrap()` in `make_module` panics on failure with no context. This is effectively only reachable on an unsupported target/ISA configuration during compiler setup, so impact is low, but the panic message would be opaque.","fix":"Map the error to a fatal session diagnostic (e.g. via `tcx.dcx().fatal`) describing that the target is unsupported, instead of `.unwrap()`.","locations":[{"ref":"src/driver/aot.rs:47-52","code":"   47 |     let mut builder = ObjectBuilder::new(\n   48 |         isa,\n   49 |         cgu_name.to_owned() + \".o\",\n   50 |         cranelift_module::default_libcall_names(),\n   51 |     )\n   52 |     .unwrap();","lines":6,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/driver/aot.rs#L47-L52"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`get_bool` calls `load_config_file()` which re-reads and re-parses the entire config.txt from disk on every invocation. `run_testsuite` calls `get_bool(config)` once per test case (line 406), so config.txt is parsed dozens of times per run. It is also re-read for keep_sysroot and each testsuite.* flag.","fix":"Parse config.txt once into a map (e.g. a `OnceLock<HashMap<String, Option<String>>>` or load it at startup and pass it around) and look up keys from the cached structure.","locations":[{"ref":"build_system/config.rs:20-35","code":"   20 | pub(crate) fn get_bool(name: &str) -> bool {\n   21 |     let values = load_config_file()\n   22 |         .into_iter()\n   23 |         .filter(|(key, _)| key == name)\n   24 |         .map(|(_, val)| val)\n   25 |         .collect::<Vec<_>>();\n   26 |     if values.is_empty() {\n   27 |         false\n   28 |     } else {\n   29 |         if values.iter().any(|val| val.is_some()) {\n   30 |             eprintln!(\"Boolean config `{}` has a value\", name);\n   31 |             process::exit(1);\n   32 |         }\n   33 |         true\n   34 |     }\n   35 | }","lines":16,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/build_system/config.rs#L20-L35"},{"ref":"build_system/tests.rs:415","code":"  415 |             let _guard = if !config::get_bool(config)","lines":1,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/build_system/tests.rs#L415"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`codegen_fn_prelude` clones the entire block-params slice into a Vec just to get an owned iterator (`fx.bcx.func.dfg.block_params(start_block).to_vec().into_iter()`). For functions with many parameters this is an unnecessary allocation; it is done only to sidestep the borrow on `fx.bcx`.","fix":"Consider collecting into a SmallVec, or restructuring so the params can be iterated by index without owning a full Vec copy.","locations":[{"ref":"src/abi/mod.rs:269","code":"  269 |     let mut block_params_iter = fx.bcx.func.dfg.block_params(start_block).to_vec().into_iter();","lines":1,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/abi/mod.rs#L269"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"Many SIMD operations are explicitly lowered lane-by-lane with scalar instructions (each marked `// FIXME use vector instructions when possible`): simd_eq/ne/lt/..., simd_add/sub/..., simd_saturating_add/sub, and the x86 pavg/psra/psad helpers. For wide vectors this produces large amounts of scalar IR instead of native Cranelift vector ops, which is slow both at compile time and run time.","fix":"Where Cranelift has a vector instruction (iadd/isub/imul/icmp/band/... on vector types), operate on the whole vector value instead of per-lane scalars.","locations":[{"ref":"src/intrinsics/simd.rs:57-58","code":"   57 |             // FIXME use vector instructions when possible\n   58 |             simd_pair_for_each_lane(fx, x, y, ret, &|fx, lane_ty, res_lane_ty, x_lane, y_lane| {","lines":2,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/intrinsics/simd.rs#L57-L58"},{"ref":"src/intrinsics/simd.rs:423-424","code":"  423 |             // FIXME use vector instructions when possible\n  424 |             simd_pair_for_each_lane(fx, x, y, ret, &|fx, lane_ty, _ret_lane_ty, x_lane, y_lane| {","lines":2,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/intrinsics/simd.rs#L423-L424"},{"ref":"src/intrinsics/simd.rs:986-989","code":"  986 |             // FIXME use vector instructions when possible\n  987 |             simd_pair_for_each_lane_typed(fx, x, y, ret, &|fx, x_lane, y_lane| {\n  988 |                 crate::num::codegen_saturating_int_binop(fx, bin_op, x_lane, y_lane)\n  989 |             });","lines":4,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/intrinsics/simd.rs#L986-L989"},{"ref":"src/intrinsics/llvm_x86.rs:488-489","code":"  488 |             // FIXME use vector instructions when possible\n  489 |             simd_pair_for_each_lane(","lines":2,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/intrinsics/llvm_x86.rs#L488-L489"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"In `codegen_with_call_return_arg` the comment at the by-ref optimization arm states `This match arm can be safely removed.` implying it is a pure optimization. That is accurate, but the surrounding logic duplicates the indirect-no-meta match arm shape three times (here, in get_abi_param/return, returning.rs). Not a bug; noting the repeated `PassMode::Indirect { attrs:_, meta_attrs: None/Some, on_stack:_ }` destructuring spread across returning.rs and pass_mode.rs.","fix":"Optional: factor the indirect/meta classification into a small helper to reduce repeated 4-field destructuring.","locations":[{"ref":"src/abi/returning.rs:53-63","code":"   53 |         PassMode::Indirect { attrs: _, meta_attrs: None, on_stack: _ } => {\n   54 |             if let Some(ret_ptr) = ret_place.try_to_ptr() {\n   55 |                 // This is an optimization to prevent unnecessary copies of the return value when\n   56 |                 // the return place is already a memory place as opposed to a register.\n   57 |                 // This match arm can be safely removed.\n   58 |                 (None, Some(ret_ptr.get_addr(fx)))\n   59 |             } else {\n   60 |                 let place = CPlace::new_stack_slot(fx, ret_arg_abi.layout);\n   61 |                 (Some(place), Some(place.to_ptr().get_addr(fx)))\n   62 |             }\n   63 |         }","lines":11,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/abi/returning.rs#L53-L63"},{"ref":"src/abi/returning.rs:89-99","code":"   89 |         PassMode::Indirect { attrs: _, meta_attrs: None, on_stack: _ } => {\n   90 |             if let Some(ret_temp_place) = ret_temp_place {\n   91 |                 // If ret_temp_place is None, it is not necessary to copy the return value.\n   92 |                 let ret_temp_value = ret_temp_place.to_cvalue(fx);\n   93 |                 ret_place.write_cvalue(fx, ret_temp_value);\n   94 |             }\n   95 |         }\n   96 |         PassMode::Indirect { attrs: _, meta_attrs: Some(_), on_stack: _ } => {\n   97 |             unreachable!(\"unsized return value\")\n   98 |         }\n   99 |     }","lines":11,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/abi/returning.rs#L89-L99"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`encoded_size()` helpers on `CallSiteTable`, `CallSite`, `ActionTable`, `Action`, and `TypeInfoTable` each re-serialize the whole structure into a throwaway `LenWriter` to measure its length. In `GccExceptTable::write` these sizes are recomputed repeatedly (e.g. `call_sites.encoded_size()` and `actions.encoded_size()` are each evaluated twice in the alignment computation, and `CallSiteTable::write` itself sums per-callsite `encoded_size()` which re-serializes every call site). For functions with many call sites this is O(n^2)-ish redundant serialization.","fix":"Cache the computed `encoded_size()` values in locals within `GccExceptTable::write` and compute the call-site table length from a single pass rather than per-element re-serialization.","locations":[{"ref":"src/debuginfo/gcc_except_table.rs:32-45","code":"   32 |             let class_info_offset_no_padding = self.call_sites.encoded_size()\n   33 |                 + self.actions.encoded_size()\n   34 |                 + self.type_info.encoded_size(encoding);\n   35 | \n   36 |             let type_info_is_aligned = |type_info_padding: u64| {\n   37 |                 (class_info_offset_field_offset\n   38 |                     + gimli::leb128::write::uleb128_size(\n   39 |                         class_info_offset_no_padding + type_info_padding,\n   40 |                     ) as u64\n   41 |                     + self.call_sites.encoded_size()\n   42 |                     + self.actions.encoded_size()\n   43 |                     + type_info_padding)\n   44 |                     .is_multiple_of(4)\n   45 |             };","lines":14,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/debuginfo/gcc_except_table.rs#L32-L45"},{"ref":"src/debuginfo/gcc_except_table.rs:95-114","code":"   95 |     fn encoded_size(&self) -> u64 {\n   96 |         let mut len = LenWriter(0);\n   97 |         self.write(&mut len).unwrap();\n   98 |         len.0 as u64\n   99 |     }\n  100 | \n  101 |     fn write<W: Writer>(&self, w: &mut W) -> gimli::write::Result<()> {\n  102 |         let callsite_table_length = self.0.iter().map(|call_site| call_site.encoded_size()).sum();\n  103 | \n  104 |         // callsiteEncoding\n  105 |         w.write_u8(DW_EH_PE_uleb128.0)?;\n  106 |         // callsiteTableLength\n  107 |         w.write_uleb128(callsite_table_length)?;\n  108 | \n  109 |         for call_site in &self.0 {\n  110 |             call_site.write(w)?;\n  111 |         }\n  112 | \n  113 |         Ok(())\n  114 |     }","lines":20,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/debuginfo/gcc_except_table.rs#L95-L114"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`std::iter::once(&*tcx.crate_name(LOCAL_CRATE).as_str().to_string())` allocates a String, then immediately takes a reference to its str and later copies into a CString. The intermediate `.to_string()` allocation is unnecessary since `as_str()` already yields a `&str`. Negligible (runs once at JIT start).","fix":"Use `tcx.crate_name(LOCAL_CRATE).as_str()` directly without the extra `.to_string()` allocation.","locations":[{"ref":"src/driver/jit.rs:95","code":"   95 |     let args = std::iter::once(&*tcx.crate_name(LOCAL_CRATE).as_str().to_string())","lines":1,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/driver/jit.rs#L95"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`simd_bitmask` allocates a boxed trait-object iterator (`Box<dyn Iterator>`) per call purely to choose iteration direction by endianness. A boxed dynamic iterator in hot codegen is wasteful when a small match returning an enum or `itertools::Either`/explicit branch would avoid the allocation and indirection.","fix":"Replace the Box<dyn Iterator> with a branch on endianness around the loop, or collect the lane order into a small SmallVec.","locations":[{"ref":"src/intrinsics/simd.rs:934-937","code":"  934 |             let lanes = match fx.tcx.sess.target.endian {\n  935 |                 Endian::Big => Box::new(0..lane_count) as Box<dyn Iterator<Item = u64>>,\n  936 |                 Endian::Little => Box::new((0..lane_count).rev()) as Box<dyn Iterator<Item = u64>>,\n  937 |             };","lines":4,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/intrinsics/simd.rs#L934-L937"}]},
{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`drop_fn_of_obj`, `size_of_obj`, `align_of_obj`, and `get_ptr_and_method_ref` each recompute `fx.layout_of(fx.tcx.types.usize).size.bytes()` on every call to fetch the pointer size, which is a layout query. `fx.pointer_type.bytes()` (already cached on FunctionCx) gives the same value for these vtable slot offsets and avoids the layout lookup.","fix":"Use `fx.pointer_type.bytes()` (or cache the usize size once) instead of querying the layout of usize repeatedly.","locations":[{"ref":"src/vtable.rs:15","code":"   15 |     let usize_size = fx.layout_of(fx.tcx.types.usize).size.bytes() as usize;","lines":1,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/vtable.rs#L15"},{"ref":"src/vtable.rs:25","code":"   25 |     let usize_size = fx.layout_of(fx.tcx.types.usize).size.bytes() as usize;","lines":1,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/vtable.rs#L25"},{"ref":"src/vtable.rs:35","code":"   35 |     let usize_size = fx.layout_of(fx.tcx.types.usize).size.bytes() as usize;","lines":1,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/vtable.rs#L35"},{"ref":"src/vtable.rs:67","code":"   67 |     let usize_size = fx.layout_of(fx.tcx.types.usize).size.bytes();","lines":1,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/vtable.rs#L67"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"`file_info` is hardcoded to `None` in both arms of the `match tcx.sess.local_crate_source_file()` block, so `file_has_md5 = file_info.is_some()` is always `false`. Consequently `line_program.file_has_md5` is always initialized to false and the `if file_has_md5 { ... }` logic can never populate an MD5 file hash for the compilation-unit primary file. The variable, the `is_some()` check, and the dependent assignment are effectively dead. This means the comp-unit root file never advertises an MD5 hash even when one is available.","fix":"Either compute a real `FileInfo` (with the MD5 hash of the primary source file) for the `Some(path)` arm, or remove the now-useless `file_has_md5`/`file_info` plumbing and pass `None` directly, leaving per-file MD5 to `add_source_file`.","locations":[{"ref":"src/debuginfo/mod.rs:113-131","code":"  113 |         let (name, file_info) = match tcx.sess.local_crate_source_file() {\n  114 |             Some(path) => {\n  115 |                 let name =\n  116 |                     path.path(RemapPathScopeComponents::DEBUGINFO).to_string_lossy().into_owned();\n  117 |                 (name, None)\n  118 |             }\n  119 |             None => (tcx.crate_name(LOCAL_CRATE).to_string(), None),\n  120 |         };\n  121 | \n  122 |         let file_has_md5 = file_info.is_some();\n  123 |         let mut line_program = LineProgram::new(\n  124 |             encoding,\n  125 |             LineEncoding::default(),\n  126 |             LineString::new(comp_dir.as_bytes(), encoding, &mut dwarf.line_strings),\n  127 |             None,\n  128 |             LineString::new(name.as_bytes(), encoding, &mut dwarf.line_strings),\n  129 |             file_info,\n  130 |         );\n  131 |         line_program.file_has_md5 = file_has_md5;","lines":19,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b70309 {"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"The `types::F16 => \"h\"` arms in the i128->float and float->i128 libcall-name builders are unreachable. Any cast involving f16 (or f128) is routed to `codegen_f16_f128::codegen_cast` earlier in `clif_int_or_float_cast` (the f16/f128 guard), so `from_ty`/`to_ty` here can never be F16. These arms would also generate non-existent symbols like `__floattihf`/`__fixhfti` if ever reached.","fix":"Remove the `types::F16 => \"h\"` arms (or replace with `unreachable!`) to reflect that f16 never reaches this code.","locations":[{"ref":"src/cast.rs:69-75","code":"   69 |                 flt = match to_ty {\n   70 |                     types::F16 => \"h\",\n   71 |                     types::F32 => \"s\",\n   72 |                     types::F64 => \"d\",\n   73 |                     types::F128 => \"t\",\n   74 |                     _ => unreachable!(\"{:?}\", to_ty),\n   75 |                 },","lines":7,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/cast.rs#L69-L75"},{"ref":"src/cast.rs:103-109","code":"  103 |                 flt = match from_ty {\n  104 |                     types::F16 => \"h\",\n  105 |                     types::F32 => \"s\",\n  106 |                     types::F64 => \"d\",\n  107 |                     types::F128 => \"t\",\n  108 |                     _ => unreachable!(\"{:?}\", to_ty),\n  109 |                 },","lines":7,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/cast.rs#L103-L109"}]},

{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"Comment on the `git clone` line claims the exit code is ignored because \"the repo may already have been checked out\", but `clone_repo` unconditionally deletes `download_dir` a few lines earlier, so the repo can never already exist when clone runs. The comment is misleading.","fix":"Remove or correct the comment to reflect that the directory is always freshly removed before cloning.","locations":[{"ref":"build_system/prepare.rs:182-183","code":"  182 |     // Ignore exit code as the repo may already have been checked out\n  183 |     git_command(None, \"clone\").arg(repo).arg(download_dir).spawn().unwrap().wait().unwrap();","lines":2,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/build_system/prepare.rs#L182-L183"}]},

{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"In compile_global_asm the GNU-AS branch spawns `config.assembler` (the `as` binary) and the comment/error strings are fine, but the non-GNU branch invokes `std::env::current_exe()` (rustc) yet still uses `.expect(\"Failed to spawn `as`.\")`. The message claims it failed to spawn `as` when it actually failed to spawn the current rustc executable, which is misleading when debugging.","fix":"Use a message like \"Failed to spawn rustc for global_asm\" in the current_exe branch.","locations":[{"ref":"src/global_asm.rs:233-234","code":"  233 |             .spawn()\n  234 |             .expect(\"Failed to spawn `as`.\");","lines":2,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/global_asm.rs#L233-L234"}]},
