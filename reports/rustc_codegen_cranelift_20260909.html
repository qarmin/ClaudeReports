<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`todo::run()` reads every tracked source file with `fs::read(&file).unwrap()` and decodes with `std::str::from_utf8(&bytes).unwrap()`. The extension filter includes many text types but any tracked file with one of those extensions that is not valid UTF-8 (or that was deleted from disk but still tracked) causes a panic instead of a useful error. `list_tracked_files` also does `from_utf8(entry).unwrap()` on git path bytes.","fix":"Use `from_utf8_lossy` (or skip non-UTF-8 files) and handle the read error per-file with a warning, so one odd file does not abort the whole check.","locations":[{"ref":"build_system/todo.rs:47-48","code":"   47 |         let bytes = fs::read(&file).unwrap();\n   48 |         let contents = std::str::from_utf8(&bytes).unwrap();","lines":2,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/build_system/todo.rs#L47-L48"},{"ref":"build_system/todo.rs:29","code":"   29 |         let path = std::str::from_utf8(entry).unwrap();","lines":1,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/build_system/todo.rs#L29"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`benchmark` parses `BENCH_RUNS` with `.parse().unwrap()`. If a user sets `BENCH_RUNS` to a non-numeric value the program panics with a generic ParseIntError rather than a clear message.","fix":"Use `unwrap_or_else` to print a descriptive error about an invalid BENCH_RUNS value, or validate and default.","locations":[{"ref":"build_system/bench.rs:30","code":"   30 |     let bench_runs = env::var(\"BENCH_RUNS\").unwrap_or_else(|_| \"10\".to_string()).parse().unwrap();","lines":1,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/build_system/bench.rs#L30"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`get_toolchain_name` does `String::from_utf8(...).unwrap().trim().split_once(' ').unwrap().0`. If `rustup show active-toolchain` ever prints output without a space (format change, localized output, or empty output when no toolchain is active), `split_once(' ').unwrap()` panics with an opaque message instead of a helpful diagnostic.","fix":"Handle the `None` case from `split_once` with a descriptive error (e.g. `unwrap_or_else` printing the raw rustup output) before exiting.","locations":[{"ref":"build_system/rustc_info.rs:14-22","code":"   14 | pub(crate) fn get_toolchain_name() -> String {\n   15 |     let active_toolchain = Command::new(\"rustup\")\n   16 |         .stderr(Stdio::inherit())\n   17 |         .args([\"show\", \"active-toolchain\"])\n   18 |         .output()\n   19 |         .unwrap()\n   20 |         .stdout;\n   21 |     String::from_utf8(active_toolchain).unwrap().trim().split_once(' ').unwrap().0.to_owned()\n   22 | }","lines":9,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/build_system/rustc_info.rs#L14-L22"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`reg_to_abi_param` uses `unreachable!` for unknown (RegKind, size) combinations, e.g. `(RegKind::Integer, 0)` or `(RegKind::Float, 1)`. These come from target ABI computation in rustc; an unexpected/zero-sized Reg from a new or exotic target ABI would abort the compiler with a panic rather than a diagnostic. Same pattern for the `_ => unreachable!` backend_repr arms in get_abi_param/get_abi_return.","fix":"These are internal-consistency invariants from rustc's ABI layer, so unreachable! is largely acceptable; if hardening is desired, convert to span_fatal/bug! with the offending Reg/repr for a cleaner ICE message.","locations":[{"ref":"src/abi/pass_mode.rs:20-34","code":"   20 |     let clif_ty = match (reg.kind, reg.size.bytes()) {\n   21 |         (RegKind::Integer, 1) => types::I8,\n   22 |         (RegKind::Integer, 2) => types::I16,\n   23 |         (RegKind::Integer, 3..=4) => types::I32,\n   24 |         (RegKind::Integer, 5..=8) => types::I64,\n   25 |         (RegKind::Integer, 9..=16) => types::I128,\n   26 |         (RegKind::Float, 2) => types::F16,\n   27 |         (RegKind::Float, 4) => types::F32,\n   28 |         (RegKind::Float, 8) => types::F64,\n   29 |         (RegKind::Float, 16) => types::F128,\n   30 |         (RegKind::Vector { hint_vector_elem: _ }, size) => {\n   31 |             types::I8.by(u32::try_from(size).unwrap()).unwrap()\n   32 |         }\n   33 |         _ => unreachable!(\"{:?}\", reg),\n   34 |     };","lines":15,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/abi/pass_mode.rs#L20-L34"},{"ref":"src/abi/pass_mode.rs:112","code":"  112 |                 _ => unreachable!(\"{:?}\", self.layout.backend_repr),","lines":1,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/abi/pass_mode.rs#L112"},{"ref":"src/ {"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`split_path_dir_and_file` panics with a hard `panic!` if the last path component is not `Component::Normal` (e.g. a path ending in `/`, `..`, or a root). Source-file paths coming from remapped DEBUGINFO scopes are generally well-formed, but a remapped path that ends in a non-normal component would abort compilation rather than degrade gracefully.","fix":"Fall back to treating the whole path as the file name (or use an empty file name) instead of panicking when `next_back()` is not `Component::Normal`.","locations":[{"ref":"src/debuginfo/line_info.rs:19-33","code":"   19 | fn split_path_dir_and_file(path: &Path) -> (&Path, &OsStr) {\n   20 |     let mut iter = path.components();\n   21 |     let file_name = match iter.next_back() {\n   22 |         Some(Component::Normal(p)) => p,\n   23 |         component => {\n   24 |             panic!(\n   25 |                 \"Path component {:?} of path {} is an invalid filename\",\n   26 |                 component,\n   27 |                 path.display()\n   28 |             );\n   29 |         }\n   30 |     };\n   31 |     let parent = iter.as_path();\n   32 |     (parent, file_name)\n   33 | }","lines":15,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/debuginfo/line_info.rs#L19-L33"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`CString::new(arg).unwrap()` will panic if any JIT program argument or the crate name contains an interior NUL byte. These come from user-controlled command-line arguments passed through `-Cllvm-args` / jit_args, so a crafted argument containing a NUL would abort the compiler with an ugly unwrap panic rather than a clean diagnostic.","fix":"Map the `CString::new` error to a clean `tcx.dcx().fatal(...)` diagnostic explaining that JIT arguments may not contain NUL bytes, instead of `.unwrap()`.","locations":[{"ref":"src/driver/jit.rs:95-98","code":"   95 |     let args = std::iter::once(&*tcx.crate_name(LOCAL_CRATE).as_str().to_string())\n   96 |         .chain(jit_args.iter().map(|arg| &**arg))\n   97 |         .map(|arg| CString::new(arg).unwrap())\n   98 |         .collect::<Vec<_>>();","lines":4,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/driver/jit.rs#L95-L98"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"Several `.unwrap()`/`.expect()` calls on external process plumbing in compile_global_asm will panic (rather than producing a diagnostic) if the environment is unusual: spawning `as`, taking stdin, writing to stdin, waiting, and `std::env::current_exe().unwrap()`. A broken/again missing assembler or closed pipe aborts the compiler with a raw panic.","fix":"Propagate these as `Err(String)` (the function already returns Result) or convert to fatal diagnostics, instead of unwrap/expect.","locations":[{"ref":"src/global_asm.rs:229-236","code":"  229 |         let mut child = Command::new(&config.assembler)\n  230 |             .arg(\"-o\")\n  231 |             .arg(&global_asm_object_file)\n  232 |             .stdin(Stdio::piped())\n  233 |             .spawn()\n  234 |             .expect(\"Failed to spawn `as`.\");\n  235 |         child.stdin.take().unwrap().write_all(global_asm.as_bytes()).unwrap();\n  236 |         let status = child.wait().expect(\"Failed to wait for `as`.\");","lines":8,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/global_asm.rs#L229-L236"},{"ref":"src/global_asm.rs:244-287","code":"  244 |         let mut child = Command::new(std::env::current_exe().unwrap())\n  245 |             // Avoid a warning about the jobserver fd not being passed\n  246 |             .env_remove(\"CARGO_MAKEFLAGS\")\n  247 |             .arg(\"--target\")\n  248 |             .arg(&config.target)\n  249 |             .arg(\"--crate-type\")\n  250 |             .arg(\"staticlib\")\n  251 |             .arg(\"--emit\")\n  252 |             .arg(\"obj\")\n  253 |             .arg(\"-o\")\n  254 |             .arg(&global_asm_object_file)\n  255 |             .arg(\"-\")\n  256 |             .arg(\"-Abad_asm_style\")\n  257 |             .arg(\"-Zcodegen-backend=llvm\")\n  258 |             // JSON targets {"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`allocate_registers` uses `.expect(\"cannot allocate registers\")` when no free register can be found for a RegClass operand. For valid (rustc-typechecked) asm this should not happen, but an out-of-registers situation produces an ICE-style panic rather than a proper diagnostic. The two in/lateout allocation loops repeat the identical expect.","fix":"Emit a fatal compiler diagnostic via tcx.dcx() explaining register exhaustion instead of expect(), or document why this is provably unreachable post-typeck.","locations":[{"ref":"src/inline_asm.rs:373","code":"  373 |                     let reg = alloc_reg.expect(\"cannot allocate registers\");","lines":1,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/inline_asm.rs#L373"},{"ref":"src/inline_asm.rs:373","code":"  373 |                     let reg = alloc_reg.expect(\"cannot allocate registers\");","lines":1,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/inline_asm.rs#L373"},{"ref":"src/inline_asm.rs:373","code":"  373 |                     let reg = alloc_reg.expect(\"cannot allocate registers\");","lines":1,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/inline_asm.rs#L373"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"Several SIMD/LLVM-intrinsic arms call `fx.clif_type(...).unwrap()` / `simd_size_and_type` without first validating the input is actually SIMD (e.g. simd_bitmask reads lane info before any is_simd check; the x86/aarch64 NEON arms assume well-formed vector types). For malformed/monomorphization-error input these unwraps panic the compiler (ICE) instead of emitting a clean diagnostic. Most user-facing simd_* arms guard with report_simd_type_validation_error, but simd_bitmask (simd.rs:890-893) and simd_saturating_add/sub (simd.rs:970-982) do not.","fix":"Add the same `if !a.layout().ty.is_simd() { report_simd_type_validation_error(...) }` guard used by the other arms before calling simd_size_and_type/clif_type.","locations":[{"ref":"src/intrinsics/simd.rs:896-899","code":"  896 |         sym::simd_bitmask => {\n  897 |             intrinsic_args!(fx, args => (a); intrinsic);\n  898 | \n  899 |             let (lane_count, lane_ty) = a.layout().ty.simd_size_and_type(fx.tcx);","lines":4,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/intrinsics/simd.rs#L896-L899"},{"ref":"src/intrinsics/simd.rs:977-989","code":"  977 |         sym::simd_saturating_add | sym::simd_saturating_sub => {\n  978 |             intrinsic_args!(fx, args => (x, y); intrinsic);\n  979 | \n  980 |             let bin_op = match intrinsic {\n  981 |                 sym::simd_saturating_add => BinOp::Add,\n  982 |                 sym::simd_saturating_sub => BinOp::Sub,\n  983 |                 _ => unreachable!(),\n  984 |             };\n  985 | \n  986 |             // FIXME use vector instructions when possible\n  987 |             simd_pair_for_each_lane_typed(fx, x, y, ret, &|fx, x_lane, y_lane| {\n  988 |                 crate::num::codegen_saturating_int_binop(fx, bin_op, x_lane, y_lane)\n  989 |             });","lines":13,"link {"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"`dep_symbol_lookup_fn` deliberately leaks the imported dylibs via `Box::leak` so the `libloading::Library` handles live for the rest of the process. For the JIT path this is intentional (the JITed code runs until `process::exit`), so it is not a true bug, but it is an unbounded leak of OS library handles and the leak is undocumented. If this function were ever reused outside the run-once JIT flow it would leak per call.","fix":"Add a comment explaining the leak is intentional because the loaded dylibs must outlive all JITed code until process exit; optionally store the libraries in a long-lived owner instead of leaking if reuse is ever desired.","locations":[{"ref":"src/driver/jit.rs:204-209","code":"  204 |     let imported_dylibs = Box::leak(\n  205 |         dylib_paths\n  206 |             .into_iter()\n  207 |             .map(|path| unsafe { libloading::Library::new(&path).unwrap() })\n  208 |             .collect::<Box<[_]>>(),\n  209 |     );","lines":6,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/driver/jit.rs#L204-L209"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"Several casts of u64 byte sizes to i64 via `as i64` (e.g. offset_i64 args, iconst values, array-len, Subslice index math `from as i64 + to as i64`). These come from layout sizes and slice-pattern indices; for pathological inputs (>= 2^63) they would wrap to negative offsets. In practice such sizes are rejected earlier by layout computation, so impact is low, but the `as i64` truncations are unchecked.","fix":"Where feasible use i64::try_from(...).unwrap() (as is already done in codegen_panic_nounwind) so an overflow ICEs cleanly instead of silently wrapping.","locations":[{"ref":"src/base.rs:1035","code":" 1035 |                             ptr.offset_i64(fx, elem_layout.size.bytes() as i64 * (from as i64)),","lines":1,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/base.rs#L1035"},{"ref":"src/abi/pass_mode.rs:241","code":"  241 |         ptr.offset_i64(fx, offset.bytes() as i64).store(","lines":1,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/abi/pass_mode.rs#L241"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`call_site.ret_addr - 1` subtracts 1 from a `u32` return address in three places. If a call site ever had `ret_addr == 0` this would panic in debug builds (and wrap in release). In practice a return address of 0 is not expected, but the subtraction is unchecked and the same pattern is duplicated three times.","fix":"Use `call_site.ret_addr.saturating_sub(1)` or assert `ret_addr > 0` once before the loop, and factor the repeated `start: u64::from(call_site.ret_addr - 1)` computation into a single local.","locations":[{"ref":"src/debuginfo/unwind.rs:167","code":"  167 |                                 start: u64::from(call_site.ret_addr - 1),","lines":1,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/debuginfo/unwind.rs#L167"},{"ref":"src/debuginfo/unwind.rs:179","code":"  179 |                                                 start: u64::from(call_site.ret_addr - 1),","lines":1,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/debuginfo/unwind.rs#L179"},{"ref":"src/debuginfo/unwind.rs:187","code":"  187 |                                                 start: u64::from(call_site.ret_addr - 1),","lines":1,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/debuginfo/unwind.rs#L187"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"medium","description":"`(lane_idx + 1) * lane_layout.size` in `value_typed_lane` / `place_typed_lane` multiplies a `u64` lane index by a `Size`. With a maliciously or erroneously huge `lane_idx` this assertion arithmetic could overflow in release (wrapping) and silently pass the bounds assert. In practice lane indices come from validated SIMD intrinsic codegen so this is effectively unreachable with bad values, hence negligible, but the assert is a debug aid that could be defeated by overflow.","fix":"Use checked arithmetic (e.g. `checked_add`/`checked_mul`) or compare with division to avoid wraparound defeating the bounds check; or document that lane_idx is always small and trusted.","locations":[{"ref":"src/value_and_place.rs:240-242","code":"  240 |         assert!(\n  241 |             (lane_idx + 1) * lane_layout.size <= orig_lane_count * fx.layout_of(orig_lane_ty).size\n  242 |         );","lines":3,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/value_and_place.rs#L240-L242"},{"ref":"src/value_and_place.rs:740-742","code":"  740 |         assert!(\n  741 |             (lane_idx + 1) * lane_layout.size <= orig_lane_count * fx.layout_of(orig_lane_ty).size\n  742 |         );","lines":3,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/value_and_place.rs#L740-L742"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In the `UnwindAction::Terminate` cleanup arm a block param is appended to `pre_cleanup_block` (the exception pointer) but it is never read or stored into `fx.exception_slot`, unlike the `Cleanup` arm which does `fx.bcx.def_var(fx.exception_slot, exception_ptr)`. The comment even says `FIXME dedup terminate blocks`. If terminate codegen (or anything reached from it) ever needs the exception pointer it will read a stale/undefined value from the slot. Currently it appears to work only because the terminate path aborts without using the exception, but the asymmetry is fragile.","fix":"Either bind the appended param and def_var it into exception_slot for consistency with the Cleanup arm, or document explicitly why the exception pointer is intentionally ignored on the terminate path.","locations":[{"ref":"src/base.rs:932-937","code":"  932 |         | StatementKind::ConstEvalCounter\n  933 |         | StatementKind::Nop\n  934 |         | StatementKind::FakeRead(..)\n  935 |         | StatementKind::PlaceMention(..)\n  936 |         | StatementKind::BackwardIncompatibleDropHint { .. }\n  937 |         | StatementKind::AscribeUserType(..) => {}","lines":6,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/base.rs#L932-L937"},{"ref":"src/base.rs:925-931","code":"  925 |                     lval.write_cvalue_transmute(fx, operand);\n  926 |                 }\n  927 |                 Rvalue::CopyForDeref(_) => bug!(\"`CopyForDeref` in codegen\"),\n  928 |             }\n  929 |         }\n  930 |         StatementKind::StorageLive(_)\n  931 |         | StatementKind::StorageDead(_)","lines":7,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/base.rs#L925-L931"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In JIT mode the mono items from all CGUs are collected into an `FxHashMap` and then back into a `Vec`, which discards the deterministic iteration order that `items_in_deterministic_order` carefully produces. Codegen/compile order then depends on HashMap iteration order, which is nondeterministic across runs. This can cause nondeterministic JIT behavior (e.g. order-dependent symbol resolution, differing diagnostics order, or order-dependent miscompiles being hidden) and makes the JIT path inconsistent with the AOT path which preserves deterministic order. The HashMap is presumably used to dedup items appearing in multiple CGUs, but a dedup that preserves order (e.g. FxIndexSet/IndexMap or sorting afterwards) would be correct.","fix":"Use an order-preserving structure (e.g. collect into an `FxIndexMap`) or sort the resulting Vec by a deterministic key after dedup, so JIT codegen order is deterministic and matches the deterministic ordering used in AOT.","locations":[{"ref":"src/driver/jit.rs:50-57","code":"   50 |     let cgus = tcx.collect_and_partition_mono_items(()).codegen_units;\n   51 |     let mono_items = cgus\n   52 |         .iter()\n   53 |         .map(|cgu| cgu.items_in_deterministic_order(tcx).into_iter())\n   54 |         .flatten()\n   55 |         .collect::<FxHashMap<_, _>>()\n   56 |         .into_iter()\n   57 |         .collect::<Vec<(_, _)>>();","lines":8,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/driver/jit.rs#L50-L57"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`float_to_int_unchecked` lowers via `clif_int_or_float_cast`, which for out-of-range / NaN inputs uses Cranelift's saturating/rounding cast semantics rather than the intrinsic's documented instant-UB 'unchecked' truncation. This silently changes behaviour vs other backends for inputs the caller has promised are in range but that differ at the boundary (e.g. values exactly at the rounding edge). It is at least worth a FIXME; there is none here.","fix":"Confirm clif_int_or_float_cast performs a plain (non-saturating) conversion for this path, or document why saturating semantics are acceptable for the in-range-guaranteed input; add a FIXME if not verified.","locations":[{"ref":"src/intrinsics/mod.rs:1496-1508","code":" 1496 |         sym::float_to_int_unchecked => {\n 1497 |             intrinsic_args!(fx, args => (f); intrinsic);\n 1498 |             let f = f.load_scalar(fx);\n 1499 | \n 1500 |             let res = crate::cast::clif_int_or_float_cast(\n 1501 |                 fx,\n 1502 |                 f,\n 1503 |                 false,\n 1504 |                 fx.clif_type(ret.layout().ty).unwrap(),\n 1505 |                 type_sign(ret.layout().ty),\n 1506 |             );\n 1507 |             ret.write_cvalue(fx, CValue::by_val(res, ret.layout()));\n 1508 |         }","lines":13,"link":"https://github.com/rust-lang/rustc_codegen_cranelift/blob/db693f7dbcfab9af2a89b703096f692417e2f756/src/intrinsics/mod.rs#L1496-L1508"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`simd_insert` (the non-dyn arm) never checks that the base operand is a SIMD type before calling `base.layout().ty.simd_size_and_type(fx.tcx)`. Every other simd_* arm guards with report_simd_type_validation_error; the dyn variant simd_insert_dyn does guard. A non-SIMD base would ICE in simd_size_and_type instead of producing a clean error.","fix":"Add the `if !base.layout().ty.is_simd() { report_simd_type_validation_error(...) ; return; }` guard, mirroring simd_insert_dyn/simd_extract.","locations":[{"ref":"src/intrinsics/simd.rs:260-289","code":"  260 |         sym::simd_insert => {\n  261 |             let (base, idx, val) = match args {\n  262 |                 [base, idx, val] => (base, idx, val),\n  263 |                 _ => {\n  264 |                     bug!(\"wrong number of args for intrinsic {intrinsic}\");\n  265 |                 }\n  266 |             };\n  267 |             let base = codegen_operand(fx, &base.node);\n  268 |             let val = codegen_operand(fx, &val.node);\n  269 | \n  270 |             // FIXME validate\n  271 |             let idx_const = if let Some(idx_const) = idx.node.constant() {\n  272 |                 crate::constant::eval_mir_constant(fx, idx_const).0.try_to_scalar_int().unwrap()\n  273 |             } else {\n  274 |                 fx.tcx.dcx().span_fatal(span, \"Index argument for `simd_insert` is not a constant\");\n  275 |             };\n  276 | \n  277 |             let idx: u32 = idx_const.to_u32();\n  278 |             let (lane_count, _lane_ty) = base.layout().ty.simd_size_and_type(fx.tcx);\n  279 |             if u64::from(idx) >= lane_count {\n  280 |                 fx.tcx.dcx().span_fatal(\n  281 |                     fx.mir.span,\n  282 |                     format!(\"[simd_insert] idx {} >= lane_count {}\", idx, lane_count),\n  283 |                 );\n  284 |             }\n  285 |
