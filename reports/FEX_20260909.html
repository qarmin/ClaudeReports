{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"Inside `std::erase_if(BigCores, ...)` on line 337, the comment says 'Add it to the BigCore list' but the code immediately below calls `LittleCores.emplace_back(Entry)`. The comment is wrong - the entry is being added to the LittleCore list as part of the demotion.","fix":"Change the comment to 'Add it to the LittleCore list'.","locations":[{"ref":"FEXCore/Source/Interface/Core/CPUID.cpp:335-338","code":"  335 |         if (Entry->Implementer == Implementer && Entry->Part == Part) {\n  336 |           // Add it to the BigCore list\n  337 |           LittleCores.emplace_back(Entry);\n  338 |           return true;","lines":4,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/CPUID.cpp#L335-L338"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"In the Primary handler array and Primary_Constant array, two consecutive entries both have the comment '0x12'. The entry at array index 0x11 (the 18th entry after index 0x10) is labeled '0x12: Reserved?' instead of '0x11: Reserved?'. This creates a duplicate label and hides that index 0x11 (CPUID function 0x11) is the entry being reserved, not 0x12.","fix":"Change the first '0x12: Reserved?' comment (array index 0x11) to '0x11: Reserved?' in both the Primary handler array and the Primary_Constant array.","locations":[{"ref":"FEXCore/Source/Interface/Core/CPUID.h:246-249","code":"  246 |     // 0x12: Reserved?\n  247 |     &CPUIDEmu::Function_Reserved,\n  248 |     // 0x12: Intel SGX capability enumeration\n  249 |     &CPUIDEmu::Function_Reserved,","lines":4,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/CPUID.h#L246-L249"},{"ref":"FEXCore/Source/Interface/Core/CPUID.h:358-361","code":"  358 |     // 0x12: Reserved?\n  359 |     {SupportsConstant::CONSTANT, NeedsLeafConstant::NOLEAFCONSTANT},\n  360 |     // 0x12: Intel SGX capability enumeration\n  361 |     {SupportsConstant::CONSTANT, NeedsLeafConstant::NOLEAFCONSTANT},","lines":4,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/CPUID.h#L358-L361"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The comment on line 362 in the CompileSingleStep blr call reads '{ CTX, Frame, RIP }' (3 args) but the call signature is instantiated as <uintptr_t, void*, void*, uint64_t, uint64_t> (4 arguments: CTX, Frame, RIP, MaxInst). The stale comment is misleading when diagnosing call-convention issues.","fix":"Update comment to '{ CTX, Frame, RIP, MaxInst }' to match the actual arguments.","locations":[{"ref":"FEXCore/Source/Interface/Core/Dispatcher/Dispatcher.cpp:362","code":"  362 |         blr(ARMEmitter::Reg::r4); // { CTX, Frame, RIP }","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/Dispatcher/Dispatcher.cpp#L362"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"DEF_OP(TestZ) contains the assertion message 'TestNZ used at higher sizes', but the operation being implemented is TestZ, not TestNZ. The incorrect name in the diagnostic message would mislead anyone debugging an assertion failure here.","fix":"Change the assertion message to 'TestZ used at higher sizes'.","locations":[{"ref":"FEXCore/Source/Interface/Core/JIT/ALUOps.cpp:210","code":"  210 |   LOGMAN_THROW_A_FMT(IROp->Size < IR::OpSize::i32Bit, \"TestNZ used at higher sizes\");","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/JIT/ALUOps.cpp#L210"}]},
{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"In VSShrSWide (line 2884), the comment says `NOTE: SVE LSR is a destructive operation` in the middle of the arithmetic-right-shift (ASR) block. The operation being performed is ASR, not LSR.","fix":"Change the comment to reference ASR rather than LSR.","locations":[{"ref":"FEXCore/Source/Interface/Core/JIT/VectorOps.cpp:2888-2891","code":" 2888 |     if (Dst != Vector) {\n 2889 |       // NOTE: SVE LSR is a destructive operation.\n 2890 |       movprfx(Dst.Z(), Vector.Z());\n 2891 |     }","lines":4,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/JIT/VectorOps.cpp#L2888-L2891"}]},
{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"In VUShlSWide (line 2950), inside the SVE128 left-shift block, the comment says `NOTE: SVE LSR is a destructive operation` but the operation is LSL (left shift, not right shift).","fix":"Change the comment to reference LSL rather than LSR.","locations":[{"ref":"FEXCore/Source/Interface/Core/JIT/VectorOps.cpp:2954-2957","code":" 2954 |     if (Dst != Vector) {\n 2955 |       // NOTE: SVE LSR is a destructive operation.\n 2956 |       movprfx(Dst.Z(), Vector.Z());\n 2957 |     }","lines":4,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/JIT/VectorOps.cpp#L2954-L2957"}]},
{"id":"CMT_8","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"IRETOp has a comment 'eflags (lower 16 used)' on the line that calls SetPackedRFLAG(false, ...). The 'false' parameter means the full EFLAGS word is used (not just the lower 8 bits), and IRET pops the full 32-bit EFLAGS in 32-bit mode or 64-bit RFLAGS in 64-bit mode. The comment incorrectly implies only the lower 16 bits are consumed.","fix":"Change the comment to 'eflags (32-bit in protected mode, 64-bit in long mode)'.","locations":[{"ref":"FEXCore/Source/Interface/Core/OpcodeDispatcher.cpp:156-157","code":"  156 |   // eflags (lower 16 used)\n  157 |   SetPackedRFLAG(false, Pop(GPRSize, SP));","lines":2,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/OpcodeDispatcher.cpp#L156-L157"}]},
{"id":"CMT_9","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"AAAOp and AASOp both have comments claiming the false branch returns 0: 'AX = CF ? (AX + 0x106) : 0' (line 2897) and 'AX = CF ? (AX - 0x106) : 0' (line 2914). However, the actual code uses 'A' (the current AX value) as the false branch of NZCVSelect, preserving AX unchanged when CF=0. The x86 specification confirms that AX is preserved when AF=0, so the code is correct but the comments describe wrong semantics.","fix":"Change both comments to 'AX = CF ? (AX +/- 0x106) : AX' to correctly document the preserved-AX semantics.","locations":[{"ref":"FEXCore/Source/Interface/Core/OpcodeDispatcher.cpp:2856-2857","code":" 2856 |   // AX = CF ? (AX + 0x106) : 0\n 2857 |   A = NZCVSelect(OpSize::i32Bit, CondClass::UGE /* CF = 1 */, Add(OpSize::i32Bit, A, 0x106), A);","lines":2,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/OpcodeDispatcher.cpp#L2856-L2857"},{"ref":"FEXCore/Source/Interface/Core/OpcodeDispatcher.cpp:2873-2874","code":" 2873 |   // AX = CF ? (AX - 0x106) : 0\n 2874 |   A = NZCVSelect(OpSize::i32Bit, CondClass::UGE /* CF = 1 */, Sub(OpSize::i32Bit, A, 0x106), A);","lines":2,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/OpcodeDispatcher.cpp#L2873-L2874"}]},
{"id":"CMT_10","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"IDIVOp 8-bit case has the comment 'AX[15:0] = concat<URem[7:0]:UDiv[7:0]>' using 'U' (unsigned) prefixes for the result parts. Since this is IDIV (signed integer division), the quotient and remainder are signed quantities. The 'U' prefix is misleading and inconsistent - the analogous comment in DIVOp is correct because that is unsigned division.","fix":"Change the comment to 'AX[15:0] = concat<SRem[7:0]:SDiv[7:0]>' or 'AX[15:0] = concat<Rem[7:0]:Quot[7:0]>'.","locations":[{"ref":"FEXCore/Source/Interface/Core/OpcodeDispatcher.cpp:3730-3732","code":" 3730 |     // AX[15:0] = concat<URem[7:0]:UDiv[7:0]>\n 3731 |     auto ResultAX = _Bfi(GPRSize, 8, 8, Quotient, Remainder);\n 3732 |     StoreGPRRegister(X86State::REG_RAX, ResultAX, OpSize::i16Bit);","lines":3,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/OpcodeDispatcher.cpp#L3730-L3732"}]},
{"id":"CMT_11","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"Line 42 in SecondaryTables.h has the handler for opcode 0xBD (BSR - Bit Scan Reverse) but the trailing comment incorrectly says '// BSF' instead of '// BSR'. Line 41 for opcode 0xBC (BSFOp) already correctly says '// BSF'. The copy-paste error means both lines have the same comment, which is misleading to readers trying to verify the opcode-to-handler mapping.","fix":"Change the comment on line 42 from '// BSF' to '// BSR'.","locations":[{"ref":"FEXCore/Source/Interface/Core/OpcodeDispatcher/SecondaryTables.h:41-42","code":"   41 |   {0xBC, 1, &OpDispatchBuilder::BSFOp},                                                     // BSF\n   42 |   {0xBD, 1, &OpDispatchBuilder::BSROp},                                                     // BSF","lines":2,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/OpcodeDispatcher/SecondaryTables.h#L41-L42"}]},
{"id":"CMT_12","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"In DPPOpImpl, the comment block for case 0b1111 (lines 4626-4630) says the destination is\n'Result / Zero / Zero / Zero' (only element 0 gets the result). However, the x86 DPPS specification states\nthat when all DstMask bits are set, all four output elements receive the result - which is exactly what the\ncode (VDupElement/broadcast) implements. The comment is incorrect and contradicts both the spec and the\ncode, which could mislead future readers.","fix":"Correct the comment to: 'Broadcast - all four elements receive Result.'","locations":[{"ref":"FEXCore/Source/Interface/Core/OpcodeDispatcher/Vector.cpp:4635-4641","code":" 4635 |     case 0b1111:\n 4636 |       // Broadcast\n 4637 |       // Dest[31:0]   = Result\n 4638 |       // Dest[63:32]  = Zero\n 4639 |       // Dest[95:64]  = Zero\n 4640 |       // Dest[127:96] = Zero\n 4641 |       return _VDupElement(DstSize, ElementSize, Temp, 0);","lines":7,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/OpcodeDispatcher/Vector.cpp#L4635-L4641"}]},
{"id":"CMT_13","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"WritePriorityMutex comment claims 'Up to 32767 pending exclusive locks (writers)' and 'Up to 32767 pending shared_locks (readers)'. The actual limits are: WRITE_WAITER_COUNT_MASK = 0x3FFF0000 gives 16383 max writers; READ_OWNER_COUNT_MASK = 0xFFFF gives 65535 max readers. Neither limit is 32767.","fix":"Correct the comment to 'Up to 16383 pending exclusive locks (writers)' and 'Up to 65535 pending shared_locks (readers)'.","locations":[{"ref":"FEXCore/include/FEXCore/Utils/WritePriorityMutex.h:28-31","code":"   28 | // Features:\n   29 | //  - Up to 32767 pending exclusive locks (\"writers\")\n   30 | //  - Up to 32767 pending shared_locks (\"readers\")\n   31 | //  - Low-overhead waiting via WFE with a fallback to futex on timeout","lines":4,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/include/FEXCore/Utils/WritePriorityMutex.h#L28-L31"}]},
{"id":"CMT_14","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"JitSymbols.h has a typo in the comment: \"stead_clock\" instead of \"steady_clock\".","fix":"Correct \"stead_clock\" to \"steady_clock\".","locations":[{"ref":"FEXCore/Source/Common/JitSymbols.h:24","code":"   24 |   // stead_clock to ensure a monotonic increasing clock.","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Common/JitSymbols.h#L24"}]},
{"id":"CMT_15","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"In LoadConstant, the assertion error message on line 436 says the valid range is `[0, {}]` and passes `UpperBound` as the format argument (value 4 for 64-bit), but the actual assertion condition on line 435 checks `MaxBytes <= (UpperBound * 2)`, making the actual max 8. The message understates the allowed maximum by a factor of 2.","fix":"Change the format string to `[0, {}]` and pass `UpperBound * 2` as the argument, or rewrite it as `\"MaxBytes must be in [0, {}] (16-bit aligned)\", UpperBound * 2`.","locations":[{"ref":"FEXCore/Source/Interface/Core/ArchHelpers/Arm64Emitter.cpp:436-437","code":"  436 |   LOGMAN_THROW_A_FMT(MaxBytes >= 0 && MaxBytes <= (UpperBound * 2) && (MaxBytes & 1) == 0,\n  437 |                      \"MaxBytes must be bounded in the range of [0, {}] and 16-bit aligned\", UpperBound);","lines":2,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/ArchHelpers/Arm64Emitter.cpp#L436-L437"}]},
{"id":"CMT_16","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"RunXCRFunction's inner comment says 'XCR function 1 is not yet supported' but the guard is 'Function >= 1', which rejects all functions >= 1, not just function 1. The comment is misleadingly specific.","fix":"Change the comment to 'XCR functions >= 1 are not yet supported' to accurately describe the condition.","locations":[{"ref":"FEXCore/Source/Interface/Core/CPUID.h:71-73","code":"   71 |     if (Function >= 1) {\n   72 |       // XCR function 1 is not yet supported.\n   73 |       return {};","lines":3,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/CPUID.h#L71-L73"}]},
{"id":"CMT_17","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"In SecondaryGroupTables.h, GROUP 14 (opcode 0x73 with 66 prefix) has an entry for subgroup register 3 (PSRLDQ) at line 107 but is missing an entry for register 7 (PSLLDQ) in the non-66 (PF_NONE) variant. The comment header just says '// GROUP 14' with no note that PF_NONE only has registers 2 and 6 while PF_66 adds registers 3 and 7. This is architecturally correct (PSRLDQ/PSLLDQ are SSE2 66-prefixed only) but the asymmetry is undocumented and may surprise maintainers.","fix":"Add a brief comment noting that PSRLDQ (reg/3) and PSLLDQ (reg/7) only exist with the 66 prefix (SSE2); no functional change needed.","locations":[{"ref":"FEXCore/Source/Interface/Core/OpcodeDispatcher/SecondaryGroupTables.h:102-109","code":"  102 |   // GROUP 14\n  103 |   {OPD(FEXCore::X86Tables::TYPE_GROUP_14, PF_NONE, 2), 1, &OpDispatchBuilder::Bind<&OpDispatchBuilder::PSRLI, OpSize::i64Bit>},\n  104 |   {OPD(FEXCore::X86Tables::TYPE_GROUP_14, PF_NONE, 6), 1, &OpDispatchBuilder::Bind<&OpDispatchBuilder::PSLLI, OpSize::i64Bit>},\n  105 | \n  106 |   {OPD(FEXCore::X86Tables::TYPE_GROUP_14, PF_66, 2), 1, &OpDispatchBuilder::Bind<&OpDispatchBuilder::PSRLI, OpSize::i64Bit>},\n  107 |   {OPD(FEXCore::X86Tables::TYPE_GROUP_14, PF_66, 3), 1, &OpDispatchBuilder::PSRLDQ},\n  108 |   {OPD(FEXCore::X86Tables::TYPE_GROUP_14, PF_66, 6), 1, &OpDispatchBuilder::Bind<&OpDispatchBuilder::PSLLI, OpSize::i64Bit>},\n  109 |   {OPD(FEXCore::X86Tables::TYPE_GROUP_14, PF_66, 7), 1, &OpDispatchBuilder::PSLLDQ},","lines":8,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/OpcodeDispatcher/SecondaryGroupTables.h#L102-L109"}]},
{"id":"CMT_18","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"Line 865 in X87.cpp contains a misleading comment:\n\n  auto C0 = C3; // Mirror C3 until something other than zero is supported\n\nThe comment implies that distinguishing zero from other values is the only missing feature.\nIn reality, NaN, Infinity, and Denormal are all equally unclassified. The comment will\nmislead any developer who goes to implement \"the missing case\" into only adding zero\ndetection while leaving the other three cases broken.","fix":"Update the comment to accurately describe the full set of unimplemented classifications:\n// Mirror C3 - Zero, NaN, Inf, and Denormal are all unimplemented; all non-empty values\n// are returned as Normal.","locations":[{"ref":"FEXCore/Source/Interface/Core/OpcodeDispatcher/X87.cpp:874","code":"  874 |   auto C0 = C3; // Mirror C3 until something other than zero is supported","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/OpcodeDispatcher/X87.cpp#L874"}]},
{"id":"CMT_19","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"X86Tables.h line 217 contains a typo in a member comment:\n\n  // Constains the dispatcher handler pointer\n\n\"Constains\" should be \"Contains\".","fix":"Change \"Constains\" to \"Contains\".","locations":[{"ref":"FEXCore/Source/Interface/Core/X86Tables/X86Tables.h:227","code":"  227 |   // Constains the dispatcher handler pointer","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/X86Tables/X86Tables.h#L227"}]},
{"id":"CMT_20","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"In variable_length_integer.h at line 161, the comment says 'vl64 can hold a signed\n32-bit integer.' but vl64 holds a signed 64-bit integer (vl64_encoded_bits=64, uses\nint64_t Integer). The comment is a copy-paste error from the vl32 entry above it.","fix":"Change the comment to: '// vl64 can hold a signed 64-bit integer.'","locations":[{"ref":"FEXCore/Source/Utils/variable_length_integer.h:161","code":"  161 |   // vl64 can hold a signed 32-bit integer.","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Utils/variable_length_integer.h#L161"}]},
{"id":"CMT_21","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"Typo in FPState.h comment: 'The AMD manually incorrectly states' should be 'The AMD manual incorrectly states'. 'manually' (adverb) does not make sense in context; 'manual' (noun, referring to the AMD architecture manual) is the intended word.","fix":"Change 'AMD manually' to 'AMD manual'.","locations":[{"ref":"FEXCore/include/FEXCore/Utils/FPState.h:45","code":"   45 |     // The AMD manually incorrectly states there is a direct mapping here, only the intel-manual correctly states","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/include/FEXCore/Utils/FPState.h#L45"}]},
{"id":"CMT_22","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"In Config.cpp FindUserHomeThroughUID(), the comment on the third iterator increment says '// comment' but /etc/passwd format has uid at field 2 (0-indexed). The comment should say '// uid' since that advance skips the uid field. This is related to the logic error above but also constitutes a misleading standalone comment.","fix":"Change '++iter; // comment' to '++iter; // uid' to reflect which field is being skipped.","locations":[{"ref":"Source/Common/Config.cpp:554","code":"  554 |     ++iter; // comment","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Common/Config.cpp#L554"}]},
{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"medium","difficulty":"medium","description":"VAESEncOp, VAESEncLastOp, VAESDecOp, and VAESDecLastOp (Crypto.cpp lines 209-340) are structurally identical ~23-line functions differing only in which _VAES* IR op is called. This is approximately 92 lines of duplicated logic across 4 functions, and they all share the same missing SupportsAES guard bug.","fix":"Extract a shared helper template or lambda parameterised on the _VAES* op, giving a single place to also add the missing SupportsAES guard.","locations":[{"ref":"FEXCore/Source/Interface/Core/OpcodeDispatcher/Crypto.cpp:217-348","code":"  217 | void OpDispatchBuilder::VAESEncOp(OpcodeArgs) {\n  218 |   const auto DstSize = OpSizeFromDst(Op);\n  219 |   const auto Is256Bit = DstSize == OpSize::i256Bit;\n  220 | \n  221 |   Ref State = LoadSourceFPR(Op, Op->Src[0], Op->Flags);\n  222 |   Ref Key = LoadSourceFPR(Op, Op->Src[1], Op->Flags);\n  223 |   Ref ZeroVec = LoadZeroVector(DstSize);\n  224 | \n  225 |   Ref Result {};\n  226 |   if (Is256Bit) {\n  227 |     // TODO: Handle as one operation once vixl supports it.\n  228 |     auto UpperState = _VDupElement(DstSize, OpSize::i128Bit, State, 1);\n  229 |     auto UpperKey = _VDupElement(DstSize, OpSize::i128Bit, Key, 1);\n  230 | \n  231 |     auto Lower = _VAESEnc(OpSize::i128Bit, State, Key, ZeroVec);\n  232 |     auto Upper = _VAESEnc(OpSize::i128Bit, UpperState, UpperKey, ZeroVec);\n  233 | \n  234 |     Result = _VInsElement(DstSize, OpSize::i128Bit, 1, 0, Lower, Upper);\n  235 |   } else {\n  236 |     Result = _VAESEnc(DstSize, State, Key, ZeroVec);\n  237 |   }\n  238 | \n  239 |   StoreResultFPR(Op, Result);\n  240 | }\n  241 | \n  242 | void OpDispatchBuilder::AESEncLastOp(OpcodeArgs) {\n  243 |   if (!CTX->HostFeatures.SupportsAES) {\n  244 |     UnimplementedOp(Op);\n  245 |     return;\n  246 |   }\n  247 |   Ref Dest = LoadSourceFPR(Op, Op->Dest, Op->Flags);\n  248 |   Ref {"id":"DUP_4","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"The VFMLS (lines 4418-4433) and VFNMLS (lines 4578-4593) SVE128 fallback branches are structurally identical: both acquire the 16B merging predicate, both set up DestTmp (using the same aliasing logic), both call `mov(DestTmp.Z(), VectorAddend.Z())`, and both call either `fnmls` or `fnmla` respectively, followed by the same conditional `mov(Dst.Z(), DestTmp.Z())`. This pattern of approximately 15 lines is duplicated verbatim, differing only in the SVE FMA instruction name.","fix":"Extract the SVE128 FMA accumulator setup into a helper (similar to how VFScalarFMAOperation is used for scalar operations) that takes the FMA instruction as a callable, reducing duplication.","locations":[{"ref":"FEXCore/Source/Interface/Core/JIT/VectorOps.cpp:4418-4433","code":" 4418 |   } else if (HostSupportsSVE128 && Is128Bit) {\n 4419 |     const auto Mask = PRED_TMP_16B.Merging();\n 4420 |     ARMEmitter::VRegister DestTmp = Dst;\n 4421 |     if (Dst != VectorAddend) {\n 4422 |       if (Dst != Vector1 && Dst != Vector2) {\n 4423 |         DestTmp = Dst;\n 4424 |       } else {\n 4425 |         DestTmp = VTMP1;\n 4426 |       }\n 4427 |       mov(DestTmp.Z(), VectorAddend.Z());\n 4428 |     }\n 4429 | \n 4430 |     fnmls(SubRegSize, DestTmp.Z(), Mask, Vector1.Z(), Vector2.Z());\n 4431 |     if (Dst != DestTmp) {\n 4432 |       mov(Dst.Z(), DestTmp.Z());\n 4433 |     }","lines":16,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/JIT/VectorOps.cpp#L4418-L4433"},{"ref":"FEXCore/Source/Interface/Core/JIT/VectorOps.cpp:4574-4589","code":" 4574 |   } else if (HostSupportsSVE128 && Is128Bit) {\n 4575 |     const auto Mask = PRED_TMP_16B.Merging();\n 4576 |     ARMEmitter::VRegister DestTmp = Dst;\n 4577 |     if (Dst != VectorAddend) {\n 4578 |       if (Dst != Vector1 && Dst != Vector2) {\n 4579 | {"id":"DUP_5","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"The bodies of CalculateFlags_ShiftRightImmediate and CalculateFlags_ShiftRightDoubleImmediate are nearly identical: both call CalculateFlags_ShiftRightImmediateCommon (which computes NZ, CF, PF, AF) and then both have a 'Shift == 1' block that computes OF. The only difference in the OF block is what value is XOR'd: ShiftRightImmediate uses Src1 directly (MSB of original), while ShiftRightDoubleImmediate XORs Src1 with Res first (tests if MSB changed). Both share the same overall structure and comment block (lines 509-516 vs 528-537). While the semantic difference is intentional, the structural duplication of the guard, the comment explaining the semantics, and the SetRFLAG call creates maintenance risk if the common structure ever needs changing.","fix":"No immediate change needed; the semantic difference justifies separate functions. Consider adding a brief comment to each function noting why they cannot be merged, to prevent future confusion.","locations":[{"ref":"FEXCore/Source/Interface/Core/OpcodeDispatcher/Flags.cpp:505-521","code":"  505 | void OpDispatchBuilder::CalculateFlags_ShiftRightImmediate(IR::OpSize SrcSize, Ref Res, Ref Src1, uint64_t Shift) {\n  506 |   // No flags changed if shift is zero\n  507 |   if (Shift == 0) {\n  508 |     return;\n  509 |   }\n  510 | \n  511 |   CalculateFlags_ShiftRightImmediateCommon(SrcSize, Res, Src1, Shift);\n  512 | \n  513 |   // OF\n  514 |   {\n  515 |     // Only defined when Shift is 1 else undefined\n  516 |     // Is set to the MSB of the original value\n  517 |     if (Shift == 1) {\n  518 |       SetRFLAG<FEXCore::X86State::RFLAG_OF_RAW_LOC>(Src1, IR::OpSizeAsBits(SrcSize) - 1, true);\n  519 |     }\n  520 |   }\n  521 | }","lines":17,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/OpcodeDispatcher/Flags.cpp#L505-L521"},{"ref":"FEXCore/Source/Interface/Core/OpcodeDispatcher/Flags.cpp:523-542","code":"  523 | void OpDispatchBuilder::CalculateFlags_ShiftRightDoubleImmediate(IR::OpSize SrcSize, Ref Res, Ref Src1, uint64_t Shift) {\n  524 |   // No flags changed if shift is zero\n  525 |   if (Shift == 0) {\n  526 |     return;\n  527 |   }\n  528 | \n  529 |   const auto OpSize = SrcSize == OpSize::i64Bit ? OpSize::i64Bit : OpSize::i32Bit;\n  530 |   CalculateFlags_ShiftRightImmediateCommon(SrcSize, Res, Src1, Shift);\n  531 | \n  532 |   // OF\n  533 |   {\n  534 |     // Only defined when Shift is 1 else undefined\n  535 |     // Is set if the MSB bit changes.\n  536 |     // XOR of Result and Src1\n  537 |     if (Shift == 1) {\n  538 |       auto val = _Xor(OpSize, Src1, Res);\n  539 |       SetRFLAG<FEXCore::X86State::RFLAG_OF_RAW_LOC>(val, IR::OpSizeAsBits(SrcSize) - 1, true);\n  540 |     }\n  541 |   }\n  542 | }","lines":20,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/OpcodeDispatcher/Flags.cpp#L523-L542"}]},

eationMutex);\n  890 |   InvalidationTracker->InvalidateAlignedInterval(reinterpret_cast<uint64_t>(Address), static_cast<uint64_t>(Size), false);\n  891 | }","lines":8,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Windows/ARM64EC/Module.cpp#L884-L891"}]},
{"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"medium","difficulty":"medium","description":"Arm64_stubs.cpp line 15 declares HandleUnalignedAccess with 4 parameters (missing the\n'bool IsJIT' parameter that the real implementation in Arm64.cpp has at line 1932). This\nis a signature mismatch between the stub and the real function. Any code that calls\nHandleUnalignedAccess passing IsJIT=true on a non-ARM64 build will silently pass the\nbool as a garbage value or hit a link error, depending on how the stub is compiled and\nlinked. The stub body calls ERROR_AND_DIE_FMT, so the missing parameter isn't functional,\nbut the mismatch is a maintenance hazard.","fix":"Add the missing 'bool IsJIT' parameter to the stub declaration so the signature matches the real implementation: HandleUnalignedAccess(FEXCore::Core::InternalThreadState* Thread, UnalignedHandlerType HandleType, uintptr_t ProgramCounter, uint64_t* GPRs, bool IsJIT)","locations":[{"ref":"FEXCore/Source/Utils/ArchHelpers/Arm64_stubs.cpp:14-17","code":"   14 | std::optional<int32_t>\n   15 | HandleUnalignedAccess(FEXCore::Core::InternalThreadState* Thread, UnalignedHandlerType HandleType, uintptr_t ProgramCounter, uint64_t* GPRs) {\n   16 |   ERROR_AND_DIE_FMT(\"HandleAtomicMemOp Not Implemented\");\n   17 | }","lines":4,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Utils/ArchHelpers/Arm64_stubs.cpp#L14-L17"},{"ref":"FEXCore/Source/Utils/ArchHelpers/Arm64.cpp:1931-1933","code":" 1931 | [[nodiscard]]\n 1932 | std::optional<int32_t> HandleUnalignedAccess(FEXCore::Core::InternalThreadState* Thread, UnalignedHandlerType HandleType,\n 1933 |                                              uintptr_t ProgramCounter, uint64_t* GPRs, bool IsJIT) {","lines":3,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Utils/ArchHelpers/Arm64.cpp#L1931-L1933"}]},
{"id":"OTHER_1","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"DEFAULT_USER_PERMS in File.h is S_IRWXU | S_IRWXG | S_IRWXO (octal 0777), which includes execute permission for all users. After applying a typical umask of 022, newly created config files and log files get permissions 0755 (rwxr-xr-x), meaning the owner, group, and others can execute them. For data files such as telemetry records and config files, the execute bit is inappropriate and may be flagged by security auditing tools.","fix":"Change DEFAULT_USER_PERMS to S_IRUSR | S_IWUSR | S_IRGRP | S_IROTH (0644) so that newly created files are readable but not executable.","locations":[{"ref":"FEXCore/include/FEXCore/Utils/File.h:370","code":"  370 |   static constexpr int DEFAULT_USER_PERMS = S_IRWXU | S_IRWXG | S_IRWXO;","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/include/FEXCore/Utils/File.h#L370"}]},

<script>
(function(){
'use strict';

// Data
const FINDINGS     = JSON.parse(document.getElementById('D').textContent);
const PROJECT_INFO = JSON.parse(document.getElementById('PI').textContent);
const SEVS     = ['critical','high','medium','low','negligible'];
const STATUSES = ['open','fixed','wont-fix','false-positive'];
const ALL_TYPES = [...new Set(FINDINGS.map(f => f.type))].sort();
// Build lookup map for O(1) access
const FINDING_BY_ID = new Map(FINDINGS.map(f => [f.id, f]));
// Only severities actually present in the report — the filter bar hides the rest.
const PRESENT_SEVS = SEVS.filter(s => FINDINGS.some(f => (f.severity || 'medium') === s));
// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};
const PRESENT_DIFFS = DIFFICULTY_ORDER.filter(d => FINDINGS.some(f => f.difficulty === d));
const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', searchScope: 'all', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),
};
const statuses = {};

// Persistence
function loadStatuses() {
  try { Object.assign(statuses, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}
}
function saveStatuses() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    if (S.searchScope !== 'all') p.set('qs', S.searchScope);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('qs'))  { S.searchScope = p.get('qs'); }
  document.getElementById('search-scope').classList.toggle('active', S.searchScope === 'locations');
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build a [project] header block from embedded PROJECT_INFO, so the exported
// findings.toml is self-contained (doesn't depend on a sibling project-info.toml
// that a second, separately-triggered download could silently fail to save).
// '' when there is no project info at all.
function buildProjectToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = PROJECT_INFO || {};
  if (!Object.keys(pi).length) return '';
  const lines = ['[project]'];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n\n';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return buildProjectToml() + chunks.join('\n\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystacks per finding (cleared on full re-render).
// Two variants: everything (default), and file/folder paths only - for when a
// search term (e.g. a directory name like 'dlls/abc') also happens to appear
// inside description/fix prose and you only want path matches.
const _hay = new Map();
const _hayLoc = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}
function hayLocOf(f) {
  if (!_hayLoc.has(f.id)) {
    _hayLoc.set(f.id, f.locations.map(l => l.ref).join(' ').toLowerCase());
  }
  return _hayLoc.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (S.searchScope === 'locations') {
      if (!hayLocOf(f).includes(q)) return false;
    } else if (!hayOf(f).includes(q) && !st.includes(q)) {
      return false;
    }
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  _hayLoc.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    // Single download (was two) - a second auto-triggered download is commonly
    // blocked by the browser unless the user explicitly allows it, which silently
    // drops project-info.toml. Embedding [project] in findings.toml itself avoids
    // that failure mode entirely.
    downloadText(buildFindingsToml(), 'findings.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});
document.getElementById('search-scope').addEventListener('click', e => {
  S.searchScope = S.searchScope === 'locations' ? 'all' : 'locations';
  e.currentTarget.classList.toggle('active', S.searchScope === 'locations');
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
