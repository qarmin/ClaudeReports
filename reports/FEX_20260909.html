{"id":"LOGIC_159","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In ImageTracker.cpp LoadImageVolatileMetadata (line 53), the bounds check for\nVolatileMetadataPointer is:\n  `LoadConfig->VolatileMetadataPointer + sizeof(IMAGE_VOLATILE_METADATA) >= EndAddress`\nThis should use `>` not `>=` to allow the metadata struct to sit exactly at\nEndAddress - sizeof(...), otherwise a valid metadata struct at the last possible\nposition in the image would be incorrectly rejected.","fix":"Change `>=` to `>` in the bounds check.","locations":[{"ref":"Source/Windows/Common/ImageTracker.cpp:53","code":"   53 |   if (LoadConfig->VolatileMetadataPointer < Address || LoadConfig->VolatileMetadataPointer + sizeof(IMAGE_VOLATILE_METADATA) >= EndAddress) {","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Windows/Common/ImageTracker.cpp#L53"}]},
{"id":"LOGIC_160","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In InvalidationTracker.cpp DetectMonoBackpatcherBlock (line 281), the xchg\ndetection uses OR instead of AND:\n  `*reinterpret_cast<uint8_t*>(RIP) != XChgOp && *reinterpret_cast<uint8_t*>(RIP + 1) != XChgOp`\nThis returns early (no detection) only if BOTH bytes are not XChgOp. The intent\nis to check if EITHER byte is XChgOp (the instruction at RIP or the byte after\nit), i.e. the condition should use `&&` to skip, and `||` would detect either.\nWith `&&`, the function only skips if neither byte matches, meaning it proceeds\nto detect Mono's backpatcher if either byte is 0x87. But the comment and logic\nsuggest that the intent is to check at least one byte is an xchg opcode, so\nthe `&&` means \"skip if neither byte is xchg\" which is the inverse of what\nyou'd want. If neither byte is xchg, the block is not a Mono backpatcher and\nwe should skip. With the current `&&`, we skip only when both are non-xchg,\nwhich is correct. So the logic is actually right, but the comment \"if not xchg\nat RIP or RIP+1, skip\" is confusingly written. However, if the intent was to\nrequire xchg at both positions (a tighter check), then `||` should be used\nfor the not-equal comparisons.","fix":"Clarify intent. If either byte matching is sufficient (loose check), the\ncondition is correct. If both bytes must be xchg (tight check), change `&&`\nto `||`:\n  if (*reinterpret_cast<uint8_t*>(RIP) != XChgOp || *reinterpret_cast<uint8_t*>(RIP + 1) != XChgOp)","locations":[{"ref":"Source/Windows/Common/InvalidationTracker.cpp:281","code":"  281 |   if (*reinterpret_cast<uint8_t*>(RIP) != XChgOp && *reinterpret_cast<uint8_t*>(RIP + 1) != XChgOp) {","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Windows/Common/InvalidationTracker.cpp#L281"}]},
{"id":"LOGIC_161","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In Logging.cpp Init (line 44), if WineDbgOut is null (not running under Wine),\na log file path is constructed using `getenv(\"LOCALAPPDATA\")`. If LOCALAPPDATA\nis not set (e.g. on a minimal environment), getenv returns nullptr and\nfmt::format will format a null pointer, resulting in undefined behavior or a\ncrash/null-string output.","fix":"Check that getenv(\"LOCALAPPDATA\") is non-null before using it. Fall back to\na default path or skip logging if the variable is absent.","locations":[{"ref":"Source/Windows/Common/Logging.cpp:44","code":"   44 |     const auto Path = fextl::fmt::format(\"{}\\\\fex-{}.log\", getenv(\"LOCALAPPDATA\"), GetCurrentProcessId());","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Windows/Common/Logging.cpp#L44"}]},
{"id":"LOGIC_162","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In SHMStats.cpp FrontendAllocateSlots (line 16-25), the early-return guard\n`if (CurrentSize == MAX_STATS_SIZE)` compares uint32_t values. However,\nCurrentSize is only updated in the constructor and never written back from\nFrontendAllocateSlots. The result of AllocateSHMSlots is returned as the new\nsize (line 25), but the caller (base class StatAllocBase::AllocateSlot) must\nupdate CurrentSize. If it does not, or if it updates it differently, the guard\nwill never trigger after the first successful allocation, as CurrentSize remains\nat the initial mapped size. This is a logic gap whose safety depends entirely\non the base class implementation.","fix":"Verify that StatAllocBase::AllocateSlot updates CurrentSize with the value\nreturned by FrontendAllocateSlots, and that the sentinel MAX_STATS_SIZE check\nworks correctly once CurrentSize is updated.","locations":[{"ref":"Source/Windows/Common/SHMStats.cpp:16-26","code":"   16 | uint32_t StatAlloc::FrontendAllocateSlots(uint32_t NewSize) {\n   17 |   if (CurrentSize == MAX_STATS_SIZE) {\n   18 |     LogMan::Msg::DFmt(\"Ran out of slots. Can't allocate more\");\n   19 |     return CurrentSize;\n   20 |   }\n   21 | \n   22 |   auto Result = UnixLib::AllocateSHMSlots(Base, std::min(NewSize, MAX_STATS_SIZE), MAX_STATS_SIZE);\n   23 | \n   24 |   // Return the new size allocated, if it happened to change.\n   25 |   return Result.MappedSize;\n   26 | }","lines":11,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Windows/Common/SHMStats.cpp#L16-L26"}]},
{"id":"LOGIC_163","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In WinAPI/Misc.cpp RegGetValueA (line 169), the null check `if (pvData)` is\ndone before checking `pcbData` for null. However, `*pcbData` is dereferenced\nunconditionally on line 169 (`if (*pcbData < Data.Info.DataLength)`). If the\ncaller passes pvData non-null but pcbData null, this is a null pointer\ndereference. The Win32 API contract requires pcbData to be non-null when pvData\nis non-null, but the wrapper does not enforce this.","fix":"Add `if (!pcbData) return ERROR_INVALID_PARAMETER;` before the pvData block, or guard the *pcbData dereference.","locations":[{"ref":"Source/Windows/Common/WinAPI/Misc.cpp:168-172","code":"  168 |   if (pvData) {\n  169 |     if (*pcbData < Data.Info.DataLength) {\n  170 |       *pcbData = Data.Info.DataLength;\n  171 |       return ERROR_MORE_DATA;\n  172 |     }","lines":5,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Windows/Common/WinAPI/Misc.cpp#L168-L172"}]},
{"id":"LOGIC_164","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In Module.cpp BTCpuThreadTerm(), 'delete GetFrontendThreadData(ThreadState)' is called to free FrontendPtr (line 670), but TLS.ThreadState() may still be read from TLS after this point (line 668 already captured ThreadState, but TLS itself still has a dangling FrontendPtr). More importantly, 'FrontendPtr' in FEXCore::Core::InternalThreadState is set to the FrontendThreadData* but is never nulled after deletion. If any code path calls GetFrontendThreadData() on a terminated thread it will receive a freed pointer.","fix":"Set ThreadState->FrontendPtr = nullptr after deleting the FrontendThreadData, before calling CTX->DestroyThread.","locations":[{"ref":"Source/Windows/WOW64/Module.cpp:686","code":"  686 |   delete GetFrontendThreadData(ThreadState);","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Windows/WOW64/Module.cpp#L686"}]},
{"id":"LOGIC_165","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`ThunkedFunction::GetOriginalFunctionName` asserts `function_name.length() > suffix.size()` (strictly greater) but the original function name may legitimately have the same length as `\"_internal\"` (9 chars), for instance a 9-character function name truncated by the suffix would give length 18 > 9, so the assert itself is vacuously fine for most cases.\nHowever the second assert constructs a `string_view` from `&*function_name.end() - suffix.size()` which is valid only if `function_name.length() >= suffix.size()`.\nIf somehow `function_name` is shorter (e.g. empty), `function_name.end() - 9` underflows past `begin()`, causing undefined behavior before the assert fires.","fix":"Change the first assert to `function_name.length() >= suffix.size()` and add a bounds check, or use `ends_with` (C++20): `assert(function_name.ends_with(suffix))`.","locations":[{"ref":"ThunkLibs/Generator/analysis.h:52-57","code":"   52 |   std::string GetOriginalFunctionName() const {\n   53 |     const std::string suffix = \"_internal\";\n   54 |     assert(function_name.length() > suffix.size());\n   55 |     assert((std::string_view {&*function_name.end() - suffix.size(), suffix.size()} == suffix));\n   56 |     return function_name.substr(0, function_name.size() - suffix.size());\n   57 |   }","lines":6,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/Generator/analysis.h#L52-L57"}]},
{"id":"LOGIC_166","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`AllocateHostTrampolineForGuestFunction` in `Guest.h` (line 183) returns `0` (integer zero) when `GuestTarget` is null, but the return type is `Target*` (a pointer).\nReturning integer `0` instead of `nullptr` compiles fine but is stylistically incorrect and may trigger warnings with strict compilers; more importantly the cast from int to pointer is implementation-defined on platforms where `nullptr` is not represented as all-zero bits.","fix":"Return `nullptr` instead of `0`.","locations":[{"ref":"ThunkLibs/include/common/Guest.h:174-176","code":"  174 |   if (!GuestTarget) {\n  175 |     return 0;\n  176 |   }","lines":3,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/include/common/Guest.h#L174-L176"}]},
{"id":"LOGIC_167","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`GuestWrapperForHostFunction::Call` in `Host.h` reads the callback pointer from a hard-coded set of `PackedArguments` member names (`args->a0`, `args->a1`, ...) indexed by `CBIndex = sizeof...(GuestArgs)`.\nThe static_assert only permits `CBIndex <= 18 || CBIndex == 23`.\nA thunk with exactly 19-22 arguments (a legitimate scenario for complex APIs) would compile but `cb` would be left uninitialized (undefined behavior), causing a crash or worse when calling `callback`.","fix":"Add missing cases for CBIndex 19-22, or use a fold-expression / index-sequence approach to read the argument generically instead of a manual if-constexpr chain.","locations":[{"ref":"ThunkLibs/include/common/Host.h:580-622","code":"  580 |     uintptr_t cb;\n  581 |     static_assert(CBIndex <= 18 || CBIndex == 23);\n  582 |     if constexpr (CBIndex == 0) {\n  583 |       cb = args->a0;\n  584 |     } else if constexpr (CBIndex == 1) {\n  585 |       cb = args->a1;\n  586 |     } else if constexpr (CBIndex == 2) {\n  587 |       cb = args->a2;\n  588 |     } else if constexpr (CBIndex == 3) {\n  589 |       cb = args->a3;\n  590 |     } else if constexpr (CBIndex == 4) {\n  591 |       cb = args->a4;\n  592 |     } else if constexpr (CBIndex == 5) {\n  593 |       cb = args->a5;\n  594 |     } else if constexpr (CBIndex == 6) {\n  595 |       cb = args->a6;\n  596 |     } else if constexpr (CBIndex == 7) {\n  597 |       cb = args->a7;\n  598 |     } else if constexpr (CBIndex == 8) {\n  599 |       cb = args->a8;\n  600 |     } else if constexpr (CBIndex == 9) {\n  601 |       cb = args->a9;\n  602 |     } else if constexpr (CBIndex == 10) {\n  603 |       cb = args->a10;\n  604 |     } else if constexpr (CBIndex == 11) {\n  605 |       cb = args->a11;\n  606 |     } else if constexpr (CBIndex == 12) {\n  607 |       cb = args->a12;\n  608 |     } else if constexpr (CBIndex == 13) {\n  609 |       cb = args->a13;\n  610 |     } else if constexpr (CBIndex == 14) {\n  611 |       cb = args->a14;\n  612 |     } else if constexpr (CBIndex == 15) {\n  613 |       cb = args->a15;\n  614 |     } else if constexpr (CBIndex == 16) {\n  615 |       cb = args->a16;\n  616 |     } else if constexpr (CBIndex == 17) {\n  617 |       cb = args->a17;\n  618 |     } else if constexpr (CBIndex == 18) {\n  619 |       cb = args->a18;\n  620 |     } else if constexpr (CBIndex == 23) {\n  621 |       cb = args->a23;\n  622 |     }","lines":43,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/include/common/Host.h#L580-L622"}]},
{"id":"LOGIC_168","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `X11Manager::GuestToHostConnection`, `ptr_xcb_connect` and `ptr_xcb_connection_has_error` are `static` function pointer variables loaded lazily from `libxcb` via `dlsym`.\nIf `dlopen(\"libxcb.so.1\", ...)` fails (returns `nullptr`), `dlsym(nullptr, ...)` is called, which on Linux queries the global symbol table instead of a specific library - this may find a different version of `xcb_connect` or succeed silently while `libxcb` is actually unavailable.\nThere is no null check on `libxcb` before using it.","fix":"Add `if (!libxcb) { fprintf(stderr, \"ERROR: Could not open libxcb.so.1\\n\"); std::abort(); }` after the `dlopen` call.","locations":[{"ref":"ThunkLibs/include/common/X11Manager.h:37-43","code":"   37 |       static void* libxcb = dlopen(\"libxcb.so.1\", RTLD_LAZY);\n   38 |       static auto ptr_xcb_connect = (decltype(&xcb_connect))dlsym(libxcb, \"xcb_connect\");\n   39 |       static auto ptr_xcb_connection_has_error = (decltype(&xcb_connection_has_error))dlsym(libxcb, \"xcb_connection_has_error\");\n   40 |       it->second = ptr_xcb_connect(nullptr, nullptr);\n   41 |       if (ptr_xcb_connection_has_error(it->second)) {\n   42 |         fprintf(stderr, \"ERROR: Could not open xcb connection\\n\");\n   43 |         std::abort();","lines":7,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/include/common/X11Manager.h#L37-L43"}]},
{"id":"LOGIC_169","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `X11Manager::GuestToHostDisplay`, `GuestXSync` is called before acquiring `mutex` (line 54), but `GuestXSync` is a function pointer that may be `nullptr` (it is declared without an initializer and defaults to `nullptr`).\nIf any caller reaches this function before setting `GuestXSync`, dereferencing the null pointer will crash.\nThere is no null check or guard.","fix":"Check `if (GuestXSync)` before calling it, or assert that it is non-null at the site where the X11Manager is constructed.","locations":[{"ref":"ThunkLibs/include/common/X11Manager.h:54","code":"   54 |     GuestXSync(GuestDisplay, 0);","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/include/common/X11Manager.h#L54"}]},
{"id":"LOGIC_170","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In glXGetSelectedEvent and glXGetSelectedEventSGIX (IS_32BIT_THUNK path), the host retrieves the mask into an unsigned long (64 bits on x86-64), then silently truncates it to uint32_t via assignment. While current GLX event mask values fit in 32 bits, this is an implicit narrowing conversion that may silently lose bits if future extensions define higher mask values.","fix":"Add a range assertion: assert(HostMask <= UINT32_MAX); before the assignment, or use static_cast<uint32_t>(HostMask) to make the narrowing explicit.","locations":[{"ref":"ThunkLibs/libGL/libGL_Host.cpp:462-471","code":"  462 | void fexfn_impl_libGL_glXGetSelectedEvent(Display* Display, GLXDrawable Drawable, guest_layout<uint32_t*> Mask) {\n  463 |   unsigned long HostMask;\n  464 |   fexldr_ptr_libGL_glXGetSelectedEvent(Display, Drawable, &HostMask);\n  465 |   *Mask.get_pointer() = HostMask;\n  466 | }\n  467 | void fexfn_impl_libGL_glXGetSelectedEventSGIX(Display* Display, GLXDrawable Drawable, guest_layout<uint32_t*> Mask) {\n  468 |   unsigned long HostMask;\n  469 |   fexldr_ptr_libGL_glXGetSelectedEventSGIX(Display, Drawable, &HostMask);\n  470 |   *Mask.get_pointer() = HostMask;\n  471 | }","lines":10,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/libGL/libGL_Host.cpp#L462-L471"}]},
{"id":"LOGIC_171","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In the 32-bit thunk, fexfn_impl_libGL_glXGetSelectedEvent and fexfn_impl_libGL_glXGetSelectedEventSGIX declare their Mask parameter as guest_layout<uint32_t*> (line 462, 467). However, the corresponding interface annotation (libGL_interface.cpp:246, 150) is fex_gen_param<..., unsigned long*> : fexgen::ptr_passthrough, meaning the generated thunk will pass the pointer as guest_layout<unsigned long>* to the custom impl. On a 32-bit guest, unsigned long is 4 bytes (same as uint32_t), so the layout is identical and there is no real misread, but the declared parameter type is technically inconsistent with what the generated dispatch layer passes in.","fix":"Change the parameter type in both custom impls from guest_layout<uint32_t*> to guest_layout<unsigned long*> to match the interface annotation. No functional change on 32-bit, but removes the type inconsistency.","locations":[{"ref":"ThunkLibs/libGL/libGL_Host.cpp:462-470","code":"  462 | void fexfn_impl_libGL_glXGetSelectedEvent(Display* Display, GLXDrawable Drawable, guest_layout<uint32_t*> Mask) {\n  463 |   unsigned long HostMask;\n  464 |   fexldr_ptr_libGL_glXGetSelectedEvent(Display, Drawable, &HostMask);\n  465 |   *Mask.get_pointer() = HostMask;\n  466 | }\n  467 | void fexfn_impl_libGL_glXGetSelectedEventSGIX(Display* Display, GLXDrawable Drawable, guest_layout<uint32_t*> Mask) {\n  468 |   unsigned long HostMask;\n  469 |   fexldr_ptr_libGL_glXGetSelectedEventSGIX(Display, Drawable, &HostMask);\n  470 |   *Mask.get_pointer() = HostMask;","lines":9,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/libGL/libGL_Host.cpp#L462-L470"},{"ref":"ThunkLibs/libGL/libGL_interface.cpp:244-246","code":"  244 | struct fex_gen_config<glXGetSelectedEvent> : fexgen::custom_host_impl {};\n  245 | template<>\n  246 | struct fex_gen_param<glXGetSelectedEvent, 2, unsigned long*> : fexgen::ptr_passthrough {};","lines":3,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/libGL/libGL_interface.cpp#L244-L246"},{"ref":"ThunkLibs/libGL/libGL_interface.cpp:148-150","code":"  148 | struct fex_gen_config<glXGetSelectedEventSGIX> : fexgen::custom_host_impl {};\n  149 | template<>\n  150 | struct fex_gen_param<glXGetSelectedEventSGIX, 2, unsigned long*> : fexgen::ptr_passthrough {};","lines":3,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/libGL/libGL_interface.cpp#L148-L150"}]},
{"id":"LOGIC_172","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"WARN_ONCE_FMT macro has a trailing semicolon after `while (0)` inside the macro body (line 145). This means any use like `WARN_ONCE_FMT(\"...\");` produces `do {...} while(0);;` - a redundant empty statement. While harmless in practice (compilers accept it), it is a style inconsistency with ERROR_AND_DIE_FMT which lacks the trailing semicolon.","fix":"Remove the trailing semicolon after `while (0)` in WARN_ONCE_FMT.","locations":[{"ref":"FEXCore/include/FEXCore/Utils/LogManager.h:138-145","code":"  138 | #define WARN_ONCE_FMT(...)            \\\n  139 |   do {                                \\\n  140 |     static bool Warned {};            \\\n  141 |     if (!Warned) {                    \\\n  142 |       LogMan::Msg::DFmt(__VA_ARGS__); \\\n  143 |       Warned = true;                  \\\n  144 |     }                                 \\\n  145 |   } while (0);","lines":8,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/include/FEXCore/Utils/LogManager.h#L138-L145"}]},
{"id":"LOGIC_173","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"glXEnumerateVideoDevicesNV returns a pointer to an array that must be freed by the caller with XFree, but it is registered without a custom_host_impl in the interface. The TODO comment in the interface acknowledges this. Without a custom implementation similar to glXGetFBConfigs, the returned host pointer would be exposed directly to the guest, causing a dangling host pointer in the guest address space.","fix":"Implement a custom host impl for glXEnumerateVideoDevicesNV that relocates the result to the guest heap via RelocateArrayToGuestHeap, similar to fexfn_impl_libGL_glXGetFBConfigs.","locations":[{"ref":"ThunkLibs/libGL/libGL_interface.cpp:6446","code":" 6446 | struct fex_gen_config<glXEnumerateVideoDevicesNV> {}; // TODO: Custom host impl","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/libGL/libGL_interface.cpp#L6446"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"medium","description":"Seven _2-suffix ASIMD instructions (xtn2, sqxtn2, fcvtn2, fcvtl2, sqxtun2, uqxtn2, fcvtxn2) are architecturally 128-bit-only - they operate on the upper half of a 128-bit register and require QReg operands. In ASIMD_Tests.cpp each of these has a QReg test block immediately followed by a DReg test block whose expected disassembly strings are identical copy-pastes from the QReg block. The DReg tests therefore provide zero additional coverage and silently accept wrong emitter behavior.","fix":"Remove the duplicated DReg test blocks entirely, or replace them with static_assert / compile-error checks that DReg overloads do not exist for these instructions.","locations":[{"ref":"FEXCore/unittests/Emitter/ASIMD_Tests.cpp:487-494","code":"  487 |   TEST_SINGLE(xtn2(SubRegSize::i8Bit, QReg::q30, QReg::q29), \"xtn2 v30.16b, v29.8h\");\n  488 |   TEST_SINGLE(xtn2(SubRegSize::i16Bit, QReg::q30, QReg::q29), \"xtn2 v30.8h, v29.4s\");\n  489 |   TEST_SINGLE(xtn2(SubRegSize::i32Bit, QReg::q30, QReg::q29), \"xtn2 v30.4s, v29.2d\");\n  490 |   // TEST_SINGLE(xtn2(SubRegSize::i64Bit, QReg::q30, QReg::q29), \"xtn2 v30.2d, v29.1d\");\n  491 | \n  492 |   TEST_SINGLE(xtn2(SubRegSize::i8Bit, DReg::d30, DReg::d29), \"xtn2 v30.16b, v29.8h\");\n  493 |   TEST_SINGLE(xtn2(SubRegSize::i16Bit, DReg::d30, DReg::d29), \"xtn2 v30.8h, v29.4s\");\n  494 |   TEST_SINGLE(xtn2(SubRegSize::i32Bit, DReg::d30, DReg::d29), \"xtn2 v30.4s, v29.2d\");","lines":8,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/unittests/Emitter/ASIMD_Tests.cpp#L487-L494"},{"ref":"FEXCore/unittests/Emitter/ASIMD_Tests.cpp:507-514","code":"  507 |   TEST_SINGLE(sqxtn2(SubRegSize::i8Bit, QReg::q30, QReg::q29), \"sqxtn2 v30.16b, v29.8h\");\n  508 |   TEST_SINGLE(sqxtn2(SubRegSize::i16Bit, QReg::q30, QReg::q29), \"sqxtn2 v30.8h, v29.4s\");\n  509 |   TEST_SINGLE(sqxtn2(Sub {"id":"CPY_6","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"In the 'SVE load and broadcast quadword (scalar plus scalar)' test case, every instruction (ld1rqb, ld1rob, ld1rqh, ld1roh, ld1rqw, ld1row, ld1rqd, ld1rod) is tested twice with identical arguments (ZReg::z30, PReg::p6.Zeroing(), Reg::r29, Reg::r30) and identical expected strings. Each instruction appears twice consecutively with no variation.","fix":"Remove the duplicate second TEST_SINGLE call for each instruction. If boundary/register-variation coverage is desired, replace the duplicate with a call using different register operands (e.g., z0 instead of z30, r28 instead of r30).","locations":[{"ref":"FEXCore/unittests/Emitter/SVE_Tests.cpp:4101-4125","code":" 4101 | TEST_CASE_METHOD(TestDisassembler, \"Emitter: SVE: SVE load and broadcast quadword (scalar plus scalar)\") {\n 4102 |   TEST_SINGLE(ld1rqb(ZReg::z30, PReg::p6.Zeroing(), Reg::r29, Reg::r30), \"ld1rqb {z30.b}, p6/z, [x29, x30]\");\n 4103 |   TEST_SINGLE(ld1rqb(ZReg::z30, PReg::p6.Zeroing(), Reg::r29, Reg::r30), \"ld1rqb {z30.b}, p6/z, [x29, x30]\");\n 4104 | \n 4105 |   TEST_SINGLE(ld1rob(ZReg::z30, PReg::p6.Zeroing(), Reg::r29, Reg::r30), \"ld1rob {z30.b}, p6/z, [x29, x30]\");\n 4106 |   TEST_SINGLE(ld1rob(ZReg::z30, PReg::p6.Zeroing(), Reg::r29, Reg::r30), \"ld1rob {z30.b}, p6/z, [x29, x30]\");\n 4107 | \n 4108 |   TEST_SINGLE(ld1rqh(ZReg::z30, PReg::p6.Zeroing(), Reg::r29, Reg::r30), \"ld1rqh {z30.h}, p6/z, [x29, x30, lsl #1]\");\n 4109 |   TEST_SINGLE(ld1rqh(ZReg::z30, PReg::p6.Zeroing(), Reg::r29, Reg::r30), \"ld1rqh {z30.h}, p6/z, [x29, x30, lsl #1]\");\n 4110 | \n 4111 |   TEST_SINGLE(ld1roh(ZReg::z30, PReg::p6.Zeroing(), Reg::r29, Reg::r30), \"ld1roh {z30.h}, p6/z, [x29, x30, lsl #1]\");\n 4112 |   TEST_SINGLE(ld1roh(ZReg::z30, PReg::p6.Zeroing(), Reg::r29, Reg::r30), \"ld1roh {z30.h}, p6/z, [x29, x30, lsl #1]\");\n 4113 | \n 4114 |   TEST_SINGLE(ld1rqw(ZReg::z30, PReg::p6.Zeroing(), Re {"id":"CPY_7","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"In the 'SVE contiguous load (scalar plus immediate)' test case, ld1sw is tested twice: once at lines 4225-4227 (between ld1b and ld1w) and again at lines 4264-4266 (between ld1sh and ld1sb) with identical arguments and expected strings in both occurrences. The instruction appears in two different positions in the same test function, making the second occurrence a pure duplicate.","fix":"Remove one of the two ld1sw blocks. The instruction should appear only once in this test case; the conventional placement would be adjacent to other sign-extending loads (ld1sb, ld1sh).","locations":[{"ref":"FEXCore/unittests/Emitter/SVE_Tests.cpp:4228-4230","code":" 4228 |   TEST_SINGLE(ld1sw(ZReg::z26, PReg::p6.Zeroing(), Reg::r29, 0), \"ld1sw {z26.d}, p6/z, [x29]\");\n 4229 |   TEST_SINGLE(ld1sw(ZReg::z26, PReg::p6.Zeroing(), Reg::r29, -8), \"ld1sw {z26.d}, p6/z, [x29, #-8, mul vl]\");\n 4230 |   TEST_SINGLE(ld1sw(ZReg::z26, PReg::p6.Zeroing(), Reg::r29, 7), \"ld1sw {z26.d}, p6/z, [x29, #7, mul vl]\");","lines":3,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/unittests/Emitter/SVE_Tests.cpp#L4228-L4230"},{"ref":"FEXCore/unittests/Emitter/SVE_Tests.cpp:4267-4269","code":" 4267 |   TEST_SINGLE(ld1sw(ZReg::z26, PReg::p6.Zeroing(), Reg::r29, 0), \"ld1sw {z26.d}, p6/z, [x29]\");\n 4268 |   TEST_SINGLE(ld1sw(ZReg::z26, PReg::p6.Zeroing(), Reg::r29, -8), \"ld1sw {z26.d}, p6/z, [x29, #-8, mul vl]\");\n 4269 |   TEST_SINGLE(ld1sw(ZReg::z26, PReg::p6.Zeroing(), Reg::r29, 7), \"ld1sw {z26.d}, p6/z, [x29, #7, mul vl]\");","lines":3,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/unittests/Emitter/SVE_Tests.cpp#L4267-L4269"}]},
{"id":"CPY_8","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"In ExecAndWaitForResponseRedirect, the guard before closing STDERR_FILENO compares against\nSTDOUT_FILENO instead of STDERR_FILENO:\n  if (stderrRedirect != STDOUT_FILENO) {   // line 149 - should be STDERR_FILENO\n    close(STDERR_FILENO);\n  }\nThe purpose of this guard is to avoid closing STDERR_FILENO when stderrRedirect IS\nSTDERR_FILENO (since dup2(x,x) is a no-op). The wrong constant means that if\nstderrRedirect == STDERR_FILENO (2), the fd is closed before dup2(2, 2) is attempted.\nNo current callers pass STDERR_FILENO directly, so this is currently latent.","fix":"Change `stderrRedirect != STDOUT_FILENO` to `stderrRedirect != STDERR_FILENO`.","locations":[{"ref":"Source/Tools/FEXRootFSFetcher/Main.cpp:149","code":"  149 |       if (stderrRedirect != STDOUT_FILENO) {","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/FEXRootFSFetcher/Main.cpp#L149"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"In hook_main() of code-format-helper.py, the variable `comments` is used at line 262 (`comments.append(fmt.comment)`) but is never initialized in that function. If any formatter produces a non-None comment (i.e., `fmt.comment` is truthy), the code raises a NameError and crashes. The main() path (outside hook_main) initializes `comments = []` at line 316, but hook_main() has no such initialization.","fix":"Add `comments = []` near the top of hook_main(), before the loop at line 257.","locations":[{"ref":"External/code-format-helper/code-format-helper.py:244-267","code":"  244 | def hook_main():\n  245 |     # fill out args\n  246 |     args = FormatArgs()\n  247 |     args.verbose = False\n  248 | \n  249 |     # find the changed files\n  250 |     cmd = [\"git\", \"diff\", \"--cached\", \"--name-only\", \"--diff-filter=d\"]\n  251 |     proc = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE)\n  252 |     output = proc.stdout.decode(\"utf-8\")\n  253 |     for line in output.splitlines():\n  254 |         args.changed_files.append(line)\n  255 | \n  256 |     failed_fmts = []\n  257 |     for fmt in ALL_FORMATTERS:\n  258 |         if fmt.has_tool():\n  259 |             if not fmt.run(args.changed_files, args):\n  260 |                 failed_fmts.append(fmt.name)\n  261 |             if fmt.comment:\n  262 |                 comments.append(fmt.comment)\n  263 |         else:\n  264 |             print(f\"Couldn't find {fmt.name}, can't check \" + fmt.friendly_name.lower())\n  265 | \n  266 |     if len(failed_fmts) > 0:\n  267 |         sys.exit(1)","lines":24,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/External/code-format-helper/code-format-helper.py#L244-L267"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"HostXFree, HostXFlush, HostXOpenDisplay, and HostXGetVisualInfo all call dlsym to resolve function pointers on first use, but never check whether the result is null. If libX11.so.6 cannot be loaded or a symbol is missing, the cached function pointer is null and the next call to any of these functions will crash with no diagnostic.","fix":"Check the dlsym return value and abort with a descriptive error message if it is null, similar to how GuestToHostConnection checks xcb_connection_has_error.","locations":[{"ref":"ThunkLibs/include/common/X11Manager.h:89-112","code":"   89 |   static void* GetLibX11() {\n   90 |     static void* libx11 = dlopen(\"libX11.so.6\", RTLD_LAZY);\n   91 |     return libx11;\n   92 |   }\n   93 | \n   94 |   static int HostXFree(void* Ptr) {\n   95 |     static auto func = reinterpret_cast<decltype(&XFree)>(dlsym(GetLibX11(), \"XFree\"));\n   96 |     return func(Ptr);\n   97 |   }\n   98 | \n   99 |   static int HostXFlush(Display* Dis) {\n  100 |     static auto func = reinterpret_cast<decltype(&XFlush)>(dlsym(GetLibX11(), \"XFlush\"));\n  101 |     return func(Dis);\n  102 |   }\n  103 | \n  104 |   static Display* HostXOpenDisplay(const char* Name) {\n  105 |     static auto func = reinterpret_cast<decltype(&XOpenDisplay)>(dlsym(GetLibX11(), \"XOpenDisplay\"));\n  106 |     return func(Name);\n  107 |   }\n  108 | \n  109 |   static XVisualInfo* HostXGetVisualInfo(Display* a, long b, XVisualInfo* c, int* d) {\n  110 |     static auto func = reinterpret_cast<decltype(&XGetVisualInfo)>(dlsym(GetLibX11(), \"XGetVisualInfo\"));\n  111 |     return func(a, b, c, d);\n  112 |   }","lines":24,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/include/common/X11Manager.h#L89-L112"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"JITSymbols::RegisterNamedRegion (unbuffered) and RegisterJITSpace only close the fd when\nwrite() returns -1 with errno == EBADF.  All other write errors (e.g. ENOSPC, EIO) are\nsilently swallowed - the write return value is otherwise unused.  This can cause silent\ndata loss in the perf map file with no indication to the caller.","fix":"Log or propagate non-EBADF write errors; at minimum discard them intentionally with (void)Result.","locations":[{"ref":"FEXCore/Source/Common/JitSymbols.cpp:37-40","code":"   37 |   auto Result = write(fd, Buffer.c_str(), Buffer.size());\n   38 |   if (Result == -1 && errno == EBADF) {\n   39 |     fd = -1;\n   40 |   }","lines":4,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Common/JitSymbols.cpp#L37-L40"},{"ref":"FEXCore/Source/Common/JitSymbols.cpp:51-54","code":"   51 |   auto Result = write(fd, Buffer.c_str(), Buffer.size());\n   52 |   if (Result == -1 && errno == EBADF) {\n   53 |     fd = -1;\n   54 |   }","lines":4,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Common/JitSymbols.cpp#L51-L54"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"StringConv::Conv always returns true regardless of whether strtoll/strtoull actually parsed\na valid number.  Invalid input (empty string, non-numeric characters) silently yields 0 or\ngarbage with no way for callers to detect the failure.  The function signature implies a\nsuccess/failure return value but the failure path is never taken.","fix":"Use endptr to detect parse failures: check that endptr != Value.data() and *endptr == '\\0' (or is whitespace), then return false on failure.","locations":[{"ref":"FEXCore/Source/Common/StringConv.h:11-18","code":"   11 | bool Conv(std::string_view Value, T* Result) {\n   12 |   if constexpr (std::is_signed_v<T>) {\n   13 |     *Result = static_cast<T>(std::strtoll(Value.data(), nullptr, 0));\n   14 |   } else {\n   15 |     *Result = static_cast<T>(std::strtoull(Value.data(), nullptr, 0));\n   16 |   }\n   17 |   return true;\n   18 | }","lines":8,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Common/StringConv.h#L11-L18"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"ELFCodeLoader::GetRandom() has a broken retry loop: the while condition is\n`Result != -1 && Result != DataSize`. When getrandom succeeds with a partial\nread (0 < Result < DataSize), the condition is true so the loop retries - but\nit passes the same Data pointer and DataSize, not advancing the pointer,\nso it overwrites what was already read. When getrandom returns -1 (error) the\nloop exits with Result == -1, which is then returned as failure. In practice\ngetrandom with fewer than 256 bytes is documented to never return a partial\nread, but the loop logic is still wrong and will corrupt the buffer if it ever\ngets a partial result.","fix":"Either trust the documented guarantee (assert Result == DataSize on non-error) or advance the pointer on partial reads: Data = (uint8_t*)Data + Result; DataSize -= Result.","locations":[{"ref":"Source/Tools/CommonTools/../FEXInterpreter/ELFCodeLoader.h:213-221","code":"  213 |     ssize_t Result {};\n  214 |     do {\n  215 |       // This is guaranteed to not be interrupted by a signal,\n  216 |       // since fewer than 256 bytes of RNG data are requested\n  217 |       Result = getrandom(Data, DataSize, 0);\n  218 |     } while (Result != -1 && Result != DataSize);\n  219 | \n  220 |     return Result != -1;\n  221 |   }","lines":9,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/CommonTools/../FEXInterpreter/ELFCodeLoader.h#L213-L221"},{"ref":"Source/Tools/FEXInterpreter/ELFCodeLoader.h:213-221","code":"  213 |     ssize_t Result {};\n  214 |     do {\n  215 |       // This is guaranteed to not be interrupted by a signal,\n  216 |       // since fewer than 256 bytes of RNG data are requested\n  217 |       Result = getrandom(Data, DataSize, 0);\n  218 |     } while (Result != -1 && Result != DataSize);\n  219 | \n  220 |     return Result != -1;\n  221 |   }","lines":9,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/FEXInterpreter/ELFCodeLoader.h#L213-L221"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"FEXOfflineCompiler/Main.cpp GenerateSingleCache(): the file descriptor `fd`\nopened at line 526 for the cache output file is closed at line 535. If\nSaveData or the rename throws an exception (or if the code is restructured),\n`fd` can be leaked. Additionally, if the open() fails (fd == -1) this is\nnot checked before passing `fd` to SaveData.","fix":"Check fd != -1 after open(). Wrap fd in a RAII guard (or unique_fd) so it is closed on all paths.","locations":[{"ref":"Source/Tools/FEXOfflineCompiler/Main.cpp:529-539","code":"  529 |     int fd = open(FilenameNew.c_str(), O_CREAT | O_WRONLY | O_BINARY, 0644);\n  530 |     {\n  531 |       auto Entry = SyscallHandler->LookupExecutableFileSection(Thread, SyscallHandler->VAFileStart).value();\n  532 | #ifndef _WIN32\n  533 |       CTX->GetCodeCache().SaveData(*Thread, fd, Entry, 0 /* TODO: Use static base address information if available */);\n  534 | #else\n  535 |       CTX->GetCodeCache().SaveData(*Thread, fd, Entry, SyscallHandler->VAFileStart);\n  536 | #endif\n  537 |     }\n  538 |     close(fd);\n  539 |     std::filesystem::rename(FilenameNew.c_str(), Filename.c_str());","lines":11,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/FEXOfflineCompiler/Main.cpp#L529-L539"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"In AsyncNet.h read_some_from_fd(), the memcpy at line 170 copies sizeof(FD) bytes (the size of the local int variable 'FD' which is 4 bytes on most platforms) rather than sizeof(int). While these happen to be equal, the intent is to copy a received file descriptor (int) and the correct expression is sizeof(int). Using sizeof(FD) where FD is an int parameter is misleading and fragile.","fix":"Change 'memcpy(*Buffers.FD, CMSG_DATA(cmsg), sizeof(FD))' to 'memcpy(*Buffers.FD, CMSG_DATA(cmsg), sizeof(int))'.","locations":[{"ref":"Source/Common/AsyncNet.h:170","code":"  170 |       memcpy(*Buffers.FD, CMSG_DATA(cmsg), sizeof(FD));","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Common/AsyncNet.h#L170"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"All callers of LookupHostVisualInfo (glXCreateContext, glXCreateGLXPixmap, glXCreateGLXPixmapMESA, glXGetConfig, glXGetFBConfigFromVisualSGIX) call HostXFree(HostInfo) even when LookupHostVisualInfo returns nullptr (when GuestInfo.data == 0). Calling XFree(NULL) is not guaranteed safe by the Xlib specification and causes undefined behavior.","fix":"Guard each HostXFree call: if (HostInfo) { x11_manager.HostXFree(HostInfo); }","locations":[{"ref":"ThunkLibs/libGL/libGL_Host.cpp:379-418","code":"  379 |   auto HostInfo = LookupHostVisualInfo(Display, Info);\n  380 |   auto ret = fexldr_ptr_libGL_glXGetFBConfigFromVisualSGIX(Display, HostInfo);\n  381 |   x11_manager.HostXFree(HostInfo);\n  382 |   return ret;\n  383 | }\n  384 | \n  385 | guest_layout<XVisualInfo*> fexfn_impl_libGL_glXGetVisualFromFBConfigSGIX(Display* Display, GLXFBConfigSGIX Config) {\n  386 |   return MapToGuestVisualInfo(Display, fexldr_ptr_libGL_glXGetVisualFromFBConfigSGIX(Display, Config));\n  387 | }\n  388 | \n  389 | guest_layout<XVisualInfo*> fexfn_impl_libGL_glXChooseVisual(Display* Display, int Screen, int* Attributes) {\n  390 |   return MapToGuestVisualInfo(Display, fexldr_ptr_libGL_glXChooseVisual(Display, Screen, Attributes));\n  391 | }\n  392 | \n  393 | GLXContext fexfn_impl_libGL_glXCreateContext(Display* Display, guest_layout<XVisualInfo*> Info, GLXContext ShareList, Bool Direct) {\n  394 |   auto HostInfo = LookupHostVisualInfo(Display, Info);\n  395 |   auto ret = fexldr_ptr_libGL_glXCreateContext(Display, HostInfo, ShareList, Direct);\n  396 |   x11_manager.HostXFree(HostInfo);\n  397 |   return ret;\n  398 | }\n  399 | \n  400 | GLXPixmap fexfn_impl_libGL_glXCreateGLXPixmap(Display* Display, guest_layout<XVisualInfo*> Info, Pixmap Pixmap) {\n  401 |   auto HostInfo = LookupHostVisualInfo(Display, Info);\n  402 |   auto ret = fexldr_ptr_libGL_glXCreateGLXPixmap(Display, HostInfo, Pixmap);\n  403 |   x11_manager.HostXFree(HostInfo);\n  404 |   return ret;\n  405 | }\n  406 | \n  407 | GLXPixmap fexfn_impl_libGL_glXCreateGLXPixmapMESA(Display* Display, guest_layout<XVisualInfo*> Info, Pixmap Pixmap, Colormap Colormap) {\n  408 |   auto HostInfo = LookupHostVisualInfo(Display, Info);\n  409 |   auto ret = fexldr_ptr_libGL_glXCreateGLXPixmapMESA(Display, HostInfo, Pixmap, Colormap);\n  410 |   x11_manager.HostXFree(HostInfo);\n  411 |   return ret;\n  412 | }\n  413 | \n  414 | int fexfn_impl_libGL_glXGetConfig(Display* Display, guest_layout<XVisualInfo*> Info, int Attribute, int* Value) {\n  415 |   auto HostInfo = LookupHostVisualInfo(Display, Info);\n  416 |   auto ret = fexldr_ptr_libGL_glXGetConfig(Display, HostInfo, Attribute, Value);\n  417 |   x11_manager.HostXFree(HostInfo);\n  418 |   return ret;","lines":40,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/libGL/libGL_Host.cpp#L379-L418"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"AppendLibraryLoad uses alloca to allocate a variable-length buffer sized sizeof(LoadExternalLibrary) + sizeof(uint64_t) + Filename.size() + 1, then passes it to AppendData which copies it to the ring buffer. For long library paths (common on systems with deep directory trees), this places a large allocation on the stack. If the path exceeds a few kilobytes, stack overflow risk exists especially in deeply nested call frames during JIT compilation.","fix":"Use a stack-allocated buffer for the fixed portion and call AppendData twice (for the fixed header and for the filename separately), or use a fextl::vector<std::byte> for the dynamic portion.","locations":[{"ref":"FEXCore/Source/Interface/Core/CodeCache.cpp:227","code":"  227 |   const auto Data = reinterpret_cast<char*>(alloca(TotalSize));","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/CodeCache.cpp#L227"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"In EmitF64Sin and EmitF64Cos NZCV is saved to State.flags[24] via a store to emulated thread state. All eight F64 inline handlers do the same. Since these handlers are called from JIT-compiled code that already preserves NZCV via the static register protocol, a cheaper alternative would be to use a scratch GP register saved on the stack (push/pop mrs/msr), avoiding two memory round-trips through the STATE pointer on every transcendental operation.","fix":"Replace the str/ldr to State.flags[24] with a push-to-stack of the NZCV value to avoid the STATE pointer dereference overhead.","locations":[{"ref":"FEXCore/Source/Interface/Core/Dispatcher/Dispatcher.cpp:884-886","code":"  884 |   // save nzcv\n  885 |   mrs(TMP1, ARMEmitter::SystemRegister::NZCV);\n  886 |   str(TMP1.W(), STATE.R(), offsetof(FEXCore::Core::CpuStateFrame, State.flags[24]));","lines":3,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/Dispatcher/Dispatcher.cpp#L884-L886"},{"ref":"FEXCore/Source/Interface/Core/Dispatcher/Dispatcher.cpp:1004-1006","code":" 1004 |   // save nzcv\n 1005 |   mrs(TMP1, ARMEmitter::SystemRegister::NZCV);\n 1006 |   str(TMP1.W(), STATE.R(), offsetof(FEXCore::Core::CpuStateFrame, State.flags[24]));","lines":3,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/Dispatcher/Dispatcher.cpp#L1004-L1006"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In IREmitter.h, the constant pool (lines 247-268) is a linear scan over up to\n32 entries (`std::min(NrConstants, 32u)`) on every call to `Constant()`. While\nthe pool is bounded, in blocks with many different constants this is O(32) per\nconstant materialization. On pathological x87 code this could be measurable.\nAdditionally, `NrConstants` can grow unboundedly (line 266: `(NrConstants++) & 31`),\nso after 32 constants the pool wraps around and may evict still-live entries.","fix":"Consider capping `NrConstants` at 32 and using a small hash map or robin-hood table for the constant pool. At minimum, document the wrap-around eviction behaviour.","locations":[{"ref":"FEXCore/Source/Interface/IR/IREmitter.h:251-273","code":"  251 |   ConstantData Constants[32];\n  252 |   Ref ConstantRefs[32];\n  253 |   uint32_t NrConstants;\n  254 | \n  255 |   Ref Constant(int64_t Value, ConstPad Pad = IR::ConstPad::NoPad, int32_t MaxBytes = 0) {\n  256 |     const ConstantData Data {\n  257 |       .Value = Value,\n  258 |       .Pad = Pad,\n  259 |       .MaxBytes = MaxBytes,\n  260 |     };\n  261 |     // Search for the constant in the pool.\n  262 |     for (unsigned i = 0; i < std::min(NrConstants, 32u); ++i) {\n  263 |       if (Constants[i] == Data) {\n  264 |         return ConstantRefs[i];\n  265 |       }\n  266 |     }\n  267 | \n  268 |     // Otherwise, materialize a fresh constant and pool it.\n  269 |     Ref R = _Constant(Value, Pad, MaxBytes);\n  270 |     unsigned i = (NrConstants++) & 31;\n  271 |     Constants[i] = Data;\n  272 |     ConstantRefs[i] = R;\n  273 |     return R;","lines":23,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/IR/IREmitter.h#L251-L273"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In RegisterAllocationPass.cpp `CalculateNextUses()` (line 228), `NextUses`\nis resized to `IR->GetSSACount()` on every call (line 230). During RA, each\ntime a spill occurs this function is called again from `SpillReg()` for the\nsame block. The repeated resize (which zero-fills) followed by a full backward\nscan of the block is O(SSACount + BlockSize). For large blocks with frequent\nspills this can be quadratic. The `AnySpilled` flag (line 114) is already used\nto gate the first call, but subsequent spills in the same block call this\nagain even though the data was already computed.","fix":"Cache the result of `CalculateNextUses` per block and only recompute if necessary (e.g., only when new nodes have been inserted before the current scan point).","locations":[{"ref":"FEXCore/Source/Interface/IR/Passes/RegisterAllocationPass.cpp:278-280","code":"  278 |   }\n  279 | \n  280 |   void SpillReg(RegisterClassData* Class, IROp_CodeBlock* Block, IROp_Header* Exclude) {","lines":3,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/IR/Passes/RegisterAllocationPass.cpp#L278-L280"},{"ref":"FEXCore/Source/Interface/IR/Passes/RegisterAllocationPass.cpp:119","code":"  119 |   bool AnySpilled {};","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/IR/Passes/RegisterAllocationPass.cpp#L119"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"WildcardMatcher::matchHelper (WildcardMatcher.cpp) uses recursive backtracking without\nmemoization. For a pattern with k wildcards '*' against a text of length n that does not\nmatch, the algorithm has exponential worst-case time O(2^n). For example, pattern\n'*a*a*a' against text 'bbbbb...bbb' causes combinatorial explosion. Since this is used\nfor wildcard matching of application names or paths in config, an adversarial or simply\ncomplex pattern could cause FEX to hang during startup.","fix":"Replace with a dynamic programming or iterative two-pointer approach. A simple iterative DP runs in O(n*m) time and O(n) space where n=|text|, m=|pattern|.","locations":[{"ref":"FEXCore/Source/Utils/WildcardMatcher.cpp:6-16","code":"    6 | static bool matchHelper(std::string_view pattern, std::string_view text, size_t p_idx, size_t t_idx) {\n    7 |   if (p_idx == pattern.size()) {\n    8 |     // Pattern exhausted\n    9 |     return (t_idx == text.size());\n   10 |   } else if (pattern[p_idx] == '*') {\n   11 |     // Wildcard: Try matching zero characters, or one or more characters\n   12 |     return matchHelper(pattern, text, p_idx + 1, t_idx) || (t_idx < text.size() && matchHelper(pattern, text, p_idx, t_idx + 1));\n   13 |   } else {\n   14 |     // Match normally\n   15 |     return (t_idx < text.size() && pattern[p_idx] == text[t_idx] && matchHelper(pattern, text, p_idx + 1, t_idx + 1));\n   16 |   }","lines":11,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Utils/WildcardMatcher.cpp#L6-L16"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"In doc_outline_generator.py, each file's entire text is read into memory with file.read() (line 58), then a regex is run to extract the info block. For large source trees with many large files this creates unnecessary peak memory usage. The info tag is always near the top of the file.","fix":"Read only the first few kilobytes of each file or use a streaming approach to limit peak memory for large codebases.","locations":[{"ref":"Scripts/doc_outline_generator.py:60-61","code":"   60 |         txt = file.read()\n   61 |         x = re.findall(\"\\$info\\$([^\\$]*)\\$end_info\\$\", txt)","lines":2,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Scripts/doc_outline_generator.py#L60-L61"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In Config.cpp SaveLayerToJSON (line 93-100), for each config option the code does a linear scan of the entire ConfigLookup array to find the name matching the enum. Since this is done for every option in the layer and ConfigLookup is O(N), saving a large config will be O(N^2). A reverse lookup map built once at startup would be O(1).","fix":"Build a reverse map (ConfigOption -> string_view) once and use it for lookups.","locations":[{"ref":"Source/Common/Config.cpp:91-111","code":"   91 | static char* SaveLayerToJSON(char* JsonBuffer, const FEXCore::Config::Layer* Layer) {\n   92 |   JsonBuffer = json_objOpen(JsonBuffer, \"Config\");\n   93 |   for (auto& it : Layer->GetOptionMap()) {\n   94 |     std::string_view Name {};\n   95 |     for (auto& name_it : ConfigLookup) {\n   96 |       if (name_it.second == it.first) {\n   97 |         Name = name_it.first;\n   98 |         break;\n   99 |       }\n  100 |     }\n  101 |     if (std::holds_alternative<fextl::string>(it.second)) {\n  102 |       JsonBuffer = json_str(JsonBuffer, Name.data(), std::get<fextl::string>(it.second).c_str());\n  103 |     } else if (std::holds_alternative<FEXCore::Config::StringArrayType>(it.second)) {\n  104 |       for (auto& var : std::get<FEXCore::Config::StringArrayType>(it.second)) {\n  105 |         JsonBuffer = json_str(JsonBuffer, Name.data(), var.c_str());\n  106 |       }\n  107 |     } else {\n  108 |       LogMan::Msg::AFmt(\"Trying to store config with pre-converted type\");\n  109 |     }\n  110 |   }\n  111 |   return json_objClose(JsonBuffer);","lines":21,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Common/Config.cpp#L91-L111"}]},
{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"Unreachable return statement in MemAllocator32Bit::Mmap (line 243: `return 0;`). After the if-else block\nat lines 230-242, all branches either return or fall through to this dead code. The function always returns\nfrom inside the conditional, so this statement is never reached. While harmless, it constitutes dead code.","fix":"Remove the unreachable `return 0;`.","locations":[{"ref":"Source/Tools/LinuxEmulation/LinuxSyscalls/LinuxAllocator.cpp:243","code":"  243 |   return 0;","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/LinuxEmulation/LinuxSyscalls/LinuxAllocator.cpp#L243"}]},
{"id":"PERF_9","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"All functions that use alloca to translate guest pointer arrays (glShaderSource, glCompileShaderIncludeARB, glCreateShaderProgramv, glShaderSourceARB, glBindBuffersRange, glBindVertexBuffers, glGetUniformIndices, glVertexArrayVertexBuffers) allocate on the stack from a guest-supplied Count/count with no upper bound check. A malicious or buggy guest can pass a large count and trigger a stack overflow (stack clash), since alloca does not check stack limits.","fix":"Add a reasonable upper-bound check (e.g., count <= 4096) before calling alloca, or switch to a heap allocation (std::vector) for counts above a safe threshold. This is consistent with how similar thunk libs guard untrusted size inputs.","locations":[{"ref":"ThunkLibs/libGL/libGL_Host.cpp:163","code":"  163 |   auto sources = (const char**)alloca(Count * sizeof(const char*));","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/libGL/libGL_Host.cpp#L163"},{"ref":"ThunkLibs/libGL/libGL_Host.cpp:175","code":"  175 |   auto sources = (const char**)alloca(count * sizeof(const char*));","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/libGL/libGL_Host.cpp#L175"},{"ref":"ThunkLibs/libGL/libGL_Host.cpp:271","code":"  271 |   auto sources = (const char**)alloca(count * sizeof(const char*));","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/libGL/libGL_Host.cpp#L271"},{"ref":"ThunkLibs/libGL/libGL_Host.cpp:283","code":"  283 |   auto sources = (const char**)alloca(count * sizeof(const char*));","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/libGL/libGL_Host.cpp#L283"},{"ref":"ThunkLibs/libGL/libGL_Host.cpp:428-429","code":"  428 |   auto HostOffsets = (GLintptr*)alloca(Count * sizeof(GLintptr));\n  429 |   auto HostSizes = (GLsizeiptr*)alloca(Count * sizeof(GLsizeiptr));","lines":2,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/libGL/libGL_Host.cpp#L428-L429"},{"ref":"ThunkLibs/libGL/libGL_Host.cpp:438","code":"  438 |   auto HostOffsets = (GLintptr*)alloca(count * sizeof(GLintptr));","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/libGL/libGL_Host.cpp#L438"},{"ref":"ThunkLibs/libGL/libGL_Host.cpp:446","code":"  446 |   auto HostNames = (const GLchar**)alloca(Count * sizeof(GLintptr));","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/libGL/libGL_Host.cpp#L446"},{"ref":"ThunkLibs/libGL/libGL_Host.cpp:455","code":"  455 |   auto HostOffsets = (GLintptr*)alloca(count * sizeof(GLintptr));","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/libGL/libGL_Host.cpp#L455"}]},
{"id":"PERF_10","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"SpinWaitLock.cpp line 21 computes CyclesPerNanosecond = 1,000,000,000 / CounterFrequency\nat static initialization time. The CNTFRQ_EL0 register should always be non-zero, but\nthere is no guard against it being zero. If CounterFrequency were ever zero (hardware\ndefect, virtualization bug), division by zero would occur at static init, crashing before\nmain() runs with no useful diagnostic.","fix":"Add a check: if (CounterFrequency == 0) return 0; (or use LOGMAN_THROW) before the division.","locations":[{"ref":"FEXCore/Source/Utils/SpinWaitLock.cpp:14-25","code":"   14 | static uint64_t CalculateCyclesPerNanosecond() {\n   15 |   // Snapdragon devices historically use a 19.2Mhz cycle counter frequency\n   16 |   // This means that the number of cycles per nanosecond ends up being 52.0833...\n   17 |   //\n   18 |   // ARMv8.6 and ARMv9.1 requires the cycle counter frequency to be 1Ghz.\n   19 |   // This means the number of cycles per nanosecond ends up being 1.\n   20 |   uint64_t CounterFrequency = GetCycleCounterFrequency();\n   21 |   return NanosecondsInSecond / CounterFrequency;\n   22 | }\n   23 | \n   24 | uint64_t CycleCounterFrequency = GetCycleCounterFrequency();\n   25 | uint64_t CyclesPerNanosecond = CalculateCyclesPerNanosecond();","lines":12,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Utils/SpinWaitLock.cpp#L14-L25"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"medium","difficulty":"easy","description":"In f128_add.c and f128_sub.c the #else branch (compiled when INLINE_LEVEL < 2) declares a function pointer without the 'struct softfloat_state *' first parameter, yet softfloat_addMagsF128 and softfloat_subMagsF128 both require it as their first argument (per internals.h lines 207-213). The call through the pointer then omits the state argument entirely. The FEX build sets INLINE_LEVEL=4 so this branch is dead, but any build with INLINE_LEVEL < 2 would silently pass garbage for 'state', corrupting exception-flag writes.","fix":"Add 'struct softfloat_state *' as the first parameter of magsFuncPtr in both files and pass 'state' as the first argument in the call, matching the actual function signatures.","locations":[{"ref":"External/SoftFloat-3e/src/f128_add.c:51-75","code":"   51 | #if ! defined INLINE_LEVEL || (INLINE_LEVEL < 2)\n   52 |     float128_t\n   53 |         (*magsFuncPtr)(\n   54 |             uint_fast64_t, uint_fast64_t, uint_fast64_t, uint_fast64_t, bool );\n   55 | #endif\n   56 | \n   57 |     uA.f = a;\n   58 |     uiA64 = uA.ui.v64;\n   59 |     uiA0  = uA.ui.v0;\n   60 |     signA = signF128UI64( uiA64 );\n   61 |     uB.f = b;\n   62 |     uiB64 = uB.ui.v64;\n   63 |     uiB0  = uB.ui.v0;\n   64 |     signB = signF128UI64( uiB64 );\n   65 | #if defined INLINE_LEVEL && (2 <= INLINE_LEVEL)\n   66 |     if ( signA == signB ) {\n   67 |         return softfloat_addMagsF128( state, uiA64, uiA0, uiB64, uiB0, signA );\n   68 |     } else {\n   69 |         return softfloat_subMagsF128( state, uiA64, uiA0, uiB64, uiB0, signA );\n   70 |     }\n   71 | #else\n   72 |     magsFuncPtr =\n   73 |         (signA == signB) ? softfloat_addMagsF128 : softfloat_subMagsF128;\n   74 |     return (*magsFuncPtr)( uiA64, uiA0, uiB64, uiB0, signA );\n   75 | #endif","lines":25,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/External/SoftFloat-3e/src/f128_add.c#L51-L75"},{"ref":"External/SoftFloat-3e/src/f128_sub.c:51-75","code":"   51 | #if ! defined INLINE_LEVEL || (INLINE_LEVEL < 2)\n   52 |     float128_t\n   53 |         (*magsFuncPtr)(\n   54 |             uint_fast64_t, uint_fast64_t, uint_fast64_t, uint_fast64_t, bool );\n   55 | #endif\n   56 | \n   57 |     uA.f = a;\n   58 |     uiA64 = uA.ui.v64;\n   59 |     uiA0  = uA.ui.v0;\n   60 |     signA = signF128UI64( uiA64 );\n   61 |     uB.f = b;\n   62 |     uiB64 = uB.ui.v64;\n   63 |     uiB0  = uB.ui.v0;\n   64 |     signB = signF128UI64( uiB64 );\n   65 | #if defined INLINE_LEVEL && (2 <= INLINE_LEVEL)\n   66 |     if ( signA == signB ) {\n   67 |         return softfloat_subMagsF128( state, uiA64, uiA0, uiB64, uiB0, signA );\n   68 |     } else {\n   69 |         return softfloat_addMagsF128( state, uiA64, uiA0, uiB64, uiB0, signA );\n   70 |     }\n   71 | #else\n   72 |     magsFuncPtr =\n   73 |         (signA == signB) ? softfloat_subMagsF128 : softfloat_addMagsF128;\n   74 |     return (*magsFuncPtr)( uiA64, uiA0, uiB64, uiB0, signA );\n   75 | #endif","lines":25,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/External/SoftFloat-3e/src/f128_sub.c#L51-L75"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"medium","difficulty":"easy","description":"In cephes_f128_sinl, the extended-precision range reduction for z is computed twice. Lines 191-198 compute z inside a block (assigning tmp1-tmp5 and then z), but line 200 immediately overwrites z with the identical expression written as a one-liner. All work done inside the block at lines 191-198 is thrown away: tmp1-tmp5 are unused and z is overwritten before it is read. This wastes execution time and is confusing to readers.","fix":"Remove the dead block at lines 191-198 entirely, keeping only the single-expression assignment at line 200 (or vice versa, keep the readable block and delete line 200).","locations":[{"ref":"External/cephes/src/128bit/sinll.c:191-200","code":"  191 | /* Extended precision modular arithmetic */\n  192 | // z = ((x - y * DP1) - y * DP2) - y * DP3;\n  193 |  {\n  194 |    float128_t tmp1 = f128_mul(&state, y, DP1);\n  195 |    float128_t tmp2 = f128_mul(&state, y, DP2);\n  196 |    float128_t tmp3 = f128_mul(&state, y, DP3);\n  197 |    float128_t tmp4 = f128_sub(&state, x, tmp1);\n  198 |    float128_t tmp5 = f128_sub(&state, tmp4, tmp2);\n  199 |    z = f128_sub(&state, tmp5, tmp3);\n  200 |  }","lines":10,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/External/cephes/src/128bit/sinll.c#L191-L200"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"f128_to_i32.c line 71 and f128_to_ui32.c line 71 each call softfloat_raiseFlags(softfloat_flag_invalid) without the required 'struct softfloat_state *' first argument. These calls are inside a preprocessor block that is never compiled in this build because i32_fromNaN == i32_fromPosOverflow == i32_fromNegOverflow (all INT32_MIN) and ui32_fromNaN == ui32_fromPosOverflow == ui32_fromNegOverflow (all 0xFFFFFFFF), making the outer #if condition false. However, the code is formally wrong and would fail to compile or corrupt state if the specialize.h constants were changed.","fix":"Add 'state,' as the first argument to the two softfloat_raiseFlags calls: softfloat_raiseFlags(state, softfloat_flag_invalid).","locations":[{"ref":"External/SoftFloat-3e/src/f128_to_i32.c:64-75","code":"   64 | #if (i32_fromNaN != i32_fromPosOverflow) || (i32_fromNaN != i32_fromNegOverflow)\n   65 |     if ( (exp == 0x7FFF) && (sig64 | sig0) ) {\n   66 | #if (i32_fromNaN == i32_fromPosOverflow)\n   67 |         sign = 0;\n   68 | #elif (i32_fromNaN == i32_fromNegOverflow)\n   69 |         sign = 1;\n   70 | #else\n   71 |         softfloat_raiseFlags( softfloat_flag_invalid );\n   72 |         return i32_fromNaN;\n   73 | #endif\n   74 |     }\n   75 | #endif","lines":12,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/External/SoftFloat-3e/src/f128_to_i32.c#L64-L75"},{"ref":"External/SoftFloat-3e/src/f128_to_ui32.c:64-75","code":"   64 | #if (ui32_fromNaN != ui32_fromPosOverflow) || (ui32_fromNaN != ui32_fromNegOverflow)\n   65 |     if ( (exp == 0x7FFF) && sig64 ) {\n   66 | #if (ui32_fromNaN == ui32_fromPosOverflow)\n   67 |         sign = 0;\n   68 | #elif (ui32_fromNaN == ui32_fromNegOverflow)\n   69 |         sign = 1;\n   70 | #else\n   71 |         softfloat_raiseFlags( softfloat_flag_invalid );\n   72 |         return ui32_fromNaN;\n   73 | #endif\n   74 |     }\n   75 | #endif","lines":12,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/External/SoftFloat-3e/src/f128_to_ui32.c#L64-L75"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In cephes_f128_floorl, line 206 has a double semicolon: `u.y = f128_sub(&state, u.y, one);;` - the trailing extra semicolon is a stray empty statement. Harmless but indicative of an edit artifact.","fix":"Remove the duplicate semicolon: `u.y = f128_sub(&state, u.y, one);`","locations":[{"ref":"External/cephes/src/128bit/floorll.c:206","code":"  206 | if( f128_lt(&state, x, zero) && !f128_eq(&state, u.y, x) )","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/External/cephes/src/128bit/floorll.c#L206"}]},
{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"CPUIDEmu::SupportsCPUIndexInTPIDRRO is marked [[maybe_unused]] and is never read after construction. It is initialized from CTX->HostFeatures.SupportsCPUIndexInTPIDRRO at line 1344 of CPUID.cpp (used to gate GetCPUID pointer assignment inside ARCHITECTURE_arm64 guard), but on non-ARM64 builds there is no use at all, and on ARM64 the value is read from the member before the member could serve a purpose. The [[maybe_unused]] annotation signals the suppressed warning for the unused state.","fix":"Remove the member and read CTX->HostFeatures.SupportsCPUIndexInTPIDRRO directly at the point of use in CPUID.cpp.","locations":[{"ref":"FEXCore/Source/Interface/Core/CPUID.h:118","code":"  118 |   [[maybe_unused]] bool SupportsCPUIndexInTPIDRRO {};","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/CPUID.h#L118"}]},
{"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In DecodeInstructionImpl the code after the infinite for(;;) loop (lines 1047-1051) is unreachable. The loop exits only via return statements inside the loop body, so the trailing if and return can never execute. This is dead code that silently gives a misleading impression of an additional valid-instruction check.","fix":"Remove the unreachable code block or add LOGMAN_MSG_A_FMT / FEX_UNREACHABLE before it to make the intent explicit.","locations":[{"ref":"FEXCore/Source/Interface/Core/Frontend.cpp:1054-1058","code":" 1054 |   if (DecodeInst->Dest.IsGPR()) {\n 1055 |     return DecodedBlockStatus::INVALID_INST;\n 1056 |   }\n 1057 | \n 1058 |   return DecodedBlockStatus::SUCCESS;","lines":5,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/Frontend.cpp#L1054-L1058"}]},
{"id":"DEAD_7","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"DEF_OP(TestZ) includes an i64Bit branch in the Mask computation: 'uint64_t Mask = IROp->Size == IR::OpSize::i64Bit ? ~0ULL : ((1ull << IR::OpSizeAsBits(IROp->Size)) - 1)'. The immediately preceding assertion 'LOGMAN_THROW_A_FMT(IROp->Size < IR::OpSize::i32Bit, ...)' statically guarantees the size is at most 16-bit. The i64Bit ternary branch is therefore unreachable dead code.","fix":"Simplify the mask computation to just '(1ull << IR::OpSizeAsBits(IROp->Size)) - 1', removing the unreachable i64Bit branch.","locations":[{"ref":"FEXCore/Source/Interface/Core/JIT/ALUOps.cpp:208-214","code":"  208 | DEF_OP(TestZ) {\n  209 |   auto Op = IROp->C<IR::IROp_TestZ>();\n  210 |   LOGMAN_THROW_A_FMT(IROp->Size < IR::OpSize::i32Bit, \"TestNZ used at higher sizes\");\n  211 |   const auto EmitSize = ARMEmitter::Size::i32Bit;\n  212 | \n  213 |   uint64_t Const;\n  214 |   uint64_t Mask = IROp->Size == IR::OpSize::i64Bit ? ~0ULL : ((1ull << IR::OpSizeAsBits(IROp->Size)) - 1);","lines":7,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/JIT/ALUOps.cpp#L208-L214"}]},

{"id":"DEAD_9","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"libX11_NativeGuest.cpp declares XSetErrorHandler with an incorrect signature (void return, no parameters) purely to keep the placeholder library non-empty. The real signature is XErrorHandler XSetErrorHandler(XErrorHandler). This symbol is never actually called at runtime, but it creates a type-mismatch stub that could confuse static analysis tools or future maintainers.","fix":"Either correct the signature to match the real XSetErrorHandler, or add an explicit comment that the signature is intentionally wrong because it is a never-called placeholder.","locations":[{"ref":"ThunkLibs/libX11/libX11_NativeGuest.cpp:7","code":"    7 | extern \"C\" void XSetErrorHandler() {}","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/libX11/libX11_NativeGuest.cpp#L7"}]},
{"id":"DEAD_10","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"In atanll.c, the static constants f_2_p0 and f_3_p0 are declared with __attribute__((unused)) at lines 113-114 because they are only referenced under the non-ANSIC path (#else branch of #if ANSIC). Since mconf.h unconditionally defines ANSIC 1, these two constants are never reachable in this translation unit. They exist to suppress the unused-variable warning that would otherwise fire.","fix":"Either guard the definitions with `#if !ANSIC` to match their usage, or leave the __attribute__((unused)) annotation as an intentional suppressor - the current code is functionally harmless.","locations":[{"ref":"External/cephes/src/128bit/atanll.c:113-114","code":"  113 | static const float128_t zero = {0, 0};\n  114 | static const float128_t one = {0, 0x3fff000000000000ULL};","lines":2,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/External/cephes/src/128bit/atanll.c#L113-L114"}]},
{"id":"DEAD_11","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"GetX86RegRelationToARMReg is declared in Arm64Emitter.h and defined in Arm64Emitter.cpp but is never called anywhere in the codebase. The function also has a latent logic issue: for SRA indices 16 and 17 (which map to REG_PF and REG_AF), it returns REG_XMM_0 and REG_XMM_1 respectively, since the mapping assumes a linear x86 GPR layout for all SRA entries.","fix":"Remove the declaration and definition, or add a bounds check and return REG_INVALID for i >= 16 if this is intended to be called in the future.","locations":[{"ref":"FEXCore/Source/Interface/Core/ArchHelpers/Arm64Emitter.cpp:407-419","code":"  407 | FEXCore::X86State::X86Reg Arm64Emitter::GetX86RegRelationToARMReg(ARMEmitter::Register Reg) {\n  408 |   for (size_t i = 0; i < StaticRegisters.size(); ++i) {\n  409 |     const auto& RegI = StaticRegisters[i];\n  410 |     if (RegI == Reg) {\n  411 |       // X86 Registers are mapped linerally from the StaticRegisters span.\n  412 |       // Directly correlating Enum index to span index.\n  413 |       return static_cast<FEXCore::X86State::X86Reg>(FEXCore::ToUnderlying(FEXCore::X86State::X86Reg::REG_RAX) + i);\n  414 |     }\n  415 |   }\n  416 | \n  417 |   // Unmapped register.\n  418 |   return FEXCore::X86State::X86Reg::REG_INVALID;\n  419 | }","lines":13,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/ArchHelpers/Arm64Emitter.cpp#L407-L419"},{"ref":"FEXCore/Source/Interface/Core/ArchHelpers/Arm64Emitter.h:150","code":"  150 |   FEXCore::X86State::X86Reg GetX86RegRelationToARMReg(ARMEmitter::Register Reg);","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/ArchHelpers/Arm64Emitter.h#L150"}]},
{"id":"DEAD_12","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"In PassManager.cpp `Finalize()`, when `AFTEROPT` is set but `AFTERPASS` is\nnot set, an IR dumper is inserted via `InsertAt(Passes.end(), ...)` (line 64)\nbut the return value (an iterator) is discarded. This is not a bug since we\nare at the end of the list, but it is inconsistent with all other `InsertAt`\ncalls which capture the iterator for subsequent `++it` advancement.","fix":"Capture the return value to be consistent: `it = InsertAt(Passes.end(), Debug::CreateIRDumper());` (the iterator is not used further but this is stylistically consistent).","locations":[{"ref":"FEXCore/Source/Interface/IR/PassManager.cpp:64-66","code":"   64 |       // Insert final IRDumper.\n   65 |       InsertAt(Passes.end(), Debug::CreateIRDumper());\n   66 |     }","lines":3,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/IR/PassManager.cpp#L64-L66"}]},

while (0)","lines":13,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/include/FEXCore/Utils/Telemetry.h#L72-L84"}]},

{"id":"DEAD_15","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"In `data_layout.cpp` line 373, `host_type_info` is assigned from `host_abi.at(host_member_type)` but never used afterwards (the subsequent line calls `GetTypeCompatibility` directly).\nThe compiler will warn about this unused variable.","fix":"Remove the `host_type_info` assignment; it serves no purpose.","locations":[{"ref":"ThunkLibs/Generator/data_layout.cpp:372-374","code":"  372 |       if (guest_abi.at(guest_struct_info->members[member_idx].type_name).get_if_struct()) {\n  373 |         auto host_type_info = host_abi.at(host_member_type);\n  374 |         member_compat.push_back(GetTypeCompatibility(context, host_member_type, host_abi, type_compat));","lines":3,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/Generator/data_layout.cpp#L372-L374"}]},
{"id":"DEAD_16","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"The malloc_wrapper function (libGL_Guest.cpp:78-80) is a trivial wrapper around malloc() with no additional logic. The comment says it avoids 'noexcept specifiers', but malloc itself does not have noexcept in practice and the CallbackUnpack mechanism does not require this wrapper. The same pointer to malloc could be passed directly.","fix":"Pass malloc directly instead of through malloc_wrapper, or add a comment explaining why the wrapper is needed if there is a genuine reason.","locations":[{"ref":"ThunkLibs/libGL/libGL_Guest.cpp:77-80","code":"   77 | // Wrapper around malloc() without noexcept specifiers\n   78 | static void* malloc_wrapper(size_t size) {\n   79 |   return malloc(size);\n   80 | }","lines":4,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/libGL/libGL_Guest.cpp#L77-L80"}]},
