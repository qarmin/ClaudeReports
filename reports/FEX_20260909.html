                 .Length = NewLength,\n  520 |                                                           .Flags = CurrentFlags,\n  521 |                                                           .Prot = CurrentProt});\n  522 | \n  523 |       if (!Inserted) {\n  524 |         // We can't recover from this.\n  525 |         // Shouldn't ever happen.\n  526 |         ERROR_AND_DIE_FMT(\"{}:{}: VMA tracking error\", __func__, __LINE__);\n  527 |       }\n  528 | \n  529 |       if (Current->Resource) {\n  530 |         ListInsertAfter(Current, &Iter->second);","lines":17,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/LinuxEmulation/LinuxSyscalls/SyscallsVMATracking.cpp#L514-L530"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"x32 get_thread_area has an off-by-one in its range check. TLS_NextEntry=12,\nTLS_MaxEntry=15 (12+3). Valid GDT indices are 12, 13, 14. The check\n`Entry > TLS_MaxEntry` (i.e., Entry > 15) allows Entry=15 through, which is one\npast the last valid slot. An attacker or misbehaving process can pass entry_number=15\nto index one element past the three valid GDT slots, potentially reading garbage or\nout-of-bounds memory from the segment_arrays array.","fix":"Change the check to `Entry >= TLS_MaxEntry` so that entry 15 (TLS_MaxEntry) is rejected. Or rename TLS_MaxEntry to TLS_LastEntry+1 and keep the `>=` check.","locations":[{"ref":"Source/Tools/LinuxEmulation/LinuxSyscalls/x32/Thread.cpp:47-48","code":"   47 | constexpr uint32_t TLS_NextEntry = 12;\n   48 | constexpr uint32_t TLS_MaxEntry = TLS_NextEntry + 3;","lines":2,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/LinuxEmulation/LinuxSyscalls/x32/Thread.cpp#L47-L48"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In Module.cpp WriteModuleRVA (line 204), the old protection is restored by\ncalling NtProtectVirtualMemoryNative with the old protection value Prot,\nbut the out-parameter for the restored old protection is passed as `nullptr`.\nThis is correct in isolation, but the call immediately before it also passes\n`&Prot` to capture the original protection, so Prot is populated. However\nif the first NtProtectVirtualMemoryNative fails, Prot may still be zero\n(its initial value), and the second call will set the page protection to 0\n(which is an invalid protection value on Windows, different from PAGE_NOACCESS\nwhich is 0x01). This leaves the page in an unrestorable state.","fix":"Check the return value of the first NtProtectVirtualMemoryNative call and skip\nthe write + second protect call if it fails. Also check the return value of the\nsecond call to detect failures during protection restoration.","locations":[{"ref":"Source/Windows/ARM64EC/Module.cpp:207-210","code":"  207 |   ULONG Prot;\n  208 |   NtProtectVirtualMemoryNative(NtCurrentProcess(), &ProtAddress, &ProtSize, PAGE_READWRITE, &Prot);\n  209 |   *reinterpret_cast<T*>(Address) = Data;\n  210 |   NtProtectVirtualMemoryNative(NtCurrentProcess(), &ProtAddress, &ProtSize, Prot, nullptr);","lines":4,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Windows/ARM64EC/Module.cpp#L207-L210"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In Module.cpp ProcessInit (line 629-630), after calling GetProcAddress for\n\"KiUserExceptionDispatcher\", the code indexes NtDllRedirectionLUT with\n`KiUserExceptionDispatcherFFS - NtDllBase`. If GetProcAddress returns nullptr\n(e.g. because the name is not found), the subtraction underflows (nullptr == 0,\nNtDllBase > 0) producing a huge positive index far beyond\nNtDllRedirectionLUTSize, causing an out-of-bounds read.","fix":"Check that KiUserExceptionDispatcherFFS is non-zero and that\n(KiUserExceptionDispatcherFFS - NtDllBase) < NtDllRedirectionLUTSize before\nindexing the LUT.","locations":[{"ref":"Source/Windows/ARM64EC/Module.cpp:638-639","code":"  638 |   const uintptr_t KiUserExceptionDispatcherFFS = reinterpret_cast<uintptr_t>(GetProcAddress(NtDll, \"KiUserExceptionDispatcher\"));\n  639 |   Exception::KiUserExceptionDispatcher = NtDllRedirectionLUT[KiUserExceptionDispatcherFFS - NtDllBase] + NtDllBase;","lines":2,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Windows/ARM64EC/Module.cpp#L638-L639"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"strtoll delegates to strtoimax, which returns intmax_t. On all platforms where\nsizeof(long long) == sizeof(intmax_t) (which is every current 64-bit target)\nthe overflow checks `x > LLONG_MAX` and `x < LLONG_MIN` can never be true\nbecause strtoimax already saturates to INTMAX_MAX/INTMAX_MIN. The redundant\nchecks mask the fact that the code relies on intmax_t == long long being true,\nbut this is a correctness assumption rather than a real check. The actual danger\nis the reverse: if a future target has intmax_t wider than long long, the wrapper\nprovides a false safety net that doesn't actually truncate. On current targets\nthe code is functionally equivalent to a plain cast, but the intent is wrong.","fix":"Call strtoumax directly (or strtoimax if signed), then explicitly clamp to\nLLONG_MIN/LLONG_MAX. The present body is a no-op on all real targets and\nmasks the architectural assumption.","locations":[{"ref":"Source/Windows/Common/CRT/Musl/strtoll.c:10-20","code":"   10 | long long strtoll(const char* s, char** p, int base) {\n   11 |   intmax_t x = strtoimax(s, p, base);\n   12 |   if (x > LLONG_MAX) {\n   13 |     errno = ERANGE;\n   14 |     return LLONG_MAX;\n   15 |   } else if (x < LLONG_MIN) {\n   16 |     errno = ERANGE;\n   17 |     return LLONG_MIN;\n   18 |   }\n   19 |   return x;\n   20 | }","lines":11,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Windows/Common/CRT/Musl/strtoll.c#L10-L20"}]},
{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"strtoumax: the `errno = EINVAL` assignment at line 60 (when the first digit is\ninvalid or base is out of range) overwrites any errno that may have been set\nby the caller. More critically, `errno = EINVAL` is set but the function also\nstores `*p = (char*)s1` (the original pointer) which is correct. However, the\nspec for strtoull says that if no conversion is performed the function stores\nthe original string pointer into *endptr and may set errno to EINVAL.\nThe issue is line 58: when `(unsigned)base - 2 > 36 - 2` (i.e. base is 0 or\n1 or > 36) the function sets errno=EINVAL and returns 0. But then calling\nstrtoimax (strtoimax.c:25) immediately calls strtoumax on the already-consumed\n`s` pointer, which re-enters and may shadow errno. The pair work together, but\nthe interaction is fragile and the EINVAL path in strtoumax returns 0 without\nupdating *p to be s1 when the very first check fails, leading to *p pointing\nat the wrong place for callers that pass an initial whitespace-skipped pointer.","fix":"Ensure *p is always set to the original pointer s1 (not the whitespace-trimmed\ns) when no conversion can be performed.","locations":[{"ref":"Source/Windows/Common/CRT/Musl/strtoumax.c:58-62","code":"   58 |   if ((unsigned)base - 2 > 36 - 2 || digits[*s] >= base) {\n   59 |     *p = (char*)s1;\n   60 |     errno = EINVAL;\n   61 |     return 0;\n   62 |   }","lines":5,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Windows/Common/CRT/Musl/strtoumax.c#L58-L62"}]},
{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`GetStableLayout` uses `member.size_bits` (total array size in bits) instead of element size when calling `get_fixed_size_int_name` for array members.\nWhen a struct has an integral array member (e.g. `uint32_t foo[4]`), `member.size_bits` is the total size (128 bits), so `get_fixed_size_int_name(false, 128)` produces `uint128_t` rather than `uint32_t`, corrupting the stable ABI type map for that member.","fix":"Divide by the array element count when the member is an array:\n`auto element_size = member.array_size ? member.size_bits / *member.array_size : member.size_bits;`\nthen use `element_size` in `get_fixed_size_int_name`.","locations":[{"ref":"ThunkLibs/Generator/data_layout.cpp:163-171","code":"  163 |         if (member.is_integral) {\n  164 |           // Map member types to fixed-size integers\n  165 |           auto alt_type_name = get_fixed_size_int_name(member.is_signed_integer, member.size_bits);\n  166 |           auto alt_type_info = SimpleTypeInfo {\n  167 |             .size_bits = member.size_bits,\n  168 |             .alignment_bits = context.getTypeAlign(context.getIntTypeForBitwidth(member.size_bits, member.is_signed_integer)),\n  169 |           };\n  170 |           stable_layout.insert(std::pair {alt_type_name, alt_type_info});\n  171 |           member.type_name = std::move(alt_type_name);","lines":9,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/Generator/data_layout.cpp#L163-L171"}]},
{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`GetTypeNameWithFixedSizeIntegers` always emits `uint{}_t` (unsigned) even for signed integer types.\nWhen the function encounters a builtin integer type it calls `fmt::format(\"uint{}_t\", size)` regardless of signedness.\nThis causes signed function parameter types (e.g. `int`, `long`) to be mapped to their unsigned counterparts in the generated thunk code, producing incorrect prototypes and possible ABI mismatches when calling the host library.","fix":"Check the sign of the type and emit `int{}_t` for signed types: `fmt::format(\"{}{}_t\", type->isSignedIntegerType() ? \"\" : \"u\", size)`.","locations":[{"ref":"ThunkLibs/Generator/data_layout.cpp:199-207","code":"  199 |   if (type->isBuiltinType() && type->isIntegerType()) {\n  200 |     auto size = context.getTypeSize(type);\n  201 |     return fmt::format(\"uint{}_t\", size);\n  202 |   } else if (type->isPointerType() && type->getPointeeType()->isBuiltinType() && type->getPointeeType()->isIntegerType() &&\n  203 |              context.getTypeSize(type->getPointeeType()) > 8) {\n  204 |     // TODO: Also apply this path to char-like types\n  205 |     auto size = context.getTypeSize(type->getPointeeType());\n  206 |     return fmt::format(\"uint{}_t*\", size);\n  207 |   } else {","lines":9,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/Generator/data_layout.cpp#L199-L207"}]},
{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"LookupHostVisualInfo calls std::abort() if HostXGetVisualInfo returns num_matches != 1 (line 317-319). However, it does NOT free the return value from HostXGetVisualInfo before aborting when num_matches > 1 (ret is non-null but multiple results were returned). More critically, all call sites of LookupHostVisualInfo pass the result directly into a GL function and then immediately HostXFree it. If LookupHostVisualInfo aborts, none of those callers can recover - aborting the entire process for what could be a recoverable visual mismatch is excessively aggressive for a guest-facing API. Additionally, if HostXGetVisualInfo returns num_matches == 0, ret is null and the caller function immediately XFree(nullptr), which is safe, but then HostInfo is null and the subsequent fexldr_ptr call passes null to the real GL function, which is undefined behavior per GLX spec.","fix":"Return null from LookupHostVisualInfo on mismatch and let callers propagate a GL error rather than aborting. Also free ret when num_matches > 1 before returning.","locations":[{"ref":"ThunkLibs/libGL/libGL_Host.cpp:309-322","code":"  309 | static XVisualInfo* LookupHostVisualInfo(Display* HostDisplay, guest_layout<XVisualInfo*> GuestInfo) {\n  310 |   if (!GuestInfo.data) {\n  311 |     return nullptr;\n  312 |   }\n  313 | \n  314 |   int num_matches;\n  315 |   auto HostInfo = host_layout<XVisualInfo> {*GuestInfo.get_pointer()}.data;\n  316 |   auto ret = x11_manager.HostXGetVisualInfo(HostDisplay, uint64_t {VisualScreenMask | VisualIDMask}, &HostInfo, &num_matches);\n  317 |   if (num_matches != 1) {\n  318 |     fprintf(stderr, \"ERROR: Did not find unique host XVisualInfo\\n\");\n  319 |     std::abort();\n  320 |   }\n  321 |   return ret;\n  322 | }","lines":14,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/libGL/libGL_Host.cpp#L309-L322"},{"ref":"ThunkLibs/libGL/libGL_Host.cpp:379-382","code":"  379 |   auto HostInfo = LookupHostVisualInfo(Display, Info);\n  380 |   auto ret = fexldr_ptr_libGL_glXGetFBConfigFromVisualSGIX(Display, HostInfo);\n  381 |   x11_manager.HostXFree(HostInfo);\n  382 |   return ret;","lines":4,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/libGL/libGL_Host.cpp#L379-L382"},{"ref":"ThunkLibs/libGL/libGL_Host.cpp:393-397","code":"  393 | GLXContext fexfn_impl_libGL_glXCreateContext(Display* Display, guest_layout<XVisualInfo*> Info, GLXContext ShareList, Bool Direct) {\n  394 |   auto HostInfo = LookupHostVisualInfo(Display, Info);\n  395 |   auto ret = fexldr_ptr_libGL_glXCreateContext(Display, HostInfo, ShareList, Direct);\n  396 |   x11_manager.HostXFree(HostInfo);\n  397 |   return ret;","lines":5,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/libGL/libGL_Host.cpp#L393-L397"}]},
{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"MapToGuestVisualInfo calls std::abort() when GuestXGetVisualInfo returns num_matches != 1 (line 341-343). When aborting, HostInfo has already been read but HostXFree(HostInfo) at line 347 is NOT reached, leaking the host-side XVisualInfo allocation. If the abort path is taken, the host X11 resource from the caller (e.g. the result of glXGetVisualFromFBConfig) is leaked.","fix":"Call x11_manager.HostXFree(HostInfo) before std::abort() on the mismatch path, or restructure to free it in a RAII wrapper.","locations":[{"ref":"ThunkLibs/libGL/libGL_Host.cpp:339-347","code":"  339 |   auto ret = x11_manager.GuestXGetVisualInfo(guest_display.get_pointer(), VisualScreenMask | VisualIDMask, &GuestInfo, &num_matches);\n  340 | \n  341 |   if (num_matches != 1) {\n  342 |     fprintf(stderr, \"ERROR: Did not find unique guest XVisualInfo\\n\");\n  343 |     std::abort();\n  344 |   }\n  345 | \n  346 |   // We effectively relocated the VisualInfo, so free the original one now\n  347 |   x11_manager.HostXFree(HostInfo);","lines":9,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/libGL/libGL_Host.cpp#L339-L347"}]},
{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"SDL_snprintf and SDL_vsnprintf stubs completely ignore their output buffer and format arguments. Any caller that uses SDL_snprintf to build a string (e.g. SDL_snprintf(buf, sizeof(buf), \"%d\", value)) will have the buffer left unmodified and receive a meaningless return value (~20, the length of the fixed printf string). This silently corrupts any string-building logic that relies on these functions.","fix":"Implement real wrappers: int SDL_snprintf(char* text, size_t maxlen, const char* fmt, ...) { va_list ap; va_start(ap, fmt); int r = vsnprintf(text, maxlen, fmt, ap); va_end(ap); return r; } and similarly for SDL_vsnprintf.","locations":[{"ref":"ThunkLibs/libSDL2/libSDL2_Guest.cpp:31-33","code":"   31 | int SDL_snprintf(char*, size_t, const char*, ...) {\n   32 |   return printf(\"SDL2: SDL_snprintf\\n\");\n   33 | }","lines":3,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/libSDL2/libSDL2_Guest.cpp#L31-L33"},{"ref":"ThunkLibs/libSDL2/libSDL2_Guest.cpp:68-70","code":"   68 | int SDL_vsnprintf(char*, size_t, const char*, __va_list_tag*) {\n   69 |   return printf(\"SDL2: SDL_vsnprintf\\n\");\n   70 | }","lines":3,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/libSDL2/libSDL2_Guest.cpp#L68-L70"}]},
{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"SDL_GL_GetProcAddress unconditionally calls glXGetProcAddress, hardcoding the assumption that SDL2 uses the GLX/X11 backend. If SDL2 is initialized with the Wayland video driver (SDL_VIDEODRIVER=wayland) or any EGL-based backend, glXGetProcAddress is from a library that may not be loaded and is the wrong API. The correct approach is to call SDL's own internal mechanism or conditionally use eglGetProcAddress.","fix":"Check at runtime which backend SDL2 is using. If EGL is available (e.g., eglGetDisplay != NULL), use eglGetProcAddress instead. The safest fix is to call the thunked SDL_GL_GetProcAddress on the host side rather than reimplementing it.","locations":[{"ref":"ThunkLibs/libSDL2/libSDL2_Guest.cpp:76-79","code":"   76 | void* SDL_GL_GetProcAddress(const char* name) {\n   77 |   // TODO: Fix this HACK\n   78 |   return (void*)glXGetProcAddress((const GLubyte*)name);\n   79 | }","lines":4,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/libSDL2/libSDL2_Guest.cpp#L76-L79"}]},
{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In cephes_f128_ldexpl (floorll.c), when `pw2 > 0` and the input is denormal (exponent == 0), the code multiplies by 2 and decrements pw2 in a loop. However, if pw2 transitions from positive to 0 inside the while loop, the `if (pw2 == 0) return(u.y)` check at line 299 returns early before the outer exponent-manipulation code at lines 306-336 runs. But if pw2 transitions from positive to negative (e.g. pw2 started at 1 and the multiply pushed the number still denormal, then the `if (pw2 > 0)` block does not execute and `if (pw2 < 0)` fires), the multiply loop can interact incorrectly with the subtraction-bug already noted above. The overall denormal-handling loop has no bound check: if the denormal is so small that multiplying by 2 never normalizes it within 113 iterations, the loop could run for a very long time.","fix":"Add a loop-count guard (similar to the `i > -115` guard in cephes_f128_frexpl). After fixing the f128_sub -> f128_mul bug, also add a bound like `if (iterations > 113) return zero;` to prevent potential infinite loops with unusual inputs.","locations":[{"ref":"External/cephes/src/128bit/floorll.c:279-304","code":"  279 | u.y = x;\n  280 | while( (e = (u.sh[EXPOFS] & 0x7fffL)) == 0 )\n  281 |         {\n  282 | #if DENORMAL\n  283 |         if( f128_eq(&state, u.y, zero))\n  284 |                 {\n  285 |                 return zero;\n  286 |                 }\n  287 | /* Input is denormal. */\n  288 |         if( pw2 > 0 )\n  289 |                 {\n  290 |                 u.y = f128_mul(&state, u.y, f_2_p0);\n  291 |                 pw2 -= 1;\n  292 |                 }\n  293 |         if( pw2 < 0 )\n  294 |                 {\n  295 |                 if( pw2 < -113 )\n  296 |                         return zero;\n  297 |                 u.y = f128_sub(&state, u.y, f_0_p5);\n  298 |                 pw2 += 1;\n  299 |                 }\n  300 |         if( pw2 == 0 )\n  301 |                 return(u.y);\n  302 | #else\n  303 |         return zero;\n  304 | #endif","lines":26,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/External/cephes/src/128bit/floorll.c#L279-L304"}]},
{"id":"LOGIC_34","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"BitSet::Allocate and Realloc have a fundamentally wrong assertion:\n\n  LOGMAN_THROW_A_FMT((AllocateSize * MinimumSize) >= Elements, \"Fail\")\n\nAllocateSize is already the byte count (result of ToBytes).  Multiplying by MinimumSize\n(sizeof(ElementType), e.g. 4 for uint32_t) inflates it by a factor of MinimumSize, so the\nassertion nearly always passes trivially and provides no real overflow protection.  The\nintended check is that the allocated region in bits is >= the requested element count:\n  (AllocateSize * MinimumSizeBits) >= Elements","fix":"Change `AllocateSize * MinimumSize` to `AllocateSize * MinimumSizeBits` in both assertions.","locations":[{"ref":"FEXCore/Source/Common/BitSet.h:23-25","code":"   23 |     size_t AllocateSize = ToBytes(Elements);\n   24 |     LOGMAN_THROW_A_FMT((AllocateSize * MinimumSize) >= Elements, \"Fail\");\n   25 |     Memory = static_cast<ElementType*>(FEXCore::Allocator::malloc(AllocateSize));","lines":3,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Common/BitSet.h#L23-L25"},{"ref":"FEXCore/Source/Common/BitSet.h:27-30","code":"   27 |   void Realloc(size_t Elements) {\n   28 |     size_t AllocateSize = ToBytes(Elements);\n   29 |     LOGMAN_THROW_A_FMT((AllocateSize * MinimumSize) >= Elements, \"Fail\");\n   30 |     Memory = static_cast<ElementType*>(FEXCore::Allocator::realloc(Memory, AllocateSize));","lines":4,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Common/BitSet.h#L27-L30"}]},
{"id":"LOGIC_35","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In SoftFloat.h FREM, when HandleInfinityOp already set the invalid flag and returned the\nresult, the code still only checks the dividend (lhs) for the zero-divisor condition - the\ninfinity guard does not check the divisor (rhs) for infinity.  The Intel spec defines\nFPREM(finite, +/-Inf) as the dividend unchanged (not invalid), but this path falls through\nto the full quotient computation, which may produce an unexpected QNaN from softfloat\nbecause extF80_div(finite, Inf) returns zero, and extF80_roundToInt(0) then correctly gives\nzero Q, returning lhs unchanged anyway.  However HandleInfinityOp also incorrectly fires for\nthe case where lhs is +/-Inf with significand = 0x8000...0 (the canonical extended-precision\ninfinity), setting invalid and returning QNaN, whereas Intel's spec says FPREM(Inf, x) is\nthe invalid case.  When lhs is a signaling NaN with the integer bit set and lower bits zero,\nIsNan would return false but HandleInfinityOp would treat it as infinity.","fix":"Audit the HandleInfinityOp predicate against the Intel manual to distinguish SNaN from infinity, and handle the FPREM(x, Inf) = x case separately.","locations":[{"ref":"FEXCore/Source/Common/SoftFloat.h:162-211","code":"  162 | #else\n  163 |     /*\n  164 |      * Check for invalid operation cases first - Intel FPREM sets Invalid Operation\n  165 |      * for several cases including infinity dividend and zero divisor.\n  166 |      */\n  167 |     X80SoftFloat result = 0;\n  168 |     if (HandleInfinityOp(state, lhs, result)) {\n  169 |       return result;\n  170 |     } else if (lhs.Top.Exponent == 0x7FFF && (lhs.Significand & 0x7FFFFFFFFFFFFFFFULL)) { // NaN\n  171 |       // propagate NaN\n  172 |       state->exceptionFlags |= softfloat_flag_invalid;\n  173 |       return lhs;\n  174 |     }\n  175 | \n  176 |     // Check for zero divisor - fprem(x, 0) is invalid operation\n  177 |     if (rhs.Top.Exponent == 0 && rhs.Significand == 0) {\n  178 |       state->exceptionFlags |= softfloat_flag_invalid;\n  179 |       // Return QNaN\n  180 |       result.Top.Sign = 0;\n  181 |       result.Top.Exponent = 0x7FFF;\n  182 |       result.Significand = 0xC000000000000000ULL;\n  183 |       return result;\n  184 |     }\n  185 | \n  186 |     /*\n  187 |      * FPREM is not an IEEE-754 remainder.  From the Intel spec:\n  188 |      *\n  189 |      *    Computes the remainder obtained from dividing the value in the ST(0)\n  190 |      *    register (the dividend) by the value in the ST(1) register (the divisor\n  191 |      *    or modulus), and stores the result in ST(0). The remainder represents the\n  192 |      *    following value:\n  193 |      *\n  194 |      *    Remainder := ST(0) − (Q * ST(1))\n  195 |      *\n  196 |      *    Here, Q is an integer value that is obtained by truncating the\n  197 |      *    floating-point number quotient of [ST(0) / ST(1)] toward zero.\n  198 |      *\n  199 |      * We implement this sequence literally. softfloat_round_minMag means\n  200 |      * \"truncate towards zero\".\n  201 |      */\n  202 |     extFloat80_t quotient = extF80_div(state, lhs, rhs);\n  203 |     extFloat80_t Q = extF80_roundToInt(state, quotient, softfloat_round_minMag, true);\n  204 |     bool Q_zero = Q.signif == 0 && (Q.signExp & ~(1 << 15)) == 0;\n  205 | \n  206 |     if (Q_zero) {\n  207 |       return lhs;\n  208 |     } else {\n  209 |       return extF80_sub(state, lhs, extF80_mul(state, Q, rhs));\n  210 |     }\n  211 | #endif","lines":50,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Common/SoftFloat.h#L162-L211"}]},
{"id":"LOGIC_36","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In ReloadMetaLayer, the RootFS search loop (and the identical ThunkConfig loop) iterates over all {Global=true,false} x {GetDataDirectory, GetConfigDirectory} combinations without stopping on the first match. Each matching path calls Set(), so when multiple candidate paths exist on disk, the last one in iteration order wins rather than the highest-priority one. The iteration order is: global-data, global-config, local-data, local-config - so a local config match would override a global data match, which is probably the opposite of what users expect for a 'search and stop' lookup.","fix":"Add `goto` or restructure with a flag to break out of both loops after the first successful Set() call, mirroring the intent described in the comment 'let's see if it exists in the fex-emu folder'.","locations":[{"ref":"FEXCore/Source/Interface/Config/Config.cpp:372-381","code":"  372 |       const auto PathNameCopy = *PathName;\n  373 |       for (auto Global : {true, false}) {\n  374 |         for (auto DirectoryFetchers : {GetDataDirectory, GetConfigDirectory}) {\n  375 |           fextl::string NamedRootFS = DirectoryFetchers(Global) + \"RootFS/\" + PathNameCopy;\n  376 |           if (FHU::Filesystem::Exists(NamedRootFS)) {\n  377 |             FEXCore::Config::Set(FEXCore::Config::CONFIG_ROOTFS, NamedRootFS);\n  378 |           }\n  379 |         }\n  380 |       }\n  381 |     }","lines":10,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Config/Config.cpp#L372-L381"},{"ref":"FEXCore/Source/Interface/Config/Config.cpp:398-409","code":"  398 |       // If the filesystem doesn't exist then let's see if it exists in the fex-emu folder\n  399 |       const auto PathNameCopy = *PathName;\n  400 |       for (auto Global : {true, false}) {\n  401 |         for (auto DirectoryFetchers : {GetDataDirectory, GetConfigDirectory}) {\n  402 |           fextl::string NamedConfig = DirectoryFetchers(Global) + \"ThunkConfigs/\" + PathNameCopy;\n  403 |           if (FHU::Filesystem::Exists(NamedConfig)) {\n  404 |             FEXCore::Config::Set(FEXCore::Config::CONFIG_THUNKCONFIG, NamedConfig);\n  405 |           }\n  406 |         }\n  407 |       }\n  408 |     }\n  409 |   }","lines":12,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Config/Config.cpp#L398-L409"}]},
{"id":"LOGIC_37","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"Function_8000_0008h (AMD CPUID leaf) encodes `std::bit_ceil(Cores) << 12` for the ApicIdCoreIdSize field (ECX[15:12]). Per the AMD APM, this field specifies the number of APIC ID bits used to enumerate cores within a package - it is a bit-width, not the rounded-up core count. For example, with 8 cores, `std::bit_ceil(8) = 8`, but the field should contain 3 (since 2^3 = 8). The correct expression is `std::bit_width(std::max<size_t>(1, Cores) - 1)` or equivalent, not `std::bit_ceil(Cores)`. Guest software that uses this to decode APIC IDs will get wrong results.","fix":"Replace `std::bit_ceil(Cores)` with the number of bits needed: `std::bit_width(std::max<size_t>(1, Cores) - 1)` (returns 0 for 0-1 cores, 1 for 2, 2 for 3-4, 3 for 5-8, etc.).","locations":[{"ref":"FEXCore/Source/Interface/Core/CPUID.cpp:1225-1228","code":" 1225 |   uint32_t CoreCount = Cores - 1;\n 1226 |   Res.ecx = (0 << 16) |                    // PerfTscSize: Performance timestamp count size\n 1227 |             (std::bit_ceil(Cores) << 12) | // ApicIdSize: Number of bits in ApicID\n 1228 |             (CoreCount << 0);              // Count count subtract one","lines":4,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/CPUID.cpp#L1225-L1228"}]},
{"id":"LOGIC_38","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"RunFunctionName silently falls through to Function_8000_0004h for any Function value that is neither 0x8000'0002 nor 0x8000'0003. The else-branch has no ASSERT or error logging. Any caller passing an unexpected Function value (e.g. 0x8000'0005) would silently receive brand-string-part-3 data, producing wrong CPUID results and making bugs hard to diagnose.","fix":"Add an LOGMAN_THROW_A_FMT or explicit else-if for 0x8000'0004 with a terminal assertion in the trailing else, mirroring how RunFunction handles unknown functions via Function_Reserved.","locations":[{"ref":"FEXCore/Source/Interface/Core/CPUID.h:60-68","code":"   60 |   FEXCore::CPUID::FunctionResults RunFunctionName(uint32_t Function, uint32_t Leaf, uint32_t CPU) const {\n   61 |     if (Function == 0x8000'0002U) {\n   62 |       return Function_8000_0002h(Leaf, CPU % PerCPUData.size());\n   63 |     } else if (Function == 0x8000'0003U) {\n   64 |       return Function_8000_0003h(Leaf, CPU % PerCPUData.size());\n   65 |     } else {\n   66 |       return Function_8000_0004h(Leaf, CPU % PerCPUData.size());\n   67 |     }\n   68 |   }","lines":9,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/CPUID.h#L60-L68"}]},
{"id":"LOGIC_39","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"IsWriteEnabled reads CodeMapFD (a std::optional<int>) at lines 152 and 161 without holding the Mutex, while line 168 (under exclusive lock) may write it. This is a data race: std::optional<int> is not atomic. The fast-path check at line 161 ('if (CodeMapFD) return true;') exists to avoid locking when the FD is already open, but concurrent reads and writes to a non-atomic object produce undefined behavior in C++.","fix":"Either use std::atomic<int> with a sentinel value (e.g. -2 for nullopt, -1 for 'denied') instead of std::optional<int>, or read CodeMapFD under at least a shared lock for the optimistic check at line 161.","locations":[{"ref":"FEXCore/Source/Interface/Core/CodeCache.cpp:157-178","code":"  157 | bool CodeMapWriter::IsWriteEnabled(const ExecutableFileSectionInfo& Section) {\n  158 |   if (CodeMapFD == -1) {\n  159 |     return false;\n  160 |   }\n  161 | \n  162 |   // PV libraries can't yet be read by FEXServer, so skip dumping them\n  163 |   if (Section.FileInfo.Filename.starts_with(\"/run/pressure-vessel\")) {\n  164 |     return false;\n  165 |   }\n  166 | \n  167 |   if (CodeMapFD) {\n  168 |     return true;\n  169 |   }\n  170 | \n  171 |   // Acquire mutex and re-check CodeMapFD to avoid race conditions\n  172 |   auto lk = std::unique_lock {Mutex};\n  173 |   if (!CodeMapFD) {\n  174 |     CodeMapFD = FileOpener.OpenCodeMapFile();\n  175 |   }\n  176 | \n  177 |   return CodeMapFD != -1;\n  178 | }","lines":22,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/CodeCache.cpp#L157-L178"}]},
{"id":"LOGIC_40","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In CompileBlock, after CompileCode returns a cached block hit (DebugData == nullptr, meaning another thread raced in), the function returns the host code pointer directly (line 869). However if CodeCache.IsGeneratingCache is true, the caller at line 912 will skip ClearRelocations(), and the previous code path (race case) also skips clearing relocations (line 963 in CompileSingleStep clears them). In the race path in CompileBlock (line 867-870), ClearRelocations is never called. If the JIT backend accumulates relocations during the IR compilation that happened before detecting the race, those relocations remain pending and may be applied incorrectly to the next compiled block.","fix":"Call Thread->CPUBackend->ClearRelocations() in the early-exit race path (after line 869) when !CodeCache.IsGeneratingCache, matching the non-race path at line 913.","locations":[{"ref":"FEXCore/Source/Interface/Core/Core.cpp:936-943","code":"  936 |   auto [CompiledCode, DebugData, StartAddr, Length, NeedsAddGuestCodeRanges] = CompileCode(Thread, GuestRIP, MaxInst);\n  937 |   auto CodePtr = CompiledCode.EntryPoints[GuestRIP];\n  938 |   if (CodePtr == nullptr) {\n  939 |     return 0;\n  940 |   } else if (!DebugData) {\n  941 |     // DebugData wasn't populated, indicating another thread raced us for compiling this block\n  942 |     return reinterpret_cast<uintptr_t>(CodePtr);\n  943 |   }","lines":8,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/Core.cpp#L936-L943"}]},
{"id":"LOGIC_41","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"EmitF64FYL2XP1 performs 1+x in double precision before running the same LUT-based log2 path as FYL2X (comment at line 1711-1714 acknowledges 1-2 ulp loss). The x87 FYLX2P1 instruction is specifically defined for x in (-1, 1) to allow higher precision near x=0 via log2(1+x) computed without cancellation. Computing 1+x in F64 then passing it to the log2 path loses the precision advantage entirely and can produce results that differ from the x87 spec by more than 1 ulp, silently breaking applications that rely on FPYL2XP1 precision.","fix":"Either fall back unconditionally to the ABI handler for FYL2XP1 (highest fidelity) or implement a compensated log1p path. At minimum, document the precision loss as a known limitation in the comment.","locations":[{"ref":"FEXCore/Source/Interface/Core/Dispatcher/Dispatcher.cpp:1709-1810","code":" 1709 | // JIT-inlined double-precision y * log2(1 + x) for the F64 reduced precision x87 path.\n 1710 | // Input: VTMP1 = x, VTMP2 = y. Output: VTMP1 = y * log2(1 + x).\n 1711 | // Computes v = 1 + x in F64 and runs the same LUT-based log2 as F64FYL2X.\n 1712 | // Loses 1-2 ulps of precision near x=0 (FYL2XP1's original purpose) but\n 1713 | // matches main's lowering and avoids the range-check cliff into a fallback.\n 1714 | void Dispatcher::EmitF64FYL2XP1(F64Log2Constants& C) {\n 1715 |   F64FYL2XP1HandlerAddress = GetCursorAddress<uint64_t>();\n 1716 | \n 1717 |   constexpr auto Accum = ARMEmitter::VReg::v2;\n 1718 | \n 1719 |   ARMEmitter::ForwardLabel Fallback;\n 1720 | \n 1721 |   str<ARMEmitter::IndexType::PRE>(ARMEmitter::QReg::q2, ARMEmitter::Reg::rsp, -16);\n 1722 | \n 1723 |   mrs(TMP1, ARMEmitter::SystemRegister::NZCV);\n 1724 |   str(TMP1.W(), STATE.R(), offsetof(FEXCore::Core::CpuStateFrame, State.flags[24]));\n 1725 | \n 1726 |   // v = 1 + x in Accum so VTMP1/VTMP2 still hold the original x/y at the fallback.\n 1727 |   ldr(Accum.D(), &C.One);\n 1728 |   fadd(Accum.D(), VTMP1.D(), Accum.D());\n 1729 | \n 1730 |   // Reject v <= 0, subnormal, NaN, Inf via v's bits in TMP1.\n 1731 |   fmov(ARMEmitter::Size::i64Bit, TMP1, Accum.D());\n 1732 |   (void)tbnz(TMP1, 63, &Fallback);\n 1733 |   lsr(ARMEmitter::Size::i64Bit, TMP2, TMP1, 52);\n 1734 |   (void)cbz(ARMEmitter::Size::i64Bit, TMP2, &Fallback);\n 1735 |   cmp(ARMEmitter::Size::i64Bit, TMP2, 0x7FF);\n 1736 |   (void)b(ARMEmitter::Condition::CC_EQ, &Fallback);\n 1737 |   fmov(ARMEmitter::Size::i64Bit, TMP3, VTMP2.D());\n 1738 | \n 1739 |   // k = unbiased exponent; m bits = mantissa | (0x3FF << 52).\n 1740 |   sub(ARMEmitter::Size::i64Bit, TMP2, TMP2, 1023);\n 1741 |   ubfx(ARMEmitter::Size::i64Bit, TMP1, TMP1, 0, 52);\n 1742 |   movz(ARMEmitter::Size::i64Bit, TMP4, 0x3FF0, 48);\n 1743 |   orr(ARMEmitter::Size::i64Bit, TMP1, TMP1, TMP4);\n 1744 | \n 1745 |   // Index = top 6 mantissa bits (bits 51..46 of m).\n 1746 |   ubfx(ARMEmitter::Size::i64Bit, TMP4, TMP1, 46, 6);\n 1747 | \n 1748 |   // Set m as F64 in VTMP1.\n 1749 |   fmov(ARMEmitter::Size::i64Bit, VTMP1.D(), TMP1);\n 1750 | \n 1751 |   // Load (recip, logc) from LUT[index].\n 1752 |   (void)adr(TMP1, &C.Table);\n 1753 |   add(ARMEmitter::Size::i64Bit, TMP1, TMP1, TMP4, ARMEmitter::ShiftType::LSL, 4);\n 1754 |   ldp<ARMEmitter::IndexType::OFFSET>(VTMP2.D(), Accum.D(), TMP1, 0);\n 1755 | \n 1756 |   // Stash logc bits in TMP4 so Accum can be reused for the polynomial.\n 1757 |   fmov(ARMEmitter::Size::i64Bit, TMP4, Accum.D());\n 1758 | \n 1759 |   // r = recip * m - 1.\n 1760 |   fmul(VTMP1.D(), VTMP2.D(), VTMP1.D());\n 1761 |   ldr(VTMP2.D(), &C.One);\n 1762 |   fsub(VTMP1.D(), VTMP1.D(), VTMP2.D());\n 1763 | \n 1764 |   // Horner: poly = a0 + r*(a1 + r*(a2 + ... + r*a7)).\n 1765 |   ldr(Accum.D(), &C.A7);\n 1766 |   ldr(VTMP2.D(), &C.A6);\n 1767 |   fmadd(Accum.D(), VTMP1.D(), Accum.D(), VTMP2.D());\n 1768 |   ldr(VTMP2.D(), &C.A5);\n 1769 |   fmadd(Accum.D(), VTMP1.D(), Accum.D(), VTMP2.D());\n 1770 |   ldr(VTMP2.D(), &C.A4);\n 1771 |   fmadd(Accum.D(), VTMP1.D(), Accum.D(), VTMP2.D());\n 1772 |   ldr(VTMP2.D(), &C.A3);\n 1773 |   fmadd(Accum.D(), VTMP1.D(), Accum.D(), VTMP2.D());\n 1774 |   ldr(VTMP2.D(), &C.A2);\n 1775 |   fmadd(Accum.D(), VTMP1.D(), Accum.D(), VTMP2.D());\n 1776 |   ldr(VTMP2.D(), &C.A1);\n 1777 |   fmadd(Accum.D(), VTMP1.D(), Accum.D(), VTMP2.D());\n 1778 |   ldr(VTMP2.D(), &C.A0);\n 1779 |   fmadd(Accum.D(), VTMP1.D(), Accum.D(), VTMP2.D());\n 1780 | \n 1781 |   // log2(1+r) = r * Accum.\n 1782 |   fmul(VTMP1.D(), VTMP1.D(), Accum.D());\n 1783 | \n 1784 |   // log2(v) = log2(1+r) + log2(center[i]) + k.\n 1785 |   fmov(ARMEmitter::Size::i64Bit, VTMP2.D(), TMP4);\n 1786 |   fadd(VTMP1.D(), VTMP1.D(), VTMP2.D());\n 1787 |   scvtf(ARMEmitter::Size::i64Bit, VTMP2.D(), TMP2);\n 1788 |   fadd(VTMP1.D(), VTMP1.D(), VTMP2.D());\n 1789 | \n 1790 |   // result = y * log2(v).\n 1791 |   fmov(ARMEmitter::Size::i64Bit, VTMP2.D(), TMP3);\n 1792 |   fmul(VTMP1.D(), VTMP1.D(), VTMP2.D());\n 1793 | \n 1794 |   ldr(TMP1.W(), STATE.R(), offsetof(FEXCore::Core::CpuStateFrame, State.flags[24]));\n 1795 |   msr(ARMEmitter::SystemRegister::NZCV, TMP1);\n 1796 | \n 1797 |   ldr<ARMEmitter::IndexType::POST>(ARMEmitter::QReg::q2, ARMEmitter::Reg::rsp, 16);\n 1798 |   ret();\n 1799 | \n 1800 |   // Fallback path: VTMP1/VTMP2 still hold the original x/y.\n 1801 |   (void)Bind(&Fallback);\n 1802 |   ldr(TMP1.W(), STATE.R(), offsetof(FEXCore::Core::CpuStateFrame, State.flags[24]));\n 1803 |   msr(ARMEmitter::SystemRegister::NZCV, TMP1);\n 1804 |   ldr<ARMEmitter::IndexType::POST>(ARMEmitter::QReg::q2, ARMEmitter::Reg::rsp, 16);\n 1805 |   str<ARMEmitter::IndexType::PRE>(ARMEmitter::XReg::lr, ARMEmitter::Reg::rsp, -16);\n 1806 |   ldr(TMP1, STATE_PTR(CpuStateFrame, Pointers.FallbackHandlerPointers[FEXCore::Core::OPINDEX_F64FYL2XP1].ABIHandler));\n 1807 |   ldr(TMP4, STATE_PTR(CpuStateFrame, Pointers.FallbackHandlerPointers[FEXCore::Core::OPINDEX_F64FYL2XP1].Func));\n 1808 |   blr(TMP1);\n 1809 |   ldr<ARMEmitter::IndexType::POST>(ARMEmitter::XReg::lr, ARMEmitter::Reg::rsp, 16);\n 1810 |   ret();","lines":102,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/Dispatcher/Dispatcher.cpp#L1709-L1810"}]},
{"id":"LOGIC_42","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In the FABI_F80x2_I16_F80_PTR case of GenerateABICall (lines 2498-2520) the GenerateIndirectRuntimeCall path is commented out with a stub comment, so when DisableVixlIndirectCalls is false (the common case expressed via [[unlikely]]) the call is silently skipped. Only the direct blr path is emitted. This means the indirect-call validation is not performed for this ABI variant, which could allow a bad function pointer to go unchecked in the Vixl simulator.","fix":"Uncomment or implement the GenerateIndirectRuntimeCall line for FABI_F80x2_I16_F80_PTR, using the correct type FEXCore::VectorRegPairType or an equivalent workaround.","locations":[{"ref":"FEXCore/Source/Interface/Core/Dispatcher/Dispatcher.cpp:2513-2517","code":" 2513 |     if (!CTX->Config.DisableVixlIndirectCalls) [[unlikely]] {\n 2514 |       // GenerateIndirectRuntimeCall<FEXCore::VectorRegPairType, uint16_t, FEXCore::VectorRegType, uint64_t>(FallbackPointerReg);\n 2515 |     } else {\n 2516 |       blr(FallbackPointerReg);\n 2517 |     }","lines":5,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/Dispatcher/Dispatcher.cpp#L2513-L2517"}]},
{"id":"LOGIC_43","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In the FABI_F64x2_F64_PTR case of GenerateABICall (lines 2521-2542) the GenerateIndirectRuntimeCall is similarly commented out. The direct blr path is still present so runtime execution is fine, but the vixl indirect-call type-checking is absent for this ABI.","fix":"Uncomment or implement the GenerateIndirectRuntimeCall line for FABI_F64x2_F64_PTR.","locations":[{"ref":"FEXCore/Source/Interface/Core/Dispatcher/Dispatcher.cpp:2535-2538","code":" 2535 |     if (!CTX->Config.DisableVixlIndirectCalls) [[unlikely]] {\n 2536 |       // GenerateIndirectRuntimeCall<FEXCore::VectorScalarF64Pair, FEXCore::VectorRegType, uint64_t>(FallbackPointerReg);\n 2537 |     } else {\n 2538 |       blr(FallbackPointerReg);","lines":4,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/Dispatcher/Dispatcher.cpp#L2535-L2538"}]},
{"id":"LOGIC_44","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In DirectBlockDelinker, the branch offset is computed as `JumpThunkStartAddress / 4 - CallerAddress / 4`. ARM64 branch offsets are signed instruction-count deltas: the correct formula is `(TargetAddress - CallerAddress) / 4`, i.e. `(JumpThunkStartAddress - CallerAddress) / 4`. Dividing each address independently by 4 before subtracting produces a wrong offset whenever either address is not a multiple of 16 (most code pointers), making the delinked branch jump to the wrong location.","fix":"Change the offset calculation to `auto BranchOffset = (static_cast<int64_t>(JumpThunkStartAddress) - static_cast<int64_t>(CallerAddress)) / 4;`","locations":[{"ref":"FEXCore/Source/Interface/Core/JIT/JIT.cpp:500-516","code":"  500 | static void DirectBlockDelinker(FEXCore::Context::ExitFunctionLinkData* Record, bool Call) {\n  501 |   uintptr_t JumpThunkStartAddress = reinterpret_cast<uintptr_t>(Record) - 0x10;\n  502 |   uintptr_t CallerAddress = JumpThunkStartAddress + Record->CallerOffset;\n  503 |   auto BranchOffset = JumpThunkStartAddress / 4 - CallerAddress / 4;\n  504 | \n  505 |   // Replace the patched callsite with a branch to the jump thunk.\n  506 |   uint32_t BranchInst = 0;\n  507 |   ARMEmitter::Emitter BranchEmit(reinterpret_cast<uint8_t*>(&BranchInst), 4);\n  508 |   if (Call) {\n  509 |     BranchEmit.bl(BranchOffset);\n  510 |   } else {\n  511 |     BranchEmit.b(BranchOffset);\n  512 |   }\n  513 | \n  514 |   std::atomic_ref<uint32_t>(*reinterpret_cast<uint32_t*>(CallerAddress)).store(BranchInst, std::memory_order::relaxed);\n  515 |   ARMEmitter::Emitter::ClearICache(reinterpret_cast<void*>(CallerAddress), 4);\n  516 | }","lines":17,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/JIT/JIT.cpp#L500-L516"}]},
{"id":"LOGIC_45","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In DEF_OP(PopTwo), after setting Dst1 = zr when Dst1==Dst2, the assertion `LOGMAN_THROW_A_FMT(Dst1 != Dst2, \"Invalid\")` is always false because Dst1 was just changed to zr and Dst2 still holds the original value, so Dst1 != Dst2 is now trivially true. The intent is clearly to fire on equal destinations before the zr override, but the assertion is placed after the fixup and thus can never trigger. In a debug build the assertion that was supposed to detect the problematic condition is bypassed.","fix":"Move the `LOGMAN_THROW_A_FMT(Dst1 != Dst2, ...)` assertion to before the `if (Dst1 == Dst2)` fixup block, or remove it since the fixup already handles the case.","locations":[{"ref":"FEXCore/Source/Interface/Core/JIT/MemoryOps.cpp:1615-1621","code":" 1615 |   // ldp x, x is invalid. Explicitly discard the first destination to encode.\n 1616 |   if (Dst1 == Dst2) {\n 1617 |     Dst1 = ARMEmitter::Reg::zr;\n 1618 |   }\n 1619 | \n 1620 |   LOGMAN_THROW_A_FMT(Dst1 != Addr && Dst2 != Addr, \"Invalid\");\n 1621 |   LOGMAN_THROW_A_FMT(Dst1 != Dst2, \"Invalid\");","lines":7,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/JIT/MemoryOps.cpp#L1615-L1621"}]},
{"id":"LOGIC_46","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In DEF_OP(MemSet), the direction check uses `tbnz(DirectionReg, 1, &BackwardImpl)` (bit 1, i.e. value 2). The DF (direction flag) is stored sign-extended as 1 or -1 (0xFF...FF). Bit 1 of 1 is 0 (forward) and bit 1 of -1 (0xFF...FF) is 1 (backward), which coincidentally works for the -1 case. However the comment and the constant check `LOGMAN_THROW_A_FMT(DirectionConstant == 1 || DirectionConstant == -1)` confirm only those two values are expected. Checking bit 0 (`tbnz(DirectionReg, 0, ...)`) would be more direct and correct for the -1 case since bit 0 of -1 is also 1. The current bit 1 check works for -1 but would also incorrectly branch to backward for any value with bit 1 set (e.g. 2, 3, -2, -3...) if such a value were ever passed, making this fragile.","fix":"Use `tbnz(DirectionReg, 63, &BackwardImpl)` to check the sign bit directly, which unambiguously distinguishes positive (forward) from negative (backward) directions.","locations":[{"ref":"FEXCore/Source/Interface/Core/JIT/MemoryOps.cpp:1886-1889","code":" 1886 |   if (!DirectionIsInline) {\n 1887 |     // Backward or forwards implementation depends on flag\n 1888 |     (void)tbnz(DirectionReg, 1, &BackwardImpl);\n 1889 |   }","lines":4,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/JIT/MemoryOps.cpp#L1886-L1889"},{"ref":"FEXCore/Source/Interface/Core/JIT/MemoryOps.cpp:2125-2128","code":" 2125 |   if (!DirectionIsInline) {\n 2126 |     // Backward or forwards implementation depends on flag\n 2127 |     (void)tbnz(DirectionReg, 1, &BackwardImpl);\n 2128 |   }","lines":4,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/JIT/MemoryOps.cpp#L2125-L2128"}]},
{"id":"LOGIC_47","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In DEF_OP(MemCpy), FinalizeAddresses() uses TMP1, TMP2, TMP3 for what it calls the 'original' MemRegDest, MemRegSrc and Length registers (lines 2367-2370), but these temporaries are also used as working registers throughout the copy loop. After the copy loop finishes, TMP1/TMP2/TMP3 hold post-loop values, not the original values. The mov() of MemRegDest/MemRegSrc/Length into TMP1/TMP2/TMP3 at lines 2367-2369 is correct, but the FinalizeAddresses lambda subsequently references TMP1 as if it were MemRegDest and TMP2 as MemRegSrc, while the formula `Dst0 = TMP1 + TMP3*scale` would compute the correct end address. The issue is the backward case: `sub(Dst0, TMP1, TMP3)` computes `MemRegDest - Length` but the correct backward final address is `MemRegDest - Length*Size`, matching only size==1. For size > 1 the shift is missing on TMP3. The forward case has the same structural problem (add without shift for size==1 is correct, but the comment says it should be `MemRegDest + Length*Size`).","fix":"Cross-check the FinalizeAddresses formula against the MemSet MakeFinalAddress logic. For size==1 use plain add/sub; for size > 1 apply the LSL shift on Length, matching the MemSet pattern.","locations":[{"ref":"FEXCore/Source/Interface/Core/JIT/MemoryOps.cpp:2220-2250","code":" 2220 |     const auto FinalizeAddresses = [&] {\n 2221 |       if (IsBackwards) {\n 2222 |         switch (Size) {\n 2223 |         case 1:\n 2224 |           sub(Dst0.X(), TMP1, TMP3);\n 2225 |           sub(Dst1.X(), TMP2, TMP3);\n 2226 |           break;\n 2227 |         case 2:\n 2228 |         case 4:\n 2229 |         case 8:\n 2230 |           sub(Dst0.X(), TMP1, TMP3, ARMEmitter::ShiftType::LSL, FEXCore::ilog2(Size));\n 2231 |           sub(Dst1.X(), TMP2, TMP3, ARMEmitter::ShiftType::LSL, FEXCore::ilog2(Size));\n 2232 |           break;\n 2233 |         default: LOGMAN_MSG_A_FMT(\"Unhandled MemCpy size: {}\", Size); break;\n 2234 |         }\n 2235 |       } else {\n 2236 |         switch (Size) {\n 2237 |         case 1:\n 2238 |           add(Dst0.X(), TMP1, TMP3);\n 2239 |           add(Dst1.X(), TMP2, TMP3);\n 2240 |           break;\n 2241 |         case 2:\n 2242 |         case 4:\n 2243 |         case 8:\n 2244 |           add(Dst0.X(), TMP1, TMP3, ARMEmitter::ShiftType::LSL, FEXCore::ilog2(Size));\n 2245 |           add(Dst1.X(), TMP2, TMP3, ARMEmitter::ShiftType::LSL, FEXCore::ilog2(Size));\n 2246 |           break;\n 2247 |         default: LOGMAN_MSG_A_FMT(\"Unhandled MemCpy size: {}\", Size); break;\n 2248 |         }\n 2249 |       }\n 2250 |     };","lines":31,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/JIT/MemoryOps.cpp#L2220-L2250"},{"ref":"FEXCore/Source/Interface/Core/JIT/MemoryOps.cpp:2364-2371","code":" 2364 |     (void)Bind(&DoneInternal);\n 2365 | \n 2366 |     // Needs to use temporaries just in case of overwrite\n 2367 |     mov(TMP1, MemRegDest.X());\n 2368 |     mov(TMP2, MemRegSrc.X());\n 2369 |     mov(TMP3, Length.X());\n 2370 | \n 2371 |     FinalizeAddresses();","lines":8,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/JIT/MemoryOps.cpp#L2364-L2371"}]},
{"id":"LOGIC_48","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"DEF_OP(VFCopySign) handles only i64Bit and i128Bit OpSizes and hits `LOGMAN_MSG_A_FMT` / `FEX_UNREACHABLE` for i256Bit (AVX). There is no SVE256 implementation. If a 256-bit VFCopySign IR node is ever emitted (e.g. for AVX vcopysignpd/vcopysignps), the JIT will abort at runtime with an assertion rather than producing code.","fix":"Add an `i256Bit` case that uses SVE bitwise operations: generate a sign-bit mask with `dup_imm` or `not_` on a known constant, then use `bit` or `bsl` on Z registers under PRED_TMP_32B.","locations":[{"ref":"FEXCore/Source/Interface/Core/JIT/VectorOps.cpp:4726-4747","code":" 4726 | DEF_OP(VFCopySign) {\n 4727 |   auto Op = IROp->C<IR::IROp_VFCopySign>();\n 4728 |   const auto OpSize = IROp->Size;\n 4729 |   const auto SubRegSize = ConvertSubRegSize248(IROp);\n 4730 | \n 4731 |   ARMEmitter::VRegister Magnitude = GetVReg(Op->Vector1);\n 4732 |   ARMEmitter::VRegister Sign = GetVReg(Op->Vector2);\n 4733 | \n 4734 |   //  We don't assign explicity to Dst but Dst and Magniture are tied to the same register.\n 4735 |   //  Similar in semantics to C's copysignf.\n 4736 |   switch (OpSize) {\n 4737 |   case IR::OpSize::i64Bit:\n 4738 |     movi(SubRegSize, VTMP1.D(), 0x80, 24);\n 4739 |     bit(Magnitude.D(), Sign.D(), VTMP1.D());\n 4740 |     break;\n 4741 |   case IR::OpSize::i128Bit:\n 4742 |     movi(SubRegSize, VTMP1.Q(), 0x80, 24);\n 4743 |     bit(Magnitude.Q(), Sign.Q(), VTMP1.Q());\n 4744 |     break;\n 4745 |   default: LOGMAN_MSG_A_FMT(\"Unsupported element size for operation {}\", __func__); FEX_UNREACHABLE;\n 4746 |   }\n 4747 | }","lines":22,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/JIT/VectorOps.cpp#L4726-L4747"}]},
{"id":"LOGIC_49","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"GuestToHostMap::ClearCache (LookupCache.cpp line 104-109) allocates a new `BlockLinksMapType` object via `BlockLinks_pma->new_object<BlockLinksMapType>()` but never destroys the old BlockLinks object. Because BlockLinksMapType is a `std::pmr::map`, its elements hold dynamically allocated nodes. Although those nodes are backed by the monotonic buffer resource, the map's own internal node tree destructor is never called, so the map's `size` counter etc. are never cleaned up, and the MBR is never reset. On repeated cache clears the monotonic buffer accumulates stale map nodes indefinitely. The comment in the destructor acknowledges this, but the MBR is also never reset before the new object is constructed, so the old map's memory is leaked within the MBR.","fix":"Before allocating a new BlockLinksMapType, explicitly destroy the old one via `BlockLinks_pma->destroy(BlockLinks)` and then reset (or reinitialize) the monotonic_buffer_resource so its allocation pointer is returned to the start. This allows the backing buffer to be reused without unbounded growth.","locations":[{"ref":"FEXCore/Source/Interface/Core/LookupCache.cpp:104-109","code":"  104 | void GuestToHostMap::ClearCache(const LookupCacheWriteLockToken&) {\n  105 |   // Allocate a new pointer from the BlockLinks pma again.\n  106 |   BlockLinks = BlockLinks_pma->new_object<BlockLinksMapType>();\n  107 |   // All code is gone, clear the block list\n  108 |   BlockList.clear();\n  109 | }","lines":6,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/LookupCache.cpp#L104-L109"},{"ref":"FEXCore/Source/Interface/Core/LookupCache.h:80-83","code":"   80 |   fextl::pmr::named_monotonic_page_buffer_resource BlockLinks_mbr;\n   81 |   using BlockLinksMapType = std::pmr::map<BlockLinkTag, FEXCore::Context::BlockDelinkerFunc>;\n   82 |   fextl::unique_ptr<std::pmr::polymorphic_allocator<std::byte>> BlockLinks_pma;\n   83 |   BlockLinksMapType* BlockLinks;","lines":4,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/LookupCache.h#L80-L83"}]},
{"id":"LOGIC_50","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"LookupCache::InvalidateCacheRange (LookupCache.h lines 333-347) acquires its own write lock, while GuestToHostMap::InvalidateRange (LookupCache.h lines 125-137) also acquires a write lock internally. Both operate on the same WritePriorityMutex. If a caller holds either lock and then calls the other, a deadlock occurs. More importantly, InvalidateCacheRange only invalidates L1/L2 thread-local caches for the calling thread; it does not call GuestToHostMap::InvalidateRange to remove the corresponding entries from the shared L3 (BlockList) and CodePages map. The shared state remains inconsistent: entries are evicted from L1/L2 but can be re-loaded from L3 on the next lookup.","fix":"After invalidating the thread-local caches in InvalidateCacheRange, also call (or inline) the equivalent of GuestToHostMap::Erase for each affected block address so that the shared BlockList is also updated. Alternatively, ensure InvalidateCacheRange delegates to a common helper that operates on all cache levels under a single lock acquisition.","locations":[{"ref":"FEXCore/Source/Interface/Core/LookupCache.h:128-140","code":"  128 |   void InvalidateRange(uint64_t Start, uint64_t Length) {\n  129 |     auto lk = AcquireWriteLock();\n  130 | \n  131 |     auto lower = CodePages.lower_bound(Start >> 12);\n  132 |     auto upper = CodePages.upper_bound((Start + Length - 1) >> 12);\n  133 | \n  134 |     for (auto it = lower; it != upper; it++) {\n  135 |       for (const auto& Entry : it->second) {\n  136 |         Erase(Entry, lk);\n  137 |       }\n  138 |     }\n  139 |     CodePages.erase(lower, upper);\n  140 |   }","lines":13,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/LookupCache.h#L128-L140"},{"ref":"FEXCore/Source/Interface/Core/LookupCache.h:342-356","code":"  342 |   bool InvalidateCacheRange(uint64_t Start, uint64_t Length) {\n  343 |     auto lk = Shared->AcquireWriteLock();\n  344 | \n  345 |     auto lower = CachedCodePages.lower_bound(Start >> 12);\n  346 |     auto upper = CachedCodePages.upper_bound((Start + Length - 1) >> 12);\n  347 | \n  348 |     for (auto it = lower; it != upper; it++) {\n  349 |       for (const auto& Entry : it->second) {\n  350 |         InvalidateCache(Entry, lk);\n  351 |       }\n  352 |     }\n  353 |     bool ret = upper != lower;\n  354 |     CachedCodePages.erase(lower, upper);\n  355 |     return ret;\n  356 |   }","lines":15,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/LookupCache.h#L342-L356"}]},
{"id":"LOGIC_51","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"MOVSOp non-REP path stores segment_base + register + direction*size back into RSI/RDI registers, instead of only register + direction*size. MakeSegmentAddress() returns (segment_base + reg_value) and then OffsetByDir() adds the element size. The resulting value (which includes the segment base) is then stored back into the RSI/RDI general-purpose registers. This corrupts RSI/RDI in 32-bit mode whenever a non-zero segment base is in use. Compare with STOSOp (lines 3230-3231), SCASOp (lines 3564-3577), LODSOp (lines 3476-3482), and CMPSOp (lines 3341-3355) which all correctly separate the raw register load from the segment-address computation.","fix":"Save the raw register values before adding segment offsets. Replace lines 3292-3309 with: Ref Src_RSI = LoadGPRRegister(X86State::REG_RSI, AddrSize); Ref Src_RDI = LoadGPRRegister(X86State::REG_RDI, AddrSize); Ref RSI = AppendSegmentOffset(Src_RSI, Op->Flags, X86Tables::DecodeFlags::FLAG_DS_PREFIX); Ref RDI = AppendSegmentOffset(Src_RDI, 0, X86Tables::DecodeFlags::FLAG_ES_PREFIX, true); ... then offset and store Src_RSI/Src_RDI (not RSI/RDI) back, following the same pattern as LODSOp non-REP.","locations":[{"ref":"FEXCore/Source/Interface/Core/OpcodeDispatcher.cpp:3251-3268","code":" 3251 |     Ref RSI = MakeSegmentAddress(X86State::REG_RSI, Op->Flags, X86Tables::DecodeFlags::FLAG_DS_PREFIX);\n 3252 |     Ref RDI = MakeSegmentAddress(X86State::REG_RDI, 0, X86Tables::DecodeFlags::FLAG_ES_PREFIX, true);\n 3253 | \n 3254 |     if (CTX->IsMemcpyAtomicTSOEnabled()) {\n 3255 |       auto Src = _LoadMemGPRAutoTSO(Size, RSI, Size);\n 3256 | \n 3257 |       // Store to memory where RDI points\n 3258 |       _StoreMemGPRAutoTSO(Size, RDI, Src, Size);\n 3259 |     } else {\n 3260 |       auto Src = _LoadMem(RegClass::GPR, Size, RSI, Invalid(), OpSize::i8Bit, MemOffsetType::SXTX, 1);\n 3261 |       _StoreMem(RegClass::GPR, Size, Src, RDI, Invalid(), OpSize::i8Bit, MemOffsetType::SXTX, 1);\n 3262 |     }\n 3263 | \n 3264 |     RSI = OffsetByDir(RSI, IR::OpSizeToSize(Size));\n 3265 |     RDI = OffsetByDir(RDI, IR::OpSizeToSize(Size));\n 3266 | \n 3267 |     StoreGPRRegister(X86State::REG_RSI, RSI);\n 3268 |     StoreGPRRegister(X86State::REG_RDI, RDI);","lines":18,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/OpcodeDispatcher.cpp#L3251-L3268"}]},
{"id":"LOGIC_52","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In CalculateFlags_SignShiftRightImmediate (SAR immediate), for 8/16-bit operands the shift count is masked to 0x1F by GetConstantShift, so Shift can be in the range [1, 31] even for an 8-bit operation. The CF computation calls SetCFDirect(Src1, Shift - 1, true), which reads bit (Shift - 1) of Src1. This is correct only because the caller (ASHROp) sign-extends Src1 with _Sbfe before passing it. However, for a shift count of exactly SrcSizeBits (e.g., Shift=8 on 8-bit), x86 defines CF as the MSB of the sign-extended original value, and the current code reads bit 7 of the sign-extended Src1, which is correct. For Shift > SrcSizeBits (e.g., Shift=17 for 8-bit), x86 defines CF as the sign bit (same as the result), and the current code reads bit 16 of the sign-extended Src1, which is also the sign bit and thus correct. The correctness depends entirely on the sign extension performed in ASHROp; there is no guard, assertion, or comment in the flag function itself documenting this dependency. If another caller passes a non-sign-extended Src1 (as is the case for all other shift flag functions where AllowUpperGarbage is used), the CF computation would silently return garbage for Shift >= SrcSizeBits.","fix":"Add a comment in CalculateFlags_SignShiftRightImmediate explaining that Src1 must be sign-extended to at least OpSizeAsBits(SrcSize) bits before this function is called, because SetCFDirect reads bit (Shift-1) of Src1 which may exceed the operand width. Alternatively, add a static-analysis-friendly assertion or rename the parameter to signal this precondition. Consider also adding a guard: if (Shift >= IR::OpSizeAsBits(SrcSize)) { SetCFDirect(Src1, IR::OpSizeAsBits(SrcSize) - 1, true); return; } before the existing SetCFDirect call so the function is safe regardless of caller convention.","locations":[{"ref":"FEXCore/Source/Interface/Core/OpcodeDispatcher/Flags.cpp:473-491","code":"  473 | void OpDispatchBuilder::CalculateFlags_SignShiftRightImmediate(IR::OpSize SrcSize, Ref Res, Ref Src1, uint64_t Shift) {\n  474 |   // No flags changed if shift is zero\n  475 |   if (Shift == 0) {\n  476 |     return;\n  477 |   }\n  478 | \n  479 |   SetNZ_ZeroCV(SrcSize, Res);\n  480 | \n  481 |   // Extract the last bit shifted in to CF\n  482 |   SetCFDirect(Src1, Shift - 1, true);\n  483 | \n  484 |   CalculatePF(Res);\n  485 |   InvalidateAF();\n  486 | \n  487 |   // OF\n  488 |   // Only defined when Shift is 1 else undefined. Only is set if the top bit was set to 1 when\n  489 |   // shifted So it is set to zero.  In the undefined case we choose to zero as well. Since it was\n  490 |   // already zeroed there's nothing to do here.\n  491 | }","lines":19,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/OpcodeDispatcher/Flags.cpp#L473-L491"}]},
{"id":"LOGIC_53","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"FXAM (X87FXAM) classifies every non-empty x87 stack value as \"Normal\" (C3:C2:C0 = 0:1:0),\nregardless of the actual bit pattern. Intel's architecture requires distinct classifications:\n\n  C3:C2:C0 = 0:1:0  Normal finite number\n  C3:C2:C0 = 0:0:1  NaN\n  C3:C2:C0 = 0:1:1  Infinity\n  C3:C2:C0 = 1:0:0  Zero\n  C3:C2:C0 = 1:0:1  Denormal (pseudo-denormal in extended precision)\n  C3:C2:C0 = 1:1:1  Unsupported (pseudo-NaN, pseudo-Inf, etc.)\n  C3:C2:C0 = 0:0:0  Empty (handled correctly - TopValid == 0)\n\nThe code (X87.cpp:862-865) sets C2 = TopValid (1 for non-empty) and C0 = C3 (which is 0\nfor non-empty), so every finite, NaN, Inf, Zero, and Denormal value comes out as Normal.\nAny code that relies on FXAM to detect NaN (e.g., libm implementations), Infinity, or Zero\nwill silently receive wrong answers. The C1 sign bit is extracted correctly.\n\nThe comment on line 865 (\"Mirror C3 until something other than zero is supported\") is also\nmisleading - it implies only zero classification is missing, but NaN, Inf, and Denormal\nare equally unhandled.","fix":"Inspect the 80-bit bit pattern: exponent field [78:64] and integer-bit + mantissa [63:0].\nIf exp == 0x7fff: it's NaN (C3:C2:C0=0:0:1) or Infinity (integer-bit set, mantissa==0 ->\nC3:C2:C0=0:1:1). If exp == 0: it's Zero (mantissa==0, C3:C2:C0=1:0:0) or Denormal\n(C3:C2:C0=1:0:1). Otherwise: Normal (C3:C2:C0=0:1:0) or Unsupported if integer-bit clear.\nIn ReducedPrecisionMode the 64-bit double encoding follows the same structural pattern but\nwithout the explicit integer bit.","locations":[{"ref":"FEXCore/Source/Interface/Core/OpcodeDispatcher/X87.cpp:857-878","code":"  857 | void OpDispatchBuilder::X87FXAM(OpcodeArgs) {\n  858 |   auto a = _ReadStackValue(0);\n  859 |   Ref Result =\n  860 |     ReducedPrecisionMode ? _VExtractToGPR(OpSize::i64Bit, OpSize::i64Bit, a, 0) : _VExtractToGPR(OpSize::i128Bit, OpSize::i64Bit, a, 1);\n  861 | \n  862 |   // Extract the sign bit\n  863 |   Result = ReducedPrecisionMode ? _Bfe(OpSize::i64Bit, 1, 63, Result) : _Bfe(OpSize::i64Bit, 1, 15, Result);\n  864 |   SetRFLAG<FEXCore::X86State::X87FLAG_C1_LOC>(Result);\n  865 | \n  866 |   // Claim this is a normal number\n  867 |   // We don't support anything else\n  868 |   auto TopValid = _StackValidTag(0);\n  869 | \n  870 |   // In the case of top being invalid then C3:C2:C0 is 0b101\n  871 |   auto C3 = Select01(OpSize::i32Bit, CondClass::NEQ, TopValid, Constant(1));\n  872 | \n  873 |   auto C2 = TopValid;\n  874 |   auto C0 = C3; // Mirror C3 until something other than zero is supported\n  875 |   SetRFLAG<FEXCore::X86State::X87FLAG_C0_LOC>(C0);\n  876 |   SetRFLAG<FEXCore::X86State::X87FLAG_C2_LOC>(C2);\n  877 |   SetRFLAG<FEXCore::X86State::X87FLAG_C3_LOC>(C3);\n  878 | }","lines":22,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/OpcodeDispatcher/X87.cpp#L857-L878"}]},
{"id":"LOGIC_54","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"GDBJIT.cpp line 71: `strncpy(info->filename, map->SourceFile.c_str(), 511)`.\nThe `info_t` struct has a `filename` field of 512 bytes (by convention for the\nGDB JIT interface). `strncpy` with limit 511 guarantees no null terminator\nif the source string is exactly 511 characters long. The 512th byte in `filename`\nis left uninitialised (only `malloc` was used, not `calloc`), so GDB may read\ngarbage when printing the filename. Same issue applies to `blocks[i].name` at\nline 81.","fix":"Use `snprintf` instead of `strncpy`, or null-terminate the destination explicitly after the `strncpy` call: `info->filename[511] = '\\0';`.","locations":[{"ref":"FEXCore/Source/Interface/GDBJIT/GDBJIT.cpp:71","code":"   71 |     strncpy(info->filename, map->SourceFile.c_str(), 511);","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/GDBJIT/GDBJIT.cpp#L71"},{"ref":"FEXCore/Source/Interface/GDBJIT/GDBJIT.cpp:81","code":"   81 |       strncpy(blocks[i].name, SymName.c_str(), 511);","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/GDBJIT/GDBJIT.cpp#L81"}]},
{"id":"LOGIC_55","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In IRDumper.cpp (Dump function, line 392-393), the ElementSize / NumElements\nlogic is inverted relative to what is clearly intended:\n\n    if (IROp->ElementSize != OpSize::iUnsized) {\n        ElementSize = IROp->Size;       // <-- assigns Size, not ElementSize!\n    }\n\nThe condition tests ElementSize != iUnsized, but then overwrites ElementSize\nwith the register Size rather than keeping ElementSize. The intent (matching\nthe analogous block in the HasDest branch at lines 114-116) is the opposite:\nwhen ElementSize IS iUnsized, use Size instead. The same inverted pattern also\nappears in the non-HasDest branch at lines 430-432. This produces wrong type\nannotations in IR dump output for vector ops.","fix":"Change the condition from `!= OpSize::iUnsized` to `== OpSize::iUnsized` in\nboth branches (matching the logic in the HasDest branch at lines 114-116 of\nPrintArg):\n    if (IROp->ElementSize == OpSize::iUnsized) {\n        ElementSize = IROp->Size;\n    }","locations":[{"ref":"FEXCore/Source/Interface/IR/IRDumper.cpp:387-390","code":"  387 |           uint8_t NumElements = 0;\n  388 |           if (IROp->ElementSize != OpSize::iUnsized) {\n  389 |             ElementSize = IROp->Size;\n  390 |           }","lines":4,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/IR/IRDumper.cpp#L387-L390"},{"ref":"FEXCore/Source/Interface/IR/IRDumper.cpp:425-428","code":"  425 |           auto ElementSize = IROp->ElementSize;\n  426 |           if (IROp->ElementSize == OpSize::iUnsized) {\n  427 |             ElementSize = IROp->Size;\n  428 |           }","lines":4,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/IR/IRDumper.cpp#L425-L428"}]},
{"id":"LOGIC_56","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In IRValidation.cpp line 252, `HadWarning` is unconditionally reset to `false`\nimmediately before the conditional dump block that tests it:\n\n    HadWarning = false;\n    if (HadError || HadWarning) { ...\n\nThis means warnings accumulated during the pass are silently discarded and\nnever printed. Any zero-use-count node warnings (line 88-90) are effectively\ndead code as a result.","fix":"Remove the `HadWarning = false;` line (line 252). Warnings should be printed just as errors are.","locations":[{"ref":"FEXCore/Source/Interface/IR/Passes/IRValidation.cpp:250-251","code":"  250 |   HadWarning = false;\n  251 |   if (HadError || HadWarning) {","lines":2,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/IR/Passes/IRValidation.cpp#L250-L251"}]},
{"id":"LOGIC_57","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In x87StackOptimizationPass.cpp `FlushCachedRegs()` lines 619-628, the\nloop builds `ValidMask` and `InvalidMask` by iterating `TopValidCache` in\nreverse (using `rbegin`/`rend`) and shifting left. The comment at the callsite\nsays these masks represent offsets from the top of the FPU stack. However,\n`TopValidCache[i]` represents stack offset `i` (0 = top). Iterating in\nreverse and shifting left would map slot 7 to bit 0 and slot 0 to bit 7,\nwhich is the opposite of the mapping used by `getValidMask()` / `getInvalidMask()`\nin `FixedSizeStack` (lines 129-148) where bit `i` corresponds to slot `i`.\nThis means the masks fed into the rotate-right FTW update may have their\nbits in the wrong positions, corrupting the FTW register.","fix":"Either iterate forward (using begin/end) to match the bit mapping used by FixedSizeStack, or document why the reversed iteration is intentional.","locations":[{"ref":"FEXCore/Source/Interface/IR/Passes/x87StackOptimizationPass.cpp:629-639","code":"  629 |     uint8_t ValidMask = 0;\n  630 |     uint8_t InvalidMask = 0;\n  631 |     for (auto It = TopValidCache.rbegin(); It != TopValidCache.rend(); It++) {\n  632 |       ValidMask <<= 1;\n  633 |       InvalidMask <<= 1;\n  634 |       if (*It == StackSlot::VALID) {\n  635 |         ValidMask |= 1;\n  636 |       } else if (*It == StackSlot::INVALID) {\n  637 |         InvalidMask |= 1;\n  638 |       }\n  639 |     }","lines":11,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/IR/Passes/x87StackOptimizationPass.cpp#L629-L639"}]},
{"id":"LOGIC_58","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In Allocator.cpp `CollectMemoryGaps()` (line 175), the check for end-of-file\nuses a strict less-than:\n\n    if (Remaining < sizeof(Buffer) - PendingBytes) {\n        EndOfFileReached = true;\n    }\n\n`Remaining` is `ssize_t` (signed) but `sizeof(Buffer) - PendingBytes` is\n`size_t` (unsigned). When `Remaining` is 0 (empty read at EOF), the comparison\npromotes `Remaining` to `size_t` (wrapping to a large positive number) if\n`PendingBytes` is 0, making the condition false and causing an infinite loop.\nIn practice PendingBytes is 0 at a clean EOF boundary, so the loop hangs.","fix":"Cast explicitly: `if ((size_t)Remaining < sizeof(Buffer) - PendingBytes)` or compare `if (Remaining < (ssize_t)(sizeof(Buffer) - PendingBytes))`.","locations":[{"ref":"FEXCore/Source/Utils/Allocator.cpp:175","code":"  175 |       if (Remaining < sizeof(Buffer) - PendingBytes) {","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Utils/Allocator.cpp#L175"}]},
{"id":"LOGIC_59","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In FindLiveRegionForAddress and Munmap, the boundary check uses strict less-than\n(AddrEnd < RegionEnd / PtrEnd < RegionEnd) at lines 210, 225, and 461. A mapping that\nfills a region exactly to its end (AddrEnd == RegionEnd) will fail to match any live or\nreserved region. For Mmap with MAP_FIXED, the mapping would succeed via ::mmap but its\npages would not be tracked in the UsedPages bit table, leaking allocation state. For\nMunmap, the exact-end mapping would silently not be tracked as freed (returns 0 without\nclearing bits), permanently consuming FreeSpace.","fix":"Change 'AddrEnd < RegionEnd' to 'AddrEnd <= RegionEnd' in FindLiveRegionForAddress and in the Munmap loop to correctly handle mappings that end exactly at the region boundary.","locations":[{"ref":"FEXCore/Source/Utils/Allocator/64BitAllocator.cpp:207","code":"  207 |     if (Addr >= RegionBegin && AddrEnd < RegionEnd) {","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Utils/Allocator/64BitAllocator.cpp#L207"},{"ref":"FEXCore/Source/Utils/Allocator/64BitAllocator.cpp:222","code":"  222 |       if (Addr >= ReservedRegion->Base && AddrEnd < RegionEnd) {","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Utils/Allocator/64BitAllocator.cpp#L222"},{"ref":"FEXCore/Source/Utils/Allocator/64BitAllocator.cpp:458","code":"  458 |     if (RegionBegin <= PtrBegin && RegionEnd > PtrEnd) {","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Utils/Allocator/64BitAllocator.cpp#L458"}]},
{"id":"LOGIC_60","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"RunCASPAL in Arm64.cpp (line 521) returns false unconditionally for Size==1 (64-bit\nregister pairs, CASPAL with X registers). The 32-bit case (Size==0) is fully\nimplemented with both aligned and split-lock paths. But CASPAL with 64-bit pairs\n(e.g. CASP X0,X1,X2,X3,[Xn]) causes HandleCASPAL to return false, which leads to an\n'Unhandled JIT SIGBUS CASPAL' error log and returning std::nullopt to the signal handler.\nThe separate HandleCASPAL_ARMv8 function does handle the 64-bit pair case via ldaxp\nemulation, but that path is only reachable via LDAXP_INST, not directly from CASPAL.","fix":"Implement the 64-bit pair CASPAL path in RunCASPAL for Size==1, mirroring the 32-bit logic but using uint64_t types and 128-bit atomic operations for the aligned case.","locations":[{"ref":"FEXCore/Source/Utils/ArchHelpers/Arm64.cpp:338-522","code":"  338 | static bool RunCASPAL(uint64_t* GPRs, uint32_t Size, uint32_t DesiredReg1, uint32_t DesiredReg2, uint32_t ExpectedReg1,\n  339 |                       uint32_t ExpectedReg2, uint32_t AddressReg, uint32_t* StrictSplitLockMutex) {\n  340 | \n  341 |   std::optional<FEXCore::Utils::SpinWaitLock::UniqueSpinMutex<uint32_t>> Lock {};\n  342 |   if (Size == 0) {\n  343 |     // 32bit\n  344 |     uint64_t Addr = GPRs[AddressReg];\n  345 | \n  346 |     // Lower register must be even, so only upper register can be 31.\n  347 |     uint32_t DesiredLower = GPRs[DesiredReg1];\n  348 |     uint32_t DesiredUpper = DesiredReg2 == 31 ? 0 : GPRs[DesiredReg2];\n  349 | \n  350 |     uint32_t ExpectedLower = GPRs[ExpectedReg1];\n  351 |     uint32_t ExpectedUpper = ExpectedReg2 == 31 ? 0 : GPRs[ExpectedReg2];\n  352 | \n  353 |     // Cross-cacheline CAS doesn't work on ARM\n  354 |     // It isn't even guaranteed to work on x86\n  355 |     // Intel will do a \"split lock\" which locks the full bus\n  356 |     // AMD will  &= NegMask;\n  405 |         TmpExpected |= Expected;\n  406 | \n  407 |         // Set up desired\n  408 |         TmpDesired = TmpExpected;\n  409 |         TmpDesired &= NegMask;\n  410 |         TmpDesired |= Desired;\n  411 | \n  412 |         uint64_t TmpExpectedLower = TmpExpected;\n  413 |         uint64_t TmpExpectedUpper = TmpExpected >> 64;\n  414 | \n  415 |         uint64_t TmpDesiredLower = TmpDesired;\n  416 |         uint64_t TmpDesiredUpper = TmpDesired >> 64;\n  417 | \n  418 |         if (TmpExpected == TmpActual) {\n  419 |           if (StoreCAS64(TmpExpectedUpper, TmpDesiredUpper, AddrUpper)) {\n  420 |             if (StoreCAS64(TmpExpectedLower, TmpDesiredLower, Addr)) {\n  421 |               // Stored successfully\n  422 |               return true;\n  423 |             } else {\n  424 |               // CAS managed to tear, we can't really solve this\n  425 |               // Continue down the path to let the guest know values weren't expected\n  426 |               FEXCORE_TELEMETRY_SET(TYPE_CAS_128BIT_TEAR, 1);\n  427 |             }\n  428 |           }\n  429 | \n  430 |           TmpExpected = TmpExpectedUpper;\n  431 |           TmpExpected <<= 64;\n  432 |           TmpExpected |= TmpExpectedLower;\n  433 |         } else {\n  434 |           // Mismatch up front\n  435 |           TmpExpected = TmpActual;\n  436 |         }\n  437 | \n  438 |         // Not successful\n  439 |         // Now we need to check the results to see if we need to try again\n  440 |         __uint128_t FailedResultOurBits = TmpExpected & Mask;\n  441 |         __uint128_t FailedResultNotOurBits = TmpExpected & NegMask;\n  442 | \n  443 |         __uint128_t FailedDesiredOurBits = TmpDesired & Mask;\n  444 |         __uint128_t FailedDesiredNotOurBits = TmpDesired & NegMask;\n  445 |         if ((FailedResultNotOurBits ^ FailedDesiredNotOurBits) != 0) {\n  446 |           // If the bits changed that weren't part of our regular CAS then we need to try agai
